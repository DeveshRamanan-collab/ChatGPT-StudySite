        marks: 1.5
        top-band: |
          Explains why foreseeability is not enough for PEL, states the special-relationship requirement and the salient features, and notes CLA s 5.
        margin-note: |
          Clean framing — sets up both claims.
        authorities:
          - civil-liability-act-2002-nsw-s5
      - id: r2
        criterion: |
          Applies Esanda to Northpoint, including McHugh J's policy reasons
        marks: 2
        top-band: |
          Matches each Esanda factor (no request, no knowledge, no inducement, audit for shareholders) and explains the indeterminacy concern.
        margin-note: |
          A precedent this close should be used point by point.
        authorities: []
      - id: r3
        criterion: |
          Uses Anchorage to show Northpoint was not vulnerable
        marks: 1
        top-band: |
          Links Northpoint's analysts and its decision not to seek warranties to the sophisticated-party reasoning in Anchorage.
        margin-note: |
          Vulnerability is a separate salient feature — good to treat it expressly.
        authorities: []
      - id: r4
        criterion: |
          Weighs the salient features for Walter
        marks: 2
        top-band: |
          Identifies known reliance, special skill and an undertaking, the professional setting, a single identified plaintiff and vulnerability, contrasting Esanda and Tepko.
        margin-note: |
