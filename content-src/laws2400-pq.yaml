        margin-note: |
          Good use of the facts (three weeks, full width, daily).
        authorities: []
      - id: r3
        criterion: |
          Applies Walsh v Ervin to establish Mariana's title to sue via special damage
        marks: 2
        top-band: |
          Draws a precise parallel between the farmer's inconvenience in Walsh and Mariana's specific commercial losses.
        margin-note: |
          Central move in the answer — well done if clearly explained.
        authorities: []
      - id: r4
