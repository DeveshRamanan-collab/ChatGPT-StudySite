  - key: q608
    type: mcq
    concept: icj-jurisdiction-and-consent
    difficulty: 3
    stem: The tutorial says the ICJ "has no so-called compulsory jurisdiction". What does that mean?
    options:
      - text: No state can be brought before the Court unless it has consented in one of the ways in art 36.
        correct: true
        why: "Correct — the Court can only handle disputes if the parties have consented to its jurisdiction, in the specific case or a category of disputes: compromis, treaty clause, optional clause or forum prorogatum."
      - text: The Court's judgments are not compulsory, so states may disregard them freely.
        why: Tempting because "compulsory" sounds like it is about effect, but judgments are final and binding on the parties (art 60; art 94 UN Charter); the phrase concerns jurisdiction.
      - text: The Court can only give advisory opinions unless the Security Council orders otherwise.
        why: Tempting because advisory opinions do not depend on state consent, but the Court decides contentious cases whenever the states have consented; no Security Council order is needed.
  - key: q609
    type: mcq
    concept: icj-jurisdiction-and-consent
    difficulty: 4
    stem: State K has made an art 36(2) declaration. State L has never made one, has no treaty clause or compromis with K, and refuses to take part. K files against L. Does the Court have jurisdiction?
    options:
      - text: Yes — K's declaration is enough, because it accepts jurisdiction over all future legal disputes.
        why: Tempting because K's declaration is general, but it covers disputes only "with another state accepting the same obligation"; L has made no declaration, so the clause does not apply.
      - text: No — the optional clause works only between states accepting the same obligation.
        correct: true
        why: Correct — art 36(2) works only between declarants; with no compromis, treaty clause, declaration or later consent (forum prorogatum) from L, there is no basis of jurisdiction.
      - text: Yes — under art 36(6), whatever L thinks.
        why: Tempting because art 36(6) lets the Court rule on its own jurisdiction, but that is the power to decide whether consent exists; it cannot create consent that is absent.
