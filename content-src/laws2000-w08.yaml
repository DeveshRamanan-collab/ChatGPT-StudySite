  - key: q719
    type: short
    concept: provisional-measures
    difficulty: 3
    cases:
      - lagrand-case-germany-v-united-states-of-america
    prompt: The International Court of Justice (ICJ) has no so-called compulsory jurisdiction. Explain whether or not in the view of the ICJ its 'provisional measures' are binding.
    model: |-
      Issue: are provisional measures indicated by the ICJ binding on the parties? Law: art 41 ICJ Statute gives the Court
      power "to indicate, if it considers that circumstances so require, any provisional measures which ought to be taken
      to preserve the respective rights of either party". The word "indicate" left room to argue they were merely
      hortatory. In LaGrand (Germany v United States) (2001, para 102) the Court rejected that view. The object and
      purpose of the Statute is to enable the Court to fulfil its functions, in particular the judicial settlement of
      disputes by binding decisions under art 59. Art 41 is to be read in that context: it exists to prevent the Court
      being hampered because the parties' rights are not preserved. So "the power to indicate provisional measures entails
      that such measures should be binding", and the contrary contention "would be contrary to the object and purpose of
      that Article". Application: measures are indicated only where jurisdiction is not manifestly absent, the rights are
      plausible and linked to the measures, and irreparable harm is imminent; once indicated, they bind. Conclusion: in
      the ICJ's view, provisional measures are binding.
    rubric:
      - id: r1
        criterion: Issue — binding force of measures "indicated" under art 41
        marks: 1
        top-band: "Identifies why the question arises: art 41 speaks of \"indicating\" measures."
        margin-note: Why was there ever any doubt? Point to the word in art 41.
        authorities:
          - icj-statute-art-41
      - id: r2
        criterion: Law (authority) — LaGrand, para 102
        marks: 3
        top-band: Explains LaGrand's reasoning from the object and purpose of the Statute (binding settlement under art 59) and art 41 in context, quoting the key holding.
        margin-note: Give the Court's reasoning, not just its answer.
        authorities:
          - icj-statute-art-41
          - icj-statute-art-59
      - id: r3
        criterion: Application — link to consent and the conditions for measures
        marks: 2
        top-band: Connects the answer to the absence of compulsory jurisdiction and the four conditions for indicating measures.
        margin-note: How does "no compulsory jurisdiction" fit with binding measures?
        authorities: []
      - id: r4
        criterion: Conclusion
        marks: 1
        top-band: States plainly that, in the ICJ's view, provisional measures are binding.
        margin-note: Say it in one clear line.
        authorities: []
  - key: q720
    type: short
    concept: provisional-measures
    difficulty: 4
    cases:
      - lagrand-case-germany-v-united-states-of-america
    prompt: State A is a small West African country. State B is a nation in the Pacific. State A initiated proceedings in the International Court of Justice against State B. State A alleged that State B had incarcerated disproportionate numbers of a minority group, forcibly displaced large parts of the group outside the country, and enabled the destruction of villages and sacred sites in contravention of the Convention on the Prevention and Punishment of the Crime of Genocide ('the Genocide Convention'). What provisional measures could be considered?
    model: |-
      Issue: may the Court indicate provisional measures under art 41, and which? Law: the Court must be satisfied that
      (a) the absence of jurisdiction is not manifest, (b) the rights for which protection is sought are at least
      plausible, (c) there is a link between those rights and the measures requested, which must be appropriate and
      necessary, and (d) there is a real and imminent risk of irreparable harm before the final decision. Measures so
      indicated are binding (LaGrand, para 102). Application: art IX of the Genocide Convention gives a prima facie basis
      if both are parties, so the absence of jurisdiction is not manifest. A's claimed rights — that B prevent, and not
      commit, genocide (arts I–II) — are plausible on these facts. The risk is real, imminent and irreparable: killing,
      serious bodily or mental harm and the destruction of the group cannot be undone by a later judgment. Linked measures
      could require B to prevent the commission against the group of acts listed in art II, to halt the forcible
      displacements, and to stop enabling the destruction of villages and sacred sites until judgment. Conclusion: the
      Court could indicate such measures, and they would bind B.
    rubric:
      - id: r1
        criterion: Issue — whether and which provisional measures may be indicated
        marks: 1
        top-band: "Frames the question under art 41: preserve the parties' rights pending judgment."
        margin-note: Name the power you are relying on.
        authorities:
          - icj-statute-art-41
      - id: r2
        criterion: Law (authority) — the four conditions and LaGrand
        marks: 3
        top-band: States all four conditions from the slides and that measures bind (LaGrand, para 102).
        margin-note: Four conditions — and are the measures binding?
        authorities:
          - icj-statute-art-41
      - id: r3
        criterion: Application — conditions applied and measures tailored to the facts
        marks: 3
        top-band: Applies each condition to the facts (art IX prima facie jurisdiction, plausible arts I–II rights, irreparable harm to the group) and proposes measures linked to those rights.
        margin-note: Are your measures tied to the rights claimed, or just a wish list?
        authorities:
          - genocide-convention-art-ix
          - genocide-convention-arts-i-iii
      - id: r4
        criterion: Conclusion
        marks: 1
        top-band: Concludes on the measures likely to be indicated and their binding effect on B.
        margin-note: Finish by saying what the Court would order and its effect.
        authorities: []
  - key: q801
    type: mcq
    concept: regional-and-economic-dispute-settlement
    difficulty: 1
    stem: Which UN Charter article addresses regional arrangements and the pacific settlement of local disputes?
    options:
      - text: Art 52
        correct: true
        why: "Correct — art 52 UN Charter: regional arrangements or agencies may deal with matters appropriate for regional action, and members shall make every effort to settle local disputes through them first."
      - text: Art 94
        why: Tempting because it is a Charter dispute article this week, but art 94 obliges compliance with ICJ decisions and gives the Security Council a role on non-compliance.
      - text: Art 96
        why: Tempting because it is a Charter article this week, but art 96 concerns requests by UN organs and agencies for ICJ advisory opinions.
      - text: Art 2(4)
        why: Tempting because regional bodies address security, but art 2(4) is the prohibition on the threat or use of force, not regional settlement.
  - key: q802
    type: mcq
    concept: regional-and-economic-dispute-settlement
    difficulty: 2
    stem: Under art 52(2), members in regional arrangements shall make every effort to settle local disputes through them when?
    options:
      - text: Before referring them to the Security Council
        correct: true
        why: "Correct — art 52(2): members \"shall make every effort to achieve pacific settlement of local disputes through such regional arrangements or by such regional agencies before referring them to the Security Council\"."
      - text: Only after the Security Council has failed to act
        why: Tempting because the Security Council has primary responsibility for security, but art 52(2) puts regional settlement first, before referral to the Council.
      - text: Only once the ICJ has declined jurisdiction
        why: Tempting because judicial settlement is another means, but art 52(2) says nothing about the ICJ; it puts regional efforts before Security Council referral.
  - key: q803
    type: mcq
    concept: regional-and-economic-dispute-settlement
    difficulty: 2
    stem: Art 52(1) permits regional arrangements provided what?
    options:
      - text: Every member of the arrangement is also a permanent member of the Security Council.
        why: Tempting because the Security Council has primary responsibility, but art 52(1) imposes no membership condition; it requires consistency with UN Purposes and Principles.
      - text: Their activities are consistent with the Purposes and Principles of the UN.
        correct: true
        why: "Correct — art 52(1): nothing precludes regional arrangements or agencies \"provided that such arrangements or agencies and their activities are consistent with the Purposes and Principles of the United Nations\"."
      - text: They have been approved in advance by the International Court of Justice.
        why: Tempting because the ICJ is the UN's judicial organ, but art 52 requires no court approval; the condition is consistency with the Purposes and Principles.
  - key: q804
    type: mcq
    concept: regional-and-economic-dispute-settlement
    difficulty: 2
    stem: What role does art 52(3) give the Security Council regarding regional settlement?
    options:
      - text: It shall review and confirm every regional settlement before it takes effect.
        why: Tempting because the Council has supervisory powers elsewhere, but art 52(3) asks it to encourage regional settlement, not to confirm each settlement.
      - text: It shall take over any local dispute not settled regionally within six months.
        why: Tempting because the Council can deal with disputes, but art 52 sets no time limit; it encourages regional settlement.
      - text: It shall encourage pacific settlement of local disputes through them.
        correct: true
        why: "Correct — art 52(3): the Security Council \"shall encourage the development of pacific settlement of local disputes\" through regional arrangements, on the states' initiative or by its reference."
  - key: q805
    type: mcq
    concept: regional-and-economic-dispute-settlement
    difficulty: 2
