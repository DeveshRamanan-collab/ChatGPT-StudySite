  - key: q401
    type: mcq
    concept: international-arbitration
    difficulty: 1
    stem: On what principle is international arbitration founded?
    options:
      - text: Consent
        correct: true
        why: "Correct — the slides: international arbitration is \"founded upon the principle of CONSENT\", given by treaty for future disputes or by special agreement (compromis) after a dispute arises."
      - text: Reciprocity
        why: Tempting because reciprocity matters for optional-clause declarations at the ICJ, but the slides found arbitration on consent, not on reciprocity.
      - text: Compulsory jurisdiction
        why: Tempting because awards are binding, but no state can be forced into arbitration without consent; there is no compulsory arbitral jurisdiction in the materials.
      - text: Precedent
        why: Tempting because international lawyers cite earlier decisions, but the doctrine of precedent does not exist in international law; arbitration rests on consent.
  - key: q402
    type: mcq
    concept: international-arbitration
    difficulty: 2
    stem: What is a compromis?
    options:
      - text: A special agreement to submit a particular dispute, after it has arisen, to arbitration.
        correct: true
        why: "Correct — the slides: a \"special agreement\" (compromis) whereby the parties agree to submit a particular dispute to arbitration after it has arisen; art 36 uses the same device for the ICJ."
      - text: A clause in a treaty agreeing in advance to arbitrate any future disputes under that treaty.
        why: Tempting because it is the other way of consenting, but a treaty clause covering future disputes is what the lecturer called a compromissory clause, not a compromis.
      - text: A settlement the parties reach by mutual concessions during negotiation.
        why: Tempting because of the everyday word "compromise", but a compromis is an agreement to submit a dispute to a tribunal, not the terms of a negotiated settlement.
  - key: q403
    type: mcq
    concept: international-arbitration
    difficulty: 2
    stem: Which of these is NOT one of the ways states "maintain close control" over arbitration, according to the slides?
    options:
      - text: Choosing the composition — the number and identity of the arbitrators
        why: Tempting to doubt because judges are usually independent, but the slides list composition — number and identity — as the first element of state control.
      - text: Choosing the rules to be applied, such as a specific treaty or national law
        why: Tempting to doubt because tribunals apply law, but the slides say states choose the rules to be applied, e.g. a specific treaty or national law.
      - text: Choosing to keep the proceedings confidential
        why: Tempting to doubt because courts sit in public, but the slides say states "may choose to keep proceedings confidential" in arbitration.
      - text: Choosing whether the final award will bind them
        correct: true
        why: "Correct — this is not a matter of choice: the slides say arbitral awards are final and binding upon the parties; control extends to composition, rules and confidentiality."
  - key: q404
    type: mcq
    concept: international-arbitration
    difficulty: 2
    contrasts-with:
      - icj-cases-and-effect-of-decisions
    stem: How do arbitral tribunals differ from the ICJ in their permanence?
    options:
      - text: Arbitral tribunals are ad hoc (temporary); the ICJ is a standing court with 15 judges.
        correct: true
        why: "Correct — the slides: \"Arbitral tribunals are ad hoc/temporary\", while the ICJ is the principal judicial organ of the UN with 15 regular judges elected for nine years."
      - text: Arbitral tribunals are permanent; the ICJ is reconstituted for each new case.
        why: Tempting if you mix the two up, but it is the ICJ that is permanent (15 judges, nine-year terms); arbitral tribunals are set up for a particular dispute.
      - text: Both are permanent, but arbitral tribunals sit only in The Hague.
        why: Tempting because the ICJ is in The Hague, but arbitral tribunals are ad hoc and temporary; their composition and procedure are chosen by the parties.
  - key: q405
    type: mcq
    concept: international-arbitration
    difficulty: 2
    stem: Which example do the slides give of a treaty providing for arbitration of future disputes?
    options:
      - text: UNCLOS
        correct: true
        why: Correct — the slides give UNCLOS as the example of consent by "becoming party to a treaty … that provides for arbitration in the case of future disputes".
      - text: The Genocide Convention
        why: Tempting because it has a dispute clause, but art IX of the Genocide Convention (tutorial) refers disputes to the International Court of Justice, not to arbitration.
      - text: The Vienna Convention on Diplomatic Relations
        why: Tempting because it is a treaty from Week 6, but it is not the slides' example; the slides give UNCLOS for treaty-based consent to arbitration.
  - key: q406
    type: mcq
    concept: international-arbitration
    difficulty: 3
    stem: State A and State B have a treaty with no dispute clause. A dispute arises and they want arbitration. How can they consent?
    options:
      - text: By concluding a compromis to submit this particular dispute to arbitration.
        correct: true
        why: "Correct — the slides give two routes: a treaty providing for future disputes, or a special agreement (compromis) to submit a particular dispute after it has arisen."
      - text: "They cannot: consent to arbitration can only be given in a treaty before the dispute arises."
        why: Tempting because treaty clauses are common, but the slides expressly allow consent after a dispute has arisen, through a special agreement (compromis).
      - text: By asking the General Assembly to refer it to arbitration.
        why: Tempting because the General Assembly can request ICJ advisory opinions, but arbitration needs the parties' own consent; the GA cannot refer a dispute to arbitration.
  - key: q407
    type: mcq
    concept: international-arbitration
    difficulty: 1
    stem: What is the legal effect of an arbitral award?
    options:
      - text: It is final and binding upon the parties.
        correct: true
        why: "Correct — the slides: the final decisions, \"termed Arbitral Awards\", are final and binding upon the parties, unlike the outcome of the diplomatic modes."
      - text: It is a recommendation the parties may use as a basis for further negotiation.
        why: Tempting because that describes a conciliation report, but arbitration is adjudicatory; the award is final and binding, not a basis for further negotiation.
      - text: It binds only after the ICJ confirms it on appeal.
        why: Tempting because domestic systems have appeals, but nothing in the materials subjects awards to ICJ confirmation; awards are final and binding when made.
  - key: q408
    type: mcq
    concept: international-arbitration
    difficulty: 3
    contrasts-with:
      - icj-cases-and-effect-of-decisions
    stem: Which feature do arbitration and ICJ contentious proceedings share?
    options:
      - text: Both rest on the consent of the states and produce decisions binding on the parties.
        correct: true
        why: Correct — arbitration is founded on consent and its awards are final and binding; the ICJ's jurisdiction also rests on consent, and its judgments bind the parties.
      - text: Both let the parties choose every judge and keep the proceedings fully confidential.
        why: Tempting because that is true of arbitration, but at the ICJ the 15 judges are elected; the parties may in principle appoint only an ad hoc judge.
      - text: Both are permanent bodies whose judges are elected by the General Assembly.
        why: Tempting because ICJ judges are elected, but arbitral tribunals are ad hoc and composed by the parties; they are not permanent elected courts.
  - key: q409
    type: mcq
    concept: international-arbitration
    difficulty: 2
    stem: Why can arbitration be faster than other adjudication, according to the slides?
    options:
      - text: Its procedural rules are flexible and set by the parties.
        correct: true
        why: Correct — the slides note arbitration's procedural rules mean "it can be faster and more flexible", because the states shape the process and the rules applied.
      - text: It has no written proceedings, only a single oral hearing.
        why: Tempting because speed suggests fewer steps, but the materials do not say arbitration lacks written proceedings; its speed comes from flexible procedure chosen by the parties.
      - text: Its awards cannot be the subject of later disputes.
        why: Tempting because awards are final, but finality is about effect, not speed; the slides attribute speed to flexible procedural rules.
  - key: q410
    type: mcq
    concept: international-arbitration
    difficulty: 1
    stem: In the lecturer's typical example of a three-member arbitral tribunal, how are the arbitrators chosen?
    options:
      - text: Each party chooses one arbitrator, and the third is agreed.
        correct: true
        why: "Correct — the lecturer said tribunals often have three arbitrators: usually each party elects one, and they agree on the third — part of the states' control over composition."
      - text: All three are elected by the Security Council and the General Assembly.
        why: Tempting because that is how ICJ judges are elected, but arbitral composition is in the parties' hands; that is the point of the control states keep.
      - text: All three are appointed by the President of the ICJ from a standing list.
        why: "Tempting because some systems use appointing authorities, but the materials describe party choice: one each, plus an agreed third."
  - key: q411
    type: mcq
    concept: international-arbitration
    difficulty: 3
    cases:
      - south-china-sea-arbitration-philippines-v-china
    stem: The lecturer's example of arbitration under UNCLOS was the South China Sea arbitration. What did it show?
    options:
      - text: "Treaty-based consent in action: the Philippines' claim against China under UNCLOS."
        correct: true
        why: Correct — the lecturer used the Philippines' claim against China under UNCLOS, decided in the Philippines' favour, to show treaty-based consent to arbitration in action.
      - text: That arbitral tribunals can give advisory opinions to the General Assembly.
        why: Tempting because advisory opinions are discussed this week, but those come from the ICJ at the request of UN organs; arbitration decides disputes between the parties.
      - text: That arbitral awards are not binding where the losing state rejects the tribunal's reasoning.
        why: Tempting because a losing state may refuse to accept an award, but the slides say awards are final and binding on the parties regardless of disagreement with them.
  - key: q412
    type: mcq
    concept: international-arbitration
    difficulty: 2
    stem: Two states agree to arbitrate a contract dispute and specify that a particular national law will govern. Is that permissible?
    options:
      - text: Yes — the parties may choose the rules to be applied, e.g. a specific treaty or national law.
        correct: true
        why: Correct — the slides list the "rules to be applied (e.g., specific treaty, national law, etc.)" as one of the elements of close control states keep over arbitration.
      - text: No — arbitral tribunals must apply art 38(1) of the ICJ Statute and nothing else.
        why: "Tempting because art 38(1) lists the sources the ICJ applies, but arbitration is flexible: the parties may choose the applicable rules, including national law."
      - text: No — only the UN Security Council can authorise the application of national law.
        why: Tempting because the Security Council has powers over disputes, but the choice of applicable law in arbitration belongs to the parties.
  - key: q413
    type: mcq
    concept: international-arbitration
    difficulty: 3
    stem: Where does arbitration sit in the lecture's order from the most flexible to the most rigid modes?
    options:
      - text: Among the adjudicatory modes, just before courts such as the ICJ.
        correct: true
        why: "Correct — the lecture runs from negotiation through the diplomatic modes to the adjudicatory ones: arbitration first, then international courts such as the ICJ, one step closer to a court."
      - text: At the flexible end, before negotiation, because the parties control everything.
        why: Tempting because states keep close control, but arbitration is adjudicatory and binding; negotiation sits at the flexible end of the lecture's order.
      - text: At the rigid end, after the ICJ, because its awards cannot be appealed.
        why: Tempting because awards are final, but the lecture ends with adjudication before international courts and tribunals; arbitration is more flexible than the ICJ.
  - key: q414
    type: mcq
    concept: international-arbitration
    difficulty: 2
    stem: "A state that wants its boundary dispute resolved in a binding way but kept out of the public eye would most likely prefer:"
    options:
      - text: Arbitration, where the parties may choose to keep proceedings confidential.
        correct: true
        why: Correct — the slides say states may choose to keep arbitral proceedings confidential, and the award is final and binding — both features the state wants.
      - text: ICJ advisory proceedings, which are confidential and binding on the parties.
        why: Tempting because the ICJ is authoritative, but advisory opinions are requested by UN organs, not states, and they are non-binding.
      - text: Mediation, which is confidential and whose outcome binds the parties.
        why: Tempting because mediation is typically confidential, but the mediator's solutions are not binding; the state wants a binding result.
  - key: q415
    type: mcq
    concept: international-arbitration
    difficulty: 4
    variant-of: q406
    stem: A bilateral treaty between States P and Q says any dispute "concerning the interpretation or application of this Treaty shall be submitted to arbitration". A dispute arises. Must Q agree afresh before P can arbitrate?
    options:
      - text: Yes — consent to arbitration can only be given once a particular dispute exists.
        why: Tempting because a compromis is given after a dispute arises, but the slides also accept consent given in advance by becoming party to a treaty providing for arbitration.
      - text: No — by becoming party to the treaty, Q has already consented to arbitrate such disputes.
        correct: true
        why: "Correct — the slides: consent can be given \"by becoming party to a treaty (bilateral or multilateral) that provides for arbitration in the case of future disputes\"."
      - text: No — but P must first obtain the Security Council's approval to arbitrate.
        why: Tempting because the Security Council has dispute roles, but consent here comes from the treaty; no approval is required to invoke an agreed arbitration clause.
  - key: q416
    type: mcq
    concept: international-arbitration
    difficulty: 2
    stem: What are the final decisions of arbitral tribunals called?
    options:
      - text: Arbitral awards
        correct: true
        why: "Correct — the slides: the judgments or final decisions are \"termed Arbitral Awards\", and they are final and binding upon the parties."
      - text: Advisory opinions
        why: Tempting because they are a kind of judicial output, but advisory opinions are given by the ICJ at the request of UN organs, and they are non-binding.
      - text: Provisional measures
        why: Tempting because they are a judicial output, but provisional measures are interim orders (art 41 ICJ Statute) to preserve rights pending a final decision.
      - text: Conciliation reports
        why: Tempting because conciliation also ends in a document, but a conciliation report contains non-binding recommendations; an arbitral tribunal makes an award.
  - key: q417
    type: truefalse
    concept: international-arbitration
    difficulty: 1
    set: quickfire
    statement: Arbitral awards are final and binding upon the parties.
    answer: true
