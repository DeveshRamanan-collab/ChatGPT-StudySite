  - key: q619
    type: short
    concept: icj-jurisdiction-and-consent
    difficulty: 3
    prompt: The International Court of Justice (ICJ) has no so-called compulsory jurisdiction. Explain under what circumstances the ICJ has jurisdiction to settle an interstate dispute, including the ways in which states can consent to the Court's jurisdiction.
    model: |-
      Issue: when can the ICJ hear a contentious case between states, given that it has no compulsory jurisdiction? Law:
      only sovereign states may be parties (art 34 ICJ Statute); international organisations, including the UN, cannot be
      parties but can ask for advisory opinions (arts 65–68). Jurisdiction rests on the consent of states — to the
      specific case or to a category of disputes it falls within. Art 36 gives four ways: (1) a special agreement
      (compromis) submitting a particular dispute; (2) becoming party to a treaty specifying that disputes can be brought
      before the Court, often once other means have failed — e.g. art IX of the Genocide Convention; (3) a declaration
      under art 36(2) accepting jurisdiction over future legal disputes with another state accepting the same obligation
      (the optional clause); and (4) forum prorogatum, where a state that had not consented when the application was filed
      consents afterwards. A legal dispute must also exist at the date proceedings are instituted. Application: find the
      route the facts supply and check that it covers this dispute. Conclusion: if a route is satisfied the Court has
      jurisdiction, and it decides any disagreement about that itself (art 36(6)).
    rubric:
      - id: r1
        criterion: Issue — jurisdiction rests on consent, not compulsion
        marks: 1
        top-band: "Explains what \"no compulsory jurisdiction\" means: no state can be taken to the Court without its consent."
        margin-note: What does "no compulsory jurisdiction" actually mean for a respondent?
        authorities: []
      - id: r2
        criterion: Law (authority) — access and the four ways of consenting
        marks: 4
        top-band: States that only states may be parties (art 34), then explains the compromis, treaty clause, art 36(2) optional clause (reciprocity) and forum prorogatum, plus compétence de la compétence (art 36(6)).
        margin-note: Four ways — you have three. Which is missing?
        authorities:
          - icj-statute-art-34
          - icj-statute-art-36
      - id: r3
        criterion: Application — the other jurisdictional conditions
        marks: 2
        top-band: Adds that a legal dispute must exist at the date of filing and that consent must cover this dispute and both parties, with an example such as art IX of the Genocide Convention.
        margin-note: Consent alone is not enough — what else must exist at filing?
        authorities:
          - genocide-convention-art-ix
      - id: r4
        criterion: Conclusion
        marks: 1
        top-band: "Draws the threads together: jurisdiction exists only where a consent route covers the dispute, as decided by the Court itself."
        margin-note: Wrap it up in one sentence.
        authorities: []
  - key: q620
    type: short
    concept: icj-jurisdiction-and-consent
    difficulty: 4
    cases:
      - south-west-africa-ethiopia-v-south-africa-liberia-v-south-africa
      - interpretation-of-peace-treaties-with-bulgaria-hungary-and-romania
      - application-of-the-international-convention-on-the-elimination-of-all-forms-of-racial-discrimination-georgia-v-russian-federation
    prompt: State A is a small West African country. State B is a nation in the Pacific. State A initiated proceedings in the International Court of Justice against State B. State A alleged that State B had incarcerated disproportionate numbers of a minority group, forcibly displaced large parts of the group outside the country, and enabled the destruction of villages and sacred sites in contravention of the Convention on the Prevention and Punishment of the Crime of Genocide ('the Genocide Convention'). Discuss the jurisdiction issues the ICJ will need to consider.
    model: |-
      Issue: does the ICJ have jurisdiction over A's application against B? Access: both are states (art 34 ICJ Statute).
      Consent: nothing suggests a compromis or optional clause declarations, so the likely basis is a treaty clause under
      art 36. Art IX of the Genocide Convention submits disputes between the Contracting Parties "relating to the
      interpretation, application or fulfilment" of the Convention, to the ICJ "at the request of any of the parties to
      the dispute". The Court must confirm both are Contracting Parties and that A's claims (incarceration, forced
      displacement, destroyed villages and sacred sites) relate to the Convention, e.g. as art II acts done with intent to
      destroy the group. Existence of a dispute: A must show that, before filing, its claim was positively opposed by B
      and that B was aware, or could not have been unaware, of this (South West Africa); denial alone would not suffice
      (Peace Treaties); the Court examines the facts (Georgia v Russia). A is not directly affected, but Week 7 noted that
      genocide breaches an obligation owed to all states. Conclusion: if both are parties and a dispute existed at filing,
      art IX founds jurisdiction, as the Court will itself decide (art 36(6)).
    rubric:
      - id: r1
        criterion: Issue — identifies access, consent and the existence of a dispute as the jurisdiction questions
        marks: 1
        top-band: "Frames the three questions in order: are both parties states, what is the basis of consent, and did a dispute exist at filing?"
        margin-note: Set out the jurisdiction questions before answering them.
        authorities: []
      - id: r2
        criterion: Law (authority) — art 34, art 36 and art IX of the Genocide Convention
        marks: 3
        top-band: Explains that consent here comes from a treaty clause (art 36) and quotes art IX's scope ("interpretation, application or fulfilment", "at the request of any of the parties"), with the dispute test from South West Africa.
        margin-note: Which words of art IX carry the jurisdiction?
        authorities:
          - icj-statute-art-34
          - icj-statute-art-36
          - genocide-convention-art-ix
      - id: r3
        criterion: Application — the facts against art IX and the dispute test
        marks: 3
        top-band: Checks that both states are parties, links the alleged acts to arts II–III, and identifies what evidence would show B knew its views were positively opposed before filing.
        margin-note: Did A ever put its claim to B before going to The Hague?
        authorities:
          - genocide-convention-arts-i-iii
      - id: r4
        criterion: Conclusion
        marks: 1
        top-band: States a clear, conditional conclusion on jurisdiction and notes the Court decides any disagreement itself (art 36(6)).
        margin-note: Conclude — and say what the Court would need to be satisfied of.
        authorities: []
  - key: q701
    type: mcq
    concept: provisional-measures
    difficulty: 1
    set: pretest
    stem: What are provisional measures under art 41 of the ICJ Statute meant to do?
    options:
      - text: Preserve either party's rights so the final decision is not rendered meaningless.
        correct: true
        why: Correct — art 41 allows measures "to preserve the respective rights of either party"; the slides say they protect against actions that could render the court's decision meaningless.
      - text: Decide the merits quickly where the facts are not in dispute between the parties.
        why: Tempting because they come early, but provisional measures do not decide the merits; they preserve rights pending the final decision.
      - text: Penalise a state that has refused to appear before the Court in the case.
        why: Tempting because the Court can order states to act, but provisional measures are protective, not punitive; they preserve rights pending judgment.
  - key: q702
    type: mcq
    concept: provisional-measures
    difficulty: 2
    stem: At the provisional measures stage, what must the Court be satisfied of regarding jurisdiction?
    options:
      - text: That the absence of jurisdiction is not manifest.
        correct: true
        why: "Correct — the slides: the Court \"only needs to satisfy itself that a) the absence of jurisdiction is not manifest\" — a lower threshold than deciding jurisdiction finally."
      - text: That it definitely has jurisdiction over the merits, after full argument.
        why: Tempting because jurisdiction must eventually be established, but at this stage the Court only needs to be satisfied that the absence of jurisdiction is not manifest.
      - text: That the respondent has expressly consented to the request for measures.
        why: Tempting because consent founds jurisdiction, but no separate consent to the request is required; the question is whether the absence of jurisdiction is manifest.
  - key: q703
    type: mcq
    concept: provisional-measures
    difficulty: 2
    stem: What standard must the rights for which protection is sought meet?
    options:
      - text: They must be proved on the balance of probabilities.
        why: "Tempting because claims usually need proof, but the slides set a lower standard at this stage: the rights must be at least plausible."
      - text: They must be at least plausible.
        correct: true
        why: "Correct — the slides: the Court must be satisfied that \"the rights for which protection is sought are at least plausible\"."
      - text: They must already have been upheld in an earlier judgment.
        why: Tempting because rights are usually established by judgment, but provisional measures come before any judgment; plausibility is enough.
  - key: q704
    type: mcq
    concept: provisional-measures
    difficulty: 2
    stem: Which risk justifies provisional measures, according to the slides?
    options:
      - text: A real and imminent risk of irreparable harm before the final decision is given.
        correct: true
        why: "Correct — the slides: provisional measures \"are only justified if there is a real and imminent risk that irreparable harm will occur before the final decision is given\"."
      - text: Any risk that the respondent's conduct may cause the applicant some financial loss.
        why: Tempting because loss is harm, but the slides require a real and imminent risk of irreparable harm; ordinary, compensable loss is not enough.
      - text: A risk that the case will take more than two years to decide on the merits.
        why: Tempting because delay is the reason measures exist, but length of proceedings alone does not justify them; there must be a real and imminent risk of irreparable harm.
  - key: q705
    type: mcq
    concept: provisional-measures
    difficulty: 2
    stem: What link must exist for provisional measures to be indicated?
    options:
      - text: Between the applicant and the Security Council's earlier resolutions on the matter.
        why: Tempting because the Security Council can act on non-compliance with judgments, but the slides require a link between the rights claimed and the measures sought.
      - text: Between the rights for which protection is sought and the measures requested.
        correct: true
        why: "Correct — the slides: there must be a link between the rights for which protection is sought and the measures requested; measures must be appropriate and necessary to protect the alleged rights."
      - text: Between the measures requested and the respondent's own domestic law.
        why: Tempting because measures operate within the respondent state, but domestic law is irrelevant to the link requirement, which concerns rights claimed and measures requested.
  - key: q706
    type: mcq
    concept: provisional-measures
    difficulty: 1
    cases:
      - lagrand-case-germany-v-united-states-of-america
    stem: In LaGrand (2001), what did the ICJ decide about provisional measures indicated under art 41?
    options:
      - text: They are binding.
        correct: true
        why: "Correct — LaGrand, para 102: the power to indicate provisional measures \"entails that such measures should be binding\"; the contrary contention would defeat art 41's object and purpose."
      - text: They are recommendations only.
        why: Tempting because art 41 says "indicate" rather than "order", but in LaGrand the Court held that reading would be contrary to the object and purpose of art 41.
      - text: They bind only if the Security Council endorses them.
        why: Tempting because the Security Council may act under art 94(2) on judgments, but LaGrand grounds the binding force of provisional measures in the Statute itself.
  - key: q707
    type: mcq
    concept: provisional-measures
    difficulty: 3
    cases:
      - lagrand-case-germany-v-united-states-of-america
    stem: How did the Court reason in LaGrand that provisional measures are binding?
    options:
      - text: From the Statute's object and purpose, and the terms of art 41 read in context.
        correct: true
        why: "Correct — para 102: the Statute's object and purpose is to enable the Court to fulfil its functions, notably binding judicial settlement (art 59); art 41 in context prevents the Court being hampered, so measures bind."
      - text: From state practice showing states had always complied with measures indicated in earlier cases.
        why: Tempting because custom builds on practice (Week 2), but LaGrand's reasoning rests on the object and purpose of the Statute and the terms of art 41 in context.
      - text: From art 94 UN Charter, which lists provisional measures as binding.
        why: Tempting because art 94 concerns compliance with the Court, but the slides do not rely on it for provisional measures; LaGrand reasons from the Statute's object and purpose.
  - key: q708
    type: mcq
    concept: provisional-measures
    difficulty: 3
    stem: State C asks the ICJ to order State D to halt the demolition of a site of cultural importance scheduled for next week, pending judgment. Which condition is most clearly met on these facts?
    options:
      - text: A real and imminent risk of irreparable harm before the final decision.
        correct: true
        why: "Correct — demolition next week threatens harm that cannot be undone before judgment: a real and imminent risk of irreparable harm, as the slides require."
      - text: A final determination that D has violated C's rights under the treaty.
        why: Tempting because the merits matter, but provisional measures do not need a final determination; the rights need only be plausible at this stage.
      - text: D's express consent to the specific measures that C has requested.
        why: Tempting because consent founds jurisdiction, but the respondent need not consent to measures; the Court indicates them if the conditions are met.
  - key: q709
    type: mcq
    concept: provisional-measures
    difficulty: 3
    contrasts-with:
      - icj-jurisdiction-and-consent
    stem: State E asks for provisional measures against State F, but neither has accepted the Court's jurisdiction in any form, and F rejects the case. What is the likely outcome?
    options:
      - text: Measures refused — the absence of jurisdiction is manifest.
        correct: true
        why: Correct — the Court must at least be satisfied that the absence of jurisdiction is not manifest; with no compromis, treaty clause, declaration or forum prorogatum, it is manifest.
      - text: Measures indicated — jurisdiction is irrelevant now.
        why: "Tempting because the threshold is low, but it is not zero: the first condition is that the absence of jurisdiction is not manifest."
      - text: Measures indicated — the Court may protect rights even where it plainly lacks jurisdiction.
        why: Tempting because measures aim to protect rights, but the Court acts within its jurisdiction; where jurisdiction is manifestly absent it cannot indicate measures.
  - key: q710
    type: mcq
    concept: provisional-measures
    difficulty: 2
    stem: State G seeks measures preventing State H from (i) flooding a disputed valley pending judgment and (ii) holding unrelated national elections. Which request is likely to fail the link condition?
    options:
      - text: The elections request, which has no link to the rights claimed.
        correct: true
        why: Correct — the slides require a link between the rights for which protection is sought and the measures requested; measures must be appropriate and necessary to protect the alleged rights.
      - text: The flooding request, because flooding can later be reversed by drainage.
        why: Tempting because irreparability matters, but the flooding measure is linked to the rights in the valley; the link problem lies with the unrelated elections.
      - text: Neither — the Court grants whatever is requested.
        why: Tempting because the Court has a wide power, but it must ensure the measures are appropriate and necessary to protect the alleged rights, so unrelated requests fail.
  - key: q711
    type: mcq
    concept: provisional-measures
    difficulty: 3
    contrasts-with:
      - icj-cases-and-effect-of-decisions
    stem: How do provisional measures differ from a judgment on the merits?
    options:
      - text: They are interim orders preserving rights until judgment; the judgment finally decides the dispute.
        correct: true
        why: Correct — provisional measures are incidental proceedings protecting the parties' rights until judgment; the judgment on the merits is final and without appeal (art 60).
      - text: They are non-binding, whereas the judgment on the merits is binding.
        why: Tempting because art 41 says "indicate", but LaGrand held provisional measures binding; the difference is interim versus final, not binding versus non-binding.
      - text: They bind third states, whereas the judgment binds only the parties.
        why: Tempting if you reverse the rules, but nothing makes provisional measures bind third states; they preserve the rights of the parties.
  - key: q712
    type: mcq
    concept: provisional-measures
    difficulty: 4
    variant-of: q706
    cases:
      - lagrand-case-germany-v-united-states-of-america
    stem: "A respondent argues: \"Art 41 only says the Court may indicate measures, so they are merely hortatory.\" What is the best reply?"
    options:
      - text: LaGrand rejected that contention as contrary to the object and purpose of art 41.
        correct: true
        why: "Correct — LaGrand, para 102: \"The contention that provisional measures indicated under Article 41 might not be binding would be contrary to the object and purpose of that Article.\""
      - text: The respondent is right; only measures endorsed by the Security Council bind.
        why: Tempting because art 94(2) involves the Security Council, but that concerns judgments; LaGrand found provisional measures binding by reason of the Statute itself.
      - text: The respondent is right, but measures become binding once the merits judgment is given.
        why: Tempting because judgments bind, but measures preserve rights before judgment; if they bound only afterwards, they could not protect the rights pending decision.
  - key: q713
    type: mcq
    concept: provisional-measures
    difficulty: 2
    stem: Where in the ICJ's procedure do provisional measures sit?
    options:
      - text: Incidental proceedings — interim protection (Rules of Court arts 73–78)
        correct: true
        why: Correct — the slides list interim protection (arts 73–78 of the Rules) first among the incidental proceedings, alongside preliminary objections, counter-claims, intervention and discontinuance.
      - text: Oral proceedings on the merits (Rules of Court arts 54–72)
        why: Tempting because a hearing may be held, but the slides class interim protection as an incidental proceeding (arts 73–78), not part of the oral proceedings.
      - text: Institution of proceedings (Rules of Court arts 38–43)
        why: Tempting because measures are often requested at the start, but institution of proceedings (arts 38–43) is how a case begins; interim protection is incidental.
  - key: q714
    type: mcq
    concept: provisional-measures
    difficulty: 3
    variant-of: q708
    stem: State J asks for provisional measures to stop State K exporting a product that J says breaches a trade treaty, claiming lost sales that could later be compensated. Which condition is J most likely to fail?
    options:
      - text: Plausibility of the rights claimed
        why: Tempting because J's case may be weak, but plausibility is a low bar; nothing in the facts suggests the treaty right is implausible.
      - text: A real and imminent risk of irreparable harm
        correct: true
        why: Correct — lost sales that can later be compensated are not irreparable; the slides require a real and imminent risk that irreparable harm will occur before the final decision.
      - text: Prima facie jurisdiction under a treaty dispute clause
        why: Tempting because jurisdiction is always checked, but the treaty may contain a dispute clause; the facts point most clearly to the absence of irreparable harm.
  - key: q715
    type: mcq
    concept: provisional-measures
    difficulty: 1
    stem: Art 41 ICJ Statute gives the Court the power to do what?
    options:
      - text: Indicate provisional measures to preserve the respective rights of either party
        correct: true
        why: "Correct — art 41: \"The Court shall have the power to indicate, if it considers that circumstances so require, any provisional measures which ought to be taken to preserve the respective rights of either party.\""
      - text: Construe a judgment whose meaning or scope is disputed by a party
        why: Tempting because it is a power in the Statute, but construing a disputed judgment is art 60, not art 41.
      - text: Rule on its own jurisdiction when the parties disagree about it
        why: Tempting because it is another of the Court's powers, but compétence de la compétence is art 36(6); art 41 concerns provisional measures.
  - key: q716
    type: truefalse
