  - key: q810
    type: mcq
    concept: regional-and-economic-dispute-settlement
    difficulty: 2
    stem: Which instrument do the slides cite for ASEAN's commitment to settling disputes by peaceful means?
    options:
      - text: The Treaty of Amity and Cooperation in Southeast Asia, art 2(d) and Chapter IV
        correct: true
        why: "Correct — the slides cite the Treaty of Amity and Cooperation in Southeast Asia: art 2(d), settlement of differences or disputes by peaceful means, and Chapter IV, pacific settlement (arts 13–17)."
      - text: The Constitutive Act of the African Union, art 4(e)
        why: Tempting because it also reiterates peaceful settlement, but the Constitutive Act is the African Union's founding instrument, not ASEAN's.
      - text: The Convention on Conciliation and Arbitration within the OSCE
        why: Tempting because it is a regional settlement treaty, but it belongs to the OSCE in Europe and created the Court of Conciliation and Arbitration in Geneva.
  - key: q811
    type: mcq
    concept: regional-and-economic-dispute-settlement
    difficulty: 2
    stem: Under which instrument are WTO disputes settled, according to the slides?
    options:
      - text: Annex 2 of the WTO Agreement
        correct: true
        why: "Correct — the slides: Annex 2 of the WTO Agreement, the Understanding on rules and procedures governing the settlement of disputes."
      - text: Art XI of the WTO rules, the general prohibition on non-tariff barriers
        why: Tempting because art XI is a WTO rule on the slides, but it is a substantive rule — the general prohibition on non-tariff barriers — not the dispute settlement instrument.
      - text: Art 33(1) UN Charter, applied by WTO arbitrators
        why: Tempting because art 33(1) lists peaceful means, but WTO disputes go through the WTO's own Understanding in Annex 2 of the WTO Agreement.
  - key: q812
    type: mcq
    concept: regional-and-economic-dispute-settlement
    difficulty: 2
    stem: Which pair are the WTO's non-discrimination principles listed on the slides?
    options:
      - text: Most-favoured-nation treatment and national treatment
        correct: true
        why: Correct — the slides list non-discrimination as "Most Favoured Nations Treatment" and "National Treatment".
      - text: Reciprocity and proportionality
        why: Tempting because both are familiar legal ideas, but the slides list non-discrimination as most-favoured-nation treatment and national treatment.
      - text: Fixed tariff ceilings and the prohibition of non-tariff barriers
        why: Tempting because these are WTO rules on the slides, but they are the separate rules on tariffs (art II and schedules) and non-tariff barriers (art XI), not non-discrimination.
  - key: q813
    type: mcq
    concept: regional-and-economic-dispute-settlement
    difficulty: 3
    stem: According to the slides, how does the WTO deal with tariffs and non-tariff barriers?
    options:
      - text: A complete ban on tariffs (art II) and fixed upper limits on non-tariff barriers (art XI)
        why: "Tempting because it uses the right articles, but it reverses them: tariffs are capped, not banned, while non-tariff barriers are generally prohibited."
      - text: Tariffs capped (art II and schedules); non-tariff barriers generally prohibited (art XI)
        correct: true
        why: "Correct — the slides: \"Reduction of Tariffs — fixed upper limits on tariffs (Art. II + Schedule)\" and a \"General Prohibition on non-tariff barriers (art. XI)\"."
      - text: Tariffs are set case by case in disputes under Annex 2 of the WTO Agreement
        why: Tempting because disputes are handled under Annex 2, but tariff limits are fixed in the schedules, not set case by case.
  - key: q814
    type: mcq
    concept: regional-and-economic-dispute-settlement
    difficulty: 3
    stem: Two ASEAN members have a border dispute that may endanger regional peace. Under art 52(2) UN Charter, what should they do first?
    options:
      - text: Make every effort to settle it regionally before referring it to the Security Council.
        correct: true
        why: Correct — art 52(2) asks members of regional arrangements to make every effort to settle local disputes regionally first; ASEAN's Treaty of Amity provides for peaceful settlement (art 2(d), Chapter IV).
      - text: Refer it at once to the Security Council, which must handle every security dispute.
        why: Tempting because the Security Council handles threats to peace, but art 52(2) puts regional settlement first, before referral to the Council.
      - text: Submit it to the ICJ, since regional bodies cannot deal with security matters at all.
        why: Tempting because the ICJ is the UN's court, but art 52(1) allows regional arrangements to deal with peace and security matters appropriate for regional action.
  - key: q815
    type: mcq
    concept: regional-and-economic-dispute-settlement
    difficulty: 2
    stem: How do the slides describe the OSCE?
    options:
      - text: 22 members, headquartered in Cairo, established in 1945
        why: "Tempting because the figures come from Part C, but they describe the Arab League: established in 1945, headquartered in Cairo, 22 members."
      - text: 57 participating states; the largest regional security organisation
        correct: true
        why: "Correct — the slides: the OSCE has 57 participating states and is the largest regional security organisation, with members from North America, Europe and Asia."
      - text: A treaty-based court of 15 judges sitting in The Hague
        why: Tempting because it is also a dispute body, but that describes the ICJ (15 judges, The Hague), not the OSCE.
  - key: q816
    type: mcq
    concept: regional-and-economic-dispute-settlement
    difficulty: 1
    stem: Which were the founding members of the Arab League, according to the slides?
    options:
      - text: All 22 current members, which joined together in 1945
        why: "Tempting because the League now has 22 members, but the slides list seven founding members in 1945: Egypt, Iraq, Lebanon, Saudi Arabia, Syria, Transjordan and Yemen."
      - text: Egypt, Iraq, Lebanon, Saudi Arabia, Syria, Transjordan, Yemen
        correct: true
        why: "Correct — the slides list the founding members: Egypt, Iraq, Lebanon, Saudi Arabia, Syria, Transjordan and Yemen."
      - text: Egypt alone, with every other member joining after 1945
        why: "Tempting because the League is headquartered in Cairo, but the slides list seven founding members, not Egypt alone: Egypt was joined by Iraq, Lebanon, Saudi Arabia, Syria, Transjordan and Yemen."
  - key: q817
    type: truefalse
    concept: regional-and-economic-dispute-settlement
    difficulty: 1
    set: quickfire
    statement: Art 52 UN Charter precludes regional arrangements from dealing with matters of international peace and security.
    answer: false
    why: False — art 52(1) says nothing in the Charter precludes regional arrangements dealing with peace and security matters appropriate for regional action, if consistent with UN Purposes and Principles.
  - key: q818
    type: truefalse
    concept: regional-and-economic-dispute-settlement
    difficulty: 2
    set: quickfire
    statement: Under the Arab League Charter, Council decisions taken by a unanimous vote bind all member states.
    answer: true
    why: "True — art 7: decisions of the Council taken by a unanimous vote are binding on all member states; majority decisions bind only those that accept them."
  - key: q819
    type: truefalse
    concept: regional-and-economic-dispute-settlement
    difficulty: 2
    statement: WTO disputes are settled under Annex 2 of the WTO Agreement, the Understanding on rules and procedures governing the settlement of disputes.
    answer: true
    why: True — the slides name Annex 2 of the WTO Agreement, the Understanding on rules and procedures governing the settlement of disputes, as the WTO's dispute settlement instrument.
  - key: q820
    type: match
    concept: regional-and-economic-dispute-settlement
    difficulty: 2
    prompt: Match each regional organisation to its dispute-settlement provision on the slides.
    pairs:
      - left: Organization of American States
        right: "Chapter V, arts 24–27: pacific settlement of disputes"
      - left: Arab League
        right: "Art 5: no recourse to force; the Council mediates"
      - left: ASEAN
        right: Treaty of Amity and Cooperation, art 2(d) and Chapter IV
      - left: OSCE
        right: Court of Conciliation and Arbitration, Geneva (1992 Convention)
