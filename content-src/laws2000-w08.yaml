      - text: Geneva, Switzerland
        why: Tempting because many international bodies sit in Geneva, including the OSCE's Court of Conciliation and Arbitration (Part C), but the ICJ sits in The Hague.
      - text: New York, United States
        why: Tempting because the UN headquarters is in New York, but its principal judicial organ, the ICJ, is based in The Hague.
  - key: q514
    type: mcq
    concept: icj-cases-and-effect-of-decisions
    difficulty: 3
    contrasts-with:
      - icj-jurisdiction-and-consent
    stem: A human rights NGO wants the ICJ to rule that a former minister personally committed war crimes. What is the obstacle?
    options:
      - text: The ICJ hears disputes between states only; it does not try individuals.
        correct: true
        why: Correct — the lecturer stressed that only states bring contentious cases and that the ICJ does not decide whether someone is personally responsible for war crimes; art 34 bars non-state entities.
      - text: The NGO must first get a GA advisory opinion confirming the crimes.
        why: Tempting because advisory opinions come from UN organs, but they answer legal questions; they do not determine individual criminal guilt, and an NGO cannot trigger one.
      - text: The NGO must wait until the minister's state accepts the optional clause under art 36(2).
        why: Tempting because the optional clause is a route to consent, but it operates between states; it gives no standing to an NGO or jurisdiction over individuals.
  - key: q515
    type: mcq
    concept: icj-cases-and-effect-of-decisions
