    stem: State A sues State B, relying on a long internal report A wrote but never sent or published, setting out its claim. B had no way of knowing about it. What is the main problem for A?
    options:
      - text: B was not aware, and could not have been aware, that its views were positively opposed.
        correct: true
        why: Correct — South West Africa requires that the respondent "was aware, or could not have been unaware" that its views were positively opposed; an unsent internal report gives B no such awareness.
      - text: "A's report is inadmissible: only UN documents can prove a dispute."
        why: Tempting because evidence matters, but there is no rule limiting proof to UN documents; the problem is that nothing was communicated to B.
      - text: "There is no problem: the low threshold means an applicant's own belief in a dispute is enough."
        why: "Tempting because the threshold is low, but low is not nil: the claim must be positively opposed and the respondent must have been aware, which requires some communication."
  - key: q110
    type: mcq
    concept: existence-of-a-dispute
    difficulty: 3
    contrasts-with:
