      - text: They are provisional until the Security Council endorses them.
        why: Tempting because the Security Council may act under art 94(2), but only to give effect to a judgment if a party fails to comply; no endorsement is needed.
      - text: They bind all states but may be appealed to a full bench of 15 judges.
        why: Tempting because the Court has 15 judges, but there is no appeal (art 60), and judgments bind only the parties, not all states.
  - key: q518
    type: truefalse
    concept: icj-cases-and-effect-of-decisions
    difficulty: 1
    set: quickfire
    statement: ICJ judgments in contentious cases are final and without appeal.
