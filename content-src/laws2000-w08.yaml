    stem: Both states have accepted the ICJ's jurisdiction under the optional clause. Can the respondent still object that the Court lacks jurisdiction?
    options:
      - text: No — once both have made art 36(2) declarations, the Court's jurisdiction cannot be contested.
        why: Tempting because consent is the core of jurisdiction, but consent is not the only requirement; if no dispute existed at the date of institution, the Court has no jurisdiction anyway.
      - text: Yes — it may argue that no dispute existed when the proceedings were instituted.
        correct: true
        why: Correct — the existence of a dispute is a separate jurisdictional requirement, which is why respondents often deny that a dispute exists, even where consent is in place.
      - text: Yes — but only by withdrawing its art 36(2) declaration after the application has been filed.
        why: "Tempting because consent is the obvious target, but the materials point to a different and common objection: denying that any dispute existed at the date of filing."
  - key: q111
    type: mcq
    concept: existence-of-a-dispute
    difficulty: 1
    stem: Where, according to the lecturer, do you find the test for whether an international dispute exists?
    options:
      - text: In art 36 of the ICJ Statute.
        why: Tempting because art 36 deals with jurisdiction, but it sets out how states consent; the lecturer said treaty law gives no guidance on whether a dispute exists.
      - text: In the case law — Mavrommatis, Peace Treaties, South West Africa and later cases.
        correct: true
        why: Correct — the lecturer said you won't find guidance in treaty law; you have to look at a number of cases, from Mavrommatis (PCIJ) through South West Africa and Georgia v Russia.
      - text: In art 31 of the Vienna Convention on the Law of Treaties.
        why: Tempting because art 31 is the treaty interpretation rule from Week 3, but it does not define a dispute; the test comes from the PCIJ and ICJ cases.
      - text: In UN General Assembly Resolution 53/101 (1998).
        why: Tempting because it is a GA resolution covered this week, but Resolution 53/101 sets principles for negotiation, not a test for when a dispute exists.
  - key: q112
    type: mcq
    concept: existence-of-a-dispute
    difficulty: 2
    stem: Why, according to the lecturer, is it "not that rare" for a respondent to claim there is no dispute?
    options:
      - text: Because a dispute is a condition of jurisdiction, so denying it may stop the case.
        correct: true
        why: Correct — the lecturer explained that courts like the ICJ need a dispute to have jurisdiction, so a respondent who fears an adverse judgment will often argue that none exists.
      - text: Because admitting a dispute would itself breach art 2(3) UN Charter's duty to settle peacefully.
        why: Tempting because art 2(3) is about disputes, but having a dispute is not a breach; the obligation is to settle disputes by peaceful means, an obligation of conduct.
      - text: Because a dispute, once admitted, obliges both parties to accept the ICJ's compulsory jurisdiction.
        why: Tempting because it links dispute and jurisdiction, but the ICJ has no compulsory jurisdiction; admitting a dispute does not supply consent under art 36.
  - key: q113
    type: mcq
    concept: existence-of-a-dispute
    difficulty: 3
    variant-of: q109
    cases:
