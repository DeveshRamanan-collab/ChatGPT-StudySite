      - text: Arts 2(3) and 33(1) UN Charter
        why: Tempting because these frame the duty to settle disputes, but they concern the obligation and means of peaceful settlement, not the effect of judgments.
      - text: Arts 41 and 43(1) ICJ Statute
        why: Tempting because they are ICJ Statute provisions this week, but art 41 concerns provisional measures and art 43(1) written and oral proceedings.
  - key: q516
    type: mcq
    concept: icj-cases-and-effect-of-decisions
    difficulty: 4
    variant-of: q506
    cases:
      - chagos-islands-case
    stem: The General Assembly asks the ICJ for an advisory opinion about a territory administered by State U. U objects that the opinion would bind it without its consent. What is the best response?
    options:
      - text: "The objection is misconceived: advisory opinions are non-binding, though they carry weight."
        correct: true
        why: Correct — the slides say advisory proceedings are non-binding; as the lecturer said of Chagos, they still carry considerable weight as the view of the UN's principal judicial organ.
      - text: "The objection succeeds: an opinion affecting U needs U's consent under art 36."
        why: Tempting because consent governs contentious cases, but an advisory opinion binds no one, so the premise of U's objection is wrong; art 36 concerns contentious jurisdiction.
      - text: "The objection succeeds: only the Security Council may request advisory opinions."
        why: Tempting because the Security Council can request opinions, but the General Assembly can too (art 96) — Chagos was requested by the General Assembly.
  - key: q517
    type: mcq
    concept: icj-cases-and-effect-of-decisions
    difficulty: 2
    stem: Which statement about ICJ judgments in contentious cases is correct?
    options:
