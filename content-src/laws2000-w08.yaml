      - north-sea-continental-shelf-cases
    authorities:
      - un-charter-art-33-1
      - unga-resolution-53-101
    verify: false
    body: |-
      The diplomatic (non-adjudicatory) modes leave the outcome in the parties' hands: none of them produces a binding
      result.

      1. **Negotiation** — the parties retain control without third parties; the most common mode and usually the first
         step. GA Resolution 53/101 (1998): good faith, a constructive atmosphere, and refraining from conduct that might
         undermine the negotiations. It presupposes "a genuine attempt … to engage in discussions … with a view to
         resolving the dispute" (*North Sea Continental Shelf*, para 85).
      2. **Good offices** — a neutral third party trusted by both sides offers to facilitate efforts to enter into direct
         negotiations (e.g. the UN good offices mission in Lebanon).
      3. **Mediation** — the third party takes a more direct role and suggests a framework of settlement or possible
         solutions (Richard Holbrooke, Bosnian War); the solutions are not binding.
      4. **Inquiry or fact-finding** — when parties disagree over the facts; usually a non-binding report (UN Commission
         of Inquiry in Syria; the Joint Investigation Team on the 2014 shooting down of a Malaysian Airlines plane over
         Ukraine, which held Russia responsible).
      5. **Conciliation** — a third party (e.g. a group of experts) reports on the facts and the parties' positions and
         suggests a solution, with non-binding recommendations (Timor-Leste and Australia, Timor Sea boundary, under
         UNCLOS).

      The modes are often combined — e.g. mediation with fact-finding.

      Exam use: identify the mode by the third party's role — none, facilitating, proposing, finding facts, or reporting
      recommendations — and remember that none of them binds.
  - slug: international-arbitration
    title: International arbitration
    visual: diagram
    visual-brief: "Two consent gates (a treaty clause for future disputes, a compromis for an existing one) open onto a tribunal whose three dials — composition, applicable rules, confidentiality — sit in the states' hands, ending in a sealed \"award: final and binding\"; a faint ICJ outline beside it shows which dials a standing court takes away."
    related:
      - icj-cases-and-effect-of-decisions
      - icj-jurisdiction-and-consent
    depends-on:
      - obligation-of-peaceful-settlement
      - laws2000-w01-sovereign-equality-and-consent
    contrasts-with:
      - diplomatic-modes-of-settlement
      - icj-cases-and-effect-of-decisions
    cases:
      - south-china-sea-arbitration-philippines-v-china
    authorities:
      - un-charter-art-33-1
    verify: false
    body: |-
      Arbitration is the first of the adjudicatory modes and, like all of them, is founded upon the principle of consent.
      Consent can be given:

      - by becoming party to a treaty (bilateral or multilateral) that provides for arbitration of future disputes — e.g.
        UNCLOS; or
      - through a special agreement (*compromis*) by which the parties submit a particular dispute to arbitration after it
        has arisen.

      States maintain close control over the whole process:

      1. **Composition** — the number and identity of the arbitrators (often three: one chosen by each party, the third
         agreed between them);
      2. **Rules to be applied** — e.g. a specific treaty or national law;
      3. **Confidentiality** — they may choose to keep proceedings confidential.

      Procedural rules are flexible, so arbitration can be faster. Arbitral tribunals are ad hoc (temporary), unlike a
      standing court. And unlike the diplomatic modes, the final decisions — arbitral awards — are final and binding upon
      the parties. The lecturer's example: the South China Sea arbitration, brought by the Philippines against China under
      UNCLOS.

      Exam use: when comparing arbitration with the ICJ, line them up on consent, who chooses the judges, which rules
      apply, confidentiality and permanence — and note that both bind the parties.
  - slug: icj-cases-and-effect-of-decisions
    title: The ICJ — contentious cases, advisory opinions and the effect of decisions
    visual: diagram
    visual-brief: "Two lanes leaving the ICJ (15 judges, 9-year terms): a contentious lane, entered only by states, ending in a judgment that is final, without appeal and binding on the two parties alone (third states outside the fence), with an art 94 path to the Security Council for non-compliance; and an advisory lane, entered by UN organs and agencies, ending in a weighty but non-binding opinion (Chagos)."
    related:
      - icj-jurisdiction-and-consent
      - provisional-measures
      - laws2000-w04-self-determination-and-secession
    depends-on:
      - laws2000-w02-judicial-decisions-and-scholarly-writings
      - laws2000-w02-article-38-and-sources-of-international-law
    contrasts-with:
      - international-arbitration
      - provisional-measures
    cases:
      - chagos-islands-case
    authorities:
      - icj-statute-art-34
      - un-charter-art-96
      - icj-statute-art-60
      - icj-statute-art-59
      - un-charter-art-94
    verify: false
    body: |-
      The ICJ is the principal judicial organ of the UN, based in The Hague. It has 15 regular judges elected by the
      Security Council and the General Assembly for 9-year terms; disputing parties may in principle appoint an ad hoc
      judge. Precedent does not exist in international law, yet its "case law" is cited as if it were common law.

      Two types of case:

      - **Contentious cases** — legal disputes between states, submitted by them. Only states may be parties (art 34 ICJ
        Statute); the Court does not decide individual criminal responsibility. Binding between the parties only.
      - **Advisory proceedings** — legal questions referred by UN organs and specialised agencies (art 96 UN Charter; art
        65 ICJ Statute). Non-binding, but weighty — e.g. the *Chagos* opinion requested by the General Assembly.

      Proceedings are written and oral (art 43(1) ICJ Statute), with incidental proceedings such as provisional measures.

      **Effect of judgments.** Art 60: "The judgment is final and without appeal"; if its meaning or scope is disputed,
      the Court construes it at a party's request. It binds only the parties and cannot oblige third parties (arts 59,
      61). Art 94 UN Charter obliges members to comply; if a party does not, the other may go to the Security Council,
      which can make recommendations or decide on measures to give effect to the judgment (art 94(2)).

      Exam use: say whether the proceeding is contentious or advisory before saying whether it binds anyone — and whom.
  - slug: icj-jurisdiction-and-consent
    title: ICJ jurisdiction — access and the four ways to consent (art 36)
    visual: simulation
    visual-brief: Pick the applicant and respondent (state, organisation, NGO), then flip four consent switches — compromis, treaty clause covering this dispute, art 36(2) declarations by both, later consent (forum prorogatum) — and a "dispute existed at filing" switch; the jurisdiction verdict updates at once and names the route that carries it, or the missing piece.
    related:
      - provisional-measures
      - icj-cases-and-effect-of-decisions
      - laws2000-w07-invocation-of-responsibility
    depends-on:
      - existence-of-a-dispute
      - laws2000-w01-sovereign-equality-and-consent
    contrasts-with:
      - existence-of-a-dispute
    cases: []
    authorities:
      - icj-statute-art-34
      - icj-statute-art-36
      - genocide-convention-art-ix
    verify: false
    body: |-
      The ICJ has no so-called compulsory jurisdiction. Two questions come first.

      **Access.** Only sovereign states may be parties in cases before the Court; non-state entities cannot bring a case
      (art 34). International organisations, including the UN, cannot be parties but can ask for advisory opinions (arts
      65–68).

      **Consent.** Like any international judicial or arbitral body, the Court's jurisdiction rests on the consent of
      states — to the specific case, or to a category of disputes the case falls within. Art 36 gives four ways:

      1. **Special agreement (*compromis*)** — the parties agree to submit a particular dispute to the Court.
      2. **Treaty clause** — becoming party to a treaty specifying that disputes can be brought before the Court,
         contingent on the parties being unable to resolve them by other means (e.g. art IX of the Genocide Convention).
      3. **Optional clause (art 36(2))** — a declaration accepting jurisdiction over future legal disputes with another
         state accepting the same obligation.
      4. ***Forum prorogatum*** — a state that had not consented when the application was filed against it consents
         afterwards.

      The Court rules on its own jurisdiction (*compétence de la compétence*, art 36(6)). And a dispute must exist at the
      date proceedings are instituted.

      Exam use: name the consent route the facts supply, check that it covers this dispute and both parties, then confirm
      that a dispute existed at filing.
  - slug: provisional-measures
    title: Provisional measures (art 41) and LaGrand
    visual: simulation
    visual-brief: An applicant's request passes four switchable conditions — absence of jurisdiction not manifest, rights at least plausible, a link between rights and measures, a real and imminent risk of irreparable harm — and the order is indicated only when all four hold; a LaGrand toggle then shows the order as binding, not hortatory.
    related:
      - icj-jurisdiction-and-consent
      - icj-cases-and-effect-of-decisions
    depends-on:
      - icj-jurisdiction-and-consent
    contrasts-with:
      - icj-cases-and-effect-of-decisions
    cases:
      - lagrand-case-germany-v-united-states-of-america
    authorities:
      - icj-statute-art-41
      - icj-statute-art-59
      - genocide-convention-arts-i-iii
    verify: false
    body: |-
      Art 41 ICJ Statute: the Court "shall have the power to indicate, if it considers that circumstances so require, any
      provisional measures which ought to be taken to preserve the respective rights of either party." They protect
      disputing states from actions that could render the final decision meaningless.

      Conditions (the Court need not finally decide jurisdiction or the merits):

      1. **Prima facie jurisdiction** — the absence of jurisdiction is not manifest.
      2. **Plausible rights** — the rights for which protection is sought are at least plausible.
      3. **Link** — between those rights and the measures requested; the measures must be appropriate and necessary to
         protect the alleged rights.
      4. **Urgency** — a real and imminent risk that irreparable harm will occur before the final decision is given.

      **Binding?** Yes. In *LaGrand (Germany v United States)* (2001, para 102) the Court reasoned from the object and
      purpose of the Statute — to enable judicial settlement of disputes by binding decisions (art 59) — that art 41
      exists so the Court is not hampered because the parties' rights are not preserved. The power to indicate provisional
      measures "entails that such measures should be binding"; the contrary contention "would be contrary to the object
      and purpose of that Article".

      Exam use: run the four conditions against the facts, propose measures tied to the rights claimed, and state that
      they bind (*LaGrand*).
  - slug: regional-and-economic-dispute-settlement
    title: Regional organisations and WTO dispute settlement
    visual: diagram
    visual-brief: Art 52 UN Charter as a hub with an arrow "regional first, then the Security Council", spoked to five regional bodies (AU, OAS, Arab League, Europe/OSCE, ASEAN), each tagged with its quoted provision, and a separate WTO track running from its substantive rules (tariff ceilings, non-tariff barriers, non-discrimination) into Annex 2.
    related:
      - obligation-of-peaceful-settlement
      - laws2000-w04-international-organisations-definition-and-personality
      - laws2000-w01-general-and-specialized-international-law
    depends-on:
      - obligation-of-peaceful-settlement
      - diplomatic-modes-of-settlement
    contrasts-with: []
    cases: []
    authorities:
      - un-charter-art-33-1
      - un-charter-art-52
      - african-union-psc-protocol-art-4
      - oas-charter-arts-24-25
      - charter-of-the-arab-league-arts-5-7
      - treaty-of-amity-and-cooperation-in-southeast-asia-art-2
      - wto-dispute-settlement-understanding
    verify: false
    body: |-
      Art 33(1) UN Charter includes "resort to regional agencies or arrangements". Art 52 permits regional arrangements
      consistent with the UN's Purposes and Principles; members "shall make every effort to achieve pacific settlement of
      local disputes" through them "before referring them to the Security Council", and the Security Council shall
      encourage this (art 52(1)–(3)).

      - **African Union** — Peace and Security Council Protocol, art 4: peaceful settlement of disputes and conflicts;
        early responses to contain crises before they become full-blown conflicts.
      - **OAS (1948)** — arts 24–25: disputes between members go to listed peaceful procedures — direct negotiation, good
        offices, mediation, investigation and conciliation, judicial settlement, arbitration, and any the parties agree.
      - **Arab League** — art 5: no recourse to force between members; the Council mediates disputes that may lead to war.
        Art 7: unanimous decisions bind all; majority decisions bind only those that accept them.
      - **Europe** — the Council of Europe's European Convention for the Peaceful Settlement of Disputes; the OSCE's Court
        of Conciliation and Arbitration in Geneva (1992); NATO.
      - **ASEAN** — Treaty of Amity and Cooperation, art 2(d): settlement by peaceful means; Chapter IV (arts 13–17).

      **WTO.** Fixed upper limits on tariffs (art II and schedules), a general prohibition on non-tariff barriers (art
      XI), and non-discrimination (most-favoured-nation and national treatment). Disputes go through Annex 2 of the WTO
      Agreement, the Understanding on Rules and Procedures Governing the Settlement of Disputes.

      Exam use: for a local or trade dispute, name the regional or WTO route (art 52).
cases:
  - slug: mavrommatis-palestine-concessions-greece-v-great-britain
    name: Mavrommatis Palestine Concessions (Greece v Great Britain)
    citation: (Judgment No 2) [1924] PCIJ Series A 11
    aglc: Mavrommatis Palestine Concessions (Greece v Great Britain) (Judgment No 2) [1924] PCIJ Series A 11
    facts: |-
      A judgment of the Permanent Court of International Justice, the predecessor of the International Court of Justice,
      in proceedings between Greece and Great Britain. The Week 8 materials cite it only for its definition of a legal
      dispute.
    issue: What is a legal dispute between states for the purposes of international adjudication?
    held: A legal dispute is "a disagreement on a point of law or fact, a conflict of legal views or interests between persons".
    ratio: A dispute exists where there is a disagreement on a point of law or fact, or a conflict of legal views or interests, between the parties (for international adjudication, mostly states).
    significance: |-
      The classic starting definition of a dispute, still applied by the ICJ; the lecturer noted that a legal dispute
      usually concerns whether a provision applies or has been violated, assessed on the facts and context.
    why-here: The starting definition when a respondent argues that no dispute exists, so the Court lacks jurisdiction.
    verify: false
  - slug: interpretation-of-peace-treaties-with-bulgaria-hungary-and-romania
    name: Interpretation of Peace Treaties with Bulgaria, Hungary and Romania
    citation: (First Phase) (Advisory Opinion) [1950] ICJ Rep 65
    aglc: Interpretation of Peace Treaties with Bulgaria, Hungary and Romania, First Phase (Advisory Opinion) [1950] ICJ Rep 65
    facts: An ICJ advisory opinion on the interpretation of the peace treaties with Bulgaria, Hungary and Romania. The Week 8 materials extract only its statements on whether a dispute exists (at 74).
    issue: Can a state defeat the existence of an international dispute simply by denying that one exists?
    held: "\"Whether there exists an international dispute is a matter for objective determination\", and \"the mere denial of the existence of a dispute does not prove its non-existence\" (at 74)."
    ratio: The existence of a dispute is determined objectively by the Court; a party's denial is not decisive.
    significance: Prevents a respondent escaping a case merely by saying there is no dispute — which, the lecturer said, would make it far too easy to get out of a case.
    why-here: Answers the respondent who simply denies that any dispute exists.
    verify: false
  - slug: south-west-africa-ethiopia-v-south-africa-liberia-v-south-africa
    name: South West Africa (Ethiopia v South Africa; Liberia v South Africa)
    citation: (Preliminary Objections) (Judgment) [1962] ICJ Rep 328
    aglc: South West Africa (Ethiopia v South Africa; Liberia v South Africa) (Preliminary Objections) (Judgment) [1962] ICJ Rep 328
    facts: |-
      Ethiopia and Liberia brought proceedings against South Africa before the ICJ. At the preliminary objections stage
      the Court had to consider whether a dispute existed between the parties; the Week 8 materials extract only that
      test.
    issue: What must be shown for a dispute to exist between the applicant and the respondent?
    held: |-
      A dispute exists when it is demonstrated that the two sides "hold clearly opposite views" with respect to the issue
      in question — when "the claim of one party is positively opposed by the other" and "the respondent was aware, or
      could not have been unaware, that its views were 'positively opposed' by the applicant".
    ratio: "A dispute requires clearly opposite views: positive opposition of one party's claim by the other, of which the respondent was or could not have been unaware."
    significance: The core objective test for the existence of a dispute; the lecture adds that it requires more than mere friction and some communication between the parties, though the threshold is low.
    why-here: Supplies the test — positive opposition plus awareness — applied whenever the existence of a dispute is contested.
    verify: false
  - slug: marshall-islands-v-united-kingdom
    name: Marshall Islands v United Kingdom
    citation: ICJ, 2016
    aglc: Marshall Islands v United Kingdom (ICJ, 2016)
    facts: |-
      Proceedings brought by the Marshall Islands against the United Kingdom before the ICJ. The slides give only the
      short name and year ("Marshall Island vs UK ICJ, 2016"), and cite it on the existence of a dispute.
    issue: Whether a dispute existed between the parties.
    held: Cited on the slides, with South West Africa, for the need for communication between the parties showing that their views are opposed.
    ratio: For a dispute to exist, the opposed views must be shown through some communication between the parties.
    significance: Illustrates that the objective test for a dispute needs communication; the lecturer mentioned the point was also made in South West Africa. The full title and report citation are not in the materials.
    why-here: Authority for the communication requirement when testing whether a dispute exists.
    verify: true
  - slug: application-of-the-international-convention-on-the-elimination-of-all-forms-of-racial-discrimination-georgia-v-russian-federation
    name: Application of the International Convention on the Elimination of All Forms of Racial Discrimination (Georgia v Russian Federation)
    citation: (Preliminary Objections) (Judgment) [2011] ICJ Rep 70
    aglc: Application of the International Convention on the Elimination of All Forms of Racial Discrimination (Georgia v Russian Federation) (Preliminary Objections) (Judgment) [2011] ICJ Rep 70
    facts: |-
      Georgia brought proceedings against the Russian Federation under the International Convention on the Elimination of
      All Forms of Racial Discrimination. The Week 8 materials extract only the Court's statement on how the existence of
      a dispute is determined.
    issue: How does the Court determine whether a dispute exists between the parties?
    held: The determination of the existence of a dispute between the parties "requires an examination of the facts" (para 30).
    ratio: Whether a dispute exists is decided on an examination of the facts — public statements and other diplomatic exchanges between the parties.
    significance: |-
      The slides pair it with the evidence the Court looks at: public statements and diplomatic exchanges; bilateral
      exchanges showing conflicting claims are usually the strongest evidence of a territorial dispute.
    why-here: Tells you what evidence to examine — statements, notes, conduct — when proving a dispute.
    verify: false
  - slug: lagrand-case-germany-v-united-states-of-america
    name: LaGrand Case (Germany v United States of America)
    citation: "[2001] ICJ"
    aglc: LaGrand Case (Germany v United States of America) [2001] ICJ
    facts: |-
      Proceedings brought by Germany against the United States before the ICJ. The slides quote only the Court's reasoning
      on whether provisional measures indicated under art 41 of the ICJ Statute are binding (para 102).
    issue: Are provisional measures indicated by the ICJ under art 41 of its Statute binding?
    held: |-
      Yes. "The object and purpose of the Statute is to enable the Court to fulfil the functions provided for therein,
      and, in particular, the basic function of judicial settlement of international disputes by binding decisions in
      accordance with Article 59 of the Statute." Art 41 is to prevent the Court from being hampered because the parties'
      rights are not preserved, so "the power to indicate provisional measures entails that such measures should be
      binding"; the contention that they might not be binding "would be contrary to the object and purpose of that
      Article" (para 102).
    ratio: Provisional measures indicated under art 41 are binding, as follows from the object and purpose of the Statute and the terms of art 41 read in context.
    significance: Settles the debate created by the word "indicate" in art 41; tutorial question 1(b) asks exactly whether, in the ICJ's view, its provisional measures are binding.
    why-here: The authority that provisional measures bind the parties.
    verify: false
