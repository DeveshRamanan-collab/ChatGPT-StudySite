  - slug: genocide-convention-arts-i-iii
    title: Convention on the Prevention and Punishment of the Crime of Genocide arts I–III
    kind: treaty
    text: |-
      Art I: "The Contracting Parties confirm that genocide, whether committed in time of peace or in time of war, is a
      crime under international law which they undertake to prevent and to punish."
      Art II: genocide means any of the following acts committed with intent to destroy, in whole or in part, a national,
      ethnical, racial or religious group, as such: (a) killing members of the group; (b) causing serious bodily or mental
      harm to members of the group; (c) deliberately inflicting on the group conditions of life calculated to bring about
      its physical destruction in whole or in part; (d) imposing measures intended to prevent births within the group; (e)
      forcibly transferring children of the group to another group.
      Art III: the following acts shall be punishable: (a) genocide; (b) conspiracy to commit genocide; (c) direct and
      public incitement to commit genocide; (d) attempt to commit genocide; (e) complicity in genocide.
    gloss: The duty to prevent and punish genocide, the definition of genocide and the punishable acts — the rights at stake in the tutorial problem.
    cases: []
    verify: false
  - slug: african-union-psc-protocol-art-4
