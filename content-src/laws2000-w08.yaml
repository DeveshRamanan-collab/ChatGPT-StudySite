        correct: true
        why: "Correct — the slides: \"Disputing parties may in principle appoint an ad hoc judge\" to sit alongside the 15 regular judges."
      - text: Veto any of the 15 regular judges it considers biased.
        why: Tempting because states control arbitral composition, but at the ICJ the regular judges are elected; parties can only add an ad hoc judge, not veto judges.
      - text: Replace the President of the Court for the duration of its case.
        why: Tempting because parties shape arbitral tribunals, but the ICJ is a standing court; the only adjustment on the slides is the appointment of an ad hoc judge.
  - key: q512
    type: mcq
    concept: icj-cases-and-effect-of-decisions
    difficulty: 2
    stem: Which are incidental proceedings before the ICJ, according to the slides?
    options:
      - text: Interim protection, preliminary objections, counter-claims, intervention, discontinuance
        correct: true
        why: "Correct — the slides list incidental proceedings: interim protection (Rules arts 73–78), preliminary objections (art 79), counter-claims (art 80), intervention (arts 81–86) and discontinuance (arts 88–89)."
      - text: Negotiation, good offices, mediation, inquiry and conciliation
        why: Tempting because these are listed this week, but they are the diplomatic modes of settlement under art 33(1), not proceedings before the Court.
      - text: Institution of proceedings, written proceedings and oral proceedings
        why: Tempting because these are ICJ procedural stages, but they are the main stages under the Rules of Court (arts 38–43, 44–53, 54–72), not incidental proceedings.
  - key: q513
    type: mcq
    concept: icj-cases-and-effect-of-decisions
    difficulty: 1
    stem: Where is the ICJ based?
