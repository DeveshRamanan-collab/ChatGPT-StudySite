        why: Tempting to doubt because it is also an arbitration device, but the slides list the compromis first among art 36's ways of consenting to ICJ jurisdiction.
      - text: A treaty clause allowing disputes to be brought before the Court
        why: Tempting to doubt because the treaty is about something else, but the slides list becoming party to a treaty that allows disputes to be brought before the Court.
      - text: A declaration under art 36(2) — the optional clause
        why: Tempting to doubt because the clause is "optional", but a declaration under art 36(2) is one of the four ways listed on the slides.
      - text: A General Assembly resolution referring the dispute
        correct: true
        why: Correct — the four ways are compromis, treaty clause, optional clause declaration and forum prorogatum; the General Assembly can request advisory opinions but cannot supply a state's consent.
  - key: q603
    type: mcq
    concept: icj-jurisdiction-and-consent
    difficulty: 2
    stem: State A files an application against State B with no prior basis of consent. B later accepts the Court's jurisdiction over the case. Which doctrine gives the Court jurisdiction?
    options:
      - text: Forum prorogatum
        correct: true
        why: "Correct — forum prorogatum: a state that has not consented when an application is filed against it subsequently does so."
      - text: Compétence de la compétence
        why: Tempting because it concerns jurisdiction, but compétence de la compétence (art 36(6)) is the Court's power to decide its own jurisdiction, not a way for a state to consent.
      - text: The optional clause
        why: Tempting because it is a route to consent, but the optional clause requires prior declarations under art 36(2) by both states; here there was no prior basis.
      - text: Compromis
        why: Tempting because it is a form of agreement, but a compromis is a special agreement by both parties to submit the dispute; here B consents only after A has filed.
  - key: q604
    type: mcq
    concept: icj-jurisdiction-and-consent
    difficulty: 2
    stem: Who decides whether the ICJ has jurisdiction when the parties disagree?
    options:
      - text: The Court itself (compétence de la compétence, art 36(6))
        correct: true
        why: "Correct — the slides: the Court has competence to rule on its own jurisdiction (compétence de la compétence), art 36(6) ICJ Statute."
      - text: The Security Council, by a resolution on the dispute
        why: Tempting because the Security Council has a role under art 94 on compliance, but jurisdictional disputes are decided by the Court itself under art 36(6).
      - text: The respondent state, by a declaration to the Court
        why: Tempting because consent comes from states, but if they disagree whether consent exists, the Court decides; a respondent's say-so is not conclusive.
  - key: q605
    type: mcq
    concept: icj-jurisdiction-and-consent
    difficulty: 2
    stem: What does a declaration under art 36(2) of the ICJ Statute do?
    options:
