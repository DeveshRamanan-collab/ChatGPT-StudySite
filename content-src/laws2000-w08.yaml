  - key: q121
    type: short
    concept: existence-of-a-dispute
    difficulty: 3
    cases:
      - mavrommatis-palestine-concessions-greece-v-great-britain
      - interpretation-of-peace-treaties-with-bulgaria-hungary-and-romania
      - south-west-africa-ethiopia-v-south-africa-liberia-v-south-africa
      - application-of-the-international-convention-on-the-elimination-of-all-forms-of-racial-discrimination-georgia-v-russian-federation
    prompt: State A applies to the ICJ alleging that State B is polluting a shared river in breach of a treaty. State B objects that "no dispute exists between the parties". Explain how the Court will decide whether a dispute exists, citing the leading cases.
    model: |-
      Issue: whether a legal dispute existed between A and B at the date A instituted proceedings; if not, the Court has
      no jurisdiction. Law: a legal dispute is "a disagreement on a point of law or fact, a conflict of legal views or
      interests between persons" (Mavrommatis, PCIJ 1924). Whether one exists "is a matter for objective determination",
      and B's "mere denial of the existence of a dispute does not prove its non-existence" (Peace Treaties, 1950). The
      parties must "hold clearly opposite views": A's claim must be "positively opposed" by B, and B must have been aware,
      or could not have been unaware, of that opposition (South West Africa, 1962). It needs more than friction, and some
      communication (Marshall Islands v UK, 2016); the threshold is low. The determination "requires an examination of the
      facts" (Georgia v Russian Federation, 2011, para 30): public statements, diplomatic notes and the parties' conduct.
      Application: if A protested the pollution to B and B rejected the claim before A filed, the views were positively
      opposed and B knew it. Conclusion: a dispute existed and B's objection fails; if A never communicated its claim
      before filing, the objection would likely succeed.
    rubric:
      - id: r1
        criterion: Issue — existence of a dispute as a condition of jurisdiction at the date of filing
        marks: 1
        top-band: States that without a dispute at the date proceedings were instituted the Court has no jurisdiction, and that B's objection targets exactly this.
        margin-note: Why does it matter whether a dispute exists? Tie it to jurisdiction and the filing date.
        authorities: []
      - id: r2
        criterion: Law (authority) — definition and objective test
        marks: 3
        top-band: Cites Mavrommatis (definition), Peace Treaties (objective determination; denial not enough), South West Africa (positive opposition and awareness), Marshall Islands (communication) and Georgia v Russia (examination of the facts).
        margin-note: Good list of cases — now say what each one adds to the test.
        authorities: []
      - id: r3
        criterion: Application — the facts that show opposed views and awareness
        marks: 3
        top-band: Identifies the evidence to look for (diplomatic notes, public statements, conduct) and explains why it shows a claim positively opposed and known to B before filing.
        margin-note: Which exchange between A and B proves B knew its views were opposed?
        authorities: []
      - id: r4
        criterion: Conclusion
        marks: 1
        top-band: Gives a clear conclusion on B's objection, with the alternative outcome if no claim was communicated before filing.
        margin-note: So — does the objection succeed or fail?
        authorities: []
  - key: q201
    type: mcq
    concept: obligation-of-peaceful-settlement
    difficulty: 1
    set: pretest
    stem: Which UN Charter provision obliges members to settle their international disputes by peaceful means?
    options:
      - text: Art 2(3)
        correct: true
        why: "Correct — art 2(3): \"All Members shall settle their international disputes by peaceful means in such a manner that international peace and security, and justice, are not endangered.\""
      - text: Art 2(4)
        why: Tempting because it sits right next to art 2(3) and works with it, but art 2(4) is the obligation to refrain from the threat or use of force, not the duty to settle peacefully.
      - text: Art 51
        why: Tempting because it concerns force between states, but art 51 preserves the inherent right of self-defence if an armed attack occurs (Week 7); it is not the settlement duty.
      - text: Art 94
        why: Tempting because it is a dispute-related Charter article this week, but art 94 obliges members to comply with ICJ decisions; it does not impose the general duty to settle peacefully.
  - key: q202
    type: mcq
    concept: obligation-of-peaceful-settlement
    difficulty: 2
    stem: Two states have disputed a maritime boundary peacefully for forty years without reaching agreement. Are they in breach of art 2(3)?
    options:
      - text: Yes — art 2(3) requires states to resolve their disputes within a reasonable time.
        why: "Tempting because the duty is to \"settle\", but the slides say it is an obligation of conduct, not of result: states are not legally obliged to reach any particular settlement."
      - text: No — it is an obligation of conduct, not of result; they must keep trying peacefully.
        correct: true
        why: Correct — the slides call it an "obligation of conduct" not an obligation of result, which is why some disputes last for decades; they remain obliged to keep trying peacefully and not to use force.
      - text: Yes — after forty years the Security Council must impose a settlement under art 33(1).
        why: Tempting because art 33(1) lists the means, but it requires the parties themselves to seek a solution; it gives the Security Council no power to impose a settlement.
  - key: q203
    type: mcq
    concept: obligation-of-peaceful-settlement
    difficulty: 2
    cases:
      - nicaragua-v-united-states-of-america
    stem: Which case do the slides cite for the obligation of peaceful settlement being binding under customary international law?
    options:
      - text: Nicaragua v United States (1986), para 290
        correct: true
        why: Correct — the slides cite Military and Paramilitary Activities in and against Nicaragua [1986] ICJ Rep 14, para 290, for the customary status of the obligation.
      - text: North Sea Continental Shelf (1969), para 85
        why: "Tempting because North Sea is cited this week, but for negotiation: it presupposes a genuine attempt to engage in discussions with a view to resolving the dispute (para 85)."
      - text: South West Africa (1962), Preliminary Objections
        why: Tempting because South West Africa is cited this week, but for the test of whether a dispute exists (clearly opposite views), not for the customary obligation.
      - text: LaGrand (Germany v United States) (2001), para 102
        why: Tempting because LaGrand is an ICJ case this week, but it concerns whether provisional measures under art 41 are binding, not the obligation of peaceful settlement.
  - key: q204
    type: mcq
    concept: obligation-of-peaceful-settlement
