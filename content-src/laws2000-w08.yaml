      - text: It accepts the Court's jurisdiction over all disputes with every UN member, whether or not they have made declarations.
        why: Tempting because the declaration is general, but it operates only in relation to states accepting the same obligation; it does not bind the declarant to states that have not declared.
      - text: It requests an advisory opinion on a legal question of concern to the declaring state.
        why: Tempting because it is a unilateral act addressed to the Court, but states cannot request advisory opinions; those come from UN organs and specialised agencies.
  - key: q606
    type: mcq
