    stem: State X protests in a diplomatic note that State Y's new dam breaches a river treaty. Y replies by note that the dam complies fully. X then files at the ICJ. Is there a dispute?
    options:
      - text: No — a breach must be found before the Court can be seised.
        why: Tempting because breach is what X ultimately alleges, but a dispute is a disagreement on a point of law or fact (Mavrommatis); breach is decided later, on the merits.
      - text: Yes — X's claim is positively opposed by Y, and Y plainly knew of the opposition.
        correct: true
        why: Correct — the exchange of notes shows clearly opposite views on a specific issue, communicated between the parties, and Y could not have been unaware (South West Africa).
      - text: No — Y's reply shows only disagreement, and disagreement is mere friction, not a dispute.
        why: "Tempting because friction is not enough, but this is no mere friction: there is a specific legal claim and a positive denial of it, communicated by diplomatic note."
  - key: q114
