  - slug: un-charter-art-52
    title: UN Charter art 52
    kind: treaty
    text: |-
      1. Nothing in the present Charter precludes the existence of regional arrangements or agencies for dealing with such
         matters relating to the maintenance of international peace and security as are appropriate for regional action
         provided that such arrangements or agencies and their activities are consistent with the Purposes and Principles
         of the United Nations.
      2. The Members of the United Nations entering into such arrangements or constituting such agencies shall make every
         effort to achieve pacific settlement of local disputes through such regional arrangements or by such regional
         agencies before referring them to the Security Council.
      3. The Security Council shall encourage the development of pacific settlement of local disputes through such
         regional arrangements or by such regional agencies either on the initiative of the states concerned or by
         reference from the Security Council…
    gloss: Regional arrangements may settle local disputes, and members should try them before going to the Security Council.
