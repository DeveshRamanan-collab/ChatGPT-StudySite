        correct: true
        why: Correct — art 4 of the Protocol lists (a) peaceful settlement of disputes and conflicts and (b) early responses to contain crisis situations before they develop into full-blown conflicts.
      - text: Collective self-defence and compulsory arbitration of all disputes
        why: Tempting because the AU deals with security, but the quoted principles are peaceful settlement and early response; compulsory arbitration is not among them.
      - text: Non-intervention and the binding force of majority decisions
        why: Tempting because majority decisions appear in Part C, but that is the Arab League's art 7; the AU Protocol's quoted principles concern peaceful settlement and early response.
  - key: q806
    type: mcq
    concept: regional-and-economic-dispute-settlement
    difficulty: 2
    stem: Which of these is NOT among the peaceful procedures listed in art 25 of the OAS Charter?
    options:
      - text: Direct negotiation
        why: Tempting to doubt because negotiation needs no procedure, but art 25 lists "direct negotiation" first among the OAS's peaceful procedures.
      - text: Good offices
        why: Tempting to doubt because good offices are informal, but art 25 lists good offices among the peaceful procedures of the OAS Charter.
      - text: Investigation and conciliation
        why: Tempting to doubt because the UN Charter says "enquiry", but art 25 lists "investigation and conciliation" as a peaceful procedure.
      - text: Security Council enforcement
        correct: true
