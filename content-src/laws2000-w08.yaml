        why: Tempting because next week covers force, but nothing in art 2(4) permits force once diplomacy fails; the obligation not to use force always remains.
      - text: "They work hand in hand: first settle peacefully, then the duty not to use force."
        correct: true
        why: "Correct — the lecturer said the two articles work hand in hand, and the order matters: first the obligation to resolve disputes peacefully, then the obligation not to use force."
      - text: "They are alternatives: a state chooses either peaceful settlement or self-help."
        why: Tempting because states choose among means, but the choice is among peaceful means (art 33(1)); force is not an alternative to peaceful settlement under the Charter.
