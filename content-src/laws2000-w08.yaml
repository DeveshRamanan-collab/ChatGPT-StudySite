  - key: q420
    type: short
    concept: international-arbitration
    difficulty: 3
    cases:
      - south-china-sea-arbitration-philippines-v-china
    prompt: Compare international arbitration with judicial settlement by the ICJ. Why might two states prefer arbitration for a maritime boundary dispute?
    model: |-
      Issue: how do arbitration and the ICJ, both art 33(1) means, differ, and when is arbitration preferable? Law: both
      are founded on consent and both bind — arbitral awards are final and binding upon the parties, and ICJ judgments are
      final, without appeal and binding between the parties (arts 59, 60 ICJ Statute). Consent to arbitration is given by
      a treaty providing for arbitration of future disputes (e.g. UNCLOS) or by a special agreement (compromis) after the
      dispute arises. States keep close control: the composition — the number and identity of arbitrators, often one
      chosen by each party and a third agreed; the rules to be applied, such as a specific treaty or national law; and
      confidentiality. Procedure is flexible and tribunals are ad hoc. The ICJ is a standing court of 15 judges elected by
      the Security Council and General Assembly for nine years; parties may appoint only an ad hoc judge. Application: in
      a sensitive boundary dispute, states wanting to choose who decides, which law applies and whether the hearing is
      public will find arbitration attractive, as in the South China Sea arbitration under UNCLOS. Conclusion: both bind,
      but arbitration gives the parties more control.
    rubric:
      - id: r1
        criterion: Issue — two adjudicatory modes, both consent-based and binding
        marks: 1
        top-band: Frames both as adjudicatory means under art 33(1) that rest on consent and produce binding decisions.
        margin-note: Start by saying what the two modes have in common.
        authorities:
          - un-charter-art-33-1
      - id: r2
        criterion: Law (authority) — consent routes and state control in arbitration
        marks: 3
        top-band: Explains treaty-based consent and the compromis, then composition, applicable rules, confidentiality, flexible procedure, ad hoc tribunals and binding awards.
        margin-note: You list the features — which of them give the states control?
        authorities: []
      - id: r3
        criterion: Application — contrast with the ICJ and fit to a boundary dispute
        marks: 3
        top-band: Contrasts the ICJ's elected 15-judge bench, ad hoc judge, fixed procedure and art 60 finality, and links arbitration's control features to the sensitivities of a boundary dispute.
        margin-note: Why would these particular states care who the arbitrators are?
        authorities:
          - icj-statute-art-60
          - icj-statute-art-59
      - id: r4
        criterion: Conclusion
        marks: 1
        top-band: Concludes that both bind the parties but arbitration offers more control, with a reason tied to the facts.
        margin-note: Finish with a clear recommendation.
        authorities: []
  - key: q501
    type: mcq
    concept: icj-cases-and-effect-of-decisions
    difficulty: 1
    stem: How many regular judges sit on the ICJ, and for how long are they elected?
    options:
      - text: 15 judges, for 9 years
        correct: true
        why: "Correct — the slides: 15 regular judges, elected by the UN Security Council and the General Assembly for a term of 9 years (the lecturer added that terms can be renewed)."
      - text: 9 judges, for 15 years
        why: "Tempting because the same two numbers appear, but they are reversed: there are 15 judges, each elected for a nine-year term."
      - text: 15 judges, for life
        why: Tempting because some apex domestic courts have life tenure, but ICJ judges are elected for nine-year terms, which the lecturer said can be renewed.
      - text: 193 judges, one per member state
        why: Tempting because the Court can hear disputes between the 193 UN members, but it has 15 regular judges; parties may in principle appoint an ad hoc judge.
  - key: q502
    type: mcq
    concept: icj-cases-and-effect-of-decisions
    difficulty: 1
    stem: Who elects the judges of the ICJ?
    options:
      - text: The Security Council and the General Assembly
        correct: true
        why: "Correct — the slides: judges are elected by the UN Security Council and the General Assembly; the lecturer said the votes take place in parallel in both bodies."
      - text: The General Assembly alone, by a simple majority
        why: Tempting because the General Assembly represents all members, but the slides say both the Security Council and the General Assembly elect the judges.
      - text: The Secretary-General, on the advice of the Security Council
        why: Tempting because the Secretary-General has roles under the Charter, but the slides give the election to the Security Council and the General Assembly.
  - key: q503
    type: mcq
    concept: icj-cases-and-effect-of-decisions
    difficulty: 2
    stem: Which statement correctly contrasts the ICJ's two types of cases?
    options:
      - text: Contentious cases bind the disputing states; advisory opinions, sought by UN organs and agencies, bind no one.
        correct: true
        why: "Correct — the slides: contentious cases are legal disputes between states submitted by them, binding between parties only; advisory proceedings answer questions from UN organs and specialised agencies and are non-binding."
      - text: Contentious cases are brought by UN organs and are non-binding; advisory opinions are requested by states and bind them.
        why: "Tempting because both types exist, but the roles are swapped: states bring contentious cases (binding on the parties), and UN organs request advisory opinions (non-binding)."
      - text: Contentious cases may involve individuals accused of crimes; advisory opinions concern only disputes between states.
        why: Tempting because international crimes are serious, but only states are parties at the ICJ; it does not decide individual criminal responsibility.
  - key: q504
    type: mcq
    concept: icj-cases-and-effect-of-decisions
    difficulty: 2
    cases:
      - chagos-islands-case
    stem: Who may request an advisory opinion from the ICJ?
    options:
      - text: UN organs and specialised agencies, on legal questions (art 96 UN Charter; art 65 ICJ Statute)
        correct: true
        why: "Correct — the slides: advisory proceedings concern legal questions referred by UN organs and specialised agencies (art 96 UN Charter; art 65 ICJ Statute); the lecturer added agencies need GA authorisation, within their scope."
      - text: Any state, on any legal question relating to its disputes with another state
        why: Tempting because states are the ICJ's parties, but states bring contentious cases; advisory opinions are requested by UN organs and specialised agencies.
      - text: Individuals and NGOs, on questions of human rights law
        why: Tempting because advisory opinions often touch human rights, but non-state entities cannot bring matters to the Court; only UN organs and authorised agencies may request opinions.
  - key: q505
    type: mcq
    concept: icj-cases-and-effect-of-decisions
    difficulty: 2
    cases:
      - chagos-islands-case
    stem: In the Chagos advisory opinion, requested by the General Assembly, what did the Court conclude, as the lecturer described it?
    options:
      - text: That the decolonisation of Mauritius had not been lawfully completed.
        correct: true
        why: Correct — the lecturer said the Court concluded the decolonisation of Mauritius was not lawfully completed, that Mauritius should have sovereignty over the archipelago, and that the Chagossians must be able to return.
      - text: That the UK's continued administration was lawful because of the Diego Garcia base.
        why: Tempting because the base featured in the lecture, but it concerns the later UK–Mauritius treaty arrangements; the Court found the decolonisation had not been lawfully completed.
      - text: That it could not answer without Mauritius as a party.
        why: Tempting because states bring contentious cases, but the request came from the General Assembly, an organ entitled to seek opinions; the Court answered the questions put to it.
  - key: q506
    type: mcq
    concept: icj-cases-and-effect-of-decisions
    difficulty: 2
    stem: Are ICJ advisory opinions binding?
    options:
      - text: No — they are non-binding, though they carry considerable weight.
        correct: true
        why: Correct — the slides say advisory proceedings are non-binding; the lecturer added they carry quite a bit of weight, coming from the principal judicial organ of the UN.
      - text: Yes — they bind every UN member under art 94 of the Charter.
        why: Tempting because art 94 concerns compliance with the Court, but it is about decisions in cases between parties; the slides say advisory opinions are non-binding.
      - text: Yes — but only the organ that requested the opinion.
        why: Tempting because the requesting organ asked the question, but the slides simply say advisory opinions are non-binding; no one is bound by them.
  - key: q507
    type: mcq
    concept: icj-cases-and-effect-of-decisions
    difficulty: 2
    stem: What does art 60 of the ICJ Statute provide?
    options:
      - text: It is final and without appeal; the Court construes it if its meaning is disputed.
        correct: true
        why: "Correct — art 60: \"The judgment is final and without appeal. In the event of dispute as to the meaning or scope of the judgment, the Court shall construe it upon the request of any party.\""
      - text: The judgment may be appealed to the Security Council within six months of delivery.
        why: Tempting because the Security Council can act under art 94(2), but that is enforcement, not appeal; art 60 says the judgment is final and without appeal.
      - text: The judgment binds every state that has accepted the optional clause.
        why: Tempting because optional-clause states accept jurisdiction, but a judgment binds only the parties to the dispute and cannot oblige third parties (arts 59, 61).
  - key: q508
    type: mcq
    concept: icj-cases-and-effect-of-decisions
    difficulty: 3
    stem: The ICJ decides a maritime dispute between Australia and New Zealand. Indonesia, with a similar dispute, asks whether the judgment binds it. What is the answer?
    options:
      - text: Yes — ICJ judgments bind all UN members, as the Court is the UN's principal judicial organ.
        why: Tempting because the ICJ is the UN's principal judicial organ, but its judgments bind only the parties; Indonesia, not a party, is not bound (arts 59, 60).
      - text: No — the judgment binds only the parties to the dispute and cannot oblige third parties.
        correct: true
        why: Correct — a judgment is final and without appeal but "only binding on the parties to the dispute and cannot oblige third parties"; the lecturer used this very Australia–New Zealand example.
      - text: Yes — if Indonesia has made an optional clause declaration under art 36(2).
        why: Tempting because art 36(2) declarations accept jurisdiction, but accepting jurisdiction does not make someone else's judgment binding; only the parties are bound.
  - key: q509
    type: mcq
    concept: icj-cases-and-effect-of-decisions
    difficulty: 3
    stem: State X refuses to comply with an ICJ judgment in favour of State Y. What can Y do under art 94 of the UN Charter?
    options:
      - text: Bring it before the Security Council, which may recommend or decide on measures.
        correct: true
        why: Correct — art 94 obliges members to comply; if a party does not, the other may go to the Security Council, which can make recommendations or decide on measures to give effect to the judgment (art 94(2)).
      - text: Appeal to the General Assembly, which may set aside or confirm the judgment.
        why: Tempting because the General Assembly is the plenary organ, but judgments are final and without appeal (art 60); art 94 routes non-compliance to the Security Council.
      - text: Ask the ICJ itself to seize X's assets to satisfy the judgment.
        why: Tempting because domestic courts enforce their own judgments, but the materials give the ICJ no enforcement machinery; art 94(2) gives that role to the Security Council.
  - key: q510
    type: mcq
    concept: icj-cases-and-effect-of-decisions
    difficulty: 2
    stem: How do the slides describe the ICJ's case law, given that international law has no doctrine of precedent?
    options:
      - text: Judges and scholars refer to the "case law of the ICJ" as if it were common law.
        correct: true
        why: "Correct — the slides: whilst precedent does not exist in international law, judges and scholars refer to the \"case law of the ICJ\" as if it were common law in the classic sense."
      - text: ICJ decisions bind all later cases on the same point, just like a common law apex court.
        why: Tempting because the ICJ is so influential, but the doctrine of precedent does not exist in international law; art 59 confines a decision's binding force to the parties.
      - text: ICJ decisions are ignored later, as each binds only its parties.
        why: Tempting because of art 59, but in practice the Court's decisions are cited constantly; the slides note its significant contribution to the development of international law.
  - key: q511
    type: mcq
    concept: icj-cases-and-effect-of-decisions
    difficulty: 2
    stem: What may a disputing party do about the bench, according to the slides?
    options:
