      - text: Vienna Convention on the Law of Treaties (1969)
        correct: true
        why: Correct — the VCLT (Week 3) governs treaties; the slides' list is the OAS Charter, the Friendly Relations Declaration, the Manila Declaration, the 1988 Declaration and the AU Constitutive Act.
      - text: Friendly Relations Declaration (1970)
        why: Tempting because it was cited in Week 4 for non-recognition, but the Friendly Relations Declaration (1970) is also on this week's list reiterating the obligation.
  - key: q206
    type: mcq
    concept: obligation-of-peaceful-settlement
    difficulty: 2
    stem: Art 33(1) UN Charter ends its list with "other peaceful means of their own choice". What does that tell you?
    options:
      - text: "The list is open-ended: states can be creative in choosing a peaceful means."
        correct: true
        why: "Correct — the lecturer stressed that art 33(1) is open-ended: the listed means are a starting point, and states can choose other peaceful means of their own choice."
      - text: Only the listed means may be used unless the Security Council approves another.
        why: Tempting because the Security Council has roles under the Charter, but the words "of their own choice" leave the selection to the parties; no approval is required.
      - text: States must try each listed means in turn before choosing their own.
        why: Tempting because the lecture moves through the means in order, but art 33(1) imposes no sequence; the order runs from flexible to rigid only for teaching purposes.
  - key: q207
    type: mcq
    concept: obligation-of-peaceful-settlement
    difficulty: 3
    stem: Why, according to the lecturer, can international law not impose an obligation actually to resolve every dispute?
    options:
      - text: "Because dispute settlement sits in the realm of state consent: the means chosen, and any settlement, depend on consent."
        correct: true
        why: Correct — the lecturer said everything a state does in international law rests on consent, including the mode of settlement and whether to settle, so an obligation of result would be impossible.
      - text: Because the ICJ has compulsory jurisdiction, so an obligation of result would be redundant.
        why: Tempting because the ICJ is the main court, but it has no so-called compulsory jurisdiction (tutorial question 1); its jurisdiction too depends on consent.
      - text: Because art 2(4) allows force as a last resort once peaceful settlement has failed.
        why: Tempting because next week is on force, but art 2(4) prohibits force; the obligation not to use force always remains even when a dispute is unresolved.
  - key: q208
    type: mcq
    concept: obligation-of-peaceful-settlement
    difficulty: 2
    stem: The lecturer opened with Canada and Denmark's roughly 50-year dispute over Hans Island, settled by agreeing to share it. What does the example best illustrate?
    options:
      - text: That territorial disputes must be resolved within a reasonable time or become unlawful.
        why: "Tempting because fifty years seems long, but the obligation is one of conduct: no time limit applies, and states are not obliged to reach any particular settlement."
      - text: That a dispute can last for decades while the parties keep relations peaceful.
        correct: true
        why: Correct — the lecturer used the "Whisky War" to show a long-running dispute in which the parties kept an amicable relationship until they agreed to share the island.
      - text: That UNCLOS arbitration is the usual route for Arctic boundaries.
        why: Tempting because UNCLOS provides for arbitration, but the Hans Island dispute ended by agreement between the two states, not by any arbitral award.
  - key: q209
    type: mcq
    concept: obligation-of-peaceful-settlement
    difficulty: 3
    variant-of: q202
    stem: After 20 years of failed negotiation, State K says it is "released" from the peaceful settlement obligation and may now use force to recover the disputed territory. Assess K's claim.
    options:
      - text: "It is right: an obligation of conduct is discharged once a state has tried in good faith for long enough."
        why: Tempting because "conduct" sounds as if trying is enough, but the duty to try continues while the dispute lasts, and the obligation not to use force always remains.
      - text: "It is wrong: the duty to keep seeking a peaceful settlement continues, and art 2(4) still bars force."
        correct: true
        why: Correct — the lecturer said a state unable to resolve its dispute remains under a continuing obligation to try to resolve it peacefully, and can never use force against the other state.
      - text: It is right, provided K first refers the dispute to a regional organisation under art 52.
        why: Tempting because art 52 encourages regional settlement, but referring a dispute to a regional body does not unlock force; art 2(4) applies regardless.
  - key: q210
    type: mcq
    concept: obligation-of-peaceful-settlement
    difficulty: 1
    stem: According to the lecture, today's framework for peaceful settlement mostly dates from when?
    options:
      - text: The 20th century, especially after the Second World War and the UN Charter (1945).
        correct: true
        why: Correct — the lecturer said the obligation has a long history, but today's framework is mostly the rules developed in the 20th century, especially after the Second World War and the UN Charter.
      - text: The Peace of Westphalia (1648), which first required states to settle disputes peacefully.
        why: Tempting because Westphalia appears in Week 1's history, but the lecturer placed today's framework in the 20th century, especially after the adoption of the UN Charter in 1945.
      - text: The Manila Declaration (1982), which created the obligation for all UN members.
        why: Tempting because the Manila Declaration is about peaceful settlement, but it reiterates an obligation that already existed under art 2(3) of the 1945 Charter; it did not create it.
  - key: q211
    type: mcq
    concept: obligation-of-peaceful-settlement
    difficulty: 2
    cases:
      - nicaragua-v-united-states-of-america
    stem: Several instruments beyond the UN Charter, such as the Manila Declaration, reiterate the obligation. Why does the obligation bind even a state that never accepted those declarations?
    options:
      - text: Because it is binding under customary international law (Nicaragua, para 290).
        correct: true
        why: Correct — the slides note the obligation is binding under customary international law, citing Nicaragua [1986] ICJ Rep 14, para 290, so it binds states regardless of those instruments.
      - text: Because General Assembly declarations bind all UN members once adopted.
        why: Tempting because the declarations are GA texts, but GA declarations are not as such binding (Week 2); the obligation binds as custom and under art 2(3) of the Charter.
      - text: Because the Security Council has made each of the declarations binding on members.
        why: Tempting because Security Council decisions can bind, but the slides give no such basis; they rely on customary international law as found in Nicaragua.
  - key: q212
    type: mcq
    concept: obligation-of-peaceful-settlement
    difficulty: 2
    stem: To which disputes is art 33(1) UN Charter addressed?
    options:
      - text: Any dispute between states, however minor.
        why: Tempting because art 2(3) covers "international disputes" generally, but art 33(1) is framed for disputes "the continuance of which is likely to endanger" international peace and security.
      - text: Disputes whose continuance is likely to endanger the maintenance of international peace and security.
        correct: true
        why: "Correct — art 33(1): \"The parties to any dispute, the continuance of which is likely to endanger the maintenance of international peace and security, shall, first of all, seek a solution by…\"."
      - text: Only disputes already referred to the Security Council by a member state.
        why: Tempting because art 33 sits in the Charter's provisions on disputes, but it binds the parties "first of all" to seek a solution themselves, before any referral.
  - key: q213
    type: mcq
    concept: obligation-of-peaceful-settlement
    difficulty: 3
    contrasts-with:
      - diplomatic-modes-of-settlement
    stem: Which statement about the means in art 33(1) and the binding force of their outcomes is correct?
    options:
      - text: All of them produce binding outcomes, because the Charter itself is a binding treaty.
        why: Tempting because the Charter binds members, but the duty to seek a solution does not make every outcome binding; mediation proposals and conciliation reports are not.
      - text: Diplomatic means do not bind; arbitration and judicial settlement do.
        correct: true
        why: "Correct — the lecture divides art 33(1)'s means: diplomatic (non-adjudicatory) modes are not binding, while the adjudicatory modes — arbitration and courts — are binding."
      - text: Only judicial settlement binds; arbitral awards are recommendations the parties may ignore.
        why: Tempting because courts feel more formal, but the slides say arbitral awards are final and binding upon the parties, just as ICJ judgments bind the parties.
  - key: q214
    type: mcq
    concept: obligation-of-peaceful-settlement
    difficulty: 2
    stem: What do the slides say the peaceful settlement of disputes seeks to do?
    options:
      - text: Maintain peace and stability by resolving disputes peacefully before they escalate.
        correct: true
        why: "Correct — the slides: peaceful settlement \"seeks to maintain peace and stability by resolving international disputes through peaceful means before they escalate\"."
      - text: Determine which state is legally responsible and impose reparation on it for the harm caused.
        why: "Tempting because Week 7 covered reparation, but peaceful settlement is broader: many means (negotiation, mediation) aim at agreement, not findings of responsibility."
      - text: Replace national courts with one international court for all disputes.
        why: Tempting because the ICJ is central this week, but there is no single compulsory court; states choose among many means, judicial settlement being only one.
  - key: q215
    type: mcq
    concept: obligation-of-peaceful-settlement
    difficulty: 2
    variant-of: q202
    stem: States M and N have held talks on a fishing dispute in good faith for a decade without agreement. N says M is in breach of the UN Charter for "failing to settle". Is N right?
    options:
      - text: Yes — art 2(3) requires a settlement, and ten years exceeds what is reasonable.
        why: "Tempting because art 2(3) says \"shall settle\", but the slides call it an obligation of conduct: states are not legally obliged to reach any particular settlement."
      - text: No — the duty is to seek a peaceful settlement in good faith, not to reach one.
        correct: true
        why: Correct — an "obligation of conduct" not of result; M complies by continuing to pursue peaceful means, and both remain bound not to use force.
      - text: Yes — unless M refers the dispute to the ICJ, which has compulsory jurisdiction.
        why: Tempting because judicial settlement is one means, but the ICJ has no so-called compulsory jurisdiction; jurisdiction depends on the consent of both states.
  - key: q216
    type: mcq
    concept: obligation-of-peaceful-settlement
    difficulty: 1
    stem: Which instrument on the slides dates from 1988?
    options:
      - text: The Declaration on the Prevention and Removal of Disputes
        correct: true
        why: Correct — the slides list the Declaration on the Prevention and Removal of Disputes (1988) among the instruments reiterating the obligation of peaceful settlement.
      - text: The Manila Declaration on the Peaceful Settlement of International Disputes
        why: Tempting because it is the other late-century declaration on the list, but the Manila Declaration on the Peaceful Settlement of International Disputes dates from 1982.
      - text: The Friendly Relations Declaration
        why: Tempting because it is the best-known declaration on the list, but the Friendly Relations Declaration dates from 1970, eighteen years before the 1988 declaration.
  - key: q217
    type: mcq
    concept: obligation-of-peaceful-settlement
    difficulty: 3
    stem: Which pairing of instrument and provision is correct, according to the slides?
    options:
      - text: Charter of the OAS — art 2(c)
        correct: true
        why: Correct — the slides cite the Charter of the Organization of American States (art 2(c)) (1948) as reiterating the obligation of peaceful settlement.
      - text: Constitutive Act of the African Union — art 2(3)
        why: Tempting because art 2(3) is the UN Charter provision, but the slides cite art 4(e) of the Constitutive Act of the African Union (2000).
      - text: UN Charter — art 33(4)
        why: Tempting because art 33 lists the peaceful means, but the provision quoted on the slides is art 33(1); no art 33(4) appears in the materials.
  - key: q218
    type: truefalse
    concept: obligation-of-peaceful-settlement
    difficulty: 1
    set: quickfire
    statement: Under the UN Charter, states are legally obliged to reach a settlement of every international dispute.
    answer: false
    why: "False — art 2(3) creates an obligation of conduct, not of result: states must seek peaceful settlement but are not obliged to reach any particular settlement."
  - key: q219
    type: truefalse
    concept: obligation-of-peaceful-settlement
    difficulty: 2
    set: quickfire
    statement: The obligation to settle disputes peacefully is binding under customary international law as well as under the UN Charter.
    answer: true
    why: True — the slides cite Nicaragua [1986] ICJ Rep 14, para 290, for the obligation being binding under customary international law, beyond art 2(3) of the Charter.
  - key: q220
    type: truefalse
    concept: obligation-of-peaceful-settlement
    difficulty: 2
    statement: "The list of peaceful means in art 33(1) UN Charter is closed: states may use only the means it names."
    answer: false
    why: False — art 33(1) ends with "or other peaceful means of their own choice", so the lecturer called the list open-ended; states can be creative.
  - key: q221
    type: match
    concept: obligation-of-peaceful-settlement
    difficulty: 2
    prompt: Match each provision or case to its content.
    pairs:
      - left: Art 2(3) UN Charter
        right: Settle international disputes by peaceful means
      - left: Art 2(4) UN Charter
        right: Refrain from the threat or use of force
      - left: Art 33(1) UN Charter
        right: Seek a solution by negotiation, enquiry, mediation and other peaceful means
      - left: Nicaragua (1986), para 290
        right: The obligation is binding under customary international law
  - key: q301
    type: mcq
    concept: diplomatic-modes-of-settlement
    difficulty: 1
    set: pretest
    stem: What distinguishes mediation from good offices?
    options:
      - text: A mediator suggests a framework of settlement; good offices only help the parties start talking.
        correct: true
        why: "Correct — the slides: good offices offer to facilitate and support efforts to enter direct negotiations, while a mediator assumes a more direct role and suggests a framework or solutions."
      - text: A mediator's proposals bind the parties; good offices produce non-binding suggestions only.
        why: Tempting because mediation is more active, but the slides say the solutions offered by the mediator are not binding; neither mode produces a binding outcome.
      - text: Mediation is always carried out by the UN Secretary-General; good offices only by states.
        why: Tempting because the UN often acts as a third party, but either mode can be offered by an individual, a group, one state or a group of states.
  - key: q302
    type: mcq
    concept: diplomatic-modes-of-settlement
    difficulty: 1
    stem: Why do governments find negotiation so attractive, according to the slides?
    options:
      - text: It lets the parties retain control of the dispute without involving third parties.
        correct: true
        why: "Correct — the slides: negotiation allows the parties to retain control of a dispute without involving third parties, \"so it is not that surprising that governments find it so attractive\"."
      - text: It produces a binding outcome faster than either arbitration or the ICJ can.
        why: Tempting because negotiation can be quick, but its outcome binds only if the parties conclude an agreement; it is a diplomatic mode, not an adjudicatory one.
      - text: It is the only mode that art 33(1) UN Charter makes compulsory for members.
        why: Tempting because art 33(1) lists negotiation first, but it is not made compulsory; the parties may choose any peaceful means, including others of their own choice.
  - key: q303
    type: mcq
    concept: diplomatic-modes-of-settlement
    difficulty: 2
    stem: Which is NOT among the principles the slides draw from GA Resolution 53/101 (1998) on negotiation?
    options:
      - text: Good faith
        why: Tempting if you see good faith as only a treaty-law principle (Week 3), but the slides list "good faith" first among Resolution 53/101's principles for negotiation.
      - text: A constructive atmosphere
        why: Tempting because it sounds like etiquette rather than law, but the slides quote "constructive atmosphere" as one of the Resolution 53/101 principles.
      - text: Refraining from conduct that might undermine the negotiations
        why: "Tempting because it sounds like a separate obligation, but the slides quote it: \"refrain from any conduct which might undermine the negotiations and their progress\"."
      - text: Accepting the outcome as binding
        correct: true
        why: Correct — negotiation is a diplomatic mode; its outcome binds only if the parties agree. Resolution 53/101 sets principles for conducting negotiations, not for binding outcomes.
  - key: q304
    type: mcq
    concept: diplomatic-modes-of-settlement
    difficulty: 2
    cases:
      - north-sea-continental-shelf-cases
    stem: According to North Sea Continental Shelf (para 85), what does negotiation presuppose?
    options:
      - text: A genuine attempt by one disputing party to engage in discussions with the other, with a view to resolving the dispute.
        correct: true
        why: "Correct — the slides quote North Sea Continental Shelf [1969] ICJ Rep 3, para 85: negotiation presupposes \"a genuine attempt … to engage in discussions … with a view to resolving the dispute\"."
      - text: A third party, trusted by both sides, chairing the discussions and keeping minutes of each session.
        why: Tempting because third parties feature in good offices and mediation, but negotiation is the mode without third parties; the parties keep control themselves.
      - text: An agreement in advance that whatever is decided will be submitted to the ICJ for approval.
        why: Tempting because judicial settlement may follow, but negotiation needs no court approval; it presupposes a genuine attempt to engage in discussions, nothing more.
  - key: q305
    type: mcq
    concept: diplomatic-modes-of-settlement
    difficulty: 2
    stem: "In negotiations over a shared aquifer, State G walks out without any justification and refuses to consider any of State H's points. On the lecture's account, G's conduct is best described as:"
    options:
      - text: Lawful in every respect, because negotiation is entirely within the parties' control.
        why: Tempting because parties do control negotiation, but Resolution 53/101 and North Sea require good faith and a genuine attempt; walking out without justification falls short.
      - text: Not good faith negotiation — no genuine attempt to resolve the dispute.
        correct: true
        why: "Correct — the lecturer gave exactly these examples of bad faith: withdrawing without any justification, and inflexible demands that never consider the other party's point of view."
      - text: A use of force contrary to art 2(4), entitling H to act in self-defence.
        why: Tempting because the conduct is hostile, but walking out of talks is not a threat or use of force; art 2(4) and self-defence concern force (next week).
  - key: q306
    type: mcq
    concept: diplomatic-modes-of-settlement
    difficulty: 2
    stem: When is an inquiry or fact-finding mission most useful?
    options:
      - text: When the parties disagree over the factual circumstances of their dispute.
        correct: true
        why: "Correct — the slides: inquiry is used \"when parties disagree over the factual circumstances of their dispute\"; the outcome is usually a non-binding report."
      - text: When the parties want a binding ruling on the applicable law.
        why: Tempting because inquiry produces findings, but a binding ruling on the law is the work of adjudication (arbitration or the ICJ); inquiry establishes facts in a non-binding report.
      - text: When a state wants to bring a claim against an individual for international crimes.
        why: Tempting because the MH17 investigation fed prosecutions, but inquiry as a mode of settlement addresses factual disagreements between states, not claims against individuals.
  - key: q307
    type: mcq
    concept: diplomatic-modes-of-settlement
    difficulty: 2
    stem: What do the slides say about the Joint Investigation Team on the 2014 shooting down of a Malaysian Airlines plane in Ukraine?
    options:
      - text: It held Russia responsible, and Russia rejected its findings.
        correct: true
        why: Correct — the slides say the Joint Investigation Team held Russia responsible and that Russia rejected its findings, showing that inquiry outcomes do not bind the parties.
      - text: It was a UN body whose findings bound all Security Council members.
        why: Tempting because the Security Council called for an investigation, but the lecturer stressed the team was not a UN body at all; it was a collaboration of states.
      - text: It found no state responsible and recommended a conciliation commission.
        why: Tempting because conciliation can follow inquiry, but the slides say the team held Russia responsible; nothing in the materials mentions a conciliation commission here.
  - key: q308
    type: mcq
    concept: diplomatic-modes-of-settlement
    difficulty: 3
    stem: A group of experts appointed by two states studies their dispute, sets out the facts and each side's position, and proposes a solution the states may use. Which mode is this?
    options:
      - text: Conciliation
        correct: true
        why: "Correct — conciliation: a third party (e.g. a group of experts) produces a report presenting the facts and the parties' positions and suggesting a solution, with non-binding recommendations."
      - text: Good offices
        why: Tempting because a third party is involved, but good offices only facilitate the start of direct negotiations; they do not report on facts and propose solutions.
      - text: Arbitration
        why: Tempting because experts decide on a written basis, but arbitration ends in a binding award; a report the states "may use" is a conciliation report.
      - text: Negotiation
        why: Tempting because the states will negotiate using the report, but negotiation involves no third party; here a group of experts reports, which is conciliation.
  - key: q309
    type: mcq
    concept: diplomatic-modes-of-settlement
    difficulty: 2
    stem: What example do the slides give of conciliation?
    options:
      - text: The Conciliation Commission under UNCLOS between Timor-Leste and Australia on the Timor Sea boundary.
        correct: true
        why: Correct — the slides cite the Conciliation Commission established under the UN Law of the Sea Convention between Timor-Leste and Australia on the maritime boundary in the Timor Sea.
      - text: Richard Holbrooke's role between the parties during the Bosnian War in the 1990s.
        why: Tempting because Holbrooke was a third party, but he is the slides' example of mediation — suggesting a framework of settlement — not of a conciliation report.
      - text: The UN International Commission of Inquiry tasked with investigating violations in Syria.
        why: Tempting because it produced a report, but the Syria commission is the slides' example of inquiry or fact-finding, tasked with investigating alleged human rights violations.
  - key: q310
    type: mcq
    concept: diplomatic-modes-of-settlement
    difficulty: 1
    stem: Which of these diplomatic modes produces a binding outcome?
    options:
      - text: Mediation, because the mediator's framework must be accepted by both parties.
        why: Tempting because the mediator is active, but the slides say the solutions offered by the mediator are not binding; the parties keep control.
      - text: Conciliation, because its report sets out all the relevant facts of the case.
        why: Tempting because a conciliation report is detailed, but the parties may use it to negotiate a settlement and are not bound by it.
      - text: None of them — the diplomatic modes are non-binding.
        correct: true
        why: Correct — the lecturer said the key distinction is that the diplomatic (non-adjudicatory) modes are not binding, whereas the adjudicatory modes are.
  - key: q311
    type: mcq
    concept: diplomatic-modes-of-settlement
    difficulty: 3
    contrasts-with:
      - international-arbitration
    stem: Two states want a third party to decide their boundary dispute and want to be legally bound by the result. Which mode fits, and why not conciliation?
    options:
      - text: Arbitration — its award is final and binding, whereas conciliation recommendations are not binding.
        correct: true
        why: "Correct — the adjudicatory modes bind: arbitral awards are final and binding upon the parties, while conciliation produces non-binding recommendations the parties may use to negotiate."
      - text: Conciliation — a conciliation report binds once both states have appointed the experts.
        why: Tempting because the states choose the conciliators, but choosing the third party does not make its report binding; conciliation recommendations remain non-binding.
      - text: Mediation — the mediator's framework binds once it has been proposed in writing.
        why: Tempting because a written framework seems formal, but the slides say the solutions offered by a mediator are not binding, however they are recorded.
  - key: q312
    type: mcq
    concept: diplomatic-modes-of-settlement
    difficulty: 2
    stem: The UN mission in Lebanon and France in the 1970s are the slides' examples of which mode?
    options:
      - text: Mediation
        why: Tempting because both involve a neutral third party, but the slides use Richard Holbrooke in the Bosnian War as the mediation example, not the Lebanon mission.
      - text: Good offices
        correct: true
        why: "Correct — the slides give the UN good offices mission in Lebanon (and France in the 1970s) as examples of good offices: a third party facilitating direct negotiations."
      - text: Conciliation
        why: Tempting because the UN often sets up commissions, but the slides' conciliation example is the Timor Sea Conciliation Commission between Timor-Leste and Australia.
      - text: Inquiry
        why: Tempting because the UN investigates situations, but the slides' inquiry examples are the Syria Commission of Inquiry and the MH17 Joint Investigation Team.
  - key: q313
    type: mcq
    concept: diplomatic-modes-of-settlement
    difficulty: 2
    stem: Who can act as the third party in good offices, on the lecture's account?
    options:
      - text: Only the UN Secretary-General, acting on a request from both parties.
        why: Tempting because the UN does offer good offices, but the lecturer said the third party can equally be an individual, a group, one state or several states.
      - text: An individual, a group of individuals, one state or a group of states.
        correct: true
        why: Correct — the lecturer said the third party, neutral and trusted by both sides, can be an individual, a group of individuals, one state or a group of states.
      - text: Only a state that is a permanent member of the Security Council.
        why: Tempting because great powers often broker talks, but nothing limits good offices to permanent members; any neutral party trusted by both sides may act.
  - key: q314
    type: mcq
    concept: diplomatic-modes-of-settlement
    difficulty: 3
    stem: Which statement about the diplomatic modes of settlement is correct?
    options:
      - text: "They are mutually exclusive: once a state chooses one, art 33(1) bars the others."
        why: Tempting because the lecture presents them as distinct, but the lecturer said that although presented separately they are often combined; nothing in art 33(1) bars that.
      - text: They are often combined, e.g. mediation together with a fact-finding mission.
        correct: true
        why: Correct — the lecturer stressed that although presented as distinct modes, they are often combined — for instance, mediation with a fact-finding mission.
      - text: They must be used in the order listed in art 33(1), negotiation first.
        why: Tempting because art 33(1) lists negotiation first and the lecture follows that order, but no sequence is required; the order runs from flexible to rigid for teaching.
  - key: q315
    type: mcq
    concept: diplomatic-modes-of-settlement
    difficulty: 3
    stem: How did the lecturer distinguish conciliation from a fact-finding mission?
    options:
      - text: It looks at the parties' interests and recommends a way forward, rather than finding who is right.
        correct: true
        why: "Correct — the lecturer said conciliation combines mediation and fact-finding, but its point is not to find who is wrong: it looks at the context, parameters and interests and recommends a basis for agreement."
      - text: Conciliation decides the facts conclusively, whereas inquiry only proposes how the facts might be found.
        why: Tempting because both produce reports, but inquiry is the mode aimed at the facts; neither conclusively decides anything, as both reports are non-binding.
      - text: Conciliation binds the parties, whereas a fact-finding report is purely advisory.
        why: Tempting because conciliation looks more formal, but its recommendations are not binding; the parties may use the report to negotiate but are not bound by it.
  - key: q316
    type: mcq
    concept: diplomatic-modes-of-settlement
    difficulty: 2
    stem: Richard Holbrooke's role in the Bosnian War illustrates which feature of mediation?
    options:
      - text: The mediator takes a direct role, proposing a framework the parties could accept.
        correct: true
        why: "Correct — the slides use Holbrooke as the example of mediation: the third party assumes a more direct role and suggests a framework of settlement; the lecturer said it proved acceptable to the parties."
      - text: The mediator issues a binding award after hearing written and oral submissions.
        why: Tempting because the outcome helped end a war, but mediation does not produce a binding award; that is arbitration. The mediator's solutions are not binding.
      - text: The mediator only carries messages between the parties, making no suggestions.
        why: Tempting because message-carrying is a facilitating role, but that is closer to good offices; a mediator goes further and suggests solutions.
  - key: q317
    type: mcq
    concept: diplomatic-modes-of-settlement
    difficulty: 4
    variant-of: q308
    stem: Two neighbouring states disagree about whether a border incident involved troops from State S. They ask a panel of independent experts to establish what happened and report. Which mode is this, and is the report binding?
    options:
      - text: Inquiry; the report is usually non-binding, though the parties can use it to settle.
        correct: true
        why: Correct — inquiry or fact-finding is used when parties disagree over the facts; the outcome is usually a report that is non-binding but which the parties can use to settle their dispute.
      - text: Arbitration; the panel's report is an award, binding on both of the states.
        why: Tempting because an expert panel decides something, but arbitration determines the parties' legal rights in a binding award; establishing disputed facts in a report is inquiry.
      - text: Conciliation; the report becomes binding once both states have received it.
        why: Tempting because conciliation also involves experts and reports, but conciliation recommendations are never binding, and the focus here is purely on disputed facts.
  - key: q318
    type: truefalse
    concept: diplomatic-modes-of-settlement
    difficulty: 1
