cards:
  - type: basic
    concept: existence-of-a-dispute
    front: How did Mavrommatis (PCIJ, 1924) define a legal dispute?
    back: "\"A disagreement on a point of law or fact, a conflict of legal views or interests between persons.\""
    source: Week 08 Lecture Slides, slide 10
  - type: cloze
    concept: existence-of-a-dispute
    text: |-
      "Whether there exists an international dispute is a matter for {{c1::objective determination}}", and "the mere
      {{c2::denial}} of the existence of a dispute does not prove its non-existence" (Peace Treaties, 1950).
    source: Week 08 Lecture Slides, slide 10
  - type: basic
    concept: existence-of-a-dispute
    front: What is the South West Africa (1962) test for the existence of a dispute?
    back: "The two sides \"hold clearly opposite views\": the claim of one party is \"positively opposed\" by the other, and the respondent was aware, or could not have been unaware, of that opposition."
    source: Week 08 Lecture Slides, slide 11
  - type: cloze
    concept: existence-of-a-dispute
    text: If a dispute does not exist at the {{c1::date of institution of legal proceedings}}, the adjudicating body has {{c2::no jurisdiction}} to deal with the case.
    source: Week 08 Lecture Slides, slide 9
  - type: apply
    concept: existence-of-a-dispute
    scenario: State A files against State B the day after its cabinet privately decides that B is breaching a treaty; A never tells B.
    answer: "No dispute: B was not aware, and could not have been aware, that its views were positively opposed (South West Africa; communication, Marshall Islands). With no dispute at filing, the ICJ lacks jurisdiction."
    source: Week 08 Lecture Slides, slide 11
  - type: cloze
    concept: obligation-of-peaceful-settlement
    text: "Art 2(3) UN Charter: All Members shall settle their international disputes by {{c1::peaceful means}} in such a manner that international peace and security, and {{c2::justice}}, are not endangered."
    source: Week 08 Lecture Slides, slide 13
  - type: basic
    concept: obligation-of-peaceful-settlement
    front: Is the obligation of peaceful settlement an obligation of conduct or of result?
    back: "Of conduct: states must seek a peaceful settlement but are not legally obliged to reach any particular settlement — which is why some disputes last for decades."
    source: Week 08 Lecture Slides, slide 15
  - type: basic
    concept: obligation-of-peaceful-settlement
    front: Which case confirms that the obligation of peaceful settlement is binding under customary international law?
    back: Military and Paramilitary Activities in and against Nicaragua (Nicaragua v United States of America) [1986] ICJ Rep 14, para 290.
    source: Week 08 Lecture Slides, slide 14
  - type: cloze
    concept: obligation-of-peaceful-settlement
    text: Art 33(1) ends its list of means with "{{c1::other peaceful means of their own choice}}", so the list is {{c2::open-ended}}.
    source: Week 08 Lecture Slides, slide 16
  - type: basic
    concept: diplomatic-modes-of-settlement
    front: Good offices v mediation — what is the difference?
    back: "Good offices: a neutral third party offers to facilitate efforts to enter direct negotiations. Mediation: the third party takes a more direct role and suggests a framework of settlement or solutions — which are not binding."
    source: Week 08 Lecture Slides, slide 19
  - type: basic
    concept: diplomatic-modes-of-settlement
    front: What does North Sea Continental Shelf (para 85) say negotiation presupposes?
    back: "\"A genuine attempt by one of the disputing parties to engage in discussions with the other disputing party, with a view to resolving the dispute.\""
    source: Week 08 Lecture Slides, slide 18
  - type: cloze
    concept: diplomatic-modes-of-settlement
    text: In conciliation, a third party produces a report with {{c1::non-binding recommendations}}; the parties may use it to {{c2::negotiate a settlement}} but are not bound by it.
    source: Week 08 Lecture Slides, slide 21
  - type: basic
    concept: diplomatic-modes-of-settlement
    front: When is inquiry (fact-finding) used? Give the slides' two examples.
    back: When parties disagree over the factual circumstances of their dispute. E.g. the UN International Commission of Inquiry in Syria; the Joint Investigation Team on the 2014 shooting down of a Malaysian Airlines plane in Ukraine (held Russia responsible; Russia rejected its findings).
    source: Week 08 Lecture Slides, slide 20
  - type: apply
    concept: diplomatic-modes-of-settlement
    scenario: Two states ask a respected former diplomat to help them restart stalled talks; she makes no proposals of her own.
    answer: Good offices — a neutral, trusted third party facilitating direct negotiations. The outcome stays in the parties' hands and nothing is binding.
    source: Week 08 Lecture Slides, slide 19
  - type: basic
    concept: international-arbitration
    front: What are the two ways of consenting to international arbitration?
    back: (1) Becoming party to a treaty that provides for arbitration of future disputes (e.g. UNCLOS); (2) a special agreement (compromis) submitting a particular dispute after it has arisen.
    source: Week 08 Lecture Slides, slide 23
  - type: cloze
    concept: international-arbitration
    text: In arbitration, states control the {{c1::composition}} of the tribunal, the {{c2::rules to be applied}} and whether proceedings are {{c3::confidential}}.
    source: Week 08 Lecture Slides, slide 24
  - type: basic
    concept: international-arbitration
    front: What is the effect of an arbitral award, and how long do arbitral tribunals last?
    back: Awards are final and binding upon the parties — unlike the outcome of the diplomatic modes. Arbitral tribunals are ad hoc (temporary).
    source: Week 08 Lecture Slides, slide 24
  - type: apply
    concept: international-arbitration
    scenario: Two states want a binding decision on their boundary, judges they choose themselves and a hearing out of the public eye.
    answer: "Arbitration: founded on consent (here a compromis), the parties control composition, applicable rules and confidentiality, and the award is final and binding."
    source: Week 08 Lecture Slides, slide 24
  - type: basic
    concept: icj-cases-and-effect-of-decisions
    front: How is the ICJ composed?
    back: 15 regular judges, elected by the UN Security Council and the General Assembly for 9-year terms; disputing parties may in principle appoint an ad hoc judge.
    source: Week 08 Lecture Slides, slide 25
  - type: basic
    concept: icj-cases-and-effect-of-decisions
    front: Contentious cases v advisory opinions?
    back: "Contentious: legal disputes between states, submitted by them — binding between the parties only. Advisory: legal questions referred by UN organs and specialised agencies (art 96 UN Charter; art 65 ICJ Statute) — non-binding."
    source: Week 08 Lecture Slides, slide 26
  - type: cloze
    concept: icj-cases-and-effect-of-decisions
    text: "Art 60 ICJ Statute: \"The judgment is {{c1::final and without appeal}}.\" It binds only {{c2::the parties to the dispute}} and cannot oblige third parties (arts 59, 61)."
    source: Week 08 Lecture Slides, slide 35
  - type: basic
    concept: icj-cases-and-effect-of-decisions
    front: What can a party do if the other party fails to comply with an ICJ judgment?
    back: Under art 94 UN Charter it may bring the matter before the Security Council, which can make recommendations or decide on measures to give effect to the judgment (art 94(2)).
    source: Week 08 Lecture Slides, slide 35
  - type: basic
    concept: icj-jurisdiction-and-consent
    front: What are the four ways of consenting to ICJ jurisdiction (art 36)?
    back: (1) Compromis; (2) a treaty clause allowing disputes to be brought before the Court; (3) an optional clause declaration under art 36(2); (4) forum prorogatum.
    source: Week 08 Lecture Slides, slide 32
  - type: cloze
    concept: icj-jurisdiction-and-consent
    text: Only {{c1::sovereign states}} may be parties in contentious cases (art 34); international organisations can only request {{c2::advisory opinions}} (arts 65–68).
    source: Week 08 Lecture Slides, slide 31
  - type: basic
    concept: icj-jurisdiction-and-consent
    front: What is compétence de la compétence?
    back: The Court's competence to rule on its own jurisdiction — art 36(6) ICJ Statute.
    source: Week 08 Lecture Slides, slide 32
  - type: apply
    concept: icj-jurisdiction-and-consent
    scenario: State A and State B are both parties to the Genocide Convention; A files against B alleging genocide against a minority group in B.
    answer: "Consent via a treaty clause: art IX submits disputes on the Convention's interpretation, application or fulfilment to the ICJ at the request of any party. A must also show that a dispute existed at filing."
    source: Week 08 Tutorial Tasks, question 2
  - type: cloze
    concept: provisional-measures
    text: "Art 41 ICJ Statute: the Court may indicate {{c1::provisional measures}} \"to preserve the {{c2::respective rights of either party}}\"."
    source: Week 08 Lecture Slides, slide 33
  - type: basic
    concept: provisional-measures
    front: What are the four conditions for provisional measures?
    back: (1) The absence of jurisdiction is not manifest; (2) the rights claimed are at least plausible; (3) a link between the rights and the measures (appropriate and necessary); (4) a real and imminent risk of irreparable harm before the final decision.
    source: Week 08 Lecture Slides, slide 33
  - type: basic
    concept: provisional-measures
    front: In the ICJ's view, are its provisional measures binding?
    back: "Yes — LaGrand (2001), para 102: the power to indicate them \"entails that such measures should be binding\"; any other reading would be contrary to the object and purpose of art 41."
    source: Week 08 Lecture Slides, slide 34
  - type: apply
    concept: provisional-measures
    scenario: Under a treaty with an ICJ dispute clause, State C asks for measures to stop State D demolishing a sacred site next week, pending judgment.
    answer: "Likely indicated: jurisdiction is not manifestly absent, the rights are plausible, the measure is linked to them, and demolition is a real, imminent and irreparable harm. The measures bind D (LaGrand)."
    source: Week 08 Tutorial Tasks, question 2
  - type: basic
    concept: regional-and-economic-dispute-settlement
    front: What does art 52(2) UN Charter require of members of regional arrangements?
    back: They "shall make every effort to achieve pacific settlement of local disputes" through those arrangements or agencies before referring them to the Security Council.
    source: Week 08 Lecture Slides, slide 39
  - type: cloze
    concept: regional-and-economic-dispute-settlement
    text: "Arab League Charter art 7: unanimous Council decisions bind {{c1::all member states}}; majority decisions bind {{c2::only those that accept them}}."
    source: Week 08 Lecture Slides, slide 43
  - type: basic
    concept: regional-and-economic-dispute-settlement
    front: What are the WTO's key rules, and where are its disputes settled?
    back: Fixed upper limits on tariffs (art II and schedules), a general prohibition on non-tariff barriers (art XI), and non-discrimination (most-favoured-nation and national treatment); disputes are settled under Annex 2, the Understanding on rules and procedures governing the settlement of disputes.
    source: Week 08 Lecture Slides, slides 47–48
  - type: basic
    concept: regional-and-economic-dispute-settlement
    front: Which peaceful procedures does art 25 of the OAS Charter list?
    back: Direct negotiation, good offices, mediation, investigation and conciliation, judicial settlement, arbitration, and those the parties to the dispute especially agree upon at any time.
    source: Week 08 Lecture Slides, slide 42
audio:
  title: Week 8 recap — international dispute settlement
  minutes: 3
  script: |-
    International disputes are about facts, the application of law and jurisdiction, and the whole point of peaceful
    settlement is to resolve them before they escalate. First question: is there even a dispute? Mavrommatis gives the
    definition — a disagreement on a point of law or fact, a conflict of legal views or interests. Whether one exists is
    decided objectively, so a respondent's denial proves nothing, as the Peace Treaties opinion says. South West Africa
    gives the test: one side's claim is positively opposed by the other, and the respondent knew or could not have been
    unaware of it. That means more than friction, some communication between the parties, and a low threshold, and
    Georgia v Russia tells us to examine the facts — statements and diplomatic notes. It matters because without a
    dispute when proceedings start, the court has no jurisdiction.

    Article 2(3) of the Charter obliges states to settle disputes peacefully, and article 2(4) bars force. The
    obligation is customary too, according to Nicaragua, and it is one of conduct, not result: states must keep trying,
    but they never have to settle, which is why Canada and Denmark could argue over Hans Island for fifty years.

    Article 33(1) lists the means, and the list is open-ended. The diplomatic ones don't bind: negotiation, which keeps
    control with the parties and needs good faith; good offices, where a neutral third party helps the parties start
    talking; mediation, where the third party proposes a framework, like Holbrooke in Bosnia; inquiry, for disputed
    facts; and conciliation, a report with recommendations, like the Timor Sea commission. The adjudicatory ones do
    bind. Arbitration rests on consent, by treaty or by compromis, and the states choose the arbitrators, the rules and
    confidentiality; awards are final and binding.

    At the ICJ, fifteen judges, only states as parties, and no compulsory jurisdiction. Consent comes four ways: a
    compromis, a treaty clause like article IX of the Genocide Convention, optional clause declarations under article
    36(2), or forum prorogatum, and the Court decides its own jurisdiction. Provisional measures under article 41 need
    jurisdiction that is not manifestly absent, plausible rights, a link, and a real and imminent risk of irreparable
    harm, and LaGrand says they bind. Judgments are final, without appeal and binding only on the parties, with article
    94 sending non-compliance to the Security Council. Advisory opinions, like Chagos, carry weight but don't bind.
    Finally, article 52 puts regional bodies first for local disputes, and the WTO settles trade disputes under Annex 2.
