  - slug: existence-of-a-dispute
    title: The existence of a legal dispute
    visual: simulation
    visual-brief: Four switches — opposed views on an identifiable issue, communication between the parties, the respondent aware (or unable to be unaware), and opposition in place before the filing date — feed a gate marked "dispute exists"; a respondent's bare denial is a fifth switch wired to nothing, and the jurisdiction lamp lights only when the gate opens.
