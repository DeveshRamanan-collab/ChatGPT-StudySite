questions:
  - key: q101
    type: mcq
    concept: existence-of-a-dispute
    difficulty: 1
    set: pretest
    stem: Why can the existence of a dispute decide whether the ICJ can hear a case?
    options:
      - text: If no dispute exists at the date proceedings are instituted, the Court has no jurisdiction to deal with the case.
        correct: true
        why: "Correct — the slides say the existence of a dispute can play a decisive role in jurisdiction: if no dispute exists at the date of institution of proceedings, the adjudicating body has no jurisdiction."
      - text: Because a dispute must have gone through at least a year of failed negotiation before any application can be filed.
        why: Tempting because negotiation often comes first, but the materials set no minimum period; the question is simply whether a dispute existed at the date proceedings were instituted.
      - text: Because the Security Council must first certify that a dispute exists before the Court may proceed with it.
        why: Tempting because the Security Council features in the Charter's dispute provisions, but nothing requires its certification; the Court determines objectively whether a dispute exists.
  - key: q102
    type: mcq
    concept: existence-of-a-dispute
    difficulty: 1
    cases:
      - mavrommatis-palestine-concessions-greece-v-great-britain
    stem: Which definition of a legal dispute did the Permanent Court of International Justice give in Mavrommatis Palestine Concessions?
    options:
      - text: A situation whose continuance is likely to endanger the maintenance of international peace and security.
        why: Tempting because it echoes art 33(1) UN Charter, but that phrase describes which disputes trigger the duty to seek a peaceful solution; it is not the Mavrommatis definition.
      - text: A disagreement on a point of law or fact, a conflict of legal views or interests between persons.
        correct: true
        why: Correct — Mavrommatis (PCIJ, 1924) defines a legal dispute as a disagreement on a point of law or fact, a conflict of legal views or interests between persons (for us, mostly states).
      - text: Any breach of an international obligation that is attributable to a state and has caused another state injury.
        why: Tempting because it borrows Week 7's internationally wrongful act, but a dispute is a disagreement over law or fact; it does not require a proven breach or injury.
  - key: q103
    type: mcq
    concept: existence-of-a-dispute
    difficulty: 2
    cases:
      - interpretation-of-peace-treaties-with-bulgaria-hungary-and-romania
    stem: State R tells the ICJ that "there is simply no dispute between us". What weight does that denial carry?
    options:
      - text: It is decisive, because a dispute requires both parties to accept that they disagree.
        why: Tempting because a dispute involves two sides, but if a respondent's word were decisive it could escape any case simply by denying the dispute — which the Court rejects.
      - text: "On its own it proves nothing: the existence of a dispute is a matter for objective determination."
        correct: true
        why: "Correct — Peace Treaties (1950): whether a dispute exists \"is a matter for objective determination\", and \"the mere denial of the existence of a dispute does not prove its non-existence\"."
      - text: It shifts the burden to the applicant to prove the dispute beyond any reasonable doubt.
        why: Tempting because the applicant must show a dispute, but no criminal standard applies; the Court objectively examines the facts, such as statements and diplomatic exchanges.
  - key: q104
    type: mcq
    concept: existence-of-a-dispute
    difficulty: 2
    cases:
      - south-west-africa-ethiopia-v-south-africa-liberia-v-south-africa
    stem: According to South West Africa (1962), when is a dispute said to exist?
    options:
      - text: When the claim of one party is positively opposed by the other, and the respondent was or could not have been unaware of it.
        correct: true
        why: "Correct — South West Africa requires clearly opposite views: the claim of one party positively opposed by the other, with the respondent aware, or unable to be unaware, of that opposition."
      - text: When one state has formally notified the other of its claim and offered to negotiate it.
        why: Tempting because communication matters, but notice and an offer to negotiate are not the test; what matters is positive opposition of views that the respondent knew of.
      - text: When the Security Council has found the situation likely to endanger peace and security.
        why: Tempting because art 33(1) mentions endangering peace, but no Security Council finding is needed; the Court determines the existence of a dispute itself from the facts.
  - key: q105
    type: mcq
    concept: existence-of-a-dispute
    difficulty: 2
    stem: Two states' ministers trade sharp remarks about each other's fishing industries at a trade summit, without identifying any legal claim. Does this alone show a dispute?
    options:
      - text: Yes — any public disagreement is a dispute, as the threshold is low.
        why: Tempting because the threshold is low, but the slides say a dispute is more than mere friction; there must be clearly opposite views on a specific, identifiable issue.
      - text: "No — a dispute needs more than friction: opposed views on an identifiable issue."
        correct: true
        why: "Correct — the lecture stresses a dispute is more than mere friction: the clearly opposite views must relate to a specific, identifiable issue or set of issues."
      - text: No — a dispute can only arise from an exchange of formal diplomatic notes, never from statements.
        why: Tempting because diplomatic notes are strong evidence, but public statements also count; the Georgia v Russia approach examines statements and exchanges alike.
  - key: q106
