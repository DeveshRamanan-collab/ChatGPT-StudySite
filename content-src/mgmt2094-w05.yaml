      - left: Theory of psychoticism
        right: Eysenck
      - left: Humanistic theory
        right: Maslow; Rogers and Fromm
  - key: q401
    type: mcq
    concept: humanistic-theory-and-maslows-types
    difficulty: 1
    stem: According to the humanistic theory, when are we free and comfortable enough to express ourselves creatively?
    options:
      - text: After a traumatic event, when we pull back from our surroundings
        why: Tempting because the psychoanalytical theory says this, but the humanistic theory ties creativity to needs being met, not to trauma.
      - text: Once we get to self-actualisation in Maslow's hierarchy of needs
        correct: true
        why: Correct — the slide says once we get to self-actualisation we are free and comfortable enough to express ourselves in a creative manner.
      - text: When a substance removes the stress that inhibits our creativity
        why: Tempting because stress does inhibit creativity, but removing it with substances is the addiction theory, not the humanistic theory.
      - text: Whenever a lucky accident interrupts the work we are doing
        why: Tempting because immunisation came from an interruption, but that is creativity by accident, not the humanistic theory.
  - key: q402
    type: mcq
    concept: humanistic-theory-and-maslows-types
    difficulty: 1
    stem: Who is named with the humanistic theory of creativity?
    options:
      - text: Maslow; Rogers and Fromm
        correct: true
        why: Correct — the slide names Maslow, Rogers and Fromm; Maslow's hierarchy of needs is at the heart of the theory.
      - text: Jung; Freud, Adler and Hammer
        why: Tempting because they are also psychologists, but they are named with the psychoanalytical theory.
      - text: Eysenck
        why: Tempting because Eysenck is also a personality theorist, but the slide names him with the theory of psychoticism.
      - text: Herrmann
        why: Tempting because Herrmann also offers a model of thinking, but he is the source of the Whole Brain Model.
  - key: q403
    type: mcq
    concept: humanistic-theory-and-maslows-types
    difficulty: 1
    stem: What sits at the top of Maslow's hierarchy of needs?
    options:
      - text: Esteem needs
        why: Tempting because esteem (respect, status, recognition) is near the top, but it is the level just below self-actualisation.
      - text: Self-actualisation
        correct: true
        why: Correct — self-actualisation, "the desire to become the most that one can be", tops the hierarchy; there the humanistic theory places creativity.
      - text: Love and belonging
        why: Tempting because connection matters to everyone, but love and belonging sits in the middle of the hierarchy.
      - text: Safety needs
        why: Tempting because security underpins everything, but safety is the second level from the bottom.
  - key: q404
    type: mcq
    concept: humanistic-theory-and-maslows-types
    difficulty: 2
    stem: Which of Maslow's types of creativity lets us escape the daily grind and stress of life, through painting, drawing or writing?
    options:
      - text: Primary
        correct: true
        why: Correct — primary creativity allows us to escape the daily grind and stress of life; we channel it into painting, drawing, writing and so on.
      - text: Secondary
        why: Tempting because it follows primary, but secondary creativity is a higher level of thought, more thought out and involved.
      - text: Integrated
        why: Tempting because it includes primary creativity, but integrated creativity combines both types and is planned before we begin.
  - key: q405
    type: mcq
    concept: humanistic-theory-and-maslows-types
    difficulty: 2
    stem: Maslow's integrated creativity…
    options:
      - text: is the lowest type, used mainly to cope with stress
        why: Tempting because it includes the escape element, but the lowest, stress-escaping type is primary creativity.
      - text: "combines both: it may start spontaneously, but much thought comes first"
        correct: true
        why: Correct — the slide says integrated creativity combines both; it may be spontaneous at first, but a lot more thought goes in before we begin.
      - text: is careful, planned thought with no spontaneity in it at any stage of the work
        why: Tempting because integrated creativity involves much thought, but the slide says it may be spontaneous when we commence.
      - text: means creating as part of a group of people rather than working alone
        why: Tempting because "integrated" sounds social, but it integrates the two types of creativity, not people.
  - key: q406
    type: mcq
    concept: humanistic-theory-and-maslows-types
    difficulty: 2
    stem: Which examples of integrated creativity do the slides give?
    options:
      - text: Painting, drawing and writing
        why: Tempting because they are creative activities, but the slide uses them as examples of primary creativity, the escape from stress.
      - text: Philosophy and scientific discoveries
        correct: true
        why: Correct — the slide gives philosophy and scientific discoveries as examples of integrated creativity.
      - text: Lateral thinking and brainstorming
        why: Tempting because they are creative techniques, but the slides use them under creative association.
      - text: Immunisation and the discovery of radioactivity
        why: Tempting because they are scientific discoveries, but the slides use them as examples of creativity by accident.
  - key: q407
    type: mcq
    concept: humanistic-theory-and-maslows-types
    difficulty: 3
    stem: What claim does the humanistic theory make about environment?
    options:
      - text: "Not a factor: meeting all your needs lets you choose to be creative"
        correct: true
        why: Correct — the slide says the theory argues environment is not a factor; a person who can meet all their needs can then choose to be creative.
      - text: "It is the only factor: hard environments force people to be creative"
        why: Tempting because hardship drives creativity in the psychoanalytical theory, but the humanistic theory says environment is not a factor.
      - text: It matters only for primary creativity, not secondary or integrated
        why: Tempting because primary creativity responds to life's stress, but the theory makes no such split; environment is not a factor.
  - key: q408
    type: mcq
    concept: humanistic-theory-and-maslows-types
    difficulty: 2
    stem: After a stressful week, an accountant spends Sunday sketching in a park just to unwind. Which type of creativity is this?
    options:
      - text: Primary
        correct: true
        why: Correct — sketching to escape the stress of the week is primary creativity; the lecture adds it need not be any good to count.
      - text: Secondary
        why: Tempting because she chose the activity deliberately, but secondary creativity is a higher level of thought, not escape from stress.
      - text: Integrated
        why: Tempting because sketching can be serious art, but integrated creativity combines spontaneity with much prior thought about what to achieve.
  - key: q409
    type: mcq
    concept: humanistic-theory-and-maslows-types
    difficulty: 3
    variant-of: q408
    stem: An R&D team spends months defining what a new battery must achieve, then builds on an idea that emerges spontaneously during testing. Which type of creativity best fits?
    options:
      - text: Primary
        why: Tempting because the breakthrough was spontaneous, but primary creativity is an escape from the stress of life, not a planned research goal.
      - text: Secondary
        why: Tempting because the work was carefully planned, but the spontaneous element means it combines both types.
      - text: Integrated
        correct: true
        why: Correct — much thought about what they hoped to achieve, plus a spontaneous idea, is integrated creativity; scientific discovery is the slide's example.
  - key: q410
    type: mcq
    concept: humanistic-theory-and-maslows-types
    difficulty: 3
    stem: Which needs sit directly below esteem in Maslow's hierarchy?
    options:
      - text: "Safety: personal security, employment, resources, health"
        why: Tempting because safety is one of the lower needs, but it sits below love and belonging, two levels under esteem.
      - text: "Love and belonging: friendship, intimacy, family, connection"
        correct: true
        why: Correct — the slide runs physiological, safety, love and belonging, esteem, self-actualisation; love and belonging is just below esteem.
      - text: "Physiological: air, water, food, shelter, sleep, clothing"
        why: Tempting because they are basic needs, but physiological needs form the base, far below esteem.
      - text: "Self-actualisation: the desire to become the most one can be"
        why: Tempting because it is next to esteem, but self-actualisation sits above esteem, not below it.
  - key: q411
    type: mcq
    concept: humanistic-theory-and-maslows-types
    difficulty: 2
    stem: Under the humanistic theory, creativity is central to…
    options:
      - text: our growth and learning processes
        correct: true
        why: Correct — the slide says creativity is central to our growth and learning processes.
      - text: coping with repressed emotions and traumatic events
        why: Tempting because creativity can help people cope, but repressed emotion and trauma belong to the psychoanalytical theory.
      - text: removing the stress that blocks our ability to think
        why: Tempting because stress does block creativity, but removing stress is the addiction theory's tenet, not the humanistic one.
  - key: q412
    type: mcq
    concept: humanistic-theory-and-maslows-types
    difficulty: 3
    stem: A manager wants her staff to be more creative. Applying the humanistic theory, what should she check first?
    options:
      - text: Whether her staff have faced enough hardship to spur their creativity
        why: Tempting because hardship drives creativity in the psychoanalytical theory, but the humanistic theory points the other way.
      - text: Whether any of her staff were born with the gift of genius
        why: Tempting because some people seem naturally creative, but the gift of genius is creativity by grace, not the humanistic theory.
      - text: Whether staff's needs — security, belonging, respect — are met
        correct: true
        why: Correct — on the humanistic theory creativity follows once needs are met; the lecture said we cannot be creative unless they are, at least partly.
      - text: Whether her staff use substances to bring down their stress
        why: Tempting because stress impairs creativity, but substances belong to the addiction theory, which the lecturer warned against following.
  - key: q413
    type: mcq
    concept: humanistic-theory-and-maslows-types
    difficulty: 4
    contrasts-with:
      - psychological-theories-of-creativity
    stem: A refugee founder builds a successful company soon after arriving with nothing. Which theory explains this more easily, and why?
    options:
      - text: "Psychoanalytical: creativity can react to hardship, and her needs were unmet"
        correct: true
        why: Correct — her lower needs (safety, resources) were not met, which strains the humanistic account; reacting creatively to difficult circumstances is psychoanalytical.
      - text: "Humanistic: she must already have reached self-actualisation before she started"
        why: Tempting because she succeeded, but arriving with nothing means her safety and esteem needs were unmet, the opposite of the theory's starting point.
      - text: "Creativity by grace: only a born genius could achieve this without support"
        why: Tempting because the achievement is striking, but grace offers no explanation beyond "a gift", while hardship is the fact the story turns on.
  - key: q414
    type: mcq
    concept: humanistic-theory-and-maslows-types
    difficulty: 2
    stem: Secondary creativity is described as…
    options:
      - text: a way to escape the daily grind and the stress of life
        why: Tempting because it is one of Maslow's types, but escaping the daily grind is primary creativity.
      - text: a mix of spontaneity at the start and planning before it
        why: Tempting because it sounds advanced, but combining spontaneity and planning describes integrated creativity.
      - text: a higher level of thought, more thought out than primary
        correct: true
        why: Correct — the slide says secondary creativity is a higher level of thought to achieve, more thought out and involved than primary.
  - key: q415
    type: mcq
    concept: humanistic-theory-and-maslows-types
    difficulty: 4
    stem: What is a weakness of the humanistic claim that environment is not a factor in creativity, judged against the other theories this week?
    options:
      - text: It names no proponents on the slides, so it cannot be tested against anything
        why: Tempting as a quick objection, but the slide names Maslow, Rogers and Fromm.
      - text: Hardship theories and chance discoveries suggest circumstances matter
        correct: true
        why: Correct — the psychoanalytical theory makes difficult circumstances the trigger, and accidental discoveries arose from interruptions and errors in the environment.
      - text: It cannot explain painting or writing, only scientific work
        why: Tempting because it stresses self-actualisation, but Maslow's primary creativity is expressly about painting, drawing and writing.
      - text: It treats creativity as a divine gift beyond anyone's control
        why: Tempting because both see creativity as personal, but a divine gift is creativity by grace; the humanistic theory says people choose to be creative.
  - key: q416
    type: mcq
    concept: humanistic-theory-and-maslows-types
    difficulty: 3
    variant-of: q409
    stem: A novelist plans the philosophy of her book for a year before writing, yet lets scenes come spontaneously as she drafts. Which type of creativity?
    options:
      - text: Primary
        why: Tempting because the scenes come spontaneously, but she is not escaping stress; she is pursuing a long-planned aim.
      - text: Integrated
        correct: true
        why: Correct — spontaneity when she writes plus much prior thought about what she hopes to achieve is integrated creativity, like philosophy.
      - text: Secondary
        why: Tempting because the planning is a higher level of thought, but the spontaneous drafting means it combines both types.
  - key: q417
    type: mcq
    concept: humanistic-theory-and-maslows-types
    difficulty: 2
    stem: Which list gives the safety needs on Maslow's hierarchy slide?
    options:
      - text: Respect, self-esteem, status, recognition, strength, freedom
        why: Tempting because these are needs too, but they are the esteem needs, two levels above safety.
      - text: Friendship, intimacy, family, sense of connection
        why: Tempting because they feel like security, but they are love and belonging, the level above safety.
      - text: Personal security, employment, resources, health, property
        correct: true
        why: Correct — the slide lists personal security, employment, resources, health and property as safety needs.
      - text: Air, water, food, shelter, sleep, clothing, reproduction
        why: Tempting because shelter feels like safety, but this whole list is the physiological needs at the base.
  - key: q418
    type: truefalse
    set: quickfire
    concept: humanistic-theory-and-maslows-types
    difficulty: 1
    statement: The humanistic theory argues that hardship is what drives people to be creative.
    answer: false
    why: False — the humanistic theory says creativity follows once needs are met, at self-actualisation; hardship as the driver is the psychoanalytical theory.
  - key: q419
    type: truefalse
    set: quickfire
    concept: humanistic-theory-and-maslows-types
    difficulty: 2
    statement: Maslow's primary creativity must produce work of high value to count.
