    body: |-
      Creative problem solving moves through six stages, alternating **divergent thinking** (coming up with many
      possible solutions to the one problem) and **convergent thinking** (solving a problem with only one single correct
      solution):

      1. **Objective finding** — defines the problem area. Divergence lists problems; convergence picks the most relevant,
         using hits and hotspots found by questioning ownership (is one motivated to solve it?), priority (how important?)
         and critical nature (how urgent?).
      2. **Fact finding** — gather the information. It increases comprehension, helps new ideas, and may show the problems
         from a new perspective.
      3. **Problem finding** — uses the previous stage's hits to define the problem correctly: the most productive problem
         definition possible.
      4. **Idea finding** — mainly divergent: many ideas, using a variety of idea generation aids.
      5. **Solution finding** — the choice of ideas that can be transformed into workable solutions.
      6. **Acceptance finding** — a divergent activity to implement solutions successfully: list obstacles and ways to
         overcome them, develop preventive actions and contingency plans, generate an action plan.

      The process is intuitive and natural (it builds on our creative processes rather than replacing them), research
      based, generalisable to all aspects of life, and a higher order thinking skill with sub-skills. The slides also list
      five conditions of creative thinking: receptivity, immersion, seeing questions, utilisation of errors and detached
      devotion.

      Exam use: name the stage and say whether the move is divergent or convergent.
  - slug: defining-the-problem
    title: How you define the problem (Markman)
    visual: simulation
    visual-brief: "A problem statement acts as a cue dropped into memory: a specific statement (the vacuum bag) pulls up nearby knowledge; an abstract one (separate dirt from air) reaches distant knowledge such as industrial cyclones; several statements together reach both."
    related:
      - creative-problem-solving-process
      - grace-accident-association-and-cognitive-theories
    depends-on:
      - creative-problem-solving-process
    contrasts-with:
      - creative-problem-solving-process
    cases: []
    authorities:
      - mgmt2094-markman-2017-how-you-define-the-problem
      - mgmt2094-example-dyson-bagless-vacuum
    verify: false
    body: |-
      Markman (2017) argues that stories of invention focus on the novel solution — Dyson's bagless vacuum,
      Picasso and Braque's cubism, Xerox PARC's spatial desktop — which makes creativity seem a mystery. In fact most
      creative solutions are found inside the collective memory of the people working on the problem: someone knows
      something that will help; they just haven't realised it yet.

      Memory works by cues: think of a birthday party and hats, cake and singing come to mind; switch to salad and you
      recall lettuce, tomatoes and dressing. **In creative problem solving, the statement of the problem is the cue to
      memory.** Change the description and new information is drawn out.

      Dyson: thinking about vacuum bags reminds you of bags (hence the patent numbers on most bags). Describe the problem as
      "separate the dirt from the air" and the bag drops out — and industrial cyclones, which spin air to throw particles to
      the edges, become one answer. Generalising removes the specific components usually used to solve the problem.

      There is no ideal problem statement. The most consistently creative people and groups find many descriptions: some
      specific (the objects acted on), retrieving closely related knowledge; others abstract (relationships, or the goal),
      retrieving more distantly related knowledge. Tapping memory is more cost-effective and repeatable than luck
      (Archimedes in the bath) or huge research budgets.

      Not "think outside the box", but find more descriptions of the box.

      Exam use: rewrite a business problem at two levels of abstraction.
  - slug: four-creative-thinking-preferences
    title: Four preferences for thinking creatively
    visual: simulation
    visual-brief: Four team seats — Clarifier, Ideator, Developer, Implementer — that the learner fills; each empty seat names what the team will miss, and a team of one preference names that preference’s risk.
    related:
      - whole-brain-model
      - creative-problem-solving-process
    depends-on: []
    contrasts-with:
      - whole-brain-model
    cases: []
    authorities:
      - mgmt2094-example-creative-gadgets-tutorial
    verify: false
    body: |-
      There are four ways to have a preference for a creative way of thinking:

      1. **Clarifier** — asks "are we really solving the right problem?"; likes research and gathering information; attends
         to detail and is methodical; asks lots of questions because they crave information; wants to be quick to move to
         the solution.
      2. **Ideator** — looks at the big picture and dreams of possibilities; toys with ideas, stretches the imagination,
         jumps from A to Z; adventurous.
      3. **Developer** — takes an idea and tinkers with it, improving on others' ideas; puts together workable solutions and
         analyses competing ones, pros and cons. A perfectionist who can get stuck developing the perfect solution and may
         be seen as a nit-picker.
      4. **Implementer** — quick to action, always moving forward; needs to see ideas hit fruition; decisive and
         determined. Can leap into action too soon, appear pushy and oversell their idea.

      Understanding your preference can improve your creative performance. In teams, others who think differently should
      lead to complementary ideas, solving a problem more effectively by taking into account the different paths to the
      solution. The lecture linked this to emotional intelligence: knowing your strengths and weaknesses, and seeing them in
      others, lets you match traits in a team.

      Example: the Week 5 tutorial's group innovative (video) project — work with your team, create a schedule.

      Exam use: identify the preference from behaviour, name its risk, and say which preference balances it.
