  - slug: wallas-model-of-creative-thinking
    title: Wallas' model of creative thinking — five stages
    visual: palace
    visual-brief: Five rooms in order — Preparation, Incubation, Intimation, Illumination, Verification — each tagged with its level of consciousness (conscious, nonconscious, fringe), so the walk dips below awareness and climbs back to a conscious check.
    related:
