cards:
  - type: basic
    concept: whole-brain-model
    front: Name the four quadrants of the Whole Brain Model and their thinking.
    back: A logical, analytical, fact based, quantitative; B organised, sequential, planned, detailed; C interpersonal, feeling based, kinaesthetic, emotional; D holistic, intuitive, integrating, synthesising.
    source: Week 05 Lecture Materials, slide 3
  - type: cloze
    concept: whole-brain-model
    text: In a Whole Brain profile, preferred mode is {{c1::1}}, competent mode is {{c2::2}} and avoidance is given a {{c3::3}}.
    source: Week 05 Lecture Materials, slide 4
  - type: cloze
    concept: whole-brain-model
    text: The {{c1::A and B}} sides are the preparation and verification; the {{c2::C and D}} sides are the incubation and illumination.
    source: Week 05 Lecture Materials, slide 4
  - type: apply
    concept: whole-brain-model
    scenario: A marketer scores D = 1 and A = 3. She must forecast next quarter's sales from last year's data.
    answer: "The task needs A (logical, quantitative), which she avoids: be aware of it and consciously push herself there, or draw on a teammate who prefers A."
    source: Week 05 Lecture Materials, slide 4; Week 05 Lecture Transcript
  - type: cloze
    concept: wallas-model-of-creative-thinking
    text: "Wallas' stages: Preparation → {{c1::Incubation}} → {{c2::Intimation}} → Illumination → {{c3::Verification}}."
    source: Week 05 Lecture Materials, slide 5
  - type: basic
    concept: wallas-model-of-creative-thinking
    front: What is Intimation, and where does it sit in consciousness?
    back: An inkling that a solution may well be on its way; it sits in the fringe of consciousness, only partly open to attention, linking Incubation and Illumination.
    source: Week 05 Lecture Materials, slide 5; Sadler-Smith (2015) reading, pp 346–347
  - type: basic
    concept: wallas-model-of-creative-thinking
    front: Why does Sadler-Smith (2015) prefer a five-stage reading of Wallas?
    back: Wallas devoted 12 pages of The Art of Thought to Intimation, so the familiar four-stage model does not reflect his full account.
    source: Sadler-Smith (2015) reading, p 346
  - type: basic
    concept: wallas-model-of-creative-thinking
    front: What are the two forms of Incubation, and which suits harder problems?
    back: Distraction (conscious work on other problems), better for less difficult creative thought; and mental relaxation from all mental work, better for difficult thought such as a scientific discovery.
    source: Sadler-Smith (2015) reading, p 345
  - type: apply
    concept: wallas-model-of-creative-thinking
    scenario: After weeks on a pricing problem, a manager suddenly sees the answer while swimming, then spends two days testing it against sales data.
    answer: The swim answer is Illumination (after Incubation); the two days of testing are Verification — checking practicality, effectiveness and appropriateness.
    source: Week 05 Lecture Materials, slide 5
  - type: basic
    concept: wallas-model-of-creative-thinking
    front: What did Wallas take from Helmholtz and from Poincaré?
    back: "From Helmholtz, three stages: investigating a problem in all directions, a period away from it, and happy ideas arriving without effort. From Poincaré, the need for (and the term) verification."
    source: Sadler-Smith (2015) reading, pp 343–345
  - type: basic
    concept: psychological-theories-of-creativity
    front: Main tenet of the psychoanalytical theory of creativity?
    back: People become more creative as a reaction to difficult circumstances and/or repressed emotions; creativity is an outlet, and inferiority can contribute.
    source: Week 05 Lecture Materials, slide 6
  - type: basic
    concept: psychological-theories-of-creativity
    front: What does the mental illness theory claim, and who proposes it?
    back: "Briggs, Eisemann and Goodman: some form of mental illness needs to be present for creativity, but not severe, as that can impede — e.g. bipolar, manic-depressive, severe mood swings."
    source: Week 05 Lecture Materials, slide 7
  - type: basic
    concept: psychological-theories-of-creativity
    front: What is the counter-argument to the addiction theory?
    back: Addiction doesn't cause creativity; those with creative tendencies are more prone to addiction.
    source: Week 05 Lecture Materials, slide 8
  - type: cloze
    concept: psychological-theories-of-creativity
    text: "Eysenck: psychoticism is seen as {{c1::halfway}} between a \"normal\" person and the state of {{c2::psychosis}}."
    source: Week 05 Lecture Materials, slide 9
  - type: cloze
    concept: psychological-theories-of-creativity
    text: Freud suggests that "{{c1::unsatisfied wishes}} are the driving power behind fantasies".
    source: Week 05 Lecture Materials, slide 6
  - type: basic
    concept: humanistic-theory-and-maslows-types
    front: When does the humanistic theory say we can be creative?
    back: Once we get to self-actualisation in Maslow's hierarchy we are free and comfortable enough to express ourselves creatively; environment is not a factor.
    source: Week 05 Lecture Materials, slide 10
  - type: cloze
    concept: humanistic-theory-and-maslows-types
    text: "Maslow's hierarchy from the base: {{c1::physiological}}, {{c2::safety}}, love and belonging, {{c3::esteem}}, self-actualisation."
    source: Week 05 Lecture Materials, slide 11
  - type: basic
    concept: humanistic-theory-and-maslows-types
    front: Maslow's three types of creativity?
    back: "Primary: escape the daily grind or stress (painting, drawing, writing). Secondary: a higher level of thought, more thought out. Integrated: combines both, e.g. philosophy and scientific discoveries."
    source: Week 05 Lecture Materials, slide 12
  - type: apply
    concept: humanistic-theory-and-maslows-types
    scenario: A nurse writes poetry on her days off purely to unwind from shift work.
    answer: Primary creativity — creativity that allows her to escape the daily grind and stress of life.
    source: Week 05 Lecture Materials, slide 12
  - type: basic
    concept: grace-accident-association-and-cognitive-theories
    front: Creativity by grace vs creativity by accident?
    back: "Grace: the idea of genius, a divine gift of superhuman potential. Accident: creativity rises by chance — e.g. immunisation from an interruption in work, radioactivity from a wrong hypothesis."
    source: Week 05 Lecture Materials, slide 13
  - type: basic
    concept: grace-accident-association-and-cognitive-theories
    front: Creative association vs cognitive creativity?
    back: "Association: applying procedures from one area to another (the basis of lateral thinking and brainstorming). Cognitive: creativity is a normal human activity of reasoning, recognition and understanding."
    source: Week 05 Lecture Materials, slide 14
  - type: basic
    concept: grace-accident-association-and-cognitive-theories
    front: What does 'chance favours the prepared mind' add to creativity by accident?
    back: "Becquerel could not have discovered radioactivity by chance unless he was already immersed in the research: accidents still need Preparation."
    source: Sadler-Smith (2015) reading, p 348
  - type: basic
    concept: grace-accident-association-and-cognitive-theories
    front: Claman's four ways to spark creativity in a rut?
    back: Think new; look for intersections; capitalise on obstacles; share what you know.
    source: Claman (2017) reading, pp 3–4
  - type: cloze
    concept: creative-problem-solving-process
    text: Divergent thinking is coming up with {{c1::many possible solutions}} to the one problem; convergent thinking is solving a problem with {{c2::only one single correct solution}}.
    source: Week 05 Lecture Materials, slide 15
  - type: cloze
    concept: creative-problem-solving-process
    text: "Creative problem solving: Objective, {{c1::Fact}}, {{c2::Problem}}, Idea, {{c3::Solution}}, Acceptance Finding."
    source: Week 05 Lecture Materials, slide 17
  - type: basic
    concept: creative-problem-solving-process
    front: In objective finding, which three questions identify hits and hotspots?
    back: Ownership (is one motivated to solve it?), priority (how important is the problem?) and critical nature (how urgent is it?).
    source: Week 05 Lecture Materials, slide 18
  - type: basic
    concept: creative-problem-solving-process
    front: What three things does acceptance finding involve?
    back: Listing implementation obstacles and ways to overcome them; developing preventive actions and contingency plans; generating an action plan.
    source: Week 05 Lecture Materials, slide 21
  - type: basic
    concept: creative-problem-solving-process
    front: Name the five conditions of creative thinking.
    back: Receptivity, immersion, seeing questions, utilisation of errors, detached devotion.
    source: Week 05 Lecture Materials, slide 16
  - type: apply
    concept: creative-problem-solving-process
    scenario: A gym chain has listed fifteen member complaints and is ranking them by how motivated staff are to fix them, how important and how urgent they are.
    answer: "Objective Finding: divergent listing of problem areas, then convergence using ownership, priority and critical nature."
    source: Week 05 Lecture Materials, slide 18
  - type: cloze
    concept: defining-the-problem
    text: "Markman: in creative problem solving, the {{c1::statement of the problem}} is the cue to {{c2::memory}}."
    source: Markman (2017) reading
  - type: basic
    concept: defining-the-problem
    front: How does Markman explain Dyson's bagless vacuum?
    back: Thinking about bags recalls bags; describing the problem as "separate the dirt from the air" drops the bag and cues other ways of separating particles from air, such as industrial cyclones.
    source: Markman (2017) reading
  - type: apply
    concept: defining-the-problem
    scenario: A council asks, "How do we build more car parks in the town centre?"
    answer: Generalise the statement to the goal — e.g. "How do people reach the town centre easily?" — to cue knowledge beyond car parks; also keep some specific statements.
    source: Markman (2017) reading
  - type: basic
    concept: four-creative-thinking-preferences
    front: Name the four preferences for thinking creatively, one line each.
    back: "Clarifier: are we solving the right problem? Ideator: big picture, dreams of possibilities. Developer: tinkers with and improves ideas. Implementer: quick to action, needs ideas to hit fruition."
    source: Week 05 Lecture Materials, slides 23–24
  - type: basic
    concept: four-creative-thinking-preferences
    front: Risks the slides attach to Developers and Implementers?
    back: Developers can get stuck developing the perfect solution and be seen as nit-pickers; Implementers can leap into action too soon, appear pushy and oversell their idea.
    source: Week 05 Lecture Materials, slide 24
  - type: apply
    concept: four-creative-thinking-preferences
    scenario: A team has three Implementers and no Clarifier, and is about to launch a campaign next week.
    answer: Risk of leaping into action too soon and overselling; no one is asking whether they are solving the right problem — add a Clarifier and slow down to check the problem.
    source: Week 05 Lecture Materials, slides 23–25
audio:
  title: Week 5 recap — creativity theories and creative thinking
  minutes: 3
  script: |-
    Week five is a tour of creativity theories, and the exam will want us to name them, tell them apart and apply them. Start with Herrmann's Whole Brain Model: four quadrants. A is logical and quantitative, B organised and planned, C interpersonal and feeling based, D holistic and synthesising. Our profile scores each one: one for preferred, two for competent, three for avoided, and two quadrants can share a number. A and B carry preparation and verification; C and D carry incubation and illumination. The task decides which quadrant we need, so if we avoid it, we push ourselves there or lean on a teammate. And the quadrants are a model, not a map of the brain.
     Wallas' model gives the creative process five stages: preparation, incubation, intimation, illumination, verification. Sadler-Smith shows Wallas wrote twelve pages on intimation, the feeling that a solution is coming before we know what it is. Helmholtz found ideas on slow walks up wooded hills; Poincaré warned that an idea that feels certain can still fail the test of verification.
     Then the theories of where creativity comes from. Psychoanalytical: creativity as a reaction to hardship and repressed emotion. Mental illness: a mild disorder, not a severe one. Addiction: substances remove stress, though the counter-argument says creative people are just more prone to addiction. Psychoticism, from Eysenck: halfway to psychosis, rejecting norms. The humanistic theory flips all of this: once our needs are met, at self-actualisation, we can choose to be creative. Maslow adds primary, secondary and integrated creativity. Grace says genius is a gift; accident says chance; association says borrow procedures from another area; cognitive says creativity is a normal human activity. Remember chance favours the prepared mind.
     Creative problem solving runs objective, fact, problem, idea, solution and acceptance finding, diverging to list and converging to choose. Markman tells us the problem statement is the cue to memory: Dyson stopped thinking about bags and asked how to separate dirt from air. Claman reminds us everyone is creative, but ruts kill it, so think new, look for intersections, capitalise on obstacles and share what we know.
     Finally, the four preferences: Clarifier, Ideator, Developer, Implementer. Developers can get stuck perfecting; Implementers can leap too soon. Mix them, and a team gets complementary ideas.
