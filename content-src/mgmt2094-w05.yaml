  - key: q119
    type: truefalse
    set: quickfire
    concept: whole-brain-model
    difficulty: 2
    statement: The A and B sides of the Whole Brain Model are linked to incubation and illumination.
    answer: false
    why: False — the slide links A and B to preparation and verification; the C and D sides are the incubation and illumination.
  - key: q120
    type: short
    concept: whole-brain-model
    difficulty: 3
    prompt: "\"A team of strong analytical planners has everything it needs to be creative.\" Discuss, using the Whole Brain Model and applying it to a start-up whose three founders all score 1 on the A and B quadrants and 3 on C and D."
    model: |-
      The statement is only half right: analytical planning carries part of the creative process, not all of it.
      Herrmann's Whole Brain Model profiles how a person first looks at a problem across four quadrants: A logical and
      quantitative, B organised and planned, C interpersonal and feeling based, D holistic and synthesising. Preferred mode
      is 1, competent 2, avoidance 3. The slide maps A–B to preparation and verification and C–D to incubation and
      illumination. These founders will prepare thoroughly and check rigorously, but all three avoid the sides that carry
      incubation and illumination, and C, where they would read how customers and staff feel. Poincaré's discoveries show
      both halves are needed: ideas arrived during incubation, and only then did conscious verification follow. The lecture's
      advice is to accept that the task decides the quadrant: be aware of an avoided quadrant and consciously push towards
      it, and build a team whose preferences complement each other — here, recruit or partner with someone who prefers C and
      D. The limit is that the model is a profile of thinking styles, not of the brain itself, so it signals a risk rather
      than proving one.
    rubric:
      - id: r1
        criterion: Concept — explains the four quadrants, the 1/2/3 codes and the mapping to the creative process.
        marks: 2
        top-band: Defines all four quadrants with the slide words, the three codes, and the A–B / C–D mapping.
        margin-note: Which stages do A–B and C–D carry?
        authorities: []
      - id: r2
        criterion: Example — uses a real example from the materials.
        marks: 2
        top-band: Uses Poincaré (incubation then verification) or Helmholtz to show both halves of the process at work.
        margin-note: Name a real case from the readings.
        authorities:
          - mgmt2094-example-poincare-mathematical-discovery
      - id: r3
        criterion: Application — applies the profile to the founders.
        marks: 3
        top-band: Identifies the avoided C–D work (incubation, illumination, people) and recommends conscious effort plus complementary team members.
        margin-note: What exactly will this team miss?
        authorities: []
      - id: r4
        criterion: Evaluation — states a limit of the model.
        marks: 2
        top-band: Notes the quadrants do not necessarily correspond to how the brain works, so the profile signals risk rather than proves it.
        margin-note: How far can a profile be trusted?
        authorities: []
  - key: q201
    type: mcq
    concept: wallas-model-of-creative-thinking
    difficulty: 1
    set: pretest
    stem: In Wallas' model, which stage is the 'subconscious mulling of the problem'?
    options:
      - text: Incubation
        correct: true
        why: Correct — the slide defines Incubation as subconscious mulling of the problem; the reading adds it is nonconscious and not open to introspection.
      - text: Preparation
        why: Tempting because Preparation also focuses on the problem, but it is conscious work exploring the problem's dimensions, not subconscious mulling.
      - text: Intimation
        why: Tempting because Intimation follows Incubation, but it is the inkling that a solution is on its way, in the fringe of consciousness.
      - text: Illumination
        why: Tempting because Illumination comes out of the subconscious work, but it is the "eureka" moment when the idea bursts through.
  - key: q202
    type: mcq
    concept: wallas-model-of-creative-thinking
    difficulty: 1
    stem: Which is the correct order of the five stages on the slide?
    options:
      - text: Preparation, Intimation, Incubation, Illumination, Verification
        why: Tempting because Intimation and Incubation sound alike, but the inkling (Intimation) comes after the subconscious mulling (Incubation).
      - text: Preparation, Incubation, Intimation, Illumination, Verification
        correct: true
        why: Correct — the slide numbers them 1 to 5 in this order; Intimation links Incubation and Illumination.
      - text: Incubation, Preparation, Illumination, Intimation, Verification
        why: Tempting only if you think mulling comes first, but Preparation opens the process by exploring the problem's dimensions.
      - text: Preparation, Incubation, Illumination, Intimation, Verification
        why: Tempting because the familiar four-stage version jumps from Incubation to Illumination, but Intimation comes before the flash, not after it.
  - key: q203
    type: mcq
    concept: wallas-model-of-creative-thinking
    difficulty: 1
    stem: What does Verification focus on in Wallas' model?
    options:
      - text: Exploring the problem's dimensions before any idea appears
        why: Tempting because both Preparation and Verification are conscious, but exploring dimensions is Preparation, at the start.
      - text: An inkling that a solution may well be on its way
        why: Tempting because it sits late in the sequence, but this is Intimation, before the idea arrives.
      - text: The practicality, effectiveness and appropriateness of the idea
        correct: true
        why: Correct — the slide says Verification focuses on the practicality, effectiveness and appropriateness of the idea.
      - text: The "eureka" moment when the idea bursts through
        why: Tempting because it is the most memorable stage, but the burst of discovery is Illumination; Verification checks it.
  - key: q204
    type: mcq
    concept: wallas-model-of-creative-thinking
    difficulty: 2
    stem: Intimation is best described as…
    options:
      - text: an inkling that a solution may well be on its way
        correct: true
        why: Correct — the slide defines Intimation as an inkling that a solution may well be on its way; the reading places it in the fringe of consciousness.
      - text: the moment of discovery when the whole idea bursts through
        why: Tempting because the two are close in time, but the moment of discovery is Illumination, which follows Intimation.
      - text: conscious, effortful work exploring the dimensions of the problem
        why: Tempting because Intimation is partly conscious, but deliberate exploration of the problem is Preparation.
      - text: the logical check of whether the idea is practical and appropriate
        why: Tempting because it involves judgement, but the practical check is Verification, the last stage.
  - key: q205
    type: mcq
    concept: wallas-model-of-creative-thinking
    difficulty: 2
    stem: Why does Sadler-Smith (2015) argue Wallas' model is better read as five stages?
    options:
      - text: Later neuroscience found a fifth stage that Wallas could not have known about
        why: Tempting because the article discusses neuroscience, but the argument comes from a close reading of Wallas' own book, not new evidence.
      - text: Wallas spent 12 pages on Intimation, linking Incubation and Illumination
        correct: true
        why: Correct — the article shows Wallas devoted 12 pages of his "Stages of Control" chapter to Intimation, so a five-stage model is more authentic.
      - text: Wallas split Verification into two stages, one logical and one social
        why: Tempting because the article discusses social verification by the field, but that is an addition to Verification, not a separate fifth stage.
      - text: Poincaré added Intimation to the four stages after The Art of Thought appeared
        why: Tempting because Poincaré shaped the model, but his work predates Wallas, and Intimation is Wallas' own fringe-consciousness stage.
  - key: q206
    type: mcq
    concept: wallas-model-of-creative-thinking
    difficulty: 2
    stem: In the reading's model, which two stages are voluntary, effortful, conscious work?
    options:
      - text: Preparation and Verification
        correct: true
        why: Correct — the reading says Preparation and Verification are achieved voluntarily and effortfully through conscious work; they "book-end" the process.
      - text: Incubation and Intimation
        why: Tempting because both are in the middle of the process, but Incubation is involuntary and nonconscious, and Intimation is in the fringe.
      - text: Intimation and Illumination
        why: Tempting because both concern the idea surfacing, but Intimation is fringe consciousness and Illumination is an instantaneous flash, not effortful work.
      - text: Incubation and Verification
        why: Tempting because Verification is right, but Incubation is involuntary and effortless — the opposite of voluntary, effortful work.
  - key: q207
    type: mcq
    concept: wallas-model-of-creative-thinking
    difficulty: 2
    stem: Where does Intimation sit in the three levels of proximity to consciousness?
    options:
      - text: Fully in consciousness, alongside Preparation and Verification
        why: Tempting because the person is aware of something, but the reading places Intimation in the fringe, not in full consciousness.
      - text: In nonconsciousness, wholly closed to introspection
        why: Tempting because it grows out of Incubation, but nonconsciousness is where Incubation sits; Intimation is partly open to attention.
      - text: In the fringe of consciousness, partly open to attention
        correct: true
        why: Correct — Intimation occurs in the fringe of consciousness zone and is amenable only partly to attention and influence (Sadler-Smith 2015).
  - key: q208
    type: mcq
    concept: wallas-model-of-creative-thinking
    difficulty: 3
    stem: A marketing team brainstorms a campaign all week with no breakthrough. The lead then stops working on it entirely and goes hiking for the weekend. In Wallas' terms, the weekend is…
    options:
      - text: Incubation, through mental relaxation
        correct: true
        why: Correct — stepping away from all mental work is the "mental relaxation" form of Incubation, and the reading notes physical exercise may help it.
      - text: Preparation, because she is still gathering facts
        why: Tempting because the problem is unsolved, but Preparation is conscious work on the problem; on the hike she is not working on it at all.
      - text: Verification, because she is testing the campaign
        why: Tempting because she is out of the office, but there is no idea yet to check; Verification follows Illumination.
      - text: Illumination, because time away guarantees the idea
        why: Tempting because ideas often come on walks, as with Helmholtz, but time away is Incubation; Illumination is the flash itself, and it is not guaranteed.
  - key: q209
    type: mcq
    concept: wallas-model-of-creative-thinking
    difficulty: 3
    stem: Driving to work, a designer has a nagging sense she is about to crack the packaging problem, though she can't yet say how. Which stage is this?
    options:
      - text: Illumination
        why: Tempting because she senses the answer, but Illumination is the flash when the idea itself arrives; she does not have it yet.
      - text: Intimation
        correct: true
        why: "Correct — knowing a solution is coming without knowing what it is matches Intimation: \"I often know that the solution is coming, though I don't know what the solution will be\"."
      - text: Incubation
        why: Tempting because the work has been subconscious, but Incubation is not open to introspection; a felt sense of nearness is Intimation.
      - text: Preparation
        why: Tempting because she is thinking about the problem, but Preparation is deliberate exploration of the problem, not an inkling of an answer.
  - key: q210
    type: mcq
    concept: wallas-model-of-creative-thinking
    difficulty: 3
    stem: Why does the lecture stress Verification for people who generate lots of ideas?
    options:
      - text: Because such people skip Preparation, and Verification takes its place
        why: Tempting because both are conscious stages, but Verification checks an idea after Illumination; it cannot replace Preparation.
      - text: Because their problem is often matching and fitting ideas to the problem, so each must be checked for fit and effectiveness
        correct: true
        why: Correct — the lecture says overly creative people generate lots of ideas, but the problem is often to match and fit the solutions to the problem.
      - text: Because Verification is the stage where new ideas are produced in bulk
        why: Tempting because the lecture discusses prolific people here, but producing ideas is not Verification; it checks their practicality and effectiveness.
      - text: Because Verification is unconscious, so prolific people do it automatically
        why: Tempting because some stages are unconscious, but Verification is conscious, logical work under voluntary control.
  - key: q211
    type: mcq
    concept: wallas-model-of-creative-thinking
    difficulty: 3
    stem: According to Sadler-Smith, which form of incubation did Wallas think better suits more difficult creative thought, such as a scientific discovery?
    options:
      - text: Mental relaxation from all mental work
        correct: true
        why: Correct — for difficult creative thought (a scientific discovery, a poem, a political decision) Wallas preferred a period of total mental relaxation.
      - text: "Distraction: conscious work on other problems"
        why: Tempting because distraction is the other form of incubation, but Wallas thought it more effective for less difficult work, like a preacher's sermon.
      - text: Continuous conscious effort on the same problem
        why: Tempting because hard problems seem to need hard work, but continuous conscious work on the problem is not incubation at all.
  - key: q212
    type: mcq
    concept: wallas-model-of-creative-thinking
    difficulty: 2
    stem: Whose accounts did Wallas chiefly draw on to build his stages?
    options:
      - text: Freud and Jung, from psychoanalysis
        why: Tempting because Wallas' psychology drew partly on Freud, but the reading says the model rests largely on Helmholtz and Poincaré.
      - text: Helmholtz and Poincaré
        correct: true
        why: Correct — Wallas discerned three stages from Helmholtz's birthday speech and added Verification from Poincaré's account of mathematical creation.
      - text: Maslow, Rogers and Fromm
        why: Tempting because they are also named this week, but they are the proponents of the humanistic theory of creativity.
      - text: Herrmann and Eysenck
        why: Tempting because both are on this week's slides, but Herrmann has the Whole Brain Model and Eysenck the theory of psychoticism.
  - key: q213
    type: mcq
    concept: wallas-model-of-creative-thinking
    difficulty: 3
    stem: Poincaré warned that an inspiration felt with absolute certainty…
    options:
      - text: is always right, so in practice verification can safely be skipped
        why: Tempting because certainty usually is not a deceiver, as Poincaré said, but he insisted it is not a rule without exception.
      - text: can still deceive, and must be put to the test of verification
        correct: true
        why: Correct — certitude can deceive "without being any the less vivid", and ideas from a half-asleep state especially must be verified.
      - text: means that incubation has failed and must be started again
        why: Tempting because the reading discusses impasses, but certainty does not signal failed incubation; it is a feeling that still needs checking.
      - text: should be abandoned at once, because certainty signals bias
        why: Tempting as healthy scepticism, but Poincaré did not abandon inspirations; he verified them through conscious work.
  - key: q214
    type: mcq
    concept: wallas-model-of-creative-thinking
    difficulty: 4
    stem: The reading says Verification is also social. Who plays that role for a new venture's idea?
    options:
      - text: The domain — the knowledge mastered during Preparation
        why: Tempting because domain and field are paired in the reading, but the domain enables Preparation; the field verifies.
      - text: The fringe of consciousness, where Intimation occurs
        why: Tempting because the fringe is part of the model, but it is a level of consciousness in the creator, not an outside judge.
      - text: The field — gatekeepers such as investors and venture capitalists
        correct: true
        why: "Correct — the reading says Verification takes place within the field: experts such as critics, investors and venture capitalists act as gatekeepers."
      - text: "No one else: Verification is the creator's private, logical check"
        why: Tempting because Verification is conscious and logical, but the reading adds that it is culturally bound and enacted by the field.
  - key: q215
    type: mcq
    concept: wallas-model-of-creative-thinking
    difficulty: 2
    stem: The slide says Wallas' model is a structured approach to creative problem solving that needs…
    options:
      - text: time and a variety of people
        correct: true
        why: Correct — the slide says it needs time and a variety of people; the lecture adds that teams with different preferences complement each other.
      - text: a single expert working alone under heavy time pressure
        why: Tempting because insight stories feature lone geniuses, but the slide asks for time and a variety of people, the opposite.
      - text: a fixed, short deadline so that incubation is avoided
        why: Tempting because deadlines can focus effort, but incubation is a stage of the model and needs time, not avoidance.
      - text: no preparation, so that the subconscious stays fresh
        why: Tempting as a romantic idea, but Preparation is stage one; the reading says chance favours the prepared mind.
  - key: q216
    type: mcq
    concept: wallas-model-of-creative-thinking
    difficulty: 4
    contrasts-with:
      - creative-problem-solving-process
    stem: How does Wallas' model differ from the six-stage creative problem-solving process?
    options:
      - text: Wallas' model has no stage for checking ideas; creative problem solving adds one
        why: Tempting because the CPS stages are more numerous, but Wallas has Verification, which checks practicality and effectiveness.
      - text: They are the same model, with Incubation renamed Idea Finding
        why: Tempting because both include idea generation, but Incubation is subconscious mulling; Idea Finding is deliberate, divergent generation.
      - text: Wallas traces how an idea forms, including nonconscious stages; CPS is a deliberate sequence that alternates divergent and convergent thinking
        correct: true
        why: Correct — Wallas' stages run through subconscious mulling and fringe consciousness; CPS moves deliberately from objective finding to acceptance finding.
      - text: CPS is only for individuals, while Wallas' model works only in teams
        why: Tempting because the Wallas slide mentions a variety of people, but neither model is restricted that way; CPS can be used in all aspects of life.
  - key: q217
    type: mcq
    concept: wallas-model-of-creative-thinking
    difficulty: 2
    variant-of: q209
    stem: A chemist wakes at 3 am with the full answer suddenly clear — a "click". Which stage is this?
    options:
      - text: Illumination
        correct: true
        why: Correct — Wallas restricted Illumination to the instantaneous, unexpected "flash" or "click" in which the idea bursts through.
      - text: Intimation
        why: Tempting because it happens before any check, but Intimation is only the sense that a solution is coming; here the answer has arrived.
      - text: Incubation
        why: Tempting because the night was spent in subconscious work, but that was Incubation; the sudden answer itself is Illumination.
      - text: Verification
        why: Tempting because she now has an answer to test, but testing comes next; the click is Illumination.
  - key: q218
    type: truefalse
    set: quickfire
    concept: wallas-model-of-creative-thinking
    difficulty: 1
    statement: "Wallas' model, as usually summarised, has four stages: Preparation, Incubation, Illumination and Verification."
    answer: true
    why: True — the reading says the model is usually cited with those four stages; the slide and Sadler-Smith add Intimation to make five.
  - key: q219
    type: truefalse
    set: quickfire
    concept: wallas-model-of-creative-thinking
    difficulty: 2
    statement: In the reading, Incubation is open to introspection, so you can watch it happening.
    answer: false
    why: False — Sadler-Smith says Incubation is achieved involuntarily and effortlessly through nonconscious work and is not open to introspection.
  - key: q220
    type: truefalse
    set: quickfire
    concept: wallas-model-of-creative-thinking
    difficulty: 2
    statement: Wallas borrowed the term verification directly from Poincaré.
    answer: true
    why: True — the reading says the term verification is borrowed directly by Wallas from Poincaré, who used it three times in his account.
  - key: q221
    type: short
    concept: wallas-model-of-creative-thinking
    difficulty: 3
    prompt: "\"Once a team has its eureka moment, the creative work is done.\" Discuss, using Wallas' model and applying it to a product team that has just had a flash of insight for a new subscription service and wants to launch next week."
    model: |-
      The statement mistakes one stage for the whole process. Wallas' model sets out the creative process as Preparation (exploring the problem's dimensions), Incubation
      (subconscious mulling), Intimation (an inkling that a solution is on its way), Illumination (the "eureka" moment) and
      Verification (the practicality, effectiveness and appropriateness of the idea). Sadler-Smith (2015) shows that
      Preparation and Verification are conscious, effortful work that book-end the process. The team is at Illumination: the
      idea feels right, but Poincaré warned that inspirations felt with certainty can still fail "the test of verification".
      Before launching, they should verify consciously: does the service fit the problem they prepared, is it practical to
      deliver, and is it appropriate for their customers? The reading adds that Verification is also social — investors and
      other gatekeepers in the field will judge it — so testing with them is part of the stage. The lecture warns that
      prolific idea generators often fail at matching ideas to problems. The trade-off is speed: Verification costs time,
      but the slide says the model needs time and a variety of people, so a short, structured check by a mixed team is the
      sensible compromise.
    rubric:
      - id: r1
        criterion: Concept — sets out the five stages accurately.
        marks: 2
        top-band: Names all five stages in order with the slide definitions, noting Intimation as the fifth.
        margin-note: Which stage is the team in now?
        authorities:
          - mgmt2094-sadler-smith-2015-wallas-four-stage-model
      - id: r2
        criterion: Example — uses a real example from the materials.
        marks: 2
        top-band: Uses Poincaré's warning that certain-feeling inspirations can fail verification, or Helmholtz.
        margin-note: Give the real case that shows why checking matters.
        authorities:
          - mgmt2094-example-poincare-mathematical-discovery
      - id: r3
        criterion: Application — applies Verification to the launch.
        marks: 3
        top-band: Turns practicality, effectiveness and appropriateness into concrete checks, including the field (investors, customers) as gatekeepers.
        margin-note: What exactly should they check before launch?
        authorities: []
      - id: r4
        criterion: Evaluation — weighs the trade-off.
        marks: 2
        top-band: Weighs the cost of delay against the risk of an unverified idea, using the slide's "needs time and a variety of people".
        margin-note: Is there a cost to verifying?
        authorities: []
  - key: q222
    type: match
    concept: wallas-model-of-creative-thinking
    difficulty: 2
    prompt: Match each stage of Wallas' model to its description.
    pairs:
      - left: Preparation
        right: Focuses on the problem and explores the problem's dimensions
      - left: Incubation
        right: Subconscious mulling of the problem
      - left: Intimation
        right: An inkling that a solution may well be on its way
      - left: Illumination
        right: Discovery — "eureka", the idea bursts through
      - left: Verification
        right: Focus on practicality, effectiveness and appropriateness
  - key: q301
    type: mcq
    concept: psychological-theories-of-creativity
    difficulty: 1
    set: pretest
    stem: Which theory holds that people become more creative as a reaction to difficult circumstances and/or repressed emotions?
    options:
      - text: The humanistic theory
        why: Tempting because it is the other big psychological theory, but it says creativity follows once needs are met — the opposite of hardship.
      - text: The psychoanalytical theory
        correct: true
        why: Correct — the slide gives this as the main tenet of the psychoanalytical theory (Jung; Freud, Adler and Hammer).
      - text: The cognitive theory
        why: Tempting because it also explains creativity in ordinary people, but it treats creativity as a normal activity of reasoning, not a reaction to hardship.
      - text: The creative theory of psychoticism
        why: Tempting because it also links creativity to the psyche, but it rests on a disposition for psychotic tendencies, not a reaction to circumstances.
  - key: q302
    type: mcq
    concept: psychological-theories-of-creativity
    difficulty: 1
    stem: Who is named on the slide with the creative theory of psychoticism?
    options:
      - text: Maslow
        why: Tempting because Maslow is the best-known name this week, but he is named with the humanistic theory and the three types of creativity.
      - text: Freud
        why: Tempting because Freud is linked to unusual mental states, but he is named with the psychoanalytical theory.
      - text: Eysenck
        correct: true
        why: "Correct — the slide names Eysenck with the creative theory of psychoticism: creative people have a disposition for psychotic tendencies."
      - text: Goodman
        why: Tempting because Goodman is also linked to mental states, but he is named (with Briggs and Eisemann) with the mental illness theory.
  - key: q303
    type: mcq
    concept: psychological-theories-of-creativity
    difficulty: 2
    stem: According to the mental illness theory, how severe must the mental illness be?
    options:
      - text: "Not severe: severe illness can actually impede creativity"
        correct: true
        why: Correct — the slide says it doesn't have to be severe, as this can actually impede; the lecture adds serious illness leaves no room to produce anything.
      - text: Severe, because only serious illness produces truly original work
        why: Tempting because the theory links illness and creativity, but the slide warns that severe illness can impede creativity.
      - text: Formally diagnosed, because undiagnosed illness does not count
        why: Tempting because "illness" sounds clinical, but the slide says nothing about diagnosis; it only says the illness need not be severe.
      - text: Severity is irrelevant; only the type of disorder matters
        why: "Tempting because the slide lists disorder types, but it also addresses severity directly: not severe, as severe can impede."
  - key: q304
    type: mcq
    concept: psychological-theories-of-creativity
    difficulty: 2
    stem: Which disorders does the slide associate with the mental illness theory of creativity?
    options:
      - text: Anxiety, phobias and obsessive-compulsive disorder
        why: Tempting because these are common disorders, but the slide lists bipolar, manic-depressive and severe mood swings instead.
      - text: Bipolar, manic-depressive and severe mood swings
        correct: true
        why: Correct — the slide lists bipolar, manic-depressive and severe mood swings as the common disorders associated with the theory.
      - text: Psychosis, along with full-blown schizophrenia
        why: Tempting because psychosis appears this week, but it belongs to Eysenck's psychoticism theory, which sits "halfway" to psychosis, not in it.
  - key: q305
    type: mcq
    concept: psychological-theories-of-creativity
    difficulty: 2
    stem: What did Verhaeghen and colleagues find, according to the slides?
    options:
      - text: A reflective mode makes people more creative but can also lead to depression
        correct: true
        why: Correct — the slide reports that in a reflective mode people become more creative, but it can also lead to depression, as with artists and writers.
      - text: Stress makes people more creative because it sharpens their focus on the task
        why: Tempting because the slide discusses stress on the same page, but it says stress actually impairs creativity by distracting us.
      - text: Alcohol removes the stress that blocks creativity in writers
        why: Tempting because that idea appears this week, but it is a tenet of the addiction theory, not Verhaeghen's finding.
      - text: Creative people are no more prone to low moods than anyone else
        why: Tempting as a cautious conclusion, but the study links reflection to depression, as seen in artists and writers.
  - key: q306
    type: mcq
    concept: psychological-theories-of-creativity
    difficulty: 2
    stem: What is the counter-argument to the addiction theory of creativity?
    options:
      - text: Substances always increase stress, so they can only reduce creativity
        why: Tempting because the lecture warns about substances, but the slide's counter-argument is about the direction of cause, not about stress.
      - text: Creative tendencies make people prone to addiction, not the reverse
        correct: true
        why: Correct — those arguing against it say addiction doesn't cause the creativity; those with creative tendencies are more prone to addiction.
      - text: Addiction is caused by unmet esteem needs, not by any creative tendency
        why: Tempting because Maslow's needs appear this week, but the counter-argument says creative tendencies make people prone to addiction.
      - text: Substances have no effect on how loose or unpredictable thinking becomes
        why: Tempting as a rebuttal, but the slide accepts that people under the influence may think in loose, unpredictable ways.
  - key: q307
    type: mcq
    concept: psychological-theories-of-creativity
    difficulty: 2
    stem: According to the slide, one tenet of the addiction theory is that drugs and alcohol…
    options:
      - text: satisfy the unsatisfied wishes that are the driving power behind fantasies
        why: Tempting because it echoes Freud's line, but unsatisfied wishes belong to the psychoanalytical theory, not the addiction theory.
      - text: lift people up Maslow's hierarchy of needs to self-actualisation
        why: Tempting because self-actualisation frees creativity in the humanistic theory, but substances play no part in that theory.
      - text: remove the stress element that inhibits our creative ability
        correct: true
        why: Correct — one tenet is that recreational drugs and alcohol remove the stress element that inhibits our creative ability.
  - key: q308
    type: mcq
    concept: psychological-theories-of-creativity
    difficulty: 3
    stem: Freud's line on the slide — 'unsatisfied wishes are the driving power behind fantasies' — supports which theory?
    options:
      - text: The psychoanalytical theory
        correct: true
        why: Correct — Freud is a named proponent, and unsatisfied wishes fit its tenet that creativity is an outlet for difficult circumstances and repressed emotion.
      - text: The humanistic theory
        why: Tempting because wishes sound like needs, but the humanistic theory says creativity follows when needs are met, not when wishes go unsatisfied.
      - text: The addiction theory of creativity
        why: Tempting because cravings are a kind of wish, but the addiction theory concerns substances removing stress, not fantasies.
      - text: Creative association
        why: Tempting because fantasies connect ideas, but association means applying procedures from one area to another.
  - key: q309
    type: mcq
    concept: psychological-theories-of-creativity
    difficulty: 3
    stem: How does the theory of psychoticism describe the creative person?
    options:
      - text: Fully psychotic, and so unable to produce workable ideas
        why: Tempting because the theory uses the word psychotic, but it places psychoticism halfway between "normal" and psychosis, not in psychosis.
      - text: Calm and conforming, creative once all needs are met
        why: Tempting because that describes the humanistic picture, but psychoticism describes rebellion against norms, not calm conformity.
      - text: "Halfway to psychosis: rejects norms; risk taking, impulsive"
        correct: true
        why: "Correct — the slide: halfway between \"normal\" and psychosis, rejecting social, cultural or authoritarian norms; risk takers, impulsive and spontaneous."
      - text: Driven by inferiority that creativity turns into superiority
        why: Tempting because it is another psychological driver, but inferiority turned into superiority is the psychoanalytical theory.
  - key: q310
    type: mcq
    concept: psychological-theories-of-creativity
    difficulty: 3
    stem: After her business collapsed, an entrepreneur withdrew from friends for a year, then came back with a radically new venture concept. Which theory best explains this pattern?
    options:
      - text: Humanistic — her needs were met, so she could choose to be creative
        why: Tempting because she ended up creative, but losing a business is hardship, not a state of needs met at self-actualisation.
      - text: Psychoanalytical — she pulled back after a difficult event and used her creative side as an outlet
        correct: true
        why: "Correct — the slide: after a traumatic event people pull back from their surroundings and rely on their creative side to find a solution."
      - text: Creativity by accident — the concept arose purely by chance
        why: Tempting because the idea may have come unexpectedly, but the pattern of withdrawal after hardship points to the psychoanalytical theory.
      - text: Cognitive — creativity is a normal human activity of reasoning
        why: Tempting because everyone can reason, but it does not explain the link between the collapse, the withdrawal and the new idea.
  - key: q311
    type: mcq
    concept: psychological-theories-of-creativity
    difficulty: 2
    stem: What does the mental illness slide say about stress?
    options:
      - text: Stress is the main cause of creativity in artists and writers
        why: "Tempting because the same slide links artists and writers to depression, but on stress it says the opposite: it impairs creativity."
      - text: Stress actually impairs creativity by distracting us
        correct: true
        why: "Correct — the slide ends: \"It is said that stress actually impairs creativity by distracting us\". The lecture added that not all stress is always bad."
      - text: Stress has no effect on creativity once a disorder is present
        why: Tempting because the theory centres on disorders, but the slide makes a separate point that stress impairs creativity.
  - key: q312
    type: mcq
    concept: psychological-theories-of-creativity
    difficulty: 2
    stem: Which theory treats a sense of inferiority as a source of creativity?
    options:
      - text: Psychoanalytical theory
        correct: true
        why: Correct — the slide says a sense of inferiority can contribute to creativity, and the creativity can make people feel superior and move forward.
      - text: The theory of psychoticism
        why: Tempting because both concern personality, but psychoticism rests on anti-convention, impulsive tendencies, not inferiority.
      - text: Humanistic theory
        why: Tempting because esteem is one of Maslow's needs, but the humanistic theory says creativity follows once needs such as esteem are met.
      - text: Addiction theory
        why: Tempting because feelings of inferiority can accompany addiction, but the addiction theory is about substances removing stress.
  - key: q313
    type: mcq
    concept: psychological-theories-of-creativity
    difficulty: 4
    contrasts-with:
      - humanistic-theory-and-maslows-types
    stem: What is the key difference between the psychoanalytical and humanistic theories of creativity?
    options:
      - text: Psychoanalytical theory says needs must be met first; humanistic theory says hardship drives creativity
        why: "Tempting because both positions appear this week, but this reverses them: hardship is psychoanalytical; needs met is humanistic."
      - text: "Psychoanalytical: an outlet for hardship. Humanistic: follows once needs are met"
        correct: true
        why: Correct — one sees creativity as an outlet for difficult circumstances; the other says that at self-actualisation we are free to choose to be creative.
      - text: Both say environment is not a factor; they differ only in who proposed them
        why: Tempting because the humanistic slide does say environment is not a factor, but the psychoanalytical theory makes difficult circumstances the trigger.
      - text: Psychoanalytical theory is about teams; the humanistic theory is about individuals
        why: Tempting because the theories differ, but both describe individuals; the difference is hardship versus needs met.
  - key: q314
    type: mcq
    concept: psychological-theories-of-creativity
    difficulty: 4
    stem: Which is the strongest critique of the theories linking creativity to mental illness or addiction, on the week's materials?
    options:
      - text: "They may mistake a link for a cause: creative people may be more prone to addiction"
        correct: true
        why: Correct — the slide's own counter-argument says addiction doesn't cause creativity; creative tendencies make addiction more likely. The same doubt applies to illness.
      - text: They have no proponents at all on the slides, so they lack support
        why: Tempting as a quick dismissal, but the slides name Briggs, Eisemann and Goodman, and Lapp, Collins, Norlander and Wallas.
      - text: They ignore the unconscious, which the slides treat as the only source of creative ideas
        why: Tempting because the psychoanalytical theory stresses the unconscious, but no slide says it is the only source of creativity.
      - text: They apply only to scientists, so they cannot explain artists or writers
        why: Tempting because some theories cite scientific discoveries, but the mental illness slide links its claims to artists and writers.
  - key: q315
    type: mcq
    concept: psychological-theories-of-creativity
    difficulty: 2
    stem: Who are listed as proponents of the psychoanalytical theory of creativity?
    options:
      - text: Briggs; Eisemann; Goodman
        why: Tempting because they also tie creativity to the psyche, but they are the proponents of the mental illness theory.
      - text: Lapp, Collins, Norlander and Wallas
        why: Tempting because the list includes Wallas from the creative-process model, but these names belong to the addiction theory.
      - text: Jung; Freud, Adler and Hammer
        correct: true
        why: Correct — the slide lists Jung; Freud, Adler and Hammer for the psychoanalytical theory of creativity.
      - text: Maslow; Rogers and Fromm
        why: Tempting because they are also psychologists, but they are the proponents of the humanistic theory.
  - key: q316
    type: mcq
    concept: psychological-theories-of-creativity
    difficulty: 3
    variant-of: q310
    stem: A talented engineer openly rejects company rules, takes big risks, acts on impulse — and produces the firm's most original designs. Which theory fits best?
    options:
      - text: The mental illness theory of creativity
        why: Tempting because the behaviour is unusual, but nothing points to bipolar disorder or mood swings; rejecting norms is psychoticism's mark.
      - text: The humanistic theory
        why: Tempting because she is free to express herself, but the description is of rebellion and impulsiveness, not needs met.
      - text: The theory of psychoticism
        correct: true
        why: Correct — rejecting authoritarian norms, risk taking, impulsiveness and spontaneity are the traits the slide gives for Eysenck's psychoticism.
      - text: Creativity by grace
        why: Tempting because her designs seem a gift, but the scenario describes an anti-convention disposition, not a divine gift.
  - key: q317
    type: mcq
    concept: psychological-theories-of-creativity
    difficulty: 2
    stem: How did the lecture frame the psychoanalytical, mental illness, addiction and psychoticism theories?
    options:
      - text: Creativity is a normal human activity that everyone shares equally
        why: Tempting because the lecture also says everyone can be creative, but that is the cognitive view, not the framing of these four theories.
      - text: Creativity can only happen once every basic need has been met
        why: Tempting because the next theory says this, but it is the humanistic theory, which starts from the opposite end.
      - text: To be creative you must move away from the stable "normal" state
        correct: true
        why: Correct — the lecture framed normality as calm and stable; to be creative you have to move away from it in one way or another.
      - text: Creativity is a divine gift that has nothing to do with circumstances
        why: Tempting because some theories treat creativity as innate, but that is creativity by grace, not this group.
  - key: q318
    type: truefalse
    set: quickfire
    concept: psychological-theories-of-creativity
    difficulty: 1
    statement: The mental illness theory says the illness must be severe for creativity to appear.
    answer: false
    why: False — the slide says the illness doesn't have to be severe, as severe illness can actually impede creativity.
  - key: q319
    type: truefalse
    set: quickfire
    concept: psychological-theories-of-creativity
    difficulty: 2
    statement: The addiction theory's critics argue that creative people are more prone to addiction, not that addiction causes creativity.
    answer: true
    why: True — the slide says arguers against the theory hold that addiction doesn't cause creativity; those with creative tendencies are more prone to addiction.
  - key: q320
    type: truefalse
    set: quickfire
    concept: psychological-theories-of-creativity
    difficulty: 1
    statement: Eysenck's psychoticism is seen as halfway between a 'normal' person and the state of psychosis.
    answer: true
    why: True — the slide says psychoticism is seen as being halfway between a "normal" person and the state of psychosis.
  - key: q321
    type: short
    concept: psychological-theories-of-creativity
    difficulty: 3
    prompt: "\"Creativity comes from being a bit troubled.\" Discuss, using two theories of creativity from this week and applying them to a creative agency whose director says this of her best staff."
    model: |-
      The claim matches theories that trace creativity to a departure from the stable, "normal" state. The
      psychoanalytical theory (Jung; Freud, Adler and Hammer) says people become more creative as a reaction to difficult
      circumstances or repressed emotions, pulling back and using their creative side as an outlet; Freud held that
      "unsatisfied wishes are the driving power behind fantasies". The mental illness theory (Briggs; Eisemann; Goodman)
      says some mild form of mental illness, such as mood swings, accompanies creativity, and Verhaeghen and colleagues found
      a reflective mode makes people more creative but can lead to depression. Applied to the agency, the director may be
      seeing a real pattern. But the claim confuses association with cause: the slide's own counter-argument to the
      addiction theory is that creative tendencies make people prone to addiction, not the reverse, and the same may hold
      for distress. The slides also say severe illness impedes creativity and stress impairs it by distracting us, and the
      humanistic theory argues the opposite route: creativity flourishes once needs are met. A manager should not cultivate
      "trouble"; supporting staff is more consistent with the evidence.
    rubric:
      - id: r1
        criterion: Concept — defines two relevant theories accurately.
        marks: 2
        top-band: States the tenets and proponents of two theories (e.g. psychoanalytical and mental illness) in the slide's terms.
        margin-note: Which theories does the director rely on?
        authorities: []
      - id: r2
        criterion: Example — uses real evidence from the materials.
        marks: 2
        top-band: Cites Verhaeghen and colleagues' finding on reflective mode and depression, or Freud's line on unsatisfied wishes.
        margin-note: What evidence do the slides offer?
        authorities:
          - mgmt2094-example-verhaeghen-reflective-mode
      - id: r3
        criterion: Application — applies the theories to the agency.
        marks: 2
        top-band: Explains what the theories would predict about the agency's staff and how far the director's observation fits.
        margin-note: Tie the theory to this workplace.
        authorities: []
      - id: r4
        criterion: Evaluation — tests the claim against counter-arguments.
        marks: 3
        top-band: Uses the correlation-versus-cause objection, the slide's warnings on severity and stress, and the humanistic alternative to reach a conclusion.
        margin-note: Does a pattern prove a cause?
        authorities: []
  - key: q322
    type: match
    concept: psychological-theories-of-creativity
    difficulty: 2
    prompt: Match each theory of creativity to the people the slides name with it.
    pairs:
