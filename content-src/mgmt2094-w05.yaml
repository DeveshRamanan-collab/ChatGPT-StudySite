authorities:
  - slug: mgmt2094-sadler-smith-2015-wallas-four-stage-model
    title: "Sadler-Smith (2015), Wallas' Four-Stage Model of the Creative Process: More Than Meets the Eye?"
    kind: article
    text: "A detailed reading of Graham Wallas' Art of Thought (1926) shows that the familiar four-stage model (Preparation, Incubation, Illumination, Verification) does not accurately reflect Wallas' full account: he gave detailed treatment to Intimation, the fringe consciousness linking Incubation and Illumination. A five-stage model across three levels of proximity to consciousness (nonconsciousness, fringe consciousness, consciousness) is a more authentic representation. Wallas built it chiefly from Helmholtz's and Poincaré's accounts of discovery; it is not a theory of creativity but a general framework within which later research, including neuroscience and intuition, can be positioned."
    gloss: "The Week 5 reading behind the slide's five-stage Wallas model: use it to explain Intimation, the two forms of Incubation, and why Verification is a separate, conscious (and social) stage."
    cases: []
    verify: false
  - slug: mgmt2094-markman-2017-how-you-define-the-problem
    title: Markman (2017), How You Define the Problem Determines Whether You Solve It
    kind: article
    text: "Most people who come up with creative solutions find them inside the collective memory of the people working on the problem. The statement of the problem is the cue to memory, so changing the description changes what is retrieved: specific statements recall closely related knowledge; abstract statements of the goal or of the relationships among objects recall more distant knowledge. There is no ideal problem statement — the most consistently creative people and groups find many different descriptions of the problem: not \"think outside the box\" but find more descriptions of the box."
    gloss: "Supports the problem-finding stage of creative problem solving: redescribing a problem is a cheap, repeatable route to new ideas (the Dyson example)."
    cases: []
    verify: false
  - slug: mgmt2094-claman-2017-spark-creativity-in-a-rut
    title: Claman (2017), How to Spark Creativity When You're in a Rut
    kind: article
    text: "Everyone has creativity when confronted with new problems or ideas — it is not just for the talented few — but it fades when people get bored or discouraged and their working groove becomes a rut. Five questions diagnose a rut (recurring patterns, needing to agree to get along, seeing obstacles everywhere, \"that won't work\", \"they don't care\"); four work habits restore creativity: think new, look for intersections, capitalise on obstacles, share what you know. Habits that sap creativity leave you just \"doing stuff\"; habits that enhance it make the job your own."
    gloss: The reading the lecturer especially recommended; used for the cognitive view that creativity is a normal human capacity, and for practical ways to restore it in your own work and career.
    cases: []
    verify: false
  - slug: mgmt2094-example-dyson-bagless-vacuum
    title: "Example: James Dyson's bagless vacuum cleaner"
    kind: other
    text: Per Markman (2017), James Dyson found a way to adapt the industrial cyclone to eliminate the bag in a vacuum cleaner. Markman argues it is hard to see how Dyson would have got to industrial cyclones by thinking about vacuum cleaner bags. An alternative description — a vacuum takes in dirt and air and has to separate the dirt from the air — does not mention the bag at all, and industrial cyclones (a spinning mass of air that throws particles to the edges by centrifugal force) are one of many ways to separate particles from air.
    gloss: "Illustrates how an abstract problem statement cues distant knowledge: the problem-finding stage, and Markman’s argument."
    cases: []
    verify: false
  - slug: mgmt2094-example-helmholtz-happy-ideas
    title: "Example: Helmholtz's 'happy ideas'"
    kind: other
    text: At his 70th birthday banquet in 1891, the physicist Hermann Helmholtz described how, after previous investigation of a problem "in all directions", happy ideas came unexpectedly without effort, like an inspiration — never when his mind was fatigued or when he was at his working table, but particularly readily during the slow ascent of wooded hills on a sunny day. From this account Wallas discerned Preparation, Incubation and Illumination (Sadler-Smith 2015).
    gloss: Shows the first stages of Wallas' model, and the role of rest and physical exercise in Incubation.
    cases: []
    verify: false
  - slug: mgmt2094-example-poincare-mathematical-discovery
    title: "Example: Poincaré's mathematical discoveries"
    kind: other
    text: Per Sadler-Smith (2015), the mathematician Henri Poincaré worked fruitlessly for fifteen days on Fuchsian functions until, one sleepless night, ideas "arose in crowds"; later an idea came to him as he put his foot on the step of a bus during a geological excursion, and another while walking on a cliff after a break by the seaside. He verified the results afterwards and warned that an inspiration felt with certainty can still fail "the test of verification". Wallas borrowed the term verification directly from Poincaré.
    gloss: Shows Incubation following conscious work and why Verification is a separate, conscious stage; on the Whole Brain mapping, C–D incubation followed by A–B verification.
    cases: []
    verify: false
  - slug: mgmt2094-example-darwin-and-wallace-natural-selection
    title: "Example: Darwin, Wallace and natural selection"
    kind: other
    text: Per Sadler-Smith (2015), Wallas noted that the two pioneers of the theory of evolution through natural selection were forced into mental relaxation — Alfred Russell Wallace by malaria and Darwin through ill-health — and so engaged involuntarily in Incubation. The reading adds that Darwin, a biologist, read T. R. Malthus' An Essay on the Principle of Population (1798), a work of political economy, which contributed to the creative insight behind the theory.
    gloss: Illustrates Incubation through mental relaxation, knowledge drawn from an unrelated domain, and a scientific discovery — the slide's example of integrated creativity.
    cases: []
    verify: false
  - slug: mgmt2094-example-accidental-discoveries
    title: "Example: accidental discoveries — immunisation and radioactivity"
    kind: other
    text: "The Week 5 slides give accidental discoveries as examples of creativity by accident: immunisation arising from an interruption in work, and radioactivity from a wrong hypothesis. The Sadler-Smith (2015) reading adds, citing Cropley, that Becquerel could not have discovered radioactivity from the chance coming together of uranium salts and photographic paper in a drawer had he not already been deeply immersed in relevant research — \"chance favours the prepared mind\"."
    gloss: "Illustrates creativity by accident, and its limit: chance discoveries still depend on Preparation."
    cases: []
    verify: false
  - slug: mgmt2094-example-verhaeghen-reflective-mode
    title: "Example: Verhaeghen and colleagues — reflection, creativity and depression"
    kind: other
    text: The Week 5 slides report a recent study by Verhaeghen and colleagues showing that when a person is in a reflective mode they become more creative, but that this can also lead to depression — indicative of artists and writers. It is suggested this is when people become sensitive to colours, sounds and emotions.
    gloss: The evidence the slides offer for the mental illness theory of creativity.
    cases: []
    verify: false
  - slug: mgmt2094-example-creative-gadgets-tutorial
    title: "Example: Week 5 tutorial — creative kitchen gadgets"
    kind: other
    text: "In the Week 5 tutorial students bring the most unusual gadgets from the second drawer in their kitchen and the class guesses what they are: why are they innovative and/or creative, are they commercially viable or successful, and can you create something similar? The tutorial then turns to the group innovative (video) project: work with your team, create a schedule, ask questions."
    gloss: Practice in judging everyday products for creativity and commercial viability, and in organising a creative team.
    cases: []
    verify: false
questions:
  - key: q101
    type: mcq
    concept: whole-brain-model
    difficulty: 1
    set: pretest
    stem: In Herrmann's Whole Brain Model, which quadrant is logical, analytical, fact based and quantitative?
    options:
      - text: Quadrant A
        correct: true
        why: Correct — the slide's A quadrant is logical, analytical, fact based and quantitative; the lecture's example is how scientists and mathematicians think.
      - text: Quadrant B
        why: Tempting because B is also structured, but B is organised, sequential, planned and detailed — planning and organisation, not numbers and analysis.
      - text: Quadrant C
        why: Tempting if you remember C as the other half of the circle, but C is interpersonal, feeling based, kinaesthetic and emotional.
      - text: Quadrant D
        why: Tempting because D also works with ideas, but D is holistic, intuitive, integrating and synthesising rather than fact based.
  - key: q102
    type: mcq
    concept: whole-brain-model
    difficulty: 1
    stem: Which set of words describes the D quadrant of the Whole Brain Model?
    options:
      - text: Organised, sequential, planned, detailed
        why: "Tempting because these sit next to D on the diagram, but they are the B quadrant: planning and structure, not synthesis."
      - text: Holistic, intuitive, integrating, synthesising
        correct: true
        why: Correct — D is holistic and intuitive; the lecture says synthesising different ideas is where fresh thinking comes from, and it is often ignored.
      - text: Interpersonal, feeling based, kinaesthetic, emotional
        why: Tempting because C is also the "softer" side, but these words describe the C quadrant, about emotions and other people.
      - text: Logical, analytical, fact based, quantitative
        why: Tempting because D is opposite A on the circle and easy to swap, but these words describe the A quadrant.
  - key: q103
    type: mcq
    concept: whole-brain-model
    difficulty: 1
    stem: According to the slides, which two sides of the Whole Brain Model are the preparation and verification?
    options:
      - text: The A and B sides
        correct: true
        why: "Correct — the slide says the A and B sides are the preparation and verification: the logical and the organised, structured thinking."
      - text: The C and D sides
        why: Tempting because C and D are also paired on the slide, but they are the incubation and illumination, not preparation and verification.
      - text: The A and D sides
        why: Tempting because A and D are the top half of the circle, but the slide pairs A with B and C with D, not the top and bottom halves.
      - text: The B and C sides
        why: Tempting because B and C form the bottom half of the circle, but the slide never pairs them; A–B and C–D are the pairings it uses.
  - key: q104
    type: mcq
    concept: whole-brain-model
    difficulty: 2
    stem: What does a code of 2 mean in a Whole Brain thinking profile?
    options:
      - text: "Preferred mode: the quadrant you go to first when you meet a problem"
        why: Tempting because 2 sounds like a high score, but the slide gives the preferred mode a 1, not a 2.
      - text: "Competent mode: how you function, though not your first choice"
        correct: true
        why: "Correct — competent mode is 2: \"this is the way you function but may not be your 1st choice\", in the slide's words."
      - text: "Avoidance: the quadrant you tend to stay away from when solving"
        why: Tempting because 2 sits between 1 and 3, but avoidance is given a 3 on the slide, so 2 cannot mean avoidance.
      - text: The second quadrant in the order A, B, C, D, which is always B
        why: Tempting because the quadrants are lettered in order, but the codes 1, 2 and 3 rate your response to each quadrant, not its position.
  - key: q105
    type: mcq
    concept: whole-brain-model
    difficulty: 2
    stem: Mia's thinking profile scores A = 1, B = 1, C = 3, D = 2. Which statement about her profile is right?
    options:
      - text: It is invalid, because each code 1, 2 and 3 may be used only once
        why: Tempting because rankings usually use each number once, but the slide says you may have more than one quadrant with the same number.
      - text: "It is valid: two quadrants can share the same number"
        correct: true
        why: Correct — the slide says "You may have more than 1 quadrant with the same number", so two preferred quadrants (A and B) are fine.
      - text: It shows she avoids A and B, because 1 is the lowest score on the scale
        why: Tempting if you read 1 as "low", but preferred mode is 1 and avoidance is 3, so she prefers A and B and avoids C.
      - text: It shows her preferred quadrant is C, because 3 is the highest score
        why: Tempting if you read 3 as "top", but 3 means avoidance; C is the quadrant Mia tends to stay away from.
  - key: q106
    type: mcq
    concept: whole-brain-model
    difficulty: 1
    variant-of: q103
    stem: Which sides of the Whole Brain Model does the slide link to incubation and illumination?
    options:
      - text: The A and B sides
        why: Tempting because A and B are listed first, but the slide makes them the preparation and verification — the conscious, structured stages.
      - text: The C and D sides
        correct: true
        why: "Correct — the slide says the C and D sides of the brain are the incubation and illumination: the feeling based and the synthesising sides."
      - text: The A and C sides
        why: Tempting because A and C sit diagonally and look like a balance, but the slide pairs C with D, not with A.
      - text: The B and D sides
        why: Tempting because B and D sit diagonally across the circle, but the slide pairs B with A (preparation and verification) and D with C.
  - key: q107
    type: mcq
    concept: whole-brain-model
    difficulty: 3
    stem: A product manager's profile is A = 3, B = 2, C = 1, D = 1. By Friday her team must build a pricing model from sales data. On the lecture's advice, what should she do?
    options:
      - text: Recognise that the task needs A, a quadrant she avoids, and consciously push herself towards it or draw on a teammate who prefers it
        correct: true
        why: Correct — the lecture says the task decides the quadrant you need; if you avoid it, be aware of that and consciously push yourself, or use complementary teammates.
      - text: Let her C and D preferences lead, since preferred modes should drive every task
        why: Tempting because preferred modes feel natural, but the lecture says to solve a certain problem you must go to a certain quadrant, whatever your preference.
      - text: Ignore her profile, since the model says only the task matters
        why: "Tempting because the task does decide the quadrant needed, but the profile is the point: it tells her which needed quadrant she avoids."
      - text: Treat the pricing model as an incubation task for her C and D sides
        why: Tempting because C and D are her strengths, but a quantitative model from data is A-quadrant work, not incubation.
  - key: q108
    type: mcq
    concept: whole-brain-model
    difficulty: 2
    stem: What does the Whole Brain Model look at, according to the slides?
    options:
      - text: Which half of your brain is physically larger, measured by a brain scan
        why: Tempting because the model is drawn as a brain, but the lecturer cautioned the quadrants do not necessarily correspond to how the brain actually works.
      - text: How you first look at a problem, as a thinking profile
        correct: true
        why: Correct — the slide says the model looks at how you first look at a problem, creating a thinking profile of you and how you respond to each quadrant.
      - text: How intelligent you are in each of four school subjects
        why: Tempting because the quadrants sound like subjects (maths, planning, people), but the profile records preference, competence and avoidance, not intelligence.
      - text: How a team should divide a project between its members
        why: Tempting because the lecture discusses teams, but the model profiles one person's thinking; dividing work is an application, not what it measures.
  - key: q109
    type: mcq
    concept: whole-brain-model
    difficulty: 2
    stem: Herrmann's Whole Brain Model is based on which three ideas?
    options:
      - text: Learning, thinking and doing
        correct: true
        why: Correct — the slide says Herrmann's model is based on learning / thinking / doing.
      - text: Preparation, incubation and illumination
        why: Tempting because the model maps onto these stages, but they are stages of Wallas' creative process, not the basis of Herrmann's model.
      - text: Needs, esteem and self-actualisation
        why: Tempting because they also form a layered model, but these belong to Maslow's hierarchy of needs in the humanistic theory.
      - text: Clarifying, ideating and implementing
        why: Tempting because these are also thinking styles, but they come from the four preferences for thinking creatively, not the Whole Brain Model.
  - key: q110
    type: mcq
    concept: whole-brain-model
    difficulty: 3
    stem: In a planning meeting, a team member keeps asking how customers will feel about a new service and whether staff will accept it. Which quadrant is she favouring?
    options:
      - text: C — interpersonal, feeling based, emotional
        correct: true
        why: "Correct — the lecture describes C as interpersonal and feeling based: noticing others' emotions and how other people will think about your ideas."
      - text: A — logical, analytical, fact based
        why: Tempting because she is asking questions, but A thinking would ask for numbers and facts, not how people feel.
      - text: B — organised, sequential, planned
        why: Tempting because it is a planning meeting, but her questions are about feelings and acceptance, not order or structure.
      - text: D — holistic, intuitive, synthesising
        why: Tempting because D is also "soft" and intuitive, but D integrates and synthesises ideas, while C is about people and emotions.
  - key: q111
    type: mcq
    concept: whole-brain-model
    difficulty: 3
    stem: A strategist is brilliant at combining ideas from different markets into a fresh concept but ignores spreadsheets. Which description fits him?
    options:
      - text: Prefers B (planned, detailed); probably avoids C (interpersonal)
        why: Tempting because a strategist plans, but combining ideas is synthesis (D), and his avoided side is numbers (A), not people.
      - text: Prefers A (analytical, fact based); probably avoids D (holistic)
        why: "Tempting because strategists are often analytical, but this reverses him: he synthesises well and neglects the quantitative side."
      - text: Prefers D (integrating, synthesising); probably avoids A (quantitative)
        correct: true
        why: Correct — combining ideas into something fresh is D-quadrant synthesis, and ignoring spreadsheets suggests A is a quadrant he avoids.
      - text: Prefers C (feeling based); probably avoids B (organised, sequential)
        why: Tempting because creative people are often pictured as emotional and disorganised, but nothing here is about feelings or structure.
  - key: q112
    type: mcq
    concept: whole-brain-model
    difficulty: 3
    stem: Why did the lecturer say the D quadrant matters for creativity?
    options:
      - text: It is the quadrant that checks whether a solution is practical and effective
        why: Tempting because checking is vital, but that is verification, which the slide places on the A and B sides.
      - text: It supplies the planning and structure every creative project depends on
        why: Tempting because projects need structure, but planning and structure are the B quadrant in the lecture.
      - text: Synthesising ideas is where fresh thinking comes from, yet it is often ignored
        correct: true
        why: Correct — the lecture says integrating and synthesising different ideas is where new ideas and fresh thinking come from, and this side is often ignored.
      - text: It is the only quadrant that scientists and mathematicians ever use
        why: Tempting because discovery involves synthesis, but the lecture links scientists and mathematicians to the logical, quantitative A quadrant.
  - key: q113
    type: mcq
    concept: whole-brain-model
    difficulty: 4
    stem: Which limit of the Whole Brain Model did the lecturer raise?
    options:
      - text: Its quadrants may not match how the brain actually works
        correct: true
        why: "Correct — the lecturer said the quadrants do not necessarily correspond to how your brain actually works: it is a model of thinking styles."
      - text: It applies only to scientists, so it has no use in business settings
        why: Tempting because quadrant A is described through scientists, but the lecture applies the model to any problem, at work or in life.
      - text: It forbids anyone from giving two quadrants the same number
        why: Tempting because profiles often look like rankings, but the slide expressly allows more than one quadrant with the same number.
      - text: It has no link to the creative process or any of its stages
        why: Tempting if you saw only the circle, but the slide maps A–B to preparation and verification and C–D to incubation and illumination.
  - key: q114
    type: mcq
    concept: whole-brain-model
    difficulty: 3
    contrasts-with:
      - wallas-model-of-creative-thinking
    stem: A team is checking whether a new app idea actually works and is practical. On the Whole Brain mapping, which sides are they drawing on, and which of Wallas' stages is this?
    options:
      - text: A and B sides; Verification
        correct: true
        why: Correct — checking practicality and effectiveness is Verification, and the slide places verification (with preparation) on the A and B sides.
      - text: C and D sides; Illumination
        why: Tempting because the idea has already appeared, but Illumination is the "eureka" moment itself; checking it is Verification on the A–B side.
      - text: C and D sides; Incubation
        why: Tempting because C and D carry part of the creative process, but incubation is subconscious mulling, not deliberate checking.
      - text: A and B sides; Intimation
        why: Tempting because A–B is right, but Intimation is the inkling that a solution is coming, not a check on a solution already found.
  - key: q115
    type: mcq
    concept: whole-brain-model
    difficulty: 2
    stem: The lecturer described the B quadrant as about…
    options:
      - text: logical, quantitative analysis based on numbers and facts
        why: Tempting because B is next to A on the diagram, but numbers and facts are the A quadrant; B is about structure.
      - text: planning and organising your thinking, and following a structure
        correct: true
        why: Correct — the lecture says B is about planning and organisation, structure and following that structure; the slide words are organised, sequential, planned, detailed.
      - text: how other people feel and how they will receive your ideas
        why: Tempting because B and C are both in the lower half of the circle, but feelings and other people are the C quadrant.
      - text: intuitive leaps that integrate and synthesise many ideas
        why: Tempting because all quadrants feed creativity, but intuitive synthesis is D; B is the organised, sequential side.
  - key: q116
    type: mcq
    concept: whole-brain-model
    difficulty: 4
    variant-of: q107
    stem: An engineer scores A = 1, B = 2, C = 3, D = 3. She must lead a workshop to dream up a new product category before any data exist. What does the model suggest?
    options:
      - text: "Nothing to worry about: her A = 1 means she will excel at every creative task"
        why: Tempting because a preferred mode feels like strength, but a preference for A says nothing about the C–D work this workshop needs.
      - text: The workshop leans on C and D, both avoided, so she should push herself there or pair with someone who prefers them
        correct: true
        why: Correct — generating new ideas draws on incubation and illumination (C–D); with both coded 3 she should consciously push towards them or use a complementary teammate.
      - text: She should skip preparation and verification, because those are her weak sides
        why: Tempting because the workshop is about new ideas, but A–B are her strong sides, and the creative process still needs both.
      - text: She should be moved to a role with only C and D tasks to raise her scores
        why: Tempting because practice can help, but the lecture's advice is awareness and complementary teams, not reassigning people to avoided work.
