  - key: q420
    type: match
    concept: humanistic-theory-and-maslows-types
    difficulty: 2
    prompt: Match each of Maslow's types of creativity to its description.
    pairs:
      - left: Primary
        right: Escapes the daily grind and stress of life — painting, drawing, writing
      - left: Secondary
        right: A higher level of thought; more thought out and involved
      - left: Integrated
        right: Combines both; spontaneous at first, but much thought before we begin
  - key: q421
    type: match
    concept: humanistic-theory-and-maslows-types
    difficulty: 2
    prompt: Match each level of Maslow's hierarchy to the needs listed on the slide.
    pairs:
      - left: Physiological
        right: Air, water, food, shelter, sleep, clothing, reproduction
      - left: Safety
        right: Personal security, employment, resources, health, property
      - left: Love and belonging
        right: Friendship, intimacy, family, sense of connection
      - left: Esteem
        right: Respect, self-esteem, status, recognition, strength, freedom
      - left: Self-actualisation
        right: The desire to become the most that one can be
  - key: q501
    type: mcq
    concept: grace-accident-association-and-cognitive-theories
    difficulty: 1
    stem: Which theory treats creativity as a divine gift — the mark of a genius endowed with superhuman potential?
    options:
      - text: Creativity by grace
        correct: true
        why: "Correct — the slide: creativity by grace is the idea of genius; they are endowed with a superhuman potential, and it is seen as a divine gift."
      - text: Creativity by accident
        why: Tempting because both are about where creativity comes from outside our control, but accident means it rises by chance, not as a gift.
      - text: Creative association theory
        why: Tempting because it is the next theory on the slides, but association means applying procedures from one area to another.
      - text: Cognitive theory of creativity
        why: Tempting because it also describes a kind of person, but cognitive creativity is a normal human activity — the opposite of a rare gift.
  - key: q502
    type: mcq
    concept: grace-accident-association-and-cognitive-theories
    difficulty: 1
    stem: On the slides, immunisation arising from an interruption in work illustrates…
    options:
      - text: creativity by grace, the gift of a genius
        why: Tempting because the discoverer may have been brilliant, but the slide uses this example for creativity that rises by chance.
      - text: creativity by accident
        correct: true
        why: Correct — the slide lists accidental discoveries, e.g. immunisation arising from an interruption in work, under creativity by accident.
      - text: creative association between two fields of work
        why: Tempting because work in one field was interrupted, but nothing was deliberately transferred; the slide treats it as chance.
      - text: cognitive creativity, as ordinary reasoning
        why: Tempting because reasoning followed the discovery, but the slide uses the interruption as a chance event — creativity by accident.
  - key: q503
    type: mcq
    concept: grace-accident-association-and-cognitive-theories
    difficulty: 2
    stem: Creative association suggests…
    options:
      - text: that creative ideas arise purely by chance, through errors and interruptions
        why: Tempting because both concern where ideas come from, but chance is creativity by accident; association is deliberate transfer.
      - text: that creativity is a gift found only in a small number of geniuses
        why: Tempting because some associations look brilliant, but a gift to geniuses is creativity by grace.
      - text: applying procedures from one area to another
        correct: true
        why: Correct — the slide says creative association suggests applying procedures from one area to another; the lecture calls it interdisciplinary.
      - text: that creativity follows once a person's needs have all been met
        why: Tempting because the humanistic theory also explains creativity, but it is about needs met, not transferring procedures.
  - key: q504
    type: mcq
    concept: grace-accident-association-and-cognitive-theories
    difficulty: 2
    stem: According to the slides, creative association underlies the justification for which techniques?
    options:
      - text: Divergent techniques such as lateral thinking and brainstorming
        correct: true
        why: Correct — the slide says association underlies the justification for many divergent thinking techniques such as lateral thinking and brainstorming.
      - text: Convergent techniques such as ranking options and voting on them
        why: Tempting because techniques are mentioned, but the slide links association to divergent techniques that generate many ideas.
      - text: Verification techniques such as prototyping and testing an idea
        why: Tempting because testing is part of creative work, but the slide ties association to idea generation, not to checking.
  - key: q505
    type: mcq
    concept: grace-accident-association-and-cognitive-theories
    difficulty: 2
    stem: Cognitive creativity holds that creativity is…
    options:
      - text: a rare gift found in a few geniuses and denied to everyone else
        why: Tempting because it is the other half of a pair on the slides, but this describes creativity by grace.
      - text: a normal human activity of reasoning, recognition and understanding
        correct: true
        why: "Correct — the slide: cognitive creativity is a normal human activity; it is about reasoning, recognition and understanding."
      - text: a reaction to repressed emotions after a difficult or traumatic event
        why: Tempting because it is another psychological explanation, but this is the psychoanalytical theory.
      - text: a by-product of chance discoveries made while working on something else
        why: Tempting because chance discoveries are on the neighbouring slide, but they illustrate creativity by accident.
  - key: q506
    type: mcq
    concept: grace-accident-association-and-cognitive-theories
    difficulty: 3
    stem: A packaging firm borrows the folding technique of origami to design flat-pack boxes. Which theory does this illustrate?
    options:
      - text: Creative association
        correct: true
        why: Correct — borrowing a procedure from one area (origami) and applying it to another (packaging) is creative association.
      - text: Creativity by accident
        why: Tempting because the idea might have come unexpectedly, but the firm deliberately borrowed a technique; nothing happened by chance.
      - text: Creativity by grace
        why: Tempting because the result looks clever, but nothing suggests a divine gift; the mechanism is a transfer between fields.
      - text: The humanistic theory
        why: Tempting because it is a well-known theory, but needs and self-actualisation play no part in borrowing a technique.
  - key: q507
    type: mcq
    concept: grace-accident-association-and-cognitive-theories
    difficulty: 3
    stem: The slides give radioactivity 'from a wrong hypothesis' as creativity by accident. What does the Sadler-Smith reading add?
    options:
      - text: That the discovery had in fact been carefully planned from the very start
        why: Tempting as a debunking move, but the reading accepts the chance element; its point is that chance needed a prepared mind.
      - text: "That chance favours the prepared mind: Becquerel was already immersed in the research"
        correct: true
        why: Correct — citing Cropley, the reading says Becquerel could not have made the chance discovery without deep immersion in relevant research.
      - text: That the discovery came from applying a procedure borrowed from biology
        why: Tempting because association is the neighbouring theory, but the reading says nothing about borrowing from biology.
      - text: That the discovery proves creativity is a divine gift to a few geniuses
        why: Tempting because Becquerel was eminent, but the reading stresses preparation, not a divine gift.
  - key: q508
    type: mcq
    concept: grace-accident-association-and-cognitive-theories
    difficulty: 3
    stem: Which view would lead a manager to conclude that training staff in creativity is pointless?
    options:
      - text: Creativity by grace
        correct: true
        why: Correct — on this view creativity is a divine gift of genius; the lecture put it as "you're either super creative or you're not" and nothing can be done.
      - text: Cognitive creativity, a normal human activity
        why: Tempting because "normal" might sound as if nothing needs training, but it implies everyone can reason creatively and improve.
      - text: Creative association, transferring procedures between areas
        why: "Tempting because it is a technique-based view, but it supports training: techniques like brainstorming and lateral thinking can be taught."
  - key: q509
    type: mcq
    concept: grace-accident-association-and-cognitive-theories
    difficulty: 2
    stem: What does Claman (2017) say about who has creativity?
    options:
      - text: It belongs mainly to people in artistic roles and the talented few
        why: Tempting because that is a common belief, but Claman says creativity is not just for the talented few or for people in artistic roles.
      - text: Everyone, when confronted with new problems or ideas
        correct: true
        why: "Correct — Claman: everyone has creativity when they are confronted with new problems to solve or new ideas to think about."
      - text: Only new employees, who lose it after their first few months at work
        why: Tempting because she uses the first day at work as her example, but she says creativity can fade in a rut and be revived.
      - text: Anyone who takes up a hobby such as watercolour painting
        why: Tempting because she mentions watercolours, but she says such a class may or may not translate into creativity at work.
  - key: q510
    type: mcq
    concept: grace-accident-association-and-cognitive-theories
    difficulty: 2
    stem: Which of these is one of Claman's five questions for spotting a creativity-destroying rut?
    options:
      - text: Do you feel it is important to agree with your colleagues and bosses to get along?
        correct: true
        why: Correct — this is one of Claman's five rut questions, alongside recurring patterns, obstacles everywhere, "that won't work" and "they don't care".
      - text: Do you prefer the A quadrant to the D quadrant of the Whole Brain Model?
        why: Tempting because it is a self-diagnosis question from this week, but it belongs to the Whole Brain Model, not Claman's reading.
      - text: Have all of your lower needs, up to esteem, been met at work?
        why: Tempting because Maslow is about needs at work too, but Claman's questions concern habits and attitudes, not the hierarchy.
  - key: q511
    type: mcq
    concept: grace-accident-association-and-cognitive-theories
    difficulty: 3
    stem: A team leader now sees obstacles everywhere to new ways of working. Which of Claman's suggestions targets this most directly?
    options:
      - text: Share what you know, through blogging, training or mentoring others
        why: Tempting because sharing re-engages people, but it does not address obstacles; it helps clarify thoughts and builds engagement.
      - text: Look for intersections between your department and other departments
        why: Tempting because intersections spark ideas, but the suggestion that speaks to obstacles directly is to capitalise on them.
      - text: Capitalise on obstacles
        correct: true
        why: "Correct — Claman: every obstacle is an opportunity for research and analysis (why is it there, whom does it serve?); start with ones you can change."
      - text: "Think new: meet new people, ask for new assignments, learn something"
        why: Tempting because novelty breaks routine, but it targets a recurring pattern to your days rather than a habit of seeing obstacles.
  - key: q512
    type: mcq
    concept: grace-accident-association-and-cognitive-theories
    difficulty: 4
    stem: Claman's 'look for intersections' advice is closest to which theory on the slides?
    options:
      - text: Creativity by grace, because only a few people are placed at intersections
        why: Tempting because intersections sound like privileged positions, but Claman says everyone can seek them out, which is the opposite of grace.
      - text: Creative association
        correct: true
        why: Correct — Claman says creativity occurs at the crossroads of different people and ideas; association is applying procedures from one area to another.
      - text: Creativity by accident, because people meet at intersections by chance
        why: Tempting because meetings can be chance, but Claman tells you to look for intersections deliberately, e.g. by volunteering.
      - text: The psychoanalytical theory, because intersections create difficult circumstances
        why: Tempting because new settings can be uncomfortable, but Claman presents intersections as sources of ideas, not hardship.
  - key: q513
    type: mcq
    concept: grace-accident-association-and-cognitive-theories
    difficulty: 3
    stem: Darwin, a biologist, drew on Malthus' essay on population, a work of political economy. Which theory does this illustrate best?
    options:
      - text: Creativity by accident
        why: Tempting because reading Malthus may have been unplanned, but the mechanism is carrying knowledge from one field into another.
      - text: Creativity by grace
        why: Tempting because Darwin is a famous genius, but the reading explains his insight by knowledge from another domain, not a gift.
      - text: Creative association
        correct: true
        why: Correct — bringing ideas from political economy into biology is applying material from one area to another, which is creative association.
      - text: The humanistic theory
        why: Tempting because the theory of evolution is a great achievement, but nothing here concerns Darwin's needs being met.
  - key: q514
    type: mcq
    concept: grace-accident-association-and-cognitive-theories
    difficulty: 4
    contrasts-with:
      - psychological-theories-of-creativity
    stem: How do creativity by accident and creative association differ?
    options:
      - text: "Accident: ideas rise by chance. Association: deliberate transfer between areas"
        correct: true
        why: Correct — accident means creativity rises by chance (immunisation, radioactivity); association applies procedures from one area to another.
      - text: "Accident: deliberate transfer between areas. Association: ideas rise by chance"
        why: "Tempting because both involve a meeting of things, but this reverses them: chance is accident, transfer is association."
      - text: "Neither differs: both treat creativity as a divine gift given to a few geniuses"
        why: Tempting because both explain sudden ideas, but the divine gift is creativity by grace, a third theory.
  - key: q515
    type: mcq
    concept: grace-accident-association-and-cognitive-theories
    difficulty: 2
    stem: Habits that sap creativity, Claman says, leave you…
    options:
      - text: just "doing stuff"
        correct: true
        why: "Correct — Claman: habits that sap your creativity leave you just \"doing stuff\"; there's no \"you\" in the job, only transactions."
      - text: too creative to fit in with your colleagues and bosses
        why: Tempting because she discusses agreeing to get along, but her point is that ruts kill creativity, not that creativity isolates you.
      - text: in a state of self-actualisation with nothing left to achieve
        why: Tempting because Maslow's top level appears this week, but Claman does not use it; ruts leave you transacting, not fulfilled.
  - key: q516
    type: mcq
    concept: grace-accident-association-and-cognitive-theories
    difficulty: 3
    variant-of: q506
    stem: A hospital team adopts the pit-stop routines of motor-racing crews to speed up patient handovers. Which theory?
    options:
      - text: Cognitive creativity
        why: Tempting because the team reasons its way to the idea, but the defining move is borrowing a procedure from another field.
      - text: Creative association
        correct: true
        why: Correct — applying a procedure from motor racing to patient handovers is applying procedures from one area to another.
      - text: Creativity by accident
        why: Tempting because the idea might have struck someone unexpectedly, but adopting another field's routine is a deliberate transfer.
      - text: Creativity by grace
        why: Tempting because the idea seems inspired, but the scenario describes a transfer of routines, not a divine gift.
  - key: q517
    type: mcq
    concept: grace-accident-association-and-cognitive-theories
    difficulty: 4
    stem: A CEO says, "We can't plan innovation — the big ideas just happen by luck." Which response uses the week's readings best?
    options:
      - text: "Agree: the slides show that all creativity arises by accident"
        why: Tempting because accident is one theory on the slides, but it is one of several, and the readings qualify it.
      - text: Chance favours the prepared mind, and redescribing problems is repeatable
        correct: true
        why: Correct — Sadler-Smith shows even accidents need preparation, and Markman calls tapping memory one of the most cost-effective, repeatable approaches.
      - text: "Agree: creativity is a divine gift, so planning for it is pointless anyway"
        why: Tempting because grace also denies that creativity can be managed, but the readings (Claman, Markman) treat it as a normal, cultivable capacity.
      - text: "Disagree: only huge research budgets produce big ideas, as drug firms show"
        why: Tempting because Markman mentions drug companies, but he presents big R&D spending as the costly alternative to tapping memory.
  - key: q518
    type: truefalse
    set: quickfire
    concept: grace-accident-association-and-cognitive-theories
    difficulty: 1
    statement: Creativity by grace holds that creativity rises by chance.
    answer: false
    why: False — creativity by grace treats creativity as a divine gift of genius; rising by chance is creativity by accident.
  - key: q519
    type: truefalse
    set: quickfire
    concept: grace-accident-association-and-cognitive-theories
    difficulty: 1
    statement: Cognitive creativity treats creativity as a normal human activity about reasoning, recognition and understanding.
    answer: true
    why: True — the slide says cognitive creativity is a normal human activity; it is about reasoning, recognition and understanding.
  - key: q520
    type: match
    concept: grace-accident-association-and-cognitive-theories
    difficulty: 2
    prompt: Match each theory to its account of where creativity comes from.
    pairs:
      - left: Creativity by grace
        right: Genius endowed with superhuman potential — a divine gift
      - left: Creativity by accident
        right: It rises by chance, e.g. immunisation from an interrupted piece of work
      - left: Creative association
        right: Applying procedures from one area to another
      - left: Cognitive creativity
        right: A normal human activity of reasoning, recognition and understanding
  - key: q601
    type: mcq
    concept: creative-problem-solving-process
    difficulty: 1
    set: pretest
    stem: Which stage of creative problem solving defines the problem correctly?
    options:
      - text: Problem finding
        correct: true
        why: Correct — the slide says Problem Finding defines the problem correctly, using the previous stage's hits for the most productive definition.
      - text: Objective finding
        why: Tempting because it comes first and also concerns problems, but Objective Finding defines the problem area, not the problem itself.
      - text: Fact finding
        why: Tempting because facts shape the problem, but Fact Finding gathers the information; Problem Finding then uses it to define the problem.
      - text: Idea finding
        why: Tempting because it follows Problem Finding, but Idea Finding generates many solutions to a problem already defined.
  - key: q602
    type: mcq
    concept: creative-problem-solving-process
    difficulty: 1
    stem: Which is the right order of the six stages of creative problem solving?
    options:
      - text: Fact, objective, problem, idea, acceptance, solution finding
        why: Tempting because facts seem to come first, but Objective Finding opens the process by defining the problem area.
      - text: Objective, problem, fact, idea, solution, acceptance finding
        why: Tempting because defining the problem feels like an early step, but Fact Finding comes before Problem Finding, which uses its hits.
      - text: Objective, fact, problem, idea, solution, acceptance finding
        correct: true
        why: Correct — the slide lists Objective, Fact, Problem, Idea, Solution and Acceptance Finding, in that order.
      - text: Problem, objective, fact, solution, idea, acceptance finding
        why: Tempting because the process is about problems, but it begins with the problem area (objective) and ideas come before solutions.
  - key: q603
    type: mcq
    concept: creative-problem-solving-process
    difficulty: 1
    stem: Divergent thinking is about…
    options:
      - text: coming up with many possible solutions to the one problem
        correct: true
        why: "Correct — the slide: divergent thinking is about coming up with many possible solutions to the one problem."
      - text: solving a problem that has only one single correct solution
        why: Tempting because the two are defined side by side, but this is the slide's definition of convergent thinking.
      - text: checking whether a chosen solution is practical and appropriate
        why: Tempting because checking is part of creative work, but it is Verification in Wallas' model, not divergent thinking.
  - key: q604
    type: mcq
    concept: creative-problem-solving-process
    difficulty: 2
    stem: In objective finding, hits and hotspots are identified by questioning which three things?
    options:
      - text: Cost, time and quality of each possible problem
        why: Tempting because these are common business criteria, but the slide lists ownership, priority and critical nature.
      - text: Ownership, priority and critical nature
        correct: true
        why: "Correct — the slide: ownership (is one motivated to solve it), priority (how important) and critical nature (how urgent)."
      - text: Receptivity, immersion and detached devotion
        why: Tempting because they are listed this week, but they are conditions of creative thinking, not the objective-finding questions.
      - text: Clarifying, ideating and implementing the answer
        why: Tempting because they are also stages of a sort, but they echo the four creative-thinking preferences, not objective finding.
  - key: q605
    type: mcq
    concept: creative-problem-solving-process
    difficulty: 2
    stem: Which stage do the slides describe as a divergent activity that helps implement solutions successfully?
    options:
      - text: Solution finding
        why: Tempting because it chooses the solution to implement, but choosing is the convergent move; implementation help is Acceptance Finding.
      - text: Acceptance finding
        correct: true
        why: "Correct — the slide: Acceptance Finding is a divergent activity that helps to implement solutions successfully."
      - text: Fact finding
        why: Tempting because it is partly divergent too, but it gathers information about the problem, not about implementation.
      - text: Objective finding
        why: Tempting because it uses divergence, but it lists possible problem areas at the very start, not implementation steps.
  - key: q606
    type: mcq
    concept: creative-problem-solving-process
    difficulty: 2
    stem: What does acceptance finding involve?
    options:
      - text: Choosing between ideas that can be transformed into workable solutions
        why: Tempting because acceptance follows that choice, but choosing workable ideas is Solution Finding.
      - text: Collecting relevant information to improve comprehension of the problem
        why: Tempting because information matters at every stage, but collecting it is Fact Finding.
      - text: Listing obstacles and fixes, contingency plans, and an action plan
        correct: true
        why: "Correct — the slide: list implementation obstacles and ways to overcome them, develop preventive actions and contingency plans, and generate an action plan."
      - text: Generating a long list of possible problem areas to explore further
        why: Tempting because acceptance finding is divergent, but listing problem areas is the divergent part of Objective Finding.
  - key: q607
    type: mcq
    concept: creative-problem-solving-process
    difficulty: 2
    stem: Solution finding is basically…
    options:
      - text: the choice of ideas that can become workable solutions
        correct: true
        why: "Correct — the slide: Solution Finding is basically the choice of ideas that can be transformed into workable solutions."
      - text: the generation of as many ideas as possible using a variety of aids
        why: Tempting because it follows Idea Finding, but generating many ideas is Idea Finding; Solution Finding chooses among them.
      - text: the identification of the most productive problem definition possible
        why: Tempting because definition shapes the solution, but that is Problem Finding, two stages earlier.
  - key: q608
    type: mcq
    concept: creative-problem-solving-process
    difficulty: 3
    stem: A retailer's team has gathered sales data, complaints and staff interviews, and is now using the hits from that work to settle on 'How might we cut checkout waiting time?'. Which stage are they in?
    options:
      - text: Problem finding
        correct: true
        why: Correct — using the previous stage's hits to settle on the most productive problem definition is Problem Finding.
      - text: Fact finding
        why: Tempting because they have just gathered data, but that stage is finished; they are now defining the problem from its hits.
      - text: Idea finding
        why: Tempting because "how might we" invites ideas, but no ideas are being generated yet; they are fixing the problem statement.
      - text: Solution finding
        why: Tempting because they are narrowing down, but they are choosing a problem definition, not choosing between solutions.
  - key: q609
    type: mcq
    concept: creative-problem-solving-process
    difficulty: 3
    stem: A bank's innovation team lists twenty possible problem areas, then asks which they are motivated to solve, which matter most and which are urgent. Which stage?
    options:
      - text: Problem finding, because the team is narrowing the problems down
        why: Tempting because it narrows, but the ownership-priority-urgency questions belong to Objective Finding, at the start.
      - text: Objective finding
        correct: true
        why: Correct — divergence to list problems, then convergence via ownership, priority and critical nature, is Objective Finding.
      - text: Acceptance finding, because the team is weighing what will be accepted
        why: Tempting because urgency and importance sound like acceptance, but Acceptance Finding concerns implementing a chosen solution.
      - text: Fact finding, because the team is collecting information on twenty areas
        why: Tempting because a list of twenty looks like data gathering, but they are listing and ranking problem areas, not gathering facts.
  - key: q610
    type: mcq
    concept: creative-problem-solving-process
    difficulty: 3
    variant-of: q606
    stem: Before launching a new app, a team lists what could block adoption, prepares contingency plans and drafts an action plan. Which stage?
    options:
      - text: Solution finding
        why: Tempting because the app is the chosen solution, but choosing came earlier; planning for obstacles is Acceptance Finding.
      - text: Idea finding
        why: Tempting because listing blockers is divergent, but the ideas here are about implementation, which the slides assign to Acceptance Finding.
      - text: Acceptance finding
        correct: true
        why: Correct — obstacles and ways around them, preventive and contingency plans, and an action plan are the three parts of Acceptance Finding.
  - key: q611
    type: mcq
    concept: creative-problem-solving-process
    difficulty: 2
    stem: Which statement about creative problem solving appears on the slides?
    options:
      - text: It builds on our natural creative processes rather than replacing them
        correct: true
        why: "Correct — the slide: creative problem solving is intuitive and natural; it is not designed to replace our natural creative processes, rather build upon them."
      - text: It replaces our natural creative processes with a fixed procedure
        why: Tempting because it is a staged process, but the slide says it is not designed to replace our natural creative processes.
      - text: It is domain specific and so works only for business problems
        why: Tempting because this is a business unit, but the slide says it is very generalisable — usable in all aspects of life.
      - text: It is a lower order skill that needs no sub-skills at all
        why: Tempting because it is called natural, but the slide calls it a higher order thinking skill with sub-skills.
  - key: q612
    type: mcq
    concept: creative-problem-solving-process
    difficulty: 3
    stem: Why is creative problem solving called a higher order thinking skill?
    options:
      - text: Because it can only be learned after years of formal university study
        why: Tempting because "higher order" sounds advanced, but the slide ties it to the mental operations involved, not to study.
      - text: It uses different mental operations, with sub-skills
        correct: true
        why: "Correct — the slide: it requires the use of different mental operations, thus it is a higher order thinking skill that has sub-skills to it."
      - text: Because it needs advanced mathematics at each of its six stages
        why: Tempting if you link "higher order" to maths, but nothing on the slides requires mathematics.
  - key: q613
    type: mcq
    concept: creative-problem-solving-process
    difficulty: 2
    stem: Which is one of the five conditions of creative thinking listed on the slides?
    options:
      - text: Avoidance of all errors
        why: Tempting because errors seem harmful, but the slide lists the utilisation of errors as a condition — errors are used, not avoided.
      - text: Detached devotion
        correct: true
        why: Correct — the five conditions are receptivity, immersion, seeing questions, utilisation of errors and detached devotion.
      - text: Strict supervision
        why: Tempting because some managers assume it helps, but it is not among the five conditions on the slide.
      - text: A fixed deadline
        why: Tempting because deadlines can focus work, but it is not one of the five conditions listed on the slide.
  - key: q614
    type: mcq
    concept: creative-problem-solving-process
    difficulty: 3
    contrasts-with:
      - wallas-model-of-creative-thinking
    stem: Creative problem solving and Wallas' model both include a point where ideas are judged. Which pairing is right?
    options:
      - text: Solution finding (choosing workable ideas) and Verification (practicality, effectiveness, appropriateness)
        correct: true
        why: Correct — Solution Finding chooses ideas that can become workable solutions; Verification checks an idea's practicality, effectiveness and appropriateness.
      - text: Idea finding and Illumination
        why: "Tempting because both concern the arrival of ideas, but neither judges ideas: one generates them, the other is the flash itself."
      - text: Fact finding and Incubation
        why: Tempting because both come early in their models, but neither judges ideas; one gathers information, the other is subconscious mulling.
      - text: Objective finding and Preparation
        why: Tempting because both open their models, but they set up the problem; neither judges ideas.
  - key: q615
    type: mcq
    concept: creative-problem-solving-process
    difficulty: 3
    stem: According to the slides, how does fact finding help?
    options:
      - text: It chooses the final solution and plans how it will be implemented
        why: Tempting because facts inform choices, but choosing is Solution Finding and implementation planning is Acceptance Finding.
      - text: It deepens comprehension, sparks ideas and can reframe earlier problems
        correct: true
        why: "Correct — the slides: comprehension increases, new ideas are generated, hits assist convergence, and earlier problems may be seen from a new perspective."
      - text: It replaces problem finding when a team is short of time
        why: Tempting because both are early stages, but the slides present them as separate; Problem Finding uses Fact Finding's hits.
  - key: q616
    type: mcq
    concept: creative-problem-solving-process
    difficulty: 4
    stem: A café chain goes straight from "sales are down" to brainstorming new menu items. Which risk does the creative problem-solving process highlight?
    options:
      - text: They used divergent thinking, which the process forbids before Solution Finding
        why: Tempting because brainstorming is divergent, but divergence appears throughout the process, including Objective Finding.
      - text: "Skipping fact and problem finding: ideas for the wrong problem"
        correct: true
        why: Correct — without gathering facts and defining the problem correctly (which the lecture calls extremely important), they may solve the wrong problem.
      - text: They should have started with Acceptance Finding before any new ideas
        why: Tempting because acceptance matters, but Acceptance Finding comes last, once a solution has been chosen.
      - text: They should have used convergent thinking to produce more menu items
        why: Tempting because convergence narrows things down, but producing many items is divergent; convergent thinking chooses.
  - key: q617
    type: mcq
    concept: creative-problem-solving-process
    difficulty: 2
    variant-of: q603
    stem: Convergent thinking, as defined on the slides, is…
    options:
      - text: coming up with many possible solutions to the one problem
        why: Tempting because it is defined beside convergent thinking, but this is the definition of divergent thinking.
      - text: solving a problem with only one single correct solution
        correct: true
        why: "Correct — the slide: convergent thinking is solving a problem with only one single correct solution."
      - text: listing obstacles to a solution and the ways to overcome them
        why: Tempting because it sounds like narrowing down, but this is part of Acceptance Finding, which the slides call divergent.
  - key: q618
    type: truefalse
    set: quickfire
    concept: creative-problem-solving-process
    difficulty: 1
    statement: Acceptance finding is a convergent activity.
    answer: false
    why: "False — the slide calls Acceptance Finding a divergent activity: listing obstacles, preventive and contingency plans, and an action plan."
  - key: q619
    type: truefalse
    set: quickfire
    concept: creative-problem-solving-process
    difficulty: 2
    statement: Objective finding uses divergent thinking to generate a list of problems, then convergence to identify the most relevant problem areas.
    answer: true
    why: True — the slide says objective finding essentially involves divergent thinking to list problems; convergence then identifies the most relevant areas.
  - key: q620
    type: truefalse
    set: quickfire
    concept: creative-problem-solving-process
    difficulty: 1
    statement: "The slides say creative problem solving is generalisable: it can be used in all aspects of life."
    answer: true
    why: True — the slide says creative problem solving is very generalisable and can be used in all aspects of life; other models are more domain specific.
  - key: q621
    type: short
    concept: creative-problem-solving-process
    difficulty: 3
    prompt: "\"Good ideas come from brainstorming, not from following a process.\" Discuss, applying the six stages of creative problem solving to a local council that wants more young people to use its libraries."
    model: |-
      The statement treats one stage as the whole. Brainstorming is divergent Idea Finding, but creative problem solving
      alternates divergent thinking (many possible solutions) and convergent thinking (narrowing to one) across six stages.
      In Objective Finding the council lists problem areas (opening hours, image, study space) and converges using
      ownership, priority and critical nature. Fact Finding gathers usage data and talks to young people, which may show the
      problem in a new light. Problem Finding uses those hits to define the problem correctly — perhaps "how might the
      library become a place to work with friends?" rather than "how do we advertise?". Markman's Dyson example shows why:
      the problem statement cues the knowledge retrieved. Only then does Idea Finding brainstorm, Solution Finding choose
      workable ideas, and Acceptance Finding plan for obstacles, contingencies and action. The process builds on natural
      creativity rather than replacing it. Its cost is time and discipline; but brainstorming alone risks generating ideas
      for the wrong problem.
    rubric:
      - id: r1
        criterion: Concept — sets out the six stages and divergent/convergent thinking.
        marks: 2
        top-band: Names all six stages in order and defines divergent and convergent thinking with the slide wording.
        margin-note: Where does brainstorming fit among the six?
        authorities: []
      - id: r2
        criterion: Example — uses a real example from the materials.
        marks: 2
        top-band: Uses Markman's Dyson reframing (or the creative gadgets tutorial) to show why problem definition matters.
        margin-note: Bring in a real case from the readings.
        authorities:
          - mgmt2094-markman-2017-how-you-define-the-problem
          - mgmt2094-example-dyson-bagless-vacuum
      - id: r3
        criterion: Application — applies each stage to the council.
        marks: 3
        top-band: Gives a concrete council action for each stage and marks where thinking diverges and converges.
        margin-note: What does the council do at each stage?
        authorities: []
      - id: r4
        criterion: Evaluation — answers the statement with a trade-off.
        marks: 2
        top-band: Concludes on the statement, weighing the time cost of the process against the risk of solving the wrong problem.
        margin-note: Is the process worth its cost?
        authorities: []
  - key: q701
    type: mcq
    concept: defining-the-problem
    difficulty: 1
    stem: According to Markman (2017), what acts as the cue to memory in creative problem solving?
    options:
      - text: The deadline set for the solution
        why: Tempting because deadlines shape how people think, but Markman says the statement of the problem is what reaches into memory.
      - text: The statement of the problem
        correct: true
        why: "Correct — Markman: when doing creative problem solving, the statement of the problem is the cue to memory that draws out related information."
      - text: The most senior person in the room
        why: Tempting because senior people steer discussion, but Markman's cue is the wording of the problem, not who is present.
      - text: The size of the research budget
        why: Tempting because Markman mentions R&D spending, but he contrasts big budgets with tapping memory; the budget is not the cue.
  - key: q702
    type: mcq
    concept: defining-the-problem
    difficulty: 1
    stem: Where do most people who come up with creative solutions find them, according to Markman?
    options:
      - text: In expensive research and development lasting decades
        why: Tempting because some firms do this (drug companies), but Markman says it is the costly alternative, not where most solutions come from.
      - text: By luck, as Archimedes did when he stepped into the bath
        why: Tempting because the story is famous, but Markman says some people stumble on answers; most rely on a more straightforward method.
      - text: Inside the collective memory of the people working on the problem
        correct: true
        why: "Correct — Markman: someone working on the problem knows something that will help; they just haven't realised yet that they know it."
      - text: Outside the box, by setting aside everything they already know
        why: Tempting because "think outside the box" is common advice, but Markman says we should find more descriptions of the box instead.
  - key: q703
    type: mcq
    concept: defining-the-problem
    difficulty: 1
    stem: How does Markman redescribe the vacuum cleaner problem in the Dyson example?
    options:
      - text: A vacuum needs a stronger, cheaper bag that traps more of the dirt
        why: Tempting because that is how the problem is usually framed, but focusing on the bag is exactly what Markman says to move away from.
      - text: A vacuum takes in dirt and air and has to separate the dirt from the air
        correct: true
        why: "Correct — this description generalises the problem: it does not mention the bag at all, so other ways of separating particles from air come to mind."
      - text: A vacuum needs a quieter motor, a lighter body and a longer power cord
        why: Tempting as a list of real product problems, but none of it appears in Markman's example, which is about separating dirt from air.
  - key: q704
    type: mcq
    concept: defining-the-problem
    difficulty: 2
    stem: Why does the description 'separate dirt from air' help, on Markman's account?
    options:
      - text: It drops the bag, so memory retrieves other ways to separate particles from air
        correct: true
        why: Correct — it generalises the problem by removing the specific components usually used to solve it, which led to industrial cyclones.
      - text: It names the bag more precisely, so that better bag designs come to mind
        why: Tempting because precision often helps, but focusing on the bag reminds you of bags; this description deliberately leaves the bag out.
      - text: It narrows the problem until only one single correct solution remains
        why: Tempting because narrowing is convergent thinking, but Markman wants descriptions that open up many possible solutions.
  - key: q705
    type: mcq
    concept: defining-the-problem
    difficulty: 2
    stem: What does Markman say about the ideal problem statement?
    options:
      - text: It is always the most abstract statement of the goal you can write
        why: Tempting because the abstract Dyson statement worked, but Markman says no single statement is ideal; specific ones have their use too.
      - text: It is always the most specific statement of the objects acted on
        why: Tempting because specific statements retrieve closely related knowledge, but that alone will not produce a radically new solution.
      - text: "There is none: creative people find many different descriptions"
        correct: true
        why: "Correct — Markman: there is no ideal problem statement; the most consistently creative people and groups find many different ways to describe the problem."
      - text: It is the first statement that the whole group can agree on
        why: Tempting because agreement feels productive, but Markman wants several descriptions, not early agreement on one.
  - key: q706
    type: mcq
    concept: defining-the-problem
    difficulty: 3
    stem: Specific problem statements that talk about the objects being acted on tend to retrieve…
    options:
      - text: highly related information, such as different types of vacuum bags
        correct: true
        why: "Correct — Markman: specific statements lead to retrieval of specific information highly related to the problem, e.g. different types of vacuum bags."
      - text: knowledge distantly related to the domain the problem is stated in
        why: Tempting because retrieval can travel far, but Markman says it is the abstract descriptions that reach distantly related knowledge.
      - text: no useful information at all, because they are far too narrow
        why: Tempting because Markman favours abstraction for radical ideas, but he says groups should still write some specific statements.
  - key: q707
    type: mcq
    concept: defining-the-problem
    difficulty: 3
    stem: Abstract descriptions that focus on the relationships among objects, or on the goal, help people recall…
    options:
      - text: only knowledge from the same product category as the problem
        why: Tempting because that is what most problem statements retrieve, but Markman says abstract ones reach beyond the problem's home domain.
      - text: knowledge more distantly related to the problem's domain
        correct: true
        why: "Correct — Markman: each abstract description helps people recall knowledge more distantly related to the domain in which the problem is stated."
      - text: the exact solution that competitors are already using
        why: Tempting because competitors are a natural reference point, but Markman is about retrieving your own distant knowledge, not copying.
  - key: q708
    type: mcq
    concept: defining-the-problem
    difficulty: 2
    stem: What does Markman's birthday-party and salad example show?
    options:
      - text: That memory is unreliable, so groups should not rely on it for ideas
        why: Tempting because memory can fail, but Markman uses the example to show how reliably cues retrieve related knowledge.
      - text: One cue retrieves related things; to recall something else, change the cue
        correct: true
        why: Correct — party hats, cake and singing come without effort from "birthday party"; switching to "salad" brings lettuce, tomatoes and dressing.
      - text: That people remember food better than they remember events
        why: Tempting because both examples involve food, but the point is about cues, not which kind of memory is stronger.
  - key: q709
    type: mcq
    concept: defining-the-problem
    difficulty: 3
    stem: Markman replaces the advice "think outside the box" with…
    options:
      - text: think inside the box more carefully and in greater detail
        why: Tempting as a contrarian twist, but Markman does not ask for more detail inside one description; he asks for more descriptions.
      - text: find more descriptions of the box
        correct: true
        why: "Correct — Markman: we should be asking people to find more descriptions of the box and see what that causes us to remember."
      - text: throw the box away and start again from a blank page
        why: Tempting because radical solutions feel like fresh starts, but Markman builds on what people already know, via new descriptions.
      - text: ask an outside expert to describe what lies beyond the box
        why: Tempting because outsiders bring new knowledge, but Markman's method draws on the group's own collective memory.
  - key: q710
    type: mcq
    concept: defining-the-problem
    difficulty: 3
    stem: A bank asks staff, "How do we make our branch queues shorter?" Applying Markman, which reframing is most likely to retrieve distantly related knowledge?
    options:
      - text: How do we add two more tellers to each of our branches?
        why: Tempting because it is practical, but it is more specific than the original — it names the objects (tellers, branches) and retrieves close knowledge.
      - text: How do customers get what they came for without waiting?
        correct: true
        why: Correct — this states the goal abstractly and drops the queue, so it can cue knowledge from distant domains, as "separate dirt from air" did.
      - text: How do we make the queue barriers more comfortable to wait at?
        why: Tempting because it improves the experience, but it focuses on the object (the queue), like focusing on the vacuum bag.
      - text: How do we shorten the line at our single busiest branch?
        why: Tempting because it targets the worst case, but narrowing to one branch makes the statement more specific, not more abstract.
  - key: q711
    type: mcq
    concept: defining-the-problem
    difficulty: 3
    stem: Why does Markman favour tapping memory as a problem-solving approach?
    options:
      - text: It is one of the most cost-effective and repeatable approaches
        correct: true
        why: "Correct — Markman: tapping into the individual's or group's memory is one of the most cost effective and repeatable problem-solving approaches."
      - text: It guarantees a workable solution within a fixed time frame
        why: Tempting because repeatable methods feel reliable, but Markman makes no guarantee; there is no ideal problem statement.
      - text: It removes the need for any discussion within the group
        why: Tempting because memory sounds individual, but Markman speaks of groups finding many descriptions together.
  - key: q712
    type: mcq
    concept: defining-the-problem
    difficulty: 2
    stem: Which three innovations does Markman open with, as stories that focus on the novel solution?
    options:
      - text: Dyson's vacuum, Picasso and Braque's cubism, Xerox PARC's desktop
        correct: true
        why: Correct — Markman opens with Dyson's bagless vacuum, the cubism of Picasso and Braque, and the spatial desktop interface developed at Xerox PARC.
      - text: The light bulb, the telephone and the printing press
        why: Tempting because they are classic invention stories, but they are not the examples Markman uses.
      - text: Immunisation, radioactivity and natural selection
        why: Tempting because they appear elsewhere this week, but they come from the slides and Sadler-Smith, not Markman.
      - text: Velcro, sticky notes and the microwave oven
        why: Tempting because they are famous accidental inventions, but none appears in Markman's article.
  - key: q713
    type: mcq
    concept: defining-the-problem
    difficulty: 4
    contrasts-with:
      - creative-problem-solving-process
    stem: Markman's argument most directly strengthens which stage of creative problem solving?
    options:
      - text: Acceptance finding — implementing the chosen solution successfully
        why: Tempting because a good idea still needs acceptance, but Markman's subject is how the problem is stated, before any solution exists.
      - text: Problem finding — defining the problem correctly
        correct: true
        why: Correct — Markman is about the problem statement as a cue to memory; Problem Finding identifies the most productive problem definition possible.
      - text: Solution finding — choosing between the possible solutions
        why: Tempting because better framing leads to better choices, but Markman addresses defining the problem, not choosing solutions.
      - text: Fact finding — gathering the relevant information about it
        why: Tempting because memory holds facts, but Markman is about how the statement cues memory, which is Problem Finding's job.
  - key: q714
    type: mcq
    concept: defining-the-problem
    difficulty: 3
    stem: Why, on Markman's account, do so many vacuum cleaner bags carry long lists of patent numbers?
    options:
      - text: Inventors focused on the bag, so they were reminded of bags and improved them
        correct: true
        why: "Correct — Markman: when you focus on the bag you are reminded of aspects of bags; the patents suggest many inventors did just that."
      - text: Bags are the hardest and most expensive part of a vacuum to make
        why: Tempting as an engineering explanation, but Markman draws a lesson about problem statements, not manufacturing cost.
      - text: Patents on bags stopped anyone from building a bagless vacuum
        why: Tempting because patents can block rivals, but Markman does not say this; Dyson in fact eliminated the bag.
  - key: q715
    type: mcq
    concept: defining-the-problem
    difficulty: 4
    stem: What is a limit of redescribing problems to tap memory, judged against Markman's own argument?
    options:
      - text: It can be used only by individuals working alone, never by groups
        why: Tempting because memory is personal, but Markman explicitly talks about groups and their collective memory.
      - text: Someone in the group must already know something relevant
        correct: true
        why: Correct — Markman's method finds solutions inside the collective memory of the people working on the problem; if no one knows anything relevant, redescription has nothing to retrieve.
      - text: It is the most expensive problem-solving method available
        why: Tempting as a cost objection, but Markman says it is one of the most cost-effective approaches, compared with big R&D budgets.
  - key: q716
    type: mcq
    concept: defining-the-problem
    difficulty: 3
    variant-of: q710
    stem: A food-delivery start-up asks, "How do we build a faster delivery bike?" Which redescription follows Markman's advice to generalise?
    options:
      - text: How do we make the frame of our delivery bike lighter?
        why: Tempting because it would make the bike faster, but it focuses on a component of the bike — more specific, not more general.
      - text: How do we get a hot meal from kitchen to customer quickly?
        correct: true
        why: Correct — it states the goal without the bike, so it can cue knowledge beyond bikes, as "separate dirt from air" dropped the bag.
      - text: How do we fit a bigger battery to our current delivery bike?
        why: Tempting because batteries matter for speed, but it still names the bike and a part of it, retrieving closely related knowledge.
  - key: q717
    type: mcq
    concept: defining-the-problem
    difficulty: 2
    stem: According to Markman, describing innovations only by their novel solutions makes creativity seem…
    options:
      - text: like simple luck that is open to anybody
        why: Tempting because Archimedes appears in the article, but Markman says solution-focused stories make creativity seem a mystery.
      - text: like a matter of how large the budget is
        why: Tempting because R&D spending is mentioned, but Markman's complaint is that such stories make creativity mysterious.
      - text: like a mystery
        correct: true
        why: "Correct — Markman: framing innovations this way makes creativity seem like a mystery: how could so many people have missed the solution?"
  - key: q718
    type: truefalse
    set: quickfire
    concept: defining-the-problem
    difficulty: 1
    statement: Markman says the most creative groups settle quickly on one ideal problem statement.
    answer: false
    why: False — Markman says there is no ideal problem statement; the most consistently creative people and groups find many different descriptions.
  - key: q719
    type: truefalse
    set: quickfire
    concept: defining-the-problem
    difficulty: 1
    statement: In Markman's account, the problem statement is the cue that draws related information out of memory.
    answer: true
    why: "True — Markman: when doing creative problem solving, the statement of the problem is the cue to memory that reaches in and draws out related information."
  - key: q720
    type: short
    concept: defining-the-problem
    difficulty: 3
    prompt: "\"To solve a problem creatively, you have to think outside the box.\" Discuss, using Markman (2017) and applying it to a supermarket chain that wants to reduce food waste."
    model: |-
      Markman would reject the slogan: we should find more descriptions of the box. Most creative solutions are found
      inside the collective memory of the people working on a problem, and the statement of the problem is the cue to that
      memory. Change the description and different knowledge is retrieved. His Dyson example shows it: thinking about
      vacuum bags recalls bags, but "separate the dirt from the air" recalls other ways of separating particles from air,
      such as industrial cyclones. For the supermarket, a specific statement — "how do we sell more bruised fruit?" —
      retrieves close knowledge such as discounts and displays. Abstract statements — "how do we match the food we hold to
      the food people will eat in time?" or "how do we give surplus food a second use?" — can cue distant knowledge, perhaps
      from logistics or hospitality. Markman's point is to write several of each, not to hunt for one ideal statement. The
      limit is that redescription only works if someone in the group already knows something relevant, so a diverse team
      matters; it is cheap and repeatable, but not a substitute for knowledge.
    rubric:
      - id: r1
        criterion: Concept — explains the problem statement as a cue to memory.
        marks: 2
        top-band: States that the problem statement cues memory and that changing it changes what is retrieved; there is no ideal statement.
        margin-note: Why does the wording of a problem matter?
        authorities:
          - mgmt2094-markman-2017-how-you-define-the-problem
      - id: r2
        criterion: Example — uses Markman's Dyson example accurately.
        marks: 2
        top-band: Explains how "separate the dirt from the air" drops the bag and leads to industrial cyclones.
        margin-note: Use the real case from the reading.
        authorities:
          - mgmt2094-example-dyson-bagless-vacuum
      - id: r3
        criterion: Application — writes specific and abstract statements for the supermarket.
        marks: 3
        top-band: Gives at least one specific and two abstract problem statements and says what each might retrieve.
        margin-note: Show the reframing, not just describe it.
        authorities: []
      - id: r4
        criterion: Evaluation — answers the statement and names a limit.
        marks: 2
        top-band: Rejects or qualifies the slogan, and notes the method depends on someone already knowing something relevant.
        margin-note: When would redescription fail?
        authorities: []
  - key: q801
    type: mcq
    concept: four-creative-thinking-preferences
    difficulty: 1
    set: pretest
    stem: Which creative-thinking preference asks, "Are we really solving the right problem?"
    options:
      - text: The Clarifier
        correct: true
        why: "Correct — the slide: the Clarifier is the person who asks whether we are really solving the right problem; they gather information and ask questions."
      - text: The Ideator
        why: Tempting because Ideators question assumptions, but they look at the big picture and dream of possibilities rather than checking the problem.
      - text: The Developer
        why: Tempting because Developers find flaws, but they find them in solutions, by tinkering and weighing pros and cons.
      - text: The Implementer
        why: Tempting because Implementers want the right result, but they are quick to action, not focused on re-examining the problem.
  - key: q802
    type: mcq
    concept: four-creative-thinking-preferences
    difficulty: 1
    stem: Which preference looks at the big picture, dreams of possibilities and jumps from A to Z?
    options:
      - text: The Clarifier
        why: Tempting because Clarifiers also explore, but they attend to detail and research, the opposite of jumping from A to Z.
      - text: The Ideator
        correct: true
        why: "Correct — the slide: the Ideator looks at the big picture, dreams of possibilities, stretches the imagination and jumps from A to Z."
      - text: The Developer
        why: Tempting because Developers work with ideas too, but they tinker with existing ideas rather than dream up new possibilities.
      - text: The Implementer
        why: Tempting because Implementers move fast, but they move fast into action, not across possibilities.
  - key: q803
    type: mcq
    concept: four-creative-thinking-preferences
    difficulty: 1
    stem: Which preference takes an idea and tinkers with it, improving on others' ideas?
    options:
      - text: The Clarifier
        why: Tempting because Clarifiers are methodical, but their focus is research and the right problem, not improving ideas.
      - text: The Ideator
        why: Tempting because Ideators toy with ideas, but they generate possibilities; tinkering with others' ideas is the Developer's mark.
      - text: The Developer
        correct: true
        why: "Correct — the slide: the Developer takes an idea and tinkers with it, improving on others' ideas and putting together workable solutions."
      - text: The Implementer
        why: Tempting because Implementers improve things by doing them, but they push ideas to fruition rather than refining them.
  - key: q804
    type: mcq
    concept: four-creative-thinking-preferences
    difficulty: 2
    stem: What risk do the slides attach to Implementers?
    options:
      - text: They get stuck developing the perfect solution and look like nit-pickers
        why: Tempting because it is a real risk this week, but it belongs to Developers, the perfectionists.
      - text: They can leap into action too soon, appear pushy and oversell their idea
        correct: true
        why: "Correct — the slide: unfortunately Implementers can leap into action too soon; they may appear too pushy and try to oversell their idea."
      - text: They crave information and keep asking questions before moving on
        why: Tempting because some people delay action this way, but craving information describes the Clarifier.
      - text: They toy with ideas and dream of possibilities but never commit
        why: Tempting as the opposite of action, but toying with ideas describes the Ideator, and the slide lists no such risk for Implementers.
  - key: q805
    type: mcq
    concept: four-creative-thinking-preferences
    difficulty: 2
    stem: What risk do the slides attach to Developers?
    options:
      - text: They leap into action too soon and try to oversell their idea
        why: Tempting because it is another listed risk, but it belongs to Implementers.
      - text: They jump from A to Z and lose touch with practical details
        why: Tempting because big jumps can miss details, but jumping from A to Z describes Ideators, and the slide gives it as a strength.
      - text: They can get stuck perfecting the solution and seem nit-pickers
        correct: true
        why: "Correct — the slide: Developers are perfectionists; they can get stuck developing the perfect solution, and others see them as nit-pickers."
      - text: They ask whether it is the right problem until the team stalls
        why: Tempting because questioning can slow a team, but asking about the right problem is the Clarifier's habit.
  - key: q806
    type: mcq
    concept: four-creative-thinking-preferences
    difficulty: 2
    stem: Which description fits the Clarifier?
    options:
      - text: Likes research, attends to detail, methodical, asks lots of questions
        correct: true
        why: "Correct — the slide: Clarifiers like research and gathering information, attend to the detail, are methodical and ask lots of questions."
      - text: Adventurous dreamer who stretches the imagination and jumps from A to Z
        why: Tempting because it is a vivid profile, but it describes the Ideator.
      - text: Decisive and determined; needs to see ideas hit fruition, always moving
        why: Tempting because Clarifiers also want to reach the solution, but this describes the Implementer.
      - text: Perfectionist who weighs pros and cons of competing solutions
        why: Tempting because both are careful, but weighing competing solutions describes the Developer.
  - key: q807
    type: mcq
    concept: four-creative-thinking-preferences
    difficulty: 3
    stem: In a product meeting, Sam keeps asking for more customer data and whether the team has framed the issue correctly. Which preference is Sam showing?
    options:
      - text: The Clarifier
        correct: true
        why: Correct — asking for more information and whether the team is solving the right problem is the Clarifier preference.
      - text: The Developer
        why: Tempting because Sam is being careful, but Developers refine solutions; Sam is questioning the problem itself.
      - text: The Implementer
        why: Tempting because Sam wants the issue settled, but Implementers push to action rather than asking for more data.
      - text: The Ideator
        why: Tempting because reframing can be imaginative, but Sam is gathering information and checking, not dreaming of possibilities.
  - key: q808
    type: mcq
    concept: four-creative-thinking-preferences
    difficulty: 3
    stem: Priya wants to launch the prototype next week and is already selling it hard to senior managers before testing. Which preference, and what is her risk?
    options:
      - text: Developer — she may get stuck perfecting the solution
        why: Tempting because she is invested in the prototype, but she is rushing it out, which is the reverse of perfectionism.
      - text: Ideator — she may dream of possibilities without detail
        why: Tempting because her enthusiasm is big-picture, but launching and selling is action, not dreaming.
      - text: Implementer — she may act too soon and oversell
        correct: true
        why: Correct — quick to action and wanting ideas to hit fruition is the Implementer; the slide warns of leaping too soon and overselling.
      - text: Clarifier — she may keep asking questions instead of acting
        why: Tempting because the team may need questions asked, but Priya is not asking them; she is pushing ahead.
  - key: q809
    type: mcq
    concept: four-creative-thinking-preferences
    difficulty: 3
    stem: Why do the slides recommend understanding your own creative-thinking preference?
    options:
      - text: It lets you avoid working in teams with people who think differently
        why: Tempting because knowing yourself can feel self-sufficient, but the slides recommend teams of people who think differently.
      - text: It can improve your creative performance
        correct: true
        why: "Correct — the slide: understanding your preference can improve your creative performance."
      - text: It tells you which quadrant of your brain is physically the largest
        why: Tempting because the Whole Brain Model profiles thinking too, but neither model measures the physical brain.
      - text: It removes the need to consider other people's paths to the solution
        why: Tempting because self-knowledge is useful, but the slides say to take into account the different paths to the solution.
  - key: q810
    type: mcq
    concept: four-creative-thinking-preferences
    difficulty: 3
    stem: Why should creative teams mix preferences, according to the slides?
    options:
      - text: Different thinkers bring complementary ideas and solve problems better
        correct: true
        why: "Correct — the slides: others who think differently should lead to complementary ideas, helping to solve a problem more effectively."
      - text: Mixed teams finish faster because each person skips the stages they dislike
        why: Tempting because specialisation saves time, but the slides speak of complementary ideas, not skipping stages.
      - text: Mixed teams avoid conflict because no two members ever disagree
        why: Tempting as a harmony argument, but different preferences are valued for complementary ideas, not for avoiding disagreement.
  - key: q811
    type: mcq
    concept: four-creative-thinking-preferences
    difficulty: 3
    stem: A team of Ideators and Developers produces polished concepts, but none is ever launched. Which preference is the team missing?
    options:
      - text: Another Developer, to keep improving the concepts until they are ready
        why: Tempting because polish seems the issue, but the concepts are already polished; more tinkering is the Developer risk, not the cure.
      - text: A Clarifier, to research the problem and ask more questions about it
        why: Tempting because Clarifiers check the problem, but this team's gap is getting ideas to fruition, not research.
      - text: An Implementer
        correct: true
        why: Correct — Implementers are quick to action and need to see ideas hit fruition; without one, polished concepts may never launch.
      - text: Another Ideator, to generate fresh concepts the market will notice
        why: Tempting because new ideas excite, but the team already has Ideators; it lacks someone to move to action.
  - key: q812
    type: mcq
    concept: four-creative-thinking-preferences
    difficulty: 4
    contrasts-with:
      - whole-brain-model
    stem: How do the four creative-thinking preferences differ from the Whole Brain Model's quadrants?
    options:
      - text: "They are the same model renamed: Clarifier is A, Ideator is B, and so on"
        why: Tempting because both have four parts, but they are separate frameworks; neither slide maps one onto the other.
      - text: Preferences are roles in solving (clarify to implement); quadrants are thinking styles
        correct: true
        why: Correct — the preferences describe where you like to work in creative problem solving; the quadrants profile logical, organised, interpersonal and holistic thinking.
      - text: The preferences are fixed at birth, while the quadrants change daily
        why: Tempting because one looks like personality, but neither slide claims this; both are presented as preferences you can work with.
      - text: Only the quadrants apply to teams; preferences apply to individuals
        why: Tempting because the quadrants profile a person, but the preferences slides are expressly about working in teams.
  - key: q813
    type: mcq
    concept: four-creative-thinking-preferences
    difficulty: 2
    stem: The lecturer linked knowing your creative-thinking preference to…
    options:
      - text: "IQ: knowing how intelligent you are compared with your team members"
        why: Tempting because self-assessment is involved, but the lecture spoke of emotional intelligence, not IQ.
      - text: "emotional intelligence: knowing your strengths and seeing them in others"
        correct: true
        why: "Correct — the lecture called it part of emotional intelligence: understand your strengths and weaknesses, see them in others, and match traits in a team."
      - text: "Maslow's esteem needs: earning respect and status within the team"
        why: Tempting because teams confer status, but the lecture did not tie the preferences to Maslow.
  - key: q814
    type: mcq
    concept: four-creative-thinking-preferences
    difficulty: 3
    variant-of: q807
    stem: Leo takes a colleague's rough campaign idea, weighs its pros and cons against two rivals, and builds a workable version. Which preference?
    options:
      - text: The Ideator
        why: Tempting because Leo works with a campaign idea, but he did not originate it; improving and weighing ideas is the Developer's work.
      - text: The Developer
        correct: true
        why: Correct — tinkering with another's idea, analysing competing solutions with their pros and cons, and building a workable one is the Developer.
      - text: The Implementer
        why: Tempting because he produced a working version, but the weighing and refining, not launching, is what he did.
      - text: The Clarifier
        why: Tempting because weighing options is methodical, but Clarifiers question the problem; Leo is improving a solution.
  - key: q815
    type: mcq
    concept: four-creative-thinking-preferences
    difficulty: 2
    stem: Which description fits the Implementer?
    options:
      - text: Asks whether this is the right problem and gathers information first
        why: Tempting because good implementation needs the right problem, but this is the Clarifier.
      - text: Takes an idea and tinkers with it, improving on other people's ideas
        why: Tempting because Implementers also change ideas in practice, but tinkering is the Developer's mark.
      - text: Quick to action, always moving forward; decisive and determined
        correct: true
        why: "Correct — the slide: Implementers are quick to action, always moving forward, need to see ideas hit fruition, and are decisive and determined."
  - key: q816
    type: mcq
    concept: four-creative-thinking-preferences
    difficulty: 4
    variant-of: q811
    stem: A start-up team is made up entirely of Clarifiers. Which problem is most likely, on the slides' descriptions?
    options:
      - text: Plenty of research and questions, but few bold ideas and slow action
        correct: true
        why: Correct — Clarifiers research and question; without Ideators (out-of-the-box ideas) and Implementers (quick to action) those paths to the solution are missing.
      - text: Too many wild ideas and too little attention to any detail at all
        why: Tempting as a team failure, but wild ideas without detail would be a team of Ideators, the opposite of Clarifiers.
      - text: Ideas launched before anyone has checked they solve the right problem
        why: Tempting because launch risk is real, but a team of Clarifiers is the least likely to skip checking the problem.
      - text: Endless polishing of one solution that is never quite good enough
        why: Tempting because it is a stalling risk, but endless polishing is the Developer's risk, not the Clarifier's.
  - key: q817
    type: mcq
    concept: four-creative-thinking-preferences
    difficulty: 2
    stem: The Ideator is described as…
    options:
      - text: a perfectionist who analyses competing solutions in detail
        why: Tempting because Ideators handle ideas, but analysing competing solutions is the Developer.
      - text: adventurous, a dreamer who stretches the imagination
        correct: true
        why: "Correct — the slide: Ideators like to toy with ideas, stretch their imagination with out-of-the-box ideas, and are adventurous and dreamers."
      - text: methodical, attending to detail and asking many questions
        why: Tempting because both explore, but being methodical and asking questions describes the Clarifier.
      - text: decisive and determined to see every idea hit fruition
        why: Tempting because Ideators are energetic, but decisiveness and fruition describe the Implementer.
  - key: q818
    type: truefalse
    set: quickfire
    concept: four-creative-thinking-preferences
    difficulty: 1
    statement: Developers are quick to action and can leap into action too soon.
    answer: false
    why: False — leaping into action too soon is the Implementer's risk; Developers are perfectionists who can get stuck developing the perfect solution.
  - key: q819
    type: truefalse
    set: quickfire
    concept: four-creative-thinking-preferences
    difficulty: 1
    statement: The slides say working in teams with people who think differently should lead to complementary ideas.
    answer: true
    why: "True — the slide: by working in teams you may have others who think differently to you, and this should lead to complementary ideas."
  - key: q820
    type: short
    concept: four-creative-thinking-preferences
    difficulty: 3
    prompt: "\"The best creative teams are made of people who think alike.\" Discuss, using the four preferences for thinking creatively and applying them to forming a team for the unit's group innovation project."
    model: |-
      The statement runs against the slides, which say that working with others who think differently should lead to
      complementary ideas and solve a problem more effectively. There are four creative-thinking preferences. The Clarifier
      asks whether we are solving the right problem, researches and asks questions. The Ideator looks at the big picture and
      stretches the imagination. The Developer tinkers with ideas, weighs pros and cons and builds workable solutions, but
      can get stuck perfecting. The Implementer is quick to action and decisive, but can leap too soon and oversell. For the
      Week 5 tutorial's group innovative video project, I would first identify my own preference, since understanding it can
      improve creative performance, then recruit so that all four are present. In running the team, the Clarifier tests the
      brief, Ideators lead idea generation, Developers refine the shortlist, and the Implementer keeps the schedule moving.
      Like-minded teams do have an advantage — less friction — but a team of Implementers would launch too early and a team
      of Developers might never launch. The lecture's emotional-intelligence point is the key: knowing strengths and
      weaknesses lets a team match traits rather than copy them.
    rubric:
      - id: r1
        criterion: Concept — describes all four preferences with strengths and risks.
        marks: 2
        top-band: Defines Clarifier, Ideator, Developer and Implementer in the slide terms, including the Developer and Implementer risks.
        margin-note: What does each preference contribute?
        authorities: []
      - id: r2
        criterion: Example — uses a real example from the materials.
        marks: 2
        top-band: Applies the preferences to the Week 5 tutorial's group innovative video project.
        margin-note: Where in this unit would you use this?
        authorities:
          - mgmt2094-example-creative-gadgets-tutorial
      - id: r3
        criterion: Application — builds and runs the team.
        marks: 3
        top-band: Shows how each preference is recruited and given a role, and how risks such as acting too soon are checked.
        margin-note: Who does what, and when?
        authorities: []
      - id: r4
        criterion: Evaluation — answers the statement with a trade-off.
        marks: 2
        top-band: Acknowledges the comfort of like-minded teams but concludes, with the slides, that complementary preferences solve problems better.
        margin-note: What do like-minded teams gain and lose?
        authorities: []
  - key: q821
    type: match
    concept: four-creative-thinking-preferences
    difficulty: 1
    prompt: Match each creative-thinking preference to its description.
    pairs:
      - left: Clarifier
        right: Asks "are we really solving the right problem?"; researches and asks questions
      - left: Ideator
        right: Looks at the big picture; dreams of possibilities; jumps from A to Z
      - left: Developer
        right: Tinkers with ideas; weighs pros and cons; can get stuck perfecting
      - left: Implementer
        right: Quick to action; decisive; can leap too soon and oversell
