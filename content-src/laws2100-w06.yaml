      - id: r1
        criterion: Thesis — takes a position on whether open texture is a genuine middle way.
        marks: 2
        top-band: States a qualified thesis that locates the risk (the settled core) in the first two sentences.
        margin-note: Middle way, or split the difference?
        authorities: []
      - id: r2
        criterion: Argument — explains generality, the vehicles example, open texture, the two handicaps and the two social needs.
        marks: 3
        top-band: Uses Hart's pinpoints (124, 126, 128, 130, 147) accurately and in order.
        margin-note: Nice use of the text.
        authorities:
          - hart-the-concept-of-law
      - id: r3
        criterion: Counterargument — presents Fuller's purpose objection and/or the postmodern denial of stable meaning.
        marks: 3
        top-band: Shows how either objection attacks the core, not just the penumbra.
        margin-note: Which part of Hart does this hit?
        authorities: []
      - id: r4
        criterion: Evaluation — decides whether the core survives these objections.
        marks: 2
        top-band: Makes the verdict turn on the stability of the core and says why.
        margin-note: 'Good: the verdict follows from the argument.'
        authorities: []
  - key: e01
    type: mcq
    concept: nightmare-and-noble-dream
    difficulty: 2
    stem: What is "the Nightmare" in Hart's lecture on American jurisprudence?
    options:
      - text: 'That the image of the judge as different from the legislator is an illusion: judges make law.'
        correct: true
        why: 'Right: the slide says the Nightmare is that the image of the judge (as different from the legislator) is an illusion.'
      - text: That judges never make law, even when statutes and precedents offer no determinate guide.
        why: This is the Noble Dream, the opposite extreme, with Dworkin as its noblest dreamer.
      - text: That the US Supreme Court will lose its power of judicial review to the political branches.
        why: Hart notes the court's extraordinary role, but the Nightmare concerns judges as law-makers, not a loss of power.
      - text: That litigants will stop bringing their disputes to courts, since the outcome is always known.
        why: 'The Nightmare is the reverse worry: litigants cannot rely on existing law, because judges make new law.'
  - key: e02
    type: mcq
    concept: nightmare-and-noble-dream
    difficulty: 2
    stem: Who, according to Hart, presented the Nightmare as an essential feature of law and adjudication, not just of difficult cases?
    options:
      - text: Dworkin and the interpretivists
        why: Dworkin is the noblest dreamer, at the other extreme from the Nightmare.
      - text: American Legal Realism
        correct: true
        why: 'Right: the slide says some scholars, in particular American Legal Realism, presented it as an essential feature of law and adjudication.'
      - text: The natural law tradition
        why: Hart says the Noble Dream is not an invocation of natural law; natural law is not the source of the Nightmare either.
      - text: Austin and the utilitarians
        why: Austin's theory is about commands and the sovereign, not the Nightmare about judges.
  - key: e03
    type: mcq
    concept: nightmare-and-noble-dream
    difficulty: 2
    variant-of: e01
    stem: What is "the Noble Dream"?
    options:
      - text: That judges should openly make new law whenever existing law gives no clear answer, and say so.
        why: This describes judicial law-making, which the Noble Dream denies ever happens.
      - text: That even when positive law is indeterminate there is an existing law somewhere that judges can and should apply.
        correct: true
        why: 'Right: the slide defines the Noble Dream as the notion that there is none the less an existing law somewhere which judges can and should apply.'
      - text: That legislatures will one day draft statutes so precisely that no case will ever be hard for a judge.
        why: The Dream is about judges always finding existing law, not about perfectly drafted legislation.
      - text: That every legal system will come to share one universal natural law, applied by judges everywhere.
        why: Hart says the American Noble Dream does not take the form of an invocation of a universal natural law.
  - key: e04
    type: mcq
