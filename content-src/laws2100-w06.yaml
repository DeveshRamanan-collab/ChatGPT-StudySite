        why: 'A realist might describe it that way, but the view the judge states is that existing law always has an answer: the Noble Dream.'
      - text: 'In the Noble Dream: even when positive law is indeterminate there is existing law to apply.'
        correct: true
        why: 'Right: this is the Noble Dream, which the lecture links to Dworkin''s one right answer thesis.'
