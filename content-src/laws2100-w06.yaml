  - key: e10
    type: mcq
    concept: nightmare-and-noble-dream
    difficulty: 3
    stem: How does the lecture connect the Noble Dream to Dworkin's liberal view of the purpose of law?
    options:
      - text: If law justifies state coercion, people's legal positions must be settled before they reach court, not made by the judge.
        correct: true
        why: "Right: for Dworkin law justifies state coercion, so the law must be gapless: people's legal positions are already determined ex ante by the system, not created by the judge."
      - text: If law is a prediction of what judges do, people should accept whatever outcome the judge reaches as legitimate.
        why: "Tempting because prediction is a realist theme, but the prediction theory fits the Nightmare (judges make law); the Noble Dream says judges never make law, even in hard cases."
      - text: If law serves the dominant class, a liberal must deny that judges ever make law, to hide the injustice from view.
        why: "Tempting because CLS says law serves the dominant class, but that is CLS's critique; the lecture ties the Noble Dream to Dworkin's liberal view that law justifies coercion."
      - text: If law is the union of primary and secondary rules, judges must always find a rule to apply to each case.
        why: "Tempting because Hart's theory is about rules, but Hart accepts that rules run out in the penumbra and judges then exercise discretion; he calls Dworkin the noblest dreamer."
  - key: e11
