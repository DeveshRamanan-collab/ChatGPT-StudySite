  - key: d10
    type: mcq
    concept: open-texture-and-harts-middle-way
    difficulty: 3
    stem: Every legal system, Hart says, compromises between two social needs. What are they?
    options:
      - text: The need for rules individuals can apply to themselves without fresh official guidance, and the need to leave issues open for an informed, official choice in the concrete case.
        correct: true
