        why: Discretion is not the link; the point is that identifying the materials requires a positivist account of legality.
      - text: Because positivism holds that all law is morally neutral, so both sides can always cite some neutral rule in their favour.
        why: Leiter's argument is about identifying sources, not about the moral neutrality of the law.
      - text: Because positivism predicts judicial decisions, and the realist argument needs a prediction to count as support at all.
        why: Prediction is the realist's, not the positivist's, contribution; Leiter's point concerns criteria of legality.
