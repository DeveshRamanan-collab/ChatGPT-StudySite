      - text: The need for rules that are morally just, and the need for rules that are effective in practice, even when they are unjust.
        why: This sounds like the Hart–Fuller debate on legality, not the two social needs Hart names in chapter VII.
      - text: The need for a sovereign who is habitually obeyed, and the need for rules of change that allow the sovereign to be replaced.
        why: These recall Hart's criticisms of Austin, not the certainty/flexibility compromise in chapter VII.
      - text: The need for judges to predict other judges' decisions, and the need for lawyers to predict what judges will do in fact.
