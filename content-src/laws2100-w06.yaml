cards:
  - type: basic
    concept: realism-against-formalism
    front: 'Formalism (the realists'' target): four features?'
    back: 1 Law as a self-contained system of rules. 2 Judges decide by deductive/syllogistic reasoning (mechanical jurisprudence). 3 Rules are like mathematical propositions that mechanically generate results. 4 Judicial reasoning is independent from moral, political, economic and social considerations.
    source: Week 06 Lecture Slides, slide 5
  - type: cloze
    concept: realism-against-formalism
    text: '"The life of the law has not been {{c1::logic}}; it has been {{c2::experience}}" (Holmes, The Common Law, 1881).'
    source: Week 06 Lecture Slides, slide 3
  - type: basic
    concept: realism-against-formalism
    front: Law in books vs law in action?
    back: 'Paper rules vs real rules: the realists say the rules in books differ from what courts actually do, and it is the law in action that explains decisions.'
    source: Week 06 Lecture Slides, slide 6
  - type: basic
    concept: realism-against-formalism
    front: Two families of legal realism, with names?
    back: 'American: Holmes, Pound, Oliphant, Frank, Llewellyn, Cohen. Scandinavian: Hagerstrom, Lundstedt, Olivecrona, Ross.'
    source: Week 06 Lecture Slides, slide 2
  - type: cloze
    concept: realism-against-formalism
    text: Formalism in adjudication was also called {{c1::mechanical jurisprudence}}.
    source: Week 06 Lecture Slides, slide 5
  - type: basic
    concept: holmes-prediction-theory
    front: Holmes's prediction theory of law?
    back: '"The prophecies of what the courts will do in fact, and nothing more pretentious, are what I mean by the law." (The Path of the Law (1897) 10(8) Harvard Law Review 460–461)'
    source: Week 06 Lecture Slides, slide 8
  - type: basic
    concept: holmes-prediction-theory
    front: Bad man vs puzzled man?
    back: Holmes's bad man cares only about the practical consequences (what courts will do). Hart's puzzled person wants to know what the law requires in order to arrange their affairs (marry, make a will, contract).
    source: Week 06 Lecture Slides, slide 10
  - type: basic
    concept: holmes-prediction-theory
    front: Four counterarguments to realism from slide 10 (Hart)?
    back: 1 It misses the internal point of view. 2 It makes it impossible to say a court made a mistake. 3 Why prefer the bad man to the puzzled person? 4 If there are no rules, how do we know who a judge is?
    source: Week 06 Lecture Slides, slide 10
  - type: apply
    concept: holmes-prediction-theory
    scenario: An appeal court holds that the trial judge misread a statute. A strict Holmesian says the trial judge "made the law" for that case.
    answer: 'Hart: finality is not infallibility. The prediction theory cannot explain the claim that a court got the law wrong, which lawyers make every day.'
    source: Week 06 Lecture Slides, slide 10
  - type: basic
    concept: holmes-prediction-theory
    front: Ross on ownership ("Tû-Tû")?
    back: Ownership has no semantic reference in the world; it is a placeholder linking a number of factual statements to a number of legal consequences.
    source: Week 06 Lecture Transcript
  - type: basic
    concept: conceptual-and-empirical-rule-scepticism
    front: Conceptual rule-scepticism?
    back: 'About the nature of law: the real law is not the paper rules; we are under a legal duty not to do X iff the courts say so, because X is likely to result in an adverse ruling.'
    source: Week 06 Lecture Slides, slide 7
  - type: basic
    concept: conceptual-and-empirical-rule-scepticism
    front: Empirical rule-scepticism?
    back: 'About adjudication: judges respond to the underlying facts rather than to rules; so many rules might be relevant that there is always support for both sides; conflicting ways of interpreting statutes and precedents.'
    source: Week 06 Lecture Slides, slide 7
  - type: cloze
    concept: conceptual-and-empirical-rule-scepticism
    text: Idiosyncratic adjudication ({{c1::Frank}}), sociological adjudication ({{c2::Llewellyn}}), pragmatic adjudication ({{c3::Cohen}}).
    source: Week 06 Lecture Slides, slide 9
  - type: apply
    concept: conceptual-and-empirical-rule-scepticism
    scenario: A scholar accepts that the legal system has valid rules but finds that tenancy cases are decided by who the landlord is, whatever the rule says.
    answer: 'Empirical, not conceptual, rule-scepticism: rules exist, but judges respond to the facts rather than to rules.'
    source: Week 06 Lecture Slides, slide 7
  - type: basic
    concept: open-texture-and-harts-middle-way
    front: Hart's two devices for communicating general standards?
    back: 'Legislation (explicit general language: "Every man and boy must take off his hat entering a church") and precedent (example: "Look – this is the right way to behave").'
    source: Week 06 Lecture Slides, slide 12
  - type: cloze
    concept: open-texture-and-harts-middle-way
    text: '"If anything is a vehicle a {{c1::motor-car}} is one" — but does "vehicle" include {{c2::bicycles, airplanes, roller skates}}? (CL 126)'
    source: Week 06 Lecture Slides, slide 13
  - type: basic
    concept: open-texture-and-harts-middle-way
    front: Open texture (CL 128)?
    back: 'Natural languages are irreducibly open-textured: "…uncertainty at the borderline is the price to be paid for the use of general classifying terms in any form of communication concerning matters of fact."'
    source: Week 06 Lecture Slides, slide 14
  - type: basic
    concept: open-texture-and-harts-middle-way
    front: The two handicaps of the human predicament?
    back: Our relative ignorance of fact and our relative ignorance of aim (we are human beings, not gods).
    source: Week 06 Lecture Slides, slide 14
  - type: cloze
    concept: open-texture-and-harts-middle-way
    text: '"Formalism and rule-scepticism are the {{c1::Scylla and Charybdis}} of juristic theory; they are great exaggerations, salutary where they correct each other, and the truth lies {{c2::between them}}" (CL 147).'
    source: Week 06 Lecture Slides, slide 15
  - type: apply
    concept: open-texture-and-harts-middle-way
    scenario: A bylaw bans "vehicles" from a park; a council officer stops a motor-car and, separately, a child on roller skates.
    answer: 'Motor-car: core, plain case, rule applies. Roller skates: penumbra; reasons for and against, so a choice between open alternatives (discretion).'
    source: Week 06 Lecture Slides, slide 13
  - type: basic
    concept: nightmare-and-noble-dream
    front: The Nightmare?
    back: 'That the image of the judge as different from the legislator is an illusion: judges make law. American Legal Realism presented it as an essential feature of law and adjudication.'
    source: Week 06 Lecture Slides, slide 17
  - type: basic
    concept: nightmare-and-noble-dream
    front: The Noble Dream?
    back: 'Judges never make new law: even when positive law is indeterminate there is an existing law somewhere to apply. Not an invocation of natural law. Dworkin is the noblest dreamer of all.'
    source: Week 06 Lecture Slides, slide 18
  - type: cloze
    concept: nightmare-and-noble-dream
    text: 'Hart: American jurisprudence shows "a concentration, almost to the point of {{c1::obsession}}, on the {{c2::judicial process}}".'
    source: Week 06 Lecture Slides, slide 16
  - type: basic
    concept: leiter-realism-as-theory-of-adjudication
    front: The two widespread views Leiter challenges?
    back: (1) Legal realism and legal positivism are incompatible. (2) Legal realism is "a jurisprudential joke", "a philosophical mess". Both trace to Hart's chapter VII.
    source: Week 06 Lecture Slides, slide 19
  - type: basic
    concept: leiter-realism-as-theory-of-adjudication
    front: 'Leiter: what kind of theory is realism?'
    back: 'A descriptive theory of adjudication (not a rival general theory of law): judges react to the facts; decisions fall into situation types; law is rationally indeterminate; empirical rule scepticism.'
    source: Week 06 Lecture Slides, slide 20
  - type: cloze
    concept: leiter-realism-as-theory-of-adjudication
    text: For Leiter, Hart has good arguments against {{c1::conceptual}} rule scepticism but none against {{c2::empirical}} rule scepticism.
    source: Week 06 Lecture Slides, slide 21
  - type: basic
    concept: leiter-realism-as-theory-of-adjudication
    front: Three features of the realism–positivism relationship (Leiter)?
    back: '1 Both think law is indeterminate (different source and scope). 2 Realist indeterminacy arguments presuppose a positivistic account of legality. 3 They disagree over how often rules matter: an empirical question.'
    source: Week 06 Lecture Slides, slide 22
  - type: basic
    concept: critical-legal-studies
    front: 'CLS: three influences?'
    back: Legal realism, postmodernism and Marxism.
    source: Week 06 Lecture Slides, slide 23
  - type: basic
    concept: critical-legal-studies
    front: CLS vs legal realism?
    back: 'Shared: law is indeterminate; legal reasoning is a myth. CLS goes further: more interest in the politics and ideology of law; more radical indeterminacy (postmodernism: words do not have stable meaning).'
    source: Week 06 Lecture Slides, slide 24
  - type: basic
    concept: critical-legal-studies
    front: CLS key claims?
    back: Radical indeterminacy; no coherent sense out of the materials; law contradictory because it stems from political conflict; yet predictable because judges share a commitment to the status quo; law as ideology; scepticism about neutral concepts.
    source: Week 06 Lecture Slides, slide 28
  - type: apply
    concept: critical-legal-studies
    scenario: 'A CLS scholar says contract law''s "freedom of contract" hides the power of employers over workers. A positivist says: "Maybe, but that is a criticism of the law, not a claim about what law is."'
    answer: 'The dispute is about the is/ought distinction: CLS says we must look at the values and ideologies behind the system; the positivist separates describing law from evaluating it.'
    source: Week 06 Lecture Transcript
audio:
  title: Week 6 recap — legal realism and critical legal studies
  minutes: 3
  script: |-
    This week is legal realism, and then critical legal studies. Realism is an umbrella term, with an American family, Holmes, Pound, Oliphant, Frank, Llewellyn and Cohen, and a Scandinavian family, with Alf Ross the most influential. The target was formalism: law as a self-contained system of rules, judges applying rules to facts by syllogism, mechanical jurisprudence, reasoning sealed off from morals, politics and economics. Holmes answered that the life of the law has not been logic; it has been experience.

    In The Path of the Law Holmes tells us to look at law through the eyes of the bad man, who does not care two straws for axioms or deductions and wants to know what the courts will do in fact. The prophecies of what the courts will do, and nothing more pretentious, are what he means by the law. That is the prediction theory.

    Next, the distinction that does the most work. Conceptual rule-scepticism is about the nature of law: we have a legal duty not to do something if and only if the courts say so. Empirical rule-scepticism is about adjudication: judges respond to the facts, not to the rules, because there is always support for both sides. You can hold the second without the first.

    Hart replies in chapter seven. Realism ignores the internal point of view, cannot say a court made a mistake, prefers the bad man to the puzzled man, and cannot tell us who a judge is. His own account is open texture. A motor-car is plainly a vehicle; roller skates are not clearly one. Uncertainty at the borderline is the price of general classifying terms, and we labour under ignorance of fact and of aim. Formalism and rule-scepticism are the Scylla and Charybdis of juristic theory; the truth lies between them. In the same spirit Hart calls realism the Nightmare, judges always make law, and Dworkin the noblest dreamer, judges never make law.

    Leiter pushes back on Hart. Realism is not a rival theory of law but a descriptive theory of adjudication, resting on empirical rule-scepticism, which Hart never refutes. Realists even presuppose a positivist account of what counts as law. What is left is an empirical question: how often do rules in books cause decisions?

    Finally, critical legal studies takes realism further, adding postmodernism and Marxism. Law is radically indeterminate, contradictory because it comes from political conflict, and an ideology that serves the powerful while presenting itself as neutral. For these critics the line between law as it is and law as it ought to be makes no sense, and that is the point to test in the essay.
