  - key: s03
    type: short
    concept: open-texture-and-harts-middle-way
    difficulty: 3
    contrasts-with:
      - critical-legal-studies
    prompt: '"Formalism and rule-scepticism are the Scylla and Charybdis of juristic theory." Does Hart''s account of open texture successfully steer between them?'
    model: 'Mostly, yes. Hart starts from the generality of law: if general standards could not be communicated, nothing we now recognise as law could exist (CL 124). But there is a limit, inherent in language, to the guidance general language can provide. A motor-car is plainly a vehicle; bicycles, airplanes and roller skates are not clearly so (CL 126). Natural languages are irreducibly open-textured, and we labour under relative ignorance of fact and of aim, so uncertainty at the borderline is the price of general classifying terms (CL 128). Against formalism, then, not every case follows mechanically; in the penumbra a choice between open alternatives must be made. Against the rule-sceptic, plain cases constantly recur and without them general terms would be useless. Every system compromises between certain rules individuals can apply to themselves and issues left open for an informed, official choice (CL 130). The weak point is the core itself: Fuller says meaning depends on purpose, and a postmodern critic denies that words have stable meaning at all. Hart''s middle way holds only if the core is really settled.'
