  - key: s01
    type: short
    concept: holmes-prediction-theory
    difficulty: 3
    prompt: '"The prophecies of what the courts will do in fact, and nothing more pretentious, are what I mean by the law." Is Holmes''s prediction theory an adequate account of what law is?'
    model: No, as an account of what law is, though it captures something true about legal practice. Holmes asks us to see law through the eyes of the bad man, who does not care two straws for axioms or deductions and wants only to know what the courts are likely to do in fact. On this view we are under a legal duty not to do X because doing X is likely to result in an adverse court ruling. That fits how a lawyer answers a client ("it depends; let's predict what a judge will say"). But three objections from chapter VII bite. First, the bad man ignores the internal point of view that participants, above all officials, take; the puzzled person who wants to arrange their affairs by law has at least as good a claim to be the standard case. Second, if law is what courts will do, a court can never make a mistake about the law, yet appeals are argued on exactly that basis. Third, without rules we cannot say who a judge is. On balance the prediction theory describes one perspective on law, not law itself.
    rubric:
      - id: r1
        criterion: Thesis — takes a clear position on whether the prediction theory is adequate as an account of what law is.
        marks: 2
        top-band: States a qualified thesis in the first sentence, separating law itself from one perspective on it.
        margin-note: Adequate for what? Say so up front.
        authorities: []
      - id: r2
        criterion: Argument — explains the bad man, the prediction theory and the realist account of legal duty.
        marks: 3
        top-band: Quotes or closely paraphrases the Path of the Law passage and links it to duty as a likely adverse ruling.
        margin-note: Good use of Holmes's own words.
        authorities:
          - holmes-the-path-of-the-law
      - id: r3
        criterion: 'Counterargument — deploys Hart''s objections: internal point of view, finality/infallibility, who is a judge, the puzzled man.'
        marks: 3
        top-band: Uses at least two objections precisely and explains why each is a problem, not just that it exists.
        margin-note: Why can't a court be wrong on this theory?
        authorities:
          - hart-the-concept-of-law
      - id: r4
        criterion: Evaluation — weighs what the theory gets right (the practitioner's view) against the objections, and reaches a reasoned verdict.
        marks: 2
        top-band: Concedes the theory's insight about legal practice before explaining why it fails as a theory of law.
        margin-note: Credit the theory before you bury it.
        authorities: []
  - key: c01
    type: mcq
