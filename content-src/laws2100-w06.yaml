  - key: s02
    type: short
    concept: conceptual-and-empirical-rule-scepticism
    difficulty: 3
    contrasts-with:
      - leiter-realism-as-theory-of-adjudication
    prompt: Does the distinction between conceptual and empirical rule-scepticism rescue legal realism from Hart's criticisms?
    model: 'Largely yes. Conceptual rule-scepticism is a claim about the nature of law: the real law is not the paper rules, and we are under a legal duty not to do X if and only if the courts say so. Empirical rule-scepticism is a claim about adjudication: judges respond to the underlying facts rather than to legal rules, because so many rules might be relevant that there is always support for both sides and statutes and precedents can be read in conflicting ways. You can hold the second without the first. Hart''s strongest arguments (finality versus infallibility, the need for rules to identify who is a judge, the internal point of view) are aimed at the idea that rules do not exist or are not law, so they hit conceptual scepticism. Leiter adds that the realists could not be conceptual sceptics anyway, because their indeterminacy arguments presuppose a positivist account of legality. Against this, Hart''s core/penumbra account still challenges the empirical sceptic: not every case is hard. The rescue works for the conceptual charge, but leaves an empirical dispute about how often rules matter.'
    rubric:
      - id: r1
        criterion: Thesis — says whether, and how far, the distinction rescues realism.
        marks: 2
        top-band: States a qualified thesis that names what is rescued and what remains contested.
        margin-note: Rescued from which criticism?
        authorities: []
      - id: r2
        criterion: Argument — defines both kinds of scepticism accurately and shows that one can hold the empirical kind alone.
        marks: 3
        top-band: Uses the slide's bullets for each kind and the lecture's point that empirical scepticism can be agnostic about rules.
        margin-note: Clear on the difference.
        authorities:
          - hart-the-concept-of-law
      - id: r3
        criterion: 'Counterargument — presents Hart''s core/penumbra reply to the empirical sceptic: not all cases are hard.'
        marks: 3
        top-band: Explains that Hart concedes indeterminacy only in the penumbra, so empirical scepticism overstates how often rules fail.
        margin-note: Does Hart really have nothing against the empirical claim?
        authorities: []
      - id: r4
        criterion: Evaluation — uses Leiter to locate the remaining disagreement as empirical, and reaches a verdict.
        marks: 2
        top-band: Identifies the leftover question (do rules in books play a causal role?) as empirical, not conceptual.
        margin-note: 'Good: the dispute changes kind.'
        authorities:
          - leiter-legal-realism-and-legal-positivism-reconsidered
  - key: d01
    type: mcq
    concept: open-texture-and-harts-middle-way
    difficulty: 1
    set: pretest
    stem: In Hart's example of a rule forbidding vehicles in a park, which case falls in the core of "vehicle"?
    options:
      - text: A motor-car
        correct: true
        why: 'Right: "If anything is a vehicle a motor-car is one" is Hart''s plain case (CL 126).'
      - text: Roller skates
        why: Roller skates are one of Hart's unclear cases where it is not clear whether the general term applies.
      - text: A bicycle
        why: Bicycles are among Hart's doubtful cases ("Does vehicle include bicycles…?"), in the penumbra.
      - text: An aeroplane
        why: Airplanes are in Hart's list of cases where it is not clear whether "vehicle" applies.
  - key: d02
    type: mcq
    concept: open-texture-and-harts-middle-way
    difficulty: 2
    stem: What are the two principal devices for communicating general standards of conduct, according to Hart?
    options:
      - text: Legislation and precedent
        correct: true
        why: 'Right: the slide says the two principal devices are legislation (explicit general language) and precedent (communication by example).'
      - text: Commands and sanctions
        why: This is Austin's vocabulary for laws; Hart's two devices for communicating standards are legislation and precedent.
      - text: Primary and secondary rules
        why: These are the two kinds of rules in Hart's theory, not two ways of communicating standards.
      - text: Custom and morality
        why: Neither custom nor morality is one of the two devices Hart names on the slide.
  - key: d03
    type: mcq
    concept: open-texture-and-harts-middle-way
    difficulty: 2
    variant-of: d02
    stem: '"Look – this is the right way to behave on such occasions." Which device of communication does this illustrate?'
    options:
      - text: Communication by explicit general forms of language, as in legislation
        why: The legislation example is "Every man and boy must take off his hat entering a church"; this one shows by example.
      - text: Communication by example, as in precedent
        correct: true
        why: 'Right: the slide gives this as communication by example, the precedent device.'
      - text: Communication by command backed by a threat, as in Austin
        why: There is no threat; Hart uses the example to illustrate communication by example.
      - text: Communication by principle, as in Dworkin's theory of adjudication
        why: Dworkin's principles are not the device here; Hart contrasts general language with authoritative example.
  - key: d04
    type: mcq
    concept: open-texture-and-harts-middle-way
    difficulty: 3
    stem: What does Hart say about the contrast between the uncertainty of precedent and the certainty of legislation?
    options:
      - text: The distinction is far less firm than the naïve contrast suggests.
        correct: true
        why: 'Right: Hart says much of the century''s jurisprudence realised (sometimes exaggerated) that the distinction "is far less firm than this naïve contrast suggests" (CL 126).'
      - text: 'The distinction is sound: legislation removes uncertainty, precedent keeps it.'
        why: This is the naïve contrast Hart questions; he says both devices leave uncertainty.
      - text: 'The distinction is reversed: precedent is more certain than any statute.'
        why: Hart does not reverse it; he says the difference is less firm than supposed.
      - text: The distinction is irrelevant, because judges ignore both devices in fact.
        why: This is a rule-sceptic claim; Hart thinks both devices guide conduct, with limits.
  - key: d05
    type: mcq
    concept: open-texture-and-harts-middle-way
    difficulty: 2
    stem: Why, according to Hart, are clear, familiar cases essential?
    options:
      - text: Without clear, familiar cases general terms would be useless.
        correct: true
        why: 'Right: the slide says without clear, familiar cases general terms would be useless; plain cases recur in similar contexts.'
      - text: Clear cases show that every rule has a single correct meaning in every context.
        why: 'Hart denies this: there will also be cases where it is not clear whether general terms apply.'
      - text: Clear cases are the only ones judges decide, since hard cases go to the legislature.
        why: Hart says judges decide hard cases too, by making a choice between open alternatives.
      - text: Clear cases prove the realists right that judges follow only the facts of cases.
        why: 'Clear cases support Hart against the realists: the rule does guide in the core.'
  - key: d06
    type: mcq
    concept: open-texture-and-harts-middle-way
    difficulty: 2
    stem: For Hart, what must happen when there are reasons both for and against applying a general term to a case?
    options:
      - text: The judge must look for the existing legal answer that the law already contains, since it never runs out.
        why: That is the Noble Dream (Dworkin), which Hart rejects; he says a choice must be made.
      - text: A choice between open alternatives must be made.
        correct: true
        why: 'Right: the slide says when there are reasons for and against the use of a general term, a choice between open alternatives must be made.'
      - text: The case must be dismissed because the rule gives no guidance and there is nothing for the court to apply.
        why: Hart does not say the case fails; the court exercises discretion and chooses.
      - text: The judge must apply the ordinary dictionary meaning of the term, whatever the consequences of doing so.
        why: Hart's point is that language itself runs out at the penumbra, so a dictionary cannot settle the choice.
  - key: d07
    type: mcq
    concept: open-texture-and-harts-middle-way
    difficulty: 2
    stem: What does Hart mean by calling natural languages "irreducibly open-textured"?
    options:
      - text: Their words can mean anything a reader wants, so legal rules never guide.
        why: This is the radical postmodern view that CLS draws on; Hart keeps a core of settled meaning.
      - text: Uncertainty at the borderline is the price of using general classifying terms.
        correct: true
        why: 'Right: "…uncertainty at the borderline is the price to be paid for the use of general classifying terms in any form of communication concerning matters of fact" (CL 128).'
      - text: They can be made fully precise by careful drafting, given enough time and effort.
        why: Irreducibly means it cannot be removed; careful drafting cannot eliminate open texture.
      - text: They are open to change by the rule of change whenever the legislature wishes.
        why: The rule of change is a secondary rule about amending law; open texture is a feature of language.
  - key: d08
    type: mcq
    concept: open-texture-and-harts-middle-way
    difficulty: 3
    stem: What two connected handicaps does Hart say we labour under whenever we seek to regulate conduct in advance by general standards?
    options:
