        why: The slide expressly says the scientific sense, not the legal sense of legal positivism.
      - text: 'Positivistic in the scientific sense: empirical and observational, like the natural sciences.'
        correct: true
        why: 'Right: the slide says "empirical, observational and positivistic (in the scientific sense, not the legal sense of positivism)".'
      - text: 'Positivistic in the moral sense: optimistic that the law will improve society over time.'
        why: This is not a sense used in the materials; the point is scientific, empirical method.
      - text: 'Positivistic in Kelsen''s sense: a pure theory free of sociology, psychology and ethics.'
        why: Kelsen's purity excludes sociology; the realists wanted the opposite, an empirical study of judicial behaviour.
  - key: c14
    type: mcq
    concept: conceptual-and-empirical-rule-scepticism
    difficulty: 3
    contrasts-with:
      - leiter-realism-as-theory-of-adjudication
    stem: Which claim would a conceptual rule-sceptic, but not a pure empirical rule-sceptic, make?
    options:
      - text: Judges respond to the facts of the case more than to the rules the parties cite.
        why: An empirical sceptic makes this claim; it is about how decisions are caused.
      - text: There is always legal support available for both sides in a hard case.
        why: An empirical sceptic makes this claim about the legal materials used in argument.
      - text: There is no legal duty not to do X unless a court would rule against you.
        correct: true
        why: 'Right: this ties the existence of duty to court rulings, a claim about the nature of law, which is what the conceptual rule-sceptic says.'
      - text: Statutes and precedents allow conflicting interpretations to be drawn.
        why: An empirical sceptic makes this claim; it describes the materials, not the nature of law.
