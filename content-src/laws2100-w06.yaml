  - key: b01
    type: mcq
    concept: holmes-prediction-theory
    difficulty: 1
    set: pretest
    stem: What is Holmes's prediction theory of law?
    options:
      - text: Law is essentially a prediction of what the courts will do in fact.
        correct: true
        why: 'Right: the slide says The Path of the Law introduced the prediction theory: law is essentially a prediction of what courts will do in fact.'
      - text: Law is a set of commands backed by threats, predicting sanctions.
        why: Tempting because both involve consequences, but the command theory is Austin's; Holmes looks at what courts will do, not sovereign commands.
      - text: Law is whatever the legislature predicts will maximise welfare.
        why: Holmes speaks of courts, not legislatures, and the theory is about what law is, not a welfare calculation.
      - text: Law is a prediction of how the ordinary citizen will behave in fact.
        why: The prediction is of official, judicial behaviour, not the behaviour of citizens; the bad man wants to know what courts will do.
  - key: b02
    type: mcq
    concept: holmes-prediction-theory
    difficulty: 1
    stem: From whose point of view does Holmes urge lawyers to see the law in The Path of the Law?
    options:
      - text: The puzzled man, who wants to know what the law requires of him
        why: 'This is Hart''s alternative perspective, raised against Holmes: the puzzled person who wishes to arrange their affairs according to law.'
      - text: The bad man, who cares only about the practical consequences
        correct: true
        why: 'Right: the slide says Holmes urges lawyers to view law through the eyes of the "bad man", who cares only about the practical consequences of breaking rules.'
      - text: The judge, who must decide what the law is in the case at hand
        why: Holmes predicts what judges will do, but the perspective he adopts is the bad man's, not the judge's own internal view.
      - text: The legislator, who designs rules to guide the whole community
        why: The legislator's perspective is not Holmes's; he recommends the bad man's practical concern with courts.
  - key: b03
    type: mcq
    concept: holmes-prediction-theory
    difficulty: 2
    stem: In the Path of the Law passage, what does the bad man "not care two straws" for?
    options:
      - text: The axioms or deductions
        correct: true
        why: 'Right: the bad man "does not care two straws for the axioms or deductions", only for what the courts are likely to do in fact.'
      - text: The sanctions the courts impose
        why: 'Reversed: sanctions are exactly the practical consequences he does care about; it is the axioms and deductions he ignores.'
      - text: The decisions of the English courts
        why: The passage says he wants to know what the Massachusetts or English courts are likely to do; he cares about them.
      - text: The prophecies of his own lawyers
        why: His concern is precisely a prophecy of what courts will do, which is what his lawyer offers him.
  - key: b04
    type: mcq
    concept: holmes-prediction-theory
    difficulty: 2
    stem: 'Complete Holmes''s sentence: "The prophecies of what the courts will do in fact, and nothing more pretentious, are…"'
    options:
      - text: …the best evidence we have of what the law already is.
        why: Tempting as a softer version, but Holmes identifies prophecies with the law itself; they are not evidence of some further law.
      - text: …what I mean by the law.
        correct: true
        why: 'Right: the quotation ends "are what I mean by the law" (Harvard Law Review 460–461).'
      - text: …what the bad man should obey without further question.
        why: Holmes says nothing about the bad man obeying; the passage defines law as prophecies of judicial behaviour.
      - text: …a useful but incomplete account of legal obligation.
        why: Holmes offers the prophecies as the whole of what he means by law, "and nothing more pretentious", not as a partial account.
  - key: b05
