        why: 'Right: the slide gives his chair and the Center he directs; the lecture calls him one of the most important legal realists.'
      - text: A Scandinavian realist who studied under Kelsen and later reviewed Hart's The Concept of Law.
        why: This describes Alf Ross, the Scandinavian realist, not Brian Leiter.
      - text: A founder of the CLS movement in the 1970s who drew on Marx and on postmodern thought.
        why: The materials do not describe Leiter this way; he defends realism against Hart's reading.
      - text: An Oxford positivist who defended Hart against Dworkin in the Postscript to The Concept of Law.
        why: The Postscript is Hart's own; Leiter is at Chicago and writes on realism.
  - key: f14
    type: mcq
    concept: leiter-realism-as-theory-of-adjudication
    difficulty: 3
    variant-of: f06
    stem: 'An essay says: "Hart''s finality argument refutes legal realism." How would Leiter respond?'
    options:
      - text: It refutes only conceptual rule scepticism; realism as a descriptive theory of adjudication, resting on empirical scepticism, is untouched.
        correct: true
        why: 'Right: Leiter says Hart''s good arguments are against conceptual rule scepticism and miss empirical rule scepticism, which is what realism really is.'
      - text: It refutes realism completely, which is why realism is rightly regarded as a philosophical mess and a jurisprudential joke.
        why: This is the widespread view that Leiter's article sets out to challenge.
      - text: It fails because courts are in fact infallible, so there is never any gap between what they say and the law itself.
        why: Leiter does not claim courts are infallible; his reply is about which kind of scepticism Hart targets.
      - text: It fails because the finality argument is Dworkin's, not Hart's, and it therefore targets positivism rather than realism.
        why: The finality/infallibility argument is in Hart's chapter VII; Leiter's point is about its target.
  - key: f15
    type: mcq
    concept: leiter-realism-as-theory-of-adjudication
    difficulty: 3
    variant-of: f09
    stem: On Leiter's account, how do realists and positivists differ on indeterminacy?
    options:
      - text: Both think law is indeterminate, but they understand its source and scope differently.
        correct: true
        why: 'Right: the slide says both realists and positivists think the law is indeterminate, with a different understanding of its source and scope.'
      - text: Realists think law is indeterminate; positivists think it is determinate in every case.
        why: Hart himself accepts open texture and discretion, so positivists do not think law is always determinate.
      - text: Positivists think law is indeterminate; realists think the judge always has one answer.
        why: This reverses realism, which stresses the indeterminacy of legal rules.
      - text: Neither thinks law is indeterminate; they differ only on the internal point of view.
        why: Both accept indeterminacy on Leiter's account; the internal point of view is not the difference he names.
  - key: f16
    type: truefalse
    concept: leiter-realism-as-theory-of-adjudication
    difficulty: 1
    set: quickfire
    statement: Leiter argues that Hart wrongly construed legal realism as a theory of law in competition with legal positivism.
    answer: true
    why: 'True: the slide says Leiter argues that Hart wrongly construed Legal Realism as a theory of law (in competition with Legal Positivism).'
  - key: f17
    type: truefalse
    concept: leiter-realism-as-theory-of-adjudication
    difficulty: 2
    set: quickfire
    statement: For Leiter, realist arguments for indeterminacy have the most obvious affinities with inclusive (soft) positivism.
    answer: false
    why: 'False: the p 293 quotation says the affinities are with the account "developed by hard or exclusive Positivists".'
  - key: f18
    type: truefalse
    concept: leiter-realism-as-theory-of-adjudication
    difficulty: 2
    set: quickfire
    statement: According to Leiter, Hart has no arguments against empirical rule scepticism.
    answer: true
    why: 'True: the slide says, according to Leiter, Hart has good arguments against conceptual rule scepticism, but no arguments against empirical rule scepticism.'
  - key: f19
    type: match
    concept: leiter-realism-as-theory-of-adjudication
    difficulty: 3
    prompt: Match each claim to the theory Leiter assigns it to.
    pairs:
      - left: Judges react primarily to the facts of the case
        right: Legal realism (descriptive theory of adjudication)
      - left: The Social Thesis and the Separability thesis
        right: Legal positivism (general theory of law)
      - left: A duty exists iff the courts say so
        right: Conceptual rule scepticism (which Hart defeats)
  - key: s05
    type: short
    concept: leiter-realism-as-theory-of-adjudication
    difficulty: 4
    prompt: '"Legal realism is a jurisprudential joke." Evaluate this claim in light of Leiter''s reading of realism.'
    model: 'The claim is unfair once realism is read as Leiter reads it. The charge, with the view that realism and positivism are incompatible, traces to Hart''s chapter VII, which treated realism as a rival theory of law. On that reading realism looks absurd: if law is only what courts will do, no court could err, and without rules we could not identify a judge. Leiter replies that realism is a descriptive theory of adjudication. Judges react primarily to the underlying facts; decisions fall into discernible patterns (situation types) that permit prediction; since law is rationally indeterminate, rules cannot explain decisions, so we must find the real reasons. That is empirical rule scepticism, and Hart has no argument against it. Indeed the realists cannot be conceptual rule sceptics, since their arguments for indeterminacy presuppose a nonsceptical account of the criteria of legality close to hard or exclusive positivism (293). What is left is an empirical disagreement about how often rules in books play a causal role. A critic may still say the early realists'' methodology was unsophisticated, but that is a reason for better empirical work, not a joke.'
    rubric:
      - id: r1
        criterion: Thesis — takes a position on the "joke" charge.
        marks: 2
        top-band: States a clear thesis that separates the charge against realism-as-theory-of-law from realism-as-theory-of-adjudication.
        margin-note: Joke on which reading?
        authorities: []
      - id: r2
        criterion: 'Argument — sets out Leiter''s reading: descriptive theory of adjudication, situation types, empirical rule scepticism, the 293 quotation.'
        marks: 3
        top-band: Uses the three features of the realism–positivism relationship precisely.
        margin-note: Good command of Leiter.
        authorities:
          - leiter-legal-realism-and-legal-positivism-reconsidered
      - id: r3
        criterion: Counterargument — presents Hart's chapter VII objections and the methodological weakness of early realism.
        marks: 3
        top-band: Shows why the objections seemed decisive and which kind of scepticism they actually hit.
        margin-note: Give Hart his due first.
        authorities:
          - hart-the-concept-of-law
      - id: r4
        criterion: Evaluation — weighs the remaining empirical disagreement and reaches a verdict.
        marks: 2
        top-band: Concludes that the dispute is empirical and says what would settle it.
        margin-note: 'Good: says what evidence would count.'
        authorities: []
  - key: g01
    type: mcq
    concept: critical-legal-studies
    difficulty: 2
    set: pretest
    stem: What does Critical Legal Studies offer a radical critique of, according to the slides?
    options:
      - text: Law as a coherent and neutral system of rules, legal institutions, and liberal legal values such as the rule of law and rights.
        correct: true
        why: 'Right: the slide lists law seen as coherent and neutral, legal institutions, and liberal legal values (rule of law, rights, legal process).'
      - text: Natural law theory, the idea of universal human goods, and the claim that unjust laws are not really law.
        why: CLS rejects universal standards, but the slide names law, institutions and liberal legal values as its targets.
      - text: Legal realism, because realism wrongly treated law as indeterminate and judges as policy-makers in hard cases.
        why: CLS builds on realism's indeterminacy claim; it radicalises rather than rejects it.
      - text: Formalism only, since CLS accepts liberal values but objects to mechanical jurisprudence in the courts.
        why: CLS attacks liberal legal values too, not only formalism in adjudication.
  - key: g02
    type: mcq
    concept: critical-legal-studies
    difficulty: 1
    stem: Which three intellectual influences on CLS do the slides name?
    options:
      - text: Legal realism, postmodernism and Marxism
        correct: true
        why: 'Right: the slide says the intellectual influences are Legal Realism, Postmodernism, and Marxism.'
      - text: Legal positivism, natural law and utilitarianism
        why: These are traditions CLS criticises or sets aside, not its named influences.
      - text: Formalism, pragmatism and analytical philosophy
        why: Formalism is the realists' target; these are not the influences on the slide.
      - text: Feminism, critical race theory and economics
        why: The lecture mentions these as other critical approaches, not the named influences on CLS.
  - key: g03
    type: mcq
    concept: critical-legal-studies
    difficulty: 2
    stem: For CLS, what kind of system is law?
    options:
      - text: A contradictory and illegitimate system which maintains oppressive social relations.
        correct: true
        why: 'Right: the slide says, for CLS, law is a contradictory and illegitimate system which maintains oppressive social relations.'
      - text: A coherent but incomplete system, whose gaps judges fill by exercising discretion.
        why: This is closer to Hart's open texture; CLS denies that law is coherent.
      - text: A gapless system in which every case has a single right answer for the judge to find.
        why: This is Dworkin's noble dream, which CLS rejects as a liberal myth.
      - text: A system of predictions about official behaviour, morally neutral in its content.
        why: This is closer to Holmes's prediction theory; CLS insists law is not neutral.
  - key: g04
    type: mcq
    concept: critical-legal-studies
    difficulty: 2
    stem: In what respect does CLS go beyond legal realism, according to the slides?
    options:
      - text: CLS alone holds that law is indeterminate and does not constrain judges.
        why: The slide says both realists and CLS hold law indeterminate; this is shared, not a difference.
      - text: CLS is more interested in the politics and ideological nature of law, and has a more radical view of indeterminacy.
        correct: true
        why: 'Right: the slide says CLS is more interested in the politics of law and its ideological nature, and has a more radical understanding of indeterminacy.'
      - text: CLS rejects the realist view that legal reasoning is a myth and restores formalism.
        why: The slide says CLS follows realism in seeing legal reasoning as a myth.
      - text: CLS drops the realist claims and adopts Hart's core and penumbra instead.
        why: From a postmodern point of view Hart's core/penumbra would be incorrect; CLS does not adopt it.
  - key: g05
    type: mcq
    concept: critical-legal-studies
    difficulty: 3
    contrasts-with:
      - open-texture-and-harts-middle-way
    stem: Why would Hart's core/penumbra account of meaning be incorrect from a postmodern point of view, according to the lecture?
    options:
      - text: Because postmodernism holds that words do not have a stable meaning, so there is no settled core.
        correct: true
        why: 'Right: the lecture says postmodern-influenced CLS scholars see words as lacking stable meaning, so Hart''s core and penumbra would be incorrect.'
      - text: Because postmodernism holds that every word has a precise meaning fixed by its dictionary definition.
        why: This is the opposite of postmodernism, which rejects the stability of meaning and precise definition.
      - text: Because postmodernism holds that only judges can fix the meaning of legal words, by their predictions.
        why: This mixes in the prediction theory; the postmodern point is instability of meaning as such.
      - text: Because postmodernism holds that the penumbra is larger than Hart thought, but the core is secure.
        why: Postmodernism denies a stable core at all; it is not a matter of the penumbra's size.
  - key: g06
    type: mcq
    concept: critical-legal-studies
    difficulty: 2
    stem: Which feature of postmodernism appears on the slides?
    options:
      - text: Foundationalism and epistemic certainty
        why: Postmodernism is anti-foundationalist and rejects epistemic certainty, the reverse of this.
      - text: Rejection of grand narratives
        correct: true
        why: 'Right: the slide says postmodernism rejects "grand narratives" (or "metanarratives").'
      - text: Defence of the Enlightenment project
        why: Postmodernism is set against the Enlightenment project on the slides.
      - text: Belief in the univocity of meaning
        why: Postmodern concepts are used to destabilise the univocity of meaning.
  - key: g07
    type: mcq
    concept: critical-legal-studies
    difficulty: 2
    stem: What is the "Enlightenment project", according to the slides?
    options:
      - text: The ideology of liberal humanism that has dominated Western societies in modern times.
        correct: true
        why: 'Right: the slide says the Enlightenment project is the ideology of liberal humanism that has dominated Western societies in modern times.'
      - text: The Marxist programme to replace capitalist relations of production with socialist relations.
        why: This is Marx's historical materialism, not what the slides call the Enlightenment project.
      - text: The postmodern effort to deconstruct legal texts and show that their meanings are unstable.
        why: Postmodernism is set against the Enlightenment project; it is not the project itself.
      - text: The realist movement's effort to study judicial behaviour with the methods of empirical science.
        why: The realists are not the Enlightenment project in the slides' sense.
  - key: g08
    type: mcq
    concept: critical-legal-studies
    difficulty: 3
    stem: On the Marxist strand of CLS, why does capitalism need a particular kind of legal system?
    options:
      - text: It needs a legal system that legitimises private ownership of the means of production, while presenting itself as neutral.
        correct: true
        why: "Right: on the Marxist strand, capitalism needs a legal system that legitimises private ownership of the means of production, yet law presents itself as a neutral, impartial instrument."
      - text: It needs a legal system with no property rights at all, so that the forces of production can develop freely and without limit.
        why: "Wrong — the Marxist strand says the opposite: capitalism needs law that legitimises private ownership of the means of production, not a legal system without property rights."
      - text: It needs a legal system in which judges openly favour workers, so that revolution is prevented peacefully.
        why: "Wrong — for CLS, law and legal institutions serve the dominant class and maintain the status quo; they do not favour workers, though law presents itself as neutral."
      - text: It needs a legal system that is gapless and determinate, so that one right answer exists in every case.
        why: "Tempting because it sounds like a stable order, but a gapless, determinate law with one right answer is Dworkin's noble dream; CLS holds law is radically indeterminate."
  - key: g09
    type: mcq
    concept: critical-legal-studies
    difficulty: 2
    variant-of: g08
    stem: In Marx's historical materialism, as summarised on the slides, what does the superstructure do?
    options:
      - text: It determines the forces of production, which then shape relations of production.
        why: The slide runs forces of production → relations of production; the superstructure does not determine the forces.
      - text: It helps the dominant class to maintain certain relations of production.
        correct: true
        why: 'Right: the slide says the superstructure helps the dominant class to maintain certain relations of production.'
      - text: It guarantees neutral treatment of every class through the rule of law.
        why: Neutrality is how law presents itself; CLS says law in fact serves the dominant class.
      - text: It abolishes private ownership and leaves only the forces of production.
        why: The slide says capitalism needs law legitimising private ownership; the superstructure maintains it.
  - key: g10
    type: mcq
    concept: critical-legal-studies
    difficulty: 3
    stem: CLS holds law to be radically indeterminate, yet says judicial decisions may be predicted. How?
    options:
      - text: Because the rules in books do determine outcomes, once they are read in the light of their purpose.
        why: This concedes the determinacy CLS denies; it is closer to Fuller's purposive reading.
      - text: Because judges share a (political) commitment to the status quo.
        correct: true
        why: 'Right: the slide says judicial decisions may be predicted because judges share a (political) commitment to the status quo.'
      - text: Because each judge's idiosyncratic preferences can be studied over time and then catalogued.
        why: Idiosyncratic adjudication is a realist (Frank) idea; the CLS explanation is a shared political commitment.
      - text: Because Hercules could always find the one right answer, and ordinary judges try to imitate him.
        why: Hercules is Dworkin's ideal judge; CLS rejects the one right answer.
  - key: g11
    type: mcq
    concept: critical-legal-studies
    difficulty: 2
    stem: Which is one of the key CLS claims on the slides?
    options:
      - text: The law is contradictory because it stems from political conflict.
        correct: true
        why: "Right: a key CLS claim is that law is contradictory because it stems from political conflict, even though judges' shared commitment to the status quo can make decisions predictable."
      - text: The law is coherent because it stems from a single political morality.
        why: "Tempting because it echoes Dworkin's integrity, where principle unifies the system, but CLS attacks law's image as a coherent system and says it is contradictory."
      - text: The law is neutral because it applies to all classes of person equally.
        why: "Wrong — CLS is sceptical of neutral legal concepts and doctrines; law only presents itself as neutral while serving the dominant class and maintaining the status quo."
      - text: The law is determinate because language has a settled core of meaning.
        why: "Tempting because it echoes Hart's settled core of meaning, but CLS, like the realists, holds law to be indeterminate, so rules do not guide or constrain judicial decisions."
  - key: g12
    type: mcq
    concept: critical-legal-studies
    difficulty: 3
    stem: How does the lecture describe the mix of claims in CLS?
    options:
      - text: A combination of descriptive claims (unmasking the real reasons behind decisions) with normative claims (those patterns are oppressive, so the law should change).
        correct: true
        why: 'Right: the lecture says CLS combines descriptive with normative claims: not just unmasking real reasons but saying the patterns are unjust and should change.'
      - text: Purely descriptive claims, since CLS, like Hart, aims at a morally neutral theory with no justificatory or critical aims of any kind.
        why: The lecture stresses that CLS makes normative claims too; it is not morally neutral.
      - text: Purely normative claims, since CLS has no interest in explaining how judges actually decide cases, only in how they should.
        why: CLS does try to unmask the real reasons behind decisions, a descriptive task.
      - text: Purely conceptual claims about the meaning of the word "law", pursued by analysing ordinary legal language.
        why: This is closer to Hart's method; CLS's claims are political and ideological.
  - key: g13
    type: mcq
    concept: critical-legal-studies
    difficulty: 3
    contrasts-with:
      - laws2100-w03-kelsen-pure-theory
    stem: Why, according to the lecture, does the distinction between law as it is and law as it ought to be not make sense for CLS thinkers?
    options:
      - text: Because to understand law we need to look at the values, choices and ideologies that underpin a legal system.
        correct: true
        why: 'Right: the lecture says for these critical thinkers the is/ought distinction does not make sense; we need to look at the values and ideologies behind the system.'
      - text: Because an unjust law is not law at all, so what the law is depends entirely on what the law ought to be, in every case.
        why: This is a natural law (lex iniusta) argument, not the CLS reason given in the lecture.
      - text: Because law is only a prediction of what courts do, and predictions cannot be evaluated morally.
        why: This is Holmes's prediction theory, and it does not explain the CLS rejection of the distinction.
      - text: Because Kelsen's pure theory already shows that the ought is part of every legal norm.
        why: Kelsen keeps law pure of such considerations; the lecture contrasts his purity with the critical approach.
  - key: g14
    type: mcq
    concept: critical-legal-studies
    difficulty: 2
    stem: Which thinkers do the slides list for post-structuralism?
    options:
      - text: Derrida, Foucault, Lyotard, Baudrillard, Rorty
        correct: true
        why: 'Right: the postmodernism slide lists Jacques Derrida, Michel Foucault, Jean-François Lyotard, Jean Baudrillard, Richard Rorty.'
      - text: Holmes, Pound, Oliphant, Frank, Llewellyn
        why: These are the American legal realists on the first slide, not post-structuralists.
      - text: Hagerstrom, Lundstedt, Olivecrona, Ross
        why: These are the Scandinavian legal realists on the first slide, not post-structuralists.
      - text: Kant, Bentham, Austin, Hart, Kelsen
        why: Kant is cited for the Enlightenment; the others are positivists, not post-structuralists.
  - key: g15
    type: mcq
    concept: critical-legal-studies
    difficulty: 3
    variant-of: g13
    stem: 'A CLS scholar says: "Contract doctrine''s talk of free and equal parties hides who holds power." A positivist replies. Which reply best fits the lecture''s distinction?'
    options:
      - text: '"The law may present itself as neutral without being so; describing what the law is does not endorse it."'
        correct: true
        why: 'Right: the lecture separates how the law presents itself from how the law is, and positivists like Hart accept that law embodies choices while keeping description apart from endorsement.'
      - text: '"The law is neutral, since every contract rule was validly made according to the rule of recognition."'
        why: Validity is not neutrality; the lecture notes that law embodies political choices and values, as Hart and Dworkin both recognise.
      - text: '"The law has no ideology, because the words of contract doctrine have a stable core and a narrow penumbra."'
        why: Open texture concerns meaning, not ideology; this does not answer the CLS claim.
      - text: '"The law cannot be criticised at all, because the is/ought distinction forbids evaluation of legal rules."'
        why: Positivists separate description from evaluation; they do not forbid criticism of the law.
  - key: g16
    type: truefalse
    concept: critical-legal-studies
    difficulty: 1
    set: quickfire
    statement: For CLS, law and legal institutions serve the "dominant" class and maintain the status quo.
    answer: true
    why: 'True: the Marx slide ends with this: for the CLS movement law and legal institutions serve the "dominant" class and maintain the status quo.'
  - key: g17
    type: truefalse
    concept: critical-legal-studies
    difficulty: 2
    set: quickfire
    statement: CLS rejects the realist claim that legal reasoning is a myth.
    answer: false
    why: 'False: the slide says that, following legal realism, CLS theorists see legal reasoning as a myth.'
  - key: g18
    type: truefalse
    concept: critical-legal-studies
    difficulty: 2
    statement: The lecture says CLS is as significant now as it was in the 1970s and 1980s.
    answer: false
    why: 'False: the lecture says the movement had a history and is not now as significant as it was in the 70s and the 80s.'
  - key: g19
    type: match
    concept: critical-legal-studies
    difficulty: 2
    prompt: Match each influence to what CLS takes from it.
    pairs:
      - left: Legal realism
        right: 'Indeterminacy: law does not guide or constrain judges'
      - left: Postmodernism
        right: Words do not have stable meaning
      - left: Marxism
        right: Law serves the dominant class and maintains the status quo
  - key: s06
    type: short
    concept: critical-legal-studies
    difficulty: 4
    contrasts-with:
      - laws2100-w03-kelsen-pure-theory
    prompt: '"For CLS, law is a contradictory and illegitimate system which maintains oppressive social relations." Can a positivist accept any of this?'
    model: Some, but not the conclusion. CLS draws on realism (law is indeterminate, legal reasoning is a myth), postmodernism (words do not have stable meaning; rejection of grand narratives and epistemic certainty) and Marxism (the superstructure helps the dominant class; law legitimises private ownership while presenting itself as neutral). Its key claims are radical indeterminacy, contradiction because law stems from political conflict, and law as ideology that promotes the interests of the powerful. A positivist like Hart can accept a good deal. Law embodies political choices and values; Hart's theory explains morally sound and morally unsound regimes alike; and law may present itself as neutral without being so. But Hart would say law is contradictory sometimes, not always, and that radical indeterminacy is refuted by the plain cases that constantly recur. The deeper disagreement is methodological. For CLS the distinction between law as it is and law as it ought to be does not make sense; for Hart and Kelsen, describing law is not endorsing it. A positivist can accept that law may be oppressive; what they deny is that this is part of what law is.
    rubric:
      - id: r1
        criterion: Thesis — says what a positivist can and cannot accept.
        marks: 2
        top-band: States a qualified thesis that separates degree claims from the methodological claim.
        margin-note: Which parts, exactly?
        authorities: []
      - id: r2
        criterion: Argument — explains CLS's three influences and key claims accurately.
        marks: 3
        top-band: Uses the slide's key claims and ties each to realism, postmodernism or Marxism.
        margin-note: Good grasp of the sources of CLS.
        authorities: []
      - id: r3
        criterion: 'Counterargument — gives the positivist replies: contradiction as a matter of degree, plain cases against radical indeterminacy, law presenting itself as neutral vs being neutral.'
        marks: 3
        top-band: Distinguishes how law presents itself from how it is, as the lecture does.
        margin-note: Nice distinction.
        authorities:
          - hart-the-concept-of-law
      - id: r4
        criterion: Evaluation — locates the real disagreement in the is/ought distinction and reaches a verdict.
        marks: 2
        top-band: Makes the verdict turn on whether description can be separated from evaluation.
        margin-note: This is where the essay question lives.
        authorities: []
