    body: |-
      Hart's lecture on American jurisprudence notes "a concentration, almost to the point of obsession, on the judicial
      process" (Holmes, Gray, Llewellyn, Jaffe), explained partly by the "quite extraordinary" role of US courts, especially
      the Supreme Court, and wide powers of judicial review.

      **The Nightmare.** Litigants consider themselves entitled to an application of the existing law to their disputes, not
      to have new law made for them; judges and legislators have different functions and powers. The Nightmare is that this
      image of the judge is an **illusion**. American Legal Realism presented it not simply as a feature of difficult
      adjudication (eg constitutional adjudication) but as an essential feature of law and adjudication. Are judges
      law-makers?

      **The Noble Dream.** Judges apply existing law; they never make new law, even when constitutional text, statutes or
      precedents appear to offer no determinate guide. There is none the less an existing law somewhere which judges can and
      should apply. It does not take the form of an invocation of a universal natural law. For Hart, **Dworkin is the noblest
      dreamer of all**: even in the hardest case, where two interpretations fit equally well, the judge is never to make law.

      The lecture links the dream to the one right answer thesis and a liberal view of law: legal positions determined ex ante.
      Hart treats both as exaggerations, to be read with the distinction between easy and hard cases.

      Exam use: place a theorist on the axis and say why Hart sits between the two ends.
  - slug: leiter-realism-as-theory-of-adjudication
    title: 'Leiter: realism as a descriptive theory of adjudication'
    visual: explainer
    visual-brief: 'Two maps on different scales: positivism as a general theory of law (what counts as law: social thesis, separability) and realism as a theory of adjudication laid on top (what causes decisions); Hart''s arrows hit the conceptual layer and miss the empirical one.'
    related:
      - conceptual-and-empirical-rule-scepticism
      - nightmare-and-noble-dream
    depends-on:
      - laws2100-w03-what-is-legal-positivism
      - laws2100-w05-inclusive-and-exclusive-positivism
    contrasts-with:
      - conceptual-and-empirical-rule-scepticism
    cases: []
    authorities:
      - leiter-legal-realism-and-legal-positivism-reconsidered
    verify: false
    body: |-
      In 'Legal Realism and Legal Positivism Reconsidered', Brian Leiter challenges two widespread views: (1) realism and
      positivism are incompatible; (2) realism is "a jurisprudential joke", "a philosophical mess". Both trace to Hart's
      chapter VII, which wrongly construed realism as a **theory of law** in competition with positivism.

      For Leiter realism is a **descriptive theory of adjudication**:

      - judges react primarily to the underlying facts of the case;
      - decisions fall into discernible patterns (situation types), and these allow prediction;
      - law is rationally indeterminate, so rules cannot explain decisions;
      - the question is what the real (non-legal) reasons are: empirical rule scepticism.

      Positivism, by contrast, is a general theory of law (the Social Thesis and the Separability thesis). Hart has good
      arguments against conceptual rule scepticism, but none against empirical rule scepticism.

      "The Realists […] cannot be conceptual rule skeptics, because their arguments for the indeterminacy of law presuppose a
      nonskeptical account of the criteria of legality, one that has the most obvious affinities with that developed by hard or
      exclusive Positivists." (293)

      Three features of the relationship:

      1. Both think law is indeterminate (different source and scope).
      2. Realist indeterminacy arguments presuppose a positivistic account of the criteria of legality.
      3. They disagree over how often legal rules matter in decisions: an empirical question about whether rules in books play
         a causal role.

      Exam use: a way to think critically about Hart's reading of realism.
  - slug: critical-legal-studies
    title: Critical Legal Studies
    visual: diagram
    visual-brief: 'Three streams (legal realism, postmodernism, Marxism) feed one river, CLS; at the mouth, the key claims: radical indeterminacy, contradiction from political conflict, law as ideology; a gauge compares realist and CLS indeterminacy.'
    related:
      - realism-against-formalism
      - leiter-realism-as-theory-of-adjudication
    depends-on:
      - realism-against-formalism
    contrasts-with:
      - realism-against-formalism
    cases: []
    authorities: []
    verify: false
    body: |-
      CLS offers a radical critique of law, seen as a coherent and neutral system of rules; of legal institutions; and of liberal
      legal values (the rule of law, the idea of rights, the legal process). For CLS, law is a contradictory and illegitimate
      system which maintains oppressive social relations. Influences: legal realism, postmodernism and Marxism.

      **With realism**: law is indeterminate, so it does not guide or constrain judicial reasoning; legal reasoning is a myth.
      **Beyond realism**: more interested in the politics and ideological nature of law (law mirrors political visions), and a
      more radical indeterminacy. From postmodernism, words do not have stable meaning.

      **Postmodernism** (Lyotard, Derrida, Foucault, Baudrillard, Rorty): anti-foundationalist; rejects epistemic certainty,
      the stability of meaning and "grand narratives" of the Enlightenment project; human reasoning is always socially
      conditioned; language constitutes reality; deconstruction.

      **Marx's historical materialism**: forces of production → relations of production; the superstructure helps the
      dominant class maintain them; capitalism needs law that legitimises private ownership, yet law presents itself as neutral.

      Key claims:

      - radical legal indeterminacy; no coherent sense out of the legal materials;
      - law is contradictory because it stems from political conflict;
      - yet decisions may be predicted because judges share a commitment to the status quo;
      - law as ideology: it promotes the interests of the powerful and legitimises injustice;
      - scepticism about neutral legal concepts and doctrines.

      Exam use: the is/ought separation makes no sense to CLS; test each claim against Hart's or Dworkin's reply.
