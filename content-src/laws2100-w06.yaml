  - key: f07
    type: mcq
    concept: leiter-realism-as-theory-of-adjudication
    difficulty: 3
    stem: Why, for Leiter, can the realists not be conceptual rule sceptics?
    options:
      - text: Their arguments for indeterminacy presuppose a nonsceptical account of the criteria of legality, close to hard or exclusive positivism.
        correct: true
        why: 'Right: this is the p 293 quotation on the slide, in Leiter''s own words.'
      - text: Their arguments for indeterminacy presuppose that morality is part of the criteria of legality, as inclusive positivists hold.
        why: Leiter says the affinities are with hard or exclusive positivism, not inclusive positivism.
      - text: Their arguments for indeterminacy presuppose Dworkin's one right answer thesis, which they cannot then deny consistently.
        why: The realists deny that the law always has one right answer; Leiter's point is about criteria of legality.
      - text: Their arguments for indeterminacy presuppose that judges never exercise discretion, which is plainly false.
        why: Realists say judges decide on non-legal grounds; this is not Leiter's argument at all.
  - key: f08
    type: mcq
    concept: leiter-realism-as-theory-of-adjudication
    difficulty: 3
    variant-of: f07
    stem: Why does the realist argument from "support on both sides" presuppose positivism, on the lecture's account of Leiter?
    options:
