        why: 'Right: the lecture says the conceptual sceptic asks whether rules really exist, so Hart must defeat the argument to defend his theory of law as the union of primary and secondary rules.'
      - text: Because it denies that judges have any discretion, which is Hart's central claim about the penumbra of rules.
