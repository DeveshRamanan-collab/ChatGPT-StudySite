  - key: f05
    type: mcq
    concept: leiter-realism-as-theory-of-adjudication
    difficulty: 3
    stem: What does Leiter mean by "situation types"?
    options:
      - text: Discernible patterns in the facts of cases (eg cases from one industry), which make decisions predictable.
        correct: true
        why: 'Right: the lecture gives examples like industrial cases involving mining decided one way and fishing another; the patterns allow prediction.'
      - text: Types of legal rules (duty-imposing, power-conferring) that judges select according to the situation the parties are in.
        why: This is Hart's classification of rules; situation types are patterns in the facts, not kinds of rules.
      - text: Types of judges (idiosyncratic, sociological, pragmatic), each of whom reacts to situations in a different way.
        why: These are the types of realist adjudication; situation types are about factual patterns across cases.
      - text: Types of hard case (gaps, vagueness, conflict) in which the rules run out and judges must use discretion.
        why: These are sources of indeterminacy; situation types are patterns in the facts that decisions follow.
