questions:
  - key: a01
    type: mcq
    concept: realism-against-formalism
    difficulty: 1
    set: pretest
    stem: What view of law and adjudication were the American legal realists reacting against?
    options:
      - text: 'Formalism: law as a self-contained system of rules, applied to the facts by deductive, syllogistic reasoning.'
        correct: true
        why: 'Right: the slide on formalism describes exactly this received view in US law schools, also called mechanical jurisprudence.'
      - text: 'Natural law theory: the claim that an unjust law is not a law at all and binds no one in conscience.'
        why: Tempting because realism rejects "metaphysical nonsense", but the slides name formalism as the target, not natural law theory.
      - text: 'Austin''s command theory: law as the commands of a sovereign whom the bulk of society habitually obeys.'
        why: Austin is compared in the lecture on legal duty, but the view the realists attacked in US law schools was formalism, not the command theory.
      - text: 'Dworkin''s interpretivism: law as integrity, with one right answer to be found even in the very hardest of cases.'
        why: Dworkin wrote after the realist movement peaked; the one right answer thesis appears as a counterargument to realism, not as its original target.
  - key: a02
    type: mcq
    concept: realism-against-formalism
    difficulty: 1
    stem: Which phrase did the slides give as another name for formalism in adjudication?
    options:
      - text: Sociological jurisprudence
        why: Sociological jurisprudence is where realism leads (studying institutions with empirical sciences), the opposite of formalism.
      - text: Mechanical jurisprudence
        correct: true
        why: 'Right: the slide says the deductive, syllogistic approach to deciding cases "was also called ''mechanical jurisprudence''".'
      - text: Analytical jurisprudence
        why: Tempting because analytical jurisprudence is Hart's tradition, but it names a philosophical method, not the formalist picture of judging.
      - text: Particular jurisprudence
        why: Particular jurisprudence (week 1) concerns puzzles of some legal systems only; it is not a name for formalism.
  - key: a03
    type: mcq
    concept: realism-against-formalism
    difficulty: 2
    stem: 'On the formalist picture, legal rules are compared to:'
    options:
      - text: commands backed by threats, obeyed out of fear of a sanction imposed by the state
        why: That is the gunman picture from Austin (week 2); formalism is about the logical structure of rules, not their coercive backing.
      - text: 'mathematical propositions: interconnected, derivable from each other, mechanically generating results'
        correct: true
        why: 'Right: the slide says legal rules are like mathematical propositions that can be logically derived from each other and mechanically generate the result in all legal cases.'
      - text: predictions of what the courts will do in fact, made from the standpoint of the bad man
        why: This is Holmes's prediction theory, which is the realist alternative to formalism rather than a description of it.
      - text: open-textured standards with a settled core of meaning and a wide penumbra of doubtful, borderline cases
        why: This is Hart's view of rules in chapter VII, a middle way between formalism and rule-scepticism.
  - key: a04
    type: mcq
    concept: realism-against-formalism
    difficulty: 2
    stem: Holmes wrote that "The life of the law has not been logic; it has been experience". What does this line reject?
    options:
      - text: The idea that law is timeless logical principle rather than a product of history, social needs and policy.
        correct: true
        why: 'Right: the slide glosses the line as denying that law is timeless logical principle; it is a product of historical experience, social needs and public policy.'
      - text: The idea that judges should look at the practical consequences of their decisions for society here and now.
        why: Holmes is on the side of consequences and policy; the line rejects logic as the life of the law, not attention to consequences.
      - text: The idea that the common law can be studied at all, since experience cannot be reduced to general rules.
        why: Tempting because the line is from The Common Law, but Holmes studies the common law as experience; he does not deny it can be studied.
      - text: The idea that law needs any sanction, since experience shows people obey rules without being threatened.
        why: The line is not about sanctions or motives for obedience; it is about logic versus experience as the source of law's development.
  - key: a05
    type: mcq
    concept: realism-against-formalism
    difficulty: 1
    stem: Which of these is one of the main realist claims listed on the slides?
    options:
      - text: Law in books is the same as law in action.
        why: 'This reverses the realist claim: the slide says law in books is different from law in action (paper rules vs real rules).'
      - text: Legal concepts are neutral and objective.
        why: 'The slide says the opposite: legal concepts and standards are not neutral or objective, because they result from policy decisions.'
      - text: The law as a system of rules is indeterminate.
        correct: true
        why: 'Right: the slide lists that "the law (as a system of rules) is indeterminate" among the main realist claims.'
      - text: Judicial reasoning ignores all empirical facts.
        why: The realists said judges respond to the facts and that law should be studied empirically; they did not say reasoning ignores facts.
  - key: a06
    type: mcq
    concept: realism-against-formalism
    difficulty: 2
    stem: The realist claim that "Judges (should) decide cases by making policy decisions" is written with "(should)" in brackets. What does that signal?
    options:
      - text: The claim has a descriptive reading (what judges do) and a normative reading (what judges ought to do).
        correct: true
        why: 'Right: the brackets mark that realists said both that judges do decide by policy and that they ought to; the slide on counterarguments asks whether the normative account is anti-democratic.'
      - text: The claim is only a hypothesis the realists raised and then rejected after empirical testing of courts.
        why: Nothing in the materials says the realists rejected it; policy-based adjudication is one of their main claims.
      - text: The claim applies only to statutes, while judges should decide common law cases by precedent alone.
        why: The brackets are not about statutes versus common law; the realists applied the policy claim to adjudication generally.
      - text: The claim comes from Hart, who thought judges ought to use policy only in the penumbra of a rule.
        why: Hart does accept discretion in the penumbra, but this slide lists realist claims, and the brackets flag the is/ought double reading.
  - key: a07
    type: mcq
    concept: realism-against-formalism
    difficulty: 2
    stem: Why, according to the lecture, are legal concepts and standards not neutral or objective for the realists?
    options:
      - text: Because they are the result of policy decisions, whether a legislative or a judicial authority made them.
        correct: true
        why: 'Right: the lecture says legal concepts, rules and principles are the result of policy decisions by legislative or judicial authorities, so they are not neutral.'
      - text: Because words have no stable meaning at all, so every legal concept can mean whatever a reader wants.
        why: That is the more radical postmodern indeterminacy that CLS adds; the realist point in the lecture is about policy choices behind the concepts.
      - text: Because they express the interests of the dominant class under capitalism and legitimise private ownership.
        why: This is the Marxist influence on CLS, not the realist reason the lecture gives; realists pointed to policy decisions.
      - text: Because they derive from a universal natural law that each judge understands in a different way.
        why: The realists rejected "metaphysical nonsense"; they did not ground legal concepts in natural law at all.
  - key: a08
    type: mcq
    concept: realism-against-formalism
    difficulty: 2
    stem: The realists rejected "metaphysical nonsense". In the lecture, who attacked the idea of law as a system of rules by calling it a metaphysical view?
    options:
      - text: The Scandinavian realists, with their deeper interest in the ontology of legal rules
        correct: true
        why: 'Right: the lecture says Scandinavian realists, more interested in philosophical questions and ontology, attacked the system-of-rules view as metaphysical, which for them was almost an insult.'
      - text: The formalists, who thought realism left no place for logic in the adjudication of cases
        why: The formalists are the target of the charge, not its authors; "metaphysical" was the realists' complaint about the formalist picture.
      - text: Hart, who used it against Austin's idea of an illimitable sovereign
        why: Hart's criticisms of Austin were about commands, habits and the sovereign; the metaphysics charge is a realist one.
      - text: The CLS scholars, who took it from Marx's theory of the superstructure
        why: CLS came later and drew on Marx, but the lecture ties the "metaphysical" attack to the Scandinavian realists.
  - key: a09
    type: mcq
    concept: realism-against-formalism
    difficulty: 1
    stem: Which pair correctly places two realists in their families?
    options:
      - text: Jerome Frank (American); Karl Llewellyn (Scandinavian)
        why: Frank is American, but Karl Llewellyn is also American on the slide; the Scandinavians include Hagerstrom, Lundstedt, Olivecrona and Ross.
      - text: Alf Ross (American); Roscoe Pound (Scandinavian)
        why: 'Reversed: Ross is the leading Scandinavian realist and Pound is on the American list.'
      - text: Karl Olivecrona (Scandinavian); Felix Cohen (American)
        correct: true
        why: 'Right: the slide lists Olivecrona among the Scandinavian realists and Cohen among the American realists.'
      - text: Herman Oliphant (Scandinavian); Alf Ross (American)
        why: Oliphant is on the American list and Ross is Scandinavian, so both placements are wrong here.
  - key: a10
    type: mcq
    concept: realism-against-formalism
    difficulty: 2
    stem: According to the lecture, why was American legal realism more interested in the law in action than Scandinavian realism?
    options:
      - text: The architecture of the US legal system and the influence of pragmatism in American philosophy.
        correct: true
        why: 'Right: the lecture gives these reasons, including the architecture of the US legal system and pragmatism in American philosophy.'
      - text: The influence of Kelsen, under whom the leading American realists had studied before breaking with him.
        why: It was Ross, a Scandinavian, who studied under Kelsen; the lecture does not explain American interest in practice that way.
      - text: The absence of a written constitution, which left American judges without any fixed rules to apply.
        why: The US has a written constitution; the lecture points to the system's architecture and pragmatism, not an absence of fixed rules.
      - text: The influence of Marx, whose theory of history made practice matter more than theory for Americans.
        why: Marxism is an influence on CLS, not the lecture's explanation of American realism's practical bent.
  - key: a11
    type: mcq
    concept: realism-against-formalism
    difficulty: 3
    stem: 'A lecturer tells first-year students: "Find the rule, find the facts, and the answer follows as surely as a sum." A realist would reply that:'
    options:
      - text: 'this is formalism: general rules cannot decide concrete cases, and the real reasons lie elsewhere.'
        correct: true
        why: 'Right: the realist asks "is this what judges really do?" and answers that general rules cannot decide concrete cases; judges decide by other factors.'
      - text: this is correct for statutes, since only precedent leaves any real room for policy decisions by judges.
        why: The realists did not exempt statutes; the lecture notes conflicting ways of interpreting statutes as well as precedents.
      - text: this is correct, provided the rule was validly enacted according to the rule of recognition.
        why: Validity of the rule is not the realist's question; the claim attacked is that a valid rule mechanically yields the result.
      - text: this is incomplete, because the answer also needs a natural law premise about human goods.
        why: That would be a natural law amendment; the realist objection is that rules plus facts do not determine outcomes at all.
  - key: a12
    type: mcq
    concept: realism-against-formalism
    difficulty: 2
    stem: The slides end their list of realist claims with "→ Sociological jurisprudence?" What claim prompts this question?
    options:
      - text: Judges decide cases only by applying the explicit words of the statute to the facts.
        why: That is a formalist claim; the question about sociological jurisprudence follows the realist call for empirical study.
      - text: Legal institutions can and should be studied with the help of the empirical sciences.
        correct: true
        why: 'Right: the last claim on the slide is that legal institutions can (and should) be studied with the help of empirical sciences, hence sociological jurisprudence.'
      - text: Law is valid only if its content passes a moral test of justice and reasonableness.
        why: This is a natural law claim that the realists did not make; the prompt concerns empirical, social-scientific study.
      - text: A legal system is the union of primary rules of obligation and secondary rules.
        why: This is Hart's theory, the rule-based picture the realists were sceptical about, not a realist claim.
  - key: a13
    type: mcq
    concept: realism-against-formalism
    difficulty: 3
    stem: Which statement best captures how the lecture relates realism to Hart's third persistent question ("to what extent is law an affair of rules?")?
    options:
      - text: Realists answer it by saying law is entirely an affair of rules, as long as they are the rules in books.
        why: 'Reversed: realists distinguish paper rules from real rules and doubt that the rules in books settle cases.'
      - text: Realists attack the answer Hart gives to it, which is why he engages them in the central chapters of the book.
        correct: true
        why: 'Right: the lecture says the sceptics attack law as a matter of rules, so Hart engages realism in chapters V–VII, where he builds his own rule-based theory.'
      - text: Realists ignore it, because their only interest is the relation between law and coercion, Hart's first question.
        why: The lecture says realists are really attacking the point about rules; they do not ignore the third question.
      - text: Realists and Hart agree about it and differ only on the second question, about law and morality.
        why: Law and morality is where Hart meets natural law (chapters VIII–IX); with the realists the dispute is about rules.
  - key: a14
    type: mcq
    concept: realism-against-formalism
    difficulty: 2
    stem: In the lecture, what did the realists think the best way of studying legal institutions and judicial reasoning was?
    options:
      - text: Philosophical analysis of the meaning of legal concepts, as in Oxford ordinary language philosophy
        why: This is closer to Hart's method; the lecture says the realists looked instead to sociology and the empirical sciences.
      - text: Deduction from the axioms of the legal system, testing each outcome against the logic of the rules
        why: This is the formalist method the realists rejected as a myth about how judges decide.
      - text: Looking at the actual behaviour of judges, drawing on sociology and the empirical sciences
        correct: true
        why: 'Right: the lecture says the realists looked at the actual behaviour of judges, even if their early methodology was not sophisticated.'
      - text: Reading the reasons judges give in their published judgments as a faithful record of their thinking
        why: Realists doubted that stated legal reasons were the real reasons; they looked at behaviour and non-legal factors.
  - key: a15
    type: mcq
    concept: realism-against-formalism
    difficulty: 3
    variant-of: a14
    stem: Which is a fair criticism of early realist method, according to the lecture?
    options:
      - text: It used no empirical evidence at all and rested only on intuitions about what individual judges happen to prefer.
        why: 'Too strong: the realists did look to empirical study; the lecture''s criticism is that the methodology was unsophisticated.'
      - text: Its empirical methodology was not sophisticated, and many would now see it as wrong in the social sciences.
        correct: true
        why: 'Right: the lecture says the early realists'' methodology is really not sophisticated and for many would be wrong in the social sciences.'
      - text: It relied too heavily on conceptual analysis in the style of Hart's The Concept of Law.
        why: The realists preceded The Concept of Law (1961) and looked to sociology rather than conceptual analysis.
      - text: It assumed a formalist theory of adjudication that it was supposed to be criticising.
        why: This is not the lecture's criticism; Leiter's point is that realism presupposes a positivist account of legality, not formalism.
  - key: a16
    type: mcq
    concept: realism-against-formalism
    difficulty: 2
    contrasts-with:
      - conceptual-and-empirical-rule-scepticism
    stem: 'A student writes: "Realism says there are no rules, so it cannot explain anything." What is the best correction?'
    options:
      - text: Realists deny only that rules exist in common law systems; in civil law systems they accept them.
        why: The materials draw no such line between legal families; realism's scepticism is about paper rules deciding cases.
      - text: Realism is a family of claims; some concern the nature of law, others adjudication, and they differ.
        correct: true
        why: 'Right: realism is an umbrella term, and the lecture separates claims about the nature of law from claims about adjudication (conceptual vs empirical scepticism).'
      - text: Realists accept rules fully and object only to the style in which judges write their judgments.
        why: 'Too weak: realists did challenge the idea of law as a system of rules, and say rules in books do not decide cases.'
