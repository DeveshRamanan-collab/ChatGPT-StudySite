  - key: s04
    type: short
    concept: nightmare-and-noble-dream
    difficulty: 3
    contrasts-with:
      - open-texture-and-harts-middle-way
    prompt: Are judges law-makers? Answer with reference to Hart's Nightmare and Noble Dream.
    model: 'Sometimes, in hard cases only. Hart identifies two exaggerations in American jurisprudence, which he says is concentrated "almost to the point of obsession" on the judicial process. The Nightmare: litigants expect the existing law to be applied to their disputes, not new law made for them, and judges and legislators have different functions; the Nightmare is that this image is an illusion. American Legal Realism presented it not as a feature of difficult adjudication, such as constitutional cases, but as essential to all law and adjudication. The Noble Dream: judges never make law; even where the text of constitutional provisions, statutes or precedents offers no determinate guide, there is an existing law somewhere to apply. Dworkin is the noblest dreamer: even where two interpretations fit equally well, the judge is never to make law. Hart sits between them. In easy cases the core of the rule guides and judges apply existing law; in the penumbra they must make a fresh choice. The Dream''s attraction is liberal (positions determined ex ante), but it cannot survive open texture; the Nightmare generalises from the hard case.'
    rubric:
      - id: r1
        criterion: Thesis — answers the question directly (always, never, or sometimes) in the first sentence.
        marks: 2
        top-band: Gives a qualified answer tied to the easy/hard case distinction.
        margin-note: Answer the question asked.
        authorities: []
      - id: r2
        criterion: Argument — explains the Nightmare and the Noble Dream accurately, with their proponents.
        marks: 3
        top-band: Names realism and Dworkin and uses the slide's phrasing for each.
        margin-note: Accurate on both.
        authorities:
          - hart-the-nightmare-and-the-noble-dream
      - id: r3
        criterion: Counterargument — gives the strongest case for the Noble Dream (the liberal view that positions are determined ex ante; one right answer).
        marks: 3
        top-band: Presents Dworkin's reason for the Dream, not just the label.
        margin-note: Why would anyone dream this?
        authorities:
          - dworkin-laws-empire
      - id: r4
        criterion: Evaluation — defends a position between the extremes using open texture.
        marks: 2
        top-band: Links the verdict to core and penumbra from chapter VII.
        margin-note: Good link back to chapter VII.
        authorities:
          - hart-the-concept-of-law
  - key: f01
    type: mcq
    concept: leiter-realism-as-theory-of-adjudication
    difficulty: 2
    stem: What two widespread views does Leiter challenge in 'Legal Realism and Legal Positivism Reconsidered'?
    options:
