  - key: d11
    type: mcq
    concept: open-texture-and-harts-middle-way
    difficulty: 2
    stem: '"Formalism and rule-scepticism are the Scylla and Charybdis of juristic theory." What is Hart''s point?'
    options:
      - text: Both are exaggerations, salutary where they correct each other, and the truth lies between them.
        correct: true
        why: 'Right: Hart says they are great exaggerations, salutary where they correct each other, and the truth lies between them (CL 147).'
      - text: Formalism is correct for easy cases and rule-scepticism is correct for all cases in the higher courts.
        why: Hart does not divide the field this way; he treats both as exaggerations and holds a middle position.
      - text: Both are defensible, and a theorist must choose one of them as the starting point for legal theory.
        why: Hart's image is of two dangers to steer between, not two starting points to choose from.
      - text: Rule-scepticism is the lesser danger, so legal theory should lean towards the realists' view.
        why: Hart does not rank them; he rejects both as great exaggerations of juristic theory.
