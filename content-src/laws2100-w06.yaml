    cases: []
    authorities:
      - holmes-the-path-of-the-law
      - ross-tu-tu
    verify: false
    body: |-
      In 'The Path of the Law' (1897), often seen as foundational to American legal realism, Holmes urges lawyers to view law
      through the eyes of the **bad man**, who cares only about the practical consequences of breaking rules.

      "The prophecies of what the courts will do in fact, and nothing more pretentious, are what I mean by the law." (10(8)
      *Harvard Law Review* 460–461)

      This is the **prediction theory**: law is a prediction of what courts will do in fact. On the realist view we are under
      a legal duty not to do X because doing X is likely to result in an adverse court ruling. Unlike Austin, the focus is not
      commands and sanctions but the behaviour of officials.

      Ross, the leading Scandinavian realist, reached realism through a criticism of Kelsen. In "Tû-Tû" (1957) ownership has
      no semantic reference: it is a placeholder linking factual statements to legal consequences.

      Counterarguments (slide 10):

      - it misses the **internal point of view** some participants take;
      - it makes it impossible to say a court has **made a mistake** about the law;
      - why prefer the bad man to the **puzzled person** who wishes to arrange their affairs according to law?
      - if there are no legal rules, **how do we know who a judge is**?

      Exam use: the puzzled man is Hart's answer to the bad man, and the finality/infallibility point is his sharpest
      objection to the prediction theory.
  - slug: conceptual-and-empirical-rule-scepticism
    title: Conceptual and empirical rule-scepticism
    visual: diagram
    visual-brief: 'A fork: one branch denies that rules are law at all (conceptual: duty iff the courts say so), the other keeps the rules but cuts the wire between rule and decision (empirical: facts, many rules, conflicting interpretations); under the second, three sockets for idiosyncratic, sociological and pragmatic factors.'
    related:
      - holmes-prediction-theory
      - leiter-realism-as-theory-of-adjudication
    depends-on:
      - laws2100-w03-legal-obligation-and-social-rules
    contrasts-with:
      - leiter-realism-as-theory-of-adjudication
    cases: []
    authorities:
      - hart-the-concept-of-law
    verify: false
    body: |-
      Chapter VII of *The Concept of Law* discusses varieties of rule-scepticism; the literature distinguishes two.

      **Conceptual rule-scepticism** is about the nature of law. The real law should not be identified with "paper rules".
      We are under a legal duty not to do X if and only if the courts say so, because doing X is likely to result in an
      adverse court ruling. It challenges whether rules really exist, so Hart must defeat it to defend law as the union of
      primary and secondary rules.

      **Empirical rule-scepticism** is about adjudication. In deciding cases judges respond to the underlying facts rather
      than to legal rules/reasons. There are so many rules that might be relevant that there is always support for both sides,
      and conflicting ways of interpreting statutes and precedents. Judges cherry-pick doctrine to reach a result reached on
      other grounds.

      You can be an empirical rule-sceptic without embracing conceptual rule-scepticism: rules may exist, but judges do not
      use them to decide cases.

      The realists wanted a theory of adjudication consistent with scientific inquiry: empirical, observational and
      positivistic in the scientific, not legal, sense, seeking "laws of judicial behaviour". Non-legal factors determine the
      outcome:

      - idiosyncratic adjudication (Frank): the judge's individual preferences;
      - sociological adjudication (Llewellyn): shared background of judges as a class;
      - pragmatic adjudication (Cohen): policy consequences.

      Exam use: name the kind of scepticism before you rebut it; Hart's best arguments hit only one.
  - slug: open-texture-and-harts-middle-way
    title: Open texture and Hart's middle way
    visual: simulation
    visual-brief: A 'No vehicles in the park' sign with a slider of objects from motor-car (core, rule applies) through bicycle and roller skates (penumbra, a fresh choice) to aeroplane; a second dial moves between formalism (all core) and rule-scepticism (all penumbra), with Hart's position in the middle.
    related:
