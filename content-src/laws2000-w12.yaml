    verify: false
  - slug: hrc-general-comment-31-para-8
    title: Human Rights Committee, General Comment No 31, para 8
    kind: other
    text: >-
      "The Covenant cannot be viewed as a substitute for domestic criminal or civil law. However the positive
      obligations on States Parties to ensure Covenant rights will only be fully discharged if individuals are protected
      by the State, not just against violations of Covenant rights by its agents, but also against acts committed by
      private persons or entities … in so far as they are amenable to application between private persons or entities".
    gloss: >-
      States must protect individuals against private actors as well as against their own agents (horizontal
      obligations).
