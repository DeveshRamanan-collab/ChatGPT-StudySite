  - key: q641
    type: short
    concept: scope-and-extraterritoriality
    difficulty: 3
    cases:
      - construction-of-a-wall-advisory-opinion
      - armed-activities-on-the-territory-of-the-congo-democratic-republic-of-the-congo-v-uganda
    prompt: >-
      State A's armed forces occupy a province of neighbouring State B. A's soldiers detain local residents (none of
      them A's nationals) without charge, and an armed group acting on its own account attacks villages in the province
      while A's forces stand by. A says that the ICCPR, to which A is a party, does not apply outside A's territory, and
      that it cannot answer for the armed group in any event. Advise.
    model: >-
      Issue: whether A's ICCPR obligations apply in the occupied province, and whether A can be responsible in relation
      to

      the armed group's attacks.


      Law: states must respect the rights of people within their territory and those subject to their jurisdiction
      (ICCPR

      art 2(1)), irrespective of nationality. In the Wall opinion (para 109) the ICJ said jurisdiction is primarily

      territorial but may be exercised abroad, and given the Covenant's object and purpose the drafters did not intend
      to let

      states escape their obligations when they do. In DRC v Uganda, human rights instruments applied to acts done in
      the

      exercise of jurisdiction outside a state's territory, particularly in occupied territory (para 216); as occupying
      Power

      Uganda was responsible for its military's violations and for any lack of vigilance in preventing violations by
      others,

      including rebel groups acting on their own account (para 179).


      Application: as occupier, A exercises jurisdiction in the province, so the ICCPR applies; the detainees'
      nationality is

      irrelevant, and detention without charge engages art 9. A need not control the armed group: standing by engages
      its

      own duty of vigilance.


      Conclusion: both of A's arguments fail.
    rubric:
      - id: r1
        criterion: "Issue: extraterritorial application and responsibility regarding the armed group"
        marks: 1
        top-band: >-
          Identifies both issues: whether the ICCPR applies in occupied territory, and A's position regarding the armed
          group.
        margin-note: Two arguments from A — address each.
        authorities: []
      - id: r2
        criterion: "Law: art 2(1), the Wall opinion and DRC v Uganda"
        marks: 3
        top-band: >-
          States art 2(1) (territory or jurisdiction, irrespective of nationality), Wall para 109's object-and-purpose
          reasoning, and DRC v Uganda paras 179 and 216.
        margin-note: Cite the paragraph — 179 is the vigilance point, 216 the application point.
        authorities:
          - iccpr-art-2-1
          - iccpr-arts-6-13
      - id: r3
        criterion: Application to the occupation, the detainees and the armed group
        marks: 3
        top-band: >-
          Shows occupation means jurisdiction abroad, dismisses nationality, links detention to art 9, and treats
          standing by as a failure of vigilance rather than attribution.
        margin-note: Careful — you do not need to attribute the group's acts to A; vigilance is A's own duty.
        authorities: []
      - id: r4
        criterion: Conclusion
        marks: 1
        top-band: >-
          Concludes that the ICCPR applies and that A is responsible for its soldiers' detentions and its lack of
          vigilance.
        margin-note: Finish on both of A's arguments.
        authorities: []
  - key: q701
    type: mcq
    concept: derogations-and-limitations
    difficulty: 1
    set: pretest
    stem: Under ICCPR art 4(1), when may a state party derogate from its Covenant obligations?
    options:
      - text: Whenever its government considers national security requires it
        why: >-
          Tempting because security is the usual reason given, but art 4(1) requires a public emergency threatening the
          life of the nation that is officially proclaimed.
      - text: In a proclaimed emergency threatening the life of the nation
        correct: true
        why: >-
          Correct — art 4(1): "In time of public emergency which threatens the life of the nation and the existence of
          which is officially proclaimed".
      - text: Only in an armed conflict that the Security Council has authorised
        why: >-
          Tempting because armed conflict can be an emergency, but art 4 does not require war or Security Council
          authorisation; any qualifying public emergency will do.
      - text: At any time, provided it notifies the other states parties
        why: >-
          Tempting because notification is one of the requirements, but it is not enough on its own; there must first be
          a qualifying, proclaimed emergency.
  - key: q702
    type: mcq
    concept: derogations-and-limitations
    difficulty: 2
    stem: Under ICCPR art 4(1), how far may derogating measures go?
    options:
      - text: As far as the government reasonably believes is useful
        why: >-
          Tempting because governments get some leeway in emergencies, but the art 4(1) standard is strict necessity,
          not reasonable belief or usefulness.
      - text: As far as the legislature approves by a special majority
        why: >-
          Tempting because domestic approval adds legitimacy, but art 4(1) measures the extent by the emergency's
          demands, not by domestic voting rules.
      - text: Only to the extent strictly required by the exigencies of the situation
        correct: true
        why: >-
          Correct — art 4(1) allows measures only "to the extent strictly required by the exigencies of the situation",
          the necessity and proportionality requirement.
      - text: As far as needed, provided the emergency lasts under a year
        why: >-
          Tempting because duration is relevant to proportionality, but art 4 sets no fixed time limit; the test is what
          the situation strictly requires.
  - key: q703
    type: mcq
    concept: derogations-and-limitations
    difficulty: 2
    stem: Which ICCPR articles does art 4(2) list as non-derogable?
    options:
      - text: 6, 7, 8(1) and (2), 11, 15, 16 and 18
        correct: true
        why: "Correct — art 4(2): \"No derogation from articles 6, 7, 8 (paragraphs 1 and 2), 11, 15, 16 and 18 may be made\"."
      - text: 6, 7, 9 and 12 — life, torture, liberty and movement
        why: >-
          Tempting because liberty and movement are often restricted in emergencies, but that is why arts 9 and 12 are
          derogable; they are not in art 4(2).
      - text: 9, 10, 12 and 13 — liberty, detention, movement and aliens
        why: Tempting because these are the rights most affected in emergencies, but none of them is listed in art 4(2).
      - text: 6, 7 and 8 only — life, torture and slavery
        why: >-
          Tempting because these are the best-known non-derogable rights, but art 4(2) also lists arts 11, 15, 16 and
          18.
  - key: q704
    type: mcq
    concept: derogations-and-limitations
    difficulty: 3
    variant-of: q703
    stem: Which of these ICCPR rights, as listed on the slides, is non-derogable under art 4(2)?
    options:
      - text: Art 9, the right to liberty and security
        why: >-
          Tempting because liberty feels fundamental, but art 9 is not in art 4(2); emergency detention measures are
          judged by necessity and proportionality (as in Aksoy).
      - text: Art 11, no imprisonment for breach of contract
        correct: true
        why: >-
          Correct — art 11 appears in the art 4(2) list, so no emergency can justify imprisoning someone merely for
          failing to perform a contract.
      - text: Art 12, the right to freedom of movement
        why: >-
          Tempting because movement is a core liberty, but art 12 is not listed in art 4(2), so it can be derogated from
          in a proper emergency.
      - text: Art 10, rights of persons in detention
        why: Tempting because detention links to torture (art 7), but art 10 itself is not on the art 4(2) list.
  - key: q705
    type: mcq
    concept: derogations-and-limitations
    difficulty: 3
    contrasts-with:
      - history-and-foundations-of-human-rights
    stem: ICCPR art 4(1) forbids derogating measures that involve discrimination "solely on the ground of" which grounds?
    options:
      - text: Race, sex, language, or religion
        why: Tempting because this is the UN Charter's list (arts 1(3), 55(c)), but art 4(1) adds colour and social origin.
      - text: Race, colour, sex, language, religion or social origin
        correct: true
        why: >-
          Correct — art 4(1) bars measures involving discrimination "solely on the ground of race, colour, sex,
          language, religion or social origin".
      - text: Political or other opinion, national origin, property or birth
        why: >-
          Tempting because these appear in UDHR art 2, but art 4(1)'s list is race, colour, sex, language, religion and
          social origin.
      - text: Nationality, legal status or residence
        why: >-
          Tempting because the scope slide mentions nationality and legal status, but those concern who is protected,
          not art 4(1)'s discrimination grounds.
  - key: q706
    type: mcq
    concept: derogations-and-limitations
    difficulty: 2
    stem: How does ACHR art 27(1) describe the situation in which a state may derogate?
    options:
      - text: War, public danger or other emergency threatening independence or security
        correct: true
        why: >-
          Correct — art 27(1): "In time of war, public danger, or other emergency that threatens the independence or
          security of a State Party".
      - text: A public emergency threatening the life of the nation, officially proclaimed
        why: >-
          Tempting because it is the derogation trigger studied this week, but this is the ICCPR art 4(1) wording, not
          the American Convention's.
      - text: Any situation the Inter-American Commission certifies as a crisis
        why: >-
          Tempting because regional bodies supervise derogations, but art 27(1) does not make derogation depend on a
          body's certification.
      - text: An armed attack against it, as defined in art 51 of the UN Charter
        why: >-
          Tempting because art 51 concerns armed attacks and self-defence, but art 27 is broader: war, public danger or
          other emergency.
  - key: q707
    type: mcq
    concept: derogations-and-limitations
    difficulty: 3
    variant-of: q706
    stem: Which phrase appears in ACHR art 27(1) but not in ICCPR art 4(1)?
    options:
      - text: "\"officially proclaimed\""
        why: >-
          Wrong way round — the requirement that the emergency be "officially proclaimed" is in ICCPR art 4(1), not ACHR
          art 27(1).
      - text: "\"strictly required by the exigencies of the situation\""
        why: Tempting because it is the key phrase, but both provisions use it; it is common ground.
      - text: "\"and for the period of time\""
        correct: true
        why: >-
          Correct — ACHR art 27(1) allows measures "to the extent and for the period of time strictly required", making
          duration express; ICCPR art 4(1) says only "to the extent".
      - text: "\"not inconsistent with … other obligations under international law\""
        why: Tempting because it is a condition of derogation, but both provisions include it.
  - key: q708
    type: mcq
    concept: derogations-and-limitations
    difficulty: 2
    stem: Which right is listed on the slides as non-suspendable under ACHR art 27(2)?
    options:
      - text: Freedom of assembly
        why: >-
          Tempting because assembly is a core political freedom, but it is not among the rights the slide lists from art
          27(2).
      - text: Freedom of conscience and religion (art 12)
        correct: true
        why: >-
          Correct — the slide lists art 12 (Freedom of Conscience and Religion) among the non-suspendable rights, with
          juridical personality, life, humane treatment, freedom from slavery and ex post facto laws.
      - text: The right to property
        why: >-
          Tempting because property is protected in the Convention, but it is not among the non-suspendable rights the
          slide lists.
      - text: Freedom of movement and residence
        why: >-
          Tempting because movement is a core liberty, but it is not among the rights the slide lists as
          non-suspendable.
  - key: q709
    type: mcq
    concept: derogations-and-limitations
    difficulty: 2
    stem: Which of these is NOT one of the four substantive requirements for derogation listed on the slides?
    options:
      - text: Necessity and proportionality (nature, duration, impact)
        why: >-
          Tempting to exclude because it is a familiar general principle, but it is the first of the four requirements,
          illustrated by Aksoy v Turkey.
      - text: Consistency with other international obligations, especially jus cogens
        why: >-
          Tempting to exclude because it looks outside the treaty, but it is the second requirement and mirrors art
          4(1)'s wording.
      - text: Authorisation by the UN Security Council
        correct: true
        why: >-
          Correct — the four are necessity and proportionality, consistency with other obligations, no effect on
          absolute rights, and notification; no Security Council role is listed.
      - text: Notification
        why: Tempting to exclude because it is procedural, but the slide lists the notification requirement as the fourth.
  - key: q710
    type: mcq
    concept: derogations-and-limitations
    difficulty: 3
    cases:
      - aksoy-v-turkey
    stem: >-
      In Aksoy v Turkey (para 78), why was holding a suspect for fourteen days without judicial intervention not
      justified?
    options:
      - text: Because investigating terrorism can never justify any derogation from the right to liberty
        why: >-
          Tempting because the Court found a violation, but it accepted that terrorism investigations present "special
          problems"; the measure failed on necessity.
      - text: Because Turkey had not notified the other parties of its derogation
        why: >-
          Tempting because notification is a requirement, but the extract turns on necessity: the period was
          exceptionally long and no detailed reasons were given.
      - text: Because the period was exceptionally long and not shown to be necessary
        correct: true
        why: >-
          Correct — the Court could not accept fourteen days was necessary: the period was "exceptionally long", left
          the applicant vulnerable to arbitrary interference and torture, and no detailed reasons were given.
      - text: Because the right to liberty is listed as non-derogable in the Convention
        why: >-
          Tempting because liberty is basic, but liberty is not non-derogable; the measure failed because it went beyond
          what was strictly required.
  - key: q711
    type: mcq
    concept: derogations-and-limitations
    difficulty: 2
    cases:
      - aksoy-v-turkey
    stem: Which factors does the slide name for assessing the necessity and proportionality of a derogation?
    options:
      - text: Nature, duration and impact
        correct: true
        why: >-
          Correct — the slide lists "Necessity and proportionality (nature, duration, impact)" as the first substantive
          requirement.
      - text: Law, legitimate aim and democratic necessity
        why: >-
          Tempting because these are this week's limitation conditions, but they apply to restrictions outside an
          emergency, not to the necessity factors for derogations.
      - text: Notification, proclamation and approval by the courts
        why: >-
          Tempting because proclamation and notification are part of derogation, but they are separate requirements, not
          the factors for necessity.
  - key: q712
    type: mcq
    concept: derogations-and-limitations
    difficulty: 2
    stem: Outside an emergency, which conditions must a restriction on a right satisfy, according to the slides?
    options:
      - text: A proclaimed public emergency, strict necessity and notification
        why: >-
          Tempting because these are derogation requirements, but outside an emergency the slides set different
          conditions for limitations.
      - text: Provided by law, a legitimate aim, and democratic necessity
        correct: true
        why: >-
          Correct — restrictions outside an emergency must be provided by law, serve a legitimate aim described in the
          limitation clause, and be necessary in a democratic society.
      - text: Approval by the treaty body before it takes effect
        why: >-
          Tempting because treaty bodies oversee compliance, but the slides set no prior-approval condition; the state
          must meet the three limitation conditions.
      - text: Consistency with the state's constitution, whatever its content
        why: >-
          Tempting because "provided by law" can include the constitution, but that is only one condition; there must
          also be a legitimate aim and democratic necessity.
  - key: q713
    type: mcq
    concept: derogations-and-limitations
    difficulty: 3
    variant-of: q712
    stem: What does "necessary in a democratic society" require, according to the slides?
    options:
      - text: Majority support for the restriction in a referendum or election
        why: >-
          Tempting because "democratic" suggests votes, but the slides define it by public need, proportionality and a
          legitimate aim, not popular support.
      - text: That the restriction be enacted by parliament rather than the executive
        why: >-
          Tempting because parliamentary enactment helps meet "provided by law", but that is a separate condition;
          democratic necessity concerns need and proportion.
      - text: Responding to a public need, proportionately, for a legitimate aim
        correct: true
        why: >-
          Correct — the slide: "Necessary in a democratic society. That is responding to a public need, is proportionate
          and the aim pursued is legitimate."
      - text: Measures the other states parties also apply in their own laws
        why: >-
          Tempting because comparative practice can inform reasonableness, but the slides do not make it the test; the
          test is public need and proportionality.
  - key: q714
    type: mcq
    concept: derogations-and-limitations
    difficulty: 3
    contrasts-with:
      - core-instruments-and-sources-of-obligation
    stem: >-
      State P, facing a properly proclaimed emergency threatening the life of the nation, suspends the prohibition on
      torture for terrorism suspects and notifies the other parties. Is this a valid derogation?
    options:
      - text: Yes — the emergency is proclaimed and notified, so the measure is valid if strictly required
        why: >-
          Tempting because those are real requirements, but no derogation can touch a non-derogable right, whatever the
          emergency or notice.
      - text: No — art 7 is non-derogable under art 4(2)
        correct: true
        why: >-
          Correct — art 4(2) bars derogation from art 7 (torture), and the requirements also forbid affecting absolute
          rights and breaching jus cogens.
      - text: Yes, but only for suspects who are not nationals of State P
        why: >-
          Tempting because some measures target foreigners, but art 7 is non-derogable for everyone, and art 4(1) also
          limits discriminatory measures.
      - text: Only if the measure is time-limited and reviewed by a court
        why: >-
          Tempting because safeguards help proportionality, but they cannot rescue a derogation from a non-derogable
          right like art 7.
  - key: q715
    type: mcq
    concept: derogations-and-limitations
    difficulty: 3
    variant-of: q712
    stem: >-
      With no emergency, State T bans a protest under a statute aimed at protecting the rights and freedoms of others,
      using a narrowly drawn order. Which test applies?
    options:
      - text: "The art 4 derogation test: proclamation, strict necessity, notification"
        why: >-
          Tempting because the ban restricts a right, but art 4 applies only in a public emergency threatening the life
          of the nation; there is none here.
      - text: None — protest rights are absolute and can never be restricted
        why: >-
          Tempting because assembly is important, but the slides distinguish absolute from limited rights; assembly can
          be limited if the conditions are met.
      - text: Whether the ban is consistent with the other states parties' laws
        why: >-
          Tempting because comparison can inform reasonableness, but the slides' test for limitations does not depend on
          other states' laws.
      - text: "The limitation test: law, legitimate aim, democratic necessity"
        correct: true
        why: >-
          Correct — outside an emergency a restriction must be provided by law, pursue a legitimate aim (here protecting
          others' rights), and be necessary in a democratic society.
  - key: q721
    type: truefalse
    concept: derogations-and-limitations
    difficulty: 1
    set: quickfire
    statement: Under ICCPR art 4(2), no derogation may be made from art 7, the prohibition on torture.
    answer: true
    why: >-
      True — art 4(2) lists arts 6, 7, 8(1) and (2), 11, 15, 16 and 18 as non-derogable; art 7 (torture) cannot be
      suspended in any emergency.
  - key: q722
    type: truefalse
    concept: derogations-and-limitations
    difficulty: 1
    set: quickfire
    statement: A derogation under ICCPR art 4 requires the public emergency to be officially proclaimed.
    answer: true
    why: >-
      True — art 4(1) applies to a public emergency "which threatens the life of the nation and the existence of which
      is officially proclaimed".
  - key: q723
    type: truefalse
    concept: derogations-and-limitations
    difficulty: 2
    set: quickfire
    statement: Outside a public emergency, a state may restrict a limited right whenever its executive considers it convenient.
    answer: false
    why: >-
      False — a restriction outside an emergency must be provided by law, serve a legitimate aim in the limitation
      clause, and be necessary in a democratic society (public need, proportionate).
  - key: q724
    type: truefalse
    concept: derogations-and-limitations
    difficulty: 2
    cases:
      - aksoy-v-turkey
    statement: >-
      In Aksoy v Turkey, the Court accepted that holding a suspect for fourteen days without judicial intervention was
      necessary to fight terrorism.
    answer: false
    why: >-
      False — the Court "cannot accept that it is necessary": the period was exceptionally long and Turkey gave no
      detailed reasons why judicial intervention was impracticable.
  - key: q741
    type: short
    concept: derogations-and-limitations
    difficulty: 3
    cases:
      - aksoy-v-turkey
    prompt: >-
      After a series of bombings, State V officially proclaims a state of emergency threatening the life of the nation
      and notifies the other ICCPR parties. A decree then provides that (a) suspects may be held for 30 days without
      being brought before a judge; (b) interrogators may beat suspects who refuse to answer; and (c) members of one
      religious minority may be detained without charge for the duration of the emergency. Advise whether each measure
      is a valid derogation under the ICCPR.
    model: >-
      Issue: whether each measure falls within ICCPR art 4.


      Law: art 4(1) permits derogation in a public emergency threatening the life of the nation and officially
      proclaimed,

      only "to the extent strictly required by the exigencies of the situation", consistently with other international

      obligations, and without discrimination solely on the ground of race, colour, sex, language, religion or social
      origin.

      Art 4(2) bars derogation from arts 6, 7, 8(1)–(2), 11, 15, 16 and 18. The four substantive requirements are
      necessity

      and proportionality (nature, duration, impact), consistency with other obligations (especially jus cogens), no
      effect

      on absolute or non-derogable rights, and notification. In Aksoy v Turkey, fourteen days without judicial
      intervention

      was "exceptionally long" and not shown to be necessary.


      Application: the threshold, proclamation and notification are met. (a) Thirty days without a judge is more than
      double

      the period rejected in Aksoy; unless V gives detailed reasons, it is not strictly required. (b) Beating suspects
      breaches

      art 7, which is non-derogable and jus cogens. (c) Detaining one religious minority is discrimination solely on the

      ground of religion, which art 4(1) forbids.


      Conclusion: none of the three measures is a valid derogation.
    rubric:
      - id: r1
        criterion: "Issue: validity of each measure under art 4"
        marks: 1
        top-band: Frames the question measure by measure, after noting the threshold, proclamation and notification.
        margin-note: Take the measures one at a time — they fail for different reasons.
        authorities: []
      - id: r2
        criterion: "Law: art 4(1), art 4(2), the four requirements, Aksoy"
        marks: 3
        top-band: >-
          States the art 4(1) conditions, the art 4(2) list, the four substantive requirements, and Aksoy's reasoning on
          necessity.
        margin-note: Quote "strictly required" — it is the hinge for measure (a).
        authorities:
          - iccpr-art-4
          - vclt-art-53
      - id: r3
        criterion: Application to measures (a), (b) and (c)
        marks: 3
        top-band: >-
          Compares 30 days with Aksoy's fourteen, identifies art 7 as non-derogable and jus cogens, and spots the
          religious discrimination bar in art 4(1).
        margin-note: Measure (c) is the one most answers miss — re-read art 4(1).
        authorities: []
      - id: r4
        criterion: Conclusion
        marks: 1
        top-band: Gives a clear conclusion for each measure.
        margin-note: One line per measure would make this crisp.
        authorities: []
  - key: q801
    type: mcq
    concept: international-human-rights-machinery
    difficulty: 1
    stem: Which body did the Human Rights Council replace in 2006?
    options:
      - text: The Human Rights Committee
        why: >-
          Tempting because the names are almost identical, but the Committee is the ICCPR treaty body and still exists;
          the Council replaced the UN Commission on Human Rights.
      - text: The UN Commission on Human Rights
        correct: true
        why: "Correct — the slide: the Human Rights Council \"Replaced UN Cssn on HR in 2006 (UNGA resolution 60/251)\"."
      - text: The Trusteeship Council
        why: >-
          Tempting because it is another UN council, but the slides say the Human Rights Council replaced the Commission
          on Human Rights.
      - text: The Committee against Torture
        why: >-
          Tempting because it is a human rights body, but it is a treaty body under CAT and was not replaced; the
          Council replaced the Commission.
  - key: q802
    type: mcq
    concept: international-human-rights-machinery
    difficulty: 2
    stem: How is the Human Rights Council composed, according to the slides?
    options:
      - text: All UN member states, each with one vote
        why: Tempting because every member state takes part in the UPR, but the Council itself has 47 elected members.
      - text: Independent experts appointed by the Secretary-General
        why: >-
          Tempting because independent experts work in the system (special procedures), but the Council is made up of
          states.
      - text: 47 states elected by the General Assembly for three-year terms
        correct: true
        why: >-
          Correct — 47 (country) members, elected by the UNGA for 3-year terms (maximum 2 consecutive terms), with
          regional distribution.
      - text: The fifteen members of the Security Council
        why: >-
          Tempting because the Security Council is the UN's most powerful organ, but the Human Rights Council is a
          separate body of 47 elected states.
  - key: q803
    type: mcq
    concept: international-human-rights-machinery
    difficulty: 2
    stem: Which instrument established the Human Rights Council, according to the slides?
    options:
      - text: UNGA resolution 60/251
        correct: true
        why: >-
          Correct — the slide says the Council replaced the UN Commission on Human Rights in 2006 by UNGA resolution
          60/251.
      - text: A Security Council resolution under Chapter VII
        why: >-
          Tempting because the Security Council can create bodies (such as tribunals), but the Council was created by
          the General Assembly.
      - text: An amendment to the UN Charter adding a new principal organ
        why: >-
          Tempting because it sounds like a major institutional change, but it was done by General Assembly resolution,
          not Charter amendment.
      - text: The Optional Protocol to the ICCPR
        why: >-
          Tempting because the Optional Protocol concerns complaints, but it relates to the Human Rights Committee, not
          the Council.
  - key: q804
    type: mcq
    concept: international-human-rights-machinery
    difficulty: 1
    stem: How often is each UN member state reviewed under the Universal Periodic Review?
    options:
      - text: Every three years, matching Council membership terms
        why: "Tempting because members serve three-year terms, but the UPR cycle is longer: every 4.5 years."
      - text: Every 4.5 years
        correct: true
        why: "Correct — the slide: \"Each member state is reviewed every 4.5 years\"."
      - text: Every year, at the Council's regular session
        why: Tempting because the Council meets regularly, but each state's review comes around every 4.5 years.
      - text: Only when a special session is called about it
        why: >-
          Tempting because special sessions exist, but the UPR is periodic and universal — every member state, every 4.5
          years.
  - key: q805
    type: mcq
    concept: international-human-rights-machinery
    difficulty: 2
    stem: What happens to the recommendations in a UPR outcome report?
    options:
      - text: They bind the state under review, like a judgment
        why: >-
          Tempting because they come from a formal review, but the slide says states accept or note them; they are not
          binding judgments.
      - text: They are referred to the Security Council for enforcement
        why: Tempting because enforcement seems the next step, but the slides describe no Security Council role in the UPR.
      - text: The state under review accepts or notes them
        correct: true
        why: >-
          Correct — the slide: the working group issues an "Outcome Report" with recommendations, and "States accept or
          note the recommendations".
      - text: They go to the ICJ for an advisory opinion
        why: >-
          Tempting because the ICJ gives advisory opinions, but the UPR process ends with the state accepting or noting
          recommendations.
  - key: q806
    type: mcq
    concept: international-human-rights-machinery
    difficulty: 2
    variant-of: q805
    stem: Who reviews the reports submitted in the Universal Periodic Review?
    options:
      - text: The Human Rights Committee's independent experts
        why: >-
          Tempting because the Committee reviews state reports under the ICCPR, but that is treaty-based reporting; the
          UPR is done by a Council working group.
      - text: A working group of 47 members
        correct: true
        why: >-
          Correct — states (and NGOs) submit reports, and a working group (47 members) reviews them and issues an
          outcome report.
      - text: A panel of ICJ judges
        why: Tempting because judges review legality, but the UPR is a peer review by states, not a judicial process.
      - text: The special rapporteur on the country concerned
        why: >-
          Tempting because country mandates investigate violations, but special procedures are separate from the UPR
          working group.
  - key: q807
    type: mcq
    concept: international-human-rights-machinery
    difficulty: 2
    stem: In its UPR review in January 2021, how many recommendations did Australia receive and support?
    options:
      - text: Received 290; supported 150
        why: >-
          Tempting because these figures are on the slide, but they are from Australia's second cycle (2015); in 2021 it
          received 344 and supported 177.
      - text: Received 344; supported 177
        correct: true
        why: >-
          Correct — the slide's infographic: Australia was reviewed in January 2021, received 344 recommendations and
          supported 177 at the Council's 47th session.
      - text: Received 177; supported 344
        why: >-
          Tempting because the numbers are right, but they are swapped: a state cannot support more recommendations than
          it receives.
      - text: Received 47; supported 37
        why: >-
          Tempting because 47 and 37 appear on the slide, but they are the Council session (47) and the working group
          session (37), not counts.
  - key: q808
    type: mcq
    concept: international-human-rights-machinery
    difficulty: 2
    stem: What are the Human Rights Council's special procedures?
    options:
      - text: Treaty bodies that supervise each core human rights treaty
        why: >-
          Tempting because they are also expert mechanisms, but treaty bodies are treaty-based; special procedures are
          Charter-based, under the Council.
      - text: Independent experts with thematic and country mandates
        correct: true
        why: >-
          Correct — the slide: a system of independent experts (special rapporteurs, independent experts and working
          groups) with thematic and country mandates.
      - text: Emergency sessions the Council holds in a crisis
        why: >-
          Tempting because the Council does hold special sessions, but those are a separate working method from the
          special procedures.
      - text: The ICJ's fast-track procedure for human rights cases
        why: >-
          Tempting because "procedures" sounds judicial, but special procedures are independent experts under the
          Council, not an ICJ process.
  - key: q809
    type: mcq
    concept: international-human-rights-machinery
    difficulty: 2
    stem: How many thematic and country mandates do the special procedures have, according to the slides?
    options:
      - text: 14 thematic and 46 country mandates
        why: >-
          Tempting because the numbers are right, but they are swapped: there are 46 thematic mandates and 14 country
          mandates.
      - text: 46 thematic and 14 country mandates
        correct: true
        why: >-
          Correct — 46 thematic mandates (e.g. privacy, food, climate change) and 14 country mandates (e.g. CAR,
          Belarus, Russia, Cambodia).
      - text: 47 thematic and 47 country mandates
        why: Tempting because 47 is the Council's membership, but the slides give 46 thematic and 14 country mandates.
  - key: q810
    type: mcq
    concept: international-human-rights-machinery
    difficulty: 2
    stem: Which is one of the special procedures' methods of work, according to the slides?
    options:
      - text: Issuing binding judgments against states
        why: >-
          Tempting because they receive complaints, but special procedures report and recommend; the slides give no
          power to bind states.
      - text: Visiting countries with or without the state's consent
        why: >-
          Tempting because investigations need access, but the slide says country visits are conducted with state
          consent.
      - text: Country visits, with the state's consent
        correct: true
        why: >-
          Correct — the methods are country visits (with state consent), receiving individual complaints, and issuing
          reports to foster understanding of human rights norms.
      - text: Referring situations to the Security Council for sanctions
        why: >-
          Tempting because the Security Council can respond to crises, but referral is not among the methods on the
          slide.
  - key: q811
    type: mcq
    concept: international-human-rights-machinery
    difficulty: 1
    contrasts-with:
      - rights-holders-and-duty-bearers
    stem: Which treaty body supervises the ICCPR?
    options:
      - text: The Human Rights Council
        why: >-
          Tempting because the names are nearly identical, but the Council is the Charter-based body of 47 states; the
          ICCPR's treaty body is the Committee.
      - text: The Committee on Economic, Social and Cultural Rights
        why: Tempting because it supervises the sister Covenant, but it is the treaty body for the ICESCR.
      - text: The Human Rights Committee
        correct: true
        why: Correct — the treaty bodies slide pairs the ICCPR (1966) with the Human Rights Committee.
      - text: The Committee on the Elimination of Racial Discrimination
        why: Tempting because it is the oldest treaty body, but it supervises ICERD.
  - key: q812
    type: mcq
    concept: international-human-rights-machinery
    difficulty: 3
    stem: What do the slides say about inter-state complaints under the UN human rights treaties?
    options:
      - text: "They are extremely rare: three have ever been brought, all under ICERD"
        correct: true
        why: >-
          Correct — only three inter-state complaints have ever been brought, all under ICERD; only ICERD does not
          require reciprocal declarations.
      - text: They are the main way treaties are enforced, used by states every year
        why: >-
          Wrong way round — the slide calls inter-state complaints "extremely rare"; state reporting and individual
          complaints are the working mechanisms.
      - text: They are available under every treaty without any declaration
        why: >-
          Tempting because ICERD needs no reciprocal declaration, but the slide says ICERD is the only treaty that does
          not require one.
      - text: They are heard by the ICJ, not by the treaty bodies
        why: >-
          Tempting because inter-state disputes often go to the ICJ, but the slide lists inter-state complaints among
          the treaty-based mechanisms.
  - key: q813
    type: mcq
    concept: international-human-rights-machinery
    difficulty: 2
    stem: How do the slides describe the treaty bodies' individual complaints procedures?
    options:
      - text: Public oral hearings ending in binding judgments
        why: >-
          Tempting because they are modelled on judicial practice, but they are written and confidential and end in
          "views", which are not binding.
      - text: Written, confidential, modelled on judicial practice, ending in "views"
        correct: true
        why: >-
          Correct — the slide: written, confidential proceedings modelled on judicial practice, with full opportunity
          for both parties to respond, and the adoption of "views".
      - text: Informal mediation by special rapporteurs
        why: >-
          Tempting because special procedures receive individual complaints too, but treaty body procedures are
          quasi-judicial and run by the committees.
      - text: A General Assembly vote on each complaint
        why: Tempting because the UNGA created the Council, but it plays no part in deciding individual complaints.
  - key: q814
    type: mcq
    concept: international-human-rights-machinery
    difficulty: 2
    stem: What are "general comments" in the treaty body system?
    options:
      - text: Remarks states make about each other during the Universal Periodic Review
        why: >-
          Tempting because states comment on each other in the UPR, but general comments come from treaty bodies, not
          states.
      - text: Non-binding press statements by the special rapporteurs
        why: >-
          Tempting because special procedures issue reports, but general comments are issued by treaty committees and
          are considered authoritative.
      - text: Authoritative interpretations of treaty provisions by the committees
        correct: true
        why: >-
          Correct — the slide: committees issue authoritative interpretations of treaty provisions called "general
          comments" or "general recommendations", considered authoritative.
      - text: Concluding remarks a committee adopts on a single individual complaint
        why: >-
          Tempting because committees adopt "views" on complaints, but general comments interpret provisions generally,
          not one case.
  - key: q815
    type: mcq
    concept: international-human-rights-machinery
    difficulty: 3
    cases:
      - ahmadou-sadio-diallo-republic-of-guinea-v-democratic-republic-of-the-congo
    stem: What did the ICJ say in Diallo (2010, para 66) about the Human Rights Committee's interpretation of the ICCPR?
    options:
      - text: The ICJ is bound to follow it, as the Committee's views are binding
        why: >-
          Tempting because the Committee supervises the ICCPR, but the Court said it is "in no way obliged" to model its
          interpretation on the Committee's.
      - text: It carries no weight, as the Committee is not a court
        why: Wrong way round — the Court said it should ascribe "great weight" to the Committee's interpretation.
      - text: It binds states but not the ICJ
        why: >-
          Tempting because the Court distinguished its own position, but the slides say treaty body decisions are not
          binding on anyone; they carry significant weight.
      - text: The ICJ is not obliged to follow it, but should give it great weight
        correct: true
        why: >-
          Correct — the Court is "in no way obliged" to follow the Committee but "should ascribe great weight" to it,
          for clarity, consistency and legal security.
  - key: q821
    type: truefalse
    concept: international-human-rights-machinery
    difficulty: 1
    set: quickfire
    cases:
      - ahmadou-sadio-diallo-republic-of-guinea-v-democratic-republic-of-the-congo
    statement: Treaty body decisions are binding on states in the same way as ICJ judgments.
    answer: false
    why: >-
      False — the slide says treaty body decisions are not binding but carry significant weight; in Diallo the ICJ gave
      the Human Rights Committee's interpretation "great weight".
  - key: q822
    type: truefalse
    concept: international-human-rights-machinery
    difficulty: 1
    set: quickfire
    statement: Each UN member state is reviewed under the Universal Periodic Review every 4.5 years.
    answer: true
    why: >-
      True — the UPR slide says each member state is reviewed every 4.5 years, on reports from states (and NGOs), by a
      47-member working group.
  - key: q823
    type: truefalse
    concept: international-human-rights-machinery
    difficulty: 2
    statement: Only three inter-state complaints have ever been brought under the UN human rights treaties, all under ICERD.
    answer: true
    why: >-
      True — the slide calls inter-state complaints extremely rare: only three have ever been brought, all under ICERD,
      the only treaty not requiring reciprocal declarations.
  - key: q824
    type: truefalse
    concept: international-human-rights-machinery
    difficulty: 2
    statement: The UPR facts and figures for 2024 shown in the lecture report 100% participation by UN member states.
    answer: true
    why: >-
      True — the 2024 UPR infographic on the slides reports 100% participation (a peer review of all UN member states)
      and a 76% acceptance rate for recommendations.
  - key: q841
    type: short
    concept: international-human-rights-machinery
    difficulty: 3
    cases:
      - ahmadou-sadio-diallo-republic-of-guinea-v-democratic-republic-of-the-congo
    prompt: >-
      The Human Rights Committee adopts views finding that State Z breached the ICCPR by detaining a journalist. Z's
      highest court refuses to consider the views, calling them "mere opinions with no legal weight", and Z's foreign
      ministry announces that it will decline every recommendation from its next Universal Periodic Review. Advise on
      the legal nature of these outputs and the strength of Z's position.
    model: >-
      Issue: what legal force the Committee's views and the UPR recommendations have, and whether Z may treat them as

      having no weight.


      Law: the Human Rights Committee is the ICCPR's treaty body. Its individual complaints procedure is written and

      confidential, modelled on judicial practice, and ends in "views"; general comments are considered authoritative.

      Treaty body decisions are not binding but carry significant weight. In Diallo (para 66) the ICJ said it is "in no
      way

      obliged" to model its interpretation on the Committee's, but should "ascribe great weight" to it, as the
      independent

      body established to supervise the treaty, for clarity, consistency and legal security (see also Qatar v UAE, para

      101). Under the UPR, Z is reviewed every 4.5 years by a 47-member working group, whose outcome report contains

      recommendations that the state accepts or notes.


      Application: Z is right that the views do not bind it, but wrong that they have no legal weight: they interpret
      the

      ICCPR, which does bind Z, and courts give them great weight. Z may formally note UPR recommendations rather than
      accept

      them, but cannot use that to escape its underlying treaty obligations.


      Conclusion: Z's position is technically correct on bindingness but legally weak.
    rubric:
      - id: r1
        criterion: "Issue: legal nature of views and UPR recommendations"
        marks: 1
        top-band: Identifies both outputs and asks what weight each carries.
        margin-note: Two outputs, two answers — keep them apart.
        authorities: []
      - id: r2
        criterion: "Law: treaty body procedures, Diallo, the UPR process"
        marks: 3
        top-band: >-
          Describes the individual complaints procedure and "views", states that treaty body decisions are not binding
          but carry significant weight (Diallo para 66), and explains UPR accept-or-note.
        margin-note: Diallo is the authority here — quote "great weight".
        authorities:
          - unga-resolution-60-251
      - id: r3
        criterion: Application to Z's court and foreign ministry
        marks: 3
        top-band: >-
          Separates "not binding" from "no weight", ties the views to Z's binding ICCPR obligations, and treats noting
          UPR recommendations as permitted but no escape from those obligations.
        margin-note: Not binding is not the same as no weight — make that distinction explicit.
        authorities: []
      - id: r4
        criterion: Conclusion
        marks: 1
        top-band: Gives a balanced conclusion on the strength of Z's position.
        margin-note: Say where Z is right and where it is wrong.
        authorities: []
pretest:
  - q201
