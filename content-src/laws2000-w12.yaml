  - key: q310
    type: mcq
    concept: core-instruments-and-sources-of-obligation
    difficulty: 2
    stem: What does it mean to say that a human rights norm is jus cogens?
    options:
      - text: It binds only the states that ratified the treaty expressing it.
        why: >-
          Tempting because treaty obligations work that way, but jus cogens norms bind the international community of
          states as a whole, whatever their ratifications.
      - text: No derogation is permitted, and it can be modified only by a later norm of the same character.
        correct: true
        why: >-
          Correct — VCLT art 53 describes a peremptory norm as one "from which no derogation is permitted" and which
          "can be modified only by a subsequent norm" of the same character.
      - text: It is a soft-law standard that states are encouraged but not required to follow.
        why: >-
          Wrong way round — jus cogens is the strongest category of binding norm; soft law is not legally binding at
          all.
      - text: It applies only during armed conflict, as part of international humanitarian law.
        why: >-
          Tempting because some jus cogens norms concern wartime atrocities, but jus cogens applies at all times; the
          lecture gives torture and genocide as examples.
