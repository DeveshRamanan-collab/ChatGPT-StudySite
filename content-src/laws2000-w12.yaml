  - key: q522
    type: truefalse
    concept: rights-holders-and-duty-bearers
    difficulty: 2
    set: quickfire
    statement: General Comment No 31 says the ICCPR can be treated as a substitute for domestic criminal and civil law.
    answer: false
    why: >-
      False — para 8 says the Covenant "cannot be viewed as a substitute for domestic criminal or civil law"; the state
