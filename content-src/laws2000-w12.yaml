  - slug: iccpr-art-4
    title: International Covenant on Civil and Political Rights 1966 art 4
    kind: treaty
    text: >-
      1. In time of public emergency which threatens the life of the nation and the existence of which is officially
      proclaimed, the States Parties to the present Covenant may take measures derogating from their obligations under
      the present Covenant to the extent strictly required by the exigencies of the situation, provided that such
      measures are not inconsistent with their other obligations under international law and do not involve
      discrimination solely on the ground of race, colour, sex, language, religion or social origin. 2. No derogation
      from articles 6, 7, 8 (paragraphs 1 and 2), 11, 15, 16 and 18 may be made under this provision.
    gloss: >-
      Derogation only in an officially proclaimed emergency threatening the life of the nation, strictly as required,
      and never from the art 4(2) rights.
