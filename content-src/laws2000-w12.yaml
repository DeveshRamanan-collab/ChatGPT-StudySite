  - key: q523
    type: truefalse
    concept: rights-holders-and-duty-bearers
    difficulty: 2
    statement: >-
      According to the ICJ (1980, para 37), international organisations, as subjects of international law, can be bound
      by obligations under general rules of international law.
    answer: true
    why: >-
      True — the Court said IOs are bound by obligations under general rules of international law, under their
      constitutions, or under international agreements to which they are parties.
  - key: q524
    type: truefalse
    concept: rights-holders-and-duty-bearers
    difficulty: 1
    statement: A horizontal human rights obligation is a duty owed by one state to another state.
    answer: false
    why: >-
      False — the slide defines a horizontal obligation as the state's duty to protect individuals from violations by
      other private actors (e.g. torture, housing discrimination).
  - key: q541
    type: short
    concept: rights-holders-and-duty-bearers
    difficulty: 3
    prompt: >-
      In State M, a private security company that guards a shopping centre routinely beats and detains suspected
      shoplifters for hours before calling police. M's police know of the practice and do nothing. A victim asks whether
      M has breached its obligations under the ICCPR. Advise.
    model: >-
      Issue: whether M is responsible under the ICCPR for abuse carried out by a private company rather than by its own

      agents.


      Law: states are the primary duty bearers. Vertical obligations are the state's duties toward individuals under its

      jurisdiction; horizontal obligations are its duty to protect individuals from violations by other private actors —
      the

      slides give torture as an example. Under General Comment No 31 (para 8), the Covenant is not a substitute for
      domestic

      criminal or civil law, but the positive obligations to ensure Covenant rights are "only fully discharged" if
      individuals

      are protected against state agents and also against acts of private persons or entities. The rights affected
      include

      the prohibition on torture (art 7) and liberty and security (art 9).


      Application: the guards are private actors, so this is not a vertical case of M's agents beating the victim. But
      M's

      police know of repeated beatings and detentions and do nothing. M has failed to protect people within its
      territory from

      private violations of arts 7 and 9 — a breach of its horizontal, positive obligation.


      Conclusion: M is likely in breach, not for the guards' acts as such, but for failing to protect.
    rubric:
      - id: r1
        criterion: "Issue: state responsibility for private abuse"
        marks: 1
        top-band: Frames the issue as M's own obligations where the harm is done by a private company.
        margin-note: The guards are not M — so what is M's own failure?
        authorities: []
      - id: r2
        criterion: "Law: duty bearers, vertical and horizontal obligations, GC 31"
        marks: 3
        top-band: >-
          States that states are primary duty bearers, defines vertical and horizontal obligations, and quotes or
          closely paraphrases GC 31 para 8 on protection against private persons.
        margin-note: Quote GC 31 — "only fully discharged" is the key phrase.
        authorities:
          - hrc-general-comment-31-para-8
          - iccpr-arts-6-13
      - id: r3
        criterion: "Application: horizontal breach on the facts"
        marks: 3
        top-band: >-
          Uses the police's knowledge and inaction to show a failure to protect against breaches of arts 7 and 9, and
          explains why this is not a vertical case.
        margin-note: Good use of the police's knowledge — link it to the positive duty.
        authorities: []
      - id: r4
        criterion: Conclusion
        marks: 1
        top-band: Concludes that M is likely in breach for its failure to protect, not for the guards' conduct as such.
        margin-note: Say whose breach it is — M's, by omission.
        authorities: []
  - key: q601
    type: mcq
    concept: scope-and-extraterritoriality
    difficulty: 1
    set: pretest
    stem: Under ICCPR art 2(1), as the lecture summarises it, whose rights must a state respect?
    options:
      - text: Only those of its own nationals, wherever they are
        why: >-
          Tempting because nationality is a ground of jurisdiction (Week 5), but art 2(1) looks to territory and
          jurisdiction, irrespective of nationality.
      - text: People within its territory or subject to its jurisdiction
        correct: true
        why: >-
          Correct — the slide: states must respect the rights of people within their territory and those subject to
          their jurisdiction (ICCPR art 2(1)).
      - text: Only those of people lawfully resident in its territory
        why: >-
          Tempting because lawful status matters in migration law, but the slide says protection applies irrespective of
          nationality or legal status.
      - text: Those of every person in the world, whatever the link to the state
        why: >-
          Tempting because rights are universal, but a state's Covenant duties are tied to its territory and
          jurisdiction, not owed to everyone everywhere.
  - key: q602
    type: mcq
    concept: scope-and-extraterritoriality
    difficulty: 1
    stem: >-
      Does a person's nationality or legal status affect whether a state must respect their ICCPR rights within its
      territory?
    options:
      - text: No — protection applies regardless of both
        correct: true
        why: >-
          Correct — the scope slide says states must respect the rights of people within their territory "irrespective
          of nationality or legal status".
      - text: Yes — only citizens are protected
        why: >-
          Tempting because some political rights are tied to citizenship, but the slide says protection applies
          irrespective of nationality.
      - text: Yes — only people lawfully present are protected
        why: >-
          Tempting because unlawful entrants face migration consequences, but the slide says protection applies
          irrespective of legal status.
      - text: Only for civil rights; economic rights need nationality
        why: Tempting because some states limit welfare to nationals, but the slide draws no such line.
  - key: q603
    type: mcq
    concept: scope-and-extraterritoriality
    difficulty: 2
    cases:
      - construction-of-a-wall-advisory-opinion
    stem: What did the ICJ say about jurisdiction in the Wall Advisory Opinion (2004, para 109)?
    options:
      - text: Jurisdiction is exclusively territorial, so the ICCPR stops at the border
        why: >-
          Wrong way round — the Court said jurisdiction is primarily, not exclusively, territorial and may be exercised
          outside the national territory.
      - text: Primarily territorial, but it may be exercised abroad — and the ICCPR still binds
        correct: true
        why: >-
          Correct — para 109: jurisdiction is primarily territorial but may sometimes be exercised outside the
          territory, and states parties should be bound to comply with the ICCPR even then.
      - text: A state has jurisdiction abroad only if the Security Council authorises it
        why: >-
          Tempting because the Council authorises some uses of force, but the Court tied extraterritorial jurisdiction
          to the ICCPR's object and purpose, not authorisation.
      - text: The ICCPR does not apply in occupied territory, where only humanitarian law applies
        why: >-
          Tempting because occupation is governed by IHL, but the Court held the ICCPR applies when a state exercises
          jurisdiction outside its territory.
  - key: q604
    type: mcq
    concept: scope-and-extraterritoriality
    difficulty: 3
    cases:
      - construction-of-a-wall-advisory-opinion
    variant-of: q603
    stem: >-
      On what basis did the ICJ in the Wall opinion conclude that the ICCPR binds states exercising jurisdiction outside
      their territory?
    options:
      - text: The text of art 2(1) expressly extends the Covenant worldwide
        why: >-
          Tempting because art 2(1) is the scope provision, but the Court relied on object and purpose and the drafters'
          intent.
      - text: "The ICCPR's object and purpose: its drafters did not intend an escape route"
        correct: true
        why: >-
          Correct — the Court reasoned from the Covenant's object and purpose: the drafters "did not intend to allow
          States to escape from their obligations" abroad.
      - text: Israel had consented to the Covenant applying in the territory
        why: >-
          Tempting because consent underpins treaty obligations, but the Court's reasoning on the slide rests on object
          and purpose, not specific consent.
      - text: Customary law alone, since treaties cannot apply outside a party's territory
        why: >-
          Tempting because custom can fill gaps, but the Court applied the ICCPR itself extraterritorially, reasoning
          from its object and purpose.
  - key: q605
    type: mcq
    concept: scope-and-extraterritoriality
    difficulty: 3
    cases:
      - armed-activities-on-the-territory-of-the-congo-democratic-republic-of-the-congo-v-uganda
    contrasts-with:
      - laws2000-w07-effective-control-and-private-conduct
    stem: >-
      In DRC v Uganda, why was Uganda's responsibility engaged for violations by rebel groups acting on their own
      account in Ituri?
    options:
      - text: The rebel groups were de facto organs of Uganda, acting in complete dependence on it
        why: >-
          Tempting because de facto organs come from Week 7's attribution rules, but the Court did not attribute the
          rebels' acts to Uganda; it faulted Uganda's lack of vigilance.
      - text: Uganda had effective control over each rebel operation in which violations occurred
        why: >-
          Tempting because effective control is the art 8 ARSIWA test, but the Court found responsibility for lack of
          vigilance, even for rebels acting on their own account.
      - text: Uganda's lack of vigilance as occupying Power
        correct: true
        why: >-
          Correct — para 179: as occupying Power, Uganda's responsibility was engaged for any lack of vigilance in
          preventing violations by other actors, including rebel groups acting on their own account.
      - text: Uganda later acknowledged and adopted the rebels' conduct as its own
        why: >-
          Tempting because adoption is an art 11 ARSIWA pathway, but the slide gives no adoption; the basis was Uganda's
          own failure of vigilance.
  - key: q606
    type: mcq
    concept: scope-and-extraterritoriality
    difficulty: 2
    cases:
      - armed-activities-on-the-territory-of-the-congo-democratic-republic-of-the-congo-v-uganda
    stem: What did the ICJ conclude in DRC v Uganda (para 216) about human rights instruments?
    options:
      - text: They apply to acts done in the exercise of jurisdiction abroad
        correct: true
        why: >-
          Correct — the Court concluded that human rights instruments are applicable "in respect of acts done by a State
          in the exercise of its jurisdiction outside its own territory", particularly in occupied territories.
      - text: They are displaced by international humanitarian law whenever there is an occupation
        why: >-
          Tempting because IHL governs occupation, but the Court applied human rights instruments as well — para 179
          refers to violations of human rights and IHL.
      - text: They apply abroad only where the victims are nationals of the acting state
        why: >-
          Tempting because nationality is a classic link, but the test is the exercise of jurisdiction, and nationality
          is irrelevant to protection.
      - text: They apply abroad only with the territorial state's consent
        why: >-
          Tempting because consent matters for presence on foreign soil, but the Court's test was the exercise of
          jurisdiction, especially by occupation.
  - key: q607
    type: mcq
    concept: scope-and-extraterritoriality
    difficulty: 2
