  - slug: achr-art-27
    title: American Convention on Human Rights art 27
    kind: treaty
    text: >-
      1. In time of war, public danger, or other emergency that threatens the independence or security of a State Party,
      it may take measures derogating from its obligations under the present Convention to the extent and for the period
      of time strictly required by the exigencies of the situation, provided that such measures are not inconsistent
      with its other obligations under international law and do not involve discrimination on the ground of race, color,
      sex, language, religion, or social origin. 2. The foregoing provision does not authorize any suspension of the
      following articles: Article 3 (Right to Juridical Personality), Article 4 (Right to Life), Article 5 (Right to
      Humane Treatment), Article 6 (Freedom from Slavery), Article 9 (Freedom from Ex Post Facto Laws), Article 12
      (Freedom of Conscience and Religion), etc. (as extracted on the Week 12 slides).
    gloss: >-
      The regional counterpart of ICCPR art 4: derogation in war or emergency, strictly as required, with a list of
      non-suspendable rights.
