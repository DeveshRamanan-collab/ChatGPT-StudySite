    stem: >-
      State A's soldiers occupy a district of neighbouring State B and detain local civilians without trial. A argues
      that the ICCPR binds it only on its own territory. Advise.
    options:
      - text: A is right — treaty obligations are territorial unless the treaty expressly says otherwise
        why: >-
          Tempting because jurisdiction is primarily territorial, but the Wall opinion and DRC v Uganda hold the ICCPR
          applies to jurisdiction exercised abroad.
      - text: "A is wrong: as occupier it exercises jurisdiction there"
        correct: true
        why: >-
          Correct — in occupied territory A exercises jurisdiction outside its own territory, so its ICCPR obligations
          apply (Wall, para 109; DRC v Uganda, para 216).
      - text: A is bound, but only toward any of its own nationals among the detainees
        why: >-
          Tempting because nationality links a state to people abroad, but protection applies irrespective of
          nationality; the test is jurisdiction.
      - text: A is bound only if State B consents to the Covenant applying there
        why: >-
          Tempting because B is the territorial sovereign, but the cases turn on A's exercise of jurisdiction, not B's
