  - key: q341
    type: short
    concept: core-instruments-and-sources-of-obligation
    difficulty: 3
    prompt: >-
      State Q has ratified the ICCPR but has never ratified the Convention against Torture. Q's security service
      tortures a terrorism suspect during interrogation. Q argues that it owes no obligation not to torture because it
      is not a party to CAT. Advise.
    model: >-
      Issue: whether Q is bound not to torture although it has not ratified the Convention against Torture.


      Law: human rights obligations come from treaty law and from customary international law. The lecture gives torture

      as an example of a customary human rights norm and notes that some such norms are considered jus cogens — norms
      from

      which no derogation is permitted (VCLT art 53). Q is also a party to the ICCPR, whose art 7 prohibits torture, and
      art

      7 is one of the rights from which no derogation may be made even in an emergency (art 4(2)).


      Application: not ratifying CAT means only that CAT's own obligations and its Committee's procedures do not apply
      to Q.

      Q remains bound by ICCPR art 7 as a treaty party. It is also bound by the customary prohibition of torture
      whatever

      its treaty commitments, and because that prohibition is considered jus cogens, Q cannot contract out of it or
      derogate

      from it. The security service is part of the state, so its conduct is Q's own.


      Conclusion: Q's argument fails. The torture breaches ICCPR art 7 and the customary, peremptory prohibition of

      torture.
    rubric:
      - id: r1
        criterion: "Issue: whether a non-party to CAT can be bound not to torture"
        marks: 1
        top-band: "States the issue precisely: is Q bound by a prohibition of torture from a source other than CAT?"
        margin-note: Good — the real question is "from which other source?", not "is torture bad?".
        authorities: []
      - id: r2
        criterion: "Law: the sources of human rights obligations, with authority"
        marks: 3
        top-band: >-
          Names treaty law (ICCPR art 7, non-derogable under art 4(2)) and customary law (torture as the lecture's
          example), and defines jus cogens (VCLT art 53).
        margin-note: You have custom — now say why jus cogens status matters for Q.
        authorities:
          - iccpr-arts-6-13
          - iccpr-art-4
          - vclt-art-53
      - id: r3
        criterion: "Application: each source applied to Q's facts"
        marks: 3
        top-band: >-
          Explains that non-ratification of CAT removes only CAT's own obligations; Q is bound by ICCPR art 7 and by
          custom, and cannot derogate from a peremptory norm.
        margin-note: "Apply it: what does non-ratification of CAT actually remove?"
        authorities: []
      - id: r4
        criterion: Conclusion
        marks: 1
        top-band: Concludes clearly that Q's argument fails and identifies the obligations breached.
        margin-note: Land it — which obligations has Q breached?
        authorities: []
  - key: q401
    type: mcq
    concept: generations-and-principles-of-rights
