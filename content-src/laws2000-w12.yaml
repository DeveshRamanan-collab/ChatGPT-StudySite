cards:
  - type: basic
    concept: history-and-foundations-of-human-rights
    front: Name the four early instruments the lecture lists in the history of human rights, with dates.
    back: >-
      Magna Carta (1215); English Bill of Rights (1689); French Declaration of the Rights of Man and of the Citizen
      (1789); US Constitution (1789) and US Bill of Rights (1791).
    source: Week 12 Lecture Slides (International Human Rights Law), slide 3
  - type: basic
    concept: history-and-foundations-of-human-rights
    front: "Locke v Kant: what does the lecture take from each?"
    back: >-
      Locke (Two Treatises, 1689): people are by nature free and equal, with rights to life, liberty and property
      independent of any society's laws. Kant (Groundwork, 1785): inherent dignity — treat people "as an end", "never
      merely as a means".
    source: Week 12 Lecture Slides (International Human Rights Law), slide 4
  - type: cloze
    concept: history-and-foundations-of-human-rights
    text: >-
      The beginning of international human rights was {{c1::issue-specific}}: abolition of slavery (Britain in
      {{c2::1807}}, then the {{c3::1926}} Slavery Convention) and limited women's rights.
    source: Week 12 Lecture Slides (International Human Rights Law), slide 5
  - type: cloze
    concept: history-and-foundations-of-human-rights
    text: >-
      UN Charter art 1(3): a Purpose of the UN is promoting respect for human rights "for all without distinction as to
      {{c1::race, sex, language, or religion}}".
    source: Week 12 Lecture Slides (International Human Rights Law), slide 6
  - type: basic
    concept: history-and-foundations-of-human-rights
    front: What do UN Charter arts 55(c) and 56 add?
    back: >-
      Art 55(c): the UN shall promote universal respect for, and observance of, human rights and fundamental freedoms
      for all. Art 56: all Members pledge joint and separate action, in co-operation with the UN, to achieve art 55's
      purposes.
    source: Week 12 Lecture Slides (International Human Rights Law), slide 6
  - type: cloze
    concept: international-bill-of-rights
    text: >-
      The International Bill of Rights = the {{c1::UDHR}} (10 Dec 1948) + the {{c2::ICCPR}} + the {{c3::ICESCR}} (both
      16 Dec 1966).
    source: Week 12 Lecture Slides (International Human Rights Law), slide 7
  - type: basic
    concept: international-bill-of-rights
    front: What change to the UDHR is Hansa Mehta credited with?
    back: Changing "All men are born free and equal" to "All human beings are born free and equal" in art 1.
    source: Week 12 Lecture Slides (International Human Rights Law), slide 8
  - type: basic
    concept: international-bill-of-rights
    front: "Same number, different right: what are ICCPR and ICESCR arts 6, 8 and 11?"
    back: >-
      Art 6: ICCPR life / ICESCR work. Art 8: ICCPR slavery / ICESCR trade unions. Art 11: ICCPR no imprisonment for
      breach of contract / ICESCR adequate food, clothing and housing.
    source: Week 12 Lecture Slides (International Human Rights Law), slide 9
  - type: cloze
    concept: international-bill-of-rights
    text: ICESCR art 12 protects the right to the "{{c1::highest attainable standard}} of physical and mental health".
    source: Week 12 Lecture Slides (International Human Rights Law), slide 9
  - type: basic
    concept: core-instruments-and-sources-of-obligation
    front: List the nine core international human rights instruments in date order.
    back: >-
      ICERD 1965; ICCPR and ICESCR 1966; CEDAW 1979; CAT 1984; CRC 1989; Migrant Workers 1990; Disabilities (13 Dec) and
      Enforced Disappearance (20 Dec) 2006.
    source: Week 12 Lecture Slides (International Human Rights Law), slide 10
  - type: basic
    concept: core-instruments-and-sources-of-obligation
    front: What are the two sources of human rights obligations on the slides?
    back: >-
      Treaty law (the core instruments, the European Convention and the American Convention) and customary international
      law (e.g. torture, genocide, racial discrimination) — some of which is considered jus cogens.
    source: Week 12 Lecture Slides (International Human Rights Law), slide 11
  - type: apply
    concept: core-instruments-and-sources-of-obligation
    scenario: State X never ratified CAT. Its police torture a detainee and X says it has no obligation.
    answer: >-
      X is bound anyway: the prohibition of torture is customary international law, and considered jus cogens (no
      derogation permitted).
    source: Week 12 Lecture Slides (International Human Rights Law), slide 11
  - type: basic
    concept: generations-and-principles-of-rights
    front: Name the three generations of rights, with an example of each.
    back: >-
      First: civil and political (e.g. life, fair trial). Second: economic, social and cultural (e.g. education,
      health). Third: collective (e.g. self-determination; potentially development, healthy environment).
    source: Week 12 Lecture Slides (International Human Rights Law), slide 12
  - type: basic
    concept: generations-and-principles-of-rights
    front: Give two arguments from each side of the universality debate.
    back: >-
      Relativists: societies have different values; universal rights are cultural imperialism (IHRL is ethnocentric);
      rights must be read in context. Universalists: life and freedom from torture cannot depend on culture; relativism
      masks oppression of women and minorities; culture changes.
    source: Week 12 Lecture Slides (International Human Rights Law), slide 13
  - type: cloze
    concept: generations-and-principles-of-rights
    text: >-
      Indivisibility: all human rights have {{c1::equal status}} and cannot be positioned in a {{c2::hierarchical
      order}}.
    source: Week 12 Lecture Slides (International Human Rights Law), slide 14
  - type: apply
    concept: generations-and-principles-of-rights
    scenario: A government says education can wait until "first generation" civil rights are secured.
    answer: >-
      Indivisibility answers it: generations are categories, not ranks; denial of one right impedes the enjoyment of
      others.
    source: Week 12 Lecture Slides (International Human Rights Law), slide 14
  - type: basic
    concept: rights-holders-and-duty-bearers
    front: Vertical v horizontal obligations?
    back: >-
      Vertical: the state's duties toward individuals under its jurisdiction. Horizontal: the state's duty to protect
      individuals from violations by private actors (e.g. torture, non-discrimination in housing).
    source: Week 12 Lecture Slides (International Human Rights Law), slide 15
  - type: cloze
    concept: rights-holders-and-duty-bearers
    text: >-
      GC 31 para 8: positive obligations are only fully discharged if individuals are protected against the State's
      {{c1::agents}} and also against acts of {{c2::private persons or entities}}.
    source: Week 12 Lecture Slides (International Human Rights Law), slide 15
  - type: basic
    concept: rights-holders-and-duty-bearers
    front: Can international organisations be human rights duty bearers? Authority?
    back: >-
      Yes (e.g. peacekeeping). WHO–Egypt Agreement Advisory Opinion (ICJ, 1980, para 37): IOs are bound by general
      international law, their constitutions and their agreements.
    source: Week 12 Lecture Slides (International Human Rights Law), slide 16
  - type: apply
    concept: rights-holders-and-duty-bearers
    scenario: Private landlords refuse to rent to an ethnic minority; State R has no law against it.
    answer: >-
      Horizontal obligation: R must protect against private discrimination in housing; failing to do so can breach its
      ICCPR duties (GC 31 para 8).
    source: Week 12 Lecture Slides (International Human Rights Law), slide 15
  - type: cloze
    concept: scope-and-extraterritoriality
    text: >-
      ICCPR art 2(1): states must respect the rights of people within their {{c1::territory}} and those subject to their
      {{c2::jurisdiction}}, irrespective of nationality or legal status.
    source: Week 12 Lecture Slides (International Human Rights Law), slide 17
  - type: basic
    concept: scope-and-extraterritoriality
    front: What did the Wall opinion (2004, para 109) decide about the ICCPR abroad?
    back: >-
      Jurisdiction is primarily territorial but may be exercised outside the territory; given the Covenant's object and
      purpose, states remain bound then — the drafters did not intend an escape from obligations.
    source: Week 12 Lecture Slides (International Human Rights Law), slide 17
  - type: basic
    concept: scope-and-extraterritoriality
    front: "DRC v Uganda (2005): what two things engaged Uganda's responsibility in Ituri?"
    back: >-
      As occupying Power: acts of its military violating its obligations, and any lack of vigilance in preventing
      violations by other actors, including rebel groups acting on their own account (para 179).
    source: Week 12 Lecture Slides (International Human Rights Law), slide 18
  - type: apply
    concept: scope-and-extraterritoriality
    scenario: State A occupies part of State B and detains locals without trial, arguing the ICCPR stops at its border.
    answer: "Wrong: as occupier A exercises jurisdiction abroad, so the ICCPR applies (Wall para 109; DRC v Uganda para 216)."
    source: Week 12 Lecture Slides (International Human Rights Law), slide 18
  - type: cloze
    concept: derogations-and-limitations
    text: >-
      ICCPR art 4(1): derogation only in a public emergency which threatens the {{c1::life of the nation}} and is
      {{c2::officially proclaimed}}, to the extent {{c3::strictly required}}.
    source: Week 12 Lecture Slides (International Human Rights Law), slide 19
  - type: basic
    concept: derogations-and-limitations
    front: Which ICCPR rights are non-derogable under art 4(2)?
    back: Arts 6, 7, 8(1) and (2), 11, 15, 16 and 18.
    source: Week 12 Lecture Slides (International Human Rights Law), slide 19
  - type: basic
    concept: derogations-and-limitations
    front: The four substantive requirements for a derogation?
    back: >-
      (1) Necessity and proportionality (nature, duration, impact); (2) consistency with other international
      obligations, especially jus cogens; (3) no effect on absolute or non-derogable rights; (4) notification.
    source: Week 12 Lecture Slides (International Human Rights Law), slide 20
  - type: apply
    concept: derogations-and-limitations
    scenario: A suspect is held for fourteen days without judicial intervention during a terrorism emergency.
    answer: >-
      Aksoy v Turkey: not necessary — the period was exceptionally long and no detailed reasons showed judicial
      intervention was impracticable.
    source: Week 12 Lecture Slides (International Human Rights Law), slide 20
  - type: basic
    concept: derogations-and-limitations
    front: Conditions for restricting a right outside an emergency?
    back: >-
      Provided by law; a legitimate aim described in the limitation clause; necessary in a democratic society (public
      need, proportionate, legitimate aim).
    source: Week 12 Lecture Slides (International Human Rights Law), slide 21
  - type: basic
    concept: international-human-rights-machinery
    front: "Human Rights Council: origin, membership, working methods?"
    back: >-
      Replaced the UN Commission on Human Rights in 2006 (UNGA res 60/251); 47 states elected by the UNGA for 3-year
      terms (max 2 consecutive); regular and special sessions, the UPR and special procedures.
    source: Week 12 Lecture Slides (International Human Rights Law), slide 23
  - type: cloze
    concept: international-human-rights-machinery
    text: >-
      UPR: each member state is reviewed every {{c1::4.5 years}}; a {{c2::47}}-member working group issues an outcome
      report, and states {{c3::accept or note}} the recommendations.
    source: Week 12 Lecture Slides (International Human Rights Law), slide 24
  - type: basic
    concept: international-human-rights-machinery
    front: What legal weight do treaty body decisions carry? Authority?
    back: >-
      Not binding but significant weight: in Diallo (ICJ, 2010, para 66) the Court is "in no way obliged" to follow the
      Human Rights Committee but should "ascribe great weight" to its interpretation.
    source: Week 12 Lecture Slides (International Human Rights Law), slide 29
  - type: basic
    concept: international-human-rights-machinery
    front: Four functions of the treaty bodies?
    back: >-
      State reporting (concluding observations); individual complaints (written, confidential, "views"); inter-state
      complaints (only three ever, all ICERD); general comments (authoritative interpretations).
    source: Week 12 Lecture Slides (International Human Rights Law), slide 28
audio:
  title: Week 12 recap — international human rights law
  minutes: 3
  script: >-
    Human rights started as domestic texts — Magna Carta, the English Bill of Rights, the 1789 declarations in France
    and

    the United States — and as Enlightenment ideas: Locke's natural freedom and equality, with rights to life, liberty
    and

    property that don't depend on any society's laws, and Kant's dignity, treating people as ends and never merely as

    means. International protection began issue by issue, with slavery and limited women's rights, and after the Second

    World War the UN Charter made human rights one of the UN's purposes, in articles 1(3), 55 and 56.


    The International Bill of Rights is the Universal Declaration of 1948 plus the two Covenants of 1966, the ICCPR and
    the

    ICESCR. Watch the numbering: article 6 is life in one and work in the other, article 11 is contract debts in one and

    food, clothing and housing in the other. Around them sit nine core treaties, from the racial discrimination
    convention

    in 1965 to the disability and enforced disappearance conventions in 2006. Obligations come from treaties and from

    custom — torture, genocide, racial discrimination — and some of these are jus cogens.


    There are three generations of rights: civil and political, economic social and cultural, and collective rights like

    self-determination. They are categories, not ranks, because rights are indivisible and interdependent. Universality

    says rights apply to everyone; relativists call that cultural imperialism, and universalists answer that relativism

    often masks oppression and that culture changes.


    States are the main duty bearers. Vertically they must respect rights themselves; horizontally they must protect
    people

    from private actors, as General Comment 31 explains. International organisations can be bound too. Obligations
    follow

    territory and jurisdiction, whatever the victim's nationality, and they travel abroad — the Wall opinion, and Uganda
    as

    occupying power in Ituri, answering for its own soldiers and for failing to watch the rebels.


    In an emergency, article 4 allows derogation only if the emergency threatens the life of the nation and is
    proclaimed,

    only as far as strictly required, without discrimination, and never from articles like 6 and 7. Aksoy shows fourteen

    days without a judge going too far. Outside emergencies, limits need law, a legitimate aim and democratic necessity.


    Finally the machinery: the Human Rights Council, its Universal Periodic Review and special procedures, and the
    treaty

    committees with their reports, complaints and general comments. Their views aren't binding, but, as Diallo says,
    they

    deserve great weight.
