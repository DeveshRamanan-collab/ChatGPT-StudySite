      - text: Art 2(1) recognises only the territorial ground; Week 5 adds nationality and universality
        why: >-
          Tempting because jurisdiction is primarily territorial, but the Wall and DRC v Uganda show art 2(1) reaches
          jurisdiction exercised abroad.
  - key: q613
    type: mcq
    concept: scope-and-extraterritoriality
    difficulty: 2
