    body: >-
      Right bearers are the individual and groups (collective rights). Duty bearers are primarily states.


      - **Vertical obligations:** the state's duties toward individuals under its jurisdiction.

      - **Horizontal obligations:** the state's duty to protect individuals from violations by other private actors —
      e.g.
        torture, non-discrimination in housing.

      The Human Rights Committee's General Comment No 31 (para 8) explains the horizontal duty: the Covenant "cannot be
      viewed

      as a substitute for domestic criminal or civil law", but the positive obligations on states parties to ensure
      Covenant

      rights "will only be fully discharged if individuals are protected by the State, not just against violations of

      Covenant rights by its agents, but also against acts committed by private persons or entities".


      International organisations can also be duty bearers (e.g. in peacekeeping). In *Interpretation of the Agreement
      of

      25 March 1951 between the WHO and Egypt* (Advisory Opinion, ICJ, 1980, para 37): "International organizations are

      subjects of international law and, as such, are bound by any obligations incumbent upon them under general rules
      of

      international law, under their constitutions or under international agreements to which they are parties".


      Exam use: where a private actor causes the harm, frame the state's breach as a failure of its positive obligation
      to

      protect (GC 31, para 8), not as the private actor breaching the treaty.
  - slug: scope-and-extraterritoriality
    title: Scope of human rights obligations — territory, jurisdiction and extraterritoriality
    visual: simulation
    visual-brief: >-
      Three switches — where the conduct happens (inside or outside the state's territory), whether the state exercises
      jurisdiction there (occupation, or none), and the victim's nationality or legal status — feed a lamp marked
      "Covenant obligations apply"; the nationality switch is wired to nothing, and an occupation setting adds a
      vigilance duty over rebel groups (DRC v Uganda).
    related:
      - rights-holders-and-duty-bearers
      - laws2000-w07-effective-control-and-private-conduct
    depends-on:
      - rights-holders-and-duty-bearers
      - laws2000-w05-grounds-of-jurisdiction
    contrasts-with:
      - laws2000-w05-grounds-of-jurisdiction
      - laws2000-w07-effective-control-and-private-conduct
    cases:
      - construction-of-a-wall-advisory-opinion
      - armed-activities-on-the-territory-of-the-congo-democratic-republic-of-the-congo-v-uganda
      - sergio-euben-lopez-burgos-v-uruguay
    authorities:
      - iccpr-art-2-1
    verify: false
    body: >-
      States must respect the rights of people within their territory and those subject to their jurisdiction

      (ICCPR art 2(1)), irrespective of nationality or legal status.


      Obligations can also apply outside the state's territory. In the *Wall* Advisory Opinion (ICJ, 2004, para 109) the

      Court said that while the jurisdiction of states is primarily territorial, it may sometimes be exercised outside
      the

      national territory; given the ICCPR's object and purpose, states parties should be bound to comply with it even
      then —

      the drafters "did not intend to allow States to escape from their obligations when they exercise jurisdiction
      outside

      their national territory".


      In *Armed Activities on the Territory of the Congo (DRC v Uganda)* (ICJ, 2005), Uganda was an occupying Power in
      Ituri.

      Its responsibility was engaged both for acts of its military that violated its obligations and for any lack of

      vigilance in preventing violations by other actors in the occupied territory, including rebel groups acting on
      their own

      account (para 179). Human rights instruments apply "in respect of acts done by a State in the exercise of its

      jurisdiction outside its own territory", particularly in occupied territories (para 216).


      The slides add that obligations may apply even sometimes when the state has no effective control, citing the Human

      Rights Committee in *Lopez Burgos v Uruguay* (para 12.3).


      Exam use: ask whether the victim was within the state's territory or subject to its jurisdiction — nationality and

      place of conduct are not decisive.
  - slug: derogations-and-limitations
    title: Derogations in emergencies and limitations outside them
    visual: simulation
    visual-brief: >-
      A panel with a master switch "public emergency threatening the life of the nation, officially proclaimed", a
      measure slider (strictly required — nature, duration, impact), toggles for consistency with other obligations and
      jus cogens, non-discrimination and notification, and a right selector; the verdict reads "valid derogation" only
      when every condition holds and the right is not in art 4(2). With the master switch off the panel becomes the
      limitation test (law, legitimate aim, necessary in a democratic society).
    related:
      - generations-and-principles-of-rights
      - core-instruments-and-sources-of-obligation
    depends-on:
      - international-bill-of-rights
      - laws2000-w02-sources-beyond-article-38
    contrasts-with:
      - generations-and-principles-of-rights
    cases:
      - aksoy-v-turkey
    authorities:
      - iccpr-art-4
      - achr-art-27
      - vclt-art-53
    verify: false
    body: >-
      **Derogation in an emergency.** ICCPR art 4(1): in a public emergency which threatens the life of the nation

      and is officially proclaimed, a state may derogate "to the extent strictly required by the exigencies of the

      situation", if the measures are consistent with its other international obligations and do not discriminate solely
      on

      the ground of race, colour, sex, language, religion or social origin. Art 4(2): no derogation from arts 6, 7, 8(1)
      and

      (2), 11, 15, 16 and 18. ACHR art 27 is similar (war, public danger or other emergency threatening a state's

      independence or security) and lists non-suspendable rights such as life, humane treatment and freedom from
      slavery.


      Four substantive requirements:


      1. Necessity and proportionality (nature, duration, impact). In *Aksoy v Turkey* (ECtHR, para 78), holding a
      suspect
         for fourteen days without judicial intervention was "exceptionally long" and not necessary.
      2. Consistency with the state's other obligations under international law, especially jus cogens.

      3. No effect on absolute or non-derogable rights.

      4. Notification.


      **Restrictions outside an emergency** must be provided by law; serve a legitimate aim described in the limitation

      clause (e.g. protection of rights and freedoms); and be necessary in a democratic society — responding to a public

      need, proportionate, with a legitimate aim.


      Exam use: first decide whether the state is derogating in an emergency (art 4) or limiting a right in normal
      times,

      then test each condition in turn.
  - slug: international-human-rights-machinery
    title: International human rights machinery — Charter-based and treaty-based mechanisms
    visual: diagram
    visual-brief: >-
      Two pillars — Charter-based (Human Rights Council: sessions, Universal Periodic Review, special procedures) and
      treaty-based (a committee wired to each core treaty: reporting, individual complaints, inter-state complaints,
      general comments) — with a weight gauge under the treaty pillar reading "not binding, great weight" (Diallo).
    related:
      - core-instruments-and-sources-of-obligation
      - laws2000-w04-emerging-actors-beyond-the-state
    depends-on:
      - core-instruments-and-sources-of-obligation
      - laws2000-w02-judicial-decisions-and-scholarly-writings
    contrasts-with: []
    cases:
      - ahmadou-sadio-diallo-republic-of-guinea-v-democratic-republic-of-the-congo
    authorities:
      - unga-resolution-60-251
    verify: false
    body: >-
      **Charter-based.** The Human Rights Council replaced the UN Commission on Human Rights in 2006 (UNGA resolution

      60/251). It has 47 member states elected by the General Assembly for three-year terms (maximum two consecutive),
      with

      regional distribution, and works through regular and special sessions, the Universal Periodic Review and the
      special

      procedures.


      - **Universal Periodic Review:** every member state is reviewed every 4.5 years. States (and NGOs) submit reports;
      a
        47-member working group reviews them and issues an outcome report with recommendations, which the state accepts or
        notes. Australia (January 2021) received 344 recommendations and supported 177.
      - **Special procedures:** independent experts — special rapporteurs, independent experts, working groups — with 46
        thematic and 14 country mandates. They visit countries (with state consent), receive individual complaints and
        issue reports.

      **Treaty-based.** Each core treaty has a committee, e.g. the Human Rights Committee for the ICCPR. Committees
      consider

      state reports (then concluding observations), decide individual complaints (written, confidential, modelled on
      judicial

      practice, ending in "views"), may hear inter-state complaints (extremely rare: three ever, all under ICERD) and
      issue

      general comments, considered authoritative.


      **Legal nature.** Treaty body decisions are not binding but carry significant weight. In *Diallo* (ICJ, 2010, para
      66)

      the Court was "in no way obliged" to follow the Committee's interpretation of the ICCPR but ascribed "great
      weight" to

      it.


      Exam use: name the mechanism, then state the weight of its output.
cases:
  - slug: sergio-euben-lopez-burgos-v-uruguay
    name: Sergio Euben Lopez Burgos v Uruguay
    citation: Human Rights Committee, Communication No R.12/52 (6 June 1979), UN Doc Supp No 40 (A/36/40) at 176 (1981)
    aglc: >-
      Sergio Euben Lopez Burgos v Uruguay, Human Rights Committee, Communication No R.12/52 (6 June 1979), UN Doc Supp
      No 40 (A/36/40) at 176 (1981)
    facts: >-
      The Week 12 slides cite the Human Rights Committee's views only for the proposition below (para 12.3); the facts
      of the communication are not given in the materials.
    issue: Whether a state's obligations under the ICCPR can extend to conduct outside its territory.
    held: >-
      Cited on the slides (para 12.3) for the point that human rights obligations may apply extraterritorially "even
      sometimes when the state has no effective control".
    ratio: >-
      As used in the lecture: a state's Covenant obligations are not confined to its territory, and may apply even where
      it lacks effective control.
    significance: >-
      Extends the extraterritoriality reasoning beyond occupation (the Wall opinion, DRC v Uganda). The Committee's
      reasoning is not extracted in the materials, so check the views before relying on more than the slide's
      proposition.
    why-here: Cited for extraterritorial obligations even without effective control.
    verify: true
  - slug: aksoy-v-turkey
    name: Aksoy v Turkey
    citation: (Application No. 21987/93) (ECtHR, 20 March 2018)
    aglc: Aksoy v Turkey (European Court of Human Rights, Application No 21987/93, 20 March 2018)
    facts: >-
      As extracted on the slides: in the course of investigating terrorist offences in South-East Turkey, the
      authorities held the applicant, a suspect, for fourteen days without judicial intervention.
    issue: >-
      Whether holding a suspect for fourteen days without judicial intervention was strictly required by the emergency,
      so as to be a necessary and proportionate derogating measure.
    held: >-
      "Although the Court is of the view … that the investigation of terrorist offences undoubtedly presents the
      authorities with special problems, it cannot accept that it is necessary to hold a suspect for fourteen days
      without judicial intervention. This period is exceptionally long and left the applicant vulnerable not only to
      arbitrary interference with his right to liberty but also to torture … Moreover, the Government have not adduced
      any detailed reasons before the Court as to why the fight against terrorism in South-East Turkey rendered judicial
      intervention impracticable" (para 78).
    ratio: >-
      A derogating measure must be necessary and proportionate to the emergency; an exceptionally long period without
      judicial safeguards is not justified unless the state gives detailed reasons why those safeguards were
      impracticable.
    significance: >-
      The slides' example of the first substantive requirement for a valid derogation — necessity and proportionality
      (nature, duration, impact). The date on the slide (20 March 2018) should be checked against the judgment.
    why-here: Shows the necessity and proportionality requirement for derogations being applied and failed.
    verify: true
  - slug: interpretation-of-the-agreement-of-25-march-1951-between-the-who-and-egypt
    name: Interpretation of the Agreement of 25 March 1951 between the WHO and Egypt
    citation: Advisory Opinion, 1980, ICJ
    aglc: Interpretation of the Agreement of 25 March 1951 between the WHO and Egypt (Advisory Opinion) [1980] ICJ Rep
    facts: >-
      An advisory opinion of the ICJ; the Week 12 slides extract only paragraph 37, on the obligations of international
      organisations.
    issue: Whether, and from which sources, international organisations are bound by international obligations.
    held: >-
      "International organizations are subjects of international law and, as such, are bound by any obligations
      incumbent upon them under general rules of international law, under their constitutions or under international
      agreements to which they are parties…" (para 37).
    ratio: >-
      International organisations, as subjects of international law, are bound by general international law, their
      constitutions and the agreements they are party to.
    significance: >-
      Used on the slides to show that international organisations (e.g. in peacekeeping) can be human rights duty
      bearers. The Week 12 slide prints "WTO and Egypt"; the 1951 agreement was with the World Health Organization
      (WHO).
    why-here: Shows international organisations can owe human rights obligations alongside states.
    verify: true
  - slug: ahmadou-sadio-diallo-republic-of-guinea-v-democratic-republic-of-the-congo
    name: Ahmadou Sadio Diallo (Republic of Guinea v Democratic Republic of the Congo)
    citation: Merits, Judgment, ICJ, 2010
    aglc: Ahmadou Sadio Diallo (Republic of Guinea v Democratic Republic of the Congo) (Merits) [2010] ICJ Rep
    facts: >-
      Proceedings before the ICJ in which the Court interpreted the ICCPR; the Week 12 slides extract only its statement
      on the weight of the Human Rights Committee's interpretation (para 66).
    issue: What weight the ICJ should give to the Human Rights Committee's interpretation of the ICCPR.
    held: >-
      "Although the Court is in no way obliged, in the exercise of its judicial functions, to model its own
      interpretation of the Covenant on that of the Committee, it believes that it should ascribe great weight to the
      interpretation adopted by this independent body that was established specifically to supervise the application of
      that treaty. The point here is to achieve the necessary clarity and the essential consistency of international
      law, as well as legal security…" (para 66).
    ratio: >-
      Treaty body interpretations do not bind the ICJ, but deserve great weight because the body was established
      specifically to supervise the treaty, and for the clarity and consistency of international law.
    significance: >-
      The slides' authority that treaty body decisions are not binding but carry significant weight; see also
      Application of the International Convention on the Elimination of All Forms of Racial Discrimination (Qatar v
      United Arab Emirates) (Preliminary Objections), ICJ, 2021, para 101.
    why-here: The authority for the legal weight of Human Rights Committee views and interpretations.
    verify: false
