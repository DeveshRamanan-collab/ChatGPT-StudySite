    options:
      - text: Yes — a person unlawfully present has no Covenant rights
        why: >-
          Tempting because unlawful presence has legal consequences, but the scope slide says protection applies
          irrespective of legal status.
      - text: Yes — tourists are protected by their own state's obligations
        why: >-
          Tempting because the tourist's state could raise the matter, but C owes the duties because the tourist is
          within its territory.
      - text: No — C owes Covenant rights to everyone in its territory
        correct: true
        why: >-
          Correct — under art 2(1) states must respect the rights of people within their territory, irrespective of
          nationality or legal status.
      - text: No — but only because the detention lasted more than fourteen days
        why: >-
          Tempting because fourteen days features in Aksoy, but that concerns derogation; the tourist is protected
          because of presence in C's territory.
  - key: q612
    type: mcq
    concept: scope-and-extraterritoriality
