      - text: Outside the generations, in the relativism debate
        why: >-
          Tempting because "culture" is central to that debate, but the debate is about universality; cultural rights
          themselves are listed as second generation.
  - key: q406
    type: mcq
    concept: generations-and-principles-of-rights
    difficulty: 2
    variant-of: q401
    stem: Political participation rights belong to which generation, according to the slides?
    options:
      - text: Second — they depend on economic and social conditions
        why: >-
          Tempting because participation can depend on resources, but the slides list political participation rights
          among first-generation civil and political rights.
      - text: Third — they are exercised collectively
        why: >-
          Tempting because voting and assembly involve others, but the slides list political participation as a
          first-generation right, not a collective one.
      - text: First — civil and political rights
        correct: true
        why: >-
          Correct — the slides list political participation rights alongside life, freedom from torture, expression and
          fair trial in the first generation.
  - key: q407
    type: mcq
    concept: generations-and-principles-of-rights
    difficulty: 1
    contrasts-with:
      - laws2000-w05-grounds-of-jurisdiction
    stem: What does "universality" mean in the lecture?
    options:
      - text: Rights apply to all humans everywhere
        correct: true
        why: "Correct — the slide defines it: \"Universality = Rights apply to all humans everywhere\"."
      - text: Every state has ratified every core human rights treaty
        why: >-
          Tempting because universal ratification is an aim, but the principle is about who holds rights, not about
          which treaties states have joined.
      - text: Any state may prosecute serious crimes wherever they occurred
        why: >-
          Tempting because that is the universality principle of jurisdiction from Week 5, but here universality means
          rights apply to all humans everywhere.
      - text: Every culture already recognises the same rights in the same form
        why: >-
          Tempting because it sounds like universalism, but the principle claims rights apply to everyone, not that
          every culture already agrees on them.
  - key: q408
    type: mcq
    concept: generations-and-principles-of-rights
    difficulty: 2
    stem: Which argument belongs to the cultural relativist side of the debate?
    options:
      - text: Culture isn't static — it changes and evolves
        why: >-
          Tempting because it mentions culture, but it is a universalist reply: because cultures change, a practice's
          tradition does not shield it from universal standards.
      - text: Universal rights represent cultural imperialism
        correct: true
        why: >-
          Correct — the slides list this among the cultural relativist arguments: universal rights represent cultural
          imperialism, so IHRL is ethnocentric.
      - text: Cultural relativism often masks oppression of women and minorities
        why: >-
          Tempting because it discusses relativism, but it is a universalist criticism of relativism, not a relativist
          argument.
      - text: Basic rights like life and freedom from torture cannot depend on culture
        why: Tempting because it is about culture and rights, but it is the universalists' core claim, opposing relativism.
  - key: q409
    type: mcq
    concept: generations-and-principles-of-rights
    difficulty: 2
    variant-of: q408
    stem: Which argument belongs to the universalist side of the debate?
    options:
      - text: Rights must be understood in their context
        why: >-
          Tempting because context matters in any legal analysis, but the slides list this as a cultural relativist
          argument.
      - text: International human rights law is ethnocentric
        why: >-
          Tempting because it is a claim about IHRL, but it is the relativist charge that universal rights represent
          cultural imperialism.
      - text: Relativism often masks oppression of women and minorities
        correct: true
        why: >-
          Correct — the slides list this as a universalist argument, alongside the claims that basic rights cannot
          depend on culture and that culture is not static.
      - text: Different societies have different values and conceptions of rights
        why: Tempting because it is descriptively plausible, but it is the opening relativist argument on the slide.
  - key: q410
    type: mcq
    concept: generations-and-principles-of-rights
    difficulty: 3
    variant-of: q409
    stem: >-
      A delegate defends a practice by saying "our culture has always done this". Which universalist point from the
      lecture answers that claim most directly?
    options:
      - text: Rights must be understood in context
        why: Wrong side — this is a relativist argument and would support the delegate rather than answer them.
      - text: Culture isn't static — it changes and evolves
        correct: true
        why: >-
          Correct — the universalist reply that culture changes and evolves directly answers "always done this": a
          tradition's age does not fix what the culture must be.
      - text: Different societies have different values and conceptions of rights
        why: Wrong side — this is the relativists' starting point and supports the delegate's claim.
      - text: Universal rights represent cultural imperialism
        why: Wrong side — this relativist charge would back the delegate, not answer them.
  - key: q411
    type: mcq
    concept: generations-and-principles-of-rights
    difficulty: 2
    stem: What does the principle of indivisibility mean?
    options:
      - text: Civil and political rights take priority over economic, social and cultural rights
        why: >-
          Tempting because first-generation rights are often treated as core, but indivisibility denies any hierarchy
          among rights.
      - text: All human rights have equal status and cannot be ranked in a hierarchy
        correct: true
        why: >-
          Correct — the slides say all human rights have equal status and "cannot be positioned in a hierarchical
          order"; all rights are interconnected and equally important.
      - text: A treaty's rights cannot be divided between its states parties
        why: >-
          Tempting because "indivisible" sounds like a treaty rule, but the principle is about the relationship among
          rights, not among parties.
      - text: Non-derogable rights outrank every other human right
        why: >-
          Tempting because non-derogable rights cannot be suspended, but indivisibility says all rights have equal
          status; derogation is a separate question.
  - key: q412
    type: mcq
    concept: generations-and-principles-of-rights
    difficulty: 2
    stem: Which example does the lecture use to illustrate indivisibility and interdependence?
    options:
      - text: Free speech must sometimes yield to the right to privacy
        why: >-
          Tempting because rights do sometimes conflict, but the slide's example is about welfare rights depending on
          each other, not a clash of liberties.
      - text: An adequate standard of living cannot be compromised at the expense of health or education
        correct: true
        why: >-
          Correct — the slide says the right to an adequate standard of living cannot be compromised at the expense of
          other rights, such as health or education.
      - text: The right to life may be limited by lawful self-defence in war
        why: >-
          Tempting because the right to life is central, but this example is not on the indivisibility slide and
          concerns limits, not interdependence.
  - key: q413
    type: mcq
    concept: generations-and-principles-of-rights
    difficulty: 3
    contrasts-with:
      - derogations-and-limitations
    stem: Which statement correctly distinguishes indivisibility from non-derogability?
    options:
      - text: Indivisibility means no right may ever be restricted, so every right is non-derogable
        why: >-
          Tempting because both ideas protect rights, but indivisibility is about equal status; the lecture separately
          allows derogation and limitation of many rights.
      - text: Non-derogable rights are first-generation rights, so they outrank second-generation ones
        why: >-
          Tempting because the art 4(2) rights are civil and political, but indivisibility says no right outranks
          another; non-derogability is not a ranking of generations.
      - text: Indivisibility concerns equal status; non-derogability is which rights art 4(2) bars suspending
        correct: true
        why: >-
          Correct — indivisibility says rights have equal status and no hierarchy; non-derogability is the separate rule
          that some rights (art 4(2)) cannot be suspended in an emergency.
      - text: Indivisibility applies only to economic, social and cultural rights
        why: Tempting because the slide's example uses social rights, but the principle covers "all human rights".
  - key: q414
    type: mcq
    concept: generations-and-principles-of-rights
    difficulty: 2
    stem: The statement "denial of one right invariably impedes the enjoyment of other rights" expresses which principle?
    options:
      - text: Universality
        why: >-
          Tempting because it is the other key principle, but universality is about rights applying to all humans
          everywhere, not about rights depending on each other.
      - text: Interdependence
        correct: true
        why: >-
          Correct — the slide on indivisibility and interdependence says denial of one right invariably impedes the
          enjoyment of other rights.
      - text: Cultural relativism
        why: >-
          Tempting because it is a theory about rights, but relativism concerns cultural context, not the links between
          rights.
      - text: Horizontal obligation
        why: >-
          Tempting because it is a term from this lecture, but it describes the state's duty to protect against private
          actors, not the interdependence of rights.
  - key: q415
    type: mcq
    concept: generations-and-principles-of-rights
    difficulty: 3
    variant-of: q411
    stem: >-
      A government says it will guarantee the right to education only after it has fully secured all civil and political
      rights, because those are "first generation". Which principle answers this most directly?
    options:
      - text: Cultural relativism, because each society may set its own priorities
        why: >-
          Tempting because the government is asserting its own priorities, but relativism is about cultural values; it
          does not answer a claimed ranking of generations.
      - text: Derogation under ICCPR art 4
        why: >-
          Tempting because art 4 allows suspension of some rights, but only in a proclaimed emergency and only for ICCPR
          rights; it does not create a ranking.
      - text: Indivisibility — rights have equal status and cannot be ranked
        correct: true
        why: >-
          Correct — the "first generation" label is a category, not a rank; indivisibility says all rights have equal
          status and cannot be positioned in a hierarchy.
      - text: Universality, because education must be provided to everyone at once
        why: >-
          Tempting because universality is about everyone, but the government's error is ranking the generations, which
          is what indivisibility answers.
  - key: q421
    type: truefalse
    concept: generations-and-principles-of-rights
    difficulty: 1
    set: quickfire
    statement: Self-determination is given in the lecture as an example of a third-generation (collective) right.
    answer: true
    why: >-
      True — the slides give self-determination as the example of a third-generation collective right, with the right to
      development and a healthy environment as potential ones.
  - key: q422
    type: truefalse
    concept: generations-and-principles-of-rights
    difficulty: 2
    set: quickfire
    statement: The universalist side of the debate argues that rights must be understood in context.
    answer: false
    why: >-
      False — "rights must be understood in context" is a cultural relativist argument. Universalists say basic rights
      cannot depend on culture and that culture is not static.
  - key: q423
    type: truefalse
    concept: generations-and-principles-of-rights
    difficulty: 1
    set: quickfire
    contrasts-with:
      - derogations-and-limitations
    statement: Under the principle of indivisibility, civil and political rights rank above economic, social and cultural rights.
    answer: false
    why: >-
      False — indivisibility means all human rights have equal status and cannot be positioned in a hierarchical order;
      the generations are categories, not ranks.
  - key: q424
    type: truefalse
    concept: generations-and-principles-of-rights
    difficulty: 2
    statement: Cultural relativists argue that universal human rights represent cultural imperialism, making IHRL ethnocentric.
    answer: true
    why: >-
      True — the slides list this among the relativist arguments: Western individualism does not reflect all worldviews,
      so universal rights represent cultural imperialism.
  - key: q441
    type: short
    concept: generations-and-principles-of-rights
    difficulty: 3
    prompt: >-
      At a Human Rights Council session, State W's delegate says that W need not end a traditional practice that harms
      women and girls, because universal human rights are a form of Western cultural imperialism. She adds that W will
      in any case concentrate on economic development before turning to civil and political rights. Using the lecture's
      key principles, respond to both claims.
    model: >-
      Issue: whether universality yields to cultural tradition, and whether W may rank some rights ahead of others.


      Law: universality means rights apply to all humans everywhere. Cultural relativists argue that societies have
      different

      values and conceptions of rights, that Western individualism does not reflect all worldviews, so universal rights
      are

      cultural imperialism, and that rights must be understood in context. Universalists answer that basic rights like
      life

      and freedom from torture cannot depend on culture, that relativism often masks oppression, particularly of women
      and

      minorities, and that culture is not static. Indivisibility and interdependence: all rights have equal status and
      cannot

      be positioned in a hierarchical order; denial of one impedes the enjoyment of others.


      Application: the delegate makes the relativist argument. The universalist reply fits the facts closely — the
      practice

      harms women and girls, the group relativism is said to mask oppression of, and a tradition can change because
      culture

      evolves. Her second claim ranks development (second-generation) above civil and political (first-generation)
      rights;

      indivisibility rejects that hierarchy, and neglecting civil rights would impede the enjoyment of others.


      Conclusion: neither claim justifies W's position.
    rubric:
      - id: r1
        criterion: "Issue: universality v culture, and ranking of rights"
        marks: 1
        top-band: >-
          Identifies both issues: whether tradition displaces universality, and whether W may prioritise one generation
          of rights.
        margin-note: There are two claims here — answer both.
        authorities: []
      - id: r2
        criterion: "Law: universality, the relativist and universalist arguments, indivisibility"
        marks: 3
        top-band: >-
          Sets out the relativist arguments and the three universalist replies accurately, and states indivisibility and
          interdependence (equal status, no hierarchy).
        margin-note: Good on the debate — now state indivisibility as precisely as the slide does.
        authorities: []
      - id: r3
        criterion: Application to the delegate's claims
        marks: 3
        top-band: >-
          Matches the universalist replies to the facts (harm to women and girls; culture evolves) and uses
          indivisibility to reject ranking development above civil rights.
        margin-note: Which universalist point fits a practice that harms women? Say so explicitly.
        authorities: []
      - id: r4
        criterion: Conclusion
        marks: 1
        top-band: Concludes on both claims, noting the relativist view as the lecture presents it without endorsing it.
        margin-note: A one-line answer to each claim would finish this well.
        authorities: []
  - key: q501
    type: mcq
    concept: rights-holders-and-duty-bearers
    difficulty: 1
    set: pretest
    stem: According to the lecture, who are the primary duty bearers in international human rights law?
    options:
      - text: Individuals
        why: >-
          Tempting because individuals can bear duties in international criminal law, but in IHRL the lecture lists
          individuals as right bearers; duties fall primarily on states.
      - text: States
        correct: true
        why: >-
          Correct — the slide lists duty bearers as "States (primarily)", with international organisations (e.g. in
          peacekeeping) as further duty bearers.
      - text: International organisations
        why: >-
          Tempting because the lecture says IOs can be duty bearers, but they come second; the slide names states as the
          primary duty bearers.
      - text: Non-governmental organisations
        why: >-
          Tempting because NGOs are active in human rights work (they submit UPR reports), but they are not listed as
          duty bearers.
  - key: q502
    type: mcq
    concept: rights-holders-and-duty-bearers
    difficulty: 1
    stem: Who are the right bearers in international human rights law, according to the slides?
    options:
      - text: States, which hold rights against other states
        why: >-
          Tempting because states hold rights in general international law, but the slide lists right bearers as the
          individual and groups.
      - text: The individual, and groups (collective rights)
        correct: true
        why: Correct — the slide lists right bearers as "The individual, Groups (collective rights)".
      - text: Only individuals; groups hold no human rights
        why: >-
          Tempting because many human rights are individual, but the slide expressly adds groups, for collective
          (third-generation) rights.
      - text: International organisations and their member states
        why: Tempting because IOs feature on these slides, but they appear as duty bearers, not right bearers.
  - key: q503
    type: mcq
    concept: rights-holders-and-duty-bearers
    difficulty: 1
    stem: What is a "vertical" human rights obligation?
    options:
      - text: The state's duties toward individuals under its jurisdiction
        correct: true
        why: >-
          Correct — the slide defines vertical obligations as the state's duties toward individuals under its
          jurisdiction.
      - text: The state's duty to protect individuals from private actors
        why: Tempting because it is the other half of the pair, but that is the horizontal obligation.
      - text: A duty that an international organisation owes its member states
        why: Tempting because IOs are duty bearers, but "vertical" describes the state–individual relationship.
      - text: A duty one state owes another under a human rights treaty
        why: >-
          Tempting because treaties create inter-state obligations, but "vertical" describes the state's duties toward
          individuals.
  - key: q504
    type: mcq
    concept: rights-holders-and-duty-bearers
    difficulty: 1
    variant-of: q503
    stem: What is a "horizontal" human rights obligation?
    options:
      - text: A duty owed equally by every state to every other state
        why: >-
          Tempting because "horizontal" suggests equals, but the slide uses it for the state's duty to protect
          individuals from other private actors.
      - text: A duty of private persons owed directly under the Covenant
        why: >-
          Tempting because private actors are involved, but the duty bearer is still the state; GC 31 says the Covenant
          is not a substitute for domestic law.
      - text: The state's duty to protect individuals from private actors
        correct: true
        why: >-
          Correct — the slide defines horizontal obligations as the state's duty to protect individuals from violations
          by other private actors.
      - text: The state's duties toward individuals under its jurisdiction
        why: Tempting because it is the other half of the pair, but that is the vertical obligation.
  - key: q505
    type: mcq
    concept: rights-holders-and-duty-bearers
    difficulty: 2
    stem: Which examples does the slide give of horizontal obligations?
    options:
      - text: Fair trial and political participation
        why: >-
          Tempting because both are rights the state must respect, but they are typically owed by the state's own
          organs; the slide's horizontal examples are different.
      - text: Torture and non-discrimination in housing
        correct: true
        why: >-
          Correct — the slide gives "Torture, non-discrimination in housing" as examples of the state's duty to protect
          against private actors.
      - text: Freedom of movement and the rights of aliens
        why: >-
          Tempting because both appear on the ICCPR slide, but neither is given as an example of a horizontal
          obligation.
      - text: Social security and protection of the family
        why: >-
          Tempting because both appear on the ICESCR slide, but the slide's horizontal examples are torture and housing
          discrimination.
  - key: q506
    type: mcq
    concept: rights-holders-and-duty-bearers
    difficulty: 2
    stem: >-
      According to General Comment No 31 (para 8), when are a state's positive obligations to ensure Covenant rights
      fully discharged?
    options:
      - text: When the state's own agents refrain from violating Covenant rights
        why: >-
          Tempting because restraint by agents is necessary, but GC 31 says it is not enough: individuals must also be
          protected against private persons or entities.
      - text: When individuals are protected against its agents and against private persons or entities
        correct: true
        why: >-
          Correct — GC 31 says positive obligations are "only fully discharged" if individuals are protected against
          violations by state agents and also against acts of private persons or entities.
      - text: When the state replaces its domestic criminal and civil law with the Covenant
        why: >-
          Wrong way round — GC 31 says the Covenant "cannot be viewed as a substitute for domestic criminal or civil
          law".
      - text: When individuals can sue private persons directly under the Covenant
        why: >-
          Tempting because it sounds like strong protection, but GC 31 puts the duty on the state to protect, not on a
          direct Covenant claim against private persons.
  - key: q507
    type: mcq
    concept: rights-holders-and-duty-bearers
    difficulty: 2
    stem: What does General Comment No 31 say about the relationship between the ICCPR and domestic law?
    options:
      - text: The Covenant cannot be a substitute for domestic criminal or civil law
        correct: true
        why: >-
          Correct — para 8 opens: "The Covenant cannot be viewed as a substitute for domestic criminal or civil law",
          before explaining the state's positive duty to protect.
      - text: The Covenant automatically replaces inconsistent domestic criminal and civil law
        why: >-
          Wrong way round — GC 31 says the Covenant is not a substitute for domestic law; protection is to come through
          the state.
      - text: Domestic law always prevails over the Covenant where the two conflict
        why: >-
          Tempting because dualist systems need incorporation (Week 5), but GC 31 does not say domestic law prevails; it
          says the state must protect individuals.
      - text: The Covenant applies only where domestic law has no rule on the matter
        why: >-
          Tempting because it sounds like gap-filling, but GC 31 makes no such rule; the state must protect against
          agents and private actors alike.
  - key: q508
    type: mcq
    concept: rights-holders-and-duty-bearers
    difficulty: 2
    contrasts-with:
      - international-human-rights-machinery
    stem: Which body issued General Comment No 31?
    options:
      - text: The Human Rights Council
        why: >-
          Tempting because the names are similar, but the Council is the Charter-based body of 47 states; general
          comments are issued by treaty bodies.
      - text: The Human Rights Committee
        correct: true
        why: >-
          Correct — GC 31 is the Human Rights Committee's, the treaty body that supervises the ICCPR and issues general
          comments.
      - text: The International Court of Justice
        why: >-
          Tempting because the ICJ interprets human rights treaties (as in Diallo), but it issues judgments and
          opinions, not general comments.
      - text: The Committee against Torture
        why: Tempting because it is a treaty body too, but it supervises CAT; GC 31 interprets the ICCPR.
  - key: q509
    type: mcq
    concept: rights-holders-and-duty-bearers
    difficulty: 2
    stem: >-
      Which authority does the lecture quote for the proposition that international organisations are bound by
      international obligations?
    options:
      - text: Diallo (ICJ, 2010), para 66
        why: >-
          Tempting because it is another ICJ quotation in this lecture, but Diallo concerns the weight of the Human
          Rights Committee's interpretations.
      - text: The Wall Advisory Opinion (ICJ, 2004), para 109
        why: >-
          Tempting because it is an ICJ advisory opinion on human rights, but it concerns extraterritorial application
          of the ICCPR to states.
      - text: The WHO–Egypt Agreement opinion (1980), para 37
        correct: true
        why: >-
          Correct — the slide quotes this 1980 advisory opinion: international organisations are subjects of
          international law bound by obligations from three sources.
      - text: DRC v Uganda (ICJ, 2005), para 179
        why: Tempting because it is an ICJ case on these slides, but it concerns an occupying state's responsibility.
  - key: q510
    type: mcq
    concept: rights-holders-and-duty-bearers
    difficulty: 3
    stem: According to the ICJ (1980, para 37), from which sources do an international organisation's obligations come?
    options:
      - text: Only its constitution, since it has no powers beyond those conferred by members
        why: >-
          Tempting because IOs act within conferred powers, but the Court lists three sources, not only the
          constitution.
      - text: Only the treaties it has signed, since it cannot be bound without consent
        why: >-
          Tempting because consent is central in international law, but the Court adds general rules of international
          law and the IO's constitution.
      - text: General international law, its constitution and its agreements
        correct: true
        why: >-
          Correct — IOs are bound by obligations "under general rules of international law, under their constitutions or
          under international agreements to which they are parties".
      - text: Resolutions of the General Assembly addressed to it
        why: Tempting because the UNGA directs some UN bodies, but the Court's list does not mention UNGA resolutions.
  - key: q511
    type: mcq
    concept: rights-holders-and-duty-bearers
    difficulty: 1
    stem: Which example does the lecture give of an international organisation acting as a human rights duty bearer?
    options:
      - text: Peacekeeping
        correct: true
        why: Correct — the slide lists "International organisations (e.g. Peacekeeping)" as duty bearers.
      - text: Trade dispute settlement
        why: Tempting because the slide mistakenly prints "WTO", but the example of an IO as a duty bearer is peacekeeping.
      - text: Treaty body general comments
        why: >-
          Tempting because treaty bodies are part of the human rights system, but they interpret obligations; the
          slide's duty bearer example is peacekeeping.
  - key: q512
    type: mcq
    concept: rights-holders-and-duty-bearers
    difficulty: 3
    stem: >-
      Private landlords in State R refuse to rent to members of an ethnic minority, and R has no law against it. Has R
      breached its ICCPR obligations?
    options:
      - text: No — the ICCPR binds only states, so private landlords' conduct can never engage it
        why: >-
          Tempting because states are the duty bearers, but the horizontal obligation makes R answerable for failing to
          protect against private actors.
      - text: Arguably yes — R has a horizontal duty to protect against private discrimination
        correct: true
        why: >-
          Correct — the slides give non-discrimination in housing as a horizontal obligation; GC 31 says protection
          against private persons is needed to discharge R's duty.
      - text: Yes — the landlords themselves are in breach of the ICCPR and liable under it
        why: >-
          Tempting because the landlords discriminate, but they are not duty bearers; the breach is R's failure to
          protect (GC 31).
      - text: No — housing is an ESC right in the ICESCR, outside the ICCPR
        why: >-
          Tempting because adequate housing is ICESCR art 11, but the slides give non-discrimination in housing as a
          horizontal obligation of the state.
  - key: q513
    type: mcq
    concept: rights-holders-and-duty-bearers
    difficulty: 2
    variant-of: q512
    stem: Police officers of State P beat a detainee in custody. Which kind of obligation is most directly engaged?
    options:
      - text: A horizontal obligation, because the officers acted as individuals
        why: >-
          Tempting because individuals inflicted the harm, but police are the state's own agents; horizontal obligations
          concern private actors.
      - text: An international organisation's obligation, because policing is a public service
        why: Tempting because public functions are involved, but no IO is involved; the police are organs of State P.
      - text: A vertical obligation, owed by the state toward individuals under its jurisdiction
        correct: true
        why: >-
          Correct — the conduct is by the state's own agents against an individual in its custody, the vertical
          relationship the slide describes.
  - key: q514
    type: mcq
    concept: rights-holders-and-duty-bearers
    difficulty: 3
    contrasts-with:
      - scope-and-extraterritoriality
    stem: >-
      How does the vertical/horizontal distinction differ from the question of territory and jurisdiction under ICCPR
      art 2(1)?
    options:
      - text: Vertical/horizontal concerns whose conduct the state answers for; art 2(1) concerns whom it owes duties to
        correct: true
        why: >-
          Correct — vertical and horizontal ask whether the harm came from state agents or private actors; art 2(1) asks
          whether the victim is within the territory or subject to the jurisdiction.
      - text: "They are the same question: horizontal obligations are those owed outside the territory"
        why: >-
          Tempting because "horizontal" suggests spreading outward, but it refers to protection against private actors,
          not extraterritorial reach.
      - text: Vertical obligations apply in the territory; horizontal ones apply only abroad
        why: >-
          Tempting because both concern the reach of obligations, but horizontal obligations arise wherever private
          actors threaten rights, not only abroad.
      - text: Art 2(1) applies only to vertical obligations; horizontal ones need no jurisdiction
        why: >-
          Tempting because the two ideas seem separable, but nothing on the slides exempts horizontal obligations from
          the territory and jurisdiction requirement.
  - key: q515
    type: mcq
    concept: rights-holders-and-duty-bearers
    difficulty: 2
    contrasts-with:
      - generations-and-principles-of-rights
    stem: Why does the lecture list groups, as well as individuals, as right bearers?
    options:
      - text: Because groups, not individuals, are the duty bearers in human rights law
        why: >-
          Tempting because groups appear in the duty-bearer discussion, but the slide lists groups as right bearers;
          states are the primary duty bearers.
      - text: Because some rights are collective rights
        correct: true
        why: >-
          Correct — the slide lists "Groups (collective rights)"; the third generation of rights (e.g.
          self-determination) is collective.
      - text: Because only groups may bring complaints to the human rights treaty bodies
        why: >-
          Tempting because complaints are part of the machinery, but individual complaints procedures exist; groups are
          right bearers because of collective rights.
      - text: Because groups are treated as states for the purposes of human rights treaties
        why: >-
          Tempting because peoples can become states through self-determination, but the slide does not treat groups as
          states.
  - key: q521
    type: truefalse
    concept: rights-holders-and-duty-bearers
    difficulty: 1
    set: quickfire
    statement: In the lecture's framework, states are the primary duty bearers in international human rights law.
    answer: true
    why: >-
      True — the slide lists duty bearers as "States (primarily)", and adds international organisations (e.g. in
