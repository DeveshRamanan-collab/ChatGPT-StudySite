questions:
  - key: q101
    type: mcq
    concept: history-and-foundations-of-human-rights
    difficulty: 1
    stem: Which of the early instruments listed in the lecture is the oldest?
    options:
      - text: The English Bill of Rights
        why: >-
          Tempting because it is an early English constitutional text, but the slides date it to 1689 — more than four
          centuries after Magna Carta.
      - text: Magna Carta
        correct: true
        why: >-
          Correct — the slides open the list of early instruments with Magna Carta (1215), long before the 1689 English
          Bill of Rights and the 1789 declarations.
      - text: The French Declaration of the Rights of Man
        why: >-
          Tempting because it is the best-known rights declaration of its era, but the slides date it to 1789, well
          after Magna Carta (1215).
      - text: The US Bill of Rights
        why: >-
          Tempting because it is a famous early bill of rights, but the slides date it to 1791 — the latest of the early
          instruments listed.
  - key: q102
    type: mcq
    concept: history-and-foundations-of-human-rights
    difficulty: 2
    stem: In the Two Treatises of Government (1689), which claim did John Locke argue against?
    options:
      - text: That people hold rights only once a sovereign has enacted them into law.
        why: >-
          Tempting because Locke did attack rights resting on rulers, but the slides frame his target as divine
          subjection to a monarch, not legislative enactment as such.
      - text: That human beings may sometimes be treated merely as a means to an end.
        why: >-
          Tempting because it sounds like Enlightenment dignity theory, but that is Kant's point in the Groundwork
          (1785), not Locke's argument in 1689.
      - text: That God had made all people naturally subject to a monarch's rule.
        correct: true
        why: >-
          Correct — the slides say Locke defended the claim that men are by nature free and equal against claims that
          God had made all people naturally subject to a monarch.
      - text: That slavery should be abolished throughout Europe.
        why: >-
          Tempting because abolition is part of the same history, but the slides place it in the 19th century (Britain
          1807), not in Locke's Two Treatises.
  - key: q103
    type: mcq
    concept: history-and-foundations-of-human-rights
    difficulty: 2
    stem: According to the lecture, what did Locke say about rights such as life, liberty and property?
    options:
      - text: They have a foundation independent of the laws of any particular society.
        correct: true
        why: >-
          Correct — the slides say Locke argued people have rights, such as life, liberty and property, with a
          foundation independent of the laws of any particular society.
      - text: They exist only where a society's laws have chosen to recognise them.
        why: >-
          Tempting because rights are usually enforced through law, but this is the opposite of Locke's view: he
          grounded rights outside any particular society's laws.
      - text: They belong to groups and peoples rather than to individual persons.
        why: >-
          Tempting because the lecture later covers collective rights, but those are third-generation rights; Locke
          spoke of individuals' rights to life, liberty and property.
      - text: They were first recognised internationally by the 1926 Slavery Convention.
        why: >-
          Tempting because the Slavery Convention is an early treaty in the same history, but it was issue-specific and
          came long after Locke's 1689 argument.
  - key: q104
    type: mcq
    concept: history-and-foundations-of-human-rights
    difficulty: 1
    stem: Which idea does the lecture attribute to Kant's Groundwork for the Metaphysics of Morals (1785)?
    options:
      - text: People are by nature free and equal, not subject to a monarch.
        why: >-
          Tempting because it is also an Enlightenment claim, but the slides attribute it to Locke's Two Treatises of
          Government (1689), not to Kant.
      - text: All persons have an inherent dignity, so must be treated as an end and never merely as a means.
        correct: true
        why: >-
          Correct — the slides say Kant held that all persons have an inherent value, or dignity, which limits our
          treatment of others: never "merely as a means".
      - text: Rights must be understood in their cultural context.
        why: >-
          Tempting because it is a theory about rights, but this is a cultural relativist argument from the universality
          debate, not Kant's dignity principle.
      - text: All human rights are interdependent and cannot be ranked.
        why: >-
          Tempting because it is a principle from this lecture, but indivisibility and interdependence are modern IHRL
          principles, not the slide's account of Kant.
  - key: q105
    type: mcq
    concept: history-and-foundations-of-human-rights
    difficulty: 2
    stem: >-
      How does the lecture describe the beginning of international human rights protection in the 19th and early 20th
      centuries?
    options:
      - text: General — one treaty protecting all civil and political rights.
        why: >-
          Tempting because the ICCPR later did this, but the slides stress the early phase was issue-specific: slavery
          and limited women's rights, not general protection.
      - text: Regional — begun through the European Convention on Human Rights.
        why: >-
          Tempting because the ECHR is a key regional treaty, but the slides list it as a source of obligations, not as
          the 19th-century beginning of protection.
      - text: Issue-specific — slavery and limited women's rights.
        correct: true
        why: >-
          Correct — the slides call the 19th–20th century beginning "issue-specific": abolition of slavery and limited
          women's rights (trafficking in women for prostitution).
      - text: Declaratory — set out first in the UDHR of 1948.
        why: >-
          Tempting because the UDHR is the landmark declaration, but it came after WW2; the slides place earlier,
          issue-specific protection before it.
  - key: q106
    type: mcq
    concept: history-and-foundations-of-human-rights
    difficulty: 2
    stem: >-
      Which development does the lecture give as an example of early, issue-specific international human rights
      protection?
    options:
      - text: The non-discrimination guarantee in UDHR art 2
        why: >-
          Tempting because art 2 is a foundational guarantee, but it dates from 1948 and is general in scope, not part
          of the earlier issue-specific phase.
      - text: Abolition of slavery, from Britain in 1807 to the 1926 Slavery Convention
        correct: true
        why: >-
          Correct — the slides give the abolition of slavery (Britain in 1807, then other European countries and the
          1926 Slavery Convention) as an issue-specific beginning.
      - text: The Universal Periodic Review of every UN member state
        why: >-
          Tempting because the UPR is a human rights mechanism, but it belongs to the modern Human Rights Council
          (created 2006), not the 19th-century beginnings.
      - text: The ICESCR right to the highest attainable standard of health
        why: >-
          Tempting because it is a recognised human right, but it is in the 1966 Covenant (art 12), long after the
          issue-specific phase the slides describe.
  - key: q107
    type: mcq
    concept: history-and-foundations-of-human-rights
    difficulty: 1
    stem: Which women's rights issue does the lecture identify as receiving limited early international attention?
    options:
      - text: Trafficking in women for prostitution
        correct: true
        why: >-
          Correct — the slides list "Women's rights (limited): trafficking in women for prostitution" as part of the
          issue-specific beginnings of international human rights.
      - text: Discrimination against women in all its forms, under CEDAW
        why: >-
          Tempting because CEDAW is the core women's rights treaty, but the slides date it to 18 December 1979 — far
          later than the early issue-specific phase.
      - text: Women's inclusion in the wording of UDHR art 1
        why: >-
          Tempting because Hansa Mehta's change to art 1 is in the lecture, but that was 1948 drafting, not the early
          limited women's rights issue on the history slide.
  - key: q108
    type: mcq
    concept: history-and-foundations-of-human-rights
    difficulty: 2
    stem: On the lecture's history slides, what comes immediately before the UN Charter's treatment of human rights?
    options:
      - text: The adoption of the two international Covenants in 1966
        why: >-
          Tempting because the Covenants are central to the framework, but they came after the Charter and the UDHR; the
          slides place WW2 before the Charter.
      - text: The French Declaration of the Rights of Man and of the Citizen
        why: >-
          Tempting because it is a major rights text, but the slides list it among the early instruments (1789), well
          before the 19th–20th century treaties and WW2.
      - text: The Second World War and the Nazi regime
        correct: true
        why: >-
          Correct — the 19th–20th century slide ends with "WW2 and Nazi Regime", and the next slide turns to the UN
          Charter and human rights.
      - text: Britain's abolition of slavery in 1807
        why: >-
          Tempting because abolition is on the same slide, but it is the first item of the issue-specific phase, not the
          event that leads directly into the Charter.
  - key: q109
    type: mcq
    concept: history-and-foundations-of-human-rights
    difficulty: 1
    stem: Under art 1(3) of the UN Charter, what is the status of promoting and encouraging respect for human rights?
    options:
      - text: A duty of the Security Council alone
        why: >-
          Tempting because the Security Council has major Charter powers, but art 1(3) states a purpose of the United
          Nations as a whole, not a Council-only duty.
      - text: One of the Purposes of the United Nations
        correct: true
        why: >-
          Correct — art 1(3) lists "promoting and encouraging respect for human rights and for fundamental freedoms for
          all" among the Purposes of the United Nations.
      - text: A matter left to regional organisations such as the Council of Europe
        why: >-
          Tempting because regional systems do protect rights, but art 1(3) puts human rights among the UN's own
          purposes rather than leaving them to regions.
      - text: A principle that binds only states that later ratify the UDHR
        why: >-
          Tempting because consent matters in treaty law, but the UDHR is a declaration, not ratified, and art 1(3) is
          part of the Charter itself.
  - key: q110
    type: mcq
    concept: history-and-foundations-of-human-rights
    difficulty: 3
    contrasts-with:
      - international-bill-of-rights
    stem: Article 1(3) of the UN Charter promotes respect for human rights "without distinction as to" which grounds?
    options:
      - text: Race, colour, national or social origin, property or birth
        why: >-
          Tempting because these grounds appear in UDHR art 2, but the Charter's list is shorter: art 1(3) names only
          race, sex, language and religion.
      - text: Nationality, legal status, residence and political opinion
        why: >-
          Tempting because nationality and legal status matter for the scope of the ICCPR, but they are not the grounds
          listed in Charter art 1(3).
      - text: Race, sex, language, or religion
        correct: true
        why: >-
          Correct — arts 1(3) and 55(c) both say "without distinction as to race, sex, language, or religion"; the
          longer list of grounds is in UDHR art 2.
      - text: Race, colour, sex, language, religion or social origin
        why: >-
          Tempting because this list appears in the lecture, but it is the art 4(1) ICCPR non-discrimination limit on
          derogations, not Charter art 1(3).
  - key: q111
    type: mcq
    concept: history-and-foundations-of-human-rights
    difficulty: 2
    stem: What does art 55(c) of the UN Charter commit the United Nations to promote?
    options:
      - text: Universal respect for, and observance of, human rights and freedoms
        correct: true
        why: >-
          Correct — art 55(c) says the UN shall promote "universal respect for, and observance of, human rights and
          fundamental freedoms for all" without distinction.
      - text: Binding adjudication of every individual human rights complaint
        why: >-
          Tempting because complaints procedures exist, but they come from treaty bodies, and their views are not
          binding; art 55(c) speaks of promoting respect.
      - text: Collective self-defence of Members whose nationals' rights are violated
        why: >-
          Tempting because the Charter does deal with self-defence (art 51), but art 55(c) is about promoting human
          rights, not the use of force.
      - text: Immediate incorporation of the UDHR into every Member's domestic law
        why: >-
          Tempting because incorporation is a familiar idea from Week 5, but art 55(c) only commits the UN to promote
          respect and observance.
  - key: q112
    type: mcq
    concept: history-and-foundations-of-human-rights
    difficulty: 2
    stem: Under art 56 of the UN Charter, what do all Members pledge?
    options:
      - text: To submit to a Human Rights Council review every four and a half years
        why: >-
          Tempting because the Universal Periodic Review does run on that cycle, but it was set up in 2006, not pledged
          in art 56 of the Charter.
      - text: To refer any human rights dispute with another Member to the ICJ
        why: >-
          Tempting because the ICJ is the UN's principal judicial organ, but art 56 says nothing about compulsory
          referral of human rights disputes.
      - text: To take joint and separate action, with the UN, to achieve art 55's purposes
        correct: true
        why: >-
          Correct — art 56: "All Members pledge themselves to take joint and separate action in co-operation with the
          Organization" to achieve the art 55 purposes.
      - text: To ratify each of the nine core human rights treaties within a year
        why: >-
          Tempting because the core treaties sit at the heart of the UN system, but ratification is voluntary; art 56 is
          a pledge of joint and separate action.
  - key: q113
    type: mcq
    concept: history-and-foundations-of-human-rights
    difficulty: 3
    stem: According to art 55 of the UN Charter, why should the UN promote respect for human rights?
    options:
      - text: Because human rights are jus cogens and bind every state without exception
        why: >-
          Tempting because some human rights norms are jus cogens, but art 55 does not say this; it links rights to
          stability, well-being and peaceful relations.
      - text: To create conditions of stability and well-being needed for peaceful, friendly relations among nations
        correct: true
        why: >-
          Correct — art 55 opens "With a view to the creation of conditions of stability and well-being which are
          necessary for peaceful and friendly relations among nations".
      - text: Because the Covenants of 1966 require the Organization to supervise them
        why: >-
          Tempting because the Covenants have supervisory bodies, but the Charter predates them; art 55 gives its own
          rationale of stability and friendly relations.
  - key: q114
    type: mcq
    concept: history-and-foundations-of-human-rights
    difficulty: 2
    stem: Which of these early instruments or works does the lecture date latest?
    options:
      - text: The French Declaration of the Rights of Man and of the Citizen
        why: >-
          Tempting because it is late in the early list, but the slides date it to 1789 — two years before the US Bill
          of Rights (1791).
      - text: Kant's Groundwork for the Metaphysics of Morals
        why: >-
          Tempting because Kant is the later of the two Enlightenment thinkers, but the Groundwork is dated 1785, before
          both 1789 declarations and 1791.
      - text: The English Bill of Rights
        why: >-
          Tempting because it is a "Bill of Rights" like the American one, but the slides date it to 1689, a century
          before the US Bill of Rights.
      - text: The United States Bill of Rights
        correct: true
        why: >-
          Correct — the slides date the US Bill of Rights to 1791, after the US Constitution and French Declaration
          (1789) and Kant's Groundwork (1785).
  - key: q115
    type: mcq
    concept: history-and-foundations-of-human-rights
    difficulty: 3
    variant-of: q114
    stem: Which two items does the lecture date to the same year, 1689?
    options:
      - text: The English Bill of Rights and Locke's Two Treatises of Government
        correct: true
        why: Correct — the slides date both the English Bill of Rights and Locke's Two Treatises of Government to 1689.
      - text: The French Declaration of the Rights of Man and the US Constitution
        why: Tempting because the slides do give these the same year, but that year is 1789, not 1689 — a century later.
      - text: Magna Carta and the English Bill of Rights
        why: >-
          Tempting because both are English constitutional texts, but Magna Carta is dated 1215 and the English Bill of
          Rights 1689.
      - text: Kant's Groundwork and the US Bill of Rights
        why: >-
          Tempting because both are late-18th-century, but the slides date the Groundwork to 1785 and the US Bill of
          Rights to 1791.
  - key: q116
    type: mcq
    concept: history-and-foundations-of-human-rights
    difficulty: 3
    variant-of: q103
    stem: >-
      A writer claims that people are by nature free and equal and hold rights to life, liberty and property whatever
      their own society's laws provide. Whose argument in the lecture does this track most closely?
    options:
      - text: Hansa Mehta's
        why: >-
          Tempting because she shaped the UDHR's wording on equality, but the lecture credits her with changing "All
          men" to "All human beings" in art 1, not with this theory.
      - text: John Locke's
        correct: true
        why: >-
          Correct — the slides say Locke defended natural freedom and equality and argued that rights such as life,
          liberty and property have a foundation independent of any society's laws.
      - text: Immanuel Kant's
        why: >-
          Tempting because Kant also grounded limits on treatment outside law, but the slides attribute to him inherent
          dignity and "never merely as a means", not life, liberty and property.
      - text: The cultural relativists'
        why: >-
          Wrong way round — cultural relativists say rights must be understood in context and differ between societies,
          the opposite of rights holding whatever a society's laws say.
  - key: q121
    type: truefalse
    concept: history-and-foundations-of-human-rights
    difficulty: 1
    set: quickfire
    statement: The UN Charter itself contains no reference to human rights; they first appear in the UDHR of 1948.
    answer: false
    why: >-
      False — the Charter already refers to human rights: promoting respect for them is a purpose of the UN (art 1(3)),
      the UN shall promote them (art 55(c)), and Members pledge action (art 56).
  - key: q122
    type: truefalse
    concept: history-and-foundations-of-human-rights
    difficulty: 1
    set: quickfire
    statement: >-
      The lecture attributes to Kant the principle that human beings must be treated as an end and never merely as a
      means.
    answer: true
    why: >-
      True — the slides cite Kant's Groundwork for the Metaphysics of Morals (1785): all persons have an inherent
      dignity, so must be treated "as an end" and "never merely as a means".
  - key: q123
    type: truefalse
    concept: history-and-foundations-of-human-rights
    difficulty: 2
    set: quickfire
    statement: On the lecture's timeline, Britain's abolition of slavery (1807) came before the 1926 Slavery Convention.
    answer: true
    why: >-
      True — the slides list abolition of slavery by Britain in 1807, then in other European countries, and then the
      1926 Slavery Convention, as the issue-specific beginnings.
  - key: q131
    type: match
    concept: history-and-foundations-of-human-rights
    difficulty: 2
    prompt: Match each early instrument or work to the date the lecture gives it.
    pairs:
      - left: Magna Carta
        right: "1215"
      - left: English Bill of Rights
        right: "1689"
      - left: Kant, Groundwork for the Metaphysics of Morals
        right: "1785"
      - left: French Declaration of the Rights of Man and of the Citizen
        right: "1789"
      - left: US Bill of Rights
        right: "1791"
  - key: q201
    type: mcq
    concept: international-bill-of-rights
    difficulty: 1
    set: pretest
    stem: Which three instruments make up the International Bill of Rights?
    options:
      - text: The UN Charter, the UDHR and the ICCPR
        why: >-
          Tempting because the Charter is where human rights enter the UN system, but it is not part of the Bill; the
          slides name the UDHR, ICCPR and ICESCR.
      - text: The ICCPR, the ICESCR and ICERD
        why: >-
          Tempting because all three are core treaties from the 1960s, but ICERD is not part of the Bill; the third
          member is the UDHR of 1948.
      - text: The UDHR, the ICCPR and the ICESCR
        correct: true
        why: >-
          Correct — the slides define the International Bill of Rights as the Universal Declaration of Human Rights plus
          the two 1966 Covenants (ICCPR and ICESCR).
      - text: The UDHR, the European Convention and the American Convention
        why: >-
          Tempting because the two regional conventions are treaty sources of human rights obligations, but they are
          regional, not part of the International Bill of Rights.
  - key: q202
    type: mcq
    concept: international-bill-of-rights
    difficulty: 1
    stem: When was the Universal Declaration of Human Rights adopted, according to the lecture?
    options:
      - text: 16 December 1966
        why: >-
          Tempting because it is a key date in the framework, but 16 December 1966 is the date the slides give for both
          Covenants, not the UDHR.
      - text: 10 December 1948
        correct: true
        why: Correct — the slides head the UDHR slide "UDHR 10 Dec 1948".
      - text: In 1945, as an annex to the UN Charter
        why: >-
          Tempting because the Charter does refer to human rights (arts 1(3), 55, 56), but the UDHR was a separate
          instrument adopted in December 1948.
      - text: 21 December 1965
        why: >-
          Tempting because it is the earliest core treaty date on the slides, but 21 December 1965 is ICERD, not the
          UDHR.
  - key: q203
    type: mcq
    concept: international-bill-of-rights
    difficulty: 3
    contrasts-with:
      - history-and-foundations-of-human-rights
    stem: Which ground of distinction is listed in UDHR art 2 but not in UN Charter art 1(3)?
    options:
      - text: Race
        why: >-
          Tempting because it is the first ground in UDHR art 2, but race also appears in Charter art 1(3) ("race, sex,
          language, or religion"), so it is in both.
      - text: Religion
        why: >-
          Tempting because religion is a classic ground of distinction, but it is in both lists: UDHR art 2 and Charter
          art 1(3) each name it.
      - text: Political or other opinion
        correct: true
        why: >-
          Correct — UDHR art 2 adds grounds such as colour, political or other opinion, national or social origin,
          property and birth; the Charter lists only race, sex, language, religion.
      - text: Sex
        why: >-
          Tempting because sex is central to the UDHR's drafting history, but it is in both: Charter art 1(3) and UDHR
          art 2 each list sex.
  - key: q204
    type: mcq
    concept: international-bill-of-rights
    difficulty: 3
    stem: >-
      According to UDHR art 2, may a person's entitlement to the Declaration's rights depend on the status of the
      country or territory to which they belong?
    options:
      - text: Yes — people in trust territories hold only the rights granted by the administering state
        why: >-
          Tempting because trust territories were administered by other states, but art 2 says no distinction shall be
          made on that basis, expressly including trust territories.
      - text: No — not whether the territory is independent, trust, non-self-governing or of limited sovereignty
        correct: true
        why: >-
          Correct — art 2 says no distinction shall be made on the political, jurisdictional or international status of
          the person's country or territory, whatever its status.
      - text: Only if the territory has not yet been recognised as a state by other states
        why: >-
          Tempting because recognition matters for statehood (Week 4), but art 2 makes the status of the person's
          country or territory irrelevant to their rights.
  - key: q205
    type: mcq
    concept: international-bill-of-rights
    difficulty: 2
    stem: What change to the UDHR is Hansa Mehta of India widely credited with?
    options:
      - text: Adding the right to education as art 26
        why: >-
          Tempting because art 26 is on the slide, but the lecture credits Hansa Mehta with changing the wording of art
          1, not with the right to education.
      - text: Adding "sex" to the grounds of distinction in art 2
        why: >-
          Tempting because she championed women's rights, but the slides credit her specifically with changing "All men"
          to "All human beings" in art 1.
      - text: Changing "All men are born free and equal" to "All human beings are born free and equal" in art 1
        correct: true
        why: >-
          Correct — the slide says Hansa Mehta is widely credited with changing "All men are born free and equal" to
          "All human beings are born free and equal" in art 1.
      - text: Drafting the right to the highest attainable standard of health
        why: >-
          Tempting because health is a key social right, but that right is in ICESCR art 12 (1966); Hansa Mehta's
          credited change is to UDHR art 1.
  - key: q206
    type: mcq
    concept: international-bill-of-rights
    difficulty: 1
    stem: Which UDHR article does the lecture list for the prohibition on arbitrary arrest and detention?
    options:
      - text: Art 5
        why: >-
          Tempting because art 5 is a core physical-integrity right, but the slides list art 5 as the prohibition on
          torture, not arbitrary arrest and detention.
      - text: Art 13
        why: >-
          Tempting because detention restricts movement, but the slides list art 13 as the right to freedom of movement,
          a separate right from art 9.
      - text: Art 9
        correct: true
        why: >-
          Correct — the slides list UDHR art 9 as the prohibition on arbitrary arrest and detention (art 3 is life,
          liberty and security of person).
      - text: Art 3
        why: >-
          Tempting because art 3 protects liberty, but the slides list it as the right to life, liberty and security of
          person; arbitrary arrest is art 9.
  - key: q207
    type: mcq
    concept: international-bill-of-rights
    difficulty: 2
    stem: As listed on the slides, what does UDHR art 3 protect?
    options:
      - text: Life, liberty and security of person
        correct: true
        why: Correct — the slides list UDHR art 3 as the right to life, liberty and security of person.
      - text: Equality before the law for everyone
        why: >-
          Tempting because equality is a core UDHR value, but the slides list equality before the law as art 7, not art
          3.
      - text: Recognition everywhere as a person before the law
        why: >-
          Tempting because it is a basic legal-status right, but the slides list recognition as a person before the law
          as art 6.
      - text: Privacy, family and home
        why: Tempting because it is another personal right on the list, but the slides number it art 12, not art 3.
  - key: q208
    type: mcq
    concept: international-bill-of-rights
    difficulty: 2
    stem: Which ICCPR article protects against imprisonment for breach of contract?
    options:
      - text: Art 10
        why: >-
          Tempting because art 10 concerns people in detention, but the slides list it as rights in detention; the bar
          on imprisonment for breach of contract is art 11.
      - text: Art 11
        correct: true
        why: >-
          Correct — the slides list ICCPR art 11 as "No imprisonment for breach of contract" (and it is also one of the
          non-derogable rights in art 4(2)).
      - text: Art 9
        why: >-
          Tempting because art 9 deals with liberty, but the slides list it as the right to liberty and security
          generally, not the specific contract-debt rule.
      - text: Art 13
        why: >-
          Tempting because art 13 is the last ICCPR article on the slide, but it covers the rights of aliens, not
          imprisonment for breach of contract.
  - key: q209
    type: mcq
    concept: international-bill-of-rights
    difficulty: 1
    stem: Which provision protects the right to the "highest attainable standard of physical and mental health"?
    options:
      - text: ICCPR art 6
        why: >-
          Tempting because health and life are closely linked, but ICCPR art 6 is the right to life; health is an
          economic and social right in the ICESCR.
      - text: ICESCR art 11
        why: >-
          Tempting because art 11 is the neighbouring welfare right, but it covers "adequate food, clothing and
          housing"; health is art 12.
      - text: UDHR art 26
        why: Tempting because art 26 is a social right on the UDHR list, but it is the right to education, not health.
      - text: ICESCR art 12
        correct: true
        why: >-
          Correct — the slides list ICESCR art 12 as the right to the "highest attainable standard of physical and
          mental health".
  - key: q210
    type: mcq
    concept: international-bill-of-rights
    difficulty: 2
    stem: A family is evicted and cannot find adequate housing. Which provision on the slides is most directly engaged?
    options:
      - text: UDHR art 12, the right to privacy, family and home
        why: >-
          Tempting because "home" appears in art 12, but that protects privacy and the home from interference; adequacy
          of housing is ICESCR art 11.
      - text: ICESCR art 11, the right to adequate food, clothing and housing
        correct: true
        why: >-
          Correct — the slides list ICESCR art 11 as the right to "adequate food, clothing and housing", the provision
          most directly about adequate housing.
      - text: ICCPR art 12, the right to freedom of movement
        why: >-
          Tempting because eviction forces people to move, but art 12 protects the freedom to move; it does not address
          the adequacy of housing.
      - text: ICESCR art 9, the right to social security
        why: >-
          Tempting because social security supports people in need, but the slides list housing expressly under art 11,
          not art 9.
  - key: q211
    type: mcq
    concept: international-bill-of-rights
    difficulty: 2
    stem: Which provision on the slides protects the right to form trade unions?
    options:
      - text: ICCPR art 8
        why: "Tempting because art 8 is the right number in the wrong Covenant: ICCPR art 8 is the prohibition on slavery."
      - text: ICESCR art 8
        correct: true
        why: Correct — the slides list ICESCR art 8 as the right to form trade unions.
      - text: ICESCR art 6
        why: >-
          Tempting because unions relate to work, but the slides list ICESCR art 6 as the right to work itself; unions
          are art 8.
      - text: ICESCR art 10
        why: Tempting because it is another ICESCR social right, but art 10 is the protection of the family.
  - key: q212
    type: mcq
    concept: international-bill-of-rights
    difficulty: 3
    stem: Article 8 appears in both Covenants. What does each protect, as listed on the slides?
    options:
      - text: "ICCPR art 8: trade unions; ICESCR art 8: the prohibition on slavery"
        why: >-
          Tempting because both rights are on the slides, but this swaps them: slavery is the civil right (ICCPR art 8)
          and trade unions the social right (ICESCR art 8).
      - text: "ICCPR art 8: liberty and security; ICESCR art 8: social security"
        why: >-
          Tempting because "security" appears in both, but those are ICCPR art 9 and ICESCR art 9 — the next article in
          each Covenant.
      - text: "ICCPR art 8: the prohibition on slavery; ICESCR art 8: trade unions"
        correct: true
        why: >-
          Correct — the slides list ICCPR art 8 as the prohibition on slavery and ICESCR art 8 as the right to form
          trade unions.
      - text: Both protect freedom of association, one civil and one economic
        why: >-
          Tempting because trade unions involve association, but ICCPR art 8 is about slavery; the shared number does
          not mean a shared right.
  - key: q213
    type: mcq
    concept: international-bill-of-rights
    difficulty: 3
    variant-of: q212
    stem: Both Covenants' lists on the slides begin at art 6. What does art 6 protect in each?
    options:
      - text: "ICCPR: life; ICESCR: work"
        correct: true
        why: Correct — the slides list ICCPR art 6 as the right to life and ICESCR art 6 as the right to work.
      - text: "ICCPR: the right to work; ICESCR: the right to life"
        why: >-
          Tempting because both rights are on the slides, but this swaps them: life is a civil right (ICCPR art 6) and
          work a social one (ICESCR art 6).
      - text: "ICCPR: the prohibition on torture; ICESCR: the right to health"
        why: Tempting because both are core rights, but torture is ICCPR art 7 and health is ICESCR art 12.
      - text: "ICCPR: liberty and security; ICESCR: the protection of the family"
        why: >-
          Tempting because these appear nearby, but they are ICCPR art 9 and ICESCR art 10, not art 6 of either
          Covenant.
  - key: q214
    type: mcq
    concept: international-bill-of-rights
    difficulty: 3
    stem: >-
      A state detains political protesters indefinitely in overcrowded cells and, after release, bars them from
      travelling within the country. Which ICCPR articles on the slides are most directly engaged?
    options:
      - text: Arts 6, 7 and 8 — life, torture and slavery
        why: >-
          Tempting because these are the gravest ICCPR rights, but nothing in the facts involves killing, torture or
          slavery; detention and movement are arts 9, 10 and 12.
      - text: ICESCR arts 9, 10 and 11 — social security, family and housing
        why: >-
          Tempting because the conditions are poor, but detention and travel bans engage civil and political rights in
          the ICCPR, not the ICESCR.
      - text: Arts 9, 10 and 12
        correct: true
        why: >-
          Correct — indefinite detention engages art 9 (liberty and security), cell conditions art 10 (rights in
          detention), and the travel bar art 12 (freedom of movement).
      - text: Arts 11 and 13 — contract debts and aliens
        why: >-
          Tempting because both appear on the ICCPR slide, but the protesters are not imprisoned for a contract debt and
          are not described as aliens.
  - key: q215
    type: mcq
    concept: international-bill-of-rights
    difficulty: 2
    stem: Which right appears on the slides' UDHR list and on its ICESCR list, but not on its ICCPR list?
    options:
      - text: The prohibition on torture (UDHR art 5)
        why: >-
          Tempting because it is on the UDHR list, but it reappears in the ICCPR (art 7), a civil and political right,
          not in the ICESCR.
      - text: Freedom of movement (UDHR art 13)
        why: Tempting because it is on the UDHR list, but its Covenant home on the slides is ICCPR art 12, not the ICESCR.
      - text: The right to work (UDHR art 23)
        correct: true
        why: >-
          Correct — the right to work is UDHR art 23 and ICESCR art 6, an economic and social right; it does not appear
          on the slides' ICCPR list.
      - text: The right to life (UDHR art 3)
        why: Tempting because life is the most basic right, but it reappears as ICCPR art 6, a civil and political right.
  - key: q216
    type: mcq
    concept: international-bill-of-rights
    difficulty: 2
    stem: What dates do the slides give for the two Covenants?
