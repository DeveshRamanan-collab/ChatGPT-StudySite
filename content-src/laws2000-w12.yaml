  - slug: history-and-foundations-of-human-rights
    title: History and foundations of international human rights law
    visual: timeline
    visual-brief: >-
      A timeline from Magna Carta (1215) through the English Bill of Rights and Locke (1689), Kant (1785), the 1789
      declarations, the US Bill of Rights (1791), abolition (1807) and the Slavery Convention (1926) to WW2 and the UN
      Charter — the line narrow (domestic, then issue-specific) until it widens into general protection at Charter arts
      1(3), 55(c) and 56.
