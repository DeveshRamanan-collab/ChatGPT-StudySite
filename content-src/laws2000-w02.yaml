    depends-on: [article-38-and-sources-of-international-law]
    contrasts-with: [treaties-as-a-source]
    cases: [legal-status-of-eastern-greenland-denmark-v-norway, nuclear-tests-cases-australia-v-france-new-zealand-v-france]
    authorities: [vclt-art-53, un-charter-art-25]
    verify: false
    body: |
      Article 38 doesn't provide an exhaustive list. Four further categories are commonly identified. Unilateral
      statements/acts: a state can create a binding obligation for itself through a public declaration, without
      any offer, reciprocity or acceptance by another state required — in Legal Status of Eastern Greenland,
      Norway's foreign minister's promise not to make difficulties for Denmark's claim became a binding
      obligation, and in the Nuclear Tests Cases the ICJ held that French government statements evidencing an
      intention to cease atmospheric testing were themselves a legal undertaking.

      Jus cogens: peremptory norms "accepted and recognized by the international community of States as a whole"
      from which "no derogation is permitted" (VCLT art 53) — the ILC's examples include genocide, crimes against
      humanity, aggression, slavery, torture and self-determination. No treaty provision can validly contain one;
      a rule that does is terminated.

      Decisions of international organisations can bind states where their constitutive treaty says so: Article
      25 UN Charter makes UN Security Council decisions binding on members (e.g. Resolution 1373 on
      counter-terrorism, adopted weeks after 9/11).

      Soft law: non-legally-binding declarations (e.g. UN General Assembly resolutions) do not themselves create
      obligations, but can provide evidence of state practice or opinio juris, and can develop into custom or
      prompt new treaties (the Universal Declaration of Human Rights led to the ICCPR and ICESCR).

      Exam use: none of these four is independently as strong as a treaty or custom, but each can supply evidence
      for one, or bind states through a different mechanism entirely.

cases:
  - slug: asylum-case-colombia-v-peru
    name: Asylum Case (Colombia v Peru)
    citation: "(Judgment) [1950] ICJ Rep 266"
    aglc: "Asylum Case (Colombia v Peru) (Judgment) [1950] ICJ Rep 266"
    facts: |
      Colombia had granted diplomatic asylum, in its embassy in Lima, to a Peruvian political leader, and argued
      that as the state granting asylum it had the unilateral right to qualify the nature of the offence for the
      purposes of the asylum, binding on Peru, on the basis of an alleged regional customary rule of Latin
      American diplomatic asylum.
    issue: |
      Whether a regional rule of customary international law existed, entitling the state granting diplomatic
      asylum to make a unilateral and definitive qualification of the offence, binding on the territorial state.
    held: |
      The ICJ held that Colombia had not proven the existence of such a customary rule: the practice disclosed
      "so much uncertainty and contradiction, so much fluctuation and discrepancy... that it is not possible to
      discern in all this any constant and uniform usage, accepted as law."
    ratio: |
      A party asserting a rule of customary international law (particularly a regional one) must show consistent
      and uniform practice accepted as law; inconsistent, contradictory or politically expedient practice does
      not establish a binding custom.
    significance: |
      Leading illustration of the practice element of customary international law failing for want of consistency
      and uniformity, and of the extra difficulty of proving a regional (rather than universal) custom.
    why-here: Used as the model of a custom claim failing for lack of consistent and uniform state practice.
    verify: false
  - slug: nicaragua-v-united-states-of-america
    name: Military and Paramilitary Activities in and against Nicaragua (Nicaragua v United States of America)
    citation: "(Merits) [1986] ICJ Rep 14"
    aglc: "Military and Paramilitary Activities in and against Nicaragua (Nicaragua v United States of America) (Merits) [1986] ICJ Rep 14"
    facts: |
      Nicaragua brought proceedings against the United States over US support for Contra rebels and US mining of
      Nicaraguan harbours, raising questions about the content of customary international law on the use of force
      and non-intervention, including its relationship to UN Charter provisions on the same subject.
    issue: |
      How strictly must state practice conform to an asserted customary rule for the rule to exist, and how does
      the existence of a treaty rule (the UN Charter's prohibition on the use of force) relate to a parallel
      customary rule on the same subject.
    held: |
      The Court held that a customary rule does not require practice in "absolutely rigorous conformity" with it;
      it is enough that state conduct is "in general" consistent with the rule, and that instances of inconsistent
      conduct are generally treated as breaches of the rule rather than as evidence of a new rule — even conduct
      defended by reference to an exception within the rule confirms, rather than weakens, it. The Court also
      confirmed that a rule can exist as both a treaty rule and a customary rule simultaneously, each retaining a
      separate existence.
    ratio: |
      Customary international law tolerates imperfect state practice provided departures are generally treated as
      breaches rather than as the emergence of a new rule; and a treaty rule and a customary rule on the same
      subject can coexist, with separate content and application.
    significance: |
      A leading and wide-ranging ICJ judgment on the identification of customary international law and on the
      relationship between treaty and custom (codification, crystallisation, and generation of new custom).
    why-here: Central authority both for how tolerant the practice element is of imperfect compliance, and for the three ways a treaty and a customary rule can relate to each other.
    verify: false
  - slug: north-sea-continental-shelf-cases
    name: North Sea Continental Shelf Cases (Federal Republic of Germany v Denmark; Federal Republic of Germany v Netherlands)
    citation: "(Judgment) [1969] ICJ Rep 3"
    aglc: "North Sea Continental Shelf Cases (Federal Republic of Germany v Denmark; Federal Republic of Germany v Netherlands) (Judgment) [1969] ICJ Rep 3"
    facts: |
      Germany, Denmark and the Netherlands disputed how to delimit the continental shelf boundaries between their
      North Sea coastlines; Denmark and the Netherlands argued that the equidistance method in the Geneva
      Convention on the Continental Shelf, to which Germany was not a party, reflected a rule of customary
      international law binding on Germany regardless.
    issue: |
      Whether a treaty rule (the equidistance principle) had, notwithstanding a relatively short period of
      application, crystallised into or generated a rule of customary international law binding on a non-party
      state, and what is required of state practice to establish a customary rule.
    held: |
      The Court held that the equidistance rule had not become a rule of customary international law binding on
      Germany: within the period in question, however short, state practice — including that of specially
      affected states — had to be "extensive and virtually uniform", and it was not.
    ratio: |
      A short period of practice is not itself a bar to the formation of a new customary rule, but the practice
      within that period, including that of states whose interests are specially affected, must be extensive and
      virtually uniform in the sense of the rule invoked; and evidence of opinio juris requires that acts be
      carried out from a sense of legal obligation, not habit, courtesy or convenience.
    significance: |
      Leading authority on the generality, uniformity and duration required of state practice, on the
      specially-affected-states requirement, and (with Nicaragua) on how a treaty provision can crystallise a
      developing customary rule.
    why-here: Central authority for the practice element of customary international law (duration, uniformity, specially affected states) and for distinguishing opinio juris from mere habit or courtesy.
    verify: false
  - slug: fisheries-case-united-kingdom-v-norway
    name: Fisheries (United Kingdom v Norway)
    citation: "(Merits) [1951] ICJ Rep 116"
    aglc: "Fisheries (United Kingdom v Norway) (Merits) [1951] ICJ Rep 116"
    facts: |
      The UK and Norway disagreed over how to delimit Norway's territorial sea along its heavily indented
      coastline; the UK argued for a customary 10-mile rule for closing bays, while Norway calculated its
      territorial sea using straight baselines drawn between the outermost points of its coastal formations.
    issue: |
      Whether the UK's claimed 10-mile rule for the closing line of bays had achieved the status of customary
      international law, and if so, whether Norway was nonetheless not bound by it.
    held: |
      The Court held there was not enough state practice to support the 10-mile rule as a rule of customary
      international law at all; but added that, even had the rule existed, Norway would not have been bound by
      it, having always opposed its application to the Norwegian coast.
    ratio: |
      Even where a rule has achieved the status of customary international law, a state that has persistently and
      consistently objected to it from the outset of its formation is not bound by it — the persistent objector
      rule.
    significance: |
      The leading authority for the persistent objector exception to the general rule that customary
      international law binds all states.
    why-here: The source of the persistent objector rule — used whenever a fact pattern raises whether a state can escape a customary obligation it has always rejected.
    verify: false
  - slug: right-of-passage-over-indian-territory-portugal-v-india
    name: Right of Passage over Indian Territory (Portugal v India)
    citation: "(Merits) [1960] ICJ Rep 6"
    aglc: "Right of Passage over Indian Territory (Portugal v India) (Merits) [1960] ICJ Rep 6"
    facts: |
      Portugal held a small enclave within Indian territory, accessible only by a route passing through Indian
      territory; Portugal had used that route for centuries, and argued it had a right of passage even though no
      treaty between Portugal and India established one, which India disputed.
    issue: |
      Whether a rule of customary international law establishing a right of passage could exist as between only
      two states, in the absence of any treaty, and whether it did so here.
    held: |
      The ICJ held that the long, consistent practice between Portugal and India supported a customary right of
      passage for Portugal over Indian territory to access its enclave, even though it bound only these two
      states.
    ratio: |
      Customary international law is not limited to universal or general rules — a particular custom can exist
      and bind as few as two states, provided the practice between them meets the ordinary requirements of
      consistency and acceptance as law.
    significance: |
      Establishes that particular (including bilateral) custom is possible, alongside general/universal customary
      international law.
    why-here: The authority for particular custom binding only a limited number of states, contrasted with universal customary international law.
    verify: false
  - slug: legal-status-of-eastern-greenland-denmark-v-norway
    name: Legal Status of Eastern Greenland (Denmark v Norway)
    citation: "Judgment, 1933, PCIJ, Series A/B, No. 53"
    aglc: "Legal Status of Eastern Greenland (Denmark v Norway) (1933) PCIJ Series A/B No 53"
    facts: |
      Denmark claimed sovereignty over the whole of Greenland; Norway argued that part of Eastern Greenland was
      terra nullius and occupied it. Denmark relied on a 1919 statement by the Norwegian Foreign Minister, Mr
      Ihlen, who told the Danish Minister that "the Norwegian Government would not make any difficulty in the
      settlement of this question."
    issue: |
      Whether a unilateral statement made by a state's representative, in the absence of any treaty or reciprocal
      undertaking, could create a binding legal obligation for that state.
    held: |
      The Permanent Court of International Justice held that the Ihlen declaration was "unconditional and
      definitive", and that Norway was under an obligation to refrain from contesting Danish sovereignty over
      Greenland as a whole, and from occupying any part of it.
    ratio: |
      A unilateral statement by a state representative, evidencing a clear intention to accept an obligation, can
      itself create a binding international legal obligation, without any offer, reciprocity or acceptance by the
      other state being required.
    significance: |
      The founding authority for unilateral statements/acts as a source of binding international obligations
      outside Article 38(1).
    why-here: The key case for unilateral statements as a source of obligation — used whenever a state's own public statement, rather than a treaty or custom, is said to bind it.
    verify: false
  - slug: nuclear-tests-cases-australia-v-france-new-zealand-v-france
    name: Nuclear Tests Cases (Australia v France; New Zealand v France)
    citation: "[1974] ICJ Rep 253"
    aglc: "Nuclear Tests Cases (Australia v France, New Zealand v France) [1974] ICJ Rep 253"
    facts: |
      Australia and New Zealand challenged France's atmospheric nuclear weapons testing in the Pacific; before a
      hearing on the merits could proceed, the French President and Foreign Minister made a series of public
      statements, including at press conferences, indicating that France would cease atmospheric testing.
    issue: |
      Whether the French government's public statements themselves created a binding legal obligation to cease
      atmospheric nuclear testing, without any of the elements ordinarily required for a treaty.
    held: |
      The ICJ found that the official French statements testified to an intention to be legally bound to cease
      atmospheric tests, and interpreted them as constituting a legal undertaking not to conduct such tests after
      1974; "nothing in the nature of a quid pro quo, nor any subsequent acceptance of the declaration, nor even
      any reply or reaction from other States, is required" for a unilateral statement to bind.
    ratio: |
      A unilateral declaration, made with the intention to be bound according to its terms, confers on itself the
      character of a legal undertaking; the binding character of such statements rests on the principle of good
      faith, and no reciprocity or acceptance by other states is needed.
    significance: |
      Confirms and applies the Eastern Greenland principle to modern unilateral statements made through official
      press declarations, and is reflected in the ILC's later Guiding Principles on unilateral declarations.
    why-here: Applies the unilateral-statement doctrine to a modern example — used to show how courts assess the words, context and intention behind a state's public statement.
    verify: false

authorities:
  - slug: vclt-art-2-1-a
    title: VCLT art 2(1)(a)
    kind: treaty
    text: |
      "treaty" means an international agreement concluded between States in written form and governed by
      international law...
    gloss: Defines a treaty for the purposes of the VCLT — a written, international-law-governed agreement between states (or in some cases international organisations) — with the parties' consent to be bound as the operative test in practice.
    cases: []
    verify: false
  - slug: vclt-art-53
    title: VCLT art 53
    kind: treaty
    text: |
      For the purposes of the present Convention, a peremptory norm of general international law is a norm
      accepted and recognized by the international community of States as a whole as a norm from which no
      derogation is permitted and which can be modified only by a subsequent norm of general international law
      having the same character.
    gloss: Defines jus cogens (peremptory norms) — non-derogable rules accepted by the international community as a whole, modifiable only by a later norm of the same character.
    cases: []
    verify: false
  - slug: icj-statute-art-38-1
    title: ICJ Statute art 38(1)
    kind: treaty
    text: |
      The article directs the Court to apply, in deciding disputes submitted to it: international conventions
      (treaties); international custom; "the general principles of law recognized by civilized nations"; and, as
      a subsidiary means for the determination of rules of law, judicial decisions and "the teachings of the most
      highly qualified publicists of the various nations".
    gloss: Lists the sources the ICJ applies, divided in the lecture into primary sources (treaties, custom, general principles) and secondary sources (judicial decisions, scholarly writings) — not, on the better view, a strict hierarchy.
    cases: []
    verify: true
  - slug: icj-statute-art-59
    title: ICJ Statute art 59
    kind: treaty
    text: |
      The decision of the Court has no binding force except between the parties and in respect of that particular
      case.
    gloss: Confirms that ICJ decisions bind only the parties to that specific case, and do not create precedent binding in later cases — unlike the common law doctrine of precedent.
    cases: []
    verify: false
  - slug: un-charter-art-25
    title: UN Charter art 25
    kind: treaty
    text: |
      The Members of the United Nations agree to accept and carry out the decisions of the Security Council in
      accordance with the present Charter.
    gloss: The basis on which UN Security Council decisions (e.g. Resolution 1373 on counter-terrorism) can bind member states without their specific consent to that decision.
    cases: []
    verify: false

questions:
  # ---------- Concept 1: article-38-and-sources-of-international-law ----------
  - key: q101
    type: mcq
    concept: article-38-and-sources-of-international-law
    difficulty: 1
    set: pretest
    stem: According to Article 38(1) of the ICJ Statute as covered this week, which three sources are treated as "primary" sources of international law?
    options:
      - text: Treaties, customary international law, and general principles of law.
        correct: true
        why: Correct — the lecture calls these the primary sources because they are the real, true sources of binding obligations by states, unlike judicial decisions and scholarly writings.
      - text: Judicial decisions, scholarly writings, and treaties.
        why: Tempting because judicial decisions and scholarly writings do appear in Article 38(1), but the lecture classifies them as secondary, not primary, sources.
      - text: Treaties, jus cogens, and soft law instruments.
        why: Wrong — jus cogens and soft law are discussed later this week as things missing from Article 38(1) altogether, not as primary sources listed within it.
  - key: q102
    type: mcq
    concept: article-38-and-sources-of-international-law
    variant-of: q101
    difficulty: 1
    stem: Why does the lecture describe judicial decisions and scholarly writings as "secondary" rather than "primary" sources?
    options:
      - text: They help interpret international legal principles found in the primary sources, rather than creating binding obligations themselves.
        correct: true
        why: Correct — the lecture is explicit that secondary sources are not law-creating in themselves; they help interpret the principles found at (a), (b) and (c) of Article 38.
      - text: They are only used when a state has not ratified any treaties at all, which is the kind of general claim an exam answer should verify against the source material.
        why: Wrong — nothing ties the use of judicial decisions or scholarly writings to a state's treaty status; they are used to interpret whatever primary source is in play.
      - text: They are secondary because the ICJ was created after treaties and custom already existed, though this would need further support before being accepted.
        why: Wrong — the primary/secondary distinction is about whether a source creates law or merely interprets it, not about which source came first historically.
  - key: q103
    type: mcq
    concept: article-38-and-sources-of-international-law
    difficulty: 2
    stem: What does the lecture say was the actual purpose behind drafting Article 38(1) of the ICJ Statute?
    options:
      - text: To tell the International Court of Justice what it could use to assess cases based on international legal principles.
        correct: true
        why: Correct — the lecture stresses this was the idea behind the article, not to give a clear, deliberate reference list of the sources of international law as such.
      - text: To create a binding hierarchy ranking treaties above custom and custom above general principles.
        why: Wrong — the lecture specifically says it is not the purpose of the article to rank the sources against each other in this way.
      - text: To list every possible source of obligation a state could ever be subject to, a proposition that would need to be checked carefully against the facts in issue.
        why: Wrong — the lecture stresses Article 38 does not provide an exhaustive list, so listing every source was never its purpose.
  - key: q104
    type: mcq
    concept: article-38-and-sources-of-international-law
    difficulty: 2
    stem: Which of the following is NOT one of the four items Article 38(1) ICJ Statute actually lists?
    options:
      - text: Jus cogens norms.
        correct: true
        why: Correct — jus cogens is covered this week as something missing from Article 38(1), not one of the four items the article itself lists.
      - text: General principles of law recognised by civilized nations.
        why: Wrong — this is expressly one of the four items listed in Article 38(1), so it cannot be the answer to what is missing from the article.
      - text: The teachings of the most highly qualified publicists of the various nations.
        why: Wrong — this phrase is drawn directly from Article 38(1) itself, describing scholarly writings as a subsidiary means.
  - key: q105
    type: mcq
    concept: article-38-and-sources-of-international-law
    variant-of: q104
    difficulty: 2
    stem: Which of the following IS one of the sources actually listed within Article 38(1), rather than something added on top of it?
    options:
      - text: International custom.
        correct: true
        why: Correct — international custom is one of the sources Article 38(1) directs the Court to apply, alongside treaties and general principles.
      - text: Decisions of international organisations.
        why: Tempting, since decisions of international organisations do bind states in some circumstances, but this week's lecture places that under what is missing from Article 38(1).
      - text: Soft law/non-legally binding commitments.
        why: Wrong — soft law is explicitly discussed as something Article 38(1) does not cover, not as one of its four listed items.
  - key: q106
    type: mcq
    concept: article-38-and-sources-of-international-law
    difficulty: 3
    stem: A student argues "Article 38(1) lists sources in a strict order of legal authority, so a treaty always defeats a customary rule on the same point." What is the strongest criticism of this claim?
    options:
      - text: The ordering in Article 38(1) tracks the primary/secondary, law-creating/law-interpreting distinction, not a ranking between treaty and custom, and a treaty and custom on the same subject can bind the same states simultaneously.
        correct: true
        why: Correct and the point of this week's exam tip — Article 38(1)'s order is not a hierarchy between the primary sources themselves, and a rule can exist in both a treaty and custom at once.
      - text: The claim is correct because custom is only relevant when no treaty exists on the subject at all.
        why: Wrong — this week's material shows a treaty and a customary rule on the same subject can coexist, each with its own content, rather than custom simply disappearing once a treaty is adopted.
      - text: The claim is correct, but only for multilateral treaties rather than bilateral ones, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — nothing in Article 38(1) or the lecture distinguishes bilateral from multilateral treaties when discussing whether there is a hierarchy of sources.
  - key: q107
    type: mcq
    concept: article-38-and-sources-of-international-law
    difficulty: 3
    variant-of: q106
    stem: Which fact from this week's material most directly disproves the idea that Article 38(1) sets a strict hierarchy among treaties, custom and general principles?
    options:
      - text: A rule of international law can be contained in a treaty and be a rule of custom simultaneously, as the relationship between treaties and custom shows.
        correct: true
        why: Correct — if the same rule can exist in two "ranked" sources at once, those sources cannot be in a strict order of authority over each other.
      - text: General principles of law are always applied before treaties in every dispute before the ICJ.
        why: Wrong — the material says the opposite — general principles are a gap-filler used only once treaty and custom fail to resolve the dispute.
      - text: The ICJ Statute was adopted after the UN Charter, so it cannot bind UN member states, a proposition that would need to be checked carefully against the facts in issue.
        why: Wrong — this is not a claim made anywhere in the material and has nothing to do with whether Article 38(1) ranks the sources.
  - key: q108
    type: mcq
    concept: article-38-and-sources-of-international-law
    difficulty: 1
    stem: Is Article 38(1) of the ICJ Statute an exhaustive list of every source of international law?
    options:
      - text: No — the lecture is explicit that Article 38 doesn't provide an exhaustive list of sources.
        correct: true
        why: Correct — this is stated directly, and is why the lecture goes on to cover unilateral statements, jus cogens, decisions of international organisations and soft law separately.
      - text: Yes — every possible source of an international obligation must fit within paragraphs (a) to (d).
        why: Wrong — this contradicts the lecture's explicit statement that the article is not exhaustive and that other sources exist beyond it.
      - text: Yes, but only for disputes that do not involve a state party to the United Nations.
        why: Wrong — there is no such carve-out in the material; the exhaustiveness question is not tied to UN membership at all.
  - key: q109
    type: mcq
    concept: article-38-and-sources-of-international-law
    difficulty: 2
    stem: Why does the lecture say Article 38(1) was not really designed to identify the sources of international law, even though it is used that way?
    options:
      - text: Its actual purpose was to tell the Court what it could use, based on international legal principles, when deciding a dispute — identifying "sources" is a use later scholars and courts made of it.
        correct: true
        why: Correct — the lecture draws exactly this distinction between the article's drafting purpose and how it is now conventionally used as a reference point for the sources of international law.
      - text: Because the article was drafted in a language other than English and has been mistranslated.
        why: Wrong — no translation issue is raised anywhere in this week's materials; the point made is about the article's original purpose, not its language.
      - text: Because the article has since been repealed and replaced by the UN Charter.
        why: Wrong — nothing in the material suggests Article 38(1) has been repealed; it remains the standard starting point for identifying sources.
  - key: q110
    type: mcq
    concept: article-38-and-sources-of-international-law
    difficulty: 2
    stem: Which pairing correctly matches a source with its category, as classified this week?
    options:
      - text: Customary international law — primary source.
        correct: true
        why: Correct — custom sits alongside treaties and general principles as one of the three primary, law-creating sources under Article 38(1).
      - text: Scholarly writings — primary source, though this would need further support before being accepted.
        why: Wrong — scholarly writings are a secondary source; they interpret the law rather than create binding obligations.
      - text: Judicial decisions — primary source, though this would need further support before being accepted.
        why: Wrong — judicial decisions are classified as a secondary source in this week's material, not a primary one.
  - key: q111
    type: mcq
    concept: article-38-and-sources-of-international-law
    difficulty: 3
    contrasts-with: [judicial-decisions-and-scholarly-writings]
    stem: A student says "since judicial decisions appear in Article 38(1), an ICJ decision creates a binding rule of law in the same way a treaty does." What is wrong with this claim?
    options:
      - text: Judicial decisions are classed as a secondary, law-interpreting source, whereas treaties are a primary, law-creating source — the two do not create obligations in the same way.
        correct: true
        why: Correct — this is exactly the primary/secondary distinction this week draws, and the reason judicial decisions do not create law the way a treaty does.
      - text: Judicial decisions are not mentioned anywhere in Article 38(1) at all, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — judicial decisions are expressly listed in Article 38(1) as a subsidiary means, so the error is not that they are absent from the article.
      - text: Treaties are also only a secondary, interpretive source, so there is in fact no real distinction to draw.
        why: Wrong — treaties are consistently treated in this week's material as a primary, law-creating source, not a secondary one.
  - key: q112
    type: mcq
    concept: article-38-and-sources-of-international-law
    difficulty: 4
    stem: A dispute involves a treaty rule, a customary rule, and a general principle of law that could all arguably apply. In what order should an exam answer typically consider them, and why?
    options:
      - text: Treaty first (as the most direct evidence of consent), then custom (if the treaty doesn't cover the point or the state isn't a party), and general principles only as a last resort if neither resolves the dispute.
        correct: true
        why: Correct — this reflects treaties being the most direct evidence of obligation, custom filling gaps a treaty leaves or does not reach, and general principles being expressly described as used when a dispute "cannot be effectively resolved" on the basis of treaty or custom.
      - text: General principles first, because Article 38(1)(c) is listed before judicial decisions in paragraph (d), a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — the order within Article 38(1) reflects primary versus secondary sources, not the practical sequence for applying general principles, which the material treats as a gap-filler of last resort.
      - text: It does not matter which order they are considered in, since all three sources always produce the same outcome on the same facts.
        why: Wrong — the whole point of distinguishing sources is that they can produce different content (e.g. a treaty's specification of a right can differ from custom's), so order and choice of source matters.
  - key: q113
    type: mcq
    concept: article-38-and-sources-of-international-law
    difficulty: 1
    stem: What best describes the overall structure this week's lecture gives to Article 38(1)?
    options:
      - text: Primary sources that create binding obligations, and secondary sources that help interpret them.
        correct: true
        why: Correct — this primary/secondary, law-creating/law-interpreting split is the organising structure the lecture gives to the whole of Article 38(1).
      - text: Sources that apply only to states, and sources that apply only to international organisations.
        why: Wrong — the primary/secondary distinction in the lecture has nothing to do with whether the source applies to states or organisations specifically.
      - text: Sources used before litigation begins, and sources used only once a judgment has been delivered.
        why: Wrong — this timing-based distinction is not how the lecture organises Article 38(1); the actual split is law-creating versus law-interpreting.
  - key: q114
    type: mcq
    concept: article-38-and-sources-of-international-law
    difficulty: 2
    stem: Why does international law's lack of a legislator and compulsory courts make identifying its sources harder than identifying the sources of domestic law?
    options:
      - text: Without a legislator producing statutes or a compulsory court system, international law relies on states' own agreements and practice, which are more varied and less centrally recorded than domestic legislation.
        correct: true
        why: Correct — the lecture opens with exactly this point — we can't completely transpose the domestic legal regime into international law because there is no legislator and no compulsory courts.
      - text: International law has no written sources of any kind, only oral tradition passed between diplomats.
        why: Wrong — treaties and many other sources discussed this week are written; the difficulty is the absence of a legislator, not the absence of writing.
      - text: Domestic law has no equivalent to customary international law, making comparison meaningless, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — domestic legal systems can also recognise custom in limited contexts; the key contrast drawn is the absence of a legislator and compulsory courts, not the total absence of any concept of custom.
  - key: q115
    type: mcq
    concept: article-38-and-sources-of-international-law
    difficulty: 3
    stem: A government lawyer needs to advise on whether her state is bound by a particular rule, and starts by checking Article 38(1)(a)-(d) in order. What is the main limitation of stopping there?
    options:
      - text: She may miss unilateral statements, jus cogens, decisions of international organisations, or soft law, none of which appear in Article 38(1) but which can still create or evidence an obligation.
        correct: true
        why: Correct — this week's material is explicit that Article 38 is not exhaustive, so a search confined to it can miss real sources of obligation that this week separately covers.
      - text: There is no limitation, because Article 38(1) covers every possible way a state can become bound.
        why: Wrong — this directly contradicts the lecture's statement that Article 38 does not provide an exhaustive list of sources.
      - text: Article 38(1) only applies to disputes about maritime boundaries, so it would be the wrong starting point for most other rules.
        why: Wrong — Article 38(1) is of general application to any dispute before the ICJ, not limited to maritime boundary questions.
  - key: q116
    type: mcq
    concept: article-38-and-sources-of-international-law
    difficulty: 2
    stem: Which of the following best explains why treaties, custom and general principles are called "primary" sources?
    options:
      - text: They are the real, true sources of binding obligations by states.
        correct: true
        why: Correct — this is the lecture's own description of why these three, and not judicial decisions or scholarly writings, are classed as primary.
      - text: They were the only sources recognised before the ICJ Statute was drafted in 1945.
        why: Wrong — no historical claim of this kind is made in the material; the primary/secondary label is about function (creating versus interpreting law), not chronology.
      - text: They are primary because they are listed in a shorter paragraph than judicial decisions and scholarly writings.
        why: Wrong — the length of the drafting has nothing to do with the primary/secondary classification described in the lecture.
  - key: q117
    type: mcq
    concept: article-38-and-sources-of-international-law
    difficulty: 4
    stem: An exam problem states that a rule appears nowhere in any treaty ratified by the respondent state, has not achieved the status of customary international law, and is not a recognised general principle. According to this week's material, what should the answer conclude about Article 38(1)?
    options:
      - text: Article 38(1) alone offers no basis for the obligation, but the answer should still check the sources beyond Article 38(1) — unilateral statements, jus cogens, decisions of international organisations, or soft law — before concluding there is none.
        correct: true
        why: Correct — because the three primary sources under Article 38(1) are exhausted on these facts, but the article is not an exhaustive list of every possible source, so the analysis must continue beyond it.
      - text: The obligation must exist anyway, because every rule that seems fair should be treated as binding regardless of its source, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — international law requires an identifiable source of obligation; fairness alone, without a recognised source, is not enough under this week's framework.
      - text: The answer should stop there and conclude with certainty that no obligation of any kind could possibly bind the state, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — stopping at Article 38(1) ignores this week's point that further sources exist beyond it, so certainty at this stage would be premature.
  - key: q118
    type: truefalse
    set: quickfire
    concept: article-38-and-sources-of-international-law
    statement: Article 38(1) of the ICJ Statute provides an exhaustive list of every source of international law.
    answer: false
    why: False — the lecture is explicit that Article 38 does not provide an exhaustive list, which is exactly why unilateral statements, jus cogens, IO decisions and soft law are covered separately this week.
  - key: q119
    type: truefalse
    set: quickfire
    concept: article-38-and-sources-of-international-law
    statement: Judicial decisions and scholarly writings are classified as secondary sources because they help interpret the law rather than create it.
    answer: true
    why: True — the lecture describes secondary sources as not law-creating in themselves, but as helping interpret the international legal principles found in the primary sources.
  - key: q120
    type: truefalse
    set: quickfire
    concept: article-38-and-sources-of-international-law
    statement: According to this week's material, Article 38(1) ranks treaties as legally superior to customary international law whenever the two conflict.
    answer: false
    why: False — the ordering in Article 38(1) reflects the primary/secondary distinction, not a ranking of treaty over custom, and the two sources can bind the same states on the same subject at once.
  - key: q121
    type: short
    concept: article-38-and-sources-of-international-law
    difficulty: 3
    prompt: |
      "There is a clear hierarchy between the sources of international law as laid out in Article 38(1) of the ICJ
      Statute." Critically analyse this statement, explaining the relationship between the sources it lists.
    model: |
      The statement should be rejected as stated. Article 38(1) does distinguish two groups of sources: paragraphs
      (a)-(c) — treaties, customary international law, and general principles of law — are primary sources, the
      real sources of binding obligations by states, while paragraph (d) — judicial decisions and the teachings of
      the most highly qualified publicists — is secondary, a subsidiary means for determining what the law already
      is rather than a law-creating source in its own right. That distinction is real, but it is not the "clear
      hierarchy" the statement asserts between treaty, custom and general principles themselves.

      First, Article 38(1) was not drafted to rank sources against each other; its purpose was simply to tell the
      Court what it could apply when deciding disputes. Second, a rule of international law can exist as both a
      treaty rule and a customary rule at the same time (as with the right of self-defence, found in both custom
      and UN Charter art 51), so treaty and custom are not mutually exclusive or ranked — a state not party to the
      treaty can still be bound by the parallel customary rule, and the two rules can even carry different
      specifications. Third, general principles operate as a gap-filler rather than a subordinate source in a
      formal hierarchy: they are reached for only once a dispute cannot be effectively resolved on the basis of
      treaty or custom, which is a functional ordering of convenience rather than a ranking of legal authority.

      A better description is that Article 38(1) lists a primary/secondary distinction (law-creating versus
      law-interpreting), within which the three primary sources coexist and interact (a treaty may codify,
      crystallise, or generate a customary rule), rather than a strict hierarchy in which a "higher" source
      automatically defeats a "lower" one.
    rubric:
      - id: r1
        criterion: Identifies and correctly explains the real primary/secondary (law-creating/law-interpreting) distinction in Article 38(1).
        marks: 2
        top-band: States the distinction precisely and ties it to "real, true sources of binding obligations" versus a subsidiary, interpretive role.
        margin-note: Good — this is the distinction the article actually draws.
        authorities: [icj-statute-art-38-1]
      - id: r2
        criterion: Explains why Article 38(1) was not designed to create a ranking between treaty, custom and general principles.
        marks: 2
        top-band: Notes the article's actual drafting purpose (to tell the Court what to apply) and rejects the idea of a strict hierarchy between (a)-(c).
        margin-note: Correctly rejects the premise of the question rather than accepting it uncritically.
        authorities: [icj-statute-art-38-1]
      - id: r3
        criterion: Uses the treaty-custom coexistence point (e.g. self-defence in both custom and UN Charter art 51) as evidence against a strict hierarchy.
        marks: 2
        top-band: Gives a concrete, correctly explained example of a rule existing in both a treaty and custom simultaneously.
        margin-note: Strong use of authority to support the critical analysis.
        authorities: []
      - id: r4
        criterion: Correctly situates general principles as a gap-filler rather than a formally ranked, subordinate source.
        marks: 1
        top-band: Explains general principles are used only once treaty and custom fail to resolve the dispute, distinguishing functional convenience from legal hierarchy.
        margin-note: Nice distinction between practical sequencing and formal ranking.
        authorities: []
  # ---------- Concept 2: treaties-as-a-source ----------
  - key: q201
    type: mcq
    concept: treaties-as-a-source
    difficulty: 1
    stem: According to Article 2(1)(a) of the Vienna Convention on the Law of Treaties, what is a treaty?
    options:
      - text: An international agreement concluded between States in written form and governed by international law.
        correct: true
        why: Correct — this is the VCLT's own definition, quoted directly in this week's slides as the starting point for identifying a treaty.
      - text: Any written promise made by a head of state to another head of state, though this would need further support before being accepted.
        why: Tempting because it sounds close, but it misses the VCLT's requirements that the agreement be between States and governed by international law, not just any written promise between leaders personally.
      - text: A political statement of intent that does not need to be honoured once circumstances change.
        why: Wrong — this describes something closer to soft law; a treaty under the VCLT definition is a binding agreement, not a non-binding statement of intent.
  - key: q202
    type: mcq
    concept: treaties-as-a-source
    variant-of: q201
    difficulty: 1
    stem: Which of these is NOT required by the VCLT's definition of a treaty?
    options:
      - text: That the agreement be called a "treaty" and not any other name.
        correct: true
        why: Correct — the lecture stresses the name of the document doesn't matter (agreement, convention, protocol, covenant, exchange of letters); what counts is consent to be bound.
      - text: That the agreement be between States (or, in some cases, international organisations).
        why: Wrong — the VCLT definition does require the agreement to be between States, so this is a genuine requirement, not the odd one out.
      - text: That the agreement be governed by international law.
        why: Wrong — this is expressly part of the VCLT definition, so it is a genuine requirement rather than the exception being asked for.
  - key: q203
    type: mcq
    concept: treaties-as-a-source
    difficulty: 2
    stem: What does the maxim "pacta sunt servanda" mean in the context of treaties?
    options:
      - text: States are bound to honour their treaty-based obligations.
        correct: true
        why: Correct — this is the definition given in the lecture, and it is the foundational rule that gives treaty obligations their binding force once accepted.
      - text: Treaties automatically expire after ten years unless renewed.
        why: Wrong — nothing about a ten-year expiry appears anywhere in this week's material; pacta sunt servanda is about honouring obligations, not about a treaty's duration.
      - text: A state may withdraw from a treaty obligation at any time without consequence.
        why: Wrong — this is the opposite of pacta sunt servanda, which requires states to honour, not casually abandon, their treaty-based obligations.
  - key: q204
    type: mcq
    concept: treaties-as-a-source
    difficulty: 2
    stem: Why does becoming a party to a treaty count as strong evidence that a state has accepted a legal obligation?
    options:
      - text: Ratifying or becoming a party is a clear, checkable act of consent, making it easy to see that the state has accepted the obligation.
        correct: true
        why: Correct — the lecture stresses treaties are the most direct evidence of a legal obligation precisely because it's easy to check whether a state has ratified or become a party.
      - text: Because international courts automatically assume every state is a party to every treaty unless it proves otherwise.
        why: Wrong — there is no such presumption in the material; a state's status as a treaty party has to be established, not assumed against it.
      - text: Because treaties, unlike custom, do not require any consent at all once negotiations conclude, though this would need further support before being accepted.
        why: Wrong — this gets the whole point backwards — consent (through ratification or accession) is exactly what makes a treaty binding on a state.
  - key: q205
    type: mcq
    concept: treaties-as-a-source
    difficulty: 1
    stem: Which of the following is given in the lecture as another common name for a treaty?
    options:
      - text: A protocol or a convention.
        correct: true
        why: Correct — the lecture lists 'agreements', 'conventions', 'protocols' and 'covenants' as other names treaties can go by.
      - text: A judgment or an advisory opinion.
        why: Wrong — judgments and advisory opinions are outputs of a court, not alternative names for a treaty.
      - text: A resolution or a recommendation.
        why: Wrong — resolutions and recommendations are associated with international organisations in this week's material, not used as alternative names for treaties.
  - key: q206
    type: mcq
    concept: treaties-as-a-source
    difficulty: 2
    stem: A state signs a document titled "Exchange of Letters" with another state, setting out mutual obligations both intend to be legally binding. Under this week's material, could this be a treaty?
    options:
      - text: Yes — the name of the document doesn't matter; what counts is whether the parties consented to be bound, which an exchange of letters can achieve.
        correct: true
        why: Correct — the lecture explicitly lists 'exchanges of letters' as one of the less common names a treaty can be given, and stresses that what matters is consent to be bound, not the title.
      - text: No — only documents explicitly titled "Treaty" or "Convention" can ever qualify, a proposition that would need to be checked carefully against the facts in issue.
        why: Wrong — this directly contradicts the lecture's point that the name of the document has no bearing on whether it is a treaty.
      - text: No — a treaty can never be made by letter and must always be a single signed instrument.
        why: Wrong — the material specifically names exchanges of letters as a recognised (if less common) treaty form, so this restriction is not supported.
  - key: q207
    type: mcq
    concept: treaties-as-a-source
    difficulty: 3
    stem: What must a State party to an international treaty do about its own domestic law once the treaty binds it?
    options:
      - text: Ensure that its domestic law and practice are consistent with what the treaty requires, and not create laws contrary to the obligation undertaken.
        correct: true
        why: Correct — the lecture is explicit that a treaty party must ensure domestic consistency and must not act, or legislate, contrary to the obligation it has taken on.
      - text: Repeal all existing domestic legislation on the subject matter of the treaty, whether or not it conflicts with the treaty.
        why: Wrong — the requirement is consistency with the treaty, not wholesale repeal of unrelated or already-consistent domestic law.
      - text: Nothing — treaty obligations operate only at the international level and never require any domestic implementation at all.
        why: Wrong — the lecture specifically says the treaty may give guidance on the measures to be taken at the domestic law level, so implementation can matter.
  - key: q208
    type: mcq
    concept: treaties-as-a-source
    difficulty: 2
    stem: Which of the following best describes a "multilateral" treaty, as distinct from a "bilateral" one?
    options:
      - text: A treaty between three or more States, as opposed to one between just two.
        correct: true
        why: Correct — the lecture's own distinction is that bilateral treaties are between two States and multilateral treaties are between three or more.
      - text: A treaty that only international organisations, and never States, can be party to.
        why: Wrong — the multilateral/bilateral distinction is about the number of state parties, not about excluding states from being parties at all.
      - text: A treaty that does not require ratification by any of its parties.
        why: Wrong — ratification requirements are a separate matter from whether a treaty is bilateral or multilateral; both kinds of treaty can require ratification.
      - text: A treaty that automatically becomes customary international law once ten states have signed it.
        why: Wrong — nothing in this week's material links the multilateral/bilateral distinction to an automatic transformation into customary international law.
  - key: q209
    type: mcq
    concept: treaties-as-a-source
    difficulty: 3
    stem: Why does the lecture say treaties are usually the standard way international organisations, like the UN or NATO, are created?
    options:
      - text: Creating an organisation with defined powers and a constitutive structure is something that cannot be done otherwise than by treaty, since the treaty is what explains the organisation's powers.
        correct: true
        why: Correct — the lecture states this cannot be done otherwise than by treaty, using the UN Charter and the NATO founding treaty as examples of the treaty defining the organisation's powers.
      - text: Because customary international law prohibits the creation of organisations by any other legal instrument, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — no such prohibition on custom is mentioned; the point is a practical and structural one about how organisations are typically constituted, not a rule barring alternatives.
      - text: Because the UN Charter and NATO treaty were both drafted before customary international law existed, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — this is a historically incoherent claim not made anywhere in the material, and customary international law long predates both organisations.
  - key: q210
    type: mcq
    concept: treaties-as-a-source
    difficulty: 2
    stem: Under this week's material, can a treaty be concluded between an international organisation and a State, rather than only between two States?
    options:
      - text: Yes — the lecture gives the example of a treaty concluded between States and international organisations, such as the EU.
        correct: true
        why: Correct — the lecture expressly notes treaties can also be concluded by States with international organisations, giving the EU as an example.
      - text: No — only agreements between two or more sovereign States can ever count as treaties, though this would need further support before being accepted.
        why: Wrong — this contradicts the lecture's own statement that international organisations, such as the EU, can also be parties to a treaty in some cases.
      - text: No — international organisations can only be bound by decisions of the UN Security Council, never by treaties.
        why: Wrong — this conflates two entirely different sources (treaties and UN Security Council decisions) and is not supported anywhere in the material.
  - key: q211
    type: mcq
    concept: treaties-as-a-source
    difficulty: 4
    contrasts-with: [sources-beyond-article-38]
    stem: A student argues "a state can only ever be bound at international law by something it has formally signed and ratified as a treaty." Using this week's material, what is the strongest objection to this claim?
    options:
      - text: This week's material shows states can also be bound by customary international law they never signed anything for, and even by their own unilateral statements, without any treaty at all.
        correct: true
        why: Correct — customary international law and unilateral statements (covered later this week) both show binding obligations can arise without any signed and ratified treaty whatsoever.
      - text: There is no objection — the claim is correct, since treaties are described as the "most direct evidence" of an obligation.
        why: Wrong — "most direct evidence" describes treaties' evidentiary strength relative to other sources, not an exclusive monopoly on how obligations can arise.
      - text: The claim is correct for multilateral treaties, but bilateral treaties never require ratification at all, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — nothing in the material suggests bilateral treaties are exempt from requiring consent through ratification or accession; the real gap in the claim is that non-treaty sources exist at all.
  - key: q212
    type: mcq
    concept: treaties-as-a-source
    difficulty: 1
    stem: What is described as the "most direct evidence of the existence of a legal obligation" among the sources covered this week?
    options:
      - text: A treaty.
        correct: true
        why: Correct — the lecture's own phrase for treaties is that they are the most direct evidence of the existence of a legal obligation, since ratification is easy to check.
      - text: A UN General Assembly declaration.
        why: Wrong — General Assembly declarations are treated as non-binding soft law this week, not as the most direct evidence of an obligation.
      - text: A scholarly article interpreting the law.
        why: Wrong — scholarly writings are a secondary, interpretive source, not the most direct evidence of a state's own binding obligation.
  - key: q213
    type: mcq
    concept: treaties-as-a-source
    difficulty: 3
    stem: Two states sign a document that both intend to be binding, but neither has any domestic legal system requiring ratification. According to this week's material, is consent to be bound still the key question?
    options:
      - text: Yes — what really counts is whether the parties have consented to be bound, whatever domestic procedure (if any) that consent is expressed through.
        correct: true
        why: Correct — the lecture's emphasis throughout is on consent to be bound as the operative test, regardless of the particular domestic formality used to express it.
      - text: No — without a domestic ratification requirement, no document these two states sign can ever be a treaty, though this would need further support before being accepted.
        why: Wrong — the material does not make treaty status depend on a state's domestic ratification procedures existing at all; the focus is on the states' actual consent.
      - text: No — only documents registered with the United Nations Secretariat can be treaties under this week's material.
        why: Wrong — UN registration is not raised anywhere in this week's material as a requirement for treaty status.
  - key: q214
    type: mcq
    concept: treaties-as-a-source
    difficulty: 2
    stem: Why does the lecture treat treaties as usually the "first point of reference" for a court trying to determine a state's obligations?
    options:
      - text: Because it is easy to check whether a state has accepted an obligation through a treaty, by seeing whether it has ratified or become a party to it.
        correct: true
        why: Correct — this matches the lecture's reasoning that treaty consent is straightforward to verify, unlike the more inferential process of establishing custom.
      - text: Because treaties are always shorter and easier to read than customary rules.
        why: Wrong — treaty length has nothing to do with why courts start there; the reason given is ease of verifying consent, not document length.
      - text: Because customary international law can never apply to a dispute once any treaty exists between the parties.
        why: Wrong — this contradicts the material's point that treaty and custom can coexist and apply to the same dispute simultaneously.
  - key: q215
    type: mcq
    concept: treaties-as-a-source
    difficulty: 3
    stem: A treaty requires states to "take all necessary measures" to protect an endangered species, without specifying exactly what those measures must be. What does this week's material suggest about implementing such a provision domestically?
    options:
      - text: The treaty may give only general guidance on the measures to be taken domestically, leaving the state some discretion, provided its domestic law and practice remain consistent with what the treaty requires.
        correct: true
        why: Correct — the lecture notes a treaty may give only general guidance on domestic measures, while still requiring consistency between domestic law and the treaty's requirements.
      - text: General guidance provisions like this are unenforceable and create no binding obligation of any kind, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — a general or discretionary standard does not mean there is no obligation; the state still must ensure consistency with what the treaty requires.
      - text: The state must adopt word-for-word the exact same statute as every other party to the treaty, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — nothing in the material requires identical domestic implementation across all parties; general guidance allows for some variation in how states comply.
  - key: q216
    type: mcq
    concept: treaties-as-a-source
    difficulty: 4
    stem: State A ratifies a treaty establishing an international organisation, then later passes a domestic law that directly contradicts an obligation it undertook in that treaty. What does this week's material say about this?
    options:
      - text: State A shouldn't act or create laws that would be contrary to the obligation it undertook under the treaty, since ratifying the treaty already implied its consent to that obligation.
        correct: true
        why: Correct — the lecture is explicit that a treaty party shouldn't act or create laws contrary to the obligation it has undertaken, precisely because ratification implies consent to that obligation.
      - text: This is permitted, because domestic legislation always overrides a state's own prior treaty commitments at international law, a proposition that would need to be checked carefully against the facts in issue.
        why: Wrong — this is the opposite of the pacta sunt servanda principle covered this week, which requires states to honour, not override, their treaty-based obligations.
      - text: This is irrelevant, because treaties establishing international organisations impose no domestic obligations on member states at all.
        why: Wrong — the material draws no such exception for organisation-founding treaties; the general rule about domestic consistency with treaty obligations still applies.
  - key: q217
    type: mcq
    concept: treaties-as-a-source
    difficulty: 1
    stem: Which of these correctly completes the sentence — "A treaty can be either ___ or multilateral"?
    options:
      - text: Bilateral.
        correct: true
        why: Correct — the lecture's distinction is exactly between bilateral (two states) and multilateral (three or more states) treaties.
      - text: Universal.
        why: Wrong — "universal" is not the term used to contrast with "multilateral" in this week's material; the contrasting term used is "bilateral".
      - text: Regional.
        why: Wrong — "regional" describes a kind of particular custom discussed later this week, not the treaty terminology used to contrast with "multilateral".
  - key: q218
    type: truefalse
    set: quickfire
    concept: treaties-as-a-source
    statement: The name given to a document (treaty, convention, protocol, exchange of letters) determines whether it legally counts as a treaty.
    answer: false
    why: False — the lecture is explicit that what counts is whether the parties consented to be bound, not the label attached to the document.
  - key: q219
    type: truefalse
    set: quickfire
    concept: treaties-as-a-source
    statement: Pacta sunt servanda means that states are bound to honour their treaty-based obligations once they have accepted them.
    answer: true
    why: True — this is the lecture's own definition of pacta sunt servanda, the foundational principle behind treaty obligations being binding.
  - key: q220
    type: truefalse
    set: quickfire
    concept: treaties-as-a-source
    statement: A treaty can only ever be concluded between two or more sovereign States, and never with an international organisation.
    answer: false
    why: False — the lecture expressly notes treaties can, in some cases, also be concluded between States and international organisations, giving the EU as an example.
  # ---------- Concept 3: customary-international-law-elements ----------
  - key: q301
    type: mcq
    concept: customary-international-law-elements
    difficulty: 1
    set: pretest
    stem: What two elements must be present for a customary rule of international law to arise?
    options:
      - text: A general practice among states, and acceptance of that practice as legally binding (opinio juris).
        correct: true
        why: Correct — the lecture's own two-part test is (a) general practice among states and (b) acceptance by states as legally binding, opinio juris sive necessitatis.
      - text: A treaty ratified by a majority of UN member states, and a UN General Assembly resolution endorsing it.
        why: Wrong — treaties and General Assembly resolutions are separate sources; they are not the two elements the lecture identifies for customary international law specifically.
      - text: A decision of the International Court of Justice, and its subsequent approval by the UN Security Council.
        why: Wrong — this describes a completely different process; customary law forms through state practice and opinio juris, not through court decisions being approved by the Security Council.
  - key: q302
    type: mcq
    concept: customary-international-law-elements
    variant-of: q301
    difficulty: 1
    stem: Which of the following is the "subjective" or "psychological" element of customary international law?
    options:
      - text: Opinio juris — the belief that a practice is legally required.
        correct: true
        why: Correct — the lecture labels opinio juris as the subjective-psychological element, the belief of a legal obligation, distinct from the objective element of practice itself.
      - text: State practice — the observable, consistent repetition of a behaviour.
        why: Wrong — practice is described in the lecture as the objective element, because you can simply look at what states do or don't do.
      - text: Ratification of a multilateral treaty on the same subject matter.
        why: Wrong — ratification of a treaty is a distinct act belonging to the law of treaties, not the psychological element of customary law formation.
  - key: q303
    type: mcq
    concept: customary-international-law-elements
    difficulty: 2
    stem: Why does the lecture describe opinio juris as trickier to identify than state practice?
    options:
      - text: States rarely announce why they are acting a certain way, so a belief that conduct is legally required has to be inferred from other actions and statements.
        correct: true
        why: Correct — the lecture makes exactly this point — practice is straightforward to observe, but the belief behind it (opinio juris) often has to be inferred, since states won't necessarily say "we do this because it is law".
      - text: Because state practice changes too quickly for courts to keep track of it, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — the difficulty identified in the lecture is about proving the psychological element, not about the pace at which practice changes.
      - text: Because opinio juris only applies to treaties, not to customary international law.
        why: Wrong — opinio juris is specifically the subjective element required for customary international law, not something confined to treaty law.
  - key: q304
    type: mcq
    concept: customary-international-law-elements
    difficulty: 2
    stem: According to North Sea Continental Shelf, why is habitual conduct alone (like rules of diplomatic ceremonial and protocol) NOT enough to establish opinio juris?
    options:
      - text: Because such acts are "performed almost invariably, but... motivated only by considerations of courtesy, convenience or tradition, and not by any sense of legal duty".
        correct: true
        why: Correct — this is the Court's own reasoning in North Sea Continental Shelf — frequency or habit alone does not show the states involved believed themselves legally bound.
      - text: Because ceremonial and protocol rules are always written down in treaties, so they can never form part of custom.
        why: Wrong — the point made is about the psychological element (belief of legal obligation), not about whether the conduct happens to also be written down somewhere.
      - text: Because the ICJ has no jurisdiction over disputes involving diplomatic ceremonial matters, which is the kind of general claim an exam answer should verify against the source material.
        why: Wrong — jurisdiction is not the issue being discussed; the Court is explaining why frequent conduct alone doesn't prove opinio juris.
  - key: q305
    type: mcq
    concept: customary-international-law-elements
    difficulty: 3
    stem: In Nicaragua v United States of America, why did the ICJ say a state's imperfect compliance with a rule does not necessarily undermine the rule's status as customary international law?
    options:
      - text: Because the Court only requires conduct to be "in general" consistent with the rule, and treats a state's own justification by reference to an exception within the rule as confirming, rather than weakening, that rule.
        correct: true
        why: Correct — this is the Nicaragua Court's own reasoning — practice need not be in absolutely rigorous conformity with the rule, and defending a departure by invoking an exception actually reinforces the rule.
      - text: Because once a rule becomes customary, no state can ever be found to have breached it again.
        why: Wrong — this misreads the case; the Court explicitly contemplates ongoing instances of inconsistent conduct being treated as breaches of the rule, not as impossible or non-existent.
      - text: Because customary international law, unlike treaty law, does not require any consistency of practice at all.
        why: Wrong — consistency is still required; the Court's point is that it need not be absolutely rigorous, not that it is dispensed with entirely.
      - text: Because the Court found that Nicaragua and the United States had signed a treaty resolving the entire dispute.
        why: Wrong — this misstates the case; Nicaragua v United States of America concerned the identification of customary rules on the use of force, not a treaty resolving the dispute.
  - key: q306
    type: mcq
    concept: customary-international-law-elements
    difficulty: 3
    stem: What did North Sea Continental Shelf require of state practice, even over a "short" period of time, for a new customary rule to form?
    options:
      - text: That state practice, including that of states whose interests are specially affected, be "extensive and virtually uniform" within the period in question.
        correct: true
        why: Correct — this is the Court's own formulation; a short period does not bar a new rule from forming, but the practice within it must still be extensive and virtually uniform, especially among specially affected states.
      - text: That every single state in the world act consistently with the rule at least once, which is the kind of general claim an exam answer should verify against the source material.
        why: Wrong — the lecture specifically notes it would be extremely difficult, and is not required, for every state on the planet to have acted in a specific way at least once.
      - text: That the practice be exercised over a period of several hundred years, as was traditionally thought necessary, a proposition that would need to be checked carefully against the facts in issue.
        why: Wrong — North Sea Continental Shelf specifically allows for a short passage of time not being a bar to a new rule forming, contrary to the older, purely long-duration view.
  - key: q307
    type: mcq
    concept: customary-international-law-elements
    difficulty: 2
    stem: In the Asylum Case (Colombia v Peru), why did the ICJ hold that no regional customary rule of diplomatic asylum had been established?
    options:
      - text: Because the practice disclosed "so much uncertainty and contradiction... fluctuation and discrepancy" that no "constant and uniform usage, accepted as law" could be discerned.
        correct: true
        why: Correct — this is the Court's own language explaining why Colombia failed to prove the regional custom it asserted, due to the inconsistency of the underlying practice.
      - text: Because Colombia was not a member of the United Nations at the time of the dispute.
        why: Wrong — UN membership is not the basis of the Court's reasoning; the decision turns on the consistency and uniformity of the underlying diplomatic practice.
      - text: Because diplomatic asylum can only ever be created by treaty, never by custom, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — the Court's reasoning is about whether the elements of custom (consistent, uniform practice, accepted as law) were made out on these facts, not a categorical rule that asylum can never arise from custom.
  - key: q308
    type: mcq
    concept: customary-international-law-elements
    difficulty: 4
    contrasts-with: [persistent-objector-and-particular-custom]
    stem: A student says "once a customary rule is shown to exist, every state on Earth is automatically bound by it, with no exceptions." Using this week's material, what is wrong with this claim?
    options:
      - text: This week's material recognises two exceptions to universal application — the persistent objector rule, and particular (including bilateral) custom binding only some states.
        correct: true
        why: Correct — customary international law elements (practice plus opinio juris) establish that a rule exists, but this week's material separately shows persistent objectors and particular custom can limit who is actually bound.
      - text: There is no flaw in the claim — universal application without exception is exactly what this week's material establishes for customary international law.
        why: Wrong — this ignores the persistent objector rule and particular custom, both expressly covered this week as limits on universal application.
      - text: The claim is wrong because customary international law never actually binds any state until it is also written into a treaty, a proposition that would need to be checked carefully against the facts in issue.
        why: Wrong — this contradicts the entire premise of customary international law as an independent, unwritten source of obligation that need not be reduced to treaty form.
  - key: q309
    type: mcq
    concept: customary-international-law-elements
    difficulty: 1
    stem: Which of the following would count as an example of "state practice" for the purposes of identifying customary international law?
    options:
      - text: A consistent pattern of diplomatic correspondence and executive conduct by states confronted with the same facts.
        correct: true
        why: Correct — the ILC's forms of practice include diplomatic acts and correspondence and executive conduct, matching the objective element the lecture describes.
      - text: A private company's internal policy on how it treats its overseas employees.
        why: Wrong — customary international law concerns state practice; a private company's internal policy is not the conduct of a state for these purposes.
      - text: A university's academic style guide for citing international law cases, though this would need further support before being accepted.
        why: Wrong — this has no connection at all to state conduct or opinio juris and could not contribute to the formation of custom.
  - key: q310
    type: mcq
    concept: customary-international-law-elements
    difficulty: 2
    stem: According to the ILC's Draft conclusions referenced this week, can a failure to react to a practice ever count as evidence of opinio juris?
    options:
      - text: Yes — a failure to react over time may serve as evidence of acceptance as law, provided states were in a position to react and the circumstances called for some reaction.
        correct: true
        why: Correct — this reflects the ILC conclusion cited this week, that omission or inaction can, in the right circumstances, itself evidence acceptance of a rule as binding.
      - text: No — only affirmative public statements can ever count as evidence of opinio juris.
        why: Wrong — this contradicts the ILC conclusion, and the lecture, which both recognise inaction as capable of evidencing opinio juris in the right circumstances.
      - text: No — inaction is only relevant to establishing state practice, and has no bearing on opinio juris at all.
        why: Wrong — the material specifically treats a state's failure to react as potential evidence of the psychological element (opinio juris), not merely of practice.
  - key: q311
    type: mcq
    concept: customary-international-law-elements
    difficulty: 3
    stem: A newly emerging issue (for example, a novel form of environmental harm) produces intense, consistent state reaction within only a few years. Based on North Sea Continental Shelf, could a customary rule form this quickly?
    options:
      - text: Yes — a short passage of time is not necessarily a bar to a new customary rule forming, provided the practice within that period, especially of specially affected states, is extensive and virtually uniform.
        correct: true
        why: Correct — this reflects the Court's holding that duration alone is not decisive; intensity, extent and uniformity of practice within even a short period can be enough.
      - text: No — the traditional view that custom requires hundreds of years of practice remains an absolute rule with no exceptions, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — the lecture and North Sea Continental Shelf both note this traditional view has been superseded; short-period formation is possible with sufficiently intense practice.
      - text: No — customary international law can never apply to a genuinely novel issue that has not arisen before, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — nothing in this week's material excludes novel issues from customary law formation; indeed, the relationship-between-treaties-and-custom material shows new rules of custom can arise around new issues.
  - key: q312
    type: mcq
    concept: customary-international-law-elements
    difficulty: 2
    stem: What does it mean to say the objective element of customary international law is "easier" to establish than the subjective element?
    options:
      - text: You can directly observe what states do or don't do, whereas you must infer their underlying belief that the conduct is legally required.
        correct: true
        why: Correct — this matches the lecture's explanation that practice is straightforward to observe, while opinio juris requires inference from other statements and conduct.
      - text: It means courts are legally required to find state practice before they are allowed to consider opinio juris at all.
        why: Wrong — "easier" describes the comparative difficulty of proof, not a mandatory sequencing rule that a court must follow one element before the other.
      - text: It means the objective element is optional and can be dispensed with if opinio juris is strong enough, though this would need further support before being accepted.
        why: Wrong — both elements are required; the objective element being "easier" to establish does not make it optional.
  - key: q313
    type: mcq
    concept: customary-international-law-elements
    difficulty: 4
    stem: A state consistently sends humanitarian aid after natural disasters abroad, a practice followed by many other states as well. Applying this week's material, why would this alone likely NOT amount to a rule of customary international law?
    options:
      - text: Even though the practice is consistent and widespread, states are not shown to believe they are legally obliged to send aid — it looks more like a matter of courtesy or convention than a legal duty, so opinio juris is missing.
        correct: true
        why: Correct — the lecture gives sending humanitarian aid as its own example of a well-established practice that is not, without more, a legal obligation, precisely because opinio juris (belief of legal duty) is missing.
      - text: Because humanitarian aid can never, under any circumstances, become customary international law, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — the point made is that this particular practice currently lacks opinio juris, not that this category of conduct is permanently incapable of ever forming custom.
      - text: Because customary international law only applies to disputes about the use of force or the law of the sea.
        why: Wrong — nothing in this week's material limits customary international law to those two subject areas; the two-element test applies generally.
  - key: q314
    type: mcq
    concept: customary-international-law-elements
    difficulty: 3
    stem: In North Sea Continental Shelf, why did the practice of "specially affected states" matter more than practice generally?
    options:
      - text: Because the rule at issue (continental shelf delimitation) mainly concerns coastal states, so their practice is more probative of whether the rule has crystallised than that of landlocked states with no opportunity to practise it.
        correct: true
        why: Correct — the lecture notes that landlocked states don't have the chance to develop practice on delimiting a territorial sea, so the practice of coastal (specially affected) states carries more weight for this particular rule.
      - text: Because only specially affected states are bound by any customary rule, regardless of their level of interest in the subject.
        why: Wrong — the "specially affected states" idea concerns evidentiary weight in identifying whether a rule has formed, not a rule that only those states end up bound by it.
      - text: Because landlocked states are legally prohibited from ever contributing practice to the formation of custom on any topic, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — this overstates the point; landlocked states could still contribute practice on other rules, they simply have less opportunity to practise a rule specific to coastal delimitation.
  - key: q315
    type: mcq
    concept: customary-international-law-elements
    difficulty: 2
    stem: Which best captures the relationship between "practice" and "opinio juris" as this week's material presents it?
    options:
      - text: Both elements are required together; practice without a belief of legal obligation is not enough, and a stated belief unsupported by consistent practice is not enough either.
        correct: true
        why: Correct — the lecture insists on treating the two elements separately and both being necessary, warning against collapsing them into just one or the other.
      - text: Opinio juris alone is sufficient to establish a customary rule, even with no supporting state practice whatsoever.
        why: Wrong — this ignores the objective element requirement; a belief with no underlying consistent practice does not establish custom.
      - text: Practice alone is sufficient to establish a customary rule, even where states show no belief that the conduct is legally required.
        why: Wrong — this is exactly the error the diplomatic ceremonial and humanitarian aid examples warn against — consistent practice without opinio juris is not custom.
  - key: q316
    type: mcq
    concept: customary-international-law-elements
    difficulty: 1
    stem: Which Latin phrase describes the subjective/psychological element of customary international law?
    options:
      - text: Opinio juris sive necessitatis.
        correct: true
        why: Correct — this is the exact phrase the lecture and slides use for the belief-of-legal-obligation element of customary international law.
      - text: Pacta sunt servanda, though this would need further support before being accepted.
        why: Wrong — this Latin phrase relates to treaties being honoured once accepted, not to the psychological element of customary international law.
      - text: Res judicata, though this would need further support before being accepted.
        why: Wrong — this phrase describes a general principle of law (a matter already judged), not the subjective element of custom.
  - key: q317
    type: mcq
    concept: customary-international-law-elements
    difficulty: 4
    stem: A tribunal is asked whether a rule limiting the use of a shared river has become customary international law between several riparian states. Using North Sea Continental Shelf and Nicaragua together, which approach best matches this week's material?
    options:
      - text: Check whether practice among the specially affected (riparian) states has been extensive and virtually uniform even over a relatively short period, is generally consistent rather than in rigorous conformity, and whether departures were treated by other states as breaches rather than as recognising a new rule — then separately check for a belief that the practice is legally required.
        correct: true
        why: Correct — this combines North Sea Continental Shelf's requirements on extensiveness, uniformity and specially affected states with Nicaragua's tolerance for imperfect compliance treated as breach, plus the separate opinio juris inquiry.
      - text: Simply count how many riparian states have ever acted consistently with the proposed rule, with no need to consider whether any state believed itself legally bound.
        why: Wrong — this omits the opinio juris requirement entirely, which both cases and the lecture treat as an independent, necessary element alongside practice.
      - text: Assume the rule cannot be customary unless it has existed, unchanged, for at least a century, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — North Sea Continental Shelf specifically rejects an inflexible duration requirement of this kind, provided practice within a shorter period is sufficiently intense and uniform.
  - key: q318
    type: truefalse
    set: quickfire
    concept: customary-international-law-elements
    statement: Customary international law requires both a general practice among states and acceptance of that practice as legally binding.
    answer: true
    why: True — this two-element test (state practice plus opinio juris) is the lecture's own definition of how customary international law arises.
  - key: q319
    type: truefalse
    set: quickfire
    concept: customary-international-law-elements
    statement: According to Nicaragua v United States of America, state practice must be in absolutely rigorous conformity with a rule for that rule to count as customary international law.
    answer: false
    why: False — the Court expressly held that practice need not be in absolutely rigorous conformity with the rule; it is enough that conduct is, in general, consistent with it.
  - key: q320
    type: short
    concept: customary-international-law-elements
    difficulty: 3
    prompt: |
      Explain the two elements required to establish a rule of customary international law, and analyse the
      statement: "in addition to being consistent and widespread, practice must unfold over a long period of time
      for a new customary rule to be established."
    model: |
      Customary international law requires two elements. First, a general practice among states — consistent
      repetition of a particular behaviour when states are confronted with the same facts (the objective element).
      Second, acceptance of that practice by states as legally binding — opinio juris sive necessitatis — a belief
      that the conduct is legally required, not merely a matter of courtesy, convenience or tradition (the
      subjective element). Neither is sufficient alone: consistent but merely habitual conduct, like diplomatic
      ceremonial or sending humanitarian aid, is not custom without a belief of legal duty, and a stated belief
      unsupported by consistent practice is equally insufficient.

      The statement that practice must unfold over "a long period of time" should be rejected in its absolute
      form. North Sea Continental Shelf held that "the passage of only a short period of time is not necessarily,
      or of itself, a bar to the formation of a new rule of customary international law", provided that, within
      the period in question, however short, state practice — including that of states whose interests are
      specially affected — is "extensive and virtually uniform" in the sense of the rule invoked. This departs
      from the traditional view that custom needs practice exercised over very long periods, sometimes hundreds of
      years. What matters is the intensity, extent and uniformity of the practice within whatever period exists,
      not the sheer length of that period as such — a rule can, in principle, crystallise quickly if the practice
      supporting it (particularly among the states most affected by the rule) is sufficiently strong.

      Consistency and uniformity remain necessary, however: Nicaragua v United States of America confirms that
      practice need not be in absolutely rigorous conformity, but a state's inconsistent conduct must generally be
      treated as a breach of the rule rather than as evidence of a new one for the rule to survive, and the Asylum
      Case shows that sufficiently uncertain, contradictory practice will defeat a custom claim regardless of how
      long it has continued. Duration, then, is one input into whether practice is sufficiently established, but
      it is not an independent, fixed requirement with a minimum length attached.
    rubric:
      - id: r1
        criterion: Correctly states and explains both elements of customary international law (practice and opinio juris).
        marks: 2
        top-band: Distinguishes the objective and subjective elements precisely, using the correct Latin terminology.
        margin-note: Clear, accurate statement of the test.
        authorities: []
      - id: r2
        criterion: Uses North Sea Continental Shelf to reject the claim that a long period of time is always required.
        marks: 2
        top-band: Quotes or accurately paraphrases the "short period... not necessarily... a bar" holding and the extensive/virtually uniform requirement.
        margin-note: Directly engages with and critically analyses the tutorial statement.
        authorities: []
      - id: r3
        criterion: Explains what does matter instead of raw duration (extent, uniformity, specially affected states).
        marks: 1
        top-band: Ties intensity and uniformity of practice, especially among specially affected states, to how quickly a rule can crystallise.
        margin-note: Good — shows understanding of what duration is a proxy for.
        authorities: []
      - id: r4
        criterion: Notes that consistency/uniformity is still required even though absolute duration is not, using Nicaragua and/or Asylum.
        marks: 2
        top-band: Uses Nicaragua's "in general consistent" standard and/or Asylum's failure on inconsistent practice to show duration is not a substitute for consistency.
        margin-note: Nicely balances the critical analysis on both sides of the claim.
        authorities: []
  # ---------- Concept 4: persistent-objector-and-particular-custom ----------
  - key: q401
    type: mcq
    concept: persistent-objector-and-particular-custom
    difficulty: 1
    set: pretest
    stem: What is the "persistent objector" rule in customary international law?
    options:
      - text: A state that has persistently and consistently objected to a rule from the very beginning of its formation is not bound by it.
        correct: true
        why: Correct — this is exactly the exception the lecture describes, allowing a state to avoid being bound by an otherwise-universal customary rule.
      - text: A rule that any state can invoke at any time to escape a customary obligation it no longer wishes to comply with.
        why: Wrong — the objection must be raised from the very beginning of the rule's formation, not invoked belatedly once the rule becomes inconvenient.
      - text: A doctrine allowing the UN Security Council to override any state's customary obligations by resolution, though this would need further support before being accepted.
        why: Wrong — this confuses the persistent objector rule with UN Security Council decisions, which are a completely separate topic covered later this week.
  - key: q402
    type: mcq
    concept: persistent-objector-and-particular-custom
    variant-of: q401
    difficulty: 2
    stem: Why must a persistent objection be raised from the very beginning of a rule's formation, rather than partway through?
    options:
      - text: Because a state that starts complying and only objects once the rule turns out not to be in its interest has not "persistently" objected from the start, and so cannot claim the exception.
        correct: true
        why: Correct — the lecture stresses you need to demonstrate the objection from the beginning of the development of the rule; starting midway and then objecting does not work.
      - text: Because the persistent objector rule only applies to rules that are less than one year old, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — no such time limit is mentioned anywhere in this week's material; the requirement is about objecting from the rule's formation, not a fixed age of the rule.
      - text: Because a persistent objection must be formally registered with the International Law Commission before it takes effect.
        why: Wrong — no such formal registration requirement with the ILC is described in this week's material for persistent objection.
  - key: q403
    type: mcq
    concept: persistent-objector-and-particular-custom
    difficulty: 2
    stem: In Fisheries (United Kingdom v Norway), what did the Court say about the UK's claimed 10-mile rule for closing bays?
    options:
      - text: There was not enough state practice to establish it as a rule of customary international law at all, and even if there had been, Norway would not have been bound by it.
        correct: true
        why: Correct — the Court found the rule had not achieved customary status, and separately noted Norway's consistent rejection would have excluded it even if the rule had existed.
      - text: The rule clearly existed as customary international law, and bound every state including Norway without exception.
        why: Wrong — this misstates the outcome; the Court found insufficient practice to establish the rule, and Norway would have been excused as a persistent objector regardless.
      - text: The rule existed only as between the UK and its Commonwealth members, but not as a universal rule.
        why: Wrong — no such Commonwealth-specific finding appears in the case; the actual finding concerned insufficient general practice and Norway's persistent objection.
  - key: q404
    type: mcq
    concept: persistent-objector-and-particular-custom
    difficulty: 3
    stem: Why does the persistent objector rule matter for reconciling customary international law with the idea that international law is based on consent?
    options:
      - text: Without a way to opt out of a rule under formation, a state could become bound by customary law it never consented to, which would be in tension with international law's consent-based foundation.
        correct: true
        why: Correct — the lecture makes this connection explicitly — allowing persistent objection reconciles the fact that states are only bound by what they agree to be bound with, with the reality that custom can otherwise bind states without their individual agreement.
      - text: Because persistent objection is the only way any state can ever be bound by a rule of customary international law in the first place, a proposition that would need to be checked carefully against the facts in issue.
        why: Wrong — this gets it backwards; persistent objection is an exception that lets a state avoid being bound, not the mechanism by which states normally become bound by custom.
      - text: Because the persistent objector rule replaced the requirement of opinio juris entirely, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — opinio juris remains a required element for the underlying rule to be custom at all; persistent objection is a separate, additional exception once a rule exists.
  - key: q405
    type: mcq
    concept: persistent-objector-and-particular-custom
    difficulty: 2
    stem: What does "particular customary international law" mean, as distinct from the general/universal kind?
    options:
      - text: A customary rule that binds only a limited group of states, such as a regional custom, or even a custom existing between just two states.
        correct: true
        why: Correct — the lecture defines particular custom exactly this way, contrasted with a rule that binds every state universally.
      - text: A customary rule adopted formally by a vote of the UN General Assembly, a proposition that would need to be checked carefully against the facts in issue.
        why: Wrong — a General Assembly vote is associated with soft law resolutions this week, not with how particular (regional or bilateral) custom is formed.
      - text: A customary rule that only applies during wartime and not in peacetime.
        why: Wrong — the wartime/peacetime distinction is not what "particular" refers to in this week's material; it refers to the limited group of states bound, not the timing of application.
  - key: q406
    type: mcq
    concept: persistent-objector-and-particular-custom
    difficulty: 2
    stem: In Right of Passage over Indian Territory (Portugal v India), what did the ICJ find about the right of passage to Portugal's enclave?
    options:
      - text: A customary right of passage had crystallised between Portugal and India specifically, based on centuries of consistent practice, even without any treaty establishing it.
        correct: true
        why: Correct — the Court accepted that the long, consistent practice between just these two states supported a customary right of passage binding as between them.
      - text: No customary rule of any kind could ever bind only two states, so Portugal's claim necessarily failed, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — this is the opposite of the actual holding; the case is the leading authority precisely for particular custom binding as few as two states.
      - text: The right of passage existed only because it had been written into a bilateral treaty between Portugal and India.
        why: Wrong — the case specifically notes there was no treaty between the states establishing the right of passage; it arose from custom, not treaty.
  - key: q407
    type: mcq
    concept: persistent-objector-and-particular-custom
    difficulty: 3
    stem: What does Right of Passage over Indian Territory show about the minimum number of states needed to establish a customary rule?
    options:
      - text: A customary rule can exist and bind as few as two states, provided their practice meets the ordinary requirements of consistency and acceptance as law between them.
        correct: true
        why: Correct — this is the significance the lecture attaches to the case — particular (including bilateral) custom is possible alongside general, universal custom.
      - text: A customary rule can never bind fewer than a majority of UN member states, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — this contradicts the case directly, which recognises a customary rule binding only two states, Portugal and India.
      - text: A customary rule requires at least three states before it can be considered "particular" rather than "universal".
        why: Wrong — the case shows even two states are enough for a particular, bilateral custom; there is no minimum of three.
  - key: q408
    type: mcq
    concept: persistent-objector-and-particular-custom
    difficulty: 4
    contrasts-with: [customary-international-law-elements]
    stem: A student writes — "Once a court finds the elements of practice and opinio juris are satisfied, the analysis of who is bound is automatically finished." Why is this an incomplete answer on these facts?
    options:
      - text: Finding practice and opinio juris only establishes that a rule of customary international law exists; a separate step is needed to ask whether it is universal or particular, and whether any state has persistently objected to it.
        correct: true
        why: Correct — this week's material treats the two-element test (practice plus opinio juris) as establishing that a customary rule exists, while the scope of who is bound is a further, distinct question this concept addresses.
      - text: The student is correct, and no further analysis of who is bound by a customary rule is ever required once it is shown to exist.
        why: Wrong — this ignores the whole point of the persistent objector rule and particular custom, both of which qualify who is actually bound once a rule is shown to exist.
      - text: The student is wrong because practice and opinio juris are themselves sufficient to prove a persistent objection exists.
        why: Wrong — practice and opinio juris go to whether the underlying rule exists at all, not to whether a specific state has persistently objected to it, which is a separate inquiry.
  - key: q409
    type: mcq
    concept: persistent-objector-and-particular-custom
    difficulty: 3
    stem: Norway rejected the UK's claimed 10-mile bay-closing rule from the very start and always used its own baseline method instead. Why does this matter under the persistent objector rule, even though the Court also found the rule was not customary at all?
    options:
      - text: Because the Court's reasoning shows the persistent objector rule operates as an alternative, independent basis for excusing Norway — even if the rule had achieved customary status, consistent, early objection would still have excluded Norway from it.
        correct: true
        why: Correct — this reflects the Court's own approach of giving two separate reasons Norway would not be bound — absence of a customary rule at all, and, in the alternative, persistent objection.
      - text: It doesn't matter, since a finding that no customary rule exists automatically makes the persistent objector rule irrelevant to the case, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — the Court in fact discussed persistent objection as a second, independent line of reasoning, showing its relevance even where a rule's existence is doubtful.
      - text: It matters only because Norway is a permanent member of the UN Security Council, which grants it special customary exemptions, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — Norway's Security Council status (in fact, Norway is not a permanent member) has nothing to do with the persistent objector rule, which is available to any state that objects consistently from the start.
  - key: q410
    type: mcq
    concept: persistent-objector-and-particular-custom
    difficulty: 1
    stem: Which of these is a genuine exception to the general rule that customary international law binds all states, according to this week's material?
    options:
      - text: The persistent objector rule.
        correct: true
        why: Correct — this is one of the two exceptions to universal application identified this week, alongside particular custom.
      - text: The rule that only permanent members of the UN Security Council can ever be bound by custom.
        why: Wrong — no such rule exists in this week's material; customary international law can bind any state, not only Security Council permanent members.
      - text: The rule that customary international law never binds any state unless it has also ratified a treaty on the same subject.
        why: Wrong — this contradicts the entire premise of customary international law as an independent source that can bind states without any treaty at all.
  - key: q411
    type: mcq
    concept: persistent-objector-and-particular-custom
    difficulty: 2
    stem: A small group of neighbouring states develops a consistent regional practice, believed by all of them to be legally required, that does not exist anywhere else in the world. According to this week's material, could this still be customary international law?
    options:
      - text: Yes — customary international law can be particular rather than universal, including a regional rule binding only that group of states.
        correct: true
        why: Correct — the lecture is explicit that particular custom includes regional rules binding only a limited group of states, not only universal rules binding everyone.
      - text: No — customary international law must always be practised by a majority of all states in the world to exist at all.
        why: Wrong — this contradicts the recognised category of particular (including regional) custom, which can exist among a small group of states.
      - text: No — a regional practice can only ever become binding if it is first adopted as a treaty by those states, though this would need further support before being accepted.
        why: Wrong — the material shows particular custom can arise from practice and opinio juris among the relevant states without any treaty at all.
  - key: q412
    type: mcq
    concept: persistent-objector-and-particular-custom
    difficulty: 3
    stem: Why does the lecture describe successful invocation of the persistent objector rule as "rare"?
    options:
      - text: Maintaining a consistent objection from the very beginning of a rule's formation can be very resource-intensive, so states will typically only do it where it is strongly in their interest not to recognise the rule.
        correct: true
        why: Correct — the lecture notes it can be very intensive in terms of resources to maintain, so states only do it when it is really much in their interest not to recognise the rule.
      - text: Because international courts have ruled the persistent objector doctrine is no longer valid law, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — nothing in this week's material suggests the doctrine has been abolished; Fisheries remains the leading authority applying it.
      - text: Because persistent objection requires unanimous agreement from every other state in the world before it can take effect.
        why: Wrong — persistent objection is a unilateral position a state maintains against a developing rule; it does not require the agreement of other states.
  - key: q413
    type: mcq
    concept: persistent-objector-and-particular-custom
    difficulty: 4
    stem: A state begins complying with an emerging customary rule for several years, then, once the rule proves inconvenient, declares it has "always objected" to it. Applying Fisheries, would this state likely succeed as a persistent objector?
    options:
      - text: Unlikely — the objection needs to be raised and maintained from the beginning of the rule's formation; a late declaration made only once the rule becomes inconvenient does not meet that requirement.
        correct: true
        why: Correct — this matches the lecture's warning that starting midway, or realising later that a rule is not in your interest, and then claiming persistent objector status does not work.
      - text: Yes — any objection at any point in time, however late, automatically qualifies a state as a persistent objector.
        why: Wrong — this contradicts the requirement that the objection be raised from the very beginning of the rule's development, which this state's years of prior compliance would undermine.
      - text: Yes, but only if the state is a permanent member of the UN Security Council, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — Security Council membership has no bearing on eligibility for the persistent objector rule, which turns on the timing and consistency of the objection itself.
  - key: q414
    type: mcq
    concept: persistent-objector-and-particular-custom
    difficulty: 2
    stem: Which of the following best distinguishes "particular custom" from the "persistent objector" rule?
    options:
      - text: Particular custom describes a rule that only ever binds a limited group of states from the outset, while the persistent objector rule describes a state escaping a rule that would otherwise bind it universally.
        correct: true
        why: Correct — particular custom is about the scope a rule was formed to have, while the persistent objector rule is about an individual state opting out of an otherwise universal rule.
      - text: They are simply two different names for exactly the same legal concept, with no difference in application.
        why: Wrong — the two concepts operate differently — one concerns rules formed with limited scope, the other concerns individual states excluding themselves from an otherwise universal rule.
      - text: Particular custom applies only to treaties, while the persistent objector rule applies only to customary international law.
        why: Wrong — particular custom is itself a form of customary international law, not a treaty concept; both ideas are about the scope and application of customary rules.
  - key: q415
    type: mcq
    concept: persistent-objector-and-particular-custom
    difficulty: 1
    stem: According to Fisheries (United Kingdom v Norway), did Norway calculate its territorial sea using the UK's proposed method?
    options:
      - text: No — Norway consistently used straight baselines drawn between the outermost points of its coastline instead of the UK's proposed 10-mile rule.
        correct: true
        why: Correct — this reflects the facts — Norway's indented coastline led it to use straight baselines, rejecting the UK's proposed 10-mile closing-line rule.
      - text: Yes — Norway fully adopted the UK's proposed 10-mile rule from the outset of the dispute, which is the kind of general claim an exam answer should verify against the source material.
        why: Wrong — this is the opposite of the facts; Norway consistently rejected the 10-mile rule and used its own baseline method instead.
      - text: Yes, but only for bays wider than 10 miles, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — Norway's baseline method was applied generally along its coastline, not selectively depending on the width of a particular bay.
  - key: q416
    type: mcq
    concept: persistent-objector-and-particular-custom
    difficulty: 3
    stem: If a new state emerges after a customary rule has already crystallised and become binding on the rest of the world, can that new state claim persistent objector status?
    options:
      - text: Not straightforwardly — the objection must be raised from the beginning of the rule's formation, and a rule that has already crystallised before the state even existed leaves no such window to object during its formation.
        correct: true
        why: Correct — this follows from the requirement that the objection be maintained from the outset of the rule's development, which a newly emerged state, by definition, could not have done for an already-settled rule.
      - text: Yes, automatically — every new state is presumed to be a persistent objector to every pre-existing customary rule unless it says otherwise.
        why: Wrong — there is no such automatic presumption in this week's material; persistent objector status requires an actual, consistent objection from the rule's formation.
      - text: Yes, but only if the new state was previously a colony of a state that had objected, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — no such colonial-succession exception to the persistent objector rule is described in this week's material.
  - key: q417
    type: mcq
    concept: persistent-objector-and-particular-custom
    difficulty: 4
    stem: Comparing Fisheries and Right of Passage, what is the key structural difference in how each case limits the reach of customary international law?
    options:
      - text: Fisheries limits reach through an individual state's exclusion from an otherwise general rule (persistent objection), while Right of Passage extends reach only to the specific states whose own practice created the particular custom in the first place.
        correct: true
        why: Correct — Fisheries is about a state opting out of a rule that (had it existed) would otherwise bind it, while Right of Passage is about a rule that was only ever formed as between the two relevant states.
      - text: There is no structural difference — both cases apply exactly the same legal doctrine to identical facts.
        why: Wrong — the two cases raise genuinely distinct doctrines (persistent objection versus particular/bilateral custom), even though both qualify who is bound by customary international law.
      - text: Fisheries concerns treaty law, while Right of Passage concerns customary international law exclusively, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — both cases concern customary international law; Fisheries specifically addresses the customary status (and persistent objector exception) of the claimed 10-mile rule.
  - key: q418
    type: truefalse
    set: quickfire
    concept: persistent-objector-and-particular-custom
    statement: A state can only claim persistent objector status if it objected to a rule consistently from the very beginning of its formation.
    answer: true
    why: True — the lecture is explicit that the objection needs to be raised from the beginning of the development of the rule, not partway through once it becomes inconvenient.
  - key: q419
    type: truefalse
    set: quickfire
    concept: persistent-objector-and-particular-custom
    statement: Customary international law can never bind fewer than three states at once.
    answer: false
    why: False — Right of Passage over Indian Territory shows a customary rule can bind as few as two states, as a particular custom.
  - key: q420
    type: truefalse
    set: quickfire
    concept: persistent-objector-and-particular-custom
    statement: In Fisheries (United Kingdom v Norway), the Court found there was sufficient state practice to establish the UK's claimed 10-mile rule as customary international law.
    answer: false
    why: False — the Court found there was not enough state practice to establish the 10-mile rule as customary international law at all.
  - key: q421
    type: short
    concept: persistent-objector-and-particular-custom
    difficulty: 3
    prompt: |
      Explain the persistent objector rule and the concept of particular customary international law, using Fisheries
      (United Kingdom v Norway) and Right of Passage over Indian Territory (Portugal v India) to illustrate each.
    model: |
      Customary international law generally binds every state once its elements — general practice and opinio
      juris — are established. This week's material recognises two exceptions to that universal reach.

      The first is the persistent objector rule: a state that has persistently and consistently objected to a
      rule from the very beginning of its formation is not bound by it. In Fisheries (United Kingdom v Norway),
      the ICJ found the UK's claimed 10-mile rule for closing bays had not, on the evidence, achieved the status
      of customary international law at all. But the Court added, in the alternative, that even had the rule
      existed, Norway had consistently and from the outset rejected any attempt to apply it to the Norwegian
      coast, always calculating its territorial sea by straight baselines instead — so Norway would not have been
      bound regardless. This shows the objection must be maintained from the beginning of the rule's development;
      a state cannot comply for years and then, once the rule becomes inconvenient, retroactively claim it always
      objected.

      The second exception is particular customary international law: a customary rule need not be universal, and
      can instead bind only a limited group of states, including as few as two. In Right of Passage over Indian
      Territory (Portugal v India), the ICJ accepted that, even in the absence of any treaty, Portugal's
      centuries-long, consistent practice of accessing its enclave through Indian territory had crystallised into
      a customary right of passage binding as between Portugal and India specifically — a rule that need never
      apply to any other state.

      Both exceptions ultimately serve the same underlying idea that international law is based on consent: the
      persistent objector rule lets a state that never accepted a rule opt out of it, while particular custom
      confines a rule's binding force to the states whose own practice and acceptance actually produced it.
    rubric:
      - id: r1
        criterion: Correctly states the persistent objector rule and its timing requirement.
        marks: 2
        top-band: Explains that the objection must be raised and maintained from the very beginning of the rule's formation.
        margin-note: Precise statement of the rule and its limits.
        authorities: []
      - id: r2
        criterion: Correctly applies Fisheries (United Kingdom v Norway) to the persistent objector rule.
        marks: 2
        top-band: Notes both the primary finding (no customary rule existed) and the alternative persistent objector reasoning.
        margin-note: Good use of the case's two-limbed reasoning.
        authorities: []
      - id: r3
        criterion: Correctly explains particular customary international law and applies Right of Passage over Indian Territory.
        marks: 2
        top-band: Explains a custom can bind as few as two states and ties this directly to Portugal and India's centuries-long practice.
        margin-note: Clear application of the case to the concept.
        authorities: []
      - id: r4
        criterion: Links both exceptions back to the consent-based foundation of international law.
        marks: 1
        top-band: Explains how each exception reconciles universal custom with a state's individual consent.
        margin-note: Nice synthesis tying the two ideas together.
        authorities: []
  # ---------- Concept 5: relationship-between-treaties-and-custom ----------
  - key: q501
    type: mcq
    concept: relationship-between-treaties-and-custom
    difficulty: 1
    stem: According to the Nicaragua case, can a rule of international law exist in both a treaty and as a rule of custom at the same time?
    options:
      - text: Yes — a rule of international law may be contained in a treaty and be a rule of custom simultaneously.
        correct: true
        why: Correct — this is the exact proposition the lecture attributes to Nicaragua, that treaty and customary rules are not mutually exclusive.
      - text: No — a rule can only ever exist in one of those two forms, never both.
        why: Wrong — this directly contradicts the lecture's account of Nicaragua, which recognises a rule can have a separate existence in both a treaty and in custom.
      - text: No — once a rule is written into a treaty, any pre-existing customary version of it automatically disappears.
        why: Wrong — the material shows the opposite — a treaty can codify a customary rule without extinguishing the customary rule's separate existence.
  - key: q502
    type: mcq
    concept: relationship-between-treaties-and-custom
    variant-of: q501
    difficulty: 2
    stem: Which three relationships between a treaty and customary international law does this week's material identify?
    options:
      - text: A treaty may codify a pre-existing custom, crystallise a developing custom, or give rise to an entirely new rule of custom.
        correct: true
        why: Correct — these are the three relationships drawn from Nicaragua and North Sea Continental Shelf — codification, crystallisation, and generation of new custom.
      - text: A treaty may replace, suspend, or permanently terminate any customary rule on the same subject, though this would need further support before being accepted.
        why: Wrong — none of these three outcomes (replace, suspend, terminate) matches the codify/crystallise/generate framework the material actually describes.
      - text: A treaty may ratify, amend, or repeal a customary rule, in the same way domestic legislation can amend prior statutes.
        why: Wrong — this borrows domestic legislative concepts (ratify, amend, repeal a rule) that do not match how the material describes treaties interacting with custom.
  - key: q503
    type: mcq
    concept: relationship-between-treaties-and-custom
    difficulty: 2
    stem: What does it mean for a treaty to "crystallise" a developing rule of custom?
    options:
      - text: The treaty prompts an intense practice by states around the rule, helping complete the process of the rule becoming settled as customary international law.
        correct: true
        why: Correct — this matches the lecture's description of crystallisation — the treaty will help crystallise a rule because it will prompt an intense practice by states.
      - text: The treaty converts a rule of custom into a rule that no longer needs any state practice to be maintained.
        why: Wrong — crystallisation describes the treaty helping to complete the custom's formation through prompting practice, not eliminating the practice requirement altogether.
      - text: The treaty freezes the rule permanently so it can never develop or change in the future.
        why: Wrong — nothing in the material suggests crystallisation makes a rule immune to further development; it describes completion of formation, not permanent fixation.
  - key: q504
    type: mcq
    concept: relationship-between-treaties-and-custom
    difficulty: 2
    stem: What is the classic example this week's material uses to show a rule existing as both a treaty rule and a customary rule?
    options:
      - text: The right to self-defence, found both in customary international law and in Article 51 of the UN Charter.
        correct: true
        why: Correct — the lecture repeatedly uses self-defence as the worked example of a rule existing in both custom and the UN Charter.
      - text: The rule that treaties must be registered with the UN Secretariat before taking effect.
        why: Wrong — this registration requirement is not the example used; the worked example throughout the lecture is the right to self-defence.
      - text: The jus cogens prohibition on genocide, found in both the Genocide Convention and customary international law.
        why: Wrong — while jus cogens norms can also exist in both custom and treaty, this is not the example this week's material actually works through for the treaty-custom relationship.
  - key: q505
    type: mcq
    concept: relationship-between-treaties-and-custom
    difficulty: 3
    stem: Why does it matter that the right to self-defence exists both as a customary rule and in UN Charter Article 51?
    options:
      - text: A state that is not party to the UN Charter would still have a right to self-defence, because the customary rule exists independently of the treaty.
        correct: true
        why: Correct — the lecture draws exactly this conclusion — if the right existed only in the UN Charter, only parties to the Charter would have it, but because it is also customary, non-parties are covered too.
      - text: It means the UN Charter's Article 51 is void, because the same rule cannot appear twice in international law, though this would need further support before being accepted.
        why: Wrong — this misunderstands the point; the material treats coexistence of the two versions of the rule as entirely valid, not as invalidating either one.
      - text: It means every state must formally ratify the UN Charter before it can ever exercise a right of self-defence, a proposition that would need to be checked carefully against the facts in issue.
        why: Wrong — this is precisely what the coexistence of the customary rule avoids — a state doesn't need Charter ratification to have the right, because it also exists in custom.
  - key: q506
    type: mcq
    concept: relationship-between-treaties-and-custom
    difficulty: 2
    stem: Can the treaty version and the customary version of the same underlying right have different specifications?
    options:
      - text: Yes — the rule in a treaty will have certain specification, and the rule that evolves through custom may have a different specification.
        correct: true
        why: Correct — the lecture explicitly notes the two versions of a rule (treaty and custom) can carry different specifications, even while addressing broadly the same right.
      - text: No — a treaty rule and a customary rule on the same subject must always be word-for-word identical, though this would need further support before being accepted.
        why: Wrong — this contradicts the lecture's point that the two versions can differ in their specific content, even while covering the same general right.
      - text: No — once a treaty is adopted, any customary rule on the same subject is automatically amended to match it exactly.
        why: Wrong — nothing in the material suggests a treaty automatically rewrites the content of a parallel customary rule; the two retain separate existences and specifications.
  - key: q507
    type: mcq
    concept: relationship-between-treaties-and-custom
    difficulty: 4
    stem: A newly negotiated treaty addresses a completely novel technological issue that states have never before had to regulate. Over the following years, states widely and consistently adopt practices matching the treaty's approach, believing themselves legally bound to do so. What has likely occurred?
    options:
      - text: The treaty has given rise to a new rule of customary international law, since the treaty prompted a practice on a relatively newly emerged issue that did not previously exist.
        correct: true
        why: Correct — this matches the third relationship this week's material identifies — a treaty generating an entirely new customary rule where a practice on a genuinely new issue develops around the treaty provision.
      - text: Nothing legally significant has occurred, because treaties can never generate new customary rules under any circumstances, which is the kind of general claim an exam answer should verify against the source material.
        why: Wrong — this directly contradicts the third treaty-custom relationship described this week, where a treaty gives rise to a new rule of customary law.
      - text: The treaty has been automatically superseded and is no longer in force, because a customary rule cannot coexist with the treaty that helped create it.
        why: Wrong — nothing in the material suggests a treaty ceases to apply once a parallel customary rule develops from it; the two continue to coexist.
  - key: q508
    type: mcq
    concept: relationship-between-treaties-and-custom
    difficulty: 3
    stem: What is the difference between a treaty "codifying" a pre-existing custom and a treaty "crystallising" a developing custom?
    options:
      - text: Codification writes down a rule of custom that already fully exists, while crystallisation helps complete the formation of a rule that was still developing when the treaty was concluded.
        correct: true
        why: Correct — codification presupposes the custom already exists, whereas crystallisation describes the treaty helping a still-forming rule reach completion through the practice it prompts.
      - text: There is no real difference; codification and crystallisation are simply two different words for exactly the same process.
        why: Wrong — the material treats them as two distinct relationships, alongside a third (generating an entirely new rule), precisely because they describe different stages of a custom's development.
      - text: Codification only applies to bilateral treaties, while crystallisation only applies to multilateral treaties, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — nothing in the material ties codification or crystallisation to the number of parties to the treaty; the distinction is about the state of the underlying custom, not the treaty's form.
  - key: q509
    type: mcq
    concept: relationship-between-treaties-and-custom
    difficulty: 2
    stem: North Sea Continental Shelf and Nicaragua are both cited this week for which shared point?
    options:
      - text: That a treaty rule and a rule of customary international law can relate to and coexist with each other in more than one way.
        correct: true
        why: Correct — both cases are cited for the treaty-custom relationship (codification, crystallisation, generation of new custom), even though North Sea Continental Shelf is separately important for the elements of customary law.
      - text: That customary international law was formally abolished by both judgments in favour of treaty law alone.
        why: Wrong — neither case abolishes customary international law; both instead confirm treaty and custom can coexist and interact.
      - text: That the UN Charter automatically overrides all customary international law wherever the two conflict.
        why: Wrong — neither case establishes a general rule that the UN Charter overrides all custom; the self-defence example instead shows the two existing in parallel.
  - key: q510
    type: mcq
    concept: relationship-between-treaties-and-custom
    difficulty: 1
    stem: If a state has NOT ratified a treaty containing a particular rule, could it still be bound by that same rule?
    options:
      - text: Yes — if the same rule also exists as a matter of customary international law, the non-party state could still be bound by the customary version.
        correct: true
        why: Correct — this is exactly the point the self-defence example illustrates — non-parties to the UN Charter are still bound by (and benefit from) the customary version of the right.
      - text: No — a state can never be bound by any rule contained in a treaty it has not ratified, under any circumstances, though this would need further support before being accepted.
        why: Wrong — while it's true the treaty itself doesn't bind non-parties, the same rule can independently exist and bind the state as custom, which this week's material treats as entirely possible.
      - text: No — treaties automatically bind every state in the world once a majority of states have ratified them, a proposition that would need to be checked carefully against the facts in issue.
        why: Wrong — treaties bind only their actual parties; a non-party could only be bound via a separate source such as customary international law, not through the treaty extending to it by majority vote.
  - key: q511
    type: mcq
    concept: relationship-between-treaties-and-custom
    difficulty: 3
    stem: A state argues "since we are not party to the relevant treaty, we owe no obligation of any kind on this subject." What should a well-prepared answer check before accepting this?
    options:
      - text: Whether the same rule also exists as customary international law, since a non-party can still be bound by (or benefit from) a customary rule with the same content.
        correct: true
        why: Correct — this is the core exam-use point of the treaty-custom relationship material — non-party status defeats the treaty claim, but not necessarily a parallel customary claim.
      - text: Nothing further — once a state is confirmed as a non-party to the treaty, the analysis is complete and no obligation can exist, though this would need further support before being accepted.
        why: Wrong — this stops the analysis too early and ignores that the same rule might independently exist and bind the state as customary international law.
      - text: Whether the state is a permanent member of the UN Security Council, since only permanent members can ever be bound by non-treaty sources.
        why: Wrong — Security Council membership is irrelevant to whether a customary rule binds a state; any state can be bound by customary international law regardless of Council status.
  - key: q512
    type: mcq
    concept: relationship-between-treaties-and-custom
    difficulty: 4
    stem: A regional treaty on maritime delimitation is signed by ten coastal states, and shortly afterwards several non-party states in the same region start adopting identical delimitation practices out of a belief they are legally required to. What might this suggest, applying this week's material?
    options:
      - text: The treaty may be crystallising, or even generating, a new customary rule beyond its own parties, if the practice by non-parties is sufficiently consistent and accompanied by genuine opinio juris.
        correct: true
        why: Correct — this combines the treaty-custom relationship material (a treaty prompting intense practice, potentially generating new custom) with the elements of customary law needed to confirm it (consistent practice plus opinio juris).
      - text: Nothing — a treaty can never influence the practice or beliefs of states that are not party to it, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — this contradicts the whole premise of a treaty crystallising or generating custom, which by definition can extend the rule's practical reach beyond the treaty's own parties.
      - text: The non-party states have automatically become parties to the treaty simply by copying its approach.
        why: Wrong — adopting similar practices does not make a state a treaty party; if anything, it points towards an independent customary obligation, not treaty accession by conduct.
  - key: q513
    type: mcq
    concept: relationship-between-treaties-and-custom
    difficulty: 2
    stem: Which of the following is NOT one of the three ways this week's material says a treaty can relate to customary international law?
    options:
      - text: A treaty may permanently extinguish any customary rule that conflicts with it.
        correct: true
        why: Correct — extinguishing a conflicting custom is not one of the three relationships identified; the three are codifying, crystallising, and generating a new rule of custom.
      - text: A treaty may codify a pre-existing rule of custom, though this would need further support before being accepted.
        why: Wrong — codification is expressly one of the three recognised relationships between a treaty and custom.
      - text: A treaty may crystallise a developing rule of custom.
        why: Wrong — crystallisation is expressly one of the three recognised relationships between a treaty and custom.
  - key: q514
    type: mcq
    concept: relationship-between-treaties-and-custom
    difficulty: 3
    stem: Why is it important, in an exam answer, to check whether a treaty rule "codifies" an existing custom rather than assuming the treaty is the sole source of the obligation?
    options:
      - text: If the rule is also customary, it may still apply to non-party states, and the treaty text can be read alongside the pre-existing customary content it is reflecting, rather than treated as creating the obligation from nothing.
        correct: true
        why: Correct — recognising codification matters precisely because it shows the treaty is capturing an obligation that already independently bound states through custom, which affects who else the rule might reach.
      - text: It is not important, because codified rules automatically stop being customary international law once written into a treaty.
        why: Wrong — codification does not extinguish the customary version of the rule; both this week's material and ordinary practice treat the two as coexisting.
      - text: It is not important, because only jus cogens rules can ever be codified by treaty.
        why: Wrong — codification is a general possibility for any customary rule reflected in a treaty, not something confined to peremptory (jus cogens) norms.
  - key: q515
    type: mcq
    concept: relationship-between-treaties-and-custom
    difficulty: 1
    stem: According to this week's material, is it accurate to say a treaty and a customary rule on the same topic are always in competition with each other?
    options:
      - text: No — they can coexist, with a treaty potentially codifying, crystallising, or generating the very customary rule it addresses.
        correct: true
        why: Correct — the material treats treaty and custom as capable of mutual reinforcement and coexistence, not automatic competition.
      - text: Yes — whenever a treaty and a custom cover the same subject, one of the two is always rendered void, though this would need further support before being accepted.
        why: Wrong — this contradicts the lecture's central point that a rule can be both a treaty rule and a customary rule simultaneously.
      - text: Yes, but only where the treaty was concluded after the custom already existed, a proposition that would need to be checked carefully against the facts in issue.
        why: Wrong — even in that scenario (codification), the material treats the two as coexisting rather than one voiding the other.
  - key: q516
    type: mcq
    concept: relationship-between-treaties-and-custom
    difficulty: 3
    stem: If Australia and New Zealand are both parties to a treaty containing a rule that also exists as customary international law, and a third state that is not a treaty party breaches the same rule, which source could still be invoked against it?
    options:
      - text: The customary version of the rule, since it can bind the non-party state independently of the treaty.
        correct: true
        why: Correct — because the rule exists as customary international law as well as in the treaty, the non-party state can still be held to the customary version, even though the treaty itself does not bind it.
      - text: No source at all — a state that is not party to the relevant treaty cannot be held to any version of the rule whatsoever.
        why: Wrong — this ignores that the same rule's customary version can independently bind the non-party state, which is exactly the point of the treaty-custom coexistence material.
      - text: Only a UN Security Council resolution could bind the non-party state in this situation.
        why: Wrong — a Security Council resolution is a separate mechanism covered elsewhere this week; the material's actual answer here is the parallel customary rule, not a Council resolution.
  - key: q517
    type: mcq
    concept: relationship-between-treaties-and-custom
    difficulty: 4
    stem: A tribunal must decide whether a right in a multilateral treaty also exists independently as customary international law, so that it can be applied to a non-party state. What combination of this week's concepts should the tribunal apply?
    options:
      - text: First ask whether the treaty codified, crystallised, or generated a rule of custom (this concept); then separately test whether that customary version actually satisfies the two elements of practice and opinio juris (customary-international-law-elements); and finally check whether the non-party state is, in any event, a persistent objector.
        correct: true
        why: Correct — this correctly sequences the treaty-custom relationship inquiry, the underlying elements test for the customary rule itself, and the persistent objector qualification, drawing on all three related concepts from this week.
      - text: Simply confirm the non-party state signed the treaty, since signature alone is sufficient to bind it regardless of ratification, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — signature without ratification does not bind a non-party state to a treaty, and this approach ignores the customary international law analysis entirely.
      - text: Assume the rule cannot apply to the non-party state under any circumstances, since only treaty parties can ever be bound by rights contained in a treaty.
        why: Wrong — this ignores the possibility, central to this week's material, that the same right exists independently as a customary rule capable of binding non-parties.
  - key: q518
    type: truefalse
    set: quickfire
    concept: relationship-between-treaties-and-custom
    statement: A rule of international law can exist as both a treaty rule and a rule of customary international law at the same time.
    answer: true
    why: True — the Nicaragua case confirms a rule can be contained in a treaty and be a rule of custom simultaneously, each with a separate existence.
  - key: q519
    type: truefalse
    set: quickfire
    concept: relationship-between-treaties-and-custom
    statement: A state that is not party to the UN Charter has no right of self-defence at all.
    answer: false
    why: False — because the right to self-defence also exists as a rule of customary international law, a non-party state would still have the right through custom, independently of the Charter.
  - key: q520
    type: short
    concept: relationship-between-treaties-and-custom
    difficulty: 2
    prompt: |
      Using the right to self-defence as an example, explain the three ways a treaty rule and a rule of customary
      international law can relate to each other.
    model: |
      A rule of international law can be contained in a treaty and be a rule of custom simultaneously; the two are
      not mutually exclusive. This week's material, drawing on Nicaragua v United States of America and North Sea
      Continental Shelf, identifies three relationships. First, a treaty may codify a pre-existing rule of custom,
      simply writing down in treaty form an obligation that already independently bound states through practice
      and opinio juris. Second, a treaty may crystallise a developing rule of custom: by prompting an intense
      practice among states around the treaty's terms, the treaty helps a still-forming customary rule complete
      its formation. Third, a treaty may give rise to an entirely new rule of customary international law, where a
      genuinely new issue is addressed by the treaty and the practice generated around it develops into custom in
      its own right, independently of the treaty.

      The right to self-defence illustrates why this matters. It exists as a rule of customary international law,
      and it is also expressly recognised in Article 51 of the UN Charter as a right of individual or collective
      self-defence. Because the customary and treaty versions coexist rather than one displacing the other, a
      state that is not a party to the UN Charter would still have a right of self-defence, since it can rely on
      the customary rule independently. The two versions need not even be identical: the rule found in the treaty
      may carry a certain specification, while the rule that has evolved through custom may carry a different
      one, so the source relied upon can affect the exact content of the right being asserted, even though both
      trace back to the same underlying idea.
    rubric:
      - id: r1
        criterion: Correctly identifies and explains all three relationships (codify, crystallise, generate).
        marks: 3
        top-band: Clearly distinguishes each of the three relationships with an accurate description of what each involves.
        margin-note: Complete and precise coverage of the three relationships.
        authorities: []
      - id: r2
        criterion: Uses the self-defence/Article 51 example accurately to illustrate coexistence.
        marks: 2
        top-band: Explains why coexistence matters for a non-party state's rights, using the self-defence example correctly.
        margin-note: Good, concrete illustration of an abstract point.
        authorities: []
      - id: r3
        criterion: Notes the treaty and customary versions of a rule can carry different specifications.
        marks: 1
        top-band: Explicitly notes the two versions need not be identical in content.
        margin-note: Shows a nuanced understanding beyond simple coexistence.
        authorities: []
  # ---------- Concept 6: general-principles-of-law ----------
  - key: q601
    type: mcq
    concept: general-principles-of-law
    difficulty: 1
    set: pretest
    stem: What does Article 38(1)(c) of the ICJ Statute direct the Court to apply?
    options:
      - text: "The general principles of law recognized by civilized nations."
        correct: true
        why: Correct — this is the exact wording of Article 38(1)(c) quoted on the slides, the source of "general principles of law" as a primary source.
      - text: The unanimous resolutions of the UN General Assembly.
        why: Wrong — General Assembly resolutions are discussed this week as soft law, not as the general principles of law referred to in Article 38(1)(c).
      - text: The domestic constitutions of every UN member state, though this would need further support before being accepted.
        why: Wrong — general principles of law are not simply "every domestic constitution"; they are principles common across different legal systems, transposed to the international level.
  - key: q602
    type: mcq
    concept: general-principles-of-law
    variant-of: q601
    difficulty: 2
    stem: When do international courts and tribunals typically rely on general principles of law?
    options:
      - text: When a dispute cannot be effectively resolved on the basis of a treaty or customary international law.
        correct: true
        why: Correct — the lecture describes general principles as filling gaps where treaty and custom cannot resolve the dispute, making them a last resort rather than a first port of call.
      - text: Whenever a treaty exists on the subject, in preference to applying the treaty itself, though this would need further support before being accepted.
        why: Wrong — this reverses the actual order; general principles are used only once treaty (and custom) fail to resolve the dispute, not in preference to an applicable treaty.
      - text: Only in disputes between two states that have no diplomatic relations with each other.
        why: Wrong — the use of general principles has nothing to do with the state of diplomatic relations between the parties; it depends on whether treaty and custom can resolve the dispute.
  - key: q603
    type: mcq
    concept: general-principles-of-law
    difficulty: 1
    stem: Which of the following is given as an example of a general principle of law recognised by international courts?
    options:
      - text: Good faith.
        correct: true
        why: Correct — good faith is expressly listed alongside equity, res judicata, and the impartiality of judges as an example of a general principle of law.
      - text: The doctrine of binding precedent.
        why: Wrong — binding precedent is a common law doctrine that this week's material specifically says does NOT apply the same way in international law; it is not listed as a general principle here.
      - text: The presumption of innocence in domestic criminal trials.
        why: Wrong — while a related idea exists in some legal systems, this specific presumption is not one of the examples of general principles given in this week's material.
  - key: q604
    type: mcq
    concept: general-principles-of-law
    difficulty: 2
    stem: What criteria does this week's material give for a rule to qualify as a "general principle of law" under Article 38(1)(c)?
    options:
      - text: A decent geographical representation of states recognising it, drawn from different legal traditions (civil law, common law, and others), and the capacity for it to be usefully transposed to international law.
        correct: true
        why: Correct — this matches the lecture's stated criteria — recognition across a good geographical and legal-tradition spread, and usefulness when implemented at the international level.
      - text: Formal adoption by a two-thirds majority vote of the UN General Assembly.
        why: Wrong — a General Assembly vote is not how general principles are identified; they are recognised by their presence across domestic legal systems, not by an international vote.
      - text: Written endorsement by the International Law Commission in a set of binding draft articles.
        why: Wrong — the ILC's role in this week's material relates to codification and progressive development generally, not to a specific procedure for certifying general principles of law.
  - key: q605
    type: mcq
    concept: general-principles-of-law
    difficulty: 2
    stem: In what context does the ICJ often apply "equity" as a general principle of law?
    options:
      - text: When delimiting maritime boundaries between coastal states with opposite or adjacent coasts.
        correct: true
        why: Correct — the lecture and slides give this as the specific example of equity being applied at the international level, in the context of maritime boundary delimitation.
      - text: When determining the amount of compensation payable under a commercial contract, though this would need further support before being accepted.
        why: Wrong — the example given this week for equity is maritime boundary delimitation, not compensation under a commercial contract, which is not discussed in this week's material.
      - text: When deciding whether a treaty has been validly ratified, though this would need further support before being accepted.
        why: Wrong — treaty ratification questions are governed by treaty law, not by the general principle of equity discussed this week in the maritime boundary context.
  - key: q606
    type: mcq
    concept: general-principles-of-law
    difficulty: 3
    stem: Why are general principles of law described as filling "gaps" rather than being a primary point of reference?
    options:
      - text: Because they are relied on specifically when a dispute cannot be effectively resolved by treaty or customary international law, unlike treaties and custom, which are the direct evidence of an obligation in the first place.
        correct: true
        why: Correct — this matches the lecture's framing that general principles come into play precisely where the other two primary sources run out, rather than being consulted first.
      - text: Because general principles are secondary sources, like judicial decisions, rather than primary ones, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — general principles are in fact classified as a primary source (alongside treaties and custom), not a secondary, interpretive one like judicial decisions.
      - text: Because international courts are legally forbidden from applying general principles until a treaty has expired.
        why: Wrong — there is no such rule tying the availability of general principles to a treaty's expiry; they apply whenever treaty and custom cannot resolve the dispute.
  - key: q607
    type: mcq
    concept: general-principles-of-law
    difficulty: 1
    stem: Which of the following is NOT one of the examples of general principles of law given this week?
    options:
      - text: Jus cogens.
        correct: true
        why: Correct — jus cogens is discussed this week as a separate category of peremptory norms, not as one of the listed examples of general principles of law (equity, good faith, res judicata, impartiality of judges).
      - text: Res judicata.
        why: Wrong — res judicata is expressly given as one of the examples of a general principle of law.
      - text: The impartiality of judges.
        why: Wrong — the impartiality of judges is expressly given as one of the examples of a general principle of law.
  - key: q608
    type: mcq
    concept: general-principles-of-law
    difficulty: 2
    stem: Why does a rule need to be recognised across different legal traditions (civil law, common law, and others) before it can count as a general principle of international law?
    options:
      - text: Because the point of a general principle is that it is genuinely common across legal systems generally, not a rule peculiar to just one legal family that happens to be well represented internationally.
        correct: true
        why: Correct — this reflects the lecture's stress on a "decent geographical representation" across different legal systems as part of what makes a principle "general" rather than parochial.
      - text: Because only rules recognised in common law systems can ever qualify as general principles of law, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — this is the opposite of the requirement; the point is breadth across multiple legal traditions, not exclusive reliance on the common law family.
      - text: Because the ICJ Statute specifically names the civil law and common law traditions as the only ones relevant to Article 38(1)(c).
        why: Wrong — the Statute's phrase is "civilized nations" generally, and the lecture's discussion of geographic and legal-tradition spread is broader than naming only these two families.
  - key: q609
    type: mcq
    concept: general-principles-of-law
    difficulty: 4
    stem: A tribunal faces a dispute where no applicable treaty exists between the parties, and the alleged customary rule fails for lack of consistent state practice. According to this week's material, what should the tribunal consider next?
    options:
      - text: Whether a general principle of law — recognised across different legal systems and capable of useful application internationally — can resolve the dispute, since this is exactly the situation in which general principles are meant to be used.
        correct: true
        why: Correct — this is precisely the scenario the lecture describes as the trigger for reaching for general principles of law — treaty and custom both fail to resolve the dispute.
      - text: The tribunal must decline jurisdiction entirely, since no dispute can be resolved once treaty and custom fail, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — the material's whole point is that general principles exist as a further avenue precisely for this situation, rather than requiring the tribunal to give up on resolving the dispute.
      - text: The tribunal should invent a new customary rule immediately to fill the gap, without needing any state practice or opinio juris.
        why: Wrong — this would bypass the two-element test for customary international law entirely; general principles, not an invented custom, are this week's answer to a genuine gap.
  - key: q610
    type: mcq
    concept: general-principles-of-law
    difficulty: 3
    stem: What role does "good faith" play as a general principle of law in the international legal system, based on this week's material?
    options:
      - text: It is one of the recognised general principles that international courts and tribunals may draw on, alongside equity, res judicata and the impartiality of judges.
        correct: true
        why: Correct — good faith is expressly named this week as one of the examples of general principles of law recognised by civilized nations.
      - text: It is a purely political, non-legal concept with no role in the sources of international law at all.
        why: Wrong — the material specifically lists good faith among the recognised general principles of law, giving it a genuine, if gap-filling, legal role.
      - text: It is the same thing as pacta sunt servanda and has no independent existence.
        why: Wrong — while related in spirit, this week's material treats good faith as a separate, listed general principle, distinct from pacta sunt servanda's specific treaty-honouring rule.
  - key: q611
    type: mcq
    concept: general-principles-of-law
    difficulty: 2
    stem: Which statement best captures why general principles of law are classified as a "primary" source under Article 38(1), even though they are used less often than treaty or custom?
    options:
      - text: They are still capable of creating a binding basis for decision in their own right, unlike judicial decisions and scholarly writings, which are only interpretive.
        correct: true
        why: Correct — frequency of use is not the test for primary versus secondary; general principles can themselves supply the substantive basis for a decision, which is what makes them primary.
      - text: They are classified as primary because they are always applied before treaties and custom in every dispute, a proposition that would need to be checked carefully against the facts in issue.
        why: Wrong — this misdescribes the actual practical sequence; general principles are typically reached for only once treaty and custom are exhausted, even though they remain formally a primary source.
      - text: They are classified as primary only because Article 38(1) lists them in the same paragraph as treaties, which is the kind of general claim an exam answer should verify against the source material.
        why: Wrong — general principles appear in a separate sub-paragraph, (c), from treaties in (a); the primary/secondary classification tracks law-creating function, not the paragraph in which a source appears.
  - key: q612
    type: mcq
    concept: general-principles-of-law
    difficulty: 1
    stem: Which of these disputes is the kind of situation this week's material associates with the use of equity as a general principle?
    options:
      - text: Delimiting a maritime boundary between two coastal states with opposite or adjacent coasts.
        correct: true
        why: Correct — this is the exact scenario given this week for the ICJ's use of equity and equitable principles.
      - text: Determining the validity of a state's ratification of a bilateral treaty.
        why: Wrong — treaty ratification validity is governed by the law of treaties, not the equity example given for general principles this week.
      - text: Deciding whether a UN Security Council resolution is binding under Article 25 of the UN Charter.
        why: Wrong — this is a decisions-of-international-organisations question, not the maritime boundary delimitation scenario associated with equity in this week's material.
  - key: q613
    type: mcq
    concept: general-principles-of-law
    difficulty: 3
    stem: A principle is recognised in the domestic law of only one state, and has never been applied at the international level before. According to this week's material, is it automatically a general principle of international law?
    options:
      - text: No — it needs a decent geographical representation across different legal systems, and needs to be capable of being usefully implemented and followed at the international level, neither of which is shown by recognition in just one state.
        correct: true
        why: Correct — the lecture's criteria require broader recognition and international transposability, so a rule confined to a single domestic system does not automatically qualify.
      - text: Yes — any rule recognised in even one domestic legal system automatically becomes a general principle of international law.
        why: Wrong — this ignores the requirement of a decent geographical and legal-tradition spread of recognition, which a single-state rule does not satisfy on its own.
      - text: Yes, but only if that one state is a permanent member of the UN Security Council, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — Security Council membership plays no role in whether a domestic rule qualifies as a general principle of international law under this week's criteria.
  - key: q614
    type: mcq
    concept: general-principles-of-law
    difficulty: 2
    stem: What does "not everything relevant domestically is relevant to international law" mean in the context of general principles of law?
    options:
      - text: Even a widely recognised domestic legal rule must also be capable of being usefully transposed and applied at the international level before it qualifies as a general principle.
        correct: true
        why: Correct — this reflects the second limb of the criteria given this week — geographical/legal-tradition recognition alone is not enough; the principle must also be workable when applied internationally.
      - text: It means domestic law is entirely irrelevant to identifying any source of international law, including custom, which is the kind of general claim an exam answer should verify against the source material.
        why: Wrong — this overstates the point; domestic court decisions and legislation, for example, are treated as forms of state practice relevant to customary international law elsewhere this week.
      - text: It means only rules found in a state's constitution, and not its ordinary statutes, can ever become general principles.
        why: Wrong — the material draws no such distinction between constitutional and ordinary domestic rules when discussing general principles.
  - key: q615
    type: mcq
    concept: general-principles-of-law
    difficulty: 4
    stem: Two states dispute the validity of an arbitral award, and neither an applicable treaty nor a settled customary rule addresses the specific procedural question raised. Which source should an exam answer most plausibly reach for, applying this week's material?
    options:
      - text: A general principle of law, such as res judicata or the impartiality of judges, since these are exactly the kind of gap-filling principles this week's material identifies for situations treaty and custom do not resolve.
        correct: true
        why: Correct — res judicata and the impartiality of judges are both expressly listed examples of general principles of law, well suited to a procedural gap of exactly this kind.
      - text: A brand-new rule of customary international law invented specifically to resolve this dispute, with no supporting state practice, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — this bypasses the two-element test for customary international law; a court cannot simply invent a customary rule without practice and opinio juris.
      - text: The dispute must be dismissed entirely, since no source of international law could possibly apply to a genuinely novel procedural question.
        why: Wrong — the entire purpose of general principles of law, as covered this week, is to supply an answer in exactly this kind of gap, rather than leaving the dispute unresolved.
  - key: q616
    type: mcq
    concept: general-principles-of-law
    difficulty: 1
    stem: According to this week's material, do international courts reach for general principles of law before or after considering treaties and custom?
    options:
      - text: After — general principles are used when a dispute cannot be effectively resolved on the basis of a treaty or customary international law.
        correct: true
        why: Correct — the lecture is clear that general principles come into play once treaty and custom cannot resolve the dispute, not before.
      - text: Before — general principles are always considered first, ahead of any treaty or customary rule.
        why: Wrong — this reverses the order the lecture describes; general principles are a fallback, not a starting point.
      - text: At the same time — courts must always consider all three primary sources simultaneously with equal weight.
        why: Wrong — the lecture frames general principles as used specifically where treaty and custom fail, not as being weighed simultaneously and equally with them from the outset.
  - key: q617
    type: mcq
    concept: general-principles-of-law
    difficulty: 3
    stem: Which of the following best explains why "impartiality of judges" counts as a general principle of law rather than, say, a rule of customary international law?
    options:
      - text: It reflects a principle common to domestic legal systems generally (a matter of legal tradition and structure), rather than a rule that developed through state practice and opinio juris specific to international relations.
        correct: true
        why: Correct — general principles are principles common across legal systems transposed to the international level, distinct from customary rules which develop through the practice and beliefs of states in their international dealings.
      - text: Because judges are never mentioned anywhere in the ICJ Statute, so their impartiality could not possibly be a treaty rule or a customary rule, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — this is factually incorrect (Article 38(1)(c) and other provisions of the ICJ Statute concern judges), and in any case is not the reasoning this week's material gives for classifying impartiality as a general principle.
      - text: Because impartiality of judges is a purely domestic constitutional matter with no relevance to public international law whatsoever, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — the material specifically transposes this principle to the international level as a recognised general principle, so it does have genuine relevance to public international law.
  - key: q618
    type: truefalse
    set: quickfire
    concept: general-principles-of-law
    statement: General principles of law are used by international courts primarily when a dispute cannot be effectively resolved on the basis of a treaty or customary international law.
    answer: true
    why: True — this is exactly the gap-filling role the lecture assigns to general principles, reached for once treaty and custom fail to resolve the dispute.
  - key: q619
    type: truefalse
    set: quickfire
    concept: general-principles-of-law
    statement: Equity, as a general principle of law, is used by the ICJ in the context of delimiting maritime boundaries between coastal states.
    answer: true
    why: True — this is the specific example given this week of equity being applied as a general principle at the international level.
  - key: q620
    type: truefalse
    set: quickfire
    concept: general-principles-of-law
    statement: A rule recognised in only one domestic legal system automatically qualifies as a general principle of international law.
    answer: false
    why: False — the criteria require a decent geographical representation across different legal traditions, which recognition in a single state does not satisfy on its own.
  # ---------- Concept 7: judicial-decisions-and-scholarly-writings ----------
  - key: q701
    type: mcq
    concept: judicial-decisions-and-scholarly-writings
    difficulty: 1
    stem: What does Article 59 of the ICJ Statute say about the binding force of the Court's decisions?
    options:
      - text: "The decision of the Court has no binding force except between the parties and in respect of that particular case."
        correct: true
        why: Correct — this is the exact wording of Article 59 quoted this week, the basis for judicial decisions being a secondary rather than a precedent-creating source.
      - text: The decision of the Court binds every UN member state in all future disputes on the same subject matter.
        why: Wrong — this describes something closer to the common law doctrine of precedent, which the lecture specifically says does not apply to ICJ decisions.
      - text: The decision of the Court is binding only if approved afterwards by the UN General Assembly, though this would need further support before being accepted.
        why: Wrong — no such General Assembly approval requirement is mentioned in Article 59 or anywhere in this week's material.
  - key: q702
    type: mcq
    concept: judicial-decisions-and-scholarly-writings
    variant-of: q701
    difficulty: 2
    stem: Why does Article 59 ICJ Statute limit a judgment's binding force to "the parties" and "that particular case"?
    options:
      - text: It respects the consent-based, non-compulsory nature of the Court's jurisdiction — a state that did not agree to the Court's jurisdiction in a different dispute should not be bound by a ruling it played no part in.
        correct: true
        why: Correct — the lecture ties Article 59 directly to the principle of consent, since the jurisdiction of the Court is not compulsory and a state not before the Court in a given case has not consented to be bound by its outcome.
      - text: Because ICJ judges change too frequently for consistent precedent to be maintained, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — judicial turnover is not the reason given in the material; the explanation offered is the consent-based nature of the Court's jurisdiction.
      - text: Because the ICJ Statute was drafted before the doctrine of precedent had been invented anywhere in the world.
        why: Wrong — the doctrine of precedent already existed in common law systems well before the ICJ Statute was drafted; the reason given is about consent, not historical timing.
  - key: q703
    type: mcq
    concept: judicial-decisions-and-scholarly-writings
    difficulty: 2
    contrasts-with: [article-38-and-sources-of-international-law]
    stem: How does the role of case law in international law differ from its role in a common law system like Australia's?
    options:
      - text: In common law systems, case law is a primary source of law through the doctrine of precedent, whereas in international law a decision has no binding force beyond the parties to that specific case.
        correct: true
        why: Correct — the lecture makes exactly this contrast, noting that while common law relies on the doctrine of precedent, that's "not the case" for international law under Article 59.
      - text: There is no real difference — both systems treat every prior judicial decision as automatically binding in all future, unrelated cases, which is the kind of general claim an exam answer should verify against the source material.
        why: Wrong — this ignores the whole contrast the lecture draws between binding precedent in common law and Article 59's party-specific limitation in international law.
      - text: International law treats case law as more binding than common law does, since ICJ decisions bind every state in the world regardless of participation.
        why: Wrong — this reverses the actual position; ICJ decisions bind only the parties to that case, which is a narrower effect than common law precedent, not a broader one.
  - key: q704
    type: mcq
    concept: judicial-decisions-and-scholarly-writings
    difficulty: 3
    stem: If judicial decisions have no binding force beyond the parties to a case, why does the lecture say the ICJ "rarely departs from its jurisprudence"?
    options:
      - text: Because consistency serves legitimacy, predictability, and the peaceful settlement of disputes, even though decisions are not formally binding as precedent.
        correct: true
        why: Correct — the lecture gives these three reasons for why international judges try to maintain consistency, despite Article 59 meaning no formal precedent doctrine applies.
      - text: Because the ICJ Statute requires the Court to follow its own prior decisions as binding precedent in every subsequent case.
        why: Wrong — this contradicts Article 59, which the lecture specifically distinguishes from a binding doctrine of precedent.
      - text: Because judges who depart from prior decisions can be removed from office by the UN Security Council.
        why: Wrong — no such removal mechanism tied to departing from precedent is mentioned anywhere in this week's material.
  - key: q705
    type: mcq
    concept: judicial-decisions-and-scholarly-writings
    difficulty: 2
    stem: Which of the following is given this week as a reason international judges try to maintain consistency with earlier decisions?
    options:
      - text: Predictability — without consistent jurisprudence, states would be reluctant to bring cases to international courts because of the uncertainty about the outcome.
        correct: true
        why: Correct — this is one of the three reasons given this week (alongside legitimacy and peaceful settlement of disputes) for why international judges try to remain consistent.
      - text: A binding statutory requirement in the UN Charter that all ICJ decisions must be unanimous, which is the kind of general claim an exam answer should verify against the source material.
        why: Wrong — no such unanimity requirement is mentioned in this week's material; consistency is explained by legitimacy, predictability and peaceful settlement, not a unanimity rule.
      - text: Because inconsistent decisions automatically become void under the ICJ Statute, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — there is no such automatic voiding rule for inconsistent decisions in the material; consistency is a matter of practice and policy, not automatic invalidity.
  - key: q706
    type: mcq
    concept: judicial-decisions-and-scholarly-writings
    difficulty: 1
    stem: What does Article 38(1)(d) call scholarly writings?
    options:
      - text: "The teachings of the most highly qualified publicists of the various nations."
        correct: true
        why: Correct — this is the exact phrase from Article 38(1)(d) quoted on the slides for scholarly writings.
      - text: "The binding declarations of the most senior judges of the various nations."
        why: Wrong — this misquotes the provision; it refers to teachings of publicists, not binding declarations of judges, which would confuse scholarly writings with judicial decisions.
      - text: "The official government reports of the most powerful nations, though this would need further support before being accepted."
        why: Wrong — Article 38(1)(d) does not mention government reports; it specifically refers to the teachings of highly qualified publicists, i.e. legal scholars.
  - key: q707
    type: mcq
    concept: judicial-decisions-and-scholarly-writings
    difficulty: 2
    stem: What role do academic interpretations and commentaries of esteemed scholars play under this week's material?
    options:
      - text: They are useful to better understand the law or clarify it where there is ambiguity, without themselves creating binding legal obligations.
        correct: true
        why: Correct — this matches the lecture's description of scholarly writings as a secondary, interpretive source that helps clarify ambiguous law rather than creating new obligations.
      - text: They are binding on states in the same way a ratified treaty is binding, which is the kind of general claim an exam answer should verify against the source material.
        why: Wrong — scholarly writings are expressly classified as secondary and non-law-creating; they are not binding in the way a ratified treaty is.
      - text: They automatically override any conflicting decision of the International Court of Justice.
        why: Wrong — nothing in the material gives scholarly writings priority over ICJ decisions; both are secondary, interpretive sources rather than one overriding the other.
  - key: q708
    type: mcq
    concept: judicial-decisions-and-scholarly-writings
    difficulty: 2
    stem: What kind of body is the International Law Commission (ILC), as described this week?
    options:
      - text: A UN body comprised of elected academics with a geographically representative membership, playing a role in codifying and progressively developing international law.
        correct: true
        why: Correct — the lecture describes the ILC exactly this way — a UN body of elected international law experts, geographically representative, working on codification and progressive development.
      - text: A permanent chamber of the International Court of Justice that issues binding judgments.
        why: Wrong — the ILC is a separate UN body from the ICJ, and it does not issue binding judgments; its outputs (like draft articles) are non-binding until adopted as treaties.
      - text: A private international law firm that represents states before international tribunals, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — the ILC is a UN body, not a private law firm, and its function is codification and development of international law, not representing states in litigation.
  - key: q709
    type: mcq
    concept: judicial-decisions-and-scholarly-writings
    difficulty: 3
    stem: Can an ILC draft article, such as the draft articles on state responsibility, ever become a binding treaty?
    options:
      - text: Yes — eventually, states may negotiate and adopt draft articles, sometimes with changes, turning them into a treaty.
        correct: true
        why: Correct — the lecture explicitly notes draft articles can eventually become treaties once states decide to negotiate and adopt them, potentially with amendments.
      - text: No — ILC draft articles are permanently non-binding and can never be transformed into a treaty under any circumstances.
        why: Wrong — this contradicts the lecture's statement that draft articles can, over time, become treaties once adopted by states.
      - text: No — draft articles automatically become binding customary international law the moment the ILC publishes them, without any further state action.
        why: Wrong — the lecture treats ILC drafts as persuasive and useful for interpretation, not as automatically binding the moment they are published, whether as treaty or custom.
  - key: q710
    type: mcq
    concept: judicial-decisions-and-scholarly-writings
    difficulty: 4
    stem: Given Article 59 ICJ Statute, why might a state still choose to cite a previous ICJ decision heavily in its written and oral submissions, even though that decision does not bind the current tribunal?
    options:
      - text: Because judicial decisions carry substantial interpretative weight and the ICJ rarely departs from its own jurisprudence, so citing consistent prior reasoning is persuasive even without being formally binding.
        correct: true
        why: Correct — this reflects the lecture's point that, despite lacking binding force under Article 59, prior decisions are constantly relied on by judges and practitioners for their persuasive, interpretive weight.
      - text: Because failing to cite a previous decision is a breach of Article 59 that can result in the case being dismissed.
        why: Wrong — Article 59 concerns the binding force of decisions on parties, not any obligation to cite previous case law; there is no such dismissal consequence in the material.
      - text: Because Article 59 requires every party to rely exclusively on prior ICJ decisions and never on treaty or customary arguments.
        why: Wrong — this misstates Article 59 entirely; it says nothing about which sources parties must rely on, only that a decision itself binds only the parties to that case.
  - key: q711
    type: mcq
    concept: judicial-decisions-and-scholarly-writings
    difficulty: 3
    stem: States sometimes invoke past ICJ decisions during bilateral negotiations, outside of any formal litigation. What does this suggest about the practical influence of judicial decisions, according to this week's material?
    options:
      - text: Even without formal binding force, ICJ decisions carry enough authority and consistency that states use them as leverage or reference points in negotiating settlements.
        correct: true
        why: Correct — the lecture specifically notes states invoke ICJ decisions when negotiating dispute settlements, sometimes as a bargaining chip, illustrating their practical influence beyond formal binding force.
      - text: It suggests ICJ decisions are, in fact, formally binding on every state, contradicting Article 59, a proposition that would need to be checked carefully against the facts in issue.
        why: Wrong — using a decision as a negotiating reference point does not mean it is formally binding; Article 59's limitation to the parties and that case remains accurate.
      - text: It suggests states are legally required to settle any dispute the same way the ICJ previously resolved a similar one, a proposition that would need to be checked carefully against the facts in issue.
        why: Wrong — there is no such legal requirement; states retain the freedom to negotiate their own settlement, merely informed or influenced by prior ICJ reasoning.
  - key: q712
    type: mcq
    concept: judicial-decisions-and-scholarly-writings
    difficulty: 2
    stem: Which of the following best explains "legitimacy" as a reason for the ICJ maintaining consistent jurisprudence?
    options:
      - text: Inconsistent jurisprudence would create criticism and undermine the legitimacy of the international adjudicatory system as a whole.
        correct: true
        why: Correct — this is the lecture's own explanation for the legitimacy rationale behind judicial consistency, distinct from the separate predictability and peaceful-settlement rationales.
      - text: Legitimacy means every ICJ judge must be from a different continent to ensure geographic balance.
        why: Wrong — this describes something closer to the ILC's geographically representative membership, not the "legitimacy" rationale for consistent jurisprudence given this week.
      - text: Legitimacy means the ICJ can only hear cases referred to it by the UN Security Council, a proposition that would need to be checked carefully against the facts in issue.
        why: Wrong — this misdescribes the ICJ's jurisdictional basis and has nothing to do with the legitimacy rationale for consistency in its jurisprudence.
  - key: q713
    type: mcq
    concept: judicial-decisions-and-scholarly-writings
    difficulty: 1
    stem: Are decisions of domestic (national) courts ever relevant to identifying international law, according to this week's material?
    options:
      - text: Yes — decisions of national courts can be relevant, for example as a form of state practice or as evidence of opinio juris.
        correct: true
        why: Correct — the lecture notes domestic court decisions can be relevant, for instance as forms of state practice and evidence of opinio juris under the ILC's draft conclusions on custom.
      - text: No — only decisions of the International Court of Justice are ever relevant to international law.
        why: Wrong — this contradicts the lecture's acknowledgment that domestic court decisions can also be relevant, particularly to identifying customary international law.
      - text: No — domestic courts are legally prohibited from ever discussing international law questions, though this would need further support before being accepted.
        why: Wrong — there is no such prohibition; domestic courts regularly engage with international law questions, and their decisions can feed into identifying practice or opinio juris.
  - key: q714
    type: mcq
    concept: judicial-decisions-and-scholarly-writings
    difficulty: 3
    stem: A judge on an international tribunal writes an academic article, in her personal capacity, analysing an unresolved area of international law. Under this week's material, how would this article be classified?
    options:
      - text: As scholarly writing — a secondary, interpretive source, since the material notes scholarly writings can include work by judges acting in an academic capacity.
        correct: true
        why: Correct — the lecture specifically says scholarly writings include "books, articles, reports from scholars, or judges acting in an academic capacity", covering exactly this scenario.
      - text: As a binding judicial decision of the tribunal she sits on, even though it was written in a personal, academic capacity.
        why: Wrong — a personal academic article is not a decision of the tribunal itself; it falls under scholarly writings rather than the tribunal's own judicial decisions.
      - text: As a treaty provision, since it was written by someone who holds judicial office, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — a judge's personal academic article has none of the features of a treaty (an agreement between states); it fits within scholarly writings instead.
  - key: q715
    type: mcq
    concept: judicial-decisions-and-scholarly-writings
    difficulty: 4
    stem: A newly established international tribunal, hearing its very first case, has no prior jurisprudence of its own to be consistent with. According to this week's material, could it still draw on judicial decisions as persuasive authority?
    options:
      - text: Yes — it could draw on decisions of other courts and tribunals, such as the ICJ, since judicial decisions generally carry interpretative weight regardless of which court produced them, even though none of them formally bind the new tribunal.
        correct: true
        why: Correct — the material's broader point about judicial decisions (persuasive but not formally binding weight) is not limited to a court's own prior decisions; other courts' decisions, especially the ICJ's, are also constantly referred to across international adjudication.
      - text: No — a tribunal with no prior decisions of its own can never refer to any judicial decision, from any court, in reaching its first judgment.
        why: Wrong — this is inconsistent with the material's account of judicial decisions carrying broad interpretative weight across international law generally, not just within a single court's own case history.
      - text: No — only decisions of the exact same tribunal can ever be cited as persuasive authority by that tribunal.
        why: Wrong — the lecture discusses judges and practitioners generally referring to previous decisions, without confining this to a court's own past judgments only.
  - key: q716
    type: mcq
    concept: judicial-decisions-and-scholarly-writings
    difficulty: 2
    stem: Which of the following correctly distinguishes "judicial decisions" from "scholarly writings" as sources under Article 38(1)(d)?
    options:
      - text: Judicial decisions are the outputs of courts and tribunals deciding actual disputes, while scholarly writings are the teachings and commentary of academics and publicists analysing the law.
        correct: true
        why: Correct — this matches the basic distinction this week's material draws between the two subsidiary means listed together in Article 38(1)(d).
      - text: Judicial decisions are always binding on every state, while scholarly writings are never referred to by any court, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — judicial decisions are not binding beyond the parties under Article 59, and scholarly writings are in fact regularly referred to by courts for interpretive assistance.
      - text: There is no genuine distinction; the two terms describe exactly the same category of material, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — the material treats them as two distinct (if related) subsidiary sources, one from courts and one from academic commentary.
  - key: q717
    type: mcq
    concept: judicial-decisions-and-scholarly-writings
    difficulty: 3
    stem: A practitioner cites both an ICJ judgment and an ILC draft article in support of the same legal proposition. What best describes the combined weight of these two sources, applying this week's material?
    options:
      - text: Both are secondary, interpretive sources that can reinforce each other's persuasive weight, but neither one, nor their combination, creates a binding obligation the way a treaty or an established customary rule would.
        correct: true
        why: Correct — both ICJ judgments and ILC draft articles are treated as secondary, subsidiary means for interpreting the law, so combining them strengthens persuasive force without converting them into a primary, law-creating source.
      - text: Combining an ICJ judgment with an ILC draft article automatically creates a new, binding treaty between the disputing states, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — nothing in the material suggests combining two secondary sources can create a treaty; treaty formation requires actual state consent to be bound, not citation of secondary sources.
      - text: The ICJ judgment is automatically void once cited alongside an ILC draft article, since only one secondary source can be relied on at a time.
        why: Wrong — there is no such rule limiting reliance to a single secondary source, and citing both together does not void either one.
  - key: q718
    type: truefalse
    set: quickfire
    concept: judicial-decisions-and-scholarly-writings
    statement: Under Article 59 ICJ Statute, an ICJ decision has no binding force except between the parties and in respect of that particular case.
    answer: true
    why: True — this is the exact rule stated in Article 59, and is why ICJ decisions are not treated as binding precedent in future, unrelated cases.
  - key: q719
    type: truefalse
    set: quickfire
    concept: judicial-decisions-and-scholarly-writings
    statement: The doctrine of binding precedent from common law systems applies in exactly the same way to decisions of the International Court of Justice.
    answer: false
    why: False — the lecture is explicit that, unlike common law's doctrine of precedent, an ICJ decision does not bind in later cases, even between the same parties on similar facts.
  - key: q720
    type: short
    concept: judicial-decisions-and-scholarly-writings
    difficulty: 3
    prompt: |
      Discuss the importance of the judgments of international courts and tribunals as a source of international
      law, notwithstanding Article 59 of the ICJ Statute.
    model: |
      As a matter of doctrine, judicial decisions are not, in and of themselves, binding international law. Article
      59 ICJ Statute provides that "the decision of the Court has no binding force except between the parties and
      in respect of that particular case." Unlike a common law system, where case law is a primary source through
      the doctrine of precedent, an ICJ decision does not bind the Court, or any state, in a later case, even
      between the same parties on similar facts. This respects the consent-based, non-compulsory nature of the
      Court's jurisdiction: a state not before the Court in a given dispute has not consented to be bound by its
      outcome.

      Despite this formal limitation, judicial decisions carry substantial practical importance. International
      judges and legal practitioners constantly refer to, and base their reasoning on, previous decisions, and the
      ICJ rarely departs from its own jurisprudence. This consistency is maintained for identifiable reasons:
      legitimacy, since inconsistent jurisprudence would undermine confidence in the international adjudicatory
      system; predictability, since states would be reluctant to bring disputes to international courts if
      outcomes were unpredictable; and the peaceful settlement of disputes, since consistent case law helps
      maintain international peace and stability. States also invoke ICJ decisions outside formal litigation,
      for example as reference points or bargaining chips in bilateral negotiations.

      Judicial decisions are therefore best understood as a secondary source with real, if indirect, importance:
      they do not themselves create binding obligations, but they carry heavy interpretative weight, guide how
      primary sources (treaties, custom and general principles) are understood and applied, and function much like
      persuasive, rather than binding, authority. An exam answer should treat a relevant ICJ decision as strong
      support for how a rule should be interpreted, while being careful never to present it as the binding source
      of the obligation itself.
    rubric:
      - id: r1
        criterion: Correctly states and explains Article 59's limitation on the binding force of ICJ decisions.
        marks: 2
        top-band: Quotes or accurately paraphrases Article 59 and connects it to the Court's non-compulsory, consent-based jurisdiction.
        margin-note: Clear statement of the formal rule.
        authorities: [icj-statute-art-59]
      - id: r2
        criterion: Contrasts the international law position with the common law doctrine of precedent.
        marks: 1
        top-band: Explicitly distinguishes case law as a primary source in common law from its secondary, non-binding status in international law.
        margin-note: Good comparative point.
        authorities: []
      - id: r3
        criterion: Explains at least two of the three reasons (legitimacy, predictability, peaceful settlement) for judicial consistency.
        marks: 3
        top-band: Explains all three reasons accurately and links them to the practical importance of judicial decisions.
        margin-note: Thorough coverage of why consistency matters practically despite the formal rule.
        authorities: []
      - id: r4
        criterion: Concludes with a clear statement of judicial decisions' practical (interpretive/persuasive) rather than formal importance.
        marks: 1
        top-band: Frames judicial decisions as persuasive, interpretive authority rather than a binding source, with appropriate exam-use guidance.
        margin-note: Nice, exam-focused closing point.
        authorities: []
  # ---------- Concept 8: sources-beyond-article-38 ----------
  - key: q801
    type: mcq
    concept: sources-beyond-article-38
    difficulty: 1
    set: pretest
    stem: Which four categories does this week's material identify as being missing from Article 38(1) of the ICJ Statute?
    options:
      - text: Unilateral statements, jus cogens, decisions of international organisations, and soft law.
        correct: true
        why: Correct — these are the four "Part B" categories the slides list as what is missing from Article 38(1) beyond judicial decisions and scholarly writings.
      - text: Treaties, customary international law, general principles of law, and judicial decisions.
        why: Wrong — all four of these are the sources Article 38(1) does list; they are not what is missing from it.
      - text: General principles of law, res judicata, good faith, and equity, though this would need further support before being accepted.
        why: Wrong — these are examples of general principles of law themselves, which is expressly part of Article 38(1)(c), not something missing from the article.
  - key: q802
    type: mcq
    concept: sources-beyond-article-38
    variant-of: q801
    difficulty: 2
    stem: In Legal Status of Eastern Greenland, what made the Norwegian foreign minister's statement to Denmark legally significant?
    options:
      - text: It was an "unconditional and definitive" unilateral statement showing a clear intention to accept an obligation, which the PCIJ held bound Norway even without any treaty or reciprocal undertaking.
        correct: true
        why: Correct — the PCIJ described the Ihlen declaration as unconditional and definitive, and held it created a binding obligation on Norway not to contest Danish sovereignty.
      - text: It was a formal treaty signed by both the Danish and Norwegian heads of state, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — the statement was a unilateral, informal declaration by the Norwegian foreign minister, not a signed treaty between the two heads of state.
      - text: It was subsequently ratified by the Norwegian parliament, which is what gave it legal force.
        why: Wrong — no parliamentary ratification is mentioned in the case; its binding force came from the unilateral statement itself, evidencing a clear intention to be bound.
  - key: q803
    type: mcq
    concept: sources-beyond-article-38
    difficulty: 2
    stem: What did the ICJ hold in the Nuclear Tests Cases about France's public statements regarding atmospheric testing?
    options:
      - text: That the official French statements testified to an intention to be legally bound to cease atmospheric tests, and so amounted to a binding legal undertaking.
        correct: true
        why: Correct — this is the Court's holding, treating the French President's and Foreign Minister's statements as themselves creating a binding obligation to cease testing.
      - text: That the statements were purely political and created no legal obligation of any kind.
        why: Wrong — this is the opposite of the actual holding; the Court found the statements did create a binding legal undertaking.
      - text: That the statements only bound France once Australia and New Zealand formally accepted them in writing.
        why: Wrong — the case specifically holds that no acceptance or reply from other states is required for a unilateral statement to bind the state that made it.
  - key: q804
    type: mcq
    concept: sources-beyond-article-38
    difficulty: 3
    stem: Why is no "acceptance" or reciprocal undertaking from another state required for a unilateral statement to become binding, according to the Nuclear Tests Cases?
    options:
      - text: Because when a state intends to be bound according to the terms of its own declaration, that intention alone confers on it the character of a legal undertaking, based on the principle of good faith.
        correct: true
        why: Correct — the Court's own reasoning is that intention to be bound, expressed through the declaration, is itself sufficient, resting on good faith rather than any need for reciprocity or acceptance.
      - text: Because unilateral statements are not really legal obligations at all, so no acceptance is needed for something non-binding, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — this misdescribes the holding; the Court found the statements did create genuine binding obligations, not that they were non-binding and therefore didn't need acceptance.
      - text: Because the UN Charter specifically exempts nuclear testing announcements from any acceptance requirement, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — no such UN Charter exemption is mentioned; the reasoning is about unilateral statements generally, resting on intention and good faith.
  - key: q805
    type: mcq
    concept: sources-beyond-article-38
    difficulty: 1
    stem: How does Article 53 VCLT define a "peremptory norm" (jus cogens)?
    options:
      - text: "A norm accepted and recognized by the international community of States as a whole as a norm from which no derogation is permitted and which can be modified only by a subsequent norm of general international law having the same character."
        correct: true
        why: Correct — this is the exact wording of Article 53 VCLT quoted this week for the definition of jus cogens.
      - text: A norm adopted by a two-thirds majority vote of the UN Security Council, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — Article 53 VCLT does not define jus cogens by reference to a Security Council vote; it refers to acceptance and recognition by the international community of States as a whole.
      - text: A norm that any single state can create simply by declaring it to be peremptory.
        why: Wrong — Article 53 requires recognition by the international community of States as a whole, not unilateral declaration by a single state.
  - key: q806
    type: mcq
    concept: sources-beyond-article-38
    difficulty: 2
    stem: Which of the following examples does the ILC identify as a jus cogens norm, according to this week's material?
    options:
      - text: The prohibition on genocide.
        correct: true
        why: Correct — genocide is expressly listed among the ILC's examples of jus cogens norms, alongside crimes against humanity, aggression, slavery, torture and self-determination.
      - text: The rule requiring bays to be closed using a 10-mile rule.
        why: Wrong — this rule (from Fisheries) was found not even to be established as ordinary customary international law, let alone a peremptory jus cogens norm.
      - text: The rule that treaties must be in writing to be valid.
        why: Wrong — this misstates the VCLT definition of a treaty; it is not listed anywhere in this week's material as a jus cogens norm.
  - key: q807
    type: mcq
    concept: sources-beyond-article-38
    difficulty: 3
    stem: What happens, according to this week's material, if a treaty contains even one provision that violates a jus cogens norm?
    options:
      - text: The treaty will be terminated — no treaty can validly contain a provision that violates a jus cogens norm, not even in just one clause.
        correct: true
        why: Correct — the lecture states plainly that not even one provision in an entire treaty can violate a jus cogens norm, and the treaty will be terminated if it does.
      - text: Only that specific provision is removed, while the rest of the treaty remains fully valid and unaffected.
        why: Wrong — the material states the consequence is termination of the treaty, not simply severing the offending clause while leaving the rest intact.
      - text: Nothing happens unless the UN Security Council formally votes to suspend the treaty, a proposition that would need to be checked carefully against the facts in issue.
        why: Wrong — no Security Council vote is described as necessary; the consequence flows directly from the jus cogens norm itself under Article 53 VCLT.
  - key: q808
    type: mcq
    concept: sources-beyond-article-38
    difficulty: 2
    stem: Under Article 25 UN Charter, when do UN Security Council decisions bind member states?
    options:
      - text: Members of the United Nations agree to accept and carry out the decisions of the Security Council in accordance with the Charter.
        correct: true
        why: Correct — this is the exact wording of Article 25, quoted this week as the basis on which Security Council decisions can bind states without their specific consent to each individual decision.
      - text: Only once every single member state has separately ratified that specific Security Council resolution.
        why: Wrong — this would defeat the whole point of Article 25, which allows the Council to bind members through the Charter's constitutive authority, not through resolution-by-resolution ratification.
      - text: Only in disputes concerning the law of the sea or maritime boundaries, which is the kind of general claim an exam answer should verify against the source material.
        why: Wrong — Article 25 is of general application to Security Council decisions, not limited to maritime or law-of-the-sea disputes; the example used this week (Resolution 1373) concerned counter-terrorism.
  - key: q809
    type: mcq
    concept: sources-beyond-article-38
    difficulty: 2
    stem: What did UN Security Council Resolution 1373 (2001) require of member states?
    options:
      - text: To implement various measures in domestic law to suppress the financing and commission of terrorist acts.
        correct: true
        why: Correct — Resolution 1373, adopted weeks after 9/11, required member states to implement domestic measures suppressing the financing and commission of terrorism.
      - text: To immediately withdraw from the Vienna Convention on the Law of Treaties.
        why: Wrong — Resolution 1373 has nothing to do with the VCLT; it concerns counter-terrorism measures in domestic law.
      - text: To recognise a new rule of customary international law regarding maritime boundaries.
        why: Wrong — Resolution 1373 is a counter-terrorism resolution, unconnected to maritime boundaries or customary international law formation.
  - key: q810
    type: mcq
    concept: sources-beyond-article-38
    difficulty: 3
    stem: How do decisions of the International Civil Aviation Organization (ICAO) become binding on contracting states?
    options:
      - text: Technical rules adopted by a two-thirds vote of the ICAO Council become binding on contracting states after about three months, unless a state registers its disapproval within that time.
        correct: true
        why: Correct — the lecture describes this specific mechanism — a two-thirds vote, followed by a period (about three months) in which states can register disapproval before the rules become binding.
      - text: ICAO decisions never bind any state unless that state separately negotiates and signs a new bilateral treaty with ICAO, a proposition that would need to be checked carefully against the facts in issue.
        why: Wrong — this ignores the described mechanism, under which technical rules become binding through the ICAO's own procedure unless a state actively objects within the set period.
      - text: ICAO decisions automatically bind every state in the world, including those that are not contracting states to the relevant convention, a proposition that would need to be checked carefully against the facts in issue.
        why: Wrong — the mechanism described applies to contracting states under the Convention on International Civil Aviation, not to every state in the world regardless of membership.
  - key: q811
    type: mcq
    concept: sources-beyond-article-38
    difficulty: 1
    stem: Is soft law, such as a UN General Assembly declaration, legally binding under international law?
    options:
      - text: No — soft law instruments do not themselves create binding obligations, but they can shape practice, provide evidence of opinio juris, or lead to custom or new treaties.
        correct: true
        why: Correct — the lecture is explicit that soft law does not constitute an independent, binding source, but can still play an important evidentiary and developmental role.
      - text: Yes — every UN General Assembly declaration is automatically binding on all UN member states.
        why: Wrong — this contradicts the lecture's clear statement that such declarations are not legally binding, even though they can shape international practice.
      - text: Yes, but only on the states that voted against the declaration, as a form of penalty, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — there is no such penalty mechanism in the material; non-binding status applies generally, regardless of how any individual state voted.
  - key: q812
    type: mcq
    concept: sources-beyond-article-38
    difficulty: 2
    stem: Which historical example does this week's material give of a soft law instrument leading to binding treaties?
    options:
      - text: The Universal Declaration of Human Rights, which led to the drafting and adoption of the ICCPR and the International Covenant on Economic, Social and Cultural Rights.
        correct: true
        why: Correct — the lecture gives this exact example — a non-binding declaration that progressively resulted in binding treaty commitments through the two Covenants.
      - text: The Vienna Convention on the Law of Treaties, which led to the adoption of the UN Charter, a formulation that might sound plausible but would still need to be tested against what this week's materials actually say.
        why: Wrong — this reverses the chronology and the relationship; the VCLT is itself a binding treaty, not a soft law instrument, and it did not lead to the UN Charter.
      - text: UN Security Council Resolution 1373, which led to the creation of the International Criminal Court.
        why: Wrong — Resolution 1373 concerned counter-terrorism measures and is a binding Security Council decision, not a soft law instrument that led to the ICC's creation.
  - key: q813
    type: mcq
    concept: sources-beyond-article-38
    difficulty: 4
    contrasts-with: [treaties-as-a-source]
    stem: A student argues "a state can only ever be bound by something it has formally agreed to, such as a ratified treaty; a mere public statement, with no other state's agreement, cannot bind it." Using this week's material, what is the strongest objection?
    options:
      - text: Eastern Greenland and the Nuclear Tests Cases both show a state's own unilateral statement, evidencing a clear intention to be bound, can create a binding obligation without any offer, reciprocity, or acceptance by another state at all.
        correct: true
        why: Correct — both cases confirm unilateral statements bind on the basis of the declaring state's own intention and good faith, expressly without needing agreement or reciprocity from anyone else.
      - text: There is no objection; the student's claim accurately reflects this week's material in full, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — this ignores the entire unilateral statements doctrine covered this week, which is specifically designed to show binding obligations can arise without any agreement from another state.
      - text: The objection is that Security Council resolutions always require unanimous agreement from every UN member state before taking effect.
        why: Wrong — this misstates how Security Council decisions bind states under Article 25 UN Charter, which does not require unanimous individual agreement to each resolution, and in any event doesn't address the student's claim about unilateral statements.
  - key: q814
    type: mcq
    concept: sources-beyond-article-38
    difficulty: 2
    stem: Which best captures the practical difference between a "hard law" and a "soft law" instrument, as used this week?
    options:
      - text: Hard law describes legally-binding sources, while soft law describes non-legally binding commitments that can still shape international practice or the law's development.
        correct: true
        why: Correct — this matches the lecture's own contrast between "hard law" (binding sources) and "soft law" (non-binding but still influential commitments).
      - text: Hard law refers only to written instruments, while soft law refers only to oral agreements.
        why: Wrong — the hard law/soft law distinction is about legal bindingness, not about whether the instrument is written or oral; treaties, which are hard law, are typically written, but the distinction is not about form.
      - text: Hard law applies only to human rights treaties, while soft law applies only to environmental treaties.
        why: Wrong — the hard law/soft law distinction cuts across subject areas; the lecture's own examples (the Stockholm and Rio Declarations) are in environmental law but are given as soft, not hard, law.
  - key: q815
    type: mcq
    concept: sources-beyond-article-38
    difficulty: 3
    stem: How can a soft law declaration, despite not being legally binding, still contribute to the formation of customary international law?
    options:
      - text: State conduct in connection with, and public debate around, such declarations can provide evidence of state practice or opinio juris, which may eventually crystallise into a customary rule.
        correct: true
        why: Correct — the lecture explains that even though declarations aren't binding, states debating and acting consistently with them can provide evidence relevant to the two elements of customary international law.
      - text: A soft law declaration automatically becomes customary international law the moment it is adopted by the UN General Assembly, without any further state practice, though this would need further support before being accepted.
        why: Wrong — this skips the two-element test for custom entirely; a declaration itself is not automatically transformed into custom without supporting state practice and opinio juris.
      - text: Soft law declarations have no connection whatsoever to customary international law and can never contribute evidence towards it, a proposition that would need to be checked carefully against the facts in issue.
        why: Wrong — this contradicts the lecture's point that soft law can provide evidence of state practice and opinio juris, even though it is not itself an independent, binding source.
  - key: q816
    type: mcq
    concept: sources-beyond-article-38
    difficulty: 3
    stem: A jus cogens norm is sometimes described as debated over whether it is "a subset of customary international law." What tension does this week's material identify in that debate?
    options:
      - text: A jus cogens norm can be asserted to exist even without the ordinary state practice or state consent that customary international law would normally require, which sits awkwardly with treating it simply as a type of custom.
        correct: true
        why: Correct — the lecture specifically raises this tension — some scholars treat jus cogens as part of custom, others resist this because a jus cogens norm can be asserted without the usual practice/consent evidence custom requires.
      - text: There is no debate at all; every scholar agrees jus cogens is entirely unrelated to customary international law.
        why: Wrong — this contradicts the lecture, which specifically frames this as a live scholarly debate, not a settled non-relationship.
      - text: The debate is about whether jus cogens norms can only be created by treaty, never by any other means, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — this misstates the actual debate described, which concerns jus cogens's relationship to customary international law, not exclusively to treaty-making.
  - key: q817
    type: mcq
    concept: sources-beyond-article-38
    difficulty: 4
    stem: A state makes a unilateral public statement promising to cease a harmful practice, then a UN Security Council resolution later requires all states (including this one) to take the same action, and a widely-ratified soft law declaration on the same issue also exists. Applying this week's material, which of these sources binds the state, and on what basis?
    options:
      - text: Both the unilateral statement (on the basis of its own clear intention to be bound and good faith) and the Security Council resolution (under Article 25 UN Charter) can independently bind the state; the soft law declaration alone does not bind it, though it may provide supporting evidence for how the obligation is understood.
        correct: true
        why: Correct — this correctly applies each of the three "missing" sources — unilateral statements and Article 25 UN Charter decisions can each independently create binding obligations, while the soft law declaration remains non-binding in itself.
      - text: None of the three sources can bind the state, because only a ratified, ordinary treaty under Article 38(1)(a) can ever create an obligation.
        why: Wrong — this ignores the entire premise of this week's "sources beyond Article 38" material, which is that these further mechanisms can create genuinely binding obligations outside ordinary treaty-making.
      - text: Only the soft law declaration binds the state, since it was the most widely ratified of the three instruments, a claim that, however plausible it may sound in isolation, would need to be weighed against the specific wording of the authorities before being relied upon.
        why: Wrong — this misapplies the material; a soft law declaration is expressly described as non-binding regardless of how widely it is supported, unlike the unilateral statement and the Security Council resolution.
  - key: q818
    type: truefalse
    set: quickfire
    concept: sources-beyond-article-38
    statement: A unilateral statement by a state's representative can create a binding legal obligation for that state, without any acceptance or reciprocal undertaking from another state.
    answer: true
    why: True — both Eastern Greenland and the Nuclear Tests Cases confirm a unilateral statement can bind the declaring state through its own clear intention and good faith, with no acceptance from another state required.
  - key: q819
    type: truefalse
    set: quickfire
    concept: sources-beyond-article-38
    statement: Soft law instruments, such as UN General Assembly declarations, are themselves independent, legally binding sources of international law.
    answer: false
    why: False — the lecture is explicit that soft law instruments do not constitute independent sources of international law, even though they may assist in interpreting or developing other recognised sources.
  - key: q820
    type: short
    concept: sources-beyond-article-38
    difficulty: 3
    prompt: |
      "Article 38(1) of the ICJ Statute does not provide an exhaustive list of the sources of international law."
      Explain what other sources beyond Article 38(1) exist, and give an authority for each.
    model: |
      Article 38(1) lists treaties, customary international law, general principles of law, and (as a subsidiary
      means) judicial decisions and scholarly writings — but this week's material identifies four further
      categories that can create or evidence obligations outside that list.

      First, unilateral statements or acts: a state can create a binding obligation for itself through a public
      declaration, without any offer, reciprocity or acceptance from another state. In Legal Status of Eastern
      Greenland, the Permanent Court of International Justice held that the Norwegian foreign minister's statement
      that "the Norwegian Government would not make any difficulty in the settlement of this question" was
      unconditional and definitive, binding Norway not to contest Danish sovereignty over Greenland. The Nuclear
      Tests Cases confirm this applies to modern government statements too: French government declarations of an
      intention to cease atmospheric testing were themselves held to be a legal undertaking, based on the
      principle of good faith.

      Second, jus cogens: peremptory norms "accepted and recognized by the international community of States as a
      whole" from which "no derogation is permitted" (VCLT art 53). The ILC's examples include genocide, crimes
      against humanity, aggression, slavery, torture and self-determination; no treaty provision can validly
      contain one, and a treaty that does will be terminated.

      Third, decisions of international organisations: these can bind states where their constitutive treaty
      provides for it. Article 25 UN Charter makes UN Security Council decisions binding on member states — for
      example, Resolution 1373 (2001), requiring states to implement counter-terrorism measures in domestic law.

      Fourth, soft law: non-legally-binding declarations, such as UN General Assembly resolutions, do not
      themselves create obligations, but can provide evidence of state practice or opinio juris and can develop
      into custom or prompt new treaties — the Universal Declaration of Human Rights, itself non-binding, led to
      the binding ICCPR and ICESCR.
    rubric:
      - id: r1
        criterion: Correctly identifies unilateral statements/acts and supports it with Eastern Greenland and/or Nuclear Tests.
        marks: 2
        top-band: Accurately explains the doctrine and correctly applies at least one of the two cases with an accurate quotation or paraphrase.
        margin-note: Well supported with authority.
        authorities: []
      - id: r2
        criterion: Correctly identifies jus cogens and supports it with VCLT art 53 and appropriate examples.
        marks: 2
        top-band: States the Article 53 definition accurately and gives at least one correct ILC example (e.g. genocide, torture).
        margin-note: Precise use of the statutory definition.
        authorities: [vclt-art-53]
      - id: r3
        criterion: Correctly identifies decisions of international organisations and supports it with UN Charter art 25.
        marks: 1
        top-band: Explains the Article 25 mechanism and gives Resolution 1373 or another correct example.
        margin-note: Correct use of the constitutive-treaty basis for bindingness.
        authorities: [un-charter-art-25]
      - id: r4
        criterion: Correctly identifies soft law and its evidentiary/developmental role, with an example.
        marks: 1
        top-band: Explains soft law is non-binding but can evidence practice/opinio juris or lead to treaties, using the UDHR example.
        margin-note: Nicely distinguishes soft law's indirect influence from direct bindingness.
        authorities: []

pretest: [q101, q301, q401, q601, q801]

cards:
  - type: basic
    concept: article-38-and-sources-of-international-law
    front: Which three sources does Article 38(1) ICJ Statute treat as "primary" sources of international law?
    back: Treaties, customary international law, and general principles of law.
    source: Week 02 Lecture (Live), Slide 2
  - type: basic
    concept: article-38-and-sources-of-international-law
    front: What was Article 38(1) actually drafted to do, according to the lecture, rather than to give a deliberate list of "sources"?
    back: To tell the International Court of Justice what it could use, based on international legal principles, to assess the cases before it.
    source: Week 02 Lecture (Live), 00:04:49-00:05:14
  - type: cloze
    concept: article-38-and-sources-of-international-law
    text: "Article 38(1) is not an {{c1::exhaustive}} list of sources — judicial decisions and scholarly writings are {{c2::secondary}} sources that interpret, rather than create, international law."
    source: Week 02 Lecture (Online), 00:10:46-00:10:52
  - type: basic
    concept: treaties-as-a-source
    front: What is a treaty, according to Article 2(1)(a) VCLT?
    back: "An international agreement concluded between States in written form and governed by international law."
    source: Week 02 Lecture Slides, Slide 4
  - type: basic
    concept: treaties-as-a-source
    front: What does "pacta sunt servanda" mean?
    back: States are bound to honour their treaty-based obligations.
    source: Week 02 Lecture Slides, Slide 4
  - type: apply
    concept: treaties-as-a-source
    scenario: Two states sign an "Exchange of Letters" both intend to be legally binding, but never call it a "treaty".
    answer: It can still be a treaty — the name doesn't matter; what counts is whether the parties consented to be bound.
    source: Week 02 Lecture (Live), 00:15:55-00:16:14
  - type: basic
    concept: customary-international-law-elements
    front: What are the two elements required for customary international law to arise?
    back: A general, consistent practice among states (the objective element), and acceptance of that practice as legally binding — opinio juris (the subjective element).
    source: Week 02 Lecture Slides, Slide 6
  - type: cloze
    concept: customary-international-law-elements
    text: "In {{c1::North Sea Continental Shelf}}, the Court required state practice, including that of specially affected states, to be {{c2::extensive and virtually uniform}}, even over a short period."
    source: Week 02 Lecture Slides, Slide 9
  - type: basic
    concept: customary-international-law-elements
    front: Why did the Asylum Case (Colombia v Peru) fail to establish a regional custom of diplomatic asylum?
    back: The practice disclosed "so much uncertainty and contradiction... fluctuation and discrepancy" that no constant and uniform usage, accepted as law, could be discerned.
    source: Week 02 Lecture Slides, Slide 7
  - type: apply
    concept: customary-international-law-elements
    scenario: Many states consistently send humanitarian aid after disasters abroad, purely out of a sense of courtesy, not legal duty.
    answer: This is consistent state practice but lacks opinio juris, so it is not a rule of customary international law.
    source: Week 02 Lecture (Live), 00:32:42-00:33:08
  - type: basic
    concept: persistent-objector-and-particular-custom
    front: What is the persistent objector rule?
    back: A state that has persistently and consistently objected to a customary rule from the very beginning of its formation is not bound by it.
    source: Week 02 Lecture Slides, Slide 12
  - type: basic
    concept: persistent-objector-and-particular-custom
    front: In Right of Passage over Indian Territory, how many states did the customary right of passage bind?
    back: Only two — Portugal and India — showing particular custom can exist between as few as two states.
    source: Week 02 Lecture Slides, Slide 12
  - type: apply
    concept: persistent-objector-and-particular-custom
    scenario: A state complies with an emerging customary rule for years, then declares — only once the rule becomes inconvenient — that it "always objected".
    answer: This would not succeed as a persistent objection, since the objection must be raised and maintained from the very beginning of the rule's formation.
    source: Week 02 Lecture (Live), 00:42:33-00:42:48
  - type: basic
    concept: relationship-between-treaties-and-custom
    front: What are the three ways a treaty and a rule of custom can relate to each other?
    back: A treaty may codify a pre-existing custom, crystallise a developing custom, or give rise to an entirely new rule of custom.
    source: Week 02 Lecture Slides, Slide 14
  - type: cloze
    concept: relationship-between-treaties-and-custom
    text: "The right to {{c1::self-defence}} exists both as a rule of customary international law and in {{c2::Article 51}} of the UN Charter."
    source: Week 02 Lecture (Live), 00:45:39-00:45:51
  - type: apply
    concept: relationship-between-treaties-and-custom
    scenario: A state that is not a party to the UN Charter is attacked by another state.
    answer: It still has a right of self-defence, because the right also exists as a rule of customary international law, independently of the treaty.
    source: Week 02 Lecture (Live), 00:47:01-00:47:20
  - type: basic
    concept: general-principles-of-law
    front: When do international courts and tribunals typically rely on general principles of law?
    back: When a dispute cannot be effectively resolved on the basis of a treaty or customary international law.
    source: Week 02 Lecture Slides, Slide 15
  - type: basic
    concept: general-principles-of-law
    front: Give two examples of general principles of law mentioned this week.
    back: Equity and good faith (also res judicata and the impartiality of judges).
    source: Week 02 Lecture Slides, Slide 15
  - type: apply
    concept: general-principles-of-law
    scenario: The ICJ must delimit a maritime boundary between two coastal states with opposite coasts, and a mechanical line would be unfair.
    answer: The Court can apply equity as a general principle of law to reach a fair and reasonable result.
    source: Week 02 Lecture Slides, Slide 15
  - type: basic
    concept: judicial-decisions-and-scholarly-writings
    front: What does Article 59 ICJ Statute say about the binding force of a Court decision?
    back: It has no binding force except between the parties and in respect of that particular case.
    source: Week 02 Lecture Slides, Slide 18
  - type: cloze
    concept: judicial-decisions-and-scholarly-writings
    text: "International judges try to maintain consistency for reasons of {{c1::legitimacy}}, {{c2::predictability}}, and the peaceful settlement of disputes."
    source: Week 02 Lecture (Online), 00:06:09-00:06:46
  - type: apply
    concept: judicial-decisions-and-scholarly-writings
    scenario: Australia and France are before the ICJ and the Court rules against Australia; Australia later brings a similar case against a different state.
    answer: The first decision does not bind the Court in the new case, because under Article 59 it only binds the parties to that particular case.
    source: Week 02 Lecture (Online), 00:03:53-00:04:25
  - type: basic
    concept: sources-beyond-article-38
    front: What did the Permanent Court of International Justice hold in Legal Status of Eastern Greenland about the Ihlen declaration?
    back: It was "unconditional and definitive", binding Norway not to contest Danish sovereignty over Greenland.
    source: Week 02 Lecture Slides, Slide 21
  - type: basic
    concept: sources-beyond-article-38
    front: How does Article 53 VCLT define a jus cogens norm?
    back: A norm accepted and recognized by the international community of States as a whole as one from which no derogation is permitted, modifiable only by a subsequent norm of the same character.
    source: Week 02 Lecture Slides, Slide 23
  - type: cloze
    concept: sources-beyond-article-38
    text: "Under Article {{c1::25}} of the UN Charter, members agree to accept and carry out the decisions of the {{c2::Security Council}}."
    source: Week 02 Lecture Slides, Slide 24
  - type: apply
    concept: sources-beyond-article-38
    scenario: The UN General Assembly adopts a declaration that no state treats as legally binding, but many states start acting consistently with it out of a belief it reflects the law.
    answer: The declaration itself remains non-binding soft law, but the resulting state practice and opinio juris could contribute to a new rule of customary international law.
    source: Week 02 Lecture (Online), 00:31:38-00:32:05

audio:
  title: "Week 2 recap — sources of international law"
  minutes: 3
  script: |
    This week is about where international law actually comes from. We start with Article 38(1) of the ICJ
    Statute, which lists treaties, customary international law, and general principles of law as primary,
    law-creating sources, and judicial decisions and scholarly writings as secondary, law-interpreting ones.
    But the article wasn't really drafted to give us a clean list — it just tells the Court what it can apply —
    and it isn't exhaustive, so there's more to come.

    Treaties are an agreement between States, in writing, governed by international law, whatever you call them —
    agreement, convention, protocol. What matters is consent: if a state ratifies a treaty, pacta sunt servanda
    means it's bound to honour it, and must keep its domestic law consistent with it.

    Custom is trickier. It needs a general, consistent state practice, plus opinio juris — a belief the practice
    is legally required, not just courtesy. Neither has to be perfect: in Nicaragua, the Court said practice only
    needs to be "in general" consistent, and a state excusing a breach by pointing to an exception actually
    confirms the rule. In North Sea Continental Shelf, even a short period of practice can be enough, provided
    it's extensive and uniform, especially among specially affected states. But the Asylum Case shows practice
    that's too inconsistent just won't cut it.

    Once a rule of custom exists, it usually binds everyone — but not always. A persistent objector, like Norway
    in Fisheries, can escape a rule it rejected from the very start. And custom can be particular rather than
    universal — Right of Passage over Indian Territory shows a custom can bind as few as two states, Portugal and
    India. Treaty and custom aren't rivals either: a treaty can codify, crystallise, or even generate a rule of
    custom, which is why the right of self-defence exists both in custom and in Article 51 of the UN Charter,
    binding states whether or not they've joined the Charter.

    General principles — equity, good faith, res judicata — are a last resort, used when treaty and custom can't
    resolve a dispute. Judicial decisions don't bind anyone beyond the parties to that case, under Article 59, but
    the ICJ rarely departs from its own reasoning, for legitimacy, predictability, and peaceful settlement.
    Scholarly writings and the International Law Commission help interpret the law the same way.

    And Article 38 isn't the end of the story. States can bind themselves through unilateral statements alone, as
    Norway did over Eastern Greenland and France did over nuclear testing. Jus cogens norms, like the prohibition
    on genocide, can never be overridden by treaty. Security Council decisions can bind states under Article 25 of
    the Charter. And soft law, like the Universal Declaration of Human Rights, isn't binding itself, but can shape
    practice and eventually harden into treaties or custom.
