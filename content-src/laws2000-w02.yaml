  - slug: article-38-and-sources-of-international-law
    title: Article 38(1) and the sources of international law
    visual: palace
    visual-brief: Four chambers in order — treaties, custom, general principles, then a subsidiary chamber for judicial decisions and scholarly writings — labelled primary vs secondary.
