    body: |
      A treaty is "an international agreement concluded between States in written form and governed by
      international law" (VCLT art 2(1)(a)) — an agreement between sovereign states, and in some cases
      international organisations (e.g. the EU), that is binding at international law. Treaties are also called
      'agreements', 'conventions', 'protocols' or 'covenants', and less commonly 'exchanges of letters': the
      label doesn't matter, what counts is whether the parties consented to be bound. Treaties may be bilateral or
      multilateral.

      Pacta sunt servanda: states are bound to honour their treaty-based obligations. Becoming a party implies
      consent to be bound by the treaty's obligations, which is why a treaty is the most direct evidence of a
      legal obligation — it is easy to see whether a state accepted it by checking whether it ratified or became
      a party. A state party must ensure its own domestic law and practice are consistent with what the treaty
      requires; treaties are also the standard way international organisations are created (the UN Charter
      creates the UN and sets out its powers; NATO the same way).

      Exam use: once a treaty applies between the relevant states, it is usually the first and strongest point of
      reference — check ratification or accession before reaching for custom or general principles, since a
      state's consent to a specific written obligation is the clearest evidence of what it agreed to be bound by.
  - slug: customary-international-law-elements
    title: Customary international law — practice and opinio juris
    visual: simulation
    visual-brief: Two dials, "consistency/generality/duration of practice" and "opinio juris", both must clear a threshold together before a "custom established" light turns on.
    related: [persistent-objector-and-particular-custom, relationship-between-treaties-and-custom]
    depends-on: [article-38-and-sources-of-international-law]
    contrasts-with: [persistent-objector-and-particular-custom]
    cases: [asylum-case-colombia-v-peru, nicaragua-v-united-states-of-america, north-sea-continental-shelf-cases]
    authorities: []
    verify: false
    body: |
      Customary international law arises when conduct is (a) followed as a general practice among states —
      consistent repetition of a particular behaviour over a period of time when confronted with the same facts
      (the objective element) — and (b) accepted by those states as legally binding, opinio juris sive
      necessitatis: a belief of legal obligation, not mere courtesy, convenience or tradition (the subjective
      element).

      Neither element needs to be perfect. In Nicaragua v United States of America the ICJ held that state
      practice need not be "in absolutely rigorous conformity with the rule"; it is enough that conduct is "in
      general" consistent with the rule, and that departures are generally treated as breaches, not as a new rule
      — a state that defends its conduct by invoking an exception within the rule actually confirms rather than
      weakens it. In North Sea Continental Shelf the Court required that state practice, "including that of
      States whose interests are specially affected", be "extensive and virtually uniform", even over a short
      period; and opinio juris requires evidence that a settled practice is felt as a legal obligation, not merely
      "ceremonial and protocol" courtesy. The Asylum Case (Colombia v Peru) shows practice failing this test: "so
      much uncertainty and contradiction... fluctuation and discrepancy" meant no "constant and uniform usage,
      accepted as law" existed.

      Exam use: always run both elements separately — a widespread practice with no belief of legal obligation is
      not custom, and a stated belief with inconsistent practice is not custom either.
  - slug: persistent-objector-and-particular-custom
    title: Persistent objector and particular custom
    visual: diagram
    visual-brief: A decision flow from "custom established" — does it apply universally, regionally, or between only two states? — then a branch for a state that objected from the start.
    related: [customary-international-law-elements]
    depends-on: [customary-international-law-elements]
    contrasts-with: [customary-international-law-elements]
    cases: [fisheries-case-united-kingdom-v-norway, right-of-passage-over-indian-territory-portugal-v-india]
    authorities: []
    verify: false
    body: |
      Once a rule of customary international law is established, it generally binds every state — but there are
      two recognised exceptions. First, custom can be particular rather than universal: a regional custom binding
      only a group of states, or even a custom existing between only two states. In Right of Passage over Indian
      Territory (Portugal v India), the ICJ accepted that Portugal's centuries-long practice of accessing its
      enclave through Indian territory had crystallised into a customary right of passage binding as between just
      those two states, even though no treaty established one.

      Second, a state that has persistently and consistently objected to a rule from the very beginning of its
      formation is not bound by it: the persistent objector rule. In Fisheries (United Kingdom v Norway), the
      Court found the UK's claimed 10-mile rule for bays had not achieved customary status at all — but added
      that, even if it had, Norway had always opposed applying it to the Norwegian coast and would not be bound by
      it regardless.

      Exam use: the persistent objector rule reconciles customary law with the principle that international law
      is based on consent — a state can "opt out" of a rule under formation, but only by objecting before it
      crystallises and maintaining that objection consistently, which is why it is rarely successfully invoked.
  - slug: relationship-between-treaties-and-custom
    title: The relationship between treaties and custom
    visual: diagram
    visual-brief: One rule splitting into three arrows — codifies, crystallises, generates — each landing on a small "treaty + custom coexist" icon.
    related: [treaties-as-a-source, customary-international-law-elements]
    depends-on: [treaties-as-a-source, customary-international-law-elements]
    contrasts-with: []
    cases: [nicaragua-v-united-states-of-america, north-sea-continental-shelf-cases]
    authorities: []
    verify: false
    body: |
      A rule of international law may be contained in a treaty and be a rule of custom simultaneously — the two
      are not mutually exclusive. The Nicaragua case identifies three ways a treaty and a rule of custom can
      relate: a treaty may codify a pre-existing rule of custom; a treaty may crystallise a developing rule of
      custom, prompting the intense state practice needed to complete its formation; or a treaty may give rise to
      an entirely new rule of customary law, where a practice on a genuinely new issue develops around a treaty
      provision. North Sea Continental Shelf confirms the same possibilities.

      The clearest example is the right to self-defence: it exists as a rule of customary international law, and
      it is also written into the UN Charter at Article 51. Because the two exist in parallel, a state does not
      need to be a party to the UN Charter to have a right of self-defence — it can rely on the customary rule
      instead, which may carry a different specification of the right than the treaty version.

      Exam use: don't assume a treaty provision displaces a parallel customary rule (or vice versa). Where a
      state is not party to the relevant treaty, check whether the same rule also exists in custom before
      concluding it has no obligation or entitlement at all.
  - slug: general-principles-of-law
    title: General principles of law
    visual: explainer
    visual-brief: A "gap in the wall" between the treaty and custom pillars, plugged by a general-principles keystone only when both pillars fall short.
    related: [article-38-and-sources-of-international-law]
    depends-on: [article-38-and-sources-of-international-law]
    contrasts-with: []
    cases: []
    authorities: []
    verify: false
    body: |
      Article 38(1)(c) directs the Court to "the general principles of law recognized by civilized nations".
      International courts and tribunals rely on these principles when they cannot find authority in a treaty or
      in customary international law — when a dispute cannot be effectively resolved on the basis of those two
      sources. Examples given are equity, good faith, res judicata, and the impartiality of judges: principles
      common to domestic legal systems generally, transposed to the international level.

      To count as a general principle, a rule needs a decent geographical spread of states recognising it — drawn
      from civil law, common law and other legal traditions, not just one family of domestic systems — and it
      needs to be capable of being usefully implemented and followed at the international level; not everything
      recognised domestically transposes.

      Equity is the clearest working example. It refers to what is fair and reasonable in the administration of
      justice, and the ICJ often refers to equity and equitable principles when delimiting maritime boundaries
      between coastal states with opposite or adjacent coasts, where a mechanical application of a treaty or
      customary rule would produce an unfair result.

      Exam use: general principles are a last resort, not a first port of call — reach for them only once you
      have checked, and ruled out, both an applicable treaty and an applicable rule of customary international
      law.
  - slug: judicial-decisions-and-scholarly-writings
    title: Judicial decisions and scholarly writings
    visual: diagram
    visual-brief: Two side-by-side towers — common law "precedent binds later cases" versus international law "decision binds only these parties, but everyone still reads it" — with dotted lines of influence from one case to the next in the second tower.
    related: [article-38-and-sources-of-international-law]
    depends-on: [article-38-and-sources-of-international-law]
    contrasts-with: [article-38-and-sources-of-international-law]
    cases: []
    authorities: [icj-statute-art-59]
    verify: false
    body: |
      As a matter of doctrine, judicial decisions are not, in and of themselves, binding international law.
      Article 59 ICJ Statute: "The decision of the Court has no binding force except between the parties and in
      respect of that particular case." Unlike the common law's doctrine of precedent, a decision the Court
      reaches in one case is not binding in a later case, even between the same parties on similar facts — this
      respects the consent-based nature of the Court's jurisdiction, which is not compulsory.

      Despite that, judicial decisions carry substantial interpretative weight: international judges and legal
      practitioners constantly refer to, and base their reasoning on, previous decisions, and the ICJ rarely
      departs from its own jurisprudence. Consistency serves legitimacy (inconsistent jurisprudence would
      undermine the international adjudicatory system), predictability (states would be reluctant to litigate if
      outcomes were unpredictable), and the peaceful settlement of disputes — states also invoke ICJ decisions in
      negotiating settlements outside formal litigation.

      Scholarly writings — Article 38(1)(d)'s "teachings of the most highly qualified publicists" — and the work
      of the International Law Commission serve the same subsidiary, interpretive function: they help clarify the
      law where it is ambiguous but do not themselves create it. The ILC's draft articles (e.g. on state
      responsibility) can, over time, become treaties.

      Exam use: cite ICJ decisions and scholarly commentary as persuasive support for how a primary source should
      be interpreted, never as a freestanding source of the obligation itself.
