cards:
  - type: basic
    concept: liberty-limiting-principles
    front: The five ideas used to justify public force against individual freedom?
    back: >-
      Prevention of harm to others (harm principle); prevention of offence (offence principle); prevention of harm to
      self (legal paternalism); prevention of immoral conduct, even without harm/offence (legal moralism); general
      welfare/public interest (welfare principle).
    source: Week 10 Lecture Slides, slide 3
  - type: cloze
    concept: liberty-limiting-principles
    text: >-
      From a liberal point of view, the prevention of {{c1::immorality}} in the absence of {{c2::harm}} is not a
      legitimate reason to limit our freedom.
    source: Week 10 Lecture Slides, slide 3
  - type: basic
    concept: liberty-limiting-principles
    front: Popular morality v critical morality?
    back: >-
      Popular morality is what is conventionally regarded as morally right by society; critical morality is what is
      objectively right.
    source: Week 10 Lecture Slides, slide 21
  - type: apply
    concept: liberty-limiting-principles
    scenario: A council forces all ratepayers, including non-users, to fund a public library.
    answer: >-
      The welfare principle: compulsory taxation to support public projects in the public interest. The slides ask
      whether it is paternalism, or a matter of social justice.
    source: Week 10 Lecture Slides, slide 17
  - type: cloze
    concept: mills-harm-principle
    text: >-
      "The only purpose for which power can be rightfully exercised over any member of a civilised community, against
      his will, is to prevent {{c1::harm to others}}."
    source: Week 10 Lecture Slides, slide 8
  - type: basic
    concept: mills-harm-principle
    front: What does "causing harm" mean for Mill (slides)?
    back: >-
      Not just affecting another's interests: infringing interests we are under a duty not to infringe (a specific duty
      to the public, or perceptible hurt to a specific individual).
    source: Week 10 Lecture Slides, slide 9
  - type: basic
    concept: mills-harm-principle
    front: Two justifications for the harm principle?
    back: >-
      Personal autonomy and the presumptive case for liberty (freedom has intrinsic value); and long-run happiness:
      experiments in living benefit society, and freedom is "one of the principal ingredients of human happiness".
    source: Week 10 Lecture Slides, slide 11
  - type: basic
    concept: mills-harm-principle
    front: Three problems with the harm principle?
    back: >-
      Harm is conceived too narrowly (damage to person or property); no person's affairs affect only that person; it
      ignores indirect harms and offence that could become harm.
    source: Week 10 Lecture Slides, slide 12
  - type: apply
    concept: mills-harm-principle
    scenario: A wants to smash up her own car in her own driveway. May the state stop her on Mill's principle?
    answer: >-
      No: the state exceeds its proper limits if it stops A destroying her own property; conduct that harms only the
      actor should be free, however "foolish, perverse, or wrong".
    source: Week 10 Lecture Slides, slide 10
  - type: cloze
    concept: feinbergs-offence-principle
    text: >-
      Feinberg's offence principle requires the standard of {{c1::universality}} and the standard of {{c2::reasonable
      avoidability}}.
    source: Week 10 Lecture Slides, slide 13
  - type: basic
    concept: feinbergs-offence-principle
    front: Standard of universality?
    back: >-
      For offensiveness to justify coercion, it should be a reaction expected from almost anyone chosen at random
      (regardless of sex, age, race, etc).
    source: Week 10 Lecture Slides, slide 13
  - type: basic
    concept: feinbergs-offence-principle
    front: Standard of reasonable avoidability?
    back: >-
      You can only expect a state response if you cannot reasonably avoid the behaviour, or if avoiding it would be
      inconvenient for you.
    source: Week 10 Lecture Slides, slide 13
  - type: apply
    concept: feinbergs-offence-principle
    scenario: A shop with blacked-out windows sells material one passer-by finds offensive.
    answer: >-
      The offence principle does not apply: the conduct is reasonably avoidable, and offence felt by one person may also
      fail universality.
    source: Week 10 Lecture Slides, slide 13
  - type: basic
    concept: legal-paternalism
    front: Legal paternalism?
    back: >-
      State coercion is justified to protect individuals from self-inflicted harm, or to guide people, whether they like
      it or not, toward their own good.
    source: Week 10 Lecture Slides, slide 14
  - type: basic
    concept: legal-paternalism
    front: Examples of the (soft) paternalism all states employ?
    back: >-
      Prohibiting consent to one's own disablement or violent killing; contract law forbidding selling oneself into
      slavery. Some drug laws may be soft or hard.
    source: Week 10 Lecture Slides, slide 14
  - type: basic
    concept: legal-paternalism
    front: Five considerations in the rationale for legal paternalism?
    back: >-
      (1) probability of harm to oneself; (2) seriousness of the harm; (3) probability the goal will result; (4) value
      of the goal; (5) necessity of the risk (is there a less risky way?).
    source: Week 10 Lecture Slides, slide 15
  - type: cloze
    concept: devlins-legal-moralism
    text: For legal moralism, the fact that behaviour is {{c1::immoral}} is a legitimate reason to {{c2::criminalise}} it.
    source: Week 10 Lecture Slides, slide 16
  - type: basic
    concept: devlins-legal-moralism
    front: Devlin's three questions?
    back: >-
      (1) Has society the right to pass judgement on moral matters? (2) If so, can it use the weapon of the law to
      enforce its judgements? (3) Should it use the law in all cases, or only in some?
    source: Week 10 Lecture Slides, slide 22
  - type: basic
    concept: devlins-legal-moralism
    front: How does Devlin identify society's moral views?
    back: >-
      From the point of view of the man in the street / in the jury box / on the Clapham omnibus: common sense and
      feelings of intolerance, indignation and disgust.
    source: Week 10 Lecture Slides, slide 23
  - type: basic
    concept: devlins-legal-moralism
    front: Wolfenden report (UK, 1957)?
    back: >-
      Recommended that "homosexual behaviour between consenting adults in private should no longer be a criminal
      offence"; Devlin's 1959 Maccabean Lecture criticised it.
    source: Week 10 Lecture Slides, slide 20
  - type: basic
    concept: devlins-legal-moralism
    front: George v Devlin?
    back: >-
      Both would prohibit vice even if harmless; Devlin enforces popular morality, George (Making Men Moral, 1993)
      critical (true, objective) morality.
    source: Week 10 Lecture Slides, slide 27
  - type: apply
    concept: devlins-legal-moralism
    scenario: Adultery and bigamy are both judged immoral by society. Can both be criminalised, on Devlin's view?
    answer: >-
      Society has the right to use the law against both, but question (3) is practical: adultery cannot feasibly be
      enforced, while bigamy, as marriage is regulated, can.
    source: Week 10 Lecture Slides, slide 22; Week 10 Lecture Transcript (2025 recording)
  - type: cloze
    concept: harts-reply-to-devlin
    text: 'Hart: "The most remarkable feature of Sir Patrick''s lecture is his view of {{c1::the nature of morality}}".'
    source: Week 10 Lecture Slides, slide 24
  - type: basic
    concept: harts-reply-to-devlin
    front: Hart's two questions?
    back: >-
      (1) Is this behaviour, which offends moral feelings, harmful (independently of its repercussion on the general
      moral code)? (2) If we do not criminalise it, will we jeopardise the whole fabric of morality and society?
    source: Week 10 Lecture Slides, slide 25
  - type: basic
    concept: harts-reply-to-devlin
    front: Hart's deeper criticism?
    back: >-
      It must be possible to rationally assess the claim (reason, sympathetic understanding, critical intelligence): is
      general morality based on ignorance, superstition or misunderstanding? a false conception of the practice as
      dangerous? are the miseries of punishment understood?
    source: Week 10 Lecture Slides, slide 26
  - type: basic
    concept: harts-reply-to-devlin
    front: The Hart–Devlin exchange in order?
    back: >-
      Wolfenden report (1957); Devlin, 'Morals and the Criminal Law' (1959); Hart, 'Immorality and Treason' (1959);
      Hart, Law, Liberty and Morality (1963); Devlin, The Enforcement of Morals (1965); Hart, The Morality of the
      Criminal Law (1965).
    source: Week 10 Lecture Slides, slide 20
  - type: cloze
    concept: rawls-and-raz
    text: >-
      Rawls distinguishes the {{c1::right}} (principles of justice, including the protection of rights) from the
      {{c2::good}} (the sphere of value).
    source: Week 10 Lecture Slides, slide 28
  - type: basic
    concept: rawls-and-raz
    front: Raz's liberal perfectionism?
    back: >-
      Rejects state neutrality: the state should promote intrinsically worthy ways of life and discourage unworthy ones,
      but not by criminal law; non-coercive means (eg taxing activities the majority disapproves of) are fine.
    source: Week 10 Lecture Slides, slide 29
  - type: apply
    concept: rawls-and-raz
    scenario: A state taxes a pastime it judges unworthy but does not ban it.
    answer: >-
      Fits Raz: discouraging unworthy ways of life by non-coercive means. Rawls would object that the state should be
      neutral on the good life.
    source: Week 10 Lecture Slides, slide 29
  - type: basic
    concept: pornography-and-euthanasia
    front: Liberal objection to traditional pornography bans?
    back: >-
      Justified by offensiveness to community moral standards or tendency to deprave and corrupt, they are moralistic
      and do not aim to prevent harm; enjoying sexually explicit material is a private matter.
    source: Week 10 Lecture Slides, slide 30
  - type: basic
    concept: pornography-and-euthanasia
    front: MacKinnon and Dworkin on pornography?
    back: >-
      Distinguish erotica from pornography; the issue is not an immoral yet harmless action: pornography harms women and
      infringes women's right to equality.
    source: Week 10 Lecture Slides, slide 30
  - type: basic
    concept: pornography-and-euthanasia
    front: Voluntary, non-voluntary, passive, active euthanasia?
    back: >-
      Voluntary: at the request of an adult of sound mind. Non-voluntary: on someone not capable of understanding the
      choice. Passive: intentionally letting someone die. Active: a positive act of killing.
    source: Week 10 Lecture Slides, slide 31
  - type: apply
    concept: pornography-and-euthanasia
    scenario: A competent adult asks for a lethal injection rather than withdrawal of treatment.
    answer: >-
      Voluntary, active euthanasia. On the slides' claim she may refuse life-sustaining treatment but cannot ask to be
      actively killed; ask whether the choice harms or violates the rights of others.
    source: Week 10 Lecture Slides, slide 31
audio:
  title: Week 10 recap — the moral limits of the law
  minutes: 3
  script: >-
    This week asked when the state may use coercion against our freedom. Five ideas do the justifying work: preventing
    harm to others, preventing offence, preventing harm to self, preventing immoral conduct, and the general welfare.
    Keep popular morality, what society conventionally thinks right, apart from critical morality, what is objectively
    right.


    Mill's harm principle comes first. The only purpose for which power can rightfully be exercised over anyone against
    their will is to prevent harm to others. Our own good, physical or moral, is not enough. Harm is narrow: infringing
    interests we have a duty not to infringe. So the state can stop A assaulting B or stealing B's property, but not
    stop A destroying her own property or protect someone from being offended. Mill grounds this in autonomy and the
    presumptive case for liberty, and adds a utilitarian point: experiments in living make everyone happier in the long
    run. The problems are that harm is too narrow, no one's affairs only affect themselves, and indirect harms are
    ignored.


    Feinberg's offence principle supplements Mill, but only if two tests are met: universality, meaning almost anyone
    chosen at random would be offended, and reasonable avoidability. Legal paternalism protects people from
    self-inflicted harm; all states use some soft paternalism, like banning slavery contracts. Its rationale weighs
    probability, seriousness, the value of the goal and whether the risk is necessary.


    Legal moralism says immorality alone justifies criminalisation. Devlin, answering the Wolfenden report, asked three
    questions and said yes to the first two: without a shared morality society breaks down. The content comes from the
    man in the jury box, through intolerance, indignation and disgust, and there are no more limits than on laws against
    treason. George keeps the moralism but enforces critical, objective morality instead.


    Hart replies that morality is not a seamless web. He asks whether the conduct is actually harmful, and whether
    failing to criminalise it would really threaten society. And moral claims must be rationally assessed: is popular
    morality built on ignorance or superstition, and do we understand the misery punishment causes?


    Rawls separates the right from the good and keeps the state neutral, acting only against rights violations. Raz
    rejects neutrality: the state should promote worthy lives, but never through criminal law.


    Finally, the case studies. Traditional pornography bans were moralistic; MacKinnon and Dworkin recast the issue as
    harm to women and their equality. For euthanasia, keep voluntary and non-voluntary, passive and active apart.
