  - key: d20
    type: short
    concept: legal-paternalism
    difficulty: 3
    prompt: '"Every state is paternalist, so the question is not whether but how much." Discuss.'
    model: >-
      The premise is right, but it does not dissolve the debate; it relocates it to the justification of particular
      interventions. The slides say all states employ some elements of (soft) paternalism: prohibiting consent to one's
      own disablement or violent killing, and contract law forbidding selling oneself into slavery. Paternalism
      maintains that coercion is justified to protect individuals from self-inflicted harm, or to guide them toward
      their own good; hard paternalism intervenes for the person's own good, and drug laws may be soft or hard. So
      "whether" is settled descriptively. But a liberal following Mill and Feinberg rejects paternalism in principle,
      since both look only to harm or offence to others; the universality of soft paternalism does not show it is
      justified. The better answer is the slides' rationale: weigh the probability and seriousness of self-harm, the
      probability and value of the goal, and the necessity of the risk. That turns "how much" into a principled test. So
      the statement is half right: the question becomes how much, but "how much" must be answered by reasons, not by
      what states already do.
    rubric:
      - id: r1
        criterion: Thesis — takes a clear position on whether the ubiquity of paternalism ends the debate.
        marks: 2
        top-band: 'States a qualified thesis: the premise is true but descriptive, so the debate moves to justification.'
        margin-note: 'Half right: say which half.'
        authorities: []
      - id: r2
        criterion: Argument — defines paternalism, soft and hard, with the slides' examples.
        marks: 3
        top-band: >-
          Gives the definition, the soft examples (disablement, slavery contracts) and hard paternalism, with drug laws
          as the borderline.
        margin-note: Examples well chosen.
        authorities: []
      - id: r3
        criterion: Counterargument — states the liberal rejection of paternalism (Mill, Feinberg).
        marks: 3
        top-band: Explains that both principles reject paternalism and that what states do does not show what is justified.
        margin-note: 'Good: is/ought kept apart.'
        authorities: []
      - id: r4
        criterion: Evaluation — uses the five considerations to answer "how much".
        marks: 2
        top-band: Applies the five factors as a principled test and concludes clearly.
        margin-note: Strong use of the rationale.
        authorities: []
  - key: e01
    type: mcq
    concept: devlins-legal-moralism
    difficulty: 1
    set: pretest
    stem: What is Lord Devlin's central claim, according to the slides?
    options:
      - text: That the law may restrict liberty only to prevent harm to others or serious, unavoidable offence
        why: >-
          Tempting as a summary of the liberal principles, but Devlin rejects that limit: he would criminalise immoral
          conduct even without harm or offence.
      - text: That if behaviour is immoral by common standard, the law-maker has a prima facie right to prohibit it
        correct: true
        why: >-
          Right: the slide says Devlin's "central claim is that if a given behaviour is immoral (by common standard),
          then the law-maker has a prima facie right to prohibit that behaviour".
      - text: That the law should enforce only true or objective morality, not whatever the majority happens to believe
        why: >-
          This is George's critical version of legal moralism, which departs from Devlin precisely because majority
          beliefs may not be sound.
      - text: That the state should be neutral on every question of the good life and act only against rights violations
        why: >-
          This is Rawls's position on the right and the good, which is the opposite of Devlin's willingness to enforce
          morality.
  - key: e02
    type: mcq
    concept: devlins-legal-moralism
    difficulty: 1
    stem: What did the 1957 Wolfenden report recommend?
    options:
      - text: That prostitution be made a criminal offence in all circumstances
        why: >-
          Tempting because the committee also considered prostitution, but the recommendation quoted on the slides
          concerns homosexual behaviour in private.
      - text: That the law should enforce popular morality more strictly
        why: This is closer to Devlin's response to the report; the report itself recommended removing a criminal offence.
      - text: That homosexual behaviour between consenting adults in private no longer be a criminal offence
        correct: true
        why: >-
          Right: the committee recommended that "homosexual behaviour between consenting adults in private should no
          longer be a criminal offence".
      - text: That voluntary euthanasia be permitted for adults of sound mind
        why: Euthanasia is Devlin's own example and one of the case studies; it is not the Wolfenden recommendation.
  - key: e03
    type: mcq
    concept: devlins-legal-moralism
    difficulty: 2
    stem: On what basis does Devlin answer yes to his first two questions?
    options:
      - text: Shared moral beliefs are necessary to society
        correct: true
        why: >-
          Right: on (1) and (2) Devlin argued that "shared moral beliefs are necessary to society: without a shared
          morality the social order would break down".
      - text: Immoral conduct always causes harm to others in the long run
        why: >-
          Tempting because it would bring Devlin within the harm principle, but his claim is that the law may punish
          conduct even when it is harmless.
      - text: Critical morality can be known by reason and should guide legislation
        why: >-
          This is George's ground for legal moralism; Devlin relies on popular morality and on the need for social
          cohesion.
      - text: The majority has consented to whatever laws a democratic parliament makes
        why: >-
          Consent to parliament is not Devlin's argument; he grounds the right in society's need for a shared morality
          to survive.
  - key: e04
    type: mcq
    concept: devlins-legal-moralism
    difficulty: 2
    stem: >-
      Which example does Devlin use for his third question, about whether the law should enforce morality in all cases
      or only some?
    options:
      - text: Homosexual behaviour in private, as discussed in the Wolfenden report of 1957
        why: >-
          Tempting because it started the debate, but the slides use a different pair to illustrate the practical
          problem in question (3).
      - text: Voluntary euthanasia, which threatens the sanctity of human life
        why: >-
          Devlin uses euthanasia to show the criminal law already enforces moral principles; it is not his example for
          question (3).
      - text: Treason and sedition, against which there are no limits to legislation
        why: >-
          Treason and sedition are Devlin's analogy for why there are no limits on legislating against immorality, not
          his example of practical limits.
      - text: Adultery vs bigamy
        correct: true
        why: >-
          Right: the slide says question (3) is a practical problem, since enforcing morality can be impractical: "see,
          for example, adultery vs bigamy".
  - key: e05
    type: mcq
    concept: devlins-legal-moralism
    difficulty: 1
    stem: According to Devlin, from whose point of view should one identify society's moral views?
    options:
      - text: A philosopher reasoning about objective morality
        why: >-
          Tempting if you think morality needs expertise, but that fits George's critical morality; Devlin looks to
          ordinary people.
      - text: The man in the jury box
        correct: true
        why: >-
          Right: the slide lists "the man in the street / the man in the jury box / the man on the Clapham omnibus" as
          Devlin's reference point.
      - text: Parliament, as the elected voice of the people
        why: >-
          Devlin does not hand the question to parliament; his test is the moral judgment of the reasonable man, based
          on common sense and feelings.
      - text: Judges of the higher courts, applying precedent
        why: Devlin's reasonable man is a juror or a passenger on the Clapham omnibus, not a senior judge applying the law.
  - key: e06
    type: mcq
    concept: devlins-legal-moralism
    difficulty: 1
    stem: Which feelings mark the reasonable man's moral judgments, according to Devlin?
    options:
      - text: Fear, anxiety and anger at a threat to safety
        why: >-
          Tempting because these are strong reactions, but Devlin's list, on the slide, is different and centres on
          moral reprobation.
      - text: Sympathy, understanding and critical intelligence
        why: >-
          These echo Hart's reply: reason, sympathetic understanding and critical intelligence are what Hart wants in
          place of Devlin's feelings.
      - text: Intolerance, indignation and disgust
        correct: true
        why: >-
          Right: for Devlin the reasonable man's moral judgments are a matter of common sense and feelings:
          "intolerance, indignation, and disgust".
      - text: Offence, shock and embarrassment at public conduct
        why: >-
          These recall Feinberg's concern with offence; Devlin's test is about moral reprobation, not the offence
          principle.
  - key: e07
    type: mcq
    concept: devlins-legal-moralism
    difficulty: 2
    stem: What does Devlin say about the distinction between the private sphere and the public sphere?
    options:
      - text: That the private sphere must be protected absolutely from the law
        why: >-
          Tempting because the Wolfenden report protected private conduct, but this is the liberal view Devlin was
          attacking.
      - text: That only public conduct can ever offend popular morality
        why: >-
          Devlin's point is that private conduct can be immoral and punishable; he does not limit morality to public
          conduct.
      - text: That the distinction is drawn by critical, not popular, morality
        why: Devlin does not appeal to critical morality at all; that is George's version of legal moralism.
      - text: That, contra Mill, there is no principled distinction between them
        correct: true
        why: >-
          Right: the slide says "contra Mill, Devlin argues that there is no principled distinction between the private
          sphere and the public sphere".
  - key: e08
    type: mcq
    concept: devlins-legal-moralism
    difficulty: 2
    stem: Why, on Devlin's account, is voluntary euthanasia prohibited by the criminal law?
    options:
      - text: Because it threatens the sanctity of human life
        correct: true
        why: >-
          Right: the slide says voluntary euthanasia "is prohibited because it threatens the sanctity of human life
          (which [is] a fundamental moral principle)".
      - text: Because it causes serious offence that cannot reasonably be avoided by others
        why: >-
          Tempting because the topic is sensitive, but Devlin's point is that the law enforces a moral principle without
          harm or offence.
      - text: Because it harms the doctor or relative who carries it out at the patient's request
        why: >-
          Devlin uses the example to show the law punishing conduct for a moral reason, not to show harm to a third
          party.
      - text: Because people requesting it are not in the maturity of their faculties
        why: >-
          Voluntary euthanasia is by definition at the request of an adult of sound mind; Devlin's point is about a
          moral principle.
  - key: e09
    type: mcq
    concept: devlins-legal-moralism
    difficulty: 2
    stem: What analogy does Devlin draw to argue that there are no limits to legislation against immorality?
    options:
      - text: An analogy with taxation, which every member of the public must pay
        why: >-
          Tempting because the welfare principle uses taxation, but Devlin's analogy concerns threats to the existence
          of society.
      - text: An analogy with treason and sedition
        correct: true
        why: >-
          Right: for Devlin "there are no limits to legislation against immorality, as there are no limits to
          legislation against treason and sedition".
      - text: An analogy with contract law's ban on selling oneself into slavery
        why: Slavery contracts are the slides' example of soft paternalism, not Devlin's analogy for limitless legislation.
      - text: An analogy with the harm caused by assault and theft
        why: Assault and theft illustrate Mill's harm principle; Devlin's argument is that the law may go beyond harm.
  - key: e10
    type: mcq
    concept: devlins-legal-moralism
    difficulty: 2
    contrasts-with:
      - liberty-limiting-principles
    stem: What is the key difference between Devlin's and George's versions of legal moralism?
    options:
      - text: Devlin would criminalise harmless vice; George would criminalise only harmful vice
        why: >-
          Tempting, but the slides say George agrees with Devlin that the law should prohibit vice "even if the conduct
          in question is harmless".
      - text: Devlin uses the criminal law; George uses only non-coercive means such as tax
        why: >-
          Using only non-coercive means is Raz's liberal perfectionism; George, like Devlin, would use the law to
          prohibit vice.
      - text: Devlin enforces popular morality; George enforces critical morality
        correct: true
        why: >-
          Right: George takes the view that the standards the law should enforce are in critical (true, objective)
          morality, not in the majority's beliefs.
      - text: Devlin accepts Mill's private sphere; George rejects it
        why: >-
          It is Devlin who denies a principled private–public distinction; the slides do not set George against Devlin
          on this point.
  - key: e11
    type: mcq
    concept: devlins-legal-moralism
    difficulty: 1
    stem: In which book does Robert P. George set out his critical version of legal moralism?
    options:
      - text: The Enforcement of Morals (1965)
        why: >-
          Tempting because it is a book on enforcing morality, but it is Devlin's 1965 defence of his position, not
          George's.
      - text: Law, Liberty and Morality (1963)
        why: This is Hart's 1963 book in the Hart–Devlin exchange, arguing against Devlin's legal moralism.
      - text: On Liberty (1859)
        why: On Liberty is Mill's work on the struggle between authority and liberty, the source of the harm principle.
      - text: Making Men Moral (1993)
        correct: true
        why: 'Right: the slide cites Making Men Moral: Civil Liberties and Public Morality (Oxford University Press, 1993).'
  - key: e12
    type: mcq
    concept: devlins-legal-moralism
    difficulty: 2
    stem: On what point does George agree with Devlin?
    options:
      - text: The law should protect moral character by prohibiting vice, even if harmless
        correct: true
        why: >-
          Right: George "agrees with Devlin that the law should protect our moral character by prohibiting vice, even if
          the conduct in question is harmless".
      - text: The majority's moral beliefs are the right standard for the criminal law
        why: >-
          Tempting because they agree on enforcing morality, but George rejects majority beliefs as the standard, since
          they may not be sound.
      - text: Feelings of intolerance, indignation and disgust reveal what is immoral
        why: This is Devlin's test of popular morality; George looks to true or objective morality, not to feelings.
      - text: The state should promote the good life only by non-coercive means
        why: Non-coercive promotion of the good is Raz's view; George and Devlin both accept prohibiting vice by law.
  - key: e13
    type: mcq
    concept: devlins-legal-moralism
    difficulty: 3
    variant-of: e05
    stem: >-
      A legislator argues: "Put this practice before an ordinary juror. He would feel disgust. That is enough to ban
      it." Whose method is this?
    options:
      - text: George's, because it identifies what is objectively immoral by reasoned reflection
        why: >-
          Tempting because it is legal moralism, but George looks to critical (objective) morality, not to a juror's
          feelings.
      - text: Devlin's, because it tests popular morality by the jury box's feelings
        correct: true
        why: >-
          Right: Devlin identifies society's morality through the man in the jury box, whose judgments are a matter of
          feelings: intolerance, indignation and disgust.
      - text: Feinberg's, because almost anyone chosen at random would react the same way
        why: >-
          Feinberg asks about serious offence that is universal and unavoidable; he does not treat disgust as proof of
          immorality.
      - text: Mill's, because the juror stands for the community harmed by the practice
        why: Mill would ask whether others are harmed; disgust at a practice is not harm in his narrow sense.
  - key: e14
    type: mcq
    concept: devlins-legal-moralism
    difficulty: 2
    stem: Which of Devlin's three questions do the slides describe as "a practical problem"?
    options:
      - text: 'Question 1: whether society has the right to pass judgement on moral matters'
        why: >-
          Tempting because it comes first, but question (1) is about society's right, which Devlin defends on the basis
          of shared morality.
      - text: 'Question 2: whether society can use the weapon of the law to enforce its judgements'
        why: >-
          Question (2) is also a question of right; Devlin answers it, with (1), by appeal to the necessity of shared
          morality.
      - text: 'Question 3: whether to use the law in all cases or only in some'
        correct: true
        why: >-
          Right: the slide says "question (3) is a practical problem: in some cases, enforcing morality can be
          impractical".
      - text: 'None: all three questions are matters of principle for Devlin'
        why: >-
          The slide expressly calls question (3) a practical problem, distinct from the questions of right in (1) and
          (2).
  - key: e15
    type: mcq
    concept: devlins-legal-moralism
    difficulty: 3
    contrasts-with:
      - mills-harm-principle
    stem: Which statement correctly contrasts Devlin with Mill?
    options:
      - text: Both accept the harm principle, but Devlin counts disgust as a kind of harm
        why: >-
          Tempting as a reconciliation, but the slides say Devlin would criminalise immoral conduct "even if it causes
          no harm/offence".
      - text: Mill would enforce critical morality; Devlin would enforce only popular morality
        why: >-
          Mill would enforce neither: his principle forbids coercion except to prevent harm to others, whatever morality
          says.
      - text: Mill allows coercion for the actor's own good; Devlin allows it only for others' good
        why: Mill rejects coercion for the actor's own good ("either physical or moral"); this reverses his position.
      - text: Mill assumes a self-regarding private sphere; Devlin denies any principled line
        correct: true
        why: >-
          Right: Mill makes us answerable only for conduct that harms others, while Devlin argues there is no principled
          distinction between private and public spheres.
  - key: e16
    type: mcq
    concept: devlins-legal-moralism
    difficulty: 3
    variant-of: e04
    stem: >-
      A society regards a private, hard-to-detect act as seriously immoral, but police could never reliably prove it.
      What would Devlin say?
    options:
      - text: Society has the right to criminalise it, but enforcing it may be impractical
        correct: true
        why: >-
          Right: on (1) and (2) society may use the law against immorality; question (3) is practical, as adultery (hard
          to enforce) shows against bigamy.
      - text: The act cannot be criminalised, because it is private and harms no one at all
        why: >-
          Tempting on a Millian view, but Devlin denies a principled line between private and public and accepts
          punishing harmless conduct.
      - text: The act should be criminalised only if critical morality condemns it too
        why: Requiring critical morality is George's view; Devlin enforces what society conventionally regards as immoral.
      - text: The practical difficulty shows the moral judgment itself must be mistaken
        why: >-
          Devlin treats practical limits as working at a different level: they do not touch the moral justification of
          enforcement.
  - key: e17
    type: truefalse
    concept: devlins-legal-moralism
    difficulty: 1
    set: quickfire
    statement: Devlin argues that the majority has the right to translate conventional moral judgments into criminal law.
    answer: true
    why: >-
      True: slide 21 says "according to Lord Devlin, the majority has the right to translate conventional moral
      judgments into criminal law".
  - key: e18
    type: truefalse
    concept: devlins-legal-moralism
    difficulty: 1
    set: quickfire
    statement: Robert George agrees with Devlin that the law should enforce the moral beliefs of the majority.
    answer: false
    why: >-
      False: George agrees that the law should prohibit vice, but the standards come from critical (true, objective)
      morality, since majority beliefs may not be sound.
  - key: e19
    type: truefalse
    concept: devlins-legal-moralism
    difficulty: 2
    statement: >-
      Devlin argued that the criminal law as it stood did not respect Mill's principle, because it punished some
      harmless behaviour.
    answer: true
    why: >-
      True: the slide says Devlin argues the criminal law "does not respect Mill's principle because there are many
      cases in which the criminal law punishes harmless behaviour".
  - key: e20
    type: short
    concept: devlins-legal-moralism
    difficulty: 3
    prompt: >-
      "A society cannot survive without a shared morality, so it may use the criminal law to enforce one." Evaluate
      Devlin's argument.
    model: >-
      Devlin's argument has a true premise but an invalid step: a society needs some shared morality, but not the rich
      morality he would enforce, and not everything that offends it. Devlin, answering the Wolfenden report, claims that
      if behaviour is immoral by common standard the law-maker has a prima facie right to prohibit it. On his first two
      questions, shared moral beliefs are necessary to society: without them the social order would break down, so
      society may use the weapon of the law, as it may against treason and sedition. The content comes from the man in
      the jury box: intolerance, indignation and disgust. Question three is merely practical (adultery vs bigamy). The
      argument has force: some shared standards are needed, and the criminal law already enforces moral principles, as
      the euthanasia ban shows. But Hart replies that morality is not a seamless web: not every immoral act threatens
      society, and feelings may rest on ignorance, superstition or misunderstanding. George also shows a moralist need
      not trust majority feelings. So the premise supports enforcing a minimal core, not popular morality as such.
    rubric:
      - id: r1
        criterion: Thesis — takes a clear position on whether social survival justifies enforcing morality.
        marks: 2
        top-band: >-
          States a precise thesis: true premise, invalid inference from "some shared morality" to "the majority's
          morality".
        margin-note: Where exactly does it fail?
        authorities: []
      - id: r2
        criterion: Argument — sets out Devlin's three questions, the jury box test and the treason analogy.
        marks: 3
        top-band: >-
          Explains questions (1)–(3), the reasonable man's feelings, and the treason and sedition analogy, with the
          Wolfenden context.
        margin-note: Accurate Devlin.
        authorities: []
      - id: r3
        criterion: Counterargument — gives Devlin's strongest support before criticising.
        marks: 2
        top-band: Uses the euthanasia example and the need for some shared standards to state the argument at its best.
        margin-note: Good charity.
        authorities: []
      - id: r4
        criterion: Evaluation — uses Hart (seamless web, rational criticism) and George to reach a conclusion.
        marks: 3
        top-band: >-
          Applies the seamless web point and Hart's questions about ignorance and superstition, and uses George to
          separate moralism from majority feelings.
        margin-note: Strong, balanced conclusion.
        authorities: []
  - key: f01
    type: mcq
    concept: harts-reply-to-devlin
    difficulty: 1
    stem: What was Hart's first published reply to Devlin, according to the slides?
    options:
      - text: '''Immorality and Treason'' (1959)'
        correct: true
        why: >-
          Right: the slides list H.L.A. Hart, 'Immorality and Treason' (1959) directly after Devlin's 1959 Maccabean
          Lecture.
      - text: Law, Liberty and Morality (1963)
        why: >-
          Tempting because it is Hart's best-known contribution to the debate, but it came in 1963, after 'Immorality
          and Treason'.
      - text: The Morality of the Criminal Law (1965)
        why: >-
          This 1965 work is Hart's last entry in the list on the slides, responding after Devlin's The Enforcement of
          Morals.
      - text: '''Positivism and the Separation of Law and Morals'' (1958)'
        why: This 1958 article belongs to the Hart–Fuller debate (week 3), not to the exchange with Devlin.
  - key: f02
    type: mcq
    concept: harts-reply-to-devlin
    difficulty: 1
    stem: 'Hart wrote: "The most remarkable feature of Sir Patrick''s lecture is his view of…" what?'
    options:
      - text: …the harm principle and its proper limits"
        why: >-
          Tempting because Hart is a liberal, but his opening attack is not on the harm principle; it targets Devlin's
          idea of morality.
      - text: …the relation between treason and sedition"
        why: >-
          Hart does criticise the treason analogy, but the quoted sentence names a different, more basic feature of the
          lecture.
      - text: …the nature of morality"
        correct: true
        why: >-
          Right: "the most remarkable feature of Sir Patrick's lecture is his view of the nature of morality – the
          morality which the criminal law may enforce".
      - text: …the role of the jury in criminal trials"
        why: >-
          The man in the jury box is part of Devlin's test, but the quotation is about his view of the nature of
          morality.
  - key: f03
    type: mcq
    concept: harts-reply-to-devlin
    difficulty: 2
    stem: What is the first of Hart's two questions?
    options:
      - text: Has society the right to pass judgement on moral matters at all?
        why: >-
          Tempting because it is a famous question in the debate, but it is Devlin's first question, not one of Hart's
          two.
      - text: Is this behaviour, which offends moral feelings, harmful?
        correct: true
        why: >-
          Right: Hart asks whether behaviour that offends moral feelings is harmful "independently of its repercussion
          on the general moral code".
      - text: Would almost anyone chosen at random be offended by it?
        why: This is Feinberg's standard of universality for the offence principle, not Hart's question to Devlin.
      - text: Is there a less risky way of achieving the same goal?
        why: This is the necessity consideration in the rationale for legal paternalism, not one of Hart's questions.
  - key: f04
    type: mcq
    concept: harts-reply-to-devlin
    difficulty: 2
    stem: What is the second of Hart's two questions?
    options:
      - text: Should society use the weapon of the law in all cases, or only in some?
        why: >-
          Tempting because it sounds like a limit, but it is Devlin's third question, which he treats as a practical
          problem.
      - text: Is the behaviour based on ignorance, superstition or misunderstanding?
        why: >-
          This misplaces Hart's deeper criticism: it is general morality, not the behaviour, that may rest on ignorance
          or superstition.
      - text: Would the man on the Clapham omnibus feel intolerance, indignation and disgust?
        why: This is Devlin's test for the content of popular morality, which Hart attacks rather than adopts.
      - text: If we do not criminalise it, will we jeopardise the whole fabric of morality and society?
        correct: true
        why: >-
          Right: Hart asks "is it true that, if we do not criminalise a given immoral behaviour, then we will jeopardise
          the whole fabric of morality and society?".
  - key: f05
    type: mcq
    concept: harts-reply-to-devlin
    difficulty: 2
    stem: What does Hart mean by saying "morality is not a seamless web"?
    options:
      - text: Not every moral rule stands or falls together, so one breach does not threaten the whole
        correct: true
        why: >-
          Right: against Devlin's picture, Hart holds that morality has separable parts, so tolerating one immoral
          practice need not unravel society's morality.
      - text: Morality has no content at all until the criminal law gives it some
        why: >-
          Tempting as a positivist-sounding claim, but Hart accepts that moral codes exist independently of law; his
          point is about their structure.
      - text: Popular morality and critical morality are always identical in content
        why: >-
          Hart's point is not about the two moralities coinciding; indeed his deeper criticism tests popular morality by
          critical reason.
      - text: Moral feelings cannot be measured, so the jury box test is useless
        why: >-
          Hart attacks reliance on feelings, but the seamless web point is about whether morality stands or falls as a
          whole.
  - key: f06
    type: mcq
    concept: harts-reply-to-devlin
    difficulty: 2
    stem: Which comparison of Devlin's does Hart criticise?
    options:
      - text: Between private conduct and public conduct
        why: >-
          Tempting because the private–public line is central to the debate, but the comparison Hart attacks is about
          treason.
      - text: Between adultery and bigamy
        why: >-
          Adultery and bigamy are Devlin's example of practical limits; Hart's criticism on the slide targets a
