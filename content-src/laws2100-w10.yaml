    contrasts-with:
      - devlins-legal-moralism
      - legal-paternalism
    cases: []
    authorities: []
    verify: false
    body: >-
      Two other liberal approaches to the moral limits of the law.


      **John Rawls (1921–2002)** distinguishes the **right** from the **good**:


      - the right is the sphere of principles of justice, including the protection of rights;

      - the good is the sphere of value.


      The state should be "neutral" on all matters of the good life. The only justification for state interference is to
      prevent rights violations and to punish those who do violate the rights of others.


      **Joseph Raz (1939–2022)** rejects Rawls's idea of state neutrality. The state is entitled to (and should) promote
      intrinsically worthy ways of life and discourage intrinsically unworthy ways of life. Raz is a **liberal
      perfectionist**:


      - perfectionist, because the state has an active role in helping people live a good life;

      - liberal, because the state should **not** use the criminal law to promote worthy ways of life or pursue
      perfectionist ideals.


      Raz has no problem with the state promoting virtue by **non-coercive means**, for instance by taxing activities of
      which the majority disapproves.


      Compare the legal moralists: Devlin and George would use the criminal law against vice; Raz shares their concern
      with the good but not their means; Rawls shares neither.


      Exam use: Raz lets you argue that the state may care about the good life without criminalising harmless vice.
  - slug: pornography-and-euthanasia
    title: 'Case studies: adult pornography and voluntary euthanasia'
    visual: simulation
    visual-brief: >-
      Choose a case (adult pornography; euthanasia set by two switches, voluntary/non-voluntary and passive/active) and
      a principle (harm, offence, paternalism, moralism); the panel shows what the principle says about prohibiting it
      and the strongest counterargument from the slides.
    related:
      - laws2100-w08-four-feminisms
      - laws2100-w08-separate-spheres-and-the-personal-is-political
      - feinbergs-offence-principle
    depends-on:
      - liberty-limiting-principles
      - mills-harm-principle
    contrasts-with: []
    cases: []
    authorities: []
    verify: false
    body: >-
      Two case studies apply the week's principles to real life.


      **Adult pornography.** Traditionally, bans were justified by its offensiveness to the community's moral standards
      or its tendency to deprave and corrupt. From the liberal perspective these justifications are obviously moralistic
      and do not aim to prevent harm: if enjoying sexually explicit material is a private matter, it should not be
      prohibited by law.


      Cf. **Catharine MacKinnon and Andrea Dworkin**: distinguish erotica from pornography. The issue is not preventing
      an allegedly immoral yet harmless action; pornography **harms women** and infringes women's **right to equality**.
      This moves the argument from moralism to harm.


      **Voluntary euthanasia.** Four terms:


      - **voluntary**: at the request of an adult person of sound mind;

      - **non-voluntary**: on someone not capable of understanding the choice between life and death;

      - **passive**: intentionally letting someone die;

      - **active**: a positive act of killing.


      Adults in full command of their mental capacities have the right to refuse life-sustaining treatment, but cannot
      ask to be actively killed. Is the choice of voluntary, active euthanasia harmful? Does it violate the rights of
      others? Devlin cites its prohibition as the criminal law protecting the sanctity of human life, a moral principle,
      without harm to others.


      Exam use: run each principle in turn and test each argument against its counterargument.
cases: []
authorities:
  - slug: mill-on-liberty
    title: John Stuart Mill, On Liberty (1859)
    kind: other
    text: >-
      "The only purpose for which power can be rightfully exercised over any member of a civilised community, against
      his will, is to prevent harm to others." Our own good (either physical or moral) is not a good enough reason to
      justify "compulsion and control, whether the means used be physical force in the form of legal penalties, or the
      moral coercion of public opinion". "It is […] hardly necessary to say that this doctrine is meant to apply only to
      human beings in the maturity of their faculties."
    gloss: >-
      Mill's harm principle: the only legitimate use of state power over adult citizens is to prevent harm to others;
      over their own body and mind, the individual is sovereign.
    cases: []
    verify: false
  - slug: feinberg-offence-principle
    title: 'Joel Feinberg (1926–2004): the offence principle'
    kind: principle
    text: >-
      "It is always a good reason in support of a proposed criminal prohibition that it would probably be an effective
      way of preventing serious offense...to persons other than the actor, and that it is probably a necessary means to
      that end... The principle asserts, in effect, that the prevention of offensive conduct is properly the state's
      business"
    gloss: >-
      A supplement to the harm principle, limited by two tests: the standard of universality and the standard of
      reasonable avoidability.
    cases: []
    verify: false
  - slug: wolfenden-report-1957
    title: Report of the Departmental Committee on Homosexual Offences and Prostitution (Wolfenden report), UK, 1957
    kind: other
    text: >-
      The committee recommended that "homosexual behaviour between consenting adults in private should no longer be a
      criminal offence".
    gloss: >-
      The report (named after its chairman, Sir John Wolfenden) whose recommendation Devlin criticised in his 1959
      Maccabean Lecture, starting the Hart–Devlin debate.
    cases: []
    verify: false
  - slug: devlin-morals-and-the-criminal-law
    title: Patrick Devlin, 'Morals and the Criminal Law', Maccabean Lecture in Jurisprudence, British Academy (1959)
    kind: article
    text: >-
      Devlin's three questions: (1) Has society the right to pass judgement on moral matters? (2) If so, can society use
      the weapon of the law to enforce its judgements? (3) Should society use the weapon of the law in all cases, or
      only in some?
    gloss: >-
      Devlin's popular legal moralism: shared morality is necessary to society, so the majority may translate
      conventional moral judgments, identified through the man in the jury box's intolerance, indignation and disgust,
      into criminal law.
    cases: []
    verify: false
  - slug: hart-immorality-and-treason
    title: H.L.A. Hart, 'Immorality and Treason' (1959)
    kind: article
    text: >-
      "The most remarkable feature of Sir Patrick's lecture is his view of the nature of morality – the morality which
      the criminal law may enforce"
    gloss: >-
      Hart's first reply to Devlin: attacks Devlin's account of morality as feelings of reprobation and his analogy
      between immorality and treason.
    cases: []
    verify: false
  - slug: george-making-men-moral
    title: 'Robert P. George, Making Men Moral: Civil Liberties and Public Morality (Oxford University Press, 1993)'
    kind: other
    text: >-
      As summarised on the slides: George agrees with Devlin that the law should protect our moral character by
      prohibiting vice, even if the conduct in question is harmless, but holds that the moral standards the law should
      enforce are found in critical morality (true or objective morality), not in the majority's moral beliefs, since
      these may not be sound.
    gloss: George's critical version of legal moralism.
    cases: []
    verify: false
questions:
  - key: a01
    type: mcq
    concept: liberty-limiting-principles
    difficulty: 1
    set: pretest
    stem: Which principle holds that state coercion is justified to prevent harm to self?
    options:
      - text: The harm principle, as set out by John Stuart Mill
        why: >-
          Tempting because it is the best-known principle, but Mill's harm principle is about preventing harm to others;
          harm to self is exactly what it refuses to count.
      - text: The offence principle, as set out by Joel Feinberg
        why: >-
          The offence principle protects persons other than the actor from serious offence; it is a supplement to the
          harm principle, not a licence to protect people from themselves.
      - text: Legal paternalism
        correct: true
        why: >-
          Right: the slide lists "prevention of harm to self (legal paternalism)" as the third of the five ideas used to
          justify the use of public force.
      - text: The welfare principle, aimed at the public interest
        why: >-
          The welfare principle concerns the general welfare or public interest (eg compulsory taxation for public
          projects), not protecting individuals from self-inflicted harm.
  - key: a02
    type: mcq
    concept: liberty-limiting-principles
    difficulty: 1
    stem: Which thinker do the slides associate with the offence principle?
    options:
      - text: John Stuart Mill (1806 – 1873)
        why: >-
          Tempting because Mill is the other named thinker in Part A, but the slides tie Mill to the harm principle;
          offence is what Mill's state may not protect against.
      - text: Joel Feinberg (1926 – 2004)
        correct: true
        why: >-
          Right: the slide says "On the offence principle, see Joel Feinberg (1926 – 2004)", and later quotes his
          statement of the principle.
      - text: Lord Patrick Devlin
        why: >-
          Devlin is the slides' example of popular legal moralism: he would criminalise immorality even without harm or
          offence, which is a different principle.
      - text: Robert P. George
        why: >-
          George is the example of critical legal moralism (enforcing objective morality); the slides do not connect him
          with the offence principle.
  - key: a03
    type: mcq
    concept: liberty-limiting-principles
    difficulty: 1
    stem: What does legal moralism treat as a legitimate reason to criminalise behaviour?
    options:
      - text: That the behaviour is immoral, even if it causes no harm or offence
        correct: true
        why: >-
          Right: for legal moralism "the fact that a given behaviour is immoral is a legitimate reason to criminalise
          that behaviour", even without harm or offence.
      - text: That the behaviour causes perceptible hurt to a specific individual
        why: >-
          Tempting because it sounds like a moral wrong, but perceptible hurt to a specific individual is how the slides
          describe harm under Mill's principle.
      - text: That the behaviour would offend almost anyone chosen at random
        why: >-
          That is Feinberg's standard of universality for the offence principle; legal moralism does not need anyone to
          be offended at all.
      - text: That the behaviour puts the actor's own health or life at serious risk
        why: >-
          Risk to the actor is the concern of legal paternalism; legal moralism looks at the immorality of the act
          itself, not at the actor's well-being.
  - key: a04
    type: mcq
    concept: liberty-limiting-principles
    difficulty: 2
    stem: >-
      From a liberal point of view, according to the slides, which of these is NOT a legitimate reason to limit our
      freedom?
    options:
      - text: Preventing one person from assaulting another person
        why: >-
          Preventing assault is the paradigm harm-to-others case: the state limits A's freedom but protects B's
          security, which the liberal view accepts.
      - text: Preventing one person from stealing another's property
        why: >-
          Theft harms another person's interests in property, so preventing it falls squarely within the harm principle
          that liberals accept.
      - text: Preventing conduct that causes serious, unavoidable offence
        why: >-
          Tempting because Mill himself would not protect against offence, but Feinberg's offence principle is a liberal
          supplement to the harm principle, not its rejection.
      - text: Preventing immorality where nobody is harmed
        correct: true
        why: >-
          Right: the slide says that "from a liberal point of view, the prevention of immorality in the absence of harm
          is not a legitimate reason to limit our freedom".
  - key: a05
    type: mcq
    concept: liberty-limiting-principles
    difficulty: 1
    stem: How do the slides distinguish popular morality from critical morality?
    options:
      - text: Popular morality is enforced by courts; critical morality is not
        why: >-
          Tempting because the week is about legal enforcement, but the distinction is about the source of moral
          standards, not about which one courts enforce.
      - text: Popular morality is held by liberals; critical morality by conservatives
        why: >-
          The distinction is not about political camps: both Devlin (popular) and George (critical) are legal moralists,
          and liberals use both terms.
      - text: >-
          Popular morality is what society conventionally regards as right; critical morality is what is objectively
          right
        correct: true
        why: >-
          Right: slide 21 says popular morality "is what is conventionally regarded as morally right by society (whereas
          critical morality is what is objectively right)".
      - text: >-
          Popular morality concerns private life and personal choices; critical morality concerns public life and the
          state's laws
        why: >-
          This confuses the morality distinction with the private–public distinction, which is a separate idea (Devlin
          denies any principled line between those spheres).
  - key: a06
    type: mcq
    concept: liberty-limiting-principles
    difficulty: 2
    stem: Which example do the slides give of the welfare principle at work?
    options:
      - text: Prohibiting people from consenting to their own disablement
        why: >-
          Tempting because it is also state coercion, but the slides give this as an example of soft legal paternalism,
          which protects people from self-inflicted harm.
      - text: Compulsory taxation to fund public projects that some citizens may not benefit from
        correct: true
        why: >-
          Right: the slide says the modern state forces "(usually by way of compulsory taxation) willing and unwilling
          citizens to support public projects that are in the public interest".
      - text: Prohibiting adultery and bigamy as conduct that society judges immoral
        why: >-
          Adultery and bigamy are Devlin's example of the practical limits of legal moralism, not of the welfare
          principle.
      - text: Stopping A from stealing B's property to protect B's freedom to use it
        why: >-
          Stopping theft is the slides' example of the harm principle, which protects others' interests rather than the
          general welfare.
  - key: a07
    type: mcq
    concept: liberty-limiting-principles
    difficulty: 2
    stem: >-
      A state requires adults to wear a seatbelt in their own car, solely to protect the wearer. Which justifying
      principle is the law relying on?
    options:
      - text: Legal paternalism
        correct: true
        why: >-
          Right: the only person protected is the actor, so the law protects individuals "from self-inflicted harm",
          which is the definition of legal paternalism.
      - text: The harm principle, since injuries are a harm
        why: >-
          Tempting because injury is a harm, but Mill's principle covers harm to others only; on the facts the risk
          falls solely on the wearer.
      - text: The offence principle, since crashes distress others
        why: >-
          Nothing in the facts concerns offence to others; the law's stated aim is the wearer's own safety, which the
          offence principle does not cover.
      - text: Legal moralism, since not wearing one is wrong
        why: >-
          Legal moralism targets conduct because it is immoral; the law here is justified by the wearer's well-being,
          not by the immorality of the choice.
  - key: a08
    type: mcq
    concept: liberty-limiting-principles
    difficulty: 2
    stem: >-
      A parliament bans a private practice that harms no one, because a large majority of citizens regard it as
      degrading. Which principle best describes the justification?
    options:
      - text: The harm principle, because the majority feels hurt
        why: >-
          Tempting, but for Mill harm means infringing interests we are under a duty not to infringe; mere disapproval
          by a majority does not count.
      - text: The offence principle, because the majority is offended
        why: >-
          The practice is private, so the majority can reasonably avoid it; Feinberg's standard of reasonable
          avoidability would not be met.
      - text: Legal paternalism, because it protects participants
        why: >-
          Nothing in the facts concerns protecting the participants from harm to themselves; the ban rests on the
          majority's moral judgment.
      - text: Legal moralism, in its popular version
        correct: true
        why: >-
          Right: "if the majority considers certain conduct to be immoral/degrading, then it should be prohibited" is
          the popular version of legal moralism (eg Devlin).
  - key: a09
    type: mcq
    concept: liberty-limiting-principles
    difficulty: 3
    stem: >-
      Which statement best captures the lecture's contrast between the harm and offence principles on one side and
      paternalism and moralism on the other?
    options:
      - text: The first pair are utilitarian; the second pair are deontological
        why: >-
          Tempting because Mill was a utilitarian, but the lecture's contrast is not between ethical theories;
          Feinberg's principle is not presented as utilitarian.
      - text: The first pair apply to adults; the second pair apply only to minors
        why: >-
          Mill's principle applies to those "in the maturity of their faculties", but paternalism and moralism are not
          limited to minors; drug laws apply to adults.
      - text: >-
          The first pair are negative, limiting public force; the second look to positive action helping people live a
          good life
        correct: true
        why: >-
          Right: the lecture calls the harm and offence principles "negative in nature", while paternalism and moralism
          focus on positive action the state might take.
      - text: >-
          The first pair protect other members of society; the second pair protect only the actor, from harm to himself
          or herself
        why: >-
          Paternalism protects the actor, but moralism does not: it targets immoral conduct whether or not anyone,
          including the actor, is harmed.
  - key: a10
    type: mcq
    concept: liberty-limiting-principles
    difficulty: 3
    stem: >-
      The slides note that there are "practical limits" to using the criminal law for moralistic reasons. How does the
      lecture treat these limits?
    options:
      - text: As the strongest normative argument against legal moralism, and decisive against both Devlin and George
        why: >-
          Tempting, but the lecture says practical limits are not justified in a strong sense: they leave the moralist's
          normative argument untouched.
      - text: As facts about the world, not a normative justification, unlike the moral limits the week asks about
        correct: true
        why: >-
          Right: practical limits are "part of the world we live in"; the interesting question is the moral limits of
          positive law, which need normative arguments.
      - text: As a reason to prefer critical morality over popular morality
        why: >-
          Practical limits apply to both versions of moralism; they are about the feasibility of enforcement, not about
          which morality is sound.
      - text: As an argument Mill used to justify the harm principle
        why: >-
          Mill's justification is normative (autonomy, the presumptive case for liberty, long-run happiness), which is
          exactly what the lecture contrasts with practical limits.
  - key: a11
    type: mcq
    concept: liberty-limiting-principles
    difficulty: 2
    stem: >-
      About which principle do the slides ask: "Is it an example of legal paternalism? Is it a matter of social
      justice?"
    options:
      - text: The welfare principle
        correct: true
        why: >-
          Right: slide 17 closes the welfare principle with those two questions, linking compulsory support for public
          projects to paternalism and to social justice.
      - text: The offence principle
        why: >-
          The offence principle is followed by Feinberg's two tests (universality and reasonable avoidability), not by
          questions about social justice.
      - text: The harm principle
        why: >-
          The harm principle slides end with its problems (narrow harm, self-regarding affairs, indirect harms), not
          with questions about social justice.
      - text: Legal moralism, in George's critical version
        why: >-
          Legal moralism is followed by the question "What are the moral limits of positive law?", not by the social
          justice question.
  - key: a12
    type: mcq
    concept: liberty-limiting-principles
    difficulty: 3
    stem: >-
      Why do the slides tell us to "remember the distinction between popular and critical morality" when studying the
      five principles?
    options:
      - text: Because the harm principle protects only critical morality
        why: >-
          Tempting, but the harm principle protects people from harm to others, not any kind of morality; Mill rejects
          enforcing morality as such.
      - text: Because the offence principle measures offence against popular morality
        why: >-
          Feinberg's universality standard asks whether almost anyone chosen at random would react; it does not adopt
          popular morality as a standard of right.
      - text: Because the welfare principle and legal paternalism both depend on objective, critical morality
        why: >-
          The slides do not tie paternalism or welfare to objective morality; paternalism weighs probabilities and
          seriousness of harm to the self.
      - text: Because legal moralism splits into a popular version (Devlin) and a critical version (George)
        correct: true
        why: >-
          Right: the slides give two versions of moralism, majority judgment (Devlin) and objective morality (George),
          so the distinction decides which morality would be enforced.
  - key: a13
    type: mcq
    concept: liberty-limiting-principles
    difficulty: 2
    stem: >-
      Which two principles focus on the well-being of, or wrongdoing by, the actor rather than on harm or offence to
      others?
    options:
      - text: The harm principle and the offence principle
        why: >-
          These are the two the lecture sets against paternalism: both look to harm or offence to persons other than the
          actor.
      - text: Legal paternalism and legal moralism
        correct: true
        why: >-
          Right: paternalism looks to the actor's own good, and moralism to the immorality of the act itself; neither
          requires harm or offence to others.
      - text: The offence principle and the welfare principle
        why: >-
          The offence principle protects others from serious offence, and the welfare principle serves the public
          interest; neither centres on the actor.
      - text: The harm principle and the welfare principle
        why: >-
          Both look beyond the actor: the harm principle to harm to others, the welfare principle to the general welfare
          and public projects.
  - key: a14
    type: mcq
    concept: liberty-limiting-principles
    difficulty: 2
    stem: Why does the lecture insist that this week's arguments be read in the context of a liberal democracy?
    options:
      - text: Because only liberal democracies have criminal law
        why: >-
          Tempting as an overstatement, but the point is not about criminal law existing elsewhere; it is about the
          values the arguments presuppose.
      - text: Because the harm principle was written into liberal constitutions
        why: >-
          The lecture says nothing about constitutional entrenchment; the harm principle is presented as a normative
          argument, not as a constitutional rule.
      - text: >-
          Because their frameworks and values make sense there; a totalitarian regime claims power over every aspect of
          life
        correct: true
        why: >-
          Right: the lecture says running these arguments in a different framework may be impossible or problematic, and
          contrasts the totalitarian claim to regulate everything.
      - text: Because in a democracy the majority decides what is moral
        why: >-
          That is close to Devlin's premise, which the week questions; the lecture's point is about context and values,
          not majority rule.
  - key: a15
    type: mcq
    concept: liberty-limiting-principles
    difficulty: 3
    variant-of: a06
    stem: >-
      A council forces all ratepayers, including those who never use it, to fund a new public hospital. A critic calls
      this "paternalism". What is the best response using the week's material?
    options:
      - text: It rests on the welfare principle, which the slides ask may be a kind of paternalism
        correct: true
        why: >-
          Right: funding public projects through compulsory taxation is the slides' welfare example, and the slides
          themselves leave open the paternalism and social justice questions.
      - text: It is clearly legal paternalism, because every ratepayer is being protected from themselves
        why: >-
          Tempting because the critic says so, but non-users are not being protected from self-inflicted harm; the
          project serves the public interest generally.
      - text: It rests on the harm principle, because not funding hospitals harms the sick
        why: >-
          Mill's harm is narrow: infringing interests we are under a duty not to infringe; declining to pay for a
          hospital is not harm to others in that sense.
      - text: It is legal moralism, because refusing to contribute is immoral
        why: >-
          Nothing suggests the levy rests on the immorality of refusing; the slides describe this kind of measure under
          the welfare principle.
  - key: a16
    type: mcq
    concept: liberty-limiting-principles
    difficulty: 3
    variant-of: a08
    stem: >-
      A law bans a practice that a majority approves of, because the legislators believe it is objectively immoral,
      although it harms no one. Which justification is this?
    options:
      - text: Popular legal moralism, as defended by Devlin
        why: >-
          Tempting because it is legal moralism, but Devlin enforces what the majority regards as immoral; here the
          majority approves of the practice.
      - text: Critical legal moralism, as defended by George
        correct: true
        why: >-
          Right: the law enforces what is "really/objectively immoral" against majority opinion, which is the critical
          version of legal moralism associated with Robert George.
      - text: Soft paternalism, as found in all states
        why: >-
          Soft paternalism protects people from self-inflicted harm such as consenting to their own disablement; the
          facts say no one is harmed.
      - text: The offence principle, as limited by universality
        why: >-
          A practice the majority approves of fails the standard of universality outright, so the offence principle
          could not support this ban.
  - key: a17
    type: mcq
    concept: liberty-limiting-principles
    difficulty: 1
    stem: How many ideas do the slides list as commonly used to justify the use of public force against individual freedom?
    options:
      - text: 'Two: harm and offence'
        why: >-
          Tempting because harm and offence are the two liberal principles, but the slides list three more: paternalism,
          moralism and the welfare principle.
      - text: 'Three: harm, paternalism and moralism'
        why: >-
          This leaves out the offence principle (Feinberg) and the welfare principle (general welfare/public interest),
          both on the slide.
      - text: 'Four: harm, offence, paternalism and moralism'
        why: >-
          Close, but the slide adds a fifth: "general welfare/public interest", the welfare principle, which closes Part
          A.
      - text: 'Five: harm, offence, paternalism, moralism and welfare'
        correct: true
        why: >-
          Right: the slide lists five: prevention of harm to others, prevention of offence, prevention of harm to self,
          prevention of immoral conduct, and general welfare.
  - key: a18
    type: truefalse
    concept: liberty-limiting-principles
    difficulty: 1
    set: quickfire
    statement: >-
      The slides list the prevention of immoral conduct, even when there is no harm or offence, as one of the ideas used
      to justify public force.
    answer: true
    why: >-
      True: the fourth idea on the slide is "prevention of immoral conduct (even when there is no harm/offence)", which
      is legal moralism.
  - key: a19
    type: truefalse
    concept: liberty-limiting-principles
    difficulty: 1
    set: quickfire
    statement: On the slides, legal paternalism means preventing harm to others.
    answer: false
    why: >-
      False: legal paternalism is the "prevention of harm to self"; preventing harm to others is Mill's harm principle,
      the first idea on the list.
  - key: a20
    type: truefalse
    concept: liberty-limiting-principles
    difficulty: 2
    statement: >-
      According to the lecture, the practical limits on enforcing morality give a strong normative justification for
      limiting the law.
    answer: false
    why: >-
      False: the lecture says practical limits are just facts about the world; unlike Mill's argument from freedom, they
      offer no normative justification.
  - key: b01
    type: mcq
    concept: mills-harm-principle
    difficulty: 1
    set: pretest
    stem: >-
      According to Mill, what is "the only purpose for which power can be rightfully exercised over any member of a
      civilised community, against his will"?
    options:
      - text: To make the person better off, physically or morally
        why: >-
          Tempting because it sounds benevolent, but Mill says our own good, "either physical or moral", is not a good
          enough reason for compulsion.
      - text: To enforce the shared morality that holds society together
        why: >-
          Enforcing shared morality is Devlin's position; Mill's principle is designed precisely to keep the moral
          coercion of public opinion in check.
      - text: To prevent harm to others
        correct: true
        why: >-
          Right: Mill's words are "the only purpose for which power can be rightfully exercised … against his will, is
          to prevent harm to others".
      - text: To prevent serious offence to persons other than the actor
        why: >-
          Preventing serious offence is Feinberg's offence principle, a later supplement to Mill; for Mill the state
          exceeds its limits if it protects against offence.
  - key: b02
    type: mcq
    concept: mills-harm-principle
    difficulty: 1
    stem: To whom does Mill say the harm principle applies?
    options:
      - text: Only to human beings in the maturity of their faculties
        correct: true
        why: >-
          Right: Mill writes that it is "hardly necessary to say that this doctrine is meant to apply only to human
          beings in the maturity of their faculties".
      - text: To every human being, including children
        why: >-
          Tempting given its universal tone, but Mill expressly limits the doctrine to those in the maturity of their
          faculties, which excludes children.
      - text: Only to citizens who have consented to the state
        why: >-
          Mill's limit is about maturity and capacity, not consent to the state; the slides say nothing about consent as
          a condition.
      - text: Only to people acting in the public sphere
        why: >-
          The harm principle protects private, self-regarding conduct as well; its limit is to mature human beings, not
          to public conduct.
  - key: b03
    type: mcq
    concept: mills-harm-principle
    difficulty: 2
    stem: In the slides' account of Mill, what does "causing harm" involve?
    options:
      - text: Affecting any interest of another person in any way, however slight the effect
        why: >-
          Tempting, but the slides say it "is not just a matter of affecting another person's interests"; harm is
          narrower than that.
      - text: Doing something the majority considers immoral
        why: >-
          Majority disapproval is Devlin's test of popular morality; Mill's harm has nothing to do with what the
          majority considers immoral.
      - text: Causing any reaction of disgust or indignation in others
        why: >-
          Disgust and indignation are Devlin's markers of immorality; Mill would not treat these feelings in others as
          harm at all.
      - text: Infringing another's interests that we are under a duty not to infringe
        correct: true
        why: >-
          Right: "causing harm involves infringing another person's interests that we are under a duty not to infringe",
          eg a specific duty to the public.
  - key: b04
    type: mcq
    concept: mills-harm-principle
    difficulty: 1
    stem: On the slides, which of these would the state exceed its proper limits by stopping?
    options:
      - text: A assaulting B in the street
        why: >-
          Stopping an assault is the slides' example of legitimate coercion: it limits A's freedom but prevents harm to
          B and protects B's security.
      - text: A destroying her own property
        correct: true
        why: >-
          Right: the slides say "the state exceeds its proper limits if it tries to stop A from destroying her/his own
          property".
      - text: A stealing B's bicycle
        why: >-
          Stopping theft protects B's freedom to use her property as she wishes, so the slides treat it as within the
          harm principle.
      - text: A breaking a specific duty to the public
        why: >-
          The violation of a specific duty to the public is one of the slides' descriptions of causing harm, so the
          state may act.
  - key: b05
    type: mcq
    concept: mills-harm-principle
    difficulty: 2
    stem: >-
      Which phrase does Mill use for conduct we should have perfect freedom to engage in, provided it is not harmful to
      others?
    options:
      - text: '"Indecent, immoral, or degrading"'
        why: >-
          Tempting because these are words moralists use, but they are not Mill's; his phrase concedes the conduct may
          be bad without licensing coercion.
      - text: '"Offensive, shocking, or disgusting"'
        why: >-
          Offence and disgust belong to Feinberg's and Devlin's vocabulary; Mill's phrase is about conduct that may be
          unwise or wrong.
      - text: '"Foolish, perverse, or wrong"'
        correct: true
        why: >-
          Right: the slides quote Mill: we should have perfect freedom to behave in such ways, no matter how "foolish,
          perverse, or wrong" our conduct may be.
      - text: '"Dangerous, reckless, or unwise"'
        why: >-
          This sounds like paternalism's concern with risky conduct; Mill's phrase, as quoted on the slides, is
          "foolish, perverse, or wrong".
  - key: b06
    type: mcq
    concept: mills-harm-principle
    difficulty: 2
    stem: What is the "presumptive case for liberty" behind the harm principle?
    options:
      - text: The idea that we all agree freedom has intrinsic value for the individual and society
        correct: true
        why: >-
          Right: the slides define the presumptive case for liberty this way, alongside the value of personal autonomy,
          as the harm principle's justification.
      - text: The idea that liberty is valuable only because it produces happiness in the long run
        why: >-
          Tempting because Mill also gives a utilitarian argument, but the presumptive case is about liberty's
          intrinsic, not instrumental, value.
      - text: The presumption that a law restricting liberty is valid until struck down by a court
        why: >-
          This confuses a moral presumption with a legal presumption of validity; the slides' presumptive case is a
          claim about the value of freedom.
      - text: The presumption that individuals consent to whatever the majority decides about liberty
        why: >-
          Majority decision is Devlin's territory; the presumptive case for liberty protects individual freedom against
          majority judgment.
  - key: b07
    type: mcq
    concept: mills-harm-principle
    difficulty: 2
    stem: Why, on the slides, does Mill think following the harm principle brings maximum happiness in the long run?
    options:
      - text: Because punishing harmful conduct, and only harmful conduct, deters crime at the lowest overall cost
        why: >-
          Tempting as a utilitarian-sounding reason, but deterrence is not on the slide; Mill's reasons concern
          experiments in living and the value of freedom.
      - text: Because the majority is happiest when its morality is enforced
        why: >-
          This is closer to Devlin's argument for enforcing popular morality; Mill argues the reverse, that unsavoury
          experiments should be tolerated.
      - text: Because people are happiest when the state guides them to their own good
        why: >-
          Guiding people to their own good is legal paternalism, which the harm principle rejects; Mill does not count
          our own good as a reason for coercion.
      - text: Because experiments in living benefit society, and freedom is a principal ingredient of happiness
        correct: true
        why: >-
          Right: the slides give both reasons: experimentation with lifestyles is valuable for the whole society, and
          personal freedom is "one of the principal ingredients of human happiness".
  - key: b08
    type: mcq
    concept: mills-harm-principle
    difficulty: 3
    stem: How does the lecture describe the structure of Mill's justification for the harm principle?
    options:
      - text: A purely utilitarian argument with no claim about intrinsic value
        why: >-
          Tempting because Mill was a utilitarian, but the lecture stresses that the presumptive case for liberty treats
          freedom as of intrinsic value.
      - text: Intrinsic value of liberty at the foundation, with a utilitarian argument built on top
        correct: true
        why: >-
          Right: the lecture says the foundation is a recognition of liberty's intrinsic (non-instrumental) value, and
          Mill then adds a utilitarian argument about consequences.
      - text: A natural law argument that liberty is part of objective morality, binding on every legal system
        why: >-
          Objective (critical) morality is George's ground for legal moralism; the lecture does not present Mill's
          argument as natural law.
      - text: A conventional argument that liberal democracies already accept the principle
        why: >-
          The lecture notes a limit on government is widely accepted, but Mill's justification is normative, not an
          appeal to what states already do.
  - key: b09
    type: mcq
    concept: mills-harm-principle
    difficulty: 2
    stem: Which is NOT one of the problems with the harm principle listed on the slides?
    options:
      - text: It conceives of harm too narrowly, as damage to a person or her property
        why: >-
          This is on the slide: arguably the narrow conception of harm "does not reach far enough", so it is a listed
          problem, not the answer.
      - text: No person's affairs have effects only on that person
        why: >-
          This is on the slide: the principle assumes some affairs concern only the person, but no one's affairs are
          purely self-regarding.
      - text: It allows the majority to enforce its moral feelings
        correct: true
        why: >-
          Right: this is not a problem with Mill's principle but the objection to Devlin; the harm principle is designed
          to block enforcement of moral feelings.
      - text: It does not address indirect harms, or offence that could become harm
        why: >-
          This is the third problem on the slide, and the gap the offence principle later tries to fill, so it is a
          listed problem.
  - key: b10
    type: mcq
    concept: mills-harm-principle
    difficulty: 3
    variant-of: b09
    stem: >-
      A critic says: "Your drinking in your own home affects your family, your employer and the health system." Which
      problem with the harm principle is the critic pressing?
    options:
      - text: That no person's affairs have effects only on that person
        correct: true
        why: >-
          Right: the critic denies there is a purely self-regarding sphere, which is the slides' second problem with the
          harm principle.
      - text: That harm should include offence to strangers
        why: >-
          The facts concern effects on family, work and health, not offence to strangers; offence is the concern of
          Feinberg's principle.
      - text: That the principle applies only to mature adults
        why: >-
          The maturity limit is Mill's own qualification, not a criticism; and nothing in the facts concerns a person
          lacking capacity.
      - text: That the presumptive case for liberty is false
        why: >-
          The critic does not deny that freedom has intrinsic value; the point is that the line between self- and
          other-regarding conduct is unstable.
  - key: b11
    type: mcq
    concept: mills-harm-principle
    difficulty: 2
    stem: What link do the slides ask us to remember when thinking about Mill's idea of harm?
    options:
      - text: The link between law and coercion
        why: >-
          Tempting because coercion is the topic of Part A, but the slide's reminder concerns how harm connects to
          rights, from week 9.
      - text: The link between morality and disgust
        why: >-
          Disgust is Devlin's test of popular morality and is criticised by Hart; it is not the link the harm slide asks
          us to remember.
      - text: The link between offence and avoidability
        why: >-
          Avoidability belongs to Feinberg's offence principle; the harm slide reminds us of a link from the previous
          week on rights.
      - text: The link between interests, entitlements and rights
        correct: true
        why: >-
          Right: slide 9 ends "Remember the link between interests, entitlements, and rights", tying harm to infringing
          interests we have a duty not to infringe.
  - key: b12
    type: mcq
    concept: mills-harm-principle
    difficulty: 2
    stem: >-
      Mill says our own good is not a good enough reason for "compulsion and control". Which means of compulsion does he
      include?
    options:
      - text: Only physical force in the form of legal penalties imposed by the state
        why: >-
          Tempting because the week is about law, but Mill expressly adds a second means: the moral coercion of public
          opinion.
      - text: Both legal penalties and the moral coercion of public opinion
        correct: true
        why: >-
          Right: Mill refers to "physical force in the form of legal penalties, or the moral coercion of public
          opinion", so social pressure counts too.
      - text: Only the moral coercion of public opinion
        why: >-
          Mill covers public opinion, but he names legal penalties first; the principle limits both state force and
          social pressure.
      - text: Only taxation and other financial measures
        why: >-
          Taxation appears in the slides under the welfare principle and in Raz's non-coercive means, not in Mill's
          phrase about compulsion and control.
  - key: b13
    type: mcq
    concept: mills-harm-principle
    difficulty: 3
    stem: >-
      A and B, both adults, agree to take part in a dangerous sport that may injure either of them. Applying the slides'
      account of Mill, may the state ban it?
    options:
      - text: 'Yes: injury to B is harm to another person'
        why: >-
          Tempting because B may be injured by A, but the slides exclude behaviour that "harms people with their
          consent" from punishment.
      - text: 'Yes: the state may protect people from foolish choices'
        why: >-
          Protecting people from their own foolish choices is legal paternalism; Mill says we should be free to act
          however "foolish, perverse, or wrong".
      - text: 'No: harm done to consenting adults falls outside the harm principle'
        correct: true
        why: >-
          Right: the slides say behaviour which "harms people with their consent, or harms only the actor himself"
          should not be punished under Mill's principle.
      - text: 'No: sport is part of the private sphere that Devlin protects'
        why: >-
          Devlin denies any principled line between private and public spheres; it is Mill, not Devlin, who protects
          self-regarding conduct.
  - key: b14
    type: mcq
    concept: mills-harm-principle
    difficulty: 3
    stem: Which is the best example of the "experiments in living" argument on the slides?
    options:
      - text: A community tolerates lifestyles the majority finds unsavoury, as society learns from them
        correct: true
        why: >-
          Right: the slides say experimentation with lifestyles is valuable for the whole society, "even though the
          majority may find these experiments in living unsavoury or offensive".
      - text: A state funds research into healthier ways of living for the population
        why: >-
          Tempting because it involves experiments, but state-funded research is a welfare measure; Mill's argument is
          about individuals freely trying ways of life.
      - text: A legislature trials a new criminal offence in one region before extending it to the whole state
        why: >-
          Trialling an offence is a policy experiment in coercion; Mill's experiments in living are individual choices
          protected from coercion.
      - text: A court experiments with lighter sentences for victimless crimes
        why: >-
          Sentencing practice is not Mill's point; experiments in living are lifestyles chosen by individuals, which the
          harm principle shields.
  - key: b15
    type: mcq
    concept: mills-harm-principle
    difficulty: 2
    contrasts-with:
      - feinbergs-offence-principle
      - legal-paternalism
    stem: Which of these does the harm principle and the offence principle have in common?
    options:
      - text: Both were developed by Mill in On Liberty
        why: >-
          Tempting because both appear early in the lecture, but the offence principle is Feinberg's, developed later as
          a supplement to Mill.
      - text: Both accept that preventing immorality can justify coercion
        why: >-
          Neither accepts this: preventing immorality without harm is legal moralism, which the slides say liberals
          reject.
      - text: Both justify protecting people from self-inflicted harm
        why: Protecting people from self-inflicted harm is legal paternalism, which both principles reject.
      - text: Both reject paternalism and look to harm or offence to others
        correct: true
        why: 'Right: the lecture notes that both principles reject paternalism; they protect persons other than the actor.'
  - key: b16
    type: mcq
    concept: mills-harm-principle
    difficulty: 3
    stem: According to the slides, how did Mill frame the questions he wanted to answer in On Liberty?
    options:
      - text: Whether law is a command of the sovereign backed by threats
        why: >-
          Tempting because that is Austin's question from earlier weeks, but Mill's concern in On Liberty is the
          struggle between authority and liberty.
      - text: What the limits of government authority should be, and whether force or law may regulate morality
        correct: true
        why: >-
          Right: the slide says Mill wants to determine the limits of government authority, whether force should be
          used, and whether public opinion about morality can be subject to legal regulation.
      - text: Whether the majority has a right to translate its conventional moral judgments into the criminal law
        why: >-
          That is the question Devlin answers yes to; Mill's framing is about setting limits on authority, not
          empowering the majority.
      - text: How a legal system identifies its valid rules of recognition
        why: >-
          Rules of recognition are Hart's descriptive jurisprudence; On Liberty is a normative inquiry into the limits
          of state power.
  - key: b17
    type: truefalse
    concept: mills-harm-principle
    difficulty: 1
    set: quickfire
    statement: For Mill, a person's own physical or moral good is a sufficient reason to compel them against their will.
    answer: false
    why: >-
      False: Mill says our own good, "either physical or moral", is not a good enough reason to justify compulsion and
      control; only harm to others is.
  - key: b18
    type: truefalse
    concept: mills-harm-principle
    difficulty: 1
    set: quickfire
    statement: >-
      On the slides, the state may legitimately stop A from stealing B's property, because this protects B's freedom to
      use it.
    answer: true
    why: >-
      True: the slides say the state can stop A stealing B's property, "thereby protecting B's freedom to use her/his
      property as (s)he wishes".
  - key: b19
    type: truefalse
    concept: mills-harm-principle
    difficulty: 2
    set: quickfire
    statement: One criticism of the harm principle on the slides is that it does not address indirect harms.
    answer: true
    why: >-
      True: the third problem listed is that the harm principle "does not address indirect harms, or kinds of offence
      that could become harm".
  - key: b20
    type: short
    concept: mills-harm-principle
    difficulty: 3
    prompt: '"Mill''s harm principle is too narrow to tell us where the law should stop." Discuss.'
    model: >-
      Mill's principle is narrow, but that narrowness is the source of its strength as a limit on law; the better
      criticism is that it cannot settle hard cases alone. Mill holds that "the only purpose for which power can be
      rightfully exercised over any member of a civilised community, against his will, is to prevent harm to others."
      Harm means infringing interests we are under a duty not to infringe, so the state may stop assault and theft but
      not self-harm, consensual harm or offence. Its justification is the intrinsic value of liberty (the presumptive
      case) and long-run happiness through experiments in living. Against it, the slides list three problems: harm is
      conceived narrowly, as damage to persons or property; no one's affairs affect only themselves; and indirect harms
      and offence that could become harm are ignored. Feinberg's offence principle shows liberals themselves found it
      too narrow. Yet widening harm risks admitting the moral feelings Devlin relied on. So the principle is too narrow
      to be complete, but its narrowness should be supplemented with tested principles (Feinberg's two standards), not
      abandoned.
    rubric:
      - id: r1
        criterion: Thesis — takes a clear, qualified position on whether narrowness defeats the harm principle.
        marks: 2
        top-band: >-
          States at once that the principle is incomplete rather than wrong, and says what follows for the limits of
          law.
        margin-note: 'Clear stance: narrow, or useless?'
        authorities: []
      - id: r2
        criterion: Argument — states the principle, Mill's narrow idea of harm and its justification accurately.
        marks: 3
        top-band: >-
          Quotes the principle, explains harm as infringing interests we have a duty not to infringe, and gives both
          justifications (intrinsic value; experiments in living).
        margin-note: Accurate Mill, well used.
        authorities: []
      - id: r3
        criterion: Counterargument — uses the three slide criticisms and Feinberg's supplement.
        marks: 3
        top-band: >-
          Runs all three problems (narrow harm, no purely self-regarding affairs, indirect harms) and shows Feinberg
          responding to them.
        margin-note: Good use of the criticisms.
        authorities: []
      - id: r4
        criterion: Evaluation — weighs the risk of widening harm and concludes.
        marks: 2
        top-band: >-
          Shows that widening harm invites Devlin's moral feelings back in, and concludes on supplementing rather than
          abandoning Mill.
        margin-note: Strong payoff.
        authorities: []
  - key: c01
    type: mcq
    concept: feinbergs-offence-principle
    difficulty: 1
    set: pretest
    stem: How do the slides describe the relationship between Feinberg's offence principle and Mill's harm principle?
    options:
      - text: As a replacement that abandons the harm principle
        why: >-
          Tempting because Feinberg goes beyond Mill, but the slides do not say he abandons harm; the offence principle
          is added to it.
      - text: As a supplement to the harm principle
        correct: true
        why: >-
          Right: the slide says "the offence principle is deemed a supplement to the harm principle"; it reaches cases
          harm does not cover.
      - text: As a version of legal moralism applied to offence
        why: >-
          Legal moralism needs no harm or offence at all; Feinberg's principle stays liberal by focusing on serious
          offence to others.
      - text: As a form of soft legal paternalism
        why: >-
          Paternalism protects the actor from self-inflicted harm; the offence principle protects "persons other than
          the actor".
  - key: c02
    type: mcq
    concept: feinbergs-offence-principle
    difficulty: 1
    stem: What does Feinberg's standard of universality require?
    options:
      - text: That the conduct be found offensive in every country and every culture
        why: >-
          Tempting reading of "universal", but the slide's test is about a random member of the community, not every
          culture in the world.
      - text: That the conduct be prohibited by every legal system
        why: >-
          The standard is about the offended reaction, not about legal systems; whether others prohibit it is
          irrelevant.
      - text: That the offended person be unable to avoid the conduct
        why: That is the other test, the standard of reasonable avoidability; universality concerns who would be offended.
      - text: That the reaction be one expected from almost anyone chosen at random
        correct: true
        why: >-
          Right: the offensiveness must be "a reaction that could be expected from almost anyone chosen at random (i.e.,
          regardless of sex, age, race, etc)".
  - key: c03
    type: mcq
    concept: feinbergs-offence-principle
    difficulty: 1
    stem: What does Feinberg's standard of reasonable avoidability require?
    options:
      - text: That you cannot reasonably avoid the behaviour, or avoiding it would be inconvenient
        correct: true
        why: >-
          Right: you can only expect a response from the state "if you cannot reasonably avoid such behaviour, or if
          avoiding the behaviour would be inconvenient for you".
      - text: That the actor could reasonably have avoided offending anyone by behaving differently
        why: >-
          Tempting because it sounds like fault, but the test looks at whether the offended person can avoid the
          conduct, not at the actor's care.
      - text: That a reasonable person would be offended by the behaviour
        why: >-
          This blends in universality and the reasonable person; avoidability is about whether the offence can be
          escaped.
      - text: That the state could reasonably avoid using criminal law
        why: >-
          This sounds like paternalism's necessity factor (a less risky way), but Feinberg's test concerns the offended
          person's position.
  - key: c04
    type: mcq
    concept: feinbergs-offence-principle
    difficulty: 2
    stem: How many of Feinberg's tests must be met before the offence principle can be invoked?
    options:
      - text: 'One: either universality or reasonable avoidability'
        why: Tempting, but the slide says "two tests need to be met"; satisfying only one leaves the principle unavailable.
      - text: 'None: serious offence is always enough on its own'
        why: >-
          Feinberg says serious offence is always "a good reason", but the slides add two tests precisely so offence
          cannot be enough on its own.
      - text: 'Two: universality and reasonable avoidability'
        correct: true
        why: >-
          Right: "in order to evoke the offense principle, two tests need to be met": the standard of universality and
          the standard of reasonable avoidability.
      - text: 'Three: universality, avoidability and harm to others'
        why: >-
          Harm to others is the harm principle's test; the offence principle exists to cover cases where there is no
          harm, so it has only two tests.
  - key: c05
    type: mcq
    concept: feinbergs-offence-principle
    difficulty: 2
    stem: >-
      A roadside billboard on the only road into town shows images that almost anyone would find revolting. Can the
      offence principle support a prohibition?
    options:
      - text: 'No: the images harm no one, so Mill''s harm principle forbids any law against them'
        why: >-
          Tempting on Mill's own view, but the offence principle exists to cover cases without harm; Feinberg's question
          is whether both tests are met.
      - text: 'Yes: almost anyone would be offended and commuters cannot reasonably avoid it'
        correct: true
        why: >-
          Right: universality is met (almost anyone chosen at random), and avoidability is met (the only road in), so
          both tests are satisfied.
      - text: 'No: offence can never justify coercion in a liberal state'
        why: >-
          This is Mill's position, but Feinberg's liberal supplement says preventing serious offence is "properly the
          state's business".
      - text: 'Yes: the images are immoral by the community''s standards'
        why: >-
          This would be legal moralism; the offence principle turns on serious, unavoidable offence to others, not on
          immorality.
  - key: c06
    type: mcq
    concept: feinbergs-offence-principle
    difficulty: 2
    stem: >-
      A clearly signed private club stages a show inside that some passers-by would find deeply offensive if they went
      in. Applying Feinberg, which test fails?
    options:
      - text: Universality, because the show is private
        why: >-
          Tempting, but universality is about who would be offended (almost anyone at random), not about whether the
          venue is private.
      - text: 'Neither: both tests are met, so it may be banned'
        why: >-
          Both tests are not met: passers-by can simply stay outside, so the avoidability test points against any
          prohibition.
      - text: The harm test, because no one is physically hurt
        why: >-
          Feinberg's principle has no harm test; it is designed for conduct that offends without harming. The question
          is which offence test fails.
      - text: Reasonable avoidability, because anyone offended can stay outside
        correct: true
        why: >-
          Right: you can only expect a state response if you cannot reasonably avoid the behaviour; a signed, enclosed
          show is easily avoided.
  - key: c07
    type: mcq
    concept: feinbergs-offence-principle
    difficulty: 3
    stem: >-
      A public practice deeply offends members of one religious community but not most other people chosen at random.
      Which test is the offence principle likely to fail?
    options:
      - text: The standard of universality
        correct: true
        why: >-
          Right: the reaction must be expected from almost anyone chosen at random, "regardless of sex, age, race, etc";
          offence confined to one group fails this.
      - text: The standard of reasonable avoidability
        why: >-
          Tempting because the practice is public, which suggests it is hard to avoid; but even if unavoidable, the
          universality test fails first.
      - text: The maturity of faculties requirement
        why: That is Mill's limit on who the harm principle protects; it is not one of Feinberg's tests for offence.
      - text: The necessity of the risk requirement
        why: >-
          Necessity of the risk is one of the five factors in the rationale for legal paternalism, not a test for the
          offence principle.
  - key: c08
    type: mcq
    concept: feinbergs-offence-principle
    difficulty: 2
    stem: According to the lecture, why did Feinberg add two tests to the offence principle?
    options:
      - text: Because offence is much harder to prove in court than physical harm or damage to property
        why: >-
          Tempting as a practical worry, but the lecture's reason is conceptual: offence has a wider reach and needs
          narrowing.
      - text: Because he wanted to restore Devlin's jury box test
        why: >-
          Feinberg does not adopt Devlin's test; universality asks about almost anyone at random, not the feelings of a
          reasonable man.
      - text: Because offence has a greater reach than harm, so it must be narrowed to be workable
        correct: true
        why: >-
          Right: the lecture says offence gives the principle "a greater reach", so Feinberg narrows the idea with two
          standards to make it workable.
      - text: Because Mill had already accepted offence as a harm
        why: 'Mill did the opposite: on the slides his state exceeds its limits if it protects a person from being offended.'
  - key: c09
    type: mcq
    concept: feinbergs-offence-principle
    difficulty: 1
    stem: Whom does Feinberg's principle aim to protect from serious offence?
    options:
      - text: The actor, from offending their own conscience
        why: >-
          Tempting if you confuse it with paternalism, but protecting the actor is exactly what the offence principle
          does not do.
      - text: The majority, from conduct it judges immoral
        why: >-
          Protecting the majority's moral judgment is Devlin's popular moralism; Feinberg asks about serious offence,
          tested by universality.
      - text: The state, from conduct that threatens its existence
        why: That is Devlin's treason analogy; Feinberg's principle is about offended persons, not threats to the state.
      - text: Persons other than the actor
        correct: true
        why: 'Right: the quote speaks of "preventing serious offense...to persons other than the actor".'
  - key: c10
    type: mcq
    concept: feinbergs-offence-principle
    difficulty: 3
    stem: >-
      In Feinberg's statement, what two things must probably be true of a criminal prohibition for it to be supported by
      the offence principle?
    options:
      - text: That it is popular and that it is enforceable in practice
        why: >-
          Tempting because practical limits feature this week, but Feinberg's quote speaks of effectiveness and
          necessity, not popularity.
      - text: That it would effectively prevent serious offence and is a necessary means
        correct: true
        why: >-
          Right: a prohibition is supported if it "would probably be an effective way of preventing serious offense" and
          "is probably a necessary means to that end".
      - text: That it protects the actor from himself and that it promotes the general welfare
        why: >-
          Protecting the actor is paternalism and promoting general welfare is the welfare principle; neither is in
          Feinberg's statement.
      - text: That it reflects critical morality and that it prevents vice
        why: >-
          Critical morality and the prevention of vice belong to George's legal moralism, not to Feinberg's offence
          principle.
  - key: c11
    type: mcq
    concept: feinbergs-offence-principle
    difficulty: 3
    contrasts-with:
      - mills-harm-principle
    stem: Which statement correctly distinguishes Mill's harm principle from Feinberg's offence principle?
    options:
      - text: >-
          Mill's state may not act merely to protect people from offence; Feinberg allows it for serious, universal and
          unavoidable offence
        correct: true
        why: >-
          Right: on the slides Mill's state "exceeds its proper limits" if it protects a person from being offended,
          while Feinberg allows it if both tests are met.
      - text: Mill allows coercion to prevent offence; Feinberg allows it only to prevent physical harm
        why: >-
          This reverses the two: Mill excludes offence, and Feinberg's contribution is precisely to add serious offence
          as a reason.
      - text: Mill protects the actor from himself; Feinberg protects others from the actor
        why: Both protect others; neither protects the actor from himself, since both principles reject paternalism.
      - text: Mill relies on popular morality; Feinberg relies on critical morality
        why: 'Neither principle enforces a morality: that is the split between Devlin and George within legal moralism.'
  - key: c12
    type: mcq
    concept: feinbergs-offence-principle
    difficulty: 2
    stem: Which criticism of the harm principle does the offence principle most directly respond to?
    options:
      - text: That no person's affairs affect only that person
        why: >-
          Tempting because it is a listed criticism, but it attacks the self-regarding sphere; offence speaks to the
          reach of harm.
      - text: That Mill relies on utilitarian reasoning
        why: >-
          The slides do not list utilitarian reasoning as a problem with the harm principle; it is part of Mill's
          justification.
      - text: That it does not reach far enough, ignoring kinds of offence that could become harm
        correct: true
        why: >-
          Right: the slides say the narrow harm principle "does not reach far enough" and "does not address … kinds of
          offence that could become harm".
      - text: That it applies only to people in the maturity of their faculties, not to children or the incapacitated
        why: >-
          This is Mill's own limitation on scope, not one of the criticisms; the offence principle does not change who
          is covered.
  - key: c13
    type: mcq
    concept: feinbergs-offence-principle
    difficulty: 2
    stem: Why does the universality standard specify "regardless of sex, age, race, etc"?
    options:
      - text: To make the principle apply equally in every country
        why: Tempting, but the phrase is about whose reaction counts, not about the principle applying across countries.
      - text: So that the offence does not depend on belonging to a particular group
        correct: true
        why: >-
          Right: the reaction must be one expected from almost anyone chosen at random, whatever their sex, age or race;
          group-specific offence does not count.
      - text: To protect minority groups from being offended by the majority
        why: >-
          It works the other way: offence felt only by one group fails universality, so the standard does not give
          groups special protection.
      - text: So that only the reactions of the most vulnerable members of society are counted
        why: >-
          The standard looks to almost anyone at random, not to the most vulnerable; it deliberately excludes
          idiosyncratic reactions.
  - key: c14
    type: mcq
    concept: feinbergs-offence-principle
    difficulty: 2
    variant-of: c06
    stem: >-
      An adult shop has blacked-out windows and a plain sign. A passer-by says its mere existence offends her. Applying
      Feinberg, may the state close it on that ground?
    options:
      - text: Yes, because the offence principle covers any serious offence to others
        why: Tempting given Feinberg's quote, but the slides add two tests; offence alone does not trigger the principle.
      - text: Yes, because she cannot avoid knowing the shop exists
        why: >-
          Avoidability is about the behaviour itself; with blacked-out windows she can simply walk past without
          encountering it.
      - text: No, because Mill's harm principle overrides Feinberg's
        why: >-
          The slides present Feinberg as supplementing Mill, not as overridden by him; the question is whether
          Feinberg's own tests are met.
      - text: No, because the conduct is reasonably avoidable
        correct: true
        why: >-
          Right: with the windows blacked out she can avoid the behaviour, so the standard of reasonable avoidability is
          not met.
  - key: c15
    type: mcq
    concept: feinbergs-offence-principle
    difficulty: 2
    stem: What do the harm principle and the offence principle both reject, according to the lecture?
    options:
      - text: Paternalism
        correct: true
        why: >-
          Right: the lecture says both principles reject paternalism: each protects persons other than the actor, never
          the actor from himself.
      - text: Any use of the criminal law at all
        why: >-
          Tempting given their liberal spirit, but both principles justify some criminal prohibitions, to prevent harm
          or serious offence to others.
      - text: The distinction between public and private
        why: >-
          It is Devlin who denies a principled public–private distinction; Mill and Feinberg both rely on something like
          it.
      - text: The intrinsic value of personal autonomy
        why: >-
          Mill grounds the harm principle in personal autonomy; neither principle rejects it, since both are liberal
          principles.
  - key: c16
    type: mcq
    concept: feinbergs-offence-principle
    difficulty: 3
    variant-of: c05
    stem: >-
      Offensive conduct takes place every day outside the only entrance to a worker's office. She could avoid it only by
      giving up her job. Which statement best applies the avoidability standard?
    options:
      - text: It is not met, because she could in theory find other work
        why: >-
          Tempting because she could technically avoid it, but the standard is met where avoiding the behaviour "would
          be inconvenient for you".
      - text: It is irrelevant, because the conduct happens in public
        why: >-
          Avoidability is not decided by public versus private; it asks whether the offended person can reasonably avoid
          the behaviour.
      - text: It is met, because avoiding the conduct would be seriously inconvenient for her
        correct: true
        why: >-
          Right: you can expect a state response "if you cannot reasonably avoid such behaviour, or if avoiding the
          behaviour would be inconvenient for you".
      - text: It is met, so the conduct may be banned without more
        why: >-
          Avoidability alone is not enough: the standard of universality must also be met before the offence principle
          can be invoked.
  - key: c17
    type: truefalse
    concept: feinbergs-offence-principle
    difficulty: 1
    set: quickfire
    statement: >-
      Feinberg's offence principle requires both the standard of universality and the standard of reasonable
      avoidability to be met.
    answer: true
    why: >-
      True: the slide says that "in order to evoke the offense principle, two tests need to be met": universality and
      reasonable avoidability.
  - key: c18
    type: truefalse
    concept: feinbergs-offence-principle
    difficulty: 1
    set: quickfire
    statement: Mill's harm principle already allows the state to protect a person from being offended.
    answer: false
    why: >-
      False: on the slides the state "exceeds its proper limits if it tries … to protect another person from being
      offended"; Feinberg adds offence as a supplement.
  - key: c19
    type: truefalse
    concept: feinbergs-offence-principle
    difficulty: 2
    statement: Under the standard of universality, offence felt by only one religious group would be enough to justify coercion.
    answer: false
    why: >-
      False: the reaction must be expected from almost anyone chosen at random, regardless of sex, age, race and so on;
      group-specific offence fails.
  - key: c20
    type: short
    concept: feinbergs-offence-principle
    difficulty: 3
    prompt: '"The offence principle hands the state too much power over unpopular conduct." Discuss.'
    model: >-
      The offence principle, properly limited, does not hand the state too much power, because Feinberg's two tests
      filter out most unpopular conduct; the risk lies in how loosely they are applied. Feinberg holds that it is
      "always a good reason" for a criminal prohibition that it would probably be an effective and necessary way of
      preventing serious offence to persons other than the actor. It is a supplement to Mill, answering the criticism
      that harm does not reach far enough. The worry is real: offence has a greater reach than harm, and unpopular
      conduct offends many people. But two tests must be met. Universality requires a reaction expected from almost
      anyone chosen at random, regardless of sex, age or race, so group-specific or merely majority disgust fails.
      Reasonable avoidability requires that the offended person cannot reasonably avoid the conduct, so private or
      signed-off conduct fails. A critic may reply that "almost anyone" and "inconvenient" are elastic. On balance the
      principle is defensible because it targets unavoidable public encounters, not the moral status of conduct, which
      keeps it distinct from Devlin's moralism.
    rubric:
      - id: r1
        criterion: Thesis — takes a clear position on whether the offence principle gives the state too much power.
        marks: 2
        top-band: >-
          States a qualified thesis: not too much power if both tests are applied strictly, with the risk located in
          their elasticity.
        margin-note: Too much, or properly limited?
        authorities: []
      - id: r2
        criterion: Argument — states Feinberg's principle and explains both tests accurately.
        marks: 3
        top-band: >-
          Uses the quotation, the supplement relationship to Mill, and both standards with their wording ("almost anyone
          chosen at random"; "cannot reasonably avoid").
        margin-note: Both tests clearly stated.
        authorities: []
      - id: r3
        criterion: Counterargument — states the case that offence is too wide or the tests too elastic.
        marks: 3
        top-band: >-
          Explains why offence reaches further than harm and presses the vagueness of "almost anyone" and
          "inconvenient".
        margin-note: Fair statement of the worry.
        authorities: []
      - id: r4
        criterion: Evaluation — distinguishes offence from moralism and concludes.
        marks: 2
        top-band: >-
          Shows that the principle targets unavoidable encounters rather than immorality, separating it from Devlin, and
          concludes clearly.
        margin-note: Good contrast with Devlin.
        authorities: []
  - key: d01
    type: mcq
    concept: legal-paternalism
    difficulty: 1
    stem: What does the principle of legal paternalism maintain?
    options:
      - text: That state coercion is justified to prevent harm to others
        why: >-
          Tempting because paternalism is another liberty-limiting principle, but preventing harm to others is Mill's
          harm principle.
      - text: That immoral conduct should be criminalised even when it harms no one, not even the actor
        why: >-
          This is legal moralism; paternalism is concerned with the person's own good, not with the immorality of the
          conduct.
      - text: That state coercion is justified to protect individuals from self-inflicted harm
        correct: true
        why: >-
          Right: the slide defines it as justifying coercion "to protect individuals from self-inflicted harm; or to
          guide people … toward their own good".
      - text: That the state should be neutral on matters of the good life
        why: >-
          Neutrality on the good life is Rawls's position, which is the opposite of guiding people toward their own
          good.
  - key: d02
    type: mcq
    concept: legal-paternalism
    difficulty: 1
    stem: Which of these do the slides give as an example of the (soft) paternalism employed by all states?
    options:
      - text: The law of contract forbidding people to sell themselves into slavery
        correct: true
        why: >-
          Right: the slide lists prohibiting consent to one's own disablement or violent killing, and the contract rule
          against selling oneself into slavery.
      - text: Compulsory taxation to fund public projects that are in the public interest
        why: >-
          Tempting because it is also coercion for people's benefit, but the slides give compulsory taxation as the
          welfare principle's example.
      - text: Prohibiting bigamy because society judges it immoral
        why: Bigamy is Devlin's example of where enforcing morality is practical; it is legal moralism, not paternalism.
      - text: Stopping A from assaulting B to protect B's security
        why: Protecting B from A is the harm principle; paternalism concerns protecting a person from harm to themselves.
  - key: d03
    type: mcq
    concept: legal-paternalism
    difficulty: 2
    stem: How do the slides describe cases of hard paternalism?
    options:
      - text: Cases where the state uses physical force rather than fines
        why: >-
          Tempting because "hard" suggests force, but the slides define hard paternalism by its purpose, not by the type
          of sanction.
      - text: Cases where the majority strongly disapproves of the conduct
        why: Majority disapproval is the mark of Devlin's popular moralism, not of hard paternalism.
      - text: Cases where the conduct harms others as well as the actor
        why: If others are harmed, the harm principle applies; paternalism is about the person's own good.
      - text: Cases where the state intervenes for the person's own good
        correct: true
        why: >-
          Right: the slide says "cases of hard paternalism are ones where the state intervenes for the person's own
          good".
  - key: d04
    type: mcq
    concept: legal-paternalism
    difficulty: 2
    stem: How do the slides classify drug laws?
    options:
      - text: Always as clear cases of hard paternalism
        why: >-
          Tempting because drug laws are the lecture's main example of debate about paternalism, but the slides allow
          either classification.
      - text: As possibly either soft or hard examples of state paternalism
        correct: true
        why: >-
          Right: the slide says "some drug laws may be classified as either soft, or hard examples of state
          paternalism".
      - text: As examples of the welfare principle in action
        why: >-
          The welfare principle concerns compulsory support for public projects; drug laws are discussed under
          paternalism.
      - text: As examples of Devlin's practical limits
        why: Devlin's practical limits are illustrated by adultery and bigamy; the slides do not use drug laws there.
  - key: d05
    type: mcq
    concept: legal-paternalism
    difficulty: 2
    stem: Which of these is NOT one of the five considerations in the rationale for legal paternalism on the slides?
    options:
      - text: The seriousness of the harm being risked
        why: This is the second consideration on the slide, so it is part of the rationale and not the answer.
      - text: 'The necessity of the risk: is there a less risky way of achieving the goal?'
        why: This is the fifth consideration on the slide, asking whether a less risky way of achieving the goal exists.
      - text: Whether the majority finds the risky conduct disgusting
        correct: true
        why: >-
          Right: majority disgust is Devlin's test of popular morality; the paternalist rationale weighs probabilities,
          seriousness, value and necessity.
      - text: The probability that harm to oneself will result
        why: >-
          This is the first consideration on the slide: the degree of probability that harm to oneself will result from
          a course of action.
  - key: d06
    type: mcq
    concept: legal-paternalism
    difficulty: 2
    stem: On the slides, what does "the necessity of the risk" ask?
    options:
      - text: Whether there is a less risky way of achieving the goal
        correct: true
        why: 'Right: the slide glosses the fifth consideration as "is there a less risky way of achieving that goal?".'
      - text: Whether the person had any choice but to take the risk
        why: >-
          Tempting reading of "necessity", but the slide's question is about alternative, less risky ways of reaching
          the same goal.
      - text: Whether the state must act to protect third parties
        why: >-
          Protecting third parties is the harm principle's concern; the paternalist factors all concern the risk-taker's
          own good.
      - text: Whether the risk is serious enough to be worth regulating
        why: >-
          Seriousness is a separate consideration (the second); necessity asks whether the goal could be reached with
          less risk.
  - key: d07
    type: mcq
    concept: legal-paternalism
    difficulty: 3
    stem: >-
      A climber wants to scale a remote peak. The chance of injury is low and the achievement matters greatly to her.
      How strong is a paternalist case for banning the climb, on the slides' rationale?
    options:
      - text: Strong, because any risk of self-harm justifies intervention
        why: >-
          Tempting on a crude view, but the slides' rationale weighs probability and value; a low risk of harm and a
          valuable goal cut against intervening.
      - text: Strong, because climbing offends people who disapprove of it
        why: >-
          Offence is the offence principle's concern and needs universality and unavoidability; it plays no part in the
          paternalist rationale.
      - text: Irrelevant, because paternalism never applies to adults
        why: >-
          Paternalism applies to adults: the slides' examples (disablement, slavery contracts, drug laws) all involve
          adults.
      - text: Weak, because the probability of harm is low and the goal is highly valuable to her
        correct: true
        why: >-
          Right: the first and fourth considerations (probability of self-harm; value of the goal) both point against
          intervening here.
  - key: d08
    type: mcq
    concept: legal-paternalism
    difficulty: 3
    variant-of: d07
    stem: >-
      A drug carries a high probability of serious, lasting harm to the user and offers no goal that could not be
      reached more safely. On the slides' rationale, how strong is the paternalist case?
    options:
      - text: Weak, because only harm to others can justify coercion
        why: >-
          Tempting because it is Mill's view, but the question asks about the paternalist rationale, which does count
          harm to self.
      - text: 'Relatively strong: probability, seriousness and necessity all favour it'
        correct: true
        why: >-
          Right: high probability of harm, serious harm, and an unnecessary risk (a safer route exists) all point toward
          the paternalist case.
      - text: Strong, because drug use is immoral whether or not it harms anyone at all
        why: >-
          That is a legal moralist argument; the paternalist rationale turns on the person's own good, not on the
          immorality of drug use.
      - text: Irrelevant, because drug laws are always soft paternalism
        why: >-
          The slides say drug laws may be either soft or hard; and the classification does not make the five
          considerations irrelevant.
  - key: d09
    type: mcq
    concept: legal-paternalism
    difficulty: 2
    contrasts-with:
      - mills-harm-principle
      - feinbergs-offence-principle
    stem: >-
      According to the lecture, what is the key difference in focus between paternalistic arguments and the harm and
      offence principles?
    options:
      - text: Paternalism relies on popular morality, while the harm and offence principles rely on critical morality
        why: >-
          Tempting because the week stresses the two moralities, but that split belongs to legal moralism, not to
          paternalism versus harm.
      - text: Paternalism concerns criminal law; the others concern civil law
        why: >-
          The slides give paternalist examples from contract law and criminal law alike; the difference is about whose
          good is in view.
      - text: Paternalism focuses on the individual's own well-being; the others on harm or offence to others
        correct: true
        why: >-
          Right: the lecture says paternalistic arguments "focus on the well-being of the individual", whereas the harm
          and offence principles focus on others.
      - text: Paternalism is utilitarian; the harm and offence principles are not
        why: >-
          Mill's defence of the harm principle is partly utilitarian, so this contrast does not work; the difference is
