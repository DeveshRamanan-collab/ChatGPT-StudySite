      - text: Between suppressing sexual immorality and suppressing treason or subversive activity
        correct: true
        why: >-
          Right: "Hart criticises Lord Devlin's comparison between suppression of sexual immorality and suppression of
          treason / subversive activity".
      - text: Between popular morality and critical morality
        why: >-
          That is a distinction, not one of Devlin's comparisons; Hart uses it himself when he asks whether general
          morality is rational.
  - key: f07
    type: mcq
    concept: harts-reply-to-devlin
    difficulty: 2
