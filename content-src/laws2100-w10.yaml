week_file:
  topic: The moral limits of the law
  summary: >-
    Week 10 asks when the state may use coercion against individual freedom, through five justifying principles: harm to
    others (Mill), offence (Feinberg), harm to self (legal paternalism), immorality (legal moralism) and the general
    welfare. Part B turns to the legal enforcement of morality: the Hart–Devlin debate, George's critical legal
    moralism, and Rawls's neutrality against Raz's liberal perfectionism. Two case studies, adult pornography and
    voluntary euthanasia, test the principles for essay answers.
  source-note: >-
    Built from the Week 10 lecture slides and the Echo360 transcript of the 2025 pre-recorded lecture (The Moral Limits
    of the Law). The slides give the structure, names and quotations; the transcript supplies the lecturer's
    explanations. The recording's remarks about last year's exam and dates were left out.
  notes: >-
    ## Structure


    **Part A – State coercion vs individual freedom:** the harm principle; the offence principle; legal paternalism;
    legal moralism; the welfare principle.


    **Part B – The legal enforcement of morality:** the Hart–Devlin debate; other liberal approaches (Rawls and Raz);
    two case studies: adult pornography and voluntary euthanasia.


    The lecture: the tension between the use of public force and individual freedom has to be read in the context of a
    liberal democracy. Some of these arguments only make sense against its institutions and values; run in a different
    framework they may be impossible or problematic.


    ## State coercion vs individual freedom


    Five ideas are commonly used to justify the use of public force:


    1. Prevention of harm to others (on the harm principle, see John Stuart Mill (1806 – 1873)).

    2. Prevention of offence (on the offence principle, see Joel Feinberg (1926 – 2004)).

    3. Prevention of harm to self (legal paternalism).

    4. Prevention of immoral conduct (even when there is no harm/offence).

    5. General welfare/public interest.


    - Remember the distinction between **popular** and **critical** morality (popular, social or positive morality is
    what a society conventionally regards as right; critical morality is often associated with an objective morality, as
    in the natural law tradition).

    - From a liberal point of view, the prevention of immorality in the absence of harm is not a legitimate reason to
    limit our freedom.


    ## John Stuart Mill and On Liberty


    Mill's works include System of Logic (1843), Principles of Political Economy (1848), *On Liberty* (1859) (the
    struggle between authority and liberty), Utilitarianism (1861), Considerations on Representative Government (1861)
    and *The Subjection of Women* (1869); see also Harriet Taylor Mill, *The Enfranchisement of Women* (1851). The
    dedication of *On Liberty* and Mill's Autobiography acknowledge how much of his best thought came from his wife
    (and, for *The Subjection of Women*, his daughter). The lecture: it helps to know the social, historical and
    personal context of these texts.


    - Mill explores the relation between authority and liberty.

    - The function of liberal democratic states is to set limits to the power which the ruler/government can exercise
    over society; these limits protect a space for individual liberty.

    - Everyone generally agrees that there is a limit to how far governments can interfere with our liberty and
    independence. (The lecture: a totalitarian regime claims the opposite, a legitimate power to regulate every aspect
    of life.)

    - Mill asks what the limits of the government's authority ought to be, whether physical force should be used in
    asserting it, and whether public opinion about morality can be subject to legal regulation. It is a normative
    exercise.


    ## Mill's harm principle


    :::rule

    "The only purpose for which power can be rightfully exercised over any member of a civilised community, against his
    will, is to prevent harm to others." (Mill, *On Liberty*)

    :::


    - Our own good (either physical or moral) is not a good enough reason to justify "compulsion and control, whether
    the means used be physical force in the form of legal penalties, or the moral coercion of public opinion".

    - We are responsible to society and the state only for the aspects of our conduct that (may) harm other members of
    the community. Over their own body and mind, the individual is sovereign.

    - "It is […] hardly necessary to say that this doctrine is meant to apply only to human beings in the maturity of
    their faculties."


    **Causing harm.** The key idea is harmful behaviour. It is not just a matter of affecting another person's
    interests: causing harm involves infringing another person's interests that we are under a duty not to infringe —
    the violation of a specific duty to the public, or behaviour that causes perceptible hurt to a specific individual.
    Remember the link between interests, entitlements and rights (week 9). The lecture: the classic liberal interests
    here are physical (bodily) integrity and property.


    **Applying it.** The state can legitimately stop A from assaulting B, even though this limits A's freedom of action,
    because it prevents harm to B and protects her/his security; it can stop A stealing B's property, protecting B's
    freedom to use it. But it exceeds its proper limits if it tries to stop A destroying her/his own property, or to
    protect another person from being offended. Behaviour which is not harmful (or harms people with their consent, or
    harms only the actor) should not be punished: we should have perfect freedom to behave in such ways, no matter how
    "foolish, perverse, or wrong" our conduct may be.


    ## Justifying and criticising the harm principle


    - **Justification:** the value of personal autonomy and the **presumptive case for liberty** — whatever we seem to
    think about freedom, we agree it is of intrinsic value for both the individual and society.

    - Mill argues that following the harm principle brings **maximum happiness in the long run**: experimentation with
    different kinds of lifestyles is valuable for the whole society, even though the majority may find these experiments
    in living unsavoury or offensive; and enjoying and exercising personal freedom is "one of the principal ingredients
    of human happiness".

    - The lecture: so an intrinsic (non-instrumental) value of liberty sits at the foundation, and a utilitarian
    argument about long-run consequences is built on top of it.


    **Some problems:** (1) it conceives of harm very narrowly, as damage to a person or her property — arguably it does
    not reach far enough; (2) it assumes social interference is unjustified in affairs that concern only the person, but
    no person's affairs have effects only on that person; (3) it does not address indirect harms, or kinds of offence
    that could become harm.


    ## The offence principle (Feinberg)


    :::definition

    "It is always a good reason in support of a proposed criminal prohibition that it would probably be an effective way
    of preventing serious offense...to persons other than the actor, and that it is probably a necessary means to that
    end... The principle asserts, in effect, that the prevention of offensive conduct is properly the state's business."
    (Feinberg)

    :::


    The offence principle is deemed a supplement to the harm principle. To invoke it, two tests must be met:


    - **The standard of universality:** for the offensiveness to justify coercion, it should be a reaction that could be
    expected from almost anyone chosen at random (regardless of sex, age, race, etc).

    - **The standard of reasonable avoidability:** you can only expect a response from the state to certain behaviour if
    you cannot reasonably avoid it, or if avoiding it would be inconvenient for you.


    The lecture: offence has a greater reach than harm, so the two standards narrow it into a workable principle. Both
    the harm and the offence principles reject paternalism.


    ## Legal paternalism


    - Legal paternalism maintains that state coercion is justified to protect individuals from self-inflicted harm, or
    to guide people, whether they like it or not, toward their own good.

    - All states employ some elements of (soft) paternalism: eg prohibiting people from consenting to their own
    disablement or violent killing; the law of contract forbids selling oneself into slavery.

    - Cases of hard paternalism are ones where the state intervenes for the person's own good. Some drug laws may be
    classified as either soft or hard examples.


    **The rationale for legal paternalism** weighs: (1) the degree of probability that harm to oneself will result from
    a given course of action; (2) the seriousness of the harm being risked; (3) the degree of probability that the goal
    we want to reach will in fact result from the course of action; (4) the value or importance of achieving that goal
    (how worthwhile is it?); (5) the necessity of the risk (is there a less risky way of achieving that goal?).


    The lecture: paternalistic arguments focus on the well-being of the individual, whereas the harm and offence
    principles focus on harm or offence to others.


    ## Legal moralism and the welfare principle


    - For **legal moralism**, the fact that a given behaviour is immoral is a legitimate reason to criminalise it. The
    focus is on the action, not its harmful consequences.

    - Popular vs critical morality: if the majority considers conduct immoral/degrading, it should be prohibited (eg
    Lord Patrick Devlin); if conduct is really/objectively immoral, it should be prohibited (eg Robert George).

    - There are acknowledged practical limits to using (criminal) law for moralistic reasons. The lecture: practical
    limits are just facts about the world, not a normative justification like Mill's. The real question is: what are the
    **moral limits** of positive law?

    - The **welfare principle** justifies state intervention for the general welfare: the modern state has no choice but
    to force (usually by compulsory taxation) willing and unwilling citizens to support public projects in the public
    interest that they may not benefit from. Is it an example of legal paternalism? Is it a matter of social justice
    (next week)?


    The lecture: the harm and offence principles are negative in nature (limits on public force); paternalism and
    moralism look instead at positive action the state should take to help people live a good life.


    ## The legal enforcement of morality


    Should our legal system enforce morality? Positive law already overlaps with some moral views (criminal and moral
    wrongdoing run in parallel); as Hart accepted (week 3), that is a contingent fact, not a conceptual connection. The
    question here is normative: is immorality sufficient for criminalisation?


    Lord Patrick Devlin's central claim is that if a given behaviour is immoral (by common standard), then the law-maker
    has a prima facie right to prohibit it. The key idea is that immoral conduct should be criminalised even if it
    causes no harm/offence to the actor or to others.


    :::case

    Report of the Departmental Committee on Homosexual Offences and Prostitution (the Wolfenden report, after its
    chairman Sir John Wolfenden), UK, 1957 — recommended that "homosexual behaviour between consenting adults in private
    should no longer be a criminal offence".

    :::


    The exchange: Patrick Devlin, Maccabean Lecture in Jurisprudence at the British Academy, 'Morals and the Criminal
    Law' (1959); H.L.A. Hart, 'Immorality and Treason' (1959); Hart, *Law, Liberty and Morality* (1963); Devlin, *The
    Enforcement of Morals* (1965); Hart, *The Morality of the Criminal Law* (1965). The lecture: here Hart writes as a
    lawyer and public intellectual making normative arguments, not as a general jurisprude.


    ## Devlin's popular legal moralism


    - Popular morality is what is conventionally regarded as morally right by society (critical morality is what is
    objectively right). The majority has the right to translate conventional moral judgments into criminal law.

    - Contra Mill, there is no principled distinction between the private sphere and the public sphere (compare week 8).

    - The criminal law as it stands does not respect Mill's principle: it often punishes harmless behaviour and so
    enforces a moral principle for no reason other than that it is right to do so (violations of rights and offences
    against society). Voluntary euthanasia is prohibited because it threatens the sanctity of human life, a fundamental
    moral principle.


    Devlin's three questions: (1) Has society the right to pass judgement on moral matters? (2) If so, can society use
    the weapon of the law to enforce its judgements? (3) Should society use the weapon of the law in all cases, or only
    in some? On (1) and (2), shared moral beliefs are necessary to society: without a shared morality the social order
    would break down. (3) is a practical problem: enforcing morality can be impractical (adultery vs bigamy — the
    lecture: both are wrong on Devlin's view, but only bigamy, because marriage is regulated and recorded, can feasibly
    be enforced).


    How do we know society's moral views? Take the point of view of the man in the street / the man in the jury box /
    the man on the Clapham omnibus. The reasonable man's moral judgments are a matter of common sense and feelings:
    **intolerance, indignation and disgust**. For Devlin there are no limits to legislation against immorality, as there
    are no limits to legislation against treason and sedition.


    ## Hart's reply


    - 'Immorality and Treason' (1959): "The most remarkable feature of Sir Patrick's lecture is his view of the nature
    of morality – the morality which the criminal law may enforce". Moral judgments sit between rationality and
    feelings: "a real feeling of reprobation" — but is morality a compound of intolerance, indignation and disgust?

    - For Devlin a collection of individuals becomes a society because they have (among other things) a shared or public
    morality. The lecture: Hart's minimum content of natural law (week 4) concedes only a minimal shared morality.

    - There are multiple criteria for when liberty may be restricted; morality is not a seamless web. Hart asks two
    questions: (1) Is this behaviour, which offends moral feelings, harmful (independently of its repercussion on the
    general moral code)? (2) Is it true that, if we do not criminalise it, we will jeopardise the whole fabric of
    morality and society? He criticises Devlin's comparison between suppressing sexual immorality and suppressing
    treason/subversive activity.


    **The deeper criticism:** it must be possible to rationally assess the claim that a given immoral behaviour should
    be punished by law, using reason, sympathetic understanding and critical intelligence. Is general morality based
    upon ignorance, superstition or misunderstanding? Is there a false conception of the practice as dangerous/hostile
    to society? Are the misery and evil consequences of criminal punishment well understood?


    ## George's critical legal moralism


    Robert P. George (McCormick Professor of Jurisprudence, Princeton), *Making Men Moral: Civil Liberties and Public
    Morality* (OUP, 1993), agrees with Devlin that the law should protect our moral character by prohibiting vice, even
    if the conduct is harmless. But the standards the law enforces should come from critical morality (true or objective
    morality), not the majority's beliefs, which may not be sound.


    ## Other liberal approaches: Rawls and Raz


    - **John Rawls (1921 – 2002)** distinguishes the **right** (principles of justice, including the protection of
    rights) from the **good** (the sphere of value). The state should be "neutral" on all matters of the good life; the
    only justification for state interference is to prevent rights violations and to punish those who violate the rights
    of others.

    - **Joseph Raz (1939 – 2022)** rejects state neutrality: the state is entitled to (and should) promote intrinsically
    worthy ways of life and discourage intrinsically unworthy ones. Raz is a **liberal perfectionist**, but the state
    should not use the criminal law to pursue perfectionist ideals; it may promote virtue by non-coercive means (eg
    taxing activities of which the majority disapproves).


    ## Case study I: adult pornography


    - Traditionally, the justifications for banning pornography were its offensiveness to the moral standards of the
    community or its tendency to deprave and corrupt.

    - From the liberal perspective these are obviously moralistic and do not aim to prevent harm: if the enjoyment of
    sexually explicit material is a private matter, it should not be prohibited by law.

    - Cf. Catharine MacKinnon and Andrea Dworkin: a distinction between erotica and pornography; the issue is not
    preventing an allegedly immoral yet harmless action; pornography harms women and infringes women's right to equality
    (compare week 8).


    ## Case study II: voluntary euthanasia


    - **Voluntary** euthanasia is carried out at the request of an adult person of sound mind; **non-voluntary**
    euthanasia is performed on someone not capable of understanding the choice between life and death.

    - **Passive** euthanasia involves intentionally letting someone die; **active** euthanasia involves a positive act
    of killing.

    - Adults in full command of their mental capacities have the right to refuse life-sustaining treatment, but cannot
    ask to be actively killed. Is the choice of voluntary, active euthanasia harmful? Does it violate the rights of
    others?


    :::examtip

    Name the principle before you argue. For any conduct, ask in order: harm to others? serious, unavoidable offence?
    harm to self? immorality alone (popular or critical)? general welfare? Then state the strongest version of the
    opposing view (Devlin's social-cohesion argument; MacKinnon and Dworkin's harm argument) before you evaluate it.

    :::
