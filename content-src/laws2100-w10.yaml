  - key: d10
    type: mcq
    concept: legal-paternalism
    difficulty: 1
    stem: Which consideration asks "how worthwhile is it?"
    options:
      - text: The value or importance of achieving the goal
        correct: true
        why: >-
          Right: the fourth consideration on the slide is "the value or importance of achieving that goal (how
          worthwhile is it?)".
      - text: The seriousness of the harm being risked
        why: >-
          Tempting because both involve weighing, but seriousness concerns the harm, while "how worthwhile is it?"
          concerns the goal.
      - text: The probability that the goal will in fact result
        why: This third consideration asks whether the goal will be reached, not how worthwhile the goal is.
      - text: The necessity of the risk being taken
        why: Necessity asks whether there is a less risky way of achieving the goal, not how valuable the goal is.
  - key: d11
    type: mcq
    concept: legal-paternalism
    difficulty: 2
    stem: What do the slides mean by saying "all states employ some elements of (soft) paternalism"?
    options:
      - text: That all states are, at bottom, totalitarian
        why: >-
          Tempting as an exaggeration, but the lecture contrasts liberal states with totalitarian ones; some paternalism
