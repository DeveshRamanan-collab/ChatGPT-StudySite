        why: 'Tempting to rule out, but this is on the slide: the first of Hart''s questions under rational criticism.'
      - text: Is there a false conception of the practice as dangerous or hostile to society?
        why: 'This is on the slide: Hart asks whether the practice is falsely conceived as dangerous or hostile to society.'
      - text: Are the misery and evil consequences of criminal punishment well understood?
        why: This is the third question on the slide, asking whether the costs of punishment are understood.
      - text: Does the man in the jury box feel intolerance, indignation and disgust?
        correct: true
        why: >-
          Right: this is Devlin's test, not Hart's question; Hart challenges whether such feelings can settle what the
          law should punish.
  - key: f09
    type: mcq
    concept: harts-reply-to-devlin
    difficulty: 3
    stem: >-
