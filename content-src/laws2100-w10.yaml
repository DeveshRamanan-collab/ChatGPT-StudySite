      - text: The Morality of the Criminal Law, published in the same year by Hart
        why: This 1965 work is Hart's, the last item in the exchange as listed on the slides.
      - text: 'Making Men Moral: Civil Liberties and Public Morality'
        why: >-
          This is Robert George's 1993 book, setting out a critical version of legal moralism, not part of the 1957–65
          exchange.
  - key: f12
    type: mcq
    concept: harts-reply-to-devlin
    difficulty: 1
    stem: What is the title of Hart's 1963 book in the debate?
