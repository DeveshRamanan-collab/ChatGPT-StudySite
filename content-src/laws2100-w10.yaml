      - text: George's, because it protects rights grounded in objective morality
        why: >-
          George would use the law to prohibit vice even when harmless; this state intervenes only for rights
          violations.
      - text: Devlin's, because the state reflects the majority's wish for limited government
        why: >-
          Devlin's state may legislate against immorality without limit, as against treason; that is the opposite of
          this state.
      - text: Rawls's, because the state is neutral on the good
        correct: true
        why: >-
          Right: Rawls's state is "neutral" on the good life, and the only justification for interference is preventing
          and punishing rights violations.
  - key: g14
    type: mcq
    concept: rawls-and-raz
    difficulty: 3
    contrasts-with:
      - devlins-legal-moralism
    stem: Which statement best distinguishes Raz from the legal moralists Devlin and George?
    options:
      - text: They share a concern with the good, but Raz rejects criminal law as the means
        correct: true
        why: >-
          Right: Raz, like the moralists, thinks the state may care about the good life, but he would not use the
          criminal law to pursue it.
      - text: Raz enforces critical morality; Devlin and George enforce popular morality
        why: Tempting, but George enforces critical morality, and Raz enforces no morality through criminal law at all.
      - text: Raz is neutral on the good life; Devlin and George reject neutrality
        why: 'Raz rejects neutrality too: the slide says he rejects Rawls''s idea of state neutrality.'
      - text: Raz criminalises harmful vice; the moralists criminalise harmless vice
        why: Raz is not described as criminalising vice at all; his tools for promoting virtue are non-coercive.
  - key: g15
    type: mcq
    concept: rawls-and-raz
    difficulty: 3
    contrasts-with:
      - legal-paternalism
    stem: What does Raz's perfectionism share with legal paternalism, on the lecture's account?
    options:
      - text: Both rely on the man in the jury box to identify what is worthy
        why: >-
          Tempting because both concern values, but the jury box is Devlin's test of popular morality, not shared by Raz
          or paternalism.
      - text: Both accept that criminal law is the natural tool for guiding choices
        why: Raz rejects criminal law for perfectionist ends; this is where he parts company with hard paternalism.
      - text: Both see the state as having a role in helping people live a good life
        correct: true
        why: >-
          Right: the lecture groups paternalism with positive action helping people live a good life, and says
          paternalist questions return in Raz's perfectionism.
      - text: Both reject state involvement in questions of value
        why: >-
          Rejecting state involvement in value is Rawls's neutrality; Raz and paternalists both involve the state in
          people's good.
  - key: g16
    type: mcq
    concept: rawls-and-raz
    difficulty: 2
    variant-of: g12
    stem: >-
      A state generously funds theatres and libraries because it judges these ways of life worthy, and bans nothing. Is
      this consistent with Raz?
    options:
      - text: No, because Raz requires the state to remain neutral
        why: Tempting because some liberals require neutrality, but that is Rawls; Raz rejects neutrality.
      - text: 'Yes: it promotes worthy ways of life without criminal law'
        correct: true
        why: >-
          Right: Raz says the state should promote intrinsically worthy ways of life, and has no problem with
          non-coercive means of doing so.
      - text: No, because promoting the good life is legal moralism
        why: >-
          Legal moralism criminalises immoral conduct; funding worthy activities without bans is not moralism in the
          slides' sense.
      - text: Yes, but only if a majority approves of the activities
        why: >-
          Raz's test is whether ways of life are intrinsically worthy, not majority approval; majority disapproval
          appears only in his tax example.
  - key: g17
    type: mcq
    concept: rawls-and-raz
    difficulty: 1
    stem: Which pairing of names and dates matches the slides?
    options:
      - text: John Rawls (1921 – 2002); Joseph Raz (1939 – 2022)
        correct: true
        why: 'Right: the slides give John Rawls (1921 – 2002) and Joseph Raz (1939 – 2022).'
      - text: John Rawls (1806 – 1873); Joseph Raz (1926 – 2004)
        why: 'Tempting if you mix up the week''s dates: 1806–1873 is Mill and 1926–2004 is Feinberg.'
      - text: John Rawls (1939 – 2022); Joseph Raz (1921 – 2002)
        why: 'This swaps the two: on the slides Rawls is the elder (1921–2002) and Raz the younger (1939–2022).'
      - text: John Rawls (1926 – 2004); Joseph Raz (1806 – 1873)
        why: These are Feinberg's and Mill's dates from Part A, not those of Rawls and Raz.
  - key: g18
    type: truefalse
    concept: rawls-and-raz
    difficulty: 1
    set: quickfire
    statement: Raz rejects Rawls's idea of state neutrality.
    answer: true
    why: 'True: the slide says "Raz rejects Rawls''s idea of state neutrality"; the state should promote worthy ways of life.'
  - key: g19
    type: truefalse
    concept: rawls-and-raz
    difficulty: 1
    set: quickfire
    statement: Raz thinks the state should use the criminal law to pursue perfectionist ideals.
    answer: false
    why: >-
      False: Raz thinks the state should not use the criminal law to promote worthy ways of life; it may use
      non-coercive means such as taxation.
  - key: g20
    type: truefalse
    concept: rawls-and-raz
    difficulty: 2
    statement: >-
      For Rawls, the only justification for state interference is to prevent rights violations and to punish those who
      violate the rights of others.
    answer: true
    why: >-
      True: this is the slide's statement of Rawls's view, following from his neutrality on the good and his sphere of
      the right.
  - key: h01
    type: mcq
    concept: pornography-and-euthanasia
    difficulty: 1
    set: pretest
    stem: On the slides, what were the traditional justifications for banning pornography?
    options:
      - text: That it harms women and infringes women's right to equality
        why: >-
          Tempting because it is on the same slide, but this is MacKinnon and Dworkin's harm argument, not the
          traditional justification.
      - text: Its offensiveness to community moral standards or its tendency to deprave and corrupt
        correct: true
        why: >-
          Right: "traditionally, the justifications for banning pornography were its offensiveness to the moral
          standards of the community or its tendency to deprave and corrupt".
      - text: That it causes perceptible hurt to specific individuals who view it
        why: >-
          Perceptible hurt to a specific individual is the slides' description of Mill's harm; it is not the traditional
          ground.
      - text: That it is a private matter beyond the reach of the law
        why: This is the liberal objection to banning pornography, not a justification for banning it.
  - key: h02
    type: mcq
    concept: pornography-and-euthanasia
    difficulty: 2
    stem: Why, from the liberal perspective, are the traditional justifications for banning pornography flawed?
    options:
      - text: Because they rely on harm, which is too narrow a concept to cover offence
        why: >-
          Tempting because harm's narrowness is a criticism of Mill, but the slides say the traditional justifications
          do not aim at harm at all.
      - text: Because they rest on critical morality rather than popular morality
        why: >-
          Community moral standards are popular morality; the liberal objection is that the grounds are moralistic,
          whichever morality.
      - text: Because they ignore the distinction between erotica and pornography
        why: That distinction is drawn by MacKinnon and Dworkin for a different argument; it is not the liberal objection.
      - text: Because they are moralistic and do not aim to prevent harm
        correct: true
        why: >-
          Right: "these justifications suffer from the flaw that they are obviously moralistic and do not aim to prevent
          harm".
  - key: h03
    type: mcq
    concept: pornography-and-euthanasia
    difficulty: 1
    stem: What do Catharine MacKinnon and Andrea Dworkin argue about pornography, according to the slides?
    options:
      - text: That it harms women and infringes women's right to equality
        correct: true
        why: >-
          Right: the slide says, citing MacKinnon and Dworkin, "pornography harms women and infringes women's right to
          equality".
      - text: That it should be banned because the community finds it offensive
        why: >-
          Tempting because they favour restriction, but they say the issue is "not preventing an allegedly immoral yet
          harmless action".
      - text: That it is a private matter which the law should not regulate
        why: >-
          This is the liberal objection to the traditional bans; MacKinnon and Dworkin reject treating pornography as a
          private, harmless matter.
      - text: That it depraves and corrupts those who choose to consume it
        why: >-
          Depraving and corrupting is one of the traditional moralistic justifications; MacKinnon and Dworkin focus on
          harm to women.
  - key: h04
    type: mcq
    concept: pornography-and-euthanasia
    difficulty: 2
    stem: Which distinction do MacKinnon and Dworkin draw?
    options:
      - text: Between voluntary and non-voluntary consumption of sexual material
        why: >-
          Tempting because voluntary/non-voluntary appears this week, but that distinction belongs to the euthanasia
          case study.
      - text: Between private enjoyment and public display of sexual material
        why: >-
          The private–public line is the liberal's premise; MacKinnon and Dworkin's distinction is between kinds of
          material.
      - text: Between erotica and pornography
        correct: true
        why: >-
          Right: the slide lists "distinction between erotica and pornography" as the first point of MacKinnon and
          Dworkin's position.
      - text: Between popular and critical moral standards about sex
        why: >-
          The popular–critical distinction separates Devlin and George; it is not the distinction MacKinnon and Dworkin
          draw.
  - key: h05
    type: mcq
    concept: pornography-and-euthanasia
    difficulty: 1
    stem: How do the slides define voluntary euthanasia?
    options:
      - text: Euthanasia performed on someone not capable of understanding the choice
        why: Tempting because the terms are paired, but this is the slides' definition of non-voluntary euthanasia.
      - text: Euthanasia carried out at the request of an adult person of sound mind
        correct: true
        why: 'Right: "voluntary euthanasia is carried out at the request of an adult person of sound mind".'
      - text: Euthanasia that involves intentionally letting someone die
        why: Intentionally letting someone die is passive euthanasia; it can be voluntary or not.
      - text: Euthanasia that involves a positive act of killing
        why: A positive act of killing is active euthanasia, a separate distinction from voluntary and non-voluntary.
  - key: h06
    type: mcq
    concept: pornography-and-euthanasia
    difficulty: 1
    stem: How do the slides define non-voluntary euthanasia?
    options:
      - text: Euthanasia carried out against the clearly expressed wishes of the patient
        why: >-
          Tempting reading of "non-voluntary", but the slides define it by incapacity to understand the choice, not by
          contrary wishes.
      - text: Euthanasia that involves intentionally letting someone die
        why: This is passive euthanasia, which concerns the means (letting die), not the person's capacity.
      - text: Euthanasia carried out at the request of an adult person of sound mind
        why: This is voluntary euthanasia, the opposite case on the slide.
      - text: Euthanasia on someone not capable of understanding the choice between life and death
        correct: true
        why: >-
          Right: "non-voluntary euthanasia is performed on someone who is not capable of understanding the choice
          between life and death".
  - key: h07
    type: mcq
    concept: pornography-and-euthanasia
    difficulty: 1
    stem: How do the slides define passive euthanasia?
    options:
      - text: Intentionally letting someone die
        correct: true
        why: 'Right: "passive euthanasia involves intentionally letting someone die".'
      - text: A positive act of killing at the patient's own request
        why: Tempting because it is the paired term, but a positive act of killing is active euthanasia.
      - text: Euthanasia on someone who cannot understand the choice
        why: This is non-voluntary euthanasia, which concerns capacity rather than whether the act is passive or active.
      - text: Euthanasia that the patient's family requests on their behalf
        why: The slides do not define any category by a family's request; passive euthanasia is about letting someone die.
  - key: h08
    type: mcq
    concept: pornography-and-euthanasia
    difficulty: 1
    stem: How do the slides define active euthanasia?
    options:
      - text: Intentionally letting someone die by withdrawing treatment
        why: Tempting because both involve intention, but intentionally letting someone die is passive euthanasia.
      - text: Euthanasia carried out at the request of a person of sound mind
        why: This is voluntary euthanasia, which concerns the request, not whether a positive act is involved.
      - text: A positive act of killing
        correct: true
        why: 'Right: "active euthanasia involves a positive act of killing".'
      - text: Euthanasia that the criminal law of every state allows to adults
        why: The slides do not say this; indeed they note adults "cannot ask to be actively killed".
  - key: h09
    type: mcq
    concept: pornography-and-euthanasia
    difficulty: 2
    stem: >-
      The slides state that adults in full command of their mental capacities may refuse life-sustaining treatment but
      cannot ask to be actively killed. Which distinction does this claim turn on?
    options:
      - text: Voluntary vs non-voluntary
        why: >-
          Tempting because the claim concerns competent adults, but both halves involve voluntary choices; the line
          drawn is between letting die and killing.
      - text: Passive vs active
        correct: true
        why: >-
          Right: refusing treatment is letting someone die (passive), while asking to be killed requires a positive act
          (active), and the claim treats them differently.
      - text: Popular vs critical morality
        why: The claim is not framed in terms of whose morality counts; it distinguishes kinds of euthanasia.
      - text: Erotica vs pornography
        why: This is MacKinnon and Dworkin's distinction in the pornography case study, not the euthanasia one.
  - key: h10
    type: mcq
    concept: pornography-and-euthanasia
    difficulty: 2
    stem: >-
      A competent adult patient asks for her ventilator to be switched off, knowing she will die. Classify this using
      the slides' terms.
    options:
      - text: Non-voluntary and active euthanasia
        why: >-
          Tempting because switching off is an act, but she is of sound mind and requests it, so it is not
          non-voluntary.
      - text: Voluntary and active euthanasia
        why: >-
          She requests it, so it is voluntary, but withdrawing treatment lets her die rather than being a positive act
          of killing.
      - text: Non-voluntary and passive euthanasia
        why: 'It is passive, but not non-voluntary: she is capable of understanding the choice and asks for it.'
      - text: Voluntary and passive euthanasia
        correct: true
        why: >-
          Right: it is at the request of an adult of sound mind (voluntary), and it intentionally lets her die
          (passive); refusal of life-sustaining treatment is permitted.
  - key: h11
    type: mcq
    concept: pornography-and-euthanasia
    difficulty: 2
    stem: >-
      At the request of a competent adult patient, a doctor administers a lethal injection. Classify this using the
      slides' terms.
    options:
      - text: Voluntary and active euthanasia
        correct: true
        why: >-
          Right: the patient is an adult of sound mind who requests it (voluntary), and the injection is a positive act
          of killing (active).
      - text: Voluntary and passive euthanasia
        why: Tempting because the patient consents, but an injection is a positive act of killing, not letting someone die.
      - text: Non-voluntary and active euthanasia
        why: 'It is active, but not non-voluntary: the patient is competent and asked for it.'
      - text: Non-voluntary and passive euthanasia
        why: 'Neither label fits: the patient chose, and the doctor acted positively rather than letting the patient die.'
  - key: h12
    type: mcq
    concept: pornography-and-euthanasia
    difficulty: 2
    variant-of: h10
    stem: >-
      A patient in a long-term coma, who never expressed any wishes, has life support withdrawn. Classify this using the
      slides' terms.
    options:
      - text: Voluntary and passive euthanasia
        why: >-
          Tempting because withdrawal is passive, but there is no request by a person of sound mind, so it is not
          voluntary.
      - text: Voluntary and active euthanasia
        why: 'Neither label fits: there is no request, and withdrawing support lets the patient die rather than killing.'
      - text: Non-voluntary and passive euthanasia
        correct: true
        why: >-
          Right: the patient cannot understand the choice (non-voluntary), and withdrawing life support intentionally
          lets them die (passive).
      - text: Non-voluntary and active euthanasia
        why: >-
          It is non-voluntary, but withdrawing life support is letting die, which the slides call passive, not a
          positive act of killing.
  - key: h13
    type: mcq
    concept: pornography-and-euthanasia
    difficulty: 3
    contrasts-with:
      - devlins-legal-moralism
    stem: How does MacKinnon and Dworkin's argument change the terms of the pornography debate, in the week's framework?
    options:
      - text: It replaces a harm argument with a moralist argument based on community standards
        why: >-
          Tempting, but it is the reverse: the traditional argument was moralistic; MacKinnon and Dworkin's is about
          harm.
      - text: 'It moves the argument from moralism to harm: pornography harms women and their equality'
        correct: true
        why: >-
          Right: they say "the issue is not preventing an allegedly immoral yet harmless action": pornography harms
          women, so the harm principle is engaged.
      - text: It moves the argument from harm to offence, applying Feinberg's two tests
        why: >-
          MacKinnon and Dworkin do not rely on offence or Feinberg's tests; their claim is harm and the infringement of
          equality.
      - text: It moves the argument to paternalism, protecting consumers from themselves
        why: Their concern is harm to women, not protecting consumers from self-inflicted harm.
  - key: h14
    type: mcq
    concept: pornography-and-euthanasia
    difficulty: 2
    contrasts-with:
      - mills-harm-principle
    stem: Why does Devlin cite the prohibition of voluntary euthanasia?
    options:
      - text: To show that the harm principle explains the existing criminal law
        why: >-
          Tempting because the law prohibits it, but Devlin's point is that the law punishes it without harm, against
          Mill.
      - text: To show that some offence is universal and unavoidable
        why: Devlin's point is not about Feinberg's offence principle; he relies on a fundamental moral principle.
      - text: To show that the law protects people who lack mature faculties
        why: >-
          Voluntary euthanasia is requested by an adult of sound mind, so it is not about people lacking mature
          faculties.
      - text: To show that the law enforces a moral principle, the sanctity of life
        correct: true
        why: >-
          Right: Devlin says voluntary euthanasia is prohibited because it "threatens the sanctity of human life", a
          fundamental moral principle.
  - key: h15
    type: mcq
    concept: pornography-and-euthanasia
    difficulty: 3
    stem: Why, according to the lecture, does the case study focus on adult pornography?
    options:
      - text: Because cases involving children are easily handled by the harm principle; adult cases are the hard ones
        correct: true
        why: >-
          Right: the lecture says it is much easier to run arguments based on the harm principle (and almost every other
          principle) for child pornography, so adult pornography is the real test.
      - text: Because the law in every state already prohibits adult pornography
        why: >-
          Tempting as an assumption, but neither the slides nor the lecture say this; the point concerns which case
          tests the principles.
      - text: Because MacKinnon and Dworkin discussed only adult pornography
        why: >-
          The lecture does not give that as the reason; it explains the focus by how easily the principles settle cases
          involving children.
      - text: Because adult pornography is the only case where offence is relevant
        why: >-
          Offence is one possible argument, but the lecture's reason for the focus concerns harm and the difficulty of
          the adult case.
  - key: h16
    type: mcq
    concept: pornography-and-euthanasia
    difficulty: 3
    variant-of: h11
    stem: >-
      A competent adult asks a friend to help her die by a positive act. On the slides' claim, how does her position
      differ from refusing treatment?
    options:
      - text: 'It does not differ: both are voluntary, so both are permitted'
        why: >-
          Tempting because both are voluntary, but the slides' claim treats the passive and the active cases
          differently.
      - text: It differs because she is no longer of sound mind once she asks to die
        why: >-
          Nothing in the facts suggests incapacity; the slides' claim applies to adults "in full command of their mental
          capacities".
      - text: She may refuse treatment, but on the claim she cannot ask to be actively killed
        correct: true
        why: >-
          Right: the slide says such adults "have the right to refuse life-sustaining treatment, but cannot ask to be
          actively killed".
      - text: It differs because helping her would be non-voluntary euthanasia
        why: She requests it as a competent adult, so it is voluntary; the difference is that it would be active.
  - key: h17
    type: truefalse
    concept: pornography-and-euthanasia
    difficulty: 1
    set: quickfire
    statement: On the slides, passive euthanasia involves intentionally letting someone die.
    answer: true
    why: >-
      True: the slide says "passive euthanasia involves intentionally letting someone die", while active euthanasia
      involves a positive act of killing.
  - key: h18
    type: truefalse
    concept: pornography-and-euthanasia
    difficulty: 1
    set: quickfire
    statement: MacKinnon and Dworkin defend banning pornography because it is an immoral but harmless action.
    answer: false
    why: >-
      False: they say the issue is not preventing an allegedly immoral yet harmless action; pornography harms women and
      infringes their right to equality.
  - key: h19
    type: truefalse
    concept: pornography-and-euthanasia
    difficulty: 1
    set: quickfire
    statement: Non-voluntary euthanasia is carried out at the request of an adult person of sound mind.
    answer: false
    why: >-
      False: that is voluntary euthanasia. Non-voluntary euthanasia is performed on someone not capable of understanding
      the choice between life and death.
  - key: h20
    type: short
    concept: pornography-and-euthanasia
    difficulty: 3
    prompt: >-
      "Adults of sound mind may refuse life-sustaining treatment, so the law should also let them ask to be actively
      killed." Discuss using the week's principles.
    model: >-
      The analogy is strong under the harm principle, but whether the law should follow depends on which justifying
      principle one accepts. The slides distinguish voluntary euthanasia (at the request of an adult of sound mind) from
      non-voluntary, and passive (intentionally letting someone die) from active (a positive act of killing). The
      current position allows refusal of life-sustaining treatment but not a request to be actively killed. On Mill's
      harm principle, voluntary active euthanasia harms only the actor, with consent, so coercion is unjustified: over
      their own body the individual is sovereign. Legal paternalism, weighing the seriousness and probability of the
      harm and the necessity of the risk, may resist, since death is the most serious harm. Devlin defends the
      prohibition as protecting the sanctity of human life, a moral principle, without harm to others. The slides ask
      whether the choice is harmful, or violates the rights of others. The strongest counterargument is that the
      passive/active line may track a moral difference. On balance a liberal should accept the statement for voluntary
      cases, leaving non-voluntary cases, where autonomy is absent, to separate argument.
    rubric:
      - id: r1
        criterion: Thesis — takes a clear position on extending the right to refuse to active euthanasia.
        marks: 2
        top-band: States a qualified thesis tied to a principle, and limits it to voluntary cases.
        margin-note: Position and scope both clear.
        authorities: []
      - id: r2
        criterion: Argument — uses the four definitions and the harm principle accurately.
        marks: 3
        top-band: >-
          Defines voluntary/non-voluntary and passive/active from the slides and applies Mill's harm principle with
          consent.
        margin-note: Definitions well applied.
        authorities: []
      - id: r3
        criterion: Counterargument — runs paternalism and Devlin's sanctity of life argument.
        marks: 3
        top-band: Applies the paternalist factors (seriousness, probability, necessity) and Devlin's use of the euthanasia ban.
        margin-note: Good range of principles.
        authorities: []
      - id: r4
        criterion: Evaluation — weighs whether the passive/active line tracks a moral difference and concludes.
        marks: 2
        top-band: Engages with the slides' questions about harm and the rights of others, then concludes clearly.
        margin-note: Clear conclusion.
        authorities: []
