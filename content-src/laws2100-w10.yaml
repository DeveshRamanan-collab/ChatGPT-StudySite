    body: >-
      The use of public force limits individual freedom, so in a liberal democracy it needs a justification. Five ideas
      are commonly used:


      1. **Prevention of harm to others** – the harm principle (John Stuart Mill).

      2. **Prevention of offence** – the offence principle (Joel Feinberg).

      3. **Prevention of harm to self** – legal paternalism.

      4. **Prevention of immoral conduct**, even when there is no harm or offence – legal moralism.

      5. **General welfare/public interest** – the welfare principle (eg compulsory taxation for public projects that
      some citizens may not benefit from).


      Two reminders run through the week:


      - The distinction between **popular** morality (what a society conventionally regards as right) and **critical**
      morality (what is objectively right).

      - From a liberal point of view, the prevention of immorality in the absence of harm is not a legitimate reason to
      limit our freedom.


      The lecture adds a useful contrast: the harm and offence principles are negative in nature, setting limits on
      public force; paternalism and moralism look at positive action the state might take to help people live a good
      life. Practical limits on enforcement are facts about the world; the week's question is the **moral** limits of
      positive law.


      Exam use: before arguing about any prohibition, name which of the five principles is doing the justifying work.
