      - text: Would society's fabric be jeopardised if the practice were not criminalised?
        why: This tests Devlin's social cohesion claim, not the parliament's failure to weigh the effects of imprisonment.
      - text: Are the misery and evil consequences of punishment understood?
        correct: true
        why: >-
          Right: Hart asks whether "the misery and evil consequences of criminal punishment" are well understood; here
