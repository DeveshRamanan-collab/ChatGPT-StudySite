      Hart answered Devlin in 'Immorality and Treason' (1959) and *Law, Liberty and Morality* (1963); Devlin replied in
      *The Enforcement of Morals* (1965).


      Hart starts not with the harm principle but with Devlin's idea of morality: "The most remarkable feature of Sir
      Patrick's lecture is his view of the nature of morality – the morality which the criminal law may enforce". Moral
