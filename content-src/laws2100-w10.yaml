    options:
      - text: 'Rational criticism: general morality may rest on misunderstanding and a false sense of danger'
        correct: true
        why: >-
          Right: Hart asks whether general morality rests on "ignorance, superstition, or misunderstanding" and whether
          there is "a false conception of the immoral practice as dangerous".
      - text: 'The treason analogy: society may defend itself against any threat to its existence'
        why: >-
          Tempting because the citizens perceive a threat, but the treason analogy is Devlin's argument, which Hart
          criticises.
      - text: 'Devlin''s third question: whether enforcing it would be practical in all cases'
        why: Practicality is Devlin's question (3); it does not test whether the moral belief behind the ban is mistaken.
      - text: 'The offence principle: almost anyone would be offended, so it may be banned'
        why: >-
          The facts concern a false belief about disease, not universal unavoidable offence, and Hart's reply is about
          rational assessment.
  - key: f14
    type: mcq
    concept: harts-reply-to-devlin
    difficulty: 3
    contrasts-with:
      - devlins-legal-moralism
    stem: >-
      Which statement best captures the difference between Devlin and Hart on how to identify the morality the law may
      enforce?
    options:
      - text: Devlin relies on objective morality; Hart relies on the majority's feelings
        why: >-
          This reverses them: Devlin relies on popular feelings, and Hart insists that such feelings be rationally
          assessed.
      - text: Both rely on the feelings of the man in the jury box, but draw different conclusions
        why: >-
          Hart does not accept the jury box test; he challenges whether morality is a compound of intolerance,
          indignation and disgust.
      - text: Devlin relies on common sense and feelings; Hart says the claim must be rationally assessable
        correct: true
        why: >-
          Right: Devlin's reasonable man judges by feelings, while Hart says it "must be possible to rationally assess"
          the claim that immoral behaviour be punished.
      - text: Devlin relies on parliament; Hart relies on the courts
        why: >-
          Neither thinker's test is institutional in this way; the disagreement concerns feelings against rational
          assessment.
  - key: f15
    type: mcq
    concept: harts-reply-to-devlin
    difficulty: 2
    stem: >-
      What is Hart asking when he asks whether "the misery and evil consequences of criminal punishment" are well
      understood?
    options:
      - text: Whether punishment deters the immoral conduct effectively
        why: >-
          Tempting as a consequentialist question, but Hart's point is the cost of punishment for those punished, not
          its deterrent effect.
      - text: Whether the costs of punishing people for the conduct have been weighed
        correct: true
        why: >-
          Right: the lecture explains this as asking whether those who would criminalise really appreciate the effect of
          the laws on the people affected.
      - text: Whether the conduct is offensive to almost anyone at random
        why: This is Feinberg's universality test; Hart's question is about the consequences of criminal punishment.
      - text: Whether the punishment reflects critical rather than popular morality
        why: Hart's third question concerns the harms of punishment itself, not which morality the punishment reflects.
  - key: f16
    type: mcq
    concept: harts-reply-to-devlin
    difficulty: 3
    variant-of: f15
    stem: >-
      A parliament criminalises a harmless private practice without considering what imprisonment will do to those
