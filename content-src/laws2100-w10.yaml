      - text: Criminalising vice even where no one is harmed
        why: Tempting as a way of promoting virtue, but criminalising vice is exactly the coercive means Raz rules out.
      - text: Prohibiting people from consenting to their own disablement
        why: >-
          This is the slides' example of soft paternalism, enforced by law, not of Raz's non-coercive promotion of
          virtue.
      - text: Remaining neutral and leaving all choices about value to individuals
        why: Neutrality is Rawls's view; Raz wants the state actively to promote worthy ways of life.
  - key: g11
    type: mcq
    concept: rawls-and-raz
    difficulty: 3
    stem: Why, on the lecture's account, is Raz's perfectionism "liberal"?
    options:
      - text: Because it treats the state as neutral between all conceptions of the good
        why: Tempting because liberalism is often linked with neutrality, but that is Rawls; Raz rejects neutrality.
      - text: Because it enforces only those moral views that are held by a liberal majority
        why: Raz does not appeal to majority views as the standard of worth; that resembles Devlin's popular moralism.
      - text: Because valuing individual freedom limits the state to non-coercive means
        correct: true
        why: >-
          Right: the lecture says appreciating liberal values and individual freedom means the state "should only use
