    body: >-
      In *On Liberty* (1859) Mill explores the struggle between authority and liberty: "the only purpose for which power
      can be rightfully exercised over any member of a civilised community, against his will, is to prevent harm to
      others." Our own good, physical or moral, is not enough. Over their own body and mind, the individual is
      sovereign; the doctrine applies only to human beings "in the maturity of their faculties".


      **Harm** is narrow: not merely affecting another's interests, but infringing interests we are under a duty not to
      infringe (a specific duty to the public, or perceptible hurt to a specific individual). Recall the link between
      interests, entitlements and rights.


      So the state may stop A assaulting B or stealing B's property, but exceeds its limits if it stops A destroying her
      own property or protects someone from being offended. Conduct that harms only the actor, or others with their
      consent, should be free, however "foolish, perverse, or wrong".


      **Justification:** personal autonomy and the presumptive case for liberty (freedom is of intrinsic value). Mill
      adds a utilitarian argument: maximum happiness in the long run, because experiments in living benefit society and
      exercising freedom is "one of the principal ingredients of human happiness".


      **Problems:** harm is conceived too narrowly; no one's affairs affect only themselves; it ignores indirect harms
      and offence that could become harm.


      Exam use: state the principle, then test whether the conduct harms others in Mill's narrow sense.
