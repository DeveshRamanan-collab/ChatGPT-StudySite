      - text: Protect people from self-inflicted harm whatever their wishes
        why: >-
          Protecting people from self-inflicted harm is legal paternalism as defined on the slides, not Raz's
          formulation.
  - key: g08
    type: mcq
    concept: rawls-and-raz
    difficulty: 1
    stem: How do the slides label Raz's position?
    options:
      - text: Liberal neutrality, as defended by Rawls
        why: Tempting because Raz is a liberal, but neutrality is Rawls's view; Raz rejects it.
      - text: Liberal perfectionism
        correct: true
        why: 'Right: the slide says "Raz is liberal perfectionist", heading the slide "Raz''s liberal perfectionism".'
      - text: Critical legal moralism, in the tradition of Robert George
        why: 'Critical legal moralism is George''s view: it uses the criminal law against vice, which Raz will not do.'
      - text: Hard paternalism, as applied to drug laws
        why: >-
          Hard paternalism is state intervention for the person's own good by coercion; Raz excludes criminal law for
          perfectionist ends.
  - key: g09
    type: mcq
    concept: rawls-and-raz
    difficulty: 2
    stem: What does Raz say about using the criminal law to promote worthy ways of life?
    options:
      - text: That it is the main tool the state should use to pursue perfectionist ideals
        why: >-
          Tempting because Raz wants the state to promote the good, but the slides say he rejects the criminal law for
