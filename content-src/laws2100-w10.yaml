      - text: Devlin, because the state is enforcing popular morality by law
        why: >-
          Devlin would use the weapon of the criminal law against immorality; here the state deliberately avoids
          criminal law.
      - text: Mill, because no harm to others is involved, so taxing it is fine
        why: >-
          Mill's principle limits compulsion and control to preventing harm to others; it does not license discouraging
          unworthy choices.
  - key: g13
    type: mcq
    concept: rawls-and-raz
    difficulty: 3
    variant-of: g05
    stem: >-
      A state refuses to say which ways of life are better and intervenes only to stop and punish rights violations.
