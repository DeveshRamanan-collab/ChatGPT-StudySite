  - key: f20
    type: short
    concept: harts-reply-to-devlin
    difficulty: 3
    prompt: '"Hart''s reply to Devlin is nothing more than Mill''s harm principle restated." Discuss.'
    model: >-
      The claim is false: Hart ends near Mill, but his most effective arguments do not depend on the harm principle at
      all. Devlin argued that society may enforce popular morality, identified through the jury box's intolerance,
      indignation and disgust, because without shared morality society would break down, just as it may legislate
      against treason. Hart does ask, in Mill's spirit, whether behaviour that offends moral feelings is harmful
      independently of its effect on the moral code. But his first move, in 'Immorality and Treason', is to attack
      Devlin's view of the nature of morality: is it really a compound of feelings? His second question tests Devlin's
      own premise: would failing to criminalise jeopardise the whole fabric of society? Morality is not a seamless web,
      so the treason analogy fails. His deeper criticism demands rational assessment by reason, sympathetic
      understanding and critical intelligence: is general morality based on ignorance or superstition, and are the
      miseries of punishment understood? A moralist could accept these tests without accepting Mill. So Hart is liberal
      in conclusion, but his reply works from inside Devlin's framework.
    rubric:
      - id: r1
        criterion: Thesis — takes a clear position on whether Hart's reply reduces to the harm principle.
        marks: 2
        top-band: States that Hart's conclusion is liberal but his strongest arguments are internal critiques of Devlin.
        margin-note: Restatement, or more?
        authorities: []
      - id: r2
        criterion: Argument — sets out Hart's attack on Devlin's idea of morality and the seamless web.
        marks: 3
        top-band: Quotes the "most remarkable feature" line, the compound of feelings, the seamless web and the treason analogy.
        margin-note: Good use of the text.
        authorities: []
      - id: r3
        criterion: Counterargument — concedes the Millian elements in Hart.
        marks: 2
        top-band: Shows the harm question and Hart's liberal sympathies as support for the claim.
        margin-note: Fair concession.
        authorities: []
      - id: r4
        criterion: Evaluation — uses the deeper criticism to show independence from Mill and concludes.
        marks: 3
        top-band: Explains the three rational-criticism questions and why a moralist could accept them, then concludes.
        margin-note: Sharp conclusion.
        authorities: []
  - key: g01
    type: mcq
    concept: rawls-and-raz
    difficulty: 1
    stem: Which distinction does John Rawls draw, according to the slides?
    options:
      - text: Between popular morality and critical morality
        why: >-
          Tempting because it runs through the week, but that distinction separates Devlin from George; Rawls's
          distinction is different.
      - text: Between soft paternalism and hard paternalism
        why: >-
          Soft and hard paternalism are kinds of intervention for a person's own good, not Rawls's distinction on the
          slide.
      - text: Between harm to others and offence to others
        why: Harm and offence separate Mill's principle from Feinberg's; Rawls's distinction concerns justice and value.
      - text: Between the right and the good
        correct: true
        why: 'Right: the slide says Rawls "makes a distinction between the ''right'' and the ''good''".'
  - key: g02
    type: mcq
    concept: rawls-and-raz
    difficulty: 1
    stem: For Rawls, what does "the right" refer to?
    options:
      - text: The sphere of principles of justice, including the protection of rights
        correct: true
        why: >-
          Right: the slide says "the right refers to the sphere of principles of justice, including the protection of
          rights".
      - text: The sphere of value, including views about the good life
        why: Tempting because the two terms pair up, but the sphere of value is what Rawls calls "the good".
      - text: Whatever the majority conventionally regards as morally right
        why: >-
          That is popular morality as Devlin uses it; Rawls's "right" concerns principles of justice, not majority
          opinion.
      - text: Conduct that the criminal law currently permits in a given legal system
        why: Rawls's "right" is a normative sphere of justice and rights, not a description of what positive law allows.
  - key: g03
    type: mcq
    concept: rawls-and-raz
    difficulty: 1
    stem: For Rawls, what does "the good" refer to?
    options:
      - text: The sphere of principles of justice
        why: Tempting because the two are paired, but principles of justice belong to "the right" on the slide.
      - text: The general welfare that justifies compulsory taxation
        why: The general welfare is the welfare principle from Part A; Rawls's "good" is a broader sphere of value.
      - text: The sphere of value
        correct: true
        why: 'Right: the slide says "the good refers to the sphere of value".'
      - text: Objective morality that the law should enforce against vice
        why: Enforcing objective morality against vice is George's critical moralism, which Rawls's neutrality rejects.
  - key: g04
    type: mcq
    concept: rawls-and-raz
    difficulty: 1
    stem: What is Rawls's view of the state's role on matters of the good life?
    options:
      - text: It should promote intrinsically worthy ways of life by non-coercive means
        why: >-
          Tempting because it is a liberal view, but it is Raz's liberal perfectionism, which rejects Rawls's
          neutrality.
      - text: It should be "neutral" on all matters of the good life
        correct: true
        why: 'Right: the slide says "Rawls thinks that the state should be ''neutral'' on all matters of the good life".'
      - text: It should enforce the moral views the majority holds about the good life
        why: Enforcing majority moral views is Devlin's popular legal moralism, the opposite of neutrality.
      - text: It should guide people toward their own good, whether they like it or not
        why: Guiding people toward their own good is legal paternalism; neutrality excludes it.
  - key: g05
    type: mcq
    concept: rawls-and-raz
    difficulty: 2
    stem: For Rawls, what is the only justification for state interference?
    options:
      - text: To prevent offence that almost anyone would feel and could not avoid
        why: >-
          Tempting because it is a liberal principle, but it is Feinberg's offence principle, not Rawls's position on
          the slide.
      - text: To protect people from serious and probable harm to themselves
        why: This is legal paternalism, which a neutral state would not adopt; Rawls looks to rights violations.
      - text: To promote worthy ways of life and discourage unworthy ones
        why: Promoting worthy ways of life is Raz's perfectionism, which rejects Rawls's neutrality.
      - text: To prevent rights violations and punish those who violate others' rights
        correct: true
        why: >-
          Right: "for Rawls, the only justification for state interference is to prevent rights violations and to punish
          those who do violate the rights of others".
  - key: g06
    type: mcq
    concept: rawls-and-raz
    difficulty: 1
    stem: Which idea of Rawls's does Raz reject?
    options:
      - text: State neutrality
        correct: true
        why: 'Right: the slide says "Raz rejects Rawls''s idea of state neutrality".'
      - text: The protection of rights as a principle of justice
        why: >-
          Tempting because Raz departs from Rawls, but the slides say he rejects neutrality, not the protection of
          rights.
      - text: The idea that criminal law should not promote the good life
        why: >-
          Raz agrees that the state should not use the criminal law to pursue perfectionist ideals; this is a point of
          agreement, not rejection.
      - text: The value of individual freedom in a liberal democracy
        why: 'Raz is a liberal perfectionist: individual freedom is why he limits the state to non-coercive means.'
  - key: g07
    type: mcq
    concept: rawls-and-raz
    difficulty: 2
    stem: According to Raz, what is the state entitled (and should) do?
    options:
      - text: Remain neutral between all ways of life and act only when rights are violated
        why: Tempting because it is the other liberal view, but this is Rawls's position, which Raz rejects.
      - text: Criminalise vice whenever the majority regards it as degrading
        why: >-
          Criminalising vice on majority judgment is Devlin's view; Raz rejects using the criminal law for perfectionist
          ends.
      - text: Promote intrinsically worthy ways of life and discourage unworthy ones
        correct: true
        why: >-
          Right: "according to Raz, the state is entitled to (and should) promote intrinsically worthy ways of life and
