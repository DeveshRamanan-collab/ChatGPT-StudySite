      - text: Because Devlin had conceded that immoral conduct is always harmful
        why: 'Devlin claims the opposite: that the law may punish immoral conduct even if it causes no harm or offence.'
      - text: Because general jurisprudence forbids normative arguments about crime
        why: >-
          The lecture says the reverse: in this debate Hart makes normative arguments as a lawyer and public
          intellectual.
  - key: f10
    type: mcq
    concept: harts-reply-to-devlin
    difficulty: 3
