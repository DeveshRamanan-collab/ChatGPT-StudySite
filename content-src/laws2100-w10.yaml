          has another title.
      - text: The Enforcement of Morals
        why: This is Devlin's 1965 book defending his legal moralism, not Hart's.
      - text: Immorality and Treason
        why: This is Hart's 1959 reply to Devlin's lecture, published before the 1963 book.
      - text: Law, Liberty and Morality
        correct: true
        why: 'Right: the slides list H.L.A. Hart, Law, Liberty and Morality (1963).'
  - key: f13
    type: mcq
    concept: harts-reply-to-devlin
    difficulty: 3
    stem: >-
      Most citizens want a harmless practice banned because they wrongly believe it spreads disease. Which part of
