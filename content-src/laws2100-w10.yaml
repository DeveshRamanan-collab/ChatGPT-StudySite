      punished, with reason, sympathetic understanding and critical intelligence. Is general morality based on
      ignorance, superstition or misunderstanding? Is the practice falsely thought dangerous to society? Are the misery
      and evil consequences of punishment understood?


      Exam use: pair Devlin's three questions with Hart's two.
