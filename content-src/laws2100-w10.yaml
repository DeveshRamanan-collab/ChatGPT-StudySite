      - text: Because it accepts the harm principle as the only ground for any state action
        why: 'Raz goes beyond the harm principle: he lets the state promote worthy ways of life, by non-coercive means.'
  - key: g12
    type: mcq
    concept: rawls-and-raz
    difficulty: 3
    stem: >-
      A government decides a pastime is unworthy. It does not ban it but imposes a special tax on it. Which theorist's
      position does this best fit?
    options:
      - text: Rawls, because the state stays neutral by not banning the pastime
        why: Tempting because there is no ban, but a neutral state would not judge the pastime unworthy in the first place.
      - text: Raz, because the state discourages an unworthy way of life without criminal law
        correct: true
        why: >-
          Right: Raz lets the state discourage unworthy ways of life by non-coercive means, such as taxing activities
