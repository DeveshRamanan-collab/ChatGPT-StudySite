  - key: g10
    type: mcq
    concept: rawls-and-raz
    difficulty: 2
    stem: Which example do the slides give of Raz's non-coercive means of promoting virtue?
    options:
      - text: Taxing activities of which the majority disapproves
        correct: true
        why: >-
          Right: the slide says Raz has no problem with "the state promoting virtue with non-coercive means (for
