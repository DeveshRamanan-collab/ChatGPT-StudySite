      - text: That paternalism is always justified wherever it appears in a legal system
        why: >-
          The slide is descriptive: states do employ it. Whether particular laws are justified is what the five
          considerations test.
      - text: That every state has abolished hard paternalism
        why: The slides say some drug laws may be hard paternalism, so hard paternalism has not been abolished.
      - text: That even liberal states restrict some self-regarding choices
        correct: true
        why: >-
          Right: the slides give prohibitions on consenting to disablement or violent killing, and on selling oneself
          into slavery, as examples found in all states.
  - key: d12
    type: mcq
    concept: legal-paternalism
    difficulty: 3
    stem: According to the lecture, which later position in the week takes up the questions raised by paternalist reasoning?
    options:
      - text: Devlin's popular legal moralism
        why: >-
          Tempting because Devlin also restricts harmless conduct, but he relies on popular morality, not on weighing
          the individual's good.
      - text: Raz's liberal perfectionism
        correct: true
        why: >-
          Right: the lecture says the paternalist considerations "are relevant to understand other positions, for
          example … Joseph Raz's … liberal perfectionism".
      - text: Rawls's state neutrality
        why: >-
          Rawls says the state should be neutral on the good life, which rejects the premise of paternalism rather than
          developing it.
      - text: Feinberg's offence principle
        why: Feinberg's principle rejects paternalism; it protects others from offence, not individuals from themselves.
  - key: d13
    type: mcq
    concept: legal-paternalism
    difficulty: 2
    stem: Which phrase from the slides captures the second limb of legal paternalism?
    options:
      - text: '"To prevent harm to others"'
        why: >-
          Tempting because it is the most quoted phrase of the week, but it is Mill's harm principle, which rejects
          paternalism.
      - text: '"Properly the state''s business"'
        why: This comes from Feinberg's statement of the offence principle, describing the prevention of offensive conduct.
      - text: '"To guide people, whether they like it or not, toward their own good"'
        correct: true
        why: >-
          Right: the slide says paternalism justifies coercion to protect from self-inflicted harm, "or to guide people,
          whether they like it or not, toward their own good".
      - text: '"Foolish, perverse, or wrong"'
        why: Mill uses this phrase for conduct we should be free to engage in; it argues against paternalism.
  - key: d14
    type: mcq
    concept: legal-paternalism
    difficulty: 3
    variant-of: d08
    stem: >-
      A person takes a serious risk to reach a goal, but an equally effective and much safer route to the same goal is
      freely available. Which consideration most strengthens the paternalist case?
    options:
      - text: The value of the goal
        why: >-
          Tempting, but a valuable goal weakens the case for interfering; here the goal can be reached anyway, by a
          safer route.
      - text: The probability that the goal will result
        why: >-
          The facts say both routes are equally effective, so this consideration does not separate them or favour
          intervention.
      - text: The universality of the offence caused
        why: Universality is a test for the offence principle; it has no role in the paternalist rationale.
      - text: The necessity of the risk
        correct: true
        why: >-
          Right: the fifth consideration asks "is there a less risky way of achieving that goal?"; here there is, so the
          risk is unnecessary.
  - key: d15
    type: mcq
    concept: legal-paternalism
    difficulty: 3
    contrasts-with:
      - liberty-limiting-principles
    stem: >-
      The slides ask whether the welfare principle is "an example of legal paternalism". Which observation best shows
      why the question is open?
    options:
      - text: >-
          Compulsory taxation forces people to support projects for the public good, but not to protect them from
          self-harm
        correct: true
        why: >-
          Right: welfare measures coerce people for a good, as paternalism does, but the good is the public interest
          rather than the person's own safety, so the fit is debatable.
      - text: Compulsory taxation is clearly hard paternalism because it overrides choice
        why: >-
          Tempting, but hard paternalism is intervention for the person's own good; funding public projects others may
          benefit from does not obviously fit.
      - text: The welfare principle is a version of the offence principle
        why: >-
          The welfare principle has nothing to do with offence; it justifies intervention for the general welfare or
          public interest.
      - text: The welfare principle depends on popular morality
        why: >-
          The slides do not tie the welfare principle to popular morality; they link it instead to paternalism and
          social justice.
  - key: d16
    type: mcq
    concept: legal-paternalism
    difficulty: 2
    variant-of: d02
    stem: >-
      A law prohibits people from consenting to be seriously disabled by another. Which principle do the slides use to
      classify such a law?
    options:
      - text: The harm principle, because disablement is harm
        why: >-
          Tempting because disablement is plainly a harm, but with consent the harm principle does not apply; the slides
          classify this as paternalism.
      - text: Soft legal paternalism
        correct: true
        why: >-
          Right: the slides list "prohibiting people from consenting to their own disablement" among the elements of
          (soft) paternalism all states employ.
      - text: Legal moralism in George's version
        why: >-
          George would enforce objective morality, but the slides give this example under paternalism, protecting the
          person's own good.
      - text: The offence principle, because disablement shocks others
        why: >-
          The offence principle needs universal, unavoidable offence to others; the slides treat this law as protecting
          the person consenting.
  - key: d17
    type: truefalse
    concept: legal-paternalism
    difficulty: 1
    set: quickfire
    statement: The slides say some drug laws may be classified as either soft or hard examples of state paternalism.
    answer: true
    why: 'True: slide 14 says "some drug laws may be classified as either soft, or hard examples of state paternalism".'
  - key: d18
    type: truefalse
    concept: legal-paternalism
    difficulty: 1
    set: quickfire
    statement: Both the harm principle and the offence principle accept legal paternalism.
    answer: false
    why: >-
      False: the lecture says what we find in both the harm and the offence principles is a rejection of paternalism;
