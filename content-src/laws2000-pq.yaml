      - id: r6
        criterion: Answers the head-of-state, superior-orders and domestic-law arguments
        marks: 2
        top-band: Applies Nuremberg Principles II, III and IV in turn and explains, with Arrest Warrant, that immunity is procedural and does not bar international criminal courts.
        margin-note: Three pleas, three principles.
