        criterion: |
          Analyses the SRSO's international legal personality
        marks: 2
        top-band: |
          Applies ARIO art 2(a) and Reparation to imply personality from the SRSO's functions, organs and the Headquarters Agreement.
        margin-note: |
          Go to the constitutive instrument first, then imply.
        authorities:
          - ario-2011-art-2-a
      - id: r2
        criterion: |
          Applies speciality and implied powers to the Special Tribunal
        marks: 2
        top-band: |
          Contrasts Nuclear Weapons speciality with Reparation implied powers, and refers to the ICTY/ICTR controversy.
        margin-note: |
          Argue both sides, then land.
        authorities: []
      - id: r3
        criterion: |
          Identifies art 7, not art 6, as the governing attribution rule
        marks: 1
        top-band: |
          Explains that a state organ placed at an IO's disposal is governed by the effective-control test.
        margin-note: |
          Right rule, first time.
        authorities:
          - ario-2011-art-6
          - ario-2011-art-7
      - id: r4
        criterion: |
          Applies effective control to the withdrawal at Merrin
        marks: 2.5
        top-band: |
          Uses the retained command, advance approvals and direct ministry instructions to attribute the conduct to Brenmark.
        margin-note: |
          Every fact points one way — say so.
        authorities:
          - ario-2011-arts-3-4
      - id: r5
        criterion: |
          Analyses the SRSO's immunity from suit
        marks: 2
        top-band: |
          Applies the treaty-based immunity, Mothers of Srebrenica and the point about alternative modes of settlement.
        margin-note: |
          Immunity is procedural — it decides the forum, not the wrong.
        authorities:
          - cpiun-art-ii-ss-2-4
      - id: r6
        criterion: |
          Explains that the claim against Brenmark can proceed
        marks: 1.5
        top-band: |
          Notes a state has no immunity in its own courts and that attribution to Brenmark makes this the stronger claim.
        margin-note: |
