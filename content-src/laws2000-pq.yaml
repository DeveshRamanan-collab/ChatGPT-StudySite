        marks: 1
        top-band: Cites art 2(4) as treaty and custom (Nicaragua, para 34) and sets out the three conditions of self-defence before applying any of them.
        margin-note: Framework first, then facts.
        authorities:
          - un-charter-art-2-4
          - un-charter-art-51
      - id: r2
        criterion: Tests the sinking of the Tamsin against the armed attack threshold
        marks: 2
        top-band: Attributes the attack to Velmora through its navy, applies scale and effects to the 31 deaths, and uses Oil Platforms on attacks against military vessels.
        margin-note: Name the gravity test before you apply it.
