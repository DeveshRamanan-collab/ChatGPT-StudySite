    prompt: |-
      Halvia and Mesken are neighbouring states, both UN members and both parties to the ICCPR. Both have made declarations under art 36(2) of the ICJ Statute accepting the Court's jurisdiction over legal disputes with any state accepting the same obligation.

      Eighteen months ago, after a border war, Halvian forces occupied the Drava Valley, part of Mesken's territory. (The lawfulness of the original use of force is not in issue.) Halvia administers the valley through a military governor. Since then:

      (a) Halvian soldiers have detained about 300 Meskeni civilians at Camp Orl, in the valley, without charge or access to lawyers; former detainees describe beatings during interrogation;
      (b) the Valley Guard, a local militia armed and paid by Halvia but commanded by its own leaders, has burned the homes of Meskeni families who refuse to leave the valley, while Halvian patrols watched without intervening; and
      (c) Halvia has built a fortified fence through the valley, cutting 4,000 Meskeni farmers off from their fields and from the valley's only hospital. Halvia has not proclaimed any emergency or derogation.

      Two former detainees brought individual complaints to the Human Rights Committee, whose competence Halvia has accepted. The Committee adopted views finding that Halvia had violated ICCPR arts 7, 9 and 10. Halvia rejected the views as "not binding". It also says that the ICCPR does not apply outside Halvia's territory, that it is not responsible for what the Valley Guard does, and that the fence is a temporary security measure made necessary by cross-border raids.

      Mesken, which has protested each of these matters in diplomatic notes, has filed an application against Halvia in the ICJ alleging breaches of the ICCPR. It asks the Court (i) to indicate provisional measures ordering the release of the Camp Orl detainees and the opening of gates in the fence for access to the hospital, and (ii) at the merits stage, to order the dismantling of the fence and compensation.

      Advise Mesken on: (a) the Court's jurisdiction and the request for provisional measures; (b) whether Halvia's conduct in the valley breaches the ICCPR and engages its responsibility; (c) the weight of the Committee's views; and (d) the remedies Mesken can obtain.
    model: |-
      **Issue**

      The issues are: (a) whether the ICJ has jurisdiction and will indicate the provisional measures sought; (b) whether the ICCPR applies in the occupied valley, and whether Halvia is responsible for the detentions, the militia's burnings and the fence; (c) the weight of the Human Rights Committee's views; and (d) the remedies available.

      **Rule**

      The ICJ's jurisdiction rests on consent, which both states have given by optional clause declarations, and a dispute must exist when proceedings begin. Under art 41 of its Statute the Court may indicate provisional measures where it has prima facie jurisdiction, the rights claimed are plausible, the measures are linked to them, and there is a real and imminent risk of irreparable harm; such measures bind (*LaGrand*).

      States must respect the rights of people within their territory and subject to their jurisdiction, irrespective of nationality (ICCPR art 2(1)). Jurisdiction may be exercised outside a state's territory, and the drafters "did not intend to allow States to escape from their obligations when they exercise jurisdiction outside their national territory" (*Wall*, para 109). In *Armed Activities* Uganda, as occupying Power in Ituri, was responsible both for its military's acts and "for any lack of vigilance in preventing violations" by other actors in the occupied territory, "including rebel groups acting on their own account" (para 179); human rights instruments apply to acts done in the exercise of jurisdiction abroad, particularly in occupied territories (para 216). Positive obligations require protection against private persons as well as state agents (General Comment 31, para 8).

      Conduct of state organs is attributable to the state (art 4 ARSIWA); a group's conduct is attributable only on the state's instructions or under its effective control (art 8; *Nicaragua*; *Genocide*, 2007), or if it acts in "complete dependence" on the state. A breach may be an act or an omission (art 2). Necessity precludes wrongfulness only where the act is the only way to safeguard an essential interest against a grave and imminent peril (art 25). A responsible state must cease a continuing wrong and offer assurances of non-repetition (art 30), and make full reparation (art 31) by restitution, compensation or satisfaction. Treaty body views are not binding, but the ICJ gives the Committee's interpretation "great weight" (*Diallo*, para 66).

      **Application**

      *(a) Jurisdiction and provisional measures.* Both states have accepted the Court's jurisdiction under art 36(2) for legal disputes with states accepting the same obligation, so prima facie jurisdiction exists. A dispute existed when Mesken filed: Mesken protested each matter in diplomatic notes, and Halvia's denial that the ICCPR applies, or that it is responsible, shows positively opposed views of which it was aware. The rights claimed are plausible — arts 7, 9 and 10 for the detainees, and freedom of movement (art 12) and life (art 6) for those cut off from the only hospital — and each measure is linked to them. There is urgency: detainees held without lawyers and beaten in interrogation, and civilians without access to a hospital, face a real and imminent risk of irreparable harm. The Court is likely to indicate measures of this kind, and they will bind Halvia (*LaGrand*).

      *(b) Does the Covenant apply in the valley?* Yes. Halvia occupies and administers the valley through a military governor, so the people there are subject to its jurisdiction, though they are outside its territory and are not its nationals (art 2(1)). *Wall* (para 109) and *Armed Activities* (para 216) apply the Covenant to acts done in the exercise of jurisdiction abroad, particularly in occupied territory. Halvia's first argument fails.

      *Camp Orl.* The soldiers are state organs, so the detentions and beatings are attributable to Halvia (art 4). Detention without charge or access to lawyers breaches arts 9 and 10, and beatings in interrogation engage art 7, which can never be derogated from. Halvia has proclaimed no emergency, so it cannot rely on art 4 for any of these measures.

      *The Valley Guard.* Halvia arms and pays the militia, but its own leaders command it, so it is neither a de facto organ acting in complete dependence on Halvia nor under Halvia's effective control in the burnings; financing and arming are not enough (*Nicaragua*; art 8). The burnings are not attributable to Halvia as such. But that does not end Halvia's responsibility. As occupying Power it is responsible for any lack of vigilance in preventing violations by other actors in the occupied territory, including groups acting on their own account (*Armed Activities*, para 179), and it must protect individuals against private actors (General Comment 31, para 8). Halvian patrols watched the burnings without intervening: an omission by state organs, attributable to Halvia, breaching its own obligations (art 2). Halvia's second argument fails.

      *The fence.* Cutting 4,000 farmers off from their fields and from the only hospital restricts freedom of movement (art 12) and endangers lives. With no derogation, the restriction must be provided by law, serve a legitimate aim and be necessary in a democratic society. Security against raids may be a legitimate aim, but cutting civilians off from their livelihoods and the only hospital is unlikely to be proportionate. Halvia's plea that the fence is "necessary" fares no better as a ground precluding wrongfulness: necessity requires that the act be the only way to safeguard an essential interest against a grave and imminent peril, and in the *Wall* opinion construction of a barrier in occupied territory was held not to be necessary.

      *(c) The Committee's views.* The views do not bind, but the Covenant does, and the Committee is the body established to supervise it, so the ICJ would ascribe "great weight" to its findings (*Diallo*, para 66).

      *(d) Remedies.* The breaches are continuing, so Halvia must cease them — release or lawfully process the detainees, protect residents from the Valley Guard, and stop obstructing access — and offer assurances of non-repetition given its denials (art 30). It must make full reparation (art 31). Restitution comes first: as in the *Wall* opinion, where Israel had to stop construction, dismantle what had been built and compensate affected persons, Mesken can seek the fence's dismantling. Compensation covers financially assessable damage, such as lost harvests and homes burned while Halvian patrols failed to act. A declaration of wrongfulness provides satisfaction. Mesken is directly injured, as the violations occur on its territory and against its nationals.

      **Conclusion**

      The Court has prima facie jurisdiction under the two optional clause declarations, and it is likely to indicate binding provisional measures for the detainees and for hospital access (*LaGrand*). The ICCPR applies in the occupied valley (*Wall*; *Armed Activities*). Halvia is responsible for the detentions and beatings by its soldiers (arts 7, 9, 10) and, although the Valley Guard's burnings are not attributable to it, for its own failure to prevent them (*Armed Activities*, para 179; General Comment 31). The fence is a disproportionate restriction of movement that necessity does not excuse. The Committee's views are not binding but carry great weight (*Diallo*). Mesken can seek cessation, assurances, the dismantling of the fence and compensation (arts 30–31).
    rubric:
      - id: r1
        criterion: Establishes jurisdiction and the existence of a dispute
        marks: 1
        top-band: Relies on the two optional clause declarations and on Mesken's notes and Halvia's denials as positively opposed views.
        margin-note: Brief — but do not skip it.
        authorities: []
      - id: r2
        criterion: Applies the provisional measures conditions
        marks: 2
        top-band: Ties each measure to an ICCPR right, finds urgency in the detentions and hospital access, and states that measures bind (LaGrand).
        margin-note: Right, link, urgency — for each measure.
        authorities:
          - icj-statute-art-41
      - id: r3
        criterion: Applies the Covenant extraterritorially
        marks: 2
        top-band: Uses art 2(1), Wall para 109 and Armed Activities para 216 to the occupation and administration of the valley.
        margin-note: Jurisdiction follows control, not borders.
        authorities:
          - iccpr-art-2-1
      - id: r4
        criterion: Analyses Camp Orl
        marks: 1.5
        top-band: Attributes the soldiers' conduct under art 4, identifies breaches of arts 7, 9 and 10, and notes the absence of any derogation.
        margin-note: Organs, rights, no derogation.
        authorities:
          - arsiwa-art-4
          - iccpr-arts-6-13
      - id: r5
        criterion: Distinguishes attribution of the Valley Guard from Halvia's own failure to prevent
        marks: 2
        top-band: Rejects attribution under art 8 (arming and paying are not effective control), then applies Armed Activities para 179 and General Comment 31 to the patrols' omission.
        margin-note: The best answers find Halvia's own breach.
        authorities:
          - arsiwa-art-8
          - hrc-general-comment-31-para-8
      - id: r6
        criterion: Analyses the fence as a restriction and rejects necessity
        marks: 1.5
        top-band: Applies the limitation test to freedom of movement and the hospital, then rejects art 25 necessity using the Wall.
        margin-note: "\"Temporary security measure\" needs proof of proportionality."
        authorities:
          - arsiwa-art-25
      - id: r7
        criterion: States the weight of the views and the remedies
        marks: 2
        top-band: Applies Diallo, then matches cessation, assurances, restitution (dismantling) and compensation to each breach.
        margin-note: Match each remedy to a head of damage.
        authorities:
          - arsiwa-art-30
          - arsiwa-art-31

  # ---------------------------------------------------------------- revision set — the tutor's Week 12 revision quiz (Q1–Q20, tutor's wording kept)
  - key: q022
    type: mcq
    set: revision
    concept: laws2000-w02-article-38-and-sources-of-international-law
    difficulty: 1
    cases: []
    stem: Article 38(1) of the Statute of the International Court of Justice (ICJ Statute) lists the sources of international law that the Court may apply. Which of the following pairings correctly identifies the PRIMARY sources as opposed to the SECONDARY sources listed in that provision?
    options:
      - text: "Primary: treaties and judicial decisions; Secondary: customary international law and scholarly writings."
        why: Tempting because treaties and judicial decisions both look like "hard law" in a domestic system, but art 38(1) treats judicial decisions as a subsidiary means of interpretation, and custom as a primary, law-creating source.
      - text: "Primary: treaties, customary international law, and general principles of law; Secondary: judicial decisions and scholarly writings."
        correct: true
        why: "Correct: art 38(1) separates the law-creating sources — treaties, custom and general principles of law — from judicial decisions and the teachings of publicists, which only help interpret the law found in the primary sources."
      - text: "Primary: judicial decisions and general principles of law; Secondary: treaties and customary international law."
        why: Tempting because ICJ decisions carry great weight and are cited like case law, but under art 59 they bind only the parties to the case; it is treaties and custom that create obligations, so this pairing is upside down.
      - text: "Primary: treaties and customary international law; Secondary: UN General Assembly resolutions and jus cogens"
        why: Tempting because General Assembly resolutions and jus cogens matter a great deal in practice, but neither is listed in art 38(1) at all, and this pairing leaves out general principles, which are a primary source.
      - text: "Primary: treaties, customary international law, general principles of law and jus cogens, applied in that strict order of priority; Secondary: judicial decisions, scholarly writings and General Assembly resolutions."
        why: Tempting because it names the right three primary sources, but art 38(1) sets no strict hierarchy among them, and jus cogens and General Assembly resolutions sit outside art 38 altogether — it is not exhaustive.

  - key: q023
    type: short
    set: revision
    concept: laws2000-w02-customary-international-law-elements
    difficulty: 2
    cases:
      - north-sea-continental-shelf-cases
      - nicaragua-v-united-states-of-america
      - asylum-case-colombia-v-peru
    prompt: Explain the TWO constitutive elements required to establish the existence of a rule of customary international law (CIL).
    model: |-
      A rule of customary international law requires two elements, and each must be shown separately.

      The objective element is state practice: a general practice among states — consistent repetition of a particular behaviour over a period of time when states are confronted with the same facts. Practice need not be perfect. In *North Sea Continental Shelf* the ICJ required practice, including that of specially affected states, to be "extensive and virtually uniform", even over a short period. In *Nicaragua* it was enough that conduct was "in general" consistent with the rule, with departures treated as breaches rather than as a new rule. In the *Asylum Case* there was "so much uncertainty and contradiction" that no constant and uniform usage existed.

      The subjective element is opinio juris sive necessitatis: states follow the practice because they believe it is legally obligatory, not out of courtesy, convenience or tradition. *North Sea* rejected practice explained by mere "ceremonial and protocol".

      A widespread practice without a belief of legal obligation is not custom, and nor is a stated belief backed by inconsistent practice.
    rubric:
      - id: r1
        criterion: Identifies state practice as the objective element
        marks: 1
        top-band: Defines general practice as consistent repetition over time and notes that it need not be perfectly uniform.
        margin-note: Name the element, then define it.
        authorities: []
      - id: r2
        criterion: Uses the cases on the quality of practice required
        marks: 1
        top-band: Cites North Sea ("extensive and virtually uniform", specially affected states) and Nicaragua ("in general" consistent), with the Asylum Case as a failure.
        margin-note: The cases set the standard — use them.
        authorities: []
      - id: r3
        criterion: Identifies opinio juris as the subjective element
        marks: 1
        top-band: Explains belief in legal obligation and distinguishes courtesy, convenience and protocol (North Sea).
        margin-note: Belief in obligation, not habit.
        authorities: []
      - id: r4
        criterion: Explains that both elements must be proved
        marks: 1
        top-band: States that either element alone is insufficient, with an example of each failure.
        margin-note: Cumulative — say so in one line.
        authorities: []

  - key: q024
    type: mcq
    set: revision
    concept: laws2000-w02-sources-beyond-article-38
    difficulty: 1
    cases: []
    stem: Which of the following statements best describes the legal status of a jus cogens (peremptory) norm under international law?
    options:
      - text: It is a treaty obligation that is binding only on state parties that have ratified the relevant instrument.
        why: Tempting because the definition appears in a treaty (VCLT art 53), but a peremptory norm is accepted by the international community of states as a whole; it is not confined to ratifying parties, and it overrides conflicting treaties.
      - text: It is a norm accepted and recognised by the international community of states as one from which no derogation is permitted and which can be modified only by a subsequent norm of the same character.
        correct: true
        why: "Correct: this is VCLT art 53 — a norm accepted and recognised by the international community of states as a whole, from which no derogation is permitted and which only a later norm of the same character can modify."
      - text: It is a soft-law standard that states are encouraged but not required to follow.
        why: "Tempting because some non-binding instruments shape behaviour, but jus cogens is the opposite of soft law: no derogation is permitted, and no treaty provision can validly conflict with a peremptory norm."
      - text: It is a rule applicable exclusively during times of armed conflict and has no effect in peacetime.
        why: Tempting because aggression and some listed crimes arise in war, but the ILC examples — genocide, slavery, torture, self-determination — apply in peacetime too; nothing confines peremptory norms to armed conflict.

  - key: q025
    type: mcq
    set: revision
    concept: laws2000-w02-treaties-as-a-source
    difficulty: 1
    cases: []
    stem: "Under the VCLT, the principle of pacta sunt servanda means that:"
    options:
      - text: Every treaty in force is binding upon the parties to it and must be performed by them in good faith.
        correct: true
        why: "Correct: pacta sunt servanda means a state that has become a party is bound to honour the treaty, because joining implies consent to be bound — so a treaty in force binds its parties, who must perform it in good faith."
      - text: States are free to denounce treaties whenever their domestic interests require.
        why: Tempting because states can leave treaties, but withdrawal follows the treaty's own terms (e.g. the ENNPIA's six months' written notice); a party may not invoke its internal law to justify failing to perform (VCLT art 27).
      - text: A state may suspend treaty performance if a subsequent treaty conflicts with it.
        why: "Tempting because successive treaties can interact, but that is not what pacta sunt servanda means: the principle is that a treaty in force binds its parties, who must honour it — a rule about performance, not about conflicts."
      - text: Only multilateral treaties create binding obligations; bilateral treaties are merely recommendatory.
        why: Tempting because the famous treaties are multilateral conventions, but treaties may be bilateral or multilateral and bind their parties alike; what matters is consent to be bound, not the number of parties or the label.

  - key: q026
    type: short
    set: revision
    concept: laws2000-w04-recognition-of-states
    difficulty: 3
    verify: true
    cases: []
    prompt: Explain the difference between the declaratory theory and the constitutive theory of state recognition in international law. Which approach is more consistent with contemporary international law, and why? In your answer, refer to at least one example of contested statehood to illustrate the practical significance of this debate.
    model: |-
      Recognition is the act by which a state officially acknowledges the existence of another state. Under the declaratory theory, recognition only acknowledges a pre-existing statehood: an entity meeting the Montevideo criteria — population, territory, effective government and capacity for relations — is a state whether or not others recognise it, so recognition is symbolic. Under the constitutive theory, recognition creates the state and confers legal personality: no recognition, no existence.

      The declaratory theory is the most widely held today and fits contemporary law better. Recognition mixes politics and law: states recognise entities that fail the criteria and refuse ones that meet them. If recognition created states, statehood would depend on politics, and an entity could be a state for some states but not for others.

      Recognition still matters. Non-recognition may prevent statehood where the criteria were achieved illegally (Friendly Relations Declaration 1970; *Kosovo* Advisory Opinion). The Turkish Republic of Northern Cyprus meets the criteria, but Security Council resolutions 541 and 550 called its declaration "legally invalid" after Turkey's 1974 invasion, and only Turkey recognises it. Kosovo and Palestine remain contested.
    rubric:
      - id: r1
        criterion: Explains the declaratory theory
        marks: 1
        top-band: Links statehood to the Montevideo criteria and treats recognition as an acknowledgment of existing fact.
        margin-note: Criteria create the state; recognition notes it.
        authorities: []
      - id: r2
        criterion: Explains the constitutive theory
        marks: 1
        top-band: States that recognition confers personality — "no recognition, no existence".
        margin-note: Crisp contrast.
        authorities: []
      - id: r3
        criterion: Chooses the declaratory theory and justifies the choice
        marks: 1.5
        top-band: Notes it is the most widely held view and explains the problem of making statehood depend on political choices.
        margin-note: Answer the "why" — most answers stop at "which".
        authorities: []
      - id: r4
        criterion: Uses a contested-statehood example
        marks: 1.5
        top-band: Uses the TRNC (resolutions 541 and 550; recognised only by Turkey) to show criteria met but recognition withheld.
        margin-note: The example must do work, not just appear.
        authorities:
          - unsc-resolutions-541-and-550
      - id: r5
        criterion: Explains non-recognition where statehood is achieved illegally
        marks: 1
        top-band: Cites the Friendly Relations Declaration and the Kosovo Advisory Opinion.
        margin-note: Illegality is where recognition still bites.
        authorities:
          - friendly-relations-declaration-1970

  - key: q027
    type: mcq
    set: revision
    concept: laws2000-w05-il-perspective-on-national-law
    difficulty: 1
    cases: []
    stem: Article 27 of the VCLT addresses the relationship between domestic law and international treaty obligations. Which of the following statements best reflects the rule established by that provision?
    options:
      - text: A state may invoke provisions of its internal law to justify its failure to perform a treaty only if its parliament has not ratified that treaty.
        why: "Tempting because domestic approval steps feel decisive, but art 27 has no exception for parliamentary ratification: once a state is bound, no provision of its internal law can justify failing to perform the treaty."
      - text: A state may suspend treaty performance if its domestic courts have declared the treaty unconstitutional.
        why: Tempting because domestic courts can strike laws down, but a court ruling is still internal law; under art 27 and ILC art 3, domestic legality does not affect whether a state is in breach internationally.
      - text: A state may invoke domestic constitutional law to justify non-performance of a treaty if the violation is not manifest.
        why: Tempting because it echoes art 46, but art 46 concerns consent given in violation of internal rules on competence, and only where that violation was manifest — this option reverses the test and misapplies it to performance.
      - text: A party may not invoke the provisions of its internal law as justification for its failure to perform a treaty.
        correct: true
        why: "Correct: art 27 VCLT provides that \"a party may not invoke the provisions of its internal law as justification for its failure to perform a treaty\" — domestic and international legality are separate questions."

  - key: q028
    type: short
    set: revision
    concept: laws2000-w05-grounds-of-jurisdiction
    difficulty: 2
    cases: []
    prompt: International law recognises several grounds upon which a state may assert prescriptive jurisdiction over conduct occurring outside its territory. Identify and briefly explain THREE such grounds.
    model: |-
      Where conduct has a foreign element, a state must justify its prescriptive jurisdiction on a recognised ground. Three grounds reach conduct outside its territory.

      1. Active nationality. A state may prosecute its nationals for acts committed abroad. States largely decide who their nationals are; ships and aircraft take the nationality of their state of registration, and dual nationals may face jurisdiction from both states.

      2. The protective principle. A state may assert jurisdiction over acts done abroad by non-nationals that pose a genuine threat to a vital security interest — counterfeiting its currency, espionage, plotting a coup, or attacks on its diplomats.

      3. Universality. Some offences are so serious that any state may prosecute them without any link to the place, offender or victim — originally piracy, now genocide, war crimes, crimes against humanity and torture (e.g. Geneva Convention IV art 146). Without a treaty basis it is controversial, so states usually require the accused's presence.

      Passive personality (the victim's nationality) is a further ground, but it is controversial and best treated as subsidiary. Where several states have a ground, the state with the closest link is usually best placed.
    rubric:
      - id: r1
        criterion: Explains active nationality
        marks: 1
        top-band: States the rule and notes registration of ships and aircraft and dual nationality.
        margin-note: The offender is the link.
        authorities: []
      - id: r2
        criterion: Explains the protective principle
        marks: 1
        top-band: Requires a genuine threat to a vital security interest and gives examples.
        margin-note: Security interest — give an example.
        authorities: []
      - id: r3
        criterion: Explains universality and its limits
        marks: 1
        top-band: Names the crimes, notes the treaty basis and the controversy, and the usual presence requirement.
        margin-note: The crime itself is the link.
        authorities:
          - geneva-convention-iv-art-146
      - id: r4
        criterion: Places the grounds in context
        marks: 1
        top-band: Mentions passive personality as controversial and addresses concurring jurisdiction.
        margin-note: Good — you know where the edges are.
        authorities: []

  - key: q029
    type: mcq
    set: revision
    concept: laws2000-w06-restrictive-state-immunity
    difficulty: 2
    verify: true
    cases:
      - trendex-trading-corporation-v-central-bank-of-nigeria
    stem: In the context of state immunity under international law, which of the following correctly distinguishes between acta jure imperii and acta jure gestionis?
    options:
      - text: Acta jure imperii are commercial acts to which restricted immunity applies; acta jure gestionis are sovereign acts that enjoy absolute immunity.
        why: "Tempting because both Latin labels appear, but this swaps them: jure imperii are sovereign acts (foreign and military affairs, legislation, police power), while jure gestionis are commercial acts, which are not immune."
      - text: Acta jure imperii are sovereign or governmental acts that generally enjoy immunity from foreign court jurisdiction; acta jure gestionis are commercial acts that generally do not attract immunity.
        correct: true
        why: "Correct: under the restrictive approach most states apply, sovereign acts jure imperii are immune, while commercial acts jure gestionis are not — as when a state organ failed to honour a letter of credit in Trendex."
      - text: Both categories enjoy absolute immunity under the UN Convention on Jurisdictional Immunities of States and their Property (2004).
        why: Tempting because the 2004 Convention codifies immunity, but it is not in force, and its art 10 removes immunity in proceedings arising out of commercial transactions — the opposite of absolute immunity for both categories.
      - text: The distinction between acta jure imperii and acta jure gestionis was abolished by customary international law following the Trendex case before the English Court of Appeal in 1977.
        why: Tempting because Trendex (English Court of Appeal, 1977) is a landmark, but it applied the distinction, refusing immunity to a state organ for a commercial letter of credit; the distinction is the basis of restrictive immunity.

  - key: q030
    type: short
    set: revision
    concept: laws2000-w06-immunities-of-state-officials
    difficulty: 2
    cases:
      - arrest-warrant-of-11-april-2000-democratic-republic-of-congo-v-belgium
    prompt: Explain the distinction between personal immunity (ratione personae) and functional immunity (ratione materiae) for state officials in international law.
    model: |-
      Both immunities belong to the state, not the official: they exist so that officials can perform their functions (*Arrest Warrant*), and both come from customary international law. They differ in what they attach to.

      Functional immunity (ratione materiae) attaches to the act. It covers only official acts performed with the state's authority while in office, and any official can hold it — for example, a soldier who kills an enemy soldier in battle. Because it protects the state's acts, it continues after the official leaves office, and only the state can waive it.

      Personal immunity (ratione personae) attaches to the office. It is complete, covering private as well as official acts, but only the most senior officials hold it: heads of state, heads of government and foreign ministers. It lasts only while the person is in office; afterwards only functional immunity remains, for official acts. In *Arrest Warrant* a Belgian warrant for the serving Congolese foreign minister breached his personal immunity, with no exception for international crimes.

      Neither immunity applies in the official's own state's courts, and both are procedural: immunity does not mean impunity.
    rubric:
      - id: r1
        criterion: States the shared rationale and source
        marks: 1
        top-band: Explains that immunity belongs to the state, exists for the performance of functions (Arrest Warrant), and rests on custom.
        margin-note: Whose immunity is it? The state's.
        authorities: []
      - id: r2
        criterion: Explains functional immunity
        marks: 1.5
        top-band: Attaches it to official acts, extends it to any official, and explains that it survives office and can be waived only by the state.
        margin-note: Act, not office.
        authorities: []
      - id: r3
        criterion: Explains personal immunity
        marks: 1.5
        top-band: Limits it to the three senior offices, covers private acts, and ends it when the person leaves office.
        margin-note: Office, not act — and only while it lasts.
        authorities: []
      - id: r4
        criterion: Uses Arrest Warrant and the immunity/impunity distinction
        marks: 1
        top-band: Applies Arrest Warrant to a serving foreign minister and notes that immunity is procedural.
        margin-note: Immunity is not impunity.
        authorities: []

  - key: q031
    type: mcq
    set: revision
    concept: laws2000-w07-framework-of-state-responsibility
    difficulty: 1
    cases: []
    stem: Under the ILC Articles on Responsibility of States for Internationally Wrongful Acts (ARSIWA, 2001), an internationally wrongful act consists of two cumulative elements. Which of the following correctly identifies those two elements?
    options:
      - text: Conduct attributable to the state under international law, and conduct that constitutes a breach of an international obligation of that state.
        correct: true
        why: "Correct: art 2 ARSIWA — an internationally wrongful act exists when conduct, whether an act or an omission, is attributable to the state and constitutes a breach of an international obligation of that state."
      - text: Malicious intent on the part of the state and a breach of a treaty obligation.
        why: Tempting because intent matters in domestic criminal law, but art 2 lists only attribution and breach — no element of malice — and the obligation breached may come from any source, custom as well as treaty (art 12).
      - text: A violation of a jus cogens norm and tangible damage suffered by another state.
        why: "Tempting because jus cogens breaches are the gravest, but any international obligation will do, and damage is not an element: injury matters for reparation (art 31), not for whether a wrongful act exists."
      - text: A domestic court finding of unlawfulness and the state's failure to provide adequate reparation.
        why: Tempting because domestic courts sometimes find state conduct unlawful, but wrongfulness is governed by international law, not internal law (ILC art 3), and reparation is a consequence of the act, not an element of it.
      - text: Conduct attributable to the state under international law, a breach of an international obligation of that state, and material damage suffered by the state that then invokes the responsibility.
        why: "Tempting because claims usually follow harm, but material damage is not a third element: art 2 has only two, and injury, material or moral, goes to full reparation under art 31 once wrongfulness is established."

  - key: q032
    type: short
    set: revision
    concept: laws2000-w07-breach-of-an-international-obligation
    difficulty: 2
    cases:
      - corfu-channel-case-united-kingdom-v-albania
    prompt: In the Corfu Channel Case (ICJ, 1949), the International Court of Justice found Albania internationally responsible even though Albania had not itself laid the mines that caused the loss of British warships and sailors. Identify and explain the principle of state responsibility illustrated by this case.
    model: |-
      *Corfu Channel* shows that a state can be responsible for an omission — and so for harm it did not directly cause — where it fails to act on knowledge of a danger in its territory.

      In October 1946 two British warships struck mines in Albanian waters; 45 sailors died and 42 were wounded. Who laid the mines was never established. But the Albanian government's attitude, and the fact that the minelaying would have been visible from the Albanian coast, led the ICJ to conclude that Albania knew of the minefield.

      Albania's obligations consisted in notifying shipping of the minefield and warning the approaching British warships of the imminent danger. The Court also referred to every state's obligation "not to allow knowingly its territory to be used for acts contrary to the rights of other States". Albania's failure to warn breached those obligations.

      Under art 2 ARSIWA a wrongful act may be an act or an omission. Albania's own authorities failed to warn, so the omission was Albania's; it did not matter that others laid the mines. The "knowingly allow" duty is a question of due diligence.
    rubric:
      - id: r1
        criterion: "Identifies the principle: responsibility for an omission"
        marks: 1.5
        top-band: States that a breach may be an act or an omission (art 2) and that Albania answered for its own failure to warn.
        margin-note: Name the principle in the first line.
        authorities:
          - arsiwa-art-2
      - id: r2
        criterion: Uses the facts and the finding of knowledge
        marks: 1
        top-band: Explains how the Court inferred knowledge from Albania's attitude and the visibility of the minelaying.
        margin-note: Knowledge is the hinge.
        authorities: []
      - id: r3
        criterion: States the content of Albania's obligations
        marks: 1
        top-band: Identifies the duties to notify and warn and quotes the "allow knowingly" principle.
        margin-note: Quote the Court — it is short.
        authorities: []
      - id: r4
        criterion: Explains why it did not matter who laid the mines
        marks: 1
        top-band: Separates the unknown minelayer from Albania's own omission, attributable through its authorities, and notes due diligence.
        margin-note: Whose conduct? Albania's silence.
        authorities: []

  - key: q033
    type: short
    set: revision
    concept: laws2000-w08-existence-of-a-dispute
    difficulty: 2
    cases:
      - mavrommatis-palestine-concessions-greece-v-great-britain
      - interpretation-of-peace-treaties-with-bulgaria-hungary-and-romania
      - south-west-africa-ethiopia-v-south-africa-liberia-v-south-africa
      - application-of-the-international-convention-on-the-elimination-of-all-forms-of-racial-discrimination-georgia-v-russian-federation
    prompt: Explain the legal significance of the 'existence of a dispute' in the context of the International Court of Justice's jurisdiction.
    model: |-
      A dispute must exist on the date proceedings are instituted; if it does not, the ICJ has no jurisdiction to deal with the case. That is why respondents often deny that any dispute exists. Treaty law gives no test, so the cases supply it.

      A dispute is "a disagreement on a point of law or fact, a conflict of legal views or interests" (*Mavrommatis*). Whether one exists "is a matter for objective determination", and "the mere denial of the existence of a dispute does not prove its non-existence" (*Peace Treaties*); otherwise a respondent could escape the Court simply by saying so. The claim of one party must be "positively opposed" by the other, and the respondent must have been aware, or could not have been unaware, of that opposition (*South West Africa*). Mere friction is not enough: there must be communication showing opposed views on a specific issue. The determination "requires an examination of the facts" (*Georgia v Russian Federation*, para 30), such as public statements and diplomatic exchanges. The threshold is low.

      Establish the dispute before turning to consent.
    rubric:
      - id: r1
        criterion: Explains why the existence of a dispute matters for jurisdiction
        marks: 1.5
        top-band: States that a dispute must exist at the date of filing or the Court lacks jurisdiction, and why respondents deny it.
        margin-note: Significance first — that is the question.
        authorities: []
      - id: r2
        criterion: Defines a dispute
        marks: 1
        top-band: Quotes Mavrommatis accurately.
        margin-note: Law or fact, views or interests.
        authorities: []
      - id: r3
        criterion: Explains objective determination
        marks: 1
        top-band: Uses Peace Treaties to show a denial is not decisive, with the reason.
        margin-note: Denial proves nothing.
        authorities: []
      - id: r4
        criterion: States the test and the evidence
        marks: 1.5
        top-band: Applies positive opposition and awareness (South West Africa), the need for communication, and an examination of the facts (Georgia v Russian Federation).
        margin-note: Low threshold, but it must be shown.
        authorities: []

  - key: q034
    type: mcq
    set: revision
    concept: laws2000-w08-existence-of-a-dispute
    difficulty: 1
    cases:
      - mavrommatis-palestine-concessions-greece-v-great-britain
    stem: "In the Mavrommatis Palestine Concessions Case (PCIJ, 1924), the Permanent Court of International Justice defined a legal dispute as:"
    options:
      - text: Any political disagreement between two or more states concerning matters of mutual concern.
        why: Tempting because many disputes are political too, but Mavrommatis requires a disagreement on a point of law or fact; political disagreement on matters of mutual concern without opposed legal views is mere friction.
      - text: A disagreement on a point of law or fact, a conflict of legal views or of interests between two persons.
        correct: true
        why: "Correct: the PCIJ defined a dispute as \"a disagreement on a point of law or fact, a conflict of legal views or interests\" between persons — for the ICJ's purposes, mostly states."
      - text: A situation in which one state formally protests the conduct of another state through diplomatic channels.
        why: Tempting because diplomatic protests are often the best evidence that a dispute exists, but a protest is evidence, not the definition; the test is opposed views of law, fact or interests, determined objectively.
      - text: Any failure by a state to comply with a binding resolution of the UN Security Council.
        why: Tempting because Security Council decisions bind members (art 25), but non-compliance with a resolution may be a breach; it is not the definition of a legal dispute, which turns on conflicting views between the parties.

  - key: q035
    type: mcq
    set: revision
    concept: laws2000-w08-obligation-of-peaceful-settlement
    difficulty: 2
    cases:
      - nicaragua-v-united-states-of-america
    stem: Under international law, which of the following best characterises states' obligations regarding the settlement of international disputes under Article 2(3) of the UN Charter?
    options:
      - text: States are obligated to refer all disputes to the International Court of Justice for binding adjudication.
        why: Tempting because the ICJ is the UN's principal judicial organ, but its jurisdiction rests on consent, and art 2(3) leaves states free to choose any peaceful means; art 33(1) lists many besides judicial settlement.
      - text: States are obligated both to settle their disputes and to do so exclusively through adjudicatory means under Art. 2(3) UN Charter.
        why: Tempting because adjudication gives binding results, but art 2(3) requires peaceful means, not adjudicatory ones — negotiation, mediation, conciliation and "other peaceful means of their own choice" all qualify.
      - text: States are obligated to settle their international disputes by peaceful means; however, international law does not generally impose an obligation to settle all disputes.
        correct: true
        why: "Correct: art 2(3), also binding as custom (Nicaragua, para 290), is an obligation of conduct, not of result — states must try to settle peacefully, and keep trying, but need not reach a settlement."
      - text: States have no legal obligation regarding the settlement of disputes; settlement is entirely discretionary.
        why: Tempting because the choice of means rests on consent, but the duty itself is mandatory — "All Members shall settle their international disputes by peaceful means" — and binds as custom as well as treaty.
      - text: States are obligated to settle every international dispute by peaceful means within a reasonable time, so a dispute that remains unresolved for decades is itself a continuing breach of Article 2(3) by both parties.
        why: "Tempting because \"shall settle\" sounds like a duty of result, but it is an obligation of conduct: Canada and Denmark disputed Hans Island peacefully for about 50 years without either breaching art 2(3)."

  - key: q036
    type: mcq
    set: revision
    concept: laws2000-w09-prohibition-on-the-use-of-force
    difficulty: 2
    verify: true
    cases:
      - legality-of-the-threat-or-use-of-nuclear-weapons
    stem: Article 2(4) of the UN Charter prohibits 'the threat or use of force against the territorial integrity or political independence of any state.' In the Advisory Opinion on the Legality of the Threat or Use of Nuclear Weapons (ICJ, 1996), the Court clarified the meaning of a 'threat'. Which of the following best reflects that clarification?
    options:
      - text: If a threatened use of force would itself be unlawful, then the stated readiness to use such force is also prohibited as a threat under Article 2(4).
        correct: true
        why: "Correct: Nuclear Weapons para 47 — if the use of force would itself be illegal, the threat to use it is likewise illegal; to be lawful, a declared readiness to use force must concern force that conforms with the Charter."
      - text: A threat is unlawful under Article 2(4) only if it is accompanied by a specific ultimatum demanding territorial concessions.
        why: Tempting because an explicit ultimatum is the clearest threat, but threats may be explicit or implicit; what matters is a reasonably specific, credible readiness to use force that would itself be unlawful.
      - text: The prohibition on threats of force applies only to nuclear-armed states.
        why: Tempting because the opinion concerned nuclear weapons, but art 2(4) binds every state, as treaty and as custom; the Court's reasoning on threats applies to any threatened force, conventional or nuclear.
      - text: A threat is unlawful under Article 2(4) whenever one state makes hostile political statements about another, whether or not it has the means or any real intention to carry out the force it mentions.
        why: "Tempting because art 2(4) bans threats as well as force, but not all political rhetoric is a threat (paras 47–48): it must be reasonably specific and credible, so a state with no means or intention makes none."

  - key: q037
    type: mcq
    set: revision
    concept: laws2000-w09-prohibition-on-the-use-of-force
    difficulty: 1
    verify: true
    cases:
      - nicaragua-v-united-states-of-america
    stem: In the Nicaragua Case (Military and Paramilitary Activities in and against Nicaragua, ICJ 1986), the International Court of Justice affirmed which of the following propositions regarding the prohibition on the use of force?
    options:
      - text: The prohibition on the use of force is binding exclusively on UN Member States through the UN Charter and does not form part of customary international law.
        why: Tempting because the Charter is the famous source, but Nicaragua (para 34) held that force is regulated by custom as well as treaty — so the prohibition also binds states that are not members of the UN.
      - text: The prohibition on the use of force may be displaced by regional collective security arrangements between states.
        why: Tempting because regional bodies settle local disputes (art 52), but regional arrangements must be consistent with the Charter's Purposes and Principles; they cannot displace a prohibition that is custom and jus cogens.
      - text: The use of force is regulated both by customary international law and by treaty law, in particular the UN Charter.
        correct: true
        why: "Correct: in Nicaragua (para 34) the Court said \"there can be no doubt\" that the use of force is regulated both by customary international law and by treaties, in particular the UN Charter."
      - text: Indirect use of force (such as arming and training non-state actors) is expressly authorised under Article 51 of the UN Charter.
        why: Tempting because Nicaragua dealt at length with arming the contras, but art 51 authorises only self-defence "if an armed attack occurs", and the Court treated supplying arms to armed groups as below that threshold.

  - key: q038
    type: short
    set: revision
    concept: laws2000-w10-non-forcible-measures-under-article-41
    contrasts-with:
      - laws2000-w10-authorisation-of-force-under-article-42
    difficulty: 2
    cases: []
    prompt: Distinguish between the UN Security Council's non-forcible measures under Article 41 and forcible measures under Article 42 of the UN Charter.
    model: |-
      Both are Chapter VII measures: each follows an art 39 determination of a threat to the peace, breach of the peace or act of aggression, and each binds members as a Council decision (art 25).

      Art 41 measures are those "not involving the use of armed force". The list — interruption of economic relations and communications, severance of diplomatic relations — is non-exhaustive, giving the Council wide scope: comprehensive sanctions (Iraq in the 1990s; North Korea under Res 2397), targeted or "smart" sanctions such as asset freezes, travel bans and commodity bans, ad hoc criminal tribunals (the ICTY and ICTR), and referral of a situation to the ICC Prosecutor (Rome Statute art 13(b); Darfur, 2005).

      Art 42 measures involve force. If the Council considers that art 41 measures "would be inadequate or have proved to be inadequate", it "may take such action by air, sea, or land forces as may be necessary". Force is the last resort. Because art 43 was never implemented, the Council authorises member states, coalitions or regional organisations, typically to use "all necessary means" (Res 678, Kuwait 1990).

      Art 41 comes first; art 42 follows only if non-forcible measures are, or would be, inadequate.
    rubric:
      - id: r1
        criterion: Places both within Chapter VII
        marks: 1
        top-band: Links both to an art 39 determination and to the binding effect of Council decisions under art 25.
        margin-note: Common ground first, then the contrast.
        authorities:
          - un-charter-art-39
          - un-charter-art-25
      - id: r2
        criterion: Explains art 41 measures
        marks: 1.5
        top-band: Notes the non-exhaustive list and gives comprehensive and targeted sanctions, tribunals and ICC referral as examples.
        margin-note: Range of tools — name several.
        authorities:
          - un-charter-art-41
          - unsc-resolution-2397
      - id: r3
        criterion: Explains art 42 measures
        marks: 1.5
        top-band: Quotes the inadequacy threshold and explains authorisation of states in the absence of art 43 forces (Res 678).
        margin-note: Force — and how the Council actually uses it.
        authorities:
          - un-charter-art-42
          - unsc-resolution-678
      - id: r4
        criterion: States the sequence
        marks: 1
        top-band: Explains that art 42 is the last resort, reached only when art 41 is or would be inadequate.
        margin-note: Order matters.
        authorities: []

  - key: q039
    type: mcq
    set: revision
    concept: laws2000-w11-icc-jurisdiction
    difficulty: 1
    cases: []
    stem: Which of the following is NOT one of the four core international crimes within the subject-matter jurisdiction of the International Criminal Court (ICC) under the Rome Statute (1998)?
    options:
      - text: Genocide.
        why: Tempting if you think of genocide as belonging to its own 1948 Convention, but genocide is the first of the four core crimes listed in art 5 of the Rome Statute (art 6), so it is within the ICC's jurisdiction.
      - text: Crimes against humanity.
        why: Tempting because crimes against humanity grew out of the Nuremberg Charter rather than a treaty of their own, but art 5 lists them, with art 7 devoted to them, so they are within the ICC's jurisdiction.
      - text: Terrorism.
        correct: true
        why: "Correct: art 5 limits jurisdiction to genocide, crimes against humanity, war crimes and the crime of aggression; terrorism, however serious, is not on the list — just as piracy is not."
      - text: War crimes.
        why: Tempting because war crimes are often tried in national military courts, but they are one of the four art 5 crimes (art 8), alongside genocide, crimes against humanity and aggression.

  - key: q040
    type: mcq
    set: revision
    concept: laws2000-w11-icc-admissibility-and-complementarity
    difficulty: 2
    cases: []
    stem: Under the Rome Statute, the International Criminal Court (ICC) operates on the principle of 'complementarity.' Which of the following best describes this principle?
    options:
      - text: The ICC has primary jurisdiction over all core international crimes and may override national courts at any time.
        why: "Tempting because the ICC tries the gravest crimes, but the Statute makes it \"complementary to national criminal jurisdictions\" (art 1): it cannot override a genuine national investigation or prosecution."
      - text: The ICC may only exercise jurisdiction when the state with primary jurisdiction over the crime is unwilling or genuinely unable to carry out an investigation or prosecution.
        correct: true
        why: "Correct: under art 17 a case is inadmissible where a state with jurisdiction is investigating or prosecuting it, unless that state is unwilling or unable genuinely to do so — national courts come first."
      - text: The ICC and national courts share concurrent and equal jurisdiction over core international crimes in all circumstances.
        why: "Tempting because both the ICC and national courts may have jurisdiction over the same crime, but they are not equal: art 17 gives priority to a genuine national investigation, and the ICC steps in only if it is lacking."
      - text: The ICC can only exercise jurisdiction over cases referred by the UN Security Council acting under Chapter VII of the UN Charter.
        why: Tempting because Security Council referrals (Darfur, Libya) are prominent, but a State Party referral and the Prosecutor's own initiative are also triggers under art 13; complementarity concerns admissibility, not triggers.

  - key: q041
    type: mcq
    set: revision
    concept: laws2000-w09-armed-attack
    difficulty: 2
    verify: true
    cases:
      - nicaragua-v-united-states-of-america
    stem: Under Article 51 of the UN Charter, the right of self-defence may only be exercised in response to an 'armed attack.' In the Nicaragua Case (ICJ, 1986), the Court drew a significant distinction regarding the meaning of 'armed attack.' Which of the following best reflects that distinction and its legal consequence for the right of self-defence?
    options:
      - text: The Court distinguished between the 'most grave forms of the use of force' constituting an armed attack and 'less grave forms' (such as frontier incidents or the supply of arms and funds to armed groups), concluding that only the former triggers the right of self-defence.
        correct: true
        why: "Correct: Nicaragua distinguished \"the most grave forms of the use of force (those constituting an armed attack)\" from less grave forms such as frontier incidents and supplying arms or funds; only an armed attack triggers art 51."
      - text: Any use of force by a state qualifies as an 'armed attack' triggering the right to self-defence under Article 51.
        why: "Tempting because arts 2(4) and 51 both concern force, but they are not co-extensive: every armed attack is a use of force, yet a use of force is an armed attack only if its scale and effects are grave enough."
      - text: The provision of arms and logistical support to paramilitary groups by a foreign state unconditionally constitutes an armed attack, entitling the victim state to respond with full military force under Article 51.
        why: Tempting because the US armed and supplied the contras, but Nicaragua held that providing arms and logistical support is below the armed attack threshold; significant involvement — effective control of the operations — is required.
      - text: The conditions of necessity and proportionality are expressly set out in Article 51 of the UN Charter and automatically apply whenever a state invokes the right of self-defence.
        why: Tempting because necessity and proportionality always apply to self-defence, but art 51 does not state them; the ICJ confirmed them in Nicaragua as conditions under customary international law.
