      - text: Leaves all innovation decisions to outside consultants.
        why: >-
          Tempting because consultants are common in strategy work, but the slide describes a leader who is passionate
          and obsessed with restoring innovation.
      - text: Focuses on protecting the company's existing products.
        why: >-
