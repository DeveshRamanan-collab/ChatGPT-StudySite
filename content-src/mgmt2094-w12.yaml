cards:
  - type: basic
    concept: innovation-culture
    front: List the five characteristics of an innovation culture.
    back: >-
      It shows organisation-wide commitment to the business and to innovation; experiments proactively; manages risk;
      can implement ideas quickly; produces and cultivates innovators.
    source: Week 12 Lecture Slides, slide 2
  - type: cloze
    concept: innovation-culture
    text: Resistance to innovation shows as lack of {{c1::follow-through}} and lack of {{c2::engagement}}.
    source: Week 12 Lecture Slides, slide 3
  - type: basic
    concept: innovation-culture
    front: What do companies that don't experiment proactively say?
    back: "\"If it ain't broke, don't fix it.\" \"We've always done it this way.\" \"Customers like it this way.\""
    source: Week 12 Lecture Slides, slide 4
  - type: basic
    concept: innovation-culture
    front: Three signs of a culture that doesn't produce innovators?
    back: Failure is discouraged or punished; employees are reluctant to bring up ideas; innovation is top-down.
    source: Week 12 Lecture Slides, slide 5
  - type: apply
    concept: innovation-culture
    scenario: >-
      A café owner answers every new dish idea with "Customers like it this way", and staff have stopped suggesting
      anything.
    answer: >-
      No proactive experimenting (a quoted sign on the slides) and employees reluctant to bring up ideas: a culture that
      doesn't produce innovators. Let ideas be heard and give them space to test.
    source: Week 12 Lecture Slides, slide 4–5
  - type: basic
    concept: innovative-leader
    front: What is an innovative leader? (five traits on the slide)
    back: >-
      Passionate about the company; obsessed with restoring innovation; willing to take risks; can manage risks; can
      start projects quickly.
    source: Week 12 Lecture Slides, slide 6
  - type: cloze
    concept: innovative-leader
    text: >-
      Culture "manages risk" → leader is {{c1::realistic and informed}}; culture "can implement ideas quickly" → leader
      is {{c2::capable of rapid project execution}}.
    source: Week 12 Lecture Slides, slide 7
  - type: basic
    concept: innovative-leader
    front: Leader match for the culture trait "produces and cultivates innovators"?
    back: Able to attract and nurture innovators.
    source: Week 12 Lecture Slides, slide 7
  - type: cloze
    concept: innovative-leader
    text: "Steve Jobs: \"Innovation distinguishes between a {{c1::leader}} and a {{c2::follower}}.\""
    source: Week 12 Lecture Slides, slide 8
  - type: apply
    concept: innovative-leader
    scenario: >-
      Before investing in LegalVision, Sam Nickless sent mystery shoppers and asked G+T's top lawyers to review its
      work.
    answer: >-
      Realistic and informed: the leader trait that matches the culture's "manages risk". He was willing to take the
      risk, but checked first.
    source: Nickless (2017), Tackling disruption the smart way, p 29
  - type: basic
    concept: challenges-managing-innovation
    front: Name the seven challenges faced while managing innovation.
    back: >-
      1 Why change? 2 What to change? 3 Understanding innovation. 4 Building an innovation culture. 5 Continuous
      learning. 6 High involvement innovation. 7 Managing connections.
    source: Week 12 Lecture Slides, slide 9–10
  - type: cloze
    concept: challenges-managing-innovation
    text: >-
      Managing innovation is all about creating firm-specific routines, i.e. {{c1::repeated, reinforced patterns of
      behaviour}}.
    source: Week 12 Lecture Slides, slide 9
  - type: cloze
    concept: challenges-managing-innovation
    text: >-
      Managing connections: organisations must operate in relationship with others rather than in {{c1::splendid
      isolation}}.
    source: Week 12 Lecture Slides, slide 10
  - type: basic
    concept: challenges-managing-innovation
    front: What does the slide say about high involvement innovation?
    back: A higher level of participation in innovation represents a competitive advantage.
    source: Week 12 Lecture Slides, slide 10
  - type: apply
    concept: challenges-managing-innovation
    scenario: As her business grew, Shelley Simpson had to learn logistics, packaging, freight and compliance.
    answer: >-
      Continuous learning (challenge 5): firms constantly need to develop their routines to deal with environmental
      challenges.
    source: Week 12 Guest Lecture (Shelley Simpson), transcript
  - type: basic
    concept: barriers-to-innovation
    front: What are the external barriers to innovation?
    back: Market-related; government and its policies; others (technical, societal and inter-organisational).
    source: Week 12 Lecture Slides, slide 11
  - type: basic
    concept: barriers-to-innovation
    front: What are the internal barriers to innovation?
    back: People related; structural; strategy related.
    source: Week 12 Lecture Slides, slide 11
  - type: cloze
    concept: barriers-to-innovation
    text: >-
      Technical, societal and inter-organisational barriers are {{c1::external}} barriers; people, structure and
      strategy are {{c2::internal}} barriers.
    source: Week 12 Lecture Slides, slide 11
  - type: apply
    concept: barriers-to-innovation
    scenario: Every new idea at a retailer must pass six layers of approval, and most expire before a decision.
    answer: "Internal, structural barrier: the obstacle lies in how the firm itself is organised."
    source: Week 12 Lecture Slides, slide 11
  - type: apply
    concept: barriers-to-innovation
    scenario: Shelley Simpson says compliance (duties and taxes in each market) was one of her biggest hurdles.
    answer: >-
      External barrier: government and its policies. The rules sit outside the firm, even though the compliance work
      happens inside it.
    source: Week 12 Guest Lecture (Shelley Simpson), transcript
  - type: basic
    concept: overcoming-barriers
    front: Name the eight components for overcoming barriers (learning to manage innovation).
    back: >-
      Shared vision, leadership and the will to innovate; appropriate culture; key individuals; effective team working;
      continuing and stretching individual development; extensive communication; creative climate; learning
      organisation.
    source: Week 12 Lecture Slides, slide 12–14
  - type: basic
    concept: overcoming-barriers
    front: "Shared vision, leadership and the will to innovate: what three things does it involve?"
    back: A clearly articulated and shared sense of purpose; stretching strategic intent; top management commitment.
    source: Week 12 Lecture Slides, slide 12
  - type: cloze
    concept: overcoming-barriers
    text: "Creative climate: a positive approach to creative ideas, supported by relevant {{c1::motivation systems}}."
    source: Week 12 Lecture Slides, slide 14
  - type: cloze
    concept: overcoming-barriers
    text: >-
      Learning organisation: high involvement in proactive experimentation, and knowledge {{c1::capture}} and
      {{c2::dissemination}}.
    source: Week 12 Lecture Slides, slide 14
  - type: basic
    concept: overcoming-barriers
    front: "Conclusion: what should enterprises emphasise?"
    back: >-
      Planning and controlling systems with a high degree of flexibility; respect for individual initiative and personal
      growth; tolerance for mistakes and allowing room for failure.
    source: Week 12 Lecture Slides, slide 15
  - type: apply
    concept: overcoming-barriers
    scenario: A council has good ideas, but no one owns them, and each dies when the meeting ends.
    answer: "Key individuals: promoters, champions and other roles which facilitate innovation are missing."
    source: Week 12 Lecture Slides, slide 13
  - type: basic
    concept: responding-to-disruption
    front: How did G+T expect disruption to spread through the legal market?
    back: >-
      Up the market: from lower-value, high-volume work towards the higher-value work where the bulk of its business
      lay.
    source: Nickless (2017), Tackling disruption the smart way, p 28
  - type: basic
    concept: responding-to-disruption
    front: What responses to disruption did G+T consider?
    back: >-
      Change its business model; retreat into a specialist niche; develop online platforms to automate simple work;
      outsource; launch its own version; partner with a disruptor.
    source: Nickless (2017), Tackling disruption the smart way, p 29
  - type: cloze
    concept: responding-to-disruption
    text: G+T bought a {{c1::20 per cent}} stake in LegalVision for about {{c2::A$4 million}}.
    source: Nickless (2017), Tackling disruption the smart way, p 29
  - type: basic
    concept: responding-to-disruption
    front: Why did G+T not launch its own low-cost version?
    back: >-
      Getting the incentives right to motivate people and create the right culture would be very hard alongside a
      traditional legal model.
    source: Nickless (2017), Tackling disruption the smart way, p 29
  - type: apply
    concept: responding-to-disruption
    scenario: A large accounting firm sees a start-up winning simple tax returns with automated software.
    answer: >-
      Take it seriously: on the reading's logic, disruption moves up the market from lower-value work. Partnering gives
      exposure to the growth and a way to learn from it.
    source: Nickless (2017), Tackling disruption the smart way, p 28–29
audio:
  title: Week 12 recap — leading an innovative culture
  minutes: 3
  script: >-
    Week twelve is about leading an innovative culture. Start with the overlap: innovation plus culture gives an
    innovation culture, and the slides give it five characteristics. It shows organisation-wide commitment to the
    business and to innovation, it experiments proactively, it manages risk, it can implement ideas quickly, and it
    produces and cultivates innovators. We see commitment when people care about their work, their co-workers and the
    company; we see resistance as lack of follow-through and lack of engagement. Companies that don't experiment say
    things like "if it ain't broke, don't fix it" or "we've always done it this way". And a culture that doesn't produce
    innovators punishes failure, leaves people reluctant to speak up, and keeps innovation top-down.


    Each culture trait has a leader trait. Commitment matches passion about innovation, experimenting matches
    willingness to experiment, managing risk matches being realistic and informed, quick implementation matches rapid
    project execution, and cultivating innovators matches attracting and nurturing them. Steve Jobs puts it simply:
    innovation distinguishes between a leader and a follower.


    Then come seven challenges of managing innovation: why change, what to change, understanding innovation, building an
    innovation culture through routines, continuous learning, high involvement innovation, and managing connections,
    which means working with others rather than in splendid isolation.


    Barriers are a separate list. External ones are market-related, government and its policies, and others: technical,
    societal and inter-organisational. Internal ones are people, structure and strategy. To overcome them, the slides
    give eight components: shared vision and leadership, appropriate culture, key individuals, effective team working,
    continuing individual development, extensive communication, a creative climate and a learning organisation. The
    conclusion: flexible planning and control, respect for individual initiative, and tolerance for mistakes.


    The reading gives us Gilbert and Tobin. Sam Nickless saw NewLaw firms like LegalVision doing low-value, high-volume
    work, and expected disruption to move up the market. Instead of building its own version, which would have clashed
    with the firm's incentives and culture, Gilbert and Tobin bought a twenty per cent stake in LegalVision for about
    four million dollars, after checking it with mystery shoppers and its own top lawyers. That is managing connections,
    and learning from disruption.


    Finally, Shelley Simpson's guest lecture puts it all in one story: experimenting widely, learning logistics and
    compliance as she grew, building relationships and her own stores, staying careful about investors and growth, and
    asking her team to lean in.
