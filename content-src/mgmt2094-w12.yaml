        why: >-
          Correct: key individuals (promoters, champions and other roles which facilitate innovation) is one of the
          eight components.
      - text: One manager who decides on every idea.
        why: >-
          Tempting because it sounds decisive, but the slides favour key individuals, teams and wide involvement over a
          single gatekeeper.
      - text: Avoiding partnerships outside the firm.
        why: >-
          Tempting because partners can leak ideas, but the slides call for extensive communication within, between and
          outside the organisation.
