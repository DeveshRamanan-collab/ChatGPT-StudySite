      - text: Innovators have space to develop and test; innovation is rewarded.
        correct: true
        why: >-
          Correct: time to build and test prototypes is space to develop and test, and the bonus means innovation is
          rewarded.
      - text: Risk is managed by managers; ideas are implemented very quickly.
        why: >-
          Tempting because both are culture characteristics, but the scenario shows space to test and a reward, not risk
          control or speed.
  - key: q111
    type: mcq
    concept: innovation-culture
    difficulty: 3
    stem: >-
