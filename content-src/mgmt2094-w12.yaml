week_file:
  topic: Leading an innovative culture
  summary: >-
    Week 12 sets out what an innovation culture is (five characteristics, and the signs of commitment or resistance) and
    the matching traits of an innovative leader. It then covers the seven challenges of managing innovation, the
    external and internal barriers to it, and the eight components for overcoming those barriers, ending with
    flexibility, respect for initiative and tolerance for failure. The Nickless (2017) reading on Gilbert + Tobin and
    LegalVision, and the guest lecture by Shelley Simpson, supply the real examples for applied answers.
  source-note: >-
    Built from the Week 12 lecture slides (Leading an Innovative Culture), the Nickless (2017) reading on Gilbert +
    Tobin and LegalVision, the tutorial's guest-lecture discussion questions (used as short-answer prompts), and the
    lecture transcript of the guest lecture by Shelley Simpson (machine captions, paraphrased; used for examples only).
    The slides' closing notice about a Writing Task, and the end of the recording about assessment, belong to an earlier
    year's offering and were not used.
  notes: >
    ## Developing an innovative culture


    An **innovation culture** is where innovation and culture overlap. The slide's diagram joins the two circles and
    lists what the resulting innovation culture does:


    - shows organisation-wide commitment to the business and to innovation

    - experiments proactively

    - manages risk

    - can implement ideas quickly

    - produces and cultivates innovators


    :::definition

    **Innovation culture**: the overlap of innovation and culture, which shows organisation-wide commitment to the
    business and to innovation, experiments proactively, manages risk, can implement ideas quickly, and produces and
    cultivates innovators.

    :::


    ## What does the innovative culture look like?


    - **Commitment to innovation**: people care about work, co-workers, company; sustained organisation and improved
    workplace.

    - **Resistance to innovation**: lack of follow-through; lack of engagement.


    ## Experiment proactively


    - **Companies that do this**: challenge the status quo; think outside the box; take risks and try new things.

    - **Companies that don't do this**: "If it ain't broke, don't fix it." "We've always done it this way." "Customers
    like it this way."


    ## Innovative culture


    - **Culture that cultivates innovators**: managers allow ideas to be heard; innovators have space to develop and
    test; innovation is rewarded.

    - **Culture that doesn't produce innovators**: failure is discouraged or punished; employees are reluctant to bring
    up ideas; innovation is top-down.


    ## What is an innovative leader?


    - Passionate about the company.

    - Obsessed with restoring innovation.

    - Willing to take risks.

    - Can manage risks.

    - Can start projects quickly.


    ## Characteristics of an innovative leader


    Each characteristic of the innovation culture has a matching characteristic in the innovation leader:


    | Innovation culture | Innovation leader |

    | --- | --- |

    | Shows organisation-wide commitment to the business and to innovation | Passionate about innovation |

    | Experiments proactively | Willing to experiment |

    | Manages risk | Realistic and informed |

    | Can implement ideas quickly | Capable of rapid project execution |

    | Produces and cultivates innovators | Able to attract and nurture innovators |


    ## How to lead innovation


    The slide quotes Steve Jobs: "Innovation distinguishes between a leader and a follower." It sits beside a photograph
    of a Tesla car outside a Tesla store; the slide has no further text.


    ## Challenges faced while managing innovation


    1. **Why change?** Only innovation matters.

    2. **What to change?** Ranging from changes in product and service to the ways (i.e. process innovation).

    3. **Understanding innovation.** Understanding common problems associated with partial views of innovation.

    4. **Building an innovation culture.** Managing innovation is all about creating firm-specific routines (i.e.
    repeated, reinforced patterns of behaviour) which define its particular approach to the problem.

    5. **Continuous learning.** Firms constantly need to develop their routines to deal with the environmental
    challenges.

    6. **High involvement innovation.** A higher level of participation in innovation represents a competitive
    advantage.

    7. **Managing connections.** In the current scenario, business organisations are required to operate in relationship
    with others rather than in splendid isolation.


    ## Barriers to innovation


    - **External barriers**: market-related barrier; government and its policies; others (technical, societal and
    inter-organisational barriers).

    - **Internal barriers**: people related; structural; strategy related.


    ## Learning to manage innovation: how to overcome these barriers


    | Component | What it involves |

    | --- | --- |

    | Shared vision, leadership and the will to innovate | Clearly articulated and shared sense of purpose; stretching
    strategic intent; top management commitment |

    | Appropriate culture | Encouraging creativity; enabling learning and interaction; balancing between 'organic and
    mechanistic' |

    | Key individuals | Promoters, champions and other roles which facilitate innovation |

    | Effective team working | Use of teams at cross-functional and inter-organisational level; investment in team
    selection and building |

    | Continuing and stretching individual development | Education and training of employees to ensure a high level of
    skills and competence |

    | Extensive communication | Within and between the organisation and outside |

    | Creative climate | Positive approach to creative ideas, supported by relevant motivation systems |

    | Learning organisation | High level of involvement within and outside the firm in proactive experimentation;
    knowledge capture and dissemination |


    ## Conclusion


    Enterprises should emphasise:


    - planning and controlling systems with a high degree of flexibility;

    - respect for individual initiative and personal growth;

    - tolerance for mistakes and allowing room for failure.


    "Now lead on and be innovative!!"


    ## Reading: Tackling disruption (Nickless, 2017)


    A profile of Sam Nickless, chief operating officer of the law firm Gilbert + Tobin (G+T), written by Michelle
    Lindsay for *In the Black* (September 2017). Australia's prestigious law firms have been left reeling as
    cost-conscious clients and intensifying competition erode their margins. Low-cost outsourcers and a new generation
    of high-tech disruptors serve clients faster and at lower cost; AI and blockchain "smart contracts" could see work
    done without a trained lawyer. Some established firms are responding creatively, turning threats into opportunities,
    among them G+T.


    **Understanding the threat.** Nickless joined G+T in 2015 to future-proof the firm by tackling disruption head on,
    starting with a strategic review of the legal industry. NewLaw disruptors, including the local start-up LegalVision,
    focused on lower-value, higher-volume transactional work (preparing wills, reviewing loan documents, first-round
    document reviews in due diligence) done faster and cheaper by standard processes and digital automation. G+T's
    expertise was bespoke, high-value work (a major acquisition or divestment, a dispute, a regulatory issue). But G+T
    believed disruption would tend to move up the market from the lower-value work towards the higher value, where the
    bulk of its business lay: simple document review could turn into running the A$5 million bolt-on acquisition.


    **An innovative solution.** Nickless wanted to minimise the impact while gaining exposure to the low-value but
    high-growth activities, and the ability to learn from the disruption as it came into G+T's part of the market. The
    possible responses: changing G+T's business model, retreating into a specialist niche, developing new online
    platforms to automate simple activities, outsourcing (perhaps taking advantage of lower labour costs overseas), or
    partnering with a disruptor. G+T considered launching its own version, but getting the incentives right to motivate
    people and create the right culture would be very hard when co-existing with a more traditional legal model. Instead
    it bought a 20 per cent stake in LegalVision for about A$4 million.


    **Choosing and checking the partner.** LegalVision's business model resembled a software start-up, but its aim was
    like any law firm's: quality legal advice. It served the underserviced small-to-medium enterprise (SME) market and
    was growing at around 5 or 6 per cent a month, against a relatively flat traditional market. Other start-ups lacked
    its momentum, and some were marketplaces that referred clients out with no quality control; LegalVision owns its
    customer experience end to end. In due diligence Nickless used mystery shoppers and asked G+T's top lawyers to
    review the work; LegalVision passed, and the partners got excited.


    **Working with the disruptor.** The partnership gives G+T access to a market it could not previously service
    economically, lets it offer lower-value services more cost-effectively to existing clients, and has produced
    combined G+T and LegalVision solutions; sometimes G+T takes a smaller share of the work, because holding it all
    would be uneconomic and the client would have no solution. Nickless thinks disruption of law is only just getting
    started. (In a sidebar he names Clayton Christensen's work on disruption and the dilemma for innovators as still
    highly relevant.)


    ## Guest lecture: Shelley Simpson


    Shelley Simpson, founder and creative director of a handmade porcelain company, told her story; the notes below
    paraphrase the recording.


    - **Starting out.** She came to clay in her late twenties as a hobby (a housemate's kick wheel), after acting and
    singing, and started the business with a partner and very little money. She had never done a course in ceramics,
    design or business, so "every single thing" she touched was a point of growth and innovation for her personally.

    - **Experimenting.** Early on she tried everything (mugs, personalised dog bowls, painted planters, third-party
    manufacturing for bigger brands) while looking for something of her own. At trade shows, rather than put product on
    a table, she created a creative, whimsical environment people couldn't help but come to. Her porcelain is glazed on
    the inside only, with pigment in the clay itself, something she learned to do because she didn't know she shouldn't.

    - **Growth and learning.** Growth of about 30 per cent a year, from a team of two to about 100 people; her own
    development had to grow with it (logistics, packaging, freight, compliance). Compliance, such as duties and taxes in
    each market, was one of her biggest hurdles: the dry things are the hardest in a creative business.

    - **Connections and control.** Relationships (a cookbook cover featuring her bowl brought calls from around the
    world), her own retail stores (control of distribution and of the narrative), collaborations with other creatives
    and with Aboriginal artists in Central Australia, and word of mouth instead of big advertising budgets.

    - **Managing risk.** Be careful of outside investors and know your exit clauses; set boundaries with slow-paying
    wholesale accounts; the business is debt-free; be careful not to expand too quickly. The team is expected to "lean
    in", and is rewarded for it.


    ## Tutorial: guest lecturer discussion


    1. What were the key lessons you learned from the guest lecturer?

    2. How can you use the key take-aways in your career?

    3. What were the key components of the company's success?

    4. What role did innovation or creativity play?

    5. Can this success be replicated?


    :::examtip

    For an applied answer, define the framework from the slides, give a real example from the reading or the guest
    lecture, apply the framework to the scenario, and finish with a limit or trade-off.

    :::
