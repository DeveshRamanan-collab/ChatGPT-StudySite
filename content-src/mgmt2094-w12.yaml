    body: >-
      An **innovation culture** is where innovation and culture overlap. The slides list five characteristics. An
      innovation culture:


      1. shows organisation-wide commitment to the business and to innovation;

      2. experiments proactively;

      3. manages risk;

      4. can implement ideas quickly;

      5. produces and cultivates innovators.


      **What it looks like.** Commitment to innovation: people care about work, co-workers and company, giving a
      sustained organisation and an improved workplace. Resistance to innovation shows as lack of follow-through and
      lack of engagement.


      **Experimenting proactively.** Companies that do it challenge the status quo, think outside the box, and take
      risks and try new things. Companies that don't say "If it ain't broke, don't fix it", "We've always done it this
      way" or "Customers like it this way".


      **Cultivating innovators.** Managers allow ideas to be heard, innovators have space to develop and test, and
      innovation is rewarded. A culture that doesn't produce innovators discourages or punishes failure, leaves
      employees reluctant to bring up ideas, and keeps innovation top-down.


      Example: Shelley Simpson's team is expected to "lean in": people who ask questions and put themselves forward are
      rewarded. Gilbert + Tobin judged that the right culture for a low-cost offshoot would be very hard to create
      beside its traditional legal model.


      Exam use: name the characteristic, then point to the behaviour in the scenario that shows commitment or
      resistance.
