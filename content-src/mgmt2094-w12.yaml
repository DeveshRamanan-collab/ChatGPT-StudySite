questions:
  - key: q101
    type: mcq
    concept: innovation-culture
    difficulty: 1
    set: pretest
    stem: Which of these is one of the five characteristics of an innovation culture on the Week 12 slides?
    options:
      - text: It experiments proactively.
        correct: true
        why: >-
          Correct: "experiments proactively" is the second of the five characteristics the slide lists under innovation
          culture.
      - text: It keeps innovation inside a dedicated research department.
        why: >-
          Tempting because many firms do run research units, but the slides want organisation-wide commitment, not
          innovation fenced off in one department.
      - text: It waits until competitors have proven an idea in the market.
        why: >-
          Tempting because it sounds like prudent risk management, but the slides pair managing risk with experimenting
          proactively, not waiting for rivals to go first.
      - text: It rewards loyalty to the established products and processes.
        why: >-
          Tempting because loyalty sounds like commitment, but loyalty to the status quo is what the slides call "we've
          always done it this way", a sign of not experimenting.
  - key: q102
    type: mcq
    concept: innovation-culture
    difficulty: 1
    stem: According to the slides, an innovation culture is best described as…
    options:
      - text: the overlap of innovation and culture, showing organisation-wide commitment to the business and to innovation
        correct: true
        why: >-
          Correct: the slide draws innovation and culture as overlapping circles, and the first thing the innovation
          culture shows is organisation-wide commitment.
      - text: >-
          a culture in which a small creative team is protected from the day-to-day pressures of the rest of the
          business
        why: >-
          Tempting because protected teams are a common tactic, but the slide stresses organisation-wide commitment, not
          a creative enclave.
      - text: a set of rules telling employees exactly how new products must be developed
        why: >-
          Tempting because the week does talk about routines, but a rulebook is not how the slide defines an innovation
          culture; it lists five characteristics instead.
      - text: the personality of the chief executive, copied by every manager below them
        why: >-
          Tempting because leaders shape culture, but the slides separate the culture's five characteristics from the
          leader's matching traits.
  - key: q103
    type: mcq
    concept: innovation-culture
    difficulty: 1
    stem: Which statement would the slides treat as a sign of a company that does NOT experiment proactively?
    options:
      - text: "\"We've always done it this way.\""
        correct: true
        why: >-
          Correct: it is one of the three quoted statements the slide gives for companies that don't experiment
          proactively.
      - text: "\"Let's challenge the status quo on how we price this service.\""
        why: >-
          Tempting because it is a quoted remark, but challenging the status quo is what companies that DO experiment
          proactively are said to do.
      - text: "\"Take the risk and try the new design with a few customers.\""
        why: >-
          Tempting because risk can sound like a warning, but taking risks and trying new things is listed for companies
          that experiment proactively.
      - text: "\"Think outside the box before we settle on next year's range.\""
        why: >-
          Tempting because it is phrased like an instruction from above, but thinking outside the box is listed as what
          proactive experimenters do.
  - key: q104
    type: mcq
    concept: innovation-culture
    difficulty: 1
    stem: The slides list two signs of resistance to innovation. What are they?
    options:
      - text: Lack of follow-through and lack of engagement.
        correct: true
        why: >-
          Correct: under "What does the innovative culture look like?", resistance to innovation is lack of
          follow-through and lack of engagement.
      - text: Lack of funding and lack of new technology.
        why: >-
          Tempting because money and technology are common obstacles, but the slide describes resistance through
          people's behaviour, not resources.
      - text: Too many ideas and too little management control.
        why: >-
          Tempting because idea overload is a real complaint, but the slide's signs of resistance are about failing to
          follow through and disengaging.
      - text: High staff turnover and low customer satisfaction.
        why: >-
          Tempting because both can follow from a poor culture, but neither is one of the two signs of resistance the
          slide actually lists.
  - key: q105
    type: mcq
    concept: innovation-culture
    difficulty: 1
    stem: Which is a feature of a culture that cultivates innovators, according to the slides?
    options:
      - text: Innovators have space to develop and test their ideas.
        correct: true
        why: >-
          Correct: the slide lists three features: managers allow ideas to be heard, innovators have space to develop
          and test, and innovation is rewarded.
      - text: Ideas are approved only after senior management proposes them.
        why: >-
          Tempting because approval sounds orderly, but innovation that starts only at the top is what the slide calls
          "innovation is top-down", a sign of a culture that doesn't produce innovators.
      - text: Failure is recorded so that it can be discouraged next time.
        why: >-
          Tempting because learning from failure sounds sensible, but discouraging or punishing failure is listed for a
          culture that doesn't produce innovators.
      - text: Employees wait to be asked before raising an idea.
        why: >-
          Tempting because it sounds polite and orderly, but employees reluctant to bring up ideas is a sign of a
          culture that doesn't produce innovators.
  - key: q106
    type: mcq
    concept: innovation-culture
    difficulty: 2
    stem: Which of these is NOT one of the five characteristics of an innovation culture?
    options:
      - text: Manages risk.
        why: >-
          Tempting to pick because risk sounds like the enemy of innovation, but "manages risk" is the third
          characteristic on the slide.
      - text: Can implement ideas quickly.
        why: >-
          Tempting to pick because speed can look reckless, but implementing ideas quickly is the fourth characteristic
          the slide lists.
      - text: Eliminates risk before any new idea is tested.
        correct: true
        why: >-
          Correct: the slides say an innovation culture manages risk, not that it eliminates it; proactive experimenters
          take risks and try new things.
      - text: Produces and cultivates innovators.
        why: >-
          Tempting to pick because it sounds like a leader's job, but producing and cultivating innovators is the fifth
          characteristic of the culture itself.
  - key: q107
    type: mcq
    concept: innovation-culture
    difficulty: 2
    stem: >-
      The slides describe commitment to innovation as people caring about their work, co-workers and company. What
      outcome does the slide attach to it?
    options:
      - text: A larger research budget and more patents filed each year.
        why: >-
          Tempting because both are common innovation measures, but the slide attaches no budget or patent outcome to
          commitment.
      - text: A sustained organisation and an improved workplace.
        correct: true
        why: >-
          Correct: the slide pairs "people care about work, co-workers, company" with "sustained organisation and
          improved workplace".
      - text: Faster promotion for the staff who propose new ideas.
        why: >-
          Tempting because rewarding innovation is on another slide, but promotion is not the outcome the slide gives
