  - key: q108
    type: mcq
    concept: innovation-culture
    difficulty: 2
    stem: >-
      At a retailer, store staff suggest several ways to cut queue times, but nothing happens after the meetings and
      staff stop coming. Which sign on the slides does this show?
    options:
      - text: "Resistance to innovation: lack of follow-through, then lack of engagement."
        correct: true
        why: >-
          Correct: ideas are raised but not acted on (lack of follow-through), and staff then disengage (lack of
          engagement), the two signs of resistance.
      - text: "Commitment to innovation: staff clearly care about their work and co-workers."
        why: >-
          Tempting because the staff did care at first, but the organisation's failure to act and the drop-off in
          attendance are the signs of resistance.
      - text: "Proactive experimentation: the firm is testing which of the staff ideas are valued."
        why: >-
          Tempting because meetings can look like testing, but nothing is tried; proactive experimenters take risks and
          try new things.
      - text: "Cultivating innovators: managers are letting ideas be heard in regular meetings."
        why: >-
          Tempting because ideas were heard, but hearing ideas without acting on them ends in disengagement, which the
          slide treats as resistance.
  - key: q109
    type: mcq
    concept: innovation-culture
    difficulty: 2
    stem: >-
      A manager tells a team member: "Customers like it this way, so leave the menu alone." Which characteristic of an
      innovation culture is missing?
    options:
      - text: Experimenting proactively.
        correct: true
        why: >-
          Correct: "Customers like it this way" is one of the slide's quoted signs of a company that doesn't experiment
          proactively.
      - text: Implementing ideas quickly once the board approves them.
        why: >-
          Tempting because the idea is not implemented, but the manager's reason is a refusal to try anything new, not
          slowness in executing an approved idea.
      - text: Organisation-wide commitment to the business and its customers.
        why: >-
          Tempting because the manager mentions customers, but caring about customers this way protects the status quo;
          the missing piece is experimentation.
      - text: Managing risk through careful review of each new menu item.
        why: >-
          Tempting because leaving things alone looks like caution, but managing risk does not mean refusing to try;
          that refusal is a failure to experiment.
  - key: q110
    type: mcq
    concept: innovation-culture
    difficulty: 2
    stem: >-
      A software firm gives engineers time to build and test prototypes of their own ideas, and pays a bonus when one is
