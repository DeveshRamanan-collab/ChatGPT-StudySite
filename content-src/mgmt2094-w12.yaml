          proactively, managing risk, implementing ideas quickly, and producing and cultivating innovators.
        correct: true
        why: >-
          Correct: creative climate and key individuals come from "learning to manage innovation"; the innovation
          culture slide lists five different characteristics.
      - text: >-
          They are two of the seven challenges of managing innovation; the five characteristics are the external and
          internal barriers.
        why: >-
          Tempting because the week has several lists, but neither item is a challenge, and barriers are obstacles, not
          characteristics of a culture.
      - text: >-
          They are traits of the innovative leader; the culture's characteristics are passion, willingness to experiment
          and rapid project execution.
        why: >-
          Tempting because the leader column mirrors the culture, but passion and rapid execution are the leader's
          traits, and the two terms belong to overcoming barriers.
  - key: q113
    type: mcq
    concept: innovation-culture
    difficulty: 3
    stem: Why can "manages risk" sit beside "experiments proactively" in the same list of characteristics?
    options:
      - text: The culture takes risks and tries new things, but manages those risks rather than ignoring them.
        correct: true
        why: >-
          Correct: proactive experimenters "take risks and try new things", and the culture also manages risk, as its
          leader is willing to take risks and can manage them.
      - text: Managing risk means not experimenting until competitors have shown an idea works.
        why: >-
          Tempting because it sounds prudent, but waiting for rivals contradicts proactive experimentation; managing
          risk is how the culture experiments safely.
      - text: Experiments are run by a separate unit, so the rest of the firm carries no risk at all from any of them.
        why: >-
          Tempting because some firms do ring-fence experiments, but the slides ask for organisation-wide commitment,
