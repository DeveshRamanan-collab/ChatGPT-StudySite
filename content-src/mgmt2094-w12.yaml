      - text: "Resistance: lack of follow-through has produced a lack of engagement."
        correct: true
        why: >-
          Correct: the unresourced trial is lack of follow-through, and the drop in ideas is lack of engagement, the two
          signs of resistance.
      - text: Managing risk, because untested checklists should never receive resources.
        why: >-
