  - key: q211
    type: mcq
    concept: innovative-leader
    difficulty: 2
    tags:
      - guest-lecture
    stem: >-
      Shelley Simpson says that early on she "didn't say no": she made mugs, personalised dog bowls and painted planters
      while looking for something of her own. Which leader trait does this show most directly?
    options:
      - text: Willing to experiment.
        correct: true
        why: >-
          Correct: trying many products to find her own direction is willingness to experiment, matching the culture's
          proactive experimenting.
      - text: Realistic and informed about each market before entering it.
        why: >-
          Tempting because she later researched markets, but the early phase was trial and error, not informed market
          entry.
      - text: Able to attract and nurture other innovators into the team.
        why: >-
          Tempting because she later built a team, but this early period is about her own experiments, not nurturing
          others.
  - key: q212
    type: mcq
    concept: innovative-leader
    difficulty: 3
    tags:
      - guest-lecture
    stem: >-
      Shelley Simpson warns students to be careful of outside investors and to know their exit clauses, and says her
      company is careful not to expand too quickly. Which leader trait does this show?
    options:
      - text: "Can manage risks: she is willing to take them, but realistically and with care."
        correct: true
        why: >-
          Correct: being wary of investors and of over-expansion is managing risk, the "realistic and informed" side of
          the innovative leader.
      - text: Can start projects quickly, whatever the financial cost to the business or its people.
        why: Tempting because she opened stores fast, but this advice is about restraint, not speed regardless of cost.
      - text: Obsessed with restoring innovation, so growth always comes first.
        why: Tempting because she is driven, but the advice deliberately puts careful growth ahead of growth at any price.
  - key: q213
    type: mcq
    concept: innovative-leader
    difficulty: 2
    stem: What point does the slide make by quoting Steve Jobs under "How to lead innovation"?
    options:
      - text: That leaders should copy successful products quickly before rivals do.
        why: >-
          Tempting because speed matters to innovative leaders, but copying is what a follower does; the quote says
          innovation marks out the leader.
      - text: That innovation is a technical task best left to engineers.
        why: >-
          Tempting because Jobs ran a technology company, but the quote is about leadership: innovation separates
          leaders from followers.
      - text: That innovation is what distinguishes a leader from a follower.
        correct: true
        why: >-
          Correct: the quote reads "Innovation distinguishes between a leader and a follower", introducing how to lead
          innovation.
  - key: q214
    type: mcq
    concept: innovative-leader
    difficulty: 3
    stem: >-
      A manager is passionate about innovation and willing to experiment, but every project stalls for a year before it
      launches. Against the slides, which leader trait is weakest?
    options:
      - text: Capable of rapid project execution.
        correct: true
        why: >-
          Correct: passion and experimentation are present; what is missing is the trait matched to "can implement ideas
          quickly".
      - text: Realistic and informed.
        why: >-
          Tempting because delays can come from over-analysis, but the scenario's clear failure is slow execution, not
          poor information.
      - text: Able to attract and nurture innovators.
        why: >-
          Tempting because slow projects can frustrate staff, but the scenario says nothing about people leaving; the
          gap is execution speed.
  - key: q215
    type: mcq
    concept: innovative-leader
    difficulty: 3
    variant-of: q214
    stem: >-
      A founder launches projects fast and loves new ideas, but staff with ideas leave because she takes over every
      project herself. Which leader trait is weakest?
    options:
      - text: Passionate about innovation.
        why: >-
          Tempting because her passion causes the takeovers, but she clearly has passion; the gap is in growing other
          innovators.
      - text: Capable of rapid project execution.
        why: Tempting because she runs everything herself, but her projects launch fast; execution is not the weak trait.
      - text: Able to attract and nurture innovators.
        correct: true
        why: >-
          Correct: staff with ideas leave because she takes over, so she fails to nurture innovators, the leader match
          for "produces and cultivates innovators".
  - key: q216
    type: mcq
    concept: innovative-leader
    difficulty: 4
    contrasts-with:
      - innovation-culture
    stem: >-
      An answer says: "The firm has an innovation culture because its CEO is willing to experiment." What is the best
      criticism using the slides?
    options:
      - text: >-
          Willing to experiment is a leader trait; the matching culture trait is experimenting proactively across the
          organisation, so the answer needs evidence beyond the CEO.
        correct: true
        why: >-
          Correct: the slides separate the leader's traits from the culture's, so one person's willingness does not show
          organisation-wide experimentation.
      - text: Willing to experiment is a barrier to innovation, so it cannot be evidence of an innovation culture.
        why: >-
          Tempting because experiments carry risk, but willingness to experiment is a leader trait on the slides, never
          a barrier.
      - text: "The answer is right as written: a leader's trait automatically proves the matching culture trait."
        why: >-
          Tempting because the slide draws arrows between the columns, but the arrows match traits; they do not make one
          prove the other.
  - key: q217
    type: truefalse
    set: quickfire
    concept: innovative-leader
    difficulty: 1
    statement: On the slides, "realistic and informed" is the leader trait that matches the culture trait "manages risk".
    answer: true
    why: >-
      True: the characteristics slide maps manages risk to realistic and informed, as experiments proactively maps to
      willing to experiment.
  - key: q218
    type: truefalse
    set: quickfire
    concept: innovative-leader
    difficulty: 1
    statement: The slides list "obsessed with restoring innovation" as a trait of an innovative leader.
    answer: true
    why: >-
      True: it is the second item on "What is an innovative leader?", after "passionate about the company" and before
      "willing to take risks".
  - key: q219
    type: truefalse
    set: quickfire
    concept: innovative-leader
    difficulty: 1
    statement: The "How to lead innovation" slide quotes Elon Musk.
    answer: false
    why: >-
      False: the quote, "Innovation distinguishes between a leader and a follower", is attributed to Steve Jobs; the
      Tesla photograph beside it carries no quote.
  - key: q220
    type: short
    concept: innovative-leader
    difficulty: 3
    prompt: >-
      "Innovative leaders are risk-takers above all." Respond to this statement in a short applied essay, using the
      slides' characteristics of an innovative leader and the guest lecture by Shelley Simpson. (Tutorial: What were the
      key lessons you learned from the guest lecturer?)
    model: >-
      The statement is half right. The slides make an innovative leader willing to take risks, but in the same list able
      to manage risks, alongside being passionate about the company, obsessed with restoring innovation and able to
      start projects quickly. The characteristics slide pairs the culture's "manages risk" with a leader who is
      realistic and informed. Shelley Simpson shows both sides. She took risks: she tried mugs, dog bowls and planters
      before finding her own range, and opened a store in New York, later London and Los Angeles. Yet she is careful
      about risk: wary of outside investors, conscious of exit clauses, debt-free and careful not to expand too quickly.
      She also attracts and nurtures innovators, expecting staff to "lean in" and rewarding them. The lesson from her
      lecture is that risk-taking works when it is informed and paired with execution and people; without that balance,
      experiments become gambles. One limit: hers is a single success story told by the founder, so it cannot show which
      trait mattered most. Innovative leaders take risks, but not above all else.
    rubric:
      - id: r1
        criterion: "Concept: states the innovative leader traits and their culture matches."
        marks: 2
        top-band: Lists the leader traits and pairs each with its culture trait in the slides' words.
        margin-note: Which culture trait does each leader trait mirror?
        authorities:
          - mgmt2094-example-steve-jobs
      - id: r2
        criterion: "Example: uses specific facts from the guest lecture."
        marks: 2
        top-band: Cites concrete details (early experiments, store openings, wariness of investors, "lean in") accurately.
        margin-note: Ground each trait in something she actually said.
        authorities:
          - mgmt2094-example-guest-shelley-simpson
      - id: r3
        criterion: "Application: matches each fact to a named trait."
        marks: 3
        top-band: Shows risk-taking and risk management with evidence, and at least one other trait.
        margin-note: Name the trait, then the evidence.
        authorities: []
      - id: r4
        criterion: "Evaluation: takes and defends a position on the statement."
        marks: 3
        top-band: >-
          Opens with a clear position, explains how the traits work together and notes the limits of one founder's
          story.
        margin-note: Above all? What does the risk-management trait add?
        authorities: []
  - key: q301
    type: mcq
    concept: challenges-managing-innovation
    difficulty: 1
    set: pretest
    stem: Which of these is one of the seven challenges faced while managing innovation on the slides?
    options:
      - text: Reducing headcount to fund new research.
        why: >-
          Tempting because funding innovation is a real worry, but cutting staff is not among the seven challenges the
          slides list.
      - text: Managing connections.
        correct: true
        why: >-
          Correct: managing connections is challenge 7: organisations must operate in relationship with others rather
          than in splendid isolation.
      - text: Shielding the firm from all outside partners.
        why: >-
          Tempting because secrecy can protect ideas, but it is the opposite of challenge 7, which asks firms to work in
          relationship with others.
      - text: Copying competitors' products quickly.
        why: >-
          Tempting because speed matters, but copying rivals is not a challenge on the slide; the list begins with why
          change and what to change.
  - key: q302
    type: mcq
    concept: challenges-managing-innovation
    difficulty: 1
    stem: Under the challenge "Why change?", what do the slides say?
    options:
      - text: Change only after customers start to complain.
        why: "Tempting because complaints often trigger change, but the slide's answer is blunter: only innovation matters."
      - text: Change only once the competition has moved first.
        why: >-
          Tempting because following rivals feels safe, but the slide does not make change wait on competitors; it says
          only innovation matters.
      - text: Only innovation matters.
        correct: true
        why: "Correct: the slide answers challenge 1, \"Why change?\", with the single line \"Only innovation matters\"."
  - key: q303
    type: mcq
    concept: challenges-managing-innovation
    difficulty: 1
    stem: What does the challenge "What to change?" cover on the slides?
    options:
      - text: Changes ranging from product and service to the ways things are done, i.e. process innovation.
        correct: true
        why: >-
          Correct: the slide says what to change ranges from changes in product and service to the ways (process
          innovation).
      - text: Only changes to the physical product, because services and internal processes cannot really be innovated.
        why: >-
          Tempting because products are the most visible change, but the slide includes services and process innovation
          too.
      - text: Only changes to price and promotion, which are the main marketing levers.
        why: >-
          Tempting in a marketing unit, but the slide frames what to change as product, service and process, not the
          marketing mix.
  - key: q304
    type: mcq
    concept: challenges-managing-innovation
    difficulty: 2
    stem: >-
      The slides say managing innovation is all about creating firm-specific routines. How do the slides define a
      routine?
    options:
      - text: A repeated, reinforced pattern of behaviour.
        correct: true
        why: >-
          Correct: under building an innovation culture, routines are "repeated, reinforced patterns of behaviour" that
          define the firm's approach.
      - text: A written policy approved by the board each year.
        why: >-
          Tempting because policies feel routine, but the slide defines routines as patterns of behaviour, not
          documents.
      - text: A one-off project plan for a new product.
        why: >-
          Tempting because plans organise innovation, but a one-off plan is not repeated or reinforced, which is the
          heart of the definition.
      - text: A software tool that collects staff ideas.
        why: >-
          Tempting because idea tools are common, but the slide's routines are how people behave, repeated and
          reinforced over time.
  - key: q305
    type: mcq
    concept: challenges-managing-innovation
    difficulty: 1
    stem: >-
      Which challenge do the slides describe as "understanding common problems associated with partial views of
      innovation"?
    options:
      - text: Building an innovation culture.
        why: Tempting because culture shapes how innovation is seen, but challenge 4 is about firm-specific routines.
      - text: Understanding innovation.
        correct: true
        why: >-
          Correct: challenge 3, understanding innovation, is about the common problems that come from partial views of
          innovation.
      - text: High involvement innovation.
        why: >-
          Tempting because partial views may involve too few people, but challenge 6 is about participation as a
          competitive advantage.
      - text: Why change?
        why: >-
          Tempting because a partial view might ask why bother, but challenge 1 is answered simply: only innovation
          matters.
  - key: q306
    type: mcq
    concept: challenges-managing-innovation
    difficulty: 2
    stem: According to the slides, what does "high involvement innovation" mean?
    options:
      - text: A higher level of participation in innovation represents a competitive advantage.
        correct: true
        why: "Correct: challenge 6 says a higher level of participation in innovation represents a competitive advantage."
      - text: Senior managers become highly involved, so other staff need not be.
        why: >-
          Tempting because leadership matters this week, but high involvement means wider participation, not
          concentration at the top.
      - text: Customers decide everything, so staff ideas are no longer needed.
        why: >-
          Tempting because customers do shape innovation, but the slide is about a higher level of participation, not
          handing all decisions over.
      - text: A small, highly skilled team handles all of the innovation for the whole of the firm.
        why: >-
          Tempting because expert teams can be effective, but a small team is the opposite of the higher participation
          the slide describes.
  - key: q307
    type: mcq
    concept: challenges-managing-innovation
    difficulty: 2
    stem: Which challenge says firms constantly need to develop their routines to deal with environmental challenges?
    options:
      - text: Managing connections.
        why: >-
          Tempting because the environment includes other organisations, but challenge 7 is about relationships, not
          developing routines.
      - text: Building an innovation culture.
        why: >-
          Tempting because challenge 4 creates the routines, but constantly developing them for environmental challenges
          is challenge 5.
      - text: Continuous learning.
        correct: true
        why: >-
          Correct: challenge 5, continuous learning, says firms constantly need to develop their routines to deal with
          environmental challenges.
      - text: What to change?
        why: >-
          Tempting because developing routines is a change, but challenge 2 is about the range from product and service
          to process.
  - key: q308
    type: mcq
    concept: challenges-managing-innovation
    difficulty: 2
    stem: What does "managing connections" ask of business organisations, according to the slides?
    options:
      - text: To keep innovation secret from partners so that rivals cannot copy it.
        why: >-
          Tempting because secrecy protects ideas, but the slide asks firms to operate in relationship with others, the
          opposite of secrecy.
      - text: To operate in relationship with others rather than in splendid isolation.
        correct: true
        why: >-
          Correct: the slide says that in the current scenario organisations are required to operate in relationship
          with others, not in splendid isolation.
      - text: To connect every department to one central innovation office.
        why: >-
          Tempting because internal links matter, but the slide's connections are relationships with others outside the
          firm.
  - key: q309
    type: mcq
    concept: challenges-managing-innovation
    difficulty: 2
    tags:
      - reading
    stem: >-
      G+T partnered with LegalVision instead of building its own low-cost practice alone. Which challenge of managing
      innovation does this decision most directly address?
    options:
      - text: What to change, because G+T replaced its main service.
        why: >-
          Tempting because G+T did enter new work, but its main bespoke work continued; the decision is about working
          with another firm.
      - text: Managing connections.
        correct: true
        why: >-
          Correct: partnering with a disruptor is operating in relationship with others rather than in splendid
          isolation.
      - text: High involvement innovation, because more G+T staff took part.
        why: >-
          Tempting because partners got excited, but the reading's point is the relationship with LegalVision, not wider
          participation inside G+T.
  - key: q310
    type: mcq
    concept: challenges-managing-innovation
    difficulty: 2
    tags:
      - guest-lecture
    stem: >-
      Shelley Simpson says that as her business grew she had to learn logistics, packaging and freight, and her personal
      development had to grow with it. Which challenge does this illustrate?
    options:
      - text: Why change? Only innovation matters.
        why: >-
          Tempting because she innovated constantly, but the point here is ongoing learning to meet new demands, not why
          to change.
      - text: Understanding innovation through partial views.
        why: >-
          Tempting because she started with little knowledge, but challenge 3 is about problems with partial views, not
          learning new tasks.
      - text: Continuous learning.
        correct: true
        why: >-
          Correct: developing new routines (logistics, freight, packaging) to meet the challenges of a growing business
          is continuous learning.
  - key: q311
    type: mcq
    concept: challenges-managing-innovation
    difficulty: 3
    stem: >-
      A manufacturer keeps producing good ideas, but every department solves new problems in its own ad hoc way and
      nothing is repeated. Which challenge is the firm failing most clearly?
    options:
      - text: Managing connections, because it works with far too many outside partners and suppliers at once, all the time.
        why: >-
          Tempting because coordination is weak, but the scenario says nothing about outside partners; the problem is
          inside the firm.
      - text: "Building an innovation culture: it has no firm-specific routines (repeated, reinforced patterns of behaviour)."
        correct: true
        why: >-
          Correct: ad hoc, unrepeated responses are the absence of the firm-specific routines that challenge 4 says
          managing innovation is all about.
      - text: Why change?, because the firm does not believe innovation matters.
        why: >-
          Tempting because results are poor, but the firm clearly values ideas; what it lacks is repeated, reinforced
          ways of handling them.
  - key: q312
    type: mcq
    concept: challenges-managing-innovation
    difficulty: 3
    stem: >-
      A manager asks whether her firm should change its products, its services, or the way it does things. Which
      challenge is she working through?
    options:
      - text: Why change?
        why: >-
          Tempting because she is thinking about change, but she has already accepted change; she is choosing what to
          change.
      - text: What to change?
        correct: true
        why: >-
          Correct: challenge 2 asks what to change, ranging from product and service to the ways things are done
          (process innovation).
      - text: Managing connections.
        why: >-
          Tempting because process changes can involve partners, but the question she asks is about the scope of change,
          not relationships.
      - text: Continuous learning.
        why: >-
          Tempting because she is learning about options, but challenge 5 is about developing routines over time for
          environmental challenges.
  - key: q313
    type: mcq
    concept: challenges-managing-innovation
    difficulty: 3
    contrasts-with:
      - barriers-to-innovation
    stem: >-
      Which of these is a challenge of managing innovation rather than a barrier to innovation, as the slides organise
      them?
    options:
      - text: Government and its policies.
        why: >-
          Tempting because government can be a challenge in everyday speech, but the slides list it as an external
          barrier.
      - text: Strategy-related barriers.
        why: >-
          Tempting because strategy is a management task, but the slides list strategy-related barriers among the
          internal barriers.
      - text: High involvement innovation.
        correct: true
        why: "Correct: high involvement innovation is challenge 6 of the seven challenges; the other options are barriers."
      - text: Market-related barriers.
        why: >-
          Tempting because markets do challenge firms, but the slides file market-related barriers under external
          barriers.
  - key: q314
    type: mcq
    concept: challenges-managing-innovation
    difficulty: 3
    stem: How are challenge 4 (building an innovation culture) and challenge 5 (continuous learning) linked on the slides?
    options:
      - text: >-
          Both concern routines: challenge 4 creates firm-specific routines, and challenge 5 keeps developing them as
          the environment changes.
        correct: true
        why: >-
          Correct: challenge 4 defines managing innovation as creating routines, and challenge 5 says firms constantly
          need to develop those routines.
      - text: "Both concern partners: challenge 4 chooses them and challenge 5 trains them in the firm's methods."
        why: Tempting because learning can involve partners, but partners belong to challenge 7, managing connections.
      - text: "They are not linked: one concerns products and the other concerns government policy."
        why: Tempting if you mix up the lists, but neither challenge is about products or policy; both turn on routines.
  - key: q315
    type: mcq
    concept: challenges-managing-innovation
    difficulty: 2
    stem: Why do the slides say a higher level of participation in innovation matters?
    options:
      - text: It removes the need for innovative leaders.
        why: >-
          Tempting because wide participation spreads responsibility, but the week still gives leaders a central role;
          the slide's reason is competitive advantage.
      - text: It represents a competitive advantage.
        correct: true
        why: "Correct: challenge 6 says a higher level of participation in innovation represents a competitive advantage."
      - text: It keeps costs down by replacing staff training.
        why: >-
          Tempting because participation can be cheap, but the slide makes no cost claim, and training appears as a way
          of overcoming barriers.
  - key: q316
    type: mcq
    concept: challenges-managing-innovation
    difficulty: 4
    variant-of: q309
    stem: >-
      A regional winery shares its fermentation data with a university and two growers so that all of them can test new
      methods together. Which challenge of managing innovation is it handling?
    options:
      - text: Why change?
        why: >-
          Tempting because the winery is changing methods, but the defining feature is working with outside partners,
          not deciding whether to change.
      - text: Managing connections.
        correct: true
        why: >-
          Correct: working with a university and growers is operating in relationship with others rather than in
          splendid isolation.
      - text: What to change?
        why: >-
          Tempting because new methods are process changes, but the scenario's focus is the shared testing with outside
          organisations.
      - text: Understanding innovation.
        why: >-
          Tempting because the partners are building knowledge, but challenge 3 concerns problems with partial views of
          innovation.
  - key: q317
    type: truefalse
    set: quickfire
    concept: challenges-managing-innovation
    difficulty: 1
    statement: The slides answer the first challenge, "Why change?", with "Only innovation matters".
    answer: true
    why: "True: challenge 1 is \"Why change?\" and its one-line gloss on the slide is \"Only innovation matters\"."
  - key: q318
    type: truefalse
    set: quickfire
    concept: challenges-managing-innovation
    difficulty: 1
    statement: On the slides, "What to change?" is limited to changes in products.
    answer: false
    why: >-
      False: the slide says what to change ranges from changes in product and service to the ways things are done, i.e.
      process innovation.
  - key: q319
    type: truefalse
    set: quickfire
    concept: challenges-managing-innovation
    difficulty: 1
    statement: >-
      The slides say business organisations must now operate in relationship with others rather than in splendid
      isolation.
    answer: true
    why: "True: that is challenge 7, managing connections, which the slide frames as a requirement of the current scenario."
  - key: q320
    type: short
    concept: challenges-managing-innovation
    difficulty: 3
    prompt: >-
      "For a creative business, innovation is a product question." Respond to this statement in a short applied essay,
      using the seven challenges of managing innovation and the guest lecture by Shelley Simpson. (Tutorial: What role
      did innovation or creativity play?)
    model: >-
      The statement is too narrow. The slides list seven challenges of managing innovation, and the second, what to
      change, ranges from product and service to the ways things are done (process innovation). Shelley Simpson's
      business shows innovation well beyond the product. The product was innovative (glazing only the inside, with
      pigment in the porcelain itself), but so were her ways of working: staged trade-show spaces, her own stores to
      control distribution and the story, and online selling. Other challenges mattered as much. Continuous learning was
      constant: as the firm grew about 30 per cent a year she had to learn logistics, packaging, freight and compliance.
      Managing connections drove growth: a cookbook cover, collaborations with other creatives and with Aboriginal
      artists, and close work with architects and interior designers. Because she had no training in ceramics, design or
      business, she says every step was a point of growth and innovation for her. Product mattered, but creativity in
      process, learning and connections is what turned a product into a business.
    rubric:
      - id: r1
        criterion: "Concept: states the seven challenges accurately."
        marks: 2
        top-band: Names the challenges in the slides' words, including the product-to-process range of "what to change?".
        margin-note: Which of the seven are you using?
        authorities: []
      - id: r2
        criterion: "Example: uses accurate details from the guest lecture."
        marks: 2
        top-band: Draws on at least three specific details (inside glaze, trade shows, learning logistics, collaborations).
        margin-note: Use what she actually described.
        authorities:
          - mgmt2094-example-guest-shelley-simpson
      - id: r3
        criterion: "Application: ties each detail to a named challenge."
        marks: 3
        top-band: Explains how each detail shows a specific challenge and the role innovation played.
        margin-note: Name the challenge before the example.
        authorities: []
      - id: r4
        criterion: "Evaluation: takes and defends a position on the statement."
        marks: 3
        top-band: Rejects or qualifies "product only" with reasons and judges which challenge mattered most.
        margin-note: Is it only a product question? Why not?
        authorities: []
  - key: q401
    type: mcq
    concept: barriers-to-innovation
    difficulty: 1
    set: pretest
    stem: On the slides, "government and its policies" is which kind of barrier to innovation?
    options:
      - text: An external barrier.
        correct: true
        why: >-
          Correct: the slide lists government and its policies under external barriers, with market-related and other
          barriers.
      - text: An internal, structural barrier.
        why: >-
          Tempting because compliance can need internal structures, but the slide places government and its policies
          among external barriers.
      - text: An internal, people-related barrier.
        why: >-
          Tempting because people carry out compliance, but the obstacle itself sits outside the firm, so the slide
          lists it as external.
      - text: A challenge of managing innovation.
        why: >-
          Tempting because policy is challenging, but the seven challenges are a separate list; government sits under
          barriers.
  - key: q402
    type: mcq
    concept: barriers-to-innovation
    difficulty: 1
    stem: Which of these is listed on the slides as an internal barrier to innovation?
    options:
      - text: Market-related barriers.
        why: >-
          Tempting because markets affect what a firm can do, but market-related barriers are the first of the external
          barriers.
      - text: Structural barriers.
        correct: true
        why: "Correct: the internal barriers on the slide are people related, structural and strategy related."
      - text: Government and its policies.
        why: >-
          Tempting because firms must comply internally, but government and its policies is an external barrier on the
          slide.
      - text: Societal barriers.
        why: >-
          Tempting because society includes a firm's own staff, but the slide groups societal barriers with the other
          external barriers.
  - key: q403
    type: mcq
    concept: barriers-to-innovation
    difficulty: 1
    stem: The slides group technical, societal and inter-organisational barriers as…
    options:
      - text: other external barriers.
        correct: true
        why: >-
