    stem: Which of these is one of the components for overcoming barriers ("learning to manage innovation") on the slides?
    options:
      - text: Strict job descriptions that limit experimenting.
        why: >-
          Tempting because clear roles help organisations, but limiting experiment cuts against the creative climate and
          learning organisation on the slides.
      - text: Key individuals.
