  - key: q421
    type: short
    concept: barriers-to-innovation
    difficulty: 3
    prompt: >-
      "A successful innovator's story can simply be copied." Respond to this statement in a short applied essay, using
      the external and internal barriers to innovation and the guest lecture by Shelley Simpson. (Tutorial: Can this
      success be replicated?)
    model: >-
      The statement overstates it: the methods can be copied more easily than the result. The slides split barriers to
      innovation into external (market-related; government and its policies; others: technical, societal and
      inter-organisational) and internal (people-related, structural and strategy-related). Shelley Simpson's account
      shows both. Externally, compliance with duties and taxes in each market was one of her biggest hurdles (government
      and its policies), and the market pushed back: one US department-store buyer rejected her samples before another
      placed a large order. Internally, she had to grow her own skills, build a team of about 100, and manage cash flow
      by setting boundaries with slow-paying wholesale accounts. A new founder will meet the same kinds of barriers, and
      her methods (experimenting, building relationships, controlling distribution, staying debt-free) can be learned.
      But some conditions cannot be copied: timing, a cookbook cover that brought international calls, more than two
      decades of growth, and her personal persistence. So her approach to barriers can be replicated, but her story
      cannot simply be copied; each founder must find their own way past them.
    rubric:
      - id: r1
        criterion: "Concept: sets out external and internal barriers accurately."
        marks: 2
        top-band: Gives both groups and all six types in the slides' terms.
        margin-note: Which group, and which type?
        authorities: []
      - id: r2
        criterion: "Example: uses accurate details of barriers from the guest lecture."
        marks: 2
        top-band: Identifies at least one external and one internal barrier she actually described.
        margin-note: Point to the hurdle she named.
        authorities:
          - mgmt2094-example-guest-shelley-simpson
      - id: r3
        criterion: "Application: classifies each barrier and links it to replication."
        marks: 3
        top-band: Classifies each barrier correctly and explains whether a new founder would face it.
        margin-note: Classify first, then apply.
        authorities: []
      - id: r4
        criterion: "Evaluation: takes and defends a position on the statement."
        marks: 3
        top-band: >-
          Distinguishes what can be copied (methods) from what cannot (timing, luck, persistence) and concludes on
          "simply".
        margin-note: Can the method be copied even if the result cannot?
        authorities: []
  - key: q501
    type: mcq
    concept: overcoming-barriers
    difficulty: 1
