      - text: Traditional firms have no culture, so they must buy one from a start-up.
        why: >-
          Tempting because G+T did invest in a start-up, but the reading's point is that G+T's existing culture was
          strong enough to make an internal version hard.
  - key: q116
    type: mcq
    concept: innovation-culture
    difficulty: 4
    variant-of: q108
    stem: >-
      At a hospital, nurses propose a new handover checklist; the trial is approved but never resourced, and fewer
