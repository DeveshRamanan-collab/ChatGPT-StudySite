  - key: q121
    type: short
    concept: innovation-culture
    difficulty: 3
    prompt: >-
      "The key component of Shelley Simpson's success was her company's innovation culture." Respond to this statement
      in a short applied essay, using the characteristics of an innovation culture and the guest lecture. (Tutorial:
      What were the key components of the company's success?)
    model: >-
      The statement is largely right, but culture was one key component among several. An innovation culture is where
      innovation and culture overlap: it shows organisation-wide commitment to the business and to innovation,
      experiments proactively, manages risk, implements ideas quickly, and produces and cultivates innovators. Shelley
      Simpson's company shows these. It experimented from the start: she tried mugs, dog bowls and planters, and staged
      trade-show spaces people couldn't help walking into. It cultivates innovators: staff are expected to "lean in" and
      are rewarded for it. It manages risk: she is wary of outside investors, keeps the business debt-free and avoids
      expanding too quickly. Commitment shows in long-serving staff and a team that became cohesive through the
      pandemic. But other components mattered too: relationships (a cookbook cover brought calls from around the world),
      control of distribution through her own stores, and her persistence through years of steady growth. Culture made
      those choices possible and sustained them; it did not create the opportunities on its own. So culture was a key
      component, not the whole explanation.
    rubric:
      - id: r1
        criterion: "Concept: defines an innovation culture and its five characteristics accurately."
        marks: 2
        top-band: Gives the overlap of innovation and culture and all five characteristics in the slides' words.
        margin-note: List all five; which one are you using?
        authorities: []
      - id: r2
        criterion: "Example: uses specific facts from the guest lecture."
        marks: 2
        top-band: Uses at least two concrete details (lean in, trade-show spaces, wariness of investors) without inventing any.
        margin-note: Which part of the lecture shows this?
        authorities:
          - mgmt2094-example-guest-shelley-simpson
      - id: r3
        criterion: "Application: links each fact to a named characteristic."
        marks: 3
        top-band: Ties each detail to one characteristic and explains how it contributed to success.
        margin-note: Say which characteristic this behaviour shows.
        authorities: []
      - id: r4
        criterion: "Evaluation: takes and defends a position on the statement."
        marks: 3
        top-band: >-
          Opens with a clear position, weighs culture against other causes (relationships, distribution, persistence)
          and concludes.
        margin-note: Do you agree with the statement, and how far?
        authorities: []
  - key: q201
    type: mcq
