          characteristic.
  - key: q514
    type: mcq
    concept: overcoming-barriers
    difficulty: 3
    stem: >-
      The conclusion says enterprises should allow "room for failure". Which sign of a culture that doesn't produce
      innovators does this answer?
    options:
      - text: Innovation is rewarded.
        why: >-
          Tempting because both concern how staff are treated, but rewarding innovation is a sign of a culture that DOES
          cultivate innovators.
      - text: Failure is discouraged or punished.
        correct: true
        why: >-
          Correct: tolerance for mistakes and room for failure directly answer the sign that failure is discouraged or
          punished.
      - text: Managers allow ideas to be heard.
        why: >-
          Tempting because it is about openness, but it is already a positive sign; the conclusion's point targets
          punished failure.
      - text: Innovators have space to develop and test.
        why: >-
          Tempting because testing implies failure, but this is a positive sign; room for failure answers the punishment
          of failure.
  - key: q515
    type: mcq
    concept: overcoming-barriers
    difficulty: 2
    stem: Which component involves "education and training of employees to ensure a high level of skills and competence"?
    options:
      - text: Shared vision, leadership and the will to innovate.
        why: >-
          Tempting because leaders invest in people, but this component is about purpose, strategic intent and top
          management commitment.
      - text: Continuing and stretching individual development.
        correct: true
        why: >-
          Correct: the slide describes this component as education and training of employees to ensure a high level of
          skills and competence.
      - text: Effective team working at an inter-organisational level.
        why: Tempting because teams build skills, but team working is about cross-functional teams and team selection.
      - text: Creative climate.
        why: >-
          Tempting because a good climate develops people, but creative climate is a positive approach to ideas backed
          by motivation systems.
  - key: q516
    type: mcq
    concept: overcoming-barriers
    difficulty: 4
    stem: >-
      A law firm's partners say they want innovation, but there is no stated purpose, no senior sponsor, and the targets
      simply repeat last year's. Which component is most clearly missing?
    options:
      - text: Effective team working.
        why: >-
          Tempting because the partners act as a group, but the gaps named are purpose, sponsorship and ambition, not
          teams.
      - text: Shared vision, leadership and the will to innovate.
        correct: true
        why: >-
          Correct: no shared purpose, no top management commitment and no stretching strategic intent are all three
          bullets of this component.
      - text: Extensive communication.
        why: >-
          Tempting because purpose must be communicated, but here there is no purpose to communicate; the vision itself
          is missing.
      - text: Learning organisation.
        why: >-
          Tempting because repeating targets suggests no learning, but the clearest gaps are purpose, sponsorship and
          stretch.
  - key: q517
    type: truefalse
    set: quickfire
    concept: overcoming-barriers
    difficulty: 1
    statement: >-
      "Tolerance for mistakes and allowing room for failure" is one of the three things the slides say enterprises
      should emphasise.
    answer: true
    why: >-
      True: the conclusion lists flexible planning and controlling systems, respect for individual initiative and
      personal growth, and tolerance for mistakes.
  - key: q518
    type: truefalse
    set: quickfire
    concept: overcoming-barriers
    difficulty: 1
    statement: On the slides, "extensive communication" is limited to communication within the organisation.
    answer: false
    why: >-
      False: extensive communication is "within and between the organisation and outside", so it reaches beyond the
      firm's own walls.
  - key: q519
    type: truefalse
    set: quickfire
    concept: overcoming-barriers
    difficulty: 1
    statement: The slides list "stretching strategic intent" under shared vision, leadership and the will to innovate.
    answer: true
    why: >-
      True: the three bullets are a clearly articulated and shared sense of purpose, stretching strategic intent and top
      management commitment.
  - key: q520
    type: short
    concept: overcoming-barriers
    difficulty: 3
    prompt: >-
      "Innovation is the job of the organisation, not of the individual employee." Respond to this statement in a short
      applied essay, using the components for overcoming barriers to innovation and the guest lecture by Shelley
      Simpson. (Tutorial: How can you use the key take-aways in your career?)
    model: >-
      The statement is only partly true. The slides' components for overcoming barriers include organisational ones
      (shared vision, leadership and the will to innovate; appropriate culture; effective team working; extensive
      communication; creative climate; learning organisation), but also key individuals (promoters and champions) and
      continuing and stretching individual development. The conclusion asks enterprises to respect individual initiative
      and personal growth. Shelley Simpson's lecture gives two take-aways for a career. First, "lean in": she rewards
      staff who ask questions and put themselves forward. As an employee I can act as a key individual, a promoter or
      champion of ideas; as a manager I can build a creative climate by rewarding that behaviour. Second, keep learning:
      she had to learn logistics, freight and compliance as the business grew, which is individual development; in a
      career that means seeking training before a new role demands it. The limits support the statement in part: leaning
      in works only where mistakes are tolerated, and no individual can create a shared vision alone. Innovation needs
      both the organisation and the individual.
    rubric:
      - id: r1
        criterion: "Concept: states the relevant components accurately."
        marks: 2
        top-band: >-
          Names the components used in the slides' words, with what each involves, and the conclusion's respect for
          individual initiative.
        margin-note: Which component, exactly?
        authorities: []
      - id: r2
        criterion: "Example: draws the take-aways from the guest lecture."
        marks: 2
        top-band: Uses specific, accurate details ("lean in", learning logistics and compliance).
        margin-note: Where did she say this?
        authorities:
          - mgmt2094-example-guest-shelley-simpson
      - id: r3
        criterion: "Application: turns each take-away into career action."
        marks: 3
        top-band: Shows how each take-away would be applied as an employee or manager.
        margin-note: What would you actually do in the role?
        authorities: []
      - id: r4
        criterion: "Evaluation: takes and defends a position on the statement."
        marks: 3
        top-band: Weighs organisational against individual components, names the limits of individual action, and concludes.
        margin-note: Organisation or individual, or both? Why?
        authorities: []
  - key: q601
    type: mcq
    concept: responding-to-disruption
    difficulty: 1
    set: pretest
    tags:
      - reading
    stem: In Nickless (2017), what did Gilbert + Tobin do in response to NewLaw disruption?
    options:
      - text: It launched its own low-cost online law firm under a new brand.
        why: >-
          Tempting because G+T did consider launching its own version, but it decided the incentives and culture would
          be too hard to get right.
      - text: It bought a 20 per cent stake in LegalVision for about A$4 million.
        correct: true
        why: "Correct: Nickless proposed buying a 20 per cent stake in LegalVision for about A$4 million, and G+T did so."
      - text: It retreated into a specialist niche and stopped all transactional work.
        why: >-
          Tempting because retreating into a niche was one listed option, but G+T chose to partner with a disruptor
          instead.
      - text: It outsourced its high-volume work to lower-cost lawyers overseas.
        why: >-
          Tempting because outsourcing was another listed option, but the response G+T chose was the stake in
          LegalVision.
  - key: q602
    type: mcq
    concept: responding-to-disruption
    difficulty: 1
    stem: What kind of work were NewLaw disruptors such as LegalVision focused on, according to the reading?
    options:
      - text: Lower-value, higher-volume transactional work, done faster and cheaper with standard processes and automation.
        correct: true
        why: >-
          Correct: the reading lists preparing wills, reviewing loan documents and first-round document reviews, done
          with standard processes and digital automation.
      - text: >-
          High-value, bespoke work such as major acquisitions or divestments, disputes, and regulatory issues that
          arise.
        why: Tempting because the reading describes this work, but it is G+T's own focus, not the disruptors'.
      - text: Litigation for large corporate clients, charged by the billable hour.
        why: >-
          Tempting because billable hours appear in the reading's opening, but disruptors were competing on low-cost
          transactional work.
  - key: q603
    type: mcq
    concept: responding-to-disruption
    difficulty: 1
    stem: Which of these was NOT among the possible responses to disruption listed in the reading?
    options:
      - text: Retreating into a specialist niche.
        why: Tempting to pick because it sounds defensive, but the reading does list retreating into a specialist niche.
      - text: Lobbying government to restrict NewLaw firms.
        correct: true
        why: >-
          Correct: the reading lists changing the model, a niche, online platforms, outsourcing and partnering; lobbying
          is not mentioned.
      - text: Developing new online platforms to automate simple activities.
        why: >-
          Tempting to pick because it sounds like the disruptors' own model, but it is one of the responses the reading
          lists.
      - text: Partnering with a disruptor.
        why: Tempting to pick because it is what G+T did, but it is listed as one of the possible responses.
  - key: q604
    type: mcq
    concept: responding-to-disruption
    difficulty: 2
    stem: Why did G+T decide against launching its own version of a low-cost legal service?
    options:
      - text: The low-cost market was shrinking, so it was not worth entering.
        why: >-
          Tempting as a reason to stay out, but the reading says LegalVision's market was growing at around 5 or 6 per
          cent a month.
      - text: Its partners believed that law would never be disrupted.
        why: >-
          Tempting because some lawyers once argued this, but G+T acted precisely because it expected disruption to move
          up the market.
      - text: Getting incentives and culture right beside a traditional legal model would be very hard.
        correct: true
        why: >-
          Correct: Nickless says getting the incentives right to motivate people and create the right culture would be
          very hard alongside the traditional model.
  - key: q605
    type: mcq
    concept: responding-to-disruption
    difficulty: 2
    stem: How did G+T expect disruption to spread through the legal market?
    options:
      - text: Up the market, from lower-value work towards the higher-value work where most of G+T's business lay.
        correct: true
        why: >-
          Correct: Nickless says disruption would tend to move up the market from the lower-value work towards the
          higher value.
      - text: Down the market, from complex deals to simple wills once AI matured.
        why: "Tempting because AI is mentioned, but the reading describes the opposite direction: from simple work upwards."
      - text: >-
          Sideways into other professions first, leaving top-tier law firms like G+T untouched for the foreseeable
          future.
        why: Tempting because other professions were disrupted first, but Nickless says the same forces will apply to law.
  - key: q606
    type: mcq
    concept: responding-to-disruption
    difficulty: 2
    stem: What appealed to Nickless about LegalVision?
    options:
      - text: Its marketplace model, referring customers on to independent lawyers.
        why: >-
          Tempting because marketplaces were in the market, but G+T rejected them for lack of quality control;
          LegalVision is a law firm.
      - text: Its success in giving cost-effective legal support to the underserviced SME market.
        correct: true
        why: >-
          Correct: the main appeal was LegalVision's success in providing cost-effective legal support to underserviced
          small-to-medium enterprises.
      - text: Its focus on bespoke, high-value transactions much like G+T's own work.
        why: >-
          Tempting because a similar firm sounds like an easy partner, but LegalVision's value lay in the low-cost SME
          market G+T could not serve.
  - key: q607
    type: mcq
    concept: responding-to-disruption
    difficulty: 2
    stem: Why did G+T not partner with the marketplace-style start-ups it looked at?
    options:
      - text: They were not law firms and only referred customers out, so there was no quality control.
        correct: true
        why: >-
          Correct: Nickless says some were marketplaces that referred clients to independent practitioners, with no
          quality control.
      - text: They were growing too fast for G+T to keep pace with.
        why: Tempting because growth was a theme, but the reading says none had LegalVision's momentum.
      - text: They charged more than G+T for the same transactional work.
        why: Tempting because price matters, but the reading's objection to them was quality control, not price.
  - key: q608
    type: mcq
    concept: responding-to-disruption
    difficulty: 2
    stem: What checks did Nickless use before G+T invested in LegalVision?
    options:
      - text: A government audit of LegalVision's accounts and a survey of clients.
        why: >-
          Tempting because audits are common in due diligence, but the reading mentions mystery shoppers and a review by
          top lawyers.
      - text: Mystery shoppers tested the service, and G+T's top lawyers reviewed the work.
        correct: true
        why: >-
          Correct: during due diligence Nickless arranged mystery shoppers and asked top lawyers what they thought of
          the work.
      - text: A six-month trial merger of the two firms' offices and staff.
        why: >-
          Tempting because trials reduce risk, but no trial merger is described; the checks were mystery shoppers and a
          quality review.
  - key: q609
    type: mcq
    concept: responding-to-disruption
    difficulty: 2
    stem: How fast was LegalVision growing, according to the reading?
    options:
      - text: Around 5 or 6 per cent a month, against a relatively flat traditional market.
        correct: true
        why: >-
          Correct: Nickless says LegalVision was growing at around 5 or 6 per cent a month while traditional demand was
          relatively flat.
      - text: Around 5 or 6 per cent a year, in line with the traditional market.
        why: Tempting because the numbers match, but the period is a month, and the traditional market was relatively flat.
      - text: Around 50 per cent a month, faster than any other legal start-up in Australia at the time.
        why: >-
          Tempting because start-ups can grow fast, but the reading gives around 5 or 6 per cent a month, not 50 per
          cent, and makes no such comparison.
  - key: q610
    type: mcq
    concept: responding-to-disruption
    difficulty: 3
    stem: Which benefit of the partnership does the reading report?
    options:
      - text: G+T no longer needs to do high-value, bespoke work.
        why: >-
          Tempting because the partnership opened new work, but G+T's high-value expertise remains its core; nothing
          says it stopped.
      - text: G+T keeps all the work for itself at a lower cost.
        why: >-
          Tempting because partnering should cut costs, but Nickless says G+T sometimes takes a smaller share of the
          work.
      - text: G+T can offer lower-value services cost-effectively to existing clients and craft combined solutions.
        correct: true
        why: >-
          Correct: the reading says G+T can provide lower-value services more cost-effectively and has crafted combined
          G+T and LegalVision solutions.
  - key: q611
    type: mcq
    concept: responding-to-disruption
    difficulty: 3
    stem: Nickless says that in some combined solutions G+T takes a smaller share of the work. Why does he accept this?
    options:
      - text: If G+T held it all, it would be uneconomic and the client would have no solution.
        correct: true
        why: "Correct: he says holding it all would be uneconomic and the client would not have a solution."
      - text: LegalVision's contract obliges G+T to pass it a fixed share of every matter.
        why: >-
          Tempting because partnerships have terms, but the reading gives no such contract; the reason is economics and
          the client's interest.
      - text: G+T plans to leave transactional law entirely within a few years.
        why: >-
          Tempting because G+T focuses on complex work, but the reading describes no plan to exit; it uses the
          partnership to serve clients.
  - key: q612
    type: mcq
    concept: responding-to-disruption
    difficulty: 3
    stem: Which challenge of managing innovation does G+T's partnership with LegalVision most clearly address?
    options:
      - text: "High involvement innovation: more participation by G+T's own staff."
        why: Tempting because the partners got excited, but the defining feature is the relationship with an outside firm.
      - text: "Managing connections: operating with others rather than in splendid isolation."
        correct: true
        why: "Correct: partnering with a disruptor is operating in relationship with others, challenge 7 on the slides."
      - text: "What to change: moving from product innovation to process innovation."
        why: Tempting because new processes are involved, but the decision is about whom to work with, not what to change.
  - key: q613
    type: mcq
    concept: responding-to-disruption
    difficulty: 3
    stem: >-
      A large accounting firm sees a start-up winning simple tax returns with automated software. Following the
      reading's logic, why should the firm care, even though tax returns are low-value work for it?
    options:
      - text: >-
          Because disruption tends to move up the market from lower-value work towards the higher-value work at the
          firm's core.
        correct: true
        why: >-
          Correct: the reading's logic is that a provider competent at lower-value work builds the capability to take on
          more complex work.
      - text: Because low-value work is where most of a top-tier firm's profit lies.
        why: >-
          Tempting because volume can be profitable, but the reading says the bulk of G+T's business lay in higher-value
          work.
      - text: Because start-ups usually fail, leaving their clients for the firm to collect.
        why: Tempting as a waiting strategy, but the reading treats disruptors as a growing threat, not likely failures.
  - key: q614
    type: mcq
    concept: responding-to-disruption
    difficulty: 3
    stem: What was Nickless's first task after joining G+T as chief operating officer in 2015?
    options:
      - text: Buying a stake in LegalVision before a rival firm could.
        why: >-
          Tempting because the stake is the story's climax, but it came after the review; the reading says nothing of
          racing rivals.
      - text: Running mystery-shopper tests of G+T's own client service.
        why: >-
          Tempting because mystery shoppers appear in the reading, but they tested LegalVision during due diligence,
          later on.
      - text: "A strategic review of the legal industry: what was going on, and the challenges and opportunities."
        correct: true
        why: "Correct: Nickless says one of his first tasks was a strategic review of the legal industry."
  - key: q615
    type: mcq
    concept: responding-to-disruption
    difficulty: 3
    stem: What does Nickless believe about the future of disruption in law?
    options:
      - text: It is only just getting started; the same forces will apply to law as elsewhere.
        correct: true
        why: "Correct: he says it is early days and the same forces will apply, though it is only just getting started."
      - text: It is over, because top-tier firms like G+T have now proved that they are different from other industries.
        why: Tempting because some once argued this, but Nickless says nobody makes that argument any more.
      - text: It will reach small firms only, and never top-tier firms like G+T.
        why: >-
          Tempting because NewLaw started with small clients, but Nickless expects the same forces to apply across the
          industry.
  - key: q616
    type: mcq
    concept: responding-to-disruption
    difficulty: 4
    variant-of: q613
    stem: >-
      A university sees online providers offering short, cheap certificates it once dismissed as low-value. Applying the
      reading, which response best matches G+T's?
    options:
      - text: Ignore the providers, because low-value work never moves up a market.
        why: >-
          Tempting because certificates seem minor, but the reading warns disruption moves up the market from
          lower-value work.
      - text: Take a stake in a strong provider, gaining exposure to the growing market and learning from the disruption.
        correct: true
        why: >-
          Correct: like G+T's stake in LegalVision, this gives exposure to the high-growth segment and the ability to
          learn from disruption.
      - text: Launch an identical in-house unit at once, since culture does not affect new ventures.
        why: >-
          Tempting because it keeps control in-house, but G+T rejected this because incentives and culture would be very
          hard to get right.
  - key: q617
    type: truefalse
    set: quickfire
    concept: responding-to-disruption
    difficulty: 1
    statement: G+T bought a 20 per cent stake in LegalVision for about A$4 million.
    answer: true
    why: >-
      True: Nickless proposed buying a 20 per cent stake in LegalVision for about A$4 million instead of launching G+T's
      own version.
  - key: q618
    type: truefalse
    set: quickfire
    concept: responding-to-disruption
    difficulty: 1
    statement: Nickless argues that top-tier law firms are different and will not be disrupted.
    answer: false
    why: >-
      False: he says nobody makes that argument any more; the same forces will apply to law, and disruption is only just
      getting started.
  - key: q619
    type: truefalse
    set: quickfire
    concept: responding-to-disruption
    difficulty: 1
    statement: Retreating into a specialist niche was among the possible responses to disruption listed in the reading.
    answer: true
    why: >-
      True: the listed options were changing the business model, a specialist niche, online platforms, outsourcing and
      partnering with a disruptor.
  - key: q620
    type: short
    concept: responding-to-disruption
    difficulty: 3
    prompt: >-
      "Established firms should fight disruptors, not partner with them." Respond to this statement in a short applied
      essay, using Nickless (2017) and this week's frameworks.
    model: >-
      The statement does not fit Gilbert + Tobin's situation, though partnering has costs. Nickless (2017) shows G+T
      facing NewLaw disruptors that did lower-value, high-volume work faster and cheaper, and expecting disruption to
      move up the market towards its high-value core. Its options were to change its business model, retreat into a
      niche, build online platforms, outsource, launch its own version, or partner with a disruptor. G+T rejected its
      own version because getting the incentives and culture right beside a traditional legal model would be very hard,
      and bought a 20 per cent stake in LegalVision for about A$4 million. In this week's terms, that answers the
      challenge of managing connections and reflects a learning organisation: the stake gives the ability to learn from
      disruption as it arrives. It also shows a realistic, informed leader: a strategic review first, then mystery
      shoppers and a quality review by top lawyers. The trade-offs: G+T owns only 20 per cent, and in combined solutions
      it sometimes takes a smaller share of the work. Partnering bought exposure and learning at modest cost; fighting
      alone would have meant splendid isolation.
    rubric:
      - id: r1
        criterion: "Concept: explains how disruption moves up the market and the response options."
        marks: 2
        top-band: States the up-market threat and lists the options the reading gives.
        margin-note: What exactly was the threat?
        authorities:
          - mgmt2094-nickless-2017
      - id: r2
        criterion: "Example: uses the reading's facts accurately."
        marks: 2
        top-band: Gives the 20 per cent stake, about A$4 million, the culture reason and the due diligence checks.
        margin-note: Use the reading's numbers and reasons.
        authorities:
          - mgmt2094-example-gilbert-tobin-legalvision
      - id: r3
        criterion: "Application: applies Week 12 frameworks to the decision."
        marks: 3
        top-band: Links the decision to managing connections, the learning organisation and the realistic, informed leader.
        margin-note: Which framework does this decision show?
        authorities: []
      - id: r4
        criterion: "Evaluation: takes and defends a position on the statement."
        marks: 3
        top-band: >-
          Weighs exposure and learning against limited control and a smaller share of work, and concludes on "fight or
          partner".
        margin-note: What did G+T give up by partnering?
        authorities: []
pretest:
  - q101
