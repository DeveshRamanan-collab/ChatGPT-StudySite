- key: q100
  type: short
  concept: international-law-as-living-process
  difficulty: 3
  prompt: Using the development of international environmental law, explain what it means to say international law is a 'living process'.
  model: |
    Calling international law a 'living process' means it is not fixed once written down, but changes and
    evolves as states' practices and expectations change, particularly in response to new interests and
    technologies — and international environmental law shows exactly this kind of gradual change.
    Before the 1960s there was not much of an international legal framework for the environment at all.
    The United Nations then built momentum in stages: it hosted conferences (the UN Conference on the
    Human Environment, 1972), created programs and agencies (the UN Environment Program, and other
    agencies not dedicated to the environment, such as the Food and Agriculture Organization), and, through
    the General Assembly, produced documents such as the Rio Declaration (1992) that were not binding --
    because the General Assembly cannot itself create binding obligations — but that created the
    groundwork states later turned into binding treaties: the UN Framework Convention on Climate Change
    (1992), the Kyoto Protocol (1997), and the Paris Agreement (2015), followed by the ICJ's 2025 Advisory
    Opinion. The ozone example makes the same point numerically: the 1985 Vienna Convention and 1987
    Montreal Protocol did not eliminate ozone-depleting emissions overnight, but emissions fell sharply
    once those instruments took effect, and the UN now expects full recovery by 2040. In each case, the
    law developed through a named mechanism — non-binding UN documents building momentum, then binding
    treaties and protocols — rather than appearing all at once, which is what makes 'living process' more
    than just a metaphor.
  rubric:
  - id: r1
    criterion: Defines 'living process' correctly
    marks: 2
    top-band: States clearly that international law changes and evolves in response to changing practices, expectations, interests or technologies.
    margin-note: Ground the definition in the lecture's own words before applying it.
    authorities: []
  - id: r2
    criterion: Traces the staged development of international environmental law
    marks: 3
    top-band: Names the UN conferences/agencies/General Assembly stage, then the binding treaties that followed, in the correct order.
    margin-note: Order and mechanism matter — non-binding documents came before the binding treaties.
    authorities: []
  - id: r3
    criterion: Uses the ozone example to show the process numerically
    marks: 1
    top-band: Connects the Vienna Convention/Montreal Protocol timeline to the emissions data as concrete evidence of gradual legal change.
    margin-note: A good answer backs the abstract claim with this concrete example.
    authorities: []
- key: q101
  type: mcq
  concept: compliance-and-enforcement
  difficulty: 1
  set: pretest
  stem: Which of these does the lecture say international law lacks, unlike a domestic legal system?
  options:
  - text: A legislative branch, an executive branch, and a universally compulsory procedure for settling disputes.
    correct: true
    why: Correct — the slide states 'there is no universally compulsory procedure for the settlement of international disputes' and 'there is neither a legislative nor an executive branch in the international legal system.'
  - text: Any courts or tribunals capable of hearing disputes between states at all.
    why: Wrong — the materials mention the International Court of Justice and the PCIJ as real courts; what is missing is compulsory jurisdiction, not courts altogether.
  - text: Any rules that are considered legally binding on states.
    why: Wrong — international law does have binding rules, arising from custom or treaty; what it lacks is a legislature, executive and compulsory dispute settlement, not binding rules themselves.
- key: q102
  type: mcq
  concept: compliance-and-enforcement
  difficulty: 2
  stem: Why does the lecture say 'enforcement' is irrelevant to whether international law is genuinely binding?
  options:
  - text: Because international law rules become legally binding through sufficient consensus and practice (custom) or treaty agreement, independent of whether they are actually enforced.
    correct: true
    why: Correct — the slide states rules become binding 'when there is sufficient consensus & practice among states to generate a rule of customary international law or when states agree to be bound by a treaty', and that 'enforcement is irrelevant to the binding quality of international law as a system of law.'
  - text: Because international law is not really law at all, only a set of guidelines.
    why: Wrong — the materials treat international law as genuinely binding law; the point about enforcement being irrelevant is precisely that bindingness does not depend on enforcement, not that it is optional.
  - text: Because every rule of international law is automatically enforced by the UN Security Council though the precise scope of this claim is not spelled out in this week's materials a distinction that matters more in some fact patterns than others.
    why: Wrong — this is the opposite of the lecture's point; there is no automatic, universal enforcement mechanism, and yet rules can still be binding.
- key: q103
  type: mcq
  concept: compliance-and-enforcement
  difficulty: 2
  stem: According to Hoffman (1987), quoted in the lecture, what is the basis of obligation in every legal order?
  options:
  - text: A consciousness among the subjects that this order is needed if one is to reach a common end.
    correct: true
    why: "Correct — this is the direct quotation: 'the basis of obligation is the same in every legal order: a consciousness among the subjects that this order is needed if one is to reach a common end.'"
  - text: The threat of criminal prosecution before a domestic court.
    why: Wrong — Hoffman's quoted point is about shared consciousness of the order's necessity, not about criminal prosecution or domestic courts specifically.
  - text: A written constitution ratified by a supermajority of states.
    why: Wrong — Hoffman's quote does not mention a written constitution; it is about a shared sense that the order is needed to reach a common end.
- key: q104
  type: mcq
  concept: compliance-and-enforcement
  variant-of: q103
  difficulty: 2
  stem: According to Chayes & Chayes (1995), quoted in the lecture, what does compliance come from?
  options:
  - text: Fear not of sanction, but of loss of reputation, which leads other states to exclude the non-complying state from future opportunities to cooperate.
    correct: true
    why: "Correct — this is the quotation: 'compliance comes from fear not of sanction but \"loss of reputation\" which leads other states to exclude that state from future opportunities to cooperate.'"
  - text: The direct threat of military force from the UN Security Council.
    why: Wrong — Chayes & Chayes's point is specifically that fear of sanction is not the driver; reputation is, which is a different mechanism from military threat.
  - text: Automatic fines imposed by the International Monetary Fund on any non-complying state though this depends on details this week's materials do not fully specify.
    why: Wrong — automatic IMF fines are not described anywhere in the materials; the IMF and World Bank are mentioned only as being able to exert 'some economic leverage', a softer and less automatic mechanism.
- key: q105
  type: mcq
  concept: compliance-and-enforcement
  variant-of: q104
  difficulty: 3
  stem: A state has a poor track record of honouring its trade commitments. Based on Chayes & Chayes's account, what is the most likely practical consequence for that state?
  options:
