- key: q108
  type: mcq
  concept: compliance-and-enforcement
  difficulty: 1
  stem: The realist view in international relations theory holds that what matters most in how states behave?
  options:
  - text: Power, specifically military power.
    correct: true
    why: Correct — the lecture states this is 'one of the most influential ideas in international relation theory, this idea that what matters most is power, specifically military power.'
  - text: Reputation among other states, above all other considerations.
    why: Wrong — reputation is central to the Chayes & Chayes managerial account discussed in the same lecture, not to the realist view, which centres on military power.
  - text: Formal ratification of as many treaties as possible.
    why: Wrong — the realist view is not described in terms of treaty ratification numbers; it is about the primacy of power, especially military power, over legal rules.
- key: q109
  type: mcq
  concept: compliance-and-enforcement
  variant-of: q108
  difficulty: 2
  stem: According to the realist view described in the lecture, when will a militarily powerful state obey international law?
  options:
  - text: Only when it is in that state's perceived interest to do so.
    correct: true
    why: Correct — the lecture states 'the military powerful state will only obey international law when it is in their perceived interest to do so', according to the realist view.
  - text: Always, regardless of its own interests, because power carries an automatic duty to comply.
    why: Wrong — this is the opposite of the realist view, which ties compliance specifically to the state's own perceived interest, not to an automatic duty.
  - text: Never, because realism holds that law and power can never coexist under any circumstances.
    why: Wrong — the realist view allows for compliance when it suits the state's interest; it does not claim law and power can never coexist at all.
- key: q110
  type: mcq
  concept: compliance-and-enforcement
  variant-of: q108
  difficulty: 2
  stem: What happens, according to the realist view, when law and power conflict?
  options:
  - text: It is almost inevitably law that will lose.
    correct: true
    why: Correct — the lecture states 'when law and power conflict, it's almost inevitably law that will lose it, okay? So, that's what we call in international relation scholarship, the realist view.'
  - text: International courts automatically overrule the powerful state, restoring the primacy of law.
    why: Wrong — this is the opposite outcome from the one the realist view predicts, which is that power tends to prevail over law in a conflict between the two.
  - text: Both law and power are set aside in favour of a decision by the UN Secretary-General.
    why: Wrong — the materials do not describe any such role for the UN Secretary-General in resolving a conflict between law and power under the realist view.
- key: q111
  type: mcq
  concept: compliance-and-enforcement
  difficulty: 3
  stem: A state complies with a costly environmental treaty even though no international body could realistically force it to. Which explanation from this week's materials best accounts for this?
  options:
  - text: The state may be motivated by reputational concerns and the shared sense that the international order is needed to reach a common end, rather than by fear of sanction.
    correct: true
    why: Correct application of the Hoffman and Chayes & Chayes accounts — both explain voluntary compliance through shared need for the legal order and reputational incentives, not through the fear of sanction the state clearly does not face here.
  - text: The state must have been formally expelled from the United Nations for non-compliance with an earlier treaty.
    why: Wrong — expulsion is a consequence of non-compliance, not an explanation for why a state complies voluntarily with a treaty in the first place.
  - text: Compliance can only be explained by the existence of a domestic police force enforcing the treaty internally.
    why: Wrong — the scenario is about compliance with an international treaty despite no realistic international enforcement; a domestic police force enforcing domestic law is a different question entirely.
- key: q112
  type: mcq
  concept: compliance-and-enforcement
  difficulty: 4
  stem: "Louis Henkin wrote: 'Almost all nations observe almost all principles of international law and almost all of their obligations almost all of the time.' Which of this week's materials most directly supports treating this as unsurprising rather than remarkable?"
  options:
  - text: The Hoffman and Chayes & Chayes accounts of compliance, together with the point that violations occurring does not invalidate international law's legitimacy, just as domestic crime does not destroy domestic law.
    correct: true
    why: Correct — these two strands together explain both why states generally comply (shared need for the order, reputational cost of non-compliance) and why occasional violations are not evidence the system has failed, which is exactly what makes Henkin's observation unsurprising rather than remarkable.
  - text: The fact that the International Court of Justice can compel any state to appear before it at any time.
    why: "Wrong — the materials state the opposite: the ICJ's jurisdiction is not compulsory, and states must agree to be bound by it, so this cannot explain widespread compliance."
  - text: The fact that the UN Security Council can override any state's sovereignty whenever it disagrees with that state's conduct at least on the account this week's lecture and slides give which is a plausible-sounding claim but not one this week's sources actually make.
    why: Wrong — nothing in the materials describes the Security Council as able to simply override a state's sovereignty at will; this misstates how compliance is explained in this week's readings.
- key: q113
  type: mcq
  concept: compliance-and-enforcement
  difficulty: 3
  stem: '''No one in this Great Hall of Justice is starry-eyed about international law, but it is what we have.'' What point is Philippe Sands making with this quote, as used in the lecture?'
  options:
  - text: That international law is imperfect and violations occur, but it remains the best available system and should not be dismissed as illegitimate because of those violations.
    correct: true
    why: Correct — this quote is presented alongside the point that 'frequent assaults on international law do not invalidate its legitimacy' and that 'the vast majority of states abide by their obligations', supporting a realistic but not dismissive view of the system.
  - text: That international law should be abandoned in favour of purely domestic legal systems.
    why: Wrong — this is the opposite of the quote's message, which defends international law as worth keeping despite its imperfections, not as something to abandon.
  - text: That the International Court of Justice is the only legitimate source of international law.
    why: Wrong — the quote is a general defence of the international legal system's continued value, not a specific claim about the ICJ being the sole legitimate source of law.
- key: q114
  type: mcq
  concept: compliance-and-enforcement
  difficulty: 2
  stem: Which of the following is given in the lecture as an example of a continuing violation of international law, without this being said to destroy the system's legitimacy?
  options:
  - text: Occupation of territories, use of force, targeted killings, and disrespect of treaties.
    correct: true
    why: "Correct — the slide lists exactly these under 'Violations of International Law Still Occur': 'Occupation of territories', 'Use of force; Targeted killings', 'Disrespect of treaties.'"
  - text: Failure to agree on a single universal time zone.
    why: Wrong — the Meridian Conference example is used positively, to show international law's everyday reach (time zones), not as an example of a violation of international law.
  - text: The existence of more than one definition of public international law though this would need to be checked against the specific facts before being relied on in an exam answer.
    why: Wrong — having three different definitions of international law is a pedagogical point about emphasis, not a violation of international law of the kind the slide is describing.
- key: q115
  type: mcq
  concept: compliance-and-enforcement
  difficulty: 3
  stem: How does the lecture's discussion of compliance relate to the earlier discussion of sovereign equality and consent?
  contrasts-with:
  - sovereign-equality-and-consent
  options:
  - text: "They address different questions: consent and sovereign equality explain what makes a rule binding and how states stand relative to one another, while compliance explains why states actually follow binding rules absent a domestic-style enforcer."
    correct: true
    why: Correct — keeping these two sets of ideas distinct (source of bindingness versus reasons for actual compliance) avoids the common error of assuming a consent-based system must therefore have no real consequences for breach.
  - text: They are the same question, because a state's consent to a rule automatically guarantees that state will always comply with it.
    why: Wrong — consenting to a rule (making it binding) is different from actually complying with it in practice; the lecture's compliance material specifically explains why states usually do comply, which would be unnecessary if consent alone guaranteed compliance.
  - text: Compliance is only relevant to treaty law, while sovereign equality is only relevant to customary international law.
    why: Wrong — sovereign equality and consent apply across both treaty and customary law, and compliance concerns following any binding rule of international law, not treaty rules specifically.
- key: q116
  type: mcq
  concept: compliance-and-enforcement
  difficulty: 4
  stem: "A commentator claims: 'Because the General Assembly cannot make binding law, its resolutions have no practical effect on how international law develops.' Using this week's materials on both compliance and the living process, why is this too strong?"
  contrasts-with:
  - international-law-as-living-process
  options:
  - text: Non-binding General Assembly documents can build the momentum and reputational expectations that later become binding treaties, and even non-binding norms can shape which practices states feel bound to follow.
    correct: true
    why: Correct — the environmental law example shows General Assembly declarations (e.g. the Rio Declaration) building momentum that states later turned into binding treaties (UNFCCC, Kyoto, Paris), and the compliance material shows reputational pressure operating even without formal bindingness.
  - text: This claim is correct, because non-binding resolutions are simply ignored by every state in practice.
    why: "Wrong — the materials show the opposite: non-binding General Assembly resolutions and declarations played a documented, practical role in building the framework that produced binding environmental treaties."
  - text: This claim is correct, because only the Security Council's resolutions, never the General Assembly's, have ever influenced state behaviour.
    why: Wrong — this week's materials specifically credit the General Assembly, not only the Security Council, with building the momentum behind international environmental law's development.
- key: q117
  type: truefalse
  concept: compliance-and-enforcement
  set: quickfire
  difficulty: 1
  statement: According to the lecture, enforcement is irrelevant to whether international law is binding as a system of law.
  answer: true
  why: True — the slide states directly that 'enforcement is irrelevant to the binding quality of international law as a system of law.'
- key: q118
  type: truefalse
  concept: compliance-and-enforcement
  set: quickfire
  difficulty: 2
  statement: Chayes & Chayes argue that states comply with international law mainly out of fear of criminal sanction.
  answer: false
  why: False — Chayes & Chayes are quoted as saying compliance comes 'from fear not of sanction but "loss of reputation"', which is a different mechanism from fear of criminal sanction.
- key: q119
  type: truefalse
  concept: compliance-and-enforcement
  set: quickfire
  difficulty: 1
  statement: The realist view in international relations holds that a militarily powerful state will always obey international law regardless of its own interests.
  answer: false
  why: False — the realist view described in the lecture is that a militarily powerful state 'will only obey international law when it is in their perceived interest to do so', not always and regardless of interest.
- key: q120
  type: short
  concept: compliance-and-enforcement
  difficulty: 3
  prompt: Louis Henkin wrote that 'almost all nations observe almost all principles of international law and almost all of their obligations almost all of the time'. Using this week's compliance material, explain why this is true despite international law having no legislature, executive or police.
  model: |
    Henkin's observation is true precisely because international law does not need a domestic-style
    legislature, executive or police to secure compliance — it relies on different mechanisms. First,
    compliance rests on something more basic than enforcement: as Hoffman (1987) put it, 'the basis of
    obligation is the same in every legal order: a consciousness among the subjects that this order is
    needed if one is to reach a common end', and enforcement is 'irrelevant to the binding quality of
    international law as a system of law' in the first place. Second, where a more concrete incentive is
    needed, reputation supplies it: Chayes & Chayes (1995) argue that compliance comes 'from fear not of
    sanction but "loss of reputation"', because other states will exclude a habitually non-complying state
    from future cooperation — from trade partnerships to alliances. Third, there is quasi-enforcement:
    continued participation in international organisations is conditional on trust, so Arts 5-6 of the UN
    Charter allow suspension or expulsion from membership, and bodies like the IMF and World Bank can apply
    economic leverage. Taken together, these three mechanisms — shared necessity, reputational cost, and
    quasi-enforcement — explain widespread compliance without any domestic-style enforcer, while also
    explaining why the occasional, well-publicised violation (use of force, occupation, disrespect of
    treaties) does not disprove Henkin's claim: just as domestic crime does not destroy a domestic legal
    system, these violations sit alongside, rather than replace, the underlying pattern of compliance.
  rubric:
  - id: r1
    criterion: Explains the shared-necessity account of obligation (Hoffman)
    marks: 2
    top-band: Accurately states that obligation rests on a shared sense the order is needed, independent of enforcement.
    margin-note: Use the quote precisely, not just gesture at it.
    authorities: []
  - id: r2
    criterion: Explains the reputational account (Chayes & Chayes) and quasi-enforcement
    marks: 3
    top-band: Explains both the reputational cost mechanism and at least one concrete quasi-enforcement example (Arts 5-6 UN Charter, or IMF/World Bank leverage).
    margin-note: These are the two most concrete mechanisms — reward precision here.
    authorities: []
  - id: r3
    criterion: Reconciles this with the fact that violations still occur
    marks: 1
    top-band: Explains that occasional violations do not undermine the general pattern, drawing the domestic-crime analogy.
    margin-note: This closes the loop back to Henkin's own qualifier, 'almost all'.
    authorities: []
- key: q121
  type: mcq
  concept: general-and-specialized-international-law
  difficulty: 1
  set: pretest
  stem: Which of these is listed under 'general' international law on the lecture slide, rather than 'special' international law?
  options:
  - text: State responsibility.
    correct: true
    why: Correct — the slide lists 'State Responsibility' under 'General International Law', alongside sources, treaty law, statehood and recognition, jurisdiction and immunities, diplomatic protection, and peaceful settlement of disputes.
  - text: International Criminal Law.
    why: Wrong — International Criminal Law is listed under 'Special International Law' on the slide, not under the general category.
  - text: International Law of the Sea.
    why: Wrong — International Law of the Sea is listed under 'Special International Law', alongside human rights, air and space law, environmental law, energy, trade, investment and health law.
- key: q122
  type: mcq
  concept: general-and-specialized-international-law
  variant-of: q121
  difficulty: 1
  stem: Which of these is listed under 'special' international law on the lecture slide?
  options:
  - text: International Human Rights Law.
    correct: true
    why: Correct — the slide lists 'International Human Rights Law' under 'Special International Law', alongside use of force, criminal law, the law of the sea, air and space law, environmental law, energy, trade, investment and health law.
  - text: Sources.
    why: Wrong — 'Sources' (of international law) is listed under 'General International Law' on the slide, not the special category.
  - text: Jurisdiction & Immunities.
    why: Wrong — 'Jurisdiction & Immunities' is listed under 'General International Law', not among the special regimes.
- key: q123
  type: mcq
  concept: general-and-specialized-international-law
  difficulty: 2
  stem: According to the unit structure slide, which topic comes immediately after 'Sources of International Law'?
  options:
  - text: Law of Treaties.
    correct: true
    why: "Correct — the unit structure lists: 1. Introduction, 2. Sources of International Law, 3. Law of Treaties, 4. Subjects of International Law and Statehood, and so on."
  - text: Use of Force.
    why: Wrong — Use of Force appears much later in the unit structure (item 9), not immediately after Sources of International Law.
  - text: Human Rights and Revision.
    why: Wrong — Human Rights and Revision is the final topic (item 11) in the unit structure, not the one immediately following Sources of International Law.
- key: q124
  type: mcq
  concept: general-and-specialized-international-law
  variant-of: q123
  difficulty: 2
  stem: Which topic is scheduled last in the unit's structure, combined with a revision session?
  options:
  - text: Human Rights.
    correct: true
    why: Correct — the unit structure lists '11. Human Rights and Revision' as the final topic, and the lecturer confirms 'the last session will be on human rights and we will have a revision.'
  - text: International Criminal Law.
    why: Wrong — International Criminal Law is item 10 in the unit structure, immediately before the final Human Rights and Revision session, not the last topic itself.
  - text: Immunities.
    why: Wrong — Immunities is item 6 in the unit structure, roughly in the middle of the semester's topics, not the final session.
- key: q125
  type: mcq
  concept: general-and-specialized-international-law
  difficulty: 3
  stem: A vessel rescues migrants in distress at sea and wants to dock in a country other than the one where it is registered. Which combination of regimes does the lecture say this scenario draws on?
  options:
  - text: Migration law, the law of the sea, and human rights law (and potentially international health law).
    correct: true
    why: "Correct — the lecture uses exactly this scenario: 'you will have migration law. You will have the law of the sea that is involved. You will have human rights law. You can even have perhaps public health law, international health law.'"
  - text: Only international criminal law, since docking without authorisation is treated as a crime.
    why: Wrong — the lecture does not frame this scenario as a criminal law matter at all; it identifies migration law, the law of the sea, human rights law and potentially health law as the relevant regimes.
  - text: Only diplomatic protection, since the migrants are foreign nationals.
    why: Wrong — diplomatic protection is a general international law topic about a state espousing its nationals' claims; it is not the combination of regimes the lecture identifies for this scenario.
- key: q126
  type: mcq
  concept: general-and-specialized-international-law
  variant-of: q125
  difficulty: 3
  stem: A dispute arises between two states over an agrochemical product used to grow food, where the product also affects the environment of one or more states. Which regimes does the lecture say this draws on?
  options:
  - text: International health law, trade law, environmental law, and state responsibility.
    correct: true
    why: Correct — the lecture states 'you may have international health law, again, trade law... You may have questions about environmental law as well... those kind of key core regimes such as state responsibility.'
  - text: Only the law of the sea, since agrochemicals eventually run off into rivers and oceans.
    why: Wrong — while environmental effects are relevant, the lecture identifies health law, trade law, environmental law and state responsibility together, not the law of the sea alone.
  - text: Only diplomatic immunity, because the dispute is between two governments.
    why: Wrong — diplomatic immunity concerns the personal legal protection of diplomats, not a substantive dispute over agrochemical regulation and its effects, which the lecture assigns to health, trade, environmental and state-responsibility law.
- key: q127
  type: mcq
  concept: general-and-specialized-international-law
  difficulty: 2
  stem: What does the lecture mean when it says international law's regimes 'do not operate in silo'?
  options:
  - text: Exam problems and real disputes often require drawing on more than one regime of international law at once, rather than fitting neatly into a single category.
    correct: true
    why: Correct — the lecture explains 'these regimes do not operate in silo... when we talk about an issue in an exam question or something, sometimes you will have to borrow and draw from different regimes, not necessarily just one.'
  - text: Each regime of international law is completely independent and irrelevant to every other regime.
    why: Wrong — this is the opposite of 'not operating in silo', which specifically means regimes interact and combine, not that they are isolated from one another.
  - text: Only the International Court of Justice can decide which regime applies to a given dispute.
    why: Wrong — the lecture's point about regimes not operating in silo is about the substantive overlap between regimes, not about which body has authority to decide which regime applies.
- key: q128
  type: mcq
  concept: general-and-specialized-international-law
  difficulty: 1
  stem: Which examples does the lecture give of a 'global common' that belongs to no single state?
  options:
  - text: The high seas, outer space, and Antarctica.
    correct: true
    why: "Correct — the lecture lists exactly these: 'the IC is one. The outer space is one. Antarctica is also a global common.'"
  - text: The Mekong River and the Amazon rainforest.
    why: Wrong — the Mekong River is used as an example of a resource shared by several particular states (China, Vietnam, Laos, Thailand, Cambodia), not a global common belonging to no state; the Amazon is not discussed in this week's materials.
  - text: The Arctic and the Panama Canal.
    why: Wrong — neither the Arctic nor the Panama Canal is named as a global common in this week's materials; the examples given are the high seas, outer space and Antarctica.
- key: q129
  type: mcq
  concept: general-and-specialized-international-law
  variant-of: q128
  difficulty: 2
  stem: Why can no state impose its jurisdiction, rules or law over a global common such as the high seas?
  options:
  - text: Because a global common does not belong to any one state in particular, so no state has jurisdiction over it.
    correct: true
    why: Correct — the lecture explains 'those areas don't belong to one state in particular. So no state has jurisdiction over these areas... no state can impose their jurisdiction, their rules, their law over those states.'
  - text: Because the UN Charter specifically assigns joint jurisdiction over global commons to the Security Council.
    why: Wrong — the materials do not describe the Security Council as jointly governing global commons; the point is that no single state has jurisdiction, not that jurisdiction is centralised in the Security Council.
  - text: Because global commons are protected by a specific provision of the Peace of Westphalia.
    why: Wrong — the Peace of Westphalia (1648) concerns the birth of the sovereign state system generally; it is not the source of the global-commons principle discussed in the lecture.
- key: q130
  type: mcq
  concept: general-and-specialized-international-law
  variant-of: q128
  difficulty: 2
  stem: What freedom does the lecture say every state — even a land-bound (landlocked) one — retains in relation to the high seas?
  options:
  - text: Freedom of navigation on, and access to, the high seas.
    correct: true
    why: Correct — the lecture states 'even if you're a land-bound country, you will always have freedom of navigation on the IC. You will have access to the IC.'
  - text: The right to exploit fisheries in any other state's territorial waters.
    why: Wrong — freedom of navigation and access to the high seas is distinct from fishing rights inside another state's territorial waters, which the materials do not discuss.
  - text: The right to build a permanent military base on Antarctica.
    why: Wrong — the materials do not describe any such military right; the freedom given is navigation and access to the high seas, not military basing rights on Antarctica.
- key: q131
  type: mcq
  concept: general-and-specialized-international-law
  difficulty: 2
  stem: Which countries does the lecture name as sharing the Mekong River?
  options:
  - text: China, Vietnam, Laos, Thailand, and Cambodia.
    correct: true
    why: Correct — the lecture states 'the Mekong is shared by China, by Vietnam, Laos, Thailand, and Cambodia.'
  - text: India, Pakistan, Bangladesh, and Nepal.
    why: Wrong — these South Asian states are not named in connection with the Mekong River, which the lecture identifies as shared by China, Vietnam, Laos, Thailand and Cambodia.
  - text: Australia, Indonesia, Malaysia, and Singapore.
    why: Wrong — none of these states is named as sharing the Mekong River in this week's materials.
- key: q132
  type: mcq
  concept: general-and-specialized-international-law
  variant-of: q131
  difficulty: 3
  stem: What is the significance of the fact that China is not a member of the Mekong River Commission?
  options:
  - text: Because China is most upstream, its dam-building can affect fishery and water-flow in downstream member states without China being bound by the Commission's cooperative approach.
    correct: true
    why: Correct — the lecture explains 'China is not a member of that commission... obviously China is building quite a few dams, so sometimes it becomes an issue because they are really much upstream', unlike the member states, who share a common regulatory approach.
  - text: It shows the Mekong River Commission has no legal authority over any of its member states either.
    why: Wrong — the lecture describes the Commission's members as agreeing to regulate the use of the river together; the issue with China not being a member is specifically about it not being bound by that shared approach, not that no member is bound.
  - text: It shows the Mekong is legally classified as a global common like the high seas.
    why: Wrong — the Mekong is used as an example of a resource shared by a specific, limited number of states, which is the opposite of a global common belonging to no state at all.
- key: q133
  type: mcq
  concept: general-and-specialized-international-law
  variant-of: q131
  difficulty: 2
  stem: What was created by the 1995 Agreement on the Cooperation for the Sustainable Development of the Mekong River?
  options:
  - text: The Mekong River Commission.
    correct: true
    why: Correct — the lecture states 'in 1995 there was the creation of the Agreement on the Cooperation for the Sustainable Development of the Mekong River. That created the Mekong River Commission.'
  - text: The International Law Commission.
    why: Wrong — the International Law Commission was created by the United Nations in 1946, to promote the progressive development and codification of international law generally, not by the 1995 Mekong agreement.
  - text: The Permanent Court of Arbitration.
    why: Wrong — the Permanent Court of Arbitration was established by the Hague Conferences of 1899 and 1907, decades before, and unrelated to, the 1995 Mekong agreement.
- key: q134
  type: mcq
  concept: general-and-specialized-international-law
  difficulty: 2
  stem: Which two 'routes' does the lecture describe for addressing issues of shared or common concern?
  options:
  - text: The nationalist route (addressing an issue domestically only) and the internationalist route (bringing states together).
    correct: true
    why: "Correct — the slide lists 'Two potential routes: the nationalist route, the internationalist route (increasingly more efficient)', and the lecture explains the nationalist route means addressing an issue 'domestically only'."
  - text: The bilateral route and the multilateral route, as defined by the number of states involved in a single treaty.
    why: Wrong — 'bilateral' and 'multilateral' are not the terms this week's materials use; the two routes given are specifically the nationalist and internationalist routes.
  - text: The consent route and the enforcement route.
    why: Wrong — these are not the two routes described for addressing shared concerns; consent and enforcement are separate concepts discussed elsewhere in this week's material.
- key: q135
  type: mcq
  concept: general-and-specialized-international-law
  variant-of: q134
  difficulty: 2
  stem: Which route does the lecture describe as 'increasingly more efficient' for addressing issues of shared concern?
  options:
  - text: The internationalist route.
    correct: true
    why: Correct — the slide labels the internationalist route as '(increasingly more efficient)', in contrast with the nationalist route of addressing an issue only domestically.
  - text: The nationalist route.
    why: Wrong — it is the internationalist route, not the nationalist route, that the slide marks as increasingly more efficient.
  - text: Neither route is described as more efficient than the other.
    why: Wrong — the slide explicitly labels the internationalist route as increasingly more efficient, so the materials do favour one route over the other.
- key: q136
  type: mcq
  concept: general-and-specialized-international-law
  difficulty: 1
  stem: Which of these is given as an example of an 'issue of shared concern' (a global or transboundary issue)?
  options:
  - text: Pandemics and access to medicines and vaccines.
    correct: true
    why: "Correct — the slide lists 'Issues of Shared Concern (issues of global/transboundary nature): Pandemics/epidemics, access to medicines & vaccines', with global trade and climate change added in the lecture discussion."
  - text: A dispute over a single company's trademark registered in only one country.
    why: Wrong — a single-country trademark dispute is not transboundary or global in nature, unlike the shared-concern examples the lecture gives (pandemics, trade, climate change).
  - text: A local zoning dispute about a single building's height.
    why: Wrong — a local zoning dispute is a purely domestic planning matter, not an issue of global or transboundary concern of the kind discussed this week.
- key: q137
  type: mcq
  concept: general-and-specialized-international-law
  difficulty: 4
  stem: "A student writes: 'Since the law of the sea is 'special' international law, it can never overlap with 'general' topics like state responsibility.' Why is this wrong?"
  contrasts-with:
  - defining-international-law
  options:
  - text: The general/special distinction is a way of categorising topics, not a rule that special regimes are legally sealed off from general international law — exam problems regularly combine both, as with the migrant-rescue example.
    correct: true
    why: "Correct — the materials show regimes 'do not operate in silo': the migrant-rescue scenario, for instance, draws on the law of the sea (special) together with human rights and potentially other regimes, and state responsibility (general) can arise wherever any regime's rules are breached."
  - text: This is correct — once a topic is classified as 'special', it never interacts with any 'general' topic in an exam problem.
    why: Wrong — this directly contradicts the lecture's point that regimes 'do not operate in silo' and that exam problems often draw on several regimes, general and special, at once.
  - text: This is correct, because 'general' and 'special' international law are governed by two completely separate courts.
    why: Wrong — the materials do not describe separate court systems for general versus special international law; the general/special distinction is about subject matter, not about jurisdiction being split between different courts.
- key: q138
  type: mcq
  concept: general-and-specialized-international-law
  variant-of: q121
  difficulty: 3
  stem: Which of the following pairs is correctly matched as (general international law topic) — (special international law regime)?
  options:
  - text: Diplomatic Protection — International Energy Law.
    correct: true
    why: Correct — Diplomatic Protection appears under 'General International Law' and International Energy Law under 'Special International Law' on the slide, making this the accurately matched general/special pair.
  - text: International Trade Law — Peaceful Settlement of Disputes.
    why: "Wrong — this reverses the categories: International Trade Law is listed under 'Special International Law', while Peaceful Settlement of Disputes is listed under 'General International Law'."
  - text: Statehood & Recognition — Sources.
    why: Wrong — both Statehood & Recognition and Sources are listed under 'General International Law' on the slide; this pair does not illustrate a general/special contrast at all.
- key: q139
  type: truefalse
  concept: general-and-specialized-international-law
  set: quickfire
  difficulty: 1
  statement: The high seas, outer space and Antarctica are all described in the lecture as 'global commons' that belong to no state in particular.
  answer: true
  why: "True — the lecture names exactly these three as global commons: 'the IC is one. The outer space is one. Antarctica is also a global common.'"
- key: q140
  type: truefalse
  concept: general-and-specialized-international-law
  set: quickfire
  difficulty: 2
  statement: According to the lecture, the different regimes of international law always operate independently and never need to be combined to resolve a single dispute.
  answer: false
  why: False — the lecture is explicit that regimes 'do not operate in silo' and that a single scenario, such as a migrant rescue at sea, can draw on migration law, the law of the sea and human rights law all at once.
