- key: q080
  type: short
  concept: history-nineteenth-century-to-un
  difficulty: 3
  prompt: Trace the line from nineteenth-century positivism to the United Nations, naming at least three instruments or institutions along the way.
  model: |
    Nineteenth-century positivism held that the only true source of law was state will — consent, not
    fairness or divine justice — and it produced a wave of formal institutions built on that consent:
    the International Telegraph Union (1865), the Universal Postal Union (1874), and the Hague
    Conferences of 1899 and 1907, which regulated the conduct of war and established the Permanent Court
    of Arbitration. Colonialism nonetheless continued throughout this period, with 90 per cent of Africa
    under European control by 1914. The First World War (1914-1918) then interrupted this progress, but
    the interwar period tried to build on it: the League of Nations (1919) obliged states to submit
    disputes likely to cause conflict to adjudication or inquiry, the 1928 Kellogg-Briand Pact went
    further by committing states to renounce war as an instrument of national policy, and the Permanent
    Court of International Justice (1920) built a body of case law still cited today. After the atrocities
    of the Second World War (1939-1945), the Nuremberg trials (1945-46) began international criminal law,
    and the League of Nations was replaced by the United Nations (1946), whose Charter entrenched sovereign
    equality, self-determination and a ban on the use of force, and created the Security Council and
    General Assembly. The line runs, in short, from consent-based positivist institutions, through two
    world wars and their attempted legal responses (the League, Kellogg-Briand, the PCIJ), to the UN
    Charter's more entrenched framework of peace, security and sovereign equality.
  rubric:
  - id: r1
    criterion: Explains nineteenth-century positivism accurately
    marks: 2
    top-band: States that positivism grounds obligation in state consent/will, and gives at least one nineteenth-century institution as an example.
    margin-note: Get the definition of positivism right before tracing forward.
    authorities: []
  - id: r2
    criterion: Names at least three instruments/institutions in the correct order
    marks: 3
    top-band: Correctly sequences institutions such as the League of Nations, the Kellogg-Briand Pact, the PCIJ, and the UN Charter.
    margin-note: Dates and order matter here — don't just list institutions at random.
    authorities: []
  - id: r3
    criterion: Connects the sequence to the UN's founding principles
    marks: 1
    top-band: Shows how earlier developments (consent, adjudication obligations, banning war) feed into the UN Charter's framework.
    margin-note: A strong answer explains continuity, not just a list of dates.
    authorities: []
- key: q081
  type: mcq
  concept: international-law-as-living-process
  difficulty: 1
  set: pretest
  stem: According to the lecture, what changes and evolves international law as a 'living process'?
  options:
  - text: The existence of new interests and technologies, which change the practices and expectations of sovereign governments.
    correct: true
    why: Correct — the slide defines international law as a living process that 'changes and evolves as those practices and/or expectations are changed by the existence of new interests and technologies.'
  - text: Only formal amendments passed by the UN Security Council.
    why: Wrong — the 'living process' description is much broader than Security Council amendments; it covers changing practices and expectations generally, driven by new interests and technologies.
  - text: Nothing — the lecture describes international law as fixed and unchanging once a treaty is signed at least on the account this week's lecture and slides give.
    why: Wrong — this is the opposite of the lecture's point, which is precisely that international law is a living, evolving process, not a fixed and unchanging one.
- key: q082
  type: mcq
  concept: international-law-as-living-process
  difficulty: 2
  stem: Which two general mechanisms does the lecture give for how international law evolves?
  options:
  - text: Through the adoption of new treaties, and through the modification of existing treaties.
    correct: true
    why: Correct — the lecture states international law 'evolves in different ways, notably through the adoption of new treaties, but also through the modification of existing treaties.'
  - text: Through General Assembly resolutions alone, since these are always binding on member states.
    why: Wrong — General Assembly resolutions are explicitly described as not binding, since 'the General Assembly cannot create binding obligations on states'; they are not, on their own, one of the two mechanisms given.
  - text: Through decisions of domestic courts, which automatically become binding international law.
    why: Wrong — domestic court decisions are not described anywhere in this week's materials as a mechanism by which international law itself evolves.
- key: q083
  type: mcq
  concept: international-law-as-living-process
  variant-of: q082
  difficulty: 2
  stem: How can an existing treaty be modified, according to the lecture?
  options:
  - text: By adding new provisions, amending existing provisions, or adopting protocols that are added to the treaty but form a whole with it.
    correct: true
    why: Correct — the lecture states 'treaties can be modified by adding new provisions, amending provisions of a treaty', and 'it can be that we will adopt protocols that will be added to the treaty, but that will form all with the treaty.'
  - text: Only by terminating it entirely and negotiating a brand-new treaty from scratch.
    why: Wrong — the lecture describes incremental modification (amendment, protocols) as the normal mechanism, not wholesale termination and replacement.
  - text: Only through a ruling of the International Court of Justice ordering the amendment.
    why: Wrong — treaty modification is described as something states do themselves (adding provisions, adopting protocols), not something a court orders.
- key: q084
  type: mcq
  concept: international-law-as-living-process
  difficulty: 2
  stem: Why is customary international law described as 'a very good illustration of law as a living process'?
  options:
  - text: Because it develops through state practice and a belief that the practice is law, so it develops through time and practice rather than through a single legislative act.
    correct: true
    why: Correct — the lecture explains custom needs general state practice 'and then a belief that this is law, or at least how the law should be', so 'it's through times and through practice that law develops... a very good illustration of law as a living process.'
  - text: Because customary law is always written down in a single authoritative treaty text.
    why: Wrong — this is the opposite of customary law's nature; it is unwritten practice plus belief, not a single treaty text, which is what makes it a distinctively gradual, evolving source.
  - text: Because customary law only applies to states that have expressly ratified it in writing which is a plausible-sounding claim but not one this week's sources actually make.
    why: Wrong — customary law binds through general practice and belief (opinio juris-style reasoning), not through express written ratification, which is the mark of treaty law instead.
- key: q085
  type: mcq
  concept: international-law-as-living-process
  variant-of: q084
  difficulty: 2
  stem: What two elements does the lecture say custom needs?
  options:
  - text: General state practice, and a belief that the practice is law (or at least how the law should be).
    correct: true
    why: Correct — the lecture states 'you have two elements to custom... state practice, which is usually quite, needs to be general, and then a belief that this is law, or at least how the law should be.'
  - text: A formal vote at the UN General Assembly, and ratification by two-thirds of UN member states.
    why: Wrong — this describes a treaty-like or voting process, not the two elements of custom given in the lecture, which are general practice and a belief the practice is law.
  - text: A written treaty text, and a reservation entered by at least one state.
    why: Wrong — customary international law is by definition unwritten practice, not a written treaty text with reservations, which belongs to treaty law.
