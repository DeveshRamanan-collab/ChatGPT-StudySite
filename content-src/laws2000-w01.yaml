- key: q060
  type: short
  concept: history-ancient-to-westphalia
  difficulty: 3
  prompt: Explain why the Peace of Westphalia (1648) is treated as a turning point in the history of international law, referring to at least one earlier idea it built on or displaced.
  model: |
    The Peace of Westphalia (1648) — the Peace Treaties of Munster and Osnabruck, ending the Thirty
    Years' War — is treated as a turning point because it supplied something the earlier natural-law and
    jus gentium debates had not: a single, clear source of authority for organising the world. Before
    1648, thinkers such as Grotius distinguished natural law (universal, existing 'within nature') from
    jus gentium (human-made law, 'variable in time and place', whose validity rested on states' consent
    rather than natural reason), and Vitoria had used natural law to argue that even native populations
    of the New World were entitled to its protection. These theories asked what higher or shared standard
    should govern relations between communities, but did not by themselves organise the world into
    discrete, authoritative units. Westphalia did exactly that: it organised 'territory and individuals
    into sovereign states' out of a 'need for a system that contained a clear source of authority', and is
    described as the 'birth of the notion of sovereignty' — an authority with absolute and indivisible
    power over people and territory. In that sense Westphalia did not so much refute jus gentium as give
    it a new, state-shaped container: once sovereign states existed as the basic units, jus gentium's
    state consent could operate between clearly defined sovereigns rather than the overlapping political
    and religious authorities (the Holy Roman Empire, the Catholic Church) of the late Middle Ages.
  rubric:
  - id: r1
    criterion: States what Westphalia established
    marks: 2
    top-band: Clearly identifies the organisation of territory and people into sovereign states, and the birth of sovereignty.
    margin-note: This is the core historical claim — state it precisely.
    authorities: []
  - id: r2
    criterion: Connects to at least one earlier idea (natural law, jus gentium, or the overlapping authorities of the Middle Ages)
    marks: 2
    top-band: Accurately describes the earlier idea and shows how Westphalia responds to or reshapes it.
    margin-note: Don't just name-drop Grotius or Vitoria — show the link to Westphalia.
    authorities: []
  - id: r3
    criterion: Explains why this counts as a 'turning point' rather than just another development
    marks: 2
    top-band: Explains that Westphalia supplied a clear, singular source of authority that earlier theories, on their own, did not.
    margin-note: A strong answer justifies the word 'turning point', not just recites dates.
    authorities: []
- key: q061
  type: mcq
  concept: history-nineteenth-century-to-un
  difficulty: 1
  set: pretest
  stem: What was the central idea of nineteenth-century positivism, as described in the lecture?
  options:
  - text: The only true source of law is state will — not fairness, not divine justice, but consent to be bound by a legal obligation.
    correct: true
    why: "Correct — the slide states 'Positivism: the only true source of law is State will. Not fairness, not divine justice but consent to be bound by a legal obligation.'"
  - text: The idea that international law should be based on universal, unchanging natural law principles.
    why: Wrong — this describes jus naturale (natural law), the theory positivism displaced as dominant, not positivism itself, which grounds law in state consent rather than universal natural principles.
  - text: The idea that only the Catholic Church could authorise binding rules between states.
    why: Wrong — this describes the earlier medieval period dominated by the Holy Roman Empire and the Catholic Church, not nineteenth-century positivism, which is secular and state-centred.
- key: q062
  type: mcq
  concept: history-nineteenth-century-to-un
  difficulty: 2
  stem: Why does the lecture connect the rise of positivism to the Enlightenment?
  options:
