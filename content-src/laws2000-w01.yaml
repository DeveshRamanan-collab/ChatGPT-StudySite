questions:
- key: q001
  type: mcq
  concept: defining-international-law
  difficulty: 1
  set: pretest
  stem: Which definition of public international law comes from the Office of International Law, Attorney-General's Department, Australian Government?
  options:
  - text: Rules and principles which facilitate the conduct of states and international organisations in their relations with one another and, in some cases, with individuals, groups and transnational companies.
    correct: true
    why: "This is the exact wording the lecture attributes to the AG's Department: a functional definition built around who international law facilitates relations between."
  - text: A body of law that only applies once two states have gone to war with one another.
    why: Tempting because international law is often reported on in the context of conflict, but the AG's definition is much broader than war — it covers ordinary relations between states, organisations and, sometimes, individuals.
  - text: A set of moral guidelines that states are encouraged, but never required, to follow though this would need to be checked against the specific facts before being relied on in an exam answer a rule that would need to be read together with the general principles covered this week.
    why: Wrong — the AG's definition describes binding rules and principles, not optional moral guidance, and this week's materials treat international law as genuinely binding law.
- key: q002
  type: mcq
  concept: defining-international-law
  variant-of: q001
  difficulty: 1
  stem: A classmate says the AG's Department defines international law as rules for individuals suing companies abroad. What is wrong with this description?
  options:
  - text: The AG's definition is centred on states and international organisations, with individuals, groups and companies only sometimes included.
    correct: true
    why: Correct — the definition's primary subjects are states and international organisations; individuals, groups and transnational companies appear only 'in some cases', not as the main focus.
  - text: Nothing is wrong; that is exactly what the AG's Department says international law is.
    why: Wrong — this inverts the definition's emphasis, making individuals suing companies the main subject when the AG's Department in fact centres states and international organisations.
  - text: The AG's Department does not define international law at all in the lecture materials.
    why: Wrong — the AG's Office of International Law definition is quoted directly on the slides and read out in the lecture.
- key: q003
  type: mcq
  concept: defining-international-law
  difficulty: 2
  stem: What does the Practitioner's Guide to International Law's definition particularly insist on?
  options:
  - text: The voluntary nature of international law — states recognise it as 'law' by consenting to and adhering to agreed standards.
    correct: true
    why: Correct — the lecture specifically highlights that this definition 'really insists on the voluntary nature of international law', unlike the AG's more functional definition.
  - text: The idea that international law is enforced by an international police force.
    why: Wrong — the Practitioner's Guide says nothing about a police force, and this week's materials stress that international law has no such enforcement mechanism at all.
  - text: The idea that international law binds only the five permanent members of the Security Council which would need clearer support from this week's materials before it could be relied on.
    why: Wrong — the definition describes international law as 'universally applicable and authoritative for all States', not limited to any small group of states.
- key: q004
  type: mcq
  concept: defining-international-law
  variant-of: q003
  difficulty: 2
  stem: According to the Practitioner's Guide's definition, what can Australian lawyers do when they practise international law?
  options:
  - text: Hold Australia to account for its international obligations, or promote Australia's interests in international fora.
    correct: true
    why: "This tracks the definition directly: Australian lawyers' practice 'can include holding Australia to account for its international obligations [or promoting Australia's interests in the international fora]'."
  - text: Override decisions of the High Court of Australia whenever a treaty is involved.
    why: Wrong — nothing in the definition suggests international law overrides domestic courts; the lecture later flags the relationship between international and national law as a separate, more complicated topic.
  - text: Prosecute foreign heads of state directly before the Federal Court of Australia.
    why: Wrong — the definition talks about holding Australia to account and promoting its interests, not about Australian lawyers personally prosecuting foreign leaders.
- key: q005
  type: mcq
  concept: defining-international-law
  difficulty: 2
  stem: In S.S. Lotus, what does the Permanent Court of International Justice say restrictions upon a state's independence cannot be?
  cases:
  - ss-lotus-france-v-turkey
  options:
  - text: Presumed.
    correct: true
    why: "This is the PCIJ's own word: 'Restrictions upon the independence of States cannot therefore be presumed' — a state is free to act unless a rule actually binds it."
  - text: Enforced by any international tribunal whatsoever, however clearly the state has consented to them.
    why: Wrong — Lotus is about whether a restriction exists at all (it cannot be presumed), not about whether an already-existing, consented-to restriction can be enforced.
  - text: Written into a treaty that has not yet been ratified by the state concerned.
    why: Wrong — Lotus does not discuss unratified treaties specifically; its point is broader, about presuming restrictions on independence in general.
- key: q006
  type: mcq
  concept: defining-international-law
  variant-of: q005
  difficulty: 3
  stem: State A argues it is free to regulate a new form of satellite communication because no treaty or custom yet forbids it. Which authority best supports State A?
  cases:
  - ss-lotus-france-v-turkey
  options:
  - text: S.S. Lotus, because restrictions on a state's independence cannot be presumed in the absence of consent.
    correct: true
    why: Correct application — Lotus holds that rules bind states only through their own consent (convention or usage), so absent such a rule, a state's freedom to act is presumed, not restricted.
  - text: The Practitioner's Guide, because it says international law is universally applicable to all states regardless of consent.
    why: Wrong — the Practitioner's Guide actually stresses voluntary consent as the basis of obligation, which does not support an argument for unrestricted freedom to act without any legal test.
  - text: The AG's Department's definition, because it focuses on relations with individuals and companies rather than states.
    why: Wrong — the AG's definition is a general description of subject matter; it does not supply the specific legal test (consent via convention or usage) that Lotus provides for this argument.
- key: q007
  type: mcq
  concept: defining-international-law
  difficulty: 1
  stem: Which of the three definitions studied this week was given by a court, rather than a government department or a textbook?
  options:
  - text: The Permanent Court of International Justice's statement in S.S. Lotus.
    correct: true
    why: Correct — Lotus is a 1927 PCIJ decision, unlike the AG's Department (a government body) and the Practitioner's Guide (a textbook).
  - text: The Office of International Law, Attorney-General's Department definition.
    why: Wrong — this definition comes from an Australian government department, not from a court.
  - text: The Practitioner's Guide to International Law definition.
    why: Wrong — the Practitioner's Guide is a textbook aimed at legal practitioners, not a judicial decision.
- key: q008
  type: mcq
  concept: defining-international-law
  difficulty: 2
  stem: The Final Act of the International Meridian Conference (1884) is used in the lecture to illustrate what point?
  options:
  - text: That international law regulates everyday matters — like how time zones are organised — not only high-profile disputes between states.
    correct: true
    why: Correct — the lecture uses the way we tell the time as an example that 'international law is everywhere', regulating mundane, everyday matters most people never think of as legal.
  - text: That the International Court of Justice has compulsory jurisdiction over time-zone disputes though the precise scope of this claim is not spelled out in this week's materials.
    why: Wrong — the Meridian Conference example is about international law's everyday reach, and has nothing to do with the ICJ's jurisdiction, which is a separate topic.
  - text: That customary international law can never be codified into a treaty.
    why: Wrong — the Meridian Conference's Final Act is itself an example of states agreeing on a rule (Greenwich as the reference meridian), not an argument against codification.
- key: q009
  type: mcq
  concept: defining-international-law
  variant-of: q008
  difficulty: 2
  stem: Besides the way we tell time, which other everyday example does the lecture use to show international law 'is everywhere'?
  options:
  - text: The safety and functional standards cars must meet, set by the Global Technical Regulations for Wheeled Vehicles 1998.
    correct: true
    why: Correct — the slide lists 'the cars you drive & their functions', linked to the Global Technical Regulations for Wheeled Vehicles 1998, alongside time zones, products and food, and the internet.
  - text: The rules of chess, as codified by an international sporting body.
    why: Wrong — chess is not among the examples the lecture uses; the listed everyday examples are time zones, cars, products and food, and internet/cloud services.
  - text: The design of national flags.
    why: Wrong — flag design is not one of the 'international law is everywhere' examples given in this week's materials.
- key: q010
  type: mcq
  concept: defining-international-law
  variant-of: q008
  difficulty: 2
  stem: The lecture notes that even 'this lecture!' — delivered using internet and cloud services — depends on international law. Which instruments does it link to that example?
  options:
  - text: The Constitution of the International Telecommunications Union (1865) and the Space Treaty (1967).
    correct: true
    why: Correct — the slide pairs 'this lecture!' (internet & cloud services) with the Constitution of the International Telecommunications Union, 1865, and the Space Treaty, 1967.
  - text: The Universal Postal Union (1874) and the Declaration of Paris (1856) a distinction that matters more in some fact patterns than others.
    why: Wrong — these are nineteenth-century positivist-era institutions discussed later in the history material, not the instruments linked to the internet/cloud-services example.
  - text: The Kellogg-Briand Pact (1928) and the UN Charter (1945).
    why: Wrong — these instruments concern the use of force and the UN's founding, not the internet-and-cloud-services example on the 'international law is everywhere' slide.
- key: q011
  type: mcq
  concept: defining-international-law
  difficulty: 3
  stem: "A student writes: 'International law only becomes relevant once you cross a border or deal with a foreign government.' Using this week's material, what is the best response?"
  options:
  - text: International law also governs everyday, seemingly domestic matters — like time zones, vehicle standards, and internet infrastructure — that most people never notice.
    correct: true
    why: Correct — the 'international law is everywhere' section directly rebuts this idea, showing international law shapes ordinary domestic life through agreed technical and administrative standards.
  - text: This is correct, because international law by definition only applies to disputes between two or more governments.
    why: Wrong — this contradicts the lecture's own point that international law reaches individuals, companies and everyday technical standards, not only inter-governmental disputes.
  - text: This is correct, because customary international law only develops once a border dispute has occurred.
    why: Wrong — customary international law develops from general state practice and a belief that it is legally binding; it has nothing to do with border disputes specifically.
- key: q012
  type: mcq
  concept: defining-international-law
  difficulty: 3
  stem: A study guide claims that 'defining international law' means the same thing as 'listing the topics international law covers, such as sources, treaties and statehood'. Why is this wrong?
  contrasts-with:
  - general-and-specialized-international-law
  options:
  - text: Defining international law explains what makes a rule binding and on whom, whereas listing topics only maps the subject areas the field is divided into.
    correct: true
    why: Correct — this week distinguishes defining international law (the AG's, Practitioner's Guide's and Lotus's answers to 'what is it and why does it bind states') from categorising its topics into general and special international law, which is a different exercise.
  - text: It is not wrong — defining international law and listing its topics are treated as identical exercises in the lecture.
    why: Wrong — the lecture treats 'Defining International Law' (Part A) and the general/special topic list as related but distinct parts of the same lecture, not as the same exercise.
  - text: It is wrong only because the list of topics is incomplete, not because the two exercises are different kinds of question though this depends on details this week's materials do not fully specify.
    why: Wrong — the core problem is a category error (conflating a definition with a topic list), not merely that a particular list happens to be incomplete.
- key: q013
  type: mcq
  concept: defining-international-law
  difficulty: 1
  stem: How many separate definitions of public international law does the lecture present in Part A?
  options:
  - text: Three.
    correct: true
    why: Correct — the lecturer explicitly says 'I have three definitions of public international law that I will show you', from the AG's Department, the Practitioner's Guide, and the PCIJ in Lotus.
  - text: One, because all textbooks agree on a single settled definition of international law.
    why: Wrong — the lecture presents three quite different definitions precisely because there is no single settled formulation, each emphasising a different aspect.
  - text: Five, matching the five permanent members of the UN Security Council.
    why: Wrong — there is no connection between the number of definitions given and the five permanent Security Council members; three definitions are given.
- key: q014
  type: mcq
  concept: defining-international-law
  variant-of: q003
  difficulty: 1
  stem: Which two features does the Practitioner's Guide's definition explicitly attribute to international law?
  options:
  - text: It is universally applicable and authoritative for all states.
    correct: true
    why: "Correct — the quoted text opens with exactly this phrase: international law 'by definition is universally applicable and authoritative for all States'."
  - text: It is optional for developed states but compulsory for developing states.
    why: Wrong — nothing in the definition distinguishes between developed and developing states; it describes universal applicability to all states.
  - text: It applies only to states that are members of the Commonwealth.
    why: Wrong — the definition is not limited to any particular grouping of states such as the Commonwealth; it claims universal applicability.
- key: q015
  type: mcq
  concept: defining-international-law
  variant-of: q005
  difficulty: 4
  stem: Two states dispute whether a decades-old, unwritten practice between them is legally binding. Which of this week's authorities is most directly on point, and why?
  cases:
  - ss-lotus-france-v-turkey
  options:
  - text: S.S. Lotus, because it addresses how usages generally accepted as expressing legal principles can bind states through their own free will.
    correct: true
    why: Correct — Lotus states that binding rules 'emanate from [states'] own free will as expressed in conventions or by usages generally accepted as expressing principles of law', which is exactly the question an unwritten, long-standing practice raises.
  - text: The AG's Department's definition, because it lists individuals, groups and transnational companies as possible subjects of international law.
    why: Wrong — that definition's point about individuals, groups and companies has nothing to do with whether an unwritten interstate practice is legally binding.
  - text: The Practitioner's Guide, because it discusses the role of Australian lawyers before Australian courts.
    why: Wrong — the Practitioner's Guide's point about Australian lawyers' role does not address the legal test for whether an unwritten practice between states has become binding.
- key: q016
  type: mcq
  concept: defining-international-law
  difficulty: 3
  stem: Why does the lecture use three definitions instead of settling on just one?
  options:
  - text: Because the definitions are 'all quite different' and each insists on a different aspect of what international law is and does.
    correct: true
    why: Correct — the lecturer says the three definitions 'are all quite different. They insist on different, I guess, aspects of what is international law', using all three to build a fuller picture.
  - text: Because only one of the three definitions is actually correct, and the other two are outdated.
    why: Wrong — the lecture never says any definition is wrong or outdated; instead it treats all three as valid but partial, each highlighting something different.
  - text: Because international law has no agreed subjects, so no single definition could possibly apply to everyone.
    why: Wrong — this overstates the point; the lecture is clear that international law does have agreed primary subjects (states), even while using multiple definitions to describe the field.
- key: q017
  type: truefalse
  concept: defining-international-law
  set: quickfire
  difficulty: 1
  statement: The Attorney-General's Department's definition of international law focuses mainly on relations between states and international organisations.
  answer: true
  why: True — the AG's definition centres on 'the conduct of states and international organisations in their relations with one another', with individuals, groups and companies mentioned only as sometimes-included subjects.
- key: q018
  type: truefalse
  concept: defining-international-law
  set: quickfire
  difficulty: 2
  statement: The S.S. Lotus case holds that a restriction on a state's independence can be presumed even without the state's consent.
  answer: false
  why: "False — Lotus holds the opposite: 'Restrictions upon the independence of States cannot therefore be presumed', so a restriction needs an actual source (convention or usage), not a presumption."
- key: q019
  type: truefalse
  concept: defining-international-law
  set: quickfire
  difficulty: 1
  statement: According to the lecture, international law only ever appears in the news, not in everyday activities like driving a car or setting a clock.
  answer: false
  why: False — the lecture's whole point in the 'international law is everywhere' section is that it also governs mundane, everyday activities such as time zones and vehicle standards, not just newsworthy disputes.
- key: q020
  type: short
  concept: defining-international-law
  difficulty: 2
  prompt: Using two of the three definitions studied this week, explain how 'consent' does different work in each.
  model: |
    The Practitioner's Guide and S.S. Lotus both put consent at the centre of international law, but at
    different points in the analysis. The Practitioner's Guide uses consent to explain why international
    law counts as 'law' at all despite having no world legislature: states 'recognise international law
    as "law" by voluntarily consenting and adhering to agreed standards' — consent is what gives the
    whole system its authority. Lotus uses consent more narrowly, as the specific test for whether any
    particular rule binds a particular state: rules 'emanate from [states'] own free will as expressed in
    conventions or by usages', so a restriction on a state's independence 'cannot therefore be presumed'
    without it. In short, the Practitioner's Guide's consent explains why the system of international law
    is authoritative in general, while Lotus's consent supplies the test for whether one specific rule
    binds one specific state. A strong exam answer keeps these two uses of 'consent' separate rather than
    treating every reference to consent as making the same point.
  rubric:
  - id: r1
    criterion: Identifies the Practitioner's Guide's use of consent
    marks: 2
    top-band: States clearly that voluntary consent explains why international law counts as binding 'law' at all.
    margin-note: Good — this is the system-level role of consent.
    authorities: []
  - id: r2
    criterion: Identifies Lotus's use of consent
    marks: 2
    top-band: States clearly that consent (via convention or usage) is the specific test for whether a rule binds a given state, and that restrictions cannot be presumed.
    margin-note: Good — this is the rule-level role of consent.
    authorities: []
  - id: r3
    criterion: Distinguishes the two roles rather than conflating them
    marks: 2
    top-band: Explicitly contrasts 'consent explains the system' with 'consent tests the rule', rather than treating both quotes as making an identical point.
    margin-note: This distinction is what separates a strong answer from a merely descriptive one.
    authorities: []
- key: q021
  type: mcq
  concept: sovereign-equality-and-consent
  difficulty: 1
  set: pretest
  stem: What does the lecture say happens if a state does not want to sign up for a treaty?
  options:
  - text: No other state can compel it to sign up — treaties bind a state only if it consents.
    correct: true
    why: "Correct — the lecture states plainly: 'no state can compel another state to sign up for a treaty if that state doesn't want to', because binding force rests on consent."
  - text: The UN Security Council can order it to ratify the treaty within twelve months.
    why: Wrong — nothing in the materials gives the Security Council power to force a state to ratify a treaty; treaty ratification remains a matter of that state's own consent.
  - text: The treaty automatically applies to it once a majority of other states have ratified it.
    why: Wrong — this describes majority voting in an organisation like the General Assembly, not how treaties bind states, which requires that state's own consent.
- key: q022
  type: mcq
  concept: sovereign-equality-and-consent
  variant-of: q021
  difficulty: 1
  stem: A state refuses to ratify a new trade treaty that most of its neighbours have joined. What is the legal consequence for that state, according to this week's materials?
  options:
  - text: The treaty does not bind it, because states cannot impose their will on one another and there is no rule of international law binding on a state unless it has consented.
    correct: true
    why: Correct application of the consent principle — the lecture is explicit that a state's non-consent means the treaty simply does not bind it, whatever its neighbours decide.
  - text: The treaty automatically binds it under customary international law after five years regardless of its objection at least on the account this week's lecture and slides give.
    why: Wrong — nothing in the materials suggests a fixed time period after which a state becomes bound to a treaty it refused to join; consent, not the passage of time, is what binds a state to a treaty.
  - text: The treaty binds it only within the territory covered by the Peace of Westphalia.
    why: Wrong — the Peace of Westphalia is a seventeenth-century historical event establishing the state system, not a geographic limit on which states a modern treaty can bind.
- key: q023
  type: mcq
  concept: sovereign-equality-and-consent
  difficulty: 2
  stem: Which of these is an example of implicit, rather than express, consent to be bound by international law?
  options:
  - text: Following a customary practice in the belief that it is legally required.
    correct: true
    why: "Correct — the lecture explains that consent can also be implicit, through customary practices states follow because of their belief that the practice is legally binding: this is customary international law."
  - text: Signing and ratifying a bilateral trade agreement.
    why: Wrong — signing and ratifying a treaty is the paradigm example of express consent, not implicit consent.
  - text: Voting in favour of a resolution at the UN General Assembly.
    why: Wrong — voting for a resolution is an express act, and in any case General Assembly resolutions are not binding treaties at all.
- key: q024
  type: mcq
  concept: sovereign-equality-and-consent
  difficulty: 2
  stem: Why does China (population 1.4 billion) get exactly the same one vote as Malta (population half a million) in the UN General Assembly?
  options:
  - text: Because of the principle of sovereign equality — each state has the right to be considered on an equal basis with every other state.
    correct: true
    why: "Correct — the lecture uses precisely this China/Malta comparison to illustrate sovereign equality: 'you will have equal standing in international law', regardless of population."
  - text: Because the UN Charter allocates votes according to each state's contribution to the UN budget which is a plausible-sounding claim but not one this week's sources actually make.
    why: Wrong — budget contributions affect financial obligations in some international organisations, but General Assembly voting is one state, one vote regardless of financial contribution.
  - text: Because Malta has a special exemption negotiated when it joined the United Nations.
    why: Wrong — there is no individual exemption for Malta; every UN member state has one equal vote as a matter of general principle, not a negotiated exception.
- key: q025
  type: mcq
  concept: sovereign-equality-and-consent
  variant-of: q024
  difficulty: 1
  stem: Sovereign equality is described in the lecture as the international-law equivalent of which broader idea?
  options:
  - text: That all humans are born equal and remain free and benefit from equal rights.
    correct: true
    why: "Correct — the lecture draws this explicit analogy: 'Sovereign equality is the equivalent to the principle that all humans are born equal and remain free and benefit from equal rights.'"
  - text: That every individual has the right to a fair trial before an impartial tribunal.
    why: Wrong — while a real legal principle, this is not the analogy the lecture draws for sovereign equality, which is compared to the equality of all humans generally, not fair-trial rights specifically.
  - text: That every citizen has the right to vote in their own state's elections.
    why: Wrong — the lecture's analogy is to universal human equality and freedom, not specifically to domestic electoral rights.
- key: q026
  type: mcq
  concept: sovereign-equality-and-consent
  difficulty: 2
  stem: What is the practical effect of states being able to choose which legal obligations they are bound by?
  options:
  - text: States end up with different rights and obligations at the international level, since some ratify a given treaty while others do not.
    correct: true
    why: Correct — the lecture notes 'certain states will decide to ratify a treaty, whereas other states will decide not to ratify that same treaty', so 'we end up having states that have different obligations and rights'.
  - text: Every state ends up bound by exactly the same set of treaties, because ratification is compulsory once a treaty is opened for signature.
    why: Wrong — ratification is never described as compulsory; a state's choice to ratify or not is exactly what produces different obligations between states.
  - text: The International Court of Justice assigns each state a standard package of treaty obligations regardless of what it has signed.
    why: Wrong — the ICJ does not assign treaty obligations to states; obligations flow from each state's own choice to consent.
- key: q027
  type: mcq
  concept: sovereign-equality-and-consent
  variant-of: q024
  difficulty: 3
  stem: A newly independent micro-state with a tiny population joins the United Nations. Based on the principle of sovereign equality, what follows about its status?
  options:
  - text: It has the same formal standing and General Assembly vote as any other UN member state, regardless of its size.
    correct: true
    why: Correct application — sovereign equality means every UN member state 'has the right to be considered on an equal basis with one another', exactly as illustrated by the China/Malta comparison.
  - text: It must first accumulate a minimum population before it is entitled to vote in the General Assembly.
    why: Wrong — there is no population threshold for General Assembly voting rights in the materials; sovereign equality applies regardless of population size.
  - text: It is bound by every treaty its larger neighbours have already ratified, since it cannot realistically negotiate on equal terms.
    why: Wrong — this confuses practical bargaining power with legal consent; a small state's obligations still depend on what it has itself consented to, not on what larger neighbours have ratified.
- key: q028
  type: mcq
  concept: sovereign-equality-and-consent
  difficulty: 2
  stem: Which statement best distinguishes sovereign equality from state consent, as used this week?
  contrasts-with:
  - compliance-and-enforcement
  options:
  - text: Sovereign equality is about states counting equally regardless of size or power; consent is about what specifically binds a given state to a given rule.
    correct: true
    why: "Correct — these are related but distinct: sovereign equality concerns formal standing between states (one state, one vote), while consent concerns the specific mechanism by which any one rule comes to bind any one state."
  - text: They are simply two different names for the same idea, and either term can be substituted for the other in an exam answer.
    why: Wrong — treating them as interchangeable would blur formal equality of standing with the separate question of what makes a particular rule binding on a particular state.
  - text: Sovereign equality applies only to treaties, while consent applies only to customary international law.
    why: Wrong — consent underpins both treaty law (ratification) and customary law (accepted practice), and sovereign equality is not limited to treaties either.
- key: q029
  type: mcq
  concept: sovereign-equality-and-consent
  difficulty: 3
  stem: "A student argues: 'Because international law is consent-based, a state that breaks its promises faces no real consequence.' Why does this conflate two separate ideas from this week's materials?"
  contrasts-with:
  - compliance-and-enforcement
  options:
  - text: It conflates the source of a rule's binding force (consent) with whether breaching it has consequences (a separate question addressed under compliance and enforcement).
    correct: true
    why: Correct — this week keeps 'what makes a rule binding' (consent, sovereign equality) analytically separate from 'why do states comply, and what happens if they don't' (reputation, quasi-enforcement), and the student's claim wrongly collapses the two.
  - text: It is correct, because consent-based systems by definition impose no consequences for breach though this would need to be checked against the specific facts before being relied on in an exam answer.
    why: Wrong — the materials specifically discuss reputational costs and quasi-enforcement (suspension or expulsion from an organisation) as real consequences that exist even in a consent-based system.
  - text: It is correct, because only domestic legal systems attach consequences to broken promises.
    why: Wrong — the compliance material this week shows international law does attach consequences (loss of reputation, exclusion from cooperation, quasi-enforcement), even without a domestic-style police force.
