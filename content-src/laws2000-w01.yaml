  - text: Because the Enlightenment led directly to the creation of the United Nations in 1946 though this would need to be checked against the specific facts before being relied on in an exam answer.
    why: Wrong — the UN was created in 1946, roughly a century and a half after the Enlightenment; the two are not linked in the materials in that way.
  - text: Because Enlightenment philosophers drafted the Peace of Westphalia in 1648.
    why: Wrong — Westphalia (1648) predates the Enlightenment (associated with the 18th century) and is linked instead to the birth of sovereignty, not to positivism's rise.
