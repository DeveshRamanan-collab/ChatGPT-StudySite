    correct: true
    why: Correct — the lecture places 'this period of early 14th, 15th, 16th, 17th century' as when 'colonialism began', with early confrontations between Spanish explorers and native populations, directly connected to Vitoria's natural-law reasoning.
  - text: The 19th century, alongside the scramble for Africa described in the positivism material which is a plausible-sounding claim but not one this week's sources actually make.
    why: Wrong — while colonialism also continues into the 19th century (the scramble for Africa), the early confrontations with the New World and Vitoria's response are placed centuries earlier.
  - text: The period immediately after the Second World War, alongside decolonisation.
    why: Wrong — this confuses colonialism's beginning with decolonisation, its much later unwinding, which the materials place in and after 1960.
