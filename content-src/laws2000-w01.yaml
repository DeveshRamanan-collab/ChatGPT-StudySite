- slug: defining-international-law
  title: Defining international law
  visual: explainer
  visual-brief: Three overlapping panels — the AG's, the Practitioner's Guide's and the PCIJ's Lotus definitions — showing what each insists on.
  related:
  - general-and-specialized-international-law
  depends-on: []
  contrasts-with:
  - general-and-specialized-international-law
  cases:
  - ss-lotus-france-v-turkey
  authorities: []
  verify: false
  body: |
    Three working definitions of public international law recur in this unit. The Australian
    Attorney-General's Department's Office of International Law defines it as "rules and principles
    which facilitate the conduct of states and international organisations in their relations with one
    another and, in some cases, with individuals, groups and transnational companies" — a functional
    definition centred on who international law is for. The Practitioner's Guide to International Law
    stresses its voluntary, consent-based nature: international law is "universally applicable and
    authoritative for all States", which "recognise international law as 'law' by voluntarily consenting
    and adhering to agreed standards." The Permanent Court of International Justice, in S.S. Lotus, gave
    the classic statement of where international law's binding force comes from: rules "emanate from
    [states'] own free will as expressed in conventions or by usages generally accepted as expressing
    principles of law", and, crucially, "restrictions upon the independence of States cannot therefore be
    presumed" — states are free to act unless a rule actually binds them, not the reverse.

    Each definition insists on a different aspect: subjects and addressees (the AG's), voluntariness (the
    Practitioner's Guide), or the ultimate source of obligation (Lotus). Together they give an exam
    answer its two moves: identify who the rule addresses, and identify the convention or usage that
    supplies its binding force.

    Exam use: when a problem asks whether something is really international law, reach for Lotus first --
    it supplies a test (consent, expressed in convention or usage), not just a description.
- slug: sovereign-equality-and-consent
  title: Sovereign equality and state consent
  visual: explainer
  visual-brief: A row of equal-sized state tokens (Malta the same size as China), each with one vote, beside a treaty a state must consent to before it binds them.
  related:
  - compliance-and-enforcement
  depends-on:
  - defining-international-law
  contrasts-with:
  - compliance-and-enforcement
  cases: []
  authorities:
  - un-charter-art-2-1
  verify: false
  body: |
    International law rests on state consent: no state can compel another state to sign up for a treaty
    if that state doesn't want to, and there is no treaty and no rule of international law binding on a
    state unless that state has consented to be bound by it. Consent can be express (ratifying a treaty)
    or implicit (following a customary practice in the belief that it is legally binding — customary
    international law). Because consent is individual, states end up with different rights and
    obligations: some ratify a given treaty, others do not.

    Consent sits alongside a separate principle, sovereign equality: each state, however large or small,
    counts equally. In the UN General Assembly, China (population 1.4 billion) and Malta (population half
    a million) each have one vote; decisions in most international organisations are taken by a majority
    in which every member's vote carries the same weight (Art 2, UN Charter). Sovereign equality is the
    international-law equivalent of the idea that all humans are born equal and remain free, and it
    underpins the whole UN framework, alongside self-determination.

    Consent and sovereign equality together explain why international law cannot simply impose
    obligations the way a domestic parliament can: states are the makers of international law and its
    subjects at once.

    Exam use: when a problem turns on whether a state is bound, ask what it actually consented to --
    never assume a rule binds a state just because most other states accept it.
- slug: history-ancient-to-westphalia
  title: "History I: the polis to Westphalia"
  visual: timeline
  visual-brief: A horizontal timeline from the Greek polis through Rome, Vitoria, Grotius and Vattel to 1648, each node opening onto its key idea.
  related:
  - history-nineteenth-century-to-un
  depends-on: []
  contrasts-with:
  - history-nineteenth-century-to-un
  cases: []
  authorities: []
  verify: false
  body: |
    International law's history is usually traced from ancient cultures with mutual expectations about how
    members should behave: the Greek polis (city-state) and "nomos" — restricting natural freedoms for
    expediency and self-interest — and Roman law's jus naturale and jus civile. Thucydides' line that "the
    strong do what they can and the weak suffer what they must" still echoes, inverted, in sovereign
    equality.

    Most textbooks place international law's emergence as a system of law in Europe's late Middle Ages
    (15th-16th centuries), under the Holy Roman Empire and the Catholic Church, and the theory of natural
    law (jus naturale) — universal values governing relations between people. Hugo Grotius (1583-1645)
    secularised natural law and distinguished it from jus gentium, human-made law variable in time and
    place, whose validity rested on states' consent rather than natural reason. Colonialism's early
    confrontations with the New World tested this: Francisco de Vitoria (1483-1546) concluded native
    populations were part of the human race, so natural law applied to them, rejecting "discovery" as a
    justification for conquest. Francisco Suarez and Emmerich de Vattel (Law of Nations) followed, Vattel
    underlining state equality irrespective of power.

    The Peace of Westphalia (1648) — the treaties of Munster and Osnabruck, ending the Thirty Years' War
    — is the "beginning" of the international state system: organising territory and people into states,
    and the birth of "sovereignty" itself.

    Exam use: Westphalia is the hinge — everything before it is about competing sources of authority,
    everything after is about sovereign states.
- slug: history-nineteenth-century-to-un
  title: "History II: positivism to the United Nations"
  visual: timeline
  visual-brief: A second timeline segment, 1815 to 1960, running from positivism's institutions through two world wars to the UN and decolonisation.
  related:
  - history-ancient-to-westphalia
  depends-on:
  - history-ancient-to-westphalia
  contrasts-with:
  - history-ancient-to-westphalia
  cases: []
  authorities:
  - kellogg-briand-pact-1928
  verify: false
  body: |
    The nineteenth century was dominated by positivism: the only true source of law was state will, not
    fairness or divine justice, so states chose which obligations bound them. Positivism produced formal
    institutions: the International Telegraph Union (1865), the Universal Postal Union (1874), the
    Declaration of Paris (1856, limits on capturing private property at sea), the Declaration of St
    Petersburg (1868, banning explosive bullets), and the Hague Conferences (1899, 1907), regulating war
    and creating the Permanent Court of Arbitration. Colonialism continued: by 1914, 90 per cent of Africa
    was under European control.

    After the First World War (1914-1918), the League of Nations (1919) obliged states to submit disputes
    likely to cause conflict to adjudication or inquiry, though it did not itself prohibit war; the 1928
    Kellogg-Briand Pact went further, committing states to refrain from war as an instrument of national
    policy. The Permanent Court of International Justice (1920) — dissolved in 1946, but still cited today
    — was the direct precursor of the International Court of Justice.

    After the Second World War (1939-1945), the Nuremberg trials (1945-46) began international criminal
    law; the UN Charter (1946) replaced the League of Nations, entrenching sovereign equality,
    self-determination and a ban on the use of force, and creating the Security Council and General
    Assembly. The Assembly's 1960 Declaration on decolonisation affirmed self-determination — more than
    80 former colonies have since gained independence.

    Exam use: name the instrument and the year — positivism produced treaties and institutions, not the
    other way around.
- slug: international-law-as-living-process
  title: International law as a living process
  visual: timeline
  visual-brief: A single treaty node sprouting amendments and protocols over time, next to the ozone-emissions graph turning down after 1988/1990.
  related:
  - history-nineteenth-century-to-un
  depends-on: []
  contrasts-with: []
  cases: []
  authorities: []
  verify: false
  body: |
    International law is "a process of continuous interaction between States grounded into practices or
    expectations of sovereign governments" that "changes and evolves... by the existence of new interests
    and technologies" — rights are asserted and duties relied on by reference to agreements or custom. It
    evolves through new treaties, and through modifying existing ones: amending provisions, or adopting
    protocols that form a whole with the parent treaty. Custom, built from general state practice plus a
    belief that the practice is law, is the clearest illustration of law developing through time and
    practice rather than legislation.

    International environmental law shows a regime built almost from scratch since the 1960s. UN
    conferences (the 1972 Human Environment Conference), agencies (the Environment Program, the Food and
    Agriculture Organization) and, crucially, the General Assembly built non-binding momentum — the Rio
    Declaration (1992) — because the Assembly cannot itself create binding obligations. States then turned
    that momentum into binding treaties: the UNFCCC (1992), the Kyoto Protocol (1997), and the Paris
    Agreement (2015), with the ICJ's 2025 climate advisory opinion following the same body of work. The
    1985 Vienna Convention and 1987 Montreal Protocol on the ozone layer show the effect numerically:
    emissions of ozone-depleting substances rose for decades, then fell sharply once the instruments took
    effect, with the UN reporting in 2023 that the ozone layer is on track to recover by 2040.

    Exam use: a "living process" answer should name the mechanism — treaty, amendment, protocol, or
    custom — not just assert the law "changed".
- slug: compliance-and-enforcement
  title: Why states comply without a world police
  visual: simulation
  visual-brief: A balance weighing sanction-fear against reputational cost and quasi-enforcement, tipping toward compliance even with the domestic-style enforcement lever removed.
  related:
  - sovereign-equality-and-consent
  depends-on:
  - defining-international-law
  contrasts-with:
  - sovereign-equality-and-consent
  cases: []
  authorities:
  - un-charter-arts-5-6
  verify: false
  body: |
    International law has no legislature, no executive and no police, and disputes need not go before a
    compulsory court — states must agree to a court's jurisdiction before they can be brought before it.
    Yet almost all states obey almost all of international law almost all of the time. Enforcement is
    "irrelevant to the binding quality of international law as a system of law": states operate within it
    not because it is peremptory, but because it is necessary if anything meaningful is to be achieved --
    "the basis of obligation is the same in every legal order: a consciousness among the subjects that
    this order is needed" (Hoffman, 1987).

    Compliance instead comes from fear of "loss of reputation", which leads other states to exclude a
    non-complying state from future opportunities to cooperate (Chayes & Chayes, 1995) — other states
    becoming reluctant to trade with, or ally with, a state that regularly disregards its commitments.
    There is also quasi-enforcement: participation in international organisations is contingent on
    compliance and trust — Arts 5 and 6 of the UN Charter allow suspension or expulsion from membership,
    and bodies like the IMF and World Bank can exert economic leverage over members' conduct.

    Against this, realism holds that what matters is power, especially military power, and that a
    militarily powerful state will only obey international law when it perceives this to be in its
    interest.

    Exam use: never explain non-compliance as proof international law "doesn't work" — explain it against
    reputation, quasi-enforcement and self-interest.
- slug: general-and-specialized-international-law
  title: General and specialised international law
  visual: palace
  visual-brief: Two chambers — 'general' international law (this unit's syllabus) and 'special' regimes branching off it — with global commons and shared concern as a connecting corridor.
  related:
  - defining-international-law
  depends-on: []
  contrasts-with:
  - defining-international-law
  cases: []
  authorities: []
  verify: false
  body: |
    "General" international law is the core this unit teaches: sources, treaty law, statehood and
    recognition, jurisdiction and immunities, diplomatic protection, state responsibility, and peaceful
    settlement of disputes. "Special" international law is the growing set of regimes built on that core:
    use of force, international criminal law, human rights law, the law of the sea, air and space law,
    environmental and climate change law, energy law, trade law, investment law, and health law.

    These regimes rarely operate alone. A vessel rescuing migrants in distress at sea and seeking to dock
    outside its flag state draws on migration law, the law of the sea and human rights law together; a
    dispute over agrochemicals affecting another state's environment draws on trade law, environmental
    law, health law and state responsibility together. Exam problems borrow across regimes rather than
    sitting inside just one.

    Two areas cut across the general/special divide. Global commons — the high seas, outer space,
    Antarctica — belong to no state, so no state can impose its jurisdiction there, and every state (even
    a land-bound one) retains freedom of navigation and access. Issues of shared concern — pandemics,
    global trade, climate change — are transboundary by nature and can be tackled by "the nationalist
    route" (each state acting alone) or "the internationalist route" (states acting together), the latter
    increasingly the more effective of the two.

    Exam use: name the specific regime(s) engaged before reaching for a rule — misidentifying the regime
    is as costly as misapplying it.
cases:
- slug: ss-lotus-france-v-turkey
  name: S.S. Lotus (France v Turkey)
  citation: (1927) PCIJ (ser A) No 10
  aglc: The Case of the SS Lotus (France v Turkey) (1927) PCIJ (ser A) No 10, [44]
  facts: |
    The materials give only the Permanent Court of International Justice's statement of principle from
    this case (slide 10 of the Week 1 lecture slides), not the underlying facts of the collision and
    criminal-jurisdiction dispute between France and Turkey; do not assume more than the quoted passage
    supports.
  issue: |
    What supplies the binding force of a rule of international law upon a state — whether restrictions
    on a state's independence can be presumed in the absence of its consent.
  held: |
    "International law governs relations between independent States. The rules of law binding upon
    States therefore emanate from their own free will as expressed in conventions or by usages generally
    accepted as expressing principles of law and established in order to regulate the relations between
    these co-existing independent communities or with a view to the achievement of common aims.
    Restrictions upon the independence of States cannot therefore be presumed."
  ratio: |
    A state is free to act unless bound by a rule it has consented to, expressly (convention) or through
    accepted usage (custom); restrictions on a state's independence are never presumed.
  significance: |
    The classic PCIJ statement of the consensual, state-centred foundation of international law, cited
    across this unit as authority for how international law binds states at all.
  why-here: Used in Week 1 to answer 'what makes a rule of international law binding' with an authority, rather than only a description.
  verify: true
