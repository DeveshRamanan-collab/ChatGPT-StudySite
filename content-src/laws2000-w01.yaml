  stem: A state relies on the 1928 Kellogg-Briand Pact to argue that using force to settle a trade dispute is unlawful. Which part of this week's material most directly supports this argument?
  options:
  - text: The Pact's obligation that states refrain from war as a means of settling international controversies and as an instrument of national policy.
    correct: true
    why: Correct application — the Pact's obligation is worded broadly enough to cover using force to settle any international controversy, including a trade dispute, as a matter of national policy.
  - text: The PCIJ's statement in S.S. Lotus that restrictions on a state's independence cannot be presumed.
    why: Wrong — Lotus is about how rules come to bind states through consent generally; it is not itself a prohibition on the use of force, and using it here would miss the specific, on-point authority (Kellogg-Briand).
  - text: The Peace of Westphalia's creation of the notion of sovereignty.
    why: Wrong — Westphalia established the sovereign state system in 1648, nearly three centuries earlier, and says nothing about a prohibition on using force to settle disputes.
