- key: q034
  type: mcq
  concept: sovereign-equality-and-consent
  variant-of: q021
  difficulty: 4
  stem: A state consents to a treaty's general obligations but later claims it never truly agreed to one specific clause buried deep within it. Which principle from this week is most relevant to resolving this, and how?
  options:
  - text: State consent, because whether that specific clause binds the state ultimately turns on whether the state's consent extended to that clause, not merely to the treaty's general subject matter.
    correct: true
    why: Correct application — since obligations under international law flow from a state's own free will, the analysis has to ask precisely what the state consented to, which can be a live question even after it has joined a treaty overall.
  - text: Sovereign equality, because all states must be treated identically regardless of what any individual clause says.
    why: Wrong — sovereign equality concerns states' formal standing relative to one another, not the separate question of what a particular state has actually consented to within a particular treaty.
  - text: The Peace of Westphalia, because it establishes that treaties negotiated after 1648 cannot contain individual clauses a rule that would need to be read together with the general principles covered this week.
    why: Wrong — Westphalia concerns the historical origin of the state system, not any modern rule about how treaty clauses are drafted or interpreted.
