  - text: The UN Security Council automatically imposes criminal penalties on the state's leaders.
    why: Wrong — this describes a formal, automatic enforcement mechanism that the materials say does not exist; the actual mechanism described is reputational, not automatic criminal sanction.
  - text: Nothing at all happens, because international law has no consequences for states that regularly disregard their commitments.
    why: Wrong — the materials specifically identify a real consequence (reputational cost, exclusion from cooperation), so it is inaccurate to say nothing happens.
