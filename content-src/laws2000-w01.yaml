    correct: true
    why: "Correct — the lecture explains Vitoria's reasoning directly: 'Because, after all, there was no discovery. There were already people there. There were already local people living on those territories.'"
  - text: Because the Spanish crown had not obtained a papal bull authorising the conquest.
    why: Wrong — this reasoning is not attributed to Vitoria in the materials; his stated reason is that there was no genuine 'discovery' since people already lived there.
  - text: Because the Peace of Westphalia had already outlawed wars of conquest by the time of Vitoria's lectures.
    why: Wrong — Vitoria's 1532 lectures predate the 1648 Peace of Westphalia by more than a century, so it could not have supplied his reasoning.
- key: q050
  type: mcq
  concept: history-ancient-to-westphalia
  difficulty: 2
  stem: Which work is attributed to the Jesuit Francisco Suarez in this week's materials?
  options:
  - text: A Treatise on Laws and God the Lawgiver (1612).
    correct: true
    why: "Correct — Suarez (1548–1617), the Jesuit of the period, wrote A Treatise on Laws and God the Lawgiver in 1612, a work that profoundly shaped early thinking about international relations."
  - text: Law of Nations.
    why: "Tempting because Vattel is named beside Suarez as a key figure of the period, but Law of Nations is Vattel's work, stressing state equality and that only positive law is relevant."
  - text: On the Law of War and Peace though this depends on details this week's materials do not fully specify.
    why: "Tempting because Grotius belongs to the same early modern period, but the law of war and peace is Grotius's contribution; Suarez's work is the 1612 treatise on laws and God the lawgiver."
- key: q051
  type: mcq
  concept: history-ancient-to-westphalia
  difficulty: 2
  stem: What did Emmerich de Vattel's Law of Nations underline, according to the lecture?
  options:
  - text: The idea of state equality irrespective of power, at least within Europe, and a distinction between natural law and 'laws of action' (positive law).
    correct: true
    why: Correct — the lecture states Vattel's book 'underlined the idea of state equality irrespective of their power, at least within Europe', and that he distinguished natural law from positive law, arguing only positive law was relevant.
  - text: The need for a Permanent Court of International Justice.
    why: Wrong — the PCIJ was established in 1920, roughly 150 years after Vattel's death in 1767; his work concerns state equality and the natural law/positive law distinction, not a specific court.
  - text: The prohibition on the use of explosive bullets in warfare.
    why: Wrong — this prohibition is from the 1868 Declaration of St Petersburg, a nineteenth-century instrument, not from Vattel's eighteenth-century Law of Nations.
- key: q052
  type: mcq
  concept: history-ancient-to-westphalia
  difficulty: 1
  stem: The Peace of Westphalia is dated to which year in this week's materials?
  options:
  - text: '1648.'
    correct: true
    why: Correct — the slide is headed 'Peace of Westphalia 1648', described as brought about at the end of the Thirty Years' War.
  - text: '1919.'
    why: Wrong — 1919 is the year the League of Nations was created, not the Peace of Westphalia.
  - text: '1928.'
    why: Wrong — 1928 is the year of the Kellogg-Briand Pact (Treaty of Paris), not the Peace of Westphalia.
- key: q053
  type: mcq
  concept: history-ancient-to-westphalia
  variant-of: q052
  difficulty: 2
  stem: What two treaties together make up the Peace Treaties of Westphalia?
  options:
  - text: The Peace Treaty of Osnabruck and the Peace Treaty of Munster.
    correct: true
    why: Correct — the lecture states 'the Peace Treaties of Westphalia consist of two documents... the Peace Treaty of Osnabruck and the Peace Treaty of Munster.'
  - text: The Treaty of Versailles and the Treaty of Paris.
    why: Wrong — these are twentieth-century treaties (1919 and 1928 respectively); the Peace of Westphalia comprises the treaties of Munster and Osnabruck.
  - text: The Declaration of Paris and the Declaration of St Petersburg.
    why: Wrong — these are nineteenth-century declarations (1856 and 1868); the Peace of Westphalia's constituent treaties are Munster and Osnabruck.
- key: q054
  type: mcq
  concept: history-ancient-to-westphalia
  variant-of: q052
  difficulty: 3
  stem: What need did the Peace of Westphalia respond to, according to the lecture?
  options:
  - text: The need for a system that contained a clear source of authority, organising territory and individuals into sovereign states.
    correct: true
    why: Correct — the slide states the idea 'was to organise territory and individuals into sovereign states' out of a 'need for a system that contained a clear source of authority', leading to the 'birth of the notion of sovereignty'.
  - text: The need to codify customary international law into a single written text for the first time.
    why: Wrong — codifying custom into a single text is not mentioned as Westphalia's purpose; its role concerns organising territory and authority into sovereign states.
  - text: The need to create an international criminal tribunal to try war criminals from the Thirty Years' War at least on the account this week's lecture and slides give.
    why: Wrong — no international criminal tribunal followed the Thirty Years' War in this week's materials; that development (the Nuremberg Trials) came much later, after the Second World War.
- key: q055
