cards:
- type: basic
  concept: defining-international-law
  front: What does the AG's Department's definition of international law centre on?
  back: Rules and principles facilitating the conduct of states and international organisations in their relations with one another, and sometimes with individuals, groups and companies.
  source: Week 01 Lecture Slides, slide 8
- type: cloze
  concept: defining-international-law
  text: In S.S. Lotus, the PCIJ held that restrictions upon the independence of States cannot therefore be {{c1::presumed}}, because rules bind states only through their own {{c1::free will}}.
  source: Week 01 Lecture Slides, slide 10
- type: apply
  concept: defining-international-law
  scenario: A treaty negotiator asks whether a new, unwritten regional practice already binds neighbouring states.
  answer: "Apply Lotus: ask whether the practice amounts to a 'usage generally accepted as expressing principles of law' — if not, no restriction on the states' independence can be presumed."
  source: Week 01 Lecture Slides, slide 10
- type: basic
  concept: defining-international-law
  front: Which definition 'really insists on the voluntary nature' of international law?
  back: The Practitioner's Guide to International Law (2nd ed, 2014) — states recognise international law as 'law' by voluntarily consenting to agreed standards.
  source: Week 01 Notes, Definition and scope section, 00:20:47-00:20:58
- type: basic
  concept: sovereign-equality-and-consent
  front: Why do China and Malta each get exactly one vote in the UN General Assembly?
  back: "Sovereign equality: each state has the right to be considered on an equal basis with every other state, regardless of population or power."
  source: Week 01 Lecture Recording (Online), 00:04:59-00:05:23
- type: cloze
  concept: sovereign-equality-and-consent
  text: No state can compel another state to sign a treaty; there is no rule of international law binding on a state unless that state has given its {{c1::consent}}.
  source: Week 01 Lecture Recording (Live), 00:05:41-00:06:06
- type: apply
  concept: sovereign-equality-and-consent
  scenario: State X refuses to ratify a new maritime-safety treaty most of its neighbours have joined.
  answer: "State X is not bound: consent is individual, so states end up with different rights and obligations depending on what each has actually ratified."
  source: Week 01 Lecture Recording (Live), 00:21:16-00:21:29
- type: basic
  concept: sovereign-equality-and-consent
  front: Which UN Charter article is linked to sovereign equality this week?
  back: Article 2 — it prescribes that United Nations members (193 of them) are equal.
  source: Week 01 Lecture Slides, slide 23; Lecture Recording (Online) 00:04:34-00:04:58
- type: basic
  concept: history-ancient-to-westphalia
  front: What does 'nomos' mean in the lecture's discussion of ancient Greece?
  back: Restricting natural freedoms for the sake of expediency and self-interest.
  source: Week 01 Lecture Slides, slide 23
- type: cloze
  concept: history-ancient-to-westphalia
  text: Hugo Grotius first {{c1::secularised}} the idea of natural law, then distinguished it from {{c1::jus gentium}}, the law created by humans and variable in time and place.
  source: Week 01 Lecture Recording (Live), 00:11:20-00:11:42
- type: apply
  concept: history-ancient-to-westphalia
  scenario: A historian dates the 'birth of sovereignty' to ancient Rome rather than 1648.
  answer: "Correct the historian: the lecture ties the birth of sovereignty to the Peace of Westphalia (1648), which organised territory and people into sovereign states."
  source: Week 01 Lecture Slides, slide 26
- type: basic
  concept: history-ancient-to-westphalia
  front: Why did Vitoria reject 'discovery' as a justification for conquering the New World?
  back: Because there was no discovery — there were already local people living on those territories, and natural law applied to them as part of the human race.
  source: Week 01 Lecture Recording (Online), 00:12:59-00:14:09
- type: basic
  concept: history-nineteenth-century-to-un
  front: What was the central idea of nineteenth-century positivism?
  back: The only true source of law is state will — not fairness or divine justice, but consent to a legal obligation.
  source: Week 01 Lecture Slides, slide 27
- type: cloze
  concept: history-nineteenth-century-to-un
  text: The League of Nations (1919) did not itself prohibit war, but imposed an obligation to submit disputes likely to lead to conflict to {{c1::adjudication}} or {{c1::inquiry}}.
  source: Week 01 Lecture Recording (Online), 00:22:19-00:22:49
- type: apply
  concept: history-nineteenth-century-to-un
  scenario: A student wants one instrument to cite for 'states renouncing war as an instrument of national policy'.
  answer: Cite the 1928 Kellogg-Briand Pact (Treaty of Paris) — it established exactly this obligation.
  source: Week 01 Lecture Slides, slide 28
- type: basic
  concept: history-nineteenth-century-to-un
  front: What is the UN General Assembly's role compared with the Security Council's?
  back: Only consultative — it cannot create binding law the way the Security Council can, though all 193 members have one equal vote.
  source: Week 01 Lecture Recording (Online), 00:27:14-00:27:33
- type: basic
  concept: international-law-as-living-process
  front: Name two mechanisms by which international law evolves as a 'living process'.
  back: The adoption of new treaties, and the modification of existing treaties (amendment or added protocols).
  source: Week 01 Lecture Recording (Live), 00:40:53-00:41:15
- type: cloze
  concept: international-law-as-living-process
  text: "Custom needs two elements: general state {{c1::practice}}, and a {{c1::belief}} that the practice is law, or at least how the law should be."
  source: Week 01 Lecture Recording (Live), 00:41:36-00:41:49
- type: apply
  concept: international-law-as-living-process
  scenario: A regulator wants an example of a non-binding UN document that later helped produce a binding treaty.
  answer: The Rio Declaration on the Human Environment (1992) — a General Assembly document that built momentum later channelled into the UNFCCC, Kyoto Protocol and Paris Agreement.
  source: Week 01 Lecture Slides, slide 16
- type: basic
  concept: international-law-as-living-process
  front: What happened to emissions of ozone-depleting substances after the Vienna Convention and Montreal Protocol entered into force?
  back: They declined sharply, after having risen for decades — the UN expects the ozone layer to recover by 2040.
  source: Week 01 Lecture Slides, slide 18
- type: basic
  concept: compliance-and-enforcement
  front: Why is 'enforcement' irrelevant to whether international law is binding?
  back: Because rules become binding through sufficient state consensus/practice (custom) or treaty agreement, not through being enforced.
  source: Week 01 Lecture Slides, slide 19
- type: cloze
  concept: compliance-and-enforcement
  text: Chayes & Chayes (1995) argue compliance comes from fear not of sanction but of {{c1::loss of reputation}}, which excludes a state from future opportunities to cooperate.
  source: Week 01 Lecture Slides, slide 20
- type: apply
  concept: compliance-and-enforcement
  scenario: A state has ignored several of its trade commitments over the past decade.
  answer: "Expect a reputational cost: other states become more reluctant to trade or ally with it, and it risks quasi-enforcement such as suspension from an organisation, rather than a criminal sanction."
  source: Week 01 Lecture Recording (Live), 00:49:49-00:50:16
- type: basic
  concept: compliance-and-enforcement
  front: What does the realist view say happens when law and power conflict?
  back: It is almost inevitably law that will lose — a militarily powerful state obeys international law only when it perceives this to be in its interest.
  source: Week 01 Lecture Recording (Online), 00:03:10-00:03:36
- type: basic
  concept: general-and-specialized-international-law
  front: Give three topics listed under 'general' international law this week.
  back: "Any three of: sources, treaty law, statehood and recognition, jurisdiction and immunities, diplomatic protection, state responsibility, peaceful settlement of disputes."
  source: Week 01 Lecture Slides, slide 12
- type: cloze
  concept: general-and-specialized-international-law
  text: The high seas, outer space and {{c1::Antarctica}} are 'global commons' — areas that belong to no {{c1::state}} in particular.
  source: Week 01 Lecture Recording (Live), 00:36:45-00:37:09
- type: apply
  concept: general-and-specialized-international-law
  scenario: A ship rescues migrants at sea and wants to dock in a state other than its flag state.
  answer: "Identify the regimes engaged together: migration law, the law of the sea, human rights law, and potentially international health law."
  source: Week 01 Lecture Recording (Live), 00:29:34-00:30:23
- type: basic
  concept: general-and-specialized-international-law
  front: Which route for addressing shared global concerns does the lecture call 'increasingly more efficient'?
  back: The internationalist route — bringing states together to adopt common standards — rather than the nationalist route of addressing an issue domestically only.
  source: Week 01 Lecture Slides, slide 14
audio:
  title: Week 1 recap — what is public international law
  minutes: 4
  script: |
    This week we asked a simple-sounding question with three different answers: what is international
    law? The Attorney-General's Department calls it rules and principles that facilitate how states and
    international organisations relate to one another, and sometimes to individuals and companies too. The
    Practitioner's Guide stresses that states recognise it as law only because they voluntarily consent to
    it. And the Permanent Court of International Justice, in S.S. Lotus, gave us the sharpest version: the
    rules that bind states come from their own free will, expressed in conventions or accepted usage, so
    restrictions on a state's independence can never just be presumed. Keep all three in your back pocket
    — they each do different work in an exam answer.

    We also saw that international law is genuinely everywhere, not just in headline disputes: the
    Greenwich meridian that sets our clocks, the vehicle standards our cars meet, even the internet
    infrastructure carrying this lecture all rest on treaties most of us never think about. That's the
    'general' international law this unit teaches — sources, treaties, statehood, jurisdiction, state
    responsibility, dispute settlement — sitting alongside 'special' regimes like human rights, the law of
    the sea, or environmental law, which rarely operate alone: a migrant rescue at sea pulls in migration
    law, the law of the sea and human rights law all at once.

    Then we went back in time. From the Greek polis and Roman jus naturale, through Grotius separating
    natural law from jus gentium, and Vitoria insisting natural law protected the peoples of the New World,
    we arrived at 1648 and the Peace of Westphalia — the real hinge of the story, where sovereignty as we
    know it was born. From there, nineteenth-century positivism made state consent everything, building
    institutions like the Universal Postal Union and the Hague Conferences, before two world wars produced
    the League of Nations, the Kellogg-Briand Pact, the Permanent Court of International Justice, and
    finally the UN Charter itself in 1946, with its Security Council, General Assembly, sovereign equality
    and ban on the use of force.

    Two more ideas tie the week together. First, international law is a living process — new treaties,
    amended treaties, protocols, and custom built from state practice and belief, illustrated perfectly by
    environmental law's growth from almost nothing in the 1960s to the Paris Agreement, and by the ozone
    layer's dramatic recovery once the Vienna Convention and Montreal Protocol took effect. Second, and
    maybe most importantly for exam answers: international law has no legislature, executive or police, yet
    states comply almost all of the time, almost entirely because of reputation, quasi-enforcement like
    suspension from an organisation, and a shared sense that the system is worth keeping — not because
    anyone can force them to. As Philippe Sands put it, no one is starry-eyed about international law, but
    it's what we have.
