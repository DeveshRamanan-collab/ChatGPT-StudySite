- key: q040
  type: short
  concept: sovereign-equality-and-consent
  difficulty: 3
  prompt: Explain, with an example from this week's materials, how sovereign equality and state consent work together but answer different questions.
  model: |
    Sovereign equality and state consent both shape international law but answer different questions.
    Sovereign equality answers 'how do states stand relative to one another' — the lecture's China and
    Malta example shows that, despite China's 1.4 billion people against Malta's half a million, both get
    exactly one vote in the UN General Assembly under Art 2 of the UN Charter, because 'each state has the
    right to be considered on an equal basis with one another.' State consent answers a different
    question — 'what specifically binds this state' — and explains why, despite that formal equality,
    Malta and China can still end up with different treaty obligations: a state is bound only by what it
    has itself consented to, expressly through ratification or implicitly through accepted custom, so 'no
    state can compel another state to sign up for a treaty if that state doesn't want to.' The two
    principles work together in that sovereign equality guarantees states an equal voice and standing in
    the process (for example, an equal vote when a treaty is negotiated at the UN), while consent then
    determines the substantive outcome for each state individually — equal standing does not mean
    identical obligations, because consent, not equality, decides what ultimately binds a given state.
  rubric:
  - id: r1
    criterion: Explains sovereign equality with the Malta/China example
    marks: 2
    top-band: Uses the specific population comparison and one-vote outcome to show formal equality of standing.
    margin-note: Good use of the lecture's own example.
    authorities: []
  - id: r2
    criterion: Explains state consent as a distinct question
    marks: 2
    top-band: Clearly states that consent (express or implicit) determines what specifically binds a state, distinct from its formal standing.
    margin-note: Keep this separate from equality of standing.
    authorities: []
  - id: r3
    criterion: Shows how the two principles relate without collapsing them
    marks: 2
    top-band: Explains that equal standing in the process does not produce identical obligations, because consent still varies state by state.
    margin-note: This is the key insight that separates a strong answer from a merely descriptive one.
    authorities: []
- key: q041
  type: mcq
  concept: history-ancient-to-westphalia
  difficulty: 1
  set: pretest
  stem: What does the Greek concept of the 'polis' refer to?
  options:
  - text: "A city-state: an urban centre surrounded by countryside, protected by walls, and containing the public space where governance decisions were made."
    correct: true
    why: Correct — the lecture defines the polis as meaning 'city-states', each 'organized with a urban center and was surrounded by the countryside', with walls protecting the city and a public space for decisions about governance.
  - text: A treaty between Greek city-states banning the use of the sea in wartime which would need clearer support from this week's materials before it could be relied on.
    why: Wrong — the polis is a form of political community (the city-state itself), not a treaty or a rule about naval warfare.
  - text: The Roman Empire's system of provincial administration.
    why: Wrong — the polis is a Greek, not Roman, concept, and refers to the city-state as a form of community, not a system of provincial administration.
- key: q042
  type: mcq
  concept: history-ancient-to-westphalia
  difficulty: 1
  stem: According to the lecture, why is Thucydides' History of the Peloponnesian War relevant to international law?
  options:
  - text: Its observation that 'the strong do what they can and the weak suffer what they must' expresses an idea about power that later scholars such as Grotius and Vattel drew on.
    correct: true
    why: Correct — the slide quotes exactly this line from Thucydides and links it to the idea of 'Nomos' and, eventually, to the modern principle of Sovereign Equality (Art 2 UN Charter), which stands opposed to it.
  - text: It is the first written treaty recognised under modern international law.
    why: Wrong — Thucydides' work is a historical narrative, not a treaty; it is used for its ideas about power between states, not as a binding legal instrument.
  - text: It records the first meeting of the League of Nations.
    why: Wrong — Thucydides wrote about ancient Greece millennia before the League of Nations (1919); the two are entirely different periods.
- key: q043
  type: mcq
  concept: history-ancient-to-westphalia
  variant-of: q042
  difficulty: 2
  stem: What is 'nomos', as used in the lecture's discussion of ancient Greece?
  options:
  - text: The idea of restricting natural freedoms for the sake of expediency and self-interest.
    correct: true
    why: "Correct — the slide defines 'Nomos' in Ancient Greece as exactly this: restricting natural freedoms for expediency and self-interest."
  - text: A treaty establishing the Permanent Court of Arbitration.
    why: Wrong — the Permanent Court of Arbitration was established at the 1899 and 1907 Hague Conferences, many centuries after ancient Greece, and is unrelated to 'nomos'.
  - text: The Roman term for natural law, later distinguished from jus gentium though the precise scope of this claim is not spelled out in this week's materials.
    why: Wrong — 'nomos' is a Greek, not Roman, concept; the Roman terms distinguished in the materials are jus naturale and jus gentium.
- key: q044
  type: mcq
  concept: history-ancient-to-westphalia
  difficulty: 2
  stem: Which two Latin phrases does the lecture pair together as part of Ancient Roman law?
  options:
  - text: Jus naturale and jus civile.
    correct: true
    why: Correct — the slide on ancient history lists 'Jus naturale...Jus civile...' under 'Ancient Roman Law', immediately after the Greek concept of nomos.
  - text: Jus gentium and jus cogens.
    why: Wrong — jus gentium is discussed in relation to the early modern period (contrasted with jus naturale by Grotius), and jus cogens does not appear in this week's materials at all.
  - text: Pacta sunt servanda and rebus sic stantibus.
    why: Wrong — neither of these treaty-law maxims appears in this week's materials; the Roman-law pairing given is jus naturale and jus civile.
- key: q045
  type: mcq
  concept: history-ancient-to-westphalia
  difficulty: 2
  stem: What distinguishes jus gentium from jus naturale, according to Grotius as described in the lecture?
  options:
  - text: Jus gentium is law created by humans and variable in time and place, whereas jus naturale is the law that exists within nature and is universal.
    correct: true
    why: Correct — the lecture states 'natural law was the law that exists within nature. But jus gentium, by contrast, was the law created by human and it was variable in time and place.'
  - text: Jus gentium applies only to Roman citizens, while jus naturale applies to everyone else.
    why: Wrong — the materials do not draw this citizenship-based distinction; the distinction given is about the law's source (nature versus human creation) and its variability.
  - text: Jus gentium is the modern name for the United Nations Charter.
    why: Wrong — jus gentium is a much older concept from early modern legal theory, entirely distinct from the twentieth-century UN Charter.
- key: q046
  type: mcq
  concept: history-ancient-to-westphalia
  difficulty: 2
  stem: What was Hugo Grotius's role in the development of natural law and jus gentium, according to the lecture?
  options:
  - text: He first secularised the idea of natural law and then distinguished it from jus gentium.
    correct: true
    why: Correct — the lecture says 'what Grotius did was to first secularize this idea of natural law and then he distinguished it from jus gentium.'
  - text: He founded the League of Nations in 1919.
    why: Wrong — Grotius lived from 1583 to 1645, roughly three centuries before the League of Nations was founded in 1919.
  - text: He drafted the UN Charter's provisions on sovereign equality a distinction that matters more in some fact patterns than others.
    why: Wrong — the UN Charter was drafted in 1945, long after Grotius's death; his contribution concerns natural law, jus gentium, the freedom of the seas, and the law of war and peace.
- key: q047
  type: mcq
  concept: history-ancient-to-westphalia
  variant-of: q046
  difficulty: 3
  stem: Which two works are attributed to Hugo Grotius in this week's materials?
  options:
  - text: The Freedom of the Seas, and On the Law of War and Peace.
    correct: true
    why: "Correct — the slide lists 'Hugo Grotius (1583-1645): The Freedom of the Seas and On the Law of War and Peace' among the early-modern figures."
  - text: A Treatise on Laws and God the Lawgiver, and Law of Nations.
    why: Wrong — A Treatise on Laws and God the Lawgiver is attributed to Francisco Suarez, and Law of Nations to Emmerich de Vattel, not Grotius.
  - text: History of the Peloponnesian War, and the Declaration of Paris.
    why: Wrong — History of the Peloponnesian War is Thucydides' work from ancient Greece, and the Declaration of Paris is an 1856 treaty; neither is attributed to Grotius.
- key: q048
  type: mcq
  concept: history-ancient-to-westphalia
  difficulty: 3
  stem: What did Francisco de Vitoria conclude about the waging of war against native populations of the New World?
  options:
  - text: That it was not justified under natural law, because native populations were part of the human race and natural law therefore applied to them.
    correct: true
    why: Correct — the slide states Vitoria concluded 'the waging of war against the natives of the New World was not justified under natural law', and the lecture explains this rested on natural law applying to them as members of the human race.
  - text: That it was justified, because natural law only applied within Europe.
    why: Wrong — this is the opposite of Vitoria's actual conclusion; he rejected any such limitation, applying natural law to native populations as well.
  - text: That the question was irrelevant, because jus gentium (not natural law) governed relations with non-European peoples.
    why: Wrong — the materials describe Vitoria as reasoning from natural law specifically, concluding native peoples were part of the human race to whom natural law applied.
- key: q049
  type: mcq
  concept: history-ancient-to-westphalia
  variant-of: q048
  difficulty: 3
  stem: On what basis did Vitoria reject the claim that Spanish forces could conquer New World territories through 'discovery'?
  options:
