  - key: b01
    type: mcq
    concept: creativity-precedes-innovation
    difficulty: 1
    set: pretest
    stem: On the Week 7 creativity-versus-innovation chart, what is creativity?
    options:
      - text: The introduction of new or improved goods, services, processes, etc.
        why: Tempting because it sits on the same chart, but this is the chart's definition of innovation, which follows creativity.
      - text: The use of imagination or original ideas to create something
        correct: true
        why: "Right: the chart defines creativity as the use of imagination or original ideas to create something."
      - text: A novel product, device, process, or concept that has been made
        why: Tempting because creativity produces new things, but this is the first chart's definition of invention, not creativity.
      - text: A newer and better solution that meets existing market needs
        why: Tempting because creative ideas can solve problems, but this is the first chart's definition of innovation, tied to market needs.
  - key: b02
    type: mcq
    concept: creativity-precedes-innovation
    difficulty: 1
    set: pretest
    stem: The slide says "Remember which one follows the other." According to the chart, which order is right?
    options:
      - text: Innovation precedes creativity
        why: "Tempting if you think a new product sparks new ideas, but the chart says the reverse: innovation follows creativity."
      - text: Creativity precedes innovation
        correct: true
        why: "Right: the chart says creativity precedes innovation, and innovation follows creativity."
      - text: They happen together, so neither comes first
        why: "Tempting because the two are closely linked, but the chart gives them a fixed order: creativity first, then innovation."
      - text: Whichever can be measured comes first
        why: Tempting because measurement is on the chart, but it is a separate row; and the measurable one, innovation, comes second, not first.
  - key: b03
    type: mcq
    concept: creativity-precedes-innovation
    difficulty: 2
    stem: According to the chart, which of the two can be measured?
    options:
      - text: Creativity can be measured; innovation cannot
        why: "Tempting if you picture counting ideas, but this reverses the chart: innovation can be measured, creativity cannot."
      - text: Both can be measured
        why: Tempting because organisations like to measure things, but the chart says creativity cannot be measured.
      - text: Innovation can be measured; creativity cannot
        correct: true
        why: "Right: the chart says innovation can be measured and creativity cannot be measured."
      - text: Neither can be measured
        why: Tempting because both sound intangible, but the chart says innovation can be measured; only creativity cannot.
  - key: b04
    type: mcq
    concept: creativity-precedes-innovation
    difficulty: 1
    set: pretest
    stem: "Complete the chart: innovation is related to ___; creativity is related to ___."
    options:
      - text: imagination; implementation
        why: "Tempting because the two words look alike, but this swaps them: the chart pairs innovation with implementation and creativity with imagination."
      - text: market needs; financial aid
        why: Tempting because these words appear in Week 7, but they come from the first chart's requirements, not from this row of the second chart.
      - text: implementation; imagination
        correct: true
        why: "Right: the chart says innovation is related to implementation and creativity is related to imagination."
      - text: measurement; original ideas
        why: Tempting because both words are on the chart, but the "related to" row says implementation for innovation and imagination for creativity.
  - key: b05
    type: mcq
    concept: creativity-precedes-innovation
    difficulty: 2
    stem: How does the creativity-versus-innovation chart define innovation?
    options:
      - text: The introduction of new or improved goods, services, processes, etc.
        correct: true
        why: "Right: the second chart defines innovation as the introduction of new or improved goods, services, processes, etc."
      - text: The original idea for a new good or service, before it is put into practice
        why: Tempting because innovation starts from ideas, but an idea before implementation is closer to creativity; innovation is the introduction.
      - text: The use of imagination or original ideas to create something new
        why: Tempting because it sits on the same chart, but this is the creativity column's definition, which precedes innovation.
      - text: A novel product, device or process, whether or not anyone uses it
        why: Tempting because it lists products and processes, but this is the first chart's invention, which is not defined by introduction.
  - key: b06
    type: mcq
    concept: creativity-precedes-innovation
    difficulty: 3
    stem: At a staff workshop, a hotel's employees imagine twenty original ideas for a new guest service. None has been put into practice. Using the creativity-versus-innovation chart, which column fits?
    options:
      - text: Innovation, because the ideas are for a new service
        why: Tempting because services count as innovation, but innovation is the introduction of the service; nothing has been implemented yet.
      - text: Creativity, because it follows innovation
        why: "Right label, wrong reason: the chart says creativity precedes innovation, not that it follows it."
      - text: "Creativity: imagination and original ideas"
        correct: true
        why: "Right: imagining original ideas is the use of imagination or original ideas — creativity, which precedes innovation."
      - text: Innovation, because twenty ideas can be counted
        why: Tempting because counting looks like measuring, but the chart says creativity cannot be measured, and nothing has been introduced.
  - key: b07
    type: mcq
    concept: creativity-precedes-innovation
    difficulty: 3
    stem: The hotel then puts one of the ideas into practice and introduces the new service to its guests. Using the chart, which column now fits, and why?
    options:
      - text: Creativity, because the idea was original
        why: Tempting because the idea began as original, but introducing and implementing the service is innovation, which follows creativity.
      - text: Innovation, because it precedes creativity
        why: "Right label, wrong reason: the chart says innovation follows creativity, as it does here — the ideas came first."
      - text: Neither, because a service is not a good or a process
        why: "Tempting if innovation meant only products, but the chart's definition expressly includes services: new or improved goods, services, processes."
      - text: "Innovation: a new service introduced and implemented"
        correct: true
        why: "Right: the introduction of a new service is innovation; it is related to implementation and follows the creative stage."
  - key: b08
    type: mcq
    concept: creativity-precedes-innovation
    difficulty: 3
    variant-of: b06
    stem: A software firm holds a hackathon where staff sketch original ideas for features. No feature has been built or released. Using the chart, how should the hackathon be described?
    options:
      - text: As innovation, because software counts as a new product
        why: Tempting because the ideas concern a product, but innovation is the introduction of new or improved goods or services; nothing has been introduced.
      - text: "As creativity: original ideas, not yet implemented"
        correct: true
        why: "Right: sketching original ideas is the use of imagination or original ideas — creativity, which precedes innovation."
      - text: As innovation, because the firm can measure how many ideas it got
        why: Tempting because a count looks like a measure, but the chart says creativity cannot be measured, and nothing has been implemented.
      - text: As neither, because the ideas may never be used
        why: Tempting because the ideas may be dropped, but the chart's creativity needs only the use of imagination or original ideas, not implementation.
  - key: b09
    type: mcq
