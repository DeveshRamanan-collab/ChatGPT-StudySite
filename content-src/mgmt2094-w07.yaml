  - key: s03
    type: short
    concept: creativity-precedes-innovation
    difficulty: 3
    prompt: Using the Week 7 chart, explain the relationship between creativity and innovation, including which one follows the other. Apply it to a café whose staff imagine new menu ideas and which later introduces one of them, an improved ordering process, to its customers.
    model: |-
      The chart defines creativity as the use of imagination or original ideas to create something. It is related to imagination, it cannot be measured, and it precedes innovation. Innovation is the introduction of new or improved goods, services, processes, etc. It is related to implementation, it can be measured, and it follows creativity. The order is fixed: creativity first, innovation second.

      In the café, the staff imagining new menu ideas is creativity: the use of imagination and original ideas, with nothing yet implemented. The later introduction of an improved ordering process is innovation: an improved process, introduced and implemented. It follows the creative stage, as the chart says it should. An improved process counts; innovation is not limited to brand-new things.

      The chart also sets a limit for the café's owner: innovation can be measured, creativity cannot. The café can measure the new ordering process it introduced, but not the brainstorm that came before it.
    rubric:
      - id: r1
        criterion: "Concept: definitions and order"
        marks: 2
