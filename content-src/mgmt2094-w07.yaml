    verify: false
    body: |
      The tutorial's first comparison: let's understand the difference between invention and innovation, and pay
      attention to the economic value.

      - **Invention** is a novel product, device, process, or concept. It requires knowledge, competence, and financial
        aid. Examples: the invention of the printing press, electricity, the telephone.
      - **Innovation** is the introduction of a newer and better solution that meets new requirements or existing market
        needs. It requires technical knowledge, competence, knowledge about market needs, trends, and financial support.
        Examples: the introduction of the iPhone, the tablet, the flat-screen TV.

      Both columns need competence and money. Only innovation is tied to the market: it is defined by meeting
      requirements or market needs, it adds knowledge about market needs and trends, and its examples are introductions
      rather than inventions. The slide does not spell out the economic value; this is where the two columns differ.

      **Exam use:** ask whether the thing is simply novel (invention) or has been introduced as a newer, better solution
      that meets a requirement or market need (innovation), and cite the chart's examples.
  - slug: creativity-precedes-innovation
    title: "Creativity vs innovation: which follows which"
    visual: simulation
    visual-brief: "A two-station track from creativity to innovation: the learner sets what is happening (imagining original ideas, or introducing something new or improved) and the marker moves to the matching station, lighting its pair of attributes (imagination or implementation; cannot or can be measured) and the order (precedes or follows)."
    related:
      - invention-vs-innovation-economic-value
    depends-on: []
    contrasts-with:
      - invention-vs-innovation-economic-value
    cases: []
    authorities:
      - mgmt2094-example-iphone-tablet-flat-screen-tv
    verify: false
    body: |
      The tutorial's second comparison: remember which one follows the other.

      - **Creativity** is the use of imagination or original ideas to create something. It is related to imagination,
        it cannot be measured, and it precedes innovation.
      - **Innovation** is the introduction of new or improved goods, services, processes, etc. It is related to
        implementation, it can be measured, and it follows creativity.

      The order is fixed: creativity first, innovation second. The two columns pair off — imagination against
      implementation, cannot be measured against can be measured — and innovation covers improved goods, services and
      processes, not only brand-new ones. The first chart's examples of innovation (the introduction of the iPhone, the
      tablet, the flat-screen TV) are introductions of exactly this kind.

      The slide ends with a question for discussion: in which ways are they useful in organisations? The materials leave
      it open; the chart's rows are the place to start.

      **Exam use:** when a scenario describes original ideas being imagined, call it creativity; when something new or
      improved is introduced and put into practice, call it innovation, and say that innovation follows creativity.
