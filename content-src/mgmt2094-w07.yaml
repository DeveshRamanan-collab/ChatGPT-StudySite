        margin-note: Example from the materials, not invented.
        authorities: []
      - id: r3
        criterion: "Application: usefulness to organisations"
        marks: 2
        top-band: "Explains each one's use from the charts: creativity as the source of original ideas; innovation as implementation that meets requirements or market needs and can be measured."
        margin-note: Each use tied to a row of the chart.
        authorities: []
      - id: r4
        criterion: "Evaluation: what the charts leave open"
        marks: 2
        top-band: Identifies what the charts do not answer, such as how creativity is encouraged, how ideas are chosen, and how innovation is measured.
