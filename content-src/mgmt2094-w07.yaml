  - key: s01
    type: short
    concept: invention-vs-innovation-economic-value
    difficulty: 3
    prompt: "Using the Week 7 tutorial chart, distinguish invention from innovation, with the chart's examples. Apply the distinction to a small firm that has built a working prototype of a novel kitchen gadget but has not yet offered it to anyone: is it an invention or an innovation, and what would have to happen for the chart to call it innovation?"
    model: |-
      The chart defines invention as a novel product, device, process, or concept, requiring knowledge, competence, and financial aid; its examples are the invention of the printing press, electricity and the telephone. Innovation is the introduction of a newer and better solution that meets new requirements or existing market needs, requiring technical knowledge, competence, knowledge about market needs, trends, and financial support; its examples are the introduction of the iPhone, the tablet and the flat-screen TV.

      The firm's prototype is a novel device, so it is an invention. It is not yet an innovation, because nothing has been introduced to meet a requirement or a market need. For the chart to call it innovation, the firm would have to introduce it as a newer and better solution that meets a new requirement or an existing market need, drawing on knowledge about market needs and trends.

      The limit of the chart is that both columns share competence and money, so effort or funding cannot tell them apart; the difference is the tie to the market.
    rubric:
      - id: r1
        criterion: "Concept: accurate definitions of invention and innovation"
        marks: 2
        top-band: "States both chart definitions accurately: invention as a novel product, device, process or concept; innovation as the introduction of a newer and better solution meeting new requirements or existing market needs."
        margin-note: Both definitions are the chart's own; keep "introduction" in innovation.
        authorities: []
      - id: r2
        criterion: "Example: the chart's examples"
        marks: 2
        top-band: "Gives the chart's examples in the right columns: the printing press, electricity and the telephone as invention; the introduction of the iPhone, the tablet and the flat-screen TV as innovation."
        margin-note: Examples in the right columns — the iPhone is an introduction, so innovation.
        authorities: []
      - id: r3
        criterion: "Application: the prototype"
        marks: 2
        top-band: Classifies the prototype as an invention (a novel device) and explains that it becomes innovation only once introduced as a better solution meeting a requirement or market need.
        margin-note: "Good: you said what is missing (introduction to meet a need), not just the label."
        authorities: []
      - id: r4
        criterion: "Evaluation: what does and does not separate them"
        marks: 2
        top-band: Notes that competence and money appear in both columns, so they cannot separate invention from innovation; the market (needs, trends, introduction) does.
        margin-note: Sharp point that shared requirements do not discriminate.
        authorities: []
  - key: s02
    type: short
    concept: invention-vs-innovation-economic-value
    difficulty: 3
    verify: true
    prompt: The Week 7 tutorial tells you to "pay attention to the economic value" when distinguishing invention from innovation. Explain how the chart supports that cue, and apply it to a company deciding whether to launch a novel device it has already built.
    model: |-
      The slide does not explain the cue, so it has to be read from the chart. Invention is a novel product, device, process, or concept; it requires knowledge, competence, and financial aid. Innovation is the introduction of a newer and better solution that meets new requirements or existing market needs, and it requires, in addition, knowledge about market needs and trends. Only the innovation column is tied to the market, and its examples are introductions — the iPhone, the tablet, the flat-screen TV — where the invention examples (the printing press, electricity, the telephone) are inventions.

      For the company, the device it has built is an invention. Deciding whether to launch is the step the chart calls innovation: introducing it as a better solution that meets a requirement or market need, which needs knowledge of market needs and trends as well as financial support. On this reading, the economic value the slide points to lies in that introduction to meet a need.

      The chart cannot settle more than this: it gives no measure of economic value and does not say an invention has none.
    rubric:
      - id: r1
        criterion: "Concept: the two definitions and requirements"
        marks: 2
        top-band: Accurately states both definitions and both lists of requirements, identifying knowledge about market needs and trends as the requirement only innovation has.
        margin-note: Market needs and trends — the one extra requirement — correctly isolated.
        authorities: []
      - id: r2
        criterion: "Example: the chart's examples as evidence"
        marks: 2
        top-band: "Uses the chart's examples as evidence: innovation's are introductions (the iPhone, the tablet, the flat-screen TV); invention's are inventions (the printing press, electricity, the telephone)."
        margin-note: Nice use of the examples' wording as evidence.
        authorities: []
      - id: r3
        criterion: "Application: the launch decision"
        marks: 2
        top-band: Identifies the built device as an invention and the launch as the step the chart calls innovation, needing knowledge of market needs and trends.
        margin-note: Launch = introduction = innovation. Clear.
        authorities: []
      - id: r4
        criterion: "Evaluation: limits of the cue"
        marks: 2
        top-band: Acknowledges that the slide does not define economic value and that the chart neither measures it nor says an invention has none.
        margin-note: "Good restraint: you did not claim more than the slide says."
