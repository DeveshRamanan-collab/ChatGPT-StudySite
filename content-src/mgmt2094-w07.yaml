        margin-note: Both pairs used, not just one.
        authorities: []
      - id: r3
        criterion: "Application: the café"
        marks: 2
        top-band: Classifies the menu ideas as creativity and the introduced ordering process as innovation, noting that an improved process counts.
        margin-note: Right on "improved" — the chart says new or improved.
        authorities: []
      - id: r4
        criterion: "Evaluation: the measurement limit"
        marks: 2
        top-band: "Draws out the limit the chart sets: the introduced process (innovation) can be measured, the brainstorm (creativity) cannot."
        margin-note: "Good: the measurement row turned into a practical limit."
        authorities: []
  - key: s04
    type: short
    concept: creativity-precedes-innovation
    difficulty: 3
    verify: true
    prompt: "The Week 7 tutorial asks: \"In which ways are creativity and innovation useful in organisations?\" Answer using the tutorial's two charts, with an example from them, and say what the charts leave unanswered."
    model: |-
      The materials pose this as a discussion question, so the answer has to be built from the charts. Creativity is the use of imagination or original ideas to create something; innovation is the introduction of new or improved goods, services, processes, etc. Read together, creativity is useful as the source of imagination and original ideas, and innovation is useful as the implementation that follows it, turning ideas into new or improved goods, services and processes.

      The first chart adds what innovation needs and what it does: it requires technical knowledge, competence, knowledge about market needs and trends, and financial support, and it meets new requirements or existing market needs. Its examples are the introduction of the iPhone, the tablet and the flat-screen TV.

      An organisation therefore needs both, in order: creativity first, innovation second. The charts also suggest a practical difference: innovation can be measured, creativity cannot.

      The charts leave a good deal open. They do not say how organisations encourage creativity, how they choose which ideas to implement, or how innovation is measured.
    rubric:
      - id: r1
        criterion: "Concept: creativity and innovation defined"
