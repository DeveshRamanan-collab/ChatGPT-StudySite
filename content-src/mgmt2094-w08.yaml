      - text: Mattimore
        why: >-
          Tempting because Mattimore (2012) is cited this week, but for the seven-tool Ideation Tool Kit, not for
          disruptive innovation.
      - text: Clayton Christensen
        correct: true
        why: >-
          Right. The activity sets out disruptive innovation 'in Clayton Christensen's theory' and asks whether each
          case is disruptive according to his definition.
      - text: Osterwalder and Pigneur
        why: >-
          Tempting because Osterwalder and Pigneur (2010) are cited this week, but for the answered what-if examples
          (IKEA, Skype, Grameenphone).
  - key: q416
    type: truefalse
    concept: disruptive-innovation
    difficulty: 1
    set: quickfire
    statement: In the class activity, every successful or radical innovation counts as disruptive.
    answer: false
    why: >-
      False. The activity opens by warning that not every successful or radical innovation is disruptive; disruption
      follows a particular path from the margin.
  - key: q417
    type: truefalse
    concept: disruptive-innovation
    difficulty: 1
    set: quickfire
    statement: >-
      On Christensen's definition as summarised in the activity, disruption usually begins with an overlooked, low-end
      or new-market customer segment.
    answer: true
    why: >-
      True. It begins by serving such a segment with a simpler, cheaper or more accessible offering, then improves
      enough to challenge established firms.
  - key: q418
    type: truefalse
    concept: disruptive-innovation
    difficulty: 2
    statement: "'Potentially disruptive' is one of the verdicts the class activity allows."
    answer: true
    why: >-
      True. The fifth question asks for a verdict — disruptive innovation, potentially disruptive, or not disruptive —
      and the group must defend it.
  - key: q419
    type: short
    concept: disruptive-innovation
    difficulty: 3
    prompt: >-
      "Any innovation that shakes up an industry is a disruptive innovation." Discuss this statement as a short essay,
      using Christensen's definition and the class activity's five questions, applied to one of the activity's cases
      (for example Canva vs professional design software). You do not need outside facts: say what evidence each
      question would need.
    model: >-
      The statement confuses impact with a particular path. The class activity warns that not every successful or
      radical innovation is disruptive. In Christensen's theory, disruptive innovation usually begins by serving an
      overlooked, low-end or new-market customer segment with a simpler, cheaper or more accessible offering, and then
      improves enough to challenge established firms. Shaking up an industry is the end of that story, not the test.


      Taking Canva vs professional design software, the five questions set out what a verdict needs. Incumbent:
      professional design software and the model built around trained designers. Initial customer: the activity asks
      whether Canva created a new market of non-designers, so we need evidence that its first users had never bought
      professional tools. Value proposition: what made it cheaper, simpler or more accessible. Market movement: whether
      it started outside the mainstream and then moved toward professional users. Verdict: only if all four point the
      same way is it disruptive; if it has stayed with non-designers, "potentially disruptive" is safer.


      So the statement is false as a definition: an innovation can transform an industry from the top, as a premium
      product can, without being disruptive. The definition says "usually", though, so a verdict remains a judgement to
      defend, not a calculation.
    rubric:
      - id: r1
        criterion: Concept — Christensen's definition stated accurately
        marks: 2
        top-band: >-
          States the definition with both halves (overlooked, low-end or new-market start with a simpler, cheaper or
          more accessible offer; later improvement that challenges incumbents).
        margin-note: Both halves of the path.
        authorities: []
      - id: r2
        criterion: Example — a real case from the class activity
        marks: 2
        top-band: Uses one of the activity's cases accurately, as a question to test rather than a settled answer.
        margin-note: Keep it a question the evidence must answer.
        authorities:
          - mgmt2094-class-activity-is-it-really-disruptive
      - id: r3
        criterion: Application — the five questions worked through
        marks: 3
        top-band: >-
          Works through incumbent, initial customer, value proposition and market movement, saying what evidence each
          needs, and gives a verdict.
        margin-note: "Good: evidence named for each question."
        authorities: []
      - id: r4
        criterion: Evaluation — impact vs path
        marks: 2
        top-band: >-
          Rejects the statement (impact is not the test; not every radical innovation is disruptive) and notes the limit
          that the definition says 'usually'.
        margin-note: Why is shaking up an industry not enough?
        authorities: []
  - key: q420
    type: match
    concept: disruptive-innovation
    difficulty: 2
    prompt: Match each of the class activity's questions to what it tests.
    pairs:
      - left: Incumbent
        right: The established company, industry or business model at risk
      - left: Initial customer
        right: Whether early users were underserved, overlooked or non-consumers
      - left: Value proposition
        right: What made it cheaper, simpler, more convenient or accessible
      - left: Market movement
        right: Whether it began outside the mainstream and moved toward it
      - left: Verdict
        right: Disruptive, potentially disruptive or not — defended
  - key: q501
    type: mcq
    concept: innovation-process-and-management
    difficulty: 1
    stem: What is the first step of the innovation process on the Week 8 slide?
    options:
      - text: Recognising or scanning the environment
        correct: true
        why: >-
          Right. The process starts with recognising or scanning the environment — the lecture stressed noticing what is
          changing outside the organisation first.
      - text: Generating technology in-house
        why: >-
          Tempting because technology is central, but generating technology in-house is step four, after scanning,
          aligning strategy and considering outside technology.
      - text: Executing and implementing the chosen innovation
        why: >-
          Tempting because action feels like the start, but executing and implementing is step six, after exploring and
          selecting the most suitable response.
      - text: Developing the organisation
        why: >-
          Tempting because innovation changes the organisation, but developing the organisation is the last step, after
          learning lessons for improvement.
  - key: q502
    type: mcq
    concept: innovation-process-and-management
    difficulty: 2
    stem: Which step comes immediately after scanning the environment?
    options:
      - text: Learning lessons for improvement
        why: >-
          Tempting because learning runs through innovation, but 'learning lessons for improvement' is step seven, near
          the end of the process.
      - text: Aligning the overall business strategy and the proposed innovation
        correct: true
        why: >-
          Right. Step two asks whether the innovation fits who we are, strengthens the strategy, or requires the
          strategy to change.
      - text: Exploring and selecting the most suitable response to the environment
        why: >-
          Tempting because it follows scanning logically, but on the slide exploring and selecting is step five, after
          the technology decisions.
      - text: Paying the innovators well
        why: >-
          Tempting, but paying the innovators well is the last bubble of the separate organisational process for
          innovation management, not a step of the innovation process.
  - key: q503
    type: mcq
    concept: innovation-process-and-management
    difficulty: 3
    stem: >-
      On the lecture's account, how do steps three and four ('acquiring technology from outside' and 'generating
      technology in-house') relate?
    options:
      - text: Both must always be done, in that order
        why: >-
          Tempting because both appear as numbered steps, but the lecture treated them as a choice, possibly combined,
          not two compulsory stages.
      - text: Step three is for products, step four for services
        why: >-
          Tempting as a neat split, but the slide does not divide them by product or service; it is a buy-or-build
          decision about technology.
      - text: "They are options: buy, build, or a hybrid of both"
        correct: true
        why: >-
          Right. The lecturer said the organisation can choose between acquiring technology from outside or generating
          it in-house, or use some kind of hybrid.
      - text: Only governments acquire technology from outside
        why: >-
          Tempting because national policy appears in the three levels, but acquiring outside technology is an
          enterprise choice in the innovation process.
  - key: q504
    type: mcq
    concept: innovation-process-and-management
    difficulty: 3
    stem: >-
      Reed (2018) reports Lego investing about 1 billion kroner and hiring about 100 people to search for sustainable
      materials, testing around 200 alternatives. Which steps of the innovation process does this most clearly show?
    options:
      - text: Executing and implementing the innovation across all of its factories
        why: >-
          Tempting because Lego is a big manufacturer, but most test materials have fallen short, so the plastic-free
          brick is not yet being executed in its factories.
      - text: Learning lessons for improvement after a completed launch
        why: >-
          Tempting because Lego is learning, but there has been no completed launch; the search is still at the
          exploring and selecting stage.
      - text: Scanning the environment and paying the innovators well
        why: >-
          Tempting because Lego did respond to consumer alarm about plastic waste, but the investment and testing
          described are the in-house and selection steps.
      - text: Generating technology in-house, and exploring and selecting the most suitable response
        correct: true
        why: >-
          Right. Lego's own research lab, budget and new hires generate the technology in-house, and methodically
          testing some 200 alternatives is exploring and selecting a response.
  - key: q505
    type: mcq
    concept: innovation-process-and-management
    difficulty: 2
    stem: At which level do 'government policies and support' operate, on the three-levels slide?
    options:
      - text: National level
        correct: true
        why: >-
          Right. The slide links the national level to government policies and support, which then flow down to
          enterprises and individuals.
      - text: Enterprise level
        why: >-
          Tempting because firms respond to policy, but the enterprise level is about enterprise policies, support and
          initiatives, not government policy.
      - text: Individual level
        why: >-
          Tempting because policies affect people, but the individual level covers individual and group innovation
          activities.
      - text: Team level
        why: >-
          Tempting because teams innovate, but the slide's three levels are national, enterprise and individual; team
          activity sits within the individual (and group) level.
  - key: q506
    type: mcq
    concept: innovation-process-and-management
    difficulty: 2
    stem: Which is NOT one of the three points on the 'What is innovation management?' slide?
    options:
      - text: Learning to find the most appropriate solution to the problem
        why: >-
          This is the first point: learning to find the most appropriate solution and managing that process in the ways
          best suited to the organisation's circumstances.
      - text: Maximising the number of patents filed each year
        correct: true
        why: >-
          Right. Patents are not mentioned; the slide defines innovation management as finding the most appropriate
          solution, searching for effective routines and managing learning.
      - text: The search for effective routines
        why: >-
          This is the second point: 'the search of effective routines' — the lecture said changing routines is very
          difficult because people get used to them.
      - text: Managing the learning process
        why: "This is the third point: managing the learning process to deal with the challenge of the innovation process."
  - key: q507
    type: mcq
    concept: innovation-process-and-management
    difficulty: 3
    stem: Why did the lecture say changing an organisation's routines is very difficult?
    options:
      - text: Routines are protected by law and need regulatory approval to change
        why: Tempting because some processes are regulated, but the lecture's reason was human habit, not legal protection.
      - text: Routines only exist at the national level, beyond a firm's control
        why: >-
          Tempting because national policy is one level of innovation, but routines exist in every organisation and
          team; the difficulty is habit.
      - text: People get used to them at every level
        correct: true
        why: >-
          Right. The lecturer said people get used to their routines personally, in teams and in departments, and ask
          why they should change.
      - text: Routines are always efficient, so changing them reduces quality
        why: >-
          Tempting because routines can be efficient, but the lecture did not say change reduces quality; it said
          innovation by definition changes routines, and people resist.
  - key: q508
    type: mcq
    concept: innovation-process-and-management
    difficulty: 2
    stem: Which comes first in the 'Organisational process for innovation management'?
    options:
      - text: Paying the innovators well
        why: Tempting because incentives matter, but paying the innovators well is the last bubble of the process.
      - text: Building partnership and alliances
        why: >-
          Tempting because alliances help early, but building partnership and alliances comes late, after setting
          unreasonable expectations.
      - text: Lowering the risks of experimentation
        why: >-
          Tempting because experimentation is central, but lowering its risks comes near the end, just before paying the
          innovators well.
      - text: Market learning
        correct: true
        why: >-
          Right. The process begins with market learning — understanding what is happening in the market and the
          external environment — before building business models.
  - key: q509
    type: mcq
    concept: innovation-process-and-management
    difficulty: 3
    stem: >-
      The organisational process includes 'setting unreasonable expectations and stretching the business definition'.
      Why 'unreasonable'?
    options:
      - text: Because innovation aims at something new that wasn't there before
        correct: true
        why: >-
          Right. The lecture: we want unreasonable expectations because we want to create something new, unconventional,
          something that wasn't there before.
      - text: Because staff work harder when targets are impossible to meet
        why: >-
          Tempting as a motivation theory, but the lecture's reason was about novelty, not effort; it did not claim
          impossible targets make staff work harder.
      - text: Because regulators set the expectations, not the firm
        why: >-
          Tempting, but the expectations are set by the organisation; the bubble pairs them with stretching its own
          business definition.
      - text: Because unreasonable expectations lower the risk of experiments
        why: >-
          Tempting because both bubbles are in the process, but lowering the risks of experimentation is a separate
          step; stretch targets do not lower risk.
  - key: q510
    type: mcq
    concept: innovation-process-and-management
    difficulty: 3
    stem: >-
      A bank runs an internal platform where any employee can pitch an idea, propose funding and recruit colleagues to
      work on it. Which part of the organisational process for innovation management does this illustrate?
    options:
      - text: Creating a cause and not a business
        why: >-
          Tempting because pitches can rally people, but 'creating a cause and not a business' is about the purpose that
          motivates innovation, not an internal market mechanism.
      - text: Setting unreasonable expectations and stretching the business definition
        why: >-
          Tempting because pitch platforms invite bold ideas, but the facts describe the flow of ideas, funding and
          people, not stretch targets.
      - text: Designing an open market for ideas, capital and talent
        correct: true
        why: >-
          Right. Letting ideas, money and people flow freely to promising projects is designing an open market for
          ideas, capital and talent.
      - text: Paying the innovators well
        why: >-
          Tempting because successful pitches may be rewarded, but nothing here concerns pay; it is the open allocation
          of ideas, capital and talent.
  - key: q511
    type: mcq
    concept: innovation-process-and-management
    difficulty: 2
    stem: Which bubble of the organisational process did the lecture explain as 'not necessarily just monetary'?
    options:
      - text: Building partnership and alliances
        why: >-
          Tempting because alliances involve exchanges, but the lecture's 'not necessarily monetary' remark was about
          rewarding innovators.
      - text: Listening to new voices
        why: >-
          Tempting because voices can be heard in many ways, but listening to new voices is about hearing as many people
          as possible, not about rewards.
      - text: Market learning
        why: >-
          Tempting, but market learning is about understanding the market and the external environment, the first step
          of the process.
      - text: Paying the innovators well
        correct: true
        why: >-
          Right. The lecturer said rewards are not necessarily just monetary: there must be a good result for the
          organisation and for the people who take part.
  - key: q512
    type: mcq
    concept: innovation-process-and-management
    difficulty: 3
    contrasts-with:
      - design-thinking
    stem: >-
      The innovation process on the slides is a numbered list of eight steps. How does Brown and Wyatt's (2010) design
      thinking process differ?
    options:
      - text: It is a system of overlapping spaces that projects may loop through more than once
        correct: true
        why: >-
          Right. Brown and Wyatt describe inspiration, ideation and implementation as overlapping spaces rather than
          orderly steps; projects may loop back more than once.
      - text: It has exactly eight steps too, but in reverse order
        why: >-
          Tempting if you think both are step models, but design thinking has three spaces, not eight steps, and the
          point is that they are not strictly sequential.
      - text: It skips prototyping and goes straight to implementation
        why: >-
          Tempting, but prototyping is at the core of the implementation space — ideas turned into products and services
          that are tested and refined.
      - text: It applies only to businesses, never to non-profits
        why: >-
          Tempting, but the reading is about social innovation: non-profits are beginning to adopt design thinking,
          which crosses public, for-profit and non-profit sectors.
  - key: q513
    type: mcq
    concept: innovation-process-and-management
    difficulty: 2
    stem: >-
      A team's solution to a workflow problem is adopted across the whole company. On the lecture's account of the three
      levels, what has happened?
    options:
      - text: A national-level policy has been imposed on the team
        why: >-
          Tempting because the slide's arrows run from national to enterprise to individual, but here the movement is
          upward from a team, not policy imposed from above.
      - text: A group-level innovation rose to the enterprise level
        correct: true
        why: >-
          Right. The lecture said that once a team finds a solution at the individual or group level, it may rise to the
          organisational (enterprise) level.
      - text: An invention has stayed within the R&D centre
        why: >-
          Tempting because invention is usually restricted to R&D, but this solution has spread across the company,
          which is a mark of innovation.
      - text: The innovation has moved from enterprise to national level
        why: >-
          Tempting as the next step up, but the facts stop at company-wide adoption; nothing suggests government policy
          or national-level change.
  - key: q514
    type: mcq
    concept: innovation-process-and-management
    difficulty: 3
    stem: >-
      Which step of the innovation process did the lecture link to adding to the organisation's capabilities and making
      it more competitive?
    options:
      - text: Acquiring technology from outside
        why: >-
          Tempting because buying technology adds capability, but the lecture tied capability and competitiveness to the
          final step of developing the organisation.
      - text: Aligning business strategy and the innovation
        why: >-
          Tempting because strategy shapes competitiveness, but alignment asks whether the innovation fits the strategy;
          it comes early, not as the capability-building finale.
      - text: Developing the organisation
        correct: true
        why: >-
          Right. The last step, developing the organisation, was explained as learning and adding to its capabilities so
          that it is more competitive.
      - text: Recognising or scanning the environment
        why: >-
          Tempting because scanning keeps a firm competitive, but it is the first step, about noticing environmental
          change, not building capability.
  - key: q515
    type: mcq
    concept: innovation-process-and-management
    difficulty: 4
    variant-of: q503
    stem: >-
      A retailer notices rising online competition, decides an app fits its strategy, licenses an app platform, tests
      three designs, launches one, reviews what went wrong and retrains staff. Which step of the eight did it skip?
    options:
      - text: Scanning the environment, because it only reacted to competitors
        why: >-
          Tempting, but noticing rising online competition is scanning the environment; reacting to competitors is
          exactly what that step is for.
      - text: Aligning strategy, because an app never fits retail
        why: Tempting, but the retailer explicitly decided the app fits its strategy — that is the alignment step.
      - text: Learning lessons, because it reviewed what went wrong
        why: >-
          Tempting because the wording is close, but reviewing what went wrong is learning lessons for improvement, so
          it was not skipped.
      - text: "None: buying rather than building is a valid choice"
        correct: true
        why: >-
          Right. It scanned, aligned, acquired, explored and selected, executed, learned and developed; generating
          technology in-house is the alternative to acquiring it, so omitting it is a choice.
  - key: q516
    type: mcq
    concept: innovation-process-and-management
    difficulty: 2
    stem: Which bubble of the organisational process did the lecture explain as listening to as many people as you can?
    options:
      - text: Listening to new voices
        correct: true
        why: >-
          Right. Listening to new voices was explained as listening to as many people as you can, alongside openness to
          new ideas and talent.
      - text: Market learning
        why: >-
          Tempting because market learning involves listening to the market, but it is about understanding the market
          and environment, not hearing new voices.
      - text: Creating a cause and not a business
        why: >-
          Tempting because a cause draws people in, but it is about purpose; the 'as many people as you can' remark was
          about listening to new voices.
      - text: Building partnership and alliances
        why: >-
          Tempting because partners bring new perspectives, but partnerships and alliances are about working with other
          organisations or communities.
  - key: q517
    type: truefalse
    concept: innovation-process-and-management
    difficulty: 1
    set: quickfire
    statement: The innovation process on the slide ends with 'learning lessons for improvement'.
    answer: false
    why: >-
      False. Learning lessons for improvement is step seven; the process ends with step eight, developing the
      organisation.
  - key: q518
    type: truefalse
    concept: innovation-process-and-management
    difficulty: 1
    set: quickfire
    statement: The organisational process for innovation management includes 'creating a cause and not a business'.
    answer: true
    why: >-
      True. After market learning and building business models, the process calls for creating a cause, not a business —
      a purpose people can rally to.
  - key: q519
    type: truefalse
    concept: innovation-process-and-management
    difficulty: 2
    statement: Innovation management, on the slide, is partly 'the search of effective routines'.
    answer: true
    why: >-
      True. It is the slide's second point; the lecturer added that innovation changes routines, which is hard because
      people at every level are used to them.
  - key: q520
    type: match
    concept: innovation-process-and-management
    difficulty: 2
    prompt: Match each step number to its step in the innovation process.
    pairs:
      - left: Step 1
        right: Recognising or scanning the environment
      - left: Step 2
        right: Aligning business strategy and the proposed innovation
      - left: Step 5
        right: Exploring and selecting the most suitable response
      - left: Step 6
        right: Executing and implementing innovation
      - left: Step 8
        right: Developing the organisation
  - key: q601
    type: mcq
    concept: value-innovation-and-what-if
    difficulty: 2
    set: pretest
    stem: According to the slide, when does a new technology become a value innovation?
    options:
      - text: As soon as it is patented by the firm
        why: >-
          Tempting because patents protect technology, but the slide's test for value innovation is affordability for
          mass buyers, not legal protection.
      - text: Only when it is cheap enough for mass buyers
        correct: true
        why: >-
          Right. Value innovation differs from technology innovation: new technology does not become a value innovation
          unless it is cheap enough for mass buyers.
      - text: When it builds layers of competitive advantage
        why: >-
          Tempting because it sounds strategic, but the slide says value innovation is different from building layers of
          competitive advantage.
      - text: When it is first developed in the R&D centre
        why: >-
          Tempting because technology starts there, but development in R&D is invention; value innovation needs superior
          buyer value at a price mass buyers can pay.
  - key: q602
    type: mcq
    concept: value-innovation-and-what-if
    difficulty: 2
    stem: Which describes the main focus of value innovation on the slide?
    options:
      - text: Segmenting the market carefully and accommodating each segment's needs
        why: >-
          Tempting because it is classic marketing, but the slide says value innovation does not mean segmenting the
          market and accommodating customer needs.
      - text: Building layers of competitive advantage over rivals
        why: Tempting, but the slide sets value innovation apart from building layers of competitive advantage.
      - text: Superior buyer value in existing markets, and a leap into new ones
        correct: true
        why: >-
          Right. Its main focus is products and services that create superior buyer value in existing markets and enable
          a quantum leap for the firm to create new markets.
      - text: Developing new technology regardless of its price
        why: >-
          Tempting, but the slide says new technology is not a value innovation unless it is cheap enough for mass
          buyers.
  - key: q603
    type: mcq
    concept: value-innovation-and-what-if
    difficulty: 2
    stem: Which examples did the lecturer use for value innovation?
    options:
      - text: IKEA and Skype
        why: >-
          Tempting because both appear on the next slides, but they were examples of 'What if' questions that got
          answered (Osterwalder and Pigneur, 2010).
      - text: The jetpack and the iPhone
        why: >-
          Tempting because both featured in the lecture, but the jetpack illustrated the Venn diagram and the iPhone why
          firms innovate.
      - text: Lego and VisionSpring
        why: >-
          Tempting because both come from this week's readings, but Lego illustrates goals and the three circles, and
          VisionSpring design thinking's prototyping.
      - text: Uber and Airbnb
        correct: true
        why: >-
          Right. For Uber the market, cars, drivers and internet were already there; it rethought the value. The
          lecturer said the same goes for Airbnb.
  - key: q604
    type: mcq
    concept: value-innovation-and-what-if
    difficulty: 3
    stem: Why, in the lecture, was Uber a value innovation rather than a technology innovation?
    options:
      - text: The pieces already existed; Uber rethought the value
        correct: true
        why: >-
          Right. Nothing massive was created: people needed to get places, and the cars, drivers and technology were
          there. Uber rethought the value.
      - text: Uber invented the smartphone and the GPS needed for ride-sharing
        why: >-
          Tempting because ride-sharing depends on phones, but the lecture's point was that the technology already
          existed; Uber did not invent it.
      - text: Uber was the first company ever to think of ride-sharing
        why: >-
          Tempting, but the lecturer said Uber was not necessarily the very first to think of this — it was the most
          successful implementation.
      - text: Uber built a new fleet of cars designed for its own drivers
        why: >-
          Tempting, but the lecture stressed that the cars and drivers were already there; Uber used existing resources
          rather than building new ones.
  - key: q605
    type: mcq
    concept: value-innovation-and-what-if
    difficulty: 1
    stem: What is the purpose of asking 'What if' questions, according to the slide?
    options:
      - text: To find the cheapest supplier for an existing product line
        why: >-
          Tempting because cost matters, but what-if questions are meant to provoke and disturb thinking, not to
          optimise purchasing.
      - text: To challenge assumptions and the status quo
        correct: true
        why: >-
          Right. We get held back by the status quo, which stifles imagination; asking 'What if' of conventional
          assumptions provokes and challenges our thinking.
      - text: To test whether a product complies with every regulation
        why: >-
          Tempting because compliance matters, but what-if questions deliberately imagine what seems impossible;
          legality is not their purpose.
      - text: To measure customer satisfaction with current products
        why: >-
          Tempting because research informs innovation, but measuring current satisfaction keeps you inside the status
          quo that what-if questions challenge.
  - key: q606
    type: mcq
    concept: value-innovation-and-what-if
    difficulty: 2
    stem: The slide says 'What if' questions are 'merely starting points'. What is the real challenge?
    options:
      - text: Writing the question in as few words as possible
        why: >-
          Tempting because good questions are crisp, but the slide puts the challenge in the business model, not in the
          wording.
      - text: Getting the question formally approved by senior management first
        why: >-
          Tempting in a hierarchy, but the slide does not mention approval; it says the hard part is finding a workable
          business model.
      - text: Finding the business model that could make the idea work
        correct: true
        why: >-
          Right. What-if questions are merely starting points; the challenge is to find the business model that could
          make the suggestion work.
      - text: Proving that the idea is impossible
        why: >-
          Tempting because some what-ifs are too provocative, but the aim is to make the seemingly impossible doable,
          not to prove it impossible.
  - key: q607
    type: mcq
    concept: value-innovation-and-what-if
    difficulty: 2
    stem: Which 'What if' question did the Grameenphone example answer?
    options:
      - text: What if voice calls over the internet were free?
        why: >-
          That is the Skype question: from 2003 it offered free voice calls over the internet, reaching 400 million
          registered users in five years.
      - text: What if furniture came in flat packs for customers to assemble at home?
        why: "That is the IKEA question: flat packs and DIY furniture assembly, introduced in the 1950s."
      - text: What if newspapers went purely digital?
        why: >-
          That is the slide's open discussion question about newspapers going purely digital — benefits and costs — not
          an answered example.
      - text: What if every Bangladeshi villager had access to a telephone?
        correct: true
        why: >-
          Right. Grameenphone, a partnership with Grameen Bank the micro-financier, asked this in the country with the
          lowest teledensity; it is now the largest taxpayer there.
  - key: q608
    type: mcq
    concept: value-innovation-and-what-if
    difficulty: 2
    stem: "According to the slide, five years after its 2003 launch Skype had:"
    options:
      - text: 400 million registered users making 100 billion free calls
        correct: true
        why: >-
          Right. After five years Skype had 400 million registered users who made 100 billion free calls. (The lecture
          recording said 'hundreds of billions'; the slide's figure governs.)
      - text: 100 million registered users making 400 billion paid calls
        why: >-
          Tempting because it uses the same numbers, but they are swapped, and the calls were free: 400 million users
          made 100 billion free calls.
      - text: become Bangladesh's largest taxpayer
        why: >-
          That is the Grameenphone result: it is now Bangladesh's largest taxpayer, after starting in the country with
          the lowest teledensity.
      - text: 4 million users paying for each call
        why: >-
          Tempting if you assume a business must charge per call, but Skype's what-if was free voice calling over the
          internet.
  - key: q609
    type: mcq
    concept: value-innovation-and-what-if
    difficulty: 3
    stem: >-
      A start-up asks: 'What if people could rent out their unused parking spaces by the hour through an app?' On the
      slides, what should it do next?
    options:
      - text: Drop it, because what-if questions that sound provocative are never answered
        why: >-
          Tempting because the slide says some are too provocative, but 'not all will be answered' does not mean none
          should be pursued.
      - text: Find a business model that could make it work
        correct: true
        why: >-
          Right. What-if questions are starting points: the challenge is to find the business model that could make it
          work, thinking through issues, benefits and costs.
      - text: Patent the question so competitors cannot ask it
        why: >-
          Tempting because ideas feel valuable, but the slide's next step is business-model design, not legal protection
          of a question.
      - text: Wait until the status quo changes by itself
        why: >-
          Tempting, but the slide's point is that the status quo holds us back; waiting for it to change is what what-if
          questions are meant to overcome.
  - key: q610
    type: mcq
    concept: value-innovation-and-what-if
    difficulty: 3
    contrasts-with:
      - what-is-innovation
    stem: >-
      A firm develops a water-purifying membrane that works perfectly but costs ten times what households can pay. On
      the Week 8 slides, why is it not yet a value innovation?
    options:
      - text: Value innovation only applies to services, never to products
        why: >-
          Tempting because Uber and Airbnb are services, but the slide speaks of products and services alike; the
          problem here is price.
      - text: It has not yet been patented, so no value exists
        why: >-
          Tempting because patents protect value, but the slide's test is affordability for mass buyers, not patent
          status.
      - text: It is internal and continuous, so it is operational innovation
        why: >-
          Tempting because the map is this week's other classification, but a product sold to households is external;
          the issue is price, not the quadrant.
      - text: It is not cheap enough for mass buyers
        correct: true
        why: >-
          Right. New technology does not become a value innovation unless it is cheap enough for mass buyers; a membrane
          households cannot afford fails that test.
  - key: q611
    type: mcq
    concept: value-innovation-and-what-if
    difficulty: 2
    stem: Which answered what-if example dates from the 1950s?
    options:
      - text: IKEA's flat packs and DIY furniture assembly
        correct: true
        why: "Right. The slide: IKEA introduced the ideas of flat packs and DIY furniture assembly in the 1950s."
      - text: Skype's free internet voice calls
        why: "Not this one: Skype launched in 2003, offering free voice calling over the internet."
      - text: Grameenphone's telephones for every Bangladeshi villager
        why: >-
          Not this one: Grameenphone came from a partnership with Grameen Bank the micro-financier; the slide links the
          1950s only to IKEA.
      - text: Uber's ride-hailing app
        why: >-
          Not this one: Uber is not on the what-if examples slide; the lecture used it for value innovation and slide 21
          for wishing.
  - key: q612
    type: mcq
    concept: value-innovation-and-what-if
    difficulty: 3
    stem: >-
      The slide calls value innovation 'one of the most prominent programmatic approaches to innovation currently in
      use'. Which statement is consistent with the slide?
    options:
      - text: It means building layers of competitive advantage
        why: >-
          Tempting because it sounds like strategy, but the slide expressly distinguishes value innovation from building
          layers of competitive advantage.
      - text: It does not mean segmenting and accommodating needs
        correct: true
        why: >-
          Right. Value innovation is different from building layers of competitive advantage and does not mean
          segmenting the market and accommodating customer needs.
      - text: It is the same thing as technology innovation
        why: >-
          Tempting because technology often enables value, but the slide says value innovation differs from technology
          innovation.
      - text: It applies only when a firm invents a new technology
        why: >-
          Tempting, but the lecture's Uber example shows value innovation can use technology that already exists;
          invention is not required.
  - key: q613
    type: mcq
    concept: value-innovation-and-what-if
    difficulty: 2
    stem: >-
      The slide asks: what if newspapers stopped printing altogether and went to purely digital distribution? What does
      it ask you to think through?
    options:
      - text: Only the printing costs saved
        why: >-
          Tempting because savings are an obvious benefit, but the slide asks for issues, benefits and costs together,
          not one side.
      - text: Which printing press to sell first
        why: >-
          Tempting as a practical first step, but the slide asks for analysis of issues, benefits and costs before any
          operational decision.
      - text: The issues, benefits and costs
        correct: true
        why: >-
          Right. The slide: 'Lets think of issues etc here, what are the benefits and costs?' — a what-if is a starting
          point for weighing a business model.
      - text: How to patent digital news
        why: Tempting because ideas feel ownable, but the slide's prompt is about benefits and costs, not legal protection.
  - key: q614
    type: mcq
    concept: value-innovation-and-what-if
    difficulty: 4
    variant-of: q610
    stem: >-
      A car-sharing firm uses existing cars, an existing app platform and drivers' spare time to offer cheaper trips to
      many people. A rival builds a new self-driving car that costs more than most buyers can pay. On the Week 8 slides,
      which is the value innovation?
    options:
      - text: "The rival: its new self-driving technology is a value innovation by definition"
        why: >-
          Tempting because the technology is new, but the slide says new technology is not a value innovation unless it
          is cheap enough for mass buyers.
      - text: "Both: anything new in transport creates value for some buyers"
        why: >-
          Tempting, but 'new' is not the test; the slide separates value innovation from technology innovation by buyer
          value and price.
      - text: "Neither: value innovation must always create a brand-new market first"
        why: >-
          Tempting because value innovation can enable new markets, but its main focus includes superior buyer value in
          existing markets.
      - text: "The car-sharing firm: it offers superior buyer value cheaply enough for mass buyers"
        correct: true
        why: >-
          Right. It rethinks existing resources to give mass buyers more value at a lower price — like the lecture's
          Uber — whereas the rival's technology is not cheap enough.
  - key: q615
    type: mcq
    concept: value-innovation-and-what-if
    difficulty: 3
    variant-of: q609
    stem: >-
      A council asks: 'What if every library card could also borrow tools and sewing machines?' Most staff call it
      impractical. On the slides, which response is best?
    options:
      - text: Treat it as a starting point and seek a workable model
        correct: true
        why: >-
          Right. What-if questions are starting points; with the right business model ingredients, what we think of as
          impossible may just be doable.
      - text: "Abandon it: impractical what-if questions waste time"
        why: >-
          Tempting because some what-ifs are too provocative, but the slide warns that the status quo stifles
          imagination; 'impractical' is where the challenge begins.
      - text: "Approve it immediately: every what-if should be implemented"
        why: >-
          Tempting as enthusiasm, but the slide says not all what-ifs will be answered; each needs a business model and
          a weighing of benefits and costs.
      - text: Replace it with a survey of current library satisfaction
        why: >-
          Tempting as cautious research, but surveying current satisfaction keeps you inside the status quo that what-if
          questions are designed to challenge.
  - key: q616
    type: mcq
    concept: value-innovation-and-what-if
    difficulty: 2
    stem: Which citation does the slide give for the answered what-if examples (IKEA, Skype, Grameenphone)?
    options:
      - text: Mattimore 2012
        why: Mattimore (2012) is the source of the seven-tool Ideation Tool Kit, not of the answered what-if examples.
      - text: Osterwalder and Pigneur 2010
        correct: true
        why: >-
          Right. The examples slide is credited to Osterwalder and Pigneur (2010), whose what-if questions lead into
          business-model design.
      - text: Eric F. Shaver 2014
        why: >-
          Shaver (2014) is cited for the definition of innovation on the 'What is an innovation?' slide, not for these
          examples.
      - text: Brown and Wyatt 2010
        why: >-
          Brown and Wyatt (2010) is this week's reading on design thinking for social innovation, not the source of
          these examples.
  - key: q617
    type: truefalse
    concept: value-innovation-and-what-if
    difficulty: 1
    set: quickfire
    statement: The slide says value innovation is the same as technology innovation.
    answer: false
    why: >-
      False. The slide says value innovation differs from technology innovation: new technology is not a value
      innovation unless it is cheap enough for mass buyers.
  - key: q618
    type: truefalse
    concept: value-innovation-and-what-if
    difficulty: 1
    set: quickfire
    statement: >-
      IKEA introducing flat packs and DIY furniture assembly in the 1950s is one of the slide's 'What if' questions that
      got answered.
    answer: true
    why: >-
      True. The slide (Osterwalder and Pigneur, 2010) lists IKEA alongside Skype and Grameenphone as what-if questions
      that got answered.
  - key: q619
    type: truefalse
    concept: value-innovation-and-what-if
    difficulty: 2
    statement: The slide says every 'What if' question will eventually be answered.
    answer: false
    why: >-
      False. The slide says not all what-if questions will be answered; some will be too provocative. They are starting
      points, not guarantees.
  - key: q620
    type: match
    concept: value-innovation-and-what-if
    difficulty: 2
    prompt: Match each example to the idea it illustrates in Week 8.
    pairs:
      - left: IKEA
        right: Flat packs and DIY furniture assembly (1950s)
      - left: Skype
        right: Free voice calls over the internet (2003)
      - left: Grameenphone
        right: A telephone for every Bangladeshi villager
      - left: Uber (lecture)
        right: Rethinking the value of cars, drivers and internet that already existed
  - key: q701
    type: mcq
    concept: ideation-toolkit
    difficulty: 2
    set: pretest
    stem: Which ideation tool asks a team to list 20–30 assumptions about a challenge and use several as creative triggers?
    options:
      - text: Opportunity redefinition
        why: >-
          Tempting because it also reworks the challenge, but redefinition picks three words of the opportunity
          statement and generates 8–10 alternatives for each.
      - text: Semantic intuition
        why: >-
          Tempting because it also uses words, but semantic intuition combines categories of key words to name a new
          idea, not lists of assumptions.
      - text: Questioning assumptions
        correct: true
        why: >-
          Right. Decide how to frame the challenge, generate 20–30 assumptions (true or false), then use several as
          thought starters for new ideas.
      - text: Picture prompts
        why: >-
          Tempting as another stimulus tool, but picture prompts use customised and random images to surface intuitions,
          not lists of assumptions.
  - key: q702
    type: mcq
    concept: ideation-toolkit
    difficulty: 2
    stem: >-
      'How do we sell more insurance to Catholics?' becomes 'How do we get practising young Catholics incentivised to
      sell life insurance to Catholic grandparents?' Which tool is this?
    options:
      - text: Questioning assumptions
        why: >-
          Tempting because it challenges who 'Catholics' are, but the mechanism — recombining alternatives for key words
          of the statement — is opportunity redefinition.
      - text: Wishing
        why: >-
          Tempting because the new statement is imaginative, but wishing starts by wishing for the impossible; this
          reworks the words of a real opportunity statement.
      - text: Worst idea
        why: >-
          Tempting because the result sounds odd, but worst idea starts from deliberately terrible ideas; this one
          recombines words of the challenge.
      - text: Opportunity redefinition
        correct: true
        why: >-
          Right. Pick the three most interesting words ('we', 'sell', 'Catholics'), generate 8–10 alternatives for each,
          then combine them into a new opportunity statement.
  - key: q703
    type: mcq
    concept: ideation-toolkit
    difficulty: 2
    stem: >-
      In opportunity redefinition, how many words of the opportunity statement do you pick, and how many alternatives
      for each?
    options:
      - text: Three words, with 8–10 alternatives each
        correct: true
        why: >-
          Right. Pick the three most interesting words (the who, what, where, when or how) and generate 8–10 creative
          alternatives for each, then combine them.
      - text: One word only, with 20–30 alternatives for it
        why: >-
          Tempting because 20–30 appears this week, but that is the number of assumptions (questioning) or wishes
          (wishing), not redefinition alternatives.
      - text: Five words, with 3–5 alternatives each
        why: >-
          Tempting as a middle option, but the slide says the three most interesting words and 8–10 alternatives for
          each.
      - text: Every word, with one alternative each
        why: >-
          Tempting, but the slide asks you to choose the three most interesting words, not to rework every word of the
          statement.
  - key: q704
    type: mcq
    concept: ideation-toolkit
    difficulty: 2
    stem: Which tool begins with the assumption that anything is possible — money, energy and time are no object?
    options:
      - text: Worst idea
        why: >-
          Tempting because both remove pressure, but worst idea starts from deliberately terrible ideas, not from
          impossible wishes.
      - text: Wishing
        correct: true
        why: >-
          Right. Wishing starts by wishing for the impossible — even violating the laws of nature — then works out how
          to make some of it happen.
      - text: Picture prompts
        why: >-
          Tempting because images free the imagination, but picture prompts use visual stimuli; they do not start from
          'anything is possible'.
      - text: Questioning assumptions
        why: >-
          Tempting because it loosens limits, but questioning assumptions lists what we assume about the challenge,
          rather than wishing beyond all limits.
  - key: q705
    type: mcq
    concept: ideation-toolkit
    difficulty: 2
    stem: The slide compares triggered brainwalking to vanilla ice cream. What is the point of the analogy?
    options:
      - text: It is plain and predictable, so teams should avoid it altogether
        why: >-
          Tempting if 'vanilla' means boring, but the slide calls vanilla delicious by itself; the point is that
          additions make it more so.
      - text: It works only in short, informal workshops with a small group
        why: >-
          Tempting as a literal reading, but nothing on the slide limits the setting; the analogy is about combining
          techniques.
      - text: Good alone, better combined with other techniques
        correct: true
        why: >-
          Right. Like vanilla ice cream — delicious alone, special with banana, chocolate sauce and sprinkles —
          brainwalking can be combined with other techniques.
      - text: It must always be used last, after every other technique
        why: >-
          Tempting because toppings go on last, but the slide's point is combination, not order; it also ensures
          everyone gets the chance to contribute.
  - key: q706
    type: mcq
    concept: ideation-toolkit
    difficulty: 3
    stem: >-
      A team turns 'improve teamwork' into synonyms (meeting, information exchange; advance, upgrade), combines them
      into 'upgrade information exchange', and lands on new information software. Which tool did it use?
    options:
      - text: Opportunity redefinition
        why: >-
          Close, because both play with words, but redefinition rewrites an opportunity statement; semantic intuition
          combines key words to name a new idea.
      - text: Questioning assumptions
        why: Tempting because it rethinks teamwork, but no assumptions were listed; the team combined synonyms into a name.
      - text: Triggered brainwalking
        why: >-
          Tempting because it is a group technique, but brainwalking ensures everyone contributes; the mechanism here is
          combining key words.
      - text: Semantic intuition
        correct: true
        why: >-
          Right. This is the slide's own example: combining categories of key words and synonyms to name a new idea
          ('upgrade information exchange') before knowing what it is.
  - key: q707
    type: mcq
    concept: ideation-toolkit
    difficulty: 3
    stem: What best distinguishes semantic intuition from opportunity redefinition?
    options:
      - text: One names a new idea from keywords; the other rewrites the challenge
        correct: true
        why: >-
          Right. Semantic intuition combines keyword categories to create a name for a new idea; opportunity
          redefinition recombines alternatives for key words into a new opportunity statement.
      - text: Semantic intuition relies on pictures and images; redefinition relies on words
        why: >-
          Tempting because both are stimulus tools, but pictures belong to picture prompts; semantic intuition and
          redefinition both work with words.
      - text: Semantic intuition lists assumptions, whereas redefinition lists impossible wishes
        why: >-
          Tempting, but listing assumptions is questioning assumptions and listing wishes is wishing — two other tools
          in Mattimore's kit.
      - text: There is no difference; they are two names for one tool
        why: >-
          Tempting because both play with words, but they differ in output: a name for a new idea versus a reframed
          challenge.
  - key: q708
    type: mcq
    concept: ideation-toolkit
    difficulty: 2
    stem: Picture prompts are said to be good for which kind of challenge?
    options:
      - text: Purely numerical financial forecasting and budgeting problems
        why: >-
          Tempting as a contrast, but the slide does not mention forecasting; it highlights personnel and management
          challenges because images surface feelings.
      - text: Personnel and management innovation challenges
        correct: true
        why: >-
          Right. Visual techniques bring intuitions, emotions and feelings to the surface, which the slide says suits
          personnel and management innovation challenges.
      - text: Legal compliance checks
        why: Tempting, but compliance is not mentioned; the slide's emphasis is on intuitions, emotions and feelings.
      - text: Only manufacturing problems
        why: >-
          Tempting because the slide's example uses industrial scenes for a manufacturing problem, but that shows
          customising images, not a limit to manufacturing.
  - key: q709
    type: mcq
    concept: ideation-toolkit
    difficulty: 3
    stem: For a manufacturing problem, the slide recommends picture prompts that…
    options:
      - text: show only the firm's own products, photographed on the factory floor
        why: >-
          Tempting because they are relevant, but the slide asks for customised industrial scenes plus random pictures,
          not just the firm's own products.
      - text: avoid any image linked to the problem, so the team's thinking stays free
        why: >-
          Tempting because random pictures are recommended, but the slide says customise visuals to the challenge as
          well as adding random ones.
      - text: show industrial scenes and things being made, plus some random pictures
        correct: true
        why: >-
          Right. Customise visuals to the challenge — industrial scenes, things being made, manipulated or transformed —
          and add some random pictures for uncanny connections.
      - text: are drawn by hand by the team's most senior manager in the session
        why: >-
          Tempting in a hierarchy, but the slide says nothing about who draws them; it is about choosing customised and
          random images.
  - key: q710
    type: mcq
    concept: ideation-toolkit
    difficulty: 1
    stem: Which tool asks a team to create a list of really terrible ideas, then turn them into good ones?
    options:
      - text: Worst idea
        correct: true
        why: >-
          Right. Collectively list bad ideas, then turn them into good ones by thinking of the opposite or finding
          something of value. It takes the creative pressure off.
      - text: Wishing
        why: Tempting because both feel playful, but wishing starts from impossible wishes, not deliberately bad ideas.
      - text: Questioning assumptions
        why: >-
          Tempting because bad ideas can expose assumptions, but questioning assumptions begins by listing 20–30
          assumptions about the challenge.
      - text: Semantic intuition
        why: >-
          Tempting because odd word combinations can look like bad ideas, but semantic intuition combines key words to
          name an idea.
  - key: q711
    type: mcq
    concept: ideation-toolkit
    difficulty: 3
    stem: >-
      In the Week 8 tutorial, groups must increase the sales of new 4WD utes to women. Applying questioning assumptions,
      which is the best first move?
    options:
      - text: Wish for a ute that flies over traffic, then work out how to build one
        why: >-
          Tempting because it is creative, but that is wishing; questioning assumptions starts by listing what we assume
          about the challenge.
      - text: List assumptions about buyers and uses, then use some as triggers
        correct: true
        why: >-
          Right. Frame the challenge and generate 20–30 assumptions (like the slide's razor list: who buys, what for,
          which channel), then use several as triggers.
      - text: Pick random pictures of utes and vote on them
        why: Tempting as a visual technique, but that is picture prompts, and voting is not part of either tool.
      - text: List ten terrible ute ideas and turn them around
        why: That is the tutorial's other task — worst ideas — not questioning assumptions.
  - key: q712
    type: mcq
    concept: ideation-toolkit
    difficulty: 2
    stem: Why does the worst idea tool help a team, according to the slide?
    options:
      - text: It guarantees the final idea will be cheap and quick to produce
        why: >-
          Tempting because some reversed ideas are simple, but the slide makes no claim about cost; its benefit is
          removing creative pressure.
      - text: It replaces the need for any immersion or customer research
        why: >-
          Tempting because it generates ideas quickly, but no ideation tool replaces immersion; the ideation process
          still calls for knowing your customer.
      - text: It takes the creative pressure off and is fun, with positive results
        correct: true
        why: Right. Listing bad ideas takes the creative pressure off the team and is a bit of fun, with positive results.
      - text: It filters out every risky or provocative idea early
        why: "Tempting, but worst idea does the opposite of filtering: it welcomes terrible ideas and mines them for value."
  - key: q713
    type: mcq
    concept: ideation-toolkit
    difficulty: 3
    stem: >-
      A facilitator asks a team for 25 'impossible' wishes about commuting, then uses the most fantastic ones to spark
      realistic ideas. Which tool is this, and what does the slide suggest it may have produced in the real world?
    options:
      - text: Questioning assumptions — IKEA flat packs
        why: >-
          Tempting because IKEA is a famous what-if, but listing wishes is not listing assumptions, and IKEA appears as
          an answered what-if, not this tool's example.
      - text: Worst idea — Skype's free calls
        why: >-
          Tempting because both reverse expectations, but worst idea starts from bad ideas, and Skype is an answered
          what-if example.
      - text: Picture prompts — Grameenphone
        why: >-
          Tempting, but no pictures are used here, and Grameenphone illustrates an answered what-if question, not
          picture prompts.
      - text: Wishing — perhaps the Uber concept
        correct: true
        why: >-
          Right. Generating 20–30 wishes and working from the most fantastic is wishing; the slide wonders whether Uber
          came from wishing for more convenient transport.
  - key: q714
    type: mcq
    concept: ideation-toolkit
    difficulty: 2
    stem: What does triggered brainwalking ensure, according to the slide?
    options:
      - text: Everyone gets the chance to contribute ideas
        correct: true
        why: >-
          Right. Brainwalking lends itself to combination with other techniques and ensures everyone gets the chance to
          contribute ideas.
      - text: Only the single best idea from the session is ever recorded
        why: >-
          Tempting because sessions aim at good ideas, but brainwalking is about broad contribution, not recording one
          idea.
      - text: The leader chooses the winning idea
        why: >-
          Tempting in a hierarchy, but the slide's emphasis is on everyone contributing, not on a leader picking a
          winner.
      - text: Ideas are judged as they are offered
        why: >-
          Tempting, but judging ideas as they come works against generation; the ideation process and Brown and Wyatt
          both stress quantity and deferring judgement.
  - key: q715
    type: mcq
    concept: ideation-toolkit
    difficulty: 4
    variant-of: q711
    stem: >-
      A bakery wants more weekday sales. The team lists: 'customers buy bread for breakfast', 'our customers are local
      families', 'bread must be fresh that day'. It then asks: 'What if we sold day-old bread as cheap toast kits to
      office workers?' Which tool has it used?
    options:
      - text: "Opportunity redefinition: it rewrote the opportunity statement word by word"
        why: >-
          Tempting because the market changes, but it did not pick three words and recombine alternatives; it questioned
          listed assumptions.
      - text: "Questioning assumptions: it listed assumptions and used one as a trigger"
        correct: true
        why: >-
          Right. It framed the challenge, listed assumptions about customers and freshness, and used one ('fresh that
          day') as a trigger — like the slide's teenage-girls razor.
      - text: "Semantic intuition: it combined synonyms to name the idea"
        why: >-
          Tempting because 'toast kits' is a new name, but no keyword categories or synonyms were combined; the idea
          came from challenging an assumption.
      - text: "Worst idea: it deliberately produced a terrible idea"
        why: >-
          Tempting if the idea sounds odd, but it was not produced as a deliberately bad idea; it came from reversing an
          assumption.
  - key: q716
    type: truefalse
    concept: ideation-toolkit
    difficulty: 1
    set: quickfire
    statement: Mattimore (2012) lists seven tools in the Ideation Tool Kit.
    answer: true
    why: "True. The slide: according to Mattimore (2012) there are 7 tools, from questioning assumptions to worst idea."
  - key: q717
    type: truefalse
    concept: ideation-toolkit
    difficulty: 2
    set: quickfire
    statement: In semantic intuition, you must use all the key words you combined in the final idea.
    answer: false
    why: >-
      False. The slide says it doesn't matter in the end whether you use any of the words or all of them; the
      combinations are only stimuli.
  - key: q718
    type: truefalse
    concept: ideation-toolkit
    difficulty: 2
    set: quickfire
    statement: Picture prompts should use only images closely related to the problem; random pictures are to be avoided.
    answer: false
    why: >-
      False. The slide recommends customising visuals to the challenge and also using some random pictures, because
      people make uncanny connections.
  - key: q719
    type: short
    concept: ideation-toolkit
    difficulty: 3
    prompt: >-
      "Ideation tools are just games; real innovation comes from analysis." Discuss this statement as a short essay,
      applying two tools from Mattimore's (2012) Ideation Tool Kit — questioning assumptions and worst idea — to the
      Week 8 tutorial challenge of increasing sales of new 4WD utes to women.
    model: >-
      The statement is half right: the tools are playful by design, but the play has a job. Mattimore's (2012) Ideation
      Tool Kit offers seven tools for getting past the status quo, which the lecture says stifles imagination.


      Questioning assumptions asks a team to frame the challenge, generate 20–30 assumptions (true or false) and use
      several as thought starters. For utes, we might assume buyers are mainly men, utes are bought mainly for work,
      dealerships are the main channel, and women prefer smaller vehicles. Questioning the last one, as the slide did
      when it asked what an inexpensive razor for teenage girls would look like, opens ideas such as a ute presented for
      weekend sport and camping. That is analysis of a kind: it exposes what the firm takes for granted.


      Worst idea asks the team to list really terrible ideas — the tutorial's "Hair in a Can" style — and turn them into
      good ones by thinking of the opposite or finding something of value. "Paint every ute pink" is terrible; its
      opposite, letting buyers choose colours and trims online, may work. The slide says this takes the creative
      pressure off, with positive results.


      Where the statement has force is selection: the tools widen options but do not test them. The ideation process
      still needs criteria such as revenue potential to cut the list to three to five. Games generate; analysis chooses.
    rubric:
      - id: r1
        criterion: Concept — the two tools described accurately
        marks: 2
        top-band: >-
          Describes questioning assumptions (frame, 20–30 assumptions, use some as triggers) and worst idea (terrible
          ideas turned around) in the slide's terms, citing Mattimore (2012).
        margin-note: Mechanism of each tool, in the slide's terms.
        authorities: []
      - id: r2
        criterion: Example — the slide or tutorial examples
        marks: 2
        top-band: Uses the slide's worked example (the razor assumptions) or the tutorial's (Hair in a Can) accurately.
        margin-note: Which slide example models your move?
        authorities: []
      - id: r3
        criterion: Application — both tools applied to the ute challenge
        marks: 3
        top-band: >-
          Lists plausible assumptions and turns one into an idea; produces a worst idea and reverses it into a workable
          option.
        margin-note: "Good: each tool produced an idea."
        authorities: []
      - id: r4
        criterion: Evaluation — games vs analysis
        marks: 2
        top-band: >-
          Weighs the statement: the tools generate and expose assumptions, but criteria and shortlisting are still
          needed; reaches a qualified verdict.
        margin-note: What do the tools not do?
        authorities: []
  - key: q720
    type: match
    concept: ideation-toolkit
    difficulty: 2
    prompt: Match each ideation tool to its mechanism.
    pairs:
      - left: Questioning assumptions
        right: List 20–30 assumptions and use some as triggers
      - left: Opportunity redefinition
        right: Recombine alternatives for three key words of the challenge
      - left: Wishing
        right: Wish for the impossible, then make some of it happen
      - left: Semantic intuition
        right: Combine key-word categories to name a new idea
      - left: Picture prompts
        right: Use customised and random images to surface intuitions
      - left: Worst idea
        right: Turn really terrible ideas into good ones
  - key: q801
    type: mcq
    concept: design-thinking
    difficulty: 2
    stem: Brown and Wyatt (2010) describe the design thinking process as…
    options:
      - text: a strict sequence of eight milestone-based steps that cannot be repeated
        why: >-
          Tempting because the lecture's innovation process has eight steps, but Brown and Wyatt contrast design
          thinking with linear, milestone-based processes.
      - text: a single brainstorming session followed by launch
        why: >-
          Tempting because brainstorming features in ideation, but design thinking also needs field research and
          prototyping, and loops through its spaces.
      - text: a survey-driven process that asks people what they want
        why: >-
          Tempting because research matters, but the reading says focus groups and surveys rarely yield important
          insights because they simply ask people what they want.
      - text: a system of overlapping spaces rather than a sequence of orderly steps
        correct: true
        why: >-
          Right. Inspiration, ideation and implementation are overlapping spaces that projects may loop back through
          more than once.
  - key: q802
    type: mcq
    concept: design-thinking
    difficulty: 1
    stem: What are the three spaces of design thinking in Brown and Wyatt (2010)?
    options:
      - text: Inspiration, ideation and implementation
        correct: true
        why: >-
          Right. Inspiration (the problem or opportunity that motivates the search), ideation (generating, developing
          and testing ideas) and implementation (the path into people's lives).
      - text: Immersion, iteration and invention
        why: >-
          Tempting because immersion appears in the lecture's ideation process, but Brown and Wyatt's spaces are
          inspiration, ideation and implementation.
      - text: Desirability, feasibility and viability
        why: >-
          Tempting because it is also a three-part model this week, but those echo the circles of the Venn diagram, not
          the spaces of design thinking.
      - text: Scanning, aligning and executing
        why: >-
          Tempting because they are steps of the lecture's innovation process, but Brown and Wyatt's three spaces are
          inspiration, ideation and implementation.
  - key: q803
    type: mcq
    concept: design-thinking
    difficulty: 2
    stem: Why did Shanti keep using water from the local borehole rather than the Naandi treatment centre?
    options:
      - text: The centre was too far from her home for her to walk to each day
        why: Tempting, but the reading says the centre was within easy walking distance — roughly a third of a mile.
      - text: Flaws in the system's design, not distance, price or habit
        correct: true
        why: >-
          Right. The centre was close, affordable and well known, and habit was not a factor; she could not carry the
          required 5-gallon jerrican and would not buy a monthly card for more than she needed.
      - text: The treated water was simply too expensive for her family to afford
        why: >-
          Tempting, but the reading says it was affordable (about 10 rupees for 5 gallons); being able to pay had even
          become a status symbol for some villagers.
      - text: "Habit: her family had always used the borehole and saw no reason to change"
        why: >-
          Tempting because her family had drunk local water for generations, but the reading expressly says habit isn't
          a factor; the system's design is.
  - key: q804
    type: mcq
    concept: design-thinking
    difficulty: 3
    stem: In the inspiration space, why do Brown and Wyatt prefer observing people's behaviour to focus groups and surveys?
    options:
      - text: Surveys and focus groups are simply too expensive for most non-profits to run
        why: >-
          Tempting because budgets are tight, but the reading's objection is that such methods rarely yield important
          insights, not their cost.
      - text: Focus groups cannot legally be run in many developing countries
        why: >-
          Tempting as a practical barrier, but the reading says nothing of legality; its point is that people often
          cannot tell us their needs.
      - text: People often can't say what they need, but their behaviour reveals unmet needs
        correct: true
        why: >-
          Right. Conventional research asks people what they want and yields incremental ideas ('a faster horse');
          behaviour gives clues to unmet needs, so designers observe and shadow people.
      - text: Observation is always quicker and cheaper than any other research method
        why: Tempting, but homestays and shadowing take time; the reading's reason is insight, not speed.
  - key: q805
    type: mcq
    concept: design-thinking
    difficulty: 2
    stem: What is a 'T-shaped' person in Brown and Wyatt (2010)?
    options:
      - text: Someone who works only on technical tasks and avoids other disciplines
        why: >-
          Tempting because the vertical stroke is a deep skill, but the top of the T — collaboration across disciplines
          — is the essential part.
      - text: A team leader who directs two departments at the same time
        why: >-
          Tempting as a picture of two arms, but the T describes an individual's skills, not the management of
          departments.
      - text: Someone with broad general skills but no real depth in any of them
        why: >-
          Tempting, but the reading says every team member needs a depth of skill (the vertical) as well as breadth of
          empathy (the top).
      - text: Deep in one skill, with empathy across disciplines
        correct: true
        why: >-
          Right. The vertical stroke is a depth of skill that makes tangible contributions; the top is where the design
          thinker is made — empathy for people and disciplines beyond one's own.
  - key: q806
    type: mcq
    concept: design-thinking
    difficulty: 2
    stem: What rule do Brown and Wyatt give for brainstorming during ideation?
    options:
      - text: Defer judgement and discourage devil's advocates
        correct: true
        why: >-
          Right. One rule is to defer judgement and discourage the obstructive, non-generative role of devil's advocate;
          participants generate as many ideas as possible.
      - text: Start by choosing the single best idea, then refine only that one
        why: >-
          Tempting for efficiency, but the reading wants many ideas first: 'To have a good idea you must first have lots
          of ideas' (Linus Pauling).
      - text: Let the most senior person speak first
        why: >-
          Tempting in hierarchies, but nothing in the reading supports it; the emphasis is on diverse, multidisciplinary
          participation.
      - text: Limit the session to ten ideas
        why: >-
          Tempting as a limit, but the reading says groups may generate hundreds of ideas, ranging from the absurd to
          the obvious.
  - key: q807
    type: mcq
    concept: design-thinking
    difficulty: 3
    stem: VisionSpring's prototype of children's eye screening showed that…
    options:
      - text: children preferred being screened by their teacher
        why: Tempting because it was tried, but when the teacher screened the next student, that child also started to cry.
      - text: children were at ease when they screened each other
        correct: true
        why: >-
          Right. A girl burst into tears in a traditional test, and so did the next child screened by the teacher;
          children who screened each other loved playing doctor and complied.
      - text: traditional eye tests worked well for young children
        why: >-
          Tempting, but the first girl screened by traditional tests burst into tears — the pressure was too great and
          the risk of failure too high.
      - text: eye camps were unnecessary once glasses were cheap
        why: >-
          Tempting, but VisionSpring went on to run eye camps for children; prototyping shaped the screening process
          rather than removing the camps.
  - key: q808
    type: mcq
    concept: design-thinking
    difficulty: 3
    stem: >-
      Kara Pecknold was asked to build a website for rural Rwandan weavers. Why is her project an example of the
      inspiration space?
    options:
      - text: She built the website as briefed and launched it on schedule for the cooperative
        why: >-
          Tempting because it was the original task, but the point of the example is that she did not; she reframed the
          brief from what she observed.
      - text: She ran a survey asking the weavers what they wanted
        why: >-
          Tempting, but she did not rely on asking; she had the women photograph their lives and draw what success
          looked like, since she did not speak their language.
      - text: She reframed the brief after finding the weavers had little access to computers
        correct: true
        why: >-
          Right. Finding they had little or no access to computers or the internet, she broadened the brief to ask what
          services could help improve their livelihoods.
      - text: She prototyped a loom and tested it with the weavers
        why: >-
          Tempting because the women are weavers, but she did not prototype a product; the example is about reframing
          the brief in the inspiration space.
  - key: q809
    type: mcq
    concept: design-thinking
    difficulty: 2
    stem: What is at the core of the implementation space?
    options:
      - text: Writing the project brief and its constraints
        why: >-
          Tempting because the brief frames everything, but writing it is the classic starting point of inspiration, not
          the core of implementation.
      - text: Observing and shadowing people in their homes
        why: >-
          Tempting because observation is central to design thinking, but homestays and shadowing belong to the
          inspiration space.
      - text: Generating hundreds of ideas on Post-it notes
        why: >-
          Tempting because ideation can produce hundreds of ideas, but that belongs to the ideation space;
          implementation prototypes the best of them.
      - text: Prototyping, testing and refining
        correct: true
        why: >-
          Right. Implementation turns the best ideas into a concrete action plan; at its core is prototyping — products
          and services tested, iterated and refined.
  - key: q810
    type: mcq
    concept: design-thinking
    difficulty: 2
    stem: According to Brown and Wyatt, one of the biggest impediments to adopting design thinking is…
    options:
      - text: lack of technology
        why: >-
          Tempting because tools matter, but the reading's impediments are organisational: lack of embrace, resisting a
          human-centred approach, and fear of failure.
      - text: simple fear of failure
        correct: true
        why: >-
          Right. The reading says one of the biggest impediments is simply fear of failure; experimentation and failure
          are fine if they happen early and are a source of learning.
      - text: a shortage of trained designers
        why: >-
          Tempting, but the reading says design thinking taps capacities we all have; the barrier it names is fear of
          failure.
      - text: too many customers
        why: >-
          Tempting as a distraction, but the reading wants close work with clients and consumers; it does not treat
          customers as an impediment.
  - key: q811
    type: mcq
    concept: design-thinking
    difficulty: 3
    stem: In the lecture's ideation process, what is the goal when the team expands the range of possible solutions?
    options:
      - text: Quality, not quantity — record only ideas likely to succeed in the market
        why: >-
          Tempting because ideas must eventually be good, but filtering comes later, once criteria are defined; at this
          stage the goal is quantity.
      - text: A single, fully costed and complete business model for the board
        why: >-
          Tempting because the process ends in business models, but complete models come only for shortlisted ideas, at
          the very end.
      - text: Quantity, not quality — as many ideas as possible, with brainstorming rules
        correct: true
        why: >-
          Right. The team expands the range of possible solutions, aiming for as many ideas as possible; quantity, not
          quality, and brainstorming rules are paramount.
      - text: A shortlist of three to five ideas ready to present
        why: >-
          Tempting because it is part of the process, but the shortlist of three to five comes after defining criteria,
          not while expanding solutions.
  - key: q812
    type: mcq
    concept: design-thinking
    difficulty: 2
    stem: Why does the lecture's ideation process ask whether the team is 'sufficiently diverse'?
    options:
      - text: Diverse teams no longer need any immersion or customer research
        why: >-
          Tempting, but the next question on the slide is about immersion — research, knowing the customer, new
          technologies — which every team still needs.
      - text: Diversity guarantees that the team's first idea will be right
        why: >-
          Tempting, but the process expands ideas then filters with criteria; diversity widens options, it does not make
          the first idea right.
      - text: Diversity is required by regulation
        why: "Tempting, but the slide's reason is creative: diverse teams generate fresher business-model ideas."
      - text: Varied age, seniority, experience and customer knowledge
        correct: true
        why: >-
          Right. Diversity in age, seniority, experience and customer knowledge generates fresh business-model ideas;
          the lecture noted a new intern may see past routines.
  - key: q813
    type: mcq
    concept: design-thinking
    difficulty: 3
    variant-of: q811
    stem: >-
      A team has generated 120 ideas for a new service. Following the lecture's ideation process, what should it do
      next?
    options:
      - text: Define criteria, then cut to a shortlist of three to five
        correct: true
        why: >-
          Right. After expanding solutions, the team defines context-specific criteria (eg revenue potential, impact on
          competitive advantage) to reduce ideas to a shortlist of three to five.
      - text: Launch all 120 ideas at once to see which ones succeed
        why: >-
          Tempting as rapid experimentation, but the process narrows ideas with criteria before building complete
          business models for a few.
      - text: Pick whichever idea the CEO likes best and build that one
        why: Tempting in practice, but the slide asks for defined criteria, not one person's preference.
      - text: Generate another 120 before judging any
        why: >-
          Tempting because quantity matters early, but once the range is expanded the process moves to criteria and a
          shortlist.
  - key: q814
    type: mcq
    concept: design-thinking
    difficulty: 4
    contrasts-with:
      - innovation-process-and-management
    stem: >-
      A manager says: 'Design thinking is just the lecture's eight-step innovation process with a new name.' What is the
      best reply?
    options:
      - text: "Yes: both start with scanning and end with developing the organisation"
        why: >-
          Tempting because both begin by looking outward, but design thinking's spaces are inspiration, ideation and
          implementation, not scanning to developing the organisation.
      - text: "No: design thinking's spaces overlap and loop, and it is human-centred from the start"
        correct: true
        why: >-
          Right. Brown and Wyatt describe overlapping spaces (inspiration, ideation, implementation) that projects loop
          through, grounded in people's needs, unlike linear, milestone-based processes.
      - text: "No: design thinking has no ideation stage"
        why: Tempting as a quick distinction, but ideation is the second space of design thinking.
      - text: "Yes: both are linear and milestone-based"
        why: >-
          Tempting, but the reading contrasts design thinking with the linear, milestone-based processes organisations
          typically undertake.
  - key: q815
    type: mcq
    concept: design-thinking
    difficulty: 3
    stem: The Sternins' work in Vietnam is used by Brown and Wyatt to show design thinking relying on…
    options:
      - text: government nutritional supplements delivered at national scale
        why: >-
          Tempting because it was the prevailing approach, but the reading says government supplements never delivered
          the hoped-for results.
      - text: outside nutrition experts flown in to design new fortified foods
        why: >-
          Tempting, but the point is the reverse: the solution came from local families, not outsiders designing new
          foods.
      - text: local solutions from families already doing well
        correct: true
        why: >-
          Right. Positive deviance looks for solutions among people already doing well: very poor families with healthy
          children added tiny shrimps, crabs, snails and sweet-potato greens and fed smaller, more frequent meals.
      - text: surveys of what parents said they wanted
        why: >-
          Tempting, but the Sternins observed food preparation, cooking and serving in the six positive-deviant
          families; they did not rely on what people said.
  - key: q816
    type: mcq
    concept: design-thinking
    difficulty: 2
    stem: What is the brief, in Brown and Wyatt's inspiration space?
    options:
      - text: A complete, detailed set of instructions that answers the question in advance
        why: >-
          Tempting, but the reading says the brief is not a set of instructions or an attempt to answer the question
          before it has been posed; it leaves room for serendipity.
      - text: A summary of survey results from focus groups
        why: Tempting, but the brief comes before research, and the reading is sceptical of focus groups and surveys.
      - text: The final prototype handed to the client
        why: >-
          Tempting because it is a handover document, but prototypes belong to implementation; the brief is the starting
          point of inspiration.
      - text: A set of mental constraints giving a framework, benchmarks and objectives
        correct: true
        why: >-
          Right. The brief gives the team a framework to begin from, benchmarks to measure progress, and objectives such
          as price point, technology and market segment.
  - key: q817
    type: truefalse
    concept: design-thinking
    difficulty: 1
    set: quickfire
    statement: Brown and Wyatt say focus groups and surveys rarely yield important insights.
    answer: true
    why: >-
      True. These techniques mostly ask people what they want; conventional research points to incremental improvements
      rather than breakthroughs.
  - key: q818
    type: truefalse
    concept: design-thinking
    difficulty: 1
    set: quickfire
    statement: According to Brown and Wyatt, design thinking is used only by businesses.
    answer: false
    why: >-
      False. Businesses were first to embrace it, but non-profits are beginning to adopt it; it crosses public,
      for-profit and non-profit boundaries.
  - key: q819
    type: truefalse
    concept: design-thinking
    difficulty: 2
    statement: In Brown and Wyatt, a brief that is too narrow almost guarantees an incremental, likely mediocre outcome.
    answer: true
    why: >-
      True. Too abstract and the team wanders; too narrow a set of constraints almost guarantees an outcome that is
      incremental and, likely, mediocre.
  - key: q820
    type: short
    concept: design-thinking
    difficulty: 3
    prompt: >-
      "Design thinking is just brainstorming with sticky notes." Discuss this statement as a short essay, using Brown
      and Wyatt's (2010) three spaces and applying them to redesigning the Naandi water treatment centre that Shanti
      does not use.
    model: >-
      The statement mistakes one moment in the ideation space for the whole method. Brown and Wyatt (2010) describe
      design thinking as a human-centred approach that uses consumer insights in depth and rapid prototyping to get
      beyond the assumptions that block effective solutions. Its process is a system of overlapping spaces, not orderly
      steps.


      Inspiration comes first: a brief, then observing what people actually do. Shanti's case shows why. The centre was
      close, affordable and well known, and habit was not the reason she stayed away; she could not carry its 5-gallon
      jerrican, and she would not buy a monthly card for more water than she needed. Observing her day would reframe the
      brief from "produce clean water" to "get clean water into homes like hers".


      Ideation is where the sticky notes belong: a diverse, T-shaped team synthesises those insights and brainstorms
      while deferring judgement — say, containers shaped for carrying on the head or hip, or buying smaller amounts.
      Implementation then prototypes the favourites with villagers and refines them, as VisionSpring did with eye
      screening.


      So brainstorming is one part of one space. The method's real demands are field observation before ideas and
      prototyping after them, and its biggest obstacle, Brown and Wyatt say, is fear of failure — which sticky notes do
      not solve.
    rubric:
      - id: r1
        criterion: Concept — the three spaces and the human-centred approach
        marks: 2
        top-band: >-
          Explains inspiration, ideation and implementation as overlapping spaces, with the role of consumer insight and
          prototyping.
        margin-note: Three spaces, overlapping, not steps.
        authorities:
          - mgmt2094-brown-and-wyatt-2010-design-thinking-for-social-innovation
      - id: r2
        criterion: Example — Shanti and at least one other reading example
        marks: 2
        top-band: >-
          States accurately why Shanti does not use the centre (jerrican, monthly card; not distance, price or habit)
          and uses another example such as VisionSpring or Pecknold.
        margin-note: Why did Shanti stay away? Get the reasons right.
        authorities:
          - mgmt2094-example-naandi-water-centre
          - mgmt2094-example-visionspring
      - id: r3
        criterion: Application — the spaces applied to the redesign
        marks: 3
        top-band: >-
          Reframes the brief from observation, generates options with a diverse team deferring judgement, and plans
          prototyping with villagers.
        margin-note: "Good: each space does work in the redesign."
        authorities: []
      - id: r4
        criterion: Evaluation — answering the statement
        marks: 2
        top-band: >-
          Locates brainstorming within ideation only, names what the statement leaves out (observation, prototyping) and
          an impediment (fear of failure), and concludes.
        margin-note: What does brainstorming alone miss?
        authorities: []
  - key: q821
    type: match
    concept: design-thinking
    difficulty: 2
    prompt: Match each example from Brown and Wyatt (2010) to the design thinking space it best illustrates.
    pairs:
      - left: Kara Pecknold reframing the weavers' brief
        right: Inspiration
      - left: T-shaped teams brainstorming and deferring judgement
        right: Ideation
      - left: VisionSpring prototyping children's eye screening
        right: Implementation
