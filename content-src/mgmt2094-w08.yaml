  - key: q319
    type: match
    concept: innovation-map
    difficulty: 1
    prompt: Match each quadrant of the innovation map to its position on the two axes.
    pairs:
      - left: Operational innovation
        right: Internal, continuous
      - left: Management innovation
        right: Internal, discontinuous
      - left: Product & service innovation
        right: External, continuous
      - left: Strategic innovation
        right: External, discontinuous
  - key: q320
    type: short
    concept: innovation-map
    difficulty: 3
    prompt: >-
      "An innovative organisation should be changing everything, all the time." Discuss this statement as a short essay,
      using the characteristics of innovation and the innovation map, and apply it to a café chain that (a) speeds up
      its coffee-making a little each month, (b) restructures its regional management, (c) refreshes its brand each
      season and (d) launches a delivery subscription for people who never visit cafés.
    model: >-
      The statement ignores two things the Week 8 slides insist on: innovations differ in magnitude — the degree to
      which they deviate from the past — and in where they happen. The innovation map sets internal against external and
      continuous against discontinuous, and each quadrant has its own rhythm.


      The café's faster coffee-making is operational innovation, internal and continuous: it should be improved all the
      time, and customers barely see it. Its brand refresh is product & service innovation, external and continuous,
      where the map places brand. Those two support the statement.


      The regional restructure is management innovation, internal and discontinuous. The lecture said people get tired
      of constant change, so it should be changed once in a while, then left to settle so the rewards are reaped. The
      delivery subscription for non-visitors is strategic innovation, external and discontinuous, the quadrant where the
      map puts disruptive innovation and new markets — the kind of case the class activity tests, such as whether
      Netflix was genuinely disruptive to video stores. Strategy should change when called upon, not constantly.


      So an innovative organisation innovates continuously in two quadrants and deliberately, not constantly, in the
      other two. The map's limit is that labels such as technological innovation appear on both sides, so placing an
      innovation still takes judgement.
    rubric:
      - id: r1
        criterion: Concept — the characteristics and the map's two axes
        marks: 2
        top-band: >-
          Explains magnitude (deviation from the past) and the map's internal–external and continuous–discontinuous axes
          with all four quadrants.
        margin-note: Both axes, all four quadrants.
        authorities: []
      - id: r2
        criterion: Example — a real example from the materials
        marks: 2
        top-band: >-
          Links the strategic quadrant to a real case from the class activity (eg Netflix vs video rental) or another
          Week 8 example, accurately framed as a question to test.
        margin-note: Tie the quadrant to a real case.
        authorities:
          - mgmt2094-class-activity-is-it-really-disruptive
      - id: r3
        criterion: Application — the four café changes placed
        marks: 3
        top-band: >-
          Places each change in the right quadrant with a reason and says how often each should change (continuous vs
          once in a while).
        margin-note: "Good: placement plus tempo for each."
        authorities: []
      - id: r4
        criterion: Evaluation — answering the statement
        marks: 2
        top-band: >-
          Rejects "everything, all the time" for the discontinuous quadrants, notes a limit of the map (overlapping
          labels), and concludes.
        margin-note: Which quadrants make the statement false?
        authorities: []
  - key: q401
    type: mcq
    concept: disruptive-innovation
    difficulty: 2
    set: pretest
    stem: In Christensen's theory, as summarised in the Week 8 class activity, disruptive innovation usually begins by…
    options:
      - text: launching a premium product that outperforms the incumbents on every measure their best customers value
        why: >-
          Tempting because breakthrough products often do this, but out-performing incumbents for their best customers
          is the opposite of starting at the low end or in a new market.
      - text: acquiring the market leader outright and then cutting its prices to undercut rivals
        why: >-
          Tempting because big firms reshape markets this way, but acquisition is not innovation; disruption starts
          outside the mainstream with a simpler offering.
      - text: lobbying regulators to protect a new technology
        why: >-
          Tempting because regulation shapes markets, but the class activity's definition says nothing about regulators;
          it turns on who is served first and with what.
      - text: serving an overlooked, low-end or new-market segment with a simpler, cheaper or more accessible offering
        correct: true
        why: >-
          Right. Disruption usually begins by serving an overlooked, low-end or new-market segment with a simpler,
          cheaper or more accessible offering, then improves enough to challenge incumbents.
  - key: q402
    type: mcq
    concept: disruptive-innovation
    difficulty: 1
    stem: "Complete the class activity's opening line: 'Not every successful or radical innovation is…'"
    options:
      - text: disruptive
        correct: true
        why: >-
          Right. The first line warns that success and radicalness are not the test of disruption; the path from the
          margin of the market is.
      - text: commercialised
        why: >-
          Tempting, but by the Week 8 definition every innovation is commercialised; the activity's warning is about
          over-using the label 'disruptive'.
      - text: creative
        why: >-
          Tempting because some innovations look unoriginal, but the activity's point is narrower: being successful or
          radical does not make something disruptive.
      - text: valuable
        why: >-
          Tempting because some innovations fail to add value, but the activity warns against calling every successful
          or radical innovation disruptive.
  - key: q403
    type: mcq
    concept: disruptive-innovation
    difficulty: 2
    stem: >-
      In the class activity, which question asks whether the innovation started outside the mainstream and later moved
      toward mainstream customers?
    options:
      - text: Incumbent
        why: >-
          Tempting because disruption is measured against incumbents, but this question only identifies who might be
          disrupted, not the path the innovation took.
      - text: Market movement
        correct: true
        why: >-
          Right. 'Market movement' asks whether it started outside the mainstream and subsequently moved toward
          mainstream customers — the 'improves enough to challenge' half.
      - text: Value proposition
        why: >-
          Tempting because cheapness often explains the entry point, but this question asks what made the offer cheaper,
          simpler, more convenient or accessible.
      - text: Initial customer
        why: >-
          Close, because it asks who it first appealed to, but whether it later moved toward the mainstream is the
          separate 'market movement' question.
  - key: q404
    type: mcq
    concept: disruptive-innovation
    difficulty: 3
    stem: >-
      A start-up sells a basic, low-cost accounting app to sole traders who had never bought accounting software. Five
      years on it is adding features medium-sized firms want, and incumbent vendors are losing customers. On the class
      activity's questions, the best verdict is:
    options:
      - text: "Not disruptive: it started with small customers the incumbents had ignored, so it never competed"
        why: >-
          Tempting if you think disruption needs head-on competition, but starting with customers incumbents overlooked
          is exactly how Christensen says disruption usually begins.
      - text: "Not disruptive: any software product is a technology innovation"
        why: >-
          Tempting because it is software, but the activity's test is the customer path and value proposition, not
          whether the product uses technology.
      - text: "Disruptive innovation: it began with non-consumers and moved toward the mainstream"
        correct: true
        why: >-
          Right. Non-consumers (sole traders), a simpler and cheaper offer, then improving toward medium firms while
          incumbents lose customers: every question points to disruption.
      - text: "Potentially disruptive: it has not yet appealed to anyone"
        why: >-
          Tempting because 'potentially disruptive' is a valid verdict, but the app already appeals to sole traders and
          is moving up-market, with incumbents losing ground.
  - key: q405
    type: mcq
    concept: disruptive-innovation
    difficulty: 3
    stem: >-
      A kitchen-appliance firm launches a premium smart oven, priced above its rivals and aimed at their best customers,
      with better performance. On Christensen's definition as given in the activity, it is best described as:
    options:
      - text: Disruptive, because any new technology disrupts an industry
        why: >-
          Tempting because new technology feels disruptive, but the activity's test is the path through the market;
          technology alone is not the criterion.
      - text: Disruptive, because it targets the most profitable mainstream buyers
        why: >-
          Tempting because disruption ends up challenging the mainstream, but on this definition it usually begins
          outside it, with overlooked or low-end customers.
      - text: Disruptive, because premium pricing signals a radical new offering
        why: >-
          Tempting because it is radical, but the activity warns that not every radical innovation is disruptive; a
          pricier, better product for top customers runs the other way.
      - text: Not disruptive on this definition
        correct: true
        why: >-
          Right. It starts at the top of the market, not with overlooked, low-end or new-market customers, and is
          neither simpler nor cheaper; success or radicalness alone does not make it disruptive.
  - key: q406
    type: mcq
    concept: disruptive-innovation
    difficulty: 2
    stem: Which verdicts does the class activity allow?
    options:
      - text: Disruptive innovation, potentially disruptive, or not disruptive
        correct: true
        why: >-
          Right. The fifth question asks for a verdict — disruptive innovation, potentially disruptive, or not
          disruptive — and the group must defend it.
      - text: Disruptive or not disruptive only
        why: >-
          Tempting as a yes/no test, but the activity adds 'potentially disruptive' for innovations, such as generative
          AI, whose path is not yet clear.
      - text: Incremental, radical or revolutionary
        why: >-
          Tempting because these describe magnitude, but the activity's verdicts are about Christensen's disruption, not
          the degree of change.
      - text: Operational, management, product & service or strategic innovation
        why: >-
          Tempting because the innovation map is this week's other classification, but these are its quadrants; the
          activity's verdicts are about disruption only.
  - key: q407
    type: mcq
    concept: disruptive-innovation
    difficulty: 3
    stem: >-
      For which case does the class activity ask whether it is 'disruptive innovation or simply a new platform business
      model'?
    options:
      - text: Uber vs taxis
        why: >-
          Tempting because Uber is also a platform, but its row asks whether Uber is truly disruptive according to
          Christensen's definition.
      - text: Airbnb vs traditional hotels
        correct: true
        why: >-
          Right. The Airbnb row asks exactly this — a reminder that a new business model is not automatically
          disruptive.
      - text: Canva vs professional design software
        why: "Tempting, but Canva's row asks a different question: did it create a new market of non-designers?"
      - text: Spotify vs CDs/music downloads
        why: >-
          Tempting, but Spotify's row asks where the disruption actually occurred, not whether it is merely a platform
          model.
  - key: q408
    type: mcq
    concept: disruptive-innovation
    difficulty: 3
    stem: >-
      The Canva row asks: 'Did Canva create a new market of non-designers?' Which part of the definition does that
      question test?
    options:
      - text: Whether it moved toward mainstream customers later
        why: >-
          Tempting because that is the second half of the theory, but the Canva question is about who the first
          customers were, not the later move.
      - text: Whether there is an incumbent to disrupt at all
        why: >-
          Tempting because professional design software is the incumbent, but the question about non-designers tests the
          starting segment, not who is disrupted.
      - text: Whether it began with a new-market or non-consumer segment
        correct: true
        why: >-
          Right. Non-designers who never bought professional design software are non-consumers; the question tests the
          'new-market' starting point.
      - text: Whether its design technology is new enough to be patented in law
        why: >-
          Tempting because technology often matters, but patents play no part in the activity's five questions or in
          Christensen's definition as given.
  - key: q409
    type: mcq
    concept: disruptive-innovation
    difficulty: 2
    stem: The activity's 'value proposition' question asks what made the innovation…
    options:
      - text: more luxurious, exclusive and expensive
        why: >-
          Tempting because exclusive products can succeed, but they run against the activity's definition, which begins
          with simpler, cheaper or more accessible offers.
      - text: patented, regulated and government-backed
        why: >-
          Tempting because protection matters to inventors, but nothing in the five questions concerns patents,
          regulation or government support.
      - text: faster and more powerful for the incumbent's best customers
        why: >-
          Tempting because performance wins sales, but out-performing for the incumbent's best customers is competing
          head-on at the top, not the activity's disruptive path.
      - text: cheaper, simpler, more convenient or accessible
        correct: true
        why: >-
          Right. That is the kind of offer that wins overlooked or low-end customers, the usual starting point of
          disruption.
  - key: q410
    type: mcq
    concept: disruptive-innovation
    difficulty: 4
    stem: >-
      A group concludes: 'ChatGPT is disruptive because it is radical and hugely successful.' What is the strongest
      criticism on the class activity's terms?
    options:
      - text: Generative AI cannot be an innovation because it is software
        why: >-
          Tempting as a narrow view, but software can be commercialised and adopted; the issue is whether it follows the
          disruptive path, not whether it is innovation.
      - text: Success and radicalness are not the test; walk the five questions instead
        correct: true
        why: >-
          Right. Not every successful or radical innovation is disruptive; the ChatGPT row asks whether it could become
          disruptive, and to whom — that needs the five questions.
      - text: The activity has already settled that ChatGPT is definitely not disruptive
        why: >-
          Tempting if you misread the row, but the activity leaves it open: 'Could generative AI become disruptive, and
          to whom?'
      - text: Only physical products can be disruptive innovations
        why: >-
          Tempting if disruption means hardware, but the activity's own cases include Netflix, Spotify, Canva and
          ChatGPT, which are services and software.
  - key: q411
    type: mcq
    concept: disruptive-innovation
    difficulty: 3
    contrasts-with:
      - value-innovation-and-what-if
    stem: Which statement best separates disruptive innovation (class activity) from value innovation (lecture slides)?
    options:
      - text: Disruption always uses new technology; value innovation never does
        why: >-
          Tempting, but neither definition turns on technology: disruption is about the path through the market, and
          value innovation explicitly differs from technology innovation.
      - text: Value innovation must be expensive; disruption must be free
        why: >-
          Tempting as a caricature, but value innovation must be cheap enough for mass buyers, and disruption usually
          starts cheaper, not free.
      - text: Disruption starts at the margin; value innovation lifts buyer value in existing markets
        correct: true
        why: >-
          Right. Disruption begins outside the mainstream and moves in; value innovation offers superior buyer value in
          existing markets, cheap enough for mass buyers, and may create new markets.
      - text: They are the same idea under two names
        why: >-
          Tempting because both reshape markets and the lecture used Uber for value innovation, but the definitions
          differ: one is about where you start, the other about buyer value.
  - key: q412
    type: mcq
    concept: disruptive-innovation
    difficulty: 2
    stem: The Spotify row asks 'Where did the disruption actually occur?'. What does this push a group to identify?
    options:
      - text: Which country and city Spotify happened to launch in first
        why: >-
          Tempting as a 'where' question, but the activity's 'where' is about the market and incumbent disrupted, not
          geography.
      - text: Which recording artist earned the most money from streaming
        why: >-
          Tempting because streaming changed artist income, but the five questions focus on incumbents, initial
          customers, value proposition and market movement.
      - text: Which patent or licence Spotify's technology relied on most
        why: Tempting because technology matters, but nothing in the activity's questions concerns patents or licences.
      - text: Which incumbent or model was actually disrupted
        correct: true
        why: >-
          Right. It is the 'incumbent' question in sharper form: CDs, downloads or another model? A verdict needs the
          right incumbent before the other questions make sense.
  - key: q413
    type: mcq
    concept: disruptive-innovation
    difficulty: 3
    variant-of: q404
    stem: >-
      A firm sells cheap, no-frills hearing aids online to people who found clinic-fitted devices too costly and never
      bought one. So far it has stayed in that niche and incumbents have not lost mainstream customers. Verdict on the
      class activity's terms?
    options:
      - text: "Potentially disruptive: right start, but no move to the mainstream yet"
        correct: true
        why: >-
          Right. Non-consumers and a cheaper, more accessible offer fit the start of the path, but 'market movement' is
          not yet shown, so 'potentially disruptive' is the defensible verdict.
      - text: "Disruptive innovation: any cheap product is disruptive"
        why: >-
          Tempting because cheapness is in the definition, but cheapness alone is not enough; the path from the margin
          toward the mainstream is what makes disruption.
      - text: "Not disruptive: it serves non-consumers rather than the incumbents' own customers"
        why: >-
          Tempting if you think disruption must take incumbents' customers from day one, but serving non-consumers first
          is exactly how the definition says it usually begins.
      - text: "Not an innovation: it is not sold through clinics"
        why: >-
          Tempting because the channel is unconventional, but selling a new product to customers who adopt it is
          commercialisation; the channel does not decide that.
  - key: q414
    type: mcq
    concept: disruptive-innovation
    difficulty: 2
    stem: In the class activity, what does the 'Incumbent' question ask?
    options:
      - text: Who did the innovation initially appeal to, and were they overlooked?
        why: >-
          This is the second question ('Initial customer'), which asks whether the first customers were underserved,
          overlooked or non-consumers.
      - text: Which established firm, industry or model may be disrupted?
        correct: true
        why: >-
          Right. The first question names the established company, industry or business model that is potentially being
          disrupted.
      - text: What made the innovation cheaper, simpler or more convenient to use?
        why: >-
          This is the third question ('Value proposition'), about what made the innovation cheaper, simpler, more
          convenient or accessible.
      - text: Did the innovation move toward the mainstream?
        why: >-
          This is the fourth question ('Market movement'), about whether it started outside the mainstream and moved
          toward mainstream customers.
  - key: q415
    type: mcq
    concept: disruptive-innovation
    difficulty: 2
    stem: Whose theory of disruptive innovation does the class activity apply?
    options:
      - text: Eric F. Shaver
        why: >-
          Tempting because Shaver (2014) is cited this week, but for the definition of innovation itself, not for
