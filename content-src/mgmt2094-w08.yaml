      - text: Only the types that appear on the innovation map count as real innovation
        why: >-
          Tempting because the map organises some types, but many listed types (value, experiential, user-led) are not
          on the map and still count.
      - text: Each group project must cover every type listed on the slide
        why: >-
          Tempting if you think breadth earns marks, but the lecturer said you can choose more than one, though one type
          would probably be sufficient.
      - text: "It is a sample: more types exist, and one suffices for the project"
        correct: true
        why: >-
          Right. The lecturer said the slide is just a sample, that you can come up with more types, and that choosing
          one type would probably be sufficient for the project.
  - key: q314
    type: mcq
    concept: innovation-map
    difficulty: 3
    stem: The fourth characteristic of innovation on the slide is its impact. What does that mean?
    options:
      - text: Its significance or range of effects
        correct: true
        why: >-
          Right. A final characteristic is the impact of the change — the significance or range of its effects, from a
          team's routine to a society's culture.
      - text: The physical force needed to make the product
        why: >-
          Tempting as a literal reading of 'impact', but the slide means how significant and wide-ranging the effects of
          the change are.
      - text: The share price change on the day of launch
        why: >-
          Tempting because markets react to launches, but the slide's impact is about the change's effects on its
          object, not a short-term financial reaction.
      - text: How many patents the change produces
        why: >-
          Tempting as a measurable output, but patents are not mentioned; impact is the significance or range of the
          change's effects.
  - key: q315
    type: mcq
    concept: innovation-map
    difficulty: 3
    stem: Which of these labels lies on the internal half of the innovation map?
    options:
      - text: Channels
        why: >-
          Channels sit with strategic innovation on the external half: how the organisation reaches customers is an
          external, discontinuous matter.
      - text: Partner interfaces
        correct: true
        why: >-
          Right. Partner interfaces sit by management innovation in the internal, discontinuous quadrant, with internal
          structures, networking and people management.
      - text: Customer interfaces and experiences
        why: >-
          Customer interfaces and experiences sit with strategic innovation on the external half, beside supply chain
          and Blue Ocean Strategy.
      - text: New offerings
        why: New offerings sit by strategic innovation on the external half, with new markets and channels.
  - key: q316
    type: truefalse
    concept: innovation-map
    difficulty: 1
    set: quickfire
    statement: On the innovation map, operational innovation is internal and continuous.
    answer: true
    why: >-
      True. Operational innovation (processes, technological innovation) sits top left: internal and continuous —
      constant improvement that customers rarely see.
  - key: q317
    type: truefalse
    concept: innovation-map
    difficulty: 2
    set: quickfire
    statement: On the innovation map, strategic innovation is the quadrant that should change continuously.
    answer: false
    why: >-
      False. Strategic innovation is discontinuous: the lecture said strategy should change only when called upon,
