        correct: true
        why: >-
          Right. People management sits with management innovation (internal, discontinuous); it is not one of the
          strategic labels.
      - text: Blue Ocean Strategy
        why: >-
          This is placed with strategic innovation on the map, alongside new offerings, new markets, channels and
          disruptive innovation.
      - text: New markets
        why: >-
          This is placed with strategic innovation, bottom right, as an external and discontinuous change to where the
          organisation competes.
      - text: Channels
