      - text: Product & service innovation
        correct: true
        why: >-
          Right. A new branded range and regularly refreshed displays are customer-facing and ongoing: product & service
          innovation, where the map places brand.
      - text: Management innovation
        why: >-
          Tempting because managers make the decisions, but management innovation concerns internal structures and
          people management, not products on shelves.
  - key: q310
    type: mcq
    concept: innovation-map
    difficulty: 2
