      - text: Management innovation
        correct: true
        why: >-
          Right. Restructuring internal structures and people management, then leaving it to settle, is management
          innovation: internal and discontinuous.
      - text: Strategic innovation
        why: >-
          Tempting because it is a big, discontinuous change, but it is internal — structure and staff — not new
          markets, channels or offerings.
      - text: Product & service innovation
        why: >-
          Tempting because patients experience the hospital's service, but the change described is to internal structure
          and people management, made once.
  - key: q312
    type: mcq
    concept: innovation-map
    difficulty: 4
    contrasts-with:
      - disruptive-innovation
    stem: >-
      A streaming start-up launches a cheap, simple service for people who never bought the incumbents' product, then
      moves up-market. A classmate places it under 'Product & service innovation' because customers see the product.
      What is the best correction?
    options:
      - text: "It is internal: streaming is software, so operational innovation"
        why: >-
          Tempting because streaming runs on software, but the innovation is what reaches customers and markets; the
          internal side of the map is processes and people management.
      - text: It is management innovation, because the founders run it
        why: >-
          Tempting because founders manage the firm, but management innovation is about internal structures and people
          management, not entering a new market.
      - text: "It is discontinuous: a new market, so strategic innovation"
        correct: true
        why: >-
          Right. Customer visibility makes it external, but entering a new market and potentially disrupting incumbents
          is a break with the past: the strategic quadrant, where disruption sits.
      - text: "No correction: anything customers see is product & service"
        why: >-
          Tempting because the map does put brand in product & service, but that quadrant is continuous; a new-market
          entry is discontinuous.
  - key: q313
    type: mcq
    concept: innovation-map
    difficulty: 2
    stem: Which statement about the 'Types of Innovation' slide matches the lecture?
    options:
