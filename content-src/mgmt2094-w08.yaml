      The activity turns the definition into five questions:

      1. **Incumbent** — what established company, industry or business model is potentially being disrupted?

      2. **Initial customer** — who did it first appeal to? Was this customer underserved, overlooked or a non-consumer?

      3. **Value proposition** — what made it cheaper, simpler, more convenient or accessible?

      4. **Market movement** — did it start outside the mainstream and then move toward mainstream customers?

      5. **Verdict** — disruptive innovation, potentially disruptive, or not disruptive? Defend the decision.


      Its cases are open questions, not settled answers: Netflix vs video rental, Airbnb vs hotels (disruptive, or
      simply a

      new platform business model?), Uber vs taxis, Canva vs professional design software (a new market of
      non-designers?),

      Spotify vs CDs and downloads (where did the disruption actually occur?), Tesla vs traditional car makers, and
      ChatGPT

      vs traditional search (could it become disruptive, and to whom?).


      On the innovation map, disruptive innovation sits with strategic innovation: external and discontinuous.


      **Exam use:** never call something disruptive because it is new, big or successful — walk the questions and defend
      a

      verdict.
  - slug: innovation-process-and-management
    title: The innovation process and innovation management
    visual: palace
    visual-brief: >-
      Eight rooms in order along the innovation process — scan, align, acquire, generate, explore and select, execute,
      learn, develop — with the acquire and generate rooms side by side as a choice; the last room opens onto the three
      levels (national, enterprise, individual) and the nine-step organisational process for innovation management.
    related:
      - why-innovate-goals-and-sources
      - design-thinking
    depends-on:
      - what-is-innovation
    contrasts-with:
      - design-thinking
    cases: []
    authorities:
      - mgmt2094-reed-2018-lego-plastic-free-brick
    verify: false
    body: >-
      **The innovation process:** 1 recognising or scanning the environment; 2 aligning the overall

      business strategy and the proposed innovation; 3 acquiring technology from outside; 4 generating technology
      in-house;

      5 exploring and selecting the most suitable response to the environment; 6 executing and implementing innovation;

      7 learning lessons for improvement; 8 developing the organisation. Steps 3 and 4 are a choice — buy, build or a

      hybrid. Lego's materials search (Reed, 2018) — its own lab, about 100 new hires, some 200 materials tested — is

      generating in-house, and exploring and selecting.


      **Three levels.** Innovation occurs at the national level (government policies and support), the enterprise level

      (enterprise policies, support and initiatives) and the individual level (individual and group innovation
      activities).

      A team's solution can rise to the organisational level.


      **Innovation management** is learning to find the most appropriate solution to the problem and managing that
      process

      in the ways best suited to the organisation's circumstances; the search for effective routines; and managing the

      learning process. Changing routines is hard: people at every level are used to them.


      **Organisational process for innovation management:** market learning → building business models → creating a
      cause,

      not a business → an open market for ideas, capital and talent → listening to new voices → unreasonable
      expectations

      and stretching the business definition → partnerships and alliances → lowering the risks of experimentation →
      paying

      the innovators well.


      **Exam use:** say which step an organisation is at, and which management lever moves it on.
  - slug: value-innovation-and-what-if
    title: Value innovation and "What if" questions
    visual: explainer
    visual-brief: >-
      Scroll from an existing market whose pieces are already there (riders, cars, drivers, the internet) to a rethought
      value offer; a new technology priced above mass buyers stays off the value line; then three "What if" questions
      (IKEA, Skype, Grameenphone) resolve into answered business models.
    related:
      - ideation-toolkit
      - disruptive-innovation
      - what-is-innovation
      - mgmt2094-w11-value-innovation
    depends-on:
      - what-is-innovation
    contrasts-with:
      - disruptive-innovation
      - what-is-innovation
    cases: []
    authorities:
      - mgmt2094-example-uber-and-airbnb
      - mgmt2094-example-ikea-flat-packs
      - mgmt2094-example-skype
      - mgmt2094-example-grameenphone
    verify: false
    body: >-
      **Value innovation (VI)** is one of the most prominent programmatic approaches to innovation currently in use. It

      is different from building layers of competitive advantage, and does not mean segmenting the market and
      accommodating

      customer needs. Its main focus is offering products and services that create **superior buyer value in existing

      markets** and enable a **quantum leap** for the firm to create new markets. It also differs from technology

      innovation: new technology is not a value innovation unless it is **cheap enough for mass buyers**.


      The lecture's examples were Uber and Airbnb: the market, the cars, the drivers and the internet were already
      there;

      the innovation was rethinking the value.


      **"What if" questions.** The status quo stifles imagination; asking "What if" of conventional assumptions provokes

      and challenges our thinking. What if newspapers went purely digital — what are the issues, benefits and costs?
      What-if

      questions are merely starting points: the challenge is to find the business model that could make the idea work,
      and

      some will be too provocative to answer.


      Answered what-ifs (Osterwalder and Pigneur, 2010):

      - **IKEA** — flat packs and DIY furniture assembly in the 1950s.

      - **Skype** — free internet voice calls from 2003; after five years, 400 million registered users and 100 billion
        free calls.
      - **Grameenphone** — a telephone for every Bangladeshi villager; now the country's largest taxpayer.


      **Exam use:** show the existing market, the rethought value, and the business model that answers the what-if.
  - slug: ideation-toolkit
    title: The Ideation Tool Kit (Mattimore, 2012)
    visual: palace
    visual-brief: >-
      Seven rooms in Mattimore's order, one per tool, each holding its slide example as the object to pick up: the razor
      assumptions, the insurance-for-Catholics statement, the Uber wish, the vanilla ice cream, 'upgrade information
      exchange', the industrial pictures and the worst-ideas list.
    related:
      - value-innovation-and-what-if
      - design-thinking
      - mgmt2094-w04-brainwriting-and-brainwalking
    depends-on:
      - mgmt2094-w04-brainwriting-and-brainwalking
    contrasts-with:
      - design-thinking
    cases: []
    authorities:
      - mgmt2094-example-uber-and-airbnb
      - mgmt2094-mattimore-2012-brainwalking
    verify: false
    body: >-
      According to Mattimore (2012) there are seven tools:

      1. **Questioning assumptions** — frame the challenge, list 20–30 assumptions (true or false), use several as
      thought
         starters. Selling more women's razors: what if we targeted teenage girls with an inexpensive razor?
      2. **Opportunity redefinition** — pick the three most interesting words of the opportunity statement, generate
      8–10
         alternatives for each (who, what, where, when, how), and combine them: "How do we sell more insurance to
         Catholics?" becomes "How do we get practising young Catholics incentivised to sell life insurance to Catholic
         grandparents?"
      3. **Wishing** — wish for the impossible (20–30 wishes), then use the most fantastic as stimuli for novel but
         realistic ideas; maybe Uber came from wishing for more convenient transport.
      4. **Triggered brainwalking** — ensures everyone contributes and combines with other techniques, like vanilla ice
         cream with toppings.
      5. **Semantic intuition** — combine categories of key words to name a new idea before knowing what it is: improve
      +
         teamwork → "upgrade information exchange" → upgrade information software.
      6. **Picture prompts** — visuals surface intuitions, emotions and feelings (good for personnel and management
         challenges); customise them, and add some random pictures.
      7. **Worst idea** — list really terrible ideas, then turn them into good ones by thinking of the opposite or
      finding
         something of value; it takes the creative pressure off.

      **Exam use:** name the tool from its mechanism — assumptions listed, three words recombined, keywords merged into
      a

      name.
  - slug: design-thinking
    title: Design thinking and the ideation process
    visual: diagram
    visual-brief: >-
      Three overlapping spaces — inspiration, ideation, implementation — drawn as loops a project can circle more than
      once, set against the straight line of a milestone process; each space holds one field example (Pecknold's
      reframed brief, T-shaped brainstorming, VisionSpring's prototype).
    related:
      - ideation-toolkit
      - innovation-process-and-management
    depends-on: []
    contrasts-with:
      - innovation-process-and-management
    cases: []
    authorities:
      - mgmt2094-brown-and-wyatt-2010-design-thinking-for-social-innovation
      - mgmt2094-example-naandi-water-centre
      - mgmt2094-example-pecknold-rwanda-weavers
      - mgmt2094-example-visionspring
      - mgmt2094-example-positive-deviance-vietnam
    verify: false
    body: >-
      **Design thinking** (Brown and Wyatt, 2010) incorporates consumer insights in depth and rapid prototyping, aimed
      at

      getting beyond the assumptions that block effective solutions. It is human centred and crosses public, for-profit
      and

      non-profit sectors. Its process is **a system of overlapping spaces rather than a sequence of orderly steps**:

      - **Inspiration** — the problem or opportunity that motivates the search: a brief, then observing what people
        actually do. Kara Pecknold reframed a website brief for Rwandan weavers who had little access to computers.
      - **Ideation** — synthesising insights, then divergent thinking by diverse, T-shaped teams; brainstorming defers
        judgement.
      - **Implementation** — prototyping, testing, iterating and refining. VisionSpring found children were at ease when
        they screened each other's eyes.

      Shanti shows the cost of skipping it: a nearby, affordable water centre needed a 5-gallon jerrican she could not
      carry

      and a monthly card for more water than she needed.


      The lecture's **ideation process** follows the same shape: a sufficiently diverse team (age, seniority,
      experience,

      customer knowledge); an immersion stage; as many ideas as possible (quantity, not quality); criteria for
      prioritising

      (eg revenue potential, impact on competitive advantage); and a shortlist of three to five business models.


      **Exam use:** contrast the overlapping spaces with a linear, milestone process, and ground each space in an
      example.
cases: []
authorities:
  - slug: mgmt2094-brown-and-wyatt-2010-design-thinking-for-social-innovation
    title: Brown and Wyatt (2010), Design Thinking for Social Innovation
    kind: article
    text: >-
      Social challenges require systemic solutions grounded in the client's or customer's needs, and initiatives falter
      when they are not based on those needs or never prototyped. Design thinking — human centred, using consumer
      insights in depth and rapid prototyping to get beyond the assumptions that block effective solutions — meets this
      need. Its process is a system of overlapping spaces (inspiration, ideation, implementation) rather than orderly
      steps, and one of the biggest impediments to adopting it is fear of failure.
    gloss: >-
      This week's reading on running an innovation project: the three spaces, T-shaped teams, deferring judgement and
      prototyping, with field examples from the social sector (Shanti, the Sternins, Pecknold, VisionSpring).
    cases: []
    verify: false
  - slug: mgmt2094-reed-2018-lego-plastic-free-brick
    title: Reed (2018), Inside Lego's quest to create a plastic-free brick
    kind: article
    text: >-
      Lego wants to eliminate its dependence on petroleum-based plastics and build its toys entirely from plant-based or
      recycled materials by 2030 (and keep its packaging out of landfill by 2025), while keeping the brick exactly the
      same: it must click together yet separate easily, keep its bright colours and survive hard use. It is investing
      about 1 billion kroner and hiring about 100 people, and has tried around 200 alternatives, but most bio-based and
      recycled test materials have so far fallen short; its sugar-cane polyethylene is too soft for bricks.
    gloss: >-
      This week's reading on an established manufacturer innovating for environmental goals: used here for the goals of
      innovation, the desirable–possible–viable test and the in-house search for new materials.
    cases: []
    verify: false
  - slug: mgmt2094-example-apple-and-nokia
    title: "Example: Apple's iPhone and Nokia (why innovate)"
    kind: other
    text: >-
      The Week 8 slide on why organisations must innovate continually gives Apple as its example. In the lecture,
      Apple's introduction of the iPhone captured much of the mobile-phone market very quickly, while Nokia, then the
      absolute leader, lost almost all of that market because it lost sight of how the environment was changing — not
      only phone technology but apps, platforms, social networking and the features people wanted.
    gloss: >-
      Illustrates why innovate: in a turbulent, rapidly changing economy, a firm that stops reading its environment
      loses its market. The iPhone and Nokia detail comes from the lecture recording only.
    cases: []
    verify: true
  - slug: mgmt2094-example-jetpack
    title: "Example: the jetpack (desirable, possible, viable)"
    kind: other
    text: >-
      The lecturer's illustration of the innovation Venn diagram: jetpacks have long been desirable — for rescue
      missions, firefighters and military operations — and have been talked about for years, but only now is the
      technology coming into fruition, on a very limited basis, and they are extremely expensive.
    gloss: >-
      Shows that desirability alone is not innovation: an idea also has to be possible with technology and viable in the
      marketplace.
    cases: []
    verify: false
  - slug: mgmt2094-example-uber-and-airbnb
    title: "Example: Uber and Airbnb (value innovation)"
    kind: other
    text: >-
      In the lecture, Uber and Airbnb were the examples of value innovation: for Uber, people already needed to get
      places, and the cars, drivers and internet technology were already there; Uber rethought the value, and while it
      was not necessarily the first to think of the idea, it was the most successful implementation. Slide 21 separately
      wonders whether the Uber concept came from wishing for more convenient transport. The Week 8 class activity leaves
      open whether Uber and Airbnb are truly disruptive.
    gloss: >-
      Illustrates value innovation (rethinking value from existing resources) and the wishing tool; a reminder that
      value innovation and disruptive innovation are different tests.
    cases: []
    verify: false
  - slug: mgmt2094-example-ikea-flat-packs
    title: "Example: IKEA flat packs and DIY assembly"
    kind: other
    text: >-
      IKEA introduced the ideas of flat packs and DIY furniture assembly in the 1950s — one of the slide's examples of
      "What if" questions that got answered (Osterwalder and Pigneur, 2010).
    gloss: Illustrates a "What if" question answered with a workable business model.
    cases: []
    verify: false
  - slug: mgmt2094-example-skype
    title: "Example: Skype free internet calls"
    kind: other
    text: >-
      In 2003 Skype launched a service that allowed free voice calling over the internet. After five years it had
      acquired 400 million registered users who made 100 billion free calls (slide, citing Osterwalder and Pigneur,
      2010).
    gloss: Illustrates a "What if" question (what if calls were free?) that got answered.
    cases: []
    verify: false
  - slug: mgmt2094-example-grameenphone
    title: "Example: Grameenphone"
    kind: other
    text: >-
      Grameenphone was a partnership with Grameen Bank, the micro-financier: what if every Bangladeshi villager had
      access to a telephone? At its inception Bangladesh had the lowest teledensity; Grameenphone is now the country's
      largest taxpayer (slide, citing Osterwalder and Pigneur, 2010).
    gloss: Illustrates a provocative "What if" question answered with a business model.
    cases: []
    verify: false
  - slug: mgmt2094-example-naandi-water-centre
    title: "Example: Shanti and the Naandi water treatment centre"
    kind: other
    text: >-
      Near Hyderabad, Shanti fetches free borehole water that periodically makes her family sick instead of buying safer
      water from the Naandi Foundation's community treatment centre. The centre is close, affordable and well known, and
      habit is not the reason: she cannot carry the 5-gallon jerrican it requires, her husband returns after it closes,
      and she would have to buy a monthly card for more water than she needs (Brown and Wyatt, 2010).
    gloss: >-
      Illustrates why design thinking starts from people's actual needs: a system that works technically can still fail
      its users.
    cases: []
    verify: false
  - slug: mgmt2094-example-pecknold-rwanda-weavers
    title: "Example: Kara Pecknold and the Rwandan weavers"
    kind: other
    text: >-
      Asked to develop a website to connect rural Rwandan weavers with the world, Kara Pecknold found the weavers had
      little or no access to computers or the internet, so she reframed the brief to ask what services could improve
      their livelihoods. Because she did not speak their language, she had the women photograph their lives and draw
      what success looked like (Brown and Wyatt, 2010).
    gloss: >-
      Illustrates the inspiration space: observing people and reframing the brief rather than delivering the brief as
      written.
    cases: []
    verify: false
  - slug: mgmt2094-example-visionspring
    title: "Example: VisionSpring's children's eye screening"
    kind: other
    text: >-
      VisionSpring, a low-cost eye care provider in India, prototyped eye screening with 15 children aged 8 to 12. A
      girl screened by traditional tests burst into tears, and so did the next child screened by the teacher; when the
      children screened each other they loved playing doctor and complied. By September 2009 it had run 10 children's
      eye camps and screened 3,000 children (Brown and Wyatt, 2010).
    gloss: "Illustrates the implementation space: prototyping uncovers problems that planning misses."
    cases: []
    verify: false
  - slug: mgmt2094-example-positive-deviance-vietnam
    title: "Example: the Sternins' positive deviance work in Vietnam"
    kind: other
    text: >-
      In 1990 Jerry and Monique Sternin worked to reduce child malnutrition in Vietnam, where government supplements had
      not delivered results. They looked for very poor families whose children were healthy and found rare behaviours:
      adding tiny shrimps, crabs and snails from the rice paddies and sweet-potato greens to food, and feeding several
      smaller meals a day. Cooking classes built on these practices; after a year, 80 per cent of the 1,000 children
      enrolled were adequately nourished (Brown and Wyatt, 2010).
    gloss: >-
      Illustrates design thinking relying on local expertise: solutions found among people already doing well, not
      imposed from outside.
    cases: []
    verify: false
  - slug: mgmt2094-class-activity-is-it-really-disruptive
    title: "Example: \"Is It Really Disruptive Innovation?\" (Week 8 class activity cases)"
    kind: other
    text: >-
      The class activity gives each group one case to test against Christensen's definition: Netflix vs traditional
      video rental; Airbnb vs traditional hotels (disruptive, or simply a new platform business model?); Uber vs taxis;
      Canva vs professional design software (did it create a new market of non-designers?); Spotify vs CDs and downloads
      (where did the disruption actually occur?); Tesla vs traditional car manufacturers; ChatGPT vs traditional search
      and knowledge work (could it become disruptive, and to whom?). The activity poses these as questions; it gives no
      verdicts.
    gloss: >-
      Real cases for practising the five disruption questions (incumbent, initial customer, value proposition, market
      movement, verdict).
    cases: []
    verify: false
questions:
  - key: q101
    type: mcq
    concept: what-is-innovation
    difficulty: 1
    set: pretest
    stem: Which formula does the Week 8 lecture use to define innovation?
    options:
      - text: Invention + commercialisation
        correct: true
        why: >-
          Right. The slide says innovation is a use of new knowledge to offer a new product or service that customers
          want — 'Invention + Commercialization'.
      - text: Creativity + a new idea or artwork
        why: >-
          Tempting because the unit pairs creativity with innovation, but the lecture says a creative idea or artwork
          that cannot be commercialised is creativity, not innovation.
      - text: Research + development
        why: >-
          Tempting because inventions are usually born in R&D, but research and development describes where invention
          happens, not the commercialisation that turns it into innovation.
      - text: Invention + patent protection
        why: >-
          Tempting because patents protect inventions, but the slide's formula turns on commercialisation — bringing the
          invention to market — not on legal protection.
  - key: q102
    type: mcq
    concept: what-is-innovation
    difficulty: 2
    stem: "Complete the slide definition: an innovation is an idea, practice or object that is perceived as new by…"
    options:
      - text: the inventor who first created it
        why: >-
          Tempting because the inventor knows it is new, but the definition asks whether the adopter — usually the
          customer — perceives it as new, not its creator.
      - text: an individual or other unit of adoption
        correct: true
        why: >-
          Right. The slide's definition locates newness in perception: an idea, practice or object perceived as new by
          an individual or other unit of adoption.
      - text: a patent office or other registering body
        why: >-
          Tempting because registration certifies novelty in law, but the lecture's definition is about perception by an
          adopter, with nothing about formal registration.
      - text: the industry's leading competitor
        why: >-
          Tempting because firms benchmark against rivals, but the definition names the adopting individual or unit,
          such as customers, donors or partner organisations.
  - key: q103
    type: mcq
    concept: what-is-innovation
    difficulty: 2
    stem: >-
      A non-profit introduces a new way of distributing food parcels. On the lecture's account, whose perception decides
      whether this counts as new?
    options:
      - text: Only paying customers, because innovation requires a sale
        why: >-
          Tempting because the lecture usually speaks of customers, but it relaxed that focus for NGOs: the perceiver
          can be any stakeholder who adopts the idea.
      - text: The non-profit's own board, which approved the change
        why: >-
          Tempting because the board decides to proceed, but approval by insiders is not perception by an adopter; the
          definition looks to the unit that takes the idea up.
      - text: Any stakeholder who adopts it — the people helped, donors or partner agencies
        correct: true
        why: >-
          Right. The lecture said that for an NGO the unit of adoption can be any stakeholder: the people it is trying
          to help, donors, or another organisation it works with.
      - text: A panel of design experts judging its originality
        why: >-
          Tempting because experts can judge originality, but the definition turns on the adopting individual or unit,
          not on expert assessment of novelty.
  - key: q104
    type: mcq
    concept: what-is-innovation
    difficulty: 2
    stem: Which feature belongs to invention rather than innovation in the lecture's table?
    options:
      - text: It results in commercialisation of the product
        why: >-
          Tempting because commercialisation is the week's defining idea, but it sits in the innovation column:
          invention 'may not be commercialized'.
      - text: It spreads across the whole organisation
        why: >-
          Tempting because inventions travel within firms, but the table puts invention as 'usually restricted to R&D
          centre' and innovation as 'spread across the organization'.
      - text: It brings organisational change as it spreads
        why: >-
          Tempting because inventions can trigger change, but the table says invention 'may bring few changes in
          organization'; it is innovation that brings organisational change.
      - text: Its motive may be economic or non-economic
        correct: true
        why: >-
          Right. The table says invention can be for an economic or non-economic motive — people invent for passion or
          as a hobby — whereas innovation has an economic motive.
  - key: q105
    type: mcq
    concept: what-is-innovation
    difficulty: 1
    stem: According to the lecture's table, how do invention and innovation relate in time?
    options:
      - text: Invention comes first; innovation succeeds it
        correct: true
        why: >-
          Right. Row 7 of the table: invention 'precedes innovation' and innovation 'succeeds invention' — the invention
          has to exist before it can be commercialised.
      - text: Innovation precedes invention; invention refines innovation
        why: >-
          Tempting if you think of refining a product after launch, but the table's order is fixed: the invention exists
          first, then it is introduced to the market.
      - text: They happen at the same moment in the R&D centre
        why: >-
          Tempting because both can start in R&D, but the table says innovation is the introduction into the
          marketplace, which comes after creation in R&D.
      - text: They are unrelated stages that need not occur in order
        why: >-
          Tempting because many inventions are never commercialised, but where innovation does occur, the table says it
          succeeds an invention that preceded it.
  - key: q106
    type: mcq
    concept: what-is-innovation
    difficulty: 3
    stem: >-
      A hobbyist builds a solar-powered bird feeder in her shed for her own garden. She has no plans to sell it. On the
      lecture's distinction, it is best described as:
    options:
      - text: "An innovation: it is new to her and to the birds that use it"
        why: >-
          Tempting because the definition says 'perceived as new', but without commercialisation it is invention, not
          innovation — the lecture's key distinction.
      - text: "An invention: a new product created with a non-economic motive"
        correct: true
        why: >-
          Right. Creating a new product for its own sake, with no plan to commercialise it, is invention: it can be
          autonomous and for a non-economic motive.
      - text: "A value innovation: it creates superior buyer value in a market"
        why: >-
          Tempting because it is new and useful, but value innovation offers superior buyer value to mass buyers; there
          are no buyers here at all.
      - text: "A process innovation: it changes how her garden is maintained"
        why: >-
          Tempting because it changes a routine, but she has made a new object for herself, with no adoption or
          commercialisation beyond her own garden.
  - key: q107
    type: mcq
    concept: what-is-innovation
    difficulty: 2
    stem: The lecture's Venn diagram places innovation where three circles overlap. Which set is correct?
    options:
      - text: Novel to the firm, patentable in law, profitable within a year
        why: >-
          Tempting because novelty and profit feature in innovation, but the diagram's tests are user desirability,
          technological possibility and market viability.
      - text: Creative to designers, cheap to produce, popular on social media
        why: >-
          Tempting because each sounds like success, but the diagram does not ask about designers or social media; it
          asks about users, technology and the market.
      - text: Desirable to users, possible with technology, viable in the marketplace
        correct: true
        why: >-
          Right. The circles ask what is desirable to users, what is possible with technology and what is viable in the
          marketplace; innovation is where all three overlap.
      - text: Desirable to investors, possible with funding, legal in the jurisdiction
        why: >-
          Tempting because it mirrors the three-part shape, but desirability is to users (customers or other
          stakeholders), not investors, and possibility is technological, not financial.
  - key: q108
    type: mcq
    concept: what-is-innovation
    difficulty: 3
    stem: >-
      A start-up has a working prototype of a home robot that users love in trials, but each unit costs so much to build
      that no price customers would pay covers it. Which circle of the Venn diagram is missing?
    options:
      - text: Desirable to users
        why: >-
          Tempting because desirability is the first circle, but the trials show users love it; the problem is the
          economics, not the appeal.
      - text: Possible with technology
        why: >-
          Tempting because robots are technically hard, but the prototype works; what is missing is a way to sell it
          profitably in the marketplace.
      - text: None — it is already an innovation
        why: >-
          Tempting because it is new and wanted, but the lecture says innovation needs commercialisation: without market
          viability it stays outside the overlap.
      - text: Viable in the marketplace
        correct: true
        why: >-
          Right. Users want it and it works, so it is desirable and possible; it fails viability because it cannot be
          sold at a price that sustains it in the market.
  - key: q109
    type: mcq
    concept: what-is-innovation
    difficulty: 2
    stem: Why did the lecture use the jetpack to illustrate the Venn diagram?
    options:
      - text: It has long been desirable, but the technology is only now arriving and it is extremely expensive
        correct: true
        why: >-
          Right. The lecturer described a long-standing desire for jetpacks (rescue, firefighting, military), technology
          only now coming into fruition on a limited basis, and an extreme price.
      - text: It was technically easy to build, but no user has ever wanted one for practical purposes
        why: >-
          Tempting as a reversal, but the lecture stressed the opposite: there is a clear desire for jetpacks,
          especially for rescue missions and firefighters.
      - text: It was cheap and popular, but regulators banned it before it reached the market
        why: >-
          Tempting because regulation is one goal of innovation, but the lecture mentioned no ban; it said jetpacks are
          extremely expensive and only now technically arriving.
      - text: It is the classic case of a disruptive innovation that began with low-end customers
        why: >-
          Tempting because jetpacks sound revolutionary, but the lecture used them for the three circles, not for
          Christensen's low-end or new-market path.
  - key: q110
    type: mcq
    concept: what-is-innovation
    difficulty: 3
    stem: >-
      Reed (2018) reports that Lego wants to switch the ingredients of its brick but keep the product exactly the same.
      Which circle of the Venn diagram has given it the most trouble so far?
    options:
      - text: "Desirable to users: children no longer want plastic toy bricks"
        why: >-
          Tempting because the article mentions competition from mobile devices, but it does not say children reject the
          bricks; their look and feel are what Lego wants to keep.
      - text: "Viable in the marketplace: Lego has stopped selling its existing bricks"
        why: >-
          Tempting because the chief executive could not say what the plan would cost, but Lego is still selling bricks;
          the obstacle reported is the material.
      - text: "Possible with technology: most test materials have fallen short"
        correct: true
        why: >-
          Right. Around 200 alternatives have been tried; bricks have broken with sharp edges, popped out with muddied
          colours or come out misshapen. The material cannot yet do the job.
      - text: "None: Lego already makes all its bricks from sugar-cane polyethylene"
        why: >-
          Tempting because Lego does use sugar-cane polyethylene, but only in flexible pieces such as dragon wings and
          palm trees — 1 to 2 per cent of output, too soft for bricks.
  - key: q111
    type: mcq
    concept: what-is-innovation
    difficulty: 2
    stem: Which statement best captures the lecture's distinction between creativity and innovation?
    options:
      - text: Creativity happens in teams, whereas innovation is always the lone work of one inventor
        why: >-
          Tempting because invention is often pictured as solitary, but the lecture made no such contrast; it
          distinguished the two by commercialisation.
      - text: Creativity is about products; innovation is about organisational structure only
        why: >-
          Tempting because Shaver's definition mentions organisation structures, but innovation covers products,
          processes and structures alike; the line is commercialisation.
      - text: They are the same thing described from the customer's point of view
        why: >-
          Tempting because both involve newness, but the lecture insisted they differ, and that this difference —
          commercialisation — is important.
      - text: Creativity produces new ideas; innovation is when such an idea can be commercialised
        correct: true
        why: >-
          Right. The lecture: you can be extremely creative — a product, an artwork, a book — but if you cannot
          commercialise it, it is creativity, not innovation.
  - key: q112
    type: mcq
    concept: what-is-innovation
    difficulty: 3
    stem: >-
      A firm's engineers create a better battery chemistry, but it never leaves the R&D lab and nothing else in the firm
      changes. Which pair of table rows best explains why this is invention, not innovation?
    options:
      - text: "'Usually restricted to R&D centre' and 'May bring few changes in organisation'"
        correct: true
        why: >-
          Right. Staying in the lab matches invention's 'usually restricted to R&D centre', and nothing else changing
          matches 'may bring few changes in organisation'.
      - text: "'Usually induced' and 'Economic motive', since the firm funded the research work"
        why: >-
          Tempting because a firm's research is induced and economic, but those rows describe innovation; they do not
          explain why this stays an invention.
      - text: "'Spread across the organisation' and 'Brings organisational change'"
        why: >-
          Tempting because they are the matching rows, but they describe innovation, which is exactly what has not
          happened here.
      - text: "'Results into commercialisation' and 'Succeeds invention'"
        why: >-
          Tempting because commercialisation is the key test, but these are innovation's rows; the battery has not been
          introduced to the market at all.
  - key: q113
    type: mcq
    concept: what-is-innovation
    difficulty: 3
    variant-of: q106
    stem: >-
      A university lab synthesises a new biodegradable polymer and publishes the result. A packaging firm later licenses
      it, launches a range of compostable mailers and retrains its sales and logistics teams. At which point does
      innovation occur?
    options:
      - text: When the lab first synthesises the polymer
        why: >-
          Tempting because this is the creative breakthrough, but creating a new material is invention; the table says
          innovation is its introduction into the marketplace.
      - text: When the firm launches the mailers into the marketplace
        correct: true
        why: >-
          Right. Introducing the product into the marketplace commercialises the invention, and the retraining shows
          innovation spreading across the organisation.
      - text: When the result is published in a journal
        why: >-
          Tempting because publication spreads the knowledge, but it is not commercialisation; the polymer is still an
          invention until it reaches the market.
      - text: Innovation never occurs, because the firm did not invent it
        why: >-
          Tempting because the firm bought rather than invented the polymer, but the innovation process includes
          acquiring technology from outside; commercialising it is still innovation.
  - key: q114
    type: mcq
    concept: what-is-innovation
    difficulty: 2
    stem: >-
      Shaver (2014), quoted on the slide, defines innovation as the search for, discovery, development, improvement,
      adoption and commercialisation of new…
    options:
      - text: patents, trademarks, designs and other intellectual property rights
        why: >-
          Tempting because inventions are often patented, but Shaver's definition is about processes, products and
          organisation structures, not legal protection.
      - text: artworks, books and other creative expressions
        why: >-
          Tempting because the unit pairs creativity and innovation, but the lecture used artworks and books as examples
          of creativity that need not be commercialised.
      - text: processes, products and organisation structures and procedures
        correct: true
        why: >-
          Right. Shaver's definition covers new processes, new products and new organisation structures and procedures —
          innovation is not only about products.
      - text: markets only, since products belong to invention
        why: >-
          Tempting because commercialisation needs a market, but the definition explicitly lists products and processes;
          nothing confines products to invention.
  - key: q115
    type: mcq
    concept: what-is-innovation
    difficulty: 1
    stem: Which of these is NOT one of the three circles in the lecture's innovation Venn diagram?
    options:
      - text: What is desirable to users
        why: >-
          This is one of the three circles — the top one asks what is desirable to users — so it cannot be the odd one
          out.
      - text: What is possible with technology
        why: >-
          This is one of the three circles: the slide asks what is possible with technology, which the lecture
          illustrated with the jetpack.
      - text: What is viable in the marketplace
        why: >-
          This is one of the three circles: viability in the marketplace is where the lecture's point about
          commercialisation lives.
      - text: What is patentable
        correct: true
        why: >-
          Right. Patents do not appear in the diagram; its three circles are user desirability, technological
          possibility and marketplace viability.
  - key: q116
    type: truefalse
    concept: what-is-innovation
    difficulty: 1
    set: quickfire
    statement: On the Week 8 slides, innovation is defined as invention plus commercialisation.
    answer: true
    why: >-
      True. The slide says innovation is a use of new knowledge to offer a new product or service that customers want —
      'Invention + Commercialization'.
  - key: q117
    type: truefalse
    concept: what-is-innovation
    difficulty: 2
    set: quickfire
    statement: According to the lecture's table, invention is usually induced, whereas innovation can be autonomous or induced.
    answer: false
    why: "False. It is the other way round: invention 'can be autonomous or induced', while innovation is 'usually induced'."
  - key: q118
    type: truefalse
    concept: what-is-innovation
    difficulty: 2
    set: quickfire
    statement: >-
      In the lecture's Venn diagram, an idea that is desirable and technically possible is already an innovation even if
      it is not viable in the marketplace.
    answer: false
    why: >-
      False. Innovation sits only where all three circles overlap; without marketplace viability the idea cannot be
      commercialised, so it falls short.
  - key: q119
    type: match
    concept: what-is-innovation
    difficulty: 2
    prompt: Match each feature of invention to the matching feature of innovation in the lecture's table.
    pairs:
      - left: Creation of a new product, service or process
        right: Introduction of it into the marketplace
      - left: May not be commercialised
        right: Results in commercialisation
      - left: Can be autonomous or induced
        right: Usually induced
      - left: Usually restricted to the R&D centre
        right: Spreads across the organisation
      - left: May bring few changes in organisation
        right: Brings organisational change
  - key: q120
    type: short
    concept: what-is-innovation
    difficulty: 3
    prompt: >-
      "If nobody buys it, it isn't innovation." Discuss this statement as a short essay, using the Week 8 definition of
      innovation, the invention–innovation distinction and the desirable–possible–viable diagram, with at least one
      example from the Week 8 materials.
    model: >-
      The statement is largely right on the Week 8 slides, but it compresses two tests into one. Innovation is an idea,
      practice or object perceived as new by an individual or other unit of adoption, used to offer a new product or
      service customers want: invention + commercialisation. The invention–innovation table supports the statement:
      invention may not be commercialised and can have a non-economic motive, whereas innovation results in
      commercialisation, has an economic motive and spreads across the organisation. A hobbyist's gadget that never
      leaves the shed is an invention.


      The Venn diagram shows why selling is hard: innovation sits where the desirable, the technologically possible and
      the commercially viable overlap. Lego's plastic-free brick (Reed, 2018) is wanted and backed by about 1 billion
      kroner, yet most of some 200 test materials have fallen short, so it is not yet an innovation.


      The statement overreaches in one respect: the lecture said the unit of adoption can be any stakeholder, such as an
      NGO's beneficiaries or donors, so "buys" must be read as adoption that sustains the offer, not only a retail sale.
      On balance: commercialised adoption, yes; a shop-counter sale, not necessarily.
    rubric:
      - id: r1
        criterion: Concept — accurate definition of innovation
        marks: 2
        top-band: >-
          States the definition with both halves (perceived as new by a unit of adoption; invention + commercialisation)
          and the key rows of the invention–innovation table.
        margin-note: "Both halves: perceived newness and commercialisation."
        authorities: []
      - id: r2
        criterion: Example — a real example from the materials
        marks: 2
        top-band: >-
          Uses a Week 8 example accurately and says which circle it passes or fails (eg Lego's brick held up by
          materials; the jetpack held up by technology and price).
        margin-note: Name the example and the circle it fails.
        authorities:
          - mgmt2094-reed-2018-lego-plastic-free-brick
      - id: r3
        criterion: Application — frameworks applied to the statement
        marks: 3
        top-band: >-
          Applies the table (commercialisation, economic motive) and the three circles to the claim that a sale is
          required, with a clear case on each side.
        margin-note: "Good: you tested the claim, not just defined terms."
        authorities: []
      - id: r4
        criterion: Evaluation — limits and a reasoned verdict
        marks: 2
        top-band: >-
          Notes that the unit of adoption can be any stakeholder (the lecture's NGO point), so 'buys' must be read
          broadly, and reaches a qualified conclusion.
        margin-note: Where does the statement overreach?
        authorities: []
  - key: q201
    type: mcq
    concept: why-innovate-goals-and-sources
    difficulty: 1
    stem: According to the Week 8 slides, why must organisations innovate on a continuing basis?
    options:
      - text: Because regulators require every firm to launch a new product each year
        why: >-
          Tempting because conformance to regulations is a goal of innovation, but no regulator demands yearly launches;
          the slide's reason is a turbulent environment.
      - text: Otherwise, in a turbulent economy, their survival is threatened
        correct: true
        why: >-
          Right. The slide: in a turbulent and rapidly changing economy organisations must prepare to innovate
          continually, otherwise their survival chances are seriously threatened (eg Apple).
      - text: Because innovation always lowers costs in the short run
        why: >-
          Tempting because reducing labour, material and energy costs are goals, but the lecture stressed that
          innovation is difficult and costly; the reason given is survival.
      - text: Because shareholders are legally entitled to new products
        why: >-
          Tempting because owners want growth, but the slide grounds the need to innovate in a changing economy and
          survival, not in any shareholder entitlement.
  - key: q202
    type: mcq
    concept: why-innovate-goals-and-sources
    difficulty: 1
    stem: Which of the following is NOT listed on the slide as a goal of innovation?
    options:
      - text: Reducing environmental damage
        why: >-
          This is on the list: reducing environmental damage is a goal, and the lecture showed it can go hand in hand
          with reducing materials and improving production.
      - text: Conformance to regulations
        why: >-
          This is on the list: conformance to regulations is a goal, and the lecture added that firms sometimes conform
          voluntarily to improve their image and legitimacy.
      - text: Adding layers of management
        correct: true
        why: >-
          Right. Adding management layers is not among the ten goals; if anything, the sources slide says lower vertical
          differentiation (flatter structures) favours innovation.
      - text: Extension of the product range
        why: >-
          This is on the list: 'extension of the product range' is the slide's third goal of innovation, after improving
          quality and creating new markets.
  - key: q203
    type: mcq
    concept: why-innovate-goals-and-sources
    difficulty: 2
    stem: >-
      A brewery redesigns its bottling line so it uses less glass, less water and less electricity. Which goals of
      innovation does this pursue?
    options:
      - text: Creation of new markets and extension of the product range
        why: >-
          Tempting because redesigns can open new opportunities, but the same beer reaches the same customers; nothing
          here creates a market or extends the range.
      - text: Conformance to regulations and replacement of products
        why: >-
          Tempting because environmental rules exist, but nothing says a regulation required this, and the product
          itself is not replaced.
      - text: Improving quality and reducing labour costs
        why: >-
          Tempting because line redesigns often aim at these, but the facts are about inputs — glass, water and
          electricity — not product quality or staff costs.
      - text: Reducing materials, reducing environmental damage and reducing energy consumption
        correct: true
        why: >-
          Right. Less glass is reducing materials, less water and glass reduce environmental damage, and less
          electricity is reducing energy consumption — goals that work together.
  - key: q204
    type: mcq
    concept: why-innovate-goals-and-sources
    difficulty: 2
    stem: >-
      Which source of innovation is said to work through lower vertical differentiation, formalisation and
      centralisation?
    options:
      - text: Organisational structure
        correct: true
        why: >-
          Right. Organic structures, with lower vertical differentiation, formalisation and centralisation, facilitate
          flexibility, adaptation and cross-fertilisation.
      - text: Long tenure in management
        why: >-
          Tempting because tenure concerns the people at the top, but it works through legitimacy and know-how, not
          through the shape of the hierarchy.
      - text: Slack resources
        why: >-
          Tempting because resources shape what a firm can try, but slack works by letting it afford innovations and
          absorb failures, not by flattening the hierarchy.
      - text: Intra-communications
        why: >-
          Close, because committees and cross-functional teams cut across departments, but the low differentiation,
          formalisation and centralisation point belongs to structure.
  - key: q205
    type: mcq
    concept: why-innovate-goals-and-sources
    difficulty: 2
    stem: How do slack resources support innovation, according to the slide?
    options:
      - text: They keep managers in post long enough to gain legitimacy
        why: >-
          Tempting because tenure is another source, but legitimacy and knowledge come from long managerial tenure, not
          from having spare resources.
      - text: They let it afford innovations and absorb failures
        correct: true
        why: >-
          Right. Slack — an abundance of resources — lets an organisation afford to purchase innovations, bear the cost
          of instituting them and absorb failures.
      - text: They guarantee that every innovation will succeed
        why: >-
          Tempting because money removes some risk, but the slide's point is the reverse: slack lets a firm survive the
          failures that experimentation brings.
      - text: They replace the need for cross-functional teams
        why: >-
          Tempting because money can buy talent, but intra-communications is a separate source; slack does not
          substitute for interaction across departments.
  - key: q206
    type: mcq
    concept: why-innovate-goals-and-sources
    difficulty: 3
    stem: The lecture called managerial tenure double-edged. Why?
    options:
      - text: Long tenure lowers costs, but it raises environmental damage
        why: >-
          Tempting because these are goals of innovation, but the lecture's two edges were legitimacy and know-how
          against complacency, not cost and environment.
      - text: Long tenure improves communication, but it removes slack resources
        why: >-
          Tempting because both are sources, but the lecture did not link tenure to communication or slack; it set
          expertise against complacency.
      - text: It gives legitimacy and know-how, but can breed complacency
        correct: true
        why: >-
          Right. Tenure provides legitimacy and knowledge of how to get things done, but a CEO who has been there
          forever may be content with things as they are.
      - text: Long tenure makes a structure organic, but it prevents product innovation
        why: >-
          Tempting because structure is a source, but tenure is about who leads and for how long; the lecture's downside
          was complacency, not a product ban.
  - key: q207
    type: mcq
    concept: why-innovate-goals-and-sources
    difficulty: 3
    stem: >-
      A cash-rich market leader sees no threat, cuts its experimental projects and keeps selling its current range.
      Which double edge from the lecture does this illustrate?
    options:
      - text: "Organic structure: flexibility leads to too many new products"
        why: >-
          Tempting because structure is a source, but nothing here is about flexibility; the firm is cutting experiments
          because wealth makes it complacent.
      - text: "Intra-communications: too many committees slow every decision"
        why: >-
          Tempting because slow committees can stall change, but the facts point to the firm's cash and sense of safety,
          not to how departments communicate.
      - text: "Conformance to regulations: the firm is waiting for new rules"
        why: >-
          Tempting because regulation is a goal of innovation, but nothing suggests the firm is waiting on rules; it is
          resting on its resources.
      - text: Slack resources can make a firm feel unbeatable
        correct: true
        why: >-
          Right. Abundant resources should fund experiments, but a firm that feels unthreatened may stop investing in
          innovation — the lecture's failed market leaders felt unbeatable.
  - key: q208
    type: mcq
    concept: why-innovate-goals-and-sources
    difficulty: 2
    stem: Which source of innovation relies on committees, task forces and cross-functional teams?
    options:
      - text: Intra-communications
        correct: true
        why: >-
          Right. Innovative organisations are high users of committees, task forces and cross-functional teams that
          facilitate interaction across departmental lines.
      - text: Slack resources
        why: >-
          Tempting because teams cost money, but slack is about affording innovations and absorbing failures, not about
          interaction across departments.
      - text: Long tenure in management
        why: >-
          Tempting because experienced managers chair committees, but tenure is about legitimacy and know-how; the
          cross-department point belongs to intra-communications.
      - text: Organisational structure
        why: >-
          Close, because organic structures aid cross-fertilisation, but the specific tools named — committees, task
          forces, cross-functional teams — belong to intra-communications.
  - key: q209
    type: mcq
    concept: why-innovate-goals-and-sources
    difficulty: 3
    stem: >-
      Reed (2018) reports that Lego wants its toys made from plant-based or recycled materials by 2030 and its packaging
      out of landfill by 2025, by eliminating things like plastic bags inside its boxes. Which goals of innovation are
      most directly at work?
    options:
      - text: Creation of new markets and extension of the product range
        why: >-
          Tempting because big projects often aim at growth, but Reed stresses that Lego wants to keep the product
          exactly the same for the same customers.
      - text: Reducing environmental damage and reducing materials
        correct: true
        why: >-
          Right. Lego aims to cut the pollution it causes (environmental damage) and to eliminate items like plastic
          bags inside its cardboard packaging (reducing materials).
      - text: Reducing labour costs and conformance to regulations
        why: >-
          Tempting because Lego was cutting jobs at the time, but the article ties the plastic-free plan to pollution,
          not to labour costs or a regulation.
      - text: Improving quality and replacement of products
        why: >-
          Tempting because the brick's material changes, but Lego wants the product unchanged — the same look, feel and
          precision — not replaced or improved.
  - key: q210
    type: mcq
    concept: why-innovate-goals-and-sources
    difficulty: 2
    stem: The lecture discussed 'conformance to regulations' as a goal of innovation. Which point did it add?
    options:
      - text: Conforming to regulations is never innovative, because it is compulsory
        why: >-
          Tempting because compliance sounds routine, but the lecture said innovation can find ways to conform at the
          least cost and reap the most rewards.
      - text: Only government agencies can innovate to conform to regulations
        why: >-
          Tempting because governments make regulations, but the goal is about any organisation conforming; the lecture
          spoke of firms advertising their conformance.
      - text: Regulations rarely change, so this goal matters little
        why: >-
          Tempting if you think of rules as fixed, but the lecture said regulations change all the time and
          organisations need to comply or conform.
      - text: Voluntary conformance can raise a firm's image and legitimacy
        correct: true
        why: >-
          Right. Firms sometimes conform to regulations they do not have to uphold, then advertise it to improve their
          status and be viewed as a more legitimate actor.
  - key: q211
    type: mcq
    concept: why-innovate-goals-and-sources
    difficulty: 2
    stem: Which item is a SOURCE of innovation rather than a GOAL of innovation?
    options:
      - text: Slack resources
        correct: true
        why: >-
          Right. Slack resources are one of the four sources (with structure, tenure and intra-communications); they
          make innovation possible rather than being what it aims at.
      - text: Reducing energy consumption
        why: >-
          This is a goal, not a source: reducing energy consumption is an outcome innovation aims at, listed with
          reducing materials and environmental damage.
      - text: Creation of new markets
        why: >-
          This is a goal, not a source: the slide lists creation of new markets as the second goal of innovation, after
          improving quality.
      - text: Improving production process
        why: >-
          This is a goal, not a source: improving the production process is something innovation aims to achieve, not a
          condition that produces innovation.
  - key: q212
    type: mcq
    concept: why-innovate-goals-and-sources
    difficulty: 4
    stem: >-
      A 40-year-old engineering firm has a tall hierarchy, a CEO in post for 25 years, modest cash reserves, and
      departments that rarely talk. Which change would the sources slide most directly support to raise its innovation?
    options:
      - text: Replacing the CEO immediately, since long tenure always blocks innovation
        why: >-
          Tempting because tenure can breed complacency, but the slide says tenure also provides legitimacy and
          know-how; 'always blocks' overstates a double-edged source.
      - text: Moving to a more organic, flatter structure and creating cross-functional teams
        correct: true
        why: >-
          Right. The slide says organic structures (lower vertical differentiation, formalisation, centralisation) and
          committees, task forces and cross-functional teams favour innovation.
      - text: Hoarding cash, since slack resources guarantee innovation on their own
        why: >-
          Tempting because slack resources help, but they help by funding innovation and absorbing failure; hoarding
          them, or feeling unbeatable, does the opposite.
      - text: Adding approval layers so each new idea is checked more carefully
        why: >-
          Tempting as risk control, but more layers increase vertical differentiation and formalisation, which the slide
          says work against innovation.
  - key: q213
    type: mcq
    concept: why-innovate-goals-and-sources
    difficulty: 2
    variant-of: q201
    stem: The Week 8 slides give Apple as the example for which point?
    options:
      - text: "The ideation tool kit: Apple invented semantic intuition"
        why: >-
          Tempting only if you link Apple with creativity, but semantic intuition is one of Mattimore's ideation tools;
          the slide does not attribute it to Apple.
      - text: "Invention: Apple's products never left its R&D centre"
        why: >-
          Tempting because Apple is an R&D-heavy firm, but the lecture's point was that Apple brought innovations to
          market and carved out a place for itself.
      - text: "Why innovate: firms must innovate continually to survive"
        correct: true
        why: >-
          Right. The 'Why innovate?' slide says organisations must prepare to innovate continually or their survival is
          threatened, 'eg. Apple'.
      - text: "Slack resources: Apple stopped innovating once it was rich"
        why: >-
          Tempting because the lecture discussed rich firms that stopped innovating, but Apple was the example of the
          firm that did innovate, not the complacent one.
  - key: q214
    type: mcq
    concept: why-innovate-goals-and-sources
    difficulty: 3
    stem: In the lecture, why did the former leader of the mobile-phone market lose out when Apple introduced the iPhone?
    options:
      - text: Its phones were technically impossible to manufacture at scale
        why: >-
          Tempting because technology is one circle of the Venn diagram, but the lecture blamed a failure to read the
          environment, not an inability to manufacture.
      - text: Regulators banned its handsets in most markets
        why: >-
          Tempting because regulation is a goal of innovation, but the lecture mentioned no ban; it said the leader lost
          sight of how the environment was changing.
      - text: It invested too heavily in cross-functional teams
        why: >-
          Tempting as a contrarian answer, but the lecture treats cross-functional teams as a source of innovation; it
          blamed the leader's failure to notice change.
      - text: It lost sight of the changing environment — apps and platforms, not just handsets
        correct: true
        why: >-
          Right. The lecture said the leader missed that the shift was not only about phone technology but about apps,
          platforms and the networking features people wanted.
  - key: q215
    type: mcq
    concept: why-innovate-goals-and-sources
    difficulty: 2
    stem: Which goal of innovation matches 'opening up a market that did not exist before'?
    options:
      - text: Creation of new markets
        correct: true
        why: >-
          Right. 'Creation of new markets' is the slide's second goal, and the lecture said it would be great to achieve
          if you can.
      - text: Extension of the product range
        why: >-
          Tempting because new products can reach new people, but extending the range adds offers for an existing market
          rather than creating one.
      - text: Replacement of products/services
        why: >-
          Tempting because new offers can displace old ones, but replacing products swaps what is sold; it does not by
          itself create a new market.
      - text: Improving quality
        why: >-
          Tempting because better products attract buyers, but improving quality makes an existing offer better; it is
          not the goal of creating a market.
  - key: q216
    type: truefalse
    concept: why-innovate-goals-and-sources
    difficulty: 1
    set: quickfire
    statement: The sources slide says organic organisational structures positively influence innovation.
    answer: true
    why: >-
      True. Organic structures, with lower vertical differentiation, formalisation and centralisation, facilitate
      flexibility, adaptation and cross-fertilisation.
  - key: q217
    type: truefalse
    concept: why-innovate-goals-and-sources
    difficulty: 2
    set: quickfire
    statement: The lecture treated slack resources as an unmixed good for innovation.
    answer: false
    why: >-
      False. Slack lets a firm afford innovation and absorb failures, but the lecture warned that abundance can make a
      firm feel unthreatened so that it stops innovating.
  - key: q218
    type: truefalse
    concept: why-innovate-goals-and-sources
    difficulty: 1
    set: quickfire
    statement: Reducing labour costs is one of the goals of innovation on the Week 8 slide.
    answer: true
    why: >-
      True. The ten goals include reducing labour costs, alongside improving quality, new markets, reducing materials
      and energy, and conformance to regulations.
  - key: q219
    type: short
    concept: why-innovate-goals-and-sources
    difficulty: 3
    prompt: >-
      "An organisation with long-serving leaders and plenty of money will always innovate." Discuss this statement as a
      short essay, using the Week 8 reasons to innovate and the four sources of innovation, with at least one example
      from the Week 8 materials.
    model: >-
      The statement mistakes two sources of innovation for a guarantee. The slides argue that in a turbulent, rapidly
      changing economy an organisation must prepare to innovate on a continuing basis, otherwise its survival chances
      are seriously threatened; Apple is the slide's example, and the lecture contrasted it with a market leader that
      lost sight of a changing environment.


      Long tenure in management and slack resources are indeed sources of innovation. Tenure provides legitimacy and
      knowledge of how to accomplish a task and obtain desired outcomes; slack lets an organisation afford to purchase
      innovations, bear the cost of instituting them and absorb failures. Lego (Reed, 2018) shows slack at work: a
      profitable firm investing about 1 billion kroner and some 100 new hires in a search for plastic-free materials.


      But the lecture called both double-edged. A leader who has been there forever may be complacent, and abundant
      resources can make a firm feel unthreatened, as with the leaders that felt unbeatable and failed. The other two
      sources matter as much: an organic structure with lower vertical differentiation, formalisation and
      centralisation, and intra-communications through cross-functional teams. Tenure and money make innovation
      possible; they never make it certain.
    rubric:
      - id: r1
        criterion: Concept — accurate account of why firms innovate and the four sources
        marks: 2
        top-band: >-
          States the survival argument and all four sources with the slide wording (organic structure, tenure, slack,
          intra-communications).
        margin-note: All four sources, in the slide's terms.
        authorities: []
      - id: r2
        criterion: Example — a real example from the materials
        marks: 2
        top-band: >-
          Uses a Week 8 example accurately (eg Apple on the 'Why innovate?' slide; Lego's investment in new materials
          per Reed, 2018).
        margin-note: Which source does your example show?
        authorities:
          - mgmt2094-reed-2018-lego-plastic-free-brick
      - id: r3
        criterion: Application — sources applied to the statement
        marks: 3
        top-band: >-
          Explains what tenure and slack contribute (legitimacy and know-how; affording innovation and absorbing
          failure) and what the statement leaves out (structure, communication).
        margin-note: "Good: you tested the claim against all four sources."
        authorities: []
      - id: r4
        criterion: Evaluation — double edges and a verdict
        marks: 2
        top-band: Uses the double edges (complacency; feeling unbeatable) to reject "always" and reaches a qualified conclusion.
        margin-note: Why is 'always' wrong?
        authorities: []
  - key: q220
    type: match
    concept: why-innovate-goals-and-sources
    difficulty: 2
    prompt: Match each source of innovation to how it works.
    pairs:
      - left: Organisational structure
        right: Organic structures facilitate flexibility, adaptation and cross-fertilisation
      - left: Long tenure in management
        right: Provides legitimacy and knowledge of how to obtain desired outcomes
      - left: Slack resources
        right: Lets the organisation afford innovations and absorb failures
      - left: Intra-communications
        right: Committees, task forces and cross-functional teams across departments
  - key: q301
    type: mcq
    concept: innovation-map
    difficulty: 2
    set: pretest
    stem: On the innovation map, which quadrant is internal and discontinuous?
    options:
      - text: Operational innovation
        why: >-
          Tempting because it is also internal, but operational innovation (processes, technology) is continuous — the
          left-hand side of the map.
      - text: Product & service innovation
        why: >-
          Tempting because the quadrants are easy to mix up, but product & service innovation is external and
          continuous: what customers see, such as the brand.
      - text: Management innovation
        correct: true
        why: >-
          Right. Management innovation (internal structures and processes, people management, networking) is internal
          and discontinuous: changed once in a while, then left to settle.
      - text: Strategic innovation
        why: >-
          Tempting because it is also discontinuous, but strategic innovation is external: new markets, channels,
          disruptive innovation, Blue Ocean Strategy.
  - key: q302
    type: mcq
    concept: innovation-map
    difficulty: 2
    stem: Where does the innovation map place disruptive innovation?
    options:
      - text: "With operational innovation: internal and continuous"
        why: >-
          Tempting if you think disruption starts inside a firm, but the map places it in the external, discontinuous
          quadrant with strategic innovation.
      - text: "With management innovation: internal and discontinuous"
        why: >-
          Tempting because it is discontinuous, but management innovation is internal (structures, people management);
          disruption changes the market outside the firm.
      - text: "With product & service innovation: external and continuous"
        why: >-
          Tempting because disruptive offerings are products, but continuous product improvement is the opposite of the
          discontinuous break that disruption represents on the map.
      - text: "With strategic innovation: external and discontinuous"
        correct: true
        why: >-
          Right. On the slide, disruptive innovation, new markets, new offerings, channels and Blue Ocean Strategy
          cluster around strategic innovation, bottom right.
  - key: q303
    type: mcq
    concept: innovation-map
    difficulty: 3
    stem: >-
      A bank introduces a new internal software tool that its staff use to process loans a little faster each quarter.
      Customers notice nothing. Where does this sit on the innovation map?
    options:
      - text: Operational innovation (internal, continuous)
        correct: true
        why: >-
          Right. Steady, behind-the-scenes improvement to processes and technology is operational innovation; the
          lecture said nobody really sees much of it.
      - text: Strategic innovation (external, discontinuous)
        why: >-
          Tempting because software can be transformative, but nothing here changes markets or channels, and the change
          is gradual and unseen by customers.
      - text: Management innovation (internal, discontinuous)
        why: >-
          Tempting because it is internal, but management innovation concerns structures and people management, changed
          discontinuously, not quarterly process tweaks.
      - text: Product & service innovation (external, continuous)
        why: >-
          Tempting because loans are the bank's product, but customers see nothing new; the improvement is internal to
          how loans are processed.
  - key: q304
    type: mcq
    concept: innovation-map
    difficulty: 2
    stem: Why did the lecture say management innovation should be discontinuous?
    options:
      - text: Management cannot be innovated at all; only products and services can be
        why: >-
          Tempting if innovation means products, but management innovation is one of the map's four quadrants and
          appears on the slide's list of types.
      - text: People tire of constant change, so change occasionally and let it settle
        correct: true
        why: >-
          Right. People get tired of constant change; management change should come once in a while when appropriate,
          then sit so people adjust and the rewards are reaped.
      - text: Management changes are unseen by customers, so they can safely change daily
        why: >-
          Tempting because it is internal like operational innovation, but the lecture said management changes should
          not be continuous, because people tire of them.
      - text: Regulators forbid organisations from changing management structures often
        why: >-
          Tempting as an outside constraint, but the lecture's reason was human: people get tired of constant change and
          need time to adjust.
  - key: q305
    type: mcq
    concept: innovation-map
    difficulty: 1
    stem: Which is one of the four characteristics of innovation on the Week 8 slide?
    options:
      - text: It must always be patented before it is launched to customers
        why: >-
          Tempting because inventions are often patented, but patents are not among the characteristics: object,
          magnitude, problem solving and impact.
      - text: It must be developed by a single inventor
        why: >-
          Tempting from the lone-genius picture, but the slides stress teams, committees and cross-functional groups; a
          single inventor is not a characteristic.
      - text: There is an object or target which is being changed
        correct: true
        why: >-
          Right. The first characteristic is an object or target being changed — a product, a process, a lifestyle, an
          organisation's strategy or a society's culture.
      - text: It always reduces an organisation's costs
        why: >-
          Tempting because cost reduction is among the goals, but goals are not characteristics, and many innovations
          cost a great deal.
  - key: q306
    type: mcq
    concept: innovation-map
    difficulty: 2
    stem: "The characteristic that innovations 'vary in extent or magnitude' refers to:"
    options:
      - text: the number of employees and departments who worked on it
        why: >-
          Tempting because big projects involve many people, but magnitude measures how far the change departs from the
          status quo, not the size of the team.
      - text: the physical size of the product being changed
        why: Tempting because 'magnitude' can mean size, but the slide means how far the innovation deviates from the past.
      - text: how long the innovation takes to move from the lab to the market
        why: >-
          Tempting because some innovations are slow, but the slide's magnitude is about deviation from the past, not
          time to market.
      - text: the degree to which the innovation deviates from the past
        correct: true
        why: >-
          Right. The slide defines magnitude as the degree to which one deviates from the past — from small incremental
          change to revolutionary change.
  - key: q307
    type: mcq
    concept: innovation-map
    difficulty: 2
    stem: Why is innovation 'closely related to problem solving', according to the slide?
    options:
      - text: Ideas for change never transpire without difficulty
        correct: true
        why: >-
          Right. Generation and implementation of ideas for change never transpire without difficulty; the lecture added
          that firms usually innovate to solve a pressing problem.
      - text: Problems are always solved by inventions developed inside the R&D centre
        why: >-
          Tempting because invention lives in R&D, but the slide's link is that change is always difficult, so
          innovating is itself a problem-solving exercise.
      - text: Every organisational problem has exactly one correct innovative solution
        why: >-
          Tempting if you think problems have right answers, but innovation management is about finding the most
          appropriate solution, and ideation generates many options.
      - text: Customers will only buy products that solve a problem they can describe
        why: >-
          Tempting because products solve customer problems, but the slide's point is internal: creating and
          implementing change is always difficult.
  - key: q308
    type: mcq
    concept: innovation-map
    difficulty: 3
    stem: "The lecture's examples of innovation changing culture and lifestyle included:"
    options:
      - text: the jetpack and IKEA's flat-pack furniture assembly
        why: >-
          Tempting because both appear this week, but the jetpack illustrated the Venn diagram and IKEA an answered
          what-if question, not change to culture and lifestyle.
      - text: the mobile internet and the spread of supermarkets
        correct: true
        why: >-
          Right. The lecturer said the mobile internet changed our culture immensely, and that supermarkets changed how
          people shop — one stop instead of many, less often.
      - text: the steam engine and the printing press in early factories
        why: >-
          Tempting as classic culture-changing inventions, but the lecture did not use them; its point was that culture
          now changes far faster than centuries ago.
      - text: Lego's plastic-free brick and the iPod
        why: >-
          Tempting because both appear in the readings, but Lego illustrates goals and the three circles, and the iPod
          is Brown and Wyatt's example of classic product design.
  - key: q309
    type: mcq
    concept: innovation-map
    difficulty: 3
    stem: >-
      A supermarket chain launches a new store brand of eco cleaning products and refreshes its in-store displays twice
      a year. Where does this sit on the map?
    options:
      - text: Strategic innovation
        why: >-
          Tempting because new products reach customers, but nothing here changes markets, channels or the business
