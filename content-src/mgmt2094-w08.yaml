cards:
  - type: basic
    concept: what-is-innovation
    front: What is an innovation, on the Week 8 slides?
    back: >-
      An idea, practice or object perceived as new by an individual or other unit of adoption; a use of new knowledge to
      offer a new product or service customers want. Thus: invention + commercialisation.
    source: Week 8 lecture slides, 'What is an innovation?' (slide 3)
  - type: cloze
    concept: what-is-innovation
    text: >-
      In the lecture's Venn diagram, innovation sits where what is {{c1::desirable}} to users, what is {{c2::possible}}
      with technology and what is {{c3::viable}} in the marketplace overlap.
    source: Week 8 lecture slides, Venn diagram (slide 5)
  - type: basic
    concept: what-is-innovation
    front: "Invention vs innovation: which precedes, which stays in R&D, which spreads?"
    back: >-
      Invention precedes innovation, may not be commercialised and is usually restricted to the R&D centre. Innovation
      succeeds invention, results in commercialisation, spreads across the organisation and brings organisational
      change.
    source: Week 8 lecture slides, 'Difference between Innovation & Invention' (slide 10)
  - type: apply
    concept: what-is-innovation
    scenario: A student builds a working app for her own study timetable and never releases it.
    answer: >-
      Invention, not innovation: a new product that may not be commercialised, with no economic motive. It becomes
      innovation only if introduced to the market — desirable, possible and viable.
    source: Week 8 lecture slides, slides 3, 5 and 10
  - type: basic
    concept: what-is-innovation
    front: "Reed (2018): what does Lego want, and what has gone wrong so far?"
    back: >-
      Plant-based or recycled bricks by 2030 (packaging out of landfill by 2025), keeping the brick exactly the same.
      Around 200 materials tried; most fell short — broken bricks with sharp edges, muddied colours, misshapen bricks.
    source: "Reading: Reed (2018), Inside Lego's quest to create a plastic-free brick"
  - type: basic
    concept: why-innovate-goals-and-sources
    front: The four sources of innovation?
    back: Organisational structure (organic), long tenure in management, slack resources, intra-communications.
    source: Week 8 lecture slides, 'Sources of innovation' (slide 8)
  - type: cloze
    concept: why-innovate-goals-and-sources
    text: >-
      Slack resources allow an organisation to afford to {{c1::purchase innovations}}, bear the cost of instituting
      innovation and {{c2::absorb failures}}.
    source: Week 8 lecture slides, 'Sources of innovation' (slide 8)
  - type: basic
    concept: why-innovate-goals-and-sources
    front: The ten goals of innovation?
    back: >-
      Improving quality; creation of new markets; extension of the product range; reducing labour costs; improving the
      production process; reducing materials; reducing environmental damage; replacement of products/services; reducing
      energy consumption; conformance to regulations.
    source: Week 8 lecture slides, 'Goals of innovation' (slide 7)
  - type: apply
    concept: why-innovate-goals-and-sources
    scenario: A cash-rich market leader feels unbeatable and cuts its research projects.
    answer: >-
      Slack resources cutting the wrong way: abundance can make a firm feel unthreatened, so it stops innovating. Long
      tenure can do the same through complacency.
    source: Week 8 lecture (sources of innovation)
  - type: cloze
    concept: innovation-map
    text: >-
      On the innovation map, operational innovation is {{c1::internal}} and {{c2::continuous}}; strategic innovation is
      {{c3::external}} and {{c4::discontinuous}}.
    source: Week 8 lecture slides, 'The Innovation Map' (slide 9)
  - type: basic
    concept: innovation-map
    front: The four characteristics of innovation?
    back: >-
      An object or target being changed; extent or magnitude (degree of deviation from the past); close relation to
      problem solving; impact (significance or range of effects).
    source: Week 8 lecture slides, 'Characteristics of innovation' (slide 4)
  - type: apply
    concept: innovation-map
    scenario: A hospital restructures its departments and how it manages staff, then leaves the structure in place for years.
    answer: >-
      Management innovation: internal and discontinuous — changed once in a while, then left to settle so people adjust
      and the rewards are reaped.
    source: Week 8 lecture slides, slide 9, and lecture
  - type: basic
    concept: innovation-map
    front: Where does disruptive innovation sit on the innovation map?
    back: >-
      With strategic innovation: external and discontinuous, alongside new markets, new offerings, channels, supply
      chain, customer interfaces and Blue Ocean Strategy.
    source: Week 8 lecture slides, 'The Innovation Map' (slide 9)
  - type: cloze
    concept: disruptive-innovation
    text: >-
      In Christensen's theory, disruption usually begins by serving an {{c1::overlooked, low-end or new-market}} segment
      with a {{c2::simpler, cheaper or more accessible}} offering, then improves enough to challenge {{c3::established
      firms}}.
    source: "Class activity: Is It Really Disruptive Innovation?"
  - type: basic
    concept: disruptive-innovation
    front: The class activity's five questions?
    back: >-
      Incumbent; initial customer (underserved, overlooked, non-consumer?); value proposition (cheaper, simpler, more
      convenient, accessible?); market movement (outside the mainstream, then toward it?); verdict (disruptive,
      potentially disruptive, not disruptive).
    source: "Class activity: Is It Really Disruptive Innovation?"
  - type: apply
    concept: disruptive-innovation
    scenario: Cheap online hearing aids for people who never bought clinic-fitted ones; still confined to that niche.
    answer: "Potentially disruptive: the right starting customer and value proposition, but no move toward the mainstream yet."
    source: "Class activity: Is It Really Disruptive Innovation?"
  - type: basic
    concept: disruptive-innovation
    front: Is every successful or radical innovation disruptive?
    back: >-
      No. The activity's opening line: not every successful or radical innovation is disruptive. Test the path from the
      margin, not the size of the impact.
    source: "Class activity: Is It Really Disruptive Innovation?"
  - type: basic
    concept: innovation-process-and-management
    front: The eight steps of the innovation process?
    back: >-
      1 Scanning the environment; 2 aligning strategy and the proposed innovation; 3 acquiring technology from outside;
      4 generating technology in-house; 5 exploring and selecting the most suitable response; 6 executing and
      implementing; 7 learning lessons for improvement; 8 developing the organisation.
    source: Week 8 lecture slides, 'Innovation Process' (slide 11)
  - type: cloze
    concept: innovation-process-and-management
    text: >-
      Innovation occurs at three levels: {{c1::national}} (government policies and support), {{c2::enterprise}}
      (enterprise policies, support and initiatives) and {{c3::individual}} (individual and group innovation
      activities).
    source: Week 8 lecture slides, three levels (slide 12)
  - type: basic
    concept: innovation-process-and-management
    front: What is innovation management? (three points)
    back: >-
      Learning to find the most appropriate solution and managing that process in the ways best suited to the
      organisation's circumstances; the search for effective routines; managing the learning process.
    source: Week 8 lecture slides, 'What is Innovation Management?' (slide 13)
  - type: apply
    concept: innovation-process-and-management
    scenario: An insurer lets any employee pitch ideas, bid for funding and recruit colleagues to projects.
    answer: >-
      Designing an open market for ideas, capital and talent — one step of the organisational process for innovation
      management.
    source: Week 8 lecture slides, organisational process (slide 14)
  - type: cloze
    concept: innovation-process-and-management
    text: >-
      The organisational process for innovation management begins with {{c1::market learning}} and ends with
      {{c2::paying the innovators well}}.
    source: Week 8 lecture slides, organisational process (slide 14)
  - type: cloze
    concept: value-innovation-and-what-if
    text: New technology does not become a value innovation unless it is {{c1::cheap enough for mass buyers}}.
    source: Week 8 lecture slides, 'Value Innovation (VI)' (slide 15)
  - type: basic
    concept: value-innovation-and-what-if
    front: Three 'What if' questions that got answered (Osterwalder and Pigneur, 2010)?
    back: >-
      IKEA: flat packs and DIY assembly (1950s). Skype: free internet voice calls from 2003 — 400 million users and 100
      billion free calls in five years. Grameenphone: a telephone for every Bangladeshi villager — now the country's
      largest taxpayer.
    source: Week 8 lecture slides, slide 17
  - type: basic
    concept: value-innovation-and-what-if
    front: Why was Uber value innovation in the lecture?
    back: >-
      The market, the cars, the drivers and the internet already existed; Uber rethought the value rather than inventing
      technology (and was not necessarily the first, just the most successful implementation).
    source: Week 8 lecture (value innovation)
  - type: apply
    concept: value-innovation-and-what-if
    scenario: "A team asks: 'What if people could rent out unused parking spaces by the hour through an app?'"
    answer: >-
      Treat it as a starting point, not an answer: find the business model that could make it work, and weigh the
      issues, benefits and costs.
    source: Week 8 lecture slides, slide 16
  - type: basic
    concept: ideation-toolkit
    front: Mattimore's (2012) seven ideation tools?
    back: >-
      Questioning assumptions; opportunity redefinition; wishing; triggered brainwalking; semantic intuition; picture
      prompts; worst idea.
    source: Week 8 lecture slides, 'The Ideation Tool Kit' (slide 18)
  - type: cloze
    concept: ideation-toolkit
    text: >-
      In opportunity redefinition, pick the {{c1::three}} most interesting words of the opportunity statement and
      generate {{c2::8–10}} creative alternatives for each.
    source: Week 8 lecture slides, 'Opportunity Redefinition' (slide 20)
  - type: apply
    concept: ideation-toolkit
    scenario: "Tutorial: increase the sales of new 4WD utes to women. First move with questioning assumptions?"
    answer: >-
      Frame the challenge, list 20–30 assumptions (who buys, why, through which channel), then use several as triggers
      for new ideas.
    source: Week 8 tutorial activity slides; lecture slide 19
  - type: basic
    concept: ideation-toolkit
    front: "Semantic intuition: the slide's worked example?"
    back: >-
      Improve teamwork → synonyms (meeting, information exchange; advance, upgrade) → 'upgrade information exchange' →
      upgrade information software.
    source: Week 8 lecture slides, 'Semantic Intuition' (slide 23)
  - type: cloze
    concept: design-thinking
    text: >-
      Brown and Wyatt's three spaces of design thinking are {{c1::inspiration}}, {{c2::ideation}} and
      {{c3::implementation}} — overlapping spaces, not orderly steps.
    source: "Reading: Brown and Wyatt (2010), Design Thinking for Social Innovation"
  - type: basic
    concept: design-thinking
    front: What is a 'T-shaped' person?
    back: >-
      Depth of skill in one area (the vertical) plus empathy for people and for disciplines beyond their own (the top) —
      open, curious, optimistic, learning by doing.
    source: "Reading: Brown and Wyatt (2010), Design Thinking for Social Innovation"
  - type: apply
    concept: design-thinking
    scenario: A charity's new clinic is free and close by, but few mothers use it.
    answer: >-
      Start in inspiration: observe how mothers actually live and travel, as with Shanti and the Naandi centre — the
      system's design, not price or distance, may be the barrier. Then ideate and prototype.
    source: "Reading: Brown and Wyatt (2010), Design Thinking for Social Innovation"
  - type: basic
    concept: design-thinking
    front: "The lecture's ideation process: five key questions?"
    back: >-
      Is the team sufficiently diverse? What must be studied first (immersion)? What innovations for each business-model
      building block (quantity, not quality)? What criteria for prioritising? What does the complete business model look
      like for each of the three to five shortlisted ideas?
    source: Week 8 lecture slides, 'The Ideation Process' (slides 26–27)
audio:
  title: Week 8 recap — what is innovation
  minutes: 3
  script: >-
    This week we moved from creativity to innovation. The slides define an innovation as an idea, practice or object
    perceived as new by an individual or other unit of adoption — a use of new knowledge to offer a new product or
    service that customers want. In short, invention plus commercialisation. If you cannot commercialise it, it is
    creativity, not innovation. Invention creates something new and may never leave the R and D centre; innovation
    introduces it into the marketplace, has an economic motive and changes the organisation.


    The Venn diagram turns that into a test. Innovation sits where three circles overlap: desirable to users, possible
    with technology, viable in the marketplace. The jetpack is desirable but only now technically arriving, and
    extremely expensive. Lego's plastic-free brick, in Reed's article, is held up by the material: around two hundred
    alternatives, and most have fallen short.


    Why innovate? Because in a turbulent economy survival depends on it — the slide's example is Apple. The goals run
    from improving quality and creating new markets to reducing materials, energy and environmental damage, and
    conforming to regulations. The sources are organic structure, long managerial tenure, slack resources and
    intra-communications — and remember that tenure and slack cut both ways: legitimacy can become complacency, and
    plenty of money can make a firm feel unbeatable.


    The innovation map has two axes. Operational innovation is internal and continuous; management innovation internal
    and discontinuous; product and service innovation external and continuous; strategic innovation, where disruption
    sits, external and discontinuous. The class activity warns that not every successful or radical innovation is
    disruptive. Christensen's disruption starts with overlooked, low-end or new-market customers and a simpler, cheaper
    offer, then moves toward the mainstream. Walk the questions: incumbent, initial customer, value proposition, market
    movement, verdict.


    The innovation process runs from scanning the environment and aligning strategy, through acquiring or generating
    technology, exploring and selecting, executing, learning, and developing the organisation. Innovation management is
    the search for the most appropriate solution, effective routines and managed learning.


    Value innovation creates superior buyer value in existing markets, and technology only counts if it is cheap enough
    for mass buyers — think Uber. What-if questions, like IKEA, Skype and Grameenphone, are starting points: the work is
    finding the business model. Mattimore's seven tools help: questioning assumptions, opportunity redefinition,
    wishing, triggered brainwalking, semantic intuition, picture prompts and worst idea. Finally, Brown and Wyatt's
    design thinking works through overlapping spaces — inspiration, ideation and implementation — grounded in what
    people actually do, as Shanti's water shows.
