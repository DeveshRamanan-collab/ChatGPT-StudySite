        why: Tempting because IQ tests are linked to convergent thinking, but the lecture never says it cannot err; the failure is simply upstream.
      - text: Because the analytical phase starts only after a solution has been implemented
        why: Tempting if analysis sounds like a post-mortem, but the analytical phase is convergent thinking, which selects a solution before it is implemented.
      - text: Too few solutions were found, and convergent thinking can only select among what divergent thinking produces
        correct: true
        why: Correct — divergent thinking’s task is to find solutions; with one idea, the later convergent step has nothing real to evaluate or select.
      - text: Because settling for the first idea is a problem-identification failure, which is part of divergent thinking
        why: Tempting because both are prospective, but problem identification is a separate step; and settling concerns solutions, not problems.
