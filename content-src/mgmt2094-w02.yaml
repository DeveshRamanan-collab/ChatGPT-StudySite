      - left: Listen to the unusual
        right: Identifying an interesting problem
  - key: q321
    type: short
    concept: divergent-thinking
    difficulty: 3
    prompt: '"A good team goes with its first idea and moves fast." Discuss this statement in a short applied essay about start-up founders who always build the first product idea they agree on, using the lecture’s account of divergent thinking and an example from the materials, and noting one limitation of your recommendation.'
    model: |-
      The statement describes the very trap the lecture warns against. Divergent thinking is the second step of creative problem solving, in the prospective phase: its task is to find
      solutions. The lecture warns against "linear thinking" — the propensity to settle for the first idea, and logical
      reasoning that locks you in the first solution. The founders show exactly that pattern: by building the first idea
      they agree on, they never give convergent thinking real alternatives to evaluate. The lecture's remedy is the quota
      method: always ask at least three ideas from your team (and yourself) — different options, alternate solutions — or
      refuse to decide. When at least three good ideas have been found, many more are generally found. Applied here, no
      product idea should be approved until the founders have at least three genuine alternatives. A brainstorm in Alex
      Osborne's (BBDO) sense — as many ideas as possible, without censorship, analysed and prioritised afterwards — is one
      way to reach the quota. The limitation is that more ideas are not automatically better ideas: the quota only fills
      the divergent step, and the founders still need convergent thinking to weigh benefits and risks and keep the best.
    rubric:
      - id: r1
        criterion: Concept — defines divergent thinking and linear thinking.
        marks: 2
        top-band: Places divergent thinking as the second, prospective step (find solutions) and names both linear-thinking habits from the slide.
        margin-note: What exactly is linear thinking?
        authorities: []
      - id: r2
        criterion: Example — uses a real example from the materials.
        marks: 2
        top-band: Uses the quota method (and/or Osborne’s brainstorming rule) accurately, including "or refuse to decide".
        margin-note: Which lecture method breaks the first-idea habit?
        authorities:
          - mgmt2094-example-osborne-bbdo-brainstorming
      - id: r3
        criterion: Application — applies the method to the founders.
        marks: 3
        top-band: 'Diagnoses the founders’ habit as linear thinking and sets a concrete rule: at least three genuine alternatives before any approval.'
        margin-note: What will the founders do differently on Monday?
        authorities: []
      - id: r4
        criterion: Evaluation — identifies a limit or trade-off.
        marks: 3
        top-band: 'Notes that the quota fills only the divergent step: convergent thinking is still needed, and divergent thinking tests give mixed results.'
        margin-note: Do more ideas guarantee a better product?
        authorities: []
  - key: q401
    type: mcq
