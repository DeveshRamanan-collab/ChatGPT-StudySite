  - key: q306
    type: mcq
    concept: divergent-thinking
    difficulty: 2
    stem: A marketing manager has one tagline she likes and plans to send it to the client today. Applying the quota method, what should she do?
    options:
      - text: 'Send it: logical reasoning has already shown it to be the strongest option available'
        why: Tempting because the tagline may be good, but relying on reasoning that locks you in the first solution is the linear thinking the slide warns against.
      - text: Put the tagline at the centre of a mind map and send the finished map to the client instead
        why: Tempting because mind maps gather ideas, but sending a map does not create alternatives; the quota method’s point is three options before deciding.
      - text: Run an IQ-style test on the team to check the tagline’s logic before sending it
        why: Tempting because testing sounds rigorous, but IQ tests measure deductive capacity, which belongs to convergent thinking; there is nothing yet to converge on.
      - text: Produce at least two more genuine alternatives before deciding — or refuse to decide today
        correct: true
        why: Correct — the quota method asks for at least three ideas (different options, alternate solutions) or a refusal to decide, breaking the habit of settling for the first idea.
  - key: q307
    type: mcq
    concept: divergent-thinking
    difficulty: 2
    variant-of: q306
    stem: A product team has one prototype and the CEO wants a go/no-go decision this afternoon. What does the quota method recommend?
    options:
      - text: Score the prototype on benefits and risks, which is enough to decide
        why: Tempting because benefit–risk scoring is a lecture idea, but it is convergent thinking, and it needs alternatives to choose among.
      - text: Run a random-approach session to make the prototype stranger
        why: Tempting because random approaches are a technique family, but the quota method asks for alternatives, not for making one option strange.
      - text: Ask the team (and yourself) for at least three options, or refuse to decide until they exist
        correct: true
        why: Correct — with only one option the team is in linear thinking; the quota method asks for at least three or a refusal to decide.
      - text: Decide now, because a single prototype avoids time wasted on alternatives
        why: Tempting under deadline pressure, but deciding on the only option is settling for the first idea, the habit the quota method breaks.
  - key: q308
    type: mcq
    concept: divergent-thinking
    difficulty: 3
    contrasts-with:
      - creative-problem-solving-steps
    stem: Why does the lecture treat "settling for the first idea" as a failure of divergent thinking rather than of convergent thinking?
    options:
