  - key: q320
    type: match
    concept: divergent-thinking
    difficulty: 2
    contrasts-with:
      - creative-problem-solving-steps
      - problem-identification
    prompt: Match each phrase from the lecture to the step of creative problem solving it describes.
    pairs:
      - left: Always ask at least three ideas from your team
