  - key: q523
    type: short
    concept: creativity-technique-families
    difficulty: 3
    prompt: '"Serious business problems need serious, rational techniques — the non-rational ones are just games." Discuss this statement in a short applied essay, using one rational and one non-rational technique from the lecture to tackle food waste in a supermarket chain, and say which you would use first.'
    model: |-
      The statement is half right. The lecture does give pride of place to rational « serious creativity », but it treats
      non-rational techniques as real methods, not games. Lateral thinking (Edward de Bono) is rational: it escapes linear
      thinking, for example by introducing a random component in reasoning, while remaining rational, and the lecture lists
      it for problem solving and product ideas. TRIZ (Genrich Altshuller) is the other rational model: identify
      contradictions, then apply universal laws of invention. Non-rational techniques work differently. Synectics (William
      Gordon) shifts the problem with analogies — "making the familiar strange, making the strange familiar" — through
      direct, symbolic or fantasy analogies or personal identification; detour techniques distance the team from the
      problem and then return to converge, because the distance stimulates imagination. For food waste I would start with
      lateral thinking, since the problem is practical and the lecture lists it for problem solving, and switch to a detour
      or analogy session if ideas stall. The trade-off: rational methods keep ideas workable but can stay close to the first
      solution; non-rational ones open new ground but must be turned positive — "to make it work, it would have to…".
    rubric:
      - id: r1
        criterion: Concept — defines the rational and non-rational families accurately.
        marks: 2
        top-band: Names the families and defines at least one technique in each with the slide’s wording (e.g. lateral thinking; Synectics or detour).
        margin-note: What makes a technique "rational" in the lecture?
        authorities: []
      - id: r2
        criterion: Example — uses real techniques and originators from the materials.
        marks: 2
        top-band: Correctly pairs techniques with originators (de Bono, Altshuller, Gordon) and their listed usages.
        margin-note: Who is behind each technique?
        authorities:
          - mgmt2094-example-edward-de-bono
          - mgmt2094-example-gordon-synectics
      - id: r3
        criterion: Application — applies both techniques to food waste.
        marks: 3
        top-band: Shows what each technique would do with the food-waste problem and gives a reasoned first choice.
        margin-note: What would the team actually do in each session?
        authorities: []
      - id: r4
        criterion: Evaluation — weighs the statement and the trade-offs.
        marks: 3
        top-band: Takes a position on the statement and weighs feasibility against novelty, noting the need to converge after a non-rational session.
        margin-note: Is "just games" fair to the lecture?
        authorities: []
