questions:
  - key: q101
    type: mcq
    concept: creative-problem-solving-steps
    difficulty: 1
    set: pretest
    stem: Which sequence gives the three steps of creative problem solving in the lecture’s order?
    options:
      - text: Identify an interesting problem → convergent thinking → divergent thinking
        why: Tempting because narrowing a problem down sounds convergent, but convergent thinking is the last step — it selects among the solutions that divergent thinking has already produced.
      - text: Convergent thinking → divergent thinking → identify an interesting problem
        why: 'Tempting if you picture evaluation coming first, but this reverses the whole model: the lecture starts with the problem and ends by finding « the » solution, or a good one.'
      - text: Identify an interesting problem → divergent thinking → convergent thinking
        correct: true
        why: Correct — the slide runs from identifying an interesting problem (find problems, identify needs) to divergent thinking (find solutions) to convergent thinking (find « the » solution, or a good solution).
      - text: Divergent thinking → identify an interesting problem → convergent thinking
        why: 'Tempting because divergent thinking feels like the creative starting point, but the lecture puts problem identification first: there is nothing to find solutions for until a problem has been found.'
  - key: q102
    type: mcq
    concept: creative-problem-solving-steps
    difficulty: 1
    stem: Which two steps make up the prospective phase?
    options:
      - text: All three steps; the analytical phase is a separate fourth step
        why: Tempting if you read "analytical phase" as an extra stage, but the model has only three steps, and the analytical phase simply is the convergent-thinking step.
      - text: Identifying an interesting problem, then divergent thinking
        correct: true
        why: Correct — on the slide the prospective phase spans the first two funnels (find problems, identify needs; find solutions); convergent thinking sits alone in the analytical phase.
      - text: Divergent thinking and convergent thinking, the two "thinking" steps
        why: Tempting because both are named "thinking", but convergent thinking belongs to the analytical phase; problem identification is the other prospective step.
      - text: Identifying an interesting problem, then convergent thinking
        why: Tempting because both steps narrow down on the slide’s funnel drawing, but convergent thinking is the analytical phase, not part of the prospective phase.
  - key: q103
    type: mcq
    concept: creative-problem-solving-steps
    difficulty: 1
    stem: On the lecture slide, what is the task of convergent thinking?
    options:
      - text: Find « the » solution, or a good solution
        correct: true
        why: 'Correct — the box under convergent thinking reads: find « the » solution, or a good solution. It is the analytical phase that closes the process.'
      - text: Find problems and identify the needs behind them
        why: Tempting because "convergent" sounds like closing in on a problem, but finding problems and identifying needs is the task of the first step, identifying an interesting problem.
      - text: Find solutions, as many of them as possible
        why: Tempting because convergent thinking does deal with solutions, but generating them is divergent thinking’s task; convergent thinking selects among them.
      - text: Find the right question to ask
        why: Tempting because asking the right questions is stressed in the lecture, but that belongs to problem identification, the first step, not to convergent thinking.
  - key: q104
    type: mcq
    concept: creative-problem-solving-steps
    difficulty: 2
    stem: 'A café owner notices customers walk out when the queue passes ten people, and writes down: "How might we make waiting feel shorter?" Which step is she in?'
    options:
      - text: Divergent thinking — generating several possible solutions to the queue
        why: Tempting because her question invites ideas, but she has not produced any solutions yet; divergent thinking begins when options are being generated.
      - text: Convergent thinking — selecting the best way to cut the queue
        why: Tempting because she is focusing on one issue, but nothing is being evaluated or selected; convergent thinking chooses among solutions already on the table.
      - text: The analytical phase — deducing the consequences of the queue
        why: Tempting because she observed a consequence (customers leave), but the analytical phase is convergent thinking; framing the need is prospective work.
      - text: Identifying an interesting problem — finding a problem and a need
        correct: true
        why: Correct — she has noticed a need and framed it as a question; no solutions exist yet. The lecture makes this the first step of the prospective phase.
  - key: q105
    type: mcq
    concept: creative-problem-solving-steps
    difficulty: 2
    variant-of: q104
    stem: A marketing team has listed twenty campaign concepts and is now scoring each on cost, risk and fit with the brand. Which step are they in?
    options:
      - text: Convergent thinking, in the analytical phase
        correct: true
        why: Correct — identifying benefits and risks, keeping the best and eliminating the rest is evaluation/selection, which the lecture assigns to convergent thinking.
      - text: Problem identification, in the prospective phase
        why: Tempting because they are still thinking about the brand, but the problem is set and solutions exist; they are now choosing among them.
      - text: A fourth step the lecture calls "review"
        why: Tempting if you expect a review stage after brainstorming, but the lecture’s model has three steps; scoring options is convergent thinking.
      - text: Divergent thinking, in the prospective phase
        why: Tempting because twenty ideas are on the table, but generating them was the divergent step; scoring them is selection, which is convergent thinking.
  - key: q106
    type: mcq
    concept: creative-problem-solving-steps
    difficulty: 2
    stem: The lecture also draws the three steps as a cycle. What point does the cycle make?
    options:
      - text: The best ideas come from one flash of insight rather than from any process
        why: Tempting because intuitions are mentioned, but the caption says advances are a sum of intuitions and successive progresses — a long process, not a single flash.
      - text: 'Great advances are usually a long process: a sum of intuitions and successive progresses'
        correct: true
        why: Correct — that is the caption beside the cycle. Problem identification, divergent and convergent thinking repeat, and advances build up over successive rounds.
      - text: Each step should be completed once, in strict order, so that no time is wasted on repeats
        why: 'Tempting because the funnel diagram reads left to right, but the cycle shows the opposite: the process loops back, and advances come from successive progresses.'
      - text: Convergent thinking becomes optional once divergent thinking has produced enough ideas
        why: Tempting because the cycle returns to the start, but convergent thinking stays one of the three segments; the loop does not skip it.
  - key: q107
    type: mcq
    concept: creative-problem-solving-steps
    difficulty: 2
    stem: Which abilities does the lecture attach to convergent thinking?
    options:
      - text: Identifying benefits and risks; keeping the best and eliminating wrong answers
        correct: true
        why: Correct — the convergent-thinking slide lists these with evaluation/selection and positive and critical thinking; IQ tests measure the related deductive capacity.
      - text: Listening to the unusual; identifying consequences that make a subject essential
        why: Tempting because these are listed qualities too, but they belong to identifying an interesting problem, the first step, not to convergent thinking.
      - text: Asking at least three ideas of your team, or refusing to decide until you have them
        why: Tempting because it is a named method, but the quota method is the lecture’s example of divergent thinking, which resists settling for the first idea.
      - text: Distorting the problem into an evocation that stimulates the imagination
        why: Tempting because it is a structured technique, but it is the distanciation phase of detour techniques, a "non-rational" approach, not convergent thinking.
  - key: q108
    type: mcq
    concept: creative-problem-solving-steps
    difficulty: 3
    contrasts-with:
      - divergent-thinking
    stem: 'A manager says: "Brainstorm freely, but cross out any idea that seems too expensive the moment it is said." What is the problem, in the lecture’s terms?'
    options:
      - text: She skips problem identification, because cost is a problem that should have been found first
        why: 'Tempting because cost is a real constraint, but the issue is when ideas are judged: crossing them out mid-generation brings selection into the divergent step.'
      - text: She relies on the quota method, which always yields too many expensive ideas
        why: Tempting because quotas raise the number of ideas, but the quota method is a divergent-thinking aid that says nothing about cost; it is not her problem here.
      - text: Nothing — divergent and convergent thinking should run at the same moment to save time
        why: 'Tempting as an efficiency argument, but the lecture separates them: divergent thinking finds solutions, then convergent thinking finds « the » or a good solution.'
      - text: She brings convergent evaluation into the divergent step, cutting ideas before many are found
        correct: true
        why: 'Correct — divergent thinking aims at many options (brainstorming: as many ideas as possible without censorship); evaluating benefits and risks belongs to the later convergent step.'
  - key: q109
    type: mcq
    concept: creative-problem-solving-steps
    difficulty: 1
    stem: Which pairing of step and task matches the slide?
    options:
      - text: Convergent thinking — find problems, identify needs
        why: Tempting because convergent sounds like narrowing onto a problem, but finding problems and identifying needs is the first step; convergent thinking selects a solution.
      - text: Divergent thinking — find « the » solution, or a good one
        why: Tempting because divergent thinking deals with solutions, but it generates them; picking « the » solution, or a good one, is the analytical, convergent step.
      - text: Divergent thinking — find solutions
        correct: true
        why: Correct — the box under divergent thinking reads "find solutions"; it is the second step, in the prospective phase.
      - text: Identify an interesting problem — find « the » solution
        why: Tempting because the first step is about focus, but its task is to find problems and identify needs; finding « the » solution is convergent thinking.
  - key: q110
    type: mcq
    concept: creative-problem-solving-steps
    difficulty: 3
    stem: A start-up founder hears one customer complaint and immediately builds the first fix that comes to mind. Which steps of the model has she skipped?
    options:
      - text: Only convergent thinking, since building a fix shows she must have generated options
        why: Tempting if you assume a fix implies options, but she built the first idea that came to mind — the linear-thinking trap the quota method targets.
      - text: Only problem identification, because a single complaint is not yet an interesting problem
        why: Tempting because the complaint was never reframed, but she did find a need; the clearer gap is that she produced no options and chose among none.
      - text: 'Divergent and convergent thinking: she never generated alternatives or chose among them'
        correct: true
        why: Correct — she found a problem but jumped to the first idea; with no options generated there was nothing for convergent thinking to evaluate.
      - text: None — acting on the first idea is what the analytical phase recommends
        why: Tempting because acting quickly feels decisive, but the analytical phase is evaluation and selection among options; settling on the first idea is linear thinking.
  - key: q111
    type: mcq
    concept: creative-problem-solving-steps
    difficulty: 2
    stem: Which statement about the analytical phase is accurate?
    options:
      - text: It holds problem identification and divergent thinking, the two narrowing steps
        why: Tempting because the first funnel narrows, but problem identification and divergent thinking make up the prospective phase, not the analytical one.
      - text: 'It is one step, convergent thinking: find « the » solution, or a good one'
        correct: true
        why: Correct — on the slide the analytical phase holds only convergent thinking, whose task is to find « the » solution, or a good solution.
      - text: It replaces convergent thinking whenever a team cannot agree on a solution
        why: Tempting if you treat analysis as a fallback, but the analytical phase is not a substitute for convergent thinking — it is convergent thinking.
      - text: It is where needs are identified, before any thinking about solutions begins
        why: Tempting because analysis sounds like diagnosis, but identifying needs is the first step of the prospective phase; the analytical phase comes last.
  - key: q112
    type: mcq
    concept: creative-problem-solving-steps
    difficulty: 4
    variant-of: q106
    stem: 'A consultant argues: "Creative problem solving is a straight line — identify, diverge, converge, done." What does the lecture say against this?'
    options:
      - text: The steps form a cycle; great advances are a long process of intuitions and successive progresses
        correct: true
        why: Correct — the cycle slide loops convergent thinking back to problem identification, and its caption says great advances are usually a long process, a sum of intuitions and successive progresses.
      - text: Convergent thinking should be skipped in creative work, so the line should end at divergence
        why: Tempting if creativity is equated with generating ideas, but convergent thinking is one of the three steps; the lecture’s point is that the steps repeat.
      - text: The process has two steps, not three, because divergent thinking is part of the analytical phase
        why: Tempting because the model has two phases, but it has three steps, and divergent thinking is prospective; the objection lies elsewhere.
      - text: Divergent thinking should come before problem identification, so the consultant’s line is in the wrong order
        why: Tempting as a correction to the order, but the lecture keeps problem identification first; its objection is to the word "done", not to the sequence.
  - key: q113
    type: mcq
    concept: creative-problem-solving-steps
    difficulty: 3
    stem: Which of these is NOT a task the lecture gives to any of the three steps?
    options:
      - text: Find solutions — different options, alternate solutions
        why: Tempting because it sounds like a method rather than a step, but finding solutions is the task of divergent thinking, the second step.
      - text: Find « the » solution, or a good solution
        why: Tempting because "« the » solution" sounds like an outcome, not a task, but it is exactly how the slide describes convergent thinking, the third step.
      - text: Find problems and identify the needs behind them
        why: Tempting because it sounds like preparation rather than a step, but it is the task of the first step, identifying an interesting problem.
      - text: Reward the best ideas deposited in a box
        correct: true
        why: Correct — the rewarded idea box (1721) belongs to idea-gathering techniques (participatory innovation), not to one of the three steps of creative problem solving.
  - key: q114
    type: mcq
    concept: creative-problem-solving-steps
    difficulty: 2
    stem: In the slide’s funnel drawing, how does divergent thinking look compared with the other two steps?
    options:
      - text: It is drawn as a circle that loops back round to problem identification
        why: Tempting because the lecture does draw a cycle, but that is a separate slide of all three steps; in the funnel drawing divergent thinking is the widening shape.
      - text: It narrows to a point, like convergent thinking, because both reduce the options
        why: Tempting because both are kinds of thinking, but on the slide divergent thinking widens; only problem identification and convergent thinking narrow.
      - text: It opens out from a narrow point, while the other two steps narrow down
        correct: true
        why: Correct — problem identification narrows to a point, divergent thinking widens out into many solutions, and convergent thinking closes them down again.
      - text: It is drawn as the widest box inside the analytical phase
        why: Tempting because divergent thinking is the widest shape, but it sits in the prospective phase; the analytical phase holds only convergent thinking.
  - key: q115
    type: truefalse
    concept: creative-problem-solving-steps
    difficulty: 1
    set: quickfire
    statement: In the lecture’s model, convergent thinking belongs to the prospective phase.
    answer: false
    why: False — the prospective phase holds problem identification and divergent thinking; convergent thinking is the analytical phase, where « the » solution, or a good solution, is found.
  - key: q116
    type: truefalse
    concept: creative-problem-solving-steps
    difficulty: 1
    set: quickfire
    statement: 'The first step of creative problem solving is to identify an interesting problem: find problems, identify needs.'
    answer: true
    why: True — the slide begins with "identify an interesting problem", with the task "find problems, identify needs", before divergent and convergent thinking.
  - key: q117
    type: truefalse
    concept: creative-problem-solving-steps
    difficulty: 2
    set: quickfire
    statement: The lecture presents great advances as the product of one decisive insight rather than a long process.
    answer: false
    why: False — beside the cycle the lecture says great advances are usually the result of a long process that is a sum of intuitions and successive progresses.
  - key: q118
    type: truefalse
    concept: creative-problem-solving-steps
    difficulty: 2
    statement: On the slide, the task of divergent thinking is to find solutions.
    answer: true
    why: True — the box under divergent thinking reads "find solutions"; choosing « the » solution, or a good one, is left to convergent thinking.
  - key: q119
    type: truefalse
    concept: creative-problem-solving-steps
    difficulty: 2
    statement: 'The analytical phase contains two steps: divergent and convergent thinking.'
    answer: false
    why: False — the analytical phase contains only convergent thinking; divergent thinking sits with problem identification in the prospective phase.
  - key: q120
    type: match
    concept: creative-problem-solving-steps
    difficulty: 2
    prompt: Match each step of creative problem solving to its task on the slide.
    pairs:
      - left: Identify an interesting problem
        right: Find problems, identify needs
      - left: Divergent thinking
        right: Find solutions
      - left: Convergent thinking
        right: Find « the » solution, or a good solution
  - key: q121
    type: short
    concept: creative-problem-solving-steps
    difficulty: 3
    prompt: '"Creative problem solving starts with ideas." Discuss this statement in a short applied essay, using the lecture’s three steps of creative problem solving to structure how a regional council should tackle litter in a local park, and identify one limit of treating the steps as a straight line.'
    model: |-
      The statement gets the order wrong: on the lecture's model, creative problem solving starts with a problem, not
      ideas. In the prospective phase the team first identifies an interesting problem — finds problems, identifies needs — and then thinks divergently to find
      solutions; in the analytical phase, convergent thinking finds « the » solution, or a good solution. The examples show why: "How to make bus stop shelters viable?" led to the worldwide success of
      Decaux, because the question came before the answer. For the park, I would not start with bins. I would first reframe
      the brief as a question — why do visitors leave litter where they do? — by listening to the unusual and identifying
      the consequences that make the problem essential. The team would then generate at least three different solutions
      (the quota method) before judging any, and only then identify benefits and risks to keep the best. The limit is that
      the steps are not a one-way line: the lecture also draws them as a cycle, and great advances are usually a long
      process of intuitions and successive progresses, so the council should expect to loop back after trying a solution.
    rubric:
      - id: r1
        criterion: Concept — defines the three steps and two phases accurately.
        marks: 2
        top-band: Names all three steps with their tasks (find problems/identify needs; find solutions; find « the » or a good solution) and places them in the prospective and analytical phases.
        margin-note: Which steps are prospective, and which analytical?
        authorities: []
      - id: r2
        criterion: Example — uses a real example from the materials.
        marks: 2
        top-band: Uses the Decaux bus-shelter question (or relativity or impressionism) to show the problem coming before the answer.
        margin-note: Where in the lecture does a question lead to a breakthrough?
        authorities:
          - mgmt2094-example-decaux
      - id: r3
        criterion: Application — applies the steps to the park brief.
        marks: 3
        top-band: Reframes the brief as a question, generates at least three options before judging, then evaluates benefits and risks to keep the best.
        margin-note: Show each step in the council’s work, in order.
        authorities: []
      - id: r4
        criterion: Evaluation — identifies a limit or trade-off.
        marks: 3
        top-band: 'Uses the cycle slide: advances come from a long process of successive progresses, so the steps repeat rather than run once.'
        margin-note: Is the process really one-way?
        authorities: []
  - key: q201
    type: mcq
    concept: problem-identification
    difficulty: 1
    set: pretest
    stem: According to the lecture, what is a key characteristic of creative people?
    options:
      - text: Producing many answers quickly when under time pressure
        why: Tempting because speed of ideas sounds creative, but the slide stresses the question, not the answers — "computers… can only give answers".
      - text: Settling quickly on the first logical solution to save time
        why: Tempting as a sign of decisiveness, but settling for the first idea is the "linear thinking" the quota method is meant to break.
      - text: Identifying meaningful problems — asking the right questions
        correct: true
        why: Correct — the slide says identifying meaningful problems, asking the right questions is a key characteristic of creative people.
      - text: Scoring highly on the IQ tests that measure deductive capacity
        why: Tempting because IQ tests appear in the lecture, but they are linked to convergent thinking; the lecture names problem-finding as the creative characteristic.
  - key: q202
    type: mcq
    concept: problem-identification
    difficulty: 1
    stem: '"If I had one hour to save the world, I would spend 59 minutes defining the problem and one minute solving it." To whom does the slide attribute this, and what does it support?'
    options:
      - text: Albert Einstein — defining the problem deserves most of the effort
        correct: true
        why: Correct — the slide attributes the line to Albert Einstein and uses it to show that defining the problem matters more than the time spent solving it.
      - text: Alex Osborne — meetings should spend most of their time generating ideas
        why: Tempting because Osborne is linked to brainstorming, but the quote is Einstein’s, and it favours defining the problem over generating solutions.
      - text: Tony Buzan — a mind map lets you define any problem on one page
        why: Tempting because Buzan is central to the week, but this line is attributed to Einstein and concerns problem identification, not mind mapping.
      - text: Pablo Picasso — computers can only give answers, not define problems
        why: Tempting because Picasso is quoted on the same slide, but his line is "Computers are useless. They can only give answers…"; the 59-minutes line is Einstein’s.
  - key: q203
    type: mcq
    concept: problem-identification
    difficulty: 2
    stem: '"Computers are useless. They can only give answers…" Why does the lecture put this Picasso line on the problem-identification slide?'
    options:
      - text: Because convergent thinking, not problem finding, is what makes people creative
        why: 'Tempting because answers come from convergent thinking, but the slide makes the opposite point: the question, not the answer, marks creative people.'
      - text: Because divergent thinking tests are run on computers and give mixed results
        why: Tempting because the lecture does say divergent thinking tests produce mixed results, but that is a separate slide and has nothing to do with Picasso’s line.
      - text: Because the lecture argues that computers should be kept out of creative work altogether
        why: Tempting on a literal reading, but the slide is not about technology policy; it uses the line to stress questions over answers.
      - text: Answers are not the creative part; asking the right questions is
        correct: true
        why: Correct — the line sits beside the claim that asking the right questions is a key characteristic of creative people; giving answers alone is not enough.
  - key: q204
    type: mcq
    concept: problem-identification
    difficulty: 1
    stem: Which two "related qualities" does the lecture list for identifying an interesting problem?
    options:
      - text: Listen to the unusual; identify consequences that make the subject essential
        correct: true
