        why: 'Tempting as a stereotype of creativity, but each point contradicts the slide: creativity is a process, often a group phenomenon, and implies domain knowledge.'
      - text: It is irrational; it cannot be observed; it happens only in the arts
        why: Tempting because "non-rational" techniques exist, but the lecture’s reasons are process, group and domain knowledge — and its examples include business (Decaux).
      - text: It is a fixed trait; IQ tests already measure it; tests are too costly
        why: Tempting because IQ tests are discussed, but the lecture links them only to convergent thinking and never calls creativity a fixed trait.
      - text: It is a process; it is often a group phenomenon; it implies domain knowledge
        correct: true
        why: 'Correct — the three bubbles on the slide read: creativity is a process; creativity is often a group phenomenon; creativity implies domain knowledge.'
