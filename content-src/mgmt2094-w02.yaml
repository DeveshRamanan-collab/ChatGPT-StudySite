  - key: q621
    type: short
    concept: idea-gathering-techniques
    difficulty: 3
    prompt: '"An organisation with an idea box already has an innovation system." Discuss this statement in a short applied essay about a retailer with 2,000 staff, using idea gathering as the lecture presents it and one historical example.'
    model: |-
      The statement mistakes collection for innovation. Idea gathering is one of the lecture's four families of creativity
      techniques, with two strands. Brainstorming (Alex Osborne, BBDO) answers a question in a meeting by generating as many
      ideas as possible in a short time without censorship, then analysing and prioritising them afterwards. Participatory
      innovation — idea boxes and idea intranets — collects ideas from many people over time. Its history runs from 1721,
      when the best ideas deposited in Shôgun Tokugawa Yoshimune's idea box (meyasu bako) were rewarded, through quality
      circles and Kaizen in the seventies, to idea management software in the 2000s and idea crowdsourcing in the 2010s.
      The 2000s definition is the key: participatory innovation is open procedures for the collection, analysis and
      application of ideas. For 2,000 staff, I would pair an idea intranet open to everyone, with the best ideas rewarded
      as in 1721, with short brainstorms on specific questions, and publish how ideas are analysed and applied. The
      limitation is that both strands only gather ideas: without a convergent step that analyses, prioritises and applies
      them, the box produces volume, not innovation.
    rubric:
      - id: r1
        criterion: Concept — defines idea gathering and its two strands.
        marks: 2
        top-band: Defines brainstorming with the slide’s rule and participatory innovation as open procedures for collection, analysis and application.
        margin-note: What exactly makes it participatory innovation?
        authorities: []
      - id: r2
        criterion: Example — uses a real historical example.
        marks: 2
        top-band: Uses the 1721 idea box (or quality circles/Kaizen, or a named crowdsourcing platform) accurately.
        margin-note: When and where did the idea box start?
        authorities:
          - mgmt2094-example-tokugawa-idea-box
      - id: r3
        criterion: Application — designs a system for the retailer.
        marks: 3
        top-band: Combines a standing channel with focused brainstorms and shows how ideas will be analysed and applied, not only collected.
        margin-note: What happens to an idea after it is submitted?
        authorities: []
      - id: r4
        criterion: Evaluation — takes a position on the statement.
        marks: 3
        top-band: Rejects or qualifies the statement because collection without analysis and application is not innovation.
        margin-note: Is a full box the same as innovation?
        authorities: []
  - key: q701
    type: mcq
    concept: mind-maps
    difficulty: 1
    set: pretest
    stem: What is a mind map, as the lecture defines it?
    options:
      - text: A visual way to organise notes, ideas and conversations around one central word
        correct: true
        why: Correct — a mind map visually organises notes, thoughts, ideas and conversations, and is created around a single word or text placed in the centre.
      - text: A table that scores ideas on their benefits and risks before choosing one
        why: Tempting because it organises ideas, but scoring benefits and risks is convergent thinking, not mind mapping.
      - text: A numbered list that adds up items in order, like Bedrooms 6 + Kitchen 1 = a total
        why: Tempting because it organises information, but that list is the tutorial’s picture of how we do NOT think; a mind map is radial.
      - text: A set of six coloured hats that stand for the common reasoning attitudes
        why: Tempting because both are rational techniques, but materialising reasoning attitudes is de Bono’s six hats.
  - key: q702
    type: mcq
    concept: mind-maps
    difficulty: 1
    stem: Who takes the credit for inventing modern mind mapping?
    options:
      - text: Alex Osborne, co-founder of BBDO
        why: Tempting because mind maps can gather ideas like a brainstorm, but Osborne is linked to brainstorming.
      - text: William Gordon, founder of Synectics
        why: Tempting because he founded a named method, but Gordon is linked to Synectics (analogical reasoning).
      - text: Edward de Bono, of lateral thinking
        why: Tempting because de Bono is in the same rational family, but he is linked to lateral thinking and the six hats.
      - text: Tony Buzan, a British psychologist
        correct: true
        why: Correct — the slide says Tony Buzan (a British psychologist) takes the credit for inventing modern mind mapping.
  - key: q703
    type: mcq
    concept: mind-maps
    difficulty: 2
    stem: Which statement about the history of mind mapping matches the lecture?
    options:
      - text: Forms of it go back many centuries; Buzan popularised it and offered theories on why it works
        correct: true
        why: Correct — the slide says different forms have been used over many centuries and Buzan "really just popularized it" and theorised why it works.
      - text: Mind maps were first used in 1721 to sort ideas from an idea box
        why: Tempting because 1721 is a date from this week, but it is the rewarded idea box, not the origin of mind maps.
      - text: Mind mapping was invented by Japanese quality circles in the seventies
        why: Tempting because quality circles are on this week’s timeline, but they belong to participatory innovation, not to mind mapping.
      - text: Buzan drew the very first mind map, and no earlier forms of it had ever existed
        why: Tempting because Buzan takes the credit, but the slide says different forms of mind mapping were used over many centuries.
  - key: q704
    type: mcq
    concept: mind-maps
    difficulty: 1
    stem: According to Buzan’s guidelines, how many colours should a mind map use at minimum?
    options:
      - text: One
        why: Tempting because one colour looks tidy, but the guidelines ask for colours throughout, three at minimum.
      - text: Six
        why: Tempting because six recalls de Bono’s hats, but Buzan’s minimum is three colours.
      - text: Three
        correct: true
        why: 'Correct — "Use colours throughout, three colours at minimum": colours are as exciting to your brain as images.'
      - text: Two
        why: Tempting as a compromise, but the guidelines set the minimum at three colours.
  - key: q705
    type: mcq
    concept: mind-maps
    difficulty: 2
    stem: Why, according to the guidelines, should you start in the centre of a blank landscape page?
    options:
      - text: It makes you write a full sentence in the centre so the topic is completely clear
        why: Tempting because the topic does go in the centre, but the guidelines prefer an image there and one key word per line.
      - text: It keeps the map small enough to photograph and share easily with your team
        why: Tempting as a practical reason, but the guidelines justify the centre by the brain’s freedom to spread out, not by sharing.
      - text: It gives your brain freedom to spread out in all directions and express itself freely
        correct: true
        why: Correct — "starting in the centre gives your brain freedom to spread out in all directions and express itself free and naturally".
      - text: It makes it easier to number the branches in a strict, linear order
        why: Tempting because order aids clarity, but starting in the centre is meant to free radial thinking, not to impose a linear order.
  - key: q706
    type: mcq
    concept: mind-maps
    difficulty: 2
    stem: Why should branches be curved rather than straight, according to Buzan?
    options:
      - text: Straight lines imply a strict ranking of ideas
        why: 'Tempting as a design argument, but the guidelines give a different reason: straight lines are boring to your brain.'
      - text: Curves show which of the ideas matter most
        why: Tempting because the map does show importance, but importance is shown by line thickness (thicker at the centre), not by curves.
      - text: Curved lines leave more room for long sentences
        why: Tempting because curves can be longer, but the guidelines ask for one key word per line, not long sentences.
      - text: Straight lines are boring to your brain
        correct: true
        why: Correct — "Make your branches curved, rather than straight lined. Why? Because straight lines are boring to your brain."
  - key: q707
    type: mcq
    concept: mind-maps
    difficulty: 2
    stem: What do the guidelines say about the words on the branches?
    options:
      - text: One key word per line, in upper and lower case
        correct: true
        why: Correct — "Use one key word per line… a single word gives your mind map more power and flexibility. Use upper and lower case."
      - text: 'No words at all: images alone carry the meaning'
        why: Tempting because images are worth a 1000 words, but the guidelines use both, each word or image alone on its own line.
      - text: Only capital letters, so the words stand out
        why: Tempting because capitals are emphatic, but the guidelines say to use upper and lower case.
      - text: A full sentence per branch so nothing is lost
        why: Tempting because sentences seem more complete, but the guidelines favour one key word per line for power and flexibility.
  - key: q708
    type: mcq
    concept: mind-maps
    difficulty: 2
    stem: How should line thickness change across a mind map?
    options:
      - text: All lines the same thickness so that no branch looks more important than another
        why: Tempting as a fairness rule, but the guidelines want central lines thicker, showing that main branches matter more.
      - text: Thicker at the centre, thinning as lines radiate out
        correct: true
        why: 'Correct — "The central lines are thicker, organic and thinner as they radiate out from the centre"; the lecture’s map adds: central more important, outer less important.'
      - text: Thickness chosen at random, to add a random component to reasoning
        why: Tempting because randomness is a lateral-thinking device, but mind-map line thickness follows the centre-out rule.
      - text: Outer lines thicker, because the detail at the edges matters more than the main themes
        why: 'Tempting if detail is prized, but the guidelines reverse this: central lines thicker, outer lines thinner.'
  - key: q709
    type: mcq
    concept: mind-maps
    difficulty: 2
    stem: Why should main branches connect to the central image, and second- and third-level branches to the levels before them?
    options:
      - text: So that the branches can be added up like a running total at the end
        why: Tempting because the windows list adds up, but that list is the linear thinking the tutorial contrasts with radial maps.
      - text: So that the map can be read in one fixed, numbered order, from the first branch to the very last
        why: Tempting because connection suggests a path, but the reason given is association, not a fixed reading order.
      - text: The brain works by associations, so connected branches are easier to understand and remember
        correct: true
        why: Correct — "your brain works by associations… If you connect the branches, you will understand and remember a lot more easily."
      - text: So the finished map looks symmetrical and balanced on the landscape page
        why: Tempting as a visual reason, but the guidelines justify connection by how the brain links things, not by symmetry.
  - key: q710
    type: mcq
    concept: mind-maps
    difficulty: 2
    stem: The tutorial asks how many windows are in your home, then asks you to mind map how you counted. What does the exercise demonstrate?
    options:
      - text: That counting tasks are best done by convergent, IQ-style deduction
        why: Tempting because counting feels deductive, but the exercise shows associative, radial thinking, not deduction.
      - text: That a central image is unnecessary when the task is a numerical one
        why: Tempting because the task is numerical, but the exercise’s point is radial association, which supports mind mapping around a centre.
      - text: That we think in radial associations, navigating a mental picture and adding windows as we go
        correct: true
        why: 'Correct — the debrief: you formed a mental picture of your home and navigated it, adding windows along the way — creating associations to solve a problem.'
      - text: That we think in linear lists, adding the rooms one at a time with a calculator
        why: Tempting because the answer is a number, but the debrief says you most likely did not need a calculator, and the list is labelled "Not This".
  - key: q711
    type: mcq
    concept: mind-maps
    difficulty: 3
    stem: A student’s mind map has a paragraph of text in the centre, straight black lines and full sentences on every branch. Which changes would best bring it into line with Buzan’s guidelines?
    options:
      - text: Number the branches, keep the straight lines for clarity, and add more sentences
        why: Tempting because it sounds orderly, but straight lines and sentences break the guidelines, and numbering pushes the map towards a list.
      - text: Turn the page to portrait, start at the top-left corner, and list the ideas downwards
        why: Tempting because it is how notes are usually written, but it is linear note taking; Buzan starts in the centre of a landscape page.
      - text: Make the outer lines thicker than the central ones and keep a single colour throughout
        why: Tempting as a styling fix, but it reverses the thickness rule and ignores the three-colour minimum.
      - text: Use a central image, at least three colours, curved branches, and one key word per line
        correct: true
        why: 'Correct — each change answers a guideline: image for the central idea, colours throughout (three minimum), curved branches, one key word per line.'
  - key: q712
    type: mcq
    concept: mind-maps
    difficulty: 3
    variant-of: q711
    stem: 'Critiquing the tutorial’s Time Management mind map, a student says: "The pictures are so busy I can’t find the words." Which critique question does this raise?'
    options:
      - text: Is the focus on the images and not the words?
        correct: true
        why: Correct — the tutorial asks whether the focus is on the images and not the words, and whether that matters.
      - text: Is there a standard test for formulating problems?
        why: Tempting because it echoes the lecture, but the lecture says there is none, and it has nothing to do with critiquing a map.
      - text: How many windows are in your home?
        why: Tempting because it is a tutorial question, but it opens the radial-association exercise, not the critique.
      - text: Did it require real mental strain to see both?
        why: Tempting because it is a reflective question, but it belongs to the lecture’s ambiguous-drawing creativity test.
  - key: q713
    type: mcq
    concept: mind-maps
    difficulty: 2
    stem: What are mind maps used for, according to the lecture?
    options:
      - text: Rewarding the best ideas that staff deposit over the year
        why: Tempting because mind maps can collect ideas, but rewarding deposited ideas is the idea box, participatory innovation.
      - text: Summarising existing knowledge, gathering ideas, or organising tasks or information
        correct: true
        why: 'Correct — the rational-approaches slide: mindmaps are used to summarise existing knowledge, gather ideas (brainstorming), or organise tasks or information (meeting management…).'
      - text: Measuring individual creativity in a standard, repeatable way
        why: Tempting because they reveal thinking, but the lecture says no standardised test can measure individual creativity.
      - text: Resolving contradictions between physical quantities in the design of a new product
        why: Tempting because it is another rational technique, but resolving such contradictions is TRIZ.
  - key: q714
    type: mcq
    concept: mind-maps
    difficulty: 3
    stem: How are mind maps most frequently used in business, according to the lecture?
    options:
      - text: Only by designers, never by managers or marketers
        why: Tempting because of the tutorial’s Roger Martin quote, but the lecture lists business uses including strategy and conversations.
      - text: Only for formal reports, not for conversations or notes
        why: Tempting because business sounds formal, but the listed uses include documenting conversations and general note taking.
      - text: Collaboratively — though it is possible to use them on your own
        correct: true
        why: Correct — "in business mind maps are most frequently used collaboratively – but it is possible to use mind mapping on your own, as an individual".
      - text: Only individually, because collaboration clutters the map
        why: Tempting because group maps can get busy, but the lecture says collaborative use is the most frequent in business.
  - key: q715
    type: mcq
    concept: mind-maps
    difficulty: 3
    contrasts-with:
      - creativity-technique-families
    stem: Where does the lecture place mindmaps among the technique families, and what usage does it give them for marketing and sales?
    options:
      - text: Irrational; a dreamlike evocation of the problem
        why: Tempting because mind maps use images, but they are in the rational family; dreamlike techniques belong to detour approaches.
      - text: Idea gathering; names and slogans from a meeting
        why: Tempting because mind maps gather ideas, but names and slogans are brainstorming’s usage, in the idea-gathering family.
      - text: Gaming; product roadmaps and identifying the growth drivers of a business
        why: Tempting because mind maps can be fun, but gaming and those usages belong to innovation games (Hohmann).
      - text: Rational; synthesis of information and collaborative brainstorming
        correct: true
        why: Correct — mindmaps (Buzan) sit in the rational family, and the marketing slide lists their usage as synthesis of information / collaborative brainstorming.
  - key: q716
    type: mcq
    concept: mind-maps
    difficulty: 4
    stem: Your Creative Project mind map (Part A, Week 4) has 22 main branches and a large, detailed drawing at the centre. Using the tutorial critique and the guidelines, what is the best revision?
    options:
      - text: Fewer main branches, a centre image that does not overpower, one key word per line
        correct: true
        why: Correct — it answers the critique questions (too many branches? does the centre image take too much attention?) while keeping the guidelines.
      - text: Remove every image so that the words carry the whole map on their own
        why: Tempting as a cure for busyness, but the guidelines want a central image and images throughout; the fix is balance, not removal.
      - text: Add more branches, so that every single idea gets its own main line out from the centre
        why: Tempting because it is thorough, but the critique asks whether too many branches are distracting; more would make it worse.
      - text: Replace the map with a numbered list, which is easier for a marker to follow
        why: Tempting for readability, but Part A is a mind map, and a list is the linear note taking the lecture contrasts with mind mapping.
  - key: q717
    type: truefalse
    concept: mind-maps
    difficulty: 1
    set: quickfire
    statement: Buzan’s guidelines say to use one key word per line.
    answer: true
    why: True — "Use one key word per line", because a single word gives your mind map more power and flexibility; use upper and lower case.
  - key: q718
    type: truefalse
    concept: mind-maps
    difficulty: 2
    set: quickfire
    statement: According to Buzan’s guidelines, branches should be straight lines because they are clearer.
    answer: false
    why: False — the guidelines say make your branches curved, rather than straight lined, because straight lines are boring to your brain.
  - key: q719
    type: truefalse
    concept: mind-maps
    difficulty: 2
    statement: The guidelines say to make each line the same length as the word or image it supports.
    answer: true
    why: True — "Make the lines the same length as the word/image they support", one of the line rules alongside thicker central lines.
  - key: q720
    type: truefalse
    concept: mind-maps
    difficulty: 2
    statement: The tutorial’s windows exercise shows that we naturally think in linear lists.
    answer: false
    why: False — the exercise demonstrates how we think in radial associations; the linear list of rooms is shown as "Not This".
  - key: q721
    type: match
    concept: mind-maps
    difficulty: 2
    prompt: Match each guideline to Buzan’s reason for it.
    pairs:
      - left: Start in the centre of the page
        right: Gives your brain freedom to spread out in all directions
      - left: Use an image for the central idea
        right: An image is worth a 1000 words and helps you use your imagination
      - left: Use colours throughout
        right: Colours are as exciting to your brain as images
      - left: Make branches curved
        right: Straight lines are boring to your brain
      - left: Use one key word per line
        right: A single word gives more power and flexibility
  - key: q722
    type: short
    concept: mind-maps
    difficulty: 3
    prompt: '"Mind maps are pretty pictures, not serious business tools." Discuss this statement in a short applied essay, using Buzan’s guidelines and the tutorial critique to show how a marketing team could use a mind map to synthesise customer feedback for a product relaunch, and evaluating one limit of the technique.'
    model: |-
      The statement is wrong on the lecture's account, though it names a real risk. A mind map is a way to visually
      organise notes, thoughts, ideas and conversations, created around a single word or text in the centre. Tony Buzan
      takes the credit for modern mind mapping, and the lecture lists it as a rational « serious creativity » technique
      whose marketing usage is synthesis of information and collaborative brainstorming. It works because we think in
      radial associations, as the windows exercise shows. For the relaunch, the team would start in the centre of a
      landscape page with an image of the product, then draw connected, curved main branches for the feedback themes in
      at least three colours, with one key word per line; central lines thicker,
      thinning as they radiate out, so the main themes stand out. Built together, as business maps usually are, it links comments across branches. The limit comes from the tutorial critique: too many
      branches, images that take the focus from the words, or a centre image that takes too much attention can distract
      rather than synthesise — so the "pretty picture" risk is real, and the team must prune to key words.
    rubric:
      - id: r1
        criterion: Concept — defines a mind map and its basis.
        marks: 2
        top-band: Defines the mind map with the lecture’s wording, credits Buzan, and explains radial associations.
        margin-note: Why does a map suit how we think?
        authorities: []
      - id: r2
        criterion: Example — uses a real example from the materials.
        marks: 2
        top-band: Uses the windows exercise, the Time Management map or the student example accurately.
        margin-note: Which tutorial example shows the point?
        authorities:
          - mgmt2094-example-windows-exercise
      - id: r3
        criterion: Application — applies the guidelines to the relaunch.
        marks: 3
        top-band: Builds the feedback map step by step from the guidelines (centre image, connected curved branches, three colours, one key word, tapering lines).
        margin-note: What would the map actually look like?
        authorities:
          - mgmt2094-buzan-mind-map-guidelines
      - id: r4
        criterion: Evaluation — weighs the statement and a limit.
        marks: 3
        top-band: Rejects the statement as a whole but concedes the critique-question risks (too many branches, images over words, an overpowering centre).
        margin-note: When does a mind map stop synthesising?
        authorities: []
