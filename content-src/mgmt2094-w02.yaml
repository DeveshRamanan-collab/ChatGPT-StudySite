        why: Tempting because Synectics has a typology, but it has three types of analogy (direct, symbolic, fantasy) plus a personal approach.
      - text: Six rules for drawing a good mind map
        why: Tempting because Buzan has rules, but his guidelines number ten and have nothing to do with de Bono’s hats.
      - text: Six universal laws of technological invention, as set out in TRIZ
        why: Tempting because both are rational techniques, but laws of technological invention belong to TRIZ (Altshuller).
      - text: A means to materialise the most common reasoning attitudes
        correct: true
        why: Correct — the slide says the "six hats" are a means to materialise the most common reasoning attitudes.
