        why: Tempting because TRIZ generates avenues to explore, but the lecture presents it as a rational creativity technique, not as its example of divergent thinking.
      - text: IQ tests — deduce the consequences of each idea in turn
        why: Tempting because IQ tests appear in the same sequence of slides, but they measure deductive capacity, which the lecture ties to convergent thinking.
      - text: The idea box — reward the best ideas that staff deposit
        why: Tempting because idea boxes gather many ideas, but the lecture places them in participatory innovation, an idea-gathering technique.
  - key: q302
    type: mcq
