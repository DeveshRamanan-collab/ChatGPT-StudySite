      - text: By rewarding the best ideas deposited in a box
        why: Tempting because it rewards new thinking, but rewarded idea boxes are participatory innovation, an idea-gathering technique.
      - text: By personal identification with the situation
        why: Tempting because it breaks routine thinking, but personal identification is the personal approach in Synectics.
      - text: By identifying contradictions between physical quantities
        why: Tempting because it is the other rational technique on the slide, but contradictions between physical quantities are TRIZ.
