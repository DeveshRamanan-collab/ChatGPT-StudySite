    difficulty: 1
    stem: Under the quota method, how many ideas should you always ask for?
    options:
      - text: Exactly one, the most logical
        why: Tempting because logic feels safe, but settling for one logical solution is the "linear thinking" the quota method is designed to break.
      - text: As many as fit on one page
        why: Tempting because a page limit sounds like a mind-map rule, but the quota method sets a number — at least three — not a space.
      - text: At least ten, as in a brainstorm
        why: Tempting because brainstorming aims at as many ideas as possible, but the quota method’s floor is three, not ten.
      - text: At least three
        correct: true
        why: Correct — "Always ask at least three ideas from your team (& yourself!)"; when at least three good ideas have been found, many more are generally found.
  - key: q303
    type: mcq
