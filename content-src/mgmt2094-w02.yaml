  - slug: divergent-thinking
    title: Divergent thinking and the quota method
    visual: simulation
    visual-brief: A slider sets how many ideas the team must produce before deciding (1–6); below three the verdict reads 'linear thinking — settled for the first idea', at three or more it reads 'quota met — alternatives on the table, or refuse to decide', and the field of ideas widens as the lecture says many more generally follow.
