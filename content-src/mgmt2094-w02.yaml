    text: 'Students are asked how many windows are in their home, then draw a mind map of how they calculated it. The debrief: you most likely formed a mental picture of your home and navigated it, from inside or outside, adding windows along the way until you returned to where you started, without a calculator. You were creating associations to solve a problem. The slide contrasts this radial map with a linear list (Bedrooms 6 + Kitchen 1 + … = 16).'
    gloss: Demonstrates that we think in radial associations — the rationale for mind mapping.
    cases: []
    verify: false
  - slug: mgmt2094-example-time-management-mind-map
    title: 'Example: the Time Management mind map (tutorial critique)'
    kind: other
    text: 'A richly illustrated, hand-drawn map with "Time Management" at the centre and many branches, among them clarity, effectiveness, mind tools, delegation, work–life balance, monitoring, communication, key issues, SMART, big picture and choices. Students critique it: is it effective? Are there too many branches, is it distracting? Is the focus on the images and not the words? Does the centre image take too much attention? How could it be improved?'
    gloss: A model for critiquing a mind map against Buzan's guidelines, and the subject of the tutorial's 15-minute group exercise.
    cases: []
    verify: false
  - slug: mgmt2094-example-einstein-relativity
    title: 'Example: Einstein and the speed of light'
    kind: other
    text: 'The lecture’s first example of an important question: "Why is the speed of light the same everywhere?" led to the discovery of relativity by Einstein. The problem-identification slide also attributes to Einstein the line that with one hour to save the world he would spend 59 minutes defining the problem and one minute solving it.'
    gloss: 'Illustrates problem identification, the first step of creative problem solving: the question comes before the breakthrough.'
    cases: []
    verify: false
  - slug: mgmt2094-example-impressionism
    title: 'Example: impressionism and the use of colour'
    kind: other
    text: '"How to use colours differently?" is given as one of the essential questions that led to impressionism.'
    gloss: 'Illustrates problem identification: a movement in art traced to a question rather than to an answer.'
    cases: []
    verify: false
  - slug: mgmt2094-example-decaux
    title: 'Example: Decaux and bus stop shelters'
    kind: other
    text: '"How to make bus stop shelters viable?" is given as the question that led to the worldwide success of Decaux.'
    gloss: 'The business example of problem identification: a commercial success traced to asking the right question.'
    cases: []
    verify: false
  - slug: mgmt2094-example-lecture-creativity-tests
    title: 'Example: the lecture’s creativity tests (ambiguous drawing; uses for a door)'
    kind: other
    text: 'The lecture shows an ambiguous drawing that can be seen as a duck or a rabbit and asks: how easy was it to see both? Did it require real mental strain? The ease to flip between the two is related to creativity (Wiseman et al. 2011). It then asks students to think about a door: how many uses can you write down in one minute?'
    gloss: Shows how creativity is probed in practice, alongside the lecture’s argument that no standardised test can measure individual creativity.
    cases: []
    verify: false
  - slug: mgmt2094-example-osborne-bbdo-brainstorming
    title: 'Example: Alex Osborne (BBDO) and brainstorming'
    kind: other
    text: 'The slides credit brainstorming to Alex Osborne, president and co-founder of BBDO: in order to answer a question, generate in a meeting as many ideas as possible in a short time without exercising censorship on the participants, then analyse and prioritise ideas afterwards. Usage for marketing and sales: product ideas, solutions to a problem, names, slogans. (One slide spells the name "Alex Orborn", another "Alex Osborne".)'
    gloss: 'The model idea-gathering technique: divergent generation in a meeting, with sorting and prioritising deferred.'
    cases: []
    verify: true
  - slug: mgmt2094-example-tokugawa-idea-box
    title: 'Example: Shôgun Tokugawa Yoshimune’s idea box (1721)'
    kind: other
    text: In 1721 the best ideas deposited in an "idea box" (meyasu bako) were rewarded. The slide places it at the start of participatory innovation, followed by Japanese quality circles and Kaizen in the seventies, idea management software in the 2000s and idea crowdsourcing in the 2010s.
    gloss: 'The earliest example of participatory innovation: collecting ideas from many people and rewarding the best.'
    cases: []
    verify: false
  - slug: mgmt2094-example-idea-crowdsourcing
    title: 'Example: idea crowdsourcing platforms (Crossing, YourEncore, CrowdSpirit, InnoCentive)'
    kind: other
    text: In the 2010s companies began seeking new ideas outside with idea crowdsourcing, through platforms the slide names as Crossing, YourEncore, CrowdSpirit and InnoCentive.
    gloss: Shows idea gathering moving beyond the organisation; crowdsourcing sits in the idea-gathering family.
    cases: []
    verify: false
  - slug: mgmt2094-example-altshuller-triz
    title: 'Example: Genrich Altshuller and TRIZ'
    kind: other
    text: Altshuller discovers universal laws of technological invention; each solves a contradiction between physical quantities. To innovate, one identifies contradictions, then applies these laws, which provide avenues to explore.
    gloss: The lecture’s leading rational ("serious creativity") technique.
    cases: []
    verify: false
  - slug: mgmt2094-example-gordon-synectics
    title: 'Example: William Gordon — Synectics'
    kind: other
    text: 'Analog techniques shift the problem with analogies, and explore them. Synectics: "making the familiar strange, making the strange familiar", with three types of analogies — direct (natural: animal, plant; or graphic), symbolic (parable, metaphor) and fantasy (dream, daydream) — and a personal approach: personal identification with the situation.'
    gloss: The lecture’s example of a "non-rational" technique, in the irrational family, based on analogical reasoning.
    cases: []
    verify: false
  - slug: mgmt2094-example-hohmann-innovation-games
    title: 'Example: Luke Hohmann — innovation games'
    kind: other
    text: 'Innovation games are fun activities rather than games: they aim to collect, organise and prioritise ideas. Usage: product roadmap, identifying growth drivers.'
    gloss: A gaming-family technique and one of the four methods useful for marketing and sales.
    cases: []
