  - key: q221
    type: short
    concept: problem-identification
    difficulty: 3
    prompt: '"Finding the right problem is as creative as solving it." Discuss this statement in a short applied essay, using one example from the lecture and applying the idea to a bank that tells its staff to "be more innovative".'
    model: |-
      The statement holds on the lecture's model. The first step of creative problem solving is to identify an interesting
      problem: find problems and identify needs.
      The lecture calls identifying meaningful problems, asking the right questions, a key characteristic of creative people,
      and the Einstein line on the slide — 59 minutes defining the problem, one minute solving it — puts most of the effort
      there. Two related qualities help: listen to the unusual, and identify consequences that make the subject essential.
      The lecture's examples are all questions: "How to make bus stop shelters viable?" led to the worldwide success of
      Decaux, just as "Why is the speed of light the same everywhere?" led to relativity. For the bank, "be more innovative"
      is not yet a problem. Staff should first listen to the unusual — complaints, workarounds, odd requests — and frame one
      need as a question before generating ideas, so that divergent thinking has a target. The trade-off is that this step
      is the hardest to assess: the lecture notes there is no standard test for the ability to formulate interesting
      problems, so the bank cannot simply screen for it and must build the habit instead.
    rubric:
      - id: r1
        criterion: Concept — defines problem identification and its place in the process.
        marks: 2
        top-band: States the step’s task (find problems, identify needs), calls it a key characteristic of creative people and names both related qualities.
        margin-note: What exactly is the first step’s task?
        authorities: []
      - id: r2
        criterion: Example — uses a real example from the materials.
        marks: 2
        top-band: Uses Decaux (or relativity or impressionism) as a question that led to a breakthrough.
        margin-note: Which question led to which outcome?
        authorities:
          - mgmt2094-example-decaux
      - id: r3
        criterion: Application — applies the step to the bank.
        marks: 3
        top-band: Turns "be more innovative" into a specific question by listening to the unusual or tracing consequences, before any ideas are generated.
        margin-note: What problem would the bank actually solve?
        authorities: []
      - id: r4
        criterion: Evaluation — identifies a limit or trade-off.
        marks: 3
        top-band: Notes that no standard test exists for formulating interesting problems, so the bank must cultivate rather than screen for it.
        margin-note: Can the bank measure this skill?
        authorities: []
  - key: q301
    type: mcq
    concept: divergent-thinking
