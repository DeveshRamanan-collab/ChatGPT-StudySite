      - text: Gaming — play and improvisation
        why: Tempting because mind maps can feel playful, but the gaming family holds frame games, improvisation, innovation games and constructions.
      - text: Irrational — detour and analogy
        why: Tempting because lateral thinking breaks with linear logic, but the slide keeps it in the rational family; the irrational family holds detour, Synectics and random approaches.
  - key: q502
    type: mcq
    concept: creativity-technique-families
    difficulty: 1
    stem: Who is named on the slides as the originator of TRIZ?
    options:
      - text: Edward de Bono
        why: Tempting because de Bono is in the same rational family, but he is linked to lateral thinking and the six hats.
      - text: Luke Hohmann
        why: Tempting because he is named on the techniques slide, but Hohmann is linked to innovation games, in the gaming family.
      - text: Genrich Altshuller
        correct: true
        why: Correct — the slides pair TRIZ with Genrich Altshuller, who "discovers universal laws of technological invention".
      - text: William Gordon
        why: Tempting because he founded a named method, but Gordon is linked to Synectics (analogical reasoning), a non-rational technique.
  - key: q503
    type: mcq
    concept: creativity-technique-families
    difficulty: 2
    stem: How does TRIZ work, according to the slide?
    options:
      - text: Identify contradictions, then apply laws of invention that provide avenues to explore
        correct: true
        why: Correct — each of Altshuller’s universal laws solves a contradiction between physical quantities; you identify contradictions, then apply the laws.
      - text: Distance yourself from the problem, then return to it in order to converge
        why: Tempting because it is a structured method, but stepping away and returning is the detour technique, a non-rational approach.
      - text: Introduce a random component into reasoning so as to escape linear thinking
        why: Tempting because it is another rational technique, but escaping linear thinking through randomness is lateral thinking (de Bono).
      - text: Shift the problem with analogies — direct, symbolic, fantasy — and explore them
        why: Tempting because analogies feel inventive, but analogical reasoning is Synectics (William Gordon), in the irrational family.
  - key: q504
    type: mcq
