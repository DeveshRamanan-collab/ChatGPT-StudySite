    stem: In the lecture’s map of creativity techniques, which family holds TRIZ, lateral thinking/6 hats and mindmaps?
    options:
      - text: Rational — « serious creativity »
        correct: true
        why: 'Correct — the top-left box of the techniques slide is "Rational « Serious creativity »": TRIZ (Altshuller), lateral thinking/6 hats (de Bono) and mindmaps (Buzan).'
      - text: Idea gathering — collecting many ideas
