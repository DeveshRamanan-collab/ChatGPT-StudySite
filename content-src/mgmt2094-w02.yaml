cards:
  - type: basic
    concept: creative-problem-solving-steps
    front: Name the three steps of creative problem solving, in order, with each step’s task.
    back: Identify an interesting problem (find problems, identify needs) → divergent thinking (find solutions) → convergent thinking (find « the » solution, or a good solution).
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slide 2
  - type: cloze
    concept: creative-problem-solving-steps
    text: The {{c1::prospective}} phase holds problem identification and divergent thinking; the {{c2::analytical}} phase is convergent thinking.
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slide 2
  - type: basic
    concept: creative-problem-solving-steps
    front: What does the cycle drawing of the three steps say about great advances?
    back: They are usually the result of a long process that is a sum of intuitions and successive progresses.
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slide 7
  - type: apply
    concept: creative-problem-solving-steps
    scenario: A team has twenty logo sketches and is now scoring each for cost, risk and brand fit.
    answer: 'Convergent thinking, the analytical phase: identify benefits and risks, keep the best and eliminate the rest — evaluation/selection.'
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slides 2, 6
  - type: basic
    concept: problem-identification
    front: What does the lecture call a key characteristic of creative people?
    back: Identifying meaningful problems, asking the right questions.
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slide 3
  - type: cloze
    concept: problem-identification
    text: '"If I had one hour to save the world, I would spend {{c1::59 minutes}} defining the problem and {{c2::one minute}} solving it" (attributed on the slide to Einstein).'
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slide 3
  - type: basic
    concept: problem-identification
    front: The two related qualities of problem identification?
    back: Listen to the unusual; identify consequences that make the subject essential.
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slide 4
  - type: basic
    concept: problem-identification
    front: Three important questions — and where each led.
    back: Why is the speed of light the same everywhere? → relativity (Einstein). How to use colours differently? → impressionism. How to make bus stop shelters viable? → the worldwide success of Decaux.
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slide 4
  - type: apply
    concept: problem-identification
    scenario: A gym chain is told to "innovate" and starts listing new class ideas straight away.
    answer: 'It has skipped step one: first find the problem and identify needs, framed as a question (as Decaux asked how to make bus stop shelters viable), before generating solutions.'
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slides 3–4
  - type: basic
    concept: divergent-thinking
    front: What is the quota method?
    back: 'Always ask at least three ideas from your team (& yourself!): different options, alternate solutions — or refuse to decide. When at least three good ideas have been found, many more are generally found.'
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slide 5
  - type: cloze
    concept: divergent-thinking
    text: The quota method breaks the "linear thinking" propensity to {{c1::settle for the first idea}} and to {{c2::logical reasoning that locks you in the first solution}}.
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slide 5
  - type: apply
    concept: divergent-thinking
    scenario: A manager wants to approve the first pricing idea raised at today’s meeting.
    answer: 'Linear thinking. Apply the quota: ask for at least three options (different options, alternate solutions) — or refuse to decide today.'
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slide 5
  - type: basic
    concept: divergent-thinking
    front: How does brainstorming put divergent thinking into a meeting?
    back: Generate as many ideas as possible in a short time without exercising censorship on the participants; analyse and prioritise ideas afterwards.
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slide 10
  - type: basic
    concept: measuring-creativity
    front: Why can’t we create a standardised test measuring individual creativity? (three reasons)
    back: Creativity is a process; creativity is often a group phenomenon; creativity implies domain knowledge.
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slide 8
  - type: cloze
    concept: measuring-creativity
    text: 'Testing by step: problem formulation — {{c1::no standard test}}; divergent thinking — tests produce {{c2::mixed results}}; convergent thinking — {{c3::IQ tests}} and emotional intelligence.'
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slide 8
  - type: basic
    concept: measuring-creativity
    front: What do IQ tests measure, according to the convergent-thinking slide?
    back: 'Deductive capacity: deduce the consequences.'
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slide 6
  - type: basic
    concept: measuring-creativity
    front: The lecture’s creativity test with the ambiguous (duck or rabbit) drawing — what is related to creativity?
    back: 'The ease to flip between the two (Wiseman et al. 2011). The follow-up: think about a door — how many uses can you write down in one minute?'
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slides 20–21
  - type: basic
    concept: creativity-technique-families
    front: The four families of creativity techniques, with their techniques.
    back: 'Rational « serious creativity »: TRIZ, lateral thinking/6 hats, mindmaps. Gaming: frame games, improvisation, innovation games, constructions. Idea gathering: brainstorming/brainwriting/method 635/CPS, idea boxes and intranets, crowdsourcing. Irrational: detour approaches, Synectics, random approaches.'
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slide 9
  - type: basic
    concept: creativity-technique-families
    front: How does TRIZ (Genrich Altshuller) work?
    back: 'Universal laws of technological invention each solve a contradiction between physical quantities: identify contradictions, then apply the laws, which provide avenues to explore.'
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slide 11
  - type: cloze
    concept: creativity-technique-families
    text: 'Synectics: "Making the {{c1::familiar strange}}, making the {{c2::strange familiar}}" — {{c3::direct}}, symbolic and fantasy analogies, plus a personal approach.'
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slide 12
  - type: basic
    concept: creativity-technique-families
    front: Detour techniques — the two phases?
    back: 'Distanciation: distort and transform the problem into an evocation that stimulates the imagination (deformation, forced encounters, dreamlike techniques, projective graphics). Ideation: blank fuzzy ideas, push them by scanning/crossover until useful; turn ideas positive — "To make it work, it would have to…"'
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slide 12
  - type: apply
    concept: creativity-technique-families
    scenario: A marketing team must set a product roadmap and find growth drivers.
    answer: 'Innovation games (Luke Hohmann): fun activities that collect, organise and prioritise ideas — the lecture lists product roadmap and identifying growth drivers as their usage.'
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slide 13
  - type: basic
    concept: idea-gathering-techniques
    front: Participatory innovation — the timeline.
    back: '1721: rewarded idea box (meyasu bako, Shôgun Tokugawa Yoshimune) → seventies: quality circles and Kaizen → 2000s: idea management software; open procedures for collection, analysis and application of ideas → 2010s: idea crowdsourcing (Crossing, YourEncore, CrowdSpirit, InnoCentive).'
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slide 10
  - type: cloze
    concept: idea-gathering-techniques
    text: 'Brainstorming ({{c1::Alex Osborne}}, BBDO): generate as many ideas as possible in a short time without {{c2::censorship}}; {{c3::analyse and prioritise}} afterwards.'
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slides 10, 13
  - type: apply
    concept: idea-gathering-techniques
    scenario: A university wants ideas from alumni around the world to redesign its careers service.
    answer: Idea crowdsourcing — seeking new ideas outside the organisation, the 2010s step in the idea-gathering timeline.
    source: Week 2 Lecture Materials (Exploring the Creativity Problem), slide 10
  - type: basic
    concept: mind-maps
    front: What is a mind map?
    back: A way to visually organise notes, thoughts, ideas and conversations, created around a single word or text in the centre, to which associated ideas, words and concepts are added.
    source: Week 2 Tutorial Materials (Mind Mapping), slide 2
  - type: cloze
    concept: mind-maps
    text: 'Buzan: start in the {{c1::centre}} of a blank {{c2::landscape}} page; use an {{c3::image}} for the central idea; colours throughout, at least {{c4::three}}.'
    source: Week 2 Reading — Handout on Mind Map Guidelines (Buzan)
  - type: cloze
    concept: mind-maps
    text: One {{c1::key word}} per line; branches {{c2::curved}}, not straight; central lines {{c3::thicker}}, thinning as they radiate out; lines the same {{c4::length}} as their word or image.
    source: Week 2 Reading — Handout on Mind Map Guidelines (Buzan)
  - type: apply
    concept: mind-maps
    scenario: A mind map has 20 main branches and a huge, detailed drawing at the centre.
    answer: 'Ask the critique questions: too many branches — is it distracting? does the centre image take too much attention? Group into fewer main branches, one key word per line, connected and tapering from the centre.'
    source: Week 2 Tutorial Materials (Mind Mapping), slide 11
  - type: basic
    concept: mind-maps
    front: What does the windows exercise demonstrate?
    back: 'That we think in radial associations: you formed a mental picture of your home and navigated it, adding windows along the way — creating associations to solve a problem, not adding up a list.'
    source: Week 2 Tutorial Materials (Mind Mapping), slides 5–7
audio:
  title: Week 2 recap — exploring the creativity problem
  minutes: 3
  script: |-
    Week two is about exploring the creativity problem, and it starts with a model. Creative problem solving has
    three steps. First, identify an interesting problem: find problems, identify needs. Second, divergent thinking: find
    solutions. Third, convergent thinking: find the solution, or at least a good one. The first two make up the
    prospective phase; convergent thinking is the analytical phase. And it loops — great advances are usually a long
    process, a sum of intuitions and successive progresses.

    The first step is the one creative people are known for: identifying meaningful problems, asking the right questions.
    The slide gives Einstein's line — with one hour to save the world, fifty-nine minutes defining the problem — and
    Picasso's: computers are useless, they can only give answers. Two qualities help: listen to the unusual, and identify
    the consequences that make the subject essential. Three questions to remember. Why is the speed of light the same
    everywhere, which led to relativity. How to use colours differently, which led to impressionism. And how to make bus
    stop shelters viable, which led to the worldwide success of Decaux.

    For divergent thinking, the example is the quota method. Always ask at least three ideas from your team, and from
    yourself — or refuse to decide. Once three good ideas are found, many more usually follow. It breaks linear thinking:
    settling for the first idea, and logic that locks you into the first solution. Convergent thinking is the opposite
    move: weigh benefits and risks, keep the best, eliminate wrong answers.

    Why can't we test creativity? Because it's a process, it's often a group phenomenon, and it implies domain knowledge.
    IQ tests and emotional intelligence reach convergent thinking; divergent thinking tests give mixed results; and there
    is no standard test at all for formulating interesting problems.

    Then the techniques, in four families. Rational, or serious creativity: TRIZ from Altshuller, lateral thinking and
    the six hats from de Bono, and mind maps from Buzan. Gaming: frame games, improvisation, Hohmann's innovation games,
    constructions with LEGOs. Idea gathering: brainstorming — as many ideas as possible, no censorship, sort them
    afterwards — plus idea boxes, from the rewarded box of 1721 to quality circles, idea software and crowdsourcing. And
    irrational: Synectics, making the familiar strange with direct, symbolic and fantasy analogies, and detour
    techniques that step away from the problem before coming back to converge.

    Finally, mind maps. A central image, connected curved branches, at least three colours, one key word per line,
    lines thick at the centre and thinner outward. We think in radial associations — remember the windows. And the Part A
    mind map is due in Week 4.
