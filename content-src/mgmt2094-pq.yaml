      - id: r5
        criterion: Evaluation and conclusion
        marks: 3
        top-band: Shows why the route matters for the response (G+T's partnership against Allstate's acquisition) and reaches a reasoned verdict.
        margin-note: Tie the definition to a management decision.
        authorities:
