  - key: q005
    type: long
    tier: faded
    template: essay
    concept: mgmt2094-w02-problem-identification
    difficulty: 3
    timer: 40
    contrasts-with:
      - mgmt2094-w05-defining-the-problem
      - mgmt2094-w02-divergent-thinking
      - mgmt2094-w04-brainwriting-and-brainwalking
    prompt: |
      Many creativity techniques in this unit are measured in numbers of ideas. The quota method asks for at least three ideas from every team member; brainwriting with 12 participants over five rounds yields 60 ideas; the Floor Company Exercise asks for 100 new floor covering ideas in 10 minutes; and Brown and Wyatt quote Linus Pauling: "To have a good idea you must first have lots of ideas." Yet the Week 2 slides attribute to Einstein the claim that with one hour to save the world he would spend 59 minutes defining the problem and one minute solving it.

      Critically evaluate the following statement:

      "The most creative teams are simply the ones that produce the most ideas."

      In your essay, use frameworks from more than one week of the unit (for example, the three steps of creative problem solving, Markman on problem definition, the creative problem-solving process, Wallas' model, brainwriting and brainwalking, or Carmeli et al.'s fluency and originality), support your argument with real examples from the unit's materials, take a clear position, and deal with the strongest counterargument to your view. Organise your answer under the headings Thesis, Argument, Counterargument and Evaluation.
    given:
      thesis:
        - The statement is right — quantity drives quality, so the team with the most ideas is the most creative, provided judgement is deferred.
        - The statement is wrong — creativity starts with identifying an interesting problem and ends with convergence and verification, so the most ideas on the wrong problem, or never selected, is not the most creative output.
        - The statement is half right — fluency matters in the divergent step, but "simply" ignores problem finding, originality and convergence, which decide whether many ideas become a good one.
      authorities:
        - Three steps of creative problem solving (Week 2) — identify an interesting problem, divergent thinking, convergent thinking; prospective and analytical phases; the quota method; Einstein's 59 minutes; relativity, impressionism and Decaux as important questions.
        - Markman (2017) — the problem statement is the cue to memory; Dyson's "separate the dirt from the air"; find more descriptions of the box.
        - Creative problem-solving process (Week 5) — objective, fact, problem, idea, solution and acceptance finding; Wallas' Verification and Poincaré's "test of verification" (Sadler-Smith 2015).
        - Mattimore (2012) — brainwriting (60 ideas) and brainwalking; Brown and Wyatt (2010) — Linus Pauling, deferring judgement, Pecknold's reframed brief.
        - Carmeli, Gelbard and Reiter-Palmon (2013) — fluency (number of ideas) and originality (ideas mentioned by fewer than 1% of the sample).
    model: |
      **Thesis**

      The statement is half right. In the divergent step of creative problem solving the number of ideas does matter: quantity breaks the habit of settling for the first idea, and many of the unit's techniques are built to raise it. But "simply" is wrong. Creativity starts before divergence, with identifying an interesting problem, and finishes after it, with convergence and verification. A team that produces the most ideas about the wrong problem, or cannot choose among them, is busy rather than creative. The most creative teams produce many ideas on a well-defined problem and then select well.

      **Argument**

      *Where quantity belongs.* Week 2's creative problem solving runs in three steps: identify an interesting problem, divergent thinking (find solutions), and convergent thinking (find "the" solution, or a good solution). Divergent thinking is where numbers count. The quota method asks every team member for at least three ideas, because once three good ideas have been found many more generally follow, and because linear thinking tempts us to settle for the first idea. Mattimore's brainwriting turns 12 participants and five rounds into 60 ideas, and gets round the introvert/extrovert problem because everyone "speaks" with their pen. Brown and Wyatt's ideation space defers judgement and quotes Pauling. On this much, the statement is right.

      *Problem first.* But the first step is not about numbers. The Week 2 slide attributes to Einstein the claim that he would spend 59 minutes of an hour defining the problem; identifying meaningful problems and asking the right questions is "a key characteristic of creative people". The slide's examples are questions, not answers: "Why is the speed of light the same everywhere?" led to relativity; "How to use colours differently?" to impressionism; "How to make bus stop shelters viable?" to the worldwide success of Decaux. Markman explains why: the statement of the problem is the cue to memory. Thinking about vacuum cleaner bags reminds you of bags; describing the problem as separating the dirt from the air drops the bag and brings industrial cyclones to mind, which is how Dyson's bagless vacuum came about. A radically new solution requires a new problem statement, and the most consistently creative groups find many descriptions of the problem — not "think outside the box", but find more descriptions of the box. Kara Pecknold, asked to build a website for Rwandan weavers who had little access to computers, made progress by reframing the brief to ask what services could improve their livelihoods, not by producing more website ideas.

      *Selection and verification.* After divergence comes convergence: identifying benefits and risks, keeping the best and eliminating wrong answers. Week 5's creative problem-solving process puts objective, fact and problem finding before idea finding, and solution and acceptance finding after it. Wallas' model ends with Verification, which the lecture stresses for people who generate lots of ideas, because the problem is often matching and fitting the solutions to the problem; Poincaré warned that an inspiration felt with certainty can still fail "the test of verification".

      **Counterargument**

      The strongest defence of the statement is empirical. Carmeli, Gelbard and Reiter-Palmon measure creative performance in two dimensions, fluency (the number of ideas) and originality (highly original ideas, mentioned by fewer than 1% of the sample), and found creative problem solving related to both. Large numbers also raise the chance of an original idea: the Floor Company Exercise demands 100 ideas in 10 minutes precisely so that teams get past adding an adjective like "soft" or "blue". If more ideas tend to bring more original ideas, counting ideas is a fair proxy for creativity.

      **Evaluation**

      The evidence supports quantity as one dimension of creative performance, not as the measure of it. Carmeli et al. treat fluency and originality separately because they are different, and in their second study creative problem solving fully mediated only the link between internal knowledge sharing and originality. The Floor Company Exercise itself ends by asking teams to pick their top three ideas and report one: diverging, then converging. Week 2 adds that there is no standard test for the ability to formulate interesting problems — exactly the ability the statement leaves out.

      So the statement should be qualified. Producing many ideas is a sign of a creative team at one stage of the process. The most creative teams also spend time finding and redescribing the problem, and have the discipline to converge, verify and choose. A count of ideas measures the middle of the process; creativity is the whole of it.
    rubric:
      - id: r1
        criterion: "Thesis: a clear, arguable answer to the statement"
        marks: 3
        top-band: Accepts the role of quantity in divergence but rejects "simply", naming what the statement leaves out (problem finding, originality, convergence).
        margin-note: The word "simply" is the target.
        authorities: []
      - id: r2
        criterion: Argues with course models and frameworks, named and applied accurately
        marks: 5
        top-band: Places quantity in the divergent step of the three steps, and uses Markman, the creative problem-solving process and Wallas' Verification to show what comes before and after it.
        margin-note: Locate each framework at a point in the process.
        authorities:
          - mgmt2094-markman-2017-how-you-define-the-problem
          - mgmt2094-sadler-smith-2015-wallas-four-stage-model
      - id: r3
        criterion: Real examples from the unit's materials
        marks: 4
        top-band: Uses the slide's important questions (relativity, impressionism, Decaux), Dyson's redescribed problem, brainwriting's 60 ideas and Pecknold's reframed brief accurately.
        margin-note: The Week 2 examples are all questions — that is the point.
        authorities:
          - mgmt2094-example-einstein-relativity
          - mgmt2094-example-decaux
          - mgmt2094-example-dyson-bagless-vacuum
          - mgmt2094-mattimore-2012-brainwalking
          - mgmt2094-example-pecknold-rwanda-weavers
      - id: r4
        criterion: Counter-argument
        marks: 3
        top-band: Develops Carmeli et al.'s fluency finding and the Floor Company quota as the best case for counting ideas.
        margin-note: Use the unit's own evidence for quantity before answering it.
        authorities:
          - mgmt2094-carmeli-gelbard-reiter-palmon-2013-leadership
          - mgmt2094-example-floor-company-exercise
      - id: r5
        criterion: Evaluation and conclusion
        marks: 3
        top-band: Answers the counterargument with the fluency–originality distinction, the exercise's own convergence step and the absence of a test for problem finding, and reaches a qualified conclusion.
        margin-note: Weigh the evidence; do not just restate the thesis.
        authorities:
          - mgmt2094-carmeli-gelbard-reiter-palmon-2013-leadership
      - id: r6
        criterion: Expression, structure and Australian English
        marks: 2
        top-band: Headings mirror the argument (Thesis, Argument, Counterargument, Evaluation); each paragraph makes one point; terms are used consistently; every example is introduced with its source; Australian English.
        margin-note: Use "divergent" and "convergent" in their Week 2 senses.
        authorities: []
  - key: q006
    type: long
    tier: faded
    template: essay
    concept: mgmt2094-w04-six-thinking-hats
    difficulty: 3
    timer: 40
    contrasts-with:
      - mgmt2094-w04-parallel-thinking
      - mgmt2094-w03-four-rules-of-design-thinking
      - mgmt2094-w09-dmedi-design-process
    prompt: |
      Edward de Bono's six thinking hats divide thinking into six directions — blue for control, white for facts, yellow for benefits, green for new ideas, red for feelings, black for caution — and ask a group to think in parallel, one direction at a time, with a facilitator in the blue hat opening and closing the session. The lecturer conceded that coloured hats can look silly at first glance; Kivunja (2015) quotes de Bono's reply that "simple methods used effectively are more valuable than complicated methods that are difficult to understand and confusing to use". Against such methods stands Meinel and Leifer's ambiguity rule: there is "no chance for 'chance discovery' if the box is closed tightly, the constraints enumerated excessively and the fear of failure is always at hand".

      Critically evaluate the following statement:

      "Structured thinking tools such as the six thinking hats constrain creativity rather than release it."

      In your essay, explain how the six hats are meant to work, and use at least one other framework from a different week of the unit (for example, the linear-thinking trap, brainwriting and brainwalking, the rules of design thinking, the families of creativity techniques, or Design for Six Sigma). Support your argument with real examples from the unit's materials, take a clear position, and deal with the strongest counterargument to your view. Organise your answer under the headings Thesis, Argument, Counterargument and Evaluation.
    given:
      thesis:
        - The statement is right — any imposed structure narrows thinking, and creativity needs ambiguity and freedom.
        - The statement is wrong — the hats release creativity by separating idea generation from judgement, giving every person a voice and escaping the linear-thinking trap.
        - The statement depends on use — structure releases creativity when it is light, flexible and owned by the group, and constrains it when it is applied as a fixed procedure.
      authorities:
        - De Bono's six thinking hats (Week 4) — parallel thinking as an alternative to argument; the blue-hat facilitator; hats as directions, not categories of people; usage rules (any hat, any sequence, short time); benefits (common language, removal of ego, focus).
        - Kivunja (2015) — de Bono's three difficulties (emotions, helplessness, confusion); no set sequence; several hats often used at once.
        - de Langhe, Puntoni and Larrick (2017) — linear thinking in a nonlinear world; the fleet MPG problem.
        - Mattimore (2012) — brainwriting and brainwalking as structured divergence; brainstorming aloud lets the first idea spoken influence everyone.
        - Meinel and Leifer (2011) — the ambiguity rule; Week 2's rational ("serious creativity") and irrational technique families.
        - Dow Corning (Week 9) — Design for Six Sigma; the Explore step uses creative techniques inside a disciplined process.
    model: |
      **Thesis**

      The statement is wrong as a general claim, though it identifies a real risk. Structured tools such as the six hats are designed to release creativity, not contain it: they separate the generation of ideas from their judgement, give every member of a group a voice, and stop teams settling into the straight-line habits the unit warns against. Structure constrains creativity only when it is applied rigidly — as a fixed sequence, a label for people, or a closed box. De Bono's own rules forbid that use, so the statement criticises a misuse of the method rather than the method.

      **Argument**

      *What the hats do.* De Bono separates thinking into six directions, and the hats help a group use parallel thinking: each thinker puts thoughts forward in parallel with others' rather than attacking them. The green hat is for new ideas, with no criticism or judgement; the black hat is for risks, at a separate time. In ordinary argument, as the lecturer put it, the most extroverted people argue for their own ideas and fill the room while quieter people hold back; parallel thinking tries to give a voice to every participant, and the benefits slide lists the removal of ego and a focus on one thing at a time. De Bono's three difficulties of practical thinking, quoted by Kivunja, are emotions, helplessness ("I don't know what to do next") and confusion (trying to keep everything in mind at once). The hats answer each, by giving feelings a place, providing definite next steps and taking one direction at a time. A group that cannot be creative because it is arguing, stuck or confused is released by these rules, not constrained.

      *Structure that frees.* The same pattern recurs across the unit. Brainstorming aloud can go wrong because, once an idea is said out loud, it influences everyone else's answers. Mattimore's brainwriting adds structure — written ideas, passed sheets, four or five rounds — and the result is more ideas, faster, with introverts given equal time. Week 2 places de Bono's lateral thinking and six hats in the rational family of "serious creativity" techniques, alongside TRIZ and mind maps. And the Week 4 lecture opens with the linear-thinking trap: de Langhe, Puntoni and Larrick show that minds default to straight lines, so managers prefer the fleet upgrade from 20 to 50 MPG, which saves 300 gallons per 10,000 miles, over the upgrade from 10 to 20 MPG, which saves 500. The lecturer presents tools that make a group look from several directions as one way to avoid that trap.

      *Rules against rigidity.* The hats are deliberately flexible. Any hat can be used as often as needed; the sequence can be preset or evolving; not every hat must be used; time under each hat is generally short. Hats are directions, not categories of people — never "he's a black hat thinker". Kivunja stresses that there is no set sequence and that in normal thinking several hats are often used at once.

      **Counterargument**

      The strongest objection is design thinking's ambiguity rule. Meinel and Leifer say there is no chance for chance discovery "if the box is closed tightly, the constraints enumerated excessively and the fear of failure is always at hand". A facilitator calling "everybody put on the white hat" every few minutes may close the box: thinking is timed, sorted by colour and steered by the blue hat. Week 2 also sets the rational techniques against irrational ones — detour approaches, Synectics, random approaches — which work by distancing people from the problem, something a tidy sequence of hats does not do.

      **Evaluation**

      The objection is right about over-structure, but it does not describe the hats used as intended. The blue hat manages the process, not the content; the green hat's job is precisely to escape old ideas in order to find better ones, and the red hat gives intuition a place without any need to justify it. Kivunja's point that there is no set sequence means the box is not closed. Week 9 supplies stronger evidence that discipline and creativity can coexist. Dow Corning's Design for Six Sigma process is highly structured, yet its Explore step uses creative techniques to develop alternative concepts before selecting the best fit; its pilot, the ArmorAll Deck Protector, ran a six-factor, two-level design of experiment and produced US$40 million of revenue in 12 months.

      So the statement should be rejected, with one condition. Structured tools release creativity when they remove what stops groups thinking — argument, ego, confusion, the pull of the first idea and the straight line — and when they are used flexibly. Applied as a rigid procedure, any tool can close the box; the fault then lies in the use, not in the structure.
