cards:
  - type: basic
    concept: defining-tort-law
    front: What does the Latin word *tortum* mean, and what does this tell us about the word "tort"?
    back: "*Tortum* means \"something twisted, wrong or crooked\" — tort law deals with civil wrongs, conduct that has gone wrong between people."
    source: "Torts Topic 1 Lecture 1, slide 11"
  - type: basic
    concept: defining-tort-law
    front: What are the two things tort law's rules tell people to do?
    back: Avoid causing harm to others, and otherwise remedy the harm caused (e.g. through compensation).
    source: "Torts Topic 1 Lecture 1, slide 11"
  - type: cloze
    concept: defining-tort-law
    text: "Salmond argued tort law is a {{c1::miscellaneous collection of causes of action}}; Pollock and Winfield argued it rests on {{c2::fundamental unifying principles}}, such as duties owed by everyone to everyone."
    source: "Torts Topic 1 Lecture 1, slide 14"
  - type: basic
    concept: defining-tort-law
    front: Why is the Civil Liability Act 2002 (NSW) given as an example in the lecture?
    back: It shows how a statute can respond to a societal challenge (the price and availability of insurance) by modifying or adding to the common law of tort.
    source: "Torts Topic 1 Lecture 1, slide 15"
  - type: apply
    concept: defining-tort-law
    scenario: A student says "since tort law is mostly judge-made, statutes are basically irrelevant when answering a torts problem."
    answer: Issue — does statute affect the common law answer? Rule — statutes increasingly modify or abolish common law rules (e.g. CLA 2002 NSW). Conclusion — always check for a relevant statute before relying on the common law alone.
    source: "Torts Topic 1 Lecture 1, slides 15–16"
  - type: basic
    concept: tort-law-and-other-branches
    front: Give two differences between tort law and criminal law from the lecture's comparison table.
    back: Nature of wrong (private vs public) and main purpose (compensation vs punishment) — also action initiated by (individual vs State) and standard of proof (balance of probabilities vs beyond reasonable doubt).
    source: "Torts Topic 1 Lecture 1, slide 19"
  - type: basic
    concept: tort-law-and-other-branches
    front: What example does the lecture give of conduct that can be both a tort and a crime?
    back: Assault.
    source: "Torts Topic 1 Lecture 1, slide 18"
  - type: cloze
    concept: tort-law-and-other-branches
    text: "In tort, damages are {{c1::unliquidated}}; in contract, damages are {{c2::liquidated}}, and privity is {{c3::not relevant}} to tort but {{c4::generally required}} for contract."
    source: "Torts Topic 1 Lecture 1, slide 21"
  - type: basic
    concept: tort-law-and-other-branches
    front: Does Australia have a comprehensive human rights law at the federal level?
    back: No — the lecture states there is none at the federal level; a human rights law exists only in the ACT, Victoria and Queensland.
    source: "Torts Topic 1 Lecture 1, slide 23"
  - type: apply
    concept: tort-law-and-other-branches
    scenario: A defective product injures a buyer who bought it under a written sales contract.
    answer: Issue — can the buyer sue in both contract and tort? Rule — the same facts (product liability) can found actions in both branches, since duties in tort arise from general law, not just agreement. Conclusion — the buyer may have concurrent claims in contract and tort.
    source: "Torts Topic 1 Lecture 1, slide 20"
  - type: basic
    concept: theories-of-tort-law
    front: What is the object of awarding damages under the compensatory function of tort law?
    back: To put the victim back, so far as money can achieve it, into the position she would have been in had the wrong not happened.
    source: "Week 1 – Part 2, slide 3"
  - type: basic
    concept: theories-of-tort-law
    front: Name two law-and-economics scholars associated with the deterrence theory of tort law.
    back: Calabresi and Posner.
    source: "Week 1 – Part 2, slide 7"
  - type: cloze
    concept: theories-of-tort-law
    text: "{{c1::Corrective justice}} (Weinrib) says a wrongdoer should correct the harm by paying compensation; {{c2::distributive justice}} sees tort law as a system for spreading risks and losses across society."
    source: "Week 1 – Part 2, slides 9, 11"
  - type: basic
    concept: theories-of-tort-law
    front: What does a no-fault liability mechanism (e.g. for road accidents) require proof of, instead of fault?
    back: Causation.
    source: "Week 1 – Part 2, slide 11"
  - type: basic
    concept: theories-of-tort-law
    front: Name two things feminist critique of tort law focuses on, according to the lecture.
    back: "The concept of the reasonable person, and the valuation of women's work for calculating damages (also: the recognised types of harm)."
    source: "Week 1 – Part 2, slide 13"
  - type: apply
    concept: theories-of-tort-law
    scenario: Torres Strait Islanders sue the Commonwealth over climate policy allegedly damaging their islands (Pabai v Commonwealth of Australia (No 2)).
    answer: Issue — can tort law respond to systemic societal harms like climate change? Rule/theory — tests the compensatory/deterrence/distributive justifications for tort against a large-scale, diffuse harm. Conclusion — unsuccessful at first instance; shows current limits of tort's reach.
    source: "Torts Topic 1 Lecture 1, slide 5"
  - type: basic
    concept: vicarious-liability-intro
    front: What is the typical example of vicarious liability given in the lecture?
    back: An employer's liability for a tort committed by an employee within the course of their employment.
    source: "Week 1 – Part 2, slide 14"
  - type: cloze
    concept: vicarious-liability-intro
    text: "Fleming argues an employee is often \"a {{c1::man of straw}} without insurance\", making the {{c2::employer}} a more promising source of recompense."
    source: "Week 1 – Part 2, slide 15"
  - type: basic
    concept: vicarious-liability-intro
    front: According to Fleming, why is deterrent pressure most effective on employers rather than employees?
    back: Employers are larger units, strategically placed to reduce accidents through efficient organisation and supervision of staff, whereas employees are rarely worth suing.
    source: "Week 1 – Part 2, slide 15"
  - type: apply
    concept: vicarious-liability-intro
    scenario: A delivery driver, acting within their normal duties, negligently injures a pedestrian.
    answer: Issue — is the employer liable for the driver's tort? Rule — an employer is vicariously liable for a tort committed by an employee in the course of employment. Conclusion — the employer is likely vicariously liable, alongside the driver's own liability.
    source: "Week 1 – Part 2, slide 14"
  - type: basic
    concept: intentional-torts-classification
    front: What is the key difference between trespass and action on the case?
    back: Trespass requires a direct interference; action on the case covers indirect and consequential damage.
    source: "Week 1 – Part 2, slide 16"
  - type: basic
    concept: intentional-torts-classification
    front: List the three trespass torts named in the lecture's table.
    back: Trespass to the person (assault, battery, false imprisonment), trespass to land, and trespass to chattels/goods.
    source: "Week 1 – Part 2, slide 17"
  - type: cloze
    concept: intentional-torts-classification
    text: "The lecture's table lists {{c1::conversion}} and {{c2::detinue}} under Action on the case, not Trespass, even though both concern interference with goods."
    source: "Week 1 – Part 2, slide 17"
  - type: basic
    concept: intentional-torts-classification
    front: Why did the exact historical form of action (trespass or case) matter so much?
    back: It determined which court to approach and which form of pleading to follow.
    source: "Week 1 – Part 2, slide 18"
  - type: basic
    concept: intentional-torts-classification
    front: Name the four elements common to all forms of trespass.
    back: Voluntary act, directness/direct interference, actionable per se, and fault.
    source: "Week 1 – Part 2, slide 19"
  - type: apply
    concept: intentional-torts-classification
    scenario: A person is falsely detained by security staff without lawful authority, and separately, a person's goods are wrongly kept by another after a demand for their return.
    answer: Issue — classify each wrong. Rule — false detention is trespass to the person (false imprisonment); wrongful retention of goods after demand is detinue, an action on the case per the lecture's table. Conclusion — different checklists of elements apply to each.
    source: "Week 1 – Part 2, slide 17"
  - type: basic
    concept: trespass-voluntary-act-and-damage
    front: What kind of act must the defendant's conduct be for trespass — and what will not suffice?
    back: A "positive act" — a merely passive act will not suffice.
    source: "Week 1 – Part 2, slide 20"
  - type: cloze
    concept: trespass-voluntary-act-and-damage
    text: "Three examples of conduct that are NOT a positive act: an act during an {{c1::epileptic fit}}, an act caused by the {{c2::force of a third party}}, and an {{c3::omission}} to act."
    source: "Week 1 – Part 2, slide 20"
  - type: basic
    concept: trespass-voluntary-act-and-damage
    front: What does "actionable per se" mean for trespass?
    back: The plaintiff does not need to prove any harm or damage occurred — the direct interference itself is enough.
    source: "Week 1 – Part 2, slide 22"
  - type: basic
    concept: trespass-voluntary-act-and-damage
    front: What is the rationale behind trespass being actionable per se?
    back: To protect a person's bodily integrity, liberty and property, regardless of whether measurable loss follows.
    source: "Week 1 – Part 2, slide 22"
  - type: apply
    concept: trespass-voluntary-act-and-damage
    scenario: A defendant is violently pushed from behind by a third party and, as a result, collides with and injures the plaintiff.
    answer: Issue — was there a voluntary act by the defendant? Rule — an act caused by the force of a third party is not a positive act. Conclusion — the defendant's trespass claim element of voluntary act is unlikely to be satisfied.
    source: "Week 1 – Part 2, slide 20"
  - type: basic
    concept: trespass-directness
    front: What happened in Hutchins v Maughan, and what did the court hold?
    back: The defendant laid poisonous baits before the complainant's dogs arrived; the court held trespass did not lie, since the injury was consequential, not direct.
    source: "Week 1 – Part 2, slide 21; Casebook Topic 1"
  - type: basic
    concept: trespass-directness
    front: What does it mean to say directness is often "an issue of time"?
    back: Whether the injury followed immediately from the act, or only after a later, intervening event, decides whether it is direct (trespass) or consequential (case).
    source: "Week 1 – Part 2, slide 21"
  - type: cloze
    concept: trespass-directness
    text: "In the log-in-the-highway example, if the log hits someone as it is thrown, that is {{c1::trespass}}; if someone later trips over it lying in the road, that is {{c2::case}}."
    source: "Casebook Topic 1 (Scott v Shepherd; Leame v Bray, quoted in Hutchins v Maughan)"
  - type: basic
    concept: trespass-directness
    front: Why did the plaintiff in Williams v Milotin plead negligence rather than trespass to the person?
    back: Negligence carried a six-year limitation period, against trespass to the person's three years, and the same facts could support either cause of action.
    source: "Casebook Topic 1 (Williams v Milotin)"
  - type: apply
    concept: trespass-directness
    scenario: A gardener leaves a rake lying flat in a public path; an hour later, a jogger trips over it in the dark and is injured.
    answer: Issue — direct or consequential? Rule — injury from later tripping over an object left lying is consequential, like the log-in-the-highway example. Conclusion — likely action on the case, not trespass.
    source: "Casebook Topic 1 (Scott v Shepherd; Leame v Bray)"
  - type: basic
    concept: trespass-fault-and-onus
    front: What three mental states can satisfy the fault element of trespass?
    back: Intention, recklessness, or negligence.
    source: "Week 1 – Part 2, slide 23"
  - type: basic
    concept: trespass-fault-and-onus
    front: Is a mistake about the identity of the person touched a defence to intention in trespass?
    back: No — intention is only required as to performing the act itself, not as to who is affected; the mistake is no defence.
    source: "Week 1 – Part 2, slide 23"
  - type: cloze
    concept: trespass-fault-and-onus
    text: "In trespass, the plaintiff proves {{c1::direct interference}}; the onus then shifts to the {{c2::defendant}} to disprove fault — except for harm from use of the {{c3::highway}}, where the plaintiff must prove fault."
    source: "Week 1 – Part 2, slide 24"
  - type: basic
    concept: trespass-fault-and-onus
    front: Why does the highway exception put the onus of proving fault on the plaintiff?
    back: The public has a right to use the highway, so road users and adjoining owners must accept some risk and bear the onus themselves.
    source: "Week 1 – Part 2, slide 24"
  - type: apply
    concept: trespass-fault-and-onus
    scenario: A pedestrian is hit by a car on a public road; the driver says the plaintiff must prove fault.
    answer: Issue — who bears the onus? Rule — the highway exception reverses the usual trespass onus, putting it on the plaintiff. Conclusion — the driver is correct on the highway exception; the pedestrian must prove the driver's fault.
    source: "Week 1 – Part 2, slide 24"

audio:
  title: Week 1 recap — introduction to torts and intentional torts
  minutes: 4
  script: |
    Let's recap Week 1. Tort law comes from the Latin *tortum*, something twisted or wrong, and it deals with civil
    wrongs: avoid harming others, and if you do, remedy the harm, usually through compensation. There's a long
    debate about whether it's the "law of tort" or the "law of torts" — Salmond said it's just a miscellaneous
    list of causes of action, while Pollock and Winfield argued there's a set of unifying principles underneath it
    all. Tort law is mostly judge-made, but statutes like the Civil Liability Act 2002 in New South Wales are
    increasingly important, often responding to problems like the cost of insurance. Statutes don't replace the
    common law entirely — they modify it, abolish bits of it, and add new causes of action, so cases and statutes
    now co-exist.

    We also placed tort law next to its neighbours. Against criminal law: tort is about private wrongs and
    compensation, crime is about public wrongs and punishment, and the standards differ too — balance of
    probabilities for tort, beyond reasonable doubt for crime — though the line blurs, since something like assault
    can be both a tort and a crime. Against contract law: tort duties come from the general law and bind everyone,
    contract duties come from agreement and bind only the parties, and tort damages are unliquidated where contract
    damages are liquidated. And tort overlaps with human rights law in protecting bodily integrity, reputation and
    property, even though Australia has no comprehensive federal human rights statute.

    Then we looked at theories of tort law's role in society. The compensatory function puts the victim back in the
    position they'd have been in, money allowing — though future-earnings calculations and legal costs make that
    messy in practice. The deterrence function says liability makes people avoid the harmful conduct — Calabresi and
    Posner push this into a systemic, economic argument about efficiently allocating the cost of accidents — but
    it's genuinely unclear how well this deters individuals, and insurance might blunt it further. Weinrib's
    corrective justice says a wrongdoer should personally correct the harm they caused, resting on individual moral
    responsibility, though that can ignore the many other people and systems really involved. Distributive justice
    treats tort as a way of spreading risk and loss across society, like a no-fault road accident scheme that only
    needs proof of causation, not fault. And feminist theory asks whether tort law reflects women's experiences,
    pointing to the reasonable person standard and how women's unpaid work gets valued in damages. We also met
    vicarious liability early: an employer is liable for an employee's tort in the course of employment, and
    Fleming's reasons are that the employer profits from the enterprise, is a better source of recompense than an
    employee who's often uninsured, spreads losses through insurance and prices, and is well placed to prevent
    accidents by supervising staff.

    Finally, the elements of intentional torts. Two families developed historically: trespass, for direct
    interference with the person, property or goods, and action on the case, for indirect, consequential damage.
    All trespass claims share four elements: a voluntary, positive act — not an epileptic fit, third-party force, or
    an omission; directness — Hutchins v Maughan shows baits laid before the dogs arrived were only consequential,
    not direct, so trespass failed, because directness is really an issue of timing; being actionable per se, so no
    damage needs to be proved; and fault — intention or recklessness, which are subjective, or negligence, which is
    objective, judged by the reasonable person. Intention only needs to cover the act itself, not its consequences,
    so a mistaken touch is still intentional. The plaintiff just proves the direct interference, and the onus shifts
    to the defendant to disprove fault — except on the highway, where the plaintiff must prove fault instead,
    because road users accept some shared risk. Williams v Milotin shows all of this still has real consequences
    today, since the same accident could be pleaded as trespass or negligence, each with a different limitation
    period.
