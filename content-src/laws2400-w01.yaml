    body: |
      Scholars and judges propose theoretical justifications for tort law, descriptive (what it does) or normative
      (what it should do). The **compensatory
      function** sees tort law as putting an injured claimant back, so far as money can, into the position she
      would have been in had the wrong not occurred — though this is hard to apply in practice (miscalculating
      future earnings, high legal costs, lump-sum problems). The **deterrence function** argues liability makes
      defendants (and others) avoid the conduct in future; law-and-economics scholars such as Calabresi and Posner
      extend this systemically, arguing tort law allocates the costs of accidents to produce the most efficient
      outcome for society — though insurance may blunt this deterrent effect.

      **Corrective justice** (Weinrib) sees tort as allocating responsibility for harm: whoever wrongly harms
      another's rights must correct it by paying compensation, resting on free human agency — but this individual
      focus can ignore the many other people and systems involved in an incident (e.g. a medical negligence case).
      **Distributive justice** treats tort as a system for spreading risk and loss through society, for example
      no-fault schemes based on causation rather than fault, or losses passed to a public authority and then
      taxpayers. **Feminist theory** asks whether tort law reflects women's experiences, challenging the
      "reasonable person" standard, the valuation of women's unpaid work in damages, and which harms the law even
      recognises. *Pabai v Commonwealth of Australia (No 2)* [2025] FCA 796 illustrates tort law's contemporary
      reach as a response to societal challenges such as climate change.
  - slug: vicarious-liability-intro
    title: Introducing vicarious liability
    visual: explainer
    visual-brief: Employer and employee nodes with liability flowing from the employee's tort up to the employer, Fleming's three policy reasons as labelled arrows.
    related: [theories-of-tort-law]
    depends-on: [defining-tort-law]
    contrasts-with: []
    cases: []
    authorities: [fleming-vicarious-liability-policy-rationale]
    verify: false
    body: |
      Vicarious liability makes one person or entity liable for a tort committed by someone else — typically an
      employer for a tort committed by an employee acting within the course of their employment. The detailed
      legal tests are covered later (Topic 12), but the concept is introduced now because it recurs throughout the
      semester and connects directly to the theories of tort law's role in society.

      Professor Fleming's summary (quoted from Sappideen, Vines and Eldridge at [13.45]) gives the policy reasons:
      an employer who engages others to advance its own economic interests should fairly bear a corresponding
      liability for losses in the course of that enterprise; the employer is a more promising source of recompense
      than an employee, often "a man of straw without insurance"; and the rule spreads tort losses widely, since
      the employer can pass them on through liability insurance and higher prices. Vicarious liability also has an
      admonitory (warning) value in accident prevention: deterrent pressure works best on larger units such as
      employers, who can organise and supervise staff to reduce accidents, and because employees are rarely worth
      suing, holding the employer liable gives it an incentive to discipline wrongdoing staff.

      For the exam: vicarious liability is about who pays, not whether a tort was committed — the employee must
      still have committed a tort before the question of the employer's liability arises.
  - slug: intentional-torts-classification
    title: Classifying intentional torts — trespass and action on the case
    visual: palace
    visual-brief: A forked hallway — the trespass wing (person/land/goods) and the action-on-the-case wing (Wilkinson v Downton, malicious prosecution, conversion, detinue, negligence, nuisance…).
    related: [trespass-directness, trespass-voluntary-act-and-damage, trespass-fault-and-onus]
    depends-on: [defining-tort-law]
    contrasts-with: []
    cases: [williams-v-milotin]
    authorities: []
    verify: false
    body: |
      Historically, two families of action developed for wrongful conduct: **trespass**, for a direct interference
      with the person, property or goods, and **action on the case**, for indirect and consequential damage. What
      is now called "intentional torts" covers the trespass family: trespass to the person (assault, battery and
      false imprisonment), trespass to land, and trespass to chattels/goods. Alongside them, related actions on the
      case include intentional interference with the person (*Wilkinson v Downton*), malicious prosecution,
      conversion and detinue; and beyond intentional torts altogether there are other actions on the case such as
      negligence, nuisance, misfeasance in public office and deceit.

      The exact form of action was historically crucial because it determined which court to sue in and which
      pleading rules applied. In Australia the distinction between trespass and case still matters today, because
      different elements must be proved for each category — as *Williams v Milotin* (1957) 97 CLR 465 shows, the
      same facts (being hit by a car) can found either trespass to the person or negligence, each with its own
      elements and its own limitation period. All forms of trespass share four common elements — voluntary act,
      directness, actionable per se, and fault — considered in turn.

      For the exam: before analysing elements, first classify the wrong as trespass or action on the case, since
      that choice decides which checklist of elements applies and which limitation period runs.
  - slug: trespass-voluntary-act-and-damage
    title: Trespass — voluntary act and actionable per se
    visual: explainer
    visual-brief: A gate that only opens for a "positive act" (epileptic fit, third-party force and omission bounce off), then a second gate that opens with no proof of damage needed.
    related: [intentional-torts-classification]
    depends-on: [intentional-torts-classification]
    contrasts-with: [trespass-fault-and-onus]
    cases: []
    authorities: []
    verify: false
    body: |
      Two of the four common trespass elements are the **voluntary act** and **actionable per se**. The
      defendant's conduct must be a "positive act" — a merely passive act will not suffice. The text (p 45) gives
      examples of conduct that is not a positive act: an act during an epileptic fit, an act caused by the force of
      a third party, and a mere omission to act. If the defendant did not voluntarily perform the interfering act,
      trespass cannot be made out no matter how directly the harm followed.

      Separately, trespass is **actionable per se**: the plaintiff does not need to prove any damage or harm
      actually resulted — the interference itself is enough to found the action. The rationale is protective:
      trespass exists to protect a person's bodily integrity, liberty and property from direct interference,
      regardless of whether measurable loss follows. This contrasts with an action on the case, where the
      plaintiff must positively establish that she suffered damage as part of the cause of action.

      For the exam: always check first whether the defendant's conduct was a positive, voluntary act before
      considering directness or fault, and remember that a trespass claim does not fail just because the plaintiff
      cannot point to any measurable loss.
  - slug: trespass-directness
    title: Trespass — the directness requirement
    visual: timeline
    visual-brief: A timeline of the Hutchins baits — laid, days pass, dogs arrive and die — with the direct/consequential cut-off marked at the moment of the defendant's act.
    related: [intentional-torts-classification]
    depends-on: [intentional-torts-classification]
    contrasts-with: [trespass-fault-and-onus]
    cases: [hutchins-v-maughan, williams-v-milotin]
    authorities: []
    verify: false
    body: |
      Directness is the element that separates trespass (a direct act or interference) from action on the case (an
      indirect or consequential act). *Hutchins v Maughan* [1947] VLR 131 is the key illustration: the defendant
      laid poisonous baits on unfenced land; the complainant's dogs found them days later and died. Because the
      baits were laid before the complainant brought his dogs onto the land, the injury was not immediate but
      consequential upon an intervening event (the complainant himself bringing the dogs there), so trespass did
      not lie — the remedy lay in case. Herring CJ traced this to the old distinction in *Reynolds v
      Clarke*, *Scott v Shepherd*'s "log thrown into the highway" example, and *Leame v Bray*: if the log hits
      someone as it is thrown, that is trespass; if someone is later injured tripping over it lying in the road,
      that is merely case.

      Directness is often described as "an issue of time" — had the defendant thrown the baits directly at the
      dogs, trespass would have been made out. *Williams v Milotin* (1957) 97 CLR 465 shows the distinction still
      has bite: a pedestrian hit directly by a car could plead either trespass to the person or
      negligence (action on the case) from the same facts, and each has different elements and a different
      limitation period.

      For the exam: ask whether the plaintiff's own (or a third party's) intervening act was needed to turn the
      defendant's act into harm — if so, it is consequential, not direct.
  - slug: trespass-fault-and-onus
    title: Trespass — fault and the onus of proof
    visual: simulation
    visual-brief: A dial across intention / recklessness / negligence with the onus arrow flipping direction for the highway exception.
    related: [intentional-torts-classification]
    depends-on: [intentional-torts-classification]
    contrasts-with: [trespass-voluntary-act-and-damage, trespass-directness]
    cases: []
    authorities: []
    verify: false
    body: |
      Trespass requires fault: the defendant's direct interference must be accompanied by intention, recklessness,
      or negligence. Intention and recklessness are subjective (the defendant's own state of mind); negligence
      (failure to exercise reasonable care) is objective, judged by the standard of a reasonable person in the
      defendant's position — though negligent trespass is rare today, since such cases are now usually brought
      under the tort of negligence instead. Intention is only required as to performing the act itself, not its
      consequences: if the defendant touches someone mistakenly believing it is their partner, that still counts
      as an intentional act, and the mistake is no defence (see p 46). Recklessness applies where the consequences
      are so likely that the defendant is taken to have foreseen them — this is rare, since most trespass falls
      under intentional conduct.

      On the onus of proof, the plaintiff need only prove the direct interference occurred; the onus then shifts to
      the defendant to disprove fault, typically by proving the interference was an "inevitable accident" (see p
      43). The exception is harm arising out of use of the highway: there, the plaintiff must prove the
      defendant's fault, because the public's right to use the highway means road users and adjoining property
      owners must accept some risk and so bear the onus. In an action on the case, by contrast, the plaintiff
      always bears the onus of proving fault.

cases:
  - slug: hutchins-v-maughan
    name: Hutchins v Maughan
    citation: "[1947] VLR 131; [1947] ALR 201"
    aglc: "Hutchins v Maughan [1947] VLR 131"
    facts: |
      The defendant laid poisonous baits on unfenced land. The complainant's dogs picked the baits up some days
      later and died as a result. The complainant sued in trespass (having already lost on negligence and
      nuisance before the police magistrate).
    issue: |
      Whether the complainant's injury (the loss of his dogs) was directly/immediately occasioned by the
      defendant's act of laying the baits, or was merely consequential upon it, so that trespass would or would
      not lie.
    held: |
      Herring CJ held that trespass did not lie. The baits were laid before the complainant brought his dogs onto
      the land, so the injury was consequential upon the complainant's own subsequent act of bringing the dogs
      there, not directly or immediately occasioned by the laying of the baits.
    ratio: |
      Trespass requires the injury to be the direct and immediate result of the defendant's act; where the
      plaintiff's own intervening act is needed to produce the harm, the injury is merely consequential and belongs
      to action on the case, not trespass. Directness is often "an issue of time" — had the baits been thrown at
      the dogs (rather than laid before they arrived), trespass would have been made out.
    significance: |
      The leading illustration of the trespass/action-on-the-case distinction and the meaning of "directness",
      drawing on the historical statements in Reynolds v Clarke (1725) 93 ER 747, Scott v Shepherd (1773) 96 ER 525
      and Leame v Bray (1803) 102 ER 724.
    why-here: Used to teach the directness element that separates trespass from action on the case.
    verify: false
  - slug: williams-v-milotin
    name: Williams v Milotin
    citation: "(1957) 97 CLR 465"
    aglc: "Williams v Milotin (1957) 97 CLR 465"
    facts: |
      A boy riding his bicycle on a public street was hit by a truck driven by the defendant and injured. He sued
      for damages in negligence rather than trespass to the person. The accident occurred on 7 May 1952, but the
      action was not started until 19 July 1955 — more than three years, but less than six years, after the
      accident. Trespass to the person had a three-year limitation period; negligence (an action on the case) had
      a six-year period.
    issue: |
      Whether the plaintiff, whose facts could satisfy either trespass to the person or negligence, could choose to
      frame the claim as negligence in order to gain the benefit of the longer six-year limitation period.
    held: |
      The High Court dismissed the appeal. The plaintiff was entitled to frame the action in negligence, so the
      six-year limitation period applied, even though the same facts might also have supported a trespass claim.
    ratio: |
      The same set of facts can give rise to two distinct causes of action (trespass to the person and negligence)
      with different essential ingredients and different limitation periods; a plaintiff may choose which cause of
      action to plead, provided the elements of the chosen cause of action are proved.
    significance: |
      Confirms that the trespass/action-on-the-case distinction still has real, practical consequences (such as
      limitation periods) in modern Australian law, not merely historical interest.
    why-here: Used to show why the trespass/action-on-the-case distinction still matters today, beyond history.
    verify: false
  - slug: pabai-v-commonwealth-of-australia-no-2
    name: Pabai v Commonwealth of Australia (No 2)
    citation: "[2025] FCA 796"
    aglc: "Pabai v Commonwealth of Australia (No 2) [2025] FCA 796"
    facts: |
      Torres Strait Islanders sued the Commonwealth of Australia, claiming its inadequate climate policies caused
      rising sea levels that damaged their islands and destroyed their traditional way of life.
    issue: |
      Whether the Commonwealth's climate policy gave rise to tortious liability for the harm to the plaintiffs'
      islands and way of life. (The materials do not detail the specific legal issue argued; the case is used only
      as a contemporary illustration.)
    held: |
      Unsuccessful at first instance. An appeal was lodged in late 2025 and, as at the lecture, was being heard
      before the Full Court of the Federal Court (Mortimer CJ and Colvin and Owens JJ).
    ratio: |
      Not established in the materials — the decision was on appeal and no reasons or ratio are given in the
      lecture slides.
    significance: |
      Illustrates tort law's use — and current limits — as a tool to respond to a contemporary societal challenge
      (climate change), used to open the lecture's discussion of the theories of tort law's role in society.
    why-here: Contemporary case-in-point for the "role of tort law in society" discussion.
    verify: true

authorities:
  - slug: fleming-vicarious-liability-policy-rationale
    title: "Fleming's policy rationale for vicarious liability (quoted at Sappideen, Vines and Eldridge [13.45])"
    kind: article
    text: |
      "[A] person who employs others to advance the employer's own economic interest should, in fairness, be
      placed under a corresponding liability for losses incurred in the course of the enterprise; that the master
      is a more promising source of recompense than his servant, who is apt to be a man of straw without
      insurance; and that the rule promotes wide distribution of tort losses, the employer being a most suitable
      channel for passing them on through liability insurance and higher prices. The principle gains additional
      support for its admonitory value in accident prevention. In the first place, deterrent pressures are most
      effectively brought to bear on larger units like employers, who are in a strategic position to reduce
      accidents by efficient organisation and supervision of their staff. Secondly, the fact that employees are, as
      a rule, not worth suing because they are rarely financially responsible removes from them the spectre of tort
      liability as a deterrent of wrongful conduct. By holding the master liable, the law furnishes an incentive to
      discipline servants guilty of wrongdoing."
    gloss: |
      Employers bear vicarious liability because they profit from and control the enterprise, are better able than
      an employee to pay and to spread the loss through insurance and prices, and are best placed to prevent
      accidents by disciplining and supervising staff.
    cases: []
    verify: false

questions:
  - key: q101
    type: mcq
    set: pretest
    concept: defining-tort-law
    difficulty: 1
    stem: The word "tort" is derived from the Latin word *tortum*. What does *tortum* mean?
    options:
      - text: Something twisted, wrong or crooked
        correct: true
        why: This is the lecture's stated meaning of *tortum*, capturing the idea of conduct that has gone wrong or askew.
      - text: A promise broken between two parties
        why: Tempting because it sounds like a civil wrong, but that describes breach of contract, not the etymology of "tort".
      - text: A public offence against the state
        why: Tempting because it sounds legalistic, but that describes a crime, and is not what *tortum* means.
  - key: q102
    type: mcq
    concept: defining-tort-law
    variant-of: q101
    difficulty: 1
    stem: A classmate says "tort" literally means "compensation payment" in Latin. Is this correct?
    options:
      - text: "No — *tortum* means something twisted, wrong or crooked, not a payment"
        correct: true
        why: The lecture defines *tortum* by reference to wrongness, not to any remedy or payment.
      - text: "Yes — the Latin root directly names the remedy of compensation, since that is the usual outcome once a wrong is proven"
        why: Tempting because compensation is a common tort remedy, but that is a consequence of the wrong, not the word's meaning.
      - text: "Partly — *tortum* refers to the court that hears the claim"
        why: Tempting-sounding but invented; the lecture gives no such meaning for *tortum*.
  - key: q103
    type: mcq
    concept: defining-tort-law
    difficulty: 1
    stem: According to the lecture, what does tort law lay down rules and principles about?
    options:
      - text: How one should behave towards others, avoiding harm or otherwise remedying it
        correct: true
        why: This restates the lecture's definition of what tort law regulates.
      - text: How the state should punish offenders for breaches of public order
        why: Tempting because it sounds like law generally, but punishment of public wrongs is the role of criminal law, not tort.
      - text: How parties should draft and perform their private agreements
        why: Tempting because it sounds civil, but regulating agreed obligations between specific parties is the role of contract law.
      - text: How courts should interpret constitutional powers dividing authority between different levels of government
        why: This describes constitutional law, an unrelated body of law not discussed in this lecture.
  - key: q104
    type: mcq
    concept: defining-tort-law
    variant-of: q103
    difficulty: 2
    stem: A friend says tort law's core job is "to punish people who break moral rules". Based on the lecture's definition, what is missing from this description?
    options:
      - text: It leaves out that tort law is really about avoiding/remedying harm to others, not punishment
        correct: true
        why: The lecture frames tort law around preventing and remedying harm (often via compensation), not punishment, which is criminal law's aim.
      - text: Nothing — punishment is exactly what tort law is described as doing
        why: Tempting because "breaking rules" sounds punitive, but the lecture ties tort to harm and remedy, not punishment.
      - text: It leaves out that tort law only applies to companies, not to individuals harmed in their personal capacity
        why: Invented distinction; the lecture places no such limit on who tort law applies to.
  - key: q105
    type: mcq
    concept: defining-tort-law
    difficulty: 2
    stem: John Salmond's view of tort law was that it is best understood as which of the following?
    options:
      - text: A merely miscellaneous collection of individual causes of action
        correct: true
        why: The lecture attributes exactly this "law of torts" view to Salmond.
      - text: A single unifying principle imposing duties owed by everyone to everyone
        why: Tempting because it is a real theory discussed in the lecture, but it is attributed to Pollock and Winfield, not Salmond.
      - text: A branch of contract law dealing with implied terms
        why: Invented; Salmond's debate concerned tort's internal structure, not its relationship to contract.
  - key: q106
    type: mcq
    concept: defining-tort-law
    variant-of: q105
    difficulty: 2
    stem: Pollock and Winfield, in contrast to Salmond, argued that tort law is best understood as which of the following?
    options:
      - text: A set of fundamental principles underpinning the law, such as duties owed by everyone to everyone
        correct: true
        why: The lecture attributes exactly this "law of tort" view to Pollock and Winfield.
      - text: A miscellaneous list of unconnected causes of action, each with its own separate rules and no unifying theme running through them
        why: Tempting because it is discussed in the same slide, but this is Salmond's view, which Pollock and Winfield opposed.
      - text: A system entirely codified by statute, with no role left for judge-made law
        why: Invented; the lecture says statutes have not completely replaced or codified the common law.
      - text: A doctrine limited to injuries caused on the highway
        why: Invented and far too narrow; the highway exception belongs to the fault/onus element discussed elsewhere in the week.
  - key: q107
    type: mcq
    concept: defining-tort-law
    difficulty: 3
    stem: "Which pairing correctly matches theorist(s) to their view of tort law's structure?"
    options:
      - text: Salmond — law of torts (miscellaneous causes of action); Pollock and Winfield — law of tort (unifying principles)
        correct: true
        why: This matches the lecture's attribution of each label to the correct theorist(s).
      - text: Salmond — law of tort (unifying principles); Pollock and Winfield — law of torts (miscellaneous causes of action)
        why: Tempting reversal of the correct pairing — the lecture attributes the opposite view to each theorist.
      - text: Salmond and Pollock and Winfield both argued for the same unifying-principles view
        why: Tempting because both are cited together, but the lecture presents them as opposing views, not as agreeing.
      - text: Neither Salmond nor Pollock and Winfield addressed this debate; it originates with Weinrib
        why: Incorrect — Weinrib is cited later in the lecture for corrective justice, a different debate about tort's purpose, not its structure.
  - key: q108
    type: mcq
    concept: defining-tort-law
    difficulty: 1
    stem: In common law countries, how is tort law mainly developed, according to the lecture?
    options:
      - text: Mostly through judge-made case law, though statutes are increasingly important
        correct: true
        why: The lecture states tort law is "mostly judge-made law – so cases are critical", while noting statutes' growing role.
      - text: Entirely by statute, with courts merely applying legislated rules
        why: Tempting because statutes are discussed, but the lecture says statutes have not completely replaced the common law.
      - text: Exclusively through international treaties that each jurisdiction has formally adopted into its domestic law
        why: Invented; no treaty-based development of tort law is discussed in the lecture.
  - key: q109
    type: mcq
    concept: defining-tort-law
    difficulty: 2
    stem: Why does the lecture say statutes have "increasingly become important" in tort law?
    options:
      - text: To respond to societal challenges, such as the price and availability of insurance
        correct: true
        why: This is the exact reason the lecture gives, using the Civil Liability Act 2002 (NSW) as the example.
      - text: To completely replace the common law with a single unified code
        why: Tempting because it sounds like a natural extension, but the lecture explicitly says statutes have not codified the common law.
      - text: Because courts asked Parliament to remove their jurisdiction over tort claims and transfer it to a specialist tribunal
        why: Invented; no such request or removal of jurisdiction is mentioned.
      - text: To align Australian tort law with United States tort law
        why: Invented; no such harmonisation motive is given in the lecture.
  - key: q110
    type: mcq
    concept: defining-tort-law
    variant-of: q109
    difficulty: 2
    stem: The Civil Liability Act 2002 (NSW) is described in the lecture as an example of what?
    options:
      - text: A statute responding to a societal challenge about the price and availability of insurance
        correct: true
        why: The lecture uses the CLA as "a case in point" of exactly this kind of statute.
      - text: A statute that fully codifies the whole of NSW tort law into one code, replacing all existing case law entirely
        why: Tempting overstatement — the lecture says statutes have not completely replaced or codified the common law.
      - text: A treaty implementing international human rights obligations
        why: Invented; the CLA is a state statute about civil liability, not a treaty or human rights instrument.
  - key: q111
    type: mcq
    concept: defining-tort-law
    difficulty: 3
    stem: Which statement best captures the lecture's account of how statutes have affected the common law of tort?
    options:
      - text: They have modified or abolished some common law rules and created new causes of action, without wholly replacing or codifying it
        correct: true
        why: This is precisely the "although... not completely" formulation used in the lecture.
      - text: They have left the common law completely untouched, so it continues operating in a parallel, entirely unrelated system of rules
        why: Tempting because it preserves a role for case law, but the lecture says statutes do modify or abolish parts of the common law.
      - text: They have codified the entire common law of tort into a single national Act
        why: Tempting overstatement contradicted directly by the lecture's "have not completely replaced or codified" language.
      - text: They have abolished all intentional torts, leaving only negligence
        why: Invented and contradicted by the rest of the week, which teaches intentional torts as very much alive.
  - key: q112
    type: mcq
    concept: defining-tort-law
    difficulty: 2
    stem: The lecture describes the current relationship between cases and statutes in tort law as one of what?
    options:
      - text: Co-existence
        correct: true
        why: The lecture's own phrase is that "co-existence of cases and statutes is the current life of tort law".
      - text: Total replacement of case law by statute
        why: Tempting given the growing role of statute, but contradicted by the lecture's emphasis on ongoing co-existence.
      - text: Irrelevance of statute to case-based reasoning
        why: Tempting if you overweight the "mostly judge-made" point, but ignores the lecture's discussion of statutes' growing importance.
  - key: q113
    type: mcq
    concept: defining-tort-law
    difficulty: 2
    stem: Which of the following is listed in the lecture as one of the two broad things tort law asks people to do?
    options:
      - text: Avoid causing harm to others
        correct: true
        why: This is one of the two limbs given directly in the lecture's definition of tort law.
      - text: Maximise shareholder profit within legal limits
        why: Invented; this is a corporate-law style consideration, not part of the lecture's definition of tort law.
      - text: Report all civil disputes to a public prosecutor
        why: Invented and confuses tort with criminal procedure, where the state (not the individual) usually initiates action.
      - text: Register every civil wrong with a government tribunal before suing
        why: Invented procedural requirement with no basis in the lecture.
  - key: q114
    type: mcq
    concept: defining-tort-law
    variant-of: q113
    difficulty: 1
    stem: Besides avoiding causing harm to others, what is the other broad thing the lecture says tort law asks people to do?
    options:
