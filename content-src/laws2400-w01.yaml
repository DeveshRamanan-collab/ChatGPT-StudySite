  - key: q321
    type: short
    concept: theories-of-tort-law
    difficulty: 3
    prompt: |
      Explain the compensatory and deterrence functions of tort law, including one practical problem with each, and
      briefly contrast them with corrective justice.
    model: |
      The compensatory function treats tort law as a mechanism to put an injured claimant back, so far as money
      can, into the position she would have been in had the wrong not occurred. In practice this faces problems
      such as miscalculating a claimant's loss of future earnings, the high cost of legal fees, and difficulties
      with lump-sum payments that must estimate future loss in a single award. The deterrence function instead
      argues that making a defendant (such as an employer) pay for an accident gives them, and others in a similar
      position, an incentive to avoid causing such accidents in future; law-and-economics scholars like Calabresi
      and Posner extend this into a systemic argument that tort law allocates the costs of accidents to produce an
      efficient outcome for society. A practical problem here is that it is far from certain tort law actually
      deters individuals — the lecture's drink-driving example shows it is unclear whether the threat of paying
      compensation deters more than licence cancellation or imprisonment — and insurance may further blunt any
      deterrent effect by absorbing the cost.

      Corrective justice, associated with Weinrib, differs from both by focusing on moral responsibility rather
      than outcomes: because the defendant wrongly harmed the plaintiff's rights, fairness requires the wrongdoer
      personally to correct that wrong through compensation, resting on the idea of free human agency. Unlike the
      compensatory function's focus on the victim's position or the deterrence function's focus on future
      behaviour, corrective justice is backward-looking and relational, tying payment specifically to the
      individual who caused the harm — though this can ignore the wider systems and other people often involved in
      an incident.
    rubric:
      - id: r1
        criterion: Accurately states the compensatory function and its object (returning the claimant to their pre-wrong position)
        marks: 2
        top-band: Clear statement including "so far as money can achieve" qualifier.
        margin-note: Well stated.
        authorities: []
      - id: r2
        criterion: Gives an accurate practical problem with the compensatory function
        marks: 1
        top-band: Names a specific problem from the lecture (future earnings, legal fees, lump sum).
        margin-note: Good specific example.
        authorities: []
      - id: r3
        criterion: Accurately states the deterrence function, including its systemic/law-and-economics extension
        marks: 2
        top-band: Mentions both the individual-incentive logic and Calabresi/Posner's systemic efficiency argument.
        margin-note: Covers both levels of the theory.
        authorities: []
      - id: r4
        criterion: Gives an accurate practical problem with the deterrence function (uncertainty of effect, or insurance)
        marks: 1
        top-band: Explicitly ties the problem to the lecture's own doubt about individual deterrence or insurance.
        margin-note: Good — shows awareness of the theory's limits.
        authorities: []
      - id: r5
        criterion: Accurately contrasts corrective justice's individual-responsibility focus with the other two theories
        marks: 2
        top-band: Clearly distinguishes backward-looking moral responsibility from forward-looking deterrence and victim-position compensation.
        margin-note: Sharp, accurate contrast.
        authorities: []
  - key: q401
    type: mcq
    concept: vicarious-liability-intro
    difficulty: 1
    stem: What does "vicarious liability" mean, as introduced in the lecture?
    options:
      - text: One person or entity having liability for the conduct of another
        correct: true
        why: "Correct — vicarious liability makes one person or entity liable for another's tort, typically an employer for a tort committed by an employee within the course of employment."
      - text: A defendant being liable only for their own personal wrongdoing
        why: This describes ordinary (primary) liability, the opposite of the vicarious concept being introduced.
      - text: A court's power to reduce damages where the plaintiff was partly at fault
        why: "Wrong — reducing damages for the plaintiff's own fault concerns the plaintiff's conduct; vicarious liability is about who pays for someone else's tort, typically an employer."
