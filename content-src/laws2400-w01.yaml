      - text: Likely action on the case, because a crate (not the colleague's body) caused the injury
        why: Directness does not require bodily contact by the defendant; it asks whether the injury followed immediately from the defendant's act, which it did here.
      - text: Neither — this scenario cannot be classified without first knowing the specific terms of the worker's employment contract
        why: Employment contract terms are irrelevant to the trespass/case classification, which turns on directness of the injury, not contractual arrangements.
