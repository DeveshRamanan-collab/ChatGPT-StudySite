        why: Invented mechanism not mentioned in the Fleming quote used in the lecture.
      - text: Losses are simply written off and never recovered by anyone
        why: Contradicts the point of "distribution" — the loss is spread and recovered via insurance/prices, not written off.
  - key: q409
    type: mcq
    concept: vicarious-liability-intro
    difficulty: 3
    stem: What "admonitory value" does Fleming attribute to vicarious liability?
    options:
      - text: Deterrent pressure works best on larger units like employers, who can organise and supervise staff to reduce accidents
        correct: true
        why: This is the admonitory (warning/preventive) value Fleming attributes to the rule, quoted in the lecture.
      - text: It guarantees that no workplace accident will ever occur again
        why: Overstates the claim; Fleming argues the rule creates useful deterrent pressure, not a guarantee against future accidents.
      - text: It removes any incentive for employers to supervise their staff, since liability falls only on the individual employee
        why: This is the opposite of Fleming's point, which is that employer liability creates an incentive to supervise and discipline staff.
  - key: q410
    type: mcq
    concept: vicarious-liability-intro
    difficulty: 3
    stem: Why does Fleming say holding the employer liable gives an incentive to discipline wrongdoing employees?
    options:
      - text: Because employees are, as a rule, not worth suing, so employer liability restores a practical deterrent that direct employee liability would otherwise lack
        correct: true
        why: Fleming's reasoning is that since employees are rarely financially responsible, suing them provides little deterrent, so employer liability fills that gap by giving the employer an incentive to discipline staff.
      - text: Because employees have no legal right to be represented in vicarious liability proceedings, so an employer must act on their behalf as a matter of procedure
        why: Invented and irrelevant procedural claim not found in Fleming's quoted reasoning.
      - text: Because vicarious liability automatically terminates the employee's employment
        why: Invented consequence; the quote is about the employer's incentive to discipline, not an automatic termination rule.
  - key: q411
    type: mcq
    concept: vicarious-liability-intro
    difficulty: 3
    stem: Does an employer's vicarious liability remove the need to show the employee committed a tort at all?
    options:
      - text: "No — vicarious liability is about who pays; the employee must still have committed a tort"
        correct: true
        why: Vicarious liability attaches liability for an underlying tort to the employer; without the employee's tort there is nothing to be vicariously liable for.
      - text: "Yes — an employer can be vicariously liable even if no tort was committed by anyone"
        why: This misunderstands vicarious liability, which presupposes an underlying tort committed by the employee.
      - text: "Yes — vicarious liability replaces the tort element with a strict duty to compensate any injury at work"
        why: Overstates and mischaracterises vicarious liability as a freestanding no-fault compensation scheme rather than derivative liability for the employee's tort.
