        why: The lecture introduces Hutchins v Maughan specifically as "instructive on the issue of directness".
      - text: Williams v Milotin (1957) 97 CLR 465
        why: Williams v Milotin is used for the point that the trespass/case distinction has modern practical consequences (limitation periods), not as the primary illustration of directness itself.
      - text: Pabai v Commonwealth of Australia (No 2) [2025] FCA 796
        why: Pabai is used for the contemporary-issues discussion of tort's role in society, unrelated to the directness element.
  - key: q716
    type: mcq
    concept: trespass-directness
    difficulty: 3
    stem: How does the directness element (this concept) differ from the fault element of trespass?
    options:
      - text: Directness asks whether the injury followed immediately from the defendant's act (a question of causal sequence/timing), while fault asks about the defendant's state of mind (intention, recklessness or negligence)
        correct: true
        why: These are two of the four separate elements the lecture lists; Hutchins v Maughan turns entirely on directness/timing, without any dispute about the defendant's state of mind.
      - text: They are the same requirement — an act cannot be direct unless the defendant also intended the specific consequences that resulted from performing it in the first place
        why: Incorrect — Hutchins v Maughan shows directness can fail (baits laid before the dogs arrived) even where a defendant's underlying act (laying baits) might otherwise be shown to be intentional in some other respect.
      - text: Fault is about timing, and directness is about the defendant's mental state
        why: This reverses the two elements' actual content — directness is about timing, not the defendant's state of mind, which is what fault addresses.
  - key: q717
    type: truefalse
    set: quickfire
    concept: trespass-directness
    difficulty: 2
    statement: In Hutchins v Maughan, the court held that trespass was made out because the dogs died as a direct result of the baits.
    answer: false
    why: The court held trespass did NOT lie, because the baits were laid before the dogs arrived, making the injury consequential rather than direct.
  - key: q718
    type: truefalse
    set: quickfire
    concept: trespass-directness
    difficulty: 2
    statement: In Williams v Milotin, the High Court held that the plaintiff could not choose to plead negligence instead of trespass to the person.
    answer: false
    why: The High Court held the plaintiff was entitled to plead negligence, applying the longer six-year limitation period.
  - key: q719
    type: short
    concept: trespass-directness
    difficulty: 3
    prompt: |
      Using Hutchins v Maughan, explain what "directness" means in trespass and why the claim in that case failed.
      Briefly note why Williams v Milotin shows the distinction still matters today.
    model: |
      Directness is the element that separates trespass, which requires a direct act or interference, from an
      action on the case, which covers indirect or consequential damage. In Hutchins v Maughan, the defendant laid
      poisonous baits on unfenced land, and the complainant's dogs found and ate them some days later, dying as a
      result. Herring CJ held that trespass did not lie, because the baits were laid before the complainant brought
      his dogs onto the land: the complainant himself had to intervene, by bringing his dogs to the land, before the
      injurious consequences could occur. The injury therefore followed the act of laying the baits only
      consequentially, not immediately, and so was properly regarded as a matter for an action on the case, not
      trespass. The court traced this to the historical principle in Reynolds v Clarke and the log-in-the-highway
      example from Scott v Shepherd and Leame v Bray: if a thrown log hits someone as it lands, that is trespass;
      if someone later trips over it lying in the road, that is merely case. Directness is often "an issue of time"
      — had the defendant thrown the baits directly at the dogs, the injury would have been immediate, and trespass
      would have been made out.

      Williams v Milotin shows this distinction still matters practically today, not just historically. A boy hit
      directly by a truck sued in negligence, an action on the case, rather than trespass to the person, because
      negligence carried a six-year limitation period against trespass's three years. The High Court held the same
      facts could found either cause of action, each with different elements, and that the plaintiff was entitled
      to choose which to plead — so the trespass/case classification directly decided which limitation period, and
      ultimately whether the claim succeeded, applied.
    rubric:
      - id: r1
        criterion: Accurately defines directness and contrasts it with the indirect/consequential test for action on the case
        marks: 2
        top-band: Clear, accurate statement of both halves of the distinction.
        margin-note: Well defined.
        authorities: []
      - id: r2
        criterion: Accurately states the facts and holding of Hutchins v Maughan
        marks: 2
        top-band: Correctly explains why the baits being laid before the dogs arrived made the injury consequential.
        margin-note: Accurate application of the case.
        authorities: []
      - id: r3
        criterion: Explains the "issue of time" idea with the counterfactual (baits thrown directly at dogs = trespass)
        marks: 1
        top-band: Clearly ties timing to the direct/consequential outcome.
        margin-note: Good use of the counterfactual.
        authorities: []
      - id: r4
        criterion: Explains why Williams v Milotin shows the distinction still has modern, practical bite
        marks: 2
        top-band: Links the classification choice to the limitation period outcome specifically.
        margin-note: Strong, accurate link to limitation periods.
        authorities: []
  - key: q720
    type: mcq
    concept: trespass-directness
    difficulty: 2
    stem: Put in date order, which sequence correctly lists the historical cases quoted in Hutchins v Maughan on the directness principle, from earliest to latest?
    options:
      - text: Reynolds v Clarke (1725), Scott v Shepherd (1773), Leame v Bray (1803)
        correct: true
        why: This is the correct chronological order of the three historical cases quoted in the Hutchins v Maughan judgment.
      - text: Leame v Bray (1803), Scott v Shepherd (1773), Reynolds v Clarke (1725)
        why: This reverses the correct chronological order given in the casebook extract.
      - text: Scott v Shepherd (1773), Reynolds v Clarke (1725), Leame v Bray (1803)
        why: This is out of order — Reynolds v Clarke (1725) is the earliest of the three, not the second.
  - key: q801
    type: mcq
    concept: trespass-fault-and-onus
    difficulty: 1
    stem: Which mental states satisfy the fault element of trespass, according to the lecture?
    options:
      - text: Intention, recklessness, or negligence
        correct: true
        why: The lecture lists exactly these three mental states as capable of satisfying the fault element.
      - text: Only intention — recklessness and negligence are irrelevant to trespass
        why: Understates the rule; the lecture explicitly includes recklessness and negligence alongside intention.
      - text: Strict liability with no mental state required at all
        why: Contradicted directly — the lecture states trespass "requires fault", meaning some mental state must be shown.
  - key: q802
    type: mcq
    concept: trespass-fault-and-onus
    difficulty: 2
    stem: According to the lecture, are intention and recklessness subjective or objective states of mind?
    options:
      - text: Subjective — they consider the defendant's own actual state of mind
        correct: true
        why: The lecture states directly that "intention or recklessness are subjective states of mind ie consider defendant's own mental state".
      - text: Objective — they are judged by the standard of a reasonable person in the same position
        why: This describes negligence, which the lecture identifies as the objective standard, not intention or recklessness.
      - text: Neither — the law disregards mental state entirely for trespass
        why: Contradicted directly by the fault requirement, which depends on establishing one of these mental states.
  - key: q803
    type: mcq
    concept: trespass-fault-and-onus
    variant-of: q802
    difficulty: 2
    stem: According to the lecture, is negligence (as a form of fault in trespass) a subjective or objective state of mind?
    options:
      - text: Objective — determined by the standard of a reasonable person in the defendant's position
        correct: true
        why: The lecture states negligence "is an objective state of mind, determined by the standard of a reasonable person in the defendant's position".
      - text: Subjective — determined by what the defendant personally believed was reasonable in the circumstances
        why: This reverses the lecture's classification; subjective states of mind are intention and recklessness, not negligence.
      - text: It is not a recognised form of fault in trespass at all
        why: Contradicted — the lecture explicitly includes negligence as one of the three fault states, albeit a rare one in practice.
  - key: q804
    type: mcq
    concept: trespass-fault-and-onus
    difficulty: 3
    stem: A defendant touches someone, mistakenly believing it is their own partner. According to the lecture, does this mistake provide a defence to the intention element?
    options:
      - text: No — intention is required only as to performing the act itself, and the mistake does not negate that
        correct: true
        why: The lecture uses exactly this example to show that the mistake is no defence, because intention only concerns the act (touching), not who is touched.
      - text: Yes — any honest mistake about the identity of the person touched negates intention entirely, however the touching occurred
        why: Directly contradicted by the lecture's statement that "their mistake is not a defence".
      - text: Yes, but only if the mistake was reasonable in the circumstances
        why: Invented qualification; the lecture states plainly that the mistake is not a defence, without any reasonableness proviso.
  - key: q805
    type: mcq
    concept: trespass-fault-and-onus
    difficulty: 2
    stem: What does the lecture say intention must relate to, for the fault element of trespass to be satisfied?
    options:
      - text: The intention to create the interference (i.e. to perform the act) itself
        correct: true
        why: This is exactly how the lecture defines the scope of the intention required for trespass.
      - text: The intention to cause the specific harm that actually resulted from performing the act
        why: Overstates the requirement; the lecture's mistaken-partner example shows intention to perform the act suffices, without needing intention as to the resulting harm.
      - text: The intention to breach a specific statutory provision
        why: Invented and unrelated; the lecture's discussion of intention concerns performing the interfering act, not any statutory breach.
  - key: q806
    type: mcq
    concept: trespass-fault-and-onus
    difficulty: 2
    stem: When does recklessness arise as a form of fault, according to the lecture?
    options:
      - text: When the consequences are so likely that the defendant is taken to have foreseen them
        correct: true
        why: This is the lecture's own definition of recklessness in this context.
      - text: Whenever the defendant acted quickly without much thought about what might happen next
        why: Invented and imprecise; the lecture ties recklessness to the likelihood of foreseeable consequences, not simply acting quickly.
      - text: Only where the defendant has a prior criminal conviction
        why: Invented and irrelevant; a prior conviction plays no role in the lecture's definition of recklessness.
  - key: q807
    type: mcq
    concept: trespass-fault-and-onus
    difficulty: 2
    stem: How common does the lecture say cases of recklessness are, compared to intentional conduct, in trespass?
    options:
      - text: Recklessness is generally rare, since most cases of trespass fall under intentional conduct
        correct: true
        why: The lecture states directly that recklessness is "generally rare — most cases of trespass fall under intentional conduct".
      - text: Recklessness is the most common basis for trespass claims
        why: Contradicted directly by the lecture's statement that recklessness is rare compared to intentional conduct.
      - text: Recklessness and intention are equally common in trespass cases, occurring about as often as each other
        why: Overstates recklessness's frequency; the lecture describes it as rare relative to intentional conduct.
  - key: q808
    type: mcq
    concept: trespass-fault-and-onus
    difficulty: 3
    stem: Why does the lecture say negligent trespass is rare in practice today, even though negligence is a recognised form of fault for trespass?
    options:
      - text: Because such cases are now mostly considered under the tort of negligence instead
        correct: true
        why: The lecture states this directly as the reason negligent trespass is rare, despite being a technically available fault standard.
      - text: Because negligence has been formally abolished as a form of fault for trespass claims generally
        why: Contradicted — the lecture still lists negligence as one of the three fault states capable of satisfying trespass, just noting it is rarely invoked that way.
      - text: Because negligence can never be proved on the balance of probabilities
        why: Invented and incorrect; balance of probabilities is the standard civil standard of proof and is not the reason given for negligent trespass being rare.
  - key: q809
    type: mcq
    concept: trespass-fault-and-onus
    difficulty: 1
    stem: In a trespass claim, what must the plaintiff prove regarding fault, before the onus shifts to the defendant?
    options:
      - text: Only that the direct interference occurred
        correct: true
        why: The lecture states the plaintiff must prove only the direct interference occurred, after which the onus shifts to the defendant to disprove fault.
      - text: That the defendant acted with specific intention to cause harm
        why: Overstates the plaintiff's burden; the lecture places the burden of disproving fault (including intention) on the defendant once directness is shown, not on the plaintiff to prove intention.
      - text: That the plaintiff suffered measurable financial loss
        why: Confuses this with the actionable per se element; proof of loss is not required for trespass at all, let alone as part of proving fault.
  - key: q810
    type: mcq
    concept: trespass-fault-and-onus
    difficulty: 2
    stem: Once the plaintiff proves direct interference in a trespass claim, what happens to the onus of proving fault?
    options:
      - text: It shifts to the defendant, who must disprove fault, for example by proving the interference was an "inevitable accident"
        correct: true
        why: This is exactly the onus-shifting rule the lecture states for ordinary trespass claims.
      - text: It disappears entirely — fault no longer needs to be addressed by either party once directness has been shown
        why: Incorrect — fault must still be addressed; the onus simply shifts to the defendant to disprove it, rather than vanishing.
      - text: It remains with the plaintiff throughout, as in an action on the case
        why: This describes the action-on-the-case rule, which the lecture explicitly contrasts with the trespass rule of onus-shifting.
  - key: q811
    type: mcq
    concept: trespass-fault-and-onus
    difficulty: 3
    stem: What is the exception to the general onus-shifting rule in trespass, according to the lecture?
    options:
      - text: Harm arising out of the use of the highway, where the plaintiff must prove the defendant's fault
        correct: true
        why: The lecture names this exception explicitly, reversing the usual onus for highway-related trespass harm.
      - text: Harm occurring on the defendant's own private property rather than on a public road or footpath
        why: Invented; the exception named in the lecture concerns highway use, not location on private property generally.
      - text: Harm caused by a corporation rather than an individual
        why: Invented; the lecture draws no distinction between corporate and individual defendants for the onus rule.
  - key: q812
    type: mcq
    concept: trespass-fault-and-onus
    variant-of: q811
    difficulty: 3
    stem: What reason does the lecture give for the highway exception to the onus-shifting rule?
    options:
      - text: The public has a right to use the highway, so road users and adjoining property owners must accept some risk and therefore bear the onus of proof
        correct: true
        why: This is the exact rationale given in the lecture, drawn from the public-interest reasoning at p 43 of the text.
      - text: Highways are considered too dangerous for any trespass claim to ever succeed against a road user or adjoining owner
        why: Overstates the point; the exception changes who bears the onus, it does not prevent a trespass claim from ever succeeding on the highway.
      - text: Local councils indemnify all highway users against trespass claims
        why: Invented; no such indemnity arrangement is mentioned in the lecture.
  - key: q813
    type: mcq
    concept: trespass-fault-and-onus
    difficulty: 2
    stem: In an action on the case, who bears the onus of proving fault, according to the lecture?
    options:
      - text: The plaintiff, always
        correct: true
        why: The lecture states plainly that "in action on the case, the plaintiff must prove fault", with no onus-shifting rule.
      - text: The defendant, always
        why: This describes the ordinary trespass rule (subject to the highway exception), not the rule for action on the case.
      - text: Whichever party has better access to relevant evidence
        why: Invented flexible standard; the lecture states a fixed rule that the plaintiff always bears this onus in an action on the case.
  - key: q814
    type: mcq
    concept: trespass-fault-and-onus
    difficulty: 3
    stem: A pedestrian is directly hit by a car on a public road. Applying the highway exception described in the lecture, who bears the onus of proving fault?
    options:
      - text: The pedestrian (plaintiff), because harm arising out of use of the highway is an exception to the usual trespass onus-shifting rule
        correct: true
        why: The lecture specifically carves out highway-related harm as an exception, requiring the plaintiff to prove the defendant's fault rather than the defendant disproving it.
      - text: The driver (defendant), applying the ordinary trespass rule with no exception for harm on a public road
        why: This ignores the highway exception, which the lecture specifically applies to harm from use of the highway, reversing the usual onus.
      - text: Neither party — fault is irrelevant once directness is shown
        why: Incorrect — fault must still be established for trespass; the highway exception changes who bears the onus, not whether fault matters at all.
  - key: q815
    type: mcq
    concept: trespass-fault-and-onus
    difficulty: 4
    stem: A defendant on a private driveway (not a highway) directly strikes the plaintiff with a reversing car and pleads that the plaintiff must prove the defendant's fault. Is this argument correct, based on the lecture?
    options:
      - text: "No — outside the highway exception, the plaintiff need only prove the direct interference; the onus then shifts to the defendant to disprove fault"
        correct: true
        why: The highway exception is expressly limited to harm arising from use of the highway; on a private driveway, the general trespass rule (onus shifts to the defendant) applies instead.
      - text: "Yes — the plaintiff always bears the onus of proving the defendant's fault in every trespass claim, on or off the highway"
        why: This describes the action-on-the-case rule and the highway exception, not the general trespass rule, which shifts the onus to the defendant.
      - text: "Yes, because trespass never requires proof of fault at all"
        why: Contradicted directly — trespass requires fault, it is simply the onus of proof (not the requirement itself) that shifts to the defendant outside the highway exception.
  - key: q816
    type: match
    concept: trespass-fault-and-onus
    prompt: Match each fault concept to its correct description from the lecture.
    pairs:
      - { left: "Intention", right: "Subjective; required only as to performing the act, not its consequences" }
      - { left: "Recklessness", right: "Subjective; arises where consequences are so likely the defendant is taken to have foreseen them" }
      - { left: "Negligence (as fault in trespass)", right: "Objective; judged by the standard of a reasonable person in the defendant's position" }
      - { left: "Highway exception", right: "Plaintiff, not defendant, bears the onus of proving fault" }
  - key: q817
    type: truefalse
    set: quickfire
    concept: trespass-fault-and-onus
    difficulty: 2
    statement: In an ordinary (non-highway) trespass claim, once the plaintiff proves direct interference, the onus shifts to the defendant to disprove fault.
    answer: true
    why: This matches the lecture's onus-shifting rule for trespass claims outside the highway exception.
  - key: q818
    type: truefalse
    set: quickfire
    concept: trespass-fault-and-onus
    difficulty: 2
    statement: According to the lecture, a defendant's honest but mistaken belief about who they were touching is a good defence to the intention element of trespass.
    answer: false
    why: The lecture states such a mistake is not a defence, because intention only needs to relate to performing the act itself, not the identity of the person affected.
  - key: q819
    type: short
    concept: trespass-fault-and-onus
    difficulty: 3
    prompt: |
      Explain the three forms of fault recognised in trespass and the general rule (with its exception) on who bears
      the onus of proving fault.
    model: |
      Trespass requires the defendant's direct interference to be accompanied by fault, which can take the form of
      intention, recklessness, or negligence. Intention and recklessness are subjective states of mind, assessed by
      reference to the defendant's own actual state of mind, while negligence is objective, judged by the standard
      of a reasonable person in the defendant's position. Intention is required only as to performing the
      interfering act itself, not as to its consequences: if a defendant touches someone while mistakenly believing
      it is their partner, that still counts as an intentional act, and the mistake is no defence. Recklessness
      applies where the consequences of the act are so likely that the defendant is taken to have foreseen them;
      this is rare, since most trespass falls under intentional conduct. Negligent trespass — failing to exercise
      reasonable care, resulting in interference — is also rare in practice today, because such cases are now
      mostly brought under the tort of negligence instead.

      On the onus of proof, the general rule is that the plaintiff need only prove that the direct interference
      occurred; the onus then shifts to the defendant to disprove fault, typically by showing the interference was
      an "inevitable accident". The exception is harm arising out of use of the highway: there, the plaintiff must
      prove the defendant's fault, because the public's right to use the highway means road users and adjoining
      property owners must accept some risk of harm and so should bear the onus of proving fault themselves. In an
      action on the case, by contrast, the plaintiff always bears the onus of proving fault, with no equivalent
      onus-shifting rule.
    rubric:
      - id: r1
        criterion: Accurately states all three forms of fault (intention, recklessness, negligence) and the subjective/objective distinction
        marks: 2
        top-band: Correctly classifies intention/recklessness as subjective and negligence as objective.
        margin-note: Clear and complete.
        authorities: []
      - id: r2
        criterion: Correctly explains intention is required only as to the act, with the mistaken-touch example
        marks: 1
        top-band: Uses the lecture's own example accurately.
        margin-note: Good use of the example.
        authorities: []
      - id: r3
        criterion: Correctly states the general onus-shifting rule (plaintiff proves directness; onus shifts to defendant)
        marks: 2
        top-band: Mentions the "inevitable accident" mechanism.
        margin-note: Accurate and complete.
        authorities: []
      - id: r4
        criterion: Correctly states the highway exception and its rationale
        marks: 2
        top-band: Explains the public-interest rationale (shared risk from highway use).
        margin-note: Well explained exception.
        authorities: []
  - key: q820
    type: mcq
    concept: trespass-fault-and-onus
    difficulty: 3
    stem: How does the fault element differ from the directness element when analysing a trespass problem, based on the lecture's structure?
    options:
      - text: Directness asks whether the injury followed immediately from the defendant's act; fault asks separately whether that direct act was accompanied by intention, recklessness or negligence
        correct: true
        why: These are two of the four separate elements the lecture lists — a direct act can still fail the fault element (e.g. an inevitable accident), and a faulty state of mind is irrelevant if the injury was merely consequential.
      - text: They are the same test — an act cannot be direct unless it is also accompanied by the defendant's intention, recklessness or negligence at the time
        why: Incorrect; the lecture treats directness and fault as separate elements, each requiring its own analysis, and a defendant can disprove fault (inevitable accident) even where directness is not in dispute.
      - text: Fault only matters for action on the case, never for trespass
        why: Contradicted directly — the lecture states trespass itself "requires fault", making it one of the four elements of trespass specifically.

