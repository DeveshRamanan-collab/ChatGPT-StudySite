      - text: It discourages plaintiffs from bringing claims by making them harder to prove without clear evidence of loss
        why: This is the opposite effect — removing the need to prove damage makes trespass claims easier, not harder, to bring.
      - text: It ensures only wealthy plaintiffs with provable financial loss can sue
