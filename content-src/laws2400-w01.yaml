      - text: Employees are always dishonest and untrustworthy
        why: This misreads the phrase as a character judgement rather than a comment on financial capacity to pay damages.
      - text: Employees should never be named as defendants in any proceeding, however serious the harm they caused
        why: Overstates the point; Fleming's argument is about who is a more promising source of recompense, not a bar on suing employees at all.
