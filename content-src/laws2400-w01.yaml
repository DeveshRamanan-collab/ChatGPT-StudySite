      - text: Nothing is wrong — the High Court agreed only trespass could be pleaded on these facts, since the pedestrian was hit directly and immediately by the truck itself
        why: Contradicts the outcome, where the High Court upheld the plaintiff's negligence claim and its six-year limitation period.
      - text: The argument is wrong only because the driver was not actually negligent
