  - key: q115
    type: mcq
    concept: defining-tort-law
    difficulty: 3
    stem: A student argues that because tort law is "mostly judge-made", statutes like the Civil Liability Act 2002 (NSW) are irrelevant to solving a torts problem question. What is the best response, based on the lecture?
    options:
      - text: This is wrong — statutes increasingly modify or abolish common law rules, so they must be checked alongside case law
        correct: true
