  - key: q701
    type: mcq
    set: pretest
    concept: trespass-directness
    difficulty: 1
    stem: In Hutchins v Maughan, what did the defendant do that led to the complainant's dogs dying?
    options:
      - text: Laid poisonous baits on unfenced land, which the complainant's dogs picked up some days later
        correct: true
        why: This is exactly the fact pattern given in the casebook extract of Hutchins v Maughan.
      - text: Directly threw poison at the complainant's dogs as they approached him on the unfenced land
        why: This is the counterfactual scenario the court says WOULD have amounted to trespass — it is not what actually happened on the facts.
      - text: Shot the complainant's dogs with a firearm on his own property
        why: Invented fact not found anywhere in the casebook extract of Hutchins v Maughan.
  - key: q702
    type: mcq
    concept: trespass-directness
    difficulty: 2
    stem: Why did Herring CJ hold that trespass did not lie in Hutchins v Maughan?
    options:
      - text: The baits were laid before the complainant brought his dogs onto the land, so the injury was consequential, not direct
        correct: true
        why: "This is the court's own reasoning: because the complainant's own act of bringing the dogs was needed to produce the harm, the injury was merely consequential."
      - text: The defendant had a lawful defence of necessity
        why: Invented; no defence of necessity is discussed in the Hutchins extract — the case turns on the directness of the injury, not a defence.
      - text: The complainant failed to prove the baits laid on the land were actually poisonous at the time his dogs found them
        why: Invented; the casebook extract does not suggest any dispute over whether the baits were in fact poisonous.
  - key: q703
    type: mcq
    concept: trespass-directness
    difficulty: 2
    stem: What does the lecture mean when it says directness is often "an issue of time"?
    options:
      - text: Whether the injury followed immediately from the defendant's act, or only after some further event or delay, determines whether it is direct or merely consequential
        correct: true
        why: This is exactly the point Hutchins v Maughan illustrates — the timing of the baits (laid before the dogs arrived) made the harm consequential rather than direct.
      - text: Trespass claims must be filed within 24 hours of the interference
        why: Confuses "issue of time" (about causal immediacy) with a limitation period, which is a different concept discussed via Williams v Milotin.
      - text: The court can only find trespass if the defendant acted during ordinary business hours, rather than late at night or on a weekend
        why: Invented and irrelevant; timing here refers to the causal sequence between act and injury, not the time of day.
  - key: q704
    type: mcq
    concept: trespass-directness
    difficulty: 2
    stem: According to the lecture, what would have made the outcome in Hutchins v Maughan different, turning the claim into trespass?
    options:
      - text: If the defendant had thrown the baits directly at the dogs
        correct: true
        why: The lecture states directly that had the baits been thrown at the dogs, trespass would have been made out, because the injury would then be immediate.
      - text: If the complainant had sued for a larger amount of damages
        why: The amount claimed has no bearing on whether the injury was direct or consequential.
      - text: If the land had been fenced rather than unfenced
        why: Invented; the fencing of the land is not what the court's reasoning turns on — the timing/directness of the act is decisive.
  - key: q705
    type: mcq
    concept: trespass-directness
    difficulty: 3
    stem: In the historical principle from Reynolds v Clarke (1725), quoted in Hutchins v Maughan, when does trespass lie?
    options:
      - text: Where the immediate act itself occasions a prejudice or injury to the plaintiff, as opposed to where a consequence from that act is prejudicial
        correct: true
        why: This restates the Reynolds v Clarke distinction quoted by Herring CJ in Hutchins v Maughan.
      - text: Wherever the defendant intended to cause harm, regardless of directness
        why: This conflates directness with the separate fault element; Reynolds v Clarke's distinction is about immediacy of the act, not the defendant's intention.
      - text: Only where the defendant and plaintiff are already in a contractual relationship with each other at the time of the act
        why: Invented and irrelevant; the Reynolds v Clarke principle concerns direct versus consequential injury, not contractual privity.
  - key: q706
    type: mcq
    concept: trespass-directness
    variant-of: q705
    difficulty: 3
    stem: In Scott v Shepherd (1773), Blackstone J illustrated the trespass/case distinction with which example, as recounted in Hutchins v Maughan?
    options:
