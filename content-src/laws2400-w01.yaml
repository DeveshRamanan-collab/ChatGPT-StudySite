  - key: q116
    type: mcq
    concept: defining-tort-law
    difficulty: 4
    stem: Which of the following best explains why the "law of tort" vs "law of torts" debate matters for how a torts problem question should be approached?
    options:
      - text: It signals whether you should look for one unifying principle across the facts, or instead check the separate elements of each specific named tort
        correct: true
        why: This captures the practical stakes of the Salmond vs Pollock-and-Winfield debate as framed by the lecture — a structural question about how to analyse the law, not a trivial label.
      - text: It only matters for essay questions about legal theory, never for problem questions built around a concrete set of facts
        why: Tempting because the debate sounds theoretical, but it directly affects how any set of facts should be classified and analysed, including in problem questions.
      - text: It determines which court has jurisdiction over the claim
        why: Invented; jurisdiction is not what this theoretical debate is about in the lecture.
      - text: It decides whether the claim is time-barred under a limitation statute
        why: Confuses this theoretical debate with the limitation-period issue raised later by Williams v Milotin, a different point.
  - key: q117
