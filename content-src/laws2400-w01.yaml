    body: |
      "Tort" comes from the Latin *tortum*, "something twisted, wrong or crooked". Tort law is the body of rules
      and principles for civil wrongs: it tells people how to behave towards others — avoid causing harm, and if
      harm is caused, remedy it (usually through compensation). There are several well-known individual torts,
      which raises a long-debated question: is it the "law of tort" (one set of unifying principles) or the "law of
      torts" (a list of separate causes of action)? John Salmond argued tort law is merely a collection of
      miscellaneous causes of action; Pollock and Winfield argued it rests on fundamental principles, such as
      duties owed by everyone to everyone else.

      In common law countries tort law is mostly judge-made, so cases are critical, but statutes are increasingly
      important — often responding to a societal problem such as the price and availability of insurance. The
      Civil Liability Act 2002 (NSW) is a leading example. Statutes have not replaced or codified the common law
      outright; instead they modify or abolish parts of it and create new causes of action, so cases and statutes
      now co-exist.

      For the exam: always check whether a statute (like the CLA) has modified the common law rule before applying
      it, and be ready to explain whether a problem fact pattern reflects "law of tort" style unifying principle or
      a discrete "law of torts" cause of action.
  - slug: tort-law-and-other-branches
    title: Tort law and other branches of law
    visual: diagram
    visual-brief: Three overlapping circles (tort, crime, contract) with the five contrast rows sliding into the shared zone on hover.
    related: [defining-tort-law]
    depends-on: [defining-tort-law]
    contrasts-with: []
    cases: []
    authorities: []
    verify: false
    body: |
      Tort law sits inside a wider "ecosystem" of law that regulates human behaviour and protects rights and
      interests — it is not a watertight compartment. Against **criminal law**: tort deals with private wrongs,
      criminal law with public wrongs (offences); tort's main purpose is compensation, criminal law's is
      punishment; tort aims at redress/correction, criminal law at retribution/deterrence; tort actions are
      initiated by the individual, criminal prosecutions by the State; and the standard of proof is the balance of
      probabilities in tort versus beyond reasonable doubt in crime. The line is not always sharp — the same
      conduct (e.g. assault) can be both a tort and a crime, and compensation can sometimes be obtained for
      injuries suffered from crimes.

      Against **contract law**: both deal with civil wrongs, and the same facts can found actions in both (e.g.
      product liability, contracts for services). But duties in tort arise from the general law (the "neighbour
      principle") and bind everyone, while contractual duties arise from the parties' agreement and law and bind
      only the parties (privity). Motive can matter in some torts but not in contract, and tort damages are
      unliquidated while contract damages are liquidated.

      Tort law also overlaps with **human rights law**, protecting bodily integrity, reputation and property, but
      Australia has no comprehensive federal human rights statute (only the ACT, Victoria and Queensland have
      one), so tort's role in protecting human rights remains limited.
  - slug: theories-of-tort-law
    title: Theories about the role of tort law in society
    visual: palace
    visual-brief: Five rooms, one per theory (compensation, deterrence, corrective justice, distributive justice, feminist critique), each with its one-line challenge.
