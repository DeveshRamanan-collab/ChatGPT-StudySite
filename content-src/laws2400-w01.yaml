  - key: q406
    type: mcq
    concept: vicarious-liability-intro
    difficulty: 2
    stem: According to Fleming's first policy reason (as quoted in the lecture), why should an employer bear liability for an employee's tort?
    options:
      - text: Because the employer employs others to advance its own economic interest, so should in fairness bear a corresponding liability for losses in the course of the enterprise
        correct: true
        why: This is the first reason given in the Fleming quote used in the lecture.
      - text: Because the employer is always personally at fault for the employee's conduct, having personally directed, supervised or approved exactly what the employee did at the time
        why: Vicarious liability does not require the employer's own fault — that is the point of it being "vicarious" rather than personal liability.
