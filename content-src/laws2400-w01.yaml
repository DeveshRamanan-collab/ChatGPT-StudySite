      - text: This is correct — statutes are only background reading for exams and never actually change the outcome of a real problem question
        why: Tempting if you focus only on "mostly judge-made", but the lecture stresses statutes' growing importance, including changing outcomes.
      - text: This is correct, but only for contract law problem questions, not tort
        why: Invented distinction; the lecture discusses the CLA specifically as a tort statute.
      - text: This is wrong, but only because all torts have now been fully codified by statute
