  - key: q619
    type: short
    concept: trespass-voluntary-act-and-damage
    difficulty: 2
    prompt: |
      Explain the "voluntary act" and "actionable per se" elements of trespass, using one example from the lecture
      for each.
    model: |
      Trespass requires the defendant's conduct to be a "positive act" — a merely passive act will not suffice. The
      lecture gives three examples of conduct that fails this requirement: an act performed during an epileptic
      fit, an act caused by the force of a third party (rather than the defendant's own volition), and a mere
      omission to act. If none of the defendant's own positive, voluntary conduct caused the interference, trespass
      cannot be made out, however directly the harm followed from what happened.

      Separately, trespass is "actionable per se": the plaintiff does not need to prove that any harm or damage
      actually resulted from the interference — the direct interference itself is enough to found the claim. For
      example, a plaintiff who is deliberately touched without consent, but suffers no physical injury or financial
      loss, can still succeed in trespass to the person, because the rationale for this rule is to protect a
      person's bodily integrity, liberty and property from direct interference regardless of whether measurable
      loss can be shown. This is a key contrast with an action on the case, where the plaintiff must positively
      establish that she suffered damage as part of the cause of action itself.
    rubric:
      - id: r1
        criterion: Correctly states the voluntary act requirement (positive act; passive act insufficient)
        marks: 1
        top-band: States the requirement in the lecture's own terms.
        margin-note: Correct statement.
        authorities: []
      - id: r2
        criterion: Gives an accurate example of conduct that is not a positive act
        marks: 1
        top-band: Uses one of the lecture's own examples (epileptic fit, third-party force, omission).
        margin-note: Good, accurate example.
        authorities: []
      - id: r3
        criterion: Correctly states the actionable per se rule (no proof of damage required)
        marks: 1
        top-band: States the rule accurately and links it to the rationale (protecting bodily integrity/liberty/property).
        margin-note: Clear and complete.
        authorities: []
      - id: r4
        criterion: Gives an accurate illustrative example of actionable per se in operation
        marks: 1
        top-band: Example clearly shows a claim succeeding despite no proven loss.
        margin-note: Good illustration.
        authorities: []
      - id: r5
        criterion: Notes the contrast with action on the case requiring proof of damage
        marks: 1
        top-band: Explicitly draws the contrast, not just describing trespass alone.
        margin-note: Nice contrast drawn.
        authorities: []
