        correct: true
        why: This is the exact example the casebook extract attributes to Blackstone J, later reused by Le Blanc J in Leame v Bray.
      - text: A man laying poisoned baits on his own land
        why: This describes the actual facts of Hutchins v Maughan itself, not the historical example given by Blackstone J in Scott v Shepherd.
      - text: A man striking another during a boxing match
        why: Invented example not found in the quoted historical material.
  - key: q707
    type: mcq
    concept: trespass-directness
    difficulty: 3
    stem: In the log-in-the-highway example (Scott v Shepherd / Leame v Bray), when is throwing the log a trespass, and when is it merely case?
    options:
      - text: It is trespass if the log hits someone at the moment it is thrown; it is merely case if someone is later injured by falling over the log as it lies in the road
        correct: true
        why: This is exactly the distinction the historical judges drew, quoted in Hutchins v Maughan.
      - text: It is always trespass, however and whenever the injury occurs, simply because a log was thrown by the defendant at some point
        why: Contradicts the example's whole purpose, which is to distinguish immediate impact (trespass) from later, consequential injury (case).
      - text: It is trespass only if the log causes permanent injury
        why: Invented condition; the distinction turns on immediacy of the injury, not its severity or permanence.
  - key: q708
    type: mcq
    concept: trespass-directness
    difficulty: 2
    stem: In Williams v Milotin, what was the plaintiff's cause of action, and why did he choose it?
    options:
      - text: Negligence, chosen because it carried a six-year limitation period rather than the three years applicable to trespass to the person
        correct: true
        why: "This is exactly the strategic choice described in the casebook: the plaintiff pleaded negligence because it gave him the benefit of a longer limitation period."
      - text: Trespass to the person, chosen because it had a longer six-year limitation period than the three years for negligence
        why: This reverses the actual limitation periods — trespass to the person had the shorter three-year period, not the longer one.
      - text: Malicious prosecution, chosen because the defendant had reported him to police
        why: Invented cause of action; the case concerns being hit by a truck and choosing between trespass to the person and negligence, not malicious prosecution.
  - key: q709
    type: mcq
    concept: trespass-directness
    difficulty: 2
    stem: What did the High Court decide in Williams v Milotin about pleading negligence instead of trespass to the person?
    options:
      - text: The plaintiff was entitled to plead negligence, and the six-year limitation period for that cause of action applied
        correct: true
        why: This is exactly the High Court's holding — the appeal was dismissed and the six-year period applied.
      - text: The plaintiff was not entitled to choose; the court reclassified the claim as trespass and applied the three-year period
        why: Contradicts the actual holding, which upheld the plaintiff's choice to plead negligence and the longer period.
      - text: Neither cause of action was available on these facts, so the claim failed entirely
        why: Contradicts the outcome — the appeal was dismissed, meaning the plaintiff's negligence claim succeeded procedurally on the limitation point.
  - key: q710
    type: mcq
    concept: trespass-directness
    difficulty: 3
    stem: What broader principle does Williams v Milotin establish about a single set of facts?
    options:
      - text: The same facts can give rise to two distinct causes of action, with different elements, and the plaintiff may choose which to plead
        correct: true
        why: This is the ratio the High Court articulated, distinguishing the "essential ingredients" of negligence and trespass to the person.
      - text: A plaintiff must always plead every possible cause of action arising from the same facts
        why: Overstates the principle — the case is about the plaintiff's entitlement to choose, not an obligation to plead everything.
      - text: Once a limitation period has expired for one possible cause of action, all other causes of action on the same facts are also time-barred
        why: Contradicts the actual holding, which allowed the negligence claim to proceed under its own six-year period despite the trespass period having expired.
  - key: q711
    type: mcq
    concept: trespass-directness
    difficulty: 2
    stem: What was the "essential ingredient" the High Court identified in negligence for personal injuries, distinguishing it from trespass to the person, in Williams v Milotin?
    options:
      - text: Special or particular damage (the gist of the action) and the want of due care
        correct: true
        why: The High Court's reasons state this is included in negligence's essential ingredients but not in trespass to the person.
      - text: Directness of the defendant's act
        why: Directness is common to trespass, not the distinguishing ingredient of negligence identified in this passage.
      - text: The defendant's intention to cause harm, which the lecture treats as central to establishing fault
        why: Intention is a fault element relevant to trespass, not the distinguishing "essential ingredient" of negligence discussed in this passage.
