  - slug: roberts-v-cashman
    name: Roberts v Cashman
    citation: "[2000] NSWSC 770"
    aglc: Roberts v Cashman [2000] NSWSC 770
    facts: >-
      The client's banana chair broke and she was injured; Depo Medrol injections made things worse. She joined a class
      action against Depo Medrol and filled out the law firm's questionnaire, but never had a conference (client
      interview) and was never asked about the original injury. When she found out she should have sued the chair's
      manufacturer, her claim was time-barred.
    issue: Whether the firm breached its duty of care by relying on a questionnaire and never interviewing the client.
    held: >-
      Duty of care breached (NSW Supreme Court): the firm had expertise in personal injury and product liability;
      assessment of the original injury was inherent in the Depo Medrol claim (for causation); detailed information,
      including medical records, should have been obtained to build the case; the questionnaire (three years of
      problems, significant operations, unable to work) should have put the firm on notice that a conference was called
      for; there is no different standard of conduct in class actions or mass tort litigation; and a conference was not
      impracticable or uneconomic (the client lived in Sydney).
    ratio: >-
      Clients are notoriously unreliable in giving their own history in writing; a pre-planned questionnaire is not of
      itself a sufficient discharge of the solicitor's obligation, and a solicitor who does not interview the client in
      such a situation "does so at his own peril" [64].
    significance: Shows that interviewing the client is part of a solicitor's duty of competence and diligence, not a courtesy.
    why-here: >-
      The tutorial preparation slides use it to show why a proper client interview matters — failing to conduct one can
      itself be negligent.
    verify: false
authorities: []
questions:
  - key: a01
    type: mcq
    concept: scope-of-liability-decision-flow
    difficulty: 1
    set: pretest
    stem: >-
      Under Civil Liability Act 2002 (NSW) s 5D(1), what two elements make up a determination that negligence caused
      particular harm?
    options:
      - text: Factual causation (a necessary condition) and scope of liability.
        correct: true
        why: >-
          Correct — s 5D(1)(a) is factual causation (the negligence was a necessary condition of the harm) and s
          5D(1)(b) is scope of liability (it is appropriate for liability to extend to the harm).
      - text: Duty of care and breach of duty, each assessed by foreseeability.
        why: >-
          Tempting because duty and breach are the elements that come before causation in a negligence answer, but s
          5D(1) is only about causation, and neither of its elements is duty or breach.
      - text: Remoteness of harm and new intervening acts, decided at common law.
        why: >-
          Tempting because these are the two common law concepts the flowchart puts inside scope of liability — but they
          sit within element (b); they are not the two elements of s 5D(1).
      - text: Factual causation and the plaintiff's own contributory negligence.
        why: >-
          Wrong — s 5D(1) lists factual causation and scope of liability. Contributory negligence is not one of its
          elements; the plaintiff's later negligence appears this week only as a possible break in the chain.
  - key: a02
    type: mcq
    concept: scope-of-liability-decision-flow
    difficulty: 1
    stem: Which words are the scope of liability element in CLA s 5D(1)(b)?
    options:
      - text: That the negligence was a necessary condition of the occurrence of the harm.
        why: >-
          Tempting because these are the opening words of the same subsection, but they are s 5D(1)(a), factual
          causation — the element the flowchart assumes has already been satisfied.
      - text: That it is appropriate for the scope of the negligent person's liability to extend to the harm so caused.
        correct: true
        why: >-
          Correct — this is s 5D(1)(b) word for word, the box directly under 'Scope of liability' at the top of the
          flowchart.
      - text: That, in the circumstances, a reasonable person in the person's position would have taken those precautions.
        why: >-
          Wrong — these words belong to the breach inquiry (whether a reasonable person would have taken precautions),
          not to the causation provision in s 5D.
  - key: a03
    type: mcq
    concept: scope-of-liability-decision-flow
    difficulty: 2
    stem: For the purpose of determining the scope of liability, what does s 5D(4) direct the court to consider?
    options:
      - text: Only whether the harm was a reasonably foreseeable consequence of the breach.
        why: >-
          Tempting because foreseeability drives the remoteness branch, but s 5D(4) says 'amongst other relevant things'
          and frames a different question — whether and why responsibility should be imposed.
      - text: Amongst other things, whether or not and why responsibility should be imposed on the negligent party.
        correct: true
        why: >-
          Correct — s 5D(4) requires the court to consider (amongst other relevant things) whether or not and why
          responsibility for the harm should be imposed on the negligent party.
      - text: >-
          Whether the plaintiff would still have suffered exactly the same harm if the defendant had taken reasonable
          care.
        why: >-
          Wrong — that counterfactual is the 'but for' or necessary-condition question of factual causation under s
          5D(1)(a), not the scope of liability consideration in s 5D(4).
      - text: What the plaintiff says, after the harm, about what they would have done if warned.
        why: >-
          Wrong — that is s 5D(3)(b), which makes such statements inadmissible except against interest; it belongs to
          factual causation, not to the scope of liability.
  - key: a04
    type: mcq
    concept: scope-of-liability-decision-flow
    difficulty: 2
    cases:
      - wallace-v-kam
    stem: >-
      The flowchart says scope of liability 'embraces policy-based considerations which the courts are required to
      articulate'. Which case is cited for that?
    options:
      - text: Wallace v Kam
        correct: true
        why: >-
          Correct — the flowchart cites Wallace v Kam for the policy-based considerations a court must articulate when
          deciding scope of liability under s 5D(1)(b) and (4).
      - text: Ruddock v Taylor
        why: >-
          Tempting because it is cited in the same box — but for the next proposition: that scope of liability raises
          normative questions, whether the defendant ought to be held liable.
      - text: The Oropesa
        why: >-
          Wrong — The Oropesa is cited further down, on the novus actus branch, for the test of whether a subsequent
          event is ultroneous, unwarrantable or extraneous.
      - text: Mahony v J Kruschich (Demolitions) Pty Ltd
        why: >-
          Wrong — Mahony is cited on the negligent-acts branch for the proposition that whether later negligence severs
          the chain is a matter of 'fact and degree'.
  - key: a05
    type: mcq
    concept: scope-of-liability-decision-flow
    difficulty: 2
    cases:
      - ruddock-v-taylor
    stem: For what proposition does the flowchart cite Ruddock v Taylor?
    options:
      - text: The extent of the harm and the precise manner of its occurrence need not be foreseeable.
        why: >-
          Wrong — that proposition is on the remoteness branch, supported by Hughes v Lord Advocate, Jolley, Pusey,
          Gittani Stone and Waller v James, not Ruddock v Taylor.
      - text: It raises normative questions — whether the defendant ought to be held liable.
        correct: true
        why: >-
          Correct — the flowchart: s 5D(4) 'raises normative questions, ie, whether the defendant ought to [be] held
          liable — see Ruddock v Taylor'.
      - text: A causally independent coincidence that is extremely unlikely can sever the chain.
        why: >-
          Wrong — that is the second way to sever the chain on the novus actus branch, and the flowchart cites Haber v
          Walker for it, not Ruddock v Taylor.
      - text: Negligence of a third party does not necessarily sever the chain of causation.
        why: >-
          Wrong — that is on the negligent-acts branch, supported by Mahony v J Kruschich (Demolitions) Pty Ltd and
          Burns v Pearce.
  - key: a06
    type: mcq
    concept: scope-of-liability-decision-flow
    difficulty: 1
    stem: Into which two distinct common law concepts does the flowchart say scope of liability divides?
    options:
      - text: Factual causation and the "but for" test, applied one after the other.
        why: >-
          Wrong — 'but for' is the common law test of factual causation, which is s 5D(1)(a); scope of liability is the
          separate element in s 5D(1)(b).
      - text: New intervening acts and remoteness of harm.
        correct: true
        why: >-
          Correct — the last box on the first page: 'Scope of liability raises two distinct common law concepts',
          branching to new intervening acts (novus actus interveniens) and remoteness of harm.
      - text: Breach of duty and the reasonable person's response to risk.
        why: >-
          Wrong — breach is an earlier element of negligence. The flowchart splits scope of liability into novus actus
          and remoteness, both of which assume duty, breach and factual causation.
      - text: Contributory negligence and voluntary assumption of risk.
        why: >-
          Tempting because the plaintiff's conduct can matter on the negligent-acts branch, but these are defences, not
          the two common law concepts inside scope of liability.
  - key: a07
    type: mcq
    concept: scope-of-liability-decision-flow
    difficulty: 3
    cases:
      - wallace-v-kam
    stem: >-
      A defendant whose negligence was a necessary condition of the harm argues: "The court cannot just say the harm was
      caused — it must say why I should be responsible for it." How does the flowchart treat that argument?
    options:
      - text: It fails, because once factual causation is shown the defendant is liable for all the harm that follows.
        why: >-
          Tempting because factual causation is often the hard part, but s 5D(1) makes scope of liability a separate
          element: factual causation alone does not settle liability for the harm.
      - text: It fails, because policy considerations are relevant only at the duty of care stage.
        why: >-
          Tempting because policy is familiar from duty (salient features), but the flowchart says scope of liability
          itself embraces policy-based considerations which the courts are required to articulate.
      - text: >-
          It is sound: s 5D(4) asks whether and why responsibility should be imposed, and courts must articulate the
          policy.
        correct: true
        why: >-
          Correct — s 5D(4) directs the court to consider whether or not and why responsibility should be imposed, and
          Wallace v Kam requires the policy considerations to be articulated.
  - key: a08
    type: mcq
    concept: scope-of-liability-decision-flow
    difficulty: 3
    stem: >-
      Dev negligently crashes into Ella's car. While Ella waits by the roadside, a stranger who has watched the crash
      decides, for his own reasons, to steal her handbag from the car. Ella sues Dev for the bag. Which branch of the
      scope of liability flowchart do these facts raise?
    options:
      - text: "New intervening acts: does the stranger's later act break the chain of causation?"
        correct: true
        why: >-
          Correct — 'but for' causation may be satisfied, but a later event (the theft) has an effect on the situation
          Dev created, so the question is whether it breaks the chain: the novus actus branch.
      - text: "Remoteness: was the theft of a handbag an unforeseeable kind of harm?"
        why: >-
          Tempting because the loss seems surprising, but the feature that drives the analysis is a later human act
          intervening after the negligence — that is what the novus actus branch is for.
      - text: "The egg-shell skull rule: Dev must take Ella as he finds her, bag and all."
        why: >-
          Wrong — the egg-shell skull rule concerns the plaintiff's own weaknesses, beliefs, reactions and attributes,
          not a stranger's act that occurs after the negligence.
      - text: "Factual causation only: if the theft would not have happened but for the crash, Dev is liable."
        why: >-
          Wrong — the novus actus branch starts from cases where 'but for' causation is established. Passing that test
          is the beginning of the scope question, not the end of it.
  - key: a09
    type: mcq
    concept: scope-of-liability-decision-flow
    difficulty: 3
    variant-of: a08
    stem: >-
      Fia negligently leaves a pot of boiling water on a low café bench. A toddler tugs a dangling cloth; the pot tips
      in an odd, bouncing way and scalds him far more badly than an ordinary spill would. No-one else is involved. Which
      branch of the flowchart do these facts raise?
    options:
      - text: "New intervening acts: the toddler's tug on the cloth is a later act that breaks the chain of causation."
        why: >-
          Tempting because something happened between the negligence and the scald, but a toddler pulling a cloth is
          hardly volitional human action, and the real dispute is about how and how badly he was hurt.
      - text: "Remoteness of harm: the kind of harm, and whether its extent and manner matter."
        correct: true
        why: >-
          Correct — the arguments are about an unusual manner and an unexpected extent of harm, which belong to
          remoteness: the extent and precise manner need not be foreseeable if the kind of harm was.
      - text: "Section 5D(2): an exceptional case where factual causation cannot be proved."
        why: >-
          Wrong — s 5D(2) deals with negligence that cannot be shown to be a necessary condition of the harm. Here the
          pot plainly caused the scald; the question is the scope of liability.
  - key: a10
    type: mcq
    concept: scope-of-liability-decision-flow
    difficulty: 3
    stem: How do new intervening acts and remoteness of harm relate to s 5D(1)(b)?
    options:
      - text: Novus actus belongs to factual causation; remoteness belongs to scope of liability.
        why: >-
          Tempting because novus actus starts from established 'but for' causation, but the flowchart puts both concepts
          inside scope of liability, beneath s 5D(1)(b) and (4).
      - text: Remoteness belongs to breach of duty; novus actus belongs to scope of liability.
        why: >-
          Tempting because remoteness uses reasonable foreseeability, which is also asked at breach, but the flowchart
          places remoteness on the scope of liability page with novus actus.
      - text: Both can take harm outside the scope of liability, even with factual causation satisfied.
        correct: true
        why: >-
          Correct — scope of liability raises two distinct common law concepts; either a chain-breaking later event or a
          too-remote harm can take the harm outside the scope of the negligent person's liability.
      - text: Both replace s 5D(1)(b) entirely, so a good answer need not mention the statutory words at all.
        why: >-
          Wrong — the flowchart begins with s 5D(1)(b) and s 5D(4) and only then reaches the two common law concepts; a
          good answer states the statute first.
  - key: a11
    type: mcq
    concept: scope-of-liability-decision-flow
    difficulty: 2
    cases:
      - ruddock-v-taylor
    stem: What does it mean to say that s 5D(4) raises a normative question?
    options:
      - text: It asks whether the defendant ought to be held liable.
        correct: true
        why: >-
          Correct — 'normative' concerns what ought to be. The flowchart: this raises normative questions, ie, whether
          the defendant ought to be held liable (Ruddock v Taylor).
      - text: It asks a purely historical question about the order in which events actually happened.
        why: >-
          Wrong — the sequence of events matters for factual causation and novus actus, but a normative question goes
          further and asks what responsibility should follow from them.
      - text: It asks a medical question, answered by expert evidence about what caused the injury.
        why: >-
          Tempting because causation disputes often turn on expert evidence, but that is factual causation; the
          normative question is about whether responsibility ought to be imposed.
      - text: It asks whether the defendant met the usual standard of care in the defendant's industry.
        why: >-
          Wrong — the standard of care belongs to breach of duty. Scope of liability asks whether liability ought to
          extend to the harm caused, a question of responsibility, not of standards.
  - key: a12
    type: mcq
    concept: scope-of-liability-decision-flow
    difficulty: 4
    stem: >-
      The words 'whether or not and why responsibility for the harm should be imposed on the negligent party' appear in
      which part or parts of s 5D?
    options:
      - text: Only in s 5D(4), the scope of liability provision, and nowhere else in the section.
        why: >-
          Tempting because the flowchart quotes the idea only under s 5D(4), but the Act uses the same words in s 5D(2)
          for exceptional cases of factual causation.
      - text: In both s 5D(2) (exceptional factual causation cases) and s 5D(4) (scope of liability).
        correct: true
        why: >-
          Correct — the same consideration appears twice: in s 5D(2) for an exceptional case where negligence cannot be
          shown to be a necessary condition, and in s 5D(4) for scope of liability.
      - text: Only in s 5D(1)(a), the definition of factual causation.
        why: >-
          Wrong — s 5D(1)(a) defines factual causation as the negligence being a necessary condition of the harm; it
          does not mention whether or why responsibility should be imposed.
      - text: Only in s 5D(3), which governs what the injured person would have done had there been no negligence.
        why: >-
          Wrong — s 5D(3) is about determining, subjectively, what the injured person would have done had the defendant
          not been negligent; it does not contain the responsibility words.
  - key: a13
    type: truefalse
    concept: scope-of-liability-decision-flow
    difficulty: 1
    set: quickfire
    statement: >-
      Under CLA s 5D(1)(b), scope of liability asks whether it is appropriate for the scope of the negligent person's
      liability to extend to the harm so caused.
    answer: true
    why: >-
      True — those are the words of s 5D(1)(b). Factual causation (s 5D(1)(a)) is the other element; scope of liability
      is the second, separate question.
  - key: a14
    type: truefalse
    concept: scope-of-liability-decision-flow
    difficulty: 2
    set: quickfire
    cases:
      - wallace-v-kam
      - ruddock-v-taylor
    statement: According to the flowchart, scope of liability is a purely factual inquiry that leaves no room for policy.
    answer: false
    why: >-
      False — scope of liability 'embraces policy-based considerations which the courts are required to articulate'
      (Wallace v Kam) and raises normative questions (Ruddock v Taylor).
  - key: a15
    type: truefalse
    concept: scope-of-liability-decision-flow
    difficulty: 1
    set: quickfire
    statement: "Scope of liability raises two distinct common law concepts: new intervening acts and remoteness of harm."
    answer: true
    why: >-
      True — this is the final box on the first page of the flowchart, which then branches into novus actus interveniens
      and remoteness of harm.
  - key: a16
    type: truefalse
    concept: scope-of-liability-decision-flow
    difficulty: 2
    set: quickfire
    statement: Section 5D(4) confines the court to asking whether the harm was reasonably foreseeable.
    answer: false
    why: >-
      False — s 5D(4) requires the court to consider 'amongst other relevant things' whether or not and why
      responsibility should be imposed on the negligent party; foreseeability is the remoteness test, not the limit of s
      5D(4).
  - key: b01
    type: mcq
    concept: novus-actus-volitional-acts-and-coincidences
    difficulty: 1
    set: pretest
    cases:
      - the-oropesa
    stem: Which test does the flowchart take from The Oropesa for whether a subsequent event breaks the chain of causation?
    options:
      - text: Is it ultroneous, unwarrantable, a new cause disturbing the sequence — unreasonable, extraneous or extrinsic?
        correct: true
        why: >-
          Correct — The Oropesa asks whether the subsequent event is 'ultroneous, something unwarrantable, a new cause
          which disturbs the sequence of events', unreasonable or extraneous or extrinsic.
      - text: Was the later event a necessary condition of the occurrence of the harm?
        why: >-
          Wrong — a necessary condition is the s 5D(1)(a) test of factual causation. Novus actus assumes factual
          causation is satisfied and asks whether a later event breaks the chain.
      - text: Was the later event a real risk that a reasonable person would not brush aside as far-fetched?
        why: >-
          Tempting because it is the other famous test on these pages, but it is the Wagon Mound (No 2) meaning of
          reasonable foreseeability, used on the remoteness branch.
      - text: Was the plaintiff one of a class of persons who might foreseeably be injured?
        why: >-
          Wrong — that is the duty-stage foreseeability question from week 5 (Chapman v Hearse); it does not tell you
          whether a later event breaks the chain of causation.
  - key: b02
    type: mcq
    concept: novus-actus-volitional-acts-and-coincidences
    difficulty: 1
    stem: "According to the flowchart, to sever the connection the intervening act must ordinarily be:"
    options:
      - text: any act of a third party, whether voluntary or not, done after the breach.
        why: >-
          Wrong — the flowchart lists non-volitional conduct that did not sever the chain (eg Haynes v G Harwood & Son),
          so not every later act of a third party will do.
      - text: voluntary human action, or an extremely unlikely, causally independent coincidence.
        correct: true
        why: >-
          Correct — the two ways: 'voluntary human action' (conduct which is volitional), or 'a causally independent act
          which is a coincidence which is extremely unlikely' (Haber v Walker).
      - text: an act of the plaintiff, because only the plaintiff's own conduct can break the chain.
        why: >-
          Wrong — the flowchart treats third-party acts as capable of severing the chain, and on the negligent-acts
          branch says even the plaintiff's own negligence does not necessarily sever it.
      - text: an act the defendant could reasonably have foreseen at the time of the negligence.
        why: >-
          Tempting because foreseeability runs through negligence, but the flowchart's criteria for severing are
          voluntariness or an extremely unlikely coincidence — not that the act was foreseeable.
  - key: b03
    type: mcq
    concept: novus-actus-volitional-acts-and-coincidences
    difficulty: 2
    cases:
      - haber-v-walker
    stem: For what proposition does the flowchart cite Haber v Walker?
    options:
      - text: A subsequent negligent act severs the chain only as a matter of fact and degree.
        why: >-
          Wrong — 'fact and degree' is the Mahony v J Kruschich (Demolitions) Pty Ltd proposition on the separate
          negligent-acts branch.
      - text: A causally independent act which is an extremely unlikely coincidence can sever the chain.
        correct: true
        why: >-
          Correct — Haber v Walker sits under 'To sever the connection, the intervening act must ordinarily be', as
          authority for the causally independent, extremely unlikely coincidence.
      - text: Volitional human conduct is the only kind of later event that is capable of severing the chain of causation.
        why: >-
          Tempting because voluntariness is the first limb, but Haber v Walker is cited for the second limb — a
          coincidence — which shows voluntariness is not the only route.
  - key: b04
    type: mcq
    concept: novus-actus-volitional-acts-and-coincidences
    difficulty: 2
    cases:
      - rickards-v-lothian
      - yates-v-jones
      - ces-v-superclinics-aust-pty-ltd
    stem: Which group does the flowchart give as examples of 'volitional' conduct which severed the chain of causation?
    options:
      - text: Urbanski v Patel; Haynes v G Harwood & Son; Medlin; Hirst v Nominal Defendant.
        why: >-
          Tempting because these sit right beside the correct group, but they are the flowchart's examples of
          non-volitional conduct which did not sever the chain.
      - text: Rickards v Lothian; Yates v Jones; CES v Superclinics (Aust) Pty Ltd.
        correct: true
        why: Correct — these three are listed as 'Examples of volitional conduct which severed the chain of causation'.
      - text: Mahony v J Kruschich (Demolitions) Pty Ltd; Burns v Pearce; March v Stramare.
        why: >-
          Wrong — these are on the negligent-acts branch, for the proposition that later negligence does not necessarily
          sever the chain.
      - text: Hughes v Lord Advocate; Jolley v Sutton LBC; Mount Isa Mines v Pusey.
        why: >-
          Wrong — these are on the remoteness page, for the rule that the extent and precise manner of harm need not be
          reasonably foreseeable.
  - key: b05
    type: mcq
    concept: novus-actus-volitional-acts-and-coincidences
    difficulty: 2
    variant-of: b04
    cases:
      - urbanski-v-patel
      - haynes-v-g-harwood-and-son
      - medlin-v-state-government-insurance-commission
      - hirst-v-nominal-defendant
    stem: Which group does the flowchart give as examples of 'non-volitional' conduct which did not sever the chain?
    options:
      - text: Urbanski v Patel; Haynes v G Harwood & Son; Medlin; Hirst v Nominal Defendant.
        correct: true
        why: >-
          Correct — these four are listed as 'Examples of non-volitional conduct which did not sever the chain of
          causation'.
      - text: Rickards v Lothian; Yates v Jones; CES v Superclinics (Aust) Pty Ltd.
        why: >-
          Tempting because these sit in the neighbouring box, but they are the examples of volitional conduct which did
          sever the chain.
      - text: Club Italia (Geelong) Inc v Ritchie; Jausnik v Nominal Defendant (No 5); Gittani Stone Pty Ltd.
        why: >-
          Wrong — these are "see, eg" examples under March v Stramare on the negligent-acts branch, not the
          non-volitional group.
      - text: Tremain v Pike; Nader v UTA (NSW); Commonwealth v McLean; Metrolink.
        why: Wrong — these are on the remoteness page, cited on the 'kind' or 'type' of harm.
  - key: b06
    type: mcq
    concept: novus-actus-volitional-acts-and-coincidences
    difficulty: 2
    stem: How does the flowchart describe 'voluntary action' for the purpose of severing the chain?
    options:
      - text: Conduct which is 'volitional'.
        correct: true
        why: >-
          Correct — the box reads 'Voluntary action is conduct which is volitional', and then splits the cases into
          volitional (severed) and non-volitional (did not sever) groups.
      - text: Any conduct at all that takes place after the defendant's breach of duty.
        why: >-
          Wrong — timing alone is not enough: the flowchart lists later conduct that was non-volitional and did not
          sever the chain.
      - text: Conduct that is careless rather than deliberate, whoever carries it out.
        why: >-
          Wrong — careless later conduct is handled on the separate negligent-acts branch, where it does not necessarily
          sever the chain; "voluntary" points to volition, not carelessness.
      - text: Conduct that the defendant could reasonably have foreseen when acting.
        why: >-
          Tempting because foreseeability is everywhere in negligence, but the flowchart defines voluntary action by
          volition, not by whether the defendant could foresee it.
  - key: b07
    type: mcq
    concept: novus-actus-volitional-acts-and-coincidences
    difficulty: 2
    cases:
      - hirst-v-nominal-defendant
    stem: In which group does the flowchart place Hirst v Nominal Defendant?
    options:
      - text: Volitional conduct which severed the chain of causation.
        why: >-
          Tempting because Hirst sits on the same branch, but it is in the other box: the volitional, chain-severing
          group is Rickards v Lothian, Yates v Jones and CES v Superclinics.
      - text: Non-volitional conduct which did not sever the chain.
        correct: true
        why: >-
          Correct — Hirst v Nominal Defendant is the last of the four examples of non-volitional conduct which did not
          sever the chain of causation.
      - text: Later negligence by a third party (the March v Stramare examples).
        why: >-
          Wrong — the March v Stramare examples are Club Italia (Geelong) Inc v Ritchie, Jausnik v Nominal Defendant (No
          5) and Gittani Stone. Note the similar 'Nominal Defendant' name in Jausnik.
      - text: "Remoteness: the 'kind' or 'type' of harm suffered."
        why: >-
          Wrong — the kind-of-harm cases are Tremain v Pike, Nader, Commonwealth v McLean and Metrolink Victoria v
          Inglis, all on the remoteness page.
  - key: b08
    type: mcq
    concept: novus-actus-volitional-acts-and-coincidences
    difficulty: 2
    variant-of: b07
    cases:
      - ces-v-superclinics-aust-pty-ltd
    stem: In which group does the flowchart place CES v Superclinics (Aust) Pty Ltd?
    options:
      - text: Volitional conduct which severed the chain.
        correct: true
        why: >-
          Correct — CES v Superclinics is listed with Rickards v Lothian and Yates v Jones as volitional conduct which
          severed the chain of causation.
      - text: Non-volitional conduct which did not sever the chain of causation.
        why: >-
          Tempting because the two groups sit side by side, but the non-volitional group is Urbanski v Patel, Haynes v G
          Harwood & Son, Medlin and Hirst v Nominal Defendant.
      - text: The extent and manner of harm need not be reasonably foreseeable.
        why: >-
