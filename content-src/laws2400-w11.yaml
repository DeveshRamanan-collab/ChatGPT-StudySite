    title: "Remoteness of harm: a foreseeable kind, not extent or manner"
    visual: simulation
    visual-brief: >-
      Three dials — kind of harm, extent of harm, manner of occurrence — each set to foreseeable or not; only the kind
      dial moves the verdict between "not too remote" and "too remote", with the Wagon Mound (No 2) "real risk, not
