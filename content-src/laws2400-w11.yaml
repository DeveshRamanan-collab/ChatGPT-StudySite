cards:
  - type: basic
    concept: scope-of-liability-decision-flow
    front: What are the two elements of causation under CLA s 5D(1)?
    back: >-
      (a) Factual causation — the negligence was a necessary condition of the harm; (b) scope of liability — it is
      appropriate for the scope of the negligent person's liability to extend to the harm so caused.
    source: Civil Liability Act 2002 (NSW) s 5D(1); Topic 11 flowchart, Tort Law Principles 3e p 436
  - type: cloze
    concept: scope-of-liability-decision-flow
    text: >-
      For the scope of liability, the court is to consider (amongst other relevant things) {{c1::whether or not and
      why}} responsibility for the harm should be imposed on the {{c2::negligent party}} (CLA s 5D(4)).
    source: Civil Liability Act 2002 (NSW) s 5D(4)
  - type: basic
    concept: scope-of-liability-decision-flow
    front: What are Wallace v Kam and Ruddock v Taylor cited for on the scope of liability flowchart?
    back: >-
      Wallace v Kam: scope of liability embraces policy-based considerations the courts are required to articulate.
      Ruddock v Taylor: it raises normative questions — whether the defendant ought to be held liable.
    source: Topic 11 flowchart, Tort Law Principles 3e p 436
  - type: basic
    concept: scope-of-liability-decision-flow
    front: Scope of liability raises which two distinct common law concepts?
    back: New intervening acts (novus actus interveniens) and remoteness of harm.
    source: Topic 11 flowchart, Tort Law Principles 3e p 436
  - type: cloze
    concept: novus-actus-volitional-acts-and-coincidences
    text: >-
      The Oropesa: is the subsequent event {{c1::ultroneous}}, something unwarrantable, a new cause which disturbs the
      sequence of events, something which can be described as either {{c2::unreasonable or extraneous or extrinsic}}?
    source: Topic 11 flowchart, Tort Law Principles 3e p 437
  - type: basic
    concept: novus-actus-volitional-acts-and-coincidences
    front: To sever the chain of causation, the intervening act must ordinarily be…?
    back: >-
      Voluntary human action (conduct which is 'volitional'), or a causally independent act which is a coincidence which
      is extremely unlikely (Haber v Walker).
    source: Topic 11 flowchart, Tort Law Principles 3e p 437
  - type: basic
    concept: novus-actus-volitional-acts-and-coincidences
    front: Name the flowchart's examples of volitional conduct which severed the chain of causation.
    back: Rickards v Lothian; Yates v Jones; CES v Superclinics (Aust) Pty Ltd.
    source: Topic 11 flowchart, Tort Law Principles 3e p 437
  - type: basic
    concept: novus-actus-volitional-acts-and-coincidences
    front: Name the flowchart's examples of non-volitional conduct which did not sever the chain of causation.
    back: >-
      Urbanski v Patel; Haynes v G Harwood & Son; Medlin v State Government Insurance Commission; Hirst v Nominal
      Defendant.
    source: Topic 11 flowchart, Tort Law Principles 3e p 437
  - type: apply
    concept: novus-actus-volitional-acts-and-coincidences
    scenario: >-
      D negligently injures P, who is confined to bed. A freak lightning strike, unconnected with the accident, fells a
      tree onto P's house and injures P again.
    answer: >-
      Novus actus: a causally independent, extremely unlikely coincidence can sever the chain (Haber v Walker), so the
      second injury is likely outside the scope of D's liability.
    source: Topic 11 flowchart, Tort Law Principles 3e p 437
  - type: basic
    concept: subsequent-negligent-acts
    front: Does a later negligent act break the chain of causation?
    back: >-
      It is a matter of 'fact and degree' (Mahony v J Kruschich (Demolitions) Pty Ltd); negligence of a third party or
      even the plaintiff does not necessarily sever the chain (Mahony; Burns v Pearce).
    source: Topic 11 flowchart, Tort Law Principles 3e p 437
  - type: cloze
    concept: subsequent-negligent-acts
    text: >-
      Later negligence is especially unlikely to sever the chain where the defendant's wrongful conduct generated the
      {{c1::very risk}} of injury and the injury occurs {{c2::in the ordinary course of things}} (March v E & MH
      Stramare Pty Ltd).
    source: Topic 11 flowchart, Tort Law Principles 3e p 437
  - type: apply
    concept: subsequent-negligent-acts
    scenario: >-
      A contractor negligently leaves a trench across a footpath with no detour, so pedestrians walk on the road; a
      pedestrian there is hit by a carelessly driven car.
    answer: >-
      The driver's negligence probably does not break the chain: the contractor generated the very risk and the injury
      occurred in the ordinary course of things (March v Stramare; Mahony).
    source: Topic 11 flowchart, Tort Law Principles 3e p 437
  - type: basic
    concept: subsequent-negligent-acts
    front: Which three cases follow March v Stramare as "see, eg" examples?
    back: Club Italia (Geelong) Inc v Ritchie; Jausnik v Nominal Defendant (No 5); Gittani Stone Pty Ltd v Pavkovic.
    source: Topic 11 flowchart, Tort Law Principles 3e p 437
  - type: basic
    concept: remoteness-kind-of-harm
    front: What is remoteness of harm concerned with, and what is the leading case?
    back: >-
      The extent of the defendant's liability for losses. Leading case: Overseas Tankship (UK) Ltd v Morts Dock and
      Engineering Co Ltd (The Wagon Mound (No 1)) — a reasonable foreseeability test.
    source: Topic 11 flowchart, Tort Law Principles 3e p 438
  - type: cloze
    concept: remoteness-kind-of-harm
    text: >-
      A real risk is one which would occur to the mind of a reasonable man in the position of the defendant's servant
      and which he would not {{c1::brush aside as far-fetched}} (The Wagon Mound ({{c2::No 2}})).
    source: Topic 11 flowchart, Tort Law Principles 3e p 438
  - type: basic
    concept: remoteness-kind-of-harm
    front: What need not be reasonably foreseeable for remoteness? Give the cases.
    back: >-
      The extent of the harm and the precise manner of its occurrence: Hughes v Lord Advocate; Jolley v Sutton LBC;
      Mount Isa Mines v Pusey; Gittani Stone v Pavkovic; Waller v James.
    source: Topic 11 flowchart, Tort Law Principles 3e p 438
  - type: basic
    concept: remoteness-kind-of-harm
    front: Which cases does the flowchart cite on the 'kind' or 'type' of harm?
    back: >-
      Tremain v Pike; Nader v Urban Transit Authority of NSW; Commonwealth v McLean; Metrolink Victoria Pty Ltd v
      Inglis.
    source: Topic 11 flowchart, Tort Law Principles 3e p 438
  - type: apply
    concept: remoteness-kind-of-harm
    scenario: >-
      Boiling water is negligently left within a toddler's reach; it tips in an odd way and scalds him far worse than a
      simple spill would.
    answer: >-
      Not too remote: a scald is the foreseeable kind of harm; the precise manner and extent need not be foreseeable (eg
      Hughes v Lord Advocate; Jolley).
    source: Topic 11 flowchart, Tort Law Principles 3e p 438
  - type: cloze
    concept: remoteness-kind-of-harm
    text: >-
      Remoteness uses a {{c1::different}} test of reasonable foreseeability from duty and breach — what damage is
      foreseeable as a consequence — but "reasonable foreseeability" means the {{c2::same}} thing: a real risk.
    source: Topic 11 flowchart, Tort Law Principles 3e p 438
  - type: cloze
    concept: egg-shell-skull-rule
    text: >-
      The defendant must take the plaintiff with all his {{c1::weaknesses, beliefs and reactions}} as well as his
      capacities and attributes, {{c2::physical, social and economic}} (Nader v Urban Transit Authority of NSW).
    source: Topic 11 flowchart, Tort Law Principles 3e p 438
  - type: apply
    concept: egg-shell-skull-rule
    scenario: >-
      A negligent driver bruises a professional cellist's shoulder; an old weakness turns it into a chronic condition
      and ends her career.
    answer: >-
      The driver takes her as found — her weakness and her economic attributes (Nader; Kavanagh v Akhtar) — so he is
      liable for the full extent of the harm.
    source: Topic 11 flowchart, Tort Law Principles 3e p 438
  - type: basic
    concept: egg-shell-skull-rule
    front: How does the egg-shell skull rule fit with Tame v New South Wales (week 6)?
    back: >-
      Gummow and Kirby JJ: if liability is established, then, consistently with Windeyer J in Pusey, the egg-shell skull
      rule applies to the assessment of damages. It does not itself create liability (in NSW, s 32 still sets the
      mental-harm duty test).
    source: Casebook (Tame v New South Wales, [199]–[203]); week 6
  - type: basic
    concept: client-interviewing-and-trauma-informed-practice
    front: Roberts v Cashman [2000] NSWSC 770 — what happened, and why was the firm liable?
    back: >-
      The firm relied on a class-action questionnaire and never interviewed the client, so her original injury (a broken
      banana chair) was never explored and her claim against the manufacturer became time-barred. Duty of care breached:
      a solicitor who does not interview the client "does so at his own peril".
    source: Topic 11 Tutorial Preparation Slides, slides 7–8
  - type: basic
    concept: client-interviewing-and-trauma-informed-practice
    front: What are the key duties in an initial client interview?
    back: Explain confidentiality; establish the limits of the retainer; disclose costs.
    source: Topic 11 Tutorial Preparation Slides, slide 12
  - type: basic
    concept: client-interviewing-and-trauma-informed-practice
    front: In client-focused interviewing, what does the lawyer control?
    back: >-
      The process, not the content. The client is an actor and agent who makes the decisions (ASCR rr 7 and 8); adjust
      your scaffolding to the client.
    source: Topic 11 Tutorial Preparation Slides, slides 16–17
  - type: cloze
    concept: client-interviewing-and-trauma-informed-practice
    text: "Active listening (LARS): {{c1::Listening}}, {{c2::Acknowledging}}, {{c3::Reflecting}}, {{c4::Summarising}}."
    source: Topic 11 Tutorial Preparation Slides, slide 25
  - type: basic
    concept: client-interviewing-and-trauma-informed-practice
    front: Reflecting versus reframing?
    back: >-
      Reflecting mirrors what the client just said (important for confirmation); reframing gives the underlying content
      or feelings back in a new set of words (important for changing perspective).
    source: Topic 11 Tutorial Preparation Slides, slide 26
  - type: basic
    concept: client-interviewing-and-trauma-informed-practice
    front: What is the order of questions in the T-funnel, and the two key rules of questioning?
    back: >-
      Broad open → general open → detailed → nitty-gritty, with clarification throughout. Rules: don't start questioning
      too soon, and don't do too much of it (it is not a cross-examination).
    source: Topic 11 Tutorial Preparation Slides, slides 30–33
  - type: basic
    concept: client-interviewing-and-trauma-informed-practice
    front: What is trauma-informed practice about, and what question does it ask?
    back: >-
      Avoiding re-traumatisation, not helping people solve their trauma. Ask "What happened to you?" rather than "What
      is wrong with you?".
    source: Topic 11 Tutorial Preparation Slides, slides 41–42, 52
  - type: basic
    concept: client-interviewing-and-trauma-informed-practice
    front: Fight, flight, freeze and fawn — how might each look in a client?
    back: >-
      Fight: the 'rude' client. Flight: the 'unresponsive' client. Freeze: the 'undecisive' client. Fawn: the 'adoring'
      client.
    source: Topic 11 Tutorial Preparation Slides, slide 45
audio:
  title: Week 11 recap — scope of liability and remoteness
  minutes: 3
  script: >-
    This week is the second half of causation. Section 5D(1) of the Civil Liability Act gives two elements: factual
    causation, meaning the negligence was a necessary condition of the harm, and scope of liability, meaning it is
    appropriate for the negligent person's liability to extend to the harm so caused. For scope of liability, section
    5D(4) tells the court to consider whether or not and why responsibility should be imposed. That is openly
    policy-based, and courts have to say what the policy is, as Wallace v Kam puts it; and it is normative, a question
    of whether the defendant ought to be liable, as in Ruddock v Taylor.


    Scope of liability then splits into two common law ideas. The first is the new intervening act. 'But for' causation
    is there, but something happened later. Does it break the chain? The Oropesa asks whether the later event is
    ultroneous, unwarrantable, a new cause, unreasonable or extraneous. To sever the chain, the later act must
    ordinarily be voluntary human action, meaning volitional conduct, or an extremely unlikely, causally independent
    coincidence, which is Haber v Walker. The flowchart's volitional cases that severed the chain are Rickards v
    Lothian, Yates v Jones and CES v Superclinics. Its non-volitional cases that left the chain intact are Urbanski v
    Patel, Haynes v Harwood, Medlin and Hirst v Nominal Defendant.


    When the later act is itself negligence, by a third party or even the plaintiff, it's a matter of fact and degree
    under Mahony v Kruschich, and it does not necessarily break the chain, with Burns v Pearce. That's especially so
    when the defendant created the very risk that the later negligence brought about, and the injury happened in the
    ordinary course of things. That is March v Stramare.


    The second idea is remoteness, which governs the extent of liability for losses. The Wagon Mound number one is the
    leading case: the test is reasonable foreseeability. The object is different from duty and breach, because we ask
    what damage was foreseeable, but the meaning is the same. The Wagon Mound number two says a real risk is one a
    reasonable person wouldn't brush aside as far-fetched. The kind of harm has to be foreseeable; its extent and the
    precise manner it happened do not, as in Hughes v Lord Advocate and Jolley.


    Last, the egg-shell skull rule from Nader: the defendant takes the plaintiff with all their weaknesses, beliefs and
    reactions, and their capacities and attributes, physical, social and economic. Once liability is established, it
    governs the damages.
