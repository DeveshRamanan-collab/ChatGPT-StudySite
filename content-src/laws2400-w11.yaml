  - key: s1
    type: short
    concept: scope-of-liability-decision-flow
    difficulty: 3
    cases:
      - wallace-v-kam
      - ruddock-v-taylor
    prompt: >-
      Factual causation is established in a negligence problem governed by the Civil Liability Act 2002 (NSW). Explain
      how you would structure the scope of liability part of the answer, referring to the statutory provisions and the
      authorities the Topic 11 flowchart cites.
    model: >-
      Scope of liability is the second element of causation: s 5D(1)(b) asks whether it is appropriate for the scope of
      the negligent person's liability to extend to the harm so caused. Under s 5D(4), the court is to consider, amongst
      other relevant things, whether or not and why responsibility for the harm should be imposed on the negligent
      party. That inquiry embraces policy-based considerations which the courts are required to articulate (Wallace v
      Kam), and it raises normative questions — whether the defendant ought to be held liable (Ruddock v Taylor). I
      would state both provisions and those authorities first.


      Scope of liability then raises two distinct common law concepts, and I would run only the one the facts raise. If
      a later event affected the situation the defendant created, I would ask whether it was a new intervening act
      breaking the chain of causation. If the harm was of an unexpected kind, extent or manner, I would ask whether it
      was too remote: was the kind of damage reasonably foreseeable (The Wagon Mound (No 1)), remembering that extent
      and manner need not be? Either branch can take the harm outside the scope of liability. I would finish with a
      conclusion on whether the harm falls within the scope of the defendant's liability.
    rubric:
      - id: r1
        criterion: States s 5D(1)(b) as the second element of causation
        marks: 2
        top-band: Quotes or closely paraphrases s 5D(1)(b) and places it after factual causation under s 5D(1)(a).
        margin-note: Start with the statute, not the common law.
        authorities:
          - civil-liability-act-2002-nsw-s5d
      - id: r2
        criterion: Explains s 5D(4) and its normative, policy-based character
        marks: 3
        top-band: >-
          Gives the s 5D(4) consideration and cites Wallace v Kam (policy articulated) and Ruddock v Taylor (normative
          "ought" question).
        margin-note: Name the case for each proposition — two cases, two jobs.
        authorities:
          - civil-liability-act-2002-nsw-s5d
      - id: r3
        criterion: Identifies the two common law concepts and when each is raised
        marks: 3
        top-band: Names novus actus interveniens and remoteness of harm, and says which facts trigger each.
        margin-note: Only run the branch the facts actually raise.
        authorities: []
      - id: r4
        criterion: Concludes on whether the harm is within the scope of liability
        marks: 2
        top-band: States that either branch can take the harm outside the scope of liability and gives a clear conclusion.
        margin-note: A structure answer still needs a conclusion line.
        authorities: []
  - key: s2
    type: short
    concept: novus-actus-volitional-acts-and-coincidences
    difficulty: 3
    cases:
      - the-oropesa
      - haber-v-walker
      - rickards-v-lothian
    prompt: >-
      Ari negligently reverses into Bo's parked food truck, which is towed to a repair yard. A week later, Cal, who has
      a long-running grudge against Bo, breaks into the yard and deliberately sets fire to the truck, destroying it. Bo
      sues Ari for the loss of the truck. Advise whether Cal's act takes the loss outside the scope of Ari's liability.
    model: >-
      The issue is whether Cal's arson is a new intervening act (novus actus interveniens) that takes the loss outside
      the scope of Ari's liability under CLA s 5D(1)(b). 'But for' causation is arguably established — the truck was at
      the yard only because of the collision — but a later event has affected the situation Ari's negligence created, so
      the court must decide whether it breaks the chain of causation.


      The Oropesa asks whether the subsequent event is ultroneous, something unwarrantable, a new cause which disturbs
      the sequence of events, or something unreasonable, extraneous or extrinsic. To sever the connection, the
      intervening act must ordinarily be voluntary human action — conduct which is volitional — or a causally
      independent coincidence which is extremely unlikely (Haber v Walker).


      Cal's act is deliberate, planned and motivated by a grudge unconnected with the collision. It is volitional human
      action of the kind the flowchart treats as severing the chain (Rickards v Lothian; Yates v Jones; CES v
      Superclinics), and an extraneous new cause in The Oropesa's sense. Section 5D(4) supports this: there is little
      reason why Ari should bear responsibility for a stranger's deliberate crime.


      Conclusion: Cal's arson very likely breaks the chain, so the loss of the truck falls outside the scope of Ari's
      liability.
    rubric:
      - id: r1
        criterion: Identifies the novus actus issue within s 5D(1)(b)
        marks: 2
        top-band: Notes 'but for' causation is assumed and frames the question as whether the later act breaks the chain.
        margin-note: Say why this is not a factual causation problem.
        authorities:
          - civil-liability-act-2002-nsw-s5d
      - id: r2
        criterion: "States the law: The Oropesa test and the two ways to sever"
        marks: 3
        top-band: >-
          Quotes The Oropesa and gives both limbs — volitional human action, or an extremely unlikely coincidence (Haber
          v Walker).
        margin-note: Both limbs, with the authority for each.
        authorities: []
      - id: r3
        criterion: Applies the voluntariness test to Cal's arson
        marks: 3
        top-band: >-
          Shows the arson is deliberate and volitional, unconnected with the collision, and matches the "severed" group
          of cases.
        margin-note: Tie each fact to "volitional" or "extraneous".
        authorities: []
      - id: r4
        criterion: Concludes, using s 5D(4) where helpful
        marks: 2
        top-band: Gives a clear conclusion that the chain is likely severed and why responsibility should not be imposed.
        margin-note: Commit to a conclusion.
        authorities: []
  - key: s3
    type: short
    concept: novus-actus-volitional-acts-and-coincidences
    difficulty: 3
    variant-of: s2
    cases:
      - haber-v-walker
      - the-oropesa
    prompt: >-
      Dee negligently drives into Eli at a pedestrian crossing, breaking his leg. Eli is confined to bed at home for six
      weeks. In the fourth week, a freak lightning strike — unconnected with the accident — brings down a healthy tree
      onto the bedroom, injuring Eli's back. Eli sues Dee for the back injury. Advise.
    model: >-
      The issue is whether the lightning strike breaks the chain of causation between Dee's negligence and Eli's back
      injury, taking that injury outside the scope of Dee's liability under CLA s 5D(1)(b).


      'But for' causation may be satisfied: Eli was in bed only because of the broken leg. But the novus actus branch
      starts from cases where 'but for' causation is established and later events affect the situation the defendant
      created. The question is whether the later event severs the connection. The Oropesa asks whether it is a new cause
      which disturbs the sequence of events, extraneous or extrinsic. To sever the connection, the intervening event
      must ordinarily be voluntary human action, or a causally independent act which is a coincidence which is extremely
      unlikely (Haber v Walker).


      The lightning strike is not human action at all, so the first limb does not apply. But it fits the second: it is
      causally independent of the accident — nothing Dee did made lightning more likely — and a freak strike felling a
      healthy tree is an extremely unlikely coincidence. It is an extraneous, extrinsic cause.


      Conclusion: the strike is likely to sever the chain, so the back injury probably falls outside the scope of Dee's
      liability, although Dee remains liable for the broken leg.
    rubric:
      - id: r1
        criterion: Frames the issue as a break in the chain under s 5D(1)(b)
        marks: 2
        top-band: Recognises that 'but for' causation does not end the inquiry and identifies the novus actus question.
        margin-note: Don't stop at 'but for'.
        authorities:
          - civil-liability-act-2002-nsw-s5d
      - id: r2
        criterion: States the coincidence limb with Haber v Walker
        marks: 3
        top-band: >-
          Distinguishes the two limbs and cites Haber v Walker for a causally independent, extremely unlikely
          coincidence; uses The Oropesa.
        margin-note: The right limb for a non-human event.
        authorities: []
      - id: r3
        criterion: Applies causal independence and extreme unlikelihood
        marks: 3
        top-band: Explains why the strike is unconnected with the accident and extremely unlikely.
        margin-note: "Two words to prove: independent, and extremely unlikely."
        authorities: []
      - id: r4
        criterion: Concludes and separates the leg from the back
        marks: 2
        top-band: Concludes the back injury is likely outside the scope while liability for the leg stands.
        margin-note: Keep the original injury in the answer.
        authorities: []
  - key: s4
    type: short
    concept: subsequent-negligent-acts
    difficulty: 3
    cases:
      - mahony-v-j-kruschich-demolitions-pty-ltd
      - burns-v-pearce
      - march-v-stramare
    prompt: >-
      Fay, a council contractor, negligently leaves an open trench across a footpath at night with no barrier or detour,
      so pedestrians have to walk on the road. Gil walks on the road and is struck by Hal, who is driving carelessly.
      Gil sues Fay. Fay argues that Hal's negligence broke the chain of causation. Advise.
    model: >-
      The issue is whether Hal's later negligence severs the chain of causation between Fay's negligence and Gil's
      injury, taking the injury outside the scope of Fay's liability under CLA s 5D(1)(b).


      Where one negligent act is followed by another, whether the later negligent act severs the causal connection is a
      matter of 'fact and degree' (Mahony v J Kruschich (Demolitions) Pty Ltd). Negligence of a third party, or even the
      plaintiff, does not necessarily sever the chain (Mahony; Burns v Pearce). This is especially so where the
      defendant's wrongful conduct has generated the very risk of injury resulting from the later negligence, and the
      injury occurs in the ordinary course of things (March v E & MH Stramare Pty Ltd; see, eg, Club Italia (Geelong)
      Inc v Ritchie).


      Fay's negligence forced pedestrians onto the road. The very risk that created was that a pedestrian on the road
      would be hit by a vehicle, including a carelessly driven one. Gil's injury is that risk coming home, and it
      happened in the ordinary course of things. Hal's carelessness is not a deliberate, volitional intervention of the
      kind that ordinarily severs the chain.


      Conclusion: Hal's negligence probably does not break the chain; Gil's injury is likely within the scope of Fay's
      liability (Hal may also be liable to Gil).
    rubric:
      - id: r1
        criterion: Identifies the negligent-acts branch
        marks: 2
        top-band: Frames the issue as later negligence by a third party, distinct from the volitional-act test.
        margin-note: Right branch first.
        authorities:
          - civil-liability-act-2002-nsw-s5d
      - id: r2
        criterion: States Mahony, Burns v Pearce and March v Stramare
        marks: 3
        top-band: >-
          Gives 'fact and degree', 'does not necessarily sever', and the very-risk / ordinary-course proposition, each
          with its case.
        margin-note: Three propositions, three authorities.
        authorities: []
      - id: r3
        criterion: Applies the very-risk reasoning to the trench
        marks: 3
        top-band: >-
          Shows Fay's conduct generated the very risk of pedestrians being hit on the road and the injury followed in
          the ordinary course.
        margin-note: Name the risk Fay created in one sentence.
        authorities: []
      - id: r4
        criterion: Concludes on the chain and the scope of liability
        marks: 2
        top-band: Clear conclusion that the chain likely holds; may note Hal's own liability.
        margin-note: Conclude on Fay, not just on Hal.
        authorities: []
  - key: s5
    type: short
    concept: remoteness-kind-of-harm
    difficulty: 3
    cases:
      - overseas-tankship-v-morts-dock-the-wagon-mound-no-1
      - overseas-tankship-v-miller-steamship-the-wagon-mound-no-2
      - hughes-v-lord-advocate
    prompt: >-
      A workshop owner negligently leaves an uncapped can of fuel beside a heater, creating a risk of burns from fire.
      The vapour ignites in an unusual way, causing a sudden flash explosion; Ivy, an employee, suffers burns far more
      severe than an ordinary fire would have caused. The owner argues the harm is too remote. Advise.
    model: >-
      The issue is whether Ivy's burns are too remote, so that they fall outside the scope of the owner's liability
      under CLA s 5D(1)(b).


      Remoteness of harm is concerned with the extent of the defendant's liability for losses. The leading case, The
      Wagon Mound (No 1), makes that extent depend on a reasonable foreseeability test. It differs from duty and breach
      because the court asks what damage was reasonably foreseeable as a consequence of the negligence, but 'reasonable
      foreseeability' means the same thing: a real risk, one a reasonable person in the defendant's position would not
      brush aside as far-fetched (The Wagon Mound (No 2)). The extent of the harm and the precise manner of its
      occurrence need not be reasonably foreseeable (eg Hughes v Lord Advocate; Jolley v Sutton LBC; Waller v James).


      The kind of harm Ivy suffered — burns — is exactly the kind of harm an uncapped fuel can beside a heater makes a
      real risk. The owner's arguments go to the manner (a flash explosion rather than an ordinary fire) and the extent
      (unusually severe burns). Neither needs to be foreseeable once the kind of harm was.


      Conclusion: the burns are not too remote; they fall within the scope of the owner's liability.
    rubric:
      - id: r1
        criterion: Identifies remoteness as the issue within scope of liability
        marks: 2
        top-band: Frames remoteness as concerned with the extent of liability for losses, under s 5D(1)(b).
        margin-note: Place remoteness inside the statute.
        authorities:
          - civil-liability-act-2002-nsw-s5d
      - id: r2
        criterion: States the Wagon Mound tests
        marks: 3
        top-band: Cites Wagon Mound (No 1) as the leading case and Wagon Mound (No 2) for real risk, not far-fetched.
        margin-note: No 1 for the test, No 2 for its meaning.
        authorities: []
      - id: r3
        criterion: Separates kind from extent and manner, with authority
        marks: 3
        top-band: Classifies burns as the foreseeable kind and dismisses manner and extent with the extent-and-manner cases.
        margin-note: This is where the marks are.
        authorities: []
      - id: r4
        criterion: Concludes
        marks: 2
        top-band: Clear conclusion that the burns are not too remote.
        margin-note: One line is enough, but it must be there.
        authorities: []
  - key: s6
    type: short
    concept: egg-shell-skull-rule
    difficulty: 3
    cases:
      - nader-v-urban-transit-authority-of-new-south-wales
      - kavanagh-v-akhtar
    prompt: >-
      Jin negligently knocks Kit, a professional cellist, off her bicycle, bruising her shoulder. Because of an old,
      undiagnosed weakness in that shoulder, the bruise triggers a chronic condition and Kit can never play
      professionally again; her lost earnings are very large. Jin says he could not have foreseen any of this. Advise on
      the extent of Jin's liability.
    model: >-
      The issue is whether Jin is liable for the full extent of Kit's harm — the chronic condition and the loss of her
      career — or only for what an ordinary person would suffer from a bruised shoulder.


      Remoteness asks whether the kind of harm was reasonably foreseeable (The Wagon Mound (No 1)); the extent of the
      harm need not be. The egg-shell skull rule then applies: the defendant must take the plaintiff with all his
      weaknesses, beliefs and reactions as well as his capacities and attributes, physical, social and economic (Nader v
      Urban Transit Authority of New South Wales; see Kavanagh v Akhtar).


      Physical injury to a cyclist knocked off a bicycle is plainly a foreseeable kind of harm, so liability is
      established. Kit's undiagnosed shoulder weakness is a physical weakness Jin must take as he finds it, whether or
      not he knew of it. Her career as a professional cellist and her high earnings are capacities and attributes,
      social and economic, which the rule also says Jin takes as found. Jin's argument that he could not foresee the
      severity goes to extent, which need not be reasonably foreseeable.


      Conclusion: Jin is liable for the full extent of Kit's harm, including the chronic condition and her lost
      earnings.
    rubric:
      - id: r1
        criterion: Identifies the issue as extent of liability for a vulnerable plaintiff
        marks: 2
        top-band: Frames the question as whether Jin answers for the full extent, after a foreseeable kind of harm.
        margin-note: Gate first (kind), then extent.
        authorities: []
      - id: r2
        criterion: States the egg-shell skull rule with Nader
        marks: 3
        top-band: >-
          Quotes the rule — weaknesses, beliefs and reactions; capacities and attributes, physical, social and economic
          — and cites Nader (and Kavanagh v Akhtar).
        margin-note: Quote the words; they do the work.
        authorities: []
      - id: r3
        criterion: Applies the rule to the weakness and the earnings
        marks: 3
        top-band: >-
          Applies "weaknesses" to the shoulder and "social and economic attributes" to the career and earnings; notes no
          knowledge requirement.
        margin-note: Two facts, two parts of the rule.
        authorities: []
      - id: r4
        criterion: Concludes on full liability
        marks: 2
        top-band: Concludes Jin is liable for the full extent of the harm.
        margin-note: Say "full extent".
        authorities: []
