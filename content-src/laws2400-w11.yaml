      - commonwealth-v-mclean
      - metrolink-victoria-pty-ltd-v-inglis
      - tame-v-new-south-wales
    authorities: []
    verify: false
    body: >-
      Remoteness of harm is concerned with the extent of the defendant's liability for losses. The leading case is

      *Overseas Tankship (UK) Ltd v Morts Dock and Engineering Co Ltd (The Wagon Mound (No 1))*: the extent of liability
      is

      determined by a reasonable foreseeability test.


      It is a different test from duty and breach, because the court asks what damage is reasonably foreseeable as a

      consequence of the negligence. But 'reasonable foreseeability' means the same thing: a risk is reasonably
      foreseeable when it is a 'real risk' — one which would occur to the mind of a

      reasonable man in the position of the defendant's servant and which he would not brush aside as far-fetched (*The

      Wagon Mound (No 2)*).


      - **Kind or type of harm** — the question is framed by the kind of harm: *Tremain v Pike*, *Nader v Urban Transit
        Authority of NSW*, *Commonwealth v McLean*, *Metrolink Victoria Pty Ltd v Inglis*.
      - **Extent and manner need not be foreseeable** — the extent of the harm and the precise manner of its occurrence
      need
        not be reasonably foreseeable: *Hughes v Lord Advocate*, *Jolley v Sutton LBC*, *Mount Isa Mines v Pusey*, *Gittani
        Stone v Pavkovic*, *Waller v James*.

      For psychiatric harm, *Tame* (week 6) asks whether the class of injury — psychiatric illness — was foreseeable,
      not

      the particular disorder.


      Exam use: name the kind of harm; ask whether it was a real, not far-fetched, risk; answer arguments about extent
      or

      manner with the extent-and-manner cases.
  - slug: egg-shell-skull-rule
    title: The egg-shell skull rule
    visual: explainer
    visual-brief: >-
      The same negligent act lands on two plaintiffs — one robust, one with a hidden weakness — and the liability arrow
      follows each to the harm they actually suffer; the rule's words (weaknesses, beliefs and reactions; capacities and
      attributes, physical, social and economic) attach to the second plaintiff one at a time.
    related:
      - scope-of-liability-decision-flow
      - remoteness-kind-of-harm
      - laws2400-w06-psychiatric-harm-common-law-development
    depends-on:
      - remoteness-kind-of-harm
    contrasts-with:
      - laws2400-w06-psychiatric-harm-civil-liability-act
    cases:
      - nader-v-urban-transit-authority-of-new-south-wales
      - kavanagh-v-akhtar
      - tame-v-new-south-wales
      - mount-isa-mines-ltd-v-pusey
    authorities: []
    verify: false
    body: >-
      The egg-shell skull rule: "The defendant must take the plaintiff with all his weaknesses, beliefs and reactions

      as well as his capacities and attributes, physical, social and economic" (*Nader v Urban Transit Authority of New
      South

      Wales*; see also *Kavanagh v Akhtar*).


      It sits on the remoteness branch of the flowchart, beside the rule that the extent of the harm need not be
      reasonably

      foreseeable. Once harm of a reasonably foreseeable kind is caused, the plaintiff's own weaknesses, beliefs and
      reactions

      — and their capacities and attributes, including social and economic ones — do not cut down the defendant's
      liability

      for the harm that actually follows. A plaintiff whose condition makes the injury worse, or whose earning capacity
      makes

      the loss larger, is taken as found.


      The casebook links it to week 6. In *Tame v New South Wales*, Gummow and Kirby JJ noted Windeyer J's point in
      *Mount

      Isa Mines v Pusey* that a "normal fortitude" condition of liability did not stand well with the egg-shell skull
      rule,

      and said that, if liability is established, the egg-shell skull rule applies to the assessment of damages. It does
      not

      itself create liability: for NSW mental harm, CLA s 32's normal-fortitude duty test must still be met.


      Exam use: where the harm is unusually severe because of who the plaintiff is, cite *Nader* and say the defendant
      takes

      the plaintiff as found.
