      'reasonable foreseeability' means the same thing. How do the two boxes fit together?
    options:
      - text: The meaning (a real, not far-fetched, risk) is the same; what differs is the object — the damage that follows.
        correct: true
        why: >-
          Correct — the threshold is the same real-risk test (Wagon Mound (No 2)); what changes is the question it is
          applied to: what damage was reasonably foreseeable as a consequence of the negligence.
      - text: Remoteness uses a lower threshold, so any conceivable risk, however fanciful, is enough.
        why: >-
          Wrong — the flowchart says 'reasonable foreseeability' means the same thing at every stage: a real risk, not
          one brushed aside as far-fetched.
      - text: "Remoteness uses a higher threshold: the harm must have been probable, not just a real risk."
        why: >-
          Tempting because remoteness limits liability, but the flowchart keeps the same meaning — a real risk — rather
          than requiring probability.
      - text: The boxes conflict, and the Wagon Mound (No 2) box has displaced the 'different test' box.
        why: >-
          Wrong — the boxes are complementary: one identifies what is assessed (the damage), the other how foreseeable
          it must be (a real risk).
