    body: >-
      A new intervening act (*novus actus interveniens*) arises where 'but for' causation is established, but a later

      event has some effect on the situation the defendant's negligence created. The court must decide whether the
      subsequent

      event relieves the defendant of responsibility — whether it takes the injury outside the scope of liability — by
      asking

      whether it breaks the chain of causation.


      *The Oropesa* test: is the subsequent event "ultroneous, something unwarrantable, a new cause which disturbs the

      sequence of events, something which can be described as either unreasonable or extraneous or extrinsic"?


      To sever the connection, the intervening act must ordinarily be either:


      - **voluntary human action** — conduct which is 'volitional'; or

      - **a causally independent act which is a coincidence which is extremely unlikely** (*Haber v Walker*).


      The flowchart sorts its examples into two groups:


      - volitional conduct which **severed** the chain: *Rickards v Lothian*, *Yates v Jones*, *CES v Superclinics
      (Aust)
        Pty Ltd*;
      - non-volitional conduct which **did not sever** the chain: *Urbanski v Patel*, *Haynes v G Harwood & Son*,
      *Medlin v
        State Government Insurance Commission*, *Hirst v Nominal Defendant*.

      The facts of these cases are not in this week's materials: learn each group for the proposition it supports.


      Exam use: identify the later event; ask whether it was volitional human action or an extremely unlikely
      coincidence;

      cite the matching group. If the later event was itself negligence, use the negligent-acts branch instead.
  - slug: subsequent-negligent-acts
    title: Negligent acts followed by negligent acts
    visual: diagram
    visual-brief: >-
      One chain drawn in three steps: a second negligent actor (a third party or the plaintiff) steps in — 'fact and
      degree' (Mahony); the link does not automatically snap (Burns v Pearce); and where the defendant's conduct
      generated the very risk the later negligence realised, the link is drawn thick (March v Stramare).
    related:
      - scope-of-liability-decision-flow
      - novus-actus-volitional-acts-and-coincidences
    depends-on:
      - scope-of-liability-decision-flow
    contrasts-with:
