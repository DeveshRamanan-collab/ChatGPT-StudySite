week_file:
  topic: International and national law, and jurisdiction
  summary: |-
    Part A looks at the dynamic between international law and national law: from international law's perspective
    national law is (mostly) irrelevant to whether a state has breached its obligations (VCLT arts 27 and 46; ILC
    Draft Articles on State Responsibility art 3), while from the domestic perspective things are more complicated —
    monism and dualism explain the two ideal approaches, and Australia is primarily a dualist system in which treaties
    must be transformed into domestic law, customary international law sits uneasily between transformation and
    incorporation, and international law is used mainly as an aid to interpretation. Part B turns to jurisdiction: the
    three forms (to prescribe, to enforce, to adjudicate), and the grounds a state relies on to assert jurisdiction
    where there is a foreign element — territoriality (objective and subjective), active nationality, passive
    personality, protection and universality — and what happens when jurisdictions concur. For the exam, expect to
    explain which theory best describes Australia and why, and to apply the grounds of jurisdiction to short
    hypotheticals like the tutorial's poisoned olive oil, Bali assault and crimes-against-humanity scenarios.
  notes: |
    ## Recall: why the relationship is a question at all

    Sovereign equality of states: each state can make its own decisions about how to order its affairs, with the
    result that one state may not force its will upon others (Rose 2022). International law is a voluntary
    consent-based system: states have the authority or capacity to limit the exercise of their sovereign power by
    consenting to be bound by international legal rules. It is a horizontal rather than vertical system of authority:
    there is no superior authority, so states are both the makers and the enforcers of international law. And
    "international law is everywhere": international law has expanded, with increasing penetration of domestic legal
    orders. What does this all mean for the relationship between national laws and the international laws?

    ## The international law perspective

    From an international law perspective, a state cannot justify a breach of international law based on its internal
    law. The absence of a law or a contradictory provision in the domestic law of a state is no justification for
    violation of international law.

    :::rule
    "A party may not invoke the provisions of its internal law as justification for its failure to perform a treaty…"
    (art 27 VCLT).
    :::

    :::rule
    A state may not invoke the fact that its consent to be bound by a treaty has been expressed in violation of a
    provision of its internal law regarding competence to conclude treaties as invalidating its consent "unless that
    violation was manifest and concerned a rule of its internal law of fundamental importance". "A violation is
    manifest if it would be objectively evident to any State conducting itself in the matter in accordance with normal
    practice and in good faith" (art 46 VCLT).
    :::

    Expanding beyond treaties to rules of international law in general, the important provision is art 3 of the
    International Law Commission's Draft Articles on State Responsibility (2001). The draft articles are a product of
    the International Law Commission, but we bother with them because they mostly represent, or have been recognised
    as representing, customary international law.

    :::rule
    "The characterization of an act of a State as internationally wrongful is governed by international law. Such
    characterization is not affected by the characterization of the same act as lawful by internal law" (ILC Draft
    Articles on State Responsibility (2001) art 3).
    :::

    The relationship from the perspective of international law is simple: national law is (mostly) irrelevant in the
    consideration of international law obligations, and state responsibility for internationally wrongful acts. Yet
    the domestic law perspective is more complicated.

    ## National law remains relevant to international law

    - International law obligations regularly require the enactment of national legislation and action — therefore
      national law is the fulfilment of international law obligations; national law is usually seen as a vehicle
      through which international obligations and rights are brought into the domestic legal system.
    - National law can act as a source of factual evidence about a state's compliance or non-compliance with
      international law, and can serve as evidence for the existence of both state practice and opinio juris when
      determining customary international law.
    - National court decisions can be subsidiary sources of international law (art 38 of the Statute of the
      International Court of Justice).
    - National law can offer interpretation of international law, and can help us identify certain general principles
      of law.

    ## Two theories: monism and dualism

    **Monism** sees national and international law as part of one single normative legal order. International law has
    direct effect (incorporation) and holds the same legal authority as national law in the legal system, so courts
    are able to use international law directly. Inconsistency between the two legal systems must be resolved
    (frequently in favour of international law). Monism is often associated with the civil law tradition — mostly
    continental Europe.

    **Dualism** sees international and national law as distinct legal orders. The only law that has force at the
    domestic level is national law — therefore international law must be transformed into domestic law to have effect
    (transformation). Inconsistencies do not arise: the systems have different subjects and fulfil different purposes,
    and usually national law will have priority. Dualism is often associated with the common law tradition — the UK,
    Australia, Canada, and so on.

    :::examtip
    These are ideal-type theories: in reality, blends of the two theories characterise the relationship of
    international law to most domestic legal orders, with some states leaning more toward dualism and some more toward
    monism. Tutorial question 1 asks which one best reflects Australia's approach — primarily dualist.
    :::

    :::statute
    German Basic Law art 25 (primacy of international law): "The general rules of international law shall be an
    integral part of federal law. They shall take precedence over the laws and directly create rights and duties for
    the inhabitants of the federal territory." A very clear example of a monist system: no legislative step is
    required to integrate international law.
    :::

    :::statute
    Dutch Constitution (1983): art 90 — the Government shall promote the development of the international rule of law;
    art 91(1) — the Kingdom shall not be bound by treaties, nor shall such treaties be denounced, without the prior
    approval of the Parliament; art 91(3) — treaty provisions that conflict with the Constitution may be approved only
    by at least two-thirds of the votes cast; art 93 — provisions of treaties and of resolutions by international
    institutions which may be binding on all persons by virtue of their contents become binding after they have been
    published; art 94 — statutory regulations in force within the Kingdom are not applicable if that application is
    in conflict with such treaty provisions or resolutions. A more nuanced approach that mixes dualism and monism:
    Parliament's approval is still required, but no law replicating the treaty is needed, and a conflicting internal
    law gives way.
    :::

    ## Basic approach to international law in Australia

    The Law Society of NSW, *The Practitioner's Guide to International Law* (2nd ed, 2014) sets out the basic approach:

    1. International law as such does not form part of Australian law.
    2. Effect is first and foremost given to Australian law.
    3. Australian courts may refer to international law.
    4. In the absence of any contrary indications, Australian law is to be interpreted consistently with Australia's
       international obligations.
    5. The international obligations applicable to Australia are generally to be identified as they exist at the time
       the interpretive question arises — so a treaty that will enter into force tomorrow cannot serve as a basis for
       interpretation for a case that is arising today.
    6. In the event of conflict, international law cannot be invoked to override clear and valid Australian legal
       provisions.
    7. Parliament may legislate on matters in breach of international law, thereby "taking the risk of international
       complications".
    8. Australian courts should give special attention to protecting human rights and fundamental freedoms as
       recognised under international law.

    :::examtip
    The international law perspective (international law prevails) is in clear contradiction with the national law
    perspective (Australian law prevails). A decision or statute that contradicts international law can still be valid
    under Australian law — but that does not mean there will be no repercussion for the state under international law.
    Something being legal in Australia does not mean it will be considered legal at the international level.
    :::

    ## International law and the Australian Constitution

    Three key sections:

    - Section 51(xxix), known as the external affairs power, grants federal Parliament the power to enact legislation
      with respect to "external affairs".
    - Section 61: the power to conclude treaties is vested in the executive branch of government.
    - Section 75(i) vests the High Court with original jurisdiction in relation to "matters arising under a treaty".

    The Constitution does not address how Australia enters into binding relationships on the international stage, the
    legal effect of international law within the domestic legal system, or responsibility for enforcement at the
    domestic level.

    Section 51(xxix) "is intended to enable Australia to carry out its functions as an international person, fulfilling
    its international obligations and acting effectively as a member of the community of nations" (Murphy J in *New
    South Wales v Commonwealth* [1975]). It is relevant particularly when determining when the federal government has
    power to enact legislation that might otherwise fall to the powers of the states — which is why the power was
    controversial in a federation. The scope of valid use of the external affairs power includes, among others,
    legislation that:

    - carries out or gives effect to Australia's international treaty obligations;
    - gives effect to Australia's obligations under customary international law;
    - has a subject matter that may affect Australia's relations with international persons, including states and
      international organisations;
    - is related to a matter of "international concern" (*Koowarta v Bjelke-Petersen* [1982] HCA 27).

    The Commonwealth has broad discretion when exercising the external affairs power.

    :::case
    *Commonwealth v Tasmania* [1983] 158 CLR 1 (Tasmanian Dam Case) — in 1974 Australia became party to the World
    Heritage Convention; the Commonwealth passed legislation to protect part of Tasmania's wilderness from the building
    of a dam on the Gordon River, and Tasmania challenged its validity. The High Court majority held that even though
    the dam would normally be a matter for Tasmania, in light of Australia's international obligations the
    Commonwealth was entitled to intervene: being a party to such an agreement directly relates to external affairs.
    However, if the Commonwealth's use of the external affairs power was no more than a device to exercise legislative
    power, it would probably not be legitimate.
    :::

    ## Treaties and Australian law

    Treaties do not have a direct effect in Australia: treaty provisions need to be validly incorporated into
    Australian domestic law. There is a very limited class of treaties that are directly applicable without
    legislative implementation, e.g. certain peace treaties, boundary treaties, etc.

    :::case
    *Dietrich v The Queen* (1992) 177 CLR 292 — the appellant claimed he should have had access to publicly funded
    representation and so was denied a fair trial; the ICCPR, to which Australia is party, guarantees the right to a
    fair trial and free representation in certain cases (art 14(3)(d)). "Ratification of the ICCPR as an executive act
    has no direct legal effect upon domestic law; the rights and obligations contained in the ICCPR are not
    incorporated into Australian law unless and until specific legislation is passed implementing the provisions. No
    such legislation has been passed" (Mason CJ and McHugh J).
    :::

    Transformation of treaties into domestic law can happen by:

    1. Adoption of new legislation that gives effect to the treaty provisions (reproducing all or part of the text).
    2. Amendment of existing legislation — as happened with the Criminal Code, amended to give effect to certain
       provisions of the Genocide Convention.
    3. A schedule of a treaty to an existing Act (this does not constitute full incorporation).
    4. The treaty provision already being given effect in existing legislation — Australia does not need to do
       anything.
    5. Giving the treaty the force of law, e.g. *Diplomatic Privileges and Immunities Act 1967* s 7, which gives effect
       to certain articles of the Vienna Convention on Diplomatic Relations.

    ## International law and statutory interpretation

    - Where a statute directly incorporates the text of a treaty, the statute should be interpreted in line with the
      meaning given to it in the treaty unless the legislator expressed a contrary intention (*Applicant A v Minister
      for Immigration and Ethnic Affairs* (1997) 190 CLR 225).
    - A treaty can assist in the interpretation of Australian legislation (*Acts Interpretation Act 1901* (Cth)
      s 15AB(2)(d)), but only if (a) there was actual or contemplated participation by Australia in that treaty prior
      to enactment of the legislation in question; and (b) it is used to confirm the ordinary meaning of the text of the
      Act (s 15AB(1)(a)), or the legislation is ambiguous or obscure, or would otherwise lead to a result that is
      manifestly absurd or is unreasonable (s 15AB(1)(b)).
    - However, a treaty cannot qualify or modify the meaning of legislative words or expressions which are otherwise
      clear (*Yager v The Queen* [1977] 139 CLR 28 (Mason J)).

    Two common law presumptions:

    :::rule
    In a case of ambiguity in a statute, the courts should favour a construction that accords with international law
    (*Jumbunna Coal Mine NL v Victoria Coal Miners' Association* (1908) 6 CLR 309). It is a presumption only, and does
    not apply to clear legislation contrary to international law (*Polites v Commonwealth* (1945) 70 CLR 60).
    :::

    :::rule
    Principle of legality: Australian courts will not impute to Parliament an intention to abrogate or curtail certain
    human rights or fundamental freedoms, including rights and privileges recognised under the common law, unless such
    an intention is clearly manifested by unambiguous and unmistakable language (*Coco v The Queen* (1994) 179 CLR 427,
    437).
    :::

    ## Customary international law: transformation or incorporation?

    Recall: customary international law is formed when there is uniform/widespread and consistent state practice across
    a wide range of states and where there is evidence that this practice is maintained out of a sense of legal
    obligation (opinio juris). What is its effect on Australian law? The position here is less settled than it is for
    treaties. Debate surrounds two approaches:

    - **The doctrine of transformation** — customary international law only becomes part of Australian law when
      formally adopted by Parliament or the courts as part of common law.
    - **The doctrine of incorporation** — customary international law is automatically a source of Australian law,
      unless there is a rule to the contrary.

    Australia has not clearly adopted either approach — both doctrines have been recognised in High Court decisions.
    But a rule of customary international law cannot generally be adopted where inconsistent with domestic legislation
    or essential common law doctrine.

    :::case
    *Nulyarimma v Thompson* [1999] 96 FCR 153 — members of an Aboriginal community claimed that sponsorship of Native
    Title Act amendments and failure to seek World Heritage listing of the Lake Eyre region were acts of genocide, and
    argued that, as genocide is part of customary international law, Australian courts could try individuals even
    without legislation criminalising genocide. The Federal Court ruled that even if genocide is recognised as part of
    customary international law, it does not form part of Australian law in the absence of domestic legislation
    declaring genocide a crime; it accepted that the prohibition of genocide is a jus cogens norm, but without
    implementing legislation it had no effect on Australian law.
    :::

    Wilcox J (at [25]): "[I]t is one thing … for courts of a particular country to be prepared to treat a civil law rule
    like the doctrine of foreign sovereign immunity as part of its domestic law … It is another thing to say that a norm
    of international law criminalising conduct that is not made punishable by the domestic law entitles a domestic court
    to try and punish an offender against that law." Because the rule was a rule of criminal law, it definitely needed
    to be transformed.

    Merkel J, in dissent, identified criteria for customary international law to become a source of common law — points
    since cited by other judges:

    - the customary rule must have "attained … general acceptance by … the community of nations";
    - the courts must consider whether the rule has been "received into and so become a source of" Australian law, so it
      must be "not inconsistent with rules enacted by statutes or finally declared by [the courts]";
    - inconsistent rules may only be enacted by legislation;
    - once received, a rule of custom is to be treated as a true declaration of the common law;
    - the reception into domestic law will only be taken to have occurred "as from the date the particular rule … has
      been established".

    ## International law and the common law

    There is a broadly accepted view that international law serves as a legitimate influence for the development of the
    common law — the common law may have "to march in step with international law in order to provide the body of law
    to apply" (Brennan J in *Mabo v Queensland (No 2)* [1992] 175 CLR 1). More narrowly, international law is viewed as
    filling lacunae in the existing common law: "Judicial development of the common law must not be seen as a back door
    means of importing an unincorporated convention into Australian law" (Mason CJ and Deane J in *Minister for
    Immigration and Ethnic Affairs v Teoh* [1995] 183 CLR 273, 288).

    ## Interpretation of the Constitution?

    Can international law assist in the interpretation of the Constitution? There is no majority support in the High
    Court. The Constitution sits above all statutes in the Australian legal order and can only be modified by
    referendum.

    - Kirby J has espoused it in several cases: "[I]nternational law is a legitimate and important influence on the
      development of the common law and constitutional law, especially when international law declares the existence of
      universal and fundamental rights. To the full extent that its text permits, Australia's Constitution … accommodates
      itself to international law … [It] also speaks to the international community as the basic law of the Australian
      nation which is a member of that community" (*Newcrest Mining (WA) Ltd v Commonwealth* [1997] 190 CLR 513).
    - McHugh J in *Al-Kateb v Godwin* [2004] 219 CLR 562: use of international law for constitutional interpretation is
      "heretical"; it amounts to amending the Constitution without a public referendum; and international law rules are
      qualitatively different from taking into account political, social and economic developments.

    The High Court has been "very cautious in its embrace of international law; it has kept its gloves and hat on at all
    times" … international law "unsettles and challenges many of the rigidities and limitations of Australian law"
    (Hilary Charlesworth).

    ## Conclusion on Part A

    Australia is primarily a dualist system. The interaction of Australia's domestic legal system with international
    law reflects the separation of powers. The executive (and many members of the legislature) have shown a shifting
    attitude to international law — supportive of international trade law, but sceptical about the applicability of
    international human rights law to Australia (reflected in not fully implementing many treaty obligations): preserving
    Australian sovereignty is at the core of Australian unease about accepting international obligations. Members of the
    judiciary hold contrasting views on international law, and these in turn create considerable uncertainty on the
    position of international law within the Australian legal system.

    ## Part B: jurisdiction — meaning and sovereignty

    :::definition
    Jurisdiction: "…the lawful power of a State to define and enforce the rights and duties, and control the conduct, of
    natural and juridical persons" (Oxman, MPEPIL).
    :::

    In international law, the concept of jurisdiction is linked to the notion of sovereignty — supreme authority within a
    territory, subject to international requirements. Sovereignty is not a precondition for statehood; it is a
    description of statehood: it describes the attributes of statehood (Besson, "Sovereignty", MPEPIL, paras 1–2).
    Sovereignty implies:

    - **Sovereign equality** — states are regarded as equal in international law regardless of their size, population or
      wealth.
    - **Jurisdiction** — states have authority to create laws and enforce them.
    - **Territorial control** — the freedom to use and dispose of the territory under the state's jurisdiction (for
      instance, leasing it, as Cuba did with Guantanamo) and to perform activities deemed necessary to the population.
      Territory = land, the territorial sea up to 12 nautical miles from the coast, and the airspace above land and sea.
    - **Duty of non-intervention** — no other state should intrude into the state's territory: ius excludendi alios (the
      right to exclude others).
    - **Sovereign immunity** — immunity from the jurisdiction of foreign courts for acts performed by the state in its
      sovereign capacity.
    - **Diplomatic immunity** — state representatives acting in their official capacity are immune from the legal system
      of the state in which they are operating.

    ## Forms of jurisdiction

    - **Jurisdiction to prescribe** (prescriptive or legislative jurisdiction): the power of a state to apply its national
      law to any person or property — "to make its law applicable to the activities, relations, or status of persons, or
      the interests of persons in things, whether by legislation, by executive act or order, by administrative rule or
      regulation, or by determination by a court" (American Law Institute, *Restatement (Third) Foreign Relations Law of
      the United States* (1987) § 401(a)).
    - **Jurisdiction to enforce** (enforcement jurisdiction): the right of a state to put its laws into operation, e.g.
      arrest, seizure, freezing of assets and imposing fines. "Enforcement means the exercise of jurisdiction by the
      government of a state, namely, the executive branch of government … responsible for the enforcement of regulations
      and the maintenance of public order" (Rose et al, 102).
    - **Jurisdiction to adjudicate** (adjudicative jurisdiction): the power of domestic courts to hear and make a binding
      decision on a legal dispute — including power to apply the law to the facts of a case, interpret legal provisions,
      and determine the rights and obligations of the parties.

    :::case
    *The Case of the SS Lotus (France v Turkey)* (PCIJ 1927) — on prescription: "Far from laying down a general
    prohibition to the effect that States may not extend the application of their laws and the jurisdiction of their
    courts to persons, property and acts outside their territory, [international law] leaves them in this respect a wide
    measure of discretion which is only limited in certain cases by prohibitive rules; as regards other cases, every
    State remains free to adopt the principles which it regards as best and most suitable" (p 19). On enforcement: "The
    first and foremost restriction imposed by international law upon a state is that — failing the existence of a
    permissive rule to the contrary — it may not exercise its power in any form in the territory of another State" (p 18).
    :::

    States are in principle free to exercise prescriptive jurisdiction as they please, unless a prohibitive rule to the
    contrary can be identified (e.g. universal human rights). Enforcement jurisdiction can be exercised within the
    territory almost without restriction, but it is one of the most intrusive forms of jurisdiction: unauthorised
    enforcement jurisdiction within another state is illegal — a serious violation of that state's sovereignty and
    territorial integrity. Permission can be given beforehand by treaty, or after a situation has happened by agreement.

    :::case
    Eichmann (1960) — Israeli agents (a Mossad team) apprehended Nazi officer Adolf Eichmann in Argentina and smuggled him
    out without the consent of the Argentine authorities. The UN Security Council responded to the unlawful Israeli
    incursion by requesting Israel to offer compensation (eventually done through an apology). Eichmann was tried in
    Israel for crimes against humanity and war crimes and executed in 1962.
    :::

    :::case
    Lockerbie (1988) — Pan Am Flight 103, departing Heathrow for New York, exploded over Lockerbie, Scotland: 259
    passengers and crew were killed, and falling wreckage destroyed 21 houses and killed 11 people on the ground. A large
    proportion of passengers were American. The device was dispatched from Malta by Libyan nationals, passed through
    Frankfurt, and was loaded at Heathrow. The UK asserted jurisdiction on an objective territorial basis (the bomb
    exploded in UK airspace); the US and UK both asked for extradition; Libya asserted jurisdiction over its nationals and
    refused to extradite, citing fair-trial concerns, but was under substantial international pressure, particularly UN
    sanctions. Under the UK/Netherlands Agreement Concerning a Scottish Trial in the Netherlands 1998, a special Scottish
    court sat at Camp Zeist, with Scottish judges applying Scottish law in a foreign country.
    :::

    :::examtip
    The three forms illustrated with theft: prescriptive jurisdiction — the domestic criminalisation of theft (in
    Australia, s 131 of the Criminal Code); enforcement jurisdiction — the physical apprehension of a suspected thief,
    custody on remand while awaiting sentence, and imposing a sentence of imprisonment; adjudicative jurisdiction — the
    criminal prosecution of the individual.
    :::

    ## Grounds for asserting jurisdiction

    To lawfully assert prescriptive jurisdiction in cases involving a "foreign element", a state must justify the
    grounds for jurisdiction: the principle of territoriality; the nationality principle (active nationality), with the
    principle of passive personality; the principle of protection; and the principle of universality.

    ### Territorial jurisdiction

    The fundamental basis of jurisdiction, derived from state sovereignty. A state has jurisdiction over all acts, whether
    criminal or not, committed on its territory and over everyone located on the territory of that state — citizenship is
    not required. Subject to limitations imposed by international law, e.g. human rights law, a state can legislate as it
    pleases on whatever matter it desires on its own territory. (If a Greek woman living in Greece assaults her Australian
    partner there, Greece can straightforwardly assert jurisdiction on the basis of territoriality — and it would equally
    have jurisdiction if the Australian partner were the assailant, because he is in Greek territory.)

    Sometimes a sequence of events does not occur entirely within one state: a criminal offence may be initiated or
    planned in one state but committed in another ("cross-border/transnational crimes"). Two approaches:

    1. **Objective territoriality** focuses on the effects of an offence: a state has jurisdiction over a criminal offence
       that is completed on its territory even if some constituent elements of the offence took place abroad.
    2. **Subjective territoriality**: a state has jurisdiction over all criminal offences as long as they are initiated or
       planned on its territory.

    Both are important in fighting transnational crime, such as international cybercrime.

    ### Nationality (active personality)

    There is no accepted definition of nationality in international law: states are generally free to decide who they
    consider to be their nationals and under what circumstances an individual qualifies for citizenship ("domaine
    réservé") — the two most important forms of acquisition being ius soli (birth in the territory) and ius sanguinis
    (the nationality of your parents). Ships and aircraft have the nationality of the state where they are registered.

    :::case
    *Nottebohm* (ICJ, 1955) — according to state practice, nationality is "a legal bond having as its basis a social fact
    of attachment, a genuine connection of existence, interests and sentiments, together with the existence of reciprocal
    rights and duties".
    :::

    The nationality principle is relevant where a state of nationality may wish to criminally prosecute a national for
    acts committed abroad. If an individual has dual nationality, both states of nationality may assert jurisdiction on
    the basis of nationality. Many states in continental Europe tend to extend their criminal law to their nationals
    abroad; common law countries tend to be more restrictive. In Australia, for instance, a crime that is extended to
    nationals abroad is the crime of having sexual relations with people under the age of 16.

    ### Passive personality

    A state can assert its jurisdiction over an offence committed abroad on the sole ground that the victim of the offence
    was a national of the state — here we look at the nationality of the victim, not of the offender.

    :::case
    *US v Yunis* (1988, US District Court for the District of Columbia) — Yunis, a Lebanese national, was involved in the
    1985 hijacking of Royal Jordanian flight 402 with American citizens aboard. The US claimed jurisdiction over the
    non-US citizen for crimes (hostage taking) committed outside the United States, arguing his actions were against
    American citizens; Yunis was captured in international waters by the FBI and brought to the US, and the court found
    the US had jurisdiction.
    :::

    The passive personality principle remains controversial — it is not universally accepted as a solid ground in the
    same way as territoriality and active nationality, and is better as a mere subsidiary means of jurisdiction, combined
    with another ground. There is a fairness argument: if you injure an American national in a fight while on holiday in
    Spain, you would think you were governed by Spanish law, not liable under US law.

    ### Protective jurisdiction

    Allows a state to claim jurisdiction over actions committed abroad by non-citizens that threaten the nation's
    security. It requires the existence of a genuine threat to a vital state security interest — e.g. counterfeiting
    currency (or national documents like passports), espionage, conspiracy to commit treason (coup d'état), and attack on
    diplomatic personnel abroad. There may be debate about what constitutes a vital interest: the US has claimed
    protective jurisdiction over the illegal drug trade, but many states do not follow it and have instead extended their
    jurisdiction through treaties.

    ### Universal jurisdiction

    Certain offences are so serious and disruptive to the international community as a whole that any state can claim
    jurisdiction over them no matter where they have been committed, who they have been committed against or the
    nationality of the offender — there is a lack of a direct link between the state and the offence. One justification
    is preventing impunity. Originally, it was the crime of piracy (committed on the high seas, outside the jurisdiction
    of all states) that gave rise to the notion of universal jurisdiction; today it also covers genocide, war crimes,
    crimes against humanity and torture. Universal jurisdiction is based on customary international law, and it is really
    only after World War II that the right and even the duty of states to exercise it was fully recognised.

    :::statute
    Geneva Convention (IV) art 146: "The High Contracting Parties undertake to enact any legislation necessary to provide
    effective penal sanctions for persons committing, or ordering to be committed, any of the grave breaches of the
    present Convention … Each High Contracting Party shall be under the obligation to search for persons alleged to have
    committed, or to have ordered to be committed, such grave breaches, and shall bring such persons, regardless of their
    nationality, before its own courts. It may also, if it prefers, and in accordance with the provisions of its own
    legislation, hand such persons over for trial to another High Contracting Party concerned, provided such High
    Contracting Party has made out a prima facie case." Article 147 defines the grave breaches — including wilful
    killing, torture or inhuman treatment, unlawful deportation or confinement of a protected person, taking of hostages,
    and extensive destruction and appropriation of property not justified by military necessity.
    :::

    To exercise universal jurisdiction when no treaty exists establishing it is controversial, so states usually require a
    territorial link in their legislation: the alleged perpetrator must be present on their territory. In Australia,
    Division 268 of the *Criminal Code Act 1995* concerns genocide, war crimes and crimes against humanity, and usually the
    person will need to be present to be prosecuted. The number of cases initiated and defendants tried under universal
    jurisdiction has risen considerably over the past two decades (Langer et al) — because of domestic legislation
    expressly providing for it, special units within domestic law enforcement, and NGOs documenting international crimes
    and helping with the collection of evidence.

    ## Concurring jurisdiction

    Since states can assert jurisdiction in respect of a given person or matter on multiple grounds, it is not uncommon
    for more than one state to claim jurisdiction in any given situation (as in Lockerbie). There are no universally
    binding rules on how to resolve issues of concurring jurisdiction. International treaties provide clearer pathways:
    the 2001 Cybercrime Convention provides that when more than one state claims jurisdiction over an offence under the
    Convention, the states involved shall "consult with a view to determining the most appropriate jurisdiction for
    prosecution" (art 22(5)) — it does not stipulate that one ground has priority over another. In most cases, the state
    with the closest link to a particular offence is in the best position to investigate and try the offenders; practical
    considerations (where is the evidence? where is the offender?) influence the decision, so you have to evaluate case by
    case.

    :::examtip
    Tutorial hypotheticals: poisoned olive oil sent from Greece kills a man in London (objective territoriality for the
    UK, subjective territoriality and nationality for Greece); an Australian injures two Americans in Bali (territoriality
    for Indonesia, active nationality for Australia, passive personality — controversial — for the US); an XWZ member who
    tortured civilians in State A flees to Germany (universal jurisdiction over crimes against humanity and torture, with
    his presence in Germany as the territorial link).
    :::
concepts:
  - slug: il-perspective-on-national-law
    title: International law's view of national law
    visual: diagram
    visual-brief: Two scales side by side — on the international scale, a domestic "lawful" label weighs nothing against the breach; on the second, national law feeds international law as fulfilment, evidence, subsidiary source and interpretation.
    related:
      - monism-and-dualism
      - laws2000-w02-customary-international-law-elements
      - laws2000-w02-judicial-decisions-and-scholarly-writings
    depends-on:
      - laws2000-w03-invalidity-of-treaties
      - laws2000-w01-sovereign-equality-and-consent
    contrasts-with:
      - monism-and-dualism
    cases: []
    authorities:
      - vclt-art-27
      - vclt-art-46
      - ilc-draft-articles-on-state-responsibility-2001-art-3
    verify: false
    body: |
      From an international law perspective, a state cannot justify a breach of international law based on its
      internal law. Article 27 VCLT: "A party may not invoke the provisions of its internal law as justification for
      its failure to perform a treaty". Article 46 VCLT adds that a state cannot escape a treaty because its consent
      was given in breach of its internal rules on competence to conclude treaties — unless the violation was
      "manifest" (objectively evident to any state acting in accordance with normal practice and in good faith) and
      concerned a rule "of fundamental importance".

      Beyond treaties, art 3 of the ILC Draft Articles on State Responsibility (2001) — mostly recognised as
      representing customary international law — provides that whether an act is internationally wrongful "is
      governed by international law" and "is not affected by the characterization of the same act as lawful by
      internal law". So national law is (mostly) irrelevant to international obligations and state responsibility.

      Yet national law remains relevant to international law: it is the fulfilment of obligations that require
      national legislation; it is factual evidence of compliance and of state practice and opinio juris for custom;
      national court decisions can be subsidiary sources (art 38, ICJ Statute); and it can offer interpretation of
      international law and help identify general principles.

      Exam use: whenever a state pleads "our law allows it", answer with arts 27 and 46 VCLT and art 3 — domestic
      legality and international legality are two different questions.
  - slug: monism-and-dualism
    title: Monism and dualism
    visual: diagram
    visual-brief: One circle containing both international and national law (monism, direct effect) against two separate circles joined only by a transformation bridge (dualism), with Germany, the Netherlands and Australia placed along the line between them.
    related:
      - il-perspective-on-national-law
      - treaties-in-australian-law
      - customary-international-law-in-australian-law
    depends-on:
      - il-perspective-on-national-law
    contrasts-with:
      - il-perspective-on-national-law
    cases: []
    authorities:
      - german-basic-law-art-25
      - dutch-constitution-1983-arts-90-94
    verify: false
    body: |
      Two theories explain the relationship between international and national law from the domestic side.

      Monism sees national and international law as part of one single normative legal order. International law has
      direct effect (incorporation) and holds the same legal authority as national law, so courts can apply it
      directly. Inconsistency between the two must be resolved, frequently in favour of international law. It is
      often associated with the civil law tradition. Germany is a very clear example: art 25 of the Basic Law makes
      the general rules of international law "an integral part of federal law" that "take precedence over the laws
      and directly create rights and duties".

      Dualism sees international and national law as distinct legal orders. The only law that has force at the
      domestic level is national law, so international law must be transformed into domestic law to have effect
      (transformation). Inconsistencies do not arise, because the systems have different subjects and purposes, and
      national law usually has priority. It is often associated with the common law tradition.

      These are ideal types: in reality, blends of the two characterise most domestic legal orders. The Dutch
      Constitution mixes them — Parliament must approve treaties (art 91), but treaty provisions binding on all
      persons become binding once published (art 93) and override conflicting statutory regulations (art 94).

      Exam use (tutorial question 1): Australia is primarily a dualist system — treaties must be transformed, and
      clear Australian law prevails over international law.
  - slug: treaties-in-australian-law
    title: Treaties in Australian law
    visual: palace
    visual-brief: Five rooms along a corridor, one per way of transforming a treaty (new Act, amended Act, schedule, existing law, force of law), entered through a constitutional gateway of ss 51(xxix), 61 and 75(i).
    related:
      - monism-and-dualism
      - international-law-in-australian-interpretation
      - laws2000-w03-australian-treaty-making-process
    depends-on:
      - monism-and-dualism
      - laws2000-w03-consent-to-be-bound-and-entry-into-force
    contrasts-with:
      - customary-international-law-in-australian-law
    cases:
      - commonwealth-v-tasmania
      - dietrich-v-the-queen
      - new-south-wales-v-commonwealth
      - koowarta-v-bjelke-petersen
    authorities:
      - australian-constitution-cth-s51-xxix
      - australian-constitution-cth-s61
      - australian-constitution-cth-s75-i
      - diplomatic-privileges-and-immunities-act-1967-cth-s7
    verify: false
    body: |
      Three constitutional provisions matter: s 51(xxix), the external affairs power, lets federal Parliament
      legislate with respect to "external affairs"; s 61 vests the treaty-making power in the executive; and s 75(i)
      gives the High Court original jurisdiction in "matters arising under a treaty". The Constitution does not say
      what legal effect international law has domestically.

      The external affairs power "is intended to enable Australia to carry out its functions as an international
      person" (Murphy J, *New South Wales v Commonwealth*). Valid uses include legislation giving effect to treaty or
      customary obligations, affecting relations with international persons, or on a matter of "international
      concern" (*Koowarta*). In the *Tasmanian Dam Case*, being party to the World Heritage Convention let the
      Commonwealth legislate to stop a dam that would normally be a Tasmanian matter — though a mere "device" would
      probably not be legitimate.

      Treaties do not have direct effect in Australia (apart from a very limited class such as certain peace and
      boundary treaties). In *Dietrich v The Queen*, ratification of the ICCPR "has no direct legal effect upon
      domestic law" until specific legislation implements it. A treaty can be transformed by: (1) new legislation;
      (2) amending existing legislation (the Criminal Code for the Genocide Convention); (3) scheduling it to an Act
      (not full incorporation); (4) relying on existing legislation already giving effect to it; or (5) giving it the
      force of law (*Diplomatic Privileges and Immunities Act 1967* s 7).

      Exam use: ratification alone creates no justiciable rights.
  - slug: international-law-in-australian-interpretation
    title: International law as an aid to interpretation
    visual: explainer
    visual-brief: A statute's ambiguous word passing through a sequence of gates — incorporated text, s 15AB conditions, the Jumbunna presumption, the principle of legality — with a hard stop wherever the words are clear.
    related:
      - treaties-in-australian-law
      - customary-international-law-in-australian-law
      - laws2000-w03-treaty-interpretation
    depends-on:
      - treaties-in-australian-law
    contrasts-with:
      - treaties-in-australian-law
    cases:
      - applicant-a-v-minister-for-immigration-and-ethnic-affairs
      - yager-v-the-queen
      - jumbunna-coal-mine-nl-v-victoria-coal-miners-association
      - polites-v-commonwealth
      - coco-v-the-queen
      - newcrest-mining-wa-ltd-v-commonwealth
      - al-kateb-v-godwin
    authorities:
      - acts-interpretation-act-1901-cth-s15ab
      - law-society-nsw-practitioners-guide-to-international-law-2014
    verify: false
    body: |
      International law shapes how Australian law is read. Where a statute directly
      incorporates a treaty's text, it is interpreted in line with the treaty's meaning unless Parliament expressed a
      contrary intention (*Applicant A*). Under s 15AB(2)(d) of the *Acts Interpretation Act 1901* (Cth), a treaty
      can assist interpretation only if (a) Australia actually or contemplatedly participated in it before the Act
      was enacted, and (b) it is used to confirm the ordinary meaning, or the Act is ambiguous or obscure or would
      otherwise produce a manifestly absurd or unreasonable result. But a treaty cannot modify words that are
      otherwise clear (*Yager*, Mason J).

      Two common law presumptions: in a case of ambiguity, courts favour a construction that accords with
      international law (*Jumbunna*) — a presumption only, which does not apply to clear contrary legislation
      (*Polites*); and the principle of legality — courts will not impute to Parliament an intention to curtail
      fundamental rights and freedoms unless it is clearly manifested by unambiguous language (*Coco*).

      The Practitioner's Guide adds that obligations are identified as they exist when the interpretive question
      arises, and that in conflict, international law cannot override clear and valid Australian law — Parliament
      may legislate in breach, "taking the risk of international complications".

      The Constitution? No majority support. Kirby J (*Newcrest*) saw it as accommodating international law "to the
      full extent that its text permits"; McHugh J (*Al-Kateb*) called that "heretical" — amending the Constitution
      without a referendum.

      Exam use: clear words always win.
  - slug: customary-international-law-in-australian-law
    title: Customary international law in Australian law
    visual: explainer
    visual-brief: A customary rule approaching the common law along two paths — automatic entry (incorporation) or a formal act of adoption (transformation) — both blocked by the same wall of inconsistent statute and essential common law doctrine.
    related:
      - treaties-in-australian-law
      - international-law-in-australian-interpretation
      - laws2000-w02-customary-international-law-elements
    depends-on:
      - monism-and-dualism
      - laws2000-w02-customary-international-law-elements
    contrasts-with:
      - treaties-in-australian-law
    cases:
      - nulyarimma-v-thompson
      - mabo-v-queensland-no-2
      - minister-for-immigration-and-ethnic-affairs-v-teoh
    authorities: []
    verify: false
    body: |
      The position on custom is less settled than for treaties. Two doctrines compete. Transformation: customary
      international law only becomes part of Australian law when formally adopted by Parliament or the courts as part
      of the common law. Incorporation: customary international law is automatically a source of Australian law,
      unless there is a rule to the contrary. Australia has not clearly adopted either — both have been recognised in
      High Court decisions — but either way a customary rule cannot generally be adopted where inconsistent with
      domestic legislation or essential common law doctrine.

      *Nulyarimma v Thompson*: Aboriginal applicants argued that genocide, as customary international law, could be
      tried in Australian courts without legislation. The Federal Court held that even if genocide is part of
      customary international law — and even accepting its prohibition is jus cogens — it does not form part of
      Australian law without legislation declaring it a crime — criminal norms are different (Wilcox J). Merkel
      J, dissenting, set criteria: general acceptance by the community of nations; reception, so not inconsistent with
      statute or declared common law; once received, a true declaration of the common law, as from the date the rule
      was established.

      International law is a legitimate influence on the common law — it may "march in step" (Brennan J, *Mabo (No
      2)*) — but not "a back door means of importing an unincorporated convention" (Mason CJ and Deane J, *Teoh*).

      Exam use: a criminal customary norm needs legislation first.
  - slug: forms-of-jurisdiction
    title: Forms of jurisdiction
    visual: diagram
    visual-brief: A theft followed through three lanes — the law making theft a crime (prescribe), the arrest and imprisonment (enforce), the prosecution in court (adjudicate) — with the enforcement lane stopping hard at the border.
    related:
      - grounds-of-jurisdiction
      - laws2000-w01-sovereign-equality-and-consent
    depends-on:
      - laws2000-w01-sovereign-equality-and-consent
    contrasts-with:
      - grounds-of-jurisdiction
    cases:
      - ss-lotus-france-v-turkey
    authorities: []
    verify: false
    body: |
      Jurisdiction is "the lawful power of a State to define and enforce the rights and duties, and control the
      conduct, of natural and juridical persons" (Oxman). It is linked to sovereignty — supreme authority within a
      territory — which also implies sovereign equality, territorial control, non-intervention (ius excludendi alios),
      sovereign immunity and diplomatic immunity.

      Three forms. Jurisdiction to prescribe: the power to make national law applicable to persons, property and
      activities, by legislation, executive act, regulation or court determination. In *Lotus* the PCIJ said
      international law leaves states "a wide measure of discretion" to extend their laws beyond their territory,
      limited only by prohibitive rules. Jurisdiction to enforce: the executive putting laws into operation — arrest,
      seizure, freezing assets, fines. It is the most intrusive form, and *Lotus* sets the "first and foremost
      restriction": failing a permissive rule, a state "may not exercise its power in any form in the territory of
      another State". Israel's 1960 seizure of Eichmann in Argentina was unlawful; the Security Council requested
      compensation. Jurisdiction to adjudicate: domestic courts hearing and bindingly deciding disputes — in principle
      territorial, though Lockerbie saw a Scottish court sit in the Netherlands applying Scottish law.

      Theft illustrates all three: criminalising theft is prescriptive; arresting, remanding and imprisoning the thief
      is enforcement; prosecuting them is adjudicative.

      Exam use: prescription reaches abroad unless prohibited; enforcement abroad is prohibited unless permitted.
  - slug: grounds-of-jurisdiction
    title: Grounds for asserting jurisdiction
    visual: palace
    visual-brief: Five rooms in order — territory (with objective and subjective doors), active nationality, passive personality, protection, universality — each asking one question about the link to the state, ending in a courtyard where concurring claims meet.
    related:
      - forms-of-jurisdiction
    depends-on:
      - forms-of-jurisdiction
    contrasts-with:
      - forms-of-jurisdiction
    cases:
      - nottebohm-case
      - us-v-yunis
    authorities:
      - geneva-convention-iv-art-146
      - criminal-code-act-1995-cth-div-268
      - cybercrime-convention-2001-art-22-5
    verify: false
    body: |
      Where there is a "foreign element", a state must justify prescriptive jurisdiction on a recognised ground.

      1. Territoriality — the fundamental ground: jurisdiction over all acts on the territory and everyone located
         there, citizen or not. For cross-border crimes, objective territoriality covers an offence completed on the
         territory though elements occurred abroad; subjective territoriality covers offences initiated or planned on
         it.
      2. Active nationality — a state may prosecute its nationals for acts abroad; dual nationals can face both
         states. States largely decide who their nationals are; *Nottebohm* describes nationality as "a genuine
         connection of existence, interests and sentiments". Ships and aircraft take their state of registration.
      3. Passive personality — jurisdiction because the victim is a national (*US v Yunis*). It remains controversial
         and is better as a subsidiary ground.
      4. Protection — acts abroad by non-citizens posing a genuine threat to a vital security interest:
         counterfeiting currency, espionage, coups, attacks on diplomats.
      5. Universality — offences so serious that any state may act, with no direct link: piracy originally; now
         genocide, war crimes, crimes against humanity and torture (Geneva Convention IV art 146; Criminal Code
         Div 268). Without a treaty it is controversial, so states usually require the accused's presence.

      Concurring jurisdiction has no universally binding rule; treaties like the Cybercrime Convention (art 22(5))
      require consultation, and usually the state with the closest link is best placed.

      Exam use: for each state, name the link — place, offender, victim, security interest or the crime itself.
cases:
  - slug: commonwealth-v-tasmania
    name: Commonwealth v Tasmania (Tasmanian Dam Case)
    citation: "[1983] 158 CLR 1"
    aglc: Commonwealth v Tasmania [1983] 158 CLR 1
    facts: |
      In 1974 Australia became party to the World Heritage Convention. The Commonwealth passed legislation to
      protect part of Tasmania's wilderness from the building of a dam on the Gordon River. The Tasmanian
      Government challenged the validity of the Commonwealth legislation on the grounds that the Commonwealth had
      no power to legislate on state matters, such as the dam.
    issue: |
      Whether the Commonwealth had the power, under the external affairs power in s 51(xxix) of the Constitution, to
      stop the Tasmanian Government from damming the Gordon River under Commonwealth legislation.
    held: |
      The High Court majority held that, even though the dam would normally be a matter for Tasmania, in light of
      Australia's international obligations the Commonwealth was entitled to intervene. Being a party to the World
      Heritage Convention directly relates to external affairs, which allows the Commonwealth to pass laws that give
      effect to Australia's international legal obligations. However, if the Commonwealth's use of the external
      affairs power was no more than a device to exercise legislative power, it would probably not be legitimate.
    ratio: |
      Legislation giving effect to a treaty to which Australia is party is a valid exercise of the external affairs
      power, even on a subject otherwise within state competence, provided the power is not used merely as a device.
    significance: |
      The leading illustration of how the external affairs power lets the Commonwealth transform treaty
      obligations into domestic law in a federation — the lecture adds the same conclusion would follow for
      customary international law.
    why-here: Used to show that treaty obligations can give the Commonwealth legislative power over matters that would otherwise belong to the states.
    verify: false
  - slug: dietrich-v-the-queen
    name: Dietrich v The Queen
    citation: (1992) 177 CLR 292
    aglc: Dietrich v The Queen (1992) 177 CLR 292
    facts: |
      The appellant was tried without legal representation. He claimed he should have had access to publicly funded
      representation and so was denied a fair trial, relying on the International Covenant on Civil and Political
      Rights (ICCPR), which guarantees the right to a fair trial and free representation in certain cases (art
      14(3)(d)), and to which Australia is party.
    issue: |
      Whether Australia's ratification of the ICCPR gave the appellant rights enforceable in an Australian court.
    held: |
      "Ratification of the ICCPR as an executive act has no direct legal effect upon domestic law; the rights and
      obligations contained in the ICCPR are not incorporated into Australian law unless and until specific
      legislation is passed implementing the provisions. No such legislation has been passed" (Mason CJ and McHugh
      J). The lecture adds that a treaty annexed to a statute (here the Human Rights and Equal Opportunity Commission
      Act) does not in itself create justiciable rights.
    ratio: |
      Treaties do not have direct effect in Australia; ratification is an executive act that creates no domestic
      rights until the treaty is transformed by legislation.
    significance: |
      Confirms the dualist position for treaties in Australia and why transformation (new legislation, amendment,
      force of law) matters.
    why-here: Authority that ratification alone does not make a treaty part of Australian law.
    verify: false
  - slug: new-south-wales-v-commonwealth
    name: New South Wales v Commonwealth
    citation: "[1975]"
    aglc: New South Wales v Commonwealth [1975]
    facts: |
      The materials do not give the facts of this case; they quote only Murphy J's statement on the purpose of the
      external affairs power.
    issue: |
      The purpose and scope of the external affairs power in s 51(xxix) of the Constitution (as quoted in the
      materials).
    held: |
      Murphy J: s 51(xxix) "is intended to enable Australia to carry out its functions as an international person,
      fulfilling its international obligations and acting effectively as a member of the community of nations".
    ratio: |
      The external affairs power exists so that Australia can act as an international person and fulfil its
      international obligations.
    significance: |
      Quoted on the slides as the statement of what the external affairs power is for.
    why-here: Used for the purpose of s 51(xxix) before turning to its valid scope.
    verify: true
  - slug: koowarta-v-bjelke-petersen
    name: Koowarta v Bjelke-Petersen
    citation: "[1982] HCA 27"
    aglc: Koowarta v Bjelke-Petersen [1982] HCA 27
    facts: |
      The materials do not give the facts of this case; it is cited only for one category of valid use of the
      external affairs power.
    issue: |
      The scope of the external affairs power (as cited in the materials).
    held: |
      Cited for the proposition that legislation related to a matter of "international concern" falls within the
      valid scope of the external affairs power.
    ratio: |
      A matter of "international concern" can support legislation under s 51(xxix).
    significance: |
      Listed on the slides alongside treaty obligations, customary obligations and relations with international
      persons as a valid basis for external affairs legislation.
    why-here: Authority for the "international concern" limb of the external affairs power.
    verify: true
  - slug: applicant-a-v-minister-for-immigration-and-ethnic-affairs
    name: Applicant A v Minister for Immigration and Ethnic Affairs
    citation: (1997) 190 CLR 225
    aglc: Applicant A v Minister for Immigration and Ethnic Affairs (1997) 190 CLR 225
    facts: |
      The materials do not give the facts of this case; it is cited only for a rule of statutory interpretation.
    issue: |
      How to interpret a statute that directly incorporates the text of a treaty.
    held: |
      Cited for the proposition that where a statute directly incorporates the text of a treaty, the statute should
      be interpreted in line with the meaning given to it in the treaty unless the legislator expressed a contrary
      intention.
    ratio: |
      Incorporated treaty text takes its treaty meaning, absent a contrary legislative intention.
    significance: |
      The first of the ways a treaty can guide the reading of Australian legislation.
    why-here: Authority for reading incorporated treaty text consistently with the treaty.
    verify: true
  - slug: yager-v-the-queen
    name: Yager v The Queen
    citation: "[1977] 139 CLR 28"
    aglc: Yager v The Queen [1977] 139 CLR 28
    facts: |
      The materials do not give the facts of this case; it is cited only for Mason J's limit on using treaties in
      interpretation.
    issue: |
      Whether a treaty can alter the meaning of clear statutory words.
    held: |
      Mason J: a treaty cannot qualify or modify the meaning of legislative words or expressions which are otherwise
      clear.
    ratio: |
      Treaties may assist interpretation but never override clear statutory language.
    significance: |
      The limit that sits on top of s 15AB and the Jumbunna presumption.
    why-here: Used to show that clear words in an Act always prevail over a treaty.
    verify: true
  - slug: jumbunna-coal-mine-nl-v-victoria-coal-miners-association
    name: Jumbunna Coal Mine NL v Victoria Coal Miners' Association
    citation: (1908) 6 CLR 309
    aglc: Jumbunna Coal Mine NL v Victoria Coal Miners' Association (1908) 6 CLR 309
    facts: |
      The materials do not give the facts of this case; it is cited only for the common law presumption of
      consistency with international law.
    issue: |
      How courts should resolve an ambiguity in a statute where one reading accords with international law.
    held: |
      Cited for the proposition that in a case of ambiguity in a statute, the courts should favour a construction
      that accords with international law. It is a presumption only.
    ratio: |
      Ambiguous statutes are presumed to conform with international law.
    significance: |
      The first of the two common law presumptions covered in the lecture; the slides note conflicting views on how
      far it should be applied.
    why-here: Authority for the presumption that ambiguous legislation is read consistently with international law.
    verify: true
  - slug: polites-v-commonwealth
    name: Polites v Commonwealth
    citation: (1945) 70 CLR 60
    aglc: Polites v Commonwealth (1945) 70 CLR 60
    facts: |
      The materials do not give the facts of this case; it is cited only for the limit on the Jumbunna presumption.
    issue: |
      Whether the presumption of consistency with international law applies to clear legislation.
    held: |
      Cited for the proposition that the presumption does not apply to clear legislation contrary to international
      law.
    ratio: |
      Clear legislation contrary to international law is applied as written.
    significance: |
      Shows the presumption of consistency is only a presumption, which clear words displace.
    why-here: Used to show Parliament can clearly legislate contrary to international law.
    verify: true
  - slug: coco-v-the-queen
    name: Coco v The Queen
    citation: (1994) 179 CLR 427
    aglc: Coco v The Queen (1994) 179 CLR 427, 437
    facts: |
      The materials do not give the facts of this case; it is cited only for the principle of legality.
    issue: |
      When a court will read a statute as abrogating fundamental rights or freedoms.
    held: |
      Cited (at 437) for the presumption that Australian courts will not impute to Parliament an intention to
      abrogate or curtail certain human rights or fundamental freedoms, including rights and privileges recognised
      under the common law, unless such an intention is clearly manifested by unambiguous and unmistakable language.
    ratio: |
      Parliament must use unambiguous and unmistakable language to curtail fundamental rights (principle of
      legality).
    significance: |
      The second common law presumption covered in the lecture, adding protection for rights and freedoms.
    why-here: Authority for the principle of legality.
    verify: true
  - slug: newcrest-mining-wa-ltd-v-commonwealth
    name: Newcrest Mining (WA) Ltd v Commonwealth
    citation: "[1997] 190 CLR 513"
    aglc: Newcrest Mining (WA) Ltd v Commonwealth [1997] 190 CLR 513
    facts: |
      The materials do not give the facts of this case; they quote only Kirby J's view on international law and the
      Constitution.
    issue: |
      Whether international law can assist in the interpretation of the Australian Constitution.
    held: |
      Kirby J: "[I]nternational law is a legitimate and important influence on the development of the common law
      and constitutional law, especially when international law declares the existence of universal and fundamental
      rights. To the full extent that its text permits, Australia's Constitution … accommodates itself to
      international law … It also speaks to the international community as the basic law of the Australian nation
      which is a member of that community."
    ratio: |
      No majority ratio is given in the materials; the quoted view is Kirby J's alone.
    significance: |
      The strongest judicial statement in favour of using international law to interpret the Constitution — a view
      without majority support in the High Court.
    why-here: Used for Kirby J's side of the debate on international law and constitutional interpretation.
    verify: true
  - slug: al-kateb-v-godwin
    name: Al-Kateb v Godwin
    citation: "[2004] 219 CLR 562"
    aglc: Al-Kateb v Godwin [2004] 219 CLR 562
    facts: |
      The materials do not give the facts of this case; they give only McHugh J's view on international law and the
      Constitution.
    issue: |
      Whether international law can assist in the interpretation of the Australian Constitution.
    held: |
      McHugh J: use of international law for constitutional interpretation is "heretical"; it would amount to
      amending the Constitution without a public referendum; and international law rules are qualitatively different
      from taking into account political, social and economic developments.
    ratio: |
      No majority ratio is given in the materials; the quoted view is McHugh J's.
    significance: |
      The opposing view to Kirby J, grounded in the separation of powers — unelected judges should not change the
      Constitution, which only a referendum can amend.
    why-here: Used for McHugh J's side of the debate on international law and constitutional interpretation.
    verify: true
  - slug: nulyarimma-v-thompson
    name: Nulyarimma v Thompson
    citation: "[1999] 96 FCR 153"
    aglc: Nulyarimma v Thompson [1999] 96 FCR 153
    facts: |
      Australia is party to the 1948 Genocide Convention. Members of an Aboriginal community claimed that the
      sponsorship of Native Title Act amendments and the failure to seek World Heritage listing of the Lake Eyre
      region were acts of genocide. They argued that genocide is part of customary international law, and that even
      without legislation criminalising genocide within Australia, Australian courts could try individuals accused of
      genocide.
    issue: |
      Whether the customary international law prohibition of genocide was part of Australian law.
    held: |
      The Federal Court ruled that even if genocide is recognised as part of customary international law, it does not
      form part of Australian law in the absence of domestic legislation declaring genocide a crime. It accepted that
      the prohibition of genocide constituted a jus cogens norm but, without implementing legislation, it had no
      effect on Australian law. Wilcox J (at [25]) distinguished treating a civil law rule like foreign sovereign
      immunity as domestic law from a norm "criminalising conduct that is not made punishable by the domestic law".
      Merkel J dissented, identifying criteria for customary international law to become a source of the common law.
    ratio: |
      A customary international law crime, even a jus cogens one, cannot be tried in an Australian court without
      domestic legislation making it an offence.
    significance: |
      The key Australian authority on custom and domestic law; Merkel J's dissenting criteria (general acceptance,
      reception not inconsistent with statute or declared common law, reception as from the date the rule was
      established) have been cited by other judges since.
    why-here: Used to show the limits of incorporating customary international law, especially criminal norms.
    verify: false
  - slug: mabo-v-queensland-no-2
    name: Mabo v Queensland (No 2)
    citation: "[1992] 175 CLR 1"
    aglc: Mabo v Queensland (No 2) [1992] 175 CLR 1
    facts: |
      The materials do not give the facts of this case; they quote only Brennan J on international law and the
      common law.
    issue: |
      What influence international law has on the development of the common law.
    held: |
      Brennan J: the common law may have "to march in step with international law in order to provide the body of
      law to apply".
    ratio: |
      International law is a legitimate influence on the development of the common law (as quoted).
    significance: |
      Illustrates the broadly accepted view that international law can shape the common law.
    why-here: Used for the broad view of international law's influence on the common law.
    verify: true
  - slug: minister-for-immigration-and-ethnic-affairs-v-teoh
    name: Minister for Immigration and Ethnic Affairs v Teoh
    citation: "[1995] 183 CLR 273"
    aglc: Minister for Immigration and Ethnic Affairs v Teoh [1995] 183 CLR 273, 288
    facts: |
      The materials do not give the facts of this case; they quote only Mason CJ and Deane J on the limits of using
      international law to develop the common law.
    issue: |
      Whether judicial development of the common law can be used to give effect to an unincorporated treaty.
    held: |
      Mason CJ and Deane J (at 288): "Judicial development of the common law must not be seen as a back door means
      of importing an unincorporated convention into Australian law."
    ratio: |
      International law may fill gaps in the common law, but the common law is not a back door for unincorporated
      treaties.
    significance: |
      The narrower view of international law's influence on the common law — filling lacunae only.
    why-here: Used to show the limit on international law's influence over the common law.
    verify: true
  - slug: nottebohm-case
    name: Nottebohm Case
    citation: (ICJ, 1955)
    aglc: Nottebohm Case (ICJ, 1955)
    facts: |
      The materials do not give the facts of this case; they quote only the Court's description of nationality.
    issue: |
      What nationality means according to state practice.
    held: |
      According to state practice, nationality is "a legal bond having as its basis a social fact of attachment, a
      genuine connection of existence, interests and sentiments, together with the existence of reciprocal rights and
      duties".
    ratio: |
      Nationality rests on a genuine connection between the individual and the state.
    significance: |
      The standard description of nationality, the link on which the active nationality principle of jurisdiction
      rests.
    why-here: Used to explain the link that justifies nationality-based jurisdiction.
    verify: true
  - slug: us-v-yunis
    name: US v Yunis
    citation: (1988) US District Court for the District of Columbia
    aglc: US v Yunis (1988) US District Court for the District of Columbia
    facts: |
      Yunis, a Lebanese national, was involved in the hijacking of Royal Jordanian flight 402 in 1985 with American
      citizens aboard the aircraft. He was captured in international waters by the FBI and brought to the US to stand
      trial.
    issue: |
      Whether the US had jurisdiction over a non-US citizen for crimes (hostage taking) committed outside the United
      States.
    held: |
      The US argued it had jurisdiction because Yunis's actions were against American citizens and so violated US
      law; the court found that the US had jurisdiction.
    ratio: |
      A state may assert jurisdiction over an offence committed abroad on the ground that its nationals were the
      victims (passive personality).
    significance: |
      The leading example of the passive personality principle — which remains controversial and is better treated
      as a subsidiary ground of jurisdiction.
    why-here: Used to illustrate passive personality jurisdiction and why it is contested.
    verify: true
authorities:
  - slug: vclt-art-27
    title: Vienna Convention on the Law of Treaties 1969 art 27
    kind: treaty
    text: |
      "A party may not invoke the provisions of its internal law as justification for its failure to perform a
      treaty…"
    gloss: A state's own law is never an excuse for failing to perform a treaty.
    cases: []
    verify: false
  - slug: ilc-draft-articles-on-state-responsibility-2001-art-3
    title: International Law Commission Draft Articles on State Responsibility (2001) art 3
    kind: article
    text: |
      "The characterization of an act of a State as internationally wrongful is governed by international law. Such
      characterization is not affected by the characterization of the same act as lawful by internal law."
    gloss: Whether conduct breaches international law is decided by international law, whatever domestic law says.
    cases: []
    verify: false
  - slug: german-basic-law-art-25
    title: Basic Law for the Federal Republic of Germany art 25
    kind: other
    text: |
      Primacy of international law: "The general rules of international law shall be an integral part of federal
      law. They shall take precedence over the laws and directly create rights and duties for the inhabitants of the
      federal territory."
    gloss: A clear monist provision — general international law applies directly and prevails over German statutes.
    cases: []
    verify: false
  - slug: dutch-constitution-1983-arts-90-94
    title: Constitution of the Kingdom of the Netherlands 1983 arts 90–94
    kind: other
    text: |
      Art 90: "The Government shall promote the development of the international rule of law." Art 91(1): "The
      Kingdom shall not be bound by treaties, nor shall such treaties be denounced without the prior approval of the
      Parliament…" Art 91(3): "Any provisions of a treaty that conflict with the Constitution or which lead to
      conflicts with it may be approved by the Chambers of the Parliament only if at least two-thirds of the votes
      cast are in favour." Art 93: "Provisions of treaties and of resolutions by international institutions, which
      may be binding on all persons by virtue of their contents shall become binding after they have been published."
      Art 94: "Statutory regulations in force within the Kingdom shall not be applicable if such application is in
      conflict with provisions of treaties that are binding on all persons or of resolutions by international
      institutions."
    gloss: A blended approach — parliamentary approval is required, but published treaty provisions then apply directly and override conflicting statutes.
    cases: []
    verify: false
  - slug: australian-constitution-cth-s51-xxix
    title: Constitution (Cth) s 51(xxix)
    kind: other
    text: |
      Known as the external affairs power: grants federal Parliament the power to enact legislation with respect to
      "external affairs".
    gloss: Lets the Commonwealth legislate to implement international obligations, even on matters otherwise left to the states.
    cases:
      - commonwealth-v-tasmania
      - new-south-wales-v-commonwealth
      - koowarta-v-bjelke-petersen
    verify: false
  - slug: australian-constitution-cth-s75-i
    title: Constitution (Cth) s 75(i)
    kind: other
    text: |
      Vests the High Court with original jurisdiction in relation to "matters arising under a treaty".
    gloss: Matters arising under a treaty can be brought directly in the High Court.
    cases: []
    verify: false
  - slug: diplomatic-privileges-and-immunities-act-1967-cth-s7
    title: Diplomatic Privileges and Immunities Act 1967 (Cth) s 7
    kind: statute
    text: |
      Gives the force of law in Australia to certain articles of the Vienna Convention on Diplomatic Relations — as
      the lecture records, arts 1, 22 to 24 and 27 to 40.
    gloss: An example of transforming a treaty by giving its provisions the force of law.
    cases: []
    verify: true
  - slug: acts-interpretation-act-1901-cth-s15ab
    title: Acts Interpretation Act 1901 (Cth) s 15AB
    kind: statute
    text: |
      Extrinsic material, including a relevant treaty (s 15AB(2)(d)), can be used to interpret an Act — to confirm
      the ordinary meaning of the text (s 15AB(1)(a)), or where the provision is ambiguous or obscure, or the
      ordinary meaning would lead to a result that is manifestly absurd or unreasonable (s 15AB(1)(b)). As the
      materials explain, the treaty assists only if there was actual or contemplated participation by Australia in it
      before the Act was enacted.
    gloss: Treaties may help interpret an Act, but only in the listed circumstances and only if Australia was in or contemplating the treaty first.
    cases:
      - yager-v-the-queen
    verify: true
  - slug: law-society-nsw-practitioners-guide-to-international-law-2014
    title: Law Society of NSW, The Practitioner's Guide to International Law (2nd ed, 2014) — basic approach
    kind: other
    text: |
      (i) International law as such does not form part of Australian law. (ii) Effect is first and foremost given to
      Australian law. (iii) Australian courts may refer to international law. (iv) In the absence of any contrary
      indications, Australian law is to be interpreted consistently with Australia's international obligations. (v)
      The international obligations applicable to Australia are generally to be identified as they exist at the time
      the interpretive question arises. (vi) In the event of conflict, international law cannot be invoked to override
      clear and valid Australian legal provisions. (vii) Parliament may legislate on matters in breach of
      international law, thereby "taking the risk of international complications". (viii) Australian courts should
      give special attention to protecting human rights and fundamental freedoms as recognised under international
      law.
    gloss: Eight working principles summarising Australia's primarily dualist approach to international law.
    cases: []
    verify: false
  - slug: geneva-convention-iv-art-146
    title: Geneva Convention (IV) art 146
    kind: treaty
    text: |
      "The High Contracting Parties undertake to enact any legislation necessary to provide effective penal sanctions
      for persons committing, or ordering to be committed, any of the grave breaches of the present Convention defined
      in the following Article. Each High Contracting Party shall be under the obligation to search for persons
      alleged to have committed, or to have ordered to be committed, such grave breaches, and shall bring such
      persons, regardless of their nationality, before its own courts. It may also, if it prefers, and in accordance
      with the provisions of its own legislation, hand such persons over for trial to another High Contracting Party
      concerned, provided such High Contracting Party has made out a prima facie case."
    gloss: A treaty example of universal jurisdiction — search for grave-breach suspects and try them, whatever their nationality, or hand them over.
    cases: []
    verify: false
  - slug: criminal-code-act-1995-cth-div-268
    title: Criminal Code Act 1995 (Cth) div 268
    kind: statute
    text: |
      Division 268 of the Criminal Code concerns genocide, war crimes and crimes against humanity and provides for
      universal jurisdiction over them; as the lecture explains, usually the person will need to be present in
      Australia to be prosecuted.
    gloss: Australia's domestic legislation expressly providing for universal jurisdiction over core international crimes.
    cases: []
    verify: true
  - slug: cybercrime-convention-2001-art-22-5
    title: Convention on Cybercrime 2001 art 22(5)
    kind: treaty
    text: |
      When more than one state claims jurisdiction over an offence under the Convention, the states involved shall
      "consult with a view to determining the most appropriate jurisdiction for prosecution".
    gloss: A treaty pathway for concurring jurisdiction — consult, without ranking any ground above another.
    cases: []
    verify: false
questions:
- key: q101
  type: mcq
  concept: il-perspective-on-national-law
  difficulty: 1
  set: pretest
  stem: Under art 27 VCLT, can a state rely on a provision of its own internal law to justify failing to perform a treaty?
  options:
  - text: Yes, but only if the internal law is a constitutional provision rather than an ordinary statute passed later.
    why: 'Tempting because constitutions feel weightier than statutes, but art 27 makes no such distinction: no provision
      of internal law justifies non-performance.'
  - text: No — a party may not invoke its internal law as justification for failing to perform a treaty.
    correct: true
    why: 'Correct — art 27 VCLT says exactly this: the absence of a law, or a contradictory domestic provision, is no justification
      for non-performance.'
  - text: Yes, provided the state notifies the other parties of the conflict before the treaty's performance falls due.
    why: Tempting because notice sounds like good faith, but art 27 contains no notice exception; internal law is simply
      not a justification at all.
- key: q102
  type: mcq
  concept: il-perspective-on-national-law
  difficulty: 2
  stem: State A has breached a treaty. Its foreign minister argues the conduct was 'perfectly lawful under our own statute'.
    Which provision most directly answers that argument for breaches of international law generally, not only treaties?
  options:
  - text: Article 46 VCLT, because it deals with violations of internal law regarding competence to conclude treaties.
    why: Tempting because art 46 mentions internal law, but it concerns whether consent to a treaty was validly given, not
      whether conduct is wrongful in general.
  - text: Article 38 of the ICJ Statute, because national court decisions are only subsidiary sources.
    why: Tempting because art 38 appears in this topic, but it lists the sources a court applies; it does not say domestic
      legality is irrelevant to wrongfulness.
  - text: Article 3 of the ILC Draft Articles on State Responsibility (2001), covering all obligations.
    correct: true
    why: Correct — art 3 provides that characterisation as internationally wrongful is governed by international law and
      is not affected by domestic lawfulness, extending beyond treaties.
- key: q103
  type: mcq
  concept: il-perspective-on-national-law
  difficulty: 2
  stem: Why does the lecture say we 'bother with' the ILC Draft Articles on State Responsibility, even though ILC products
    are not binding as such?
  options:
  - text: Because they were adopted as a treaty by the UN General Assembly in 2001 and are binding on all members.
    why: Tempting because 2001 is the date given, but the materials describe them as ILC draft articles, not a treaty; their
      force comes from reflecting custom.
  - text: Because Australian courts are required by statute to apply them when interpreting legislation.
    why: Wrong — no statute in the materials requires this; the reason given is about their status in international law,
      namely customary international law.
  - text: Because they mostly represent, or have been recognised as representing, customary international law.
    correct: true
    why: Correct — the lecturer explains most of the rules in the draft articles happen to be binding because they reflect
      customary international law.
- key: q104
  type: mcq
  concept: il-perspective-on-national-law
  difficulty: 3
  stem: State B's treaty consent was given by an official who, under B's constitution, lacked authority. B now wants to
    escape the treaty. Under art 46 VCLT, what must B show?
  options:
  - text: Only that the official lacked authority under its internal law; any breach of competence rules invalidates consent.
    why: Tempting because the official really lacked authority, but art 46 is framed as a prohibition with a narrow exception
      — an ordinary breach is not enough.
  - text: That the violation was manifest and concerned a rule of its internal law of fundamental importance to it.
    correct: true
    why: Correct — art 46 allows a state to invoke an internal-law violation only if it was manifest (objectively evident)
      and the rule was of fundamental importance.
  - text: That the other parties actually knew of the violation, whether or not it was objectively evident to them.
    why: Tempting because knowledge sounds relevant, but art 46(2) asks whether the violation would be objectively evident
      to any state acting normally and in good faith.
- key: q105
  type: mcq
  concept: il-perspective-on-national-law
  difficulty: 2
  stem: According to art 46(2) VCLT, when is a violation of internal law 'manifest'?
  options:
  - text: When it has been declared unconstitutional by the state's highest domestic court.
    why: Tempting because a court ruling sounds like proof, but art 46(2) uses an international, objective test, not a domestic
      judicial declaration.
  - text: When the state's parliament passes a resolution disowning the treaty within a reasonable time.
    why: Wrong — a later parliamentary resolution is exactly the kind of domestic step art 27 and art 46 prevent from affecting
      international obligations.
  - text: When it would be objectively evident to any state conducting itself in accordance with normal practice and in
      good faith.
    correct: true
    why: 'Correct — this is the definition in art 46(2): the test is objective evidence to a state acting normally and in
      good faith.'
- key: q106
  type: mcq
  concept: il-perspective-on-national-law
  difficulty: 1
  stem: Which statement best summarises the relationship between international and national law from the international law
    perspective?
  options:
  - text: National law and international law are equal, so a conflict must be resolved by negotiation.
    why: Tempting because sovereign equality is a theme, but equality of states is not equality of legal orders; international
      law treats national law as mostly irrelevant.
  - text: National law is (mostly) irrelevant to international obligations and to state responsibility.
    correct: true
    why: 'Correct — the slide puts it simply: from international law''s perspective national law is (mostly) irrelevant
      to obligations and state responsibility.'
  - text: National law prevails whenever a state's highest court has upheld it after the treaty was signed.
    why: Wrong — that is closer to the Australian domestic perspective; international law does not let a domestic ruling
      excuse a breach.
- key: q107
  type: mcq
  concept: il-perspective-on-national-law
  difficulty: 2
  stem: Which of the following is NOT one of the ways the lecture says national law remains relevant to international law?
  options:
  - text: National law can be evidence of state practice and opinio juris for customary international law.
    why: 'Wrong choice — this is listed on slide 7: national law can serve as evidence for both elements of custom.'
  - text: National court decisions can act as subsidiary sources of international law.
    why: Wrong choice — slide 7 lists this, linking national decisions to art 38 of the ICJ Statute as subsidiary sources.
  - text: National law is often the fulfilment of obligations that require legislation and action.
    why: 'Wrong choice — slide 7 lists this first: many obligations require enactment of national legislation, so national
      law fulfils them.'
  - text: National law can override a treaty obligation if it was enacted after the treaty.
    correct: true
    why: Correct — this is not a way national law is relevant; art 27 VCLT and ILC art 3 prevent domestic law excusing breach,
      whenever enacted.
- key: q108
  type: mcq
  concept: il-perspective-on-national-law
  difficulty: 3
  stem: A court applying customary international law looks at State C's domestic statutes to see how C behaves and whether
    it feels legally bound. What role is C's national law playing?
  options:
  - text: A direct source of international law binding on every other state that has not objected to it.
    why: Tempting because custom binds broadly, but a single state's statute is evidence feeding into custom, not itself
      a binding source for other states.
  - text: A source of factual evidence of both state practice and opinio juris for the customary rule.
    correct: true
    why: Correct — slide 7 notes national law can serve as evidence for the existence of both state practice and opinio
      juris when determining custom.
  - text: A reservation modifying the customary rule for State C alone, under arts 19 to 20 VCLT.
    why: Wrong — reservations are unilateral statements made to treaties; a domestic statute is not a reservation and custom
      is not a treaty.
- key: q109
  type: mcq
  concept: il-perspective-on-national-law
  difficulty: 2
  stem: Which pairing of provision and idea is correct?
  options:
  - text: Article 27 VCLT — consent given in breach of internal competence rules may be invalid if manifest.
    why: Tempting because arts 27 and 46 are paired on the slide, but this describes art 46; art 27 is the no-internal-law-excuse
      rule.
  - text: ILC Draft Articles art 3 — domestic lawfulness does not affect characterisation as internationally wrongful.
    correct: true
    why: Correct — art 3 says wrongfulness is governed by international law and is not affected by the act being lawful
      under internal law.
  - text: Article 46 VCLT — a party may never invoke its internal law to justify failure to perform.
    why: Tempting because it swaps the two rules; the flat prohibition on internal-law excuses is art 27, while art 46 has
      a manifest-violation exception.
- key: q110
  type: mcq
  concept: il-perspective-on-national-law
  variant-of: q104
  difficulty: 3
  stem: 'State D''s new government says it is not bound by a treaty because the previous government signed it without a
    parliamentary vote required by an ordinary statute. On this week''s materials, the best answer is:'
  options:
  - text: 'D probably remains bound: art 46 needs a manifest breach of a fundamental rule, which this is not.'
    correct: true
    why: Correct — a change of government plus an ordinary procedural breach is unlikely to be objectively evident and fundamental,
      so D stays bound.
  - text: D is released, because consent given in breach of any internal law is automatically void under art 46.
    why: Tempting because a domestic requirement was ignored, but art 46 requires a manifest violation of a rule of fundamental
      importance, not any breach.
  - text: D is released, because international law defers to whichever government currently represents the state.
    why: Wrong — the state, not the government of the day, is bound; international law does not let a new government discard
      obligations for domestic reasons.
- key: q111
  type: mcq
  concept: il-perspective-on-national-law
  difficulty: 1
  stem: Why does the lecture recall sovereign equality and the horizontal system before discussing international and national
    law?
  options:
  - text: Because there is no superior authority over states, so states themselves make and enforce international law and
      bring it home.
    correct: true
    why: Correct — with no vertical authority, how international law reaches domestic orders depends on states, which is
      the question this week asks.
  - text: Because sovereign equality means international law always overrides national law inside every state.
    why: Tempting because it sounds like primacy, but sovereign equality is about states' equal standing; it says nothing
      about automatic domestic primacy.
  - text: Because a horizontal system means the UN Security Council decides how each state's courts apply treaties.
    why: Wrong — a horizontal system has no superior authority; the Security Council does not direct domestic courts on
      applying treaties.
- key: q112
  type: mcq
  concept: il-perspective-on-national-law
  difficulty: 2
  stem: The lecture gives a US–Canada tariff negotiation, in which the US wanted Canada to match US tariffs on third states,
    as an example of what?
  options:
  - text: An intrusion into the internal affairs of a state, showing that no state may force its will upon another.
    correct: true
    why: Correct — the lecturer describes the US demand as an intrusion in the internal affairs of Canada, illustrating
      sovereign equality.
  - text: A breach of art 27 VCLT, because tariffs are internal law.
    why: Tempting because tariffs are set by domestic law, but the example was not about invoking internal law to excuse
      a treaty breach.
  - text: A manifest violation of a rule of internal law of fundamental importance under art 46.
    why: Wrong — art 46 concerns consent to treaties given in breach of internal competence rules, which the tariff example
      did not involve.
- key: q113
  type: mcq
  concept: il-perspective-on-national-law
  difficulty: 3
  stem: Which statement correctly distinguishes the international law perspective from the domestic (monist/dualist) question?
  options:
  - text: International law asks only whether the state breached; how it takes effect inside the state is a domestic question.
    correct: true
    why: Correct — from international law's view domestic law is mostly irrelevant to breach; monism and dualism describe
      how states let it into their systems.
  - text: International law asks how treaties enter the domestic legal order; domestic law asks whether a breach is wrongful.
    why: 'Tempting because both questions are covered this week, but this reverses them: wrongfulness is international law''s
      question, entry into domestic law is the domestic one.'
  - text: Both perspectives agree that clear domestic legislation prevails over international law.
    why: Wrong — only the Australian domestic perspective says clear domestic law prevails; international law says domestic
      law cannot excuse breach.
- key: q114
  type: mcq
  concept: il-perspective-on-national-law
  variant-of: q108
  difficulty: 2
  stem: National court decisions are relevant to international law as which of these?
  options:
  - text: Primary sources equal to treaties, because each state's courts speak for that state.
    why: Tempting because courts are organs of the state, but art 38 treats judicial decisions as subsidiary means, not
      primary sources like treaties.
  - text: Binding precedent on the ICJ, which must follow the highest national court of each party to a dispute.
    why: Wrong — nothing in the materials makes national decisions binding on the ICJ; they are subsidiary means for determining
      rules of law.
  - text: Subsidiary sources of international law, under art 38 of the ICJ Statute.
    correct: true
    why: Correct — slide 7 and the lecture link national court decisions to art 38 of the ICJ Statute as subsidiary (secondary)
      sources.
- key: q115
  type: mcq
  concept: il-perspective-on-national-law
  variant-of: q102
  difficulty: 4
  stem: State E enacts a statute authorising conduct that breaches customary international law, and its courts uphold the
    statute. Which is the most accurate conclusion?
  options:
  - text: The conduct is lawful internationally, because a state's highest court has confirmed it under its own law.
    why: Tempting because a court ruling feels decisive, but ILC art 3 says domestic lawfulness does not affect whether
      the act is internationally wrongful.
  - text: The statute is void internationally and domestically, because custom automatically overrides legislation in every
      state.
    why: Wrong — whether custom overrides legislation domestically depends on the state's system; in Australia clear legislation
      prevails domestically.
  - text: The conduct may be valid domestically but remains internationally wrongful, engaging State E's responsibility.
    correct: true
    why: 'Correct — the two perspectives can diverge: domestic validity does not change the international characterisation
      under ILC art 3.'
- key: q116
  type: mcq
  concept: il-perspective-on-national-law
  difficulty: 2
  stem: Apart from interpretation and evidence, what further contribution of national law to international law does the
    lecturer add that is 'not on this slide'?
  options:
  - text: National law can bind other states through the principle of reciprocity.
    why: Tempting because reciprocity is a real feature of international relations, but the lecturer does not say one state's
      law binds others.
  - text: National law can help us identify certain general principles of law.
    correct: true
    why: Correct — the lecturer adds that national law can help identify general principles of law, a source under art 38.
  - text: National law can amend a treaty for the enacting state once the treaty has entered into force for it.
    why: Wrong — domestic legislation cannot amend a treaty; amendments occur at the international level, and art 27 blocks
      internal-law excuses.
- key: q117
  type: truefalse
  set: quickfire
  concept: il-perspective-on-national-law
  statement: Under art 27 VCLT, the absence of implementing legislation in a state's domestic law can justify that state's
    failure to perform a treaty.
  answer: false
  why: False — art 27 says a party may not invoke its internal law, including its absence or a contradictory provision,
    to justify failure to perform a treaty.
- key: q118
  type: truefalse
  set: quickfire
  concept: il-perspective-on-national-law
  statement: Under art 3 of the ILC Draft Articles on State Responsibility, an act can be internationally wrongful even
    if it is lawful under the state's internal law.
  answer: true
  why: True — characterisation as internationally wrongful is governed by international law and is not affected by the act's
    lawfulness under internal law.
- key: q119
  type: truefalse
  set: quickfire
  concept: il-perspective-on-national-law
  statement: According to the lecture, national law is entirely irrelevant to international law for every purpose.
  answer: false
  why: False — national law is mostly irrelevant to whether a breach occurred, but it fulfils obligations, evidences custom,
    and national decisions are subsidiary sources.
- key: q120
  type: mcq
  concept: il-perspective-on-national-law
  variant-of: q109
  difficulty: 3
  stem: State H refuses to perform a treaty, saying (1) its parliament never passed implementing legislation, and (2) separately,
    its ambassador signed without the full powers its constitution requires. Which provisions answer each argument?
  options:
  - text: (1) is answered by art 27 VCLT; (2) by art 46 VCLT, which needs a manifest violation of a fundamental rule.
    correct: true
    why: Correct — lack of legislation is an internal-law excuse barred by art 27; defective internal competence to consent
      is governed by art 46.
  - text: Both arguments are answered by art 46, because both concern internal law.
    why: Tempting because both involve internal law, but art 46 is confined to internal rules on competence to conclude
      treaties; non-implementation is art 27.
  - text: Argument (1) by art 46 and argument (2) by art 27, because defects in a state's consent are never an excuse under
      the VCLT.
    why: 'Wrong — this swaps the provisions: art 27 bars internal-law justifications for non-performance, art 46 handles
      defective consent with an exception.'
- key: q201
  type: mcq
  concept: monism-and-dualism
  difficulty: 1
  set: pretest
  stem: Which statement describes dualism?
  options:
  - text: International and national law form one single normative legal order, and international law applies directly.
    why: 'Tempting because it is one of the two theories, but this is monism: one legal order with direct effect (incorporation).'
  - text: International law is the superior order, so domestic courts must strike down any statute that conflicts with a
      treaty obligation.
    why: Wrong — dualism usually gives national law priority; striking down statutes for treaty conflict is closer to a
      strong monist system.
  - text: International and national law are distinct legal orders, so international law must be transformed to have domestic
      effect.
    correct: true
    why: Correct — dualism treats the two as separate orders; only national law has domestic force, so international law
      needs transformation.
- key: q202
  type: mcq
  concept: monism-and-dualism
  difficulty: 1
  stem: Monism is most often associated with which legal tradition?
  options:
  - text: The common law tradition, such as the UK, Australia and Canada.
    why: Tempting because these countries were named in the lecture, but they are the examples given for dualism, not monism.
  - text: Customary legal traditions, where no written constitution exists at all.
    why: Wrong — the materials link monism to the civil law tradition; nothing ties it to states without written constitutions.
  - text: The civil law tradition, mostly continental Europe.
    correct: true
    why: Correct — the slides and lecture associate monism with the civil law tradition, mostly seen in continental European
      countries.
- key: q203
  type: mcq
  concept: monism-and-dualism
  difficulty: 2
  stem: Why, according to dualism, do inconsistencies between international and national law 'not arise'?
  options:
  - text: Because the two systems have different subjects and fulfil different purposes.
    correct: true
    why: Correct — the slide explains that under dualism inconsistencies do not arise because the systems have different
      subjects and purposes.
  - text: Because international law always prevails, so any inconsistency is automatically resolved in its favour.
    why: 'Tempting because monism frequently resolves conflicts in favour of international law, but dualism''s reason is
      different: the systems are separate.'
  - text: Because states only ratify treaties that are already consistent with every piece of their domestic legislation.
    why: Wrong — dualism does not assume states only ratify consistent treaties; it explains away conflict by separating
      the legal orders.
- key: q204
  type: mcq
  concept: monism-and-dualism
  difficulty: 2
  stem: Article 25 of the German Basic Law is best described as an example of what?
  options:
  - text: 'A very clear monist provision: general rules of international law are an integral part of federal law and take
      precedence.'
    correct: true
    why: Correct — art 25 makes general international law part of federal law, taking precedence over the laws and directly
      creating rights and duties.
  - text: A dualist provision, requiring every general rule of international law to be enacted by the Bundestag first.
    why: Tempting because it is a constitutional provision about international law, but art 25 makes general rules part
      of federal law without enactment.
  - text: A blended provision like the Dutch Constitution, requiring parliamentary approval of treaties and then their publication
      before effect.
    why: Wrong — parliamentary approval and publication describe arts 91 and 93 of the Dutch Constitution, not art 25 of
      the German Basic Law.
- key: q205
  type: mcq
  concept: monism-and-dualism
  difficulty: 3
  stem: Why does the lecture describe the Dutch Constitution as a 'more nuanced approach that mixes dualism and monism'?
  options:
  - text: Because treaties need no approval of any kind, but they only bind the government and never private persons.
    why: Tempting because art 93 speaks of treaties 'binding on all persons', but art 91(1) does require prior parliamentary
      approval.
  - text: Because treaties must be re-enacted as Dutch statutes, but the Dutch courts may still refuse to apply those statutes
      afterwards.
    why: Wrong — the lecturer stresses that under art 94 you do not need to adopt any law replicating the treaty's provisions.
  - text: Because Parliament must approve treaties, yet published provisions then apply directly and override conflicting
      statutes.
    correct: true
    why: Correct — approval (art 91) is the dualist element; direct binding effect on publication (art 93) and priority
      over statutes (art 94) are monist.
- key: q206
  type: mcq
  concept: monism-and-dualism
  difficulty: 2
  stem: Under art 91(3) of the Dutch Constitution, what is required for Parliament to approve treaty provisions that conflict
    with the Constitution?
  options:
  - text: A referendum of the Dutch people.
    why: Tempting because referendums amend constitutions elsewhere (as in Australia), but art 91(3) requires a parliamentary
      supermajority instead.
  - text: At least two-thirds of the votes cast in the Chambers of Parliament.
    correct: true
    why: Correct — art 91(3) says such provisions may be approved only if at least two-thirds of the votes cast are in favour.
  - text: A simple majority, followed by publication of the treaty in the official gazette.
    why: Wrong — a simple majority is not enough for conflicting provisions; publication (art 93) is a separate step for
      binding effect.
- key: q207
  type: mcq
  concept: monism-and-dualism
  difficulty: 1
  stem: What does the lecture mean by calling monism and dualism 'ideal type' theories?
  options:
  - text: That monism is the ideal every state should aim for, while dualism is a departure from that ideal.
    why: Tempting because 'ideal' sounds normative, but 'ideal type' means an abstract model, not the preferred option.
  - text: That the theories apply only to ideal treaties, such as human rights conventions, and not to trade treaties.
    why: Wrong — the theories describe the relationship between legal orders generally, not any particular class of treaty.
  - text: That in practice no system applies either perfectly; most are blends leaning toward one or the other.
    correct: true
    why: Correct — the lecturer says you won't find either applied perfectly; blends characterise most domestic legal orders.
- key: q208
  type: mcq
  concept: monism-and-dualism
  difficulty: 2
  stem: Which theory best reflects Australia's approach to international law (tutorial question 1)?
  options:
  - text: Primarily dualism, because international law must be transformed into Australian law to have effect.
    correct: true
    why: 'Correct — the lecture concludes Australia is primarily a dualist system: treaties need transformation and clear
      Australian law prevails.'
  - text: Monism, because Australian courts may refer to international law.
    why: Tempting because courts may refer to international law, but reference as an aid is not direct effect; international
      law does not form part of Australian law as such.
  - text: A pure blend like the Netherlands, because published treaties bind all persons in Australia without any legislation.
    why: Wrong — Australia has no equivalent of Dutch art 93; treaties do not bind persons on publication, as Dietrich shows.
- key: q209
  type: mcq
  concept: monism-and-dualism
  variant-of: q204
  difficulty: 3
  stem: Country X's constitution says ratified treaties 'form part of the law of the land and prevail over inconsistent
    statutes', with no implementing legislation required. Where does X sit?
  options:
  - text: 'Towards dualism: the constitution itself is national law, so the treaty is being transformed.'
    why: Tempting because the rule sits in a national constitution, but a general rule giving treaties direct effect is
      incorporation, not case-by-case transformation.
  - text: 'Neither: a constitution cannot address the effect of treaties, which only international law can determine.'
    why: Wrong — the German and Dutch examples show constitutions can and do regulate the domestic effect of international
      law.
  - text: 'Towards monism: treaties have direct effect and conflicts are resolved in favour of international law.'
    correct: true
    why: Correct — direct effect without legislation and priority over statutes are the hallmarks of monism described on
      slide 8.
- key: q210
  type: mcq
  concept: monism-and-dualism
  difficulty: 2
  stem: Under monism, how is an inconsistency between international and national law handled?
  options:
  - text: It cannot arise, because the two systems have different subjects and purposes.
    why: Tempting because it is on the same slide, but this is the dualist explanation; monism treats both as one order,
      so conflicts can arise.
  - text: It must be resolved, frequently in favour of international law.
    correct: true
    why: Correct — the slide says under monism inconsistencies must be resolved, frequently in favour of international law,
      and monist states have rules for this.
  - text: It is ignored, because domestic courts cannot apply international law at all under monism.
    why: Wrong — under monism courts can use international law directly; that is precisely why conflicts must be resolved
      rather than ignored.
- key: q211
  type: mcq
  concept: monism-and-dualism
  difficulty: 3
  stem: Which pair correctly matches theory and mechanism?
  options:
  - text: Monism — incorporation (direct effect); dualism — transformation.
    correct: true
    why: Correct — slide 8 pairs monism with direct effect (incorporation) and dualism with transformation into domestic
      law.
  - text: Monism — transformation; dualism — incorporation.
    why: 'Tempting because both words appear on slide 8, but this reverses them: monism gives direct effect (incorporation),
      dualism requires transformation.'
  - text: Both theories rely on transformation, differing only in whether courts or Parliament transform.
    why: Wrong — only dualism requires transformation; under monism international law applies directly without any transforming
      step.
- key: q212
  type: mcq
  concept: monism-and-dualism
  difficulty: 2
  stem: Under art 93 of the Dutch Constitution, when do treaty provisions that may be binding on all persons become binding?
  options:
  - text: After Parliament passes a statute reproducing their text word for word.
    why: Tempting because that is how dualist systems work, but the lecturer stresses no replicating law is needed in the
      Netherlands.
  - text: After they have been published.
    correct: true
    why: Correct — art 93 says such provisions and resolutions of international institutions become binding after they have
      been published.
  - text: After the Dutch Supreme Court declares them consistent with the Constitution and with all existing statutes.
    why: Wrong — nothing in art 93 requires a court declaration; publication is the trigger, and art 94 makes treaties prevail
      over conflicting statutes.
- key: q213
  type: mcq
  concept: monism-and-dualism
  variant-of: q208
  difficulty: 3
  stem: 'A student writes: ''Because Australia is dualist, international law has no relevance in Australian courts.'' What
    is the best correction?'
  options:
  - text: 'Wrong: international law does not form part of Australian law as such, but courts may refer to it and read legislation
      consistently with it.'
    correct: true
    why: Correct — dualism denies direct effect, not relevance; international law remains an aid to interpretation and an
      influence on the common law.
  - text: 'Correct as stated: dualism means Australian courts must ignore international law entirely.'
    why: Tempting because dualism requires transformation, but the Practitioner's Guide says courts may refer to international
      law and interpret law consistently with it.
  - text: 'Wrong: Australia is monist, so international law applies directly in its courts.'
    why: Wrong — the lecture concludes Australia is primarily dualist; the error in the statement is about relevance, not
      about the label.
- key: q214
  type: mcq
  concept: monism-and-dualism
  variant-of: q203
  difficulty: 2
  stem: Which description of national law's priority matches dualism?
  options:
  - text: Usually national law will have priority, since it is the only law with force domestically.
    correct: true
    why: Correct — the lecture says under dualism national law usually has priority, as international law has no domestic
      force until transformed.
  - text: International law usually has priority, because it is the higher legal order.
    why: Tempting because it echoes international law's own view, but dualism holds the only law with domestic force is
      national law.
  - text: Neither has priority; courts balance them case by case according to fairness.
    why: Wrong — no theory in the materials involves case-by-case fairness balancing; dualism gives national law priority
      domestically.
- key: q215
  type: mcq
  concept: monism-and-dualism
  difficulty: 4
  stem: State Y is monist. Its parliament passes a statute that conflicts with a general rule of international law. From
    the domestic and international perspectives respectively, which outcome best fits this week's materials?
  options:
  - text: Domestically the conflict must be resolved, frequently in favour of international law; internationally the statute
      cannot excuse any breach.
    correct: true
    why: Correct — monist systems have rules resolving conflicts (often for international law), and internationally art
      3 makes domestic law no excuse.
  - text: Domestically the statute prevails because it is later in time; internationally the statute modifies Y's obligation.
    why: Tempting because 'later in time' is a familiar domestic rule, but a statute never modifies an international obligation
      from international law's view.
  - text: Domestically no conflict arises, because the two systems are separate; internationally the breach is excused.
    why: Wrong — 'no conflict arises' is the dualist view, and on no view does domestic law excuse an international breach.
- key: q216
  type: mcq
  concept: monism-and-dualism
  difficulty: 1
  stem: Which countries did the lecture give as examples of the common law, dualist tradition?
  options:
  - text: The UK, Australia and Canada.
    correct: true
    why: Correct — the lecturer names the UK, Australia, Canada and so on as common law countries associated with dualism.
  - text: Germany and the Netherlands.
    why: Tempting because both were discussed at length, but they illustrate monism (Germany) and a blended approach (the
      Netherlands).
  - text: France and Turkey, the parties to Lotus.
    why: Wrong — France and Turkey appear this week only as the parties to the Lotus case on jurisdiction, not as examples
      of dualism.
- key: q217
  type: truefalse
  set: quickfire
  concept: monism-and-dualism
  statement: Under dualism, international law must be transformed into domestic law before it has effect at the domestic
    level.
  answer: true
  why: True — dualism sees the orders as distinct; the only law with domestic force is national law, so international law
    needs transformation.
- key: q218
  type: truefalse
  set: quickfire
  concept: monism-and-dualism
  statement: Article 25 of the German Basic Law requires the Bundestag to legislate before any general rule of international
    law can create rights for inhabitants.
  answer: false
  why: False — art 25 makes general rules of international law an integral part of federal law that directly create rights
    and duties, with no legislative step.
- key: q219
  type: truefalse
  set: quickfire
  concept: monism-and-dualism
  statement: In reality, most domestic legal orders reflect a blend of monism and dualism rather than a pure form of either.
  answer: true
  why: True — the slide concludes that blends of the two theories characterise the relationship of international law to
    most domestic legal orders.
- key: q220
  type: short
  concept: monism-and-dualism
  difficulty: 3
  prompt: Dualism and monism are theories used to explain the interaction between international and national law. Explain
    the differences between the two theories, with an example of each approach from the materials, and say which best reflects
    Australia's approach.
  model: 'Monism sees national and international law as part of one single normative legal order. International law has
    direct effect (incorporation) and holds the same legal authority as national law, so courts can apply it directly; inconsistencies
    must be resolved, frequently in favour of international law. It is often associated with the civil law tradition. Germany
    is a clear example: art 25 of the Basic Law makes the general rules of international law an integral part of federal
    law that take precedence over the laws and directly create rights and duties. Dualism sees the two as distinct legal
    orders. Only national law has force domestically, so international law must be transformed into domestic law to have
    effect; inconsistencies do not arise because the systems have different subjects and purposes, and national law usually
    has priority. It is often associated with the common law tradition. These are ideal types: most systems blend them,
    as the Dutch Constitution does by requiring parliamentary approval (art 91) while giving published treaty provisions
    binding effect and priority over statutes (arts 93–94). Australia is primarily dualist: treaties must be transformed
    (Dietrich), and clear Australian law prevails.'
  rubric:
  - id: r1
    criterion: 'Explains monism accurately: one legal order, direct effect, conflicts resolved often for international law.'
    marks: 2
    top-band: Covers all three features and links monism to the civil law tradition.
    margin-note: What happens to conflicts under monism?
    authorities: []
  - id: r2
    criterion: 'Explains dualism accurately: distinct orders, transformation required, no inconsistency, national priority.'
    marks: 2
    top-band: Explains why inconsistencies 'do not arise' — different subjects and purposes.
    margin-note: Why no inconsistency under dualism?
    authorities: []
  - id: r3
    criterion: Uses an example of each approach (e.g. German Basic Law art 25; Dutch Constitution as a blend).
    marks: 1
    top-band: Quotes art 25 or accurately describes arts 91, 93 and 94 of the Dutch Constitution.
    margin-note: Give a concrete example.
    authorities:
    - german-basic-law-art-25
    - dutch-constitution-1983-arts-90-94
  - id: r4
    criterion: Concludes Australia is primarily dualist and supports it (transformation of treaties, Dietrich, clear law
      prevails).
    marks: 2
    top-band: Recognises blends and still reaches a supported conclusion for Australia.
    margin-note: Support the conclusion with authority.
    authorities: []
- key: q301
  type: mcq
  concept: treaties-in-australian-law
  difficulty: 1
  set: pretest
  stem: Which section of the Constitution is known as the external affairs power?
  options:
  - text: Section 61, which vests the executive power of the Commonwealth, including the power to conclude treaties.
    why: Tempting because s 61 is the treaty-making power covered in week 3, but it is an executive power, not Parliament's
      external affairs power.
  - text: Section 75(i), giving the High Court original jurisdiction in matters arising under a treaty.
    why: Wrong — s 75(i) confers original jurisdiction on the High Court; it is a judicial provision, not a legislative
      power over external affairs.
  - text: Section 51(xxix), granting federal Parliament power to legislate with respect to 'external affairs'.
    correct: true
    why: Correct — s 51(xxix) is the external affairs power, letting federal Parliament enact legislation with respect to
      external affairs.
- key: q302
  type: mcq
  concept: treaties-in-australian-law
  difficulty: 2
  stem: Which of these does the Australian Constitution NOT address, according to slide 13?
  options:
  - text: The legal effect of international law within the domestic legal system.
    correct: true
    why: Correct — the slide lists this among the matters the Constitution does not address, along with how Australia enters
      binding relationships and enforcement.
  - text: Which branch of government holds the power to conclude treaties.
    why: Tempting because it seems unaddressed, but s 61 vests the treaty-making power in the executive branch.
  - text: Which court has original jurisdiction in matters arising under a treaty.
    why: Wrong — s 75(i) expressly vests the High Court with original jurisdiction in 'matters arising under a treaty'.
- key: q303
  type: mcq
  concept: treaties-in-australian-law
  difficulty: 2
  stem: In the Tasmanian Dam Case, why could the Commonwealth legislate to stop a dam that would normally be a matter for
    Tasmania?
  options:
  - text: Because Australia was party to the World Heritage Convention, and giving effect to that obligation fell within
      the external affairs power.
    correct: true
    why: Correct — being party to the Convention directly related to external affairs, so the Commonwealth could legislate
      to give effect to it.
  - text: Because the Commonwealth owns all rivers under s 61, so a state dam required its consent.
    why: Wrong — s 61 is the executive power; nothing in the case turns on Commonwealth ownership of rivers.
  - text: Because the World Heritage Convention had direct effect in Australia once ratified, overriding Tasmanian law without
      any Commonwealth legislation.
    why: Tempting because the treaty was decisive, but treaties have no direct effect in Australia; the Commonwealth had
      to pass legislation.
- key: q304
  type: mcq
  concept: treaties-in-australian-law
  difficulty: 3
  stem: What limit on the external affairs power did the High Court majority note in the Tasmanian Dam Case?
  options:
  - text: The power can only implement treaties Australia signed before federation in 1901.
    why: Wrong — Australia became party to the World Heritage Convention in 1974 and the legislation was upheld, so no pre-1901
      limit applies.
  - text: If the use of the power was no more than a device to exercise legislative power, it would probably not be legitimate.
    correct: true
    why: Correct — the majority warned that using the external affairs power merely as a device, in bad faith, would probably
      not be legitimate.
  - text: The power can never be used on subject matters that the Constitution otherwise leaves to the states, such as dams
      on rivers.
    why: 'Tempting because Tasmania argued exactly this, but the majority rejected it: the dam was normally a state matter,
      yet the law was valid.'
- key: q305
  type: mcq
  concept: treaties-in-australian-law
  difficulty: 1
  stem: What did the High Court hold in Dietrich v The Queen about Australia's ratification of the ICCPR?
  options:
  - text: Ratification has no direct legal effect upon domestic law; ICCPR rights are not incorporated until specific legislation
      implements them.
    correct: true
    why: Correct — Mason CJ and McHugh J said ratification, as an executive act, has no direct domestic effect until legislation
      is passed.
  - text: Ratification made art 14(3)(d) directly enforceable, so the appellant had a right to publicly funded counsel.
    why: Tempting because the ICCPR does guarantee free representation in some cases, but the Court held it was not part
      of Australian law.
  - text: Ratification was invalid because Parliament had not approved it, so the ICCPR did not bind Australia internationally
      at the time of trial.
    why: Wrong — the Court did not doubt the ICCPR bound Australia internationally; the point was only its lack of domestic
      effect.
- key: q306
  type: mcq
  concept: treaties-in-australian-law
  difficulty: 2
  stem: Which of the following is an example of a treaty that is directly applicable in Australia without legislative implementation?
  options:
  - text: Certain peace treaties or boundary treaties.
    correct: true
    why: Correct — slide 17 names a very limited class of directly applicable treaties, e.g. certain peace treaties and
      boundary treaties.
  - text: A human rights covenant, such as the ICCPR, once ratified by the executive.
    why: Tempting because human rights treaties are important, but Dietrich shows the ICCPR needs legislation to have domestic
      effect.
  - text: A trade agreement that has been tabled before JSCOT for twenty joint sitting days.
    why: Wrong — tabling and JSCOT scrutiny are steps in treaty-making, not a means of giving a treaty direct domestic effect.
- key: q307
  type: mcq
  concept: treaties-in-australian-law
  difficulty: 2
  stem: Which method of transforming a treaty into Australian law does the slide say 'does not constitute full incorporation'?
  options:
  - text: Adopting new legislation reproducing the treaty's provisions.
    why: Tempting because it is the first method listed, but new legislation giving effect to the treaty is a full means
      of transformation.
  - text: Scheduling the treaty to an existing Act.
    correct: true
    why: Correct — slide 18 notes that scheduling a treaty to an existing Act does not constitute full incorporation.
  - text: Giving the treaty the force of law, as the Diplomatic Privileges and Immunities Act 1967 s 7 does.
    why: Wrong — giving a treaty the force of law is a full transformation method, illustrated by s 7 of the 1967 Act.
- key: q308
  type: mcq
  concept: treaties-in-australian-law
  difficulty: 2
  stem: The Criminal Code was amended to give effect to certain provisions of the Genocide Convention. Which method of transformation
    is this?
  options:
  - text: Relying on a treaty provision already given effect in existing legislation.
    why: Tempting because the Criminal Code already existed, but here it had to be changed; 'already given effect' means
      no change was needed.
  - text: Scheduling the Genocide Convention to the Criminal Code as an annex without operative provisions.
    why: Wrong — the Code was amended with operative provisions, not merely given the Convention as a schedule.
  - text: Amendment of existing legislation.
    correct: true
    why: Correct — the lecture gives this as the example of amending existing legislation to give effect to a convention's
      provisions.
- key: q309
  type: mcq
  concept: treaties-in-australian-law
  difficulty: 3
  stem: Legislation is passed under s 51(xxix) to give effect to a rule of customary international law, not a treaty. On
    the materials, is it within the external affairs power?
  options:
  - text: Yes — giving effect to obligations under customary international law is a recognised valid use of the power.
    correct: true
    why: Correct — slide 14 lists customary obligations among valid uses, and the lecturer said the Dam Case reasoning applies
      equally to custom.
  - text: No — the external affairs power is limited to implementing treaties that Australia has signed and then formally
      ratified.
    why: Tempting because the Tasmanian Dam Case involved a treaty, but the slide lists customary obligations as a separate
      valid use.
  - text: Only if the High Court first declares the customary rule to be jus cogens.
    why: Wrong — no jus cogens requirement appears in the materials for the external affairs power; jus cogens arises in
      Nulyarimma.
- key: q310
  type: mcq
  concept: treaties-in-australian-law
  difficulty: 2
  stem: Koowarta v Bjelke-Petersen is cited on the slides for which valid use of the external affairs power?
  options:
  - text: Legislation carrying out Australia's treaty obligations under the World Heritage Convention.
    why: Tempting because that is the Tasmanian Dam Case's example, but Koowarta is cited for 'international concern'.
  - text: Legislation affecting relations with international organisations, such as the United Nations Security Council.
    why: Wrong — relations with international persons is a separate listed use; Koowarta is attached specifically to international
      concern.
  - text: Legislation related to a matter of 'international concern'.
    correct: true
    why: Correct — slide 14 cites Koowarta for legislation related to a matter of 'international concern'.
- key: q311
  type: mcq
  concept: treaties-in-australian-law
  difficulty: 3
  stem: Why was the external affairs power described as controversial in the lecture?
  options:
  - text: Because in a federation it can allow the Commonwealth to legislate in domains otherwise under state competence.
    correct: true
    why: Correct — the lecturer explains it was controversial because it lets the federal government legislate on matters
      within the states' purview.
  - text: Because it allows the executive to ratify treaties without any involvement of the Governor-General.
    why: Tempting because treaty-making is executive, but that concerns s 61 and Executive Council, not the controversy
      over s 51(xxix).
  - text: Because it gives international courts power to invalidate Australian statutes that breach treaties.
    why: Wrong — nothing in the materials gives international courts power to invalidate Australian statutes; the controversy
      is federal.
- key: q312
  type: mcq
  concept: treaties-in-australian-law
  variant-of: q305
  difficulty: 3
  stem: 'Australia ratifies Treaty T, which gives individuals a right to a free interpreter. No legislation is passed. Priya,
    refused an interpreter, sues in an Australian court relying on T. The best advice is:'
  options:
  - text: 'She fails on T itself: without implementing legislation, T''s rights are not incorporated into Australian law.'
    correct: true
    why: Correct — applying Dietrich, rights in an unincorporated treaty are not justiciable in Australian courts, though
      Australia may still be in breach internationally.
  - text: She succeeds, because ratification by the executive makes T part of Australian law.
    why: Tempting because Australia is bound internationally, but Dietrich holds ratification has no direct legal effect
      on domestic law.
  - text: She succeeds, because s 75(i) gives the High Court jurisdiction over matters arising under a treaty, which makes
      treaties enforceable.
    why: Wrong — s 75(i) is about which court has original jurisdiction, not about giving an unincorporated treaty domestic
      legal effect.
- key: q313
  type: mcq
  concept: treaties-in-australian-law
  difficulty: 2
  stem: What does s 7 of the Diplomatic Privileges and Immunities Act 1967 illustrate?
  options:
  - text: Giving a treaty — certain articles of the Vienna Convention on Diplomatic Relations — the force of law.
    correct: true
    why: Correct — the slide gives s 7 as its example of giving the treaty the force of law, for specified articles of the
      VCDR.
  - text: Transforming the VCLT's rules on treaty interpretation into Australian statute.
    why: Tempting because the lecturer briefly said 'VCLT' before correcting herself, but s 7 concerns the Vienna Convention
      on Diplomatic Relations.
  - text: Scheduling a treaty to an Act without incorporating it, as in the Human Rights and Equal Opportunity Commission
      Act.
    why: Wrong — the lecture uses HREOC Act scheduling in Dietrich to show a schedule alone creates no justiciable rights;
      s 7 gives force of law.
- key: q314
  type: mcq
  concept: treaties-in-australian-law
  difficulty: 1
  stem: Which statement about treaties in Australia is correct?
  options:
  - text: Treaties have direct effect once signed by the Prime Minister or Foreign Minister.
    why: Tempting because those officials need no full powers to sign, but signature does not give a treaty domestic effect.
  - text: Treaties have direct effect only if they are human rights treaties protecting fundamental freedoms.
    why: 'Wrong — the opposite: Dietrich concerned a human rights treaty (the ICCPR), which had no direct effect.'
  - text: Treaties do not have a direct effect; their provisions need to be validly incorporated.
    correct: true
    why: 'Correct — slide 17: treaties do not have a direct effect in Australia and must be validly incorporated into domestic
      law.'
- key: q315
  type: mcq
  concept: treaties-in-australian-law
  variant-of: q304
  difficulty: 3
  stem: 'The Commonwealth relies on a treaty Australia has joined as a pretext to pass a law regulating a purely local matter,
    with no genuine connection to the treaty''s obligations. Following the Tasmanian Dam Case, the likely view is:'
  options:
  - text: Valid, because the Commonwealth has broad discretion and any treaty link is enough.
    why: Tempting because the slide stresses broad discretion, but the Dam Case majority said a mere device would probably
      not be legitimate.
  - text: Invalid, because the external affairs power never extends to matters otherwise within state competence.
    why: Wrong — the Dam Case upheld a law on a matter normally for Tasmania; state competence is not an absolute bar.
  - text: Probably not legitimate, because using the power as no more than a device to legislate would not be a valid exercise.
    correct: true
    why: Correct — the Dam Case majority indicated that use of the external affairs power as a mere device would probably
      not be legitimate.
- key: q316
  type: mcq
  concept: treaties-in-australian-law
  difficulty: 2
  stem: 'Murphy J in New South Wales v Commonwealth [1975] described the purpose of s 51(xxix) as:'
  options:
  - text: To let the states conduct their own foreign relations with neighbouring countries.
    why: Wrong — the external affairs power is a federal legislative power; nothing in Murphy J's statement concerns state
      foreign relations.
  - text: To enable Australia to carry out its functions as an international person, fulfilling its international obligations.
    correct: true
    why: Correct — this is Murphy J's statement quoted on slide 14 of the purpose of the external affairs power.
  - text: To prevent Parliament legislating on any matter covered by a treaty until the High Court has first approved that
      treaty.
    why: Tempting because s 75(i) involves the High Court and treaties, but Murphy J described an enabling power, not a
      restraint.
- key: q317
  type: truefalse
  set: quickfire
  concept: treaties-in-australian-law
  statement: In Dietrich v The Queen, the High Court held that Australia's ratification of the ICCPR had no direct legal
    effect upon domestic law.
  answer: true
  why: True — Mason CJ and McHugh J said ratification is an executive act with no direct domestic effect until specific
    implementing legislation is passed.
- key: q318
  type: truefalse
  set: quickfire
  concept: treaties-in-australian-law
  statement: Section 61 of the Constitution vests the power to legislate with respect to external affairs in federal Parliament.
  answer: false
  why: False — s 61 vests the treaty-making power in the executive; the power to legislate on external affairs is s 51(xxix).
- key: q319
  type: truefalse
  set: quickfire
  concept: treaties-in-australian-law
  statement: Scheduling a treaty to an existing Act is a method of transformation that constitutes full incorporation of
    the treaty.
  answer: false
  why: False — slide 18 expressly notes that scheduling a treaty to an existing Act does not constitute full incorporation.
- key: q320
  type: short
  concept: treaties-in-australian-law
  difficulty: 3
  prompt: Explain how treaties take effect in Australian law. Refer to the relevant provisions of the Constitution, the
    Tasmanian Dam Case, Dietrich v The Queen, and the methods by which a treaty can be transformed into domestic law.
  model: 'Treaties do not have a direct effect in Australia: their provisions need to be validly incorporated into domestic
    law, apart from a very limited class such as certain peace and boundary treaties. The executive concludes treaties under
    s 61 of the Constitution, but ratification is an executive act: in Dietrich v The Queen, Mason CJ and McHugh J held
    that ratification of the ICCPR had no direct legal effect upon domestic law, and its rights were not incorporated until
    specific legislation was passed. Parliament''s power to transform treaties comes chiefly from the external affairs power,
    s 51(xxix), which enables Australia to fulfil its international obligations (Murphy J). In the Tasmanian Dam Case, because
    Australia was party to the World Heritage Convention, the Commonwealth could legislate to stop a dam on a matter that
    would normally belong to Tasmania, though a mere device would probably not be legitimate. Transformation can occur by
    new legislation, amending existing legislation (as the Criminal Code was amended for the Genocide Convention), scheduling
    the treaty to an Act (not full incorporation), relying on existing legislation already giving effect to it, or giving
    the treaty the force of law (Diplomatic Privileges and Immunities Act 1967 s 7).'
  rubric:
  - id: r1
    criterion: States that treaties have no direct effect in Australia and need incorporation, noting the limited exceptions.
    marks: 1
    top-band: Mentions peace and boundary treaties as the very limited exception.
    margin-note: Any exceptions?
    authorities: []
  - id: r2
    criterion: 'Explains Dietrich: ratification is an executive act without direct domestic effect.'
    marks: 2
    top-band: Quotes or closely paraphrases Mason CJ and McHugh J and links it to s 61.
    margin-note: What exactly did Dietrich hold?
    authorities:
    - australian-constitution-cth-s61
  - id: r3
    criterion: Explains the external affairs power and the Tasmanian Dam Case, including the 'device' limit.
    marks: 2
    top-band: Uses the facts accurately (World Heritage Convention, Gordon River dam) and states the limit.
    margin-note: What stops abuse of s 51(xxix)?
    authorities:
    - australian-constitution-cth-s51-xxix
  - id: r4
    criterion: Lists the methods of transformation with an example, noting scheduling is not full incorporation.
    marks: 2
    top-band: Gives at least four methods with the Criminal Code or DPI Act s 7 example.
    margin-note: Which method is only partial?
    authorities:
    - diplomatic-privileges-and-immunities-act-1967-cth-s7
- key: q401
  type: mcq
  concept: international-law-in-australian-interpretation
  difficulty: 2
  stem: Under s 15AB of the Acts Interpretation Act 1901 (Cth), which condition must be met before a treaty can assist in
    interpreting an Act?
  options:
  - text: There must have been actual or contemplated participation by Australia in the treaty before the Act was enacted.
    correct: true
    why: Correct — the slide requires actual or contemplated participation by Australia in the treaty prior to enactment
      of the legislation.
  - text: The treaty must have been incorporated in full into the Act being interpreted.
    why: Tempting because incorporated text is interpreted by the treaty (Applicant A), but s 15AB also covers treaties
      not incorporated into the Act.
  - text: The treaty must have been in force for at least twelve months, like UNCLOS under its own entry-into-force clause.
    why: Wrong — no minimum period applies; the UNCLOS twelve-month rule concerns its entry into force (week 3), not s 15AB.
- key: q402
  type: mcq
  concept: international-law-in-australian-interpretation
  difficulty: 2
  stem: In which situation may a treaty be used under s 15AB, provided Australia participated or contemplated participating
    before enactment?
  options:
  - text: To replace the ordinary meaning of clear words whenever the treaty would give a better protection of individual
      rights and freedoms.
    why: Tempting because rights protection is favoured, but Yager holds a treaty cannot modify words that are otherwise
      clear.
  - text: To confirm the ordinary meaning, or where the Act is ambiguous, obscure, or would otherwise be manifestly absurd
      or unreasonable.
    correct: true
    why: "Correct — s 15AB(1)(a) lets a treaty confirm the Act's ordinary meaning, and s 15AB(1)(b) applies where the Act is ambiguous or obscure, or would lead to a manifestly absurd or unreasonable result."
  - text: Only where the Act's long title expressly names the treaty and the Act was passed unanimously by both Houses of
      Parliament.
    why: "Wrong — s 15AB asks only for Australia's actual or contemplated participation before enactment plus one of the s 15AB(1) situations; nothing turns on the long title or a unanimous vote."
- key: q403
  type: mcq
  concept: international-law-in-australian-interpretation
  difficulty: 2
  stem: What did Mason J say in Yager v The Queen about treaties and statutory interpretation?
  options:
  - text: A treaty prevails over any inconsistent statute, because Australia is bound by art 27 VCLT.
    why: Tempting because art 27 is this week's key international rule, but it governs the international perspective, not
      how Australian courts read clear Acts.
  - text: A treaty cannot qualify or modify the meaning of legislative words or expressions which are otherwise clear.
    correct: true
    why: Correct — Yager (Mason J) is cited on slide 19 for this limit on the use of treaties in interpretation.
  - text: A treaty may only be consulted if the statute was enacted before Australia ratified it, never after ratification.
    why: Wrong — this reverses s 15AB, which requires Australia's participation or contemplated participation before enactment.
- key: q404
  type: mcq
  concept: international-law-in-australian-interpretation
  difficulty: 1
  stem: What is the presumption associated with Jumbunna Coal Mine NL v Victoria Coal Miners' Association?
  options:
  - text: Courts will not impute to Parliament an intention to curtail fundamental rights without unambiguous language.
    why: Tempting because it is the other presumption on slide 20, but that is the principle of legality from Coco v The
      Queen.
  - text: In a case of ambiguity, courts should favour a construction of a statute that accords with international law.
    correct: true
    why: Correct — slide 20 cites Jumbunna for the presumption that ambiguous statutes are read consistently with international
      law.
  - text: Customary international law is automatically a source of Australian law unless a rule is to the contrary.
    why: Wrong — that is the doctrine of incorporation for custom, not the Jumbunna presumption about statutory ambiguity.
- key: q405
  type: mcq
  concept: international-law-in-australian-interpretation
  difficulty: 2
  stem: Polites v Commonwealth is cited for which proposition?
  options:
  - text: International law can be used to interpret the Constitution where it declares universal and fundamental rights.
    why: Tempting because it concerns interpretation, but this is Kirby J's view in Newcrest Mining, not Polites.
  - text: The presumption of consistency with international law does not apply to clear legislation contrary to international
      law.
    correct: true
    why: "Correct — Polites shows the Jumbunna presumption of consistency with international law is only a presumption: it gives way to clear legislation contrary to international law."
  - text: A statute that incorporates a treaty's text must be read in line with the treaty unless a contrary intention appears
      in it.
    why: "Tempting because it is also about reading statutes alongside treaties, but that is Applicant A on incorporated treaty text; Polites marks the limit of the Jumbunna presumption."
- key: q406
  type: mcq
  concept: international-law-in-australian-interpretation
  difficulty: 2
  stem: What does the principle of legality (Coco v The Queen) require?
  options:
  - text: Parliament must use unambiguous and unmistakable language to curtail fundamental rights or freedoms.
    correct: true
    why: 'Correct — Coco (at 437): courts will not impute such an intention to Parliament unless it is clearly manifested
      by unambiguous language.'
  - text: Every statute must be consistent with the ICCPR, or it is invalid.
    why: Tempting because the ICCPR protects rights, but the principle is an interpretive presumption; it does not invalidate
      statutes.
  - text: Courts must refer every rights question to the UN Human Rights Committee before deciding the case in Australia.
    why: Wrong — nothing in the materials requires any referral; the principle of legality is applied by Australian courts
      themselves.
- key: q407
  type: mcq
  concept: international-law-in-australian-interpretation
  variant-of: q401
  difficulty: 3
  stem: An Act passed in 2010 uses an ambiguous word. The government relies on a treaty that Australia first considered
    joining in 2018. Can the treaty assist under s 15AB?
  options:
  - text: No — there was no actual or contemplated participation by Australia before the Act was enacted in 2010.
    correct: true
    why: Correct — s 15AB requires participation or contemplated participation prior to enactment; 2018 is after the 2010
      Act.
  - text: Yes — any treaty Australia has ratified can be used whenever an Act is ambiguous or obscure.
    why: Tempting because ambiguity is one of the s 15AB situations, but the timing condition must also be satisfied.
  - text: Yes — obligations are identified as they exist when the interpretive question arises, so later treaties always
      count.
    why: Wrong — that Practitioner's Guide principle concerns which obligations apply at the time of the question; it does
      not remove the s 15AB timing condition.
- key: q408
  type: mcq
  concept: international-law-in-australian-interpretation
  difficulty: 2
  stem: According to the Law Society of NSW Practitioner's Guide, what happens in a conflict between international law and
    clear, valid Australian legal provisions?
  options:
  - text: International law prevails, because art 27 VCLT forbids reliance on internal law.
    why: Tempting because it is international law's own perspective, but domestically, international law cannot override
      clear Australian law.
  - text: The High Court must refer the conflict to the International Court of Justice under s 75(i) of the Constitution.
    why: Wrong — s 75(i) gives the High Court original jurisdiction; it provides no referral to the ICJ.
  - text: International law cannot be invoked to override clear and valid Australian legal provisions.
    correct: true
    why: 'Correct — principle (vi): in the event of conflict, international law cannot be invoked to override clear and
      valid Australian provisions.'
- key: q409
  type: mcq
  concept: international-law-in-australian-interpretation
  variant-of: q405
  difficulty: 3
  stem: Parliament deliberately passes a clear Act that breaches one of Australia's treaty obligations. Which statement
    is correct?
  options:
  - text: The Act is invalid, because Australian courts must interpret legislation consistently with Australia's obligations.
    why: Tempting because of the consistency principle, but it applies only absent contrary indications; clear words prevail
      (Polites).
  - text: The Act is valid and Australia commits no breach, because domestic legality settles the international question
      too.
    why: Wrong — ILC art 3 says domestic lawfulness does not affect characterisation as internationally wrongful.
  - text: The Act is valid in Australian law, but Parliament takes 'the risk of international complications' and Australia
      may be in breach internationally.
    correct: true
    why: 'Correct — principle (vii): Parliament may legislate in breach of international law; the Act is valid domestically
      but Australia may be responsible internationally.'
- key: q410
  type: mcq
  concept: international-law-in-australian-interpretation
  difficulty: 2
  stem: When are the international obligations applicable to Australia generally identified, for interpretation purposes?
  options:
  - text: As they existed when the statute being interpreted was first drafted.
    why: Tempting because s 15AB looks at enactment timing, but principle (v) identifies obligations when the interpretive
      question arises.
  - text: As they will exist once every pending treaty has entered into force.
    why: 'Wrong — the lecturer gives the opposite example: a treaty that will enter into force tomorrow cannot guide a case
      arising today.'
  - text: As they exist at the time the interpretive question arises.
    correct: true
    why: Correct — principle (v); so a treaty entering into force tomorrow cannot be a basis for interpreting a case arising
      today.
- key: q411
  type: mcq
  concept: international-law-in-australian-interpretation
  difficulty: 2
  stem: What was Kirby J's view, in Newcrest Mining (WA) Ltd v Commonwealth, of international law and the Constitution?
  options:
  - text: Using international law to interpret the Constitution is 'heretical' because it amends the Constitution without
      a referendum.
    why: Tempting because it is the other side of the debate, but this is McHugh J's view in Al-Kateb v Godwin.
  - text: International law may be used only to fill lacunae in the common law, never in constitutional interpretation.
    why: Wrong — the lacunae-filling view relates to the common law (Teoh); Kirby J went further and applied international
      law to the Constitution.
  - text: To the full extent its text permits, the Constitution accommodates itself to international law, including basic
      rights.
    correct: true
    why: Correct — Kirby J saw international law as a legitimate influence on constitutional law, the Constitution also
      speaking to the international community.
- key: q412
  type: mcq
  concept: international-law-in-australian-interpretation
  difficulty: 3
  stem: McHugh J in Al-Kateb v Godwin gave which reasons for rejecting international law in constitutional interpretation?
  options:
  - text: International law is too uncertain for constitutional use, because customary rules have never been accepted by
      the High Court.
    why: Tempting because the position of custom is unsettled, but that is not McHugh J's reasoning, and both doctrines
      have been recognised in the High Court.
  - text: The Constitution predates the United Nations, so only pre-1901 international law can be relevant.
    why: Wrong — McHugh J did not propose a date-based rule; his objection was to using international law at all in interpretation.
  - text: It is 'heretical', amending the Constitution without a referendum; international rules differ from social developments.
    correct: true
    why: Correct — these three points appear on slide 26; the lecturer frames them as a separation of powers concern.
- key: q413
  type: mcq
  concept: international-law-in-australian-interpretation
  difficulty: 1
  stem: Does the High Court majority accept that international law can assist in interpreting the Constitution?
  options:
  - text: No — there is no majority support in the High Court for it.
    correct: true
    why: 'Correct — slide 26: no majority support; Kirby J espoused it, McHugh J rejected it as ''heretical''.'
  - text: Yes — a majority adopted Kirby J's approach in Newcrest Mining.
    why: Tempting because Kirby J espoused it in several cases, but the slide says there is no majority support for it.
  - text: Only for rights, since the Constitution contains a bill of rights modelled on the ICCPR.
    why: Wrong — the materials do not describe the Constitution as containing an ICCPR-based bill of rights, and no majority
      supports the approach.
- key: q414
  type: mcq
  concept: international-law-in-australian-interpretation
  variant-of: q402
  difficulty: 3
  stem: A statute reproduces art 1 of Treaty Z, to which Australia is party, word for word. How should an Australian court
    interpret it?
  options:
  - text: According to the ordinary Australian meaning of the words, ignoring the Convention entirely.
    why: Tempting because Australia is dualist, but where a statute incorporates a treaty's text it is read in line with
      the treaty's meaning.
  - text: In line with the meaning given to it in the treaty, unless the legislator expressed a contrary intention.
    correct: true
    why: 'Correct — Applicant A: incorporated treaty text takes its treaty meaning (with the VCLT interpretation rules)
      absent contrary intention.'
  - text: Only as the treaty's own monitoring committee directs, since treaty bodies interpret incorporated treaties.
    why: Wrong — nothing in the materials gives a treaty body binding interpretive authority over an Australian statute.
- key: q415
  type: mcq
  concept: international-law-in-australian-interpretation
  difficulty: 4
  stem: An Act clearly authorises detention in terms that plainly curtail personal liberty. A detainee argues the Act must
    be read down because it breaches an unincorporated treaty. Which combination of authorities gives the best answer?
  options:
  - text: Coco and Jumbunna together require the Act to be read down, because rights and international law both favour the
      detainee.
    why: Tempting because both presumptions point toward the detainee, but each applies only where the language is ambiguous;
      this Act is clear.
  - text: Kirby J in Newcrest requires the Act to be read consistently with international law because liberty is a universal
      right.
    why: Wrong — Kirby J's view concerned the Constitution, lacks majority support, and cannot override clear statutory
      words.
  - text: 'Polites and Yager: clear words prevail over international law, and the principle of legality is satisfied by
      unambiguous language.'
    correct: true
    why: Correct — presumptions yield to clear words (Polites), treaties cannot modify clear expressions (Yager), and Coco
      is met by unmistakable language.
- key: q416
  type: mcq
  concept: international-law-in-australian-interpretation
  difficulty: 2
  stem: Which Practitioner's Guide principle directs special attention to human rights?
  options:
  - text: Courts should give special attention to protecting human rights and fundamental freedoms recognised internationally.
    correct: true
    why: Correct — this is principle (viii), the last of the eight principles set out on slide 12.
  - text: Human rights treaties have direct effect in Australia, unlike other treaties, once ratified.
    why: Tempting because of the special attention given to rights, but Dietrich shows the ICCPR has no direct effect.
  - text: Parliament may never legislate in breach of a human rights treaty unless it first holds a national referendum
      on it.
    why: Wrong — principle (vii) says Parliament may legislate in breach of international law, taking the risk of international
      complications.
- key: q417
  type: truefalse
  set: quickfire
  concept: international-law-in-australian-interpretation
  statement: A treaty can be used under s 15AB of the Acts Interpretation Act to modify the meaning of statutory words that
    are otherwise clear.
  answer: false
  why: False — Yager (Mason J) holds a treaty cannot qualify or modify the meaning of legislative words or expressions which
    are otherwise clear.
- key: q418
  type: truefalse
  set: quickfire
  concept: international-law-in-australian-interpretation
  statement: The Jumbunna presumption, that ambiguous statutes are read consistently with international law, does not apply
    to clear legislation contrary to international law.
  answer: true
  why: True — it is a presumption only; Polites v Commonwealth shows it does not apply to clear legislation contrary to
    international law.
- key: q419
  type: truefalse
  concept: international-law-in-australian-interpretation
  statement: McHugh J in Al-Kateb v Godwin described the use of international law to interpret the Constitution as 'heretical'.
  answer: true
  why: True — McHugh J said it was heretical, amounting to amending the Constitution without a public referendum.
- key: q420
  type: short
  concept: international-law-in-australian-interpretation
  difficulty: 3
  prompt: Explain how international law can be used in interpreting Australian statutes and the Constitution, and the limits
    on that use. Refer to s 15AB of the Acts Interpretation Act 1901 (Cth), the common law presumptions and the competing
    judicial views on the Constitution.
  model: 'International law does not form part of Australian law as such, but it is an important aid to interpretation.
    Where a statute directly incorporates a treaty''s text, it is interpreted in line with the treaty''s meaning unless
    Parliament expressed a contrary intention (Applicant A). More broadly, s 15AB(2)(d) of the Acts Interpretation Act 1901
    (Cth) permits a treaty to be used if Australia actually or contemplatedly participated in it before the Act was enacted,
    and it is used to confirm the ordinary meaning, or the Act is ambiguous or obscure or would otherwise produce a manifestly
    absurd or unreasonable result. The limit is that a treaty cannot modify words that are otherwise clear (Yager, Mason
    J). At common law, ambiguous statutes are read consistently with international law (Jumbunna), but this presumption
    does not apply to clear contrary legislation (Polites); and under the principle of legality courts will not impute an
    intention to curtail fundamental rights without unambiguous language (Coco). For the Constitution there is no majority
    support: Kirby J (Newcrest) saw it accommodating international law so far as its text permits, while McHugh J (Al-Kateb)
    called that heretical — amending the Constitution without a referendum.'
  rubric:
  - id: r1
    criterion: Explains incorporated-text interpretation (Applicant A) and s 15AB with both conditions.
    marks: 2
    top-band: States the prior-participation condition and the (1)(a)/(1)(b) situations accurately.
    margin-note: What is the timing condition?
    authorities:
    - acts-interpretation-act-1901-cth-s15ab
  - id: r2
    criterion: States the Yager limit on clear words.
    marks: 1
    top-band: Links Yager to why interpretation is not incorporation.
    margin-note: Can a treaty change clear words?
    authorities: []
  - id: r3
    criterion: Explains both common law presumptions and the Polites limit.
    marks: 2
    top-band: Distinguishes Jumbunna consistency from the Coco principle of legality.
    margin-note: Two presumptions — name both.
    authorities: []
  - id: r4
    criterion: 'Explains the constitutional debate: no majority support, Kirby J versus McHugh J.'
    marks: 2
    top-band: Gives McHugh J's separation of powers and referendum reasoning.
    margin-note: Whose view has majority support?
    authorities: []
- key: q501
  type: mcq
  concept: customary-international-law-in-australian-law
  difficulty: 1
  set: pretest
  stem: What does the doctrine of incorporation say about customary international law in Australian law?
  options:
  - text: Customary international law becomes part of Australian law only when formally adopted by Parliament or the courts.
    why: Tempting because it is the other doctrine on the slide, but formal adoption describes transformation, not incorporation.
  - text: Customary international law can only take effect in Australia if it is first written into a treaty that Australia
      ratifies.
    why: Wrong — neither doctrine requires codification in a treaty; the debate is about custom's own route into the common
      law.
  - text: Customary international law is automatically a source of Australian law, unless there is a rule to the contrary.
    correct: true
    why: Correct — slide 21 defines incorporation as custom being automatically a source of Australian law unless a contrary
      rule exists.
- key: q502
  type: mcq
  concept: customary-international-law-in-australian-law
  difficulty: 2
  stem: Which approach to customary international law has Australia adopted, according to the slides?
  options:
  - text: Transformation exclusively, as settled by the High Court in Dietrich v The Queen for all international law.
    why: Tempting because Dietrich requires transformation, but Dietrich concerned a treaty (the ICCPR), not customary international
      law.
  - text: Incorporation exclusively, as settled by the Federal Court in Nulyarimma v Thompson in 1999.
    why: Wrong — Nulyarimma refused to treat the customary crime of genocide as part of Australian law without legislation,
      and did not settle the question generally.
  - text: Neither clearly — both transformation and incorporation have been recognised in High Court decisions.
    correct: true
    why: 'Correct — slide 21: Australia has not clearly adopted either approach, and both doctrines have been recognised
      by the High Court.'
- key: q503
  type: mcq
  concept: customary-international-law-in-australian-law
  difficulty: 2
  stem: Regardless of which doctrine applies, when can a rule of customary international law generally NOT be adopted into
    Australian law?
  options:
  - text: When it has not yet been confirmed by an ICJ judgment in a case to which Australia was a party.
    why: Tempting because judicial decisions help identify custom, but no ICJ-confirmation requirement exists for reception
      in Australia.
  - text: When fewer than two-thirds of states have ratified a treaty codifying the customary rule concerned.
    why: Wrong — custom does not depend on treaty ratification counts; the two-thirds figure belongs to the Dutch Constitution
      art 91(3).
  - text: When it is inconsistent with domestic legislation or essential common law doctrine.
    correct: true
    why: Correct — slide 21 states this key limitation, which applies whether you take the transformation or incorporation
      approach.
- key: q504
  type: mcq
  concept: customary-international-law-in-australian-law
  difficulty: 2
  stem: In Nulyarimma v Thompson, what did the applicants argue?
  options:
  - text: That genocide, as customary international law, could be tried in Australian courts even without legislation criminalising
      it.
    correct: true
    why: Correct — they argued the customary prohibition of genocide applied in Australia despite the Genocide Convention
      not having been transformed.
  - text: That the Genocide Convention had been fully transformed by amending the Criminal Code, so the case could proceed
      under statute.
    why: Tempting because the Criminal Code was later amended, but the lecturer says at this time the Convention had not
      been transformed.
  - text: That the external affairs power required the Commonwealth to list Lake Eyre on the World Heritage List.
    why: Wrong — the failure to seek World Heritage listing was alleged as an act of genocide, not argued as a constitutional
      duty.
- key: q505
  type: mcq
  concept: customary-international-law-in-australian-law
  difficulty: 2
  stem: What did the Federal Court hold in Nulyarimma v Thompson?
  options:
  - text: That without legislation declaring genocide a crime, it formed no part of Australian law.
    correct: true
    why: Correct — the Court held that, absent domestic legislation declaring genocide a crime, the customary prohibition
      had no effect on Australian law.
  - text: That the prohibition of genocide was not a jus cogens norm, so it could not form part of Australian law.
    why: Tempting because the claim failed, but the Court accepted that the prohibition of genocide is jus cogens; it failed
      for lack of legislation.
  - text: That genocide was part of Australian common law by incorporation, but the facts did not amount to genocide.
    why: Wrong — the majority did not hold that genocide was incorporated; they held it needed legislation before an Australian
      court could try it.
- key: q506
  type: mcq
  concept: customary-international-law-in-australian-law
  difficulty: 3
  stem: Why, according to Wilcox J in Nulyarimma, might the result differ for a civil law rule such as foreign sovereign
    immunity?
  options:
  - text: Because foreign sovereign immunity is a treaty rule found in a convention, whereas the prohibition of genocide
      is only customary.
    why: Tempting because genocide was argued as custom, but Wilcox J described sovereign immunity as a customary 'civil
      law rule', not a treaty rule.
  - text: Because civil rules are always jus cogens, while criminal rules never are.
    why: Wrong — the Court accepted genocide's prohibition as jus cogens; jus cogens status was not the distinction Wilcox
      J drew.
  - text: Because treating a civil rule as domestic law differs from punishing conduct that domestic law does not make punishable.
    correct: true
    why: Correct — Wilcox J (at [25]) contrasted civil rules like sovereign immunity with criminalising norms not made punishable
      domestically.
- key: q507
  type: mcq
  concept: customary-international-law-in-australian-law
  difficulty: 3
  stem: Which of these was one of Merkel J's criteria (in dissent) for customary international law to become a source of
    the common law?
  options:
  - text: The rule must have been applied by the ICJ in at least one contentious case.
    why: Tempting because judicial decisions evidence custom, but Merkel J's criteria say nothing about ICJ application.
  - text: The rule must have attained general acceptance by the community of nations.
    correct: true
    why: Correct — Merkel J required that the customary rule have 'attained … general acceptance by … the community of nations'.
  - text: The rule must have been endorsed by a resolution of both Houses of Parliament.
    why: Wrong — a parliamentary resolution would be transformation by Parliament; Merkel J's criteria concern reception
      by the courts.
- key: q508
  type: mcq
  concept: customary-international-law-in-australian-law
  difficulty: 3
  stem: Under Merkel J's criteria, from when is a customary rule taken to have been received into domestic law?
  options:
  - text: From the date of the court's judgment recognising it.
    why: Tempting because the court recognises the rule, but Merkel J said reception occurs as from the date the rule was
      established.
  - text: From the date Australia signed the relevant treaty codifying it.
    why: Wrong — Merkel J's criteria concern custom, not treaties, and link reception to the rule's own establishment.
  - text: As from the date the particular rule has been established.
    correct: true
    why: 'Correct — Merkel J: reception into domestic law is only taken to have occurred ''as from the date the particular
      rule … has been established''.'
- key: q509
  type: mcq
  concept: customary-international-law-in-australian-law
  difficulty: 2
  stem: Brennan J in Mabo v Queensland (No 2) said the common law may have to do what?
  options:
  - text: '''March in step with international law in order to provide the body of law to apply''.'
    correct: true
    why: Correct — slide 25 quotes Brennan J for the broadly accepted view that international law legitimately influences
      the common law.
  - text: Stand apart from international law, because the two are distinct legal orders.
    why: Tempting because Australia is primarily dualist, but Brennan J's quoted statement accepts international law's influence
      on the common law.
  - text: Yield to international law whenever the two conflict, even where legislation is clear.
    why: Wrong — clear legislation prevails in Australia; Brennan J spoke of the common law marching in step, not of overriding
      statutes.
- key: q510
  type: mcq
  concept: customary-international-law-in-australian-law
  difficulty: 2
  stem: What did Mason CJ and Deane J say in Minister for Immigration and Ethnic Affairs v Teoh about developing the common
    law?
  options:
  - text: That it must march in step with international law in order to provide the body of law to apply.
    why: Tempting because it is on the same slide, but this is Brennan J in Mabo (No 2), the broader view.
  - text: That it must always follow the ICCPR, because ratification creates legitimate rights in domestic law for every
      person.
    why: Wrong — Dietrich holds ratification has no direct domestic effect, and Teoh's quoted passage warns against back-door
      incorporation.
  - text: That it must not be seen as a back door means of importing an unincorporated convention into Australian law.
    correct: true
    why: Correct — slide 25 quotes this (at 288), representing the narrower view that international law only fills lacunae.
- key: q511
  type: mcq
  concept: customary-international-law-in-australian-law
  variant-of: q505
  difficulty: 3
  stem: 'A claimant asks an Australian court to punish X for a crime that exists only in customary international law, with
    no Australian legislation making it an offence. Applying Nulyarimma, the court will most likely:'
  options:
  - text: Decline, because a customary criminal norm needs domestic legislation before an Australian court can try it.
    correct: true
    why: Correct — Nulyarimma held that without legislation declaring the conduct a crime, the customary norm had no effect
      in Australian law.
  - text: Proceed, because under incorporation all custom is automatically part of the common law.
    why: Tempting because incorporation is one recognised doctrine, but Nulyarimma shows criminal norms need transformation
      whatever the general doctrine.
  - text: Proceed, but only if the crime is a jus cogens norm, as the genocide prohibition was accepted to be in that case.
    why: Wrong — genocide's prohibition was accepted as jus cogens in Nulyarimma, and still could not be tried without legislation.
- key: q512
  type: mcq
  concept: customary-international-law-in-australian-law
  difficulty: 3
  stem: Which statement best captures the contrast between treaties and custom in Australian law?
  options:
  - text: Treaties must be transformed by legislation; for custom the position is less settled, with both transformation
      and incorporation recognised.
    correct: true
    why: Correct — Dietrich settles that treaties need transformation, whereas slide 21 says Australia has not clearly adopted
      either doctrine for custom.
  - text: Custom must always be transformed by legislation, while treaties apply directly once ratified.
    why: 'Tempting because Nulyarimma required legislation for a customary crime, but this reverses the treaty rule: ratification
      has no direct effect (Dietrich).'
  - text: Both treaties and custom apply automatically, subject only to the Constitution.
    why: Wrong — neither applies automatically as a settled rule; treaties need transformation and custom's position is
      contested.
- key: q513
  type: mcq
  concept: customary-international-law-in-australian-law
  variant-of: q501
  difficulty: 2
  stem: What is the doctrine of transformation, as applied to customary international law?
  options:
  - text: Custom is transformed automatically into common law on the date it is established internationally.
    why: Tempting because it echoes Merkel J's timing criterion, but automatic reception is incorporation, not transformation.
  - text: Custom only becomes part of Australian law when formally adopted by Parliament or the courts as part of common
      law.
    correct: true
    why: 'Correct — slide 21 defines transformation this way: some action by Australia is needed before a customary rule
      applies.'
  - text: Custom is transformed into a treaty when states later codify it at an international conference and then ratify
      it.
    why: Wrong — codification is an international process; transformation here refers to adoption into Australian law.
- key: q514
  type: mcq
  concept: customary-international-law-in-australian-law
  difficulty: 2
  stem: 'Hilary Charlesworth''s comment quoted on slide 27 describes the High Court''s approach to international law as:'
  options:
  - text: Enthusiastically monist, treating every ratified treaty as part of the common law from the day of ratification.
    why: Tempting if you overread Kirby J's dissents, but Charlesworth's point is precisely the Court's caution.
  - text: Hostile, having never once referred to international law in any of its decisions.
    why: Wrong — the Court does refer to international law (e.g. Mabo, Teoh); Charlesworth calls it cautious, not hostile.
  - text: '''Very cautious in its embrace of international law; it has kept its gloves and hat on at all times''.'
    correct: true
    why: Correct — Charlesworth describes the High Court's caution, adding that international law 'unsettles and challenges'
      rigidities of Australian law.
- key: q515
  type: mcq
  concept: customary-international-law-in-australian-law
  variant-of: q511
  difficulty: 4
  stem: Counsel argues a well-established customary rule of civil (non-criminal) character should be applied by an Australian
    court, and no statute or declared common law conflicts with it. Which is the strongest supported submission?
  options:
  - text: It may be received, as Merkel J's criteria suggest, provided it has general acceptance and is consistent with
      statute and declared common law.
    correct: true
    why: Correct — no inconsistency bars it, Wilcox J suggested civil rules may differ from criminal ones, and Merkel J's
      criteria support reception.
  - text: It cannot be applied at all, because Nulyarimma held that no custom forms part of Australian law.
    why: Tempting because Nulyarimma rejected the claim, but it turned on a criminal norm; Wilcox J suggested civil rules
      may be treated differently.
  - text: It must be applied even if a statute conflicts, because the rule is well established.
    why: Wrong — whichever doctrine is used, custom cannot generally be adopted where inconsistent with domestic legislation.
- key: q516
  type: mcq
  concept: customary-international-law-in-australian-law
  difficulty: 1
  stem: What is the 'narrower' view of international law's influence on the common law?
  options:
  - text: International law fills lacunae (gaps) in the existing common law.
    correct: true
    why: Correct — slide 25 describes the narrower view as international law filling lacunae, not a back door for unincorporated
      treaties.
  - text: International law replaces the common law wherever the two differ.
    why: Tempting because it sounds like strong influence, but that is not even the broad view; nothing supports replacement.
  - text: International law has no influence at all on the development of the common law in Australia.
    why: Wrong — even the narrow view accepts some influence (filling gaps); the broadly accepted view sees it as a legitimate
      influence.
- key: q517
  type: truefalse
  set: quickfire
  concept: customary-international-law-in-australian-law
  statement: In Nulyarimma v Thompson, the Federal Court accepted that the prohibition of genocide is a jus cogens norm.
  answer: true
  why: True — the Court accepted genocide's prohibition as jus cogens, but held that without implementing legislation it
    had no effect on Australian law.
- key: q518
  type: truefalse
  set: quickfire
  concept: customary-international-law-in-australian-law
  statement: Australia has clearly adopted the doctrine of incorporation for customary international law.
  answer: false
  why: False — Australia has not clearly adopted either transformation or incorporation; both doctrines have been recognised
    in High Court decisions.
- key: q519
  type: truefalse
  set: quickfire
  concept: customary-international-law-in-australian-law
  statement: Merkel J's criteria in Nulyarimma were given in the majority judgment of the Federal Court.
  answer: false
  why: False — Merkel J was in dissent; the lecturer notes his criteria have been cited by other judges in subsequent cases.
- key: q520
  type: short
  concept: customary-international-law-in-australian-law
  difficulty: 3
  prompt: How does customary international law take effect in Australian law? Explain the doctrines of transformation and
    incorporation, the key limitation, and Nulyarimma v Thompson (including Merkel J's dissent).
  model: 'The position for custom is less settled than for treaties. Under the doctrine of transformation, customary international
    law only becomes part of Australian law when formally adopted by Parliament or the courts as part of the common law.
    Under the doctrine of incorporation, it is automatically a source of Australian law unless there is a rule to the contrary.
    Australia has not clearly adopted either approach, and both have been recognised in High Court decisions. Under either,
    a customary rule cannot generally be adopted where inconsistent with domestic legislation or essential common law doctrine.
    In Nulyarimma v Thompson, Aboriginal applicants argued that genocide, as customary international law, could be tried
    in Australian courts although the Genocide Convention had not been transformed. The Federal Court held that even if
    genocide is part of customary international law, and even accepting its prohibition is jus cogens, it is not part of
    Australian law without legislation declaring it a crime; Wilcox J contrasted civil rules like foreign sovereign immunity
    with criminalising norms. Merkel J, dissenting, set criteria: general acceptance by the community of nations; reception
    consistent with statute and declared common law; once received, a true declaration of the common law, as from the date
    the rule was established.'
  rubric:
  - id: r1
    criterion: Defines transformation and incorporation accurately.
    marks: 2
    top-band: Uses the slide definitions and states Australia has not clearly adopted either.
    margin-note: Which has Australia adopted?
    authorities: []
  - id: r2
    criterion: 'States the limitation: no adoption where inconsistent with legislation or essential common law doctrine.'
    marks: 1
    top-band: Notes the limitation applies under both doctrines.
    margin-note: Does the limit apply to both?
    authorities: []
  - id: r3
    criterion: Explains Nulyarimma's facts and holding, including jus cogens and the criminal-law point.
    marks: 2
    top-band: Explains why the criminal character of the norm mattered (Wilcox J).
    margin-note: Why did criminal law matter?
    authorities: []
  - id: r4
    criterion: Sets out Merkel J's dissenting criteria.
    marks: 2
    top-band: Gives at least three criteria, including the timing of reception.
    margin-note: Name Merkel J's criteria.
    authorities: []
- key: q601
  type: mcq
  concept: forms-of-jurisdiction
  difficulty: 1
  set: pretest
  stem: What are the three basic forms of jurisdiction (tutorial question 2)?
  options:
  - text: Jurisdiction to prescribe, to enforce and to adjudicate.
    correct: true
    why: 'Correct — slide 32 lists the three forms: prescriptive, enforcement and adjudicative jurisdiction.'
  - text: Territorial, nationality and universal jurisdiction.
    why: Tempting because these are real terms from this week, but they are grounds for asserting jurisdiction, not its
      forms.
  - text: Legislative, executive and judicial power under the separation of powers.
    why: Wrong — these describe the separation of powers in the Australian Constitution, not the international law forms
      of jurisdiction.
- key: q602
  type: mcq
  concept: forms-of-jurisdiction
  difficulty: 2
  stem: How does Oxman (MPEPIL) define jurisdiction?
  options:
  - text: Supreme authority within a territory, subject to international requirements.
    why: Tempting because it appears on the same slide, but this is the description of sovereignty, to which jurisdiction
      is linked.
  - text: The competence of the International Court of Justice to hear disputes between states that have consented in advance
      to its jurisdiction.
    why: Wrong — that is the ICJ's contentious jurisdiction; this week's concept is a state's power over persons and conduct.
  - text: The lawful power of a state to define and enforce the rights and duties, and control the conduct, of natural and
      juridical persons.
    correct: true
    why: Correct — this is the definition on slide 30, which the lecturer summarises as the power to regulate, enforce and
      adjudicate.
- key: q603
  type: mcq
  concept: forms-of-jurisdiction
  difficulty: 2
  stem: According to the slides, what is the relationship between sovereignty and statehood?
  options:
  - text: Sovereignty is a precondition a state must satisfy before it can be recognised as a state.
    why: Tempting because sovereignty and statehood are closely linked, but the slide says sovereignty is not a precondition
      for statehood.
  - text: Sovereignty and statehood are identical, so any sovereign entity is automatically a state.
    why: Wrong — the lecturer notes they are sometimes confused; sovereignty is a consequence of statehood, not the same
      concept.
  - text: 'Sovereignty is a description of statehood: it describes the attributes of statehood.'
    correct: true
    why: 'Correct — Besson (MPEPIL), on slide 30: sovereignty is not a precondition but a description of statehood''s attributes.'
- key: q604
  type: mcq
  concept: forms-of-jurisdiction
  difficulty: 2
  stem: Which of these is an example of enforcement jurisdiction?
  options:
  - text: Parliament enacting a law that makes theft a criminal offence.
    why: Tempting because it is part of the theft example, but criminalising theft is prescriptive jurisdiction.
  - text: Police physically apprehending a suspected thief.
    correct: true
    why: 'Correct — slide 38: the physical apprehension of a suspected thief is a case of enforcing jurisdiction.'
  - text: A court hearing the criminal prosecution of the accused.
    why: Wrong — the prosecution in court is adjudicative jurisdiction, the power of courts to hear and decide.
- key: q605
  type: mcq
  concept: forms-of-jurisdiction
  difficulty: 3
  stem: What did the PCIJ say in the Lotus case about a state extending its laws to persons, property and acts outside its
    territory?
  options:
  - text: International law prohibits it generally, unless a permissive rule to the contrary exists.
    why: Tempting because Lotus does require a permissive rule — but for enforcement in another state's territory, not for
      prescription.
  - text: States may do so only for their own nationals, never for foreign nationals located abroad or for foreign property.
    why: Wrong — Lotus framed a broad discretion; nationality is one later ground of jurisdiction, not the Lotus limit.
  - text: International law leaves states a wide measure of discretion, limited only in certain cases by prohibitive rules.
    correct: true
    why: 'Correct — Lotus (p 19): far from a general prohibition, states have a wide measure of discretion limited only
      by prohibitive rules.'
- key: q606
  type: mcq
  concept: forms-of-jurisdiction
  difficulty: 3
  stem: What is the 'first and foremost restriction' international law imposes on a state, according to Lotus?
  options:
  - text: It may not legislate on any matter involving foreign nationals without their state's consent.
    why: Tempting because consent recurs this week, but Lotus gave states wide discretion to prescribe; the restriction
      is on exercising power abroad.
  - text: It may not try any person in its own courts for conduct committed outside its territory, whatever the grounds
      relied on.
    why: Wrong — adjudication over foreign conduct is possible on the grounds of jurisdiction; Lotus's restriction concerns
      power exercised in another state's territory.
  - text: Failing a permissive rule to the contrary, it may not exercise its power in any form in the territory of another
      state.
    correct: true
    why: Correct — Lotus (p 18) states this restriction on enforcement jurisdiction in another state's territory.
- key: q607
  type: mcq
  concept: forms-of-jurisdiction
  difficulty: 2
  stem: Why was Israel's 1960 capture of Adolf Eichmann in Argentina unlawful?
  options:
  - text: Because Israel had no jurisdiction to prescribe crimes against humanity committed during the Second World War.
    why: Tempting because the trial was controversial, but the unlawfulness identified was the unauthorised enforcement
      in Argentina.
  - text: Because Eichmann was an Argentine national, so only Argentina could exercise any form of jurisdiction over him
      for any crime at all.
    why: Wrong — the materials do not describe Eichmann as Argentine; the breach was acting in Argentina's territory without
      consent.
  - text: Because Israeli agents exercised enforcement jurisdiction in Argentina without the consent of the Argentine authorities.
    correct: true
    why: Correct — unauthorised enforcement in another state is illegal; the Security Council requested Israel offer Argentina
      compensation.
- key: q608
  type: mcq
  concept: forms-of-jurisdiction
  variant-of: q607
  difficulty: 2
  stem: How did the UN Security Council respond to the Eichmann capture?
  options:
  - text: By authorising Argentina to use force to recover Eichmann from Israel.
    why: Wrong — nothing in the materials suggests any authorisation of force; the response was a request for compensation.
  - text: By referring Israel's conduct to the International Criminal Court for investigation.
    why: Tempting because Eichmann's crimes were international crimes, but the Council's response concerned the breach of
      Argentina's sovereignty, not referral.
  - text: By requesting Israel to offer compensation to Argentina.
    correct: true
    why: 'Correct — slide 35: the Security Council requested Israel to offer compensation; the lecturer adds it was eventually
      done through an apology.'
- key: q609
  type: mcq
  concept: forms-of-jurisdiction
  difficulty: 3
  stem: In the Lockerbie incident, how was the problem of Libya refusing to extradite the suspects resolved?
  options:
  - text: A special Scottish court sat at Camp Zeist in the Netherlands, with Scottish judges applying Scottish law.
    correct: true
    why: Correct — under the 1998 UK/Netherlands Agreement, a Scottish trial was held in the Netherlands, an example of
      adjudicating outside one's territory.
  - text: The suspects were tried by the ICJ, which has jurisdiction over individuals accused of international crimes.
    why: Tempting because the ICJ sits in The Hague, but the ICJ decides disputes between states; the trial was a Scottish
      court.
  - text: Libya tried the suspects in its own courts, and the UK and US accepted the verdict.
    why: Wrong — Libya asserted jurisdiction over its nationals, but the trial took place before the special Scottish court.
- key: q610
  type: mcq
  concept: forms-of-jurisdiction
  variant-of: q604
  difficulty: 2
  stem: The imprisonment of a convicted thief, and custody on remand while awaiting sentence, are examples of which form
    of jurisdiction?
  options:
  - text: Jurisdiction to adjudicate, because a court has imposed the sentence.
    why: Tempting because courts impose sentences, but slide 38 lists imposing imprisonment and remand custody as enforcement.
  - text: Jurisdiction to prescribe, because the law sets the maximum penalty.
    why: Wrong — prescription is making the law (criminalising theft); carrying out imprisonment is enforcement.
  - text: Jurisdiction to enforce.
    correct: true
    why: Correct — slide 38 lists imposing a sentence of imprisonment and custody on remand as enforcement jurisdiction.
- key: q611
  type: mcq
  concept: forms-of-jurisdiction
  difficulty: 2
  stem: Which is the most intrusive form of jurisdiction, whose exercise outside the state's territory is usually prohibited?
  options:
  - text: Jurisdiction to enforce.
    correct: true
    why: Correct — the lecturer calls enforcement one of the most intrusive forms, so its exercise abroad is usually prohibited
      without permission.
  - text: Jurisdiction to prescribe.
    why: Tempting because prescription can reach abroad, but Lotus allows wide discretion to prescribe; it is not the most
      intrusive form.
  - text: Jurisdiction to adjudicate.
    why: Wrong — adjudication is in principle territorial, but the lecturer singles out enforcement as the most intrusive
      form.
- key: q612
  type: mcq
  concept: forms-of-jurisdiction
  variant-of: q606
  difficulty: 3
  stem: State F wants its police to arrest a suspect inside State G. What does international law require, on this week's
    materials?
  options:
  - text: G's permission, given beforehand by treaty or after the event by agreement.
    correct: true
    why: Correct — the lecturer explains permission may be given beforehand by treaty or after a situation by agreement;
      otherwise it is a serious breach.
  - text: 'Nothing: F may enforce its law anywhere it has prescriptive jurisdiction.'
    why: Tempting because prescription can extend abroad, but enforcement abroad needs a permissive rule — Lotus's first
      restriction.
  - text: A UN Security Council resolution authorising the arrest under the UN Charter.
    why: Wrong — the materials describe permission from the territorial state, not a Security Council authorisation, as
      the route.
- key: q613
  type: mcq
  concept: forms-of-jurisdiction
  difficulty: 1
  stem: Which is NOT one of the implications of sovereignty listed on slide 31?
  options:
  - text: A right to enforce national law in any state where the state's nationals live.
    correct: true
    why: Correct — this is not an implication of sovereignty; enforcement in another state's territory is prohibited without
      permission (Lotus).
  - text: Sovereign immunity from the jurisdiction of foreign courts for sovereign acts.
    why: Wrong choice — sovereign immunity is listed on slide 31 as an implication of sovereignty.
  - text: The duty of non-intervention (ius excludendi alios).
    why: Wrong choice — the duty of non-intervention, the right to exclude others, is listed on slide 31.
  - text: Diplomatic immunity for representatives acting in their official capacity.
    why: Wrong choice — diplomatic immunity is listed on slide 31 as an implication of sovereignty.
- key: q614
  type: mcq
  concept: forms-of-jurisdiction
  difficulty: 2
  stem: According to slide 31, what does a state's territory comprise?
  options:
  - text: Land only; the sea and airspace are international commons.
    why: Tempting because the high seas are beyond national jurisdiction, but territory includes the territorial sea and
      airspace.
  - text: Land, the territorial sea up to 12 nautical miles from the coast, and the airspace above land and sea.
    correct: true
    why: Correct — slide 31 defines territory as land, the territorial sea to 12 nautical miles, and the airspace above
      land and sea.
  - text: Land and a 200 nautical mile zone of sea measured from the coast, without the airspace above either.
    why: Wrong — the slide gives 12 nautical miles for the territorial sea and includes airspace.
- key: q615
  type: mcq
  concept: forms-of-jurisdiction
  variant-of: q609
  difficulty: 4
  stem: Adjudicative jurisdiction is in principle territorial. Which feature of Lockerbie made it a notable exception?
  options:
  - text: A US court tried the suspects in Scotland, relying on the nationality of most victims.
    why: Tempting because many victims were American, but no US court tried the case; the court was Scottish.
  - text: A Scottish court exercised adjudicative jurisdiction outside UK territory, in the Netherlands, by agreement.
    correct: true
    why: Correct — the Scottish court sat at Camp Zeist under the UK/Netherlands Agreement, adjudicating outside its own
      territory with consent.
  - text: The ICJ applied Scottish law to individuals because Libya had accepted its compulsory jurisdiction.
    why: Wrong — the trial court was a special Scottish court, not the ICJ, and the materials say nothing about compulsory
      ICJ jurisdiction.
- key: q616
  type: mcq
  concept: forms-of-jurisdiction
  difficulty: 2
  stem: Enforcement means the exercise of jurisdiction by which part of a state's government, according to Rose et al?
  options:
  - text: The executive branch, responsible for enforcing regulations and maintaining public order.
    correct: true
    why: 'Correct — Rose et al (p 102): enforcement is exercised by the executive branch, responsible for enforcement and
      public order.'
  - text: The legislature, which makes the laws to be enforced.
    why: Tempting because enforcement follows prescription, but making laws is prescriptive jurisdiction, exercised by the
      legislature.
  - text: The judiciary, which decides disputes about the laws.
    why: Wrong — deciding disputes is adjudicative jurisdiction; enforcement is the executive's function.
- key: q617
  type: truefalse
  set: quickfire
  concept: forms-of-jurisdiction
  statement: According to Lotus, a state may not exercise its power in any form in another state's territory, failing a
    permissive rule to the contrary.
  answer: true
  why: True — this is the 'first and foremost restriction' in Lotus (p 18), limiting enforcement jurisdiction in another
    state's territory.
- key: q618
  type: truefalse
  set: quickfire
  concept: forms-of-jurisdiction
  statement: Criminalising theft in a domestic statute is an exercise of enforcement jurisdiction.
  answer: false
  why: False — the domestic criminalisation of theft is prescriptive jurisdiction; enforcement is apprehending, remanding
    and imprisoning.
- key: q619
  type: truefalse
  set: quickfire
  concept: forms-of-jurisdiction
  statement: Sovereignty is a precondition for statehood, according to the slides.
  answer: false
  why: False — the slides (citing Besson) say sovereignty is not a precondition for statehood but a description of statehood's
    attributes.
- key: q620
  type: short
  concept: forms-of-jurisdiction
  difficulty: 3
  prompt: What are the three basic forms of jurisdiction? Explain each, illustrate them with the theft example, and explain
    how international law limits each form outside a state's territory, using Lotus, Eichmann and Lockerbie.
  model: 'Jurisdiction is the lawful power of a state to define and enforce the rights and duties, and control the conduct,
    of natural and juridical persons (Oxman), and it is linked to sovereignty. Jurisdiction to prescribe is the power to
    make national law applicable to persons, property and activities, whether by legislation, executive act, regulation
    or court determination; criminalising theft is prescriptive. In Lotus the PCIJ said international law leaves states
    a wide measure of discretion to extend their laws abroad, limited only by prohibitive rules. Jurisdiction to enforce
    is the executive putting laws into operation — arrest, seizure, freezing assets, fines; apprehending, remanding and
    imprisoning a thief are enforcement. It is the most intrusive form: Lotus''s first and foremost restriction is that,
    failing a permissive rule, a state may not exercise its power in any form in another state''s territory. Israel''s capture
    of Eichmann in Argentina without consent was unlawful, and the Security Council requested compensation. Jurisdiction
    to adjudicate is the power of domestic courts to hear and bindingly decide disputes; prosecuting the thief is adjudicative.
    It is in principle territorial, but in Lockerbie a Scottish court sat in the Netherlands by agreement.'
  rubric:
  - id: r1
    criterion: Identifies and defines the three forms accurately.
    marks: 2
    top-band: Defines each form, using the Restatement or Rose et al descriptions where apt.
    margin-note: Define each form, not just name it.
    authorities: []
  - id: r2
    criterion: Applies the theft example correctly to all three forms.
    marks: 1
    top-band: Places criminalisation, apprehension/imprisonment and prosecution in the right forms.
    margin-note: Is imprisonment enforcement or adjudication?
    authorities: []
  - id: r3
    criterion: 'Explains Lotus: wide discretion to prescribe, but no enforcement in another state without a permissive rule.'
    marks: 2
    top-band: Contrasts the two Lotus passages precisely.
    margin-note: Which Lotus passage applies to which form?
    authorities: []
  - id: r4
    criterion: Uses Eichmann and Lockerbie accurately to illustrate the limits and an exception by agreement.
    marks: 2
    top-band: Notes the Security Council's compensation request and the Camp Zeist arrangement.
    margin-note: What made Lockerbie's trial lawful?
    authorities: []
- key: q701
  type: mcq
  concept: grounds-of-jurisdiction
  difficulty: 1
  stem: What is universal jurisdiction (tutorial question 3)?
  options:
  - text: Jurisdiction any state can claim over offences so grave that where, against whom and by whom they occurred is
      irrelevant.
    correct: true
    why: 'Correct — slide 46: offences so serious and disruptive to the international community that any state can claim
      jurisdiction, with no direct link.'
  - text: Jurisdiction over offences committed abroad by non-citizens that threaten a state's vital security interests,
      such as espionage.
    why: Tempting because it also reaches foreigners abroad, but a link to the state's security interest is the protective
      principle.
  - text: Jurisdiction of the ICJ over all states, whether or not they have consented to it.
    why: Wrong — universal jurisdiction is a ground for a state's own jurisdiction, not compulsory jurisdiction of an international
      court.
- key: q702
  type: mcq
  concept: grounds-of-jurisdiction
  difficulty: 1
  stem: What is described as the fundamental basis of jurisdiction, derived from state sovereignty?
  options:
  - text: The principle of territoriality.
    correct: true
    why: 'Correct — slide 40: territorial jurisdiction is the fundamental basis of jurisdiction, derived from state sovereignty.'
  - text: The principle of passive personality.
    why: Wrong — passive personality is described as controversial and better as a subsidiary ground, not the fundamental
      basis.
  - text: The principle of universality, since it applies to every state equally.
    why: Tempting because it is available to all states, but universality applies only to certain grave offences; territory
      is fundamental.
- key: q703
  type: mcq
  concept: grounds-of-jurisdiction
  difficulty: 2
  stem: A Greek woman living in Greece assaults her Australian partner in Athens. On what basis can Greece most straightforwardly
    assert jurisdiction?
  options:
  - text: Passive personality, because the victim is not Greek.
    why: Wrong — passive personality turns on the victim being the prosecuting state's national; the Australian victim would
      give Australia, not Greece, that ground.
  - text: Territoriality, because the whole offence occurred on Greek territory.
    correct: true
    why: 'Correct — the lecturer''s example: Greece can straightforwardly assert jurisdiction on the basis of territoriality,
      as the crime occurred wholly in Greece.'
  - text: Protective jurisdiction, because domestic violence threatens Greece's vital interests.
    why: Tempting because the state cares about public order, but protective jurisdiction requires a genuine threat to a
      vital security interest.
- key: q704
  type: mcq
  concept: grounds-of-jurisdiction
  variant-of: q703
  difficulty: 2
  stem: In the same Greek example, would Greece still have jurisdiction if the Australian partner had committed the assault?
  options:
  - text: No — Greece can only prosecute Greek nationals, so Australia alone would have jurisdiction over its own national.
    why: Tempting because the offender is Australian, but citizenship is not required for territorial jurisdiction.
  - text: Only if Australia first consented to Greece prosecuting its national.
    why: Wrong — no consent of the offender's state is needed for territorial jurisdiction over acts committed on the territory.
  - text: Yes — territorial jurisdiction extends to everyone located on the territory, citizen or not.
    correct: true
    why: Correct — the lecturer says Greece would also have jurisdiction if the Australian husband were the assailant, because
      he is on Greek territory.
- key: q705
  type: mcq
  concept: grounds-of-jurisdiction
  difficulty: 3
  stem: Objective territoriality gives a state jurisdiction over what?
  options:
  - text: An offence initiated or planned on its territory, even if completed abroad.
    why: Tempting because it is the other approach on slide 41, but initiation or planning is subjective territoriality.
  - text: An offence against its nationals, wherever in the world it was committed and whoever committed it.
    why: Wrong — jurisdiction based on the victim's nationality is passive personality, not a form of territoriality.
  - text: An offence completed on its territory, even if some constituent elements took place abroad.
    correct: true
    why: 'Correct — slide 41: objective territoriality focuses on effects, covering offences completed on the territory
      though elements occurred abroad.'
- key: q706
  type: mcq
  concept: grounds-of-jurisdiction
  difficulty: 3
  stem: Miss Shorttempered, a Greek national in Greece, posts poisoned olive oil to Mr Tindercrush in London, who dies.
    On what basis can the UK assert jurisdiction?
  options:
  - text: Objective territoriality, because the offence was completed (the death occurred) in the UK.
    correct: true
    why: Correct — the effects occurred in London, so the UK can rely on objective territoriality even though elements took
      place in Greece.
  - text: Subjective territoriality, because the offence was planned in the UK.
    why: Wrong — the offence was planned and initiated in Greece, which gives Greece (not the UK) subjective territoriality.
  - text: Active nationality, because the victim, Mr Tindercrush, was a UK national living in London at the time of death.
    why: Tempting because the victim was British, but active nationality concerns the offender's nationality; the victim's
      would be passive personality.
- key: q707
  type: mcq
  concept: grounds-of-jurisdiction
  variant-of: q706
  difficulty: 3
  stem: In the same olive oil scenario, which grounds could Greece rely on?
  options:
  - text: Objective territoriality and passive personality.
    why: Wrong — the effects occurred in the UK and the victim was British, so these grounds point to the UK, not Greece.
  - text: Subjective territoriality and active nationality.
    correct: true
    why: Correct — the offence was initiated in Greece (subjective territoriality) by a Greek national (active nationality).
  - text: Universality, because poisoning is a crime against humanity.
    why: Tempting because the crime is grave, but a single poisoning is not among the offences listed for universal jurisdiction.
- key: q708
  type: mcq
  concept: grounds-of-jurisdiction
  difficulty: 2
  stem: Which statement about active nationality jurisdiction is correct?
  options:
  - text: A state may prosecute anyone who harms its nationals abroad, whatever the offender's nationality.
    why: Tempting because it also involves nationals, but jurisdiction based on the victim is passive personality.
  - text: A state may prosecute its nationals for acts committed abroad, and a dual national may face both states of nationality.
    correct: true
    why: 'Correct — slide 43: the state of nationality may prosecute a national for acts abroad; with dual nationality,
      both states may assert it.'
  - text: A state may prosecute its nationals abroad only if the act is also a crime under international law, such as torture
      or genocide.
    why: Wrong — no such requirement appears; Australia extends ordinary criminal law, like sex with under-16s, to nationals
      abroad.
- key: q709
  type: mcq
  concept: grounds-of-jurisdiction
  difficulty: 2
  stem: How does the ICJ in Nottebohm describe nationality, according to state practice?
  options:
  - text: A legal bond based on a social fact of attachment, a genuine connection of existence, interests and sentiments,
      with reciprocal rights and duties.
    correct: true
    why: "Correct — Nottebohm treats nationality as a legal bond resting on a social fact of attachment: a genuine connection of existence, interests and sentiments, with reciprocal rights and duties."
  - text: A status that international law defines uniformly, which states must confer on everyone born in their territory.
    why: Tempting because ius soli is a common basis, but there is no accepted international definition and states largely
      decide who their nationals are.
  - text: A purely formal registration, like that of ships and aircraft, without any need for real connection.
    why: Wrong — ships and aircraft take the nationality of registration, but Nottebohm speaks of a genuine connection for
      individuals.
- key: q710
  type: mcq
  concept: grounds-of-jurisdiction
  difficulty: 3
  stem: Mr Brawel, an Australian national, seriously injures two American nationals while they are holidaying in Bali. Which
    analysis is best?
  options:
  - text: Only the US can act, on passive personality, because the victims were American.
    why: Tempting because the victims were American, but passive personality is controversial and subsidiary; territory
      and nationality are stronger.
  - text: Indonesia on territoriality; Australia on active nationality; the US only on the controversial passive personality
      principle.
    correct: true
    why: Correct — the offence occurred in Indonesia, the offender is Australian, and the victims' nationality gives the
      US only a weak, subsidiary ground.
  - text: Any state, on universality, because assault of foreign tourists is disruptive to the international community.
    why: Wrong — an assault is not among the grave offences (piracy, genocide, war crimes, crimes against humanity, torture)
      attracting universality.
- key: q711
  type: mcq
  concept: grounds-of-jurisdiction
  difficulty: 2
  stem: Why is the passive personality principle controversial?
  options:
  - text: Because the ICJ has declared it contrary to jus cogens.
    why: Wrong — nothing in the materials records such a declaration; the concern is fairness and weak acceptance in the
      literature.
  - text: Because it allows states to prosecute their own nationals abroad, which intrudes on other states' sovereignty.
    why: Tempting because it sounds intrusive, but prosecuting one's own nationals abroad is active nationality, a well-accepted
      ground.
  - text: Because a person could not know which law applies to them — a fairness concern.
    correct: true
    why: 'Correct — the lecturer''s Spain example: you would expect Spanish law, yet passive personality could expose you
      to US law.'
- key: q712
  type: mcq
  concept: grounds-of-jurisdiction
  difficulty: 2
  stem: In US v Yunis, why did the US claim jurisdiction over a Lebanese national for a hijacking outside the US?
  options:
  - text: Because the aircraft was registered in the US, so it had US nationality like any American-registered aircraft.
    why: Tempting because aircraft take their state of registration's nationality, but the flight was Royal Jordanian; the
      claim rested on the victims.
  - text: Because hijacking threatened the US currency and so engaged the protective principle.
    why: Wrong — counterfeiting currency is a protective-principle example; Yunis rested on the nationality of the victims.
  - text: Because the hijacked Royal Jordanian flight had American citizens aboard — the passive personality principle.
    correct: true
    why: Correct — the US argued jurisdiction because the actions were against American citizens; the court found the US
      had jurisdiction.
- key: q713
  type: mcq
  concept: grounds-of-jurisdiction
  difficulty: 3
  stem: A foreign national, abroad, counterfeits Australian currency and passports. Which ground best supports Australian
    jurisdiction?
  options:
  - text: 'The protective principle: counterfeiting currency and passports threatens a vital state interest.'
    correct: true
    why: Correct — the protective principle covers acts abroad by non-citizens threatening vital interests, with counterfeiting
      as the classic example.
  - text: Passive personality, because Australians in general may be deceived by the counterfeit notes and passports.
    why: Tempting because Australians may be harmed, but passive personality needs an identified national victim; this is
      about a vital state interest.
  - text: Active nationality, because the passports are Australian.
    why: Wrong — active nationality depends on the offender's nationality; the documents' origin does not make the forger
      an Australian national.
- key: q714
  type: mcq
  concept: grounds-of-jurisdiction
  variant-of: q701
  difficulty: 3
  stem: An XWZ member tortured civilians and committed crimes against humanity in State A, then fled to Germany. Can Germany
    exercise jurisdiction, although the crimes were not committed on its territory or against its nationals?
  options:
  - text: Yes — universal jurisdiction covers crimes against humanity and torture, and he is present in Germany.
    correct: true
    why: Correct — these crimes attract universal jurisdiction, and states usually require the accused's presence on their
      territory, as here.
  - text: No — without a territorial or nationality link, Germany has no ground of jurisdiction at all.
    why: Tempting because most grounds need such a link, but universal jurisdiction needs no direct link for grave offences.
  - text: Only if State A consents, because the protective principle requires the consent of the territorial state.
    why: Wrong — the protective principle concerns threats to the prosecuting state's security and needs no consent; universality
      applies here.
- key: q715
  type: mcq
  concept: grounds-of-jurisdiction
  difficulty: 2
  stem: Which crime originally gave rise to the notion of universal jurisdiction?
  options:
  - text: Piracy.
    correct: true
    why: Correct — piracy, committed on the high seas outside the jurisdiction of all states, originally gave rise to universal
      jurisdiction.
  - text: Genocide, after the adoption of the 1948 Genocide Convention.
    why: Tempting because genocide is now covered, but the lecturer says piracy came first; recognition of other crimes
      followed World War II.
  - text: Espionage against diplomatic personnel.
    why: Wrong — espionage and attacks on diplomats are examples of the protective principle, not the origin of universal
      jurisdiction.
- key: q716
  type: mcq
  concept: grounds-of-jurisdiction
  difficulty: 3
  stem: How does the 2001 Cybercrime Convention address concurring jurisdiction?
  options:
  - text: It requires the states involved to consult to determine the most appropriate jurisdiction.
    correct: true
    why: Correct — art 22(5) requires consultation, without stipulating that one ground has priority over another.
  - text: It gives priority to the state of nationality of the offender over all other grounds, including territoriality.
    why: Tempting because nationality is a strong ground, but the Convention ranks no ground; it requires consultation.
  - text: It gives exclusive jurisdiction to the state where the servers were located.
    why: Wrong — no server-location rule appears in the materials; the Convention's mechanism is consultation between the
      states.
- key: q717
  type: truefalse
  set: quickfire
  concept: grounds-of-jurisdiction
  statement: Under subjective territoriality, a state has jurisdiction over criminal offences initiated or planned on its
    territory.
  answer: true
  why: 'True — slide 41: subjective territoriality covers offences initiated or planned on the territory, important for
    transnational and cyber crime.'
- key: q718
  type: truefalse
  set: quickfire
  concept: grounds-of-jurisdiction
  statement: There are universally binding rules that determine which state's jurisdiction prevails when jurisdictions concur.
  answer: false
  why: 'False — slide 49: there are no universally binding rules; treaties like the Cybercrime Convention provide pathways,
    and the closest link usually matters.'
- key: q719
  type: truefalse
  set: quickfire
  concept: grounds-of-jurisdiction
  statement: Exercising universal jurisdiction where no treaty establishes it is controversial, so states usually require
    the alleged perpetrator's presence on their territory.
  answer: true
  why: True — the lecturer says states make it more acceptable by requiring a territorial link, such as presence; Australia's
    Criminal Code Div 268 is an example.
- key: q721
  type: truefalse
  concept: grounds-of-jurisdiction
  statement: The passive personality principle bases jurisdiction on the nationality of the offender.
  answer: false
  why: False — passive personality turns on the nationality of the victim; jurisdiction based on the offender's nationality
    is active nationality.
- key: q722
  type: mcq
  concept: grounds-of-jurisdiction
  difficulty: 4
  stem: Which pairing correctly distinguishes the protective principle from universal jurisdiction?
  options:
  - text: Protective — a genuine threat to the state's vital security interests; universal — no direct link, for offences
      grave to the international community.
    correct: true
    why: Correct — protection needs a threat to the prosecuting state's security; universality needs no link but is limited
      to grave offences.
  - text: Protective — any state may act for grave international crimes; universal — the state's vital interests must be
      threatened.
    why: 'Tempting because both reach foreigners abroad, but this swaps the two: the vital-interest test belongs to protection.'
  - text: Both require that the victim be a national of the prosecuting state.
    why: Wrong — a victim-nationality requirement is passive personality; neither protection nor universality depends on
      the victim's nationality.
- key: q723
  type: mcq
  concept: grounds-of-jurisdiction
  variant-of: q716
  difficulty: 3
  stem: Where concurring jurisdictions are not resolved by treaty, which state is usually in the best position to investigate
    and try the offender?
  options:
  - text: The state with the closest link to the offence, given where the evidence and the offender are.
    correct: true
    why: 'Correct — slide 49 and the lecture: usually the state with the closest link is best placed, influenced by evidence
      and offender location.'
  - text: The state that first issued an arrest warrant for the offender, under a general rule of first-in-time priority.
    why: Tempting because it sounds orderly, but no such priority rule exists; the lecturer says there is no clear guidance
      on what to prioritise.
  - text: The state relying on universal jurisdiction, because it always ranks above other grounds.
    why: Wrong — no ground ranks above another; universality is in fact the most controversial ground without a treaty basis.
- key: q724
  type: short
  concept: grounds-of-jurisdiction
  difficulty: 4
  prompt: 'Resolve the tutorial hypothetical: Mr Brawel, an Australian national, seriously injures two American nationals
    while they are vacationing in Bali. Which states can exercise jurisdiction, on what grounds, and how would any concurring
    claims be resolved?'
  model: 'To assert prescriptive jurisdiction where there is a foreign element, each state must justify a recognised ground.
    Indonesia can rely on territoriality, the fundamental basis of jurisdiction derived from sovereignty: it has jurisdiction
    over all acts committed on its territory and everyone located there, and citizenship is not required, so Mr Brawel''s
    Australian nationality is no obstacle. Australia can rely on the nationality (active personality) principle, which lets
    a state of nationality prosecute a national for acts committed abroad, although common law countries such as Australia
    tend to be restrictive about which crimes they extend to nationals overseas, so it would depend on whether Australian
    law extends this offence abroad. The US could invoke passive personality, because the victims were American nationals,
    as in US v Yunis; but this principle remains controversial, is not universally accepted in the way territoriality and
    nationality are, and is better combined with another ground — the lecturer''s holiday-fight example shows the fairness
    problem of a person being unable to know which law applies. Universal and protective jurisdiction do not apply to an
    ordinary assault. With concurring claims, there are no universally binding rules; the state with the closest link —
    Indonesia, where the evidence and offender are — is usually best placed.'
  rubric:
  - id: r1
    criterion: Identifies Indonesian territorial jurisdiction and explains that nationality of the offender is irrelevant
      to it.
    marks: 2
    top-band: Explains territoriality as the fundamental basis derived from sovereignty.
    margin-note: Why can Indonesia act at all?
    authorities: []
  - id: r2
    criterion: Identifies Australian active nationality jurisdiction with the common law restraint.
    marks: 2
    top-band: Notes Australia must extend the offence to nationals abroad.
    margin-note: Does Australian law reach this conduct?
    authorities: []
  - id: r3
    criterion: Identifies US passive personality, citing Yunis and explaining why it is weak.
    marks: 2
    top-band: Explains the fairness objection and subsidiary status.
    margin-note: Is passive personality enough alone?
    authorities: []
  - id: r4
    criterion: Rules out universality/protection and resolves concurrence by closest link.
    marks: 2
    top-band: States there are no universally binding rules and applies closest-link reasoning.
    margin-note: Who is best placed and why?
    authorities:
    - cybercrime-convention-2001-art-22-5
