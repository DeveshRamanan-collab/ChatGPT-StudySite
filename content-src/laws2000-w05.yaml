cards:
- type: cloze
  concept: il-perspective-on-national-law
  text: '"A party may not invoke the provisions of its {{c1::internal law}} as justification for its failure to perform
    a treaty" (art {{c2::27}} VCLT).'
  source: Week 05 Lecture Slides, slide 5
- type: basic
  concept: il-perspective-on-national-law
  front: When can a state invoke a breach of its internal rules on competence to conclude treaties to invalidate its consent
    (art 46 VCLT)?
  back: Only if the violation was manifest — objectively evident to any state acting in accordance with normal practice
    and in good faith — and concerned a rule of its internal law of fundamental importance.
  source: Week 05 Lecture Slides, slide 5
- type: cloze
  concept: il-perspective-on-national-law
  text: 'ILC Draft Articles on State Responsibility art 3: characterisation of an act as internationally wrongful is governed
    by {{c1::international law}} and is not affected by its characterisation as {{c2::lawful by internal law}}.'
  source: Week 05 Lecture Slides, slide 6
- type: basic
  concept: il-perspective-on-national-law
  front: Name four ways national law remains relevant to international law.
  back: It fulfils obligations that require legislation; it is evidence of compliance and of state practice and opinio juris;
    national court decisions are subsidiary sources; it offers interpretation of international law (and helps identify general
    principles).
  source: Week 05 Lecture Slides, slide 7; Live lecture
- type: apply
  concept: il-perspective-on-national-law
  scenario: State K's courts uphold a statute authorising conduct that breaches a treaty. K argues it has done nothing wrong
    because the conduct is lawful at home.
  answer: Arts 27 VCLT and ILC art 3 — domestic lawfulness is no justification and does not affect wrongfulness; K is internationally
    responsible even though the statute is valid domestically.
  source: Week 05 Lecture Slides, slides 5–6
- type: basic
  concept: monism-and-dualism
  front: Monism versus dualism in one line each?
  back: 'Monism: one legal order, international law has direct effect (incorporation), conflicts resolved often for international
    law. Dualism: two distinct orders, international law must be transformed, no inconsistency arises and national law usually
    prevails.'
  source: Week 05 Lecture Slides, slide 8
- type: cloze
  concept: monism-and-dualism
  text: 'German Basic Law art 25: the general rules of international law are {{c1::an integral part of federal law}}, take
    precedence over the laws and {{c2::directly create rights and duties}} for inhabitants.'
  source: Week 05 Lecture Slides, slide 9
- type: basic
  concept: monism-and-dualism
  front: Why is the Dutch Constitution a blend of monism and dualism?
  back: Parliament must approve treaties (art 91) — dualist; but published treaty provisions binding on all persons apply
    without a replicating law (art 93) and override conflicting statutes (art 94) — monist.
  source: Week 05 Lecture Slides, slide 10; Live lecture
- type: apply
  concept: monism-and-dualism
  scenario: 'Tutorial Q1: which theory best reflects Australia''s approach?'
  answer: Primarily dualist — treaties must be transformed (Dietrich), international law does not form part of Australian
    law as such, and clear Australian law prevails — though courts may refer to international law in interpretation.
  source: Week 05 Tutorial Tasks, Q1; Week 05 Lecture Slides, slide 28
- type: basic
  concept: treaties-in-australian-law
  front: Which three constitutional provisions relate to international law?
  back: s 51(xxix) external affairs power (Parliament); s 61 executive power to conclude treaties; s 75(i) High Court original
    jurisdiction in matters arising under a treaty.
  source: Week 05 Lecture Slides, slide 13
- type: basic
  concept: treaties-in-australian-law
  front: Four valid uses of the external affairs power?
  back: Giving effect to treaty obligations; giving effect to customary obligations; subject matter affecting relations
    with international persons; a matter of 'international concern' (Koowarta).
  source: Week 05 Lecture Slides, slide 14
- type: apply
  concept: treaties-in-australian-law
  scenario: The Commonwealth legislates to stop a state building a dam in a World Heritage area, relying on the World Heritage
    Convention.
  answer: 'Tasmanian Dam Case — valid under s 51(xxix): implementing a treaty Australia is party to relates to external
    affairs, even on a matter normally for the state; a mere ''device'' would probably not be legitimate.'
  source: Week 05 Lecture Slides, slide 16
- type: cloze
  concept: treaties-in-australian-law
  text: 'Dietrich v The Queen: ratification of the ICCPR as an {{c1::executive act}} has {{c2::no direct legal effect}}
    upon domestic law.'
  source: Week 05 Lecture Slides, slide 17
- type: basic
  concept: treaties-in-australian-law
  front: Five ways to transform a treaty into Australian law?
  back: New legislation; amending existing legislation (Criminal Code for the Genocide Convention); scheduling it to an
    Act (not full incorporation); relying on existing legislation already giving effect; giving it the force of law (DPI
    Act 1967 s 7).
  source: Week 05 Lecture Slides, slide 18
- type: basic
  concept: international-law-in-australian-interpretation
  front: Two conditions for using a treaty under s 15AB Acts Interpretation Act?
  back: (a) Australia actually participated, or contemplated participating, in the treaty before the Act was enacted; and
    (b) it is used to confirm the ordinary meaning, or the Act is ambiguous/obscure or would otherwise be manifestly absurd
    or unreasonable.
  source: Week 05 Lecture Slides, slide 19
- type: cloze
  concept: international-law-in-australian-interpretation
  text: A treaty cannot qualify or modify the meaning of legislative words that are otherwise {{c1::clear}} ({{c2::Yager
    v The Queen}}, Mason J).
  source: Week 05 Lecture Slides, slide 19
- type: basic
  concept: international-law-in-australian-interpretation
  front: The two common law presumptions linking statutes and international law?
  back: Ambiguous statutes are read consistently with international law (Jumbunna) — but not clear contrary legislation
    (Polites); and the principle of legality — no intention to curtail fundamental rights without unambiguous language (Coco).
  source: Week 05 Lecture Slides, slide 20
- type: basic
  concept: international-law-in-australian-interpretation
  front: Kirby J versus McHugh J on international law and the Constitution?
  back: 'Kirby J (Newcrest): the Constitution accommodates itself to international law so far as its text permits. McHugh
    J (Al-Kateb): ''heretical'' — amending the Constitution without a referendum. No majority support.'
  source: Week 05 Lecture Slides, slide 26
- type: apply
  concept: international-law-in-australian-interpretation
  scenario: A 2015 Act is ambiguous. Counsel cites a treaty Australia only began considering in 2020.
  answer: s 15AB cannot be used — no actual or contemplated participation before enactment; the Jumbunna presumption might
    still favour a consistent reading of an ambiguous Act.
  source: Week 05 Lecture Slides, slides 19–20
- type: basic
  concept: customary-international-law-in-australian-law
  front: Transformation versus incorporation for custom?
  back: 'Transformation: custom is part of Australian law only when formally adopted by Parliament or the courts. Incorporation:
    custom is automatically a source of Australian law unless a contrary rule exists. Australia has adopted neither clearly.'
  source: Week 05 Lecture Slides, slide 21
- type: apply
  concept: customary-international-law-in-australian-law
  scenario: Applicants ask an Australian court to try officials for genocide as a customary crime; no Australian legislation
    criminalises it.
  answer: Nulyarimma v Thompson — even accepting genocide's prohibition is custom and jus cogens, it is not part of Australian
    law without legislation declaring it a crime.
  source: Week 05 Lecture Slides, slide 22
- type: cloze
  concept: customary-international-law-in-australian-law
  text: 'Mabo (No 2): the common law may have to {{c1::march in step}} with international law; Teoh: it must not be a {{c2::back
    door}} means of importing an unincorporated convention.'
  source: Week 05 Lecture Slides, slide 25
- type: basic
  concept: forms-of-jurisdiction
  front: The three forms of jurisdiction, with the theft example?
  back: Prescribe — criminalising theft; enforce — apprehending, remanding and imprisoning the thief; adjudicate — prosecuting
    the thief in court.
  source: Week 05 Lecture Slides, slides 32 and 38
- type: cloze
  concept: forms-of-jurisdiction
  text: 'Lotus: failing a {{c1::permissive rule}} to the contrary, a state may not exercise its power in any form in {{c2::the
    territory of another State}}.'
  source: Week 05 Lecture Slides, slide 35
- type: apply
  concept: forms-of-jurisdiction
  scenario: State M's agents secretly seize a suspect in State N without N's consent and take him home for trial.
  answer: Unlawful enforcement jurisdiction in another state's territory (Lotus; Eichmann) — a serious violation of N's
    sovereignty; compare the Security Council's request that Israel compensate Argentina.
  source: Week 05 Lecture Slides, slide 35
- type: basic
  concept: grounds-of-jurisdiction
  front: Objective versus subjective territoriality?
  back: 'Objective: offence completed on the territory, though elements occurred abroad (effects). Subjective: offence initiated
    or planned on the territory.'
  source: Week 05 Lecture Slides, slide 41
- type: apply
  concept: grounds-of-jurisdiction
  scenario: 'Tutorial Q4(a): poisoned olive oil sent from Greece by a Greek national kills a UK national in London.'
  answer: UK — objective territoriality (completed in London); Greece — subjective territoriality (initiated there) and
    active nationality of the offender.
  source: Week 05 Tutorial Tasks, Q4(a); Week 05 Lecture Slides, slide 41
- type: apply
  concept: grounds-of-jurisdiction
  scenario: 'Tutorial Q4(c): an XWZ member who tortured civilians and committed crimes against humanity in State A is found
    in Germany.'
  answer: Germany can exercise universal jurisdiction over crimes against humanity and torture — no direct link needed;
    his presence in Germany supplies the usual territorial link.
  source: Week 05 Tutorial Tasks, Q4(c); Week 05 Lecture Slides, slide 46
- type: basic
  concept: grounds-of-jurisdiction
  front: Examples of protective jurisdiction?
  back: Counterfeiting currency (or passports), espionage, conspiracy to commit treason (coup d'état), attack on diplomatic
    personnel abroad — acts abroad by non-citizens posing a genuine threat to a vital security interest.
  source: Week 05 Lecture Slides, slide 45
- type: cloze
  concept: grounds-of-jurisdiction
  text: Where more than one state claims jurisdiction under the 2001 Cybercrime Convention, the states shall "{{c1::consult}}
    with a view to determining the most appropriate jurisdiction for prosecution" (art {{c2::22(5)}}).
  source: Week 05 Lecture Slides, slide 49
audio:
  title: Week 5 recap — international and national law, and jurisdiction
  minutes: 3
  script: 'This week has two halves. First, how international law and national law relate. From international law''s side
    it is simple: a state cannot use its own law as an excuse. Article 27 of the Vienna Convention says a party may not
    invoke its internal law to justify failing to perform a treaty, and article 46 only lets a state escape its consent
    if the breach of its internal rules on treaty-making was manifest and concerned a rule of fundamental importance. Article
    3 of the ILC Draft Articles on State Responsibility widens that to all obligations: whether an act is wrongful is decided
    by international law, not by domestic law. Still, national law matters to international law, as evidence of state practice
    and opinio juris, as subsidiary sources, and as the way obligations are fulfilled.


    From the domestic side we have two theories. Monism sees one legal order, with international law applying directly,
    as in article 25 of the German Basic Law. Dualism sees two separate orders, so international law must be transformed
    first. Most systems blend them, like the Netherlands, and Australia is primarily dualist.


    In Australia, section 51(xxix), the external affairs power, lets the Commonwealth legislate to implement treaties, even
    on state matters, as in the Tasmanian Dam Case, though not as a mere device. But treaties have no direct effect: Dietrich
    tells us ratification of the ICCPR created no domestic rights. Treaties still help interpretation: incorporated text
    takes its treaty meaning, section 15AB lets a treaty confirm or clarify an Act if Australia was in it or contemplating
    it before enactment, ambiguous statutes are read consistently with international law, and clear words always win. For
    custom, transformation and incorporation are both recognised, but Nulyarimma held genocide could not be tried without
    legislation. On the Constitution, Kirby J was open to international law and McHugh J called it heretical.


    The second half is jurisdiction. There are three forms: to prescribe, to enforce and to adjudicate. Lotus gives states
    wide discretion to prescribe, but a state may never enforce in another state''s territory without permission, which
    is why seizing Eichmann in Argentina was unlawful. Lockerbie shows adjudication abroad by agreement, with a Scottish
    court sitting in the Netherlands.


    Then the grounds. Territoriality is fundamental, objective where the offence is completed and subjective where it is
    planned. Active nationality follows the offender, passive personality follows the victim, as in Yunis, but it is controversial.
    Protection covers threats to vital interests, like counterfeiting. Universality covers piracy, genocide, war crimes,
    crimes against humanity and torture, usually with the accused present. When claims overlap there is no binding rule,
    so the closest link usually wins.

    '
