  - key: q708
    type: mcq
    concept: build-measure-learn
    difficulty: 3
    stem: In what order does validated learning ask its three questions?
    options:
      - text: What can we build? How can we sell it? What did we learn?
        why: >-
          Tempting because it follows the loop forwards, but validated learning starts from what we need to learn and
          works back to what to build.
      - text: What do we need to learn? How can we measure it? What is the simplest thing to build to measure it?
        correct: true
        why: >-
          Correct — the validated learning slide numbers them: 1) what do we need to learn? 2) how can we measure it? 3)
          the simplest thing to build (MVP).
      - text: How much will it cost? Who will buy it? When can we launch?
        why: Tempting because these are sensible business questions, but they are not the validated learning sequence.
      - text: What did customers say? What did competitors do? What should we copy?
        why: >-
          Tempting because customers matter, but validated learning plans from the learning goal, not from copying
          competitors.
  - key: q709
    type: mcq
    concept: build-measure-learn
    difficulty: 2
    stem: In validated learning, what is 'the simplest thing to build to measure it'?
    options:
      - text: The final product
        why: >-
          Tempting because it would measure demand fully, but it is the most expensive thing to build; the slide says
          the MVP.
      - text: The business model canvas
        why: >-
          Tempting because it is a core concept, but the canvas maps hypotheses; it is not what you build to measure
          them.
      - text: The minimum viable product
        correct: true
        why: >-
          Correct — the slide answers its third question, "What is the simplest thing to build to measure it?", with
          (MVP).
      - text: A kanban board for the team
        why: >-
          Tempting because it is a simple tool, but a kanban board tracks a team’s work; it does not measure a
          hypothesis.
  - key: q710
    type: mcq
    concept: build-measure-learn
    difficulty: 2
    stem: In the innovation accounting report, how is the learning from an experiment documented?
    options:
