  - key: q793
    type: short
    concept: build-measure-learn
    difficulty: 3
    prompt: >-
      'Testing ideas with customers is a waste of time; good founders trust their instincts.' Discuss, designing one
      turn of the build–measure–learn loop for a start-up that believes university students will pay $10 a month for a
      laundry pick-up service, and use a real example from the materials.
    model: >-
      The statement inverts the lean start-up, which assumes instinct is a guess to be tested. Validated learning

      plans the loop in reverse: what do we need to learn (will students pay $10 a month?), how can we measure it, and
      what is

      the simplest thing to build to measure it (the MVP)? The innovation accounting report would state a falsifiable

      hypothesis with a quantified goal and timebox — 'at least 40 of 300 students in one residence will subscribe
      within

      three weeks' — and test the value hypothesis first. Build: a sign-up page and one van, not an app. Measure:
      results =

      data, through actionable metrics. Learn: record the result as validated, invalidated or inconclusive, then
      persevere or

      pivot. If students subscribe for pick-up only on exam weeks, that is a course correction to the hypotheses, as

      Instagram's founders made when Burbn users mostly posted pictures. The slides add that the total time through the
      loop

      should be minimised, so the cost of testing is small. The statement holds only where, as Collis notes, quick tests

      cannot judge an idea that needs long-term investment.
    rubric:
      - id: r1
        criterion: Concept — explains build–measure–learn and validated learning accurately.
        marks: 3
        top-band: States the loop, the reverse planning questions and the report’s falsifiable hypothesis and outcomes.
        margin-note: What are the three validated-learning questions?
        authorities: []
      - id: r2
        criterion: Example — uses a real example from the materials.
        marks: 2
        top-band: Uses Instagram/Burbn or another source example to show learning changing course.
        margin-note: Which real venture learned from what users actually did?
        authorities:
          - mgmt2094-example-instagram-burbn
      - id: r3
        criterion: Application — designs one turn of the loop for the laundry idea.
        marks: 3
        top-band: Gives a quantified, timeboxed hypothesis, a minimal build, a measure and the decision rule.
        margin-note: What number would make you pivot?
        authorities: []
      - id: r4
        criterion: Evaluation — responds to the statement and weighs a limit.
        marks: 2
        top-band: Takes a clear position and notes when quick tests are not enough (Collis).
        margin-note: Is instinct ever enough?
        authorities:
          - mgmt2094-collis-2016-lean-strategy
  - key: q801
    type: mcq
    concept: lean-strategy
    difficulty: 2
    set: pretest
    stem: What is Collis's main claim in 'Lean Strategy'?
    options:
      - text: Start-ups should drop strategy and pivot continually as information comes in
        why: >-
          Tempting because that is how lean start-up is often read, but Collis says entrepreneurship without strategy
          leads to chaos.
      - text: Start-ups should plan every step in advance and avoid experiments
        why: >-
          Tempting because Collis defends strategy, but he says strategy without entrepreneurship is central planning;
          experiments stay.
      - text: "Start-ups need both agility and direction: strategy sets the bounds within which experiments take place"
        correct: true
        why: >-
          Correct — Collis argues effective strategy encourages entrepreneurial behaviour by identifying the bounds for
          innovation and experimentation.
      - text: Only established firms need strategy; start-ups need only an MVP
        why: >-
          Tempting because start-ups are small, but Collis says strategy matters even more to entrepreneurs than to
          established businesses.
  - key: q802
    type: mcq
    concept: lean-strategy
    difficulty: 1
    stem: >-
      Complete Collis's line: 'Strategy without entrepreneurship is central planning. Entrepreneurship without strategy
      …'
    options:
      - text: … leads to chaos.
        correct: true
        why: Correct — Collis writes that entrepreneurship without strategy leads to chaos.
      - text: … leads to faster growth.
        why: Tempting because entrepreneurs move quickly, but Collis says the result without strategy is chaos.
      - text: … is simply a lean start-up.
        why: Tempting because Collis contrasts the two, but he does not equate the lean start-up with having no strategy.
      - text: … is pure execution.
        why: >-
          Tempting because the line is a pair of opposites, but entrepreneurship without strategy leads to chaos, not
          execution.
  - key: q803
    type: mcq
    concept: lean-strategy
    difficulty: 2
    stem: Which is the only part of the lean strategy process that Collis says should be in any sense permanent?
    options:
      - text: The scope — what business we are in, and what we will not do
        why: >-
          Tempting because Collis calls scope the most critical guide rail, but the deliberate strategy can be revised
          as the venture learns.
      - text: The vision — the organisation's reason for existence
        correct: true
        why: >-
          Correct — Collis says the process begins with perhaps the only aspect that should in any sense be permanent:
          the vision.
      - text: The competitive advantage
        why: >-
          Tempting because advantage should be durable, but it is part of the deliberate strategy, which feedback can
          reshape.
      - text: The current set of experiments
        why: Tempting because experiments run all the time, but they change constantly; the permanent part is the vision.
  - key: q804
    type: mcq
    concept: lean-strategy
    difficulty: 2
    stem: Which three elements of a deliberate strategy does Collis name?
    options:
      - text: Vision, mission and values
        why: >-
          Tempting because they are classic strategy words, but Collis treats vision separately and names objective,
          scope and advantage.
      - text: Objective, scope and competitive advantage
        correct: true
        why: >-
          Correct — Collis says the three underlying elements of a strategy are objective, scope and competitive
          advantage.
      - text: Build, measure and learn
        why: Tempting because they are a lean triad, but they are the lean start-up loop, not elements of a strategy.
      - text: Strengths, weaknesses, opportunities and threats
        why: >-
          Tempting because the analysis feeds the strategy, but those are inputs; the elements are objective, scope and
          advantage.
  - key: q805
    type: mcq
    concept: lean-strategy
    difficulty: 2
    stem: What is 'emergent strategy' in Collis's process?
    options:
      - text: The plan senior executives agree from analysing strengths, weaknesses, opportunities and threats
        why: Tempting because it is part of the process, but that describes the deliberate strategy.
      - text: The founders' statement of the organisation's reason for existence
        why: Tempting because founders start the process, but that is the vision.
      - text: >-
          The sum of many daily decisions and experiments by managers at all levels, which gradually alters the firm’s
          position
        correct: true
        why: >-
          Correct — Collis says the sum of these independent choices gradually alters the company’s position: the
          emergent dimension of strategy.
      - text: A strategy written only after the business has failed
        why: >-
          Tempting because "emergent" sounds after the fact, but Collis says strategy does not emerge only after the
          fact.
  - key: q806
    type: mcq
    concept: lean-strategy
    difficulty: 2
    stem: Collis calls scope 'probably the most critical strategic guide rail'. What does it do?
    options:
      - text: It sets the near-term goal that defines success in the leader’s eyes
        why: Tempting because it guides the venture, but that is the objective.
      - text: It explains why customers will buy from us rather than from competitors
        why: Tempting because it is another element, but that is the competitive advantage.
      - text: It identifies 'what business we are in' and draws boundaries around what the venture will and will not do
        correct: true
        why: >-
          Correct — Collis says scope identifies what business we are in and draws boundaries around what the venture
          will and will not do.
      - text: It records the outcome of each experiment
        why: Tempting because strategy evaluates experiments, but scope is a boundary, not a record of results.
  - key: q807
    type: mcq
    concept: lean-strategy
    difficulty: 3
    stem: >-
      Southwest chose not to compete with the major airlines in big airports or on routes longer than a couple of hours.
      Which element of strategy does this illustrate?
    options:
      - text: Scope
        correct: true
        why: >-
          Correct — Collis uses this as his example of scope: a clearly defined domain of short-haul flights between
          second-tier airports.
      - text: Objective
        why: >-
          Tempting because it shapes success, but the objective is the near-term goal; this decision draws boundaries,
          which is scope.
      - text: Vision
        why: Tempting because it is a long-run choice, but vision is the reason for existence; route boundaries are scope.
      - text: Emergent strategy
        why: Tempting because it shaped daily operations, but it was a deliberate boundary set in advance.
  - key: q808
    type: mcq
    concept: lean-strategy
    difficulty: 3
    stem: >-
      Southwest employees suggested Business Select (a free drink and early boarding for a small premium), and the
      airline introduced it because it would not slow gate turns. What does this show?
    options:
      - text: Deliberate strategy, because Southwest’s founders planned it in advance
        why: Tempting because it fitted the strategy, but the idea came from employees, which makes it emergent.
      - text: Emergent strategy, screened against the advantage of rapid turnaround
        correct: true
        why: >-
          Correct — a frontline suggestion (emergent) passed the strategic screen because it protected the
          rapid-turnaround advantage.
      - text: A pivot away from the low-cost model
        why: Tempting because it adds a premium option, but it fitted the existing strategy rather than correcting it.
      - text: Strategy abandoned in favour of experimentation
        why: Tempting because employees experimented, but the strategy decided which experiment to keep.
  - key: q809
    type: mcq
    concept: lean-strategy
    difficulty: 2
    stem: What two jobs does strategy do for experiments, according to Collis?
    options:
      - text: It writes the experiments and runs them
        why: >-
          Tempting because strategy guides experiments, but managers at all levels run them; strategy screens and
          evaluates.
      - text: It replaces experiments with careful analysis and long-range forecasts
        why: >-
          Tempting because Collis values analysis, but he keeps experimentation; strategy bounds it rather than
          replacing it.
      - text: It funds every experiment equally so none is missed
        why: >-
          Tempting because fairness sounds good, but Collis says know what not to do: strategy decides which ideas get
          scarce resources.
      - text: A screen ideas must pass, and a yardstick for judging experiments
        correct: true
        why: >-
          Correct — Collis says strategy serves as both a screen that novel ideas must pass and a yardstick for
          evaluating experiments.
  - key: q810
    type: mcq
    concept: lean-strategy
    difficulty: 3
    stem: Why does Collis use Groupon as a warning?
    options:
      - text: >-
          Its model quickly generated sales, but entry barriers were low, demand proved transitory and repeat use was
          uneconomical
        correct: true
        why: >-
          Correct — Collis says anyone could launch such a site, demand proved transitory, repeat use was uneconomical
          and no one has made money.
      - text: It refused to experiment with its product
        why: >-
          Tempting because Collis discusses experiments, but Groupon’s problem was an unsustainable opportunity, not too
          little testing.
      - text: It never found any early customers
        why: Tempting because start-ups often fail that way, but Groupon quickly generated sales.
      - text: It spent too long writing a deliberate strategy
        why: >-
          Tempting because the article is about strategy, but Collis criticises Groupon’s choice of opportunity, not
          over-planning.
  - key: q811
    type: mcq
    concept: lean-strategy
    difficulty: 3
    stem: Before testing any of its eight use cases, what did Eleet’s founders conclude from analysing their markets?
    options:
      - text: That a B2C version for private drivers was the most sustainable
        why: >-
          Tempting because consumers are a big market, but the founders judged B2B the most sustainable and set B2C
          aside.
      - text: That all eight use cases should be tested at once
        why: Tempting because testing is cheap, but Collis praises them for screening before testing.
      - text: That a B2B version was most sustainable, so they set aside B2C and tested for high-volume B2B users
        correct: true
        why: >-
          Correct — Eleet analysed the markets first, chose B2B, set aside the B2C cases and ran tests that found
          high-volume B2B users.
      - text: That the idea could not work and should be abandoned
        why: Tempting because analysis can kill ideas, but Eleet is now building the B2B business.
  - key: q812
    type: mcq
    concept: lean-strategy
    difficulty: 3
    stem: What went wrong at Nasty Gal, according to Collis?
    options:
      - text: It stayed too narrowly focused on reselling vintage clothing on eBay
        why: "Tempting because it began on eBay, but its problem was the opposite: diversifying without focus."
      - text: With no clear focus it diversified widely; staff competed for resources and growth stalled
        correct: true
        why: >-
          Correct — Collis says Nasty Gal threw many ideas at the wall; with no clear focus, employees competed for
          resources and growth stalled.
      - text: It refused to sell any branded products
        why: Tempting because brands can help, but it launched shoes, swimwear and other branded goods.
      - text: It tested too slowly and missed the market
        why: Tempting because speed matters, but Collis blames a lack of strategic bounds, not slow testing.
  - key: q813
    type: mcq
    concept: lean-strategy
    difficulty: 2
    stem: Which is one of the principles Collis says entrepreneurs must recognise?
    options:
      - text: You can always do A now and B later
        why: >-
          Tempting because sequencing sounds sensible, but Collis says every choice creates a unique path; circumstances
          will have changed.
      - text: The opportunity cost of doing A is that you cannot also do B
        correct: true
        why: >-
          Correct — Collis says in a resource-constrained venture choices are mutually exclusive: doing A means not
          doing B.
      - text: Decisions made in one department do not affect the other departments
        why: Tempting because start-ups are small, but Collis says decisions are interdependent.
      - text: Simple market tests are always enough
        why: >-
          Tempting because the lean start-up celebrates rapid testing, but Collis says simple market tests aren’t always
          useful.
  - key: q814
    type: mcq
    concept: lean-strategy
    difficulty: 3
    contrasts-with:
      - lean-start-up
    stem: Collis says 'simple market tests aren't always useful'. Which example fits his point?
    options:
      - text: Instagram’s eight-week beta test of a photo-sharing app
        why: >-
          Tempting because it is a test from Collis, but it worked; it illustrates learning from experiments, not their
          limits.
      - text: Tesla’s lithium ion batteries, which needed time and would not have survived a demand for immediate success
        correct: true
        why: >-
          Correct — Collis says businesses such as Tesla’s lithium ion batteries would never have got off the ground had
          they had to show immediate success.
      - text: Intronis’s topical webinar, produced in a few days
        why: >-
          Tempting because it is a quick experiment, but it comes from the agile reading and succeeded; it does not show
          a test’s limits.
      - text: Spotify’s squads testing changes to their practices
        why: >-
          Tempting because they test, but their tests worked; the example is about customising agile, not the limits of
          market tests.
  - key: q815
    type: mcq
    concept: lean-strategy
    difficulty: 3
    stem: Why does Collis tell the story of the damage on Spitfires returning to base?
    options:
      - text: To show that more testing always produces the right answer
        why: Tempting because the reports were data, but the data misled until someone read it with a broader frame.
      - text: To show that deliberate strategy should replace all experiments
        why: >-
          Tempting because Collis defends strategy, but he uses the story to show how strategy frames learning, not
          replaces it.
      - text: >-
          To show that without a broader frame, wrong conclusions are drawn: the areas hit on lost planes were never
          seen
        correct: true
        why: >-
          Correct — Collis says the undamaged areas were probably most vulnerable, since planes hit there never came
          back; strategy frames how feedback is read.
      - text: To praise the speed of wartime repairs
        why: >-
          Tempting because repairs follow damage reports, but Collis’s point is about interpreting results, not repair
          speed.
  - key: q816
    type: mcq
    concept: lean-strategy
    difficulty: 2
    stem: >-
      Why did Muzzy Lane discourage staff from seeking work-for-hire games, even though one contract could cover months
      of cash burn?
    options:
      - text: Clients refused to pay for one-off games
        why: Tempting because the work was one-off, but Collis says the contracts were an important source of funding.
      - text: Its strategy focused on a platform for educational publishers, and custom games would divert developers
        correct: true
        why: >-
          Correct — a clarified strategy focused Muzzy Lane on educational publishers; diverting developers would slow
          that critical work.
      - text: Work-for-hire was against the law in its market
        why: Tempting as a hard rule, but the reason Collis gives is strategic alignment.
      - text: The games were too creative for its developers
        why: Tempting because games are creative, but the issue was focus and scarce developers.
  - key: q890
    type: truefalse
    concept: lean-strategy
    difficulty: 1
    set: quickfire
    statement: Collis says the single best piece of advice for any entrepreneur is 'Know what not to do'.
    answer: true
    why: >-
      True — Collis says the single best piece of advice for any company builder is "Know what not to do", and strategy
      helps you figure that out.
  - key: q891
    type: truefalse
    concept: lean-strategy
    difficulty: 1
    set: quickfire
    statement: Collis argues that lean start-up experimentation makes strategy unnecessary.
    answer: false
    why: >-
      False — Collis argues strategy matters even more to entrepreneurs; his lean strategy process combines
      experimentation with strategic boundaries.
  - key: q892
    type: truefalse
    concept: lean-strategy
    difficulty: 2
    statement: In Collis's lean strategy process, feedback and findings from experiments can reshape the deliberate strategy.
    answer: true
    why: >-
      True — Collis says in response to experiments the venture builds new capabilities and, if necessary, revises the
      original deliberate strategy.
  - key: q893
    type: short
    concept: lean-strategy
    difficulty: 3
    prompt: >-
      'Start-ups should experiment freely; strategy only slows them down.' Discuss, advising a food-delivery start-up
      whose staff keep chasing every new idea, using Collis's lean strategy process and a real example from the
      materials.
    model: >-
      Collis would reject the statement: strategy without entrepreneurship is central planning, but entrepreneurship

      without strategy leads to chaos. The food-delivery start-up shows the chaos — staff chasing every idea spread
      scarce

      people and money thin, as at Nasty Gal, where diversifying without focus left employees competing for resources
      until

      growth stalled. A lean strategy process would start with a vision, the only part meant to be permanent. Senior

      executives would then agree a deliberate strategy from an analysis of strengths, weaknesses, opportunities,
      threats,

      resources and capabilities: an objective, a scope (say, office lunches in one city, not groceries or catering) and
      a

      competitive advantage (speed). That strategy becomes a screen ideas must pass and a yardstick for judging
      experiments,

      so staff still experiment — the emergent strategy — but within bounds, as Southwest's Business Select passed
      because it

      kept gate turns fast. Feedback then reshapes the strategy and the process restarts. The statement is right that
      rigid

      planning slows ventures, and Collis agrees; the answer is experiments inside boundaries, not experiments instead
      of

      strategy.
    rubric:
      - id: r1
        criterion: Concept — explains the lean strategy process accurately.
        marks: 3
        top-band: >-
          Names vision, deliberate strategy (objective, scope, advantage), emergent strategy, and strategy as screen and
          yardstick.
        margin-note: What does Collis add to the lean start-up?
        authorities:
          - mgmt2094-collis-2016-lean-strategy
      - id: r2
        criterion: Example — uses a real example from the materials.
        marks: 2
        top-band: Uses Nasty Gal, Southwest, Eleet or Muzzy Lane accurately and relevantly.
        margin-note: Which venture in Collis lost focus, or kept it?
        authorities:
          - mgmt2094-example-nasty-gal
          - mgmt2094-example-southwest-airlines
      - id: r3
        criterion: Application — applies the process to the food-delivery start-up.
        marks: 3
        top-band: Proposes a concrete scope and advantage and shows an idea being screened in or out.
        margin-note: What would this start-up say no to?
        authorities: []
      - id: r4
        criterion: Evaluation — responds to the statement and weighs both sides.
        marks: 2
        top-band: Concedes what is right about rigid planning and reaches a reasoned conclusion.
        margin-note: Where is the statement right?
        authorities:
          - mgmt2094-collis-2016-lean-strategy
  - key: q901
    type: mcq
    concept: scrum-framework
    difficulty: 1
    stem: In the Scrum framework on the tutor slides, what is a sprint?
    options:
      - text: >-
          A fixed-length cycle of one month or less in which the team works towards a Sprint Goal and produces a usable
          increment
        correct: true
        why: >-
          Correct — the slide defines a sprint as a fixed-length cycle of one month or less, worked towards a Sprint
          Goal, producing a usable increment.
      - text: A 15-minute daily meeting in which the team inspects progress and adapts the plan
        why: >-
          Tempting because it happens inside every sprint, but this is the Daily Scrum, one event within the sprint, not
          the sprint itself.
      - text: A prioritised list of features and work, maintained by the Product Owner
        why: >-
          Tempting because the sprint draws on it, but this describes the Product Backlog, an artifact, not the sprint
          cycle.
      - text: An open-ended project phase that lasts until the whole product is finished
        why: >-
          Tempting because projects run in phases, but a sprint is fixed-length (one month or less), and it ends with a
          usable increment, not the full product.
  - key: q902
    type: mcq
    concept: scrum-framework
    difficulty: 1
    stem: Which Scrum role represents the customer and maximises the value of the product?
    options:
      - text: The Scrum Master
        why: >-
          Tempting because the Scrum Master serves the team, but the slide says the Scrum Master facilitates the process
          and removes obstacles; value is the Product Owner’s job.
      - text: The Product Owner
        correct: true
        why: >-
          Correct — the tutor slide says the Product Owner represents the customer and maximises the value of the
          product, and maintains the Product Backlog.
      - text: The Development Team
        why: >-
          Tempting because the team builds what customers use, but the slide gives it delivery of the work during the
          sprint, not representing the customer.
      - text: The stakeholders at the Sprint Review
        why: >-
          Tempting because stakeholders give feedback at the review, but they are not a Scrum role; the Product Owner
          represents the customer.
  - key: q903
    type: mcq
    concept: scrum-framework
    difficulty: 1
    stem: Which Scrum role facilitates the process, removes obstacles and helps the team improve?
    options:
      - text: The Product Owner
        why: >-
          Tempting because the owner guides priorities, but the owner represents the customer and maximises value;
          facilitation belongs to the Scrum Master.
      - text: The Development Team
        why: >-
          Tempting because the team is self-managing, but the slide gives facilitation and removing obstacles to a
          separate role, the Scrum Master.
      - text: The project manager who assigns each task
        why: >-
          Tempting from traditional project management, but Scrum has no task-assigning manager; the self-managing team
          organises its own work.
      - text: The Scrum Master
        correct: true
        why: >-
          Correct — the slide says the Scrum Master facilitates the process, removes obstacles and helps the team
          improve (Rigby et al.’s process facilitator).
  - key: q904
    type: mcq
    concept: scrum-framework
    difficulty: 2
    stem: Which Scrum event is described on the tutor slide as reflecting on how the team can improve its work?
    options:
      - text: The Sprint Review
        why: >-
          Tempting because both come at the end of a sprint, but the review inspects outcomes and gathers stakeholder
          feedback on the product, not the team’s way of working.
      - text: The Sprint Retrospective
        correct: true
        why: >-
          Correct — the retrospective reflects on how the team can improve its work (typically one to three hours),
          after the review.
      - text: The Daily Scrum
        why: >-
          Tempting because it is also a check-in, but the Daily Scrum is 15 minutes to inspect progress and adapt the
          plan, not to improve how the team works.
      - text: Sprint Planning
        why: >-
          Tempting because planning uses lessons learned, but it agrees a Sprint Goal and selects achievable work;
          reflection on teamwork is the retrospective.
  - key: q905
    type: mcq
    concept: scrum-framework
    difficulty: 2
    stem: >-
      At the end of a sprint, UniConnect’s team shows its new study-partner matching feature to stakeholders and gathers
      their feedback. Which Scrum event is this?
    options:
      - text: Sprint Review
        correct: true
        why: Correct — the Sprint Review inspects outcomes and gathers feedback from stakeholders, then adapts the backlog.
      - text: Sprint Retrospective
        why: >-
          Tempting because it also closes the sprint, but the retrospective looks at how the team works, not at the
          product with stakeholders.
      - text: Sprint Planning
        why: >-
          Tempting because feedback shapes the next plan, but planning sets the next Sprint Goal; showing the increment
          to stakeholders is the review.
      - text: The Daily Scrum
        why: >-
          Tempting because it is a regular meeting, but the Daily Scrum is a 15-minute internal check on progress,
          without stakeholders.
  - key: q906
    type: mcq
    concept: scrum-framework
    difficulty: 2
    stem: Which Scrum artifact is “selected work for the current sprint, created during Sprint Planning”?
    options:
      - text: The Product Backlog
        why: >-
          Tempting because the selected work comes from it, but the Product Backlog is the full prioritised list,
          maintained by the Product Owner.
      - text: The Increment
        why: >-
          Tempting because it is the sprint’s output, but the Increment is the usable product outcome at the end of the
          sprint, not the selected work.
      - text: The Sprint Backlog
        correct: true
        why: >-
          Correct — the slide defines the Sprint Backlog as selected work for the current sprint, created during Sprint
          Planning.
      - text: The Sprint Goal and the definition of done together
        why: >-
          Tempting because both are agreed at planning, but the slide’s artifact for the selected work is the Sprint
          Backlog.
  - key: q907
    type: mcq
    concept: scrum-framework
    difficulty: 2
    stem: What does Sprint Planning do, according to the tutor slides?
    options:
      - text: It produces a usable increment ready to show stakeholders
        why: >-
          Tempting because planning leads there, but the increment is produced during the sprint and shown at the Sprint
          Review.
      - text: It agrees a Sprint Goal and selects achievable work
        correct: true
        why: >-
          Correct — the slide says Sprint Planning agrees a Sprint Goal and selects achievable work (typically two to
          eight hours).
      - text: It lists improvements to how the team works together
        why: Tempting because it looks ahead, but improving how the team works is the job of the Sprint Retrospective.
      - text: It fixes a full specification of the finished product and its date
        why: >-
          Tempting from waterfall habits, but Scrum plans one short cycle at a time; a full up-front specification is
          what agile moved away from.
  - key: q908
    type: mcq
    concept: scrum-framework
    difficulty: 2
    stem: How does the tutorial distinguish agile, Scrum and a sprint?
    options:
      - text: >-
          Agile is a set of principles; Scrum is one framework for applying them; a sprint is Scrum’s fixed-length work
          cycle
        correct: true
        why: >-
          Correct — the slide moves from agile principles to Scrum, a framework, to the sprint, a fixed-length cycle of
          one month or less.
      - text: Scrum is the set of principles; agile is one framework for applying them; a sprint is the team’s daily meeting
        why: >-
          Tempting because the terms travel together, but it reverses the levels: agile is the principles and Scrum the
          framework; the daily meeting is the Daily Scrum.
      - text: Agile and Scrum are interchangeable names; a sprint is any project phase, however long it runs
        why: >-
          Tempting because Scrum is the most used form of agile, but the slide says not all agile teams use Scrum, and
          sprints are one month or less.
      - text: A sprint is the set of principles; Scrum and agile are the meetings that apply them in practice
        why: "Tempting only if the words are unfamiliar: the sprint is the cycle, Scrum the framework, agile the principles."
  - key: q909
    type: mcq
    concept: scrum-framework
    difficulty: 3
    stem: >-
      Each morning UniConnect’s developers spend 15 minutes checking progress towards the Sprint Goal and adjusting the
      day’s plan. Which part of Scrum is this?
    options:
      - text: Sprint Planning
        why: >-
          Tempting because the plan is adjusted, but Sprint Planning happens once at the start of the sprint (typically
          two to eight hours).
      - text: The Sprint Review
        why: >-
          Tempting because progress is inspected, but the review comes at the end of the sprint and involves
          stakeholders.
      - text: The Daily Scrum
        correct: true
        why: Correct — the Daily Scrum is 15 minutes daily to inspect progress and adapt the plan.
      - text: The Sprint Retrospective
        why: >-
          Tempting because the team reflects together, but the retrospective is at the end of the sprint and is about
          improving how the team works.
  - key: q910
    type: mcq
    concept: scrum-framework
    difficulty: 3
    stem: >-
      A Product Owner starts telling each developer which task to do and how long it should take. Which feature of the
      framework does this cut against?
    options:
      - text: The Product Owner maintains a prioritised Product Backlog
        why: >-
          Tempting because the owner is acting, but ranking the backlog is the owner’s legitimate job; assigning tasks
          is not part of it.
      - text: The Development Team is a self-managing team that delivers the work
        correct: true
        why: >-
          Correct — the team is cross-functional and self-managing; Rigby et al. add that the owner does not tell the
          team who should do what or how long tasks will take.
      - text: The sprint is a fixed-length cycle of one month or less
        why: >-
          Tempting because timing is mentioned, but nothing here changes the sprint’s length; the problem is who
          organises the work.
      - text: The Increment must be usable at the end of every sprint
        why: >-
          Tempting because micromanagement can hurt delivery, but the feature breached is the team’s self-management,
          not the increment.
  - key: q911
    type: mcq
    concept: scrum-framework
    difficulty: 2
    stem: Which statement about Scrum and agile appears on the tutor slide?
    options:
      - text: Every agile team must use Scrum’s roles and events
        why: "Tempting because Scrum is the best-known form, but the slide says the opposite: not all agile teams use Scrum."
      - text: Scrum is a lean start-up tool for testing an MVP
        why: >-
          Tempting because both work in cycles, but Scrum is an agile framework for organising team work; the MVP
          belongs to lean start-up.
      - text: Scrum is one Agile framework; not all Agile teams use Scrum
        correct: true
        why: >-
          Correct — the slide says Scrum is one Agile framework and not all Agile teams use it (Rigby et al. also name
          lean development and kanban).
      - text: Scrum replaced agile as the main approach in 2020
        why: Tempting because the Scrum Guide cited is dated 2020, but Scrum sits inside agile; it did not replace it.
  - key: q912
    type: mcq
    concept: scrum-framework
    difficulty: 3
    stem: >-
      Rigby, Sutherland and Takeuchi call the person who ranks the backlog the “initiative owner”. What is that role
      called in the Scrum Guide framework?
    options:
      - text: The Product Owner
        correct: true
        why: >-
          Correct — the reading says the initiative owner is also known as a product owner; the Scrum Guide slide calls
          the role Product Owner.
      - text: The Scrum Master
        why: >-
          Tempting because both are named roles, but the reading’s scrum master is the process facilitator, not the
          person who ranks the backlog.
      - text: The process facilitator
        why: >-
          Tempting because it is the reading’s other named role, but the facilitator guides the process; the initiative
          owner ranks the backlog.
      - text: The team leader
        why: >-
          Tempting because the lecture slide names a team leader, but in the Scrum Guide the backlog belongs to the
          Product Owner.
  - key: q913
    type: mcq
    concept: scrum-framework
    difficulty: 3
    stem: Which Scrum artifact is “a usable product outcome at the end of the sprint”?
    options:
      - text: The minimum viable product
        why: >-
          Tempting because an MVP is also a usable early version, but the MVP is a lean start-up idea; the Scrum
          artifact is the Increment.
      - text: The Sprint Backlog
        why: >-
          Tempting because it belongs to the sprint, but the Sprint Backlog is the selected work, created at Sprint
          Planning, not the outcome.
      - text: The Increment
        correct: true
        why: Correct — the slide defines the Increment as a usable product outcome at the end of the sprint.
      - text: The Product Backlog
        why: >-
          Tempting because it lists the product’s features, but it is the prioritised list of possible work, not a
          finished outcome.
  - key: q914
    type: mcq
    concept: scrum-framework
    difficulty: 2
    stem: After the Sprint Review and Retrospective, what does the team do with what it has learned?
    options:
      - text: Stores it in documentation for the final release
        why: >-
          Tempting because records matter, but agile values working outcomes over comprehensive documentation; the
          learning goes into the next sprint.
      - text: Uses it to plan the next sprint
        correct: true
        why: >-
          Correct — the slide’s repeat step: after the review and retrospective, the team uses what it has learned to
          plan the next sprint.
      - text: Sends it to senior managers for approval before any change
        why: >-
          Tempting in a command-and-control organisation, but the slide loops straight into the next Sprint Planning;
          added approval layers are a barrier Rigby et al. warn about.
      - text: Holds it until the whole product is finished
        why: >-
          Tempting from waterfall thinking, but Scrum feeds learning into every next cycle rather than waiting for the
          end.
  - key: q915
    type: mcq
    concept: scrum-framework
    difficulty: 4
    stem: >-
      One group asks “what do we need to learn, how will we measure it, and what is the simplest thing to build?” before
      writing code. Another agrees a Sprint Goal and selects achievable work for the next two weeks. Which pairing is
      right?
    options:
      - text: The first is Sprint Planning; the second is validated learning
        why: >-
          Tempting because both are planning, but it reverses them: the reverse-order questions are lean start-up’s
          validated learning.
      - text: Both groups are doing Sprint Planning, in different words
        why: >-
          Tempting because both look ahead, but only the second sets a Sprint Goal and selects work; the first plans an
          experiment.
      - text: The first plans validated learning (lean start-up); the second is in Sprint Planning (Scrum)
        correct: true
        why: >-
          Correct — validated learning asks what to learn, how to measure it and the simplest thing to build; Sprint
          Planning agrees a Sprint Goal and selects work.
      - text: Both groups are planning lean start-up experiments
        why: >-
          Tempting because both test ideas, but agreeing a Sprint Goal and selecting work is the Scrum event, not an MVP
          experiment.
  - key: q916
    type: mcq
    concept: scrum-framework
    difficulty: 2
    stem: How long is the Daily Scrum on the tutor’s Scrum framework slide?
    options:
      - text: Typically two to eight hours
        why: Tempting because it is the longest event time on the slide, but two to eight hours is Sprint Planning.
      - text: Fifteen minutes, daily
        correct: true
        why: Correct — the slide gives the Daily Scrum 15 minutes daily, to inspect progress and adapt the plan.
      - text: Typically one to four hours
        why: Tempting because it is a review-length meeting, but one to four hours is the Sprint Review.
      - text: One month or less
        why: Tempting because it is the key Scrum time limit, but one month or less is the length of the sprint itself.
  - key: q917
    type: mcq
    concept: scrum-framework
    difficulty: 3
    stem: >-
      UniConnect’s Product Owner adds “group chat for study partners” to the prioritised list of features and work.
      Where has the item gone?
    options:
      - text: The Sprint Backlog
        why: >-
          Tempting because the item may be built soon, but the Sprint Backlog is created during Sprint Planning from
          selected work.
      - text: The Increment
        why: >-
          Tempting because the feature will be part of the product, but the Increment is what is usable at the end of a
          sprint.
      - text: The Sprint Goal for the current sprint
        why: >-
          Tempting because the item is important, but the Sprint Goal is agreed by the team at Sprint Planning, not set
          by adding items to a list.
      - text: The Product Backlog
        correct: true
        why: Correct — the Product Backlog is the prioritised list of features and work, maintained by the Product Owner.
  - key: q918
    type: mcq
    concept: scrum-framework
    difficulty: 3
    stem: Which pairing of the reading’s roles with the Scrum Guide’s roles is right?
    options:
      - text: Initiative owner = Product Owner; process facilitator = Scrum Master
        correct: true
        why: >-
          Correct — the reading says the initiative owner is also known as a product owner and the process facilitator
          is often a trained scrum master.
      - text: Initiative owner = Scrum Master; process facilitator = Product Owner
        why: >-
          Tempting because both pairs are roles, but it swaps them: the owner ranks the backlog, the facilitator guides
          the process.
      - text: Team leader = Product Owner; process facilitator = Development Team
        why: >-
          Tempting because the lecture slide names a team leader, but the reading maps the initiative owner, not the
          team leader, to the product owner.
      - text: Initiative owner = Development Team; team leader = Scrum Master
        why: Tempting because the team owns its work, but the initiative owner is a single role that ranks the backlog.
  - key: q919
    type: mcq
    concept: scrum-framework
    difficulty: 3
    variant-of: q905
    stem: >-
      Without stakeholders present, a team meets to discuss why handovers between designers and developers keep
      slipping, and agrees how to work better next sprint. Which event is this?
    options:
      - text: The Sprint Review
        why: >-
          Tempting because it closes the sprint, but the review inspects the outcome with stakeholders; this meeting is
          about the team’s process.
      - text: The Daily Scrum
        why: >-
          Tempting because it is internal, but the Daily Scrum is 15 minutes on progress towards the goal, not a
          reflection on working practices.
      - text: The Sprint Retrospective
        correct: true
        why: Correct — the retrospective reflects on how the team can improve its work, which is what this meeting does.
      - text: Sprint Planning
        why: >-
          Tempting because it looks to the next sprint, but planning agrees a goal and selects work; reflecting on
          handovers is the retrospective.
  - key: q920
    type: match
    concept: scrum-framework
    difficulty: 2
    prompt: Match each Scrum element to its description on the tutor slide.
    pairs:
      - left: Product Owner
        right: Represents the customer and maximises the value of the product
      - left: Scrum Master
        right: Facilitates the process, removes obstacles and helps the team improve
      - left: Sprint Review
        right: Inspects outcomes and gathers feedback from stakeholders
      - left: Sprint Retrospective
        right: Reflects on how the team can improve its work
      - left: Increment
        right: A usable product outcome at the end of the sprint
  - key: q921
    type: truefalse
    concept: scrum-framework
    difficulty: 1
    statement: In Scrum, a sprint can run for up to three months when the work is complex.
    answer: false
    why: >-
      False — the slide defines a sprint as a fixed-length cycle of one month or less (typically one to four weeks),
      whatever the work.
  - key: q922
    type: truefalse
    concept: scrum-framework
    difficulty: 1
    statement: The tutor slides note that not all Agile teams use Scrum.
    answer: true
    why: >-
      True — the slide says Scrum is one Agile framework and not all Agile teams use Scrum; the reading also names lean
      development and kanban.
  - key: q923
    type: truefalse
    concept: scrum-framework
    difficulty: 2
    statement: The Sprint Backlog is maintained by the Product Owner and holds every feature the product might ever need.
    answer: false
    why: >-
      False — that describes the Product Backlog. The Sprint Backlog is the work selected for the current sprint,
      created during Sprint Planning.
  - key: q924
    type: truefalse
    concept: scrum-framework
    difficulty: 2
    statement: The Sprint Retrospective is where the team inspects the product with stakeholders.
    answer: false
    why: >-
      False — the Sprint Review inspects outcomes with stakeholders; the retrospective reflects on how the team can
      improve its work.
  - key: q925
    type: mcq
    concept: agile-lean-start-up-lean-strategy
    difficulty: 1
    stem: According to the tutor slides, which question does lean start-up answer?
    options:
      - text: How do we organise teams to develop and improve innovations?
        why: >-
          Tempting because lean start-up also works in cycles, but organising teams is the question the slide gives to
          agile.
      - text: How do we test whether our innovation creates value for customers?
        correct: true
        why: >-
          Correct — the slide gives lean start-up this question: test assumptions with real users, learn from feedback
          and adapt.
      - text: How do we ensure experimentation remains aligned with strategic direction?
        why: >-
          Tempting because lean start-up runs experiments, but keeping them aligned with direction is lean strategy’s
          question.
      - text: How do we fix a detailed plan before any work begins?
        why: Tempting only from a waterfall view; none of the three approaches starts from a fixed up-front plan.
  - key: q926
    type: mcq
    concept: agile-lean-start-up-lean-strategy
    difficulty: 1
    variant-of: q925
    stem: According to the tutor slides, which question does lean strategy answer?
    options:
      - text: How do we test whether our innovation creates value for customers?
        why: >-
          Tempting because Collis writes about experiments, but testing value with customers is lean start-up’s
          question.
      - text: How do we organise teams to develop and improve innovations?
        why: >-
          Tempting because strategy shapes organisations, but organising teams in sprints is agile’s question on the
          slide.
      - text: How do we ensure experimentation remains aligned with strategic direction?
        correct: true
        why: >-
          Correct — the slide gives lean strategy this question: set direction, scope and guardrails for
          experimentation.
      - text: How do we remove waste from a production line?
        why: >-
          Tempting because “lean” recalls Toyota’s production system, but that is not the question the slide gives lean
          strategy.
  - key: q927
    type: mcq
    concept: agile-lean-start-up-lean-strategy
    difficulty: 1
    stem: Which approach does the tutor slide describe as “organise work into short, iterative cycles (sprints)”?
    options:
      - text: Agile
        correct: true
        why: >-
          Correct — the slide lists organising work into sprints, enabling collaboration and quick adaptation, and
          continuous improvement under agile.
      - text: Lean start-up
        why: Tempting because the build–measure–learn loop is also short and iterative, but sprints are listed under agile.
      - text: Lean strategy
        why: >-
          Tempting because strategy organises effort, but lean strategy sets direction, scope and guardrails rather than
          sprints.
      - text: Waterfall development
        why: >-
          Tempting because it too organises work, but waterfall passes detailed plans sequentially from function to
          function, the opposite of short cycles.
  - key: q928
    type: mcq
    concept: agile-lean-start-up-lean-strategy
    difficulty: 2
    stem: “Set direction, scope and guardrails for experimentation” belongs to which approach on the tutor slide?
    options:
      - text: Agile
        why: >-
          Tempting because agile teams need direction, but the slide lists sprints, collaboration and continuous
          improvement under agile, not guardrails.
      - text: Lean start-up
        why: >-
          Tempting because guardrails concern experiments, but lean start-up runs the tests; setting their bounds is
          lean strategy.
      - text: Scrum
        why: >-
          Tempting because Scrum has a Sprint Goal, but Scrum is an agile framework; strategic guardrails belong to lean
          strategy.
      - text: Lean strategy
        correct: true
        why: >-
          Correct — the slide lists setting direction, scope and guardrails for experimentation under lean strategy,
          matching Collis’s screen and yardstick.
  - key: q929
    type: mcq
    concept: agile-lean-start-up-lean-strategy
    difficulty: 2
    stem: What relationship between agile, lean start-up and lean strategy does the tutor slide propose?
    options:
      - text: Lean strategy replaces agile and lean start-up once a venture grows
        why: >-
          Tempting because Collis stresses strategy, but the slide presents the three as working together, not one
          replacing the others.
      - text: They complement one another to help organisations innovate more effectively
        correct: true
        why: >-
          Correct — the slide’s heading line says the three approaches complement one another to help organisations
          innovate more effectively.
      - text: They conflict, so an organisation must choose one of them
        why: >-
          Tempting because each has its own advocates, but the slide joins them as interlocking pieces answering
          different questions.
      - text: Lean start-up suits start-ups; agile and lean strategy suit only large firms
        why: >-
          Tempting because of the names, but the slide applies all three to organisations innovating; Collis writes for
          ventures too.
  - key: q930
    type: mcq
    concept: agile-lean-start-up-lean-strategy
    difficulty: 2
    stem: In the UniConnect challenge, “prioritise work based on value and capacity” is which level of decision-making?
    options:
      - text: Managing change
        why: Tempting because priorities can change, but managing change is testing assumptions and adapting on evidence.
      - text: Managing barriers
        why: >-
          Tempting because capacity can be a constraint, but managing barriers is removing organisational barriers and
          enabling collaboration.
      - text: Managing tasks
        correct: true
        why: >-
          Correct — the slide’s first level, managing tasks, is prioritising work based on value and capacity (Round 1:
          the product backlog and first sprint).
      - text: Managing strategy
        why: >-
          Tempting because prioritising sounds strategic, but the slide’s three levels are tasks, change and barriers;
          there is no strategy level.
  - key: q931
    type: mcq
    concept: agile-lean-start-up-lean-strategy
    difficulty: 2
    stem: In the UniConnect challenge, “test assumptions and adapt based on evidence” is which level of decision-making?
    options:
      - text: Managing change
        correct: true
        why: >-
          Correct — the slide’s second level, managing change, is testing assumptions and adapting on evidence (Round 2:
          customer feedback and the next experiment).
      - text: Managing tasks
        why: Tempting because tests produce tasks, but managing tasks is prioritising work on value and capacity.
      - text: Managing barriers
        why: >-
          Tempting because evidence can expose barriers, but managing barriers is removing them and enabling
          cross-functional collaboration.
      - text: Managing stakeholders
        why: >-
          Tempting because stakeholders give feedback, but this is not one of the slide’s three levels (tasks, change,
          barriers).
  - key: q932
    type: mcq
    concept: agile-lean-start-up-lean-strategy
    difficulty: 2
    stem: >-
      In the UniConnect challenge, “remove organisational barriers and enable cross-functional collaboration” is which
      level?
    options:
      - text: Managing tasks
        why: Tempting because collaboration gets tasks done, but managing tasks is prioritising work on value and capacity.
      - text: Managing change
        why: >-
          Tempting because removing barriers changes the organisation, but managing change is testing assumptions and
          adapting on evidence.
      - text: Managing barriers
        correct: true
        why: >-
          Correct — the third level is managing barriers (Round 3: identify organisational barriers and recommend how
          managers can enable agile).
      - text: Managing the Sprint Retrospective
        why: >-
          Tempting because retrospectives improve teamwork, but that is a Scrum event, not one of the challenge’s three
          levels.
  - key: q933
    type: mcq
    concept: agile-lean-start-up-lean-strategy
    difficulty: 3
    stem: >-
      UniConnect’s first survey shows students rarely use the campus-events feature but want study-partner matching. The
      team revises its priorities and plans an experiment on matching. Which round of the challenge does this reflect?
    options:
      - text: Round 1 — manage tasks
        why: >-
          Tempting because priorities are revised, but Round 1 is the first backlog and sprint; using customer feedback
          to revise and plan an experiment is Round 2.
      - text: Round 3 — manage innovation
        why: >-
          Tempting because the product changes direction, but Round 3 is about organisational barriers and how managers
          enable agile.
      - text: "None: agile teams should finish the original plan first"
        why: >-
          Tempting from a plan-first view, but responding to change over following a plan is an agile value; adapting on
          feedback is the point.
      - text: Round 2 — manage change
        correct: true
        why: Correct — Round 2 uses customer feedback to revise priorities and plan the next experiment.
  - key: q934
    type: mcq
    concept: agile-lean-start-up-lean-strategy
    difficulty: 3
    stem: >-
      A team works in disciplined two-week sprints and ships features on time, but never checks whether students
      actually want them. Which approach is most clearly missing?
    options:
      - text: Agile
        why: >-
          Tempting because something is wrong with delivery, but sprints and on-time increments are agile at work; the
          gap is testing value.
      - text: Lean start-up
        correct: true
        why: >-
          Correct — lean start-up asks whether the innovation creates value for customers, testing assumptions with real
          users; this team never tests.
      - text: Lean strategy
        why: Tempting because the team may lack direction, but the clearest gap is that nothing is tested with real users.
      - text: Scrum
        why: >-
          Tempting because Scrum has a Sprint Review, but two-week sprints show the team is already using Scrum; what is
          missing is testing customer value.
  - key: q935
    type: mcq
    concept: agile-lean-start-up-lean-strategy
    difficulty: 3
    stem: >-
      A start-up runs dozens of quick experiments across eight unrelated markets, and staff chase whichever test looks
      promising that week. Which approach does it most need?
    options:
      - text: More agile sprints, so the tests run faster
        why: Tempting because speed helps learning, but faster tests without direction add to the chaos.
      - text: More lean start-up tests with real users
        why: >-
          Tempting because testing is good, but the venture already tests a lot; what it lacks is a way to choose among
          tests.
      - text: Lean strategy, to set direction, scope and guardrails
        correct: true
        why: >-
          Correct — lean strategy keeps experimentation aligned with direction; Collis warns entrepreneurship without
          strategy leads to chaos (Eleet analysed its markets and chose B2B before testing).
      - text: A return to waterfall planning
        why: >-
          Tempting as a reaction to chaos, but Collis rejects rigid planning too: strategy without entrepreneurship is
          central planning.
  - key: q936
    type: mcq
    concept: agile-lean-start-up-lean-strategy
    difficulty: 3
    stem: >-
      The tutorial asks whether an organisation can be agile and still fail to innovate successfully. Which example from
      the week’s materials best shows that it can?
    options:
      - text: >-
          A financial services firm whose agile app team built an app customers praised, yet time to release barely
          improved
        correct: true
        why: >-
          Correct — funding waited on annual planning and testing and integration ran through waterfall queues, so the
          agile team’s work barely sped up release.
      - text: John Deere, where innovation cycle times fell by more than 75% as agile spread
        why: Tempting because it is a major agile example, but it shows agile succeeding as it spread, not failing.
      - text: Intronis, whose marketing team learned to produce a topical webinar in a few days
        why: "Tempting because it is agile outside IT, but its webinar drew a company-record 600 registrants: a success."
      - text: Spotify, whose squads tested changes to their practices before adopting them
        why: Tempting because squads drop some practices, but they do so because tests showed results improved.
  - key: q937
    type: mcq
    concept: agile-lean-start-up-lean-strategy
    difficulty: 4
    stem: Why did the financial services company’s agile app pilot barely improve the total time to release?
    options:
      - text: The agile team refused to test the app with customers
        why: >-
          Tempting because testing is central to agile, but the reading says customers praised the app; the delay was
          elsewhere.
      - text: Customers disliked the app, so it had to be rebuilt
        why: >-
          Tempting because rework slows release, but the app was praised; the problem was the organisation around the
          team.
      - text: The team’s sprints ran longer than one month
        why: >-
          Tempting because sprint length matters in Scrum, but the reading points to processes outside the team, not its
          sprints.
      - text: Funding, testing and integration still ran through annual planning and waterfall queues
        correct: true
        why: >-
          Correct — funding waited months for annual planning, then vulnerability testing and integration ran through
          waterfall processes with long queues.
  - key: q938
    type: mcq
    concept: agile-lean-start-up-lean-strategy
    difficulty: 2
    stem: Which pairing of approach and contribution matches the tutor slide?
    options:
      - text: "Agile: set direction, scope and guardrails for experimentation"
        why: Tempting because agile teams need focus, but guardrails for experimentation are listed under lean strategy.
      - text: "Lean start-up: organise work into short, iterative cycles (sprints)"
        why: Tempting because lean start-up loops quickly, but sprints are listed under agile.
      - text: "Lean strategy: prioritise the right opportunities and allocate resources effectively"
        correct: true
        why: >-
          Correct — the slide lists setting direction, prioritising the right opportunities and allocating resources
          effectively under lean strategy.
      - text: "Lean strategy: test assumptions with real users"
        why: Tempting because Collis discusses experiments, but testing with real users is listed under lean start-up.
  - key: q939
    type: mcq
    concept: agile-lean-start-up-lean-strategy
    difficulty: 4
    stem: >-
      A manager says: “Our teams run Scrum, so innovation is handled.” Which reply best uses the tutor’s three-approach
      slide?
    options:
      - text: "Agreed: Scrum already includes lean start-up and lean strategy"
        why: >-
          Tempting because Scrum has reviews and goals, but the slide treats lean start-up and lean strategy as
          separate, complementary approaches.
      - text: >-
          Scrum organises the work; you still need to test value with customers and keep experiments inside a strategic
          direction
        correct: true
        why: >-
          Correct — agile organises teams, lean start-up tests customer value, lean strategy keeps experimentation
          aligned; Scrum alone covers only the first.
      - text: Scrum is unnecessary once you have a lean strategy
        why: >-
          Tempting because Collis stresses strategy, but the slide keeps agile as the way to organise teams; the three
          complement one another.
      - text: Drop Scrum and run lean start-up experiments only
        why: >-
          Tempting because lean start-up tests value, but without agile’s organisation and lean strategy’s direction,
          the gaps simply move.
  - key: q940
    type: mcq
    concept: agile-lean-start-up-lean-strategy
    difficulty: 3
    stem: Which UniConnect round uses Scrum’s own tools most directly?
    options:
      - text: Round 2, because customer feedback is gathered at a Sprint Review
        why: >-
          Tempting because reviews gather feedback, but Round 2 is framed as revising priorities and planning the next
          experiment (lean start-up language).
      - text: Round 3, because managers decide how the team’s sprints run
        why: Tempting because managers enable agile, but Round 3 is about organisational barriers, not running sprints.
      - text: Round 1, which prioritises the product backlog and plans the first sprint
        correct: true
        why: Correct — Round 1 (manage tasks) works with the Product Backlog and plans the first agile sprint.
      - text: None of them, because UniConnect is a lean start-up case
        why: >-
          Tempting because UniConnect is a start-up, but the challenge has groups act as an agile innovation team, and
          Round 1 is Scrum planning.
  - key: q941
    type: truefalse
    concept: agile-lean-start-up-lean-strategy
    difficulty: 1
    statement: >-
      The tutor slides present agile, lean start-up and lean strategy as rival approaches an organisation must choose
      between.
    answer: false
    why: >-
      False — the slide says the three approaches complement one another to help organisations innovate more
      effectively; each answers a different question.
  - key: q942
    type: truefalse
    concept: agile-lean-start-up-lean-strategy
    difficulty: 1
    statement: >-
      In the UniConnect challenge, Round 3 asks teams to identify organisational barriers and recommend how managers can
      enable agile.
    answer: true
    why: >-
      True — Round 3 (manage innovation) is identifying organisational barriers and recommending how managers can enable
      agile.
  - key: q943
    type: truefalse
    concept: agile-lean-start-up-lean-strategy
    difficulty: 2
    statement: “Test assumptions with real users” is listed on the tutor slide under lean strategy.
    answer: false
    why: >-
      False — it is listed under lean start-up. Lean strategy sets direction, scope and guardrails, prioritises
      opportunities and allocates resources.
  - key: q944
    type: truefalse
    concept: agile-lean-start-up-lean-strategy
    difficulty: 2
    statement: In the UniConnect challenge, managing tasks means prioritising work based on value and capacity.
    answer: true
    why: >-
      True — the slide’s first level of decision-making, managing tasks, is prioritising work based on value and
      capacity.
  - key: q945
    type: short
    concept: agile-lean-start-up-lean-strategy
    difficulty: 3
    prompt: >-
      Your tutor asks: “Can an organisation be agile and still fail to innovate successfully?” Answer using agile, lean
      start-up and lean strategy, apply them to UniConnect, and use at least one real example from the Week 10
      materials.
    model: >-
      Yes. The tutor slides give each approach a different question. Agile asks how to organise teams to develop and
      improve innovations: short, iterative sprints, collaboration and quick adaptation. Lean start-up asks whether the
      innovation creates value for customers: test assumptions with real users and adapt. Lean strategy asks whether
      experimentation stays aligned with strategic direction: direction, scope, guardrails and resources. They
      complement one another, so agile alone can fail. Rigby, Sutherland and Takeuchi describe a financial services
      company whose agile team built a mobile app customers praised, yet funding waited on annual planning and testing
      and integration ran through waterfall queues, so release time barely improved. For UniConnect, Scrum sprints would
      organise the work (managing tasks), but the team must also test features such as study-partner matching with
      students (managing change), and managers must remove barriers such as approval layers (managing barriers). Without
      lean strategy, Collis warns, experiments drift into chaos: UniConnect should decide what it will not do. The limit
      is cost: all three demand training, behavioural change and executives who change their own behaviour.
    rubric:
      - id: r1
        criterion: Concept — explains what each of the three approaches does.
        marks: 3
        top-band: >-
          States the question each approach answers (organise teams; test customer value; stay aligned with strategic
          direction) and that they complement one another.
        margin-note: What job does each approach do that the others do not?
        authorities:
          - mgmt2094-rigby-sutherland-takeuchi-2016-embracing-agile
          - mgmt2094-collis-2016-lean-strategy
      - id: r2
        criterion: Example — uses a real example from the materials.
        marks: 2
        top-band: >-
          Uses the financial services app pilot (or a Collis example such as Groupon or Nasty Gal) accurately to show
          agile or experimentation failing without the other pieces.
        margin-note: Which organisation was agile in the team but not around it?
        authorities:
          - mgmt2094-example-financial-services-app-pilot
      - id: r3
        criterion: Application — applies the approaches to UniConnect.
        marks: 3
        top-band: >-
          Shows tasks, change and barriers at UniConnect: a backlog and sprint, a feature tested with students, and a
          barrier managers must remove.
        margin-note: Make it about UniConnect, not agile in general.
        authorities:
          - mgmt2094-example-uniconnect-challenge
      - id: r4
        criterion: Evaluation — weighs a limit or trade-off.
        marks: 2
        top-band: >-
          Identifies a real limit (cost of training and behavioural change, executive behaviour, rigid strategy turning
          into central planning) and why it matters.
        margin-note: What could still stop all three working together?
        authorities:
          - mgmt2094-collis-2016-lean-strategy
  - key: q946
    type: mcq
    concept: agile-innovation
    difficulty: 1
    stem: How do the tutor slides define agile?
    options:
      - text: An approach to managing complex work through collaboration, iterative development, feedback and adaptation
        correct: true
        why: >-
          Correct — this is the tutor slide’s definition of agile, followed by the cycle prioritise → deliver → review →
          adapt → repeat.
      - text: A way of working without a plan so that teams can respond to anything
        why: >-
          Tempting because agile responds to change, but the slide says agile does not mean working without a plan: it
          plans in shorter cycles.
      - text: A software tool for tracking tasks from to-do, through in progress, to done
        why: Tempting because task boards appear in agile tutorials, but agile is an approach to managing work, not a tool.
      - text: A method of fixing detailed requirements up front and passing them between functions
        why: >-
          Tempting because it is a way to manage work, but this describes waterfall development, which agile was
          designed to improve on.
  - key: q947
    type: mcq
    concept: agile-innovation
    difficulty: 2
    stem: What is the order of the agile cycle on the tutor slides?
    options:
      - text: Plan → build → document → approve → release
        why: >-
          Tempting because it sounds like a project lifecycle, but it is closer to waterfall; the slide’s cycle is
          prioritise, deliver, review, adapt, repeat.
      - text: Review → prioritise → adapt → deliver → repeat
        why: >-
          Tempting because the steps are right, but the order is wrong: the cycle starts by prioritising valuable work
          and reviews after delivering.
      - text: Prioritise → deliver → review → adapt → repeat
        correct: true
        why: Correct — choose valuable work, create usable outcomes, gather feedback, adjust the plan, and keep learning.
      - text: Build → measure → learn → pivot or persevere
        why: >-
          Tempting because it is also a loop, but this is lean start-up’s build–measure–learn loop, not the tutor’s
          agile cycle.
  - key: q948
    type: mcq
    concept: agile-innovation
    difficulty: 2
    stem: Which value is in the Agile Manifesto’s own wording (Beck et al., 2001), rather than Rigby et al.’s adaptation?
    options:
      - text: Working prototypes over excessive documentation
        why: >-
          Tempting because it is the same idea, but “working prototypes” and “excessive documentation” are the reading’s
          adapted words.
      - text: People over processes and tools
        why: >-
          Tempting because it is close, but the manifesto’s wording is “individuals and interactions over processes and
          tools”.
      - text: Customer collaboration over rigid contracts
        why: >-
          Tempting because “customer collaboration” is the manifesto’s, but the manifesto sets it over “contract
          negotiation”; “rigid contracts” is the adaptation.
      - text: Working software over comprehensive documentation
        correct: true
        why: "Correct — the tutor slide quotes Beck et al. (2001): working software over comprehensive documentation."
  - key: q949
    type: mcq
    concept: agile-innovation
    difficulty: 3
    stem: >-
      Two months into building an app for university students, research shows students don’t want several of its key
      features. Which response fits the agile cycle best?
    options:
      - text: Continue with the original plan, since two months are already invested
        why: Tempting because of the sunk cost, but agile values responding to change over following a plan.
      - text: Reconsider priorities based on the feedback
        correct: true
        why: >-
          Correct — the agile cycle reviews (gathers feedback) and then adapts (adjusts the plan); responding to change
          over following a plan.
      - text: Add the requested features while keeping everything originally planned
        why: >-
          Tempting because it seems to satisfy everyone, but it ignores the feedback that key features are unwanted and
          skips prioritising valuable work.
      - text: Pause all work until a complete new specification is written
        why: >-
          Tempting as a cautious reset, but a full up-front specification is the waterfall habit agile replaced; agile
          plans in shorter cycles.
  - key: q950
    type: mcq
    concept: agile-innovation
    difficulty: 2
    stem: >-
      On the tutor slide, which organisational practice (Rigby et al., 2016) is paired with “customer collaboration over
      contract negotiation”?
    options:
      - text: Empower cross-functional, self-managing teams to collaborate and make decisions
        why: >-
          Tempting because it mentions collaboration, but it is paired with individuals and interactions over processes
          and tools.
      - text: Involve customers regularly to understand their needs and create value
        correct: true
        why: >-
          Correct — the slide pairs customer collaboration over contract negotiation with involving customers regularly
          to understand their needs.
      - text: Deliver usable outcomes through short, iterative development cycles
        why: >-
          Tempting because customers use the outcomes, but it is paired with working software over comprehensive
          documentation.
      - text: Use feedback and continuous learning to adapt priorities and solutions
        why: Tempting because customer feedback matters, but it is paired with responding to change over following a plan.
  - key: q951
    type: truefalse
    concept: agile-innovation
    difficulty: 1
    statement: According to the tutor slides, agile means working without a plan.
    answer: false
    why: >-
      False — the slide says agile does not mean working without a plan; it means planning in shorter cycles and
      adapting as new information emerges.
