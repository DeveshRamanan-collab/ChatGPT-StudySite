cards:
  - type: cloze
    concept: agile-innovation
    text: >-
      Agile innovation is a term used to describe a series of methods which originated in the field of {{c1::software
      development}}.
    source: Week 10 Lecture Slides (Agile Innovation and Lean Start-up), slide 2
  - type: basic
    concept: agile-innovation
    front: What are the two key roles within agile innovation, according to the slides?
    back: The team leader and the process facilitator.
    source: Week 10 Lecture Slides (Agile Innovation and Lean Start-up), slide 2
  - type: basic
    concept: agile-innovation
    front: State the four agile values (as adapted in the reading).
    back: >-
      People over processes and tools; respond to change rather than follow a plan; working prototypes over excessive
      documentation; customer collaboration over rigid contracts.
    source: Rigby, Sutherland and Takeuchi (2016), Embracing Agile, sidebar 'Agile Values and Principles'
  - type: basic
    concept: agile-innovation
    front: Scrum, lean development, kanban — what does each focus on?
    back: >-
      Scrum: creative and adaptive teamwork in solving complex problems. Lean development: the continual elimination of
      waste. Kanban: reducing lead times and the amount of work in process.
    source: Rigby, Sutherland and Takeuchi (2016), Embracing Agile, p 42
  - type: basic
    concept: scrum-in-practice
    front: Initiative owner vs process facilitator in scrum — who does what?
    back: >-
      The initiative (product) owner is responsible for delivering value and rank-orders the portfolio backlog; the
      process facilitator (often a scrum master) guides the process and protects the team from distractions.
    source: Rigby, Sutherland and Takeuchi (2016), Embracing Agile, p 43
  - type: cloze
    concept: scrum-in-practice
    text: >-
      A scrum team is usually {{c1::three to nine}} people and builds working versions in sprints of {{c2::less than a
      month}}.
    source: Rigby, Sutherland and Takeuchi (2016), Embracing Agile, pp 42–43
  - type: apply
    concept: scrum-in-practice
    scenario: A team argues for a week over which of two sign-up pages is better, and the manager is asked to decide.
    answer: >-
      Scrum resolves disagreements through experimentation and feedback, not endless debate or appeals to authority:
      test both pages with a few customers.
    source: Rigby, Sutherland and Takeuchi (2016), Embracing Agile, p 43
  - type: basic
    concept: scrum-in-practice
    front: What happens if customers get excited about a scrum team’s small prototype?
    back: It may be released immediately, even if a senior executive isn’t a fan or others want more bells and whistles.
    source: Rigby, Sutherland and Takeuchi (2016), Embracing Agile, p 43
  - type: basic
    concept: conditions-for-agile
    front: Name the five rows of the reading’s exhibit "The Right Conditions for Agile".
    back: Market environment; customer involvement; innovation type; modularity of work; impact of interim mistakes.
    source: Rigby, Sutherland and Takeuchi (2016), Embracing Agile, exhibit p 46
  - type: cloze
    concept: conditions-for-agile
    text: >-
      Agile conditions are less common in {{c1::routine operations}} such as plant maintenance, purchasing, sales calls
      and accounting.
    source: Rigby, Sutherland and Takeuchi (2016), Embracing Agile, p 44
  - type: apply
    concept: conditions-for-agile
    scenario: A firm’s product cannot be tested until it is complete, and a mistake mid-way could be catastrophic.
    answer: Unfavourable for agile on modularity of work and impact of interim mistakes; a detailed plan suits it better.
    source: Rigby, Sutherland and Takeuchi (2016), Embracing Agile, exhibit p 46
  - type: basic
    concept: conditions-for-agile
    front: Why did agile fit marketing but not selling at OpenView Venture Partners?
    back: >-
      Marketing problems could be broken into modules for creative teams; any sales call can change a rep’s to-do list
      on the spot, so regrouping the team and backlog every hour would be impractical.
    source: Rigby, Sutherland and Takeuchi (2016), Embracing Agile, p 44
  - type: basic
    concept: leading-agile
    front: List the six practices for leaders in "Embracing Agile".
    back: >-
      1 Learn how agile really works; 2 understand where agile does or does not work; 3 start small and let the word
      spread; 4 allow master teams to customise their practices; 5 practise agile at the top; 6 destroy the barriers to
      agile behaviours.
    source: Rigby, Sutherland and Takeuchi (2016), Embracing Agile, pp 42–50
  - type: cloze
    concept: leading-agile
    text: >-
      Stable teams are {{c1::60%}} more productive and 60% more responsive to customer input than teams that rotate
      members.
    source: Rigby, Sutherland and Takeuchi (2016), Embracing Agile, p 46
  - type: apply
    concept: leading-agile
    scenario: Executives keep sitting in on team sessions and overturning the initiative owner’s decisions.
    answer: >-
      Destroy the barriers: name one boss per decision, don’t second-guess the owner (change the owner rather than
      incapacitate them), and lead with questions, not orders.
    source: Rigby, Sutherland and Takeuchi (2016), Embracing Agile, p 50
  - type: basic
    concept: leading-agile
    front: What is shu-ha-ri, and what does it teach about agile?
    back: >-
      A martial-arts learning process: study proven disciplines (shu), then modify them (ha), then improvise (ri).
      Master agile’s proven practices before customising them.
    source: Rigby, Sutherland and Takeuchi (2016), Embracing Agile, p 46
  - type: basic
    concept: lean-start-up
    front: List Steve Blank’s hypotheses from the slides.
    back: >-
      Entrepreneurs and investors are generally executing on guesses; start-ups aren’t small versions of large
      organisations; they are about learning/discovery, not execution; they need to surface hypotheses and test them
      against facts; the facts live outside the building.
    source: Week 10 Lecture Slides (Agile Innovation and Lean Start-up), slide 6
  - type: cloze
    concept: lean-start-up
    text: >-
      A minimum viable product is a product with just those features that allow you to sell to {{c1::early adopters}}
      and {{c2::validate demand}}.
    source: Week 10 Lecture Slides (Agile Innovation and Lean Start-up), slide 7
  - type: cloze
    concept: lean-start-up
    text: Lean start-up method = {{c1::customer development}} + {{c2::agile development}}.
    source: Week 10 Lecture Slides (Agile Innovation and Lean Start-up), slide 18
  - type: basic
    concept: lean-start-up
    front: Where does the "lean" in lean start-up come from, per the slides?
    back: >-
      Japan’s manufacturing industry: Toyota’s Production System and kanban (Taiichi Ohno), which flow into Lean and
      then Ries’s Lean Startup (2011).
    source: Week 10 Lecture Slides (Agile Innovation and Lean Start-up), slides 16 and 20
  - type: basic
    concept: business-model-canvas
    front: Name the nine blocks of the business model canvas.
    back: >-
      Key partners, key activities, key resources, value propositions, customer relationships, channels, customer
      segments, cost structure, revenue streams.
    source: Week 10 Lecture Slides (Agile Innovation and Lean Start-up), slide 8
  - type: cloze
    concept: business-model-canvas
    text: "\"What is the minimum viable product?\" is asked in the {{c1::value propositions}} block of the canvas."
    source: Week 10 Lecture Slides (Agile Innovation and Lean Start-up), slide 8
  - type: apply
    concept: business-model-canvas
    scenario: A founder is unsure whether customers will pay a subscription or per use.
    answer: "A revenue streams hypothesis (revenue model and pricing tactics): test it with an MVP before committing."
    source: Week 10 Lecture Slides (Agile Innovation and Lean Start-up), slide 8
  - type: basic
    concept: build-measure-learn
    front: What are the three validated-learning questions, in order?
    back: >-
      1) What do we need to learn? 2) How can we measure it? 3) What is the simplest thing to build to measure it (the
      MVP)?
    source: Week 10 Lecture Slides (Agile Innovation and Lean Start-up), slide 11
  - type: cloze
    concept: build-measure-learn
    text: >-
      In the innovation accounting report, learning is documented as {{c1::validated}}, {{c2::invalidated}} or
      {{c3::inconclusive}}.
    source: Week 10 Lecture Slides (Agile Innovation and Lean Start-up), slide 12
  - type: basic
    concept: build-measure-learn
    front: Build faster, measure faster, learn faster — one tactic each from the slide.
    back: >-
      Build: continuous deployment, small batches, MVP, refactoring. Measure: split testing, actionable metrics, net
      promoter score. Learn: customer development, five whys.
    source: Week 10 Lecture Slides (Agile Innovation and Lean Start-up), slide 10
  - type: apply
    concept: build-measure-learn
    scenario: "An MVP misses its pre-set target badly: 2% sign-ups against 25% in two weeks."
    answer: >-
      The hypothesis is invalidated: document the learning and consider a pivot — a course correction to the hypotheses
      based on market learning.
    source: Week 10 Lecture Slides (Agile Innovation and Lean Start-up), slides 7, 12–14
  - type: cloze
    concept: lean-strategy
    text: >-
      Strategy without entrepreneurship is {{c1::central planning}}. Entrepreneurship without strategy leads to
      {{c2::chaos}}.
    source: Collis (2016), Lean Strategy, p 63
  - type: basic
    concept: lean-strategy
    front: What are the three elements of a deliberate strategy, according to Collis?
    back: >-
      Objective (the near-term goal), scope (what the venture will and will not do) and competitive advantage (why
      customers buy from us).
    source: Collis (2016), Lean Strategy, pp 66–67
  - type: basic
    concept: lean-strategy
    front: Deliberate vs emergent strategy in Collis?
    back: >-
      Deliberate: agreed by senior executives from analysis — objective, scope, advantage. Emergent: the sum of daily
      decisions and experiments at all levels, guided by the strategy, which reshapes it.
    source: Collis (2016), Lean Strategy, pp 66–67
  - type: apply
    concept: lean-strategy
    scenario: A start-up’s quick test shows strong early sign-ups for a coupon service that anyone could copy.
    answer: >-
      Collis warns this may be an illusion of returns (Groupon): low entry barriers and transitory demand. Screen the
      opportunity strategically before scaling.
    source: Collis (2016), Lean Strategy, pp 64–65
  - type: basic
    concept: lean-strategy
    front: Name two roles Collis gives strategy in relation to experiments.
    back: >-
      A screen that novel ideas must pass, and a yardstick for evaluating the success of experiments (it also frames how
      feedback is interpreted).
    source: Collis (2016), Lean Strategy, p 64
  - type: basic
    concept: scrum-framework
    front: Distinguish agile, Scrum and a sprint (tutor slides).
    back: >-
      Agile: principles of collaboration, iterative delivery and adaptation. Scrum: one framework that organises work
      into short, structured cycles called sprints. Sprint: a fixed-length cycle of one month or less in which a team
      works towards a Sprint Goal and produces a usable increment.
    source: Week 10 Tutor Slides (Agile Innovation and Lean Startup, SW), slide 6
  - type: basic
    concept: scrum-framework
    front: Name Scrum’s three key roles and what each does.
    back: >-
      Product Owner: represents the customer and maximises the value of the product. Development Team: cross-functional,
      self-managing, delivers the work during the sprint. Scrum Master: facilitates the process, removes obstacles,
      helps the team improve.
    source: Week 10 Tutor Slides (Agile Innovation and Lean Startup, SW), slide 7
  - type: cloze
    concept: scrum-framework
    text: >-
      Scrum’s events: {{c1::Sprint Planning}} agrees a Sprint Goal; the {{c2::Daily Scrum}} (15 minutes) inspects
      progress; the {{c3::Sprint Review}} gathers feedback from stakeholders; the {{c4::Sprint Retrospective}} reflects
      on how the team can improve its work.
    source: Week 10 Tutor Slides (Agile Innovation and Lean Startup, SW), slide 7
  - type: basic
    concept: scrum-framework
    front: Name Scrum’s three key artifacts.
    back: >-
      Product Backlog (prioritised list of features and work, maintained by the Product Owner); Sprint Backlog (work
      selected for the current sprint, created during Sprint Planning); Increment (a usable product outcome at the end
      of the sprint).
    source: Week 10 Tutor Slides (Agile Innovation and Lean Startup, SW), slide 7
  - type: apply
    concept: scrum-framework
    scenario: >-
      Without stakeholders present, a team meets to discuss why handovers keep slipping and agrees how to work better
      next sprint.
    answer: >-
      Sprint Retrospective: reflecting on how the team can improve its work. The Sprint Review would inspect the product
      with stakeholders.
    source: Week 10 Tutor Slides (Agile Innovation and Lean Startup, SW), slide 7
  - type: basic
    concept: agile-lean-start-up-lean-strategy
    front: What question does each of agile, lean start-up and lean strategy answer (tutor slides)?
    back: >-
      Agile: how do we organise teams to develop and improve innovations? Lean start-up: how do we test whether our
      innovation creates value for customers? Lean strategy: how do we ensure experimentation remains aligned with
      strategic direction?
    source: Week 10 Tutor Slides (Agile Innovation and Lean Startup, SW), slide 10
  - type: cloze
    concept: agile-lean-start-up-lean-strategy
    text: >-
      UniConnect’s three levels of decision-making: managing {{c1::tasks}} (prioritise work based on value and
      capacity), managing {{c2::change}} (test assumptions and adapt based on evidence) and managing {{c3::barriers}}
      (remove organisational barriers and enable cross-functional collaboration).
    source: Week 10 Tutor Slides (Agile Innovation and Lean Startup, SW), slide 9
  - type: apply
    concept: agile-lean-start-up-lean-strategy
    scenario: >-
      A bank’s agile app team builds an app customers praise, but funding, security testing and integration still run
      through annual plans and waterfall queues.
    answer: >-
      Agile in the team but not around it: time to release barely improves (Rigby et al.’s financial services pilot).
      Managers must remove the barriers — the UniConnect challenge’s “managing barriers”.
    source: >-
      Rigby, Sutherland and Takeuchi (2016), Embracing Agile; Week 10 Tutor Slides (Agile Innovation and Lean Startup,
      SW), slides 9–10
  - type: basic
    concept: agile-lean-start-up-lean-strategy
    front: Can an organisation be agile and still fail to innovate successfully? Give the short answer.
    back: >-
      Yes. Agile organises the team’s work, but the organisation must also test customer value (lean start-up) and keep
      experiments aligned with strategic direction (lean strategy), and managers must remove barriers around the team.
    source: Week 10 Tutor Slides (Agile Innovation and Lean Startup, SW), slide 10
  - type: basic
    concept: agile-innovation
    front: How do the tutor slides define agile, and what is the agile cycle?
    back: >-
      An approach to managing complex work through collaboration, iterative development, feedback and adaptation. Cycle:
      prioritise → deliver → review → adapt → repeat.
    source: Week 10 Tutor Slides (Agile Innovation and Lean Startup, SW), slide 4
  - type: basic
    concept: agile-innovation
    front: Give the Agile Manifesto’s four values in Beck et al.’s (2001) own words.
    back: >-
      Individuals and interactions over processes and tools; working software over comprehensive documentation; customer
      collaboration over contract negotiation; responding to change over following a plan.
    source: Week 10 Tutor Slides (Agile Innovation and Lean Startup, SW), slide 5
  - type: cloze
    concept: agile-innovation
    text: >-
      Agile does not mean working without a {{c1::plan}}. It means planning in {{c2::shorter cycles}} and adapting as
      new information emerges.
    source: Week 10 Tutor Slides (Agile Innovation and Lean Startup, SW), slide 4
audio:
  title: Week 10 recap — agile innovation and lean start-up
  minutes: 3
  script: >
    This week is about two ways to innovate in short cycles, and one warning about them.


    Agile innovation is a set of methods that began in software development. It means high-intensity, self-managed team

    work, rapid prototyping, testing and learning, methods more open-ended than traditional project management, and
    tools

    like design thinking. The slides name two key roles: the team leader and the process facilitator. Its values come
    from

    the 2001 Agile Manifesto, written against waterfall planning: people over processes and tools, responding to change

    over following a plan, working prototypes over excessive documentation, and customer collaboration over rigid

    contracts.


    Rigby, Sutherland and Takeuchi show agile in practice through scrum. A team of three to nine, cross-functional and

    self-managing. An initiative owner who ranks the backlog but never tells the team who does what. A process
    facilitator

    who protects the team. Sprints of less than a month, daily stand-ups, and prototypes tested with a few customers.
    But

    agile is not a panacea. It suits complex problems with unknown solutions, changing markets, modular work and
    mistakes

    that teach; it suits routine work like accounting far less. And it fails most often because of executives, so
    leaders

    should learn it, know where it fits, start small as John Deere did, let master teams customise as Spotify does,

    practise it at the top, and destroy the barriers. The tutorial adds the Scrum Guide: a Product Owner, a Development
    Team and a Scrum Master, and sprints of a month or less that run from planning to review and retrospective.


    Lean start-up comes from Steve Blank and Eric Ries. Blank says founders are executing on guesses, start-ups are not

    small big companies, and the facts live outside the building. So we build a minimum viable product, just enough to

    sell to early adopters and validate demand, and run the build, measure, learn loop as fast as we can. Validated

    learning plans it backwards: what do we need to learn, how do we measure it, and what is the simplest thing to
    build?

    Each result is validated, invalidated or inconclusive, and then we pivot or persevere. The business model canvas
    lays

    out nine blocks, each a hypothesis to test.


    Finally, Collis. Strategy without entrepreneurship is central planning; entrepreneurship without strategy is chaos.

    His lean strategy process sets a vision, then a deliberate strategy of objective, scope and advantage, and lets

    experiments run inside those bounds, with strategy as the screen and the yardstick. Groupon and Nasty Gal show what

    happens without it; Southwest shows it working. In the exam, argue for experiments inside strategy, not instead of
    it. Together: agile organises the team, lean start-up tests value, and lean strategy keeps the experiments on
    course.
