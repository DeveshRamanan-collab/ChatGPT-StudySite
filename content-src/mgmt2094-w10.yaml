  - key: q701
    type: mcq
    concept: build-measure-learn
    difficulty: 1
    set: pretest
    stem: What are the three steps of the lean start-up's core loop, in order?
    options:
      - text: Build, measure, learn
        correct: true
        why: >-
          Correct — the core elements slide shows build (experiments), then measure (metrics), then learn (pivot or
          persevere).
      - text: Plan, build, launch
        why: >-
          Tempting because it is a familiar project sequence, but it has no measuring or learning; the lean loop is
          build–measure–learn.
      - text: Learn, plan, execute
        why: Tempting because validated learning starts from what to learn, but the loop itself runs build, measure, learn.
      - text: Measure, build, then sell
        why: Tempting because measuring matters, but the loop builds first, then measures, then learns.
  - key: q702
    type: mcq
    concept: build-measure-learn
    difficulty: 2
    stem: On the build–measure–learn slide, what links Learn back to Build?
    options:
      - text: A baseline
        why: Tempting because it is a label on the loop, but the baseline links Build to Measure.
      - text: Analysis
        why: Tempting because it is a label on the loop, but analysis links Measure to Learn.
      - text: A hypothesis
        correct: true
        why: >-
          Correct — the arrow from Learn back to Build is labelled hypothesis: learning produces the next hypothesis to
          build an experiment around.
      - text: A business plan
        why: Tempting because plans precede building, but the slide labels the arrow hypothesis, not plan.
  - key: q703
    type: mcq
    concept: build-measure-learn
    difficulty: 2
    stem: What is decided at the Learn step of the loop?
    options:
      - text: How many features to add before launching
        why: >-
          Tempting because learning shapes the product, but the slide says Learn is where you decide to pivot or
          persevere.
      - text: Whether to pivot or persevere
        correct: true
        why: "Correct — the slide labels Learn \"pivot or persevere\": correct course on the hypotheses, or keep going."
      - text: Which metrics to report to investors
        why: >-
          Tempting because metrics feed Learn, but choosing metrics belongs to Measure; Learn decides pivot or
          persevere.
      - text: Who joins the team for the next cycle
        why: Tempting because teams change, but the loop’s Learn step is a decision about the venture’s hypotheses.
  - key: q704
    type: mcq
    concept: build-measure-learn
    difficulty: 2
    stem: What do the slides say to do with the total time through the loop?
    options:
      - text: Minimise it
        correct: true
        why: >-
          Correct — two slides say to minimise the total time through the loop: the faster you build, measure and learn,
          the sooner you know.
      - text: Maximise it, so each step is done thoroughly
        why: Tempting because thoroughness sounds careful, but the slides want fast loops so learning comes quickly.
      - text: Fix it at exactly one month per loop
        why: Tempting because agile sprints are under a month, but the slides set no fixed length; they say minimise it.
      - text: Ignore it, because only the result matters
        why: Tempting because results decide pivot or persevere, but the slides make loop time the thing to minimise.
  - key: q705
    type: mcq
    concept: build-measure-learn
    difficulty: 2
    stem: Which tactics does the slide list under 'Measure faster'?
    options:
      - text: Continuous deployment, small batches and code refactoring
        why: Tempting because they speed the loop, but they are listed under Build faster.
      - text: Customer development and five whys
        why: Tempting because they speed the loop, but they are listed under Learn faster.
      - text: Annual surveys and focus groups
        why: Tempting because they measure customers, but annual surveys are slow; they are not on the slide.
      - text: Split testing, actionable metrics and net promoter score
        correct: true
        why: Correct — the slide lists split testing, actionable metrics and net promoter score under Measure faster.
  - key: q706
    type: mcq
    concept: build-measure-learn
    difficulty: 2
    variant-of: q705
    stem: Which tactics does the slide list under 'Learn faster'?
