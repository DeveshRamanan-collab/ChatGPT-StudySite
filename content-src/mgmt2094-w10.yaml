      without

      a plan; it means planning in shorter cycles.


      Rigby, Sutherland and Takeuchi (2016) call agile a radical alternative to command-and-control-style management: it

      puts people in self-managed, customer-focused, multidisciplinary teams. Its varieties include **scrum**, **lean

      development** (eliminating waste) and **kanban** (reducing lead times and work in process).


      Its values come from the 2001 **Agile Manifesto** (Beck et al.), written as an alternative to 'waterfall'

      development, where detailed plans are made up front and passed from function to function. In the manifesto's words

      (the reading's adaptation in brackets):


      - individuals and interactions over processes and tools (people);

      - working software over comprehensive documentation (working prototypes);

      - customer collaboration over contract negotiation (rigid contracts);

      - responding to change over following a plan.


      Exam use: define agile, name the two roles, then say which value a scenario honours or breaks.
  - slug: scrum-in-practice
    title: How a scrum team works
    visual: diagram
    visual-brief: >-
      One sprint drawn as a structure: the initiative owner feeds a ranked backlog into a self-managing team of three to
      nine; the process facilitator stands between the team and distractions; a loop of less than a month with daily
      stand-ups ends in a prototype tested by a few customers, then a review that feeds the next cycle.
    related:
      - agile-innovation
      - leading-agile
      - scrum-framework
    depends-on:
      - agile-innovation
    contrasts-with:
      - build-measure-learn
    cases: []
    authorities:
      - mgmt2094-rigby-sutherland-takeuchi-2016-embracing-agile
      - mgmt2094-example-ge-digital
    verify: false
    body: >-
      The reading illustrates agile with scrum, used at least five times as often as other agile techniques.


      - **Team**: small (usually three to nine people), mostly full-time, cross-functional (with all the skills it
        needs), self-managing and strictly accountable for every aspect of the work.
      - **Initiative owner** (product owner): ultimately responsible for delivering value to customers and the business;
        builds a 'portfolio backlog' of promising opportunities and continually, ruthlessly rank-orders it. The owner does
        not tell the team who should do what or how long tasks will take.
      - **Process facilitator** (often a trained scrum master): guides the process, protects the team from distractions
        and helps it put its collective intelligence to work.
      - **Sprints**: the team breaks the highest-ranked tasks into small modules, plans in detail only what won't change
        before execution, defines 'done' and builds working versions in short cycles of less than a month.
      - **Transparency**: brief daily stand-ups review progress and roadblocks; disagreements are resolved through
        experimentation and feedback, not endless debates or appeals to authority.
      - **Test and improve**: small working prototypes are tested with a few customers for short periods; if customers
      get
        excited, a prototype may be released immediately. The team then brainstorms ways to improve future cycles.

      GE Digital ran its leadership team this way: two-week sprints, stand-ups three times a week and a progress board
      any

      employee can see.


      Exam use: in a scenario, say who ranks the work, who protects the process and how long a cycle runs.
  - slug: conditions-for-agile
    title: Where agile does or does not work
    visual: simulation
    visual-brief: >-
      Five dials from the reading's exhibit — market environment, customer involvement, innovation type, modularity of
      work, impact of interim mistakes — each set to favourable or unfavourable; a lamp shows whether agile fits and
      names the condition that argues against it.
    related:
      - leading-agile
      - agile-innovation
    depends-on:
      - agile-innovation
    contrasts-with:
      - leading-agile
    cases: []
    authorities:
      - mgmt2094-rigby-sutherland-takeuchi-2016-embracing-agile
      - mgmt2094-example-openview-and-intronis
    verify: false
    body: >-
      Agile is not a panacea. It is most effective and easiest to implement under conditions common in software

      innovation: the problem is complex; solutions are initially unknown and requirements will probably change; the
      work

      can be modularised; close collaboration with end users is feasible; and creative teams will typically outperform

      command-and-control groups.


      The reading's exhibit sets favourable against unfavourable conditions:


      - **Market environment**: preferences and solution options change frequently — or conditions are stable and
        predictable.
      - **Customer involvement**: close collaboration and rapid feedback are feasible — or requirements are clear at the
        outset and customers are unavailable.
      - **Innovation type**: problems complex, solutions unknown, scope unclear, breakthroughs and time to market
        important — or similar work has been done before and plans can be forecast with confidence.
      - **Modularity of work**: incremental developments have value and late changes are manageable — or customers
      cannot
        test parts until everything is complete.
      - **Impact of interim mistakes**: they provide valuable learning — or they may be catastrophic.


      These conditions exist in many product development, marketing, strategic-planning, supply-chain and resource

      allocation activities, and less in routine operations such as plant maintenance, purchasing, sales calls and

      accounting. At OpenView Venture Partners agile suited strategic planning and marketing but not selling. Agile also

      needs training and a cadre of eager participants, so the payoff must justify the cost.


      Exam use: test a scenario against all five rows before recommending agile.
  - slug: leading-agile
    title: Six practices for leaders who want agile to work
    visual: palace
    visual-brief: >-
      Six frames along a corridor, one per practice in the reading's order, each hung with its example: learn how it
      works; know where it fits; start small (John Deere); let master teams customise (Spotify); practise it at the top
      (Systematic, GE Digital, Mission Bell); destroy the barriers (the stalled app pilot).
    related:
      - conditions-for-agile
      - scrum-in-practice
      - agile-lean-start-up-lean-strategy
    depends-on:
      - agile-innovation
    contrasts-with:
      - conditions-for-agile
    cases: []
    authorities:
      - mgmt2094-rigby-sutherland-takeuchi-2016-embracing-agile
      - mgmt2094-example-john-deere
      - mgmt2094-example-spotify
      - mgmt2094-example-systematic
      - mgmt2094-example-ge-digital
      - mgmt2094-example-mission-bell-winery
      - mgmt2094-example-financial-services-app-pilot
      - mgmt2094-example-uniconnect-challenge
    verify: false
    body: >-
      Rigby, Sutherland and Takeuchi find that the greatest impediment to agile is not methodology or evidence but

      the behaviour of executives, who unwittingly keep managing in ways that undermine it — overturning team decisions

      and adding review layers. They set out six practices:


      1. **Learn how agile really works** — it is neither anarchy nor 'doing what I say, only faster'.

      2. **Understand where agile does or does not work** — it is not a panacea.

      3. **Start small and let the word spread** — at John Deere agile began in corporate IT in 2004 and spread over
      years
         to R&D and marketing, helped by a coach and weekly one-page articles.
      4. **Allow 'master' teams to customise their practices** — as in shu-ha-ri, master the proven disciplines first;
         Spotify's squads may drop burndown charts because their tested changes improve results.
      5. **Practise agile at the top** — executive teams at Systematic, GE Digital and Mission Bell Winery ran
      themselves as
         agile teams and rank-ordered enterprise backlogs.
      6. **Destroy the barriers to agile behaviours** — get everyone on the same page, change roles rather than
      structures,
         name only one boss for each decision, focus on teams not individuals, and lead with questions, not orders.

      The stalled app pilot shows why practice 6 matters: an agile team built a praised app, but annual funding and
      waterfall

      testing queues left the total time to release barely improved.


      Exam use: when agile stalls in a scenario, diagnose which practice the leaders are breaking.
  - slug: lean-start-up
    title: "Lean start-up: Blank's hypotheses and its lean–agile roots"
    visual: timeline
    visual-brief: >-
      Three streams on one track — Japan's manufacturing industry (Toyota Production System, kanban), agile software
      (The New New Product Development Game, scrum, extreme programming, the 2001 Agile Manifesto) and start-ups
      (Blank's Four Steps to the Epiphany) — meeting in Ries's Lean Startup (2011).
    related:
      - business-model-canvas
      - build-measure-learn
      - agile-lean-start-up-lean-strategy
    depends-on: []
    contrasts-with:
      - agile-innovation
      - lean-strategy
    cases: []
    authorities:
      - mgmt2094-example-toyota
    verify: false
    body: >-
      Lean Start-Up (LSU) is associated with Steve Blank and Eric Ries. Its key principles on the slides are the

      **minimum viable product (MVP)** and **lean–agile development**.


      Steve Blank's hypotheses:


      - Entrepreneurs and investors are generally executing on guesses.

      - Start-ups aren't small versions of large organisations.

      - They are about learning/discovery, not execution.

      - They need to surface hypotheses/assumptions and test them against facts.

      - However, the facts live outside the building.


      The core concepts are the **MVP** — a product with just those features that allow you to sell to early adopters
      and

      validate demand; **pivoting** — course correction to the proposed set of hypotheses, based on market learnings;
      and the

      **business model canvas**.


      The lean start-up method = **customer development + agile development** (fast, iterative and incremental product

      development): MVP 1, 2, 3 and 4, each shaped by customer feedback, lead by rapid deployment to the final product,
      with

      no waste of time and money and a culture of continuous improvement. The 'lean' comes from Japan's manufacturing

      industry (Toyota's Production System and kanban); scrum, extreme programming and the 2001 Agile Manifesto supply
      the

      agile stream; Blank's *The Four Steps to the Epiphany* (2005) and Ries's *Lean Startup* (2011) bring them to
      start-ups.


      Exam use: explain why a start-up should test its assumptions with an MVP before scaling.
  - slug: business-model-canvas
    title: The business model canvas
    visual: diagram
    visual-brief: >-
      The nine-block canvas drawn block by block: value propositions at the centre; key partners, activities and
      resources to the left; customer relationships, channels and segments to the right; cost structure and revenue
      streams along the bottom — each block labelled with its key question, read as a hypothesis to test.
    related:
      - lean-start-up
      - build-measure-learn
    depends-on:
      - lean-start-up
    contrasts-with: []
    cases: []
    authorities: []
    verify: false
    body: >-
      The business model canvas is one of the lean start-up's three core concepts (with the MVP and pivoting): a

      view of all nine building blocks of a business on one page and their relative hypotheses. Each block is a
      question:


      - **Customer segments** — for whom are we creating value? Who are our most important customers?

      - **Value propositions** — what value do we deliver? Which customer problems are we helping to solve and which
      needs
        are we satisfying? What is the minimum viable product?
      - **Channels** — through which channels do our customer segments want to be reached?

      - **Customer relationships** — how do we get, keep and grow customers? How costly are they?

      - **Revenue streams** — for what value are our customers really willing to pay? What is the revenue model, and
      what
        are the pricing tactics?
      - **Key resources** — what key resources do our value propositions require?

      - **Key activities** — what key activities do our value propositions require?

      - **Key partners** — who are our key partners and suppliers? Which key activities do partners perform?

      - **Cost structure** — what are the most important costs inherent to our business model? Which key resources and
        activities are most expensive?

      On the slide, value propositions sit in the centre; partners, activities and resources to the left; relationships,

      channels and segments to the right; costs and revenue along the bottom.


      Exam use: treat each block as a hypothesis — an MVP tests one before the venture commits.
  - slug: build-measure-learn
    title: Build–measure–learn and validated learning
    visual: simulation
    visual-brief: >-
      One experiment run round the loop: write the hypothesis (quantified, timeboxed), build the simplest MVP, measure
      the result against the target, then learn — validated, invalidated or inconclusive — and the loop points to
      persevere, pivot or the next experiment.
    related:
      - lean-start-up
      - business-model-canvas
      - scrum-framework
    depends-on:
      - lean-start-up
    contrasts-with:
      - scrum-in-practice
    cases: []
    authorities:
      - mgmt2094-example-instagram-burbn
    verify: false
    body: >-
      The lean start-up's core element is a loop: **Build** (experiments) → **Measure** (metrics, against a

      baseline) → **Learn** (analyse, then pivot or persevere) → a new hypothesis → Build. A fuller version runs ideas →

      build → code → measure → data → learn → ideas, with one instruction: **minimise the total time through the loop**
      —

      build faster (continuous deployment, small batches, MVP, refactoring), measure faster (split testing, actionable

      metrics, net promoter score), learn faster (customer development, five whys).


      **Validated learning** plans the loop in reverse: 1) What do we need to learn? 2) How can we measure it? 3) What
      is the

      simplest thing to build to measure it (the MVP)?


      The **innovation accounting report** records each experiment: background (why is it relevant?); a falsifiable

      hypothesis (quantify your goals, set scope/timebox, test the value and growth hypothesis first); build (plan how
      to

      execute the experiment); measure (results = data); learn (document the learning as validated, invalidated or

      inconclusive); and the next action (move to the next experiment).


      At Learn the venture decides to **pivot or persevere**. A one-page lean start-up sheet based on Ries lists pivot
      types

      across the business, including technology, platform, zoom-in, zoom-out, channel, engine-of-growth, customer
      segment,

      customer need, value capture and business architecture pivots.


      Exam use: write the hypothesis so a result could disprove it, then say which result would trigger a pivot.
  - slug: lean-strategy
    title: "Lean strategy: direction for experiments (Collis)"
    visual: explainer
    visual-brief: >-
      Collis's lean strategy process as a cycle — vision, analysis, deliberate strategy (objective, scope, advantage),
      learning through frontline experiments, emergent strategy — with the strategy drawn as a screen that ideas must
      pass and a yardstick that results are read against, before the process restarts.
    related:
      - lean-start-up
      - build-measure-learn
      - agile-lean-start-up-lean-strategy
    depends-on:
      - lean-start-up
    contrasts-with:
      - lean-start-up
    cases: []
    authorities:
      - mgmt2094-collis-2016-lean-strategy
      - mgmt2094-example-southwest-airlines
      - mgmt2094-example-instagram-burbn
      - mgmt2094-example-groupon
      - mgmt2094-example-eleet
      - mgmt2094-example-nasty-gal
      - mgmt2094-example-muzzy-lane
      - mgmt2094-example-tesla
    verify: false
    body: >-
      Collis (2016) argues that strategy and entrepreneurship need each other: 'Strategy without

      entrepreneurship is central planning. Entrepreneurship without strategy leads to chaos.' His **lean strategy
      process**

      integrates the bottom-up approach of the lean start-up with the top-down orientation of strategic management.


      - **Vision** — the only part that should be in any sense permanent: the organisation's reason for existence.

      - **Deliberate strategy** — agreed by senior executives from an analysis of strengths, weaknesses, opportunities,
        threats, resources and capabilities; it sets the **objective**, the **scope** (what the venture will and will not
        do) and the **competitive advantage**.
      - **Emergent strategy** — managers at all levels make daily decisions and run experiments guided by the strategy;
        feedback and findings reshape it, and the process restarts.

      Strategy is both a **screen** that novel ideas must pass and a **yardstick** for evaluating experiments, and it
      frames

      how feedback is read: Instagram's founders noticed that Burbn users posted a lot of pictures and refocused on
      photo

      sharing. The single best piece of advice: know what not to do.


      Collis also marks the lean start-up's limits: choices in a resource-constrained venture are mutually exclusive,
      every

      choice sets a unique path, decisions are interdependent, and simple market tests aren't always useful — some

      innovations need long-term investment (Tesla's batteries), and quick tests can mistake ephemeral traction for
      lasting

      demand (Groupon).


      Exam use: argue for experiments inside strategic boundaries, not experiments instead of strategy.
  - slug: scrum-framework
    title: "The Scrum framework: roles, events and artifacts"
    visual: diagram
    visual-brief: >-
      The Scrum Guide framework as one figure: the Product Owner's backlog feeds Sprint Planning; the sprint is a loop
      of one month or less around the self-managing Development Team, with the Scrum Master alongside and a 15-minute
      Daily Scrum; the increment goes to the Sprint Review, the Retrospective follows, and a repeat arrow carries the
      learning into the next plan.
    related:
      - scrum-in-practice
      - agile-innovation
      - agile-lean-start-up-lean-strategy
    depends-on:
      - agile-innovation
    contrasts-with:
      - scrum-in-practice
      - build-measure-learn
    cases: []
    authorities:
      - mgmt2094-schwaber-sutherland-2020-scrum-guide
      - mgmt2094-example-ge-digital
      - mgmt2094-example-uniconnect-challenge
    verify: false
    body: >-
      The tutor slides separate three levels. **Agile** is the principles (collaboration, iterative delivery,

      adaptation). **Scrum** is one framework that helps teams organise work into short, structured cycles called

      **sprints**. A **sprint** is a fixed-length cycle of one month or less (typically one to four weeks) in which a
      team

      works towards a **Sprint Goal** and produces a **usable increment**. Scrum is one Agile framework; not all Agile
      teams

      use Scrum (Schwaber and Sutherland, 2020).


      - **Roles**: the **Product Owner** represents the customer and maximises the value of the product; the
      **Development
        Team** is cross-functional and self-managing and delivers the work; the **Scrum Master** facilitates the process,
        removes obstacles and helps the team improve.
      - **Events**: **Sprint Planning** agrees a Sprint Goal and selects achievable work; during the **Sprint** a
      15-minute
        **Daily Scrum** inspects progress and adapts the plan; the **Sprint Review** inspects outcomes and gathers
        stakeholder feedback; the **Sprint Retrospective** reflects on how the team can improve its work.
      - **Artifacts**: the **Product Backlog** (prioritised features and work, maintained by the Product Owner), the
        **Sprint Backlog** (work selected at Sprint Planning) and the **Increment** (a usable outcome at the end of the
        sprint).

      The team then uses what it has learned to plan the next sprint. GE Digital's leaders run two-week sprints with COO

      Brad Surak as initiative owner and an engineering executive as scrum master.


      Exam use: name the role, event or artifact a scenario describes; keep the review (the product) apart from the

      retrospective (how the team works).
  - slug: agile-lean-start-up-lean-strategy
    title: Agile, lean start-up and lean strategy together
    visual: diagram
    visual-brief: >-
      Three interlocking pieces, each carrying its own question — organise the team (agile), test value with customers
      (lean start-up), stay aligned with strategic direction (lean strategy) — then the UniConnect challenge's three
      levels of decision-making (tasks, change, barriers) beneath them, and finally the agile app pilot whose release
      time barely moved because only one piece was in place.
    related:
      - agile-innovation
      - lean-start-up
      - lean-strategy
      - leading-agile
      - scrum-framework
    depends-on:
      - agile-innovation
      - lean-start-up
      - lean-strategy
    contrasts-with: []
    cases: []
    authorities:
      - mgmt2094-example-uniconnect-challenge
      - mgmt2094-example-financial-services-app-pilot
      - mgmt2094-collis-2016-lean-strategy
      - mgmt2094-rigby-sutherland-takeuchi-2016-embracing-agile
    verify: false
    body: >-
      The tutor slides close Week 10 by joining its three approaches: they **complement one another** to help

      organisations innovate more effectively. Each answers a different question.


      - **Agile** — how do we organise teams to develop and improve innovations? Organise work into short, iterative
      cycles
        (sprints), enable collaboration and quick adaptation, and continuously improve the product.
      - **Lean start-up** — how do we test whether our innovation creates value for customers? Test assumptions with
      real
        users, learn from feedback and adapt, and develop solutions that create value for customers.
      - **Lean strategy** — how do we ensure experimentation remains aligned with strategic direction? Set direction,
      scope
        and guardrails for experimentation, prioritise the right opportunities and allocate resources effectively.

      The tutorial's UniConnect challenge (a teaching case: a university-backed start-up building a platform for
      students)

      practises three levels of decision-making: **managing tasks** (prioritise work based on value and capacity),

      **managing change** (test assumptions and adapt based on evidence) and **managing barriers** (remove
      organisational

      barriers and enable cross-functional collaboration).


      Can an organisation be agile and still fail to innovate? The materials say yes. A financial services company's
      agile

      pilot built an app customers praised, yet annual funding and waterfall testing and integration meant the time to

      release improved very little. For Collis, entrepreneurship without strategy leads to chaos.


      Exam use: say which approach a scenario lacks, and what that costs.
authorities:
  - slug: mgmt2094-rigby-sutherland-takeuchi-2016-embracing-agile
    title: Rigby, Sutherland and Takeuchi (2016), Embracing Agile
    kind: article
    text: >-
      Agile innovation methods have revolutionised information technology and are now spreading across industries and
      functions, taking people out of functional silos and putting them in self-managed, customer-focused,
      multidisciplinary teams. Many companies struggle because leaders do not really understand agile and keep managing
      in ways that undermine it. Leaders should learn how agile really works, understand where it does or does not work,
      start small and let it spread, allow master teams to customise their practices, practise agile at the top, and
      destroy the barriers to agile behaviours.
    gloss: >-
      The unit's account of agile innovation: scrum's roles and sprints, the right conditions for agile, and what
      leaders must do for it to work.
    cases: []
    verify: false
  - slug: mgmt2094-collis-2016-lean-strategy
    title: Collis (2016), Lean Strategy
    kind: article
    text: >-
      Start-ups need both agility and direction: strategy without entrepreneurship is central planning, and
      entrepreneurship without strategy leads to chaos. Collis's lean strategy process integrates the bottom-up approach
      of the lean start-up with the top-down orientation of strategic management: a vision, a deliberate strategy
      (objective, scope and competitive advantage), and emergent strategy built from experiments that the strategy
      screens and evaluates. In an iterative fashion the venture builds new capabilities and revises its strategy in
      response to what it learns.
    gloss: >-
      The counterweight to the lean start-up in this unit: why experiments need strategic boundaries, and how strategy
      frames what is learned from them.
    cases: []
    verify: false
  - slug: mgmt2094-example-john-deere
    title: "Example: John Deere — agile starting small and spreading"
    kind: other
    text: >-
      George Tome began applying agile principles in John Deere's corporate IT group in 2004 on a low-key basis; over
      several years other software units followed, which made it easier to introduce agile to business development and
      marketing. In R&D's Enterprise Advanced Marketing unit, Tome found a coach who could work with people without a
      software background and published weekly one-page articles on agile. Innovation project cycle times fell, in some
      cases by more than 75% — a working prototype of a new machine form in about eight months, against a year and a
      half at best traditionally — and velocity rose on average by more than 200%.
    gloss: Illustrates 'start small and let the word spread', and the gains agile can bring outside IT.
    cases: []
    verify: false
  - slug: mgmt2094-example-spotify
    title: "Example: Spotify — squads that customise agile"
    kind: other
    text: >-
      Founded in 2006 and agile from birth, Spotify lets its 70 'squads' (agile innovation teams) and its 'chapters'
      (functional competencies such as user interface development and quality testing) vary their practices, as long as
      the changes are consistent with agile principles and can be shown to improve outcomes. Many squads omit burndown
      charts and do not always measure velocity; they have tested these modifications and found that they improve
      results.
    gloss: Illustrates allowing 'master' teams to customise their practices (shu-ha-ri) once they have mastered the basics.
    cases: []
    verify: false
  - slug: mgmt2094-example-openview-and-intronis
    title: "Example: OpenView Venture Partners and Intronis"
    kind: other
    text: >-
      OpenView's founder, Scott Maxwell, found that agile worked well for strategic planning and marketing, where
      complex problems can be broken into modules, but not for selling, where any sales call can change a
      representative's to-do list on the spot. He gave OpenView's portfolio companies agile training and let them decide
      whether to adopt it. Intronis, whose marketing had relied on an annual plan built around trade shows, adopted it
      under Richard Delahaye: the team learned to produce a topical webinar in a few days rather than several weeks, and
      a session on CryptoLocker malware drew 600 registrants, a company record.
    gloss: Illustrates where agile does and does not work, and enlisting willing adopters rather than coercing them.
    cases: []
    verify: false
  - slug: mgmt2094-example-systematic
    title: "Example: Systematic — an agile executive team"
    kind: other
    text: >-
      Systematic, a 525-employee software company, began applying agile in 2005. As it spread to all the software
      development teams, CEO Michael Holm worried that his management team was 'stuck doing things the same
      old-fashioned way', moving too slowly and relying on out-of-date written reports. In 2010 he ran his nine-member
      executive group as an agile team: it eliminated more than half of recurring reports, moved from weekly meetings to
      daily 20-minute stand-ups, and began tracking its actions on physical boards.
    gloss: Illustrates practising agile at the top so that leaders stop holding back the teams below them.
    cases: []
    verify: false
  - slug: mgmt2094-example-ge-digital
    title: "Example: GE Digital — scrum in the leadership team"
    kind: other
    text: >-
      In 2015 GE rebranded itself as a 'digital industrial company' and created GE Digital for all its 20,000-plus
      software-related employees. COO Brad Surak piloted scrum with a leadership team and then applied it to management
      processes such as operating reviews: Surak is the initiative owner and an engineering executive is the scrum
      master. The team runs two-week sprints, holds stand-ups three times a week and charts its progress on a board in
      an open conference room that any employee can see.
    gloss: >-
      Illustrates practising agile at the top, with scrum's roles at executive level: it 'takes the mystery out of what
      executives do every day'.
    cases: []
    verify: false
  - slug: mgmt2094-example-mission-bell-winery
    title: "Example: Mission Bell Winery — one backlog for the enterprise"
    kind: other
    text: >-
      Erik Martella, vice president and general manager of Mission Bell Winery (a production facility of Constellation
      Brands), pulled department leaders into an executive agile team focused on the enterprise initiatives of greatest
      value, such as increasing process flows through the warehouse. When a corporate superior suggested the winery
      explore a personal passion, Martella added the idea to the list of opportunities to be prioritised; it was
      assigned a low priority, and the executive readily accepted the decision.
    gloss: >-
      Illustrates agile at the top aligning departments on a common vision and protecting the organisation from pet
      projects.
    cases: []
    verify: false
  - slug: mgmt2094-example-financial-services-app-pilot
    title: "Example: a financial services company's agile app pilot"
    kind: other
    text: >-
      A large financial services company launched a pilot to build its next mobile app with agile methods. The team's
      funding first had to wait months for the annual planning process. The app customers praised then had to pass
      vulnerability testing in a traditional 'waterfall' process with a long queue, and be integrated into core IT
      systems through another waterfall process with a six-to-nine-month logjam. In the end, the total time to release
      improved very little.
    gloss: >-
      Illustrates why leaders must destroy the barriers to agile: every function has to work from the same list of
      priorities.
    cases: []
    verify: false
  - slug: mgmt2094-example-toyota
    title: "Example: Toyota — the lean roots of lean start-up"
    kind: other
    text: >-
      Under the heading 'Lean principles used in the concept lean start-up', the lecture slides pair a Toyota dashboard
      captioned 'Our MVP' with a Toyota production line. The slides' 'Agile & Lean' family tree circles Toyota's
      Production System and kanban (Taiichi Ohno; 1978 in Japanese, 1988 in English), in Japan's manufacturing industry,
      as the source of 'Lean', which flows into Eric Ries's Lean Startup (2011).
    gloss: "Illustrates where the lean start-up's lean principles come from: Japanese manufacturing."
    cases: []
    verify: false
  - slug: mgmt2094-example-tesla
    title: "Example: Tesla — innovation that needs long-term investment"
    kind: other
    text: >-
      The final lecture slide shows a Tesla with the caption 'Model 3: 2017 @35ks' and no commentary. Collis (2016)
      writes that businesses such as Tesla's lithium ion batteries would never have got off the ground had they been
      expected to demonstrate immediate success, and that truly novel products such as electric cars often involve
      building complete ecosystems and long-term investment.
    gloss: >-
      Used for Collis's point that some innovations cannot be judged by quick, cheap market tests; the lecture slide
      does not state its own point.
    cases: []
    verify: true
  - slug: mgmt2094-example-southwest-airlines
    title: "Example: Southwest Airlines — scope, advantage and emergent strategy"
    kind: other
    text: >-
      Southwest built its original low-cost strategy within a clearly defined scope: a dominant network of short-haul
      flights between second-tier airports, not competing head-to-head with the majors in big airports or on routes over
      a couple of hours, and no complex yield-management initiatives. A key advantage was rapid turnaround, so it chose
      not to provide meals. Employees suggested Business Select (a free drink and early boarding for a small premium),
      which was introduced because it would not interfere with fast gate turns; frontline staff also devised its
      boarding procedures.
    gloss: Illustrates deliberate strategy (scope and competitive advantage) screening emergent, frontline experiments.
    cases: []
    verify: false
  - slug: mgmt2094-example-instagram-burbn
    title: "Example: Instagram — from Burbn to photo sharing"
    kind: other
    text: >-
      Instagram's original strategy was Burbn, a private mobile app that let friends check in to locations, make plans,
      earn points for hanging out with friends, post pictures 'and much more'. When users reacted negatively to an app
      that could do all those things, the founders did not throw the baby out with the bathwater: noticing that users
      posted a lot of pictures, they focused on being really good at one thing, spending eight weeks developing a better
      photo-sharing app and running a beta test.
    gloss: >-
      Illustrates learning from experiments with a clear strategic perspective — a course correction to the hypotheses
      (a pivot) based on market learning.
    cases: []
    verify: false
  - slug: mgmt2094-example-groupon
    title: "Example: Groupon — quick traction, no lasting business"
    kind: other
    text: >-
      Groupon's innovative model of online coupons for local retailers and service providers quickly generated sales,
      but entry barriers were low and anyone could launch a similar site — and many did. Demand for the service proved
      transitory, customers found repeated use uneconomical, and no one has made any money in the business.
    gloss: >-
      Illustrates Collis's warning that a quick market test can validate an opportunity that cannot support a long-term
      business.
    cases: []
    verify: false
  - slug: mgmt2094-example-eleet
    title: "Example: Eleet — a strategic screen before testing"
    kind: other
    text: >-
      Eleet, a start-up in Providence, Rhode Island, provides chauffeurs to drive you in your own car. Its founders
      developed eight possible B2B and B2C use cases; before testing any of them, they analysed the target markets,
      judged a B2B version the most sustainable, set the B2C cases aside and ran tests that showed high-volume B2B users
      exist.
    gloss: Illustrates strategy helping a venture choose a viable opportunity before it spends on experiments.
    cases: []
    verify: false
  - slug: mgmt2094-example-nasty-gal
    title: "Example: Nasty Gal — losing focus"
    kind: other
    text: >-
      Sophia Amoruso built Nasty Gal by reselling vintage clothing on eBay, then diversified into designer clothing, a
      magazine, an autobiography and book tour, retail stores, international websites and branded products. With no
      clear focus, employees stumbled over one another competing for resources, growth stalled, and she stepped down as
      CEO in January 2015.
    gloss: Illustrates why a venture needs strategic bounds to stay focused on the prize.
    cases: []
    verify: false
  - slug: mgmt2094-example-muzzy-lane
    title: "Example: Muzzy Lane Software — aligning around the strategy"
    kind: other
    text: >-
      Muzzy Lane, an educational gaming company, had funded itself partly through work-for-hire one-off games: a single
      contract could cover its cash burn for several months. A clarified strategy focused it on educational publishers
      and on improving the authoring tools for its core platform, so staff were actively discouraged from seeking custom
      projects that would divert developers from that work.
    gloss: Illustrates strategy aligning the whole organisation behind its distinctive value proposition.
    cases: []
    verify: false
  - slug: mgmt2094-beck-et-al-2001-agile-manifesto
    title: Beck et al. (2001), Manifesto for Agile Software Development
    kind: article
    text: >-
      As quoted on the Week 10 tutor slides, the manifesto states four values: individuals and interactions over
      processes and tools; working software over comprehensive documentation; customer collaboration over contract
      negotiation; and responding to change over following a plan. The slides present it as the foundational statement
      (2001) of the values that Rigby, Sutherland and Takeuchi (2016) apply to organisational innovation.
    gloss: The original wording of the four agile values; the unit sets each beside Rigby et al.'s organisational practice.
    cases: []
    verify: false
  - slug: mgmt2094-schwaber-sutherland-2020-scrum-guide
    title: Schwaber and Sutherland (2020), The Scrum Guide
    kind: article
    text: >-
      As summarised on the Week 10 tutor slides, Scrum is one Agile framework that helps teams organise work into short,
      structured cycles called sprints: fixed-length cycles of one month or less in which a team works towards a Sprint
      Goal and produces a usable increment. It sets out key roles (Product Owner, Development Team, Scrum Master), the
      events of the sprint cycle (Sprint Planning, the Daily Scrum, the Sprint Review and the Sprint Retrospective) and
      key artifacts (Product Backlog, Sprint Backlog, Increment).
    gloss: >-
      The source of the tutorial's Scrum framework: who does what in a sprint, what happens when, and what the team
      produces.
    cases: []
    verify: false
  - slug: mgmt2094-example-uniconnect-challenge
    title: "Example: UniConnect — the tutorial's agile innovation challenge"
    kind: other
    text: >-
      A teaching case in the Week 10 tutorial, not a real company. UniConnect is a university-backed start-up developing
      a platform to help students connect with peers, find study partners and participate in campus activities. Groups
      act as its agile innovation team over three rounds: manage tasks (prioritise the product backlog and plan the
      first agile sprint), manage change (use customer feedback to revise priorities and plan the next experiment) and
      manage innovation (identify organisational barriers and recommend how managers can enable agile).
    gloss: >-
      Practises three levels of decision-making in managing innovation: tasks (value and capacity), change (test
      assumptions, adapt on evidence) and barriers (remove them, enable cross-functional collaboration).
    cases: []
    verify: false
questions:
  - key: q101
    type: mcq
    concept: agile-innovation
    difficulty: 1
    set: pretest
    stem: According to the lecture slides, where did agile innovation methods originate?
    options:
      - text: In the field of software development.
        correct: true
        why: >-
          Correct — slide 2 defines agile innovation as a term for a series of methods which originated in the field of
          software development.
      - text: In Japanese car manufacturing, on Toyota's production line.
        why: >-
          Tempting because the slides trace the 'lean' family to Toyota, but the definition of agile innovation places
          its origin in software development.
      - text: In design thinking workshops run by product designers.
        why: >-
          Tempting because agile uses design thinking as a creativity tool, but using a tool is not where the methods
          came from: they began in software development.
      - text: In military projects such as building new fighter jets.
        why: >-
          Tempting because the reading says Saab now uses agile for fighter jets, but that is a later adopter outside
          IT, not where the methods originated.
  - key: q102
    type: mcq
    concept: agile-innovation
    difficulty: 1
    stem: Which pair does the slide name as the two key roles within agile innovation?
    options:
      - text: The initiative owner and the backlog manager
        why: >-
          Tempting because the reading's initiative owner builds and ranks the backlog, but the slide's two key roles
          are the team leader and the process facilitator.
      - text: The team leader and the process facilitator
        correct: true
        why: "Correct — the slide lists two key roles within agile innovation: the team leader and the process facilitator."
      - text: The scrum master and the executive sponsor
        why: >-
          Tempting because a scrum master is the trained form of the process facilitator, but no executive sponsor
          appears among the two roles on the slide.
      - text: The product designer and the lead customer
        why: >-
          Tempting because agile collaborates with customers and uses design thinking, but neither a designer nor a
          customer is one of the two key roles the slide names.
  - key: q103
    type: mcq
    concept: agile-innovation
    difficulty: 2
    stem: Which description best matches what agile innovation involves, according to the slides?
    options:
      - text: >-
          A detailed plan fixed at the start, with each function finishing its own stage before passing the work on to
          the next
        why: >-
          Tempting because it sounds orderly, but this is the 'waterfall' approach agile was created to replace, not
          what agile involves.
      - text: Managers who assign every task and deadline, and review each decision a team makes
        why: >-
          Tempting because it sounds accountable, but this is command-and-control management; the slide says agile teams
          are self-managed.
      - text: Self-managed, high-intensity teams that prototype, test and learn rapidly, using tools like design thinking
        correct: true
        why: >-
          Correct — the slide lists high-intensity self-managed team work, rapid prototyping, testing and learning, and
          creativity tools such as design thinking.
      - text: Individuals working alone on ideas that are pooled and judged once a year
        why: >-
          Tempting because creativity can start with individuals, but the slide stresses high-intensity team work and
          rapid cycles, not annual pooling.
  - key: q104
    type: mcq
    concept: agile-innovation
    difficulty: 2
    stem: How do agile methods compare with traditional project management techniques, according to the slides?
    options:
      - text: They are more open-ended.
        correct: true
        why: Correct — the slide says agile methods are more open-ended than traditional project management techniques.
      - text: They are more tightly scheduled and controlled from above.
        why: >-
          Tempting because agile uses short time-boxed cycles, but the slide describes agile methods as more open-ended,
          and the teams as self-managed.
      - text: They are the same techniques, applied only to software.
        why: >-
          Tempting because agile began in software, but the slide contrasts agile with traditional techniques, and the
          reading shows it spreading well beyond software.
      - text: They replace teams with lone specialists in each function.
        why: >-
          Tempting because specialists matter, but agile relies on high-intensity, cross-functional team work rather
          than lone specialists.
  - key: q105
    type: mcq
    concept: agile-innovation
    difficulty: 2
    stem: The Agile Manifesto (2001) was written as an alternative to which approach?
    options:
      - text: Lean start-up, where new ventures test an MVP with early adopters and pivot or persevere before they scale
        why: >-
          Tempting because lean start-up is also iterative, but the slides date Ries's Lean Startup to 2011 — it builds
          on agile rather than being what agile replaced.
      - text: "'Waterfall' development, where detailed plans are made up front and passed from function to function"
        correct: true
        why: >-
          Correct — the reading says the developers met to improve on waterfall development, which worked in stable
          environments but not in fast-changing software markets.
      - text: Design thinking, where teams empathise with users before generating any ideas
        why: >-
          Tempting because the slides link agile and design thinking, but design thinking is a creativity tool agile
          uses, not the approach the manifesto rejected.
      - text: Kanban, where teams limit their work in process and cut lead times
        why: >-
          Tempting because kanban appears in the same reading, but kanban is one of the agile varieties, not the
          approach the manifesto was written against.
  - key: q106
    type: mcq
    concept: agile-innovation
    difficulty: 2
    stem: Which of these is one of the four agile values, as adapted in the reading?
    options:
      - text: Follow the plan rather than respond to every change
        why: >-
          Tempting because it sounds disciplined, but it reverses the agile value: respond to change rather than follow
          a plan.
      - text: Respond to change rather than follow a plan
        correct: true
        why: >-
          Correct — this is one of the four values: plan only tasks that will not have changed by the time you reach
          them, and welcome learning that alters direction.
      - text: Comprehensive documentation over working prototypes
        why: >-
          Tempting because documentation feels safe, but the manifesto values working prototypes over excessive
          documentation, not the reverse.
      - text: Rigid contracts over close customer collaboration
        why: >-
          Tempting because contracts reduce risk, but the manifesto values customer collaboration over rigid contracts,
          since customers seldom predict what they will want.
  - key: q107
    type: mcq
    concept: agile-innovation
    difficulty: 3
    stem: >-
      A bank's product team spends three months writing a 200-page specification instead of building anything customers
      could try. Which agile value does this most clearly break?
    options:
      - text: People over processes and tools
        why: >-
          Tempting because a long specification is a process, but the clearest breach is choosing documents over
          something customers can test — a prototype.
      - text: Working prototypes over excessive documentation
        correct: true
        why: >-
          Correct — the team chose excessive documentation over a working prototype that customers could try and react
          to.
      - text: Customer collaboration over rigid contracts
        why: >-
          Tempting because customers are absent, but nothing here is a contract; the failure is building documents
          rather than a testable prototype.
      - text: Respond to change rather than follow a plan
        why: >-
          Tempting because the specification is a plan, but the scenario turns on documentation replacing a prototype
          customers could try, which is a different value.
  - key: q108
    type: mcq
    concept: agile-innovation
    difficulty: 2
    stem: Rigby, Sutherland and Takeuchi say executives misread agile in two opposite ways. Which are they?
    options:
      - text: As anarchy, where everyone does what they want, or as 'doing what I say, only faster'
        correct: true
        why: >-
          Correct — the reading says some associate agile with anarchy while others take it to mean 'doing what I say,
          only faster'; agile is neither.
      - text: As a software tool the company buys, or as a training course that every manager finishes
        why: >-
          Tempting because agile does need training and sometimes new IT, but the reading names anarchy and "doing what
          I say, only faster" as the two misreadings.
      - text: As a cost-cutting program for IT, or as a new name for total quality management
        why: >-
          Tempting because agile reduces waste, but the reading does not frame either of these as the misreading; it
          names anarchy and faster obedience.
      - text: As suitable only for start-ups, or as suitable only for information technology
        why: >-
          Tempting because agile began in IT, but the two misreadings in the reading are about how agile works (anarchy,
          faster orders), not where it applies.
  - key: q109
    type: mcq
    concept: agile-innovation
    difficulty: 2
    stem: Which agile variety concentrates on reducing lead times and the amount of work in process?
    options:
      - text: Scrum
        why: >-
          Tempting because scrum is the most used agile variety, but the reading says scrum emphasises creative and
          adaptive teamwork in solving complex problems.
      - text: Kanban
        correct: true
        why: Correct — the reading says kanban concentrates on reducing lead times and the amount of work in process.
      - text: Lean development
        why: >-
          Tempting because cutting waste shortens lead times, but the reading says lean development focuses on the
          continual elimination of waste.
      - text: Design thinking
        why: >-
          Tempting because agile uses design thinking, but it is a creativity tool, not one of the agile varieties
          (scrum, lean development, kanban) the reading lists.
  - key: q110
    type: mcq
    concept: agile-innovation
    difficulty: 2
    variant-of: q109
    stem: Which agile variety does the reading say focuses on the continual elimination of waste?
    options:
      - text: Kanban
        why: >-
          Tempting because kanban boards make waste visible, but the reading says kanban concentrates on reducing lead
          times and work in process.
      - text: Scrum
        why: >-
          Tempting because scrum is the variety the reading illustrates, but scrum emphasises creative, adaptive
          teamwork on complex problems.
      - text: Lean development
        correct: true
        why: Correct — the reading says lean development focuses on the continual elimination of waste.
      - text: Extreme programming
        why: >-
          Tempting because it appears in the slide's agile family tree, but the reading gives it no focus; the continual
          elimination of waste is lean development.
  - key: q111
    type: mcq
    concept: agile-innovation
    difficulty: 3
    contrasts-with:
      - lean-start-up
    stem: "A classmate says: 'Lean development and lean start-up are the same thing.' What is the best correction?"
    options:
      - text: Lean start-up came first, and lean development was later invented to apply it to software teams
        why: >-
          Tempting because both use 'lean', but the slide's family tree dates lean software development to 2003 and
          Ries's Lean Startup to 2011.
      - text: Both are names for the kanban board, where sticky notes move from to-do to doing to done
        why: >-
          Tempting because both appear near kanban, but a kanban board is a tool for showing progress, not either of
          these two ideas.
      - text: Lean development is an agile variety that cuts waste; lean start-up tests a venture’s hypotheses with an MVP
        correct: true
        why: >-
          Correct — the reading lists lean development as an agile variety focused on eliminating waste; the slides
          present lean start-up as Blank and Ries’s MVP-led approach.
      - text: Lean development applies only to factory production lines, while lean start-up applies only to software firms
        why: >-
          Tempting because lean began in Toyota’s factories, but the reading treats lean development as an agile method
          for innovation, and lean start-up is about ventures, not software alone.
  - key: q112
    type: mcq
    concept: agile-innovation
    difficulty: 1
    stem: What does the reading say agile puts people into, in place of their functional silos?
    options:
      - text: A central project office that hands tasks to specialists
        why: >-
          Tempting because it sounds coordinated, but a central office assigning tasks is the command-and-control model
          agile is an alternative to.
      - text: Self-managed, customer-focused multidisciplinary teams
        correct: true
        why: >-
          Correct — the reading says agile takes people out of functional silos and puts them in self-managed,
          customer-focused multidisciplinary teams.
      - text: Separate innovation labs staffed by outside consultants
        why: >-
          Tempting because innovation labs are common, but the reading describes teams drawn from the business itself,
          not outside consultants.
      - text: Individual roles rewarded for their own personal output
        why: >-
          Tempting because rewards drive effort, but the reading says agile weights team results above individual
          efforts.
  - key: q113
    type: mcq
    concept: agile-innovation
    difficulty: 3
    stem: Which executive behaviour does the reading say undermines agile teams?
    options:
      - text: Giving the highest priority to just two or three initiatives
        why: >-
          Tempting because it sounds restrictive, but the reading criticises the opposite — launching countless
          initiatives instead of prioritising two or three.
      - text: Routinely overturning team decisions and adding review layers and controls
        correct: true
        why: >-
          Correct — the reading says such executives routinely overturn team decisions and add review layers and
          controls, eroding agile’s benefits.
      - text: Letting the team settle disagreements by experiment
        why: >-
          Tempting if experiments seem slow, but resolving disagreements through experimentation and feedback is an
          agile practice, not a problem.
      - text: Asking the team 'How could we test that?' rather than giving it orders to follow
        why: >-
          Tempting because it sounds hands-off, but leading with questions rather than orders is one of the techniques
          the reading recommends.
  - key: q114
    type: match
    concept: agile-innovation
    difficulty: 2
    prompt: Match each agile value (as adapted in the reading) to what it is valued over.
    pairs:
      - left: People
        right: over processes and tools
      - left: Responding to change
        right: over following a plan
      - left: Working prototypes
        right: over excessive documentation
      - left: Customer collaboration
        right: over rigid contracts
  - key: q115
    type: mcq
    concept: agile-innovation
    difficulty: 3
    stem: According to the reading's sidebar, why did waterfall development struggle in software?
    options:
      - text: Software teams were too small to divide work between functions
        why: >-
          Tempting because waterfall passes work between functions, but the reading blames fast-changing markets, not
          team size.
      - text: Customers refused to sign contracts for software they had not seen
        why: >-
          Tempting because the manifesto values collaboration over contracts, but the problem the reading names is
          specifications going out of date.
      - text: Markets changed rapidly and unpredictably, so specifications were outdated by delivery
        correct: true
        why: >-
          Correct — the reading says waterfall worked in stable environments, but in fast-changing markets
          specifications were outdated by the time the software was delivered.
      - text: Regulators required working prototypes to be tested before any documentation was written
        why: >-
          Tempting because prototypes matter in agile, but no regulator appears in the reading; the problem was change
          outpacing up-front plans.
  - key: q116
    type: mcq
    concept: agile-innovation
    difficulty: 1
    stem: Which creativity tool do the slides say agile innovation uses?
    options:
      - text: Design thinking
        correct: true
        why: Correct — the slide says agile innovation uses creativity tools such as design thinking.
      - text: Six thinking hats
        why: >-
          Tempting because it is a creativity tool taught earlier in the unit, but the agile slide names design
          thinking, not the thinking hats.
      - text: Mind mapping
        why: >-
          Tempting because mind mapping is another creativity tool from earlier in the unit, but the slide names design
          thinking as the tool agile uses.
      - text: Brainwalking
        why: >-
          Tempting because brainwalking is a group idea technique from earlier in the unit, but the agile slide names
          design thinking.
  - key: q117
    type: mcq
    concept: agile-innovation
    difficulty: 2
    stem: According to the reading, who wrote the Agile Manifesto, and when?
    options:
      - text: Seventeen software developers who met in Snowbird, Utah, in 2001
        correct: true
        why: >-
          Correct — the reading says 17 rebellious software developers, including Jeff Sutherland, met in Snowbird,
          Utah, in 2001.
      - text: Eric Ries and Steve Blank, when they launched the lean start-up in 2011
        why: >-
          Tempting because they are this week’s other big names, but the slides date the Lean Startup to 2011, a decade
          after the manifesto.
      - text: Toyota engineers led by Taiichi Ohno, writing in Japan in 1978
        why: >-
          Tempting because the slides credit Ohno with the Toyota Production System (1978), but that is the root of
          lean, not the agile manifesto.
      - text: Hirotaka Takeuchi and Ikujiro Nonaka, in their article of 1986
        why: >-
          Tempting because their 1986 article inspired scrum, but it was 'The New New Product Development Game', not the
          2001 manifesto.
  - key: q190
    type: truefalse
    concept: agile-innovation
    difficulty: 1
    set: quickfire
    statement: Agile innovation methods originated in the field of software development.
    answer: true
    why: >-
      True — the slide defines agile innovation as a series of methods which originated in the field of software
      development, now spreading well beyond it.
  - key: q191
    type: truefalse
    concept: agile-innovation
    difficulty: 1
    set: quickfire
    statement: The slides say agile methods are less open-ended than traditional project management techniques.
    answer: false
    why: >-
      False — the slide says agile methods are MORE open-ended than traditional project management techniques, with
      self-managed teams.
  - key: q192
    type: truefalse
    concept: agile-innovation
    difficulty: 1
    set: quickfire
    statement: The Agile Manifesto values working prototypes over excessive documentation.
    answer: true
    why: >-
      True — working prototypes over excessive documentation is one of the four values: innovators who see results in
      real market conditions learn faster.
  - key: q201
    type: mcq
    concept: scrum-in-practice
    difficulty: 1
    stem: How large is a scrum team usually, according to Rigby, Sutherland and Takeuchi?
    options:
      - text: Three to nine people, most of them assigned full-time
        correct: true
        why: >-
          Correct — the reading says the organisation forms a small team, usually three to nine people, most of whom are
          assigned full-time.
      - text: Fifteen to twenty people, drawn part-time from every function
        why: >-
          Tempting because the team is cross-functional, but the reading says small and mostly full-time, and warns
          against part-time assignment.
      - text: One expert per function, each with their own manager
        why: >-
          Tempting because the team needs every skill, but a scrum team manages itself rather than having a manager per
          function.
      - text: As many people as the project budget allows
        why: Tempting because bigger budgets buy more people, but the reading fixes a small team of usually three to nine.
  - key: q202
    type: mcq
    concept: scrum-in-practice
    difficulty: 1
    stem: In scrum, who is ultimately responsible for delivering value to customers and to the business?
    options:
      - text: The process facilitator (scrum master)
        why: >-
          Tempting because the facilitator guides the process, but the facilitator protects the team; delivering value
          is the initiative owner’s responsibility.
      - text: The senior executive who sponsors the project
        why: >-
          Tempting because sponsors care about value, but the reading places this responsibility on the initiative owner
          within the scrum.
      - text: The initiative owner (product owner)
        correct: true
        why: >-
          Correct — the reading says the initiative owner, also known as the product owner, is ultimately responsible
          for delivering value to customers and the business.
      - text: Each team member, for their own tasks
        why: >-
          Tempting because the team is accountable for the work, but responsibility for delivering value sits with the
          initiative owner.
  - key: q203
    type: mcq
    concept: scrum-in-practice
    difficulty: 2
    stem: What does the process facilitator (often a trained scrum master) do?
    options:
      - text: Ranks the portfolio backlog by its value to customers and the company
        why: >-
          Tempting because someone must rank the backlog, but that is the initiative owner’s job; the facilitator guides
          the process.
      - text: Tells each member what to do and how long each task should take
        why: >-
          Tempting because facilitators run meetings, but the reading says no one tells the team this — the team decides
          how to accomplish the work.
      - text: Guides the process and protects the team from distractions
        correct: true
        why: >-
          Correct — the reading says the process facilitator guides the process, protects the team from distractions and
          helps it put its collective intelligence to work.
      - text: Signs off every prototype before any customer may see it
        why: >-
          Tempting because quality matters, but the reading says customers test small prototypes directly, and an
          exciting one may be released at once.
  - key: q204
    type: mcq
    concept: scrum-in-practice
    difficulty: 2
    stem: In scrum, what is a sprint?
    options:
      - text: A daily meeting of a few minutes to review progress and roadblocks
        why: >-
          Tempting because it is short, but this is the daily stand-up; a sprint is the build cycle of less than a
          month.
      - text: A short build cycle, of less than a month, producing a working version
        correct: true
        why: >-
          Correct — the reading says the team builds working versions of the product in short cycles (less than a month)
          known as sprints.
      - text: The ranked list of promising opportunities that the owner maintains
        why: Tempting because sprints draw on it, but this is the portfolio backlog, not a sprint.
      - text: A final push to finish the whole product before launch, often with long overtime
        why: >-
          Tempting from the everyday meaning of sprint, but agile values a sustainable pace; a sprint is a regular short
          build cycle.
  - key: q205
    type: mcq
    concept: scrum-in-practice
    difficulty: 2
    stem: What is the 'portfolio backlog' in scrum?
    options:
      - text: A ranked list of promising opportunities, kept by the initiative owner
        correct: true
        why: >-
          Correct — the reading says the initiative owner builds a portfolio backlog of promising opportunities and
          continually and ruthlessly rank-orders it.
      - text: A record of the unfinished tasks carried over from sprints that ran late
        why: >-
          Tempting from the everyday meaning of backlog, but in the reading it is a ranked list of promising
          opportunities, not overdue work.
      - text: A file of customer complaints that are waiting for a reply
        why: >-
          Tempting because customers shape priorities, but the backlog is a list of opportunities ranked by value, not a
          complaints queue.
      - text: A list of everything that went wrong in the previous sprint
        why: >-
          Tempting because teams do review each cycle, but that review is about improving future cycles; the backlog
          ranks opportunities.
  - key: q206
    type: mcq
    concept: scrum-in-practice
    difficulty: 2
    stem: How does a scrum team resolve disagreements, according to the reading?
    options:
      - text: By appeal to the initiative owner’s authority
        why: >-
          Tempting because the owner ranks the work, but the reading says disagreements are not settled by appeals to
          authority.
      - text: Through experimentation and feedback
        correct: true
        why: >-
          Correct — the reading says team members resolve disagreements through experimentation and feedback rather than
          endless debates or appeals to authority.
      - text: By a team vote after a full debate
        why: >-
          Tempting because it sounds democratic, but the reading rejects endless debates in favour of experiments and
          feedback.
      - text: By the senior executive at the next review
        why: >-
          Tempting because executives often arbitrate, but the reading criticises executives who overturn team
          decisions.
  - key: q207
    type: mcq
    concept: scrum-in-practice
    difficulty: 3
    stem: >-
      An initiative owner tells developers exactly who should build which feature and sets each a deadline. What does
      the reading say?
    options:
      - text: That is correct, because the owner is accountable for value and so must allocate the tasks
        why: >-
          Tempting because the owner is accountable for value, but the reading says the owner does not tell the team who
          should do what or how long tasks take.
      - text: That is the process facilitator’s job, so the owner should hand it over
        why: >-
          Tempting because the facilitator guides process, but the reading gives neither role this power — the team
          decides how to do the work.
      - text: "That is not the owner’s role: the team decides how much work to take on and how to do it"
        correct: true
        why: >-
          Correct — the reading says the initiative owner doesn’t tell the team who should do what or how long tasks
          will take; the team decides.
      - text: That is acceptable only in the first sprint, until the team settles in
        why: >-
          Tempting as a compromise, but the reading makes no first-sprint exception: the team is self-managing from the
          start.
  - key: q208
    type: mcq
    concept: scrum-in-practice
    difficulty: 2
    stem: What are scrum's brief daily 'stand-up' meetings for?
    options:
      - text: To review progress and identify roadblocks
        correct: true
        why: >-
          Correct — the reading says team members hold brief daily stand-up meetings to review progress and identify
          roadblocks.
      - text: To rank the backlog and approve the sprint budget
        why: >-
          Tempting because both are planning tasks, but ranking the backlog is the initiative owner’s continuing job,
          not the stand-up’s.
      - text: To present the finished product to senior executives
        why: >-
          Tempting because the process is transparent, but stand-ups are short team check-ins, not executive
          presentations.
      - text: To decide which members to replace on the team
        why: >-
          Tempting because the team manages itself, but stand-ups review progress; the reading says stable teams
          outperform rotating ones.
  - key: q209
    type: mcq
    concept: scrum-in-practice
    difficulty: 3
    stem: >-
      A team tests a small prototype with a few customers, who get excited, but a senior executive says it needs more
      bells and whistles. What does the reading say may happen?
    options:
      - text: The team must add the features the executive asked for before release
        why: >-
          Tempting because executives have authority, but the reading says an exciting prototype may be released even if
          a senior executive isn’t a fan.
      - text: The prototype may be released immediately
        correct: true
        why: >-
          Correct — the reading says if customers get excited, a prototype may be released immediately, even if a senior
          executive isn’t a fan.
      - text: The prototype returns to the backlog to be ranked again later
        why: >-
          Tempting because the backlog sets priorities, but the reading lets customer excitement trigger immediate
          release.
      - text: The process facilitator decides between the customers and the executive
        why: >-
          Tempting because the facilitator guides the process, but the reading lets customer response decide, not the
          facilitator.
  - key: q210
    type: mcq
    concept: scrum-in-practice
    difficulty: 2
    stem: What does a scrum team do before it attacks the next top priority?
    options:
      - text: It writes a full written report for a review board
        why: >-
          Tempting because reviews are common, but agile values working prototypes over excessive documentation; no
          review board appears in the reading.
      - text: It rotates members so skills spread across the business
        why: >-
          Tempting because it sounds like learning, but the reading says stable teams are 60% more productive than teams
          that rotate members.
      - text: It brainstorms ways to improve future cycles
        correct: true
        why: >-
          Correct — the reading says the team then brainstorms ways to improve future cycles and prepares to attack the
          next top priority.
      - text: It re-plans every activity for the rest of the year
        why: >-
          Tempting because planning seems prudent, but the reading says the team plans in detail only activities that
          won’t change before execution.
  - key: q211
    type: mcq
    concept: scrum-in-practice
    difficulty: 3
    contrasts-with:
      - build-measure-learn
    stem: Which statement correctly distinguishes a scrum sprint from the lean start-up's build–measure–learn loop?
    options:
      - text: A sprint tests a business hypothesis with early adopters; build–measure–learn is a daily meeting
        why: >-
          Tempting because both involve testing, but this swaps them around and confuses the loop with a stand-up
          meeting.
      - text: They are one cycle under two names, and both always last less than a month
        why: >-
          Tempting because both are short iterative cycles, but they answer different questions: how a team builds, and
          whether a venture’s hypotheses hold.
      - text: >-
          A sprint is a scrum team’s build cycle of under a month; build–measure–learn tests a venture’s hypotheses and
          ends in pivot or persevere
        correct: true
        why: >-
          Correct — the reading defines sprints as short build cycles of a scrum team; the slides’ build–measure–learn
          loop tests hypotheses and ends with pivot or persevere.
      - text: A sprint is run by the initiative owner alone; build–measure–learn needs a scrum master
        why: >-
          Tempting because roles differ, but a sprint is the self-managing team’s cycle, and the slides attach no scrum
          master to the lean start-up loop.
  - key: q212
    type: mcq
    concept: scrum-in-practice
    difficulty: 2
    stem: Which activities does a scrum team plan in detail?
    options:
      - text: Every task for the whole project, before the first sprint
        why: >-
          Tempting because detailed planning feels safe, but that is the waterfall habit; agile plans in detail only
          what won’t change.
      - text: Only those activities that won’t change before execution
        correct: true
        why: >-
          Correct — the reading says the team creates a simple road map and plans in detail only those activities that
          won’t change before execution.
      - text: Only the budget, leaving the work itself unplanned
        why: Tempting because agile is open-ended, but the team still plans; it plans the stable near-term work in detail.
      - text: Nothing at all, because agile teams never plan
        why: >-
          Tempting given ‘respond to change’, but the reading says teams should create a vision and plan — just not plan
          what will change.
  - key: q213
    type: mcq
    concept: scrum-in-practice
    difficulty: 2
    stem: Why does the reading use scrum to illustrate agile practices?
    options:
      - text: Scrum is the only agile variety that has been shown to work outside the IT function
        why: >-
          Tempting because scrum is widely used outside IT, but the reading’s reason is how often it is used, not that
          other varieties fail.
      - text: Scrum and its derivatives are used at least five times as often as the others
        correct: true
        why: >-
          Correct — the reading says scrum and its derivatives are employed at least five times as often as the other
          techniques.
      - text: Scrum is the oldest agile method, going back to Toyota
        why: >-
          Tempting because the slides trace lean to Toyota, but scrum grew from the 1986 article The New New Product
          Development Game.
      - text: Scrum is required by the Agile Manifesto
        why: Tempting because both come from software, but the manifesto sets values; it does not require any one method.
  - key: q214
    type: mcq
    concept: scrum-in-practice
    difficulty: 2
    stem: What does 'cross-functional' mean for a scrum team?
    options:
      - text: The team includes all the skills necessary to complete its tasks
        correct: true
        why: >-
          Correct — the reading says the team is cross-functional and includes all the skills necessary to complete its
          tasks.
      - text: Members rotate between functions at the end of each sprint
        why: >-
          Tempting because it sounds like crossing functions, but the reading warns against rotating membership: stable
          teams do better.
      - text: Each member reports to a different functional manager for decisions
        why: >-
          Tempting because members come from different functions, but the reading says each decision needs only one
          boss.
      - text: The team works across several different projects at once
        why: Tempting because it sounds flexible, but the reading criticises spreading people across too many projects.
  - key: q215
    type: mcq
    concept: scrum-in-practice
    difficulty: 3
    stem: >-
      A team keeps its progress visible by moving sticky notes from 'to-do' to 'doing' to 'done' on a whiteboard. What
      does the reading call this board?
    options:
      - text: A burndown chart
        why: >-
          Tempting because it also tracks progress, but a burndown chart shows work performed and work remaining; the
          sticky-note board is a kanban board.
      - text: A portfolio backlog
        why: >-
          Tempting because the board holds tasks, but the backlog is the owner’s ranked list of opportunities, not a
          progress board.
      - text: A kanban board
        correct: true
        why: >-
          Correct — the reading says moving sticky notes from to-do to doing to done on large whiteboards is known as a
          kanban board.
      - text: An innovation accounting report
        why: >-
          Tempting because it records work, but the innovation accounting report on the slides records a lean start-up
          experiment, not team progress.
  - key: q216
    type: mcq
    concept: scrum-in-practice
    difficulty: 2
    stem: Which is one of the benefits of agile that the reading says has been studied and documented?
    options:
      - text: It guarantees that every project finishes within its original budget
        why: >-
          Tempting because agile reduces waste, but the reading claims no guarantee about budgets; it says agile reduces
          risk and speeds delivery.
      - text: It removes the need for customers to be involved in development
        why: Tempting because teams are self-managed, but agile depends on close customer collaboration and rapid feedback.
      - text: It minimises waste from redundant meetings, repetitive planning and excessive documentation
        correct: true
        why: >-
          Correct — the reading lists minimising the waste in redundant meetings, repetitive planning, excessive
          documentation, defects and low-value features.
      - text: It lets senior managers supervise each team more closely than they could under the old approach
        why: >-
          Tempting because visibility improves, but the reading says agile frees senior managers from micromanaging for
          higher-value work.
  - key: q290
    type: truefalse
    concept: scrum-in-practice
    difficulty: 1
    set: quickfire
    statement: In scrum, the initiative owner tells the team who should do what and how long tasks will take.
    answer: false
    why: >-
      False — the reading says the initiative owner doesn’t tell the team who should do what or how long tasks will
      take; the self-managing team decides.
  - key: q291
    type: truefalse
    concept: scrum-in-practice
    difficulty: 1
    set: quickfire
    statement: Scrum sprints are short cycles of less than a month in which the team builds working versions of the product.
    answer: true
    why: >-
      True — the reading defines sprints as short cycles (less than a month) in which the team builds working versions
      of the product.
  - key: q292
    type: truefalse
    concept: scrum-in-practice
    difficulty: 1
    set: quickfire
    statement: The process facilitator protects the scrum team from distractions.
    answer: true
    why: >-
      True — the process facilitator, often a trained scrum master, guides the process and protects the team from
      distractions.
  - key: q293
    type: short
    concept: scrum-in-practice
    difficulty: 3
    prompt: >-
      'Scrum is just a way for managers to get their orders carried out faster.' Discuss, applying scrum to a university
      student-services office that wants to redesign how it helps students with enrolment problems, and use a real
      example from the materials.
    model: >-
      The statement misreads scrum: Rigby, Sutherland and Takeuchi say agile is neither anarchy nor 'doing what I say,

      only faster'. Scrum, the most used agile variety, would form a small team of three to nine people, mostly
      full-time and

      cross-functional, with every skill needed, managing itself. An initiative

      owner, ultimately responsible for value to students and the university, would build a portfolio backlog and
      ruthlessly rank it, without telling the team who does what. A process

      facilitator would guide the process and protect the team from distractions. The team would plan in detail only
      work

      that won't change, build working versions in sprints of under a month, hold brief daily stand-ups, and test small

      prototypes — a new help page, a chat queue — with a few students, releasing what excites them. GE Digital shows
      the

      roles working at leadership level: Surak as initiative owner, an engineering executive as scrum master, two-week

      sprints and a public progress board. The statement is right only about speed; managers do not give the

      orders. Its limit is the conditions: routine, rule-bound enrolment work suits agile less, and managers who
      overturn

      team decisions would undermine it.
    rubric:
      - id: r1
        criterion: Concept — explains scrum’s team, roles and sprint cycle accurately.
        marks: 3
        top-band: >-
          Names the small cross-functional self-managing team, the initiative owner and backlog, the process
          facilitator, and sprints under a month.
        margin-note: Who ranks the work, and who protects the process?
        authorities:
          - mgmt2094-rigby-sutherland-takeuchi-2016-embracing-agile
      - id: r2
        criterion: Example — uses a real example from the materials.
        marks: 2
        top-band: Uses GE Digital (or another reading example) with accurate details of roles and rhythm.
        margin-note: Which organisation in the reading ran scrum this way?
        authorities:
          - mgmt2094-example-ge-digital
      - id: r3
        criterion: Application — applies scrum to the enrolment scenario.
        marks: 3
        top-band: Gives a concrete team, backlog items, a sprint and a prototype tested with a few students.
        margin-note: Make it about enrolment help, not scrum in general.
        authorities: []
      - id: r4
        criterion: Evaluation — weighs a risk or limit.
        marks: 2
        top-band: Identifies a real limit (routine work, executive interference) and why it matters here.
        margin-note: When would scrum not suit this office?
        authorities:
          - mgmt2094-rigby-sutherland-takeuchi-2016-embracing-agile
  - key: q301
    type: mcq
    concept: conditions-for-agile
    difficulty: 1
    set: pretest
    stem: Under which condition does the reading say agile is most effective?
    options:
      - text: When similar work has been done before and the solutions are clear
        why: >-
          Tempting because familiar work feels easy to manage, but the reading lists this as unfavourable to agile — a
          detailed plan suits it better.
      - text: When the problem is complex and solutions are initially unknown
        correct: true
        why: >-
          Correct — the reading says agile is most effective where the problem is complex and solutions are initially
          unknown, as in software innovation.
      - text: When requirements are clear at the outset and will remain stable
        why: >-
          Tempting because clear requirements reduce risk, but stable, clear requirements are an unfavourable condition
          for agile in the exhibit.
      - text: When customers cannot test anything until the whole product is done
        why: >-
          Tempting because it sounds like a big project, but this is the unfavourable side of modularity: agile needs
          parts customers can use.
  - key: q302
    type: mcq
    concept: conditions-for-agile
    difficulty: 2
    stem: >-
      In the exhibit 'The Right Conditions for Agile', what is the favourable condition for the impact of interim
      mistakes?
    options:
      - text: They may be catastrophic
        why: >-
          Tempting because it is the other entry in the same row, but catastrophic interim mistakes are the unfavourable
          condition for agile.
      - text: They provide valuable learning
        correct: true
        why: Correct — the exhibit says agile is favoured when interim mistakes provide valuable learning.
      - text: They are rare, because the plan is fixed in advance
        why: Tempting because fixed plans aim to prevent mistakes, but a fixed plan is the unfavourable, non-agile setting.
      - text: They are hidden from customers until the product launches
        why: >-
          Tempting because it protects the brand, but agile tests early with customers; hiding mistakes is not the
          favourable condition.
  - key: q303
    type: mcq
    concept: conditions-for-agile
    difficulty: 2
    stem: Which activity does the reading say is LESS likely to have the conditions agile needs?
    options:
      - text: Product development
        why: >-
          Tempting because products can be routine too, but the reading says the conditions exist for many product
          development functions.
      - text: Plant maintenance
        correct: true
        why: >-
          Correct — the reading says the conditions are less common in routine operations such as plant maintenance,
          purchasing, sales calls and accounting.
      - text: Marketing projects
        why: >-
          Tempting because marketing has deadlines, but the reading lists marketing projects among the activities where
          agile conditions exist.
      - text: Strategic planning
        why: >-
          Tempting because strategy feels top-down, but the reading lists strategic-planning activities among those that
          suit agile.
  - key: q304
    type: mcq
    concept: conditions-for-agile
    difficulty: 3
    stem: At OpenView Venture Partners, why did agile not suit selling?
    options:
      - text: >-
          Any sales call can change a rep's to-do list on the spot, so regrouping the team and backlog hourly is
          impractical
        correct: true
        why: >-
          Correct — the reading says it would be too complicated and time-consuming to reassemble the sales team, change
          the backlog and reassign accounts every hour.
      - text: Sales representatives would not attend the agile training that the firm offered to its staff
        why: >-
          Tempting because the reading stresses eager participants, but the reason given for selling is how fast each
          call changes the work.
      - text: Selling has no customers for a team to collaborate with or get rapid feedback from
        why: >-
          Tempting because the exhibit asks about customer involvement, but selling is full of customers; the problem is
          the pace of change in each rep’s list.
      - text: Sales work is too creative and open-ended to be broken into modules for sprints
        why: >-
          Tempting because agile needs modular work, but the reading says complex creative work suits agile; selling
          failed because calls rewrite plans hourly.
  - key: q305
    type: mcq
    concept: conditions-for-agile
    difficulty: 3
    stem: >-
      A firm must build a bridge to a fixed engineering specification. Customers cannot use any part until it is
      finished, and a mid-build error could be catastrophic. What does the exhibit suggest?
    options:
      - text: Agile fits, because large engineering problems are always complex
        why: >-
          Tempting because the project is big, but the exhibit looks at modularity and the impact of mistakes, and both
          point away from agile here.
      - text: "Unfavourable: the work isn’t modular and interim mistakes may be catastrophic"
        correct: true
        why: >-
          Correct — customers cannot test parts until everything is complete, late changes are costly, and interim
          mistakes may be catastrophic: all unfavourable.
      - text: Agile fits, because customers will know better what they want as work progresses
        why: >-
          Tempting because that is a favourable condition, but the specification is fixed, so this condition is absent
          here.
      - text: Agile fits, provided the team is small, cross-functional and self-managed from the start
        why: >-
          Tempting because that is how scrum teams are built, but team design cannot change the project’s conditions,
          which are unfavourable.
  - key: q306
    type: mcq
    concept: conditions-for-agile
    difficulty: 3
    variant-of: q305
    stem: >-
      A marketing team produces webinars on fast-changing cyber threats. Each webinar is useful on its own, and
      customers give feedback after each one. What does the exhibit suggest?
    options:
      - text: "Unfavourable: marketing is a routine operation like accounting"
        why: >-
          Tempting because marketing recurs, but the reading lists marketing projects where agile conditions exist;
          routine operations are things like accounting.
      - text: "Unfavourable: webinars cannot be tested until the series ends"
        why: >-
          Tempting if you picture a fixed series, but each webinar is usable on its own, which is the favourable side of
          modularity.
      - text: "Favourable: the market changes often, the work is modular and feedback is rapid"
        correct: true
        why: >-
          Correct — changing preferences, usable increments and rapid feedback are favourable conditions, as Intronis
          found with its CryptoLocker webinar.
      - text: Favourable only if the team first writes a full annual marketing plan around trade shows
        why: >-
          Tempting because Intronis once had an annual plan, but agile replaced that plan; the conditions here already
          favour agile.
  - key: q307
    type: mcq
    concept: conditions-for-agile
    difficulty: 2
    stem: What does the reading say agile innovation depends on, in terms of people?
    options:
      - text: A cadre of eager participants
        correct: true
        why: >-
          Correct — the reading says agile depends on having a cadre of eager participants, built around motivated
          individuals.
      - text: Senior executives trained as scrum masters
        why: >-
          Tempting because leaders need to learn agile, but the dependency the reading names is eager participants, not
          executive certification.
      - text: Software engineers placed in every function
        why: >-
          Tempting because agile began in software, but John Deere found a coach for people without a software
          background — engineers are not required.
      - text: Compulsory participation by every employee
        why: >-
          Tempting because full adoption sounds faster, but the reading prefers passionate volunteers to coerced
          resisters.
  - key: q308
    type: mcq
    concept: conditions-for-agile
    difficulty: 3
    stem: Some staff resist adopting agile. Which approach does the reading prefer?
    options:
      - text: Coerce the resisters first, because agile only works if everyone adopts it on the very same day
        why: >-
          Tempting because consistency matters, but the reading says it is better to enlist passionate volunteers than
          to coerce resisters.
      - text: Enlist passionate volunteers rather than coerce resisters (leaders may press holdouts later)
        correct: true
        why: >-
          Correct — the reading prefers volunteers, adding that once most have adopted agile, leaders may need to press
          or even replace holdouts.
      - text: Exempt resisters permanently and run two separate systems side by side for good
        why: >-
          Tempting as a compromise, but the reading warns about tension between agile teams and the rest; it does not
          recommend a permanent split.
      - text: Delay agile until every employee agrees to it, however long that takes
        why: >-
          Tempting because consensus feels fair, but the reading says to start small with eager participants, not wait
          for unanimity.
  - key: q309
    type: mcq
    concept: conditions-for-agile
    difficulty: 2
    stem: Why must executives decide whether the payoffs justify a transition to agile, according to the reading?
    options:
      - text: Agile always costs more than it returns in its first year
        why: >-
          Tempting because transitions cost money, but the reading makes no such claim; it says the effort and expense
          must be weighed.
      - text: Agile requires training, behavioural change and often new information technologies
        correct: true
        why: >-
          Correct — the reading says because agile requires training, behavioural change and often new IT, executives
          must weigh payoffs against effort and expense.
      - text: Agile requires changing the organisational structure first
        why: >-
          Tempting because new teams sound like restructuring, but the reading says don’t change structures right away;
          change roles instead.
      - text: Agile can only be introduced with outside consultants
        why: >-
          Tempting because John Deere used a coach, but the reading’s reason is training, behaviour change and IT, not
          compulsory consultants.
  - key: q310
    type: mcq
    concept: conditions-for-agile
    difficulty: 2
    stem: Which is an UNFAVOURABLE condition under 'customer involvement' in the exhibit?
    options:
      - text: Close collaboration and rapid feedback are feasible
        why: Tempting because it sits in the same row, but this is the favourable condition for customer involvement.
      - text: Requirements are clear at the outset and will remain stable
        correct: true
        why: >-
          Correct — the exhibit lists clear, stable requirements (and customers unavailable for constant collaboration)
          as unfavourable for agile.
      - text: Customers know better what they want as the process goes on
        why: >-
          Tempting because it suggests uncertainty, but this is a favourable condition: agile lets specifications evolve
          as customers learn.
      - text: Customers can use parts of the product as they are finished
        why: >-
          Tempting because it involves customers, but this belongs to modularity of work, and it is favourable rather
          than unfavourable.
  - key: q311
    type: mcq
    concept: conditions-for-agile
    difficulty: 2
    stem: Under 'innovation type', which describes UNFAVOURABLE conditions for agile?
    options:
      - text: Problems are complex, solutions are unknown and the scope isn’t clearly defined
        why: Tempting because it sounds risky, but uncertainty of this kind is exactly the favourable condition for agile.
      - text: Creative breakthroughs and time to market are important
        why: >-
          Tempting because speed pressure can push teams to cut corners, but the exhibit lists this as favourable to
          agile.
      - text: Similar work has been done before, and plans can be forecast with confidence
        correct: true
        why: >-
          Correct — the exhibit lists familiar work with clear solutions and confident forecasts as unfavourable: a
          detailed plan should be followed.
      - text: Cross-functional collaboration is vital
        why: >-
          Tempting because collaboration is hard to arrange, but the exhibit lists vital cross-functional collaboration
          as favourable to agile.
  - key: q312
    type: mcq
    concept: conditions-for-agile
    difficulty: 2
    stem: Which describes FAVOURABLE 'modularity of work' in the exhibit?
    options:
      - text: Customers cannot start testing parts until everything is complete
        why: Tempting because it is in the modularity row, but this is the unfavourable condition.
      - text: Late changes to the product are expensive or impossible
        why: Tempting because it is in the same row, but expensive or impossible late changes are unfavourable to agile.
      - text: Problems can be solved one after another, sequentially, within separate functional silos
        why: >-
          Tempting because sequential work sounds modular, but this is the unfavourable side of innovation type, not
          modularity.
      - text: Work can be split into parts in rapid, iterative cycles; late changes are manageable
        correct: true
        why: >-
          Correct — the exhibit lists divisible work in rapid, iterative cycles, usable increments and manageable late
          changes as favourable.
  - key: q313
    type: mcq
    concept: conditions-for-agile
    difficulty: 3
    variant-of: q305
    stem: >-
      A government agency processes the same licence renewals every day under fixed rules. A consultant recommends agile
      for the whole office. What is the best response?
    options:
      - text: Agile suits any office, because it always raises productivity
        why: >-
          Tempting because the reading reports big productivity gains, but it also says agile is not a panacea and is
          less useful in routine operations.
      - text: Agile suits it, provided the agency uses kanban boards to track work
        why: Tempting because kanban boards make progress visible, but a tool cannot create the conditions agile needs.
      - text: Agile is less useful in routine operations; keep it for complex problems with unknown solutions
        correct: true
        why: >-
          Correct — the reading says agile is less useful in routine operations and processes; it fits complex problems
          with unknown solutions.
      - text: Agile suits it only if the staff are trained software developers
        why: >-
          Tempting because agile began in software, but the issue is the routine nature of the work, not the staff’s
          background.
  - key: q314
    type: mcq
    concept: conditions-for-agile
    difficulty: 1
    stem: Which market environment favours agile?
    options:
      - text: Market conditions are stable and predictable
        why: >-
          Tempting because stability lowers risk, but stable, predictable markets are the unfavourable condition for
          agile.
      - text: Customer preferences and solution options change frequently
        correct: true
        why: >-
          Correct — the exhibit lists frequently changing customer preferences and solution options as the favourable
          market environment.
      - text: There are few competitors and products rarely change
        why: Tempting because it sounds calm, but that is a stable market, which the exhibit puts on the unfavourable side.
      - text: Demand is fixed for years ahead by long-term government contracts
        why: >-
          Tempting because guaranteed demand sounds safe, but fixed, predictable demand is the opposite of the changing
          market agile suits.
  - key: q315
    type: mcq
    concept: conditions-for-agile
    difficulty: 2
    stem: What did Intronis's marketing team learn to do with agile?
    options:
      - text: Replace its digital marketing calendar with a fixed annual trade-show plan
        why: >-
          Tempting because trade shows feature in the story, but the annual trade-show plan was what Intronis had before
          agile.
      - text: Produce a topical webinar in a few days rather than several weeks
        correct: true
        why: >-
          Correct — under Richard Delahaye the team learned to produce a topical webinar in days, and a CryptoLocker
          session drew 600 registrants.
      - text: Hand its marketing over to the sales department
        why: >-
          Tempting because sales had complained, but agile made marketing faster and the sales team happier; marketing
          was not handed over.
      - text: Drop budgets and calendars for digital marketing altogether
        why: >-
          Tempting because agile cuts excess planning, but the team still creates calendars and budgets, with less
          line-item detail.
  - key: q316
    type: mcq
    concept: conditions-for-agile
    difficulty: 2
    stem: The reading says agile is 'not a panacea'. What does that mean here?
    options:
      - text: It cures every management problem if applied fully
        why: >-
          Tempting because the reading reports large gains, but a panacea is a cure for everything, which the reading
          says agile is not.
      - text: It should be used only in a crisis
        why: >-
          Tempting because agile is fast, but the reading says nothing about crises; its point is that agile fits some
          conditions and not others.
      - text: "It is not a cure-all: it works best under particular conditions"
        correct: true
        why: >-
          Correct — the reading says agile is not a panacea; it is most effective under conditions commonly found in
          software innovation.
      - text: It applies to new products but never to a company’s functional processes
        why: >-
          Tempting because agile began with products, but the reading says firms need innovation in functional processes
          too, and agile helps there.
  - key: q390
    type: truefalse
    concept: conditions-for-agile
    difficulty: 1
    set: quickfire
    statement: The reading says agile is a panacea that works equally well in every function.
    answer: false
    why: >-
      False — the reading says agile is not a panacea; it is most effective where problems are complex and solutions
      unknown, and less useful in routine operations.
  - key: q391
    type: truefalse
    concept: conditions-for-agile
    difficulty: 1
    set: quickfire
    statement: Where conditions favour agile, interim mistakes provide valuable learning.
    answer: true
    why: >-
      True — the exhibit sets “they provide valuable learning” (favourable) against “they may be catastrophic”
      (unfavourable).
  - key: q392
    type: truefalse
    concept: conditions-for-agile
    difficulty: 2
    set: quickfire
    statement: The reading lists sales calls among the routine operations where agile conditions are less common.
    answer: true
    why: >-
      True — the reading names plant maintenance, purchasing, sales calls and accounting as routine operations where the
      conditions are less common.
  - key: q393
    type: short
    concept: conditions-for-agile
    difficulty: 3
    prompt: >-
      'Agile innovation is the right way to run any project.' Discuss, applying the reading's conditions for agile to a
      hospital's two projects — (a) a new online patient-booking app and (b) the annual servicing of its imaging
      machines — with a real example from the materials.
    model: >-
      The statement overreaches. Rigby, Sutherland and Takeuchi say agile is not a panacea: it works best where problems
      are complex, solutions

      unknown and requirements likely to change, work can be modularised, close customer feedback is feasible and
      interim

      mistakes provide learning. Project (a) meets these conditions. Patients' preferences change, they can try parts of
      the

      app (a booking screen, reminders) as each is finished, feedback can be rapid, and an early mistake teaches rather
      than

      harms. A small self-managed team working in sprints suits it. Project (b) is a routine operation, like the plant

      maintenance the reading lists as unsuitable: the work has been done before, plans can be forecast with confidence
      and

      followed, and an interim mistake on clinical equipment could be catastrophic. A detailed plan suits it better.

      OpenView shows the same split: agile fitted strategic planning and marketing but not selling. Agile also needs

      training, behavioural change and eager participants, so the hospital should weigh that cost and start with the app

      team rather than mandate agile everywhere. Agile is right for some projects, not any project.
    rubric:
      - id: r1
        criterion: Concept — states the conditions under which agile works.
        marks: 3
        top-band: Names several rows of the exhibit (market, customers, innovation type, modularity, mistakes) accurately.
        margin-note: Which conditions decide whether agile fits?
        authorities:
          - mgmt2094-rigby-sutherland-takeuchi-2016-embracing-agile
      - id: r2
        criterion: Example — uses a real example from the materials.
        marks: 2
        top-band: Uses OpenView/Intronis (or another reading example) to show agile fitting one activity and not another.
        margin-note: Where in the reading did agile suit one task but not another?
        authorities:
          - mgmt2094-example-openview-and-intronis
      - id: r3
        criterion: Application — applies the conditions to both projects.
        marks: 3
        top-band: Reaches a reasoned recommendation for each project from its conditions, not a blanket answer.
        margin-note: Treat the two projects separately.
        authorities: []
      - id: r4
        criterion: Evaluation — weighs costs and limits.
        marks: 2
        top-band: Notes training, behavioural change and eager participants, and how to introduce agile sensibly.
        margin-note: What would it cost the hospital to go agile?
        authorities:
          - mgmt2094-rigby-sutherland-takeuchi-2016-embracing-agile
  - key: q401
    type: mcq
    concept: leading-agile
    difficulty: 1
    stem: According to Rigby, Sutherland and Takeuchi, what is now the greatest impediment to extending agile beyond IT?
    options:
      - text: The need for better agile methodologies
        why: >-
          Tempting because methods keep evolving, but the reading says the greatest impediment is not the need for
          better methodologies.
      - text: The behaviour of executives
        correct: true
        why: >-
          Correct — the reading concludes that the greatest impediment is not methods, evidence or proof beyond IT, but
          the behaviour of executives.
      - text: A lack of empirical evidence of significant benefits
        why: Tempting because evidence persuades, but the reading says the benefits have been studied and documented.
      - text: A lack of proof that agile can work outside IT
        why: >-
          Tempting because agile began in IT, but the reading gives many non-IT examples and says this is not the
          impediment.
  - key: q402
    type: mcq
    concept: leading-agile
    difficulty: 2
    stem: Which is the FIRST of the reading's six practices for leaders?
    options:
      - text: Destroy the barriers to agile behaviours
        why: >-
          Tempting because it is the most dramatic, but it is the sixth practice; the first is learning how agile really
          works.
      - text: Practise agile at the top of the organisation
        why: Tempting because leadership is the theme, but practising agile at the top is the fifth practice.
      - text: Learn how agile really works
        correct: true
        why: >-
          Correct — the first practice is to learn how agile really works, since leaders who don’t understand it
          undermine it.
      - text: Start small and let the word spread
        why: Tempting because it is about beginning, but starting small is the third practice; learning comes first.
  - key: q403
    type: mcq
    concept: leading-agile
    difficulty: 2
    stem: How did agile spread at John Deere?
    options:
      - text: The CEO mandated it across every division in a single year
        why: >-
          Tempting because mandates are quick, but the reading describes a slow, low-key spread that started with one
          software engineer.
      - text: Consultants installed it in manufacturing first, and IT followed
        why: Tempting because Deere makes machines, but agile began in corporate IT, not manufacturing.
      - text: It started low-key in corporate IT in 2004 and spread over years to other units, then to marketing and R&D
        correct: true
        why: >-
          Correct — George Tome began in 2004 in corporate IT; other software units followed, making it easier to bring
          agile to business development, marketing and R&D.
      - text: It was imposed on sales after a failed waterfall project there
        why: >-
          Tempting because waterfall failures prompt change, but the reading’s Deere story starts in IT and never
          mentions a sales failure.
  - key: q404
    type: mcq
    concept: leading-agile
    difficulty: 2
    stem: What does the martial-arts process 'shu-ha-ri' illustrate in the reading?
    options:
      - text: Agile should begin at the top and cascade down to teams
        why: >-
          Tempting because the reading also covers agile at the top, but shu-ha-ri is about mastering practices before
          customising them.
      - text: Master the proven practices first, then modify them, then improvise once the principles are absorbed
        correct: true
        why: >-
          Correct — shu-ha-ri illustrates practising proven methods first (shu), then modifying (ha), then improvising
          freely (ri).
      - text: Teams should rotate members to spread knowledge widely
        why: Tempting because learning spreads that way, but the reading says stable teams outperform rotating ones.
      - text: Every decision should have exactly one boss
        why: >-
          Tempting because it is another rule in the reading, but one boss per decision is a barrier-destroying
          technique, not shu-ha-ri.
  - key: q405
    type: mcq
    concept: leading-agile
    difficulty: 3
    stem: >-
      Spotify's squads omit burndown charts and don't always measure velocity. Why is that acceptable in the reading's
      terms?
    options:
      - text: Spotify was agile from birth, so it is exempt from agile principles
        why: >-
          Tempting because Spotify was founded agile, but its leaders still require changes to be consistent with agile
          principles.
      - text: Burndown charts are banned by the Agile Manifesto
        why: >-
          Tempting because the manifesto values prototypes over documents, but it bans no specific tool; Spotify tested
          its changes.
      - text: >-
          Its squads are experienced adapters whose changes fit agile principles and were tested and shown to improve
          results
        correct: true
        why: >-
          Correct — the reading says Spotify encourages experimentation if changes are consistent with agile principles
          and shown to improve outcomes, and the squads tested theirs.
      - text: Senior leaders dictate the same practices to every squad
        why: >-
          Tempting because consistency is common, but the reading says Spotify’s leaders no longer dictate specific
          practices.
  - key: q406
    type: mcq
    concept: leading-agile
    difficulty: 2
    stem: What does the reading say about stable teams compared with teams that rotate members?
    options:
      - text: Stable teams are 60% more productive and 60% more responsive to customer input
        correct: true
        why: >-
          Correct — the reading cites empirical data that stable teams are 60% more productive and 60% more responsive
          to customer input.
      - text: Stable teams grow complacent over time, so members should rotate after each sprint
        why: Tempting because fresh eyes help, but the reading says to avoid rotating membership when starting agile.
      - text: Stable teams are only useful in the shu stage of learning
        why: >-
          Tempting because shu is where rules are followed, but the stability finding is general, not limited to
          beginners.
      - text: Stable teams work best when members are assigned part-time
        why: >-
          Tempting because part-time spreads talent, but the reading warns against part-time assignment as well as
          rotation.
  - key: q407
    type: mcq
    concept: leading-agile
    difficulty: 3
    stem: Why did Systematic’s CEO, Michael Holm, run his nine-member executive group as an agile team?
    options:
      - text: Its board required it as a condition of new investment
        why: >-
          Tempting because investors push change, but the reading gives Holm’s own reason: management lagged the scrum
          teams.
      - text: Development teams used scrum while management stayed old-fashioned, slow and reliant on out-of-date reports
        correct: true
        why: >-
          Correct — Holm felt he was saying "Follow me — I’m just behind you": teams used scrum while management moved
          slowly with out-of-date reports.
      - text: Customers demanded to see the executives’ meeting minutes
        why: >-
          Tempting because agile values transparency, but the reading gives no customer demand; the problem was
          internal.
      - text: The company was too small to need managers
        why: Tempting because agile teams self-manage, but Systematic kept its executive team and changed how it worked.
  - key: q408
    type: mcq
    concept: leading-agile
    difficulty: 3
    stem: At GE Digital, who served as the leadership team's initiative owner and who as its scrum master?
    options:
      - text: COO Brad Surak was initiative owner; an engineering executive was scrum master
        correct: true
        why: Correct — the reading says Surak is the initiative owner and an engineering executive is the scrum master.
      - text: An engineering executive was initiative owner; COO Brad Surak was the scrum master
        why: >-
          Tempting because Surak began as a software engineer, but the reading makes him initiative owner, not scrum
          master.
      - text: An outside agile consultant held both roles for the team
        why: Tempting because consultants often lead change, but the reading gives both roles to GE Digital executives.
      - text: Every executive rotated through both roles each sprint
        why: >-
          Tempting because it sounds fair, but the reading names fixed holders, and stable roles fit the reading’s
          advice.
  - key: q409
    type: mcq
    concept: leading-agile
    difficulty: 3
    stem: >-
      A corporate superior emailed Mission Bell Winery suggesting it explore his personal passion project. How did Erik
      Martella respond?
    options:
      - text: He started work on it at once, since it came from a superior
        why: Tempting because that was his old habit, but the reading says agile changed his response.
      - text: He refused to consider it, because agile forbids outside ideas
        why: Tempting because the idea was a pet project, but Martella did consider it — through the backlog.
      - text: He added it to the list of opportunities to be prioritised; it ranked low, and the executive accepted that
        correct: true
        why: >-
          Correct — he replied that the winery followed agile principles: the idea was added and prioritised, assigned a
          low priority, and readily accepted.
      - text: He set up a separate team to work on it outside the backlog
        why: >-
          Tempting as a way to please everyone, but working outside the backlog is what the executive team protects
          against.
  - key: q410
    type: mcq
    concept: leading-agile
    difficulty: 2
    stem: Which technique does the reading give for destroying the barriers to agile?
    options:
      - text: Add more layers of review before anything is released
        why: >-
          Tempting because reviews catch mistakes, but adding review layers is one of the executive habits the reading
          says undermines agile.
      - text: Name only one boss for each decision
        correct: true
        why: >-
          Correct — the reading says people can have multiple bosses, but decisions cannot: name only one boss for each
          decision.
      - text: Restructure the company before forming any teams
        why: >-
          Tempting because new teams seem to need a new structure, but the reading says don’t change structures right
          away; change roles.
      - text: Reward individual output above team results
        why: >-
          Tempting because individuals drive results, but the reading says to focus on teams and weight team results
          higher.
  - key: q411
    type: mcq
    concept: leading-agile
    difficulty: 3
    stem: >-
      A financial services company's agile pilot produced an app customers praised, yet the total time to release
      improved very little. Why?
    options:
      - text: The agile team took too long over its sprints
        why: Tempting because sprints set the pace, but the delays the reading describes happened outside the team.
      - text: Customers asked for too many changes after the launch
        why: Tempting because agile invites customer input, but the problem came before release, not after it.
      - text: Funding waited for the annual planning cycle, then the app queued for waterfall testing and IT integration
        correct: true
        why: >-
          Correct — funding waited months for annual planning, then the app queued for waterfall vulnerability testing
          and a six-to-nine-month integration logjam.
      - text: The team rotated its members between sprints
        why: >-
          Tempting because rotation hurts teams, but the reading blames the surrounding waterfall processes, not the
          team’s membership.
  - key: q412
    type: mcq
    concept: leading-agile
    difficulty: 2
    stem: What does 'lead with questions, not orders' look like, according to the reading?
    options:
      - text: Asking 'What do you recommend?' and 'How could we test that?'
        correct: true
        why: Correct — the reading gives these two questions as examples of guiding with questions rather than orders.
      - text: Asking each team for weekly written reports on every task
        why: Tempting because it uses questions, but frequent written reports are the old-fashioned habit Systematic cut.
      - text: Asking each member to justify their use of time every day
        why: Tempting because it is a question, but it is micromanagement, which agile is meant to remove.
      - text: Asking customers to sign off the whole plan before work starts
        why: >-
          Tempting because customers matter, but up-front sign-off is a rigid-contract habit agile replaces with
          collaboration.
  - key: q413
    type: mcq
    concept: leading-agile
    difficulty: 3
    stem: >-
      An executive plans to restructure the whole company before introducing cross-functional teams. What does the
      reading advise?
    options:
      - text: Restructure first, because teams cannot form inside the old structure
        why: Tempting because it sounds logical, but the reading says that assumption is rarely true.
      - text: Restructure only the IT department, where agile began
        why: Tempting because agile often starts in IT, but the reading’s advice is about roles, not partial restructuring.
      - text: Don't change structures right away; change roles, so disciplines learn to work together at the same time
        correct: true
        why: >-
          Correct — the reading says major structural change is rarely needed; disciplines must learn to work
          simultaneously rather than sequentially.
      - text: Wait for the next annual planning process before acting
        why: >-
          Tempting because big changes are planned annually, but the app pilot shows annual cycles are themselves a
          barrier.
  - key: q414
    type: mcq
    concept: leading-agile
    difficulty: 2
    stem: Which shift in metrics does the reading recommend for agile organisations?
    options:
      - text: From team results to individual efforts
        why: >-
          Tempting because individuals are easier to measure, but this reverses the advice: weight team results higher
          than individual efforts.
      - text: From customer satisfaction to velocity alone, measured every sprint
        why: >-
          Tempting because velocity is an agile metric, but the reading moves toward outcomes and happiness, not
          velocity alone.
      - text: From how busy people are to business outcomes and team happiness
        correct: true
        why: >-
          Correct — the reading recommends shifting from output and utilisation (how busy people are) to business
          outcomes and team happiness.
      - text: From business outcomes to the hours people work
        why: Tempting because hours are easy to count, but hours measure busyness, which the reading moves away from.
  - key: q415
    type: mcq
    concept: leading-agile
    difficulty: 2
    stem: Why does practising agile at the top help, according to the reading?
    options:
      - text: Executives can then supervise each agile team more closely
        why: >-
          Tempting because executives learn the method, but the reading says the aim is to stop behaviours that impede
          teams, not closer supervision.
      - text: Executives learn the teams’ language and stop behaviours that impede them
        correct: true
        why: >-
          Correct — the reading says executive agile teams speak their teams’ language, learn common challenges, and
          recognise and stop impeding behaviours.
      - text: It lets executives hand strategy work to the teams
        why: >-
          Tempting because teams are empowered, but the reading says strategy development is one of the executive
          activities agile suits.
      - text: It removes the need for agile teams below the executives
        why: >-
          Tempting because the top becomes agile, but executive agile teams coordinate and support teams elsewhere, not
          replace them.
  - key: q416
    type: mcq
    concept: leading-agile
    difficulty: 3
    contrasts-with:
      - conditions-for-agile
    stem: >-
      A new CEO orders every function, including accounting, to go agile company-wide by mandate next month. Which two
      practices does this most clearly breach?
    options:
      - text: Practise agile at the top; name only one boss for each decision
        why: >-
          Tempting because the CEO is acting from the top, but the mandate’s problems are its reach (routine accounting)
          and its scale.
      - text: Allow master teams to customise; lead with questions
        why: >-
          Tempting because a mandate is an order, but the clearest breaches concern where agile fits and how it should
          begin.
      - text: Understand where agile does or does not work; start small and let the word spread
        correct: true
        why: >-
          Correct — accounting is a routine operation where agile fits less, and a company-wide mandate ignores starting
          small with eager participants.
      - text: Learn how agile really works; destroy the barriers to agile
        why: >-
          Tempting because the CEO may misunderstand agile, but the scenario most clearly ignores fit and the
          start-small approach.
  - key: q490
    type: truefalse
    concept: leading-agile
    difficulty: 1
    set: quickfire
    statement: The reading recommends launching agile as a massive, company-wide change program from day one.
    answer: false
    why: >-
      False — the reading says large companies often launch massive change programs, but the most successful agile
      introductions start small and spread.
  - key: q491
    type: truefalse
    concept: leading-agile
    difficulty: 1
    set: quickfire
    statement: Spotify calls its agile innovation teams 'squads'.
    answer: true
    why: >-
      True — the reading says practices vary across Spotify's 70 'squads', its name for agile innovation teams, and its
      'chapters' of functional competencies.
  - key: q492
    type: truefalse
    concept: leading-agile
    difficulty: 2
    statement: More than 70% of agile practitioners report tension between their teams and the rest of the organisation.
    answer: true
    why: >-
      True — the reading cites Scrum Alliance research: more than 70% report tension, because agile teams follow
      different road maps at different speeds.
  - key: q493
    type: short
    concept: leading-agile
    difficulty: 3
    prompt: >-
      'When agile fails, it is usually the teams' fault.' Discuss, advising a retailer whose head-office agile teams are
      stalling while its executives launch many urgent initiatives at once, sit in on team sessions and overturn team
      decisions. Use the reading's six practices and a real example from the materials.
    model: >-
      The statement points the wrong way: Rigby, Sutherland and Takeuchi say the greatest impediment to agile is

      executive behaviour, and these executives show it: launching countless urgent initiatives, becoming over-involved
      and overturning decisions all erode agile's

      benefits. First, they should learn how agile really works — it is neither anarchy nor 'doing what I say, only
      faster'.

      Second, they should practise agile at the top: form an executive team that rank-orders one enterprise backlog, as
      Erik

      Martella did at Mission Bell Winery, where even a superior's pet project was added to the list and ranked low.
      That

      gives the teams two or three real priorities instead of dozens. Third, they should destroy the barriers: name only
      one

      boss for each decision, stop second-guessing the initiative owner (change the owner if unhappy, don't incapacitate

      them), and lead with questions such as 'How could we test that?'. The limit is that this asks executives to give
      up

      control and time; firms that reallocated 25% of leaders' time to agile teams show the commitment needed, and
      routine

      head-office work may still not suit agile. So the statement has it backwards: agile usually stalls at the top.
    rubric:
      - id: r1
        criterion: Concept — explains the relevant practices accurately.
        marks: 3
        top-band: Diagnoses the behaviour and links it to named practices (learn it, agile at the top, destroy barriers).
        margin-note: Which of the six practices are being broken?
        authorities:
          - mgmt2094-rigby-sutherland-takeuchi-2016-embracing-agile
      - id: r2
        criterion: Example — uses a real example from the materials.
        marks: 2
        top-band: Uses Mission Bell, GE Digital or Systematic accurately to show agile at the top.
        margin-note: Which executive team in the reading did this well?
        authorities:
          - mgmt2094-example-mission-bell-winery
      - id: r3
        criterion: Application — turns the practices into specific advice for these executives.
        marks: 3
        top-band: "Gives concrete steps: one ranked backlog, one boss per decision, questions not orders."
        margin-note: Tell these executives what to do on Monday.
        authorities: []
      - id: r4
        criterion: Evaluation — weighs the cost or limits of the advice.
        marks: 2
        top-band: Recognises the time and control executives must give up, or where agile may not fit.
        margin-note: What will this cost the executives?
        authorities:
          - mgmt2094-rigby-sutherland-takeuchi-2016-embracing-agile
  - key: q501
    type: mcq
    concept: lean-start-up
    difficulty: 1
    set: pretest
    stem: Which two people do the lecture slides associate with the Lean Start-Up?
    options:
      - text: Jeff Sutherland and Ken Schwaber
        why: >-
          Tempting because they appear in the slide’s family tree, but they are linked to scrum, not to the lean
          start-up.
      - text: Steve Blank and Eric Ries
        correct: true
        why: Correct — the Lean Start-Up slide names Steve Blank and Eric Ries, with Ries’s book and Blank’s HBR article.
      - text: Taiichi Ohno and Kent Beck
        why: >-
          Tempting because both appear in the family tree, but Ohno is linked to Toyota’s Production System and Beck to
          extreme programming.
      - text: David Collis and Michael Rukstad
        why: >-
          Tempting because Collis is this week’s reading on lean strategy, but the slides credit the lean start-up to
          Blank and Ries.
  - key: q502
    type: mcq
    concept: lean-start-up
    difficulty: 1
    stem: What are the lean start-up's two key principles on the slides?
    options:
      - text: Minimum viable product (MVP) and lean–agile development
        correct: true
        why: "Correct — the slide lists two key principles: 1. minimum viable product (MVP); 2. lean–agile development."
      - text: Vision and deliberate strategy
        why: >-
          Tempting because they are steps in Collis’s lean strategy process, but they are not the lean start-up’s key
          principles on the slide.
      - text: Detailed business plans and five-year financial forecasts
        why: >-
          Tempting because start-ups often write them, but Blank’s hypotheses reject executing on guesses; the
          principles are the MVP and lean–agile development.
      - text: Stage-gates and multiple-horizon planning
        why: >-
          Tempting because they are innovation tools, but Collis says such corporate tools can undermine innovation;
          they are not lean start-up principles.
  - key: q503
    type: mcq
    concept: lean-start-up
    difficulty: 2
    stem: Which statement is one of Steve Blank's hypotheses on the slides?
    options:
      - text: Start-ups are mainly about the efficient execution of a known plan
        why: Tempting because execution matters, but Blank says start-ups are about learning and discovery, not execution.
      - text: Start-ups aren't small versions of large organisations
        correct: true
        why: "Correct — the slide lists this among Steve Blank’s hypotheses: start-ups are not scaled-down large firms."
      - text: The facts are found inside the building, in the business plan
        why: Tempting because plans hold assumptions, but Blank says the facts live outside the building.
      - text: Investors usually execute on verified facts, not guesses
        why: >-
          Tempting because investors do research, but Blank says entrepreneurs and investors are generally executing on
          guesses.
  - key: q504
    type: mcq
    concept: lean-start-up
    difficulty: 2
    stem: Steve Blank says 'the facts live outside the building'. What does this mean for a founder?
    options:
      - text: The founder should rent offices away from the head office
        why: Tempting as a literal reading, but the phrase is about where evidence comes from, not where the office is.
      - text: Assumptions must be tested against facts from customers and the market, not settled at a desk
        correct: true
        why: >-
          Correct — Blank says start-ups must surface their hypotheses and test them against facts, and those facts live
          outside the building.
      - text: Facts matter less than the founder’s own vision
        why: >-
          Tempting because founders need vision, but Blank’s point is the opposite: guesses must be tested against
          outside facts.
      - text: Data already held inside the company is enough
        why: >-
          Tempting because internal data is cheap, but Blank says the facts live outside the building, with customers
          and markets.
  - key: q505
    type: mcq
    concept: lean-start-up
    difficulty: 2
    stem: How do the slides define a minimum viable product?
    options:
      - text: The cheapest possible version of the final product, built for a mass-market launch
        why: >-
          Tempting because "minimum" suggests cheap, but the slide’s MVP targets early adopters to validate demand, not
          the mass market.
      - text: A product with every feature customers asked for in research
        why: >-
          Tempting because it sounds customer-focused, but an MVP has just those features needed to sell to early
          adopters.
      - text: Just the features needed to sell to early adopters and validate demand
        correct: true
        why: >-
          Correct — the slide defines an MVP as a product with just those features that allow you to sell to early
          adopters and validate demand.
      - text: A prototype shown only to investors before any customer sees it
        why: Tempting because investors fund start-ups, but the MVP is sold to early adopters to validate demand.
  - key: q506
    type: mcq
    concept: lean-start-up
    difficulty: 2
    stem: How do the slides define pivoting?
    options:
      - text: Course correction to the proposed set of hypotheses, based on market learnings
        correct: true
        why: >-
          Correct — the slide defines pivoting as course correction to the proposed set of hypotheses, based on market
          learnings.
      - text: Abandoning the whole venture as soon as its first experiment fails to show demand
        why: >-
          Tempting because a pivot follows bad news, but it corrects course on the hypotheses; it does not shut the
          venture.
      - text: Keeping the strategy unchanged and pushing harder for sales
        why: Tempting because persistence pays, but holding course is persevering, the alternative to a pivot.
      - text: Replacing members of the team after every sprint
        why: Tempting because it is a change, but a pivot changes hypotheses about the business, not team membership.
  - key: q507
    type: mcq
    concept: lean-start-up
    difficulty: 2
    stem: On the slide, the lean start-up method equals which two things?
    options:
      - text: Deliberate strategy + emergent strategy
        why: >-
          Tempting because Collis combines these in lean strategy, but the slide’s lean start-up method is customer
          development plus agile development.
      - text: Market research + waterfall development
        why: >-
          Tempting because both involve customers and building, but waterfall is what agile replaced; the slide says
          agile development.
      - text: Customer development + agile development
        correct: true
        why: >-
          Correct — the slide says lean start-up method = customer development + agile development (fast, iterative and
          incremental).
      - text: Kanban + a detailed five-year business plan
        why: Tempting because kanban is lean, but the slide’s equation is customer development plus agile development.
  - key: q508
    type: mcq
    concept: lean-start-up
    difficulty: 3
    stem: On the slide, how does a venture get from MVP 1 to the final product?
    options:
      - text: Through MVP 2, 3 and 4, each shaped by customer feedback, with rapid deployment
        correct: true
        why: >-
          Correct — the slide shows MVP 1 → MVP 2 → MVP 3 → MVP 4 → final product, with customer feedback at each step
          and rapid deployment.
      - text: By perfecting MVP 1 in private until it is complete, then launching it once
        why: >-
          Tempting because it avoids showing rough work, but the slide shows repeated releases shaped by customer
          feedback.
      - text: By building the final product first, then cutting features out to make the MVPs
        why: Tempting because MVPs are smaller, but the slide builds up from MVP 1 to the final product, not down.
      - text: By skipping straight to the final product once investors approve MVP 1
        why: >-
          Tempting because funding unlocks building, but the slide shows several feedback-driven MVPs before the final
          product.
  - key: q509
    type: mcq
    concept: lean-start-up
    difficulty: 2
    stem: From which tradition do the slides trace the 'lean' in lean start-up?
    options:
      - text: Japan's manufacturing industry — Toyota's Production System and kanban
        correct: true
        why: >-
          Correct — the family tree circles Toyota’s Production System and kanban in Japan’s manufacturing industry as
          the source of lean.
      - text: Silicon Valley venture capital in the 1990s
        why: >-
          Tempting because start-ups and investors feature in Blank’s hypotheses, but the slides trace lean to Japanese
          manufacturing.
      - text: The 2001 Agile Manifesto for software
        why: >-
          Tempting because agile feeds the lean start-up too, but the manifesto is the agile stream; lean comes from
          Toyota.
      - text: US management consulting for large banks
        why: >-
          Tempting because consultants spread methods, but the slides place lean’s origin in Japan’s manufacturing
          industry.
  - key: q510
    type: mcq
    concept: lean-start-up
    difficulty: 2
    stem: In the slide's 'Agile & Lean' family tree, which work by Steve Blank feeds into the Lean Startup?
    options:
      - text: The New New Product Development Game (1986)
        why: Tempting because it is an early work in the tree, but it is by Takeuchi and Nonaka and leads to scrum.
      - text: Lean Software Development (2003)
        why: Tempting because it is a lean book, but the tree credits it to Mary and Tom Poppendieck.
      - text: Extreme Programming (1999)
        why: Tempting because it is in the agile stream, but the tree credits it to Kent Beck.
      - text: The Four Steps to the Epiphany (2005)
        correct: true
        why: >-
          Correct — the tree shows Steven G. Blank’s The Four Steps to the Epiphany (2005) feeding into Ries’s Lean
          Startup (2011).
  - key: q511
    type: mcq
    concept: lean-start-up
    difficulty: 3
    variant-of: q510
    stem: According to the slides' family tree (and the reading), what inspired scrum?
    options:
      - text: Toyota's Production System (Ohno, 1978)
        why: Tempting because Toyota is the root of lean, but the tree and the reading tie scrum to the 1986 article.
      - text: "'The New New Product Development Game' (Takeuchi and Nonaka, 1986)"
        correct: true
        why: >-
          Correct — the tree links this 1986 article to scrum, and the reading says Sutherland was inspired in part by
          it.
      - text: Eric Ries's Lean Startup (2011)
        why: >-
          Tempting because it is recent and famous, but scrum came long before 2011; the Lean Startup draws on scrum,
          not the reverse.
      - text: Design Patterns (Gang of Four, 1994)
        why: Tempting because it is in the tree, but Design Patterns leads to extreme programming, not to scrum.
  - key: q512
    type: mcq
    concept: lean-start-up
    difficulty: 3
    stem: >-
      A founder plans to spend two years and all her seed funding perfecting a meal-kit service before any customer
      tries it. What would Blank’s hypotheses say?
    options:
      - text: "She is right: a start-up should execute a fixed plan, just as a large organisation does with its products"
        why: >-
          Tempting because discipline helps, but Blank says start-ups aren’t small versions of large organisations and
          are about discovery, not execution.
      - text: She should first hire a scrum master, who will decide what to test
        why: >-
          Tempting because scrum is in this week’s material, but Blank’s point is about testing assumptions with
          customers, not roles.
      - text: "She is executing on guesses: surface her assumptions and test them with customers, starting with an MVP"
        correct: true
        why: >-
          Correct — Blank says founders execute on guesses, must surface hypotheses and test them against facts outside
          the building; an MVP does that cheaply.
      - text: She should write a longer business plan first, then test it after launch
        why: >-
          Tempting because plans organise thinking, but a longer plan only adds guesses; the facts live outside the
          building.
  - key: q513
    type: mcq
    concept: lean-start-up
    difficulty: 2
    stem: In the slide's 'Agile Innovation Framework in Organisation', at which stage does lean start-up sit?
    options:
      - text: Creativity, alongside mood and motivation
        why: >-
          Tempting because creativity starts the framework, but that stage holds mindfulness, mood, motivation and
          creative skills.
      - text: Concept, between ideas and develop
        correct: true
        why: >-
          Correct — the framework puts lean start-up (with SIT and design thinking) at the concept stage, between ideas
          and develop.
      - text: Develop, alongside scrum and kanban
        why: >-
          Tempting because lean start-up uses agile development, but in this framework agile, scrum and kanban sit at
          develop and lean start-up at concept.
      - text: Innovation, as the final output
        why: Tempting because the framework ends there, but innovation is the outcome, not a tool stage.
  - key: q514
    type: mcq
    concept: lean-start-up
    difficulty: 3
    variant-of: q513
    contrasts-with:
      - agile-innovation
    stem: In the same framework, where do agile, scrum and kanban sit relative to lean start-up?
    options:
      - text: At the same stage, because they are all lean methods
        why: >-
          Tempting because the slides group lean and agile in one family tree, but the framework places them at
          different stages.
      - text: Earlier, at the creativity stage, before any ideas exist
        why: >-
          Tempting because agile uses creativity tools, but the creativity stage holds mood, motivation and skills, not
          methods.
      - text: Later, at develop; lean start-up sits earlier, at concept
        correct: true
        why: >-
          Correct — the framework runs creativity → ideas → concept (lean start-up) → develop (agile, scrum, kanban) →
          innovation.
      - text: Before it, at the ideas stage, beside R&D and market needs
        why: Tempting because agile starts projects, but the ideas stage holds R&D and market needs; agile sits at develop.
  - key: q515
    type: mcq
    concept: lean-start-up
    difficulty: 2
    stem: Which caption accompanies the lean principles used in the lean start-up on the slides?
    options:
      - text: "\"… and hold the plan fixed until launch\""
        why: >-
          Tempting because lean cuts waste, which sounds like control, but a fixed plan is the waterfall habit the
          slides move away from.
      - text: "\"… and develop a culture of continuous improvement\""
        correct: true
        why: Correct — the slide’s speech bubble reads "… and develop a culture of continuous improvement".
      - text: "\"… and add every feature before the first release\""
        why: >-
          Tempting because customers like features, but the slides build up through MVPs with no waste of time and
          money.
      - text: "\"… and let each function work in its own silo\""
        why: >-
          Tempting because specialists are efficient, but agile takes people out of silos; the caption is about
          continuous improvement.
  - key: q516
    type: mcq
    concept: lean-start-up
    difficulty: 3
    stem: >-
      Under 'Lean principles used in the concept lean start-up', a slide labels a Toyota dashboard 'Our MVP' beside a
      Toyota production line. What is the slide connecting?
    options:
      - text: Lean start-up borrows lean principles from Toyota’s manufacturing
        correct: true
        why: >-
          Correct — the slide heading and the family tree (Toyota’s Production System → lean → Lean Startup) connect
          lean start-up to Toyota’s lean principles.
      - text: Toyota invented the minimum viable product decades before Ries did
        why: >-
          Tempting because "Our MVP" sits on a Toyota image, but the slides date the Lean Startup (and its MVP) to Ries
          in 2011, not to Toyota.
      - text: Car makers should never use agile methods
        why: Tempting if cars seem too big for MVPs, but the slide uses Toyota to show where lean principles come from.
      - text: Lean start-up applies only to motor vehicles
        why: Tempting because both images are cars, but the slides apply lean start-up to start-ups generally.
  - key: q590
    type: truefalse
    concept: lean-start-up
    difficulty: 1
    set: quickfire
    statement: Steve Blank's hypotheses say start-ups are about learning and discovery, not execution.
    answer: true
    why: True — the slide lists that start-ups are about learning/discovery, not execution, among Steve Blank’s hypotheses.
  - key: q591
    type: truefalse
    concept: lean-start-up
    difficulty: 1
    set: quickfire
    statement: Steve Blank argues that start-ups are small versions of large organisations.
    answer: false
    why: >-
      False — Blank’s hypothesis is that start-ups AREN’T small versions of large organisations; they are searching, not
      executing a known plan.
  - key: q592
    type: truefalse
    concept: lean-start-up
    difficulty: 1
    statement: On the slides, the lean start-up method combines customer development with agile development.
    answer: true
    why: >-
      True — the slide reads lean start-up method = customer development + agile development, the latter being fast,
      iterative and incremental.
  - key: q593
    type: short
    concept: lean-start-up
    difficulty: 3
    prompt: >-
      'A start-up should perfect its product before any customer sees it.' Discuss, applying the lean start-up to a
      student founder planning a campus bike-sharing service, with a real example from the materials.
    model: >-
      The statement runs against the lean start-up of Steve Blank and Eric Ries. Blank's hypotheses say founders

      are generally executing on guesses, start-ups aren't small versions of large organisations, and they are about

      learning and discovery, not execution: they must surface their assumptions and test them against facts, which live

      outside the building. The student founder's guesses — that students will pay, how often they ride, where bikes are

      needed — should be tested with an MVP, a product with just the features needed to sell to early adopters and
      validate

      demand: say, twenty bikes at two residences with a simple booking form. Lean start-up method is customer
      development

      plus agile development, so MVP 1 becomes MVP 2, 3 and 4 as feedback arrives, before a final product. If demand
      fails,

      she pivots — a course correction to her hypotheses based on market learning — as Instagram's founders did when
      Burbn

      users mostly posted pictures. Perfecting first wastes time and money. The limit, from Collis, is that quick tests

      cannot judge everything: if the service needs a large up-front investment, she still needs a strategy before
      testing.
    rubric:
      - id: r1
        criterion: Concept — explains the lean start-up accurately.
        marks: 3
        top-band: Uses Blank’s hypotheses, the MVP and pivot definitions, and customer development plus agile development.
        margin-note: What do Blank and Ries say a start-up is for?
        authorities: []
      - id: r2
        criterion: Example — uses a real example from the materials.
        marks: 2
        top-band: Uses Instagram/Burbn, Toyota or another source example accurately and relevantly.
        margin-note: Which real venture corrected course after testing?
        authorities:
          - mgmt2094-example-instagram-burbn
      - id: r3
        criterion: Application — applies the method to the bike-sharing idea.
        marks: 3
        top-band: Names the founder’s assumptions, a concrete MVP and what would trigger a pivot.
        margin-note: What exactly would her first MVP be?
        authorities: []
      - id: r4
        criterion: Evaluation — responds to the statement and weighs a limit.
        marks: 2
        top-band: Takes a clear position on the statement and notes a limit (e.g. Collis on untestable investments).
        margin-note: Is perfecting first ever right?
        authorities:
          - mgmt2094-collis-2016-lean-strategy
  - key: q601
    type: mcq
    concept: business-model-canvas
    difficulty: 1
    stem: How do the slides describe the business model canvas?
    options:
      - text: A view of all nine building blocks of a business on one page and their relative hypotheses
        correct: true
        why: >-
          Correct — the slide calls the business model canvas a view of all nine building blocks of a business on one
          page and their relative hypotheses.
      - text: A ten-year financial forecast prepared for investors
        why: >-
          Tempting because the canvas includes costs and revenue, but it is a one-page view of the whole business model,
          not a forecast.
      - text: A board for moving sticky notes from to-do to done
        why: Tempting because both are visual tools, but that is a kanban board, from the agile reading.
      - text: A report recording one experiment's hypothesis and results
        why: >-
          Tempting because the canvas holds hypotheses, but a single experiment is written up in the innovation
          accounting report.
  - key: q602
    type: mcq
    concept: business-model-canvas
    difficulty: 1
    stem: How many building blocks does the business model canvas have?
    options:
      - text: Five
        why: Tempting because the agile exhibit has five conditions, but the canvas has nine building blocks.
      - text: Nine
        correct: true
        why: Correct — the slide describes the canvas as all nine building blocks of a business on one page.
      - text: Six
        why: Tempting because the agile reading has six practices for leaders, but the canvas has nine blocks.
      - text: Twelve
        why: Tempting if you count sub-questions, but the canvas has nine building blocks.
  - key: q603
    type: mcq
    concept: business-model-canvas
    difficulty: 2
    stem: Which block asks 'For whom are we creating value? Who are our most important customers?'
    options:
      - text: Customer relationships
        why: Tempting because it is about customers, but that block asks how we get, keep and grow customers.
      - text: Value propositions
        why: Tempting because the question mentions value, but that block asks what value we deliver, not for whom.
      - text: Channels
        why: >-
          Tempting because channels reach customers, but that block asks through which channels segments want to be
          reached.
      - text: Customer segments
        correct: true
        why: >-
          Correct — the customer segments block asks for whom we are creating value and who our most important customers
          are.
  - key: q604
    type: mcq
    concept: business-model-canvas
    difficulty: 2
    stem: Which block asks 'For what value are our customers really willing to pay?'
    options:
      - text: Revenue streams
        correct: true
        why: >-
          Correct — the revenue streams block asks what customers are really willing to pay for, the revenue model and
          pricing tactics.
      - text: Cost structure
        why: >-
          Tempting because it is about money, but cost structure asks about the most important costs, not what customers
          pay for.
      - text: Value propositions
        why: >-
          Tempting because it mentions value, but value propositions asks what value we deliver; willingness to pay is
          revenue streams.
      - text: Customer relationships
        why: >-
          Tempting because paying is part of a relationship, but that block asks how we get, keep and grow customers and
          how costly that is.
  - key: q605
    type: mcq
    concept: business-model-canvas
    difficulty: 2
    stem: On the slide, which block includes the question 'What is the minimum viable product?'
    options:
      - text: Key activities
        why: >-
          Tempting because building an MVP is an activity, but the slide places the MVP question under value
          propositions.
      - text: Revenue streams
        why: Tempting because an MVP must sell to early adopters, but the question sits under value propositions.
      - text: Value propositions
        correct: true
        why: Correct — the value propositions block ends with "What is the minimum viable product?"
      - text: Key resources
        why: Tempting because an MVP uses resources, but the slide places this question under value propositions.
  - key: q606
    type: mcq
    concept: business-model-canvas
    difficulty: 2
    stem: Which block asks 'How do we get, keep, and grow customers?'
    options:
      - text: Channels
        why: >-
          Tempting because channels reach customers, but getting, keeping and growing them is the customer relationships
          block.
      - text: Customer relationships
        correct: true
        why: >-
          Correct — the customer relationships block asks how we get, keep and grow customers, and how costly those
          relationships are.
      - text: Customer segments
        why: Tempting because it is about customers, but segments asks for whom we create value.
      - text: Key partners
        why: Tempting because partners can help win customers, but that block asks who our partners and suppliers are.
  - key: q607
    type: mcq
    concept: business-model-canvas
    difficulty: 2
    stem: >-
      Which block asks 'Through which channels do our customer segments want to be reached?' and 'Which ones are most
      cost-efficient?'
    options:
      - text: Channels
        correct: true
        why: >-
          Correct — the channels block asks how segments want to be reached, how others reach them, which work best and
          which are most cost-efficient.
      - text: Cost structure
        why: >-
          Tempting because "cost-efficient" sounds like costs, but the question is about reaching customers, so it is
          channels.
      - text: Customer segments
        why: Tempting because segments are named in the question, but the block that asks how they are reached is channels.
      - text: Key activities
        why: >-
          Tempting because key activities also lists distribution channels, but the reaching questions belong to the
          channels block.
  - key: q608
    type: mcq
    concept: business-model-canvas
    difficulty: 2
    stem: Which block asks 'Which key activities do partners perform?'
    options:
      - text: Key activities
        why: Tempting because the question names key activities, but it asks what partners do, so it sits in key partners.
      - text: Key resources
        why: Tempting because partners supply resources, but this question about partners’ activities sits in key partners.
      - text: Key partners
        correct: true
        why: >-
          Correct — the key partners block asks who our partners and suppliers are, which resources we acquire from them
          and which activities they perform.
      - text: Cost structure
        why: Tempting because outsourcing affects costs, but the question is in the key partners block.
  - key: q609
