        why: Tempting because it sounds like testing, but the slide uses validated, invalidated or inconclusive.
      - text: As pivot, persevere or quit the whole venture
        why: >-
          Tempting because pivot or persevere follows learning, but the report documents the learning itself as
          validated, invalidated or inconclusive.
      - text: As validated, invalidated or inconclusive
        correct: true
        why: Correct — the report’s Learn box says document the learning (validated, invalidated or inconclusive).
      - text: As build, measure or learn
        why: Tempting because they are the loop’s steps, but they are stages, not outcomes of learning.
  - key: q711
    type: mcq
    concept: build-measure-learn
    difficulty: 3
    stem: Which hypothesis is best written for an innovation accounting report?
    options:
      - text: If we offer free delivery to 200 trial users for two weeks, at least 30% will reorder
        correct: true
        why: Correct — it is falsifiable, quantifies the goal and sets a scope and timebox, as the report asks.
      - text: Customers will probably like free delivery
        why: Tempting because it is a hypothesis, but it has no number or timebox, so no result could clearly disprove it.
      - text: Free delivery is a good idea for the brand
        why: Tempting because it states a belief, but it is not falsifiable or quantified.
      - text: We will learn a lot from offering free delivery
        why: Tempting because learning is the aim, but it predicts no measurable outcome to validate or invalidate.
  - key: q712
    type: mcq
    concept: build-measure-learn
    difficulty: 2
    stem: Which hypothesis does the innovation accounting report say to test first?
    options:
      - text: The cost and pricing hypothesis
        why: Tempting because costs matter early, but the slide says to test the value and growth hypothesis first.
      - text: The branding and naming hypothesis
        why: Tempting because brands shape demand, but the slide names the value and growth hypothesis.
      - text: The value and growth hypothesis
        correct: true
        why: Correct — the report’s hypothesis box says test the value and growth hypothesis first.
      - text: The hiring and staffing hypothesis
        why: Tempting because start-ups must hire, but the slide puts value and growth first.
  - key: q713
    type: mcq
    concept: build-measure-learn
    difficulty: 3
    stem: >-
      A café’s MVP tests whether office workers will pre-order lunch by app. After two weeks, 2% pre-order against a
      target of 25%. What does the loop suggest?
    options:
      - text: Persevere unchanged, because two weeks is never long enough to learn
        why: >-
          Tempting because patience can pay, but the hypothesis set its own two-week timebox and missed badly: it is
          invalidated.
      - text: "The hypothesis is invalidated: record that and consider a pivot — a course correction to the hypotheses"
        correct: true
        why: >-
          Correct — the result disproves the quantified hypothesis, so the learning is invalidated and a pivot (course
          correction based on market learning) is in view.
      - text: Close the café, because the experiment failed
        why: >-
          Tempting because the result is poor, but a failed test invalidates one hypothesis; the loop corrects course
          rather than abandoning the venture.
      - text: Add more features to the app before measuring again
        why: >-
          Tempting because more features might help, but adding features without a new hypothesis ignores what was
          learned.
  - key: q714
    type: mcq
    concept: build-measure-learn
    difficulty: 3
    variant-of: q713
    stem: The same café’s MVP gets 31% of office workers pre-ordering against a 25% target. What does the loop suggest?
    options:
      - text: "The hypothesis is validated: persevere and move to the next experiment"
        correct: true
        why: >-
          Correct — the result meets the quantified target, so the learning is validated; persevere and take the next
          action, the next experiment.
      - text: Pivot at once, because one result is never enough
        why: >-
          Tempting because caution is wise, but a pivot corrects a hypothesis the market rejected; this one was
          validated.
      - text: Stop testing and build the final product immediately
        why: Tempting because the test passed, but the slides show more MVPs and experiments before the final product.
      - text: Record it as inconclusive, because the margin over the target is so small
        why: Tempting because 31% is close to 25%, but the target was quantified in advance and met, so it is validated.
  - key: q715
