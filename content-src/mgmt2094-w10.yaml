  - key: q614
    type: mcq
    concept: business-model-canvas
    difficulty: 3
    contrasts-with:
      - build-measure-learn
    stem: Why does the business model canvas sit beside the MVP and pivoting as a core concept of the lean start-up?
    options:
      - text: Its blocks hold hypotheses that can be tested and, if the market says so, corrected by a pivot
        correct: true
