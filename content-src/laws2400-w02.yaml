  - key: fi20
    type: short
    concept: false-imprisonment
    difficulty: 3
    cases: [balmain-new-ferry-v-robertson]
    prompt: |
      A nightclub bouncer, wrongly believing P tried to use a fake ID, tells P to wait in a small office "until the police arrive", standing in the only doorway so P cannot leave. Fifteen minutes later, the bouncer realises the ID was genuine and lets P go. Advise P on a possible action in false imprisonment against the club.
    model: |
      False imprisonment requires a positive act, direct interference, an intentional or negligent act, and total restraint of the plaintiff's liberty without lawful justification. The bouncer's positive act of standing in the doorway and telling P to wait directly restrains P's liberty; this is intentional conduct. The restraint is total because standing in the only doorway leaves P with no reasonable means of escape from the office — there is no suggestion of another exit or a safe alternative route. The central issue is lawful justification. Unlike Balmain New Ferry v Robertson, where a condition attached to entry gave a lawful excuse, here P did not enter the office on any accepted condition; the bouncer's belief P used a fake ID, though honestly held, was mistaken, and a reasonable but mistaken belief in a right to detain does not itself provide a lawful justification. Because all elements are satisfied and no true lawful excuse exists, P is likely to succeed in an action for false imprisonment against the club, which will typically be vicariously liable for its bouncer's conduct.
    rubric:
      - id: r1
        criterion: |
          Sets out all four elements of false imprisonment
        marks: 1
        top-band: |
          Lists positive act, direct interference, intentional/negligent act, total restraint without lawful justification.
        margin-note: |
          Elements first.
        authorities: []
      - id: r2
        criterion: |
          Correctly analyses "total" restraint
        marks: 1
        top-band: |
          Explains why standing in the only doorway removes any reasonable means of escape.
        margin-note: |
          Good — ties to the facts.
        authorities: []
      - id: r3
        criterion: |
          Correctly rejects the mistaken-belief defence
        marks: 2
        top-band: |
          Explains that a reasonable but mistaken belief in lawful authority does not itself excuse the detention, distinguishing this from a true lawful condition as in Balmain New Ferry v Robertson.
        margin-note: |
          This is the examiner's real test — well done if reached.
        authorities: []
  - key: aoc01
    type: mcq
    concept: action-on-the-case-intentional-harm
    difficulty: 1
    set: pretest
    stem: |
      Which of the following is NOT one of the elements of malicious prosecution?
    options:
      - text: |
          The defendant initiated proceedings against the plaintiff.
        correct: false
        why: |
          This is a required element of malicious prosecution, going to the defendant's own role in starting the process.
      - text: |
          The proceedings terminated in the plaintiff's favour.
        correct: false
        why: |
          This is a required element of malicious prosecution, distinguishing it from a prosecution that succeeded.
      - text: |
          The defendant's conduct must involve a direct physical interference with the plaintiff's own body.
        correct: true
        why: |
          Malicious prosecution is an action on the case, not trespass — it does not require any direct physical interference with the plaintiff at all.
      - text: |
          The defendant acted without reasonable and probable cause.
        correct: false
        why: |
          This is a required element of malicious prosecution, tested both subjectively and objectively.
  - key: aoc02
    type: mcq
    concept: action-on-the-case-intentional-harm
    difficulty: 2
    stem: |
      Why is malicious prosecution brought as an action on the case rather than as trespass?
    options:
      - text: |
          Because the harm to life, liberty, reputation or property is consequential on the prosecution process, not a direct interference by the defendant.
        correct: true
        why: |
          Action on the case covers harm that is consequential rather than direct, which fits malicious prosecution: the harm flows from the process of prosecution, not a direct physical act.
      - text: |
          Because trespass to the person can only ever be brought against a defendant who happens to be a police officer.
        correct: false
        why: |
          There is no such restriction on who can be sued in trespass; the real reason is the consequential, rather than direct, nature of the harm.
      - text: |
          Because malicious prosecution, by its very nature, never causes the plaintiff any real damage of any recognised kind.
        correct: false
        why: |
          Malicious prosecution does require the plaintiff to show damage to life, liberty, reputation or property — real harm is a required element.
      - text: |
          Because malicious prosecution is properly classified as a criminal offence rather than as a civil tort at all.
        correct: false
        why: |
          Malicious prosecution is a tort (a civil action on the case); it is not itself a criminal offence.
  - key: aoc03
    type: mcq
    concept: action-on-the-case-intentional-harm
    difficulty: 2
    variant-of: aoc02
    stem: |
      P is prosecuted for a criminal offence they did not commit, is ultimately acquitted, and suffers damage to their reputation as a result. Why might this be pleaded as an action on the case rather than trespass to the person, even though P suffered real harm?
    options:
      - text: |
          The reputational harm P suffered flowed from the prosecution process itself, not a direct physical act by D.
        correct: true
        why: |
          Action on the case is the correct vehicle where the harm is consequential on the defendant's conduct rather than a direct physical interference.
      - text: |
          Because an action framed in trespass always requires proof of malice, whereas an action on the case never does.
        correct: false
        why: |
          This reverses the actual requirement — it is malicious prosecution (an action on the case) that requires proof of malice, not trespass.
      - text: |
          Because P must have been physically detained at some point for any claim in trespass to be capable of applying here.
        correct: false
        why: |
          Detention could separately found false imprisonment, but the point is that reputational harm from a prosecution process is consequential, fitting action on the case.
      - text: |
          Because an action on the case never requires the plaintiff to prove any kind of damage whatsoever.
        correct: false
        why: |
          This is incorrect — malicious prosecution, as an action on the case, specifically requires the plaintiff to show damage to life, liberty, reputation or property.
