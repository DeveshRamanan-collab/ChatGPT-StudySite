    difficulty: 3
    variant-of: rem08
    stem: |
      D commits a battery against P not just by pushing P, but by doing so in a deliberately humiliating way in front of P's colleagues, specifically to embarrass P. Which head of damages is designed to reflect this additional affront, beyond compensating P's physical injury?
    options:
      - text: |
          Aggravated damages, responding to the deliberate, humiliating manner of the conduct.
        correct: true
        why: |
          The deliberate, humiliating way the battery was carried out, causing an affront to P beyond the physical injury itself, is what aggravated damages address.
      - text: |
          Nominal damages, since the underlying tort of battery has been established regardless of the particular manner of its commission.
        correct: false
        why: |
          Nominal damages reflect an absence of real harm; here there is a real injury and additional affront, which nominal damages would not capture.
      - text: |
          Compensatory damages alone, on the basis that they are already designed to cover absolutely every possible category of loss.
        correct: false
        why: |
          Ordinary compensatory damages address the physical/financial loss; the additional affront from the humiliating manner is what aggravated damages add.
      - text: |
          No additional damages of any kind are available here beyond the compensatory damages already payable for the physical injury.
        correct: false
        why: |
          Aggravated damages are specifically available for this kind of additional affront caused by the defendant's deliberate conduct.
  - key: rem10
    type: mcq
    concept: remedies-intentional-torts-to-person
    difficulty: 2
    stem: |
      What is the primary purpose of exemplary damages?
    options:
      - text: |
          To compensate the plaintiff for financial losses they have actually and provably suffered from the tort.
        correct: false
        why: |
          Compensating actual financial loss is the role of compensatory damages, not exemplary damages.
      - text: |
          To punish the defendant where their conduct was particularly egregious.
        correct: true
        why: |
          The materials state exemplary damages are awarded to punish the defendant where their conduct was particularly egregious.
      - text: |
          To provide only a small, nominal, token sum reflecting the fact that no real harm occurred to the plaintiff.
        correct: false
        why: |
          A nominal, token sum for the absence of real harm describes nominal damages, not exemplary damages.
      - text: |
          To restore the plaintiff, as precisely as money can, to the position they were in immediately before the tort.
        correct: false
        why: |
          Restoring the plaintiff to their prior position is the aim of compensatory damages; exemplary damages instead focus on punishing the defendant.
  - key: rem11
    type: mcq
    concept: remedies-intentional-torts-to-person
    difficulty: 2
    variant-of: rem10
    stem: |
      A defendant commits a serious, unprovoked assault purely to intimidate a group of people, showing a flagrant disregard for the plaintiff's rights. Besides compensating the plaintiff, what additional purpose might further damages serve here?
    options:
      - text: |
          Punishing the defendant for particularly egregious conduct, through exemplary damages.
        correct: true
        why: |
          Flagrant, egregious conduct of this kind is exactly the situation exemplary damages are designed to punish, over and above compensating the plaintiff's own loss.
      - text: |
          Compensating the plaintiff a second, separate time for the very same physical injury already covered by the first award.
        correct: false
        why: |
          Damages are not awarded twice over for the identical loss; exemplary damages serve the distinct purpose of punishment, not double compensation.
      - text: |
          Restoring the defendant's own personal or professional reputation within their local community after the finding of liability.
        correct: false
        why: |
          Damages awarded against a defendant are not aimed at restoring the defendant's own reputation; that would run contrary to the punitive purpose of exemplary damages.
      - text: |
          Providing the defendant with a small, token, nominal payment in recognition of the seriousness of what occurred.
        correct: false
        why: |
          Nominal damages are for cases lacking real harm; egregious, deliberate misconduct instead attracts exemplary damages, which are punitive rather than nominal.
  - key: rem12
    type: mcq
    concept: remedies-intentional-torts-to-person
    difficulty: 2
    stem: |
      Can more than one head of damages (eg compensatory and aggravated) be awarded for the same intentional tort to the person?
    options:
      - text: |
          No — only a single head of damages can ever be awarded for any one particular tort claim, however the facts arise.
        correct: false
        why: |
          This is incorrect; the materials describe damages as potentially nominal, compensatory, aggravated and/or exemplary, indicating more than one head can apply together.
      - text: |
          Yes — different heads address different aspects of the wrong and can be awarded together.
        correct: true
        why: |
          The "and/or" language in the materials shows multiple heads, such as compensatory plus aggravated or exemplary, can be awarded together for the one tort.
      - text: |
          Yes, but only where the plaintiff has chosen to sue the same defendant in two entirely separate court proceedings.
        correct: false
        why: |
          There is no requirement of separate proceedings; multiple heads can be awarded within the one action.
      - text: |
          No — an award of aggravated damages and an award of exemplary damages are always mutually exclusive of one another.
        correct: false
        why: |
          Nothing in the materials suggests aggravated and exemplary damages are mutually exclusive; they respond to different aspects and can coexist.
  - key: rem13
    type: mcq
    concept: remedies-intentional-torts-to-person
    difficulty: 3
    stem: |
      A defendant, having committed a minor, technical trespass to P's person that caused no real harm at all, offers no apology and shows no particular malice. Which damages type best fits?
    options:
      - text: |
          Nominal damages, since the tort is established with no real harm and nothing egregious about the conduct.
        correct: true
        why: |
          This scenario — a tort made out but with no real harm and nothing egregious about the conduct — is the paradigm case for nominal damages.
      - text: |
          Exemplary damages, on the basis that any trespass to the person at all inherently deserves some form of punishment.
        correct: false
        why: |
          Exemplary damages require particularly egregious conduct, which is absent from a minor, non-malicious technical trespass.
      - text: |
          Aggravated damages, simply because the defendant failed to offer any apology to the plaintiff afterwards.
        correct: false
        why: |
          A mere failure to apologise, without deliberate conduct causing a real affront, does not meet the higher threshold for aggravated damages.
      - text: |
          Compensatory damages calculated at the maximum available amount, because trespass to the person is actionable per se.
        correct: false
        why: |
          Being actionable per se explains why some damages are available despite no proven harm, but the amount should reflect the absence of real loss.
  - key: rem14
    type: mcq
    concept: remedies-intentional-torts-to-person
    difficulty: 2
    stem: |
      In an ILAC-style answer, at what stage should remedies typically be addressed?
    options:
      - text: |
          Before identifying which tort applies at all, since the remedy sought is what determines the cause of action to plead.
        correct: false
        why: |
          This reverses the logical order; the applicable tort and its elements must be established first, before considering what remedy follows.
      - text: |
          After liability is established, by considering which heads of damages are engaged.
        correct: true
        why: |
          This reflects the materials' guidance that, after establishing liability, students should address remedy separately by identifying which heads are engaged.
      - text: |
          Remedies never need to be addressed as a separate step, since they are simply assumed automatically once liability is found.
        correct: false
        why: |
          The materials specifically caution against assuming compensatory damages are the only available award — remedies should be addressed as a distinct step.
      - text: |
          Only where the problem-question facts specifically and expressly ask the student to consider exemplary damages.
        correct: false
        why: |
          Remedies should be considered generally as a distinct step in the analysis, not only when a specific type is expressly requested.
  - key: rem15
    type: mcq
    concept: remedies-intentional-torts-to-person
    difficulty: 2
    stem: |
      Which four heads of damages for intentional torts to the person are identified in the materials?
    options:
      - text: |
          Nominal, compensatory, aggravated and exemplary.
        correct: true
        why: |
          These are exactly the four heads of damages identified in the materials.
      - text: |
          Nominal, punitive, restitutionary and equitable damages, as these terms are used across the general law of remedies.
        correct: false
        why: |
          This mixes in terms not used as the four heads in the materials, which specifically name nominal, compensatory, aggravated and exemplary.
      - text: |
          Compensatory, consequential, incidental and special damages, borrowing the categories more familiar from contract law.
        correct: false
        why: |
          These contract-law damages categories are not the four heads identified for intentional torts to the person in the materials.
      - text: |
          General, special, aggravated and liquidated damages, as these categories are sometimes used in other contexts.
        correct: false
        why: |
          "General", "special" and "liquidated" are not the terminology used; the materials specifically identify nominal, compensatory, aggravated and exemplary damages.
  - key: rem16
    type: mcq
    concept: remedies-intentional-torts-to-person
    difficulty: 3
    stem: |
      D deliberately and viciously assaults P in public specifically to humiliate P, causing P a broken nose (requiring medical treatment) and significant embarrassment; D's conduct is found to be flagrant and outrageous. Which combination of damages heads is most likely to be engaged?
    options:
      - text: |
          Compensatory damages for the physical injury, aggravated damages for the humiliation, and possibly exemplary damages for the outrageous conduct.
        correct: true
        why: |
          Each head responds to a different aspect of the facts: real loss (compensatory), the deliberate affront to dignity (aggravated), and the egregious conduct (exemplary).
      - text: |
          Nominal damages only, on the basis that the tort of battery is, generally speaking, actionable per se regardless of the facts.
        correct: false
        why: |
          Nominal damages are for cases with no real harm; here there is significant physical injury and outrageous conduct, calling for a fuller combination.
      - text: |
          An injunction only, with a view to preventing any similar recurrence of this kind of conduct by D in the future.
        correct: false
        why: |
          An injunction addresses anticipated future torts; it does not compensate for or punish a battery that has already occurred and caused real injury.
      - text: |
          Exemplary damages only, simply because the court specifically found D's conduct to have been outrageous in nature.
        correct: false
        why: |
          While exemplary damages may well be engaged given the outrageous conduct, the real loss still needs compensatory damages and the humiliation needs aggravated damages.
  - key: rem17
    type: truefalse
    concept: remedies-intentional-torts-to-person
    difficulty: 2
    set: quickfire
    statement: |
      Because trespass to the person is actionable per se, a plaintiff can never receive more than nominal damages.
    answer: false
    why: |
      Actionable per se only means the plaintiff need not prove damage to succeed; where real harm is proved, compensatory, aggravated or exemplary damages can also be awarded.
  - key: rem18
    type: truefalse
    concept: remedies-intentional-torts-to-person
    difficulty: 1
    set: quickfire
    statement: |
      Exemplary damages are designed to punish the defendant, while compensatory damages are designed to restore the plaintiff to their pre-tort position.
    answer: true
    why: |
      This correctly distinguishes the punitive purpose of exemplary damages from the restorative purpose of compensatory damages.
  - key: rem19
    type: truefalse
    concept: remedies-intentional-torts-to-person
    difficulty: 2
    set: quickfire
    statement: |
      An injunction can only be granted after a tort has already been completed, never to prevent one.
    answer: false
    why: |
      An injunction may be issued in suitable cases to prevent an anticipated tort, such as a threatened battery, from taking place at all.
  - key: rem20
    type: short
    concept: remedies-intentional-torts-to-person
    difficulty: 3
    prompt: |
      P is assaulted and then battered by D in front of a large crowd, in a manner clearly intended to humiliate P; P suffers a minor bruise but significant embarrassment, and D's conduct is found by the court to be flagrant and contemptuous of P's rights. Advise on the damages that might be available to P.
    model: |
      Because assault and battery are actionable per se, P need not prove any specific loss to succeed; if the physical harm were negligible, nominal damages alone might be appropriate, but that is unlikely to be the full picture here. Compensatory damages would address any real, if minor, physical loss (the bruise and any associated minor treatment costs), aiming to put P back in the position they would have been in had the torts not occurred. Because D's conduct was deliberate and specifically intended to humiliate P in front of a crowd, aggravated damages are also engaged: they respond to deliberate conduct of the defendant that results in an affront to the plaintiff, over and above the physical loss itself, compensating P's injured feelings and public humiliation. Finally, because the court found D's conduct flagrant and contemptuous, exemplary damages may also be awarded; unlike the other heads, these do not compensate P at all but instead punish D for conduct that is particularly egregious. These heads are not mutually exclusive, and P's advisers should argue for compensatory, aggravated and exemplary damages together, tailored to the different aspects of D's wrongdoing.
    rubric:
      - id: r1
        criterion: |
          Correctly identifies that assault/battery are actionable per se
        marks: 1
        top-band: |
          Notes P need not prove loss to succeed, distinguishing nominal damages from other heads.
        margin-note: |
          Good foundational point.
        authorities: []
      - id: r2
        criterion: |
          Applies compensatory and aggravated damages to the facts
        marks: 2
        top-band: |
          Ties compensatory damages to the physical loss and aggravated damages specifically to the deliberate, humiliating manner of the conduct.
        margin-note: |
          Clear separation of the two heads — well done.
        authorities: []
      - id: r3
        criterion: |
          Applies exemplary damages and explains its distinct punitive purpose
        marks: 1
        top-band: |
          Explains exemplary damages punish flagrant, egregious conduct rather than compensating P, and are not mutually exclusive with the other heads.
        margin-note: |
          Good — captures the punitive purpose.
        authorities: []
  - key: ttg01
    type: mcq
    concept: trespass-to-goods
    difficulty: 1
    set: pretest
    stem: |
      Which of the following is NOT a characteristic of a chattel, as described in the materials?
    options:
      - text: |
          Tangible.
        correct: false
        why: |
          Chattels are described in the materials as tangible, physically graspable goods.
      - text: |
          Permanently attached to land, such as a building.
        correct: true
        why: |
          Chattels specifically exclude fixtures such as buildings or equipment permanently attached to land.
      - text: |
          Movable.
        correct: false
        why: |
          Chattels are described in the materials as movable, unlike land or fixtures.
      - text: |
          Transferable by delivery.
        correct: false
        why: |
          Chattels are described as transferable by delivery, unlike interests in land.
  - key: ttg02
    type: mcq
    concept: trespass-to-goods
    difficulty: 2
    stem: |
      What must a plaintiff prove to establish trespass to goods?
    options:
      - text: |
          A direct interference with a chattel that was in the plaintiff's actual possession at the time of the interference.
        correct: true
        why: |
          This is the single stated element for trespass to goods in the materials.
      - text: |
          That the plaintiff was the registered legal owner of the chattel at the exact time of the interference.
        correct: false
        why: |
          Ownership is not the test — possession, not ownership, is what trespass to goods protects.
      - text: |
          That the plaintiff suffered some real, provable financial damage to the chattel as a direct result.
        correct: false
        why: |
          No proof of actual damage is generally required, since the action is in trespass.
      - text: |
          That the defendant specifically intended to permanently deprive the plaintiff of the chattel altogether.
        correct: false
        why: |
          There is no requirement of an intention to permanently deprive; a direct interference with a possessed chattel is enough.
  - key: ttg03
    type: mcq
    concept: trespass-to-goods
    difficulty: 2
    variant-of: ttg02
    stem: |
      D briefly, without permission, moves P's parked bicycle a few metres to access a doorway, and returns it undamaged minutes later. Could this be trespass to goods, even though P suffered no financial loss?
    options:
      - text: |
          Yes — moving P's bicycle is a direct interference with a chattel P possessed, and no proof of damage need be shown.
        correct: true
        why: |
          Moving the bicycle is a direct interference with a chattel P possessed; the tort does not generally require proof of damage.
      - text: |
          No — without proof of some resulting financial loss, there can never be a valid claim in trespass to goods.
        correct: false
        why: |
          Financial loss is not required; trespass to goods does not generally require proof of actual damage at all.
      - text: |
          No — moving a chattel only briefly and for a short distance can never amount to a direct interference in law.
        correct: false
        why: |
          A brief, direct physical interference is exactly the kind of conduct trespass to goods addresses; brevity does not remove liability.
      - text: |
          Yes, but only if P can additionally show that D specifically intended to permanently steal the bicycle.
        correct: false
        why: |
          No intention to steal or permanently deprive is required for trespass to goods; a direct interference with possession is sufficient.
  - key: ttg04
    type: mcq
    concept: trespass-to-goods
    difficulty: 2
    stem: |
      Why is possession, rather than ownership, the key concept for trespass to goods?
    options:
      - text: |
          Trespass to goods protects the plaintiff's possessory interest at the time of interference, not their underlying ownership.
        correct: true
        why: |
          The materials specifically state possession is different from ownership and is critical to trespass to goods, which protects possession.
      - text: |
          Because ownership is, generally speaking, legally impossible to prove in the vast majority of cases involving goods.
        correct: false
        why: |
          Ownership is not inherently harder to prove; the reason possession matters is that trespass to goods specifically protects the possessory interest.
      - text: |
          Because only a person who happens to be the owner of a chattel can ever be sued as a defendant in trespass to goods.
        correct: false
        why: |
          The identity of the defendant is unrelated to this distinction; the point is about what interest of the plaintiff the tort protects.
      - text: |
          Because possession and ownership will, as a matter of law, always necessarily coincide in one and the same person.
        correct: false
        why: |
          They frequently do not coincide, as Penfolds Wines Pty Ltd v Elliott shows — the owner was not the possessor at the relevant time.
  - key: ttg05
    type: mcq
    concept: trespass-to-goods
    difficulty: 2
    stem: |
      What are the two elements of possession described in the materials?
    options:
      - text: |
          An intention to exercise control and exclude others, and actual control.
        correct: true
        why: |
          This matches the two elements of possession stated in the materials.
      - text: |
          Formal legal title to the chattel, together with a valid and binding contract of sale for that chattel.
        correct: false
        why: |
          Legal title and a contract of sale relate to ownership or acquisition, not the two elements of possession described here.
      - text: |
          Mere physical proximity to the chattel, together with a reasonable subjective belief that one owns it.
        correct: false
        why: |
          Neither proximity nor a belief of ownership is identified as an element of possession in the materials.
      - text: |
          Formal registration of the chattel with an appropriate authority, together with payment of any associated fee.
        correct: false
        why: |
          Registration and fees are not part of the stated test for possession.
  - key: ttg06
    type: mcq
    concept: trespass-to-goods
    difficulty: 3
    cases: [penfolds-wines-pty-ltd-v-elliott]
    stem: |
      In Penfolds Wines Pty Ltd v Elliott, why did the trespass to goods claim fail?
    options:
      - text: |
          Penfolds was not in possession of the bottles at the relevant time — Elliott, as sub-bailee, was the one in possession.
        correct: true
        why: |
          Dixon J's reasoning was that there was no infringement of anyone's possession, because Elliott, not Penfolds, was in possession of the bottles at the time.
      - text: |
          Because the wine bottles in question were not, in law, properly considered to be chattels at all.
        correct: false
        why: |
          The bottles were plainly chattels (tangible, movable goods); the trespass claim failed for a possession reason, not a chattel-definition reason.
      - text: |
          Because Penfolds was ultimately unable to prove that Elliott had acted either intentionally or negligently.
        correct: false
        why: |
          The case did not turn on Elliott's intention; it turned on the fact that Penfolds lacked possession of the bottles at the relevant time.
      - text: |
          Because there was, on the facts as found by the court, no direct interference with the bottles at all.
        correct: false
        why: |
          There plainly was direct interference (Elliott filled and used the bottles); the problem for Penfolds was that it was not the party in possession.
  - key: ttg07
    type: mcq
    concept: trespass-to-goods
    difficulty: 3
    variant-of: ttg06
    cases: [penfolds-wines-pty-ltd-v-elliott]
    stem: |
      P lends a specific tool to Q, who then lends it on to R without P's knowledge. R damages the tool while using it. Applying the reasoning in Penfolds Wines Pty Ltd v Elliott, can P sue R in trespass to goods?
    options:
      - text: |
          Not straightforwardly — R (not P) was the one in possession when the interference occurred, as in Penfolds.
        correct: true
        why: |
          As in Penfolds Wines Pty Ltd v Elliott, a bailment chain can put someone other than the original owner in possession at the relevant time, making a straightforward claim by P difficult.
      - text: |
          Yes — because P is the owner of the tool, and ownership alone is, in every case, always sufficient for a claim in trespass to goods.
        correct: false
        why: |
          Penfolds Wines Pty Ltd v Elliott shows ownership alone is not sufficient; possession at the time of interference is what trespass to goods protects.
      - text: |
          Yes — simply because Q had no actual right or authority to lend the tool on to R in the first place.
        correct: false
        why: |
          Whether Q had authority to sub-lend may matter to other claims, but the trespass analysis still turns on who had possession at the time of interference.
      - text: |
          No — trespass to goods can never, under any circumstances, apply where a chattel has at some point been lent to anyone.
        correct: false
        why: |
          Trespass to goods can still apply within a bailment chain in some circumstances, such as where a bailee completely destroys the goods.
  - key: ttg08
    type: mcq
    concept: trespass-to-goods
    difficulty: 2
    cases: [penfolds-wines-pty-ltd-v-elliott]
    stem: |
      According to Dixon J in Penfolds Wines Pty Ltd v Elliott, is there ever an exception allowing a bailor to sue a bailee in trespass?
    options:
      - text: |
          No — a bailor can never, in any circumstances at all, bring a claim in trespass against their own bailee.
        correct: false
        why: |
          Dixon J specifically noted an exception, so this overstates the rule as absolute.
      - text: |
          Yes — for example, where the bailee has completely destroyed the goods.
        correct: true
        why: |
          This reflects Dixon J's noted exception: a bailor may sue for trespass where the bailee has completely destroyed the goods.
      - text: |
          Yes, but only where the underlying bailment agreement between the parties happens to be recorded in writing.
        correct: false
        why: |
          The exception noted by Dixon J concerns complete destruction of the goods, not the form of the bailment agreement.
      - text: |
          Yes, but only in cases where the bailee in question happens to be a corporation rather than an individual.
        correct: false
        why: |
          There is no such limitation based on the bailee's corporate status; the exception concerns complete destruction of the goods.
  - key: ttg09
    type: mcq
    concept: trespass-to-goods
    difficulty: 2
    cases: [national-crime-authority-v-flack]
    stem: |
      What did National Crime Authority v Flack establish about a finder's ability to sue for interference with goods?
    options:
      - text: |
          A finder can never, under any circumstances, sue anyone at all for interference with goods they have found.
        correct: false
        why: |
          This is the opposite of the actual holding — the finder was held to have possessory rights against everyone except the true owner.
      - text: |
          A finder/occupier has possession in law of chattels on the premises, enforceable against everyone but the true owner.
        correct: true
        why: |
          This is exactly what the court held in National Crime Authority v Flack.
      - text: |
          A finder must first formally register the goods found with the relevant authorities before acquiring any possessory rights at all.
        correct: false
        why: |
          No such registration requirement is mentioned; possession in law arose simply from being the occupier holding the goods.
      - text: |
          A finder's possessory rights are, for all legal purposes, exactly equal to a true owner's full rights of ownership.
        correct: false
        why: |
          The finder's rights are possessory and only prevail against everyone except the true owner — they do not equate to the true owner's own rights.
  - key: ttg10
    type: mcq
    concept: trespass-to-goods
    difficulty: 2
    variant-of: ttg09
    cases: [national-crime-authority-v-flack]
    stem: |
      P finds an expensive watch left behind in a hotel room P is occupying and keeps it safe in a drawer. A hotel cleaner, Q, later takes the watch for themselves without P's knowledge. Applying National Crime Authority v Flack, could P sue Q for interference with the watch, even though P does not own it?
    options:
      - text: |
          Yes — as occupier holding the watch, P has possession in law good against everyone except the true owner, under National Crime Authority v Flack.
        correct: true
        why: |
          As in National Crime Authority v Flack, the occupier/finder has possessory rights good against everyone but the true owner, which would include Q here.
      - text: |
          No — only the true owner of the watch is ever entitled, as a matter of law, to sue anyone at all for its interference.
        correct: false
        why: |
          National Crime Authority v Flack specifically allows the finder/occupier to sue everyone except the true owner, not only the true owner themselves.
      - text: |
          No — P would first need to formally prove ownership of the watch before being entitled to sue anyone over it.
        correct: false
        why: |
          Ownership is not required; possession in law, as established in National Crime Authority v Flack, is sufficient against anyone other than the true owner.
      - text: |
          Yes, but only if P had first registered the discovery of the watch with the hotel management or the police.
        correct: false
        why: |
          No such registration step is required by the case; possession in law arose simply from P's occupation and holding of the watch.
