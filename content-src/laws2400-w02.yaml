        correct: false
        why: |
          Damage is a core element of the cause of action itself, not merely a precondition for a particular type of remedy.
      - text: |
          Because trespass to the person also always requires the plaintiff to prove damage before any claim can succeed.
        correct: false
        why: |
          This is incorrect — trespass to the person is actionable per se and needs no proof of damage; it is malicious prosecution that requires it.
      - text: |
          Because the defendant's malice, once proved, is treated in law as automatically and necessarily causing damage.
        correct: false
        why: |
          Malice and damage are separate elements that must each be independently proved, not one automatically producing the other.
  - key: aoc12
    type: mcq
    concept: action-on-the-case-intentional-harm
