    type: mcq
    concept: trespass-to-goods
    difficulty: 2
    stem: |
      Must a plaintiff prove actual damage to succeed in trespass to goods?
    options:
      - text: |
          Yes, always — without proof of some actual damage, a claim in trespass to goods will automatically and inevitably fail.
        correct: false
        why: |
          This is incorrect; the materials state that, since the action is in trespass, no proof of actual damage is generally required.
      - text: |
          No — since the action is one in trespass, no proof of actual damage is generally required at all.
        correct: true
        why: |
          This directly matches the stated principle for trespass to goods.
      - text: |
          Only where the particular chattel interfered with happens to be a valuable or expensive one.
        correct: false
        why: |
          There is no value threshold mentioned; the general rule is that damage need not be proved regardless of the chattel's value.
      - text: |
          Only where the interference in question was carried out intentionally rather than merely negligently.
        correct: false
        why: |
          The "no damage needed" rule is not conditioned on the type of fault; it applies generally to trespass to goods.
  - key: ttg12
    type: mcq
    concept: trespass-to-goods
    difficulty: 2
    stem: |
      Which of the following is given in the materials as an example of a chattel?
    options:
      - text: |
          A building permanently attached to land.
        correct: false
        why: |
          Buildings and fixtures permanently attached to land are expressly excluded from being chattels.
      - text: |
          A pet animal.
        correct: true
