  - key: aoc20
    type: short
    concept: action-on-the-case-intentional-harm
    difficulty: 3
    cases: [a-v-new-south-wales, wilkinson-v-downton, nationwide-news-v-naidu]
    prompt: |
      A café owner, angry after a dispute with a former employee, falsely tells police the employee stole cash from the till, despite having no real evidence and no honest belief the accusation is true. The employee is charged, and the charges are later withdrawn for lack of evidence. Separately, the owner also spreads a rumour among staff that the employee's partner has been badly hurt in an accident, purely as a spiteful joke, causing the employee genuine psychiatric shock. Advise the employee on possible actions on the case against the owner.
    model: |
      Two separate actions on the case arise. First, malicious prosecution requires that the defendant initiated proceedings, they terminated in the plaintiff's favour, the defendant acted maliciously, and acted without reasonable and probable cause; damage must also be shown because the tort is not actionable per se. The owner initiated the theft complaint, the charges were withdrawn (favourable termination), the owner acted maliciously (spite, no honest belief), and there was an absence of reasonable and probable cause (no real evidence) — following A v New South Wales, both malice and absence of reasonable and probable cause must be separately established, and both appear present here, alongside reputational damage. Second, the spiteful rumour about the employee's partner mirrors Wilkinson v Downton: a wilful act (spreading the false, shocking rumour) calculated to cause harm, which did cause psychiatric shock. Even though the owner may not have specifically intended psychiatric injury, Nationwide News v Naidu confirms reckless indifference to the result suffices. The employee therefore has strong grounds for both malicious prosecution and intentional infliction of personal injury.
    rubric:
      - id: r1
        criterion: |
          Identifies and applies all four elements of malicious prosecution
        marks: 2
        top-band: |
          Applies initiation, favourable termination, malice and absence of reasonable and probable cause to the theft complaint, citing A v New South Wales for the malice/cause distinction.
        margin-note: |
          Full marks need all four elements applied, not just listed.
        authorities: []
      - id: r2
        criterion: |
          Identifies and applies the Wilkinson v Downton tort to the rumour
        marks: 2
        top-band: |
          Explains the wilful-act-calculated-to-cause-harm test and applies it to the spiteful rumour causing psychiatric shock.
        margin-note: |
          Good spotting of the second, separate cause of action.
        authorities: []
      - id: r3
        criterion: |
          Applies the Nationwide News v Naidu fault standard
        marks: 1
        top-band: |
          Notes reckless indifference suffices even without a specific subjective intention to cause psychiatric harm.
        margin-note: |
          Nice — often missed.
        authorities: []
  - key: rem01
    type: mcq
    concept: remedies-intentional-torts-to-person
    difficulty: 1
    stem: |
      What is described as the most common remedy for intentional interference with the person?
    options:
      - text: |
          An injunction.
        correct: false
        why: |
          An injunction is available in suitable cases, such as to prevent an anticipated tort, but is not described as the most common remedy.
      - text: |
          Damages, the usual remedy.
        correct: true
        why: |
          The materials state damages are the most common remedy for intentional interference with the person.
      - text: |
          Specific performance.
        correct: false
        why: |
          Specific performance is a contract remedy; it is not mentioned as a remedy for intentional torts to the person.
      - text: |
          Restitution for unjust enrichment.
        correct: false
        why: |
          Restitution is not identified as a remedy for these torts in the materials; damages are the primary remedy.
  - key: rem02
    type: mcq
    concept: remedies-intentional-torts-to-person
    difficulty: 2
    stem: |
      When might an injunction be granted in the context of intentional interference with the person?
    options:
      - text: |
          To compensate the plaintiff financially for injuries and losses they have already suffered from a past tort.
        correct: false
        why: |
          Compensating for injuries already suffered is the role of compensatory damages, not an injunction.
      - text: |
          To prevent an anticipated tort, such as a threatened battery, from occurring.
        correct: true
        why: |
          The materials state an injunction may be issued in suitable cases to prevent an anticipated tort, such as battery, from occurring.
      - text: |
          To punish the defendant specifically for conduct found by the court to be particularly egregious.
        correct: false
        why: |
          Punishing the defendant is the role of exemplary damages, not an injunction.
      - text: |
          To restore the defendant's own reputation after being found liable in an intentional tort claim.
        correct: false
        why: |
          An injunction in this context protects the plaintiff from anticipated harm; it is not directed at restoring the defendant's reputation.
  - key: rem03
    type: mcq
    concept: remedies-intentional-torts-to-person
    difficulty: 2
    variant-of: rem02
    stem: |
      P discovers that D has told several people D intends to physically confront and strike P at an upcoming event. No contact has occurred yet. What remedy might P seek to prevent this?
    options:
      - text: |
          An injunction to prevent the anticipated battery from taking place.
        correct: true
        why: |
          This is precisely the situation described where an injunction may be issued to prevent an anticipated tort, such as a threatened battery.
      - text: |
          Exemplary damages only, on the basis that no tort has actually occurred yet on these facts.
        correct: false
        why: |
          Damages, including exemplary damages, compensate for or punish conduct that has already occurred; they cannot themselves prevent a future event.
      - text: |
          Nominal damages, simply to formally record that a tort has technically already occurred between the parties.
        correct: false
        why: |
          No tort has occurred yet on these facts, so nominal damages, which follow an established but harmless tort, are not the appropriate remedy here.
      - text: |
          Aggravated damages, on the basis that the threat made by D was clearly a deliberate one.
        correct: false
        why: |
          Aggravated damages respond to deliberate conduct that has already caused an affront; they do not operate prospectively to prevent a threatened tort.
  - key: rem04
    type: mcq
    concept: remedies-intentional-torts-to-person
