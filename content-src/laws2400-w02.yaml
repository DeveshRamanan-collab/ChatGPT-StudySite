        correct: false
        why: |
          This ignores the separate requirement of absence of reasonable and probable cause, which A v New South Wales confirms must independently be proved.
      - text: |
          No — a personal grudge of this kind can never, as a matter of law, amount to malice for these purposes.
        correct: false
        why: |
          An illegitimate purpose, such as settling a personal grudge, is a clear example of malice; the issue here is the separate reasonable and probable cause element.
      - text: |
          Yes, simply because D's belief, although reasonably held, ultimately turned out to be a mistaken one.
        correct: false
        why: |
          A reasonable, genuinely held belief in guilt points toward reasonable and probable cause existing, which would defeat rather than support the claim.
  - key: aoc06
    type: mcq
    concept: action-on-the-case-intentional-harm
