          Assault requires apprehension of imminent physical contact; being locked in with no threat of contact does not engage this element at all.
      - text: |
          False imprisonment — total restraint of liberty needs no threat of contact.
        correct: true
        why: |
          False imprisonment protects liberty, not bodily integrity — total restraint without lawful justification is enough, unlike assault.
      - text: |
          Battery, because the act of locking a door is itself treated in law as a form of direct physical contact with P.
        correct: false
        why: |
          Locking a door does not involve physical contact with P's body; battery requires contact with the plaintiff's own person.
      - text: |
          No tort at all, since P was at no point either physically touched or verbally threatened by the guard.
        correct: false
        why: |
          This wrongly assumes physical contact or threats are required; false imprisonment protects liberty through total restraint alone.
  - key: fi15
    type: mcq
    concept: false-imprisonment
    difficulty: 2
    stem: |
      Which combination correctly lists all the elements of false imprisonment?
    options:
