week_file:
  topic: Trespass to the person and interference with goods
  summary: |
    This week covers the intentional torts that protect bodily integrity and liberty — battery, assault and
    false imprisonment — the action on the case for malicious prosecution and intentional infliction of harm,
    and the torts protecting goods: trespass to chattels, conversion and detinue. Every intentional tort to the
    person shares four general requirements — a voluntary positive act, direct interference, fault, and no need
    to prove damage because the torts are actionable per se — while trespass to goods and conversion turn on who
    had possession, or the right to it, at the time of interference. For the exam, ILAC answers turn on picking
    the tort that fits the facts and on the leading Australian authority for the element in dispute.
  notes: |
    ## Overview

    - Trespass to the person – battery, assault and false imprisonment – protects bodily integrity and liberty.
    - Action on the case for intentional harm – malicious prosecution and intentional infliction of personal
      injury – catches indirect harm trespass cannot reach.
    - Remedies for intentional interference with the person.
    - Interference with chattels – trespass to goods, conversion and detinue.
    - These torts matter well beyond textbook facts: bullying, domestic violence, medical treatment and police
      action are all real settings where they apply.

    ## General principles of trespass to the person

    :::rule
    General principles applicable to all intentional torts to the person: the defendant must commit a voluntary
    act (an omission will not suffice); the interference must follow directly upon the defendant's act; the torts
    are actionable per se, so the plaintiff does not need to prove damage; and the plaintiff must prove fault —
    intentional, reckless or negligent conduct on the part of the defendant.
    :::

    Except in highway cases, the onus is on the defendant to prove that the act was neither intentional nor
    negligent.

    ## Battery

    Battery is a direct and intentional or negligent act of the defendant which causes physical contact with the
    body of the plaintiff without consent or other lawful justification.

    The key elements: voluntary and positive act; direct interference; intentional or negligent contact; physical
    interference (bodily contact); unlawful touching (no consent or other lawful excuse).

    :::case
    *Innes v Wylie* (1844) 174 ER 800 — a police officer standing passively in a doorway committed no battery;
    standing passively is not a positive act.
    :::

    :::case
    *Fagan v Metropolitan Police Commissioner* [1969] 1 QB 439 — the defendant's failure to move a car off an
    officer's foot was still a positive act, because of its nexus with the earlier positive act of driving onto
    the foot — one continuous positive act.
    :::

    Physical interference need not be the defendant's own body touching the plaintiff — contact through a weapon
    or a car, or the use of tear gas that touches the plaintiff's eyes, is enough (*Binsaris v Northern Territory*
    (2020) 270 CLR 549).

    :::definition
    Unlawful touching: the touching need not be hostile — any slight touching without a lawful excuse will
    suffice, on the principle of personal inviolability. Express or implied consent, the exigencies of everyday
    life, and reasonable force in self-defence will not amount to unlawful touching.
    :::

    :::case
    *Rixon v Star City Pty Ltd* (2001) 53 NSWLR 98 — the Court of Appeal held that the absence of anger or
    hostility is not a satisfactory basis for concluding a touching was not a battery; a casino employee's hand on
    Rixon's shoulder, placed only to gain his attention, was within the physical contact generally acceptable in
    the ordinary conduct of daily life, so no battery was made out.
    :::

    :::examtip
    Is there battery in: tapping a shoulder to attract attention; touching someone with a paper rocket; conducting
    surgery without consent? Run each through all five elements — the last two usually turn on unlawful touching.
    :::

    ## Assault

    Assault is a direct and intentional act by the defendant which creates in the plaintiff a reasonable
    apprehension of an imminent physical interference with their person.

    Elements: positive act; direct interference; intentional act; reasonable apprehension in the plaintiff of
    imminent harmful or offensive contact; no lawful justification.

    The intention required is the intention to cause apprehension of the battery, not the intention to commit the
    battery itself (*Rixon v Star City Pty Ltd* (2001) 53 NSWLR 98 [56]–[59]). The act may be mere words or a
    gesture. The weight of Australian authority is that assault requires intention, though *New South Wales v
    McMaster* [2015] NSWCA 228 [206]–[208] contains dicta suggesting a negligence basis may also do.

    Reasonable apprehension focuses on the plaintiff's mind, but the test is objective: would a reasonable person
    in the plaintiff's position have apprehended the threat? Fear is not necessary, and words alone suffice
    provided they directly raise the apprehension in the plaintiff's mind.

    :::case
    *Zanker v Vartzokas* (1988) 34 A Crim R 11 — the defendant, driving a girl in his van after she declined his
    offer of money for sexual favours, told her he was taking her to a friend who would "really fix her up"; the
    threat was held sufficiently imminent even though the harm was not to occur that instant, because imminence
    does not require immediacy.
    :::

    Battery and assault often occur in quick succession, but assault requires no touching and can occur without
    any battery; battery, on the other hand, will often — but not always — involve an assault.

    :::examtip
    Would the following be assault: pointing a toy gun at someone; texting an ex-partner "I'm gonna get you fixed
    up!"; raising a fist to punch someone who cannot see it, behind their back? Check apprehension and imminence
    separately — an unseen threat usually fails on apprehension.
    :::

    ## False imprisonment

    False imprisonment is the direct total restraint of the liberty of the plaintiff by an intentional or
    negligent act of the defendant without lawful justification.

    Elements: positive act; direct interference; intentional or negligent act; total restraint of the plaintiff's
    liberty without lawful justification.

    A plaintiff can be totally imprisoned without any physical boundaries, and may be falsely imprisoned even
    without knowing it at the time. Directness includes a defendant who directs, promotes or causes another
    person to detain the plaintiff, not only one who detains personally.

    :::rule
    The deprivation of liberty must be total — there must be no reasonable means of escape. A conditional entry
    onto premises, such as being required to pay a further fee before leaving, gives a lawful excuse that defeats
    the claim.
    :::

    :::case
    *Balmain New Ferry v Robertson* (1906) 4 CLR 379 — a passenger who missed his ferry was not allowed to leave
    the wharf without paying a further penny; the court held there was no false imprisonment because his entry was
    conditional, which gave the ferry company a lawful excuse.
    :::

    An intentional act of imprisonment can still attract liability even where the defendant acted under a
    reasonable but mistaken belief that they were acting lawfully.

    ## Action on the case for intentional interference

    In contrast to trespass, an action on the case may lie for malicious prosecution or for intentional (indirect)
    interference with the person.

    :::definition
    Malicious prosecution: procuring, with malice, the prosecution of another person. Elements: the defendant
    initiated proceedings against the plaintiff; the proceedings terminated in the plaintiff's favour; the
    defendant acted maliciously in initiating them; and the defendant acted without reasonable and probable cause.
    Because it is an action on the case, the plaintiff must also show damage to life, liberty, reputation or
    property.
    :::

    :::case
    *A v New South Wales* (2007) 230 CLR 500 — a police detective initiated a prosecution he felt pressured into
    bringing; the High Court held that malice (a positive element, such as acting for a non-legitimate purpose)
    and the absence of reasonable and probable cause (a negative element, tested both subjectively and
    objectively) are distinct requirements that must both be satisfied.
    :::

    Intentional infliction of personal injury covers intentional but indirect infliction of harm, filling the gap
    where neither trespass (which needs directness) nor negligence provides an adequate remedy.

    :::case
    *Wilkinson v Downton* [1897] 2 QB 57 — a practical joke telling the plaintiff her husband had been smashed up
    in an accident triggered nervous shock; the court held the cause of action lies in wilfully doing an act
    calculated to cause physical harm to the plaintiff, and actually causing such harm.
    :::

    :::case
    *Nationwide News v Naidu* (2007) 71 NSWLR 471 — extreme bullying by a superior at work caused major depression
    and post-traumatic stress disorder; the court held an actual subjective intention to harm is not required for
    this tort — reckless indifference to the result will suffice.
    :::

    ## Remedies for intentional interference with the person

    Damages are the most common remedy; an injunction may also be issued in suitable cases to prevent an
    anticipated tort, such as a threatened battery, from taking place.

    Damages may be nominal, compensatory and aggravated and/or exemplary. Nominal damages are likely where no harm
    or damage was caused. Compensatory damages aim to put the plaintiff in the position they would have been in
    had the wrong not occurred. Aggravated damages are awarded for deliberate conduct of the defendant which has
    resulted in an affront to the plaintiff. Exemplary damages are awarded to punish the defendant where the
    conduct was particularly egregious.

    ## Interference with chattels: meaning and trespass to goods

    Chattels are tangible, moveable, visible goods, transferable by delivery — pets, livestock, motor vehicles,
    books, computers, mobile phones and artwork — but not fixtures such as buildings or equipment permanently
    attached to land. There is no property in a dead body (subject to rare exceptions), though stored sperm may
    be protected as a chattel; whether intangible property such as bitcoin, domain names and digital files should
    be protected as chattels remains an open question.

    :::rule
    Trespass to goods requires a direct interference with a chattel in the possession of the plaintiff at the time
    of interference. Since the action is in trespass, no proof of actual damage is generally required.
    :::

    Possession is different from ownership, and is critical to this tort. Possession has two elements: an
    intention to exercise control and exclude others, and actual control.

    :::case
    *Penfolds Wines Pty Ltd v Elliott* (1946) 74 CLR 204 — Penfolds sued Elliott, who used Penfolds's bottles
    (embossed as remaining Penfolds's property, and left with Elliott by his brother) to sell his own wine. The
    trespass claim failed because Penfolds was not in possession of the bottles at the relevant time — Elliott
    was, as sub-bailee. A bailor generally cannot sue a bailee in trespass, though Dixon J noted an exception
    where the bailee has completely destroyed the goods.
    :::

    :::case
    *National Crime Authority v Flack* (1988) 86 FCR 16 — Mrs Flack sued in conversion after the NCA neither
    prosecuted nor returned a briefcase of money found on her premises, after holding it for three years; the
    court held she had possession in law over all chattels on the premises, even ones she was unaware of, giving
    her possessory rights against everyone except the true owner.
    :::

    ## Conversion and detinue

    Conversion evolved from the old action of trover and expanded into an action for any wrongful taking, use or
    destruction of the plaintiff's goods inconsistent with her possessory rights. It is a tort of strict
    liability — good faith or mistake, for example by an auctioneer, is no defence.

    :::rule
    Conversion differs from trespass to goods in two ways: conduct — conversion requires "dealing" with the goods
    (a serious interference amounting to an assertion of dominion contrary to the rights of the person entitled
    to possession), not mere interference with their physical state; and title to sue — trespass needs actual
    possession at the time of interference, while a right to immediate possession will suffice for conversion.
    :::

    To sue for conversion, the plaintiff must have had possession, or the right to immediate possession, when the
    wrongful act was done, and some form of legal (proprietary) title — merely having a contractual right or a
    custody right to possession will not suffice (*Hocking v Director General of the National Archives of
    Australia* [2020] HCA 19).

    :::case
    Continuing *Penfolds Wines Pty Ltd v Elliott* — a majority of the High Court held Elliott's use of Penfolds's
    bottles to hold his own wine was conversion, being inconsistent with Penfolds's dominion over the bottles,
    even though Penfolds lacked possession; Dixon J dissented on this point, describing the use as "temporary and
    harmless" and not serious enough to amount to conversion.
    :::

    :::case
    *Bunnings Group Ltd v CHEP Australia Ltd* (2011) NSWCA 342 — Bunnings used CHEP's timber pallets; the court
    held using the pallets to store or display goods delivered on them was not conversion, but using empty
    pallets to transport Bunnings's own goods was — showing how fine the "serious interference" judgment can be.
    An action in conversion may also be brought where a plaintiff with an immediate right to possession
    unconditionally demands the return of a chattel and the defendant wrongfully refuses.
    :::

    Detinue provides a remedy for the wrongful detention of chattels and, uniquely, lets a court order their
    return (though the order is discretionary). The plaintiff needs only a right to immediate possession, plus
    proof that she made a demand for the goods — specific, clear and unequivocal — and that the defendant
    expressly and wrongfully refused to return them; no actual possession or ownership is required. A refusal made
    to verify the plaintiff's entitlement may be reasonable, and so not wrongful.

concepts:
  - slug: battery
    title: Battery
    visual: palace
    visual-brief: Five gates in a row — positive act, direct, intentional/negligent, bodily contact, unlawful touching — the plaintiff must clear all five.
    related: [assault, false-imprisonment]
    depends-on: []
    contrasts-with: [assault]
    cases: [innes-v-wylie, fagan-v-metropolitan-police-commissioner, binsaris-v-northern-territory, rixon-v-star-city-pty-ltd]
    authorities: []
    verify: false
    body: |
      Battery is a direct and intentional or negligent act of the defendant which causes physical contact with
      the body of the plaintiff without consent or other lawful justification.

      The elements are: a voluntary and positive act by the defendant; direct interference; intentional or
      negligent contact; physical interference (bodily contact); and that the touching was unlawful (no consent
      or other lawful excuse).

      Positive act: trespass cannot generally be committed by omission — standing passively causes no battery
      (*Innes v Wylie*) — but a continuing failure to undo an earlier positive act can itself count as positive
      conduct (*Fagan v Metropolitan Police Commissioner*).

      Physical interference need not be the defendant's own body touching the plaintiff's: contact through a
      weapon, a car or a substance such as tear gas is enough, so long as it is direct (*Binsaris v Northern
      Territory*).

      Unlawful touching is the qualification the bare elements list misses: the touching need not be hostile or
      angry — any slight touching without a lawful excuse will suffice, because every person's body is inviolate
      (*Rixon v Star City Pty Ltd*). Express or implied consent, the exigencies of everyday life (jostling in a
      crowd, a tap on the shoulder to get attention) and reasonable self-defence are not unlawful touching.

      Exam use: work through all five elements in order; the fault element (the defendant bears the onus to
      disprove intention or negligence, except in highway cases) and the unlawful-touching qualification are the
      two places students most often drop marks.

  - slug: assault
    title: Assault
    visual: diagram
    visual-brief: A chain — defendant's act or words → reasonable apprehension in the plaintiff's mind → imminent contact — with a present-ability link at the end.
    related: [battery, false-imprisonment]
    depends-on: []
    contrasts-with: [battery, false-imprisonment]
    cases: [rixon-v-star-city-pty-ltd, zanker-v-vartzokas]
    authorities: []
    verify: false
    body: |
      Assault is a direct and intentional act by the defendant which creates in the plaintiff a reasonable
      apprehension of an imminent physical interference with their person.

      The elements are: a positive act; direct interference; an intentional act (the weight of Australian
      authority requires intention, though *New South Wales v McMaster* contains dicta suggesting otherwise);
      reasonable apprehension in the plaintiff of imminent harmful or offensive contact; and no lawful
      justification.

      The intention required is the intention to cause apprehension of the battery, not an intention to actually
      commit the battery — an important distinction from battery's own fault element (*Rixon v Star City Pty
      Ltd*). The act may be mere words or a gesture.

      Apprehension is assessed from the plaintiff's mind, but objectively: would a reasonable person in the
      plaintiff's position have apprehended the threat? Fear is not necessary, and words alone can be an assault
      provided they directly raise the apprehension.

      Imminence does not mean immediate. A threat is imminent if there is no effective means of escape before it
      can be carried out, even if the harm will only occur a little later (*Zanker v Vartzokas*, the girl trapped
      in a moving van).

      Exam use: battery and assault often occur in quick succession, but assault does not require touching and
      can exist without a completed battery — always check apprehension and imminence separately from any actual
      contact.

  - slug: false-imprisonment
    title: False imprisonment
    visual: palace
    visual-brief: Four gates — positive act, direct, intentional/negligent, total restraint without lawful justification — with "total" tested by whether any reasonable exit exists.
    related: [battery, assault]
    depends-on: []
    contrasts-with: [assault]
    cases: [balmain-new-ferry-v-robertson]
    authorities: []
    verify: false
    body: |
      False imprisonment is the direct total restraint of the liberty of the plaintiff by an intentional or
      negligent act of the defendant without lawful justification.

      Elements: a positive act; direct interference; an intentional or negligent act; and total restraint of the
      plaintiff's liberty without lawful justification.

      Total restraint does not require physical boundaries or a prison — mental coercion, an assertion of
      authority or a threat can imprison as effectively as a locked room, and a plaintiff can even be falsely
      imprisoned without knowing it at the time (*Meering v Graham-White Aviation*; *Symes v Mahon*). Restraint is
      total only where there is no reasonable means of escape (*Bird v Jones*); a condition attached to a lawful
      entry — such as paying to leave a wharf — is a lawful excuse and defeats the claim (*Balmain New Ferry v
      Robertson*).

      Directness includes a defendant who directs, promotes or causes another person to detain the plaintiff, not
      only one who detains personally (*Coles Myer Ltd v Webster*).

      Fault can be intentional or negligent. An intentional act of imprisonment can still attract liability even
      where the defendant reasonably but mistakenly believed they were acting lawfully — a reasonable mistake
      about the right to detain is not itself a lawful justification.

      Exam use: separate the "total" question (was there any reasonable escape?) from the "lawful justification"
      question (was there a valid legal power or an accepted condition of entry?) — problem questions often plant
      a partial exit or a plausible-looking authority to test both.

  - slug: action-on-the-case-intentional-harm
    title: Action on the case for intentional harm
    visual: explainer
    visual-brief: Two doors out of trespass's dead end — malicious prosecution's four elements, and Wilkinson v Downton's wilful-act-calculated-to-harm test — for indirect or non-physical intentional harm.
    related: [battery, assault]
    depends-on: []
    contrasts-with: [battery]
    cases: [a-v-new-south-wales, wilkinson-v-downton, nationwide-news-v-naidu]
    authorities: []
    verify: false
    body: |
      Where the harm is not a direct interference actionable as trespass, an action on the case may still lie for
      malicious prosecution or for the intentional (or indirect) infliction of personal injury.

      Malicious prosecution requires: the defendant initiated proceedings against the plaintiff; those
      proceedings terminated in the plaintiff's favour; the defendant acted maliciously in initiating them; and
      the defendant acted without reasonable and probable cause. Because it is an action on the case, the
      plaintiff must also show damage to life, liberty, reputation or property. Malice (a positive requirement —
      acting for a non-legitimate purpose) and the absence of reasonable and probable cause (a negative
      requirement, tested both subjectively and objectively) are distinct elements that must both be met (*A v
      New South Wales*).

      Intentional infliction of personal injury covers intentional but indirect harm that neither trespass (which
      needs directness) nor negligence (which needs a duty of care) may adequately remedy. The cause of action
      lies in wilfully doing an act calculated to cause physical harm and actually causing it (*Wilkinson v
      Downton*, a practical joke that caused nervous shock). An actual subjective intention to harm is not
      required — reckless indifference to the result will suffice (*Nationwide News v Naidu*, workplace bullying
      causing depression and PTSD).

      Exam use: reach for this tort when the facts show indirect or psychiatric harm that trespass to the person
      cannot capture because the injury is only consequential on the defendant's act.

  - slug: remedies-intentional-torts-to-person
    title: Remedies for intentional interference with the person
    visual: palace
    visual-brief: A ladder of damages — nominal, compensatory, aggravated, exemplary — rising with how deliberate and egregious the conduct was.
    related: [battery, assault, false-imprisonment]
    depends-on: []
    contrasts-with: []
    cases: []
    authorities: []
    verify: false
    body: |
      Damages are the most common remedy for intentional interference with the person; in suitable cases a court
      may also grant an injunction to prevent an anticipated tort, such as a threatened battery, from occurring.

      Damages for intentional torts to the person may be nominal, compensatory, aggravated or exemplary, and more
      than one head can be awarded together.

      Nominal damages are likely where the tort is made out but no real harm or damage was caused — because
      trespass to the person is actionable per se, the plaintiff need not prove damage to succeed, but a token sum
      reflects that little was actually lost.

      Compensatory damages aim to put the plaintiff back in the position they would have been in had the wrong
      not occurred — the ordinary loss-based measure.

      Aggravated damages respond to the defendant's deliberate conduct where that conduct itself caused an affront
      to the plaintiff, over and above the physical or economic loss — they compensate injured feelings.

      Exemplary damages are different in purpose: they punish the defendant for conduct that was particularly
      egregious, rather than compensate the plaintiff.

      Exam use: after establishing liability, always address remedy separately — identify which heads are engaged
      by the facts (was there real harm? was the conduct deliberate and humiliating? was it outrageous enough to
      punish?) rather than assuming compensatory damages are the only available award.

  - slug: trespass-to-goods
    title: Trespass to goods
    visual: explainer
    visual-brief: A single gate — direct interference with a chattel actually possessed by the plaintiff — with no damage to prove.
    related: [conversion-and-detinue]
    depends-on: []
    contrasts-with: [conversion-and-detinue]
    cases: [penfolds-wines-pty-ltd-v-elliott, national-crime-authority-v-flack]
    authorities: []
    verify: false
    body: |
      Chattels are tangible, moveable, visible goods transferable by delivery — pets, livestock, vehicles, books,
      computers, phones and artwork, but not fixtures permanently attached to land. There is no property in a
      dead body, though stored sperm may be protected as a chattel; intangible property such as bitcoin, domain
      names and digital files sits in doubt.

      Trespass to goods requires a direct interference with a chattel that is in the possession of the plaintiff
      at the time of the interference. Because the action is in trespass, no proof of actual damage is generally
      required.

      Possession is different from ownership, and is essential — not incidental — to this tort. Possession has
      two elements: an intention to exercise control and exclude others, and actual control. A person who has
      physical custody as a bailee has possession, even against the true owner in most respects; the bailor
      cannot generally sue the bailee in trespass, though may sue where the bailee has completely destroyed the
      goods (*Penfolds Wines Pty Ltd v Elliott*). Even a finder of a chattel has possession in law sufficient to
      sue everyone except the true owner (*National Crime Authority v Flack*).

      Exam use: the threshold question is always who had possession — not ownership — at the moment of
      interference; a plaintiff with only a contractual or ownership right but no possession cannot sue in
      trespass, though they may still be able to sue in conversion.

  - slug: conversion-and-detinue
    title: Conversion and detinue
    visual: diagram
    visual-brief: Two side-by-side ladders — conversion's serious dealing inconsistent with the owner's dominion, and detinue's demand-then-refusal — both reachable by a right to immediate possession alone.
    related: [trespass-to-goods]
    depends-on: []
    contrasts-with: [trespass-to-goods]
    cases: [penfolds-wines-pty-ltd-v-elliott, bunnings-group-ltd-v-chep-australia-ltd, hocking-v-director-general-of-the-national-archives-of-australia]
    authorities: []
    verify: false
    body: |
      Conversion evolved from the old action of trover: wrongfully dealing with goods inconsistently with
      another's possessory rights. It is a strict liability tort — good faith or mistake, eg by an auctioneer,
      is no defence.

      Conversion differs from trespass in two ways: conduct — conversion needs a serious "dealing" amounting to
      dominion contrary to the true possessor's rights, not mere interference with physical state; and title to
      sue — trespass needs actual possession at interference, while conversion allows a plaintiff with only a
      right to immediate possession and some proprietary title (a merely contractual or custodial right is not
      enough) (*Hocking v Director General of the National Archives of Australia*).

      Conversion can arise from selling goods, taking possession without intending to keep them permanently, or
      using them inconsistently with the owner's dominion (*Penfolds Wines Pty Ltd v Elliott* — using the owner's
      branded bottles for one's own wine). "Serious enough" is genuinely contestable (*Bunnings Group Ltd v CHEP
      Australia Ltd* — storing delivered goods on pallets was not conversion, but transporting Bunnings's own
      goods on them was). An unconditional demand for return, wrongfully refused, is itself dominion.

      Detinue remedies wrongful detention and, uniquely, lets a court order the goods' return (discretionary).
      The plaintiff needs only a right to immediate possession, a clear demand, and a wrongful refusal — no
      actual possession or ownership is required.

      Exam use: plead conversion for a serious dealing already done, detinue to get the specific chattel back.

cases:
  - slug: innes-v-wylie
    name: Innes v Wylie
    citation: "(1844) 174 ER 800"
    aglc: "Innes v Wylie (1844) 174 ER 800"
    facts: A police officer stood passively in a doorway, blocking the plaintiff's way, without pushing him or otherwise actively restraining him.
    issue: Whether standing passively in someone's way, without active conduct, can amount to battery.
    held: Standing passively is not battery; trespass to the person requires a positive, voluntary act by the defendant.
    ratio: Battery cannot be committed by a mere omission or passive presence — there must be a positive act.
    significance: The stock illustration that battery needs a positive act, not passive obstruction.
    why-here: Cited for the "positive act" element of battery — contrast an officer standing still (no battery) with a positive push or blow.
    verify: true

  - slug: fagan-v-metropolitan-police-commissioner
    name: Fagan v Metropolitan Police Commissioner
    citation: "[1969] 1 QB 439"
    aglc: "Fagan v Metropolitan Police Commissioner [1969] 1 QB 439"
    facts: The defendant accidentally drove his car onto a police officer's foot, then failed to move the car for a few minutes despite being asked to.
    issue: Whether the defendant's failure to move the car, after the initial accidental driving, could itself amount to a positive act for battery.
    held: The failure to move the car was itself a positive act because of its nexus with the earlier positive act of driving onto the foot — one continuous positive act.
    ratio: A continuing omission connected to an earlier positive act can itself be treated as a positive, voluntary act for battery.
    significance: Shows that an apparently passive continuation of contact can still satisfy the positive-act element if linked to an earlier voluntary act.
    why-here: Used to answer "was there a positive act" where the defendant's initial conduct was accidental but they then failed to stop the contact.
    verify: false

  - slug: binsaris-v-northern-territory
    name: Binsaris v Northern Territory
    citation: "(2020) 270 CLR 549"
    aglc: "Binsaris v Northern Territory (2020) 270 CLR 549"
    facts: Tear gas was deployed and touched the eyes of the plaintiff.
    issue: Whether the physical-interference element of battery requires the defendant's body to touch the plaintiff directly.
    held: Contact through an instrument such as tear gas is sufficient; the defendant's body need not physically touch the plaintiff.
    ratio: Battery's physical-contact element is satisfied by contact through an object, substance or weapon, not only by direct bodily touching.
    significance: Confirms battery covers indirect physical contact (eg gas, a weapon or a car) as long as it is directly caused.
    why-here: Authority for "contact through a weapon or object still counts" when the facts involve gas, a thrown object or a vehicle.
    verify: false

  - slug: rixon-v-star-city-pty-ltd
    name: Rixon v Star City Pty Ltd
    citation: "(2001) 53 NSWLR 98; [2001] NSWCA 265"
    aglc: "Rixon v Star City Pty Ltd (2001) 53 NSWLR 98"
    facts: |
      Rixon, a casino patron excluded under s 79 of the Casino Control Act 1992 (NSW), was approached at a
      roulette table by an employee who placed a hand on his shoulder to get his attention before telling him he
      must go to an interview room. The trial judge rejected Rixon's evidence that he was "grabbed" and "spun
      round" and found only that the employee placed a hand on his shoulder without force or injury.
    issue: "(1) Whether a touching without anger or hostility can still be a battery; (2) whether the touching here was a battery; (3) what intention assault requires."
    held: |
      The absence of anger or hostility does not stop a touching being a battery — the real test is whether the
      contact exceeds what is generally acceptable in the ordinary conduct of daily life; on the facts, touching
      the shoulder to gain attention did not exceed that standard, so there was no battery. On assault, the
      intention required is the intention to create apprehension of contact, not an intention to actually carry
      out the contact, and that intention was not made out here.
    ratio: Battery is not limited to hostile or angry touching; the question is whether the touching exceeds physical contact generally acceptable in everyday life. Assault requires intention to create apprehension of imminent contact, not intention to inflict the contact itself.
    significance: Modern Australian statement of the "unlawful touching" / personal inviolability principle, and of the intention element of assault.
    why-here: The key authority for "any touching without lawful excuse can be a battery" and for distinguishing the intention needed for assault from the intention needed for battery.
    verify: false

  - slug: zanker-v-vartzokas
    name: Zanker v Vartzokas
    citation: "(1988) 34 A Crim R 11"
    aglc: "Zanker v Vartzokas (1988) 34 A Crim R 11"
    facts: A girl accepted a lift in the defendant's van; after she declined his request for sexual favours in exchange for money, he told her, while the van was moving, "I am going to take you to my mate's house. He will really fix you up."
    issue: Whether a threat of future harm, made while the plaintiff had no means of immediate escape, was sufficiently imminent to be an assault.
    held: The threat was sufficiently imminent in the circumstances, even though the harm threatened was not to happen at that instant, because the plaintiff was confined in a moving van with no means of escape until the threat could be carried out.
    ratio: "\"Imminent\" does not mean immediate; a threat is imminent if there is no effective means of escape before it can be carried out."
    significance: Leading Australian authority that imminence in assault is assessed against the plaintiff's practical ability to escape the threatened contact.
    why-here: Used whenever facts involve a threat of harm that will happen "soon" rather than instantly, eg while trapped in a vehicle.
    verify: false

  - slug: balmain-new-ferry-v-robertson
    name: Balmain New Ferry v Robertson
    citation: "(1906) 4 CLR 379"
    aglc: "Balmain New Ferry v Robertson (1906) 4 CLR 379"
    facts: A passenger who missed his ferry was not allowed to leave the wharf without paying a further penny.
    issue: Whether requiring payment of a further fee before a person already on the premises could leave amounted to false imprisonment.
    held: No false imprisonment was made out, because the passenger had entered the wharf on a conditional term (pay to leave), which gave the ferry company a lawful excuse for the restraint.
    ratio: A restraint imposed under a reasonable condition the plaintiff accepted on entry, which the plaintiff can satisfy to be released, is not false imprisonment.
    significance: Shows that a lawful condition attached to entering premises can defeat a false imprisonment claim.
    why-here: The go-to authority for "was there a lawful justification" where the restraint is tied to a condition of entry rather than an outright detention.
    verify: false

  - slug: a-v-new-south-wales
    name: A v New South Wales
    citation: "(2007) 230 CLR 500"
    aglc: "A v New South Wales (2007) 230 CLR 500"
    facts: A police detective initiated a prosecution against a civilian employee of the Police Service for alleged anal intercourse, after feeling pressured to do so.
    issue: What is required to establish malicious prosecution, and in particular how malice relates to the absence of reasonable and probable cause.
    held: The High Court held that malice and the absence of reasonable and probable cause are distinct elements, both of which must be established; malice is a positive element (eg acting for a non-legitimate purpose), while absence of reasonable and probable cause is a negative element assessed both subjectively and objectively.
    ratio: Malicious prosecution requires proof of both malice and the absence of reasonable and probable cause as separate elements — neither substitutes for the other.
    significance: Leading High Court authority on the elements of malicious prosecution.
    why-here: Cited whenever an ILAC answer needs to separate the malice element from the reasonable-and-probable-cause element in malicious prosecution.
    verify: false

  - slug: wilkinson-v-downton
    name: Wilkinson v Downton
    citation: "[1897] 2 QB 57"
    aglc: "Wilkinson v Downton [1897] 2 QB 57"
    facts: As a practical joke, the defendant falsely told the plaintiff that her husband had been smashed up in an accident; the shock this caused made the plaintiff physically ill.
    issue: Whether a defendant who did not directly touch the plaintiff, but caused nervous shock through a false statement, could be liable in tort.
    held: The defendant was liable; the cause of action lies in wilfully doing an act calculated to cause physical harm to the plaintiff, and actually causing such harm.
    ratio: Intentional infliction of physical harm through indirect means (such as words causing nervous shock) is actionable where the act was calculated to cause harm and did cause it.
    significance: Founding authority for the tort of intentional infliction of (indirect) personal injury, filling the gap left by trespass's directness requirement.
    why-here: The authority to plead whenever the facts show intentional but indirect psychiatric or physical harm that trespass cannot reach.
    verify: false

  - slug: nationwide-news-v-naidu
    name: Nationwide News v Naidu
    citation: "(2007) 71 NSWLR 471"
    aglc: "Nationwide News v Naidu (2007) 71 NSWLR 471"
    facts: An employee was subjected to extreme bullying by a superior at work, resulting in major depression and post-traumatic stress disorder.
    issue: What degree of intention is required for the tort of intentional infliction of personal injury — must the defendant subjectively intend to cause the specific harm?
    held: An actual subjective intention to cause the harm is not required; reckless indifference to the result will suffice.
    ratio: The fault element for intentional infliction of personal injury is satisfied by recklessness as to the consequences, not only by actual subjective intent.
    significance: Confirms the fault standard for this tort extends to reckless indifference, widening it beyond deliberate targeting.
    why-here: Used to argue the fault element is met even where the defendant did not specifically intend the plaintiff's psychiatric injury, only acted with reckless indifference.
    verify: false

  - slug: penfolds-wines-pty-ltd-v-elliott
    name: Penfolds Wines Pty Ltd v Elliott
    citation: "(1946) 74 CLR 204"
    aglc: "Penfolds Wines Pty Ltd v Elliott (1946) 74 CLR 204"
    facts: |
      Penfolds sold wine in bottles embossed with words stating the bottle remained Penfolds's property; customers
      bought only the wine, not the bottles. Elliott ran a business selling bulk wine to customers who brought
      their own bottles; on at least one occasion he used two of Penfolds's bottles, given to him by his brother,
      to sell wine. Penfolds sued Elliott in trespass and conversion and sought an injunction.
    issue: "(1) Whether Penfolds could sue Elliott in trespass to goods without being in possession of the bottles; (2) whether Elliott's use of the bottles amounted to conversion."
    held: |
      The trespass claim failed: trespass protects possession, and Penfolds was not in possession of the bottles
      at the relevant time — Elliott was, having received them from his brother as (sub-)bailee. On conversion, a
      majority (Latham CJ, Starke, McTiernan and Williams JJ) held Elliott's use of the bottles for his own wine
      was conversion, being inconsistent with Penfolds's dominion over the bottles, even though Penfolds lacked
      possession. Dixon J dissented on the conversion point, describing the use as "temporary and harmless" and
      not serious enough.
    ratio: Trespass to goods requires actual possession by the plaintiff at the time of interference; conversion can be established by a plaintiff with only a right to immediate possession where the defendant's dealing with the goods is inconsistent with the owner's dominion.
    significance: Leading Australian authority distinguishing trespass to goods (possession-based) from conversion (dominion-based), and illustrating how "serious interference" can divide a court.
    why-here: Used for both trespass to goods (why the claim failed) and conversion (why the claim succeeded) on the same facts — a model contrast case.
    verify: false

  - slug: national-crime-authority-v-flack
    name: National Crime Authority v Flack
    citation: "(1988) 86 FCR 16"
    aglc: "National Crime Authority v Flack (1988) 86 FCR 16"
    facts: Mrs Flack sued for conversion after the National Crime Authority neither initiated any prosecution nor returned a briefcase containing money that had been on her premises, holding it for three years.
    issue: Whether the finder or occupier of a chattel has the possession required to sue in trespass or conversion.
    held: Mrs Flack had possession in law over all chattels on the premises, including those she was unaware of, giving her possessory rights against everyone except the true owner.
    ratio: A person in occupation of premises has possession in law of chattels found there, sufficient to sue anyone but the true owner, even without knowledge of the chattel's existence.
    significance: Establishes that a finder/occupier's possession, though not ownership, is enough to found an action for interference with goods.
    why-here: Used to answer "does the plaintiff have possession" where the plaintiff found or held goods without owning them.
    verify: false

  - slug: bunnings-group-ltd-v-chep-australia-ltd
    name: Bunnings Group Ltd v CHEP Australia Ltd
    citation: "(2011) NSWCA 342"
    aglc: "Bunnings Group Ltd v CHEP Australia Ltd (2011) NSWCA 342"
    facts: CHEP owned timber pallets that were used by Bunnings; Bunnings used the pallets both to store or display goods delivered on them, and to transport its own goods.
    issue: Whether Bunnings's use of CHEP's pallets amounted to a sufficiently serious interference to be conversion.
    held: Using the pallets to store or display the goods delivered on them was not conversion, but using empty pallets to transport Bunnings's own goods was conversion.
    ratio: Whether a dealing with goods is a "sufficiently serious interference" amounting to conversion depends on the nature of the use, not simply on possession or handling; courts can differ on where the line falls.
    significance: Illustrates the fine, fact-sensitive judgment required to decide whether a dealing with goods is serious enough to be conversion.
    why-here: Used to argue both sides of a conversion claim over shared equipment or containers — the same pallets, different uses, different outcomes.
    verify: false

  - slug: hocking-v-director-general-of-the-national-archives-of-australia
    name: Hocking v Director General of the National Archives of Australia
    citation: "[2020] HCA 19"
    aglc: "Hocking v Director General of the National Archives of Australia [2020] HCA 19"
    facts: Not detailed in the week's materials beyond the proposition it establishes about title to sue in conversion.
    issue: What kind of right in goods a plaintiff must hold to sue in conversion.
    held: The plaintiff must have some form of legal (proprietary) title to the goods — merely having a contractual right or a custody right to possession will not suffice.
    ratio: Conversion requires the plaintiff to show a proprietary interest in the goods, not merely a contractual or custodial right to possess them.
    significance: Clarifies the "title to sue" requirement for conversion at the level of the High Court.
    why-here: Cited whenever a plaintiff's claim to possession rests only on a contract or custody arrangement, to test whether that is enough to sue in conversion.
    verify: true

  - slug: scott-v-shepherd
    name: Scott v Shepherd
    citation: "(1773) 96 ER 525"
    aglc: "Scott v Shepherd (1773) 96 ER 525"
    facts: Not detailed in the week's materials beyond Blackstone J's dictum distinguishing direct from consequential injury, illustrated by the example of a log thrown onto a highway.
    issue: How to distinguish an injury that is direct (actionable in trespass) from one that is merely consequential on the defendant's act (actionable only on the case).
    held: "Blackstone J: \"where the injury is immediate, an action of trespass will lie; where it is only consequential, it must be an action on the case.\""
    ratio: Trespass requires the interference to follow directly and immediately from the defendant's act; where the injury is only a consequence of that act, the remedy lies in an action on the case, not trespass.
    significance: Foundational statement of the directness requirement that underlies the "direct interference" element common to battery, assault and false imprisonment.
    why-here: Cited in the Topic 2 flowchart for the requirement that trespass to the person must follow directly upon the defendant's act.
    verify: true

authorities: []
questions:
  - key: bat01
    type: mcq
    concept: battery
    difficulty: 1
    set: pretest
    stem: |
      Which of the following is NOT one of the elements the plaintiff must prove for battery?
    options:
      - text: |
          A voluntary and positive act by the defendant.
        correct: false
        why: |
          This is a required element — battery cannot be committed by an omission or passive presence.
      - text: |
          That the defendant's touching caused the plaintiff financial loss.
        correct: true
        why: |
          Battery is actionable per se — the plaintiff need not prove any loss, financial or otherwise, only the unlawful touching itself.
      - text: |
          Direct interference with the plaintiff's body.
        correct: false
        why: |
          Directness is required — the interference must follow directly from the defendant's act.
      - text: |
          That the touching was unlawful, i.e. without consent or other lawful excuse.
        correct: false
        why: |
          This is the qualification that distinguishes ordinary everyday contact from battery.
  - key: bat02
    type: mcq
    concept: battery
    difficulty: 2
    cases: [innes-v-wylie]
    stem: |
      A security guard stands still, blocking a doorway so a customer cannot pass, without pushing or grabbing the customer. Applying Innes v Wylie, is this battery?
    options:
      - text: |
          No, because standing passively without a positive act is not battery.
        correct: true
        why: |
          This mirrors Innes v Wylie: a police officer standing passively in a doorway committed no battery because there was no positive act.
      - text: |
          Yes, because any physical obstruction of a person's path is a battery.
        correct: false
        why: |
          Obstruction alone does not satisfy the positive-act element; there must be an active, positive act, not mere presence.
      - text: |
          Yes, because the guard intended to stop the customer.
        correct: false
        why: |
          Intention alone cannot substitute for the missing element of a positive act — both are required.
      - text: |
          No, because the customer suffered no injury.
        correct: false
        why: |
          Battery is actionable per se and needs no injury; the real reason there is no battery here is the absence of a positive act, not the absence of harm.
  - key: bat03
    type: mcq
    concept: battery
    difficulty: 2
    variant-of: bat02
    stem: |
      A commuter stands still on a crowded platform, and another commuter cannot get past. Is the first commuter liable in battery?
    options:
      - text: |
          No — merely standing still, without more, is not a positive act.
        correct: true
        why: |
          As in Innes v Wylie, passive presence is not enough for the positive-act element of battery.
      - text: |
          Yes — the commuter's body physically prevented the other from passing.
        correct: false
        why: |
          Preventing passage through mere presence is not itself a positive act of touching; nothing was done to the plaintiff.
      - text: |
          Yes — because there was no lawful justification for blocking the path.
        correct: false
        why: |
          Lawful justification only becomes relevant once the other elements, including a positive act, are established.
      - text: |
          It depends on whether the second commuter felt intimidated.
        correct: false
        why: |
          Feelings of intimidation go to apprehension in assault, not to the positive-act requirement in battery.
  - key: bat04
    type: mcq
    concept: battery
    difficulty: 3
    cases: [fagan-v-metropolitan-police-commissioner]
    stem: |
      Applying Fagan v Metropolitan Police Commissioner, a driver accidentally reverses onto a pedestrian's foot, notices, and then deliberately leaves the car there for several minutes despite being asked to move it. Is there a positive act for battery?
    options:
      - text: |
          No — the initial contact was accidental, so an omission afterwards can never be treated as a fresh positive act.
        correct: false
        why: |
          The initial accident is not decisive; the later deliberate failure to move, linked to the earlier act, can itself be treated as a positive act.
      - text: |
          Yes — the failure to move is one continuous positive act with the earlier driving onto the foot.
        correct: true
        why: |
          This is exactly the reasoning in Fagan: the failure to move was a positive act because of its nexus with the earlier positive act of driving onto the foot.
      - text: |
          Yes — but only because the pedestrian ultimately suffered a broken bone requiring hospital treatment.
        correct: false
        why: |
          The positive-act analysis does not depend on the severity of injury; battery needs no proof of damage at all.
      - text: |
          No — an omission can never amount to trespass, regardless of context.
        correct: false
        why: |
          This overstates the rule; while a bare omission is not enough, a continuing omission connected to an earlier positive act can be treated as positive conduct, as Fagan shows.
  - key: bat05
    type: mcq
    concept: battery
    difficulty: 3
    variant-of: bat04
    stem: |
      A cyclist swerves and accidentally pins a pedestrian's hand against a wall with the bike. On realising this, the cyclist deliberately keeps leaning on the bike for a minute to make a point, ignoring the pedestrian's pleas. Is there a positive act?
    options:
      - text: |
          Yes — the deliberate continuation is one act with the earlier swerve.
        correct: true
        why: |
          As in Fagan, the deliberate continuation of contact after the accidental start is treated as one continuous positive act.
      - text: |
          No, because the initial swerve was accidental, and an accidental start can never later be turned into a positive act by anything the cyclist does afterwards.
        correct: false
        why: |
          The deliberate decision to keep leaning, once aware of the contact, supplies the positive act, following the reasoning in Fagan.
      - text: |
          No, because only a fresh word or an active blow, and never the continuation of existing contact, can count as a positive act in trespass.
        correct: false
        why: |
          A positive act need not be a fresh blow; deliberately maintaining existing contact can qualify, as in Fagan.
      - text: |
          Yes, but only if the pedestrian can show financial loss resulting from being pinned against the wall.
        correct: false
        why: |
          No loss needs to be shown at all — battery is actionable per se, regardless of any financial consequence.
  - key: bat06
    type: mcq
    concept: battery
    difficulty: 2
    cases: [binsaris-v-northern-territory]
    stem: |
      Following Binsaris v Northern Territory, which statement about the physical-interference element of battery is correct?
    options:
      - text: |
          The defendant's own body must touch the plaintiff's body for battery to be made out.
        correct: false
        why: |
          This is wrong — Binsaris confirms contact through an object or substance, such as tear gas, can satisfy this element.
      - text: |
          Contact through a weapon, vehicle or substance can suffice, provided it is direct.
        correct: true
        why: |
          Binsaris held that tear gas touching the plaintiff's eyes was sufficient contact for battery, even without the defendant's body touching the plaintiff.
      - text: |
          Physical interference requires proof that the plaintiff suffered a visible injury.
        correct: false
        why: |
          No injury needs to be proved — battery is actionable per se.
      - text: |
          Contact through an object is only capable of being a battery if that object is a weapon specifically designed to cause harm.
        correct: false
        why: |
          The object need not be a weapon designed to harm — tear gas is not a weapon of that kind, yet contact through it still counted.
  - key: bat07
    type: mcq
    concept: battery
    difficulty: 2
    variant-of: bat06
    stem: |
      A protester throws a paint-filled balloon that bursts on a passer-by's shirt. Could this satisfy the physical-interference element of battery?
    options:
      - text: |
          Yes — contact through a thrown object suffices, as with the tear gas in Binsaris.
        correct: true
        why: |
          As in Binsaris, contact can be made through an object rather than the defendant's own body, and here the paint directly struck the passer-by.
      - text: |
          No — only contact with bare skin counts as physical interference.
        correct: false
        why: |
          Contact through clothing, or through an object like paint or gas, is still sufficient; there is no bare-skin requirement.
      - text: |
          No — throwing an object at someone always turns the tort into negligence rather than battery, however deliberate the throw.
        correct: false
        why: |
          A thrown object does not change the tort into negligence; if thrown intentionally and directly, it remains capable of being a battery.
      - text: |
          It depends on whether the passer-by was physically hurt.
        correct: false
        why: |
          Battery needs no proof of injury or harm — the contact itself, if unlawful, is enough.
  - key: bat08
    type: mcq
    concept: battery
    difficulty: 3
    stem: |
      Once a plaintiff establishes a direct, positive act causing physical contact, who bears the onus of proving intention or negligence in a battery claim (apart from highway cases)?
    options:
      - text: |
          The plaintiff, who must always prove the defendant's state of mind.
        correct: false
        why: |
          This is generally reversed for trespass to the person — except in highway cases, the onus is on the defendant to disprove fault.
      - text: |
          The defendant, who bears the onus.
        correct: true
        why: |
          The materials state that, except in highway cases, the onus is on the defendant to prove the act was neither intentional nor negligent.
      - text: |
          Neither party — fault is presumed conclusively and cannot be rebutted.
        correct: false
        why: |
          The onus can be discharged; it is not an irrebuttable presumption, it simply sits on the defendant instead of the plaintiff.
      - text: |
          The court, which investigates the defendant's state of mind independently.
        correct: false
        why: |
          Courts decide based on evidence adduced by the parties; the allocation of the onus falls on the defendant, not the court itself.
  - key: bat09
    type: mcq
    concept: battery
    difficulty: 2
    cases: [rixon-v-star-city-pty-ltd]
    stem: |
      In Rixon v Star City Pty Ltd, why did the Court of Appeal say the trial judge's focus on anger or hostility was not the right test for battery?
    options:
      - text: |
          Because any touching at all is automatically a battery, regardless of context.
        correct: false
        why: |
          This overstates it — everyday, generally acceptable contact is excluded; the point is that hostility is not the test, not that all touching is battery.
      - text: |
          Because acceptability in everyday life, not hostility, is the test the Court of Appeal applied in Rixon v Star City Pty Ltd.
        correct: true
        why: |
          This is exactly what the Court of Appeal held in Rixon — the absence of anger is not decisive; acceptability in everyday life is the touchstone.
      - text: |
          Because hostility is still required, but the trial judge misapplied it to the facts.
        correct: false
        why: |
          The Court of Appeal rejected hostility as the requirement altogether, rather than merely correcting how it was applied.
      - text: |
          Because only touching that causes physical injury can be a battery.
        correct: false
        why: |
          Injury is irrelevant to whether there is a battery; the touching itself, if beyond what is generally acceptable, suffices.
  - key: bat10
    type: mcq
    concept: battery
    difficulty: 2
    variant-of: bat09
    stem: |
      A stranger taps a pedestrian on the shoulder, using no more force than necessary, purely to ask for directions. Applying the principle in Rixon, is this a battery?
    options:
      - text: |
          No — a light attention-getting touch is generally acceptable.
        correct: true
        why: |
          This mirrors Rixon's own facts: touching to gain attention, without excessive force, falls within acceptable everyday contact and is not a battery.
      - text: |
          Yes — any touching at all, no matter how minor, without the plaintiff's express written permission first obtained, is automatically a battery.
        correct: false
        why: |
          This is too broad; Rixon confirms that generally acceptable everyday contact, like a tap for attention, is excluded from battery.
      - text: |
          Yes, but only because the pedestrian was startled.
        correct: false
        why: |
          Being startled (a subjective reaction) does not convert acceptable, minimal contact into a battery; the objective standard of ordinary daily contact governs.
      - text: |
          No, because there was no intention to touch at all.
        correct: false
        why: |
          There plainly was an intentional touch here — the tap was deliberate; the reason it is not battery is that it falls within everyday acceptable conduct.
  - key: bat11
    type: mcq
    concept: battery
    difficulty: 2
    cases: [rixon-v-star-city-pty-ltd]
    stem: |
      Which statement best reflects the modern Australian position on whether hostility is required for battery?
    options:
      - text: |
          Hostility or anger is an essential element that must always be proved.
        correct: false
        why: |
          This reflects the older view the Court of Appeal in Rixon rejected as unsatisfactory.
      - text: |
          Absence of anger is not a satisfactory basis for finding no battery.
        correct: true
        why: |
          This is the Court of Appeal's own statement in Rixon of the modern position.
      - text: |
          Hostility is irrelevant, and touching is battery only if the plaintiff can prove financial loss.
        correct: false
        why: |
          No loss needs to be proved; battery is actionable per se, and this option wrongly imports a damage requirement.
      - text: |
          Hostility is required only for assault, never for battery.
        correct: false
        why: |
          Hostility is not required for either tort under the modern principle; this option misstates which tort it might apply to.
  - key: bat12
    type: mcq
    concept: battery
    difficulty: 1
    stem: |
      Which of the following will generally prevent a touching from being an unlawful battery?
    options:
      - text: |
          The plaintiff's consent.
        correct: true
        why: |
          Consent by the plaintiff is a recognised basis for lawful justification, taking the touching outside battery.
      - text: |
          The defendant's own private belief, however sincerely held, that the touching in question was entirely harmless and unlikely to be resented.
        correct: false
        why: |
          A defendant's private belief about harmlessness does not itself provide lawful justification; consent or another recognised excuse is needed.
      - text: |
          The fact that the touching lasted only a few seconds.
        correct: false
        why: |
          Duration is irrelevant — even the slightest touching can be a battery if unlawful.
      - text: |
          The plaintiff's failure to complain immediately.
        correct: false
        why: |
          Delay in complaining does not retroactively make an unlawful touching lawful.
  - key: bat13
    type: mcq
    concept: battery
    difficulty: 2
    stem: |
      A shopper is jostled by the crowd while walking through a busy supermarket aisle. Is the person who jostled them liable in battery?
    options:
      - text: |
          No — inevitable crowd jostling is within the exigencies of everyday life.
        correct: true
        why: |
          The materials specifically note the exigencies of everyday life, like being jostled in a supermarket, will not amount to unlawful touching.
      - text: |
          Yes — any physical contact at all between strangers in a crowded public place, however incidental, is automatically an unlawful touching.
        correct: false
        why: |
          This ignores the recognised exception for the ordinary, inevitable jostling of everyday life.
      - text: |
          Yes — because the shopper did not expect to be touched.
        correct: false
        why: |
          Expectation is not the test; the objective standard is whether the contact is of a kind ordinarily accepted in everyday life, which crowd jostling is.
      - text: |
          It depends only on whether the jostling caused the shopper to drop something.
        correct: false
        why: |
          Consequences like dropped items do not determine liability; the character of the contact as ordinary crowd jostling is what matters.
  - key: bat14
    type: mcq
    concept: battery
    difficulty: 3
    contrasts-with: [assault]
    stem: |
      A rejects B's request for a loan and, in response, B throws a punch that lands squarely on A's face without any warning. Which tort(s) are made out?
    options:
      - text: |
          Only assault, because a blow always frightens the victim first.
        correct: false
        why: |
          There is no indication A saw the punch coming or apprehended it beforehand; without warning, assault is not established, but battery — the actual contact — is.
      - text: |
          Only battery — the unseen punch connected without any prior warning.
        correct: true
        why: |
          Because the punch was unseen and unanticipated, A never apprehended imminent contact (no assault), but the direct, intentional physical contact itself is a battery.
      - text: |
          Both battery and assault, because any punch necessarily and automatically involves both torts occurring together.
        correct: false
        why: |
          This overgeneralises — battery does not always involve assault; here there is no evidence A apprehended the blow before it landed, so assault is not made out.
      - text: |
          Neither tort, because B was provoked by A's refusal.
        correct: false
        why: |
          Provocation is not a defence that negates the elements of battery; the direct, intentional contact remains a battery regardless of B's motive.
  - key: bat15
    type: mcq
    concept: battery
    difficulty: 2
    stem: |
      A classmate flicks a paper rocket that hits another student on the arm, causing no pain. Could this be a battery?
    options:
      - text: |
          Yes — any slight unlawful touching suffices; no injury is needed.
        correct: true
        why: |
          The principle of personal inviolability means any slight touching without lawful excuse can suffice — injury is not required because the tort is actionable per se.
      - text: |
          No — because no pain or injury was caused.
        correct: false
        why: |
          Injury is irrelevant to battery; the tort is actionable per se, so the absence of pain does not prevent liability.
      - text: |
          No — a paper rocket is too flimsy and improvised an object to ever be capable of amounting to a battery.
        correct: false
        why: |
          The object need not be a conventional weapon; contact through any object, however minor, can satisfy the physical-interference element.
      - text: |
          Yes, but only if the classmate intended to cause pain.
        correct: false
        why: |
          Intention to cause pain specifically is not required; the intention needed is to make the contact, not to hurt.
  - key: bat16
    type: mcq
    concept: battery
    difficulty: 3
    stem: |
      A surgeon performs an operation on a patient who never consented to that specific procedure. Which element of battery is most directly engaged?
    options:
      - text: |
          Direct interference — because surgery is not a direct act.
        correct: false
        why: |
          Surgery plainly involves a direct act on the patient's body; directness is not the issue here.
      - text: |
          Unlawful touching — no consent or other lawful justification applies.
        correct: true
        why: |
          Consent is the usual lawful justification for surgical contact; without it, the touching falls outside the everyday-life or self-defence exceptions and is unlawful.
      - text: |
          Physical interference — because contact made through surgical instruments never counts as contact with the patient's own body.
        correct: false
        why: |
          Surgical contact, even through instruments, clearly satisfies physical interference; the real issue is the absence of a lawful excuse.
      - text: |
          Positive act — because a surgeon's actions are considered passive.
        correct: false
        why: |
          Performing surgery is an obviously active, positive act; the missing element is lawful justification, not a positive act.
  - key: bat17
    type: truefalse
    concept: battery
    difficulty: 1
    set: quickfire
    statement: |
      Battery requires the plaintiff to prove some actual physical injury or financial loss.
    answer: false
    why: |
      Battery is actionable per se — the plaintiff need only prove the unlawful touching, not any resulting injury or loss.
  - key: bat18
    type: truefalse
    concept: battery
    difficulty: 2
    set: quickfire
    statement: |
      A person who stands motionless and merely blocks a doorway, without any active conduct, commits no battery.
    answer: true
    why: |
      As in Innes v Wylie, mere passive presence is not a positive act, so no battery arises.
  - key: bat19
    type: truefalse
    concept: battery
    difficulty: 2
    set: quickfire
    statement: |
      Contact made through tear gas or a weapon can never satisfy the physical-interference element of battery, because the defendant's own body must touch the plaintiff.
    answer: false
    why: |
      Binsaris v Northern Territory confirms contact through an object or substance, such as tear gas, is sufficient.
  - key: bat20
    type: short
    concept: battery
    difficulty: 3
    prompt: |
      Maria is standing in a queue when a stranger, Tom, taps her firmly on the shoulder to ask if she has dropped her wallet. Maria is startled and later complains that Tom battered her. Advise whether Maria has an action in battery against Tom, applying the elements of battery and the principle in Rixon v Star City Pty Ltd.
    model: |
      Battery requires a voluntary and positive act, direct interference, intentional or negligent contact, physical interference with the plaintiff's body, and that the touching was unlawful. Tom's tap is a positive, direct, intentional act causing physical contact with Maria's body, so the first four elements are satisfied. The live issue is whether the touching was unlawful. Following Rixon v Star City Pty Ltd, the absence of anger or hostility does not by itself make a touching lawful or unlawful; the test is whether the contact exceeds what is generally acceptable in the ordinary conduct of daily life. Tapping a stranger's shoulder to get their attention, using no more force than necessary, is a recognised example of contact accepted in everyday life (the exigencies-of-everyday-life exception), just as it was in Rixon itself. Maria being startled does not change this objective assessment. On these facts, Tom's touching falls within acceptable everyday contact, so Maria has no action in battery against him.
    rubric:
      - id: r1
        criterion: |
          Identifies all five elements of battery
        marks: 1
        top-band: |
          States positive act, direct interference, intention/negligence, physical contact and unlawful touching accurately.
        margin-note: |
          Good — full elements list.
        authorities: []
      - id: r2
        criterion: |
          Applies Rixon's "generally acceptable in daily life" test rather than a hostility test
        marks: 1
        top-band: |
          Explicitly rejects hostility/anger as the test and applies the objective everyday-life standard.
        margin-note: |
          This is the crux of the problem — well spotted.
        authorities: []
      - id: r3
        criterion: |
          Reaches a supported conclusion
        marks: 1
        top-band: |
          Concludes no battery, tying the conclusion back to the facts (tap for attention, minimal force).
        margin-note: |
          Conclusion must follow from the analysis, not assert itself.
        authorities: []
  - key: asl01
    type: mcq
    concept: assault
    difficulty: 1
    set: pretest
    stem: |
      Which of the following is NOT a required element of assault?
    options:
      - text: |
          A positive act by the defendant.
        correct: false
        why: |
          This is required for assault, just as for battery — an omission alone will not suffice.
      - text: |
          That the defendant actually touched the plaintiff.
        correct: true
        why: |
          Assault requires no touching at all — it is complete once the plaintiff reasonably apprehends imminent contact.
      - text: |
          Reasonable apprehension in the plaintiff of imminent harmful or offensive contact.
        correct: false
        why: |
          This is the central element of assault, distinguishing it from battery's requirement of actual contact.
      - text: |
          That the act be direct and, on the weight of Australian authority, intentional.
        correct: false
        why: |
          Directness and, on the weight of authority, intention are both required elements of the tort of assault.
  - key: asl02
    type: mcq
    concept: assault
    difficulty: 2
    cases: [rixon-v-star-city-pty-ltd]
    stem: |
      What intention must a plaintiff prove to succeed in assault, according to Rixon v Star City Pty Ltd?
    options:
      - text: |
          The intention to actually carry out the threatened physical contact against the plaintiff's body.
        correct: false
        why: |
          This confuses assault with battery; Rixon confirms assault does not require an intention to carry out the contact.
      - text: |
          The intention to create apprehension of a battery.
        correct: true
        why: |
          Rixon held the relevant intention for assault is the intention to cause apprehension, not to commit the touching itself.
      - text: |
          No intention is required at all for assault.
        correct: false
        why: |
          The weight of Australian authority is that assault requires intention (of the apprehension-creating kind), so "no intention at all" is too broad.
      - text: |
          The intention to cause the plaintiff financial loss.
        correct: false
        why: |
          Financial loss plays no role in the intention element of assault, which concerns apprehension of physical contact.
  - key: asl03
    type: mcq
    concept: assault
    difficulty: 2
    variant-of: asl02
    stem: |
      D swings a stick towards P intending only to scare P away, with no intention of actually hitting P. Can D still be liable in assault?
    options:
      - text: |
          Yes — D intended to create apprehension, which is enough.
        correct: true
        why: |
          As in Rixon, D need not intend the contact itself, only intend to cause apprehension of it — exactly what D intended here.
      - text: |
          No — because D never actually intended, at any point, to hit or make contact with P at all.
        correct: false
        why: |
          Intention to hit is not required for assault; only the intention to cause apprehension of imminent contact matters.
      - text: |
          No — assault requires proof that P was actually struck.
        correct: false
        why: |
          Assault requires no contact at all; it protects against the apprehension of contact, not the contact itself.
      - text: |
          Yes, but only if P can prove D was also negligent.
        correct: false
        why: |
          Negligence is not needed here — D's intention to create apprehension is sufficient on its own for assault.
  - key: asl04
    type: mcq
    concept: assault
    difficulty: 2
    stem: |
      How is "reasonable apprehension" assessed in assault?
    options:
      - text: |
          Subjectively — the plaintiff's own perception is always conclusive, however unreasonable.
        correct: false
        why: |
          The test is not purely subjective; it must also be reasonable, judged objectively.
      - text: |
          Objectively — whether a reasonable person in the plaintiff's position would have apprehended the threat.
        correct: true
        why: |
          The materials state the test is objective: would a reasonable person in the plaintiff's position have apprehended the threat?
      - text: |
          By reference to whether the plaintiff actually felt fear.
        correct: false
        why: |
          Fear is expressly stated not to be necessary for assault; apprehension, not fear, is what matters.
      - text: |
          By reference to whether the defendant intended to frighten the plaintiff, regardless of the plaintiff's perception.
        correct: false
        why: |
          The defendant's intention to create apprehension is a separate element from whether the plaintiff's apprehension itself was reasonable.
  - key: asl05
    type: mcq
    concept: assault
    difficulty: 2
    variant-of: asl04
    stem: |
      P, an unusually nervous person, apprehends an imminent punch from a gesture that most people would recognise as an obvious joke. Is P's apprehension "reasonable" for the purposes of assault?
    options:
      - text: |
          Not necessarily — the test is what a reasonable person would apprehend.
        correct: true
        why: |
          Because the test is objective, P's own unusually nervous reaction is not decisive; what matters is what a reasonable person would have apprehended.
      - text: |
          Yes — whatever the plaintiff subjectively feels is automatically reasonable.
        correct: false
        why: |
          This makes the test purely subjective, which is not the law; an objective, reasonable-person standard applies.
      - text: |
          Yes — because fear is required for assault, and P clearly felt fear.
        correct: false
        why: |
          Fear is expressly not required for assault, so P's fear alone does not establish the element.
      - text: |
          No — apprehension can never be found reasonable unless the defendant actually and subjectively intended the gesture as a serious, genuine threat.
        correct: false
        why: |
          The defendant's own intention and the plaintiff's reasonable apprehension are related but distinct enquiries; even a joking gesture could, on an objective view, create reasonable apprehension in some circumstances.
  - key: asl06
    type: mcq
    concept: assault
    difficulty: 1
    stem: |
      Does a plaintiff need to prove they felt fear to succeed in an action for assault?
    options:
      - text: |
          Yes — fear is an essential element that every single assault claim must specifically establish.
        correct: false
        why: |
          The materials expressly state fear is not necessary for assault.
      - text: |
          No — apprehension of imminent contact, not fear, is what matters.
        correct: true
        why: |
          This directly reflects the stated principle that fear is not necessary; the focus is on apprehension of imminent contact.
      - text: |
          Yes, but only where the threat comes from a stranger.
        correct: false
        why: |
          There is no such stranger/acquaintance distinction — fear is simply not a required element at all.
      - text: |
          No, because assault does not concern the plaintiff's mind at all.
        correct: false
        why: |
          This is wrong — assault does concern the plaintiff's mind (apprehension), it is simply that fear specifically is not required.
  - key: asl07
    type: mcq
    concept: assault
    difficulty: 2
    stem: |
      Can words alone amount to an assault?
    options:
      - text: |
          No — assault always requires some further physical gesture in addition to, and beyond, mere words, however threatening those words are.
        correct: false
        why: |
          Words alone are sufficient, provided they directly raise the required apprehension in the plaintiff's mind.
      - text: |
          Yes — if the words directly raise apprehension of imminent contact.
        correct: true
        why: |
          This matches the stated principle that words are sufficient provided they directly raise the necessary apprehension.
      - text: |
          Yes, but only if the words are shouted rather than spoken calmly.
        correct: false
        why: |
          Tone or volume is not the legal test; what matters is whether the words directly raise the apprehension of imminent contact.
      - text: |
          No — words can only ever support a claim in defamation, not assault.
        correct: false
        why: |
          This is incorrect; words are a recognised basis for assault where they create the necessary apprehension.
  - key: asl08
    type: mcq
    concept: assault
    difficulty: 3
    cases: [zanker-v-vartzokas]
    stem: |
      In Zanker v Vartzokas, why was the threat held to be sufficiently imminent, even though the driver's plan involved taking the plaintiff to a location some distance away?
    options:
      - text: |
          Because the plaintiff was physically struck immediately.
        correct: false
        why: |
          There was no immediate physical strike; the case turned on the imminence of a threat, not an actual battery.
      - text: |
          Because imminence does not require immediacy where escape is impossible.
        correct: true
        why: |
          This reflects the court's reasoning: the plaintiff was trapped with no way to escape, so the threat was imminent even though it would not eventuate that instant.
      - text: |
          Because the defendant explicitly named a time when the harm would occur.
        correct: false
        why: |
          No specific time was named; imminence was found from the plaintiff's inability to escape the situation, not from a stated deadline.
      - text: |
          Because the plaintiff had accepted the lift voluntarily at the outset, which permanently waived any later assault claim against the driver.
        correct: false
        why: |
          Accepting a lift does not waive an assault claim; there is no such waiver principle in the reasoning of the case.
  - key: asl09
    type: mcq
    concept: assault
    difficulty: 2
    variant-of: asl08
    stem: |
      A locks the doors of a moving car and tells a passenger, "once we get to the warehouse, you're going to regret this." The passenger cannot get out until the car stops. Could this satisfy the imminence element of assault?
    options:
      - text: |
          Yes — since the passenger cannot escape the car, the threat can still be imminent.
        correct: true
        why: |
          The passenger's inability to escape the confined, moving vehicle before the threat is carried out mirrors the imminence reasoning in Zanker v Vartzokas.
      - text: |
          No — because the threatened harm will not occur until they eventually reach the warehouse at some unspecified later point, which is never "imminent".
        correct: false
        why: |
          This misunderstands imminence; Zanker v Vartzokas shows imminence does not require the harm to occur immediately, only that there is no escape beforehand.
      - text: |
          No — imminence can only be satisfied by an immediate physical blow.
        correct: false
        why: |
          Zanker v Vartzokas shows a threat of future harm can be imminent if escape is impossible in the meantime; an immediate blow is not required.
      - text: |
          Yes, but only if the passenger can prove they were physically injured.
        correct: false
        why: |
          No injury is required for assault at all — assault concerns apprehension, not actual contact or harm.
  - key: asl10
    type: mcq
    concept: assault
    difficulty: 2
    stem: |
      Which statement correctly describes the relationship between assault and battery?
    options:
      - text: |
          Assault always results in a battery.
        correct: false
        why: |
          This is incorrect — assault can occur without any battery following, for example where the threatened contact never eventuates.
      - text: |
          Assault can occur alone; battery usually, not always, involves it.
        correct: true
        why: |
          This matches the stated relationship: assault can stand alone, and battery usually but not always also involves an assault.
      - text: |
          Battery always requires a prior assault.
        correct: false
        why: |
          A sudden, unseen blow can be a battery without any preceding assault, since the victim never apprehended it.
      - text: |
          Assault and battery are, despite the different names given to them in the cases, ultimately simply two labels for one and the same single tort.
        correct: false
        why: |
          They are distinct torts with different elements — assault protects against apprehension, battery against actual contact.
  - key: asl11
    type: mcq
    concept: assault
    difficulty: 3
    contrasts-with: [battery]
    stem: |
      D sneaks up behind P and punches P in the back of the head without any warning. P never saw or anticipated the blow. Which tort(s) can P establish?
    options:
      - text: |
          Assault only, because P suffered physical harm.
        correct: false
        why: |
          Physical harm alone does not establish assault; assault requires the plaintiff to have apprehended the contact beforehand, which did not happen here.
      - text: |
          Battery only — P never apprehended the unseen blow.
        correct: true
        why: |
          Because P had no warning and therefore no apprehension of imminent contact, assault is not made out; but the actual, direct, intentional contact is a battery.
      - text: |
          Both battery and assault, since a violent blow necessarily involves both.
        correct: false
        why: |
          This is a common misconception — an unseen blow lacks the apprehension element assault requires, even though it is plainly a battery.
      - text: |
          Neither tort, because P did not see the blow coming and so cannot prove any element of any cause of action arising from it.
        correct: false
        why: |
          Battery does not require the plaintiff to see the contact coming; the direct, intentional physical contact alone is enough for battery.
  - key: asl12
    type: mcq
    concept: assault
    difficulty: 2
    stem: |
      D points what looks like a realistic toy gun at P, who genuinely (and reasonably) believes it to be real and fears being shot. Could this be an assault?
    options:
      - text: |
          Yes — P's reasonable apprehension is enough; the gun being fake is immaterial if unknown to P.
        correct: true
        why: |
          Assault focuses on the plaintiff's reasonable apprehension of imminent contact; unknown to P, the gun being a toy does not defeat this if P reasonably believed it capable of harm.
      - text: |
          No — an assault can never be committed with a toy weapon.
        correct: false
        why: |
          The nature of the object is not decisive; what matters is whether it created a reasonable apprehension of imminent contact in the plaintiff's mind.
      - text: |
          No — because the gun could not actually fire and cause harm.
        correct: false
        why: |
          The genuine capacity to cause harm is not required if the plaintiff reasonably, and without knowing otherwise, apprehended imminent harmful contact.
      - text: |
          Yes, but only if D actually intended to pull the trigger.
        correct: false
        why: |
          D need only intend to create the apprehension of imminent contact, not intend to actually fire or make contact.
  - key: asl13
    type: mcq
    concept: assault
    difficulty: 2
    stem: |
      D sends an ex-partner, P, a text message saying, "I'm gonna get you fixed up!" while D is interstate and has no way of reaching P for several days. Is this likely to be an assault?
    options:
      - text: |
          Likely not — no possibility of imminent contact means no reasonable apprehension.
        correct: true
        why: |
          Imminence requires at least the possibility of physical contact in the near term; being interstate with no means of reaching P for days undermines that possibility.
      - text: |
          Yes — because the words are threatening in tone.
        correct: false
        why: |
          Threatening tone alone is not enough; there must be a reasonable apprehension of imminent contact, which requires at least the possibility of that contact occurring soon.
      - text: |
          Yes — because assault can always be committed just as easily by text message as in person, regardless of any distance or timing involved.
        correct: false
        why: |
          Distance and timing matter to imminence; the mode of communication (text) is not itself decisive.
      - text: |
          No — because words alone can never amount to assault.
        correct: false
        why: |
          Words alone can be an assault if they directly raise the required apprehension; the issue here is the lack of imminence, not that words were used.
  - key: asl14
    type: mcq
    concept: assault
    difficulty: 2
    stem: |
      D silently raises a fist to punch P from directly behind P, where P cannot see or sense the gesture at all. Does this create an assault?
    options:
      - text: |
          No — P must actually perceive D's gesture for apprehension to arise at all.
        correct: true
        why: |
          Assault requires the plaintiff to actually apprehend the imminent contact; if P cannot perceive the gesture at all, there is no apprehension and so no assault (though a battery may follow if the punch lands).
      - text: |
          Yes — the defendant's intention to punch is enough on its own.
        correct: false
        why: |
          The defendant's intention is necessary but not sufficient; the plaintiff must also actually apprehend the imminent contact, which cannot happen if P is unaware of the gesture.
      - text: |
          Yes — because any raised fist directed at someone is inherently and automatically threatening, regardless of whether the intended victim ever notices it at all.
        correct: false
        why: |
          Apprehension must occur in the plaintiff's own mind; a threat the plaintiff never perceives cannot create that apprehension.
      - text: |
          It depends only on whether D actually throws the punch afterwards.
        correct: false
        why: |
          Whether the punch is thrown determines a possible battery, not whether an assault occurred at the moment of the unseen gesture.
  - key: asl15
    type: mcq
    concept: assault
    difficulty: 2
    stem: |
      Like battery, assault requires the interference to be "direct". Which of these best describes what "direct" adds to the tort?
    options:
      - text: |
          The apprehension must follow directly from the act, not consequentially.
        correct: true
        why: |
          As with the general principles of trespass to the person, the apprehension must follow directly from the defendant's act, mirroring the directness requirement across battery, assault and false imprisonment.
      - text: |
          It means the defendant must at all times be standing directly and physically in front of, and facing, the plaintiff.
        correct: false
        why: |
          Physical proximity or facing direction is not what "direct" refers to; it is about the causal directness of the act, not spatial orientation.
      - text: |
          It means the plaintiff must suffer direct financial loss.
        correct: false
        why: |
          Financial loss plays no role in assault, which is actionable per se; "direct" refers to the causal link between act and apprehension.
      - text: |
          It has no separate meaning in assault, unlike in battery.
        correct: false
        why: |
          Directness is one of the general principles applying to all trespass to the person torts, including assault.
  - key: asl16
    type: mcq
    concept: assault
    difficulty: 3
    stem: |
      At a protest, D shouts at P, "get any closer and I'll make sure you regret it", while gripping a metal pole and taking a step toward P. P immediately apprehends being struck. Which elements are most clearly satisfied?
    options:
      - text: |
          All the elements — positive act, directness, intention and apprehension — are satisfied.
        correct: true
        why: |
          D's words plus stepping forward with a weapon is a positive, direct, intentional act, and P's immediate apprehension of being struck is objectively reasonable in the circumstances.
      - text: |
          Only the spoken words satisfy any element at all; the step forward and the pole D was gripping are entirely irrelevant in law.
        correct: false
        why: |
          The step forward and the pole are part of the overall conduct that makes the apprehension of imminent, harmful contact objectively reasonable — they are not irrelevant.
      - text: |
          None of the elements are satisfied because D never actually struck P.
        correct: false
        why: |
          Assault does not require any actual contact; apprehension of imminent contact is enough, which is present here.
      - text: |
          Only reasonable apprehension is satisfied; there is no positive or intentional act.
        correct: false
        why: |
          D's conduct — stepping forward with a pole while making a threat — is plainly a positive, intentional act, not merely apprehension arising out of nothing.
  - key: asl17
    type: truefalse
    concept: assault
    difficulty: 1
    set: quickfire
    statement: |
      Assault requires the defendant to actually touch the plaintiff.
    answer: false
    why: |
      Assault requires no touching at all — only a reasonable apprehension of imminent contact; touching would instead point to a battery.
  - key: asl18
    type: truefalse
    concept: assault
    difficulty: 2
    set: quickfire
    statement: |
      The test for reasonable apprehension in assault is subjective, based solely on how the particular plaintiff felt.
    answer: false
    why: |
      The test is objective — whether a reasonable person in the plaintiff's position would have apprehended the threat.
  - key: asl19
    type: truefalse
    concept: assault
    difficulty: 2
    set: quickfire
    cases: [zanker-v-vartzokas]
    statement: |
      A threat can be "imminent" for the purposes of assault even if the harm will not occur that very instant, provided the plaintiff has no means of escape beforehand.
    answer: true
    why: |
      This reflects Zanker v Vartzokas: imminence does not require immediacy, only the absence of an effective means of escape before the threat could be carried out.
  - key: asl20
    type: short
    concept: assault
    difficulty: 3
    prompt: |
      During an argument in a share house, D picks up a kitchen knife, points it at P from across the room, and says, "don't push me, or you'll regret it." P is frozen with apprehension. D never moves any closer. Advise whether P has an action in assault against D.
    model: |
      Assault requires a positive act, direct interference, an intentional act, reasonable apprehension in the plaintiff of imminent harmful or offensive contact, and no lawful justification. D's act of picking up the knife, pointing it at P and threatening P is a positive, direct and intentional act. The central issue is whether P's apprehension of imminent contact was reasonable, applying an objective test: would a reasonable person in P's position have apprehended the threat? Given D is armed, has verbally threatened P, and P is within range, a reasonable person would likely apprehend imminent harmful contact, even though D never physically moves closer — as Zanker v Vartzokas shows, imminence does not require immediate contact, only that the threat could be carried out without effective means of escape, and being cornered in a room with an armed person satisfies this. P need not prove fear, only apprehension. On these facts D has no apparent lawful justification. P is therefore likely to succeed in an action for assault against D.
    rubric:
      - id: r1
        criterion: |
          Sets out the elements of assault
        marks: 1
        top-band: |
          Lists positive act, direct interference, intention, reasonable apprehension of imminent contact, and lawful justification.
        margin-note: |
          Elements first, then apply.
        authorities: []
      - id: r2
        criterion: |
          Applies the objective reasonable-apprehension test
        marks: 1
        top-band: |
          Explicitly frames the test as what a reasonable person in P's position would apprehend, not P's subjective fear.
        margin-note: |
          Good use of the objective standard.
        authorities: []
      - id: r3
        criterion: |
          Applies imminence correctly using Zanker v Vartzokas
        marks: 2
        top-band: |
          Explains imminence does not require immediate contact, only the absence of an effective escape, and applies this to the cornered scenario.
        margin-note: |
          This is the trickiest element here — well applied.
        authorities: []
  - key: fi01
    type: mcq
    concept: false-imprisonment
    difficulty: 1
    set: pretest
    stem: |
      Which of the following is NOT an element of false imprisonment?
    options:
      - text: |
          A positive act by the defendant.
        correct: false
        why: |
          This is required for false imprisonment, consistent with the general principles of trespass to the person.
      - text: |
          That the plaintiff be confined behind a physical or locked barrier such as a wall or a locked door.
        correct: true
        why: |
          False imprisonment does not require physical boundaries at all — total restraint can be achieved without any physical barrier, for example through mental coercion.
      - text: |
          Direct interference by the defendant's act.
        correct: false
        why: |
          The restraint must follow directly from the defendant's act, consistent with the general principles of trespass to the person.
      - text: |
          Total restraint of the plaintiff's liberty without lawful justification.
        correct: false
        why: |
          This is the central element distinguishing false imprisonment from a merely partial restriction on movement.
  - key: fi02
    type: mcq
    concept: false-imprisonment
    difficulty: 2
    stem: |
      Does false imprisonment require the plaintiff to be confined by walls, bars or a locked door?
    options:
      - text: |
          Yes, always — without a physical structure of some kind there can never be an imprisonment recognised by the law of tort.
        correct: false
        why: |
          This is incorrect; a plaintiff can be totally imprisoned without any physical boundaries, for example through mental coercion or an assertion of authority.
      - text: |
          No — mental coercion or an assertion of authority can achieve total restraint without any barrier.
        correct: true
        why: |
          The materials state a plaintiff can be totally imprisoned without physical boundaries, so a physical structure is not required.
      - text: |
          No, but only if the defendant restraining the plaintiff happens to be a police officer acting in an official capacity.
        correct: false
        why: |
          There is no such limitation to police officers; the restraint can come from any defendant who imposes total, unlawful restraint.
      - text: |
          Yes, unless the plaintiff detained happens to be a minor under the age of eighteen.
        correct: false
        why: |
          There is no exception based on the plaintiff's age in the general elements of false imprisonment.
  - key: fi03
    type: mcq
    concept: false-imprisonment
    difficulty: 2
    variant-of: fi02
    stem: |
      An employer tells an employee that if they leave the meeting room before being told they may go, they will be reported to police and arrested, though the employer has no real power to have them arrested for leaving. The employee stays, genuinely believing they cannot leave. Could this be false imprisonment despite no locked door?
    options:
      - text: |
          Yes — an assertion of authority or a false threat, without more, can amount to a total restraint even without any physical boundary.
        correct: true
        why: |
          Consistent with the principle that a plaintiff can be totally imprisoned without physical boundaries, a coercive false assertion of authority can amount to total restraint.
      - text: |
          No — without a locked door or some other physical barrier, there can never be any false imprisonment at all.
        correct: false
        why: |
          This misstates the law; physical boundaries are not required, as mental coercion or a false assertion of authority can suffice.
      - text: |
          No — because the employee could theoretically have simply ignored the threat entirely and walked straight out.
        correct: false
        why: |
          Whether escape was reasonably available depends on all the circumstances, including whether a reasonable person would have felt genuinely restrained by a credible-seeming threat of arrest.
      - text: |
          Yes, but only if the employee can also separately show they suffered financial loss as a result of staying.
        correct: false
        why: |
          False imprisonment is actionable per se; no financial loss needs to be shown.
  - key: fi04
    type: mcq
    concept: false-imprisonment
    difficulty: 2
    stem: |
      Which of the following is true about a plaintiff's awareness of their imprisonment?
    options:
      - text: |
          A plaintiff cannot be falsely imprisoned unless they were fully aware of the restraint at the exact time it was happening.
        correct: false
        why: |
          This is incorrect; the materials state a plaintiff may be falsely imprisoned even if they do not know it at the time.
      - text: |
          A plaintiff may be falsely imprisoned even without knowing of the detention until afterwards.
        correct: true
        why: |
          This directly matches the stated principle, drawn from cases such as Meering v Graham-White Aviation.
      - text: |
          Awareness of the restraint is relevant only to the amount of damages, and is never relevant to liability itself in any way.
        correct: false
        why: |
          While awareness may affect damages, the more fundamental point tested here is that awareness is not required for liability itself.
      - text: |
          A plaintiff must be aware of the restraint, but only where they are seeking an award of exemplary damages specifically.
        correct: false
        why: |
          Awareness of the restraint is not a precondition for the tort itself at all, regardless of which type of damages is sought.
  - key: fi05
    type: mcq
    concept: false-imprisonment
    difficulty: 2
    variant-of: fi04
    stem: |
      A hospital patient is sedated and, unknown to them, a security guard is stationed to prevent them leaving their room for several hours; the patient remains asleep throughout and never realises. Could the patient still have an action in false imprisonment?
    options:
      - text: |
          Yes — a plaintiff may be falsely imprisoned even though they never became aware of the detention at any point while it was occurring.
        correct: true
        why: |
          This follows the principle that awareness of the restraint at the time is not required for the tort of false imprisonment.
      - text: |
          No — without any awareness whatsoever of being restrained, there can never be a valid claim in false imprisonment.
        correct: false
        why: |
          The materials specifically reject an awareness requirement; a plaintiff can be imprisoned without knowing it at the time.
      - text: |
          No — sedation of the plaintiff always automatically defeats the total-restraint element of the tort.
        correct: false
        why: |
          Sedation does not defeat the total-restraint element; the presence of a guard actively preventing the patient leaving is a total restraint regardless of the patient's state.
      - text: |
          Yes, but only because the hospital's conduct in this scenario happened to be negligent rather than intentional.
        correct: false
        why: |
          The fault element could equally be satisfied by an intentional act (stationing the guard deliberately); negligence is not the only basis.
  - key: fi06
    type: mcq
    concept: false-imprisonment
    difficulty: 2
    stem: |
      Which of the following can satisfy the "direct interference" element of false imprisonment?
    options:
      - text: |
          Only detention carried out personally, by the defendant's own hands and physical presence at all times.
        correct: false
        why: |
          This is too narrow — directing, promoting or causing another person to detain the plaintiff can also satisfy directness.
      - text: |
          A defendant directing, promoting or causing another to detain the plaintiff.
        correct: true
        why: |
          The materials state directness includes a defendant who directs, promotes or causes another to detain the plaintiff, not only personal detention.
      - text: |
          Any restraint whatsoever, regardless of who actually caused it or how remote or coincidental the connection to the defendant might be.
        correct: false
        why: |
          The restraint must still be a direct result of the defendant's act, not merely a distant or coincidental consequence.
      - text: |
          Only restraint that is effected specifically through the application of physical force by someone.
        correct: false
        why: |
          Directness does not require physical force; it concerns the causal chain between the defendant's act and the restraint.
  - key: fi07
    type: mcq
    concept: false-imprisonment
    difficulty: 2
    variant-of: fi06
    stem: |
      A store manager instructs a security guard to lock a suspected shoplifter in a back room. The manager never enters the room. Is the manager's conduct capable of satisfying "direct interference"?
    options:
      - text: |
          Yes — directing or causing another person to detain the plaintiff satisfies the directness element.
        correct: true
        why: |
          The manager directed and caused the security guard to carry out the detention, which the materials confirm can satisfy directness even without personal detention.
      - text: |
          No — because the manager never physically touched or locked the door of the room personally at any point.
        correct: false
        why: |
          Personal physical involvement is not required; directing another to detain the plaintiff is sufficient for directness.
      - text: |
          No — instructions given by a manager to an employee can never, in any circumstances, count as a direct act in law.
        correct: false
        why: |
          This is incorrect; directing or causing another to detain is expressly recognised as satisfying directness.
      - text: |
          It depends only on whether the shoplifter was actually guilty of stealing something from the store.
        correct: false
        why: |
          Guilt or innocence may bear on lawful justification, but it is separate from whether directness is satisfied.
  - key: fi08
    type: mcq
    concept: false-imprisonment
    difficulty: 3
    cases: [balmain-new-ferry-v-robertson]
    stem: |
      Applying Balmain New Ferry v Robertson, a ticketed patron who enters a fairground on condition they pay an exit fee is refused exit until they pay it. Is this false imprisonment?
    options:
      - text: |
          No — a condition of entry that the plaintiff is able to meet in order to leave is treated as a lawful excuse to the detention.
        correct: true
        why: |
          As in Balmain New Ferry v Robertson, a restraint tied to a condition of entry that the plaintiff can meet to be released provides a lawful excuse, defeating the claim.
      - text: |
          Yes — requiring any payment at all before allowing a person to exit premises is always, without exception, unlawful detention.
        correct: false
        why: |
          Balmain New Ferry v Robertson establishes the opposite: a condition of entry, which the plaintiff can satisfy to leave, is a lawful excuse.
      - text: |
          Yes — because the patron never actually expected, when first entering the fairground, to later be charged an exit fee of this kind.
        correct: false
        why: |
          Subjective expectation is not decisive; what matters is that entry was on a known condition capable of being satisfied, as in Balmain New Ferry v Robertson.
      - text: |
          No, but only because the patron could theoretically have climbed over a perimeter fence to escape instead of paying.
        correct: false
        why: |
          The reasoning in Balmain New Ferry v Robertson turns on the lawful excuse created by the condition of entry, not on an unreasonable escape route.
  - key: fi09
    type: mcq
    concept: false-imprisonment
    difficulty: 3
    variant-of: fi08
    cases: [balmain-new-ferry-v-robertson]
    stem: |
      A nightclub patron who entered for free is told, part way through the night, that they must now pay an unexpected new fee before being allowed to leave — a condition that did not exist when they entered. Applying the reasoning in Balmain New Ferry v Robertson, is the patron's detention likely to have a lawful excuse?
    options:
      - text: |
          Less likely — the lawful excuse in that case rested on a condition accepted at entry, not one added later.
        correct: true
        why: |
          The lawful excuse in Balmain New Ferry v Robertson arose because the passenger's entry was itself conditional; imposing a brand-new condition after entry is materially different.
      - text: |
          Yes — any request for payment before exit is automatically a lawful excuse, no matter when during the visit it is first imposed.
        correct: false
        why: |
          This over-extends Balmain New Ferry v Robertson, which relied specifically on a condition accepted at entry, not a condition invented afterwards.
      - text: |
          Yes — because venues such as nightclubs are always free to set whatever new conditions they like on patrons at any time.
        correct: false
        why: |
          There is no such unlimited power; the lawful-excuse reasoning depends on the condition being part of the terms of entry, not a later imposition.
      - text: |
          No — false imprisonment can never, under any circumstances, be based on a request or demand for money from the plaintiff.
        correct: false
        why: |
          Balmain New Ferry v Robertson shows a payment condition attached to entry can be a lawful excuse; the issue here is timing, not that money conditions never matter.
  - key: fi10
    type: mcq
    concept: false-imprisonment
    difficulty: 2
    stem: |
      What does it mean for a restraint of liberty to be "total" for the purposes of false imprisonment?
    options:
      - text: |
          The plaintiff must be completely and physically unable to move at all, even by a single step in any direction.
        correct: false
        why: |
          This is too strict — the test concerns whether there is a reasonable means of escape, not whether the plaintiff can move even slightly.
      - text: |
          There must be no reasonable means of escape available to the plaintiff.
        correct: true
        why: |
          This reflects the stated principle that restraint is total only where there is no reasonable means of escape.
      - text: |
          The restraint must last for a minimum period of at least twenty-four consecutive hours to count as "total" in law.
        correct: false
        why: |
          There is no minimum duration; even a short period of total restraint can be false imprisonment.
      - text: |
          The plaintiff must be restrained by more than one person acting together in a coordinated way.
        correct: false
        why: |
          A single defendant can impose a total restraint; the number of people involved is not relevant to whether the restraint is total.
  - key: fi11
    type: mcq
    concept: false-imprisonment
    difficulty: 2
    variant-of: fi10
    stem: |
      P is told they cannot leave a room except through a fire exit that would require climbing through a narrow, unlit crawlspace at real risk of injury. Is P's restraint likely to be "total"?
    options:
      - text: |
          Likely yes — an unsafe or genuinely unreasonable escape route does not count as a reasonable means of escape.
        correct: true
        why: |
          Total restraint depends on whether a reasonable means of escape exists; a dangerous, unreasonable route does not satisfy that standard.
      - text: |
          No — because a physical exit of some kind technically exists, the restraint can therefore never be considered total in law.
        correct: false
        why: |
          The mere theoretical existence of an exit is not enough if using it is unreasonable or unsafe; the restraint may still be total.
      - text: |
          No — total restraint requires proof that the room in question had absolutely no exits of any kind whatsoever, ever.
        correct: false
        why: |
          This misstates the test; it is about the reasonableness of any available means of escape, not the literal absence of every possible exit.
      - text: |
          It depends only on precisely how many total minutes or hours P happened to remain inside the room.
        correct: false
        why: |
          Duration is not the determining factor for whether restraint is "total" — the reasonableness of any escape route is what matters.
  - key: fi12
    type: mcq
    concept: false-imprisonment
    difficulty: 3
    stem: |
      D, a security guard, detains P on a reasonable but mistaken belief that P is a person D was lawfully entitled to detain, when in fact P is not. Can D still be liable for false imprisonment?
    options:
      - text: |
          No — a reasonable mistaken belief in a lawful right to detain always and completely excuses the defendant from any liability.
        correct: false
        why: |
          This is incorrect; the materials state an intentional act of imprisonment can still attract liability even where the defendant held a reasonable but mistaken belief.
      - text: |
          Yes — a reasonable but honestly and genuinely mistaken belief in a right to detain is not itself a lawful justification.
        correct: true
        why: |
          This matches the stated principle that a reasonable mistaken belief in lawfulness does not, of itself, excuse the defendant from liability for false imprisonment.
      - text: |
          No — because the guard's conduct in detaining P was intentional rather than merely careless or negligent in nature.
        correct: false
        why: |
          Intentional conduct does not excuse the guard; intentional imprisonment under a mistaken belief is precisely the situation where liability can still arise.
      - text: |
          Yes, but only where P can additionally prove they suffered some physical injury during the period of detention.
        correct: false
        why: |
          False imprisonment is actionable per se; no injury needs to be shown, and the mistaken-belief point does not turn on injury.
  - key: fi13
    type: mcq
    concept: false-imprisonment
    difficulty: 2
