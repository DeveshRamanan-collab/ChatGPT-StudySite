        correct: false
        why: |
          Detinue concerns wrongful detention, not damage or destruction; the goods can be entirely intact and detinue can still apply.
  - key: cad15
    type: mcq
    concept: conversion-and-detinue
    difficulty: 2
    variant-of: cad14
    stem: |
      P asks D to return P's ladder, which D has been storing, giving D clear, specific instructions on where and when to deliver it. D simply ignores the request and keeps the ladder. Assuming P has a right to immediate possession, has D likely committed detinue?
    options:
      - text: |
          Likely yes — P made a clear, specific demand and D expressly and wrongfully refused it by ignoring it.
        correct: true
        why: |
          P's clear, specific demand followed by D's wrongful refusal to comply, combined with P's right to immediate possession, are the elements detinue requires.
      - text: |
          No — because P never, at any point, had actual physical possession of the ladder while D was storing it.
        correct: false
        why: |
          Actual possession is not required for detinue; a right to immediate possession, plus a demand and wrongful refusal, is sufficient.
      - text: |
          No — because D never said the word "no" outright to P, but merely ignored the request without any express reply.
        correct: false
        why: |
          A refusal for detinue purposes can be shown through conduct such as ignoring a clear demand and continuing to withhold the goods.
      - text: |
          Yes, but only if D can be shown to specifically intend to keep the ladder permanently and forever.
        correct: false
        why: |
          There is no requirement that D intend to keep the goods permanently; wrongfully refusing to return them on a valid demand is enough.
  - key: cad16
    type: mcq
    concept: conversion-and-detinue
    difficulty: 2
    stem: |
      When might a defendant's refusal to return goods in a detinue claim be considered reasonable, and so not wrongful?
    options:
      - text: |
          Where the refusal is made reasonably, in order to verify whether the plaintiff was entitled to the goods.
        correct: true
        why: |
          The materials state the defendant may not be liable if the refusal to return goods is reasonable, for example, to verify entitlement.
      - text: |
          Whenever the defendant, for whatever personal reason, simply prefers on balance to keep hold of the goods.
        correct: false
        why: |
          A bare preference to keep the goods is not a recognised reasonable basis for refusal; it would ordinarily be a wrongful refusal.
      - text: |
          Whenever the particular goods concerned happen to be especially valuable or rare in nature.
        correct: false
        why: |
          The value of the goods is not the test for whether a refusal is reasonable; verifying entitlement is the example given.
      - text: |
          Only in circumstances where the defendant has, in the meantime, already sold the goods on to a third party.
        correct: false
        why: |
          Having already sold the goods is not identified as making a refusal reasonable; the example given concerns verifying entitlement, not prior disposal.
  - key: cad17
    type: mcq
    concept: conversion-and-detinue
    difficulty: 3
    contrasts-with: [trespass-to-goods]
    stem: |
      P's neighbour, D, borrows P's ladder "for the afternoon" and simply never gives it back, ignoring P's repeated clear requests for its return over several weeks, though D has not sold or damaged it. Which tort best captures P's likely remedy of getting the specific ladder back, as opposed to damages?
    options:
      - text: |
          Detinue, since it uniquely allows a court to order return of the specific chattel on a right to immediate possession.
        correct: true
        why: |
          Detinue is the tort described as uniquely allowing a court to order the return of chattels, fitting P's goal of recovering the specific ladder.
      - text: |
          Trespass to goods, because any interference at all with a chattel automatically entitles the plaintiff to its return.
        correct: false
        why: |
          Trespass to goods does not carry the same unique remedial feature of ordering return of the specific chattel; that is detinue's feature.
      - text: |
          Conversion, because a claim in conversion will, as a matter of course, always result in an order for return of the goods.
        correct: false
        why: |
          Conversion does not carry this unique return-of-goods remedy; it is detinue that is specifically noted as allowing return of the chattel.
      - text: |
          None of these three torts can, in any circumstances, ever result in the plaintiff getting the specific chattel back.
        correct: false
        why: |
          Detinue specifically allows a court to order the return of the chattel, unlike a bare damages remedy.
  - key: cad18
    type: mcq
    concept: conversion-and-detinue
    difficulty: 2
    stem: |
      Which pair correctly matches each tort with its title-to-sue requirement?
    options:
      - text: |
          Trespass — actual possession at interference; conversion — possession or a right to immediate possession.
        correct: true
        why: |
          This is exactly the distinction drawn in the materials between the two torts' title-to-sue requirements.
      - text: |
          Trespass to goods — a mere right to immediate possession; conversion — only ever actual possession itself.
        correct: false
        why: |
          This reverses the actual rule; trespass requires actual possession, while conversion can rely on a right to immediate possession.
      - text: |
          Both of these two distinct torts require the plaintiff to hold the complete and full legal ownership of the goods.
        correct: false
        why: |
          Neither tort requires full legal ownership; trespass needs possession, and conversion needs possession or a right to immediate possession.
      - text: |
          Neither tort has, in truth, any specific title-to-sue requirement of any kind whatsoever attached to it.
        correct: false
        why: |
          Both torts have clearly stated title-to-sue requirements, as distinguished in the materials.
  - key: cad19
    type: truefalse
    concept: conversion-and-detinue
    difficulty: 2
    set: quickfire
    statement: |
      Conversion is a tort of strict liability, so a defendant's honest and reasonable mistake, such as an auctioneer's good-faith error, is no defence.
    answer: true
    why: |
      The materials state conversion is a tort of strict liability, giving the specific example that good faith or mistake by an auctioneer is no defence.
  - key: cad20
    type: truefalse
    concept: conversion-and-detinue
    difficulty: 1
    set: quickfire
    statement: |
      Detinue requires the plaintiff to have had actual possession or ownership of the chattel.
    answer: false
    why: |
      Detinue only requires a right to immediate possession, plus a demand and wrongful refusal — no actual possession or ownership is required.

pretest: [bat01, asl01, fi01, aoc01, ttg01]

cards:
  - type: basic
    concept: battery
    front: |
      What are the five elements of battery?
    back: |
      A voluntary and positive act; direct interference; intentional or negligent contact; physical interference (bodily contact); and unlawful touching (no consent or lawful excuse).
    source: "Torts Topic 2 Lecture 1, slide 7"
  - type: cloze
    concept: battery
    text: |
      In battery, standing passively in a doorway is {{c1::not}} a positive act, but a continuing failure to move after an earlier positive act {{c2::can}} count as one (Fagan v Metropolitan Police Commissioner).
    source: "Torts Topic 2 Lecture 1, slide 8"
  - type: apply
    concept: battery
    scenario: |
      A stranger touches another commuter's shoulder only to ask for directions, using minimal force.
    answer: |
      This is within contact generally acceptable in everyday life (Rixon v Star City Pty Ltd) — not a battery.
    source: "Torts Week 2 Casebook, p 1 (Rixon extract)"
  - type: basic
    concept: battery
    front: |
      Does battery require the defendant's own body to touch the plaintiff?
    back: |
      No — contact through an object, weapon or substance (eg tear gas) is sufficient, as in Binsaris v Northern Territory.
    source: "Torts Topic 2 Lecture 1, slide 10"
  - type: cloze
    concept: battery
    text: |
      The principle of personal inviolability means any {{c1::slight}} touching without a lawful excuse can be a battery, regardless of {{c2::hostility}} or anger.
    source: "Torts Topic 2 Lecture 1, slide 11"
  - type: basic
    concept: assault
    front: |
      What intention does assault require, according to Rixon v Star City Pty Ltd?
    back: |
      The intention to create in the plaintiff an apprehension of the commission of a battery — not the intention to actually commit the battery.
    source: "Torts Topic 2 Lecture 1, slide 15"
  - type: cloze
    concept: assault
    text: |
      In assault, "imminent" does not mean {{c1::immediate}} — a threat can be imminent if the plaintiff has no means of {{c2::escape}} before it can be carried out (Zanker v Vartzokas).
    source: "Torts Topic 2 Lecture 1, slide 17"
  - type: apply
    concept: assault
    scenario: |
      D locks the car doors and threatens P with harm "once we arrive", while driving.
    answer: |
      The threat can still be imminent because P has no means of escape before it is carried out — Zanker v Vartzokas.
    source: "Torts Topic 2 Lecture 1, slide 17"
  - type: basic
    concept: assault
    front: |
      Does the plaintiff need to feel fear to succeed in assault?
    back: |
      No — fear is not necessary; what matters is the plaintiff's reasonable apprehension of imminent contact, tested objectively.
    source: "Torts Topic 2 Lecture 1, slide 16"
  - type: basic
    concept: false-imprisonment
    front: |
      Can a plaintiff be falsely imprisoned without physical boundaries?
    back: |
      Yes — total restraint can arise through mental coercion or an assertion of authority, without any physical barrier.
    source: "Torts Topic 2 Lecture 1, slide 20"
  - type: cloze
    concept: false-imprisonment
    text: |
      In Balmain New Ferry v Robertson, the passenger's restraint was not false imprisonment because his entry was {{c1::conditional}}, giving a {{c2::lawful excuse}}.
    source: "Torts Topic 2 Lecture 1, slide 23"
  - type: apply
    concept: false-imprisonment
    scenario: |
      A security guard, reasonably but mistakenly believing P is a banned patron, detains P for fifteen minutes.
    answer: |
      The reasonable mistake does not itself provide lawful justification — D may still be liable for false imprisonment.
    source: "Torts Topic 2 Lecture 1, slide 24"
  - type: basic
    concept: false-imprisonment
    front: |
      Must the plaintiff know they are being detained at the time, to succeed in false imprisonment?
    back: |
      No — a plaintiff may be falsely imprisoned even if they do not know of the detention until after it is over.
    source: "Torts Topic 2 Lecture 1, slide 20"
  - type: basic
    concept: action-on-the-case-intentional-harm
    front: |
      What four elements must be proved for malicious prosecution?
    back: |
      The defendant initiated proceedings against the plaintiff; the proceedings terminated in the plaintiff's favour; the defendant acted maliciously; and the defendant acted without reasonable and probable cause.
    source: "Torts Topic 2 Lecture 1, slide 26"
  - type: cloze
    concept: action-on-the-case-intentional-harm
    text: |
      In A v New South Wales, malice and the absence of reasonable and probable cause are {{c1::distinct}} elements — the latter tested both {{c2::subjectively}} and objectively.
    source: "Torts Topic 2 Lecture 1, slide 27"
  - type: apply
    concept: action-on-the-case-intentional-harm
    scenario: |
      D falsely tells P that P's spouse has been badly injured, purely as a cruel joke, causing P nervous shock.
    answer: |
      This mirrors Wilkinson v Downton: a wilful act calculated to cause harm that actually causes harm is actionable.
    source: "Torts Topic 2 Lecture 1, slide 29"
  - type: basic
    concept: action-on-the-case-intentional-harm
    front: |
      Does intentional infliction of personal injury require an actual subjective intention to cause the specific harm?
    back: |
      No — Nationwide News v Naidu confirms reckless indifference to the result will suffice.
    source: "Torts Topic 2 Lecture 1, slide 30"
  - type: basic
    concept: remedies-intentional-torts-to-person
    front: |
      What are the four heads of damages for intentional torts to the person?
    back: |
      Nominal, compensatory, aggravated and exemplary.
    source: "Torts Topic 2 Lecture 1, slide 32"
  - type: cloze
    concept: remedies-intentional-torts-to-person
    text: |
      {{c1::Exemplary}} damages punish the defendant for egregious conduct, while {{c2::compensatory}} damages restore the plaintiff to their pre-tort position.
    source: "Torts Topic 2 Lecture 1, slide 32"
  - type: apply
    concept: remedies-intentional-torts-to-person
    scenario: |
      D's conduct is deliberate, humiliating and flagrant, causing P real physical injury.
    answer: |
      Compensatory (for the injury), aggravated (for the humiliation) and exemplary (for the flagrant conduct) damages may all be engaged together.
    source: "Torts Topic 2 Lecture 1, slide 32"
  - type: basic
    concept: trespass-to-goods
    front: |
      What are the two elements of possession?
    back: |
      An intention to exercise control and exclude others, and actual control.
    source: "Topic 2 Lecture 2, slide 7"
  - type: cloze
    concept: trespass-to-goods
    text: |
      Trespass to goods requires a {{c1::direct}} interference with a chattel in the plaintiff's {{c2::possession}} at the time of interference, and no proof of damage is generally required.
    source: "Topic 2 Lecture 2, slide 6"
  - type: apply
    concept: trespass-to-goods
    scenario: |
      Penfolds sues Elliott in trespass for using its branded bottles, but Elliott (not Penfolds) had possession of the bottles at the time.
    answer: |
      The trespass claim fails — trespass protects possession, and Penfolds lacked possession at the relevant time (Penfolds Wines Pty Ltd v Elliott).
    source: "Torts Week 2 Casebook, p 3 (Penfolds Wines extract)"
  - type: basic
    concept: trespass-to-goods
    front: |
      Does a finder of a chattel have enough possession to sue in trespass or conversion?
    back: |
      Yes — National Crime Authority v Flack holds a finder/occupier has possession in law over chattels on the premises, sufficient to sue everyone except the true owner.
    source: "Topic 2 Lecture 2, slide 11"
  - type: basic
    concept: conversion-and-detinue
    front: |
      How does conversion's title-to-sue requirement differ from trespass to goods?
    back: |
      Trespass needs actual possession at the time of interference; conversion can be sued on by a plaintiff with only a right to immediate possession (plus proprietary title).
    source: "Topic 2 Lecture 2, slide 13"
  - type: cloze
    concept: conversion-and-detinue
    text: |
      Hocking v Director General of the National Archives of Australia held that a merely {{c1::contractual}} or {{c2::custody}} right to possession will not suffice for conversion.
    source: "Topic 2 Lecture 2, slide 14"
  - type: apply
    concept: conversion-and-detinue
    scenario: |
      Bunnings uses CHEP's empty pallets to store goods delivered on them, and separately uses other empty pallets to transport its own goods.
    answer: |
      Storing the delivered goods on the pallets was not conversion; transporting Bunnings's own goods on empty pallets was conversion (Bunnings Group Ltd v CHEP Australia Ltd).
    source: "Topic 2 Lecture 2, slide 18"
  - type: basic
    concept: conversion-and-detinue
    front: |
      What must a plaintiff prove to succeed in detinue?
    back: |
      A right to immediate possession, a clear demand for the goods, and the defendant's wrongful refusal to return them — no actual possession or ownership is required.
    source: "Topic 2 Lecture 2, slide 20"
  - type: cloze
    concept: conversion-and-detinue
    text: |
      Conversion is a tort of {{c1::strict}} liability — good faith or mistake, for example by an {{c2::auctioneer}}, is no defence.
    source: "Topic 2 Lecture 2, slide 12"

audio:
  title: Week 2 recap — trespass to the person and interference with goods
  minutes: 3
  script: |
    This week is about the torts that protect our bodies, our liberty and our belongings. Start with battery: a
    direct, intentional or negligent act that makes physical contact with someone's body without consent or lawful
    excuse. You need five things — a positive act, directness, intention or negligence, physical contact, and
    unlawful touching. Standing still in a doorway isn't a positive act, that's Innes v Wylie, but if you've
    already driven onto someone's foot and then just don't move, that failure to move still counts, from Fagan.
    Contact doesn't need to be skin on skin either — tear gas touching someone's eyes was enough in Binsaris. And
    the trickiest bit is unlawful touching: it doesn't have to be angry or hostile, Rixon v Star City tells us the
    real question is whether the contact goes beyond what's generally acceptable in everyday life, like a tap on
    the shoulder to get someone's attention.

    Assault is different — no touching required at all. You just need a positive, intentional, direct act that
    creates a reasonable apprehension of imminent contact. The intention is to create that apprehension, not to
    actually follow through, again from Rixon. And imminent doesn't mean immediate — Zanker v Vartzokas shows a
    threat can be imminent if you can't escape before it happens, even if the harm is a little way off.

    False imprisonment protects liberty, not the body. Total restraint, with no reasonable means of escape, and no
    lawful justification. No physical walls needed — you can even be imprisoned without knowing it at the time. But
    a condition on entry, like paying to leave a wharf in Balmain New Ferry, gives a lawful excuse.

    When trespass doesn't fit because the harm is indirect, we turn to the action on the case: malicious
    prosecution needs initiation of proceedings, a favourable outcome, malice, and no reasonable and probable
    cause — A v New South Wales says these last two are separate. And Wilkinson v Downton covers a wilful act
    calculated to cause harm, like a cruel joke that triggers nervous shock — Nationwide News v Naidu adds that
    reckless indifference is enough, you needn't specifically intend the harm.

    Remedies can be nominal, compensatory, aggravated or exemplary, each doing a different job — restoring the
    plaintiff, punishing deliberate affronts, or punishing outright egregious conduct.

    Finally, goods. Trespass to goods needs direct interference with something you actually possess — Penfolds
    Wines shows possession, not ownership, counts. Conversion needs a serious dealing inconsistent with the
    owner's dominion, and only a right to immediate possession, like Bunnings v CHEP shows with its line between
    storing and transporting pallets. Detinue just needs a demand and a wrongful refusal to get the item back.
