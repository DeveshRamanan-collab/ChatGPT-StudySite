        why: |
          This describes negligence, not the intentional-harm tort recognised in Wilkinson v Downton, which requires a wilful act calculated to cause harm.
      - text: |
          Directly and intentionally touching the plaintiff's own body without that plaintiff's consent to the touching.
        correct: false
        why: |
          This describes battery; Wilkinson v Downton instead covers indirect harm (words causing shock), where there was no touching at all.
      - text: |
          Making a statement about the plaintiff that is both false and defamatory of their reputation.
        correct: false
        why: |
          This describes defamation; Wilkinson v Downton's tort concerns physical or psychiatric harm, not damage to reputation.
  - key: aoc07
    type: mcq
    concept: action-on-the-case-intentional-harm
