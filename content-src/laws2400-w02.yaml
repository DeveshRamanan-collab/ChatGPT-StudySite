          False imprisonment does not require physical contact with the plaintiff's body; standing near someone to block their exit restrains liberty, not the body.
      - text: |
          Whether P suffered any specific, quantifiable financial loss as a direct result of being delayed for fifteen minutes.
        correct: false
        why: |
          False imprisonment is actionable per se; financial loss is not a required element.
