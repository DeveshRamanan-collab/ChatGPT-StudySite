        why: |
          The High Court held they are distinct elements, not two expressions of the same thing.
      - text: |
          They are distinct — malice is positive, absence of cause is negative and tested both ways.
        correct: true
        why: |
          This matches the High Court's characterisation of the two elements as distinct, with malice positive and absence of reasonable and probable cause negative, tested both subjectively and objectively.
      - text: |
          Only malice needs to be proved at all; the absence of reasonable and probable cause is simply presumed once malice is shown.
        correct: false
        why: |
          Both elements must be independently established; proving malice does not create a presumption about the other element.
      - text: |
          Absence of reasonable and probable cause becomes entirely irrelevant once the proceedings terminate in the plaintiff's favour.
        correct: false
        why: |
          Termination in the plaintiff's favour is a separate element; absence of reasonable and probable cause must still be independently proved.
  - key: aoc05
    type: mcq
    concept: action-on-the-case-intentional-harm
