  - key: fi14
    type: mcq
    concept: false-imprisonment
    difficulty: 3
    contrasts-with: [assault]
    stem: |
      A security guard locks P inside an empty storeroom for twenty minutes, never touching P and never threatening any physical contact at all. Which tort, if any, is most clearly made out?
    options:
