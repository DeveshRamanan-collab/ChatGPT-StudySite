  - key: q021
    type: short
    concept: consent-defence-nature-and-onus
    difficulty: 3
    prompt: |-
      Priya is sued for battery after touching a patient during a medical procedure. At trial, the evidence
      about whether the patient consented is genuinely unclear — it could go either way. Explain how the
      outcome for Priya might differ depending on whether an Australian court adopts McHugh J's or Leeming
      JA's obiter view of consent, and why this matters.
    model: |-
      The classification of consent as a defence or an element determines who bears the onus of proof, which is
      decisive where the evidence is unclear. If a court follows McHugh J's obiter view in Marion's Case that
      consent is a defence, Priya (the defendant) bears the onus of proving the patient consented. On genuinely
      unclear evidence, Priya would fail to discharge that onus, and the patient would succeed in battery. If,
      instead, a court follows Leeming JA's obiter view in White v Johnston that consent is an element of
      assault and battery, the patient (as plaintiff) bears the onus of proving lack of consent. On the same
      unclear evidence, the patient would fail to discharge that onus, and Priya would succeed in defending the
      claim. This matters because Australian law has not settled which view is correct — both are obiter, and
      no binding ratio has resolved the conflict — so the answer to "who wins on unclear evidence" genuinely
      depends on which approach a court adopts. It also matters because deference to patient autonomy, the
      policy underpinning consent, might be thought to favour placing the onus on the party seeking to justify
      an interference (the defendant), which would support McHugh J's approach.
    rubric:
      - id: r1
        criterion: Identifies that the core issue is which party bears the onus of proof on consent
        marks: 2
        top-band: Explicitly frames the problem as a question of onus, not merely of whether consent existed.
        margin-note: Good — names onus as the operative concept.
        authorities: []
      - id: r2
        criterion: Correctly applies McHugh J's obiter (consent as a defence, onus on defendant) to the facts
        marks: 2
        top-band: Explains that Priya must prove consent and would lose on unclear evidence under this view.
        margin-note: Correctly applied to Priya's position.
        authorities: []
      - id: r3
        criterion: Correctly applies Leeming JA's obiter (consent as an element, onus on plaintiff) to the facts
        marks: 2
        top-band: Explains that the patient must disprove consent and would lose on unclear evidence under this view.
        margin-note: Correctly applied to the patient's position.
        authorities: []
      - id: r4
        criterion: Explains why this matters — the law is unsettled (both views are obiter) and the outcome genuinely depends on which is adopted
        marks: 2
        top-band: Notes the absence of a binding ratio resolving the conflict, and links this to the practical stakes for the parties.
        margin-note: Ties the doctrinal uncertainty to the practical outcome.
        authorities: []
