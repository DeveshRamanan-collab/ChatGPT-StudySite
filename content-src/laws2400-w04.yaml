      - text: The defendant obtained a court order in advance, and the plaintiff gave express written consent to the interference
        correct: false
        why: Necessity does not require advance court authorisation or the plaintiff's consent — indeed, it typically applies precisely because consent could not be obtained.
      - text: The defendant acted purely out of self-interest, and the plaintiff suffered no loss whatsoever as a result
        correct: false
        why: Necessity is not confined to self-interested action (it also covers protecting others, as in Proudman v Allen), and it typically does involve some loss to the plaintiff that the defence seeks to excuse.
      - text: The defendant was a public official, and the action was authorised by an Act of Parliament passed after the event
        correct: false
        why: Necessity is a general common law defence available to any defendant, not one confined to public officials or dependent on retrospective legislative authorisation.
  - key: q128
    type: mcq
    concept: necessity-defence
    difficulty: 1
    stem: Which of the following is an example of "public necessity" given in the lecture?
    options:
      - text: Throwing luggage out of a sinking ship to save lives
        correct: true
        why: Correct — this is the exact example the lecture gives of public necessity.
      - text: Trespassing on a neighbour's land to rescue your cat
        correct: false
        why: This is the lecture's example of necessity to protect one's own property, not public necessity.
      - text: A doctor treating an unconscious patient without consent to save their life
        correct: false
        why: This is the lecture's example of necessity to preserve the life or health of a person unable to consent, not public necessity.
      - text: A homeowner shooting an intruder who is trying to steal a television
        correct: false
        why: This scenario would more naturally raise self-defence or defence of property, not the public necessity example the lecture gives.
    variant-of: q128
  - key: q129
    type: mcq
    concept: necessity-defence
    difficulty: 2
    stem: In Southwark London Borough Council v Williams, why did Lord Denning reject the necessity defence pleaded by the homeless squatters?
    options:
      - text: Because admitting homelessness as a defence to trespass would mean "no one's house would be safe", and the doctrine must be carefully circumscribed
        correct: true
        why: Correct — this is Lord Denning's own reasoning as described in the lecture, warning against opening the door too widely.
      - text: Because the squatters had caused significant physical damage to the council-owned houses during their entry
        correct: false
        why: The lecture describes the squatters as having made "an orderly entry"; the rejection was based on the narrow scope of necessity, not property damage caused during entry.
      - text: Because necessity has never been recognised as a defence to trespass to land under any circumstances whatsoever
        correct: false
        why: Necessity can apply to trespass to land in the right circumstances (e.g., rescuing a pet from a neighbour's land); the issue in Southwark was that homelessness did not meet the narrow "great and imminent danger to life" standard.
      - text: Because the council had already obtained a possession order from a different court before the squatters raised necessity
        correct: false
        why: The reasoning given is about the narrow scope of the necessity doctrine itself, not a procedural point about which court had already acted.
    variant-of: q129
  - key: q130
    type: mcq
    concept: necessity-defence
    difficulty: 2
    stem: What did Proudman v Allen decide about who can rely on the necessity defence to protect property?
    options:
      - text: Even a volunteer or stranger who acts to protect the property of others can use the defence
        correct: true
        why: Correct — this is exactly the point the lecture draws from Proudman v Allen, extending the defence beyond the property's own owner.
      - text: Only the actual owner of the property being protected can ever rely on the defence
        correct: false
        why: Proudman v Allen holds the opposite — a stranger with no ownership interest successfully relied on the defence.
      - text: Only a person with a pre-existing contractual duty to protect the property in question can rely on the defence
        correct: false
        why: No such contractual duty is described in Proudman v Allen; the defendant acted spontaneously as a stranger to prevent a collision.
      - text: The defence is unavailable wherever the defendant's actions cause any damage to a third party's property
        correct: false
        why: Proudman v Allen itself involved damage to a third party's property (the runaway car ending up in the sea), and the defence still succeeded.
    variant-of: q130
  - key: q131
    type: mcq
    concept: necessity-defence
    difficulty: 2
    stem: On the facts of Proudman v Allen, what did the defendant actually do?
    options:
      - text: Turned the steering wheel of a driverless car rolling down a slope to avoid a collision with another car, causing the runaway car to roll into the sea
        correct: true
        why: Correct — this is exactly the fact pattern the lecture describes in Proudman v Allen.
      - text: Physically pushed another person out of the path of an oncoming car, injuring that person in the process
        correct: false
        why: The lecture's fact pattern concerns steering a driverless car, not physically pushing a person out of the way.
      - text: Broke into a locked garage to move a car that was blocking a fire truck's access to a burning building
        correct: false
        why: This scenario is not the fact pattern described for Proudman v Allen; it involves steering a runaway car, not entering a locked garage.
      - text: Refused to move a parked car despite being asked to do so by its owner, resulting in a collision
        correct: false
        why: This describes inaction and a refusal to move a car, which is the opposite of the defendant's active intervention in Proudman v Allen.
    variant-of: q130
  - key: q132
    type: mcq
    concept: necessity-defence
    difficulty: 3
    stem: How does the outcome in Proudman v Allen sit alongside the outcome in Southwark London Borough Council v Williams, given that necessity is described as a "narrow" doctrine?
    options:
      - text: Proudman v Allen fits within the property-protection branch of necessity and involved an immediate, specific danger (a runaway car about to collide), while Southwark's homelessness claim did not involve the same kind of immediate, great danger to life the doctrine requires
        correct: true
        why: "Correct — both cases are consistent with a narrow doctrine: the successful case involved an immediate danger to be averted, while the unsuccessful one did not meet that standard."
      - text: The two cases directly contradict each other, showing that necessity's scope is entirely random and unpredictable from one case to the next
        correct: false
        why: The two outcomes can be reconciled by reference to the doctrine's narrow scope — an immediate danger to be averted, rather than an ongoing state of need like homelessness.
      - text: Proudman v Allen was wrongly decided and has since been overruled by Southwark London Borough Council v Williams
        correct: false
        why: Nothing in the lecture suggests Southwark overruled Proudman v Allen; they address different necessity scenarios (property protection versus need arising from homelessness).
      - text: Both cases actually rejected the necessity defence, contrary to how they are usually described
        correct: false
        why: Proudman v Allen is described as a case where the defence succeeded, while Southwark is one where it failed; they did not both reject the defence.
    variant-of: q129
  - key: q133
    type: mcq
    concept: necessity-defence
    difficulty: 2
    stem: In NSW v McMaster, how was necessity pleaded, in relation to self-defence?
    options:
      - text: Necessity was pleaded alongside (in the alternative to) self-defence, given the situation of imminent danger and the reasonably necessary steps taken to ward it off
        correct: true
        why: Correct — the lecture describes necessity as pleaded alongside self-defence in this case.
      - text: Necessity was pleaded instead of self-defence, because self-defence was expressly withdrawn by Constable F before trial
        correct: false
        why: The lecture describes both defences as pleaded together, not necessity replacing a withdrawn self-defence plea.
      - text: Necessity was rejected outright at first instance and was not considered at all on appeal
        correct: false
        why: The lecture presents necessity as a defence successfully relied upon in these circumstances, not one rejected outright and never revisited.
      - text: Necessity was the only defence available, because self-defence does not apply where police officers are the defendants
        correct: false
        why: Self-defence was also available and considered (and succeeded) in NSW v McMaster; police officers are not excluded from the self-defence defence.
    variant-of: q133
  - key: q134
    type: mcq
    concept: necessity-defence
    difficulty: 2
    stem: "What two requirements did Lord Goff lay down in In re F (Mental Patient: Sterilisation) for applying the medical necessity principle?"
    options:
      - text: There must be a necessity to act when it is not practicable to communicate with the assisted person, and the action taken must be what a reasonable person would take, acting in their best interests
        correct: true
        why: Correct — these are exactly the two requirements Lord Goff laid down.
      - text: The patient must have previously signed an advance directive, and a second doctor must independently confirm the diagnosis
        correct: false
        why: No advance directive or second-doctor confirmation requirement is described; Lord Goff's test turns on practicability of communication and acting in the patient's best interests.
      - text: The treatment must be free of any cost to the patient, and must be approved by a hospital ethics committee
        correct: false
        why: Cost-free treatment and ethics committee approval are not part of Lord Goff's stated test in the lecture materials.
      - text: The patient must be under 18 years of age, and the treatment must relate only to reproductive health
        correct: false
        why: Lord Goff's test is of general application to persons unable to consent, not limited by age or to reproductive health treatment specifically.
    variant-of: q134
  - key: q135
    type: mcq
    concept: necessity-defence
    difficulty: 3
    stem: What distinction did Lord Goff draw between temporary and permanent incapacity, for the purposes of medical necessity?
    options:
      - text: For temporary incapacity, the doctor should do no more than necessary before the patient recovers consciousness; for permanent incapacity, the doctor need not wait and should act in the patient's best interests
        correct: true
        why: Correct — this is exactly the distinction Lord Goff drew, reflecting the different practical possibility of eventually obtaining consent.
      - text: For temporary incapacity, the doctor must always wait for consent no matter how urgent the situation; for permanent incapacity, no treatment may ever be given
        correct: false
        why: This reverses the actual distinction — Lord Goff allowed immediate necessary treatment for temporary incapacity, and ongoing best-interests treatment for permanent incapacity.
      - text: The distinction is irrelevant, because Lord Goff held that consent must always eventually be obtained, however long that takes
        correct: false
        why: Lord Goff specifically addressed situations where consent could not practically be obtained, and permitted treatment without waiting in the case of permanent incapacity.
      - text: Temporary incapacity permits any treatment at all, while permanent incapacity permits no treatment under any circumstances
        correct: false
        why: Both categories permit treatment, but the scope differs — for temporary incapacity, only what is necessary until recovery, and for permanent incapacity, action in the patient's overall best interests.
    variant-of: q134
  - key: q136
    type: mcq
    concept: necessity-defence
    difficulty: 4
    stem: A patient falls unconscious in a car accident and requires emergency surgery to survive. Doctors operate immediately without consent. A day later, still unconscious, doctors also perform an unrelated, non-urgent cosmetic procedure "while they were already in theatre". Applying Lord Goff's test in In re F, which part of this is most likely protected by necessity?
    options:
      - text: The emergency surgery — it was necessary because it was not practicable to communicate with the unconscious patient, and was plainly what a reasonable person would do to save her life
        correct: true
        why: "Correct — this satisfies both of Lord Goff's requirements: impracticability of communication, and action a reasonable person would take in the patient's best interests."
      - text: Both procedures equally, because once a patient is unconscious, doctors may perform any procedure they consider convenient at the time
        correct: false
        why: This overstates necessity — an unrelated, non-urgent cosmetic procedure is not what a reasonable person would take as necessary action in the patient's best interests in the circumstances.
      - text: Neither procedure, because Lord Goff's test requires the patient's prior written consent before any necessity defence can apply
        correct: false
        why: Lord Goff's test specifically addresses situations where consent cannot be obtained; it does not require prior written consent, which would defeat the whole point of the necessity principle.
      - text: Only the cosmetic procedure, because it was more clearly planned and therefore more clearly "reasonable" than the emergency surgery
        correct: false
        why: This is the reverse of the likely analysis — the emergency, life-saving surgery is the paradigm case of medical necessity, while the unrelated cosmetic procedure is not necessary and does not respond to any incapacity-related urgency.
    variant-of: q134
  - key: q137
    type: mcq
    concept: necessity-defence
    difficulty: 3
    stem: A trespasser argues that any genuine belief that their action was necessary should be enough to establish the defence of necessity, regardless of whether the action was actually reasonable or proportionate. Is this argument consistent with the lecture's two-condition test?
    options:
      - text: No — the lecture requires both that the action was necessary to prevent serious harm AND that it was reasonable and proportionate to the risk; a genuine but unreasonable or disproportionate belief is not enough on its own
        correct: true
        why: Correct — necessity requires both limbs to be satisfied, so genuine belief in necessity alone, without reasonableness and proportionality, is insufficient.
      - text: Yes — the lecture's test for necessity depends solely on the defendant's subjective, genuine belief, with no separate reasonableness requirement
        correct: false
        why: The lecture's test expressly includes a second, objective-style requirement — that the action be reasonable and proportionate to the risk — not just genuine belief.
      - text: Yes — but only because reasonableness is assessed exclusively from the defendant's own, entirely subjective point of view with no external check
        correct: false
        why: While the circumstances as perceived by the defendant matter, the requirement of reasonableness and proportionality provides an external check, not a purely subjective one.
      - text: No — but only because necessity requires proof that the plaintiff consented in advance, which a genuine belief cannot replace
        correct: false
        why: Necessity typically applies precisely because consent could not be obtained; it does not require the plaintiff's advance consent at all.
    variant-of: q127
  - key: q138
    type: mcq
    concept: necessity-defence
    difficulty: 2
    stem: Which of the following scenarios best fits the lecture's example of necessity to protect one's own property?
    options:
      - text: Climbing over a neighbour's fence, without permission, to rescue your cat that has become trapped there
        correct: true
        why: Correct — this is the exact example the lecture gives for the "protect one's property" category of necessity.
      - text: Throwing a passenger's luggage overboard from a sinking ship to keep it afloat
        correct: false
        why: This is the lecture's example of public necessity (saving lives), not the property-protection category.
      - text: A doctor operating on an unconscious accident victim to save her life
        correct: false
        why: This is the lecture's example of necessity to preserve life or health, not the property-protection category.
      - text: A police officer arresting a person under a valid warrant
        correct: false
        why: This is an example of the separate legal process defence, not necessity to protect property.
    variant-of: q128
  - key: q139
    type: mcq
    concept: necessity-defence
    difficulty: 3
    stem: A driver, to avoid hitting a child who has run onto the road, swerves and damages a parked car. The car's owner sues in trespass to goods. Applying the necessity principles from this topic, what is the driver's best argument?
    options:
      - text: The action was necessary to prevent serious harm to the child, and swerving was a reasonable and proportionate response to that risk, similar to the reasoning in Proudman v Allen
        correct: true
        why: "Correct — this mirrors Proudman v Allen's structure: an immediate danger, met with a reasonable and proportionate response that incidentally damaged a third party's property."
      - text: The action was necessary because the driver disliked the parked car's colour, which is unrelated to any risk of harm
        correct: false
        why: This has nothing to do with preventing serious harm to person or property, and so cannot satisfy the first limb of the necessity test.
      - text: The action cannot be defended at all, because necessity can never justify damaging a third party's property under any circumstances
        correct: false
        why: Proudman v Allen shows necessity can justify damage to a third party's property where the two-condition test is satisfied.
      - text: The action is automatically excused, because any driver who swerves to avoid a pedestrian is immune from all civil liability by statute
        correct: false
        why: No blanket statutory immunity of this kind is described in the materials; the driver's position depends on satisfying the two-condition necessity test on the facts.
    variant-of: q130
  - key: q140
    type: mcq
    concept: necessity-defence
    difficulty: 2
    stem: Which of the following situations does the lecture NOT list as one of the three broad situations in which necessity may arise?
    options:
      - text: Retaliating against a person who has previously provoked the defendant with insults
        correct: true
        why: Correct — this is provocation, a separate and generally unavailable tort defence, not one of the three necessity situations the lecture lists.
      - text: Public necessity, such as throwing luggage from a sinking ship to save lives
        correct: false
        why: This is expressly listed by the lecture as one of the three necessity situations.
      - text: Necessity to protect one's own property, such as trespassing to rescue a cat
        correct: false
        why: This is expressly listed by the lecture as one of the three necessity situations.
      - text: Action to preserve the life or health of a person unable to consent, such as treating an unconscious patient
        correct: false
        why: This is expressly listed by the lecture as one of the three necessity situations.
    variant-of: q128
  - key: q141
    type: mcq
    concept: necessity-defence
    difficulty: 4
    stem: How does necessity, as illustrated by Southwark London Borough Council v Williams and Proudman v Allen, differ from self-defence in the kind of situation each defence responds to?
    options:
      - text: Necessity can respond to danger from any source, including inanimate events with no wrongdoer (a runaway car, a sinking ship), whereas self-defence specifically responds to a reasonably apprehended, unlawful threat from a person
        correct: true
        why: Correct — Proudman v Allen involved no wrongdoer at all (a runaway car), which self-defence (framed around apprehended force from a person) could not sensibly address in the same way.
      - text: They are simply two labels for the same underlying legal test, applied to different fact patterns
        correct: false
        why: The two defences have different tests and typical triggering situations, as their different formulations and leading cases show.
      - text: Necessity requires proof the plaintiff acted unlawfully, exactly like s 52 CLA requires for self-defence
        correct: false
        why: Necessity's examples (a sinking ship, a runaway car) do not involve any unlawful conduct by a person at all, unlike the "unlawful conduct" requirement under s 52 CLA self-defence.
      - text: Self-defence can never be pleaded alongside necessity in the same case, as a matter of procedural law
        correct: false
        why: NSW v McMaster shows both defences pleaded together in the same case, so there is no such procedural bar.
    variant-of: q133
  - key: q142
    type: mcq
    concept: necessity-defence
    difficulty: 1
    stem: Which case is the leading authority for the proposition that necessity does not extend to homelessness or general housing need?
    options:
      - text: Southwark London Borough Council v Williams
        correct: true
        why: Correct — this is the case in which Lord Denning rejected necessity as a defence to trespass based on homelessness.
      - text: Proudman v Allen
        correct: false
        why: Proudman v Allen concerns necessity to protect property from an immediate danger, not homelessness or housing need.
      - text: "In re F (Mental Patient: Sterilisation)"
        correct: false
        why: In re F concerns medical necessity for a patient unable to consent, not homelessness or housing need.
      - text: NSW v McMaster
        correct: false
        why: NSW v McMaster concerns necessity (and self-defence) in a violent confrontation with police, not homelessness or housing need.
    variant-of: q129
  - key: q143
    type: mcq
    concept: necessity-defence
    difficulty: 3
    stem: "A student writes: \"Necessity is basically the same as self-defence, just applied to property instead of people.\" Using this topic's material, identify the clearest flaw in this statement."
    options:
      - text: Necessity is also used to justify medical treatment of a person unable to consent and public necessity to save lives, so it is not confined to property, and its test (necessity plus proportionality) differs from self-defence's apprehension-plus-proportionality test
        correct: true
        why: Correct — necessity covers medical treatment and public necessity (both involving persons, not just property) and has its own distinct two-condition test.
      - text: There is no flaw — the statement is entirely accurate as a description of both defences
        correct: false
        why: "The statement is inaccurate on two counts: necessity is not confined to property, and its legal test differs from self-defence's."
      - text: The flaw is that necessity applies only to trespass to land, while self-defence applies only to trespass to the person
        correct: false
        why: Necessity is illustrated across trespass to the person (NSW v McMaster), trespass to land, and trespass to goods (Proudman v Allen), so it is not confined to land alone.
      - text: The flaw is that self-defence, unlike necessity, has never been recognised at common law
        correct: false
        why: Self-defence is a well-established common law defence (Zecevic v DPP), so this is not an accurate criticism of the student's statement.
    variant-of: q141
  - key: q144
    type: mcq
    concept: necessity-defence
    difficulty: 2
    stem: "Complete the sentence: Lord Denning's warning in Southwark London Borough Council v Williams was that admitting homelessness as a defence to trespass would mean that ____."
    options:
      - text: "\"no one's house would be safe\""
        correct: true
        why: "Correct — this is Lord Denning's own quoted warning, as given in the lecture."
      - text: "\"the police would have no power to ever remove a trespasser\""
        correct: false
        why: "This is not the specific warning quoted in the lecture; Lord Denning's remark was about the safety of houses generally under an expanded necessity doctrine."
      - text: "\"local councils would go bankrupt within a decade\""
        correct: false
        why: "This financial warning is not part of the quoted reasoning the lecture attributes to Lord Denning."
      - text: "\"Parliament would need to abolish the tort of trespass entirely\""
        correct: false
        why: "This is not the quoted warning; Lord Denning's point was about the practical safety of houses, not a call for Parliament to abolish trespass."
    variant-of: q129
  - key: q145
    type: truefalse
    set: quickfire
    concept: necessity-defence
    difficulty: 2
    statement: In Proudman v Allen, the defence of necessity was available only because the defendant owned the runaway car he acted to protect.
    answer: false
    why: The defendant was a stranger with no ownership interest; Proudman v Allen holds that even a volunteer or stranger can rely on necessity to protect another's property.
  - key: q146
    type: truefalse
    set: quickfire
    concept: necessity-defence
    difficulty: 2
    statement: Lord Goff's test in In re F allows a doctor to treat a permanently incapacitated patient in their best interests without waiting to obtain consent.
    answer: true
    why: Correct — for permanent incapacity, Lord Goff held there is no point waiting to obtain consent, so the doctor must act in the patient's best interests.
  - key: q147
    type: match
    concept: necessity-defence
    difficulty: 2
    prompt: Match each necessity case to the specific outcome or principle it establishes.
    pairs:
      - { left: "Southwark London Borough Council v Williams", right: "Necessity is confined to great and imminent danger to life, and does not extend to homelessness" }
      - { left: "Proudman v Allen", right: "A stranger or volunteer can rely on necessity to protect another's property from an immediate danger" }
      - { left: "In re F (Mental Patient: Sterilisation)", right: "Medical necessity requires impracticability of communication and action in the patient's best interests" }
      - { left: "NSW v McMaster", right: "Necessity was pleaded alongside self-defence where police faced an imminent danger" }

