cards:
  - type: basic
    concept: consent-defence-nature-and-onus
    front: To which torts is consent available as a defence?
    back: Battery, assault, false imprisonment, trespass to land and interference with chattels.
    source: Topic 4 Lecture 1, slide 4
  - type: basic
    concept: consent-defence-nature-and-onus
    front: What did McHugh J reason in obiter in Marion's Case about consent?
    back: That consent is a defence, so the onus is on the defendant to prove that there was consent.
    source: Topic 4 Lecture 1, slide 6
  - type: cloze
    concept: consent-defence-nature-and-onus
    text: "In {{c1::White v Johnston}}, Leeming JA considered in obiter that consent is an essential {{c2::element}} of assault and battery, not a defence."
    source: Topic 4 Lecture 1, slide 6
  - type: apply
    concept: consent-defence-nature-and-onus
    scenario: A battery claim turns on inconclusive evidence about consent; the court adopts Leeming JA's obiter view.
    answer: Consent is treated as an element, so the plaintiff bears the onus of disproving it; on inconclusive evidence, the plaintiff loses.
    source: Topic 4 Lecture 1, slide 6
  - type: basic
    concept: consent-validity-and-scope
    front: What three things must be true for consent to be valid?
    back: It must be voluntary/free, come from a competent person, and relate to the act complained of.
    source: Topic 4 Lecture 1, slide 8
  - type: basic
    concept: consent-validity-and-scope
    front: Does a false promise of marriage used to induce sexual relations nullify consent?
    back: No — not where the plaintiff understood the nature and character of the interference.
    source: Topic 4 Lecture 1, slide 10
  - type: cloze
    concept: consent-validity-and-scope
    text: "In {{c1::McNamara v Duncan}}, the court held forcible contact within the rules of a game is consented to, but {{c2::deliberately inflicted}} injury is not."
    source: Topic 4 Lecture 1, slide 20
  - type: apply
    concept: consent-validity-and-scope
    scenario: A dentist performs 53 unnecessary consultations on a patient who agreed only to treatment for minor chipping of his teeth.
    answer: "This is Dean v Phung: the consent given did not extend to treatment on this scale, so it was not validly given."
    source: Topic 4 Lecture 1, slide 11
  - type: basic
    concept: consent-capacity-and-minors
    front: Are adults presumed to have capacity to consent?
    back: Yes, but this is rebuttable — for example, where the adult is drunk, asleep or unconscious.
    source: Topic 4 Lecture 1, slide 12
  - type: basic
    concept: consent-capacity-and-minors
    front: What did the court hold in Brightwater Care Group v Rossiter?
    back: Continuing treatment against a medically competent patient's wishes would be a trespass, given his right to autonomy and self-determination.
    source: Topic 4 Lecture 1, slide 13
  - type: cloze
    concept: consent-capacity-and-minors
    text: "The Gillick test asks whether a minor has achieved {{c1::sufficient understanding and intelligence}} to enable her to understand fully what is proposed."
    source: Topic 4 Lecture 1, slide 15
  - type: basic
    concept: consent-capacity-and-minors
    front: What did Marion's Case hold about parental consent to non-therapeutic treatment?
    back: Parents cannot consent on a child's behalf to non-therapeutic treatment (e.g. sterilisation) that is not in the child's interests.
    source: Topic 4 Lecture 1, slide 16
  - type: apply
    concept: consent-capacity-and-minors
    scenario: A competent 17-year-old refuses a blood transfusion needed for chemotherapy; his parents support the refusal.
    answer: "As in X v Sydney Children's Hospital Network, the parens patriae jurisdiction extends to any person under 18 and can override even a competent minor's refusal."
    source: Topic 4 Lecture 1, slide 18
  - type: basic
    concept: self-defence-common-law-and-cla
    front: What two things must a defendant prove for self-defence at common law, per Zecevic v DPP?
    back: A reasonable apprehension of physical force to the defendant or others, and that the force used was proportionate to the threat.
    source: Topic 4 Lecture 1, slide 21
  - type: basic
    concept: self-defence-common-law-and-cla
    front: Why did self-defence fail in Fontin v Katapodis?
    back: Throwing glass at Katapodis's face was "out of all reasonable proportion to the emergency confronting Fontin".
    source: Topic 4 Lecture 1, slide 22
  - type: cloze
    concept: self-defence-common-law-and-cla
    text: "Section 52 CLA requires the conduct responded to be {{c1::unlawful}} — a requirement the common law test does not have."
    source: Topic 4 Lecture 1, slide 27
  - type: basic
    concept: self-defence-common-law-and-cla
    front: How do the common law and CLA self-defence regimes relate to each other?
    back: They operate in parallel, each with a different test (ss 3A(1), 3B(1)(a)(iii) CLA).
    source: Topic 4 Lecture 1, slide 24
  - type: apply
    concept: self-defence-common-law-and-cla
    scenario: A police officer shoots a man running towards him holding a metal curtain rod during a chaotic home invasion.
    answer: "As in NSW v McMaster, both the subjective and objective limbs of the self-defence test can be satisfied on facts like these."
    source: Topic 4 Lecture 1, slide 29
  - type: basic
    concept: legal-process-defence
    front: What two things does s 99(1) LEPRA require for a lawful arrest without warrant?
    back: Reasonable suspicion the person is committing or has committed an offence, and satisfaction that arrest is reasonably necessary for a listed reason.
    source: Topic 4 Lecture 1, slide 31
  - type: basic
    concept: legal-process-defence
    front: How much force may be used in effecting an arrest under ss 230–231 LEPRA?
    back: Such force as is reasonably necessary.
    source: Topic 4 Lecture 1, slide 31
  - type: cloze
    concept: legal-process-defence
    text: "In {{c1::Roy v O'Neill}}, the High Court held 3:2 that entry for a DVO compliance check fell within the implied licence from {{c2::Halliday v Nevill}}."
    source: Topic 4 Lecture 1, slide 32
  - type: apply
    concept: legal-process-defence
    scenario: While lawfully at a front door, a police officer notices the occupier is intoxicated and requires a breath test.
    answer: "As in Roy v O'Neill, observing intoxication can enliven an independent statutory power to remain on the land for the breath test."
    source: Topic 4 Lecture 1, slide 32
  - type: basic
    concept: provocation-and-contributory-negligence
    front: Is provocation generally available as a tort defence in Australia?
    back: No, except in Queensland and Western Australia; elsewhere it cannot reduce compensatory damages, though it may affect exemplary damages.
    source: Topic 4 Lecture 2, slide 3
  - type: basic
    concept: provocation-and-contributory-negligence
    front: What did the Victorian Supreme Court hold in Horkin v North Melbourne Football Club?
    back: It is unfair and unjust to reduce liability for an intentional tort through contributory negligence — the wrongs differ "not merely in degree but in kind".
    source: Topic 4 Lecture 2, slide 5
  - type: cloze
    concept: provocation-and-contributory-negligence
    text: "The trial judge in Horkin reduced damages by {{c1::30%}} for contributory negligence, before this was overturned on appeal."
    source: Topic 4 Lecture 2, slide 5
  - type: apply
    concept: provocation-and-contributory-negligence
    scenario: A car is left unlocked with the keys in the ignition and is then stolen; the owner sues in conversion.
    answer: Whether contributory negligence should reduce the thief's liability here is an open policy question, not settled by the lecture materials.
    source: Topic 4 Lecture 2, slide 6
  - type: basic
    concept: necessity-defence
    front: What two conditions must necessity satisfy?
    back: The action was necessary to prevent serious harm to person or property, and it was reasonable and proportionate to the risk.
    source: Topic 4 Lecture 2, slide 8
  - type: basic
    concept: necessity-defence
    front: Why did Lord Denning reject necessity in Southwark London Borough Council v Williams?
    back: Admitting homelessness as a defence to trespass would mean "no one's house would be safe"; the doctrine must be carefully circumscribed.
    source: Topic 4 Lecture 2, slide 9
  - type: cloze
    concept: necessity-defence
    text: "In {{c1::Proudman v Allen}}, even a {{c2::volunteer or stranger}} acting to protect another's property can rely on necessity."
    source: Topic 4 Lecture 2, slide 10
  - type: basic
    concept: necessity-defence
    front: What two requirements did Lord Goff lay down in In re F for medical necessity?
    back: It must not be practicable to communicate with the person, and the action taken must be what a reasonable person would take in their best interests.
    source: Topic 4 Lecture 2, slide 14
  - type: apply
    concept: necessity-defence
    scenario: A temporarily unconscious patient needs urgent care, versus a permanently incapacitated patient needing ongoing care.
    answer: For temporary incapacity, do no more than necessary until consciousness returns; for permanent incapacity, act in the patient's best interests without waiting for consent.
    source: Topic 4 Lecture 2, slide 15
  - type: basic
    concept: necessity-defence
    front: What three broad situations does the lecture give for necessity?
    back: Public necessity (saving lives), protecting one's own property, and preserving the life or health of someone unable to consent.
    source: Topic 4 Lecture 2, slide 7

audio:
  title: Week 4 recap — defences to intentional torts
  minutes: 3
  script: |-
    This week is about defences to intentional torts — consent, self-defence, legal process, provocation, contributory negligence and necessity — and a thread running through all of them: is a defence really outside a tort's elements, or part of what the plaintiff must prove?
    
    Consent is available for battery, assault, false imprisonment, trespass to land and interference with chattels, resting on respect for autonomy. Australian law hasn't settled whether it's a defence or an element — McHugh J in Marion's Case thought it a defence the defendant proves, while Leeming JA in White v Johnston thought it an element the plaintiff disproves — and that changes who loses on unclear evidence. To be valid, consent must be voluntary, come from a competent person, and match the act actually agreed to. A false promise of marriage doesn't nullify consent if you understood the nature of the act, but exceeding what was agreed to does — McNamara v Duncan's deliberate football blow, and Dean v Phung's fifty-three unnecessary dental consultations, both went beyond the consent given. Capacity matters too: adults are presumed competent, but Rossiter shows even a paralysed, dying patient's competent refusal must be respected, while Gillick and Marion's Case let a sufficiently mature minor consent — though X v Sydney Children's Hospital Network shows the court's parens patriae power can still override even a competent minor's wishes.
    
    Self-defence needs a reasonable apprehension of force plus a proportionate response — Zecevic v DPP's two limbs — and Fontin v Katapodis shows how strictly proportionality is policed. The Civil Liability Act's section 52 runs alongside the common law with its own test, adding a requirement that the conduct responded to was unlawful; NSW v McMaster shows both tests can be satisfied by police using force in a chaotic, dangerous moment.
    
    Legal process covers lawful arrest — LEPRA's section 99 needs both reasonable suspicion and necessity for a listed reason, with force limited to what's reasonably necessary — and entering or remaining on land, building on Halliday v Nevill's implied licence and extended in Roy v O'Neill, where observing intoxication gave independent authority to stay for a breath test.
    
    Provocation and contributory negligence are both largely rejected as tort defences: Fontin v Katapodis says provocation can't cut compensatory damages, only exemplary ones, and Horkin v North Melbourne Football Club says intentional wrongdoing and mere carelessness differ in kind, not just degree, so a plaintiff's carelessness shouldn't excuse a defendant's deliberate wrong.
    
    Finally, necessity — narrow, as Southwark v Williams shows for homelessness, but real for protecting property, even a stranger's, as in Proudman v Allen, and for medical treatment under In re F's best-interests test, which treats temporary and permanent incapacity differently.
