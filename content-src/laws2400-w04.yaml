  - key: q105
    type: short
    concept: legal-process-defence
    difficulty: 3
    prompt: |-
      A police officer walks up the unlocked driveway of a house to ask the occupier about a reported break-in
      nearby. While there, the officer notices the strong smell of alcohol and slurred speech, and requires the
      occupier to undertake a roadside breath test on the driveway (assume an equivalent Northern Territory
      style statutory breath-test power applies). The occupier later sues the officer in trespass. Advise on
      the officer's position, drawing on Halliday v Nevill and Roy v O'Neill.
    model: |-
      The officer's initial entry up the unlocked, unobstructed driveway is likely lawful under the implied
      licence recognised in Halliday v Nevill, which permits any member of the public, including police, to
      use such a driveway for the purpose of lawful communication with an occupier — here, asking about a
      reported break-in is squarely within that purpose. The harder question is whether requiring the breath
      test, and remaining on the driveway to administer it, is also protected. As in Roy v O'Neill, simply
      having an additional purpose in mind (here, investigating intoxication) does not by itself take the
      officer outside the implied licence, provided the initial entry remains genuinely referable to a licensed
      purpose. More directly, however, the officer's observations of the strong smell of alcohol and slurred
      speech are analogous to the observations of intoxication in Roy v O'Neill, which enlivened an independent
      statutory power to remain on the land to conduct a breath test. If an equivalent statutory breath-test
      power applies here, the officer would have independent authority to remain on the driveway for that
      purpose, separate from (and not dependent on) the implied licence used to justify the initial approach.
      On this basis, the officer's presence at each stage — approaching to ask about the break-in, then
      remaining to administer the breath test once intoxication was observed — is likely to be found lawful,
      and the trespass claim should fail, mirroring the outcome in Roy v O'Neill.
    rubric:
      - id: r1
        criterion: Identifies and applies the Halliday v Nevill implied licence to the initial entry
        marks: 2
        top-band: Correctly explains why asking about a break-in falls within lawful communication.
        margin-note: Correctly frames the initial entry issue.
        authorities: []
      - id: r2
        criterion: Notes that an additional purpose does not automatically defeat the implied licence, drawing on Roy v O'Neill
        marks: 2
        top-band: Explains the "mixed purpose" point from Roy v O'Neill and applies it to the facts.
        margin-note: Good use of Roy v O'Neill's reasoning.
        authorities: []
      - id: r3
        criterion: Identifies that remaining to conduct the breath test needs its own, separate justification, drawing the analogy to the statutory breath-test power in Roy v O'Neill
        marks: 2
        top-band: Explains the analogy clearly and identifies the need for an independent statutory basis to remain.
        margin-note: Correctly separates entry from remaining.
        authorities: []
      - id: r4
        criterion: Reaches a reasoned conclusion on the trespass claim, tied to the analysis above
        marks: 2
        top-band: Draws the analysis together into a clear, justified conclusion.
        margin-note: Clear, well-supported conclusion.
        authorities: []
