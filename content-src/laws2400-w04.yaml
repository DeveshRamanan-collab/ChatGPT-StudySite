week_file:
  topic: Defences to intentional torts
  summary: |-
    This week covers the main defences pleaded against intentional torts: consent, self-defence, legal process,
    provocation, contributory negligence and necessity. A recurring conceptual question runs through all of
    them — whether a "defence" is really external to the tort's elements, or whether it is in truth part of
    what the plaintiff must prove (as with the ongoing Australian disagreement over consent) — and this matters
    for who bears the onus at trial. For the exam, the payoff is a set of tests to run on any intentional-tort
    problem: was there valid, unexceeded consent; if force was used, was it proportionate under the common law
    or the Civil Liability Act; was the defendant exercising a lawful power of arrest or entry; and, failing
    all of that, was the conduct nonetheless necessary and reasonable in the circumstances.
  notes: |
    ## 1. Overview

    This week we focus on various defences that may be pleaded in cases related to intentional torts. One
    conceptual question is about the meaning of defences: are these part of the elements of a tort, or
    external to those elements? What do you think? And why does it matter? As the consent material below
    shows, the answer changes who bears the onus of proof at trial.

    ## 2. Consent

    If a person freely gives consent to a tortious conduct, no action is generally available. This defence is
    underpinned by deference to the autonomy of individuals. Consent is available as a defence to battery,
    assault, false imprisonment, trespass to land and interference with chattels.

    ### Defence or element? The onus debate

    Courts in England and New Zealand have taken the view that consent is an element of trespassory conduct —
    so the onus is on the plaintiff to prove lack of consent. However, courts in Canada and Australia have
    taken a different view.

    :::case
    McHugh J in *Marion's Case* (1992) 175 CLR 218 reasoned in obiter that consent is a defence and therefore
    the onus is on the defendant to prove that there was consent. Leeming JA in *White v Johnston* [2015]
    NSWCA 18 (unnecessary treatment by a dentist) considered in obiter that the better view is that consent is
    an essential element of assault and battery.
    :::

    This means there is some uncertainty in Australia regarding whether consent is a defence or part of the
    elements. Does it matter much if consent were to be regarded as part of the elements? It changes who loses
    when the evidence on consent is unclear.

    ### Validity of consent

    Consent may be express or implied. In order to be valid, consent must: be voluntary/free; come from a
    competent person; and be in relation to the act complained of. It is critical that consent is given
    freely: the individual should have sufficient knowledge as to what she is consenting to, and there is no
    force, fraud, threat or intimidation.

    However, not every misrepresentation will nullify consent. If the plaintiff understands the "nature and
    character" of the interference, consent will be valid even if there were false inducements — e.g., a false
    promise of marriage to induce sexual relations.

    :::case
    *Dean v Phung* [2012] NSWCA 223 — Dr Phung treated Dean for minor chipping of his front teeth but conducted
    more than 53 consultations to perform unnecessary procedures, costing Dean $73,640. The court found that
    the consent was not validly given.
    :::

    Consent must also not be exceeded: because consent is often specific to a specific act, it will not be a
    good defence if the defendant's conduct exceeds the consent given.

    :::case
    *McNamara v Duncan* (1971) 26 ALR 584 — the defendant deliberately struck the plaintiff on the head,
    fracturing his skull, during a game of Australian Rules Football. The court rejected the argument that the
    plaintiff must have consented to receive such a blow and thus accepted the risk of such injury: while
    forcible bodily contact is part of Australian Rules Football, it will not cover deliberately inflicted
    injuries.
    :::

    ### Capacity and minors

    The consent should also come from a competent person — there should be legal capacity to give consent,
    meaning sufficient understanding to comprehend the act as well as its consequences. Adults are presumed to
    have this capacity. But what if an adult was drunk, asleep or unconscious?

    :::case
    *Brightwater Care Group v Rossiter* (2009) 40 WAR 84 — a completely paralysed person, unable to consume by
    mouth any nutrition or fluids, directed the care home staff to discontinue nutrition and fluids. Noting the
    important right to autonomy or self-determination, the court ruled that a medical practitioner or service
    provider will commit a trespass against the patient if this was done against the wishes of a medically
    competent patient.
    :::

    The issue of consent may raise complex questions: what if an adult woman declines treatment which will
    save the life of her unborn child? What about persons with intellectual disability? What about a minor
    with a sufficient understanding?

    :::case
    The House of Lords in *Gillick v West Norfolk and Wisbech Area Health Authority* [1986] 1 AC 112 held that
    a 15-year-old girl could give valid consent to receiving medical advice about a prescription for the
    contraceptive pill without her parents' consent. It reasoned that a minor could give informed consent when
    she achieves a sufficient understanding and intelligence to enable her to "understand fully what is
    proposed".
    :::

    The High Court of Australia approved the *Gillick* principle in *Marion's Case* (1992) 175 CLR 218 (an
    application authorising sterilisation of an intellectually disabled teenager, Marion, brought by her
    parents). The High Court observed that the fact that a child is disabled does not of itself mean that she
    cannot give informed consent. After considering the nature of sterilisation, it ruled that parents cannot
    provide consent to authorise non-therapeutic treatment of a child that is not in the child's interests.

    The parents' consent has been held to be insufficient where the medical procedure is not for the treatment
    of the child's illness — e.g., sterilisation of mentally disabled minors, gender reassignment surgery.
    Moreover, for certain treatments, consent of courts may be required by statutes — e.g., the *Children and
    Young Persons (Care and Protection) Act 1998* (NSW).

    :::case
    *X v Sydney Children's Hospital Network* (2013) 85 NSWLR 294 — a 17-year-old Jehovah's Witness, competent,
    refused a blood transfusion; his parents supported the refusal. Held: the parens patriae jurisdiction
    extends to any person under 18, even a competent "mature minor". Section 174 of the Care and Protection Act
    does not exclude it absent clear words. (See also *H v AC* [2024] NSWSC 40.)
    :::

    ## 3. Self-defence

    If the defendant acted in self-defence, it is a defence to a claim for trespass to the person. To avail
    this defence, the defendant must prove two conditions at common law:

    :::rule
    *Zecevic v DPP* (1987) 162 CLR 645 — (1) there was a reasonable apprehension of physical force to the
    defendant or others; and (2) the force used by the defendant was proportionate to the threat.
    :::

    :::case
    *Fontin v Katapodis* (1962) 108 CLR 177 — Fontin incorrectly accused Katapodis of not paying for goods,
    which resulted in heated arguments; Katapodis picked up a wooden T-square and broke it on Fontin's
    shoulder; Fontin threw an off-cut of glass at Katapodis's face, injuring his hand. The High Court held that
    while Fontin had the right to defend himself, throwing a piece of glass at Katapodis's face "was out of all
    reasonable proportion to the emergency confronting Fontin".
    :::

    The defence is available for the protection of third parties such as family members or even strangers. It
    may also be invoked to protect property (both land and chattels) against unlawful interference by
    trespassers. The defence to protect land is generally only available to the person who has possession —
    moreover, a request to leave the land should first be made and the opportunity given to comply with the
    request.

    ### Effect of the Civil Liability Act 2002 (NSW)

    The common law of self-defence has been codified and modified by statutory provisions drawn from the
    criminal law. Sections 52–54 of the Civil Liability Act 2002 (NSW) (CLA) are a case in point. Self-defence
    operates under both regimes in parallel (see ss 3A(1), 3B(1)(a)(iii) CLA) with different tests.

    :::statute
    Section 52 CLA provides that self-defence will absolve the defendant from civil liability if used in
    response to "unlawful conduct" and a two-limb test is satisfied — the person believed the conduct was
    necessary for a listed purpose, and the conduct was a reasonable response in the circumstances as they
    perceived them. The legislation does not define "unlawful conduct", though this has been held to include
    both criminal and tortious conduct. The common law test does not have the unlawful conduct requirement.
    :::

    :::case
    *NSW v McMaster* [2015] NSWCA 228 — Justin's partner, sister and mother suffered a violent home invasion
    including physical and sexual assault; police arrived after a call from Justin's partner. Justin — holding
    a metal curtain rod — ran out yelling "Where's my sister"; as he ran towards Constable K he was shot by
    Constable F. The trial court held there was battery and that the constable was not entitled to
    self-defence. The Court of Appeal ruled that in the circumstances both the subjective and objective
    requirements of the self-defence test were satisfied. The Court of Appeal also found that Justin's own
    conduct was unlawful, because even though not intentional, it was itself a negligent trespass to the
    person.
    :::

    ## 4. Legal process

    Lawful arrest is a defence to trespass to the person. Under the *Law Enforcement (Powers and
    Responsibilities) Act 2002* (NSW) (LEPRA), s 99(1) provides that arrest without warrant requires BOTH (a)
    suspicion on reasonable grounds that the person is committing or has committed an offence AND (b)
    satisfaction that arrest is reasonably necessary for a listed reason. Suspicion is more than a possibility,
    less than a belief. Sections 230 and 231 confine the force used to such force as is reasonably necessary.
    (See *Owlstara v State of NSW* [2020] NSWCA 217.)

    The defence also covers entering and remaining on land. Recall *Roy v O'Neill* (2020) 273 CLR 91 (from
    Topic 3): police entered the unit's curtilage for a proactive domestic violence order compliance check. The
    High Court held, 3:2, that this was within the implied licence (*Halliday v Nevill*). Their observations of
    Roy's state of intoxication then enlivened the power to remain on the land for a breath test (*Police
    Administration Act 1978* (NT) s 126(2A)), so the officer had independent authority to remain.

    ## 5. Provocation

    Provocation is a defence to a criminal charge, but it is generally not available as a defence to a tort
    action.

    :::rule
    See *Fontin v Katapodis* (Katapodis injured Fontin's shoulder in an argument, and Fontin argued he was
    provoked): provocation cannot reduce an award of compensatory damages. It may, though, assist to reduce or
    prevent an award of exemplary damages. Queensland and Western Australia are an exception — provocation may
    be pleaded as a defence there.
    :::

    ## 6. Contributory negligence

    Contributory negligence has been rejected several times as a defence to intentional torts. Consider the
    policy reasons behind this: typically this is a situation where the plaintiff has been careless in some
    way — but should that allow the defendant, who has intentionally interfered with another, to escape
    consequences?

    :::case
    *Horkin v North Melbourne Football Club* [1993] VR 153 — Horkin was asked to leave the club as he had had
    too much to drink; when he did not leave, club employees threw him out with more force than necessary,
    injuring him. The trial judge reduced the defendant's liability by 30% due to contributory negligence
    (intoxication, failure to leave). The Victorian Supreme Court held that it will be unfair and unjust to
    reduce liability for intentional torts: intentional battery vs the plaintiff's carelessness — "the
    difference is not merely in degree but in kind, and the social condemnation attached to the fault differs
    markedly".
    :::

    Should contributory negligence apply as a defence to conversion — for example, if a car left unlocked with
    keys in the ignition is stolen? You could argue that if a plaintiff has been careless with their vehicle,
    they created an opportunity for theft, and allowing the defence would encourage more personal
    responsibility. Alternatively, a plaintiff's carelessness doesn't justify theft.

    ## 7. Necessity

    The defence of necessity may arise in varied situations: public necessity (e.g., if a ship is sinking, you
    may throw luggage out of the ship to save lives); necessity to protect one's property (e.g., trespassing on
    a neighbour's land to rescue your cat); and action to preserve the life or health of a person who is unable
    to consent (e.g., a doctor treats an unconscious patient without consent to save their life).

    :::rule
    The defence of necessity may be available if (1) the action was necessary to prevent serious harm to
    person or property, and (2) the action was reasonable in the circumstances and proportionate to the risk
    posed.
    :::

    The reasonableness of the defendant's act is assessed on the facts of each case.

    :::case
    *Southwark London Borough Council v Williams* [1971] Ch 734 — the defendants, who were squatters, pleaded
    necessity when the Council sought a court order for immediate possession. Lord Denning rejected the
    defence: if homelessness is admitted as a defence to trespass, no one's house would be safe! "The doctrine
    [must] be carefully circumscribed."
    :::

    The defence of necessity is available to a defendant who acts to protect property and, by doing so,
    inflicts damage to the plaintiff's property.

    :::case
    *Proudman v Allen* [1954] SASR 336 — the defendant saw a rogue car running driverless down a slope towards
    another car and turned the rogue car's steering wheel to avoid a collision; this caused the rogue car to
    roll into the sea. The car's owner sued. The defendant successfully used the defence of necessity. Even
    volunteers or strangers who act to protect the property of others can use this defence.
    :::

    Necessity may be pleaded as a defence in trespass to the person, as it was (alongside self-defence) in
    *NSW v McMaster* above, where there was a situation of imminent danger and the steps taken were reasonably
    necessary to ward off the danger.

    The defence of necessity may also arise in the medical context: can a doctor plead necessity where the
    treatment is for the benefit of a patient who is unable to give consent (e.g., an unconscious patient, or a
    patient who is a child or under another incapacity)?

    :::case
    *In re F (Mental Patient: Sterilisation)* [1990] 2 AC 1 — F, a 36-year-old woman with a serious mental
    disability, developed a sexual relationship with a fellow patient; the doctors felt F would not be able to
    cope with pregnancy and childbirth and there were no other viable alternatives, so F's mother sought a
    court declaration that sterilisation would be lawful. Lord Goff granted the declaration.
    :::

    Lord Goff laid down two requirements to apply the necessity principle: (1) there must be a necessity to act
    when it is not practicable to communicate with the assisted person; and (2) the action taken must be such
    as a reasonable person would, in all the circumstances, take, acting in the best interests of the assisted
    person. The necessity principle applies both in cases of emergency (e.g., treatment of an unconscious
    person) and in cases with a permanent state of affairs (e.g., treatment of a mentally disabled patient).
    However, Lord Goff drew a distinction between these: if a patient is temporarily incapacitated, the doctor
    should do no more than is necessary before the patient recovers consciousness; if the patient is
    permanently incapacitated, there is no point in waiting to obtain the patient's consent — the doctor must
    act in the best interests of the patient.

    :::examtip
    Legislation often governs specific medical situations (e.g., treatment of children, or of intellectually
    disabled adults) and should be checked before falling back on the common law necessity principle.
    :::

concepts:
  - slug: consent-defence-nature-and-onus
    title: "Consent: nature of the defence and the onus debate"
    visual: explainer
    visual-brief: A fork — is consent a defence (defendant proves it) or an element (plaintiff disproves it)? — with McHugh J and Leeming JA on opposite branches.
    related: [consent-validity-and-scope, consent-capacity-and-minors]
    depends-on: [laws2400-w01-intentional-torts-classification]
    contrasts-with: [laws2400-w01-trespass-fault-and-onus]
    cases: [secretary-department-of-health-and-community-services-v-jwb, white-v-johnston]
    authorities: []
    verify: false
    body: |
      Consent is a defence available where a person freely agrees to conduct that would otherwise be tortious.
      It covers battery, assault, false imprisonment, trespass to land and interference with chattels, and is
      underpinned by deference to individual autonomy — if a person has genuinely agreed to the interference,
      the law generally will not intervene.

      Courts disagree about what consent actually is. Courts in England and New Zealand treat consent as an
      element of trespassory conduct, so the plaintiff bears the onus of proving its absence. Courts in Canada
      and Australia have taken a different view. In *Secretary, Department of Health and Community Services v
      JWB (Marion's Case)*, McHugh J reasoned in obiter that consent is a defence, so the onus falls on the
      defendant to prove consent was given. Leeming JA in *White v Johnston* took the opposite obiter view,
      considering consent an essential element of assault and battery. The position in Australia remains
      unsettled.

      The classification matters practically: as a defence, the defendant must plead and prove consent; as an
      element, the plaintiff must plead and disprove it — changing who loses when the evidence on consent is
      unclear.

      Exam use: flag that consent's classification (defence vs element) is unsettled in Australia, cite both
      obiter positions, and note that whichever party bears the onus is the party who loses if the evidence on
      consent is inconclusive.
  - slug: consent-validity-and-scope
    title: "Consent: validity and its limits"
    visual: diagram
    visual-brief: Three gates a valid consent must pass through — voluntary/free, competent person, related to the specific act — with a fourth check for whether conduct stayed inside the scope actually agreed to.
    related: [consent-defence-nature-and-onus, consent-capacity-and-minors]
    depends-on: [consent-defence-nature-and-onus]
    contrasts-with: [consent-capacity-and-minors]
    cases: [mcnamara-v-duncan, dean-v-phung]
    authorities: []
    verify: false
    body: |
      Consent may be express or implied, but to be valid it must be voluntary/free, given by a competent
      person, and relate to the specific act complained of.

      Voluntariness requires that the person had sufficient knowledge of what she was consenting to, and that
      there was no force, fraud, threat or intimidation. Not every misrepresentation destroys consent: if the
      plaintiff understands the "nature and character" of the interference, consent remains valid even where a
      false inducement was used — for example, a false promise of marriage used to induce sexual relations.

      Consent is also specific to the act it covers, and conduct exceeding what was consented to is not
      protected. In *McNamara v Duncan*, the defendant deliberately struck the plaintiff on the head during an
      Australian Rules match, fracturing his skull; the court rejected the argument that playing the game meant
      consenting to that blow, since forcible contact within the rules is one thing, deliberately inflicted
      injury another. In *Dean v Phung*, a dentist performed over 53 consultations of unnecessary treatment
      costing $73,640; the court found the patient's consent was not validly given, because it did not extend
      to treatment of that scale.

      Exam use: check voluntariness first (force, fraud or threat vitiate; incidental misrepresentation about a
      collateral matter does not), then ask whether the defendant's conduct stayed within the scope of what was
      actually agreed to.
  - slug: consent-capacity-and-minors
    title: "Consent: capacity, minors and medical treatment"
    visual: timeline
    visual-brief: A capacity ladder — presumed-competent adult, adult whose capacity is in doubt (Rossiter), Gillick-competent minor (Marion's Case), then the parens patriae override (X v SCHN) sitting above all of them.
    related: [consent-validity-and-scope, consent-defence-nature-and-onus]
    depends-on: [consent-defence-nature-and-onus]
    contrasts-with: [consent-validity-and-scope]
    cases: [brightwater-care-group-v-rossiter, gillick-v-west-norfolk-and-wisbech-area-health-authority, secretary-department-of-health-and-community-services-v-jwb, x-v-sydney-childrens-hospital-network]
    authorities: [children-and-young-persons-care-and-protection-act-1998-nsw-s174]
    verify: false
    body: |
      Consent must come from a competent person — someone with sufficient understanding to comprehend the act
      and its consequences. Adults are presumed competent, but this is rebuttable: an adult who is drunk,
      asleep or unconscious may lack capacity. In *Brightwater Care Group v Rossiter*, a paralysed but mentally
      competent patient directed staff to stop his nutrition and fluids; continuing against his wishes was held
      to be a trespass, on the basis of his right to autonomy and self-determination.

      Minors can also have capacity. *Gillick v West Norfolk and Wisbech Area Health Authority* held that a
      minor can consent once she has "sufficient understanding and intelligence to enable her to understand
      fully what is proposed". The High Court approved the *Gillick* test in *Secretary, Department of Health
      and Community Services v JWB (Marion's Case)*, but ruled that a child's disability does not itself defeat
      capacity, and that parents cannot consent on a child's behalf to non-therapeutic treatment not in the
      child's interests.

      Even a competent "mature minor" is not always the final word: in *X v Sydney Children's Hospital
      Network*, the parens patriae jurisdiction was held to extend to any person under 18 and overrode a
      competent 17-year-old's refusal of a blood transfusion, since s 174 of the Care and Protection Act did
      not exclude it absent clear words.

      Exam use: work through the presumption of capacity, then Gillick competence for minors, then check
      whether a statute or the parens patriae jurisdiction can override even a competent refusal.
  - slug: self-defence-common-law-and-cla
    title: "Self-defence: common law test and the Civil Liability Act"
    visual: simulation
    visual-brief: A dial with two needles — the common law test (apprehension + proportionality) and the CLA s 52 test (belief in necessity + reasonable response, gated by "unlawful conduct") — moving together but not identically.
    related: [legal-process-defence]
    depends-on: []
    contrasts-with: [necessity-defence, provocation-and-contributory-negligence]
    cases: [zecevic-v-dpp, fontin-v-katapodis, nsw-v-mcmaster]
    authorities: [civil-liability-act-2002-nsw-s52, civil-liability-act-2002-nsw-s53, civil-liability-act-2002-nsw-s54, civil-liability-act-2002-nsw-s3b]
    verify: false
    body: |
      Self-defence is a defence to trespass to the person, and can also protect third parties (family, or even
      strangers) or property (land or chattels) against unlawful interference. For land, the defence is
      generally only available to the person in possession, and a request to leave should normally be made
      first.

      At common law, *Zecevic v DPP* requires the defendant to prove a reasonable apprehension of physical
      force to the defendant or others, and that the force used was proportionate to the threat. Proportionality
      is assessed strictly: in *Fontin v Katapodis*, the defendant was struck with a wooden T-square, but the
      High Court held his response — throwing glass at the plaintiff's face — was "out of all reasonable
      proportion to the emergency" confronting him.

      The Civil Liability Act 2002 (NSW) has codified and modified this defence, drawing on the criminal law:
      s 52 protects a person who believed their conduct necessary for a listed purpose and whose response was
      reasonable in the circumstances as perceived — but only where the conduct responded to was itself
      unlawful, a requirement the common law test lacks. The two regimes run in parallel (ss 3A(1), 3B(1)(a)(iii)).
      In *NSW v McMaster*, the Court of Appeal held both limbs of the statutory test were satisfied for an
      officer who shot a man running towards him holding a metal rod.

      Exam use: run the common law two-limb test, then check whether s 52 CLA also applies and whether its
      extra "unlawful conduct" requirement is met.
  - slug: legal-process-defence
    title: "Legal process: arrest and entering or remaining on land"
    visual: palace
    visual-brief: Two parallel checklists — arrest (reasonable suspicion + reasonably necessary + reasonable force) and entry/remaining on land (implied licence + any independent statutory power to stay).
    related: [self-defence-common-law-and-cla]
    depends-on: [laws2400-w03-implied-licence]
    contrasts-with: [self-defence-common-law-and-cla]
    cases: [roy-v-oneill, halliday-v-nevill]
    authorities: [law-enforcement-powers-and-responsibilities-act-2002-nsw-s99, law-enforcement-powers-and-responsibilities-act-2002-nsw-ss230-231, police-administration-act-1978-nt-s126]
    verify: false
    body: |
      Legal process — acting under a lawful power — is a defence to trespass to the person and to land. Lawful
      arrest is the clearest example: under the Law Enforcement (Powers and Responsibilities) Act 2002 (NSW),
      arrest without warrant under s 99(1) requires both a reasonable suspicion that the person is committing
      or has committed an offence, and satisfaction that arrest is reasonably necessary for a reason the Act
      lists — suspicion being more than a mere possibility but less than a belief. Sections 230–231 confine the
      force used in effecting an arrest to what is reasonably necessary.

      The defence also covers entering and remaining on land under a lawful power. *Halliday v Nevill*
      establishes the implied licence for anyone, including police, to use an unobstructed path or driveway for
      lawful communication with an occupier. In *Roy v O'Neill*, the High Court held (3:2) that police checking
      compliance with a domestic violence order acted within that implied licence, and that observing the
      occupier's intoxication then independently enlivened a statutory power to remain on the land to conduct a
      breath test.

      Exam use: for an arrest, check both limbs of s 99(1) and whether the force used was reasonably necessary;
      for entry or remaining on land, start from the implied licence and ask whether a separate statutory power
      justifies staying beyond it.
  - slug: provocation-and-contributory-negligence
    title: Provocation and contributory negligence as (non-)defences
    visual: explainer
    visual-brief: Two doors marked "provocation" and "contributory negligence", both stamped CLOSED for intentional torts (except a Qld/WA side-door for provocation), with an open question mark over conversion of an unlocked car.
    related: [self-defence-common-law-and-cla]
    depends-on: []
    contrasts-with: [self-defence-common-law-and-cla, necessity-defence]
    cases: [fontin-v-katapodis, horkin-v-north-melbourne-football-club]
    authorities: []
    verify: false
    body: |
      Provocation is a defence to a criminal charge, but generally not to an intentional tort. In *Fontin v
      Katapodis*, the defendant argued he had been provoked into throwing glass at the plaintiff's face; the
      High Court held provocation cannot reduce an award of compensatory damages, though it may still help
      reduce or prevent an award of exemplary damages. Queensland and Western Australia are an exception,
      where provocation may be pleaded as a tort defence.

      Contributory negligence — carelessness by the plaintiff that contributed to their own injury — has also
      been repeatedly rejected as a defence to intentional torts. In *Horkin v North Melbourne Football Club*,
      an intoxicated plaintiff refused to leave a club, so employees ejected him with more force than
      necessary. The trial judge reduced damages by 30% for contributory negligence, but the Victorian Supreme
      Court restored full liability: an intentional battery and the plaintiff's carelessness differ "not
      merely in degree but in kind", and the social condemnation attached to intentional wrongdoing differs
      markedly from carelessness.

      Whether contributory negligence should apply to conversion — say, a car left unlocked with keys in the
      ignition and then stolen — remains a live policy question: the defence might encourage personal
      responsibility, but a plaintiff's carelessness arguably should not excuse theft.

      Exam use: for any intentional tort, state that provocation and contributory negligence are (subject to
      the Qld/WA exception for provocation) not available to reduce liability, using the "degree vs kind"
      language from Horkin to justify why.
  - slug: necessity-defence
    title: Necessity
    visual: palace
    visual-brief: Three necessity situations (public necessity, protecting property, preserving life/health) each gated by the same two-condition test, with Southwark's narrow reading sitting as a warning sign over all three.
    related: [self-defence-common-law-and-cla]
    depends-on: []
    contrasts-with: [self-defence-common-law-and-cla, provocation-and-contributory-negligence]
    cases: [southwark-london-borough-council-v-williams, proudman-v-allen, nsw-v-mcmaster, in-re-f-mental-patient-sterilisation]
    authorities: []
    verify: false
    body: |
      Necessity may excuse what would otherwise be a tort in three broad situations: public necessity
      (throwing luggage from a sinking ship to save lives), protecting one's own property (trespassing on a
      neighbour's land to rescue a pet), and preserving the life or health of someone unable to consent
      (treating an unconscious patient). It requires that the action was necessary to prevent serious harm to
      person or property, and that it was reasonable and proportionate to the risk.

      The doctrine is narrow. In *Southwark London Borough Council v Williams*, homeless squatters pleaded
      necessity against a possession order; Lord Denning rejected it, warning that admitting homelessness would
      mean "no one's house would be safe" and that the doctrine "must be carefully circumscribed". By contrast,
      in *Proudman v Allen*, a defendant who turned a driverless car's wheel to avoid a collision, sending it
      into the sea, successfully relied on necessity — available even to strangers protecting another's
      property. It has also succeeded in trespass to the person, pleaded alongside self-defence in *NSW v
      McMaster*.

      In the medical context, *In re F (Mental Patient: Sterilisation)* requires that it not be practicable to
      communicate with the person, and that the action taken be what a reasonable person would take in the
      assisted person's best interests — distinguishing temporary incapacity (do no more than necessary until
      consciousness returns) from permanent incapacity (act in the patient's best interests without waiting).

      Exam use: identify which necessity situation applies, then test necessity and proportionality against
      Southwark's narrow approach.

cases:
  - slug: secretary-department-of-health-and-community-services-v-jwb
    name: Secretary, Department of Health and Community Services v JWB (Marion's Case)
    citation: "(1992) 175 CLR 218"
    aglc: "Secretary, Department of Health and Community Services v JWB (1992) 175 CLR 218"
    facts: |-
      An application was brought by the parents of Marion, an intellectually disabled teenager, seeking court
      authorisation for her sterilisation.
    issue: Whether parents could consent to non-therapeutic medical treatment (sterilisation) of their intellectually disabled child, and how consent to medical treatment by or for minors should be classified.
    held: |-
      The High Court approved the Gillick test for a minor's capacity to consent, held that a child's
      disability does not of itself defeat capacity, and ruled that parents cannot consent to non-therapeutic
      treatment that is not in the child's interests. McHugh J reasoned in obiter that consent is a defence to
      trespass to the person, so the onus is on the defendant to prove it.
    ratio: A minor can give informed consent once she has sufficient understanding and intelligence to understand fully what is proposed; parental consent does not extend to authorising non-therapeutic treatment against the child's interests.
    significance: The leading Australian case adopting Gillick competence and marking the limits of parental consent, plus McHugh J's influential obiter on the onus question.
    why-here: Central authority for both the onus debate (McHugh J's obiter) and the capacity/minors line on consent.
    verify: true
  - slug: white-v-johnston
    name: White v Johnston
    citation: "[2015] NSWCA 18"
    aglc: "White v Johnston [2015] NSWCA 18"
    facts: The case concerned unnecessary dental treatment by a dentist; further facts are not detailed in the lecture materials.
    issue: Whether consent is a defence to trespass to the person, or an essential element of assault and battery that the plaintiff must negative.
    held: Leeming JA considered, in obiter, that the better view is that consent is an essential element of assault and battery, rather than a defence.
    ratio: Consent to touching may be an element of assault and battery, which the plaintiff bears the onus of disproving, rather than a defence the defendant must prove.
    significance: The clearest counterpoint to McHugh J's obiter in Marion's Case — showing the onus question remains unsettled in Australia.
    why-here: Used to demonstrate the live disagreement over whether consent is a defence or an element.
    verify: true
  - slug: dean-v-phung
    name: Dean v Phung
    citation: "[2012] NSWCA 223"
    aglc: "Dean v Phung [2012] NSWCA 223"
    facts: Dr Phung treated Dean for minor chipping of his front teeth but conducted more than 53 consultations to perform unnecessary procedures, costing Dean $73,640.
    issue: Whether the patient's consent to dental treatment extended to the scale and nature of the treatment actually carried out.
    held: The court found that the consent given was not validly given.
    ratio: Consent to medical or dental treatment does not extend to treatment far beyond the scope of what was actually agreed to; excessive, unnecessary treatment can vitiate consent.
    significance: Illustrates that exceeding the scope of consent, not just an outright absence of consent, can found liability in trespass to the person.
    why-here: Used with McNamara v Duncan to show consent is specific to the act agreed to, not a blanket licence.
    verify: false
  - slug: brightwater-care-group-v-rossiter
    name: Brightwater Care Group (Inc) v Rossiter
    citation: "(2009) 40 WAR 84"
    aglc: "Brightwater Care Group (Inc) v Rossiter (2009) 40 WAR 84"
    facts: A completely paralysed patient, unable to consume nutrition or fluids by mouth, directed care home staff to discontinue his nutrition and fluids.
    issue: Whether a medical practitioner or care provider commits a trespass by continuing treatment against the wishes of a medically competent patient.
    held: The court ruled that continuing treatment against the wishes of a competent patient would be a trespass against him.
    ratio: A medically competent patient's right to autonomy and self-determination entitles them to refuse treatment, including life-sustaining nutrition and fluids; continuing treatment against that refusal is a trespass.
    significance: Confirms that adult capacity to refuse treatment is not lost merely because the consequence is death.
    why-here: The key authority for competent-adult refusal of treatment, contrasted with the cases on minors' capacity.
    verify: false
  - slug: gillick-v-west-norfolk-and-wisbech-area-health-authority
    name: Gillick v West Norfolk and Wisbech Area Health Authority
    citation: "[1986] 1 AC 112"
    aglc: "Gillick v West Norfolk and Wisbech Area Health Authority [1986] 1 AC 112"
    facts: A government circular advised doctors that they could, in exceptional circumstances, give contraceptive advice and treatment to a girl under 16 without her parents' knowledge or consent; a mother challenged the lawfulness of this guidance.
    issue: Whether a minor under 16 could give a legally effective consent to medical advice and treatment for contraception without parental consent.
    held: The House of Lords held that a minor can give valid consent to medical treatment once she achieves sufficient understanding and intelligence to fully understand what is proposed.
    ratio: Parental authority to consent to a minor child's medical treatment yields once the child achieves sufficient understanding and intelligence to understand fully what is proposed.
    significance: Establishes the "Gillick competence" test for minors' capacity to consent, adopted by the High Court in Marion's Case.
    why-here: The origin of the "sufficient understanding" test used throughout the consent-and-minors line of authority.
    verify: false
  - slug: x-v-sydney-childrens-hospital-network
    name: X v Sydney Children's Hospital Network
    citation: "(2013) 85 NSWLR 294"
    aglc: "X v Sydney Children's Hospital Network (2013) 85 NSWLR 294"
    facts: X, a 17-year-old Jehovah's Witness with Hodgkin's disease, was found competent but refused a blood transfusion needed for his chemotherapy; his parents supported the refusal, and the hospital sought Supreme Court orders authorising the transfusion.
    issue: Whether the Supreme Court's parens patriae jurisdiction extends to a competent "mature minor" under 18, and whether s 174 of the Children and Young Persons (Care and Protection) Act 1998 (NSW) excludes it.
    held: The Court of Appeal held that the parens patriae jurisdiction extends to any person under 18, even a competent mature minor, and that s 174 did not exclude it absent clear words; the orders authorising the transfusion were upheld.
    ratio: A statute governing children's welfare does not oust the court's inherent parens patriae jurisdiction over persons under 18, including a competent mature minor, unless it does so in clear and unambiguous language.
    significance: Shows that even a minor's Gillick-competent refusal of treatment can be overridden by the court's protective jurisdiction.
    why-here: The leading illustration that capacity to consent (or refuse) is not always the last word for a person under 18.
    verify: false
  - slug: mcnamara-v-duncan
    name: McNamara v Duncan
    citation: "(1971) 26 ALR 584"
    aglc: "McNamara v Duncan (1971) 26 ALR 584"
    facts: The plaintiff was playing Australian Rules football when the defendant, an opposing player, deliberately struck him on the head with a raised elbow after he had kicked the ball away, fracturing his skull and causing permanent disability.
    issue: Whether playing in a game of football amounts to consent to a deliberate, rule-breaking blow causing serious injury.
    held: Fox J held that the striking was intentional and a serious infringement of the rules, and entered judgment for the plaintiff in battery.
    ratio: A player does not consent to deliberately inflicted injury merely by taking part in a contact sport, even though some foul play is known to occur; consent extends only to contact within the rules and usages of the game.
    significance: The leading Australian statement of the limits of consent in sport — deliberate, rule-breaking violence is not covered by playing the game.
    why-here: Central authority for "exceeding the scope of consent" in a sporting-injury fact pattern.
    verify: true
  - slug: zecevic-v-dpp
    name: Zecevic v DPP
    citation: "(1987) 162 CLR 645"
    aglc: "Zecevic v DPP (1987) 162 CLR 645"
    facts: Not detailed in this week's materials; the case is cited only for its statement of the common law test for self-defence.
    issue: What a defendant must prove to establish self-defence at common law.
    held: The High Court held that a defendant relying on self-defence at common law must prove a reasonable apprehension of physical force to themselves or others, and that the force used was proportionate to the threat.
    ratio: Self-defence at common law requires (1) a reasonable apprehension of physical force and (2) a proportionate response to that apprehended force.
    significance: The source of the common law two-limb test for self-defence, distinct from the statutory test in s 52 of the Civil Liability Act 2002 (NSW).
    why-here: The starting point for any self-defence problem before turning to the Civil Liability Act.
    verify: true
  - slug: fontin-v-katapodis
    name: Fontin v Katapodis
    citation: "(1962) 108 CLR 177"
    aglc: "Fontin v Katapodis (1962) 108 CLR 177"
    facts: Fontin incorrectly accused Katapodis of not paying for goods, leading to a heated argument. Katapodis picked up a wooden T-square and broke it on Fontin's shoulder; Fontin then threw an off-cut of glass at Katapodis's face, injuring his hand.
    issue: Whether Fontin's response was a proportionate act of self-defence, and whether Katapodis's provocation reduced Fontin's liability.
    held: |-
      The High Court held that while Fontin had the right to defend himself, throwing the glass was "out of
      all reasonable proportion to the emergency confronting Fontin"; provocation could not reduce the
      compensatory damages awarded against him.
    ratio: Self-defence fails where the force used is disproportionate to the threat faced, and provocation is not a defence that reduces compensatory damages in tort, though it may affect exemplary damages.
    significance: The leading illustration of the proportionality limb of self-defence, and of provocation's limited role in tort.
    why-here: Used for both the self-defence proportionality question and the "provocation doesn't reduce damages" rule.
    verify: false
  - slug: nsw-v-mcmaster
    name: NSW v McMaster
    citation: "[2015] NSWCA 228"
    aglc: "New South Wales v McMaster [2015] NSWCA 228"
    facts: |-
      Justin's partner, sister and mother suffered a violent home invasion involving physical and sexual
      assault; police arrived after a call from Justin's partner. Justin ran out of the house holding a metal
      curtain rod, yelling "Where's my sister"; as he ran towards one constable, he was shot by another,
      Constable F.
    issue: Whether Constable F could rely on self-defence (and necessity) against a claim for battery and trespass to the person brought by Justin.
    held: |-
      The trial court found battery and rejected self-defence; the Court of Appeal reversed, holding that
      both the subjective and objective limbs of the self-defence test were satisfied on the facts, and that
      Justin's own conduct, though not intentional, was itself an unlawful, negligent trespass to the person.
    ratio: Self-defence can be made out where the defendant subjectively believed force was necessary and that belief, along with the response, was objectively reasonable in the circumstances as perceived, even where the person responded to did not intend their own conduct.
    significance: A modern application of the self-defence test to a split-second use of force by police, and an example of necessity pleaded in the alternative.
    why-here: Central fact pattern for applying both the self-defence tests and necessity in trespass to the person.
    verify: false
  - slug: horkin-v-north-melbourne-football-club
    name: Horkin v North Melbourne Football Club
    citation: "[1993] VR 153"
    aglc: "Horkin v North Melbourne Football Club [1993] VR 153"
    facts: Horkin was asked to leave a football club because he had had too much to drink; when he did not leave, club employees threw him out with more force than necessary, injuring him.
    issue: Whether the plaintiff's own carelessness (intoxication, failing to leave when asked) should reduce the defendant's liability for an intentional battery.
    held: The trial judge reduced the defendant's liability by 30% for contributory negligence; the Victorian Supreme Court held this was unfair and unjust, and restored full liability.
    ratio: |-
      Contributory negligence is not a defence to an intentional tort: the difference between an intentional
      wrong and the plaintiff's carelessness "is not merely in degree but in kind", and the social
      condemnation attached to intentional wrongdoing differs markedly from carelessness.
    significance: The leading Australian rejection of contributory negligence as a defence, or damages-reducing factor, for intentional torts.
    why-here: The authority for "contributory negligence does not apply to intentional torts".
    verify: false
  - slug: southwark-london-borough-council-v-williams
    name: Southwark London Borough Council v Williams
    citation: "[1971] Ch 734"
    aglc: "Southwark London Borough Council v Williams [1971] Ch 734"
    facts: Two homeless families, in desperate circumstances, made an orderly entry into empty council-owned houses in Southwark that were awaiting redevelopment; the council sought summary possession orders.
    issue: Whether necessity is available as a defence to trespass where the defendants entered land because they were homeless.
    held: The Court of Appeal unanimously held that necessity did not excuse the trespass.
    ratio: The necessity defence is confined to cases of great and imminent danger to life, and does not extend to homelessness or housing need; admitting such a plea would mean "no one's house could be safe".
    significance: Sets the outer limit of the necessity defence, and Lord Denning's warning that the doctrine "must be carefully circumscribed".
    why-here: The leading case for how narrowly necessity is construed.
    verify: false
  - slug: proudman-v-allen
    name: Proudman v Allen
    citation: "[1954] SASR 336"
    aglc: "Proudman v Allen [1954] SASR 336"
    facts: The defendant saw a car rolling driverless down a slope towards another car and turned the runaway car's steering wheel to avoid a collision; this caused the runaway car to roll into the sea. Its owner sued.
    issue: Whether a stranger who damages another's property while acting to prevent a greater harm can rely on necessity.
    held: The defendant successfully relied on the defence of necessity.
    ratio: The necessity defence to protect property from harm is available even to a volunteer or stranger who acts to protect the property of others, not only to the property's owner.
    significance: Shows necessity operates even without any pre-existing relationship between the defendant and the property protected or damaged.
    why-here: Illustrates the "protecting property" branch of necessity, contrasted with Southwark's rejection of the "own need" branch.
    verify: false
  - slug: in-re-f-mental-patient-sterilisation
    name: "In re F (Mental Patient: Sterilisation)"
    citation: "[1990] 2 AC 1"
    aglc: "In re F (Mental Patient: Sterilisation) [1990] 2 AC 1"
    facts: |-
      F, a 36-year-old woman with a serious mental disability, developed a sexual relationship with a fellow
      patient. Doctors considered she would not cope with pregnancy and childbirth and there were no viable
      alternatives; F's mother sought a declaration that sterilising F would be lawful.
    issue: On what basis a doctor may lawfully treat a patient who is unable to consent, in the patient's best interests.
    held: Lord Goff granted the declaration that it would be lawful for the doctors to sterilise F in the circumstances.
    ratio: |-
      Necessity justifies medical treatment of a person unable to consent where it is not practicable to
      communicate with them, and the treatment given is what a reasonable person would give, acting in the
      assisted person's best interests; for a permanently incapacitated patient the doctor need not wait to
      obtain consent, but for a temporarily incapacitated patient the doctor should do no more than necessary
      until the patient recovers.
    significance: The leading statement of medical necessity, distinguishing temporary from permanent incapacity.
    why-here: Central authority for the medical-necessity branch of the necessity defence.
    verify: false

authorities:
  - slug: civil-liability-act-2002-nsw-s52
    title: Civil Liability Act 2002 (NSW) s 52
    kind: statute
    text: |
      (1) A person does not incur a liability to which this Part applies arising from any conduct of the
      person carried out in self-defence, but only if the conduct to which the person was responding—
      (a) was unlawful, or
      (b) would have been unlawful if the other person carrying out the conduct to which the person responds
      had not had a mental health impairment or a cognitive impairment at the time of the conduct.
      (2) A person carries out conduct in self-defence if and only if the person believes the conduct is
      necessary— (a) to defend himself or herself or another person, or (b) to prevent or terminate the
      unlawful deprivation of his or her liberty or the liberty of another person, or (c) to protect property
      from unlawful taking, destruction, damage or interference, or (d) to prevent criminal trespass to any
      land or premises or to remove a person committing any such criminal trespass, and the conduct is a
      reasonable response in the circumstances as he or she perceives them.
      (3) This section does not apply if the person uses force that involves the intentional or reckless
      infliction of death only— (a) to protect property, or (b) to prevent criminal trespass or to remove a
      person committing criminal trespass.
    gloss: A person is not civilly liable for conduct carried out in self-defence, provided they believed it was necessary for one of the listed purposes, their response was reasonable in the circumstances as they perceived them, and the conduct they were responding to was itself unlawful.
    cases: [nsw-v-mcmaster]
    verify: false
  - slug: civil-liability-act-2002-nsw-s53
    title: Civil Liability Act 2002 (NSW) s 53
    kind: statute
    text: |
      (1) If section 52 would operate to prevent a person incurring a liability to which this Part applies in
      respect of any conduct but for the fact that the conduct was not a reasonable response in the
      circumstances as he or she perceived them, a court is nevertheless not to award damages against the
      person in respect of the conduct unless the court is satisfied that— (a) the circumstances of the case
      are exceptional, and (b) in the circumstances of the case, a failure to award damages would be harsh and
      unjust.
      (2) If the court determines to award damages on the basis of subsection (1), the following limitations
      apply to that award— (a) Part 2 (with the exception of Division 3 of that Part) applies with respect to
      the award of damages despite section 3B(1)(a), and (b) no damages may be awarded for non-economic loss.
    gloss: Even where the defendant's response to unlawful conduct was not reasonable (so s 52 does not fully apply), a court may still limit the damages awarded against them to exceptional cases where refusing damages would be harsh and unjust, and even then non-economic loss is excluded.
    cases: []
    verify: false
  - slug: civil-liability-act-2002-nsw-s54
    title: Civil Liability Act 2002 (NSW) s 54
    kind: statute
    text: |
      (1) A court is not to award damages in respect of liability to which this Part applies if the court is
      satisfied that— (a) the death of, or the injury or damage to, the person that is the subject of the
      proceedings occurred at the time of, or following, conduct of that person that, on the balance of
      probabilities, constitutes a serious offence, and (b) that conduct contributed materially to the death,
      injury or damage or to the risk of death, injury or damage.
      (2) This section does not apply to an award of damages against a defendant if the conduct of the
      defendant that caused the death, injury or damage concerned constitutes an offence (whether or not a
      serious offence).
      (3) A serious offence is an offence punishable by imprisonment for 6 months or more.
    gloss: A court must not award damages to a claimant whose own conduct at the relevant time amounted to a serious offence that materially contributed to their death, injury or damage — unless the defendant's own conduct was itself also an offence.
    cases: []
    verify: false
  - slug: civil-liability-act-2002-nsw-s3b
    title: Civil Liability Act 2002 (NSW) s 3B
    kind: statute
    text: |
      (1) The provisions of this Act do not apply to or in respect of civil liability (and awards of damages
      in those proceedings) as follows— (a) civil liability of a person in respect of an intentional act that
      is done by the person with intent to cause injury or death or that is sexual assault or other sexual
      misconduct committed by the person—the whole Act except— … (ii) Part 7 (Self-defence and recovery by
      criminals) in respect of civil liability in respect of an intentional act that is done with intent to
      cause injury or death …
    gloss: Although the Act generally excludes intentional acts done with intent to cause injury or death from most of its protections, Part 7 (self-defence) is expressly carved back in, so a defendant sued for an intentional tort can still rely on the statutory self-defence provisions.
    cases: []
    verify: false
  - slug: law-enforcement-powers-and-responsibilities-act-2002-nsw-s99
    title: Law Enforcement (Powers and Responsibilities) Act 2002 (NSW) s 99(1)
    kind: statute
    text: |
      Arrest without a warrant requires BOTH (a) suspicion on reasonable grounds that the person is committing
      or has committed an offence AND (b) satisfaction that the arrest is reasonably necessary for one of the
      reasons listed in the section. Suspicion is more than a possibility, less than a belief.
    gloss: A police officer may only arrest without a warrant where they both reasonably suspect the person of an offence and are satisfied the arrest is reasonably necessary for a reason the Act lists.
    cases: []
    verify: true
  - slug: law-enforcement-powers-and-responsibilities-act-2002-nsw-ss230-231
    title: Law Enforcement (Powers and Responsibilities) Act 2002 (NSW) ss 230–231
    kind: statute
    text: A person exercising a function under the Act, including making an arrest, may use such force as is reasonably necessary.
    gloss: Force used in an arrest or other exercise of police powers under LEPRA must be limited to what is reasonably necessary in the circumstances.
    cases: []
    verify: true
  - slug: police-administration-act-1978-nt-s126
    title: Police Administration Act 1978 (NT) s 126(2A)
    kind: statute
    text: A provision empowering a police officer, having formed a relevant view as to a person's intoxication, to require that person to submit to a breath test and to remain for that purpose.
    gloss: Once an officer lawfully on premises observes signs of intoxication, this section gives an independent statutory power to require a breath test and to remain on the land for that purpose.
    cases: [roy-v-oneill]
    verify: true
  - slug: children-and-young-persons-care-and-protection-act-1998-nsw-s174
    title: Children and Young Persons (Care and Protection) Act 1998 (NSW) s 174
    kind: statute
    text: A provision, so far as relevant, dealing with emergency medical treatment of a child or young person, which was held not to exclude the Supreme Court's parens patriae jurisdiction absent clear words or necessary intendment.
    gloss: This section governs emergency medical treatment of children and young people, but does not by itself take away the Supreme Court's inherent power to protect a person under 18, including a competent mature minor.
    cases: [x-v-sydney-childrens-hospital-network]
    verify: true

questions:
  - key: q001
    type: mcq
    concept: consent-defence-nature-and-onus
    difficulty: 1
    set: pretest
    stem: What is the underlying rationale for the defence of consent in tort law?
    options:
      - text: Deference to individual autonomy — if a person freely agreed to the interference, the law generally will not intervene
        correct: true
        why: Correct — the lecture grounds consent in respect for the individual's own choice about what happens to them.
      - text: A policy of protecting defendants from any liability whenever a plaintiff was careless about their own safety
        correct: false
        why: This describes something closer to contributory negligence, not consent, and is not the stated rationale.
      - text: The idea that damage cannot be proved once a plaintiff has agreed to any risk of physical contact whatsoever
        correct: false
        why: Consent is not really about proof of damage; several intentional torts, including battery, are actionable without proof of damage regardless of consent.
      - text: A rule that only applies where the defendant reasonably believed, on an objective view of events, that consent existed
        correct: false
        why: This describes a mistaken-belief style defence, not the deference-to-autonomy rationale the lecture actually gives for consent.
  - key: q002
    type: mcq
    concept: consent-defence-nature-and-onus
    difficulty: 1
    stem: To which of the following torts is consent said to be available as a defence?
    options:
      - text: Battery, assault, false imprisonment, trespass to land and interference with chattels
        correct: true
        why: Correct — this is exactly the list of torts the lecture identifies consent as a defence to.
      - text: Only battery and assault, because these are the only torts requiring direct physical contact with a person
        correct: false
        why: Too narrow — the lecture also lists false imprisonment, trespass to land and interference with chattels.
      - text: Negligence, nuisance and defamation, because these are the torts most often settled by agreement
        correct: false
        why: None of these appear on the lecture's list; consent as a defence is discussed in the context of intentional torts.
      - text: Every tort without exception, since agreement by the plaintiff always removes liability for any wrongdoing
        correct: false
        why: This overstates the defence — consent is discussed for a specific, listed set of intentional torts, not as a universal answer to any tort.
    variant-of: q001
  - key: q003
    type: mcq
    concept: consent-defence-nature-and-onus
    difficulty: 2
    stem: According to courts in England and New Zealand, how is consent best classified in trespassory torts?
    options:
      - text: As an element of trespassory conduct, so the plaintiff bears the onus of proving lack of consent
        correct: true
        why: Correct — this is the position the lecture attributes to English and New Zealand courts.
      - text: As a defence, so the defendant bears the onus of proving that consent existed
        correct: false
        why: This is the position attributed to Canadian and Australian courts (and to McHugh J), not the English/New Zealand position.
      - text: As irrelevant, because those courts do not recognise consent as affecting liability for trespass at all
        correct: false
        why: Consent plainly affects liability in both approaches — the disagreement is only about its classification and who bears the onus.
      - text: As a matter for the jury alone, with no fixed legal classification as either an element or a defence
        correct: false
        why: The lecture describes a definite legal classification (element) taken by these courts, not an unresolved jury question.
    variant-of: q003
  - key: q004
    type: mcq
    concept: consent-defence-nature-and-onus
    difficulty: 2
    stem: What view did courts in Canada and Australia take on the classification of consent, according to the lecture?
    options:
      - text: A different view from England and New Zealand — broadly, that consent is a defence rather than an element
        correct: true
        why: Correct — the lecture contrasts the Canadian/Australian approach with the English/New Zealand "element" approach.
      - text: The identical view to England and New Zealand, since all common law jurisdictions have now harmonised the rule
        correct: false
        why: The lecture explicitly says these courts "have taken a different view", so there is no full harmonisation.
      - text: That consent can never operate as a defence in Canada or Australia, only ever as an element
        correct: false
        why: This is the reverse of the position — Canadian and Australian courts have tended toward treating consent as a defence, not an element.
      - text: That the classification question does not arise in these jurisdictions because consent is decided as a question of fact only
        correct: false
        why: The lecture frames this squarely as a live legal classification question in these jurisdictions, not a pure fact-finding exercise.
    variant-of: q003
  - key: q005
    type: mcq
    concept: consent-defence-nature-and-onus
    difficulty: 2
    stem: In Marion's Case, what did McHugh J reason in obiter about the legal nature of consent?
    options:
      - text: That consent is a defence, so the onus is on the defendant to prove that there was consent
        correct: true
        why: Correct — this is exactly McHugh J's obiter reasoning as described in the lecture.
      - text: That consent is an element of trespassory conduct, so the onus is on the plaintiff to disprove it
        correct: false
        why: This is the English/New Zealand position, and the opposite of what McHugh J reasoned in obiter.
      - text: That consent should never be available as a defence to any form of trespass to the person
        correct: false
        why: McHugh J's remarks concerned who bears the onus, not whether consent is available as a defence at all.
      - text: That the onus should shift to whichever party has better access to the relevant medical records
        correct: false
        why: The obiter reasoning was framed in terms of the legal classification of consent, not the practical availability of evidence.
    variant-of: q005
  - key: q006
    type: mcq
    concept: consent-defence-nature-and-onus
    difficulty: 2
    stem: In White v Johnston, what did Leeming JA consider, in obiter, was the better view of consent?
    options:
      - text: That consent is an essential element of assault and battery, which the plaintiff must negative
        correct: true
        why: Correct — Leeming JA's obiter view was that consent forms part of the elements of these torts.
      - text: That consent is a defence which the defendant must plead and prove, matching McHugh J's approach exactly
        correct: false
        why: This is the opposite of Leeming JA's obiter view, which favoured treating consent as an element, not a defence.
      - text: That consent is irrelevant to liability for assault and battery once any physical contact has occurred
        correct: false
        why: Leeming JA's remarks were about how consent should be classified, not about abolishing its relevance altogether.
      - text: That the question should be left entirely to the jury without any guiding legal classification at all
        correct: false
        why: Leeming JA expressed a specific obiter view on the correct legal classification, rather than declining to classify it.
