  - key: q063
    type: short
    concept: consent-capacity-and-minors
    difficulty: 4
    prompt: |-
      Tomas, aged 16, is assessed by two independent doctors as having sufficient understanding and
      intelligence to fully understand a proposed non-urgent medical procedure. Tomas wants the procedure; his
      parents disagree and refuse to consent. Advise on the relevance of the Gillick and Marion's Case
      authorities, and whether Tomas's own consent might be legally effective — and note any further limit on
      that effectiveness.
    model: |-
      The starting point is that adults are presumed to have capacity to consent, but Tomas is a minor, so his
      capacity must be assessed under the Gillick test. In Gillick v West Norfolk and Wisbech Area Health
      Authority, the House of Lords held that a minor can give valid consent to medical treatment once she
      achieves "sufficient understanding and intelligence to enable her to understand fully what is proposed".
      The High Court approved this test in Secretary, Department of Health and Community Services v JWB
      (Marion's Case), while adding that a child's disability does not of itself defeat capacity, and that
      parents cannot consent to non-therapeutic treatment against the child's interests. On the facts, Tomas
      has been assessed by two independent doctors as having sufficient understanding and intelligence to
      fully understand what is proposed. If a court accepts that assessment, Tomas is Gillick-competent, and
      his own consent to the procedure would be legally effective notwithstanding his parents' refusal —
      parental authority to decide yields once the child achieves that level of understanding. However, Gillick
      competence is not necessarily the end of the analysis. As X v Sydney Children's Hospital Network shows,
      even a competent mature minor's decision can, in an appropriate case, be revisited under the Supreme
      Court's parens patriae jurisdiction, which extends to any person under 18. On these facts — a non-urgent
      procedure, with the minor himself wanting treatment rather than refusing it — that jurisdiction is
      unlikely to be invoked to override his wishes, but it remains a background possibility that should be
      noted in full advice.
    rubric:
      - id: r1
        criterion: Identifies that Tomas's capacity must be assessed under the Gillick test rather than assumed
        marks: 2
        top-band: Explains why the ordinary adult presumption of capacity does not directly apply to a minor.
        margin-note: Correctly frames the starting point.
        authorities: []
      - id: r2
        criterion: States the Gillick test accurately (sufficient understanding and intelligence to understand fully what is proposed)
        marks: 2
        top-band: Quotes or closely paraphrases the test correctly.
        margin-note: Test stated accurately.
        authorities: []
      - id: r3
        criterion: Applies Marion's Case to confirm the test is approved in Australia and explains why parental refusal does not automatically control a competent minor
        marks: 2
        top-band: Explains that parental authority yields once sufficient understanding is achieved.
        margin-note: Correct application of Marion's Case.
        authorities: []
      - id: r4
        criterion: Notes the further limit — the parens patriae jurisdiction from X v Sydney Children's Hospital Network — as a background possibility even for a competent minor
        marks: 2
        top-band: Explains that competence does not automatically oust the court's protective jurisdiction, with reference to X.
        margin-note: Shows awareness that Gillick competence is not necessarily the final word.
        authorities: []
