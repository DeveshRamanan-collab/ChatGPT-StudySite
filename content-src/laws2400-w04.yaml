  - key: q007
    type: mcq
    concept: consent-defence-nature-and-onus
    difficulty: 3
    stem: Why does the debate between McHugh J's and Leeming JA's obiter views actually matter for a plaintiff and defendant at trial?
    options:
      - text: Because it determines which party bears the onus of proof on consent, and so which party loses if the evidence is unclear
        correct: true
        why: Correct — if consent is a defence the defendant must prove it, and if it is an element the plaintiff must disprove it, which decides the outcome on inconclusive evidence.
      - text: Because it changes the maximum amount of damages that can ever be awarded in a successful claim for battery
        correct: false
        why: The classification of consent affects the onus of proof, not any statutory or common law cap on damages.
      - text: Because only a defence, and never an element, can be raised for the first time on appeal without objection
        correct: false
        why: The lecture does not draw this procedural distinction; the significance discussed is about the onus of proof at trial.
      - text: Because elements of a tort must be proved criminally beyond reasonable doubt, while defences use the civil standard in all cases, regardless of the specific circumstances
        correct: false
        why: Both the elements and defences of a civil tort claim are proved on the balance of probabilities; there is no criminal standard involved.
  - key: q008
    type: mcq
    concept: consent-defence-nature-and-onus
    difficulty: 3
    stem: A plaintiff sues in battery, and at trial the evidence about whether she consented is genuinely inconclusive. If an Australian court followed Leeming JA's obiter view in White v Johnston, what is the likely outcome?
    options:
      - text: The plaintiff loses, because consent is treated as an element she must disprove and she has failed to do so on inconclusive evidence
        correct: true
        why: Correct — treating consent as an element puts the onus of disproving it on the plaintiff, so inconclusive evidence means she has not discharged that onus.
      - text: The defendant loses automatically, because any uncertainty about consent is always resolved in favour of the plaintiff regardless of onus
        correct: false
        why: This ignores the whole point of the onus debate — the outcome on unclear evidence turns on who bears the onus, not an automatic rule favouring plaintiffs.
      - text: The case must be adjourned indefinitely until further evidence resolves the question of consent one way or the other
        correct: false
        why: Courts decide cases on the evidence available and the applicable onus; they do not simply adjourn indefinitely for want of clearer evidence.
      - text: The result is identical to McHugh J's approach, since both obiter views ultimately place the onus on the same party
        correct: false
        why: The two obiter views place the onus on opposite parties (defendant under McHugh J, plaintiff under Leeming JA), so the result on unclear evidence would differ.
