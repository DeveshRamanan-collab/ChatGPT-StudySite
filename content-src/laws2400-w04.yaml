  - key: q039
    type: short
    concept: consent-validity-and-scope
    difficulty: 3
    prompt: |-
      Comment on the following statement: "Because the plaintiff in Dean v Phung agreed to some dental
      treatment, and the plaintiff in McNamara v Duncan agreed to play in a game of football, both plaintiffs
      had consented to everything that later happened to them." Do you agree? Explain your answer with
      reference to the requirement that consent relate to the act complained of.
    model: |-
      This statement is incorrect, and confuses bare agreement to some act with valid consent to the specific
      act that actually occurred. Consent is only a defence where it relates to the act complained of: a
      person who agrees to one thing has not thereby agreed to something materially different or more
      extensive. In McNamara v Duncan, the plaintiff agreed to play Australian Rules football, and consented to
      forcible bodily contact within the rules and usages of the game. He did not, by taking part, consent to
      a deliberate blow that was a serious infringement of the rules and caused a fractured skull; the court
      held that consent to a sport does not extend to deliberately inflicted injury, even though some foul play
      is known to occur. Similarly, in Dean v Phung, the plaintiff consented to treatment for minor chipping of
      his front teeth. He did not, by giving that limited consent, agree to more than 53 consultations of
      unnecessary procedures costing $73,640; the court found this consent was not validly given because the
      treatment actually carried out went far beyond what had been agreed. In both cases, the defendant's
      conduct exceeded the scope of the plaintiff's actual consent, so the defence of consent failed. The
      correct analysis is therefore not "they agreed to something, so anything follows", but "did the specific
      conduct complained of fall within the scope of what was actually agreed to" — and in both cases it did
      not.
    rubric:
      - id: r1
        criterion: States that the claim in the prompt is incorrect and identifies the relevant principle (consent must relate to the act complained of)
        marks: 2
        top-band: Clearly states disagreement and names the scope-of-consent principle at the outset.
        margin-note: Good — takes a clear position and names the principle.
        authorities: []
      - id: r2
        criterion: Correctly applies the principle to McNamara v Duncan
        marks: 2
        top-band: Explains that consent to the game covered rule-compliant contact only, not a deliberate rule-breaking blow.
        margin-note: Case applied accurately to the facts.
        authorities: []
      - id: r3
        criterion: Correctly applies the principle to Dean v Phung
        marks: 2
        top-band: Explains that consent to minor treatment did not extend to 53 unnecessary consultations.
        margin-note: Case applied accurately to the facts.
        authorities: []
      - id: r4
        criterion: Draws the general conclusion linking both cases to the scope-of-consent requirement
        marks: 2
        top-band: Articulates the general test (specific act actually agreed to, not "something" agreed to) clearly.
        margin-note: Ties both cases together into one coherent principle.
        authorities: []
