  - key: q117
    type: short
    concept: psychiatric-harm-common-law-development
    difficulty: 4
    prompt: |
      Explain how Tame v New South Wales; Annetts v Australian Stations changed the common law approach to
      psychiatric harm, and why the two cases reached opposite results despite applying the same test.
    model: |
      Before Tame v New South Wales; Annetts v Australian Stations Pty Ltd, lower courts had treated three
      "control mechanisms" as preconditions for a duty of care in psychiatric harm cases: that the plaintiff be a
      person of normal fortitude, that the harm be caused by a sudden shock, and that the plaintiff directly
      perceive the distressing event or its immediate aftermath. Gummow and Kirby JJ held that none of these three
      mechanisms is in fact "a pre-condition to liability for negligently inflicted psychiatric harm." Instead, the
      central and only real inquiry is whether it was reasonably foreseeable that a person in the plaintiff's
      position would suffer a recognised psychiatric illness as a result of the defendant's conduct; normal
      fortitude, sudden shock and direct perception remain relevant to that foreseeability assessment, but do not
      operate as fixed gatekeeping requirements. The two cases, decided together, illustrate the test applied both
      ways rather than announcing a rule that always favours plaintiffs. In Tame, a police officer completing an
      accident report mistakenly recorded Mrs Tame's blood alcohol reading as 0.14 rather than nil; although the
      error was corrected within weeks and an apology given, her solicitor told her of it over a year later and
      she developed a psychotic depressive illness. The High Court held the officer owed her no duty of care,
      because it was not reasonably foreseeable that a person in her position would develop a recognised
      psychiatric illness from an error that had already been corrected and apologised for — her reaction was, in
      the Court's words, extreme and idiosyncratic. In Annetts, by contrast, the parents of a 16-year-old jackaroo
      had specifically sought and received an assurance from his employer that he would be constantly supervised;
      when he was instead sent to work alone, went missing, and died of dehydration in the desert, the Court held
      the employer did owe the parents a duty of care to avoid causing them psychiatric harm. Here, the
      pre-existing relationship between the parties — created by the parents' inquiries and the employer's
      assurance — made a psychiatric injury to the parents reasonably foreseeable if that promise were broken, and
      it also kept the class of possible plaintiffs determinate, addressing the indeterminate-liability concern
      that partly motivated the old control mechanisms. The difference in outcome therefore turns not on any
      difference in the legal test, but on the different facts bearing on foreseeability: an idiosyncratic reaction
      to a corrected clerical error in Tame, against a specific relationship and a broken promise of supervision in
      Annetts.
    rubric:
      - id: r1
        criterion: Correctly states the three control mechanisms and that none is a pre-condition.
        marks: 3
        top-band: Names all three mechanisms and accurately states Gummow and Kirby JJ's conclusion in their own terms.
        margin-note: Precise use of the judgment's language here is rewarded.
        authorities: []
      - id: r2
        criterion: States the single foreseeability test that replaces the rigid control mechanisms.
        marks: 2
        top-band: Clearly articulates foreseeability of a recognised psychiatric illness as the central inquiry.
        margin-note: Good — this is the core doctrinal shift.
        authorities: []
      - id: r3
        criterion: Accurately explains the facts and outcome of Tame.
        marks: 2
        top-band: Explains why the reaction was extreme/idiosyncratic and unforeseeable given the correction and apology.
        margin-note: Clear factual application.
        authorities: []
      - id: r4
        criterion: Accurately explains the facts and outcome of Annetts, and the relationship-based foreseeability.
        marks: 3
        top-band: Explains the pre-existing relationship, the broken promise, and how this addressed indeterminacy concerns.
        margin-note: Strong contrast with Tame.
        authorities: []
  # quickfire (set: quickfire) for concept 6
  - key: q118
    type: truefalse
    set: quickfire
    concept: psychiatric-harm-common-law-development
    statement: Gummow and Kirby JJ held that "sudden shock" is an absolute pre-condition for recovering damages for negligently inflicted psychiatric harm.
    answer: false
    why: False — they held none of the three control mechanisms, including sudden shock, is a pre-condition to liability for negligently inflicted psychiatric harm.
  - key: q119
    type: truefalse
    set: quickfire
    concept: psychiatric-harm-common-law-development
    statement: In Tame v New South Wales, the High Court held the police officer owed Mrs Tame a duty of care.
    answer: false
    why: False — the High Court held the officer did not owe Mrs Tame a duty of care, because her psychiatric injury was not reasonably foreseeable.
  - key: q120
    type: truefalse
    set: quickfire
    concept: psychiatric-harm-common-law-development
    statement: In Annetts v Australian Stations Pty Ltd, the High Court held the employer owed the parents a duty of care despite the absence of a sudden shock or direct perception of their son's death.
    answer: true
    why: True — the Court rejected sudden shock and direct perception as rigid preconditions and found a duty based on the pre-existing relationship and reasonable foreseeability.
  # ---------- Concept 7: psychiatric-harm-civil-liability-act ----------
  - key: q121
    type: mcq
    concept: psychiatric-harm-civil-liability-act
    difficulty: 1
    stem: How does s 27 of the Civil Liability Act define "mental harm"?
    options:
      - text: Impairment of a person's mental condition.
        correct: true
        why: Correct — this is the exact statutory definition of "mental harm" in s 27 of the Civil Liability Act.
      - text: Any form of stress arising from ordinary workplace duties.
        why: Wrong — this is not the statutory wording; s 27 defines mental harm as impairment of a person's mental condition, not by reference to workplace stress.
      - text: Physical injury to the brain caused by external trauma.
        why: Wrong — this describes a physical injury, not the statutory definition of mental harm, which is about impairment of mental condition generally, not physical brain trauma specifically.
  - key: q122
    type: mcq
    concept: psychiatric-harm-civil-liability-act
    variant-of: q121
    difficulty: 2
    stem: Under s 27, what distinguishes "pure mental harm" from "consequential mental harm"?
    options:
      - text: Consequential mental harm is mental harm that is a consequence of a personal injury of any other kind, whereas pure mental harm is mental harm that is not consequential.
        correct: true
        why: Correct — this tracks the exact statutory definitions in s 27, distinguishing the two categories by whether the mental harm flows from another personal injury.
      - text: Pure mental harm only ever arises from a physical assault, while consequential mental harm arises from any other tort, though this would need to be supported by clear evidence in the specific case.
        why: Wrong — s 27 does not tie either category to a particular type of tort; the distinction is simply whether the mental harm is, or is not, a consequence of another personal injury.
      - text: There is no meaningful difference — the terms are used interchangeably throughout the Act.
        why: Wrong — the Act deliberately distinguishes the two terms, and different provisions (such as s 30 and s 33) apply differently depending on which category is engaged.
  - key: q123
    type: mcq
    concept: psychiatric-harm-civil-liability-act
    difficulty: 2
    stem: What does s 31 of the Civil Liability Act require for a plaintiff to recover damages for pure mental harm?
    options:
      - text: The harm must consist of a recognised psychiatric illness.
        correct: true
        why: Correct — s 31 states there is no liability to pay damages for pure mental harm resulting from negligence unless the harm consists of a recognised psychiatric illness.
      - text: The plaintiff must have suffered a broken bone at the same time.
        why: Wrong — this would make the harm consequential rather than pure, and is not what s 31 requires; s 31's own requirement is a recognised psychiatric illness, not an accompanying physical fracture.
      - text: The plaintiff must have witnessed the triggering event in person.
        why: Wrong — witnessing the event at the scene is a requirement under s 30(2)(a), a different provision, not a requirement imposed by s 31 itself.
  - key: q124
    type: mcq
    concept: psychiatric-harm-civil-liability-act
    difficulty: 2
    stem: According to s 32(1), when does a defendant NOT owe a duty of care to avoid causing the plaintiff mental harm?
    options:
      - text: Unless the defendant ought to have foreseen that a person of normal fortitude might, in the circumstances, suffer a recognised psychiatric illness if reasonable care were not taken.
        correct: true
        why: Correct — this is the exact negative formulation of the duty test in s 32(1), cast as an exception to a general absence of duty.
      - text: Unless the plaintiff can prove the defendant intended to cause psychological harm.
        why: Wrong — s 32(1) is a negligence provision and does not require proof of intention; it turns on foreseeability of harm to a person of normal fortitude.
      - text: Unless the plaintiff is a close member of the victim's family.
        why: Wrong — the close-family-member requirement appears in s 30(2)(b), a different, more specific provision about recovery for pure mental harm from shock, not in the general s 32 duty test.
  - key: q125
    type: mcq
    concept: psychiatric-harm-civil-liability-act
    difficulty: 3
    stem: Which four circumstances does s 32(2) list as relevant to whether a defendant ought to have foreseen mental harm?
    options:
      - text: Whether the harm resulted from a sudden shock; whether the plaintiff witnessed the victim killed/injured/put in peril at the scene; the plaintiff's relationship to the victim; and any pre-existing relationship between plaintiff and defendant.
        correct: true
        why: Correct — these are exactly the four circumstances listed in s 32(2)(a)–(d).
      - text: The plaintiff's age, the defendant's income, the time of day, and the weather conditions.
        why: Wrong — none of these four items appears in s 32(2); the actual list concerns sudden shock, witnessing at the scene, the plaintiff-victim relationship, and any pre-existing plaintiff-defendant relationship.
      - text: Whether the defendant had liability insurance, whether a lawyer was consulted, whether the media reported the event, and whether criminal charges were laid, which could otherwise be relevant to a related cause of action on different facts, though the weight given to this would depend heavily on the tribunal of fact.
        why: Wrong — none of these appears in s 32(2); the section's four circumstances are sudden shock, scene-witnessing, victim relationship, and pre-existing relationship with the defendant.
  - key: q126
    type: mcq
    concept: psychiatric-harm-civil-liability-act
    difficulty: 2
    stem: Under s 30(2), when is a plaintiff entitled to recover damages for pure mental harm arising from shock?
    options:
      - text: If the plaintiff witnessed, at the scene, the victim being killed, injured or put in peril, or is a close member of the family of the victim.
        correct: true
        why: Correct — s 30(2) limits recovery to exactly these two categories of plaintiff, scene-witnesses and close family members.
      - text: If the plaintiff merely read a newspaper report about the incident some weeks later.
        why: Wrong — this does not satisfy either limb of s 30(2), which requires either witnessing at the scene or being a close family member, not merely reading a later report.
      - text: If the plaintiff can show they suffered any degree of upset, however mild, about the incident, though the weight given to this would depend heavily on the tribunal of fact.
        why: Wrong — s 30(2) is not satisfied by mere upset; it requires the specific scene-witnessing or close-family-member connection, and s 31 separately requires a recognised psychiatric illness.
  - key: q127
    type: mcq
    concept: psychiatric-harm-civil-liability-act
    difficulty: 1
    stem: Which of these relationships counts as a "close member of the family of the victim" under s 30?
    options:
      - text: A brother, sister, half-brother or half-sister, or stepbrother or stepsister of the victim.
        correct: true
        why: Correct — this sibling relationship is expressly listed in s 30's definition of close family member, alongside parents, spouses/partners, and children/stepchildren.
      - text: A close personal friend who has known the victim for over a decade.
        why: Wrong — however close the friendship, a friend is not within s 30's defined list of close family members, which is limited to specific familial relationships.
      - text: A work colleague who regularly carpooled with the victim.
        why: Wrong — a work colleague is not one of the relationships s 30 defines as a close family member, regardless of how frequently they interacted.
  - key: q128
    type: mcq
    concept: psychiatric-harm-civil-liability-act
    difficulty: 3
    stem: In Wicks v State Rail Authority (NSW), which section did the High Court say must be considered before s 30(2)?
    options:
      - text: Section 32.
        correct: true
        why: Correct — the High Court held s 32 (which controls whether a duty of care arises at all) must be considered first, because s 30(2) only becomes relevant once a duty exists.
      - text: Section 5H.
        why: Wrong — s 5H is the obvious-risk provision from a completely different part of the Act, dealing with physical harm, not the mental harm provisions in issue in Wicks.
      - text: Section 27.
        why: Wrong — while s 27 provides the definitions used throughout Part 3, the material specifically identifies s 32, the duty provision, as the one that must be addressed before s 30(2).
  - key: q129
    type: mcq
    concept: psychiatric-harm-civil-liability-act
    difficulty: 3
    stem: Why did the officers in Wicks satisfy the requirement of "witnessing, at the scene, the victim being ... put in peril" under s 30(2)(a), even though they arrived after the train had already derailed?
    options:
      - text: Because the survivors of the derailment remained in peril until they had been rescued, and the officers witnessed them still being put in peril while they assisted at the scene.
        correct: true
        why: Correct — the High Court read "being ... put in peril" broadly, holding a person remains in peril until rescued to a place of safety, so the officers witnessed ongoing peril even though they arrived after the initial derailment.
      - text: Because s 30(2)(a) does not actually require witnessing anything, only physical proximity to the scene at any time, though courts have generally treated this as a secondary consideration at most.
        why: Wrong — s 30(2)(a) does require witnessing the victim being killed, injured or put in peril; Wicks does not remove that requirement, it clarifies that the "being put in peril" event can extend over time.
      - text: Because the officers were themselves physically injured during the rescue.
        why: Wrong — the officers' own physical safety during the rescue is not the basis given for satisfying s 30(2)(a); the reasoning turns on the survivors remaining in peril, not the officers' own injuries.
  - key: q130
    type: mcq
    concept: psychiatric-harm-civil-liability-act
    difficulty: 2
    stem: In what way does s 32 differ from the common law test in Tame, according to the material?
    options:
      - text: Section 32(1) expressly requires foreseeability to be judged against a person of normal fortitude, whereas Tame treated normal fortitude as merely one relevant consideration, not a fixed standard.
        correct: true
        why: Correct — the material specifically flags this as the point of difference, with the statute adopting normal fortitude as the express standard rather than one factor among several.
      - text: Section 32 abolishes any requirement of foreseeability entirely, unlike Tame.
        why: Wrong — s 32 still requires foreseeability (of a recognised psychiatric illness to a person of normal fortitude); it does not abolish foreseeability, it refines how it is assessed.
      - text: Section 32 applies only to claims by rescuers, whereas Tame applied to all plaintiffs, a factor courts have sometimes weighed in related but distinct areas of negligence, though this would need to be supported by clear evidence in the specific case.
        why: Wrong — s 32 is not limited to rescuers; it is the general duty test for mental harm claims under Part 3, applicable to any plaintiff, just like the common law test in Tame.
  - key: q131
    type: mcq
    concept: psychiatric-harm-civil-liability-act
    difficulty: 4
    contrasts-with: [psychiatric-harm-common-law-development]
    stem: A NSW plaintiff argues for a psychiatric harm duty relying only on Tame's foreseeability test, ignoring s 32. What is the strongest objection to this approach?
    options:
      - text: In NSW, s 32 controls the duty inquiry for mental harm and expressly requires foreseeability to be judged against a person of normal fortitude, so the analysis cannot simply stop at the common law test in Tame.
        correct: true
        why: Correct — the material treats s 32 as the governing NSW provision that modifies (not merely restates) the common law position, so an answer that ignores it is incomplete.
      - text: There is no objection, because s 32 and Tame are identical in every respect and either can be used interchangeably.
        why: Wrong — the material specifically identifies at least one difference (the express normal-fortitude standard in s 32(1)), so treating them as identical overlooks that distinction.
      - text: The objection is that Tame is no longer good law anywhere in Australia, having been completely overruled.
        why: Wrong — the material presents Tame as a foundational common law authority whose reasoning s 32 partly reflects and partly modifies, not as a case that has been overruled.
  - key: q132
    type: mcq
    concept: psychiatric-harm-civil-liability-act
    difficulty: 2
    stem: Which of these best summarises the order of analysis for a NSW mental-harm negligence problem, drawing on Wicks?
    options:
      - text: Apply s 32 (duty) first, then s 31 (recognised psychiatric illness), then, only for pure mental harm from shock, s 30 (scene-witness or close family member).
        correct: true
        why: Correct — this reflects the order Wicks establishes, with duty under s 32 addressed before the s 30(2) limitation, and s 31's illness requirement applying to all pure mental harm claims.
      - text: Apply s 30 first in every case, and only consider s 32 if the plaintiff fails to satisfy s 30.
        why: Wrong — this reverses the order Wicks lays down; s 32 (duty) must be considered before s 30(2) (the limitation on recovery), not the other way around.
      - text: Apply s 27 as a standalone test for liability, without needing to consider ss 30, 31 or 32 at all, which sounds like the kind of consideration a court might otherwise take into account.
        why: Wrong — s 27 only provides definitions used by the rest of Part 3; it cannot substitute for actually applying the duty test in s 32 and the other operative provisions.
  - key: q133
    type: mcq
    concept: psychiatric-harm-civil-liability-act
    difficulty: 1
    stem: What is the correct citation for Wicks v State Rail Authority (NSW) as given in the material?
    options:
      - text: "(2010) 241 CLR 60"
        correct: true
        why: Correct — this is the exact citation given in the material for Wicks v State Rail Authority (NSW).
      - text: "(2002) 211 CLR 317"
        why: Wrong — this citation belongs to Tame v New South Wales; Annetts v Australian Stations, not Wicks.
      - text: "(2000) 201 CLR 552"
        why: Wrong — this citation belongs to Agar v Hyde, the sport-injury case, not Wicks v State Rail Authority (NSW).
  - key: q134
    type: mcq
    concept: psychiatric-harm-civil-liability-act
    difficulty: 3
    stem: A person witnesses their spouse being pulled from a car wreck, badly injured, over the course of an hour-long extraction by emergency services. Applying Wicks, is the "witnessed at the scene" requirement in s 30(2)(a) likely satisfied?
    options:
      - text: Yes — Wicks confirms an event causing peril or injury can unfold over an extended period, so witnessing the ongoing extraction can satisfy s 30(2)(a) just as the officers' extended rescue efforts did.
        correct: true
        why: Correct application of Wicks — the reasoning that peril and injury need not begin and end in an instant applies just as much to a spouse witnessing a prolonged rescue as it did to the rescuer officers.
      - text: No — s 30(2)(a) only ever covers events that are complete within a few seconds.
        why: Wrong — this is precisely the narrow reading Wicks rejects; the Court held not every case of injury or peril begins and ends in an instant, and a series of shocking experiences over time can qualify.
      - text: No — because the spouse is a close family member, s 30(2)(a) does not apply to them at all, which could otherwise be relevant to a related cause of action on different facts, though the weight given to this would depend heavily on the tribunal of fact.
        why: Wrong — s 30(2) offers two alternative routes to recovery (scene-witnessing or close family membership); being a close family member does not disqualify a plaintiff from also relying on scene-witnessing, and in any event a spouse can independently satisfy either limb.
  - key: q135
    type: mcq
    concept: psychiatric-harm-civil-liability-act
    difficulty: 4
    stem: A rescue volunteer arrives at a landslide and spends several hours digging out survivors, some of whom die while trapped despite his efforts, before he later develops a recognised psychiatric illness. Which combination of provisions would most completely capture the relevant analysis?
    options:
      - text: Section 32 to establish the duty (foreseeability to a person of normal fortitude, given his role as a rescuer at the scene), section 31 to confirm the recognised-illness requirement, and section 30(2)(a) to confirm he witnessed victims being killed, injured or put in peril at the scene.
        correct: true
        why: Correct — this integrates all three operative provisions in the order Wicks prescribes, matching each to the relevant part of the volunteer's situation as a rescuer who witnessed victims over an extended period.
      - text: Only section 27, since it defines mental harm and no further sections are needed once a definition is established.
        why: Wrong — s 27 supplies definitions only; it cannot resolve duty (s 32), the recognised-illness requirement (s 31), or the scene-witnessing limitation (s 30) on its own.
      - text: Only section 30, since the volunteer is a rescuer and rescuers are covered exclusively by that section.
        why: Wrong — s 30 is a limitation on recovery once a duty is found; it does not itself establish the duty (which requires s 32) or the recognised-illness requirement (s 31), so relying on it alone is incomplete.
  - key: q136
    type: mcq
    concept: psychiatric-harm-civil-liability-act
    difficulty: 2
    stem: Which of the following did the High Court in Wicks say about how s 32(1) is drafted?
    options:
      - text: It is cast negatively — a duty "is not to be found unless a condition is satisfied."
        correct: true
        why: Correct — this is a direct quotation from the material describing the negative drafting style of s 32(1), which the Court emphasised as significant to its interpretation.
      - text: It is cast as an irrebuttable presumption of duty in every mental harm case, a standard that appears in some analogous areas of civil liability.
        why: Wrong — this is the opposite of the negative drafting the Court actually identified; s 32(1) sets a condition that must be satisfied before a duty is found, not a presumption in the plaintiff's favour.
      - text: It only applies to claims brought by government employees.
        why: Wrong — nothing in the material limits s 32 to government employees; it is the general duty provision for mental harm claims under Part 3, whoever the plaintiff or defendant may be.
  - key: q137
    type: short
    concept: psychiatric-harm-civil-liability-act
    difficulty: 4
    prompt: |
      Using Wicks v State Rail Authority (NSW), explain the correct order of analysis for a NSW psychiatric harm
      claim under ss 30–32 of the Civil Liability Act, and why that order matters.
    model: |
      Wicks v State Rail Authority (NSW) establishes the correct order of analysis for a psychiatric harm claim
      under Part 3 of the Civil Liability Act, and explains why getting that order wrong risks reading one
      provision divorced from its statutory context. Two police officers attended the scene of the Waterfall
      train derailment, where State Rail had admitted negligence, and after spending several hours assisting the
      injured, both later suffered psychiatric injury. At first instance and on appeal, the case had been treated
      as turning entirely on s 30(2)(a) — whether the officers had "witnessed, at the scene, the victim being
      killed, injured or put in peril." The High Court held this approach skipped an important anterior question:
      section 32 defines or controls what would otherwise be a duty of care arising at common law, and so it must
      be considered before the limitation in s 30(2), because s 30 only becomes relevant once a relevant duty of
      care has actually been found to exist. Applying that order here, s 32(1) asks whether the defendant ought
      to have foreseen that a person of normal fortitude might, in the circumstances of the case, suffer a
      recognised psychiatric illness if reasonable care were not taken, having regard to the four circumstances in
      s 32(2): whether the harm resulted from a sudden shock, whether the plaintiff witnessed the victim being
      killed, injured or put in peril at the scene, the plaintiff's relationship to the victim, and any
      pre-existing relationship between plaintiff and defendant. Once a duty is established, s 31 requires that
      the harm consist of a recognised psychiatric illness before any damages can be awarded for pure mental harm.
      Only then does s 30(2) become relevant, limiting recovery for pure mental harm arising from shock to
      plaintiffs who witnessed the victim being killed, injured or put in peril at the scene, or who are a close
      member of the victim's family. On the facts, the High Court held the officers did witness victims being
      injured or put in peril at the scene, because the survivors of the derailment remained in peril until they
      had been rescued to safety — it would be wrong to confine "being put in peril" to the instant of the
      derailment itself, since not every such event begins and ends in a moment. The order matters because
      analysing s 30(2) first, in isolation, risks treating a limitation on an existing duty as though it were the
      test for whether a duty exists at all; applying s 32 first keeps the focus on foreseeability as the true
      basis of the duty, with ss 30 and 31 operating only as further constraints once that duty has already been
      established.
    rubric:
      - id: r1
        criterion: States the facts of Wicks accurately.
        marks: 2
        top-band: Accurately summarises the derailment, the officers' rescue efforts, and their later psychiatric injury.
        margin-note: Clear factual foundation.
        authorities: []
      - id: r2
        criterion: Correctly states the order of analysis (s 32 before s 30, with s 31 also addressed).
        marks: 3
        top-band: Clearly and correctly sequences all three provisions and explains why s 32 comes first.
        margin-note: This is the central point of the question — reward precision here.
        authorities: [civil-liability-act-2002-nsw-s30, civil-liability-act-2002-nsw-s31, civil-liability-act-2002-nsw-s32]
      - id: r3
        criterion: Explains why the order matters (avoiding reading s 30 divorced from the anterior duty question).
        marks: 3
        top-band: Clearly explains the risk of skipping the duty question, using the Court's own reasoning.
        margin-note: Good use of the Court's own words on statutory context.
        authorities: []
      - id: r4
        criterion: Explains the broad reading of "put in peril" over an extended event.
        marks: 2
        top-band: Clearly explains why the officers satisfied s 30(2)(a) despite arriving after the derailment itself.
        margin-note: Nice application of the extended-peril reasoning.
        authorities: []
  # quickfire (set: quickfire) for concept 7
  - key: q138
    type: truefalse
    set: quickfire
    concept: psychiatric-harm-civil-liability-act
    statement: Section 31 of the Civil Liability Act requires that pure mental harm consist of a recognised psychiatric illness before damages can be recovered.
    answer: true
    why: True — s 31 states there is no liability to pay damages for pure mental harm resulting from negligence unless it consists of a recognised psychiatric illness.
  - key: q139
    type: truefalse
    set: quickfire
    concept: psychiatric-harm-civil-liability-act
    statement: In Wicks v State Rail Authority (NSW), the High Court held that s 30(2) must be considered before s 32.
    answer: false
    why: False — the Court held the opposite, that s 32 (which controls whether a duty of care arises) must be considered before the s 30(2) limitation.
  - key: q140
    type: truefalse
    set: quickfire
    concept: psychiatric-harm-civil-liability-act
    statement: Section 32(2) of the Civil Liability Act lists whether the plaintiff witnessed the victim at the scene as one of the circumstances relevant to foreseeability.
    answer: true
    why: True — s 32(2)(b) lists whether the plaintiff witnessed, at the scene, a person being killed, injured or put in peril as one of the four relevant circumstances.

