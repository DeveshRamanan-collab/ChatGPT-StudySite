        why: Correct — this is precisely how the material describes their treatment of normal fortitude, as an aid to the foreseeability inquiry, not an independent bar to recovery.
      - text: It is a strict rule that no plaintiff of below-average emotional resilience can ever recover damages, a standard that appears in some analogous areas of civil liability, which a careful advocate might raise as a subsidiary point in argument.
        why: Wrong — this misstates the point; normal fortitude is used to assess foreseeability, and is not framed as an absolute bar excluding more vulnerable plaintiffs.
      - text: It applies only to defendants, never to plaintiffs, in assessing psychiatric harm claims.
        why: Wrong — normal fortitude in this context is squarely about assessing what harm to a plaintiff (or a person in the plaintiff's position) is reasonably foreseeable, not about the defendant's own characteristics.
