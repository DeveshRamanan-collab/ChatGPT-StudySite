      - text: No — the common law has always required a single sudden shocking event, and Tame/Annetts did not change this.
        why: Wrong — this misstates the material, which describes Tame/Annetts as expressly rejecting "sudden shock" as a pre-condition, a change from earlier, more rigid approaches.
      - text: No — sudden shock is required by the Civil Liability Act in every Australian jurisdiction, so the student's argument fails regardless of the common law.
