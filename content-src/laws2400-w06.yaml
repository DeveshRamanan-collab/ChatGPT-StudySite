cards:
  - type: basic
    concept: duty-of-care-categories-and-factors
    front: What three kinds of harm does the lecture list as possible results of breaching a potential duty of care?
    back: Physical harm, psychiatric harm, and pure economic loss.
    source: Topic 6 Lecture 1, slide 4
  - type: basic
    concept: duty-of-care-categories-and-factors
    front: Under "who is the defendant?", which three special relationships does the slide give as examples?
    back: Occupier and entrant, employer and employee, and manufacturer and consumer.
    source: Topic 6 Lecture 1, slide 7
  - type: cloze
    concept: duty-of-care-categories-and-factors
    text: "Courts weigh three groups of factors: how the harm was caused (act or {{c1::omission}}), who the defendant is (private individual or {{c2::public authority}}), and the {{c3::nature}} of the harm."
    source: Topic 6 Lecture 1, slides 6-8
  - type: apply
    concept: duty-of-care-categories-and-factors
    scenario: A council fails to trim a tree branch that later falls and injures a passer-by.
    answer: This is an omission by a public authority causing physical harm — classify all three factors before analysing breach.
    source: Topic 6 Lecture 1, slides 6-8
  - type: basic
    concept: omissions-and-control-of-others
    front: What four factors does Hargrave v Goldman identify as relevant to an omission-based duty of care?
    back: Reasonable foreseeability, the occupier-neighbour special relationship, the defendant's knowledge of the danger, and control over it.
    source: Topic 6 Lecture 1, slide 10
  - type: basic
    concept: omissions-and-control-of-others
    front: What was the basis of the occupier's duty regarding the state of the premises, according to Gleeson CJ in Modbury Triangle v Anzil?
    back: "Control over, and knowledge of, the state of the premises."
    source: Topic 6 Lecture 1, slide 23
  - type: cloze
    concept: omissions-and-control-of-others
    text: "In {{c1::Modbury Triangle Shopping Centre v Anzil}}, the shopping centre had control over its car park lighting but no control over the {{c2::criminals}} who attacked Anzil, so its duty did not extend to their conduct."
    source: Topic 6 Lecture 1, slides 22-25
  - type: basic
    concept: omissions-and-control-of-others
    front: Under s 56 CLA, who counts as a "good samaritan"?
    back: A person who, in good faith and without expectation of payment or other reward, comes to the assistance of a person who is apparently injured or at risk of being injured.
    source: Topic 6 Lecture 1, slide 19
  - type: apply
    concept: omissions-and-control-of-others
    scenario: An off-duty paramedic stops to help a stranger who has collapsed, and her assistance is mildly negligent but she created no part of the original risk.
    answer: She is likely a good samaritan under s 56 and protected by s 57, since none of the s 58 exclusions (creating the risk, or impairment) apply.
    source: Topic 6 Lecture 1, slides 19-20
  - type: basic
    concept: occupiers-liability-and-obvious-risk
    front: In Romeo v Conservation Commission (NT), what did the High Court hold about the Commission's duty to fence the cliff?
    back: The Commission owed a duty of care to entrants, but that duty did not extend to fencing off an obvious natural danger like the cliff.
    source: Topic 6 Lecture 1, slide 11
  - type: basic
    concept: occupiers-liability-and-obvious-risk
    front: What did Kirby J say the "critical question" commonly is, once a duty of care of some kind is established?
    back: "The measure or scope of that duty."
    source: Topic 6 Lecture 1, slide 13
  - type: cloze
    concept: occupiers-liability-and-obvious-risk
    text: "Section {{c1::5F}} CLA defines an obvious risk objectively; s {{c2::5G}} presumes the plaintiff was aware of it; s {{c3::5H}} removes the duty to warn of it."
    source: Topic 6 Lecture 1, slides 16-17
  - type: apply
    concept: occupiers-liability-and-obvious-risk
    scenario: A lookout has a sheer, clearly visible unfenced drop, and a visitor climbs over a low barrier for a photo and falls.
    answer: Applying Romeo and s 5H, the danger was obvious, so the occupier's duty did not extend to further fencing or warning.
    source: Topic 6 Lecture 1, slides 11-17
  - type: basic
    concept: product-liability-duty-of-care
    front: Before Donoghue v Stevenson, what duty existed for the owner of "dangerous things"?
    back: A duty to take reasonable precautions to ensure such things did not fall into the hands of third parties and cause harm.
    source: Topic 6 Lecture 1, slide 27
  - type: basic
    concept: product-liability-duty-of-care
    front: In Graham Barclay Oysters v Ryan, what did the High Court hold about Graham Barclay's duty of care?
    back: Graham Barclay did owe consumers a duty of care, but that duty was not breached.
    source: Topic 6 Lecture 1, slide 30
  - type: cloze
    concept: product-liability-duty-of-care
    text: "Gummow and Hayne JJ held that the {{c1::degree of probability}} of the contamination risk did not justify the {{c2::difficult, expensive and inconvenient}} action the consumers argued for."
    source: Topic 6 Lecture 1, slide 31
  - type: apply
    concept: product-liability-duty-of-care
    scenario: A food producer knows of a rare, scientifically unavoidable trace contaminant that would cost millions to filter for a tiny risk reduction.
    answer: As in Graham Barclay Oysters, foreseeability of the risk does not itself establish breach — weigh the probability against the cost of elimination.
    source: Topic 6 Lecture 1, slides 29-31
  - type: basic
    concept: sport-and-recreational-injury
    front: In Rootes v Shelton, what did the High Court hold about the boat driver's duty to the water-skier?
    back: The boat driver owed Rootes a duty of care, which was breached by the observer's failure to warn of the stationary boat.
    source: Topic 6 Lecture 2, slide 5
  - type: basic
    concept: sport-and-recreational-injury
    front: What did the High Court decide in Agar v Hyde about the rugby board's duty to change the rules?
    back: No such duty was owed — the risk was inherent to an obviously dangerous sport, and the answer is very fact-specific.
    source: Topic 6 Lecture 2, slide 7
  - type: cloze
    concept: sport-and-recreational-injury
    text: "Section {{c1::5L}} CLA removes liability for harm from an obvious risk of a dangerous recreational activity; s {{c2::5M}} removes the duty of care once a risk {{c3::warning}} has been given."
    source: Topic 6 Lecture 2, slides 9-10
  - type: apply
    concept: sport-and-recreational-injury
    scenario: A cricket batter is struck by a fast, lawfully bowled delivery within the rules of the game.
    answer: This is an inherent risk of the sport under Rootes v Shelton, unlike a separate failure to warn — no duty is likely to arise.
    source: Topic 6 Lecture 2, slides 5-6
  - type: basic
    concept: psychiatric-harm-common-law-development
    front: According to Gummow and Kirby JJ in Tame/Annetts, are normal fortitude, sudden shock and direct perception preconditions to liability for psychiatric harm?
    back: No — none of the three is a pre-condition to liability for negligently inflicted psychiatric harm.
    source: Topic 6 Lecture 2, slide 17
  - type: basic
    concept: psychiatric-harm-common-law-development
    front: Why did the High Court hold the police officer owed Mrs Tame no duty of care?
    back: Because it was not reasonably foreseeable that a person in her position would suffer a recognised psychiatric illness from a corrected, apologised-for error.
    source: Topic 6 Lecture 2, slide 14
  - type: cloze
    concept: psychiatric-harm-common-law-development
    text: "In {{c1::Annetts v Australian Stations}}, a duty was owed because the relationship between the parties, coupled with {{c2::reasonable foreseeability}}, arose from the employer's broken promise to supervise the boy."
    source: Topic 6 Lecture 2, slide 14
  - type: apply
    concept: psychiatric-harm-common-law-development
    scenario: A witness develops a diagnosed psychiatric illness after a slow-building series of distressing events, with no single sudden shock.
    answer: Under Tame/Annetts, the absence of a single sudden shock does not defeat the claim — sudden shock is only one relevant consideration, not a precondition.
    source: Topic 6 Lecture 2, slides 15-17
  - type: basic
    concept: psychiatric-harm-civil-liability-act
    front: How does s 27 CLA define "mental harm"?
    back: Impairment of a person's mental condition.
    source: Topic 6 Lecture 2, slide 19
  - type: basic
    concept: psychiatric-harm-civil-liability-act
    front: What does s 32(1) CLA require before a defendant owes a duty to avoid causing mental harm?
    back: The defendant must have ought to have foreseen that a person of normal fortitude might suffer a recognised psychiatric illness if reasonable care were not taken.
    source: Topic 6 Lecture 2, slide 23
  - type: cloze
    concept: psychiatric-harm-civil-liability-act
    text: "In {{c1::Wicks v State Rail Authority (NSW)}}, the High Court held that s {{c2::32}} (duty) must be considered before s {{c3::30}}(2) (the limitation on recovery)."
    source: Topic 6 Lecture 2, slide 25
  - type: apply
    concept: psychiatric-harm-civil-liability-act
    scenario: Rescuers spend several hours assisting survivors of a train derailment before developing a recognised psychiatric illness.
    answer: Applying Wicks, they can satisfy s 30(2)(a) because survivors remained "in peril" until rescued — the event need not begin and end in an instant.
    source: Topic 6 Lecture 2, slides 24-27
  - type: basic
    concept: psychiatric-harm-civil-liability-act
    front: What four circumstances does s 32(2) CLA list as relevant to foreseeability of mental harm?
    back: Sudden shock, witnessing the victim killed/injured/put in peril at the scene, the plaintiff's relationship to the victim, and any pre-existing relationship with the defendant.
    source: Topic 6 Lecture 2, slide 23

audio:
  title: "Week 6 recap — duty of care: categories of harm"
  minutes: 3
  script: |
    This week is about the factors that push a fact pattern into, or out of, an accepted category of duty of
    care. We start with a three-part checklist: how the harm was caused, whether by an act or an omission; who
    the defendant is, a private individual or a public authority, and whether there's a special relationship
    like occupier and entrant; and what kind of harm resulted, physical, psychiatric, or pure economic loss.
    Getting this classification right tells us which rules and which part of the Civil Liability Act to reach
    for next.

    Omissions need more than foreseeability. Hargrave v Goldman adds a special relationship, knowledge of the
    danger, and control over it. Control does most of the work: in Modbury Triangle Shopping Centre v Anzil,
    the shopping centre controlled its car park lighting but not the criminals who attacked Anzil there, so its
    duty didn't extend that far. We also met the good samaritan provisions, sections 55 to 58, which protect
    someone who helps in good faith unless they caused the risk themselves.

    Occupiers get their own obvious-risk rules. Romeo v Conservation Commission says duty isn't owed in the
    abstract — the real question is its scope, and there's no duty to warn of an obvious danger like an
    unfenced cliff. Sections 5F, 5G and 5H codify this: obvious risk is judged objectively, the plaintiff is
    presumed aware of it, and there's no proactive duty to warn. Product liability picks up the same cost-benefit
    thinking: in Graham Barclay Oysters, the risk of contaminated oysters was foreseeable, but eliminating it
    entirely wasn't a reasonable response given the cost.

    Sport gets its own version of the same idea. Rootes v Shelton separates the inherent risk of a sport from a
    distinct failure of care, like the observer's failure to warn of a stationary boat. Agar v Hyde shows a duty
    won't extend to a remote regulatory body just because a sport is inherently dangerous. Sections 5L and 5M
    give dangerous recreational activities their own liability shield, and a risk warning removes the duty
    altogether.

    Finally, psychiatric harm. Tame and Annetts, decided together, killed off the old control mechanisms —
    normal fortitude, sudden shock, direct perception — as fixed preconditions, leaving foreseeability of a
    recognised illness as the real test. For NSW cases, section 32 now sets that duty test, section 31 needs a
    recognised illness, and section 30 limits pure mental harm from shock to scene-witnesses and close family.
    Wicks tells us to apply section 32 before section 30, and that peril from something like a train derailment
    can stretch out over time, not just an instant.
