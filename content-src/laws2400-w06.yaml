  - key: q107
    type: mcq
    concept: psychiatric-harm-common-law-development
    difficulty: 2
    stem: In a case of "pure" psychiatric harm, what must the plaintiff show, according to the material?
    options:
      - text: That it was reasonably foreseeable that a person in the plaintiff's position would suffer psychiatric harm, and that the injury is a recognised form of psychiatric harm.
        correct: true
        why: Correct — the material states both requirements together for pure psychiatric harm cases, foreseeability and a recognised form of psychiatric injury.
      - text: That the plaintiff suffered a broken bone at the same time as the psychiatric injury.
        why: Wrong — pure psychiatric harm is, by definition, harm not consequent on a separate physical injury such as a broken bone; requiring one would contradict the very idea of "pure" psychiatric harm.
      - text: That the defendant intended to cause the plaintiff psychiatric harm.
        why: Wrong — this is a negligence claim, which does not require intention; the material's requirements are foreseeability and a recognised form of psychiatric harm, not intent.
