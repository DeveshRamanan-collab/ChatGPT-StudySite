  # ---------- Concept 6: psychiatric-harm-common-law-development ----------
  - key: q101
    type: mcq
    concept: psychiatric-harm-common-law-development
    difficulty: 1
    stem: What did Gummow and Kirby JJ conclude about the three "control mechanisms" (normal fortitude, sudden shock, direct perception) in Tame v New South Wales; Annetts v Australian Stations?
    options:
      - text: None of them is a pre-condition to liability for negligently inflicted psychiatric harm.
        correct: true
        why: Correct — this is their exact conclusion; the three mechanisms are relevant considerations, not fixed pre-conditions that must be satisfied before a duty can be found.
      - text: All three are absolute pre-conditions that must be proven before any psychiatric harm claim can succeed.
        why: Wrong — this is the opposite of Gummow and Kirby JJ's actual conclusion, which rejects treating any of the three mechanisms as a fixed pre-condition.
      - text: Only "sudden shock" is a pre-condition; the other two are irrelevant to psychiatric harm claims.
        why: Wrong — Gummow and Kirby JJ rejected all three mechanisms as pre-conditions, not just two of them, and none of the three is dismissed as wholly irrelevant either.
  - key: q102
    type: mcq
    concept: psychiatric-harm-common-law-development
    variant-of: q101
    difficulty: 2
    stem: A plaintiff develops a recognised psychiatric illness after learning, over several months and through several phone calls rather than a single sudden event, that a family member has died. Applying Tame/Annetts reasoning, does the lack of a single "sudden shock" automatically defeat the claim?
    options:
      - text: No — sudden shock is only one relevant consideration bearing on foreseeability, not a fixed pre-condition for liability.
        correct: true
        why: Correct — Gummow and Kirby JJ held that "sudden shock" is not a necessary pre-condition, so the absence of one incident of sudden shock does not automatically defeat a claim.
      - text: Yes — without a single sudden shocking event, a psychiatric harm claim can never succeed at common law, which would still need to be established on the facts before any liability could follow.
        why: Wrong — this treats sudden shock as an absolute pre-condition, which is exactly what Tame/Annetts rejects.
      - text: Yes, because only physical injuries can ever be recovered without a sudden shock.
        why: Wrong — this conflates the psychiatric harm rules with physical injury rules, and misstates the actual holding, which allows recovery for psychiatric harm without sudden shock.
  - key: q103
    type: mcq
    concept: psychiatric-harm-common-law-development
    difficulty: 2
    stem: In Tame v New South Wales, why did the High Court hold the police officer owed Mrs Tame no duty of care?
    options:
      - text: It was not reasonably foreseeable that a person in her position would suffer a recognised psychiatric illness from an error that had been corrected and apologised for; her reaction was extreme and idiosyncratic.
        correct: true
        why: Correct — this is exactly the reasoning the material gives for the outcome in Tame, focusing on the lack of reasonable foreseeability given the corrected, apologised-for error.
      - text: Because psychiatric harm can never be recovered against a police officer under any circumstances.
        why: Wrong — the case does not create any blanket immunity for police officers; it turns on the specific facts and the lack of foreseeability, not on the defendant's occupation.
      - text: Because Mrs Tame failed to file her claim within the relevant limitation period.
        why: Wrong — limitation periods are not mentioned anywhere in the material's discussion of Tame; the case turns on the substantive duty-of-care analysis.
  - key: q104
    type: mcq
    concept: psychiatric-harm-common-law-development
    difficulty: 2
    stem: In Annetts v Australian Stations Pty Ltd, why did the High Court hold the employer did owe the parents a duty of care?
    options:
      - text: The relationship between the parties, coupled with reasonable foreseeability, gave rise to the duty, given the employer's broken promise to supervise the 16-year-old.
        correct: true
        why: Correct — this reflects exactly the reasoning given in the material, where the pre-existing relationship (the parents' inquiries and the employer's assurance) plus foreseeability grounded the duty.
      - text: Because a sudden shock always creates a duty of care regardless of any other consideration.
        why: Wrong — this treats sudden shock as decisive, which is contrary to the material's own point that sudden shock and direct perception were not required in Annetts.
      - text: Because the employer had insured against psychiatric harm claims in its workers' compensation policy, though this would need to be supported by clear evidence in the specific case.
        why: Wrong — insurance arrangements are not mentioned in the material's account of why a duty was found in Annetts; the reasoning turns on relationship and foreseeability.
  - key: q105
    type: mcq
    concept: psychiatric-harm-common-law-development
    difficulty: 3
    stem: Tame and Annetts reached opposite outcomes despite applying the same foreseeability test. What best explains the difference?
    options:
      - text: In Tame, the plaintiff's reaction to a corrected error was extreme and idiosyncratic (not reasonably foreseeable); in Annetts, a pre-existing relationship and a broken promise of supervision made the parents' psychiatric harm reasonably foreseeable.
        correct: true
        why: Correct — this captures the key factual distinction the material draws between the two cases, both decided under the same general test.
      - text: Tame was decided under the common law and Annetts was decided under the Civil Liability Act, so different tests applied, which sounds like the kind of consideration a court might otherwise take into account, a rule that would need to be read together with the general principles of negligence.
        why: Wrong — both cases are common law decisions of the High Court decided together in 2002; neither turns on the Civil Liability Act, which this week's material treats as a later development.
      - text: Annetts succeeded only because the parents were physically present when their son died, unlike Mrs Tame.
        why: Wrong — the material makes clear the parents in Annetts were not directly present; their claim succeeded despite the lack of direct perception, which the Court expressly rejected as a pre-condition.
