week_file:
  topic: "Duty of care: categories of harm"
  summary: |-
    This week examines the factors courts weigh once a case is fitted into an established category of duty of
    care, across three kinds of harm: physical harm caused by act or omission, harm from defective products,
    and psychiatric harm. Physical-harm cases turn on whether the defendant created or merely failed to abate
    a danger, whether they had knowledge and control of the risk, and whether the danger was obvious to
    entrants; psychiatric-harm cases turn on reasonable foreseeability of a recognised psychiatric illness to a
    person of normal fortitude, now channelled through the Civil Liability Act's Part 3 provisions. For the
    exam, ILAC answers on these categories turn on correctly classifying the relationship — occupier and
    entrant, sporting co-participant, product manufacturer, rescuer — and then running the right statutory
    overlay (obvious risk in ss 5F–5H, recreational activities in ss 5L–5M, or mental harm in ss 27–33) against
    the common law test.
  notes: |
    ## 1. Overview

    This week we look at various characteristics which have a bearing on whether a given case falls within one
    of the accepted categories of duty of care. We analyse physical harm — including product liability and
    sport injuries — and psychiatric harm, and consider the effect of the Civil Liability Act throughout.

    ## 2. Duty of care and types of harm

    Breach of a potential duty of care may result in a variety of harms: physical harm, psychiatric harm, and
    pure economic loss. However, not all of these harms are legally recognised in the same way — courts
    consider a number of factors to determine whether a case falls within an accepted category of harm or not.

    :::rule
    Three groups of factors recur. How was the harm caused — by an act or an omission, and should "words" be
    treated differently from "acts"? Who is the defendant — a private individual or a public authority, and is
    there a special relationship between plaintiff and defendant, such as occupier and entrant, employer and
    employee, or manufacturer and consumer? What is the nature of the harm — physical injury, psychiatric harm,
    or pure economic loss?
    :::

    ## 3. Physical harm caused by act and omission

    Physical harm caused by an act is regarded as the typical case in negligence, but the distinction between
    acts and omissions may not always be clear — was the harm caused by an act or an omission in *Donoghue* and
    *Grant*? Where the physical harm is caused by an omission, more than reasonable foreseeability is required
    to establish a duty of care.

    :::case
    *Hargrave v Goldman* (1963) 110 CLR 40 — lightning struck a red gum tree on the defendant's Western
    Australian farm; the defendant had the tree felled but left the fire to burn itself out; the weather turned,
    the fire revived and spread to the plaintiff's neighbouring properties. The relevant factors for a duty
    based on an omission were reasonable foreseeability, the occupier-neighbour special relationship, the
    defendant's knowledge of the danger, and their control over it.
    :::

    ### Occupiers, obvious risk and the scope of duty

    :::case
    *Romeo v Conservation Commission (NT)* (1998) 192 CLR 431 — Romeo and a friend had gone to a beach party at
    a Reserve managed by the Commission; Romeo fell from a cliff in suburban Darwin and became paraplegic,
    arguing that the accident happened because the Commission had failed to fence off the reserve from the
    cliff. The High Court, by majority, held that the duty of care did not extend to erecting a fence along the
    coastline.
    :::

    Toohey and Gummow JJ observed that the Commission "was under a general duty to take reasonable steps to
    prevent persons entering the Reserve from suffering injury. But the taking of such steps did not extend to
    fencing off an area of natural beauty where the presence of a cliff was obvious." The nature of the danger
    should be "assessed before the event according to its obviousness and the care ordinarily exercised by the
    public" (adopting Brennan J's test from *Nagle*). Kirby J, part of the majority, noted that foreseeability
    and proximity were satisfied, but "it is one thing to hold that a person owes a duty of care of some kind to
    another. But the critical question is commonly the measure or scope of that duty." *Romeo* matters for three
    reasons: duty of care is not owed in the abstract in practice; the question of the scope of the duty borders
    between the elements of duty and its breach; and there is a distinction between an obvious and a concealed
    risk — there is no duty to warn of an obvious risk.

    :::statute
    Section 5F CLA defines an "obvious risk" as one that would have been obvious, in the circumstances, to a
    reasonable person in the plaintiff's position; obvious risks include those that are patent or a matter of
    common knowledge, and a risk can be obvious even though it has a low probability of occurring or is not
    prominent, conspicuous or physically observable.
    :::

    :::statute
    Section 5G presumes an injured person was aware of an obvious risk unless they prove, on the balance of
    probabilities, that they were not. Section 5H provides that a defendant does not owe a duty to warn of an
    obvious risk — unless the plaintiff requested advice about the risk, a written law requires a warning, or
    the defendant is a professional and the risk is one of death or personal injury from a professional service.
    :::

    ### No duty to rescue, and duties over the conduct of others

    Generally, there is no legal duty to rescue: the High Court held that police did not owe a duty of care to a
    person apparently preparing to take his own life (*Stuart v Kirkland-Veenstra* (2009)).

    :::statute
    Sections 55–58 CLA protect "Good Samaritans". Section 56 defines a good samaritan as a person who, in good
    faith and without expectation of payment or other reward, comes to the assistance of a person who is
    apparently injured or at risk of being injured. Section 57 removes liability for acts or omissions done in
    an emergency when assisting such a person. The protection does not apply if the good samaritan created the
    risk, or was under the influence of alcohol or a drug (s 58(1)–(2)).
    :::

    In certain situations a person may be liable for failing to exercise care over the conduct of others who
    cause harm to the plaintiff — for example, parents' failure to control their children's conduct may entail
    liability, and the *Dorset Yacht* case also illustrates this. An occupier of land also owes a duty of care to
    persons lawfully on the land, including a duty to take reasonable care to protect them from the conduct of
    third parties.

    :::case
    *Modbury Triangle Shopping Centre v Anzil* (2000) 205 CLR 254 — Anzil, an employee of a video shop in the
    centre, was attacked by unknown assailants at 10.30pm while walking to his car after the car park lights
    (usually left on until 11pm) had gone off on their 10pm timer. The High Court, by majority, held that the
    shopping centre's duty of care "as an occupier of land did not extend to taking reasonable care to prevent
    physical injury to [Anzil] resulting from the criminal behaviour of third parties on that land."
    :::

    Gleeson CJ said the basis of an occupier's duty over the state of the premises was "control over, and
    knowledge of, the state of the premises"; here, unlike *Dorset Yacht*, the defendant had no control over the
    men who attacked Anzil, and neither reliance nor an assumption of responsibility could found a duty —
    responsibility for lighting the car park did not extend to a responsibility to protect Anzil from criminals
    in it. Gleeson CJ nonetheless observed that a duty to take reasonable steps might arise where criminal
    conduct has a high degree of foreseeability and predictability.

    ## 4. Product liability

    The duty of care may arise in relation to the manufacture, distribution and consumption of goods. Until
    *Donoghue v Stevenson*, the owner of "dangerous things" had a duty to take reasonable precautions to keep
    them from third parties, but no such duty existed for non-dangerous things; after *Donoghue* and *Grant*,
    the ordinary principles of negligence became the basis for liability for defective products, alongside
    contract, sale of goods, and consumer-protection legislation (the Australian Consumer Law).

    :::case
    *Graham Barclay Oysters v Ryan* (2002) 211 CLR 540 — consumers became ill with Hepatitis A after eating
    oysters grown and distributed by the defendant from a NSW lake; the virus came from faecal contamination
    after a storm, and the "depuration" process used only reduced, but did not eliminate, the viral load. The
    trial judge found all defendants (the grower, the local council and the NSW government) had breached a duty
    of care; the High Court, by majority, held that the NSW government did not owe a duty of care, and that
    although the grower did owe a duty, it was not breached.
    :::

    Gummow and Hayne JJ observed that while a risk of injury to oyster consumers was reasonably foreseeable, it
    was not possible "to eliminate entirely the risk of contamination of oysters"; despite the significant
    magnitude of the risk, "the degree of probability of its occurrence" did not justify the "difficult,
    expensive and inconvenient alleviating action" the consumers argued for.

    ## 5. Sport and recreation injury

    The duty of care question arises frequently in sport and recreational activities, and may be owed to fellow
    players, spectators, coaches or administrators.

    :::case
    *Rootes v Shelton* (1967) 116 CLR 383 — Rootes, an experienced water-skier, was performing a "crossover" on
    the Macquarie River when he collided with a stationary boat after being briefly blinded by spray, and the
    towing boat's observer had failed to warn skiers of the obstacle. The High Court held that the boat driver
    owed Rootes a duty of care and that the duty had been breached.
    :::

    Barwick CJ: "By engaging in a sport or pastime, the participants may be held to have accepted risks which
    are inherent in that sport or pastime … but this does not eliminate all duty of care of the one participant
    to the other. Whether or not such a duty arises and, if it does, its extent, must necessarily depend in each
    case upon its own circumstances." The key question is distinguishing an inherent risk of the sport from a
    separate failure of duty of care, on all the circumstances of the case.

    :::case
    *Agar v Hyde* (2000) 201 CLR 552 — two rugby players injured in a scrum argued that the International Rugby
    Football Board owed them a duty to monitor and change the rules of the game to reduce "unnecessary risk" to
    players. The High Court rejected the argument: no such duty was owed.
    :::

    Gleeson CJ asked: "The game is based on activities … which, by the standards of most members of the
    community, are obviously dangerous. … What is an unnecessary risk in an inherently dangerous sport?" The
    answer, the Court found, is very fact-specific.

    :::statute
    Division 5 of Part 1A CLA deals with recreational activities. Section 5L provides that a defendant "is not
    liable in negligence for harm suffered by another person … as a result of the materialisation of an obvious
    risk of a dangerous recreational activity engaged in by the plaintiff." Section 5M provides that a defendant
    "does not owe a duty of care to another person who engages in a recreational activity … to take care in
    respect of a risk of the activity if the risk was the subject of a risk warning" to the plaintiff.
    :::

    ## 6. Psychiatric harm

    Compensation may now be recovered for psychiatric harm — a harm traditionally labelled "nervous shock" and
    not recoverable. It may arise following a physical injury to oneself, after exposure to a situation of
    danger creating fear for oneself or a relative, after seeing or hearing a relative killed in an accident, or
    after a rescuer witnesses a horrific scene. In cases of pure psychiatric harm, the plaintiff must show it was
    reasonably foreseeable that a person in their position would suffer psychiatric harm, and that the injury is
    a recognised form of psychiatric harm.

    :::case
    *Tame v New South Wales; Annetts v Australian Stations Pty Ltd* (2002) 211 CLR 317 — Tame: a police officer
    mistakenly recorded Mrs Tame's blood alcohol reading as 0.14 rather than nil; although corrected within
    weeks, her solicitor told her of the mistake over a year later and she developed psychotic depression.
    Annetts: the Annetts let their 16-year-old son work as a jackaroo only after the employer promised constant
    supervision; he was sent to work alone, went missing, and died of dehydration in the desert. The High Court
    held the police officer did not owe Mrs Tame a duty of care (her psychiatric injury was not reasonably
    foreseeable, and coherence with the officer's other duties told against one), but that Australian Stations
    did owe the Annetts a duty of care — the relationship between the parties, coupled with reasonable
    foreseeability, gave rise to it, given the employer's broken promise to supervise a 16-year-old.
    :::

    Gleeson CJ noted that the control mechanisms of "sudden shock" and "direct perception or immediate
    aftermath" did not help decide either case. Gummow and Kirby JJ identified three control mechanisms — harm
    assessed against a hypothetical person of normal fortitude, a requirement of sudden shock, and a requirement
    of direct perception of the event or its immediate aftermath — and held that these are unsound and "not a
    pre-condition to liability for negligently inflicted psychiatric harm." They critically examined four
    reasons commonly given for treating psychiatric harm differently from physical harm: it is less objectively
    observable; litigation over it may disincentivise rehabilitation; it risks indeterminate liability; and it
    may impose an unreasonable or disproportionate burden on defendants.

    :::examtip
    The position at common law in *Tame* has since been modified for NSW cases by CLA ss 30–32 — see below.
    :::

    ### The Civil Liability Act and mental harm

    :::statute
    Part 3 CLA deals with mental harm. Section 27 defines "mental harm" as "impairment of a person's mental
    condition"; "consequential mental harm" is mental harm that is a consequence of a personal injury of any
    other kind, and "pure mental harm" is mental harm that is not consequential.
    :::

    :::statute
    Section 30 limits recovery for pure mental harm arising from shock: the plaintiff is not entitled to recover
    unless they witnessed, at the scene, the victim being killed, injured or put in peril, or are a close member
    of the victim's family (a parent, spouse or partner, child or stepchild, or sibling or step-sibling of the
    victim).
    :::

    :::statute
    Section 31 provides there is no liability to pay damages for pure mental harm resulting from negligence
    unless the harm consists of a recognised psychiatric illness. Section 32 provides that a defendant does not
    owe a duty of care to take care not to cause the plaintiff mental harm unless the defendant ought to have
    foreseen that a person of normal fortitude might, in the circumstances, suffer a recognised psychiatric
    illness if reasonable care were not taken; the circumstances include whether the harm resulted from a sudden
    shock, whether the plaintiff witnessed the victim being killed, injured or put in peril at the scene, the
    plaintiff's relationship to the victim, and any pre-existing relationship between plaintiff and defendant.
    :::

    :::case
    *Wicks v State Rail Authority (NSW)* (2010) 241 CLR 60 — two police officers attended the scene of a train
    derailment (State Rail admitted negligence) and, after spending several hours assisting the injured,
    suffered psychiatric injury. The High Court allowed their appeal and remitted the case, holding that s 32
    controls what would be a duty of care at common law and must be considered before the s 30(2) limitation.
    :::

    Section 32(1) is cast negatively — a duty "is not to be found unless a condition is satisfied" — and
    reflects *Tame*: the four factors in s 32(2) "are considerations relevant to foreseeability", not fixed
    conditions for a duty. Contrary to *Tame*, though, s 32(1) requires foreseeability from the perspective of a
    person of "normal fortitude". On s 30, *Wicks* tells us it would be wrong to look only at what a rescuer
    perceived on first arriving at the scene: a series of shocking experiences may be relevant, and not all
    cases of death, injury or peril begin and end in an instant — the survivors of a derailment remained in
    peril until they had been rescued.

    :::examtip
    Feminist scholars have critiqued tort law's approach to psychiatric harm: claimants for such harm have often
    been women, privileging physical injury over emotional harm is likely to disproportionately affect women,
    and the application of the "reasonable person" test is itself problematic.
    :::

concepts:
  - slug: duty-of-care-categories-and-factors
    title: Categories of harm and the factors courts weigh
    visual: palace
    visual-brief: Three chambers — how the harm was caused, who the defendant is, what the harm's nature is — each holding the sub-factors listed on the slide.
    related: [omissions-and-control-of-others, psychiatric-harm-common-law-development]
    depends-on: []
    contrasts-with: []
    cases: []
    authorities: []
    verify: false
    body: |
      Not every harm caused by carelessness is legally recognised in the same way. Before asking whether a duty
      of care exists in a given fact pattern, courts (and exam answers) run through three groups of factors.

      **How was the harm caused?** Was it by an act or an omission — omissions attract duty far less readily.
      Should "words" be treated differently from "acts"? A careless statement raises different concerns
      (indeterminate liability, reliance) from a careless act.

      **Who is the defendant?** A private individual, or a public authority exercising statutory powers with
      limited resources? Is there a special relationship recognised as attracting a duty more readily — occupier
      and entrant, employer and employee, manufacturer and consumer?

      **What is the nature of the harm?** Physical injury is the paradigm case; psychiatric harm and pure
      economic loss are both recognised, but only within extra limits the ordinary neighbour principle does not
      reach on its own.

      Exam use: before applying any specific rule (obvious risk, recreational activity, mental harm), classify
      the problem against these three questions first — the answer tells you which body of rules (and which CLA
      Part) is actually in play, and misclassifying the harm is the most common way to answer the wrong question
      entirely.
  - slug: omissions-and-control-of-others
    title: Omissions and control of the conduct of others
    visual: simulation
    visual-brief: Sliders for foreseeability, special relationship, knowledge and control; duty only "switches on" once enough of the four are present.
    related: [duty-of-care-categories-and-factors]
    depends-on: [duty-of-care-categories-and-factors]
    contrasts-with: [occupiers-liability-and-obvious-risk]
    cases: [hargrave-v-goldman, modbury-triangle-shopping-centre-v-anzil]
    authorities: [civil-liability-act-2002-nsw-ss55-58]
    verify: false
    body: |
      Generally there is no legal duty to rescue, and no duty to control the conduct of a third party who goes
      on to harm the plaintiff. Where physical harm is caused by an omission rather than a positive act, more
      than reasonable foreseeability is needed: *Hargrave v Goldman* shows the extra ingredients are a special
      relationship (there, occupier-neighbour), the defendant's knowledge of the danger, and their practical
      control over it.

      Control does most of the work. In *Modbury Triangle Shopping Centre v Anzil*, the shopping centre
      controlled its car park lighting but had no control over the criminals who attacked Anzil there — so its
      duty as occupier, resting on "control over, and knowledge of, the state of the premises", did not extend
      to their independent criminal conduct. Reliance and assumption of responsibility can also found a duty
      over a third party's conduct, but neither was made out here.

      Exceptions cut the other way: parents may be liable for failing to control their children, and an occupier
      owes entrants a duty against third-party conduct with real control, or high foreseeability and
      predictability. Sections 55–58 CLA protect a "Good Samaritan" — one who, in good faith and without
      expectation of reward, assists a person apparently injured or at risk — from liability for their response,
      unless they caused the risk or were relevantly impaired.

      Exam use: for an omission, ask what gave the defendant knowledge and control over the harm's source —
      foreseeability alone is never enough.
  - slug: occupiers-liability-and-obvious-risk
    title: Occupiers' duty and obvious risk
    visual: simulation
    visual-brief: A dial from "concealed danger" to "obvious danger"; as it moves toward obvious, the duty to fence/warn drops toward zero.
    related: [duty-of-care-categories-and-factors, sport-and-recreational-injury]
    depends-on: [duty-of-care-categories-and-factors]
    contrasts-with: [omissions-and-control-of-others]
    cases: [romeo-v-conservation-commission-nt]
    authorities: [civil-liability-act-2002-nsw-s5f, civil-liability-act-2002-nsw-s5g, civil-liability-act-2002-nsw-s5h]
    verify: false
    body: |
      An occupier of land owes entrants a duty to take reasonable care against foreseeable risks of injury, but
      *Romeo v Conservation Commission (NT)* shows the duty is "not owed in the abstract in practice" — the
      critical question is usually its scope, not its existence. Romeo fell from an unfenced cliff in a reserve
      the Commission managed; the High Court held the duty did not extend to fencing the coastline, because the
      danger was assessed "according to its obviousness and the care ordinarily exercised by the public". There
      is no duty to warn of, or guard against, an obvious risk — only a concealed one.

      The CLA now codifies this. Section 5F defines an "obvious risk" objectively — obvious to a reasonable
      person in the plaintiff's position, even if it has a low probability of occurring or is not conspicuous.
      Section 5G presumes the plaintiff was aware of an obvious risk unless they prove otherwise on the balance
      of probabilities. Section 5H removes any proactive duty to warn of an obvious risk, subject to three
      exceptions: the plaintiff asked for advice, a written law requires a warning, or the defendant is a
      professional and the risk is one of death or personal injury from a professional service.

      Exam use: once the defendant is an occupier (or otherwise controls premises), run the obvious-risk analysis
      before breach — if the danger was obvious, there is usually no duty to warn or eliminate it, so breach
      never needs to be reached.
  - slug: product-liability-duty-of-care
    title: Product liability
    visual: explainer
    visual-brief: A supply chain (manufacturer → distributor → consumer) with the duty of care sitting alongside, not replacing, contract and consumer-protection law.
    related: [duty-of-care-categories-and-factors]
    depends-on: [duty-of-care-categories-and-factors]
    contrasts-with: []
    cases: [graham-barclay-oysters-v-ryan]
    authorities: []
    verify: false
    body: |
      Before *Donoghue v Stevenson*, the owner of "dangerous things" had a duty to take reasonable precautions
      to keep them from third parties, but no equivalent duty existed for non-dangerous things. After *Donoghue*
      and *Grant v Australian Knitting Mills*, the ordinary principles of negligence became a basis for
      liability for defective products generally, sitting alongside (not replacing) liability in contract, under
      sale-of-goods law, and under the Australian Consumer Law.

      *Graham Barclay Oysters v Ryan* shows foreseeability of harm does not automatically mean a duty has been
      breached. Consumers contracted Hepatitis A from oysters contaminated by faecal matter after a storm; the
      grower's "depuration" process reduced, but could not eliminate, the viral load. The High Court held the
      NSW government owed no duty of care, and although the grower did owe one, it was not breached: even though
      the risk was reasonably foreseeable and its magnitude significant, "the degree of probability of its
      occurrence" did not justify the "difficult, expensive and inconvenient alleviating action" (eliminating
      the risk entirely) the consumers argued for.

      Exam use: in a product-liability problem, do not stop at foreseeability — go on to ask whether the
      precautions the plaintiff says should have been taken were actually reasonable given their cost,
      difficulty and inconvenience against the probability and magnitude of the risk.
  - slug: sport-and-recreational-injury
    title: Sport and recreational injury
    visual: diagram
    visual-brief: A decision flow — is it a dangerous recreational activity? was the risk obvious? was a risk warning given? — ending in "no duty" or "duty, ask breach".
    related: [occupiers-liability-and-obvious-risk]
    depends-on: [duty-of-care-categories-and-factors]
    contrasts-with: [occupiers-liability-and-obvious-risk]
    cases: [rootes-v-shelton, agar-v-hyde]
    authorities: [civil-liability-act-2002-nsw-s5l, civil-liability-act-2002-nsw-s5m]
    verify: false
    body: |
      Duty in sport may be owed to fellow players, spectators, coaches or administrators, but participants
      accept the risks inherent in their sport. *Rootes v Shelton*: "participants may be held to have accepted
      risks which are inherent in that sport or pastime … but this does not eliminate all duty of care of the
      one participant to the other" (Barwick CJ) — whether a duty arises depends on circumstances. There, a
      skier's collision with a boat was a breach of the observer's separate duty to warn, not an inherent risk
      of skiing.

      *Agar v Hyde* shows the same reasoning can defeat a claim: rugby players injured in a scrum argued the
      game's governing body owed a duty to change the rules to cut "unnecessary risk", but the High Court found
      none — rugby "is based on activities … which, by the standards of most members of the community, are
      obviously dangerous" (Gleeson CJ); the answer is fact-specific.

      The CLA gives dangerous recreational activities their own regime. Section 5L removes liability for harm
      from an obvious risk of a dangerous recreational activity, whether or not the plaintiff knew of it. Section
      5M removes the duty of care over a recreational risk once it has been the subject of a risk warning,
      spoken or written, general or specific, whether or not understood.

      Exam use: separate the sport's inherent risk (no duty) from a distinct failure to warn (duty, breach in
      issue), then check whether ss 5L or 5M remove liability regardless.
  - slug: psychiatric-harm-common-law-development
    title: Psychiatric harm at common law
    visual: timeline
    visual-brief: Cases moving away from rigid "control mechanisms" toward a single foreseeability test, ending at Tame/Annetts.
    related: [duty-of-care-categories-and-factors]
    depends-on: [duty-of-care-categories-and-factors]
    contrasts-with: [psychiatric-harm-civil-liability-act]
    cases: [tame-v-new-south-wales, annetts-v-australian-stations-pty-ltd]
    authorities: []
    verify: false
    body: |
      Psychiatric harm was traditionally labelled "nervous shock" and denied recovery; it is now compensable,
      but a pure psychiatric-harm plaintiff must show reasonable foreseeability that a person in their position
      would suffer a recognised psychiatric illness. *Tame v New South Wales; Annetts v Australian Stations Pty
      Ltd* rejected three "control mechanisms" the lower courts had treated as preconditions — normal fortitude,
      "sudden shock", and "direct perception" of the event or its immediate aftermath — holding none is "a
      pre-condition to liability for negligently inflicted psychiatric harm" (Gummow and Kirby JJ). Reasonable
      foreseeability of a recognised psychiatric illness is the only real test.

      The two cases, decided together, show the test applied both ways. In *Tame*, a police officer's corrected
      clerical error triggered an extreme and idiosyncratic reaction; the High Court held her psychiatric injury
      was not reasonably foreseeable, so no duty was owed. In *Annetts*, an employer's broken promise to
      supervise a 16-year-old jackaroo, followed by his death in the desert, was reasonably foreseeable to cause
      his parents psychiatric harm — a pre-existing relationship (their inquiries and the employer's assurance)
      made the class of possible plaintiffs determinate, so a duty was owed without sudden shock or direct
      perception.

      Feminist scholars critique this area: claimants for psychiatric harm have often been women, privileging
      physical injury over emotional harm may disproportionately affect them, and the "normal fortitude"
      standard is itself contested.

      Exam use: in a NSW problem, note *Tame*'s test but go straight to CLA s 32, which has since modified it.
  - slug: psychiatric-harm-civil-liability-act
    title: Psychiatric harm under the Civil Liability Act
    visual: simulation
    visual-brief: Four toggles from s 32(2)(a)-(d) feeding a foreseeability dial, gated by the s 30(2) and s 31 thresholds.
    related: [psychiatric-harm-common-law-development]
    depends-on: [psychiatric-harm-common-law-development]
    contrasts-with: [psychiatric-harm-common-law-development]
    cases: [wicks-v-state-rail-authority-nsw]
    authorities: [civil-liability-act-2002-nsw-s27, civil-liability-act-2002-nsw-s30, civil-liability-act-2002-nsw-s31, civil-liability-act-2002-nsw-s32]
    verify: false
    body: |
      Part 3 CLA governs mental harm claims in NSW. Section 27 splits "mental harm" into "pure" (standalone) and
      "consequential" (from another personal injury). Section 31 bars damages for pure mental harm unless it is
      a recognised psychiatric illness. Section 32 sets the duty test: no duty to avoid causing mental harm
      unless the defendant ought to have foreseen a person of *normal fortitude* might suffer a recognised
      illness, having regard to four circumstances — sudden shock, witnessing the victim killed/injured/put in
      peril at the scene, the plaintiff's relationship to the victim, and any pre-existing relationship with the
      defendant. Section 30 then limits recovery for *pure* mental harm from shock to scene-witnesses and the
      victim's close family.

      *Wicks v State Rail Authority (NSW)* establishes the order of analysis: s 32 (duty) precedes s 30(2) (the
      limitation), since s 30 only matters once a duty exists. It reads "witnessed ... being ... put in peril"
      broadly — officers who spent hours assisting derailment victims still "in peril" satisfied s 30(2)(a), as
      not every such event begins and ends in an instant.

      Section 32 differs from *Tame*: it expressly requires foreseeability to be judged against a person of
      *normal fortitude*, whereas *Tame* treated that as one relevant consideration, not a fixed standard.

      Exam use: for a NSW mental-harm problem, apply s 32 first (duty), then s 31 (illness), then — only for pure
      mental harm from shock — s 30 (scene-witness or close family).

cases:
  - slug: hargrave-v-goldman
    name: Hargrave v Goldman
    citation: "(1963) 110 CLR 40"
    aglc: "Hargrave v Goldman (1963) 110 CLR 40"
    facts: |
      Lightning struck a red gum tree on the defendant's Western Australian farm. The defendant had the tree
      felled but left the resulting fire to burn itself out. The weather then turned, the fire revived, and it
      spread to destroy the plaintiff's neighbouring properties.
    issue: |
      Whether an occupier who did not create a natural danger, but knew of it and did not act, owed neighbouring
      occupiers a duty of care for harm caused by the omission to abate it.
    held: |
      The lecture material identifies the relevant factors for liability — reasonable foreseeability of harm,
      the occupier-neighbour special relationship, the defendant's knowledge of the danger, and their control
      over it — as the ingredients needed for an omission-based duty of care in this setting.
    ratio: |
      An omission to abate a danger on one's land can found a duty of care to neighbouring occupiers where there
      is a special relationship (here, occupier-neighbour), the defendant knew of the danger, and had the
      practical ability (control) to deal with it — foreseeability alone is not enough.
    significance: |
      Establishes the extra ingredients — special relationship, knowledge and control — that must be added to
      foreseeability before an omission attracts a duty of care.
    why-here: Used to show what must be added to foreseeability before an omission (rather than a positive act) attracts a duty of care.
    verify: true
  - slug: romeo-v-conservation-commission-nt
    name: Romeo v Conservation Commission (NT)
    citation: "(1998) 192 CLR 431"
    aglc: "Romeo v Conservation Commission (NT) (1998) 192 CLR 431"
    facts: |
      Fifteen-year-old Nadia Romeo, affected by alcohol, fell from the Dripstone Cliffs onto Casuarina Beach
      near Darwin at night and was rendered paraplegic. The cliffs and beach reserve were managed by the
      Conservation Commission, which had not fenced or lit the cliff edge; Romeo sued alleging negligence in
      failing to warn of, or fence off, the cliff.
    issue: |
      Whether the Commission, as occupier in control of a public reserve, owed and had breached a duty of care
      to entrants by failing to fence or warn of the cliff.
    held: |
      The High Court (Gaudron and McHugh JJ dissenting) held that although the Commission owed entrants a duty
      to take reasonable care against reasonably foreseeable risks of injury, it was not in breach of that duty
      by failing to fence or illuminate the cliff edge, because the danger was obvious.
    ratio: |
      Duty of care is not owed in the abstract — the scope of an occupier's duty is measured against the
      obviousness of the danger and the care ordinarily exercised by entrants; there is no duty to warn of, or
      guard against, an obvious risk.
    significance: |
      Leading authority distinguishing the existence of a duty from its scope, and establishing that an occupier
      need not guard against obvious dangers — later codified by CLA ss 5F–5H on obvious risk.
    why-here: The key case for arguing that an occupier's duty does not extend to protecting entrants from open and obvious dangers.
    verify: false
  - slug: modbury-triangle-shopping-centre-v-anzil
    name: Modbury Triangle Shopping Centre v Anzil
    citation: "(2000) 205 CLR 254"
    aglc: "Modbury Triangle Shopping Centre Pty Ltd v Anzil (2000) 205 CLR 254"
    facts: |
      Anzil, an employee of a video shop in the shopping centre, was attacked by unknown assailants at 10.30pm
      while walking to his car after the car park lights — usually left on until 11pm — went off on their
      10pm timer as usual.
    issue: |
      Whether the shopping centre, as occupier, owed Anzil a duty of care to prevent physical injury inflicted by
      the criminal acts of third parties in its car park.
    held: |
      The High Court, by majority, held that the occupier's duty of care did not extend to protecting Anzil from
      the criminal conduct of third parties; the occupier's duty over the state of the premises rested on its
      control of, and knowledge about, the premises, not on an assumed responsibility to guard against
      unpredictable criminal acts.
    ratio: |
      An occupier does not, merely by controlling premises, owe a duty to prevent the independent criminal
      conduct of third parties on them, absent a high degree of foreseeability and predictability of that
      conduct, control over the third party, or an assumption of responsibility.
    significance: |
      Confines occupiers' liability for omissions: control over premises is not the same as control over the
      people who use them, so no general duty arises unless foreseeability of the specific risk is very high.
    why-here: Used to contrast with cases like Hargrave v Goldman, where the defendant's control over the risk itself founded a duty — here the defendant had no control over the third parties.
    verify: false
  - slug: graham-barclay-oysters-v-ryan
    name: Graham Barclay Oysters v Ryan
    citation: "(2002) 211 CLR 540"
    aglc: "Graham Barclay Oysters Pty Ltd v Ryan (2002) 211 CLR 540"
    facts: |
      Consumers contracted Hepatitis A after eating oysters grown and distributed by Graham Barclay from Wallis
      Lake, NSW, after the lake was contaminated by faecal matter following a storm; the "depuration" process
      used only reduced, but did not eliminate, the viral load.
    issue: |
      Whether the oyster grower/distributor, the local council and the NSW government owed consumers a duty of
      care in relation to the contamination, and whether any such duty was breached.
    held: |
      The High Court, by majority, held that the NSW government did not owe a duty of care to consumers, and
      that although Graham Barclay did owe a duty of care, that duty was not breached.
    ratio: |
      Even where a risk of harm to consumers is reasonably foreseeable and of significant magnitude, there is no
      breach if the probability of the risk occurring does not justify the difficult, expensive and inconvenient
      precautions that would be needed to eliminate it entirely.
    significance: |
      Applies ordinary negligence and product-liability reasoning to a modern food-safety supply chain, and
      shows breach turning on a cost-benefit assessment of precautions, not mere foreseeability.
    why-here: The key modern product-liability case for showing that foreseeability of harm does not automatically mean the standard of care has been breached.
    verify: false
  - slug: rootes-v-shelton
    name: Rootes v Shelton
    citation: "(1967) 116 CLR 383"
    aglc: "Rootes v Shelton (1967) 116 CLR 383"
    facts: |
      An experienced water-skier, Rootes, was performing a "crossover" on the Macquarie River when he collided
      with a stationary boat after being briefly blinded by spray; the towing boat's observer had failed to warn
      skiers of the stationary obstacle.
    issue: |
      Whether a fellow participant in a sporting activity (the boat driver/observer) owed a duty of care to
      another participant (the skier), and whether that duty was breached.
    held: |
      The High Court held that the boat driver owed Rootes a duty of care and that the duty had been breached by
      the observer's failure to warn of the stationary obstacle.
    ratio: |
      Barwick CJ: participants in a sport accept the risks inherent in it, but this does not eliminate all duty
      of care between participants — whether a duty arises, and its extent, depends on the circumstances of the
      case.
    significance: |
      Establishes that a duty of care can arise between co-participants in a sport, and that the "inherent risk"
      of the sport must be distinguished from a separate failure to take reasonable care, such as a failure to
      warn.
    why-here: The starting point for any sport-injury problem — used to separate inherent risks the plaintiff accepted from a distinct breach of duty by a fellow participant.
    verify: false
  - slug: agar-v-hyde
    name: Agar v Hyde
    citation: "(2000) 201 CLR 552"
    aglc: "Agar v Hyde (2000) 201 CLR 552"
    facts: |
      Two rugby players were injured in a scrum and argued that the International Rugby Football Board owed
      them a duty of care to monitor the rules of the game and change them to reduce "unnecessary risk" to
      players.
    issue: |
      Whether a sport's governing body owed players a duty of care to change the rules of the game to reduce
      risks inherent in it.
    held: |
      The High Court rejected the claim; the Board owed no such duty of care to the players.
    ratio: |
      Gleeson CJ: rugby is based on activities that are, by the standards of most members of the community,
      obviously dangerous, and the existence and extent of any duty is very fact-specific to the relationship in
      issue.
    significance: |
      Shows that even in sport, a duty is not owed to every participant by every body connected with the
      activity — the closer a case gets to a policy-laden rule-making decision, the less likely a duty is found.
    why-here: Contrasts with Rootes v Shelton — used to show that a duty found between co-participants does not extend automatically to a remote regulatory body.
    verify: false
  - slug: tame-v-new-south-wales
    name: Tame v New South Wales
    citation: "(2002) 211 CLR 317"
    aglc: "Tame v New South Wales (2002) 211 CLR 317"
    facts: |
      A police officer completing an accident report mistakenly recorded the plaintiff's blood alcohol reading
      as 0.14 (it was in fact nil). Although the error was corrected within weeks, the plaintiff's solicitor told
      her about it over a year later and she developed a psychotic depressive illness.
    issue: |
      Whether the police officer owed the plaintiff a duty of care not to cause her psychiatric injury.
    held: |
      The High Court held (heard together with Annetts) that the officer did not owe Mrs Tame a duty of care,
      because it was not reasonably foreseeable that a person in her position would suffer a recognised
      psychiatric illness from an error that had been corrected and apologised for; her reaction was extreme and
      idiosyncratic.
    ratio: |
      Reasonable foreseeability of a recognised psychiatric illness is the central test for a psychiatric-harm
      duty of care; the "control mechanisms" of normal fortitude, sudden shock, and direct perception (or its
      immediate aftermath) are relevant considerations, not fixed pre-conditions for liability.
    significance: |
      Rejects rigid, categorical control mechanisms for psychiatric harm in favour of a single foreseeability
      inquiry; the common law test is now qualified for NSW cases by CLA Part 3 (ss 27–33).
    why-here: The leading common law case for psychiatric harm — used together with Annetts to state and apply the general foreseeability test.
    verify: false
  - slug: annetts-v-australian-stations-pty-ltd
    name: Annetts v Australian Stations Pty Ltd
    citation: "(2002) 211 CLR 317"
    aglc: "Annetts v Australian Stations Pty Ltd (2002) 211 CLR 317"
    facts: |
      The plaintiffs allowed their 16-year-old son to work as a jackaroo only after the employer promised he
      would be constantly supervised. Seven weeks later the employer sent him alone into a remote property; he
      went missing, and the parents learned over four months of his disappearance and eventual death from
      dehydration in the desert.
    issue: |
      Whether the employer owed the boy's parents a duty of care to avoid causing them psychiatric injury from
      his death.
    held: |
      The High Court (heard together with Tame) held that the employer owed the parents a duty of care; it
      rejected sudden shock and direct perception as rigid preconditions, relying instead on the pre-existing
      relationship between the parties and the employer's assurance of supervision.
    ratio: |
      A duty to avoid psychiatric harm can exist without sudden shock or direct perception where there is a
      pre-existing relationship between plaintiff and defendant, making the class of potential plaintiffs
      determinate.
    significance: |
      Shows a duty for psychiatric harm can be grounded in a specific relationship and assumption of
      responsibility, not only in witnessing a shocking event.
    why-here: Used to contrast with Tame — the same foreseeability test, opposite outcome, because of the pre-existing relationship and assurance given here.
    verify: false
  - slug: wicks-v-state-rail-authority-nsw
    name: Wicks v State Rail Authority (NSW)
    citation: "(2010) 241 CLR 60"
    aglc: "Wicks v State Rail Authority (NSW) (2010) 241 CLR 60"
    facts: |
      Two police officers attended the scene of the Waterfall train derailment, where seven people were killed
      and many injured; State Rail admitted negligence. The officers spent several hours assisting the injured
      and later suffered psychiatric injury.
    issue: |
      Whether the officers had "witnessed, at the scene, the victim being killed, injured or put in peril"
      within the meaning of CLA s 30(2)(a), and whether s 32 or s 30 should be considered first.
    held: |
      The High Court allowed the appeal, holding that s 32 (which controls whether a duty of care arises) must
      be considered before the s 30(2) limitation, and that the derailment's consequences unfolded over time —
      the officers witnessed victims still being injured or in peril while they assisted, satisfying s 30(2)(a).
    ratio: |
      Section 32 CLA governs whether a duty of care exists and must be addressed first; a person can be
      "witnessing ... a victim being ... put in peril" for the purposes of s 30(2)(a) even though the triggering
      event unfolds over an extended period rather than an instant.
    significance: |
      Clarifies the relationship between the CLA's general mental-harm duty provision (s 32) and its specific
      limitation on recovery for pure mental harm (s 30), and gives "put in peril" a broad, ordinary meaning.
    why-here: The leading case applying CLA Part 3 to rescuers and multi-victim disasters, and for the order in which ss 32 and 30 must be applied.
    verify: false

authorities:
  - slug: civil-liability-act-2002-nsw-s5f
    title: Civil Liability Act 2002 (NSW) s 5F
    kind: statute
    text: |
      (1) For the purposes of this Division, an obvious risk to a person who suffers harm is a risk that, in the
      circumstances, would have been obvious to a reasonable person in the position of that person. (2) Obvious
      risks include risks that are patent or a matter of common knowledge. (3) A risk of something occurring can
      be an obvious risk even though it has a low probability of occurring. (4) A risk can be an obvious risk
      even if the risk (or a condition or circumstance that gives rise to the risk) is not prominent, conspicuous
      or physically observable.
    gloss: Defines "obvious risk" objectively (the reasonable-person standard), not limited to prominent or highly likely dangers.
    cases: [romeo-v-conservation-commission-nt]
    verify: false
  - slug: civil-liability-act-2002-nsw-s5g
    title: Civil Liability Act 2002 (NSW) s 5G
    kind: statute
    text: |
      (1) In proceedings relating to liability for negligence, a person who suffers harm is presumed to have
      been aware of the risk of harm if it was an obvious risk, unless the person proves on the balance of
      probabilities that he or she was not aware of the risk. (2) For the purposes of this section, a person is
      aware of a risk if the person is aware of the type or kind of risk, even if the person is not aware of the
      precise nature, extent or manner of occurrence of the risk.
    gloss: Reverses the onus — a plaintiff is presumed to know of an obvious risk unless they prove otherwise.
    cases: [romeo-v-conservation-commission-nt]
    verify: false
  - slug: civil-liability-act-2002-nsw-s5h
    title: Civil Liability Act 2002 (NSW) s 5H
    kind: statute
    text: |
      (1) A person (the defendant) does not owe a duty of care to another person (the plaintiff) to warn of an
      obvious risk to the plaintiff. (2) This section does not apply if— (a) the plaintiff has requested advice
      or information about the risk from the defendant, or (b) the defendant is required by a written law to
      warn the plaintiff of the risk, or (c) the defendant is a professional and the risk is a risk of the death
      of or personal injury to the plaintiff from the provision of a professional service by the defendant. (3)
      Subsection (2) does not give rise to a presumption of a duty to warn of a risk in the circumstances
      referred to in that subsection.
    gloss: Codifies Romeo — no general duty to warn of obvious risks, subject to three exceptions (request for advice, statutory duty, professional services).
    cases: [romeo-v-conservation-commission-nt]
    verify: false
  - slug: civil-liability-act-2002-nsw-ss55-58
    title: Civil Liability Act 2002 (NSW) ss 55–58
    kind: statute
    text: |
      56 ... a good samaritan is a person who, in good faith and without expectation of payment or other reward,
      comes to the assistance of a person who is apparently injured or at risk of being injured. 57(1) A good
      samaritan does not incur any personal civil liability in respect of any act or omission done or made by
      the good samaritan in an emergency when assisting a person who is apparently injured or at risk of being
      injured. 58(1) The protection from personal liability conferred by this Part does not apply if it is the
      good samaritan's intentional or negligent act or omission that caused the injury or risk of injury ... (2)
      [nor where] the ability of the good samaritan to exercise reasonable care and skill was significantly
      impaired by reason of the good samaritan being under the influence of alcohol or a drug voluntarily
      consumed ... and the good samaritan failed to exercise reasonable care and skill.
    gloss: Protects a person who voluntarily and in good faith assists someone apparently injured or at risk from personal civil liability for their emergency response, unless they caused the risk themselves or were relevantly impaired.
    cases: []
    verify: false
  - slug: civil-liability-act-2002-nsw-s5l
    title: Civil Liability Act 2002 (NSW) s 5L
    kind: statute
    text: |
      (1) A person (the defendant) is not liable in negligence for harm suffered by another person (the
      plaintiff) as a result of the materialisation of an obvious risk of a dangerous recreational activity
      engaged in by the plaintiff. (2) This section applies whether or not the plaintiff was aware of the risk.
    gloss: A complete defence removing liability for the materialisation of obvious risks of dangerous recreational activities, regardless of the plaintiff's actual awareness.
    cases: []
    verify: false
  - slug: civil-liability-act-2002-nsw-s5m
    title: Civil Liability Act 2002 (NSW) s 5M
    kind: statute
    text: |
      (1) A person (the defendant) does not owe a duty of care to another person who engages in a recreational
      activity (the plaintiff) to take care in respect of a risk of the activity if the risk was the subject of a
      risk warning to the plaintiff. (3) ... a risk warning ... is a warning that is given in a manner that is
      reasonably likely to result in people being warned of the risk before engaging in the recreational
      activity. The defendant is not required to establish that the person received or understood the warning or
      was capable of receiving or understanding the warning. (4) A risk warning can be given orally or in
      writing (including by means of a sign or otherwise). (5) A risk warning need not be specific to the
      particular risk and can be a general warning of risks that include the particular risk concerned.
    gloss: Removes the duty of care for a recreational risk once a suitably general risk warning has been given, whether or not the plaintiff actually understood it.
    cases: []
    verify: false
  - slug: civil-liability-act-2002-nsw-s27
    title: Civil Liability Act 2002 (NSW) s 27
    kind: statute
    text: |
      consequential mental harm means mental harm that is a consequence of a personal injury of any other kind.
      mental harm means impairment of a person's mental condition. ... pure mental harm means mental harm other
      than consequential mental harm.
    gloss: Defines the two categories of mental harm the rest of Part 3 turns on — "pure" (standalone) and "consequential" (flowing from another personal injury).
    cases: [wicks-v-state-rail-authority-nsw]
    verify: false
  - slug: civil-liability-act-2002-nsw-s30
    title: Civil Liability Act 2002 (NSW) s 30
    kind: statute
    text: |
      (1) This section applies to the liability of a person (the defendant) for pure mental harm to a person
      (the plaintiff) arising wholly or partly from mental or nervous shock in connection with another person
      (the victim) being killed, injured or put in peril by the act or omission of the defendant. (2) The
      plaintiff is not entitled to recover damages for pure mental harm unless— (a) the plaintiff witnessed, at
      the scene, the victim being killed, injured or put in peril, or (b) the plaintiff is a close member of the
      family of the victim.
    gloss: Limits recovery for pure mental harm arising from shock to scene-witnesses and close family members of the victim.
    cases: [wicks-v-state-rail-authority-nsw]
    verify: false
  - slug: civil-liability-act-2002-nsw-s31
    title: Civil Liability Act 2002 (NSW) s 31
    kind: statute
    text: |
      There is no liability to pay damages for pure mental harm resulting from negligence unless the harm
      consists of a recognised psychiatric illness.
    gloss: Damages for pure mental harm require a recognised psychiatric illness, not mere distress or grief.
    cases: [wicks-v-state-rail-authority-nsw]
    verify: false
  - slug: civil-liability-act-2002-nsw-s32
    title: Civil Liability Act 2002 (NSW) s 32
    kind: statute
    text: |
      (1) A person (the defendant) does not owe a duty of care to another person (the plaintiff) to take care
      not to cause the plaintiff mental harm unless the defendant ought to have foreseen that a person of normal
      fortitude might, in the circumstances of the case, suffer a recognised psychiatric illness if reasonable
      care were not taken. (2) ... the circumstances of the case include the following— (a) whether or not the
      mental harm was suffered as the result of a sudden shock, (b) whether the plaintiff witnessed, at the
      scene, a person being killed, injured or put in peril, (c) the nature of the relationship between the
      plaintiff and any person killed, injured or put in peril, (d) whether or not there was a pre-existing
      relationship between the plaintiff and the defendant.
    gloss: Sets the statutory duty test for mental harm — foreseeability of psychiatric illness to a person of normal fortitude, informed but not fixed by four listed circumstances.
    cases: [wicks-v-state-rail-authority-nsw]
    verify: false

questions:
  # ---------- Concept 1: duty-of-care-categories-and-factors ----------
  - key: q001
    type: mcq
    concept: duty-of-care-categories-and-factors
    difficulty: 1
    stem: According to this week's materials, which three groups of factors bear on whether a case falls within an accepted category of duty of care?
    options:
      - text: How the harm was caused, who the defendant is, and the nature of the harm.
        correct: true
        why: This is exactly the three-part checklist from the lecture — act or omission, private individual or public authority (and any special relationship), and physical, psychiatric or economic harm.
      - text: The plaintiff's age, the defendant's wealth, and the length of any relationship between them.
        why: Tempting because these sound like the sort of facts a court might mention, but none of them is one of the three factor groups the lecture actually identifies for categorising duty.
      - text: Whether there is a contract, the amount of damages claimed, and the court's discretion to award costs.
        why: Wrong — contract, quantum and costs are separate legal questions from whether a duty of care in negligence exists at all, which is what this week's factors sort out.
  - key: q002
    type: mcq
    concept: duty-of-care-categories-and-factors
    variant-of: q001
    difficulty: 1
    stem: A first-year student says "duty of care always turns on foreseeability alone." Which fact from this week's materials corrects that claim?
    options:
      - text: Courts also ask how the harm was caused and who the defendant is before finding a duty exists.
        correct: true
        why: Correct — the lecture stresses that classifying the case (act/omission, defendant type, special relationship) sits alongside foreseeability, not instead of it.
      - text: Foreseeability is irrelevant once the Civil Liability Act applies to a claim.
        why: Wrong — every statutory overlay covered this week (obvious risk, recreational activity, mental harm) still operates against a background of foreseeability, it does not remove it.
      - text: Duty of care is only relevant to intentional torts, not to negligence claims at all, though courts have generally treated this as a secondary consideration at most.
        why: Wrong — duty of care is precisely an element of the tort of negligence, which is the entire subject of this week's material.
  - key: q003
    type: mcq
    concept: duty-of-care-categories-and-factors
    difficulty: 2
    stem: Which pairing is given in the lecture as an example of a "special relationship" relevant to who the defendant is?
    options:
      - text: Manufacturer and consumer.
        correct: true
        why: Correct — the slide lists occupier and entrant, employer and employee, and manufacturer and consumer as the special relationships mentioned under "who is the defendant?".
      - text: Plaintiff and their own solicitor.
        why: Tempting because solicitor-client relationships do attract duties elsewhere in law, but the lecture's list for this topic does not mention this pairing at all.
      - text: Insurer and policyholder.
        why: Wrong — insurance relationships are not among the special relationships the slide names when discussing who the defendant is for duty-of-care purposes.
  - key: q004
    type: mcq
    concept: duty-of-care-categories-and-factors
    variant-of: q003
    difficulty: 2
    stem: Besides manufacturer and consumer, which other special relationship does the lecture list under "who is the defendant"?
    options:
      - text: Occupier and entrant.
        correct: true
        why: Correct — this is one of the three special relationships named on the slide, alongside employer/employee and manufacturer/consumer.
      - text: Landlord and tenant's guest.
        why: Tempting because it resembles occupier and entrant, but it is a distinct relationship the lecture does not actually name in its list.
      - text: Doctor and patient's family.
        why: Wrong — this relationship surfaces later in the psychiatric harm material (e.g. Annetts) but it is not one of the three "who is the defendant" examples given here.
  - key: q005
    type: mcq
    concept: duty-of-care-categories-and-factors
    difficulty: 2
    stem: Which of these is NOT one of the three kinds of harm the lecture lists as a possible result of breaching a potential duty of care?
    options:
      - text: Damage to reputation.
        correct: true
        why: Correct — the lecture's list is physical harm, psychiatric harm and pure economic loss; reputational harm belongs to defamation, not this list.
      - text: Physical harm.
        why: Wrong — physical harm is expressly named as one of the three kinds of harm the lecture lists, and is treated as the typical case in negligence.
      - text: Pure economic loss, though this would need to be supported by clear evidence in the specific case.
        why: Wrong — pure economic loss is expressly named as one of the three kinds of harm, even though (as last week showed) it needs extra ingredients to be recoverable.
  - key: q006
    type: mcq
    concept: duty-of-care-categories-and-factors
    difficulty: 1
    stem: Why does the lecture suggest "words" might need to be treated differently from "acts" when asking how harm was caused?
    options:
      - text: A careless statement raises separate concerns, such as reliance and indeterminate liability, that a careless physical act does not.
        correct: true
        why: This reflects why the "how was the harm caused" factor singles out words — statements can be repeated, relied on by many people, and are harder to contain than a one-off physical act.
      - text: Words can never cause legally recognised harm in Australian tort law.
        why: Wrong — this overstates the point; the lecture only flags that words may be treated differently, not that verbal conduct is incapable of ever founding liability.
      - text: Only written words, never spoken words, are capable of being negligent.
        why: Wrong — the lecture's question is about acts versus words generally, and draws no distinction between spoken and written statements.
  - key: q007
    type: mcq
    concept: duty-of-care-categories-and-factors
    difficulty: 2
    stem: Why does it matter, for an exam answer, whether the defendant is a private individual or a public authority?
    options:
      - text: A public authority's duty may be shaped by its statutory powers and limited resources, which does not apply to a private defendant.
        correct: true
        why: Correct — cases like Romeo turn on the Commission's position as a statutory authority managing land with finite resources, a consideration that has no equivalent for a private defendant.
      - text: Public authorities are always immune from being sued in negligence, a rule that would need to be read together with the general principles of negligence.
        why: Wrong — nothing in this week's material suggests blanket immunity; Romeo and Graham Barclay Oysters both proceed against public bodies on the merits.
      - text: Private individuals can never owe a duty of care to strangers.
        why: Wrong — many of this week's cases (Hargrave v Goldman, Rootes v Shelton) involve private defendants owing duties to people they had no prior contract with.
  - key: q008
    type: mcq
    concept: duty-of-care-categories-and-factors
    difficulty: 3
    stem: A council fails to trim an overhanging tree branch on its own land, which later falls and injures a passer-by. Using this week's three-factor checklist, which classification is most accurate?
    options:
      - text: An omission, by a public authority, causing physical harm — so the omission and public-authority factors both need separate attention before breach.
        correct: true
        why: Correct application of the checklist — failing to trim is an omission, the council is a public authority, and the harm is physical, so all three factor groups are engaged.
      - text: An act, by a private individual, causing pure economic loss.
        why: Wrong on every limb — failing to trim is an omission not a positive act, a council is a public authority not a private individual, and a physical injury is not pure economic loss.
      - text: A positive act causing psychiatric harm, so the CLA's mental harm provisions apply, which could otherwise be relevant to a related cause of action on different facts.
        why: Wrong — the branch causes a physical injury to the passer-by, not psychiatric harm, and not trimming a tree is a failure to act, not an act.
  - key: q009
    type: mcq
    concept: duty-of-care-categories-and-factors
    variant-of: q008
    difficulty: 3
    stem: A privately owned gym fails to replace a frayed climbing rope, which later snaps and injures a member. How should this be classified under the three-factor checklist?
    options:
      - text: An omission, by a private individual/entity in a special (occupier-entrant) relationship, causing physical harm.
        correct: true
        why: Correct — not replacing the rope is an omission, the gym is a private occupier with a special relationship to its member-entrant, and the resulting injury is physical harm.
      - text: An act, by a public authority, causing pure economic loss.
        why: Wrong on all three limbs — a private gym is not a public authority, failing to replace equipment is an omission not an act, and a physical injury is not economic loss.
      - text: An omission causing psychiatric harm only, with no special relationship in issue.
        correct: false
        why: Wrong — the rope snapping causes a physical injury, and the gym-member relationship is precisely the kind of special (occupier-entrant-like) relationship the checklist asks you to identify.
  - key: q010
    type: mcq
    concept: duty-of-care-categories-and-factors
    difficulty: 3
    stem: Why does correctly classifying the harm as "psychiatric" rather than "physical" matter under this week's material?
    options:
      - text: It determines whether the Civil Liability Act's mental harm provisions (Part 3, ss 27–33) apply instead of the ordinary obvious-risk or recreational-activity provisions.
        correct: true
        why: Correct — misclassifying the harm sends you to the wrong statutory overlay entirely, since Part 3 is specific to mental harm and does not govern physical-injury claims.
      - text: It changes which court has jurisdiction to hear the claim.
        why: Wrong — nothing in this week's material links the type of harm suffered to which court has jurisdiction; that is a civil procedure question, not a duty-of-care one.
      - text: Psychiatric harm claims cannot be brought in negligence at all, only in a separate statutory tort, which a careful advocate might raise as a subsidiary point in argument, though courts have generally treated this as a secondary consideration at most.
        why: Wrong — this week's material shows psychiatric harm is very much a negligence claim, just one with extra foreseeability and statutory hurdles layered on top.
  - key: q011
    type: mcq
    concept: duty-of-care-categories-and-factors
    difficulty: 2
    set: pretest
    stem: Under this week's framework, which factor group asks whether there is an occupier-entrant, employer-employee, or manufacturer-consumer relationship?
    options:
      - text: Who is the defendant.
        correct: true
        why: Correct — these three pairings are given as examples of a "special relationship" under the "who is the defendant" heading.
      - text: How the harm was caused.
        why: Tempting because it is one of the other two factor groups, but that group is about act versus omission and words versus acts, not about relationships.
      - text: What is the nature of the harm.
        why: Wrong — this group asks whether the harm is physical, psychiatric or pure economic loss, not who stands in a relationship with whom.
  - key: q012
    type: mcq
    concept: duty-of-care-categories-and-factors
    difficulty: 1
    stem: True or false framing aside — which of the following best captures why classification matters for an ILAC answer this week?
    options:
      - text: It tells you which body of specific rules and which part of the Civil Liability Act to apply next.
        correct: true
        why: Correct — once you know whether you are dealing with an omission, an occupier, a sport, a product, or psychiatric harm, you know which rules and CLA provisions to reach for.
      - text: It changes the burden of proof from the plaintiff to the defendant in every case.
        why: Wrong — onus does shift in specific provisions (like the s 5G obvious-risk presumption), but that is not a general consequence of classifying harm as such.
      - text: It has no real consequence — all categories of duty are analysed identically once foreseeability is shown.
        why: Wrong — this is the opposite of the lecture's point; the categories exist precisely because different fact patterns need different extra ingredients beyond foreseeability.
  - key: q013
    type: mcq
    concept: duty-of-care-categories-and-factors
    difficulty: 2
    stem: A manufacturer's factory releases smoke that damages a neighbouring farmer's crops. Which factor group would first flag "manufacturer and consumer" as inapplicable here?
    options:
      - text: Who is the defendant — because the farmer is a neighbour, not a consumer of the manufacturer's product.
        correct: true
        why: Correct — the special relationship named on the slide is manufacturer and consumer of the product, not manufacturer and any nearby landholder, so that label does not fit these facts.
      - text: How the harm was caused — because smoke can never count as an act or an omission, a factor courts have sometimes weighed in related but distinct areas of negligence.
        why: Wrong — smoke escaping is capable of being classified as an act or omission just like any other conduct; that is not the reason "manufacturer and consumer" is the wrong label.
      - text: What is the nature of the harm — because crop damage can never be physical harm.
        why: Wrong — damage to crops is a form of property/physical damage, so the nature-of-harm factor does not rule the manufacturer-consumer label out here.
  - key: q014
    type: mcq
    concept: duty-of-care-categories-and-factors
    difficulty: 4
    stem: An ILAC answer classifies a fact pattern as "an act causing physical harm to a stranger" and stops there before discussing breach. What is the strongest criticism of stopping there?
    options:
      - text: Classification only tells you which further rules apply — it does not itself establish duty, breach or causation, all of which still need separate analysis.
        correct: true
        why: Correct and the point of this concept — the three-factor checklist is a sorting step, not a substitute for running the full negligence analysis once the right rules are identified.
      - text: Nothing is wrong — once harm is classified as physical and caused by an act, duty is automatically established.
        why: Wrong — this is precisely the mistake the concept warns against; classification narrows down which rules apply, it does not prove duty exists.
      - text: The classification is wrong because physical harm caused by an act can never occur between strangers.
        why: Wrong — physical harm caused by an act between strangers (for example, a careless driver hitting a pedestrian) is the paradigm negligence case, not an impossible combination.
  - key: q015
    type: mcq
    concept: duty-of-care-categories-and-factors
    difficulty: 3
    contrasts-with: [omissions-and-control-of-others]
    stem: A lifeguard on duty at a beach fails to notice a swimmer in distress. A stranger walking past also fails to notice and help. Which classification difference is most important between the two?
    options:
      - text: The lifeguard is in a special relationship (akin to occupier/employee duties) that can turn their omission into a breach of an existing duty, unlike the stranger who owes no duty to rescue at all.
        correct: true
        why: Correct — this is exactly the discrimination this week draws between omissions generally (no duty to rescue) and omissions by someone in a special relationship with a pre-existing duty.
      - text: There is no difference — neither the lifeguard nor the stranger can ever be liable for a failure to rescue, which sounds like the kind of consideration a court might otherwise take into account, a rule that would need to be read together with the general principles of negligence.
        why: Wrong — this collapses the very distinction the material draws; a person in a special relationship (like an on-duty lifeguard) can be liable for an omission in a way a passing stranger is not.
      - text: The stranger is liable because everyone owes a general duty to rescue at common law.
        why: Wrong — the lecture states there is generally no legal duty to rescue, so a stranger who merely fails to help commits no tort on that basis alone.
  - key: q016
    type: mcq
    concept: duty-of-care-categories-and-factors
    difficulty: 4
    contrasts-with: [psychiatric-harm-common-law-development]
    stem: A witness to a serious car accident develops a diagnosed psychiatric illness after seeing a stranger badly injured. Under the "nature of the harm" factor, why can this claim not simply be treated the same way as a physical-injury claim?
    options:
      - text: Because pure psychiatric harm needs its own reasonable-foreseeability inquiry (and in NSW, the CLA's Part 3 tests) that a straightforward physical-injury claim does not.
        correct: true
        why: Correct — this is exactly why "nature of the harm" is one of the three sorting factors; psychiatric harm carries extra requirements physical harm does not.
      - text: Because psychiatric harm suffered by a witness can never be compensated in Australian law.
        why: Wrong — this week's material (Tame, Annetts, Wicks) shows psychiatric harm to bystanders and rescuers is compensable, subject to extra requirements, not automatically excluded.
      - text: Because physical-injury claims also require proof of a recognised medical diagnosis in the same way psychiatric claims do, a rule that would need to be read together with the general principles of negligence.
        why: Wrong — a recognised psychiatric illness is a specific requirement for psychiatric harm (CLA s 31); ordinary physical-injury claims do not need a diagnosed illness in the same sense.
  - key: q017
    type: mcq
    concept: duty-of-care-categories-and-factors
    difficulty: 2
    stem: A public transport authority's rostering error leaves a level crossing unsupervised, and a car is struck by a train. Which of the three factor groups is most directly engaged by the words "public transport authority"?
    options:
      - text: Who is the defendant.
        correct: true
        why: Correct — "public transport authority" answers the "who is the defendant" question, flagging that statutory powers and resources (as in Romeo and Graham Barclay Oysters) may be relevant.
      - text: What is the nature of the harm.
        why: Wrong — the nature of the harm here is the physical damage from the collision, which is a separate question from who the defendant is.
      - text: How the harm was caused.
        why: Wrong — a rostering error causing an unsupervised crossing is a question about act or omission, which is a different factor group from identifying who the defendant is.
  # quickfire (set: quickfire) for concept 1
  - key: q018
    type: truefalse
    set: quickfire
    concept: duty-of-care-categories-and-factors
    statement: The lecture treats physical harm, psychiatric harm and pure economic loss as the three kinds of harm that may follow a breach of duty.
    answer: true
    why: True — the slide "Duty of care and types of harm" lists exactly these three categories of harm as the possible results of a breach of a potential duty of care.
  - key: q019
    type: truefalse
    set: quickfire
    concept: duty-of-care-categories-and-factors
    statement: Whether the defendant is a private individual or a public authority is treated as irrelevant to classifying a duty-of-care case.
    answer: false
    why: False — the lecture expressly lists "who is the defendant" (private individual or public authority, and any special relationship) as one of the three groups of relevant factors.
  - key: q020
    type: truefalse
    set: quickfire
    concept: duty-of-care-categories-and-factors
    statement: Occupier and entrant, employer and employee, and manufacturer and consumer are all given as examples of a "special relationship" relevant to duty of care.
    answer: true
    why: True — the slide lists all three of these pairings as examples of a special relationship between plaintiff and defendant that bears on duty of care.
  # ---------- Concept 2: omissions-and-control-of-others ----------
  - key: q021
    type: mcq
    concept: omissions-and-control-of-others
    difficulty: 1
    set: pretest
    stem: In Hargrave v Goldman, what four factors does the material identify as relevant to a duty of care arising from an omission?
    options:
      - text: Reasonable foreseeability, the occupier-neighbour special relationship, knowledge of the danger, and control over it.
        correct: true
        why: Correct — these are the exact four factors the slide lists for Hargrave v Goldman's omission scenario (a fire left to burn out that later revived and spread).
      - text: Reasonable foreseeability, the defendant's wealth, the plaintiff's age, and the time of year.
        why: Wrong — none of wealth, age or the season appears anywhere in the material as a relevant factor for an omission-based duty in Hargrave v Goldman.
      - text: Proximity of the parties, moral culpability, the size of the fire, and insurance cover.
        why: Tempting because these sound like negligence-flavoured concepts, but the slide's own list for Hargrave v Goldman is foreseeability, special relationship, knowledge and control — not this list.
  - key: q022
    type: mcq
    concept: omissions-and-control-of-others
    variant-of: q021
    difficulty: 2
    stem: A farmer notices a bushfire smouldering on a neighbour's boundary but does nothing, and it later spreads to destroy the farmer's own crops instead. Applying Hargrave v Goldman's factors to the neighbour who did nothing, what is missing to found a duty if the neighbour did not even know of the fire?
    options:
      - text: Knowledge of the danger — without it, the neighbour cannot be said to have failed to act on a risk they knew about.
        correct: true
        why: Correct — Hargrave v Goldman's factors require the defendant's knowledge of the danger; a neighbour genuinely unaware of the fire lacks this ingredient, however foreseeable the fire might have been in the abstract.
      - text: Nothing is missing — foreseeability alone is always enough for an omission-based duty.
        why: Wrong — this is precisely what Hargrave v Goldman denies; more than reasonable foreseeability is required for an omission, and the slide adds knowledge and control as separate requirements.
      - text: The special relationship — neighbours can never be in a special relationship with each other, a factor courts have sometimes weighed in related but distinct areas of negligence.
        why: Wrong — Hargrave v Goldman itself treats occupier-neighbour as exactly the kind of special relationship capable of founding an omission-based duty; the missing element here is knowledge, not the relationship.
  - key: q023
    type: mcq
    concept: omissions-and-control-of-others
    difficulty: 2
    stem: What was the basis of the occupier's duty in relation to the state of the premises, according to Gleeson CJ in Modbury Triangle Shopping Centre v Anzil?
    options:
      - text: Control over, and knowledge of, the state of the premises.
        correct: true
        why: Correct — this is Gleeson CJ's own formulation, quoted directly in the material, of what grounds an occupier's duty regarding the condition of premises.
      - text: The occupier's insurance arrangements and financial capacity to pay damages.
        why: Wrong — nothing in Gleeson CJ's reasoning ties the occupier's duty to their insurance or financial capacity; that plays no role in the stated basis of the duty.
      - text: The number of previous visitors who had used the premises without incident.
        why: Wrong — this is not the test Gleeson CJ articulates; the basis he gives is control over and knowledge of the premises, not a visitor headcount.
  - key: q024
    type: mcq
    concept: omissions-and-control-of-others
    difficulty: 3
    stem: Why did the shopping centre's duty of care in Modbury Triangle v Anzil NOT extend to protecting Anzil from the criminal attack in the car park?
    options:
      - text: Because the centre had no control over the third-party criminals, and neither reliance nor an assumption of responsibility was made out on the facts.
        correct: true
        why: Correct — the High Court held control over premises is not control over the people who commit crimes on them, and rejected both reliance and assumption of responsibility as alternative bases for a duty here.
      - text: Because Anzil was not lawfully on the land at the time of the attack.
        why: Wrong — Anzil was an employee walking to his car after work, lawfully on the premises; his status as a lawful entrant was not in dispute.
      - text: Because occupiers can never owe any duty of care regarding car park lighting, which sounds like the kind of consideration a court might otherwise take into account.
        why: Wrong — the Court accepted the centre owed a duty in relation to the physical state and condition of the car park; the issue was the different, further duty to prevent third-party crime.
  - key: q025
    type: mcq
    concept: omissions-and-control-of-others
    variant-of: q024
    difficulty: 3
    contrasts-with: [occupiers-liability-and-obvious-risk]
    stem: A backpacker hostel keeps its front security gate locked every night except the one night it breaks, on which a stranger enters and assaults a guest. On Modbury Triangle reasoning, what would most strengthen a duty argument against the hostel here, compared with the shopping centre in Modbury itself?
    options:
      - text: Evidence that similar break-ins had happened before, giving the criminal conduct a high degree of foreseeability and predictability that was absent on Modbury's facts.
        correct: true
        why: Correct — Gleeson CJ in Modbury left open that a duty may arise where criminal conduct has a high degree of foreseeability and predictability, which is exactly the kind of evidence that would distinguish a one-off attack from a known recurring risk.
      - text: Evidence that the hostel is a private business rather than a public authority.
        why: Wrong — Modbury itself involved a private shopping centre, so the private/public distinction does not explain any difference in outcome between the two scenarios.
      - text: Evidence that the assault caused psychiatric rather than physical harm to the guest.
        why: Wrong — switching the type of harm to psychiatric would raise entirely different (CLA Part 3) issues; it would not itself strengthen an argument about the scope of an occupier's duty over third-party crime.
  - key: q026
    type: mcq
    concept: omissions-and-control-of-others
    difficulty: 2
    stem: Which statement best reflects the general common law position on a duty to rescue, as stated in this week's material?
    options:
      - text: There is generally no legal duty to rescue, as illustrated by the High Court finding no duty owed to a person apparently preparing to take his own life.
        correct: true
        why: Correct — the lecture states this as the general rule and gives the example of police owing no duty of care in that scenario.
      - text: Every capable bystander owes a legal duty to attempt a rescue whenever it is safe to do so, which could otherwise be relevant to a related cause of action on different facts.
        why: Wrong — this is the opposite of the position the lecture states; there is no general duty to rescue at common law.
      - text: A duty to rescue arises only for off-duty police officers, but not for any other bystander.
        why: Wrong — the material's example involves on-duty police and is used to show no duty to rescue existed at all, not to carve out an exception for off-duty officers.
  - key: q027
    type: mcq
    concept: omissions-and-control-of-others
    difficulty: 1
    stem: Under ss 55–58 of the Civil Liability Act, who counts as a "good samaritan"?
    options:
      - text: A person who, in good faith and without expectation of payment or other reward, comes to the assistance of a person apparently injured or at risk of being injured.
        correct: true
        why: Correct — this is the exact statutory definition in s 56 of the good samaritan provisions.
      - text: Any person who happens to be present at the scene of an accident, regardless of whether they help, though the weight given to this would depend heavily on the tribunal of fact.
        why: Wrong — merely being present is not enough; s 56 requires the person to actually come to the assistance of someone apparently injured or at risk, in good faith and without expectation of reward.
      - text: Only a qualified first-aider or medical professional who renders assistance.
        why: Wrong — s 56 is not limited to qualified professionals; it applies to any person who in good faith assists someone apparently injured or at risk, regardless of their qualifications.
  - key: q028
    type: mcq
    concept: omissions-and-control-of-others
    difficulty: 2
    stem: When does the good samaritan protection under s 58 of the Civil Liability Act NOT apply?
    options:
      - text: Where it was the good samaritan's own intentional or negligent act or omission that caused the injury or risk they then responded to, or where their care and skill was significantly impaired by voluntary alcohol or drug use.
        correct: true
        why: Correct — s 58 removes the protection in both of these situations, so a person cannot rely on the good samaritan defence for a risk they themselves created, or if impairment caused them to fail to exercise reasonable care and skill.
      - text: Where the good samaritan is a stranger rather than a friend or family member of the injured person.
        why: Wrong — s 58's exclusions have nothing to do with the relationship between the helper and the injured person; a complete stranger is just as protected as a friend, subject to the actual statutory exclusions.
      - text: Where the assistance was rendered outside of business hours.
        why: Wrong — the timing of the assistance (business hours or otherwise) plays no role in whether the s 58 exclusions apply.
  - key: q029
    type: mcq
    concept: omissions-and-control-of-others
    difficulty: 2
    stem: According to this week's material, in what situation might a person be liable for failing to control the conduct of a third party who then harms the plaintiff?
    options:
      - text: Where, for example, a parent fails to control the conduct of their own child.
        correct: true
        why: Correct — the material gives a parent's failure to control their children's conduct as its example of when a person may be liable for failing to control a third party.
      - text: Whenever any adult fails to stop a stranger's crime, regardless of any relationship between them.
        why: Wrong — this overstates the rule; the material's example turns on a specific relationship (parent and child), not a general duty owed by any bystander to control any stranger.
      - text: Only where the third party is a registered employee of the defendant, and in no other circumstance.
        why: Wrong — while an employment relationship can also be relevant to controlling third-party conduct, the material's own example is the parent-child relationship, not employment specifically.
  - key: q030
    type: mcq
    concept: omissions-and-control-of-others
    difficulty: 3
    stem: A backyard swimming-pool owner sees a neighbour's toddler wander unsupervised through an open gate towards the pool, but does nothing, and the child is later injured. Applying this week's control/knowledge framework, what is the strongest argument for a duty here?
    options:
      - text: As occupier, the owner had knowledge of an obvious specific danger (the pool) and control over the premises (the gate), which together can found a duty to take reasonable steps, unlike a stranger with no connection to the property.
        correct: true
        why: Correct application of the Hargrave v Goldman-style factors — the owner's status as occupier gives the special relationship, and their actual knowledge and physical control over the gate supply the extra ingredients an omission needs.
      - text: There is no possible duty, because there is generally no duty to rescue and that rule has no exceptions, which would still need to be established on the facts before any liability could follow, a factor courts have sometimes weighed in related but distinct areas of negligence.
        why: Wrong — the "no duty to rescue" rule is a general starting point, but this week's material shows it gives way where a special relationship, knowledge and control (as with an occupier over their own premises) are present.
      - text: The duty depends solely on whether the toddler's parents were also negligent in supervising the child.
        why: Wrong — the parents' own conduct might be relevant to contributory negligence, but it is not what determines whether the pool owner independently owed a duty based on their own knowledge and control.
  - key: q031
    type: mcq
    concept: omissions-and-control-of-others
    difficulty: 4
    contrasts-with: [occupiers-liability-and-obvious-risk]
    stem: Which of the following best explains why Hargrave v Goldman and Modbury Triangle v Anzil can both be described as "omission" cases, yet reach different outcomes on duty?
    options:
      - text: In Hargrave, the defendant had knowledge and control over the very source of danger (the fire on their land); in Modbury, the defendant had control over the premises but not over the independent criminal actors who caused the harm.
        correct: true
        why: Correct — this is the key distinguishing feature this week draws out, namely control over the risk itself (Hargrave) versus control over premises but not over a third party's independent choices (Modbury).
      - text: Hargrave was decided under the Civil Liability Act, while Modbury was decided purely at common law, so the tests were completely different, a factor courts have sometimes weighed in related but distinct areas of negligence, though this would need to be supported by clear evidence in the specific case.
        why: Wrong — nothing in the material suggests Hargrave was a Civil Liability Act case; both are common law negligence cases, so the CLA is not what distinguishes them.
      - text: The two cases cannot be meaningfully compared because one involves fire and the other involves a shopping centre.
        why: Wrong — the whole point of grouping them together in this week's material is that the same control/knowledge framework applies across very different facts, allowing a meaningful comparison.
  - key: q032
    type: mcq
    concept: omissions-and-control-of-others
    difficulty: 3
    stem: A off-duty nurse witnesses a stranger collapse in a park and, acting in good faith without expecting payment, performs CPR but does so with mild negligence, worsening a rib injury. Which of the following most accurately applies ss 55–58 CLA?
    options:
      - text: The nurse is likely a good samaritan under s 56, and s 57 protects her from personal liability for the emergency response, provided none of the s 58 exclusions (creating the risk, or impairment) apply.
        correct: true
        why: Correct — she fits the s 56 definition (good faith, no expectation of reward, assisting someone apparently injured), so s 57's protection applies unless a s 58 exclusion is triggered, and nothing here suggests one is.
      - text: The nurse automatically loses all protection the moment her response is negligent in any way.
        why: Wrong — s 57 is specifically designed to protect a good samaritan's acts or omissions, including negligent ones, in an emergency; only the s 58 exclusions (self-created risk, or impairment) remove that protection.
      - text: Ss 55–58 only apply to registered medical professionals acting within their formal duties, so an off-duty nurse gets no protection.
        why: Wrong — the s 56 definition of good samaritan is not limited to registered professionals or to acts within a formal duty; it covers any person assisting in good faith without expectation of reward.
  - key: q033
    type: mcq
    concept: omissions-and-control-of-others
    difficulty: 2
    stem: What did Gleeson CJ say might, in some circumstances, give rise to a duty to take reasonable steps against third-party criminal conduct, even though none arose on Modbury's own facts?
    options:
      - text: Criminal conduct that has a high degree of foreseeability and predictability.
        correct: true
        why: Correct — Gleeson CJ specifically flagged this possibility, asking whether there were past criminal activities in the case, even while finding against a duty on Modbury's own facts.
      - text: Any criminal conduct at all, regardless of how unpredictable or unprecedented it was.
        why: Wrong — this overstates Gleeson CJ's qualification, which was expressly limited to conduct with a high degree of foreseeability and predictability, not any criminal act whatsoever.
      - text: The mere fact that the occupier carries public liability insurance.
        why: Wrong — insurance coverage is not mentioned anywhere in Gleeson CJ's reasoning as a basis for extending the duty to cover third-party crime.
  - key: q034
    type: mcq
    concept: omissions-and-control-of-others
    difficulty: 1
    stem: Which case does this week's material use to illustrate that a person may be liable for failing to exercise care over the conduct of another, even though the full facts and citation of that case were not given?
    options:
      - text: The Dorset Yacht case.
        correct: true
        why: Correct — the lecture mentions the Dorset Yacht case by name as illustrating liability for failing to control the conduct of others, without providing its citation or facts in this week's slides.
      - text: Wicks v State Rail Authority (NSW).
        why: Wrong — Wicks is a fully cited psychiatric-harm case about the Civil Liability Act, not the case used to illustrate controlling the conduct of others.
      - text: Romeo v Conservation Commission (NT).
        why: Wrong — Romeo is about an occupier's duty and obvious risk on a cliff-top reserve, not about controlling the conduct of a third party.
  - key: q035
    type: mcq
    concept: omissions-and-control-of-others
    difficulty: 4
    stem: A community hall's caretaker notices the fire exit sign has been broken for months but never reports it, and a patron is later injured finding the exit in a fire. Which combination of Hargrave v Goldman factors is most clearly satisfied here?
    options:
      - text: Knowledge (the caretaker knew of the fault) and a special relationship (occupier/employee to entrant), leaving control and foreseeability as the remaining questions of fact for a court to weigh.
        correct: true
        why: Correct — the facts squarely establish knowledge and a special relationship; whether the caretaker or hall had sufficient control over fixing the sign, and whether the risk of harm was reasonably foreseeable, would still need to be assessed on the evidence.
      - text: None of the four factors are satisfied, because a broken sign can never be a relevant danger, which could otherwise be relevant to a related cause of action on different facts, though the weight given to this would depend heavily on the tribunal of fact.
        why: Wrong — a broken fire exit sign is exactly the kind of danger this framework is designed to capture; dismissing it outright ignores the facts given.
      - text: All four factors are automatically satisfied simply because the caretaker works at the hall.
        why: Wrong — employment alone does not automatically establish every factor; foreseeability and control still need to be examined on the specific facts, not assumed from the caretaker's job title.
  - key: q036
    type: mcq
    concept: omissions-and-control-of-others
    difficulty: 2
    stem: Which of the following is closest to how the lecture frames an occupier's duty regarding conduct of third parties on their land?
    options:
      - text: An occupier of land owes a duty to take reasonable care to protect lawful entrants, including from the conduct of third parties, though the scope of that duty is limited (as Modbury shows).
        correct: true
        why: Correct — the lecture states occupiers owe entrants a duty including protection from third-party conduct, while Modbury demonstrates that this duty has real limits absent control, reliance or high foreseeability.
      - text: An occupier owes no duty whatsoever regarding the conduct of any third party on their land.
        why: Wrong — this contradicts the lecture's own statement that an occupier's duty includes taking reasonable care to protect entrants from third-party conduct, at least in some circumstances.
      - text: An occupier's duty regarding third parties is identical in scope to their duty regarding the physical condition of the premises, though the weight given to this would depend heavily on the tribunal of fact.
        why: Wrong — Modbury draws a clear distinction between the duty over the state of the premises (which the centre had) and a separate, more limited duty over unpredictable third-party crime (which it did not).
  - key: q037
    type: short
    concept: omissions-and-control-of-others
    difficulty: 3
    prompt: |
      "There is generally no duty to rescue or to control the conduct of others." Using Hargrave v Goldman and
      Modbury Triangle Shopping Centre v Anzil, explain what extra ingredients can turn this general rule around,
      and why they were present in one case but not the other.
    model: |
      The general common law position is that there is no duty to rescue and no duty to control a third party's
      conduct — foreseeability of harm is not, by itself, enough to found a duty based on an omission. Hargrave v
      Goldman identifies the extra ingredients that can displace this rule: reasonable foreseeability of the risk,
      a special relationship between the parties (there, occupier and neighbour), the defendant's knowledge of
      the danger, and their practical control over it. On the facts of Hargrave, the landowner knew a fire he had
      only partially extinguished remained on his land and could still be controlled by him, which combined with
      the occupier-neighbour relationship to found a duty. Modbury Triangle Shopping Centre v Anzil shows the
      limits of this reasoning: although the shopping centre, as occupier, had control over and knowledge of the
      state of its own premises (the car park lighting), it had no control over the independent criminal conduct
      of the men who attacked Anzil. Gleeson CJ held that control over premises is not the same as control over
      the people who might commit crimes there, and neither reliance nor an assumption of responsibility (the
      centre's practice of lighting the car park) extended to a responsibility to prevent criminal attacks. The
      difference between the two cases is therefore that in Hargrave the defendant controlled the actual source
      of the danger, while in Modbury the defendant controlled only the premises, not the third party whose
      independent choice caused the harm — though Gleeson CJ left open that a duty might arise if criminal
      conduct had a high degree of foreseeability and predictability, which was not shown on Modbury's facts.
    rubric:
      - id: r1
        criterion: States the general rule (no duty to rescue/control others) accurately.
        marks: 2
        top-band: Clearly states both the no-duty-to-rescue and no-duty-to-control-third-parties limbs, and notes foreseeability alone is insufficient.
        margin-note: Good — you've set up the default rule before explaining the exceptions.
        authorities: []
      - id: r2
        criterion: Identifies the Hargrave v Goldman factors (foreseeability, special relationship, knowledge, control).
        marks: 3
        top-band: Names all four factors and applies each to Hargrave's facts (occupier-neighbour, knowledge of the fire, control over it).
        margin-note: Make sure you connect each factor to the actual facts, not just list them.
        authorities: []
      - id: r3
        criterion: Explains why Modbury did not satisfy the same factors, focusing on control over the third party.
        marks: 3
        top-band: Precisely distinguishes control over premises from control over a third party's independent criminal choice, quoting or paraphrasing Gleeson CJ.
        margin-note: This is the crux of the answer — reward precision here.
        authorities: []
      - id: r4
        criterion: Notes the Gleeson CJ qualification (foreseeability/predictability of criminal conduct) as a possible route to a duty.
        marks: 2
        top-band: Explicitly notes this as an unresolved possibility, not a rule applied on Modbury's own facts.
        margin-note: A strong answer flags this nuance rather than treating Modbury as an absolute rule.
        authorities: []
  # quickfire (set: quickfire) for concept 2
  - key: q038
    type: truefalse
    set: quickfire
    concept: omissions-and-control-of-others
    statement: According to Hargrave v Goldman, reasonable foreseeability alone is sufficient to establish a duty of care based on an omission.
    answer: false
    why: False — the material states more than reasonable foreseeability is required for an omission; a special relationship, knowledge of the danger, and control over it are also needed.
  - key: q039
    type: truefalse
    set: quickfire
    concept: omissions-and-control-of-others
    statement: In Modbury Triangle Shopping Centre v Anzil, the High Court held the shopping centre's duty of care extended to protecting Anzil from the criminal conduct of third parties.
    answer: false
    why: False — the High Court, by majority, held the duty did not extend that far, because the centre had no control over the independent criminal conduct of the attackers.
  - key: q040
    type: truefalse
    set: quickfire
    concept: omissions-and-control-of-others
    statement: A good samaritan under s 56 of the Civil Liability Act must act in good faith and without expectation of payment or other reward.
    answer: true
    why: True — this is part of the exact statutory definition of a good samaritan in s 56 of the Civil Liability Act.
  # ---------- Concept 3: occupiers-liability-and-obvious-risk ----------
  - key: q041
    type: mcq
    concept: occupiers-liability-and-obvious-risk
    difficulty: 1
    set: pretest
    stem: In Romeo v Conservation Commission (NT), what did the High Court hold about the scope of the Commission's duty of care?
    options:
      - text: The Commission owed entrants a duty to take reasonable care against foreseeable risks, but that duty did not extend to fencing the cliff edge, because the danger was obvious.
        correct: true
        why: Correct — the majority accepted the duty existed but held it was not breached, since fencing an obvious natural hazard along an entire coastline was not required.
      - text: The Commission owed no duty of care to entrants at all, because the reserve was Crown land.
        why: Wrong — the Court accepted a duty existed (to take reasonable steps against foreseeable risks); the case turned on the scope of that duty, not its non-existence.
      - text: The Commission breached its duty by not employing a permanent lifeguard at the cliff top.
        why: Wrong — this was never the alleged breach in Romeo; the claim concerned the failure to fence or warn of the cliff, not the absence of a lifeguard.
  - key: q042
    type: mcq
    concept: occupiers-liability-and-obvious-risk
    variant-of: q041
    difficulty: 2
    stem: A council manages a lookout with a sheer, unfenced drop that is plainly visible from every angle. A visitor climbs over a low barrier to get a better photo and falls. Applying Romeo, what is the council's strongest defence?
    options:
      - text: The danger was obvious, so the duty of care did not extend to further fencing or warning of a risk that was already plain to see.
        correct: true
        why: Correct — this mirrors Romeo directly, since an occupier's duty does not extend to guarding against a risk that was obvious to a reasonable person in the visitor's position.
      - text: The council owed no duty of care to the visitor because lookouts are inherently dangerous places, which sounds like the kind of consideration a court might otherwise take into account.
        why: Wrong — Romeo does not deny a duty exists; it holds the duty exists but does not extend to protecting against obvious dangers, which is a different and more precise point.
      - text: The visitor's fall was a novus actus interveniens that breaks the chain of causation entirely.
        why: Wrong — this misapplies a causation concept; Romeo's reasoning is about the scope of the duty of care (obvious risk), not about a new intervening act breaking causation.
  - key: q043
    type: mcq
    concept: occupiers-liability-and-obvious-risk
    difficulty: 2
    stem: According to Toohey and Gummow JJ in Romeo, how should the "nature of the danger" be assessed?
    options:
      - text: Before the event, according to its obviousness and the care ordinarily exercised by the public.
        correct: true
        why: Correct — this is their formulation, adopting Brennan J's test from Nagle, and it fixes the assessment at the time before the accident, not with the benefit of hindsight.
      - text: After the event, according to how severe the plaintiff's injuries turned out to be, a rule that would need to be read together with the general principles of negligence.
        why: Wrong — this reverses their test, which is explicitly assessed before the event, not by looking backward at the resulting injury.
      - text: By reference only to whether the defendant had public liability insurance in place.
        why: Wrong — insurance plays no role in Toohey and Gummow JJ's formulation of how the nature of a danger should be assessed.
  - key: q044
    type: mcq
    concept: occupiers-liability-and-obvious-risk
    difficulty: 3
    stem: Kirby J said "it is one thing to hold that a person owes a duty of care of some kind to another. But the critical question is commonly ______." Complete the quotation as given in the material.
    options:
      - text: the measure or scope of that duty.
        correct: true
        why: Correct — this is the exact continuation of Kirby J's quote, distinguishing the existence of a duty from the separate question of its measure or scope.
      - text: whether the plaintiff contributed to their own injury.
        why: Wrong — while contributory negligence is mentioned elsewhere in the Romeo discussion, it is not how this particular quotation from Kirby J continues.
      - text: how much the defendant can afford to pay in damages.
        why: Wrong — the defendant's capacity to pay is not part of Kirby J's point, which is squarely about distinguishing the existence of a duty from its scope.
  - key: q045
    type: mcq
    concept: occupiers-liability-and-obvious-risk
    difficulty: 2
    stem: Why does the material say Romeo is important, beyond its result on the specific facts?
    options:
      - text: It shows duty of care is not owed in the abstract, that the scope of duty borders on breach, and that there is no duty to warn of an obvious (as opposed to concealed) risk.
        correct: true
        why: Correct — these are the three reasons the material gives for Romeo's significance, going well beyond the specific outcome on the Dripstone Cliffs facts.
      - text: It is the only case in Australian law where a public authority has ever been found liable in negligence.
        why: Wrong — this is factually incorrect and not a claim the material makes; Graham Barclay Oysters and Wicks both also involve public bodies, and Romeo's importance lies in its reasoning, not in being unique.
      - text: It abolished the tort of negligence for cases involving natural land features.
        why: Wrong — Romeo does not abolish anything; it refines how duty and its scope are assessed for occupiers of land with obvious natural hazards.
  - key: q046
    type: mcq
    concept: occupiers-liability-and-obvious-risk
    difficulty: 1
    stem: According to s 5F of the Civil Liability Act, which of these can still count as an "obvious risk"?
    options:
      - text: A risk with a low probability of occurring, or one that is not prominent, conspicuous or physically observable.
        correct: true
        why: Correct — s 5F(3)–(4) expressly says a risk can be obvious even with a low probability of occurring, or even if it is not prominent, conspicuous or physically observable.
      - text: Only a risk that is both highly likely to occur and clearly visible to everyone, a standard that appears in some analogous areas of civil liability.
        why: Wrong — this contradicts s 5F(3)–(4) directly, which say obviousness does not depend on high probability or visibility in that narrow sense.
      - text: A risk known only to expert engineers who have inspected the site.
        why: Wrong — s 5F asks whether the risk would be obvious to a reasonable person in the plaintiff's position, not whether it is known to specialist experts.
  - key: q047
    type: mcq
    concept: occupiers-liability-and-obvious-risk
    difficulty: 2
    stem: What is the effect of s 5G of the Civil Liability Act?
    options:
      - text: A person who suffers harm is presumed aware of an obvious risk, unless they prove on the balance of probabilities that they were not aware of it.
        correct: true
        why: Correct — this is precisely the presumption s 5G creates, reversing the practical burden onto the plaintiff to disprove awareness of an obvious risk.
      - text: A defendant is presumed negligent whenever an obvious risk causes harm.
        why: Wrong — s 5G says nothing about presuming the defendant negligent; it is concerned with the plaintiff's presumed awareness of the risk, not the defendant's conduct.
      - text: A plaintiff can never recover damages once a risk is classified as obvious, which a careful advocate might raise as a subsidiary point in argument, though courts have generally treated this as a secondary consideration at most.
        why: Wrong — s 5G only creates a rebuttable presumption of awareness; it does not bar recovery outright, and s 5H (not s 5G) deals with the duty to warn.
  - key: q048
    type: mcq
    concept: occupiers-liability-and-obvious-risk
    difficulty: 3
    stem: Under s 5H, in which of these situations would a defendant still owe a duty to warn of an obvious risk?
    options:
      - text: Where the defendant is a professional and the risk is one of death or personal injury to the plaintiff from the professional service provided.
        correct: true
        why: Correct — s 5H(2)(c) creates exactly this exception, alongside the plaintiff requesting advice and a written law requiring a warning.
      - text: Whenever the defendant is aware that the risk exists, regardless of any other circumstance.
        why: Wrong — mere awareness by the defendant is not one of the s 5H(2) exceptions; the exceptions are the plaintiff's request for advice, a written-law requirement, or the professional-service scenario.
      - text: Whenever the plaintiff is a first-time visitor to the premises.
        why: Wrong — being a first-time visitor is not one of the s 5H(2) exceptions; the section's exceptions turn on the plaintiff's request, statutory duty, or the professional-service circumstance.
  - key: q049
    type: mcq
    concept: occupiers-liability-and-obvious-risk
    variant-of: q048
    difficulty: 3
    stem: A rock-climbing guide is asked directly by a client, "is this particular handhold safe?" and the guide says nothing about a known crack in it. Does s 5H remove the guide's duty to warn here?
    options:
      - text: No — s 5H(2)(a) removes the general no-duty-to-warn rule where the plaintiff has requested advice or information about the risk from the defendant.
        correct: true
        why: Correct — the client's direct question about the handhold's safety is exactly the kind of request for advice or information that triggers the s 5H(2)(a) exception, reinstating a duty to warn.
      - text: Yes — s 5H always removes a guide's duty to warn of any obvious risk, no matter what the client asks.
        why: Wrong — this ignores the s 5H(2) exceptions; a direct request for advice about the specific risk is precisely the situation in which the section preserves, rather than removes, a duty to warn.
      - text: Yes — because rock climbing is a recreational activity, s 5M automatically removes any duty regardless of what was said, which would still need to be established on the facts before any liability could follow.
        why: Wrong — s 5M requires an actual risk warning to have been given; here, the guide said nothing in response to a direct question, so s 5M's protection would not obviously apply either.
  - key: q050
    type: mcq
    concept: occupiers-liability-and-obvious-risk
    difficulty: 4
    contrasts-with: [sport-and-recreational-injury]
    stem: A national park keeps a bushwalking track with a well-known, clearly signed steep drop beside it, and also runs a rock-climbing excursion with a general safety briefing beforehand. A walker falls at the drop; a climber is hurt on the excursion. Which combination of provisions is most likely relevant to each?
    options:
      - text: The bushwalker's claim is most naturally analysed under the general obvious-risk provisions (ss 5F–5H); the climber's claim is more naturally analysed under the recreational-activity provisions (ss 5L–5M), given the general safety briefing.
        correct: true
        why: Correct — the ordinary obvious-risk regime governs the sign-posted drop, while the specific recreational-activity regime (particularly the risk warning in s 5M) is engaged by the organised climbing excursion and its safety briefing.
      - text: Both claims must be analysed identically under s 5F alone, since the CLA does not distinguish recreational activities from any other kind of premises risk, though this would need to be supported by clear evidence in the specific case, which sounds like the kind of consideration a court might otherwise take into account.
        why: Wrong — Division 5 (ss 5J–5M) exists precisely because the CLA gives dangerous recreational activities their own additional regime, distinct from the general obvious-risk provisions in Division 4.
      - text: Neither claim can succeed, because national parks are immune from all negligence claims under the CLA.
        why: Wrong — nothing in this week's material suggests public authorities running parks are immune from negligence; Romeo itself proceeded to a full hearing against a public authority.
  - key: q051
    type: mcq
    concept: occupiers-liability-and-obvious-risk
    difficulty: 3
    stem: Why did Toohey and Gummow JJ say Angel J (the trial judge in Romeo) distinguished Nagle?
    options:
      - text: Nagle involved a failure to warn of a hidden danger, where a warning sign would have been an effective deterrent, unlike the obvious cliff in Romeo.
        correct: true
        why: Correct — this is the distinction drawn in the material, since Nagle concerned a concealed danger that a warning could have addressed, whereas Romeo's cliff was open and obvious.
      - text: Nagle was a case about product liability, and Romeo was a case about psychiatric harm.
        why: Wrong — this mischaracterises both cases; Nagle and Romeo are both occupiers'-duty/obvious-danger cases, not product liability or psychiatric harm cases.
      - text: Nagle was decided after Romeo, so it could not have been considered by the trial judge.
        why: Wrong — Nagle is treated in the material as an earlier authority that Angel J and the High Court considered and distinguished in deciding Romeo, not a later case.
  - key: q052
    type: mcq
    concept: occupiers-liability-and-obvious-risk
    difficulty: 2
    stem: A shopping strip has a small, discoloured patch of pavement that looks identical to the surrounding concrete but is in fact a barely perceptible pothole. A shopper trips on it. How would s 5F likely treat this risk?
    options:
      - text: It would likely NOT be an obvious risk, since it is not the kind of danger that would have been obvious to a reasonable person in the shopper's position.
        correct: true
        why: Correct — s 5F asks whether the risk would have been obvious to a reasonable person in the plaintiff's position; a pothole disguised to look like ordinary pavement fails that test, unlike Romeo's plainly visible cliff.
      - text: It would automatically be an obvious risk, because all defects in paving are treated as obvious under s 5F.
        why: Wrong — s 5F does not create a blanket rule that all paving defects are obvious; obviousness depends on whether a reasonable person in the plaintiff's position would have noticed it, which a disguised pothole fails.
      - text: Section 5F is irrelevant because it only applies to natural land features like cliffs, not to constructed surfaces like pavement, a rule that would need to be read together with the general principles of negligence.
        why: Wrong — s 5F applies generally to any risk in negligence proceedings; it is not limited to natural features such as the cliff in Romeo.
  - key: q053
    type: mcq
    concept: occupiers-liability-and-obvious-risk
    difficulty: 4
    stem: A visitor to a lookout, familiar with the area from many previous visits, argues that a warning sign should have been erected regardless of their own familiarity. Applying Romeo, what is the strongest response?
    options:
      - text: A warning sign might assist someone unfamiliar with the area, but the material notes it "would serve no purpose" for someone as familiar with the danger as this visitor.
        correct: true
        why: Correct — this reflects the material's own reasoning, since the value of a warning sign is assessed against the entrant's actual familiarity, and a sign adds nothing for someone who already knows about the danger.
      - text: Warning signs are always legally required at any lookout regardless of visitor familiarity, so the response must fail, which could otherwise be relevant to a related cause of action on different facts.
        why: Wrong — Romeo does not impose a blanket requirement for warning signs at every lookout; whether a sign would serve any purpose depends on the entrant's actual familiarity with the danger.
      - text: The visitor's familiarity is irrelevant because s 5H removes the duty to warn only for first-time visitors.
        why: Wrong — s 5H's obvious-risk exception is not limited to first-time visitors; it removes the general duty to warn of obvious risks regardless of how familiar or unfamiliar any particular entrant is.
  - key: q054
    type: mcq
    concept: occupiers-liability-and-obvious-risk
    difficulty: 3
    stem: What is the practical effect of s 5G's presumption when a plaintiff sues over an obvious risk?
    options:
      - text: It shifts the practical burden onto the plaintiff to prove, on the balance of probabilities, that they did not actually know of the risk.
        correct: true
        why: Correct — s 5G presumes awareness of an obvious risk unless the plaintiff proves otherwise, so in practice the plaintiff must displace that presumption with evidence.
      - text: It requires the defendant to prove the plaintiff did not know of the risk before any claim can proceed.
        why: Wrong — this reverses the actual operation of s 5G, which presumes the plaintiff's awareness and puts the onus on the plaintiff, not the defendant, to disprove it.
      - text: It has no practical effect, since awareness of a risk was never relevant to a negligence claim before this section existed.
        why: Wrong — awareness of risk is highly relevant (for example, to obvious-risk defences and to any contributory negligence or assumption-of-risk arguments), so s 5G's presumption has a real practical effect on how that issue is proven.
  - key: q055
    type: mcq
    concept: occupiers-liability-and-obvious-risk
    difficulty: 2
    stem: Which of these is closest to the reasoning the High Court gave for not requiring the Commission to fence the entire coastline in Romeo?
    options:
      - text: Fencing an obvious natural hazard along around two kilometres of cliff would not be a reasonable step, given the danger was obvious to entrants exercising ordinary care.
        correct: true
        why: Correct — the material states reasonable steps "did not extend to fencing off or illuminating the edge of a cliff which was about 2 km in length," precisely because the danger was obvious.
      - text: Fencing would have been too expensive for any public authority to ever justify, regardless of the nature of the risk, a standard that appears in some analogous areas of civil liability.
        why: Wrong — cost is not the stated basis of the Court's reasoning in this material; the emphasis is squarely on the obviousness of the danger, not a general cost argument.
      - text: The Commission had no legal power to erect fences on the reserve at all.
        why: Wrong — nothing in the material suggests the Commission lacked the legal power to fence the reserve; the issue was whether reasonable care required it to do so, not whether it was legally able to.
  - key: q056
    type: mcq
    concept: occupiers-liability-and-obvious-risk
    difficulty: 1
    stem: Which three sections of the Civil Liability Act deal specifically with "obvious risk" in this week's material?
    options:
      - text: Sections 5F, 5G and 5H.
        correct: true
        why: Correct — these are exactly the three sections covered this week for obvious risk, defining it, presuming awareness of it, and removing the duty to warn of it.
      - text: Sections 30, 31 and 32.
        why: Wrong — these sections deal with mental harm under Part 3 of the CLA, not obvious risk, which is covered separately in ss 5F–5H.
      - text: Sections 55, 57 and 58.
        why: Wrong — these sections are the good samaritan provisions, not the obvious risk provisions, which are found in ss 5F–5H.
  - key: q057
    type: short
    concept: occupiers-liability-and-obvious-risk
    difficulty: 3
    prompt: |
      Using Romeo v Conservation Commission (NT) and ss 5F–5H of the Civil Liability Act, explain how an occupier
      of land can owe entrants a duty of care while still not being in breach of it for failing to warn of, or
      fence against, a dangerous natural feature.
    model: |
      Romeo v Conservation Commission (NT) draws a sharp distinction between the existence of a duty of care and
      its scope. The High Court accepted, as Kirby J and Toohey and Gummow JJ both recognised, that the Commission
      owed entrants to the reserve a general duty to take reasonable care against reasonably foreseeable risks of
      injury; foreseeability and proximity were plainly satisfied on the facts. But Kirby J stressed that "the
      critical question is commonly the measure or scope of that duty," not whether a duty exists at all. Toohey
      and Gummow JJ held that this duty did not extend to fencing off an area of natural beauty where the presence
      of a cliff was obvious, because the nature of a danger must be assessed "according to its obviousness and
      the care ordinarily exercised by the public" — a test drawn from Brennan J's dissent in Nagle. Because the
      cliff edge was plainly visible and the risk of falling was obvious to a reasonable entrant, a warning sign
      would have served no purpose for someone already aware of the danger, and fencing an entire two-kilometre
      stretch of coastline was not a reasonable response to an obvious risk. The Civil Liability Act now codifies
      this reasoning. Section 5F defines an "obvious risk" objectively, as one that would have been obvious to a
      reasonable person in the plaintiff's position, even if it has a low probability of occurring or is not
      conspicuous. Section 5G presumes the plaintiff was aware of any such obvious risk unless they prove
      otherwise on the balance of probabilities, effectively placing the practical burden on the plaintiff.
      Section 5H then removes the proactive duty to warn of an obvious risk altogether, subject only to narrow
      exceptions: where the plaintiff specifically requested advice about the risk, where a written law requires
      a warning, or where the defendant is a professional and the risk is one of death or personal injury arising
      from a professional service. Together, Romeo and ss 5F–5H mean an occupier can owe a general duty of care to
      entrants and yet not breach it, because the specific step the plaintiff says should have been taken (a
      fence or a warning) was never required once the danger was obvious.
    rubric:
      - id: r1
        criterion: Distinguishes the existence of a duty from its scope, using Kirby J's language.
        marks: 2
        top-band: Explicitly quotes or closely paraphrases Kirby J's "measure or scope" point and applies it to the facts.
        margin-note: This distinction is the heart of Romeo — reward it clearly.
        authorities: []
      - id: r2
        criterion: States the Romeo test for assessing the nature of a danger (obviousness, care ordinarily exercised).
        marks: 2
        top-band: Accurately states the Toohey and Gummow JJ formulation and links it to Brennan J's test in Nagle.
        margin-note: Good use of the exact judicial language.
        authorities: []
      - id: r3
        criterion: Explains ss 5F, 5G and 5H accurately and connects each to the common law reasoning in Romeo.
        marks: 4
        top-band: Correctly states all three provisions and shows how each statutory rule tracks a specific step in Romeo's reasoning.
        margin-note: Strong statutory integration — this is exactly what an exam answer needs.
        authorities: [civil-liability-act-2002-nsw-s5f, civil-liability-act-2002-nsw-s5g, civil-liability-act-2002-nsw-s5h]
      - id: r4
        criterion: Draws the overall conclusion that duty can exist without breach where the risk is obvious.
        marks: 2
        top-band: Clearly ties the analysis together into the conclusion the question asks for, rather than leaving it implicit.
        margin-note: Don't forget to answer the question directly at the end.
        authorities: []
  # quickfire (set: quickfire) for concept 3
  - key: q058
    type: truefalse
    set: quickfire
    concept: occupiers-liability-and-obvious-risk
    statement: In Romeo v Conservation Commission (NT), the High Court held the Commission breached its duty of care by failing to fence the cliff.
    answer: false
    why: False — the majority held the Commission was not in breach, because the danger was obvious and fencing the entire coastline was not a reasonable step.
  - key: q059
    type: truefalse
    set: quickfire
    concept: occupiers-liability-and-obvious-risk
    statement: Section 5F of the Civil Liability Act says a risk cannot be "obvious" if it has a low probability of occurring.
    answer: false
    why: False — s 5F(3) says the opposite, that a risk can be obvious even though it has a low probability of occurring.
  - key: q060
    type: truefalse
    set: quickfire
    concept: occupiers-liability-and-obvious-risk
    statement: Section 5H removes a defendant's duty to warn of an obvious risk in every circumstance, without exception.
    answer: false
    why: False — s 5H(2) provides exceptions, including where the plaintiff requested advice, a written law requires a warning, or the defendant is a professional and the risk is one of death or personal injury from a professional service.
  # ---------- Concept 4: product-liability-duty-of-care ----------
  - key: q061
    type: mcq
    concept: product-liability-duty-of-care
    difficulty: 1
    set: pretest
    stem: Before Donoghue v Stevenson, what was the position for the owner of "non-dangerous things" that turned out to cause harm?
    options:
      - text: No duty existed to take precautions against non-dangerous things causing harm, unlike the duty that already existed for "dangerous things".
        correct: true
        why: Correct — the material states that until Donoghue, a duty existed only for dangerous things, and no equivalent duty existed for non-dangerous things.
      - text: Manufacturers of non-dangerous things were strictly liable for any harm those things caused, without any need to prove fault, a rule that would need to be read together with the general principles of negligence.
        why: Wrong — this describes something closer to strict liability, which is the opposite of the pre-Donoghue position described in the material, where no duty existed at all for non-dangerous things.
      - text: The position was identical to that for dangerous things — a duty always existed regardless of the nature of the thing.
        why: Wrong — the material explicitly distinguishes dangerous things (where a duty existed) from non-dangerous things (where none did) before Donoghue changed the law.
  - key: q062
    type: mcq
    concept: product-liability-duty-of-care
    variant-of: q061
    difficulty: 2
    stem: What changed for product-liability duty of care after Donoghue v Stevenson and Grant v Australian Knitting Mills?
    options:
      - text: The ordinary principles of negligence became a basis for liability in relation to defective products generally, not just "dangerous things".
        correct: true
        why: Correct — the material states that after Donoghue and Grant, ordinary negligence principles could found liability for defective products more broadly, ending the old dangerous/non-dangerous distinction.
      - text: Liability for defective products moved entirely out of the law of tort and into contract law only.
        why: Wrong — the material describes negligence liability sitting alongside contract, sale of goods and consumer-protection legislation, not replacing tort with contract entirely.
      - text: Manufacturers became immune from any negligence claims once a product left their factory.
        why: Wrong — this is the opposite of the actual development; Donoghue and Grant expanded, rather than eliminated, the availability of negligence claims against manufacturers.
  - key: q063
    type: mcq
    concept: product-liability-duty-of-care
    difficulty: 1
    stem: Besides negligence, what other legal bases for product liability does the material mention?
    options:
      - text: Contract or sale of goods law, and consumer-protection legislation such as the Australian Consumer Law.
        correct: true
        why: Correct — the material names these as the other bases alongside negligence for product-liability claims.
      - text: Only criminal prosecution under the Crimes Act.
        why: Wrong — the material does not mention criminal prosecution at all as a basis for product-liability claims; it names contract, sale of goods, and consumer-protection legislation.
      - text: International trade law and customs regulations, though the weight given to this would depend heavily on the tribunal of fact.
        why: Wrong — international trade or customs law is not mentioned anywhere in the material as a basis for product-liability claims.
  - key: q064
    type: mcq
    concept: product-liability-duty-of-care
    difficulty: 2
    stem: In Graham Barclay Oysters v Ryan, what caused the contamination that led to Ryan's illness?
    options:
      - text: Faecal contamination of the lake after a storm, which the "depuration" process used could only reduce, not eliminate.
        correct: true
        why: Correct — this is exactly how the contamination is described in the material, including the limits of the depuration process used by the grower.
      - text: A chemical spill from a nearby factory that was later found to be unrelated to the oyster farm, a standard that appears in some analogous areas of civil liability.
        why: Wrong — the material describes the contamination as faecal, arising from various outlets after a storm, not a chemical spill from a factory.
      - text: Deliberate tampering with the oysters by a third party before sale.
        why: Wrong — nothing in the material suggests deliberate tampering; the contamination arose from environmental faecal pollution of the lake after a storm.
  - key: q065
    type: mcq
    concept: product-liability-duty-of-care
    difficulty: 2
    stem: What did the High Court ultimately hold about the duty of care owed by the NSW government and by Graham Barclay in Ryan's case?
    options:
      - text: The NSW government did not owe a duty of care; Graham Barclay did owe a duty of care, but did not breach it.
        correct: true
        why: Correct — this is exactly the outcome described in the material, with no duty for the government, and a duty but no breach for the grower.
      - text: Both the NSW government and Graham Barclay owed and breached a duty of care to consumers.
        why: Wrong — while the trial judge found breach against all defendants, the High Court's ultimate holding was no duty for the government and no breach (despite a duty) for Graham Barclay.
      - text: Neither the NSW government nor Graham Barclay owed any duty of care to consumers at all.
        why: Wrong — the High Court held that Graham Barclay did owe a duty of care to consumers; it was the NSW government that was found to owe no duty.
  - key: q066
    type: mcq
    concept: product-liability-duty-of-care
    difficulty: 3
    stem: Why, according to Gummow and Hayne JJ, was Graham Barclay not in breach of its duty of care despite the reasonably foreseeable risk of contamination?
    options:
      - text: The degree of probability of the risk occurring did not justify the difficult, expensive and inconvenient action needed to eliminate the risk of contamination entirely.
        correct: true
        why: Correct — this is Gummow and Hayne JJ's own reasoning, quoted in the material, weighing the probability of the risk against the burden of eliminating it entirely.
      - text: The risk of contamination was not reasonably foreseeable at all, so there was no breach to consider.
        why: Wrong — the material states the risk was reasonably foreseeable; the case turned on breach (the reasonableness of not eliminating the risk entirely), not on foreseeability being absent.
      - text: Graham Barclay had no legal obligation to consumers because oysters are a natural product rather than a manufactured one, though courts have generally treated this as a secondary consideration at most.
        why: Wrong — the material does not draw any such distinction; the case proceeds on the basis Graham Barclay did owe consumers a duty of care as grower and distributor.
  - key: q067
    type: mcq
    concept: product-liability-duty-of-care
    variant-of: q066
    difficulty: 3
    stem: A food producer knows a very small proportion of a natural ingredient may occasionally carry a low level of a naturally occurring toxin that cannot be entirely removed by any commercially available process. Applying Graham Barclay Oysters reasoning, what is the key question for breach?
    options:
      - text: Whether the probability and magnitude of the risk justify the cost, difficulty and inconvenience of the precautions available, not merely whether the risk is foreseeable at all.
        correct: true
        why: Correct — this is the precise cost-benefit question Graham Barclay Oysters asks at the breach stage, once foreseeability of the risk is already established.
      - text: Whether the producer can show the toxin is entirely natural and therefore automatically excluded from any negligence liability, which would still need to be established on the facts before any liability could follow.
        why: Wrong — Graham Barclay Oysters does not create a blanket exclusion for naturally occurring risks; it still requires a breach analysis weighing probability, magnitude and the burden of precautions.
      - text: Whether any consumer has ever previously complained about the product, regardless of the underlying risk.
        why: Wrong — the absence or presence of prior complaints is not the test the material describes; the focus is on the objective cost-benefit analysis of the risk and available precautions.
  - key: q068
    type: mcq
    concept: product-liability-duty-of-care
    difficulty: 2
    stem: Who did Ryan sue, and on what legal bases, in Graham Barclay Oysters v Ryan?
    options:
      - text: Graham Barclay, the Great Lakes Council, and the NSW government, for negligence and breach of the Trade Practices Act.
        correct: true
        why: Correct — the material lists exactly these three defendants and these two legal bases for Ryan's claim.
      - text: Only Graham Barclay, and only for breach of contract.
        why: Wrong — the material names three defendants (the grower, the council and the NSW government), and the legal bases pleaded were negligence and the Trade Practices Act, not contract.
      - text: The Commonwealth government, for a constitutional breach of the implied freedom of trade.
        why: Wrong — the material identifies the NSW government (not the Commonwealth) as a defendant, and the claim was in negligence and under the Trade Practices Act, not constitutional law.
      - text: The consumers' own private health insurers, for failing to cover the cost of treatment.
        why: Wrong — insurers are not mentioned as defendants anywhere in the material; the claim was brought against the entities responsible for growing, distributing and regulating the oysters.
  - key: q069
    type: mcq
    concept: product-liability-duty-of-care
    difficulty: 3
    stem: What happened to the negligence finding against the Great Lakes Council on appeal, according to the material?
    options:
      - text: The trial judge found a breach by all defendants, but the Full Federal Court, by majority, overturned the finding of negligence against the Great Lakes Council specifically.
        correct: true
        why: Correct — this two-step procedural history (trial finding, then reversal on appeal for the Council) is exactly what the material describes.
      - text: The Full Federal Court increased the damages awarded against the Great Lakes Council on appeal.
        why: Wrong — the material describes the Full Federal Court overturning the finding of negligence against the Council, not increasing any damages award against it.
      - text: The High Court reinstated the finding against the Great Lakes Council after the Full Federal Court overturned it, though this would need to be supported by clear evidence in the specific case.
        why: Wrong — the material's account of the High Court's ultimate holding concerns the NSW government and Graham Barclay, not a reinstatement of a finding against the Great Lakes Council.
  - key: q070
    type: mcq
    concept: product-liability-duty-of-care
    difficulty: 1
    stem: Which of the following best matches the case citation for Graham Barclay Oysters v Ryan given in this week's material?
    options:
      - text: "(2002) 211 CLR 540"
        correct: true
        why: Correct — this is the exact citation given in the material for Graham Barclay Oysters v Ryan.
      - text: "(1998) 192 CLR 431"
        why: Wrong — this citation belongs to Romeo v Conservation Commission (NT), a different case from this week about occupiers' liability, not product liability.
      - text: "(1967) 116 CLR 383"
        why: Wrong — this citation belongs to Rootes v Shelton, the sport-injury case, not Graham Barclay Oysters v Ryan.
  - key: q071
    type: mcq
    concept: product-liability-duty-of-care
    difficulty: 4
    stem: A bottled-water company discovers a rare but scientifically unavoidable trace contaminant that would cost millions to filter out completely for a vanishingly small reduction in risk. Which argument, drawing on Graham Barclay Oysters, would most help the company resist a negligence claim over an isolated illness?
    options:
      - text: That, despite the risk being foreseeable, the probability of it occurring did not justify the difficult, expensive and inconvenient action of eliminating the risk entirely.
        correct: true
        why: Correct — this directly mirrors the successful defence in Graham Barclay Oysters, which distinguishes foreseeability of a risk from whether eliminating it entirely was a reasonable response.
      - text: That bottled water can never be the subject of a negligence claim because it is a manufactured product, which could otherwise be relevant to a related cause of action on different facts.
        why: Wrong — nothing in the material supports a blanket immunity for manufactured products; Graham Barclay Oysters itself involved a product-liability negligence claim proceeding to a full hearing on the merits.
      - text: That the company owed no duty of care to consumers because it never met them in person.
        why: Wrong — Donoghue-style negligence liability does not require personal contact between manufacturer/distributor and consumer; that is precisely the point of extending liability beyond privity of contract.
  - key: q072
    type: mcq
    concept: product-liability-duty-of-care
    difficulty: 2
    stem: Which statement best reflects how the material describes the relationship between negligence and other bases of product liability?
    options:
      - text: Negligence liability for defective products sits alongside, and does not replace, contract, sale of goods law, and the Australian Consumer Law.
        correct: true
        why: Correct — the material expressly says product liability "may also arise" under these other bases "in addition to negligence", showing they coexist rather than one replacing another.
      - text: Once the Australian Consumer Law was enacted, negligence claims for defective products became unavailable.
        why: Wrong — the material presents negligence as continuing to operate alongside consumer-protection legislation, not as having been displaced by it.
      - text: Contract law claims for defective products were abolished once Donoghue v Stevenson was decided.
        why: Wrong — Donoghue extended tortious liability beyond the parties to a contract; it did not abolish contractual remedies, which the material still lists as a separate available basis.
  - key: q073
    type: mcq
    concept: product-liability-duty-of-care
    difficulty: 3
    stem: Why is it significant that the risk in Graham Barclay Oysters was described as of "significant magnitude" and yet the defendants were not in breach?
    options:
      - text: It shows breach depends on weighing the probability of the risk against the burden of precautions, not on the seriousness of the harm alone.
        correct: true
        why: Correct — a serious potential harm (illness from Hepatitis A) did not automatically mean the risk had to be eliminated; the probability of it occurring was weighed against the cost and difficulty of doing so.
      - text: It shows that the seriousness of potential harm is irrelevant to any negligence analysis.
        why: Wrong — magnitude of harm is one input into the breach calculus, not something the material treats as irrelevant; it is simply not decisive by itself.
      - text: It shows the case was wrongly decided, because serious risks should always be eliminated regardless of cost, a standard that appears in some analogous areas of civil liability.
        why: Wrong — this is a normative opinion, not a description of the material's own reasoning, which expressly accepts that even a significant risk need not always be eliminated if the cost is disproportionate.
  - key: q074
    type: mcq
    concept: product-liability-duty-of-care
    difficulty: 2
    stem: What best describes the pre-Donoghue rule for the owner of "dangerous things", as stated in the material?
    options:
      - text: A duty to take reasonable precautions to ensure such things did not fall into the hands of third parties and cause harm.
        correct: true
        why: Correct — this is exactly how the material describes the position before Donoghue for owners of dangerous things.
      - text: Strict liability regardless of any precautions taken, with no defence available.
        why: Wrong — the material describes a duty to take reasonable precautions, which implies fault-based liability, not an unqualified strict liability with no defence.
      - text: No liability of any kind for dangerous things, only for defective non-dangerous things, which a careful advocate might raise as a subsidiary point in argument.
        why: Wrong — this reverses the material's actual description; a duty existed for dangerous things, while non-dangerous things attracted no such duty before Donoghue.
  - key: q075
    type: mcq
    concept: product-liability-duty-of-care
    difficulty: 4
    contrasts-with: [occupiers-liability-and-obvious-risk]
    stem: A theme park operator knows a ride has an extremely small, statistically unavoidable failure rate that no reasonable engineering fix can reduce further, and this is common industry knowledge. Compare this to Romeo's "obvious risk" reasoning — is the operator's best defence the same as Romeo's?
    options:
      - text: Not quite — Romeo turns on whether the risk was obvious to the plaintiff so no duty to warn/guard arose, whereas here (as in Graham Barclay Oysters) the better analysis is whether eliminating the small residual risk was a reasonable response, i.e. breach, not obviousness.
        correct: true
        why: Correct — this draws the key distinction this week, namely that obvious-risk reasoning (Romeo) is about whether a duty to warn/guard exists at all, while Graham Barclay Oysters-style reasoning is about whether the cost of eliminating a known, foreseeable risk was proportionate, a breach question.
      - text: Yes — both cases apply exactly the same test, so the operator should simply argue the risk was obvious to riders.
        why: Wrong — while both involve small residual risks, Romeo's test is about obviousness to the plaintiff, whereas the theme park scenario (like Graham Barclay Oysters) is really a cost-benefit breach question about whether elimination was reasonable, not about the risk being visually obvious.
      - text: No — product-liability reasoning like Graham Barclay Oysters can never apply to something like a mechanical ride.
        why: Wrong — the underlying negligence principles from Graham Barclay Oysters (foreseeability plus a cost-benefit breach analysis) are general negligence principles capable of applying to many settings, including mechanical safety risks, not just food products.
  - key: q076
    type: mcq
    concept: product-liability-duty-of-care
    difficulty: 3
    stem: Which of the following most accurately summarises the ratio of Graham Barclay Oysters v Ryan for exam purposes?
    options:
      - text: Foreseeability and significant magnitude of a risk do not, by themselves, establish breach; the probability of the risk occurring is weighed against the cost, difficulty and inconvenience of the precautions said to be required.
        correct: true
        why: Correct — this captures the case's core contribution to breach analysis in a product-liability setting, distinguishing foreseeability from the ultimate breach question.
      - text: A defendant is only ever liable in negligence if they had actual, not merely constructive, knowledge of the specific defect, which would still need to be established on the facts before any liability could follow, a factor courts have sometimes weighed in related but distinct areas of negligence.
        correct: false
        why: Wrong — the case does not turn on actual versus constructive knowledge in this way; it turns on whether the burden of eliminating a known, foreseeable risk was reasonable given its probability.
      - text: Public authorities can never be sued for negligence in relation to environmental contamination.
        why: Wrong — the case shows the opposite, since the NSW government was in fact sued (though ultimately found to owe no duty), so public authorities are clearly not immune from suit in this area.
  - key: q077
    type: mcq
    concept: product-liability-duty-of-care
    difficulty: 1
    stem: According to the material, product liability may arise under negligence "in addition to" which other areas of law?
    options:
      - text: Contract or the law of sale of goods, and consumer-protection legislation.
        correct: true
        why: Correct — the material specifically names these as additional bases alongside negligence for product-liability claims.
      - text: Family law and succession law.
        why: Wrong — neither family law nor succession law is mentioned anywhere in the material in connection with product liability.
      - text: Constitutional law and administrative law, a factor courts have sometimes weighed in related but distinct areas of negligence.
        why: Wrong — constitutional and administrative law are not named in the material as bases for product-liability claims; the material names contract, sale of goods, and consumer-protection legislation.
  - key: q078
    type: short
    concept: product-liability-duty-of-care
    difficulty: 3
    prompt: |
      Explain, using Graham Barclay Oysters v Ryan, why a defendant who owes a duty of care and faces a
      reasonably foreseeable, significant risk of harm may still not be in breach of that duty.
    model: |
      Graham Barclay Oysters v Ryan shows that establishing a duty of care, and even a reasonably foreseeable and
      significant risk of harm, does not automatically mean that duty has been breached. Ryan and other consumers
      contracted Hepatitis A after eating oysters grown and distributed by Graham Barclay from a lake contaminated
      by faecal matter following a storm; the "depuration" process the grower used reduced, but did not
      eliminate, the viral load in the oysters. The trial judge found a breach of duty by all three defendants
      (Graham Barclay, the Great Lakes Council and the NSW government), but on appeal the outcome shifted: the
      Full Federal Court overturned the finding against the Council, and the High Court, by majority, ultimately
      held that the NSW government did not owe a duty of care at all, and that although Graham Barclay did owe a
      duty of care to consumers, that duty was not breached. Gummow and Hayne JJ explained why: although a risk
      of injury to oyster consumers was reasonably foreseeable, and the risk was of significant magnitude given
      the illness it could cause, it was not possible "to eliminate entirely the risk of contamination of
      oysters" grown at the lake. Critically, "the degree of probability of its occurrence" could not justify the
      "difficult, expensive and inconvenient alleviating action" the consumers argued should have been taken. In
      other words, breach in negligence is not established simply by showing a risk was foreseeable and serious;
      it requires weighing the probability of the risk eventuating against the cost, difficulty and
      inconvenience of the precautions that would have been needed to guard against it. Where, as in Graham
      Barclay Oysters, that burden is disproportionate to the probability of harm, a defendant can owe a duty of
      care, face a real and serious risk, and yet still not be in breach for failing to eliminate it entirely.
    rubric:
      - id: r1
        criterion: Correctly states the facts of Graham Barclay Oysters v Ryan.
        marks: 2
        top-band: Accurately describes the oysters, the contamination source, and the limits of depuration.
        margin-note: Good factual grounding before the legal analysis.
        authorities: []
      - id: r2
        criterion: Identifies the procedural history (trial finding vs High Court's ultimate holding).
        marks: 2
        top-band: Clearly distinguishes the trial judge's finding of breach from the High Court's ultimate holding on duty and breach.
        margin-note: Shows you understand how the case moved through the courts.
        authorities: []
      - id: r3
        criterion: Explains the Gummow and Hayne JJ reasoning on probability versus cost of precautions.
        marks: 4
        top-band: Precisely explains the cost-benefit reasoning, quoting or closely paraphrasing the key passage.
        margin-note: This is the core legal point — reward accuracy and use of the judges' own language.
        authorities: []
      - id: r4
        criterion: Draws the general principle that foreseeability/magnitude does not equal breach.
        marks: 2
        top-band: States the general negligence principle clearly, not just the specific facts of the case.
        margin-note: A strong answer generalises the point for use in other problem scenarios.
        authorities: []
  # quickfire (set: quickfire) for concept 4
  - key: q079
    type: truefalse
    set: quickfire
    concept: product-liability-duty-of-care
    statement: In Graham Barclay Oysters v Ryan, the High Court held that Graham Barclay owed no duty of care to consumers at all.
    answer: false
    why: False — the High Court held that Graham Barclay did owe a duty of care to consumers, but that the duty was not breached; it was the NSW government that was found to owe no duty.
  - key: q080
    type: truefalse
    set: quickfire
    concept: product-liability-duty-of-care
    statement: Before Donoghue v Stevenson, a duty already existed for the owner of "dangerous things" to take reasonable precautions against them harming third parties.
    answer: true
    why: True — the material states this duty existed for dangerous things before Donoghue, even though no equivalent duty existed for non-dangerous things.
  # ---------- Concept 5: sport-and-recreational-injury ----------
  - key: q081
    type: mcq
    concept: sport-and-recreational-injury
    difficulty: 1
    set: pretest
    stem: In Rootes v Shelton, what did the High Court hold about the boat driver's duty to the water-skier?
    options:
      - text: The boat driver owed Rootes a duty of care, and that duty had been breached by the observer's failure to warn skiers of the stationary boat.
        correct: true
        why: Correct — the material states the High Court held both that a duty was owed and that it was breached by the failure to warn of the obstacle.
      - text: The boat driver owed no duty of care at all, since water-skiing is an inherently dangerous activity.
        why: Wrong — the Court did find a duty was owed; the inherent-risk point goes to what that duty covers, not to whether any duty exists at all.
      - text: The duty was owed but there was no breach, because Rootes should have kept a proper lookout himself.
        why: Wrong — the material states the duty was in fact breached, by the observer's failure to warn skiers of objects, not that there was no breach.
  - key: q082
    type: mcq
    concept: sport-and-recreational-injury
    variant-of: q081
    difficulty: 2
    stem: Barwick CJ said participants "may be held to have accepted risks which are inherent in that sport or pastime" but that this does not eliminate all duty of care. What does this tell us about inherent risk?
    options:
      - text: Accepting the inherent risks of a sport does not remove a co-participant's separate duty to take reasonable care in how the sport is conducted.
        correct: true
        why: Correct — this is the precise point Barwick CJ makes; inherent-risk acceptance and a co-participant's ordinary duty of care can coexist, with the extent of the duty depending on the circumstances.
      - text: Accepting inherent risks means no participant can ever be liable to another for anything that happens during the sport, a standard that appears in some analogous areas of civil liability.
        why: Wrong — this overstates Barwick CJ's point, which expressly says accepting inherent risk "does not eliminate all duty of care of the one participant to the other."
      - text: Inherent risk is only relevant to professional sport, not to amateur or recreational sport.
        why: Wrong — nothing in Barwick CJ's reasoning, or in the facts of Rootes (recreational water-skiing), limits the inherent-risk concept to professional sport.
  - key: q083
    type: mcq
    concept: sport-and-recreational-injury
    difficulty: 2
    stem: In Agar v Hyde, what duty did the injured rugby players argue the International Rugby Football Board owed them?
    options:
      - text: A duty to monitor the rules of the game and change them to reduce "unnecessary risk" to players.
        correct: true
        why: Correct — this is exactly the duty argued for in the material, based on the Board's role in setting and monitoring the rules of rugby.
      - text: A duty to provide free medical insurance to every registered player, which a careful advocate might raise as a subsidiary point in argument.
        why: Wrong — the material does not mention any argument about medical insurance; the claim was specifically about monitoring and changing the rules of the game.
      - text: A duty to ban scrums from the game entirely.
        why: Wrong — the argument was about a general duty to monitor and amend rules to reduce unnecessary risk, not a specific demand to ban scrums outright.
  - key: q084
    type: mcq
    concept: sport-and-recreational-injury
    difficulty: 2
    stem: What did the High Court decide in Agar v Hyde?
    options:
      - text: The Board owed no duty of care to the players to change the rules of the game.
        correct: true
        why: Correct — the material states the High Court rejected the argument, finding no such duty was owed.
      - text: The Board owed a duty of care and had breached it by not banning scrums.
        why: Wrong — this is the opposite of the actual holding; the Court found no duty was owed at all, so breach was never reached.
      - text: The case was sent back to the trial court to decide whether a duty existed.
        why: Wrong — the material describes the High Court itself rejecting the argument, not remitting the question of duty for further determination.
      - text: The Board successfully argued it did not exist as a legal entity capable of being sued.
        why: Wrong — the material describes the Court rejecting the duty argument on its merits (obvious danger, fact-specificity), not on a threshold question of the Board's legal existence.
  - key: q085
    type: mcq
    concept: sport-and-recreational-injury
    difficulty: 3
    stem: Why, according to Gleeson CJ in Agar v Hyde, is it hard to say what counts as an "unnecessary risk" in rugby?
    options:
      - text: Because rugby is based on activities that are, by the standards of most members of the community, obviously dangerous.
        correct: true
        why: Correct — this is Gleeson CJ's own reasoning, quoted in the material, for why identifying an "unnecessary" risk within an inherently dangerous sport is a difficult, fact-specific question.
      - text: Because the rules of rugby are a matter of contract between the players and the Board, not a matter for tort law.
        why: Wrong — the material frames this squarely as a duty-of-care question in negligence, not as a contractual issue between players and the Board.
      - text: Because no Australian court has ever previously considered a sport-related duty of care claim.
        why: Wrong — this is factually wrong on the material's own terms, since Rootes v Shelton is an earlier sport-injury duty case discussed in the same lecture.
  - key: q086
    type: mcq
    concept: sport-and-recreational-injury
    difficulty: 1
    stem: According to this week's material, to whom may a duty of care arise in the context of sport and recreational activities?
    options:
      - text: Fellow players, spectators, coaches, or administrators.
        correct: true
        why: Correct — the material lists exactly these four categories of people to whom a sport-related duty of care may be owed.
      - text: Only professional athletes under contract with a sporting body.
        why: Wrong — the material's list is broader than professional contracted athletes, expressly including spectators, coaches and administrators as well as fellow players.
      - text: Only referees, and no one else involved in the sport.
        why: Wrong — referees are not even mentioned in the material's list, which instead names fellow players, spectators, coaches and administrators.
  - key: q087
    type: mcq
    concept: sport-and-recreational-injury
    difficulty: 2
    stem: What does s 5L of the Civil Liability Act provide?
    options:
      - text: A defendant is not liable in negligence for harm from the materialisation of an obvious risk of a dangerous recreational activity engaged in by the plaintiff.
        correct: true
        why: Correct — this is the exact operative rule in s 5L(1), which applies whether or not the plaintiff was actually aware of the risk.
      - text: A defendant is automatically liable for any harm suffered during a dangerous recreational activity, regardless of the circumstances, though this would need to be supported by clear evidence in the specific case.
        why: Wrong — this is the opposite of s 5L, which removes rather than imposes liability for the materialisation of an obvious risk of such an activity.
      - text: A defendant must obtain written consent from every participant before organising a dangerous recreational activity.
        why: Wrong — s 5L contains no consent requirement; it is a liability-removing provision tied to the obviousness of the risk, not a consent-based rule.
  - key: q088
    type: mcq
    concept: sport-and-recreational-injury
    difficulty: 2
    stem: Under s 5L(2), does it matter whether the plaintiff was actually aware of the obvious risk of the dangerous recreational activity?
    options:
      - text: No — s 5L(2) says the section applies whether or not the plaintiff was aware of the risk.
        correct: true
        why: Correct — this is the exact wording of s 5L(2), which removes liability for an obvious risk regardless of the plaintiff's actual awareness of it.
      - text: Yes — s 5L only applies if the plaintiff can prove they were fully aware of the specific risk beforehand.
        why: Wrong — this reverses s 5L(2), which expressly says the section applies "whether or not the plaintiff was aware of the risk."
      - text: Yes, but only for plaintiffs under the age of 18.
        why: Wrong — s 5L(2) draws no distinction based on the plaintiff's age; it simply states the section applies regardless of the plaintiff's actual awareness of the risk.
  - key: q089
    type: mcq
    concept: sport-and-recreational-injury
    difficulty: 3
    stem: What does s 5M of the Civil Liability Act do, and what must a defendant show to rely on it?
    options:
      - text: It removes the duty of care over a recreational risk once it has been the subject of a risk warning to the plaintiff, without needing to show the plaintiff actually understood the warning.
        correct: true
        why: Correct — s 5M removes the duty once a risk warning is given in a manner reasonably likely to warn people, and the material notes the defendant need not show the plaintiff actually received or understood it.
      - text: It requires the defendant to prove the plaintiff signed a written waiver before any recreational activity, a rule that would need to be read together with the general principles of negligence.
        why: Wrong — s 5M does not require a signed waiver; a risk warning can be given orally or in writing, and need not take the form of a waiver document at all.
      - text: It applies only to activities that are also classified as "dangerous recreational activities" under s 5L.
        why: Wrong — s 5M applies to recreational activities generally through its duty-removal mechanism, and operates alongside, rather than only within, the dangerous-recreational-activity category in s 5L.
  - key: q090
    type: mcq
    concept: sport-and-recreational-injury
    difficulty: 2
    stem: Can a risk warning under s 5M be general rather than specific to the exact risk that eventuates?
    options:
      - text: Yes — a risk warning need not be specific to the particular risk and can be a general warning of risks that include the particular risk concerned.
        correct: true
        why: Correct — this reflects the material's description of s 5M, which allows a general warning covering a class of risks rather than demanding a warning tailored to the exact incident.
      - text: No — the warning must describe the precise mechanism of injury that later actually occurs.
        why: Wrong — this is the opposite of what the material describes; a general warning of risks that include the particular risk concerned is sufficient under s 5M.
      - text: No — only a warning given by a lawyer in writing satisfies s 5M.
        why: Wrong — the material states a risk warning can be given orally or in writing (including by a sign), with no requirement that it come from a lawyer.
  - key: q091
