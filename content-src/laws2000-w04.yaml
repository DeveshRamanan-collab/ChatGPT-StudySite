  - slug: subjects-and-international-legal-personality
    title: Subjects of international law and legal personality
    visual: explainer
    visual-brief: A dial of five capacities (claim rights, diplomatic relations, bear obligations, create law, immunities) — fully lit for the state, partly lit for an international organisation.
    related: [emerging-actors-beyond-the-state, international-organisations-definition-and-personality]
    depends-on: [laws2000-w01-defining-international-law, laws2000-w01-sovereign-equality-and-consent]
    contrasts-with: [emerging-actors-beyond-the-state]
    cases: [reparation-for-injuries-suffered-in-the-service-of-the-united-nations]
    authorities: []
    verify: false
    body: |
      A subject of international law is "an entity possessing international rights and obligations and having the
      capacity (1) to maintain its rights by bringing international claims; and (2) to be responsible for its
      breaches of obligation by being subjected to such claims" (Crawford). Who is a subject is the question of who
      has international legal personality.

      Capacities ascribed to subjecthood include claiming rights under international law, entering diplomatic
      relations, bearing obligations imposed directly by international law, creating international law (e.g. binding
      treaties), and enjoying immunities from other states' jurisdiction — Australia cannot try New Zealand in front
      of its courts, because there is no authority above a sovereign state.

      States are the only subjects with full legal capacity; others have only partial capacity. In *Reparation for
      Injuries* (1949) the ICJ held the UN to be an international person although the Charter never says so — "not
      the same thing as saying that it is a State" — and recognised that the subjects of law "are not necessarily
      identical in their nature or in the extent of their rights".

      Exam use: never ask only "is X a subject?" Ask which capacities X has, and where they come from.
  - slug: emerging-actors-beyond-the-state
    title: Emerging actors beyond the state
    visual: diagram
    visual-brief: Four satellites around the state — individuals, groups (peoples, minorities, armed groups), multinational corporations — each tagged with rights, obligations, or both, and binding or non-binding.
    related: [subjects-and-international-legal-personality, self-determination-and-secession]
    depends-on: [subjects-and-international-legal-personality]
    contrasts-with: [subjects-and-international-legal-personality]
    cases: []
    authorities: [iccpr-art-1]
    verify: false
    body: |
      Individuals were not originally subjects of international law; they were the responsibility of their state of
      nationality. After WWII, rights exercisable against states emerged: the non-binding Universal Declaration of
      Human Rights 1948, then binding treaties such as the ECHR 1950 and ICCPR 1966. Some treaties let individuals
      complain to international bodies — eight Torres Strait Islanders won a climate claim against Australia before
      the Human Rights Committee under the ICCPR Optional Protocol. Individuals also bear obligations under
      international criminal law: Slobodan Milošević was indicted by the ICTY in 1999, the first head of state
      indicted before an international tribunal.

      Groups: peoples hold rights such as self-determination and indigenous rights (the 2007 UN Declaration on the
      Rights of Indigenous Peoples is not binding; ratified ILO conventions are). Minority rights (culture, language,
      religion) are usually claimed individually. Non-state armed actors are bound by international humanitarian law,
      including common Article 3 of the Geneva Conventions.

      Multinational corporations have rights under international economic law (investment protection) but, to date,
      no legally binding obligations; the 2011 Guiding Principles on Business and Human Rights are not binding.

      Exam use: for any non-state actor, separate rights from obligations and binding from non-binding sources.
  - slug: montevideo-criteria-for-statehood
    title: The Montevideo criteria for statehood
    visual: palace
    visual-brief: Four rooms in order — population, territory, effective government, capacity for relations — each with its threshold rule and one example, plus a doorway marked "presumption of continuity".
    related: [recognition-of-states, modes-of-territorial-acquisition]
    depends-on: [laws2000-w02-customary-international-law-elements, subjects-and-international-legal-personality]
    contrasts-with: [recognition-of-states]
    cases: [north-sea-continental-shelf-cases]
    authorities: [montevideo-convention-1933-art-1]
    verify: false
    body: |
      Article 1 of the Montevideo Convention on Rights and Duties of States (1933): the state "should possess ...
      a. a permanent population; b. a defined territory; c. government; and d. capacity to enter into relations with
      other states". A regional convention with few parties, it is widely regarded as codifying custom.

      Population: no minimum (Nauru about 12,000, China about 1.4 billion); a core population living there
      permanently, whatever its nationality. Territory: no minimum size (Vatican about 0.5 sq km); boundaries must be
      defined but need not be fixed or undisputed — "no rule that the land frontiers of a State must be fully
      delimited" (*North Sea Continental Shelf* [46]). Effective government: the most tricky — a coherent, effective
      exercise of public power; a colony would not qualify. Once statehood is established, a presumption of continuity
      means ineffective government (Somalia, Syria, Yemen) does not end it, and the form of government is irrelevant.
      Capacity for relations: arises from independence — Scotland may meet the first three but cannot conduct
      international relations on its own.

      Exam use: apply each criterion to the facts in turn, then note that new entities face a stricter effectiveness
      test than established states.
  - slug: recognition-of-states
    title: Recognition and contested statehood
    visual: simulation
    visual-brief: Toggle "criteria met", "achieved lawfully" and "recognised by N states" for an entity and watch the verdict change under the declaratory and constitutive theories side by side.
    related: [montevideo-criteria-for-statehood, self-determination-and-secession]
    depends-on: [montevideo-criteria-for-statehood]
