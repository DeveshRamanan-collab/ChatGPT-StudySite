cards:
  - type: basic
    concept: subjects-and-international-legal-personality
    front: What is a subject of international law (Crawford)?
    back: An entity possessing international rights and obligations, with the capacity (1) to maintain its rights by bringing international claims and (2) to be responsible for breaches by being subjected to such claims.
    source: Week 04 Lecture Slides, Slide 8
  - type: cloze
    concept: subjects-and-international-legal-personality
    text: "{{c1::States}} are the only subjects with full legal capacity; other subjects, such as international organisations, have only {{c2::partial}} capacity."
    source: Week 04 Lecture Slides, Slide 9
  - type: basic
    concept: subjects-and-international-legal-personality
    front: List three capacities ascribed to subjecthood.
    back: Any three of — claiming rights under international law; entering diplomatic relations; bearing obligations imposed directly by international law; creating international law (e.g. treaties); enjoying immunities from other states' jurisdiction.
    source: Week 04 Lecture Slides, Slide 9
  - type: apply
    concept: subjects-and-international-legal-personality
    scenario: The UN wants to claim reparation from a state for injuries to one of its officials, but the Charter is silent on the UN's international personality.
    answer: Reparation for Injuries (1949) — the UN is an international person, implied from the functions it was intended to exercise, though not a state and without a state's rights and duties.
    source: Week 04 Lecture Slides, Slide 10
  - type: basic
    concept: emerging-actors-beyond-the-state
    front: Which ICCPR mechanism let eight Torres Strait Islanders bring a climate claim against Australia?
    back: The Optional Protocol to the ICCPR — individual complaint to the Human Rights Committee after domestic options are exhausted. They won, and Australia accepted the recommendation.
    source: Week 04 Lecture (Live), 00:15:30-00:17:27
  - type: cloze
    concept: emerging-actors-beyond-the-state
    text: "In 1999 Slobodan Milošević was indicted by the {{c1::ICTY}} for crimes against humanity — the first {{c2::head of state}} indicted before an international tribunal."
    source: Week 04 Lecture Slides, Slide 13
  - type: basic
    concept: emerging-actors-beyond-the-state
    front: Which provision binds non-state armed actors under IHL?
    back: Common Article 3 of the Geneva Conventions (with other protocols).
    source: Week 04 Lecture (Live), 00:25:47-00:26:02
  - type: apply
    concept: emerging-actors-beyond-the-state
    scenario: A multinational company abroad abuses workers' rights. Is it breaching a binding international obligation?
    answer: No binding obligation exists to date — corporations have rights (investment protection) but the 2011 Guiding Principles on Business and Human Rights are not binding.
    source: Week 04 Lecture Slides, Slide 16
  - type: basic
    concept: montevideo-criteria-for-statehood
    front: What are the four Montevideo criteria (art 1)?
    back: A permanent population; a defined territory; government; capacity to enter into relations with other states.
    source: Week 04 Lecture Slides, Slide 19
  - type: cloze
    concept: montevideo-criteria-for-statehood
    text: "Montevideo art 1 is a regional treaty with few parties, but it is widely regarded as codifying {{c1::customary international law}}."
    source: Week 04 Lecture Slides, Slide 19
  - type: basic
    concept: montevideo-criteria-for-statehood
    front: Which case says there is no rule that a state's land frontiers must be fully delimited?
    back: North Sea Continental Shelf [1969] ICJ Rep 3, para 46.
    source: Week 04 Lecture Slides, Slide 21
  - type: cloze
    concept: montevideo-criteria-for-statehood
    text: "Once statehood is established it carries a {{c1::presumption of continuity}}: ineffective government does not necessarily end statehood."
    source: Week 04 Lecture Slides, Slide 22
  - type: apply
    concept: montevideo-criteria-for-statehood
    scenario: Scotland has its own population, territory and government, but the UK handles its borders and treaties.
    answer: It fails the fourth criterion — capacity to enter into relations with other states, which arises from independence.
    source: Week 04 Lecture Slides, Slide 23
  - type: basic
    concept: recognition-of-states
    front: Declaratory vs constitutive theory of recognition?
    back: Declaratory (prevailing) — recognition only acknowledges existing statehood; symbolic. Constitutive — recognition creates the state; no recognition, no existence.
    source: Week 04 Lecture Slides, Slide 26
  - type: cloze
    concept: recognition-of-states
    text: "Non-recognition may prevent statehood if the Montevideo criteria were achieved {{c1::illegally}} (Friendly Relations Declaration 1970; Kosovo Advisory Opinion 2010)."
    source: Week 04 Lecture Slides, Slide 28
  - type: apply
    concept: recognition-of-states
    scenario: The TRNC has population, territory and government, but was created after Turkey's 1974 invasion of Cyprus.
    answer: Not treated as a state — criteria achieved illegally; recognised only by Turkey; UNSC resolutions 541 (1983) and 550 (1984) declared the declaration legally invalid.
    source: Week 04 Lecture Slides, Slide 29
  - type: basic
    concept: recognition-of-states
    front: What does UN admission require, and why is it an imperfect sign of recognition?
    back: A Security Council recommendation (subject to veto) and a two-thirds General Assembly vote; one veto can block an entity many states recognise.
    source: Week 04 Lecture (Live), 00:42:16-00:43:45
  - type: basic
    concept: modes-of-territorial-acquisition
    front: Name the five modes of territorial acquisition.
    back: Cession; accretion; effective occupation of terra nullius; prescription; conquest (belligerent occupation) — the last no longer lawful.
    source: Week 04 Lecture Slides, Slide 34
  - type: cloze
    concept: modes-of-territorial-acquisition
    text: "UNCLOS art 121(1): an island is a {{c1::naturally formed}} area of land, surrounded by water, which is above water at {{c2::high tide}}."
    source: Week 04 Lecture Slides, Slide 39
  - type: apply
    concept: modes-of-territorial-acquisition
    scenario: State X has peacefully administered State Y's island for decades, acting as sovereign; Y has protested every year.
    answer: No title by prescription — it rests on implied consent, and sustained protest by the old sovereign prevents it.
    source: Week 04 Lecture Slides, Slide 41
  - type: basic
    concept: modes-of-territorial-acquisition
    front: What happens legally when a state occupies another's territory by force today?
    back: The belligerent occupation regime applies — the occupation is temporary and sovereignty does not transfer (UN Charter art 2(4)).
    source: Week 04 Lecture (Online), 00:13:32-00:14:46
  - type: basic
    concept: self-determination-and-secession
    front: What did the ICJ affirm in Chagos (2019)?
    back: The right of self-determination of the people concerned (decolonisation context) and the UK's obligation to complete the decolonisation of Mauritius.
    source: Week 04 Lecture Slides, Slide 44
  - type: cloze
    concept: self-determination-and-secession
    text: "In Re Secession of Quebec, Quebec's {{c1::internal}} self-determination was fulfilled, so there was no ground for {{c2::external}} self-determination (secession)."
    source: Week 04 Lecture (Online), 00:20:19-00:21:08
  - type: apply
    concept: self-determination-and-secession
    scenario: A WA movement wants to secede because it dislikes rule from Canberra and wants the state's resources.
    answer: Outside decolonisation, unilateral secession is highly contentious; applying Quebec, WA's internal self-determination is fulfilled, so there is no right to secede.
    source: Week 04 Tutorial Task, Question 4
  - type: basic
    concept: international-organisations-definition-and-personality
    front: What is an international organisation under ARIO art 2(a)?
    back: An organisation established by a treaty or other instrument governed by international law, possessing its own international legal personality; it may include members other than states.
    source: Week 04 Lecture Slides, Slide 50
  - type: cloze
    concept: international-organisations-definition-and-personality
    text: "UN Charter art {{c1::104}} gives the UN only domestic legal capacity; its international personality was found implicitly in {{c2::Reparation for Injuries}}."
    source: Week 04 Lecture (Online), 00:32:45-00:37:07
  - type: apply
    concept: international-organisations-definition-and-personality
    scenario: A member wants to leave the ICC on 1 March.
    answer: Rome Statute art 127 — written notification to the UN Secretary-General; withdrawal takes effect one year after receipt.
    source: Week 04 Lecture Slides, Slide 53
  - type: basic
    concept: powers-and-responsibility-of-international-organisations
    front: What is the principle of speciality?
    back: IOs have no general competence; they have only the powers their members give them (Nuclear Weapons Advisory Opinion 1996, para 25).
    source: Week 04 Lecture Slides, Slide 57
  - type: cloze
    concept: powers-and-responsibility-of-international-organisations
    text: "Implied powers are those conferred by {{c1::necessary implication}} as being essential to the performance of the organisation's duties (Reparation, 182)."
    source: Week 04 Lecture Slides, Slide 58
  - type: apply
    concept: powers-and-responsibility-of-international-organisations
    scenario: UN peacekeepers commit a wrongful act on the specific orders of their national commanders.
    answer: ARIO art 7 — attribution follows effective control over the specific conduct, so the contributing state can be responsible.
    source: Week 04 Lecture Slides, Slide 60
  - type: basic
    concept: powers-and-responsibility-of-international-organisations
    front: What are the two elements of an IO's internationally wrongful act (ARIO art 4)?
    back: Conduct (action or omission) that (a) is attributable to the organisation under international law and (b) breaches an international obligation of that organisation.
    source: Week 04 Lecture Slides, Slide 59

audio:
  title: "Week 4 recap — subjects of international law and statehood"
  minutes: 3
  script: |
    This week is about who international law is actually for. A subject of international law has rights it can
    claim and obligations it can be held to — that's international legal personality. States are the only subjects
    with full legal capacity. Others have partial capacity, and the key case is Reparation for Injuries in 1949: the
    Charter never says the UN has international personality, but the Court found it from the functions the UN was
    meant to exercise — an international person, but certainly not a state.

    Beyond states, individuals gained rights after the Second World War, through the UDHR, which isn't binding, and
    treaties like the ICCPR, which are. Individuals also carry obligations, as Milošević's indictment by the ICTY
    shows. Peoples and minorities have rights, armed groups are bound by humanitarian law under common Article 3, and
    corporations have rights but, so far, no binding obligations.

    Statehood means the four Montevideo criteria: a permanent population of any size, a defined territory even with
    disputed borders — North Sea Continental Shelf — an effective government, and capacity to enter into relations,
    which Scotland lacks. Once a state exists, the presumption of continuity keeps it a state even when government
    breaks down.

    Recognition: the declaratory theory, which most people hold, says it is symbolic; the constitutive theory says no
    recognition, no existence. And non-recognition can block entities created illegally, like the Turkish Republic of
    Northern Cyprus.

    Territory comes by cession, accretion, occupation of terra nullius and prescription. Artificial islands don't
    count, and sustained protest stops prescription. Conquest has been out since 1945 under Article 2(4) — occupation
    by force is temporary and passes no title.

    Self-determination is settled in the decolonisation context, as Chagos confirms. Outside it, secession is highly
    contested: Kosovo split opinion, and in Quebec the Supreme Court said a people whose internal self-determination is
    fulfilled has no right to secede.

    Finally, international organisations: created by treaty or other instrument governed by international law, which
    is what separates them from NGOs. Their personality is express, like the WTO's, or implied, like the UN's. Their
    powers are limited by speciality — no general competence, as the WHO found in the Nuclear Weapons opinion — though
    they have implied powers essential to their duties. And they answer for their own wrongful acts, with effective
    control deciding whether a peacekeeper's conduct belongs to the UN or to the state that sent them.
