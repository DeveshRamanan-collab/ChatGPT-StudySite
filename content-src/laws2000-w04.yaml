      The subjection of peoples to alien subjugation, domination and exploitation constitutes a denial of fundamental
      human rights, is contrary to the Charter of the United Nations and is an impediment to the promotion of world
      peace and co-operation.
    gloss: The decolonisation-era General Assembly declaration underpinning self-determination in the colonial context.
    cases: [chagos-islands-case]
    verify: false
  - slug: un-charter-art-2-4
    title: UN Charter art 2(4)
    kind: treaty
    text: |
      Prohibits the use of force against the territorial integrity of another state. (Paraphrased from the lecture;
      this week's materials do not reproduce the article's exact wording.)
    gloss: The basis for the prohibition on acquiring territory by force since 1945 — conquest no longer passes title.
    cases: []
    verify: true
  - slug: unclos-art-121-1
    title: UN Convention on the Law of the Sea 1982 art 121(1)
    kind: treaty
    text: |
      An island is a naturally formed area of land, surrounded by water, which is above water at high tide.
    gloss: Because an island must be naturally formed and above water at high tide, artificial islands and low-tide elevations cannot ground sovereignty claims.
    cases: []
    verify: false
  - slug: unclos-art-60
    title: UN Convention on the Law of the Sea 1982 art 60
    kind: treaty
    text: |
      1. In the exclusive economic zone, the coastal State shall have the exclusive right to construct and to
      authorize and regulate the construction, operation and use of: (a) artificial islands ... 8. Artificial
      islands, installations and structures do not possess the status of islands. They have no territorial sea of
      their own, and their presence does not affect the delimitation of the territorial sea, the exclusive economic
      zone or the continental shelf.
    gloss: Coastal states may build artificial islands in their EEZ, but such structures are not islands and generate no territorial sea.
    cases: []
    verify: false
  - slug: ario-2011-art-2-a
    title: Draft Articles on the Responsibility of International Organizations 2011 art 2(a)
    kind: other
    text: |
      "international organization" means an organization established by a treaty or other instrument governed by
      international law and possessing its own international legal personality. International organizations may
      include as members, in addition to States, other entities.
    gloss: The ILC's working definition of an international organisation — four elements, distinguishing IOs from NGOs.
    cases: []
    verify: false
  - slug: ario-2011-arts-3-4
    title: Draft Articles on the Responsibility of International Organizations 2011 arts 3–4
    kind: other
    text: |
      Article 3: Every internationally wrongful act of an international organization entails the international
      responsibility of that organization. Article 4: There is an internationally wrongful act of an international
      organization when conduct consisting of an action or omission: (a) is attributable to that organization under
      international law; and (b) constitutes a breach of an international obligation of that organization.
    gloss: Responsibility of the organisation itself for its wrongful acts, on two elements modelled on state responsibility — attribution and breach.
    cases: []
    verify: false
  - slug: ario-2011-art-6
    title: Draft Articles on the Responsibility of International Organizations 2011 art 6
    kind: other
    text: |
      1. The conduct of an organ or agent of an international organization in the performance of functions of that
      organ or agent shall be considered an act of that organization under international law, whatever position the
      organ or agent holds in respect of the organization. 2. The rules of the organization apply in the
      determination of the functions of its organs and agents.
    gloss: The general attribution rule — what an IO's organs and agents do in performing their functions is the IO's act.
    cases: []
    verify: false
  - slug: ario-2011-art-7
    title: Draft Articles on the Responsibility of International Organizations 2011 art 7
    kind: other
    text: |
      The conduct of an organ of a State or an organ or agent of an international organization that is placed at the
      disposal of another international organization shall be considered under international law an act of the
      latter organization if the organization exercises effective control over that conduct.
    gloss: Effective control decides whether seconded conduct (e.g. peacekeepers) is attributed to the receiving IO or stays with the contributing state.
    cases: []
    verify: false
  - slug: un-charter-art-4
    title: UN Charter art 4
    kind: treaty
    text: |
      Membership in the United Nations is open to all other peace-loving states which accept the obligations
      contained in the present Charter and, in the judgment of the Organization, are able and willing to carry out
      these obligations.
    gloss: UN membership is open to states that accept and can carry out Charter obligations; admission is on Security Council recommendation and General Assembly decision.
    cases: []
    verify: false
  - slug: un-charter-art-104
    title: UN Charter art 104
    kind: treaty
    text: |
      The Organization shall enjoy in the territory of each of its Members such legal capacity as may be necessary for
      the exercise of its functions and the fulfilment of its purposes. (Paraphrased from the lecture; the slides do not
      reproduce the article.)
    gloss: Confers domestic legal capacity on the UN (contracts, leases, employment) — not international legal personality.
    cases: [reparation-for-injuries-suffered-in-the-service-of-the-united-nations]
    verify: true
  - slug: rome-statute-art-127
    title: Rome Statute of the International Criminal Court art 127
    kind: treaty
    text: |
      A State Party may, by written notification addressed to the Secretary-General of the United Nations, withdraw
      from this Statute. The withdrawal shall take effect one year after the date of receipt of the notification,
      unless the notification specifies a later date.
    gloss: An example of a constitutive instrument providing for withdrawal, with a one-year delay before it takes effect.
    cases: []
    verify: false
  - slug: wto-agreement-art-viii
    title: Marrakesh Agreement Establishing the World Trade Organization art VIII
    kind: treaty
    text: |
      The WTO shall have legal personality, and shall be accorded by each of its Members such legal capacity as may be
      necessary for the exercise of its functions.
    gloss: An example of explicit conferral of legal personality in an IO's constitutive instrument.
    cases: []
    verify: false

questions:
  # ---------- Concept 1: subjects-and-international-legal-personality ----------
  - key: q101
    type: mcq
    concept: subjects-and-international-legal-personality
    difficulty: 1
    set: pretest
    stem: On Crawford's definition used this week, what makes an entity a subject of international law?
    options:
      - text: It holds international rights and obligations, and can bring international claims and be subjected to them.
        correct: true
        why: Correct — Crawford defines a subject as an entity with international rights and obligations and the capacity both to maintain its rights by bringing claims and to be responsible by being subjected to claims.
      - text: It has been admitted as a member of the United Nations by the General Assembly.
        why: Tempting because UN membership signals statehood, but many subjects (individuals, IOs, peoples) are not UN members, and the definition turns on rights, obligations and claims, not membership.
      - text: It has a permanent population, a defined territory, an effective government and the capacity to enter into relations.
        why: Tempting because these are this week's statehood criteria, but they define a state, which is only one kind of subject; an IO or individual can be a subject without them.
  - key: q102
    type: mcq
    concept: subjects-and-international-legal-personality
    difficulty: 1
    stem: The question of who is a subject of international law is, the lecture says, the same as asking who has what?
    options:
      - text: International legal personality.
        correct: true
        why: Correct — the slide says the question of who is a subject of international law relates to who has international legal personality, i.e. rights it can claim and obligations it bears.
      - text: Membership of the International Court of Justice under its Statute.
        why: Tempting because the ICJ hears international claims, but only states appear in contentious cases, and subjecthood is about personality, not a seat at the Court.
      - text: Sovereign immunity from the jurisdiction of every other state's domestic courts.
        why: Tempting because immunity is one capacity of subjecthood, but it is only one item on the list and not every subject (e.g. an individual) enjoys it.
  - key: q103
    type: mcq
    concept: subjects-and-international-legal-personality
    difficulty: 2
    stem: Which of the following is NOT one of the capacities the slides ascribe to subjecthood?
    options:
      - text: Power to legislate directly for the population of another state.
        correct: true
        why: Correct — no subject has that power; sovereign equality means there is no authority above a state, so no subject can legislate for another state's people.
      - text: Capacity to create international law, for example by making binding treaties.
        why: Wrong choice — the slide lists the capacity to create international law (e.g. make binding treaties) as one of the capabilities of subjecthood.
      - text: Ability to enjoy immunities from other states' jurisdiction.
        why: Wrong choice — the slide lists the ability to enjoy immunities from other states' jurisdiction as a capability ascribed to subjecthood.
      - text: Bearing obligations imposed directly by international law.
        why: Wrong choice — bearing obligations directly imposed by international law is listed on the slide as one of the capabilities of subjecthood.
  - key: q104
    type: mcq
    concept: subjects-and-international-legal-personality
    difficulty: 2
    stem: Why, according to the lecture, can Australia not try New Zealand in front of Australian courts?
    options:
      - text: Because New Zealand is a member of the Commonwealth, and Commonwealth members are exempt from the jurisdiction of each other's national courts.
        why: Tempting because both are Commonwealth members, but the lecture grounds the rule in sovereignty and immunities, not Commonwealth membership, and it applies to every state.
      - text: Because each state is sovereign and there is no authority above a state, so states enjoy immunities from each other.
        correct: true
        why: Correct — the lecture says states do not have the power to prosecute another state because each state is sovereign and equal, with no authority above it; this is an immunity of subjecthood.
      - text: Because only the ICJ can hear claims between states.
        why: Tempting because the ICJ does hear inter-state disputes, but the reason given is sovereign equality and immunity, and the ICJ's jurisdiction depends on consent in any event.
  - key: q105
    type: mcq
    concept: subjects-and-international-legal-personality
    difficulty: 2
    stem: Which statement best captures the lecture's point about degrees of legal personality?
    options:
      - text: Only states have full legal personality; other subjects, such as IOs, have partial capacity limited by their functions.
        correct: true
        why: Correct — the lecture says states are the only subjects with full legal personality, while an IO may lack some immunities or be able to make agreements only in relation to its functions.
      - text: Every subject of international law has identical rights and duties once personality is recognised.
        why: Tempting because personality sounds all-or-nothing, but Reparation for Injuries says subjects are not necessarily identical in the extent of their rights, and the slides stress partial capacity.
      - text: International organisations have fuller personality than states because they represent many member states at once and speak for all of them.
        why: "Tempting because an IO pools its members, but the reverse is true: an IO has only the powers its members give it, while states alone have full capacity."
  - key: q106
    type: mcq
    concept: subjects-and-international-legal-personality
    variant-of: q105
    difficulty: 3
    stem: A regional organisation is found to have international legal personality. Which consequence follows from this week's material?
    options:
      - text: It automatically has every right and immunity a state has, including general competence.
        why: Tempting because personality is shared with states, but the ICJ in Reparation said IO personality is not the same as a state's, and IOs have no general competence.
      - text: It can hold rights and bear obligations internationally, but only to the extent its functions require.
        correct: true
        why: Correct — personality lets the IO act on the international plane, but its capacity is partial and tied to the functions its members gave it, unlike the full capacity of states.
      - text: Its member states cease to be responsible for anything done under its name, because the organisation has taken over their personality entirely.
        why: Tempting because IO personality is distinct from its members', but it does not extinguish the members' own personality or every possible member responsibility (compare ARIO art 7).
  - key: q107
    type: mcq
    concept: subjects-and-international-legal-personality
    difficulty: 2
    cases: [reparation-for-injuries-suffered-in-the-service-of-the-united-nations]
    stem: What question prompted the General Assembly's request in Reparation for Injuries (1949)?
    options:
      - text: Whether Israel could be admitted to the UN.
        why: Tempting because Israel was the state concerned, but the request asked whether the UN could claim reparation from a state for injuries to its officials, not about admission.
      - text: Whether the UN could bring a claim against a state for injuries suffered by its own officials.
        correct: true
        why: Correct — the General Assembly asked whether the UN could claim reparation (against Israel) for injuries to its officials, which required deciding whether the UN had international legal personality.
      - text: Whether the Security Council could authorise the use of force under Chapter VII in the Middle East.
        why: Tempting because the events arose from conflict, but the opinion concerned the UN's capacity to bring an international claim, not the Security Council's use-of-force powers.
  - key: q108
    type: mcq
    concept: subjects-and-international-legal-personality
    difficulty: 2
    cases: [reparation-for-injuries-suffered-in-the-service-of-the-united-nations]
    stem: What did the ICJ conclude about the UN in Reparation for Injuries?
    options:
      - text: The UN is a state for the purposes of international law.
        why: Tempting because the Court gave the UN personality, but it expressly said that is "not the same thing as saying that it is a State, which it certainly is not".
      - text: The UN lacks international personality because the Charter never confers it, so it could not bring any claim against Israel.
        why: Tempting because the Charter is indeed silent on international personality, but the Court held that personality flows from the functions and rights the UN was intended to exercise.
      - text: The UN is an international person, but not a state, and its rights and duties are not the same as a state's.
        correct: true
        why: Correct — the Court held the Organization is an international person, while stressing this does not make it a state or give it the same rights and duties as a state.
  - key: q109
    type: mcq
    concept: subjects-and-international-legal-personality
    variant-of: q108
    difficulty: 3
    cases: [reparation-for-injuries-suffered-in-the-service-of-the-united-nations]
    stem: On what basis did the Court in Reparation for Injuries find that the UN had international personality?
    options:
      - text: An express clause in the UN Charter conferring international legal personality on the Organization in its relations with states.
        why: Tempting because explicit conferral is now the norm, but the lecture stresses the UN's international personality does not appear anywhere in the Charter.
      - text: The functions and rights the UN was intended to exercise, which only a large measure of international personality explains.
        correct: true
        why: Correct — the Court reasoned that the Organization was intended to exercise functions and rights which can only be explained on the basis of a large measure of international personality.
      - text: Recognition of the UN by Israel when the claim was notified.
        why: Tempting because recognition matters for states, but the Court did not rest the UN's personality on any state's recognition; it rested on the functions intended by the members.
  - key: q110
    type: mcq
    concept: subjects-and-international-legal-personality
    difficulty: 3
    cases: [reparation-for-injuries-suffered-in-the-service-of-the-united-nations]
    stem: What broader point about international law does the lecture draw from the Reparation opinion?
    options:
      - text: That international law is static, so that the subjects of international law are fixed at the time a treaty is signed.
        why: "Tempting because the Charter was a fixed text, but the lecture draws the opposite lesson: the opinion admits international law evolves as new developments arise."
      - text: That international law evolves with the needs of the community, so new kinds of subject can emerge.
        correct: true
        why: Correct — the Court said the nature of subjects "depends upon the needs of the community", and the lecture stresses that the judgment admits international law is evolving.
      - text: That only General Assembly resolutions can create new subjects of international law.
        why: Tempting because the General Assembly asked for the opinion, but the Court's reasoning was about functions and community needs, not about the Assembly's law-making power.
  - key: q111
    type: mcq
    concept: subjects-and-international-legal-personality
    difficulty: 2
    stem: Which pairing correctly matches a subject with the extent of its legal capacity?
    options:
      - text: State — partial capacity; international organisation — full capacity.
        why: Tempting to reverse the pairing, but the slides say states are the only subjects with full legal capacity and other subjects have partial capacity.
      - text: State — full capacity; international organisation — partial capacity.
        correct: true
        why: Correct — states have the most comprehensive rights, duties and competences; IOs have capacity limited to their functions as defined by their members.
      - text: State and international organisation — both full capacity, differing only in size.
        why: "Tempting because both are subjects, but personality comes in degrees: Reparation says an IO's rights and duties are not the same as a state's."
  - key: q112
    type: mcq
    concept: subjects-and-international-legal-personality
    contrasts-with: [emerging-actors-beyond-the-state]
    difficulty: 3
    stem: A student says, "Individuals have human rights under the ICCPR, so individuals have the same legal personality as states." What is the best response?
    options:
      - text: Agree, because any entity that holds rights under a binding treaty has full international legal personality like a state.
        why: Tempting because holding treaty rights is one capacity of subjecthood, but only states have full personality; individuals hold some rights and obligations, not the whole set.
      - text: Disagree, because individuals have no rights under international law at all.
        why: Tempting as an overcorrection, but after WWII individuals gained rights exercisable against states (UDHR, ECHR, ICCPR) and obligations under international criminal law.
      - text: Disagree — individuals may hold some rights and obligations, but only states have full legal personality.
        correct: true
        why: Correct — this separates partial personality (individuals' rights under human rights treaties and duties under international criminal law) from the full personality only states enjoy.
  - key: q113
    type: mcq
    concept: subjects-and-international-legal-personality
    difficulty: 1
    stem: Which subject does the slide describe as the primary subject of international law?
    options:
      - text: The 'nation' state.
        correct: true
        why: Correct — the slide says the nation state remains the primary subject, with international law traditionally understood as governing relationships between states.
      - text: The United Nations Organization, as the most important and nearly universal international organisation.
        why: Tempting because the UN is described as the most important IO, but it is an emerging subject with partial personality, not the primary subject.
      - text: The individual, as holder of human rights under the Universal Declaration of Human Rights.
        why: Tempting because human rights are prominent, but individuals were not originally subjects at all and still lack full legal personality.
  - key: q114
    type: mcq
    concept: subjects-and-international-legal-personality
    difficulty: 2
    stem: How did decolonisation affect the number of primary subjects of international law, according to the slides?
    options:
      - text: It reduced them, as colonies merged into larger federations.
        why: "Tempting if decolonisation is imagined as consolidation, but the slide records growth: UN membership rose from 51 to 193 as former colonies became states."
      - text: UN member states rose from 51 to 193, increasing the number of primary subjects.
        correct: true
        why: Correct — the slide says decolonisation in the 1950s and 1960s increased UN member states from 51 to 193 today, and so the number of primary subjects of international law.
      - text: It left the number unchanged, since former colonies were already treated as states before independence.
        why: Tempting but wrong — the lecture says a colony would not have been considered a state because it answered to an external authority, so independence created new states.
  - key: q115
    type: mcq
    concept: subjects-and-international-legal-personality
    variant-of: q103
    difficulty: 2
    stem: A state enters into a binding treaty with its neighbours on river management. Which capacity of subjecthood is it exercising?
    options:
      - text: The capacity to create international law.
        correct: true
        why: Correct — the slide gives making binding treaties as the example of the capacity to create international law; states are both subject to and creators of its rules.
      - text: The ability to enjoy immunities from other states' jurisdiction.
        why: Tempting because both are capacities of subjecthood, but immunity protects a state from other states' courts; it is not what a state exercises when it concludes a treaty.
      - text: The capacity to be subjected to an international claim for breach of obligation.
        why: Tempting because treaty obligations can later found claims, but concluding the treaty is law-creation, not being subjected to a claim for breach.
  - key: q116
    type: mcq
    concept: subjects-and-international-legal-personality
    difficulty: 3
    stem: Which of the following would be the weakest argument that an entity is a subject of international law?
    options:
      - text: It is widely admired by the governments of several states for its humanitarian work.
        correct: true
        why: Correct — admiration is not a legal capacity; subjecthood depends on holding international rights and obligations and being able to bring and face international claims.
      - text: It has concluded binding agreements with states under international law.
        why: A strong argument, not a weak one — concluding binding agreements is the capacity to create international law, which the slides list as a mark of subjecthood.
      - text: It has successfully brought an international claim to defend its rights.
        why: A strong argument, not a weak one — maintaining rights by bringing international claims is the first limb of Crawford's definition of a subject.
  - key: q117
    type: truefalse
    set: quickfire
    concept: subjects-and-international-legal-personality
    statement: States are the only subjects of international law with full legal capacity.
    answer: true
    why: True — the slides say states are the only subjects with full legal capacity; other subjects, such as international organisations, have only partial capacity.
  - key: q118
    type: truefalse
    set: quickfire
    concept: subjects-and-international-legal-personality
    statement: In Reparation for Injuries the ICJ held that the UN's legal personality and rights are the same as those of a state.
    answer: false
    why: False — the Court held the UN is an international person but said that is not the same as saying it is a State, or that its rights and duties are the same as a state's.
  - key: q119
    type: truefalse
    set: quickfire
    concept: subjects-and-international-legal-personality
    statement: The UN Charter expressly confers international legal personality on the United Nations.
    answer: false
    why: False — the lecture stresses that the UN's international personality appears nowhere in the Charter; the ICJ found it implicitly in Reparation for Injuries (1949).
  - key: q120
    type: short
    concept: subjects-and-international-legal-personality
    difficulty: 3
    prompt: |
      What does it mean to be a subject of international law? Explain, with reference to Reparation for Injuries,
      how the legal personality of an international organisation differs from that of a state.
    model: |
      A subject of international law is "an entity possessing international rights and obligations and having the
      capacity (1) to maintain its rights by bringing international claims; and (2) to be responsible for its
      breaches of obligation by being subjected to such claims" (Crawford). Asking who is a subject is asking who has
      international legal personality. Capacities ascribed to subjecthood include claiming rights, entering diplomatic
      relations, bearing obligations imposed directly by international law, creating law (e.g. binding treaties) and
      enjoying immunities from other states' jurisdiction.

      States are the only subjects with full legal capacity. Other subjects have partial capacity. In Reparation for
      Injuries (1949) the ICJ held that the UN, although its Charter is silent, is an international person, because
      it was intended to exercise functions and rights that can only be explained by a large measure of
      international personality. But the Court stressed this "is not the same thing as saying that it is a State" or
      that its rights and duties are the same as a state's: subjects "are not necessarily identical in their nature
      or in the extent of their rights". An IO's capacity is therefore functional — limited to what its members gave
      it — and it has no general competence, whereas a state's capacity is comprehensive.
    rubric:
      - id: r1
        criterion: Defines a subject of international law and links subjecthood to international legal personality.
        marks: 2
        top-band: Gives Crawford's two-limb definition (claims and responsibility) and ties it to legal personality.
        margin-note: Good — the definition drives the rest of the answer.
        authorities: []
      - id: r2
        criterion: Identifies the capacities ascribed to subjecthood.
        marks: 1
        top-band: Lists several capacities (claims, diplomatic relations, obligations, law-making, immunities) with an example.
        margin-note: Useful to show personality is a bundle of capacities.
        authorities: []
      - id: r3
        criterion: Explains Reparation for Injuries and its basis for implicit personality.
        marks: 2
        top-band: States the question (UN claim for injuries to its officials), the silence of the Charter, and the functional reasoning.
        margin-note: Accurate use of the leading authority.
        authorities: []
      - id: r4
        criterion: Contrasts the full capacity of states with the partial, functional capacity of IOs.
        marks: 2
        top-band: Uses the Court's "not the same thing as ... a State" language and links partial capacity to the absence of general competence.
        margin-note: Strong comparison — this is the point the question asks for.
        authorities: []

  # ---------- Concept 2: emerging-actors-beyond-the-state ----------
  - key: q201
    type: mcq
    concept: emerging-actors-beyond-the-state
    difficulty: 1
    stem: When, according to the lecture, did individuals begin to receive real consideration as holders of rights under international law?
    options:
      - text: After World War II, with the creation of the UN and the adoption of human rights treaties.
        correct: true
        why: Correct — the lecture says it is really after WWII, when the UN was created, that many treaties granting international rights to individuals were adopted.
      - text: At the Peace of Westphalia in 1648, when sovereign states first emerged.
        why: Tempting because Westphalia is the origin of the modern state system, but it organised the world into sovereign states; individuals had no international rights then.
      - text: Only in 2011, with the adoption of the Guiding Principles on Business and Human Rights by the UN.
        why: Tempting because 2011 appears this week, but those principles concern corporations and are non-binding; individual rights began to emerge decades earlier.
  - key: q202
    type: mcq
    concept: emerging-actors-beyond-the-state
    difficulty: 2
    stem: How were individuals treated under international law before that change, according to the lecture?
    options:
      - text: As full subjects with rights enforceable before international courts.
        why: Tempting if later developments are read back, but the lecture says individuals were not originally considered subjects of international law at all.
      - text: As the responsibility of their state of nationality, relevant internationally only when an injury to them injured that state.
        correct: true
        why: Correct — the lecture says individuals were the responsibility of their state of nationality, and only mattered internationally if harm to them was treated as an injury to that state.
      - text: As subjects of international criminal law only, from the time of the Nuremberg trials.
        why: Tempting because Nuremberg is the origin of international criminal law, but it came after WWII and the lecture describes the earlier position as no individual rights or obligations.
  - key: q203
    type: mcq
    concept: emerging-actors-beyond-the-state
    difficulty: 2
    stem: What is the difference in legal status between the Universal Declaration of Human Rights 1948 and the ICCPR 1966?
    options:
      - text: The Declaration is non-binding; the ICCPR is binding on states that ratify it.
        correct: true
        why: Correct — the lecture calls the UDHR a milestone but non-binding, and the ICCPR binding for those who have signed and ratified it (copying rights from the Declaration).
      - text: Both are binding treaties, but the ICCPR binds only European states under its regional regime.
        why: Tempting because of the regional European Convention on Human Rights, but the ICCPR is a universal covenant, and the UDHR is not a binding treaty at all.
      - text: The Declaration is binding customary law and the ICCPR merely a political statement of aspiration for the future.
        why: Tempting to reverse them, but the slides mark the ICCPR as "binding treaty law", while the lecture describes the UDHR as a non-binding instrument.
  - key: q204
    type: mcq
    concept: emerging-actors-beyond-the-state
    difficulty: 2
    stem: How did the eight Torres Strait Islanders bring their climate claim against Australia before the Human Rights Committee?
    options:
      - text: Under the Optional Protocol to the ICCPR, which lets individuals complain once domestic options are exhausted.
        correct: true
        why: Correct — the lecture explains that the ICCPR Optional Protocol lets individuals bring a claim before the Committee after exhausting their domestic options, if the state has accepted it.
      - text: By suing Australia in the International Court of Justice.
        why: Tempting because the ICJ hears claims against states, but only states can be parties to contentious ICJ cases; the Islanders used the individual complaint mechanism.
      - text: Through a referral by the UN Security Council to the International Criminal Court.
        why: Tempting because the ICC deals with individuals, but it tries individuals for crimes; this was a human rights complaint by individuals against a state.
  - key: q205
    type: mcq
    concept: emerging-actors-beyond-the-state
    variant-of: q204
    difficulty: 3
    stem: What did the Torres Strait Islanders argue, and what was the result, as described in the lecture?
    options:
      - text: That Australia's failure to implement and mitigate climate commitments violated rights such as enjoying their culture; they won and Australia accepted the recommendation.
        correct: true
        why: Correct — they claimed violations of their rights to enjoy their culture and to be free from arbitrary interference with family and private life; they won and Australia accepted the recommendation.
      - text: That Australia had seized their islands by conquest; the Committee ordered the islands returned.
        why: Tempting because territory is a theme this week, but the complaint was about climate change inaction and human rights, not conquest or title.
      - text: That the Islanders were a separate state; the Committee recognised their statehood.
        why: Tempting because peoples' rights are discussed, but the Committee does not recognise states; the claim concerned individual human rights under the ICCPR.
  - key: q206
    type: mcq
    concept: emerging-actors-beyond-the-state
    difficulty: 2
    stem: Why was Slobodan Milošević's 1999 indictment by the ICTY a milestone?
    options:
      - text: It was the first time a head of state was indicted before an international tribunal for crimes against humanity.
        correct: true
        why: Correct — the lecture says this was the first time a head of state was indicted for crimes against humanity before an international tribunal, a milestone in international criminal law.
      - text: It was the first time a state itself was held criminally responsible for crimes committed by its own armed forces.
        why: Tempting because heads of state represent states, but the indictment was of an individual; international criminal law imposes obligations on individuals, not criminal liability on states.
      - text: It created the International Criminal Court.
        why: Tempting because the ICC emerged in the same decade, but the ICTY is a separate tribunal and the indictment did not create the ICC.
  - key: q207
    type: mcq
    concept: emerging-actors-beyond-the-state
    difficulty: 2
    stem: International criminal law is the lecture's best example of what, in relation to individuals?
    options:
      - text: Individuals bearing obligations directly under international law.
        correct: true
        why: Correct — the lecture says individuals may have rights but may also have obligations, and international criminal law is probably the best example of the obligations side.
      - text: Individuals exercising the right of self-determination through international criminal tribunals.
        why: Tempting because peoples have self-determination rights, but international criminal law is about individual criminal responsibility, not self-determination claims.
      - text: Individuals obtaining full legal personality equal to that of states.
        why: Tempting because individuals can now face international tribunals, but that gives them specific obligations, not the full personality only states have.
  - key: q208
    type: mcq
    concept: emerging-actors-beyond-the-state
    difficulty: 2
    stem: What is the legal status of the 2007 UN Declaration on the Rights of Indigenous Peoples, as described in the lecture?
    options:
      - text: A binding treaty that all UN members must ratify.
        why: Tempting because it is a UN instrument, but the lecture stresses it is a declaration and not binding, although it has a certain influence.
      - text: Not binding, though influential; ILO conventions on indigenous rights bind states that ratify them.
        correct: true
        why: Correct — the lecture says the Declaration is not binding but has a certain influence, while certain ILO conventions recognising indigenous rights are binding if ratified.
      - text: A Security Council resolution binding on every state under the UN Charter's Chapter VII.
        why: Tempting because some UN acts bind all members, but this is a General Assembly declaration, and the lecture calls it non-binding.
  - key: q209
    type: mcq
    concept: emerging-actors-beyond-the-state
    difficulty: 3
    stem: How does the lecture suggest we identify whether a group is a "people" for international law purposes?
    options:
      - text: By a formal definition in the UN Charter.
        why: Tempting because the Charter refers to peoples, but the lecture says there is no clear definition of what a people is.
      - text: By whether the group has been recognised as a state by at least two-thirds of the General Assembly and the Security Council.
        why: Tempting because recognition is this week's topic, but that is collective recognition of states; a people need not be, and usually is not, a state.
      - text: By indications such as a shared language, territory or culture, since there is no clear definition.
        correct: true
        why: Correct — the lecture says "people" is not a clear concept, so we look at whether the group has a shared language, territory or culture as indications.
  - key: q210
    type: mcq
    concept: emerging-actors-beyond-the-state
    contrasts-with: [self-determination-and-secession]
    difficulty: 3
    stem: How do minority rights differ from the rights of peoples, according to the lecture?
    options:
      - text: Minority rights are usually claimed by individuals in their individual capacity, often before domestic tribunals.
        correct: true
        why: Correct — the lecture says minority rights are usually claimed individually (e.g. a French speaker outside Quebec), unlike peoples' rights, which belong to the group.
      - text: Minority rights include a right to secede that peoples do not have under international law.
        why: Tempting because minorities may seek independence, but it is peoples who hold self-determination; minority rights protect culture, language and religion, not secession.
      - text: Minority rights exist only under customary law, while the rights of peoples exist only under treaty.
        why: Tempting as a neat split, but the lecture draws the distinction by who claims the right (individual versus group), not by source.
  - key: q211
    type: mcq
    concept: emerging-actors-beyond-the-state
    variant-of: q210
    difficulty: 3
    stem: A French-speaking resident of Ontario is refused service in French by a federal official and goes to a Canadian tribunal. What kind of right is being claimed?
    options:
      - text: A people's right to self-determination.
        why: Tempting because language is a marker of a people, but the lecture uses this very example as a minority right claimed individually, not group self-determination.
      - text: A minority right, claimed in the person's individual capacity.
        correct: true
        why: "Correct — the lecture's Canadian example: official-language minorities outside Quebec can claim before a tribunal that their right to deal with government in French was not respected."
      - text: An obligation under international humanitarian law, enforceable against the Canadian government by the individual concerned.
        why: Tempting because non-state actors appear in the same lecture, but IHL applies to armed conflict; this is a minority language right.
  - key: q212
    type: mcq
    concept: emerging-actors-beyond-the-state
    difficulty: 2
    stem: Which provision does the lecture identify as applying international humanitarian law obligations to non-state armed actors?
    options:
      - text: Common Article 3 of the Geneva Conventions.
        correct: true
        why: Correct — the lecture says common Article 3 of the Geneva Conventions applies to non-state actors, with other protocols defining their obligations further.
      - text: Article 2(4) of the UN Charter on the use of force.
        why: Tempting because it concerns force, but art 2(4) is addressed to states in their international relations; the lecture points to the Geneva Conventions for armed groups.
      - text: Article 1 of the ICCPR on self-determination of peoples.
        why: Tempting because armed groups sometimes invoke self-determination, but ICCPR art 1 confers a right on peoples; it does not impose IHL obligations on armed groups.
  - key: q213
    type: mcq
    concept: emerging-actors-beyond-the-state
    variant-of: q212
    difficulty: 3
    stem: A non-state armed group fighting a government captures soldiers. What does this week's material say about its obligations?
    options:
      - text: It has none, because only states are bound by international law.
        why: Tempting because states are the primary subjects, but the lecture says non-state actors in armed conflict are bound by certain IHL obligations, e.g. regarding prisoners and civilians.
      - text: It is bound by certain IHL obligations, for example towards prisoners and civilians, even though it is not a state.
        correct: true
        why: Correct — the lecture says such groups must uphold certain obligations in respect of prisoners and the protection of civilians, which may differ from a state's but still bind them.
      - text: It is bound by exactly the same obligations as a state party to every human rights treaty that the government has ratified.
        why: Tempting because both parties fight the same conflict, but the lecture says the armed group's obligations may differ from a state's; they come from IHL, not the state's treaties.
  - key: q214
    type: mcq
    concept: emerging-actors-beyond-the-state
    difficulty: 2
    stem: What is the current position on multinational corporations under international law, according to the slides?
    options:
      - text: They have binding human rights obligations under the 2011 Guiding Principles.
        why: Tempting because the Guiding Principles address business and human rights, but the lecture stresses they are not binding.
      - text: They have some rights (e.g. investment protection) but, to date, no legally binding obligations.
        correct: true
        why: Correct — the slide says corporations have certain rights under international economic law but, to date, no legally binding obligations under international law.
      - text: They are full subjects with the same capacity as states.
        why: Tempting because some corporations are economically powerful, but the slide calls them a new frontier subject to debate, far from full legal personality.
  - key: q215
    type: mcq
    concept: emerging-actors-beyond-the-state
    difficulty: 3
    stem: A mining company operating abroad is accused of violating workers' rights. Which statement best reflects this week's material?
    options:
      - text: The company can be prosecuted at the ICC for breaching the Guiding Principles on Business and Human Rights.
        why: Tempting because the ICC tries non-state actors, but it tries individuals for international crimes, and the Guiding Principles are non-binding.
      - text: There is no legally binding international obligation on the company to respect human rights as such, only non-binding guidance.
        correct: true
        why: Correct — the lecture says there are no legally binding obligations for multinational corporations to respect human rights; the 2011 Guiding Principles are not binding.
      - text: The company's home state automatically becomes a party to the dispute.
        why: Tempting because states answer for many things, but nothing this week makes a home state automatically a party; the point is the gap in corporate obligations.
  - key: q216
    type: mcq
    concept: emerging-actors-beyond-the-state
    contrasts-with: [subjects-and-international-legal-personality]
    difficulty: 3
    stem: Which actor, as described this week, holds rights under international law but has no binding obligations?
    options:
      - text: A multinational corporation.
        correct: true
        why: Correct — corporations have rights under international economic law (investment protections) but, the slide says, no legally binding obligations to date.
      - text: A non-state armed group in a non-international armed conflict.
        why: Tempting because armed groups are not states, but they do bear obligations under IHL, including common Article 3 of the Geneva Conventions.
      - text: An individual accused of crimes against humanity before an international tribunal.
        why: Tempting because individuals hold human rights, but international criminal law shows individuals also bear binding obligations.
      - text: A state that has ratified the ICCPR and its Optional Protocol.
        why: Tempting because states hold rights, but a state that ratifies human rights treaties plainly bears binding obligations under them.
  - key: q217
    type: mcq
    concept: emerging-actors-beyond-the-state
    difficulty: 1
    stem: Which of these is an example of a group of individuals given rights under international law, as listed on the slides?
    options:
      - text: Indigenous peoples.
        correct: true
        why: Correct — the slides list peoples, including indigenous peoples (e.g. the 2007 UN Declaration and ILO conventions), among groups with rights under international law.
      - text: Informal networks of states such as the G20.
        why: Tempting because the G20 is a group, but it is a group of states, and the slides mention it only as an informal network that is not an international organisation.
      - text: Non-governmental organisations such as Greenpeace and Amnesty International.
        why: Tempting because NGOs are non-state actors, but they are governed by domestic law, and the slides use them only to distinguish IOs, not as rights-holding groups.
  - key: q218
    type: truefalse
    set: quickfire
    concept: emerging-actors-beyond-the-state
    statement: The Universal Declaration of Human Rights 1948 is a binding treaty.
    answer: false
    why: False — the lecture describes the UDHR as a milestone but a non-binding instrument, which later gave way to binding treaties such as the ICCPR and ICESCR.
  - key: q219
    type: truefalse
    set: quickfire
    concept: emerging-actors-beyond-the-state
    statement: Non-state armed actors can be bound by obligations under international humanitarian law.
    answer: true
    why: True — the lecture says non-state armed actors in armed conflict are bound by certain IHL obligations, with common Article 3 of the Geneva Conventions applying to them.
  - key: q220
    type: truefalse
    set: quickfire
    concept: emerging-actors-beyond-the-state
    statement: Multinational corporations currently have legally binding human rights obligations under international law.
    answer: false
    why: False — the slides say that to date there are no legally binding obligations on multinationals; the 2011 Guiding Principles on Business and Human Rights are not binding.

  # ---------- Concept 3: montevideo-criteria-for-statehood ----------
  - key: q301
    type: mcq
    concept: montevideo-criteria-for-statehood
    difficulty: 1
    set: pretest
    stem: Which of the following is NOT one of the four criteria of statehood in Article 1 of the Montevideo Convention?
    options:
      - text: Recognition by a majority of existing states.
        correct: true
        why: Correct — Article 1 lists a permanent population, a defined territory, government and capacity to enter into relations with other states; recognition is a separate, debated question.
      - text: A permanent population living on the territory, whatever its size.
        why: Wrong choice — a permanent population is criterion (a) of Article 1, and the lecture adds that its size does not matter.
      - text: A defined territory, even if some of its borders are disputed.
        why: Wrong choice — a defined territory is criterion (b), and North Sea Continental Shelf confirms borders need not be fully delimited.
      - text: A capacity to enter into relations with other states.
        why: Wrong choice — capacity to enter into relations with other states is criterion (d) of Article 1 of the Montevideo Convention.
  - key: q302
    type: mcq
    concept: montevideo-criteria-for-statehood
    difficulty: 2
    stem: The Montevideo Convention is an old, regional treaty with few parties. Why is Article 1 nonetheless applied to all states?
    options:
      - text: Because every UN member state is required to ratify it as a condition of admission under Article 4 of the Charter.
        why: Tempting because UN admission has conditions, but Article 4 requires peace-loving states that accept Charter obligations; it does not require ratifying Montevideo.
      - text: Because it is widely regarded as codifying customary international law.
        correct: true
        why: Correct — the slide says Article 1 is widely regarded as codifying custom, so its criteria bind states whether or not they are parties to the Convention.
      - text: Because the ICJ Statute lists it as the definitive source for identifying which entities can appear before the Court.
        why: Tempting because the ICJ Statute appears in this unit, but Article 38 lists sources in general; it says nothing about Montevideo, whose force comes from custom.
  - key: q303
    type: mcq
    concept: montevideo-criteria-for-statehood
    difficulty: 1
    stem: What does the permanent population criterion require?
    options:
      - text: A minimum of 100,000 inhabitants who hold the entity's nationality.
        why: Tempting because some threshold seems sensible, but the slide says no fixed or minimum number is prescribed (Nauru has about 12,000) and the criterion does not relate to nationality.
      - text: A population that is a majority of one ethnic group, able to show it is a single people.
        why: Tempting because peoples matter for self-determination, but statehood's population criterion has nothing to do with ethnicity; it asks only for a core permanent population.
      - text: Some core population inhabiting the territory permanently, of any size.
        correct: true
        why: Correct — the slide says the size of the population is irrelevant; what is required is some core population inhabiting the territory on a permanent basis.
  - key: q304
    type: mcq
    concept: montevideo-criteria-for-statehood
    variant-of: q303
    difficulty: 2
    stem: Most residents of a small island entity are long-term foreign nationals working there permanently. Does this defeat the population criterion?
    options:
      - text: No — the criterion does not relate to nationality, only to a core population living there permanently.
        correct: true
        why: Correct — the lecture says it doesn't even matter if the permanent population are nationals of that country, as long as there is a core permanent population living there.
      - text: Yes — a population must consist mainly of the entity's own nationals before it can count for the purposes of statehood.
        why: Tempting because nationality and statehood are linked in everyday thinking, but the slide says expressly that the criterion does not relate to nationality.
      - text: Yes — because the island is small, its population is presumed temporary.
        why: Tempting because small states seem fragile, but size is irrelevant (Nauru, Tuvalu are states); only permanence of a core population matters.
  - key: q305
    type: mcq
    concept: montevideo-criteria-for-statehood
    difficulty: 2
    cases: [north-sea-continental-shelf-cases]
    stem: Which authority does the slide cite for the point that a state's boundaries need not be fully fixed?
    options:
      - text: The Reparation for Injuries Advisory Opinion (1949).
        why: Tempting because it is this week's main ICJ opinion, but Reparation concerns the UN's legal personality, not the definition of state territory.
      - text: North Sea Continental Shelf (1969), para 46.
        correct: true
        why: Correct — the slide quotes para 46 — "no rule that the land frontiers of a State must be fully delimited and defined" — for the defined territory criterion.
      - text: The Kosovo Advisory Opinion (2010), on the declaration of independence and the recognition of new states.
        why: Tempting because Kosovo concerns statehood, but it is cited for illegality and recognition, not for the rule that borders can be undefined.
  - key: q306
    type: mcq
    concept: montevideo-criteria-for-statehood
    variant-of: q305
    difficulty: 3
    cases: [north-sea-continental-shelf-cases]
    stem: Two neighbouring states have disputed part of their land border for decades. Does either fail the defined territory criterion?
    options:
      - text: Yes — both fail until the ICJ delimits the border.
        why: Tempting because "defined" suggests fixed lines, but North Sea Continental Shelf says there is no rule that land frontiers must be fully delimited, and border disputes are common.
      - text: Only the smaller state fails, because territory must exceed a minimum size once any part of it is disputed.
        why: Tempting because size and dispute seem to compound, but the slide says no minimum size is prescribed (Vatican about 0.5 sq km) and disputes do not undermine the claim.
      - text: No — defined boundaries need not be completely fixed or undisputed.
        correct: true
        why: Correct — the lecture says a contested border is not going to undermine a claim to statehood; the North Sea Continental Shelf case tells us so.
  - key: q307
    type: mcq
    concept: montevideo-criteria-for-statehood
    difficulty: 2
    stem: Which criterion does the lecture describe as "the most tricky one"?
    options:
      - text: Effective government.
        correct: true
        why: "Correct — the lecture calls effective government the most tricky: the government must be the only entity with power over the territory and population, independent of any external entity."
      - text: A defined territory, because most states have at least one border dispute with a neighbour.
        why: Tempting because border disputes are common, but the lecture treats territory as relatively easy — disputes do not undermine statehood.
      - text: A permanent population, because it is hard to count how many people live permanently in a territory.
        why: Tempting because counting is hard, but the lecture calls population "relatively easy to meet" — any size will do.
  - key: q308
    type: mcq
    concept: montevideo-criteria-for-statehood
    difficulty: 2
    stem: Why would a colony not have qualified as a state under the effective government criterion?
    options:
      - text: Because colonies usually had very small populations that were not permanently resident.
        why: Tempting because some colonies were small, but population size is irrelevant; the problem is the colony's lack of independence from an outside power.
      - text: Because its government answered to an external entity rather than being independent.
        correct: true
        why: Correct — the lecture says an effective government is an independent entity that does not respond to another external entity, so a colony would not have been considered a state.
      - text: Because colonies were barred by the UN Charter from having any government of their own at all.
        why: Tempting because the Charter addresses colonies, but it contains no such bar; the point is simply that a colonial administration answers to the colonial power.
  - key: q309
    type: mcq
    concept: montevideo-criteria-for-statehood
    difficulty: 3
    stem: A long-established state loses control of half its territory in a civil war. What is its status?
    options:
      - text: It ceases to be a state until the government regains control.
        why: Tempting because effective government is a criterion, but once statehood is established a presumption of continuity applies; ineffective government does not necessarily end it.
      - text: It remains a state, because established statehood carries a presumption of continuity.
        correct: true
        why: Correct — the slide says once statehood is established it carries a presumption of continuity; states such as Somalia or Syria remain states despite losing control.
      - text: It becomes a territory under UN trusteeship automatically, until a new government is recognised by the Security Council.
        why: Tempting because the UN has administered territories (e.g. Kosovo), but nothing makes this automatic; the state simply continues to exist.
  - key: q310
    type: mcq
    concept: montevideo-criteria-for-statehood
    variant-of: q309
    difficulty: 3
    contrasts-with: [recognition-of-states]
    stem: Why does effective government matter more for a new entity claiming statehood than for an established state?
    options:
      - text: Because established states enjoy a presumption of continuity, while effectiveness remains important for establishing and recognising new states.
        correct: true
        why: Correct — the slide says ineffective government does not necessarily affect an existing state's statehood, but effectiveness remains important for the establishment and recognition of new states.
      - text: Because established states are exempt from the Montevideo Convention entirely.
        why: Tempting because the presumption protects established states, but they are not exempt; the presumption relaxes the effectiveness test once statehood exists.
      - text: Because new entities must also have a democratic government to be recognised by the international community.
        why: Tempting because democracy seems relevant, but the slide says no form of government is prescribed; dictatorships and democracies alike can be states.
  - key: q311
    type: mcq
    concept: montevideo-criteria-for-statehood
    difficulty: 2
    stem: An entity meets every other criterion but is ruled by an unelected military council. Does its form of government prevent statehood?
    options:
      - text: Yes — international law requires a democratically elected government, so autocratic entities fail criterion (c).
        why: Tempting because democracy is valued, but the slide says no specific form of government is prescribed; the lecture ties this to state sovereignty over one's own system.
      - text: No — no form of government is prescribed; autocratic rule does not matter.
        correct: true
        why: Correct — the lecture says it doesn't matter what form of government the state takes; it can be autocratic and still qualify, reflecting state sovereignty.
      - text: Only if the Security Council declares the military council illegitimate.
        why: Tempting because the Security Council has declared some entities invalid (the TRNC), but that concerned illegal creation by force, not the form of government.
  - key: q312
    type: mcq
    concept: montevideo-criteria-for-statehood
    difficulty: 2
    stem: Why does the lecture use Scotland as an example?
    options:
      - text: It fails the population criterion because many residents are not UK nationals.
        why: Tempting because nationality is discussed, but the population criterion does not relate to nationality; Scotland is used for the fourth criterion.
      - text: It may meet the first three criteria but lacks capacity to enter into international relations on its own.
        correct: true
        why: Correct — the slide says Scotland might meet the other three criteria but cannot conduct international relations on its own; borders and treaties are handled at UK level.
      - text: It is a state that has been recognised only by the UK, like the TRNC, which has been recognised by Turkey alone.
        why: Tempting because the TRNC is recognised by one state, but Scotland is not a state; it is an example of failing the capacity criterion.
  - key: q313
    type: mcq
    concept: montevideo-criteria-for-statehood
    variant-of: q312
    difficulty: 3
    stem: Greenland has its own territory, population and government but is part of Denmark. Which criterion does the lecture suggest it lacks?
    options:
      - text: A defined territory, because the island is ice-covered.
        why: Tempting because much of Greenland is ice, but territory has no quality requirement; the lecture uses Greenland for the capacity criterion.
      - text: A permanent population, since much of Greenland is uninhabited.
        why: Tempting because Greenland is sparsely populated, but any core permanent population suffices; size is irrelevant.
      - text: Full independence, and so the capacity to enter into international relations.
        correct: true
        why: "Correct — the lecture pairs Greenland with Scotland: it has its own territory, population and government but is not fully independent, so lacks capacity for international relations."
  - key: q314
    type: mcq
    concept: montevideo-criteria-for-statehood
    difficulty: 1
    stem: What is the minimum size of territory for statehood?
    options:
      - text: There is none.
        correct: true
        why: Correct — the slide says no minimum size is prescribed; the Vatican (about 0.5 sq km) and micro states such as Monaco, Nauru and Tuvalu are states.
      - text: At least 25 sq km, the size of inner-city Sydney, which is the benchmark on the slide.
        why: Tempting because the slide mentions inner Sydney's 25 sq km, but only for comparison; the Vatican, at about 0.5 sq km, is a state.
      - text: Enough land to support the population without imports.
        why: Tempting as a practical test, but the criterion sets no economic or size requirement; states cannot exist without some territory, but it may be tiny.
  - key: q315
    type: mcq
    concept: montevideo-criteria-for-statehood
    difficulty: 3
    stem: Crawford describes the state as "a stable political community supporting a legal order to the exclusion of others in a given area". Which criterion does this capture?
    options:
      - text: Capacity to enter into relations with other states.
        why: Tempting because relations presuppose a stable community, but the quotation is used on the slide to explain effective government.
      - text: Effective government.
        correct: true
        why: "Correct — the slide uses Crawford's phrase to explain effective government: a coherent and effective exercise of public power over the territory and population."
      - text: A permanent population that is loyal to one legal order, which excludes loyalties to others in the area.
        why: Tempting because "community" suggests population, but the slide attaches this phrase to the effective government criterion, not population.
  - key: q316
    type: mcq
    concept: montevideo-criteria-for-statehood
    difficulty: 4
    contrasts-with: [recognition-of-states]
    stem: Applying the criteria to a new entity, in what order does the week's approach suggest you work?
    options:
      - text: Apply each Montevideo criterion to the facts, then consider what recognition adds and whether the criteria were achieved lawfully.
        correct: true
        why: Correct — the criteria are the legal test; recognition (declaratory or constitutive) and illegality (non-recognition) are then layered on, as the lecture's TRNC example shows.
      - text: Check recognition first; if fewer than 100 states recognise the entity, stop, since the criteria are then irrelevant.
        why: Tempting because recognition counts are quoted for Kosovo and Palestine, but no threshold exists and, on the prevailing declaratory view, the criteria come first.
      - text: Check only effective government, since the other criteria are always met by any entity with a government.
        why: Tempting because government is the most tricky criterion, but Scotland shows an entity can meet three and still fail capacity; each criterion must be applied.
  - key: q317
    type: truefalse
    set: quickfire
    concept: montevideo-criteria-for-statehood
    statement: A state must have fully delimited land borders to satisfy the defined territory criterion.
    answer: false
    why: False — North Sea Continental Shelf [46] says there is no rule that land frontiers must be fully delimited, and border disputes are a common phenomenon among states.
  - key: q318
    type: truefalse
    set: quickfire
    concept: montevideo-criteria-for-statehood
    statement: Once statehood is established, it carries a presumption of continuity even if the government becomes ineffective.
    answer: true
    why: True — the slide says ineffective government does not necessarily affect established statehood; Somalia, Syria and Yemen remain states though described as fragile or failed.
  - key: q319
    type: truefalse
    set: quickfire
    concept: montevideo-criteria-for-statehood
    statement: The permanent population criterion requires the population to hold the nationality of the entity.
    answer: false
    why: False — the slide says the criterion does not relate to nationality; it requires only some core population inhabiting the territory on a permanent basis.
  - key: q320
    type: short
    concept: montevideo-criteria-for-statehood
    difficulty: 3
    prompt: What are the criteria necessary to meet the international definition of statehood? Explain each, with examples from this week.
    model: |
      The criteria are in Article 1 of the Montevideo Convention on Rights and Duties of States (1933): a permanent
      population, a defined territory, government, and capacity to enter into relations with other states. Although
      the Convention is regional with few parties, it is widely regarded as codifying customary international law.

      Population: no minimum is prescribed (Nauru about 12,000, China about 1.4 billion); what matters is a core
      population living there permanently, and the criterion does not relate to nationality. Territory: states cannot
      exist without territory, but there is no minimum size (the Vatican, about 0.5 sq km). Boundaries must be defined
      but need not be fixed or undisputed — North Sea Continental Shelf [46] says there is no rule that land frontiers
      must be fully delimited. Effective government: the most tricky; a coherent and effective exercise of public
      power, independent of any external entity (a colony would not qualify). Once statehood is established, a
      presumption of continuity means ineffective government (Somalia, Syria) does not end it, and no form of
      government is prescribed. Capacity for international relations: it arises from independence; Scotland may meet
      the other three criteria but cannot conduct international relations on its own.
    rubric:
      - id: r1
        criterion: States the four Montevideo criteria and the Convention's customary status.
        marks: 2
        top-band: Lists all four accurately and explains why a regional treaty binds generally.
        margin-note: Good starting point — criteria plus source.
        authorities: [montevideo-convention-1933-art-1]
      - id: r2
        criterion: Explains population and territory, including the absence of minimums and the rule on borders.
        marks: 2
        top-band: Notes irrelevance of size and nationality, and uses North Sea Continental Shelf for undelimited borders.
        margin-note: Nice use of authority on territory.
        authorities: []
      - id: r3
        criterion: Explains effective government, the presumption of continuity and the irrelevance of form of government.
        marks: 2
        top-band: Distinguishes new entities from established states and gives a failed-state example.
        margin-note: This is where most answers are thin — well handled.
        authorities: []
      - id: r4
        criterion: Explains capacity to enter into relations with an example.
        marks: 1
        top-band: Links capacity to independence and uses Scotland or Greenland.
        margin-note: Apt example.
        authorities: []

  # ---------- Concept 4: recognition-of-states ----------
  - key: q401
    type: mcq
    concept: recognition-of-states
    difficulty: 1
    set: pretest
    stem: Under the declaratory theory, what is the effect of recognising a new state?
    options:
      - text: Recognition creates the state and confers legal personality on it for the first time.
        why: Tempting because recognition sounds decisive, but that is the constitutive theory; the declaratory theory says statehood exists independently of recognition.
      - text: It acknowledges a statehood that already exists; it is essentially symbolic.
        correct: true
        why: Correct — under the declaratory theory, recognition is nothing more than an acknowledgment of pre-existing legal capacity; the lecture calls it only a symbolic act.
      - text: It makes the new state a member of the UN, because recognition by any existing member is enough for admission.
        why: Tempting because recognition and UN membership are linked, but admission needs a Security Council recommendation and a two-thirds General Assembly vote.
  - key: q402
    type: mcq
    concept: recognition-of-states
    difficulty: 1
    stem: Which theory of recognition is summed up as "no recognition, no existence"?
    options:
      - text: The constitutive theory.
        correct: true
        why: Correct — under the constitutive theory recognition is a necessary precondition to statehood; the lecture's memory aid is that recognition constitutes the state.
      - text: The declaratory theory, which is the most widely held theory of recognition today.
        why: Tempting because it is the mainstream theory, but the declaratory theory holds that statehood does not depend on recognition at all.
      - text: The principle of speciality, which limits entities to the powers they have been given.
        why: Tempting because it is another named principle this week, but speciality concerns the powers of international organisations, not recognition of states.
  - key: q403
    type: mcq
    concept: recognition-of-states
    variant-of: q401
    contrasts-with: [montevideo-criteria-for-statehood]
    difficulty: 3
    stem: An entity clearly meets all four Montevideo criteria, but only three states recognise it. On the prevailing view, is it a state?
    options:
      - text: No — without recognition by most states it has no legal personality.
        why: Tempting on the constitutive theory, but the lecture says the declaratory theory is the one most widely held today, under which recognition is not required.
      - text: Yes — on the declaratory theory, meeting the criteria makes it a state; recognition is only symbolic.
        correct: true
        why: Correct — under the mainstream declaratory theory, if you meet all the criteria of Article 1 you become a state, and recognition has no legal effect per se.
      - text: Only once the UN General Assembly votes to admit it by a two-thirds majority of members present and voting.
        why: Tempting because UN admission is collective recognition, but UN membership is not a criterion of statehood; many recognised states could be blocked by a veto.
  - key: q404
    type: mcq
    concept: recognition-of-states
    difficulty: 2
    stem: How does the lecture describe the relationship between law and politics in recognition?
    options:
      - text: "Recognition is purely legal: a state must recognise any entity that meets the Montevideo criteria."
        why: Tempting because the criteria are legal, but the lecture says states sometimes refuse to recognise entities that meet them, for political reasons.
      - text: Recognition is a complex mixture of politics and law, often an extension of politics.
        correct: true
        why: Correct — the slide says recognition is a complex mixture of politics and law and the law on recognition is often an extension of politics, highly influenced by geopolitics.
      - text: Recognition is purely political and has no legal consequences at all, even for the state that gives it.
        why: Tempting given the politics, but the lecture says recognising a state creates obligations (respect its sovereignty, do not interfere) and cannot be retracted.
  - key: q405
    type: mcq
    concept: recognition-of-states
    difficulty: 2
    stem: Two states have no diplomatic relations. What follows about recognition?
    options:
      - text: They cannot have recognised each other.
        why: Tempting because recognition often leads to diplomatic relations, but the slide says a lack of diplomatic relations does not necessarily mean absence of recognition.
      - text: Each has withdrawn any recognition it previously gave, since recognition lapses when embassies close.
        why: Tempting because relations can be broken off, but the lecture says recognition, once given, cannot be retracted.
      - text: Not necessarily anything; lack of diplomatic relations does not mean absence of recognition.
        correct: true
        why: Correct — the slide states that lack of diplomatic relations between two states does not necessarily mean absence of recognition.
  - key: q406
    type: mcq
    concept: recognition-of-states
    difficulty: 2
    stem: What does the lecture say about retracting recognition once given?
    options:
      - text: It cannot be retracted; the recognising state is bound by it.
        correct: true
        why: Correct — the lecture says once it is recognised you can't retract the recognition; you are kind of bound by it.
      - text: It can be retracted at any time, since recognition is political and creates no legal obligations.
        why: Tempting because recognition is highly political, but the lecture says it creates obligations (respect sovereignty, non-interference) and cannot be retracted.
      - text: It lapses automatically after the recognised government changes, and must then be given again to the new government.
        why: Tempting because governments change, but nothing this week says recognition lapses; established states also enjoy a presumption of continuity.
  - key: q407
    type: mcq
    concept: recognition-of-states
    difficulty: 2
    stem: What obligations does the lecture say recognising a state creates for the recognising state?
    options:
      - text: To respect the sovereignty of the recognised state and not interfere in its internal affairs.
        correct: true
        why: "Correct — the lecture says recognition creates obligations: you should respect that state's sovereignty and not interfere in its internal affairs."
      - text: To grant its nationals automatic citizenship.
        why: Tempting because recognition establishes official relations, but nothing this week connects recognition with nationality or citizenship.
      - text: To vote for its admission to every international organisation of which the recognising state is a member.
        why: Tempting because recognition and membership are linked, but no such duty is mentioned; membership turns on each organisation's constitutive instrument.
  - key: q408
    type: mcq
    concept: recognition-of-states
    difficulty: 3
    stem: Why does the lecture warn that admission to the UN is an imperfect measure of recognition?
    options:
      - text: Because UN members are not states, and the General Assembly is not able to recognise anything.
        why: Tempting as a sceptical view, but the lecture calls the UN probably the most important forum of collective recognition, and membership requires statehood.
      - text: Because admission needs Security Council approval, where one veto can block an entity many states recognise.
        correct: true
        why: Correct — besides two-thirds of the General Assembly, admission needs the Security Council, where a single veto can block an entity perhaps 180 states recognise.
      - text: Because only the ICJ can decide whether an applicant is a state.
        why: Tempting because the ICJ gave the Kosovo opinion, but it refrained from deciding statehood; the imperfection lies in the Security Council veto.
  - key: q409
    type: mcq
    concept: recognition-of-states
    variant-of: q408
    difficulty: 2
    stem: What vote of the General Assembly does the lecture say is needed to admit a new UN member?
    options:
      - text: A simple majority of all members.
        why: Tempting because simple majorities decide many matters, but the lecture says admission requires two-thirds of the General Assembly.
      - text: A two-thirds majority, after a Security Council recommendation.
        correct: true
        why: Correct — the lecture says the Security Council recommends (with the permanent members' concurring votes) and the General Assembly decides by a two-thirds majority (arts 4 and 18(2)).
      - text: Unanimity of every member, since admission is a form of collective recognition by the whole international community.
        why: Tempting because collective recognition sounds all-inclusive, but the Charter requires two-thirds, not unanimity, and the lecture warns not all members need recognise.
  - key: q410
    type: mcq
    concept: recognition-of-states
    difficulty: 2
    stem: What is the legal significance of illegality for recognition, according to the slides?
    options:
      - text: Non-recognition may prevent statehood where the means used to meet the Montevideo criteria were illegal.
        correct: true
        why: Correct — the slide says non-recognition may prevent an entity achieving statehood if the means used to achieve the criteria were illegal (Friendly Relations Declaration; Kosovo opinion).
      - text: Illegality is irrelevant; any entity meeting the criteria must be recognised.
        why: Tempting on a strict declaratory reading, but the slides say non-recognition can block entities created illegally, as with the TRNC.
      - text: Illegality only matters if the ICJ has given a contentious judgment declaring the entity's creation unlawful.
        why: Tempting because the ICJ appears here, but the slides rely on the Friendly Relations Declaration and Security Council resolutions; no judgment is required.
  - key: q411
    type: mcq
    concept: recognition-of-states
    difficulty: 2
    stem: Which state alone recognises the Turkish Republic of Northern Cyprus?
    options:
      - text: Greece.
        why: Tempting because Greece is closely connected to Cyprus, but it does not recognise the TRNC; only Turkey, whose 1974 invasion led to its creation, does.
      - text: Turkey.
        correct: true
        why: Correct — the lecture says Turkey is the only state to recognise the TRNC; no other state recognises it.
      - text: Russia, along with a handful of others, as it has done for Abkhazia and South Ossetia.
        why: Tempting because Russia recognises Abkhazia and South Ossetia, but the TRNC is recognised only by Turkey.
  - key: q412
    type: mcq
    concept: recognition-of-states
    variant-of: q411
    difficulty: 3
    cases: []
    stem: Why is the TRNC not treated as a state even though, the lecture says, it meets the Montevideo criteria?
    options:
      - text: Because it has no permanent population since the 1974 invasion, when the Greek Cypriot inhabitants fled south.
        why: Tempting because the invasion displaced people, but the lecture says the TRNC meets all the Montevideo criteria; the problem is illegality.
      - text: Because it achieved the criteria illegally, through an invasion in breach of territorial integrity, and the Security Council declared its declaration invalid.
        correct: true
        why: Correct — it was created by Turkey's 1974 invasion in violation of territorial integrity, and resolutions 541 (1983) and 550 (1984) declared the declaration legally invalid.
      - text: Because the ICJ held in an advisory opinion that it was not a state.
        why: Tempting because the ICJ gave the Kosovo opinion, but no ICJ opinion concerns the TRNC this week; the Security Council resolutions and non-recognition do the work.
  - key: q413
    type: mcq
    concept: recognition-of-states
    difficulty: 3
    cases: [declaration-of-independence-in-respect-of-kosovo]
    stem: What did the ICJ decide in the Kosovo Advisory Opinion (2010), as described in the lecture?
    options:
      - text: That Kosovo is a state, and that all UN members are required to recognise it.
        why: Tempting because Kosovo is recognised by more than 100 states, but the Court refrained from deciding whether Kosovo was a state.
      - text: That the declaration of independence was not in itself illegal, without deciding statehood.
        correct: true
        why: Correct — the lecture says the Court stated the declaration in itself wasn't illegal but refrained from deciding whether Kosovo was a state or whether unilateral secession was lawful.
      - text: That Kosovo's unilateral secession from Serbia was a lawful exercise of self-determination.
        why: Tempting because self-determination was raised, but the lecture says the Court refrained from saying unilateral self-determination was lawful in that case.
  - key: q414
    type: mcq
    concept: recognition-of-states
    difficulty: 2
    stem: Palestine is recognised by over 150 UN member states. What is its status at the UN?
    options:
      - text: A full UN member state.
        why: Tempting given the number of recognitions, but the slide says it only has UN non-member observer status, which is why its statehood remains contested.
      - text: A non-member observer, so its statehood remains contested.
        correct: true
        why: Correct — the slide says Palestine is recognised by over 150 UN members but only has non-member observer status, with statehood contested.
      - text: A trust territory administered by the UN Security Council under the Charter's trusteeship system.
        why: Tempting because Kosovo followed UN administration, but the slide describes Palestine as a non-member observer that has acceded to several treaties.
  - key: q415
    type: mcq
    concept: recognition-of-states
    difficulty: 2
    stem: What is "collective recognition"?
    options:
      - text: Recognition by a group of states within the framework of an international organisation.
        correct: true
        why: Correct — the slide defines collective recognition as recognition by a group of states within an IO; the lecture calls the UN probably the most important example.
      - text: Recognition by a state of both a new state and its government at the same moment.
        why: Tempting because recognition can apply to states or governments, but "collective" refers to many states acting together, not to recognising two things at once.
      - text: Recognition of a people's right to self-determination by the people themselves, by referendum.
        why: Tempting because referendums feature this week, but they are exercises of self-determination, not recognition by states.
  - key: q416
    type: mcq
    concept: recognition-of-states
    difficulty: 4
    contrasts-with: [montevideo-criteria-for-statehood]
    stem: Which scenario would a supporter of the constitutive theory, but not the declaratory theory, say is NOT a state?
    options:
      - text: An entity meeting all four criteria that almost no states recognise for political reasons.
        correct: true
        why: Correct — for the constitutive theory recognition creates the state, so an unrecognised entity is not one; the declaratory theory would treat it as a state because it meets the criteria.
      - text: An entity that lacks any permanent population and has no defined territory, but is recognised by a handful of states.
        why: Tempting to pick an obvious non-state, but both theories would struggle here; the constitutive theory still needs the criteria, and the declaratory theory denies statehood.
      - text: A long-established state whose government has temporarily lost control of its capital.
        why: "Tempting because effectiveness is lacking, but both theories keep it a state: it is already recognised, and the presumption of continuity applies."
  - key: q417
    type: truefalse
    set: quickfire
    concept: recognition-of-states
    statement: The declaratory theory is the most widely held theory of recognition today.
    answer: true
    why: True — the lecture says the declaratory theory, under which recognition is not required and is only symbolic, is the mainstream theory today, though the constitutive theory still has some weight.
  - key: q418
    type: truefalse
    set: quickfire
    concept: recognition-of-states
    statement: A lack of diplomatic relations between two states means that they do not recognise each other.
    answer: false
    why: False — the slide says lack of diplomatic relations between two states does not necessarily mean absence of recognition.
  - key: q419
    type: truefalse
    set: quickfire
    concept: recognition-of-states
    statement: In the Kosovo Advisory Opinion the ICJ held that Kosovo is a state.
    answer: false
    why: False — the Court said the declaration of independence was not in itself illegal, but it refrained from deciding whether Kosovo was a state or whether unilateral secession was lawful.
  - key: q420
    type: short
    concept: recognition-of-states
    difficulty: 3
    prompt: What role does recognition by other states play in determining statehood? Discuss the two theories and the motivations for recognising or not recognising an entity.
    model: |
      Recognition is the act by which a state officially acknowledges the existence of another state or government.
      It is a complex mixture of politics and law. Two theories explain its role. Under the declaratory theory, the
      most widely held today, recognition merely acknowledges a pre-existing statehood: an entity meeting Article 1 of
      the Montevideo Convention is a state, and recognition is symbolic. Under the constitutive theory, recognition is
      a precondition: it creates the state and confers legal personality — no recognition, no existence.

      Motivations are often political. States sometimes recognise entities that do not meet all the criteria, and
      refuse entities that do. Recognition still has legal consequences: it obliges the recognising state to respect
      the other's sovereignty and not interfere, and cannot be retracted. Collective recognition through the UN needs
      a Security Council recommendation (subject to veto) and two-thirds of the General Assembly, so non-membership
      does not mean non-recognition. Non-recognition also serves a legal function where the criteria were achieved
      illegally (Friendly Relations Declaration 1970; Kosovo Advisory Opinion 2010). The TRNC meets the criteria but,
      created through Turkey's 1974 invasion, is recognised only by Turkey, and Security Council resolutions 541 and
      550 declared its declaration invalid. Kosovo, Palestine and Western Sahara show how contested statehood remains.
    rubric:
      - id: r1
        criterion: Defines recognition and explains the declaratory and constitutive theories accurately.
        marks: 2
        top-band: Identifies the declaratory theory as the prevailing view and states "no recognition, no existence" for the constitutive theory.
        margin-note: Both theories clearly distinguished.
        authorities: []
      - id: r2
        criterion: Discusses political motivations and the legal effects of recognition.
        marks: 2
        top-band: Notes recognition of entities failing the criteria, refusal of entities meeting them, non-retraction and the duty of non-interference.
        margin-note: Good grasp of the politics/law mixture.
        authorities: []
      - id: r3
        criterion: Explains non-recognition of entities created illegally, with authority and example.
        marks: 2
        top-band: Uses the Friendly Relations Declaration or Kosovo opinion and the TRNC resolutions.
        margin-note: Strong authority for the illegality point.
        authorities: [friendly-relations-declaration-1970, unsc-resolutions-541-and-550]
      - id: r4
        criterion: Addresses collective recognition and contested statehood examples.
        marks: 1
        top-band: Explains the UN admission process and the veto, and uses Kosovo or Palestine.
        margin-note: Apt contemporary examples.
        authorities: []

  # ---------- Concept 5: modes-of-territorial-acquisition ----------
  - key: q501
    type: mcq
    concept: modes-of-territorial-acquisition
    difficulty: 1
    set: pretest
    stem: Which of the five traditional modes of acquiring territory is no longer lawful?
    options:
      - text: Cession, because purchases of territory between states have been prohibited since the colonial era ended.
        why: Tempting because colonial cessions were often unequal, but cession remains a mode of acquisition — the lecture discusses US interest in buying Greenland.
      - text: Conquest.
        correct: true
        why: Correct — since the UN Charter 1945 a state cannot acquire territory by force (art 2(4)); military occupation now triggers the belligerent occupation regime instead.
      - text: Accretion, because UNCLOS now prevents any new land from being added to a state's territory.
        why: Tempting because UNCLOS limits artificial islands, but natural accretion still creates territory, as with Japan's 1986 volcanic island.
  - key: q502
    type: mcq
    concept: modes-of-territorial-acquisition
    difficulty: 1
    stem: The US purchase of Alaska from Russia in 1867 is an example of which mode?
    options:
      - text: Cession.
        correct: true
        why: Correct — cession is one state transferring territory to another, often by a purchase agreement regulated by treaty; Alaska (for 7.2 million dollars) is the classic example.
      - text: Prescription, because the US had administered Alaska peacefully for years before Russia accepted the transfer.
        why: Tempting because prescription also passes title from one state to another, but Alaska was transferred by agreement, not acquired by peaceful possession without protest.
      - text: Occupation of terra nullius, since Alaska was largely unsettled land at the time of the purchase.
        why: Tempting because Alaska was sparsely settled, but it was under Russian sovereignty, so it was not terra nullius; it passed by treaty of sale.
  - key: q503
    type: mcq
    concept: modes-of-territorial-acquisition
    difficulty: 2
    stem: What limit applies to a state acquiring territory by cession?
    options:
      - text: It must pay market value, as assessed by the ICJ.
        why: Tempting because Alaska was bought, but no valuation rule is mentioned; the slide's limit concerns the rights that pass and the rights of others.
      - text: It gets no more rights than the ceding state had, and must respect the potential rights of third states and the indigenous population.
        correct: true
        why: Correct — the slide says the acquiring state cannot obtain more rights than the ceding state possessed and must respect the potential rights of third states and indigenous people.
      - text: It must hold a referendum of the inhabitants.
        why: Tempting because self-determination is discussed this week, but the slide does not make a referendum a condition of cession.
  - key: q504
    type: mcq
    concept: modes-of-territorial-acquisition
    variant-of: q503
    difficulty: 3
    stem: State A sells State B a coastal strip, but State A had earlier granted State C a treaty right of passage through it. What does State B acquire?
    options:
      - text: The strip free of all earlier arrangements, since cession gives clean title.
        why: Tempting because a sale sounds like a fresh start, but the acquiring state cannot obtain more rights than the ceding state had, and must respect third states' rights.
      - text: Nothing, because territory subject to third-state rights can never be ceded.
        why: Tempting as a strict view, but the slide does not bar such cessions; it says the acquirer takes subject to the potential rights of third states.
      - text: The strip, but subject to State C's rights, since B cannot take more than A had.
        correct: true
        why: Correct — on the slide's rule, B cannot obtain more rights than A possessed and must respect the potential rights of third states, such as C's passage right.
  - key: q505
    type: mcq
    concept: modes-of-territorial-acquisition
    difficulty: 2
    stem: In 1986 an undersea volcano created a new island in Japan's territorial sea. How did Japan acquire it?
    options:
      - text: By accretion — new land formed by natural processes.
        correct: true
        why: Correct — accretion is new land created gradually by nature; because the island formed in Japan's territorial sea, the lecture says it became Japan's territory.
      - text: By occupation of terra nullius, because the new island had never been under any state's sovereignty before it emerged.
        why: Tempting because the island was new, but it formed within Japan's territorial sea, so it accrued to Japan by a natural process rather than being occupied.
      - text: By prescription, through peaceful possession for decades without any protest from its neighbouring states.
        why: Tempting because Japan's possession was peaceful, but prescription concerns land previously under another state's sovereignty, which this new island was not.
  - key: q506
    type: mcq
    concept: modes-of-territorial-acquisition
    difficulty: 2
    stem: How does UNCLOS art 121(1) define an island?
    options:
      - text: Any structure surrounded by water, whether natural or artificial, that is permanently occupied.
        why: Tempting because occupation matters for other modes, but the definition requires the land to be naturally formed; artificial islands are not islands (art 60(8)).
      - text: A naturally formed area of land, surrounded by water, which is above water at high tide.
        correct: true
        why: Correct — art 121(1) says exactly this, so artificial (human-made) islands and low-tide elevations are not subject to sovereignty claims.
      - text: A feature above water at low tide, even if it is submerged at high tide.
        why: Tempting because such features appear at some point, but a low-tide elevation is submerged at high tide and is expressly not an island.
  - key: q507
    type: mcq
    concept: modes-of-territorial-acquisition
    variant-of: q506
    difficulty: 3
    stem: Is a disused offshore military platform an island for the purposes of acquiring territory?
    options:
      - text: Yes, once a state has occupied it continuously and peacefully, without any protest by neighbouring states.
        why: Tempting because peaceful occupation matters for prescription, but no amount of occupation turns a human-made structure into an island under art 121(1).
      - text: No — it is not naturally formed, and artificial structures do not possess the status of islands.
        correct: true
        why: "Correct — the lecture answers \"no\": art 121(1) requires a naturally formed area of land, and art 60(8) says artificial islands and structures do not have the status of islands."
      - text: Yes, if it is above water at high tide.
        why: Tempting because the high-tide test is part of the definition, but the land must also be naturally formed; the platform fails that limb.
  - key: q508
    type: mcq
    concept: modes-of-territorial-acquisition
    difficulty: 3
    stem: What did the 2016 South China Sea arbitration decide about artificial islands, according to the lecture?
    options:
      - text: Artificial installations cannot establish sovereignty over a maritime feature, whose status depends on its original natural condition.
        correct: true
        why: Correct — the tribunal ruled artificial islands and installations cannot be used to establish sovereignty; a feature's status is determined by its original natural condition before modification.
      - text: Artificial islands generate a full territorial sea once they have been occupied by a state for more than ten years.
        why: Tempting because long occupation can matter elsewhere, but the tribunal and UNCLOS art 60(8) deny artificial islands a territorial sea.
      - text: Building on a reef converts it into terra nullius open to any state that occupies it effectively and intends to claim title.
        why: Tempting because terra nullius depends on effective control, but the tribunal held construction does not change the legal status of a feature.
  - key: q509
    type: mcq
    concept: modes-of-territorial-acquisition
    difficulty: 2
    stem: What must a state show to acquire title by occupation of terra nullius?
    options:
      - text: Effective control of territory never under any state's sovereignty, plus an intention to claim title.
        correct: true
        why: Correct — the lecture says the state must show effective control of the territory and demonstrate an intention to claim sovereignty over land no state has claimed before.
      - text: That the previous sovereign has failed to protest its peaceful possession over a long period.
        why: Tempting but this describes prescription, which applies to territory previously under another state's sovereignty; terra nullius has no previous sovereign to protest.
      - text: A treaty of transfer with the local inhabitants.
        why: Tempting because colonial treaties were common, but a transfer by treaty is cession; terra nullius rests on effective control and intention.
  - key: q510
    type: mcq
    concept: modes-of-territorial-acquisition
    difficulty: 2
    stem: Why does the lecture say occupation of terra nullius is "not really applicable" today?
    options:
      - text: Because all territories of the world have been claimed by some state.
        correct: true
        why: Correct — the lecture says the principle is not really applicable today because all territories have been claimed, though it played a major role in colonial expansion.
      - text: Because UNCLOS art 121 abolished it when the Convention was adopted in 1982.
        why: Tempting because UNCLOS appears alongside, but art 121 defines islands; it does not abolish the terra nullius mode.
      - text: Because the ICJ held in Chagos that terra nullius violates the right of self-determination in every case.
        why: Tempting because Chagos concerns colonialism, but it concerned decolonisation of Mauritius; the lecture's reason is simply that no unclaimed land remains.
  - key: q511
    type: mcq
    concept: modes-of-territorial-acquisition
    contrasts-with: [self-determination-and-secession]
    difficulty: 3
    stem: What is the key difference between occupation of terra nullius and prescription?
    options:
      - text: Terra nullius applies to land never under any state's sovereignty; prescription applies to land previously under another state's sovereignty.
        correct: true
        why: "Correct — the lecture contrasts the two: terra nullius is original acquisition (a discovery, if you want), while prescription takes title from a prior sovereign on implied consent."
      - text: Terra nullius requires force, while prescription must be peaceful.
        why: Tempting because prescription must be peaceful, but terra nullius requires effective control and intention, not force; force cannot acquire title since 1945.
      - text: Prescription requires a treaty, while terra nullius requires a UN resolution confirming that the land was unclaimed.
        why: Tempting to attach formal instruments, but prescription rests on implied consent from absence of protest, and terra nullius on effective control and intention.
  - key: q512
    type: mcq
    concept: modes-of-territorial-acquisition
    difficulty: 3
    stem: What is the basis of acquiring title by prescription?
    options:
      - text: Implied consent of the dispossessed state, which could have protested but did not.
        correct: true
        why: Correct — the slide says prescription derives from some form of implied consent from the dispossessed state; the lecture adds that it had the opportunity to protest but didn't.
      - text: The express consent of the former sovereign, given in a formal treaty of transfer.
        why: Tempting because consent is central, but an express treaty of transfer is cession; prescription rests on implied consent inferred from silence.
      - text: The acquiring state's military superiority, which makes the transfer effective.
        why: Tempting because control matters, but the slide says the acquiring state's acts must be peaceful; force defeats prescription.
  - key: q513
    type: mcq
    concept: modes-of-territorial-acquisition
    variant-of: q512
    difficulty: 3
    stem: State X has peacefully administered an island belonging to State Y for 40 years, acting as sovereign. Y has lodged formal protests every year. Has X acquired title by prescription?
    options:
      - text: Yes — forty years of peaceful administration is enough, whatever Y has said.
        why: "Tempting because long peaceful control is a requirement, but it is not sufficient: sustained protests and objections by the old state prevent prescription."
      - text: No — Y's sustained protests prevent prescription.
        correct: true
        why: Correct — the slide says sustained protests and objections by the 'old' state will prevent prescription, since the mode depends on implied consent.
      - text: Yes, because protests only count if they are made to the ICJ in contentious proceedings between the two states.
        why: Tempting because the lecture lists what form protest should take as an open question, but nothing says only ICJ proceedings count; annual formal protests are sustained objection.
  - key: q514
    type: mcq
    concept: modes-of-territorial-acquisition
    difficulty: 2
    stem: Which UN Charter provision does the lecture pinpoint for the prohibition on acquiring territory by force?
    options:
      - text: Article 2(4).
        correct: true
        why: Correct — the lecture says to pinpoint Article 2, paragraph 4, which prohibits the use of force against the territorial integrity of another state.
      - text: Article 42, under which the Security Council may authorise the use of force.
        why: Tempting because it concerns force, but art 42 is the Security Council's express power to authorise force, not the prohibition on conquest.
      - text: Article 104, under which the UN enjoys legal capacity in the territory of each member.
        why: Tempting because it mentions territory, but art 104 gives the UN domestic legal capacity; it says nothing about conquest.
  - key: q515
    type: mcq
    concept: modes-of-territorial-acquisition
    contrasts-with: [recognition-of-states]
    difficulty: 3
    stem: State P's army occupies part of State Q and P announces annexation. What is the legal position, according to this week's material?
    options:
      - text: P acquires title once its control is effective and stable.
        why: Tempting because effective control matters for terra nullius, but conquest has been prohibited since 1945; forcible takeover does not result in any title.
      - text: The belligerent occupation regime applies; P's presence is temporary and sovereignty does not transfer.
        correct: true
        why: Correct — the lecture says forcible occupation triggers the belligerent occupation regime; the occupier's presence is temporary and there is no transfer of sovereignty, even with factual control.
      - text: P acquires title unless the Security Council passes a resolution within a year declaring the annexation invalid.
        why: Tempting because the Security Council declared the TRNC invalid, but title never passes by force; no resolution is needed to prevent acquisition.
  - key: q516
    type: mcq
    concept: modes-of-territorial-acquisition
    variant-of: q515
    difficulty: 2
    stem: Which of the following is given on the slides as an example of an attempt to acquire territory by force since 1945?
    options:
      - text: Russia's 2014 annexation of Crimea.
        correct: true
        why: Correct — the slide lists Russia's 2014 annexation of Crimea (and 2022 invasion of Ukraine), with Iraq/Kuwait 1990 and Turkey/northern Cyprus 1974.
      - text: The US purchase of the Danish West Indies from Denmark in 1917.
        why: Tempting because it is a US acquisition, but it was a purchase, i.e. cession by agreement, not conquest.
      - text: The formation of a new volcanic island in Japan's territorial sea in 1986.
        why: Tempting because it added territory, but it was natural accretion, involving no use of force at all.
  - key: q517
    type: truefalse
    set: quickfire
    concept: modes-of-territorial-acquisition
    statement: Artificial islands built in a state's exclusive economic zone have their own territorial sea.
    answer: false
    why: False — UNCLOS art 60(8) says artificial islands, installations and structures do not possess the status of islands and have no territorial sea of their own.
  - key: q518
    type: truefalse
    set: quickfire
    concept: modes-of-territorial-acquisition
    statement: Sustained protests by the original sovereign will prevent another state acquiring its territory by prescription.
    answer: true
    why: True — prescription rests on implied consent, so the slide says sustained protests and objections by the 'old' state will prevent prescription.
  - key: q519
    type: truefalse
    concept: modes-of-territorial-acquisition
    statement: A belligerent occupier acquires sovereignty over the occupied territory if it controls it effectively for a long enough period.
    answer: false
    why: False — the lecture says occupation by force is only temporary and there is no transfer of sovereignty, even if the occupying power controls the territory in fact.
  - key: q520
    type: short
    concept: modes-of-territorial-acquisition
    difficulty: 3
    prompt: Outline the five modes of territorial acquisition discussed this week and explain why conquest no longer confers title.
    model: |
      Acquisition of territory is a state gaining sovereign title over land. There are five modes. Cession is a
      transfer from one state to another, often by purchase treaty (Alaska from Russia, 1867); the acquirer cannot
      obtain more rights than the ceding state had and must respect third states' and indigenous rights. Accretion is
      new land formed gradually by nature (the 1986 volcanic island in Japan's territorial sea). Only naturally formed
      land counts: UNCLOS art 121(1) defines an island as "a naturally formed area of land, surrounded by water, which
      is above water at high tide", and art 60(8) denies artificial islands island status, as the 2016 South China Sea
      arbitration confirmed. Occupation of terra nullius requires effective control and an intention to claim title
      over land never under any state's sovereignty; it is barely applicable today. Prescription passes title over
      another state's territory through peaceful control, acting as sovereign, on implied consent — sustained protest
      defeats it.

      Conquest was once accepted, but since the UN Charter 1945 territory cannot be acquired by force: art 2(4)
      prohibits force against territorial integrity. Occupation by force now triggers the belligerent occupation
      regime; the occupier's presence is temporary and sovereignty does not transfer (Iraq/Kuwait 1990, Crimea 2014).
    rubric:
      - id: r1
        criterion: Explains cession and accretion, including their limits.
        marks: 2
        top-band: Notes that the acquirer of ceded land takes no more rights than the ceding state had, and the natural-formation requirement for accretion (UNCLOS arts 121(1), 60(8)).
        margin-note: Good — limits, not just labels.
        authorities: [unclos-art-121-1, unclos-art-60]
      - id: r2
        criterion: Distinguishes terra nullius from prescription.
        marks: 2
        top-band: Contrasts land never under sovereignty with land taken from a prior sovereign, and explains implied consent and protest.
        margin-note: Clear contrast of the two occupation modes.
        authorities: []
      - id: r3
        criterion: Explains the prohibition on conquest and the belligerent occupation regime.
        marks: 2
        top-band: Cites art 2(4), explains that occupation is temporary without transfer of sovereignty, and gives an example.
        margin-note: Correctly explains why title does not pass.
        authorities: [un-charter-art-2-4]

  # ---------- Concept 6: self-determination-and-secession ----------
  - key: q601
    type: mcq
    concept: self-determination-and-secession
    difficulty: 1
    stem: How does UN Charter art 1(2) treat self-determination, according to the slides?
    options:
      - text: As a principle among the UN's purposes, not framed as a right.
        correct: true
        why: Correct — art 1(2) refers to respect for "the principle of equal rights and self-determination of peoples"; the slide notes the Charter did not frame this as a right.
      - text: As an individual human right enforceable before the Human Rights Committee.
        why: Tempting because ICCPR art 1 later made it a human right, but that is the Covenant, not the Charter, and it is a right of peoples, not individuals.
      - text: As a right of every region of a state to secede unilaterally, provided a majority of its inhabitants vote for independence.
        why: Tempting because referendums are discussed, but the Charter says nothing of secession, and a unilateral right to secede is highly contentious.
  - key: q602
    type: mcq
    concept: self-determination-and-secession
    variant-of: q601
    difficulty: 2
    stem: Which instrument enshrined self-determination as a human right, with the words "All peoples have the right of self-determination"?
    options:
      - text: The Montevideo Convention on Rights and Duties of States 1933, art 1.
        why: Tempting because it is this week's other key treaty article, but Montevideo art 1 sets the criteria of statehood, not self-determination.
      - text: The ICCPR 1966, art 1.
        correct: true
        why: "Correct — the slide says self-determination was subsequently enshrined as a human right in ICCPR art 1: \"All peoples have the right of self-determination.\""
      - text: The Declaration on the Granting of Independence to Colonial Territories and Peoples 1960, a General Assembly declaration.
        why: Tempting because it is central to decolonisation, but the words quoted come from ICCPR art 1; the 1960 Declaration condemns alien subjugation.
  - key: q603
    type: mcq
    concept: self-determination-and-secession
    difficulty: 2
    stem: In which context is the right to self-determination described as generally accepted?
    options:
      - text: Decolonisation.
        correct: true
        why: Correct — the lecture says in the decolonisation context it is generally accepted and recognised that peoples have a right to self-determination; the right emerged from decolonisation.
      - text: Secession of a region from any existing democratic state.
        why: Tempting because secession is the headline debate, but outside decolonisation a right to unilaterally secede is highly contentious, not accepted.
      - text: Minority language disputes within federal states, such as the rights of French speakers outside Quebec.
        why: Tempting because the lecture uses Canadian examples, but those are minority rights claimed individually, not the accepted core of self-determination.
  - key: q604
    type: mcq
    concept: self-determination-and-secession
    difficulty: 2
    cases: [chagos-islands-case]
    stem: What did the ICJ affirm in the Chagos Advisory Opinion (2019)?
    options:
      - text: The UK's sovereignty over the Chagos Islands as the British Indian Ocean Territory, given the importance of the military base.
        why: Tempting because the UK had "no doubt" of its sovereignty, but the Court affirmed the Chagossians' self-determination and the UK's obligation to complete decolonisation.
      - text: The right of self-determination of the people concerned, and the UK's obligation to complete the decolonisation of Mauritius.
        correct: true
        why: Correct — the slide says the opinion affirmed the right of self-determination of the people concerned and noted the UK's obligation to complete the decolonisation of Mauritius.
      - text: That Mauritius had acquired the islands by prescription, because the UK had not protested.
        why: Tempting because prescription is this week's topic too, but the opinion rested on self-determination in the decolonisation context, not on a mode of acquisition.
  - key: q605
    type: mcq
    concept: self-determination-and-secession
    variant-of: q604
    difficulty: 3
    cases: [chagos-islands-case]
    stem: Which UK conduct did the Court treat as violating self-determination in Chagos, as described in the lecture?
    options:
      - text: Refusing to hold a referendum in Mauritius after independence, on whether Mauritius should remain in the Commonwealth.
        why: Tempting because referendums feature in secession debates, but the lecture identifies the separation of the islands and removal of the population before independence.
      - text: Separating the islands and removing their population before Mauritius became independent.
        correct: true
        why: Correct — the lecture says the UK's action to separate and remove a population from the territory of Mauritius prior to independence violated self-determination in the decolonisation context.
      - text: Building an artificial island near the archipelago.
        why: Tempting because artificial islands appear this week, but that concerns accretion; the Chagos opinion concerned the detachment of colonial territory.
  - key: q606
    type: mcq
    concept: self-determination-and-secession
    difficulty: 2
    stem: What does the 1960 Declaration on the Granting of Independence say about "alien subjugation, domination and exploitation"?
    options:
      - text: That it is permitted where the colonial power provides good government, and where the population consents to it.
        why: Tempting as a colonial-era justification, but the Declaration condemns subjugation outright as a denial of fundamental human rights.
      - text: That it is a matter of domestic jurisdiction outside the UN's concern.
        why: Tempting because domestic jurisdiction limits the UN elsewhere, but the Declaration says subjugation is contrary to the Charter and an impediment to world peace.
      - text: That it denies fundamental human rights and is contrary to the UN Charter.
        correct: true
        why: Correct — the Declaration says subjection of peoples to alien subjugation, domination and exploitation denies fundamental human rights, is contrary to the Charter and impedes world peace.
  - key: q607
    type: mcq
    concept: self-determination-and-secession
    difficulty: 3
    stem: Outside the decolonisation context, what is the contentious question about self-determination?
    options:
      - text: Whether peoples have any right to self-determination at all, now that decolonisation is complete.
        why: Tempting because decolonisation is largely over, but the lecture says we know peoples have the right; the dispute is over its external dimension.
      - text: Whether it includes a right of a people within an existing state to unilaterally secede.
        correct: true
        why: Correct — the lecture says the question is whether the right includes the right of a community within an existing state to unilaterally secede, a far more contentious issue.
      - text: Whether it applies to individuals as well as to groups.
        why: Tempting because individuals hold human rights, but self-determination belongs to peoples; the contested point is secession, not the holders.
  - key: q608
    type: mcq
    concept: self-determination-and-secession
    difficulty: 3
    cases: [declaration-of-independence-in-respect-of-kosovo]
    stem: What argument did supporters of Kosovo's 2008 independence make?
    options:
      - text: That self-determination includes a right to secede in extreme cases, where an ethnic population suffers systematic discrimination and oppression.
        correct: true
        why: Correct — supporters argued secession is legitimate where a significant portion of the population wants it, particularly when an ethnic population suffers systematic discrimination and oppression.
      - text: That Kosovo had acquired its territory from Serbia by prescription.
        why: Tempting because prescription transfers territory between states, but the Kosovo debate was about external self-determination, not a mode of acquisition.
      - text: That the ICJ had already confirmed a general right of secession for all peoples, in its earlier Chagos advisory opinion.
        why: Tempting because Chagos affirmed self-determination, but it was decided in 2019 and concerned decolonisation; no general right of secession has been confirmed.
  - key: q609
    type: mcq
    concept: self-determination-and-secession
    variant-of: q608
    difficulty: 3
    stem: What did opponents of Kosovo's independence argue?
    options:
      - text: That Kosovo failed the population criterion.
        why: Tempting because statehood criteria are this week's test, but opponents' argument was about the absence of a right to secede and the threat to territorial integrity.
      - text: That there is no right of unilateral secession, and Kosovo's independence violated Serbia's sovereignty and territorial integrity and set a dangerous precedent.
        correct: true
        why: Correct — opponents argued there is no international right to unilateral secession, that it threatens territorial integrity and sovereignty, and set a dangerous precedent for other movements.
      - text: That Kosovo's declaration of independence was illegal because it was not approved by the General Assembly by a two-thirds majority.
        why: Tempting because two-thirds is the UN admission threshold, but no such approval is required for a declaration, and the ICJ said the declaration was not in itself illegal.
  - key: q610
    type: mcq
    concept: self-determination-and-secession
    difficulty: 2
    cases: [re-secession-of-quebec]
    stem: What did the Supreme Court of Canada decide in Re Secession of Quebec (1998)?
    options:
      - text: That Quebec could secede unilaterally after a majority referendum vote.
        why: Tempting because Quebec held referendums, but the Court held unilateral secession is not consistent with international law or the Canadian Constitution.
      - text: That unilateral secession is inconsistent with international law and the Constitution; Quebec's internal self-determination was fulfilled.
        correct: true
        why: Correct — the Court held unilateral secession inconsistent with both, and because Quebec's internal self-determination was fulfilled there was no ground for external self-determination.
      - text: That Quebec was already a state under Montevideo because it has its own population, territory and government.
        why: Tempting because Quebec has those features, but the Court did not treat it as a state; like Scotland, it lacks independent capacity for international relations.
  - key: q611
    type: mcq
    concept: self-determination-and-secession
    variant-of: q610
    contrasts-with: [recognition-of-states]
    difficulty: 3
    cases: [re-secession-of-quebec]
    stem: In Re Secession of Quebec, why was there no ground for external self-determination?
    options:
      - text: Because Quebec's internal self-determination was fulfilled within Canada.
        correct: true
        why: Correct — the Court reiterated the internal/external distinction and said Quebec's internal self-determination was fulfilled, so there was no ground for claiming external self-determination.
      - text: Because Quebec is not recognised as a state by the UN General Assembly, which alone can confer statehood on any entity.
        why: Tempting because recognition is this week's topic, but the Court's reasoning turned on self-determination, and the General Assembly does not confer statehood.
      - text: Because Quebec's population was too small, relative to the rest of Canada, to count as a people for self-determination purposes.
        why: Tempting because size matters in politics, but the Court's reasoning was the fulfilment of internal self-determination, not population size.
  - key: q612
    type: mcq
    concept: self-determination-and-secession
    difficulty: 2
    stem: What is internal self-determination, as contrasted with external self-determination?
    options:
      - text: Self-determination pursued within an existing state, as opposed to secession from it.
        correct: true
        why: Correct — the lecture contrasts internal self-determination (within the state, as fulfilled for Quebec) with external self-determination, which would involve secession.
      - text: Self-determination of individuals inside their homes, as opposed to self-determination of whole peoples.
        why: Tempting as a literal reading of "internal", but self-determination belongs to peoples in both dimensions; the difference is within the state versus leaving it.
      - text: Decolonisation, as opposed to post-colonial claims.
        why: Tempting because the lecture draws both distinctions, but decolonisation versus outside it is a separate axis from internal versus external.
  - key: q613
    type: mcq
    concept: self-determination-and-secession
    difficulty: 2
    stem: Which of these is listed on the slides as a successful secession referendum?
    options:
      - text: Scotland, 2014.
        why: Tempting because Scotland held a referendum, but the slide lists it among the failed attempts, along with Quebec.
      - text: South Sudan, 2010.
        correct: true
        why: Correct — the slide gives South Sudan (2010) as an example, contrasting failed attempts in Quebec and Scotland and contested unilateral attempts in Iraqi Kurdistan and Catalonia (2017).
      - text: Catalonia, 2017, which Spain accepted.
        why: Tempting because Catalonia held a vote in 2017, but the slide calls it a contested unilateral attempt, not a successful secession.
  - key: q614
    type: mcq
    concept: self-determination-and-secession
    difficulty: 2
    stem: "According to the Australian Government statement on the slides, what does self-determination entail at a minimum?"
    options:
      - text: The entitlement of peoples to control their destiny and to be treated respectfully.
        correct: true
        why: Correct — the slide quotes the Australian Government that at a minimum it entails the entitlement of peoples to have control over their destiny and to be treated respectfully.
      - text: The right of every people to its own state with a seat at the UN.
        why: Tempting because statehood is one outcome, but the minimum content is control over destiny and respect, not a guaranteed state or UN seat.
      - text: The duty of states to hold a referendum whenever a region requests one.
        why: Tempting because referendums are discussed, but no such duty is stated; the minimum content concerns control over destiny and respectful treatment.
  - key: q615
    type: mcq
    concept: self-determination-and-secession
    contrasts-with: [modes-of-territorial-acquisition]
    difficulty: 3
    stem: A people seeks to leave an existing state. Which framing best matches this week's approach to the problem?
    options:
      - text: It is a question of cession, so the people need only negotiate a price with the existing state.
        why: Tempting because cession transfers territory, but cession is between states; a people seeking to leave raises self-determination, not a mode of acquisition.
      - text: It is an external self-determination claim outside decolonisation, which is highly contentious.
        correct: true
        why: Correct — outside decolonisation, a right of a people to unilaterally secede is highly contentious; the lecture points to Kosovo and Quebec as the key illustrations.
      - text: It is an accepted decolonisation claim, so international law guarantees a right to secede from any state that the people consider foreign.
        why: Tempting because self-determination is accepted in decolonisation, but a people inside an existing, non-colonial state is outside that context.
  - key: q616
    type: mcq
    concept: self-determination-and-secession
    difficulty: 4
    cases: [re-secession-of-quebec]
    stem: A Western Australian secessionist movement says it no longer wants to be governed from Canberra and wants full ownership of the state's resources. Which point is strongest against a right to secede under international law?
    options:
      - text: Western Australia lacks a permanent population.
        why: Tempting because it tests a Montevideo criterion, but WA plainly has a permanent population; the real problem is the absence of a right to secede.
      - text: As with Quebec, a people whose internal self-determination is fulfilled has no ground for external self-determination.
        correct: true
        why: Correct — applying Re Secession of Quebec, a population enjoying internal self-determination within a democratic state has no ground to claim secession, and this is not a decolonisation case.
      - text: Western Australia would first need to acquire its territory by prescription, which requires 100 years' possession without protest from the Commonwealth.
        why: Tempting because prescription transfers territory, but it is a mode of acquisition between states, and no fixed period is stated; the issue is self-determination.
  - key: q617
    type: truefalse
    set: quickfire
    concept: self-determination-and-secession
    statement: The UN Charter frames self-determination of peoples as a right.
    answer: false
    why: False — the slide notes that art 1(2) of the Charter refers to the principle of self-determination but did not frame it as a right; ICCPR art 1 later enshrined it as a human right.
  - key: q618
    type: truefalse
    set: quickfire
    concept: self-determination-and-secession
    statement: In Re Secession of Quebec the Supreme Court of Canada held that unilateral secession is not consistent with international law.
    answer: true
    why: True — the Court held unilateral secession is not consistent with international law or the Canadian Constitution, since Quebec's internal self-determination was fulfilled.
  - key: q619
    type: truefalse
    concept: self-determination-and-secession
    statement: A right of peoples to unilaterally secede from an existing state is well established outside the decolonisation context.
    answer: false
    why: False — the slides say that, outside decolonisation, a right of a people to unilaterally secede is highly contentious (Kosovo/Serbia 2008), and Quebec rejected it.
  - key: q620
    type: short
    concept: self-determination-and-secession
    difficulty: 4
    prompt: |
      In the last two years a secessionist movement has grown in Western Australia seeking to secede from the rest of
      Australia; it does not want to be governed from Canberra and seeks full ownership of Western Australia's
      resources. Does Western Australia have a right to secede under international law, and what role does
      self-determination play?
    model: |
      Issue: whether the people of Western Australia have a right under international law to secede unilaterally.

      Rule: peoples have a right of self-determination — a principle in UN Charter art 1(2) and a human right in
      ICCPR art 1 ("All peoples have the right of self-determination"). In the decolonisation context the right is
      generally accepted, as the ICJ affirmed in Chagos (2019). Outside that context the right has internal and
      external dimensions, and whether it includes a right to unilaterally secede from an existing state is highly
      contentious. Supporters of Kosovo's 2008 secession argued for a right in extreme cases of systematic
      discrimination and oppression; opponents stressed territorial integrity and sovereignty. The ICJ said Kosovo's
      declaration was not in itself illegal but did not endorse a right to secede. In Re Secession of Quebec (1998)
      the Supreme Court of Canada held unilateral secession inconsistent with international law: Quebec's internal
      self-determination was fulfilled, so there was no ground for external self-determination.

      Application: WA is not a colony, and its population participates fully in Australia's democratic government; a
      wish not to be governed from Canberra and to own resources is not systematic oppression. Its internal
      self-determination is fulfilled.

      Conclusion: WA has no right to secede under international law; any statehood would also have to satisfy the
      Montevideo criteria and would face the politics of recognition.
    rubric:
      - id: r1
        criterion: States the sources and content of the right to self-determination.
        marks: 1
        top-band: Cites UN Charter art 1(2) (principle) and ICCPR art 1 (right).
        margin-note: Sources correctly distinguished.
        authorities: [un-charter-art-1-2, iccpr-art-1]
      - id: r2
        criterion: Distinguishes the decolonisation context from secession outside it.
        marks: 2
        top-band: Uses Chagos for the accepted colonial context and explains why WA falls outside it.
        margin-note: Key framing move — well done.
        authorities: []
      - id: r3
        criterion: Applies the internal/external distinction using Re Secession of Quebec and Kosovo.
        marks: 3
        top-band: Explains the remedial-secession argument, then applies Quebec to find WA's internal self-determination fulfilled.
        margin-note: Excellent application of the leading authority to the facts.
        authorities: []
      - id: r4
        criterion: Reaches a reasoned conclusion and notes statehood and recognition consequences.
        marks: 1
        top-band: Concludes no right to secede and flags Montevideo and recognition as further hurdles.
        margin-note: Complete ILAC structure.
        authorities: []

  # ---------- Concept 7: international-organisations-definition-and-personality ----------
  - key: q701
    type: mcq
    concept: international-organisations-definition-and-personality
    difficulty: 1
    set: pretest
    stem: Under ARIO art 2(a), which feature distinguishes an international organisation from an NGO such as Amnesty International?
    options:
      - text: It is established by a treaty or other instrument governed by international law.
        correct: true
        why: Correct — IOs are governed by international law and almost always created by treaty; NGOs such as Amnesty International or Greenpeace are governed by domestic law.
      - text: It has an international focus and works across many countries.
        why: Tempting because IOs work internationally, but the lecture notes that NGOs also have an international focus; that is not what distinguishes them.
      - text: It has members, since NGOs cannot have members of any kind.
        why: Tempting because membership is one element of the definition, but NGOs also have members; the distinguishing element is being governed by international law.
  - key: q702
    type: mcq
    concept: international-organisations-definition-and-personality
    difficulty: 2
    stem: The lecture breaks the ARIO art 2(a) definition into elements. Which list is correct?
    options:
      - text: Established by treaty or other instrument; governed by international law; own legal personality; made up of members.
        correct: true
        why: "Correct — the lecture lists these four elements: established by treaty or other instrument, governed by international law, its own legal personality, and membership."
      - text: Permanent population; defined territory; government; capacity for relations.
        why: Tempting because it is a four-part test from this week, but these are the Montevideo criteria for states, not the definition of an IO.
      - text: Established by domestic statute; registered as a charity; staffed by volunteers; funded by governments.
        why: Tempting because some organisations fit this pattern, but these features describe an NGO under domestic law, not an IO governed by international law.
  - key: q703
    type: mcq
    concept: international-organisations-definition-and-personality
    difficulty: 2
    stem: Which of the following IOs does the lecture give as created by resolutions rather than by treaty?
    options:
      - text: The United Nations, which was created by a General Assembly resolution in 1945 and ratified by its members.
        why: Tempting because the UN is the leading IO, but it was established by treaty — the UN Charter — which the lecture gives as the good example of creation by treaty.
      - text: OPEC, and the ICTY and ICTR.
        correct: true
        why: Correct — the lecture says OPEC was created through a series of resolutions, and the ICTY and ICTR by resolutions of the UN Security Council.
      - text: The World Trade Organization, whose constitutive instrument is a Security Council resolution conferring legal personality on it.
        why: Tempting because the WTO's personality is expressly conferred, but it is conferred by treaty (art VIII of its agreement), not by resolution.
  - key: q704
    type: mcq
    concept: international-organisations-definition-and-personality
    variant-of: q701
    difficulty: 2
    stem: A global environmental group is incorporated under Dutch law, has offices in 50 countries and state officials on its board. Is it an international organisation?
    options:
      - text: Yes, because it operates in many countries and includes state officials.
        why: Tempting because of its international reach, but the lecture says NGOs may have an international focus and even state involvement yet are not governed by international law.
      - text: No — it is governed by domestic law, not established by an instrument governed by international law.
        correct: true
        why: Correct — incorporation under Dutch law makes it an NGO like Greenpeace; an IO must be established by a treaty or other instrument governed by international law.
      - text: Yes, provided it has been recognised by at least two-thirds of the UN General Assembly as an international person.
        why: Tempting because two-thirds is the UN admission threshold, but no such recognition turns an NGO into an IO; the test is the governing law of its founding instrument.
  - key: q705
    type: mcq
    concept: international-organisations-definition-and-personality
    difficulty: 2
    stem: Which entity other than a state does the lecture give as a member of an international organisation?
    options:
      - text: The EU, a member of the Food and Agriculture Organization.
        correct: true
        why: Correct — the lecture says most IOs are composed of states but other entities can be members; for instance, the EU is a member of the FAO (as ARIO art 2(a) contemplates).
      - text: Greenpeace, as a member of the UN General Assembly.
        why: Tempting because Greenpeace is internationally prominent, but it is an NGO; the lecture uses it only to contrast with IOs, and it is not a UN member.
      - text: Scotland, as a member of NATO in its own right, alongside the United Kingdom.
        why: Tempting because Scotland appears this week, but it is used as an entity lacking capacity for international relations, and is not a NATO member on its own.
  - key: q706
    type: mcq
    concept: international-organisations-definition-and-personality
    difficulty: 2
    stem: What is the condition for UN membership in UN Charter art 4?
    options:
      - text: Membership is open to any state that is a member of a regional organisation and has been recognised by all five permanent members.
        why: Tempting because the permanent members can veto, but art 4 sets no regional-organisation or unanimous-recognition condition.
      - text: Open to peace-loving states that accept the Charter's obligations and are able and willing to carry them out.
        correct: true
        why: Correct — art 4 opens membership to all other peace-loving states which accept the obligations in the Charter and, in the Organization's judgment, are able and willing to carry them out.
      - text: Open only to states that are democracies.
        why: Tempting because some organisations impose political conditions, but art 4 does not; the UN seeks universal membership, and form of government is irrelevant to statehood.
  - key: q707
    type: mcq
    concept: international-organisations-definition-and-personality
    variant-of: q706
    difficulty: 3
    stem: What is the procedure for admitting a new UN member, as the lecture describes it?
    options:
      - text: The General Assembly admits by simple majority, and the Security Council then confirms the decision within a year.
        why: "Tempting because both organs are involved, but the order is reversed and the thresholds are wrong: recommendation by the Council, then a two-thirds Assembly vote."
      - text: A Security Council recommendation (nine votes including the permanent members) followed by a two-thirds General Assembly vote.
        correct: true
        why: Correct — the Council recommends by nine affirmative votes including the concurring permanent members (so a veto applies), then the Assembly decides by two-thirds (arts 4 and 18(2)).
      - text: The Secretary-General admits new members on application.
        why: Tempting because the Secretary-General receives notifications (e.g. Rome Statute art 127), but admission is decided by the Security Council and General Assembly.
  - key: q708
    type: mcq
    concept: international-organisations-definition-and-personality
    difficulty: 2
    stem: What does Rome Statute art 127 illustrate about withdrawal from an international organisation?
    options:
      - text: That a state may withdraw by written notification, with effect one year after receipt.
        correct: true
        why: Correct — art 127 allows withdrawal by written notification to the UN Secretary-General, taking effect one year after receipt; the constitutive instrument sets the procedure.
      - text: That withdrawal is impossible once a state has ratified the Statute, because the Court's jurisdiction is permanent.
        why: Tempting because withdrawal is sometimes unclear, but art 127 expressly provides for it; it is the UN Charter that lacks a withdrawal clause.
      - text: That withdrawal takes effect immediately upon notification, so obligations end the same day.
        why: Tempting because withdrawal is at the member's initiative, but art 127 delays effect by a year, and the lecture stresses a state does not stop having obligations right away.
  - key: q709
    type: mcq
    concept: international-organisations-definition-and-personality
    contrasts-with: [powers-and-responsibility-of-international-organisations]
    difficulty: 3
    stem: What is the difference between withdrawal and expulsion from an international organisation?
    options:
      - text: Withdrawal is at the member's initiative (e.g. Rome Statute art 127); expulsion is at the IO's initiative (e.g. UN Charter art 6).
        correct: true
        why: Correct — the slides say withdrawal is at the initiative of the member and can be provided for in the constitutive instrument, while expulsion is at the initiative of the IO.
      - text: Withdrawal applies only to the UN; expulsion applies only to regional organisations.
        why: Tempting to split them by organisation, but the UN Charter has an expulsion provision (art 6) and no withdrawal clause, and the ICC Statute has a withdrawal clause.
      - text: They are the same thing, and both are decided by the ICJ.
        why: Tempting because both end membership, but they differ by who initiates, and neither is decided by the ICJ.
  - key: q710
    type: mcq
    concept: international-organisations-definition-and-personality
    difficulty: 2
    stem: When may a UN member be expelled under Charter art 6?
    options:
      - text: When it has persistently violated the principles of the Charter, by the General Assembly on the Security Council's recommendation.
        correct: true
        why: Correct — art 6 allows expulsion of a member that has persistently violated the Charter's principles, by the General Assembly upon the Security Council's recommendation.
      - text: Whenever it fails to pay its dues for one year.
        why: Tempting because arrears have consequences, but art 6 requires persistent violation of Charter principles, not non-payment.
      - text: When it is no longer recognised by a majority of other members.
        why: Tempting because recognition is this week's topic, but art 6 turns on persistent violation, and recognition once given cannot be retracted.
  - key: q711
    type: mcq
    concept: international-organisations-definition-and-personality
    difficulty: 2
    stem: What does it mean for an IO to have international legal personality?
    options:
      - text: It is treated as a state for all purposes of international law.
        why: Tempting because states are the model of personality, but Reparation for Injuries says IO personality is not the same as a state's.
      - text: It has a personality distinct from its members, allowing it to conclude treaties, send and receive delegations, bring claims and be responsible.
        correct: true
        why: Correct — the lecture says IO personality is distinct from the members', and lists concluding treaties, sending and receiving delegations, bringing claims and responsibility for wrongdoing.
      - text: Its member states become jointly responsible for everything it does.
        why: Tempting because members stand behind an IO, but distinct personality means the IO itself can be responsible (the International Tin Council), not its members.
  - key: q712
    type: mcq
    concept: international-organisations-definition-and-personality
    difficulty: 3
    stem: What does UN Charter art 104 give the UN, according to the lecture?
    options:
      - text: International legal personality in relations with other states, which the Reparation for Injuries opinion later confirmed.
        why: Tempting because art 104 concerns legal capacity, but the lecture says it gives domestic legal personality only, which is why Reparation was needed.
      - text: Domestic legal capacity in members' territory, such as renting offices or employing staff.
        correct: true
        why: Correct — art 104 lets the UN enjoy legal capacity in each member's territory (e.g. renting a building in New York, employing staff), but not international legal personality.
      - text: General competence over any matter affecting international peace.
        why: Tempting because the UN is broad, but IOs have no general competence (principle of speciality), and art 104 concerns domestic capacity.
  - key: q713
    type: mcq
    concept: international-organisations-definition-and-personality
    variant-of: q712
    contrasts-with: [subjects-and-international-legal-personality]
    difficulty: 3
    stem: The UN leases an office in New York and later wants to bring a claim against a state for injury to its agent. Which source supports each capacity?
    options:
      - text: The lease rests on art 104's domestic capacity; the international claim rests on the personality found in Reparation for Injuries.
        correct: true
        why: Correct — art 104 gives domestic legal capacity (e.g. leasing offices); the capacity to bring an international claim rests on the international personality implied in Reparation (1949).
      - text: Both rest on art 104, which expressly confers international legal personality.
        why: Tempting because art 104 is the Charter's only personality clause, but it confers domestic capacity only; the Charter is silent on international personality.
      - text: Both rest on the Montevideo Convention, as the UN meets the criteria of statehood.
        why: Tempting because Montevideo sets out personality for states, but the UN is not a state; Reparation said so expressly.
  - key: q714
    type: mcq
    concept: international-organisations-definition-and-personality
    difficulty: 2
    stem: How is international legal personality usually conferred on IOs created in the last 30 years?
    options:
      - text: Expressly in the constitutive instrument, as with the WTO, the EU and ASEAN.
        correct: true
        why: Correct — the lecture says it has become the norm in the last 30 years to grant personality explicitly; WTO art VIII says the WTO "shall have legal personality".
      - text: By an ICJ advisory opinion issued for each new organisation, at the request of the General Assembly.
        why: Tempting because Reparation was an advisory opinion, but that was needed only because the Charter was silent; modern instruments usually confer personality expressly.
      - text: By recognition of the organisation by the host state.
        why: Tempting because recognition confers status on states under the constitutive theory, but IO personality comes from the members' instrument (expressly or implicitly).
  - key: q715
    type: mcq
    concept: international-organisations-definition-and-personality
    variant-of: q714
    difficulty: 3
    stem: A new IO's founding treaty says nothing about legal personality, but gives it functions requiring it to contract with states and bring claims. Can it have international personality?
    options:
      - text: No — personality must be expressly conferred.
        why: Tempting because express conferral is now the norm, but Reparation shows personality can be implied where the functions the members intended require it.
      - text: Yes — following Reparation for Injuries, personality can be implied from the functions the members intended it to exercise.
        correct: true
        why: Correct — the lecture says the Reparation principle was later applied to other IOs, so where personality is not explicit in the constitutive document it can be found implicitly.
      - text: Only if every member state separately recognises it as a state.
        why: Tempting because recognition matters for states, but an IO is not a state, and its personality flows from the constitutive instrument and functions, not recognition.
  - key: q716
    type: mcq
    concept: international-organisations-definition-and-personality
    difficulty: 1
    stem: Which of the following is given on the slides as an early international organisation of the 19th century?
    options:
      - text: The Danube Commission (1856).
        correct: true
        why: Correct — the slide gives the Danube Commission (1856) and the Permanent Court of Arbitration (1899) as early IOs, IOs being a relatively recent, 19th-century phenomenon.
      - text: The World Trade Organization, which the slides describe as the first organisation dealing with global issues.
        why: Tempting because the WTO is on the slide, but it is given as a 20th-century example of the shift to global issues such as trade.
      - text: The G20, which is described as an early informal network of governments that later became an organisation.
        why: Tempting because the G20 is mentioned, but only as an informal network distinct from an IO, not as an early IO.
  - key: q717
    type: truefalse
    set: quickfire
    concept: international-organisations-definition-and-personality
    statement: The UN Charter contains a specific provision allowing members to withdraw from the UN.
    answer: false
    why: False — the lecture says the UN Charter doesn't provide a specific means of withdrawal, so it is unclear how a state would proceed; by contrast Rome Statute art 127 does provide for withdrawal.
  - key: q718
    type: truefalse
    set: quickfire
    concept: international-organisations-definition-and-personality
    statement: An international organisation may include entities other than states among its members.
    answer: true
    why: True — ARIO art 2(a) says IOs may include as members, in addition to states, other entities; the lecture gives the EU's membership of the FAO.
  - key: q719
    type: truefalse
    concept: international-organisations-definition-and-personality
    statement: Article 104 of the UN Charter confers international legal personality on the UN.
    answer: false
    why: False — the lecture says art 104 gives the UN domestic legal capacity in its members' territory, not international legal personality, which the ICJ found implicitly in Reparation.
  - key: q720
    type: short
    concept: international-organisations-definition-and-personality
    difficulty: 3
    prompt: What is an international organisation, and how does it acquire international legal personality? Distinguish it from an NGO.
    model: |
      ARIO art 2(a) defines an international organisation as one "established by a treaty or other instrument governed
      by international law and possessing its own international legal personality", which may include members other
      than states. The lecture breaks this into four elements: creation by treaty or other instrument; governance by
      international law; its own legal personality; and membership. Almost all IOs are created by treaty (the UN
      Charter), though some come from resolutions (OPEC; the ICTY and ICTR by Security Council resolution). Being
      governed by international law is what distinguishes an IO from an NGO such as Greenpeace or Amnesty
      International, which may be international in focus but is governed by domestic law.

      International legal personality means a personality distinct from the members': the capacity to conclude
      treaties, send and receive delegations, bring international claims and be responsible for wrongdoing. It may be
      conferred explicitly in the constitutive instrument — WTO art VIII, the EU and ASEAN, and the norm over the last
      30 years — or implicitly. The UN Charter is silent (art 104 gives only domestic legal capacity), but in
      Reparation for Injuries (1949) the ICJ found the UN an international person because of the functions it was
      intended to exercise, a principle later applied to other IOs.
    rubric:
      - id: r1
        criterion: States the ARIO art 2(a) definition and its elements.
        marks: 2
        top-band: Quotes or closely paraphrases art 2(a) and identifies all four elements.
        margin-note: Accurate definition.
        authorities: [ario-2011-art-2-a]
      - id: r2
        criterion: Distinguishes IOs from NGOs by governing law.
        marks: 1
        top-band: Uses an NGO example and explains why international focus is not enough.
        margin-note: Good distinction.
        authorities: []
      - id: r3
        criterion: Explains explicit conferral of personality with an example.
        marks: 1
        top-band: Cites WTO art VIII or another explicit conferral and notes the modern norm.
        margin-note: Apt example.
        authorities: [wto-agreement-art-viii]
      - id: r4
        criterion: Explains implicit personality through Reparation for Injuries, distinguishing art 104.
        marks: 3
        top-band: Separates domestic capacity (art 104) from international personality and explains the functional reasoning in Reparation.
        margin-note: This is the sophisticated point — well done.
        authorities: [un-charter-art-104]

  # ---------- Concept 8: powers-and-responsibility-of-international-organisations ----------
  - key: q801
    type: mcq
    concept: powers-and-responsibility-of-international-organisations
    difficulty: 1
    stem: What is the principle of attribution (also called speciality or conferred powers)?
    options:
      - text: IOs have no general competence, only the powers their members give them.
        correct: true
        why: Correct — the slide says IOs have no general competence and have the powers given to them by their members, e.g. to create organs or deal with certain disputes.
      - text: The conduct of any person in an IO's territory is attributed to that IO, whether or not the person is its agent.
        why: Tempting because "attribution" also appears in responsibility, but the principle of attribution concerns an IO's powers; IOs do not have territory in that sense.
      - text: IOs have general competence over any matter their members have not expressly excluded from their constitutive instrument.
        why: "Tempting because it sounds generous to IOs, but it reverses the rule: IOs have only what is conferred, not everything not excluded."
  - key: q802
    type: mcq
    concept: powers-and-responsibility-of-international-organisations
    difficulty: 2
    cases: [legality-of-the-threat-or-use-of-nuclear-weapons]
    stem: In the Nuclear Weapons Advisory Opinion (1996), what did the ICJ say about IOs "unlike States"?
    options:
      - text: That they may use force in self-defence under customary law, though only when their member states agree to it.
        why: "Tempting because the opinion concerned nuclear weapons, but the quoted passage concerns competence: IOs do not, unlike states, possess a general competence."
      - text: That they do not possess a general competence and are governed by the principle of speciality.
        correct: true
        why: Correct — para 25 says IOs "do not, unlike States, possess a general competence" and are governed by "the principle of speciality", with powers limited by their members' common interests.
      - text: That they are immune from all international claims.
        why: Tempting because IOs enjoy some immunities, but the opinion was about competence, and IOs can be responsible for their wrongful acts (ARIO art 3).
  - key: q803
    type: mcq
    concept: powers-and-responsibility-of-international-organisations
    variant-of: q802
    difficulty: 3
    cases: [legality-of-the-threat-or-use-of-nuclear-weapons]
    stem: Why, as the lecture explains it, could the World Health Organization not address the legality of nuclear weapons?
    options:
      - text: Because health effects are outside any IO's jurisdiction.
        why: Tempting as a simplification, but health is the WHO's field; the problem was that legality of weapons use was not a necessary implication of its constitution.
      - text: Because that competence could not be a necessary implication of the WHO's constitution, so attributing it would disregard speciality.
        correct: true
        why: Correct — the lecture says attributing that competence to the WHO would disregard the principle of speciality, because it could not be deemed a necessary implication of the WHO's constitution.
      - text: Because only the Security Council may request advisory opinions from the ICJ under the UN Charter.
        why: Tempting because the Security Council is powerful, but the reason given was speciality; nothing this week limits requests to the Security Council.
  - key: q804
    type: mcq
    concept: powers-and-responsibility-of-international-organisations
    difficulty: 2
    stem: Which is the slides' example of an express power of an IO?
    options:
      - text: The UN's power to bring a claim against Israel for injury to its agent, which it exercised following the Reparation opinion.
        why: Tempting because it is this week's key UN power, but Reparation treats that power as implied — not expressly provided in the Charter.
      - text: The Security Council's power to authorise the use of force under UN Charter art 42.
        correct: true
        why: Correct — the slide gives art 42, under which the UN through the Security Council can authorise the use of force, as a power explicitly attributed to the IO.
      - text: The Security Council's power to create the ICTY.
        why: Tempting because the Council did create it, but the Charter did not expressly provide for it; its implication was even disputed at the time.
  - key: q805
    type: mcq
    concept: powers-and-responsibility-of-international-organisations
    difficulty: 2
    cases: [reparation-for-injuries-suffered-in-the-service-of-the-united-nations]
    stem: What is the test for an implied power stated in Reparation for Injuries?
    options:
      - text: Any power a majority of members later wishes the IO to have.
        why: Tempting because members confer powers, but the test is necessity for the IO's duties, not later majority wishes.
      - text: Powers conferred by necessary implication as being essential to the performance of its duties.
        correct: true
        why: Correct — the Court said the Organization must be deemed to have powers which, though not expressly provided, are conferred by necessary implication as essential to the performance of its duties.
      - text: Any power held by at least one of its member states, since members lend their powers to the organisation.
        why: Tempting because IO powers come from members, but the test is necessity for the IO's duties, and IOs have no general competence like states.
  - key: q806
    type: mcq
    concept: powers-and-responsibility-of-international-organisations
    variant-of: q805
    contrasts-with: [international-organisations-definition-and-personality]
    difficulty: 3
    stem: A regional fisheries body's treaty lets it set catch quotas but says nothing about inspecting vessels. Inspections are essential to enforcing quotas. What is the best argument?
    options:
      - text: The body has an implied power to inspect, as essential to the performance of its duties (Reparation).
        correct: true
        why: Correct — applying Reparation, a power not expressly provided may be conferred by necessary implication as essential to performing the IO's duties, subject to speciality.
      - text: The body has general competence to act on any fisheries matter, just as a coastal state has over its own waters.
        why: Tempting because states have general competence, but IOs do not; they have only express powers and those necessarily implied.
      - text: The body cannot inspect, because powers must always be express.
        why: Tempting because speciality limits IOs, but the lecture stresses that powers need not be expressly mentioned; implied powers exist.
  - key: q807
    type: mcq
    concept: powers-and-responsibility-of-international-organisations
    difficulty: 3
    stem: What example does the lecture give of disagreement about whether a power was implied?
    options:
      - text: The Security Council's creation of the ICTY and ICTR in the 1990s.
        correct: true
        why: Correct — some states argued the Security Council had no power, express or implied, to create international criminal tribunals; it is now widely recognised that it can.
      - text: The General Assembly's power to admit new members, on the recommendation of the Security Council under Charter art 4.
        why: Tempting because admission is covered this week, but that power is express in the Charter (arts 4 and 18(2)), not a disputed implied power.
      - text: The WTO's legal personality under art VIII of its agreement.
        why: Tempting because it concerns an IO's status, but art VIII confers personality expressly; the dispute example concerns the ad hoc tribunals.
  - key: q808
    type: mcq
    concept: powers-and-responsibility-of-international-organisations
    difficulty: 2
    stem: Why can an IO be held responsible for its own wrongful acts, rather than only its members?
    options:
      - text: Because it has a distinct legal personality, independent of its member states.
        correct: true
        why: Correct — the lecture says responsibility flows from the fact that IOs have distinct legal personality independent of their member states, so the IO can be held responsible directly.
      - text: Because the ICJ has compulsory jurisdiction over every international organisation and can make binding orders against them.
        why: Tempting because the ICJ gives advisory opinions to UN organs, but it has no such compulsory jurisdiction; responsibility follows from personality.
      - text: Because IOs are states for the purposes of responsibility, under the articles on state responsibility.
        why: Tempting because ARIO is modelled on state responsibility, but IOs are not states; the separate draft articles exist precisely because they differ.
  - key: q809
    type: mcq
    concept: powers-and-responsibility-of-international-organisations
    difficulty: 2
    stem: Which example does the slide give of an IO, rather than its member states, being responsible?
    options:
      - text: The International Tin Council.
        correct: true
        why: "Correct — the slide gives the International Tin Council as the example: the IO, not its member states, was responsible, illustrating the distinction between the two."
      - text: The Permanent Court of Arbitration, which was held responsible for an arbitral award in 1899.
        why: Tempting because the PCA appears this week, but only as an early IO; the responsibility example is the International Tin Council.
      - text: Amnesty International, which answered for the wrongful acts of its members.
        why: Tempting because it is an international body, but Amnesty is an NGO under domestic law and not an IO; it is not this week's responsibility example.
  - key: q810
    type: mcq
    concept: powers-and-responsibility-of-international-organisations
    difficulty: 2
    stem: Under ARIO art 4, when is there an internationally wrongful act of an IO?
    options:
      - text: When its conduct is attributable to it and breaches an international obligation of that organisation.
        correct: true
        why: Correct — art 4 requires conduct (an action or omission) that (a) is attributable to the organisation under international law and (b) breaches an international obligation of the organisation.
      - text: Whenever any member state breaches the IO's constitutive treaty.
        why: Tempting because members act within IOs, but a member's breach is that state's act; art 4 concerns conduct attributable to the IO itself.
      - text: Only when the Security Council declares the conduct unlawful in a binding resolution under Chapter VII.
        why: Tempting because the Council declared the TRNC invalid, but art 4 sets the elements — attribution and breach — with no Council determination required.
  - key: q811
    type: mcq
    concept: powers-and-responsibility-of-international-organisations
    difficulty: 3
    stem: What is the status of the ILC's Draft Articles on the Responsibility of International Organizations, according to the lecture?
    options:
      - text: They are binding on all UN members as a treaty that entered into force in 2011.
        why: Tempting because they are dated 2011, but the lecture stresses that the draft articles are not binding.
      - text: They are not binding, and are criticised for applying one framework modelled on state responsibility to very different IOs.
        correct: true
        why: Correct — the lecture says the articles are not binding and have been widely criticised for codifying one framework, modelled on state responsibility, for IOs differing in functions and structures.
      - text: They are binding customary law, confirmed by the ICJ in Reparation for Injuries.
        why: Tempting because Reparation is the leading IO case, but it dates from 1949, decades before the draft articles; the lecture calls them non-binding.
  - key: q812
    type: mcq
    concept: powers-and-responsibility-of-international-organisations
    difficulty: 2
    stem: Under ARIO art 6, whose conduct is considered an act of the IO?
    options:
      - text: The conduct of an organ or agent of the IO in performing its functions, whatever its position in the organisation.
        correct: true
        why: Correct — art 6(1) attributes to the IO the conduct of its organs or agents in the performance of their functions, whatever position they hold; the IO's rules determine those functions.
      - text: Only the conduct of the IO's most senior officer, the Secretary-General.
        why: Tempting because heads of organisations speak for them, but art 6 covers any organ or agent performing functions, "whatever position" it holds.
      - text: The conduct of any national of a member state, acting in any capacity at all.
        why: Tempting because members stand behind IOs, but art 6 attributes only organs' and agents' conduct in performing their functions.
  - key: q813
    type: mcq
    concept: powers-and-responsibility-of-international-organisations
    difficulty: 3
    stem: What test does ARIO art 7 use for conduct of a state organ placed at the disposal of an IO?
    options:
      - text: Effective control — the conduct is the IO's act if the IO exercises effective control over that conduct.
        correct: true
        why: Correct — art 7 attributes such conduct to the receiving IO if the organisation exercises effective control over it, assessed factually on the specific conduct and full circumstances.
      - text: Nationality — conduct is always attributed to the state of the soldier's nationality.
        why: Tempting because contributing states retain jurisdiction over their troops, but art 7's test is effective control, not nationality alone.
      - text: Formal command — conduct is attributed to whichever body is named as commander in the mandate issued by the Security Council.
        why: Tempting because peacekeepers act under the Security Council's control, but the ILC commentary describes a factual test of effective control, not formal labels.
  - key: q814
    type: mcq
    concept: powers-and-responsibility-of-international-organisations
    variant-of: q813
    difficulty: 4
    stem: UN peacekeepers from State K commit a wrongful act. K's national commanders, not the UN, gave the specific order. Where does responsibility likely lie?
    options:
      - text: With the UN alone, because peacekeepers are always a subsidiary organ of the UN.
        why: Tempting because peacekeeping organs are subsidiary UN organs, but art 7 turns on effective control over the specific conduct, which here lay with K.
      - text: With State K, to the extent it exercised effective control over its soldiers' conduct.
        correct: true
        why: Correct — the lecture says under art 7 wrongful peacekeeping conduct can be attributed to states to the extent they continued to exercise control over their soldiers' conduct.
      - text: With no one, since the draft articles are non-binding and so cannot ground responsibility, whether for the UN or for State K.
        why: Tempting because the draft articles are non-binding, but the lecture says art 7 opens a window to hold states accountable where they exercised effective control.
  - key: q815
    type: mcq
    concept: powers-and-responsibility-of-international-organisations
    difficulty: 3
    stem: The ILC commentary sets three conditions for assessing effective control under art 7. Which is one of them?
    options:
      - text: It must be factual, exercised over the specific conduct, and assessed in light of the full factual circumstances.
        correct: true
        why: "Correct — the lecture lists the three conditions: control must be factual, exercised in respect of the specific conduct, and assessed taking account of the full factual circumstances and context."
      - text: It must be written into the troop contribution agreement, whatever the facts on the ground.
        why: Tempting because agreements structure peacekeeping, but the commentary's test is factual, not a matter of what the agreement says.
      - text: It must be confirmed by a Security Council resolution before any responsibility can arise.
        why: Tempting because the Council controls peacekeeping, but no such confirmation is required; effective control is assessed on the facts.
  - key: q816
    type: mcq
    concept: powers-and-responsibility-of-international-organisations
    contrasts-with: [international-organisations-definition-and-personality]
    difficulty: 3
    stem: A student says, "Because the UN has international legal personality, it can do anything a state can do." Which response is best?
    options:
      - text: Agree — personality gives the UN the full capacity of a state.
        why: Tempting because personality is shared with states, but only states have full capacity, and Reparation says the UN's rights and duties are not the same as a state's.
      - text: Disagree — personality lets the UN act internationally, but its powers are limited by speciality to express and necessarily implied powers.
        correct: true
        why: Correct — this separates personality (the capacity to act internationally) from powers (limited by the principle of speciality to express and implied powers; no general competence).
      - text: Disagree — the UN has no international personality, so it can do nothing at all on the international plane without its members' authority in each case.
        why: Tempting as an overcorrection, but Reparation held the UN an international person able to bring claims; the limit is on its powers, not its personality.
  - key: q817
    type: mcq
    concept: powers-and-responsibility-of-international-organisations
    difficulty: 2
    stem: Why are UN peacekeeping operations a difficult case for attributing responsibility?
    options:
      - text: They are subsidiary UN organs under Security Council and General Assembly control, but composed of national troops over whom states retain jurisdiction and residual control.
        correct: true
        why: "Correct — the slide explains the dual structure: subsidiary UN organs acting under UN control, but made up of contributed troops over whom member states retain jurisdiction and residual control."
      - text: They are NGOs governed by domestic law.
        why: Tempting because they operate on the ground like humanitarian bodies, but they are subsidiary organs of the UN, not NGOs.
      - text: They are immune from international law altogether, under the Charter.
        why: Tempting because IOs enjoy some immunities, but peacekeepers' conduct can be attributed to the UN or to states under ARIO arts 6 and 7.
  - key: q818
    type: truefalse
    set: quickfire
    concept: powers-and-responsibility-of-international-organisations
    statement: International organisations, like states, possess a general competence.
    answer: false
    why: False — in the Nuclear Weapons opinion the ICJ said IOs "do not, unlike States, possess a general competence" and are governed by the principle of speciality.
  - key: q819
    type: truefalse
    set: quickfire
    concept: powers-and-responsibility-of-international-organisations
    statement: An international organisation can have powers not expressly provided in its constitutive instrument.
    answer: true
    why: True — Reparation for Injuries says an IO must be deemed to have powers conferred by necessary implication as essential to the performance of its duties (implied powers).
  - key: q820
    type: truefalse
    concept: powers-and-responsibility-of-international-organisations
    statement: The ILC's Draft Articles on the Responsibility of International Organizations are a binding treaty.
    answer: false
    why: False — the lecture stresses that these draft articles are not binding, and that they have been widely criticised for modelling one framework on state responsibility for very different IOs.

