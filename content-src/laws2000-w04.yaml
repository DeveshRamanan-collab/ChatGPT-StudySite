    body: |
      Recognition is the act by which a state officially acknowledges the existence of another state or government —
      a complex mixture of politics and law. States sometimes recognise entities that fail the Montevideo criteria,
      and refuse entities that meet them. No diplomatic relations does not necessarily mean no recognition.

      Under the declaratory theory (the most widely held today) recognition only acknowledges a pre-existing
      statehood; it is symbolic. Under the constitutive theory recognition creates the state and confers legal
      personality: no recognition, no existence. Collective recognition happens through international organisations;
      UN admission needs a Security Council recommendation (vetoable) and two-thirds of the General Assembly.

      Non-recognition may prevent statehood where the criteria were achieved illegally (1970 Friendly Relations
      Declaration; *Kosovo* Advisory Opinion 2010 on "the unlawful use of force or other egregious violations of norms
      of general international law"). The TRNC meets the criteria but is recognised only by Turkey; Security Council
      resolutions 541 (1983) and 550 (1984) called its declaration legally invalid. Kosovo (100+ recognitions),
      Palestine (150+, UN non-member observer) and Western Sahara remain contested.

      Exam use: state both theories, apply the Montevideo criteria first, then ask whether illegality blocks
      recognition.
  - slug: modes-of-territorial-acquisition
    title: Modes of territorial acquisition
    visual: palace
    visual-brief: Five doors in order — cession, accretion, terra nullius, prescription, conquest — the last one bricked up in 1945 and relabelled "belligerent occupation".
    related: [montevideo-criteria-for-statehood, self-determination-and-secession]
    depends-on: [montevideo-criteria-for-statehood]
    contrasts-with: [self-determination-and-secession]
    cases: []
    authorities: [unclos-art-121-1, unclos-art-60, un-charter-art-2-4]
    verify: false
    body: |
      Acquisition of territory is a state gaining sovereign title over land (continental territory or an island).
      There are five modes.

      1. Cession: transfer from one state to another, often by purchase treaty (Alaska from Russia, 1867). The
         acquirer gets no more rights than the ceding state had, and must respect third states' and indigenous
         rights.
      2. Accretion: new land formed gradually by nature (a 1986 volcanic island in Japan's territorial sea). An
         island is "a naturally formed area of land, surrounded by water, which is above water at high tide" (UNCLOS
         art 121(1)); artificial islands and low-tide elevations cannot ground sovereignty (South China Sea
         arbitration, 2016).
      3. Occupation of terra nullius: effective control plus intention to claim title over land never under any
         state's sovereignty. Barely applicable now, but central to colonial expansion.
      4. Prescription: title over another state's territory through peaceful control, acting as sovereign, on implied
         consent — sustained protest prevents it.
      5. Conquest: prohibited since the UN Charter 1945 (art 2(4)); occupation by force now triggers the belligerent
         occupation regime, temporary and without transfer of sovereignty (Kuwait 1990, Crimea 2014).

      Exam use: identify whether the land was previously sovereign (prescription, cession, conquest) or not (terra
      nullius, accretion), then check consent and use of force.
  - slug: self-determination-and-secession
    title: Self-determination and secession
    visual: diagram
    visual-brief: A split path from "peoples' right to self-determination" — a clear road in the decolonisation context (Chagos) and, outside it, a fork into internal (satisfied — Quebec) and external (contested — Kosovo).
    related: [recognition-of-states, emerging-actors-beyond-the-state]
    depends-on: [emerging-actors-beyond-the-state, montevideo-criteria-for-statehood]
    contrasts-with: [modes-of-territorial-acquisition]
    cases: [chagos-islands-case, re-secession-of-quebec, declaration-of-independence-in-respect-of-kosovo]
    authorities: [un-charter-art-1-2, iccpr-art-1, declaration-on-the-granting-of-independence-1960]
    verify: false
    body: |
      At a minimum, self-determination "entails the entitlement of peoples to have control over their destiny and to
      be treated respectfully" (Australian Government). UN Charter art 1(2) refers to the "principle of equal rights
      and self-determination of peoples" without framing it as a right; ICCPR art 1 enshrines it as a human right:
      "All peoples have the right of self-determination."

      In the decolonisation context it is generally accepted. The 1960 Declaration on the Granting of Independence
      called alien subjugation "a denial of fundamental human rights", and in *Chagos* (2019) the ICJ affirmed the
      Chagossians' right and the UK's obligation to complete the decolonisation of Mauritius.

      Outside decolonisation the right has internal and external dimensions, and a right to unilaterally secede is
      highly contentious. Kosovo's 2008 secession from Serbia was argued to be legitimate as a response to systematic
      discrimination and oppression; opponents said it violated Serbia's sovereignty and territorial integrity. In
      *Re Secession of Quebec* (1998) the Supreme Court of Canada held unilateral secession inconsistent with
      international law and the Canadian Constitution: Quebec's internal self-determination was fulfilled, so there
      was no ground for external self-determination.

      Exam use: classify the claim (colonial or not; internal or external), then ask whether the people's internal
      self-determination is being denied.
