    title: International organisations — definition, membership and legal personality
    visual: explainer
    visual-brief: A constitutive treaty unfolding into four labelled parts — treaty or instrument, governed by international law, own personality, members — with an NGO beside it missing the second part.
    related: [powers-and-responsibility-of-international-organisations, subjects-and-international-legal-personality]
    depends-on: [subjects-and-international-legal-personality, laws2000-w02-treaties-as-a-source]
    contrasts-with: [powers-and-responsibility-of-international-organisations]
    cases: [reparation-for-injuries-suffered-in-the-service-of-the-united-nations]
    authorities: [ario-2011-art-2-a, un-charter-art-4, rome-statute-art-127, un-charter-arts-5-6, un-charter-art-104, wto-agreement-art-viii]
    verify: false
    body: |
      ARIO art 2(a) defines an international organisation as one "established by a treaty or other instrument
      governed by international law and possessing its own international legal personality", which may include
      entities other than states as members. Being governed by international law distinguishes IOs from NGOs such as
      Greenpeace or Amnesty International. Almost all IOs are created by treaty (the UN Charter); some by resolutions
      (OPEC; the ICTY and ICTR by Security Council resolution).

      The constitutive instrument sets membership (UN Charter art 4: "peace-loving states"; the EU is a member of the
      FAO), withdrawal (Rome Statute art 127: effective one year after notification; the UN Charter has no withdrawal
      clause) and expulsion (UN Charter art 6, for persistent violation).

      International legal personality is distinct from the members': concluding treaties, sending and receiving
      delegations, bringing international claims, and being responsible for wrongdoing. It may be conferred
      explicitly (WTO art VIII; the norm for the last 30 years) or implicitly: *Reparation for Injuries* (1949) found
      the UN an international person although the Charter is silent. UN Charter art 104 confers only domestic legal
      capacity — renting offices in New York, employing staff.

      Exam use: go to the constitutive instrument first; if it is silent on personality, argue implied personality
      from the functions the organisation was intended to exercise.
  - slug: powers-and-responsibility-of-international-organisations
    title: Powers and responsibility of international organisations
    visual: diagram
    visual-brief: A box of powers drawn by the members (express inside, implied at the dotted edge) and, below, an attribution switch routing a peacekeeper's conduct to the UN or the contributing state by who has effective control.
    related: [international-organisations-definition-and-personality]
    depends-on: [international-organisations-definition-and-personality]
    contrasts-with: [international-organisations-definition-and-personality]
    cases: [legality-of-the-threat-or-use-of-nuclear-weapons, reparation-for-injuries-suffered-in-the-service-of-the-united-nations]
    authorities: [ario-2011-arts-3-4, ario-2011-art-6, ario-2011-art-7]
    verify: false
    body: |
      Principle of attribution (speciality, conferred powers): IOs have no general competence, only the powers their
      members give them. In the *Nuclear Weapons* Advisory Opinion (1996, [25]) the ICJ said IOs "do not, unlike
      States, possess a general competence" and are governed by "the principle of speciality" — the WHO could not
      address the legality of nuclear weapons.

      Powers are express (UN Charter art 42: the Security Council can authorise force) or implied: the UN "must be
      deemed to have those powers which, though not expressly provided in the Charter, are conferred upon it by
      necessary implication as being essential to the performance of its duties" (*Reparation*, 182). Implied powers
      can be disputed, as when the Security Council created the ICTY and ICTR.

      Responsibility follows distinct personality: the organisation, not its members, answers for its wrongful acts
      (the International Tin Council). ARIO art 3: every internationally wrongful act of an IO entails its
      responsibility; art 4: conduct attributable to it that breaches its obligation; art 6: conduct of its organs or
      agents in performing their functions. Art 7: a state organ placed at an IO's disposal acts for the IO "if the
      organization exercises effective control over that conduct" — so a contributing state that kept control of its
      peacekeepers can be responsible. The draft articles are not binding and are criticised for modelling one
      state-responsibility framework for very different IOs.

      Exam use: check the constitutive instrument for the power, then attribute the conduct.

cases:
  - slug: reparation-for-injuries-suffered-in-the-service-of-the-united-nations
    name: Reparation for Injuries Suffered in the Service of the United Nations
    citation: "(Advisory Opinion) [1949] ICJ Rep 174"
    aglc: "Reparation for Injuries Suffered in the Service of the United Nations (Advisory Opinion) [1949] ICJ Rep 174"
    facts: |
      A UN mediator was killed by a militia while serving the UN, in clashes involving Israeli militants. The General
      Assembly requested an advisory opinion on whether the UN could bring an international claim for reparation
      against Israel for injuries suffered by its own officials. The UN Charter did not say that the UN had
      international legal personality.
    issue: |
      Whether the UN possessed international legal personality, so that it could bring an international claim
      against a state, and whether it had the powers needed to do so although the Charter did not expressly confer
      them.
    held: |
      The Organization "was intended to exercise and enjoy, and is in fact exercising and enjoying, functions and
      rights which can only be explained on the basis of the possession of a large measure of international
      personality and the capacity to operate upon an international plane"; it "is an international person. That is
      not the same thing as saying that it is a State, which it certainly is not, or that its legal personality and
      rights and duties are the same as those of a State" (178–179). The Organization "must be deemed to have those
      powers which, though not expressly provided in the Charter, are conferred upon it by necessary implication as
      being essential to the performance of its duties" (182).
    ratio: |
      An international organisation can possess international legal personality even where its constitutive
      instrument does not confer it expressly, if that personality is needed to exercise the functions and rights its
      members intended it to have; and it has the implied powers essential to performing its duties.
    significance: |
      The foundation for the implicit international legal personality of international organisations (later applied
      to other IOs) and for the doctrine of implied powers; also an acknowledgment that the subjects of international
      law "are not necessarily identical in their nature or in the extent of their rights".
    why-here: Used for the partial, functional personality of international organisations and for implied powers.
    verify: false
  - slug: declaration-of-independence-in-respect-of-kosovo
    name: Declaration of Independence in respect of Kosovo
    citation: "(Advisory Opinion) [2010] ICJ"
    aglc: "Declaration of Independence in respect of Kosovo (Advisory Opinion) [2010] ICJ"
    facts: |
      Following UN administration of the territory, Kosovo declared independence from Serbia in February 2008. The
      secession was supported by many Western countries and opposed by Serbia, Russia and China. Kosovo is recognised
      by more than 100 UN member states and is a member of the IMF and World Bank.
    issue: |
      Whether the unilateral declaration of independence was in accordance with international law.
    held: |
      The declaration of independence was not in itself illegal. The Court refrained from deciding whether Kosovo was
      a state, and refrained from saying that unilateral self-determination (secession) in that case was lawful. The
      Court referred to declarations connected with "the unlawful use of force or other egregious violations of norms
      of general international law, in particular those of a peremptory character (jus cogens)" as ones that should
      not lead to recognition.
    ratio: |
      A declaration of independence is not, as such, prohibited by international law; illegality attaches where it is
      connected with the unlawful use of force or egregious violations of general international law, especially jus
      cogens.
    significance: |
      The leading illustration of contested statehood and of the controversy over external self-determination
      (unilateral secession) outside the decolonisation context.
    why-here: Used for illegality as a ground of non-recognition and for the unresolved question of a right to secede.
    verify: true
  - slug: chagos-islands-case
    name: Chagos Islands case
    citation: "(Advisory Opinion) [2019] ICJ"
    aglc: "Chagos Islands case (Advisory Opinion) [2019] ICJ"
    facts: |
      Mauritius claimed the Chagos archipelago, administered by the United Kingdom as the British Indian Ocean
      Territory (home to an important military base); the UK had "no doubt" of its sovereignty. The UK had separated
      the islands and removed their population before Mauritius became independent. The General Assembly requested
      an advisory opinion.
    issue: |
      Whether the decolonisation of Mauritius had been lawfully completed, given the separation of the Chagos
      archipelago, and the consequences under international law.
    held: |
      The Court affirmed the right of self-determination of the people concerned in the decolonisation context, found
      that the UK's separation of the islands and removal of the population before independence violated that right,
      and noted the UK's obligation to complete the decolonisation of Mauritius. In late 2022 Mauritius and the UK
      began negotiations on the future status of the Chagos.
    ratio: |
      In the decolonisation context, the right of peoples to self-determination is an established rule of
      international law, and a colonial power's detachment of part of a colony before independence violates it.
    significance: |
      The key modern authority for the right to self-determination in the decolonisation context.
    why-here: Used as the clear case of self-determination in the decolonisation context, to contrast with contested secession.
    verify: true
  - slug: re-secession-of-quebec
    name: Re Secession of Quebec
    citation: "[1998] 2 SCR 2017"
    aglc: "Re Secession of Quebec [1998] 2 SCR 2017"
    facts: |
      Quebec had held referendums on separating from Canada. The question of whether Quebec could unilaterally secede
      was referred to the Supreme Court of Canada.
    issue: |
      Whether Quebec had the legal right to unilaterally secede from Canada under Canadian law and under international
      law.
    held: |
      Unilateral secession is not consistent with international law or the Canadian Constitution. Distinguishing
      internal from external self-determination, the Court held that Quebec's internal self-determination was
      fulfilled, so there was no ground for claiming external self-determination, which would involve secession.
    ratio: |
      Outside the colonial context, a people whose internal self-determination is fulfilled within an existing state
      has no right under international law to external self-determination by unilateral secession.
    significance: |
      A leading national-court statement of the internal/external distinction in self-determination, relevant to any
      secession problem (such as the tutorial's Western Australia scenario).
    why-here: Used for the rule that a people enjoying internal self-determination has no right to secede unilaterally.
    verify: true
  - slug: legality-of-the-threat-or-use-of-nuclear-weapons
    name: Legality of the Threat or Use of Nuclear Weapons
    citation: "(Advisory Opinion) [1996] ICJ"
    aglc: "Legality of the Threat or Use of Nuclear Weapons (Advisory Opinion) [1996] ICJ"
    facts: |
      The Court had to consider whether the World Health Organization had competence to address the legality of the
      use of nuclear weapons in view of their health and environmental effects.
    issue: |
      Whether the question fell within the WHO's powers, given the principle of speciality governing international
      organisations.
    held: |
      "The Court need hardly point out that international organizations are subjects of international law which do
      not, unlike States, possess a general competence. International organizations are governed by the 'principle
      of speciality', that is to say, they are invested by the States which create them with powers, the limits of
      which are a function of the common interests whose promotion those States entrust to them" [25]. Attributing
      that competence to the WHO would disregard the principle of speciality, since it could not be deemed a necessary
      implication of the WHO's constitution.
    ratio: |
      International organisations have only the powers conferred on them by their members (express or by necessary
      implication), limited by the common interests entrusted to them; they have no general competence.
    significance: |
      The leading statement of the principle of attribution (speciality) and of its limit on implied powers.
    why-here: Used for the principle of speciality — no general competence for international organisations.
    verify: true

authorities:
  - slug: montevideo-convention-1933-art-1
    title: Montevideo Convention on Rights and Duties of States 1933 art 1
    kind: treaty
    text: |
      The state as a person of international law should possess the following qualifications: a. a permanent
      population; b. a defined territory; c. government; and d. capacity to enter into relations with other states.
    gloss: The four criteria of statehood — a regional treaty with few parties, but widely regarded as codifying customary international law.
    cases: [north-sea-continental-shelf-cases]
    verify: false
  - slug: friendly-relations-declaration-1970
    title: Declaration on Principles of International Law concerning Friendly Relations and Cooperation among States 1970
    kind: other
    text: |
      Declaration on Principles of International Law concerning Friendly Relations and Cooperation among States in
      accordance with the Charter of the United Nations, UN General Assembly (1970). (Cited in the lecture for the
      proposition that states should not recognise a state that has achieved the criteria of statehood illegally; the
      materials do not reproduce its wording.)
    gloss: A largely non-binding General Assembly declaration relied on for the duty not to recognise entities created by illegal means.
    cases: [declaration-of-independence-in-respect-of-kosovo]
    verify: true
  - slug: unsc-resolutions-541-and-550
