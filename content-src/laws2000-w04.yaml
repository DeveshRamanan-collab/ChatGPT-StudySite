  - slug: iccpr-art-1
    title: International Covenant on Civil and Political Rights 1966 art 1
    kind: treaty
    text: |
      All peoples have the right of self-determination. By virtue of that right they freely determine their political
      status and freely pursue their economic, social and cultural development.
    gloss: Enshrines self-determination as a human right of peoples.
    cases: [chagos-islands-case]
    verify: false
  - slug: declaration-on-the-granting-of-independence-1960
    title: Declaration on the Granting of Independence to Colonial Territories and Peoples 1960
    kind: other
