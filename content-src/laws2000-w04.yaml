      Republic of Cyprus and the 1960 Treaty of Guarantee, Considering, therefore, that the attempt to create a
      'Turkish Republic of Northern Cyprus' is invalid ... Considers the declaration referred to above as legally
      invalid and calls for its withdrawal".
    gloss: The Security Council declared the TRNC's declaration of independence legally invalid; resolution 550 called on states not to recognise it.
    cases: []
