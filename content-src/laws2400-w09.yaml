cards:
  - type: basic
    concept: breach-of-duty-flowchart
    front: What two questions does the breach flowchart ask?
    back: >-
      1. Was the RISK of injury to the plaintiff reasonably foreseeable? (what standard of care is owed?) 2. Was the
      RESPONSE of the defendant to this risk reasonable? (has the standard been met?)
    source: Topic 9 flowchart, p 381 (Breach of Duty – General)
  - type: cloze
    concept: breach-of-duty-flowchart
    text: >-
      Section 5B(1)(a) and (b) relate to the {{c1::first}} breach question (the degree of foreseeable risk); s 5B(1)(c)
      and (2)(a)–(d) relate to the {{c2::second}} (the reasonableness of the response).
    source: Topic 9 flowchart, p 381 (Breach of Duty – General)
  - type: basic
    concept: breach-of-duty-flowchart
    front: Why does the flowchart say s 5B is "although headed 'Duty of Care'"?
    back: Because s 5B sits under a "Duty of care" heading, yet it establishes the statutory criteria for breach of duty.
    source: Topic 9 flowchart, p 381 (Breach of Duty – General)
  - type: basic
    concept: breach-of-duty-flowchart
    front: How do courts use the common law principles on breach when interpreting s 5B?
    back: They are guided by the general common law principles on breach where appropriate.
    source: Topic 9 flowchart, p 382 (Breach of Duty Question 1)
  - type: apply
    concept: breach-of-duty-flowchart
    scenario: An answer proves the risk was foreseeable and not insignificant, then concludes "breach established".
    answer: >-
      Incomplete: s 5B(1) is cumulative ("and"). It must also show that a reasonable person in the defendant's position
      would have taken the precautions (s 5B(1)(c)), considering s 5B(2).
    source: Civil Liability Act 2002 (NSW) s 5B
  - type: basic
    concept: breach-of-duty-flowchart
    front: The flowchart cites the WA Act. What changes for a NSW answer?
    back: >-
      Cite the Civil Liability Act 2002 (NSW) s 5B: same (1)(a)–(c) and (2)(a)–(d) structure, but its opening words are
      "A person is not negligent in failing to take precautions against a risk of harm unless".
    source: Topic 9 flowchart, p 381 (Breach of Duty – General); Civil Liability Act 2002 (NSW) s 5B
  - type: basic
    concept: standard-of-care-reasonableness
    front: Against what does the court measure the defendant's conduct to decide breach?
    back: A standard of care. Falling short of it — far short or just short — is a negligent breach.
    source: Topic 9 flowchart, p 381 (Breach of Duty – General)
  - type: cloze
    concept: standard-of-care-reasonableness
    text: >-
      The duty is only a duty to take {{c1::reasonable care}}; it is not an absolute duty to avoid injury — the measure
      is reasonableness, not {{c2::elimination of risk}} (Swain v Waverley Municipal Council).
    source: Topic 9 flowchart, p 381 (Breach of Duty – General)
  - type: basic
    concept: standard-of-care-reasonableness
    front: Can a defendant who did their personal best be in breach?
    back: >-
      Yes. The standard is objective — a reasonable person's response to a foreseeable injury — so a personal best that
      is not reasonable is still a breach.
    source: Topic 9 flowchart, p 381 (Breach of Duty – General)
  - type: cloze
    concept: standard-of-care-reasonableness
    text: >-
      Blyth v Birmingham Waterworks Co: negligence is the {{c1::omission}} to do something which the reasonable man
      would do, or {{c2::doing something}} which a prudent and reasonable man would not do.
    source: Topic 9 flowchart, p 381 (Breach of Duty – General)
  - type: apply
    concept: standard-of-care-reasonableness
    scenario: A defendant's precautions were reasonable, but some risk remained and the plaintiff was injured.
    answer: 'No breach on that ground alone: the duty is to take reasonable care, not to eliminate risk (Swain, Gleeson CJ).'
    source: Topic 9 flowchart, p 381 (Breach of Duty – General)
  - type: cloze
    concept: foreseeable-risk-s5b-1a
    text: >-
      Section 5B(1)(a): the risk was foreseeable — that is, a risk of which the person {{c1::knew or ought to have
      known}}.
    source: Civil Liability Act 2002 (NSW) s 5B
  - type: basic
    concept: foreseeable-risk-s5b-1a
    front: How does breach-stage foreseeability differ from duty-stage foreseeability?
    back: >-
      It is a more specific test: it examines the defendant's actual conduct and requires the court to consider the
      actual risk of injury in the circumstances of the case. The duty-stage test is more general.
    source: Topic 9 flowchart, p 382 (Breach of Duty Question 1)
  - type: basic
    concept: foreseeable-risk-s5b-1a
    front: What does "foreseeable" mean, per Wyong Shire Council v Shirt (Mason J)?
    back: Something that is not far-fetched or fanciful. Wyong remains good authority.
    source: Topic 9 flowchart, p 382 (Breach of Duty Question 1)
  - type: basic
    concept: foreseeable-risk-s5b-1a
    front: Must the plaintiff show the precise manner of injury, or the particular injury, was foreseeable?
    back: >-
      No — only that the defendant created a reasonably foreseeable risk of injury of some kind to someone such as the
      plaintiff.
    source: Topic 9 flowchart, p 382 (Breach of Duty Question 1)
  - type: cloze
    concept: foreseeable-risk-s5b-1a
    text: >-
      A defendant must foresee and guard against inadvertent, negligent, or even {{c1::extremely foolhardy}} conduct by
      the plaintiff, even though it is unlikely (Nagle v Rottnest Island Board; McLean v Tedman).
    source: Topic 9 flowchart, p 382 (Breach of Duty Question 1)
  - type: basic
    concept: foreseeable-risk-s5b-1a
    front: How did McHugh J describe reasonable foreseeability in Swain?
    back: >-
      "A fact-value complex … with inherent questions of fairness, policy, practicality, proportion, expense, and
      justice" (2005) 220 CLR 517, 547 [79].
    source: Topic 9 flowchart, p 382 (Breach of Duty Question 1)
  - type: apply
    concept: foreseeable-risk-s5b-1a
    scenario: A shopkeeper never actually knew a bracket was loose, but it had been visibly bent for weeks.
    answer: 'Section 5B(1)(a) can still be met: the risk is one she ought to have known of; actual knowledge is not needed.'
    source: Civil Liability Act 2002 (NSW) s 5B
  - type: cloze
    concept: not-insignificant-risk-s5b-1b
    text: 'Section 5B(1)(b): the risk was not {{c1::insignificant}}.'
    source: Civil Liability Act 2002 (NSW) s 5B
  - type: basic
    concept: not-insignificant-risk-s5b-1b
    front: How high is the "not insignificant" threshold in s 5B(1)(b)?
    back: >-
      Higher than the common law's "not far-fetched or fanciful", but not so high as "a substantial risk" (Ipp Report).
      The flowchart's markers (a real risk, Bolton v Stone; not far-fetched, Wyong) are only a starting point.
    source: Topic 9 Lecture 1, slides 8, 20–21; Topic 9 flowchart, p 382
  - type: basic
    concept: not-insignificant-risk-s5b-1b
    front: What is the flowchart's principle about the degree of risk?
    back: >-
      The higher the degree of risk, the less reasonable it will be for the defendant to fail to take steps to prevent
      it occurring.
    source: Topic 9 flowchart, p 381 (Breach of Duty – General)
  - type: apply
    concept: not-insignificant-risk-s5b-1b
    scenario: A court finds a hazard could cause injury only through a far-fetched chain of events.
    answer: >-
      Section 5B(1)(a) likely fails (not far-fetched or fanciful is the Wyong test), and (b) fails too: "not
      insignificant" sits above "not far-fetched".
    source: Topic 9 flowchart, p 382; Topic 9 Lecture 1, slides 7–8, 21
  - type: cloze
    concept: reasonable-response-s5b-1c-and-2
    text: >-
      Section 5B(1)(c): in the circumstances, a {{c1::reasonable person}} in the person's position would have taken
      those precautions.
    source: Civil Liability Act 2002 (NSW) s 5B
  - type: basic
    concept: reasonable-response-s5b-1c-and-2
    front: What four matters does s 5B(2) require the court to consider?
    back: >-
      (a) the probability that the harm would occur if care were not taken; (b) the likely seriousness of the harm; (c)
      the burden of taking precautions to avoid the risk of harm; (d) the social utility of the activity that creates
      the risk of harm.
    source: Civil Liability Act 2002 (NSW) s 5B
  - type: cloze
    concept: reasonable-response-s5b-1c-and-2
    text: The s 5B(2) considerations apply "{{c1::amongst other relevant things}}", so the list is not exhaustive.
    source: Civil Liability Act 2002 (NSW) s 5B
  - type: apply
    concept: reasonable-response-s5b-1c-and-2
    scenario: A fence to stop falls at a lookout would be very expensive and take months to build.
    answer: >-
      Goes to s 5B(2)(c), the burden of taking precautions — weighed with probability, seriousness and social utility
      under s 5B(1)(c).
    source: Civil Liability Act 2002 (NSW) s 5B
  - type: basic
    concept: reasonable-response-s5b-1c-and-2
    front: Which breach question do s 5B(1)(c) and (2) answer?
    back: 'The second: was the defendant''s RESPONSE to the risk reasonable — has the standard been met?'
    source: Topic 9 flowchart, p 381 (Breach of Duty – General)
  - type: basic
    concept: breach-of-duty-flowchart
    front: What were the two limbs of the common law test for breach in Wyong Shire Council v Shirt?
    back: >-
      1. Reasonable foreseeability of a real risk of injury arising from the defendant's conduct; 2. the reasonableness
      of the defendant's response to that risk.
    source: Topic 9 Lecture 1, slide 7
  - type: cloze
    concept: breach-of-duty-flowchart
    text: >-
      Garling J in Benic: the three elements of s 5B(1) represent {{c1::foreseeability}}, {{c2::probability}} and
      {{c3::reasonableness of precautions}}, and each must be separately addressed.
    source: Topic 9 Lecture 1, slide 9
  - type: basic
    concept: breach-of-duty-flowchart
    front: Why is the "Duty of care" heading over s 5B a trap?
    back: >-
      Section 5B sets the test for breach, not for establishing a duty of care, despite sitting in Division 2 headed
      "Duty of care".
    source: Topic 9 Lecture 1 (lecture); Civil Liability Act 2002 (NSW) Pt 1A Div 2
  - type: basic
    concept: standard-of-care-reasonableness
    front: Is there such a thing as a "slight" breach of duty?
    back: >-
      No — there are no degrees of carelessness: the defendant is liable whether her conduct was marginally careless or
      completely reckless. Breach is proved on the balance of probabilities.
    source: Topic 9 Lecture 1, slide 5
  - type: basic
    concept: standard-of-care-reasonableness
    front: What did Alderson B say in Blyth v Birmingham Waterworks Co (1856)?
    back: >-
      "Negligence is the omission to do something which a reasonable man … would do, or doing something which a prudent
      and reasonable man would not do."
    source: Topic 9 Lecture 1, slide 6
  - type: basic
    concept: identifying-the-risk-of-harm
    front: What is Benic step 1, and how specific must it be?
    back: >-
      Identify the risk of harm. It is enough to describe a class of injury, as distinct from the particular injury
      suffered — but specific enough to correspond to the precautions that should have been taken.
    source: Topic 9 Lecture 1, slides 11–13
  - type: basic
    concept: identifying-the-risk-of-harm
    front: How did Gummow J correct the Court of Appeal's framing of the risk in RTA v Dederer?
    back: >-
      Not "serious spinal injury flowing from the act of diving off the bridge" but impact upon jumping into potentially
      shallow water and shifting sands of the estuary [60].
    source: Topic 9 Lecture 1, slide 12
  - type: cloze
    concept: identifying-the-risk-of-harm
    text: >-
      You cannot formulate the risk so {{c1::broadly}} that it encompasses fundamentally different scenarios requiring
      fundamentally different {{c2::responses}}.
    source: Topic 9 Lecture 1, slide 13
  - type: apply
    concept: identifying-the-risk-of-harm
    scenario: >-
      A child is cut by a broken bottle left in a council sandpit. The plaintiff describes the risk as "a 4 cm
      laceration to the right heel".
    answer: >-
      Too narrow: that is the particular injury. Benic step 1 needs a class of injury tied to its source — cuts from
      broken glass left in a play area — which matches the precaution (inspection and clearing).
    source: Topic 9 Lecture 1, slides 11–13
  - type: basic
    concept: foreseeable-risk-s5b-1a
    front: What did Mason J say about foreseeability and likelihood in Wyong?
    back: >-
      They are two different things: a risk of injury which is quite unlikely to occur may nevertheless be plainly
      foreseeable.
    source: Topic 9 Lecture 1, slide 17
  - type: cloze
    concept: foreseeable-risk-s5b-1a
    text: >-
      For s 5B(1)(a), either {{c1::actual}} or {{c2::constructive}} knowledge of the risk will suffice, judged at the
      time of the conduct.
    source: Topic 9 Lecture 1, slides 7, 19
  - type: basic
    concept: not-insignificant-risk-s5b-1b
    front: What did the Civil Liability Act change about the probability of harm?
    back: >-
      It moved the threshold from "not far-fetched and fanciful" (Wyong) to "not insignificant" — a slightly higher
      threshold, from the Ipp Report.
    source: Topic 9 Lecture 1, slide 8
  - type: basic
    concept: not-insignificant-risk-s5b-1b
    front: On what factors does the significance of a risk depend (Rail Corporation NSW v Donald)?
    back: Obviousness, likelihood of occurrence and seriousness of consequence — weighed together.
    source: Topic 9 Lecture 1, slide 22
  - type: basic
    concept: reasonable-response-s5b-1c-and-2
    front: Which case illustrates each s 5B(2) factor?
    back: >-
      (a) probability — RTA v Dederer; (b) seriousness — Paris v Stepney Borough Council; (c) burden — Woods v
      Multi-Sport Holdings; (d) social utility — E v Australian Red Cross Society.
    source: Topic 9 Lecture 2, slides 5–16
  - type: basic
    concept: reasonable-response-s5b-1c-and-2
    front: Why was the employer in breach in Paris v Stepney Borough Council?
    back: >-
      It knew the worker had only one good eye, so he risked a graver injury than his fellows; that known circumstance
      raised its obligation, though goggles were not ordinary practice.
    source: Topic 9 Lecture 2, slides 10–11
  - type: basic
    concept: reasonable-response-s5b-1c-and-2
    front: What does Woods v Multi-Sport Holdings say about the "burden of taking precautions"?
    back: >-
      It is not confined to financial cost: it extends to practical considerations such as the availability of suitable
      equipment, convenience and safety.
    source: Topic 9 Lecture 2, slides 13–14
  - type: basic
    concept: reasonable-response-s5b-1c-and-2
    front: Why was there no breach in E v Australian Red Cross Society?
    back: >-
      Introducing the surrogate test before 1984 might not have reduced the risk of infection but would have meant the
      likely loss of 5% of all blood donations — social utility.
    source: Topic 9 Lecture 2, slide 16
  - type: cloze
    concept: reasonable-response-s5b-1c-and-2
    text: >-
      Section 5C(c): the subsequent taking of action that would have avoided a risk of harm does not of itself give rise
      to or affect liability, and does not of itself constitute an {{c1::admission of liability}}.
    source: Civil Liability Act 2002 (NSW) s 5C; Topic 9 Lecture 1, slide 26
  - type: basic
    concept: reasonable-response-s5b-1c-and-2
    front: Obvious risk versus inherent risk?
    back: >-
      Obvious: a risk that would be obvious to a reasonable person in the plaintiff's position (s 5F). Inherent: a risk
      that cannot be avoided by the exercise of reasonable care and skill (s 5I) — though the duty to warn remains.
    source: Topic 9 Lecture 2, slides 17–21; Civil Liability Act 2002 (NSW) ss 5F, 5I
  - type: apply
    concept: reasonable-response-s5b-1c-and-2
    scenario: >-
      A council fences a dangerous lookout the week after a visitor falls. The visitor says the fencing proves
      negligence.
    answer: 'Not of itself: s 5C(c). The question is what a reasonable council would have done at the time, weighing s 5B(2).'
    source: Civil Liability Act 2002 (NSW) s 5C
  - type: basic
    concept: the-reasonable-person
    front: What standard applies to a child defendant, and why is a child treated differently?
    back: >-
      A normal child of comparable age (McHale v Watson): childhood is a stage of development all humanity passes
      through. Abnormal traits like absent-mindedness are no answer (Kitto J).
    source: Topic 9 Lecture 2, slides 26–27
  - type: basic
    concept: the-reasonable-person
    front: Does mental illness or inexperience lower the standard of care?
    back: >-
      No. Carrier v Bonham: mental condition has no effect — no class standard can be devised. Imbree v McNeilly: a
      learner driver owes the licensed driver's standard.
    source: Topic 9 Lecture 2, slides 28–30
  - type: cloze
    concept: the-reasonable-person
    text: >-
      The reasonable person is a {{c1::legal fiction}} created by judges to apply the {{c2::objective}} test; it first
      appeared in Vaughan v Menlove (1837) as "the man of ordinary {{c3::prudence}}".
    source: Topic 9 Lecture 2, slide 23
  - type: basic
    concept: professional-standard-s5o
    front: What did Rogers v Whitaker decide about the professional standard?
    back: >-
      The standard is that of the ordinary skilled person exercising and professing to have that special skill; the
      Bolam principle (standard set by medical practice) was rejected.
    source: Topic 9 Lecture 2, slide 31
  - type: basic
    concept: professional-standard-s5o
    front: How do s 5O and s 5B fit together (Peterkin v Tadros)?
    back: >-
      s 5O is a defence (onus on the defendant). If pleaded, apply it first: if made out it supplants s 5B — no breach;
      if it fails, the plaintiff must satisfy ss 5B and 5C.
    source: Topic 9 Lecture 2, slides 33–34
  - type: cloze
    concept: professional-standard-s5o
    text: >-
      Under s 5O(1), a professional is not liable if they acted in a manner widely accepted in {{c1::Australia}} by
      {{c2::peer professional opinion}} as competent professional practice — unless that opinion is {{c3::irrational}}
      (s 5O(2)).
    source: Civil Liability Act 2002 (NSW) s 5O; Topic 9 Lecture 2, slide 34
  - type: apply
    concept: professional-standard-s5o
    scenario: A dentist pleads s 5O; the court finds the practice was not widely accepted by peer professional opinion.
    answer: >-
      The defence fails, but that is not the end: the plaintiff must still establish breach under ss 5B and 5C (Peterkin
      v Tadros).
    source: Topic 9 Lecture 2, slide 34
audio:
  title: Week 9 recap — standard of care and breach of duty
  minutes: 3
  script: >-
    This week is breach of duty, the second element of negligence. Once a duty is established, the court measures the
    defendant's conduct against a standard of care, on the balance of probabilities. There are no degrees of
    carelessness: marginally careless and completely reckless are both breach. The duty is to take reasonable care, not
    to prevent harm, so leftover risk is not breach by itself. Swain says so, and so did Gummow J in Dederer. Blyth v
    Birmingham Waterworks gives Alderson B's definition: failing to do what the reasonable man would do, or doing what
    he would not.


    At common law, Wyong Shire Council v Shirt set two limbs: a reasonably foreseeable real risk, and a reasonable
    response. In New South Wales, section 5B of the Civil Liability Act now governs breach, despite its duty of care
    heading, and it presupposes the common law.


    Benic gives the method. Step one, identify the risk of harm, as a class of injury, specific enough to match the
    precautions. In Dederer, the Court of Appeal's "spinal injury from diving off the bridge" obscured the true source,
    shallow water over shifting sands. Step two, the three elements, each separately.


    First, the risk was foreseeable: one the defendant knew or ought to have known of, at the time. Mason J in Wyong
    said foreseeability and likelihood are different things, so even an unlikely risk can be foreseeable if it isn't
    far-fetched or fanciful.


    Second, the risk was not insignificant. That's a deliberate step up from not far-fetched or fanciful, though below a
    substantial risk, as the Ipp Report explains. Rail Corporation v Donald weighs obviousness, likelihood and
    seriousness.


    Third, a reasonable person in the defendant's position would have taken the precautions. Subsection 2 is the
    calculus, weighed together. Probability, judged prospectively, low in Dederer. Seriousness, raised by known
    vulnerability in Paris. Burden, which in Woods included the availability and safety of helmets. Social utility, the
    blood supply in the Red Cross case. Section 5C adds that later fixes and other ways of doing things don't prove
    liability by themselves. Obvious and inherent risks, under sections 5F to 5L, also shape the response.


    Finally, the reasonable person. Children are judged as normal children of their age, McHale v Watson. Mental illness
    doesn't lower the standard, Carrier v Bonham, and neither does inexperience, Imbree. Professionals are judged by
    their skill, Rogers v Whitaker, but section 5O is a defence: apply it first, and only if it fails go to section 5B,
    as Peterkin v Tadros explains.
