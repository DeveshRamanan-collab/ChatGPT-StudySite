  - slug: swain-v-waverley-municipal-council
    name: Swain v Waverley Municipal Council
    citation: (2005) 220 CLR 517
    aglc: Swain v Waverley Municipal Council (2005) 220 CLR 517
    facts: >-
      Not given in this unit's materials: the Topic 9 textbook flowchart cites the case only for the proposition
