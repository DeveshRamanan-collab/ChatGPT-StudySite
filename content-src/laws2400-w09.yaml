  - key: s15
    type: mcq
    concept: standard-of-care-reasonableness
    difficulty: 1
    stem: On what standard of proof must breach of duty be established?
    options:
      - text: Beyond reasonable doubt, because a finding of negligence carries serious consequences
        why: >-
          Tempting because it is the familiar criminal standard, but negligence is a civil claim: breach is proved on
          the balance of probabilities.
      - text: On the balance of probabilities
        correct: true
        why: 'Right: the slides say breach should be established on the balance of probabilities — the civil standard.'
      - text: On the balance of probabilities for (a) and (b), and beyond reasonable doubt for (c)
        why: >-
          Tempting because (c) is evaluative, but there is one civil standard for the whole of breach; nothing changes
          it for (c).
      - text: By clear and convincing evidence, a standard between the civil and criminal ones
        why: >-
          Tempting as a compromise, but Australian civil claims use the balance of probabilities; the slides say so for
