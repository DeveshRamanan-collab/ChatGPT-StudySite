      - text: Blyth v Birmingham Waterworks Co
        why: >-
          Wrong — Blyth is cited for the classic definition of negligence among the general principles, not for "real
          risk".
      - text: Bolton v Stone
        correct: true
        why: >-
          Correct — the flowchart says a risk is arguably not insignificant if it was a "real risk", citing Bolton v
          Stone.
      - text: Swain v Waverley Municipal Council
        why: >-
          Tempting because Swain is cited twice on the flowchart, but for reasonable care and the fact-value complex,
