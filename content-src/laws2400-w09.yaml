    issue: Not stated in the materials; cited on the standard of care and on reasonable foreseeability at the breach stage.
    held: Not stated in the materials. The flowchart cites the judgments of Gleeson CJ at 520 [5] and McHugh J at 547 [79].
    ratio: >-
      As cited in the flowchart: the duty is only a duty to take reasonable care, not an absolute duty to avoid injury,
