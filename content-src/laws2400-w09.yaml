  - slug: blyth-v-birmingham-waterworks-co
    name: Blyth v Birmingham Waterworks Co
    citation: '[1856] 56 ER 1047'
    aglc: Blyth v Birmingham Waterworks Co [1856] 56 ER 1047
    facts: >-
      Not given in this unit's materials: the Topic 9 textbook flowchart cites the case only for the proposition
      recorded below.
    issue: Not stated in the materials; cited for the classic definition of negligence.
    held: Not stated in the materials.
    ratio: >-
      Alderson B (as quoted in the Topic 9 slides): "Negligence is the omission to do something which a reasonable man …
      would do, or doing something which a prudent and reasonable man would not do." The flowchart quotes the fuller
      version ("guided upon those considerations which ordinarily regulate the conduct of human affairs") and attributes
      it to "Anderson".
