      - text: The same standard as a licensed driver
        correct: true
        why: 'Right: Imbree v McNeilly [2008] HCA 40 — the standard is objective and impersonal.'
      - text: The standard of the supervising licensed driver sitting beside them
        why: >-
          Tempting because learners are supervised, but the learner is held to the ordinary driver's standard in their
