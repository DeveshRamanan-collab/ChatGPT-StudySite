      - text: The burden of taking precautions to avoid the risk of harm.
        correct: true
        why: >-
          Correct — s 5B(2)(c): "the burden of taking precautions to avoid the risk of harm" is one consideration for
          the response question.
      - text: The burden the harm places on the plaintiff and the plaintiff's family.
        why: >-
          Wrong — the impact of harm is closer to s 5B(2)(b), the likely seriousness of the harm; (c) is about the cost
          of precautions.
  - key: p05
    type: mcq
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 2
    stem: Which question does s 5B(2) help the court answer?
    options:
