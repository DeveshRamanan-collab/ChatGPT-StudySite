    contrasts-with:
      - foreseeable-risk-s5b-1a
    cases:
      - rta-v-dederer
      - paris-v-stepney-borough-council
      - woods-v-multi-sport-holdings
      - e-v-australian-red-cross-society
      - romeo-v-conservation-commission-nt
      - rta-v-refrigerated-roadways
    authorities:
      - civil-liability-act-2002-nsw-s5b
      - civil-liability-act-2002-nsw-s5c
      - civil-liability-act-2002-nsw-s49
      - civil-liability-act-2002-nsw-s5f
      - civil-liability-act-2002-nsw-s5g
      - civil-liability-act-2002-nsw-s5h
      - civil-liability-act-2002-nsw-s5i
      - civil-liability-act-2002-nsw-s5l
    verify: false
    body: >-
      The second breach question is whether the defendant's **response** to the risk was reasonable — the standard of

      care implicit in s 5B(1)(c): a person is not negligent unless, in the circumstances, a reasonable person in the
      person's

      position would have taken those precautions.


      Section 5B(2) codifies the "calculus of negligence": the court is to consider (amongst other relevant things) —


      - (a) **probability** that the harm would occur if care were not taken — judged prospectively; low in *RTA v
      Dederer*,
        where warning signs were a reasonable response;
      - (b) likely **seriousness** of the harm — the standard rises with seriousness and known vulnerability (*Paris v
      Stepney
        Borough Council*: goggles for a one-eyed worker); intoxication does not affect it (s 49(1));
      - (c) the **burden** of precautions — cost and practical matters such as availability and convenience (*Woods v
        Multi-Sport Holdings*: no indoor-cricket helmets);
      - (d) the **social utility** of the activity (*E v Australian Red Cross Society*: testing would have cost 5% of
      blood
        donations).

      The factors are weighed together, not ticked off (*Romeo*; *Refrigerated Roadways*). Section 5C adds: the burden
      includes similar risks; that

      a risk could have been avoided another way, or later action, does not of itself establish liability. Obvious and

      inherent risks (ss 5F–5I, 5L) also shape the response.


      Exam use: name the precaution the plaintiff says should have been taken, weigh (a)–(d) on the facts with a case
      for

      each, then conclude on (c).
  - slug: identifying-the-risk-of-harm
    title: 'Benic step 1: identifying the risk of harm'
    visual: simulation
    visual-brief: >-
      A risk-framing tester on the Dederer bridge: choose how the risk is described (too broad — "serious spinal injury
      from diving off the bridge"; a class of injury tied to its source — "impact on jumping into shallow water over
      shifting sands"; too narrow — "the exact injury Dederer suffered") and watch whether the precautions in issue line
      up with the risk, before Benic step 2 opens the three s 5B(1) gates.
    related:
      - breach-of-duty-flowchart
      - foreseeable-risk-s5b-1a
      - reasonable-response-s5b-1c-and-2
    depends-on:
      - breach-of-duty-flowchart
    contrasts-with:
      - laws2400-w05-reasonable-foreseeability-meaning
    cases:
      - benic-v-nsw
      - rta-v-dederer
    authorities:
      - civil-liability-act-2002-nsw-s5b
    verify: false
    body: >-
      You cannot think about "precautions against a risk of harm" (s 5B(1)) until you know what the risk of harm is.
      Garling J

      in *Benic v NSW* [2010] NSWSC 1039 laid down steps for the breach question under the Act:


      1. **Identify a risk of harm.** It is sufficient "if the risk of harm is described as a class of injury, as
      distinct
         from the particular injury actually suffered by the plaintiff".
      2. **Consider the three elements** in s 5B(1) — foreseeability, probability and reasonableness of precautions —
      each
         separately addressed.

      *Roads and Traffic Authority of NSW v Dederer* (2007) 234 CLR 330 shows why step 1 matters. A 14-year-old dived
      off a

      bridge into an estuary with a shifting sandbar and suffered partial paraplegia. The Court of Appeal described the
      risk as a "serious spinal injury flowing from the act of diving off the bridge". Gummow J

      said that characterisation "obscured the true source of potential injury": impact on jumping into potentially
      shallow

      water and shifting sands [60]. The High Court (3:2) found no breach: the existing signs were a reasonable
      response.


      The rule: be specific enough that the risk corresponds to the type of precautions that should have been taken. You

      cannot formulate the risk so broadly that it encompasses fundamentally different scenarios requiring fundamentally

      different responses.


      Exam use: open every breach answer with one sentence naming the risk of harm and its source on the facts.
  - slug: the-reasonable-person
    title: 'Unpacking the reasonable person: age, mental illness and inexperience'
    visual: simulation
    visual-brief: >-
      A standard selector: choose who the defendant is (a 12-year-old; an adult who is abnormally slow-witted or
      absent-minded; a person with a mental illness; a learner driver; a professional) and watch which yardstick the
      court measures them against — a normal child of comparable age, or the unchanged reasonable person — with the case
      and the reason (a stage of development all humanity passes through, or no workable class standard).
    related:
      - standard-of-care-reasonableness
      - professional-standard-s5o
    depends-on:
      - standard-of-care-reasonableness
    contrasts-with:
      - professional-standard-s5o
    cases:
      - vaughan-v-menlove
      - mchale-v-watson
      - carrier-v-bonham
      - imbree-v-mcneilly
    authorities:
      - civil-liability-act-2002-nsw-s5b
    verify: false
    body: >-
      Section 5B(1)(c) measures the defendant against "a reasonable person in the person's position". The reasonable

      person is a legal fiction created by judges to apply the objective test, because there are too many subjective

      variables. It first appeared in *Vaughan v Menlove* (1837) as "the man of ordinary prudence". Feminist scholars
      have

      criticised the older "reasonable man" as built on male attributes by a predominantly male judiciary.


      The construct is not completely devoid of particular characteristics:


      - **Age counts.** *McHale v Watson* (1966) 115 CLR 199: a 12-year-old who threw a sharpened piece of scrap metal
      at a
        tree is judged by the standard of a normal child of comparable age. Kitto J: it is no answer to be abnormally
        slow-witted, quick-tempered, absent-minded or inexperienced — but a child may rely on a limitation of foresight or
        prudence characteristic of humanity at his stage of development.
      - **Mental illness does not.** *Carrier v Bonham* [2002] 1 Qd R 474: the defendant's mental condition had no
      effect on
        the standard expected: unsoundness of mind is not a stage of development through which all humanity passes.
      - **Inexperience does not.** A learner driver owes the same standard as a licensed driver: *Imbree v McNeilly*
      [2008]
        HCA 40. The standard is objective and impersonal.
      - **Professional skill raises it** (s 5O).


      Exam use: for a child defendant apply the comparable-age standard; for any other personal trait, the reasonable
      person

      does not change.
  - slug: professional-standard-s5o
    title: 'Professionals: Rogers v Whitaker, s 5O and the order with s 5B'
    visual: simulation
    visual-brief: >-
      A two-route decision flow for a professional defendant: toggle whether s 5O is pleaded, whether the defendant was
      practising a profession, whether the practice was widely accepted in Australia by peer professional opinion as
      competent, and whether the court finds that opinion irrational; the path either ends at "no breach — s 5O
      supplants s 5B" or drops through to the ordinary s 5B and 5C analysis (Peterkin v Tadros).
    related:
      - the-reasonable-person
      - reasonable-response-s5b-1c-and-2
    depends-on:
      - the-reasonable-person
      - breach-of-duty-flowchart
    contrasts-with:
      - the-reasonable-person
    cases:
      - rogers-v-whitaker
      - peterkin-v-tadros
    authorities:
      - civil-liability-act-2002-nsw-s5o
      - civil-liability-act-2002-nsw-s5b
    verify: false
    body: >-
      For professionals, special skill is taken into account. In *Rogers v Whitaker* (1992) 175 CLR 479 an eye surgeon
      failed to warn of a complication arising in one

      in 14,000 cases. The High Court held the standard "is that of ordinary skilled person exercising and professing to
      have

      that special skill", and rejected the *Bolam* principle — that the standard is set by medical practice.


      Section 5O of the Civil Liability Act incorporates a modified version of *Bolam*. A professional does not incur a

      liability in negligence arising from a professional service if it is established that they acted in a manner that,
      at

      the time, was widely accepted in Australia by peer professional opinion as competent professional practice —
      unless the

      court considers that opinion irrational (s 5O(2)). Wide acceptance need not be universal (s 5O(4)).


      Do we use s 5B, s 5O or both? *Peterkin v Tadros* [2026] NSWSC 1185 [151]–[154]: **s 5O is a defence.**


      1. The defendant bears the onus of its preconditions: practising in a profession, in a manner widely accepted in
         Australia by peer professional opinion as competent professional practice.
      2. Where s 5O is pleaded, apply it first. If it is made out, it supplants the s 5B analysis: no breach.

      3. If the s 5O defence fails, the plaintiff must still satisfy ss 5B and 5C.


      Exam use: for a professional defendant, run s 5O first (onus on the defendant), then s 5B only if s 5O fails.
