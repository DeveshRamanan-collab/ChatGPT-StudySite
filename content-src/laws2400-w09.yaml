      - text: When it is widely but not universally accepted
        why: Tempting because "universal" sounds safer, but s 5O(4) says wide acceptance need not be universal.
      - text: When the court considers the opinion irrational
        correct: true
        why: >-
          Right: s 5O(2) — peer professional opinion cannot be relied on if the court considers that the opinion is
