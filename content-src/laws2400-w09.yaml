      - text: 'Nothing: once the standard is objective, age is irrelevant'
        why: >-
          Tempting because Kitto J stressed objectivity, but he went on to say a child may rely on age-typical
          limitations.
  - key: m05
    type: mcq
    concept: the-reasonable-person
    difficulty: 2
    stem: What did the Queensland Court of Appeal decide in Carrier v Bonham?
    options:
      - text: The defendant's mental condition had no effect on the standard of care expected
        correct: true
        why: >-
          Right: Bonham's schizophrenia did not lower the standard; McPherson JA said no class standard could be
          devised.
      - text: The defendant was judged by the standard of a reasonable person with schizophrenia
        why: Tempting by analogy with McHale's child standard, but the court refused a special standard for mental illness.
      - text: A person with a mental illness cannot owe a duty of care at all
        why: Tempting because capacity matters elsewhere, but the case is about the standard of care, which was unchanged.
      - text: The bus driver breached his duty by failing to anticipate the jump
        why: >-
          Tempting because Carrier was driving, but Carrier was the plaintiff here: the issue was Bonham's standard of
          care.
  - key: m06
    type: mcq
    concept: the-reasonable-person
    difficulty: 3
    stem: Why is age treated differently from mental illness in setting the standard of care?
    options:
      - text: >-
          Childhood is a stage all humanity passes through; unsoundness of mind is not, so it has no "normal" class
          standard
        correct: true
        why: 'Right: McPherson JA in Carrier v Bonham drew exactly this distinction from Kitto J''s reasoning in McHale.'
      - text: There are more children than people with mental illness, so a special standard is more efficient
        why: >-
          Tempting as a policy reason, but the courts' reason is that a stage of development has a normal standard;
          mental illness does not.
      - text: Mental illness is assumed to be self-induced, whereas age is not
        why: >-
          Tempting as a moral distinction, but nothing in the materials says so; the reason is the impossibility of a
          class standard.
      - text: The Civil Liability Act expressly lowers the standard for children only
        why: >-
          Tempting because the Act modifies much of negligence, but McHale is a common law rule; the Act does not set
