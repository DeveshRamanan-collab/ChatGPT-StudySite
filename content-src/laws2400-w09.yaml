      A standard line with the defendant's conduct as a marker: set the conduct above, just below or far below the line,
      toggle "did their personal best" and "some risk remained", and watch the verdict — any shortfall is breach,
      however small; personal best and leftover risk do not change it.
    related:
      - breach-of-duty-flowchart
      - the-reasonable-person
    depends-on:
      - laws2400-w05-negligence-elements-overview
    contrasts-with:
      - reasonable-response-s5b-1c-and-2
    cases:
      - swain-v-waverley-municipal-council
      - blyth-v-birmingham-waterworks-co
      - rta-v-dederer
    authorities: []
    verify: false
    body: >-
      To decide whether a duty of care has been breached, the court measures the defendant's conduct against a

      standard of care, on the balance of probabilities. There are no degrees of carelessness: the defendant is liable

      whether her conduct was marginally careless or completely reckless.


      The duty is only a duty to take **reasonable** care, not an absolute duty to avoid injury: the measure is

      reasonableness, not elimination of risk (*Swain v Waverley Municipal Council* (2005) 220 CLR 517, 520 [5]). An

      obligation to exercise reasonable care must be contrasted with an obligation to prevent harm (*Dederer*, Gummow
      J).


      Courts apply the test of a **reasonable person**, an objective standard. A defendant may therefore be in breach
      even

      though they did their personal best, if their personal best was not reasonable.


      The classic statement is Alderson B's in *Blyth v Birmingham Waterworks Co* (1856): negligence is the omission to
      do

      something which a reasonable man would do, or doing something which a prudent and reasonable man would not do. So

      negligence can lie in an omission or in a positive act. (*Donoghue v Stevenson* later established negligence as a

      separate cause of action.)


      Exam use: never argue that the defendant "tried their hardest" or that "the risk was not eliminated" — compare the

      conduct with what a reasonable person would have done.
  - slug: foreseeable-risk-s5b-1a
    title: 'Question 1(a): was the risk foreseeable?'
    visual: simulation
    visual-brief: >-
      A foreseeability tester for s 5B(1)(a): set what the defendant knew and how remote the risk was, and toggle the
      unforeseen manner, the unforeseen particular injury and the plaintiff's foolhardiness; the verdict shows that only
      a far-fetched or fanciful risk fails, and each change names the principle that answers it.
    related:
      - breach-of-duty-flowchart
      - not-insignificant-risk-s5b-1b
      - identifying-the-risk-of-harm
    depends-on:
      - laws2400-w05-reasonable-foreseeability-meaning
    contrasts-with:
      - laws2400-w05-reasonable-foreseeability-meaning
      - not-insignificant-risk-s5b-1b
    cases:
      - wyong-shire-council-v-shirt
      - swain-v-waverley-municipal-council
      - nagle-v-rottnest-island-board
      - mclean-v-tedman
      - chapman-v-hearse
    authorities:
      - civil-liability-act-2002-nsw-s5b
    verify: false
    body: >-
      Section 5B(1)(a): a person is not negligent in failing to take precautions against a risk of harm unless the

      risk was foreseeable — "a risk of which the person knew or ought to have known". Actual or constructive knowledge

      suffices, judged at the time of the conduct, not with hindsight.


      It corresponds to the first limb of the common law test, but the inquiry differs from the duty stage: it examines
      the

      defendant's **actual conduct** and the actual risk of injury in the circumstances — a **more specific test**.


      *Wyong Shire Council v Shirt* (1980) 146 CLR 40 (a water skier misled by an ambiguous "deep water" sign) remains
      good

      authority: a risk which is not far-fetched or fanciful is real and therefore foreseeable. Mason J: foreseeability
      of the

      risk and the likelihood of it occurring are two different things — a risk quite unlikely to occur may nevertheless
      be

      plainly foreseeable.


      The plaintiff need not show that the precise manner of the injury, or the particular injury, was foreseeable —
      only a

      reasonably foreseeable risk of injury of some kind to someone such as the plaintiff. The defendant must also guard

      against inadvertent, negligent or even extremely foolhardy conduct by the plaintiff: *Nagle v Rottnest Island
      Board*

      (1993) 177 CLR 423; *McLean v Tedman* (1984) 155 CR 306.


      Exam use: say what the defendant knew or ought to have known, then ask whether the risk was far-fetched or
      fanciful —

      leaving likelihood for (b) and (c).
  - slug: not-insignificant-risk-s5b-1b
    title: 'Question 1(b): a risk that is not insignificant'
    visual: simulation
    visual-brief: >-
      Three s 5B(1) gates in a row — (a) foreseeable, (b) not insignificant, (c) reasonable precautions — joined by
      "and", with a probability scale under gate (b) running from insignificant through "not far-fetched or fanciful"
      (the common law threshold) to "not insignificant" (the Act, a little higher) and "substantial": set where the risk
      sits and the Donald factors, and the path stops at the first gate that fails.
    related:
      - breach-of-duty-flowchart
      - foreseeable-risk-s5b-1a
      - reasonable-response-s5b-1c-and-2
    depends-on:
      - foreseeable-risk-s5b-1a
    contrasts-with:
      - foreseeable-risk-s5b-1a
    cases:
      - bolton-v-stone
      - wyong-shire-council-v-shirt
      - rail-corporation-nsw-v-donald
    authorities:
      - civil-liability-act-2002-nsw-s5b
    verify: false
    body: >-
      Section 5B(1)(b) adds a second requirement, joined to (a) by "and": the risk was not insignificant. It reflects

      the **probability** of the risk materialising, and may not be satisfied if there was a very low probability of
      injury.


      The Act deliberately changed the common law. *Wyong*'s threshold was "not far-fetched or fanciful"; the Act
      modified

      the probability of harm to "not insignificant". The Ipp Report explains the double negative: "not insignificant"

      indicates a risk "of a higher probability than is indicated by the phrase 'not far fetched and fanciful', but not
      so high

      as might be indicated by a phrase such as 'a substantial risk'". So a risk that is merely not far-fetched —
      foreseeable

      under (a) — is not automatically not insignificant.


      How significant is a risk? *Rail Corporation NSW v Donald* [2018] NSWCA 82: it depends on factors such as

      **obviousness**, **likelihood of occurrence** and **seriousness of consequence**, weighed together.


      The textbook flowchart says the provision's meaning is not yet completely clear, and offers as arguable markers a
      "real

      risk" (*Bolton v Stone*) that is not far-fetched or fanciful (*Wyong*). The slides place those words at the common
      law

      threshold, so use them only as a starting point.


      Paragraphs (a) and (b) together answer the first breach question: the degree of foreseeable risk.


      Exam use: once (a) is established, give (b) its own sentence — place the risk on the scale and weigh obviousness,

      likelihood and seriousness before moving to (c).
  - slug: reasonable-response-s5b-1c-and-2
    title: 'Question 2: the reasonable response — s 5B(1)(c) and (2)'
    visual: palace
    visual-brief: >-
      A five-frame corridor in statutory order: s 5B(1)(c), the question (would a reasonable person in the defendant's
      position have taken those precautions?), then the four s 5B(2) considerations — probability, seriousness, burden,
      social utility — one frame each.
    related:
      - breach-of-duty-flowchart
      - not-insignificant-risk-s5b-1b
      - the-reasonable-person
      - identifying-the-risk-of-harm
    depends-on:
