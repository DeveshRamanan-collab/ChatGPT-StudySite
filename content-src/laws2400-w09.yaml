      - text: She owes no duty of care while unwell
        why: Tempting as a capacity argument, but the issue is the standard of care, which stays the same.
      - text: Her standard is that of a learner driver
        why: Tempting because learners are a special case, but learners owe the ordinary standard too; neither lowers it.
  - key: m12
    type: mcq
