        why: >-
          Tempting because the considerations mention probability, but knowledge of the risk is s 5B(1)(a), the first
          breach question.
      - text: Whether a duty of care is owed to this plaintiff at all.
        why: 'Wrong — s 5B(2) assumes a duty and concerns breach: what a reasonable person would have done about the risk.'
      - text: Whether the breach caused the plaintiff's harm.
        why: Wrong — causation is a separate element; s 5B(2) is about whether precautions should have been taken.
      - text: Whether a reasonable person would have taken precautions against a risk of harm.
        correct: true
        why: >-
          Correct — s 5B(2) opens: "In determining whether a reasonable person would have taken precautions against a
          risk of harm …".
  - key: p06
    type: mcq
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 2
    stem: >-
      A council could have fenced a cliff-top lookout, but the fence would be very expensive and would take months to
      build. Which s 5B(2) consideration does this go to?
    options:
      - text: (a) the probability that the harm would occur if care were not taken
        why: >-
          Wrong — the cost and time of a fence say nothing about how likely a fall is; they go to the burden of the
          precaution.
      - text: (b) the likely seriousness of the harm
        why: >-
          Wrong — seriousness concerns how bad the harm would be (for example, a fatal fall), not what the precaution
          costs.
      - text: (c) the burden of taking precautions to avoid the risk of harm
        correct: true
        why: Correct — the expense and delay of fencing are the burden of taking precautions to avoid the risk of harm.
      - text: (d) the social utility of the activity that creates the risk of harm
        why: >-
          Tempting because the lookout is a public facility, but these facts are about the cost of the precaution, not
          the value of the activity.
  - key: p07
