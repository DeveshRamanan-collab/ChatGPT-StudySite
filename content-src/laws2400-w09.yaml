  - key: p01
    type: mcq
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 1
    set: pretest
    stem: Which of these is NOT one of the considerations listed in s 5B(2)?
    options:
      - text: Whether the defendant did its personal best
        correct: true
        why: >-
          Correct — personal best is not a s 5B(2) consideration, and the flowchart says personal best is no answer if
          it was not reasonable.
      - text: The probability that the harm would occur if care were not taken
        why: >-
          Wrong choice — this is s 5B(2)(a), the first consideration the court is to take into account under the
          response question.
      - text: The likely seriousness of the harm
        why: >-
          Wrong choice — this is s 5B(2)(b); the court is to consider it when deciding whether a reasonable person would
          have taken precautions.
      - text: The social utility of the activity that creates the risk of harm
        why: >-
          Wrong choice — this is s 5B(2)(d), the fourth listed consideration in deciding what a reasonable person would
          have done.
  - key: p02
    type: mcq
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 1
    stem: Under s 5B(1)(c), whose response sets the standard for the precautions that should have been taken?
    options:
      - text: The defendant's, judged by what it honestly believed was enough at the time.
        why: >-
          Tempting because the provision speaks of "the person's position", but the yardstick is a reasonable person in
          that position, not the defendant's belief.
      - text: A reasonable person in the person's position, in the circumstances.
        correct: true
        why: >-
          Correct — s 5B(1)(c): "in the circumstances, a reasonable person in the person's position would have taken
          those precautions".
      - text: The plaintiff's, judged by what they expected the defendant to do.
        why: >-
          Wrong — the plaintiff's expectations are not the test; s 5B(1)(c) asks what a reasonable person in the
          defendant's position would have done.
      - text: An expert who could have eliminated the risk entirely.
        why: >-
          Wrong — the measure is reasonableness, not elimination of risk, and the yardstick is a reasonable person in
          the defendant's position.
  - key: p03
    type: mcq
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 2
    stem: Is the list of considerations in s 5B(2) exhaustive?
    options:
      - text: No — the court considers them "amongst other relevant things".
        correct: true
        why: >-
          Correct — s 5B(2) says the court is to consider the listed matters "amongst other relevant things", so other
          relevant matters can count.
      - text: Yes — the court may consider only the four listed matters and nothing else.
        why: >-
          Tempting because the list is lettered and precise, but the words "amongst other relevant things" show it is
          not exhaustive.
      - text: No — and the court may leave any of the four out if it thinks fit.
        why: >-
          Wrong — s 5B(2) says the court "is to consider" the listed matters; the list is open, but the four are not
          optional.
      - text: Yes, unless the defendant is a public authority.
        why: >-
          Wrong — nothing in s 5B(2) creates a special rule for public authorities; the list is open-ended for every
          defendant.
  - key: p04
    type: mcq
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 2
    stem: What does the court consider under s 5B(2)(c)?
    options:
