  - key: o18
    type: truefalse
    concept: professional-standard-s5o
    difficulty: 1
    statement: Peer professional opinion does not have to be universally accepted to be considered widely accepted.
    answer: true
    why: 'True: that is s 5O(4), which Peterkin v Tadros applied when the parties'' experts disagreed.'
  - key: o19
    type: mcq
    concept: professional-standard-s5o
    difficulty: 3
    variant-of: o10
    stem: A physiotherapist pleads s 5O, but the court finds the peer opinion relied on irrational. What follows?
    options:
      - text: The physiotherapist is liable without any further inquiry
        why: Tempting because the defence failed, but the plaintiff must still establish breach under ss 5B and 5C.
      - text: The opinion cannot be relied on, so s 5O fails and ss 5B and 5C apply
        correct: true
        why: 'Right: s 5O(2) bars reliance on irrational opinion; with the preconditions unmet, ss 5B and 5C are applied.'
      - text: The court substitutes the plaintiff's expert's opinion under s 5O
        why: >-
          Tempting because the opinions compete, but s 5O does not let the court swap in the plaintiff's expert; it
          falls back to s 5B.
      - text: The physiotherapist must now prove that the risk was an inherent risk under s 5I
        why: Tempting because s 5I is another protection, but nothing makes it the next step; ss 5B and 5C apply.
  - key: sa7
    type: short
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 4
    prompt: >-
      Ariel went to the local aquatic centre to celebrate her 9th birthday. The centre has an exciting waterslide that
      is high in the air and loops around several times before the riders pop out into the exit pool at the bottom. The
      waterslide tube is fully enclosed, so once you step up into the entry port, you can't see anything other than the
      dark tube in front of you. Industry standards for water parks say that a staff member must stand at the top of the
      slide and only allow riders onto the slide once the previous rider has left the exit pool at the bottom. This is
      to prevent against the risk that if one rider enters the slide before the previous rider has left the exit pool at
      the bottom, the two riders may collide and cause injury.


      Medusa is a 16-year-old staff member who works at the aquatic centre. Medusa's job is to stand at the top of the
      slide and watch for the riders to exit the slide, and to ensure the next rider doesn't enter the slide until it is
      safe in accordance with the industry standards. There was a sign on the ride that said, 'All riders must only
      enter the slide once staff tells them it is safe to do so, otherwise you may collide with the previous rider and
      injury could occur'. Ariel waited in line patiently for her turn on the slide and when it was her turn, she sat
      down at the entry to the slide and waited for directions. Medusa eventually said to Ariel, 'it is safe to go now',
      so Ariel pushed off into the slide.


      Medusa hadn't been watching properly. There was another rider still in the slide and Ariel hit the other rider
      headfirst and several of her teeth fell out, requiring several painful and costly surgeries and implants.


      Ariel sues the aquatic centre for negligence. Focusing on the principles discussed in this week's material, how
      would the court assess whether there has been a breach of duty? It is not necessary to consider in detail how the
      court would deal with any defences that arise in the CLA in relation to this potentially being a case of an
      obvious risk or a recreational activity (as we will learn about them further in a few weeks).
    model: >-
      The issue is whether the centre breached its duty to Ariel under the Civil Liability Act 2002 (NSW) s 5B. Benic
      step 1: the risk of harm is collision injury when a rider enters the enclosed slide before the previous rider has
      left the exit pool. Section 5B(1)(a): the centre knew or ought to have known of it; its own sign and the industry
      standard describe it. Section 5B(1)(b): it is not insignificant — above not far-fetched (Ipp Report); it is
      obvious, likely whenever riders are sent early, and serious (Rail Corporation NSW v Donald). Section 5B(1)(c),
      weighing s 5B(2): collision is probable if no one watches; head-first impact in a dark tube risks serious harm,
      and the standard rises with seriousness (Paris); the burden — a staff member who actually watches — is slight and
      already part of the job, unlike the unavailable helmets in Woods; and the precaution leaves the ride's utility
      intact. The industry standard is information a court may consider, not the legal test, but it confirms the
      precaution. Medusa sent Ariel without watching, so the centre fell below what a reasonable operator would do.
      Conclusion: breach is likely.
    rubric:
      - id: r1
        criterion: Identifies the risk of harm (Benic step 1)
        marks: 2
        top-band: >-
          Frames the risk as a class of injury tied to its source — collision from early entry — and links it to the
          precaution in issue.
        margin-note: 'Name the risk, not the lost teeth: Benic wants a class of injury.'
        authorities:
          - civil-liability-act-2002-nsw-s5b
      - id: r2
        criterion: Applies s 5B(1)(a) and (b)
        marks: 2
        top-band: >-
          Uses the sign and industry standard for knowledge, and weighs obviousness, likelihood and seriousness against
          the higher (b) threshold.
        margin-note: Good that (b) gets its own sentence — say why it clears "not insignificant".
        authorities:
          - civil-liability-act-2002-nsw-s5b
      - id: r3
        criterion: Applies s 5B(1)(c) with the s 5B(2) calculus and cases
        marks: 3
        top-band: >-
          Weighs probability, seriousness, burden and utility on the facts, with a case for at least two factors, and
          treats them as a whole.
        margin-note: 'Weigh, do not tick: show why the cheap precaution outweighs nothing on the other side.'
        authorities:
          - civil-liability-act-2002-nsw-s5b
      - id: r4
        criterion: Uses the industry standard correctly and concludes
        marks: 1
        top-band: >-
          Treats the standard as evidence of reasonableness, not the legal test, and reaches a clear conclusion on
          breach.
        margin-note: 'Ariel sues the centre: ask what a reasonable operator would have done. Defences are for a later week.'
        authorities:
          - civil-liability-act-2002-nsw-s5b
  - key: sa8
    type: short
    concept: identifying-the-risk-of-harm
    difficulty: 2
    prompt: >-
      Q1: Garling J in Benic v NSW [2010] NSWSC 1039 usefully laid down steps to be followed in determining the breach
      question under the CLA. His Honour explained an initial step must be taken before going to the CLA provision on
      breach (s5B). Explain the initial step.
    model: >-
      The initial step is to identify the risk of harm. Section 5B(1) asks whether a person was negligent "in failing to
      take precautions against a risk of harm", and you cannot assess precautions until you know what the risk is.
      Garling J said it is sufficient "if the risk of harm is described as a class of injury, as distinct from the
      particular injury actually suffered by the plaintiff". So the risk need not be the precise injury, but it must be
      specific enough to correspond to the type of precautions that should have been taken; it cannot be formulated so
      broadly that it encompasses fundamentally different scenarios requiring fundamentally different responses. RTA v
      Dederer shows the stakes: the Court of Appeal described the risk as "serious spinal injury flowing from the act of
      diving off the bridge", and Gummow J held that this obscured the true source of potential injury — impact upon
      jumping into potentially shallow water and shifting sands. Only after step 1 does step 2 follow: the three s 5B(1)
      elements — foreseeability, probability and reasonableness of precautions — each separately addressed.
    rubric:
      - id: r1
        criterion: 'States the initial step: identify the risk of harm'
        marks: 2
        top-band: Names the step and ties it to the s 5B(1) words "precautions against a risk of harm".
        margin-note: Say why it must come first — the precautions depend on it.
        authorities:
          - civil-liability-act-2002-nsw-s5b
      - id: r2
        criterion: 'Explains the level of generality: a class of injury'
        marks: 2
        top-band: 'Quotes or closely paraphrases Garling J: a class of injury, as distinct from the particular injury suffered.'
        margin-note: Class of injury, not the particular injury — the key phrase.
        authorities: []
      - id: r3
        criterion: Uses Dederer to show the danger of framing too broadly
        marks: 2
        top-band: >-
          Explains the Court of Appeal's framing, why Gummow J rejected it, and the rule about matching risk to
          precautions.
        margin-note: Dederer is the illustration the lecture used — make the contrast explicit.
        authorities: []
      - id: r4
        criterion: Places the step within the Benic method
        marks: 2
        top-band: 'Moves to step 2: the three elements of s 5B(1), each separately addressed.'
        margin-note: Finish by showing where step 2 picks up.
        authorities:
          - civil-liability-act-2002-nsw-s5b
  - key: sa9
    type: short
    concept: the-reasonable-person
    difficulty: 3
    prompt: >-
      Jai, aged 12, throws a sharpened stick at a target on a tree during a backyard game; it glances off and strikes
      his friend Ivy in the eye. Jai is known to be unusually absent-minded for his age. Jai's mother, Ruth, holds only
      a learner's permit; driving Ivy to hospital, she brakes late and hits a pedestrian. Ruth argues she should be
      judged as the inexperienced driver she is. Explain the standard of care against which Jai and Ruth will each be
      measured.
    model: >-
      Breach is measured against the reasonable person, a legal fiction judges use to apply an objective test. It is not
      completely devoid of particular characteristics, but only some characteristics count. Jai: under McHale v Watson,
      whose facts are close to these, the standard for a child is that of a normal child of comparable age — here, a
      normal 12-year-old. But Kitto J said it is no answer to say the harm was due to being abnormally slow-witted,
      quick-tempered, absent-minded or inexperienced; a child may rely only on limits of foresight or prudence
      characteristic of humanity at his stage of development. Jai's unusual absent-mindedness is therefore ignored: the
      question is whether a normal 12-year-old would have thrown a sharpened stick near a friend. Ruth: inexperience
      does not lower the standard. A learner driver owes the same standard as a licensed driver (Imbree v McNeilly); the
      standard is objective and impersonal, and varying it with experience would be unworkable. Age is different because
      childhood is a stage all humanity passes through — the reason Carrier v Bonham refused to adjust the standard for
      mental illness. Conclusion: Jai is judged as a normal 12-year-old; Ruth as any reasonable driver.
    rubric:
      - id: r1
        criterion: States the objective reasonable person standard
        marks: 1
        top-band: Explains the reasonable person as a legal fiction for an objective test that admits only some characteristics.
        margin-note: Set up the rule before the two defendants.
        authorities:
          - civil-liability-act-2002-nsw-s5b
      - id: r2
        criterion: Applies McHale to Jai, excluding his absent-mindedness
        marks: 3
        top-band: >-
          Applies the comparable-age standard and uses Kitto J to exclude the abnormal trait, then applies it to the
          facts.
        margin-note: Age counts; absent-mindedness does not — Kitto J says so in terms.
        authorities: []
      - id: r3
        criterion: Applies Imbree to Ruth
        marks: 2
        top-band: >-
          States that a learner owes the licensed driver's standard, with the reason (objective, impersonal, unworkable
          otherwise).
        margin-note: Inexperience is no answer — give the reason, not just the rule.
        authorities: []
      - id: r4
        criterion: Explains why age differs from other traits and concludes
        marks: 2
        top-band: Uses the stage-of-development reasoning (McHale; Carrier v Bonham) and concludes for both.
        margin-note: The why is what separates a top answer here.
        authorities: []
  - key: sa10
    type: short
    concept: professional-standard-s5o
    difficulty: 3
    prompt: >-
      Dr Hale, a GP, prescribes a medication without first ordering a blood test, and her patient suffers a serious
      reaction. The patient sues. Dr Hale pleads s 5O of the Civil Liability Act 2002 (NSW) and calls two GPs who say
      that prescribing without the test was widely accepted in Australia as competent practice; the patient's expert
      says it was not. Advise how the court will approach whether Dr Hale breached her duty.
    model: >-
      At common law, Rogers v Whitaker set the professional standard as that of the ordinary skilled person exercising
      and professing to have that special skill, rejecting the Bolam principle. Section 5O now incorporates a modified
      Bolam principle, and Peterkin v Tadros explains how it works with s 5B. Section 5O operates as a defence — a
      complete answer to the claim — so Dr Hale bears the onus of establishing its preconditions: that she was
      practising in a profession, and that she acted in a manner that, at the time, was widely accepted in Australia by
      peer professional opinion as competent professional practice. Because she pleads it, the court applies s 5O first.
      The patient's expert disagreeing is no obstacle: opinion need only be widely, not universally, accepted (s 5O(4)).
      The opinion cannot be relied on, however, if the court considers it irrational (s 5O(2)). If s 5O is made out, it
      supplants the s 5B analysis and there is no breach (Gould). If it fails, the patient must still establish breach
      under ss 5B and 5C. Conclusion: likely no breach if the GPs' evidence shows wide acceptance and is rational.
    rubric:
      - id: r1
        criterion: Identifies s 5O as a defence with the onus on the defendant
        marks: 2
        top-band: States that s 5O is a defence, that Dr Hale bears the onus, and names both preconditions.
        margin-note: 'Onus matters: it is the doctor who must prove s 5O.'
        authorities:
          - civil-liability-act-2002-nsw-s5o
      - id: r2
        criterion: Applies s 5O first, dealing with the expert disagreement and rationality
        marks: 3
        top-band: Uses s 5O(4) to answer the disagreement and flags the s 5O(2) rationality limit.
        margin-note: Disagreement is not fatal — cite the subsection that says so.
        authorities:
          - civil-liability-act-2002-nsw-s5o
      - id: r3
        criterion: States the consequence either way
        marks: 2
        top-band: If made out, s 5O supplants s 5B (no breach); if not, ss 5B and 5C must still be satisfied.
        margin-note: This order is the whole point of Peterkin.
        authorities:
          - civil-liability-act-2002-nsw-s5o
          - civil-liability-act-2002-nsw-s5b
          - civil-liability-act-2002-nsw-s5c
      - id: r4
        criterion: Places s 5O against Rogers v Whitaker and concludes
        marks: 1
        top-band: Notes that Rogers rejected Bolam and s 5O brings back a modified version, then concludes.
        margin-note: Brief context, then a clear conclusion.
        authorities: []
  - key: sa11
    type: short
    concept: not-insignificant-risk-s5b-1b
    difficulty: 2
    prompt: 'Q3: What does it mean if a risk is described as not-insignificant? (i.e. CLA 5B(1)(b))'
    model: >-
      Section 5B(1)(b) is the second of three cumulative elements: a person is not negligent in failing to take
      precautions unless the risk was not insignificant. It reflects the probability of the risk materialising, and may
      not be satisfied where the probability of injury was very low. It is a deliberate change to the common law. Under
      Wyong Shire Council v Shirt a risk that was not far-fetched or fanciful was real and therefore foreseeable; the
      Act modified the probability of harm to "not insignificant". The Ipp Report explains the double negative: it
      indicates a risk of a higher probability than "not far fetched and fanciful", but not so high as "a substantial
      risk". So the threshold is still low, but slightly more demanding than the common law. In assessing significance,
      Rail Corporation NSW v Donald points to factors such as obviousness, likelihood of occurrence and seriousness of
      consequence, weighed together — a rare risk may still be not insignificant if it is obvious and grave. Benic
      stresses that (b) must be addressed separately from (a), and probability returns in s 5B(2)(a) as one factor in
      deciding what precautions were reasonable.
    rubric:
      - id: r1
        criterion: States (b) as a separate element about probability
        marks: 2
        top-band: Explains that (b) is cumulative with (a) and (c) and concerns the probability of the risk materialising.
        margin-note: Probability, not seriousness alone — say so first.
        authorities:
          - civil-liability-act-2002-nsw-s5b
      - id: r2
        criterion: Places "not insignificant" relative to Wyong and "substantial"
        marks: 3
        top-band: >-
          Uses the Ipp Report to place the threshold above "not far-fetched" and below "substantial", noting it was a
          deliberate change.
        margin-note: The Ipp quotation is the heart of the answer.
        authorities:
          - civil-liability-act-2002-nsw-s5b
      - id: r3
        criterion: Explains how significance is assessed (Donald)
        marks: 2
        top-band: Names obviousness, likelihood and seriousness and explains that they are weighed, not all required.
        margin-note: Show that the factors can pull against each other.
        authorities: []
      - id: r4
        criterion: Distinguishes (b) from (a) and from s 5B(2)(a)
        marks: 1
        top-band: Keeps (b) separate from foreseeability and from probability as a s 5B(2) consideration.
        margin-note: 'Benic: do not conflate the elements.'
        authorities:
          - civil-liability-act-2002-nsw-s5b
  - key: sa12
    type: short
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 3
    prompt: >-
      Q5: What is a risk described as obvious or inherent? Explain how each bears on breach of duty under the Civil
      Liability Act 2002 (NSW).
    model: >-
      An obvious risk is one that, in the circumstances, would have been obvious to a reasonable person in the position
      of the person harmed (s 5F(1)). It includes patent risks and matters of common knowledge (s 5F(2)). An inherent
      risk is a risk of something occurring that cannot be avoided by the exercise of reasonable care and skill (s
      5I(2)). At common law, obviousness went to the scope of duty (Kirby J in Romeo) and later to breach, especially in
      recreational activities. Either kind of risk changes how a reasonable person would respond. The Act now bears
      directly on the issue. A person harmed is presumed aware of an obvious risk unless they prove otherwise (s 5G);
      there is no proactive duty to warn of an obvious risk unless an exception applies, such as a request for
      information (s 5H); and there is no liability for the materialisation of an obvious risk of a dangerous
      recreational activity (s 5L). A person is not liable for harm from the materialisation of an inherent risk (s
      5I(1)), though the duty to warn remains (s 5I(3)). Whether a risk is inherent is a question of fact.
    rubric:
      - id: r1
        criterion: Defines an obvious risk (s 5F)
        marks: 2
        top-band: Gives the s 5F(1) definition and at least one of s 5F(2)–(4).
        margin-note: Reasonable person in the plaintiff's position — not what the plaintiff noticed.
        authorities:
          - civil-liability-act-2002-nsw-s5f
      - id: r2
        criterion: Defines an inherent risk (s 5I)
        marks: 2
        top-band: Gives the s 5I(2) definition and notes that it is a question of fact.
        margin-note: Cannot be avoided by reasonable care and skill — the defining idea.
        authorities:
          - civil-liability-act-2002-nsw-s5i
      - id: r3
        criterion: States the statutory consequences
        marks: 3
        top-band: Covers ss 5G, 5H (with an exception), 5L and 5I, including the preserved duty to warn in s 5I(3).
        margin-note: Do not forget the duty to warn survives s 5I.
        authorities:
          - civil-liability-act-2002-nsw-s5g
          - civil-liability-act-2002-nsw-s5h
          - civil-liability-act-2002-nsw-s5l
          - civil-liability-act-2002-nsw-s5i
      - id: r4
        criterion: Explains the relevance to breach
        marks: 1
        top-band: Explains that obvious or inherent risks change the reasonable response, with the common law history (Romeo).
        margin-note: Link back to the standard of care — that is why this sits in the breach week.
        authorities:
          - civil-liability-act-2002-nsw-s5b
