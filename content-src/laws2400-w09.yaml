      - text: The egg-shell skull rule
        why: Tempting as another named rule, but it concerns remoteness of damage, not the professional standard.
      - text: The Wyong test for breach
        why: Tempting because Wyong governs breach, but Rogers was about the professional standard, not the Wyong limbs.
  - key: o03
