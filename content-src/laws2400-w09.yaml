      - text: Whenever the plaintiff's expert disagrees with it
        why: >-
          Tempting because experts clash, but Peterkin says competing experts disagreeing does not cause problems for s
          5O.
  - key: o06
    type: mcq
    concept: professional-standard-s5o
    difficulty: 3
    stem: >-
