  - key: sa1
    type: short
    concept: breach-of-duty-flowchart
    difficulty: 4
    prompt: >-
      Lena runs a busy café. To power a coffee machine on the footpath, she runs an extension cord across the doorway,
      taped down at one end only. A customer, Sam, trips on the loose section and breaks his wrist. Lena says she did
      her best, and that nobody could have predicted Sam would fall the way he did. Assuming Lena owed Sam a duty of
      care, advise whether she breached it.
    model: >-
      The issue is whether Lena breached her duty of care. Her conduct is measured against an objective standard of
      reasonable care: doing her best is no answer if it was not reasonable, and any shortfall, far or just, is a
      breach. Under the Civil Liability Act 2002 (NSW) s 5B, two questions arise. First, the risk. Under s 5B(1)(a) the
      risk must be foreseeable — one she knew or ought to have known of. A loose cord across a busy doorway creates a
      risk of tripping injury to customers that is not far-fetched or fanciful (Wyong Shire Council v Shirt); Sam need
      not show that the precise manner of his fall, or his particular injury, was foreseeable. Under s 5B(1)(b) it is
      not insignificant — a higher bar than not far-fetched (Ipp Report): a loose cord in a busy doorway is obvious,
      likely to be tripped on, and can cause real injury (Rail Corporation NSW v Donald). Second, the response. Under s
      5B(1)(c), would a reasonable café owner in Lena's position have taken precautions? Considering s 5B(2): a trip in
      a busy doorway is not improbable; a fall can cause injury such as a broken wrist; taping the whole cord or
      rerouting it is a slight burden; and serving coffee does not depend on leaving the cord loose. Conclusion: Lena
      likely breached her duty.
    rubric:
      - id: r1
        criterion: Identifies the breach issue and the objective standard
        marks: 2
        top-band: >-
          States that conduct is measured against an objective standard of reasonable care and expressly rejects "she
          did her best".
        margin-note: Personal best is irrelevant — say so in one line.
        authorities: []
      - id: r2
        criterion: 'Applies s 5B(1)(a): a foreseeable risk'
        marks: 2
        top-band: >-
          Frames the risk as tripping injury to a customer, applies "knew or ought to have known" and "not far-fetched
          or fanciful", and dismisses the precise-manner argument.
        margin-note: Answer her "nobody could predict it" point with the right principle.
        authorities:
          - civil-liability-act-2002-nsw-s5b
      - id: r3
        criterion: 'Applies s 5B(1)(b): not insignificant'
        marks: 2
        top-band: >-
          Treats (b) as a separate, higher threshold than not far-fetched and weighs obviousness, likelihood and
          seriousness on the facts.
        margin-note: Don't fold (b) into (a).
        authorities:
          - civil-liability-act-2002-nsw-s5b
      - id: r4
        criterion: Applies s 5B(1)(c) with the s 5B(2) considerations
        marks: 3
        top-band: >-
          Names the precaution and uses each of probability, seriousness, burden and social utility on the facts before
          concluding.
        margin-note: Tie each consideration to a fact — the low burden is the strongest point.
        authorities:
          - civil-liability-act-2002-nsw-s5b
      - id: r5
        criterion: Concludes
        marks: 1
        top-band: A clear conclusion on breach that follows from the three criteria.
        margin-note: Conclude on breach, not on liability overall.
        authorities: []
  - key: sa2
    type: short
    concept: standard-of-care-reasonableness
    difficulty: 3
    prompt: >-
      Jordan, a volunteer at a community festival, builds a temporary stage for the first time. He checks the bolts as
      carefully as he knows how, but misses a loose bolt that a reasonable organiser would have found. A performer is
      hurt when a panel gives way. Jordan's lawyer argues that (1) Jordan did his personal best, and (2) every stage
      carries some risk of collapse. Explain how the court will assess whether Jordan fell below the standard of care.
    model: >-
      The issue is whether Jordan's conduct fell short of the standard of care. The court measures the defendant's
      conduct against a standard of care; if it falls short — whether far short or just short — there is a negligent
      breach. The standard is objective: the court asks how a reasonable person would respond to a foreseeable injury,
      so a defendant may be in breach even though he did his personal best, if that best was not reasonable. Jordan's
      first argument therefore fails: the comparison is with a reasonable organiser, who would have found the loose
      bolt. The second is half right. The duty is only a duty to take reasonable care, not an absolute duty to avoid
      injury; the measure is reasonableness, not elimination of risk (Swain v Waverley Municipal Council). So remaining
      risk does not itself show breach — but nor does it excuse a failure to take reasonable care. Under Blyth v
      Birmingham Waterworks Co, negligence includes the omission to do what the reasonable man would do; failing to find
      a loose bolt that a reasonable organiser would have found is such an omission. Conclusion: Jordan likely fell
      below the standard of care.
    rubric:
      - id: r1
        criterion: States how breach is measured
        marks: 2
        top-band: Conduct against a standard of care; any shortfall, far or just, is breach.
        margin-note: Start with the measuring exercise, not the facts.
        authorities: []
      - id: r2
        criterion: Rejects the personal-best argument with the objective standard
        marks: 2
        top-band: A reasonable person's response to a foreseeable injury; personal best is no answer if not reasonable.
        margin-note: Name the comparator — a reasonable organiser.
        authorities: []
      - id: r3
        criterion: Deals with "some risk always remains" using Swain
        marks: 2
        top-band: 'Reasonableness, not elimination of risk: leftover risk neither proves nor excuses breach.'
        margin-note: Good — this is the subtle point.
        authorities: []
      - id: r4
        criterion: Uses Blyth and concludes
        marks: 2
        top-band: Characterises the missed bolt as an omission under Blyth and concludes on the standard.
        margin-note: Use the definition, don't just quote it.
        authorities: []
  - key: sa3
    type: short
    concept: foreseeable-risk-s5b-1a
    difficulty: 3
    prompt: >-
      A gym leaves a heavy weight plate balanced on top of a high shelf. Kai, a member, climbs on a bench to reach a
      towel — something the gym's rules forbid — knocks the shelf, and the plate falls on his foot. The gym argues that
      (1) it never knew the plate was there, though staff walk past the shelf every day; (2) no one could have predicted
      the plate would fall in this way; and (3) it need not foresee members breaking the rules. Advise on s 5B(1)(a) of
      the Civil Liability Act 2002 (NSW).
    model: >-
      The issue is whether the risk was foreseeable under s 5B(1)(a): a risk of which the gym knew or ought to have
      known. At the breach stage this is a more specific test than at the duty stage: the court examines the gym's
      actual conduct and the actual risk of injury in the circumstances. (1) Actual knowledge is not required. Staff
      walked past the shelf every day, so the gym ought to have known that a heavy plate was balanced there. (2) Kai
      need not show that the precise manner of his injury, or the particular injury, was reasonably foreseeable — only
      that the gym created a reasonably foreseeable risk of injury of some kind to someone such as him. A heavy plate
      balanced high above members creates a risk of falling-object injury that is not far-fetched or fanciful (Wyong
      Shire Council v Shirt). (3) A defendant must foresee and guard against inadvertent, negligent, or even extremely
      foolhardy conduct by the plaintiff, even though it is unlikely (Nagle v Rottnest Island Board; McLean v Tedman).
      Climbing on a bench against the rules is such conduct. Conclusion: s 5B(1)(a) is likely satisfied; (b) and (c)
      must still be addressed.
    rubric:
      - id: r1
        criterion: States s 5B(1)(a) and the breach-stage test
        marks: 2
        top-band: Quotes "knew or ought to have known" and notes the more specific, actual-risk focus at breach.
        margin-note: Statute first, then the principles.
        authorities:
          - civil-liability-act-2002-nsw-s5b
      - id: r2
        criterion: Answers argument (1) — knowledge
        marks: 1
        top-band: 'Constructive knowledge: staff passing daily means the gym ought to have known.'
        margin-note: Use the daily-walk fact.
        authorities:
          - civil-liability-act-2002-nsw-s5b
      - id: r3
        criterion: Answers argument (2) — manner of injury
        marks: 2
        top-band: Precise manner and particular injury need not be foreseeable; injury of some kind to someone like Kai; Wyong.
        margin-note: Frame the risk generally, then test it against Wyong.
        authorities: []
      - id: r4
        criterion: Answers argument (3) — plaintiff's conduct
        marks: 2
        top-band: >-
          Even extremely foolhardy plaintiff conduct must be foreseen and guarded against; cites Nagle and McLean v
          Tedman.
        margin-note: Rule-breaking is not a foreseeability escape hatch.
        authorities: []
      - id: r5
        criterion: Concludes and signposts (b) and (c)
        marks: 1
        top-band: Concludes on (a) only and notes that (b) and (c) remain.
        margin-note: Don't claim breach from (a) alone.
        authorities:
          - civil-liability-act-2002-nsw-s5b
  - key: sa4
    type: short
    concept: foreseeable-risk-s5b-1a
    difficulty: 2
    prompt: >-
      Explain how reasonable foreseeability at the breach stage differs from reasonable foreseeability at the duty
      stage, and why McHugh J's description of foreseeability in Swain v Waverley Municipal Council matters for how you
      argue it.
    model: >-
      Reasonable foreseeability is asked at both the duty and the breach stages, but it is not the same test. At the
      duty stage the test is more general. At the breach stage, the question of reasonable foreseeability of risk
      involves an examination of the actual conduct of the defendant, and it is a more specific test, which requires the
      court to consider the actual risk of injury in the circumstances of the case. In NSW the breach-stage question is
      now framed by s 5B(1)(a) of the Civil Liability Act 2002: the risk must be one of which the person knew or ought
      to have known. Wyong Shire Council v Shirt remains good authority that foreseeable means not far-fetched or
      fanciful. McHugh J in Swain described reasonable foreseeability as "a fact-value complex … with inherent questions
      of fairness, policy, practicality, proportion, expense, and justice". That matters because the answer is not a
      bare prediction: the argument should identify the actual risk on the facts and explain, in evaluative terms, why
      it was or was not one the defendant ought to have foreseen.
    rubric:
      - id: r1
        criterion: Distinguishes the general duty-stage test from the specific breach-stage test
        marks: 3
        top-band: >-
          Actual conduct and actual risk of injury in the circumstances at breach, contrasted with the more general duty
          test.
        margin-note: 'Use the flowchart''s words: "more specific test".'
        authorities: []
      - id: r2
        criterion: Links to s 5B(1)(a) and Wyong
        marks: 2
        top-band: States "knew or ought to have known" and "not far-fetched or fanciful".
        margin-note: Statute plus the surviving common law gloss.
        authorities:
          - civil-liability-act-2002-nsw-s5b
      - id: r3
        criterion: Explains the significance of the fact-value complex
        marks: 2
        top-band: >-
          Explains that foreseeability is evaluative (fairness, policy, practicality, proportion, expense, justice), so
          the argument must be reasoned on the facts.
        margin-note: Say why it matters, not just what McHugh J said.
        authorities: []
  - key: sa5
    type: short
    concept: not-insignificant-risk-s5b-1b
    difficulty: 3
    prompt: >-
      A council playground has low timber edging around its sandpit. A nail had been sticking up from the edging for a
      month when a child trips on it and is injured. The council accepts that the risk was foreseeable but argues that
      it was "insignificant", because a child could be hurt only by falling in an extraordinary way. Advise on s
      5B(1)(b) of the Civil Liability Act 2002 (NSW).
    model: >-
      The issue is whether the risk was "not insignificant" under s 5B(1)(b). This is a separate requirement, joined to
      (a) by "and": a foreseeable risk that is insignificant does not make the council negligent for failing to take
      precautions. It reflects the probability of the risk materialising. The Act deliberately set it higher than the
      common law's "not far-fetched or fanciful" (Wyong Shire Council v Shirt): the Ipp Report says it indicates a
      higher probability than that, but not so high as "a substantial risk". Significance depends on factors such as
      obviousness, likelihood of occurrence and seriousness of consequence (Rail Corporation NSW v Donald). The
      council's argument misdescribes the risk (Benic step 1). The risk is not an extraordinary fall but a child
      tripping on a raised nail in edging that children step over and play around. The nail was obvious to anyone
      inspecting, had been there a month, and sat where children run, so a trip was likely; a nail can cause a puncture
      or a fall injury. Weighing these, the risk was more than not far-fetched. Conclusion: the risk was not
      insignificant, so (b) is likely satisfied and the analysis moves to s 5B(1)(c).
    rubric:
      - id: r1
        criterion: States s 5B(1)(b) as a separate, cumulative requirement
        marks: 2
        top-band: Notes "and", and that a foreseeable but insignificant risk does not ground negligence.
        margin-note: Keep (b) distinct from (a).
        authorities:
          - civil-liability-act-2002-nsw-s5b
      - id: r2
        criterion: 'States the threshold: higher than not far-fetched (Ipp), weighed by obviousness, likelihood and seriousness'
        marks: 2
        top-band: >-
          Explains that the Act raised the Wyong threshold and names the Donald factors as the way to weigh
          significance.
        margin-note: Not far-fetched is the old common law bar — say why this risk clears the higher one.
        authorities: []
      - id: r3
        criterion: Applies the factors, correctly framing the risk
        marks: 3
        top-band: >-
          Reframes the risk as a class of injury (a trip on a raised nail) and weighs obviousness, likelihood and
          seriousness on the facts.
        margin-note: Don't accept the council's framing of the risk.
        authorities: []
      - id: r4
        criterion: Concludes and moves to (c)
        marks: 1
        top-band: Concludes on (b) and signposts s 5B(1)(c).
        margin-note: One clean concluding line.
        authorities:
          - civil-liability-act-2002-nsw-s5b
  - key: sa6
    type: short
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 4
    prompt: >-
      A surf club runs a free beach-fitness class on the sand next to a rock shelf. Instructors could rope off the shelf
      in a few minutes each session. About one participant in fifty strays onto the shelf during warm-ups, and a fall
      onto the rocks could cause serious head injuries. A participant falls and is hurt. Assuming s 5B(1)(a) and (b) are
      satisfied, advise whether s 5B(1)(c) of the Civil Liability Act 2002 (NSW) is met.
    model: >-
      The issue is whether, in the circumstances, a reasonable person in the club's position would have taken the
      precaution of roping off the rock shelf (s 5B(1)(c)). This is the second breach question, and it is objective.
      Under s 5B(2) the court is to consider, amongst other relevant things: (a) the probability that the harm would
      occur if care were not taken — about one participant in fifty strays onto the shelf, so a fall is a real
      possibility in any session; (b) the likely seriousness of the harm — a fall onto rocks could cause serious head
      injuries; (c) the burden of taking precautions — roping off the shelf takes a few minutes; and (d) the social
      utility of the activity — a free fitness class has value, but the precaution does not stop the class from running.
      Weighing these, the burden is slight against a not improbable risk of serious harm, and the activity's utility is
      preserved. Unlike RTA v Dederer, where an improbable risk was met by warning signs and the suggested works were
      expensive, here the precaution is cheap and the risk recurs every session. Conclusion: a reasonable person in the
      club's position would likely have roped off the shelf, so s 5B(1)(c) is likely met.
    rubric:
      - id: r1
        criterion: Frames s 5B(1)(c) and names the precaution
        marks: 2
        top-band: States the objective question in the statute's words and identifies roping off the shelf as the precaution.
        margin-note: Always name the precaution first.
        authorities:
          - civil-liability-act-2002-nsw-s5b
      - id: r2
        criterion: Applies s 5B(2)(a) and (b)
        marks: 2
        top-band: Uses the one-in-fifty figure for probability and head injury for seriousness.
        margin-note: Tie each consideration to a fact.
        authorities:
          - civil-liability-act-2002-nsw-s5b
      - id: r3
        criterion: Applies s 5B(2)(c) and (d)
        marks: 2
        top-band: Uses the few-minutes burden and shows the class's utility is not lost by the precaution.
        margin-note: Utility cuts both ways — say which way here.
        authorities:
          - civil-liability-act-2002-nsw-s5b
      - id: r4
        criterion: Weighs the considerations and concludes
        marks: 2
        top-band: Balances the considerations openly and concludes on (c); notes "amongst other relevant things".
        margin-note: Weigh, don't just list.
        authorities:
          - civil-liability-act-2002-nsw-s5b
  - key: f16
    type: mcq
    concept: breach-of-duty-flowchart
    difficulty: 2
    stem: At common law, what were the two limbs of the test for breach in Wyong Shire Council v Shirt (1980) 146 CLR 40?
    options:
      - text: A duty of care owed to the plaintiff, and conduct by the defendant that in fact caused the injury
        why: >-
          Tempting because duty and causation are elements of negligence, but Wyong's two limbs are both about breach:
          the risk and the response.
      - text: Reasonable foreseeability of a real risk of injury, and the reasonableness of the response to it
        correct: true
        why: >-
          Right: limb 1 is reasonable foreseeability of a real risk of injury from the defendant's conduct; limb 2 is
          the reasonableness of the defendant's response.
      - text: Foreseeability of the particular injury suffered, and proof it was more likely than not to occur
        why: >-
          Tempting because both words sound demanding, but the particular injury need not be foreseeable and Mason J
          said an unlikely risk may still be foreseeable.
      - text: A risk that was not insignificant, and a precaution that would certainly have prevented the harm
        why: >-
          Tempting because "not insignificant" is in s 5B, but that is the statute's later wording, and neither limb
          asks for a precaution that guarantees safety.
  - key: f17
    type: mcq
    concept: breach-of-duty-flowchart
    difficulty: 2
    stem: Section 5B of the Civil Liability Act sits in a Division headed "Duty of care". What does s 5B actually set out?
    options:
      - text: The test for whether a duty of care exists in a novel case
        why: >-
          Tempting because of the heading, but the lecturer called this a trap: duty was settled over earlier topics; s
          5B is the test for breach.
      - text: Both the test for duty and the test for breach, applied together as one inquiry
        why: >-
          Tempting because duty and breach can overlap, but s 5B states only when a person is negligent in failing to
          take precautions — breach.
      - text: The test for breach of duty, not the test for establishing a duty of care
        correct: true
        why: >-
          Right: despite the Division 2 heading, s 5B sets the criteria for breach — the lecturer warned it is "a trap
          for young players".
      - text: The test for factual causation and the scope of liability
        why: Tempting because the Divisions sit side by side, but causation is in Division 3 (s 5D); s 5B is about breach.
  - key: f18
    type: mcq
    concept: breach-of-duty-flowchart
    difficulty: 3
    stem: Why, according to Garling J in Benic v NSW, must the three elements of s 5B(1) be addressed separately?
    options:
      - text: >-
          They represent foreseeability, probability and reasonableness of precautions, concepts often conflated in the
          common law
        correct: true
        why: >-
          Right: Garling J said each concept is represented in the common law and often conflated in "reasonable
          foreseeability", but the statute makes clear each must be separately addressed.
      - text: The Act abolished the common law of breach, so the elements have no common law counterpart left
        why: >-
          Tempting because the Act restates the test, but the slides say the elements were already represented in the
