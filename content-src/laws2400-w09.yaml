  - key: p12
    type: mcq
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 4
    contrasts-with:
      - not-insignificant-risk-s5b-1b
    stem: A defendant shows that the probability of harm was low. Does that settle s 5B(1)(c) in its favour?
    options:
      - text: 'Yes: low probability means a reasonable person would never take precautions.'
        why: >-
          Tempting because probability matters, but it is only s 5B(2)(a); a court must also consider seriousness,
          burden and social utility.
      - text: >-
          No: probability is one matter the court must consider, alongside seriousness, burden, social utility and other
          relevant things.
        correct: true
        why: >-
          Correct — s 5B(2) requires the court to consider all the listed matters (and others relevant); no single one
          settles (c).
      - text: 'Yes: low probability means the risk was insignificant under s 5B(1)(b).'
        why: >-
          Wrong — the question asks about (c); and a low probability is not automatically insignificant: (b) weighs
          obviousness, likelihood and seriousness (Donald).
      - text: 'No: probability is irrelevant under s 5B.'
        why: >-
          Wrong — probability is expressly listed in s 5B(2)(a) as a matter the court is to consider for the response
          question.
  - key: p13
    type: truefalse
    set: quickfire
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 1
    statement: >-
      Section 5B(2) lists the probability of harm, the likely seriousness of the harm, the burden of precautions and the
      social utility of the activity.
    answer: true
    why: >-
      True — those are s 5B(2)(a)–(d), which the court is to consider (amongst other relevant things) when deciding what
      a reasonable person would have done.
  - key: p14
    type: truefalse
    set: quickfire
