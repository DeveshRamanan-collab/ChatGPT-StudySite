  - slug: benic-v-nsw
    name: Benic v NSW
    citation: '[2010] NSWSC 1039'
    aglc: Benic v NSW [2010] NSWSC 1039
    facts: >-
      Not given in the materials: the Topic 9 slides use the case only for Garling J's framework. The slides say it is
      in the casebook, but the casebook supplied covers topics 1–6 only.
    issue: How the breach question is to be determined under s 5B of the Civil Liability Act 2002 (NSW).
    held: Not stated in the materials; the lecture uses the case for its guidance on method, not its outcome.
    ratio: >-
      Garling J: "The three separate elements in s 5B(1) represent the concepts of foreseeability, probability and
      reasonableness of precautions … These concepts are each represented in the common law, and are often conflated in
      the term 'reasonable foreseeability' but the statute now makes it clear that each must be separately addressed."
      Step 1 is to identify a risk of harm — it is sufficient "if the risk of harm is described as a class of injury, as
      distinct from the particular injury actually suffered by the plaintiff"; step 2 is to consider the three elements
      in s 5B.
    significance: 'The framework for a breach answer under the Act: identify the risk, then address (a), (b) and (c) separately.'
    why-here: 'Cite it to open a breach answer: name the risk of harm as a class of injury before applying s 5B(1).'
    verify: true
  - slug: rta-v-dederer
    name: Roads and Traffic Authority of NSW v Dederer
    citation: (2007) 234 CLR 330
    aglc: Roads and Traffic Authority of NSW v Dederer (2007) 234 CLR 330
    facts: >-
      A 14-year-old dived off a bridge into an estuary with a shifting sandbar and suffered partial paraplegia. The
      bridge carried "fishing and climbing prohibited" signs and pictograph "no diving" signs. Jumping from it was a
      widespread practice that had never previously injured anyone, and he had seen others do it unharmed. The RTA knew
      of the jumping and that riverbed levels were continually altered. 1992 safety standards required vertical rather
      than horizontal railing bars, but the railings were not modified.
    issue: >-
      Whether the RTA breached its duty of care — the plaintiff argued that the signs should have warned of the shifting
      sands and that the railings should have been replaced — and how the risk of harm should be identified.
    held: >-
      By 3:2 (Gummow, Callinan and Heydon JJ), no breach of duty. The obligation was to exercise reasonable care, not to
      prevent harm; the risk was foreseeable but the probability low; the existing signs warning of, and prohibiting,
      diving were a reasonable response.
    ratio: >-
      Gummow J: the correct identification of the risk is critical. The Court of Appeal's "serious spinal injury flowing
      from the act of diving off the bridge" "obscured the true source of potential injury [which arose] from impact
      upon jumping into the potentially shallow water and shifting sands of the estuary" [60]. The risk must be specific
      enough to correspond to the precautions in issue. Probability is judged prospectively, not retrospectively; the
      magnitude of risk was grave but the probability low; given the expense, difficulty and inconvenience, a reasonable
      response did not demand the measures suggested. "If the [R]TA exercised reasonable care, it would not be liable
      even if the risk-taking conduct continued."
    significance: >-
      Used twice this week: for Benic step 1 (identifying the risk of harm) and for s 5B(2)(a), the probability of harm.
      Note: Lecture 1 cites (2007) 234 CLR 330; Lecture 2 cites (2007) 324 CLR 330.
    why-here: >-
      Cite it when the risk must be framed precisely, when the defendant had a duty to take care rather than to prevent
      harm, or when a grave but improbable risk was met by warnings.
    verify: true
  - slug: paris-v-stepney-borough-council
    name: Paris v Stepney Borough Council
    citation: '[1951] AC 367'
    aglc: Paris v Stepney Borough Council [1951] AC 367
    facts: >-
      The plaintiff, who worked in a garage, had only one good eye and injured it when hit by a piece of metal. The
      employer knew of this special condition but did not provide him with safety goggles; it was not an ordinary
      industry practice to provide such goggles at the time.
    issue: Whether the employer breached its duty of care by not supplying goggles to a worker it knew had only one good eye.
    held: The House of Lords held by majority that the duty of care was breached by not supplying the goggles.
    ratio: >-
      Lord Macdermott: "the known circumstance that a particular workman is likely to suffer a graver injury than his
      fellows from the happening of a given event is one which must be taken into consideration in assessing the nature
      of the employer's obligation to that workman."
    significance: >-
      The authority for s 5B(2)(b): the standard of care increases with the seriousness of harm, and with a plaintiff's
      known vulnerability to greater injury. (The slides spell the name "Stephney".)
    why-here: Cite it when the defendant knew the plaintiff would suffer a graver injury than others from the same event.
    verify: true
  - slug: woods-v-multi-sport-holdings
    name: Woods v Multi-Sport Holdings
    citation: (2002) 208 CLR 460
    aglc: Woods v Multi-Sport Holdings (2002) 208 CLR 460
    facts: >-
      Woods suffered serious injury to one eye while playing indoor cricket. The defendant organised the game and did
      not provide any helmets as part of the supplied equipment; it argued there were no specific helmets for indoor
      cricket and that the rules of the game did not require them.
    issue: Whether the organiser breached its duty of care by not supplying protective helmets.
    held: The High Court held by majority that the duty was not breached.
    ratio: >-
      Gleeson CJ took the sporting context into account: the plaintiff was an adult and the risk of some injury was
      likely, though only two serious eye injuries per year were reported out of 12,500 people playing indoor cricket in
      WA. The "burden of taking precautions" limb is not confined to financial cost but extends to practical
      considerations such as the availability of suitable safety equipment, convenience and safety: headgear had not
      been designed for indoor cricket, was not worn by players elsewhere, was not required by the rules, and raised its
      own convenience and safety concerns, so a reasonable provider was not required to supply it.
    significance: 'The authority for s 5B(2)(c): the burden of precautions includes practical considerations, not just cost.'
    why-here: Cite it when the precaution was unavailable, impractical or itself unsafe, rather than merely expensive.
    verify: false
  - slug: e-v-australian-red-cross-society
    name: E v Australian Red Cross Society
    citation: (1991) 27 FCR 310
    aglc: E v Australian Red Cross Society (1991) 27 FCR 310
    facts: The plaintiff was infected with AIDS through a blood transfusion.
    issue: Whether the defendant took adequate steps (including introducing Hepatitis B surrogate testing) to screen donors.
    held: >-
      The Federal Court held that no duty was breached by not introducing the test earlier than 1984: while the test
      might not reduce the risk of infection, it would have meant the likely loss of 5% of all blood donations.
    ratio: >-
      The social utility of the activity that creates the risk — here, maintaining the blood supply — is weighed in
      deciding what precautions a reasonable person would have taken.
    significance: 'The authority for s 5B(2)(d): social utility and public benefit can make a precaution unreasonable to demand.'
    why-here: Cite it when a precaution would cut into a socially valuable activity, as with emergency vehicles.
    verify: false
  - slug: mchale-v-watson
    name: McHale v Watson
    citation: (1966) 115 CLR 199
    aglc: McHale v Watson (1966) 115 CLR 199
    facts: >-
      Watson, a 12-year-old boy, threw a sharpened piece of scrap metal at a tree; it bounced off and injured McHale's
      eye.
    issue: Whether the standard of reasonable care should be that appropriate to a 12-year-old child.
    held: >-
      The High Court held by majority that the standard of care for children is that of a normal child of comparable
      age.
    ratio: >-
      McTiernan ACJ: it is appropriate to consider the age of the defendant to determine the standard of care. Kitto J:
      "The standard of care being objective, it is no answer for him, any more than it is for an adult, to say that the
      harm he caused was due to his being abnormally slow-witted, quick-tempered, absent-minded, or inexperienced. But
      it does not follow that he cannot rely in his defence upon a limitation upon the capacity for foresight or
      prudence … being characteristic of humanity at his stage of development."
    significance: Age is the one personal characteristic that adjusts the reasonable person; idiosyncratic traits do not.
    why-here: 'Cite it whenever the defendant is a child: apply the standard of a normal child of comparable age.'
    verify: false
  - slug: carrier-v-bonham
    name: Carrier v Bonham
    citation: '[2002] 1 Qd R 474'
    aglc: Carrier v Bonham [2002] 1 Qd R 474
    facts: >-
      Bonham, a psychiatric patient with schizophrenia, escaped from hospital and intentionally jumped in front of a bus
      driven by Carrier. Carrier braked but could not avoid hitting and injuring Bonham; Carrier suffered nervous shock
      and could not continue working as a bus driver.
    issue: Whether the defendant's mental illness affected the standard of care expected of him.
    held: >-
      The Queensland Court of Appeal held that the defendant's mental condition had no effect on the standard of care
      expected.
    ratio: >-
      McPherson JA: "it would be impossible to devise a standard by which the tortious liability of such persons could
      be judged as a class". Distinguishing children: "Unsoundness of mind is not a normal condition in most people, and
      it is not a stage of development through which all humanity is destined to pass. There is no such thing as a
      'normal' condition of unsound mind in those who suffer that affliction."
    significance: Mental illness or disability does not lower the reasonable person standard, unlike age (McHale v Watson).
    why-here: Cite it when a defendant argues that a mental condition should lower the standard of care.
    verify: false
  - slug: imbree-v-mcneilly
    name: Imbree v McNeilly
    citation: '[2008] HCA 40'
    aglc: Imbree v McNeilly [2008] HCA 40
    facts: 'Not given in the materials: the Topic 9 slides cite the case only for the proposition recorded below.'
    issue: Whether a learner driver owes a lower standard of care than a licensed driver.
    held: 'As stated in the slides: the standard of care for a learner driver is the same as for a licensed driver.'
    ratio: >-
      The standard is objective and impersonal: it does not vary with the particular driver's experience. It would be
      unworkable to apply a different standard to different drivers based on their experience level.
    significance: Inexperience does not lower the reasonable person standard.
    why-here: Cite it when a defendant pleads inexperience — a learner driver, a first-timer, a new volunteer.
    verify: true
  - slug: rogers-v-whitaker
    name: Rogers v Whitaker
    citation: (1992) 175 CLR 479
    aglc: Rogers v Whitaker (1992) 175 CLR 479
    facts: An eye surgeon failed to give a warning about a complication that arose in one in 14,000 cases.
    issue: >-
      What standard of care applies to a professional — and whether it is set by professional practice (the Bolam
      principle).
    held: >-
      The High Court held that the standard of care "is that of ordinary skilled person exercising and professing to
      have that special skill", and rejected the Bolam principle (that the standard of care is determined in line with
      medical practice).
    ratio: >-
      A professional is judged against the ordinary skilled person exercising and professing to have that special skill,
      not simply against what the profession does.
    significance: >-
      The common law professional standard. Section 5O of the Civil Liability Act now incorporates a modified version of
      the Bolam principle that Rogers rejected.
    why-here: Cite it for the professional standard at common law, then explain how s 5O changes the analysis.
    verify: false
  - slug: vaughan-v-menlove
    name: Vaughan v Menlove
    citation: (1837)
    aglc: Vaughan v Menlove (1837)
    facts: 'Not given in the materials: the Topic 9 slides cite the case only for the proposition recorded below.'
    issue: Not stated in the materials.
    held: Not stated in the materials.
    ratio: >-
      As cited in the slides: the concept of the reasonable person first appeared here, as "the man of ordinary
      prudence".
    significance: The origin of the reasonable person — the legal fiction judges use to apply the objective test.
    why-here: Cite it only for the history of the reasonable person standard.
    verify: true
  - slug: rail-corporation-nsw-v-donald
    name: Rail Corporation NSW v Donald
    citation: '[2018] NSWCA 82'
    aglc: Rail Corporation NSW v Donald [2018] NSWCA 82
    facts: >-
      Not given in the materials: the Topic 9 slides cite the case only for the proposition recorded below (and note it
      is not in the text).
    issue: How the significance of a risk is assessed under s 5B(1)(b).
    held: Not stated in the materials.
    ratio: >-
      As cited in the slides: the significance of a risk will depend upon several factors such as obviousness,
      likelihood of occurrence and seriousness of consequence.
    significance: 'Gives s 5B(1)(b) workable content: weigh obviousness, likelihood and seriousness together.'
    why-here: Cite it when arguing that a risk was, or was not, "not insignificant".
    verify: true
  - slug: peterkin-v-tadros
    name: Peterkin v Tadros
    citation: '[2026] NSWSC 1185'
    aglc: Peterkin v Tadros [2026] NSWSC 1185
    facts: 'Not given in the materials: the Topic 9 slides extract only [151]–[154], on how s 5O works.'
    issue: How s 5O of the Civil Liability Act 2002 (NSW) relates to s 5B when a professional is sued in negligence.
    held: >-
      Not stated in the extract beyond the passages recorded below (the plaintiff did not suggest that the peer
      professional opinion relied on was irrational).
    ratio: >-
      "Section 5O of the CLA operates as a defence in so far as it is a complete answer to a negligence claim under the
      CLA." The defendant bears the onus of establishing its preconditions: that he was practising in a profession, and
      doing so in a manner widely accepted in Australia by peer professional opinion as competent professional practice.
      Peer professional opinion need only be widely, not universally, accepted (s 5O(4)). "Where s 5O of the CLA is made
      out, it supplants the analysis otherwise required by s 5B"; if the preconditions are not established, ss 5B and 5C
      are to be applied (citing South-Western Sydney Local Health District v Gould (2018) 97 NSWLR 513; [2018] NSWCA
      69).
    significance: 'Settles the order for professional defendants: s 5O first (a defence), then s 5B and 5C only if it fails.'
    why-here: Cite it whenever a professional defendant pleads s 5O.
    verify: true
authorities:
  - slug: civil-liability-act-2002-nsw-s5b
    title: Civil Liability Act 2002 (NSW) s 5B
    kind: statute
    text: >-
      General principles: (1) A person is not negligent in failing to take precautions against a risk of harm unless—
      (a) the risk was foreseeable (that is, it is a risk of which the person knew or ought to have known), and (b) the
      risk was not insignificant, and (c) in the circumstances, a reasonable person in the person's position would have
      taken those precautions. (2) In determining whether a reasonable person would have taken precautions against a
      risk of harm, the court is to consider the following (amongst other relevant things)— (a) the probability that the
      harm would occur if care were not taken, (b) the likely seriousness of the harm, (c) the burden of taking
      precautions to avoid the risk of harm, (d) the social utility of the activity that creates the risk of harm.
    gloss: >-
      The statutory criteria for breach: a foreseeable risk that is not insignificant, and precautions a reasonable
      person in the defendant's position would have taken — judged by considering probability, seriousness, burden and
      social utility, amongst other things.
    cases:
      - wyong-shire-council-v-shirt
      - bolton-v-stone
      - benic-v-nsw
      - rta-v-dederer
      - paris-v-stepney-borough-council
      - woods-v-multi-sport-holdings
      - e-v-australian-red-cross-society
      - rail-corporation-nsw-v-donald
    verify: false
  - slug: civil-liability-act-2002-nsw-s5c
    title: Civil Liability Act 2002 (NSW) s 5C
    kind: statute
    text: >-
      Other principles: In proceedings relating to liability for negligence— (a) the burden of taking precautions to
      avoid a risk of harm includes the burden of taking precautions to avoid similar risks of harm for which the person
      may be responsible, and (b) the fact that a risk of harm could have been avoided by doing something in a different
      way does not of itself give rise to or affect liability for the way in which the thing was done, and (c) the
      subsequent taking of action that would (had the action been taken earlier) have avoided a risk of harm does not of
      itself give rise to or affect liability in respect of the risk and does not of itself constitute an admission of
      liability in connection with the risk.
    gloss: >-
      Three breach rules: the burden counts similar risks too; a different way of doing it does not itself prove
      negligence; and later remedial action is not itself an admission of liability.
    cases: []
    verify: false
  - slug: civil-liability-act-2002-nsw-s5i
    title: Civil Liability Act 2002 (NSW) s 5I
    kind: statute
    text: >-
      No liability for materialisation of inherent risk: (1) A person is not liable in negligence for harm suffered by
      another person as a result of the materialisation of an inherent risk. (2) An inherent risk is a risk of something
      occurring that cannot be avoided by the exercise of reasonable care and skill. (3) This section does not operate
      to exclude liability in connection with a duty to warn of a risk.
    gloss: >-
      No liability when a risk that reasonable care and skill could not avoid materialises — but any duty to warn of it
      remains.
    cases: []
    verify: false
  - slug: civil-liability-act-2002-nsw-s5o
    title: Civil Liability Act 2002 (NSW) s 5O
    kind: statute
    text: >-
      Standard of care for professionals: (1) A person practising a profession (a professional) does not incur a
      liability in negligence arising from the provision of a professional service if it is established that the
      professional acted in a manner that (at the time the service was provided) was widely accepted in Australia by
      peer professional opinion as competent professional practice. (2) However, peer professional opinion cannot be
      relied on for the purposes of this section if the court considers that the opinion is irrational. (3) The fact
      that there are differing peer professional opinions widely accepted in Australia concerning a matter does not
      prevent any one or more (or all) of those opinions being relied on for the purposes of this section. (4) Peer
      professional opinion does not have to be universally accepted to be considered widely accepted.
    gloss: >-
      A modified Bolam principle, operating as a defence: a professional who acted in a way widely accepted in Australia
      by peer professional opinion as competent (and not irrational) is not liable; if it fails, apply s 5B.
    cases:
      - peterkin-v-tadros
      - rogers-v-whitaker
    verify: false
  - slug: civil-liability-act-2002-nsw-s49
    title: Civil Liability Act 2002 (NSW) s 49
    kind: statute
    text: >-
      Effect of intoxication on duty and standard of care: (1) The following principles apply in connection with the
      effect that a person's intoxication has on the duty and standard of care that the person is owed— (a) in
      determining whether a duty of care arises, it is not relevant to consider the possibility or likelihood that a
      person may be intoxicated or that a person who is intoxicated may be exposed to increased risk because the
      person's capacity to exercise reasonable care and skill is impaired as a result of being intoxicated, (b) a person
      is not owed a duty of care merely because the person is intoxicated, (c) the fact that a person is or may be
      intoxicated does not of itself increase or otherwise affect the standard of care owed to the person.
    gloss: A plaintiff's intoxication neither creates a duty nor raises the standard of care owed to them.
    cases: []
    verify: false
questions:
  - key: f01
    type: mcq
    concept: breach-of-duty-flowchart
    difficulty: 1
    set: pretest
    stem: >-
      According to the breach flowchart, which two questions must be addressed to decide whether a duty of care was
      breached?
    options:
      - text: Was the risk of injury reasonably foreseeable, and was the defendant's response to that risk reasonable?
        correct: true
        why: >-
          Correct — the flowchart's two questions are the RISK (what standard of care is owed?) and the RESPONSE (has
          the standard been met?).
      - text: Was a duty of care owed, and did the defendant's breach cause the plaintiff's harm?
        why: >-
          Tempting because these are real elements of negligence, but duty and causation sit either side of breach; the
          breach questions are risk and response.
      - text: Was the precise injury foreseeable, and did the defendant do their personal best to avoid it?
        why: >-
          Tempting because it mentions foreseeability, but the precise injury need not be foreseeable and personal best
          is irrelevant to an objective standard.
      - text: Was the risk eliminated, and was the defendant aware of the plaintiff before the injury?
        why: >-
          Wrong — the measure is reasonableness, not elimination of risk, and the flowchart's second question is about
          the reasonableness of the response.
  - key: f02
    type: mcq
    concept: breach-of-duty-flowchart
    difficulty: 1
    stem: In the flowchart, which question is glossed as "what standard of care does the defendant owe?"
    options:
      - text: Was the RESPONSE of the defendant to this risk reasonable?
        why: >-
          Tempting because both questions concern the standard, but the response question is glossed as "has the
          standard been met?", not what standard is owed.
      - text: Was the RISK of injury to the plaintiff reasonably foreseeable?
        correct: true
        why: >-
          Correct — the first question, about the degree of foreseeable risk, is glossed in the flowchart as "what
          standard of care does the defendant owe?".
      - text: Did the defendant's breach cause the injury the plaintiff suffered?
        why: >-
          Wrong — causation is a later element of negligence; the flowchart's two questions are both about breach: the
          risk and the response to it.
  - key: f03
    type: mcq
    concept: breach-of-duty-flowchart
    difficulty: 2
    contrasts-with:
      - foreseeable-risk-s5b-1a
      - reasonable-response-s5b-1c-and-2
    stem: >-
      Which parts of Civil Liability Act s 5B does the flowchart link to the first breach question — the degree of
      foreseeable risk to the plaintiff?
    options:
      - text: s 5B(1)(a) and (b)
        correct: true
        why: >-
          Correct — paragraphs (a) (the risk was foreseeable) and (b) (the risk was not insignificant) relate to the
          first question about the degree of risk.
      - text: s 5B(1)(c) and s 5B(2)(a)–(d)
        why: >-
          Tempting because they are also breach criteria, but the flowchart links (1)(c) and (2)(a)–(d) to the second
          question, the reasonableness of the response.
      - text: s 5B(2)(a) and (b), which speak of probability and seriousness
        why: >-
          Tempting because probability and seriousness sound like "degree of risk", but the flowchart places all of s
          5B(2) under the response question.
      - text: s 5B(1)(a) only, since (b) belongs to the response question
        why: >-
          Wrong — the flowchart groups (a) and (b) together under the first question; (b) is not part of the response
          question.
  - key: f04
    type: mcq
    concept: breach-of-duty-flowchart
    difficulty: 2
    contrasts-with:
      - foreseeable-risk-s5b-1a
      - reasonable-response-s5b-1c-and-2
    stem: >-
      Which parts of s 5B relate to the second breach question — whether the defendant's response to the risk was
      reasonable?
    options:
      - text: s 5B(1)(a) and (b), because a response can only be judged against a foreseeable risk
        why: >-
          Tempting because the response is to a foreseeable risk, but the flowchart links (a) and (b) to the first
          question about the degree of that risk.
      - text: s 5B(1)(b) and (c), the two paragraphs that deal with precautions
        why: >-
          Wrong — (b) asks only whether the risk was not insignificant; the flowchart puts it with (a) under the first
          question, not the response.
      - text: s 5B(1)(c) and s 5B(2)(a)–(d)
        correct: true
        why: >-
          Correct — the flowchart says s 5B(1)(c) and (2)(a)–(d) relate to the second question: whether the defendant's
          response was reasonable.
      - text: s 5B(2) only, because s 5B(1) deals entirely with foreseeability
        why: >-
          Wrong — s 5B(1)(c) is itself the response question: would a reasonable person in the person's position have
          taken those precautions?
  - key: f05
    type: mcq
    concept: breach-of-duty-flowchart
    difficulty: 2
    stem: >-
      The flowchart says s 5B establishes statutory criteria for breach "although headed 'Duty of Care'". What is the
      right takeaway?
    options:
      - text: Section 5B decides whether a duty of care exists, so it must be argued before breach.
        why: >-
          Tempting because of the heading, but the flowchart is explicit that s 5B sets the statutory criteria for
          breach of duty, whatever its heading says.
      - text: Despite the heading it sits under, s 5B is where the statutory criteria for breach are found.
        correct: true
        why: >-
          Correct — the heading is "Duty of care" (Division 2 in the NSW Act), but s 5B now establishes the statutory
          criteria for breach of duty.
      - text: Section 5B replaces the common law, so the common law principles on breach are now irrelevant to it.
        why: >-
          Wrong — the flowchart says courts interpreting s 5B will be guided by the general common law principles on
          breach where appropriate.
      - text: Section 5B applies only in Western Australia, so a NSW answer should leave it out.
        why: >-
          Tempting because the flowchart cites the WA Act, but the NSW Civil Liability Act has its own s 5B with the
          same structure.
  - key: f06
    type: mcq
    concept: breach-of-duty-flowchart
    difficulty: 2
    stem: How are the three criteria in s 5B(1) connected?
    options:
      - text: 'By "or": proving any one of them is enough to make the defendant negligent.'
        why: Wrong — the paragraphs are joined by "and"; a person is not negligent unless every one of them is satisfied.
      - text: They are weighed together, so a strong showing on (a) can make up for a weak (b).
        why: >-
          Tempting because breach involves weighing, but s 5B(1) is framed as cumulative conditions: each of (a), (b)
          and (c) must be met.
      - text: 'By "and": a person is not negligent unless all three are satisfied.'
        correct: true
        why: >-
          Correct — "A person is not negligent … unless (a) …, and (b) …, and (c) …". Failing any one criterion defeats
          breach.
      - text: Only (c) is required; (a) and (b) are factors the court may weigh under it.
        why: >-
          Wrong — (a) and (b) are separate conditions in s 5B(1); the factors the court considers under (c) are the s
          5B(2) matters.
  - key: f07
    type: mcq
    concept: breach-of-duty-flowchart
    difficulty: 3
    stem: >-
      According to the flowchart, what role do the general common law principles on breach play when a court interprets
      s 5B?
    options:
      - text: 'None: s 5B is a complete code that displaces the common law principles on breach.'
        why: >-
          Tempting because s 5B is statutory, but the flowchart says courts will be guided by the general common law
          principles where appropriate.
      - text: Courts will be guided by them where appropriate.
        correct: true
        why: >-
          Correct — the flowchart says that in interpreting s 5B, courts will be guided by general common law principles
          on breach where appropriate.
      - text: They override s 5B wherever the statute and the common law point in different directions.
        why: >-
          Wrong — nothing in the materials says the common law overrides the statute; the principles guide the
          interpretation of s 5B.
      - text: They apply only to intentional torts, which the Civil Liability Act does not cover.
        why: >-
          Wrong — the flowchart's general principles concern negligent breach of a duty of care, and they guide the
          reading of s 5B.
  - key: f08
    type: mcq
    concept: breach-of-duty-flowchart
    difficulty: 3
    contrasts-with:
      - reasonable-response-s5b-1c-and-2
    stem: >-
      Priya slips on a wet council ramp. Her lawyer proves only that the risk was foreseeable and not insignificant.
      What is still missing from the breach argument under s 5B?
    options:
      - text: >-
          Proof that a reasonable person in the council's position would have taken the precautions she says were needed
          (s 5B(1)(c)).
        correct: true
        why: >-
          Correct — (a) and (b) answer the risk question; s 5B(1)(c), considered with s 5B(2), answers the response
          question, and all three are required.
      - text: Proof that the council owed her a duty, because s 5B(1)(a) is a duty provision.
        why: >-
          Tempting because s 5B sits under a "Duty of care" heading, but the flowchart treats it as the statutory
          criteria for breach.
      - text: Proof that the precise manner of her fall was reasonably foreseeable.
        why: >-
          Wrong — the plaintiff need not show the precise manner of the injury was foreseeable, only a foreseeable risk
          of injury of some kind.
      - text: 'Nothing: a foreseeable risk that is not insignificant establishes breach.'
        why: >-
          Wrong — the criteria are joined by "and"; without (c), the council is not negligent in failing to take
          precautions.
  - key: f09
    type: mcq
    concept: breach-of-duty-flowchart
    difficulty: 2
    stem: 'Complete the flowchart''s principle: "The higher the degree of risk, …"'
    options:
      - text: … the more likely the defendant is liable, whatever precautions it took.
        why: >-
          Tempting because more risk sounds like more liability, but the measure is reasonableness, not elimination of
          risk; good precautions still matter.
      - text: … the less the court needs to consider whether the defendant's response to that risk was reasonable.
        why: >-
          Wrong — both questions must be addressed; the degree of risk feeds into, rather than replaces, the
          reasonableness of the response.
      - text: … the less reasonable it will be for the defendant to fail to take steps to prevent it occurring.
        correct: true
        why: >-
          Correct — this is the flowchart's principle for the first question: a greater degree of foreseeable risk makes
          inaction harder to justify.
  - key: f10
    type: mcq
    concept: breach-of-duty-flowchart
    difficulty: 4
    contrasts-with:
      - laws2400-w05-negligence-elements-overview
    stem: 'A student writes: "The council owed a duty of care, so it was negligent." Using the flowchart, what is the flaw?'
    options:
      - text: >-
          Duty is only the first element: breach must still be shown by measuring the conduct against the standard of
          care.
        correct: true
        why: >-
          Correct — a duty says a standard applies; breach asks whether the conduct fell short of it, through the two
          questions and s 5B.
      - text: The student should have proved that the council failed to eliminate every risk.
        why: >-
          Wrong — the duty is only to take reasonable care; failing to eliminate risk does not itself show breach
          (Swain).
      - text: A council cannot be negligent unless it intended the injury to happen.
        why: >-
          Wrong — negligence is measured against an objective standard of reasonable care; intention to injure is not
          required.
  - key: f11
    type: mcq
    concept: breach-of-duty-flowchart
    difficulty: 2
    stem: The textbook flowchart cites the Civil Liability Act 2002 (WA). In a NSW problem, what is the right approach?
    options:
      - text: Cite the WA Act, because the textbook's flowchart does.
        why: >-
          Tempting because it follows the source, but this unit applies NSW law; the WA reference reflects the textbook,
          not the governing statute.
      - text: Cite the NSW Act's s 5B, which has the same (1)(a)–(c) and (2)(a)–(d) structure.
        correct: true
        why: >-
          Correct — the NSW s 5B has the paragraphs the flowchart refers to, though its opening words differ from the WA
          wording.
      - text: Rely on Blyth v Birmingham Waterworks Co alone, since the statute differs by state.
        why: >-
          Wrong — s 5B now establishes the statutory criteria for breach; common law principles guide its
          interpretation, not replace it.
      - text: Treat s 5B as a duty provision, because of the heading it sits under.
        why: >-
          Wrong — despite the "Duty of care" heading, the flowchart treats s 5B as establishing the criteria for breach
          of duty.
  - key: f12
    type: truefalse
    set: quickfire
    concept: breach-of-duty-flowchart
    difficulty: 1
    statement: The flowchart links s 5B(1)(c) to the first breach question — the degree of foreseeable risk.
    answer: false
    why: >-
      False — s 5B(1)(a) and (b) relate to the first question; s 5B(1)(c), with s 5B(2)(a)–(d), relates to the second
      question, the response.
  - key: f13
    type: truefalse
    set: quickfire
    concept: breach-of-duty-flowchart
    difficulty: 1
    statement: >-
      The flowchart treats s 5B as establishing statutory criteria for breach of duty, even though it sits under a "Duty
      of care" heading.
    answer: true
    why: True — the flowchart notes s 5B now establishes statutory criteria for breach "although headed 'Duty of Care'".
  - key: f14
    type: truefalse
    set: quickfire
    concept: breach-of-duty-flowchart
    difficulty: 2
    statement: A plaintiff who proves only s 5B(1)(a) and (b) has established that the defendant was negligent.
    answer: false
    why: >-
      False — the criteria are joined by "and": without (c), a person is not negligent in failing to take precautions
      against the risk.
  - key: f15
    type: truefalse
    set: quickfire
    concept: breach-of-duty-flowchart
    difficulty: 2
    statement: In interpreting s 5B, courts will be guided by the general common law principles on breach where appropriate.
    answer: true
    why: >-
      True — the flowchart says this expressly, and refers back to its general breach principles (standard of care,
      objective test, reasonableness).
  - key: s01
    type: mcq
    concept: standard-of-care-reasonableness
    difficulty: 1
    set: pretest
    cases:
      - swain-v-waverley-municipal-council
    stem: What is the measure of the defendant's duty, as the flowchart puts it with Swain v Waverley Municipal Council?
    options:
      - text: Reasonableness, not elimination of risk.
        correct: true
        why: >-
          Correct — the duty is only a duty to take reasonable care; it is not an absolute duty to avoid injury (Swain,
          Gleeson CJ at 520 [5]).
      - text: 'Elimination of risk: the defendant must prevent any injury it could foresee.'
        why: >-
          Tempting because the duty is about avoiding injury, but the flowchart says it is not an absolute duty:
          reasonableness is the measure.
      - text: The defendant's personal best, given their own skill and experience.
        why: >-
          Wrong — the standard is objective; a defendant may be in breach despite doing their personal best if that was
          not reasonable.
      - text: Whatever the plaintiff reasonably expected the defendant to do for them.
        why: >-
          Wrong — the yardstick is a reasonable person's response to a foreseeable injury, not the plaintiff's
          expectations.
  - key: s02
    type: mcq
    concept: standard-of-care-reasonableness
    difficulty: 1
    stem: >-
      When deciding whether a duty of care has been breached, against what does the court measure the defendant's
      conduct?
    options:
      - text: The defendant's own conduct on earlier, similar occasions.
        why: >-
          Tempting because consistency sounds fair, but the flowchart measures conduct against a standard of care set by
          the reasonable person.
      - text: A standard of care.
        correct: true
        why: >-
          Correct — the court measures the defendant's conduct against a standard of care; falling short of it is a
          negligent breach.
      - text: The plaintiff's own view of how safe the activity should have been.
        why: >-
          Wrong — the standard is objective: a reasonable person's response to a foreseeable injury, not the plaintiff's
          subjective view.
      - text: Whether any injury at all followed from what the defendant did.
        why: >-
          Wrong — injury is not the measure of breach; the question is whether the conduct fell short of the standard of
          care.
  - key: s03
    type: mcq
    concept: standard-of-care-reasonableness
    difficulty: 2
    stem: >-
      Mia, a nervous first-time event organiser, does her genuine personal best to set up a stage safely, but her set-up
      falls short of what a reasonable organiser would have done. On breach:
    options:
      - text: She cannot be in breach, because she did her personal best.
        why: >-
          Tempting because it seems unfair to blame someone who tried hard, but the flowchart says personal best is no
          answer if it was not reasonable.
      - text: 'She may be in breach: the standard is objective, so her personal best does not help if it was not reasonable.'
        correct: true
        why: >-
          Correct — conduct is judged against an objective standard; a defendant may breach the duty despite doing their
          personal best.
      - text: She is in breach only if her set-up fell far short of the standard.
        why: Wrong — it makes no difference whether the conduct falls far short or just short of the required standard.
      - text: She is in breach only if she deliberately cut corners.
        why: >-
          Wrong — negligence does not require any deliberate wrongdoing; the question is whether her conduct met the
          reasonable standard.
  - key: s04
    type: mcq
    concept: standard-of-care-reasonableness
    difficulty: 2
    variant-of: s03
    stem: >-
      A pool operator says: "We did everything we personally could think of." The court finds a reasonable operator
      would have done more. What follows on breach?
    options:
      - text: The operator's honest efforts are a complete answer.
        why: >-
          Tempting because the operator acted in good faith, but the standard is objective: honest effort that falls
          short of reasonable care is breach.
      - text: The conduct fell short of the objective standard, so breach is established on the flowchart's principles.
        correct: true
        why: >-
          Correct — the court measures the conduct against a reasonable operator; doing one's personal best is no
          defence if it was not reasonable.
      - text: The court must lower the standard to match what this operator could think of.
        why: >-
          Wrong — the standard is not adjusted to the defendant's personal capacity; it is how a reasonable person would
          respond to the risk.
  - key: s05
    type: mcq
    concept: standard-of-care-reasonableness
    difficulty: 2
    stem: The defendant's conduct falls only just short of the standard of care. What follows?
    options:
      - text: 'There is a negligent breach: it makes no difference whether the conduct falls far short or just short.'
        correct: true
        why: >-
          Correct — the flowchart says the size of the shortfall does not matter in establishing breach; any shortfall
          is a breach.
      - text: There is no breach, because breach requires a marked departure from the standard.
        why: >-
          Tempting because "only just" sounds trivial, but the flowchart says falling just short is as much a breach as
          falling far short.
      - text: There is a breach, but only a partial one, scaled to how close the defendant came.
        why: >-
          Wrong — breach is not scaled: the flowchart treats any shortfall from the standard as a negligent breach of
          the duty.
      - text: >-
          The court must then ask whether the defendant did their personal best before it can decide whether there was a
          breach.
        why: Wrong — personal best is irrelevant to an objective standard; the shortfall itself establishes breach.
  - key: s06
    type: mcq
    concept: standard-of-care-reasonableness
    difficulty: 3
    cases:
      - swain-v-waverley-municipal-council
    stem: >-
      A plaintiff argues: "Some risk of injury remained after the defendant's precautions, so the defendant breached its
      duty." What is the best response?
    options:
      - text: 'The argument is right: any remaining risk shows the duty was breached.'
        why: >-
          Tempting because injury followed, but the duty is not an absolute duty to avoid injury; leftover risk alone
          does not show breach.
      - text: The argument fails only if the remaining risk was one nobody could have foreseen.
        why: >-
          Wrong — even a foreseeable remaining risk does not prove breach; the question is whether the response to it
          was reasonable.
      - text: >-
          The duty is to take reasonable care, not to eliminate risk: remaining risk does not by itself show breach
          (Swain).
        correct: true
        why: >-
          Correct — the measure is reasonableness, not elimination of risk; ask whether the precautions met the
          reasonable standard.
      - text: The argument is irrelevant, because breach turns on the defendant's intentions.
        why: >-
          Wrong — breach is judged objectively by a reasonable person's response to a foreseeable injury, not the
          defendant's intentions.
  - key: s07
    type: mcq
    concept: standard-of-care-reasonableness
    difficulty: 2
    cases:
      - blyth-v-birmingham-waterworks-co
    stem: How does Blyth v Birmingham Waterworks Co, as quoted in the flowchart, define negligence?
    options:
      - text: >-
          Any act or omission that causes harm to another person, whether or not a reasonable person would have acted
          that way.
        why: >-
          Wrong — Blyth ties negligence to the reasonable man: harm alone is not negligence unless the conduct departs
          from what he would do.
      - text: The omission to do what the reasonable man would do, or doing what a prudent and reasonable man would not do.
        correct: true
        why: >-
          Correct — this is the Blyth definition as quoted: negligence can be an omission or an act, measured against
          the reasonable man.
      - text: A failure to do one's personal best in the conduct of everyday affairs.
        why: >-
          Tempting because Blyth mentions "the conduct of human affairs", but its yardstick is the reasonable man, not
          the defendant's best.
      - text: A deliberate act intended to harm another, as opposed to a mere accident.
        why: >-
          Wrong — Blyth describes falling below a reasonable standard, by omission or act; it does not require any
          intention to harm.
  - key: s08
    type: mcq
    concept: standard-of-care-reasonableness
    difficulty: 3
    cases:
      - blyth-v-birmingham-waterworks-co
    stem: >-
      A water company knows a pipe is failing and does nothing about it. Which limb of the Blyth definition does this
      engage?
    options:
      - text: The omission to do something which the reasonable man would do.
        correct: true
        why: >-
          Correct — doing nothing is an omission; Blyth treats failing to do what the reasonable man would do as
          negligence.
      - text: Doing something which a prudent and reasonable man would not do.
        why: >-
          Tempting because the company made a decision, but doing nothing is an omission, the first limb, not a positive
          act.
      - text: 'Neither: an omission to act can never amount to negligence.'
        why: Wrong — Blyth expressly includes "the omission to do something which the reasonable man … would do".
      - text: 'Neither: Blyth applies only where the defendant intended the harm.'
        why: >-
          Wrong — Blyth's definition is about falling below the reasonable standard, by omission or act; intention is
          not part of it.
  - key: s09
    type: mcq
    concept: standard-of-care-reasonableness
    difficulty: 3
    stem: Which statement about the objective standard of care is correct?
    options:
      - text: The conduct is compared with what the defendant believed was reasonable at the time.
        why: >-
          Tempting because belief feels relevant to fault, but the flowchart says conduct is judged against an objective
          standard, not belief.
      - text: The conduct is compared with a reasonable person's response to a foreseeable injury.
        correct: true
        why: >-
          Correct — the flowchart says we are concerned with a reasonable person's response to a foreseeable injury: an
          objective standard.
      - text: Only professionals are held to it; others are judged by their own best efforts.
        why: >-
          Wrong — nothing in the materials limits the objective standard to professionals; personal best is no answer
          for anyone.
      - text: The court asks whether the plaintiff acted reasonably, rather than the defendant.
        why: >-
          Wrong — breach measures the defendant's conduct against the standard; the plaintiff's conduct is not the
          subject of this question.
  - key: s10
    type: mcq
    concept: standard-of-care-reasonableness
    difficulty: 4
    contrasts-with:
      - reasonable-response-s5b-1c-and-2
    cases:
      - swain-v-waverley-municipal-council
    stem: >-
      An answer says: "The defendant took reasonable precautions but did not eliminate the risk, so it breached its
      duty." Which correction is best?
    options:
      - text: 'None needed: the duty is an absolute duty to avoid injury.'
        why: >-
          Wrong — the flowchart says the duty is only to take reasonable care; it is not an absolute duty to avoid
          injury.
      - text: >-
          If the precautions were reasonable, failing to eliminate the risk is not breach: reasonableness, not
          elimination, is the measure.
        correct: true
        why: >-
          Correct — once the response met the reasonable standard, leftover risk does not make it a breach (Swain,
          Gleeson CJ).
      - text: The answer is wrong only because the precise injury also had to be foreseeable.
        why: >-
          Wrong — the precise injury need not be foreseeable; and the real error is treating non-elimination of risk as
          breach.
  - key: s11
    type: truefalse
    set: quickfire
    concept: standard-of-care-reasonableness
    difficulty: 1
    statement: The duty of care is an absolute duty to avoid injury.
    answer: false
    why: >-
      False — it is only a duty to take reasonable care; the measure is reasonableness, not elimination of risk (Swain,
      Gleeson CJ).
  - key: s12
    type: truefalse
    set: quickfire
    concept: standard-of-care-reasonableness
    difficulty: 1
    statement: A defendant may be in breach of duty even though they did their personal best.
    answer: true
    why: >-
      True — the standard is objective, so a personal best that is not reasonable still falls short of the standard of
      care.
  - key: s13
    type: truefalse
    set: quickfire
    concept: standard-of-care-reasonableness
    difficulty: 2
    statement: It makes no difference to breach whether the defendant's conduct falls far short or just short of the standard.
    answer: true
    why: >-
      True — the flowchart says the size of the shortfall does not matter in establishing breach; any shortfall is a
      breach.
  - key: s14
    type: truefalse
    set: quickfire
    concept: standard-of-care-reasonableness
    difficulty: 2
    statement: Under the Blyth definition, negligence can only be a positive act, never an omission.
    answer: false
    why: >-
      False — Blyth defines negligence as the omission to do what the reasonable man would do, or doing what a prudent
      and reasonable man would not do.
  - key: r01
    type: mcq
    concept: foreseeable-risk-s5b-1a
    difficulty: 1
    set: pretest
    contrasts-with:
      - not-insignificant-risk-s5b-1b
    stem: Under s 5B(1)(a) of the Civil Liability Act 2002 (NSW), when is a risk "foreseeable"?
    options:
      - text: When it is a risk of which the person knew or ought to have known.
        correct: true
        why: >-
          Correct — this is the statutory gloss in s 5B(1)(a): actual knowledge or knowledge the person ought to have
          had is enough.
      - text: Only when the person actually knew of the risk at the time.
        why: >-
          Tempting because "foreseeable" sounds like foresight, but s 5B(1)(a) also covers a risk the person ought to
          have known of.
      - text: When the risk was more likely than not to cause harm.
        why: >-
          Wrong — s 5B(1)(a) says nothing about probability above 50%; Wyong says foreseeable means not far-fetched or
          fanciful.
      - text: When the precise injury suffered could have been predicted beforehand.
        why: >-
          Wrong — the plaintiff need not show that the particular injury, or its precise manner, was reasonably
          foreseeable.
  - key: r02
    type: mcq
    concept: foreseeable-risk-s5b-1a
    difficulty: 1
    cases:
      - wyong-shire-council-v-shirt
    stem: In Wyong Shire Council v Shirt, as cited in the flowchart, Mason J said that "foreseeable" means a risk that is …
    options:
      - text: more probable than not to cause injury to the plaintiff
        why: >-
          Tempting because probability is part of the picture, but Wyong sets a much lower bar: anything not far-fetched
          or fanciful is foreseeable.
      - text: actually known to the defendant when it acted
        why: >-
          Wrong — that confuses foreseeability with actual knowledge; s 5B(1)(a) covers risks the person ought to have
          known of, too.
      - text: not far-fetched or fanciful
        correct: true
        why: >-
          Correct — the flowchart says Wyong remains good authority: foreseeable is something that is not far-fetched or
          fanciful.
      - text: one a careful expert in the field would have predicted
        why: >-
          Wrong — nothing in Wyong as cited ties foreseeability to expert prediction; the test is whether the risk was
          far-fetched or fanciful.
  - key: r03
    type: mcq
    concept: foreseeable-risk-s5b-1a
    difficulty: 2
    contrasts-with:
      - laws2400-w05-reasonable-foreseeability-meaning
    stem: >-
      How does reasonable foreseeability at the breach stage differ from reasonable foreseeability at the duty stage,
      according to the flowchart?
    options:
      - text: >-
          Breach uses the more general test, while the duty stage looks at the actual risk of injury in the
          circumstances of the case.
        why: >-
          Tempting because both stages use the same words, but this reverses the flowchart: duty is the more general
          test, breach the more specific.
      - text: They are identical, so a finding at the duty stage settles foreseeability for breach.
        why: >-
          Wrong — the flowchart contrasts them: breach requires a separate, more specific look at the actual risk in the
          case.
      - text: Breach asks from the plaintiff's point of view; the duty stage asks from the defendant's.
        why: >-
          Wrong — the flowchart distinguishes them by specificity (general versus actual conduct and actual risk), not
          by point of view.
      - text: >-
          Breach is more specific: it examines the defendant's actual conduct and the actual risk of injury in the
          circumstances.
        correct: true
        why: >-
          Correct — the breach-stage test examines the actual conduct of the defendant and the actual risk of injury in
          the circumstances of the case.
  - key: r04
    type: mcq
    concept: foreseeable-risk-s5b-1a
    difficulty: 2
    stem: >-
      A defendant argues: "No one could have foreseen the exact way this accident happened." Under the flowchart's
      principles:
    options:
      - text: That defeats s 5B(1)(a), because the precise manner of injury must be foreseeable.
        why: >-
          Tempting because the accident may be genuinely unusual, but the plaintiff need not show the precise manner of
          injury was foreseeable.
      - text: >-
          That does not matter: it is enough that there was a reasonably foreseeable risk of injury of some kind to
          someone such as the plaintiff.
        correct: true
        why: >-
          Correct — the plaintiff need only show the defendant created a reasonably foreseeable risk of injury of some
          kind to someone like them.
      - text: That matters only if the injury itself was also of an unusual kind.
        why: >-
          Wrong — the plaintiff need not show that the particular injury was foreseeable either; neither point defeats
          foreseeability.
      - text: That moves the issue to s 5B(1)(c), which is where foreseeability is decided.
        why: >-
          Wrong — foreseeability is s 5B(1)(a); (c) asks whether a reasonable person in the defendant's position would
          have taken precautions.
  - key: r05
    type: mcq
    concept: foreseeable-risk-s5b-1a
    difficulty: 2
    variant-of: r04
    stem: >-
      A shopper suffers a rare eye injury from a collapsing display that nobody predicted, though some injury from the
      unstable display was obviously foreseeable. On s 5B(1)(a):
    options:
      - text: The risk is not foreseeable, because this particular injury was never predicted.
        why: >-
          Tempting because the injury was unusual, but the plaintiff need not show that the particular injury was
          reasonably foreseeable.
      - text: The risk is foreseeable only if the display had collapsed before.
        why: >-
          Wrong — foreseeability does not require a previous incident; the risk need only be not far-fetched or fanciful
          (Wyong).
      - text: 'The risk is foreseeable: a risk of injury of some kind to someone such as the plaintiff is enough.'
        correct: true
        why: >-
          Correct — the defendant created a reasonably foreseeable risk of injury of some kind; the rare form the injury
          took does not matter.
  - key: r06
    type: mcq
    concept: foreseeable-risk-s5b-1a
    difficulty: 3
    cases:
      - nagle-v-rottnest-island-board
      - mclean-v-tedman
    stem: >-
      A customer ignores a "wet floor" barrier and runs across a freshly mopped floor, a plainly foolhardy act. The shop
      says it did not have to foresee such foolish conduct. Under the flowchart:
    options:
      - text: 'The shop is right: foolhardy conduct by the plaintiff is never foreseeable.'
        why: >-
          Tempting because the conduct was unlikely, but the flowchart says a defendant must foresee even extremely
          foolhardy conduct by the plaintiff.
      - text: The customer's foolhardiness makes the risk insignificant under s 5B(1)(b).
        why: >-
          Wrong — the plaintiff's conduct does not make the risk insignificant; (b) asks whether the risk itself was a
          real, not fanciful, one.
      - text: >-
          Only inadvertent or negligent conduct by the plaintiff need be foreseen and guarded against; deliberate
          foolhardiness never.
        why: >-
          Wrong — the flowchart lists inadvertent, negligent "or even extremely foolhardy" conduct as conduct that must
          be foreseen and guarded against.
      - text: >-
          The shop must foresee and guard against even extremely foolhardy conduct by the plaintiff, even though it is
          unlikely.
        correct: true
        why: >-
          Correct — Nagle v Rottnest Island Board and McLean v Tedman, as cited: a defendant must guard against even
          extremely foolhardy plaintiff conduct.
  - key: r07
    type: mcq
    concept: foreseeable-risk-s5b-1a
    difficulty: 2
    variant-of: r06
    cases:
      - nagle-v-rottnest-island-board
      - mclean-v-tedman
    stem: >-
      A child absent-mindedly wanders off a path toward an unfenced drop. The occupier says it need not foresee a child
      not paying attention. Which principle answers this?
    options:
      - text: A defendant must foresee and guard against inadvertent conduct by the plaintiff.
        correct: true
        why: >-
          Correct — the flowchart says inadvertent, negligent or even foolhardy conduct must be foreseen and guarded
          against (Nagle; McLean v Tedman).
      - text: Inattention by the plaintiff makes the risk far-fetched or fanciful under Wyong.
        why: >-
          Tempting because inattention is the plaintiff's doing, but inadvertence is exactly what a defendant must
          foresee; it does not make a risk fanciful.
      - text: Inattention matters only to whether a duty existed, not to breach.
        why: >-
          Wrong — the flowchart puts the principle about foreseeing the plaintiff's careless conduct in the breach-stage
          foreseeability inquiry.
  - key: r08
    type: mcq
    concept: foreseeable-risk-s5b-1a
    difficulty: 3
    variant-of: r01
    stem: >-
      A shop manager never actually knew a shelf bracket was loose, though it had been visibly bent for weeks. On s
      5B(1)(a):
    options:
      - text: The risk is not foreseeable, because she had no actual knowledge of it.
        why: >-
          Tempting because she genuinely did not know, but s 5B(1)(a) also covers a risk of which the person ought to
          have known.
      - text: 'The risk can still be foreseeable: it is enough that she ought to have known of it.'
        correct: true
        why: >-
          Correct — s 5B(1)(a) defines a foreseeable risk as one the person "knew or ought to have known"; a visibly
          bent bracket points to the second.
      - text: Knowledge is irrelevant under s 5B; only the seriousness of the harm matters.
        why: >-
          Wrong — knowledge is written into s 5B(1)(a); seriousness of harm is a separate s 5B(2)(b) consideration for
          the response question.
      - text: The risk is foreseeable only if the loose bracket had already injured a customer or a staff member.
        why: Wrong — no earlier injury is required; the question is whether she knew or ought to have known of the risk.
  - key: r09
    type: mcq
    concept: foreseeable-risk-s5b-1a
    difficulty: 3
    cases:
      - swain-v-waverley-municipal-council
    stem: >-
      How did McHugh J describe reasonable foreseeability in Swain v Waverley Municipal Council, as quoted in the
      flowchart?
    options:
      - text: As a purely factual question of probability, free of value judgements.
        why: >-
          Tempting because foreseeability sounds like prediction, but McHugh J stressed the values involved: fairness,
          policy, proportion and justice.
      - text: >-
          As a fact-value complex with inherent questions of fairness, policy, practicality, proportion, expense and
          justice.
        correct: true
        why: >-
          Correct — McHugh J (at 547 [79]) called it "a fact-value complex" carrying questions of fairness, policy,
          practicality, proportion, expense and justice.
      - text: As a question of law settled by precedent, leaving nothing to evaluation.
        why: >-
          Wrong — calling it a fact-value complex means the inquiry involves evaluation on the facts, not mechanical
          application of precedent.
      - text: As a test of whether the defendant subjectively foresaw the harm.
        why: >-
          Wrong — the inquiry is objective (knew or ought to have known); McHugh J's point is about the values built
          into it.
  - key: r10
    type: mcq
    concept: foreseeable-risk-s5b-1a
    difficulty: 4
    contrasts-with:
      - not-insignificant-risk-s5b-1b
    stem: Which statement correctly separates s 5B(1)(a) from s 5B(1)(b)?
    options:
      - text: '(a) and (b) are one test: a foreseeable risk is by definition not insignificant.'
        why: >-
          Tempting because Wyong's "not far-fetched or fanciful" appears under both, but they are separate paragraphs
          joined by "and".
      - text: (a) asks whether the injury was foreseeable; (b) asks whether the precautions were reasonable.
        why: Wrong — (a) is about the risk, not the particular injury, and the precautions question is (c), not (b).
      - text: >-
          (a) asks whether the risk was known or ought to have been known; (b) separately asks whether it was not
          insignificant.
        correct: true
        why: >-
          Correct — (a) is the foreseeability gate; (b) is a second, separate requirement that the risk was not
          insignificant.
      - text: (b) is the duty-stage test and (a) the breach-stage test.
        why: >-
          Wrong — both (a) and (b) are breach criteria under s 5B and relate to the first breach question, the degree of
          foreseeable risk.
  - key: r11
    type: mcq
    concept: foreseeable-risk-s5b-1a
    difficulty: 4
    contrasts-with:
      - laws2400-w05-reasonable-foreseeability-meaning
    variant-of: r03
    stem: >-
      At which stage does the flowchart say the court considers "the actual risk of injury in the circumstances of the
      case"?
    options:
      - text: At the duty stage, the more general test.
        why: >-
          Tempting because duty also uses foreseeability, but the flowchart describes the duty-stage test as more
          general, not tied to the actual risk.
      - text: At the breach stage, the more specific test.
        correct: true
        why: >-
          Correct — at breach, foreseeability examines the actual conduct and requires the court to consider the actual
          risk of injury in the case.
      - text: At both stages, in exactly the same way.
        why: >-
          Wrong — the flowchart draws the contrast precisely: duty is general; breach is more specific and looks at the
          actual risk.
      - text: 'At neither: the actual risk belongs only to s 5B(1)(c).'
        why: >-
          Wrong — (c) is about the reasonable response; the actual risk is examined in the breach-stage foreseeability
          question.
  - key: r12
    type: truefalse
    set: quickfire
    concept: foreseeable-risk-s5b-1a
    difficulty: 1
    statement: Under s 5B(1)(a), a risk is foreseeable only if the person actually knew of it.
    answer: false
    why: >-
      False — s 5B(1)(a) covers a risk of which the person knew "or ought to have known"; actual knowledge is not
      required.
  - key: r13
    type: truefalse
    set: quickfire
    concept: foreseeable-risk-s5b-1a
    difficulty: 2
    statement: >-
      To satisfy breach-stage foreseeability, the plaintiff must show that the particular injury suffered was reasonably
      foreseeable.
    answer: false
    why: >-
      False — neither the particular injury nor the precise manner need be foreseeable; a foreseeable risk of injury of
      some kind is enough.
  - key: r14
    type: truefalse
    set: quickfire
    concept: foreseeable-risk-s5b-1a
    difficulty: 2
    statement: >-
      According to the flowchart, foreseeability at the breach stage is a more specific test than foreseeability at the
      duty stage.
    answer: true
    why: >-
      True — the breach-stage test examines the defendant's actual conduct and the actual risk of injury in the
      circumstances of the case.
  - key: r15
    type: truefalse
    set: quickfire
    concept: foreseeable-risk-s5b-1a
    difficulty: 2
    statement: >-
      A defendant must foresee and guard against even extremely foolhardy conduct by the plaintiff, even though it is
      unlikely.
    answer: true
    why: >-
      True — the flowchart cites Nagle v Rottnest Island Board and McLean v Tedman for this proposition at the breach
      stage.
  - key: n01
    type: mcq
    concept: not-insignificant-risk-s5b-1b
    difficulty: 1
    set: pretest
    stem: What does s 5B(1)(b) of the Civil Liability Act 2002 (NSW) require?
    options:
      - text: That the harm suffered was not insignificant in amount.
        why: >-
          Tempting because "insignificant" sounds like the size of the loss, but (b) is about the risk, not the harm;
          seriousness of harm is s 5B(2)(b).
      - text: That the risk was not insignificant.
        correct: true
        why: >-
          Correct — s 5B(1)(b): a person is not negligent in failing to take precautions unless, among other things,
          "the risk was not insignificant".
      - text: That the burden of taking precautions was not insignificant.
        why: >-
          Wrong — the burden of precautions is a s 5B(2)(c) consideration for the response question, not the (b)
          requirement.
      - text: That the risk was more likely than not to cause harm.
        why: >-
          Wrong — (b) is about probability, but the Ipp Report places "not insignificant" below even "a substantial
          risk", so nothing like more likely than not is required.
  - key: n02
    type: mcq
    concept: not-insignificant-risk-s5b-1b
    difficulty: 2
    cases:
      - bolton-v-stone
      - wyong-shire-council-v-shirt
    stem: How do the Topic 9 slides, drawing on the Ipp Report, explain when a risk is "not insignificant" under s 5B(1)(b)?
    options:
      - text: When it was more probable than not to cause harm, which is what the double negative signals.
        why: >-
          Tempting because (b) is about probability, but the Ipp Report says "not insignificant" is not even as high as
          "a substantial risk" — far below more probable than not.
      - text: When it was a real risk, that is, one that was not far-fetched or fanciful, as Wyong held.
        why: >-
          Tempting because the flowchart offers these markers, but the slides say the Act raised the threshold from "not
          far-fetched and fanciful" to "not insignificant".
      - text: When its probability was higher than "not far-fetched and fanciful", though it need not be a substantial risk.
        correct: true
        why: >-
          Right: the Ipp Report says the phrase indicates a higher probability than "not far fetched and fanciful", but
          not so high as "a substantial risk".
      - text: Whenever the defendant knew about it, because knowledge of a risk is what makes that risk significant.
        why: >-
          Tempting because knowledge matters under s 5B(1)(a), but knowledge goes to foreseeability; (b) is about the
          probability of the risk materialising.
  - key: n03
    type: mcq
    concept: not-insignificant-risk-s5b-1b
    difficulty: 2
    stem: How settled is the meaning of "not insignificant" in s 5B(1)(b), according to the flowchart?
    options:
      - text: Fully settled by Bolton v Stone, which defines it exhaustively.
        why: >-
          Tempting because Bolton v Stone is cited, but the flowchart offers it only as one arguable marker, not an
          exhaustive definition.
      - text: Defined in s 5B(2) by the four listed considerations.
        why: >-
          Wrong — s 5B(2) lists considerations for whether a reasonable person would have taken precautions (the
          response), not a definition of (b).
      - text: 'Not yet completely clear: the markers offered are arguable, not settled.'
        correct: true
        why: >-
          Correct — the flowchart says it is "not yet completely clear" what (b) requires; real risk and not far-fetched
          are arguable markers.
      - text: 'Settled by s 5B(1)(a): an insignificant risk is one the person did not know of.'
        why: Wrong — (a) is a separate requirement about knowledge; the flowchart does not define (b) by reference to (a).
  - key: n04
    type: mcq
    concept: not-insignificant-risk-s5b-1b
    difficulty: 2
    cases:
      - bolton-v-stone
    stem: Which case does the flowchart cite for the idea of a "real risk" under s 5B(1)(b)?
    options:
      - text: Nagle v Rottnest Island Board
        why: >-
          Wrong — Nagle is cited for foreseeing even extremely foolhardy conduct by the plaintiff, under the
