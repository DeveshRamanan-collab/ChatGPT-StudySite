    verify: true
  - slug: wyong-shire-council-v-shirt
    name: Wyong Shire Council v Shirt
    citation: (1980) 146 CLR 40
    aglc: Wyong Shire Council v Shirt (1980) 146 CLR 40
    facts: >-
      While water skiing, Shirt struck his head on the bottom of a shallow lake and became quadriplegic; the water was
      only about 3.5–4 feet deep at that point. He alleged he was misled by a "deep water" sign, which the Council had
      erected to warn swimmers about deeper channels alongside a jetty.
    issue: >-
      Whether the Council breached its duty of care — and what the common law test for breach requires of a risk that is
      unlikely to occur.
    held: >-
      At first instance a jury found that the Council breached its duty of care. The High Court found the jury's finding
      on breach was not unreasonable, and upheld the decision.
    ratio: >-
      The common law test for breach has two limbs: (1) reasonable foreseeability of a real risk of injury arising from
      the defendant's conduct, and (2) the reasonableness of the defendant's response to that risk. Mason J:
      "foreseeability of the risk of injury and the likelihood of that risk occurring are two different things … A risk
      of injury which is quite unlikely to occur … may nevertheless be plainly foreseeable"; a risk which is not
      far-fetched or fanciful is real and therefore foreseeable. A reasonable man might well have concluded that the
      sign was ambiguous and could induce a water skier to ski in that zone, mistakenly believing it to be deep.
    significance: >-
      The common law test for breach. Its first limb corresponds to s 5B(1)(a); its "not far-fetched or fanciful"
      probability threshold was raised by the Civil Liability Act to "not insignificant" (s 5B(1)(b)). The flowchart and
      the slides both say it remains good authority.
    why-here: Cite it with s 5B for what "foreseeable" means, and to keep foreseeability of a risk separate from its likelihood.
    verify: false
  - slug: bolton-v-stone
