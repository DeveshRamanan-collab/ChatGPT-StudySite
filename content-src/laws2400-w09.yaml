    options:
      - text: By a normal 13-year-old; Tom's unusual impulsiveness is no answer
        correct: true
        why: >-
          Right: McHale — a normal child of comparable age; Kitto J said being abnormally quick-tempered or the like is
          no answer.
      - text: By a reasonable adult, because the injury to the passer-by was serious
        why: Tempting because seriousness raises precautions, but it does not change whose standard applies; age does.
      - text: By Tom himself, taking account of his impulsiveness
        why: Tempting because the test considers his position, but personal traits like impulsiveness are excluded.
      - text: By a normal 13-year-old who is also impulsive
        why: Tempting as a compromise, but it builds Tom's abnormal trait into the standard, which Kitto J rejected.
  - key: m11
    type: mcq
    concept: the-reasonable-person
    difficulty: 3
    stem: >-
