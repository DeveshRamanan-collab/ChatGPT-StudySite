      - text: No standard at all while displaying L-plates
        why: Tempting as a protective rule, but learners owe the same standard as licensed drivers.
  - key: m08
    type: mcq
    concept: the-reasonable-person
    difficulty: 3
    stem: Why is a learner driver's standard of care not adjusted for inexperience?
