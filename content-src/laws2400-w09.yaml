      - text: The plaintiff bears the onus on (a) and (b), but the defendant bears it on (c)
        why: >-
          Tempting because onus matters for defences like s 5O, but nothing in the materials splits the onus within s
          5B(1); the plaintiff proves breach.
      - text: Only one of the three needs to be satisfied, so each must be tested on its own
        why: >-
          Tempting because separate testing sounds like alternatives, but the paragraphs are joined by "and": all three
          must be met.
  - key: f19
    type: mcq
    concept: breach-of-duty-flowchart
    difficulty: 3
    stem: >-
      A student writes: "The Civil Liability Act applies here, so the common law cases on breach are irrelevant." What
      is wrong with that?
    options:
      - text: 'Nothing: once the Act applies, only its text may be cited on breach'
        why: >-
          Tempting because the Act governs, but the slides say the Act presupposes the existing law of negligence — the
          case law is still important.
      - text: The Act presupposes the common law and operates against its background, so the cases still matter
        correct: true
        why: >-
          Right: Campbell JA in Refrigerated Roadways said s 5B "presupposes the existence of the law of negligence";
          Wyong, Romeo and the rest still guide its application.
      - text: The Act covers only intentional torts, so the common law governs every negligence claim
        why: >-
          Tempting because s 3B excludes some liability, but it excludes intentional acts done with intent to injure;
          most negligence claims fall under the Act.
      - text: The cases matter only where the Act's test differs from the common law test
        why: >-
          Tempting because the threshold for (b) did change, but the cases also show how the largely identical tests are
