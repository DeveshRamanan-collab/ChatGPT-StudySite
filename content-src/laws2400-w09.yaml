  - key: n05
    type: mcq
    concept: not-insignificant-risk-s5b-1b
    difficulty: 3
    contrasts-with:
      - foreseeable-risk-s5b-1a
    stem: >-
      A risk is foreseeable in the sense that it is not far-fetched or fanciful. Is s 5B(1)(b) therefore automatically
      satisfied?
    options:
      - text: 'Yes: under s 5B, a foreseeable risk is by definition not insignificant.'
        why: >-
          Tempting because Wyong is cited for both, but (b) is a separate paragraph joined by "and", and the Act
          deliberately set it higher than the Wyong threshold.
      - text: 'Not automatically: (b) needs its own argument, and "not insignificant" is a higher bar than not far-fetched.'
        correct: true
        why: >-
          Right: Benic says each element must be separately addressed, and the Ipp Report places "not insignificant"
          above "not far fetched and fanciful".
      - text: 'No: (b) can be satisfied only if the harm would be catastrophic.'
        why: >-
          Tempting because seriousness of consequence is one Donald factor, but it is weighed with obviousness and
          likelihood; nothing requires catastrophic harm.
  - key: n06
    type: mcq
    concept: not-insignificant-risk-s5b-1b
    difficulty: 3
    cases:
      - wyong-shire-council-v-shirt
    contrasts-with:
      - foreseeable-risk-s5b-1a
    stem: >-
      A court finds that a hazard could injure someone only through an extraordinary chain of events it calls
      far-fetched. On s 5B(1)(a) and (b):
    options:
      - text: >-
          Both likely fail: a far-fetched risk is not foreseeable (Wyong), and it falls below the higher (b) threshold
          too.
        correct: true
        why: >-
          Right: a far-fetched or fanciful risk fails (a) under Wyong, and since "not insignificant" sits above "not
          far-fetched", it cannot meet (b) either.
      - text: (a) is satisfied because the hazard exists; only (b) is in doubt.
        why: >-
          Tempting because the hazard is real, but foreseeable means not far-fetched or fanciful — a far-fetched risk
          fails (a) as well.
      - text: Both are satisfied, because some risk always remains.
        why: Wrong — the duty is not to eliminate all risk; a far-fetched or fanciful risk fails the s 5B(1) criteria.
      - text: >-
          Neither matters here: paragraphs (a) and (b) are really duty questions, and the defendant's duty of care is
          already established.
        why: >-
          Wrong — (a) and (b) are breach criteria under s 5B, relating to the first breach question about the degree of
          foreseeable risk.
  - key: n07
    type: mcq
    concept: not-insignificant-risk-s5b-1b
    difficulty: 3
    stem: >-
      An exam answer moves straight from "the risk was foreseeable" to "a reasonable person would have taken
      precautions". What has it skipped?
    options:
      - text: 's 5B(1)(b): whether the risk was not insignificant.'
        correct: true
        why: >-
          Correct — (b) sits between (a) and (c) and must be satisfied in its own right; the answer jumps from (a) to
          (c).
      - text: 's 5B(2)(d): the social utility of the activity.'
        why: >-
          Tempting because the answer may also need (2)(d), but that sits under (c); the paragraph skipped between (a)
          and (c) is (b).
      - text: The duty-stage foreseeability test, which must be repeated at breach.
        why: >-
          Wrong — breach-stage foreseeability is its own, more specific test; nothing requires repeating the duty-stage
          test here.
      - text: 'Nothing: (b) is part of (a), so it was covered.'
        why: Wrong — (b) is a separate paragraph joined to (a) and (c) by "and"; it needs its own sentence in the answer.
  - key: n08
    type: mcq
    concept: not-insignificant-risk-s5b-1b
    difficulty: 4
    cases:
      - wyong-shire-council-v-shirt
