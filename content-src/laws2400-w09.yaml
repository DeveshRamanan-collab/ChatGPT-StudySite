  - key: s16
    type: mcq
    concept: standard-of-care-reasonableness
    difficulty: 2
    stem: 'Ada''s conduct was marginally careless; Ben''s was completely reckless. Each caused a similar injury. On breach:'
    options:
      - text: Only Ben is in breach; marginal carelessness falls within a tolerance the law allows
        why: >-
          Tempting because the margin feels small, but there are no degrees of carelessness: falling just below the
          standard is still a breach.
      - text: 'Both are in breach: there are no degrees of carelessness'
        correct: true
        why: >-
          Right: the defendant will be liable whether her conduct was marginally careless or completely reckless — any
          shortfall is breach.
      - text: Both are in breach, but Ada's is a lesser breach that reduces what she must pay
        why: >-
          Tempting because blame seems to differ, but breach is not graded; once below the standard, the defendant is in
          breach.
      - text: Neither is in breach unless the injury each caused was serious
        why: >-
          Tempting because seriousness matters, but it shapes what precautions were reasonable (s 5B(2)(b)); it does not
          excuse conduct below the standard.
  - key: s17
    type: mcq
    concept: standard-of-care-reasonableness
    difficulty: 2
    stem: >-
      Who, according to the Topic 9 slides, laid down the classic definition of negligence in Blyth v Birmingham
      Waterworks Co (1856)?
    options:
      - text: Lord Atkin
        why: >-
          Tempting because Lord Atkin gave the neighbour principle in Donoghue v Stevenson, but that was 1932; Blyth
          (1856) is Alderson B.
      - text: Alderson B
        correct: true
        why: 'Right: the slides attribute the definition to Alderson B. (The textbook flowchart prints "Anderson".)'
      - text: Mason J
        why: Tempting because Mason J is central this week, but he spoke in Wyong (1980) on foreseeability, not in Blyth.
      - text: Gleeson CJ
        why: >-
          Tempting because Gleeson CJ is cited in Swain on reasonable care, but the Blyth definition dates from 1856 and
          Alderson B.
  - key: s18
    type: mcq
    concept: standard-of-care-reasonableness
    difficulty: 3
    stem: >-
      If Blyth defined negligence in 1856, what was the significance of Donoghue v Stevenson (1932), as the lecture
      explained it?
    options:
      - text: It first introduced the reasonable person test into the law of negligence
        why: >-
          Tempting because the reasonable person matters to breach, but the slides trace that concept to Vaughan v
          Menlove (1837).
      - text: It first held that negligence could be committed by omission as well as by act
        why: Tempting because Blyth mentions omissions, but Blyth itself already covered both, decades before Donoghue.
      - text: It established negligence as a separate, standalone cause of action
        correct: true
        why: >-
          Right: the lecturer explained that Donoghue established negligence as a cause of action in its own right; the
          concept existed before it.
      - text: It replaced the reasonable person with the neighbour principle as the test for breach
        why: >-
          Tempting because the neighbour principle is famous, but it concerns duty; breach is still measured by the
          reasonable person.
  - key: s19
    type: mcq
    concept: standard-of-care-reasonableness
    difficulty: 3
    stem: >-
      In RTA v Dederer, Gummow J contrasted an obligation to exercise reasonable care with what other kind of
      obligation?
    options:
      - text: An obligation to warn of every risk the defendant knew about
        why: >-
          Tempting because warnings were in issue, but Gummow J's contrast was with preventing harm: the RTA's signs
          were a reasonable response.
      - text: An obligation to prevent harm occurring to others
        correct: true
        why: >-
          Right: "If the [R]TA exercised reasonable care, it would not be liable even if the risk-taking conduct
          continued."
      - text: An obligation of good faith owed to those entering land
        why: >-
          Tempting as a duty-sounding phrase, but nothing in Dederer turns on good faith; the contrast is reasonable
          care versus preventing harm.
      - text: An obligation to follow the latest published safety standards
        why: >-
          Tempting because the 1992 railing standards were not met, but the court still found no breach: reasonable
          care, not compliance, was the measure.
  - key: s20
    type: truefalse
    concept: standard-of-care-reasonableness
    difficulty: 2
    statement: A defendant can avoid a finding of breach by showing that its conduct was only marginally careless.
    answer: false
    why: >-
      False: there are no degrees of carelessness. The defendant is liable whether her conduct was marginally careless
      or completely reckless.
  - key: r16
    type: mcq
    concept: foreseeable-risk-s5b-1a
    difficulty: 2
    stem: >-
      In Wyong, Mason J said foreseeability of the risk and the likelihood of it occurring are "two different things".
      What follows?
    options:
      - text: A risk quite unlikely to occur may nevertheless be plainly foreseeable
        correct: true
        why: >-
          Right: Mason J said a risk of injury which is quite unlikely to occur may nevertheless be plainly foreseeable;
          remote risks can be foreseeable.
      - text: A risk is foreseeable only if it is more likely than not to happen to someone
        why: >-
          Tempting because "real risk" sounds probable, but Mason J separated foreseeability from likelihood; an
          extremely unlikely risk can be foreseeable.
      - text: A likely risk is always foreseeable, but an unlikely risk never is
        why: >-
          Tempting as a neat rule, but it collapses the two ideas Mason J kept apart; likelihood is weighed later, in
          (b) and (c).
      - text: Likelihood is a duty question; foreseeability is a breach question
        why: >-
          Tempting because both stages use foreseeability, but likelihood belongs to breach too — in s 5B(1)(b) and s
          5B(2)(a).
  - key: r17
    type: mcq
    concept: foreseeable-risk-s5b-1a
    difficulty: 2
    stem: Which knowledge of the risk will suffice for s 5B(1)(a)?
    options:
      - text: Only what the defendant actually knew at the time of the conduct
        why: >-
          Tempting because "knew" comes first, but s 5B(1)(a) adds "or ought to have known": constructive knowledge also
          suffices.
      - text: What a reasonable person would know with the hindsight of the accident
        why: >-
          Tempting because the injury makes the risk vivid, but foreseeability is judged at the time of the conduct, not
          with hindsight.
      - text: Actual knowledge, or what it ought to have known (constructive knowledge)
        correct: true
        why: >-
          Right: actual or constructive knowledge will suffice — "a risk of which the person knew or ought to have
          known".
      - text: Only what a leading expert in the defendant's field would have known at the time
        why: >-
          Tempting because experts give evidence, but the test is a reasonable person in the defendant's position, not
          the best expert.
  - key: r18
    type: mcq
    concept: foreseeable-risk-s5b-1a
    difficulty: 3
    stem: In Wyong Shire Council v Shirt, why might a reasonable council have foreseen the risk to Shirt?
    options:
      - text: Water skiing was banned on that lake, so any skier there was a foreseeable trespasser on council land
        why: >-
          Tempting because unlawful use sometimes matters, but the slides give no ban; the risk came from the Council's
          own misleading sign.
      - text: Shirt was an experienced skier who had told the Council he planned to ski at that spot
        why: >-
          Tempting because actual knowledge suffices, but nothing like this is in the materials; the case turns on the
          Council's ambiguous sign.
      - text: Its "deep water" sign was ambiguous and might induce a skier to ski there believing it deep
        correct: true
        why: >-
          Right: Mason J said a reasonable man might well have concluded the sign was ambiguous and might induce a water
          skier to ski in that zone, mistakenly believing it to be deep.
      - text: The Council had received many complaints of injuries at that exact spot in the lake
        why: >-
          Tempting because prior incidents show foreseeability, but no such complaints are in the materials; the case
          turns on the sign.
  - key: r19
    type: mcq
    concept: foreseeable-risk-s5b-1a
    difficulty: 3
    stem: >-
      Foreseeability appears at both duty and breach. At breach, which side of the inquiry becomes more specific, as the
      lecturer explained it?
    options:
      - text: 'The harm side: the plaintiff must now show that the particular injury was foreseeable'
        why: >-
          Tempting because breach feels more detailed, but the particular injury and precise manner need not be
          foreseeable; harm stays general until remoteness.
      - text: The defendant's conduct and the actual risk it created; the harm side stays general
        correct: true
        why: >-
          Right: the breach-stage test examines the defendant's actual conduct and the actual risk in the circumstances,
          while harm stays general.
      - text: 'Neither side: the breach-stage test simply repeats the duty-stage test'
        why: >-
          Tempting because the words are the same, but the flowchart calls the breach-stage test "more specific" than
          the general duty test.
      - text: 'Both sides: the precise sequence of events and the precise injury must be foreseen'
        why: >-
          Tempting as the most rigorous answer, but the flowchart and Chapman v Hearse say the precise manner and
          sequence need not be foreseen.
  - key: r20
    type: truefalse
    concept: foreseeable-risk-s5b-1a
    difficulty: 2
    statement: Foreseeability under s 5B(1)(a) is judged with hindsight, in the light of how the accident actually happened.
    answer: false
    why: >-
      False: it is what the defendant knew or ought to have known at the time of the conduct. The court does not sit
      with full hindsight.
  - key: n13
    type: mcq
    concept: not-insignificant-risk-s5b-1b
    difficulty: 2
    stem: What did the Civil Liability Act change about the probability of harm required for breach?
    options:
      - text: It moved the threshold from "not far-fetched and fanciful" to "not insignificant"
        correct: true
        why: >-
          Right: the slides say the CLA modified the probability of harm from "not far-fetched and fanciful" to "not
          insignificant" — the main tweak, from the Ipp Report.
      - text: It moved the threshold from "not insignificant" to "not far-fetched and fanciful"
        why: >-
          Tempting because both phrases appear, but this reverses them: "not far-fetched" was the common law (Wyong);
          "not insignificant" is the Act.
      - text: It required the risk to be "substantial" rather than merely "real"
        why: >-
          Tempting because the threshold did rise, but the Ipp Report says "not insignificant" is not so high as "a
          substantial risk".
      - text: 'Nothing: s 5B(1)(b) restates the Wyong test in different words'
        why: >-
          Tempting because much of s 5B restates the common law, but (b) is the one deliberate change: a slightly more
          demanding threshold.
  - key: n14
    type: mcq
    concept: not-insignificant-risk-s5b-1b
    difficulty: 2
    stem: According to the Ipp Report, where does "not insignificant" sit on a scale of probability?
    options:
      - text: At exactly the same point as "not far-fetched or fanciful"
        why: >-
          Tempting because both are low thresholds, but the Ipp Report says "not insignificant" is of a higher
          probability than "not far fetched and fanciful".
      - text: Above "not far-fetched or fanciful", below "a substantial risk"
        correct: true
        why: >-
          Right: higher than "not far fetched and fanciful", but not so high as might be indicated by "a substantial
          risk".
      - text: Above "a substantial risk", but below "more probable than not"
        why: Tempting because the Act tightened the test, but the report expressly places it below "a substantial risk".
      - text: Below "not far-fetched or fanciful", so it is easier to satisfy
        why: >-
          Tempting because "not insignificant" sounds modest, but the Act raised the threshold; the lecturer called it
          slightly more demanding.
  - key: n15
    type: mcq
    concept: not-insignificant-risk-s5b-1b
    difficulty: 2
    stem: >-
      Rail Corporation NSW v Donald [2018] NSWCA 82 lists factors on which the significance of a risk depends. Which
      set?
    options:
      - text: Probability, seriousness, the burden of precautions and social utility
        why: >-
          Tempting because these are the s 5B(2) factors, but they decide what precautions were reasonable under (c),
          not significance under (b).
      - text: Knowledge, foreseeability and the plaintiff's own conduct
        why: >-
          Tempting because they appear elsewhere in breach, but knowledge goes to (a) and the plaintiff's conduct is not
          a Donald factor.
      - text: Obviousness, likelihood of occurrence and seriousness of consequence
        correct: true
        why: >-
          Right: the Court of Appeal noted the significance of a risk depends on factors such as obviousness, likelihood
          of occurrence and seriousness of consequence.
      - text: Cost, convenience and industry practice at the time
        why: >-
          Tempting because they echo Woods on burden, but those go to s 5B(2)(c); Donald's factors concern the risk
          itself.
  - key: n16
    type: mcq
    concept: not-insignificant-risk-s5b-1b
    difficulty: 3
    stem: Probability appears in s 5B(1)(b) and again in s 5B(2)(a). Which statement best separates them?
    options:
      - text: >-
          (b) is a threshold the risk must clear; (2)(a) is one factor weighed in deciding what precautions were
          reasonable
        correct: true
        why: >-
          Right: (b) can stop the analysis if the probability is very low; under (2)(a) probability is one consideration
          in answering (c).
      - text: >-
          (b) concerns how serious the harm would be if it occurred; (2)(a) concerns how probable the harm is if care is
          not taken
        why: >-
          Tempting because seriousness is a Donald factor, but (b) is about the probability of the risk materialising;
          seriousness is s 5B(2)(b).
      - text: They are one inquiry, so a finding under one automatically decides the other
        why: >-
          Tempting because the same word appears, but the lecturer stressed that each concept is applied in a different
          way and must not be conflated.
      - text: (b) belongs to duty of care, and (2)(a) belongs to causation
        why: Tempting because of the "Duty of care" heading, but both are part of the breach test in s 5B.
  - key: n17
    type: mcq
    concept: not-insignificant-risk-s5b-1b
    difficulty: 3
    stem: >-
      Flying is less likely than driving to cause injury, but an aircraft accident is far more serious. How do the
      Donald factors treat such a risk?
    options:
      - text: As insignificant, because likelihood alone decides s 5B(1)(b) in every case
        why: >-
          Tempting because (b) reflects probability, but Donald adds obviousness and seriousness, and the factors are
          weighed together.
      - text: 'As weighed together: low likelihood can be balanced by grave consequences'
        correct: true
        why: >-
          Right: you do not need all three factors; they are balanced, so a risk with low likelihood but grave
          consequences may still be not insignificant.
      - text: As not insignificant only if all three factors point the same way
        why: >-
          Tempting because three factors are listed, but the lecturer said you do not have to have all three — they are
          weighed.
      - text: Without seriousness, which belongs only to s 5B(2)(b)
        why: >-
          Tempting because seriousness is also in s 5B(2), but Donald lists seriousness of consequence as a factor in
          significance too.
  - key: n18
    type: mcq
    concept: not-insignificant-risk-s5b-1b
    difficulty: 4
    stem: >-
      A council cliff path has had a gap in its railing for years. The drop is obvious and falls are rare, but a fall
      would be fatal. On s 5B(1)(b):
    options:
      - text: 'Insignificant: a rare event can never rise above far-fetched or fanciful'
        why: >-
          Tempting because the risk is rare, but a remote risk can still be foreseeable (Wyong), and rarity is only one
          Donald factor.
      - text: 'Arguably not insignificant: obviousness and seriousness can outweigh a low likelihood'
        correct: true
        why: >-
          Right: on Donald, obviousness and seriousness of consequence are weighed with likelihood, so a rare but
          obvious, fatal risk can be not insignificant.
      - text: 'Irrelevant: an obvious risk is dealt with only under s 5G, never under s 5B(1)(b)'
        why: Tempting because s 5G deals with obvious risks, but Donald makes obviousness a factor in significance as well.
      - text: Automatically not insignificant, because any fatal risk is by definition a substantial risk
        why: >-
          Tempting because death is grave, but seriousness is weighed, not decisive, and "substantial" is a higher level
          than (b) requires.
  - key: n19
    type: truefalse
    concept: not-insignificant-risk-s5b-1b
    difficulty: 2
    statement: On the Topic 9 slides, a risk that is not far-fetched or fanciful is automatically not insignificant.
    answer: false
    why: >-
      False: the Act raised the threshold. "Not insignificant" indicates a higher probability than "not far fetched and
      fanciful" (Ipp Report).
  - key: n20
    type: truefalse
    concept: not-insignificant-risk-s5b-1b
    difficulty: 1
    statement: The double negative in "not insignificant" was chosen deliberately, as the Ipp Report noted.
    answer: true
    why: >-
      True: the slides say the choice of double negative is intentional — it marks a point above "not far-fetched" but
      below "substantial".
  - key: p17
    type: mcq
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 2
    stem: In Paris v Stepney Borough Council, why was the employer in breach for not supplying goggles?
    options:
      - text: Goggles were ordinary industry practice then, and the employer had ignored that practice
        why: >-
          Tempting because practice often guides reasonableness, but the slides say it was not ordinary industry
          practice to provide goggles at that time.
      - text: It knew the worker had only one good eye, so he risked a graver injury than his fellows
        correct: true
        why: >-
          Right: Lord Macdermott said the known circumstance that a workman is likely to suffer a graver injury must be
          taken into account.
      - text: Goggles were cheap, and any precaution under a set cost must always be taken
        why: >-
          Tempting because burden matters, but there is no cost threshold; the case is about seriousness of harm and
          known vulnerability.
      - text: The worker had asked for goggles and the employer had refused his request
        why: >-
          Tempting as a strong fact for the plaintiff, but no such request is in the materials; the employer's knowledge
          of his one eye was decisive.
  - key: p18
    type: mcq
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 2
    stem: In Woods v Multi-Sport Holdings, what did the High Court say the "burden of taking precautions" covers?
    options:
      - text: Only the financial cost of the precaution, measured against the defendant's means and resources
        why: Tempting because "burden" suggests cost, but the burden limb is not confined to financial cost.
      - text: Practical matters too, such as the availability of suitable equipment, convenience and safety
        correct: true
        why: >-
          Right: helmets had not been designed for indoor cricket, were not worn elsewhere or required by the rules, and
          raised their own safety concerns.
      - text: Only those precautions that the rules of the sport concerned require
        why: >-
          Tempting because the rules did not require helmets, but that was one practical consideration among several,
          not the test.
      - text: Whatever the plaintiff could have done to protect themselves
        why: >-
          Tempting because the plaintiff was an adult, but the burden limb concerns the defendant's precautions; the
          plaintiff's conduct is a separate matter.
  - key: p19
    type: mcq
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 2
    stem: >-
      Why did the Federal Court in E v Australian Red Cross Society find no breach in not introducing surrogate testing
      before 1984?
    options:
      - text: The test would have meant the likely loss of 5% of all blood donations
        correct: true
        why: >-
          Right: the social utility of the blood supply weighed against a test that might not reduce the risk but would
          cost about 5% of donations.
      - text: Infection through a transfusion was not a foreseeable risk at all
        why: >-
          Tempting because the science was new, but the case is decided on the response — social utility — not on
          foreseeability.
      - text: The plaintiff had consented to the risk of infection by accepting the transfusion
        why: >-
          Tempting because consent is a defence elsewhere, but nothing in the materials relies on consent; the reasoning
          is about utility.
      - text: Testing was already required by statute, so the Society had no choice to make
        why: >-
          Tempting as a neat explanation, but the issue was precisely whether the Society should have introduced the
          test earlier.
  - key: p20
    type: mcq
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 3
    stem: In RTA v Dederer, how did Gummow J say the probability of harm should be judged?
    options:
      - text: Retrospectively, in the light of the injury the plaintiff actually suffered
        why: >-
          Tempting because the injury proves the danger, but Gummow J said probability is judged prospectively, not
          retrospectively.
      - text: Prospectively, at the time of the alleged negligence
        correct: true
        why: >-
          Right: at the time, no one had been injured despite years of jumping, so the probability was low even though
          the magnitude was grave.
      - text: By the number of people injured at similar bridges across New South Wales
        why: >-
          Tempting because statistics help (as in Woods), but the slides record Gummow J's point as timing:
          prospectively, at the time of the alleged negligence.
      - text: Only after the defendant had brought its railings up to the current standards
        why: >-
          Tempting because the 1992 standards were not met, but compliance with standards is not how probability is
          measured.
  - key: p21
    type: mcq
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 3
    stem: >-
      In Dederer the magnitude of the risk was grave but its probability low. What did the majority treat as the
      reasonable response?
    options:
      - text: Replacing the horizontal railing bars with vertical ones, as the 1992 standards required
        why: >-
          Tempting because the standards had changed, but given the expense, difficulty and inconvenience, the court
          said a reasonable response did not demand it.
      - text: Closing the bridge to pedestrians until the sandbar had stabilised
        why: >-
          Tempting as a cautious step, but nothing in the materials suggests it; the existing signs were held to be a
          reasonable response.
      - text: The existing signs warning of, and prohibiting, diving
        correct: true
        why: >-
          Right: Held 3:2 — the existing signs warning of, and prohibiting, diving were a reasonable response. No
          breach.
      - text: Posting a lifeguard on the bridge whenever the tide was low
        why: Tempting as a targeted precaution, but it is not in the materials and the majority found the signs enough.
  - key: p22
    type: mcq
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 3
    stem: >-
      After a customer slips, a shop installs non-slip mats. In the customer's claim, what is the effect of that later
      step under s 5C(c)?
    options:
      - text: It is an admission that the shop was negligent before the fall
        why: >-
          Tempting because fixing a hazard looks like conceding it, but s 5C(c) says later action does not of itself
          constitute an admission of liability.
      - text: It does not of itself give rise to or affect liability, and is not of itself an admission
        correct: true
        why: >-
          Right: s 5C(c) — the subsequent taking of action that would have avoided the risk does not of itself give rise
          to or affect liability.
      - text: It proves the mats were a reasonable precaution, so s 5B(1)(c) is met
        why: >-
          Tempting because the mats now exist, but reasonableness is judged at the time of the fall, and s 5C(c) stops
          later action proving it.
      - text: It shifts the onus onto the shop to disprove breach on the balance of probabilities at trial
        why: >-
          Tempting because the step looks bad for the shop, but nothing in s 5C moves the onus; the plaintiff still
          proves breach.
  - key: p23
    type: mcq
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 3
    stem: >-
      A plaintiff's only argument is that the defendant "could have done it a different way" that would have avoided the
      risk. Under s 5C(b):
    options:
      - text: Liability follows, because the risk was avoidable
        why: >-
          Tempting because avoidability seems to prove fault, but s 5C(b) says that fact does not of itself give rise to
          or affect liability.
      - text: That fact does not of itself give rise to or affect liability
        correct: true
        why: >-
          Right: just because you could have done something differently does not mean you had to; the s 5B question
          still has to be answered.
      - text: The defendant must then prove that the other way was impossible
        why: >-
          Tempting because it puts the defendant to proof, but s 5C(b) creates no onus; it simply denies the argument
          any weight on its own.
      - text: The argument is relevant only to causation, never to breach
        why: >-
          Tempting because "would have avoided" sounds causal, but s 5C sits with breach and limits this breach
          argument.
  - key: p24
    type: mcq
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 3
    stem: >-
      A roads authority argues that the burden of screening one bridge must include the cost of screening all its
      similar bridges. What supports that?
    options:
      - text: 's 5C(a): the burden includes precautions against similar risks for which the person may be responsible'
        correct: true
        why: >-
          Right: s 5C(a) counts the burden of avoiding similar risks — fitting Refrigerated Roadways, where bridges were
          being screened systematically.
      - text: 's 5B(1)(b): one bridge is an insignificant risk compared with all of them together'
        why: >-
          Tempting because the numbers are large, but (b) is about the probability of this risk, not the cost of
          precautions across many sites.
      - text: 's 5I: objects falling from bridges are an inherent risk that care cannot avoid'
        why: >-
          Tempting because the risk recurs, but screening can avoid it, so it is not a risk that cannot be avoided by
          reasonable care.
      - text: 's 5C(c): screening the remaining bridges later is not an admission of liability'
        why: >-
          Tempting because it is also in s 5C, but (c) concerns action taken after the event, not how the burden is
          measured.
  - key: p25
    type: mcq
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 2
    stem: A drunk patron is hurt at a venue. Does his intoxication increase the standard of care the venue owed him?
    options:
      - text: 'Yes: the venue must take extra precautions for intoxicated people'
        why: >-
          Tempting because intoxication increases risk, but s 49(1)(c) says it does not of itself increase the standard
          of care owed.
      - text: 'No: s 49(1) — intoxication does not of itself increase or otherwise affect the standard owed'
        correct: true
        why: >-
          Right: s 49(1)(c) — the fact that a person is or may be intoxicated does not of itself increase or otherwise
          affect the standard of care.
      - text: Yes, but only if staff had noticed that he was drunk
        why: >-
          Tempting because knowledge raised the standard in Paris, but s 49(1) specifically removes intoxication from
          that reasoning.
      - text: No, because under s 49 an intoxicated person is never owed any duty of care by a venue at all
        why: >-
          Tempting because s 49(1)(b) concerns duty, but it says a person is not owed a duty merely because intoxicated
          — not that no duty is owed.
  - key: p26
    type: mcq
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 3
    stem: In Romeo v Conservation Commission, what did Kirby J say the considerations collected by Mason J in Shirt provide?
    options:
      - text: A fixed formula that, once each factor is scored on the facts, produces the answer on breach
        why: >-
          Tempting because the factors are listed, but Kirby J called them a framework; the lecturers stressed there is
          no algorithm.
      - text: A list of defences available to public authorities
        why: >-
          Tempting because the defendant was a public authority, but the considerations go to the standard of the
          reasonable person, not defences.
      - text: A framework for deciding which risks to guard against and which can safely be ignored
        correct: true
        why: >-
          Right: assessed on the facts of each case, the Shirt considerations "provide a framework for determining which
          risks the defendant should guard against and which it can safely ignore".
      - text: A test for whether a duty of care exists at all
        why: >-
          Tempting because Kirby J also spoke of the scope of duty, but here he was addressing whether the standard was
          met.
  - key: p27
    type: mcq
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 3
    stem: >-
      In RTA v Refrigerated Roadways, dropping an object from a bridge was "not far-fetched or fanciful". Why was there
      still no breach?
    options:
      - text: The authority had not failed to take a step that a reasonable roads authority would have taken
        correct: true
        why: >-
          Right: Campbell JA — before a roads authority is negligent for failing to screen the bridge, it must have
          failed to take a reasonable step a reasonable authority would have taken.
      - text: The risk was insignificant, because few objects had ever been dropped
        why: Tempting because (b) is a hurdle, but the case was decided on the reasonable response, not on significance.
      - text: The authority owed no duty of care to motorists on the road below
        why: >-
          Tempting because duty was argued in week 8, but the slides use the case for breach: no reasonable step was
          missed.
      - text: The truck driver had voluntarily assumed the risk of driving under bridges
        why: Tempting as a defence, but nothing in the materials relies on assumption of risk here.
  - key: p28
    type: mcq
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 2
    stem: What is the difference between an obvious risk and an inherent risk, as the Topic 9 slides put it?
    options:
      - text: >-
          Obvious: should be obvious to any reasonable person (s 5F). Inherent: cannot be avoided by reasonable care (s
          5I)
        correct: true
        why: >-
          Right: obvious risks are those obvious to any reasonable person; inherent risks are those which cannot be
          avoided by taking reasonable care.
      - text: >-
          Obvious: cannot be avoided by reasonable care (s 5F). Inherent: should be obvious to any reasonable person (s
          5I)
        why: Tempting because the two definitions are easily swapped, but this reverses them.
      - text: Obvious risks arise only in recreation; inherent risks arise only in medicine
        why: Tempting because the lectures used recreation and surgery as examples, but the definitions are general.
      - text: 'There is no difference: the Act uses the two terms interchangeably'
        why: >-
          Tempting because both protect defendants, but the Act defines them separately and gives them different
          consequences.
  - key: p29
    type: mcq
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 3
    stem: Which statement about obvious risks under the Civil Liability Act is correct?
    options:
      - text: The defendant must always warn of an obvious risk unless the plaintiff signs a waiver
        why: >-
          Tempting because warnings are common, but s 5H says there is no proactive duty to warn of an obvious risk,
          subject to exceptions.
      - text: The plaintiff is presumed aware of an obvious risk unless they prove otherwise (s 5G)
        correct: true
        why: >-
          Right: s 5G(1) presumes awareness of an obvious risk unless the person proves, on the balance of
          probabilities, they were not aware.
      - text: The plaintiff must prove that the defendant was aware of the obvious risk (s 5G)
        why: >-
          Tempting because awareness is the subject of s 5G, but the presumption concerns the injured person's
          awareness, not the defendant's.
      - text: An obvious risk is one the plaintiff actually noticed before the accident
        why: >-
          Tempting as a plain-English reading, but obviousness is judged by a reasonable person in the plaintiff's
          position, not by what was noticed.
  - key: p30
    type: mcq
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 3
    stem: >-
      A surgeon is not liable for an infection that reasonable care and skill could not avoid. Under s 5I, what
      liability can remain?
    options:
      - text: Liability in connection with a duty to warn of the risk
        correct: true
        why: >-
          Right: s 5I(3) — the section does not exclude liability in connection with a duty to warn of a risk. As the
          slides say, the duty to warn remains.
      - text: Strict liability for any infection following surgery
        why: >-
          Tempting as a protective rule for patients, but negligence is fault-based, and s 5I removes liability for the
          inherent risk itself.
      - text: 'Nothing: s 5I removes every form of liability connected with the procedure'
        why: Tempting because s 5I(1) is broadly worded, but s 5I(3) preserves liability for failing to warn.
      - text: Liability only if the infection was also an obvious risk
        why: >-
          Tempting because obvious and inherent risks are taught together, but they are separate concepts; obviousness
          does not revive liability.
  - key: p31
    type: mcq
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 3
    stem: >-
      An industry standard published two years after an accident would have prevented it. How does it bear on breach, as
      the lecturer explained?
    options:
      - text: 'It decides breach: falling below an industry standard is itself a breach'
        why: >-
          Tempting because standards look authoritative, but the lecturer said breach is a legal test; a standard is
          information, not the answer.
      - text: It shows the risk was foreseeable to the defendant at the time of the accident, two years earlier
        why: >-
          Tempting because it addresses the same risk, but a later standard says nothing about what was known or ought
          to have been known then.
      - text: 'It is not relevant: reasonableness is judged at the time, and the standard did not exist then'
        correct: true
        why: >-
          Right: standards released before the accident can be considered; one released later is not relevant, because
          the question is judged at the time.
      - text: It shifts the onus of proof on breach to the defendant
        why: >-
          Tempting because the standard is unfavourable to the defendant, but nothing moves the onus; the plaintiff
          proves breach.
  - key: p32
    type: mcq
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 3
    stem: >-
      An ambulance speeding to hospital with a critically ill patient clips a cyclist. Which s 5B(2) consideration most
      directly supports the driver?
    options:
      - text: (a) the probability that the harm would occur if care were not taken
        why: >-
          Tempting because speed affects probability, but that factor points against the driver; the emergency purpose
          is a matter of utility.
      - text: (b) the likely seriousness of the harm
        why: >-
          Tempting because the patient's condition is serious, but (b) concerns the harm risked to the plaintiff, not
          the benefit of the activity.
      - text: (d) the social utility of the activity that creates the risk
        correct: true
        why: >-
          Right: the slides give emergency vehicles as the case in point for social utility, which can alter what a
          reasonable person would do.
      - text: (c) the burden of taking precautions to avoid the risk of harm
        why: >-
          Tempting because slowing down has a cost, but the core point is the public benefit of the emergency run —
          social utility.
  - key: p33
    type: truefalse
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 1
    statement: >-
      In Woods v Multi-Sport Holdings, the High Court held by majority that the organiser breached its duty by not
      supplying helmets.
    answer: false
    why: >-
      False: the majority held the duty was not breached — suitable headgear was unavailable, not worn elsewhere, not
      required by the rules and raised its own concerns.
  - key: p34
    type: truefalse
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 2
    statement: Under s 5C(c), taking safety action after an accident is not of itself an admission of liability for the risk.
    answer: true
    why: >-
      True: s 5C(c) — subsequent action that would have avoided the risk does not of itself give rise to or affect
      liability, nor constitute an admission.
  - key: p35
    type: truefalse
    concept: reasonable-response-s5b-1c-and-2
    difficulty: 2
    statement: 'The s 5B(2) factors work as a checklist: breach is established once most of them favour taking the precaution.'
    answer: false
    why: >-
      False: the factors are weighed together as a whole — not a checklist, no one factor more important, and no
      algorithm. Then s 5B(1)(c) is applied.
  - key: i01
    type: mcq
    concept: identifying-the-risk-of-harm
    difficulty: 1
    stem: Under Benic v NSW, what is the first step before applying the three elements of s 5B(1)?
    options:
      - text: Identify the risk of harm
        correct: true
        why: >-
          Right: Garling J said the first step is to identify a risk of harm; the second is to consider the three
          elements in s 5B.
      - text: Decide again whether a duty of care is owed
        why: >-
          Tempting because duty comes before breach, but Benic's steps assume a duty; step 1 is identifying the risk of
          harm.
      - text: Identify the precise injury the plaintiff suffered
        why: >-
          Tempting because the injury is the obvious starting point, but a class of injury is enough — not the
          particular injury suffered.
      - text: Decide whether the s 5B(2) factors favour the plaintiff
        why: Tempting because s 5B(2) is central, but it is used within (c), at step 2, after the risk has been identified.
  - key: i02
    type: mcq
    concept: identifying-the-risk-of-harm
    difficulty: 2
    stem: How specifically must the risk of harm be described at Benic step 1?
    options:
      - text: As the particular injury the plaintiff actually suffered, described in the precise manner it happened
        why: >-
          Tempting because it seems most exact, but Benic says it is sufficient to describe a class of injury, as
          distinct from the particular injury.
      - text: As a class of injury, as distinct from the particular injury actually suffered by the plaintiff
        correct: true
        why: >-
          Right: that is Garling J's formulation — "a class of injury, as distinct from the particular injury actually
          suffered by the plaintiff".
      - text: As broadly as possible, so that every way the plaintiff might be hurt is included
        why: >-
          Tempting because broad risks are easy to foresee, but Dederer shows a risk framed too broadly obscures the
          true source of injury.
      - text: In whatever terms the defendant's own written risk assessment used at the time
        why: >-
          Tempting because it reflects what the defendant knew, but the court identifies the risk on the facts; the
          defendant's documents do not fix it.
  - key: i03
    type: mcq
    concept: identifying-the-risk-of-harm
    difficulty: 2
    stem: In RTA v Dederer, how had the Court of Appeal characterised the risk of harm?
    options:
      - text: Impact on jumping into potentially shallow water over the shifting sands of the estuary
        why: >-
          Tempting because this is the risk in Dederer, but it is Gummow J's description of the true source — the one
          the Court of Appeal missed.
      - text: Serious spinal injury flowing from the act of diving off the bridge
        correct: true
        why: >-
          Right: that was the Court of Appeal's characterisation, which Gummow J said "obscured the true source of
          potential injury".
      - text: Drowning after being swept away by the tide beneath the bridge
        why: >-
          Tempting because estuaries are tidal, but no drowning risk appears in the materials; the injury was partial
          paraplegia.
      - text: Injury from climbing over horizontal railings that should have been vertical
        why: >-
          Tempting because the railings were argued about, but that went to precautions, not to how the Court of Appeal
          framed the risk.
  - key: i04
    type: mcq
    concept: identifying-the-risk-of-harm
    difficulty: 3
    stem: Why did Gummow J say the Court of Appeal's description of the risk in Dederer was wrong?
    options:
      - text: It was too narrow, because it confined the risk to the plaintiff's own particular injury
        why: >-
          Tempting because narrowness is a real error, but the Court of Appeal's description was too broad: diving off
          the bridge as such.
      - text: It described a risk so remote that it was far-fetched or fanciful
        why: >-
          Tempting because foreseeability is the next step, but the High Court accepted the risk was foreseeable; the
          problem was its framing.
      - text: 'It obscured the true source of injury: impact in potentially shallow water over shifting sands'
        correct: true
        why: >-
          Right: the risk arose from impact upon jumping into potentially shallow water and shifting sands, not from
          diving off the bridge as such [60].
      - text: It treated the risk as arising from the plaintiff's own conduct rather than from the bridge and the estuary
        why: >-
          Tempting as a reversal, but it was the other way: the Court of Appeal tied the risk to the RTA erecting the
          bridge, which Gummow J said was not the sole cause.
  - key: i05
    type: mcq
    concept: identifying-the-risk-of-harm
    difficulty: 3
    stem: What is the danger of formulating the risk of harm too broadly?
    options:
      - text: It can sweep in fundamentally different scenarios needing different responses
        correct: true
        why: >-
          Right: the slides say you cannot formulate the risk so broadly that it encompasses fundamentally different
          scenarios requiring fundamentally different responses.
      - text: It makes the risk much harder to show was foreseeable to the defendant under s 5B(1)(a)
        why: >-
          Tempting because framing affects (a), but a broad risk is usually easier to foresee; the danger is losing the
          link to the precautions.
      - text: It turns the breach question into a question of causation
        why: >-
          Tempting because framing matters for causation later, but the Benic point is about matching risk to
          precautions within breach.
      - text: It forces the plaintiff to prove the precise manner of the injury
        why: >-
          Tempting because precision is the theme, but breadth has the opposite effect; the precise manner never needs
          to be foreseeable.
  - key: i06
    type: mcq
    concept: identifying-the-risk-of-harm
    difficulty: 3
    stem: According to the slides, the risk you identify should correspond to what?
    options:
      - text: The particular injury the plaintiff suffered
        why: >-
          Tempting because the injury is concrete, but a class of injury is sufficient; the correspondence that matters
          is with the precautions.
      - text: The type of precautions that should have been taken
        correct: true
        why: >-
          Right: be specific enough that the risk you identify corresponds to the type of precautions that should have
          been taken.
      - text: The cause of action pleaded in the statement of claim
        why: >-
          Tempting because pleadings frame a case, but the slides tie the risk to precautions, not to the form of the
          claim.
      - text: The duty-stage description of reasonably foreseeable harm
        why: >-
          Tempting because duty also uses foreseeability, but breach is more specific; the risk must be tied to the
          conduct and precautions.
  - key: i07
    type: mcq
    concept: identifying-the-risk-of-harm
    difficulty: 2
    stem: What did the High Court decide in RTA v Dederer?
    options:
      - text: 4:1 that there was a breach, because the RTA should have replaced the railings
        why: >-
          Tempting because the railings breached the 1992 standards, but the majority found no breach and the split was
          3:2.
      - text: '3:2 that there was no breach: the existing warning signs were a reasonable response'
        correct: true
        why: >-
          Right: Gummow, Callinan and Heydon JJ held the obligation was to take reasonable care; the existing signs were
          a reasonable response.
      - text: Unanimously that there was no breach, because the risk was not foreseeable
        why: >-
          Tempting because no one had been hurt before, but the risk was foreseeable; the probability was low and the
          signs reasonable.
      - text: 3:2 that there was a breach, because the signs should have warned of shifting sands
        why: 'Tempting because that was the plaintiff''s argument, but the majority rejected it: no breach.'
  - key: i08
    type: mcq
    concept: identifying-the-risk-of-harm
    difficulty: 4
    stem: In the Ariel waterslide hypothetical, which is the best Benic step 1 description of the risk of harm?
    options:
      - text: Ariel losing several teeth and needing several painful and costly surgeries and implants
        why: Tempting because it is what happened, but it is the particular injury; Benic asks for a class of injury.
      - text: Any injury that might happen to anyone, anywhere, at the aquatic centre on any day
        why: >-
          Tempting because it is certainly foreseeable, but it is so broad that it covers scenarios needing quite
          different precautions.
      - text: Collision injury when one rider enters the enclosed slide before the previous rider has left the exit pool
        correct: true
        why: >-
          Right: it names a class of injury and its source, matching the precaution in issue — a staff member letting
          riders on only once the slide is clear.
      - text: Injury from riders ignoring the warning sign at the entry to the slide
        why: >-
          Tempting because the sign is in the facts, but Ariel waited for directions; the source of the risk was the
          staff member's failure to watch.
  - key: i09
    type: mcq
    concept: identifying-the-risk-of-harm
    difficulty: 3
    stem: How does identifying the risk of harm at breach differ from foreseeable harm at the duty stage?
    options:
      - text: >-
          At breach the risk is tied to the defendant's actual conduct; at duty, some harm from some carelessness is
          enough
        correct: true
        why: >-
          Right: the duty-stage test is general on both sides; at breach the conduct side becomes specific to the
          circumstances, while harm stays a class.
      - text: At breach the plaintiff must name the particular injury; at duty a class of injury is enough
        why: Tempting because breach is more specific, but Benic says a class of injury is sufficient at breach too.
      - text: There is no difference, because Benic step 1 simply repeats the duty inquiry
        why: >-
          Tempting because both use foreseeability, but the slides say the foreseeability inquiry is different at the
          breach stage.
      - text: At breach the risk is seen from the plaintiff's side; at duty it is seen from the defendant's
        why: >-
          Tempting as a contrast, but breach focuses on the defendant's conduct; the plaintiff's perspective is not the
          test.
  - key: i10
    type: mcq
    concept: identifying-the-risk-of-harm
    difficulty: 2
    stem: Which judge laid down the Benic steps for the breach question?
    options:
      - text: Gummow J
        why: >-
          Tempting because Gummow J stressed identifying the risk in Dederer, but the Benic steps come from the NSW
          Supreme Court.
      - text: Garling J
        correct: true
        why: 'Right: Garling J in Benic v NSW [2010] NSWSC 1039 laid down the steps.'
      - text: Campbell JA
        why: Tempting because Campbell JA analysed s 5B in Refrigerated Roadways, but he did not lay down the Benic steps.
      - text: Mason J
        why: Tempting because Mason J gave the common law test in Wyong, but that was 1980, long before the Act and Benic.
  - key: i11
    type: mcq
    concept: identifying-the-risk-of-harm
    difficulty: 3
    stem: >-
      A swimmer is hurt diving into a hotel pool whose depth markers had worn off. Which risk description best fits
      Benic step 1?
    options:
      - text: Striking the bottom when diving into water of unmarked depth
        correct: true
        why: >-
          Right: a class of injury tied to its source — unmarked depth — which matches the precaution in issue,
          re-marking the depths.
      - text: The swimmer's fractured vertebra at the C5 level
        why: >-
          Tempting because it is precise, but it is the particular injury; a class of injury is enough and is what links
          to precautions.
      - text: Injury of any kind anywhere on the hotel premises
        why: >-
          Tempting because it is plainly foreseeable, but it is so broad it covers scenarios needing different
          responses.
      - text: Slipping on the wet pool deck while walking over to the deep end
        why: Tempting because pools have many risks, but this is a different scenario from the one that caused the injury.
  - key: i12
    type: mcq
    concept: identifying-the-risk-of-harm
    difficulty: 3
    stem: Why does identifying the risk "inform the whole test", as the lecturer put it?
    options:
      - text: >-
          Because once the risk has been identified, foreseeability under s 5B(1)(a) is presumed in the plaintiff's
          favour
        why: >-
          Tempting because the steps run in order, but step 1 does not decide (a); each element is still separately
          addressed.
      - text: Because s 5B(1)(c) asks about precautions against that risk, so the framing shapes what was reasonable
        correct: true
        why: >-
          Right: precautions are precautions "against a risk of harm"; how the risk is framed determines which
          precautions are in issue under (c).
      - text: Because step 1 decides whether any duty of care exists at all
        why: Tempting because of the "Duty of care" heading, but Benic's steps are for breach, after duty is established.
      - text: Because the risk identified fixes the amount of damages recoverable
        why: Tempting because the injury affects damages, but the risk framing is about breach, not quantum.
  - key: i13
    type: mcq
    concept: identifying-the-risk-of-harm
    difficulty: 2
    variant-of: i02
    stem: >-
      A worker burnt by a faulty kettle describes the risk as "a second-degree burn to her left hand". What is the
      problem under Benic?
    options:
      - text: 'Nothing: the particular injury must always be identified at step 1'
        why: >-
          Tempting because precision feels safe, but Benic says it is sufficient to describe a class of injury, not the
          particular injury.
      - text: It describes the particular injury; a class, such as burns from a faulty appliance, is enough
        correct: true
        why: >-
          Right: a class of injury tied to its source is enough, and it links to the precaution — checking or replacing
          the appliance.
      - text: It is far too broad, because "burn" covers many quite different scenarios needing different responses
        why: Tempting because breadth is a real danger, but this description is narrow, not broad.
      - text: Benic step 1 applies only where the defendant is a public authority
        why: Tempting because Benic was against the State, but its steps apply to the breach question under s 5B generally.
  - key: i14
    type: mcq
    concept: identifying-the-risk-of-harm
    difficulty: 2
    stem: In Dederer, what made the danger beneath the bridge change from day to day?
    options:
      - text: A shifting sandbar altered the depth of the water
        correct: true
        why: 'Right: the estuary had a shifting sandbar and the RTA knew riverbed levels were continually altered.'
      - text: The RTA moved its warning signs from one end of the bridge to the other
        why: Tempting because signs were central, but they were fixed pictographs; the changing factor was the riverbed.
      - text: Tidal flooding sometimes covered the railings entirely
        why: >-
          Tempting because the river was tidal, but nothing in the materials says the railings were covered; the sands
          shifted.
      - text: Fishing lines from anglers on the bridge tangled swimmers below
        why: Tempting because fishing is mentioned on the signs, but the danger was shallow water over shifting sands.
  - key: i15
    type: truefalse
    concept: identifying-the-risk-of-harm
    difficulty: 1
    statement: >-
      Under Benic v NSW, the risk of harm may be described as a class of injury rather than the particular injury
      suffered.
    answer: true
    why: >-
      True: it is sufficient "if the risk of harm is described as a class of injury, as distinct from the particular
      injury actually suffered".
  - key: i16
    type: truefalse
    concept: identifying-the-risk-of-harm
    difficulty: 2
    statement: In Dederer, the High Court agreed with the Court of Appeal's characterisation of the risk of harm.
    answer: false
    why: >-
      False: Gummow J said the Court of Appeal's "serious spinal injury flowing from the act of diving" obscured the
      true source of potential injury.
  - key: i17
    type: truefalse
    concept: identifying-the-risk-of-harm
    difficulty: 2
    statement: You may formulate the risk of harm as broadly as you like, provided the broad risk was foreseeable.
    answer: false
    why: >-
      False: the risk must be specific enough to match the precautions; it cannot encompass fundamentally different
      scenarios requiring different responses.
  - key: i18
    type: truefalse
    concept: identifying-the-risk-of-harm
    difficulty: 1
    statement: Benic step 2 is to consider the three elements in s 5B(1).
    answer: true
    why: >-
      True: step 1 identifies the risk of harm; step 2 considers foreseeability, not-insignificance and reasonable
      precautions, each separately.
  - key: i19
    type: mcq
    concept: identifying-the-risk-of-harm
    difficulty: 3
    stem: Which words in s 5B(1) show why the risk must be identified before the elements are applied?
    options:
      - text: '"the risk was not insignificant", since significance can only be judged once the particular injury is known'
        why: >-
          Tempting because (b) needs a risk to assess, but the key words are earlier: "precautions against a risk of
          harm".
      - text: '"failing to take precautions against a risk of harm" — the precautions presuppose an identified risk'
        correct: true
        why: 'Right: you cannot think about precautions against a risk of harm unless you know what the risk of harm is.'
      - text: '"a reasonable person in the person''s position", since the position defines the risk'
        why: Tempting because (c) is shaped by the risk, but the position defines the yardstick, not the risk.
      - text: '"knew or ought to have known", since knowledge must be of the particular injury'
        why: >-
          Tempting because (a) concerns knowledge, but knowledge of a class of risk suffices, not of the particular
          injury.
  - key: i20
    type: truefalse
    concept: identifying-the-risk-of-harm
    difficulty: 2
    statement: In Dederer, jumping from the bridge was a widespread practice that had never previously injured anyone.
    answer: true
    why: >-
      True: the slides describe a widespread practice that had never previously injured anyone — which is why the
      probability was low.
  - key: m01
    type: mcq
    concept: the-reasonable-person
    difficulty: 1
    stem: What is the "reasonable person", as the Topic 9 slides describe it?
    options:
      - text: A legal fiction created by judges to apply the objective test
        correct: true
        why: >-
          Right: there are too many subjective variables, so judges use the fiction of a reasonable person to apply an
          objective test.
      - text: The average of the views of the jurors who hear the case
        why: Tempting because juries decided Wyong, but the reasonable person is a legal construct, not a poll of jurors.
      - text: The defendant, judged by their own abilities, experience and knowledge
        why: >-
          Tempting because s 5B(1)(c) mentions "the person's position", but the test is objective, not the defendant's
          own standard.
      - text: A figure defined in s 5B(2) of the Civil Liability Act
        why: >-
          Tempting because s 5B(2) guides the reasonable person, but it lists considerations; it does not define the
          person.
  - key: m02
    type: mcq
    concept: the-reasonable-person
    difficulty: 2
    stem: In which case did the concept first appear, as "the man of ordinary prudence"?
    options:
      - text: Blyth v Birmingham Waterworks Co (1856)
        why: >-
          Tempting because Blyth uses the "reasonable man", but the slides say the concept first appeared earlier, in
          1837.
      - text: Vaughan v Menlove (1837)
        correct: true
        why: >-
          Right: the slides say the concept first appeared in Vaughan v Menlove (1837) as "the man of ordinary
          prudence".
      - text: Donoghue v Stevenson (1932)
        why: Tempting because Donoghue is the founding negligence case, but the reasonable person is about a century older.
      - text: Wyong Shire Council v Shirt (1980)
        why: >-
          Tempting because Wyong is the common law breach test, but it applies the reasonable person rather than
          creating it.
  - key: m03
    type: mcq
    concept: the-reasonable-person
    difficulty: 2
    stem: What standard of care applies to a 12-year-old defendant, according to McHale v Watson?
    options:
      - text: That of a normal child of comparable age
        correct: true
        why: >-
          Right: the High Court held by majority that the standard of care for children is that of a normal child of
          comparable age.
      - text: That of a reasonable adult, since the standard is objective
        why: Tempting because the test is objective, but age is the one characteristic McHale allows; Kitto J explains why.
      - text: That of this particular child, given his maturity and temperament
        why: >-
          Tempting because the court looked at age, but Kitto J said abnormal traits such as being quick-tempered are no
          answer.
      - text: 'No standard at all: children under 14 cannot be negligent'
        why: Tempting as a rule about children, but McHale applies a standard to a 12-year-old; there is no age immunity.
  - key: m04
    type: mcq
    concept: the-reasonable-person
    difficulty: 3
    stem: >-
      Kitto J said a child cannot rely on being "abnormally slow-witted, quick-tempered, absent-minded, or
      inexperienced". On what may a child rely?
    options:
      - text: Any personal trait, such as a short temper, that made the harm genuinely hard for him to avoid
        why: >-
          Tempting because the child is judged as a child, but Kitto J excluded idiosyncratic traits; only age-typical
          limits count.
      - text: The fact that his parents had never warned him about the danger
        why: Tempting because parental supervision matters elsewhere, but McHale is about the child's own standard of care.
      - text: A limit on foresight or prudence characteristic of humanity at his stage of development
        correct: true
        why: >-
          Right: Kitto J — he may rely on "a limitation upon the capacity for foresight or prudence … being
