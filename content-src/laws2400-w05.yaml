          The case involves facts that have never before been the subject of any litigation of any kind, in any area of law.
        correct: false
        why: |
          "Novel" here refers specifically to duty of care classification, not to whether the underlying facts have ever occurred before in litigation generally.
      - text: |
          The plaintiff is bringing a claim for the very first time in the history of Australian tort law.
        correct: false
        why: |
          Novelty is about the relationship's classification, not about whether any given individual has ever previously sued in negligence.
      - text: |
          The defendant is a corporation rather than a natural person, which automatically makes any claim against it novel.
        correct: false
        why: |
          Corporate defendants can fall within established categories (eg manufacturer/consumer) just as easily as individuals; novelty does not turn on corporate status.
  - key: nov02
