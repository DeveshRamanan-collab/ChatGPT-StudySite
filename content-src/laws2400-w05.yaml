      - chapman-v-hearse
    authorities: []
    verify: false
    body: |
      In most negligence cases, whether the defendant owed the plaintiff a duty of care is uncontroversial,
      because the relationship between them has already been recognised by the courts as giving rise to a duty.
      Recognised categories include: a driver of a vehicle owes a duty to other road users; an employer owes a
      duty to its employees; a doctor owes a duty to their patients; a manufacturer owes a duty to the consumers
      or users of its products (*Donoghue v Stevenson*; *Grant v Australian Knitting Mills*); and a solicitor owes
      a duty to exercise due care for their clients.

      Where a case falls within an established category, you can simply point to the case law recognising that
      category — for example, "this is a manufacturer/consumer relationship, an established category since
      Donoghue v Stevenson" — without needing to run the full salient features analysis.

      Unusual facts can still pull an apparently ordinary case away from the paradigm: *Chapman v Hearse* was a
      car accident case, an established category between road users, but its unusual chain of events (a bystander
      doctor killed while rendering aid) put the existence of a duty back in issue.

      Exam use: always check the category first — only move to the salient features approach once you have
      concluded the facts are genuinely novel.
  - slug: novel-duty-and-salient-features
    title: Novel duty situations and the salient features approach
    visual: simulation
    visual-brief: A weighing scale — drop in salient factors (control, vulnerability, reliance, coherence…) on facts that fall outside an established category, and see whether a duty tips into existence.
    related:
      - established-categories-of-duty
      - duty-of-care-and-pure-economic-loss
    depends-on:
      - established-categories-of-duty
    contrasts-with:
      - established-categories-of-duty
    cases:
      - caltex-refineries-pty-ltd-v-stavar
      - sullivan-v-moody
    authorities: []
    verify: false
    body: |
      A case is "novel" when it falls outside an established category of relationship — reasonable foreseeability
      alone is not enough, and courts take an incremental approach, weighing the "salient features" of the
      relationship between plaintiff and defendant (*Caltex Refineries v Stavar*).

      The salient features are non-exhaustive and need not all be satisfied. They include: foreseeability of harm;
      the defendant's degree and nature of control over the risk; the plaintiff's vulnerability and ability to
      self-protect; the plaintiff's reliance on the defendant; any assumption of responsibility by the defendant;
      proximity between the parties; the category of relationship; the nature and danger of the defendant's
      activity; the defendant's actual or constructive knowledge of the risk of harm; the risk of indeterminate
      liability; and coherence with statute and the common law.

      In *Caltex Refineries v Stavar*, an employer's duty to an employee's wife — exposed to asbestos while
      washing his contaminated work clothes — was novel because it ran beyond the established employer/employee
      relationship; weighing the salient features, the Court of Appeal found a duty was owed. In *Sullivan v
      Moody*, weighing coherence with statutory child-protection duties and the risk of indeterminate liability
      instead, the High Court found no duty was owed to a father under investigation for suspected abuse.

      Exam use: name the case as novel, then run through the salient factors the facts actually raise — do not
      simply list all of them.
  - slug: duty-of-care-and-pure-economic-loss
    title: Duty of care for pure economic loss
    visual: diagram
    visual-brief: Hedley Byrne's four-part test (special relationship, assumption of responsibility, reliance, reasonableness) feeding into a separate vulnerability check.
    related:
      - novel-duty-and-salient-features
    depends-on:
      - novel-duty-and-salient-features
    contrasts-with:
      - established-categories-of-duty
    cases:
      - hedley-byrne-v-heller
      - perre-v-apand-pty-ltd
      - woolcock-street-investments-pty-ltd-v-cdg-pty-ltd
    authorities:
      - civil-liability-act-2002-nsw-s5
    verify: false
    body: |
      Pure economic loss (PEL) is loss not consequent on any physical injury to person or property; the CLA's
      definition of "harm" (s 5) expressly includes economic loss. Reasonable foreseeability of the loss is
      necessary but never sufficient on its own to found a duty of care for PEL (*Perre v Apand*), because of the
      risk of liability in an indeterminate amount (*Ultramares Corp v Touche*) and a disproportion between the
      defendant's blameworthiness and the scale of potential liability.

      For negligent misstatement, *Hedley Byrne v Heller* requires, beyond foreseeability: a special relationship;
      a voluntary assumption of responsibility by the party giving the advice; the other party's reliance on it;
      and the reasonableness of that reliance. Hedley Byrne itself lost because Heller had disclaimed
      responsibility for its reference.

      Vulnerability of the plaintiff — an inability to protect themselves from the defendant's want of care — is
      also required in PEL cases generally (*Woolcock Street Investments v CDG*), assessed through the same
      Hedley Byrne factors: known reliance, assumption of responsibility, and reasonable reliance given the
      subject matter, the occasion, the parties' relative positions and their capacity to exercise judgment.

      Exam use: for any negligent-advice fact pattern, run all four Hedley Byrne factors, then check separately
      whether the plaintiff was actually vulnerable — could they have protected themselves another way?
cases:
  - slug: donoghue-v-stevenson
    name: Donoghue v Stevenson
    citation: "[1932] AC 562"
    aglc: Donoghue v Stevenson [1932] AC 562
    facts: |
      In August 1928, Mrs Donoghue went with a friend to a café in Scotland for an ice-cream soda; the friend
      bought her the ice cream and a bottle of ginger beer. The ginger beer came in an opaque glass bottle bearing
      the manufacturer's name, David Stevenson. As the beer was poured into a tumbler, a decomposed snail floated
      out of the bottle. Donoghue suffered shock and severe gastro-enteritis and sued the manufacturer, with whom
      she had no contract (her friend had paid).
    issue: Whether a manufacturer of a product, with whom the ultimate consumer has no contract, can owe that consumer a duty of care in negligence.
    held: |
      The House of Lords, by a 3:2 majority, allowed Donoghue's appeal. A manufacturer who sells products intending
      them to reach the ultimate consumer in the form in which they left the manufacturer, with no reasonable
      possibility of intermediate examination, and knowing that a lack of reasonable care in preparing the product
      will injure the consumer, owes that consumer a duty to take reasonable care.
    ratio: |
      Lord Atkin's neighbour principle: a person must take reasonable care to avoid acts or omissions which they
      can reasonably foresee would be likely to injure their "neighbour" — a person so closely and directly
      affected by the act that the defendant ought reasonably to have them in contemplation when directing their
      mind to the act or omission in question.
    significance: Founding authority of the modern tort of negligence; established that a manufacturer owes consumers a duty of care independent of any contract between them.
    why-here: The starting point for every duty of care question this unit tests — the neighbour principle that every problem answer opens with before moving to categories or salient factors.
    verify: false
  - slug: grant-v-australian-knitting-mills
    name: Grant v Australian Knitting Mills
    citation: "[1936] AC 85"
    aglc: Grant v Australian Knitting Mills [1936] AC 85
    facts: |
      Dr Grant bought woollen underpants from a retailer who had purchased them from the manufacturer, Australian
      Knitting Mills. He wore them for a day and began to itch; within a week he developed dermatitis so severe
      that he spent seventeen weeks in hospital. The garments contained free sulphites, a chemical irritant left
      in through negligence in manufacturing, which was a hidden and latent defect not detectable by any
      reasonable examination. Grant won at trial, but the High Court held the evidence insufficient; he appealed
      to the Privy Council.
    issue: Whether the manufacturer of a product with a hidden defect owed the ultimate consumer a duty of care, applying Donoghue v Stevenson, and whether that principle extends beyond food or drink to garments worn externally.
    held: |
      The appeal was allowed. Applying Donoghue v Stevenson, the Privy Council held the manufacturer owed Dr Grant
      a duty of care: the case fell squarely within Lord Atkin's principle, the sulphites being a hidden defect
      like the snail in the opaque bottle. It was immaterial that the garment was worn externally rather than
      consumed internally, or that Dr Grant also had a contract claim against the retailer; the manufacturer's
      duty arises independently of contract, provided the product reaches the consumer with no reasonable
      possibility of intermediate examination.
    ratio: A manufacturer owes a duty of care to the ultimate consumer of its product wherever a hidden, undetectable defect caused by negligent manufacture reaches the consumer without any reasonable possibility of intermediate examination, regardless of whether the product is consumed internally or applied externally.
    significance: Confirms and extends the Donoghue v Stevenson manufacturer/consumer duty as an established category of duty of care.
    why-here: The standard second authority (after Donoghue) for the established manufacturer/consumer category of duty of care.
    verify: false
  - slug: chapman-v-hearse
    name: Chapman v Hearse
    citation: (1961) 106 CLR 112
    aglc: Chapman v Hearse (1961) 106 CLR 112
    facts: |
      A car driven by Chapman collided with another vehicle near an Adelaide intersection; Chapman's vehicle
      overturned and he was thrown onto the roadway, unconscious. Dr Cherry, driving a third car that stopped, went
      to aid the unconscious Chapman on a dark, wet night with poor visibility and no one to warn oncoming traffic.
      While attending to Chapman, Dr Cherry was struck by a car driven by Hearse and died of his injuries. Dr
      Cherry's executor sued Hearse, who joined Chapman as a third party claiming contribution.
    issue: Whether Chapman owed Dr Cherry a duty of care, given that Chapman could not have foreseen the precise sequence of events that led to Dr Cherry's death.
    held: |
      The High Court (Dixon CJ, Kitto, Taylor, Menzies and Windeyer JJ) dismissed Chapman's appeal against the
      order for contribution, rejecting his argument that he owed no duty of care to Dr Cherry. The test for the
      existence of a duty of care does not require reasonable foreseeability of the precise sequence of events or
      the precise manner in which the injury was sustained; it was enough that injury to a class of persons of
      which Dr Cherry was one — a person likely to render aid at the scene of a road accident — might reasonably
      have been foreseen as a consequence of the collision.
    ratio: To establish a duty of care, it is not necessary to show that the precise manner in which the plaintiff's injuries were sustained was reasonably foreseeable; it is sufficient that injury to a class of persons of which the plaintiff was one might reasonably have been foreseen as a consequence of the defendant's conduct.
    significance: Leading Australian authority on what "reasonable foreseeability" requires at the duty stage — foreseeability of a general class of harm and class of person, not of the exact chain of events.
    why-here: The go-to authority whenever a defendant argues they could not have foreseen the exact way an injury occurred.
    verify: false
  - slug: hedley-byrne-v-heller
    name: Hedley Byrne v Heller
    citation: "[1964] AC 465"
    aglc: Hedley Byrne v Heller [1964] AC 465
    facts: |
      Hedley Byrne, an advertising agency, asked its bank, National Provincial, to check the credit status of
      Easipower Ltd with Easipower's own bank, Heller & Partners. Heller gave a favourable credit reference, but
      expressly "without responsibility". Relying on that reference, Hedley Byrne extended credit to Easipower and
      suffered loss when Easipower went into liquidation. Hedley Byrne sued Heller for negligent misstatement.
    issue: Whether a duty of care can arise for negligent words causing pure economic loss (loss not derived from personal injury or property damage), and, if so, whether such a duty existed on these facts.
    held: |
      The House of Lords held that a duty of care can arise where careless advice or information causes pure
      economic loss, provided there is a special relationship between the parties involving a voluntary assumption
      of responsibility by the party giving the advice and reasonable reliance by the other party. On the facts,
      however, Hedley Byrne's claim failed because Heller had expressly disclaimed responsibility for the
      reference.
    ratio: A duty of care for negligent misstatement causing pure economic loss can arise where there is a special relationship between the parties — a voluntary assumption of responsibility by the adviser, reliance by the other party, and reasonableness of that reliance — but an effective disclaimer of responsibility negates the duty.
    significance: Founding authority for duty of care in negligent misstatement and pure economic loss, extending negligence beyond the Donoghue v Stevenson paradigm of physical injury or property damage.
    why-here: The authority for every negligent-advice or negligent-misstatement problem question; its four elements structure the whole analysis.
    verify: false
  - slug: sullivan-v-moody
    name: Sullivan v Moody
    citation: (2001) 207 CLR 562
    aglc: Sullivan v Moody (2001) 207 CLR 562
    facts: |
      A father was suspected of sexually abusing his daughter. A medical practitioner and social workers were
      alleged to have acted negligently in examining the child and investigating the possibility of abuse. No
      criminal charges were laid, but the investigation caused the breakdown of the family and, the father
      claimed, shock, distress, psychiatric injury and consequential financial loss. He sued the investigators,
      alleging they owed him a duty to exercise reasonable care in conducting the investigation.
    issue: Whether professionals investigating a suspicion of child sexual abuse owe a duty of care to the person under suspicion.
    held: |
      The High Court held the defendants owed the father no duty of care. If mere reasonable foreseeability of
      harm entailed legal liability, this would impose an intolerable burden of potential liability on those
      investigating abuse allegations and would result in negligence subverting other principles of law and
      statutory provisions designed to protect children. The Court considered the coherence of the law — the
      paramount duty to protect children's interests — and the difficulty of limiting the extent and potential
      indeterminacy of liability, since a duty could extend beyond the father to friends, teachers or anyone else
      suspected of abuse.
    ratio: A duty of care will not be recognised, however foreseeable the harm, where doing so would conflict with a duty owed under other legal principles or statute, would create indeterminate liability, or would threaten the coherence of the law.
    significance: Leading authority on the policy factors — coherence, indeterminacy and conflicting duties — that can negate a duty of care in a novel case.
    why-here: The key authority for arguing that policy factors defeat a duty of care despite foreseeable harm, especially in child-protection or third-party investigation scenarios.
    verify: false
  - slug: caltex-refineries-pty-ltd-v-stavar
    name: Caltex Refineries (Qld) Pty Ltd v Stavar
    citation: (2009) 75 NSWLR 649
    aglc: Caltex Refineries (Qld) Pty Ltd v Stavar (2009) 75 NSWLR 649
    facts: |
      Mrs Stavar's husband was exposed to asbestos while working at an oil refinery. When Mrs Stavar washed his
      contaminated work clothes at home, she was exposed to asbestos dust and later developed cancer. Because
      Mrs Stavar was not the refinery's employee, but the employee's wife, the case fell outside the established
      employer/employee category of duty.
    issue: Whether an employer owes a duty of care to a person outside the established employer/employee relationship — here, an employee's spouse exposed to asbestos through home laundering of contaminated work clothes.
    held: |
      The NSW Court of Appeal held that a duty of care could be found on the facts, applying the "salient
      features" approach because the case was novel. The Court set out a non-exhaustive list of salient factors
      relevant to whether a duty should be recognised, including foreseeability, control, vulnerability, reliance,
      assumption of responsibility, proximity, the category of relationship, the nature and danger of the
      defendant's activity, the defendant's knowledge, indeterminacy of liability, and coherence with statute and
      the common law.
    ratio: Where a case is novel — falling outside an established category of relationship — Australian courts determine whether a duty of care exists by weighing a non-exhaustive list of "salient features" of the relationship between the parties, rather than by reasonable foreseeability alone.
    significance: Leading NSW Court of Appeal authority setting out the salient features approach used in every novel duty of care case in Australia.
    why-here: The authority that supplies the actual list of salient factors to work through whenever a duty of care problem falls outside an established category.
    verify: false
  - slug: perre-v-apand-pty-ltd
    name: Perre v Apand Pty Ltd
    citation: (1999) 198 CLR 180
    aglc: Perre v Apand Pty Ltd (1999) 198 CLR 180
    facts: Not detailed in the week's materials beyond the proposition it establishes about duty of care for pure economic loss.
    issue: Whether reasonable foreseeability of pure economic loss is, by itself, sufficient to justify imposing a duty of care in respect of that loss.
    held: The High Court held that reasonable foreseeability of economic loss is necessary, but is not by itself sufficient to justify imposing a duty of care regarding that loss.
    ratio: Reasonable foreseeability of pure economic loss is a necessary but not sufficient condition for a duty of care; additional factors (such as vulnerability) must also be shown.
    significance: Leading High Court authority establishing that pure economic loss claims require more than reasonable foreseeability alone.
    why-here: Cited for the proposition that foreseeability of economic loss is necessary but never enough on its own — the springboard into the extra PEL requirements.
    verify: true
  - slug: woolcock-street-investments-pty-ltd-v-cdg-pty-ltd
    name: Woolcock Street Investments Pty Ltd v CDG Pty Ltd
    citation: (2004) 216 CLR 515
    aglc: Woolcock Street Investments Pty Ltd v CDG Pty Ltd (2004) 216 CLR 515
    facts: Not detailed in the week's materials beyond the proposition it establishes about vulnerability in pure economic loss cases.
    issue: What additional requirement, beyond reasonable foreseeability, a plaintiff must show to establish a duty of care for pure economic loss.
    held: The High Court (Gleeson CJ, Gummow, Hayne and Heydon JJ) held that vulnerability of the plaintiff — an inability to protect themselves from the defendant's lack of reasonable care — is an important requirement in cases involving pure economic loss.
    ratio: A plaintiff claiming a duty of care for pure economic loss must show vulnerability — that they were unable to protect themselves from the defendant's want of reasonable care — in addition to reasonable foreseeability of the loss.
    significance: Establishes vulnerability as a distinct, necessary requirement for duty of care in pure economic loss cases, later confirmed in ABN AMRO Bank NV v Bathurst Regional Council (2014) 224 FCR 1.
    why-here: The authority for the vulnerability requirement that must be checked separately from the Hedley Byrne factors in any pure economic loss problem.
    verify: true
authorities:
  - slug: civil-liability-act-2002-nsw-s5a
    title: Civil Liability Act 2002 (NSW) s 5A
    kind: statute
    text: |
      Application of Part: (1) This Part applies to any claim for damages for harm resulting from negligence,
      regardless of whether the claim is brought in tort, in contract, under statute or otherwise. (2) This Part
      does not apply to civil liability that is excluded from the operation of this Part by section 3B.
    gloss: The negligence Part of the CLA applies to any damages claim for harm caused by negligence, in whatever cause of action it is framed, unless s 3B excludes that liability from the Part altogether.
    cases: []
    verify: false
  - slug: civil-liability-act-2002-nsw-s3b
    title: Civil Liability Act 2002 (NSW) s 3B
    kind: statute
    text: |
      Civil liability excluded from Act: (1) The provisions of this Act do not apply to or in respect of civil
      liability (and awards of damages in those proceedings) as follows — (a) civil liability of a person in
      respect of an intentional act that is done by the person with intent to cause injury or death or that is
      sexual assault or other sexual misconduct committed by the person — the whole Act except [Part 1B, and
      specified sections and Parts]; (b) civil liability in proceedings for damages for dust diseases — the whole
      Act except sections 15A, 15B and 18(1) (in its application to certain losses); ... (g) civil liability for
      compensation under the Workers Compensation Act 1987 [and related workers' compensation legislation] — the
      whole Act.
    gloss: Several categories of civil liability are excluded from the Civil Liability Act altogether (or almost altogether) and remain governed by the common law or other legislation — most importantly for this unit, intentional acts done with intent to cause injury or death, sexual assault or misconduct, dust diseases claims, and claims covered by workers' compensation legislation.
    cases: []
    verify: false
  - slug: civil-liability-act-2002-nsw-s5
    title: Civil Liability Act 2002 (NSW) s 5
    kind: statute
    text: |
      Definitions: In this Part — harm means harm of any kind, including the following — (a) personal injury or
      death, (b) damage to property, (c) economic loss. negligence means failure to exercise reasonable care and
      skill. personal injury includes — (a) pre-natal injury, and (b) impairment of a person's physical or mental
      condition, and (c) disease.
    gloss: The CLA's definition of "harm" for the negligence Part expressly includes economic loss alongside personal injury, death and property damage, which is why a claim for pure economic loss is still a claim for "harm resulting from negligence" under s 5A.
    cases:
      - perre-v-apand-pty-ltd
      - woolcock-street-investments-pty-ltd-v-cdg-pty-ltd
    verify: false
questions:
  - key: neg01
    type: mcq
    concept: negligence-elements-overview
    difficulty: 1
    set: pretest
    stem: |
      Which of the following best explains why a plaintiff suing in negligence must prove they suffered damage, unlike a plaintiff suing in battery?
    options:
      - text: |
          Negligence is an action on the case, so damage is an essential element; battery is actionable per se and needs no proof of loss.
        correct: true
        why: |
          This tracks the materials directly: negligence is an action on the case, so damage is vital to found the claim, unlike trespass to the person torts.
      - text: |
          Negligence claims are always brought under statute, and statutes always require proof of financial loss before damages can be awarded.
        correct: false
        why: |
          Negligence is a common law tort modified by statute, not a purely statutory cause of action, and the damage requirement comes from it being an action on the case.
      - text: |
          Battery claims are heard in a different court that does not require the plaintiff to prove any element of the tort at all.
        correct: false
        why: |
          Both torts are heard in the same courts, and battery still requires proof of its own elements — it simply does not require proof of damage.
      - text: |
          There is no real difference; both torts require proof of damage to the same extent before liability can be established.
        correct: false
        why: |
          This is wrong — battery is actionable per se, so the plaintiff need not prove any damage, which is precisely the contrast the question asks about.
  - key: neg02
    type: mcq
    concept: negligence-elements-overview
    difficulty: 1
    stem: |
      What are the three elements a plaintiff must prove to succeed in an action for negligence?
    options:
      - text: |
          Duty of care, breach of that duty, and that the breach caused the plaintiff compensable harm.
        correct: true
        why: |
          This is the three-element structure given in the materials: duty, breach, and causation of compensable harm.
      - text: |
          Intention, directness of the interference, and a positive voluntary act by the defendant.
        correct: false
        why: |
          These are elements of the intentional torts to the person, not negligence, which does not require intention or directness at all.
      - text: |
          Possession of the damaged property, a demand for its return, and a wrongful refusal by the defendant.
        correct: false
        why: |
          These describe detinue, an entirely different tort concerned with wrongful detention of goods, not negligence.
      - text: |
          Malice, absence of reasonable and probable cause, and termination of proceedings.
        correct: false
        why: |
          These are the elements of malicious prosecution, an action on the case for intentional harm, not the tort of negligence.
  - key: neg03
    type: mcq
    concept: negligence-elements-overview
    difficulty: 2
    variant-of: neg02
    stem: |
      A student's exam answer states: "the plaintiff must show the defendant caused the harm, and that's the whole test." What is missing from this statement?
    options:
      - text: |
          It omits duty of care and breach — causation is only the third of three elements, not the whole test.
        correct: true
        why: |
          Causation is only the final element; without first establishing a duty and a breach of that duty, causation alone cannot found liability.
      - text: |
          Nothing is missing — causation is genuinely the only element negligence requires the plaintiff to prove.
        correct: false
        why: |
          This is incorrect; the materials set out three distinct elements, and duty and breach must each be proven before causation is even relevant.
      - text: |
          It should have referred to intention instead of causation, since intention is the only element that matters.
        correct: false
        why: |
          Negligence does not require intention at all; substituting intention for causation would misstate the tort entirely.
      - text: |
          It is missing a reference to consent, which negligence claims must always address before anything else.
        correct: false
        why: |
          Consent is a defence relevant to some torts and some negligence scenarios, but it is not one of the three core elements of negligence itself.
  - key: neg04
    type: mcq
    concept: negligence-elements-overview
    difficulty: 2
    stem: |
      Under s 5A of the Civil Liability Act 2002 (NSW), when does the negligence Part of the Act apply to a claim?
    options:
      - text: |
          To any claim for damages for harm resulting from negligence, whether brought in tort, contract, statute or otherwise, unless excluded by s 3B.
        correct: true
        why: |
          This mirrors s 5A(1)–(2) precisely: the Part applies broadly across causes of action, subject only to the s 3B exclusions.
      - text: |
          Only to claims brought specifically in the tort of negligence, and never to any claim framed in contract.
        correct: false
        why: |
          Section 5A(1) expressly extends to claims brought in contract, under statute or otherwise, not only claims pleaded as the tort of negligence.
      - text: Only to claims for economic loss, since physical and psychiatric injury are dealt with entirely by the common law, in every jurisdiction across Australia.
        correct: false
        why: |
          Section 5A applies to harm resulting from negligence generally, which includes personal injury and property damage, not economic loss alone.
      - text: |
          To every civil claim whatsoever, including those excluded from the Act by section 3B.
        correct: false
        why: |
          Section 5A(2) specifically states the Part does not apply to civil liability excluded by s 3B, so this option gets the exclusion backwards.
  - key: neg05
    type: mcq
    concept: negligence-elements-overview
    difficulty: 3
    cases: []
    stem: |
      A plaintiff was assaulted by a stranger, with clear evidence the stranger intended to injure her. Applying s 3B of the Civil Liability Act, does the Act apply to her claim?
    options:
      - text: |
          No — s 3B excludes civil liability for an intentional act done with intent to cause injury or death from most of the Act.
        correct: true
        why: |
          Section 3B(1)(a) excludes intentional acts done with intent to cause injury or death from the operation of most of the Act, so the common law governs instead.
      - text: |
          Yes — the CLA applies to every tort claim in New South Wales without any exceptions whatsoever.
        correct: false
        why: |
          This ignores s 3B, which carves out several categories, including intentional acts intended to cause injury or death, from most of the Act's operation.
      - text: Yes, but only if the plaintiff also suffered some form of economic loss in addition to the physical injury, regardless of the specific facts of the case at hand.
        correct: false
        why: |
          The exclusion in s 3B turns on the defendant's intent to injure, not on whether the plaintiff also suffered economic loss.
      - text: |
          No — the Act never applies to any claim brought by an individual person against another individual person.
        correct: false
        why: |
          This is far too broad; the CLA applies to many individual-versus-individual negligence claims, such as ordinary road accidents.
  - key: neg06
    type: mcq
    concept: negligence-elements-overview
    difficulty: 2
    variant-of: neg05
    stem: |
      A worker's claim for an asbestos-related dust disease is being assessed. Applying s 3B, is the Civil Liability Act's negligence Part the relevant regime?
    options:
      - text: |
          No — s 3B excludes dust diseases claims from most of the Act, leaving them to the common law or other legislative regimes.
        correct: true
        why: |
          Section 3B(1)(b) specifically excludes dust diseases proceedings from most of the Act, consistent with the materials' list of excluded categories.
      - text: Yes — dust diseases are the paradigm case the CLA's negligence Part was drafted to cover in full detail, even where the parties raise no dispute about the point.
        correct: false
        why: |
          This is the opposite of the position; dust diseases are one of the categories s 3B specifically excludes from most of the Act.
      - text: |
          Yes, provided the worker can show the exposure occurred while driving a work vehicle on a public road.
        correct: false
        why: |
          The motor vehicle exception is unrelated to dust diseases claims, which are excluded under a separate paragraph of s 3B.
      - text: |
          It depends entirely on whether the employer intended to cause the worker's illness.
        correct: false
        why: |
          The dust diseases exclusion in s 3B does not turn on intent at all; it applies to dust diseases proceedings regardless of the employer's state of mind.
  - key: neg07
    type: mcq
    concept: negligence-elements-overview
    difficulty: 2
    stem: |
      Which of the following areas remains modified by the Civil Liability Act at the duty of care stage, according to the materials?
    options:
      - text: |
          Public authorities, mental harm, recreational activities, professional negligence, intoxication and criminal enterprise.
        correct: true
        why: |
          This is the exact list the materials give of specific circumstances in which the common law duty of care is modified by the CLA.
      - text: |
          Every category of negligence claim, since the CLA has fully replaced the common law test for duty of care.
        correct: false
        why: |
          The materials state duty of care remains common law, modified only in specific circumstances — the CLA has not replaced it wholesale.
      - text: |
          Only claims involving manufacturers and consumers, because that is the paradigm case in negligence.
        correct: false
        why: |
          Manufacturer/consumer claims are an established category governed by ordinary common law duty principles, not one of the CLA's specific modifications.
      - text: Only claims brought against solicitors, since legal professional negligence is uniquely regulated by statute.
        correct: false
        why: |
          Professional negligence generally is one listed area, but the list is broader and is not limited to solicitors specifically.
  - key: neg08
    type: mcq
    concept: negligence-elements-overview
    difficulty: 2
    stem: |
      According to the materials, which elements of negligence have been codified or modified by the Civil Liability Act, rather than left to the common law alone?
    options:
      - text: |
          Breach (ss 5B and 5C) and causation (ss 5D and 5E).
        correct: true
        why: |
          The materials state breach and causation have been codified or modified by these specific sections, while duty remains mainly common law.
      - text: |
          Duty of care in every context, which is now determined solely by reading the Act's text.
        correct: false
        why: |
          Duty of care remains largely a common law doctrine; the CLA modifies it only in specific circumstances, not universally.
      - text: |
          Remedies only, since the CLA is concerned exclusively with capping damages awards.
        correct: false
        why: |
          The CLA does affect some remedies, but the materials specifically identify breach and causation, not remedies, as codified by ss 5B–5E.
      - text: |
          Nothing — the common law principles have been entirely superseded and are no longer relevant to interpreting the Act.
        correct: false
        why: |
          The materials say common law principles remain relevant to interpreting these CLA sections, so they have not been superseded.
  - key: neg09
    type: mcq
    concept: negligence-elements-overview
    difficulty: 3
    stem: |
      A plaintiff suffers only minor property damage from a defendant's careless driving, with no personal injury or economic loss. Is this capable of being compensable harm in negligence?
    options:
      - text: |
          Yes — the plaintiff suffering compensable harm includes physical injury, psychiatric injury and economic loss, and property damage is treated as physical harm.
        correct: true
        why: |
          The overview of negligence includes damage to property among the recognised heads of compensable harm, alongside personal injury and economic loss.
      - text: No — negligence only ever compensates personal injury to the plaintiff's own body, never damage to property, without needing any further supporting evidence from either party.
        correct: false
        why: |
          This is incorrect; property damage is one of the recognised forms of harm in negligence, as shown by cases like Grant v Australian Knitting Mills.
      - text: |
          No — property damage can only ever be recovered through the tort of conversion, never through negligence.
        correct: false
        why: |
          Conversion is a separate, strict liability tort for dealing with goods; negligently caused property damage is squarely within negligence too.
      - text: |
          Yes, but only if the property damaged is a motor vehicle involved in a registered accident.
        correct: false
        why: |
          There is no such restriction; property damage of any kind caused by negligence can found a claim, not only motor vehicle damage.
  - key: neg10
    type: mcq
    concept: negligence-elements-overview
    difficulty: 1
    stem: |
      True or false framing aside — which statement about negligence and reasonable foreseeability is accurate according to the overview?
    options:
      - text: |
          Reasonable foreseeability is required for duty of care, but not always sufficient.
        correct: true
        why: |
          This is exactly how the materials frame the relationship between foreseeability and duty of care in the overview of negligence.
      - text: |
          Reasonable foreseeability is only relevant to breach of duty, and plays no role at all in whether a duty of care exists.
        correct: false
        why: |
          Foreseeability is central to the existence of duty itself, via the neighbour principle, not just to breach.
      - text: |
          Reasonable foreseeability, once shown, is always sufficient on its own to establish that a duty of care exists.
        correct: false
        why: |
          The materials expressly say foreseeability is required but not always sufficient — novel cases need more, such as salient factors.
      - text: |
          Reasonable foreseeability has been abolished as a requirement since the Civil Liability Act was enacted.
        correct: false
        why: |
          Foreseeability remains a live common law requirement for duty of care; the CLA has not abolished it.
  - key: neg11
    type: mcq
    concept: negligence-elements-overview
    difficulty: 3
    contrasts-with:
      - duty-of-care-and-pure-economic-loss
    stem: |
      A pedestrian is hit by a careless driver and suffers a broken leg. A separate plaintiff loses a lucrative contract because of a negligent credit reference. Which of these plaintiffs faces the lower threshold to establish duty of care, and why?
    options:
      - text: |
          The pedestrian — physical injury from a driver's carelessness usually falls within an established category, needing only reasonable foreseeability.
        correct: true
        why: |
          Physical injury cases like driver/road-user fall within the paradigm and established categories, so only reasonable foreseeability is generally required, unlike pure economic loss claims.
      - text: |
          The credit reference recipient — economic loss claims only ever require proof that some loss occurred, nothing more.
        correct: false
        why: |
          This is the reverse of the true position; economic loss claims need extra elements such as assumption of responsibility, reliance and vulnerability.
      - text: Both face exactly the same threshold, because the neighbour principle applies identically regardless of the type of harm suffered.
        correct: false
        why: |
          While foreseeability is a common starting point for both, pure economic loss claims require additional elements the physical injury claim does not.
      - text: |
          Neither — duty of care thresholds depend only on the defendant's insurance status, not on the type of harm suffered.
        correct: false
        why: |
          Insurance status is irrelevant to whether a duty of care is owed; the relevant distinction is the type of harm and whether it falls within an established category.
  - key: neg12
    type: mcq
    concept: negligence-elements-overview
    difficulty: 2
    stem: |
      Which of these is NOT one of the three elements a plaintiff must establish in an ordinary negligence claim?
    options:
      - text: |
          That the defendant's conduct was reckless or grossly careless, rather than merely careless.
        correct: true
        why: |
          Ordinary negligence only requires a failure to meet the standard of reasonable care — recklessness or gross carelessness is not itself a required element.
      - text: |
          That the defendant owed the plaintiff a duty of care.
        correct: false
        why: |
          This is the first of the three required elements, so it is wrongly excluded by this option's framing of the question.
      - text: |
          That the defendant breached that duty of care.
        correct: false
        why: |
          Breach is the second required element of negligence, so this option is also wrongly excluded by the question's framing.
      - text: That the breach caused the plaintiff compensable harm, which the courts have consistently treated as a settled proposition.
        correct: false
        why: |
          Causation of compensable harm is the third required element, so this too is wrongly excluded by the question's framing.
  - key: neg13
    type: mcq
    concept: negligence-elements-overview
    difficulty: 3
    stem: |
      A claim alleges the defendant's careless act caused pure economic loss but no personal injury or property damage at all. Under s 5 of the Civil Liability Act, is this still "harm resulting from negligence" for the purposes of s 5A?
    options:
      - text: |
          Yes — s 5's definition of harm expressly includes economic loss alongside personal injury, death and property damage.
        correct: true
        why: |
          Section 5 defines harm to include economic loss as a distinct category, so a pure economic loss claim is still "harm resulting from negligence" under s 5A.
      - text: |
          No — the CLA's definition of harm is limited to personal injury and property damage only, excluding economic loss entirely.
        correct: false
        why: |
          This misstates s 5, which explicitly lists economic loss as one of the three forms of harm covered by the definition.
      - text: |
          No — economic loss can never be the subject of an action in negligence under Australian law.
        correct: false
        why: |
          Economic loss is recoverable in negligence, subject to extra requirements, and the CLA's own definition of harm confirms this.
      - text: |
          Yes, but only if the economic loss is also accompanied by some form of psychiatric injury to the plaintiff.
        correct: false
        why: |
          Section 5's definition of harm treats economic loss as its own category; it does not require accompanying psychiatric injury.
  - key: neg14
    type: mcq
    concept: negligence-elements-overview
    difficulty: 1
    variant-of: neg01
    stem: |
      Why does a negligence plaintiff need to prove they suffered harm, when a battery plaintiff does not?
    options:
      - text: |
          Because negligence is an action on the case, where damage is an essential element of the cause of action itself.
        correct: true
        why: |
          This is the structural reason given in the materials: negligence, unlike trespass, is an action on the case, making damage essential.
      - text: |
          Because battery claims are always settled out of court, so damage is never formally tested in that tort.
        correct: false
        why: |
          Battery claims are litigated like any other tort; the reason damage is not required is that it is actionable per se, not because it settles early.
      - text: Because negligence claims are decided by juries, while battery claims are always decided by a judge alone, a position the courts have maintained for many decades.
        correct: false
        why: |
          Trial procedure does not explain the substantive difference; the difference is that negligence is an action on the case requiring proof of damage.
      - text: |
          Because negligence claims can only be brought by corporations, which must always show a quantifiable loss.
        correct: false
        why: |
          Negligence claims can be brought by any plaintiff, individual or corporate; the damage requirement flows from the nature of the tort, not the plaintiff's identity.
  - key: neg15
    type: mcq
    concept: negligence-elements-overview
    difficulty: 2
    stem: |
      A defendant argues: "the plaintiff cannot sue me in negligence because I never intended to hurt anyone." Is this a valid defence?
    options:
      - text: |
          No — negligence does not require intention; it requires only a failure to exercise reasonable care that causes compensable harm.
        correct: true
        why: |
          Negligence is defined by a failure to meet an objective standard of care, not by the defendant's subjective intention to cause harm.
      - text: |
          Yes — without proof of intention to harm, no tort of any kind can ever be established against the defendant.
        correct: false
        why: |
          Many torts, including negligence, do not require intention at all; intention is relevant to the intentional torts, not to negligence.
      - text: |
          Yes, but only if the defendant can also show they took out an insurance policy covering the incident.
        correct: false
        why: |
          Insurance is irrelevant to whether the elements of negligence are established; it may affect who ultimately pays, not liability itself.
      - text: No, but only because intention is presumed against every defendant in a negligence claim by operation of law.
        correct: false
        why: |
          There is no such presumption of intention in negligence; the tort simply does not require intention as an element at all.
  - key: neg16
    type: mcq
    concept: negligence-elements-overview
    difficulty: 3
    cases: []
    stem: |
      Which of the following correctly orders the analysis an ILAC answer on a negligence problem question should generally follow?
    options:
      - text: |
          Identify the issue; establish duty of care; establish breach; establish causation and scope of liability; then conclude.
        correct: true
        why: |
          This mirrors the three-element structure in the materials and the standard ILAC sequence for negligence problem answers.
      - text: |
          Identify the issue; establish causation; establish breach; establish duty of care; then conclude.
        correct: false
        why: |
          This reverses the logical order — duty of care must be established before breach and causation are even meaningful questions.
      - text: |
          Identify the issue; discuss remedies; establish duty of care; establish breach; then conclude.
        correct: false
        why: |
          Remedies are addressed only after liability (duty, breach, causation) is established, not before duty of care is even discussed.
      - text: |
          Identify the issue; establish breach; establish duty of care; discuss defences; then conclude without discussing causation.
        correct: false
        why: |
          This omits causation entirely and puts breach before duty, both of which depart from the required three-element structure.
  - key: neg17
    type: truefalse
    concept: negligence-elements-overview
    difficulty: 1
    set: quickfire
    statement: |
      Negligence is actionable per se, so a plaintiff need not prove any damage to succeed.
    answer: false
    why: |
      Negligence is an action on the case, not actionable per se — the plaintiff must prove compensable harm to succeed, unlike trespass to the person.
  - key: neg18
    type: truefalse
    concept: negligence-elements-overview
    difficulty: 2
    set: quickfire
    statement: |
      Under s 3B of the Civil Liability Act, dust diseases claims are excluded from most of the Act's operation.
    answer: true
    why: |
      Section 3B(1)(b) excludes dust diseases proceedings from most of the Act, leaving them to be governed by other regimes.
  - key: neg19
    type: truefalse
    concept: negligence-elements-overview
    difficulty: 2
    set: quickfire
    statement: |
      Breach of duty and causation have both been codified or modified by specific sections of the Civil Liability Act.
    answer: true
    why: |
      The materials state breach is addressed by ss 5B and 5C, and causation by ss 5D and 5E, so both are codified or modified by the Act.
  - key: neg20
    type: truefalse
    concept: negligence-elements-overview
    difficulty: 1
    set: quickfire
    statement: |
      Reasonable foreseeability is sufficient, by itself, to establish a duty of care in every negligence case.
    answer: false
    why: |
      Foreseeability is always required but not always sufficient — novel cases require the additional salient features analysis before a duty is found.
  - key: neg21
    type: short
    concept: negligence-elements-overview
    difficulty: 2
    prompt: |
      Briefly explain the three elements a plaintiff must establish to succeed in an action for negligence, and explain why negligence requires proof of damage when trespass to the person does not.
    model: |
      A plaintiff in negligence must establish three elements: first, that the defendant owed them a duty of care; second, that the defendant breached that duty, by creating a foreseeable, not-insignificant risk of harm that a reasonable person would have taken precautions against; and third, that the breach caused the plaintiff compensable harm, assessed through factual causation and the scope of liability (whether it is appropriate that liability extend to that harm). Compensable harm may be physical, psychiatric or economic. Negligence requires proof of damage because it is classified as an action on the case, rather than an action in trespass. Trespass to the person torts, such as battery and assault, are actionable per se: the plaintiff need only prove the unlawful interference itself, because the law treats bodily integrity and liberty as interests worth protecting even where no measurable loss results. Negligence protects a broader and more diffuse range of interests, and imposing liability for merely careless conduct without any resulting harm would expose defendants to liability far beyond what is proportionate; damage is therefore built into the cause of action itself, so a defendant is not liable in negligence for careless conduct that, as it happens, causes no harm at all.
    rubric:
      - id: r1
        criterion: |
          States all three elements of negligence accurately
        marks: 2
        top-band: |
          Names duty, breach and causation correctly and briefly describes what each element requires.
        margin-note: |
          Good — clear three-part structure.
      - id: r2
        criterion: |
          Identifies negligence as an action on the case requiring proof of damage
        marks: 1
        top-band: |
          Explicitly connects the damage requirement to negligence's classification as an action on the case.
        margin-note: |
          Correctly links damage requirement to the cause of action's classification.
      - id: r3
        criterion: |
          Explains the contrast with trespass to the person being actionable per se
        marks: 1
        top-band: |
          Clearly explains that trespass protects bodily integrity/liberty without needing proof of loss, unlike negligence.
        margin-note: |
          Contrast well drawn — shows understanding of why the torts differ.
      - id: r4
        criterion: |
          Notes the range of compensable harm (physical, psychiatric, economic)
        marks: 1
        top-band: |
          Mentions at least two of the three recognised heads of compensable harm.
        margin-note: |
          Nice — shows awareness harm is not limited to physical injury.
  - key: nbr01
    type: mcq
    concept: neighbour-principle-and-duty-evolution
    difficulty: 1
    set: pretest
    cases:
      - donoghue-v-stevenson
    stem: |
      What is the "neighbour principle" established in Donoghue v Stevenson?
    options:
      - text: |
          You must take reasonable care to avoid acts or omissions you can reasonably foresee would be likely to injure your neighbour.
        correct: true
        why: |
          This is Lord Atkin's own formulation of the neighbour principle, the foundational statement of the modern duty of care.
      - text: |
          You owe a duty of care only to people with whom you have a direct contractual relationship.
        correct: false
        why: |
          Donoghue v Stevenson specifically rejected any requirement of privity of contract between the manufacturer and the injured consumer.
      - text: You owe a duty of care to every person in the world, regardless of any connection to your conduct.
        correct: false
        why: |
          The principle restricts liability to "neighbours" — those closely and directly affected — not to the world at large, which is far too broad.
      - text: |
          You are only liable in negligence if you specifically intended to cause the harm that resulted.
        correct: false
        why: |
          Negligence does not require intention; the neighbour principle is about foreseeability of careless conduct, not intent to harm.
  - key: nbr02
    type: mcq
    concept: neighbour-principle-and-duty-evolution
    difficulty: 2
    cases:
      - donoghue-v-stevenson
    stem: |
      What were the basic facts that gave rise to the claim in Donoghue v Stevenson?
    options:
      - text: |
          A decomposed snail was found in an opaque ginger beer bottle, and the person who drank from it became ill despite having no contract with the manufacturer.
        correct: true
        why: |
          This matches the facts exactly: Mrs Donoghue's friend bought the ginger beer, and Donoghue herself, without any contract with the manufacturer, became ill.
      - text: |
          A manufacturer knowingly sold underpants containing a chemical known to cause dermatitis to a retailer.
        correct: false
        why: |
          These are the facts of Grant v Australian Knitting Mills, a later case applying the neighbour principle, not Donoghue v Stevenson itself.
      - text: A bank gave a credit reference about a company that later went into liquidation, causing the recipient financial loss, irrespective of any argument the other party might raise in response.
        correct: false
        why: |
          These are the facts of Hedley Byrne v Heller, a much later case extending negligence to economic loss, not Donoghue v Stevenson.
      - text: |
          A driver's negligent driving caused a collision, and a doctor stopping to help was later struck by another car.
        correct: false
        why: |
          These are the facts of Chapman v Hearse, a case about the meaning of reasonable foreseeability at the duty stage, not Donoghue v Stevenson.
  - key: nbr03
    type: mcq
    concept: neighbour-principle-and-duty-evolution
    difficulty: 2
    variant-of: nbr02
    cases:
      - donoghue-v-stevenson
    stem: |
      Why was the absence of a contract between Mrs Donoghue and the ginger beer manufacturer significant to the outcome of her case?
    options:
      - text: |
          A duty of care can exist independently of any contract between the parties.
        correct: true
        why: |
          The House of Lords held the manufacturer owed Donoghue a duty despite no contract, establishing negligence as a distinct cause of action from contract.
      - text: |
          It meant Donoghue could not recover anything at all, because only her friend who paid could sue.
        correct: false
        why: |
          This is the opposite of the actual outcome — the majority allowed Donoghue's own claim precisely because negligence does not depend on contract.
      - text: |
          It made the case one of strict liability, so the manufacturer's care in manufacturing became irrelevant.
        correct: false
        why: |
          Negligence remained fault-based; the manufacturer's duty was to take reasonable care, not an absolute guarantee regardless of fault.
      - text: |
          It meant the claim had to be brought against the retailer instead of the manufacturer.
        correct: false
        why: |
          The claim succeeded against the manufacturer directly; the retailer's separate contractual liability to the purchaser was a distinct matter.
  - key: nbr04
    type: mcq
    concept: neighbour-principle-and-duty-evolution
    difficulty: 2
    cases:
      - grant-v-australian-knitting-mills
    stem: |
      In Grant v Australian Knitting Mills, why did the Privy Council hold that the manufacturer owed Dr Grant a duty of care?
    options:
      - text: |
          The sulphite defect was hidden and undetectable, and the garments reached him with no reasonable possibility of intermediate examination.
        correct: true
        why: |
          This is exactly the reasoning applying the Donoghue principle: a hidden, undetectable defect reaching the consumer unexamined founds the manufacturer's duty.
      - text: |
          Because Dr Grant had a direct contract with the manufacturer, giving rise to a contractual duty of care.
        correct: false
        why: |
          Dr Grant had no contract with the manufacturer — his contract was with the retailer — which is exactly why the claim had to be in tort.
      - text: Because the underpants were sold in sealed and stoppered packaging identical to the bottle in Donoghue v Stevenson, a conclusion that follows from first principles of the law of torts.
        correct: false
        why: |
          The Privy Council specifically rejected the argument that sealed packaging was essential, since the garments were merely in paper packets.
      - text: |
          Because Dr Grant could show the manufacturer specifically intended to cause him harm through the defect.
        correct: false
        why: |
          Negligence does not require intention to harm; liability turned on the manufacturer's failure to take reasonable care, not on any intent.
  - key: nbr05
    type: mcq
    concept: neighbour-principle-and-duty-evolution
    difficulty: 3
    variant-of: nbr04
    cases:
      - grant-v-australian-knitting-mills
    stem: |
      Suppose a customer had visibly inspected and tried on a garment before purchase, and a reasonable inspection would have revealed the defect. Applying Grant v Australian Knitting Mills, would the manufacturer's duty of care still be made out in the same way?
    options:
      - text: |
          No — the Grant principle turns on the defect being hidden with no reasonable possibility of intermediate examination, which a detectable defect would not satisfy.
        correct: true
        why: |
          Grant expressly required the defect to be hidden and unknown, with no reasonable possibility of intermediate examination — a detectable defect changes the analysis.
      - text: Yes — manufacturers owe an identical duty regardless of whether the defect could have been discovered by the consumer beforehand, which is consistent with the general structure of this area of the law.
        correct: false
        why: |
          This ignores the qualification central to Grant: the principle applies to hidden defects not discoverable by reasonable examination.
      - text: |
          Yes, but only because manufacturers are strictly liable for any defect in their products, detectable or not.
        correct: false
        why: |
          Manufacturers are not strictly liable in negligence; the duty is to take reasonable care, and detectability of the defect affects that analysis.
      - text: |
          No, because Grant v Australian Knitting Mills only ever applies to garments, not to any other category of consumer product.
        correct: false
        why: |
          Grant applies the general Donoghue manufacturer/consumer principle; it is not limited to garments as a category of product.
  - key: nbr06
    type: mcq
    concept: neighbour-principle-and-duty-evolution
    difficulty: 2
    cases:
      - hedley-byrne-v-heller
    stem: |
      What development did Hedley Byrne v Heller bring to the law of negligence from the 1960s onwards?
    options:
      - text: |
          It recognised that pure economic loss caused by careless words could found a duty of care.
        correct: true
        why: |
          Hedley Byrne extended negligence beyond the Donoghue paradigm of physical harm to pure economic loss caused by careless information or advice.
      - text: It held that manufacturers no longer owe consumers any duty of care unless there is a written contract, no matter how the facts of the particular case happen to unfold.
        correct: false
        why: |
          This misstates the case; Hedley Byrne is about negligent misstatement and economic loss, not about removing the manufacturer/consumer duty.
      - text: |
          It abolished the neighbour principle altogether in favour of a purely statutory test for duty of care.
        correct: false
        why: |
          The neighbour principle remained the starting point; Hedley Byrne added extra requirements for a specific new category of loss, not a replacement test.
      - text: |
          It held that banks can never be sued in negligence for any statement they make to a customer.
        correct: false
        why: |
          The opposite is true — Hedley Byrne held a bank-type defendant could in principle owe a duty for negligent statements, though this claim failed on its facts.
  - key: nbr07
    type: mcq
    concept: neighbour-principle-and-duty-evolution
    difficulty: 2
    stem: |
      What two-stage test did the House of Lords propose in Anns v Merton London Borough Council for establishing a duty of care?
    options:
      - text: |
          Whether there was a sufficient relationship of proximity or neighbourhood, and whether any policy considerations ought to negative or limit the duty.
        correct: true
        why: |
          This is the exact two-stage Anns test: proximity/neighbourhood first, then policy considerations that might limit or negate the duty.
      - text: |
          Whether the harm was foreseeable, and whether it would be fair, just and reasonable to impose a duty, with no proximity requirement at all.
        correct: false
        why: |
          This describes something closer to the later Caparo test, not Anns, and omits the proximity stage that was central to Anns.
      - text: |
          Whether the defendant had insurance, and whether the plaintiff could have avoided the harm by taking their own precautions.
        correct: false
        why: |
          Neither insurance nor the plaintiff's own precautions formed any part of the Anns test as described in the materials.
      - text: |
          Whether the case fell into an established category, and whether the salient features supported a duty of care.
        correct: false
        why: |
          This describes the modern Australian approach, developed after and instead of adopting Anns, not the Anns test itself.
  - key: nbr08
    type: mcq
    concept: neighbour-principle-and-duty-evolution
    difficulty: 2
    variant-of: nbr07
    stem: |
      What three-stage test did the House of Lords later propose in Caparo Industries plc v Dickman?
    options:
      - text: |
          Reasonably foreseeable harm; a relationship of proximity; and whether it is fair and reasonable to impose a duty in the circumstances.
        correct: true
        why: |
          This is the Caparo three-stage test exactly as given in the materials: foreseeability, proximity, and fairness/reasonableness.
      - text: |
          A sufficient relationship of proximity or neighbourhood, and whether any consideration ought to negative or limit the duty, with no third stage.
        correct: false
        why: |
          This is the earlier two-stage Anns test, which Caparo was proposed to replace, not the Caparo test itself.
      - text: |
          Foreseeability of harm, control by the defendant, and vulnerability of the plaintiff, with no proximity requirement.
        correct: false
        why: |
          These resemble some of the Australian salient factors, not the specific three stages the House of Lords set out in Caparo.
      - text: |
          Whether the defendant was a public authority, whether the plaintiff was a consumer, and whether damage occurred.
        correct: false
        why: |
          Caparo's test was not limited to public authorities or consumers; it proposed a general three-stage approach for duty of care questions.
  - key: nbr09
    type: mcq
    concept: neighbour-principle-and-duty-evolution
    difficulty: 3
    stem: |
      Have Australian courts adopted the Anns or Caparo tests for duty of care?
    options:
      - text: |
          No — Australian courts rejected the Anns approach in Sutherland Shire Council v Heyman, and the Caparo test has never been incorporated into Australian law.
        correct: true
        why: |
          The materials state plainly that Australian courts did not follow Anns, and that Caparo has never been incorporated into Australian negligence law.
      - text: |
          Yes — both tests were adopted in full by the High Court of Australia and remain the governing tests today.
        correct: false
        why: |
          This is the opposite of the position; neither UK test was adopted, and Australia developed its own proximity and salient-factors approaches instead.
      - text: Only the Anns test was adopted, while the Caparo test was expressly and formally overruled by the High Court.
        correct: false
        why: |
          Neither test was adopted in the first place; Caparo was simply never incorporated, rather than adopted and then overruled.
      - text: |
          Only the Caparo test was adopted, replacing the neighbour principle in Donoghue v Stevenson entirely.
        correct: false
        why: |
          Caparo was never incorporated into Australian law, and the neighbour principle from Donoghue remains the accepted starting point here.
  - key: nbr10
    type: mcq
    concept: neighbour-principle-and-duty-evolution
    difficulty: 3
    stem: |
      How did Deane J describe the role of "proximity" in Sutherland Shire Council v Heyman?
    options:
      - text: |
          A touchstone controlling the categories of case where a duty of care is owed.
        correct: true
        why: |
          This is Deane J's own description of proximity, quoted directly in the materials as the touchstone-and-control formulation.
      - text: |
          As an irrelevant historical concept that Australian courts should discard entirely in favour of reasonable foreseeability alone.
        correct: false
        why: |
          Deane J treated proximity as a significant limiting principle in the 1980s, not as something to be discarded outright.
      - text: |
          As a synonym for physical distance between the plaintiff and the defendant at the time of the incident.
        correct: false
        why: |
          Proximity indicators went well beyond mere physical distance, including reliance, assumption of responsibility and control.
      - text: |
          As a test that applies only to claims against public authorities, and never to private individuals.
        correct: false
        why: |
          Proximity as Deane J described it was a general organising principle for duty of care, not one confined to public authority defendants.
  - key: nbr11
    type: mcq
    concept: neighbour-principle-and-duty-evolution
    difficulty: 2
    stem: |
      Since the late 1990s, which approach has the High Court of Australia followed for deciding whether a duty of care exists?
    options:
      - text: |
          The "salient factors" approach, beginning with reasonable foreseeability and then weighing contextual factors relevant to the relationship.
        correct: true
        why: |
          The materials state the High Court has followed the salient factors approach since the late 1990s, replacing the earlier proximity-as-principle approach.
      - text: |
          The Caparo three-stage test, imported directly and without modification from English law.
        correct: false
        why: |
          Caparo was never incorporated into Australian law; the High Court instead developed its own salient factors approach.
      - text: |
          A strict rule that a duty of care can never arise outside an established category of relationship.
        correct: false
        why: |
          Novel duty situations can still give rise to a duty, using the salient factors approach, so established categories are not the only route to a duty.
      - text: The Anns two-stage test, applied consistently by Australian courts since it was first proposed in 1978, even where the parties raise no dispute about the point.
        correct: false
        why: |
          Australian courts rejected the Anns test in Sutherland Shire Council v Heyman rather than applying it consistently.
  - key: nbr12
    type: mcq
    concept: neighbour-principle-and-duty-evolution
    difficulty: 2
    stem: |
      Why does the High Court describe duty of care as "a contextual duty" rather than "a general duty"?
    options:
      - text: |
          Because the salient factors relevant to whether a duty arises depend on the specific relationship and circumstances of each case, not a single universal test.
        correct: true
        why: |
          The salient factors approach is expressly contextual — the factors and their weight vary with the relationship in question, rather than applying uniformly.
      - text: Because duty of care only ever applies to claims brought in New South Wales, and differs entirely in other Australian states, according to the general principles applied in this area of law.
        correct: false
        why: |
          Duty of care principles are common law principles that apply broadly across Australian jurisdictions, not a state-specific rule limited to NSW.
      - text: |
          Because a duty of care can be created or destroyed at will by any private contract between the parties.
        correct: false
        why: |
          Duty of care is a matter of law determined by the courts applying legal principles, not something the parties can simply contract into or out of at will.
      - text: |
          Because the concept of duty of care changes completely every time Parliament amends the Civil Liability Act.
        correct: false
        why: |
          Duty of care remains largely a common law doctrine; "contextual" refers to case-by-case factors, not to frequent statutory amendment.
  - key: nbr13
    type: mcq
    concept: neighbour-principle-and-duty-evolution
    difficulty: 3
    stem: |
      A manufacturer sells a bottled drink in a sealed container to a retailer, who sells it unopened to a consumer, who is injured by a hidden contaminant. Which historical case most directly supports finding a duty of care here?
    options:
      - text: |
          Donoghue v Stevenson — the neighbour principle applied to a manufacturer whose sealed product reached the consumer with no possibility of examination.
        correct: true
        why: |
          These facts mirror Donoghue v Stevenson closely: a sealed product, a hidden defect, and no contract between manufacturer and injured consumer.
      - text: |
          Sullivan v Moody — because any case involving a consumer product automatically falls within its reasoning about policy factors.
        correct: false
        why: |
          Sullivan v Moody concerns policy factors negating a duty in a child-abuse investigation context, not manufacturer/consumer product liability.
      - text: Caltex Refineries v Stavar — because the salient features approach is always the first port of call for any product liability claim, without needing any further supporting evidence from either party.
        correct: false
        why: |
          A straightforward manufacturer/consumer claim is an established category; the salient features approach is reserved for genuinely novel cases.
      - text: |
          Home Office v Dorset Yacht — because it establishes that manufacturers must always compensate consumers regardless of fault.
        correct: false
        why: |
          Dorset Yacht concerns a public authority's control over third parties who caused damage, not manufacturer liability, and does not impose strict liability.
  - key: nbr14
    type: mcq
    concept: neighbour-principle-and-duty-evolution
    difficulty: 1
    variant-of: nbr01
    cases:
      - donoghue-v-stevenson
    stem: |
      Which phrase best captures who counts as your "neighbour" under Lord Atkin's principle?
    options:
      - text: |
          Persons so closely and directly affected by your act that you ought reasonably to have them in contemplation.
        correct: true
        why: |
          This is Lord Atkin's own wording, defining "neighbour" by reference to who is closely and directly affected by the defendant's conduct.
      - text: |
          Anyone who happens to live physically next door to the defendant's place of business or residence.
        correct: false
        why: |
          "Neighbour" in this context is a legal metaphor about foreseeable effect, not a literal reference to physical next-door proximity.
      - text: Only people who have signed a written contract acknowledging the risk created by the defendant's conduct, as courts have consistently emphasised in later decisions.
        correct: false
        why: |
          The neighbour principle specifically operates independently of any contract between the parties, as Donoghue v Stevenson itself shows.
      - text: |
          Anyone the defendant personally knows or has previously met before the incident occurred.
