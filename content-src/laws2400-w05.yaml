        correct: false
        why: |
          This is the opposite of what Hedley Byrne held; it specifically recognised that careless words could found a duty of care in appropriate circumstances.
      - text: A duty of care automatically arises whenever one party gives information to another, without any further requirements, which the courts have consistently treated as a settled proposition.
        correct: false
        why: |
          Hedley Byrne imposed extra requirements — special relationship, assumption of responsibility, reliance and reasonableness — not an automatic duty.
      - text: |
