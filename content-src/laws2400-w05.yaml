          There was a relationship, mediated through the two banks; the claim failed because of the disclaimer, not the total absence of any relationship.
      - text: |
          Because economic loss can never be recovered in negligence under any circumstances in English law.
        correct: false
        why: |
          This misstates the very point Hedley Byrne established — that economic loss can be recovered in appropriate circumstances; the disclaimer defeated this particular claim.
  - key: pel04
    type: mcq
    concept: duty-of-care-and-pure-economic-loss
    difficulty: 2
    stem: |
      What four elements does the Hedley Byrne principle require, in addition to reasonable foreseeability, for a duty of care over negligent misstatement?
    options:
      - text: |
          A special relationship; a voluntary assumption of responsibility; the other party's reliance; and the reasonableness of that reliance.
        correct: true
        why: |
          These are exactly the four additional elements listed in the materials as required by the Hedley Byrne principle.
      - text: |
          A written contract; payment of a fee; a signed disclaimer; and proof the advice was given in person rather than in writing.
        correct: false
        why: |
          None of these are part of the Hedley Byrne test; the case specifically shows a duty can arise without any contract between the parties at all.
      - text: |
          Intention to deceive; malice; absence of reasonable and probable cause; and termination of proceedings favourably.
        correct: false
        why: |
          These are the elements of malicious prosecution, an entirely different action on the case, not the Hedley Byrne negligent misstatement principle.
      - text: |
          Directness; a positive act; fault; and no need to prove damage, since the tort is actionable per se.
        correct: false
        why: |
          These describe general principles of the intentional torts to the person, not the Hedley Byrne test for negligent misstatement, which does require proof of loss.
  - key: pel05
    type: mcq
    concept: duty-of-care-and-pure-economic-loss
    difficulty: 3
    cases:
      - perre-v-apand-pty-ltd
    stem: |
      What did Perre v Apand Pty Ltd establish about the relationship between foreseeability and duty of care for pure economic loss?
    options:
      - text: |
          Reasonable foreseeability of the loss is necessary but is not, by itself, sufficient to justify imposing a duty of care for pure economic loss.
        correct: true
        why: |
          This is the precise proposition the materials attribute to Perre v Apand: foreseeability is necessary but never enough on its own for PEL.
      - text: |
          Reasonable foreseeability is irrelevant to pure economic loss claims and plays no part in the analysis at all.
        correct: false
        why: |
          Foreseeability remains a necessary starting point even for PEL claims; Perre v Apand did not remove its relevance, only its sufficiency alone.
      - text: |
          Reasonable foreseeability of loss is both necessary and sufficient on its own for pure economic loss, unlike for physical injury.
        correct: false
        why: |
          This is the opposite of the actual holding — foreseeability alone is specifically said not to be sufficient for pure economic loss.
      - text: Reasonable foreseeability only matters for physical injury claims, and a completely different, unrelated test governs pure economic loss, something the courts have repeatedly confirmed in subsequent cases.
        correct: false
        why: |
          Foreseeability remains a necessary common thread across both types of claim; PEL simply requires additional elements on top of it.
  - key: pel06
    type: mcq
    concept: duty-of-care-and-pure-economic-loss
    difficulty: 2
    stem: |
      Why do courts require more than reasonable foreseeability before imposing a duty of care for pure economic loss?
    options:
      - text: |
          Because of the fear of liability in an indeterminate amount, and a disproportion between the defendant's blameworthiness and the potential extent of liability.
        correct: true
        why: |
          These are the two policy concerns the materials give for limiting duty of care in pure economic loss cases beyond mere foreseeability.
      - text: |
          Because economic loss is considered a less serious or less real kind of harm than physical injury, and therefore less deserving of protection.
        correct: false
        why: |
          The concern is not about the seriousness of economic loss as a category, but about the risk of indeterminate and disproportionate liability.
      - text: |
          Because economic loss is not included within the Civil Liability Act's definition of "harm".
        correct: false
        why: |
          Section 5 of the CLA expressly includes economic loss within the definition of harm, so this is not the reason for the extra limits.
      - text: |
          Because pure economic loss claims are always brought by large corporations who can afford to bear the loss themselves.
        correct: false
        why: |
          PEL claims can be brought by individuals as well as corporations (as Hedley Byrne itself shows); this is not the stated policy reason for the extra limits.
  - key: pel07
    type: mcq
    concept: duty-of-care-and-pure-economic-loss
    difficulty: 2
    cases:
      - woolcock-street-investments-pty-ltd-v-cdg-pty-ltd
    stem: |
      What extra requirement did Woolcock Street Investments v CDG establish for pure economic loss claims, beyond reasonable foreseeability?
    options:
      - text: |
          Vulnerability of the plaintiff — an inability to protect themselves from the defendant's lack of reasonable care.
        correct: true
        why: |
          This is exactly the vulnerability requirement the materials attribute to Woolcock Street Investments, later confirmed in ABN AMRO Bank v Bathurst Regional Council.
      - text: A signed written contract between the plaintiff and defendant specifying the exact scope of any advice given, irrespective of any argument the other party might raise in response.
        correct: false
        why: |
          Hedley Byrne itself shows a duty can arise without any contract; Woolcock's added requirement is vulnerability, not a written contract.
      - text: |
          Proof that the defendant was a government body rather than a private company or individual.
        correct: false
        why: |
          The vulnerability requirement applies generally to PEL claims and is not limited to claims against government defendants.
      - text: |
          Proof that the plaintiff suffered physical injury in addition to the economic loss claimed.
        correct: false
        why: |
          This would defeat the very purpose of a "pure" economic loss claim, which by definition involves no accompanying physical injury.
  - key: pel08
    type: mcq
    concept: duty-of-care-and-pure-economic-loss
    difficulty: 3
    stem: |
      How is "vulnerability" for the purposes of pure economic loss assessed, according to the materials?
    options:
      - text: |
          By reference to the same Hedley Byrne factors — known reliance, assumption of responsibility, and reasonable reliance given the circumstances.
        correct: true
        why: |
          The materials state vulnerability is established by considering the same factors identified in Hedley Byrne, linking the two requirements together.
      - text: |
          By reference solely to the plaintiff's personal wealth, with wealthier plaintiffs always treated as more vulnerable.
        correct: false
        why: |
          Wealth is not the test; vulnerability turns on the plaintiff's inability to protect themselves via reliance and assumption-of-responsibility style factors.
      - text: |
          By reference to whether the plaintiff is a natural person, since corporations can never be found vulnerable under this test.
        correct: false
        why: |
          The materials do not draw this distinction; vulnerability depends on the plaintiff's ability to protect themselves, not on whether they are incorporated.
      - text: |
          By reference to the length of time that has passed since the negligent conduct occurred.
        correct: false
        why: |
          The passage of time is not part of the vulnerability test described in the materials, which instead turns on reliance and self-protection factors.
  - key: pel09
    type: mcq
    concept: duty-of-care-and-pure-economic-loss
    difficulty: 2
    stem: |
      A prospective buyer relies on a building inspector's careless report and later discovers the building has hidden structural defects the report failed to identify, causing financial loss. Which of the following would defeat their claim under the Hedley Byrne principle?
    options:
      - text: |
          The buyer could have easily and cheaply obtained their own independent inspection instead of relying solely on the seller's report.
        correct: true
        why: |
          If the buyer could have protected themselves through independent inquiry, this undermines vulnerability and the reasonableness of reliance under Hedley Byrne.
      - text: |
          The building inspector charged a standard market fee for their inspection services.
        correct: false
        why: |
          Charging an ordinary fee for professional services does not, by itself, defeat a Hedley Byrne claim; the relevant question concerns reliance and vulnerability.
      - text: |
          The buyer read the report carefully before deciding whether to proceed with the purchase.
        correct: false
        why: |
          Carefully reading the report is consistent with reasonable reliance on it, not something that would defeat the claim.
      - text: The defect was not visible to the naked eye during an ordinary visual inspection of the property, which is consistent with the general structure of this area of the law.
        correct: false
        why: |
          A hidden, non-obvious defect supports rather than defeats a negligent misstatement claim, since it is exactly the kind of risk professional advice is meant to catch.
  - key: pel10
    type: mcq
    concept: duty-of-care-and-pure-economic-loss
    difficulty: 1
    stem: |
      Which of the following is an example of pure economic loss, rather than economic loss consequent on physical injury?
    options:
      - text: |
          A business loses profits after relying on a negligent credit reference about a trading partner, without suffering any physical injury or property damage.
        correct: true
        why: |
          This is a textbook pure economic loss scenario, mirroring Hedley Byrne — financial loss with no accompanying physical injury or property damage.
      - text: An injured worker loses wages while recovering from a physical injury caused by a defective machine at their workplace, no matter how the facts of the particular case happen to unfold.
        correct: false
        why: |
          This is economic loss consequent on physical injury (lost wages flowing from the injury), not pure economic loss.
      - text: |
          A homeowner pays for repairs to a fence damaged when a careless driver crashed into it.
        correct: false
        why: |
          The repair cost here flows from property damage, so it is economic loss consequent on property damage, not pure economic loss.
      - text: |
          A patient incurs medical expenses after a doctor's negligent treatment causes a physical injury.
        correct: false
        why: |
          Medical expenses following physical injury are economic loss consequent on personal injury, not pure economic loss.
  - key: pel11
    type: mcq
    concept: duty-of-care-and-pure-economic-loss
    difficulty: 3
    contrasts-with:
      - established-categories-of-duty
    stem: |
      Why does a claim for pure economic loss generally face a higher hurdle to establish a duty of care than a claim falling within an established category like manufacturer/consumer?
    options:
      - text: |
          Because PEL claims raise the risk of indeterminate and disproportionate liability that established categories like manufacturer/consumer do not typically raise in the same way.
        correct: true
        why: |
          The extra hurdles for PEL (assumption of responsibility, reliance, vulnerability) exist precisely because of indeterminacy and proportionality concerns not present in most established categories.
      - text: |
          Because pure economic loss is not actually recognised as a form of harm at all under Australian negligence law.
        correct: false
        why: |
          Pure economic loss is recognised as a form of harm — s 5 of the CLA expressly includes it — but recovering it requires extra elements beyond foreseeability.
      - text: |
          Because manufacturer/consumer claims never require the plaintiff to prove any form of reliance on the manufacturer at all.
        correct: false
        why: |
          Reliance can be relevant in some manufacturer/consumer scenarios too; the key distinguishing feature is the indeterminacy risk specific to economic loss.
      - text: Because courts consider economic loss claims to be brought only by dishonest or opportunistic plaintiffs seeking a windfall, a view that has never seriously been doubted by any Australian court.
        correct: false
        why: |
          Nothing in the materials suggests such a characterisation; the extra hurdles reflect genuine policy concerns about indeterminate liability, not assumptions about honesty.
  - key: pel12
    type: mcq
    concept: duty-of-care-and-pure-economic-loss
    difficulty: 2
    stem: |
      Under s 5 of the Civil Liability Act 2002 (NSW), is pure economic loss included within the statutory definition of "harm"?
    options:
      - text: |
          Yes — s 5 defines harm to include personal injury or death, damage to property, and economic loss.
        correct: true
        why: |
          Section 5's definition of harm expressly lists economic loss as one of three categories, alongside personal injury/death and property damage.
      - text: |
          No — s 5 defines harm to cover only personal injury or death and damage to property, excluding economic loss.
        correct: false
        why: |
          This misstates s 5, which explicitly includes economic loss as a third category within the definition of harm.
      - text: |
          Yes, but only economic loss suffered by a corporation, never economic loss suffered by an individual.
        correct: false
        why: |
          Section 5's definition of harm does not distinguish between corporate and individual plaintiffs; it defines the type of loss, not who suffers it.
      - text: |
          The Act is silent on this question entirely, leaving it to be determined case by case without any statutory definition.
        correct: false
        why: |
          Section 5 directly and expressly answers this question by including economic loss in its definition of harm.
  - key: pel13
    type: mcq
    concept: duty-of-care-and-pure-economic-loss
    difficulty: 2
    variant-of: pel02
    cases:
      - hedley-byrne-v-heller
    stem: |
      An accountant, knowing a client will show a set of accounts to a potential investor, carelessly prepares them so as to overstate the company's profits, causing the investor loss when they invest. Applying Hedley Byrne, could the accountant owe the investor a duty of care?
    options:
      - text: |
          Yes, if there was a special relationship, a voluntary assumption of responsibility, and reasonable reliance by the investor on the accounts.
        correct: true
        why: |
          These are exactly the Hedley Byrne conditions for a duty of care over negligent misstatement causing pure economic loss to a third party like an investor.
      - text: |
          No — an accountant can never owe a duty of care to anyone other than the client who directly engaged their services.
        correct: false
        why: |
          Hedley Byrne shows a duty can extend beyond the immediate client relationship where the Hedley Byrne conditions, including known reliance, are satisfied.
      - text: |
          Yes, automatically, simply because the investor ultimately lost money after making the investment.
        correct: false
        why: |
          Loss alone is not enough; the Hedley Byrne conditions (special relationship, assumption of responsibility, reliance, reasonableness) must also be satisfied.
      - text: No — pure economic loss caused by negligent accounting can never be recovered under Australian law in any circumstances, in every jurisdiction across Australia.
        correct: false
        why: |
          Negligent misstatement causing pure economic loss is recoverable where the Hedley Byrne conditions are met; this option overstates the limits on recovery.
  - key: pel14
    type: mcq
    concept: duty-of-care-and-pure-economic-loss
    difficulty: 1
    variant-of: pel01
    stem: |
      Which best distinguishes pure economic loss from ordinary economic loss recoverable alongside a personal injury claim?
    options:
      - text: |
          Pure economic loss is not consequent on any physical injury to the plaintiff or damage to their property, whereas ordinary economic loss (like lost wages) flows directly from such injury or damage.
        correct: true
        why: |
          This distinction is exactly how the materials define pure economic loss, separating it from loss that is a consequence of physical injury or property damage.
      - text: |
          Pure economic loss must always exceed a fixed statutory dollar threshold, unlike ordinary economic loss.
        correct: false
        why: |
          There is no such fixed dollar threshold in the materials; the distinction turns on whether the loss followed from physical injury or property damage, not its amount.
      - text: |
          Pure economic loss can only be claimed by companies, while ordinary economic loss can only be claimed by individuals.
        correct: false
        why: |
          Both types of loss can be claimed by individuals or companies; the distinction is about the nature of the loss, not who is claiming it.
      - text: |
          There is no real distinction between the two; the terms are simply two different names for the exact same concept.
        correct: false
        why: |
          The materials draw a clear and important distinction, since pure economic loss requires additional elements beyond mere foreseeability that ordinary consequential loss does not.
  - key: pel15
    type: mcq
    concept: duty-of-care-and-pure-economic-loss
    difficulty: 3
    stem: |
      A local council carelessly issues an inaccurate report about the size of a property boundary. A distant buyer, who never saw the report and made no inquiries of the council at all, later suffers loss when the true boundary is discovered. Applying Hedley Byrne and Woolcock Street Investments, is the council likely to owe the buyer a duty of care?
    options:
      - text: |
          Unlikely — without known reliance, an assumption of responsibility toward this buyer, or any vulnerability shown, the Hedley Byrne and Woolcock requirements are not met.
        correct: true
        why: |
          Since the buyer never saw or relied on the report, there is no reliance, no assumption of responsibility toward them specifically, and vulnerability is not established.
      - text: Very likely — foreseeability of some economic loss to buyers generally is enough on its own to establish a duty of care for pure economic loss, according to the general principles applied in this area of law.
        correct: false
        why: |
          Perre v Apand specifically holds foreseeability alone is not sufficient for pure economic loss; reliance, responsibility and vulnerability must also be shown.
      - text: |
          Certain — councils always owe an absolute duty of care to any person who might ever purchase property within their jurisdiction.
        correct: false
        why: |
          There is no such absolute duty in the materials; PEL duties depend on the specific Hedley Byrne and vulnerability requirements being satisfied on the facts.
      - text: |
          Impossible — public authorities can never owe a duty of care for pure economic loss under any circumstances whatsoever.
        correct: false
        why: |
          Public authorities are not given a blanket immunity from PEL duties in the materials; the outcome depends on whether the specific requirements are met, not the defendant's identity alone.
  - key: pel16
    type: mcq
    concept: duty-of-care-and-pure-economic-loss
    difficulty: 2
    stem: |
      Which of these best captures the two-step structure of a pure economic loss duty of care analysis, drawing on Hedley Byrne and Woolcock Street Investments?
    options:
      - text: |
          First, apply the Hedley Byrne factors (special relationship, assumption of responsibility, reliance, reasonableness); second, check separately whether the plaintiff was vulnerable.
        correct: true
        why: |
          This matches the structure the materials set out: the Hedley Byrne factors first, then a distinct vulnerability inquiry drawn from Woolcock Street Investments.
      - text: |
          First, apply the Caparo three-stage test; second, check whether the plaintiff is a natural person rather than a company.
        correct: false
        why: |
          Caparo has never been incorporated into Australian law, and the plaintiff's corporate status is not part of the recognised two-step structure.
      - text: |
          First, check whether the defendant has insurance; second, check whether the plaintiff could have sued in contract instead.
        correct: false
        why: |
          Neither insurance nor the availability of a contractual remedy forms the two-step structure described in the materials for PEL duty of care.
      - text: First, apply the salient features list from Caltex Refineries v Stavar in full; second, disregard reasonable foreseeability entirely, without needing any further supporting evidence from either party.
        correct: false
        why: |
          The materials specifically structure the PEL analysis around Hedley Byrne and vulnerability, and foreseeability remains a necessary starting point throughout.
  - key: pel17
    type: truefalse
    concept: duty-of-care-and-pure-economic-loss
    difficulty: 1
    set: quickfire
    statement: |
      Pure economic loss is economic loss that is not consequent upon any physical injury to person or property.
    answer: true
    why: |
      This is the exact definition given in the materials for pure economic loss, distinguishing it from loss that flows from physical injury or property damage.
  - key: pel18
    type: truefalse
    concept: duty-of-care-and-pure-economic-loss
    difficulty: 2
    set: quickfire
    statement: |
      Reasonable foreseeability of economic loss is, by itself, sufficient to establish a duty of care for pure economic loss.
    answer: false
    why: |
      Perre v Apand holds that reasonable foreseeability of economic loss is necessary but never sufficient on its own for a duty of care.
  - key: pel19
    type: truefalse
    concept: duty-of-care-and-pure-economic-loss
    difficulty: 2
    set: quickfire
    statement: |
      Hedley Byrne v Heller ultimately succeeded on its own facts, and Heller was held liable for the credit reference.
    answer: false
    why: |
      Although the House of Lords recognised a duty could arise, Hedley Byrne's own claim failed because Heller had disclaimed responsibility for the reference.
  - key: pel20
    type: truefalse
    concept: duty-of-care-and-pure-economic-loss
    difficulty: 2
    set: quickfire
    statement: |
      Vulnerability of the plaintiff, assessed using the Hedley Byrne factors, is a requirement generally recognised in pure economic loss cases.
    answer: true
    why: |
      Woolcock Street Investments established vulnerability as an important requirement for pure economic loss, assessed by the same factors identified in Hedley Byrne.
  - key: pel21
    type: short
    concept: duty-of-care-and-pure-economic-loss
    difficulty: 3
    prompt: |
      A financial adviser, knowing her client will rely on her advice to make a major investment decision, carelessly recommends an unsuitable investment, causing the client significant financial loss. Applying Hedley Byrne v Heller and the vulnerability requirement, advise on whether the adviser owed the client a duty of care.
    model: |
      This is a claim for pure economic loss — financial loss not consequent on any physical injury to the client or damage to their property — so more than reasonable foreseeability of the loss is required to establish a duty of care (Perre v Apand Pty Ltd). The starting point is the Hedley Byrne v Heller principle, which requires, in addition to foreseeability: a special relationship between the parties; a voluntary assumption of responsibility by the party giving the advice; the other party's reliance on that advice; and the reasonableness of that reliance. Here, the adviser has a professional relationship with the client and has voluntarily undertaken to advise her; she knew the client would rely on the recommendation to make the investment decision, satisfying known reliance; and, absent any disclaimer of responsibility (unlike Heller in Hedley Byrne itself, who disclaimed responsibility for its reference), she has assumed responsibility for the advice. The client's reliance appears reasonable, since seeking a financial adviser's specific recommendation before a major investment is precisely the kind of matter of serious consequence in which reliance on professional skill is expected. Beyond the Hedley Byrne factors, the client must also show vulnerability — an inability to protect herself from the adviser's want of care (Woolcock Street Investments Pty Ltd v CDG Pty Ltd). If the client had no independent means of assessing the investment's suitability and reasonably deferred to the adviser's specific expertise, she is likely to be found vulnerable. On these facts, a duty of care is likely to be owed, and the adviser's careless recommendation would then need to be assessed for breach and causation in the usual way.
    rubric:
      - id: r1
        criterion: |
          Identifies the claim as one for pure economic loss
        marks: 1
        top-band: |
          Correctly classifies the loss as pure economic loss, not consequent on physical injury or property damage.
        margin-note: |
          Correct classification at the outset.
      - id: r2
        criterion: |
          States and applies all four Hedley Byrne factors to the facts
        marks: 3
        top-band: |
          Applies special relationship, assumption of responsibility, reliance and reasonableness of reliance, each connected to the facts given.
        margin-note: |
          All four Hedley Byrne factors clearly applied.
      - id: r3
        criterion: |
          Applies the vulnerability requirement separately from the Hedley Byrne factors
        marks: 2
        top-band: |
          Explicitly checks vulnerability (inability to self-protect) as a distinct step, citing Woolcock Street Investments.
        margin-note: |
          Vulnerability correctly treated as a separate, additional requirement.
      - id: r4
        criterion: |
          Reaches a reasoned conclusion on duty of care
        marks: 1
        top-band: |
          Draws a clear, supported conclusion about whether a duty is likely to be owed on these facts.
        margin-note: |
          Clear, well-supported conclusion.
pretest:
