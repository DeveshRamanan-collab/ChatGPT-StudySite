  - key: nov20
    type: short
    concept: novel-duty-and-salient-features
    difficulty: 3
    prompt: |
      Compare how the salient features approach was applied in Sullivan v Moody and Caltex Refineries v Stavar, and explain what this comparison shows about how Australian courts decide novel duty of care cases.
    model: |
      Both cases involved relationships falling outside any established category, so both required the incremental, salient features approach rather than a simple classification exercise. In Sullivan v Moody, a father under investigation for suspected child abuse sued the medical practitioner and social workers who investigated the allegations. The High Court declined to find a duty of care, reasoning that recognising one would impose an intolerable burden on investigators, subvert statutory and common law principles protecting children, and risk indeterminate liability extending well beyond the father to friends, teachers or anyone else suspected of abuse. Coherence — the investigators' paramount duty to protect children's interests — weighed heavily against recognising a competing duty to the suspect. In Caltex Refineries v Stavar, by contrast, an employee's wife who developed cancer after washing her husband's asbestos-contaminated work clothes sued the employer, a relationship novel because it fell outside the established employer/employee category. The NSW Court of Appeal found a duty of care could be recognised, weighing factors such as the employer's control over the risk of asbestos exposure, Mrs Stavar's vulnerability and inability to protect herself, and the foreseeability of harm to someone in her position. Comparing the two shows that the salient features approach is not a fixed formula that produces the same answer whenever a case is novel: it is a genuinely contextual, fact-sensitive exercise in which the same broad list of factors can point toward opposite conclusions depending on how they weigh on the particular relationship and harm in question, and depending on which countervailing policy concerns, such as indeterminacy or coherence, are engaged by the facts.
    rubric:
      - id: r1
        criterion: |
          Accurately summarises the facts and outcome of Sullivan v Moody
        marks: 2
        top-band: |
          Correctly states the facts and that no duty was found, with the key policy reasons (burden, coherence, indeterminacy).
        margin-note: |
          Sullivan v Moody accurately summarised.
      - id: r2
        criterion: |
          Accurately summarises the facts and outcome of Caltex Refineries v Stavar
        marks: 2
        top-band: |
          Correctly states the facts and that a duty was found, referencing relevant salient factors (control, vulnerability).
        margin-note: |
          Caltex Refineries v Stavar accurately summarised.
      - id: r3
        criterion: |
          Draws a genuine comparison explaining the contextual nature of the salient features approach
        marks: 2
        top-band: |
          Explains that the same approach can produce opposite outcomes depending on how factors weigh on the facts.
        margin-note: |
          Strong comparative point — shows real understanding of the approach's flexibility.
  - key: pel01
