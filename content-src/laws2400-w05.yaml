        correct: false
        why: |
          This describes the breach inquiry (the response to a foreseeable, not-insignificant risk), not the remoteness inquiry about the kind of damage.
      - text: |
          Whether the defendant and plaintiff had a pre-existing contractual relationship before the incident occurred.
        correct: false
        why: |
          Contractual relationship is not part of any of the three foreseeability stages; duty of care can exist entirely independently of contract.
  - key: rfs17
    type: truefalse
    concept: reasonable-foreseeability-meaning
    difficulty: 1
    set: quickfire
    statement: |
      Chapman v Hearse held that a plaintiff must show the precise manner of their injury was reasonably foreseeable.
    answer: false
    why: |
      The Court held the opposite — it is enough that injury to a class of person including the plaintiff was reasonably foreseeable, not the exact manner of injury.
  - key: rfs18
    type: truefalse
    concept: reasonable-foreseeability-meaning
    difficulty: 2
    set: quickfire
    statement: |
      "Reasonable foreseeability" asks exactly the same question at the duty, breach and remoteness stages of negligence.
    answer: false
    why: |
      Glass JA explained the question changes at each stage, moving from the general (class of person, at duty) to the particular (kind of damage, at remoteness).
  - key: rfs19
    type: truefalse
    concept: reasonable-foreseeability-meaning
    difficulty: 2
    set: quickfire
    statement: |
      What is reasonably foreseeable can change over time as scientific knowledge of a particular risk develops.
    answer: true
    why: |
      The materials give the risk of asbestos exposure and the impact of climate change as examples of foreseeability shifting with scientific knowledge.
  - key: rfs20
    type: short
    concept: reasonable-foreseeability-meaning
    difficulty: 3
    prompt: |
      Using Chapman v Hearse and Glass JA's explanation, explain why "reasonable foreseeability" cannot be treated as a single, uniform test across a negligence claim.
    model: |
      Although the phrase "reasonable foreseeability" recurs throughout a negligence claim, it asks a different question at each of the three stages at which it appears, moving, in Glass JA's words, "from the general to the particular". At the duty stage, illustrated by Chapman v Hearse, the question is whether injury to a class of persons of which the plaintiff was one was reasonably foreseeable as a possibility — the emphasis is on the relationship between the parties, not on the precise sequence of events. In Chapman v Hearse itself, Chapman could not have foreseen the exact chain of events that led to Dr Cherry's death, but the High Court held this did not matter: it was enough that a collision on a dark, wet highway might foreseeably bring bystanders, such as a doctor rendering aid, into danger. At the breach stage, foreseeability instead focuses on the defendant's own conduct: whether the kind of carelessness charged against the defendant might foreseeably cause damage of some kind. At the remoteness stage, the focus shifts again, this time to the plaintiff's actual damage: whether the kind of damage suffered was itself a foreseeable outcome of that carelessness. Treating foreseeability as one uniform test would risk applying the wrong standard at the wrong stage — for example, wrongly requiring the precise manner of injury to be foreseeable at the duty stage, which Chapman v Hearse specifically rejects, or ignoring that breach and remoteness ask about the defendant's conduct and the plaintiff's damage respectively, not about the relationship between the parties. Recognising the three distinct inquiries is therefore essential to correctly structuring a negligence problem answer.
    rubric:
      - id: r1
        criterion: |
          States the three distinct stages at which foreseeability is assessed
        marks: 2
        top-band: |
          Correctly identifies duty, breach and remoteness as the three stages, with the emphasis proper to each.
        margin-note: |
          All three stages clearly separated.
      - id: r2
        criterion: |
          Applies Chapman v Hearse accurately to the duty-stage question
        marks: 2
        top-band: |
          Explains that the precise manner of injury need not be foreseeable, only harm to a class of person, using the facts of Chapman.
        margin-note: |
          Chapman v Hearse well applied.
      - id: r3
        criterion: |
          Explains why treating foreseeability as one uniform test is an error
        marks: 2
        top-band: |
          Gives a concrete example of the error (eg wrongly requiring precise foreseeability at duty) and its consequence for a problem answer.
        margin-note: |
          Good — shows the practical stakes of the distinction.
  - key: est01
    type: mcq
    concept: established-categories-of-duty
    difficulty: 1
    set: pretest
    stem: |
      What does it mean for a relationship to be an "established category" of duty of care?
    options:
      - text: |
          The relationship has already come before the courts and been recognised as giving rise to a duty of care, so the existence of a duty is generally uncontroversial.
        correct: true
        why: |
          This matches the materials exactly: established categories are relationships already recognised by prior case law as giving rise to a duty.
      - text: The relationship is one that Parliament has expressly listed by name in the Civil Liability Act 2002 (NSW), which remains the position regardless of which court hears the matter.
        correct: false
        why: |
          Established categories are a common law concept built up through prior case law, not a statutory list found in the CLA.
      - text: |
          The relationship automatically excludes the plaintiff from bringing any claim in negligence whatsoever.
        correct: false
        why: |
          The opposite is true — being in an established category makes it easier, not harder, for a plaintiff to establish a duty of care.
      - text: |
          The relationship requires the plaintiff to prove salient features before any duty can be recognised.
        correct: false
        why: |
          Salient features are used for novel cases outside established categories; an established category does not need that extra analysis.
  - key: est02
