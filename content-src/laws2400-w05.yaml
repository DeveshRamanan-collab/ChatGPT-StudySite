  - key: est04
    type: mcq
    concept: established-categories-of-duty
    difficulty: 2
    stem: |
      In an exam answer, what is the most efficient way to establish a duty of care where the facts clearly fit an established category?
    options:
      - text: |
          Identify the relationship and cite the case law recognising that category, without needing a full salient features analysis.
        correct: true
        why: |
          The materials say you can simply point to case law history showing the relationship falls into an established category, without the fuller salient factors analysis.
      - text: |
