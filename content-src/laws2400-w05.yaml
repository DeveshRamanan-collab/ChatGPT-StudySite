cards:
  - type: basic
    concept: negligence-elements-overview
    front: What are the three elements a plaintiff must prove in negligence?
    back: That the defendant owed a duty of care, breached that duty, and that the breach caused the plaintiff compensable harm.
    source: Topic 5 Lecture 1, slide 5
  - type: cloze
    concept: negligence-elements-overview
    text: Negligence is an action on the {{c1::case}}, so {{c2::damage}} is vital to initiate an action, unlike the intentional torts which are actionable per se.
    source: Topic 5 Lecture 1, slide 4
  - type: basic
    concept: negligence-elements-overview
    front: Under s 3B of the Civil Liability Act 2002 (NSW), name two categories of civil liability excluded from the Act.
    back: An intentional act done with intent to cause injury or death (or sexual assault/misconduct), and claims covered by workers' compensation or dust diseases legislation.
    source: Topic 5 Lecture 1, slide 6
  - type: apply
    concept: negligence-elements-overview
    scenario: A plaintiff sues for negligence but the defendant's careless act caused no loss of any kind, physical, psychiatric or economic.
    answer: The claim fails at the third element — negligence is an action on the case, so without compensable harm there is no cause of action, however careless the conduct.
    source: Topic 5 Lecture 1, slide 4
  - type: basic
    concept: neighbour-principle-and-duty-evolution
    front: State Lord Atkin's "neighbour principle" from Donoghue v Stevenson.
    back: You must take reasonable care to avoid acts or omissions you can reasonably foresee would be likely to injure persons so closely and directly affected by your act that you ought reasonably to have them in contemplation.
    source: Topic 5 Lecture 1, slide 12
  - type: cloze
    concept: neighbour-principle-and-duty-evolution
    text: Australian courts rejected the {{c1::Anns}} two-stage test in Sutherland Shire Council v Heyman, and the {{c2::Caparo}} three-stage test has never been incorporated into Australian negligence law.
    source: Topic 5 Lecture 1, slides 22-23
  - type: basic
    concept: neighbour-principle-and-duty-evolution
    front: What approach has the High Court of Australia followed for duty of care since the late 1990s?
    back: The "salient factors" approach — courts begin with reasonable foreseeability, then weigh contextual salient factors, treating duty of care as a contextual, not a general, duty.
    source: Topic 5 Lecture 1, slide 26
  - type: apply
    concept: neighbour-principle-and-duty-evolution
    scenario: A manufacturer sells sealed jars of jam; a piece of glass, left in during manufacture, injures a consumer who bought the jam from a retailer.
    answer: Applying Donoghue v Stevenson, the manufacturer owes the consumer a duty of care despite no contract between them, because the defect was hidden and the consumer had no reasonable opportunity to examine the product.
    source: Topic 5 Lecture 1, slides 9-14
  - type: basic
    concept: neighbour-principle-and-duty-evolution
    front: Which case first held that pure economic loss caused by negligent words may be recoverable?
    back: Hedley Byrne v Heller [1964] AC 465.
    source: Topic 5 Lecture 1, slide 17
  - type: basic
    concept: reasonable-foreseeability-meaning
    front: According to Chapman v Hearse, must a plaintiff show the precise manner of their injury was reasonably foreseeable?
    back: No — it is enough that injury to a class of persons of which the plaintiff was one might reasonably have been foreseen as a consequence.
    source: Topic 5 Lecture 2, slide 6
  - type: cloze
    concept: reasonable-foreseeability-meaning
    text: "Reasonable foreseeability is assessed differently at each stage: at {{c1::duty}}, whether a class of persons was foreseeably at risk; at {{c2::breach}}, whether the kind of carelessness might cause damage; at {{c3::remoteness}}, whether the kind of damage suffered was foreseeable."
    source: Topic 5 Lecture 2, slides 8-9
  - type: basic
    concept: reasonable-foreseeability-meaning
    front: Who explained the three-stage, progressively narrowing meaning of reasonable foreseeability, quoted in the materials?
    back: Glass JA, in Minister Administering the Environmental Planning and Assessment Act 1979 v San Sebastian Pty Ltd [1983] 2 NSWLR 268.
    source: Topic 5 Lecture 2, slide 9
  - type: apply
    concept: reasonable-foreseeability-meaning
    scenario: A cyclist crashes carelessly on a busy street; a pedestrian who stops to help is struck by a passing car moments later.
    answer: Applying Chapman v Hearse, the cyclist can owe the pedestrian a duty of care — it is enough that injury to a bystander rendering aid was a foreseeable class of harm, without foreseeing the exact sequence of events.
    source: Topic 5 Lecture 2, slides 4-6
  - type: basic
    concept: reasonable-foreseeability-meaning
    front: Can what is "reasonably foreseeable" change over time? Give an example from the materials.
    back: Yes — it can change with the state of scientific knowledge, such as the risk of exposure to asbestos or the impact of climate change.
    source: Topic 5 Lecture 2, slide 7
  - type: basic
    concept: established-categories-of-duty
    front: Name three established categories of duty of care listed in the materials.
    back: Driver to other road users; employer to employees; doctor to patients; manufacturer to consumers; solicitor to clients (any three).
    source: Topic 5 Lecture 2, slide 12
  - type: apply
    concept: established-categories-of-duty
    scenario: A patient sues their treating doctor for a routine, straightforward failure to properly diagnose a common illness.
    answer: Doctor/patient is an established category of duty of care, so a duty is easily established by pointing to that settled relationship, without needing a full salient features analysis.
    source: Topic 5 Lecture 2, slide 12
  - type: cloze
    concept: established-categories-of-duty
    text: Even within an established category, unusual facts can put duty back in issue — in {{c1::Chapman v Hearse}}, a car accident case, the unusual chain of events still raised the duty of care question.
    source: Topic 5 Lecture 2, slide 12
  - type: basic
    concept: established-categories-of-duty
    front: Why can a student simply cite case law history for an established category, rather than running a full salient features analysis?
    back: Because the relationship has already come before the courts and been recognised as giving rise to a duty of care, making it generally uncontroversial.
    source: Topic 5 Lecture 2, slide 11
  - type: basic
    concept: novel-duty-and-salient-features
    front: What makes a negligence case "novel"?
    back: The relationship between the plaintiff and defendant falls outside any category the courts have already recognised as giving rise to a duty of care.
    source: Topic 5 Lecture 2, slide 13
  - type: cloze
    concept: novel-duty-and-salient-features
    text: In {{c1::Caltex Refineries v Stavar}}, the NSW Court of Appeal found a duty of care could be owed by an employer to an employee's {{c2::wife}}, exposed to asbestos while washing his work clothes.
    source: Topic 5 Lecture 2, slide 17
  - type: basic
    concept: novel-duty-and-salient-features
    front: List four salient factors from Caltex Refineries v Stavar.
    back: |
      Any four of: foreseeability, control, vulnerability, reliance, assumption of responsibility, proximity,
      category of relationship, nature of defendant's activity, danger, defendant's knowledge, indeterminacy,
      coherence.
    source: Topic 5 Lecture 2, slide 18
  - type: apply
    concept: novel-duty-and-salient-features
    scenario: A father under investigation for suspected child abuse sues the social workers and doctor who investigated the allegations, claiming psychiatric injury.
    answer: Applying Sullivan v Moody, no duty of care is likely to be found — recognising one would create indeterminate liability and conflict with the paramount duty to protect children.
    source: Topic 5 Lecture 2, slides 14-16
  - type: basic
    concept: novel-duty-and-salient-features
    front: Is the list of salient factors from Caltex Refineries v Stavar exhaustive, and must a plaintiff satisfy all of them?
    back: No — the list is non-exhaustive, and the plaintiff is not required to meet all of the factors.
    source: Topic 5 Lecture 2, slide 18
  - type: basic
    concept: duty-of-care-and-pure-economic-loss
    front: Define "pure economic loss".
    back: Economic loss that is not consequent upon any physical injury to a person or damage to property.
    source: Flowchart, Chapter 9, p 291
  - type: cloze
    concept: duty-of-care-and-pure-economic-loss
    text: "The Hedley Byrne principle requires, beyond foreseeability: a {{c1::special relationship}}; a voluntary {{c2::assumption of responsibility}}; the other party's {{c3::reliance}}; and the reasonableness of that reliance."
    source: Topic 5 Lecture 1, slide 20
  - type: basic
    concept: duty-of-care-and-pure-economic-loss
    front: Why did Hedley Byrne itself lose its claim against Heller?
    back: Because Heller gave the credit reference "without responsibility", disclaiming responsibility for it.
    source: Topic 5 Lecture 1, slide 20
  - type: apply
    concept: duty-of-care-and-pure-economic-loss
    scenario: A financial adviser, knowing her client will rely on her recommendation, carelessly recommends an unsuitable investment, causing financial loss.
    answer: Applying Hedley Byrne, a duty of care can arise if there is a special relationship, assumption of responsibility, reliance and reasonable reliance; vulnerability must also be shown separately, per Woolcock Street Investments.
    source: Flowchart, Chapter 9, p 291
  - type: basic
    concept: duty-of-care-and-pure-economic-loss
    front: What extra requirement, beyond the Hedley Byrne factors, did Woolcock Street Investments v CDG establish for pure economic loss claims?
    back: Vulnerability of the plaintiff — an inability to protect themselves from the defendant's lack of reasonable care.
    source: Flowchart, Chapter 9, p 291
  - type: basic
    concept: duty-of-care-and-pure-economic-loss
    front: According to Perre v Apand, is reasonable foreseeability of economic loss enough on its own to found a duty of care?
    back: No — it is necessary but not sufficient on its own to justify imposing a duty of care for pure economic loss.
    source: Flowchart, Chapter 9, p 291
audio:
  title: Week 5 recap — negligence overview and duty of care
  minutes: 4
  script: |
    Negligence is different from the torts we've covered so far: it's an action on the case, so we always need damage
    to get a claim off the ground. There are three elements: duty of care, breach, and causation of compensable
    harm, whether that's physical, psychiatric or economic. This week is all about duty. The Civil Liability Act
    applies to negligence claims under section five A, unless section three B carves them out — think intentional
    acts meant to injure, sexual assault, workers' compensation and dust diseases, which stay with the common law.

    Duty of care always starts with Donoghue versus Stevenson — the snail in the ginger beer bottle. Lord Atkin's
    neighbour principle says we must take reasonable care to avoid acts we can reasonably foresee would injure our
    neighbour, meaning anyone closely and directly affected by what we do. Grant versus Australian Knitting Mills
    applied this to a manufacturer whose hidden chemical defect caused severe dermatitis. But the neighbour
    principle is a starting point, not the finish line. English courts tried to generalise duty into fixed tests —
    Anns's two stages, then Caparo's three — but Australia rejected both. We went our own way: proximity as a
    touchstone in the eighties, then, since the late nineties, the salient factors approach.

    Reasonable foreseeability itself isn't one test — it's asked three times, meaning something different each
    time. Chapman versus Hearse is the key case here: a doctor killed helping at an accident scene didn't need his
    death to be foreseeable in its exact sequence, just that injury to a class of person like him was foreseeable.
    That's the duty question. Breach asks about the kind of carelessness; remoteness asks about the kind of damage.

    Most of the time, duty isn't even controversial, because the facts fit an established category — driver and
    road user, employer and employee, doctor and patient, manufacturer and consumer, solicitor and client. Cite the
    category, cite the authority, move on. But when the facts are novel — outside any established category — we
    need more than foreseeability. That's where salient factors come in, from Caltex Refineries versus Stavar:
    control, vulnerability, reliance, proximity, coherence, and more, weighed together, not ticked off a checklist.
    Sometimes that weighing points against a duty even where harm was foreseeable — Sullivan versus Moody found no
    duty owed to a father under investigation for suspected abuse, because of indeterminate liability and
    conflicting duties to protect children.

    Finally, pure economic loss — loss with no physical injury or property damage attached. Foreseeability alone
    is never enough here, Perre versus Apand tells us that directly. For negligent misstatement, we need Hedley
    Byrne versus Heller's four factors: special relationship, assumption of responsibility, reliance, and
    reasonable reliance — remember Hedley Byrne itself lost because Heller disclaimed responsibility. On top of
    that, Woolcock Street Investments adds vulnerability: could the plaintiff have protected themselves another
    way? If not, they're vulnerable, and a duty is more likely to be found.
