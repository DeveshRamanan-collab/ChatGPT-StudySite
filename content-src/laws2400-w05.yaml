        correct: true
        why: |
          This is the definition given directly in the materials, distinguishing PEL from economic loss flowing from personal injury or property damage.
      - text: |
          Any loss at all suffered by a business, regardless of whether it followed from physical injury or property damage.
        correct: false
        why: |
          This is too broad; economic loss consequent on physical injury or property damage is not "pure" economic loss under this definition.
      - text: |
          Loss suffered only by government departments and public authorities, never by private individuals or companies.
        correct: false
        why: |
          Pure economic loss can be suffered by private individuals and companies, such as Hedley Byrne, not only public authorities.
      - text: |
          Loss that is impossible to quantify in monetary terms and therefore cannot be compensated at all.
        correct: false
        why: |
          Pure economic loss is quantifiable monetary loss; the difficulty is not valuing it but limiting when a duty of care arises in respect of it.
