    verify: false
    body: |
      Negligence is an action on the case, not actionable per se, so the plaintiff must prove three elements to
      succeed: that the defendant owed them a duty of care; that the defendant breached that duty; and that the
      breach caused the plaintiff compensable harm — physical, psychiatric or economic — assessed through factual
      causation and the scope of liability.

      Duty of care always requires reasonable foreseeability, following the "neighbour principle" from *Donoghue
      v Stevenson*, but foreseeability is always required and not always sufficient on its own; in practice, most
      duty questions are settled once the facts are matched to an established category of relationship.

      The Civil Liability Act 2002 (NSW) applies to any claim for damages for harm resulting from negligence (s
      5A), except civil liability excluded by s 3B — including intentional acts done with intent to injure or
      kill, sexual assault, and claims under the workers' compensation or dust diseases regimes, which remain
      governed by the common law or other legislation. Breach and causation have been substantially codified by
      the CLA (ss 5B–5E); duty of care remains mostly a common law doctrine, modified by the CLA only in specific
      contexts such as public authorities, mental harm and professional negligence.

      Exam use: always state all three elements first, then work through each in turn — an answer that jumps
      straight to breach or causation without first establishing duty loses easy marks.
  - slug: neighbour-principle-and-duty-evolution
    title: The neighbour principle and the evolution of duty
    visual: timeline
    visual-brief: A line from 1932 (Donoghue) through the UK's Anns and Caparo tests to Australia's proximity years and the modern salient-factors approach.
    related:
      - negligence-elements-overview
      - established-categories-of-duty
    depends-on:
      - negligence-elements-overview
    contrasts-with: []
    cases:
      - donoghue-v-stevenson
      - grant-v-australian-knitting-mills
      - hedley-byrne-v-heller
    authorities: []
    verify: false
    body: |
      Duty of care's starting point is Lord Atkin's neighbour principle in *Donoghue v Stevenson*: you must take
      reasonable care to avoid acts or omissions you can reasonably foresee would be likely to injure your
      "neighbour" — anyone so closely and directly affected by your act that you ought reasonably to have them in
      contemplation. A manufacturer who sells a product intending it to reach the consumer in the form it left
      them, with no reasonable possibility of intermediate examination, owes that consumer a duty to take
      reasonable care (*Grant v Australian Knitting Mills*).

      From the 1960s, English courts extended negligence into pure economic loss (*Hedley Byrne v Heller*) and
      public authority liability (*Home Office v Dorset Yacht*), and proposed general tests for duty in *Anns v
      Merton* (proximity, then policy) and *Caparo Industries v Dickman* (foreseeability, proximity, fairness).
      Neither test was adopted in Australia: courts rejected Anns (*Sutherland Shire Council v Heyman*), and
      Caparo has never been incorporated into Australian law. Australian courts instead treated proximity as a
      "touchstone" limiting foreseeability through the 1980s, before the High Court moved, from the late 1990s, to
      the contextual "salient factors" approach.

      Exam use: the neighbour principle is always your starting point, but never your ending point — say so
      explicitly, then move to established categories or salient factors.
  - slug: reasonable-foreseeability-meaning
    title: What reasonable foreseeability means
    visual: diagram
    visual-brief: A chain of three questions — duty, breach, remoteness — each labelled with what "reasonably foreseeable" means at that link.
    related:
      - neighbour-principle-and-duty-evolution
    depends-on:
      - neighbour-principle-and-duty-evolution
    contrasts-with: []
    cases:
      - chapman-v-hearse
    authorities: []
    verify: false
    body: |
      Reasonable foreseeability is not a single test — it is asked three times in negligence, and means something
      different each time. At the duty stage, the question is whether injury of some kind to the plaintiff, or to
      a class of persons of which they were one, was reasonably foreseeable as a possibility; it is not necessary
      to foresee the precise manner or sequence of events (*Chapman v Hearse*). At the breach stage, the question
      is whether the kind of carelessness charged against the defendant might foreseeably cause damage of some
      kind. At the remoteness stage, the question is whether the kind of damage the plaintiff actually suffered was
      foreseeable as a possible outcome of that carelessness. The inquiry moves, as Glass JA put it, "from the
      general to the particular".

      In *Chapman v Hearse*, Chapman argued he owed Dr Cherry no duty because he could not have foreseen the exact
      chain of events that led to Cherry's death; the High Court rejected this, holding it was enough that injury
      to a class of person including Cherry — a bystander rendering aid at an accident scene — was reasonably
      foreseeable.

      Exam use: when a defendant argues "I couldn't have foreseen exactly what happened", identify which of the
      three foreseeability questions they are really disputing, and answer only that one.
  - slug: established-categories-of-duty
    title: Established categories of duty
    visual: palace
    visual-brief: A row of recognised relationships — driver/road user, employer/employee, doctor/patient, manufacturer/consumer, solicitor/client — each a settled duty.
    related:
