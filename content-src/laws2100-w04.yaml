authorities:
  - slug: finnis-natural-law-theories-sep
    title: John Finnis, 'Natural Law Theories', The Stanford Encyclopedia of Philosophy (Summer 2020 Edition)
    kind: article
    text: '"Natural law theorists, on the other hand, did not conceive their theories in opposition to, or even as distinct from, legal positivism […]. Natural law theory accepts that law can be considered and spoken of both as a sheer social fact of power and practice, and as a set of reasons for action that can be and often are sound as reasons and therefore normative for reasonable people addressed by them."'
    gloss: 'Finnis presents natural law theory as not opposed to positivism: law is both a social fact and a set of reasons for action that are often sound.'
    cases: []
