questions:
  - key: a01
    type: mcq
    concept: natural-law-and-positivism
    difficulty: 1
    set: pretest
    stem: According to the Week 4 slides, what do natural law theories dispute?
    options:
      - text: That laws are made by identifiable human officials acting within institutions.
        why: Tempting because positivists stress human-made (posited) law, but natural law theorists accept that positive law is made by humans; that is not what they dispute.
      - text: The (positivist) claim that law and morality are conceptually separable.
        correct: true
        why: 'Correct — the first slide: natural law theories dispute the positivist claim that law and morality are conceptually separable; law has an essentially moral dimension.'
      - text: That legal systems are usually backed by sanctions and coercive enforcement.
        why: Tempting because Hart denies coercion is necessary, but the natural law dispute concerns morality, not sanctions; natural law theorists do not deny enforcement.
  - key: a02
    type: mcq
    concept: natural-law-and-positivism
    difficulty: 1
    stem: For natural law theorists, as the slide puts it, law is a matter of…
    options:
      - text: social facts alone, whatever the content of the rules happens to be
        why: Tempting because it restates positivism, for which the existence of law is simply a matter of social facts/practices; natural law adds a moral element.
      - text: conformity to divine commands revealed through scripture and tradition
        why: Tempting because Aquinas wrote within a religious tradition, but the Thomist principles are discoverable by human reason without the aid of revelation.
      - text: social facts + conformity to certain moral standards (form and/or content)
        correct: true
        why: 'Correct — the slide: for natural law theorists law is a matter of social facts plus conformity to certain moral standards, of form and/or of content.'
      - text: the moral opinions of the majority of the community at a given time
        why: Tempting because Hart discusses accepted social morality, but natural law standards are principles of true morality or justice, not majority opinion.
  - key: a03
    type: mcq
    concept: natural-law-and-positivism
    difficulty: 2
    stem: Which pairing of theory type and example matches the Week 4 slides?
    options:
      - text: Procedural — Finnis; substantive — Fuller
        why: 'Tempting because both are natural law theorists, but this reverses them: Fuller focuses on form (principles of legality), Finnis on content (basic goods).'
      - text: Procedural — Fuller; substantive — Finnis
        correct: true
        why: Correct — the slide lists procedural natural law theories (eg Lon Fuller) and substantive natural law theories (eg John Finnis).
      - text: Procedural — Hart; substantive — Aquinas
        why: Tempting because Hart discusses principles of legality, but Hart is a legal positivist, not a procedural natural law theorist.
      - text: Procedural — Kelsen; substantive — Fuller
        why: Tempting because Kelsen focuses on chains of validity, but he is a positivist for whom content is irrelevant, and Fuller is procedural.
  - key: a04
    type: mcq
    concept: natural-law-and-positivism
    difficulty: 2
    stem: How does Hart define legal positivism in The Concept of Law (185–186)?
    options:
      - text: The contention that laws must never reproduce the demands of morality, so that law and morality are kept wholly apart.
        why: Tempting because positivism separates law and morality, but Hart says laws in fact have often satisfied morality; the claim is only that this is not a necessary truth.
      - text: The contention that law is the command of a sovereign habitually obeyed and backed by sanctions.
        why: Tempting because that is Austin's imperative theory, which Hart treats as a separate doctrine and rejects.
      - text: The contention that it is in no sense a necessary truth that laws reproduce or satisfy certain demands of morality.
        correct: true
        why: Correct — "the simple contention that it is in no sense a necessary truth that laws reproduce or satisfy certain demands of morality, though in fact they have often done so."
  - key: a05
    type: mcq
    concept: natural-law-and-positivism
    difficulty: 2
    stem: Hart says the utilitarian tradition (Bentham, Austin) defended three doctrines. Which statement about them is correct?
    options:
      - text: They are separate claims; Hart keeps the separation of law and morals and analytical study but rejects the imperative theory.
        correct: true
        why: 'Correct — the slide: (1), (2) and (3) are separate doctrines, not a package; Hart devotes the first chapters of The Concept of Law to rejecting the imperative theory.'
      - text: They form a package; by rejecting the imperative theory Hart is committed to rejecting the separation of law and morals as well.
        why: 'Tempting because they come from the same tradition, but the slide stresses they are not a package: Hart rejects one while keeping the other two.'
      - text: They are separate claims; Hart accepts the imperative theory but rejects the purely analytical study of legal concepts.
        why: 'Tempting because the doctrines are separable, but this reverses Hart: he champions analytical jurisprudence and rejects the imperative theory.'
  - key: a06
    type: mcq
    concept: natural-law-and-positivism
    difficulty: 2
    stem: According to Hart, what is the Thomist version of the necessary connection between law and morality?
    options:
      - text: Laws that conflict with the settled moral opinion of the community lose their legal validity once the officials of the system stop accepting them.
        why: Tempting because Hart links a system's existence to official acceptance, but the Thomist claim concerns principles of true morality, not settled opinion.
      - text: Principles of true morality or justice are discoverable by reason without revelation, and man-made laws conflicting with them are not valid law.
        correct: true
        why: Correct — the slide sets out the Thomist NCLM as these two claims joined by AND, expressed in the maxim lex iniusta non est lex.
      - text: A legal system exists only where there is a widely diffused recognition of a moral obligation to obey its law.
        why: Tempting because it is on the same slide, but that is the different interpretation of the NCLM, not the Thomist one.
  - key: a07
    type: mcq
    concept: natural-law-and-positivism
    difficulty: 3
    stem: What is the "different interpretation" of the NCLM that Hart identifies beside the Thomist one?
    options:
      - text: For a legal system to exist there must be a widely diffused, though not universal, recognition of a moral obligation to obey the law.
        correct: true
        why: 'Correct — the slide: this obligation may be overridden in particular cases by a stronger moral obligation not to obey particular morally iniquitous laws.'
      - text: For a law to be valid it must have been enacted following fair procedures that are publicly announced and judicially applied.
        why: Tempting because it echoes Hart's principles of legality, but the second interpretation concerns a recognised moral obligation to obey, not enactment procedures.
      - text: For a legal system to exist every single citizen must personally accept a moral duty to obey each law, without any exception at all.
        why: Tempting because it states the obligation strongly, but the slide says widely diffused, not necessarily universal, and the obligation can be overridden.
      - text: For a legal system to exist, its rules must protect persons, property and promises against violence and fraud.
        why: Tempting because Hart says this is indispensable, but that is his minimum content of natural law, a natural necessity, not the second NCLM reading.
  - key: a08
    type: mcq
    concept: natural-law-and-positivism
    difficulty: 2
    stem: 'Why does the lecture quote Augustine: "What are states without justice but robber-bands enlarged?"'
    options:
      - text: To show that Augustine anticipated the imperative theory by treating the state as the most powerful gang.
        why: Tempting because the image is of gangs, but Augustine uses it to show what is missing without justice, which is the opposite of the imperative theory.
      - text: To show that for many natural law thinkers justice is what distinguishes law from the gunman situation writ large.
        correct: true
        why: 'Correct — the lecture: it is the gunman situation writ large; for natural law thinkers law differs from it because law reflects, or should reflect, justice.'
      - text: To show that Hart borrowed his minimum content of natural law from Augustine rather than from Hobbes and Hume.
        why: Tempting because Hart mentions older thinkers, but the slide bases the minimum content on Hobbes and Hume; Augustine appears as the natural law challenge.
  - key: a09
    type: mcq
    concept: natural-law-and-positivism
    difficulty: 3
    stem: In Finnis's SEP passage, which positivist thesis do natural law theories of Aquinas's kind NOT share?
    options:
      - text: The thesis that positive law can be spoken of as a sheer social fact of power and practice.
        why: Tempting because positivists stress social fact, but Finnis says natural law theory accepts that law can be spoken of as a sheer social fact.
      - text: The thesis that law can be a set of reasons for action that are sound and therefore normative.
        why: Tempting because it sounds like natural law, but that is what natural law theory affirms, so it is not a positivist thesis it rejects.
      - text: The thesis that a norm is the content of an act of will.
        correct: true
        why: Correct — Finnis says they share virtually all positivist theses except the bare thesis that natural law theories are mistaken, or that a norm is the content of an act of will.
      - text: The thesis that the term "positive law" is useful for describing human-made rules.
        why: Tempting because the term sounds positivist, but Finnis says Aquinas first put "positive law" into wide philosophical circulation.
  - key: a10
    type: mcq
    concept: natural-law-and-positivism
    difficulty: 3
    stem: Which statement best captures Finnis's point that natural law theorists did not conceive their theories in opposition to legal positivism?
    options:
      - text: Natural law theory accepts law as a social fact and adds that its directives can be sound reasons for action.
        correct: true
        why: 'Correct — Finnis: law can be considered both as a sheer social fact of power and practice and as a set of reasons that are often sound.'
      - text: Natural law theory and positivism are identical theories, differing only in the vocabulary they happen to use.
        why: Tempting because Finnis minimises the opposition, but he still names theses they do not share, so the theories are not identical.
      - text: Natural law theory is older, so positivism must be an offshoot that later abandoned its interest in justice.
        why: Tempting because the lecture says positivism is historically younger, but Finnis does not argue that it is an offshoot of natural law.
      - text: Natural law theory rejects social facts entirely and studies only the moral principles discoverable by reason.
        why: Tempting because natural law is about morality, but the slide says law is social facts plus moral standards; social facts are not rejected.
  - key: a11
    type: mcq
    concept: natural-law-and-positivism
    difficulty: 2
    contrasts-with:
      - laws2100-w01-six-kinds-of-questions
    stem: Which of these is a claim about the nature of jurisprudence rather than the nature of law?
    options:
      - text: It is in no sense a necessary truth that laws reproduce or satisfy certain demands of morality.
        why: Tempting because it is Hart and it is famous, but this is his definition of positivism, a claim about the nature of law.
      - text: Man-made laws that conflict with principles of true morality are not valid law.
        why: Tempting because it is a big theoretical claim, but lex iniusta is a claim about law and legal validity, not about legal theory.
      - text: My account is descriptive in that it is morally neutral and has no justificatory aims.
        correct: true
        why: 'Correct — the lecture: this is the other way Hart keeps law and morality apart, at the level of legal theory (CL 240).'
  - key: a12
    type: mcq
    concept: natural-law-and-positivism
    difficulty: 2
    stem: According to the lecture, why is legal positivism historically "younger" than the natural law tradition?
    options:
      - text: Because positivism was first developed by Hart in 1961 to answer Finnis and Fuller.
        why: Tempting because Hart is central, but Finnis wrote later (1980) and Bentham developed positivism long before Hart.
      - text: Because Bentham developed his positivist view in opposition to the natural law tradition, in particular Blackstone's views.
        correct: true
        why: 'Correct — the lecture: Bentham developed positivism against the natural law tradition, especially Blackstone''s natural law views; natural law is far older.'
      - text: Because Aquinas invented legal positivism when he first put the term "positive law" into wide circulation in his writings on justice.
        why: Tempting because Aquinas circulated the term "positive law", but he used it inside a natural law theory; he did not found legal positivism.
  - key: a13
    type: mcq
    concept: natural-law-and-positivism
    difficulty: 3
    stem: Hart says the separation of law and morals is "not a package" with the imperative theory. What does the lecture add about the word "separation"?
    options:
      - text: 'It is imprecise: the claim is conceptual separability, since in reality laws and morals overlap.'
        correct: true
        why: 'Correct — the lecture: it is not really separation but the conceptual separability of law and morality; overlaps in reality are not the philosophical point.'
      - text: 'It is exact: positivists hold that laws and morals never overlap in any real legal system.'
        why: Tempting because "separation" sounds absolute, but Hart accepts that laws have often satisfied morality; the claim concerns necessity, not overlap.
      - text: It is misleading because Hart in fact accepts the Thomist claim that unjust laws are invalid.
        why: Tempting because Hart concedes some NCLM claims, but he never accepts that unjust laws are invalid; that is the claim positivism resists.
  - key: a14
    type: mcq
    concept: natural-law-and-positivism
    difficulty: 2
    contrasts-with:
      - fullers-inner-morality-of-law
    stem: Which version of the NCLM does the lecture link with Fuller's theory?
    options:
      - text: The Thomist version, because Fuller relies on principles of true morality discoverable by reason.
        why: Tempting because Fuller is a natural law theorist, but the lecture links Finnis with the Thomist tradition and Fuller with the other reading.
      - text: The moral-obligation version, because it concerns the kind of obligation that laws create.
        correct: true
        why: 'Correct — the lecture: Fuller''s theory connects with the second claim, about the obligations laws create (fidelity to law).'
      - text: Neither version, because Fuller denies that there is any connection between law and morality.
        why: Tempting because Fuller's principles are formal, but he calls them an inner morality of law; he affirms a connection.
  - key: a15
    type: mcq
    concept: natural-law-and-positivism
    difficulty: 1
    stem: In which chapters of The Concept of Law does Hart discuss the natural law tradition?
    options:
      - text: Chapters I and II, on persistent questions and on laws, commands and orders.
        why: Tempting because chapter I raises law and morality among three issues, but the extended discussion is in chapters VIII and IX.
      - text: Chapters V and VI, on law as the union of rules and the foundations of a legal system.
        why: Tempting because those are the central chapters, but they build Hart's own theory; natural law comes later.
      - text: Chapters VIII (Justice and Morality) and IX (Laws and Morals).
        correct: true
        why: 'Correct — the slide: Hart discusses key claims of the natural law tradition in chapters VIII and IX.'
  - key: a16
    type: mcq
    concept: natural-law-and-positivism
    difficulty: 3
    variant-of: a10
    stem: 'A student writes: "Natural law says an unjust law is not a law, so natural lawyers must deny that Nazi statutes were ever enforced." What is the best correction?'
    options:
      - text: 'Correct as stated: natural law theories deny that unjust statutes were ever social facts of power and practice, so none were enforced.'
        why: Tempting because lex iniusta sounds absolute, but Finnis says natural law accepts law as a sheer social fact of power and practice.
      - text: Natural law accepts that such statutes existed and were enforced as social facts; the dispute is about their moral and legal status.
        correct: true
        why: Correct — law is social facts plus moral standards; natural law theorists dispute the status of unjust rules, not the fact of their enforcement.
      - text: Natural law has nothing to say about unjust statutes, since it concerns only the morality of individuals.
        why: Tempting because there are natural law theories of morality, but the week's topic is natural law theories of law, which address unjust law directly.
  - key: a17
    type: truefalse
    set: quickfire
    concept: natural-law-and-positivism
    difficulty: 1
    statement: For legal positivists, the existence of law is simply a matter of social facts/practices.
    answer: true
    why: True — the first slide contrasts this positivist view with natural law, for which law is social facts plus conformity to moral standards.
  - key: a18
    type: truefalse
    set: quickfire
    concept: natural-law-and-positivism
    difficulty: 2
    statement: Hart treats the separation of law and morals and the imperative theory of law as a single package that stands or falls together.
    answer: false
    why: 'False — the slide: (1), (2) and (3) are separate doctrines, not a package; Hart keeps the separation thesis and rejects the imperative theory.'
  - key: a19
    type: truefalse
    set: quickfire
    concept: natural-law-and-positivism
    difficulty: 2
    statement: According to the Thomist tradition, the principles of true morality or justice can be discovered only through divine revelation.
    answer: false
    why: False — they are discoverable by human reason without the aid of revelation, even though they have a divine origin.
  - key: a20
    type: truefalse
    set: quickfire
    concept: natural-law-and-positivism
    difficulty: 2
    statement: Finnis says the term "positive law" was put into wide philosophical circulation first by Aquinas.
    answer: true
    why: 'True — the SEP passage on the slide: Aquinas first circulated "positive law", and natural law theories of his kind share many positivist theses.'
  - key: b01
    type: mcq
    concept: minimum-content-of-natural-law
    difficulty: 1
    set: pretest
    stem: According to Hart, which rules constitute the 'minimum content' of natural law?
    options:
      - text: Rules restricting violence and requiring respect for property and promises.
        correct: true
        why: 'Correct — the slide: rules restricting the use of violence and requiring respect for property and promises underlie both positive law and social morality.'
      - text: Rules requiring every law to be general, public, prospective, clear and stable.
        why: Tempting because it is this week's other list, but those are Fuller's principles of legality, not Hart's minimum content.
      - text: Rules of recognition, change and adjudication accepted by all the officials.
        why: Tempting because they are necessary for a legal system to exist, but they are secondary rules; the minimum content concerns protections for persons, property and promises.
  - key: b02
    type: mcq
    concept: minimum-content-of-natural-law
    difficulty: 2
    stem: What kind of necessity does Hart attribute to the minimum content of natural law?
    options:
      - text: 'A conceptual necessity: no rule counts as law unless it protects persons and property.'
        why: Tempting because Hart uses the word 'necessity', but he denies a conceptual link; a single law can lack this content and still be law.
      - text: A natural necessity, given the setting of natural facts and aims in which human beings live.
        correct: true
        why: 'Correct — CL 199: "given the setting of natural facts and aims … this is a natural necessity"; it is not a necessary truth about the concept of law.'
      - text: A divine necessity, because the protections are commanded by God and known through revelation.
        why: Tempting because natural law has religious roots, but Hart's version is empirical, based on Hobbes and Hume, with no appeal to revelation.
      - text: A logical necessity, because a system lacking them would contain contradictory rules of recognition.
        why: Tempting because it sounds rigorous, but Hart's argument concerns human survival and cooperation, not logical coherence of the rule of recognition.
  - key: b03
    type: mcq
    concept: minimum-content-of-natural-law
    difficulty: 2
    stem: On whose work is Hart's "empirical version" of natural law based, according to the slide?
    options:
      - text: Aquinas and Augustine, on the principles of justice discoverable by reason.
        why: Tempting because they are the week's classical natural law thinkers, but Hart's empirical version draws on Hobbes and Hume instead.
      - text: Bentham and Austin, on the separation of law and morals.
        why: Tempting because they are Hart's utilitarian predecessors, but the slide cites Hobbes (Leviathan chs 14–15) and Hume (Treatise Book III).
      - text: Hobbes (Leviathan, chs 14 and 15) and Hume (Treatise, Book III, part 2).
        correct: true
        why: Correct — the slide bases the empirical version of natural law on Hobbes and Hume.
      - text: Fuller and Finnis, on the inner morality of law and basic goods.
        why: Tempting because they are this week's natural law theorists, but they are not the sources of Hart's minimum content; Finnis criticised its name.
  - key: b04
    type: mcq
    concept: minimum-content-of-natural-law
    difficulty: 3
    stem: Hart says the minimum content is how "we should reply to the positivist thesis that 'law may have any content'". Whose thesis is he pushing against?
    options:
      - text: Austin's, because Austin held that the sovereign's commands could have any content whatever.
        why: Tempting because Austin's sovereign is legally unlimited, but the lecture identifies Kelsen, for whom the content of individual laws is irrelevant.
      - text: Kelsen's, because for Kelsen only the chain of validity matters, not the content of laws.
        correct: true
        why: 'Correct — the lecture: Hart is pushing against Hans Kelsen, for whom the dynamic chain of validity matters and content is completely irrelevant.'
      - text: Finnis's, because Finnis argued that positive law may take any content so long as it is effective.
        why: Tempting because Finnis commented on this chapter, but Finnis is a natural law theorist and never held that law may have any content.
  - key: b05
    type: mcq
    concept: minimum-content-of-natural-law
    difficulty: 3
    stem: Why, on the lecture's account, must even a cruel dictatorship have some of this minimum content?
    options:
      - text: Because some members of the regime must voluntarily accept its rules, and they will not unless the rules protect them.
        correct: true
        why: 'Correct — the lecture: it is impossible for one individual to run a dictatorship; the elite who accept the rules need basic protection or it is a suicide pact.'
      - text: Because any rule lacking that content is automatically invalid under the regime's own rule of recognition.
        why: Tempting because it mentions validity, but Hart makes no claim that such rules are invalid; the point is about the system's survival.
      - text: Because international law requires every state to protect the lives and property of its own citizens.
        why: Tempting because it sounds like a real constraint, but Hart's argument is internal to how a legal system can exist, not a claim about international law.
      - text: Because a dictatorship must satisfy all eight of Fuller's principles of legality before any of its rules count as law.
        why: Tempting because Fuller links legality to law's existence, but Hart's minimum content argument concerns protection of persons, property and promises.
  - key: b06
    type: mcq
    concept: minimum-content-of-natural-law
    difficulty: 3
    stem: How did Finnis respond to Hart's "minimum content of natural law", according to the lecture?
    options:
      - text: He rejected it outright as incompatible with any genuine natural law theory.
        why: Tempting because Finnis is a critic of Hart, but the lecture says he could see where Hart was coming from and objected mainly to the label.
      - text: He said Hart should have called it, more accurately, the minimum content of positive law.
        correct: true
        why: 'Correct — the lecture: for Finnis it was unfortunate to use this expression, since Hart argues that positive law has this minimum content.'
      - text: He adopted it as the core of his own theory of basic goods and practical reasonableness.
        why: Tempting because both concern human goods, but Finnis's basic goods are identified by practical reasonableness, not by Hart's Hobbesian truisms.
  - key: b07
    type: mcq
    concept: minimum-content-of-natural-law
    difficulty: 2
    contrasts-with:
      - finnis-central-case-method
    stem: Which statement best describes how the minimum content fits with Hart's positivism?
    options:
      - text: It abandons positivism, because Hart now accepts that every valid law must be morally sound.
        why: Tempting because Hart speaks of natural law, but he never accepts that every valid law must be morally sound; that would be the strong natural law thesis.
      - text: It concedes a core of good sense in natural law without conceding a necessary conceptual connection.
        correct: true
        why: 'Correct — the lecture: Hart recognises a grain of truth in natural law, but it has nothing to do with the necessary connection between law and morality.'
      - text: 'It is a claim about legal theory only: theorists must evaluate law before they can describe it.'
        why: Tempting because it concerns method, but that is Finnis's claim about jurisprudence; the minimum content is a claim about law's content.
  - key: b08
    type: mcq
    concept: minimum-content-of-natural-law
    difficulty: 2
    contrasts-with:
      - laws2100-w02-law-and-coercion
    stem: Hart links the minimum content to sanctions ("which make sanctions both possible and necessary"). What parallel does the lecture draw?
    options:
      - text: Just as coercion is not a necessary feature of the concept of law, neither is morality; both links are natural, not conceptual.
        correct: true
        why: 'Correct — the lecture: for Hart coercion is not a necessary feature of law, and the same is true of morality; law is its own normative sphere.'
      - text: Just as coercion is a necessary feature of the concept of law, so is morality; both links are conceptual truths about law.
        why: Tempting because it repeats 'necessary', but it reverses Hart, who rejects Austin's view that sanctions are necessary to the concept of law.
      - text: Just as coercion is irrelevant to every real legal system, so is morality; neither ever appears in legal practice at all.
        why: Tempting because both are said to be non-conceptual, but Hart says all familiar systems are coercive and overlap with morality as a matter of fact.
  - key: b09
    type: mcq
    concept: minimum-content-of-natural-law
    difficulty: 1
    stem: Which three things does Hart say receive "minimum forms of protection" as indispensable features of municipal law?
    options:
      - text: Persons, property and promises.
        correct: true
        why: 'Correct — CL 199: the minimum forms of protection for persons, property, and promises are indispensable features of municipal law.'
      - text: Liberty, equality and fraternity.
        why: 'Tempting because they are familiar political ideals, but Hart''s list is narrower and empirical: persons, property and promises.'
      - text: Generality, publicity and prospectivity.
        why: Tempting because they are principles of legality on the same week's slides, but they are Fuller's formal requirements, not protections.
  - key: b10
    type: mcq
    concept: minimum-content-of-natural-law
    difficulty: 2
    stem: Where does the minimum content sit in the structure of Chapter IX of The Concept of Law, as the lecture describes it?
    options:
      - text: It is the whole of Chapter IX, which contains nothing else on law and morality.
        why: 'Tempting because it is the famous part, but the lecture says Chapter IX has two big discussions: the minimum content and the six claims.'
      - text: It is one of two big discussions in Chapter IX; the other is the six claims about law and morality.
        correct: true
        why: 'Correct — the lecture: Chapter IX has two big discussions, the minimum content of natural law and the six ways law and morality may be connected.'
      - text: It appears in Chapter VI alongside the rule of recognition, and so is not part of Chapter IX at all.
        why: Tempting because Chapter VI is on the foundations of a legal system, but the minimum content is discussed in Chapter IX (CL 199).
  - key: b11
    type: mcq
    concept: minimum-content-of-natural-law
    difficulty: 3
    contrasts-with:
      - lex-iniusta-strong-and-weak
    stem: 'A classmate says: "Hart''s minimum content shows he accepts lex iniusta non est lex." What is the best reply?'
    options:
      - text: 'Agree: once rules must protect persons and property, any law that fails to do so is invalid.'
        why: Tempting because both concern justice, but Hart never says a law lacking this content is invalid; the minimum content is about systems, not validity.
      - text: 'Disagree: the minimum content is a natural necessity for a system to survive, not a test of each law''s validity.'
        correct: true
        why: Correct — Hart concedes that some rules must have this content for a system to exist, while denying that injustice defeats legal validity.
      - text: 'Agree: Hart adopts the weak natural law thesis, so unjust laws are defective but still valid.'
        why: Tempting because the weak thesis allows validity, but it is Finnis's thesis about the central case; Hart adopts no natural law thesis.
      - text: 'Disagree: the minimum content applies only to social morality and says nothing whatever about the content of positive law.'
        why: Tempting because morality is involved, but the slide says the minimum content underlies both positive law and social morality.
  - key: b12
    type: mcq
    concept: minimum-content-of-natural-law
    difficulty: 2
    stem: What does Hart say the "simple truisms" disclose?
    options:
      - text: The core of good sense in the doctrine of Natural Law.
        correct: true
        why: 'Correct — CL 199: the simple truisms "not only disclose the core of good sense in the doctrine of Natural Law".'
      - text: The logical impossibility of any legal system without justice.
        why: Tempting because it sounds like natural law, but Hart speaks of good sense and natural necessity, not logical impossibility.
      - text: The hidden commands of the sovereign behind every rule of law.
        why: Tempting because it recalls Austin, but the truisms concern human vulnerability and protection, not sovereign commands.
  - key: b13
    type: mcq
    concept: minimum-content-of-natural-law
    difficulty: 3
    variant-of: b05
    stem: Which of these would Hart accept as consistent with the minimum content of natural law?
    options:
      - text: A regime that protects the lives and property of its ruling group while brutally oppressing the majority.
        correct: true
        why: 'Correct — the lecture: Hart does not deny that a strong minority can run a terrible dictatorship; the minimum protection may extend only to some.'
      - text: A regime in which no rule protects anyone, not even officials, from violence by any other person.
        why: Tempting because the minimum content is modest, but a system giving no protection to anyone, even its officials, would be a suicide pact.
      - text: A regime whose every law must pass a test of true moral justice before it can become valid.
        why: Tempting because it sounds like natural law, but that is the Thomist lex iniusta claim; Hart's minimum content requires far less.
  - key: b14
    type: mcq
    concept: minimum-content-of-natural-law
    difficulty: 2
    stem: What does "empirical version" of natural law mean in the Week 4 slides?
    options:
      - text: A version resting on facts about human beings and their setting, rather than on a necessary conceptual truth.
        correct: true
        why: Correct — Hart grounds it in natural facts and aims (after Hobbes and Hume); it is a natural necessity, not a conceptual connection.
      - text: A version resting on surveys showing that most people in fact believe laws should be morally just.
        why: Tempting because "empirical" suggests surveys, but Hart argues from simple truisms about human beings, not opinion polling.
      - text: A version resting on the moral principles discoverable by human reason without the aid of revelation.
        why: Tempting because it describes Thomist natural law, which Hart contrasts with his empirical version drawn from Hobbes and Hume.
  - key: b15
    type: mcq
    concept: minimum-content-of-natural-law
    difficulty: 3
    variant-of: b07
    stem: In an essay on whether law may have any content, which is the most accurate use of Hart's minimum content?
    options:
      - text: Hart denies that law may have any content, so he abandons the separation of law and morals.
        why: Tempting because he rejects the "any content" thesis, but he keeps the separation of law and morals as a conceptual claim.
      - text: Hart denies that law may have any content, while still denying a necessary connection between law and morality.
        correct: true
        why: Correct — Hart replies to the "any content" thesis with a natural necessity, yet keeps positivism's denial of a necessary (conceptual) connection.
      - text: Hart agrees that law may have any content, which is why he calls the principles of legality compatible with iniquity.
        why: Tempting because Hart links legality with iniquity, but here he expressly replies to the thesis that 'law may have any content'.
  - key: b16
    type: truefalse
    set: quickfire
    concept: minimum-content-of-natural-law
    difficulty: 1
    statement: For Hart, the minimum content of natural law underlies both positive law and social morality.
    answer: true
    why: 'True — the slide: rules restricting violence and requiring respect for property and promises constitute a minimum content underlying both.'
  - key: b17
    type: truefalse
    set: quickfire
    concept: minimum-content-of-natural-law
    difficulty: 2
    statement: 'Hart''s minimum content of natural law is a conceptual truth: no rule can be a law unless it protects persons, property and promises.'
    answer: false
    why: False — Hart calls it a natural necessity given natural facts and aims; it concerns what a system needs to survive, not the validity of each rule.
  - key: b18
    type: truefalse
    set: quickfire
    concept: minimum-content-of-natural-law
    difficulty: 2
    statement: Hart presents the minimum content as a reply to the positivist thesis that law may have any content.
    answer: true
    why: 'True — CL 199: "It is in this form that we should reply to the positivist thesis that ''law may have any content''"; the lecture says the target is Kelsen.'
  - key: b19
    type: truefalse
    set: quickfire
    concept: minimum-content-of-natural-law
    difficulty: 2
    statement: Finnis praised Hart's choice of the label "minimum content of natural law" as exactly right.
    answer: false
    why: 'False — the lecture: Finnis thought it unfortunate and said Hart should have called it the minimum content of positive law.'
  - key: c01
    type: mcq
    concept: harts-six-claims
    difficulty: 1
    set: pretest
    stem: Of Hart's six claims about the necessary connection between law and morality, which two does he say should be conceded?
    options:
      - text: (1) power and authority and (6) legal validity and resistance to law
        why: Tempting because Hart discusses power and authority at length, but he concedes (2) and (5); on (1) he denies that acceptance must be moral.
      - text: (2) the influence of morality on law and (5) principles of legality and justice
        correct: true
        why: 'Correct — the slide: of (2) and (5) Hart says that if this is what the necessary connection means, its existence should be conceded.'
      - text: (3) interpretation and (4) the criticism of law, the two in the middle of the list
        why: Tempting because these are listed claims, but the slide singles out (2) and (5) as the ones whose existence should be conceded.
  - key: c02
    type: mcq
    concept: harts-six-claims
    difficulty: 2
    stem: For Hart, what does the coercive power of law presuppose?
    options:
      - text: Its accepted authority, understood through the internal point of view.
        correct: true
        why: 'Correct — the slide: for Hart the coercive power of law presupposes its accepted authority; accepted authority → internal point of view.'
      - text: Its moral justice, as judged by principles of true morality discoverable by reason.
        why: Tempting because it is the natural law answer, but Hart says acceptance may rest on many considerations other than moral approval.
      - text: A habit of obedience to a sovereign who is not himself in the habit of obeying anyone.
        why: Tempting because that is Austin's account of the sovereign, which Hart rejects in favour of accepted rules.
  - key: c03
    type: mcq
    concept: harts-six-claims
    difficulty: 2
    stem: Which is NOT one of the considerations Hart lists (CL 203) on which allegiance to a legal system may be based?
    options:
      - text: Calculations of long-term interest.
        why: Tempting to pick because it sounds selfish, but it is the first consideration Hart lists.
      - text: An unreflecting inherited or traditional attitude.
        why: Tempting to pick because it sounds unthinking, but Hart lists it expressly.
      - text: A judgement that the system is morally just.
        correct: true
        why: Correct — it is not on Hart's list, and his point is that acceptance need not be moral approval; those who accept may even decide morally they ought not to.
      - text: The mere wish to do as others do.
        why: Tempting to pick because it seems too trivial, but Hart lists it as the final consideration.
  - key: c04
    type: mcq
    concept: harts-six-claims
    difficulty: 2
    stem: What are the two minimum conditions Hart says are necessary and sufficient for the existence of a legal system (CL 109)?
    options:
      - text: Valid rules generally obeyed, and secondary rules effectively accepted by officials as common public standards.
        correct: true
        why: 'Correct — CL 109: primary rules valid under the ultimate criteria must be generally obeyed; rules of recognition, change and adjudication accepted by officials.'
      - text: A sovereign habitually obeyed by the bulk of society, and sanctions reliably applied to those who disobey.
        why: Tempting because it is Austin's picture of a legal system, which Hart replaces with the union of primary and secondary rules.
      - text: A widely diffused recognition of a moral obligation to obey, and rules protecting persons, property and promises.
        why: Tempting because both appear this week, but the first is a natural law reading of NCLM and the second is the minimum content; neither is in CL 109.
  - key: c05
    type: mcq
    concept: harts-six-claims
    difficulty: 3
    contrasts-with:
      - finnis-central-case-method
    stem: Why does the lecture compare accepting the secondary rules of a legal system to accepting the rules of chess?
    options:
      - text: To show that officials must regard the legal rules as morally good, as players regard chess as a good game.
        why: 'Tempting because acceptance sounds like endorsement, but the lecture''s point is the reverse: you accept chess rules without a moral judgement on them.'
      - text: To show that acceptance is for the purpose of taking part, and need not involve any moral judgement on the rules.
        correct: true
        why: 'Correct — the lecture: you accept the rules of chess to play chess without passing moral judgement; officials accept secondary rules the same way.'
      - text: To show that law, like chess, is only a game, so that legal rules create no genuine obligations of any kind at all.
        why: Tempting because the analogy is to a game, but Hart explains legal obligation; he never says legal rules create no obligations.
  - key: c06
    type: mcq
    concept: harts-six-claims
    difficulty: 2
    stem: On the influence of morality on law, what contrast does Hart draw between the United States and England (CL 204)?
    options:
      - text: US criteria of validity may incorporate principles of justice; English legislation may still conform to morality.
        correct: true
        why: 'Correct — CL 204: some systems (the US) incorporate justice in the ultimate criteria; in others (England) legislation may no less scrupulously conform.'
      - text: In the US legislation always conforms to justice; in England legislation never does because Parliament is unlimited.
        why: Tempting because England has no formal restrictions on the supreme legislature, but Hart says its legislation may no less scrupulously conform to morality.
      - text: In the US morality is irrelevant to validity; in England the courts strike down immoral statutes under the common law.
        why: Tempting because it reverses the contrast, but it is the US whose criteria of validity may explicitly incorporate moral values.
  - key: c07
    type: mcq
    concept: harts-six-claims
    difficulty: 2
    stem: '"No ''positivist'' could deny that these are facts…" (CL 204). What does Hart treat as undeniable facts?'
    options:
      - text: That morality influences legal systems, whose stability depends in part on correspondence with morals.
        correct: true
        why: 'Correct — the slide: no positivist could deny these facts, or that stability depends in part upon such types of correspondence with morals.'
      - text: That every valid law in every legal system conforms to the demands of true morality or justice.
        why: Tempting because it is framed as a fact, but that is the natural law claim Hart denies; the influence he concedes is contingent.
      - text: That judges in all systems are free to disregard any validly enacted law that they personally think unjust.
        why: Tempting because it echoes Fuller's example of the Nazi regime, but Hart makes no such claim about judges in general.
  - key: c08
    type: mcq
    concept: harts-six-claims
    difficulty: 3
    stem: Why does conceding the influence of morality on law (claim 2) not trouble Hart's positivism?
    options:
      - text: Because the influence is contingent, a matter of fact; positivism resists only a conceptually necessary connection.
        correct: true
        why: 'Correct — the lecture: influence as a matter of fact is no problem for positivism; the claim positivism resists is conceptual necessity.'
      - text: Because the influence is always illegitimate, so positivists can treat it as a corruption of the law as it truly is.
        why: Tempting because positivists separate law and morals, but Hart treats the influence as a normal and stabilising fact, not a corruption.
      - text: Because the influence occurs only in the United States, which Hart sets aside as an unusual system.
        why: Tempting because Hart uses the US example, but he says systems generally are influenced by social morality and moral ideals.
  - key: c09
    type: mcq
    concept: harts-six-claims
    difficulty: 2
    stem: 'What does Hart say about the principles of legality: "a minimum of justice is necessarily realized whenever…"?'
    options:
      - text: …laws protect persons, property and promises against violence.
        why: Tempting because it is the minimum content, a separate argument; the legality passage is about general rules publicly announced and judicially applied.
      - text: …human behaviour is controlled by general rules publicly announced and judicially applied.
        correct: true
        why: 'Correct — CL 206: perhaps a minimum of justice is necessarily realised whenever human behaviour is controlled in this way.'
      - text: …officials accept the rule of recognition from the internal point of view.
        why: Tempting because acceptance is part of existence conditions, but CL 206 ties the minimum of justice to general, public, judicially applied rules.
  - key: c10
    type: mcq
    concept: harts-six-claims
    difficulty: 2
    stem: Which conditions does Hart say (CL 207) rules must satisfy if social control is to function?
    options:
      - text: They must be intelligible, within the capacity of most to obey, and not retrospective.
        correct: true
        why: 'Correct — CL 207: the rules must be intelligible and within the capacity of most to obey, and must not be retrospective.'
      - text: They must be just, democratically enacted, and consistent with international human rights.
        why: Tempting because they sound like proper conditions, but Hart lists only formal conditions, not substantive or democratic ones.
      - text: They must be backed by sanctions, issued by a sovereign, and obeyed out of habit.
        why: Tempting because they recall Austin, but CL 207 concerns intelligibility, capacity and prospectivity, not commands.
  - key: c11
    type: mcq
    concept: harts-six-claims
    difficulty: 2
    stem: Hart accepts the "inner morality of law" if that is what the necessary connection means. What does he add?
    options:
      - text: That it is unfortunately compatible with very great iniquity.
        correct: true
        why: 'Correct — CL 207: "It is unfortunately compatible with very great iniquity." A system can follow formal requirements and still be unjust.'
      - text: That it proves unjust laws are not valid law after all.
        why: 'Tempting because it concedes a connection, but Hart''s point is the opposite: formal legality does not exclude injustice or defeat validity.'
      - text: That it applies only to systems with a written constitution.
        why: Tempting because Hart uses the US example elsewhere, but the inner morality concerns general rules in any system of social control.
  - key: c12
    type: mcq
    concept: harts-six-claims
    difficulty: 3
    stem: Why does the lecture say Hart's "compatible with very great iniquity" is a counter example to the NCLM?
    options:
      - text: Because a system can comply with formal requirements of legality and still be unjust, so law does not guarantee justice.
        correct: true
        why: 'Correct — the lecture: if a system may follow the formal requirements and still be unjust, you have a counter example to the necessary connection.'
      - text: Because it shows that iniquitous systems always break the principles of legality, and that is precisely what makes them unjust.
        why: Tempting because that is roughly Fuller's hope, but Hart's point is that formal compliance and iniquity can coexist.
      - text: Because it shows that there is no connection whatever between law and justice, not even a minimum one.
        why: Tempting because it is a counter example, but Hart concedes a minimum of justice in general rules; he denies a stronger necessary link.
  - key: c13
    type: mcq
    concept: harts-six-claims
    difficulty: 3
    contrasts-with:
      - fullers-inner-morality-of-law
    stem: Which statement correctly distinguishes Hart's claim (5) from Fuller's inner morality of law?
    options:
      - text: Both accept the principles of legality; they disagree on whether compliance carries real moral weight.
        correct: true
        why: Correct — Hart accepts the principles if that is what the connection means, but says they are compatible with great iniquity; Fuller sees a moral dimension.
      - text: Hart rejects the principles of legality entirely; Fuller accepts them as necessary for law to function.
        why: Tempting because they debated, but Hart expressly says rules must be intelligible, obeyable and prospective, and "we may accept it".
      - text: Hart treats the principles as substantive moral content; Fuller treats them as mere technique with no moral dimension.
        why: 'Tempting because it names the right dispute, but it reverses them: Fuller claims the moral dimension and Hart plays it down.'
  - key: c14
    type: mcq
    concept: harts-six-claims
    difficulty: 2
    stem: What is Hart's method in the six-claims section, as the lecture presents it?
    options:
      - text: To replace a vague general claim of a necessary connection with precise, separable claims, each assessed on its own.
        correct: true
        why: 'Correct — the lecture: Hart says let''s be more precise and see the specific claims defended under the umbrella of the NCLM.'
      - text: To show that all six claims stand or fall together, so that refuting any one of them refutes the natural law tradition.
        why: Tempting because they share a label, but Hart treats them separately and concedes two while resisting others.
      - text: To prove that each of the six claims is false, so that no connection of any kind exists between law and morality.
        why: Tempting because Hart is a positivist, but he concedes (2) and (5); his target is conceptual necessity, not every connection.
  - key: c15
    type: mcq
    concept: harts-six-claims
    difficulty: 3
    variant-of: c05
    stem: A judge in a harsh regime applies its rules because she wants to keep her job and do as her colleagues do, though privately she thinks the system morally wrong. On Hart's account, is she accepting the rules?
    options:
      - text: 'No: acceptance from the internal point of view requires believing the rules to be morally justified.'
        why: Tempting because acceptance sounds like approval, but Hart says those who accept may decide morally they ought not to accept, yet continue.
      - text: 'Yes: allegiance may rest on long-term interest or the wish to do as others do, and need not be moral.'
        correct: true
        why: 'Correct — CL 203: allegiance may be based on many considerations, and one may accept the system while morally judging that one ought not to.'
      - text: 'No: she is merely in a habit of obedience, like the bulk of the population obeying Austin''s sovereign.'
        why: Tempting because her motives are self-interested, but she uses the rules as standards for official behaviour, which is acceptance, not habit.
  - key: c16
    type: mcq
    concept: harts-six-claims
    difficulty: 3
    variant-of: c12
    stem: Suppose a statute is general, public, prospective and clear, but authorises the expropriation of a minority. How would Hart use this?
    options:
      - text: As proof that the statute is not law, since the inner morality of law guarantees justice.
        why: Tempting because it satisfies the principles, but Hart denies that legality guarantees justice; this is Fuller's hope, not Hart's view.
      - text: As an illustration that legality is compatible with very great iniquity.
        correct: true
        why: Correct — a rule can meet the formal requirements and still be unjust, which is the counter example Hart offers (CL 207).
      - text: As evidence that the minimum content of natural law has been breached, so the system has ended.
        why: Tempting because minorities may lack protection, but Hart accepts that a system may protect only some; one statute does not end the system.
  - key: c17
    type: truefalse
    set: quickfire
    concept: harts-six-claims
    difficulty: 1
    statement: Hart lists six claims about the necessary connection of law and morality, including interpretation and the criticism of law.
    answer: true
    why: True — the six claims are power and authority, influence of morality, interpretation, criticism of law, principles of legality and justice, and validity and resistance.
  - key: c18
    type: truefalse
    set: quickfire
    concept: harts-six-claims
    difficulty: 2
    statement: For Hart, those who accept the authority of a legal system must believe that, morally, they ought to accept it.
    answer: false
    why: 'False — CL 203: there is no reason why those who accept should not decide that morally they ought not to accept it, yet for a variety of reasons continue.'
  - key: c19
    type: truefalse
    set: quickfire
    concept: harts-six-claims
    difficulty: 2
    statement: Hart says the inner morality of law is unfortunately compatible with very great iniquity.
    answer: true
    why: 'True — CL 207: if the principles of legality are what the necessary connection means, we may accept it; it is compatible with very great iniquity.'
  - key: c20
    type: truefalse
    set: quickfire
    concept: harts-six-claims
    difficulty: 3
    statement: In The Concept of Law, Hart names Lon Fuller in the text as the critic who called the principles of legality 'the inner morality of law'.
    answer: false
    why: False — Hart refers to "one critic of positivism"; the lecture notes Hart does not mention Fuller by name there, though the critic is Fuller.
  - key: d01
    type: mcq
    concept: fullers-inner-morality-of-law
    difficulty: 1
    set: pretest
    stem: Which of these is NOT one of Fuller's principles of legality on the Week 4 slide?
    options:
      - text: Laws must be prospective.
        why: Tempting to pick because retrospective laws are sometimes used, but prospectivity is the third of the eight principles.
      - text: Laws must be morally just in their content.
        correct: true
        why: 'Correct — Fuller''s principles are formal: general, public, prospective, clear, coherent, practicable, stable, and congruence; none prescribes just content.'
      - text: There must be congruence between official action and the law.
        why: Tempting to pick because it concerns officials rather than laws, but congruence is the final (eighth) principle on the slide.
      - text: Laws must be practicable.
        why: Tempting to pick because it sounds like policy, but practicable (not demanding the impossible) is one of the eight.
  - key: d02
    type: mcq
    concept: fullers-inner-morality-of-law
    difficulty: 1
    stem: How does Fuller define law, as quoted on the slide?
    options:
      - text: The command of a sovereign to political inferiors, backed by the threat of a sanction.
        why: Tempting because it is a famous definition, but it is Austin's command theory, not Fuller's.
      - text: The enterprise of subjecting human conduct to the governance of rules.
        correct: true
        why: 'Correct — the slide: "Law is the enterprise of subjecting human conduct to the governance of rules" (see Bix pp 77–82).'
      - text: The union of primary rules of obligation with secondary rules of recognition, change and adjudication.
        why: Tempting because it is this unit's central definition, but it is Hart's account of the essence of law.
  - key: d03
    type: mcq
    concept: fullers-inner-morality-of-law
    difficulty: 2
    stem: In the 1958 debate, what does Fuller say Hart should concern himself more closely with?
    options:
      - text: A definition of law that will make meaningful the obligation to fidelity to law.
        correct: true
        why: 'Correct — Fuller, 635: Hart should "concern himself more closely with a definition of law that will make meaningful the obligation to fidelity to law."'
      - text: A definition of law that will explain the sanctions attached to disobedience.
        why: Tempting because obligation and sanction are linked for Austin, but Fuller asks about fidelity to law, not sanctions.
      - text: A definition of law that will separate legal validity from all moral questions entirely.
        why: Tempting because that is Hart's project, but Fuller is criticising that separation, asking for a definition that makes fidelity meaningful.
  - key: d04
    type: mcq
    concept: fullers-inner-morality-of-law
    difficulty: 2
    stem: Fuller says most of the issues in Hart's essay "can be restated in terms of the distinction between…"
    options:
      - text: …law as it is and law as it ought to be.
        why: Tempting because it is the positivist distinction Hart defends, but Fuller's restatement is order versus good order.
      - text: …order and good order.
        correct: true
        why: 'Correct — Fuller, 644: most of the issues "can be restated in terms of the distinction between order and good order".'
      - text: …primary and secondary rules.
        why: Tempting because it is Hart's structural distinction, but Fuller's reply turns on order and good order.
      - text: …power and authority.
        why: Tempting because it is the first of Hart's six claims, but it is not Fuller's restatement of the debate.
  - key: d05
    type: mcq
    concept: fullers-inner-morality-of-law
    difficulty: 2
    stem: What does Fuller mean by the inner morality of law?
    options:
      - text: An external morality, such as principles of justice, used by critics to evaluate laws and legal systems from outside.
        why: Tempting because that is how morality usually relates to law, but the lecture stresses Fuller is not thinking of external moral criteria.
      - text: 'The morality within the law: what law must comply with to be law, expressed in the principles of legality.'
        correct: true
        why: 'Correct — the lecture: Fuller, as a proper jurist, focuses on the morality within the law that law has to follow to be law.'
      - text: The private moral convictions of judges, which they may substitute for the law when it is unjust.
        why: Tempting because Fuller discusses judges, but he criticised judges who disregarded validly enacted law; inner morality is not judicial conscience.
  - key: d06
    type: mcq
    concept: fullers-inner-morality-of-law
    difficulty: 3
    stem: Why does Fuller think his formal principles have a moral dimension, on the lecture's account?
    options:
      - text: Because following them treats the subjects of law as autonomous rational beings who can respond to rules.
        correct: true
        why: 'Correct — the lecture: only autonomous rational beings can respond to laws following these principles, and that recognition carries a moral dimension.'
      - text: Because following them guarantees that the content of every law will be just and morally desirable.
        why: Tempting because Fuller links legality with good order, but the principles give no information about content; Hart's objection is exactly that.
      - text: Because they were derived from principles of true morality discoverable by human reason without revelation.
        why: Tempting because that is the Thomist tradition, but Fuller is a procedural theorist; his principles come from the enterprise of governing by rules.
  - key: d07
    type: mcq
    concept: fullers-inner-morality-of-law
    difficulty: 2
    stem: In the lecture's account of the opening of The Morality of Law, why does Rex fail?
    options:
      - text: Because his laws are unjust in content, so his subjects refuse to obey them.
        why: Tempting because unjust laws often fail, but the lecture says Rex fails not because of content but because the rules cannot be complied with.
      - text: Because he tries to govern case by case, and nobody could comply with his directives.
        correct: true
        why: 'Correct — the lecture: Rex tries to administer justice case by case and fails, because it is impossible for people to comply.'
      - text: Because his subjects do not recognise any moral obligation to obey the law.
        why: Tempting because it echoes the second NCLM reading, but Rex's failure is a failure of legality, not of his subjects' moral attitudes.
  - key: d08
    type: mcq
    concept: fullers-inner-morality-of-law
    difficulty: 2
    stem: What did Fuller say about Hitler's government in "Positivism and Fidelity to Law"?
    options:
      - text: That its laws were valid because they were enacted by a recognised legislature, however unjust their content.
        why: Tempting because it is the positivist answer, but Fuller's point was that the regime abandoned legality itself.
      - text: That its judges were ready to disregard validly enacted law and officials to act "through the party in the streets".
        correct: true
        why: 'Correct — the slide (Fuller, 652): judges ready to disregard validly enacted law, state officials ready "to act through the party in the streets".'
      - text: That it complied fully with all eight principles of legality, which proves that the principles are compatible with great iniquity.
        why: 'Tempting because it would support Hart''s reply, but Fuller argued the opposite: the regime did not respect legality.'
  - key: d09
    type: mcq
    concept: fullers-inner-morality-of-law
    difficulty: 3
    contrasts-with:
      - finnis-central-case-method
    stem: Which statement best contrasts Fuller's approach with Finnis's?
    options:
      - text: Fuller is procedural, focusing on the form of law; Finnis is substantive, focusing on basic goods and justice.
        correct: true
        why: 'Correct — the slides: procedural natural law theories (Fuller) and substantive natural law theories (Finnis).'
      - text: Fuller is substantive, focusing on the content of just laws; Finnis is procedural, focusing on legal form.
        why: Tempting because both are natural law theorists, but this reverses them; Fuller's definition of law contains no content.
      - text: Fuller is a positivist who accepts the separation thesis; Finnis is the only natural law theorist of the week.
        why: Tempting because Fuller's principles are formal, but Fuller is presented as a natural law theorist who debated Hart.
  - key: d10
    type: mcq
    concept: fullers-inner-morality-of-law
    difficulty: 2
    stem: What are Hart's "two simple things" that Bentham and Austin were anxious to assert?
    options:
      - text: That law is a command of the sovereign, and that every command is backed by a threatened sanction.
        why: Tempting because they are Austin's doctrines, but Hart's two simple things concern the relation between law and morality.
      - text: That a rule's immorality does not make it not law, and a rule's moral desirability does not make it law.
        correct: true
        why: 'Correct — Hart, 599: absent an express provision, neither immorality nor moral desirability settles whether a rule is a rule of law.'
      - text: That law and morality never overlap, and that judges must ignore all morality in deciding hard cases.
        why: Tempting because it sounds like strict separation, but Hart accepts overlap; the two things are about what follows for legal validity.
  - key: d11
    type: mcq
    concept: fullers-inner-morality-of-law
    difficulty: 3
    contrasts-with:
      - harts-six-claims
    stem: The "two simple things" include the words "in the absence of an expressed constitutional or legal provision". Why does that qualification matter?
    options:
      - text: A system may expressly make moral standards part of its criteria of validity, as Hart says of the United States.
        correct: true
        why: Correct — the qualification leaves room for systems that incorporate morality, which Hart concedes in claim (2) (CL 204).
      - text: It shows that Hart accepts the strong natural law thesis wherever a constitution exists.
        why: Tempting because the qualification mentions constitutions, but incorporating morality by express provision is a positivist, contingent link, not the strong thesis.
      - text: It means that constitutional provisions are never rules of law, only moral guidelines for judges.
        why: Tempting because constitutions often contain moral terms, but Hart treats them as law; the point is that validity depends on what the system provides.
  - key: d12
    type: mcq
    concept: fullers-inner-morality-of-law
    difficulty: 2
    stem: Which of Fuller's principles is breached by a law that is kept secret from those bound by it?
    options:
      - text: Stability.
        why: Tempting because secret laws are unreliable, but stability concerns laws not being changed too often; secrecy breaches publicity.
      - text: Public.
        correct: true
        why: Correct — laws must be public (promulgated, so they can be known); a secret law breaches this principle.
      - text: Coherence.
        why: Tempting because secret laws may conflict with public ones, but coherence concerns contradiction; secrecy breaches publicity.
  - key: d13
    type: mcq
    concept: fullers-inner-morality-of-law
    difficulty: 2
    variant-of: d12
    stem: A new statute makes conduct that was lawful last year a criminal offence, and applies to acts done last year. Which principle does it breach?
    options:
      - text: Prospective — laws must not be retrospective.
        correct: true
        why: Correct — a law applying to past conduct is retrospective; Fuller and Hart (CL 207) both require rules not to be retrospective.
      - text: Congruence — officials must act in line with the declared law.
        why: Tempting because officials enforce it, but congruence is about official action matching the rules; here the rule itself looks backwards.
      - text: General — laws must be rules and not individual commands.
        why: Tempting because generality is fundamental, but the statute can be perfectly general; its defect is retrospectivity.
      - text: Practicable — laws must not demand the impossible.
        why: Tempting because one cannot now change past conduct, which is related, but the named defect on the slide is retrospectivity.
  - key: d14
    type: mcq
    concept: fullers-inner-morality-of-law
    difficulty: 3
    variant-of: d12
    stem: Police routinely ignore a published regulation and arrest people for conduct it expressly permits. Which principle is breached most directly?
    options:
      - text: Clarity, since the regulation must have been unclear.
        why: Tempting because confusion often causes this, but the regulation expressly permits the conduct; the fault lies with official action.
      - text: Congruence between official action and the law.
        correct: true
        why: Correct — the final principle requires congruence between official action and the law; officials acting against the rules breach it.
      - text: Coherence, since the regulation contradicts the arrests.
        why: Tempting because there is a conflict, but coherence is about rules contradicting each other, not officials departing from rules.
  - key: d15
    type: mcq
    concept: fullers-inner-morality-of-law
    difficulty: 3
    stem: Research essay Question 2 asks whether minimum respect for Fuller's principles is essential to count as law, or simply makes law more effective. Which opening best shows understanding, according to the unit-wide deck?
    options:
      - text: Observing that "constitutive of law" and "morally valuable" need not stand or fall together, and taking a position on each.
        correct: true
        why: Correct — the deck says the two limbs are not contradictories; separating the constitutive and moral claims is the move that wins Question 2.
      - text: Listing all eight principles in order with an example of each, then stating a preference for Fuller.
        why: Tempting because accuracy matters, but the deck warns an accurate catalogue with a verdict bolted on caps you at Credit.
      - text: Arguing that Hart rejected the principles of legality entirely, so Fuller must be right.
        why: Tempting because Hart and Fuller debated, but Hart accepted the principles "if this is what the necessary connection means"; this misreads him.
  - key: d16
    type: truefalse
    set: quickfire
    concept: fullers-inner-morality-of-law
    difficulty: 1
    statement: Fuller's principles of legality include that laws must be general, public, prospective, clear, coherent, practicable and stable.
    answer: true
    why: True — the slide lists these seven, plus congruence between official action and the law, making eight principles.
  - key: d17
    type: truefalse
    set: quickfire
    concept: fullers-inner-morality-of-law
    difficulty: 2
    statement: Fuller's inner morality of law is an external set of moral criteria used to evaluate laws from outside the legal system.
    answer: false
    why: 'False — the lecture: it is the morality within the law that law must comply with to be law, not external criteria used to evaluate it.'
  - key: d18
    type: truefalse
    set: quickfire
    concept: fullers-inner-morality-of-law
    difficulty: 1
    statement: The Hart–Fuller debate was published in the Harvard Law Review, Vol 71, 1958.
    answer: true
    why: True — Hart's 'Positivism and the Separation of Law and Morals' and Fuller's reply 'Positivism and Fidelity to Law' appear there.
  - key: d19
    type: truefalse
    set: quickfire
    concept: fullers-inner-morality-of-law
    difficulty: 2
    statement: Fuller's definition of law as the enterprise of subjecting human conduct to the governance of rules refers to specific moral content.
    answer: false
    why: 'False — the lecture: there is no reference to specific content in this definition; the principles are formal requirements of legality.'
  - key: e01
    type: mcq
    concept: finnis-central-case-method
    difficulty: 2
    set: pretest
    stem: What is Finnis's claim at the opening of Natural Law and Natural Rights (p 3)?
    options:
      - text: No theorist can describe and analyse social facts without also participating in the work of evaluation.
        correct: true
        why: 'Correct — NLNR 3: no theorist can give a theoretical description and analysis of social facts without also participating in evaluation.'
      - text: Every evaluation of law must be preceded by a value-free description and analysis of law as it exists in fact.
        why: Tempting because Finnis quotes it, but it is the view he says "is often supposed" and then rejects.
      - text: Legal theorists should abandon description and write only normative theories of what law ought to be.
        why: Tempting because Finnis stresses evaluation, but his claim concerns what even a descriptive theory requires, not abandoning description.
  - key: e02
    type: mcq
    concept: finnis-central-case-method
    difficulty: 2
    contrasts-with:
      - laws2100-w01-six-kinds-of-questions
    stem: Is Finnis's NLNR 3 claim about the nature of law or the nature of jurisprudence?
    options:
      - text: 'The nature of law: it says that every law must be morally good to count as law.'
        why: Tempting because Finnis is a natural law theorist, but this passage concerns method — how a theorist describes law — not law's validity.
      - text: 'The nature of jurisprudence: it is about the methodology of describing law, which requires evaluation.'
        correct: true
        why: 'Correct — the lecture: here Finnis is attacking the strong separation between descriptive and evaluative theories, a claim about legal theory.'
      - text: 'Neither: it is a doctrinal claim about what Australian law requires on the separation of judicial power.'
        why: Tempting because Finnis wrote a thesis on judicial power in Australian law, but NLNR 3 is a methodological claim.
  - key: e03
    type: mcq
    concept: finnis-central-case-method
    difficulty: 1
    stem: Which three features does Finnis say mark the sophistication of Hart's and Raz's method (NLNR 6)?
    options:
      - text: Attention to practical point; selection of central case and focal meaning; selection of viewpoint.
        correct: true
        why: 'Correct — NLNR 6: the three principal features of the more sophisticated method.'
      - text: Attention to sanctions; selection of a sovereign; selection of a habit of obedience in the bulk of society.
        why: Tempting because they are Austin's building blocks, but Finnis calls those methodologies naive.
      - text: Attention to generality; selection of publicity; selection of prospective rules.
        why: Tempting because they sound methodical, but they echo Fuller's principles of legality, not Finnis's three features.
  - key: e04
    type: mcq
    concept: finnis-central-case-method
    difficulty: 2
    stem: Whose methodologies does Finnis call "rather naive"?
    options:
      - text: Hart and Raz
        why: Tempting because Finnis criticises Hart, but he credits Hart and Raz with greater explanatory power and a decisive break from naive methods.
      - text: Bentham, Austin and Kelsen
        correct: true
        why: 'Correct — NLNR 6: the greater explanatory power of Hart and Raz comes from their break with the rather naive methodologies of Bentham, Austin and Kelsen.'
      - text: Fuller and Aquinas
        why: Tempting because they are natural law thinkers Finnis could criticise, but NLNR 6 names Bentham, Austin and Kelsen.
      - text: Dworkin and Radbruch
        why: Tempting because both are critics of positivism mentioned in the unit, but Finnis does not call their methods naive here.
  - key: e05
    type: mcq
    concept: finnis-central-case-method
    difficulty: 3
    stem: According to the slides, why do descriptive theorists disagree with each other?
    options:
      - text: Because they have access to different data about how legal systems work in practice.
        why: Tempting because disagreement often has that source, but the slide says they are "all equally familiar" with the field of data.
      - text: Because they disagree on what is important and significant in data they are equally familiar with.
        correct: true
        why: 'Correct — the slide: descriptive theorists disagree on what is important and significant in the field of data and experience they share.'
      - text: Because some of them are positivists and some natural lawyers, and each side systematically misreads the other.
        why: Tempting because the camps do clash, but Finnis's point applies even among descriptive theorists such as Austin and Hart.
  - key: e06
    type: mcq
    concept: finnis-central-case-method
    difficulty: 3
    stem: Hart's objection to Austin is that his theory "failed to fit the facts". What does Finnis make of this?
    options:
      - text: That Hart abandoned description altogether, turning jurisprudence into a normative project very like Finnis's own.
        why: Tempting because Finnis finds evaluation in Hart, but the slide says Hart retains Austin's fundamentally descriptive purpose.
      - text: That Hart kept a descriptive aim, but judging which facts are salient already involves judgements of importance.
        correct: true
        why: 'Correct — the lecture: calling some features salient or significant is expressing a value judgement on their importance; that is where Finnis focuses.'
      - text: 'That Hart was simply wrong: Austin''s theory in fact fits all the facts of modern legal systems.'
        why: Tempting because Finnis criticises Hart, but he agrees Hart's analysis has greater explanatory power than Austin's.
  - key: e07
    type: mcq
    concept: finnis-central-case-method
    difficulty: 2
    stem: What does Hart say may be regarded as the "essence" of law (CL 155)?
    options:
      - text: The union of primary rules of obligation and secondary rules of recognition, change and adjudication.
        correct: true
        why: 'Correct — CL 155: their union may justly be regarded as the essence of law, though they may not always be found together where "law" is correctly used.'
      - text: The necessary connection between law and morality, taken as central to any analysis of law.
        why: Tempting because Hart also quotes that at CL 155, but that is the natural law claim he describes, not his own view.
      - text: The command of a sovereign habitually obeyed, backed by threats of sanctions against the disobedient.
        why: Tempting because it is Austin's essence of law, which Hart rejects in the early chapters.
  - key: e08
    type: mcq
    concept: finnis-central-case-method
    difficulty: 2
    contrasts-with:
      - laws2100-w01-definition-per-genus-et-differentiam
    stem: How does Hart's caveat "though they may not always be found together wherever the word 'law' is correctly used" show a central case method?
    options:
      - text: It treats the union of rules as the central case, while allowing borderline cases such as international law.
        correct: true
        why: 'Correct — the lecture: the modern state''s legal system is the central case; international law, a set of primary rules, is more peripheral.'
      - text: It shows that Hart defines law by necessary and sufficient conditions that every single instance must satisfy.
        why: Tempting because definitions often work that way, but the caveat admits instances lacking the union, which is what central-case thinking allows.
      - text: It shows that Hart thinks the word "law" is used incorrectly whenever the union of rules is absent.
        why: Tempting because it contrasts cases, but Hart says the word can be correctly used even where the two types of rule are not found together.
  - key: e09
    type: mcq
    concept: finnis-central-case-method
    difficulty: 3
    stem: What is Finnis's objection to Hart's internal point of view?
    options:
      - text: Hart treats it as an amalgam of very different viewpoints; he should have focused on its central case.
        correct: true
        why: 'Correct — the slide: for Hart the internal point of view is an amalgam (CL 203); Finnis says Hart should have focused on its central case.'
      - text: Hart ignores it altogether and describes law only from the external point of view of a detached observer.
        why: Tempting because Finnis criticises Hart's method, but Hart gives explanatory priority to the internal point of view.
      - text: Hart restricts it to judges and ignores ordinary citizens, who are the true central case of law.
        why: Tempting because Hart focuses on officials, but Finnis's objection is about the mix of attitudes, not which group holds them.
  - key: e10
    type: mcq
    concept: finnis-central-case-method
    difficulty: 3
    stem: For Finnis, what must a theorist consider to identify the central case of the internal point of view?
    options:
      - text: What the requirements of practical reasonableness really are, in relation to basic goods of human flourishing.
        correct: true
        why: 'Correct — the slide: a theorist cannot identify it unless they consider the requirements of practical reasonableness in relation to the basic goods.'
      - text: What the majority of officials in a given legal system happen to believe about the law they apply.
        why: Tempting because it sounds empirical, but Finnis rejects treating all viewpoints alike; the majority's view need not be the central case.
      - text: What the sovereign intends the law to achieve, as expressed in the commands the sovereign issues.
        why: Tempting because it concerns law's point, but it is Austin's framework; Finnis's criterion is practical reasonableness.
  - key: e11
    type: mcq
    concept: finnis-central-case-method
    difficulty: 2
    stem: According to the lecture, whose point of view is the central case of the internal point of view for Finnis?
    options:
      - text: The reasonable person.
        correct: true
        why: 'Correct — the lecture: the central case of the internal point of view is the point of view of the reasonable person, explained through practical reasonableness.'
      - text: The ordinary citizen who obeys out of habit.
        why: Tempting because citizens obey the primary rules, but habitual obedience is not a viewpoint of the practically reasonable person.
      - text: The judge who follows the rule of recognition for any reason.
        why: Tempting because Hart focuses on officials, but 'for any reason' is the amalgam Finnis rejects.
  - key: e12
    type: mcq
    concept: finnis-central-case-method
    difficulty: 2
    stem: On Finnis's central case of law (NLNR 260), what does the authority of law depend on?
    options:
      - text: Its justice, or at least its ability to secure justice.
        correct: true
        why: 'Correct — NLNR 260: "The authority of the law depends … on its justice or at least its ability to secure justice."'
      - text: Its effectiveness, meaning the degree to which it is obeyed.
        why: Tempting because effectiveness matters, but Finnis says coercive force is not merely a matter of effectiveness, and ties authority to justice.
      - text: Its pedigree under a rule of recognition accepted by officials.
        why: Tempting because that is Hart's test of validity, but Finnis's central case grounds authority in justice.
  - key: e13
    type: mcq
    concept: finnis-central-case-method
    difficulty: 3
    stem: How does Finnis describe the central case of law and legal system in NLNR 260?
    options:
      - text: The law of a complete community, claiming authority to give comprehensive and supreme direction and to validate all other normative arrangements.
        correct: true
        why: 'Correct — NLNR 260: the law and legal system of a complete community, purporting to have comprehensive and supreme authority.'
      - text: The law of the modern state, identified because it is the most common instance of law found here and now.
        why: Tempting because Hart uses the modern state, but the lecture questions whether frequency is a good criterion; Finnis describes a complete community.
      - text: The law of any group whose rules are general, public and prospective, whatever its aims.
        why: Tempting because it echoes Fuller's principles, but Finnis defines the central case by comprehensive authority and justice.
  - key: e14
    type: mcq
    concept: finnis-central-case-method
    difficulty: 3
    stem: Which statement about Finnis's attitude to Hart is most accurate?
    options:
      - text: Finnis rejects Hart's theory entirely and borrows none of his concepts.
        why: Tempting because Finnis is a natural law critic, but the lecture says he agrees with many points and uses concepts Hart introduced.
      - text: Finnis credits Hart with a better method, then argues it needs evaluation that Hart cannot supply.
        correct: true
        why: Correct — Finnis praises the break with naive methods (NLNR 6), then argues central case and viewpoint selection require evaluation.
      - text: Finnis agrees with Hart entirely and differs from him only on the label "minimum content of natural law".
        why: Tempting because Finnis did object to that label, but he also attacks Hart's methodology and the amalgam view of the internal point of view.
  - key: e15
    type: mcq
    concept: finnis-central-case-method
    difficulty: 3
    variant-of: e06
    contrasts-with:
      - laws2100-w01-general-and-descriptive-theory
    stem: 'An essay argues: "Hart''s theory is value-free because he never says any law is good." What is the best Finnis-based objection?'
    options:
      - text: Choosing what is central, significant and from whose viewpoint to describe law is itself an evaluation.
        correct: true
        why: 'Correct — Finnis: descriptive theorists must select central case and viewpoint; those selections involve judgements of importance.'
      - text: Hart does in fact say that all laws are good, so his theory is plainly a normative theory.
        why: Tempting because it sounds like a direct rebuttal, but Hart says his account has no justificatory aims; Finnis's objection is subtler.
      - text: Hart's theory depends on sanctions, and sanctions are always evaluated morally by those who come to suffer them.
        why: Tempting because it links law and evaluation, but Hart denies that sanctions are necessary, and Finnis's objection is about method.
  - key: e16
    type: mcq
    concept: finnis-central-case-method
    difficulty: 2
    variant-of: e01
    stem: Why does the lecture use the example of friendship to explain Finnis's method?
    options:
      - text: To show that describing real friendships requires an understanding of what a good friend is.
        correct: true
        why: 'Correct — the lecture: you need values to understand what a good friend is to be able to describe friendship in the real world; the same for law.'
      - text: To show that friendship, like law, can be defined per genus et differentiam by listing its necessary features.
        why: Tempting because definitions were discussed in week 1, but the lecture says we should look at the central case instead of necessary features.
      - text: To show that friendship is a private matter which, unlike law, needs no evaluation at all to describe.
        why: Tempting because friendship is personal, but the example is used to show evaluation is needed for both.
  - key: e17
    type: truefalse
    set: quickfire
    concept: finnis-central-case-method
    difficulty: 1
    statement: Finnis credits the descriptive analyses of Hart and Raz with noticeably greater explanatory power than those of Bentham, Austin and Kelsen.
    answer: true
    why: 'True — NLNR 6: their greater explanatory power is attributed to a fairly decisive break with the rather naive methodologies of Bentham, Austin and Kelsen.'
  - key: e18
    type: truefalse
    set: quickfire
    concept: finnis-central-case-method
    difficulty: 2
    statement: For Hart, the internal point of view is a single uniform attitude of moral approval of the legal system.
    answer: false
    why: 'False — the slide: for Hart it is an amalgam of very different viewpoints (CL 203), and acceptance need not be moral approval.'
  - key: e19
    type: truefalse
    set: quickfire
    concept: finnis-central-case-method
    difficulty: 2
    statement: Finnis argues that evaluation is necessary even to develop a descriptive theory of law.
    answer: true
    why: 'True — the lecture: evaluation is necessary to develop a descriptive theory, not only a normative one (NLNR 3).'
  - key: f01
    type: mcq
    concept: lex-iniusta-strong-and-weak
    difficulty: 1
    stem: What does the Latin maxim "lex iniusta non est lex" mean?
    options:
      - text: An unjust law is not a law.
        correct: true
        why: 'Correct — the slide: lex iniusta non est lex (an unjust law is not a law).'
      - text: A law without a sanction is not a law.
        why: Tempting because Austin ties law to sanctions, but the maxim is about injustice, not sanctions.
      - text: A law of nature cannot be broken by humans.
        why: Tempting because it mentions natural law, but the maxim concerns human-made laws that conflict with justice.
  - key: f02
    type: mcq
    concept: lex-iniusta-strong-and-weak
    difficulty: 2
    stem: What does the strong natural law thesis hold?
    options:
      - text: That unjust "laws" are laws, but not laws in the true sense of the word, being morally and legally defective.
        why: Tempting because it concerns unjust laws, but that is the weak natural law thesis, associated with Finnis.
      - text: That moral soundness is a necessary element of legal validity, so unjust "laws" are not legally valid.
        correct: true
        why: 'Correct — the slide: on the strong thesis moral soundness/validity is a necessary element of legal validity; unjust "laws" are not legally valid.'
      - text: That laws are valid whatever their content, though in fact they have often satisfied the demands of morality.
        why: Tempting because it is well known, but it is Hart's definition of legal positivism, the opposite of the strong thesis.
  - key: f03
    type: mcq
    concept: lex-iniusta-strong-and-weak
    difficulty: 2
    stem: What does the weak natural law thesis hold, as the slide presents Finnis?
    options:
      - text: Unjust "laws" are not laws in the true sense of the word; they are morally and legally defective.
        correct: true
        why: 'Correct — the slide: on the weak thesis unjust "laws" are not laws in the true sense (Finnis) and are morally and legally defective.'
      - text: Only extremely unjust "laws" are not legally valid; mildly unjust ones remain fully valid law.
        why: Tempting because it is a narrower claim, but the slide attributes that to Radbruch as a version of the strong thesis.
      - text: Unjust "laws" are perfectly good laws, and there is no connection of any kind between law and justice.
        why: Tempting because "weak" suggests little connection, but the weak thesis still says unjust laws are defective as laws.
  - key: f04
    type: mcq
    concept: lex-iniusta-strong-and-weak
    difficulty: 2
    stem: Which theorist does the slide give as holding that only extremely unjust "laws" are not legally valid?
    options:
      - text: John Finnis
        why: 'Tempting because Finnis discusses lex iniusta, but he holds the weak thesis: unjust laws are defective, not invalid.'
      - text: Lon Fuller
        why: Tempting because Fuller debated Nazi law with Hart, but the slide names Radbruch for the extreme-injustice version.
      - text: Gustav Radbruch
        correct: true
        why: 'Correct — the slide: for some theorists (eg Gustav Radbruch) only extremely unjust "laws" are not legally valid.'
      - text: H.L.A. Hart
        why: Tempting because Hart discussed the German cases, but Hart is a positivist who rejects both strong and weak theses.
  - key: f05
    type: mcq
    concept: lex-iniusta-strong-and-weak
    difficulty: 3
    contrasts-with:
      - finnis-central-case-method
    stem: Why does the lecture say Radbruch's claim, though narrower, belongs with the strong thesis?
    options:
      - text: 'Because it is still a claim about legal validity: extremely unjust laws are not legally valid.'
        correct: true
        why: 'Correct — the lecture: Radbruch argued extremely unjust laws are not legally valid, a claim about validity rather than about the central case.'
      - text: 'Because it is a claim about the central case: extremely unjust laws are peripheral but still valid.'
        why: Tempting because it describes the weak thesis, which is Finnis's central-case reading, not Radbruch's.
      - text: Because it denies any connection between law and morality, as positivists do.
        why: 'Tempting because the claim is limited, but it asserts a strong connection: extreme injustice defeats validity.'
  - key: f06
    type: mcq
    concept: lex-iniusta-strong-and-weak
    difficulty: 2
    stem: According to the slides, what is the key question when discussing lex iniusta non est lex?
    options:
      - text: Whether judges are ever permitted to refuse to apply a statute.
        why: Tempting because judges face that dilemma, but the slide frames the question about the obligation to obey the law.
      - text: How injustice affects the obligation to obey the law.
        correct: true
        why: 'Correct — the slide: "In this context, the key question is the following: How does injustice affect the obligation to obey the law?"'
      - text: Whether international law can override domestic law.
        why: Tempting because it concerns conflicts of norms, but the slide's question is how injustice affects the obligation to obey.
  - key: f07
    type: mcq
    concept: lex-iniusta-strong-and-weak
    difficulty: 3
    stem: Which is NOT one of Finnis's four senses of 'the obligation to obey the law'?
    options:
      - text: Empirical liability to be subjected to sanction in event of non-compliance.
        why: Tempting to pick because it sounds like no obligation at all, but it is the first sense Finnis lists.
      - text: Legal obligation in the intra-systemic sense (legal obligation "in the legal sense").
        why: Tempting to pick because it sounds circular, but it is the second sense on the slide.
      - text: A habit of obedience to a sovereign who habitually obeys no one.
        correct: true
        why: Correct — this is Austin's account of the sovereign, not one of Finnis's four senses.
      - text: Moral obligation that does not derive from the legality of the stipulation-of-obligation.
        why: Tempting to pick because it is not legal at all, but it is the fourth sense Finnis lists.
  - key: f08
    type: mcq
    concept: lex-iniusta-strong-and-weak
    difficulty: 3
    stem: The lecture says an unjust law is not a law "as a fallacious argument is not an argument". What is the point of the analogy?
    options:
      - text: That we still call it an argument, but measure it against the central case of a sound argument, and it falls short.
        correct: true
        why: 'Correct — the lecture: a fallacious argument is an argument, otherwise we would not use the term, but it is not properly one.'
      - text: That a fallacious argument is not an argument at all, just as an unjust law is legally invalid and void from the very start.
        why: Tempting because it restates the maxim literally, but that is the strong reading; the analogy supports Finnis's weak reading.
      - text: That arguments and laws can both be judged only by logic, never by morality or practical reasonableness.
        why: Tempting because arguments are judged by logic, but the analogy is about central and peripheral cases, not about excluding morality.
  - key: f09
    type: mcq
    concept: lex-iniusta-strong-and-weak
    difficulty: 3
    stem: On Finnis's view, how does the degree of a system's injustice relate to the central case of law?
    options:
      - text: The more unjust a system is, the more peripheral it is relative to the central case of law.
        correct: true
        why: 'Correct — the lecture: the more unjust a system is, the more peripheral it will be vis-à-vis the central case, where law and justice are together.'
      - text: Injustice has no bearing on the central case, which is fixed by the union of primary and secondary rules alone.
        why: Tempting because that is Hart's structural test, but for Finnis the central case includes law's link with justice.
      - text: Any injustice at all expels a system from the category of law, so there are no unjust legal systems.
        why: Tempting because it takes lex iniusta literally, but Finnis accepts there are many instances of unjust laws and legal systems.
  - key: f10
    type: mcq
    concept: lex-iniusta-strong-and-weak
    difficulty: 2
    variant-of: f03
    stem: 'A student says: "Finnis thinks unjust laws are legally invalid." What is the correction?'
    options:
      - text: Finnis holds the strong thesis, but only for extremely unjust laws, following Radbruch.
        why: Tempting because it softens the claim, but the extreme-injustice version is Radbruch's and still concerns validity.
      - text: 'Finnis holds the weak thesis: unjust laws are not laws in their central case, but that is not saying they are invalid.'
        correct: true
        why: 'Correct — the lecture: unjust laws are morally and legally defective, but that is not like saying they are legally invalid.'
      - text: Finnis rejects lex iniusta altogether, holding that justice is wholly irrelevant to whether or not a given rule is law.
        why: Tempting because Finnis departs from the traditional reading, but he reinterprets the maxim rather than rejecting it.
  - key: f11
    type: mcq
    concept: lex-iniusta-strong-and-weak
    difficulty: 3
    contrasts-with:
      - natural-law-and-positivism
    stem: How does the strong/weak distinction bear on an essay about the Thomist version of the NCLM?
    options:
      - text: The Thomist slide says conflicting man-made laws are not valid law — the strong reading — while Finnis, also Thomist, reads lex iniusta weakly.
        correct: true
        why: Correct — Hart states the Thomist view as invalidity, yet the lecture says Finnis follows a particular interpretation of Aquinas and adopts the weak thesis.
      - text: The Thomist tradition holds the weak thesis only, so the strong thesis has no historical basis in natural law.
        why: Tempting because Finnis is Thomist, but Hart states the Thomist NCLM as saying conflicting laws are not valid law, which is the strong reading.
      - text: The distinction is irrelevant, because both theses deny that there are principles discoverable by reason.
        why: Tempting because they are both about validity, but both theses assume there are principles of justice against which laws are measured.
  - key: f12
    type: mcq
    concept: lex-iniusta-strong-and-weak
    difficulty: 2
    contrasts-with:
      - minimum-content-of-natural-law
    stem: Which statement correctly contrasts lex iniusta with Hart's minimum content of natural law?
    options:
      - text: Lex iniusta judges the status of unjust laws; the minimum content says what a system needs to survive.
        correct: true
        why: Correct — the minimum content is a natural necessity for a system to exist; lex iniusta concerns the legal or moral status of unjust laws.
      - text: Both say that laws lacking protection for persons, property and promises are not legally valid laws.
        why: Tempting because both link law and morality, but Hart's minimum content makes no claim about the validity of particular laws.
      - text: Both were proposed by Hart as concessions to the natural law tradition in Chapter IX.
        why: Tempting because both appear in Hart's discussion, but lex iniusta is the natural law maxim Hart resists, not a concession.
  - key: f13
    type: mcq
    concept: lex-iniusta-strong-and-weak
    difficulty: 3
    variant-of: f10
    stem: A statute requires officials to confiscate the homes of a disfavoured group. On the weak natural law thesis, what is its status?
    options:
      - text: It is legally invalid from the start, so officials acting under it act without any legal authority whatsoever, even in form.
        why: Tempting because the statute is gravely unjust, but invalidity is the strong thesis; the weak thesis does not deny validity.
      - text: 'It is a law, but a defective one: not law in its central case or focal meaning, and morally and legally defective.'
        correct: true
        why: Correct — on Finnis's weak thesis the statute is a law in a watered-down sense, defective morally and legally, not in the central case.
      - text: It is a perfectly good law, since its validity depends only on whether it was enacted in the proper way.
        why: Tempting because it is the positivist answer on validity, but the weak thesis adds that such a law is defective as law.
  - key: f14
    type: mcq
    concept: lex-iniusta-strong-and-weak
    difficulty: 3
    stem: Which sense of 'obligation to obey' remains present even for a gravely unjust law in an effective regime?
    options:
      - text: Empirical liability to be subjected to sanction in event of non-compliance.
        correct: true
        why: 'Correct — the first of Finnis''s senses is a matter of fact: the regime can still sanction you, whatever the moral status of the law.'
      - text: Legal obligation in the moral sense.
        why: Tempting because it is labelled 'legal', but it is the moral force of legal obligation that injustice undermines.
      - text: Moral obligation deriving from the legality of the stipulation-of-obligation.
        why: Tempting because it sounds strong, but Finnis's point is that the moral force from legality is what injustice affects.
  - key: f15
    type: mcq
    concept: lex-iniusta-strong-and-weak
    difficulty: 2
    variant-of: f02
    stem: Which pairing of thesis and consequence is correct?
    options:
      - text: Strong thesis — unjust laws are not legally valid; weak thesis — unjust laws are defective, not laws in the true sense.
        correct: true
        why: Correct — the slide distinguishes the strong thesis (not legally valid) from the weak thesis (not laws in the true sense; morally and legally defective).
      - text: Strong thesis — unjust laws are defective; weak thesis — unjust laws are not legally valid.
        why: Tempting because both claims appear on the slide, but this reverses them.
      - text: Strong thesis — law may have any content; weak thesis — law must have a minimum content.
        why: Tempting because it echoes Hart's reply to Kelsen, but neither pairing describes the natural law theses.
  - key: f16
    type: mcq
    concept: lex-iniusta-strong-and-weak
    difficulty: 2
    stem: Why does the lecture say the strong/weak distinction matters?
    options:
      - text: It changes our understanding of the nature of law and of legal obligation.
        correct: true
        why: 'Correct — the lecture: whether lex iniusta is read strongly or weakly has consequences for the nature of law and the nature of legal obligation.'
      - text: It decides which natural law theorists are really positivists in disguise.
        why: Tempting because the weak thesis looks closer to positivism, but the lecture does not reclassify weak theorists as positivists.
      - text: It only matters for historians of Roman law, not for modern jurisprudence.
        why: Tempting because the maxim is Latin, but the lecture treats it as central to current debates about legal obligation.
  - key: f17
    type: truefalse
    set: quickfire
    concept: lex-iniusta-strong-and-weak
    difficulty: 1
    statement: According to the weak natural law thesis, unjust "laws" are morally and legally defective.
    answer: true
    why: 'True — the slide: on the weak thesis (Finnis) unjust "laws" are not laws in the true sense and are morally and legally defective.'
  - key: f18
    type: truefalse
    concept: lex-iniusta-strong-and-weak
    difficulty: 2
    statement: On the strong natural law thesis, unjust laws remain legally valid but are not laws in their focal meaning.
    answer: false
    why: False — that combines the weak thesis with validity; the strong thesis says unjust "laws" are not legally valid.
  - key: f19
    type: truefalse
    concept: lex-iniusta-strong-and-weak
    difficulty: 2
    statement: For Finnis, 'the obligation to obey the law' can mean empirical liability to be subjected to sanction in event of non-compliance.
    answer: true
    why: True — it is the first of Finnis's four senses on the slide, alongside intra-systemic legal obligation, legal obligation in the moral sense and moral obligation.
  - key: f20
    type: truefalse
    concept: lex-iniusta-strong-and-weak
    difficulty: 3
    statement: Finnis accepts that there are real instances of unjust laws and unjust legal systems.
    answer: true
    why: 'True — the lecture: there are instances of unjust laws and legal systems, but they are peripheral to the central case of law.'
  - key: s01
    type: short
    concept: natural-law-and-positivism
    difficulty: 3
    prompt: '"Natural law and legal positivism are opposed theories of the nature of law." Discuss.'
    model: 'The statement is half right: the camps disagree on one precise claim, not on everything. Natural law theories dispute the positivist claim that law and morality are conceptually separable; for them law is social facts plus conformity to moral standards of form and/or content. Hart defines positivism as the contention that it is in no sense a necessary truth that laws satisfy morality, though in fact they often have. Against the statement, Finnis says natural law theorists did not conceive their theories in opposition to positivism: Aquinas circulated the term "positive law", and natural law accepts that law is a sheer social fact of power and practice as well as a set of reasons that are often sound. On balance the opposition is real only at the conceptual level — the necessary connection, in its Thomist or moral-obligation version — and an essay should name which version it is testing rather than pit two monoliths against each other.'
    rubric:
      - id: r1
        criterion: Thesis — takes a clear position on whether the two camps are opposed, and in what respect.
        marks: 2
        top-band: States a qualified thesis (opposed on conceptual separability, not across the board) in the first two sentences.
        margin-note: Opposed about what, exactly?
        authorities: []
      - id: r2
        criterion: Argument — explains the positivist claim (Hart's definition) and the natural law claim (social facts + moral standards).
        marks: 3
        top-band: Quotes or closely paraphrases Hart CL 185–186 and the slide's definition of natural law, with the procedural/substantive split.
        margin-note: Use Hart's own definition of positivism.
        authorities:
          - hart-the-concept-of-law
      - id: r3
        criterion: Counterargument — presents Finnis's view that natural law theorists did not see themselves as opposed to positivism.
        marks: 3
        top-band: 'Uses the SEP passage: Aquinas and "positive law", shared positivist theses, law as social fact and as sound reasons.'
        margin-note: Good — this is the strongest objection to the statement.
        authorities:
          - finnis-natural-law-theories-sep
      - id: r4
        criterion: Evaluation — weighs the two and locates the disagreement precisely (which NCLM version).
        marks: 2
        top-band: Concludes by naming the Thomist or moral-obligation version of the NCLM as the true point of conflict.
        margin-note: Name the specific claim, not "the connection" in general.
        authorities: []
  - key: s02
    type: short
    concept: minimum-content-of-natural-law
    difficulty: 3
    prompt: Does Hart's "minimum content of natural law" concede too much to the natural law tradition?
    model: 'No: it concedes a core of good sense, not the necessary connection. Hart says rules restricting violence and requiring respect for property and promises are a minimum content underlying both positive law and social morality. Given natural facts and aims, this is a natural necessity, and "it is in this form that we should reply to the positivist thesis that ''law may have any content''" (CL 199) — a thesis the lecture attributes to Kelsen. The argument is empirical, from Hobbes and Hume: even a cruel dictatorship needs some members to accept its rules, and they will not unless the rules protect them. The counterargument is that Hart now sounds like a natural lawyer; Finnis thought the label unfortunate and said it should be the minimum content of positive law. But the protection may extend only to a ruling minority, and no single law is invalid for lacking it. On balance Hart concedes something about systems, as a natural necessity, while keeping positivism''s denial of a conceptual connection.'
    rubric:
      - id: r1
        criterion: Thesis — answers whether the concession goes too far, with a reason.
        marks: 2
        top-band: States that Hart concedes natural necessity but not conceptual necessity.
        margin-note: Yes or no — and why?
        authorities: []
      - id: r2
        criterion: Argument — explains the minimum content, its Hobbes/Hume basis, and the reply to the "any content" thesis.
        marks: 3
        top-band: Quotes CL 199 and explains the dictatorship/suicide pact reasoning from the lecture.
        margin-note: Who holds the "any content" thesis?
        authorities:
          - hart-the-concept-of-law
      - id: r3
        criterion: Counterargument — raises the objection that Hart has become a natural lawyer, using Finnis's comment on the label.
        marks: 3
        top-band: Uses Finnis's 'minimum content of positive law' remark accurately.
        margin-note: Nice use of Finnis here.
        authorities: []
      - id: r4
        criterion: Evaluation — resolves by distinguishing systems from individual laws and natural from conceptual necessity.
        marks: 2
        top-band: Shows the protection may extend only to some, so iniquity remains possible.
        margin-note: Show why this does not collapse into lex iniusta.
        authorities: []
  - key: s03
    type: short
    concept: harts-six-claims
    difficulty: 3
    prompt: '"There is a necessary connection between law and morality." Assess this claim using Hart''s six claims in Chapter IX of The Concept of Law.'
    model: 'The claim is true only in senses too weak to trouble positivism. Hart splits it into six claims: power and authority; influence of morality; interpretation; criticism of law; principles of legality and justice; validity and resistance. He concedes (2) and (5). Morality does influence law — the US incorporates principles of justice in its criteria of validity, and "no ''positivist'' could deny that these are facts" (CL 204) — but the link is contingent. On power and authority, coercive power presupposes accepted authority, yet allegiance may rest on long-term interest, tradition or the wish to do as others do (CL 203); acceptance is not moral approval. The strongest version for the claim is (5): perhaps a minimum of justice is realised whenever conduct is governed by general rules publicly announced and judicially applied, which Fuller calls the inner morality of law. Hart accepts even this, but it "is unfortunately compatible with very great iniquity" (CL 207). The necessary connection survives only in forms that do not guarantee just law.'
    rubric:
      - id: r1
        criterion: Thesis — takes a position on which senses of "necessary connection" hold.
        marks: 2
        top-band: States that the connection holds only in senses (2) and (5), which leave iniquity possible.
        margin-note: Which sense are you defending?
        authorities: []
      - id: r2
        criterion: Argument — explains power and authority, influence of morality, and the principles of legality, with CL 203, 204, 206–207.
        marks: 3
        top-band: Uses the allegiance passage and the US/England contrast precisely.
        margin-note: Quote the list of reasons for allegiance.
        authorities:
          - hart-the-concept-of-law
      - id: r3
        criterion: Counterargument — presents Fuller's view that the principles of legality are an inner morality of law.
        marks: 3
        top-band: States the strongest version of the claim before answering it.
        margin-note: Put the best case for the claim first.
        authorities:
          - fuller-the-morality-of-law
      - id: r4
        criterion: 'Evaluation — weighs the concessions: do they make law necessarily just?'
        marks: 2
        top-band: Uses "compatible with very great iniquity" to show why the concessions do not amount to the natural law thesis.
        margin-note: So what follows for positivism?
        authorities: []
  - key: s04
    type: short
    concept: fullers-inner-morality-of-law
    difficulty: 3
    prompt: Is minimum respect for Fuller's principles of legality essential for a system to count as law, or does it simply make law more effective?
    model: 'Respect for legality is essential to law, but that does not by itself make it moral. Fuller defines law as the enterprise of subjecting human conduct to the governance of rules; laws must be general, public, prospective, clear, coherent, practicable and stable, with congruence between official action and the law. In the lecture''s account of Fuller''s tale, Rex governs case by case and fails not because his laws are unjust but because no one could comply — so a total failure of legality is not law at all. Fuller adds that following the principles treats subjects as autonomous rational beings, hence "good order" rather than mere order. Hart replies that he can accept this inner morality, but "it is unfortunately compatible with very great iniquity" (CL 207): a regime can be legal and wicked. The two limbs of the question need not stand or fall together. The better view is that legality is constitutive of law, while its moral value must be argued separately, through agency and dignity rather than through the definition of law.'
    rubric:
      - id: r1
        criterion: Thesis — takes a position on both limbs (constitutive? merely efficient?).
        marks: 2
        top-band: Separates "constitutive" from "morally valuable" and takes a view on each.
        margin-note: The limbs are not contradictories — say so.
        authorities: []
      - id: r2
        criterion: Argument — explains Fuller's definition, the eight principles, Rex and order vs good order.
        marks: 3
        top-band: Uses Fuller 635/644 and the principles precisely; explains the autonomy argument.
        margin-note: Explain why Fuller calls it a morality.
        authorities:
          - fuller-the-morality-of-law
          - fuller-positivism-and-fidelity-to-law
      - id: r3
        criterion: Counterargument — presents Hart's reply that legality is compatible with very great iniquity.
        marks: 3
        top-band: 'Reads Hart accurately: he accepts the principles but denies they carry the moral weight Fuller wants.'
        margin-note: Hart concedes more than you suggest.
        authorities:
          - hart-the-concept-of-law
      - id: r4
        criterion: Evaluation — reaches a reasoned verdict that survives the counterargument.
        marks: 2
        top-band: Explains why the chosen step survives Hart's objection.
        margin-note: Why does your view survive Hart?
        authorities: []
  - key: s05
    type: short
    concept: finnis-central-case-method
    difficulty: 3
    prompt: '"A descriptive theory of law can be value-free." Discuss with reference to Finnis''s critique of Hart.'
    model: A descriptive theory can be morally neutral in its aims, but it cannot avoid judgements of importance, and Finnis argues those judgements are evaluative. Hart claims a theory that is general and descriptive, morally neutral and without justificatory aims. Finnis replies that no theorist can describe and analyse social facts without participating in evaluation (NLNR 3). He credits Hart and Raz with a decisive break from the naive methods of Bentham, Austin and Kelsen, through attention to practical point, central case and focal meaning, and viewpoint (NLNR 6). But which case is central, and from what viewpoint? Hart privileges the internal point of view yet treats it as an amalgam of attitudes (CL 203); Finnis says Hart should have chosen its central case, the practically reasonable person. The counter is that one can identify what participants treat as important without endorsing it. On balance Finnis shows that description needs selection; whether selection must be moral evaluation is the real question, and that is where an essay should take its stand.
    rubric:
      - id: r1
        criterion: Thesis — states whether a descriptive theory can be value-free, and in what sense.
        marks: 2
        top-band: Distinguishes moral neutrality from freedom from all judgements of importance.
        margin-note: Value-free in which sense?
        authorities: []
      - id: r2
        criterion: Argument — explains Finnis's NLNR 3 and the three features of NLNR 6, applied to Hart's central case and internal point of view.
        marks: 3
        top-band: Explains the amalgam objection and the central case of the internal point of view.
        margin-note: Show the amalgam point (CL 203).
        authorities:
          - finnis-natural-law-and-natural-rights
          - hart-the-concept-of-law
      - id: r3
        criterion: 'Counterargument — gives Hart''s side: description can identify importance without endorsing it.'
        marks: 3
        top-band: Presents the reply as the strongest response to Finnis, not a straw man.
        margin-note: Is every judgement of importance a moral one?
        authorities: []
      - id: r4
        criterion: Evaluation — decides whether selection must be moral evaluation.
        marks: 2
        top-band: Locates the disagreement exactly and says why the chosen side wins.
        margin-note: This is the Question 1 hinge — commit.
        authorities: []
  - key: s06
    type: short
    concept: lex-iniusta-strong-and-weak
    difficulty: 3
    prompt: '"Lex iniusta non est lex." Is this maxim defensible?'
    model: 'It is defensible in its weak form, not its strong one. On the strong natural law thesis, moral soundness is a necessary element of legal validity, so unjust "laws" are not legally valid; for Radbruch, only extremely unjust laws. That collides with the fact, which positivists stress, that unjust rules are identified and enforced as law — Hart''s two simple things: a rule''s immorality does not make it not a rule of law. Finnis reads the maxim weakly: unjust laws are not laws in their central case or focal meaning, as a fallacious argument is not properly an argument. They are morally and legally defective, but not thereby invalid. He also separates senses of "obligation to obey": empirical liability to sanction may remain while legal obligation in the moral sense fails. The counterargument is that the weak thesis concedes so much to positivism that the maxim loses its bite. On balance it keeps a real claim — that law''s central case is just law, and injustice defeats law''s moral claim on us — and that is defensible.'
    rubric:
      - id: r1
        criterion: Thesis — says which version of the maxim is defensible.
        marks: 2
        top-band: Distinguishes strong and weak theses in the thesis sentence.
        margin-note: Which reading are you defending?
        authorities: []
      - id: r2
        criterion: Argument — explains the strong thesis (Radbruch) and Finnis's weak thesis with the four senses of obligation.
        marks: 3
        top-band: Uses the fallacious argument/unfaithful friend analogy and the four senses accurately.
        margin-note: Which sense of obligation does injustice affect?
        authorities:
          - finnis-natural-law-and-natural-rights
      - id: r3
        criterion: Counterargument — uses Hart's two simple things and positivist objections.
        marks: 3
        top-band: Presents the positivist objection to the strong thesis fairly.
        margin-note: Good — state the positivist case in its strongest form.
        authorities:
          - hart-positivism-and-the-separation-of-law-and-morals
      - id: r4
        criterion: Evaluation — judges whether the weak thesis is a real claim or a concession.
        marks: 2
        top-band: Explains what the weak thesis still asserts that positivism denies.
        margin-note: Does the weak thesis still bite?
        authorities: []
