      "No theorist can give a theoretical description and analysis of social facts without also participating in the work
      of evaluation, of understanding what is really good for human persons, and what is really required by practical
      reasonableness" (NLNR 3). Evaluation is needed even for a descriptive theory.

      Finnis credits Hart and Raz with greater explanatory power than the "rather naive methodologies of Bentham, Austin,
      and Kelsen", with three features: attention to practical point; selection of central case and focal meaning;
      selection of viewpoint (NLNR 6).

      Hart uses a central case (the union of rules as law's 'essence', CL 155) and says Austin "failed to fit the
      facts". But descriptive theorists disagree about what is important and significant. By what
      criteria is a meaning focal or a case central, and from what viewpoint?

      Hart gives explanatory priority to the internal point of view, yet treats it as an amalgam of very different
      viewpoints (CL 203). Finnis says Hart should have focused on the **central case of the internal point of view** —
      the practically reasonable person — which cannot be identified without asking what practical reasonableness
      really requires in relation to the basic goods.

      For Finnis, in the central case of law, authority "depends … on its justice or at least its ability to secure justice"
      (NLNR 260).

      Exam use: Question 1 — Finnis's challenge to value-free description.
  - slug: lex-iniusta-strong-and-weak
    title: Lex iniusta non est lex — strong and weak natural law theses
    visual: diagram
    visual-brief: 'A fork from ''an unjust law is not a law'': the strong branch ends at ''not legally valid'' (with Radbruch''s narrower ''only extremely unjust''), the weak branch ends at ''not law in its central case/focal meaning — morally and legally defective''; beside it, Finnis''s four senses of ''obligation to obey the law'' stacked as layers.'
    related:
      - finnis-central-case-method
      - natural-law-and-positivism
    depends-on:
      - finnis-central-case-method
    contrasts-with:
      - minimum-content-of-natural-law
      - natural-law-and-positivism
    cases: []
    authorities:
      - finnis-natural-law-and-natural-rights
    verify: false
    body: |-
      *Lex iniusta non est lex*: an unjust law is not a law. The key question is how injustice affects the
      obligation to obey the law.

      For Finnis, 'the obligation to obey the law' may mean:

      1. empirical liability to be subjected to sanction in event of non-compliance;
      2. legal obligation in the intra-systemic sense (legal obligation 'in the legal sense');
      3. legal obligation in the moral sense;
      4. moral obligation that does not derive from the legality of the stipulation-of-obligation.

      → Unjust laws are not laws in their central case/focal meaning.

      **Strong natural law thesis**: moral soundness/validity is a necessary element of legal validity; unjust "laws" are
      not legally valid. For some theorists (eg Gustav Radbruch) only extremely unjust "laws" are not legally valid. This is
      a claim about each and every unjust law.

      **Weak natural law thesis**: unjust "laws" are not laws in the true sense of the word (Finnis). They are morally and
      legally defective — but that is not to say they are legally invalid.

      The lecture's analogy: an unfaithful friend is not a friend, a fallacious argument is not an argument. We still use
      the word — a fallacious argument is an argument — but it is not properly one, because we measure it against the
      central case. The more unjust a system is, the more peripheral it is to the central case of law.

      Exam use: always say which thesis a writer holds; attacking the strong thesis does not touch Finnis.
