  - type: cloze
    concept: natural-law-and-positivism
    text: For legal positivists, the existence of law is simply a matter of {{c1::social facts/practices}}; for natural law theorists, law is social facts + {{c2::conformity to certain moral standards (form and/or content)}}.
    source: Week 04 Lecture Slides, slide 2
  - type: basic
    concept: natural-law-and-positivism
    front: Procedural vs substantive natural law theories — an example of each?
    back: 'Procedural: Lon Fuller. Substantive: John Finnis.'
    source: Week 04 Lecture Slides, slide 2
  - type: basic
    concept: natural-law-and-positivism
    front: Hart's definition of legal positivism (CL 185–186)?
    back: '"the simple contention that it is in no sense a necessary truth that laws reproduce or satisfy certain demands of morality, though in fact they have often done so."'
    source: Week 04 Lecture Slides, slide 4
  - type: basic
    concept: natural-law-and-positivism
    front: The utilitarian tradition's three doctrines (Hart)?
    back: 1 Separation of law and morals; 2 analytical study of legal concepts as vital as historical/sociological study; 3 the imperative theory. Not a package — Hart rejects (3).
    source: Week 04 Lecture Slides, slide 5
  - type: basic
    concept: natural-law-and-positivism
    front: The Thomist NCLM — two claims?
    back: Principles of true morality or justice are discoverable by human reason without revelation; AND man-made laws conflicting with them are not valid law (lex iniusta non est lex).
    source: Week 04 Lecture Slides, slide 7
  - type: cloze
    concept: natural-law-and-positivism
    text: 'The other NCLM reading: for a legal system to exist there must be a {{c1::widely diffused, though not necessarily universal}}, recognition of a {{c2::moral obligation to obey the law}}.'
    source: Week 04 Lecture Slides, slide 7
  - type: basic
    concept: natural-law-and-positivism
    front: Augustine's question on the slide, and its point?
    back: '"What are states without justice but robber-bands enlarged?" — the gunman situation writ large; justice distinguishes law from it.'
    source: Week 04 Lecture Slides, slide 6
  - type: apply
    concept: natural-law-and-positivism
    scenario: 'An essay says: "Natural law denies that law is a social fact."'
    answer: 'Wrong: natural law accepts law as social fact and adds conformity to moral standards; Finnis says law is both a sheer social fact and a set of often sound reasons for action.'
    source: Week 04 Lecture Slides, slide 3
  - type: basic
    concept: minimum-content-of-natural-law
    front: Hart's minimum content of natural law?
    back: Rules restricting the use of violence and requiring respect for property and promises, underlying both positive law and social morality.
    source: Week 04 Lecture Slides, slide 9
  - type: cloze
    concept: minimum-content-of-natural-law
    text: Given natural facts and aims, the minimum content is a {{c1::natural necessity}}; it is Hart's reply to the positivist thesis that "law may have {{c2::any content}}".
    source: Week 04 Lecture Slides, slide 9
  - type: basic
    concept: minimum-content-of-natural-law
    front: Sources of Hart's "empirical version" of natural law?
    back: Hobbes (Leviathan chs 14–15) and Hume (Treatise of Human Nature Book III, part 2).
    source: Week 04 Lecture Slides, slide 9
  - type: basic
    concept: minimum-content-of-natural-law
    front: Finnis's comment on the label 'minimum content of natural law'?
    back: Unfortunate — Hart should have called it the minimum content of positive law.
    source: Week 04 Lecture Transcript
  - type: basic
    concept: harts-six-claims
    front: Hart's six claims about the NCLM?
    back: 1 Power and authority; 2 influence of morality on law; 3 interpretation; 4 criticism of law; 5 principles of legality and justice; 6 legal validity and resistance to law. He concedes (2) and (5).
    source: Week 04 Lecture Slides, slide 10
  - type: basic
    concept: harts-six-claims
    front: Four considerations on which allegiance to a legal system may be based (CL 203)?
    back: Calculations of long-term interest; disinterested interest in others; an unreflecting inherited or traditional attitude; the mere wish to do as others do.
    source: Week 04 Lecture Slides, slide 11
  - type: cloze
    concept: harts-six-claims
    text: 'Two minimum conditions for a legal system: valid rules of behaviour must be {{c1::generally obeyed}}, and the rules of recognition, change and adjudication must be {{c2::effectively accepted as common public standards of official behaviour by its officials}}.'
    source: Week 04 Lecture Slides, slide 12
  - type: basic
    concept: harts-six-claims
    front: US vs England on the influence of morality (CL 204)?
    back: In the US the ultimate criteria of validity explicitly incorporate principles of justice; in England, with no formal limits on the legislature, legislation may still conform to morality.
    source: Week 04 Lecture Slides, slide 13
  - type: cloze
    concept: harts-six-claims
    text: 'Hart on the inner morality of law: "if this is what the necessary connection of law and morality means, we may accept it. It is unfortunately compatible with {{c1::very great iniquity}}."'
    source: Week 04 Lecture Slides, slide 14
  - type: apply
    concept: harts-six-claims
    scenario: A senior official applies the rules of a regime only to keep her post, and privately thinks the regime immoral.
    answer: 'She still accepts the rules on Hart''s view: allegiance may rest on long-term interest; accepters may decide morally they ought not to accept, yet continue (CL 203).'
    source: Week 04 Lecture Slides, slide 11
  - type: basic
    concept: fullers-inner-morality-of-law
    front: Fuller's definition of law?
    back: The enterprise of subjecting human conduct to the governance of rules.
    source: Week 04 Lecture Slides, slide 19
  - type: basic
    concept: fullers-inner-morality-of-law
    front: Fuller's eight principles of legality?
    back: General; public; prospective; clear; coherent; practicable; stable; congruence between official action and the law.
    source: Week 04 Lecture Slides, slide 19
  - type: basic
    concept: fullers-inner-morality-of-law
    front: Hart's "two simple things" (1958, 599)?
    back: 'Absent an express provision: (1) a rule''s violating morality does not make it not law; (2) a rule''s being morally desirable does not make it law.'
    source: Week 04 Lecture Slides, slide 17
  - type: cloze
    concept: fullers-inner-morality-of-law
    text: 'Fuller: "Most of the issues raised by Professor Hart''s essay can be restated in terms of the distinction between {{c1::order}} and {{c2::good order}}."'
    source: Week 04 Lecture Slides, slide 18
  - type: apply
    concept: fullers-inner-morality-of-law
    scenario: A ruler makes up rules case by case, keeps them secret, and changes them daily.
    answer: Breaches generality, publicity and stability; as with Fuller's Rex, it is not bad law but a failure to make law, since nobody could comply.
    source: Week 04 Lecture Transcript
  - type: basic
    concept: finnis-central-case-method
    front: Finnis, NLNR 3 — the key claim?
    back: No theorist can give a theoretical description and analysis of social facts without also participating in the work of evaluation.
    source: Week 04 Lecture Slides, slide 21
  - type: basic
    concept: finnis-central-case-method
    front: Three features of the sophisticated method of Hart and Raz (NLNR 6)?
    back: 1 Attention to practical point; 2 selection of central case and focal meaning; 3 selection of viewpoint.
    source: Week 04 Lecture Slides, slide 22
  - type: cloze
    concept: finnis-central-case-method
    text: For Finnis, Hart should have focused on the {{c1::central case of the internal point of view}}, which cannot be identified without the requirements of {{c2::practical reasonableness}}.
    source: Week 04 Lecture Slides, slide 25
  - type: basic
    concept: finnis-central-case-method
    front: Finnis on the authority of law (NLNR 260)?
    back: '"The authority of the law depends … on its justice or at least its ability to secure justice."'
    source: Week 04 Lecture Slides, slide 26
  - type: basic
    concept: lex-iniusta-strong-and-weak
    front: Strong vs weak natural law thesis?
    back: 'Strong: moral soundness is necessary for legal validity; unjust "laws" are not legally valid (Radbruch: only extremely unjust ones). Weak (Finnis): unjust "laws" are not laws in the true sense — morally and legally defective.'
    source: Week 04 Lecture Slides, slide 28
  - type: basic
    concept: lex-iniusta-strong-and-weak
    front: Finnis's four senses of 'the obligation to obey the law'?
    back: 1 Empirical liability to sanction; 2 intra-systemic legal obligation; 3 legal obligation in the moral sense; 4 moral obligation not deriving from legality.
    source: Week 04 Lecture Slides, slide 27
  - type: apply
    concept: lex-iniusta-strong-and-weak
    scenario: 'A critic says: "Finnis must think Nazi statutes were legally void."'
    answer: 'No — Finnis holds the weak thesis: unjust laws are not laws in their central case/focal meaning, defective but not thereby invalid; invalidity is the strong thesis.'
    source: Week 04 Lecture Slides, slide 28
audio:
  title: Week 4 recap — natural law theories
  minutes: 3
  script: |-
    This week sets natural law against legal positivism, and the first thing to hold on to is exactly where they disagree. Natural law theories dispute the positivist claim that law and morality are conceptually separable. For positivists, law is a matter of social facts. For natural lawyers, law is social facts plus conformity to certain moral standards, of form, content, or both. Fuller is the procedural example, Finnis the substantive one.

    Hart defines positivism as the simple contention that it is in no sense a necessary truth that laws satisfy morality, though in fact they often have. He reads the natural law camp as claiming a necessary connection, in two versions. The Thomist version says there are principles of justice discoverable by reason, and that conflicting human laws are not valid law. The other says a legal system needs a widely shared recognition of a moral obligation to obey.

    Hart gives natural law a little. His minimum content of natural law is protection of persons, property and promises, a natural necessity drawn from Hobbes and Hume, and his reply to Kelsen's thesis that law may have any content. Then he breaks the necessary connection into six claims and concedes two: morality does influence law, and general, public, prospective rules realise a minimum of justice. But that inner morality, he says, is compatible with very great iniquity.

    Fuller answers that a definition of law must make fidelity to law meaningful, and that the real issue is order versus good order. Law is the enterprise of subjecting human conduct to the governance of rules, so laws must be general, public, prospective, clear, coherent, practicable and stable, with officials acting in line with them. Rex fails not because his laws are unjust, but because nobody could follow them.

    Finnis attacks method. No theorist can describe social facts without also evaluating. Hart and Raz improved on Bentham, Austin and Kelsen through practical point, central case and viewpoint, but choosing what is central is already a judgement of importance. Hart's internal point of view is a mix of attitudes; Finnis wants its central case, the practically reasonable person.

    That gives Finnis his reading of lex iniusta non est lex. The strong thesis says unjust laws are not legally valid, and for Radbruch only extremely unjust ones. Finnis holds the weak thesis: unjust laws are not laws in their central case, like a fallacious argument, defective morally and legally, but not simply void. For the essay, name the precise claim you are testing.
