week_file:
  topic: Natural law theories
  summary: 'Week 4 sets the natural law tradition against legal positivism: the necessary connection between law and morality (NCLM), Hart''s reading of it, his minimum content of natural law and his six claims (conceding two). It then studies Fuller''s procedural theory — fidelity to law and eight principles of legality — and Finnis''s substantive theory, especially his method (central case, focal meaning, viewpoint) and his weak reading of lex iniusta non est lex. For the essay, it supplies both sides of Question 2 (Fuller vs Hart on legality) and Finnis''s challenge that drives Question 1.'
  notes: |
    ## The natural law tradition

    Natural law theories dispute the (positivist) claim that law and morality are conceptually separable. For legal
    positivists, the existence of law is simply a matter of social facts/practices. The key idea in the natural law
    tradition is that the law has an essentially moral dimension: for natural law theorists, law is a matter of social
    facts + conformity to certain moral standards (form and/or content).

    - **Procedural** natural law theories — see, eg, Lon Fuller's theory.
    - **Substantive** natural law theories — see, eg, John Finnis' theory.

    There are a number of theories, in the plural, that present themselves as belonging to the natural law tradition.
    As with legal positivism last week, 'natural law' is an umbrella term for a family of theories. Keep asking the two
    macro questions from week 1: is this a claim about the nature of law, or a claim about what legal theory is or
    should be?

    ## Natural law theory vs legal positivism?

    "Legal theorists who present or understand their theories as "positivist", or as instances of "legal positivism",
    take their theories to be opposed to, or at least clearly distinct from, natural law theory. Natural law theorists,
    on the other hand, did not conceive their theories in opposition to, or even as distinct from, legal positivism […].
    The term "positive law" was put into wide philosophical circulation first by Aquinas, and natural law theories of
    his kind share, or at least make no effort to deny, many or virtually all "positivist" theses – except of course the
    bare thesis that natural law theories are mistaken, or the thesis that a norm is the content of an act of will.
    Natural law theory accepts that law can be considered and spoken of both as a sheer social fact of power and
    practice, and as a set of reasons for action that can be and often are sound as reasons and therefore normative for
    reasonable people addressed by them." (John Finnis, 'Natural Law Theories', *Stanford Encyclopedia of Philosophy*)

    The lecture: use this passage as a test of your understanding. Historically, legal positivism is younger than the
    natural law tradition — Bentham developed his positivist view in opposition to the natural law tradition, in
    particular Blackstone's natural law views.

    ## Hart on legal positivism

    :::definition
    "Here we shall take Legal Positivism to mean the simple contention that it is in no sense a necessary truth that laws
    reproduce or satisfy certain demands of morality, though in fact they have often done so." (Hart, *The Concept of
    Law*, 185–186)
    :::

    "My account is descriptive in that it is morally neutral and has no justificatory aims: it does not seek to justify or
    commend on moral or other grounds the forms and structures which appear in my general account of law, though a clear
    understanding of these is, I think, an important preliminary to any useful moral criticism of law." (CL, 240)

    There are two ways Hart keeps law and morality apart: one about the nature of law (no necessary truth that laws
    satisfy morality — any overlap, as in criminal law, is contingent), and one about legal theory (his account is
    descriptive, morally neutral).

    ## The utilitarian tradition in jurisprudence

    According to Hart, the utilitarian tradition in jurisprudence has defended three doctrines:

    1. the separation between law and morals;
    2. the important truth that a purely analytical study of legal concepts, a study of the meaning of the distinctive
       vocabulary of the law, was as vital to our understanding of the nature of law as historical or sociological
       studies (though of course it could not supplant them);
    3. the famous imperative theory of law.

    (1), (2) and (3) are separate doctrines/claims — they are not a package. Hart accepts the first two and rejects the
    third (the first chapters of *The Concept of Law* criticise Austin). The lecture adds that 'separation' is imprecise:
    the point is the conceptual separability of law and morality, not that laws and morals never overlap.

    ## Imperative theory vs natural law tradition

    Hart discusses key claims associated with the natural law tradition in Chapter VIII (Justice and Morality) and
    Chapter IX (Laws and Morals) of *The Concept of Law*.

    "We must now turn our attention to the claim which, in the perennial discussion of the 'essence' or the 'nature' or
    'the definition' of law, has been most frequently opposed to the simple imperative theory which we have found
    inadequate. This is the general contention that between law and morality there is a connection which is in some
    sense 'necessary', and that it is this which deserves to be taken as central, in any attempt to analyse or elucidate
    the notion of law." (CL, 3rd ed, 155)

    → What are states without justice but robber-bands enlarged? (Augustine of Hippo) — the gunman situation writ large:
    for many in the natural law tradition, what distinguishes law from the gunman is that law reflects (or should reflect)
    justice.

    ## The necessary connection between law and morality (NCLM)

    NCLM in the Thomist tradition of natural law:

    - There are certain principles of true morality or justice, discoverable by human reason without the aid of
      revelation (even though they have a divine origin); AND
    - Man-made laws which conflict with these principles are not valid law (*Lex iniusta non est lex*).

    A different interpretation of NCLM: for a legal system to exist there must be a widely diffused, though not
    necessarily universal, recognition of a moral obligation to obey the law (even though this may be overridden in
    particular cases by a stronger moral obligation not to obey particular morally iniquitous laws).

    The lecture: these two sets of arguments capture the two theories of the week — Fuller's theory connects with the
    second (the kind of obligation laws create); Finnis's theory works within the Thomist tradition.

    ## Three long-entangled issues

    1. The distinction, within the general sphere of morality, of the specific idea of justice and the special features
       which account for its peculiarly intimate connection with law. "…there is one idea, that of justice which seems to
       unite both fields [law and morality]: it is both a virtue specially appropriate to law and the most legal of the
       virtues. We think and talk of 'justice according to law' and yet also of the justice or injustice of the laws."
       (CL, 7)
    2. The characteristics which distinguish moral rules and principles from all other forms of social rule/standards of
       conduct.
    3. The many different senses and ways in which legal rules and morals may be said to be related (Chapter IX).

    ## Hart on the "minimum content of natural law"

    According to Hart, rules restricting the use of violence and requiring respect for property and promises constitute a
    'minimum content' of natural law underlying both positive law and social morality.

    "The simple truisms we have discussed not only disclose the core of good sense in the doctrine of Natural Law. […] We
    can say, given the setting of natural facts and aims, which make sanctions both possible and necessary in a municipal
    system, that this is a natural necessity; and some such phrase is needed also to convey the status of the minimum
    forms of protection for persons, property, and promises which are similarly indispensable features of municipal law.
    It is in this form that we should reply to the positivist thesis that 'law may have any content'." (CL, 199)

    This "empirical version" of natural law is based on Hobbes (*Leviathan*, chs 14 and 15) and Hume (*Treatise of Human
    Nature*, Book III, part 2; esp ss 2 and 4–7). The lecture: a natural necessity, not a conceptual one. Even a cruel
    dictatorship needs some members to accept its rules voluntarily, and they will not unless the rules give them minimum
    protection — otherwise it is a suicide pact. The 'positivist thesis' Hart replies to is Kelsen's: for Kelsen the
    content of individual laws is irrelevant. Finnis said Hart should have called it the minimum content of *positive*
    law.

    ## NCLM — six claims

    1. Power and authority
    2. The influence of morality on law
    3. Interpretation
    4. The criticism of law
    5. Principles of legality and justice
    6. Legal validity and resistance to law

    (2) and (5) — according to Hart, if this is what the necessary connection of law and morality means, its existence
    should be conceded. The lecture covered (1), (2) and (5).

    ## Power and authority

    For Hart, the coercive power of law presupposes its accepted authority. Accepted authority of a legal system →
    internal point of view.

    "…allegiance to the system may be based on many different considerations: calculations of long-term interest;
    disinterested interest in others; an unreflecting inherited or traditional attitude; or the mere wish to do as others
    do. There is indeed no reason why those who accept the authority of the system should not examine their conscience
    and decide that, morally, they ought not to accept it, yet for a variety of reasons continue to do so." (CL, 203)

    Accepting the secondary rules is like accepting the rules of chess: no moral judgement on them is required.

    :::definition
    "There are therefore two minimum conditions necessary and sufficient for the existence of a legal system. On the one
    hand, those rules of behaviour which are valid according to the system's ultimate criteria of validity must be
    generally obeyed, and, on the other hand, its rules of recognition specifying the criteria of legal validity and its
    rules of change and adjudication must be effectively accepted as common public standards of official behaviour by its
    officials." (CL, 3rd ed, 109)
    :::

    ## The influence of morality on law

    According to Hart, legal systems are influenced by the accepted social morality and also by wider moral ideals.

    "In some systems, as in the United States, the ultimate criteria of legal validity explicitly incorporate principles of
    justice or substantive moral values; in other systems, as in England, where there are no formal restrictions on the
    competence of the supreme legislature, its legislation may yet no less scrupulously conform to justice or morality."
    (CL, 204) "No 'positivist' could deny that these are facts, or that the stability of legal systems depends in part upon
    such types of correspondence with morals." (Ibid)

    Influence as a matter of fact is no problem for positivism; what positivism resists is a connection as a matter of
    conceptual necessity.

    ## Principles of legality and justice

    - Perhaps "…a minimum of justice is necessarily realized whenever human behaviour is controlled by general rules
      publicly announced and judicially applied." (CL, 206)
    - If social control "[…] is to function, the rules must satisfy certain conditions: they must be intelligible and
      within the capacity of most to obey, and […] they must not be retrospective…" (CL, 207)
    - "…one critic of positivism has seen in these [principles of legality] something amounting to a necessary connection
      between law and morality, and suggested that they be called 'the inner morality of law'. Again, if this is what the
      necessary connection of law and morality means, we may accept it. It is unfortunately compatible with very great
      iniquity." (CL, 207)

    The critic is Lon Fuller. Hart's point: a system may follow those formal requirements and still be unjust — a counter
    example to the claim that law and morality are necessarily connected.

    ## Lon Fuller (1902–1978)

    Carter Chair of Jurisprudence, Harvard University (1948–1972). 'The Case of the Speluncean Explorers', *Harvard Law
    Review* (1949); *Problems of Jurisprudence* (1949); *The Morality of Law* (1964; 2nd ed 1969); *Legal Fictions*
    (1967). For the link between Fuller's principles of legality and the rule of law, see J Waldron, 'The Rule of Law',
    *Stanford Encyclopedia of Philosophy* (Summer 2020).

    ## The Hart–Fuller debate

    *Harvard Law Review*, Vol 71, 1958: H.L.A. Hart, 'Positivism and the Separation of Law and Morals'; Lon Fuller,
    'Positivism and Fidelity to Law – A Reply to Professor Hart'. See Peter Cane (ed), *The Hart-Fuller Debate in the
    Twenty-First Century* (Hart Publishing, 2010).

    "What both Bentham and Austin were anxious to assert were the following two simple things: first, in the absence of an
    expressed constitutional or legal provision, it could not follow from the mere fact that a rule violated standards of
    morality that it was not a rule of law; and, conversely, it could not follow from the mere fact that a rule was
    morally desirable that it was a rule of law." (Hart, 'Positivism and the Separation of Law and Morals', 599)

    ## Fuller and the ideal of fidelity to law

    - The definition of law: according to Fuller, Hart should "…concern himself more closely with a definition of law
      that will make meaningful the obligation to fidelity to law." (Fuller, 'Positivism and Fidelity to Law', 635)
    - The morality of law itself: "Most of the issues raised by Professor Hart's essay can be restated in terms of the
      distinction between order and good order" (Ibid, 644).
    - Fuller's discussion of Hitler's government as a regime where judges were ready to disregard the validly enacted law
      and state officials were ready "to act through the party in the streets" (652).

    The inner morality of law is not an external morality used to evaluate law: it is the morality within the law, the
    morality law has to comply with to be law.

    ## Fuller's principles of legality

    Law is the enterprise of subjecting human conduct to the governance of rules (see Bix, pp 77–82). Laws must be:

    1. General
    2. Public
    3. Prospective
    4. Clear
    5. Coherent
    6. Practicable
    7. Stable
    8. Finally, there must be congruence between official action and the law.

    The lecture: at the start of *The Morality of Law*, a ruler, Rex, tries to govern case by case and fails — not because
    his laws are unjust in content, but because nobody could comply with them. Only autonomous rational beings can respond
    to laws that follow these principles, and that recognition carries a moral dimension; hence 'good order' is, for
    Fuller, necessarily more just than a system that ignores legality.

    :::examtip
    Research essay Question 2 is built on this sentence of Hart's (CL 207). The unit-wide deck: Hart concedes that the
    principles are connected to law; what he denies is that the connection carries the moral weight Fuller wants. Ask
    whether 'constitutive of law' and 'morally valuable' must stand or fall together — they need not.
    :::

    ## John Finnis and the new classical natural law theory

    *The idea of judicial power, with special reference to Australian law* (DPhil thesis, Oxford, 1965); *Natural Law and
    Natural Rights* (OUP, 1980; 2nd ed 2011); *Aquinas: Moral, Political, and Legal Theory* (OUP, 1998); *The Collected
    Essays of John Finnis*, 5 volumes (OUP, 2011); 'Natural Law Theories', *Stanford Encyclopedia of Philosophy* (Summer
    2020). Finnis studied at Adelaide, then Oxford under Hart; the lecture says Hart asked him to write *Natural Law and
    Natural Rights* for the series Hart edited.

    ## Description and evaluation of law

    "It is often supposed that an evaluation of law as a type of social institution, if it is to be undertaken at all,
    must be preceded by a value-free description and analysis of that institution as it exists in fact. But the
    development of modern jurisprudence suggests, and reflection on the methodology of any social science confirms, that
    no theorist can give a theoretical description and analysis of social facts without also participating in the work
    of evaluation, of understanding what is really good for human persons, and what is really required by practical
    reasonableness." (Finnis, *Natural Law and Natural Rights*, 3)

    This is a claim about the nature of jurisprudence (methodology): evaluation is necessary to develop even a descriptive
    theory of law.

    ## How does the theorist decide what is to count as law?

    "The noticeably greater explanatory power of later descriptive analyses of law, such as those of H. L. A. Hart and
    Joseph Raz, is to be attributed to their fairly decisive break with the rather naive methodologies of Bentham, Austin,
    and Kelsen. This sophistication of method has three principal features…" (NLNR, 6)

    1. Attention to practical point
    2. Selection of central case and focal meaning
    3. Selection of viewpoint

    ## Hart on the central case of law

    "The main theme of this book is that so many of the distinctive operations of the law, and so many of the ideas which
    constitute the framework of legal thought, require for their elucidation reference to one or both of these two types
    of rule [primary rules of obligation and secondary rules of recognition, change, and adjudication], that their union
    may be justly regarded as the 'essence' of law, though they may not always be found together wherever the word 'law'
    is correctly used." (CL, 3rd ed, 155)

    ## Central cases and viewpoints

    - Hart's critique of Austin retains Austin's fundamentally descriptive theoretical purpose — Hart's objection is that
      Austin's theory "failed to fit the facts".
    - Descriptive theorists disagree because they disagree on what is important and significant in the field of data and
      experience with which they are all equally familiar.
    - By what criteria is one meaning to be accounted focal and another secondary, one state of affairs central and
      another borderline?
    - From what viewpoint, and relative to what concerns, are importance and significance to be assessed?

    ## The central case of the internal point of view

    - Hart gives descriptive explanatory priority to the concerns and evaluations — and, consequently, to the language —
      of the persons that engage with their legal system from the 'internal point of view'.
    - However, for Hart, the internal point of view is an amalgam of very different viewpoints (CL, 203).
    - For Finnis, Hart should have focused on the central case of the internal point of view.
    - Finnis argues that a theorist cannot identify the central case of the internal point of view unless they consider
      what the requirements of practical reasonableness really are, in relation to the basic goods that underpin genuine
      human flourishing.

    The lecture: for Finnis the central case of the internal point of view is the point of view of the reasonable person.

    ## Finnis on the central case of law

    "The central case of law and legal system is the law and legal system of a complete community, purporting to have
    authority to provide comprehensive and supreme direction for human behaviour in that community, and to grant legal
    validity to all other normative arrangements affecting the members of that community […]. The authority of the law
    depends, as we shall see at length, on its justice or at least its ability to secure justice. […] If 'effectiveness' is
    to be contrasted (as it need not be) with 'justice', the coercive force of law is not merely a matter of
    effectiveness." (NLNR, 260)

    ## Finnis on 'Lex iniusta non est lex'

    The key question: how does injustice affect the obligation to obey the law? For Finnis, 'the obligation to obey the
    law' may mean:

    - empirical liability to be subjected to sanction in event of non-compliance;
    - legal obligation in the intra-systemic sense (legal obligation 'in the legal sense');
    - legal obligation in the moral sense;
    - moral obligation that does not derive from the legality of the stipulation-of-obligation.

    → Unjust laws are not laws in their central case/focal meaning — as an unfaithful friend is not (really) a friend, or
    a fallacious argument not (really) an argument.

    ## Strong/weak natural law thesis

    *Lex iniusta non est lex* (an unjust law is not a law).

    - **Strong natural law thesis**: moral soundness/validity is a necessary element of legal validity. Unjust "laws" are
      not legally valid. For some theorists (eg Gustav Radbruch) only extremely unjust "laws" are not legally valid.
    - **Weak natural law thesis**: unjust "laws" are not laws in the true sense of the word (see John Finnis' theory of
      law). Unjust "laws" are morally and legally defective.

    :::examtip
    Summary from the lecture: legal positivism vs the natural law tradition (*lex iniusta*, moral obligation to obey);
    use Hart's six claims (CL 202–212) to name the specific claim, not "the necessary connection" in general; substantive
    (Finnis — practical reasonableness, basic goods, the central case approach) vs procedural (Fuller — principles of
    legality; what is the moral status of the rule of law?); strong vs weak natural law thesis.
    :::
