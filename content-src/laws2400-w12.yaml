      - text: The rule that volenti does not extend to the general nature of a risk
        why: >-
          Tempting because it is on the volenti chart, but the flowchart states that rule without a case; Tapp is cited
          only for guidance on applying the legislation.
      - text: The exclusion of volenti for passengers who rely on intoxicated drivers
        why: "Wrong box: the intoxicated drivers and passengers box cites Motor Accidents Act 1988 (NSW) s 76, not Tapp."
      - text: The availability of illegality where no standard of care can be determined
        why: "Wrong box: the illegality box cites Gala v Preston and Progress & Properties Ltd v Craft, not Tapp."
  - key: q070
    type: mcq
    concept: volenti-and-legislation
    difficulty: 3
    variant-of: q004
    contrasts-with:
      - intoxicated-plaintiff-cla-s50
    stem: >-
      Two plaintiffs: Amy, drunk by her own choice, falls on a negligently maintained stair; Ben, sober, is hurt as the
      passenger of a drunk driver. Which pairing of flowchart boxes is right?
    options:
      - text: >-
          Amy: intoxication (the s 50 presumption); Ben: intoxicated drivers and passengers (volenti reluctance and
          exclusion).
        correct: true
        why: >-
          Right — s 50 concerns the injured person's own intoxication (Amy); the volenti box concerns a passenger
          relying on an intoxicated driver (Ben).
      - text: "Amy: intoxicated drivers and passengers (volenti); Ben: intoxication (the s 50 presumption)."
        why: >-
          This swaps them. Ben was sober, so s 50 (which looks at the injured person's intoxication) does not fit him;
          Amy was not a passenger.
      - text: "Both: intoxication (the s 50 presumption), since alcohol played a part in each injury."
        why: >-
          Tempting because alcohol links them, but s 50 asks whether the person whose injury is in issue was
          intoxicated; Ben was sober.
      - text: "Both: intoxicated drivers and passengers (volenti), because each chose to be around alcohol."
        why: >-
          Wrong — the volenti box is about passengers relying on an intoxicated driver; Amy was not a passenger, and her
          own intoxication engages s 50.
  - key: q071
    type: mcq
    concept: volenti-and-legislation
    difficulty: 2
    variant-of: q064
    stem: >-
      A passenger sues a drunk driver who pleads volenti, arguing she knew he was drunk. On the flowchart, what is her
      best answer?
    options:
      - text: Volenti cannot apply, because she did not fully appreciate that he was drunk.
        why: >-
          Tempting because full appreciation is needed, but the facts say she knew he was drunk; her better answer is
          the courts' reluctance and the statutory exclusion.
      - text: >-
          Courts are generally reluctant to allow volenti against such passengers, and legislation in some jurisdictions
          excludes it.
        correct: true
        why: >-
          Right — this is the intoxicated drivers and passengers box, citing as an example Motor Accidents Act 1988
          (NSW) s 76.
      - text: Volenti cannot apply, because s 50 presumes the driver was negligent instead.
        why: >-
          Wrong — s 50 is about the injured person's own intoxication and presumes contributory negligence; it says
          nothing about the driver's negligence.
      - text: Volenti applies, but it only reduces her damages by her share of responsibility.
        why: >-
          Wrong — volenti is a complete defence when it applies; reductions by share of responsibility are contributory
          negligence.
  - key: q072
    type: truefalse
    concept: volenti-and-legislation
    difficulty: 1
    set: quickfire
    statement: CLA s 5L applies whether or not the plaintiff was aware of the risk.
    answer: true
    why: >-
      True — s 5L(2). This is how s 5L expands the defence: common law volenti needs full appreciation of the specific
      risk, but s 5L does not depend on awareness.
  - key: q073
    type: truefalse
    concept: volenti-and-legislation
    difficulty: 1
    set: quickfire
    statement: The flowchart says courts readily allow the volenti defence against passengers who rely on an intoxicated driver.
    answer: false
    why: >-
      False — the courts are generally reluctant to allow it, and legislation in some jurisdictions specifically
      excludes it (eg Motor Accidents Act 1988 (NSW) s 76).
  - key: q074
    type: mcq
    concept: illegality-defence
    difficulty: 1
    set: pretest
    cases:
      - gala-v-preston
    stem: When does the flowchart say the defence of illegality is available?
    options:
      - text: Whenever the plaintiff was breaking some law at the time they were injured
        why: >-
          Tempting because the defence is called illegality, but the flowchart ties it to a joint criminal enterprise in
          which no appropriate standard of care can be determined.
      - text: Where plaintiff and defendant were in the criminal enterprise and no appropriate standard of care can be set
        correct: true
        why: >-
          Right — where both were involved in the criminal enterprise and it would not be possible or feasible to
          determine an appropriate standard of care, the defence is available (Gala v Preston).
      - text: Where the plaintiff was hurt while committing a crime alone, whatever the standard of care
        why: >-
          Wrong — the flowchart speaks of the plaintiff and defendant being involved in the criminal enterprise
          together, and the standard of care question is decisive.
      - text: Where the plaintiff fully appreciated and accepted the risks of a criminal activity
        why: >-
          Tempting because illegality sits on the volenti chart, but full appreciation and acceptance is the volenti
          test; illegality turns on the standard of care.
  - key: q075
    type: mcq
    concept: illegality-defence
    difficulty: 1
    stem: Which case does the flowchart cite as an example of the illegality defence being available?
    options:
      - text: Progress & Properties Ltd v Craft
        why: >-
          Tempting because it is in the same box, but it is cited for the limit: illegality is not available where the
          court can determine the relevant standard of care.
      - text: ICI v Shatwell
        why: >-
          ICI v Shatwell is on the volenti chart, but under knowledge of risk (acceptance of materialisation), not
          illegality.
      - text: Gala v Preston
        correct: true
        why: >-
          Right — the illegality box: 'In such cases, the courts have found that a defence of illegality is available to
          the defendant – see, eg, Gala v Preston'.
      - text: Pennington v Norris
        why: >-
          Pennington v Norris is a contributory negligence case on what is just and equitable — relative blameworthiness
          — not illegality.
  - key: q076
    type: mcq
    concept: illegality-defence
    difficulty: 2
    cases:
      - progress-and-properties-ltd-v-craft
    stem: When will the illegality defence NOT be available, according to the flowchart?
    options:
      - text: Where the criminal enterprise involved only a minor offence, such as a traffic offence
        why: >-
          Tempting as a seriousness threshold, but the flowchart draws the line at whether the court can determine the
          relevant standard of care, not at the seriousness of the offence.
      - text: Where the defendant, not the plaintiff, planned the criminal enterprise
        why: >-
          Tempting because it seems fairer to the plaintiff, but the flowchart does not turn on who planned the
          enterprise; the standard of care question decides it.
      - text: Where, on the facts, the court is able to determine the relevant standard of care
        correct: true
        why: >-
          Right — the defence of illegality will not be available where, on the facts, the court is able to determine
          the relevant standard of care (Progress & Properties Ltd v Craft).
      - text: Where the plaintiff was never convicted of an offence arising from the enterprise
        why: >-
          Wrong — a conviction is not mentioned in the flowchart. The question is whether it is possible or feasible to
          determine an appropriate standard of care.
  - key: q077
    type: mcq
    concept: illegality-defence
    difficulty: 3
    stem: >-
      Two friends steal a car together; one drives dangerously and crashes, injuring the other. On the flowchart, what
      decides whether the driver can rely on illegality?
    options:
      - text: Whether the passenger fully appreciated and accepted the risk of a crash in a stolen car
        why: >-
          Tempting because illegality sits on the volenti chart, but full appreciation and acceptance is the volenti
          test; illegality turns on the standard of care.
      - text: Whether, on these facts, the court can determine an appropriate standard of care
        correct: true
        why: >-
          Right — Gala v Preston (defence available where no appropriate standard can be set) and Progress & Properties
          Ltd v Craft (not available where the standard can be determined).
      - text: Whether the passenger was intoxicated when the two of them took the car
        why: >-
          Wrong box: the passenger's intoxication would engage s 50 (contributory negligence), not the illegality
          defence.
      - text: Whether car theft is a serious enough crime to bar any claim
        why: >-
          Tempting as a policy line, but the flowchart's test is not seriousness; it is whether it is possible or
          feasible to determine an appropriate standard of care.
  - key: q078
    type: mcq
    concept: illegality-defence
    difficulty: 3
    variant-of: q077
    cases:
      - progress-and-properties-ltd-v-craft
    stem: >-
      Same car theft, but the court finds it can determine the standard of care the driver owed on these facts. What
      follows?
    options:
