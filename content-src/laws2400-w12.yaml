    options:
      - text: Her familiarity with the press means she accepted its specific risk, so the employer has a complete defence.
        why: >-
          Tempting because familiarity suggests knowledge, but volenti needs full appreciation and voluntary acceptance
          of the specific risk; the flowchart treats familiarity as a factor softening contributory negligence.
      - text: >-
          Her inattention bred of repetition and the urgency of the task may be taken into account in deciding whether
          she was contributorily negligent.
        correct: true
        why: >-
          Right — the flowchart says, in the employment context, inattention bred of familiarity and repetition and the
          urgency of the task may be taken into account (McLean v Tedman; Staveley Iron and Chemical Co v Jones).
      - text: Her rushing must count as contributory negligence, because the urgency of a task is never an excuse at work.
        why: >-
          Wrong — the flowchart names the urgency of the task as something that may be taken into account in the
          employee's favour, not something that is disregarded.
      - text: Her damages must be reduced by at least 25%, the statutory floor that applies to carelessness at work.
        why: >-
          Tempting because 25% is a figure from this week, but it is the s 50(4) floor for the intoxication presumption;
          nothing makes it apply to employees generally.
  - key: q031
    type: mcq
    concept: contributory-negligence-employees-emergencies-rescuers
    difficulty: 1
    stem: What does the flowchart mean by the 'agony of the moment'?
    options:
