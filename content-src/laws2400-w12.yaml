  - key: q021
    type: mcq
    concept: contributory-negligence-apportionment-and-standard
    difficulty: 1
    stem: >-
      According to the flowchart, what principles of causation apply to the causal requirement in contributory
      negligence?
    options:
      - text: A special, stricter test of causation that applies only to plaintiffs
        why: >-
          Tempting because the plaintiff is the one being judged, but the flowchart says ordinary principles of
          causation apply in this context — there is no special test.
      - text: "None: carelessness alone is enough to reduce the damages"
        why: >-
          Wrong — the flowchart says a causal link between the plaintiff's lack of care for their own safety and their
          injury must be established (Caswell).
      - text: Ordinary principles of causation
        correct: true
        why: >-
          Right — after requiring a causal link between the plaintiff's lack of care and their injury, the flowchart
          adds: 'Ordinary principles of causation apply in this context'.
      - text: The just and equitable test in the Law Reform Act s 9(1)
        why: >-
          Tempting because it is the other test on the chart, but "just and equitable" sets the size of the reduction;
          causation is a separate requirement with ordinary principles.
  - key: q022
    type: mcq
    concept: contributory-negligence-apportionment-and-standard
    difficulty: 3
    cases:
      - pennington-v-norris
    stem: >-
      A driver was speeding heavily; the pedestrian he hit had stepped out without looking. In arguing the size of the
      reduction, what does the flowchart (citing Pennington v Norris) direct the court to do?
    options:
      - text: Split the damages equally, since each party was negligent
        why: >-
          Tempting as a neat default, but the flowchart requires the court to examine the whole conduct of each party
          and consider relative blameworthiness — not to split evenly.
      - text: Look only at the plaintiff's conduct, since it is the plaintiff's damages that are being reduced
        why: >-
          Tempting because the reduction falls on the plaintiff, but Pennington v Norris, as cited, requires examining
          the whole conduct of each of the negligent parties.
      - text: Examine the whole conduct of each negligent party and weigh their relative blameworthiness
        correct: true
        why: >-
          Right — that is the flowchart's answer to "What is just and equitable?": the whole conduct of each negligent
          party and their relative blameworthiness (Pennington v Norris).
      - text: Look only at whichever party's carelessness came last in time before the collision
        why: >-
          Tempting because the last careless act can seem decisive, but the flowchart directs attention to the whole
          conduct of each party, not just the final act.
  - key: q023
    type: mcq
    concept: contributory-negligence-apportionment-and-standard
    difficulty: 4
    stem: >-
      A plaintiff's damages are assessed at $200,000. The court finds her contributorily negligent and decides a 30%
      reduction is just and equitable. Leaving aside any other statute, what does she recover?
    options:
      - text: $140,000
        correct: true
        why: >-
          Right — contributory negligence makes a partial reduction in the damages otherwise recoverable: $200,000 less
          the 30% the court found just and equitable leaves $140,000.
      - text: $60,000
        why: >-
          Tempting because $60,000 appears in the working, but that is the amount of the reduction, not what she
          recovers. She keeps the other 70% of her damages.
      - text: $200,000, because the finding affects liability only
        why: >-
          Wrong — the whole point of a finding of contributory negligence is a partial reduction in the damages
          otherwise recoverable by the plaintiff.
      - text: $100,000, because responsibility is shared equally
        why: >-
          Tempting as a default, but the court has already decided 30% is just and equitable; there is no rule of equal
          shares, only relative blameworthiness.
  - key: q024
    type: truefalse
    concept: contributory-negligence-apportionment-and-standard
    difficulty: 1
    set: quickfire
    statement: >-
      Under CLA s 5R, the standard of care required of the person who suffered harm is that of a reasonable person in
