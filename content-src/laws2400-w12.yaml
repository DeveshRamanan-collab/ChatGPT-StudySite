  - slug: intoxicated-plaintiff-cla-s50
    title: "Intoxication: the CLA s 50 presumption of contributory negligence"
    visual: simulation
    visual-brief: >-
      Four switches — intoxicated so that capacity was impaired? intoxication self-induced? would the harm likely have
      happened anyway? did the intoxication contribute in any way? — drive the s 50 verdict: section does not apply, no
      damages, presumed contributory negligence with at least a 25% reduction, or no presumption.
    related:
