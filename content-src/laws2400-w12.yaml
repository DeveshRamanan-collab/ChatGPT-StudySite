  - key: q032
    type: mcq
    concept: contributory-negligence-employees-emergencies-rescuers
    difficulty: 2
    cases:
      - avram-v-gusakoski
      - caterson-v-commissioner-for-railways
    stem: >-
      A bus passenger sees the negligently driven bus about to crash and jumps from it, breaking her leg; had she stayed
      seated she would have been unhurt. Which argument does the flowchart give her against a finding of contributory
      negligence?
    options:
      - text: "Agony of the moment: her action may be justified in a situation of perceived emergency."
        correct: true
        why: >-
          Right — action that may seem to show a lack of care for her own safety may not amount to contributory
          negligence where it can be justified in a perceived emergency (Avram v Gusakoski; Caterson).
      - text: "Rescuers: she acted in good faith to save herself, so she counts as a good samaritan."
        why: >-
          Tempting because she acted in good faith, but CLA s 56 defines a good samaritan as one who comes to the
          assistance of another person who is apparently injured or at risk.
      - text: "Causal requirement: jumping cannot be a cause, because the driver was negligent first."
        why: >-
          Tempting because the driver created the danger, but on these facts her jump is causally linked to the broken
          leg; the stronger argument is that the jump was justified.
      - text: "Volenti: the bus company cannot rely on contributory negligence unless volenti also fails."
        why: >-
          Wrong — the two defences are independent. Contributory negligence does not depend on volenti, and volenti is
          not in issue on these facts.
  - key: q033
    type: mcq
    concept: contributory-negligence-employees-emergencies-rescuers
    difficulty: 2
    stem: What does the rescuers box on the flowchart say, and which NSW section does it cite?
    options:
      - text: Rescuers are presumed contributorily negligent, with damages reduced by at least 25% — CLA s 50.
        why: >-
          Tempting because s 50 is the other statutory box on this chart, but s 50 concerns intoxication. The rescuers
          box speaks of protection, citing s 56.
      - text: Most jurisdictions now protect those who act in good faith and without recklessness — CLA s 56.
        correct: true
        why: >-
          Right — the box says 'Law in most jurisdictions now offers protection to those who act in good faith and
          without recklessness', citing ACT s 5 and NSW CLA s 56.
      - text: Rescuers voluntarily accept the risks of a rescue, giving a complete defence — CLA s 5L.
        why: >-
          Wrong — s 5L is about obvious risks of dangerous recreational activities, on the volenti chart. The rescuers
          box is about protection for those acting in good faith.
      - text: Rescuers are held to a higher standard of care than other plaintiffs — CLA s 5R.
        why: >-
          Tempting because s 5R sets the standard for contributory negligence, but it sets the same standard as for
          negligence (a reasonable person in the position of that person); no higher one.
  - key: q034
    type: mcq
    concept: contributory-negligence-employees-emergencies-rescuers
    difficulty: 3
    verify: true
    stem: Under CLA s 56, who is a 'good samaritan'?
    options:
      - text: Any person who, without recklessness, assists another in an emergency, whether or not they expect to be paid
        why: >-
          Tempting because the flowchart speaks of acting 'without recklessness', but NSW s 56 requires good faith and
          no expectation of payment or other reward.
      - text: >-
          A person who, in good faith and expecting no payment or reward, comes to the aid of someone apparently injured
          or at risk
        correct: true
        why: >-
          Right — s 56: a person who, in good faith and without expectation of payment or other reward, comes to the
          assistance of a person who is apparently injured or at risk of being injured.
      - text: A health care or emergency services worker who assists an injured person while on duty
        why: >-
          Tempting because such workers often help at accidents, but s 56 is not limited to professionals; it turns on
          good faith and no expectation of payment or reward.
      - text: A person who assists another in good faith, provided their help does not make the injury worse
        why: >-
          Tempting as a common-sense limit, but s 56's definition contains no such proviso: it turns on good faith, no
          expected reward, and assisting someone apparently injured or at risk.
  - key: q035
    type: mcq
    concept: contributory-negligence-employees-emergencies-rescuers
    difficulty: 3
    verify: true
    stem: Under CLA s 57(1), what protection does a good samaritan receive?
    options:
      - text: A reduction of their own damages if they are injured while carrying out the rescue
        why: >-
          Tempting because the flowchart lists rescuers under contributory negligence, but s 57(1) is about the good
          samaritan's own liability, not a reduction of their damages.
      - text: No personal civil liability for acts or omissions in an emergency while assisting
        correct: true
        why: >-
          Right — s 57(1): a good samaritan does not incur any personal civil liability for any act or omission done in
          an emergency when assisting a person apparently injured or at risk.
      - text: Protection only if they hold a first-aid qualification and act without any recklessness
        why: >-
          Wrong — s 57(1) has no qualification requirement. The protection attaches to a good samaritan as defined in s
          56: good faith and no expectation of payment or other reward.
      - text: Protection from criminal liability only, leaving them open to civil claims for their acts
        why: >-
          This reverses the section: s 57(1) gives protection from personal civil liability. It says nothing about
          criminal liability, which is why the option can seem plausible.
