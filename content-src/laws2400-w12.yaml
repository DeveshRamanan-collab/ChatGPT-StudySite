    options:
      - text: Only whether the employer gave the employee written safety instructions for the task
        why: >-
          Tempting because it focuses on the employer's conduct, but the flowchart lists conditions on the employee's
          side: familiarity, repetition, urgency and preoccupation with the work.
      - text: Whether the employee was intoxicated at work, which raises a statutory presumption of contributory negligence
        why: >-
          Tempting because intoxication is on the same chart, but that is the separate intoxication box (CLA s 50), not
          the momentary thoughtlessness by employees box.
      - text: Inattention bred of familiarity and repetition, the urgency of the task and preoccupation with the work
        correct: true
        why: >-
          Right — the flowchart lists these, plus other prevailing conditions, citing McLean v Tedman and Staveley Iron
          and Chemical Co v Jones.
      - text: Whether the employee perceived and fully appreciated the specific risk of the task
        why: >-
          Tempting because it sounds like a knowledge test, but that is the volenti knowledge requirement (Banovic v
