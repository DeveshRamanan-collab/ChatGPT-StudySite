  - key: q016
    type: mcq
    concept: contributory-negligence-apportionment-and-standard
    difficulty: 2
    stem: Under CLA s 5R(2), against what standard is a plaintiff's contributory negligence measured?
    options:
      - text: The plaintiff's own best efforts, judged on what the plaintiff actually knew at that time
        why: >-
          Tempting because it is the plaintiff's own care in issue, but s 5R(2) is objective — a reasonable person in
          the plaintiff's position — and covers what they knew or ought to have known.
      - text: A lower standard than the defendant's, because a plaintiff owes no duty of care to anyone else at all
        why: >-
          Tempting, since the plaintiff owes no duty to the defendant, but s 5R(1) says the principles that decide
          negligence also decide contributory negligence.
      - text: A reasonable person in the plaintiff's position, on what the plaintiff knew or ought to have known
        correct: true
        why: >-
          Right — s 5R(2)(a) sets the standard of a reasonable person in the position of the person who suffered harm,
          and s 5R(2)(b) judges it on what that person knew or ought to have known at the time.
      - text: A reasonable person in the defendant's position, on what the defendant knew at the time
        why: >-
          Wrong person: s 5R is about the person who suffered harm. The question is whether that person failed to take
          precautions against the risk of their own harm.
  - key: q017
    type: mcq
    concept: contributory-negligence-apportionment-and-standard
    difficulty: 3
    variant-of: q016
    stem: >-
      Lena is hurt by a negligent defendant. She did not know of a hazard, but a reasonable person in her position ought
      to have known of it. Under CLA s 5R(2)(b), can her failure to guard against it count as contributory negligence?
    options:
      - text: No — only what she actually knew at the time can be taken into account under s 5R.
        why: >-
          Tempting because it seems unfair to blame her for what she did not know, but s 5R(2)(b) expressly includes
          what the person "ought to have known at the time".
      - text: Yes — the matter is determined on what she knew or ought to have known at the time.
        correct: true
        why: >-
          Right — s 5R(2)(b) says contributory negligence is determined on what the person knew or ought to have known
          at the time, so constructive knowledge counts.
      - text: No — a plaintiff's knowledge is irrelevant once the defendant has been proved negligent.
        why: >-
          Wrong — the defendant's negligence does not end the inquiry; s 5R(1) applies the principles of negligence to
          the plaintiff's own failure to take precautions.
      - text: Yes — but only if the defendant also knew that she ought to have known of the hazard.
        why: >-
          Tempting as a fairness condition, but s 5R(2)(b) looks to what the plaintiff knew or ought to have known; it
          adds no requirement about the defendant's knowledge.
  - key: q018
    type: mcq
    concept: contributory-negligence-apportionment-and-standard
    difficulty: 2
    cases:
      - caswell-v-powell-duffryn-associated-collieries
    stem: >-
      A plaintiff failed to wear a safety helmet, but the only injury was to her foot. Applying the flowchart's causal
      requirement, what follows?
    options:
      - text: Damages are reduced, because any lack of care for her own safety counts toward her share of responsibility.
        why: >-
          Tempting because she was careless, but the flowchart requires a causal link between the plaintiff's lack of
          care for their own safety and their injury (Caswell).
      - text: Damages are reduced only if her failure was deliberate rather than merely careless.
        why: >-
          Tempting as a limiting rule, but the flowchart draws no line between deliberate and careless omissions; the
          requirement is a causal link to the injury.
      - text: Her failure to wear a helmet cannot reduce damages for the foot injury without a causal link to it.
        correct: true
        why: >-
          Right — a causal link between the plaintiff's lack of care and her injury must be established (Caswell v
          Powell Duffryn Associated Collieries); ordinary causation principles apply.
      - text: Her claim fails entirely, because she did not take every precaution for her own safety.
        why: >-
          Wrong twice: contributory negligence only partially reduces damages, and even that needs a causal link between
          her lack of care and the injury.
  - key: q019
    type: mcq
    concept: contributory-negligence-apportionment-and-standard
    difficulty: 3
    variant-of: q018
    contrasts-with:
      - voluntary-assumption-of-risk
    cases:
      - caswell-v-powell-duffryn-associated-collieries
    stem: >-
      Raj, a passenger, was not wearing a seatbelt when the negligent driver crashed; medical evidence shows a belt
      would have prevented his head injury. On the flowchart, which principle do these facts satisfy, and what remains?
    options:
      - text: >-
          Causal requirement; the court must still apply the s 5R standard and decide what reduction is just and
          equitable.
        correct: true
        why: >-
          Right — the medical evidence links his lack of care to the injury (Caswell). The court still asks whether he
          fell below the s 5R standard and then sets a just and equitable reduction.
      - text: Causal requirement; his damages are then automatically reduced by 25% under the CLA.
        why: >-
          Tempting because 25% appears in the CLA, but that floor applies only to the s 50 intoxication presumption. The
          general reduction is what is just and equitable.
      - text: Volenti, because by leaving off the belt he voluntarily accepted the risk of a head injury.
        why: >-
          Tempting because he chose not to wear it, but volenti needs proof he fully appreciated and voluntarily
          accepted the specific risk; at most this is a contributory negligence argument.
      - text: "None: a passenger cannot be contributorily negligent towards the driver of the vehicle."
        why: >-
          Wrong — the flowchart applies contributory negligence to any plaintiff whose lack of care for their own safety
          caused their injury; nothing in it exempts passengers.
  - key: q020
    type: mcq
    concept: contributory-negligence-apportionment-and-standard
