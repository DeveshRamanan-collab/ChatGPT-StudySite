authorities:
  - slug: civil-liability-act-2002-nsw-s5r
    title: Civil Liability Act 2002 (NSW) s 5R
    kind: statute
    text: >-
      (1) The principles that are applicable in determining whether a person has been negligent also apply in
      determining whether the person who suffered harm has been contributorily negligent in failing to take precautions
      against the risk of that harm. (2) For that purpose— (a) the standard of care required of the person who suffered
      harm is that of a reasonable person in the position of that person, and (b) the matter is to be determined on the
      basis of what that person knew or ought to have known at the time.
    gloss: >-
      The plaintiff's contributory negligence is judged by the same principles as negligence: the standard of a
      reasonable person in the plaintiff's position, on what the plaintiff knew or ought to have known at the time.
    cases: []
    verify: false
  - slug: civil-liability-act-2002-nsw-s50
    title: Civil Liability Act 2002 (NSW) s 50
    kind: statute
    text: >-
      (1) This section applies when it is established that the person whose death, injury or damage is the subject of
      proceedings for the recovery of damages was at the time of the act or omission that caused the death, injury or
      damage intoxicated to the extent that the person's capacity to exercise reasonable care and skill was impaired.
      (2) A court is not to award damages in respect of liability to which this Part applies unless satisfied that the
      death, injury or damage to property (or some other injury or damage to property) is likely to have occurred even
      if the person had not been intoxicated. (3) If the court is satisfied that the death, injury or damage to property
      (or some other injury or damage to property) is likely to have occurred even if the person had not been
      intoxicated, it is to be presumed that the person was contributorily negligent unless the court is satisfied that
      the person's intoxication did not contribute in any way to the cause of the death, injury or damage. (4) When
      there is a presumption of contributory negligence, the court must assess damages on the basis that the damages to
      which the person would be entitled in the absence of contributory negligence are to be reduced on account of
      contributory negligence by 25% or a greater percentage determined by the court to be appropriate in the
      circumstances of the case. (5) This section does not apply in a case where the court is satisfied that the
      intoxication was not self-induced.
    gloss: >-
      Where the plaintiff was intoxicated so that their capacity for care was impaired, no damages unless the harm was
      likely anyway; then contributory negligence is presumed (unless the intoxication did not contribute at all) and
      damages fall by at least 25%; not where the intoxication was not self-induced.
    cases: []
    verify: false
  - slug: law-reform-miscellaneous-provisions-act-1965-nsw-s9
    title: Law Reform (Miscellaneous Provisions) Act 1965 (NSW) s 9(1)
    kind: statute
    text: >-
      Not reproduced in the materials. The textbook flowchart (Tort Law Principles 3e, p 478) cites s 9(1) for the rule
      that a finding of contributory negligence results in a partial reduction in the damages otherwise recoverable,
      based on what is "just and equitable having regard to [their] share in the responsibility for the damage".
    gloss: >-
      The NSW apportionment provision: the plaintiff's damages are reduced to the extent that is just and equitable
      having regard to their share in the responsibility for the damage.
    cases:
      - pennington-v-norris
    verify: true
  - slug: motor-accidents-act-1988-nsw-s76
    title: Motor Accidents Act 1988 (NSW) s 76
    kind: statute
    text: >-
      Not reproduced in the materials. The textbook flowchart (Tort Law Principles 3e, p 479) cites it as an example of
      legislative intervention that specifically excludes the volenti defence against passengers who rely on an
      intoxicated driver.
    gloss: Cited as legislation that takes the volenti defence away where a passenger relied on an intoxicated driver.
    cases: []
    verify: true
questions:
  - key: q001
    type: mcq
    concept: defences-to-negligence-flowchart
    difficulty: 1
    set: pretest
    contrasts-with:
      - contributory-negligence-apportionment-and-standard
      - voluntary-assumption-of-risk
    stem: >-
      According to the textbook flowcharts, how do contributory negligence and voluntary assumption of risk differ in
      their effect on the claim?
    options:
      - text: Contributory negligence partially reduces the damages; voluntary assumption of risk is a complete defence.
        correct: true
        why: >-
          Right — the contributory negligence flowchart opens with a 'partial reduction' in the damages otherwise
          recoverable, and the volenti flowchart says volenti 'operates as a complete defence to negligence'.
      - text: Both are complete defences, but contributory negligence needs proof that the plaintiff was careless.
        why: >-
          Tempting because both defences turn on the plaintiff's own conduct, but the flowchart says contributory
          negligence results only in a partial reduction in damages, not a defeated claim.
      - text: Both only reduce damages, by whatever share is just and equitable having regard to responsibility.
        why: >-
          Tempting because 'just and equitable' is the apportionment test, but it belongs to contributory negligence
          alone; volenti, if proved, is a complete defence that defeats the claim.
      - text: Voluntary assumption of risk reduces damages, while contributory negligence defeats the claim.
        why: >-
          This reverses the two. The flowcharts make contributory negligence the partial defence (a reduction in
          damages) and volenti the complete defence to negligence.
  - key: q002
    type: mcq
    concept: defences-to-negligence-flowchart
    difficulty: 1
    stem: Which of these is NOT one of the boxes under 'General principles' on the contributory negligence flowchart?
    options:
      - text: Agony of the moment
        why: >-
          Tempting to rule out because it sounds informal, but it is a contributory negligence box: careless-looking
          action justified in a perceived emergency may not be contributory negligence.
      - text: Knowledge of risk
        correct: true
        why: >-
          Correct — knowledge of risk is a box on the voluntary assumption of risk flowchart (full appreciation of the
          risk: Banovic v Perkovic; Carey), not on the contributory negligence chart.
      - text: Momentary thoughtlessness by employees
        why: >-
          This is on the contributory negligence chart: in the employment context, inattention bred of familiarity and
          repetition may be taken into account (McLean v Tedman).
      - text: Relevant standard of care
        why: >-
          This is on the contributory negligence chart: the same principles that decide negligence decide contributory
          negligence (CLA s 5R). It is easy to forget it is a separate box.
  - key: q003
    type: mcq
    concept: defences-to-negligence-flowchart
    difficulty: 1
    stem: Where do the textbook flowcharts place illegality?
    options:
      - text: Under contributory negligence, as a ground for a larger reduction in damages
        why: >-
          Tempting because illegality is about the plaintiff's own wrongdoing, but it is not on the contributory
          negligence chart, and the flowchart describes it as a defence, not a reduction.
      - text: Under voluntary assumption of risk, as the last of its general principles
        correct: true
        why: >-
          Right — the volenti flowchart lists knowledge of risk, intoxicated drivers and passengers, legislative reform
          and illegality as its general principles.
      - text: "On neither chart: the textbook treats it as a separate, third flowchart"
        why: >-
          Tempting because illegality is a distinct defence, but in the materials supplied it sits as a box under the
          volenti flowchart's general principles (Gala v Preston).
      - text: Under contributory negligence, alongside the intoxication and rescuer boxes
        why: >-
          Intoxication and rescuers are contributory negligence boxes, which makes this tempting, but illegality appears
          on the voluntary assumption of risk flowchart instead.
  - key: q004
    type: mcq
    concept: defences-to-negligence-flowchart
    difficulty: 2
    contrasts-with:
      - intoxicated-plaintiff-cla-s50
      - volenti-and-legislation
    stem: Intoxication appears on both flowcharts. Which pairing is correct?
    options:
      - text: >-
          Contributory negligence: passengers of an intoxicated driver; volenti: a presumption where the plaintiff is
          drunk.
        why: >-
          This swaps the two boxes. The presumption (CLA s 50) is on the contributory negligence chart; reluctance to
          apply volenti to passengers is on the volenti chart.
      - text: >-
          Contributory negligence: a presumption where the plaintiff is intoxicated; volenti: passengers of intoxicated
          drivers.
        correct: true
        why: >-
          Right — the contributory negligence chart's 'Intoxication' box gives the s 50 presumption; the volenti chart's
          'Intoxicated drivers and passengers' box deals with passengers who rely on a drunk driver.
      - text: Both boxes deal with the plaintiff's own intoxication, one under CLA s 50 and the other under CLA s 5L.
        why: >-
          Tempting because both mention intoxication, but s 5L is about obvious risks of dangerous recreational
          activities; the volenti box concerns the driver's intoxication, not the plaintiff's.
      - text: Both boxes deal with passengers who rely on an intoxicated driver, under the Motor Accidents Act 1988.
        why: >-
          Only the volenti box concerns passengers and cites the Motor Accidents Act 1988 (NSW) s 76; the contributory
          negligence box is about the plaintiff being intoxicated (CLA s 50).
  - key: q005
    type: mcq
    concept: defences-to-negligence-flowchart
    difficulty: 2
    stem: On the volenti flowchart, who must show what?
    options:
      - text: The plaintiff must show they did not know of the risk before the defendant can be held liable.
        why: >-
          Tempting because knowledge is central to volenti, but the flowchart puts the burden on the defendant:
          "Defendant must show that the plaintiff … fully appreciated … and voluntarily accepted".
      - text: The court presumes acceptance of risk whenever the plaintiff chose to join a dangerous activity.
        why: >-
          Tempting because CLA s 5L works without the plaintiff's awareness, but common law volenti is not presumed; it
          must be proved and is narrowly confined to the specific risk.
      - text: The defendant must show the plaintiff perceived, fully appreciated and voluntarily accepted the specific risk.
        correct: true
        why: >-
          Right — the flowchart says the defendant must show the plaintiff not only perceived the risk but fully
          appreciated its nature and extent and voluntarily accepted that specific risk.
      - text: The defendant need only show that the plaintiff was aware of the general nature of the risks of the activity.
        why: >-
          Tempting as a lower bar, but the flowchart says the defence "does not extend to an awareness of the general
          nature of the risk" — it is confined to the specific risk.
  - key: q006
    type: mcq
    concept: defences-to-negligence-flowchart
    difficulty: 2
    stem: >-
      Mira rides her bicycle at night without lights and is hit by a negligent driver. Which defence does the flowchart
      most directly point the driver to, and with what effect?
    options:
      - text: Voluntary assumption of risk, because riding without lights shows she accepted the risk of a collision.
        why: >-
          Tempting because she took a risk, but volenti needs proof that she fully appreciated and voluntarily accepted
          the specific risk; carelessness for her own safety is contributory negligence territory.
      - text: Illegality, because riding without lights may be unlawful, which would defeat her claim entirely.
        why: >-
          Tempting because of the possible offence, but the flowchart's illegality box concerns a plaintiff and
          defendant involved in a criminal enterprise together where no standard of care can be set.
      - text: Contributory negligence, which may reduce her damages on what is just and equitable.
        correct: true
        why: >-
          Right — her lack of care for her own safety is the subject of contributory negligence, which results in a
          partial reduction based on what is just and equitable (LRMPA s 9(1)), if it is causally linked.
      - text: No defence, because a negligent defendant cannot rely on anything the plaintiff did or failed to do.
        why: >-
          Wrong — both flowcharts are defences built on the plaintiff's own conduct. A defendant found negligent can
          still argue contributory negligence or volenti.
  - key: q007
    type: mcq
    concept: defences-to-negligence-flowchart
    difficulty: 2
    stem: Which Civil Liability Act 2002 (NSW) sections appear on the contributory negligence flowchart?
    options:
      - text: ss 5L, 5R and 50
        why: >-
          Tempting because 5R and 50 are right, but s 5L appears on the voluntary assumption of risk flowchart
          (legislative reform), not the contributory negligence chart.
      - text: ss 5R, 50 and 56
        correct: true
        why: >-
          Right — s 5R (relevant standard of care), s 50 (intoxication presumption) and s 56 (rescuers / good
          samaritans) are the NSW sections cited on the contributory negligence chart.
      - text: ss 5L and 56 only
        why: >-
          Only s 56 is on the contributory negligence chart; s 5L belongs to the volenti chart, and this option leaves
          out s 5R and s 50, both of which are cited there.
      - text: ss 5R and 5L only
        why: >-
          s 5R is on the contributory negligence chart, but s 5L is on the volenti chart, and this option misses s 50
          (intoxication) and s 56 (rescuers).
  - key: q008
    type: mcq
    concept: defences-to-negligence-flowchart
    difficulty: 2
    variant-of: q006
    stem: >-
      Dev, a warehouse worker, slips on oil his employer negligently left on the floor. He was hurrying to finish an
      urgent order and not watching the floor. Which branch fits best?
    options:
      - text: >-
          Contributory negligence: his inattention may reduce damages, though the employment context may be taken into
          account.
        correct: true
        why: >-
          Right — his lack of care is a contributory negligence question, and the flowchart says inattention, the
          urgency of the task and preoccupation with the work may be taken into account (McLean v Tedman).
      - text: "Volenti: by hurrying past the oil he voluntarily accepted the specific risk of slipping on it."
        why: >-
          Tempting because he chose to hurry, but nothing shows he perceived the oil, let alone fully appreciated and
          voluntarily accepted that specific risk, as volenti requires.
      - text: "Illegality: breaching a workplace safety rule is a criminal enterprise shared with the employer."
        why: >-
          Wrong — the illegality box concerns a plaintiff and defendant involved in a criminal enterprise together;
          hurrying at work is nothing of the kind.
      - text: "Neither: an employee's inattention at work can never be considered against the employer."
        why: >-
          Tempting as a pro-worker reading of the employees box, but the flowchart says those conditions 'may be taken
          into account' in deciding contributory negligence — not that it is excluded.
  - key: q009
    type: mcq
    concept: defences-to-negligence-flowchart
    difficulty: 1
    stem: Where does CLA s 5L appear on the textbook flowcharts?
    options:
      - text: Under 'Relevant standard of care' on the contributory negligence flowchart
        why: >-
          Tempting because it is a CLA section, but the standard of care box cites s 5R. Section 5L is cited on the
          volenti flowchart.
      - text: Under 'Rescuers' on the contributory negligence flowchart
        why: >-
          The rescuers box cites CLA s 56 (and the ACT Act s 5), not s 5L. Section 5L deals with obvious risks of
          dangerous recreational activities.
      - text: Under 'Legislative reform' on the voluntary assumption of risk flowchart
        correct: true
        why: >-
          Right — the legislative reform box says some jurisdictions have legislation which expands the voluntary
          assumption of risk defence, eg CLA s 5L, with Tapp for guidance.
      - text: Under 'Illegality' on the voluntary assumption of risk flowchart
        why: >-
          Right flowchart, wrong box: the illegality box cites Gala v Preston and Progress & Properties Ltd v Craft, not
          any section of the CLA.
  - key: q010
    type: mcq
    concept: defences-to-negligence-flowchart
    difficulty: 3
    contrasts-with:
      - contributory-negligence-apportionment-and-standard
    stem: >-
      A plaintiff fully appreciated and voluntarily accepted the specific risk that injured her. Which outcome do the
      flowcharts point to?
    options:
      - text: Damages are reduced by her share in the responsibility, as for contributory negligence.
        why: >-
          Tempting because she contributed to her own harm, but these facts satisfy volenti, which is a complete defence
          — not the partial, just and equitable reduction of contributory negligence.
      - text: "The claim fails entirely: volenti is a complete defence."
        correct: true
        why: >-
          Right — the defendant has shown what the flowchart requires (perception, full appreciation, voluntary
          acceptance of the specific risk), and volenti operates as a complete defence to negligence.
      - text: Damages are reduced by at least 25%, the statutory floor that applies to accepted risks.
        why: >-
          Tempting because 25% is a real figure this week, but it is the s 50(4) floor for the intoxication presumption,
          not a rule about accepted risks.
      - text: The claim succeeds in full, because knowledge of a risk is relevant only to breach of duty.
        why: >-
          Wrong — the plaintiff's knowledge and acceptance of the specific risk is exactly what the volenti defence
          turns on, so it can defeat the claim.
  - key: q011
    type: truefalse
    concept: defences-to-negligence-flowchart
    difficulty: 1
    set: quickfire
    statement: >-
      The contributory negligence flowchart says a finding of contributory negligence results in a partial reduction in
      the damages otherwise recoverable.
    answer: true
    why: >-
      True — the flowchart's opening box says exactly this, citing Law Reform (Miscellaneous Provisions) Act 1965 (NSW)
      s 9(1). The reduction is what is just and equitable.
  - key: q012
    type: truefalse
    concept: defences-to-negligence-flowchart
    difficulty: 1
    set: quickfire
    statement: On the textbook flowcharts, illegality is listed as one of the general principles of contributory negligence.
    answer: false
    why: >-
      False — illegality is the last general principle on the voluntary assumption of risk flowchart (Gala v Preston;
      Progress & Properties Ltd v Craft), not the contributory negligence chart.
  - key: q013
    type: truefalse
    concept: defences-to-negligence-flowchart
    difficulty: 1
    set: quickfire
    statement: Voluntary assumption of risk, if established, operates as a complete defence to negligence.
    answer: true
    why: >-
      True — the volenti flowchart says volenti non fit injuria 'operates as a complete defence to negligence', unlike
      contributory negligence, which only reduces damages.
  - key: q014
    type: mcq
    concept: contributory-negligence-apportionment-and-standard
    difficulty: 1
    set: pretest
    stem: >-
      On what basis is the reduction for contributory negligence made, according to the flowchart (citing Law Reform
      (Miscellaneous Provisions) Act 1965 (NSW) s 9(1))?
    options:
      - text: What is just and equitable having regard to the plaintiff's share in the responsibility for the damage
        correct: true
        why: >-
          Right — the flowchart quotes this phrase: the reduction is what is 'just and equitable having regard to
          [their] share in the responsibility for the damage'.
      - text: A fixed reduction of 25%, increased only if the court finds a greater percentage appropriate
        why: >-
          Tempting because these words are in the CLA, but the 25% floor belongs to the s 50(4) intoxication
          presumption, not to the general apportionment rule.
      - text: The percentage by which the plaintiff's lack of care increased the chance of the harm occurring
        why: >-
          Tempting because it sounds like causation, but causation is a separate requirement (Caswell); the size of the
          reduction is what is just and equitable having regard to responsibility.
      - text: Equal shares between plaintiff and defendant whenever both of them have been negligent
        why: >-
          Tempting as a simple default, but the flowchart requires the court to examine the whole conduct of each party
          and their relative blameworthiness (Pennington v Norris), not split evenly.
  - key: q015
    type: mcq
    concept: contributory-negligence-apportionment-and-standard
