  - key: q079
    type: mcq
    concept: illegality-defence
    difficulty: 3
    contrasts-with:
      - voluntary-assumption-of-risk
    stem: Which statement correctly distinguishes illegality from volenti on the flowchart?
    options:
      - text: Both turn on full appreciation of a specific risk; illegality simply adds a crime.
        why: >-
          Tempting because both sit on the same chart, but illegality does not ask about appreciation of risk; it asks
          whether a standard of care can be determined.
      - text: >-
          Illegality turns on whether a standard of care can be set in a joint criminal enterprise; volenti on
          acceptance of a specific risk.
        correct: true
        why: >-
          Right — illegality: no feasible standard of care between participants in the criminal enterprise (Gala v
          Preston). Volenti: perceived, fully appreciated and voluntarily accepted specific risk.
      - text: Illegality reduces the damages, while volenti defeats the claim completely.
        why: >-
          Wrong — the flowchart describes illegality as a defence available to the defendant, not as a reduction;
          reductions are contributory negligence.
      - text: Illegality is the statutory defence in CLA s 5L; volenti is the common law defence.
        why: >-
          Wrong — s 5L is the legislative reform box (obvious risks of dangerous recreational activities). The
          illegality box cites cases, not a statute.
  - key: q080
    type: mcq
    concept: illegality-defence
    difficulty: 2
    stem: >-
      On the flowchart's account, why have courts allowed the illegality defence in some joint criminal enterprise
      cases?
    options:
      - text: Because it would not be possible or feasible to determine an appropriate standard of care
        correct: true
        why: >-
          Right — that is the reason the flowchart gives: in such cases the courts have often found it would not be
