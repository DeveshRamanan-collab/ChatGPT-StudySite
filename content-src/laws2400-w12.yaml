week_file:
  topic: "Defences to negligence: contributory negligence and voluntary assumption of risk"
  summary: >-
    This week covers the two defences to negligence that turn on the plaintiff's own conduct, as set out in the
    textbook's flowcharts. Contributory negligence results in a partial reduction in damages on what is just and
    equitable (with the CLA s 5R standard, a causal requirement and the s 50 intoxication presumption), while voluntary
    assumption of risk is a complete defence confined to a specific risk the plaintiff fully appreciated and accepted,
    reshaped by statute (CLA s 5L) and joined by illegality. For the exam, pick the right branch for the facts and apply
    its rule with the authority the flowchart names.
