  - slug: volenti-and-legislation
    title: "Volenti and legislation: intoxicated drivers and CLA s 5L"
    visual: explainer
    visual-brief: >-
      The common law volenti gate, turned two ways by statute: for passengers who rely on an intoxicated driver,
      legislation such as Motor Accidents Act 1988 (NSW) s 76 closes it; for obvious risks of dangerous recreational
      activities, CLA s 5L opens a wider gate that applies whether or not the plaintiff was aware of the risk.
    related:
