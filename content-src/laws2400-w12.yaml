  - key: q083
    type: short
    concept: contributory-negligence-apportionment-and-standard
    difficulty: 3
    cases:
      - pennington-v-norris
      - caswell-v-powell-duffryn-associated-collieries
    contrasts-with:
      - voluntary-assumption-of-risk
    prompt: >-
      Hana crosses a busy road while looking at her phone and without checking for traffic. Ollie, driving well

      over the speed limit, hits her. The evidence is that had Hana looked before stepping out she would have seen
      Ollie's

      car and waited. Ollie's negligence is admitted. Advise Ollie whether Hana's damages can be reduced.
    model: >-
      The issue is whether Hana was contributorily negligent, so that her damages are reduced. A finding of

      contributory negligence results in a partial reduction in the damages otherwise recoverable, based on what is just
      and

      equitable having regard to her share in the responsibility for the damage (Law Reform (Miscellaneous Provisions)
      Act

      1965 (NSW) s 9(1)). Under CLA s 5R the principles of negligence apply to her own failure to take precautions: the

      standard is a reasonable person in her position, judged on what she knew or ought to have known at the time. A

      reasonable person crossing a busy road would check for traffic; Hana did not, and she ought to have known of the

      risk. The causal requirement is met: had she looked she would have waited, so her lack of care is causally linked
      to

      her injury (Caswell v Powell Duffryn Associated Collieries). On what is just and equitable, the court examines the

      whole conduct of each party and their relative blameworthiness (Pennington v Norris): Hana's inattention against

      Ollie's heavy speeding. Conclusion: Hana is likely to be found contributorily negligent and her damages partially

      reduced; the size of the reduction is for the court on that weighing. Volenti does not arise: nothing shows she

      accepted a specific risk.
    rubric:
      - id: r1
        criterion: "Identifies the issue: contributory negligence and its effect"
        marks: 2
        top-band: >-
          States that contributory negligence results in a partial reduction on what is just and equitable (LRMPA s
          9(1)), not a defeated claim.
        margin-note: Good — you named the effect before the test.
        authorities:
          - law-reform-miscellaneous-provisions-act-1965-nsw-s9
      - id: r2
        criterion: States the s 5R standard and the causal requirement
        marks: 3
        top-band: >-
          Quotes s 5R: reasonable person in her position, on what she knew or ought to have known; adds the causal link
          (Caswell) with ordinary causation principles.
        margin-note: "Both halves needed: standard and causation."
        authorities:
          - civil-liability-act-2002-nsw-s5r
      - id: r3
        criterion: Applies the standard, causation and relative blameworthiness
        marks: 3
        top-band: >-
          Ties the phone and failure to look to the standard, uses the "would have waited" evidence for causation, and
          weighs her inattention against his speeding (Pennington v Norris).
        margin-note: This is where the marks are — weigh both parties' whole conduct.
        authorities: []
      - id: r4
        criterion: Concludes and keeps volenti separate
        marks: 2
        top-band: >-
          Concludes a partial reduction is likely without inventing a percentage, and notes volenti does not arise on
          these facts.
        margin-note: Sensible not to guess a figure the materials do not give.
        authorities: []
  - key: q084
    type: short
    concept: contributory-negligence-employees-emergencies-rescuers
    difficulty: 3
    cases:
      - avram-v-gusakoski
      - caterson-v-commissioner-for-railways
      - mclean-v-tedman
    prompt: >-
      Fixit Pty Ltd negligently installs a gas line in a café kitchen. During a busy lunch service the line

      ruptures and the kitchen fills with gas. Zara, a cook, believes an explosion is about to happen and jumps out
      through

      a closed window, cutting herself badly. The gas never ignites, and the door two metres away was clear. Fixit
      argues

      Zara was contributorily negligent in choosing the window. Advise Zara.
    model: >-
      The issue is whether Zara's leap through the window is contributory negligence reducing her damages. A

      finding of contributory negligence results in a partial reduction on what is just and equitable, and under CLA s
      5R

      her conduct is measured against a reasonable person in her position, on what she knew or ought to have known at
      the

      time. The flowchart's agony of the moment principle answers Fixit: action that may be considered to demonstrate a
      lack

      of reasonable care for the plaintiff's own safety may not amount to contributory negligence where it can be
      justified

      in a situation of perceived emergency (Avram v Gusakoski; Caterson v Commissioner for Railways). The emergency
      here

      was perceived and real enough: a ruptured gas line filling the kitchen, created by Fixit's negligence. That the
      gas

      did not ignite and the door was clear are hindsight; the question is whether her action can be justified in the

      emergency as she perceived it. The employment context may also be taken into account — the urgency and
      preoccupation

      of a busy service (McLean v Tedman). Conclusion: Zara has a strong argument that choosing the window was not

      contributory negligence, so her damages should not be reduced, though the court will decide whether her action was

      justified.
    rubric:
      - id: r1
        criterion: Identifies the contributory negligence issue and its effect
        marks: 2
        top-band: >-
          Frames the question as whether the leap is contributory negligence, with its partial reduction on what is just
          and equitable.
        margin-note: Clear issue statement.
        authorities:
          - law-reform-miscellaneous-provisions-act-1965-nsw-s9
      - id: r2
        criterion: States the agony of the moment principle with authority
        marks: 3
        top-band: >-
          Uses the flowchart wording — may not amount to contributory negligence where justified in a situation of
          perceived emergency — citing Avram v Gusakoski and Caterson.
        margin-note: Right box, right cases.
        authorities:
          - civil-liability-act-2002-nsw-s5r
      - id: r3
        criterion: Applies the principle to the perceived emergency
        marks: 3
        top-band: >-
          Explains why the emergency was perceived (rupture, gas filling the room) and why the clear door and lack of
          ignition are hindsight; adds the employment context.
        margin-note: Good use of "perceived" — the test is not hindsight.
        authorities: []
      - id: r4
        criterion: Concludes
        marks: 2
        top-band: >-
          Concludes Zara has a strong argument against any reduction while recognising the court decides whether the
          action was justified.
        margin-note: Measured conclusion.
        authorities: []
  - key: q085
    type: short
    concept: intoxicated-plaintiff-cla-s50
    difficulty: 4
    prompt: >-
      Ravi drinks six beers at a club (his own choice) and his capacity to take care is impaired. Walking to the

      exit he falls down a stairwell whose lights the club negligently left broken. Two sober patrons also fell on the
      same

      stairs that night. Ravi was unsteady on his feet when he fell. Advise the club on the effect of CLA s 50.
    model: >-
      The issue is how CLA s 50 affects Ravi's damages. Section 50 applies because, at the time of the fall, he was

      intoxicated to the extent that his capacity to exercise reasonable care and skill was impaired (s 50(1)). It is
      not

      displaced by s 50(5): he drank by his own choice, so the intoxication was self-induced. Under s 50(2) the court
      may

      award damages only if satisfied the injury (or some other injury) is likely to have occurred even if Ravi had not
      been

      intoxicated. The two sober patrons who fell on the same unlit stairs are strong evidence that it would have, so
      the

      gate is likely passed. Then s 50(3) presumes Ravi was contributorily negligent unless the court is satisfied his

      intoxication did not contribute in any way to the cause. His unsteadiness makes that hard to show. The presumption

      therefore likely applies, and under s 50(4) his damages must be reduced by 25% or a greater percentage the court

      determines to be appropriate. Conclusion: the club should argue for the s 50 presumption and a reduction of at
      least

      25%; it cannot use s 50(2) to defeat the claim, because the harm was likely anyway.
    rubric:
      - id: r1
        criterion: Identifies the trigger and the self-induced exception
        marks: 2
        top-band: Applies s 50(1) (impaired capacity) and checks s 50(5) (self-induced) before going further.
        margin-note: "Good order: trigger, then exception."
        authorities:
          - civil-liability-act-2002-nsw-s50
      - id: r2
        criterion: Applies the s 50(2) gate
        marks: 3
        top-band: >-
          States the "likely to have occurred even if not intoxicated" test and uses the sober patrons as evidence that
          it is met.
        margin-note: The sober patrons are the key fact — well used.
        authorities:
          - civil-liability-act-2002-nsw-s50
      - id: r3
        criterion: Applies the s 50(3) presumption and its rebuttal
        marks: 3
        top-band: >-
          Explains the presumption and why Ravi cannot easily show his intoxication did not contribute in any way
          (unsteadiness).
        margin-note: Note the rebuttal is "in any way" — a high bar.
        authorities:
          - civil-liability-act-2002-nsw-s50
      - id: r4
        criterion: States the s 50(4) reduction and concludes
        marks: 2
        top-band: Gives the 25%-or-greater floor and advises the club accordingly, noting s 50(2) will not defeat the claim.
        margin-note: Clear advice to the client.
        authorities:
          - civil-liability-act-2002-nsw-s50
  - key: q086
    type: short
    concept: voluntary-assumption-of-risk
    difficulty: 3
    cases:
      - banovic-v-perkovic
      - carey-v-lake-macquarie-city-council
      - ici-v-shatwell
    contrasts-with:
      - contributory-negligence-apportionment-and-standard
    prompt: >-
      Mel, an experienced indoor climber, uses an automatic belay device at Summit Gym. Staff negligently failed

      to carry out the scheduled inspection, and the device fails, dropping her three metres. Mel had often said
      "climbing

      always carries a risk of falling". Summit pleads voluntary assumption of risk. Ignoring the Civil Liability Act,

      advise Mel.
    model: >-
      The issue is whether Summit can establish volenti non fit injuria, which operates as a complete defence to

      negligence. The essence of the defence is the plaintiff's willingness to assume a risk she knew existed in a
      particular

      activity. Summit must show that Mel not only perceived the existence of the risk, but fully appreciated its nature
      and

      extent and voluntarily accepted that specific risk. The defence is narrowly confined to the specific risk and does
      not

      extend to an awareness of the general nature of the risk. Mel must have fully appreciated the nature and likely

      manifestation of the risk (Banovic v Perkovic; Carey v Lake Macquarie City Council), and effective knowledge
      extends

      beyond the mere existence of a risk to an acceptance of its materialisation (Carey; ICI v Shatwell). The specific
      risk

      that materialised was failure of an uninspected belay device. Mel's statement shows only awareness of the general

      nature of the risk of falling in climbing; nothing shows she knew the inspection had been missed, let alone
      accepted

      that the device might fail. Conclusion: the volenti defence is likely to fail. Summit's better argument, if any
      facts

      support it, would be contributory negligence, which only reduces damages.
    rubric:
      - id: r1
        criterion: Identifies volenti and its effect
        marks: 2
        top-band: Names volenti as a complete defence and states its essence (willingness to assume a known risk).
        margin-note: Good — effect stated up front.
        authorities: []
      - id: r2
        criterion: States the three-part test and the specific-risk limit
        marks: 3
        top-band: >-
          Perceived, fully appreciated nature and extent, voluntarily accepted the specific risk; not the general nature
          of the risk.
        margin-note: Exactly the flowchart test.
        authorities: []
      - id: r3
        criterion: Applies the knowledge cases to the specific risk
        marks: 3
        top-band: >-
          Identifies the specific risk (uninspected device failing) and uses Banovic, Carey and ICI v Shatwell to show
          general awareness of falling is not enough.
        margin-note: Separating the general from the specific risk is the key move.
        authorities: []
      - id: r4
        criterion: Concludes and distinguishes contributory negligence
        marks: 2
        top-band: Concludes volenti is likely to fail and notes contributory negligence as the partial alternative.
        margin-note: Neat contrast with the partial defence.
        authorities: []
  - key: q087
    type: short
    concept: volenti-and-legislation
    difficulty: 4
    cases:
      - tapp-v-australian-bushmens-campdraft-and-rodeo-association-ltd
    contrasts-with:
      - voluntary-assumption-of-risk
    prompt: >-
      Ivy goes on her first trail-bike ride at a commercial park in NSW. The park negligently fails to mark a ditch

      across the track; her bike hits it and she is thrown. Ivy had no idea such ditches existed. Assume a court would
      find

      that trail-bike riding here was a dangerous recreational activity and that the ditch was an obvious risk of it.
      Advise

      the park on (a) common law voluntary assumption of risk and (b) CLA s 5L.
    model: >-
      (a) Volenti non fit injuria is a complete defence, but the park must show Ivy perceived the risk, fully

      appreciated its nature and extent and voluntarily accepted that specific risk; the defence does not extend to an

      awareness of the general nature of the risk. Effective knowledge requires more than the risk's existence — an

      acceptance of its materialisation. Ivy had no idea ditches existed, so she could not have perceived, appreciated
      or

      accepted the specific risk. Volenti fails.


      (b) The textbook flowchart notes that some jurisdictions have legislation that expands the voluntary assumption of

      risk defence, eg CLA s 5L. Under s 5L(1) a defendant is not liable in negligence for harm suffered as a result of
      the

      materialisation of an obvious risk of a dangerous recreational activity engaged in by the plaintiff, and under s
      5L(2)

      this applies whether or not the plaintiff was aware of the risk. On the assumed findings, Ivy's harm resulted from
      the

      materialisation of an obvious risk of a dangerous recreational activity she was engaged in, and her ignorance of
      the

      risk does not matter. For guidance on applying the provision, see Tapp v Australian Bushmen's Campdraft & Rodeo

      Association Ltd (2022) 273 CLR 454. Conclusion: the park is not liable under s 5L, although common law volenti
      would

      fail.
    rubric:
      - id: r1
        criterion: Applies common law volenti
        marks: 3
        top-band: States the three-part test and specific-risk limit and shows Ivy's ignorance defeats it.
        margin-note: Correctly fails volenti on knowledge.
        authorities: []
      - id: r2
        criterion: States s 5L(1) and s 5L(2) accurately
        marks: 3
        top-band: >-
          Quotes the obvious risk of a dangerous recreational activity and the "whether or not the plaintiff was aware"
          limb.
        margin-note: Precise statutory wording earns these marks.
        authorities:
          - civil-liability-act-2002-nsw-s5l
      - id: r3
        criterion: Explains how s 5L expands the defence
        marks: 2
        top-band: Contrasts s 5L(2) with the common law knowledge requirement and cites Tapp for guidance on application.
        margin-note: Good — this is the point of the legislative reform box.
        authorities:
          - civil-liability-act-2002-nsw-s5l
      - id: r4
        criterion: Concludes on both limbs
        marks: 2
        top-band: Concludes volenti fails but s 5L removes liability on the assumed findings.
        margin-note: Two answers, two conclusions — well organised.
        authorities: []
  - key: q088
    type: short
    concept: illegality-defence
    difficulty: 4
    cases:
      - gala-v-preston
      - progress-and-properties-ltd-v-craft
    contrasts-with:
      - voluntary-assumption-of-risk
    prompt: |-
      Ash and Bo break into a closed factory at night to steal copper cable. As they run from a security patrol,
      Bo, carrying a heavy reel, drops it on Ash's foot, breaking it. Ash sues Bo in negligence. Bo pleads illegality.
      Advise on the illegality defence as the textbook flowchart frames it.
    model: >-
      The issue is whether Bo can rely on the defence of illegality. The flowchart says that where the plaintiff

      has been injured and the plaintiff and defendant were involved in the criminal enterprise, the courts have often
      found

      that it would not be possible or feasible to determine an appropriate standard of care, and in such cases a
      defence of

      illegality is available to the defendant (Gala v Preston). However, the defence will not be available where, on
      the

      facts, the court is able to determine the relevant standard of care (Progress & Properties Ltd v Craft). Ash and
      Bo

      were jointly engaged in a theft, and the injury happened as they fled — both within the criminal enterprise. Bo
      will

      argue that no appropriate standard of care can be set for two thieves running from security in the dark. Ash will

      argue that dropping a reel is ordinary carelessness, and the court can set the standard of care a person carrying
      a

      heavy load owes to the person beside them. Conclusion: the answer turns on whether the court can determine a
      standard

      of care on these facts; if it cannot, Bo has the defence, and if it can, the defence is not available. Volenti is
      a

      separate question: it needs acceptance of a specific risk.
    rubric:
      - id: r1
        criterion: Identifies illegality and the joint criminal enterprise
        marks: 2
        top-band: Recognises both parties were involved in the criminal enterprise when Ash was hurt.
        margin-note: Right starting point.
        authorities: []
      - id: r2
        criterion: States the rule and its limit with authority
        marks: 3
        top-band: >-
          Gala v Preston for availability where no appropriate standard can be set; Progress & Properties Ltd v Craft
          for the limit.
        margin-note: Both cases, both directions.
        authorities: []
      - id: r3
        criterion: Argues the standard of care question both ways
        marks: 3
        top-band: Builds Bo's argument (flight, dark, joint crime) and Ash's (ordinary carelessness, standard can be set).
        margin-note: Good balance — this is the hinge.
        authorities: []
      - id: r4
        criterion: Concludes and keeps volenti distinct
        marks: 2
        top-band: States that the outcome turns on the standard of care finding and distinguishes volenti.
        margin-note: "Honest conclusion: the test, not the crime, decides it."
        authorities: []
