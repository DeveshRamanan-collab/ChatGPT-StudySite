cards:
  - type: basic
    concept: defences-to-negligence-flowchart
    front: What is the effect of a finding of contributory negligence?
    back: >-
      A partial reduction in the damages otherwise recoverable, based on what is just and equitable having regard to the
      plaintiff's share in the responsibility for the damage.
    source: Tort Law Principles 3e, p 478 (flowchart)
  - type: basic
    concept: defences-to-negligence-flowchart
    front: What is the effect of voluntary assumption of risk (volenti non fit injuria), if established?
    back: It operates as a complete defence to negligence.
    source: Tort Law Principles 3e, p 479 (flowchart)
  - type: cloze
    concept: defences-to-negligence-flowchart
    text: >-
      The contributory negligence flowchart's general principles: what is {{c1::just and equitable}}; relevant
      {{c2::standard of care}}; {{c3::causal requirement}}; momentary thoughtlessness by employees; agony of the moment;
      rescuers; intoxication.
    source: Tort Law Principles 3e, p 478 (flowchart)
  - type: cloze
    concept: defences-to-negligence-flowchart
    text: >-
      The volenti flowchart's general principles: {{c1::knowledge of risk}}; {{c2::intoxicated drivers and passengers}};
      {{c3::legislative reform}}; {{c4::illegality}}.
    source: Tort Law Principles 3e, p 479 (flowchart)
  - type: basic
    concept: contributory-negligence-apportionment-and-standard
    front: Which statute does the flowchart cite for the just and equitable reduction for contributory negligence?
    back: >-
      Law Reform (Miscellaneous Provisions) Act 1965 (NSW) s 9(1), and its equivalents in other Australian states and
      territories.
    source: Tort Law Principles 3e, p 478 (flowchart)
  - type: basic
    concept: contributory-negligence-apportionment-and-standard
    front: Which cases does the flowchart cite on the meaning of contributory negligence?
    back: Davies v Swan Motor Co (Swansea) Ltd and Jones v Livox Quarries Ltd.
    source: Tort Law Principles 3e, p 478 (flowchart)
  - type: cloze
    concept: contributory-negligence-apportionment-and-standard
    text: >-
      CLA s 5R(2): the standard of care required of the person who suffered harm is that of a {{c1::reasonable person in
      the position of that person}}, determined on the basis of what that person {{c2::knew or ought to have known}} at
      the time.
    source: Civil Liability Act 2002 (NSW) s 5R(2)
  - type: basic
    concept: contributory-negligence-apportionment-and-standard
    front: What does the flowchart (citing Pennington v Norris) say decides what is 'just and equitable'?
    back: Examining the whole conduct of each of the negligent parties and considering the relative blameworthiness of each.
    source: Tort Law Principles 3e, p 478 (flowchart)
  - type: basic
    concept: contributory-negligence-apportionment-and-standard
    front: What causal requirement applies to contributory negligence?
    back: >-
      A causal link between the plaintiff's lack of care for their own safety and their injury must be established
      (Caswell v Powell Duffryn Associated Collieries); ordinary principles of causation apply.
    source: Tort Law Principles 3e, p 478 (flowchart)
  - type: apply
    concept: contributory-negligence-apportionment-and-standard
    scenario: >-
      A pedestrian steps onto a road without looking and is hit by a speeding driver. Looking would have avoided the
      collision.
    answer: >-
      Contributory negligence: she fell below the s 5R standard; her lack of care caused the injury (Caswell); the
      reduction is what is just and equitable, weighing both parties' whole conduct (Pennington v Norris).
    source: Tort Law Principles 3e, p 478 (flowchart)
  - type: basic
    concept: contributory-negligence-employees-emergencies-rescuers
    front: >-
      In the employment context, what may be taken into account in deciding whether an employee was contributorily
      negligent?
    back: >-
      Inattention bred of familiarity and repetition, the urgency of the task, the plaintiff's preoccupation with the
      matter in hand, and other prevailing conditions (McLean v Tedman; Staveley Iron and Chemical Co v Jones).
    source: Tort Law Principles 3e, p 478 (flowchart)
  - type: cloze
    concept: contributory-negligence-employees-emergencies-rescuers
    text: >-
      Action that may seem to show a lack of reasonable care for the plaintiff's own safety may not amount to
      contributory negligence where it can be justified in a situation of {{c1::perceived emergency}} — the {{c2::agony
      of the moment}}.
    source: Tort Law Principles 3e, p 478 (flowchart)
  - type: basic
    concept: contributory-negligence-employees-emergencies-rescuers
    front: Which cases does the flowchart cite for the agony of the moment?
    back: Avram v Gusakoski; Caterson v Commissioner for Railways.
    source: Tort Law Principles 3e, p 478 (flowchart)
  - type: basic
    concept: contributory-negligence-employees-emergencies-rescuers
    front: Who is a 'good samaritan' under CLA s 56?
    back: >-
      A person who, in good faith and without expectation of payment or other reward, comes to the assistance of a
      person who is apparently injured or at risk of being injured.
    source: Civil Liability Act 2002 (NSW) s 56
  - type: apply
    concept: contributory-negligence-employees-emergencies-rescuers
    scenario: >-
      A process worker who has done the same task thousands of times reaches into an unguarded press while rushing an
      urgent order.
    answer: >-
      Contributory negligence is in issue, but inattention bred of familiarity and repetition and the urgency of the
      task may be taken into account (McLean v Tedman; Staveley Iron and Chemical Co v Jones).
    source: Tort Law Principles 3e, p 478 (flowchart)
  - type: cloze
    concept: intoxicated-plaintiff-cla-s50
    text: >-
      CLA s 50 applies where the person was intoxicated to the extent that the person's {{c1::capacity to exercise
      reasonable care and skill}} was impaired.
    source: Civil Liability Act 2002 (NSW) s 50(1)
  - type: basic
    concept: intoxicated-plaintiff-cla-s50
    front: Under CLA s 50(2), when may a court award damages to an intoxicated person?
    back: >-
      Only if satisfied that the death, injury or damage (or some other injury or damage) is likely to have occurred
      even if the person had not been intoxicated.
    source: Civil Liability Act 2002 (NSW) s 50(2)
  - type: basic
    concept: intoxicated-plaintiff-cla-s50
    front: What does CLA s 50(3) presume, and how is the presumption displaced?
    back: >-
      That the person was contributorily negligent — unless the court is satisfied that the person's intoxication did
      not contribute in any way to the cause of the death, injury or damage.
    source: Civil Liability Act 2002 (NSW) s 50(3)
  - type: cloze
    concept: intoxicated-plaintiff-cla-s50
    text: >-
      Under CLA s 50(4), where contributory negligence is presumed, damages are reduced by {{c1::25%}} or a
      {{c2::greater percentage}} determined by the court to be appropriate.
    source: Civil Liability Act 2002 (NSW) s 50(4)
  - type: basic
    concept: intoxicated-plaintiff-cla-s50
    front: When does CLA s 50 not apply at all?
    back: Where the court is satisfied that the intoxication was not self-induced (s 50(5)).
    source: Civil Liability Act 2002 (NSW) s 50(5)
  - type: apply
    concept: intoxicated-plaintiff-cla-s50
    scenario: >-
      A self-intoxicated plaintiff with impaired capacity trips on a negligently unlit step; the court finds he would
      likely have tripped even sober, and cannot say his intoxication made no contribution.
    answer: >-
      Section 50 applies; s 50(2) is passed; contributory negligence is presumed (s 50(3)); damages are reduced by 25%
      or more (s 50(4)).
    source: Civil Liability Act 2002 (NSW) s 50
  - type: basic
    concept: voluntary-assumption-of-risk
    front: What must the defendant show to establish volenti?
    back: >-
      That the plaintiff not only perceived the existence of the risk, but fully appreciated the nature and extent of
      that risk and voluntarily accepted that specific risk.
    source: Tort Law Principles 3e, p 479 (flowchart)
  - type: cloze
    concept: voluntary-assumption-of-risk
    text: >-
      The volenti defence is narrowly confined to the {{c1::specific risk}} and does not extend to an awareness of the
      {{c2::general nature}} of the risk.
    source: Tort Law Principles 3e, p 479 (flowchart)
  - type: basic
    concept: voluntary-assumption-of-risk
    front: What does 'effective knowledge' of a risk require for volenti?
    back: >-
      More than the mere existence of a risk: an acceptance of materialisation of that risk (Carey v Lake Macquarie City
      Council; ICI v Shatwell).
    source: Tort Law Principles 3e, p 479 (flowchart)
  - type: apply
    concept: voluntary-assumption-of-risk
    scenario: >-
      A quad-bike tourist knows quad bikes can roll. His bike's negligently maintained brakes fail on a hill. The
      operator pleads volenti.
    answer: >-
      Likely fails: awareness of the general nature of the risk (rollovers) is not perception, full appreciation and
      acceptance of the specific risk that materialised (brake failure).
    source: Tort Law Principles 3e, p 479 (flowchart)
  - type: basic
    concept: volenti-and-legislation
    front: What does the flowchart say about volenti against passengers who rely on an intoxicated driver?
    back: >-
      Courts are generally reluctant to allow it, and legislation in some jurisdictions specifically excludes it — eg
      Motor Accidents Act 1988 (NSW) s 76.
    source: Tort Law Principles 3e, p 479 (flowchart)
  - type: cloze
    concept: volenti-and-legislation
    text: >-
      CLA s 5L(2): the section applies {{c1::whether or not the plaintiff was aware of the risk}} — which is how it
      expands the voluntary assumption of risk defence.
    source: Civil Liability Act 2002 (NSW) s 5L(2)
  - type: basic
    concept: volenti-and-legislation
    front: What does the flowchart cite Tapp v Australian Bushmen's Campdraft & Rodeo Association Ltd (2022) 273 CLR 454 for?
    back: >-
      Guidance as to the application of legislation, such as CLA s 5L, that expands the voluntary assumption of risk
      defence.
    source: Tort Law Principles 3e, p 479 (flowchart)
  - type: basic
    concept: illegality-defence
    front: When does the flowchart say the defence of illegality is available?
    back: >-
      Where the plaintiff and defendant were involved in the criminal enterprise and it would not be possible or
      feasible to determine an appropriate standard of care (Gala v Preston).
    source: Tort Law Principles 3e, p 479 (flowchart)
  - type: basic
    concept: illegality-defence
    front: When is the illegality defence not available?
    back: >-
      Where, on the facts, the court is able to determine the relevant standard of care (Progress & Properties Ltd v
      Craft).
    source: Tort Law Principles 3e, p 479 (flowchart)
  - type: apply
    concept: illegality-defence
    scenario: >-
      Two people steal a car together; the driver crashes and injures the passenger, who sues. The driver pleads
      illegality.
    answer: >-
      Turns on whether the court can determine an appropriate standard of care on these facts: if not, the defence is
      available (Gala v Preston); if it can, it is not (Progress & Properties Ltd v Craft).
    source: Tort Law Principles 3e, p 479 (flowchart)
audio:
  title: Week 12 recap — defences to negligence
  minutes: 3
  script: >-
    This week is defences to negligence, and our only source is the textbook's two flowcharts, read with the

    Civil Liability Act. Contributory

    negligence reduces the damages. Voluntary assumption of risk defeats the claim.


    Start with contributory negligence. A finding of contributory negligence results in a partial reduction in the
    damages

    otherwise recoverable, based on what is just and equitable having regard to the plaintiff's share in the

    responsibility for the damage. That is the Law Reform (Miscellaneous Provisions) Act, section 9(1). On what it
    means,

    the flowchart points to Davies v Swan Motor Co and Jones v Livox Quarries. Three questions do the work. First, the

    standard: section 5R of the Civil Liability Act applies the ordinary principles of negligence, so we ask what a

    reasonable person in the plaintiff's position would have done, on what they knew or ought to have known at the time.

    Second, causation: the plaintiff's lack of care must be causally linked to the injury, Caswell v Powell Duffryn, on

    ordinary principles. Third, the size of the reduction: look at the whole conduct of each party and their relative

    blameworthiness, Pennington v Norris.


    Some situations soften the picture. For employees, inattention bred of familiarity and repetition, the urgency of
    the

    task and preoccupation with the work may be taken into account, McLean v Tedman and Staveley Iron v Jones. In the

    agony of the moment, action justified in a perceived emergency may not be contributory negligence, Avram v
    Gusakoski.

    Rescuers get statutory protection: in New South Wales, section 56 defines a good samaritan.


    Intoxication has its own rule in section 50. If the plaintiff's capacity for care was impaired by self-induced

    intoxication, there are no damages unless the harm was likely anyway. If it was, contributory negligence is presumed

    unless the intoxication did not contribute in any way, and damages fall by at least twenty-five per cent.


    Now voluntary assumption of risk. It is a complete defence, and a narrow one. The defendant must show the plaintiff

    perceived the risk, fully appreciated its nature and extent, and voluntarily accepted that specific risk. Knowing
    the

    general nature of the risk is not enough: Banovic v Perkovic, Carey v Lake Macquarie, ICI v Shatwell. Courts are

    reluctant to apply it to passengers of drunk drivers, and some legislation excludes it. Section 5L goes the other
    way:

    no liability for an obvious risk of a dangerous recreational activity, whether or not the plaintiff knew of it, with

    Tapp for guidance. Finally, illegality: in a joint criminal enterprise where no standard of care can be set, the

    defence is available, Gala v Preston; where one can be set, it is not, Progress and Properties v Craft.
