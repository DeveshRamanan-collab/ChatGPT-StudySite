      - text: Davies v Swan Motor Co (Swansea) Ltd; Jones v Livox Quarries Ltd
        why: >-
          These are cited in the opening box on the meaning of contributory negligence, which makes them familiar, but
          not for the employment context.
      - text: McLean v Tedman; Staveley Iron and Chemical Co v Jones
        correct: true
        why: >-
          Right — the momentary thoughtlessness by employees box cites McLean v Tedman and Staveley Iron and Chemical Co
          v Jones.
      - text: Banovic v Perkovic; ICI v Shatwell
        why: >-
          These are volenti cases on knowledge of risk. ICI v Shatwell sounds like an industrial case, which is why it
