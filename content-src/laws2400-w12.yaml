      - text: Because public policy bars anyone who has committed a crime from suing
        why: >-
          Too broad: the flowchart says the defence is not available where the court can determine the relevant standard
          of care (Progress & Properties Ltd v Craft).
      - text: Because negligence cannot be proved where the parties were acting criminally
        why: >-
          Wrong — the flowchart does not say negligence is unprovable; it says courts may be unable to determine an
