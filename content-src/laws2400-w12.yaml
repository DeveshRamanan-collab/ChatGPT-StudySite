      The textbook gives two flowcharts for defences to negligence (Tort Law Principles 3e, pp 478–479):

      "Defences to Negligence 2 – Contributory Negligence" and "Defences to Negligence 3 – Voluntary Assumption of
      Risk".

      Both turn on the plaintiff's own conduct, but they end in different places.


      **Contributory negligence** results in a *partial reduction* in the damages otherwise recoverable, based on what
