          Tempting because getting drunk is a choice, but the flowchart treats the plaintiff's intoxication under
          contributory negligence, as a presumption — not as volenti.
      - text: There is now a legislative presumption of contributory negligence — see, eg, CLA s 50.
        correct: true
        why: >-
          Right — the intoxication box says there is now a legislative presumption of contributory negligence where the
          plaintiff is intoxicated, citing CLA s 50 and ACT ss 95, 96.
      - text: Intoxication matters only if the defendant supplied the alcohol or drug that was taken.
        why: >-
          Wrong — nothing in the flowchart or s 50 turns on who supplied the alcohol or drug. Section 50 turns on
          impaired capacity and whether the intoxication was self-induced.
      - text: Courts are reluctant to reduce damages, because the plaintiff was relying on other people.
        why: >-
          Tempting because it echoes the volenti box on passengers of intoxicated drivers, but that box is about the
          driver's intoxication and the volenti defence, not the plaintiff's.
  - key: q040
    type: mcq
    concept: intoxicated-plaintiff-cla-s50
    difficulty: 2
    stem: When does CLA s 50 apply?
    options:
      - text: Whenever the person had drunk any alcohol at all in the hours before the act or omission
        why: >-
          Tempting as a bright-line rule, but s 50(1) requires intoxication to the extent that the person's capacity to
          exercise reasonable care and skill was impaired.
      - text: When the person was intoxicated so that their capacity to exercise reasonable care and skill was impaired
        correct: true
        why: >-
          Right — s 50(1): it applies when the person whose death, injury or damage is in issue was, at the time of the
          act or omission that caused it, intoxicated to the extent that this capacity was impaired.
      - text: >-
          When the defendant, rather than the plaintiff, was intoxicated at the time of the act or omission that caused
          the harm
        why: >-
          Wrong person: s 50(1) concerns the person whose death, injury or damage is the subject of the proceedings —
          the plaintiff's side, not the defendant.
      - text: Only when the intoxication came from an illegal drug rather than from alcohol
        why: >-
          Tempting because illegality is another box this week, but s 50(1) turns on impaired capacity, not on the kind
          of substance; nothing in s 50 limits it to illegal drugs.
  - key: q041
    type: mcq
    concept: intoxicated-plaintiff-cla-s50
    difficulty: 2
    stem: Under CLA s 50(2), when may a court award damages to a person to whom s 50 applies?
    options:
      - text: >-
          Only if satisfied the harm, or some other harm, is likely to have occurred even if the person had not been
          intoxicated
        correct: true
        why: >-
          Right — s 50(2): a court is not to award damages unless satisfied the death, injury or damage (or some other
          injury or damage) is likely to have occurred even without the intoxication.
      - text: Only if the defendant knew, or ought to have known, that the person was intoxicated at the time
        why: >-
          Tempting because knowledge matters elsewhere (s 5R(2)(b)), but s 50(2) turns on whether the harm was likely
          anyway, not on the defendant's knowledge.
      - text: In every case, with the damages then reduced by 25% or any greater percentage that is appropriate
        why: >-
          Tempting because the 25% reduction is in s 50(4), but that comes only after the s 50(2) gate: without the
          "likely anyway" finding, no damages are awarded at all.
      - text: Only if the defendant was more than half responsible for the harm, judged on relative blameworthiness
        why: >-
          Tempting because relative blameworthiness is the just and equitable test (Pennington v Norris), but s 50(2)
          sets a different gate: was the harm likely even without intoxication?
  - key: q042
    type: mcq
    concept: intoxicated-plaintiff-cla-s50
    difficulty: 3
    set: pretest
    stem: >-
      Leo, drunk by his own choice so that his capacity for care was impaired, trips on a negligently unlit council
      step. The court finds he would likely have tripped even if sober, and is not satisfied his intoxication made no
      contribution. What follows under s 50?
    options:
      - text: He recovers nothing, because an intoxicated plaintiff cannot be awarded damages.
        why: >-
          Tempting because s 50(2) can bar damages, but here the court found the harm likely even without intoxication,
          so the bar is passed and the presumption applies instead.
      - text: He is presumed contributorily negligent and his damages are reduced by at least 25%.
        correct: true
        why: >-
          Right — the s 50(2) gate is passed; under s 50(3) contributory negligence is presumed (he has not shown his
          intoxication did not contribute in any way); s 50(4) sets a reduction of 25% or more.
      - text: He recovers in full, because he would likely have tripped even if he had been sober.
        why: >-
          Tempting because the harm was likely anyway, but that finding is what triggers the s 50(3) presumption; it
          does not cancel it.
      - text: He is presumed negligent, with the reduction left wholly to what is just and equitable.
        why: >-
          Close, but s 50(4) fixes a floor: damages are reduced by 25% or a greater percentage the court finds
          appropriate, not by any amount at all.
  - key: q043
    type: mcq
    concept: intoxicated-plaintiff-cla-s50
    difficulty: 3
    variant-of: q042
    stem: >-
      Same facts as Leo's case, except the court finds he would NOT have tripped had he been sober. What follows under s
      50?
    options:
      - text: His damages are reduced by 25%, the statutory floor for intoxication
        why: >-
          Tempting because 25% is the s 50(4) figure, but the presumption and floor only arise once the court is
          satisfied the harm was likely anyway; here it is not.
      - text: His damages are reduced by whatever share is just and equitable
        why: >-
          Tempting because that is the general contributory negligence rule, but s 50(2) stops the court before
          apportionment: no damages are to be awarded.
      - text: No damages may be awarded, because s 50(2) is not satisfied
        correct: true
        why: >-
          Right — under s 50(2), a court is not to award damages unless satisfied the harm is likely to have occurred
          even if the person had not been intoxicated.
      - text: He recovers in full, because the council was negligent
        why: >-
          Wrong — the council's negligence does not displace s 50. Once s 50 applies, the s 50(2) finding controls
          whether any damages can be awarded.
  - key: q044
    type: mcq
    concept: intoxicated-plaintiff-cla-s50
    difficulty: 3
    variant-of: q042
    stem: >-
      Same facts as Leo's case, except his drink was spiked without his knowledge and the court is satisfied the
      intoxication was not self-induced. What follows?
    options:
      - text: No damages unless the harm was likely anyway, because s 50(2) still applies.
        why: >-
          Tempting because s 50(2) is the first gate, but s 50(5) takes the whole section away when the court is
          satisfied the intoxication was not self-induced.
      - text: The presumption applies, but the reduction is capped at exactly 25%.
        why: >-
          Wrong twice: s 50 does not apply at all here (s 50(5)), and in any case s 50(4) sets a floor of 25%, not a
          cap.
      - text: Section 50 does not apply, because the intoxication was not self-induced.
        correct: true
        why: >-
          Right — s 50(5): the section does not apply in a case where the court is satisfied that the intoxication was
          not self-induced.
      - text: Volenti applies, because he chose to accept a drink from someone else.
        why: >-
          Tempting because he accepted the drink, but volenti needs full appreciation and voluntary acceptance of the
          specific risk; he did not know the drink was spiked.
  - key: q045
    type: mcq
    concept: intoxicated-plaintiff-cla-s50
    difficulty: 2
    stem: Where the s 50 presumption of contributory negligence applies, what is the minimum reduction in damages?
    options:
      - text: 10%
        why: >-
          Tempting as a modest figure, but s 50(4) sets the reduction at 25% or a greater percentage determined by the
          court to be appropriate.
      - text: 25%
        correct: true
        why: >-
          Right — s 50(4): damages are reduced on account of contributory negligence by 25% or a greater percentage
          determined by the court to be appropriate.
      - text: 50%
        why: >-
          Tempting as an equal-shares figure, but s 50(4) fixes the minimum at 25%; the court may go higher if
          appropriate in the circumstances.
      - text: 100%
        why: >-
          Wrong — a 100% reduction would defeat the claim; s 50(4) sets a minimum of 25%, leaving any higher figure to
          what is appropriate in the case.
  - key: q046
    type: mcq
    concept: intoxicated-plaintiff-cla-s50
    difficulty: 3
    stem: >-
      Once the court is satisfied the harm was likely to occur anyway, how can the intoxicated plaintiff avoid the s
      50(3) presumption?
    options:
      - text: By showing that the defendant was also intoxicated at the time of the act or omission that caused the harm
        why: >-
          Tempting because it seems to even things up, but s 50(3) is rebutted only by showing the plaintiff's own
          intoxication did not contribute in any way to the cause.
      - text: By satisfying the court that the intoxication did not contribute in any way to the cause
        correct: true
        why: >-
          Right — s 50(3): contributory negligence is presumed unless the court is satisfied that the person's
          intoxication did not contribute in any way to the cause of the death, injury or damage.
      - text: By showing that they drank less than the legal limit for driving a motor vehicle
        why: >-
          Tempting as an objective test, but s 50 does not use a legal limit; it turns on impaired capacity and then on
          whether the intoxication contributed in any way.
      - text: By showing they did not expect to be harmed when they chose to become intoxicated
        why: >-
          Wrong — the plaintiff's expectations are irrelevant to s 50(3), which asks only whether the intoxication
          contributed in any way to the cause of the harm.
  - key: q047
    type: mcq
    concept: intoxicated-plaintiff-cla-s50
    difficulty: 3
    contrasts-with:
      - volenti-and-legislation
    stem: >-
      Sana, who is sober, accepts a lift from a driver she knows is drunk, and he crashes. Which flowchart box is most
      directly engaged?
    options:
      - text: "Intoxication (contributory negligence): CLA s 50 presumes her contributorily negligent."
        why: >-
          Tempting because intoxication is involved, but s 50 concerns the intoxication of the person whose injury is in
          issue. Sana was sober; the driver was drunk.
      - text: "Intoxicated drivers and passengers (volenti): courts are reluctant to allow it, and statute may exclude it."
        correct: true
        why: >-
          Right — this box covers passengers who rely on an intoxicated driver: courts are generally reluctant to allow
          volenti, and some legislation excludes it (eg Motor Accidents Act 1988 (NSW) s 76).
      - text: "Illegality: travelling with a drunk driver makes them partners in a criminal enterprise."
        why: >-
          Tempting because drink-driving may be an offence, but the flowchart's illegality box concerns a joint criminal
          enterprise where no standard of care can be set; that is not this.
      - text: "Legislative reform: CLA s 5L, because riding with a drunk driver is a dangerous recreational activity."
        why: >-
          Wrong — s 5L is about obvious risks of dangerous recreational activities. Getting a lift home is not presented
          in the materials as a recreational activity.
  - key: q048
    type: mcq
    concept: intoxicated-plaintiff-cla-s50
    difficulty: 4
    stem: Which statement about CLA s 50(4) is accurate?
    options:
      - text: The reduction is always exactly 25%, whatever the circumstances of the case.
        why: >-
          Tempting because 25% is the only figure named, but s 50(4) allows "a greater percentage determined by the
          court to be appropriate in the circumstances of the case".
      - text: The court may reduce by less than 25% if the defendant was very blameworthy.
        why: >-
          Tempting because relative blameworthiness drives the general test, but where the presumption applies s 50(4)
          makes 25% the minimum; the court can only go higher.
      - text: The 25% figure replaces any need to consider whether there was contributory negligence.
        why: >-
          Wrong — the 25% floor applies only "when there is a presumption of contributory negligence" under s 50(3),
          which itself depends on the s 50(2) finding.
      - text: The court may set a reduction greater than 25% where that is appropriate in the case.
        correct: true
        why: >-
          Right — s 50(4) reduces damages by 25% or a greater percentage determined by the court to be appropriate in
          the circumstances of the case.
  - key: q049
    type: truefalse
    concept: intoxicated-plaintiff-cla-s50
    difficulty: 1
    set: quickfire
    statement: >-
      Under CLA s 50(4), where contributory negligence is presumed, damages are reduced by 25% or a greater percentage
      the court determines to be appropriate.
    answer: true
    why: >-
      True — this is the minimum reduction once the s 50(3) presumption applies; the court may go higher where
      appropriate in the circumstances of the case.
  - key: q050
    type: truefalse
    concept: intoxicated-plaintiff-cla-s50
    difficulty: 2
    set: quickfire
    statement: CLA s 50 applies even where the court is satisfied the intoxication was not self-induced.
    answer: false
    why: >-
      False — s 50(5) says the section does not apply in a case where the court is satisfied that the intoxication was
      not self-induced, such as a spiked drink.
  - key: q051
    type: truefalse
    concept: intoxicated-plaintiff-cla-s50
    difficulty: 2
    set: quickfire
    statement: >-
      Under CLA s 50(2), a court is not to award damages unless satisfied the harm is likely to have occurred even if
      the person had not been intoxicated.
    answer: true
    why: >-
      True — this is the first gate in s 50. Only if it is passed does the s 50(3) presumption of contributory
      negligence, with its 25% floor, come into play.
  - key: q052
    type: mcq
    concept: voluntary-assumption-of-risk
    difficulty: 1
    stem: What is the 'essence' of the volenti defence, according to the flowchart?
    options:
      - text: A plaintiff's failure to take reasonable care for their own safety in the course of a particular activity
        why: >-
          Tempting because it is also about the plaintiff's conduct, but that describes contributory negligence. Volenti
          rests on willingness to assume a known risk.
      - text: A plaintiff's willingness to assume a risk which the plaintiff knew existed in a particular activity
        correct: true
        why: >-
          Right — the flowchart says 'The essence of the defence lies in a plaintiff's willingness to assume a risk
          which the plaintiff knew existed in a particular activity.'
      - text: The defendant's reasonable belief that the plaintiff would accept any risks of the activity
        why: >-
          Wrong focus: volenti looks at the plaintiff's actual knowledge and willingness, not at what the defendant
          believed the plaintiff would accept.
      - text: Taking part in an activity that a reasonable person would see as obviously dangerous
        why: >-
          Tempting because it echoes obvious risk under CLA s 5L, but common law volenti needs the plaintiff's own
          knowledge and willingness, not an objective view of the danger.
  - key: q053
    type: mcq
    concept: voluntary-assumption-of-risk
    difficulty: 2
    set: pretest
    stem: What must the defendant show to establish volenti?
    options:
      - text: >-
          That the plaintiff perceived the risk, fully appreciated its nature and extent, and voluntarily accepted that
          specific risk
        correct: true
        why: >-
          Right — the flowchart: the plaintiff not only perceived the existence of the risk but fully appreciated its
          nature and extent and voluntarily accepted that specific risk.
      - text: That the plaintiff perceived that the risk existed and chose to continue with the activity regardless
        why: >-
          Tempting because perceiving the risk is the first step, but the flowchart says the plaintiff must "not only"
          perceive it — full appreciation and voluntary acceptance are also needed.
      - text: That the plaintiff was aware of the general nature of the risks involved in the activity
        why: >-
          Wrong — the defence "does not extend to an awareness of the general nature of the risk"; it is narrowly
          confined to the specific risk.
      - text: That a reasonable person in the plaintiff's position would have appreciated the risk
        why: >-
          Tempting because s 5R uses a reasonable person test, but that is for contributory negligence. Volenti needs
          the plaintiff's own full appreciation of the specific risk.
  - key: q054
    type: mcq
    concept: voluntary-assumption-of-risk
    difficulty: 2
    stem: Which statement about the scope of volenti is accurate?
    options:
      - text: It extends to every risk of an activity once the plaintiff knew the activity was dangerous.
        why: >-
          Tempting because knowledge of danger seems to imply acceptance, but the flowchart says the defence does not
          extend to an awareness of the general nature of the risk.
      - text: It covers risks the plaintiff ought to have known of, even if they did not actually know.
        why: >-
          Tempting because 'ought to have known' appears in s 5R(2)(b), but that is for contributory negligence. Volenti
          requires the plaintiff to fully appreciate the risk.
      - text: It applies to a specific risk only if the defendant warned the plaintiff of it in writing.
        why: >-
          Wrong — the flowchart sets no writing requirement; the question is whether the plaintiff perceived, fully
          appreciated and voluntarily accepted the specific risk.
      - text: It is confined to the specific risk and does not extend to the general nature of the risk.
        correct: true
        why: >-
          Right — the flowchart: the defence is narrowly confined to the specific risk and does not extend to an
          awareness of the general nature of the risk.
  - key: q055
    type: mcq
    concept: voluntary-assumption-of-risk
    difficulty: 1
    stem: >-
      Which cases does the flowchart cite for the rule that the plaintiff must fully appreciate the nature and likely
      manifestation of the risk?
    options:
      - text: Gala v Preston; Progress & Properties Ltd v Craft
        why: >-
          These are on the volenti chart, but under illegality: whether a standard of care can be set in a joint
          criminal enterprise.
      - text: Banovic v Perkovic; Carey v Lake Macquarie City Council
        correct: true
        why: >-
          Right — the knowledge of risk box: 'The plaintiff must fully appreciate the nature and likely manifestation of
          the risk – Banovic v Perkovic; Carey v Lake Macquarie City Council'.
      - text: Pennington v Norris; Caswell v Powell Duffryn Associated Collieries
        why: >-
          These are contributory negligence cases — on what is just and equitable and on the causal requirement — not on
          knowledge of risk.
      - text: Avram v Gusakoski; Caterson v Commissioner for Railways
        why: >-
          These are contributory negligence cases on the agony of the moment; they concern perceived emergencies, not
          knowledge of risk for volenti.
  - key: q056
    type: mcq
    concept: voluntary-assumption-of-risk
    difficulty: 3
    cases:
      - carey-v-lake-macquarie-city-council
      - ici-v-shatwell
    stem: What does 'effective knowledge' of a risk require, as the flowchart puts it (citing Carey and ICI v Shatwell)?
    options:
      - text: Knowing that the risk exists, whether or not the plaintiff accepted it materialising
        why: >-
          Tempting because knowledge of the risk is the starting point, but the flowchart says effective knowledge
          extends beyond the mere existence of a risk.
      - text: "More than knowing a risk exists: an acceptance of that risk materialising"
        correct: true
        why: >-
          Right — effective knowledge extends beyond the mere existence of a risk to an acceptance of materialisation of
          that risk (Carey v Lake Macquarie City Council; ICI v Shatwell).
      - text: Being told of the risk in a warning given before the activity began
        why: >-
          Tempting because a warning can supply knowledge, but the flowchart does not make a warning the test; it
          requires acceptance of the risk materialising.
      - text: The knowledge a reasonable person would have had in the plaintiff's position
        why: >-
          Wrong — that objective test is s 5R's for contributory negligence. Volenti looks at the plaintiff's own full
          appreciation and acceptance.
  - key: q057
    type: mcq
    concept: voluntary-assumption-of-risk
    difficulty: 3
    stem: >-
      Jai joins a quad-bike tour. He knows quad bikes can roll over. His bike's brakes, negligently maintained, fail on
      a hill and he is injured. The operator pleads volenti. What is the best response?
    options:
      - text: "Volenti succeeds: he knew quad biking was dangerous and chose to take part."
        why: >-
          Tempting because he knew of danger, but the flowchart confines volenti to the specific risk; awareness of the
          general nature of the risk is not enough.
      - text: "Volenti likely fails: knowing bikes can roll is not accepting the specific risk of brake failure."
        correct: true
        why: >-
          Right — the operator must show Jai perceived, fully appreciated and voluntarily accepted the specific risk
          that materialised (brake failure); general awareness of rollovers does not do that.
      - text: Volenti succeeds if a reasonable person would have foreseen brake failure on a quad bike.
        why: >-
          Tempting because foreseeability is familiar, but volenti asks what the plaintiff himself perceived,
          appreciated and accepted, not what a reasonable person would foresee.
      - text: Volenti reduces his damages by his share of responsibility for joining the tour.
        why: >-
          Wrong — volenti is a complete defence, not a partial one. A reduction by share of responsibility is
          contributory negligence.
  - key: q058
    type: mcq
    concept: voluntary-assumption-of-risk
    difficulty: 3
    variant-of: q057
    stem: >-
      Same tour, but before setting off the guide shows Jai the worn brakes, explains they may fail on the hill, and Jai
      says he understands and rides anyway. The brakes fail. What about volenti now?
    options:
      - text: Volenti fails, because volenti no longer applies to any recreational activities in NSW after CLA s 5L.
        why: >-
          Tempting because s 5L concerns recreational activities, but the flowchart says s 5L expands the defence
          available to defendants; it does not abolish common law volenti.
      - text: Volenti fails, because the operator's own negligence is what caused the brakes to wear.
        why: >-
          Wrong — volenti is a defence to negligence, so it presupposes the defendant's negligence. The question is the
          plaintiff's knowledge and acceptance.
      - text: "Volenti may succeed: he perceived, fully appreciated and voluntarily accepted the specific risk."
        correct: true
        why: >-
          Right — the specific risk (brake failure on the hill) was shown and explained, and he chose to ride, so the
          defendant can point to perception, full appreciation and voluntary acceptance.
      - text: Volenti only reduces his damages, by at least 25%, as the risk was explained to him.
        why: >-
          Wrong — volenti operates as a complete defence, and 25% is the s 50(4) floor for the intoxication presumption,
          not a volenti figure.
  - key: q059
    type: mcq
    concept: voluntary-assumption-of-risk
    difficulty: 3
    contrasts-with:
      - contributory-negligence-apportionment-and-standard
    stem: Which statement correctly contrasts volenti with contributory negligence?
    options:
      - text: Both require full appreciation of the specific risk; they differ only in their effect.
        why: >-
          Tempting because both concern the plaintiff's conduct, but contributory negligence is judged by the s 5R
          reasonable person standard, not full appreciation of a specific risk.
      - text: Volenti is judged by the s 5R reasonable person test; contributory negligence by actual knowledge.
        why: >-
          This swaps them: s 5R sets the reasonable person standard for contributory negligence, while volenti requires
          the plaintiff's actual full appreciation.
      - text: >-
          Volenti needs acceptance of a specific risk and defeats the claim; contributory negligence asks about a lack
          of care and reduces damages.
        correct: true
        why: >-
          Right — volenti is a complete defence confined to a specific risk the plaintiff fully appreciated and
          accepted; contributory negligence is a partial reduction for lack of care.
      - text: Both are complete defences, but volenti needs more proof than contributory negligence.
        why: >-
          Wrong — only volenti is a complete defence. A finding of contributory negligence results in a partial
          reduction in the damages otherwise recoverable.
  - key: q060
    type: mcq
    concept: voluntary-assumption-of-risk
    difficulty: 2
    stem: Who bears the burden of establishing volenti, according to the flowchart?
    options:
      - text: The plaintiff
        why: >-
          Tempting because the defence concerns the plaintiff's knowledge, but the flowchart says 'Defendant must show
          that the plaintiff … fully appreciated … and voluntarily accepted'.
      - text: The defendant
        correct: true
        why: >-
          Right — the flowchart puts the burden on the defendant to show perception, full appreciation and voluntary
          acceptance of the specific risk.
      - text: The court, of its own motion
        why: >-
          Wrong — the flowchart frames volenti as something the defendant must show; it is not raised and proved by the
          court on its own initiative.
      - text: "Neither: it is presumed from participation"
        why: >-
          Tempting because CLA s 5L works regardless of awareness, but common law volenti is not presumed; the defendant
          must prove the specific risk was accepted.
  - key: q061
    type: truefalse
    concept: voluntary-assumption-of-risk
    difficulty: 1
    set: quickfire
    statement: According to the flowchart, the volenti defence extends to an awareness of the general nature of the risk.
    answer: false
    why: >-
      False — the flowchart says the defence is narrowly confined to the specific risk and does not extend to an
      awareness of the general nature of the risk.
  - key: q062
    type: truefalse
    concept: voluntary-assumption-of-risk
    difficulty: 1
    set: quickfire
    statement: >-
      For volenti, the defendant must show that the plaintiff fully appreciated the nature and extent of the risk and
      voluntarily accepted that specific risk.
    answer: true
    why: >-
      True — and that the plaintiff perceived the risk existed. All three are needed, and they must relate to the
      specific risk that materialised.
  - key: q063
    type: truefalse
    concept: voluntary-assumption-of-risk
    difficulty: 2
    set: quickfire
    statement: >-
      Effective knowledge for volenti extends beyond the mere existence of a risk to an acceptance of materialisation of
      that risk.
    answer: true
    why: >-
      True — this is the flowchart's knowledge of risk box, citing Carey v Lake Macquarie City Council and ICI v
      Shatwell.
  - key: q064
    type: mcq
    concept: volenti-and-legislation
    difficulty: 1
    stem: What does the flowchart say about volenti and passengers who rely on an intoxicated driver?
    options:
      - text: Courts readily allow it, since the passenger chose to travel with that driver.
        why: >-
          Tempting because the passenger made a choice, but the flowchart says courts are generally reluctant to allow
          volenti against such passengers.
      - text: Courts are generally reluctant to allow it, and some legislation excludes it.
        correct: true
        why: >-
          Right — courts are generally reluctant, and legislative intervention in some Australian jurisdictions
          specifically excludes volenti here (eg Motor Accidents Act 1988 (NSW) s 76).
      - text: It is replaced by a presumption that the passenger was contributorily negligent.
        why: >-
          Tempting because of the s 50 presumption, but s 50 concerns the injured person's own intoxication, not a sober
          passenger of a drunk driver.
      - text: It is available only if the passenger was also intoxicated at the time of the crash.
        why: >-
          Wrong — the flowchart's box concerns passengers who rely on an intoxicated driver; it does not make the
          defence depend on the passenger also being intoxicated.
  - key: q065
    type: mcq
    concept: volenti-and-legislation
    difficulty: 1
    verify: true
    stem: Which NSW provision does the flowchart cite as excluding volenti for passengers who rely on an intoxicated driver?
    options:
      - text: Civil Liability Act 2002 (NSW) s 50
        why: >-
          Tempting because s 50 is the CLA's intoxication section, but it presumes contributory negligence by an
          intoxicated plaintiff; it does not exclude volenti.
      - text: Civil Liability Act 2002 (NSW) s 5L
        why: >-
          Wrong direction: the flowchart says s 5L expands the voluntary assumption of risk defence available to
          defendants; it does not exclude volenti.
      - text: Motor Accidents Act 1988 (NSW) s 76
        correct: true
        why: >-
          Right — the intoxicated drivers and passengers box cites Motor Accidents Act 1988 (NSW) s 76 as legislation
          specifically excluding volenti here (its text is not in the materials).
      - text: Civil Liability Act 2002 (NSW) s 5R
        why: >-
          Wrong — s 5R sets the standard for contributory negligence (a reasonable person in the plaintiff's position);
          it says nothing about volenti or passengers.
  - key: q066
    type: mcq
    concept: volenti-and-legislation
    difficulty: 2
    stem: How does the flowchart describe the effect of CLA s 5L on voluntary assumption of risk?
    options:
      - text: It is legislation which abolishes volenti for recreational activities in NSW.
        why: >-
          Tempting because s 5L concerns recreational activities, but the flowchart says it expands the defence
          available to defendants, not that it abolishes volenti.
      - text: It is legislation which excludes volenti for passengers of intoxicated drivers.
        why: >-
          This mixes up the two legislation boxes: exclusion for passengers is the Motor Accidents Act 1988 (NSW) s 76
          point; s 5L is the expansion.
      - text: It is legislation which converts volenti into a partial defence that reduces the damages awarded.
        why: >-
          Wrong — s 5L says the defendant "is not liable", which is not a partial reduction. Partial reductions belong
          to contributory negligence.
      - text: It is legislation which expands the voluntary assumption of risk defence for defendants.
        correct: true
        why: >-
          Right — the legislative reform box: some jurisdictions have enacted legislation which expands the voluntary
          assumption of risk defence available to defendants — eg CLA s 5L.
  - key: q067
    type: mcq
    concept: volenti-and-legislation
    difficulty: 2
    stem: Under CLA s 5L(1), when is a defendant not liable in negligence?
    options:
      - text: For harm from any risk of a recreational activity that was the subject of a risk warning
        why: >-
          Tempting because risk warnings are another CLA recreational rule, but that is not s 5L. Section 5L turns on an
          obvious risk of a dangerous recreational activity.
      - text: >-
          For harm from the materialisation of an obvious risk of a dangerous recreational activity engaged in by the
          plaintiff
        correct: true
        why: >-
          Right — s 5L(1): a defendant is not liable in negligence for harm suffered as a result of the materialisation
          of an obvious risk of a dangerous recreational activity engaged in by the plaintiff.
      - text: For harm from any risk in a sport that the plaintiff fully appreciated and voluntarily accepted
        why: >-
          Tempting because it describes common law volenti, but s 5L does not require full appreciation; s 5L(2) applies
          whether or not the plaintiff was aware of the risk.
      - text: For harm from an obvious risk of any activity, recreational or not, that the plaintiff knew of
        why: >-
          Wrong twice: s 5L is limited to dangerous recreational activities, and it does not depend on the plaintiff
          knowing of the risk (s 5L(2)).
  - key: q068
    type: mcq
    concept: volenti-and-legislation
    difficulty: 3
    contrasts-with:
      - voluntary-assumption-of-risk
    stem: >-
      A plaintiff is hurt by the materialisation of an obvious risk of a dangerous recreational activity she was engaged
      in, but she did not know of the risk. Which is right?
    options:
      - text: Neither s 5L nor volenti can apply, because both depend on what the plaintiff knew.
        why: >-
          Tempting because common law volenti does require knowledge, but s 5L(2) says the section applies whether or
          not the plaintiff was aware of the risk.
      - text: Section 5L can still apply, because it applies whether or not the plaintiff was aware of the risk.
        correct: true
        why: >-
          Right — s 5L(2). This is why the flowchart treats s 5L as expanding the defence: common law volenti would fail
          for want of knowledge, but s 5L does not need it.
      - text: Section 5L applies only if the defendant proves she fully appreciated the specific risk that materialised.
        why: >-
          Tempting because that is the common law volenti test, but s 5L does not import it; s 5L(2) makes the
          plaintiff's awareness irrelevant.
      - text: Common law volenti applies instead, since an obvious risk is one she must have accepted.
        why: >-
          Wrong — volenti requires the plaintiff to have perceived, fully appreciated and voluntarily accepted the
          specific risk; an unknown risk cannot be accepted in that way.
  - key: q069
    type: mcq
    concept: volenti-and-legislation
    difficulty: 2
    cases:
      - tapp-v-australian-bushmens-campdraft-and-rodeo-association-ltd
