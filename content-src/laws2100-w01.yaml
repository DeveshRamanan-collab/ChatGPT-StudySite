  # ---- harts-project ----
  - key: q501
    type: mcq
    concept: harts-project
    difficulty: 1
    set: pretest
    stem: Which of these is NOT one of Hart's three persistent questions?
    options:
      - text: How does law differ from, and relate to, orders backed by threats?
        why: Tempting to pick because it sounds like Austin rather than Hart, but it is the first persistent question, about law and coercion.
      - text: Is there a general obligation to obey the law?
        correct: true
        why: Correct — it is a general jurisprudence puzzle on the week 1 slides, but not one of Hart's three; his are coercion, morality and rules.
      - text: What are rules, and to what extent is law an affair of rules, as games and sports are affairs of rules?
        why: Tempting to pick because of the added comparison with games, but the third persistent question asks exactly what rules are and how far law is an affair of rules.
      - text: How does legal obligation differ from, and relate to, moral obligation?
        why: Tempting to pick because morality seems a separate subject, but this is the second persistent question, about law and morality.
  - key: q502
    type: mcq
    concept: harts-project
    difficulty: 1
    stem: "'In law as elsewhere, we can know and yet not understand.' Where did Hart say this?"
    options:
      - text: In the Postscript to the second edition of The Concept of Law, replying to Dworkin.
        why: Tempting because the Postscript also discusses method, but the line comes from Hart's 1953 inaugural lecture at Oxford.
      - text: In his inaugural lecture, Definition and Theory in Jurisprudence (1953).
        correct: true
        why: "Correct — the slide attributes the line to Definition and Theory in Jurisprudence: An Inaugural Lecture (Clarendon Press, 1953)."
      - text: In the Preface to The Concept of Law.
        why: Tempting because the Preface is where Hart calls the book descriptive sociology, but the knowing/understanding line is from the 1953 lecture.
  - key: q503
    type: mcq
    concept: harts-project
    difficulty: 2
    stem: According to Hart (CL 17), what is the purpose of The Concept of Law?
    options:
      - text: To provide a definition of law by which the correctness of the use of the word 'law' can be tested in any case.
        why: Tempting because the book asks 'what is law?', but Hart says the purpose is precisely not to provide a definition of that kind.
      - text: To justify the legal systems of modern states as morally legitimate.
        why: Tempting because the book centres on modern state law, but Hart says his theory has no justificatory aims.
      - text: To give an improved analysis of a municipal legal system's structure and of law, coercion and morality.
        correct: true
        why: Correct — CL 17 speaks of an improved analysis of the distinctive structure of a municipal legal system and of law, coercion and morality as social phenomena.
  - key: q504
    type: mcq
    concept: harts-project
    difficulty: 2
    stem: For Hart, which are the clear, standard or paradigm cases of law?
    options:
      - text: Primitive law and international law.
        why: Tempting because they are named in the same passage, but Hart treats them as the questionable or borderline cases, not the paradigms.
      - text: The legal systems of modern states, as Hart puts it.
        correct: true
        why: Correct — the slide quotes Hart's paradigm cases as "the legal systems of modern states", against the borderline primitive and international law.
      - text: The customary rules of every society, whether or not it has courts or a legislature to apply them.
        why: Tempting because custom seems universal, but Hart's paradigm is modern state law; rules without institutions fall toward the borderline cases.
  - key: q505
    type: mcq
    concept: harts-project
    difficulty: 2
    stem: Hart notes an oddity about the question 'what is law?'. What is it?
    options:
      - text: Nobody can give any example of law, though lawyers use the word every day.
        why: "Tempting because the question seems unanswerable, but Hart says the opposite: most people can cite examples of law."
      - text: Theoretical debate in books is unending, yet most people can cite examples of law.
        correct: true
        why: Correct — the slide contrasts the unending theoretical debate in books with the ability of most people to cite examples of law.
      - text: Every other discipline also argues endlessly about its own definition, so law is no different from biology.
        why: Tempting because definitions are contested elsewhere too, but Hart says other disciplines usually start with a short definition and get on with it.
  - key: q506
    type: mcq
    concept: harts-project
    difficulty: 3
    stem: An expert in Italian contract law says she still does not understand what law in general is. How would Hart describe her position?
    options:
      - text: As impossible — anyone who knows the law must understand its general nature.
        why: Tempting because expertise seems to imply understanding, but Hart's point is that we can know and yet not understand.
      - text: As showing that confusion about the principal issues may coexist with a firm knowledge of the law.
        correct: true
        why: Correct — the slide says confusion about these issues may coexist with a firm knowledge of the law; the lecture gives this very Italian contract law example.
      - text: As a problem of particular jurisprudence only.
        why: Tempting because she knows one system's law, but her puzzle is about law in general, which is the question Hart's book addresses.
  - key: q507
    type: mcq
    concept: harts-project
    difficulty: 2
    stem: Which pairing of each persistent question to its theme is correct?
    options:
      - text: Orders backed by threats — morality; legal and moral obligation — coercion; rules — rules.
        why: "Tempting because all three themes appear, but the first two are swapped: orders backed by threats is about coercion, obligation about morality."
      - text: Orders backed by threats — coercion; legal vs moral obligation — morality; rules — rules.
        correct: true
        why: Correct — the lecture maps the three questions onto law and coercion, law and morality, and law and rules.
      - text: All three concern coercion, since every legal rule is an order backed by a threat.
        why: Tempting because that is roughly Austin's view, but Hart separates the three issues, and whether law is coercion is itself the first question.
  - key: q508
    type: mcq
    concept: harts-project
    difficulty: 3
    stem: Hart compares those who press for a definition of law to a man in a familiar town. What does the analogy show?
    options:
      - text: That lawyers are lost in the law and should not be trusted to explain it.
        why: Tempting because the man cannot give directions, but he can get around perfectly well; lawyers know the law, they just cannot explain its relations.
      - text: That they can find their way in the law but need a map of its relations to other things.
        correct: true
        why: "Correct — CL 14: like a man who can move around a familiar town but cannot explain the way, they need a map exhibiting law's relations to other things."
      - text: That a definition of law must list every legal rule, like a street directory listing every road in the town.
        why: Tempting because maps and directories are similar, but Hart's map shows relationships between law and other things, not a list of rules.
  - key: q509
    type: mcq
    concept: harts-project
    difficulty: 3
    stem: According to CL 14, what two things can a definition of a word do 'at one and the same time'?
    options:
      - text: Make explicit the latent principle guiding our use of a word, and exhibit its phenomena's relations to other phenomena.
        correct: true
        why: Correct — Hart says a definition may make explicit the latent principle that guides our use of a word and exhibit relationships to other phenomena.
      - text: Settle all legal disputes and fix the meaning of the word for the courts.
        why: Tempting because definitions sound decisive, but Hart describes definitions as maps of relationships, not tools for settling disputes.
      - text: Justify the law and criticise its opponents.
        why: Tempting because definitions can be used polemically, but Hart's theory has no justificatory aims; the two functions are about use and relationships.
  - key: q510
    type: mcq
    concept: harts-project
    difficulty: 3
    stem: "Hart says his book 'may also be regarded as an essay in descriptive sociology'. Why is this claim debated, according to the lecture?"
    options:
      - text: Because Hart used surveys and field research that later proved unreliable.
        why: Tempting because sociology involves fieldwork, but the lecture does not say Hart did empirical research; the debate is about the claim itself.
      - text: Because many see analysis and descriptive sociology as incompatible, and question what Hart meant.
        correct: true
        why: Correct — the lecture says many see conceptual analysis and descriptive sociology as incompatible, and Twining shows different views on what Hart meant.
      - text: Because Hart later withdrew it in the Postscript, apologising for overstating his aims to Dworkin.
        why: Tempting because the Postscript revisits his aims, but the lecture reports no withdrawal; it says the claim is open to different views.
  - key: q511
    type: mcq
    concept: harts-project
    difficulty: 2
    stem: What is added in the second edition (1994) of The Concept of Law?
    options:
      - text: A new introduction by Leslie Green.
        why: Tempting because Green's introduction is a later addition, but it came with the third edition in 2012, not the second.
      - text: An unfinished Postscript, largely a response to critics, especially Dworkin.
        correct: true
        why: Correct — the lecture says the second edition, published after Hart's death, includes the unfinished Postscript replying to critics, Dworkin in particular.
      - text: A final chapter setting out a natural law theory, written with John Finnis after years of debate.
        why: Tempting because Finnis was Hart's student, but no such chapter exists; the lecture describes only the Postscript and, later, Green's introduction.
  - key: q512
    type: mcq
    concept: harts-project
    difficulty: 3
    contrasts-with: [definition-per-genus-et-differentiam]
    stem: Hart says the three persistent questions 'come together in the form of a request for a definition of law'. What kind of definition is he after?
    options:
      - text: A dictionary entry telling us when the word 'law' is used correctly.
        why: Tempting because he speaks of a definition, but the lecture stresses Hart does not want an entry telling you how to use 'law' correctly.
      - text: A formula per genus et differentiam, like the definition of a triangle or an elephant.
        why: Tempting because triangles appear in chapter 1, but Hart argues that type of definition does not work for law.
      - text: A map exhibiting the relationships between the law we know and other things.
        correct: true
        why: Correct — Hart says those who press for a definition need a map of relationships; for Hart that is what a good definition of law should provide.
  - key: q513
    type: mcq
    concept: harts-project
    difficulty: 4
    variant-of: q506
    stem: A senior barrister can win any contract case but cannot say how law differs from morality or from a gunman's orders. Which Hart idea best fits her?
    options:
      - text: That confusion about law's relation to coercion and morality may coexist with firm knowledge of the law.
        correct: true
        why: Correct — she knows the law but lacks understanding of the persistent questions, exactly Hart's point that knowledge and confusion can coexist.
      - text: That she is a borderline case of a lawyer.
        why: Tempting because borderline cases feature in chapter 1, but Hart's borderline cases are kinds of law, like international law, not kinds of lawyer.
      - text: That her knowledge is merely empirical, since winning cases is a matter of causes and effects that sociologists study.
        why: Tempting because success in court has causes, but her knowledge is doctrinal; what she lacks is understanding of law's general nature.
  - key: q514
    type: mcq
    concept: harts-project
    difficulty: 3
    stem: The lecture says Hart's third question distinguishes law from games like chess. What is the point of the comparison?
    options:
      - text: That law, like games and sports, is a social practice based on rules — yet playing law differs from playing chess.
        correct: true
        why: Correct — the lecture says law, like other social practices, is based upon rules, but there is a difference between playing law and playing chess that Hart wants to explain.
      - text: That law is just a game, so it has no serious claim on anyone.
        why: Tempting as a sceptical reading, but the comparison is used to ask what distinguishes law from other rule-based practices, not to trivialise it.
      - text: That chess rules are enforced by threats as law is.
        why: Tempting because both have rules, but threats belong to the first question about coercion; the chess comparison concerns rules.
  - key: q515
    type: mcq
    concept: harts-project
    difficulty: 4
    contrasts-with: [general-and-descriptive-theory]
    stem: Hart picks the legal systems of modern states as his paradigm cases before his description starts. Why might that choice matter for his claim to be descriptive?
    options:
      - text: It does not matter, because paradigm cases are fixed by nature and involve no choice.
        why: Tempting because the modern state seems an obvious paradigm, but the point is that deciding which cases are central is itself a choice.
      - text: It may involve a judgment about what is important, which puts pressure on a morally neutral description.
        correct: true
        why: Correct — if choosing paradigms rests on a judgment of importance, it is a starting point for asking whether Hart's method is purely descriptive.
      - text: It shows that Hart's theory is really about international law, since that is where the description begins.
        why: Tempting because international law is discussed in chapter 1, but Hart treats it as a borderline case, not the starting point.
  - key: q516
    type: mcq
    concept: harts-project
    difficulty: 2
    stem: Which best states Hart's aim in The Concept of Law at page 6?
    options:
      - text: To prove that law is a set of orders backed by threats issued by a sovereign.
        why: Tempting because orders backed by threats are the first persistent question, but that is Austin's view, which Hart criticises in later chapters.
      - text: To further the understanding of law, coercion, and morality as different but related social phenomena.
        correct: true
        why: Correct — this is the quotation from CL 6 on the slide; the lecture says remembering it gives you a map of the book's chapters.
      - text: To catalogue the laws of England and the common law world.
        why: Tempting because Hart was an English lawyer, but his aim is understanding law in general, not listing any system's rules.
  # true/false
  - key: q517
    type: truefalse
    set: quickfire
    concept: harts-project
    difficulty: 1
    statement: For Hart, primitive law and international law are clear, paradigm cases of law.
    answer: false
    why: False — Hart's paradigm cases are the legal systems of modern states; primitive law and international law are his questionable or borderline cases.
  - key: q518
    type: truefalse
    set: quickfire
    concept: harts-project
    difficulty: 1
    statement: Hart says the purpose of The Concept of Law is not to provide a definition by which the correctness of the use of the word 'law' can be tested.
    answer: true
    why: True — CL 17 says the purpose is not that kind of definition but an improved analysis of a municipal legal system and of law, coercion and morality.
  - key: q519
    type: truefalse
    set: quickfire
    concept: harts-project
    difficulty: 2
    statement: Hart's second persistent question asks how legal obligation differs from, and is related to, moral obligation.
    answer: true
    why: True — the second of the three persistent questions (CL 6) concerns law and morality; the first concerns coercion and the third concerns rules.
  - key: q520
    type: short
    concept: harts-project
    difficulty: 3
    prompt: "'In law as elsewhere, we can know and yet not understand.' Explain what Hart meant, and evaluate whether this justifies writing a general theory of law."
    model: |
      Hart's line from his 1953 inaugural lecture justifies a general theory, provided the theory is understood as a
      map rather than a dictionary definition. Hart observes an oddity: debate about 'what is law?' is unending, yet most
      people can cite examples of law; and confusion about law's nature may coexist with a firm knowledge of the law.
      The perplexity arises because beside paradigm cases, the legal systems of modern states, there are borderline cases
      such as primitive and international law, and it centres on three persistent questions: law and orders backed by
      threats, legal and moral obligation, and rules. Skilled lawyers are like a man who can cross a familiar town but
      cannot give directions; they need a map of law's relations to other things (CL 14). A sceptic might reply that
      lawyers function perfectly well without the map, so theory is idle. But the real-world cases answer this: in
      Milirrpum, a theory of what counts as law shaped a decision. Understanding therefore matters practically, and the
      gap Hart identifies is a sound reason for theory.
    rubric:
      - id: r1
        criterion: Thesis — a clear answer to whether the knowing/understanding gap justifies theory.
        marks: 2
        top-band: A qualified thesis that specifies what kind of theory is justified.
        margin-note: Justifies which kind of theory?
        authorities: [hart-definition-and-theory-in-jurisprudence]
      - id: r2
        criterion: Argument — explains Hart's oddity, paradigm/borderline cases and the three persistent questions.
        marks: 3
        top-band: All three questions stated accurately with the map metaphor from CL 14.
        margin-note: Why is 'what is law?' perplexing at all?
        authorities: [hart-the-concept-of-law]
      - id: r3
        criterion: Counterargument — the practitioner who needs no theory.
        marks: 2
        top-band: Puts the sceptic's case charitably, using Hart's own admission that lawyers know the law.
        margin-note: If lawyers cope, why theorise?
        authorities: []
      - id: r4
        criterion: Evaluation — answers the objection with evidence and reaches a verdict.
        marks: 2
        top-band: Uses a real-world case such as Milirrpum to show understanding matters.
        margin-note: Does the objection survive the real-world cases?
        authorities: []
  # ---- definition-per-genus-et-differentiam ----
  - key: q601
    type: mcq
    concept: definition-per-genus-et-differentiam
    difficulty: 1
    set: pretest
    stem: A definition per genus et differentiam combines which two elements?
    options:
      - text: A list of paradigm cases and a list of borderline cases.
        why: Tempting because Hart uses paradigm and borderline cases in chapter 1, but that is his way of framing the problem, not the structure of this definition.
      - text: A general kind and distinguishing features.
        correct: true
        why: Correct — the slide summarises the definition as general kind plus distinguishing features, as in 'three-sided rectilinear figure'.
      - text: A command from a sovereign and a threatened sanction for disobedience.
        why: Tempting because orders backed by threats appear in the same chapter, but that is a model of law, not the structure of a definition.
  - key: q602
    type: mcq
    concept: definition-per-genus-et-differentiam
    difficulty: 1
    stem: In 'triangle = three-sided rectilinear figure', which part is the genus?
    options:
      - text: Three-sided.
        why: Tempting because it comes first, but 'three-sided' is the distinguishing feature that marks triangles off from other rectilinear figures.
      - text: Rectilinear figure.
        correct: true
        why: Correct — 'rectilinear figure' is the wider family (the general kind); 'three-sided' is the differentia.
      - text: The word 'triangle' itself, since the thing defined is always the genus.
        why: Tempting because the definition is about triangles, but the genus is the wider category the triangle is placed in, not the word defined.
  - key: q603
    type: mcq
    concept: definition-per-genus-et-differentiam
    difficulty: 2
    variant-of: q602
    stem: In the elephant definition on the slide, which is the differentia?
    options:
      - text: Quadruped.
        why: Tempting because it is part of the definition, but 'quadruped' is the genus — the wider family elephants belong to.
      - text: Possession of a thick skin, tusks, and trunk.
        correct: true
        why: Correct — these features distinguish elephants from other quadrupeds; they are the differentia.
      - text: Being a large animal found in Africa and Asia.
        why: Tempting because it is true of elephants, but it is not in the slide's definition, which uses skin, tusks and trunk.
  - key: q604
    type: mcq
    concept: definition-per-genus-et-differentiam
    difficulty: 2
    stem: According to the slide, what two things does a definition per genus et differentiam do at once?
    options:
      - text: It justifies the thing defined and criticises its rivals.
        why: Tempting because definitions can be used to take sides, but the two functions on the slide are translating the word and locating the thing.
      - text: It gives a formula translating the word into well-understood terms, and locates the kind of thing within a wider family.
        correct: true
        why: Correct — it provides a code or formula translating the word, and locates the kind of thing by what it shares with and what marks it off from a wider family.
      - text: It records how the word is pronounced and where it first appeared in the language.
        why: Tempting because dictionaries do this, but the slide's two functions are translation and location within a family of things.
  - key: q605
    type: mcq
    concept: definition-per-genus-et-differentiam
    difficulty: 2
    stem: Which theorists does the lecture say tried to define law per genus et differentiam?
    options:
      - text: John Austin and Hans Kelsen.
        correct: true
        why: Correct — the lecture says people like John Austin or Hans Kelsen wrote books trying to find this type of definition of law.
      - text: Julie Dickson and Leslie Green, in their work on the methodology of legal philosophy.
        why: Tempting because both write about legal philosophy, but the lecture does not present them as offering genus-and-differentia definitions of law.
      - text: William Twining and Julius Stone, in their sociological jurisprudence.
        why: Tempting because they appear in week 1, but the lecture names Austin and Kelsen as the theorists who sought this kind of definition.
  - key: q606
    type: mcq
    concept: definition-per-genus-et-differentiam
    difficulty: 3
    stem: What is Hart's position on defining law per genus et differentiam?
    options:
      - text: That it works well, and chapter 1 gives the definition.
        why: Tempting because chapter 1 discusses definitions at length, but Hart says this type of definition does not work for law.
      - text: That it does not work for law, so another method is needed.
        correct: true
        why: Correct — the lecture says Hart claims it is not possible to define law this way, so law must be defined using another method.
      - text: That it would work if only we agreed on which of law's features is essential, which is merely a matter of agreeing on words.
        why: Tempting because agreement seems to be the obstacle, but Hart does not treat the problem as merely verbal; he says the method does not work for law.
  - key: q607
    type: mcq
    concept: definition-per-genus-et-differentiam
    difficulty: 3
    contrasts-with: [harts-project]
    stem: The lecture separates two claims about defining law per genus et differentiam. Which pair is it?
    options:
      - text: That it is impossible; or that it is possible but there are better definitions of law.
        correct: true
        why: "Correct — the lecture says there are in fact two different claims: impossibility, and possibility with better alternatives available."
      - text: That it is possible for municipal law; or that it is possible only for international law.
        why: Tempting because municipal and international law are contrasted in chapter 1, but the two claims concern whether and how well the method works.
      - text: That it is descriptive; or that it is normative.
        why: Tempting because the is/ought distinction runs through the week, but the two claims here are about possibility, not description versus evaluation.
  - key: q608
    type: mcq
    concept: definition-per-genus-et-differentiam
    difficulty: 3
    variant-of: q607
    stem: A critic says 'Hart is wrong that law cannot be defined per genus et differentiam — but his map approach is still the better one'. Which claim is the critic rejecting, and which accepting?
    options:
      - text: Rejecting the claim that a map is better; accepting that the method is impossible.
        why: Tempting because the critic mentions both, but the critic says the map is better, so that is what they accept, not reject.
      - text: Rejecting both claims.
        why: "Tempting because the critic opens by saying Hart is wrong, but the critic keeps the second point: another definition is better."
      - text: Rejecting impossibility; accepting that it is possible but there are better definitions.
        correct: true
        why: Correct — the critic denies that the method is impossible but agrees that there are better definitions, the second of the lecture's two claims.
  - key: q609
    type: mcq
    concept: definition-per-genus-et-differentiam
    difficulty: 2
    stem: Why does a four-sided figure fail the definition of a triangle?
    options:
      - text: Because it is not a rectilinear figure.
        why: Tempting because it fails somewhere, but a four-sided figure can be rectilinear; it lacks the distinguishing feature, not the genus.
      - text: Because it lacks the distinguishing property of being three-sided.
        correct: true
        why: Correct — the lecture says if a shape has four sides it is not a triangle; the differentia of being three-sided marks triangles off.
      - text: Because four-sided figures belong to a borderline case of geometry, as international law is a borderline case of law.
        why: Tempting because it mirrors Hart's borderline cases, but a square is clearly not a triangle; nothing about it is borderline.
  - key: q610
    type: mcq
    concept: definition-per-genus-et-differentiam
    difficulty: 3
    stem: To define law per genus et differentiam, a theorist might place law in a broader category with which other things, according to the lecture?
    options:
      - text: With games, social etiquette and religion.
        correct: true
        why: Correct — the lecture suggests law might be placed in a broader category with games, social etiquette and religion, then marked off by its distinguishing features.
      - text: With triangles and elephants, since all definitions share one genus.
        why: Tempting because they are the slide's examples, but they illustrate the method; they are not the category law would be placed in.
      - text: With medicine and religious law, the other meanings of the word 'jurisprudence'.
        why: Tempting because those meanings appear earlier in the week, but they are uses of a word, not the broader category of social things like law.
  - key: q611
    type: mcq
    concept: definition-per-genus-et-differentiam
    difficulty: 4
    stem: A theorist defines law as 'a system of social rules distinguished by being backed by organised sanctions'. How would Hart classify this attempt?
    options:
      - text: As a map of relationships, the method Hart himself recommends.
        why: Tempting because it relates law to social rules, but it offers a genus plus a distinguishing feature, the formula Hart says fails for law.
      - text: As a definition per genus et differentiam — the type Hart says does not work for law.
        correct: true
        why: Correct — 'system of social rules' is a genus and 'backed by organised sanctions' a differentia, exactly the structure Hart rejects for law.
      - text: As a descriptive sociology of sanctions.
        why: Tempting because it mentions sanctions and society, but its form is a definition by kind and difference, not a sociological description.
  - key: q612
    type: mcq
    concept: definition-per-genus-et-differentiam
    difficulty: 2
    stem: What does the Latin 'differentiam' refer to in the expression per genus et differentiam?
    options:
      - text: The difference between law and morality, which Hart treats as essential.
        why: Tempting because law and morality are contrasted in the book, but in this expression the difference means the distinguishing features of whatever is defined.
      - text: The distinguishing features that mark the thing off from the rest of its general kind.
        correct: true
        why: Correct — the lecture says the differentia identifies the distinguishing features that differentiate the thing from the rest of the general kind.
      - text: The different editions of The Concept of Law.
        why: Tempting only as wordplay, but differentia is a term of the definition, not a reference to the book's editions.
  - key: q613
    type: mcq
    concept: definition-per-genus-et-differentiam
    difficulty: 3
    contrasts-with: [conceptual-analysis]
    stem: How does a definition per genus et differentiam relate to 'necessary and sufficient conditions' in conceptual analysis?
    options:
      - text: They are opposites — one is used in science, the other only in law.
        why: Tempting because they come from different slides, but both set the boundaries of a category; neither is confined to science or law.
      - text: Both try to capture essential properties that fix a category's boundaries.
        correct: true
        why: Correct — the lecture says a good genus-and-differentia definition captures all the essential properties of a triangle, which is what necessary and sufficient conditions do.
      - text: Necessary and sufficient conditions apply only to empirical theories in the social sciences.
        why: Tempting because Bix contrasts conceptual and social-science theories, but necessary and sufficient conditions belong to conceptual theories.
  - key: q614
    type: mcq
    concept: definition-per-genus-et-differentiam
    difficulty: 4
    stem: An essay says 'Hart refuses to define law at all'. What is the most accurate correction?
    options:
      - text: Hart does give a definition per genus et differentiam in chapter 1.
        why: Tempting because chapter 1 is about definition, but Hart argues that type of definition does not work for law.
      - text: The essay is right — Hart thinks the question 'what is law?' should be abandoned.
        why: Tempting because Hart rejects one kind of definition, but he pursues the question and says the persistent issues come together as a request for a definition.
      - text: Hart rejects one type of definition, and seeks another — an elucidation that maps law's relations.
        correct: true
        why: Correct — the lecture says Hart is interested in a definition of law, but not in the shallow dictionary sense or per genus et differentiam.
  - key: q615
    type: mcq
    concept: definition-per-genus-et-differentiam
    difficulty: 2
    stem: Why does the lecture say the question whether law can be defined per genus et differentiam is not 'a matter of picking your favourite team'?
    options:
      - text: Because the answer is settled, so there is nothing to choose between.
        why: Tempting because Hart states his view firmly, but the lecture says many disagree with him; the question is open, not settled.
      - text: Because you must think carefully about whether the claim is true, not side with Hart or his critics by preference.
        correct: true
        why: Correct — the lecture asks you to think carefully about Hart's big claim rather than just choosing between 'team Hart' and his critics.
      - text: Because only doctrinal answers count in law.
        why: Tempting to a law student, but the question is conceptual; the lecture's warning is against preference, not against theory.
  - key: q616
    type: mcq
    concept: definition-per-genus-et-differentiam
    difficulty: 3
    variant-of: q611
    stem: "A theorist defines law as 'commands of a sovereign, distinguished from other commands by being habitually obeyed'. What structure does this definition have?"
    options:
      - text: A map of the relations between law and other social phenomena.
        why: Tempting because it mentions obedience, a social fact, but its form is a general kind plus a distinguishing feature, not a map.
      - text: A general kind (commands) plus a distinguishing feature (habitual obedience).
        correct: true
        why: Correct — it places law in the genus of commands and marks it off by a differentia, the type of definition the lecture links to Austin.
      - text: An empirical effects claim, because it describes what happens when sovereigns command their subjects.
        why: Tempting because habitual obedience is observable, but the sentence is offered as a definition, not a finding about the effects of commands.
  # true/false
  - key: q617
    type: truefalse
    set: quickfire
    concept: definition-per-genus-et-differentiam
    difficulty: 1
    statement: In the definition of a triangle as a three-sided rectilinear figure, 'three-sided' is the genus.
    answer: false
    why: False — 'rectilinear figure' is the genus, the wider family; 'three-sided' is the differentia that marks triangles off from other rectilinear figures.
  - key: q618
    type: truefalse
    set: quickfire
    concept: definition-per-genus-et-differentiam
    difficulty: 2
    statement: Hart claims that law cannot be defined per genus et differentiam.
    answer: true
    why: True — the lecture says Hart claims this type of definition does not work for law, so he defines law using another method.
  - key: q619
    type: truefalse
    set: quickfire
    concept: definition-per-genus-et-differentiam
    difficulty: 2
    statement: Saying law is impossible to define per genus et differentiam is the same claim as saying there are better definitions of law.
    answer: false
    why: "False — the lecture says these are in fact two different claims: impossibility, and possibility with better definitions available."
  - key: q620
    type: short
    concept: definition-per-genus-et-differentiam
    difficulty: 4
    prompt: "Can law be defined per genus et differentiam? Evaluate Hart's claim that it cannot."
    model: |
      Hart is right that such a definition cannot deliver what the question 'what is law?' asks for, though the stronger
      claim of impossibility is harder to establish. A definition per genus et differentiam gives a general kind plus
      distinguishing features: a triangle is a three-sided rectilinear figure; an elephant a quadruped with thick skin,
      tusks and trunk. It translates the word and locates the thing in a wider family. Austin and Kelsen tried to define
      law this way, placing it with games, etiquette or religion and seeking law's distinguishing features. Hart says the
      method does not work for law. The counterargument is that the lecture separates two claims: that it is impossible,
      and that it is possible but there are better definitions. A critic can reject the first and still accept the
      second. On balance, the borderline cases — primitive and international law — and the need for a map of law's
      relations to coercion, morality and rules suggest the better-definition claim is well supported, while impossibility
      remains open to argument.
    rubric:
      - id: r1
        criterion: Thesis — a clear verdict on Hart's claim, distinguishing its strength.
        marks: 2
        top-band: Commits to a view on both the strong and weak versions of the claim.
        margin-note: Impossible, or just inferior?
        authorities: []
      - id: r2
        criterion: Argument — explains the method with the triangle and elephant examples.
        marks: 3
        top-band: Accurately explains genus, differentia and the two functions of the definition.
        margin-note: What are the genus and differentia here?
        authorities: [hart-the-concept-of-law]
      - id: r3
        criterion: Counterargument — separates impossibility from the better-definition claim.
        marks: 2
        top-band: Uses the lecture's two-claim distinction to put the critics' case at its strongest.
        margin-note: Which of the two claims are you attacking?
        authorities: []
      - id: r4
        criterion: Evaluation — uses borderline cases and the map idea to reach a verdict.
        marks: 3
        top-band: Explains why borderline cases defeat a single genus, and what Hart offers instead.
        margin-note: What does Hart put in its place?
        authorities: []
  # ---- general-and-descriptive-theory ----
  - key: q701
    type: mcq
    concept: general-and-descriptive-theory
    difficulty: 1
    set: pretest
    stem: In the Postscript, what does Hart mean by calling his theory 'descriptive'?
    options:
      - text: That it describes English law in detail.
        why: Tempting because Hart was an English lawyer, but 'descriptive' concerns moral neutrality; not being tied to one system is what 'general' means.
      - text: That it is morally neutral and has no justificatory aims.
        correct: true
        why: Correct — the slide glosses 'descriptive' as morally neutral with no justificatory aims.
      - text: That it describes how law ought to be once its moral purposes are properly understood by officials.
        why: Tempting because descriptions of law's purposes sound neutral, but saying how law ought to be is normative, the opposite of Hart's claim.
  - key: q702
    type: mcq
    concept: general-and-descriptive-theory
    difficulty: 1
    stem: In the Postscript, what does Hart mean by calling his theory 'general'?
    options:
      - text: That it covers every area of law, from contract to crime, in one book.
        why: Tempting because 'general' can mean comprehensive, but Hart means not tied to any particular legal system or legal culture.
      - text: That it is not tied to any particular legal system or legal culture.
        correct: true
        why: Correct — the slide glosses 'general' as not tied to any particular legal system or legal culture.
      - text: That it is general knowledge.
        why: Tempting as a plain-English reading, but Hart's 'general' is a claim about the theory's scope across legal systems, not its accessibility.
  - key: q703
    type: mcq
    concept: general-and-descriptive-theory
    difficulty: 2
    stem: Which concepts does Hart list (CL 240) as tools for carrying out his descriptive enterprise?
    options:
      - text: True human goods, the common good and human rights.
        why: Tempting because these appear on the week 1 slides, but they come from the Finnis quotation, not Hart's list of descriptive tools.
      - text: Duty-imposing and power-conferring rules, rules of recognition and change, and internal and external points of view.
        correct: true
        why: Correct — CL 240 lists these, along with acceptance of rules, internal and external statements, and legal validity.
      - text: Sovereign, command and sanction.
        why: Tempting because they belong to theories Hart discusses, but they are not on his own list of concepts for the descriptive enterprise.
  - key: q704
    type: mcq
    concept: general-and-descriptive-theory
    difficulty: 2
    stem: According to the lecture, how can Hart's claims to generality and descriptiveness be used?
    options:
      - text: As criteria to assess the theory on its own terms.
        correct: true
        why: "Correct — the lecture says the two claims can be used as criteria to assess the theory on its own terms: is it really general, really descriptive?"
      - text: As proof that the theory is correct, since Hart says so himself in the Postscript.
        why: Tempting because the claims come from Hart, but stating an aim does not show it was achieved; the lecture calls both open questions.
      - text: As doctrinal rules that courts must follow when they identify law.
        why: Tempting because Miller used Hart's concepts, but generality and descriptiveness are claims about the theory, not rules for courts.
  - key: q705
    type: mcq
    concept: general-and-descriptive-theory
    difficulty: 3
    contrasts-with: [six-kinds-of-questions]
    stem: "Finnis says the reasonableness of acts of making and complying with law 'cannot be assessed without premises about true human goods'. Which of Hart's claims does this most directly challenge?"
    options:
      - text: That his theory is general.
        why: Tempting because Finnis also claims to speak about law generally, but his target is moral neutrality — the descriptive claim.
      - text: That his theory is descriptive — morally neutral.
        correct: true
        why: Correct — if law cannot be understood without premises about true human goods, a morally neutral theory with no justificatory aims looks incomplete.
      - text: That the rule of recognition identifies the sources of law in the United Kingdom.
        why: Tempting because the rule of recognition is Hart's, but Finnis's quote is about method and ethical premises, not the sources of UK law.
  - key: q706
    type: mcq
    concept: general-and-descriptive-theory
    difficulty: 2
    stem: Which tradition does the lecture place Finnis in?
    options:
      - text: Legal realism, which the unit studies in the second part of semester.
        why: Tempting because the realists are mentioned in the unit outline, but the lecture places Finnis in the natural law tradition.
      - text: The natural law tradition.
        correct: true
        why: Correct — the lecture calls Finnis a natural law thinker, to be studied in week 4 alongside Fuller.
      - text: Sociological jurisprudence in the manner of Julius Stone.
        why: Tempting because Stone is named on a week 1 slide, but Stone is the sociological jurist; Finnis is a natural law thinker.
  - key: q707
    type: mcq
    concept: general-and-descriptive-theory
    difficulty: 3
    stem: Why does the lecture say comparing Finnis and Raz is meaningful even though their theories are very different?
    options:
      - text: Because both studied with Hart and on The Concept of Law, so they share assumptions.
        correct: true
        why: Correct — the lecture says because both studied with Hart and on his book, there are shared assumptions that make the comparison meaningful.
      - text: Because they reached the same conclusion about the nature of law, though by different routes.
        why: Tempting because meaningful comparison suggests agreement, but Finnis is a natural lawyer and Raz a positivist; they disagree.
      - text: Because both rejected analytical jurisprudence.
        why: Tempting because Finnis departs from Hart's aims, but the lecture says Finnis uses Hart's concepts; both work within the tradition.
  - key: q708
    type: mcq
    concept: general-and-descriptive-theory
    difficulty: 3
    stem: Dickson identifies two kinds of challenge to identifying law's nature. Which pair is correct?
    options:
      - text: Doubts that law is ever really obeyed, and doubts that courts apply it consistently across similar cases over time.
        why: Tempting because both are real worries about law, but Dickson's challenges concern whether law has a nature and whether conceptual analysis can find it.
      - text: Doubts that law, a human-made construction, has a nature; and doubts about conceptual analysis as the method.
        correct: true
        why: Correct — Dickson (p 12) reports theorists wary that a human-made social construction can have a nature, and others sceptical of conceptual analysis.
      - text: Doubts about Hart's dates and editions.
        why: Tempting only as trivia, but Dickson's challenges are philosophical — about law's nature and method — not bibliographical.
  - key: q709
    type: mcq
    concept: general-and-descriptive-theory
    difficulty: 2
    stem: How does Dickson describe the task of legal philosophy?
    options:
      - text: As listing the rules of every legal system and comparing them, one by one, to find what they share.
        why: Tempting because generality seems to require comparison, but Dickson speaks of illuminating law's most important and significant features, not listing rules.
      - text: As elucidating law — an active, never-ending process of identifying its most important features.
        correct: true
        why: "Correct — the slide: understanding law by elucidating it; the task is never-ending, and elucidation requires identifying law's most important features."
      - text: As justifying law's authority.
        why: Tempting because the slide mentions authority, but Dickson says understanding law can help us decide whether to take it as authoritative, not that it justifies it.
  - key: q710
    type: mcq
    concept: general-and-descriptive-theory
    difficulty: 4
    contrasts-with: [harts-project]
    stem: Dickson says elucidation requires identifying law's 'most important and significant features'. Why might this put pressure on Hart's descriptive claim?
    options:
      - text: Because deciding which features are important may involve evaluation, even if not moral evaluation.
        correct: true
        why: Correct — selecting important features is a judgment; whether that judgment is compatible with a morally neutral description is the question it raises.
      - text: Because Dickson says law has no features at all.
        why: Tempting because Dickson reports sceptics, but her own view is that legal philosophy identifies law's important features, so law has them.
      - text: Because Dickson argues legal philosophy should be purely empirical and abandon the analysis of concepts altogether.
        why: Tempting because some sceptics doubt conceptual analysis, but Dickson reports those challenges rather than adopting an empirical programme.
  - key: q711
    type: mcq
    concept: general-and-descriptive-theory
    difficulty: 3
    variant-of: q705
    stem: "A theorist says: 'You cannot explain what law is without asking what makes it good for human persons.' Whose view on the slides is this closest to?"
    options:
      - text: Hart's, because he calls his book an essay in descriptive sociology.
        why: Tempting because Hart discusses law as social phenomenon, but his theory is morally neutral with no justificatory aims, the opposite claim.
      - text: Finnis's.
        correct: true
        why: Correct — Finnis says law's reasonableness cannot be assessed without premises about true human goods, and law makes a difference to human persons.
      - text: Twining's, because he wants conceptual analysis extended to empirical legal studies and the social sciences.
        why: Tempting because Twining also criticises Hart, but his point is about widening analysis, not grounding it in human goods.
  - key: q712
    type: mcq
    concept: general-and-descriptive-theory
    difficulty: 3
    stem: A student says 'Hart's theory is general because it is based on English law, the most influential system'. What is wrong with this?
    options:
      - text: Nothing — influence is exactly what 'general' means.
        why: Tempting because influence spreads a system widely, but Hart's 'general' means not tied to any particular system, however influential.
      - text: Being based on one system is what 'general' denies; the theory must not be tied to any legal system or culture.
        correct: true
        why: Correct — generality in Hart's sense is not being tied to any particular legal system or legal culture; basing it on English law would undercut that.
      - text: Hart's theory is based on international law, not English law.
        why: Tempting because international law appears in chapter 1, but Hart treats it as a borderline case, not the base of his theory.
  - key: q713
    type: mcq
    concept: general-and-descriptive-theory
    difficulty: 4
    variant-of: q712
    stem: Twining wants conceptual analysis to serve 'cross-cultural and transnational legal discourse'. How could that be used against Hart's claim to generality?
    options:
      - text: It shows Hart's theory is too descriptive.
        why: Tempting because Twining criticises Hart, but the point about cross-cultural concepts presses on generality, not on moral neutrality.
      - text: If Hart's concepts are drawn from modern state law, they may not travel across cultures — so the theory may not be general.
        correct: true
        why: Correct — if the tools are parochial, the generality is too; Twining's demand for a broader conception makes that challenge available.
      - text: It proves that Hart's rule of recognition was rejected by the UK Supreme Court in Miller, which relied on Kelsen's theory instead.
        why: Tempting because Miller discusses the rule of recognition, but the Court used Hart's concept; Kelsen is the Madzimbamuto example.
  - key: q714
    type: mcq
    concept: general-and-descriptive-theory
    difficulty: 3
    stem: Which statement about Hart's claims to generality and descriptiveness is most accurate to the lecture?
    options:
      - text: Both have been conclusively shown to be false, and are now of historical interest only to jurisprudence scholars.
        why: Tempting because both claims are attacked, but the lecture calls them open questions you should be able to write an essay on.
      - text: They are open questions.
        correct: true
        why: Correct — the lecture asks whether each claim is true and says you cannot answer today, but should be able to write an essay on them in a few weeks.
      - text: Both are obviously true, since Hart wrote them.
        why: Tempting because Hart is the unit's starting point, but the lecture says the book is a tool, not the gospel, and the claims must be assessed.
  - key: q715
    type: mcq
    concept: general-and-descriptive-theory
    difficulty: 2
    contrasts-with: [six-kinds-of-questions]
    stem: A theory that aims to show that the existing legal order is good and should be kept would fail which of Hart's criteria?
    options:
      - text: Descriptiveness, because it has justificatory aims.
        correct: true
        why: Correct — Hart's descriptive theory has no justificatory aims; a theory that defends the status quo is justificatory, a kind of normative theory.
      - text: Generality, because every theory that defends a legal order must be about one particular legal system only.
        why: Tempting because defending an order sounds local, but a justificatory theory could be general; what it lacks is moral neutrality.
      - text: Neither, because Hart's criteria concern only the rule of recognition.
        why: Tempting because the rule of recognition is Hart's best-known concept, but his criteria are generality and descriptiveness.
  - key: q716
    type: mcq
    concept: general-and-descriptive-theory
    difficulty: 3
    stem: "Finnis says law is 'an arena where themes and theses in ethics, political theory, and related philosophical domains' come to bear. For Finnis, what makes legal studies really worthwhile?"
    options:
      - text: Issues of doctrine and interpretation that are resolvable by technique.
        why: Tempting because Finnis grants these have some intellectual appeal, but he says the real attraction lies in law as an arena for ethics and political theory.
      - text: That legislating and adjudicating make a difference to human persons, where ethics and political theory crystallise.
        correct: true
        why: Correct — the quote says legal studies are really attractive because philosophical themes crystallise in legislating and adjudicating that make a difference to persons.
      - text: The chance to avoid ethics.
        why: Tempting to someone who sees law as technical, but Finnis says ethics and political theory all come to bear on law.
  # true/false
  - key: q717
    type: truefalse
    set: quickfire
    concept: general-and-descriptive-theory
    difficulty: 1
    statement: For Hart, a 'descriptive' theory is one that is morally neutral and has no justificatory aims.
    answer: true
    why: True — the slide on Hart and the nature of legal theory glosses 'descriptive' in exactly these terms; 'general' means not tied to any legal system or culture.
  - key: q718
    type: truefalse
    set: quickfire
    concept: general-and-descriptive-theory
    difficulty: 2
    statement: Finnis shares Hart's aim of a morally neutral theory of law.
    answer: false
    why: False — Finnis says the reasonableness of acts of law cannot be assessed without premises about true human goods, which is not at all what Hart tries to do.
  - key: q719
    type: truefalse
    set: quickfire
    concept: general-and-descriptive-theory
    difficulty: 2
    statement: Dickson reports that some theorists doubt conceptual analysis as the method for ascertaining law's nature.
    answer: true
    why: True — Dickson (p 12) says some theorists mount challenges to conceptual analysis, the key method legal philosophers use to ascertain law's nature.
  - key: q720
    type: short
    concept: general-and-descriptive-theory
    difficulty: 4
    prompt: "Can a theory of law be both general and descriptive? Discuss with reference to Hart, Finnis and Dickson."
    model: |
      A theory can plausibly be general and descriptive in aim, but whether Hart's succeeds on both criteria is doubtful.
      In the Postscript Hart claims a theory both general, not tied to any legal system or culture, and descriptive,
      morally neutral with no justificatory aims (CL 239), carried out through concepts such as rules of recognition and
      change and internal and external points of view (CL 240). These claims are criteria to assess the theory on its own
      terms. Finnis offers the strongest counterargument to descriptiveness: making and complying with law involves
      rational judgment that cannot be assessed without premises about true human goods. Dickson adds a subtler pressure:
      elucidation requires identifying law's most important and significant features, and choosing what is important is a
      judgment. Generality faces a separate test: if Hart's paradigm is the legal systems of modern states, his concepts may
      not travel, as Twining's call for cross-cultural concepts suggests. On balance, a theory can avoid moral
      justification yet still involve evaluation, so 'descriptive' should be read narrowly, and generality must be
      earned, not assumed.
    rubric:
      - id: r1
        criterion: Thesis — separates the two criteria and takes a position on each.
        marks: 2
        top-band: A thesis that treats generality and descriptiveness separately.
        margin-note: Which criterion is harder to meet?
        authorities: [hart-the-concept-of-law]
      - id: r2
        criterion: Argument — explains Hart's claims and their role as criteria.
        marks: 2
        top-band: Accurate glosses of both terms with CL 239–240 and the criteria point.
        margin-note: On whose terms is the theory judged?
        authorities: []
      - id: r3
        criterion: Counterargument — Finnis and Dickson at full strength.
        marks: 3
        top-band: Uses Finnis on true human goods and Dickson on important features as distinct objections.
        margin-note: Are Finnis and Dickson making the same objection?
        authorities: [finnis-philosophy-of-law, dickson-elucidating-law]
      - id: r4
        criterion: Evaluation — reasoned verdict distinguishing moral from other evaluation.
        marks: 3
        top-band: Concludes with a precise sense in which the theory can or cannot be descriptive.
        margin-note: Is all evaluation moral evaluation?
        authorities: []

pretest: [q101, q301, q501, q601, q701]

cards:
  - type: basic
    concept: meaning-of-jurisprudence
    front: Name the four meanings of 'jurisprudence' on the week 1 slides.
    back: A body of judicial decisions; jurisprudence in relation to religious law; medical jurisprudence (legal medicine); and, for this unit, legal theory — a general theory of law.
    source: Week 01 Lecture Slides, slides 11–12
  - type: cloze
    concept: meaning-of-jurisprudence
    text: "Iurisprudentia = {{c1::iuris}} (of right, of law) + {{c2::prudentia}} (wisdom, foresight, knowledge)."
    source: Week 01 Lecture Slides, slide 11
  - type: basic
    concept: meaning-of-jurisprudence
    front: General vs particular jurisprudence — what is the difference?
    back: General jurisprudence deals with philosophical puzzles thrown up by all legal systems (what is law?); particular jurisprudence with puzzles that emerge in some systems or traditions but not necessarily all (in what sense is Parliament sovereign?).
    source: Week 01 Lecture Slides, slide 12
  - type: apply
    concept: meaning-of-jurisprudence
    scenario: A classmate plans an essay on 'what is common about the common law?' and calls it a question of general jurisprudence.
    answer: It is particular jurisprudence — the puzzle emerges in common law traditions but not necessarily all systems; general jurisprudence asks puzzles thrown up by all legal systems.
    source: Week 01 Lecture Slides, slide 12
  - type: cloze
    concept: conceptual-analysis
    text: "Conceptual theories generally define terms by {{c1::necessary and sufficient}} conditions."
    source: Week 01 Lecture Slides, slide 13
  - type: basic
    concept: conceptual-analysis
    front: What does Bix say about the boundaries that conceptual theories draw?
    back: They set the boundaries of categories; drawing them can help establish a common ground for investigation and discussion, but the placement of the boundaries is often contested (p 18).
    source: Week 01 Lecture Slides, slide 13
  - type: basic
    concept: conceptual-analysis
    front: What is Twining's 'general thesis' about conceptual analysis (p 39)?
    back: Conceptual analysis has an important part to play in reviving general jurisprudence, but what is needed is a much broader conception of what is involved than those of Hart or Raz or even Stone.
    source: Week 01 Lecture Slides, slide 14
  - type: apply
    concept: conceptual-analysis
    scenario: Two people argue about 'the football' until one says 'I meant soccer', and the argument ends.
    answer: A semantic confusion, not a conceptual disagreement — once usage is clarified they share the same concept, and context (pragmatics) does the rest.
    source: Week 01 Lecture Transcript
  - type: basic
    concept: six-kinds-of-questions
    front: List the six kinds of questions in order.
    back: Doctrinal; normative; empirical; metatheoretical; methodological; conceptual.
    source: Week 01 Lecture Slides, slide 17
  - type: cloze
    concept: six-kinds-of-questions
    text: "Normative claims and theories are either {{c1::justificatory}} or {{c2::critical}}; empirical ones are {{c3::explanatory/causal}} or about {{c4::effects}}."
    source: Week 01 Lecture Slides, slide 17
  - type: basic
    concept: six-kinds-of-questions
    front: What is a metatheoretical question?
    back: One asking what the success criteria for a given theory are — how to pick one theory over another, which is not like picking an ice-cream flavour.
    source: Week 01 Lecture Slides, slide 17; Lecture Transcript
  - type: apply
    concept: six-kinds-of-questions
    scenario: A researcher studies what a new statute actually did to a community, compared with the legislature's intentions.
    answer: An empirical question producing an effects claim — it investigates on the ground the law's effects, which may differ from the policy intended.
    source: Week 01 Lecture Transcript
  - type: basic
    concept: legal-theory-in-the-real-world
    front: Match each case to the theory it drew on — Milirrpum, Madzimbamuto, Miller.
    back: Milirrpum v Nabalco — assumptions from Austin's theory; Madzimbamuto v Lardner-Burke — Kelsen's theory; Miller — Hart's rule of recognition.
    source: Week 01 Lecture Slides, slides 15–16; Lecture Transcript
  - type: cloze
    concept: legal-theory-in-the-real-world
    text: "In the Gove land rights case, Aboriginal claims to land were questioned because the {{c1::customary rules}} of Aboriginal peoples could not be described by the court as {{c2::legal rules}}."
    source: Week 01 Lecture Slides, slide 15
  - type: cloze
    concept: legal-theory-in-the-real-world
    text: "Miller [173]: the rule of recognition is 'the rule which identifies the {{c1::sources of law}} in our legal system and imposes a {{c2::duty}} to give effect to laws emanating from those sources'."
    source: Week 01 Lecture Slides, slide 16
  - type: basic
    concept: legal-theory-in-the-real-world
    front: Gardner's reasons for studying jurisprudence?
    back: It can assist our development as human beings; it contributes to excellence in argument; and it helps us recognise different perspectives and aspects of a legal issue — looking for timeless problems underlying topical ones.
    source: Week 01 Lecture Slides, slide 28
  - type: cloze
    concept: harts-project
    text: "'In law as elsewhere, we can {{c1::know}} and yet not {{c2::understand}}' (Hart, inaugural lecture, {{c3::1953}})."
    source: Week 01 Lecture Slides, slide 18
  - type: basic
    concept: harts-project
    front: Hart's three persistent questions (CL 6)?
    back: 1. How does law differ from and relate to orders backed by threats? 2. How does legal obligation differ from and relate to moral obligation? 3. What are rules and to what extent is law an affair of rules?
    source: Week 01 Lecture Slides, slide 22
  - type: basic
    concept: harts-project
    front: Hart's paradigm cases of law, and his borderline cases?
    back: Paradigm — the legal systems of modern states. Borderline (questionable, challengeable) — primitive law and international law.
    source: Week 01 Lecture Slides, slide 21
  - type: apply
    concept: harts-project
    scenario: A skilled lawyer can win any case but cannot explain how law differs from morality or from orders backed by threats.
    answer: Hart's man in a familiar town — she knows the law but does not understand it; she needs a map exhibiting law's relations to other things (CL 14).
    source: Week 01 Lecture Slides, slide 23
  - type: cloze
    concept: definition-per-genus-et-differentiam
    text: "A definition per genus et differentiam gives a {{c1::general kind}} plus {{c2::distinguishing features}}."
    source: Week 01 Lecture Slides, slide 24
  - type: basic
    concept: definition-per-genus-et-differentiam
    front: What two things does a definition per genus et differentiam do at once?
    back: It provides a code or formula translating the word into other well-understood terms, and locates the kind of thing by the features it shares with a wider family and those that mark it off.
    source: Week 01 Lecture Slides, slide 24
  - type: basic
    concept: definition-per-genus-et-differentiam
    front: What two different claims can be made about defining law per genus et differentiam?
    back: That it is impossible; or that it may be possible but there are better definitions of law. Hart makes the first claim.
    source: Week 01 Lecture Transcript
  - type: apply
    concept: definition-per-genus-et-differentiam
    scenario: A theorist defines law as 'a system of social rules distinguished by organised sanctions'.
    answer: A definition per genus et differentiam (genus — social rules; differentia — organised sanctions), the type Hart says does not work for law.
    source: Week 01 Lecture Slides, slide 24; Lecture Transcript
  - type: basic
    concept: general-and-descriptive-theory
    front: What do 'general' and 'descriptive' mean in Hart's Postscript (CL 239)?
    back: General — not tied to any particular legal system or legal culture. Descriptive — morally neutral, with no justificatory aims.
    source: Week 01 Lecture Slides, slide 25
  - type: cloze
    concept: general-and-descriptive-theory
    text: "Finnis: the reasonableness and justification of acts of law 'cannot be assessed without premises about {{c1::true human goods}}'."
    source: Week 01 Lecture Slides, slide 26
  - type: basic
    concept: general-and-descriptive-theory
    front: What two challenges to identifying law's nature does Dickson report?
    back: Some doubt that a human-made social construction such as law can have a nature; others are sceptical of conceptual analysis as the method.
    source: Week 01 Lecture Slides, slide 27
  - type: apply
    concept: general-and-descriptive-theory
    scenario: A theory argues that the existing legal order is good and should be preserved.
    answer: It has justificatory aims, so it fails Hart's criterion of a descriptive (morally neutral) theory — though it could still be general.
    source: Week 01 Lecture Slides, slides 17, 25
  - type: basic
    concept: general-and-descriptive-theory
    front: How does Dickson describe legal philosophy's task?
    back: Understanding law by elucidating it — illuminating something in our social reality called law; a never-ending, active process of identifying law's most important and significant features.
    source: Week 01 Lecture Slides, slide 30

audio:
  title: Week 1 recap — jurisprudence and the nature of law
  minutes: 3
  script: |
    Week one asks two questions that sound alike but are not: what is the nature of jurisprudence, and what is the
    nature of law? The first is about the theory; the second is about its object. Keep them apart and most essays stay
    on topic.

    The word jurisprudence has several meanings: a body of judicial decisions, religious law, medical jurisprudence. For
    us it means legal theory, a general theory of law. Bix uses jurisprudence, legal theory and legal philosophy
    interchangeably, though Cotterrell thinks they should be distinguished. General jurisprudence deals with puzzles
    thrown up by all legal systems, like what is law, or is there a general obligation to obey it. Particular
    jurisprudence deals with puzzles of some systems only, like in what sense Parliament is sovereign.

    Analytical jurisprudence relies on conceptual analysis, which defines terms by necessary and sufficient conditions.
    Bix says drawing those boundaries builds common ground, but where they go is often contested. Twining keeps the
    method but wants a much broader conception than Hart's or Raz's.

    Then the six kinds of questions: doctrinal, normative, empirical, metatheoretical, methodological and conceptual.
    Normative claims are justificatory or critical; empirical claims are explanatory or about effects; metatheory asks
    for a theory's success criteria.

    Theory is not idle. In Milirrpum, the Gove land rights case, Aboriginal claims were questioned because customary
    rules could not be described as legal rules, an assumption from Austin. Madzimbamuto used Kelsen to consider
    Rhodesia's declaration of independence, and Miller used Hart's rule of recognition.

    Hart's line is that in law, as elsewhere, we can know and yet not understand. Most people can cite examples of law,
    yet the debate never ends, because beside the paradigm cases, modern state legal systems, sit borderline cases such
    as primitive and international law. Hart's three persistent questions are law and orders backed by threats, legal and
    moral obligation, and rules. Lawyers are like someone who can cross a familiar town but cannot give directions; they
    need a map.

    A definition per genus et differentiam, general kind plus distinguishing features, works for triangles and
    elephants, but Hart says it does not work for law. Separate the claim that it is impossible from the claim that
    better definitions exist.

    Finally, Hart claims a theory that is general, tied to no legal system, and descriptive, morally neutral with no
    justificatory aims. Those are criteria to test him on his own terms. Finnis says law cannot be assessed without
    premises about true human goods, and Dickson notes that elucidating law means choosing its most important features.
    Read with curiosity, charity and clarity.
