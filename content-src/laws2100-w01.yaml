week_file:
  topic: Jurisprudence and the nature of law
  summary: |-
    Week 1 asks two connected questions: what is (the nature of) jurisprudence, and what is (the nature of) law? It
    sorts the meanings of "jurisprudence", the split between general and particular jurisprudence, conceptual analysis,
    and six kinds of questions a theory can ask, then opens Hart's The Concept of Law: knowing is not understanding, the
    three persistent questions, why law cannot be defined per genus et differentiam, and Hart's claim to a theory that is
    both general and descriptive. For the essay, the week supplies the vocabulary for telling a claim about jurisprudence
    from a claim about law, and the criteria on which Hart's theory can be judged on its own terms.
  notes: |
    ## Jurisprudence

    The word 'jurisprudence' has more than one meaning. *Iurisprudentia* = *iuris* (of right, of law) + *prudentia*
    (wisdom, foresight, knowledge).

    - Jurisprudence as a body of judicial decisions: consider, for example, the expression 'the constitutional
      jurisprudence of the High Court'.
    - Jurisprudence in relation to religious law (eg Hindu law, Jewish halakha, Christian canon law, Islamic sharia).
    - Medical jurisprudence (legal medicine).

    The lecture does not engage with these uses; they show the complexity of the subject, mirrored in the different
    uses of the term. For our purposes, jurisprudence should be understood as legal theory.

    ## Jurisprudence and legal theory

    Jurisprudence as a general theory of law. Brian Bix uses the terms 'jurisprudence', 'legal theory' and 'legal
    philosophy' interchangeably throughout his textbook (Preface to the ninth edition, p vii). Not everyone agrees: the
    further readings include Roger Cotterrell, 'Why Jurisprudence Is Not Legal Philosophy'.

    - On what basis can we speak of a general theory of law?
    - General jurisprudence as a philosophical inquiry into the nature of law?

    :::definition
    **General jurisprudence** deals with philosophical puzzles that are thrown up by all legal systems (eg what is law?
    what is a legal system? what is legal reasoning? is there a general obligation to obey the law?).
    **Particular jurisprudence** deals with puzzles that emerge in some legal systems or traditions but not necessarily
    all (eg what is common about the common law? in what sense is Parliament sovereign?).
    :::

    This is a very rough distinction, and the two are not completely disconnected; a number of theories use it and make
    different methodological claims about the two areas.

    ## Jurisprudence and conceptual analysis

    - Analytical jurisprudence and analytical philosophy. Hart's *The Concept of Law* (1961) is widely seen as the
      beginning of modern analytical jurisprudence, though the tradition is older (Bentham, Austin). Hart combined it
      with the Oxford philosophy of his time, which focused on the analysis of (ordinary) language.
    - Conceptual analysis has been a key element/method of analytical philosophy.
    - Conceptual theories generally define terms by necessary and sufficient conditions.
    - "…conceptual theories and claims set the boundaries of categories. The drawing of such boundaries can be helpful
      in establishing a common ground for investigation and discussion, but the placement of the boundaries is often
      contested." (Bix, p 18)
    - According to Bix, purely conceptual theories can be contrasted with two different kinds of theories:
      non-conceptual theories in the natural sciences, and non-conceptual theories in the social sciences. Those
      theories use concepts, but they are not conceptual theories.

    When people disagree about a concept, ask what kind of disagreement it is: semantic (about the meaning of a term)
    or conceptual (not sharing the same concept). The lecture's example: 'football' in the UK and in Australia; once I
    say "I meant soccer", we share the concept, and context (pragmatics) does the rest.

    ## According to William Twining (1934–2025)…

    - "…there is a lot of work to be done on usable concepts in cross-cultural and transnational legal discourse and
      that this is a task for analytical jurisprudence" (p 34)
    - "It is part of my general thesis that conceptual analysis has an important part to play in reviving general
      jurisprudence, but that what is needed is a much broader conception of what is involved than those of Hart or Raz
      or even Stone" (p 39)
    - "…conceptual elucidation is as important for social scientific investigation as it is for legal exposition and
      the methods of conceptual analysis developed by analytical philosophy are applicable to important concepts in
      empirical legal studies and the social sciences generally" (p 57)

    Twining pays much more attention to the social side of things, and to the empirical and social sciences, than Hart.
    Stone is Julius Stone, long professor of jurisprudence at Sydney, who defended a sociological jurisprudence.

    ## Legal theory in the real world

    :::case
    *Milirrpum v Nabalco Pty Ltd* [1971] 17 FLR 141 (the Gove land rights case) — an Australian case in which Aboriginal
    claims to land were questioned on the basis that the customary rules of Aboriginal peoples could not be described
    by the court as legal rules. The lecture: the court was buying into assumptions about the nature of law that came
    from Austin's theory, and you cannot fully understand the reasoning in Mabo without it.
    :::

    :::case
    *Madzimbamuto v Lardner-Burke* [1969] 1 AC 645 — a decision of the Judicial Committee of the Privy Council on United
    Kingdom constitutional law and the constitutional law of Rhodesia. The case considers the legality of the Unilateral
    Declaration of Independence made by Rhodesia in 1965, in light of Hans Kelsen's theory of law.
    :::

    :::case
    The *Miller* case — the UK's first case on Brexit (decided by the UK Supreme Court in 2017), considering whether the
    British Government could withdraw from the European Union without an Act of Parliament giving permission to do so.
    The judges used Hart's concept of the rule of recognition: "we would not accept that the so-called fundamental rule
    of recognition (i.e. the fundamental rule by reference to which all other rules are validated) underlying UK laws has
    been varied by the 1972 Act or would be varied by its repeal" [60]; and one argument was "that the UK's withdrawal
    from the EU will alter the UK's rule of recognition: that is to say, the rule which identifies the sources of law in
    our legal system and imposes a duty to give effect to laws emanating from those sources" [173].
    :::

    Concepts developed within theories of law filter through into the real world, and make a difference when officials
    decide on the basis of them. Look for these theories in the rest of your legal studies, and use your legal knowledge
    to put pressure on the theories.

    ## Six kinds of questions

    1. **Doctrinal questions** — eg questions about domestic law (what the law is on a specific issue). Every
       hypothetical is a cluster of doctrinal questions.
    2. **Normative questions** — descriptive vs normative claims (is/ought distinction). Normative: justificatory vs
       critical claims (and theories).
    3. **Empirical questions** — explanatory/causal vs effects claims (and theories).
    4. **Metatheoretical questions** — what are the success criteria for a given theory?
    5. **Methodological questions** — how should we conduct research in this field?
    6. **Conceptual questions** — eg what is a contract? what is law? what is justice?

    Picking one theory over another is not like picking an ice-cream flavour: a metatheoretical question looks for
    criteria to say a theory is superior, at least in respect of X, Y, Z. Some claims in the readings are theoretical,
    others metatheoretical; it matters to see at which level a claim operates.

    ## Jurisprudence and the nature of law

    (1) What is (the nature of) jurisprudence? (2) What is (the nature of) law? These are connected but different
    problems. When you read, ask: is this an argument or claim about jurisprudence — the subject, the theory — or a
    claim about law, about the nature of law?

    :::examtip
    Confusing the two levels is the commonest way to be off topic: an essay about whether law is connected to morality
    answers a question about the nature of law, not one about the nature of jurisprudence.
    :::

    "In law as elsewhere, we can know and yet not understand" (H.L.A. Hart, *Definition and Theory in Jurisprudence: An
    Inaugural Lecture*, 1953). "My aim in this book has been to further the understanding of law, coercion, and morality
    as different but related social phenomena" (H.L.A. Hart, *The Concept of Law*, 6). Remember this and you already
    have a map of the book: its chapters mirror it.

    ## H.L.A. Hart (1907–1992)

    Professor of Jurisprudence at the University of Oxford and Fellow of University College, Oxford (1952–1973 on the
    slide; the lecture said he took the chair in 1951). Inaugural lecture at Oxford: *Definition and Theory in
    Jurisprudence* (1953). *The Concept of Law* (1961; 2nd ed 1994; 3rd ed 2012). The 2nd edition, published after
    Hart's death, adds the unfinished Postscript, largely a response to critics, especially Ronald Dworkin; its curators
    included Joseph Raz. The 3rd edition adds a new introduction by Leslie Green. Use the book as a tool, not the gospel.

    ## Hart's theoretical project

    The purpose of the book "…is not to provide a definition of law, in the sense of a rule by reference to which the
    correctness of the use of the word can be tested; it is to advance legal theory by providing an improved analysis of
    the distinctive structure of a municipal legal system and a better understanding of the resemblances and differences
    between law, coercion, and morality, as types of social phenomena." (CL, 17)

    "Notwithstanding its concern with analysis the book may also be regarded as an essay in descriptive sociology;…"
    (Preface). Whether it really is, and what that means, is debated (see Twining's chapter).

    ## Hart on the question 'What is law?'

    - Unending theoretical debate in books vs the ability of most people to cite examples of law.
    - Consider the "salient features" listed at page 3 of *The Concept of Law*.
    - The question "what is law?" expresses perplexities about the general nature of law.
    - Clear/standard/paradigm cases of law (for Hart, "the legal systems of modern states") vs
      questionable/challengeable/borderline cases (for Hart, "primitive law and international law").
    - Speculation about the nature of law has historically centred on a few principal issues.
    - Confusion about these issues may coexist with a firm knowledge of the law: I can be an expert in Italian contract
      law and still struggle to understand law at the general level.

    ## Three persistent questions

    "We shall distinguish here three [...] recurrent issues, and show later why they come together in the form of a
    request for a definition of law or an answer to the question 'What is law?', or in more obscurely framed questions
    such as 'What is the nature (or the essence) of law?'" (CL, 6)

    1. How does law differ from and how is it related to orders backed by threats? (law and coercion)
    2. How does legal obligation differ from, and how is it related to, moral obligation? (law and morality)
    3. What are rules and to what extent is law an affair of rules? (law, like games and sports, is a rule-based social
       practice — but playing law is not playing chess)

    The rest of the book is organised around these three issues.

    ## Searching for a definition…

    "…even skilled lawyers have felt that, though they know the law, there is much about law and its relations to other
    things that they cannot explain and do not fully understand. Like a man who can get from one point to another in a
    familiar town but cannot explain or show others how to do it, those who press for a definition need a map
    exhibiting clearly the relationships dimly felt to exist between the law they know and other things. Sometimes in
    such cases a definition of a word can supply such a map: at one and the same time it may make explicit the latent
    principle which guides our use of a word, and may exhibit relationships between the type of phenomena to which we
    apply the word and other phenomena." (CL, 14)

    The map has two dimensions: particular law and law as a general idea; and law and the other things we know
    (morality, religion, games, sports, etiquette).

    ## Triangles, elephants, and…law

    - Triangle (def.) = three-sided rectilinear figure.
    - Elephant (def.) = quadruped distinguished from others by its possession of a thick skin, tusks, and trunk.

    :::definition
    These are definitions **per genus et differentiam**: general kind + distinguishing features. This type of
    definition does two things at once: it provides a code or formula translating the word into other well-understood
    terms, and it locates the kind of thing the word refers to, by indicating the features it shares with a wider
    family of things and those which mark it off from others of that same family.
    :::

    Can we define law per genus et differentiam? Some theorists (Austin, Kelsen) tried. Hart says this type of
    definition does not work for law. That is a big claim, and many disagree. There are in fact two different claims:
    one, that it is impossible to define law per genus et differentiam; another, that it may be possible, but there are
    better definitions of law. Hart claims it is not possible, so law must be defined by another method (the end of
    chapter 1; discussed in the week 2 tutorial).

    ## Hart on the nature of legal theory

    "My aim in this book was to provide a theory of what law is which is both general and descriptive." (CL, 239 —
    the Postscript)

    - General in the sense that it is not tied to any particular legal system or legal culture.
    - Descriptive in that it is morally neutral and has no justificatory aims.

    "As a means of carrying out this descriptive enterprise my book makes repeated use of a number of concepts such as
    duty-imposing rules, power-conferring rules, rules of recognition, rules of change, acceptance of rules, internal
    and external points of view, internal and external statements, and legal validity" (CL, 240).

    :::examtip
    These two claims can be used as criteria to assess the theory on its own terms. Is it really general — not tied to
    any particular legal system? Is it really descriptive — morally neutral, with no justificatory aims? Open questions
    you should be able to write an essay on in a few weeks.
    :::

    ## John Finnis on law and philosophy

    "Making, acknowledging, and complying with law involves acts of rational judgment. The reasonableness and
    justification of these acts cannot be assessed without premises about true human goods, the nature of persons and
    their acts, and the contours of the common good and human rights. […] legal studies are really attractive and
    worthwhile because law, and juristic argumentation, is an arena where themes and theses in ethics, political theory,
    and related philosophical domains all come to bear on – and crystallize out in – legislating and adjudicating to make
    a difference to human persons." (J. Finnis, *Philosophy of Law: Collected Essays Volume IV*, OUP, 2011)

    Finnis, a natural law thinker (week 4), connects analytical jurisprudence with a rich understanding of human nature
    and of what we ought to do — not at all what Raz or Hart try to do. Yet he uses concepts Hart developed, which makes
    the comparison meaningful.

    ## Dickson on the problem of the nature of law

    "[…] recent years have seen many thought-provoking challenges emerge which cast doubt on the very possibility of,
    and/or call into question the current manner of engaging in, that part of the philosophy of law which attempts to
    identify and understand law's nature." (J. Dickson, *Elucidating Law*, OUP, 2022, 11–12)

    "Some […] theorists are wary of the idea that a human-made social construction such as law can have a nature which
    legal philosophers can attempt to identify and explain. Others mount challenges in respect of what they regard as the
    key method employed by legal philosophers attempting to ascertain law's nature, namely conceptual analysis…" (p 12)

    ## Gardner on the value of studying jurisprudence

    - As a philosophical subject, jurisprudence can assist in our development as human beings.
    - Two practical implications: jurisprudence contributes to excellence in argument; and it can help us recognise
      different perspectives and different aspects of a given legal issue.
    - "A philosophical education encourages us to look […] for timeless problems underlying topical problems" (John
      Gardner, 'Why study jurisprudence?', p 8).

    ## Leslie Green on legal philosophy

    "Legal philosophy is here to remind you that you are not a slave to your own (legal) head, that there is an escape
    from the 'default setting' of your own little legal system, however profitable and powerful it may be. It will
    explain how something that is true 'legally speaking' may be utterly false. It will show you the difference between
    the way things are around here and the way things ought to be. It may even help you envision the way things could
    well be, if only we cared enough."

    ## Julie Dickson's philosophy of legal philosophy

    Understanding law by elucidating it.

    - The task of legal philosophy is to illuminate and explain aspects of something that exists in our social reality
      and that we call 'law'.
    - Law is a complex phenomenon, and the task of legal philosophy is never-ending.
    - Elucidation is an active process which requires one to identify law's most important and significant features.
    - A proper understanding of law can help us appreciate how law bears upon our practical reasoning — for example, it
      can help us decide if we should take law as having authority over us (the question of week 12: is there an
      obligation to obey the law?).

    ## How to approach this subject…

    **Curiosity** — follow the readings, but also your own questions. **Charity** — make the argument you are reading
    the strongest version of the argument, as Hart does with Austin before trying to knock it down. **Clarity** — even
    when you make a mistake, be clear. Don't memorise theories: use them to develop your own understanding of law.

concepts:
  - slug: meaning-of-jurisprudence
    title: What jurisprudence means — general and particular
    visual: diagram
    visual-brief: The word splits into four uses (body of decisions, religious law, medical jurisprudence, legal theory); the legal-theory branch forks into general jurisprudence (puzzles of all legal systems) and particular jurisprudence (puzzles of some systems), joined by a dotted line because they are not disconnected.
    related: [conceptual-analysis, six-kinds-of-questions]
    depends-on: []
    contrasts-with: [six-kinds-of-questions]
    cases: []
    authorities: [bix-jurisprudence-theory-and-context]
    verify: false
    body: |
      The word 'jurisprudence' has more than one meaning. *Iurisprudentia* = *iuris* (of right, of law) + *prudentia*
      (wisdom, foresight, knowledge). It can mean a body of judicial decisions ('the constitutional jurisprudence of the
      High Court'), jurisprudence in relation to religious law (Hindu law, Jewish halakha, Christian canon law, Islamic
      sharia), or medical jurisprudence (legal medicine). For our purposes, jurisprudence should be understood as legal
      theory — a general theory of law.

      Brian Bix uses 'jurisprudence', 'legal theory' and 'legal philosophy' interchangeably. Others (Cotterrell, 'Why
      Jurisprudence Is Not Legal Philosophy') think they should be distinguished.

      **General jurisprudence** deals with philosophical puzzles thrown up by all legal systems: what is law? what is a
      legal system? what is legal reasoning? is there a general obligation to obey the law? Its object is not the law
      of a particular jurisdiction but law in general — which is why some see it as a philosophical inquiry into the
      nature of law.

      **Particular jurisprudence** deals with puzzles that emerge in some legal systems or traditions but not
      necessarily all: what is common about the common law? in what sense is Parliament sovereign? Where a system has
      no doctrine of parliamentary sovereignty, that question does not really make sense.

      The distinction is rough, and the two are not completely disconnected: we cannot think about law in general
      without our knowledge of specific laws.

      Exam use: say early whether your question is general or particular — it fixes what counts as evidence.

  - slug: conceptual-analysis
    title: Conceptual analysis and analytical jurisprudence
    visual: explainer
    visual-brief: A boundary is drawn around a category by necessary and sufficient conditions; the line is then contested and redrawn, while beside it natural- and social-science theories use concepts without being conceptual theories.
    related: [meaning-of-jurisprudence, harts-project]
    depends-on: [meaning-of-jurisprudence]
    contrasts-with: [six-kinds-of-questions]
    cases: []
    authorities: [bix-jurisprudence-theory-and-context, twining-general-jurisprudence]
    verify: false
    body: |
      Analytical jurisprudence understands jurisprudence as the analysis of general ideas relevant in the legal
      domain; the tradition predates Hart (Bentham, Austin). Hart combined it with the analytical philosophy practised
      at Oxford, which focused on the analysis of ordinary language.

      Conceptual analysis has been a key element/method of analytical philosophy. Conceptual theories generally define terms by necessary and sufficient conditions. Bix: "conceptual
      theories and claims set the boundaries of categories. The drawing of such boundaries can be helpful in
      establishing a common ground for investigation and discussion, but the placement of the boundaries is often
      contested" (p 18).

      According to Bix, purely conceptual theories can be contrasted with non-conceptual theories in the natural
      sciences and non-conceptual theories in the social sciences. Those theories use concepts, but they are not
      conceptual theories.

      When a concept is contested, ask what kind of disagreement it is: semantic (about the meaning of the term) or
      conceptual (not sharing the same concept). 'Football' in the UK versus Australia is easily solved — "I meant
      soccer" — and context does the rest.

      William Twining keeps conceptual analysis but widens it: it "has an important part to play in reviving general
      jurisprudence, but … what is needed is a much broader conception of what is involved than those of Hart or Raz or
      even Stone" (p 39); conceptual elucidation is as important for social scientific investigation as for legal
      exposition (p 57).

      Exam use: Twining is the ready counterargument to treating conceptual analysis as self-sufficient.

  - slug: six-kinds-of-questions
    title: Six kinds of questions
    visual: palace
    visual-brief: Six rooms in order — doctrinal, normative (is/ought; justificatory vs critical), empirical (explanatory vs effects), metatheoretical, methodological, conceptual — each holding one example question; the last three rooms are raised to show they are questions about theories and concepts rather than about a legal system.
    related: [meaning-of-jurisprudence, general-and-descriptive-theory]
    depends-on: [meaning-of-jurisprudence]
    contrasts-with: [conceptual-analysis]
    cases: []
    authorities: [bix-jurisprudence-theory-and-context]
    verify: false
    body: |
      Theories ask different questions; a claim can only be judged once you know which kind it is.

      1. **Doctrinal** — eg questions about domestic law: what the law is on a specific issue. A hypothetical is a
         cluster of doctrinal questions.
      2. **Normative** — descriptive vs normative claims (the is/ought distinction). Normative claims are either
         justificatory (defending the status quo) or critical (criticising it).
      3. **Empirical** — explanatory/causal vs effects claims: why something happens, or what a new statute actually
         does to a community on the ground.
      4. **Metatheoretical** — what are the success criteria for a given theory? Picking one theory over another is not
         like picking an ice-cream flavour: we look for criteria that make a theory superior, at least in some respect.
      5. **Methodological** — how should we conduct research in this field? Settled in the natural sciences, harder in
         the social sciences, even more debatable in philosophy.
      6. **Conceptual** — eg what is a contract? what is law? what is justice?

      Legal philosophers tend to ask conceptual questions, but they also ask the others, and even an empirical inquiry
      needs concepts. The task is to see how the questions relate.

      These map onto two connected but different problems: the nature of jurisprudence (questions 4 and 5 about a
      theory) and the nature of law (the object the theory explains).

      Exam use: label the kind of question in your introduction, and do not answer a normative question with a
      descriptive claim.

  - slug: legal-theory-in-the-real-world
    title: Legal theory in the real world — and why study it
    visual: diagram
    visual-brief: Three theories (Austin, Kelsen, Hart) each send an arrow into a courtroom — Milirrpum, Madzimbamuto, Miller — showing concepts from legal theory filtering back into judicial reasoning; a return arrow shows legal knowledge putting pressure on the theories.
    related: [harts-project, general-and-descriptive-theory]
    depends-on: [meaning-of-jurisprudence]
    contrasts-with: []
    cases: [milirrpum-v-nabalco-pty-ltd, madzimbamuto-v-lardner-burke, r-miller-v-secretary-of-state-for-exiting-the-european-union, mabo-v-queensland-no-2]
    authorities: [gardner-why-study-jurisprudence, green-why-study-jurisprudence]
    verify: false
    body: |
      Legal theory has generated concepts that go back into the world: judges use, more or less explicitly, theories of
      law or their concepts to make sense of a case and decide it.

      - *Milirrpum v Nabalco Pty Ltd* [1971] 17 FLR 141 (the Gove land rights case): Aboriginal claims to land were
        questioned on the basis that the customary rules of Aboriginal peoples could not be described by the court as
        legal rules — assumptions from Austin's theory. You cannot fully understand Mabo without it.
      - *Madzimbamuto v Lardner-Burke* [1969] 1 AC 645: the Privy Council considered the legality of Rhodesia's 1965
        Unilateral Declaration of Independence in light of Hans Kelsen's theory of law.
      - The *Miller* case (UK Supreme Court, 2017), on whether the Government could withdraw from the EU without an Act
        of Parliament, used Hart's rule of recognition — "the rule which identifies the sources of law in our legal
        system" [173].

      Use your legal knowledge to put pressure on the theories.

      Why study it? Gardner: jurisprudence contributes to excellence in argument and helps us recognise different
      perspectives on a legal issue; "a philosophical education encourages us to look … for timeless problems
      underlying topical problems". Green: legal philosophy offers "an escape from the 'default setting' of your own
      little legal system" and shows "the difference between the way things are around here and the way things ought
      to be".

      Exam use: a real case is the quickest proof that a theoretical point matters.

  - slug: harts-project
    title: Hart's project — knowing and understanding
    visual: explainer
    visual-brief: A familiar town — a figure walks from point to point without being able to give directions — then a map is drawn showing the relationships between law and coercion, law and morality, and law and rules, with paradigm cases at the centre and borderline cases at the edge.
    related: [definition-per-genus-et-differentiam, general-and-descriptive-theory]
    depends-on: [conceptual-analysis]
    contrasts-with: [definition-per-genus-et-differentiam]
    cases: []
    authorities: [hart-the-concept-of-law, hart-definition-and-theory-in-jurisprudence]
    verify: false
    body: |
      "In law as elsewhere, we can know and yet not understand" (Hart, inaugural lecture, 1953). Hart's aim in *The
      Concept of Law* is "to further the understanding of law, coercion, and morality as different but related social
      phenomena" (CL 6).

      The purpose is not a definition "by reference to which the correctness of the use of the word can
      be tested", but "an improved analysis of the distinctive structure of a municipal legal system and a better
      understanding of the resemblances and differences between law, coercion, and morality" (CL 17). The book "may also
      be regarded as an essay in descriptive sociology" (Preface).

      Debate in books is unending, yet most people can cite examples of law. "What is law?" expresses perplexities about
      the general nature of law: beside paradigm cases (the legal systems of modern states) sit borderline cases
      (primitive law and international law). Confusion may coexist with a firm knowledge of the law.

      Three persistent questions (CL 6):
      1. How does law differ from and relate to orders backed by threats? (coercion)
      2. How does legal obligation differ from and relate to moral obligation? (morality)
      3. What are rules and to what extent is law an affair of rules? (rules)

      Together they ask for a definition — a map "exhibiting clearly the relationships dimly felt to exist
      between the law they know and other things" (CL 14) — like crossing a familiar town without giving directions.

      Exam use: knowing versus understanding is Hart's measure of what theory adds.

  - slug: definition-per-genus-et-differentiam
    title: Definition per genus et differentiam
    visual: diagram
    visual-brief: Two nested-set diagrams that work (triangle inside rectilinear figures, marked off by three sides; elephant inside quadrupeds, marked off by thick skin, tusks and trunk), then a third for law where the outer set has no agreed boundary and the arrow reads "does not work".
    related: [harts-project]
    depends-on: [conceptual-analysis]
    contrasts-with: [harts-project]
    cases: []
    authorities: [hart-the-concept-of-law]
    verify: false
    body: |
      A definition *per genus et differentiam* gives a general kind plus distinguishing features:

      - Triangle = three-sided rectilinear figure.
      - Elephant = quadruped distinguished from others by its possession of a thick skin, tusks, and trunk.

      It does two things at once: it provides a code or formula translating the word into other well-understood terms,
      and it locates the kind of thing the word refers to, by indicating the features it shares with a wider family of
      things and those which mark it off from others of that family. A good one captures all the essential properties:
      a four-sided shape is not a triangle.

      Some theorists, such as John Austin and Hans Kelsen, tried to define law this way — place law in a broader
      category (with games, social etiquette, religion) and find the features that belong only to law.

      Hart says this type of definition does not work when we are trying to define law. That is a big claim, and many
      disagree. There are in fact two different claims:
      1. it is impossible to define law per genus et differentiam; or
      2. it may be possible, but there are better definitions of law.

      Hart makes the first, stronger claim, so he must define law by another method — the end of chapter 1 of *The
      Concept of Law*.

      Exam use: separate the impossibility claim from the "better definition" claim before agreeing or disagreeing
      with Hart — they need different arguments.

  - slug: general-and-descriptive-theory
    title: A general and descriptive theory — and its challengers
    visual: diagram
    visual-brief: A spectrum of views on what legal philosophy is for — Hart's general and descriptive theory at one end, Dickson's elucidation of law's important features in the middle, Finnis's theory resting on true human goods at the other — with Dickson's sceptics questioning whether law has a nature at all.
    related: [harts-project, six-kinds-of-questions, legal-theory-in-the-real-world]
    depends-on: [harts-project, six-kinds-of-questions]
    contrasts-with: [six-kinds-of-questions]
    cases: []
    authorities: [hart-the-concept-of-law, finnis-philosophy-of-law, dickson-elucidating-law]
    verify: false
    body: |
      In the Postscript Hart says: "My aim in this book was to provide a theory of what law is which is both general
      and descriptive" (CL 239).

      - **General**: not tied to any particular legal system or legal culture.
      - **Descriptive**: morally neutral, with no justificatory aims.

      He carries out this descriptive enterprise with concepts such as duty-imposing and power-conferring rules, rules
      of recognition and change, acceptance of rules, internal and external points of view, and legal validity
      (CL 240). The two claims are criteria to assess the theory on its own terms — a metatheoretical exercise.

      Finnis disagrees about what legal philosophy can be: making, acknowledging and complying with law involves acts
      of rational judgment whose reasonableness "cannot be assessed without premises about true human goods, the nature
      of persons … and the contours of the common good and human rights". For Finnis, a natural law thinker, analysis
      is connected with what we ought to do — not what Hart or Raz try to do.

      Dickson notes challenges to the very possibility of identifying law's nature: some doubt that a human-made social
      construction can have a nature; others doubt conceptual analysis as a method. Her own view: legal philosophy
      elucidates law, an active and never-ending process of identifying law's most important and significant features,
      which can help us decide whether to take law as having authority over us.

      Exam use: test "general" and "descriptive" separately — a theory can pass one criterion and fail the other.

cases:
  - slug: milirrpum-v-nabalco-pty-ltd
    name: Milirrpum v Nabalco Pty Ltd (the Gove land rights case)
    citation: "[1971] 17 FLR 141"
    aglc: Milirrpum v Nabalco Pty Ltd [1971] 17 FLR 141
    facts: |
      The materials describe it only as the Gove land rights case: an Australian case about Aboriginal claims to land.
    issue: |
      Whether Aboriginal claims to land could be recognised, given the question whether the customary rules of
      Aboriginal peoples could be described by the court as legal rules.
    held: |
      Aboriginal claims to land were questioned on the basis that the customary rules of Aboriginal peoples could not be
      described by the court as legal rules. The materials do not give the orders.
    ratio: |
      Not stated in the materials. The lecture's point is that the court was buying into assumptions about the nature of
      law that came from Austin's theory of law.
    significance: |
      An example of legal theory in the real world: an understanding of the nature of law filtered into judicial
      reasoning and made a difference. The lecture says you cannot fully understand the reasoning in Mabo without it.
    why-here: Used to show that a theory of what law is (here, Austin's) can decide whether a people's rules count as law in court.
    verify: true
  - slug: madzimbamuto-v-lardner-burke
    name: Madzimbamuto v Lardner-Burke
    citation: "[1969] 1 AC 645"
    aglc: Madzimbamuto v Lardner-Burke [1969] 1 AC 645
    facts: |
      Rhodesia made a Unilateral Declaration of Independence in 1965. The materials give no further facts.
    issue: |
      The legality of the Unilateral Declaration of Independence made by Rhodesia in 1965, as a matter of United Kingdom
      constitutional law and the constitutional law of Rhodesia.
    held: |
      The materials do not state the outcome; they say the Judicial Committee of the Privy Council considered the
      legality of the declaration in light of Hans Kelsen's theory of law.
    ratio: |
      Not stated in the materials.
    significance: |
      A court explicitly reasoning with a general theory of law (Kelsen's) to decide a question about the legality of a
      new regime.
    why-here: Used to show a court applying a named legal theorist's theory to a live constitutional crisis.
    verify: true
  - slug: r-miller-v-secretary-of-state-for-exiting-the-european-union
    name: R (Miller) v Secretary of State for Exiting the European Union (the Miller case)
    citation: "[2017] UKSC 5"
    aglc: R (Miller) v Secretary of State for Exiting the European Union [2017] UKSC 5
    facts: |
      The UK's first case on Brexit, decided by the UK Supreme Court in 2017.
    issue: |
      Whether the British Government could withdraw from the European Union without an Act of Parliament giving
      permission to do so.
    held: |
      The materials do not state the outcome. They quote the Court: "we would not accept that the so-called fundamental
      rule of recognition (i.e. the fundamental rule by reference to which all other rules are validated) underlying UK
      laws has been varied by the 1972 Act or would be varied by its repeal" [60].
    ratio: |
      Not stated in the materials. At [173] the Court records the argument "that the UK's withdrawal from the EU will
      alter the UK's rule of recognition: that is to say, the rule which identifies the sources of law in our legal system
      and imposes a duty to give effect to laws emanating from those sources".
    significance: |
      Judges framing a constitutional problem in light of the rule of recognition, a concept introduced by H.L.A. Hart in
      The Concept of Law.
    why-here: Used to show a concept from Hart's theory (the rule of recognition) doing work in a modern apex court.
    verify: true

authorities:
  - slug: hart-the-concept-of-law
    title: H.L.A. Hart, The Concept of Law (1961; 2nd ed 1994; 3rd ed 2012)
    kind: other
    text: |
      "My aim in this book has been to further the understanding of law, coercion, and morality as different but related
      social phenomena." (CL 6) "My aim in this book was to provide a theory of what law is which is both general and
      descriptive." (CL 239)
    gloss: The book the unit starts from; it analyses law through its relations to coercion, morality and rules, and claims to be general and descriptive.
    cases: [r-miller-v-secretary-of-state-for-exiting-the-european-union]
    verify: false
  - slug: hart-definition-and-theory-in-jurisprudence
    title: H.L.A. Hart, Definition and Theory in Jurisprudence — An Inaugural Lecture (1953)
    kind: other
    text: |
      "In law as elsewhere, we can know and yet not understand."
    gloss: Hart's Oxford inaugural lecture, which outlined a new research project for jurisprudence.
    cases: []
    verify: false
  - slug: bix-jurisprudence-theory-and-context
    title: Brian Bix, Jurisprudence — Theory and Context (9th ed)
    kind: other
    text: |
      "…conceptual theories and claims set the boundaries of categories. The drawing of such boundaries can be helpful in
      establishing a common ground for investigation and discussion, but the placement of the boundaries is often
      contested." (p 18)
    gloss: The unit textbook; it uses jurisprudence, legal theory and legal philosophy interchangeably and contrasts conceptual with non-conceptual theories.
    cases: []
    verify: false
  - slug: twining-general-jurisprudence
    title: William Twining, General Jurisprudence
    kind: other
    text: |
      "It is part of my general thesis that conceptual analysis has an important part to play in reviving general
      jurisprudence, but that what is needed is a much broader conception of what is involved than those of Hart or Raz
      or even Stone" (p 39)
    gloss: Twining keeps conceptual analysis but widens it to cross-cultural legal discourse and the social sciences.
    cases: []
    verify: true
  - slug: finnis-philosophy-of-law
    title: John Finnis, Philosophy of Law — Collected Essays Volume IV (2011)
    kind: other
    text: |
      "Making, acknowledging, and complying with law involves acts of rational judgment. The reasonableness and
      justification of these acts cannot be assessed without premises about true human goods, the nature of persons and
      their acts, and the contours of the common good and human rights."
    gloss: Finnis ties the study of law to ethics and political theory, so legal philosophy cannot be morally neutral.
    cases: []
    verify: false
  - slug: dickson-elucidating-law
    title: Julie Dickson, Elucidating Law (2022)
    kind: other
    text: |
      "[…] recent years have seen many thought-provoking challenges emerge which cast doubt on the very possibility of,
      and/or call into question the current manner of engaging in, that part of the philosophy of law which attempts to
      identify and understand law's nature." (11–12)
    gloss: Dickson defends legal philosophy as the never-ending, active elucidation of law's most important and significant features.
    cases: []
    verify: false
  - slug: gardner-why-study-jurisprudence
    title: John Gardner, 'Why study jurisprudence?'
    kind: other
    text: |
      "A philosophical education encourages us to look […] for timeless problems underlying topical problems" (p 8)
    gloss: Jurisprudence helps us develop as human beings, argue excellently and see different perspectives on a legal issue.
    cases: []
    verify: false
  - slug: green-why-study-jurisprudence
    title: Leslie Green, Semper Viridis blog (30 August 2020)
    kind: other
    text: |
      "Legal philosophy is here to remind you that you are not a slave to your own (legal) head, that there is an escape
      from the 'default setting' of your own little legal system, however profitable and powerful it may be."
    gloss: Legal philosophy shows how something true 'legally speaking' may be false, and the gap between how things are and how they ought to be.
    cases: []
    verify: false

questions:
  # ---- meaning-of-jurisprudence ----
  - key: q101
    type: mcq
    concept: meaning-of-jurisprudence
    difficulty: 1
    set: pretest
    stem: Which question belongs to particular jurisprudence rather than general jurisprudence?
    options:
      - text: Is there a general obligation to obey the law?
        why: Tempting because it sounds like a question about one's own duties at home, but the slides list it as a general puzzle thrown up by all legal systems.
      - text: In what sense is Parliament sovereign over other bodies?
        correct: true
        why: Correct — it only makes sense in systems with a doctrine of parliamentary sovereignty, so it emerges in some legal systems but not necessarily all.
      - text: What is legal reasoning, and how does it differ from other reasoning?
        why: Tempting because legal reasoning is taught through a particular system, but 'what is legal reasoning?' is on the slide's list of general puzzles.
      - text: What is a legal system, as opposed to a set of unrelated laws?
        why: Tempting because we meet legal systems one at a time, but what a legal system is counts as a general question asked of law in general.
  - key: q102
    type: mcq
    concept: meaning-of-jurisprudence
    difficulty: 1
    stem: A law report says 'the constitutional jurisprudence of the High Court has shifted'. In which sense is 'jurisprudence' used?
    options:
      - text: As legal theory, the sense used for this unit.
        why: Tempting because that is the unit's sense, but the phrase points to what the High Court has decided, not to a theory of law in general.
      - text: As a body of judicial decisions.
        correct: true
        why: Correct — the slides give exactly this expression as the example of jurisprudence meaning a body of judicial decisions.
      - text: As legal medicine, applying medical knowledge to law.
        why: Tempting only because it is another listed meaning, but medical jurisprudence is legal medicine and has nothing to do with the High Court's decisions.
  - key: q103
    type: mcq
    concept: meaning-of-jurisprudence
    difficulty: 1
    stem: What does the Latin 'iurisprudentia' combine, according to the slides?
    options:
      - text: Iuris (of right, of law) and prudentia (wisdom, foresight, knowledge).
        correct: true
        why: Correct — the slide breaks the word into iuris, of right or of law, and prudentia, wisdom, foresight or knowledge.
      - text: Ius (a court) and prudentia (a rule or command laid down by a sovereign).
        why: Tempting because courts and commands feature in legal theory, but the slide translates iuris as of right or of law and prudentia as wisdom.
      - text: Iuris (of judges) and prudentia (the careful weighing of precedent).
        why: Tempting because the 'body of decisions' sense involves judges, but the etymology on the slide is about right or law combined with wisdom or knowledge.
  - key: q104
    type: mcq
    concept: meaning-of-jurisprudence
    difficulty: 2
    stem: How does Brian Bix use the terms 'jurisprudence', 'legal theory' and 'legal philosophy'?
    options:
      - text: He treats legal philosophy as one branch of jurisprudence, distinct from legal theory.
        why: Tempting because some theorists do separate the terms, but the slide says Bix uses all three interchangeably throughout his textbook.
      - text: Interchangeably, throughout his textbook.
        correct: true
        why: Correct — the slide cites the Preface to the ninth edition, p vii, for Bix using the three terms interchangeably.
      - text: He reserves 'jurisprudence' for bodies of judicial decisions and 'legal theory' for the rest.
        why: Tempting because 'jurisprudence' does have that judicial sense, but Bix does not split the terms; he uses them as having the same meaning.
      - text: He argues, like Cotterrell, that jurisprudence is not legal philosophy.
        why: Tempting because Cotterrell's article is in the further readings, but it is set precisely because it disagrees with people like Bix.
  - key: q105
    type: mcq
    concept: meaning-of-jurisprudence
    difficulty: 2
    contrasts-with: [six-kinds-of-questions]
    stem: A student says 'general jurisprudence is just doctrinal law at a high level of abstraction, since it studies the law of all jurisdictions at once'. What is the best correction?
    options:
      - text: General jurisprudence studies the law of Australia first and then generalises from it to every other legal system in the world.
        why: Tempting because we do rely on the law we know, but the object of general jurisprudence is law in general, not one jurisdiction scaled up.
      - text: General jurisprudence asks philosophical questions about law in general, such as what law is, not what the law is on an issue.
        correct: true
        why: Correct — doctrinal questions ask what the law is on a specific issue in a jurisdiction; general jurisprudence asks puzzles thrown up by all legal systems.
      - text: General jurisprudence is comparative law, which compares rules across different jurisdictions.
        why: Tempting because comparative law also looks beyond one system, but comparing rules is still doctrinal; the lecture treats general jurisprudence as philosophical inquiry.
  - key: q106
    type: mcq
    concept: meaning-of-jurisprudence
    difficulty: 2
    stem: Why does the lecture say the question 'in what sense is Parliament sovereign?' does not really make sense in some systems?
    options:
      - text: Because it is a normative question, and some systems forbid normative questions about their constitution or its history.
        why: Tempting because sovereignty can be argued about normatively, but the reason given is structural, not a prohibition on asking normative questions.
      - text: Because those systems have no doctrine of parliamentary sovereignty and a different constitutional architecture.
        correct: true
        why: Correct — the lecture says where that doctrine is not present and there is a different constitutional architecture, the question does not really make sense.
      - text: Because sovereignty is a question for international law, not for any domestic legal system at all.
        why: Tempting because sovereignty is central to international law, but the question here is about Parliament within some domestic systems.
  - key: q107
    type: mcq
    concept: meaning-of-jurisprudence
    difficulty: 2
    stem: Which statement best captures the relationship between general and particular jurisprudence in the lecture?
    options:
      - text: They are sealed off from each other, because general jurisprudence uses no examples from any legal system.
        why: Tempting because general jurisprudence is about law in general, but the lecture says we cannot think about law in general without knowledge of specific laws.
      - text: Particular jurisprudence is the only rigorous part; general jurisprudence is speculation without an object.
        why: Tempting to a sceptic, but the lecture presents general jurisprudence as having an object — law in general — and does not rank the two.
      - text: The distinction is rough, and the two are not completely disconnected.
        correct: true
        why: Correct — the lecture calls it a very rough distinction that works for now, and says the two are not completely disconnected.
  - key: q108
    type: mcq
    concept: meaning-of-jurisprudence
    difficulty: 3
    stem: The lecture points out that the Romans had laws different from those of New South Wales, yet we use 'the same concept'. What is this used to show?
    options:
      - text: That Roman law is the source of NSW law, so the two are one legal system.
        why: Tempting because Roman law influenced later systems, but the point is not about historical sources; it is about sharing one concept across different laws.
      - text: That the object of a general theory of law is law in general, not the law of a particular country.
        correct: true
        why: Correct — the example shows we apply one concept of law across very different systems, which is what a general theory tries to explain.
      - text: That there can be no general theory of law, because laws differ so much from place to place.
        why: Tempting because the differences are real, but the lecture uses the shared concept to explain what a general theory aims at, not to deny it.
      - text: That doctrinal questions are the same in every legal system once translated from Latin.
        why: Tempting because of the Latin etymology earlier, but doctrinal answers differ by jurisdiction; the shared thing is the concept, not the doctrine.
  - key: q109
    type: mcq
    concept: meaning-of-jurisprudence
    difficulty: 2
    variant-of: q101
    stem: Which of these is a question of general jurisprudence?
    options:
      - text: What is common about the common law?
        why: Tempting because 'common' sounds universal, but the slides give it as a puzzle of particular jurisprudence, arising only in common law traditions.
      - text: In what sense is the Westminster Parliament sovereign over the courts?
        why: Tempting because sovereignty is a big theoretical idea, but parliamentary sovereignty arises only in some systems, so it is particular jurisprudence.
      - text: Is there a general obligation to obey the law?
        correct: true
        why: Correct — the slides list it among the philosophical puzzles thrown up by all legal systems, the domain of general jurisprudence.
  - key: q110
    type: mcq
    concept: meaning-of-jurisprudence
    difficulty: 1
    stem: Which is NOT listed on the slides as a meaning of 'jurisprudence'?
    options:
      - text: Jurisprudence in relation to religious law.
        why: Tempting to rule out because religion seems far from law school, but the slide lists religious law, such as Jewish halakha and Islamic sharia.
      - text: Medical jurisprudence, or legal medicine.
        why: Tempting to rule out because it sounds unusual, but medical jurisprudence (legal medicine) is on the slide's list of meanings.
      - text: The rules of procedure that govern a particular court's hearings.
        correct: true
        why: Correct — court procedure is not one of the listed meanings; the slide gives judicial decisions, religious law, medical jurisprudence and legal theory.
      - text: A body of judicial decisions.
        why: Tempting to rule out because it is not the unit's sense, but it is the first listed use, as in 'the constitutional jurisprudence of the High Court'.
  - key: q111
    type: mcq
    concept: meaning-of-jurisprudence
    difficulty: 3
    stem: Why does the lecturer set Cotterrell's 'Why Jurisprudence Is Not Legal Philosophy' in the week 1 further readings?
    options:
      - text: To show that some theorists think jurisprudence and legal philosophy should be distinguished, unlike Bix.
        correct: true
        why: Correct — the lecture says some people understand jurisprudence as legal philosophy, like Bix, while other theorists think that should not be the case.
      - text: To show that jurisprudence is really a body of judicial decisions rather than theory.
        why: Tempting because that is another meaning of the word, but the article is about jurisprudence versus legal philosophy, not about case law.
      - text: To confirm Bix's view that the three terms have exactly the same meaning.
        why: Tempting because both are set readings, but the article is chosen because it takes the opposite view to Bix's interchangeable usage.
  - key: q112
    type: mcq
    concept: meaning-of-jurisprudence
    difficulty: 3
    variant-of: q105
    stem: A tutor says 'a general theory of law is impossible — we only ever study Australian law, or other particular systems'. Which reply best fits the lecture?
    options:
      - text: Agree, because Bix concludes that jurisprudence must be particular.
        why: Tempting because Bix raises whether a general theory is possible, but he treats it as a question to discuss, and the lecture does not report such a conclusion.
      - text: Disagree — we study law in particular contexts, but we share an understanding of law even before university, and a general theory tries to explain that.
        correct: true
        why: Correct — the lecture accepts we study law in specific contexts, yet notes we all share a concept of law, and a general theory aims at that shared object.
      - text: Disagree, because comparative law already gives us a complete general theory of law.
        why: Tempting because comparative law looks across systems, but the lecture treats comparison as another particular study, not a general theory of law.
  - key: q113
    type: mcq
    concept: meaning-of-jurisprudence
    difficulty: 2
    stem: Which pair correctly matches each question to its type of jurisprudence?
    options:
      - text: "'What is law?' — particular; 'what is common about the common law?' — general."
        why: Tempting if 'common' is read as universal, but the pairing is reversed; 'what is law?' is the central general question.
      - text: "'What is law?' — general; 'what is common about the common law?' — particular."
        correct: true
        why: Correct — 'what is law?' is thrown up by all systems; the common law question arises only in common law traditions.
      - text: Both are general, because both ask 'what is' questions.
        why: Tempting because both are phrased the same way, but the test is whether the puzzle arises in all systems or only some, not the grammar.
      - text: Both are particular, because both are asked by lawyers trained in one system.
        why: Tempting because questions are always asked from somewhere, but the distinction turns on where the puzzle arises, not on who asks it.
  - key: q114
    type: mcq
    concept: meaning-of-jurisprudence
    difficulty: 3
    stem: Some universities call a law degree a 'BA of jurisprudence'. Which sense of the word is closest to this use?
    options:
      - text: Jurisprudence as a body of judicial decisions of one court.
        why: Tempting because degrees study cases, but the degree name refers to law as a whole, not to one court's decisions.
      - text: Jurisprudence as a general, philosophical theory of the nature of law.
        why: Tempting because that is this unit's sense, but a degree in law covers much more than legal theory; the lecture treats this as a broader use.
      - text: Jurisprudence capturing the idea of law in a very general sense, close to its root meaning of knowledge of law.
        correct: true
        why: Correct — the lecture says going back to iurisprudentia, the word is sometimes used just to capture law in a very general sense, hence such degree names.
  - key: q115
    type: mcq
    concept: meaning-of-jurisprudence
    difficulty: 4
    contrasts-with: [six-kinds-of-questions]
    stem: An essay asks 'Is there a general obligation to obey the law?'. A student answers by setting out when NSW statutes make disobedience an offence. What has gone wrong?
    options:
      - text: Nothing — offences show exactly when there is an obligation to obey.
        why: Tempting because offences do create legal duties, but that answers what NSW law requires, not the general philosophical question asked of all legal systems.
      - text: They answered a particular, doctrinal question instead of a general one.
        correct: true
        why: Correct — the slides list the obligation to obey as a puzzle of general jurisprudence; a survey of NSW offences is doctrinal and particular.
      - text: They should have answered using international law, since the question is general.
        why: Tempting because international law seems more general, but it is itself a particular body of law; the question asks about law in general.
  - key: q116
    type: mcq
    concept: meaning-of-jurisprudence
    difficulty: 2
    stem: For the purposes of this unit, how should 'jurisprudence' be understood?
    options:
      - text: As legal theory — a general theory of law.
        correct: true
        why: Correct — the lecture says that for our purposes jurisprudence should be understood as legal theory, and the slide heads this 'jurisprudence as a general theory of law'.
      - text: As the case law of the courts studied in other units, read for its principles.
        why: Tempting because other units call case law jurisprudence, but the lecture sets that meaning aside and adopts legal theory for this unit.
      - text: As the religious and customary laws of different traditions, compared side by side.
        why: Tempting because religious law is a listed meaning, but the lecture says the unit will not engage with that use of the term.
  # true/false
  - key: q117
    type: truefalse
    set: quickfire
    concept: meaning-of-jurisprudence
    difficulty: 1
    statement: Brian Bix uses 'jurisprudence', 'legal theory' and 'legal philosophy' interchangeably.
    answer: true
    why: True — the slide cites the Preface to the ninth edition of Bix's textbook for his use of the three terms interchangeably throughout.
  - key: q118
    type: truefalse
    set: quickfire
    concept: meaning-of-jurisprudence
    difficulty: 1
    statement: '"What is common about the common law?" is a question of general jurisprudence.'
    answer: false
    why: False — it arises only in common law traditions, so the slides class it as particular jurisprudence, alongside parliamentary sovereignty.
  - key: q119
    type: truefalse
    set: quickfire
    concept: meaning-of-jurisprudence
    difficulty: 2
    statement: The lecture says general and particular jurisprudence are completely disconnected.
    answer: false
    why: False — the lecture calls the distinction very rough and says the two are not completely disconnected; general theory draws on knowledge of particular laws.
  - key: q120
    type: short
    concept: meaning-of-jurisprudence
    difficulty: 3
    prompt: "'Jurisprudence is just the law of one's own legal system, studied at a higher level of generality.' Discuss, with reference to the distinction between general and particular jurisprudence."
    model: |
      The statement is wrong about the object of jurisprudence, though right that theory starts from particular law.
      Understood as legal theory, general jurisprudence deals with philosophical puzzles thrown up by all legal systems:
      what is law, what is a legal system, what is legal reasoning, is there a general obligation to obey the law? Its
      object is law in general, not the law of a jurisdiction: the Romans had laws unlike those of New South Wales, yet
      we use the same concept of law for both. Particular jurisprudence, by contrast, asks puzzles that arise in some
      systems only, such as what is common about the common law or in what sense Parliament is sovereign. The
      counterargument has force: we study law in specific contexts, and we cannot think about law in general without our
      knowledge of specific laws, so the two are not completely disconnected. But that shows a dependence of evidence,
      not an identity of question. On balance, jurisprudence uses one's own system as a starting point, not as its
      subject, and an answer about NSW doctrine answers a different question.
    rubric:
      - id: r1
        criterion: Thesis — takes a clear position on whether jurisprudence is one's own law generalised.
        marks: 2
        top-band: States a qualified thesis in the first sentence and keeps to it.
        margin-note: What is your answer to the question?
        authorities: []
      - id: r2
        criterion: Argument — defines general and particular jurisprudence with the slides' examples.
        marks: 3
        top-band: Gives both definitions with examples of each and explains why law in general is the object.
        margin-note: Which puzzles arise in all systems, and which only in some?
        authorities: [bix-jurisprudence-theory-and-context]
      - id: r3
        criterion: Counterargument — states the strongest case for the proposition charitably.
        marks: 2
        top-band: Uses the lecture's point that we cannot think about law in general without particular laws.
        margin-note: Put the other side at its strongest before replying.
        authorities: []
      - id: r4
        criterion: Evaluation — weighs the two and reaches a reasoned conclusion.
        marks: 2
        top-band: Distinguishes evidence from object and explains why that settles the question.
        margin-note: Why does your conclusion survive the objection?
        authorities: []
  # ---- conceptual-analysis ----
  - key: q201
    type: mcq
    concept: conceptual-analysis
    difficulty: 1
    stem: How do conceptual theories generally define terms, according to the slides?
    options:
      - text: By necessary and sufficient conditions.
        correct: true
        why: Correct — the slide states that conceptual theories generally define terms by necessary and sufficient conditions, which set the boundaries of a category.
      - text: By surveying how often people use the word in ordinary speech and adopting the majority usage.
        why: Tempting because Hart's Oxford philosophy analysed ordinary language, but conceptual theories define by conditions, not by counting usage.
      - text: By measuring the causes and effects of the thing the term refers to in society.
        why: Tempting because social science studies causes and effects, but that describes empirical, non-conceptual theories rather than conceptual ones.
  - key: q202
    type: mcq
    concept: conceptual-analysis
    difficulty: 2
    stem: "Bix says conceptual theories 'set the boundaries of categories'. What further point does he make about those boundaries?"
    options:
      - text: Once drawn correctly, they are fixed and cannot reasonably be disputed.
        why: Tempting because definitions sound final, but Bix says the placement of the boundaries is often contested.
      - text: Drawing them can establish common ground for discussion, but their placement is often contested.
        correct: true
        why: Correct — Bix (p 18) says drawing boundaries can help establish common ground for investigation and discussion, but where they go is often contested.
      - text: They are useful only in the natural sciences, where categories are given by nature rather than drawn by theorists.
        why: Tempting because natural kinds seem easier to bound, but Bix contrasts conceptual theories with natural-science theories; he does not confine them there.
  - key: q203
    type: mcq
    concept: conceptual-analysis
    difficulty: 2
    stem: According to Bix, purely conceptual theories can be contrasted with which two kinds of theories?
    options:
      - text: Normative theories and doctrinal theories of a particular jurisdiction's law.
        why: Tempting because both appear among the six kinds of questions, but Bix's contrast on this slide is with the natural and the social sciences.
      - text: Natural law theories and positivist theories of law, as rival conceptual accounts.
        why: Tempting because those schools appear later in the unit, but both offer conceptual claims; they are not Bix's contrast class here.
      - text: Non-conceptual theories in the natural sciences, and non-conceptual theories in the social sciences.
        correct: true
        why: "Correct — the slide lists exactly these two: non-conceptual theories in the natural sciences and non-conceptual theories in the social sciences."
  - key: q204
    type: mcq
    concept: conceptual-analysis
    difficulty: 3
    contrasts-with: [six-kinds-of-questions]
    stem: A psychologist builds a theory of why people comply with parking fines. It uses the concept 'fine'. Is it a conceptual theory in Bix's sense?
    options:
      - text: Yes, because any theory that uses a concept is, for that reason alone, a conceptual theory.
        why: Tempting because the theory does rely on concepts, but the lecture says such theories use concepts yet are not conceptual theories.
      - text: No — it uses concepts, but it is a non-conceptual theory in the social sciences.
        correct: true
        why: Correct — theories in the social sciences use concepts but are not conceptual theories; this one explains causes of compliance, an empirical question.
      - text: Yes, because psychology is a branch of analytical philosophy.
        why: Tempting because both are academic disciplines about people, but the lecture places psychological theories among empirical social sciences.
      - text: No, because conceptual theories may only be about law itself.
        why: Tempting because this unit analyses the concept of law, but the six kinds of questions show concepts like contract and justice are analysed too.
  - key: q205
    type: mcq
    concept: conceptual-analysis
    difficulty: 2
    stem: What did Hart combine in The Concept of Law, according to the lecture?
    options:
      - text: Sociological jurisprudence with the empirical methods of the social sciences, as Julius Stone had done at Sydney.
        why: Tempting because the Preface mentions descriptive sociology, but Stone's sociological jurisprudence is set against the Oxford approach in the lecture.
      - text: The tradition of analytical jurisprudence with the Oxford analytical philosophy focused on ordinary language.
        correct: true
        why: Correct — the lecture says Hart combined the older analytical jurisprudence with the Oxford philosophy of his time, which analysed ordinary language.
      - text: The natural law tradition with the ethical premises about human goods later defended by Finnis.
        why: Tempting because Finnis studied with Hart, but the lecture says Finnis's rich ethical understanding is not at all what Hart tried to do.
  - key: q206
    type: mcq
    concept: conceptual-analysis
    difficulty: 2
    stem: Which pair of theorists does the lecture name as writing in the analytical tradition well before Hart?
    options:
      - text: Austin and Bentham.
        correct: true
        why: Correct — the lecture names Austin and Bentham as theorists who wrote well before Hart within the tradition of analytical jurisprudence.
      - text: Finnis and Raz, his Oxford students.
        why: Tempting because both studied with Hart at Oxford, but they wrote after him, so they cannot be his predecessors in the tradition.
      - text: Dickson and Twining, commenting on Hart.
        why: Tempting because both write about Hart's method, but they are later commentators, not the earlier analytical jurists the lecture names.
  - key: q207
    type: mcq
    concept: conceptual-analysis
    difficulty: 3
    stem: "Twining says conceptual analysis has 'an important part to play in reviving general jurisprudence'. What is his qualification?"
    options:
      - text: That it should be abandoned for purely empirical legal studies.
        why: Tempting because Twining values the social sciences, but he keeps conceptual analysis and wants it widened, not abandoned.
      - text: That only Hart's version of it is legitimate, and the rest should be dropped from general jurisprudence.
        why: Tempting because Hart dominates the week, but Twining says what is needed is a much broader conception than Hart's or Raz's or even Stone's.
      - text: That what is needed is a much broader conception of it than those of Hart or Raz or even Stone.
        correct: true
        why: "Correct — this is the p 39 quote: conceptual analysis matters, but a much broader conception of what it involves is needed."
      - text: That it can revive general jurisprudence only for common law systems like England's.
        why: Tempting because Twining studied at Oxford, but he calls for usable concepts in cross-cultural and transnational legal discourse, not common law only.
  - key: q208
    type: mcq
    concept: conceptual-analysis
    difficulty: 2
    stem: For Twining, where else do the methods of conceptual analysis apply beyond legal exposition?
    options:
      - text: Only to international law, where concepts are least settled and most in need of clarification.
        why: Tempting because Twining speaks of transnational discourse, but his p 57 claim reaches empirical legal studies and the social sciences generally.
      - text: To important concepts in empirical legal studies and the social sciences generally.
        correct: true
        why: Correct — at p 57 Twining says conceptual elucidation is as important for social scientific investigation as for legal exposition.
      - text: Nowhere else — conceptual analysis belongs only to legal exposition of doctrine.
        why: Tempting to someone who sees analysis as a lawyer's tool, but Twining's point is exactly that it extends to the social sciences.
  - key: q209
    type: mcq
    concept: conceptual-analysis
    difficulty: 3
    stem: Two friends argue about whether they watched 'the football'. It turns out one meant soccer and the other a different code. What kind of disagreement was it, in the lecture's terms?
    options:
      - text: A deep conceptual disagreement about the nature of sport.
        why: Tempting because they seemed to disagree, but once one says 'I meant soccer' they share the concept; nothing deep was in dispute.
      - text: A semantic confusion about the term, easily solved by clarifying usage.
        correct: true
        why: "Correct — the lecture says this kind of confusion is easily solvable: clarify how you are using the term and it turns out you share the same concept."
      - text: A normative disagreement about which football code ought to be played and watched.
        why: Tempting because people do argue about which code is better, but the friends never disagreed about what ought to be; they misread each other's words.
  - key: q210
    type: mcq
    concept: conceptual-analysis
    difficulty: 3
    variant-of: q209
    stem: Two theorists fully agree on what the word 'law' means in English, yet one says international law is law and the other denies it. On the lecture's layers, where might their disagreement lie?
    options:
      - text: At the linguistic level, because they are speaking different languages.
        why: Tempting because the lecture lists a linguistic layer first, but both use English words the same way; the problem lies deeper than language.
      - text: At the conceptual level — they may not share the same concept of law at all.
        correct: true
        why: "Correct — once the linguistic and semantic layers agree, a remaining dispute may be conceptual: they may be working with different concepts."
      - text: At the pragmatic level only, because each forgot to state the context of their claims.
        why: Tempting because context matters in the soccer example, but here the context is clear; the disagreement survives clarification of context.
  - key: q211
    type: mcq
    concept: conceptual-analysis
    difficulty: 2
    stem: Who was Julius Stone, as mentioned in connection with Twining's quote?
    options:
      - text: An Oxford student of Hart's who defended a positivist theory of law.
        why: Tempting because the quote names Hart and Raz, but that describes Raz; Stone was at Sydney and closer to the sociology of law.
      - text: A professor of jurisprudence at Sydney who defended a sociological jurisprudence.
        correct: true
        why: Correct — the lecture says Stone was long professor of jurisprudence at Sydney and defended what he called sociological jurisprudence.
      - text: A natural law thinker who criticised conceptual analysis for ignoring human goods.
        why: Tempting because that echoes Finnis, but the lecture presents Stone as a sociological jurist, not a natural law thinker.
  - key: q212
    type: mcq
    concept: conceptual-analysis
    difficulty: 3
    stem: Which statement about conceptual analysis is most accurate to week 1?
    options:
      - text: It was invented by Hart in 1961 and has no earlier history in legal theory.
        why: Tempting because Hart's book is seen as the start of modern analytical jurisprudence, but the lecture stresses a long earlier tradition, including Austin and Bentham.
      - text: It is a key method of analytical philosophy that Hart and others imported into jurisprudence.
        correct: true
        why: Correct — the slide calls conceptual analysis a key element or method of analytical philosophy, and the lecture says Hart imported these tools.
      - text: It is the method of the social sciences, which Hart rejected as unscientific and unsuited to law.
        why: Tempting because Twining links it with social science, but it is a method of analytical philosophy, and Hart called his book descriptive sociology too.
  - key: q213
    type: mcq
    concept: conceptual-analysis
    difficulty: 4
    contrasts-with: [meaning-of-jurisprudence]
    stem: An essay claims 'conceptual analysis is useless because where you draw a concept's boundaries is always contested'. Which reply draws most directly on Bix?
    options:
      - text: Contested boundaries show the concept is empty, so the essay is right to dismiss conceptual analysis as a method for jurisprudence altogether.
        why: Tempting because contestation can look like emptiness, but Bix treats contested boundaries as a normal feature, not proof the concept is empty.
      - text: Bix accepts boundaries are often contested, yet says drawing them still helps build common ground for investigation and discussion.
        correct: true
        why: "Correct — Bix's p 18 claim holds both halves together: boundaries are often contested, but drawing them helps establish a common ground."
      - text: Bix says contested concepts belong to particular jurisprudence, so the objection misses general jurisprudence.
        why: Tempting because it borrows another distinction from the week, but Bix's point about boundaries is not about general versus particular jurisprudence.
  - key: q214
    type: mcq
    concept: conceptual-analysis
    difficulty: 3
    stem: Why does the lecturer set Twining's chapter in week 1?
    options:
      - text: Because Twining fully embraces Hart's understanding of legal philosophy.
        why: Tempting because Twining studied at Oxford in Hart's time, but the lecture says he did not completely embrace Hart's view and paid more attention to social science.
      - text: Because Twining argues jurisprudence should drop conceptual questions entirely in favour of sociology.
        why: Tempting because Twining widens the field, but his thesis is that conceptual analysis has an important part to play in reviving general jurisprudence.
      - text: Because he lived that time at Oxford and contextualises Hart's analytical jurisprudence.
        correct: true
        why: Correct — the lecture says Twining lived that period as a student at Oxford and gives a very helpful contextualisation of Hart's version of analytical jurisprudence.
  - key: q215
    type: mcq
    concept: conceptual-analysis
    difficulty: 2
    variant-of: q201
    stem: 'A student defines "vehicle" as "anything with an engine". A classmate replies that a bicycle is a vehicle without an engine. What has the classmate shown, in conceptual-analysis terms?'
    options:
      - text: That having an engine is not a necessary condition of being a vehicle.
        correct: true
        why: Correct — a counterexample that falls inside the category without the feature shows the feature is not necessary, which is how conceptual boundaries are tested.
      - text: That having an engine is a sufficient condition, so the definition is complete as it stands.
        why: Tempting because the definition may still pick out many vehicles, but the bicycle shows it misses members of the category, so it is not complete.
      - text: That the disagreement is empirical and should be settled by counting bicycles on the road.
        why: Tempting because vehicles are physical things, but counting does not settle where the category's boundary lies; that is a conceptual question.
  - key: q216
    type: mcq
    concept: conceptual-analysis
    difficulty: 3
    stem: Twining says there is a lot of work to be done on 'usable concepts' in which setting, as a task for analytical jurisprudence?
    options:
      - text: In the domestic courts of the United Kingdom.
        why: Tempting because Twining studied in England, but his p 34 claim is about cross-cultural and transnational legal discourse, not one country's courts.
      - text: In cross-cultural and transnational legal discourse.
        correct: true
        why: Correct — at p 34 Twining says there is a lot of work to be done on usable concepts in cross-cultural and transnational legal discourse.
      - text: In the drafting of statutes by parliamentary counsel.
        why: Tempting because drafters must use concepts carefully, but Twining's point concerns concepts that work across cultures and legal orders.
  # true/false
  - key: q217
    type: truefalse
    set: quickfire
    concept: conceptual-analysis
    difficulty: 1
    statement: Conceptual theories generally define terms by necessary and sufficient conditions.
    answer: true
    why: True — the slide on jurisprudence and conceptual analysis says exactly this, and Bix adds that such boundaries are often contested.
  - key: q218
    type: truefalse
    set: quickfire
    concept: conceptual-analysis
    difficulty: 2
    statement: Twining argues that conceptual analysis has no role to play in reviving general jurisprudence.
    answer: false
    why: False — Twining says conceptual analysis has an important part to play in reviving general jurisprudence, but needs a much broader conception than Hart's or Raz's.
  - key: q219
    type: truefalse
    set: quickfire
    concept: conceptual-analysis
    difficulty: 2
    statement: For Bix, theories in the social sciences are not conceptual theories even though they use concepts.
    answer: true
    why: True — Bix contrasts purely conceptual theories with non-conceptual theories in the natural and social sciences; the lecture adds that those theories still use concepts.
  - key: q220
    type: short
    concept: conceptual-analysis
    difficulty: 3
    prompt: "Is conceptual analysis an adequate method for general jurisprudence? Discuss with reference to Bix and Twining."
    model: |
      Conceptual analysis is a necessary method for general jurisprudence but not, by itself, an adequate one. It has
      been a key method of analytical philosophy, and Hart imported it into jurisprudence. Conceptual theories generally
      define terms by necessary and sufficient conditions and so set the boundaries of categories; as Bix says, drawing
      them can establish common ground for investigation and discussion. Without that common ground, disputes collapse
      into semantic confusion, like the football/soccer example. The counterargument is that the placement of the
      boundaries is often contested, and Dickson reports sceptics who doubt conceptual analysis as a method at all. The
      better evaluation is Twining's: conceptual analysis "has an important part to play in reviving general
      jurisprudence", but what is needed is "a much broader conception" than Hart's or Raz's, one that also serves
      cross-cultural discourse, empirical legal studies and the social sciences. So analysis is adequate only if it is
      widened: contestation is a reason to do it more carefully and more broadly, not to abandon it.
    rubric:
      - id: r1
        criterion: Thesis — takes a clear position on adequacy, not just usefulness.
        marks: 2
        top-band: A qualified thesis (necessary but not sufficient) stated at the outset.
        margin-note: Adequate for what, exactly?
        authorities: []
      - id: r2
        criterion: Argument — explains conceptual analysis and Bix's account of boundaries.
        marks: 3
        top-band: Necessary and sufficient conditions, boundaries and common ground, with the Bix quote.
        margin-note: What does drawing boundaries buy us?
        authorities: [bix-jurisprudence-theory-and-context]
      - id: r3
        criterion: Counterargument — contested boundaries and scepticism about the method.
        marks: 2
        top-band: States the objection at full strength, using Bix's own admission and Dickson's sceptics.
        margin-note: Who doubts the method, and why?
        authorities: [dickson-elucidating-law]
      - id: r4
        criterion: Evaluation — uses Twining to reach a reasoned verdict.
        marks: 3
        top-band: Shows how Twining's broader conception answers the objection without abandoning analysis.
        margin-note: Does Twining save the method or replace it?
        authorities: [twining-general-jurisprudence]
  # ---- six-kinds-of-questions ----
  - key: q301
    type: mcq
    concept: six-kinds-of-questions
    difficulty: 1
    set: pretest
    stem: "'What are the success criteria for a given theory?' Which kind of question is this?"
    options:
      - text: Methodological — a question about how research in the field should be conducted.
        why: Tempting because methodology is close by on the list, but the slide asks 'how should we conduct research?' there; success criteria are metatheoretical.
      - text: Metatheoretical.
        correct: true
        why: Correct — the slide defines metatheoretical questions as asking what the success criteria for a given theory are.
      - text: Conceptual — a question about what the concept of a theory itself is and means.
        why: Tempting because it concerns what a theory is, but conceptual questions on the slide are like 'what is law?'; criteria for judging theories are metatheory.
      - text: Normative — a question about what a theory ought to say about law and justice.
        why: Tempting because criteria sound evaluative, but normative questions ask how things ought to be in law, not how we judge a theory's success.
  - key: q302
    type: mcq
    concept: six-kinds-of-questions
    difficulty: 1
    stem: A tutorial problem asks whether a shop owner is liable in negligence under NSW law. What kind of question is it?
    options:
      - text: An empirical question about the causes and effects of negligence law in the community.
        why: Tempting because the facts are real-world facts, but asking what the law is on a specific issue in a jurisdiction is doctrinal, not empirical.
      - text: Doctrinal.
        correct: true
        why: Correct — doctrinal questions ask what the law is on a specific issue; the lecture says every hypothetical is a cluster of doctrinal questions.
      - text: A conceptual question about what negligence is, in general, in every legal system.
        why: Tempting because negligence is a concept, but the question asks for the NSW answer on these facts, not the general nature of negligence.
  - key: q303
    type: mcq
    concept: six-kinds-of-questions
    difficulty: 2
    stem: Which distinction does the slide attach to normative questions?
    options:
      - text: Explanatory/causal vs effects claims.
        why: Tempting because it is also a pair on the slide, but explanatory/causal vs effects is the distinction attached to empirical questions.
      - text: Descriptive vs normative (is/ought), with normative claims either justificatory or critical.
        correct: true
        why: Correct — the slide sets out the is/ought distinction and then splits normative claims and theories into justificatory and critical.
      - text: General vs particular jurisprudence.
        why: Tempting because it is another week 1 pair, but that distinction sorts the scope of jurisprudence, not the kinds of normative claim.
  - key: q304
    type: mcq
    concept: six-kinds-of-questions
    difficulty: 2
    stem: A researcher interviews a community to find out what a new statute actually did to them, compared with what the legislature intended. What kind of claim will the findings support?
    options:
      - text: A justificatory normative claim, defending the policy decisions behind the statute as good.
        why: Tempting because the statute's policy is discussed, but the research investigates on the ground what happened, which is empirical, not a defence of it.
      - text: A metatheoretical claim about the success criteria that any theory of statutes must meet.
        why: Tempting because findings can test theories, but the study is about this statute's effects, not the criteria for judging theories.
      - text: An empirical claim about effects.
        correct: true
        why: Correct — the lecture's example of an empirical question is investigating how a new statute affects a community, which may differ from what was intended.
  - key: q305
    type: mcq
    concept: six-kinds-of-questions
    difficulty: 2
    contrasts-with: [meaning-of-jurisprudence]
    stem: "An essay says: 'This family law arrangement is desirable and should be kept.' What kind of claim is this?"
    options:
      - text: A justificatory normative claim.
        correct: true
        why: Correct — it says how things ought to be and defends the status quo, which the lecture calls a justificatory normative claim.
      - text: A critical normative claim, because any claim about family law criticises some people's interests.
        why: Tempting because normative claims can criticise, but this one defends the existing arrangement; critical claims attack the status quo.
      - text: A descriptive claim, because it describes an arrangement that already exists in family law.
        why: Tempting because the arrangement exists, but saying it is desirable and should be kept goes beyond describing it to what ought to be.
  - key: q306
    type: mcq
    concept: six-kinds-of-questions
    difficulty: 2
    variant-of: q305
    stem: "Another essay says: 'This family law arrangement is unjust and should be changed.' What kind of claim is this?"
    options:
      - text: A justificatory normative claim, because it gives reasons for its view.
        why: Tempting because it does give reasons, but justificatory claims defend the status quo; this one attacks it.
      - text: A critical normative claim.
        correct: true
        why: Correct — it is about how things ought to be and it criticises the status quo, the lecture's example of a critical normative claim.
      - text: An empirical effects claim, because it predicts what will happen after the law is changed.
        why: Tempting because change has effects, but the essay argues the law is unjust and ought to change, which is normative, not a finding about effects.
      - text: A doctrinal claim, because it states what the family law currently is on the issue.
        why: Tempting because it mentions current law, but its point is that the law should be changed, not what the law is.
  - key: q307
    type: mcq
    concept: six-kinds-of-questions
    difficulty: 3
    stem: "The lecture says picking one theory over another 'isn't like picking an ice-cream flavour'. What is the point?"
    options:
      - text: That all theories are equally good, so the choice is purely a matter of preference.
        why: "Tempting because the lecture names that relativist temptation, but it raises it in order to deny it: there may be criteria to judge theories."
      - text: That there may be criteria to say one theory is superior, at least in some respect — a metatheoretical question.
        correct: true
        why: Correct — asking for criteria to assess theories is engaging with a metatheoretical question, not expressing a mere preference.
      - text: That theories should be chosen by their authority, as cases are chosen by the court's rank.
        why: Tempting to a law student, but the lecture says jurisprudence lacks authorities with the weight they have in a positive law subject.
  - key: q308
    type: mcq
    concept: six-kinds-of-questions
    difficulty: 3
    stem: "'Assuming there is such a thing as the nature of law, how should we investigate it?' What kind of question is this?"
    options:
      - text: Methodological.
        correct: true
        why: Correct — asking how we should investigate our object is a methodological question; the lecture uses exactly this example about the nature of law.
      - text: Doctrinal, because it asks what the law is.
        why: Tempting because it mentions law, but it asks how to research law's nature, not what the law is on a specific issue.
      - text: Empirical, because natural scientists investigate nature by experiment and observation.
        why: Tempting because the word 'nature' suggests science, but the question is about how to conduct the inquiry, which is methodology.
  - key: q309
    type: mcq
    concept: six-kinds-of-questions
    difficulty: 2
    stem: Which is given on the slide as an example of a conceptual question?
    options:
      - text: What is justice?
        correct: true
        why: Correct — the slide's examples of conceptual questions are 'what is a contract?', 'what is law?' and 'what is justice?'.
      - text: How should we conduct research in this field of study?
        why: Tempting because it is general in form, but the slide gives it as the methodological question, not a conceptual one.
      - text: What effects did this particular statute have on a given community?
        why: Tempting because it asks 'what', but it is an empirical effects question about one statute, not a question about a concept.
  - key: q310
    type: mcq
    concept: six-kinds-of-questions
    difficulty: 3
    stem: The lecture says even an empirical inquiry into something still needs what?
    options:
      - text: A normative justification of the status quo it investigates.
        why: Tempting because research can have political aims, but the lecture's point is that empirical work relies on concepts, not that it must justify anything.
      - text: Concepts.
        correct: true
        why: Correct — the lecture says even when you develop an empirical inquiry you still need concepts, so the different questions relate to one another.
      - text: A doctrinal answer from a court in the relevant jurisdiction.
        why: Tempting because law students start from cases, but empirical inquiry investigates the world; what it cannot do without is concepts.
  - key: q311
    type: mcq
    concept: six-kinds-of-questions
    difficulty: 3
    contrasts-with: [general-and-descriptive-theory]
    stem: "Hart claims his theory is 'general and descriptive'. A critic asks whether those two claims are met. What level is the critic's question at?"
    options:
      - text: Doctrinal, because it asks what Hart's text actually says.
        why: Tempting because it involves reading a text closely, but doctrinal questions are about the content of the law in a jurisdiction.
      - text: Metatheoretical — it applies success criteria to the theory.
        correct: true
        why: Correct — the lecture says Hart's two claims can be used as criteria to assess the theory on its own terms, which is a metatheoretical exercise.
      - text: Empirical, because generality is measured by counting legal systems the theory covers.
        why: Tempting because generality sounds countable, but asking whether a theory meets its success criteria is metatheory, not a head count.
  - key: q312
    type: mcq
    concept: six-kinds-of-questions
    difficulty: 4
    stem: A theorist says 'my theory of law is better than yours because it explains international law and yours does not'. Which kind of claim is this, and what does it assume?
    options:
      - text: A doctrinal claim, assuming international law is binding on Australian courts.
        why: Tempting because international law is a body of doctrine, but the claim ranks theories, which is not a question about what the law is.
      - text: A normative claim, assuming international law ought to be obeyed by all states at all times.
        why: Tempting because obligation is in the background, but the claim concerns which theory is better, not whether states ought to comply.
      - text: A metatheoretical claim, assuming that explaining borderline cases is a criterion of success.
        correct: true
        why: Correct — ranking theories uses a success criterion; here the assumed criterion is covering borderline cases like international law.
  - key: q313
    type: mcq
    concept: six-kinds-of-questions
    difficulty: 3
    variant-of: q304
    stem: A sociologist asks why a particular law was passed — which pressures and interests caused it. What kind of claim is being sought?
    options:
      - text: An explanatory/causal empirical claim.
        correct: true
        why: Correct — the slide splits empirical claims into explanatory/causal and effects claims; asking what caused a law is explanatory.
      - text: An empirical effects claim, because it concerns what the law did once it was in force.
        why: Tempting because both are empirical, but effects claims ask what a law did after it passed; this asks what caused it.
      - text: A methodological claim, because the sociologist must choose between interviews and surveys.
        why: Tempting because methods are involved, but the question asked is about causes of the law; the choice of method is a separate issue.
  - key: q314
    type: mcq
    concept: six-kinds-of-questions
    difficulty: 3
    contrasts-with: [meaning-of-jurisprudence]
    stem: The lecture distinguishes two connected problems — the nature of jurisprudence and the nature of law. Which is a claim about the nature of jurisprudence?
    options:
      - text: Legal obligation differs from moral obligation.
        why: Tempting because it is a claim from Hart's book, but it concerns law and its relation to morality, so it is about the nature of law.
      - text: Coercion is an essential feature of law.
        why: Tempting because it is a big theoretical claim, but it is a claim about what law is — the object — not about the theory.
      - text: A theory of law can be wholly morally neutral.
        correct: true
        why: Correct — whether a theory can be morally neutral is about what kind of thing the theory is, a claim about the nature of jurisprudence.
  - key: q315
    type: mcq
    concept: six-kinds-of-questions
    difficulty: 2
    stem: Which is the best description of a descriptive claim, as the lecture uses the is/ought distinction?
    options:
      - text: A claim about what the law ought to be once all the policy arguments have been considered.
        why: Tempting because policy arguments are part of legal debate, but a claim about what ought to be is normative, not descriptive.
      - text: A claim about what the law is, setting all criticism aside for a separate conversation.
        correct: true
        why: Correct — the lecture says you can put aside the normative arguments and just ask what the law says; that is a description.
      - text: A claim that defends the existing law as good for all the reasons its supporters give.
        why: Tempting because it concerns existing law, but defending it as good is a justificatory normative claim, not a description.
  - key: q316
    type: mcq
    concept: six-kinds-of-questions
    difficulty: 4
    variant-of: q311
    stem: "Dickson reports theorists who are 'wary of the idea that a human-made social construction such as law can have a nature'. Their doubt is primarily about what?"
    options:
      - text: Whether a particular statute is valid.
        why: Tempting because validity is a legal idea, but the doubt is not about any statute; it is about whether law has a nature a theory can explain.
      - text: Whether the object that jurisprudence aims to explain exists in the form assumed — a question about the enterprise itself.
        correct: true
        why: Correct — doubting that law has a nature puts pressure on the theoretical enterprise, a metatheoretical and methodological challenge.
      - text: Whether judges ought to follow precedent, which is a question of normative legal theory about courts.
        why: Tempting because judges appear in legal theory, but the sceptics' target is the idea of law's nature, not the duties of judges.
  # true/false
  - key: q317
    type: truefalse
    set: quickfire
    concept: six-kinds-of-questions
    difficulty: 1
    statement: Explanatory/causal vs effects is the distinction the slide attaches to empirical questions.
    answer: true
    why: True — empirical questions divide into explanatory/causal claims and effects claims, and theories of each kind; the is/ought split belongs to normative questions.
  - key: q318
    type: truefalse
    set: quickfire
    concept: six-kinds-of-questions
    difficulty: 2
    statement: '"How should we conduct research in this field?" is a metatheoretical question.'
    answer: false
    why: False — the slide gives it as the methodological question; metatheoretical questions ask what the success criteria for a given theory are.
  - key: q319
    type: truefalse
    set: quickfire
    concept: six-kinds-of-questions
    difficulty: 2
    statement: A normative theory can be either justificatory or critical.
    answer: true
    why: True — the slide splits normative claims and theories into justificatory, which defend the status quo, and critical, which criticise it.
  - key: q320
    type: short
    concept: six-kinds-of-questions
    difficulty: 3
    prompt: "'In jurisprudence, every question is really a normative question.' Discuss, using the six kinds of questions from week 1."
    model: |
      The claim is overstated: jurisprudence asks at least six kinds of questions, and only one is normative. Doctrinal
      questions ask what the law is on a specific issue; normative questions, drawing on the is/ought distinction, ask
      what ought to be and are either justificatory or critical; empirical questions make explanatory/causal or effects
      claims; metatheoretical questions ask for a theory's success criteria; methodological questions ask how research
      should be conducted; and conceptual questions ask what law, contract or justice is. Hart claims a theory that is
      descriptive — morally neutral, with no justificatory aims — which would be impossible if every question were
      normative. The best counterargument is that choosing criteria to judge theories, or deciding which features of law
      matter, may involve evaluation; Finnis thinks legal judgments cannot be assessed without premises about true human
      goods. But evaluation in metatheory is not the same as a normative claim about how law ought to be. On balance the
      kinds of questions remain distinct, though they interact, and an essay must say which one it is answering.
    rubric:
      - id: r1
        criterion: Thesis — a clear position on whether all questions reduce to normative ones.
        marks: 2
        top-band: Commits to a thesis and signals the distinction it will rely on.
        margin-note: Agree, disagree, or qualify?
        authorities: []
      - id: r2
        criterion: Argument — sets out the six kinds accurately with examples.
        marks: 3
        top-band: All six named with the slide's sub-distinctions (is/ought; justificatory/critical; explanatory/effects).
        margin-note: Which kind is Hart's own claim?
        authorities: []
      - id: r3
        criterion: Counterargument — shows how evaluation might creep into metatheory.
        marks: 2
        top-band: Uses Finnis on true human goods as the strongest opposing view.
        margin-note: Is choosing criteria itself value-laden?
        authorities: [finnis-philosophy-of-law]
      - id: r4
        criterion: Evaluation — reasoned verdict that distinguishes evaluation from normative claims.
        marks: 2
        top-band: Explains why the kinds stay distinct even though they interact.
        margin-note: Why does the distinction survive?
        authorities: [hart-the-concept-of-law]
  # ---- legal-theory-in-the-real-world ----
  - key: q401
    type: mcq
    concept: legal-theory-in-the-real-world
    difficulty: 1
    stem: In the Gove land rights case (Milirrpum v Nabalco), on what basis were Aboriginal claims to land questioned?
    options:
      - text: That the claimants had not registered their title under the Torrens system.
        why: Tempting because registration matters in land law, but the slide says the claims were questioned because customary rules could not be described as legal rules.
      - text: That the customary rules of Aboriginal peoples could not be described by the court as legal rules.
        correct: true
        why: Correct — the slide says the claims were questioned on exactly this basis, which turns on a theory of what counts as law.
      - text: That the land was covered by an Act of the Commonwealth Parliament.
        why: Tempting because statutes often extinguish claims, but the slide gives no statutory ground; the point is about whether customary rules are law.
      - text: That international law barred the claim.
        why: Tempting because the unit mentions international law often, but the slide does not; the basis was a view about what counts as legal rules.
  - key: q402
    type: mcq
    concept: legal-theory-in-the-real-world
    difficulty: 1
    stem: Whose theory of law does the slide say Madzimbamuto v Lardner-Burke considered in deciding the legality of Rhodesia's Unilateral Declaration of Independence?
    options:
      - text: H.L.A. Hart's, especially his rule of recognition.
        why: Tempting because Hart's rule of recognition is used in Miller, but the slide ties Madzimbamuto to Hans Kelsen's theory of law.
      - text: Hans Kelsen's.
        correct: true
        why: Correct — the slide says the case considers the legality of the 1965 declaration in light of Hans Kelsen's theory of law.
      - text: John Austin's command theory, as applied by the court in Milirrpum.
        why: Tempting because the lecture links Milirrpum to Austin, but Madzimbamuto is the Kelsen example, decided by the Privy Council.
  - key: q403
    type: mcq
    concept: legal-theory-in-the-real-world
    difficulty: 1
    stem: Which concept from Hart did the UK Supreme Court use in the Miller case?
    options:
      - text: The internal point of view.
        why: Tempting because it is one of Hart's listed concepts, but the quoted paragraphs of Miller turn on the rule of recognition.
      - text: The rule of recognition, as Hart used it.
        correct: true
        why: Correct — at [60] and [173] the Court discusses the UK's rule of recognition, a concept introduced by Hart in The Concept of Law.
      - text: Primary rules imposing duties on citizens.
        why: Tempting because duty-imposing rules are Hart's too, but Miller's quoted reasoning is about the fundamental rule that validates other rules.
  - key: q404
    type: mcq
    concept: legal-theory-in-the-real-world
    difficulty: 2
    stem: What question did the Miller case consider, according to the slide?
    options:
      - text: Whether the UK could remain in the EU after a referendum without holding a second vote.
        why: Tempting because Brexit involved referendums, but the slide frames the question as whether withdrawal needed an Act of Parliament.
      - text: Whether the British Government could withdraw from the EU without an Act of Parliament giving permission.
        correct: true
        why: Correct — the slide says Miller considered whether the Government could withdraw from the European Union without an Act of Parliament.
      - text: Whether EU law was ever part of UK law.
        why: Tempting because the 1972 Act is mentioned, but the question was about the Government withdrawing without an Act, not whether EU law ever applied.
  - key: q405
    type: mcq
    concept: legal-theory-in-the-real-world
    difficulty: 2
    stem: In Miller at [173], how is the rule of recognition described?
    options:
      - text: As a rule telling judges how to interpret ambiguous statutes by looking at the purpose of the enactment as a whole.
        why: Tempting because interpretation is a judicial task, but [173] describes the rule that identifies the sources of law, not a canon of interpretation.
      - text: As the rule which identifies the sources of law and imposes a duty to give effect to laws from those sources.
        correct: true
        why: Correct — [173] describes it as the rule which identifies the sources of law in our legal system and imposes a duty to give effect to their laws.
      - text: As a political convention.
        why: Tempting because conventions matter in UK constitutional law, but the Court describes the rule of recognition as identifying sources of law.
  - key: q406
    type: mcq
    concept: legal-theory-in-the-real-world
    difficulty: 2
    stem: Why does the lecture say you cannot fully understand the reasoning in Mabo without Milirrpum?
    options:
      - text: Because Mabo simply applied Milirrpum.
        why: Tempting because both are land rights cases, but the lecture's point is that Milirrpum shows the theory of law in the background, not that Mabo applied it.
      - text: Because in Milirrpum the court was buying into assumptions about the nature of law from Austin's theory.
        correct: true
        why: Correct — the lecture says the Gove court was clearly buying into assumptions from Austin's theory, and that background matters for reading Mabo.
      - text: Because Mabo was decided by the Privy Council on appeal from Milirrpum, in light of Kelsen's theory.
        why: Tempting because Madzimbamuto was a Privy Council case about Kelsen, but that is a different case; the Milirrpum link is to Austin.
  - key: q407
    type: mcq
    concept: legal-theory-in-the-real-world
    difficulty: 3
    stem: What general lesson does the lecture draw from the three real-world cases?
    options:
      - text: That judges should avoid legal theory altogether, since theories distorted all three of these decisions.
        why: Tempting because Milirrpum is troubling, but the lecture does not tell judges to avoid theory; it shows theories filtering into decisions.
      - text: Concepts developed within theories of law filter into judicial reasoning and make a difference.
        correct: true
        why: Correct — the lecture says these understandings of law filter through and make a difference when officials decide on the basis of them.
      - text: That only the High Court of Australia uses legal theory, and English courts do not.
        why: Tempting because two cases are Australian-related, but Miller is a UK Supreme Court case, so the lesson is not limited to Australia.
  - key: q408
    type: mcq
    concept: legal-theory-in-the-real-world
    difficulty: 3
    stem: The lecture asks you to 'put pressure on' legal theories. What does it mean?
    options:
      - text: Use your knowledge from your other law units to test the theories and their concepts.
        correct: true
        why: Correct — the lecture says use your other legal studies to put pressure on the theories and concepts, since theory is about law, not something else.
      - text: Memorise the theories thoroughly so you can reproduce each author's arguments in the exam.
        why: Tempting to an exam-focused student, but the lecture says memorising theories is a waste of time; you must use them.
      - text: Keep theory and law in separate compartments so that neither contaminates the other.
        why: Tempting because the subjects look different, but the lecture says the more interesting approach is to combine them.
  - key: q409
    type: mcq
    concept: legal-theory-in-the-real-world
    difficulty: 2
    stem: Which court decided Madzimbamuto v Lardner-Burke, according to the slide?
    options:
      - text: The High Court of Australia, sitting as a full bench.
        why: Tempting because the week also discusses Australian cases, but Madzimbamuto was a Rhodesian matter decided in London.
      - text: The Judicial Committee of the Privy Council, in London.
        correct: true
        why: Correct — the slide calls it a decision of the Judicial Committee of the Privy Council on UK and Rhodesian constitutional law.
      - text: The UK Supreme Court, in its first constitutional case on independence.
        why: Tempting because Miller was a UK Supreme Court case, but that court did not exist in 1969; Madzimbamuto was a Privy Council decision.
  - key: q410
    type: mcq
    concept: legal-theory-in-the-real-world
    difficulty: 2
    stem: "Gardner says 'a philosophical education encourages us to look … for timeless problems underlying topical problems'. In law, what are the topical problems?"
    options:
      - text: The doctrinal questions we answer when studying the law of a given jurisdiction.
        correct: true
        why: Correct — the lecture says the topical problems in law are the doctrinal questions of a given jurisdiction; the timeless ones may lie underneath.
      - text: The deepest philosophical puzzles about the nature of persons and their acts.
        why: Tempting because those sound profound, but on Gardner's picture those would be the timeless problems, not the topical ones.
      - text: Problems that have no answer at all and therefore should not be studied at university by law students.
        why: Tempting to a sceptic, but Gardner treats topical problems as the ordinary doctrinal questions of law, not unanswerable ones.
  - key: q411
    type: mcq
    concept: legal-theory-in-the-real-world
    difficulty: 2
    stem: Which is NOT one of Gardner's reasons for studying jurisprudence on the slide?
    options:
      - text: It can assist in our development as human beings.
        why: Tempting to pick because it sounds grand, but it is on the slide as the first reason, as a philosophical subject.
      - text: It contributes to excellence in argument.
        why: Tempting to pick because it sounds merely practical, but it is one of Gardner's two practical implications.
      - text: It supplies binding authorities for use in court.
        correct: true
        why: Correct — the slide gives no such reason, and the lecture stresses that jurisprudence cannot use authorities the way a legal problem does.
      - text: It helps us recognise different perspectives on a legal issue.
        why: Tempting to pick because it overlaps with the other reasons, but it is Gardner's second practical implication.
  - key: q412
    type: mcq
    concept: legal-theory-in-the-real-world
    difficulty: 2
    stem: "Leslie Green says legal philosophy offers 'an escape from the default setting' of what?"
    options:
      - text: Of our moral intuitions.
        why: Tempting because philosophy often challenges intuitions, but Green's target is the default setting of your own little legal system.
      - text: Of your own little legal system, however profitable and powerful it may be.
        correct: true
        why: Correct — Green says you are not a slave to your own legal head and there is an escape from the default setting of your own little legal system.
      - text: Of the common law method of reasoning by analogy from precedent to precedent.
        why: Tempting because precedent is a default of common law thinking, but Green speaks of your legal system as a whole, not one method.
  - key: q413
    type: mcq
    concept: legal-theory-in-the-real-world
    difficulty: 3
    variant-of: q412
    stem: "Green says legal philosophy 'will explain how something that is true legally speaking may be utterly false'. Which distinction from week 1 does this echo most closely?"
    options:
      - text: General vs particular jurisprudence.
        why: Tempting because Green also mentions your own little legal system, but the true/false contrast is about is and ought, not scope.
      - text: The is/ought distinction — the way things are around here versus the way they ought to be.
        correct: true
        why: "Correct — the lecture reads Green's line as the descriptive/normative distinction: what is true legally may be false when judged by how things ought to be."
      - text: Semantic vs conceptual disagreement about the meaning of legal terms in different systems.
        why: Tempting because 'true' and 'false' can be about meaning, but Green's contrast is between law as it is and as it ought to be.
  - key: q414
    type: mcq
    concept: legal-theory-in-the-real-world
    difficulty: 4
    contrasts-with: [harts-project]
    stem: A student argues that Miller shows Hart's theory is correct, because an apex court used his rule of recognition. What is the best response?
    options:
      - text: Agree — when a court adopts a concept, the theory that created it is thereby verified as true.
        why: Tempting because judicial use seems authoritative, but a court using a concept shows the theory's influence, not that its claims about law are true.
      - text: Disagree — use by a court shows theory filtering into practice, but the theory must still be assessed on its own criteria.
        correct: true
        why: Correct — the lecture shows concepts filtering into decisions, while stressing that theories are judged by criteria such as generality and descriptiveness.
      - text: Disagree, because courts are forbidden to rely on academic theories.
        why: Tempting because judges decide on law not theory, but the week's point is that they do use theories, more or less explicitly.
  - key: q415
    type: mcq
    concept: legal-theory-in-the-real-world
    difficulty: 3
    stem: "At [60] in Miller, the Court said it would not accept that the UK's fundamental rule of recognition had been varied by what?"
    options:
      - text: By the 2016 referendum result, which expressed the will of the people.
        why: Tempting because the referendum triggered the case, but [60] refers to the 1972 Act and its repeal, not the referendum.
      - text: By the 1972 Act, or by its repeal.
        correct: true
        why: Correct — the quoted passage says the fundamental rule of recognition had not been varied by the 1972 Act and would not be varied by its repeal.
      - text: By the decisions of the Court of Justice of the EU applying the treaties.
        why: Tempting because EU courts featured in the Brexit debate, but the quoted passage mentions only the 1972 Act and its repeal.
  - key: q416
    type: mcq
    concept: legal-theory-in-the-real-world
    difficulty: 3
    stem: Dickson says a proper understanding of law can help us appreciate how law bears on our practical reasoning. What example does the slide give?
    options:
      - text: Deciding how to win an appeal before the High Court.
        why: Tempting because it is practical, but Dickson's example is whether we should take law as having authority over us, not litigation strategy.
      - text: Deciding whether we should take law as having authority over us.
        correct: true
        why: Correct — the slide says understanding law can help us decide if we should take law as having authority over us, the question of week 12.
      - text: Deciding which of several statutes to read first when we research a problem.
        why: Tempting because research is practical reasoning of a kind, but the slide's example is about law's authority over us.
  - key: q417
    type: mcq
    concept: legal-theory-in-the-real-world
    difficulty: 4
    variant-of: q401
    stem: A court is asked whether the rules of a community with no legislature or courts are 'legal rules'. Which week 1 example shows how the answer can depend on a theory of law?
    options:
      - text: Milirrpum v Nabalco (the Gove land rights case).
        correct: true
        why: Correct — there, Aboriginal claims were questioned because customary rules could not be described as legal rules, on assumptions from Austin's theory.
      - text: The Miller case, because it asked whether EU law was law in the UK before 1972.
        why: Tempting because Miller involved sources of law, but it concerned withdrawal from the EU, not whether a community's customary rules are law.
      - text: Madzimbamuto v Lardner-Burke, because it asked whether Aboriginal custom bound the Crown.
        why: Tempting because it used a theory of law, but Madzimbamuto concerned Rhodesia's declaration of independence, not customary rules.
