    options:
      - text: "Because the agency suffered no loss: the client was eventually paid in full."
        why: Wrong — the facts are that the client collapsed and the agency lost money; loss was not the problem.
      - text: Because a bank can never owe a duty of care to anyone except its own customer.
        why: >-
          Tempting because the reference came from the client's bank, not the agency's, but the case recognised such
          duties can arise where a special relationship exists.
      - text: The "without responsibility" disclaimer meant no duty arose.
        correct: true
        why: >-
          Correct — the slide reminds us that the disclaimer meant no duty arose on the facts, which feeds directly
          into the importance of reliance.
  - key: q024
    type: mcq
    concept: negligent-words-from-deceit-to-hedley-byrne
    difficulty: 2
    cases:
      - hedley-byrne-v-heller
    stem: >-
      According to the slide, which elements did Lord Reid identify for a duty of care for negligent words in Hedley
