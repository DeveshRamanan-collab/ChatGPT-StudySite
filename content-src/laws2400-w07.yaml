          Tempting because both claims are for money, but the pedestrian's lost wages flow from a physical injury,
          which makes them consequential, not pure.
      - text: The pedestrian's lost wages are PEL and the caterer's lost contract is consequential.
        why: >-
          Wrong way round — the injured pedestrian has consequential loss; the caterer suffered no injury or property
          damage, so its loss is pure.
      - text: The pedestrian's lost wages are consequential; the caterer's lost contract is PEL.
        correct: true
        why: >-
          Correct — the pedestrian's money loss follows a physical injury (consequential); the caterer's loss is the
