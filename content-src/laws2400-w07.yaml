  - key: q021
    type: mcq
    concept: negligent-words-from-deceit-to-hedley-byrne
    difficulty: 1
    cases:
      - derry-v-peek
    stem: What did the House of Lords decide in Derry v Peek (1889)?
    options:
      - text: That a negligent misstatement gives rise to a duty of care in every case where loss is foreseeable.
        why: >-
          Tempting because it sounds like the modern rule, but Derry v Peek pre-dates the law of negligence; the duty
          for negligent words came only with Hedley Byrne.
      - text: That negligent misstatement will not suffice for deceit; it must be intentional or reckless.
        correct: true
        why: >-
          Correct — this is the slide's statement of Derry v Peek. Deceit was closed to merely careless statements,
          leaving a gap that Hedley Byrne later filled.
      - text: That statements in a company prospectus can never found any action against the directors.
        why: >-
          Wrong — the case did not exclude prospectus claims altogether; it decided that deceit requires an
          intentional or reckless misstatement, not mere negligence.
    set: pretest
  - key: q022
    type: mcq
    concept: negligent-words-from-deceit-to-hedley-byrne
    difficulty: 2
    cases:
      - hedley-byrne-v-heller
    stem: Why does the lecture call Hedley Byrne v Heller "critical" in the history of negligent misstatement?
    options:
      - text: It created a liability for negligent misstatement at common law, filling the gap Derry v Peek left.
        correct: true
        why: >-
          Correct — after Derry v Peek, deceit required intent or recklessness; Hedley Byrne created a separate
          negligence liability for careless words causing PEL.
      - text: It abolished the tort of deceit and replaced it with negligence for every kind of misstatement.
        why: >-
          Wrong — deceit survives as a separate intentional tort (outside this unit); Hedley Byrne added negligence
          liability alongside it rather than replacing it.
      - text: It held that a bank reference given "without responsibility" still creates a duty of care.
        why: >-
          Wrong way round — the disclaimer in Hedley Byrne meant no duty arose on the facts, even though the House of
          Lords recognised such duties in principle.
  - key: q023
    type: mcq
    concept: negligent-words-from-deceit-to-hedley-byrne
    difficulty: 1
    cases:
