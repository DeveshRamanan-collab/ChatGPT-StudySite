        criterion: States Perre v Apand and its facts
        marks: 3
        top-band: Uses Perre as the closest precedent and sets out the analogous facts and outcome.
        margin-note: Good use of precedent by analogy.
        authorities: []
      - id: r3
        criterion: Applies McHugh J's questions to the facts
        marks: 3
        top-band: Works through foreseeability, determinacy (15 km), autonomy, vulnerability and knowledge on these facts.
        margin-note: Each question tied to a fact — exactly what is wanted.
        authorities: []
      - id: r4
        criterion: Considers coherence and concludes
        marks: 2
        top-band: Notes coherence (Sullivan v Moody) and reaches a reasoned conclusion.
        margin-note: Clear conclusion.
        authorities: []
