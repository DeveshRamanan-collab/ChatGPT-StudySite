      - text: A person with special skill who undertakes to apply it for another who relies on it.
        correct: true
        why: >-
          Correct — the slide attributes this to Lord Morris: special skill, an undertaking to apply it for another,
          and that person's reliance.
      - text: Whether the defendant intended the plaintiff to suffer loss.
        why: >-
          Wrong — intention to cause loss is what deceit needs; Lord Morris was describing when careless (not
          intentional) use of skill attracts a duty.
  - key: q026
    type: mcq
