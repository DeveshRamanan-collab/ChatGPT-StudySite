    options:
      - text: >-
          The speaker is a professional adviser who charges a fee for the advice, and the inquirer signs a written
          retainer before relying.
        why: >-
          Tempting because many misstatement cases involve professionals, but Lord Reid's formulation does not require
          a fee or a retainer — it turns on trust, reliance and knowledge.
      - text: >-
          The inquirer trusts the speaker to take care, reasonably relies, and the speaker knows or ought to know of
          the reliance.
        correct: true
        why: >-
          Correct — this is Lord Reid's formulation on the slide: trust, reasonable reliance, and actual or
          constructive knowledge of that reliance.
      - text: The statement was made dishonestly, and the inquirer suffered physical damage as a result.
        why: >-
          Wrong — dishonesty is the territory of deceit, and physical damage is the paradigm; Lord Reid was describing
          a duty for careless words causing economic loss.
  - key: q025
    type: mcq
    concept: negligent-words-from-deceit-to-hedley-byrne
    difficulty: 2
    variant-of: q024
    cases:
