  - key: q063
    type: mcq
    concept: esanda-and-misstatement-salient-features
    difficulty: 2
    cases:
      - esanda-finance-corp-v-pmh
    stem: >-
      Esanda's main argument was that it belonged to a limited class who might reasonably rely on audited accounts.
