  - key: q080
    type: short
    concept: esanda-and-misstatement-salient-features
    difficulty: 4
    cases:
      - esanda-finance-corp-v-pmh
    prompt: >-
      Northgate Bank lends $4 million to Kestrel Pty Ltd after reading Kestrel's annual accounts, audited and signed
      off

      by Lowe & Co. Lowe & Co were engaged by Kestrel; they had no contact with Northgate and did not know Kestrel was

      seeking finance. The audit was careless and overstated Kestrel's assets. Kestrel collapses and Northgate loses

      $3 million. Advise Northgate whether Lowe & Co owed it a duty of care.
    model: >-
      The issue is whether an auditor owes a lender, relying on audited accounts, a duty of care to avoid pure
      economic

      loss. Northgate's loss is PEL — money lost with no physical injury or property damage. Reasonable foreseeability
      is

      present: it is foreseeable that someone relying on audited accounts might suffer loss. But, as Dawson J said in

      Esanda Finance Corp v PMH, mere foreseeability does not, where the only harm is PEL, give rise to a duty; the
      law

      requires a special relationship. The facts closely resemble Esanda, where a financier relied on audited accounts
      and

      no duty was found. Weighing the salient features: there was no request by Northgate; Lowe & Co did not know of

      Northgate or its reliance and had no intention to induce it to lend; there was no assumption of responsibility

      toward lenders; and the purpose of an audit is to inform the company and its shareholders, not lenders. McHugh
      J's

      policy reasons also tell against a duty — indeterminate liability (accounts can be read by anyone), higher
      auditing

      costs, more complex litigation and difficulty proving reliance. Lowe & Co's special skill does not outweigh
      these

      features. Conclusion: following Esanda, Lowe & Co very likely owed Northgate no duty of care.
    rubric:
      - id: r1
        criterion: Identifies the issue and classifies the loss
        marks: 2
        top-band: States a PEL-by-misstatement duty issue and notes foreseeability is necessary but not sufficient.
        margin-note: Tight issue statement — good.
        authorities: []
      - id: r2
        criterion: States Esanda and Dawson J's proposition
        marks: 3
        top-band: Cites Esanda for the need for a special relationship (proximity / salient features) beyond foreseeability.
        margin-note: Use the case as authority, not decoration.
        authorities: []
      - id: r3
        criterion: Applies the salient features to the facts
        marks: 3
        top-band: >-
          No request, no knowledge of reliance, no intention to induce, no assumption of responsibility, audit
          purpose; acknowledges special skill.
        margin-note: Weigh the factors — do not just list them.
        authorities: []
      - id: r4
        criterion: Uses McHugh J's policy reasons and concludes
        marks: 2
        top-band: Raises indeterminacy, cost, complexity and proof of reliance, then concludes no duty.
        margin-note: Policy plus a clear conclusion earns the top band.
        authorities: []
  - key: q081
    type: mcq
    concept: disclaimers-and-vulnerability
    difficulty: 1
    cases:
      - hedley-byrne-v-heller
    stem: How does the lecture describe the effect of a disclaimer on a duty of care for negligent misstatement?
    options:
      - text: It is one factor against a duty arising.
        correct: true
        why: >-
          Correct — the slide calls a disclaimer "one factor against a duty arising", with Hedley Byrne itself as the
          example where no duty arose.
      - text: It has no effect, because duties of care cannot be excluded by the defendant's own words.
        why: >-
          Wrong — Hedley Byrne shows the opposite: the "without responsibility" disclaimer meant no duty arose on the
          facts.
      - text: It converts the claim into one for deceit, which is outside the unit.
        why: >-
          Wrong — a disclaimer goes to whether a negligence duty arises; it does not turn careless words into an
          intentional tort.
  - key: q082
    type: mcq
    concept: disclaimers-and-vulnerability
    difficulty: 2
    cases:
      - hedley-byrne-v-heller
    stem: >-
      The slide distinguishes a "disclaimer of responsibility" from a "warning that care has not been taken". What is
      the difference?
    options:
      - text: A disclaimer goes to reasonable reliance; a warning excludes the duty altogether.
        why: >-
          Wrong way round — it is the disclaimer of responsibility that excludes the duty; a warning goes to whether
          reliance was reasonable.
      - text: "There is no difference: both always exclude any duty of care, whatever the circumstances."
        why: >-
          Tempting because both sound protective, but the slide draws a deliberate distinction; a warning "may not
          necessarily go so far".
      - text: A disclaimer excludes the duty; a warning goes to whether reliance was reasonable.
        correct: true
        why: >-
          Correct — the slide puts them on different footings: disclaiming responsibility excludes the duty, while
          warning that care has not been taken bears on reasonable reliance.
  - key: q083
    type: mcq
    concept: disclaimers-and-vulnerability
    difficulty: 3
    contrasts-with:
      - reliance-and-knowledge-shaddock-san-sebastian-tepko
    stem: >-
      A valuer emails a buyer: "We have not inspected the roof cavity and have taken limited care on this point; rely
      on it at your own risk." The buyer relies and loses money on hidden roof damage. On the lecture's distinction,
      how is this statement best analysed?
    options:
      - text: As a warning that care has not been taken, which goes to whether the buyer's reliance was reasonable.
        correct: true
        why: >-
          Correct — the valuer has not disclaimed responsibility outright; they have warned that care was limited,
          which bears on reasonable reliance rather than automatically excluding the duty.
      - text: As a disclaimer of responsibility, which automatically excludes any duty of care.
        why: >-
          Tempting because "at your own risk" sounds like a disclaimer, but the statement mainly warns that care has
          not been taken, which the slide treats differently.
      - text: As irrelevant, because valuers always owe a duty to buyers whatever they say.
        why: >-
          Wrong — nothing in the materials makes any category of adviser liable regardless of what they say;
          disclaimers and warnings are both relevant.
  - key: q084
    type: mcq
    concept: disclaimers-and-vulnerability
    difficulty: 3
    variant-of: q081
    cases:
      - hedley-byrne-v-heller
    stem: >-
      A bank gives a reference about a customer's creditworthiness, headed "Given without responsibility on the part
      of this bank". On Hedley Byrne, what follows?
    options:
      - text: A duty arises because a bank has special skill in assessing credit.
        why: >-
          Tempting because special skill supports a duty (Lord Morris), but in Hedley Byrne itself the disclaimer
          meant no duty arose despite the bank's skill.
      - text: No duty arises.
        correct: true
        why: >-
