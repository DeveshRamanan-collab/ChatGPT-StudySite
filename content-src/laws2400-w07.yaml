      - text: Because a class of plaintiffs can never be owed a duty in negligent misstatement cases.
        why: >-
          Wrong — the lecture says a large class is not necessarily a problem; the class here simply was not enough
          without other features.
      - text: Because Esanda had not read the accounts before lending.
        why: >-
