    concept: acl-s18-misleading-or-deceptive-conduct
    difficulty: 1
    stem: What does s 18 of the Australian Consumer Law prohibit?
    options:
      - text: Conduct, in trade or commerce, that is misleading or deceptive or likely to mislead or deceive.
        correct: true
        why: >-
          Correct — this is the slide's quotation of s 18: a person must not, in trade or commerce, engage in conduct
          that is misleading or deceptive or likely to mislead or deceive.
      - text: Any careless statement, by anyone, that causes another person pure economic loss.
        why: >-
          Wrong — s 18 is limited to conduct in trade or commerce and turns on misleading or deceptive conduct, not
          carelessness as such.
      - text: Only intentionally false statements made by a company in a prospectus or annual report.
        why: >-
          Wrong — s 18 is not limited to intentional statements or to prospectuses; it covers negligent as well as
          intentional misstatements, and conduct as well as words.
  - key: q102
