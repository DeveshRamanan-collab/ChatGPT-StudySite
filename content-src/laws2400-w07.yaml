      of proximity". "Proximity" is the historical label; the modern approach treats the factors as salient features
      (*Sullivan v Moody*).

      McHugh J's policy reasons against auditors' liability: higher auditing costs, more complex litigation,
      indeterminacy, and difficulty proving reliance.

      The lecture's closing list:

      1. Reasonable foreseeability (necessary but not sufficient)
      2. Indeterminacy of liability
      3. Category of relationship
      4. Defendant's knowledge (of matters affecting the plaintiff, including reliance)
      5. Reliance by the plaintiff (reasonable in the circumstances?)
      6. Assumption of responsibility by the defendant
      7. Special skill of the defendant
      8. Vulnerability of the plaintiff

      Not a rigid checklist: factors cross over and courts look at the circumstances as a whole. Foreseeability must
      always be ticked; the rest are weighed, with reliance and assumption of responsibility especially important.

      Exam use: start with Esanda, then weigh the factors.
  - slug: disclaimers-and-vulnerability
    title: Disclaimers, assumption of responsibility and vulnerability
    visual: diagram
    visual-brief: >-
      A fork on what the speaker said about care: "disclaimer of responsibility" leads to no duty; "warning that care
      has not been taken" leads on to the reasonable-reliance question; a second branch tests vulnerability — could
      the plaintiff protect itself by contract or its own inquiries?
    related:
      - esanda-and-misstatement-salient-features
      - defective-structures-and-the-dbpa
    depends-on:
      - esanda-and-misstatement-salient-features
    contrasts-with:
      - reliance-and-knowledge-shaddock-san-sebastian-tepko
    cases:
      - hedley-byrne-v-heller
      - mallonland-pty-ltd-v-advanta-seeds-pty-ltd
      - anchorage-capital-master-offshore-ltd-v-sparkes
    authorities: []
    verify: false
    body: >-
      A disclaimer is one factor against a duty arising — in *Hedley Byrne* itself the "without responsibility"

      reference meant no duty arose. Distinguish two things a speaker might say:


      - a **disclaimer of responsibility**, which excludes the duty; and

      - a **warning that care has not been taken**, which does not necessarily go so far — it goes to whether
        reliance was reasonable.

      In *Mallonland Pty Ltd v Advanta Seeds Pty Ltd* [2024]

      HCA 25 the High Court said "assumption of responsibility" is imprecise; it is understood as an undertaking to
      take

      on a task from which acceptance of reasonable care can be inferred. No duty was found, and the Court's cautious,

      step-by-step language is a reminder that falling into a category where duties have been found before does not

      guarantee one.


      Vulnerability is a separate salient factor. In *Anchorage Capital Master Offshore Ltd v Sparkes* (2023), lenders

      relied on false financial notices from the borrower's officers; the company collapsed; no duty. Sophisticated

      commercial parties able to protect themselves by contract are not vulnerable.


      The text's flowchart places reliance and assumption of responsibility under vulnerability: if the defendant knew

      or ought to have known you would rely, and your reliance was reasonable, you are vulnerable. That is a different

      way of thinking, not an error; Esanda does not mention vulnerability, but it is part of the reasoning.


      Exam use: read the exact words of any disclaimer or warning, then ask whether this plaintiff could have

      protected itself.
  - slug: acl-s18-misleading-or-deceptive-conduct
    title: "Statutory liability for misstatements: ACL s 18"
    visual: diagram
    visual-brief: >-
      Two parallel routes from the same false statement: common law negligent misstatement (duty → breach → causation
      → damage) and ACL s 18 (in trade or commerce? → misleading or deceptive? → loss because of it), with "not in
      trade or commerce" diverting back to the common law route.
    related:
      - esanda-and-misstatement-salient-features
    depends-on:
      - negligent-words-from-deceit-to-hedley-byrne
    contrasts-with:
      - negligent-words-from-deceit-to-hedley-byrne
    cases:
      - accc-v-kimberly-clark-australia
    authorities:
      - australian-consumer-law-s18
    verify: false
    body: >-
      There are now also statutory provisions which provide for liability for misrepresentation. Australian

      Consumer Law s 18: "A person must not, in trade or commerce, engage in conduct that is misleading or deceptive
      or

      is likely to mislead or deceive."


      - Section 18 covers both **conduct and words**, and negligent as well as intentional misstatements.

      - There is **no need to establish a duty of care or prove negligence** — what must be proved is the existence of
        misleading or deceptive conduct. A causal link is still needed, but nowhere near the extent required at common
        law.
      - The **common law remains relevant** — for
        example where the defendant is not engaging "in trade or commerce" — and a plaintiff can argue both.

      *ACCC v Kimberly-Clark Australia* [2019] FCA 992; [2020] FCAFC 107: the ACCC brought action on two counts —

      whether wipes were "flushable" and whether they were "made in Australia". The Federal Court found the "made in

      Australia" claim false and misleading (the wipes were made elsewhere), but ruled Kimberly-Clark had not made
      false

      and misleading claims about the "flushable" wipes — upheld on appeal by the Full Federal Court. Kimberly-Clark
      had

      faced similar actions in the US and settled out of court.


      Exam use: where a misstatement is made in trade or commerce, flag s 18 as the easier route because no duty of

      care is needed; where it is not (a friend at a barbecue, say), the claim must be run as negligent misstatement.
  - slug: pel-caused-by-acts-perre-and-caltex
    title: "PEL caused by an act: Perre v Apand and Caltex Oil"
    visual: simulation
    visual-brief: >-
      A map with Apand's seed sale to Sparnon, a 20 km quarantine ring and farms inside and outside it; step through
      McHugh J's five questions as gates (foreseeable → determinate → autonomy → vulnerable → knowledge) and watch
      which farms remain owed a duty.
    related:
      - defective-structures-and-the-dbpa
      - laws2400-w05-novel-duty-and-salient-features
    depends-on:
      - pure-economic-loss-and-policy
      - laws2400-w05-novel-duty-and-salient-features
    contrasts-with:
      - negligent-words-from-deceit-to-hedley-byrne
      - esanda-and-misstatement-salient-features
    cases:
      - perre-v-apand-pty-ltd
      - caltex-oil-v-dredge-willemstad
      - caltex-refineries-pty-ltd-v-stavar
      - sullivan-v-moody
    authorities: []
    verify: false
    body: >-
      In England, no duty is generally imposed for PEL caused by an act; Australian courts may find one by

      applying the salient factors approach, incrementally.


      *Perre v Apand* (1999): Apand sold potato seed infected with bacterial wilt to Sparnon's farm, 3 km from the

      Perres' farm. WA prohibited potatoes grown within 20 km of the disease, so the Perres — with no disease, no

      physical damage and no contract with Apand — could not export to WA. The Perres lost below, but the High Court
      held **a duty was owed**.


      McHugh J's sequence:


      1. Was the loss to the Perres or the group reasonably foreseeable?

      2. Would a duty impose indeterminate liability? (No — the 20 km rule defined the class.)

      3. Would it unreasonably burden Apand's autonomy?

      4. Were the Perres vulnerable to loss from Apand's conduct? (Yes — no control over their neighbours' seed.)

      5. Did Apand know its conduct could harm people such as the Perres?


      Salient factors from the various judgments: foreseeability, indeterminacy, coherence of law, membership of an

      ascertained class, knowledge of the risk and its magnitude, control, and vulnerability.


      *Caltex Oil v Dredge 'Willemstad'* (1976): even before the approach was settled, the High Court found a duty for

      PEL. A dredge negligently damaged an oil pipeline; Caltex claimed only the cost of trucking oil around the bay,

      not the minor property damage — and was owed a duty.


      Exam use: find the most similar precedent, then argue the salient features both ways.
  - slug: defective-structures-and-the-dbpa
    title: "Defective structures: Bryan v Maloney, Woolcock and the DBPA"
    visual: timeline
    visual-brief: >-
      Three stops — 1995 Bryan v Maloney (house, third owner, duty), 2004 Woolcock (commercial building, sophisticated
      buyer, no duty), 2020 Design and Building Practitioners Act (statutory duty to every subsequent owner) — with
      the vulnerability marker dropping between the first two and the statute bypassing the question at the third.
    related:
      - pel-caused-by-acts-perre-and-caltex
      - disclaimers-and-vulnerability
    depends-on:
      - pure-economic-loss-and-policy
    contrasts-with:
      - pel-caused-by-acts-perre-and-caltex
    cases:
      - bryan-v-maloney
      - woolcock-street-investments-pty-ltd-v-cdg-pty-ltd
    authorities:
      - design-and-building-practitioners-act-2020-nsw-s37
      - design-and-building-practitioners-act-2020-nsw-s36
      - design-and-building-practitioners-act-2020-nsw-ss39-40
    verify: false
    body: >-
      Parties can deal with obvious building defects by contract; torts comes in for **latent** defects, found

      years later, often by a later owner. A defect causing physical injury is the paradigm; a defect that only

      diminishes the building's value has been viewed as PEL, whether it was negligently planned, designed or built.


      *Bryan v Maloney* (1995): a builder built a house with defective foundations; Mrs Maloney, the third owner,
      found

      cracks in the walls. **Duty owed** to a subsequent purchaser to take reasonable care in building a house. It
      used

      the proximity principle and distinguished dwellings — a homeowner is more vulnerable.


      *Woolcock Street Investments v CDG* (2004): CDG designed a commercial complex; one owner refused to pay for a

      geotechnical inspection; Woolcock bought from the original owners and the building settled.

      **No duty**: no reliance or assumption of responsibility, and Woolcock was not vulnerable — a commercial buyer

      could have protected itself.


      In NSW the Design and Building Practitioners Act 2020 now gives owners a statutory cause of action:


      - s 37: a person who carries out construction work has a duty to exercise reasonable care to avoid economic loss
        caused by defects, owed to each owner and each subsequent owner, with damages as if at common law;
      - s 36: "construction work" includes designs, building products, supervision and project management;

      - s 39: the duty is non-delegable; s 40: it cannot be contracted out.


      Exam use: in NSW, start with s 37 — no common law duty needed.
cases:
  - slug: derry-v-peek
    name: Derry v Peek
    citation: (1889)
    aglc: Derry v Peek (1889)
    facts: >-
      A company issued a prospectus stating it had a right to run steam trains (as the lecture puts it). It expected
      to get consent from the Board of Trade, but consent was ultimately refused; the shares lost value and investors
      lost money. (Facts as summarised in the Topic 7 lecture; the full report citation is not given in the
      materials.)
    issue: Whether a misstatement that was negligent, but not intentional or reckless, could found an action in deceit.
    held: >-
      The House of Lords ruled that negligent misstatement will not suffice for deceit — rather, it must be an
      intentional or reckless misstatement. As the case pre-dated the modern law of negligence, the investors had no
      cause of action.
    ratio: Deceit requires an intentional or reckless misstatement; mere negligence is not enough.
    significance: >-
      Left a gap — no remedy for a merely negligent misstatement — which Hedley Byrne v Heller later filled by
      creating liability for negligent misstatement at common law.
    why-here: >-
      Explains why negligent misstatement needed its own duty of care: deceit was closed to careless (as opposed to
      dishonest) statements.
    verify: true
  - slug: mutual-life-and-citizens-assurance-co-v-evatt
    name: Mutual Life & Citizens' Assurance Co v Evatt
    citation: (1968) 122 CLR 556
    aglc: Mutual Life & Citizens' Assurance Co v Evatt (1968) 122 CLR 556
    facts: >-
      Advice was given about investing in an associated company; the advice proved wrong and the recipient suffered
      loss. (The materials give only this outline.)
    issue: When a person giving information or advice owes the recipient a duty of reasonable care.
    held: >-
      Barwick CJ stated that where information or advice is given on a serious matter, the speaker realises (or should
      realise) they are being trusted, and it is reasonable for the recipient to act on it, a duty of reasonable care
      follows. The materials do not state the final outcome of the appeal.
    ratio: >-
      A duty of care in giving information or advice arises where the matter is serious, the speaker realises or
      should realise they are trusted, and it is reasonable for the recipient to rely on it.
    significance: >-
      Early High Court statement of the Hedley Byrne conditions in Australian terms; quoted in the Esanda casebook
      extract.
    why-here: >-
      Supplies Barwick CJ's three-part statement (serious matter, known trust, reasonable reliance) for a misstatement
      answer.
    verify: true
  - slug: shaddock-and-associates-pty-ltd-v-parramatta-city-council
    name: Shaddock & Associates Pty Ltd v Parramatta City Council
    citation: (1981) 150 CLR 225
    aglc: Shaddock & Associates Pty Ltd v Parramatta City Council (1981) 150 CLR 225
    facts: >-
      An intending purchaser's solicitor asked the council whether any road-widening proposal affected the land. The
      council said no, first orally by phone and then in a certificate; neither disclosed the scheme that existed. The
      purchase proceeded, the road-widening scheme emerged, and the land's value was destroyed.
    issue: Whether the council owed the purchaser a duty of care in providing the information.
    held: >-
      Duty found. The duty covers information as well as advice, and there is no separate requirement that the speaker
      possess special skill. The council was the only source of the information and the reliance on it was clear; the
      Court suggested the phone call alone might not have been enough, but the phone call together with the
      certificate was.
    ratio: >-
      A public authority that provides factual information, knowing it will be relied on, can owe a duty of care; the
      duty extends to information as well as advice and does not depend on the speaker having special skill.
    significance: >-
      Shows a public authority can owe a duty for negligent information, and removes any separate special-skill
      requirement.
    why-here: >-
      The authority for a duty over factual information from a sole source (often a public body), without special
      skill.
    verify: false
  - slug: san-sebastian-pty-ltd-v-minister
    name: San Sebastian Pty Ltd v Minister
    citation: (1986) 162 CLR 340
    aglc: San Sebastian Pty Ltd v Minister (1986) 162 CLR 340
    facts: >-
      Developers bought and planned in Woolloomooloo on the strength of a publicly exhibited council redevelopment
      scheme. The council later abandoned the scheme, and the developers lost money.
    issue: >-
      Whether a duty of care arose in respect of a published planning scheme on which developers relied without any
      request for advice.
    held: >-
      A duty can arise without any request — for example, through known special competence, an assumption of
      responsibility, inviting or intending reliance, or an interest in the recipient acting. The claim failed: the
      statement was one of intention, and relying on a mere intention was not reasonable, even though the reliance was
      genuine.
    ratio: >-
      Brennan J's conditions: the representor realises the representee will trust their special competence; it is
      reasonable for the representee to accept and rely on the statement; and loss is reasonably foreseeable if the
      statement is wrong. Reliance on a statement of intention is not reasonable.
    significance: Confirms a request is not essential for a duty, while showing that genuine reliance can still be unreasonable.
    why-here: >-
      Use for unsolicited public statements and for the point that reliance on a statement of intention is not
      reasonable.
    verify: false
  - slug: tepko-pty-ltd-v-water-board
    name: Tepko Pty Ltd v Water Board
    citation: (2001) 206 CLR 1
    aglc: Tepko Pty Ltd v Water Board (2001) 206 CLR 1
    facts: >-
      Landowners wanting to subdivide needed a costing for water supply, which their bank wanted. The Water Board
      refused several times, then reluctantly gave a 'ball-park' figure. The landowners showed it to their bank; the
      figure was heavily overstated and the refinancing arrangements collapsed.
    issue: Whether the Board owed the landowners a duty of care in giving the estimate.
    held: >-
      No duty: the Board neither knew nor should have known of the reliance, and reliance on a reluctant, provisional
      estimate was not reasonable. Dissenting judges would have found a duty, pointing to the statutory authority, its
      special knowledge and the serious business consequences.
    ratio: >-
      A duty for negligent misstatement needs known reliance (actual or constructive), an assumption of
      responsibility, or both; reliance on a reluctant, expressly provisional estimate is not reasonable.
    significance: Shows both the knowledge requirement and the reasonableness of reliance failing on the same facts.
    why-here: >-
      The authority for reluctant, provisional or "ball-park" figures: no known reliance, no reasonable reliance, no
      duty.
    verify: false
  - slug: esanda-finance-corp-v-pmh
    name: Esanda Finance Corp v PMH
    citation: (1997) 188 CLR 241
    aglc: Esanda Finance Corp v PMH (1997) 188 CLR 241
    facts: >-
      Esanda lent money to companies associated with Excel, taking Excel's guarantee in reliance on its accounts. PMH
      had audited and certified Excel's accounts. Esanda alleged PMH were negligent and that it consequently suffered
      economic loss after Excel was placed into receivership.
    issue: Whether PMH, as auditors, owed Esanda (a financier relying on the audited accounts) a duty of care.
    held: >-
      The High Court held that no such duty existed — there were no circumstances which might serve to establish any
      relationship of proximity between Esanda and PMH. Pleading that Esanda belonged to a class who might reasonably
      rely on audited accounts was not enough: there was no request, no intention to induce Esanda to act, and no
      assumption of responsibility.
    ratio: >-
      Mere foreseeability of pure economic loss does not give rise to a duty of care; the law requires, in addition, a
      special relationship (proximity) between the parties, shown by factors such as reasonable reliance, the nature
      of the relationship, special skill or knowledge, knowledge of reliance and assumption of responsibility (Dawson
      J).
    significance: >-
      Leading High Court case on negligent misstatement; McHugh J's policy reasons against auditors' liability to
      third parties — higher auditing costs, more complex litigation, indeterminate liability and difficulty proving
      reliance.
    why-here: The first case to go to for pure economic loss caused by negligent words.
    verify: false
  - slug: mallonland-pty-ltd-v-advanta-seeds-pty-ltd
    name: Mallonland Pty Ltd v Advanta Seeds Pty Ltd
    citation: "[2024] HCA 25"
    aglc: Mallonland Pty Ltd v Advanta Seeds Pty Ltd [2024] HCA 25
    facts: >-
      Not set out in the week's materials. The lecture places it alongside cases of pure economic loss caused by an
      act.
    issue: What "assumption of responsibility" means for a duty of care to avoid pure economic loss.
    held: >-
      No duty of care was found. The High Court said "assumption of responsibility" is imprecise; it is understood as
      an undertaking to take on a task from which acceptance of reasonable care can be inferred.
    ratio: >-
      Assumption of responsibility is understood as an undertaking to take on a task from which acceptance of
      reasonable care can be inferred; the circumstances must be worked through step by step.
    significance: >-
      Recent High Court caution: a case resembling earlier duty cases does not guarantee a duty; the language of
      "assumption of responsibility" must be used precisely.
    why-here: Cite for what "assumption of responsibility" means today.
    verify: true
  - slug: anchorage-capital-master-offshore-ltd-v-sparkes
    name: Anchorage Capital Master Offshore Ltd v Sparkes
    citation: (2023) 111 NSWLR 304
    aglc: Anchorage Capital Master Offshore Ltd v Sparkes (2023) 111 NSWLR 304
    facts: Lenders relied on false financial notices from the borrower's officers. The company collapsed.
    issue: Whether the borrower's officers owed the lenders a duty of care for the false notices.
    held: >-
      No duty. The lenders were sophisticated commercial parties able to protect themselves by contract; they could
      have obtained the information themselves, and this was not the only source of it.
    ratio: Sophisticated commercial parties able to protect themselves by contract are not vulnerable.
    significance: Recent illustration of vulnerability as a separate salient factor defeating a misstatement claim.
    why-here: Use against a duty where the plaintiff is a sophisticated commercial party who could have protected itself.
    verify: false
  - slug: accc-v-kimberly-clark-australia
    name: ACCC v Kimberly-Clark Australia
    citation: "[2019] FCA 992; [2020] FCAFC 107"
    aglc: ACCC v Kimberly-Clark Australia [2019] FCA 992; [2020] FCAFC 107
    facts: >-
      The ACCC brought action on two counts concerning wipes: whether they were "flushable" and whether they were
      "made in Australia".
    issue: >-
      Whether the "flushable" and "made in Australia" claims were misleading or deceptive under the Australian
      Consumer Law.
    held: >-
      The Federal Court found the "made in Australia" claim was false and misleading — the wipes were made elsewhere —
      but ruled that Kimberly-Clark had not made false and misleading claims about the "flushable" wipes; that ruling
      was upheld on appeal by the Full Federal Court. Kimberly-Clark had faced similar actions in the US and decided
      to settle out of court.
    ratio: >-
      A claim is assessed under s 18 by asking whether the conduct was misleading or deceptive; no duty of care or
      negligence need be shown.
    significance: An example of statutory liability for misstatements operating without the duty of care framework.
    why-here: Illustrates ACL s 18 as an alternative route for misstatements made in trade or commerce.
    verify: false
  - slug: caltex-oil-v-dredge-willemstad
    name: Caltex Oil v Dredge 'Willemstad'
    citation: (1976) 136 CLR 529
    aglc: Caltex Oil v Dredge 'Willemstad' (1976) 136 CLR 529
    facts: >-
      The defendant dredge negligently damaged an oil pipeline running across a bay. Caltex did not claim for the
      small amount of property damage but instead claimed pure economic loss, being the significant expenses of
      transporting the oil by road around the bay.
    issue: Whether the defendant owed Caltex a duty of care in respect of its pure economic loss.
    held: The Court held that the defendant owed a duty of care to Caltex.
    ratio: A duty of care to avoid pure economic loss caused by a negligent act can arise in Australian law.
    significance: >-
      Shows the High Court found a duty for PEL caused by an act even before the salient factors approach was firmly
      established; also shows how framing the claim determines how it is treated.
    why-here: A precedent to compare (or distinguish) when PEL is caused by physical interference with infrastructure.
    verify: false
  - slug: bryan-v-maloney
    name: Bryan v Maloney
    citation: (1995) 182 CLR 608
    aglc: Bryan v Maloney (1995) 182 CLR 608
    facts: >-
      A builder constructed a house with defective foundations. Mrs Maloney, who was the third owner since the
      construction, noticed cracks in the walls due to the defective foundations.
    issue: Whether a builder owes a subsequent purchaser of a house a duty of care to avoid pure economic loss.
    held: >-
      The High Court ruled that a builder owed a duty of care to a subsequent purchaser to take reasonable care in the
      building of a house.
    ratio: >-
      Using the proximity principle, a builder of a dwelling owes a subsequent purchaser a duty to take reasonable
      care in its construction, to avoid pure economic loss from latent defects.
    significance: >-
      Drew a distinction between the construction of dwellings and other buildings (a homeowner being more vulnerable
      and less sophisticated); reconsidered in Woolcock.
    why-here: The common law authority for a duty to a later homeowner for latent defects.
    verify: false
authorities:
  - slug: australian-consumer-law-s18
    title: Australian Consumer Law s 18
    kind: statute
    text: >-
      A person must not, in trade or commerce, engage in conduct that is misleading or deceptive or is likely to
      mislead or deceive.
    gloss: >-
      Statutory liability for misleading or deceptive conduct (words or conduct) in trade or commerce, with no need to
      establish a duty of care or prove negligence.
    cases:
      - accc-v-kimberly-clark-australia
    verify: false
  - slug: design-and-building-practitioners-act-2020-nsw-s37
    title: Design and Building Practitioners Act 2020 (NSW) s 37
    kind: statute
    text: >-
      (1) A person who carries out construction work has a duty to exercise reasonable care to avoid economic loss
      caused by defects— (a) in or related to a building for which the work is done, and (b) arising from the
      construction work. (2) The duty of care is owed to each owner of the land in relation to which the construction
      work is carried out and to each subsequent owner of the land. (3) A person to whom the duty of care is owed is
      entitled to damages for the breach of the duty as if the duty were a duty established by the common law.
    gloss: >-
      A statutory duty to avoid economic loss from construction defects, owed to every owner and subsequent owner, so
      no common law duty needs to be established.
    cases:
      - bryan-v-maloney
      - woolcock-street-investments-pty-ltd-v-cdg-pty-ltd
    verify: false
  - slug: design-and-building-practitioners-act-2020-nsw-s36
    title: Design and Building Practitioners Act 2020 (NSW) s 36
    kind: statute
    text: >-
      Paraphrase (Topic 7 Lecture 2, slide 17): "construction work" is defined broadly — in addition to building work,
      it includes the preparation of designs, the manufacture or supply of building products, and supervision,
      coordination or project management over building work.
    gloss: >-
      Defines "construction work" widely, so designers, product suppliers and project managers are caught by the s 37
      duty, not only builders.
    cases: []
    verify: true
  - slug: design-and-building-practitioners-act-2020-nsw-ss39-40
    title: Design and Building Practitioners Act 2020 (NSW) ss 39–40
    kind: statute
    text: >-
      Paraphrase (Topic 7 Lecture 2, slide 15): the s 37 duty is non-delegable (s 39), and the duty cannot be
      contracted out (s 40).
    gloss: A builder cannot shift the s 37 duty to a subcontractor or exclude it by contract.
    cases: []
    verify: true
questions:
  - key: q001
    type: mcq
    concept: pure-economic-loss-and-policy
    difficulty: 1
    stem: Which definition of pure economic loss (PEL) matches the lecture?
    options:
      - text: Economic loss which does not result from any physical injury to the person or property.
        correct: true
        why: >-
          Correct — this is the slide definition word for word. The defining feature is the absence of any physical
          injury or property damage from which the money loss flows.
      - text: Any economic loss suffered by a plaintiff, whether or not it follows a physical injury.
        why: >-
          Tempting because it is broader and sounds inclusive, but it sweeps in consequential economic loss such as
          lost wages after an injury, which the lecture treats as a separate, unproblematic category.
      - text: Economic loss caused only by negligent words, as opposed to negligent acts.
        why: >-
          Tempting because Lecture 1 focuses on negligent words, but the lecture says PEL may be caused by negligent
          words, acts or omissions — the cause does not define the category.
      - text: Economic loss that is caused intentionally, such as by deceit or passing off.
        why: >-
          Wrong — the lecture says PEL can be caused intentionally, negligently or innocently; intentional "economic
          torts" are one source of PEL but outside this unit, not its definition.
    set: pretest
  - key: q002
    type: mcq
    concept: pure-economic-loss-and-policy
    difficulty: 1
    stem: Which of these losses is consequential economic loss rather than pure economic loss?
    options:
      - text: Investment losses due to negligent financial advice.
        why: >-
          Tempting because it is a money loss caused by negligence, but no physical injury or property damage comes
          first, so the slide lists it as pure economic loss.
      - text: Medical expenses due to a physical injury.
        correct: true
        why: >-
          Correct — the slide lists medical expenses due to physical injury as consequential economic loss: the money
          loss flows from a physical injury, so foreseeability is typically enough.
      - text: Diminished property value due to an architect's defective advice.
        why: >-
          Wrong — the slide gives this as an example of pure economic loss; the property itself was not physically
          damaged by the advice, only its value fell.
      - text: Loss of profit due to electrical cable damage to a cable the plaintiff does not own.
        why: >-
          Tempting because a cable was physically damaged, but the plaintiff suffered no injury and none of its own
          property was damaged — the slide treats the lost profit as pure economic loss.
  - key: q003
    type: mcq
    concept: pure-economic-loss-and-policy
    difficulty: 2
    stem: >-
      A council crew negligently cuts the power cable to a cake shop. The shop cannot bake for two days and loses its
      profits, but nothing in the shop is damaged. How is the loss classified?
    options:
      - text: Consequential economic loss, because a physical object (the cable) was damaged.
        why: >-
          Tempting because something physical was cut, but the cable was not the plaintiff's property and the
          plaintiff suffered no injury, so nothing physical lies behind the plaintiff's own loss.
      - text: Pure economic loss — no injury, and no damage to the shop owner's property.
        correct: true
        why: >-
          Correct — this is the lecturer's own example. The lost profits are the initial harm, not a consequence of
          injury or property damage, so it is PEL.
      - text: Not a loss at all in negligence, because lost profits can never be recovered.
        why: >-
          Wrong — PEL is recoverable in certain situations if additional conditions are satisfied; the lecture never
          says lost profits are irrecoverable as a class.
  - key: q004
    type: mcq
    concept: pure-economic-loss-and-policy
    difficulty: 2
    variant-of: q003
    stem: >-
      Same council, same cut cable — but this time the power surge short-circuits the cake shop's fridge, which
      breaks, and the stock spoils. How does the classification change?
    options:
      - text: There is now property damage, so the losses flowing from it are consequential economic loss.
        correct: true
        why: >-
          Correct — the lecturer changes the facts in exactly this way: the broken fridge and spoiled stock are
          property damage, and the related losses become consequential.
      - text: "It does not change: losses following a cable cut are always pure economic loss."
        why: >-
          Tempting if you focus on the cable, but the classification turns on whether the plaintiff's own person or
          property was damaged — here the fridge and stock were.
      - text: The fridge damage is pure economic loss and only the lost profits are consequential.
        why: >-
          Wrong way round — the broken fridge and spoiled stock are physical property damage; it is the money losses
          that follow from them which are consequential.
  - key: q005
    type: mcq
    concept: pure-economic-loss-and-policy
    difficulty: 2
    stem: >-
      Why does the distinction between consequential economic loss and pure economic loss matter, according to the
      lecture?
    options:
      - text: Because consequential economic loss must always be claimed in contract rather than in tort.
        why: >-
          Wrong — the lecture says consequential economic loss after a physical injury has never been a problem in
          negligence; nothing requires it to be claimed in contract.
      - text: PEL was not recoverable until recently, and even now needs additional conditions.
        correct: true
        why: >-
          Correct — this is the slide's explanation: consequential loss rides on the physical injury, but PEL needs
          more than reasonable foreseeability before a duty is found.
      - text: Because the Civil Liability Act excludes economic loss from its definition of "harm".
        why: >-
          Tempting because the CLA does treat some heads of loss specially, but s 5 expressly includes economic loss
          in "harm" — the distinction comes from the common law duty cases.
  - key: q006
    type: mcq
    concept: pure-economic-loss-and-policy
    difficulty: 1
    stem: >-
      Which list matches the three policy considerations the lecture gives for courts' general reluctance to allow
      recovery of PEL?
    options:
      - text: >-
          Indeterminate liability; the plaintiff's own contributory negligence; and the cost of the defendant's
          insurance cover.
        why: >-
          Tempting because indeterminate liability is right, but contributory negligence and insurance are not on the
          slide's list of policy considerations for PEL.
      - text: Floodgates; the defendant's autonomy; the coherence of the criminal law.
        why: >-
          Tempting because autonomy and coherence appear later as salient factors, but they are not the three policy
          considerations listed on the PEL concept slide.
      - text: >-
          Indeterminate liability; the relationship with the law of contract; loss linked to a lawful commercial
          activity.
        correct: true
        why: >-
          Correct — these are the three policy considerations on the slide, each explaining why a duty for money loss
          is approached cautiously.
  - key: q007
    type: mcq
    concept: pure-economic-loss-and-policy
    difficulty: 2
    stem: >-
      A finance commentator tells a podcast audience to "go out and buy" a new cryptocurrency. It collapses in value.
      Which policy concern most strongly tells against a duty to listeners?
    options:
      - text: Indeterminate liability — there is no way of defining who heard and relied on the statement.
        correct: true
        why: >-
          Correct — the lecturer uses this very kind of example: the class of listeners cannot be bounded, so the
          courts would be very reluctant to find a duty.
      - text: The relationship with the law of contract — the listeners had negotiated terms with the podcaster.
        why: >-
          Wrong — there is no negotiated contract between a podcaster and anonymous listeners; the contract concern
          applies where parties have bargained over their relationship.
      - text: >-
          Loss linked to lawful commercial activity — selling cryptocurrency is lawful, so loss from it is never
          compensable.
        why: >-
          Tempting because the coin may be lawful, but this policy concern is about losses from legitimate
          competition, not about negligent advice to buy something.
  - key: q008
    type: mcq
    concept: pure-economic-loss-and-policy
    difficulty: 3
    stem: Which statement about indeterminate liability best reflects the lecture?
    options:
      - text: A duty for PEL is never owed to a large class of plaintiffs, however clearly that class is defined.
        why: >-
          Tempting because large numbers sound like floodgates, but the lecture says a large class is not necessarily
          a problem; the concern is a class that cannot be narrowed or defined.
      - text: A large class is not necessarily a problem; the concern is a class that cannot be narrowed or defined.
        correct: true
        why: >-
          Correct — the lecturer stresses it depends on the circumstances: if you cannot put boundaries around who
          might suffer loss, the courts will not find a duty.
      - text: >-
          Indeterminacy stops mattering once reasonable foreseeability of the loss has been established on the facts
          of the case.
        why: >-
          Wrong — foreseeability is necessary but not sufficient for PEL; indeterminacy is one of the very reasons
          more than foreseeability is needed.
  - key: q009
    type: mcq
    concept: pure-economic-loss-and-policy
    difficulty: 2
    stem: >-
      Two parties to a construction contract negotiated detailed terms about who bears the risk of delay. One later
      sues the other in negligence for pure economic loss outside those terms. Which policy consideration is most
      engaged?
    options:
      - text: Indeterminate liability.
        why: >-
          Tempting because it is the most famous PEL concern, but here the plaintiff is one identified contracting
          party, so the class is perfectly determinate.
      - text: The relationship with the law of contract.
        correct: true
        why: >-
          Correct — where parties have negotiated the terms of their relationship, courts are reluctant in a
          commercial setting to impose additional obligations through a duty of care.
      - text: Loss linked to a lawful commercial activity.
        why: >-
          Wrong — this concern is about losses from legitimate activity such as competition; the problem here is that
          the parties already allocated risk by bargain.
  - key: q010
    type: mcq
    concept: pure-economic-loss-and-policy
    difficulty: 2
    variant-of: q009
    stem: >-
      A supermarket that has traded in a town for 30 years loses profits when a rival opens down the road. Why will no
      duty of care be owed for that loss?
    options:
      - text: It is loss linked to a lawful commercial activity — competition is the nature of commerce.
        correct: true
        why: >-
          Correct — the lecturer gives this exact example: competition can cause PEL, but courts will say no to
          imposing a duty of care for it.
      - text: Because the loss is consequential economic loss and so must be claimed in contract.
        why: >-
          Wrong — the lost profits are pure economic loss (no injury or property damage), and there is no contract
          between rival supermarkets at all.
      - text: Because the rival did not act intentionally, so no economic tort is available.
        why: >-
          Tempting because economic torts were mentioned, but they are outside this unit; the reason given is the
          policy consideration about lawful commercial activity.
  - key: q011
    type: mcq
    concept: pure-economic-loss-and-policy
    difficulty: 3
    stem: >-
      Why is a plaintiff with consequential economic loss usually able to "just Donoghue and Stevenson it", in the
      lecturer's phrase?
    options:
      - text: Because consequential losses are always smaller, so indeterminacy never arises in practice.
        why: >-
          Wrong — the size of a consequential loss can be large (20 years of lost wages); the reason is the physical
          injury that grounds the claim, not the amount.
      - text: Because the CLA presumes a duty of care whenever physical injury and economic loss coincide.
        why: >-
          Tempting because the CLA is everywhere in negligence, but no CLA provision creates such a presumption; the
          point comes from the common law paradigm.
      - text: In the paradigm physical-harm case, reasonable foreseeability is typically enough.
        correct: true
        why: >-
          Correct — once there is physical harm in the paradigm case, foreseeability carries the duty question, and
          the economic losses flow on as consequential.
  - key: q012
    type: mcq
    concept: pure-economic-loss-and-policy
    difficulty: 3
    contrasts-with:
      - laws2400-w05-reasonable-foreseeability-meaning
    stem: >-
      A student argues: "Because PEL is now a recognised form of harm, a negligent defendant who foreseeably causes
      PEL owes a duty." What is wrong with this?
    options:
      - text: Nothing — once a type of harm is recognised, reasonable foreseeability of that harm is enough for a duty.
        why: >-
          Tempting because that is how the physical-injury paradigm works, but the lecture stresses that recognition
          means a duty can arise, not that it always will.
      - text: >-
          Recognition means a duty can arise, not that it will; foreseeability is necessary but more is needed for
          PEL.
        correct: true
        why: >-
          Correct — the lecturer says PEL "can, but that doesn't mean it always will", and the cases supply the
          additional features required beyond foreseeability.
      - text: PEL is not a recognised form of harm in Australia, so no duty can ever arise for it.
        why: >-
          Wrong — PEL is recognised (and CLA s 5 includes economic loss in "harm"); the issue is the extra conditions,
          not whether the harm exists in law.
  - key: q013
    type: mcq
    concept: pure-economic-loss-and-policy
    difficulty: 2
