  - key: q060
    type: short
    concept: reliance-and-knowledge-shaddock-san-sebastian-tepko
    difficulty: 4
    cases:
      - shaddock-and-associates-pty-ltd-v-parramatta-city-council
    prompt: >-
      Harbourside Developments asks Riverton Council whether a proposed light-rail corridor will affect a block it is

      about to buy. A planning officer replies by phone: "No — nothing affects that block." The developer asks for
      written

      confirmation; the council issues a formal certificate saying the same. In fact a corridor proposal, on the
      council's

      own files, runs through the block. The developer buys, the corridor is announced, and the block loses most of
      its

      value. Advise whether the council owed Harbourside a duty of care.
    model: >-
      The issue is whether the council owed a duty of care to avoid pure economic loss caused by negligent words. The

      loss is PEL: the block lost value with no physical damage. Reasonable foreseeability is necessary but not
      sufficient;

      the cases require features showing a special relationship. Shaddock & Associates v Parramatta City Council is
      closely

      analogous: a council told an intending purchaser, by phone and then by certificate, that no road-widening
      proposal

      affected the land, and a duty was found. The duty covers information as well as advice, and there is no separate

      requirement that the speaker possess special skill. Here, as in Shaddock, the council was the only source of the

      information about its own proposals; it knew the inquiry came from a prospective purchaser, so it knew or ought
      to

      have known of the reliance; and the developer's reliance on a formal certificate was reasonable. The court in

      Shaddock suggested the phone call alone might not have been enough; here, as there, the certificate confirms it.

      This is unlike Tepko, where a reluctant ball-park estimate was not reasonably relied on, and unlike San
      Sebastian,

      where reliance on a statement of intention was unreasonable — here the statement was one of existing fact. Being
      a

      public authority does not prevent a duty. Conclusion: the council very likely owed Harbourside a duty of care.
    rubric:
      - id: r1
        criterion: Identifies the issue as a duty for PEL by negligent misstatement
        marks: 2
        top-band: Classifies the loss as PEL and notes foreseeability is necessary but not sufficient.
        margin-note: Classify first — this is a words case, not an acts case.
        authorities: []
      - id: r2
        criterion: States the law from Shaddock
        marks: 3
        top-band: Information as well as advice; no separate special-skill requirement; public authority can owe a duty.
        margin-note: Cite the case for the proposition, not just the name.
        authorities: []
      - id: r3
        criterion: Applies sole source, knowledge and reasonable reliance
        marks: 3
        top-band: >-
          Shows the council was the only source, knew or ought to have known of reliance, and that relying on a
          certificate of fact was reasonable; notes call plus certificate.
        margin-note: This is where the marks are — tie each fact to a feature.
        authorities: []
      - id: r4
        criterion: Distinguishes Tepko and San Sebastian and concludes
        marks: 2
        top-band: >-
          Contrasts a provisional estimate and a statement of intention with a certificate of existing fact, then
          concludes a duty is likely.
        margin-note: Good use of the contrasting cases to sharpen the conclusion.
        authorities: []
  - key: q061
    type: mcq
    concept: esanda-and-misstatement-salient-features
    difficulty: 1
    cases:
