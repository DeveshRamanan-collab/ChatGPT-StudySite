  - key: q064
    type: mcq
    concept: esanda-and-misstatement-salient-features
    difficulty: 2
    cases:
      - esanda-finance-corp-v-pmh
    stem: According to the lecturer's account of Esanda, what is the purpose of an audit?
    options:
      - text: To protect anyone who might lend to or invest in the company.
        why: >-
          Tempting because many people do read audited accounts, but the Court said the audit is not for investors or
          financiers to rely on.
      - text: To inform the company and its shareholders.
        correct: true
        why: >-
          Correct — the purpose is to inform the company and shareholders about the company's financial position,
          which is why lenders like Esanda fell outside it.
      - text: To give regulators a basis for prosecuting directors who keep false accounts.
        why: >-
