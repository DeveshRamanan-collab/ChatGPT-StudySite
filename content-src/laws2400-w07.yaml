        why: >-
          Wrong — this is the reverse: s 18 removes the need to establish a duty of care, which common law negligent
          misstatement requires.
      - text: That the conduct occurred in trade or commerce.
        correct: true
        why: >-
          Correct — "in trade or commerce" is a threshold for s 18 that the common law tort does not have; that is why
          the common law remains relevant outside trade or commerce.
      - text: That the defendant was negligent.
        why: >-
          Wrong — under s 18 there is no need to prove negligence; negligence is a common law requirement, not a
          statutory one.
