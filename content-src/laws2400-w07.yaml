  - key: q120
    type: short
    concept: acl-s18-misleading-or-deceptive-conduct
    difficulty: 3
    prompt: >-
      Tilda buys a "solar-ready" caravan from Coastline Caravans Pty Ltd after the salesperson tells her it can run

      entirely off-grid. It cannot, and she spends $12,000 on a new electrical system. Her neighbour, Ross, says at a

      street party that he once worked in caravan sales and "those Coastline vans are all fine off-grid"; Ross's
      comment

      was one reason Tilda chose Coastline. Advise Tilda on the routes available against Coastline and against Ross.
    model: >-
      The issue is which routes Tilda has for her pure economic loss caused by misstatements. Against Coastline, the

      easier route is Australian Consumer Law s 18: "A person must not, in trade or commerce, engage in conduct that
      is

      misleading or deceptive or is likely to mislead or deceive." A dealer's sales statement is plainly in trade or

      commerce. Section 18 covers words as well as conduct, and negligent as well as intentional statements. Tilda
      need

      not establish a duty of care or prove negligence — only that the conduct was misleading or deceptive, plus a
      causal

      link (the loss arose "because of" it), which is nowhere near as demanding as at common law. She can also plead

      negligent misstatement in the alternative; the lecture says both can be argued. Against Ross, s 18 is likely

      unavailable: a comment at a street party by a neighbour is not conduct in trade or commerce, so the common law

      remains relevant. But a duty is unlikely: Lord Reid in Hedley Byrne said there can be no duty for opinions on
      social

      or informal occasions; Ross did not assume responsibility, and reliance on a casual comment is hardly
      reasonable,

      even with his past experience. Conclusion: Tilda should sue Coastline under s 18; a claim against Ross would
      very

      likely fail.
    rubric:
      - id: r1
        criterion: Identifies s 18 and its elements
        marks: 3
        top-band: Quotes or accurately paraphrases s 18 and identifies trade or commerce and misleading or deceptive conduct.
        margin-note: Good — the statutory text is the starting point.
        authorities: []
      - id: r2
        criterion: Explains the advantages of s 18 over negligence
        marks: 2
        top-band: No duty of care, no negligence, covers words and conduct; causal link still needed but far less demanding.
        margin-note: Spell out why it is easier, not just that it is.
        authorities: []
      - id: r3
        criterion: Applies the trade or commerce limit to Ross
        marks: 3
        top-band: >-
          Explains that a neighbour's social comment is outside trade or commerce, so only the common law could apply,
          and analyses it via Hedley Byrne.
        margin-note: This contrast is what the question is testing.
        authorities: []
      - id: r4
        criterion: Concludes on each defendant
        marks: 2
        top-band: >-
          Reaches reasoned conclusions: s 18 against Coastline (with negligence pleaded in the alternative); a common
          law claim against Ross is weak.
        margin-note: Two defendants, two conclusions.
        authorities: []
