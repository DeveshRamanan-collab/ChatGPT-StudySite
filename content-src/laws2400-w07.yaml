  - key: q100
    type: short
    concept: disclaimers-and-vulnerability
    difficulty: 4
    cases:
      - hedley-byrne-v-heller
      - anchorage-capital-master-offshore-ltd-v-sparkes
    prompt: >-
      Orchid Capital, a large investment fund with its own analysts, buys a stake in Pelham Ltd after reading a market

      report prepared by Pelham's consultant, Vance. The report's cover says: "Prepared for Pelham's board. Vance
      accepts no

      responsibility to any other person." Inside, Vance notes: "Several figures supplied by management have not been

      independently checked." Orchid could have commissioned its own due diligence but did not. The figures prove

      wrong and Orchid loses heavily. Advise Orchid on whether Vance owed it a duty of care.
    model: >-
      The issue is whether Vance owed Orchid a duty of care to avoid pure economic loss caused by negligent words. The
      loss

      is PEL. Reasonable foreseeability is likely — an investor might read and rely on a market report — but it is

      necessary, not sufficient (Esanda). Three features tell against a duty. First, the cover is a disclaimer of

      responsibility to anyone other than Pelham's board. A disclaimer is one factor against a duty arising; in Hedley

      Byrne v Heller the "without responsibility" reference meant no duty arose, and a disclaimer goes directly to

      reliance. Second, the internal note is a warning that care has not been taken; the slide distinguishes this from
      a

      disclaimer — it goes to whether reliance was reasonable — and here it makes Orchid's reliance on unchecked
      figures

      less reasonable. Third, vulnerability: in Anchorage Capital Master Offshore v Sparkes, sophisticated commercial

      parties able to protect themselves were not vulnerable. Orchid is a large fund with its own analysts, could have

      commissioned due diligence, and the report was not its only source. There is also no sign Vance knew of Orchid's

      reliance or assumed responsibility toward it (Mallonland: an undertaking from which acceptance of care can be

      inferred). Conclusion: Vance very likely owed Orchid no duty.
    rubric:
      - id: r1
        criterion: Identifies the issue and the need for more than foreseeability
        marks: 2
        top-band: Classifies the loss as PEL by words and states foreseeability is necessary but not sufficient.
        margin-note: Clean framing.
        authorities: []
      - id: r2
        criterion: Analyses the disclaimer and the warning separately
        marks: 3
        top-band: >-
          Treats the cover as a disclaimer (Hedley Byrne) and the internal note as a warning going to reasonable
          reliance.
        margin-note: This distinction is the heart of the question — reward precision.
        authorities: []
      - id: r3
        criterion: Applies vulnerability using Anchorage
        marks: 3
        top-band: >-
          Uses Orchid's sophistication, analysts, ability to do due diligence and other sources to show it was not
          vulnerable.
        margin-note: Good — facts tied to the Anchorage proposition.
        authorities: []
      - id: r4
        criterion: Considers assumption of responsibility and concludes
        marks: 2
        top-band: Notes no knowledge of reliance or undertaking toward Orchid (Mallonland) and concludes no duty.
        margin-note: A firm conclusion, please.
        authorities: []
