      - text: PMH had audited and certified Excel's accounts.
        correct: true
        why: >-
          Correct — PMH were Excel's auditors; Esanda alleged PMH were negligent in that work and that it suffered
          economic loss when Excel went into receivership.
      - text: PMH was the receiver appointed after Excel collapsed, and it sold Excel's assets at an undervalue.
        why: >-
          Tempting because receivership is in the facts, but PMH's role was auditing Excel's accounts before the
          collapse, not acting as receiver.
  - key: q062
    type: mcq
    concept: esanda-and-misstatement-salient-features
    difficulty: 1
    cases:
      - esanda-finance-corp-v-pmh
    stem: What did the High Court decide in Esanda?
    options:
      - text: PMH owed Esanda a duty because loss to lenders relying on audited accounts was reasonably foreseeable.
        why: >-
          Tempting because foreseeability was present, but Dawson J held that mere foreseeability of PEL does not give
