    prompt: >-
      GreenSeed Pty Ltd sells fruit-fly-infested citrus seedlings to Orchard A. Under state regulations, no fruit
      grown

      within 15 km of a confirmed fruit-fly outbreak may be sold interstate for a season. Orchard B, 5 km from Orchard
