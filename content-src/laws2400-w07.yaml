      - text: >-
          Reasonable reliance, nature of relationship, special skill or knowledge, knowledge of reliance, assumption
          of responsibility.
        correct: true
        why: >-
          Correct — these are the five factors on the Esanda slide, each going to the relationship between the speaker
          and the person relying.
      - text: Physical proximity, a contract, payment, a written statement and a request.
        why: >-
          Wrong — Esanda's "proximity" was a relationship, not physical nearness, and none of these items is on the
          slide's list.
