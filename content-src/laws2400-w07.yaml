    model: >-
      The issue is whether GreenSeed owed Orchard B a duty of care to avoid pure economic loss caused by an act — the

      sale of infested seedlings. The loss is PEL: Orchard B has no fruit fly and no physical damage; it lost the
      ability to

      sell interstate. In England no duty is generally imposed for PEL caused by an act, but Australian courts may
      find one

      by applying the salient factors approach, incrementally. The leading case is Perre v Apand, on almost identical

      facts: Apand sold diseased seed to Sparnon; the Perres, 3 km away with no disease and no contract, lost access
      to the

      WA market under a 20 km rule; the High Court held a duty was owed. Following McHugh J's questions: (1) loss to

      growers nearby was reasonably foreseeable; (2) liability is not indeterminate, because the 15 km rule defines an

      ascertained class; (3) a duty would not unreasonably burden GreenSeed's autonomy — it is asked only to take care
      in

      selling seedlings; (4) Orchard B was vulnerable, having no control over its neighbour's choice of supplier; and
      (5)

      GreenSeed knew the regulations and so knew its conduct could harm growers like Orchard B. Coherence of law

      (Sullivan v Moody) is not threatened. Conclusion: by analogy with Perre, GreenSeed very likely owed Orchard B a
      duty.
