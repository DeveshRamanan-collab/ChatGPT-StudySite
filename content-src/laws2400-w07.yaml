cards:
  - type: basic
    concept: pure-economic-loss-and-policy
    front: What is pure economic loss (PEL)?
    back: An economic loss which does not result from any physical injury to the person or property.
    source: Topic 7 Lecture 1, slide 5
  - type: basic
    concept: pure-economic-loss-and-policy
    front: What three policy considerations explain courts' reluctance to allow recovery of PEL?
    back: >-
      Indeterminate liability; the relationship with the law of contract; and loss linked to a lawful commercial
      activity.
    source: Topic 7 Lecture 1, slide 8
  - type: cloze
    concept: pure-economic-loss-and-policy
    text: >-
      Wage loss and medical expenses due to physical injury are {{c1::consequential}} economic loss; investment losses
      due to negligent financial advice are {{c2::pure}} economic loss.
    source: Topic 7 Lecture 1, slide 6
  - type: apply
    concept: pure-economic-loss-and-policy
    scenario: >-
      A council cuts a cable and a bakery cannot trade for two days; next door, the surge ruins a café's fridge and
      stock.
    answer: >-
      Bakery: PEL (no injury or property damage), so salient features are needed. Café: property damage, so its money
      losses are consequential and foreseeability typically suffices.
    source: Topic 7 Lecture 1, slide 6 and transcript
  - type: basic
    concept: negligent-words-from-deceit-to-hedley-byrne
    front: What did Derry v Peek (1889) decide about deceit?
    back: Negligent misstatement will not suffice for deceit — it must be an intentional or reckless misstatement.
    source: Topic 7 Lecture 1, slide 11
  - type: basic
    concept: negligent-words-from-deceit-to-hedley-byrne
    front: What two formulations of the duty for negligent words come from Hedley Byrne?
    back: >-
      Lord Reid: the inquirer trusts the speaker to take care, reasonably relies, and the speaker knows or ought to
      know of the reliance. Lord Morris: a person with special skill who undertakes to apply it for another who relies
      on it.
    source: Topic 7 Lecture 1, slide 12
  - type: cloze
    concept: negligent-words-from-deceit-to-hedley-byrne
    text: >-
      In Hedley Byrne, the reference was given "{{c1::without responsibility}}", so {{c2::no duty}} arose on the
      facts.
    source: Topic 7 Lecture 1, slide 12
  - type: basic
    concept: negligent-words-from-deceit-to-hedley-byrne
    front: What did Barwick CJ require for a duty in MLC v Evatt?
    back: >-
      Information or advice on a serious matter; the speaker realises (or should realise) they are being trusted; it
      is reasonable for the recipient to act on it — then a duty of reasonable care follows.
    source: Topic 7 Lecture 1, slide 13
  - type: basic
    concept: reliance-and-knowledge-shaddock-san-sebastian-tepko
    front: What two propositions come from Shaddock v Parramatta City Council?
    back: >-
      The duty covers information as well as advice, and there is no separate requirement that the speaker possess
      special skill.
    source: Topic 7 Lecture 1, slide 14
  - type: basic
    concept: reliance-and-knowledge-shaddock-san-sebastian-tepko
    front: Why did the claim fail in San Sebastian v Minister?
    back: >-
      The statement was one of intention, and relying on a mere intention was not reasonable (even though the reliance
      was genuine).
    source: Topic 7 Lecture 1, slide 15
  - type: cloze
    concept: reliance-and-knowledge-shaddock-san-sebastian-tepko
    text: >-
      In Tepko, no duty arose because the Board neither {{c1::knew nor should have known}} of the reliance, and
      reliance on a {{c2::reluctant, provisional}} estimate was not reasonable.
    source: Topic 7 Lecture 1, slide 16
  - type: apply
    concept: reliance-and-knowledge-shaddock-san-sebastian-tepko
    scenario: >-
      A water authority, after refusing twice, gives a "very rough" cost figure, which the landowner shows to a bank;
      it proves badly overstated.
    answer: "Tepko: no known reliance and no reasonable reliance on a reluctant, provisional estimate, so likely no duty."
    source: Topic 7 Lecture 1, slide 16
  - type: basic
    concept: esanda-and-misstatement-salient-features
    front: Why did the High Court find no duty in Esanda Finance Corp v PMH?
    back: >-
      No circumstances established a relationship of proximity: no request, no intention to induce Esanda to act, no
      assumption of responsibility; an audit informs the company and its shareholders.
    source: Topic 7 Lecture 1, slides 17-18 and transcript
  - type: cloze
    concept: esanda-and-misstatement-salient-features
    text: >-
      Dawson J in Esanda: the mere {{c1::foreseeability}} of harm does not, where the only harm is pure economic loss,
      give rise to a duty; the law also requires a {{c2::special relationship}} described as proximity.
    source: Topic 7 Lecture 1, slide 19
  - type: basic
    concept: esanda-and-misstatement-salient-features
    front: What were McHugh J's four policy reasons against auditors owing third parties a duty?
    back: >-
      Increased cost of auditing services; more complex litigation; risk of indeterminate liability; difficulties of
      proving reliance.
    source: Topic 7 Lecture 1, slide 21
  - type: basic
    concept: esanda-and-misstatement-salient-features
    front: List the salient features for duty in PEL by negligent misstatement from the lecture's closing slide.
    back: >-
      Reasonable foreseeability (necessary but not sufficient); indeterminacy; category of relationship; defendant's
      knowledge; reasonable reliance; assumption of responsibility; special skill; vulnerability. Not a rigid
      checklist.
    source: Topic 7 Lecture 1, slide 29
  - type: basic
    concept: disclaimers-and-vulnerability
    front: What is the difference between a disclaimer of responsibility and a warning that care has not been taken?
    back: >-
      A disclaimer of responsibility excludes the duty; a warning that care has not been taken goes to whether
      reliance was reasonable.
    source: Topic 7 Lecture 1, slide 22
  - type: cloze
    concept: disclaimers-and-vulnerability
    text: >-
      Mallonland v Advanta Seeds: "assumption of responsibility" is {{c1::imprecise}}; it is understood as an
      {{c2::undertaking to take on a task}} from which acceptance of reasonable care can be inferred.
    source: Topic 7 Lecture 1, slide 22
  - type: basic
    concept: disclaimers-and-vulnerability
    front: What does Anchorage Capital v Sparkes say about vulnerability?
    back: >-
      Sophisticated commercial parties able to protect themselves by contract are not vulnerable — no duty was owed to
      lenders who relied on false financial notices.
    source: Topic 7 Lecture 1, slide 23
  - type: apply
    concept: disclaimers-and-vulnerability
    scenario: >-
      A big investment fund with its own analysts relies on a company's optimistic notices without commissioning the
      independent report it was entitled to demand.
    answer: "Anchorage: a sophisticated party able to protect itself is not vulnerable, so a duty is unlikely."
    source: Topic 7 Lecture 1, slide 23
  - type: cloze
    concept: acl-s18-misleading-or-deceptive-conduct
    text: >-
      ACL s 18: "A person must not, in {{c1::trade or commerce}}, engage in conduct that is {{c2::misleading or
      deceptive}} or is likely to mislead or deceive."
    source: Topic 7 Lecture 1, slide 24
  - type: basic
    concept: acl-s18-misleading-or-deceptive-conduct
    front: What does a plaintiff not need to prove under ACL s 18 that it would need at common law?
    back: A duty of care, or negligence — what needs to be proved is misleading or deceptive conduct (plus a causal link).
    source: Topic 7 Lecture 1, slide 25
  - type: basic
    concept: acl-s18-misleading-or-deceptive-conduct
    front: Why does the common law of negligent misstatement remain relevant despite s 18?
    back: For example, where the defendant is not engaging "in trade or commerce" — and a plaintiff can argue both.
    source: Topic 7 Lecture 1, slide 25
  - type: basic
    concept: acl-s18-misleading-or-deceptive-conduct
    front: What was decided in ACCC v Kimberly-Clark Australia?
    back: >-
      The "made in Australia" claim was false and misleading (the wipes were made elsewhere); the "flushable" claims
      were not, which the Full Federal Court upheld.
    source: Topic 7 Lecture 1, slide 27
  - type: basic
    concept: pel-caused-by-acts-perre-and-caltex
    front: How do England and Australia differ on PEL caused by an act?
    back: England generally imposes no duty; Australian courts may find one after applying the salient factors approach.
    source: Topic 7 Lecture 2, slide 3
  - type: basic
    concept: pel-caused-by-acts-perre-and-caltex
    front: What were McHugh J's questions in Perre v Apand, in order?
    back: >-
      Reasonably foreseeable? → indeterminate liability? → unreasonable burden on autonomy? → plaintiffs vulnerable? →
      did Apand know its conduct could harm people like the Perres?
    source: Topic 7 Lecture 2, slide 6
  - type: cloze
    concept: pel-caused-by-acts-perre-and-caltex
    text: >-
      In Perre v Apand, the WA rule barring potatoes grown within {{c1::20 km}} of bacterial wilt meant liability was
      not {{c2::indeterminate}}.
    source: Topic 7 Lecture 2, slides 4 and 6 and transcript
  - type: basic
    concept: pel-caused-by-acts-perre-and-caltex
    front: What did Caltex claim in Caltex Oil v Dredge 'Willemstad', and what was held?
    back: >-
      Not the minor pipeline damage but the significant cost of transporting oil by road around the bay (PEL); the
      dredge owed Caltex a duty of care.
    source: Topic 7 Lecture 2, slide 8
  - type: basic
    concept: defective-structures-and-the-dbpa
    front: What did Bryan v Maloney decide?
    back: >-
      A builder owed a duty of care to a subsequent purchaser (Mrs Maloney, the third owner) to take reasonable care
      in building a house; the Court used the proximity principle and distinguished dwellings from other buildings.
    source: Topic 7 Lecture 2, slides 11-12
  - type: basic
    concept: defective-structures-and-the-dbpa
    front: Why was there no duty in Woolcock Street Investments v CDG?
    back: No reliance or assumption of responsibility, and Woolcock, a commercial purchaser, was not vulnerable.
    source: Topic 7 Lecture 2, slide 14
  - type: cloze
    concept: defective-structures-and-the-dbpa
    text: >-
      Under the Design and Building Practitioners Act 2020 (NSW), the duty extends to all subsequent purchasers
      ({{c1::s 37}}), is non-delegable ({{c2::s 39}}) and cannot be contracted out ({{c3::s 40}}).
    source: Topic 7 Lecture 2, slide 15
  - type: apply
    concept: defective-structures-and-the-dbpa
    scenario: >-
      A third owner in NSW finds latent defects from the original builder's work; the builder used a subcontractor and
      its contract excluded liability to later owners.
    answer: >-
      DBPA s 37 gives a statutory duty to each subsequent owner; s 39 (non-delegable) and s 40 (no contracting out)
      defeat both of the builder's answers.
    source: Topic 7 Lecture 2, slides 15-16
audio:
  title: Week 7 recap — pure economic loss
  minutes: 3
  script: >-
    This week is pure economic loss: economic loss that doesn't come from any physical injury to a person or

    property. Lost wages after an injury are consequential and easy. Lost profits when someone cuts the cable to your

    shop are pure, and pure economic loss needs more than reasonable foreseeability. The reasons are policy:

    indeterminate liability, respect for what parties have bargained for in contract, and the fact that lawful

    competition causes loss all the time.


    Lecture one is negligent words. Derry v Peek said deceit needs an intentional or reckless statement, so careless

    words had no remedy until Hedley Byrne v Heller created liability for negligent misstatement where there's a
    special

    relationship: trust, reasonable reliance, and the speaker knowing or having reason to know of that reliance.
    Hedley

    Byrne itself lost, because the reference was given without responsibility. In Evatt, Barwick CJ put it as a
    serious

    matter, a speaker who realises they're trusted, and reliance that's reasonable.


    The Australian cases then test reliance. Shaddock found a duty for a council's wrong information about road
    widening:

    information counts, special skill isn't separately required. San Sebastian failed because relying on a statement
    of

    intention isn't reasonable. Tepko failed because the Board didn't know of the reliance and a reluctant ball-park

    figure can't reasonably be relied on. Esanda, the leading case, found auditors owed a lender nothing:
    foreseeability

    isn't enough, and there was no request, no intention to induce, and no assumption of responsibility.


    So the working list is foreseeability, indeterminacy, the category of relationship, the defendant's knowledge,

    reasonable reliance, assumption of responsibility, special skill and vulnerability — weighed, not ticked. A

    disclaimer counts against a duty, while a warning goes to reasonable reliance. Mallonland calls assumption of

    responsibility imprecise, and Anchorage says sophisticated commercial parties aren't vulnerable. In trade or
    commerce,

    Australian Consumer Law section 18 is often easier, because no duty of care is needed.


    Lecture two applies the same salient features approach to acts. In Perre v Apand, diseased seed sold to a
    neighbour

    cost the Perres their WA market; the twenty kilometre rule made the class determinate, the Perres were vulnerable,

    Apand knew the risk, and a duty was owed. Caltex Oil had already found a duty for the cost of trucking oil around
    a

    damaged pipeline.


    Finally, defective buildings. Bryan v Maloney gave a later homeowner a duty against the builder; Woolcock refused
    one

    to a commercial buyer who could protect itself. In New South Wales, the Design and Building Practitioners Act now
    does

    the work: section 37 gives every subsequent owner a statutory duty, which can't be delegated or contracted out.
