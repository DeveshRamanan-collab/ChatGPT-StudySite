  - key: q065
    type: mcq
    concept: esanda-and-misstatement-salient-features
    difficulty: 2
    cases:
      - esanda-finance-corp-v-pmh
    stem: Which proposition did Dawson J state in Esanda?
    options:
      - text: Where the only harm is pure economic loss, foreseeability of harm alone gives rise to a duty of care.
        why: >-
          Wrong way round — Dawson J said the opposite: mere foreseeability does not, where the only harm is PEL, give
          rise to a duty of care.
      - text: For PEL, the law requires, in addition to foreseeability, a special relationship described as proximity.
        correct: true
        why: >-
          Correct — Dawson J reasoned that a duty based on mere foreseeability of financial loss would extend
          liability "beyond acceptable bounds", so a special relationship is also required.
      - text: >-
          A duty for PEL arises only where the parties are in a direct contractual relationship with each other at the
          time.
        why: >-
          Wrong — Dawson J required a special relationship of proximity, not a contract; Shaddock and Perre show
          duties without contracts.
  - key: q066
    type: mcq
    concept: esanda-and-misstatement-salient-features
    difficulty: 3
    variant-of: q065
    cases:
      - esanda-finance-corp-v-pmh
    stem: Why, according to Dawson J, is mere foreseeability not enough for PEL?
    options:
      - text: It would extend liability in negligence beyond acceptable bounds.
        correct: true
        why: >-
          Correct — Dawson J's reason is that a duty imposed by reference to mere foreseeability of financial loss
          would extend liability beyond acceptable bounds.
      - text: Because financial loss is never foreseeable to a careful defendant.
        why: >-
          Wrong — the lecturer accepts that loss from relying on audited accounts is foreseeable; the problem is that
          foreseeability is not enough.
      - text: Because the Civil Liability Act excludes economic loss from the meaning of harm.
        why: >-
          Wrong — CLA s 5 includes economic loss in "harm"; Dawson J's reasoning is about keeping common law liability
          within bounds.
  - key: q067
    type: mcq
    concept: esanda-and-misstatement-salient-features
    difficulty: 2
    cases:
      - esanda-finance-corp-v-pmh
