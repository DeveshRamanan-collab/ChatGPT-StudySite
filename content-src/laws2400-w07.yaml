    options:
      - text: Because building contracts are void unless registered with the council.
        why: Wrong — nothing in the materials says so; the lecture says parties deal with obvious defects by contract.
      - text: To deal with latent defects.
        correct: true
        why: >-
          Correct — parties can deal with obvious defects through contract, but torts comes in for latent defects,
          which may surface years later for a later owner.
      - text: Because builders cannot be sued in contract by the person who paid for the building.
        why: >-
          Wrong — the lecture says the building process is heavily contract-focused; contract is available, but it
          does not reach latent defects found by later owners.
  - key: q142
    type: mcq
    concept: defective-structures-and-the-dbpa
    difficulty: 2
    contrasts-with:
      - pure-economic-loss-and-policy
    stem: >-
      A building defect causes a balcony to collapse onto a passer-by. How is this treated, compared with a defect
      that only reduces the building's value?
    options:
      - text: >-
          Physical injury: the builder or architect is generally liable to anyone foreseeably injured; a defect that
          only reduces value is PEL.
        correct: true
        why: >-
          Correct — the slide contrasts the two: physical injury falls within the ordinary paradigm, while a defect
          diminishing value has been viewed as PEL.
      - text: Both are pure economic loss, because both arise from a defect in the building.
        why: >-
          Tempting because both start with a defect, but an injury to a person is physical harm — the paradigm — not
          PEL.
      - text: Neither is recoverable, because builders owe duties only to the person who paid them.
        why: >-
          Wrong — the slide says builders and architects are generally liable to anyone foreseeably injured, and Bryan
          v Maloney shows a duty even to later owners.
  - key: q143
    type: mcq
    concept: defective-structures-and-the-dbpa
    difficulty: 2
    stem: In what ways may PEL from a defective structure arise, according to the slide?
    options:
      - text: Only through faulty construction by the builder on site.
        why: >-
          Wrong — the slide is broader: planning and design can also be negligent, which is why architects and
          engineers may be involved.
      - text: Because a building has been negligently planned, designed or built.
        correct: true
        why: >-
          Correct — the slide lists planning, design and building; negligence can occur at any stage and by different
          people.
      - text: Only where the owner has been physically injured by a collapse of the structure.
        why: >-
          Wrong — physical injury is the paradigm case, not PEL; PEL arises when the defect diminishes value without
          injury.
  - key: q144
    type: mcq
    concept: defective-structures-and-the-dbpa
    difficulty: 1
    cases:
      - bryan-v-maloney
    stem: In Bryan v Maloney, who was Mrs Maloney?
    options:
      - text: The builder's client who commissioned the house.
        why: >-
          Wrong — she was not the original client; she was the third owner since construction, which is what made the
          case difficult.
      - text: An engineer who certified the foundations.
        why: Wrong — she was a homeowner, not a professional involved in construction.
      - text: The third owner since construction.
        correct: true
        why: >-
          Correct — Mrs Maloney was the third owner; she noticed cracks in the walls caused by the defective
          foundations.
  - key: q145
    type: mcq
    concept: defective-structures-and-the-dbpa
    difficulty: 1
    cases:
      - bryan-v-maloney
    stem: What did the High Court rule in Bryan v Maloney?
    options:
      - text: A builder owed a subsequent purchaser a duty to take reasonable care in building a house.
        correct: true
        why: Correct — this is the slide's statement of the ruling; Mrs Maloney, as a later owner, was owed a duty.
      - text: A builder owes a duty only to the person who first contracts with it to build the house.
        why: >-
          Wrong — the decision is precisely that the duty extended beyond the original client to a subsequent
          purchaser.
      - text: No duty, because cracking walls are physical damage to property already owned by the plaintiff.
        why: Wrong — the defect was treated as PEL, and a duty was found; the claim did not fail.
    set: pretest
  - key: q146
    type: mcq
    concept: defective-structures-and-the-dbpa
    difficulty: 3
    cases:
      - bryan-v-maloney
    stem: Which two features of the reasoning in Bryan v Maloney does the slide highlight?
    options:
      - text: It applied the salient features approach and confined the duty to commercial buildings.
        why: >-
          Wrong on both limbs — Bryan used the proximity principle (pre-salient features), and its distinction
          favoured dwellings, not commercial buildings.
      - text: It used the proximity principle, and distinguished dwellings from other buildings.
        correct: true
        why: >-
          Correct — the slide says the Court used the proximity principle to impose a duty, and drew a distinction
          between the construction of dwellings and other buildings.
      - text: It relied on a statutory duty and held the builder's duty was non-delegable.
        why: Tempting because both appear in this topic, but they come from the 2020 Act, decades after Bryan v Maloney.
  - key: q147
    type: mcq
    concept: defective-structures-and-the-dbpa
    difficulty: 3
    variant-of: q146
    cases:
      - bryan-v-maloney
    contrasts-with:
      - disclaimers-and-vulnerability
    stem: Why does the dwelling/other-building distinction in Bryan matter?
    options:
      - text: >-
          Because houses are built to a higher technical standard than commercial buildings, so defects are more
          culpable.
        why: >-
          Wrong — the lecture does not reason from building standards; the distinction rests on the purchaser's
          vulnerability and sophistication.
      - text: Because only commercial buildings can suffer latent defects.
        why: Wrong — Bryan itself involved a latent defect in a house; latent defects occur in all buildings.
      - text: A homeowner is thought more vulnerable and less sophisticated than a commercial party.
        correct: true
        why: >-
          Correct — the lecturer explains the homeowner is seen as more vulnerable and less sophisticated than a
          business engaged in commercial enterprise.
  - key: q148
    type: mcq
    concept: defective-structures-and-the-dbpa
    difficulty: 2
    cases:
      - woolcock-street-investments-pty-ltd-v-cdg-pty-ltd
    stem: In Woolcock Street Investments v CDG, why was no geotechnical inspection done?
    options:
      - text: One of the owners refused to pay for it.
        correct: true
        why: >-
          Correct — the slide states that, as one of the owners refused to pay for a geotechnical inspection, it was
          not done.
      - text: The council exempted commercial buildings from inspection requirements at the time.
        why: >-
          Wrong — nothing in the materials refers to a council exemption; the inspection was not done because an owner
          refused to pay.
      - text: CDG forgot to order it, despite having been paid by the owners to arrange it.
        why: Wrong — the materials attribute the omission to an owner's refusal to pay, not to CDG forgetting.
  - key: q149
    type: mcq
    concept: defective-structures-and-the-dbpa
    difficulty: 2
    cases:
      - woolcock-street-investments-pty-ltd-v-cdg-pty-ltd
    stem: What did the High Court decide in Woolcock?
    options:
      - text: CDG owed Woolcock a duty, following Bryan v Maloney.
        why: >-
          Tempting because the facts also involve a later owner and a latent defect, but the Court decided the
          opposite way: no duty.
      - text: "No duty: no reliance or assumption of responsibility, and Woolcock was not vulnerable."
        correct: true
        why: >-
          Correct — these are the reasons on the slide; the lecturer adds that the commercial setting was a key
          difference from Bryan.
      - text: >-
          No duty, because designers can never be liable for defects in a building, only the builders who construct
          it.
        why: >-
          Wrong — the reasoning turned on reliance, responsibility and vulnerability; nothing says designers are
          immune.
  - key: q150
    type: mcq
    concept: defective-structures-and-the-dbpa
    difficulty: 3
    variant-of: q149
    cases:
      - woolcock-street-investments-pty-ltd-v-cdg-pty-ltd
    stem: Why was Woolcock not vulnerable, on the lecturer's explanation?
    options:
      - text: Because it had already received full compensation from the original owners of the building.
        why: Wrong — the materials say nothing about compensation from the original owners.
      - text: As a commercial buyer it could have done due diligence, inspections or insurance.
        correct: true
        why: >-
          Correct — the lecturer says Woolcock was a more sophisticated purchaser who could have protected itself, and
          commercial parties bear more of that onus.
      - text: Because the structural distress did not reduce the building's value at all.
        why: >-
          Wrong — the building settled causing structural distress; the claim failed on vulnerability, not on an
          absence of loss.
  - key: q151
    type: mcq
    concept: defective-structures-and-the-dbpa
    difficulty: 4
    variant-of: q149
    cases:
      - woolcock-street-investments-pty-ltd-v-cdg-pty-ltd
    contrasts-with:
      - disclaimers-and-vulnerability
    stem: >-
      A small retailer buys a two-storey shop with flat above from its original owner. Years later, latent footing
      defects appear. The retailer had no building inspection done. Under the common law cases, which is the strongest
      argument for the designer?
    options:
      - text: Bryan v Maloney rules out any duty to subsequent purchasers.
        why: >-
          Wrong — Bryan v Maloney found a duty to a subsequent purchaser; it is the plaintiff's best case, not the
          designer's.
      - text: >-
          Woolcock — a commercial purchaser who could have protected itself is not vulnerable, and there was no
          reliance or assumption of responsibility.
        correct: true
        why: >-
          Correct — the designer would liken the retailer to Woolcock: a commercial purchaser who could have
          inspected, with no reliance or assumed responsibility.
      - text: Caltex Oil — PEL claims must be framed as property damage.
        why: >-
          Wrong — Caltex Oil concerns a dredge and pipeline, and shows a PEL claim can succeed; it says nothing
          against building claims.
  - key: q152
    type: mcq
    concept: defective-structures-and-the-dbpa
    difficulty: 2
    cases: []
    stem: What does s 37 of the Design and Building Practitioners Act 2020 (NSW) provide?
    options:
      - text: A builder owes a duty only to the original owner, unless the contract extends it to later owners.
        why: >-
          Wrong — s 37(2) says the duty is owed to each owner of the land and to each subsequent owner, without
          depending on the contract.
      - text: >-
          A person who carries out construction work has a duty to exercise reasonable care to avoid economic loss
          caused by defects.
        correct: true
        why: >-
          Correct — this is s 37(1); s 37(2) extends it to each owner and subsequent owner, and s 37(3) gives damages
          as if it were a common law duty.
      - text: Defective-building claims must be brought under the Australian Consumer Law rather than in negligence.
        why: Wrong — the Act creates its own statutory duty of care; it does not route claims through the ACL.
  - key: q153
    type: mcq
    concept: defective-structures-and-the-dbpa
    difficulty: 3
    stem: What is the practical effect of the Design and Building Practitioners Act 2020 (NSW) for a subsequent owner?
    options:
      - text: No need to establish a common law duty of care.
        correct: true
        why: >-
          Correct — the slide says the Act makes it easier for owners and subsequent purchasers to sue builders
          because there is no need to establish a duty at common law.
      - text: They must now prove the builder acted intentionally before recovering anything.
        why: Wrong — the Act imposes a duty of reasonable care; it does not require intentional wrongdoing.
      - text: They can sue only if they are the first owner of the land and paid the builder.
        why: Wrong — s 37(2) expressly extends the duty to each subsequent owner of the land.
  - key: q154
    type: mcq
    concept: defective-structures-and-the-dbpa
    difficulty: 3
    stem: Under ss 39 and 40 of the Design and Building Practitioners Act, what is true of the s 37 duty?
    options:
      - text: It can be delegated to a licensed subcontractor and excluded by a clear contract term.
        why: Wrong on both limbs — the slide says the duty is non-delegable (s 39) and cannot be contracted out (s 40).
      - text: It is non-delegable (s 39) and cannot be contracted out (s 40).
        correct: true
        why: >-
          Correct — so a builder cannot escape by pointing to a subcontractor, and cannot exclude the duty by
          contract.
      - text: It applies only to residential dwellings and expires after the first sale of the land.
        why: Wrong — nothing on the slides limits the duty to dwellings, and s 37(2) extends it to each subsequent owner.
  - key: q155
    type: mcq
    concept: defective-structures-and-the-dbpa
    difficulty: 4
    variant-of: q152
    stem: >-
      An engineering firm prepared the structural designs for an apartment block; it never set foot on site. Twelve
      years later, the third owner of a unit discovers defects arising from the design. Under the Design and Building
      Practitioners Act, why is the firm likely caught?
    options:
      - text: Because s 40 makes every consultant on a project jointly liable regardless of fault.
        why: Wrong — s 40 says the duty cannot be contracted out; it does not impose liability regardless of fault.
      - text: Because Bryan v Maloney applies to designers of apartment blocks.
        why: >-
          Tempting because Bryan concerns later owners, but the question asks about the Act, and Bryan involved a
          builder of a house.
      - text: >-
          "Construction work" under s 36 includes preparing designs, and the s 37 duty is owed to each subsequent
          owner.
        correct: true
        why: >-
          Correct — s 36 defines construction work broadly to include designs, so the firm carries out construction
          work, and s 37(2) extends the duty to subsequent owners.
  - key: q156
    type: truefalse
    concept: defective-structures-and-the-dbpa
    difficulty: 1
    set: quickfire
    cases:
      - bryan-v-maloney
    statement: In Bryan v Maloney the High Court held that a builder owed a duty of care to a subsequent purchaser of a house.
    answer: true
    why: >-
      True — the slide states the High Court ruled a builder owed a duty to a subsequent purchaser (Mrs Maloney, the
      third owner) to take reasonable care in building a house.
  - key: q157
    type: truefalse
    concept: defective-structures-and-the-dbpa
    difficulty: 2
    set: quickfire
    cases:
      - woolcock-street-investments-pty-ltd-v-cdg-pty-ltd
    statement: In Woolcock the High Court followed Bryan v Maloney and found that CDG owed Woolcock a duty of care.
    answer: false
    why: >-
      False — the Court found no duty: there was no reliance or assumption of responsibility, and Woolcock, a
      commercial purchaser, was not vulnerable.
  - key: q158
    type: truefalse
    concept: defective-structures-and-the-dbpa
    difficulty: 2
    set: quickfire
    statement: >-
      Under s 37(2) of the Design and Building Practitioners Act 2020 (NSW), the duty is owed to each subsequent owner
      of the land.
    answer: true
    why: >-
      True — s 37(2) provides the duty of care is owed to each owner of the land and to each subsequent owner of the
      land.
  - key: q159
    type: match
    concept: defective-structures-and-the-dbpa
    difficulty: 2
    prompt: Match each authority to its proposition.
    pairs:
      - left: Bryan v Maloney
        right: Builder of a house owes a later owner a duty (proximity)
      - left: Woolcock Street Investments v CDG
        right: No duty to a commercial buyer who was not vulnerable
      - left: DBPA s 37
        right: Statutory duty to avoid economic loss from construction defects
      - left: DBPA s 36
        right: "\"Construction work\" includes designs and project management"
      - left: DBPA ss 39–40
        right: Duty is non-delegable and cannot be contracted out
  - key: q160
    type: short
    concept: defective-structures-and-the-dbpa
    difficulty: 4
    cases:
      - bryan-v-maloney
      - woolcock-street-investments-pty-ltd-v-cdg-pty-ltd
    prompt: >-
      In 2023 Apex Builders constructed a block of six townhouses in Parramatta, using an independent subcontractor
      for

      the waterproofing. Apex's contract with the developer says Apex "accepts no liability to any later purchaser".

      In 2026 Nadia buys one townhouse from the developer's first buyer. Serious water damage then appears, caused by

      defective waterproofing, and the townhouse loses much of its value. Advise Nadia on any claim against Apex.
    model: >-
      The issue is whether Apex owes Nadia, a subsequent owner, a duty of care to avoid pure economic loss caused by a

      latent building defect. The defect reduces the townhouse's value without injuring anyone, so the loss is PEL. At

      common law, Bryan v Maloney held a builder owed a subsequent purchaser of a house a duty to take reasonable care
      in

      building it, using the proximity principle and distinguishing dwellings from other buildings; Woolcock Street

      Investments v CDG found no duty to a commercial purchaser with no reliance, no assumption of responsibility and
      no

      vulnerability. Nadia, a homeowner, is closer to Mrs Maloney. But in NSW she need not rely on the common law.
      Under the

      Design and Building Practitioners Act 2020 s 37, a person who carries out construction work has a duty to
      exercise

      reasonable care to avoid economic loss caused by defects arising from that work, owed to each owner and each

      subsequent owner, with damages as if the duty were a common law duty. Apex's subcontracting does not help it:
      the

      duty is non-delegable (s 39). Nor does its contract clause: the duty cannot be contracted out (s 40). Apex
      carried out

      construction work, and the defect arose from it. Conclusion: Nadia has a strong claim against Apex under s 37,

      without needing to establish a duty at common law; breach and causation would then need to be proved.
    rubric:
      - id: r1
        criterion: Classifies the loss and identifies the issue
        marks: 2
        top-band: Identifies a latent defect causing PEL to a subsequent owner.
        margin-note: Good — defect diminishing value is PEL.
        authorities: []
      - id: r2
        criterion: States the common law position
        marks: 2
        top-band: >-
          Bryan v Maloney (duty to later homeowner; proximity; dwellings) and Woolcock (no duty to commercial,
          non-vulnerable buyer).
        margin-note: Brief common law context earns credit; do not stop there.
        authorities: []
      - id: r3
        criterion: Applies DBPA s 37 to Nadia
        marks: 3
        top-band: >-
          Shows Apex carried out construction work, the defect arose from it, and the duty is owed to each subsequent
          owner.
        margin-note: This is the main route in NSW — well applied.
        authorities: []
      - id: r4
        criterion: Deals with the subcontractor and the exclusion clause
        marks: 3
        top-band: Uses s 39 (non-delegable) and s 40 (cannot be contracted out) against Apex's arguments, then concludes.
        margin-note: Excellent — you anticipated both of Apex's defences.
        authorities: []
