          left.
      - text: Evatt (conditions) → Derry v Peek (deceit needs intent) → Hedley Byrne (negligent misstatement)
        why: Wrong — Evatt (1968) followed Hedley Byrne (1964), and Derry v Peek (1889) is the earliest of the three.
