    difficulty: 4
    prompt: |-
      In 2024, the XV rebel group in Country A – allegedly supported and armed by Country B – was advancing throughout the country, eventually taking control of Country A's capital. In 2025, Country C's petroleum facility was attacked by drones … (see the scenario in part a). Country B denied any involvement in the attack.
      b. Would your answer be any different if, instead of an actual drone attack, Country C had obtained satellite evidence showing that Country B was in the process of deploying a large number of troops and short-range ballistic missiles at their shared border?
    model: |-
      Issue: whether C could use force in anticipatory self-defence against B before any attack has occurred. Art 2(4)
      prohibits the use of force; art 51 preserves self-defence "if an armed attack occurs". On its strict wording, there
      must be an attack, and there is none here. There is serious controversy between those who argue anticipatory
      self-defence is customary international law and those who reject it as incompatible with art 51. The US National
      Security Strategy 2002 claimed a right to act pre-emptively against a "sufficient threat … even if uncertainty
      remains as to the time and place of the enemy's attack", but that expanded definition attracted little support. There
      is more support where a specific attack is manifestly imminent, and all other restrictions still apply. Applying this,
      B is deploying troops and short-range ballistic missiles at the border, which suggests a capacity and perhaps an
      intention to attack. But there is no evidence of a specific planned attack, a time, or a launch; a build-up alone looks
      closer to the 2002 "sufficient threat" than to a manifestly imminent attack. A pre-emptive strike taken too early could
      itself be an act of aggression. Even if imminence were shown, C's response would have to be necessary — diplomacy and
      the Security Council are available — proportionate and reported. Conclusion: yes, the answer differs; C is unlikely to
      be entitled to use force now, and should pursue non-forcible means and the Security Council.
    rubric:
      - id: r1
        criterion: "Issue: identifies anticipatory self-defence and the absence of an attack"
        marks: 1
        top-band: Frames the question as whether self-defence is available before any armed attack has occurred.
        margin-note: No attack has happened yet — say what that does to art 51.
        authorities:
          - un-charter-art-51
      - id: r2
        criterion: "Law: the strict wording of art 51 and the controversy"
        marks: 3
        top-band: Explains "if an armed attack occurs", the two camps, the 2002 US doctrine and its lack of support, and the greater support for manifestly imminent attacks.
        margin-note: Distinguish a "sufficient threat" from a manifestly imminent attack.
        authorities:
          - un-charter-art-51
          - us-national-security-strategy-2002
      - id: r3
        criterion: "Application: the troop and missile build-up"
        marks: 2
        top-band: Tests the satellite evidence for specificity, timing and certainty, and notes the risk that a premature strike is itself aggression.
        margin-note: Is there a specific attack, or only preparations?
        authorities: []
      - id: r4
        criterion: Remaining conditions
        marks: 2
        top-band: Applies necessity (other means, the Security Council), proportionality and reporting even if imminence were shown.
        margin-note: Even if imminent — is force C’s last resort?
        authorities: []
      - id: r5
        criterion: Conclusion
        marks: 1
        top-band: "Concludes the answer differs: C is unlikely to be entitled to use force on these facts."
        margin-note: "Answer the question asked: is it different from part a?"
        authorities: []
  - key: q801
    type: mcq
    concept: humanitarian-intervention-and-r2p
    difficulty: 1
    set: pretest
    stem: Which four international crimes is the responsibility to protect (R2P) tied to?
    options:
      - text: Genocide, war crimes, ethnic cleansing and crimes against humanity
        correct: true
        why: "Correct — the slides tie R2P to four international crimes: genocide, war crimes, ethnic cleansing and crimes against humanity."
      - text: Genocide, aggression, terrorism and crimes against humanity together
        why: Tempting because aggression and terrorism are grave international concerns met this week, but R2P names war crimes and ethnic cleansing instead.
      - text: War crimes, piracy, slavery, torture and crimes against humanity
        why: Tempting because these are serious international wrongs, but R2P is tied to exactly four crimes, and piracy, slavery and torture are not among them.
      - text: Aggression, ethnic cleansing, war crimes and international terrorism
        why: Tempting because three of the words sound right, but aggression and terrorism are not R2P crimes; genocide and crimes against humanity are.
  - key: q802
    type: mcq
    concept: humanitarian-intervention-and-r2p
    difficulty: 2
    stem: Why does humanitarian intervention sit uneasily with the UN Charter?
    options:
      - text: It is not addressed in the Charter and appears to conflict with art 2(4).
        correct: true
        why: Correct — the slides say force to protect people in another state from gross and systematic human rights violations is not addressed in the Charter and appears to conflict with art 2(4).
      - text: The Charter expressly prohibits it in art 51 as a form of aggression.
        why: Tempting because art 51 is the self-defence provision, but the Charter does not mention humanitarian intervention at all — that is the problem.
      - text: The Charter allows it only with the General Assembly’s approval.
        why: Tempting because the General Assembly endorsed R2P in 2005, but the Charter gives the Assembly no power to authorise force.
      - text: The Charter permits it, but only for the protection of a state’s own nationals.
        why: Tempting because rescue of nationals is a separate debate, but humanitarian intervention protects people in another state, and the Charter is silent on both.
  - key: q803
    type: mcq
    concept: humanitarian-intervention-and-r2p
    difficulty: 2
    stem: Which events do the slides give as prominent failures to protect in the 1990s?
    options:
      - text: The Rwandan genocide (1994) and Srebrenica (1995)
        correct: true
        why: Correct — the slides list the Rwandan genocide in 1994 and the UN’s inability to halt the massacre in Srebrenica, Bosnia, in 1995.
      - text: Kosovo (1999) and the intervention in Libya (2011)
        why: Tempting because both are humanitarian-intervention stories this week, but they were interventions, not the failures to protect listed on the slide.
      - text: Syria and Myanmar, where the Council did not act
        why: Tempting because the critiques ask "why not in Syria or Myanmar?", but those are later examples of selective application, not the 1990s failures.
      - text: The Korean and Vietnam wars of the Cold War
        why: Tempting because they appear on this week’s slides, but they illustrate the blurred line between international and internal conflict.
  - key: q804
    type: mcq
    concept: humanitarian-intervention-and-r2p
    difficulty: 2
    stem: What did the Independent International Commission on Kosovo conclude about NATO's 1999 intervention?
    options:
      - text: "'Illegal, yet legitimate'"
        correct: true
        why: Correct — the Commission described the NATO campaign as "illegal, yet legitimate", capturing the tension between the Charter framework and the need to act.
      - text: Lawful collective self-defence under art 51
        why: Tempting because NATO is a collective defence alliance, but no NATO member had suffered an armed attack; self-defence was not the justification.
      - text: Retrospectively authorised by the Security Council
        why: Tempting because the Council later authorised a civil and security presence in Kosovo, but whether that accepted the intervention’s legality is unclear.
      - text: Neither legal nor legitimate, and so void
        why: Tempting because many states contested it, but the Commission accepted its legitimacy while finding it illegal.
  - key: q805
    type: mcq
    concept: humanitarian-intervention-and-r2p
    difficulty: 2
    stem: On what basis did the UK Permanent Representative argue NATO's Kosovo action was legal?
    options:
      - text: As an exceptional measure on grounds of overwhelming humanitarian necessity
        correct: true
        why: Correct — the UK said the action was "justified as an exceptional measure to prevent an overwhelming humanitarian catastrophe … on grounds of overwhelming humanitarian necessity".
      - text: As collective self-defence after an armed attack on a NATO member state
        why: Tempting because NATO is a defensive alliance, but the UK relied on humanitarian necessity, not on any armed attack.
      - text: As the enforcement of an earlier Security Council authorisation under art 42
        why: Tempting because art 42 is a lawful route, but there was no Security Council authorisation; that is why the intervention was so contested.
  - key: q806
    type: mcq
    concept: humanitarian-intervention-and-r2p
    difficulty: 3
    stem: What did the draft Security Council resolution on Kosovo (slide 31) affirm?
    options:
      - text: That the unilateral use of force flagrantly violated the Charter, in particular arts 2(4), 24 and 53
        correct: true
        why: Correct — the draft affirmed "that such unilateral use of force constitutes a flagrant violation of the United Nations Charter, in particular Articles 2 (4), 24, and 53", and called NATO’s force a threat to peace.
      - text: That NATO's action was a lawful humanitarian intervention consistent with the Charter's purposes
        why: Tempting because the UK argued the action was legal, but the draft took the opposite view, condemning the force as a flagrant violation.
      - text: That R2P obliged NATO to intervene once the Security Council was deadlocked by a veto
        why: Tempting because R2P later addressed such dilemmas, but R2P was only developed in 2001; the 1999 draft condemned NATO’s action.
  - key: q807
    type: mcq
    concept: humanitarian-intervention-and-r2p
    difficulty: 3
    stem: Why did the lecturer say the draft resolution condemning NATO’s Kosovo action failed?
    options:
      - text: Many states would not condemn it as illegal.
        correct: true
        why: Correct — the lecturer said the draft was defeated because many states refused to condemn the intervention as illegal, though that did not mean they considered it legal.
      - text: The United States vetoed it as a permanent member.
        why: Tempting because the P5 veto features in this week, but the lecturer described the draft as defeated in a vote, not vetoed.
      - text: The ICJ had already held the intervention lawful.
        why: Tempting because the ICJ decides legal disputes, but no ICJ ruling on the intervention’s legality is mentioned in the materials.
      - text: NATO members are not entitled to vote in the Council.
        why: Tempting because NATO members were parties to the dispute, but Council members, including NATO states, could vote; the draft simply lacked support.
  - key: q808
    type: mcq
    concept: humanitarian-intervention-and-r2p
    difficulty: 2
    stem: What shift in language did the ICISS report (2001) make?
    options:
      - text: From a right to intervene to a responsibility to protect
        correct: true
        why: "Correct — the slides: a focus on a shift in language from a right to intervene to a responsibility to protect the victims."
      - text: From collective security to unilateral self-defence
        why: Tempting because both appear this week, but the ICISS reframed humanitarian intervention; it did not move away from collective security.
      - text: From state sovereignty to the sovereignty of the UN
        why: Tempting because R2P qualifies sovereignty, but it says sovereignty implies responsibility; it does not transfer sovereignty to the UN.
      - text: From jus in bello to jus ad bellum
        why: Tempting because R2P is about when force may be used, but the ICISS’s shift was from rights to responsibilities, not between those bodies of law.
  - key: q809
    type: mcq
    concept: humanitarian-intervention-and-r2p
    difficulty: 2
    stem: Who chaired the International Commission on Intervention and State Sovereignty (ICISS)?
    options:
      - text: Gareth Evans and Mohamed Sahnoun
        correct: true
        why: Correct — the slides say the ICISS, initiated by Canada in 2000, was chaired by Gareth Evans (former Australian Minister of Foreign Affairs) and Mohamed Sahnoun.
      - text: The UK's Permanent Representative to the UN
        why: Tempting because the UK’s representative features in the Kosovo story, but he argued the legality of NATO’s action; he did not chair the ICISS.
      - text: The P5 of the Security Council
        why: Tempting because the P5 dominate the Council, but the ICISS was an independent commission initiated by Canada.
      - text: The Independent Commission on Kosovo
        why: Tempting because both are commissions linked to Kosovo’s aftermath, but the Kosovo commission reached the "illegal, yet legitimate" finding; it did not chair the ICISS.
  - key: q810
    type: mcq
    concept: humanitarian-intervention-and-r2p
    difficulty: 2
    stem: What are the three components of the international responsibility under the ICISS report?
    options:
      - text: To prevent, to react and to rebuild
        correct: true
        why: Correct — the responsibility to prevent (address root causes), to react (appropriate measures, force as a last resort) and to rebuild (recovery, reconstruction, reconciliation).
      - text: To protect, to punish and to pay
        why: Tempting because it alliterates like the real list, but R2P does not frame the international responsibility as punishment or payment.
      - text: To warn, to sanction and to invade
        why: Tempting because sanctions may be part of reacting, but the three components are prevent, react and rebuild; invasion is not one.
      - text: To report, to authorise and to intervene
        why: Tempting because reporting and authorisation feature in the Charter scheme, but they are not the ICISS’s three responsibilities.
  - key: q811
    type: mcq
    concept: humanitarian-intervention-and-r2p
    difficulty: 3
    stem: Within the responsibility to react, where does military force sit?
    options:
      - text: As a last resort
        correct: true
        why: "Correct — the slides: the responsibility to react means responding with appropriate measures, with military force as a last resort."
      - text: As the first response to any of the four crimes
        why: Tempting because the crimes are grave, but force is a last resort; prevention and other appropriate measures come first.
      - text: Only after a referendum in the affected state
        why: Tempting because the affected population matters, but nothing in R2P requires a referendum; force is simply a last resort.
      - text: Only within the responsibility to rebuild
        why: Tempting because rebuilding follows a crisis, but rebuilding concerns recovery and reconciliation, not military force.
  - key: q812
    type: mcq
    concept: humanitarian-intervention-and-r2p
    difficulty: 2
    stem: What is R2P's first pillar?
    options:
      - text: Governments' primary duty to protect their populations — citizens or not — from the four crimes
        correct: true
        why: "Correct — pillar one: governments have the primary duty to their populations, whether citizens or not, to protect them from genocide, war crimes, ethnic cleansing and crimes against humanity."
      - text: The international community's commitment to help states build their capacity to protect
        why: Tempting because it is part of R2P, but assistance and capacity-building is the second pillar.
      - text: The responsibility to respond to the four crimes through the UN mechanisms
        why: Tempting because it is the pillar most linked to force, but responding through UN mechanisms is the third pillar.
  - key: q813
    type: mcq
    concept: humanitarian-intervention-and-r2p
    difficulty: 3
    stem: Why does R2P's first pillar extend the duty to populations 'whether citizens or not'?
    options:
      - text: So a state cannot escape the duty by denying a group citizenship.
        correct: true
        why: Correct — the lecturer said a state could otherwise refuse to recognise a group as citizens and so avoid protecting it — e.g. the Rohingya in Myanmar.
      - text: Because R2P applies only to foreign nationals living in the state.
        why: Tempting because the words go beyond citizens, but the duty covers everyone on the territory, citizens included.
      - text: Because citizenship is irrelevant under every rule of international law.
        why: Tempting because the duty ignores citizenship here, but nationality matters elsewhere (e.g. nationality jurisdiction, Week 5); the point is specific to R2P.
  - key: q814
    type: mcq
    concept: humanitarian-intervention-and-r2p
    difficulty: 2
    stem: Which R2P pillar is the commitment of the international community to assist states, e.g. through capacity-building?
    options:
      - text: The second pillar
        correct: true
        why: Correct — the second pillar is the commitment of the international community to assist states in meeting their obligations, e.g. through capacity-building.
      - text: The first pillar
        why: Tempting because it is the foundation, but the first pillar is the state’s own primary duty to protect its population.
      - text: The third pillar
        why: Tempting because it involves the international community too, but the third pillar is the responsibility to respond through UN mechanisms.
      - text: None of them — R2P has no assistance element
        why: Tempting if R2P is seen only as intervention, but assistance and capacity-building are its second pillar.
  - key: q815
    type: mcq
    concept: humanitarian-intervention-and-r2p
    difficulty: 3
    stem: Why was R2P's implementation in Libya (2011) controversial?
    options:
      - text: NATO's force led to the fall of Gaddafi — criticised as forcible regime change.
        correct: true
        why: Correct — the slides say the use of force by NATO in Libya led to the fall of Gaddafi, prompting criticism of forcible regime change beyond the purpose of protecting civilians.
      - text: The Security Council refused to act, so NATO intervened with no authorisation at all.
        why: Tempting because that describes Kosovo (1999), but the lecturer said the Libya operation followed a Security Council authorisation.
      - text: The ICJ held that R2P could not apply to a civil war inside a single state.
        why: Tempting because Libya was a civil war, but the materials report no ICJ ruling on Libya; the criticism was of regime change.
  - key: q816
    type: mcq
    concept: humanitarian-intervention-and-r2p
    difficulty: 3
    stem: Why is R2P criticised for not solving Security Council paralysis?
    options:
      - text: The World Summit Outcome only asks the P5 to 'refrain' from using the veto.
        correct: true
        why: "Correct — the slides: the World Summit Outcome only asks the P5 to \"refrain\" from exercising the veto in cases of the four crimes, so a veto can still block action."
      - text: R2P abolished the veto, which left the Council unable to reach decisions.
        why: Tempting because the veto is the source of paralysis, but R2P did not abolish it; the World Summit merely asked the P5 to refrain.
      - text: R2P lets the General Assembly override the Security Council's decisions.
        why: Tempting because the General Assembly endorsed R2P, but R2P works within the Council-centred Charter system; the Assembly gained no override.
  - key: q817
    type: mcq
    concept: humanitarian-intervention-and-r2p
    difficulty: 3
    stem: Which critique of R2P asks 'why not in Syria or Myanmar?'
    options:
      - text: Selective, inconsistent application
        correct: true
        why: "Correct — the slides: R2P is only ever selectively and inconsistently applied — double standards? (why not in Syria or Myanmar?)"
      - text: Rhetoric that creates unrealistic expectations
        why: Tempting because unmet expectations follow inaction, but the Syria/Myanmar question is the slides’ illustration of selective application.
      - text: Abuse by powerful states for their own interests
        why: Tempting because self-interest may explain selectivity, but the abuse critique concerns humanitarianism as a mask for intervention.
      - text: A return to moral, just war assessments
        why: Tempting because it is another critique on the slide, but it concerns re-moralising war, not inconsistent application.
  - key: q818
    type: mcq
    concept: humanitarian-intervention-and-r2p
    difficulty: 3
    contrasts-with:
      - exceptions-to-the-prohibition
    stem: Which is the best statement of the current legal status of unilateral humanitarian intervention?
    options:
      - text: A 'legal grey area' (ILA 2018), with no express basis in the Charter
        correct: true
        why: "Correct — the slides close with the ILA (2018): humanitarian intervention remains a \"legal grey area\"; it is not addressed in the Charter and appears to conflict with art 2(4)."
      - text: A third Charter exception, alongside arts 42 and 51
        why: Tempting because some states argued for a new exception after Kosovo, but the Charter has only two exceptions; this one was never agreed.
      - text: Lawful wherever one of the four R2P crimes is occurring
        why: Tempting because R2P is tied to the four crimes, but R2P works through UN mechanisms; it does not license unilateral force.
      - text: Prohibited unless the General Assembly approves it
        why: Tempting because the Assembly endorsed R2P, but it cannot authorise force; and the status of unilateral intervention remains unsettled.
  - key: q819
    type: truefalse
    concept: humanitarian-intervention-and-r2p
    difficulty: 1
    set: quickfire
    statement: The UN Charter expressly permits humanitarian intervention to stop gross and systematic human rights violations.
    answer: false
    why: False — the slides say humanitarian intervention is not addressed in the Charter and appears to conflict with the general prohibition in art 2(4).
  - key: q820
    type: truefalse
    concept: humanitarian-intervention-and-r2p
    difficulty: 1
    set: quickfire
    statement: The ICISS was chaired by Gareth Evans, a former Australian Minister of Foreign Affairs, and Mohamed Sahnoun.
    answer: true
    why: True — the slides say the Canadian-initiated ICISS was chaired by Gareth Evans and Mohamed Sahnoun and reported in December 2001.
  - key: q821
    type: truefalse
    concept: humanitarian-intervention-and-r2p
    difficulty: 1
    set: quickfire
    statement: R2P's third pillar is the responsibility to respond through the UN mechanisms.
    answer: true
    why: True — the three pillars are the state’s primary duty, international assistance, and the responsibility to respond through the UN mechanisms.
  - key: q822
    type: short
    concept: humanitarian-intervention-and-r2p
    difficulty: 3
    prompt: In 1999 NATO used force in Kosovo without Security Council authorisation, and in 2001 the ICISS proposed the 'responsibility to protect'. Does international law now permit a state to use force to stop mass atrocities in another state without Security Council authorisation? Explain.
    model: |-
      The issue is whether there is a third exception to art 2(4) for humanitarian intervention. Art 2(4) prohibits the
      threat or use of force, and the Charter provides only two exceptions: Security Council authorisation (art 42) and
      self-defence against an armed attack (art 51). Force to protect people in another state from gross and systematic
      human rights violations is not addressed in the Charter and appears to conflict with art 2(4). The debate came to the
      fore after the failures in Rwanda (1994) and Srebrenica (1995). In Kosovo (1999) NATO acted without authorisation; the
      UK argued legality "as an exceptional measure on grounds of overwhelming humanitarian necessity", but a draft
      resolution called the force a flagrant violation of arts 2(4), 24 and 53, and the Independent Commission called it
      "illegal, yet legitimate". R2P (ICISS 2001; World Summit 2005) reframed the issue as a responsibility to protect
      populations from genocide, war crimes, ethnic cleansing and crimes against humanity, passing to the international
      community when a state is unwilling or unable — but its third pillar is a response through UN mechanisms, so it works
      within the Charter. It does not solve Security Council paralysis, is selectively applied and is open to abuse, as
      Libya (2011) showed. Conclusion: no clear right exists; unilateral humanitarian intervention remains a "legal grey
      area" (ILA 2018), and lawful force still needs Security Council authorisation.
    rubric:
      - id: r1
        criterion: "Issue: whether there is a humanitarian exception to art 2(4)"
        marks: 1
        top-band: Frames the question as whether unilateral humanitarian force is a third exception beyond arts 42 and 51.
        margin-note: Start from the Charter’s two exceptions.
        authorities:
          - un-charter-art-2-4
          - un-charter-art-42
          - un-charter-art-51
      - id: r2
        criterion: Kosovo and the "illegal, yet legitimate" finding
        marks: 2
        top-band: Uses the UK’s argument, the draft resolution and the Commission’s conclusion to show the split among states.
        margin-note: What did the Commission conclude — and what does "illegal" concede?
        authorities: []
      - id: r3
        criterion: "R2P: content and relationship to the Charter"
        marks: 3
        top-band: Explains the four crimes, unwilling or unable, prevent/react/rebuild and the three pillars, and that pillar three works through UN mechanisms.
        margin-note: Does R2P create a unilateral right, or work through the Council?
        authorities:
          - iciss-report-2001
          - world-summit-outcome-2005
      - id: r4
        criterion: Critiques and practice
        marks: 2
        top-band: Uses Libya (2011) and the critiques (paralysis, selectivity, abuse) to test whether a right has emerged.
        margin-note: Bring in Libya and at least one critique.
        authorities: []
      - id: r5
        criterion: Conclusion
        marks: 1
        top-band: "Concludes no clear right exists: a legal grey area (ILA 2018), with Council authorisation still required for lawful force."
        margin-note: Commit to an answer.
        authorities:
          - ila-2018-report
