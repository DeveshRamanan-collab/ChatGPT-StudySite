  - key: q621
    type: short
    concept: self-defence-against-non-state-actors
    difficulty: 4
    prompt: |-
      In 2024, the XV rebel group in Country A – allegedly supported and armed by Country B – was advancing throughout the country, eventually taking control of Country A's capital. In 2025, Country C's petroleum facility was attacked by drones. That facility contains one of the largest petroleum processing plants in the world. The drone attack damaged several stabilisation towers at the plant, which are essential for removing impurities from crude oil. This caused severe disruptions and reduced the supply of refined oil available for export, leading to a surge in global oil prices and significant economic impacts on Asian and European countries that heavily rely on oil from Country C. The XV rebel group in Country A claimed responsibility for the attack. Country C also accused Country B of involvement, citing evidence from recovered drone parts and a UN fact-finding report that suggested Country B had supplied the drones. Country B denied any involvement in the attack.
      a. Would Country C be entitled to use force in self-defence under international law?
    model: |-
      Issue: whether C may use force in self-defence under art 51 — against B, or against XV in A. Force is prohibited by art
      2(4) (also custom and jus cogens, Nicaragua); self-defence requires an armed attack, necessity, proportionality and
      reporting. Armed attack: there is no clear benchmark; the threshold depends on scale and effects. The drones damaged
      stabilisation towers at one of the world's largest processing plants, causing severe disruption and a surge in global
      prices. No casualties are reported, but the physical damage and its effects are serious, so C can argue the gravity
      threshold is met. Attribution to B: supplying the drones, as the UN report suggests, is like Nicaragua, where providing
      arms, funds or logistics fell below the threshold; C must show B had effective control over the operation, and B
      denies involvement. Self-defence against B is therefore doubtful. Against XV: art 51 does not exclude non-state
      attackers, but the ICJ stresses attribution to the host state (Wall, Armed Activities). If XV now controls A's capital
      and has become A's government, its conduct may be attributable to A (art 10 ARSIWA, Week 7); otherwise C would rely on
      the controversial "unwilling or unable" argument. Any response must be necessary (last resort — diplomatic means, the
      Security Council), proportionate and immediately reported. Conclusion: C is unlikely to be entitled to use force
      against B; a response against XV is arguable but contested.
    rubric:
      - id: r1
        criterion: "Issue: identifies the possible targets and the art 51 framework"
        marks: 1
        top-band: Frames self-defence against B and against XV/A separately, starting from art 2(4) and art 51.
        margin-note: Against whom would C be using force? Treat each separately.
        authorities:
          - un-charter-art-2-4
          - un-charter-art-51
      - id: r2
        criterion: "Law and application: armed attack (scale and effects)"
        marks: 2
        top-band: Applies scale and effects to the damage to the plant and its economic consequences, noting the absence of casualties.
        margin-note: Is damage to an oil plant with global price effects grave enough?
        authorities: []
      - id: r3
        criterion: "Law and application: attribution to B"
        marks: 3
        top-band: Uses Nicaragua — supplying arms is below the threshold — and the effective control test, and weighs the UN report against B’s denial.
        margin-note: Supplying drones is not the same as controlling the attack — what does Nicaragua say?
        authorities: []
      - id: r4
        criterion: "Law and application: XV as a non-state actor"
        marks: 2
        top-band: Discusses attribution to the host state (Wall, Armed Activities), XV as a possible new government (art 10 ARSIWA), and the controversial unwilling-or-unable argument.
        margin-note: XV holds A’s capital — does that change whose conduct this is?
        authorities:
          - unsc-resolution-1373-2001
      - id: r5
        criterion: Necessity, proportionality, reporting and conclusion
        marks: 2
        top-band: Notes the remaining conditions and concludes that force against B is unlikely to be lawful and force against XV is contested.
        margin-note: Even with an armed attack, is force C’s last resort?
        authorities: []
  - key: q701
    type: mcq
    concept: anticipatory-self-defence
    difficulty: 1
    stem: Which words of art 51 are central to the debate on anticipatory self-defence?
    options:
      - text: "'if an armed attack occurs'"
        correct: true
        why: Correct — the right under art 51 is triggered "if an armed attack occurs"; the debate is whether a state may act before an attack has occurred.
      - text: "'the inherent right of individual or collective self-defence'"
        why: Tempting because "inherent" is invoked by those who argue for a wider customary right, but the debate turns on when the right is triggered.
      - text: "'shall be immediately reported to the Security Council'"
        why: Tempting because reporting applies to every exercise of self-defence, but it does not decide whether a state may act before an attack.
      - text: "'until the Security Council has taken measures'"
        why: Tempting because it concerns timing, but these words set when the right ends, not whether it can begin before an attack.
  - key: q702
    type: mcq
    concept: anticipatory-self-defence
    difficulty: 2
    stem: What is anticipatory (or pre-emptive) self-defence?
    options:
      - text: Self-defence before an armed attack has occurred, when one is imminent
        correct: true
        why: Correct — the slides ask about anticipatory self-defence "if an attack has not yet occurred but is imminent".
      - text: Self-defence against a group operating from another state's territory
        why: Tempting because it is the other contested extension in Part B, but that is self-defence against non-state actors, not anticipation.
      - text: Self-defence in response to an attack that ended some months earlier
        why: Tempting because timing matters, but a late response raises necessity (the temporal link in Nicaragua), not anticipation.
  - key: q703
    type: mcq
    concept: anticipatory-self-defence
    difficulty: 2
    stem: What is the core disagreement about anticipatory self-defence?
    options:
      - text: Whether it is customary law, or incompatible with the strict wording of art 51
        correct: true
        why: Correct — the slides describe serious controversy between those arguing it is customary international law and those rejecting it as incompatible with art 51’s strict wording.
      - text: Whether it must be reported to the Security Council or to the General Assembly
        why: Tempting because reporting is a condition of self-defence, but art 51 is clear that reports go to the Security Council; that is not the debate.
      - text: Whether it applies only to nuclear threats or also to conventional weapons too
        why: Tempting because the debate mentions destructive modern weapons, but the disagreement is about acting before an attack at all, not about the type of weapon.
  - key: q704
    type: mcq
    concept: anticipatory-self-defence
    difficulty: 2
    stem: What did the US National Security Strategy 2002 claim?
    options:
      - text: An option to act pre-emptively against a sufficient threat, even if time and place are uncertain
        correct: true
