      - text: Auctoritas — the right authority, meaning the rightful sovereign
        why: Tempting because a sovereign might wage war for gain, but auctoritas asks only who may wage war, not why the war is fought.
      - text: Recta intentio — the right intent, the attainment of a just peace
        why: Tempting because intent and purpose overlap, as the lecturer noted, but the condition that names wealth and power on the slides is causa justa.
  - key: q105
    type: mcq
    concept: jus-ad-bellum-and-jus-in-bello
    difficulty: 2
    stem: What did the Kellogg-Briand Pact (1928) do, according to the slides?
