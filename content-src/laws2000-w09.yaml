        why: Tempting because it echoes the 2002 US strategy, but that expanded definition attracted little support.
      - text: When an adversary is developing new weapons
        why: Tempting because new technologies feed the debate, but mere development of weapons is not a specific, manifestly imminent attack.
      - text: When a state has been attacked in the past
