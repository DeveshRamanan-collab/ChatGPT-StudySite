      - text: A duty to seek Security Council authorisation before taking any pre-emptive action at all
        why: Tempting because the Council has primary responsibility, but the strategy claimed a unilateral option to act pre-emptively, "if necessary".
      - text: A right of self-defence that arises only after an armed attack on US territory has occurred
        why: Tempting because that is the strict reading of art 51, but the strategy went the other way, claiming a right to act before an attack.
  - key: q705
