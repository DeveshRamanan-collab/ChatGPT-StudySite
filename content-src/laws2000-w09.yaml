        correct: true
        why: Correct — the slides mark the prohibition as a jus cogens norm, and the lecturer noted the ILC gave it as one of the best examples of a peremptory norm.
      - text: As soft law, since its content is developed mainly by General Assembly declarations
        why: Tempting because the 1970, 1974 and 1987 declarations elaborate it, but the prohibition is binding treaty and customary law — and jus cogens.
      - text: As an ordinary customary rule from which states may opt out by persistent objection
        why: Tempting because persistent objection (Week 2) lets states avoid some customs, but a peremptory norm admits no such opt-out.
  - key: q205
    type: mcq
    concept: prohibition-on-the-use-of-force
