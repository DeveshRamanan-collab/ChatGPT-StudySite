  - key: q109
    type: mcq
    concept: jus-ad-bellum-and-jus-in-bello
    variant-of: q101
    difficulty: 2
    stem: During what it says is lawful self-defence, State A shells a town in State B. A critic objects to how the shelling was carried out. Which body of law governs that objection?
    options:
      - text: Jus in bello, because the objection is about how A conducts hostilities already under way.
        correct: true
        why: Correct — jus in bello is the law regulating behaviour during hostilities; the objection concerns the conduct of the fighting, not the decision to fight.
      - text: Jus ad bellum, because A says its resort to force was lawful self-defence under art 51.
        why: Tempting because self-defence is this week’s topic, but whether A could resort to force is a different question from how it conducts hostilities.
      - text: Art 2(4) of the Charter, because shelling a town is a use of force against another state.
        why: Tempting because shelling is force, but art 2(4) governs the resort to force between states (jus ad bellum); the manner of fighting is jus in bello.
  - key: q110
