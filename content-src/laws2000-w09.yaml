    title: Jus ad bellum and jus in bello — from just war to the Charter
    visual: timeline
    visual-brief: "A timeline of attempts to restrain the resort to force — Aquinas's three conditions (13th century), the Hague Conventions 1899/1907, the League of Nations 1920, the Kellogg-Briand Pact 1928, the UN Charter 1945 — each pre-Charter step followed by the world war it failed to stop, ending in a split into two lanes: jus ad bellum (may force be used?) and jus in bello (how must hostilities be conducted?)."
