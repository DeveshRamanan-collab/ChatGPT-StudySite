  - key: q209
    type: mcq
    concept: prohibition-on-the-use-of-force
    variant-of: q208
    difficulty: 3
    stem: State A, which has just suffered an armed attack from State B, declares that it will strike B's missile bases unless the attacks stop. Is A's threat unlawful under art 2(4)?
