  - key: q121
    type: short
    concept: jus-ad-bellum-and-jus-in-bello
    difficulty: 2
    prompt: Explain the differences between Jus ad bellum and Jus in bello.
    model: |-
      Jus ad bellum is the law relating to the resort to force and war: it governs when a state is allowed to go to war
      and use force against another state. Today its source is the UN Charter — the prohibition on the threat or use of
      force in art 2(4), which is also customary international law and jus cogens (Nicaragua, para 34), and the two
      exceptions: Security Council authorisation (art 42) and self-defence (art 51), which requires an armed attack and must
      be necessary, proportionate and reported to the Security Council. It grew out of the just war doctrine (Aquinas's
      auctoritas, causa justa and recta intentio) and the efforts to limit war in the Hague Conventions, the League of
      Nations and the Kellogg-Briand Pact. Jus in bello is the law regulating behaviour during hostilities — what is
      permitted once a war has begun. It is international humanitarian law, the law of armed conflict associated with the
      Geneva Conventions, and this unit leaves it to the Law of Armed Conflict elective. The difference is one of timing
      and question: ad bellum asks whether force may be used at all; in bello asks how hostilities must be conducted. A
      claim of self-defence is an ad bellum question; the treatment of prisoners is an in bello question.
    rubric:
      - id: r1
        criterion: "Issue: identifies the two bodies of law and what is to be distinguished"
        marks: 1
        top-band: States that the question is the difference between the law on resorting to force and the law on conduct in hostilities.
        margin-note: Say up front what each term covers before comparing them.
        authorities: []
      - id: r2
        criterion: "Law: defines jus ad bellum and names its sources"
        marks: 3
        top-band: Defines ad bellum as the law on the resort to force and war and anchors it in art 2(4), custom/jus cogens (Nicaragua) and the exceptions in arts 42 and 51.
        margin-note: Which Charter provisions make up jus ad bellum today?
        authorities:
          - un-charter-art-2-4
          - un-charter-art-51
          - un-charter-art-42
      - id: r3
        criterion: "Law: defines jus in bello"
        marks: 2
        top-band: Defines in bello as the law regulating behaviour during hostilities — international humanitarian law, the Geneva Conventions.
        margin-note: Good — now say where it fits in this unit.
        authorities: []
      - id: r4
        criterion: "Application: illustrates the difference with examples"
        marks: 2
        top-band: Gives a concrete ad bellum question (e.g. a self-defence claim) and an in bello question (e.g. treatment of prisoners), showing timing and focus.
        margin-note: An example of each would make the distinction concrete.
        authorities: []
      - id: r5
        criterion: "Conclusion: states the distinction crisply"
        marks: 1
        top-band: Concludes that ad bellum asks whether force may be used; in bello asks how it may be used once hostilities begin.
        margin-note: Finish with the one-line contrast.
        authorities: []
  - key: q201
    type: mcq
    concept: prohibition-on-the-use-of-force
    difficulty: 1
    set: pretest
    stem: Where in the UN Charter is the prohibition on the threat or use of force found?
    options:
      - text: Article 2(4), alongside the duty of peaceful settlement in art 2(3)
        correct: true
        why: Correct — art 2(4) prohibits the threat or use of force; with art 2(3) (peaceful settlement of disputes) it forms the Charter’s two pillars approach.
      - text: Article 51, alongside the inherent right of self-defence
        why: Tempting because art 51 is the provision most discussed this week, but it is an exception to the prohibition, not the prohibition itself.
      - text: Article 42, alongside the Security Council's power to authorise force
        why: Tempting because art 42 concerns force, but it is the other exception (Security Council authorisation), not the source of the prohibition.
      - text: Article 24, alongside the Council's primary responsibility for peace
        why: Tempting because art 24 concerns international peace and security, but it confers responsibility on the Security Council; it does not prohibit force.
  - key: q202
    type: mcq
    concept: prohibition-on-the-use-of-force
    difficulty: 2
    stem: In Nicaragua (1986, para 34), what did the ICJ say about the source of the rules on the use of force?
    options:
      - text: They are regulated both by customary international law and by treaties, in particular by the UN Charter itself.
        correct: true
        why: Correct — the Court said there can be no doubt that the issues of the use of force are regulated both by customary international law and by treaties, in particular the Charter.
      - text: They exist only in the UN Charter, so they bind only the states that are members of the United Nations.
        why: Tempting because art 2(4) speaks of "Members", but Nicaragua confirmed a parallel customary rule, so non-members are bound too.
      - text: They are general principles of law recognised by civilised nations under art 38(1)(c) of the ICJ Statute.
        why: Tempting because general principles are a recognised source (Week 2), but the Court located the rule in custom and treaty, not general principles.
  - key: q203
    type: mcq
    concept: prohibition-on-the-use-of-force
    difficulty: 2
    stem: Why does it matter that the prohibition on the use of force is also customary international law?
    options:
