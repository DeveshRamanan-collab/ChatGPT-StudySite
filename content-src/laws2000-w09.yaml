      - text: It created the League of Nations to limit the recourse to war after the First World War.
        why: Tempting because both are interwar efforts to limit war, but the League (1920–1945) was a separate organisation; the Pact was a treaty renouncing war.
      - text: It prohibited both the threat and the use of force in states’ international relations.
        why: Tempting because that sounds like a ban on war, but the threat-or-use formula is art 2(4) of the UN Charter (1945), not the 1928 Pact.
      - text: It codified rules on conduct during hostilities, such as the treatment of prisoners.
        why: Tempting because it is an early war treaty, but rules on conduct during hostilities are jus in bello; the Pact concerned the resort to war itself.
  - key: q106
    type: mcq
