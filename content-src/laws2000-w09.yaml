        why: Tempting because imminence does the work of the armed attack, but the slides say all other restrictions still apply.
      - text: Only proportionality, because necessity is presumed from imminence
        why: Tempting because an imminent attack suggests urgency, but necessity must still be shown; it is not presumed.
      - text: Prior Security Council authorisation under art 42 of the Charter
        why: Tempting because the Council has primary responsibility, but self-defence (anticipatory or not) is distinct from art 42 authorisation.
