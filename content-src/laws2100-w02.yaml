questions:
  - key: q101
    type: mcq
    concept: austins-command-theory
    difficulty: 1
    set: pretest
    stem: For Austin, what are laws or rules 'properly so called'?
    options:
      - text: A species of commands.
        correct: true
        why: >-
          Correct — Lecture I on the slide: laws or rules properly so called are a species of commands, which is why the
          theory is called the command or imperative theory.
      - text: A species of habits of obedience among the bulk of a society.
        why: >-
          Tempting because habitual obedience appears in Austin's Lecture VI, but it identifies the sovereign; the law
          itself is a command, not a habit.
      - text: A species of social rules accepted from the internal point of view.
        why: >-
          Tempting because that is how Hart explains law, but social rules with an internal aspect are Hart's
          replacement for Austin's commands, not Austin's view.
  - key: q102
    type: mcq
    concept: austins-command-theory
    difficulty: 1
    stem: According to the slides, what are the two elements of a command in Austin's Lecture I?
    options:
      - text: An expression of authority and a recognition of that authority by the person addressed.
        why: >-
          Tempting because Hart links command to authority, but Austin's two elements are a desire and liability to
          evil; authority is what Hart says Austin leaves out.
      - text: A signification of desire, and liability to evil if the addressee does not comply.
        correct: true
        why: >-
          Correct — the slide lists (i) a signification of desire and (ii) the party addressed being liable to evil in
          case they do not comply with the expressed desire.
      - text: A general rule of conduct and a court competent to apply it to particular cases.
        why: >-
          Tempting because laws do need generality and courts apply them, but neither is one of the two elements of a
          command on the Lecture I slide.
  - key: q103
    type: mcq
    concept: austins-command-theory
    difficulty: 2
    stem: Which is NOT one of the three ideas Austin captures in the term "command"?
    options:
      - text: A wish that another rational being shall do or forbear.
        why: >-
          Tempting to exclude because it sounds too psychological, but the slide lists the wish or desire of a rational
          being as the first of the three ideas.
      - text: An evil to be incurred by the other if they do not comply.
        why: >-
          Tempting to exclude because it sounds like punishment only, but the evil threatened for non-compliance is the
          second of Austin's three ideas.
      - text: The addressee's acceptance of the wish as a common standard of conduct.
        correct: true
        why: >-
          Correct — acceptance as a common standard is Hart's internal aspect of rules; Austin's three ideas are the
          wish, the evil, and the expression of the wish.
      - text: An expression or intimation of the wish by words or other signs.
        why: >-
          Tempting to exclude because it seems obvious, but the slide lists the expression or intimation of the wish by
          words or other signs as the third idea.
  - key: q104
    type: mcq
    concept: austins-command-theory
    difficulty: 2
    stem: What does Austin mean when he says that command and duty are "correlative terms"?
    options:
      - text: Wherever a duty lies a command has been signified, and wherever a command is signified a duty is imposed.
        correct: true
        why: >-
          Correct — this is the slide's statement of the correlation: the language of duty only makes sense for Austin
          where a command backed by a sanction has been signified.
      - text: >-
          A duty is a moral reason binding in conscience, and a command is a legal reason that merely happens to
          coincide with it.
        why: >-
          Tempting because duties are often moral, but Austin explains duty entirely through commands and sanctions,
          with no reference to moral reasons.
      - text: A command becomes a duty only once the addressee accepts it as a legitimate exercise of authority over them.
        why: >-
          Tempting because it echoes Hart's point about authority, but for Austin no acceptance is needed; a signified
          command backed by evil imposes the duty.
  - key: q105
    type: mcq
    concept: austins-command-theory
    difficulty: 1
    stem: For Austin, what is the "evil" referred to in his account of a command?
    options:
      - text: Moral wrongdoing by the person who disobeys.
        why: >-
          Tempting because 'evil' has a moral ring, but Austin uses it for the consequence threatened for
          non-compliance, not for the wrongness of the conduct.
      - text: A sanction, or an enforcement of obedience.
        correct: true
        why: >-
          Correct — the slide glosses evil as sanction, or an enforcement of obedience, and notes that for Austin
          punishments are one class of sanctions.
      - text: Only criminal punishment imposed by a court.
        why: >-
          Tempting because punishment is the obvious sanction, but the slide says punishments are only a class of
          sanctions; the lecture says many sanctions are not punishments.
  - key: q106
    type: mcq
    concept: austins-command-theory
    difficulty: 2
    stem: How does Austin understand "superiority"?
    options:
      - text: As moral or intellectual excellence that makes a person worth obeying.
        why: >-
          Tempting because 'superior' is often used that way, but the slide says Austin understands superiority as
          might, not as any kind of merit or excellence.
      - text: As lawful authority conferred on an office by a rule of the legal system.
        why: >-
          Tempting because that is how we now describe officials, but conferring authority by rules is Hart's idea; for
          Austin superiority is sheer power.
      - text: 'As might: the power to affect others with evil and force them, through fear, to comply.'
        correct: true
        why: >-
          Correct — superiority means might on the slide: the power to affect others with evil or pain and, through fear
          of it, to make them fashion their conduct to one's wishes.
  - key: q107
    type: mcq
    concept: austins-command-theory
    difficulty: 2
    stem: In which of Austin's four kinds of laws does international law fall?
    options:
      - text: Human laws set by political superiors (positive law).
        why: >-
          Tempting because states make treaties, but Austin does not treat international law as set by a political
          superior to political inferiors, so it is not positive law.
      - text: Objects improperly but by close analogy termed laws (positive morality).
        correct: true
        why: >-
          Correct — the slide places rules set and enforced by mere opinion, including international law, among objects
          improperly but by close analogy termed laws.
      - text: Objects metaphorically termed laws, like the laws of motion.
        why: >-
          Tempting because both are 'improper' laws, but the metaphorical category is for things like the laws
          determining the movements of inanimate bodies.
      - text: Divine law, since it binds sovereigns as well as subjects.
        why: >-
          Tempting because divine law binds everyone, but it is laid down by God on Austin's account; international law
          is positive morality set by opinion.
  - key: q108
    type: mcq
    concept: austins-command-theory
    difficulty: 1
    stem: According to Austin, what is "the matter of jurisprudence"?
    options:
      - text: 'Positive law: law simply and strictly so called, set by political superiors to political inferiors.'
        correct: true
        why: >-
          Correct — the slide quotes PJD 18: the matter of jurisprudence is positive law, law simply and strictly so
          called, or law set by political superiors to political inferiors.
      - text: >-
          All four kinds of laws, including divine law, positive morality and the laws determining the movements of
          bodies.
        why: >-
          Tempting because Austin surveys all four kinds, but he does so to determine the province of jurisprudence,
          which he confines to positive law.
      - text: >-
          The law of nature, from which positive laws set by human superiors take their validity and their binding
          force.
        why: >-
          Tempting because natural law theory says so, but the slide notes Austin rejects the notion of Law of Nature
          altogether.
  - key: q109
    type: mcq
    concept: austins-command-theory
    difficulty: 3
    stem: >-
      A professional association issues a code telling its members how to behave, enforced only by the disapproval of
      their peers. On Austin's scheme, the code is best classified as:
    options:
      - text: Positive law, because the association has power over its members and can expel those who ignore the code.
        why: >-
          Tempting because Austin ties law to power, but positive law is set by political superiors; an association
          whose code is enforced by opinion is not one.
      - text: 'Positive morality: rules set and enforced by mere opinion, improperly but by close analogy termed laws.'
        correct: true
        why: >-
          Correct — rules set and enforced by mere opinion fall in the third category, positive morality, which is
          improperly but by close analogy termed law.
      - text: Not a law of any kind, since only a sovereign can lay down rules and back them with a sanction of evil.
        why: >-
          Tempting because only the sovereign sets positive law, but Austin's scheme still classifies opinion-enforced
          rules as a kind of law, improperly so called.
  - key: q110
    type: mcq
    concept: austins-command-theory
    difficulty: 3
    stem: Why does the lecture say Austin's definition of law in general should not be read as a mere stipulation?
    options:
      - text: Because he builds it from a common denominator observed in real societies.
        correct: true
        why: >-
          Correct — the lecture says Austin looks at real societies and finds a common element, someone in a position of
          power issuing commands; so the definition has reasons behind it.
      - text: Because he took the definition from the ordinary use of the word "law" among English lawyers and judges.
        why: >-
          Tempting because Hart's method analysed ordinary language, but the lecture attributes Austin's starting point
          to a comparison of human societies.
      - text: Because stipulative definitions are never permitted in jurisprudence, whatever the context.
        why: >-
          Tempting as a general rule, but the lecture explicitly says there are contexts where stipulating a meaning
          makes sense; it is just not what Austin is doing.
  - key: q111
    type: mcq
    concept: austins-command-theory
    difficulty: 2
    stem: >-
      Austin says a law "obliges generally to acts or forbearances of a class". What does this add to the idea of a
      command?
    options:
      - text: That a law is general, not an individual command addressed to one act.
        correct: true
        why: >-
          Correct — the lecture says a law is not an individual command: Austin starts from that intuition but realises
          law is always general in nature.
      - text: That a law must be approved by the class of persons it obliges before it binds them.
        why: >-
          Tempting because 'class' suggests a group decision, but Austin's point is about the generality of the conduct
          required, not the consent of those bound.
      - text: That a law binds only the social class that does not hold political power.
        why: >-
          Tempting because superiors and inferiors sound like classes, but 'a class' here means a class of acts or
          forbearances, not a social class.
  - key: q112
    type: mcq
    concept: austins-command-theory
    difficulty: 3
    contrasts-with:
      - laws2100-w01-definition-per-genus-et-differentiam
    stem: How does the lecture connect Austin's theory to last week's definition per genus et differentiam?
    options:
      - text: Austin avoids the method, defining law instead by working outwards from clear, standard, paradigm cases.
        why: >-
          Tempting because Hart works from paradigm cases, but that is Hart's approach; the lecture says people like
          Austin are doing exactly the kind of definition Hart rejects.
      - text: >-
          Austin defines laws as a species of a wider genus — commands — marked off by their source in a political
          superior.
        correct: true
        why: >-
          Correct — Lamond's list puts Austin as treating coercion as the genus of which law is a species; the lecture
          links this to per genus et differentiam, which Hart says cannot work for law.
      - text: Austin uses the method only for divine law, leaving human positive law to be identified case by case.
        why: >-
          Tempting because divine law comes first in his list, but the command genus covers divine and human law alike;
          human positive law is the species he cares about.
  - key: q113
    type: mcq
    concept: austins-command-theory
    difficulty: 2
    stem: Which statement about sanctions matches Austin's view as presented in the lecture?
    options:
      - text: Punishments are a class of sanctions, and there are sanctions that are not punishments.
        correct: true
        why: >-
          Correct — the slide notes that for Austin punishments are a class of sanctions, and the lecture adds that a
          number of sanctions are not punishments strictly speaking.
      - text: Sanctions are optional extras; a command can impose a duty without any threatened evil.
        why: >-
          Tempting because Hart argues law can exist without sanctions, but for Austin command, duty and sanction are
          inseparable; no evil, no command.
      - text: Sanctions exist only in criminal law; private law works by agreement instead.
        why: >-
          Tempting because private law feels consensual, but Austin applies the sanction idea to all laws properly so
          called; Hart later uses private law against him.
  - key: q114
    type: mcq
    concept: austins-command-theory
    difficulty: 2
    stem: Which of these would Austin class as an object "metaphorically termed" a law?
    options:
      - text: A statute passed by Parliament but disliked by most citizens.
        why: >-
          Tempting because a disliked law might seem not really law, but Austin says a law that exists is a law though
          we dislike it; a statute is positive law.
      - text: The law of gravitation governing the movement of falling bodies.
        correct: true
        why: >-
          Correct — objects metaphorically termed laws are, on the slide, the laws determining the movements of
          inanimate bodies or masses: the laws of nature in the scientific sense.
      - text: The rules of etiquette enforced by the opinion of a social circle.
        why: >-
          Tempting because etiquette is not strictly law, but rules set and enforced by opinion are positive morality,
          termed laws by close analogy rather than metaphor.
  - key: q115
    type: mcq
    concept: austins-command-theory
    difficulty: 3
    variant-of: q104
    contrasts-with:
      - gunman-situation
    stem: A robber orders a bank clerk to hand over cash. On Austin's own definitions, what does the clerk have?
    options:
      - text: No duty at all, because only a sovereign habitually obeyed by the bulk of society can impose a duty.
        why: >-
          Tempting because the robber is not the sovereign, but Austin's correlation makes any signified command backed
          by evil impose a duty; sovereignty only marks positive law.
      - text: A duty, because a desire has been signified and the clerk is liable to evil for non-compliance.
        correct: true
        why: >-
          Correct — for Austin command and duty are correlative: where a desire is signified with liability to evil, a
          duty is imposed. Hart attacks exactly this conclusion.
      - text: A moral obligation, because the robber is exercising authority over the clerk for the moment.
        why: >-
          Tempting because we speak of obligation loosely, but the robber exercises power, not authority, and Austin's
          analysis contains no moral obligation here.
  - key: q116
    type: mcq
    concept: austins-command-theory
    difficulty: 2
    variant-of: q106
    stem: Which phrase best captures how Austin distinguishes a political superior from others in the community?
    options:
      - text: Whoever can oblige another to comply with their wishes.
        correct: true
        why: >-
          Correct — the slide says whoever can oblige another to comply with their wishes is the superior; superiority
          is the power to enforce compliance with a wish.
      - text: Whoever has been elected by a majority of the adult population.
        why: >-
          Tempting because we identify rulers that way today, but Austin's definition is about might, and applies
          equally to an absolute monarch or a council of elders.
      - text: Whoever is recognised by officials under a rule of recognition.
        why: >-
          Tempting because it is how Hart identifies law, but the rule of recognition is Hart's later concept; Austin's
          superior is picked out by power alone.
  - key: q117
    type: truefalse
    set: quickfire
    concept: austins-command-theory
    difficulty: 1
    statement: Austin accepts the notion of a Law of Nature as one of his four kinds of laws.
    answer: false
    why: >-
      False — the slide's first kind is divine law, and it adds in brackets that Austin rejects the notion of Law of
      Nature.
  - key: q118
    type: truefalse
    set: quickfire
    concept: austins-command-theory
    difficulty: 1
    statement: For Austin, command, duty and sanction are inseparably connected terms.
    answer: true
    why: >-
      True — the slide on Austin's definition of command ends with this point: the three are inseparably connected terms
      or concepts.
  - key: q119
    type: truefalse
    set: quickfire
    concept: austins-command-theory
    difficulty: 2
    statement: For Austin, laws properly so called proceed from inferiors and bind superiors.
    answer: false
    why: >-
      False — it is the other way round: laws and other commands proceed from superiors and bind or oblige inferiors,
      and superiority means might.
  - key: q120
    type: truefalse
    set: quickfire
    concept: austins-command-theory
    difficulty: 2
    statement: Austin treats international law as positive morality rather than positive law.
    answer: true
    why: >-
      True — rules set and enforced by mere opinion, including international law, are objects improperly but by close
      analogy termed laws: positive morality.
  - key: q121
    type: short
    concept: austins-command-theory
    difficulty: 3
    prompt: '''Law is simply a command backed by a sanction.'' Discuss, explaining Austin''s account and assessing it.'
    model: >-
      Austin's account is coherent and simple, but as an account of all law it is too narrow. For Austin, law in general
      is

      a rule laid down for an intelligent being by an intelligent being having power over him, and laws properly so
      called

      are a species of commands. A command combines a wish that another shall do or forbear, an evil to be incurred for

      non-compliance, and the expression of the wish; command, duty and sanction are inseparable, and superiority means

      might. Positive law is the command of a political superior to political inferiors. The strongest case for the

      statement is that it captures what is visible about law: enforcement, jails, the power to use force, which Schauer

      calls the overwhelmingly coercive experience of law. Against it, Hart shows that the gunman obliges the clerk
      without

      the clerk having an obligation, and that power-conferring rules — wills, contracts — are not orders backed by
      threats.

      On balance the command model describes some duty-imposing rules well, but misses authority and the variety of
      laws;

      'simply' is the word that fails.
    rubric:
      - id: r1
        criterion: Thesis — takes a clear position on whether law is simply a command backed by a sanction.
        marks: 2
        top-band: >-
          States a qualified thesis at the outset (eg right about some laws, wrong as a general account) and holds it
          throughout.
        margin-note: Say where you stand in the first two sentences.
        authorities: []
      - id: r2
        criterion: >-
          Argument — explains Austin's account accurately: command's three ideas, correlation of command and duty,
          superiority as might, positive law.
        marks: 3
        top-band: Uses the slide's terms precisely and shows how they fit together into the command theory.
        margin-note: Which three ideas make up a command for Austin?
        authorities:
          - austin-province-of-jurisprudence-determined
      - id: r3
        criterion: Counterargument — presents the strongest case for the statement charitably.
        marks: 2
        top-band: Builds the command theory at its strongest, eg with Schauer's point about the coercive experience of law.
        margin-note: Put Austin at his strongest before replying — as Hart does.
        authorities:
          - schauer-was-austin-right-after-all
      - id: r4
        criterion: Evaluation — weighs Hart's objections and reaches a reasoned conclusion.
        marks: 3
        top-band: >-
          Uses obliged/obligation and power-conferring rules to show exactly where 'simply' fails, and says what
          survives.
        margin-note: Which objection does the real work, and why?
        authorities:
          - hart-the-concept-of-law
  - key: q201
    type: mcq
    concept: austins-sovereign
    difficulty: 1
    set: pretest
    stem: On Austin's definition, when is a society "political"?
    options:
      - text: When it occupies a defined territory with a stable population and a government.
        why: >-
          Tempting because that is the modern definition of a state, but the lecture stresses that Austin's definition
          does not mention territory or population.
      - text: When the generality of its members is in a habit of obedience to a determinate and common superior.
        correct: true
        why: >-
          Correct — the slide: a society is political iff the generality of its members is in a habit of obedience to a
          determinate and common superior.
      - text: When its members accept a rule identifying who may make law.
        why: >-
          Tempting because it sounds like Hart's rule of recognition, but Austin uses habitual obedience, not accepted
          rules, to define a political society.
  - key: q202
    type: mcq
    concept: austins-sovereign
    difficulty: 2
    stem: What makes a political society also "independent" for Austin?
    options:
      - text: Its superior does not habitually obey another person or body.
        correct: true
        why: >-
          Correct — the slide: a society is political and independent iff that superior does not habitually obey another
          person or body.
      - text: It has been recognised as independent by other states under international law.
        why: >-
          Tempting because recognition matters in international law, but Austin treats international law as positive
          morality; independence turns on habitual obedience.
      - text: Its members obey no one.
        why: >-
          Tempting as a reading of 'independent', but the members must habitually obey their common superior; it is the
          superior who obeys no one else.
  - key: q203
    type: mcq
    concept: austins-sovereign
    difficulty: 1
    stem: Which three ideas does Austin call "inseparably connected" in Lecture VI?
    options:
      - text: Command, duty and sanction.
        why: >-
          Tempting because Austin calls those inseparable too, but that is Lecture I on commands; Lecture VI's three
          ideas concern the sovereign's position.
      - text: Sovereignty, subjection and independent political society.
        correct: true
        why: >-
          Correct — the Lecture VI slide lists three inseparably connected ideas: sovereignty, subjection and
          independent political society.
      - text: Generality, enduring character and supremacy.
        why: >-
          Tempting because these are elements Hart adds to the gunman situation, but they are Hart's modelling steps in
          Chapter II, not Austin's Lecture VI ideas.
  - key: q204
    type: mcq
    concept: austins-sovereign
    difficulty: 2
    stem: What question does Austin set out to answer in Lecture VI?
    options:
      - text: How can we distinguish positive laws from other kinds of commands?
        correct: true
        why: >-
          Correct — the slide opens Lecture VI with exactly this question; the answer is that positive laws are set by
          the sovereign of an independent political society.
      - text: Whether a law that exists but is unjust is still a law.
        why: >-
          Tempting because Austin answers that in Lecture V (existence is one thing, merit another), but Lecture VI is
          about distinguishing positive laws among commands.
      - text: Whether customs become law only once courts apply them in deciding a case.
        why: >-
          Tempting because customs come up in the debate, but the question of custom is Hart's third Chapter III
          objection, not the question Austin poses in Lecture VI.
  - key: q205
    type: mcq
    concept: austins-sovereign
    difficulty: 3
    stem: >-
      An island community of 300 people habitually obeys a council of elders, which obeys no one else. There is no fixed
      border. On Austin's definitions:
    options:
      - text: >-
          It cannot be a political society, since it lacks a fixed territory, a border and the institutions of a modern
          state.
        why: >-
          Tempting because we think of states as territorial, but the lecture stresses Austin's definition is broader
          than the nation state and does not mention territory.
      - text: It is an independent political society, and the council's commands to its members are positive laws.
        correct: true
        why: >-
          Correct — a body can be sovereign; the bulk habitually obey a determinate common superior that obeys no one
          else, so its commands are positive laws.
      - text: It is in a state of nature, because a council is a body of persons rather than one person.
        why: >-
          Tempting because Austin speaks of a determinate superior, but the slide allows a sovereign person or a
          sovereign body of persons.
  - key: q206
    type: mcq
    concept: austins-sovereign
    difficulty: 2
    stem: >-
      When does Austin say a society is "in a state of nature, or split into two or more independent political
      societies"?
    options:
      - text: Unless habitual obedience is rendered by the bulk of its members to one and the same superior.
        correct: true
        why: >-
          Correct — PJD 169 on the slide: unless the bulk of its members render habitual obedience to one and the same
          superior, there is no unity in one political society.
      - text: When its members stop accepting the laws as morally justified, whatever their continuing habits of obedience.
        why: >-
          Tempting because loss of legitimacy sounds like a return to nature, but Austin's test is habitual obedience,
          not moral acceptance of the laws.
      - text: Whenever a court strikes down a statute.
        why: >-
          Tempting because it looks like a split in authority, but Austin's test concerns the bulk of members' obedience
          to one superior, not judicial review.
  - key: q207
    type: mcq
    concept: austins-sovereign
    difficulty: 2
    contrasts-with:
      - laws2100-w01-six-kinds-of-questions
    stem: >-
      "The existence of law is one thing; its merit or demerit is another." What kind of claim is this, according to the
      lecture?
    options:
      - text: >-
          A claim that law as it is must be kept separate from law as it ought to be — mainly a claim about
          jurisprudence.
        correct: true
        why: >-
          Correct — the lecture calls it a key positivist distinction, about the nature of law but more importantly
          about the nature of jurisprudence: theory concerns law as it is.
      - text: A normative claim that bad laws should not be obeyed.
        why: >-
          Tempting because it talks of merit, but the passage says a law which exists is a law though we dislike it; it
          is descriptive, not a call to disobey.
      - text: >-
          A claim that legal theory must evaluate the merit of each law before describing it, since description without
          evaluation is empty.
        why: >-
          Tempting as a reading of 'merit', but Austin's point is the opposite: whether a law exists and whether it is
          good are different enquiries.
  - key: q208
    type: mcq
    concept: austins-sovereign
    difficulty: 3
    contrasts-with:
      - laws2100-w01-general-and-descriptive-theory
    stem: Which two ideas does the lecture say Austin's positivism passages share with Hart's theory?
    options:
      - text: Descriptive and general.
        correct: true
        why: >-
          Correct — the lecture says the Lecture V passage is about the descriptive nature of legal theory and the
          Lecture XI passage about its generality: the same ideas as Hart's CL 239.
      - text: That law is a coercive social order, and that coercion is its genus.
        why: >-
          Tempting because both come from Lamond's list, but the coercive social order is Kelsen's view and coercion as
          genus is Austin's; neither is shared with Hart.
      - text: Justificatory and critical — theory should justify good law and criticise bad law.
        why: >-
          Tempting because last week listed these as normative claims, but Austin and Hart both separate the description
          of law from its merit or demerit.
  - key: q209
    type: mcq
    concept: austins-sovereign
    difficulty: 3
    stem: >-
      Austin says he will present principles "abstracted from every particular system", but illustrate them from Roman
      law and the law of England. What question does the lecture draw from this?
    options:
      - text: Whether Roman law is more advanced than English law.
        why: >-
          Tempting because Austin studied both, but the lecture draws no ranking; the issue is how a general theory
          relates to the particular systems it is built from.
      - text: Whether it is possible to develop a general theory of law, and at what level of generality we should work.
        correct: true
        why: >-
          Correct — the lecture asks whether a general theory is possible and at what level of generality, since all the
          examples we know are particular.
      - text: Whether a theory of law can be developed without studying any real legal system at all, from reason alone.
        why: >-
          Tempting because 'abstracted' suggests pure reason, but the lecture says theory does not come from the sky; it
          develops from knowledge of positive law.
  - key: q210
    type: mcq
    concept: austins-sovereign
    difficulty: 2
    stem: Why does the lecture mention Austin's time in Germany (1827–1828)?
    options:
      - text: Because it led him to reject Roman law entirely and rely on English law alone for his examples.
        why: >-
          Tempting because the period is mentioned alongside his English career, but Austin in fact illustrates his
          principles from both Roman law and English law.
      - text: Because it shows Austin was trained as a German judge before becoming a barrister.
        why: >-
          Tempting because he spent time there, but the slide says he was called to the Bar in 1818; Germany came after
          his election to the chair.
      - text: Because reflecting on a civilian system and the reception of Roman law coloured his general theory.
        correct: true
        why: >-
          Correct — the lecture says his time in Germany reflecting on German law and the reception of Roman law helped
          colour the way he thought about the nature of law.
  - key: q211
    type: mcq
    concept: austins-sovereign
    difficulty: 3
    stem: Which statement best describes why the lecture calls Austin's theory "a very neat general explanation of law"?
    options:
      - text: Because it only needs you to identify the highest power in a community and the general commands it issues.
        correct: true
        why: >-
          Correct — the lecture: do a kind of sociological investigation, identify the highest political power and its
          commands, and you have the laws — which is why it was accepted for decades.
      - text: Because it explains legal obligation through the internal point of view of the officials who apply the rules.
        why: >-
          Tempting because that is a strong explanation of obligation, but it is Hart's, and Hart introduces it
          precisely because Austin's theory lacks it.
      - text: Because it applies only to absolute monarchies, where the answer is obvious.
        why: >-
          Tempting because the absolute monarch is the lecture's example, but the lecture says the theory applies
          equally to a city state or a constitutional democracy.
  - key: q212
    type: mcq
    concept: austins-sovereign
    difficulty: 2
    variant-of: q207
    stem: >-
      "A law, which actually exists, is a law, though we happen to dislike it." Which of the six kinds of question does
      this passage keep apart from the question of what the law is?
    options:
      - text: Empirical questions about the effects of a law.
        why: >-
          Tempting because merit can depend on effects, but Austin contrasts existence with conformity to an assumed
          standard, which is a normative matter.
      - text: Normative questions about whether a law is good.
        correct: true
        why: >-
          Correct — conformity to an assumed standard is a normative question; Austin separates it from the descriptive
          question whether a law exists.
      - text: Methodological questions.
        why: >-
          Tempting because separating the questions is itself a method, but what Austin sets apart is the merit or
          demerit of a law — a normative question.
  - key: q213
    type: mcq
    concept: austins-sovereign
    difficulty: 3
    variant-of: q202
    stem: >-
      Imagine a colony whose governor habitually obeys instructions from a distant emperor, while the colonists
      habitually obey the governor. On Austin's definitions, the governor is:
    options:
      - text: The sovereign of an independent political society, because the colonists obey him.
        why: >-
          Tempting because the colonists' habit of obedience is present, but independence requires that the superior not
          habitually obey another; the governor obeys the emperor.
      - text: Not the sovereign; the society is not independent, since its superior habitually obeys another.
        correct: true
        why: >-
          Correct — a society is political and independent only if its superior does not habitually obey another person
          or body; the emperor is the sovereign.
      - text: A sovereign only if the colonists consent to his rule and regard his instructions as legitimate.
        why: >-
          Tempting because consent often grounds authority, but Austin's test is habitual obedience and independence,
          not consent or legitimacy.
  - key: q214
    type: mcq
    concept: austins-sovereign
    difficulty: 2
    contrasts-with:
      - harts-chapter-iii-objections
    stem: According to PJD 165, to whom does the sovereign set positive law?
    options:
      - text: To other sovereigns, through treaties and agreements between independent political societies.
        why: >-
          Tempting because sovereigns do deal with each other, but rules between them are international law, which
          Austin treats as positive morality.
      - text: To a member or members of the independent political society in which it is sovereign.
        correct: true
        why: >-
          Correct — PJD 165: every positive law is set by a sovereign person or body to a member or members of the
          independent political society wherein it is supreme.
      - text: To itself as well as its subjects.
        why: >-
          Tempting because modern legislators are bound by their own laws, but that is Hart's range-of-application
          objection; Austin's sovereign is not bound.
  - key: q215
    type: mcq
    concept: austins-sovereign
    difficulty: 1
    stem: Which work contains the passage "The existence of law is one thing; its merit or demerit is another"?
    options:
      - text: The Province of Jurisprudence Determined, Lecture V.
        correct: true
        why: >-
          Correct — the slide cites The Province of Jurisprudence Determined, Lecture V, for this famous and often
          misquoted positivist passage.
      - text: Hart, The Concept of Law, Chapter IV (Sovereign and Subject).
        why: >-
          Tempting because Hart quotes positivist themes, but Chapter IV is Hart's attack on the sovereign; the passage
          is Austin's own, from the Province.
      - text: Austin, Lectures on Jurisprudence, Lecture XI.
        why: >-
          Tempting because Lecture XI is quoted on the same slide, but it holds the 'abstracted from every particular
          system' passage about generality.
  - key: q216
    type: mcq
    concept: austins-sovereign
    difficulty: 2
    contrasts-with:
      - habits-and-rules
    stem: Why does Hart's Chapter IV target the habit of obedience in particular?
    options:
      - text: >-
          Because Austin himself admitted in Lecture VI that habits of obedience were the weakest part of his whole
          theory.
        why: >-
          Tempting as an explanation, but the lecture gives no such admission; Hart picks the habit of obedience because
          the rest of the theory depends on it.
      - text: Because Austin's idea of sovereignty conceptually depends on the concept of a habit of obedience.
        correct: true
        why: >-
          Correct — the sovereign is the one habitually obeyed who obeys no one else, so sovereignty, and so positive
          law, depend on the habit of obedience: the main pillar.
      - text: Because habits are always irrational.
        why: >-
          Tempting because habits seem thoughtless, but Hart's point is that habits are not normative and cannot confer
          rights or authority, not that they are irrational.
  - key: q217
    type: truefalse
    set: quickfire
    concept: austins-sovereign
    difficulty: 1
    statement: Austin's definition of a political society requires a defined territory.
    answer: false
    why: >-
      False — the lecture points out that Austin does not talk about territory; the key idea is habitual obedience to a
      determinate and common superior.
  - key: q218
    type: truefalse
    set: quickfire
    concept: austins-sovereign
    difficulty: 1
    statement: For Austin, a sovereign can be a body of persons as well as a single person.
    answer: true
    why: >-
      True — PJD 165 speaks of 'a sovereign person, or a sovereign body of persons'; the lecture gives a council of
      elders or a parliament as examples.
  - key: q219
    type: truefalse
    set: quickfire
    concept: austins-sovereign
    difficulty: 2
    statement: Austin's Lecture V passage says that a law we dislike is, for that reason, not really a law.
    answer: false
    why: >-
      False — the passage says the opposite: a law which actually exists is a law, though we happen to dislike it;
      existence and merit are different enquiries.
  - key: q220
    type: truefalse
    set: quickfire
    concept: austins-sovereign
    difficulty: 2
    statement: Austin claims to present the principles of jurisprudence abstracted from every particular system.
    answer: true
    why: >-
      True — Lecture XI of the Lectures on Jurisprudence says so, while promising examples from Roman law and the law of
      England.
  - key: q221
    type: short
    concept: austins-sovereign
    difficulty: 3
    prompt: '''Austin''s theory is general only in name: it is English and Roman law dressed up as law in general.'' Discuss.'
    model: >-
      The charge has force, but it confuses where a theory starts with what it claims. Austin says he will present the

      principles of jurisprudence "abstracted from every particular system", while illustrating them from the two
      systems

      he had studied with accuracy, Roman law and the law of England. His core definitions are built to travel: a
      society

      is political iff the generality of its members is in a habit of obedience to a determinate and common superior,
      and

      independent iff that superior obeys no one else. The definition needs no territory or modern state, so it fits a

      city state, an absolute monarchy, a council of elders or a constitutional democracy. The strongest case for the

      charge is that all our knowledge of law is of particular systems, and some say we can only speak meaningfully of
      the

      here and now; Austin's own time in Germany coloured his theory. But a theory must start somewhere; the test is
      whether

      its concepts fit other systems. My conclusion: Austin's generality is real in form but untested in content, and
      Hart's

      later objections are where it fails.
    rubric:
      - id: r1
        criterion: Thesis — takes a clear position on whether Austin's theory is genuinely general.
        marks: 2
        top-band: Gives a precise, qualified answer and signals the distinction it turns on (starting point vs claim).
        margin-note: What exactly is your position?
        authorities: []
      - id: r2
        criterion: Argument — explains Austin's claim to generality and the sovereign/independent political society definitions.
        marks: 3
        top-band: Quotes Lecture XI and shows why the definition of political society is built to travel (no territory needed).
        margin-note: Show why the definition could apply beyond England.
        authorities:
          - austin-lectures-on-jurisprudence
          - austin-province-of-jurisprudence-determined
      - id: r3
        criterion: Counterargument — states the strongest version of the parochialism charge.
        marks: 2
        top-band: >-
          Uses the lecture's point that our knowledge of law is always of particular systems, and Austin's two
          illustrative systems.
        margin-note: Put the charge at its strongest.
        authorities: []
      - id: r4
        criterion: Evaluation — weighs the two and reaches a reasoned conclusion.
        marks: 2
        top-band: >-
          Separates the origin of a theory from its test, and links the verdict to whether the concepts fit other
          systems.
        margin-note: Why does your answer survive the objection?
        authorities: []
  - key: q301
    type: mcq
    concept: gunman-situation
    difficulty: 1
    set: pretest
    contrasts-with:
      - austins-command-theory
    stem: In the gunman situation, what does Hart say about the bank clerk who hands over the money?
    options:
      - text: The clerk had an obligation to hand it over, because a command backed by a threat was issued.
        why: >-
          Tempting because that is what Austin's correlation of command and duty implies, but Hart's whole point is that
          we would not say the clerk had an obligation.
      - text: The clerk was obliged to hand it over, but had no obligation to.
        correct: true
        why: >-
          Correct — Hart separates being obliged from having an obligation: the clerk was forced, so obliged, but was
          not under an obligation to give the gunman the money.
      - text: The clerk had a moral duty to comply, to avoid bloodshed.
        why: >-
          Tempting because avoiding harm matters morally, but Hart's distinction is linguistic and conceptual; he does
          not say the clerk had a moral duty to comply.
  - key: q302
    type: mcq
    concept: gunman-situation
    difficulty: 2
    stem: Why does Hart prefer "orders backed by threats" or "coercive orders" to Austin's word "command"?
    options:
      - text: Because "command" is a technical military term with no place in legal theory.
        why: >-
          Tempting because the lecture mentions the military context, but Hart uses it to show that commands involve
          authority, not to banish the word from theory.
      - text: Because to command is characteristically to exercise authority, not power to inflict harm.
        correct: true
        why: >-
          Correct — CL 20: a command is primarily an appeal not to fear but to respect for authority; the gunman has
          only power, so Hart uses 'coercive orders'.
      - text: >-
          Because Austin never used the word "command" in the Province, preferring the plainer words "order" and
          "threat".
        why: >-
          Tempting if you forget the reading, but CL 16 says the order backed by threats is what Austin himself termed a
          'command'.
  - key: q303
    type: mcq
    concept: gunman-situation
    difficulty: 2
    stem: Which is NOT one of the four elements Hart adds to the gunman situation to get a plausible model for law?
    options:
      - text: Generality of conduct and of persons.
        why: >-
          Tempting to exclude, but generality — a general type of conduct and a general class of persons — is the first
          of the four elements on the slide.
      - text: Acceptance of the orders from the internal point of view.
        correct: true
        why: >-
          Correct — acceptance and the internal point of view belong to Hart's own theory; the four elements are
          generality, enduring character, general habit of obedience, supremacy and independence.
      - text: A general habit of obedience.
        why: >-
          Tempting to exclude because habits are what Hart later attacks, but a general habit of obedience is one of the
          four elements he adds in Chapter II.
      - text: Enduring character.
        why: >-
          Tempting to exclude because it sounds minor, but the enduring character of orders is the second element: the
          gunman's order ends when he leaves the bank.
  - key: q304
    type: mcq
    concept: gunman-situation
    difficulty: 2
    stem: What is the gunman situation "writ large", according to CL 82?
    options:
      - text: A situation where A is the sovereign habitually obeyed and the orders are general.
        correct: true
        why: >-
          Correct — CL 82 on the slide: A must be the sovereign habitually obeyed and the orders must be general,
          prescribing courses of conduct not single actions.
      - text: Any situation in which a robber commits an offence against a large institution such as a bank.
        why: >-
          Tempting because of the bank example, but 'writ large' means scaled up from one gunman to a legal system with
          a sovereign and general orders.
      - text: A situation where the victim comes to accept the gunman's orders as legitimate.
        why: >-
          Tempting because acceptance turns power into authority, but the coercive-orders model deliberately brackets
          authority and acceptance.
  - key: q305
    type: mcq
    concept: gunman-situation
    difficulty: 3
    stem: How does the lecture describe what Hart is doing when he builds the model of coercive orders in Chapter II?
    options:
      - text: >-
          Giving a historically accurate exegesis of Austin's texts, so that his criticisms cannot be dismissed as
          misreadings.
        why: >-
          Tempting because Hart discusses Austin at length, but the lecture says Hart revisits Austin for theoretical
          purposes; historical accuracy is not the point.
      - text: >-
          Building the strongest possible version of Austin's theory, then attacking it — an indirect criticism of
          Austin.
        correct: true
        why: >-
          Correct — the lecture says Hart develops the best possible version of Austin's theory and then, in Chapters
          III and IV, attacks the model: charitable interpretation.
      - text: Setting out his own theory of law.
        why: >-
          Tempting because Hart later uses the example to build his own theory, but the Chapter II model is Austin-like,
          not Hart's own view.
  - key: q306
    type: mcq
    concept: gunman-situation
    difficulty: 2
    stem: What does the principle of charitable interpretation require, according to the slides?
    options:
      - text: Interpreting a claim in the most rational way possible and discussing its best, strongest version.
        correct: true
        why: >-
          Correct — the slide: interpret a given statement or claim in the most rational way possible and discuss its
          best, strongest possible version.
      - text: Agreeing with an author wherever possible and softening any criticism so as to be fair to them as a person.
        why: >-
          Tempting because 'charity' suggests kindness, but the principle is about strengthening the view before
          criticising it, not about avoiding criticism.
      - text: Pointing out every inconsistency in the author's text before engaging with the argument itself.
        why: >-
          Tempting as rigorous reading, but Hart explicitly ignores Austin's doubtful meanings and inconsistencies to
          state a clear and consistent position.
  - key: q307
    type: mcq
    concept: gunman-situation
    difficulty: 3
    stem: In CL 18 Hart says he developed Austin's hints "in part along the lines followed by later theorists such as" whom?
    options:
      - text: Bentham.
        why: >-
          Tempting because Bentham is grouped with Austin in the imperative theory, but Bentham came before Austin; CL
          18 names a later theorist.
      - text: Dworkin.
        why: >-
          Tempting because Dworkin is in Lamond's list, but Dworkin was Hart's later critic; CL 18 names the theorist
          Hart used to strengthen Austin.
      - text: Kelsen.
        correct: true
        why: >-
          Correct — CL 18: where Austin merely gives hints, Hart develops them 'in part along the lines followed by
          later theorists such as Kelsen'.
  - key: q308
    type: mcq
    concept: gunman-situation
    difficulty: 3
    stem: >-
      A judge orders a named litigant to pay damages. How does the lecture fit this individual order into the
      "generality" element of the model?
    options:
      - text: It shows the law is really a set of individual orders, so generality should be dropped from the model.
        why: >-
          Tempting because the order is addressed to one person, but the lecture says such orders are justified in light
          of a general legal requirement.
      - text: >-
          It is an individual legal order, but it is justified in light of a general requirement; most legal
          requirements are general.
        correct: true
        why: >-
          Correct — the lecture's example: specific orders exist at the end of a trial, but are justified by a general
          requirement capturing a type of conduct and class of persons.
      - text: It is not law at all, since only the sovereign issues legal orders.
        why: >-
          Tempting because of Austin's sovereign, but the model includes orders issued by the sovereign or subordinates
          in obedience to the sovereign (CL 25).
  - key: q309
    type: mcq
    concept: gunman-situation
    difficulty: 2
    stem: At the end of Chapter II (CL 25), what does Hart say the laws of any country will be on the model?
    options:
      - text: The rules accepted by officials as common standards of behaviour, whether or not backed by threats.
        why: >-
          Tempting because it is Hart's own later view, but the CL 25 statement is the Austin-like model, built only
          from orders, threats and habits.
      - text: >-
          The general orders backed by threats issued either by the sovereign or by subordinates in obedience to the
          sovereign.
        correct: true
        why: >-
          Correct — CL 25: if we call the supreme and independent person or body the sovereign, the laws of any country
          will be the general orders backed by threats issued by the sovereign or subordinates.
      - text: Whatever the gunman demands.
        why: >-
          Tempting as a joke about the model, but the model is the gunman situation writ large, with generality,
          endurance, habit of obedience and a sovereign.
  - key: q310
    type: mcq
    concept: gunman-situation
    difficulty: 3
    stem: Which statement best explains why the gunman example matters for Hart's answer to "what is law?"
    options:
      - text: It shows that legal systems are no more than organised crime.
        why: >-
          Tempting because the model compares law to a robbery, but Hart's point is that the model fails; law involves
          authority and obligation, not only power.
      - text: It isolates the simple notions the imperative theory relies on, so they can be tested.
        correct: true
        why: >-
          Correct — the lecture says Hart starts from the simple example to see how powerful it is as an explanation of
          law at a general level, then tests it.
      - text: It proves that coercion plays no role in law at all, since authority, not force, is what makes a rule legal.
        why: >-
          Tempting because Hart criticises the model, but he recognises a coercive element in the legal systems we know;
          law is more than coercion, not free of it.
  - key: q311
    type: mcq
    concept: gunman-situation
    difficulty: 2
    stem: Why does the lecture say Hart uses the phrase "being obliged" versus "having an obligation"?
    options:
      - text: To reflect on how we use ordinary language to convey ideas, in the Oxford philosophy of his time.
        correct: true
        why: >-
          Correct — the lecture says Hart analyses the way we use ordinary English to discover conceptual truths, the
          distinguishing feature of Oxford philosophy then.
      - text: To show that English has two words for the same idea, which theorists should treat as interchangeable.
        why: >-
          Tempting because the words look like synonyms, but Hart's point is that they convey different ideas: being
          forced versus being under an obligation.
      - text: Because Austin himself drew the distinction in Lecture I and Hart is simply reporting it.
        why: >-
          Tempting because Hart follows Austin closely, but the distinction is Hart's; for Austin a signified command
          backed by evil already imposes a duty.
  - key: q312
    type: mcq
    concept: gunman-situation
    difficulty: 3
    contrasts-with:
      - law-and-coercion
    stem: >-
      Which author, according to the lecture, criticises the way Hart used the distinction between being obliged and
      having an obligation?
    options:
      - text: Grant Lamond.
        why: >-
          Tempting because Lamond writes on coercion and the nature of law, but the lecture names Schauer as critical of
          Hart's use of the obliged/obligation distinction.
      - text: Schauer.
        correct: true
        why: >-
          Correct — the lecture says Schauer is critical of how Hart used the distinction, and his article says Hart's
          criticism of Austin is problematic in two distinct ways.
      - text: Hans Kelsen.
        why: >-
          Tempting because Kelsen used a similar gunman example, but the lecture names Schauer, whose article on Austin
          and Hart is this week's reading.
  - key: q313
    type: mcq
    concept: gunman-situation
    difficulty: 3
    variant-of: q301
    contrasts-with:
      - habits-and-rules
    stem: >-
      An occupying army posts general orders, enforced by patrols, which the population has obeyed for years; the army
      obeys no one locally. Which is the best Hartian analysis?
    options:
      - text: >-
          It fits the Chapter II model, yet on Hart's analysis the population is obliged rather than under an
          obligation.
        correct: true
        why: >-
          Correct — generality, endurance, habitual obedience and supremacy are present, so the model fits; but for Hart
          coercion alone gives being obliged, not an obligation.
      - text: It fails the model entirely, because orders backed by threats can never be general.
        why: >-
          Tempting because the gunman's order was individual, but Hart adds generality precisely so the model covers
          general orders backed by threats.
      - text: >-
          It is a paradigm case of law, since the population has an obligation wherever there is a sovereign habitually
          obeyed and a threat.
        why: >-
          Tempting because that is what Austin's theory says, but it assumes the command theory Hart is testing; he
          separates obliged from obligation.
  - key: q314
    type: mcq
    concept: gunman-situation
    difficulty: 2
    variant-of: q303
    stem: >-
      Which element added to the gunman situation answers the point that "the second the gunman leaves the bank, it's
      all over"?
    options:
      - text: Generality.
        why: >-
          Tempting because generality is also missing from the robbery, but it concerns types of conduct and classes of
          persons, not duration.
      - text: Supremacy and independence.
        why: >-
          Tempting because the gunman is not a sovereign, but supremacy and independence concern the sovereign's
          position, not the persistence of orders over time.
      - text: Enduring character.
        correct: true
        why: >-
          Correct — the lecture: the gunman interaction is very limited in time, but legal requirements endure; they
          persist over time, so the model needs enduring character.
  - key: q315
    type: mcq
    concept: gunman-situation
    difficulty: 2
    variant-of: q302
    stem: What does CL 20 say is "much closer to that of law than our gunman's order backed by threats"?
    options:
      - text: The idea of a sanction, since every legal system punishes offenders.
        why: >-
          Tempting because sanctions are central to Austin, but CL 20 contrasts the gunman's order with command, because
          of its connection with authority.
      - text: The idea of a command, with its very strong connection with authority.
        correct: true
        why: >-
          Correct — CL 20: 'the idea of a command with its very strong connection with authority is much closer to that
          of law than our gunman's order backed by threats'.
      - text: The idea of a habit.
        why: >-
          Tempting because habits appear in the model, but Hart later says habits are not normative; CL 20 is about
          command and authority.
  - key: q316
    type: mcq
    concept: gunman-situation
    difficulty: 1
    stem: Where in The Concept of Law does the gunman situation first appear?
    options:
      - text: At page 6, at the very beginning of the book.
        correct: true
        why: >-
          Correct — the slide cites CL 6; the lecture says 'we're really at the very beginning of the book', and Hart
          refers back to the example many times later.
      - text: In the Postscript, answering Dworkin.
        why: >-
          Tempting because the Postscript answers critics, but the gunman is introduced in Chapter 1 at CL 6 and then
          modelled in Chapter II.
      - text: In Chapter IV (Sovereign and Subject), as the last step of the argument against the habit of obedience.
        why: >-
          Tempting because Chapter IV is this week's key reading, but the example first appears at CL 6 and is modelled
          in Chapter II.
  - key: q317
    type: truefalse
    set: quickfire
    concept: gunman-situation
    difficulty: 1
    statement: Hart uses the expression "coercive orders" for orders which, like the gunman's, are supported only by threats.
    answer: true
    why: >-
      True — CL 19 on the slide: 'orders backed by threats' and 'coercive orders' refer to orders which, like the
      gunman's, are supported only by threats.
  - key: q318
    type: truefalse
    set: quickfire
    concept: gunman-situation
    difficulty: 2
    statement: Hart's Chapter II model of coercive orders is his own theory of law.
    answer: false
    why: >-
      False — it is a reconstruction of Austin's theory in its strongest form; Hart builds it in Chapter II in order to
      attack it in Chapters III and IV.
  - key: q319
    type: truefalse
    set: quickfire
    concept: gunman-situation
    difficulty: 2
    statement: In building his model, Hart states Austin's views exactly as written, inconsistencies included.
    answer: false
    why: >-
      False — CL 18: Hart has not hesitated, where Austin's meaning is doubtful or inconsistent, to ignore this and
      state a clear and consistent position.
  - key: q320
    type: short
    concept: gunman-situation
    difficulty: 3
    prompt: >-
      'Hart's gunman is a straw man: no one ever thought law was a robbery.' Discuss, with reference to Hart's method in
      Chapter II.
    model: >-
      The charge misreads Hart's method: the gunman is not a straw man but the opposite, a steel man. Hart starts from
      the

      situation where one person gives another an order backed by threats because, to some, it seemed to be "the essence
      of

      law, or at least 'the key to the science of jurisprudence'" — the starting point of Austin's analysis. He then
      adds

      four elements — generality, enduring character, a general habit of obedience, supremacy and independence — so that

      the model becomes the gunman situation writ large: general orders backed by threats issued by a sovereign or

      subordinates (CL 25). He says he ignored Austin's inconsistencies and developed his hints, partly along Kelsen's
      lines,

      so the doctrine is "stated in its strongest form" (CL 18). The best case for the charge is that the bare robbery
      lacks

      authority, so comparing law to it stacks the deck; Schauer also criticises how Hart used obliged versus
      obligation. But

      Hart concedes the point about authority openly (CL 20) and tests the full model, not the robbery. On balance, the

      method is charitable interpretation, and the criticisms land on Austin's strongest form.
    rubric:
      - id: r1
        criterion: Thesis — takes a clear position on whether the gunman is a straw man.
        marks: 2
        top-band: States a clear answer and names the concept it turns on (charitable interpretation).
        margin-note: What is your answer?
        authorities: []
      - id: r2
        criterion: Argument — explains the gunman situation, the four added elements and CL 18.
        marks: 3
        top-band: >-
          Walks from the robbery to the gunman situation writ large with the four elements and quotes the 'strongest
          form' passage.
        margin-note: How does the robbery become a model of a legal system?
        authorities:
          - hart-the-concept-of-law
      - id: r3
        criterion: Counterargument — states the strongest case that the model is unfair to Austin.
        marks: 2
        top-band: Uses the missing element of authority and Schauer's criticism of obliged/obligation.
        margin-note: Is there anything to the straw-man charge?
        authorities:
          - schauer-was-austin-right-after-all
      - id: r4
        criterion: Evaluation — weighs the two and reaches a reasoned conclusion.
        marks: 2
        top-band: Shows that Hart tests the full model, not the bare robbery, and explains why that answers the charge.
        margin-note: Why does the charge fail — or succeed?
        authorities: []
  - key: q401
    type: mcq
    concept: harts-chapter-iii-objections
    difficulty: 1
    set: pretest
    stem: >-
      In which of his three Chapter III objections does Hart introduce the distinction between duty-imposing and
      power-conferring rules?
    options:
      - text: The range of application of laws.
        why: >-
          Tempting because range is the second objection, but it concerns laws binding the legislators themselves; the
          duty/power distinction belongs to the content objection.
      - text: The content of laws.
        correct: true
        why: >-
          Correct — the slide pairs 'the content of laws' with duty-imposing and power-conferring rules; it is the
          best-known of the three objections.
      - text: The modes of origin of laws, such as custom and legislation.
        why: >-
          Tempting because origin is a Chapter III objection, but it is about customary law not being issued by the
          sovereign, not about the kinds of rules.
  - key: q402
    type: mcq
    concept: harts-chapter-iii-objections
    difficulty: 2
    contrasts-with:
      - austins-command-theory
    stem: Why are rules for making a valid will a problem for the model of coercive orders?
    options:
      - text: Because wills are private documents that the state never enforces or recognises in its courts after death.
        why: >-
          Tempting because wills are private, but courts do give effect to valid wills; the problem is that the rules
          confer a power rather than impose a duty.
      - text: Because there is no duty to make a will; the rules give a power to do so if you follow the procedure.
        correct: true
        why: >-
          Correct — the lecture: there is no duty to have a will, but if you want one there is a procedure; such
          power-conferring rules do not look like orders backed by threats.
      - text: Because wills are governed by custom rather than statute.
        why: >-
          Tempting because custom is the third objection, but the lecture's point about wills is the content of the rule
          — conferring a power — not its origin.
  - key: q403
    type: mcq
    concept: harts-chapter-iii-objections
    difficulty: 2
    stem: What is the "range of application" objection?
    options:
      - text: That laws apply to the legislators who make them, whereas Austin's sovereign commands only others.
        correct: true
        why: >-
          Correct — the lecture: legislators create laws that apply to every member of the community, including
          themselves, which the model of a sovereign above the community cannot explain.
      - text: That laws apply to too many people for a single sovereign to supervise their obedience personally.
        why: >-
          Tempting because range sounds like reach, but the objection is that the law-makers are themselves bound, not
          that the sovereign cannot supervise everyone.
      - text: That laws apply only within a territory.
        why: >-
          Tempting because jurisdiction is territorial, but the lecture notes Austin's definition does not rely on
          territory; the objection is about law binding its makers.
  - key: q404
    type: mcq
    concept: harts-chapter-iii-objections
    difficulty: 2
    stem: How does Austin answer the problem of customary law, according to the lecture?
    options:
      - text: He denies that customs are ever part of the law of a modern state, whatever the courts say.
        why: >-
          Tempting because Austin's law comes from the sovereign, but the lecture says Austin discusses custom and
          treats it as tacitly commanded, not as excluded.
      - text: Customs are tacit orders of the sovereign, who by not interfering tacitly accepts them.
        correct: true
        why: >-
          Correct — the lecture: Austin treats customs as tacit orders of the sovereign; by not interfering with
          customary law, the sovereign tacitly accepts it.
      - text: Customs bind because the community accepts them from the internal point of view.
        why: >-
          Tempting because that is close to Hart's rule-based explanation, but it is not Austin's answer; Austin keeps
          the sovereign as the source by treating custom as a tacit order.
  - key: q405
    type: mcq
    concept: harts-chapter-iii-objections
    difficulty: 3
    stem: What does the lecture say is Hart's strategy throughout Chapter III?
    options:
      - text: To use examples from real law as counter-examples that test the theory on its own descriptive criteria.
        correct: true
        why: >-
          Correct — Hart uses real legal systems against a theory meant to describe law as it is; if the theory does not
          fit the facts, you change the theory.
      - text: To show that Austin's theory is morally objectionable because it reduces law to the will of the powerful.
        why: >-
          Tempting because the model does look like might, but Hart's objections are about fit with real legal systems,
          not moral objection to the theory.
      - text: To argue from pure logic that commands cannot be general.
        why: >-
          Tempting because generality is at stake, but Hart argues from real legal examples, not a priori logic, and he
          himself builds generality into the model.
  - key: q406
    type: mcq
    concept: harts-chapter-iii-objections
    difficulty: 3
    contrasts-with:
      - laws2100-w01-six-kinds-of-questions
    stem: Which statement best captures what the lecture calls a "meta-theoretical" point about Hart's criticism?
    options:
      - text: >-
          Hart criticises Austin using a new standard that Austin never accepted, that a theory must explain legal
          authority from the inside.
        why: >-
          Tempting because authority is where Hart ends up, but the lecture stresses that Hart uses the same criteria
          Austin used — fit with positive law.
      - text: >-
          Hart uses the same criteria Austin used: a descriptive theory of positive law must explain elements of real
          legal systems.
        correct: true
        why: >-
          Correct — the lecture: Hart criticises Austin on the same meta-theoretical criteria Austin used to develop his
          theory; it was meant to describe law as it is.
      - text: Hart concedes that no theory of law can fit the facts.
        why: >-
          Tempting because every theory meets counter-examples, but Hart's strategy assumes a good descriptive theory
          can and must fit the facts of real systems.
  - key: q407
    type: mcq
    concept: harts-chapter-iii-objections
    difficulty: 2
    stem: After raising the power-conferring rules objection, what does Hart do next, according to the lecture?
    options:
      - text: He moves straight to Chapter IV, treating the objection as decisive.
        why: >-
          Tempting because the objection is well known, but the lecture says the next section is divided into two parts
          answering possible replies.
      - text: >-
          He states replies that Austin or someone like Kelsen could make, and engages with those
          counter-counter-arguments.
        correct: true
        why: >-
          Correct — the lecture: Austin is not there to defend himself, so Hart supplies the replies Austin or Kelsen
          could make and engages with them.
      - text: He drops the objection because Austin already recognised power-conferring rules in the Province.
        why: >-
          Tempting because Austin does recognise such laws, but Hart presses the objection: can the model explain their
          existence? He does not drop it.
  - key: q408
    type: mcq
    concept: harts-chapter-iii-objections
    difficulty: 3
    variant-of: q402
    stem: >-
      Carla signs a contract without the formalities the law requires, so it is not valid. How would Hart describe what
      has happened?
    options:
      - text: Carla has disobeyed an order backed by threats and will be sanctioned.
        why: >-
          Tempting because failure seems like breach, but there is no duty to make contracts; she has simply failed to
          exercise a legal power validly.
      - text: >-
          Carla has failed to follow the procedure a power-conferring rule sets for creating a valid contract; she has
          broken no duty.
        correct: true
        why: >-
          Correct — power-conferring rules give powers to do things if you follow the steps; failing to follow them
          means no valid contract, not a breach of duty.
      - text: Carla has broken a customary rule, which is law only because the sovereign tacitly commands it.
        why: >-
          Tempting because tacit command is Austin's answer to custom, but contract formalities are about conferring
          powers, the content objection.
  - key: q409
    type: mcq
    concept: harts-chapter-iii-objections
    difficulty: 2
    stem: Which example does the lecture give of legal requirements that DO resemble Austin's commands?
    options:
      - text: Some rules of the criminal law.
        correct: true
        why: >-
          Correct — the lecture: in the criminal law of real jurisdictions some requirements resemble Austin's commands:
          this is forbidden, and if you do it you go to jail.
      - text: Rules on how to make a valid will.
        why: >-
          Tempting because wills are in the lecture, but they are the counter-example: power-conferring rules do not
          resemble orders backed by threats.
      - text: Rules for getting legally married in a way that the state will recognise.
        why: >-
          Tempting because marriage is regulated, but the lecture uses marriage with wills and contracts as examples of
          powers, not of commands.
  - key: q410
    type: mcq
    concept: harts-chapter-iii-objections
    difficulty: 3
    variant-of: q403
    stem: >-
      Parliament passes a tax that applies to all residents, including members of Parliament. Which Chapter III
      objection does this illustrate?
    options:
      - text: 'Content: tax law is power-conferring.'
        why: >-
          Tempting because Chapter III's first objection is best known, but a tax imposes a duty; the point here is who
          the law binds.
      - text: 'Range of application: the law binds those who made it.'
        correct: true
        why: >-
          Correct — in Austin's theory the sovereign's commands are for the rest of the community; here the law-makers
          are bound too, which the model cannot explain.
      - text: 'Modes of origin: the tax arose from custom and was later confirmed.'
        why: >-
          Tempting because origin is the third objection, but the tax was enacted by Parliament; the example turns on
          the legislators being bound.
  - key: q411
    type: mcq
    concept: harts-chapter-iii-objections
    difficulty: 2
    stem: Why does the lecture say "you cannot change the reality of law, you need to change the theory"?
    options:
      - text: Because a theory meant to describe law as it is must fit the facts of real legal systems.
        correct: true
        why: >-
          Correct — the lecture: a good descriptive theory must be able to explain power-conferring rules and other
          elements of real systems; if it does not fit, revise the theory.
      - text: Because law never really changes, so theories of law must simply record what already exists.
        why: >-
          Tempting as a reading of 'reality', but law does change; the point is that the theory, not the law, is
          answerable to the facts.
      - text: Because normative theories are more important than descriptive ones.
        why: >-
          Tempting because it sounds like a priority claim, but the sentence is about descriptive theories fitting the
          facts, not ranking normative above descriptive theory.
  - key: q412
    type: mcq
    concept: harts-chapter-iii-objections
    difficulty: 2
    variant-of: q401
    stem: Which of these is a power-conferring rather than a duty-imposing rule?
    options:
      - text: A rule forbidding assault on pain of imprisonment.
        why: >-
          Tempting because it is a clear legal rule, but forbidding conduct on pain of a sanction is a duty-imposing
          rule — the kind that resembles a coercive order.
      - text: A rule requiring drivers to stop at red lights.
        why: >-
          Tempting because traffic rules are everywhere, but requiring conduct imposes a duty; the lecture's
          power-conferring examples are wills, contracts and marriage.
      - text: A rule setting out how to make a valid will.
        correct: true
        why: >-
          Correct — rules for making a valid will give people a power to do something legally if they follow the
          procedure; there is no duty to make a will.
  - key: q413
    type: mcq
    concept: harts-chapter-iii-objections
    difficulty: 3
    contrasts-with:
      - habits-and-rules
    stem: Which statement about the three Chapter III objections is accurate according to the lecture?
    options:
      - text: Most people focus on the first line of criticism, but the other two are equally important.
        correct: true
        why: >-
          Correct — the lecture: the other two objections are a bit shorter, and most people focus on the first, but the
          other two are equally important.
      - text: Only the content objection matters; the other two were abandoned by Hart in later chapters.
        why: >-
          Tempting because the content objection is the famous one, but the lecture says the other two are equally
          important; Hart does not abandon them.
      - text: The three objections are Hart's criticism of the habit of obedience.
        why: >-
          Tempting because Hart does attack the habit of obedience, but that is Chapter IV; Chapter III's objections
          concern content, range and origin of laws.
  - key: q414
    type: mcq
    concept: harts-chapter-iii-objections
    difficulty: 3
    variant-of: q404
    stem: >-
      A village rule on grazing rights developed over generations and was never enacted. How would Austin and Hart
      differ on it?
    options:
      - text: Both would say it is not law because it was never enacted.
        why: >-
          Tempting because it was never enacted, but Austin can count it as law via tacit command, and Hart treats
          customary law as still part of the law.
      - text: >-
          Austin: law only as a tacit order of a sovereign who does not interfere; Hart: custom is law not issued by any
          sovereign.
        correct: true
        why: >-
          Correct — Austin treats customs as tacit orders; Hart's modes-of-origin objection is that customs develop in
          the community and are not created by the sovereign.
      - text: 'Austin: law because the villagers accept it; Hart: not law, because only a sovereign''s orders count as law.'
        why: >-
          Tempting because each view is named, but the positions are reversed: acceptance is Hart's kind of explanation,
          and Austin is the one who needs a sovereign.
  - key: q415
    type: mcq
    concept: harts-chapter-iii-objections
    difficulty: 1
    stem: What is the title of Chapter III of The Concept of Law?
    options:
      - text: '''Sovereign and Subject''.'
        why: >-
          Tempting because it is this week's key reading, but 'Sovereign and Subject' is Chapter IV; Chapter III is 'The
          Variety of Laws'.
      - text: '''The Variety of Laws''.'
        correct: true
        why: >-
          Correct — the slide lists Chapter III as 'The Variety of Laws': the variety of laws (powers, range, custom) is
          what the model fails to explain.
      - text: '''Laws, Commands, and Orders''.'
        why: >-
          Tempting because it is the preceding chapter, but 'Laws, Commands, and Orders' is Chapter II, where Hart
          builds the model of coercive orders.
  - key: q416
    type: mcq
    concept: harts-chapter-iii-objections
    difficulty: 2
    stem: >-
      Which feature of power-conferring rules makes the lecture ask whether they can be "a matter of coercive order" at
      all?
    options:
      - text: >-
          They tell people how to do things legally if they choose to, rather than commanding them on pain of a
          sanction.
        correct: true
        why: >-
          Correct — wills, contracts, marriage: the law gives people powers; failure means invalidity, not a threatened
          evil, so it is hard to see a coercive order.
      - text: They are enforced by more severe sanctions than duty-imposing rules.
        why: >-
          Tempting because enforcement seems central, but the point is the opposite: there is no sanction for failing to
          use a power, only an invalid act.
      - text: They are only found in public law.
        why: >-
          Tempting because public law confers powers on officials, but the lecture's examples include private law —
          contracts and wills — as well as public law.
  - key: q417
    type: truefalse
    set: quickfire
    concept: harts-chapter-iii-objections
    difficulty: 1
    statement: >-
      The distinction between duty-imposing and power-conferring rules is introduced in Chapter III, under the content
      of laws.
    answer: true
    why: >-
      True — the slide lists the content of laws with duty-imposing and power-conferring rules as the first of Chapter
      III's three groups of objections.
  - key: q418
    type: truefalse
    set: quickfire
    concept: harts-chapter-iii-objections
    difficulty: 2
    statement: Austin treats customs as tacit orders of the sovereign.
    answer: true
    why: >-
      True — the lecture: by not interfering with customary law the sovereign tacitly accepts it, so customs are in a
      way endorsed or issued by the sovereign.
  - key: q419
    type: truefalse
    set: quickfire
    concept: harts-chapter-iii-objections
    difficulty: 2
    statement: The range-of-application objection is that laws are too general to be commands.
    answer: false
    why: >-
      False — range of application concerns who the law binds: legislators are bound by their own laws, whereas Austin's
      sovereign only commands others.
  - key: q420
    type: short
    concept: harts-chapter-iii-objections
    difficulty: 3
    prompt: '''Power-conferring rules are simply fragments of orders backed by threats.'' Discuss.'
    model: >-
      The statement is the strongest reply an Austinian can make to Hart's content objection, but it distorts what such

      rules do. In Chapter III Hart distinguishes duty-imposing from power-conferring rules. Some criminal law resembles

      coercive orders: this is forbidden, and if you do it you go to jail. But contracts, wills and marriage are
      different:

      the law gives people powers to do things if they follow the steps. There is no duty to make a will; failing to
      follow

      the procedure produces no valid will, not a sanction. The counterargument, which Hart himself states in the
      replies

      Austin or someone like Kelsen could make, is that power-conferring rules can somehow be fitted back into the model
      of

      orders backed by threats; Austin himself recognised such laws. Hart's strategy answers it on Austin's own
      criteria: a descriptive theory of positive law

      must explain elements of real legal systems as they are, and if the theory does not fit the facts, you change the

      theory. On balance the redescription saves the model only by misdescribing the practice, so the objection stands.
    rubric:
      - id: r1
        criterion: Thesis — takes a clear position on whether power-conferring rules reduce to orders backed by threats.
        marks: 2
        top-band: States a clear, qualified thesis and the criterion it will use (fit with real legal systems).
        margin-note: Where do you stand?
        authorities: []
      - id: r2
        criterion: Argument — explains the duty-imposing / power-conferring distinction with the lecture's examples.
        marks: 3
        top-band: Uses wills, contracts and marriage accurately and explains why failure is invalidity, not a sanction.
        margin-note: What happens if you get the formalities wrong?
        authorities:
          - hart-the-concept-of-law
      - id: r3
        criterion: Counterargument — states the Austinian (or Kelsenian) reply at its strongest.
        marks: 2
        top-band: Shows that Hart himself considers the replies Austin or Kelsen could make, and puts one fairly.
        margin-note: What would Austin say back?
        authorities: []
      - id: r4
        criterion: Evaluation — weighs the reply against Hart's fit-the-facts strategy and concludes.
        marks: 2
        top-band: Explains why the redescription misdescribes the practice, judged by the descriptive theory's own criteria.
        margin-note: Is the redescription a description?
        authorities: []
  - key: q501
    type: mcq
    concept: habits-and-rules
    difficulty: 1
    set: pretest
    contrasts-with:
      - austins-sovereign
    stem: For Hart, why are habits not "normative"?
    options:
      - text: Because they cannot confer rights or authority on anyone.
        correct: true
        why: >-
          Correct — CL 60 on the slide: habits are not 'normative': they cannot confer rights or authority on anyone.
          They are just facts about convergent behaviour.
      - text: Because they are rarely followed by most members of a community.
        why: >-
          Tempting because habits can lapse, but convergence of behaviour is observed in both habits and rules; what
          habits lack is normativity, not regularity.
      - text: Because they are always morally bad and so cannot ground a legal obligation of any kind.
        why: >-
          Tempting because 'bad habits' is a common phrase, but Hart's point has nothing to do with moral quality;
          habits simply cannot confer rights or authority.
  - key: q502
    type: mcq
    concept: habits-and-rules
    difficulty: 2
    stem: Which is NOT one of the three salient differences Hart draws between habits and rules?
    options:
      - text: Deviations from a rule are met with criticisms.
        why: Tempting to exclude, but criticism of deviation is the first of the three differences on the slide.
      - text: The rule is regarded as a good reason for making such criticism.
        why: >-
          Tempting to exclude because it overlaps with the first, but the rule being a good reason for criticism is the
          second difference.
      - text: Rules are always written down, while habits are not.
        correct: true
        why: >-
          Correct — writing is not one of Hart's differences; his social-rule example (removing a hat in church) is
          unwritten. The three are criticism, reason for criticism, internal aspect.
      - text: (Social) rules have an internal aspect.
        why: >-
          Tempting to exclude because it is the most abstract, but the internal aspect of social rules is the third of
          the salient differences.
  - key: q503
    type: mcq
    concept: habits-and-rules
    difficulty: 2
    stem: What is the one thing habits and rules have in common, according to the slide?
    options:
      - text: In both cases we can observe convergence of behaviour.
        correct: true
        why: >-
          Correct — the slide: in both cases we can observe convergence of behaviour; from an external point of view the
          cinema-goers and the hat-removers look alike.
      - text: In both cases deviation is met with criticism from others in the group.
        why: >-
          Tempting because criticism is a visible feature, but it is one of the differences: deviation from a habit is
          not criticised, deviation from a rule is.
      - text: In both cases the pattern confers rights on some members of the group.
        why: >-
          Tempting because rules can confer rights, but habits cannot confer rights or authority on anyone; this is a
          difference, not a common feature.
  - key: q504
    type: mcq
    concept: habits-and-rules
    difficulty: 2
    stem: Which example does Hart use for a habit that is not a rule?
    options:
      - text: A man removing his hat on entering a church.
        why: >-
          Tempting because it is Hart's other example, but that one is a social rule: deviation is criticised and the
          rule is the reason for criticism.
      - text: Going to the cinema at the weekend.
        correct: true
        why: >-
          Correct — the lecture: most people go to the cinema on a Saturday night or over the weekend, but there is no
          social rule about it; it is a habit.
      - text: Stopping at a red traffic light, whatever the time of night.
        why: >-
          Tempting because many people do it habitually, but it is a legal rule; the lecture's example of a mere habit
          is going to the cinema.
  - key: q505
    type: mcq
    concept: habits-and-rules
    difficulty: 2
    stem: What two salient features of most legal systems does Hart say the idea of a habit of obedience cannot explain?
    options:
      - text: The continuity of law and the persistence of law.
        correct: true
        why: >-
          Correct — the Chapter IV slide: can the idea of a habit of obedience explain two salient features of most
          legal systems, the continuity of law and the persistence of law?
      - text: The coercive character of law and the existence of sanctions for breach of duty.
        why: >-
          Tempting because coercion is this week's topic, but Hart's two Chapter IV features are continuity and
          persistence; the habit model fits coercion well.
      - text: The generality of law and its enduring character.
        why: >-
          Tempting because Hart added these to the gunman model in Chapter II, but those were added to make the model
          plausible, not features it fails to explain.
  - key: q506
    type: mcq
    concept: habits-and-rules
    difficulty: 2
    contrasts-with:
      - harts-chapter-iii-objections
    stem: Which is NOT one of the three lines of criticism in Chapter IV, as outlined on the slide?
    options:
      - text: The idea of a habit of obedience.
        why: >-
          Tempting to exclude, but the habit of obedience — and whether it explains continuity and persistence — is the
          first line of Chapter IV.
      - text: The legally unlimited power enjoyed by the sovereign.
        why: >-
          Tempting to exclude, but the sovereign's legally unlimited power is the second line: in real systems nobody
          enjoys that kind of power.
      - text: The existence of power-conferring rules.
        correct: true
        why: >-
          Correct — power-conferring rules belong to Chapter III's content objection. Chapter IV's three lines are habit
          of obedience, unlimited power, and the sovereign above the law.
      - text: The position occupied by the sovereign above the law.
        why: >-
          Tempting to exclude, but the sovereign's position above the law is the third line: in many systems the
          sovereign is not above the law.
  - key: q507
    type: mcq
    concept: habits-and-rules
    difficulty: 3
    stem: What does Hart conclude must replace the habit of obedience as the key idea in a theory of law?
    options:
      - text: The idea of a sanction, since sanctions explain why people obey.
        why: >-
          Tempting because sanctions are central to Austin, but Hart's point is that coercion alone cannot explain legal
          obligation; he calls for the idea of a rule.
      - text: The idea of a rule.
        correct: true
        why: >-
          Correct — the lecture: we need to replace that key pillar; instead of a habit of obedience, Hart says we need
          the idea of a rule, which is absent from Austin's theory.
      - text: The idea of a moral obligation, since law must be just to be valid.
        why: >-
          Tempting because obligation is at stake, but Hart holds that legal obligation is different from moral
          obligation; the replacement is the idea of a rule.
  - key: q508
    type: mcq
    concept: habits-and-rules
    difficulty: 3
    contrasts-with:
      - gunman-situation
    stem: According to the lecture, how does Hart place legal obligation relative to coercion and moral obligation?
    options:
      - text: 'It is identical to coercion: to have a legal obligation is to be liable to a sanction.'
        why: >-
          Tempting because that is Austin's view, but Hart says law is not just a matter of power; legal obligation is
          more than coercion.
      - text: More than coercion, but different from a moral obligation.
        correct: true
        why: >-
          Correct — the lecture: legal obligation is something more than coercion in a sense, but less than a moral
          obligation, something different; there is a specific normativity of law.
      - text: A kind of moral obligation, since law is a branch of morality and draws its binding force from it.
        why: >-
          Tempting because both use 'ought', but the lecture says the normative force of law is different from the force
          of a moral requirement.
  - key: q509
    type: mcq
    concept: habits-and-rules
    difficulty: 3
    variant-of: q503
    stem: >-
      Seen only from an external point of view, a stranger notes that most men remove their hats in church and most
      people go to the cinema on Saturdays. What can the stranger NOT tell?
    options:
      - text: Which pattern is a rule and which is a habit, since both show only convergence of behaviour.
        correct: true
        why: >-
          Correct — the lecture: from the external point of view you just register convergence; to tell a rule from a
          habit you need criticism, reasons, and the internal aspect.
      - text: Whether most people behave in the same way.
        why: >-
          Tempting, but convergence of behaviour is exactly what the external observer can record; what they cannot see
          is whether a rule exists.
      - text: Whether either pattern exists at all.
        why: >-
          Tempting as scepticism about observation, but the observer does register both patterns; the question is
          whether each is a rule or a habit.
  - key: q510
    type: mcq
    concept: habits-and-rules
    difficulty: 2
    stem: What does the lecture say is the "key argument against Austin's theory of law" in a nutshell?
    options:
      - text: >-
          That Austin wrongly thought sovereigns could be groups of persons, such as a council of elders, rather than
          individuals.
        why: >-
          Tempting because Hart discusses the sovereign, but Austin allows a sovereign body; the key argument is the
          absence of the concept of a rule.
      - text: >-
          That the concept of a rule is absent, so the theory cannot explain legal obligation or the normative force of
          law.
        correct: true
        why: >-
          Correct — the lecture: in a theory like Austin's the concept of a rule is absent, and because of that absence
          it cannot properly explain legal obligation or legal normativity.
      - text: That Austin ignored the role of courts.
        why: >-
          Tempting because courts matter in Hart's later chapters, but the key argument in Chapter IV turns on replacing
          the habit of obedience with the idea of a rule.
  - key: q511
    type: mcq
    concept: habits-and-rules
    difficulty: 3
    verify: true
    stem: >-
      A monarch rules for 40 years and dies; her son succeeds and his first statute is treated as law at once, before
      any habit of obeying him could form. Which feature is Hart pointing to?
    options:
      - text: The continuity of law, which a habit of obedience to a particular person cannot explain.
        correct: true
        why: >-
          Correct — on Austin's model a new sovereign has no habit of obedience yet; the continuity of law is one of the
          two salient features Hart says the habit idea cannot explain.
      - text: The range of application of law, which binds the new monarch too.
        why: >-
          Tempting because range is a Hart objection, but that is Chapter III and concerns law binding its makers; here
          the issue is succession between law-makers.
      - text: Power-conferring rules.
        why: >-
          Tempting because succession involves powers, but the Chapter IV point the example illustrates is the
          continuity of law across a change of sovereign.
  - key: q512
    type: mcq
    concept: habits-and-rules
    difficulty: 2
    stem: Why is Chapter IV titled "Sovereign and Subject", according to the lecture?
    options:
      - text: Because it concerns the relationship between sovereign and subjects, which is key in Austin's theory.
        correct: true
        why: >-
          Correct — the lecture: the chapter is all about that relationship, which is key in Austin's theory of law, and
          attacks it on three lines.
      - text: Because it compares the British sovereign with those of other states.
        why: >-
          Tempting because Hart was British and mentions parliamentary sovereignty, but the chapter is about Austin's
          general model of sovereign and subject.
      - text: >-
          Because it argues that subjects, not sovereigns, make the law through their habits of obedience and their
          customs.
        why: >-
          Tempting because customs arise among subjects, but that is Chapter III's modes-of-origin objection; Chapter IV
          attacks the sovereign–subject model.
  - key: q513
    type: mcq
    concept: habits-and-rules
    difficulty: 3
    variant-of: q502
    stem: On Hart's account, what distinguishes the churchgoer who removes his hat from the cinema-goer?
    options:
      - text: The churchgoer is more likely to be punished by the state.
        why: >-
          Tempting because rules often carry sanctions, but a social rule like this has no state sanction; the
          difference is criticism, reasons and the internal aspect.
      - text: >-
          The churchgoer's deviation would be criticised, the rule would be the reason, and he treats it from the inside
          as a standard.
        correct: true
        why: >-
          Correct — these are Hart's three salient differences: criticism of deviation, the rule as a good reason for
          criticism, and the internal aspect of social rules.
      - text: The churchgoer does it more often.
        why: >-
          Tempting because rules seem more regular, but both show convergence of behaviour; frequency does not separate
          a rule from a habit.
  - key: q514
    type: mcq
    concept: habits-and-rules
    difficulty: 2
    stem: In real legal systems, what does Hart say about the "legally unlimited power" of Austin's sovereign?
    options:
      - text: That no one really enjoys legally unlimited power, even the sovereigns we can identify.
        correct: true
        why: >-
          Correct — the lecture: even when we identify political or legal sovereigns in real systems, nobody really
          enjoys that kind of power; there is a mismatch between theory and reality.
      - text: That it exists in every legal system, but is rarely used in practice by those who hold it.
        why: >-
          Tempting because parliamentary sovereignty sounds unlimited, but Hart says the unlimited power of the theory
          is not something we find in the systems we know.
      - text: That it is morally wrong and should be limited by a bill of rights.
        why: >-
          Tempting as a normative view, but Hart's objection is descriptive: the model does not fit real systems, not
          that unlimited power ought to be curbed.
  - key: q515
    type: mcq
    concept: habits-and-rules
    difficulty: 3
    contrasts-with:
      - law-and-coercion
    stem: 'A student writes: "Hart rejects Austin because Austin thinks there is coercion in law." What is wrong with this?'
    options:
      - text: 'Nothing: Hart holds that coercion has no place in any legal system.'
        why: >-
          Tempting because Hart attacks the coercive model, but the lecture says there is of course a coercive element
          in the systems we know; law is more than coercion.
      - text: 'Hart accepts a coercive element but denies law is only coercion: it is also a matter of authority and rules.'
        correct: true
        why: >-
          Correct — Hart's claim is that law is not just a matter of power but also of authority; the habit-based
          coercive model cannot explain legal obligation.
      - text: Austin in fact denied that coercion is part of law and relied on habit alone.
        why: >-
          Tempting because habit matters to Austin, but command, duty and sanction are inseparable for him; coercion is
          central to his theory.
  - key: q516
    type: mcq
    concept: habits-and-rules
    difficulty: 1
    stem: Which chapters does the lecture say Hart uses to develop his own theory of law, starting from the gunman example?
    options:
      - text: Chapters 1, 2 and 3.
        why: >-
          Tempting because the gunman is introduced there, but chapters 1 and 2 introduce and model Austin's theory;
          Hart's own theory comes later.
      - text: Chapters 4, 5 and 6.
        correct: true
        why: >-
          Correct — the lecture says Hart uses the example to develop his own theory of law in chapters 4, 5 and 6;
          Chapter 5 problematises the concept of a rule.
      - text: Chapters 8 and 9.
        why: >-
          Tempting because they come later in the book, but the lecture places chapters 8 and 9 on law and morality in a
          couple of weeks.
  - key: q517
    type: truefalse
    set: quickfire
    concept: habits-and-rules
    difficulty: 1
    statement: For Hart, habits cannot confer rights or authority on anyone.
    answer: true
    why: 'True — CL 60 on the slide: habits are not ''normative'': they cannot confer rights or authority on anyone.'
  - key: q518
    type: truefalse
    set: quickfire
    concept: habits-and-rules
    difficulty: 2
    statement: >-
      Hart's Chapter IV argues that the idea of a habit of obedience fully explains the continuity and persistence of
      law.
    answer: false
    why: >-
      False — Chapter IV asks whether it can explain them and Hart concludes it cannot; that failure is why he replaces
      habits with rules.
  - key: q519
    type: truefalse
    set: quickfire
    concept: habits-and-rules
    difficulty: 2
    statement: On the lecture's account, Hart holds that legal obligation is the same as moral obligation.
    answer: false
    why: >-
      False — the lecture: legal obligation is more than coercion but different from moral obligation; law has a
      specific normativity of its own.
  - key: q520
    type: short
    concept: habits-and-rules
    difficulty: 3
    prompt: '''Hart''s distinction between habits and rules is the real reason Austin''s theory fails.'' Discuss.'
    model: >-
      I agree, with one qualification: the habits/rules distinction is the centre of Hart's case, but it works only

      because Austin's sovereignty depends on habits. Austin's sovereign is the determinate superior whom the bulk of

      society habitually obeys and who habitually obeys no one else; so the whole theory rests on the habit of
      obedience.

      Chapter IV attacks that pillar: it cannot explain the continuity or the persistence of law, nor fit real systems
      where

      no one has legally unlimited power or stands above the law. The deeper point is the distinction. Habits and rules

      both show convergence of behaviour, but deviation from a rule is criticised, the rule is a good reason for the

      criticism, and social rules have an internal aspect. Habits "cannot confer rights or authority on anyone" (CL 60).
      The

      counterargument is that Chapter III's objections — power-conferring rules, range, custom — do independent damage.

      They do, but each is an instance of the same gap: without the idea of a rule, the theory cannot explain legal

      obligation. On balance the distinction is the root, and the other objections are its symptoms.
    rubric:
      - id: r1
        criterion: Thesis — takes a clear position on whether habits vs rules is the decisive objection.
        marks: 2
        top-band: States a qualified thesis in the opening sentence and says what it depends on.
        margin-note: What is your answer, and what does it depend on?
        authorities: []
      - id: r2
        criterion: Argument — explains why Austin's sovereignty depends on the habit of obedience and Hart's three differences.
        marks: 3
        top-band: Links sovereignty to habit, lists the three Chapter IV lines, and states the three differences with CL 60.
        margin-note: Why is the habit of obedience the pillar?
        authorities:
          - hart-the-concept-of-law
          - austin-province-of-jurisprudence-determined
      - id: r3
        criterion: Counterargument — states the case that Chapter III's objections are independently decisive.
        marks: 2
        top-band: Gives the content, range and origin objections their full force before replying.
        margin-note: Aren't the Chapter III objections enough on their own?
        authorities: []
      - id: r4
        criterion: Evaluation — weighs the two and concludes with a reason.
        marks: 2
        top-band: Shows how each Chapter III objection reflects the missing idea of a rule, so the verdict follows.
        margin-note: Root or symptom — why?
        authorities: []
  - key: q601
    type: mcq
    concept: law-and-coercion
    difficulty: 1
    stem: Which view of law and coercion does Lamond attribute to Austin?
    options:
      - text: Coercion is the genus of which law is a species.
        correct: true
        why: >-
          Correct — Lamond's list on the slide: coercion is the genus of which law is a species (Austin), echoing
          definition per genus et differentiam.
      - text: Law regulates the use of coercion in the community.
        why: >-
          Tempting because Austin's laws do regulate conduct, but Lamond attributes the view that law regulates coercion
          to Bobbio, building on Kelsen.
      - text: The point of legal practice is to guide and constrain the coercive power of the state.
        why: >-
          Tempting because the state's power matters to Austin, but Lamond attributes this view to Dworkin, who sees law
          as justifying the use of state coercion.
  - key: q602
    type: mcq
    concept: law-and-coercion
    difficulty: 2
    contrasts-with:
      - austins-command-theory
    stem: For Kelsen, as reported in Lamond's list, what is law?
    options:
      - text: A set of individual commands addressed by a determinate sovereign to each of its subjects, one by one.
        why: >-
          Tempting because it sounds like Austin, but the lecture says Kelsen focuses on the legal order as a whole,
          whereas Austin focuses on individual laws as commands.
      - text: A coercive social order — a distinctive form of social ordering because of its reliance on coercion.
        correct: true
        why: >-
          Correct — the slide: law is a distinctive form of social ordering because of its reliance upon coercion; for
          Kelsen, law is a coercive social order.
      - text: A practice whose point is to justify state coercion.
        why: >-
          Tempting because it mentions coercion, but that is Dworkin's view on Lamond's list; Kelsen's is that law is a
          coercive social order.
  - key: q603
    type: mcq
    concept: law-and-coercion
    difficulty: 2
    stem: What does Bobbio claim about law and coercion, according to the lecture?
    options:
      - text: 'That coercion is the object of law: law controls or regulates the use of coercion in the community.'
        correct: true
        why: >-
          Correct — the lecture: Bobbio, building on Kelsen, claims the point of law is to control or regulate any use
          of coercion, which is why vendettas are forbidden.
      - text: That coercion is the most salient aspect of law.
        why: >-
          Tempting because it is on the same list, but Lamond attributes that view to Bentham, Holmes and Raz; Bobbio
          says law regulates coercion.
      - text: >-
          That law can exist without any coercion at all, as a society of angels shows, since coordination needs no
          force.
        why: >-
          Tempting because it is a view about coercion, but the society of angels is Raz's thought experiment; Bobbio
          treats coercion as law's object.
  - key: q604
    type: mcq
    concept: law-and-coercion
    difficulty: 2
    contrasts-with:
      - laws2100-w01-six-kinds-of-questions
    stem: What are Lamond's "two sources of continuing interest" in the relationship between law and coercion?
    options:
      - text: Historical and comparative.
        why: >-
          Tempting because the lecture traces the debate over time, but Lamond names two sources: clarificatory and
          evaluative — descriptive and normative.
      - text: Clarificatory and evaluative.
        correct: true
        why: >-
          Correct — Lamond (2001) 7(1) Legal Theory 36: one clarificatory, the other evaluative; the lecture glosses
          them as descriptive and normative interests.
      - text: Doctrinal and methodological, one about the law of particular systems and one about how to study it.
        why: >-
          Tempting because these are two of last week's six kinds of question, but Lamond's two sources are the
          clarificatory and the evaluative.
  - key: q605
    type: mcq
    concept: law-and-coercion
    difficulty: 3
    stem: What does Raz's society of angels thought experiment show, according to the lecture?
    options:
      - text: That a society of angels would have no need for law at all, since everyone already does what is right.
        why: >-
          Tempting because some people respond this way, but Raz says even angels may face coordination problems, so the
          community still needs laws.
      - text: That a legal system without coercion is conceivable, so coercion is not a necessary feature.
        correct: true
        why: >-
          Correct — angels comply, so no enforcement is needed, yet coordination problems call for law; a coercion-free
          legal system is conceivable, so coercion is not necessary.
      - text: That coercion is the most salient aspect of every legal system.
        why: >-
          Tempting because Raz appears on Lamond's 'most salient' list, but the society of angels is used as a
          counter-example to the necessity of coercion.
  - key: q606
    type: mcq
    concept: law-and-coercion
    difficulty: 3
    stem: What is Schauer's response to arguments like the society of angels?
    options:
      - text: >-
          That the thought experiment is incoherent, because angels could never face coordination problems that need
          rules.
        why: >-
          Tempting as a rebuttal, but the lecture says Schauer can accept the thought experiment; his point is about
          what legal theory should focus on.
      - text: >-
          That the law we know is coercive, so perhaps legal theory should capture salient features, not only necessary
          ones.
        correct: true
        why: >-
          Correct — Schauer accepts the thought experiment but says the law as we know it is overwhelmingly coercive;
          maybe the focus should be on salient features of law.
      - text: That coercion is a necessary feature after all.
        why: >-
          Tempting because Schauer defends Austin's emphasis, but he shifts the question from necessity to what a theory
          of law is supposed to accomplish.
  - key: q607
    type: mcq
    concept: law-and-coercion
    difficulty: 2
    stem: Which quotation is Schauer's, from 'Was Austin Right After All?'?
    options:
      - text: '"…the right to regulate coercion lies within the scope of law''s distinctive claim to authority."'
        why: >-
          Tempting because it is on the same slide, but this sentence is Lamond's (p 56); Schauer's line is about what a
          legal theory is supposed to accomplish.
      - text: '"…the focus of legal theory is dependent on a conception of what a legal theory is supposed to accomplish."'
        correct: true
        why: >-
          Correct — the slide quotes Schauer (p 16): the focus of legal theory is dependent on a conception of what a
          legal theory is supposed to accomplish.
      - text: >-
          "There are two sources of continuing interest in the relationship between law and coercion, one clarificatory,
          the other evaluative."
        why: >-
          Tempting because it is about coercion, but it is the opening of Lamond's 2001 article in Legal Theory, not
          Schauer's.
  - key: q608
    type: mcq
    concept: law-and-coercion
    difficulty: 2
    stem: What does Lamond say about coercion as "the most salient aspect of law"?
    options:
      - text: That it is not; at best it is the most salient aspect of certain legal systems.
        correct: true
        why: >-
          Correct — Lamond: coercion 'is not the most salient aspect of law – at best it is the most salient aspect of
          certain legal systems' (emphasis added on the slide).
      - text: That it is the most salient aspect of every legal system, as Bentham and Holmes argued.
        why: >-
          Tempting because Lamond lists that view, but he disagrees with it; he confines salience to certain legal
          systems.
      - text: That salience is irrelevant, since only necessary features matter to a theory of law and nothing else counts.
        why: >-
          Tempting as a Razian point, but Lamond engages with salience directly; it is Schauer who argues salience
          should be the focus.
  - key: q609
    type: mcq
    concept: law-and-coercion
    difficulty: 3
    variant-of: q606
    contrasts-with:
      - austins-command-theory
    stem: >-
      An essay argues: "Because we can imagine law without sanctions, coercion is unimportant to understanding law."
      Which author's point most directly challenges the inference?
    options:
      - text: 'Schauer: whether coercion matters depends on what a theory of law is meant to accomplish.'
        correct: true
        why: >-
          Correct — Schauer shifts the question: a conceivable coercion-free law shows coercion is not necessary, not
          that it is unimportant; salient features also matter.
      - text: 'Raz: the society of angels shows that coercion is not a necessary feature of the concept of law.'
        why: >-
          Tempting because Raz is behind the premise, but his thought experiment supports the essay's first step; it
          does not challenge the move to 'unimportant'.
      - text: 'Bobbio: coercion is the object that law regulates.'
        why: >-
          Tempting because Bobbio gives coercion a role, but the lecture uses Schauer's point to separate necessary from
          salient; Bobbio is a view on Lamond's list.
  - key: q610
    type: mcq
    concept: law-and-coercion
    difficulty: 2
    stem: According to the lecture, what is the difference between an essential feature and a necessary feature of law?
    options:
      - text: There is a philosophical difference, not too important here, and Hart moves fairly quickly between the two.
        correct: true
        why: >-
          Correct — the lecture: there is a difference from a philosophical point of view; it is not too important for
          our discussion, but Hart moves fairly quickly between them.
      - text: 'None: the two terms always mean the same thing in the literature.'
        why: >-
          Tempting because Hart moves quickly between them, but the lecture says there is a philosophical difference and
          that a number of people differentiate them.
      - text: An essential feature is moral, while a necessary feature is legal.
        why: >-
          Tempting as a neat split, but the lecture gives no such moral/legal contrast; it only says the two ideas
          differ philosophically.
  - key: q611
    type: mcq
    concept: law-and-coercion
    difficulty: 2
    stem: Which authors does Lamond's list associate with the view that coercion is the most salient aspect of law?
    options:
      - text: Austin and Kelsen.
        why: >-
          Tempting because both stress coercion, but Lamond gives them other views: coercion as genus (Austin) and law
          as a coercive social order (Kelsen).
      - text: Bentham, Holmes and Raz.
        correct: true
        why: >-
          Correct — the slide: coercion is the most salient aspect of law (Bentham, Holmes, Raz); the lecture notes
          Raz's story is more complicated.
      - text: Bobbio and Dworkin.
        why: >-
          Tempting because they are on the list, but Bobbio says law regulates coercion and Dworkin that legal practice
          guides and constrains state coercion.
  - key: q612
    type: mcq
    concept: law-and-coercion
    difficulty: 3
    variant-of: q603
    stem: How does Dworkin's view on Lamond's list differ from Bobbio's?
    options:
      - text: 'Dworkin: law justifies and constrains state coercion; Bobbio: law regulates any use of coercion.'
        correct: true
        why: >-
          Correct — the lecture: for Dworkin the point of legal practice is to guide and constrain state coercion, a
          matter of justifying state power; Bobbio's concern is any use of force in the community.
      - text: 'Dworkin: coercion is the genus of which law is a species; Bobbio: coercion is its most salient aspect.'
        why: >-
          Tempting because these are views on the same list, but coercion as genus is Austin's and most salient aspect
          is Bentham, Holmes and Raz's.
      - text: There is no difference.
        why: >-
          Tempting because both link law to controlling coercion, but the lecture separates regulating coercion in the
          community (Bobbio) from justifying state coercion (Dworkin).
  - key: q613
    type: mcq
    concept: law-and-coercion
    difficulty: 3
    stem: >-
      In the passage on the slide, what does Schauer say "shifts" once we see that ignoring law's coercive dimension may
      fail to fit the facts?
    options:
      - text: The burden of proof, which moves from Hart to Austin.
        why: >-
          Tempting because Schauer is sympathetic to Austin, but the passage says the question shifts to one about the
          nature and value of a view of legal theory's task.
      - text: The question, which becomes one about the nature and value of that view of the task of legal theory.
        correct: true
        why: >-
          Correct — Schauer (p 18): 'But then the question shifts to a question about the nature and value of that view
          of the task of legal theory.'
      - text: The meaning of "law".
        why: >-
          Tempting because Schauer questions what theory should capture, but he says the question shifts to the task of
          legal theory, not that 'law' changes meaning.
  - key: q614
    type: mcq
    concept: law-and-coercion
    difficulty: 2
    stem: >-
      Why does the lecture say the question "Why should we investigate the relationship(s) between law and coercion?"
      matters?
    options:
      - text: Because the relationship is a freestanding problem with no link to the question "what is law?".
        why: >-
          Tempting because the lecture concedes it can be a freestanding problem, but it asks us to link it to the
          bigger questions: what is law and what is jurisprudence.
      - text: 'Because it connects to the bigger questions: what is law, and what is the point of jurisprudence.'
        correct: true
        why: >-
          Correct — the lecture's summary: think about the link between law and coercion and the bigger question what is
          law, but also what is jurisprudence and its point.
      - text: Because coercion is the only topic that the research essay questions will ask about this semester.
        why: >-
          Tempting because the essay matters, but the lecture says it is still deciding the questions; the point is the
          link to what law and jurisprudence are.
  - key: q615
    type: mcq
    concept: law-and-coercion
    difficulty: 3
    variant-of: q607
    stem: Which statement best captures Schauer's view of Hart's criticism of Austin, as reported on the slides?
    options:
      - text: It is decisive, and Austin's account should be abandoned.
        why: >-
          Tempting because Hart is usually taken to have won, but Schauer says Hart's criticism is 'problematic in two
          distinct ways' (p 7).
      - text: >-
          It is "problematic in two distinct ways", and whether Austin was right depends on what a theory of law is
          designed to accomplish.
        correct: true
        why: >-
          Correct — the slide: Hart's criticism of Austin is problematic in two distinct ways (p 7), and soundness
          depends on what a theory of law is designed to accomplish.
      - text: It fails because Austin never claimed that law is coercive.
        why: >-
          Tempting as a quick defence of Austin, but for Austin command, duty and sanction are inseparable; Schauer's
          point is about the aim of legal theory.
  - key: q616
    type: mcq
    concept: law-and-coercion
    difficulty: 2
    stem: According to Lamond, what lies "within the scope of law's distinctive claim to authority"?
    options:
      - text: The right to regulate coercion.
        correct: true
        why: >-
          Correct — Lamond (p 56): 'the right to regulate coercion lies within the scope of law's distinctive claim to
          authority.'
      - text: The duty of citizens to obey every law, whatever its content.
        why: >-
          Tempting because authority suggests a duty to obey, but Lamond's claim concerns the right to regulate
          coercion, not a general duty of obedience.
      - text: The power to define what counts as morality in a given community.
        why: >-
          Tempting because law and morality are related, but Lamond's sentence is about regulating coercion; morality is
          a separate topic in later weeks.
  - key: q617
    type: truefalse
    set: quickfire
    concept: law-and-coercion
    difficulty: 1
    statement: Raz uses the society of angels to argue that coercion is not a necessary feature of law.
    answer: true
    why: >-
      True — angels comply with the rules, so enforcement is unnecessary, yet coordination problems still call for law;
      so a coercion-free legal system is conceivable.
  - key: q618
    type: truefalse
    set: quickfire
    concept: law-and-coercion
    difficulty: 2
    statement: Lamond argues that coercion is the most salient aspect of law.
    answer: false
    why: >-
      False — Lamond says coercion 'is not the most salient aspect of law – at best it is the most salient aspect of
      certain legal systems'.
  - key: q619
    type: truefalse
    set: quickfire
    concept: law-and-coercion
    difficulty: 2
    statement: Schauer says the phenomenon of law as it is experienced is overwhelmingly coercive.
    answer: true
    why: 'True — the slide quotes Schauer (p 18): ''The phenomenon of law as it is experienced is overwhelmingly coercive''.'
  - key: q620
    type: short
    concept: law-and-coercion
    difficulty: 3
    prompt: '''Coercion is not a necessary feature of law, so a theory of law can safely ignore it.'' Discuss.'
    model: >-
      The first half may be right, but the conclusion does not follow. Raz's society of angels suggests that coercion is

      not a necessary feature of law: angels comply with the rules, so there is no need to enforce them, yet
      coordination

      problems still call for laws. If a legal system without coercion is conceivable, coercion is not part of the
      concept

      of law. Lamond adds that coercion is "not the most salient aspect of law – at best it is the most salient aspect
      of

      certain legal systems". The strongest case for the conclusion is that a general theory should capture only what
      all

      law must have. Against it, Schauer: "The phenomenon of law as it is experienced is overwhelmingly coercive", and a

      theory that ignores this may, as Hart put it, fail to fit the facts. For Schauer "the focus of legal theory is

      dependent on a conception of what a legal theory is supposed to accomplish". My conclusion: whether coercion can
      be

      ignored is a question about the task of legal theory, not about law; a theory of law's salient features cannot
      ignore

      it.
    rubric:
      - id: r1
        criterion: Thesis — takes a clear position on whether a theory of law can ignore coercion.
        marks: 2
        top-band: Separates the two halves of the statement and answers each clearly.
        margin-note: Do you accept the premise, the conclusion, or both?
        authorities: []
      - id: r2
        criterion: Argument — explains the society of angels and Lamond's salience point accurately.
        marks: 3
        top-band: States the thought experiment and why it bears on necessity, with Lamond's 'certain legal systems' quotation.
        margin-note: What does the thought experiment show, exactly?
        authorities:
          - lamond-coercion-and-the-nature-of-law
      - id: r3
        criterion: Counterargument — puts the case for focusing only on necessary features at its strongest.
        marks: 2
        top-band: Explains why a general theory might limit itself to what all law must have.
        margin-note: Why might a theorist want only necessary features?
        authorities: []
      - id: r4
        criterion: Evaluation — uses Schauer to reach a reasoned conclusion about the task of legal theory.
        marks: 3
        top-band: >-
          Uses Schauer's p 16 and p 18 lines to show the question shifts to what legal theory is for, and commits to an
          answer.
        margin-note: Necessary or salient — which should theory capture, and why?
        authorities:
          - schauer-was-austin-right-after-all
