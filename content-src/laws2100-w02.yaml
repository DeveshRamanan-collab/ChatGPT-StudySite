cards:
  - type: basic
    concept: austins-command-theory
    front: Austin's general definition of law (PJD 18)?
    back: Law = "a rule laid down for the guidance of an intelligent being by an intelligent being having power over him".
    source: Week 02 Lecture Slides, slide 7
  - type: basic
    concept: austins-command-theory
    front: Austin's four kinds of laws?
    back: >-
      1 Divine law (he rejects the Law of Nature); 2 human laws — set by political superiors (positive law) and by men
      not political superiors; 3 objects improperly but by close analogy termed laws (positive morality, incl.
      international law); 4 objects metaphorically termed laws (laws of motion).
    source: Week 02 Lecture Slides, slide 7
  - type: cloze
    concept: austins-command-theory
    text: >-
      A command has two elements: (i) a {{c1::signification of desire}}; and (ii) the party addressed is {{c2::liable to
      evil}} in case they do not comply.
    source: Week 02 Lecture Slides, slide 8
  - type: basic
    concept: austins-command-theory
    front: What does "command and duty are correlative terms" mean?
    back: Wherever a duty lies, a command has been signified; and wherever a command is signified, a duty is imposed.
    source: Week 02 Lecture Slides, slide 8
  - type: cloze
    concept: austins-command-theory
    text: For Austin, {{c1::command}}, {{c2::duty}} and {{c3::sanction}} are inseparably connected terms.
    source: Week 02 Lecture Slides, slide 9
  - type: basic
    concept: austins-command-theory
    front: What does superiority mean for Austin?
    back: >-
      Might: the power to affect others with evil or pain and, through fear of it, force them to fashion their conduct
      to one's wishes. Superiority is the power to enforce compliance with a wish.
    source: Week 02 Lecture Slides, slide 10
  - type: apply
    concept: austins-command-theory
    scenario: A professional body enforces its code only through the disapproval of members.
    answer: >-
      For Austin: rules set and enforced by mere opinion — positive morality, improperly but by close analogy termed
      laws; not positive law.
    source: Week 02 Lecture Slides, slide 7
  - type: basic
    concept: austins-sovereign
    front: When is a society political, and when political and independent (Austin)?
    back: >-
      Political iff the generality of its members is in a habit of obedience to a determinate and common superior;
      independent iff that superior does not habitually obey another person or body.
    source: Week 02 Lecture Slides, slide 12
  - type: cloze
    concept: austins-sovereign
    text: >-
      Lecture VI: three inseparably connected ideas — {{c1::sovereignty}}, {{c2::subjection}} and {{c3::independent
      political society}}.
    source: Week 02 Lecture Slides, slide 11
  - type: cloze
    concept: austins-sovereign
    text: '"The existence of law is one thing; its {{c1::merit or demerit}} is another." (PJD, Lecture V)'
    source: Week 02 Lecture Slides, slide 13
  - type: basic
    concept: austins-sovereign
    front: Which two systems does Austin use to illustrate principles "abstracted from every particular system"?
    back: The Roman law and the law of England (Lectures on Jurisprudence, Lecture XI).
    source: Week 02 Lecture Slides, slide 13
  - type: apply
    concept: austins-sovereign
    scenario: A colony's governor obeys a distant emperor; the colonists obey the governor.
    answer: >-
      Not an independent political society: its superior habitually obeys another. The emperor, not the governor, is
      sovereign.
    source: Week 02 Lecture Slides, slide 12
  - type: basic
    concept: austins-sovereign
    front: Which two ideas in Austin's positivism passages reappear in Hart?
    back: >-
      Descriptive (existence of law vs its merit: law as it is, not as it ought to be) and general (abstracted from
      every particular system) — Hart's CL 239.
    source: Week 02 Lecture Transcript
  - type: basic
    concept: gunman-situation
    front: Obliged vs having an obligation — the gunman situation?
    back: The clerk is obliged to hand over the money (forced by the threat), but is not under an obligation to do so.
    source: Week 02 Lecture Slides, slide 14
  - type: basic
    concept: gunman-situation
    front: Why does Hart say "coercive orders", not "commands"?
    back: >-
      "To command is characteristically to exercise authority over men, not power to inflict harm" (CL 20); the gunman's
      orders are supported only by threats.
    source: Week 02 Lecture Slides, slide 16
  - type: basic
    concept: gunman-situation
    front: Four elements Hart adds to the gunman situation for a plausible model of law?
    back: >-
      Generality (general type of conduct + general class of persons); enduring character; general habit of obedience;
      supremacy and independence (CL 24).
    source: Week 02 Lecture Slides, slide 17
  - type: cloze
    concept: gunman-situation
    text: >-
      Legal obligation is "this situation {{c1::writ large}}; A must be the {{c2::sovereign habitually obeyed}} and the
      orders must be general" (CL 82).
    source: Week 02 Lecture Slides, slide 15
  - type: basic
    concept: gunman-situation
    front: What does the principle of charitable interpretation require?
    back: >-
      Interpret a statement or claim in the most rational way possible and discuss its best, strongest possible version
      — as Hart does with Austin (CL 18).
    source: Week 02 Lecture Slides, slide 25
  - type: apply
    concept: gunman-situation
    scenario: A classmate says Hart attacks a caricature of Austin.
    answer: >-
      No: Hart ignores Austin's inconsistencies and develops his hints (partly along Kelsen's lines) so the doctrine is
      "stated in its strongest form" (CL 18), then attacks that.
    source: Week 02 Lecture Slides, slide 25
  - type: basic
    concept: harts-chapter-iii-objections
    front: Hart's three groups of objections in Chapter III?
    back: The content of laws (duty-imposing and power-conferring rules); their range of application; their modes of origin.
    source: Week 02 Lecture Slides, slide 18
  - type: apply
    concept: harts-chapter-iii-objections
    scenario: Someone makes a will without the required formalities.
    answer: >-
      No valid will — but no duty broken. Rules on wills are power-conferring, not orders backed by threats: the content
      objection.
    source: Week 02 Lecture Transcript
  - type: basic
    concept: harts-chapter-iii-objections
    front: Range of application objection?
    back: Legislators make laws that also bind themselves; Austin's sovereign commands only the rest of the community.
    source: Week 02 Lecture Transcript
  - type: basic
    concept: harts-chapter-iii-objections
    front: Modes of origin objection, and Austin's reply?
    back: >-
      Customary law is not issued by the sovereign. Austin: customs are tacit orders — by not interfering, the sovereign
      tacitly accepts them.
    source: Week 02 Lecture Transcript
  - type: basic
    concept: harts-chapter-iii-objections
    front: Hart's strategy against Austin in one line?
    back: >-
      Use real law as counter-examples on Austin's own criteria: a descriptive theory must fit the facts; if it does
      not, change the theory, not the law.
    source: Week 02 Lecture Transcript
  - type: cloze
    concept: habits-and-rules
    text: 'For Hart, "habits are not ''normative'': they cannot confer {{c1::rights or authority}} on anyone." (CL 60)'
    source: Week 02 Lecture Slides, slide 20
  - type: basic
    concept: habits-and-rules
    front: Three salient differences between habits and rules?
    back: >-
      Deviations from a rule are met with criticism; the rule is regarded as a good reason for that criticism; social
      rules have an internal aspect.
    source: Week 02 Lecture Slides, slide 20
  - type: basic
    concept: habits-and-rules
    front: Chapter IV — three lines of criticism?
    back: >-
      (1) The habit of obedience cannot explain the continuity and persistence of law; (2) the legally unlimited power
      of the sovereign; (3) the sovereign's position above the law.
    source: Week 02 Lecture Slides, slide 19
  - type: apply
    concept: habits-and-rules
    scenario: Most people go to the cinema on Saturdays; most men remove their hats in church.
    answer: >-
      Both show convergence of behaviour. The cinema is a habit; the hat is a social rule — deviation is criticised, the
      rule is the reason, and it has an internal aspect.
    source: Week 02 Lecture Transcript
  - type: basic
    concept: habits-and-rules
    front: Where does legal obligation sit for Hart, per the lecture?
    back: >-
      More than coercion, but different from moral obligation: law has a specific normativity — a matter of authority,
      not just power.
    source: Week 02 Lecture Transcript
  - type: basic
    concept: law-and-coercion
    front: Lamond's five views on law and coercion?
    back: >-
      Genus of which law is a species (Austin); law as coercive social order (Kelsen); most salient aspect (Bentham,
      Holmes, Raz); law regulates coercion (Bobbio); law guides and constrains state coercion (Dworkin).
    source: Week 02 Lecture Slides, slide 21
  - type: cloze
    concept: law-and-coercion
    text: 'Lamond: two sources of interest in law and coercion, one {{c1::clarificatory}}, the other {{c2::evaluative}}.'
    source: Week 02 Lecture Slides, slide 21
  - type: apply
    concept: law-and-coercion
    scenario: Raz imagines a society of angels who always comply with the rules.
    answer: >-
      No enforcement needed, yet coordination problems still need law: a coercion-free legal system is conceivable, so
      coercion is not a necessary feature of law.
    source: Week 02 Lecture Transcript
  - type: cloze
    concept: law-and-coercion
    text: >-
      Schauer: "the focus of legal theory is dependent on a conception of {{c1::what a legal theory is supposed to
      accomplish}}" (p 16).
    source: Week 02 Lecture Slides, slide 23
audio:
  title: Week 2 recap — law and coercion
  minutes: 3
  script: >-
    This week tests one claim: that the key to understanding law is the simple notion of an order backed by

    threats, which Austin called a command.


    Start with Austin. Law in general is a rule laid down for an intelligent being by an intelligent being having power

    over him. There are four kinds: divine law, human law, positive morality such as international law, and laws only by

    metaphor, like the laws of motion. Jurisprudence is about positive law, set by political superiors to political

    inferiors. A command is a wish, an evil threatened for non-compliance, and the expression of the wish. Command, duty

    and sanction are inseparable, and superiority just means might.


    Which commands are positive laws? Those of a sovereign. A society is political when the bulk of its members
    habitually

    obey a determinate common superior, and independent when that superior obeys no one else. No territory is needed.

    Austin also gives us two positivist ideas: the existence of law is one thing, its merit another; and principles

    abstracted from every particular system, though illustrated from Roman and English law.


    Now Hart. The gunman orders the clerk to hand over the money. The clerk is obliged, but has no obligation. Hart

    avoids the word command, because commanding is exercising authority, and talks of coercive orders. He adds four

    elements: generality, enduring character, a general habit of obedience, and supremacy and independence. That gives
    the

    gunman situation writ large, built in Austin's strongest form. That is charitable interpretation.


    Then he attacks it. Chapter three: the content of laws, since power-conferring rules like wills and contracts are
    not

    orders backed by threats; their range, since legislators are bound by their own laws; and their origin, since custom

    is not issued by a sovereign. Chapter four goes deeper. Sovereignty rests on the habit of obedience, which cannot

    explain the continuity and persistence of law. Habits and rules both show convergent behaviour, but only rules
    attract

    criticism, supply the reason for it, and have an internal aspect. Habits cannot confer rights or authority. We need

    the idea of a rule.


    Finally, is coercion necessary? Lamond lists five views, from Austin's coercion as genus to Dworkin's law as

    constraining state coercion, and says coercion is at best the most salient aspect of certain legal systems. Raz's

    society of angels suggests law without coercion is conceivable. Schauer replies that law as we experience it is

    overwhelmingly coercive, and that what theory should focus on depends on what a theory of law is supposed to

    accomplish.
