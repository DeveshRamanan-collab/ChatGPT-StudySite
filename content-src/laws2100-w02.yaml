  - slug: austin-lectures-on-jurisprudence
    title: John Austin, Lectures on Jurisprudence, or the Philosophy of Positive Law (1863)
    kind: other
    text: >-
      "Expounding principles and distinctions which are the appropriate matter of jurisprudence, I shall present

      them abstracted from every particular system. But I shall also endeavour to illustrate them by examples from the
