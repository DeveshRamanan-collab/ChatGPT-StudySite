      "The gunman orders his victim to hand over his purse and threatens to shoot if he refuses" (CL 6). If the

      victim complies, we say he was obliged to do so. To some it has seemed that here we have "the essence of law, or
      at

      least 'the key to the science of jurisprudence'". Hart separates being obliged from having an obligation: the
      clerk

      is obliged to hand over the money, but has no obligation to.


      Hart avoids Austin's word 'command': "To command is characteristically to exercise authority over men, not power
      to

      inflict harm" (CL 20). He uses 'orders backed by threats' or 'coercive orders' for orders which, like the
      gunman's,

      are supported only by threats (CL 19).


