      Law = "a rule laid down for the guidance of an intelligent being by an intelligent being having power over

      him" (PJD 18). "The matter of jurisprudence is positive law: law, simply and strictly so called: or law set by

      political superiors to political inferiors." (PJD 18) "Every positive law is set by a sovereign person, or a
      sovereign

      body of persons, to a member or members of the independent political society wherein that person or body is
      sovereign

      or supreme" (PJD 165). "The existence of law is one thing; its merit or demerit is another." (Lecture V)
    gloss: >-
      Austin's imperative (command) theory: laws properly so called are commands of a sovereign habitually obeyed,
      backed by sanctions; law's existence is separate from its merit.
