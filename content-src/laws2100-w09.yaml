  - key: a18
    type: truefalse
    concept: will-and-interest-theories
    difficulty: 1
    set: quickfire
    statement: The lecture criticises the interest theory because infants cannot exercise choice.
    answer: false
    why: >-
      False: the infant example is aimed at the will theory, which ties rights to control or choice; the interest theory
