cards:
  - type: basic
    concept: will-and-interest-theories
    front: Will theory of rights?
    back: >-
      A person has a right if they have control or choice over whether others must or must not act in certain ways;
      rights are tools for exercising free will (autonomy).
    source: Week 09 Lecture Slides, slide 5
  - type: basic
    concept: will-and-interest-theories
    front: Interest theory of rights?
    back: >-
      A person has a right if it serves to protect an important interest; rights are justified by the role they play in
      promoting or safeguarding well-being (welfare).
    source: Week 09 Lecture Slides, slide 5
  - type: apply
    concept: will-and-interest-theories
    scenario: A six-month-old infant cannot choose whether others must act towards her in certain ways. Does she have rights?
    answer: >-
      On the will theory, arguably not: the lecture's objection is that it focuses too much on control. On the interest
      theory, yes: her rights protect important interests (welfare).
    source: Week 09 Lecture Transcript (2025 recording)
  - type: cloze
    concept: will-and-interest-theories
    text: >-
      Human rights are {{c1::plural}}, {{c2::universal}} and have {{c3::high priority}}, including priority over the
      "general interest".
    source: Week 09 Lecture Slides, slide 5
  - type: basic
    concept: will-and-interest-theories
    front: UDHR art 2?
    back: >-
      "Everyone is entitled to all the rights and freedoms set forth in this Declaration, without distinction of any
      kind, such as race, colour, sex, language, religion, political or other opinion, national or social origin,
      property, birth or other status."
    source: Week 09 Lecture Slides, slide 7
  - type: cloze
    concept: hohfeldian-incidents
    text: X has a {{c1::claim-right}} against Y with respect to φ if and only if Y is under a {{c2::duty to X to φ}}.
    source: Week 09 Lecture Slides, slide 6
  - type: cloze
    concept: hohfeldian-incidents
    text: X has a {{c1::privilege}} to φ if and only if X has {{c2::no duty not to φ}}.
    source: Week 09 Lecture Slides, slide 6
  - type: cloze
    concept: hohfeldian-incidents
    text: >-
      X has a (normative) {{c1::power}} over Y if and only if X has the ability to {{c2::alter (through volitional
      action)}} Y's normative position.
    source: Week 09 Lecture Slides, slide 6
  - type: cloze
    concept: hohfeldian-incidents
    text: >-
      X holds an {{c1::immunity}} against Y if and only if Y {{c2::lacks the ability to alter}} X's Hohfeldian
      incidents.
    source: Week 09 Lecture Slides, slide 6
  - type: apply
    concept: hohfeldian-incidents
    scenario: A constitution provides that Parliament cannot pass a law removing citizens' freedom of religion.
    answer: >-
      Citizens hold a Hohfeldian immunity against Parliament: Parliament lacks the ability to alter that position.
      Constitutional rights resist ordinary legislation.
    source: Week 09 Lecture Slides, slide 6
  - type: basic
    concept: hohfeldian-incidents
    front: Negative and positive rights?
    back: Consider the difference between "freedom from" (negative) and "freedom to" (positive).
    source: Week 09 Lecture Slides, slide 6
  - type: basic
    concept: rights-and-utilitarian-reasoning
    front: Do rights work as trumps or shields?
    back: >-
      The slide asks the question; the lecture attributes trumps to Dworkin and shields to Schauer (names from the
      recording only). Either way, rights take priority over the general interest and disrupt a certain kind of
      reasoning.
    source: Week 09 Lecture Slides, slide 5; Week 09 Lecture Transcript (2025 recording)
  - type: basic
    concept: rights-and-utilitarian-reasoning
    front: Act-utilitarianism and the principle of utility?
    back: >-
      Judge each action by its consequences, measured by the principle of utility: the greatest happiness for the
      greatest number. Utilitarianism is a form of consequentialism.
    source: Week 09 Lecture Slides, slide 5
  - type: basic
    concept: rights-and-utilitarian-reasoning
    front: Consequentialist v deontological reasoning (the lecture's crude version)?
    back: >-
      Consequentialist: judge an action by its consequences (lying may even be right if the outcome is good).
      Deontological: judge it by the principles that lie behind it.
    source: Week 09 Lecture Transcript (2025 recording)
  - type: apply
    concept: rights-and-utilitarian-reasoning
    scenario: A suspect knows where a bomb is hidden in a stadium. May the police torture him to save hundreds of lives?
    answer: >-
      Act-utilitarian: possibly, since aggregate happiness rises. A true commitment to human rights: not acceptable. The
      scenario tests our moral intuitions; it does not solve the dilemma.
    source: Week 09 Lecture Transcript (2025 recording)
  - type: basic
    concept: rights-and-utilitarian-reasoning
    front: Waldron's indirect utilitarianism (on the lecture's account)?
    back: >-
      For utilitarian reasons, we create structures in which officials are asked to refrain from utilitarian reasoning
      and to respect rights: his route to combining rights with utility. (From the recording; verify against the
      reading.)
    source: Week 09 Lecture Transcript (2025 recording)
  - type: basic
    concept: moral-and-legal-rights
    front: The authority issue?
    back: Are human rights moral rights, legal rights, or both? Are there authoritative sources for human rights?
    source: Week 09 Lecture Slides, slide 8
  - type: cloze
    concept: moral-and-legal-rights
    text: >-
      South Africa s 39(1): when interpreting the Bill of Rights, a court {{c1::must promote}} the values of an open and
      democratic society based on human dignity, equality and freedom; {{c2::must consider}} international law; and
      {{c3::may consider}} foreign law.
    source: Week 09 Lecture Slides, slide 8
  - type: apply
    concept: moral-and-legal-rights
    scenario: Slavery is legal and regulated. Do enslaved people have a right not to be enslaved?
    answer: >-
      No legal right, but one could say a moral right: positive law's silence does not mean the moral requirement does
      not exist. That moral claim then needs a moral justification.
    source: Week 09 Lecture Transcript (2025 recording)
  - type: basic
    concept: moral-and-legal-rights
    front: '"Positivisation" of human rights?'
    back: >-
      From natural law to positive law, from moral rights to legal rights: rights translated into domestic and
      international law, eg constitutionally protected rights (Germany's Basic Law arts 1–19; Australia has no bill of
      rights in its Federal Constitution).
    source: Week 09 Lecture Slides, slide 17
  - type: basic
    concept: moral-and-legal-rights
    front: Paper rights?
    back: >-
      Rights recognised in a constitution or treaty but not implemented: law in books, not law in action (the realists'
      distinction).
    source: Week 09 Lecture Transcript (2025 recording)
  - type: basic
    concept: generations-and-history-of-human-rights
    front: The three generations of human rights?
    back: >-
      1st: civil and political (life, equality before the law, speech, religion, property, fair trial, voting). 2nd:
      social, economic and cultural (just employment, food, housing, health care). 3rd: group and collective
      (self-determination, development, healthy environment, natural resources, intergenerational equity).
    source: Week 09 Lecture Slides, slide 9
  - type: cloze
    concept: generations-and-history-of-human-rights
    text: >-
      Third-generation human rights are group and collective rights, which some commentators call {{c1::solidarity human
      rights}}.
    source: Week 09 Lecture Slides, slide 9
  - type: basic
    concept: generations-and-history-of-human-rights
    front: Why are third-generation rights "more problematic"?
    back: >-
      In authority, justification and implementation: it is much harder to move from recognising, say, a right to a
      healthy environment to implementing it.
    source: Week 09 Lecture Transcript (2025 recording)
  - type: cloze
    concept: generations-and-history-of-human-rights
    text: >-
      UDHR {{c1::1948}}; ICCPR and ICESCR {{c2::1966}}; CEDAW {{c3::1979}}; Convention on the Rights of the Child
      {{c4::1989}}; UK Human Rights Act {{c5::1998}}.
    source: Week 09 Lecture Slides, slide 11
  - type: basic
    concept: generations-and-history-of-human-rights
    front: Human rights in Australia (slide)?
    back: >-
      No bill of rights in the Federal Constitution. Federal Acts: Age (2004), Disability (1992), Racial (1975) and Sex
      (1984) Discrimination Acts; AHRC Act 1986. State: Human Rights Act 2019 (Qld); Charter of Human Rights and
      Responsibilities Act 2006 (Vic). Treaties: ICCPR, ICESCR, CRC, CEDAW, CRPD, CERD, CAT.
    source: Week 09 Lecture Slides, slide 12
  - type: basic
    concept: critiques-of-human-rights
    front: Bentham on natural rights?
    back: >-
      "Natural rights is simple nonsense: natural and imprescriptible rights, rhetorical nonsense – nonsense upon
      stilts." (Anarchical Fallacies) On the lecture's reading: only legal rights exist; natural law is wishful
      thinking.
    source: Week 09 Lecture Slides, slide 15
  - type: basic
    concept: critiques-of-human-rights
    front: The five sceptical questions on "Can human rights be justified?"
    back: >-
      Is the idea of human nature just a myth? Are rights selfish? Are rights an instrument of oppression? Are rights a
      threat to the value of community? Are rights ethnocentric?
    source: Week 09 Lecture Slides, slide 15
  - type: basic
    concept: critiques-of-human-rights
    front: Moral relativism v objectivism (slide 16)?
    back: >-
      Relativism: are moral disagreements rationally resolvable? (metaethical v normative relativism).
      Objectivism/realism: are moral statements apt for truth and falsity? Readings: Wong and Trigg.
    source: Week 09 Lecture Slides, slide 16
  - type: apply
    concept: critiques-of-human-rights
    scenario: A critic says every entitlement is now called a human right, so the term has become meaningless.
    answer: >-
      The lecture treats this mainly as a call for better definition and more discipline in rights language: if every
      card is a trump, none is.
    source: Week 09 Lecture Transcript (2025 recording)
  - type: basic
    concept: limitation-clauses-and-proportionality
    front: Limitation clause? (Canada s 1)
    back: >-
      A constitutional provision permitting the partial limitation of some constitutional rights. Canada s 1: rights
      guaranteed "subject only to such reasonable limits prescribed by law as can be demonstrably justified in a free
      and democratic society".
    source: Week 09 Lecture Slides, slide 18
  - type: basic
    concept: limitation-clauses-and-proportionality
    front: Which rights does ECHR art 15(2) put beyond derogation?
    back: >-
      Art 2 (life, except deaths resulting from lawful acts of war), art 3 (torture), art 4(1) (slavery or servitude)
      and art 7 (no punishment without law).
    source: Week 09 Lecture Slides, slide 19
  - type: cloze
    concept: limitation-clauses-and-proportionality
    text: >-
      Vic Charter s 7(2) factors: the {{c1::nature of the right}}; the {{c2::importance of the purpose}} of the
      limitation; the {{c3::nature and extent}} of the limitation; the {{c4::relationship}} between the limitation and
      its purpose; any {{c5::less restrictive means}} reasonably available.
    source: Week 09 Lecture Slides, slide 20
  - type: basic
    concept: limitation-clauses-and-proportionality
    front: 'Alexy: rules v principles?'
    back: >-
      Rules are definitive commands; principles are optimisation requirements, realised to the greatest extent possible
      given legal and factual constraints. Rights are principles, so proportionality is necessarily connected to rights
      adjudication.
    source: Week 09 Lecture Slides, slide 21
  - type: apply
    concept: limitation-clauses-and-proportionality
    scenario: A measure achieves its legitimate aim, but an equally effective and less restrictive option exists.
    answer: >-
      It fails necessity, the second stage of Alexy's test (suitability, necessity, balancing); in Victoria, s 7(2)(e)
      "less restrictive means" is engaged.
    source: Week 09 Lecture Slides, slide 21
  - type: basic
    concept: limitation-clauses-and-proportionality
    front: Alexy's weight formula?
    back: >-
      A formula that formalises balancing: it considers the intensity of interference, the importance of the competing
      principle, and the degree of certainty about these factors.
    source: Week 09 Lecture Slides, slide 21
audio:
  title: Week 9 recap — rights and human rights
  minutes: 3
  script: >-
    This week we asked what a right is, using human rights as the example, through six issues: identity, authority,
    content, history, justification and implementation.


    First, human rights are rights. On the will theory, you have a right if you have control or choice over whether
    others must act, so rights are tools of autonomy. On the interest theory, you have a right if it protects an
    important interest, so rights serve welfare. The infant is the will theory's problem: no choice, but surely rights.
    Human rights are also plural, universal and high priority, with priority over the general interest.


    Hohfeld breaks "right" into four positions. A claim: Y owes X a duty. A privilege: X has no duty not to act. A
    power: X can alter Y's normative position. An immunity: Y cannot alter X's. Negative and positive rights: freedom
    from, freedom to.


    Priority sets rights against utility. Do rights work as trumps or as shields? Either way, a true commitment to human
    rights is incompatible with a certain kind of utilitarian reasoning. In the ticking-bomb case an act-utilitarian may
    justify torture to save many lives; the rights view says no. On the lecture's account, Waldron finds a bridge in
    indirect utilitarianism: for utilitarian reasons, we tell officials not to reason as utilitarians.


    Authority asks whether human rights are moral rights, legal rights, or both. Slavery shows the stakes: there was no
    legal right not to be enslaved, but arguably a moral one, which then needs a justification.


    Content comes in three generations: civil and political; social, economic and cultural; and group or solidarity
    rights, which are the hardest to justify and implement. The history runs from Magna Carta in 1215 to the Universal
    Declaration in 1948, which put universality at the centre, and on to the Covenants.


    Justification meets Bentham: natural rights are nonsense upon stilts, because only legal rights exist. Add the
    sceptical questions: myth, selfishness, oppression, community and ethnocentrism. Underneath sits the question
    whether moral statements can be true or false: relativism against objectivism.


    Finally, implementation. Moral rights become legal rights through positivisation, though Australia has no bill of
    rights in its Federal Constitution, and rights that are recognised but never implemented are only paper rights. Most
    rights can be limited. Canada's section 1 and Victoria's section 7 allow reasonable limits demonstrably justified in
    a free and democratic society. Article 15 of the European Convention lets states derogate in an emergency, but never
    from the right to life (save lawful acts of war), torture, slavery or no punishment without law. Alexy explains the
    weighing: rights are principles, so a limit must be suitable, necessary and proportionate in the narrow sense.
