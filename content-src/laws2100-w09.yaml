  - key: a19
    type: truefalse
    concept: will-and-interest-theories
    difficulty: 1
    set: quickfire
    statement: Human rights claim to be universal, unlike the rights created by a contract.
    answer: true
    why: >-
      True: a contract is binding only between the parties, whereas human rights claim to apply to each and every human
      being.
  - key: a20
    type: short
    concept: will-and-interest-theories
    difficulty: 3
    prompt: '"If rights are tools for exercising choice, infants have no rights. So the will theory must be wrong." Discuss.'
    model: >-
      The infant objection is a strong objection to the will theory as a complete account of rights, but it does not
      show the theory is simply wrong; it shows the theory fits some rights better than others. On the will theory a
      person has a right if they have control or choice over whether others must or must not act in certain ways; rights
      are tools for exercising free will (autonomy). An infant cannot exercise choice as adults can, so the theory seems
      to deny that infants have rights, which clashes with the idea of human rights as universal, belonging to all human
      beings. Against this, the will theory fits contractual rights well: a party can insist on or release the other
      side's duty. And the interest theory, which grounds rights in protecting important interests (welfare), explains
      infants' rights easily, so the debate is between families of theories, each capturing part of our practice. For
      human rights, which claim universality, the interest theory looks the better fit. Either way, the choice of theory
      should be stated, because it decides who can hold a right at all.
    rubric:
      - id: r1
        criterion: Thesis — takes a clear position on whether the infant objection defeats the will theory.
        marks: 2
        top-band: >-
          States a qualified thesis at once: a strong objection to the theory as a complete account, not a refutation of
          it.
        margin-note: Wrong, or incomplete? Say which.
        authorities: []
      - id: r2
        criterion: Argument — states both theories accurately and explains why infants trouble the will theory.
        marks: 3
        top-band: >-
          Uses the slide definitions (control or choice / important interest; autonomy / welfare) and links the infant
          to universality.
        margin-note: Accurate definitions, well used.
        authorities: []
      - id: r3
        criterion: Counterargument — gives the will theory its due and shows how the interest theory answers the example.
        marks: 3
        top-band: Concedes the fit with contractual rights, then shows the interest theory handling infants through welfare.
        margin-note: Good charity to the will theory.
        authorities: []
      - id: r4
        criterion: Evaluation — judges which theory suits human rights and why the choice matters.
        marks: 2
        top-band: >-
          Concludes that universality favours the interest theory for human rights, and that the theory chosen fixes who
          can hold a right.
        margin-note: 'Clear payoff: why does it matter?'
        authorities: []
  - key: b01
    type: mcq
    concept: hohfeldian-incidents
    difficulty: 1
    set: pretest
    stem: According to Hohfeld, X has a claim-right against Y with respect to φ if and only if…
    options:
      - text: Y is under a duty to X to φ.
        correct: true
        why: 'Right: the slide defines a claim-right by the other party''s duty owed to X: "Y is under a duty to X to φ".'
      - text: X has no duty not to φ.
        why: >-
          Tempting because it is also one of the four definitions, but this is a privilege: the absence of X's own duty
          not to act.
      - text: X can alter Y's normative position at will.
        why: 'This is a (normative) power: the ability to alter, through volitional action, another''s normative position.'
      - text: Y cannot alter X's Hohfeldian incidents.
        why: >-
          This is an immunity: Y lacks the ability to alter X's incidents. It is about changing positions, not about Y's
          duty to φ.
  - key: b02
    type: mcq
    concept: hohfeldian-incidents
    difficulty: 1
    stem: X has a privilege to φ if and only if…
    options:
      - text: Y is under a duty to X to let X φ freely.
        why: >-
          Tempting because privileges feel like protected freedoms, but a duty owed to X belongs to the definition of a
          claim-right, not a privilege.
      - text: X can alter Y's duties by choosing to φ.
        why: >-
          Altering another's normative position by a volitional act is a power, which is a different Hohfeldian position
          from a privilege.
      - text: X has no duty not to φ.
        correct: true
        why: >-
          Right: the slide says "X has a privilege to φ if and only if X has no duty not to φ". It concerns X's own
          duties only.
      - text: Y cannot alter X's freedom to φ.
        why: >-
          Y's inability to alter X's position is an immunity; a privilege says nothing about whether others can change
          it.
  - key: b03
    type: mcq
    concept: hohfeldian-incidents
    difficulty: 1
    stem: >-
      Which Hohfeldian position is defined as the ability to alter (through volitional action) another's normative
      position?
    options:
      - text: A claim-right.
        why: >-
          A claim-right is defined by Y's duty to X to φ, not by any ability to change positions, so it is not the
          position described.
      - text: A privilege.
        why: >-
          A privilege is the absence of a duty not to φ; it involves no ability to change anyone else's normative
          position.
      - text: A power.
        correct: true
        why: >-
          Right: "X has a (normative) power over Y if and only if X has the ability to alter (through volitional action)
          Y's normative position".
      - text: An immunity.
        why: >-
          Tempting because an immunity also concerns altering positions, but it is the reverse: the other party lacks
          the ability to alter yours.
  - key: b04
    type: mcq
    concept: hohfeldian-incidents
    difficulty: 1
    stem: X holds an immunity against Y if and only if…
    options:
      - text: Y has no duty not to interfere with X's choices about φ.
        why: >-
          This garbles the privilege definition (no duty not to φ) and applies it to Y; an immunity is about Y's lack of
          ability to alter X's position.
      - text: Y lacks the ability to alter X's Hohfeldian incidents.
        correct: true
        why: >-
          Right: the slide says X holds an immunity against Y if and only if Y lacks the ability to alter X's Hohfeldian
          incidents.
      - text: X is under no duty to Y with respect to anything at all.
        why: >-
          Tempting because immunity sounds like freedom from duties, but Hohfeld defines it by Y's inability to change
          X's position, not by X's lack of duties.
      - text: X can alter Y's normative position whenever X chooses.
        why: 'This is a power held by X over Y. An immunity is the mirror case: Y cannot alter X''s position.'
  - key: b05
    type: mcq
    concept: hohfeldian-incidents
    difficulty: 2
    stem: Ana lends Ben $500 and Ben promises to repay it by Friday. In Hohfeld's terms, what does Ana hold against Ben?
    options:
      - text: 'A privilege: Ana has no duty not to ask for her money back.'
        why: >-
          Ana may also have this privilege, but the facts turn on Ben's duty owed to Ana, which is the defining feature
          of a claim-right.
      - text: 'A power: Ana can alter Ben''s position simply by asking him.'
        why: >-
          Asking does not change Ben's normative position; his duty already exists. A power would be the ability to
          create or change that duty.
      - text: 'An immunity: Ben cannot alter Ana''s position in any way.'
        why: >-
          Nothing in the facts concerns whether Ben can change Ana's position; the relation described is Ben's duty to
          repay her.
      - text: 'A claim-right: Ben is under a duty to Ana to repay.'
        correct: true
        why: >-
          Right: X (Ana) has a claim-right against Y (Ben) with respect to φ (repaying) because Ben is under a duty to
          Ana to repay.
  - key: b06
    type: mcq
    concept: hohfeldian-incidents
    difficulty: 2
    stem: No law forbids Chloe from walking along a public beach. In Hohfeld's terms, Chloe has…
    options:
      - text: a claim-right that others keep off the beach.
        why: >-
          Nothing gives anyone a duty owed to Chloe; a claim-right needs another's duty to her, and the facts give only
          the absence of her own duty.
      - text: 'a privilege to walk there: she has no duty not to.'
        correct: true
        why: >-
          Right: X has a privilege to φ if and only if X has no duty not to φ. With no law forbidding it, Chloe has no
          duty not to walk there.
      - text: a power to change the other beach-goers' duties.
        why: >-
          Walking on the beach changes no one's normative position; a power requires the ability to alter another's
          position by a volitional act.
      - text: an immunity from anyone ever changing the law.
        why: >-
          Tempting because the freedom feels secure, but nothing in the facts stops the law being changed, so there is
          no immunity.
  - key: b07
    type: mcq
    concept: hohfeldian-incidents
    difficulty: 2
    stem: By making a will, Dev changes what his executor will be legally required to do. Which position does Dev exercise?
    options:
      - text: 'A claim-right: the executor owes Dev a duty to make the will valid.'
        why: >-
          The executor's duties are the result of Dev's act, not the source of it; what Dev exercises is the ability to
          change those duties.
      - text: 'A privilege: Dev has no duty not to write down his wishes.'
        why: >-
          Dev may well have that privilege too, but the facts stress that he changes another person's legal position,
          which is a power.
      - text: 'A power: he alters, by a volitional act, another''s normative position.'
        correct: true
        why: >-
          Right: making a will is an act by which Dev alters the executor's normative position, matching the slide's
          definition of a (normative) power.
      - text: 'An immunity: nobody can alter Dev''s wishes once he has signed.'
        why: >-
          Whether others can change Dev's position is a separate question; the facts describe Dev changing someone
          else's position.
  - key: b08
    type: mcq
    concept: hohfeldian-incidents
    difficulty: 3
    stem: >-
      A constitution provides that Parliament cannot pass a law removing citizens' freedom of religion. In Hohfeld's
      terms, what do citizens hold against Parliament?
    options:
      - text: 'A claim-right: Parliament owes them a duty to practise religion.'
        why: >-
          The provision imposes no duty to practise religion on anyone; it removes Parliament's ability to change the
          citizens' position.
      - text: 'A privilege: Parliament has no duty not to legislate on religion.'
        why: >-
          This describes Parliament's position, not the citizens', and it gets the facts backwards: Parliament is
          disabled, not free.
      - text: 'A power: citizens can alter Parliament''s position by voting.'
        why: Voting may be a power, but the provision described is about what Parliament cannot do to the citizens.
      - text: 'An immunity: Parliament lacks the ability to alter that position.'
        correct: true
        why: >-
          Right: X holds an immunity against Y when Y lacks the ability to alter X's incidents. This is how
          constitutional rights resist ordinary legislation.
  - key: b09
    type: mcq
    concept: hohfeldian-incidents
    difficulty: 2
    stem: Which pair of Hohfeldian positions is defined by the ability (or inability) to alter normative positions?
    options:
      - text: Claim and privilege.
        why: >-
          These two are defined by duties with respect to φ (Y's duty to X; X's lack of a duty not to φ), not by the
          ability to alter positions.
      - text: Power and immunity.
        correct: true
        why: >-
          Right: a power is X's ability to alter Y's normative position, and an immunity is Y's lack of ability to alter
          X's incidents.
      - text: Claim and power.
        why: >-
          Tempting because both sound strong, but a claim is defined by Y's duty to X, so only one of this pair concerns
          altering positions.
      - text: Privilege and immunity.
        why: >-
          Tempting because both sound like freedoms, but a privilege is about X's duties regarding φ; only immunity
          concerns altering positions.
  - key: b10
    type: mcq
    concept: hohfeldian-incidents
    difficulty: 2
    variant-of: b09
    stem: Which pair of Hohfeldian positions is defined in terms of duties with respect to φ?
    options:
      - text: Power and immunity.
        why: >-
          These two are defined by the ability, or the lack of ability, to alter normative positions, not by duties with
          respect to φ.
      - text: Privilege and power.
        why: >-
          A privilege is defined by duties (X has no duty not to φ), but a power is defined by the ability to alter
          another's position.
      - text: Claim and immunity.
        why: A claim is defined by Y's duty to X, but an immunity is defined by Y's lack of ability to alter X's incidents.
      - text: Claim and privilege.
        correct: true
        why: >-
          Right: a claim exists when Y is under a duty to X to φ, and a privilege when X has no duty not to φ; both turn
          on duties about φ.
  - key: b11
    type: mcq
    concept: hohfeldian-incidents
    difficulty: 3
    stem: What is the main lesson of Hohfeld's analysis for talking about rights?
    options:
      - text: It proves that every human right is a claim-right matched by a state duty.
        why: >-
          Tempting because claim-rights are the most familiar, but Hohfeld's point is that "right" covers four different
          positions, not just claims.
      - text: It shows rights are only legal positions, so moral rights cannot exist.
        why: >-
          The slide calls them legal positions, but it says nothing about moral rights; whether human rights are moral,
          legal or both is a separate issue.
      - text: '"Right" covers four different positions, so a rights claim should say which it asserts, and against whom.'
        correct: true
        why: >-
          Right: Hohfeld identifies four positions within the concept of a "right", so analysing a rights claim means
          identifying the position and the parties.
      - text: It replaces the will and interest theories with one test of what a right is.
        why: >-
          The slides present Hohfeld alongside the two theories, under "Human rights qua rights"; he analyses positions
          rather than offering a rival test.
  - key: b12
    type: mcq
    concept: hohfeldian-incidents
    difficulty: 2
    stem: On negative and positive rights, the slide asks you to consider the difference between…
    options:
      - text: claims and privileges.
        why: >-
          These are two of Hohfeld's four positions, on the same slide; the negative/positive distinction is put in
          different terms.
      - text: '"freedom from" and "freedom to".'
        correct: true
        why: >-
          Right: the slide says "Negative and positive rights (consider the difference between 'freedom from' and
          'freedom to')".
      - text: moral rights and legal rights.
        why: >-
          Tempting because "positive" suggests positive law, but moral versus legal rights is the authority issue, not
          the negative/positive distinction.
      - text: definitive commands and optimisation requirements.
        why: >-
          This is Alexy's distinction between rules and principles, from the proportionality slide, not the
          negative/positive distinction.
  - key: b13
    type: mcq
    concept: hohfeldian-incidents
    difficulty: 2
    stem: Which statement about Hohfeld matches the slides?
    options:
      - text: He distinguishes rules (definitive commands) from principles (optimisation requirements).
