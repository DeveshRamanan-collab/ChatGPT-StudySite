      - text: 'Yes: it adopts the Universal Declaration of Human Rights.'
        why: The UDHR is a declaration without real binding force, and it is not adopted by the Australian Constitution.
      - text: No, but it adopts the UK Human Rights Act 1998 instead.
        why: >-
          Tempting because the state acts imitate the UK Act, but the Constitution adopts no such Act; the state laws
