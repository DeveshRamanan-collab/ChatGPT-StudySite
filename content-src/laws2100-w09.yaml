authorities:
  - slug: universal-declaration-of-human-rights-1948
    title: Universal Declaration of Human Rights (1948)
    kind: other
    text: >-
      "The General Assembly proclaims this Universal Declaration of Human Rights as a common standard of achievement for
      all peoples and all nations, to the end that every individual and every organ of society, keeping this Declaration
      constantly in mind, shall strive by teaching and education to promote respect for these rights and freedoms and by
      progressive measures, national and international, to secure their universal and effective recognition and
      observance…" Art 2: "Everyone is entitled to all the rights and freedoms set forth in this Declaration, without
      distinction of any kind, such as race, colour, sex, language, religion, political or other opinion, national or
      social origin, property, birth or other status."
    gloss: >-
      The post-war declaration that most discussions of human rights refer back to: a common standard of achievement
      rather than a binding instrument, with universality at its centre.
    cases: []
    verify: false
  - slug: hohfeld-four-incidents
    title: 'Wesley Newcomb Hohfeld (1879–1918): the four positions within a ''right'''
    kind: principle
    text: >-
      X has a claim-right against Y with respect to φ if and only if Y is under a duty to X to φ. X has a privilege to φ
      if and only if X has no duty not to φ. X has a (normative) power over Y if and only if X has the ability to alter
      (through volitional action) Y's normative position. X holds an immunity against Y (in respect of X's normative
      position), if and only if Y lacks the ability to alter X's Hohfeldian incidents.
    gloss: 'Hohfeld breaks the concept of a "right" into four different legal positions: claim, privilege, power and immunity.'
    cases: []
    verify: false
  - slug: bentham-anarchical-fallacies
    title: Jeremy Bentham, Anarchical Fallacies, in J. Bowring (ed.), Works, vol. 2 (1843)
    kind: other
    text: >-
      "Natural rights is simple nonsense: natural and imprescriptible rights, rhetorical nonsense – nonsense upon
      stilts."
    gloss: >-
      Bentham dismisses natural rights: on the lecture's reading, for this utilitarian and positivist the only rights
      that exist are legal rights.
    cases: []
    verify: false
  - slug: waldron-the-law-theory-and-practice-in-british-politics
    title: 'Jeremy Waldron, The Law: Theory and Practice in British Politics (1990)'
    kind: other
    text: >-
      As described in the 2025 lecture recording (no extract on the slides): the week's reading is a chapter that uses
      the Troubles in Northern Ireland, and the interrogation techniques used by the British army (the "five
      techniques"), to examine the tension between rights and utilitarian reasoning, distinguishing act, rule and
      indirect utilitarianism.
    gloss: >-
      Waldron's chapter on rights against utility; on the lecture's account he finds room for compatibility in indirect
      utilitarianism, where officials are asked, for utilitarian reasons, not to reason as utilitarians.
    cases: []
