  - slug: constitution-of-the-republic-of-south-africa-s39-1
    title: Constitution of the Republic of South Africa, s 39(1)
    kind: statute
    text: >-
      "When interpreting the Bill of Rights, a court, tribunal or forum (a) must promote the values that underlie an
      open and democratic society based on human dignity, equality and freedom; (b) must consider international law; and
      (c) may consider foreign law."
    gloss: >-
      An example of a legal source directing how rights are interpreted: values must be promoted, international law must
      be considered, foreign law may be.
    cases: []
    verify: false
  - slug: canadian-charter-of-rights-and-freedoms-s1
    title: Canadian Charter of Rights and Freedoms, s 1 (Guarantee of rights and freedoms)
    kind: statute
    text: >-
      "The Canadian Charter of Rights and Freedoms guarantees the rights and freedoms set out in it subject only to such
      reasonable limits prescribed by law as can be demonstrably justified in a free and democratic society."
    gloss: >-
      The model limitation clause: rights are guaranteed, subject to reasonable limits prescribed by law and
      demonstrably justified.
    cases: []
    verify: false
  - slug: echr-art-15
    title: European Convention on Human Rights, art 15 (Derogation in time of emergency)
    kind: treaty
    text: >-
      "1. In time of war or other public emergency threatening the life of the nation any High Contracting Party may
      take measures derogating from its obligations under this Convention to the extent strictly required by the
      exigencies of the situation, provided that such measures are not inconsistent with its other obligations under
      international law. 2. No derogation from Article 2 [Rights to life], except in respect of deaths resulting from
      lawful acts of war, or from Articles 3 [Prohibition of torture], 4 (paragraph 1) ['No one shall be held in slavery
      or servitude'] and 7 [No punishment without law] shall be made under this provision. 3. Any High Contracting Party
      availing itself of this right of derogation shall keep the Secretary General of the Council of Europe fully
      informed of the measures which it has taken and the reasons therefor. It shall also inform the Secretary General
      of the Council of Europe when such measures have ceased to operate and the provisions of the Convention are again
      being fully executed."
    gloss: >-
      Derogation is allowed in war or public emergency, strictly as required, but never from the rights to life (save
      lawful acts of war), freedom from torture and slavery, and no punishment without law.
    cases: []
    verify: false
  - slug: charter-of-human-rights-and-responsibilities-act-2006-vic-s7
    title: Charter of Human Rights and Responsibilities Act 2006 (Vic), s 7
    kind: statute
    text: >-
      "Human rights—what they are and when they may be limited (1) This Part sets out the human rights that Parliament
      specifically seeks to protect and promote. (2) A human right may be subject under law only to such reasonable
      limits as can be demonstrably justified in a free and democratic society based on human dignity, equality and
      freedom, and taking into account all relevant factors including – (a) the nature of the right; and (b) the
      importance of the purpose of the limitation; and (c) the nature and extent of the limitation; and (d) the
      relationship between the limitation and its purpose; and (e) any less restrictive means reasonably available to
      achieve the purpose that the limitation seeks to achieve. (3) Nothing in this Charter gives a person, entity or
      public authority a right to limit (to a greater extent than is provided for in this Charter) or destroy the human
      rights of any person."
    gloss: >-
      Victoria's limitation clause: the Canadian formula, anchored in human dignity, equality and freedom, with five
      listed factors for judging whether a limit is justified.
    cases: []
    verify: false
  - slug: alexy-proportionality
    title: Robert Alexy on proportionality (rules and principles; the weight formula)
    kind: principle
    text: >-
      Alexy distinguishes rules (definitive commands) from principles (optimisation requirements). Principles must be
      realised to the greatest extent possible, given legal and factual constraints. Proportionality is necessarily
      connected to the adjudication of constitutional rights because rights are principles. Three-part test: suitability
      (the measure must be capable of achieving the legitimate aim); necessity (there must be no less restrictive means
      to achieve the same goal); proportionality in the narrow sense, or balancing (the benefits of the measure must
      outweigh the detriment to the right infringed). The "weight formula" formalises balancing: it considers the
      intensity of interference, the importance of the competing principle, and the degree of certainty about these
      factors.
    gloss: Rights as principles to be optimised, so limits on them are tested for suitability, necessity and balance.
    cases: []
    verify: false
  - slug: besson-human-rights-and-constitutional-law
    title: >-
      Samantha Besson, 'Human Rights and Constitutional Law – Patterns of Mutual Validation and Legitimation', in Rowan
      Cruft, S. Matthew Liao and Massimo Renzo (eds), Philosophical Foundations of Human Rights (Oxford University
      Press, 2015) 279-299
    kind: article
    text: Recommended on the slide "on the relationship between international and domestic human rights regimes".
    gloss: >-
      Further reading on how international and domestic (constitutional) human rights regimes validate and legitimate
      each other.
    cases: []
    verify: false
questions:
  - key: a01
    type: mcq
    concept: will-and-interest-theories
    difficulty: 1
    set: pretest
    stem: According to the will theory, when does a person have a right?
    options:
      - text: When the right serves to protect an important interest of theirs, such as their well-being.
        why: >-
          Tempting because it is the other main theory on the slide, but this is the interest theory, which grounds
          rights in welfare rather than in control or choice.
      - text: When they have control or choice over whether others must or must not act in certain ways.
        correct: true
        why: >-
          Right: the slide defines the will theory this way; rights are seen as tools for exercising free will, so the
          value at stake is autonomy.
      - text: When a court of law will enforce the entitlement against anyone who interferes with it.
        why: >-
          Tempting because many rights are enforceable in court, but that is a test of legal enforceability (closer to
          Bentham), not the will theory of what a right is.
      - text: When having the right promotes the greatest happiness of the greatest number of people.
        why: >-
          This is the principle of utility, which the slides set against human rights; it is not either of the two
          theories of what a right is.
  - key: a02
    type: mcq
    concept: will-and-interest-theories
    difficulty: 1
    stem: Which value does the interest theory of rights focus on?
    options:
      - text: 'Autonomy: rights are tools for exercising the holder''s free will.'
        why: >-
          Tempting because it is the will theory's value; the interest theory moves the focus away from autonomy and on
          to the holder's well-being.
      - text: 'Utility: rights maximise the happiness of the greatest number.'
        why: >-
          The principle of utility aggregates happiness across a community; the interest theory instead looks at an
          important interest of the right-holder.
      - text: 'Welfare: rights promote or safeguard the holder''s well-being.'
        correct: true
        why: >-
          Right: on the interest theory, rights are justified by the role they play in promoting or safeguarding
          well-being, so the value is welfare.
      - text: 'Legality: rights are whatever positive law happens to enforce.'
        why: >-
          Tempting if you recall Bentham's view that only legal rights exist, but the interest theory is about
          protecting interests, not about legal enforcement.
  - key: a03
    type: mcq
    concept: will-and-interest-theories
    difficulty: 2
    stem: Which example does the lecture use to criticise the will theory?
    options:
      - text: A contracting party who chooses to release the other side from its duty.
        why: >-
          Contractual rights are the will theory's comfortable case: a party exercising choice over another's duty fits
          it well, so this supports rather than criticises it.
      - text: An infant, who cannot exercise choice in the way adults can.
        correct: true
        why: >-
          Right: if rights require control or choice, an infant seems to have no rights at all, so the will theory may
          focus too much on control.
      - text: A terrorist suspect who refuses to reveal where a bomb is hidden.
        why: >-
          The ticking-bomb suspect is the lecture's example of the clash between rights and utilitarian reasoning, not
          its objection to the will theory.
      - text: An enslaved person whose legal system accepted and regulated slavery.
        why: >-
          The slavery example raises the question of moral versus legal rights in the history section; it is not used
          against the will theory.
  - key: a04
    type: mcq
    concept: will-and-interest-theories
    difficulty: 2
    stem: >-
      Mia, aged six months, cannot make choices about whether others must act towards her in certain ways. Which theory
      most easily explains why Mia nonetheless has rights?
    options:
      - text: The will theory, because rights are tools by which every person exercises free will.
        why: >-
          Tempting because the will theory sees rights as tools of free will, but that is exactly the problem: Mia
          cannot yet exercise choice, so the theory struggles here.
      - text: 'Neither theory: on both, only adults capable of choice can hold any rights at all.'
        why: >-
          Too strong: only the will theory ties rights to control or choice. The interest theory needs no capacity to
          choose, only an important interest to protect.
      - text: The interest theory, because her rights protect important interests in her well-being.
        correct: true
        why: >-
          Right: the interest theory grounds rights in protecting important interests (welfare), so an infant who cannot
          choose still has rights.
      - text: Act-utilitarianism, because protecting infants maximises the general happiness.
        why: >-
          Act-utilitarianism is a way of evaluating actions by their consequences, not a theory of what it is to have a
          right; the slides set it against rights.
  - key: a05
    type: mcq
    concept: will-and-interest-theories
    difficulty: 2
    stem: Why does the lecture say that many legal rights are not human rights?
    options:
      - text: Because they exist only because we create them, for example by signing a contract.
        correct: true
        why: >-
          Right: the lecture contrasts rights we create (a contract gives us rights and obligations) with human rights,
          which are a subset of rights with further features.
      - text: Because only rights in a constitution can count as legal rights in the first place.
        why: >-
          Tempting because constitutions do protect rights, but contract and statute create legal rights too; the
          lecture says rights can be legal without being constitutional.
      - text: Because human rights are moral rights and can never be recognised by positive law.
        why: >-
          The slides ask whether human rights are moral, legal or both, and treat their "positivisation" into law as a
          real process, so they can be legally recognised.
      - text: Because legal rights protect interests, while human rights only protect free choices.
        why: >-
          This muddles the will and interest theories, which are general theories of all rights; neither divides legal
          rights from human rights in this way.
  - key: a06
    type: mcq
    concept: will-and-interest-theories
    difficulty: 2
    stem: Which feature distinguishes human rights from the rights created by a contract between two people?
    options:
      - text: 'Enforceability: contractual rights cannot be enforced in a court of law.'
        why: >-
          Tempting, but contractual rights are the lecture's standard example of rights that can be enforced; the
          difference lies elsewhere.
      - text: 'Plurality: a contract creates only one right, never a whole set of rights.'
        why: >-
          The lecture says a contract gives the parties "a number of rights and obligations", and plurality is listed as
          a feature of human rights, not a contrast with contract.
      - text: 'Universality: human rights claim to apply to each and every human being.'
        correct: true
        why: >-
          Right: a contract binds only its parties, whereas human rights claim to apply to every human being; that is
          the slide's "human rights are universal".
      - text: 'Control: contractual rights involve no choice at all by the right-holder.'
        why: >-
          The opposite: the lecture offers contractual rights as a case where rights are connected with exercising free
          will, which is why they suit the will theory.
  - key: a07
    type: mcq
    concept: will-and-interest-theories
    difficulty: 2
    stem: Which statement about human rights and constitutional rights matches the lecture?
    options:
      - text: Every constitutional right is a human right, because both of them have high priority.
        why: >-
          Tempting because both have priority, but the lecture says a right can be constitutional without being a human
          right: priority alone does not make a right human.
      - text: A right can be constitutional without being a human right, and vice versa.
        correct: true
        why: >-
          Right: the lecture says constitutional rights have priority over other legal requirements but may not be human
          rights, and a human right need not be constitutional.
      - text: A human right exists only once a constitution has expressly recognised it.
        why: >-
          This confuses a right's legal recognition with its existence; the lecture keeps open that human rights may be
          moral rights, recognised in law or not.
      - text: Constitutional rights have no priority at all over other legal requirements.
        why: >-
          The lecture says the opposite: constitutional rights have priority over the other legal requirements, because
          the constitution is the highest legal source.
  - key: a08
    type: mcq
    concept: will-and-interest-theories
    difficulty: 1
    stem: The slide lists the features of human rights. Which is NOT one of them?
    options:
      - text: They are absolute and can never be limited.
        correct: true
        why: >-
          Right: the slides list rights, plural, universal and high-priority; whether any human rights are absolute is
          left as an open question ("Are there any absolute human rights?").
      - text: They are plural.
        why: >-
          This is on the slide ("Human rights are plural"): there are a number of them, which raises the question of how
          the set of human rights is identified.
      - text: They are universal.
        why: >-
          This is on the slide ("Human rights are universal"): unlike contractual rights, they claim to apply to each
          and every human being.
      - text: They have high priority.
        why: >-
          This is on the slide ("Human rights have high-priority"), including priority over the "general interest",
          which sets up the tension with utility.
  - key: a09
    type: mcq
    concept: will-and-interest-theories
    difficulty: 2
    stem: What does UDHR art 2 add to the idea of human rights qua human rights?
    options:
      - text: Only citizens of states that sign the Declaration hold the rights it sets out.
        why: >-
          Tempting if you think of treaties binding their parties, but art 2 says "everyone" is entitled, without
          distinction of national or social origin.
      - text: Rights may be limited by law when demonstrably justified in a free society.
        why: >-
          This is the language of limitation clauses (Canadian Charter s 1, Victorian Charter s 7), not of art 2 of the
          UDHR.
      - text: Groups such as peoples hold the Declaration's rights, rather than individuals.
        why: >-
          Group rights such as self-determination are on the slide, but art 2 speaks of "everyone", that is, each
          individual human being.
      - text: Everyone holds its rights and freedoms without distinction of any kind, eg race or sex.
        correct: true
        why: >-
          Right: art 2 says "Everyone is entitled to all the rights and freedoms set forth in this Declaration, without
          distinction of any kind, such as race, colour, sex…".
  - key: a10
    type: mcq
    concept: will-and-interest-theories
    difficulty: 3
    stem: According to the lecture, why is it hard to say what makes human rights "human"?
    options:
      - text: The UDHR expressly refuses to define who counts as a human being.
        why: >-
          The lecture says nothing of the kind about the UDHR; the difficulty it raises is philosophical, about what it
          means to be human.
      - text: >-
          Defining what it is to be human is difficult: biology alone leaves the line between us, other species and
          intelligent artefacts unclear.
        correct: true
        why: >-
          Right: the lecture asks where we draw the line, given our similarity to other species and to artefacts such as
          robots with comparable intelligence.
      - text: Human rights are legal rights, so their holders are fixed by each state's statutes.
        why: >-
          Tempting if you assume human rights are only legal rights, but the lecture treats the idea of humanity as a
          moral intuition, not a statutory definition.
      - text: The interest theory denies that humans have interests that differ from other species.
        why: >-
          The interest theory says nothing about species; it grounds rights in important interests. The difficulty comes
          from defining humanity itself.
  - key: a11
    type: mcq
    concept: will-and-interest-theories
    difficulty: 1
    stem: Which is an example of a group (collective) right given on the slides?
    options:
      - text: The right to a fair trial.
        why: >-
          A fair trial is listed as a first-generation civil and political right, held by individuals; it is not the
          slide's example of a group right.
      - text: The right to self-determination.
        correct: true
        why: >-
          Right: the slide gives "Individual and group rights (e.g., the right to self-determination)", and
          self-determination is also a third-generation right.
      - text: Freedom of opinion and expression.
        why: >-
          Tempting because many people express opinions together, but the slide lists it among the rights belonging to
          all human beings individually.
      - text: The right to life and liberty of the person.
        why: >-
          The right to life is a first-generation civil and political right of each individual, not a collective right
          of a group.
  - key: a12
    type: mcq
    concept: will-and-interest-theories
    difficulty: 3
    contrasts-with:
      - hohfeldian-incidents
    stem: 'A student writes: "The will theory just is Hohfeld''s idea of a power." What is the best response?'
    options:
      - text: 'Correct: both define a right as the ability to alter another person''s normative position.'
        why: >-
          Tempting because control sounds like a power, but the will theory is about control or choice over others'
          duties, while a power is only one of Hohfeld's four positions.
      - text: >-
          Not quite: the will theory says what makes something a right (control or choice); a power is one of four
          positions that "right" can name.
        correct: true
        why: >-
          Right: the will theory is a theory of what rights are; Hohfeld breaks "right" into claim, privilege, power and
          immunity, so a power is narrower.
      - text: 'Not quite: the will theory is about welfare, whereas a Hohfeldian power concerns autonomy.'
        why: >-
          This reverses the theories: welfare belongs to the interest theory; the will theory's value is autonomy. And
          Hohfeld's power is defined structurally, not by a value.
      - text: 'Correct: Hohfeld founded both the will theory and the interest theory.'
        why: >-
          The slides do not attribute the two theories to Hohfeld; they present them as families of theories, and
          Hohfeld separately as identifying four positions.
  - key: a13
    type: mcq
    concept: will-and-interest-theories
    difficulty: 2
    stem: What does the slide mean by saying that human rights have "high priority"?
    options:
      - text: They take priority over every other right without exception.
        why: >-
          Tempting, but the slide speaks of priority over the "general interest", not over other rights; rights can
          conflict with one another and be balanced.
      - text: They have priority over the "general interest".
        correct: true
        why: >-
          Right: the slide says "Human rights have priority over the 'general interest'", which is why they sit in
          tension with utilitarian reasoning.
      - text: They must be applied before any statute is interpreted by a court.
        why: >-
          Nothing on the slide sets an order of judicial operations; the priority in question is over the general
          interest.
      - text: They outrank moral claims because they are legal rather than moral rights.
        why: >-
          Whether human rights are moral, legal or both is an open question on the slides, so their priority cannot rest
          on their being merely legal.
  - key: a14
    type: mcq
    concept: will-and-interest-theories
    difficulty: 2
    variant-of: a04
    stem: >-
      Under a contract, Sam can either insist that Lee deliver the goods or release Lee from that duty. Which theory
      fits Sam's right most naturally?
    options:
      - text: 'The interest theory: Sam''s right exists only because delivery serves his welfare.'
        why: >-
          The interest theory could also describe this right, but the feature the facts stress (Sam's choice to insist
          or release) is the will theory's focus.
      - text: 'The will theory: Sam has control or choice over whether Lee must act.'
        correct: true
        why: >-
          Right: Sam controls whether Lee must or must not act, and the lecture gives contractual rights as the example
          of rights tied to exercising free will.
      - text: 'Act-utilitarianism: the contract binds only if enforcing it maximises happiness.'
        why: >-
          Act-utilitarianism evaluates actions by their consequences; it is not a theory of what makes Sam the holder of
          a right.
      - text: 'Neither: contractual rights are not rights at all, because they are not universal.'
        why: >-
          Universality distinguishes human rights from contractual rights; it does not stop contractual rights being
          rights. The lecture treats them as rights.
  - key: a15
    type: mcq
    concept: will-and-interest-theories
    difficulty: 2
    variant-of: a06
    stem: Pat and Quinn sign a lease that gives Pat a right to quiet enjoyment of the flat. Why is this not a human right?
    options:
      - text: It cannot be enforced in court, whereas human rights are always legally enforceable.
        why: >-
          Lease rights can be enforced in court, and the slides leave open whether human rights are legal rights at all,
          so enforceability is not the difference.
      - text: It protects an interest, whereas human rights protect only the holder's free choices.
        why: >-
          This confuses the will and interest theories with the line between ordinary and human rights; both theories
          are accounts of rights in general.
      - text: It binds only the parties to the lease; human rights apply to every human being.
        correct: true
        why: >-
          Right: like any contract, the lease binds only its parties, whereas human rights claim universality: they
          apply to each and every human being.
      - text: It was created by a written document, and human rights can never be written down.
        why: >-
          Human rights are written down all the time, in the UDHR, covenants and bills of rights; being written is not
          what separates the lease from them.
  - key: a16
    type: mcq
    concept: will-and-interest-theories
    difficulty: 2
    stem: Which pairing of theory and value is correct?
    options:
      - text: Will theory – welfare; interest theory – autonomy.
        why: >-
          Tempting because the pairs are easy to swap, but this reverses them: the will theory is about control
          (autonomy) and the interest theory about well-being.
      - text: Will theory – autonomy; interest theory – welfare.
        correct: true
        why: >-
          Right: rights as tools for exercising free will (autonomy) against rights as protecting important interests,
          promoting or safeguarding well-being (welfare).
      - text: Will theory – utility; interest theory – human dignity.
        why: >-
          Utility is the principle of utilitarian reasoning and dignity a value in the foundations of human rights;
          neither is the value of these two theories.
      - text: Will theory – legality; interest theory – morality.
        why: >-
          Both theories are about what rights are in general, legal or moral; neither is defined by legality or morality
          as such.
  - key: a17
    type: truefalse
    concept: will-and-interest-theories
    difficulty: 1
    set: quickfire
    statement: On the will theory, rights are seen as tools for exercising free will.
    answer: true
    why: >-
      True: the slide says that on the will theory "rights are seen as tools for exercising free will (autonomy)",
