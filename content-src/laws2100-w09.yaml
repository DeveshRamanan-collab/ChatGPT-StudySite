  - key: d06
    type: mcq
    concept: moral-and-legal-rights
    difficulty: 3
    stem: >-
      In a society where slavery is legal and regulated, someone says: "Enslaved people had no right not to be
      enslaved." What response does the lecture's history discussion support?
    options:
      - text: They had a legal right all along, because the right to liberty is part of every legal system.
        why: >-
          The lecture accepts that the legal system was accepting and regulating slavery, so there was no legal right;
          the question is about a moral right.
      - text: No legal right, but arguably a moral right, which needs its own justification.
        correct: true
        why: >-
          Right: positive law's failure to recognise a moral requirement does not mean the requirement does not exist,
          but the moral claim must be justified.
      - text: They had no right of any kind, since rights exist only when positive law recognises them.
        why: >-
          Tempting because it is Bentham's line that only legal rights exist, but the lecture presents the moral-right
          answer as available and in need of justification.
      - text: They had a moral right, which automatically made the laws regulating slavery invalid.
        why: >-
          The lecture says we need not settle validity (the positivism versus natural law debate) here; we can recognise
          a tension between positive law and morality.
  - key: d07
    type: mcq
    concept: moral-and-legal-rights
    difficulty: 3
    stem: Why does the lecture say the slavery example raises a "foundational" question?
    options:
      - text: Because it proves freedom from slavery has always been an absolute legal right.
        why: >-
          The opposite: many now see freedom from slavery as absolute, but the lecture says that flies in the face of
          our history.
      - text: Because it shows that moral views never change, while legal systems do.
        why: The lecture says some people changed their moral views and the legal system followed; moral views did change.
      - text: A moral right the law ignores needs a moral justification.
        correct: true
        why: >-
          Right: if enslaved people had a moral claim not to be enslaved, we need to justify that claim morally, which
          is the question of foundations.
      - text: Because it shows that rights are created only by contracts between individuals.
        why: >-
          Contracts are the lecture's example of rights we create, but slavery raises the opposite question: rights that
          no one created in positive law.
  - key: d08
    type: mcq
    concept: moral-and-legal-rights
    difficulty: 2
    stem: What does the "positivisation" of human rights mean on the slides?
    options:
      - text: Turning moral rights into legal rights, in domestic and international law.
        correct: true
        why: >-
          Right: the slide moves "from natural law to positive law" and "from moral rights to legal rights" through
          "positivisation" into domestic and international law.
      - text: Proving that human rights are morally objective rather than relative to a culture.
        why: >-
          Objectivism versus relativism is the justification issue; positivisation is about implementation in positive
          law.
      - text: Restricting human rights to those that produce the greatest happiness.
        why: >-
          This would subordinate rights to the principle of utility; positivisation is about legal recognition, not
          utilitarian selection.
      - text: Treating every right as a positive right ("freedom to") rather than a negative one.
        why: >-
          Tempting because of the shared word, but positive rights ("freedom to") are a different distinction;
          positivisation means enacting rights in positive law.
  - key: d09
    type: mcq
    concept: moral-and-legal-rights
    difficulty: 2
    stem: Why, according to the lecture, are some rights protected at the constitutional level?
    options:
      - text: Only constitutional rights can be interpreted by courts.
        why: >-
          Courts interpret statutory and common law rights too; the point is the constitution's place in the hierarchy
          of sources.
      - text: The constitution is the highest source, so its rights resist ordinary legislation.
        correct: true
        why: >-
          Right: the constitution has priority over other sources, even primary legislation, so rights protected there
          resist ordinary majoritarian law-making.
      - text: Constitutional protection makes a right absolute and immune from any form of limitation.
        why: >-
          Tempting, but limitation clauses are themselves constitutional provisions permitting the partial limitation of
          constitutional rights.
      - text: Constitutional rights are universal, whereas statutory rights are not.
        why: >-
          Universality is a feature of human rights, not of constitutional rights as such; a constitutional right need
          not be a human right.
  - key: d10
    type: mcq
    concept: moral-and-legal-rights
    difficulty: 3
    stem: The lecture says that protecting rights against ordinary legislation is "another way of expressing" which tension?
    options:
      - text: The tension between the will theory and the interest theory of rights.
        why: >-
          These are rival accounts of what a right is; they do not concern the relation between constitutional rights
          and majoritarian legislation.
      - text: The tension between first-generation and third-generation human rights.
        why: >-
          The generations differ in content and ease of implementation; constitutional protection against legislation is
          not about that difference.
      - text: The tension between majoritarian (utilitarian) reasoning and rights.
        correct: true
        why: >-
          Right: majoritarian rule expressed through legislation should not interfere with rights whose interests are so
          important, which restates rights against utility.
      - text: The tension between Hohfeld's claim-rights and his privileges.
        why: >-
          Tempting because constitutional rights can be analysed in Hohfeld's terms, but the lecture links this point to
          rights against utilitarian reasoning.
  - key: d11
    type: mcq
    concept: moral-and-legal-rights
    difficulty: 2
    stem: What does the lecture mean by "paper rights"?
    options:
      - text: Rights created by a written contract rather than by a constitution.
        why: >-
          Tempting because contracts are on paper, but the lecture's phrase concerns rights that are recognised and
          never implemented.
      - text: Rights that exist only in morality and have never been written down.
        why: >-
          This is the reverse: paper rights are written down, in constitutions or treaties; what they lack is
          implementation.
      - text: 'Rights recognised but never implemented: law in books, not law in action.'
        correct: true
        why: >-
          Right: recalling the realists' law in books and law in action, the lecture says recognised rights that just
          stay there are only paper rights.
      - text: Rights listed in the UDHR that no state has ever signed up to or ratified.
        why: >-
          The lecture does not use the phrase for unsigned instruments; it is about the gap between recognition and
          implementation.
  - key: d12
    type: mcq
    concept: moral-and-legal-rights
    difficulty: 3
    verify: true
    stem: How does the lecture use Finnis's Natural Law and Natural Rights (1980) on implementation?
    options:
      - text: Finnis argues natural rights need no positive law, since morality enforces itself.
        why: >-
          The lecture uses Finnis for the opposite point: natural lawyers too see that general moral principles need
          translating into positive law.
      - text: 'Even natural lawyers see a gap: authorities must turn moral principles into rules.'
        correct: true
        why: >-
          Right (lecture recording only): Finnis revisits Aquinas's idea that human authorities must determine the
          content of general principles of morality and justice.
      - text: Finnis argues legal rights are nonsense unless they track natural rights exactly.
        why: >-
          Tempting because it inverts Bentham's line, but the lecture attributes no such claim to Finnis; his point
          concerns translating principles into rules.
      - text: Finnis argues implementing rights requires a weight formula for balancing them.
        why: The weight formula is Alexy's, from the proportionality slide; it is not part of the lecture's Finnis point.
  - key: d13
    type: mcq
    concept: moral-and-legal-rights
    difficulty: 2
    verify: true
    stem: >-
