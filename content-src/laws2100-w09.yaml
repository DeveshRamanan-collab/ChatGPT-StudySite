          This reverses the contrast: the earlier documents were national, and the UDHR was an international declaration
          without real binding force.
      - text: Those were national documents; the UDHR puts universality at its centre.
        correct: true
        why: >-
          Right: the earlier documents focused on a particular political community, even when recognising universal
          entitlements; the UDHR centres universality.
      - text: Those listed only third-generation rights; the UDHR listed only first-generation ones.
        why: >-
          Nothing in the materials sorts these documents by generation in this way; the contrast the lecture draws is
          national versus universal.
      - text: Those were secular documents; the UDHR rests on a Catholic natural law tradition.
        why: >-
          Tempting because natural law is one foundation of rights, but the lecture does not tie the UDHR to the
          Catholic tradition.
  - key: e11
    type: mcq
    concept: generations-and-history-of-human-rights
    difficulty: 2
    stem: Why does the lecture say the history of human rights is important?
    options:
      - text: It shows how our understanding of rights developed and raises the question of their foundations.
        correct: true
        why: >-
          Right: history tells us about the development of the idea of rights and their legal recognition, and triggers
          foundational philosophical questions.
      - text: It shows that human rights have always been recognised by every legal system.
        why: >-
          The slavery example shows the opposite: legal systems accepted and regulated slavery, so legal recognition has
          not always been there.
      - text: It proves that rights are ethnocentric and should therefore be abandoned.
        why: >-
          Tempting because the Western history of rights feeds the ethnocentrism critique, but the lecture does not
          conclude that rights should be abandoned.
      - text: It settles which generation of rights has the highest priority over the others.
        why: The generations build upon each other; history does not rank them in priority, and the slides never do.
  - key: e12
    type: mcq
    concept: generations-and-history-of-human-rights
    difficulty: 3
    stem: Why, on the lecture's account, does the UK not have a bill of rights in the US or Canadian sense?
    options:
      - text: It rejected the UDHR in 1948 and has never signed any human rights treaty.
        why: Nothing in the materials says this; the lecture's reason is the UK's constitutional structure.
      - text: It has no codified constitution, and it passed the Human Rights Act in 1998.
        correct: true
        why: >-
          Right: the lecture says the UK lacks a codified constitution like the US, so a bill of rights in that sense
          makes no sense; it passed the HRA in 1998.
      - text: Its courts hold that only natural rights, not legal rights, exist at all.
        why: This inverts Bentham's view and attributes it to UK courts; the lecture says nothing of the kind.
      - text: It adopted the Victorian Charter of 2006 as its model for protecting rights.
        why: >-
          The influence runs the other way: the lecture says the Australian state acts try to replicate the UK Human
          Rights Act.
  - key: e13
    type: mcq
    concept: generations-and-history-of-human-rights
    difficulty: 2
    stem: Which instrument is NOT on the slide's list of human rights treaties under "Human Rights in Australia"?
    options:
      - text: The Convention against Torture (CAT).
        why: CAT is on the slide's list of human rights treaties, with the ICCPR, ICESCR, CRC, CEDAW, CRPD and CERD.
      - text: The European Convention on Human Rights.
        correct: true
        why: >-
          Right: the ECHR appears on the limitation-clause slides (art 15), not in the list of human rights treaties
          under "Human Rights in Australia".
      - text: The Convention on the Rights of Persons with Disabilities (CRPD).
        why: The CRPD is on the slide's treaty list; it is easy to forget because it is not in the history list.
      - text: The Convention on the Elimination of All Forms of Racial Discrimination.
        why: CERD is on the slide's list of human rights treaties, alongside the ICCPR, ICESCR, CRC, CEDAW, CRPD and CAT.
  - key: e14
    type: mcq
    concept: generations-and-history-of-human-rights
    difficulty: 2
    stem: Which of these is a federal Australian law listed on the slide?
    options:
      - text: Human Rights Act 2019 (Qld).
        why: Tempting because it is a human rights statute, but the slide lists it under state laws, not federal laws.
      - text: Charter of Human Rights and Responsibilities Act 2006 (Vic).
        why: This is listed as a state law (Victoria); it is the source of the s 7 limitation clause.
      - text: Racial Discrimination Act 1975.
        correct: true
        why: >-
          Right: the slide lists it among federal laws, with the Age, Disability and Sex Discrimination Acts and the
          Australian Human Rights Commission Act 1986.
      - text: Human Rights Act 1998, from the United Kingdom.
        why: >-
          The UK Human Rights Act 1998 is on the history slide; it is not Australian law, though the state acts imitate
          it.
  - key: e15
    type: mcq
    concept: generations-and-history-of-human-rights
    difficulty: 3
    contrasts-with:
      - moral-and-legal-rights
    stem: >-
      A student writes: "The slide's history list proves human rights did not exist before Magna Carta (1215)." What is
      the best reply?
    options:
      - text: 'Correct: rights exist only once a document records them, so nothing existed before 1215.'
        why: >-
          This equates a right's existence with its written legal recognition, which is precisely what the slavery
          example puts in doubt.
      - text: 'Wrong: the UDHR says that human rights were legally recognised in every era of history.'
        why: >-
          The UDHR says nothing of the kind; it presents itself as a common standard of achievement, a project for the
          future.
      - text: The list dates legal recognition; whether rights existed earlier as moral rights is open.
        correct: true
        why: >-
          Right: the history list records documents; "Have human rights always existed?" remains the foundational
          question about moral rights.
      - text: 'Correct: the slide asks "Have human rights always existed?" and answers it with "no".'
        why: >-
          Tempting because the question is on the slides, but the slides pose it without answering; the lecture treats
          it as an open philosophical question.
  - key: e16
    type: mcq
    concept: generations-and-history-of-human-rights
    difficulty: 2
    stem: Which statement about the generations of rights matches the lecture?
    options:
      - text: Each generation replaced the one before, so first-generation rights are obsolete.
        why: >-
          The lecture says the generations build upon each other; first-generation rights remain so basic we barely
          question them.
      - text: They build upon each other, so content cannot be understood without history.
        correct: true
        why: >-
          Right: the lecture says the literature identifies generations of rights that build upon each other, so we
          cannot think about content without history.
      - text: Only first-generation rights are human rights; the later ones are mere policies.
        why: Tempting because the third generation is problematic, but all three are listed on the slide as human rights.
      - text: They are ranked, so second-generation rights always override first-generation ones.
        why: The slides do not rank the generations by priority; the numbering reflects historical development.
  - key: e17
    type: truefalse
    concept: generations-and-history-of-human-rights
    difficulty: 1
    set: quickfire
    statement: The right to food is a second-generation human right.
    answer: true
    why: >-
      True: the slide lists the right to food among second-generation social, economic and cultural rights, with housing
      and health care.
  - key: e18
    type: truefalse
    concept: generations-and-history-of-human-rights
    difficulty: 1
    set: quickfire
    statement: The Universal Declaration of Human Rights dates from 1966.
    answer: false
    why: >-
      False: the UDHR dates from 1948. 1966 is the date of the ICCPR and the International Covenant on Economic, Social
      and Cultural Rights.
  - key: e19
    type: truefalse
    concept: generations-and-history-of-human-rights
    difficulty: 1
    set: quickfire
    statement: Third-generation human rights include the right to intergenerational equity and sustainability.
    answer: true
    why: 'True: the slide ends its third-generation list with "the right to intergenerational equity and sustainability".'
  - key: e20
    type: short
    concept: generations-and-history-of-human-rights
    difficulty: 3
    prompt: '"Third-generation ''solidarity'' rights are not really human rights." Discuss.'
    model: >-
      Third-generation rights are human rights on the slides' account, but they are the hardest to justify and
      implement, so the claim has a real point without being right. First-generation rights are civil and political
      (life, equality before the law, speech, religion, property, a fair trial, voting); second-generation rights are
      social, economic and cultural (employment, food, housing, health care); third-generation rights are group and
      collective rights such as self-determination, development, a healthy environment, natural resources and
      intergenerational equity. For the claim: human rights are traditionally individual entitlements, universal and
      high-priority, and the lecture accepts that the third generation is more problematic in authority, justification
      and implementation: it is much harder to move from recognising a right to a healthy environment to implementing
      it. Against the claim: the generations build upon each other, group rights such as self-determination are on the
      slides, and difficulty of implementation also afflicts first-generation rights, which can remain paper rights.
      Evaluation: the objection concerns how far these rights can be justified and enforced, not whether they belong in
      the category; it calls for justification, not exclusion.
    rubric:
      - id: r1
        criterion: Thesis — takes a position on whether solidarity rights are human rights.
        marks: 2
        top-band: 'States a qualified thesis: they are human rights, but the hardest to justify and implement.'
        margin-note: Are they or aren't they? Commit.
        authorities: []
      - id: r2
        criterion: Argument — sets out the three generations accurately with examples from the slides.
        marks: 3
        top-band: >-
          Uses the slide lists for each generation and identifies third-generation rights as group and collective
          rights.
        margin-note: 'Accurate lists: good.'
        authorities: []
      - id: r3
        criterion: >-
          Counterargument — gives the sceptic's case at full strength (individual rights; authority, justification,
          implementation).
        marks: 3
        top-band: Uses the lecture's point that the third generation is more problematic, with the healthy environment example.
        margin-note: Strong statement of the other side.
        authorities: []
      - id: r4
        criterion: Evaluation — distinguishes membership of the category from difficulty of justification and implementation.
        marks: 2
        top-band: >-
          Notes that implementation gaps also produce first-generation paper rights, so difficulty does not show
          exclusion.
        margin-note: 'Good distinction: existence versus enforcement.'
        authorities: []
  - key: f01
    type: mcq
    concept: critiques-of-human-rights
    difficulty: 1
    stem: Who called natural rights "nonsense upon stilts"?
    options:
      - text: Jeremy Waldron
        why: >-
          Tempting because Waldron wrote Nonsense Upon Stilts: Bentham, Burke and Marx on the Rights of Man (1988), but
          the phrase itself is Bentham's.
      - text: Jeremy Bentham
        correct: true
        why: >-
          Right: the slide quotes Jeremy Bentham, Anarchical Fallacies, in J. Bowring (ed.), Works, vol. 2 (1843):
          "nonsense upon stilts".
      - text: Robert Alexy
        why: >-
          Alexy appears on the proportionality slide (rules and principles, the weight formula), not on the
          justification slide.
      - text: Wesley Hohfeld
        why: >-
          Hohfeld analysed "right" into four positions; he is not the author of the attack on natural rights quoted on
          the slide.
  - key: f02
    type: mcq
    concept: critiques-of-human-rights
    difficulty: 2
    stem: On the lecture's reading, why does Bentham dismiss natural rights?
    options:
      - text: For him the only rights are legal ones; natural law is wishful thinking.
        correct: true
        why: >-
          Right: the lecture says that for Bentham, with his positivist outlook, the only rights that exist are legal
          rights; natural law is wishful thinking.
      - text: For him rights are trumps, so natural rights would defeat every utilitarian calculation.
        why: >-
          Tempting because Bentham was a utilitarian, but the lecture's point is about which rights exist, not about
          rights as trumps.
      - text: For him rights are ethnocentric, a Western creation imposed on other cultures and peoples.
        why: Ethnocentrism is a separate critique on the same slide; the lecture does not attribute it to Bentham.
      - text: For him natural rights are real, but too selfish to be enforced by the courts of law.
        why: >-
          Bentham does not concede that natural rights are real; calling them nonsense denies their existence
          altogether.
  - key: f03
    type: mcq
    concept: critiques-of-human-rights
    difficulty: 2
    contrasts-with:
      - rights-and-utilitarian-reasoning
    stem: Bentham was a utilitarian. What is the target of his "nonsense upon stilts" line?
    options:
      - text: The weighing of a suspect's rights against lives saved in a ticking-bomb case.
        why: >-
          Tempting because Bentham was a utilitarian, but his line attacks the existence of natural rights, not a
          particular weighing of rights against lives.
      - text: The existence of natural rights outside positive law, not any weighing of rights against utility.
        correct: true
        why: >-
          Right: on the lecture's reading, Bentham denies that natural rights exist at all; only legal rights do. It is
          a claim about what rights there are.
      - text: The use of limitation clauses to restrict constitutional rights in a free society.
        why: Limitation clauses are modern constitutional provisions; Bentham's 1843 quotation is about natural rights.
      - text: The interest theory's focus on the holder's welfare rather than autonomy.
        why: The will/interest debate is about what rights are; Bentham's line concerns whether natural rights exist.
  - key: f04
    type: mcq
    concept: critiques-of-human-rights
    difficulty: 2
    stem: Which is NOT one of the sceptical questions on the slide "Can human rights be justified?"
    options:
      - text: Are rights selfish?
        why: >-
          This is on the slide: the line of criticism that rights focus too much on the individual against the general
          interest.
      - text: Are rights ethnocentric?
        why: 'This is on the slide: the worry that human rights as we know them are a Western creation.'
      - text: Are rights optimisation requirements?
        correct: true
        why: >-
          Right: this borrows Alexy's description of principles from the proportionality slide; it is not one of the
          justification slide's questions.
      - text: Are rights an instrument of oppression?
        why: 'This is on the slide: the critique that rights can be tied to a particular power structure.'
  - key: f05
    type: mcq
    concept: critiques-of-human-rights
    difficulty: 2
    stem: >-
      What is the lecture's response to the worry that rights talk is mere rhetoric, since every entitlement is now
      called a right?
    options:
      - text: It shows that rights should be abandoned in favour of the principle of utility.
        why: >-
          The lecture does not draw this conclusion; it treats the worry as a demand for more care in how rights
          language is used.
      - text: It is mainly a call for better definition and more discipline in rights language.
        correct: true
        why: >-
          Right: if only a few cards are trumps and every claim is called a right, the category loses its point; the
          remedy is definition and discipline.
      - text: It proves that rights are instruments of oppression used by a ruling class.
        why: Tempting because both are critiques of rights, but oppression is a separate line of criticism on the slide.
      - text: It shows that only third-generation rights are genuine human rights.
        why: >-
          Nothing in the lecture's reply singles out the third generation; inflation of rights language affects every
          kind of claim.
  - key: f06
    type: mcq
    concept: critiques-of-human-rights
    difficulty: 2
    stem: The "Are rights selfish?" line of criticism focuses on…
    options:
      - text: the claim that rights are a Western creation.
        why: That is the ethnocentrism critique, a separate question on the slide.
      - text: the tension between individual rights and the general interest.
        correct: true
        why: >-
          Right: the lecture says this criticism focuses on rights favouring the interest of the individual over the
          general interest.
      - text: the difficulty of defining what it means to be a human being.
        why: Tempting because "human nature" is also on the slide, but that is the myth question, not the selfishness one.
      - text: the gap between recognising rights and actually implementing them.
        why: >-
          The recognition–implementation gap (paper rights) is part of implementation, not a reason to call rights
          selfish.
  - key: f07
    type: mcq
    concept: critiques-of-human-rights
    difficulty: 2
    variant-of: f06
    stem: A variation on the "selfish" criticism, in the lecture, stresses…
    options:
      - text: 'duties: we should talk about the duties we have, not only our rights.'
        correct: true
        why: >-
          Right: the lecture says some commentators ask about duties, which may be as important as rights, as human
          beings and as members of a political community.
      - text: 'dignity: rights should rest on human dignity rather than on interests.'
        why: Dignity appears in the foundations of rights, not as a variation of the selfishness critique.
      - text: 'proportionality: rights should always be balanced, never treated as trumps.'
        why: >-
          Tempting because balancing tempers individual rights, but the lecture's variation on selfishness is about
          duties.
      - text: 'positivisation: rights should exist only once they are enacted into law.'
        why: That echoes Bentham's legalistic line; the selfishness variation in the lecture is about duties.
  - key: f08
    type: mcq
    concept: critiques-of-human-rights
    difficulty: 3
    stem: Which critique holds that rights can be connected with a particular power structure?
    options:
      - text: That rights are a threat to the value of community.
        why: The community critique rebalances individual and community; it is not about rights serving a power structure.
      - text: That rights are an instrument of oppression.
        correct: true
        why: >-
          Right: the lecture says this critique sees rights as connected with a particular power structure, and so
          possibly an instrument of oppression.
      - text: That rights are ethnocentric, a creation of the West.
        why: >-
          Tempting because Western dominance can look like power, but this critique concerns cultural translatability,
          not power structures.
      - text: That rights are selfish and favour the individual.
        why: >-
          The selfishness critique sets the individual against the general interest; it does not concern power
          structures.
  - key: f09
    type: mcq
    concept: critiques-of-human-rights
    difficulty: 3
    stem: Which critique stresses the value of the community against individual autonomy?
    options:
      - text: That rights are an instrument of oppression.
        why: This critique ties rights to a power structure; it is not chiefly about community against autonomy.
      - text: That rights are nonsense upon stilts.
        why: Bentham's line denies natural rights exist; it is not a defence of community values.
      - text: That rights threaten the value of community.
        correct: true
        why: >-
          Right: the lecture says individual rights centre individual autonomy, and this critique rebalances the
          relationship between the individual and the community.
      - text: That human nature, and so human rights, are a rhetorical myth.
        why: >-
          Tempting because myth and rhetoric are about rights talk, but this critique is about rights language, not
          community.
  - key: f10
    type: mcq
    concept: critiques-of-human-rights
    difficulty: 3
    stem: >-
      A critic says: "Human rights are articulated in Western concepts that do not translate into other languages and
      worldviews." What reply does the lecture offer?
    options:
      - text: Human rights are legal rights, so cultural differences vanish once a treaty is signed.
        why: >-
          Signing a treaty does not make human rights culturally neutral, and the lecture does not reduce human rights
          to legal rights.
      - text: Meaningful comparison across legal systems suggests common ground behind different expressions.
        correct: true
        why: >-
          Right: we compare how systems recognise rights, and a meaningful comparison needs common ground; different
          expressions do not mean nothing is shared.
      - text: The critic is right, so human rights should be confined to Western legal systems.
        why: >-
          Tempting because the lecture takes the challenge seriously, but it does not accept that rights are merely
          Western or should be confined.
      - text: Ethnocentrism is answered by the weight formula, which makes balancing objective.
        why: Alexy's weight formula formalises balancing in adjudication; it is no answer to the charge of ethnocentrism.
  - key: f11
    type: mcq
    concept: critiques-of-human-rights
    difficulty: 2
    stem: What question does the slide attach to moral objectivism/realism?
    options:
      - text: Are moral disagreements rationally resolvable?
        why: Tempting because the two questions are on the same slide, but this one sits under moral relativism.
      - text: Are moral statements apt for truth and falsity?
        correct: true
        why: 'Right: under "Moral objectivism/realism" the slide asks "Are moral statements apt for truth and falsity?"'
      - text: Are rights a threat to the value of community?
        why: This is one of the sceptical questions on the previous slide about justifying human rights.
      - text: Is the idea of human nature just a myth?
        why: This is the first sceptical question on the justification slide, not the objectivism question.
  - key: f12
    type: mcq
    concept: critiques-of-human-rights
    difficulty: 2
    stem: On the lecture's account, moral relativism holds that…
    options:
      - text: there are moral facts, so moral claims can be true or false.
        why: This is moral objectivism or realism, the position relativism is contrasted with.
      - text: moral values and claims are always relative to a culture or society.
        correct: true
        why: >-
          Right: the lecture describes relativism as the idea that moral values, claims and language are relative to a
          particular culture, society or linguistic universe.
      - text: only legal rights exist, because only they can be enforced in court.
        why: >-
          Tempting because both are sceptical, but this is the lecture's reading of Bentham, a claim about rights, not
          about morality's relativity.
      - text: rights are justified by the greatest happiness of the greatest number.
        why: This is the principle of utility, a normative standard, not the relativist thesis about moral claims.
  - key: f13
    type: mcq
    concept: critiques-of-human-rights
    difficulty: 3
    stem: Which distinction does the slide draw within moral relativism?
    options:
      - text: Act v rule relativism.
        why: Act versus rule is a distinction within utilitarianism (as the lecture describes it), not within relativism.
      - text: Metaethical v normative relativism.
        correct: true
        why: 'Right: the slide lists "The distinction between metaethical and normative relativism" under moral relativism.'
      - text: Negative v positive relativism.
        why: >-
          Tempting because negative and positive rights are on the Hohfeld slide, but there is no such distinction
          within relativism.
      - text: Moral v legal relativism.
        why: Moral versus legal is the authority issue (moral or legal rights?), not a distinction within relativism.
  - key: f14
    type: mcq
    concept: critiques-of-human-rights
    difficulty: 3
    stem: The lecture distinguishes two levels of moral discourse. Which pair is it?
    options:
      - text: The claim that an action is moral or immoral, and the meta-claim about that language.
        correct: true
        why: >-
          Right: the lecture separates the first-order claim about an action from the meta-claim about moral language,
          eg whether it can be true or false.
      - text: The claim that a right is a moral right, and the claim that it is also a legal right.
        why: >-
          Moral versus legal rights is the authority question; the two levels of discourse concern moral language
          itself.
      - text: The claim of a majority, and the claim of a minority within the same community.
        why: >-
          The majority and minority appear in the religion example on utilitarian reasoning, not in the levels of moral
          discourse.
      - text: The claim of social morality, and the claim of the positive law that enforces it.
        why: >-
          Tempting because the lecture also contrasts social morality with a deeper morality, but that is a different
          distinction from the two levels.
  - key: f15
    type: mcq
    concept: critiques-of-human-rights
    difficulty: 3
    stem: Why does the lecture connect the justification of rights with moral relativism and objectivism?
    options:
      - text: Because relativism proves that rights are only legal rights, which settles their authority.
        why: >-
          Relativism makes moral claims relative; it does not prove rights are only legal, and the lecture leaves
          authority open.
      - text: Because objectivism requires every right to be absolute and immune from limitation.
        why: Objectivism is about whether moral claims can be true; it does not dictate that rights cannot be limited.
      - text: Because the debates about rights boil down to the nature of morality.
        correct: true
        why: >-
          Right: the lecture says discussions of the value of rights and their tension with utility really boil down to
          questions about the nature of morality.
      - text: Because the UDHR officially adopts moral relativism as its underlying philosophy.
        why: >-
          Tempting given the UDHR's universality debate, but the UDHR adopts no such philosophy, and universality sits
          awkwardly with relativism.
  - key: f16
    type: mcq
    concept: critiques-of-human-rights
    difficulty: 2
    stem: Which readings does the slide point to on moral relativism and objectivism?
    options:
      - text: The chapters by Wong and Trigg.
        correct: true
        why: >-
          Right: the slide says "On moral relativism and objectivism, see the chapters by Wong and Trigg in the reading
          list".
      - text: Besson's chapter on human rights and constitutional law.
        why: >-
          Besson's chapter is recommended on the implementation slide, for the relation between international and
          domestic human rights regimes.
      - text: 'Waldron, The Law: Theory and Practice in British Politics.'
        why: >-
          Tempting because Waldron's chapter is the week's main reading, but it is about rights and utilitarian
          reasoning, not relativism.
      - text: Bentham, Anarchical Fallacies, in Bowring's Works.
        why: >-
          Bentham's Anarchical Fallacies is the source of the "nonsense upon stilts" quotation, not a reading on
          relativism.
  - key: f17
    type: truefalse
    concept: critiques-of-human-rights
    difficulty: 1
    set: quickfire
    statement: Bentham's "nonsense upon stilts" is aimed at natural rights.
    answer: true
    why: >-
      True: the quotation reads "Natural rights is simple nonsense: natural and imprescriptible rights, rhetorical
      nonsense – nonsense upon stilts."
  - key: f18
    type: truefalse
    concept: critiques-of-human-rights
    difficulty: 2
    set: quickfire
    statement: On the slide, "Are moral disagreements rationally resolvable?" is listed under moral objectivism, not relativism.
    answer: false
    why: >-
      False: it is listed under moral relativism. Under objectivism/realism the slide asks whether moral statements are
      apt for truth and falsity.
  - key: f19
    type: truefalse
    concept: critiques-of-human-rights
    difficulty: 1
    set: quickfire
    statement: >-
      The lecture treats the "rights are mere rhetoric" worry mainly as a call for better definition and discipline in
      rights language.
    answer: true
    why: >-
      True: the lecture says this line of criticism is mainly a requirement for a better definition of rights and more
      discipline in using rights language.
  - key: f20
    type: short
    concept: critiques-of-human-rights
    difficulty: 3
    prompt: '"Bentham was right: natural rights are nonsense upon stilts." Discuss.'
    model: >-
      Bentham is right that natural rights need more support than assertion, but wrong that only legal rights exist.
      Bentham calls natural rights "simple nonsense … nonsense upon stilts"; on the lecture's reading, as a utilitarian
      with a positivist outlook he holds that only legal rights, enforceable in court, exist, and natural law is wishful
      thinking. His view is strengthened by the other sceptical questions: rights talk can be mere rhetoric, rights can
      look selfish, can serve a power structure, can threaten community, and may be ethnocentric. Against him, the
      slavery example shows the cost of his position: where positive law accepted slavery, enslaved people had no legal
      right not to be enslaved, yet we want to say they had a moral right, and that positive law's silence does not mean
      the moral requirement did not exist. Natural law, deontological principles and human dignity offer foundations.
      Evaluation: whether those foundations hold depends on the nature of morality: if moral statements are apt for
      truth and falsity (objectivism), moral rights can be more than wishful thinking; if relativism wins, Bentham's
      challenge stands.
    rubric:
      - id: r1
        criterion: Thesis — takes a position on Bentham's claim and states it at the outset.
        marks: 2
        top-band: Separates the fair demand for justification from the stronger claim that only legal rights exist.
        margin-note: Right about what, wrong about what?
        authorities: []
      - id: r2
        criterion: Argument — explains Bentham's position accurately and charitably.
        marks: 3
        top-band: 'Quotes the passage and explains its basis: only legal rights exist; natural law is wishful thinking.'
        margin-note: Bentham at full strength.
        authorities:
          - bentham-anarchical-fallacies
      - id: r3
        criterion: Counterargument — uses the slavery example and the foundations of rights.
        marks: 3
        top-band: >-
          Shows that denying moral rights makes it impossible to say slaves were wronged in a rights sense, then names
          candidate foundations.
        margin-note: 'The slavery example bites: good.'
        authorities: []
      - id: r4
        criterion: Evaluation — links the outcome to relativism versus objectivism.
        marks: 2
        top-band: Concludes that the dispute turns on whether moral statements are apt for truth and falsity.
        margin-note: Strong zoom out to metaethics.
        authorities: []
  - key: g01
    type: mcq
    concept: limitation-clauses-and-proportionality
    difficulty: 1
    set: pretest
    stem: What are limitation clauses, according to the slides?
    options:
      - text: Provisions permitting the partial limitation of some constitutional rights.
        correct: true
        why: >-
          Right: the slide defines limitation clauses as "constitutional provisions that permit the partial limitation
          of some constitutional rights".
      - text: Treaty provisions forbidding any limitation of human rights in any circumstances.
        why: >-
          Tempting because ECHR art 15(2) bars some derogations, but limitation clauses permit limits; they do not
          forbid them all.
      - text: Statutes listing the rights that Parliament may abolish by ordinary legislation.
        why: >-
          Limitation clauses permit partial limits under conditions; they do not authorise abolishing rights, and Vic s
          7(3) forbids destroying them.
      - text: Judicial doctrines confining constitutional rights to the citizens of the state.
        why: >-
          Nothing on the slides links limitation clauses to citizenship; they concern the conditions for limiting
          rights.
  - key: g02
    type: mcq
    concept: limitation-clauses-and-proportionality
    difficulty: 1
    stem: Under s 1 of the Canadian Charter, the rights and freedoms are guaranteed subject only to…
    options:
      - text: such limits as Parliament considers necessary in the general interest.
        why: >-
          Tempting because limits often serve the general interest, but s 1 requires limits "prescribed by law" and
          "demonstrably justified", not Parliament's view alone.
      - text: such limits as are strictly required in a time of war or public emergency.
        why: >-
          This echoes ECHR art 15(1) on derogation in emergencies; the Canadian clause is not confined to war or
          emergency.
      - text: such reasonable limits prescribed by law as can be demonstrably justified in a free and democratic society.
        correct: true
        why: 'Right: these are the words of s 1, the model the Victorian Charter s 7(2) echoes.'
      - text: such limits as international law expressly permits for that particular right.
        why: Section 1 says nothing about international law; that is closer to South Africa's s 39(1) on interpretation.
  - key: g03
    type: mcq
    concept: limitation-clauses-and-proportionality
    difficulty: 2
    stem: Under ECHR art 15(1), when may a Party derogate from its Convention obligations?
    options:
      - text: In war or public emergency threatening the life of the nation, as strictly required.
        correct: true
        why: >-
          Right: art 15(1) allows derogation in time of war or other public emergency threatening the life of the
          nation, to the extent strictly required.
      - text: Whenever a limit is demonstrably justified in a free and democratic society.
        why: This is the language of the Canadian and Victorian limitation clauses, not of the ECHR's emergency derogation.
      - text: Whenever its parliament passes a law expressly overriding the Convention.
        why: Art 15 contains no such override; derogation depends on war or public emergency and is limited by art 15(2).
      - text: Only with the prior consent of the Secretary General of the Council of Europe.
        why: >-
          Tempting because art 15(3) involves the Secretary General, but it requires keeping him or her fully informed,
          not seeking consent.
  - key: g04
    type: mcq
    concept: limitation-clauses-and-proportionality
    difficulty: 2
    stem: Which right does ECHR art 15(2) put beyond derogation?
    options:
      - text: The right to a fair trial.
        why: >-
          Tempting because a fair trial is a basic civil right, but art 15(2) names only arts 2, 3, 4(1) and 7; a fair
          trial is not among them.
      - text: The prohibition of torture (art 3).
        correct: true
        why: >-
          Right: art 15(2) says no derogation from Article 3 [Prohibition of torture], along with arts 2 (save lawful
          acts of war), 4(1) and 7.
      - text: Freedom of expression.
        why: >-
          Freedom of expression is not named in art 15(2), which lists only life, torture, slavery or servitude, and no
          punishment without law.
      - text: The right to vote in elections.
        why: Voting is not named in art 15(2); the non-derogable list is confined to arts 2, 3, 4(1) and 7.
  - key: g05
    type: mcq
    concept: limitation-clauses-and-proportionality
    difficulty: 3
    stem: ECHR art 15(2) carries one express exception for the right to life. What is it?
    options:
      - text: Deaths resulting from the use of force in self-defence.
        why: >-
          Tempting because it sounds like a familiar exception, but the words of art 15(2) speak only of lawful acts of
          war.
      - text: Deaths resulting from lawful acts of war.
        correct: true
        why: >-
          Right: art 15(2) says no derogation from art 2 "except in respect of deaths resulting from lawful acts of
          war".
      - text: Deaths resulting from a lawful sentence imposed by a court.
        why: Art 15(2) says nothing about court sentences; its only exception for the right to life is lawful acts of war.
      - text: Deaths resulting from any declared state of public emergency.
        why: >-
          A public emergency triggers art 15(1), but art 15(2) still bars derogation from the right to life, save for
          lawful acts of war.
  - key: g06
    type: mcq
    concept: limitation-clauses-and-proportionality
    difficulty: 2
    stem: Which factor is NOT listed in s 7(2) of the Victorian Charter?
    options:
      - text: The importance of the purpose of the limitation.
        why: >-
          This is factor (b) of s 7(2); the importance of the limitation's purpose is weighed in judging whether it is
          justified.
      - text: The nature and extent of the limitation.
        why: 'This is factor (c) of s 7(2): how far and in what way the right is limited.'
      - text: Whether the limit yields the greatest happiness for the greatest number.
        correct: true
        why: >-
          Right: this is the principle of utility, not a s 7(2) factor; the section lists the nature of the right,
          purpose, extent, relationship and less restrictive means.
      - text: Any less restrictive means reasonably available.
        why: This is factor (e) of s 7(2), the counterpart of the necessity stage in Alexy's test.
  - key: g07
    type: mcq
    concept: limitation-clauses-and-proportionality
    difficulty: 2
    stem: >-
      A Victorian law limits a human right, but the government could have achieved the same purpose with a much milder
      measure. Which s 7(2) factor is most directly engaged?
    options:
      - text: (a) the nature of the right.
        why: The nature of the right matters in every case; the facts here point to the availability of a milder measure.
      - text: (b) the importance of the purpose of the limitation.
        why: >-
          Tempting because purpose is always relevant, but the facts concern the means chosen, not the importance of the
          purpose.
      - text: (d) the relationship between the limitation and its purpose.
        why: >-
          This asks how the limit relates to the purpose; the facts stress a milder alternative, which is a separate
          listed factor.
      - text: (e) any less restrictive means.
        correct: true
        why: >-
          Right: s 7(2)(e) directs attention to "any less restrictive means reasonably available to achieve the
          purpose".
  - key: g08
    type: mcq
    concept: limitation-clauses-and-proportionality
    difficulty: 2
    stem: For Alexy, what are principles?
    options:
      - text: Definitive commands that apply in an all-or-nothing fashion.
        why: >-
          Tempting because it is the other half of Alexy's distinction, but definitive commands are his rules, not
          principles.
      - text: Optimisation requirements, realised as far as possible.
        correct: true
        why: >-
          Right: Alexy calls principles optimisation requirements, to be realised to the greatest extent possible given
          legal and factual constraints.
      - text: Standards that set out a goal, such as an economic improvement.
        why: This is Dworkin's definition of a policy (week 5), not Alexy's account of principles.
      - text: Rules of recognition that identify valid law by its pedigree.
        why: This is Hart's rule of recognition; it has nothing to do with Alexy's principles as optimisation requirements.
  - key: g09
    type: mcq
    concept: limitation-clauses-and-proportionality
    difficulty: 2
    stem: Why, for Alexy, is proportionality necessarily connected to adjudicating constitutional rights?
    options:
      - text: Because constitutions always contain an express proportionality clause for rights.
        why: >-
          Tempting because many limitation clauses invite proportionality, but Alexy's claim is conceptual, not about
          express clauses.
      - text: Because rights are rules, and rules apply in an all-or-nothing way when they conflict.
        why: >-
          This reverses Alexy: if rights were rules (definitive commands) there would be nothing to weigh; his claim is
          that rights are principles.
      - text: Because rights are principles, which must be optimised against one another.
        correct: true
        why: >-
          Right: rights are principles, principles will conflict, and optimising them requires proportionality; the
          lecture notes many disagree.
      - text: Because courts must defer to the legislature's view of the general interest.
        why: Deference is not part of Alexy's argument; proportionality is a structured test the court itself applies.
  - key: g10
    type: mcq
    concept: limitation-clauses-and-proportionality
    difficulty: 1
    stem: What are the three parts of Alexy's proportionality test, in order?
    options:
      - text: Necessity, then suitability, then balancing of benefits against harms.
        why: >-
          Tempting because the parts are right, but the order is wrong: suitability comes first, then necessity, then
          balancing.
      - text: Suitability, necessity, proportionality in the narrow sense.
        correct: true
        why: >-
          Right: suitability (capable of achieving the aim), necessity (no less restrictive means), then balancing
          (benefits outweigh the detriment).
      - text: Legality, legitimacy, and then the weight formula for balancing.
        why: Legality and legitimacy are not the slide's stages; the weight formula belongs within the balancing stage.
      - text: Balancing first, then necessity, then suitability of the legitimate aim.
        why: This reverses the slide's order; balancing (proportionality in the narrow sense) is the final stage.
  - key: g11
    type: mcq
    concept: limitation-clauses-and-proportionality
    difficulty: 2
    stem: A measure restricting protest cannot in fact reduce the harm it targets. Which stage of Alexy's test does it fail?
    options:
      - text: Suitability.
        correct: true
        why: >-
          Right: suitability requires that the measure be capable of achieving the legitimate aim; a measure that cannot
          reduce the harm fails here.
      - text: Necessity.
        why: >-
          Necessity asks whether a less restrictive means exists; a measure that cannot achieve its aim fails earlier,
          at suitability.
      - text: Balancing.
        why: Balancing is the final stage; a measure that cannot achieve its aim does not get that far.
      - text: 'None: only the weight formula applies to protest.'
        why: >-
          Tempting because the weight formula formalises balancing, but it applies only in the balancing stage, after
          suitability and necessity.
  - key: g12
    type: mcq
    concept: limitation-clauses-and-proportionality
    difficulty: 2
    variant-of: g11
    stem: A measure achieves its aim, but an equally effective and less restrictive option exists. Which stage does it fail?
    options:
      - text: Suitability.
        why: The measure does achieve its aim, so it is suitable; the problem is the existence of a less restrictive means.
      - text: Proportionality in the narrow sense.
        why: Balancing comes last; the measure fails before then because a less restrictive means exists.
      - text: Necessity.
        correct: true
        why: 'Right: necessity requires that there be no less restrictive means to achieve the same goal.'
      - text: 'It passes: effectiveness is all the test asks.'
        why: >-
          Tempting if you stop at suitability, but the test has three stages and effectiveness alone satisfies only the
          first.
  - key: g13
    type: mcq
    concept: limitation-clauses-and-proportionality
    difficulty: 3
    variant-of: g11
    stem: >-
      A measure is suitable and necessary, but its detriment to the right outweighs its benefits. What is the result
      under Alexy's test?
    options:
      - text: It passes, because suitability and necessity are together sufficient.
        why: >-
          Tempting because it has survived two stages, but balancing is the third, and here the detriment outweighs the
          benefits.
      - text: It fails balancing.
        correct: true
        why: >-
          Right: proportionality in the narrow sense requires the benefits of the measure to outweigh the detriment to
          the right infringed.
      - text: It fails necessity, because a less harmful measure must therefore exist.
        why: 'The facts say it is necessary: no less restrictive means exists. A heavy detriment is a balancing problem.'
      - text: It fails suitability, because harmful measures cannot achieve their aims.
        why: The facts say it is suitable; how harmful a measure is does not decide whether it can achieve its aim.
  - key: g14
    type: mcq
    concept: limitation-clauses-and-proportionality
    difficulty: 2
    stem: What does Alexy's weight formula consider?
    options:
      - text: The number of people affected and the total happiness produced.
        why: >-
          Tempting because balancing sounds like counting, but aggregating happiness is the principle of utility, not
          Alexy's formula.
      - text: Intensity of interference, importance of the competing principle, and certainty about these.
        correct: true
        why: >-
          Right: the slide says the formula considers the intensity of interference, the importance of the competing
          principle and the degree of certainty about these factors.
      - text: The source of the right, its generation and its date of recognition.
        why: Sources, generations and dates belong to the authority, content and history issues, not to the weight formula.
      - text: Whether the right is a claim, privilege, power or immunity.
        why: These are Hohfeld's positions; the weight formula is about balancing competing principles.
  - key: g15
    type: mcq
    concept: limitation-clauses-and-proportionality
    difficulty: 3
    contrasts-with:
      - rights-and-utilitarian-reasoning
    stem: How does Alexy's balancing differ from act-utilitarian reasoning about a right?
    options:
      - text: 'It is identical: both simply add up the happiness of everyone affected.'
        why: >-
          Tempting because both weigh, but the weight formula weighs principles by intensity of interference and
          importance, not aggregated happiness.
      - text: It treats the right as a principle and weighs the interference with it.
        correct: true
        why: >-
          Right: the right is an optimisation requirement, and the formula weighs the intensity of interference against
          the importance of the competing principle.
      - text: It treats the right as a trump that can never be outweighed by anything at all.
        why: A trump would rule out balancing; Alexy's test allows a justified limit to stand after balancing.
      - text: It looks only at the consequences of the measure and never at the right itself.
        why: >-
          The weight formula looks at the intensity of interference with the right, so the right is central, not
          ignored.
  - key: g16
    type: mcq
    concept: limitation-clauses-and-proportionality
    difficulty: 3
    stem: Why does the lecture compare limitation clauses with defeasibility (week 7)?
    options:
      - text: Because limitation clauses make rights defeasible only during war or public emergency.
        why: >-
          Limitation clauses are not confined to emergencies (the Canadian and Victorian clauses are general); the
          comparison concerns exceptions piling up.
      - text: Because Alexy's proportionality test is just Hart's "unless" clause under another name.
        why: >-
          Tempting because both concern exceptions, but the lecture does not equate Alexy's test with Hart's point about
          "unless".
      - text: Because both show that rights become absolute once they are enacted into law.
        why: 'The comparison points the other way: limits and exceptions chip away at rules and rights.'
      - text: Pile up limits and, like exceptions to a rule, they may chip the right away.
        correct: true
        why: >-
          Right: keep finding exceptions and you chip away the whole rule; find enough limitations and you may ask what
          having the right even means.
  - key: g17
    type: mcq
    concept: limitation-clauses-and-proportionality
    difficulty: 3
    stem: On the lecture's account, what does ECHR art 15(2) suggest about absolute rights?
    options:
      - text: It settles that no Convention right is absolute, since all may be limited in war.
        why: >-
          Art 15(2) bars derogation from certain rights even in war, so it does not show that every right may be
          limited.
      - text: There is a debate about whether its non-derogable rights are a kind of absolute right.
        correct: true
        why: >-
          Right: the lecture says there is a debate on whether art 15(2) recognises some Convention rights as rights
          that cannot be derogated from, a kind of absolute right.
      - text: It shows that every Convention right is absolute and can never be limited.
        why: >-
          Art 15(1) permits derogation from the other obligations in emergencies, so not every right is beyond
          limitation.
      - text: It shows that only the right to life is absolute, with no exceptions at all.
        why: >-
          Tempting because life is listed first, but art 15(2) gives the right to life an express exception (lawful acts
          of war).
  - key: g18
    type: truefalse
    concept: limitation-clauses-and-proportionality
    difficulty: 1
    set: quickfire
    statement: >-
      Section 7(2) of the Victorian Charter refers to a free and democratic society based on human dignity, equality and
      freedom.
    answer: true
    why: >-
      True: s 7(2) allows only reasonable limits "demonstrably justified in a free and democratic society based on human
      dignity, equality and freedom".
  - key: g19
    type: truefalse
    concept: limitation-clauses-and-proportionality
    difficulty: 1
    set: quickfire
    statement: Under ECHR art 15(2), a Party may derogate from art 7 (no punishment without law) in a public emergency.
    answer: false
    why: >-
      False: art 15(2) says no derogation from art 7 [No punishment without law], nor from arts 3 and 4(1), nor from art
      2 save for lawful acts of war.
  - key: g20
    type: short
    concept: limitation-clauses-and-proportionality
    difficulty: 3
    prompt: >-
      "There are no absolute human rights: every right can be limited if the reasons are good enough." Discuss, with
      reference to limitation clauses and Alexy.
    model: >-
      Most rights can be limited, but the materials resist the claim that every right can. Limitation clauses permit the
      partial limitation of some constitutional rights: the Canadian Charter s 1 allows "reasonable limits prescribed by
      law as can be demonstrably justified in a free and democratic society", and the Victorian Charter s 7(2) adds
      factors including the importance of the purpose and any less restrictive means. Alexy explains why: rights are
      principles, optimisation requirements realised as far as legal and factual constraints allow, so limits are tested
      by suitability, necessity and balancing, with the weight formula formalising the last stage. On the other side,
      ECHR art 15(2) bars derogation from arts 2 (save lawful acts of war), 3, 4(1) and 7 even in public emergency, and
      some argue the prohibition of torture can never be limited. Victoria's s 7(3) also forbids destroying rights. And
      the defeasibility worry shows the cost of unlimited limits: pile them up and the right may lose its meaning. So
      the claim fails as stated: some rights resist even good reasons, and that is what gives having a right its point.
    rubric:
      - id: r1
        criterion: Thesis — answers whether any human right is absolute.
        marks: 2
        top-band: States at once that most rights are limitable but some resist limitation, and why that matters.
        margin-note: All, most, or none? Commit.
        authorities: []
      - id: r2
        criterion: Argument — uses the limitation clauses and Alexy's test accurately.
        marks: 3
        top-band: Quotes Canadian s 1, uses Victorian s 7(2) factors and sets out suitability, necessity and balancing.
        margin-note: Accurate statutory language.
        authorities:
          - canadian-charter-of-rights-and-freedoms-s1
          - charter-of-human-rights-and-responsibilities-act-2006-vic-s7
          - alexy-proportionality
      - id: r3
        criterion: Counterargument — uses ECHR art 15(2) and the debate on absolute rights.
        marks: 3
        top-band: Lists the non-derogable rights with the lawful-acts-of-war exception and the torture argument.
        margin-note: Good use of art 15(2).
        authorities:
          - echr-art-15
      - id: r4
        criterion: Evaluation — uses the defeasibility worry to judge what follows.
        marks: 2
        top-band: >-
          Argues that a right limitable for any good reason risks losing its meaning, linking back to rights against
          utility.
        margin-note: Strong link to defeasibility (week 7).
        authorities: []
pretest:
