week_file:
  topic: Rights and human rights
  summary: >-
    Week 9 asks what a right is through six issues about human rights: their nature, authority, content, history,
    justification and implementation. It sets the will theory against the interest theory, breaks 'right' into Hohfeld's
    four positions, and tests rights against utilitarian reasoning (trumps or shields, the ticking bomb, Waldron). It
    closes on how moral rights become legal rights, the sceptical case against rights, and how limitation clauses and
    Alexy's proportionality test limit them.
  source-note: >-
    Built from the Week 9 lecture slides and the Echo360 transcript of the 2025 lecture recording on rights; the
    recording's remarks about last year's exam were left out. Points marked † come from the recording alone (not the
    slides) and should be verified.
  notes: >
    ## Six issues


    The concept of a right is one of the key concepts in law: we use it all the time to articulate claims and
    entitlements that we feel or know are enforceable in a court of law. This week thinks about the different meanings
    of "right" through human rights. Rights and human rights are not the same idea, but human rights are rights, and
    they force us to think in a different way about the relationship between law and morality.


    **Part A**


    1. Identity – What is (the nature of) a human right?

    2. Authority – What is the source of human rights and their authority?

    3. Content – What are the fundamental interests protected by human rights?


    **Part B**


    4. History – Have human rights always existed?

    5. Justification – What is the philosophical foundation of our HR regime(s)?

    6. Implementation – How can human rights be recognised and observed?


    Some key concepts: utilitarian reasoning v deontological reasoning; the four Hohfeldian incidents/elements (claim,
    privilege, power and immunity); negative and positive rights; natural law and positive law; generations of human
    rights; moral relativism v moral objectivism; limitation clauses; proportionality analysis. Implementation is in a
    sense the most interesting question from a doctrinal point of view, but to engage with it we need a sense of how we
    could answer the other questions first. Points marked † come from the 2025 lecture recording only and are not on the
    slides: verify them before relying on them.


    ## The idea of human rights


    - Human rights are rights and freedoms that belong to all human beings – regardless of race, sex, nationality,
    ethnicity, language, religion, or any other status.

    - Human rights include, for example, the right to life and liberty, freedom from slavery and torture, freedom of
    opinion and expression, the right to work and education.

    - Bill of Rights in domestic law and National Constitutions.


    :::statute

    Universal Declaration of Human Rights (1948): "The General Assembly proclaims this Universal Declaration of Human
    Rights as a common standard of achievement for all peoples and all nations, to the end that every individual and
    every organ of society, keeping this Declaration constantly in mind, shall strive by teaching and education to
    promote respect for these rights and freedoms and by progressive measures, national and international, to secure
    their universal and effective recognition and observance…"

    :::


    The lecture: the UDHR was mainly a political document, a declaration without real binding force, developed after the
    experience of the Second World War. "A common standard of achievement" makes it a project; the stress falls first on
    teaching and education, not on legal enforcement; "progressive measures" signals a long journey at both the national
    and the international level. Recognition and observance are two different ideas: recognition first, then observance,
    which is where legal enforcement becomes more important.


    ## 1. The nature of human rights


    Human rights are rights, so we first need a view of what rights are. Many legal rights exist not because they are
    human rights but because we create them: if you and I sign a contract, we will have a number of rights and
    obligations. The literature mainly discusses two theories, which are in fact families of theories:


    - **Will theory**: a person has a right if they have control or choice over whether others must or must not act in
    certain ways; rights are seen as tools for exercising free will (autonomy).

    - **Interest theory**: a person has a right if it serves to protect an important interest; rights are justified by
    the role they play in promoting or safeguarding well-being (welfare).


    The will theory has been criticised for focusing too much on control. Some individuals cannot exercise choice in the
    way you and I can: think of an infant. Does that mean they don't have any rights? The interest theory focuses not on
    the autonomy of the individual but on their welfare.


    Human rights are also **plural** (the set of human rights is a subset of rights, so how do we identify it?),
    **universal** (a contract binds only its parties; human rights claim to apply to each and every human being) and
    **high-priority**. Constitutional rights also have priority over other legal requirements, but a right can be a
    constitutional right without being a human right, and a human right need not be a constitutional right.


    ## Priority: trumps or shields?


    - Human rights have priority over the "general interest".

    - Do (human) rights work as "trumps" or "shields"? In the lecture, Dworkin† argues that rights are like trumps, the
    high-priority card in a card game; Schauer† argues that they work more like shields, protecting individuals from
    interference by other claims or requirements. Either way, rights disrupt a certain kind of reasoning.

    - A true commitment to human rights is incompatible with a certain type of utilitarian reasoning.

    - Act-utilitarianism and the principle of utility (the greatest happiness for the greatest number).


    Utilitarianism is a form of consequentialism: the moral value of an action is decided in light of its consequences.
    Is lying morally acceptable? A consequentialist needs more information: in some situations the consequences of lying
    would be desirable, so lying may be permitted or even morally correct. A utilitarian then needs a standard for
    evaluating those consequences, and that standard is the principle of utility.


    ## Human rights qua rights: Hohfeld


    Wesley Newcomb Hohfeld (1879 – 1918) identifies four (4) different legal positions within the concept of a "right":
    (i) claim, (ii) privilege, (iii) power, and (iv) immunity.


    :::definition

    - X has a **claim-right** against Y with respect to φ if and only if Y is under a duty to X to φ.

    - X has a **privilege** to φ if and only if X has no duty not to φ.

    - X has a (normative) **power** over Y if and only if X has the ability to alter (through volitional action) Y's
    normative position.

    - X holds an **immunity** against Y (in respect of X's normative position), if and only if Y lacks the ability to
    alter X's Hohfeldian incidents.

    :::


    Negative and positive rights: consider the difference between "freedom from" and "freedom to".


    The Hohfeld slide was not shown in the 2025 recording, so this section rests on the slide alone.


    ## Human rights qua human rights


    :::statute

    Universal Declaration of Human Rights, art 2: "Everyone is entitled to all the rights and freedoms set forth in this
    Declaration, without distinction of any kind, such as race, colour, sex, language, religion, political or other
    opinion, national or social origin, property, birth or other status."

    :::


    - Human rights are entitlements that capture and protect our fundamental interests as human beings.

    - The idea of humanity.

    - Individual and group rights (e.g., the right to self-determination).


    The lecture: this moral intuition rests on an understanding of what it means to be human, which is hard to define.
    Unless we boil it down to biology, where do we draw the line, given our similarity to other species, or to human
    artefacts such as robots with an intelligence comparable to ours? The idea of human rights was developed around
    individual rights, but groups also claim collective rights; the right to self-determination is a clear example.


    ## 2. The authority of human rights


    **Moral vs legal rights**


    - Are human rights moral rights, legal rights, or both?

    - Are there authoritative sources for human rights?


    Whether they are moral, legal or both, there is a question about why they are authoritative. For legal rights the
    answer may be easier, because we may find authoritative legal sources: many constitutions (though not the Australian
    Constitution) include a Bill of Rights, so rights are recognised in a source high in the hierarchy of legal sources.
    These questions bring us back to the relationship between law and morality.


    **Legal sources and legal interpretation**


    :::statute

    Constitution of the Republic of South Africa, s 39(1): "When interpreting the Bill of Rights, a court, tribunal or
    forum (a) must promote the values that underlie an open and democratic society based on human dignity, equality and
    freedom; (b) must consider international law; and (c) may consider foreign law."

    :::


    **Absolute vs limited rights**: are there any absolute human rights? Or is it always possible to limit a right? (See
    limitation clauses below.)


    ## 3. The content of human rights


    - **First-generation** human rights are civil and political rights, e.g.: the right to life, equality before the
    law, freedom of speech, freedom of religion, property rights, the right to a fair trial, and voting rights.

    - **Second-generation** human rights are social, economic, and cultural rights, e.g.: the right to be employed
    (under just conditions), the right to food, the right to housing, and the right to health care.

    - **Third-generation** human rights include group and collective rights (some commentators call these rights
    'solidarity human rights'), e.g.: the right to self-determination, the right to economic and social development, the
    right to a healthy environment, the right to natural resources, and the right to intergenerational equity and
    sustainability.


    The lecture: the literature identifies generations of rights that build upon each other, so we cannot think about
    content without the history. First-generation rights seem so basic that we don't feel we have to question them,
    though we should appreciate the reasons behind them; many are recognised in our legal system even where they are not
    protected at the constitutional level. The third generation is more problematic in terms of authority, justification
    and implementation: it is much more difficult to move from recognising a right to a healthy environment or to
    natural resources to implementing it.


    ## 4. A bit of history…


    - Magna Carta (1215) and English Bill of Rights (1689)

    - Constitution of the United States (1789) and US Bill of Rights (1791)

    - French Declaration of the Rights of Man and of the Citizen (1789)

    - Universal Declaration of Human Rights (1948)

    - International Covenant on Civil and Political Rights (1966)

    - International Covenant on Economic, Social and Cultural Rights (1966)

    - Convention on the Elimination of All Forms of Discrimination against Women (1979)

    - Convention on the Rights of the Child (1989)

    - UK Human Rights Act 1998 (HRA)


    History matters for two reasons: it tells us how our understanding of rights developed, and it raises a
    philosophical question about the foundations of rights. Think of a time when slavery was accepted both morally and
    legally. Did enslaved people have a right not to be enslaved? Not a legal right: the legal system accepted and
    regulated slavery. But one could say they still had a moral right. That positive law does not recognise a moral
    requirement does not mean the requirement does not exist; the moral claim then needs a moral justification. Many now
    see freedom from slavery as an absolute right, which flies in the face of our history.


    The US Constitution and the French Declaration are connected with the American and French Revolutions, the
    Enlightenment and European modernity; they were national documents, even where they recognised rights as universal
    entitlements. The UDHR, after the Second World War, puts universality at the centre, and through the second half of
    the 20th century human rights were recognised at the international level in covenants and treaties. The UK has no
    codified constitution, so it does not have a bill of rights in the US or Canadian sense; it passed the Human Rights
    Act in 1998.


    ## Human rights in Australia


    - Australian laws and institutions (plus ad hoc bodies, such as the Australian Human Rights Commission).

    - Federal laws: Age Discrimination Act 2004; Disability Discrimination Act 1992; Racial Discrimination Act 1975; Sex
    Discrimination Act 1984; Australian Human Rights Commission Act 1986.

    - State laws: Human Rights Act 2019 (Qld); Charter of Human Rights and Responsibilities Act 2006 (Vic).

    - Human rights treaties: ICCPR; ICESCR; Convention on the Rights of the Child (CRC); CEDAW; Convention on the Rights
    of Persons with Disabilities (CRPD); Convention on the Elimination of All Forms of Racial Discrimination (CERD);
    Convention against Torture (CAT).


    The lecture: there is no human rights instrument at the federal level. In a Westminster-style democracy, with the
    British understanding of the supremacy of Parliament, legal and political institutions (the courts and Parliament),
    together with the common law, protect certain basic rights; hence the resistance to a bill of rights in the strong
    sense. The state acts try to replicate the UK Human Rights Act: they do not give courts a strong power of judicial
    review, unlike jurisdictions where courts can strike down primary legislation that is clearly inconsistent with
    protected rights. Recognition at the international level does not automatically translate into Australian domestic
    law, though it has persuasive value and may help interpretation.


    Recognition is not enough. Recall the realists' law in books and law in action: rights recognised in a constitution
    or a treaty that just stay there are only "paper rights". Recognition sits between two big problems: implementation,
    and the foundations behind it (why are we recognising these rights at all?).


    ## 5. The philosophical foundations of human rights


    The lecture: some of the strongest moral justifications for human rights were developed by natural law thinkers:
    there are universal, always-valid principles of morality and justice, in light of which every human being has basic
    entitlements. Different natural law theories give different justifications: a Catholic tradition (Finnis looking
    back to Aquinas†; Hart mentions the Thomist tradition) and modern, more secular theories that put divine law aside,
    echoing older ideas such as the Stoics'† natural law as the law of reason.


    Kant† contributed to the deontological foundation of human rights. Put crudely, deontological reasoning is the
    opposite of consequentialism: instead of looking at the consequences of an action (lying, say), we look at the
    principles that lie behind the action and decide in their light whether it is right or wrong. Those foundational
    principles often refer to humanity and human dignity, a key value that rises to prominence in the modern,
    deontological foundations of human rights.


    ## Jeremy Waldron


    *Theories of Rights* (1984) · *The Right to Private Property* (1988) · *Nonsense Upon Stilts: Bentham, Burke and
    Marx on the Rights of Man* (1988) · *The Law: Theory and Practice in British Politics* (1990) · *The Dignity of
    Legislation* (1999) · *Law and Disagreement* (1999) · *Torture, Terror, and Trade-Offs: Philosophy for the White
    House* (2010) · *The Harm in Hate Speech* (Oliver Wendell Holmes Lectures) · *The Rule of Law and the Measure of
    Property* (Hamlyn Lectures) · *Political Political Theory* (Harvard University Press; not a typo) · *One Another's
    Equals: The Basis of Human Equality* (2017) · *Thoughtfulness and the Rule of Law* (2023).


    The lecture†: Waldron, originally from New Zealand, is a leading legal and political philosopher who has written on
    rights and is an authority on the rule of law; he takes the idea of dignity seriously, including in the context of
    legislation. The reading is a chapter of *The Law: Theory and Practice in British Politics* (1990) that uses the
    Troubles in Northern Ireland, and the interrogation techniques used by the British army (the so-called "five
    techniques"), to examine the tension between rights and utilitarian reasoning. Whether those techniques amounted to
    torture received different legal answers; the point is that there was a violation of human rights.


    **The ticking bomb** (the lecture's example). A suspect knows where a bomb is hidden in a crowded place. An
    act-utilitarian, aggregating happiness, may think torturing one person is justified to save hundreds or thousands of
    lives. Someone truly committed to human rights says it is not acceptable. Variants (torture the suspect's innocent
    child) push the dilemma further, a trolley problem writ large; the point is not the solution but how the scenario
    tests our moral intuitions.


    **The minority religion.** If a majority is disturbed that a minority embraces a different religion, purely
    utilitarian reasoning may justify forcing the minority to stop. To argue that this harms the minority's rights you
    need other reasons, reasons that value those rights.


    **Three utilitarianisms.** Act utilitarianism judges individual actions; rule utilitarianism† judges the rules that
    govern actions (we should adopt rules that increase the general happiness or welfare); indirect utilitarianism† is
    where Waldron sees the possibility of combining respect for rights with utilitarian reasoning: for utilitarian
    reasons, it makes sense to create structures in which officials are asked to refrain from utilitarian reasoning and
    to respect human rights.


    ## Can human rights be justified?


    > "Natural rights is simple nonsense: natural and imprescriptible rights, rhetorical nonsense – nonsense upon
    stilts." Jeremy Bentham, *Anarchical Fallacies*, in J. Bowring (ed.), *Works*, vol. 2 (1843)


    - Is the idea of human nature just a myth?

    - Are rights selfish?

    - Are rights an instrument of oppression?

    - Are rights a threat to the value of community?

    - Are rights ethnocentric?


    The lecture: Bentham, a great utilitarian (met with Austin in the utilitarian tradition of legal positivism), holds
    that the only rights that exist are legal rights enforceable in court; his positivist outlook colours his
    understanding of rights. Positive law is real; natural law is wishful thinking, so talk of natural rights is
    nonsense upon stilts. This line of criticism focuses on the legal dimension of rights and dismisses their moral
    dimension.


    The other questions, in the lecture's gloss:


    - **Myth or rhetoric**: rights language has expanded so far that every entitlement can be cast as a right or a human
    right. If only a few cards are trumps, what is the point of the category? This is mainly a call for a better
    definition of rights and more discipline in using the language of rights.

    - **Selfish**: rights focus too much on the interest of the individual, against the general interest; a variation
    asks about duties, which may be as important as rights.

    - **Oppression**: a line going back to the Marxist† criticism of law and the state (rights as an instrument of the
    ruling class), applied more broadly to rights connected with a particular power structure.

    - **Community**: rights as individual rights centre individual autonomy, an idea at home in liberalism and Western
    modernity; other traditions, and communitarian† philosophy within the West, rebalance the relationship between the
    individual and the community.

    - **Ethnocentric**: human rights as we know them may be a creation of the West, articulated in concepts not
    translatable into other languages, cultures or worldviews. Yet we compare how different legal systems recognise
    rights, and a meaningful comparison needs common ground: that rights are expressed differently does not mean there
    is nothing common behind them.


    ## Moral relativism and objectivism


    **Moral relativism**


    - Are moral disagreements rationally resolvable?

    - The distinction between metaethical and normative relativism.


    **Moral objectivism/realism**


    - Are moral statements apt for truth and falsity?


    Arguments against relativism → on moral relativism and objectivism, see the chapters by Wong and Trigg in the
    reading list.


    The lecture: debates about the value of rights, and their tension with utilitarian reasoning, boil down to questions
    about the nature of morality. Distinguish social or popular morality (the morals of a particular community, here and
    now) from a higher or deeper morality with more universal principles of morality and justice. Relativism: moral
    values, claims and language are always relative to a particular culture, society or linguistic universe. Objectivism
    or realism: there are moral facts, moral truths, and standards for deciding whether a moral claim is true or false.
    Keep two levels of discourse apart: the claim that a particular action is moral or immoral, and the meta-claim about
    that moral language.


    ## 6. Implementing human rights


    - From natural law to positive law

    - From moral rights to legal rights

    - "Positivisation" of HR into domestic law and international law

    - Human rights and constitutionally protected rights

    - Articles 1-19 of Basic Law for the Federal Republic of Germany

    - In Australia, no bill of rights in the Federal Constitution


    → On the relationship between international and domestic human rights regimes, see Samantha Besson, 'Human Rights
    and Constitutional Law – Patterns of Mutual Validation and Legitimation', in Rowan Cruft, S. Matthew Liao and
    Massimo Renzo (eds), *Philosophical Foundations of Human Rights* (Oxford University Press, 2015) 279-299.


    The lecture: as lawyers we are more in our comfort zone with legal sources, but here we can see how arguments from
    natural law were translated into positive law. Even natural lawyers appreciate the gap: Finnis, in *Natural Law and
    Natural Rights* (1980), revisits Aquinas's idea† that human authorities have the responsibility to determine the
    content of general principles of morality and justice, translating them into workable rules. Rights are protected at
    the constitutional level because the constitution is the highest legal source: the interests rights capture are so
    important that majoritarian rule, expressed through ordinary legislation, should not interfere with them. That is
    another way of expressing the tension between utilitarian reasoning and respect for human rights. The German Basic
    Law, written after the experience of Nazism, explicitly links human rights to human dignity†.


    ## Limitation clauses


    - Limitation clauses are constitutional provisions that permit the partial limitation of some constitutional rights.

    - What are the conditions under which constitutionally protected human rights can be limited?

    - Human rights, limitation clauses, and the principle of proportionality.


    :::statute

    Canadian Charter of Rights and Freedoms, s 1 (Guarantee of rights and freedoms): "The Canadian Charter of Rights and
    Freedoms guarantees the rights and freedoms set out in it subject only to such reasonable limits prescribed by law
    as can be demonstrably justified in a free and democratic society."

    :::


    The lecture: some rights may be so important that they should always have priority over competing interests; others
    conflict with other rights, or with the general interest, so we look for a compromise or a way of balancing them. It
    is a little like defeasibility (week 7): keep finding exceptions to a rule and at some point you have chipped away
    the entire rule. Find enough limitations to a right and you may ask what it even means to have that right.


    ## ECHR art 15 and the Victorian Charter


    :::statute

    European Convention on Human Rights, art 15 (Derogation in time of emergency): "1. In time of war or other public
    emergency threatening the life of the nation any High Contracting Party may take measures derogating from its
    obligations under this Convention to the extent strictly required by the exigencies of the situation, provided that
    such measures are not inconsistent with its other obligations under international law. 2. No derogation from Article
    2 [Rights to life], except in respect of deaths resulting from lawful acts of war, or from Articles 3 [Prohibition
    of torture], 4 (paragraph 1) ['No one shall be held in slavery or servitude'] and 7 [No punishment without law]
    shall be made under this provision." Paragraph 3 requires a Party using the derogation to keep the Secretary General
    of the Council of Europe fully informed of the measures, the reasons for them, and when they cease.

    :::


    The lecture: there is a debate on whether art 15(2) recognises some convention rights as rights that cannot be
    derogated from, a kind of absolute right. The right to life carries an explicit exception; some scholars argue the
    prohibition of torture can never be limited; no punishment without law is a very important right for every legal
    system that respects the rule of law.


    :::statute

    Charter of Human Rights and Responsibilities Act 2006 (Vic), s 7(2): "A human right may be subject under law only to
    such reasonable limits as can be demonstrably justified in a free and democratic society based on human dignity,
    equality and freedom, and taking into account all relevant factors including – (a) the nature of the right; and (b)
    the importance of the purpose of the limitation; and (c) the nature and extent of the limitation; and (d) the
    relationship between the limitation and its purpose; and (e) any less restrictive means reasonably available to
    achieve the purpose that the limitation seeks to achieve."

    :::


    Section 7 is headed "Human rights—what they are and when they may be limited". Section 7(1): the Part sets out the
    human rights that Parliament specifically seeks to protect and promote. Section 7(3): nothing in the Charter gives a
    person, entity or public authority a right to limit (to a greater extent than is provided for in the Charter) or
    destroy the human rights of any person. Note the clear echo of the Canadian Charter's "reasonable limits …
    demonstrably justified in a free and democratic society".


    ## Robert Alexy on proportionality


    - Alexy distinguishes rules (definitive commands) from principles (optimisation requirements).

    - Principles must be realised to the greatest extent possible, given legal and factual constraints.

    - Alexy argues that proportionality is necessarily connected to the adjudication of constitutional rights because
    rights are principles.

    - Three-part proportionality test:
      1. **Suitability** – the measure must be capable of achieving the legitimate aim.
      2. **Necessity** – there must be no less restrictive means to achieve the same goal.
      3. **Proportionality in the narrow sense (balancing)** – the benefits of the measure must outweigh the detriment to the right infringed.
    - Alexy introduces a "weight formula" to formalise balancing: Alexy's formula considers the intensity of
    interference, the importance of the competing principle, and the degree of certainty about these factors.


    The lecture: when courts resolve tensions between conflicting rights they apply the principle of proportionality.
    Germany and the German courts† played a particularly important role in developing it; legal systems have developed
    variations, and Australia has its own idea of structured proportionality†, studied in constitutional law. Alexy, a
    very influential German legal philosopher (in Europe and South America too), built his theory on a background legal
    theory: the distinction between rules and principles found in Dworkin's† work (week 5). If constitutional rights are
    principles, it follows that they will at some point conflict, so proportionality is entailed by a certain
    understanding of how the constitution works; a number of people disagree with Alexy on this. The weight formula, his
    best-known contribution, has attracted criticism; it tries to give the act of balancing a degree of certainty.


    :::examtip

    Use the convenor's zoom in / zoom out. Zoom in on what "right" means in the question (which Hohfeldian position?
    moral or legal? will or interest?); zoom out to the law–morality question it assumes. And be charitable: state the
    utilitarian or sceptical case at full strength before you answer it.

    :::
