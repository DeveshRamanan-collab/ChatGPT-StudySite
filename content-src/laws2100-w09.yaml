  - key: d20
    type: short
    concept: moral-and-legal-rights
    difficulty: 3
    prompt: '"Human rights are legal rights, or they are nothing." Discuss.'
    model: >-
      Human rights can be moral rights without being legal ones, but legal recognition is what makes them workable, and
      even that is not enough. The slides ask whether human rights are moral rights, legal rights or both. Legal rights
      have the easier answer to the authority question: we can point to authoritative sources such as a constitutional
      Bill of Rights, or South Africa's s 39(1). Against the claim, the slavery example shows that where positive law
      accepted slavery, enslaved people had no legal right not to be enslaved, yet one could say they had a moral right;
      that positive law does not recognise a moral requirement does not mean it does not exist. Bentham's reply is the
      strongest support for the claim: natural rights are "nonsense upon stilts"; only legal rights, enforceable in
      court, exist. But the moral claim does need a justification, and implementation shows the opposite danger: legal
      recognition alone yields only paper rights, law in books rather than law in action. So the claim is wrong as
      stated: rights need moral foundations to be justified and legal implementation to be effective.
    rubric:
      - id: r1
        criterion: Thesis — answers the "legal or nothing" claim directly with a qualified position.
        marks: 2
        top-band: >-
          States at once that human rights can be moral rights, and that legal recognition matters for effect, not
          existence.
        margin-note: Agree, disagree, or both? Say so up front.
        authorities: []
      - id: r2
        criterion: Argument — uses the moral/legal distinction, legal sources and the slavery example.
        marks: 3
        top-band: >-
          Shows that slavery-era moral claims survive the absence of legal recognition, and why legal sources make
          authority easier.
        margin-note: Good use of the history.
        authorities: []
      - id: r3
        criterion: Counterargument — states Bentham's position at full strength.
        marks: 3
        top-band: Quotes "nonsense upon stilts" and explains that for Bentham only legal rights, enforceable in court, exist.
        margin-note: 'Bentham at full strength: well done.'
        authorities:
          - bentham-anarchical-fallacies
      - id: r4
        criterion: Evaluation — uses implementation (paper rights) to reframe the claim.
        marks: 2
        top-band: >-
          Points out that legal recognition is not sufficient either, so rights need both foundations and
          implementation.
        margin-note: 'Nice turn: legal rights can be "nothing" too.'
        authorities: []
  - key: e01
    type: mcq
    concept: generations-and-history-of-human-rights
    difficulty: 1
    set: pretest
    stem: Which are first-generation human rights?
    options:
