      - text: He argues that natural rights are "nonsense upon stilts".
        why: >-
          This is Jeremy Bentham, in Anarchical Fallacies, quoted on the justification slide; it has nothing to do with
          Hohfeld's analysis.
  - key: b14
    type: mcq
    concept: hohfeldian-incidents
    difficulty: 3
    contrasts-with:
      - will-and-interest-theories
    stem: Which statement confuses the will theory with Hohfeld's analysis?
    options:
      - text: '"A Hohfeldian privilege means that the holder controls whether others must act."'
        correct: true
        why: >-
          Right: this imports the will theory's "control or choice over whether others must act" into a privilege, which
          is only the absence of a duty not to φ.
      - text: '"A Hohfeldian privilege means that the holder has no duty not to φ."'
        why: >-
          This is the slide's definition of a privilege, stated correctly; it involves no confusion with the will
          theory.
      - text: '"The will theory ties having a right to the holder''s control or choice."'
        why: >-
          This is the slide's definition of the will theory, stated correctly; the confusion lies in attributing control
          to a privilege.
      - text: '"A Hohfeldian claim exists where another person owes the holder a duty."'
        why: >-
          This restates the claim-right definition (Y is under a duty to X to φ) correctly; nothing here mixes it with
          the will theory.
  - key: b15
    type: mcq
    concept: hohfeldian-incidents
    difficulty: 2
    variant-of: b05
    stem: Under a lease, the landlord must repair the roof for the tenant. What does the tenant hold against the landlord?
    options:
      - text: 'A privilege: the tenant has no duty not to repair the roof herself.'
        why: >-
          The tenant may have that privilege, but the facts turn on the landlord's duty owed to the tenant, which makes
          this a claim-right.
      - text: 'A claim-right: the landlord is under a duty to the tenant to repair.'
        correct: true
        why: >-
          Right: X (tenant) has a claim-right against Y (landlord) with respect to φ (repairing) because the landlord
          owes the tenant a duty to repair.
      - text: 'A power: the tenant can change the landlord''s position by complaining.'
        why: >-
          Complaining does not create the duty; it already exists under the lease. A power would be an ability to alter
          that position.
      - text: 'An immunity: the landlord cannot change the lease once it is signed.'
        why: >-
          Whether the landlord can change the tenant's position is a different question; the facts describe a duty owed
          to the tenant.
  - key: b16
    type: mcq
    concept: hohfeldian-incidents
    difficulty: 3
    variant-of: b08
    stem: >-
      A statute lets a minister revoke a licence but says local councils cannot revoke it. What does the licence-holder
      hold against councils, and the minister against the licence-holder?
    options:
      - text: An immunity against councils; the minister holds a power.
        correct: true
        why: >-
          Right: councils lack the ability to alter the licence-holder's position (immunity), while the minister can
          alter it by revoking (power).
      - text: A claim against councils; the minister holds a privilege.
        why: >-
          No duty owed by councils is described, and revoking is not the mere absence of a duty: it changes the holder's
          position, which is a power.
      - text: A privilege against councils; the minister holds a claim.
        why: >-
          Tempting because the licence-holder seems free from councils, but the facts concern councils' inability to
          change the position, which is an immunity.
      - text: A power against councils; the minister holds an immunity.
        why: >-
          This reverses the positions: it is the minister who can alter the licence-holder's position, and councils who
          cannot.
  - key: b17
    type: mcq
    concept: hohfeldian-incidents
    difficulty: 4
    stem: X has a privilege to φ. What follows from Hohfeld's definitions on the slide alone?
    options:
      - text: Everyone else is under a duty to X not to interfere with X's φ-ing.
        why: >-
          Tempting because we often assume freedoms are protected, but that would be a claim-right against others; the
          privilege definition does not include it.
      - text: X has no duty not to φ; the definition is silent on whether others must let X φ.
        correct: true
        why: >-
          Right: a privilege is defined only by the absence of X's duty not to φ. Any duty of others not to interfere
          would be a separate claim-right.
      - text: X can alter the normative position of anyone who tries to stop X φ-ing.
        why: >-
          That would be a power, a different position; nothing in the privilege definition gives X an ability to change
          others' positions.
      - text: No one can ever take away X's privilege, because privileges are immunities.
        why: >-
          An immunity is a separate position (Y lacks the ability to alter X's incidents); a privilege does not carry
          one with it.
  - key: b18
    type: truefalse
    concept: hohfeldian-incidents
    difficulty: 1
    set: quickfire
    statement: In Hohfeld's analysis, X has a privilege to φ if and only if Y is under a duty to X to φ.
    answer: false
    why: 'False: that is the definition of a claim-right. X has a privilege to φ if and only if X has no duty not to φ.'
  - key: b19
    type: truefalse
    concept: hohfeldian-incidents
    difficulty: 1
    set: quickfire
    statement: 'Hohfeld identifies four positions within the concept of a "right": claim, privilege, power and immunity.'
    answer: true
    why: >-
      True: the slide says Hohfeld identifies four different legal positions within the concept of a "right": claim,
      privilege, power and immunity.
  - key: b20
    type: truefalse
    concept: hohfeldian-incidents
    difficulty: 1
    set: quickfire
    statement: An immunity is X's ability to alter Y's normative position.
    answer: false
    why: 'False: that is a power. X holds an immunity against Y when Y lacks the ability to alter X''s Hohfeldian incidents.'
  - key: c01
    type: mcq
    concept: rights-and-utilitarian-reasoning
    difficulty: 1
    set: pretest
    stem: What does the principle of utility require, as stated on the slides?
    options:
      - text: Respect for each person's dignity, whatever the consequences.
        why: >-
          Tempting because dignity is central to rights, but looking to principles whatever the consequences is
          deontological, the opposite of the principle of utility.
      - text: The greatest happiness for the greatest number.
        correct: true
        why: >-
          Right: the slide pairs act-utilitarianism with "the principle of utility (the greatest happiness for the
          greatest number)".
      - text: Equal treatment of all, without distinction of any kind.
        why: >-
          This echoes UDHR art 2 ("without distinction of any kind"), a statement about who holds rights, not the
          utilitarian standard for evaluating consequences.
      - text: Optimising each principle given legal and factual constraints.
        why: >-
          This is Alexy's account of principles as optimisation requirements, from the proportionality slide, not the
          principle of utility.
  - key: c02
    type: mcq
    concept: rights-and-utilitarian-reasoning
    difficulty: 1
    stem: Why, according to the lecture, is utilitarianism a form of consequentialism?
    options:
      - text: It decides the moral value of an action by the principles that lie behind it.
        why: >-
          Tempting because the two are often taught together, but looking to the principles behind an action is
          deontological reasoning, which the lecture calls the opposite.
      - text: It decides the moral value of an action in light of its consequences.
        correct: true
        why: >-
          Right: the lecture says the value of an action is decided in light of its consequences, with the principle of
          utility as the standard for evaluating them.
      - text: It treats rights as trumps that defeat any appeal to consequences.
        why: >-
          Rights as trumps cut off appeals to the general interest; that is the rights side of the tension, not
          utilitarian reasoning.
      - text: It holds that only legal rights, enforceable in court, have value.
        why: >-
          This is the lecture's reading of Bentham's view of rights; Bentham was a utilitarian, but this is not what
          makes utilitarianism consequentialist.
  - key: c03
    type: mcq
    concept: rights-and-utilitarian-reasoning
    difficulty: 2
    stem: Using the lecture's example of lying, how would a consequentialist answer "Is lying morally wrong?"
    options:
      - text: '"Always wrong: the principle behind lying cannot be justified, whatever follows."'
        why: >-
          This judges lying by the principle behind it regardless of results, which is the deontological approach, not
          the consequentialist one.
      - text: '"Never wrong: lying is a Hohfeldian privilege, as there is no duty not to lie."'
        why: >-
          Hohfeld's privilege describes a legal position; it does not answer the moral question, and the
          consequentialist answer depends on outcomes.
      - text: '"Wrong only if a court would enforce a duty not to lie in that situation."'
        why: >-
          Tempting if you link morality to legal enforcement, but the consequentialist looks at the consequences of the
          lie, not at what a court would do.
      - text: '"I need more information: it depends on the consequences of lying in that situation."'
        correct: true
        why: >-
          Right: the lecture's consequentialist asks for more information; in some situations lying may be permitted, or
          even morally correct, because of its consequences.
  - key: c04
    type: mcq
    concept: rights-and-utilitarian-reasoning
    difficulty: 2
    stem: How does deontological reasoning differ from consequentialist reasoning, in the lecture's crude summary?
    options:
      - text: It looks at the principles behind an action, rather than at its consequences.
        correct: true
        why: >-
          Right: the lecture describes deontological reasoning as basically the opposite of consequentialism: we look at
          the principles behind the action and decide in their light.
      - text: It looks at the consequences of an action, measured by the principle of utility.
        why: >-
          This is the consequentialist (utilitarian) approach itself, so it cannot be the difference the question asks
          for.
      - text: It asks whether officials, rather than individuals, are reasoning about the act.
        why: >-
          Tempting because Waldron's indirect utilitarianism is about officials, but who is reasoning is not what
          separates deontology from consequentialism.
      - text: It asks whether a constitutional limitation clause permits the action.
        why: >-
          Limitation clauses are legal provisions about limiting rights; they are not a mode of moral reasoning
          contrasted with consequentialism.
  - key: c05
    type: mcq
    concept: rights-and-utilitarian-reasoning
    difficulty: 2
    stem: >-
      Police hold a suspect who knows where a bomb is hidden in a crowded stadium. An act-utilitarian is most likely to
      reason that…
    options:
      - text: torture is never acceptable, because the suspect's right not to be tortured is a trump.
        why: >-
          Tempting because it is the rights answer the lecture defends, but it is the answer of someone committed to
          human rights, not of an act-utilitarian.
      - text: officials should be barred from weighing lives, because rules work better that way.
        why: >-
          This sounds like indirect utilitarianism, which reasons about structures for officials; an act-utilitarian
          evaluates this particular act.
      - text: torture may be justified if it saves many lives, because aggregate happiness rises.
        correct: true
        why: >-
          Right: weighing one person's harm against hundreds or thousands of lives, and aggregating happiness, the
          act-utilitarian may find this action justified.
      - text: the suspect has no rights at all, because rights exist only where courts enforce them.
        why: >-
          This borrows Bentham's view that only legal rights exist; the act-utilitarian's reasoning in the lecture is
          about consequences, not the existence of rights.
  - key: c06
    type: mcq
    concept: rights-and-utilitarian-reasoning
    difficulty: 2
    stem: On the lecture's account, what does a "true commitment to human rights" say about the ticking-bomb case?
    options:
      - text: Torture becomes acceptable once the number of lives at stake is high enough.
        why: >-
          This is the act-utilitarian line, which lets the numbers decide; the lecture contrasts it with a true
          commitment to rights.
      - text: Torturing the suspect is not acceptable, even to save many lives.
        correct: true
        why: >-
          Right: the lecture says that if you really respect this person's human rights you may think torture is not
          acceptable, however the consequences are counted.
      - text: Torture is a question for courts to settle under a proportionality test.
        why: >-
          Tempting because proportionality is the week's doctrinal tool, but the lecture treats torture as the case
          where balancing is resisted, not applied.
      - text: Torture is acceptable if the suspect is guilty but not if the person is innocent.
        why: >-
          The innocent-child variant sharpens the dilemma, but the rights answer does not depend on guilt: the
          commitment is to the person's rights as such.
  - key: c07
    type: mcq
    concept: rights-and-utilitarian-reasoning
    difficulty: 3
    stem: Why does the lecture use the example of a majority disturbed by a minority's religion?
    options:
      - text: To show that rights are ethnocentric, since religious freedom is a Western idea.
        why: >-
          The ethnocentrism critique is a separate topic; this example is about the limits of majoritarian, utilitarian
          reasoning.
      - text: To show that utility alone could justify the ban, so resisting it needs reasons that value rights.
        correct: true
        why: >-
          Right: in purely utilitarian terms the majority's preference could justify forcing the minority to stop;
          arguing against that requires reasons that value rights.
      - text: To show that majorities never have any legitimate interest in religious practice.
        why: >-
          Too strong: the lecture accepts that balancing community interests often makes sense; the point is that pure
          majoritarianism can produce injustice.
      - text: To show that rule utilitarianism always protects minorities better than rights do.
        why: >-
          The lecture does not claim this; the example shows that a purely utilitarian calculation needs supplementing
          with reasons that value rights.
  - key: c08
    type: mcq
    concept: rights-and-utilitarian-reasoning
    difficulty: 2
    verify: true
    stem: Which image of rights does the lecture attribute to Dworkin, and which to Schauer?
    options:
      - text: 'Dworkin: rights as shields; Schauer: rights as trumps.'
        why: >-
          Tempting because the two images are easy to swap, but this reverses the lecture's attribution: trumps are
          Dworkin's image, shields Schauer's.
      - text: 'Dworkin: rights as tools of choice; Schauer: rights as interests.'
        why: >-
          These are the will and interest theories, which the slides present as families of theories, not as Dworkin's
          and Schauer's images.
      - text: 'Dworkin: rights as trumps; Schauer: rights as shields.'
        correct: true
        why: >-
          Right (per the lecture recording; the slide asks "trumps or shields?" without names): trumps beat other cards;
          shields protect individuals from other claims.
      - text: 'Dworkin: rights as optimisation requirements; Schauer: rules.'
        why: >-
          Optimisation requirements are Alexy's account of principles; neither Dworkin's nor Schauer's image of rights
          is described this way.
  - key: c09
    type: mcq
    concept: rights-and-utilitarian-reasoning
    difficulty: 2
    stem: What do the "trumps" and "shields" images have in common, on the lecture's account?
    options:
      - text: Both say rights should be balanced against the general interest, case by case, by the courts.
        why: >-
          Tempting because balancing is common in law, but both images resist ordinary balancing: the right has priority
          over the general interest.
      - text: Both say rights exist only where positive law has recognised them.
        why: Neither image is a claim about the source of rights; that is the authority question (moral or legal rights?).
      - text: Both say rights disrupt a certain kind of reasoning by taking priority over the general interest.
        correct: true
        why: >-
          Right: the lecture says "the idea is the same": rights disrupt a certain kind of reasoning, because the right
          has priority over the general interest.
      - text: Both say rights are justified because they maximise the general happiness.
        why: >-
          This would make rights servants of utility; both images instead set rights against a certain type of
          utilitarian reasoning.
  - key: c10
    type: mcq
    concept: rights-and-utilitarian-reasoning
    difficulty: 3
    verify: true
    stem: How does rule utilitarianism differ from act utilitarianism, as the lecture describes them?
    options:
      - text: It assesses individual actions by the principles behind them, not by consequences.
        why: >-
          This is deontological reasoning, not rule utilitarianism; rule utilitarianism still judges by consequences for
          general welfare.
      - text: It judges the rules that govern actions, not single acts, by their effect on welfare.
        correct: true
        why: >-
          Right: the lecture says the focus is not on singular actions but on rules that govern actions, chosen to
          increase general happiness or welfare.
      - text: It assesses actions by whether they respect the rights of the person affected.
        why: >-
          Tempting because rules can protect rights, but assessing actions by respect for rights is the rights view, not
          a form of utilitarianism.
      - text: It assesses rules by whether a court of law would enforce them in practice.
        why: >-
          Enforceability in court is not the utilitarian standard; rule utilitarianism asks whether the rules increase
          general happiness or welfare.
  - key: c11
    type: mcq
    concept: rights-and-utilitarian-reasoning
    difficulty: 3
    verify: true
    stem: >-
      Where does Waldron, as presented in the lecture, see room for combining respect for rights with utilitarian
      reasoning?
    options:
      - text: 'In act utilitarianism: officials should torture whenever lives saved outnumber the harm.'
        why: >-
          This is the position the ticking bomb is used to challenge; it is where rights and utility clash, not where
          Waldron finds compatibility.
      - text: 'In rule utilitarianism: rights are simply rules that maximise happiness in every case.'
        why: >-
          Tempting because it is the other non-act version, but the lecture says to pay attention to what Waldron says
          about indirect utilitarianism.
      - text: >-
          In indirect utilitarianism: for utilitarian reasons, officials are asked to refrain from utilitarian reasoning
          and to respect rights.
        correct: true
        why: >-
          Right: on the lecture's account, Waldron sees compatibility where, for utilitarian reasons, we create
          structures in which officials do not decide by utilitarian reasoning.
      - text: 'Nowhere: Waldron holds that rights and utilitarian reasoning can never be combined.'
        why: >-
          Too strong: the lecture says Waldron argues for a possible compatibility between human rights and
          utilitarianism, through indirect utilitarianism.
  - key: c12
    type: mcq
    concept: rights-and-utilitarian-reasoning
    difficulty: 2
    verify: true
    stem: Which example does Waldron's chapter use, according to the lecture?
    options:
      - text: The interrogation techniques used by the British army during the Troubles in Northern Ireland.
        correct: true
        why: >-
          Right: the lecture says the chapter uses the Troubles, and the so-called five techniques used in
          interrogations, to examine rights against utilitarian reasoning.
      - text: The Speluncean explorers trapped in a cave and the killing of Roger Whetmore.
        why: >-
          Tempting because it is another famous hard case in the unit, but the Speluncean Explorers is Fuller's
          imaginary case from week 7.
      - text: A minister's statutory power to revoke a licence held by a citizen.
        why: This kind of example illustrates Hohfeld's powers and immunities; it is not the subject of Waldron's chapter.
      - text: The Victorian Charter's list of factors for limiting a human right.
        why: The Victorian Charter s 7 appears on the limitation-clause slide; it is not the example in Waldron's chapter.
  - key: c13
    type: mcq
    concept: rights-and-utilitarian-reasoning
    difficulty: 4
    verify: true
    stem: >-
      A government adopts a rule that its interrogators may never use torture, even when they believe torture would save
      lives, because it judges that such a rule produces the best results overall. Which view does this best illustrate?
    options:
      - text: 'Act utilitarianism: each interrogator weighs the consequences of each act of torture.'
        why: The rule stops interrogators weighing each act, which is exactly what act utilitarianism would have them do.
      - text: 'Indirect utilitarianism: for utilitarian reasons, officials are told not to calculate.'
        correct: true
        why: >-
          Right: the government's reason is the overall results (utilitarian), but the structure it creates asks
          officials to respect rights rather than weigh outcomes.
      - text: 'Bentham''s view: only rights enforceable in court exist, so the rule creates the right.'
        why: >-
          Tempting because the rule is a legal rule, but the scenario is about why officials are told not to calculate,
          not about whether only legal rights exist.
      - text: 'Rights as trumps: torture is ruled out by principle, regardless of the results.'
        why: >-
          The outcome matches what a trump would require, but the stated justification is the overall results, so the
          reasoning is utilitarian, not a trump.
  - key: c14
    type: mcq
    concept: rights-and-utilitarian-reasoning
    difficulty: 3
    contrasts-with:
      - limitation-clauses-and-proportionality
    stem: >-
      Which statement best captures the difference between treating a right as a "trump" and limiting it under a
      proportionality test?
    options:
      - text: A trump applies only to legal rights; proportionality applies only to moral rights.
        why: >-
          Both ideas operate on rights recognised in law and argued about morally; the difference lies in how competing
          interests are treated.
      - text: Both treat the right as an optimisation requirement to be realised as far as possible.
        why: >-
          Optimisation is Alexy's account of principles, which suits proportionality; a trump is not realised "as far as
          possible", it simply prevails.
      - text: A trump simply prevails; proportionality weighs the right.
        correct: true
        why: >-
          Right: as a trump, the right has priority over the general interest; under proportionality a limit can stand
          if suitable, necessary and justified on balance.
      - text: A trump is a Hohfeldian immunity, while proportionality is a Hohfeldian privilege.
        why: >-
          Hohfeld's positions describe legal relations, not modes of reasoning about competing interests, so this
          mapping does not work.
  - key: c15
    type: mcq
    concept: rights-and-utilitarian-reasoning
    difficulty: 2
    variant-of: c05
    stem: >-
      In the lecture's harder version of the ticking bomb, the suspect will talk only if their innocent child is
      tortured. What is the point of the variant?
    options:
      - text: To show that act-utilitarianism forbids harming innocent people in every case.
        why: >-
          The opposite: the lecture says that following consequentialist thinking you may call even this justifiable in
          light of the lives saved.
      - text: To test our moral intuitions, not to find the solution.
        correct: true
        why: >-
          Right: the lecture says such dilemmas test our intuitions (a trolley problem writ large); the point is not the
          solution but the competing justifications.
      - text: To show that the ECHR permits derogation from the ban on torture in emergencies.
        why: >-
          Art 15(2) says the opposite: no derogation from art 3 (prohibition of torture), even in war or public
          emergency.
      - text: To prove that the will theory cannot explain the rights of young children.
        why: >-
          Children trouble the will theory, but that is the identity issue; this variant is about rights against
          utilitarian reasoning.
  - key: c16
    type: mcq
    concept: rights-and-utilitarian-reasoning
    difficulty: 2
    stem: Which statement about rights and utilitarian reasoning matches the lecture?
    options:
      - text: Utilitarian reasoning is never appropriate in law or public policy.
        why: >-
          Too strong: the lecture says a certain kind of utilitarian reasoning makes sense and is helpful in many issues
          of public policy.
      - text: Rights and utilitarian reasoning never conflict once a constitution protects rights.
        why: >-
          Constitutional protection is itself, the lecture says, another way of expressing the tension; it does not make
          the conflict disappear.
      - text: Utilitarian reasoning always protects minorities better than rights do.
        why: >-
          The minority-religion example shows the reverse risk: purely utilitarian reasoning may justify suppressing a
          minority.
      - text: Balancing interests often makes sense, but pure majoritarianism can be unjust.
        correct: true
        why: >-
          Right: the lecture accepts that balancing community interests often makes sense, but pure majoritarian rule
          can produce situations we think unjust.
  - key: c17
    type: truefalse
    concept: rights-and-utilitarian-reasoning
    difficulty: 1
    set: quickfire
    statement: The slides say a true commitment to human rights is incompatible with a certain type of utilitarian reasoning.
    answer: true
    why: >-
      True: the slide says so, and pairs it with act-utilitarianism and the principle of utility (the greatest happiness
      for the greatest number).
  - key: c18
    type: truefalse
    concept: rights-and-utilitarian-reasoning
    difficulty: 1
    set: quickfire
    statement: Deontological reasoning judges an action solely by its consequences.
    answer: false
    why: >-
      False: that is consequentialism (utilitarianism is one form). Deontological reasoning looks at the principles
      behind the action instead.
  - key: c19
    type: truefalse
    concept: rights-and-utilitarian-reasoning
    difficulty: 2
    set: quickfire
    verify: true
    statement: >-
      In the lecture, Waldron sees indirect utilitarianism as a way of combining respect for rights with utilitarian
      reasoning.
    answer: true
    why: >-
      True on the lecture's account: officials are asked, for utilitarian reasons, to refrain from utilitarian reasoning
      and to respect human rights.
  - key: c20
    type: short
    concept: rights-and-utilitarian-reasoning
    difficulty: 3
    verify: true
    prompt: >-
      "Rights are trumps: no appeal to the general interest can override them." Discuss, using the ticking-bomb scenario
      and Waldron's indirect utilitarianism.
    model: >-
      Rights work as trumps against act-utilitarian reasoning, but the strongest defence of that status may itself be
      utilitarian. Human rights have priority over the general interest, and a true commitment to them is incompatible
      with a certain type of utilitarian reasoning. In the ticking-bomb scenario an act-utilitarian, weighing one
      person's harm against hundreds of lives and aggregating happiness, may justify torture; someone truly committed to
      human rights says it is not acceptable. The minority-religion example shows the same risk: pure majoritarianism
      could justify suppressing a minority. Yet utilitarian reasoning has its place: balancing interests often makes
      sense in public policy, and limitation clauses show many rights can be limited. Waldron, on the lecture's account,
      finds compatibility in indirect utilitarianism: for utilitarian reasons we create structures in which officials
      refrain from utilitarian reasoning and respect rights. So the claim holds for officials' decisions in the moment;
      whether it holds all the way down depends on whether the justification for the trump is itself a rights claim or a
      utilitarian one.
    rubric:
      - id: r1
        criterion: Thesis — takes a position on whether rights are trumps and at what level.
        marks: 2
        top-band: >-
          Distinguishes the level of the official's decision from the level of justification, and commits to a view on
          each.
        margin-note: Trumps for whom, and why? Commit.
        authorities: []
      - id: r2
        criterion: Argument — uses priority over the general interest, act-utilitarianism and the ticking bomb accurately.
        marks: 3
        top-band: Explains aggregation under the principle of utility and why a true commitment to rights rejects torture.
        margin-note: The ticking bomb is well used.
        authorities: []
      - id: r3
        criterion: Counterargument — gives utilitarian reasoning its due (public policy, limitation clauses, the variants).
        marks: 3
        top-band: Concedes where balancing makes sense and that many rights are limited, before replying.
        margin-note: 'Charitable to the utilitarian: good.'
        authorities: []
      - id: r4
        criterion: Evaluation — uses Waldron's indirect utilitarianism to resolve or reframe the tension.
        marks: 2
        top-band: Shows that a trump at the level of officials can rest on a utilitarian justification, and says what follows.
        margin-note: Nice zoom out to the justification.
        authorities:
          - waldron-the-law-theory-and-practice-in-british-politics
  - key: d01
    type: mcq
    concept: moral-and-legal-rights
    difficulty: 1
    stem: Which question does the "authority" issue ask about human rights?
    options:
      - text: What are the fundamental interests protected by human rights?
        why: >-
          Tempting because it sits next to authority in Part A, but this is the content question (issue 3), answered
          with the three generations.
      - text: What is the source of human rights and their authority?
        correct: true
        why: >-
          Right: issue 2, Authority, asks "What is the source of human rights and their authority?" (are they moral
          rights, legal rights, or both?).
      - text: Have human rights always existed?
        why: >-
          This is the history question (issue 4); history raises the foundational question, but it is not the authority
          issue itself.
      - text: How can human rights be recognised and observed?
        why: 'This is the implementation question (issue 6): the move from recognising rights to observing them in practice.'
  - key: d02
    type: mcq
    concept: moral-and-legal-rights
    difficulty: 1
    stem: Why, according to the lecture, is the authority question easier for legal rights?
    options:
      - text: Because authoritative legal sources exist, such as a constitutional Bill of Rights.
        correct: true
        why: >-
          Right: the lecture says that for legal rights we can look to authoritative sources; many constitutions include
          a Bill of Rights high in the hierarchy of sources.
      - text: Because legal rights, unlike moral rights, never conflict with the general interest.
        why: >-
          Legal rights conflict with the general interest all the time; that is why limitation clauses and
          proportionality exist.
      - text: Because legal rights are universal and apply to each and every human being.
        why: >-
          Tempting because universality is a feature of human rights, but many legal rights (eg contractual ones) are
          not universal at all.
      - text: Because legal rights can be justified only by natural law, which is settled.
        why: >-
          Natural law is one contested foundation of human rights; the point about legal rights is that legal sources
          supply their authority.
  - key: d03
    type: mcq
    concept: moral-and-legal-rights
    difficulty: 2
    stem: >-
      What does s 39(1) of the Constitution of the Republic of South Africa require of a court interpreting the Bill of
      Rights?
    options:
      - text: It must consider foreign law, may consider international law, and must defer to Parliament on values.
        why: This reverses "must" and "may" and adds deference to Parliament, which s 39(1) does not mention.
      - text: >-
          It must promote the values of an open and democratic society based on human dignity, equality and freedom,
          must consider international law, and may consider foreign law.
        correct: true
        why: >-
          Right: s 39(1)(a)–(c) sets out exactly these three directions: promote the values, consider international law,
          and optionally consider foreign law.
      - text: It must apply the Bill of Rights literally, without regard to values or international law.
        why: >-
          Tempting if you assume constitutional text is applied literally, but s 39(1) expressly directs the court to
          promote values and consider international law.
      - text: It may consider international and foreign law, but only where the text is ambiguous.
        why: >-
          Section 39(1) makes considering international law mandatory, not dependent on ambiguity; only foreign law is
          optional.
  - key: d04
    type: mcq
    concept: moral-and-legal-rights
    difficulty: 2
    variant-of: d03
    stem: >-
      Under s 39(1) of the South African Constitution, which source is a court only permitted (not required) to
      consider?
    options:
      - text: International law.
        why: >-
          Tempting because international and foreign law are often paired, but s 39(1)(b) says a court "must consider
          international law".
      - text: Foreign law.
        correct: true
        why: 'Right: s 39(1)(c) says a court "may consider foreign law"; the other directions are mandatory ("must").'
      - text: The values of an open and democratic society.
        why: Section 39(1)(a) says a court "must promote" these values, so they are required, not merely permitted.
      - text: Human dignity, equality and freedom.
        why: These are the values a court "must promote" under s 39(1)(a); promoting them is required.
  - key: d05
    type: mcq
    concept: moral-and-legal-rights
    difficulty: 1
    stem: According to the slides, does the Australian Federal Constitution include a bill of rights?
    options:
      - text: 'Yes: Articles 1–19 set out its protected rights.'
        why: >-
          Articles 1–19 are on the slide, but they belong to the Basic Law for the Federal Republic of Germany, not to
