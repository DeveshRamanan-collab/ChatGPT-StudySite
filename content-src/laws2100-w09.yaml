    body: >-
      Wesley Newcomb Hohfeld (1879–1918) identifies four different legal positions within the concept of a "right":


      1. **Claim**: X has a claim-right against Y with respect to φ if and only if Y is under a duty to X to φ.

      2. **Privilege**: X has a privilege to φ if and only if X has no duty not to φ.

      3. **Power**: X has a (normative) power over Y if and only if X has the ability to alter (through volitional
      action) Y's normative position.

      4. **Immunity**: X holds an immunity against Y (in respect of X's normative position) if and only if Y lacks the
      ability to alter X's Hohfeldian incidents.


      Read the definitions closely. Claims and privileges are defined by duties about φ: a claim is someone else's duty
      owed to me; a privilege is the absence of my own duty not to act. Powers and immunities are defined by the ability
      to alter normative positions: a power is my ability to change yours; an immunity is your inability to change mine.


      So "right" is not one thing. When someone says "I have a right", ask which of the four positions they hold, and
      against whom.


      **Negative and positive rights**: consider the difference between "freedom from" (eg freedom from torture) and
      "freedom to".


      Exam use: translate a rights claim into Hohfeld's terms before you argue about it.
  - slug: rights-and-utilitarian-reasoning
    title: 'Rights against utility: trumps, shields and Waldron''s indirect utilitarianism'
    visual: simulation
    visual-brief: >-
      A ticking-bomb balance: slide the lives at stake and choose the reasoner (act-utilitarian, rights as trumps,
      indirect-utilitarian official); the verdict on torturing the suspect tips only for the act-utilitarian, while the
      rights pan never moves.
    related:
      - critiques-of-human-rights
      - limitation-clauses-and-proportionality
      - will-and-interest-theories
    depends-on:
      - will-and-interest-theories
    contrasts-with:
      - limitation-clauses-and-proportionality
    cases: []
    authorities:
      - dworkin-taking-rights-seriously
      - waldron-the-law-theory-and-practice-in-british-politics
    verify: true
    body: >-
      Human rights have priority over the "general interest". Do they work as "trumps" or "shields"? (The lecture
      attributes trumps to Dworkin and shields to Schauer.) Either way, rights disrupt a certain kind of reasoning: a
      true commitment to human rights is incompatible with a certain type of utilitarian reasoning.


      **Act-utilitarianism** judges each action by its consequences under the principle of utility (the greatest
      happiness for the greatest number): utilitarianism is a form of consequentialism. **Deontological** reasoning is,
      crudely, the opposite: it looks to the principles behind an action, not its consequences.


      The lecture's test cases:


      - Ticking bomb: an act-utilitarian may justify torturing a suspect to save hundreds of lives; someone truly
      committed to human rights says it is not acceptable.

      - Minority religion: a majority disturbed by a minority's religion could, in purely utilitarian terms, justify
      banning it; defending the minority needs reasons that value its rights.


      Waldron's chapter (the Troubles in Northern Ireland and the interrogation "five techniques") distinguishes act,
      rule and indirect utilitarianism. Indirect utilitarianism is where he sees compatibility: for utilitarian reasons,
      we create structures in which officials are asked to refrain from utilitarian reasoning and to respect rights.


      Exam use: state the utilitarian case at full strength, then show where rights cut it off.
  - slug: moral-and-legal-rights
    title: Moral rights, legal rights and positivisation
    visual: diagram
    visual-brief: >-
      Two layers, morality above and positive law below: a moral right descends through recognition (constitution,
      statute, treaty) into a legal right, then must cross a second gap from recognition to implementation; a
      slavery-era right sits above the line with no legal counterpart, and a "paper right" sits below with no
      implementation.
    related:
      - generations-and-history-of-human-rights
      - critiques-of-human-rights
      - laws2100-w06-realism-against-formalism
    depends-on:
      - laws2100-w04-natural-law-and-positivism
      - laws2100-w03-separation-of-law-and-morals
    contrasts-with: []
    cases: []
    authorities:
      - constitution-of-the-republic-of-south-africa-s39-1
      - besson-human-rights-and-constitutional-law
    verify: false
    body: >-
      Authority: are human rights moral rights, legal rights, or both? Are there authoritative sources for them? For
      legal rights the answer is easier: many constitutions (not the Australian Constitution) include a Bill of Rights,
      high in the hierarchy of legal sources. Some direct how to read it: South Africa's s 39(1) says a court
      interpreting the Bill of Rights "must promote the values that underlie an open and democratic society based on
      human dignity, equality and freedom", must consider international law and may consider foreign law.


      History sharpens the question. Where slavery was legal, enslaved people had no legal right not to be enslaved; did
      they still have a moral right? That positive law does not recognise a moral requirement does not mean the
      requirement does not exist, but the moral claim then needs its own justification.


      Implementation runs the other way: from natural law to positive law, from moral rights to legal rights. Rights are
      "positivised" into domestic and international law, and constitutional protection shields them from ordinary
      legislation (eg Articles 1–19 of Germany's Basic Law; in Australia, no bill of rights in the Federal
      Constitution).


      Recognition is not enough. Rights recognised in a constitution or treaty that stay there are "paper rights": law
      in books, not law in action.


      Exam use: say whether your claim is about a moral right, a legal right, or both.
  - slug: generations-and-history-of-human-rights
    title: Three generations and a short history of human rights
    visual: timeline
    visual-brief: >-
      A draggable timeline from Magna Carta (1215) to the UK Human Rights Act 1998, with the UDHR (1948) marked as the
      turn from national documents to universality; each instrument is tagged with the generation of rights its title
      names, where it names one.
    related:
      - moral-and-legal-rights
      - will-and-interest-theories
    depends-on: []
    contrasts-with: []
    cases: []
    authorities:
      - universal-declaration-of-human-rights-1948
    verify: false
    body: >-
      Content: the literature identifies generations of rights that build upon each other.


      - **First generation**: civil and political rights, eg the right to life, equality before the law, freedom of
      speech and of religion, property rights, a fair trial and voting rights.

      - **Second generation**: social, economic and cultural rights, eg to be employed (under just conditions), to food,
      to housing and to health care.

      - **Third generation**: group and collective ("solidarity") rights, eg self-determination, economic and social
      development, a healthy environment, natural resources, and intergenerational equity and sustainability.


      The lecture: the third generation is more problematic in its authority, justification and implementation; it is
      much harder to move from recognising a right to a healthy environment to implementing it.


      History: Magna Carta (1215); English Bill of Rights (1689); US Constitution (1789) and Bill of Rights (1791);
      French Declaration of the Rights of Man and of the Citizen (1789); UDHR (1948); ICCPR and ICESCR (1966); CEDAW
      (1979); Convention on the Rights of the Child (1989); UK Human Rights Act 1998.


      The earlier documents were national; the UDHR puts universality at its centre, and international recognition
      followed through covenants and treaties. History shows how our understanding of rights developed, and it raises
      the foundational question: have human rights always existed?


      Exam use: date a right's legal recognition separately from the moral claim behind it.
  - slug: critiques-of-human-rights
    title: Can human rights be justified? Bentham's 'nonsense upon stilts' and the sceptics
    visual: diagram
    visual-brief: >-
      A central claim "human rights are justified" resting on foundations (natural law, deontological principles, human
      dignity); Bentham's "nonsense upon stilts" knocks out the natural-rights leg, five objections press in around it
      (myth, selfish, oppression, community, ethnocentric), and a lower band splits moral relativism from objectivism.
    related:
      - moral-and-legal-rights
      - rights-and-utilitarian-reasoning
    depends-on:
      - laws2100-w03-separation-of-law-and-morals
    contrasts-with:
      - rights-and-utilitarian-reasoning
    cases: []
    authorities:
      - bentham-anarchical-fallacies
    verify: false
    body: >-
      Justification: some of the strongest moral arguments for human rights come from natural law, from deontological
      principles and from the idea of human dignity.


      Jeremy Bentham: "Natural rights is simple nonsense: natural and imprescriptible rights, rhetorical nonsense –
      nonsense upon stilts." (*Anarchical Fallacies*) The lecture: for Bentham, a utilitarian with a positivist outlook,
      the only rights that exist are legal rights; natural rights are wishful thinking.


      The slide's sceptical questions, with the lecture's gloss:


      - **Is human nature just a myth?** Rights talk is often rhetoric; if every entitlement is a right, the category
      loses its point. A call for better definition and discipline.

      - **Are rights selfish?** They favour the individual over the general interest; what about duties?

      - **Are rights an instrument of oppression?** Rights can be tied to a particular power structure.

      - **Are rights a threat to the value of community?** Individual autonomy against the community.

      - **Are rights ethnocentric?** Perhaps a Western creation; yet meaningful comparison across legal systems suggests
      common ground.


      Behind these lies the nature of morality. **Moral relativism**: are moral disagreements rationally resolvable?
      (Distinguish metaethical from normative relativism.) **Moral objectivism/realism**: are moral statements apt for
      truth and falsity? Relativism makes moral claims relative to a culture or society; objectivism holds there are
      moral facts.


      Exam use: the case for rights is only as strong as the account of morality behind it.
  - slug: limitation-clauses-and-proportionality
    title: Limitation clauses and Alexy's proportionality test
    visual: simulation
    visual-brief: >-
      A rights-limiting measure walks through three gates (suitability, necessity, balancing); toggle whether it serves
      its aim, whether a less restrictive means exists and whether its benefits outweigh the detriment, and switch the
      right to one ECHR art 15(2) puts beyond derogation to see the gates close before balancing begins.
    related:
      - moral-and-legal-rights
      - laws2100-w07-rules-standards-and-defeasibility
    depends-on:
      - laws2100-w05-rules-principles-and-policies
    contrasts-with:
      - rights-and-utilitarian-reasoning
    cases: []
    authorities:
      - canadian-charter-of-rights-and-freedoms-s1
      - echr-art-15
      - charter-of-human-rights-and-responsibilities-act-2006-vic-s7
      - alexy-proportionality
    verify: false
    body: >-
      Are there any absolute human rights? Limitation clauses are constitutional provisions that permit the partial
      limitation of some constitutional rights.


      - Canadian Charter s 1: rights are guaranteed "subject only to such reasonable limits prescribed by law as can be
      demonstrably justified in a free and democratic society".

      - Victorian Charter s 7(2): the same test, "based on human dignity, equality and freedom", weighing the nature of
      the right, the importance of the limitation's purpose, its nature and extent, its relationship to the purpose, and
      any less restrictive means.

      - ECHR art 15: derogation in war or public emergency, but none from art 2 (life, save lawful acts of war), 3
      (torture), 4(1) (slavery) or 7 (no punishment without law).


      Robert Alexy distinguishes rules (definitive commands) from principles (optimisation requirements), realised to
      the greatest extent possible given legal and factual constraints. Because rights are principles, proportionality
      is necessarily connected to adjudicating constitutional rights. The test:


      1. **Suitability**: the measure must be capable of achieving the legitimate aim.

      2. **Necessity**: there must be no less restrictive means to the same goal.

      3. **Proportionality in the narrow sense (balancing)**: the benefits must outweigh the detriment to the right
      infringed.


      His "weight formula" formalises balancing: the intensity of interference, the importance of the competing
      principle, and the certainty about these factors.


      Exam use: run a limitation through all three stages, in order.
