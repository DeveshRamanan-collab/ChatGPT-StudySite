    body: >-
      The reading's infographic (adapted from Designworks' Luke van O and Herbert Simon's *The Sciences of the

      Artificial*, 1969) runs five stages: **Empathy → Define → Ideate → Prototype → Test**, under three headings —

      Understand ("understanding ends in insight"), Create ("creation ends in ideas") and Deliver ("delivery ends in

      reality").


      Its eight steps say how to behave along the way:


      1. Be empathetic in defining the problem (decide the issue, agree the audience, establish a glossary of terms).

      2. Be explorative in researching the problem (review its history and other attempts; talk to your end users).

      3. Be creative in generating ideas (as many as possible; do not judge or debate them).

      4. Be iterative in refining your ideas (multiple drafts, diverse feedback, working prototypes).

      5. Be rational in choosing an idea (set aside emotion and ownership; avoid consensus thinking).

      6. Be practical in delivering it to the client (plan, resource, assign, execute).

      7. Be honest in evaluating performance (did it meet its goals? measure success).

      8. Repeat.


      The line is drawn straight, but the process is iterative: the reading says its iterative nature can open
      alternative

      paths or even redefine the initial problem, and the guest lecture stresses that a team may go back a stage at any
      point

      or change direction.


      Exam use: name the stage a scenario is in, and the behaviour that stage calls for.
  - slug: four-rules-of-design-thinking
    title: The four rules of design thinking (Meinel and Leifer)
    visual: palace
    visual-brief: >-
      Four frames along a corridor, one per rule — human, ambiguity, redesign, tangibility — each showing the rule’s
      one-line imperative and the practice it justifies.
    related:
      - design-thinking-process
      - prototyping-and-experimentation
      - empathy-and-human-centred-design
    depends-on:
      - what-is-design-thinking
    contrasts-with:
      - design-thinking-process
    cases: []
    authorities:
      - mgmt2094-meinel-leifer-four-rules
      - mgmt2094-reading-marketers-guide-to-design-thinking
    verify: false
    body: >-
      In *Design Thinking: Understand, Improve, Apply* (2011), Christoph Meinel and Larry Leifer write that there are
      four

      rules to design thinking (quoted in the reading):


      1. **The Human Rule: all design activity is ultimately social in nature.** Successful innovation brings us back to
      the
         'human-centric point of view': solve technical problems in ways that satisfy human needs, and acknowledge the human
         element in all technologists and managers.
      2. **The Ambiguity Rule: design thinkers must preserve ambiguity.** There is no chance for 'chance discovery' if
      the
         box is closed tightly, the constraints enumerated excessively and the fear of failure is always at hand; innovation
         demands experimentation at the limits of our knowledge.
      3. **The Redesign Rule: all design is redesign.** The human needs we seek to satisfy have been with us for
      millennia;
         because technology and social circumstances change, understand how these needs were addressed in the past, then
         apply 'foresight tools and methods' to estimate conditions five, 10 or even 20 years ahead.
      4. **The Tangibility Rule: making ideas tangible always facilitates communication.** One of their most recent
         findings: 'prototypes are communication media'.

      The rules are principles that hold throughout; the five stages are the sequence of work.


      Exam use: use a rule to justify a practice — the human rule for customer research, the ambiguity rule for not
      closing

      the brief too early, the redesign rule for studying past solutions, the tangibility rule for prototyping.
  - slug: empathy-and-human-centred-design
    title: Empathy and human-centred design
    visual: diagram
    visual-brief: >-
      An observer and a user with a line of sight between them: affective empathy drawn as a mirrored line, cognitive
      empathy as perspective taking that crosses into the user’s world, then the four roadblocks (idealism, egoism,
      realism, circumstantialism) drawn as filters that bend the line.
    related:
      - discovering-needs-and-insights
      - what-is-design-thinking
      - four-rules-of-design-thinking
    depends-on:
      - what-is-design-thinking
    contrasts-with:
      - discovering-needs-and-insights
    cases: []
    authorities:
      - mgmt2094-reading-mitchem-empathy
      - mgmt2094-example-temple-grandin
      - mgmt2094-reading-verganti-foreword
      - mgmt2094-example-apple-steve-jobs
    verify: false
    body: >-
      Twenty years ago design shifted from an objective perspective, where designers worked from their own assumptions,
      to

      a human-centred one that puts users at the heart of the process. Empathy is one of the 'mindsets' of human-centred

      design (HCD), championed by IDEO. HCD works on the premise that a deep understanding of users' **unarticulated
      needs**

      (through empathy) inspires creativity and innovation; empathetic design observes users in their environments —
      closer

      to anthropology than to market science.


      Two kinds of empathy: **affective** (a shared, mirrored emotion: you see someone sad and feel sad) and
      **cognitive**

      (perspective taking: stepping into their world, worldview, beliefs and fears). Temple Grandin noticed that cattle

      reacted badly to being led in a straight line and designed curved corrals that cut stress, panic and injury.


      Four **roadblocks to empathy**: idealism (seeing things as we expect them to be), egoism (as we want them to be),

      realism (thinking we see things as they are) and circumstantialism (thinking only about what we see). True empathy
      sets

      aside personal beliefs and seeks further evidence without judgement.


      How close to get is debated. IDEO goes into the customer's world; Roberto Verganti warns against engaging the
      customer

      too much, because most customers are not trained to see far-future possibilities (Steve Jobs: until you show them,
      they

      don't know; Henry Ford: they would have asked for faster horses).


      Exam use: name the kind of empathy and the roadblock in a scenario, and say how to get past it.
  - slug: discovering-needs-and-insights
    title: "Discover and distil: from customer research to needs and insights"
    visual: simulation
    visual-brief: >-
      A customer-narrative builder: choose how the customer, the need and the insight are written; the verdict flags a
      noun-shaped need (a solution in disguise) and a shallow insight, and passes only when the narrative reaches the
      root cause.
    related:
      - design-thinking-process
      - divergent-thinking-and-idea-generation
    depends-on:
      - empathy-and-human-centred-design
    contrasts-with:
      - empathy-and-human-centred-design
    cases: []
    authorities:
      - mgmt2094-example-nepal-infant-warmer
      - mgmt2094-example-guest-nathan-baird
    verify: true
    body: >-
      The guest lecture's first stages are **discover** (go out and understand customers' needs) and **distil** (turn
      the

      research into needs and insights). Fall in love with the problem, not the solution, and get out of the building:

      customers may not know the solution, but they do know their pain points and what they like, so ask about their
      lives,

      not for solutions.


      Pursue multiple lines of inquiry, like a detective:


      - **be the customer** — experience the situation yourself;

      - **be with the customer** — observe them, then interview them;

      - **learn about them** — from people around them (partners, hairstylists, nutritionists);

      - **talk to extreme users** — people who use the product a lot or not at all. Their experience is heightened, so
      needs
        surface more easily, and a solution built for them can still sell to the mainstream. Innovation is not polling.

      Distil with an **empathy map** (what customers say and do, then — more importantly — think and feel, all from real

      research) and then a **customer narrative**: a descriptive customer, a **need written as a verb** (nouns are often

      solutions) and an **insight** that goes deeper than the reason, to the root cause. A Stanford d.school team asked
      for a

      low-cost incubator for Nepal found the incubators empty: the real need was to keep a premature baby warm without
      the

      means to get it to hospital.


      Exam use: rewrite a noun-shaped need as a verb, and push the insight to the root cause.
  - slug: divergent-thinking-and-idea-generation
    title: Divergent thinking and idea-generation exercises
    visual: simulation
    visual-brief: >-
      An idea funnel: in the diverge phase ideas multiply unless judging is switched on; in the converge phase they
      narrow to a shortlist; the verdict checks the session against the reading’s rules for each phase (no judging while
      generating; no consensus or ownership while choosing).
    related:
      - design-thinking-process
      - discovering-needs-and-insights
    depends-on:
      - design-thinking-process
    contrasts-with: []
    cases: []
    authorities:
      - mgmt2094-reading-marketers-guide-to-design-thinking
      - mgmt2094-example-deloitte-design-thinking
      - mgmt2094-example-guest-nathan-baird
    verify: false
    body: >-
      The goal of **divergent thinking** is to generate many different ideas about a topic in a short period of time. It

      involves breaking a topic down into its component parts to gain insight into its various aspects, and it typically

      happens in a spontaneous, free-flowing manner, so ideas arrive in a random, unorganised fashion (Week 3 creativity

      exercises).


      The exercises train it:


      - **Uses for a paper clip** in 60 seconds.

      - **Think in threes**: A = usual solution, B = different solutions, C = radical solutions.

      - **Asking new questions**: two minutes listing the existing questions, then at least five new and varied ones —
      no
        solutions.
      - **Place two unrelated things together** to find a new opportunity.

      - **Who are your future competitors?** — current and future, direct and indirect; the usual answer is only the
        current, direct one.
      - **Speed thinking**: idea ping-pong, a mind map at speed, as many ideas as possible in 120 seconds, 120 seconds
      on why
        the ideas will NOT work, and nine different perspectives on one problem.

      The reading's process sets the rules: when generating, produce as many ideas as possible, log the session, do not
      judge

      or debate ideas, and hold one conversation at a time; when choosing, set aside emotion and ownership of ideas and
      avoid

      consensus thinking. Deloitte's summary: diverging, before converging.


      Exam use: pick the exercise that fits a stuck team, and keep generating separate from judging.
  - slug: prototyping-and-experimentation
    title: "Prototyping and testing: think with your hands, fail early"
    visual: simulation
    visual-brief: >-
      A cost-of-failure line rising from early experiments to launch: set how sure the team is that people want the idea
      and how finished the prototype is; the verdict says whether the test fits the uncertainty, and launching untested
      shows the most expensive failure.
    related:
      - desirability-feasibility-viability
      - four-rules-of-design-thinking
      - design-thinking-process
    depends-on:
      - desirability-feasibility-viability
    contrasts-with:
      - desirability-feasibility-viability
    cases: []
    authorities:
      - mgmt2094-example-zappos
      - mgmt2094-meinel-leifer-four-rules
      - mgmt2094-example-guest-nathan-baird
    verify: false
    body: >-
      After ideation the team has been in its own head; it needs to get back to customers quickly to find out whether
      they

      are as excited about the ideas — and the way to do that is a simple prototype, tested with them. The guest
      lecture's

      advice: think with your hands — build something, try something, then talk about it, not the reverse. Design
      thinking

      "probably should be called design doing".


      Why: fail early, when failure is cheap — like an athlete trying different routines in the years before the
      Olympics,

      not at the Games. Building something costly and launching it means the money is spent before you learn it fails.


      A prototype can be anything: scrap materials, a mock-up, a storyboard. Early on, while uncertainty is high, the

      question is not "can we make it?" but "if we made it, would it matter to the customer?". As it becomes clearer
      that

      people want it, more finished and more expensive prototypes are justified, and testing turns to feasibility and

      viability. Each round: get feedback, iterate, take it back. If a test fails, the idea may be killed, or
      **pivoted** —

      one key element (the product, the customer group, the channel) changed.


      The reading agrees: create multiple drafts and working prototypes and seek feedback from end users (step 4); and
      the

      tangibility rule says prototypes are communication media.


      Exam use: match the prototype to the uncertainty, and say what the test is meant to learn.
authorities:
  - slug: mgmt2094-reading-marketers-guide-to-design-thinking
    title: Dunner (ed.) (2015), The Marketer's Guide To Design Thinking
    kind: article
    text: >-
      A Marketing magazine trend briefing on design thinking. In essence, design thinking is a process that harnesses
      creativity to resolve problems and create solutions with the intent of making a product, a service, or a business,
      better; its iterative nature lets organisations work on present and future issues at once, explore a range of
      solutions and even redefine the initial problem. It is not the preserve of designers or start-ups: organisations
      from Deloitte to IBM and Barclays use it to cultivate a more customer-centric or human-centred culture.
    gloss: >-
      The Week 3 reading: definitions (Tim Brown, Gerda Gemser), the five-stage process and eight steps, the four rules,
      and the pieces on empathy, meaning, customer experience and Deloitte.
    cases: []
    verify: false
  - slug: mgmt2094-reading-verganti-foreword
    title: Verganti (2015), Foreword
    kind: article
    text: >-
      Innovation is useful only when it creates value for people, and people give value to things that mean something to
      them. Firms assume meaning already exists in the market and search for a better solution (a new "how"), but people
      also search for new meanings (a new "why"), and meaning can be designed and proposed — candles chosen to dim and
      perfume a room, slow surgical robots that help doctors. Hence: no design, no meaning, no value, no innovation, no
      business.
    gloss: >-
      Roberto Verganti’s foreword to the Week 3 reading: why innovation is more than a performance improvement, and why
      design is about meaning.
    cases: []
    verify: false
  - slug: mgmt2094-reading-mitchem-empathy
    title: "Mitchem (2015), Opinion: What cows can teach you about empathy"
    kind: article
    text: >-
      Human-centred design works on the premise that a deep understanding of users’ unarticulated needs, gained through
      empathy, inspires creativity and innovation. Empathy is either affective (a shared, mirrored emotion) or cognitive
      (perspective taking). Temple Grandin’s curved corrals show its power, and four roadblocks — idealism, egoism,
      realism and circumstantialism — explain how observers fall back on assumptions and judgements.
    gloss: "Empathy in design thinking: the two kinds of empathy and the four roadblocks to it (Week 3 reading)."
    cases: []
    verify: false
  - slug: mgmt2094-reading-stacey-experience-paradigm
    title: "Stacey (2015), Opinion: The new experience paradigm"
    kind: article
    text: >-
      Design thinking as a customer-centred process lets brands look at their offer through their customers’ eyes.
      Experiences that combine relevance (user-focused), purpose (they work brilliantly) and joy (they connect
      emotionally) deliver real value to customers, not price — as in Amazon’s Taco Truck and mall kiosks and Warby
      Parker’s home try-on and ‘buy one, give one’ model.
    gloss: "What design thinking produces for customers: experiences with relevance, purpose and joy (Week 3 reading)."
    cases: []
    verify: false
  - slug: mgmt2094-meinel-leifer-four-rules
    title: "Meinel and Leifer (2011), Design Thinking: Understand, Improve, Apply"
    kind: article
    text: >-
      Four rules to design thinking: the Human Rule (all design activity is ultimately social in nature); the Ambiguity
      Rule (design thinkers must preserve ambiguity); the Redesign Rule (all design is redesign); and the Tangibility
      Rule (making ideas tangible always facilitates communication — prototypes are communication media).
    gloss: The four rules, as quoted in the Week 3 reading; used to explain and justify design thinking practices.
    cases: []
    verify: false
  - slug: mgmt2094-example-guest-nathan-baird
    title: "Example: guest lecture on design thinking (Nathan Baird)"
    kind: other
    text: >-
      A design-thinking practitioner and author defined design thinking as a human-centred, creative and
      experimentation-driven approach to innovation, argued that more innovations fail from a lack of customers than
      from product failure, and set out the desirable–feasible–viable sweet spot. He walked through his journey — kick
      off, discover, distil, generate ideas, prototype and test, with the option to go back, pivot or kill the idea at
      any stage — illustrated by the Segway and Dyson, a Stanford d.school infant warmer for Nepal, extreme users and a
      pizza cutter, Velcro, and Zappos’s first shoe sales.
    gloss: >-
      The Week 3 lecture: design thinking in practice. The speaker’s name, his stage names and the company and product
      names come from the machine transcript only and are not in the reading.
    cases: []
    verify: true
  - slug: mgmt2094-example-deloitte-design-thinking
    title: "Example: Deloitte Australia’s design thinking transformation"
    kind: other
    text: >-
      Per CMO David Redhill’s opinion piece in the Week 3 reading, Deloitte — called the ‘sick puppy’ of professional
      services by BRW in 2004 — trained hundreds of leaders in design thinking with Stanford d.school professors, won a
      2014 International Design Award for audit, and made design one of its four lenses (the ‘4D’ factor). Design
      thinking played a key role in over 70 percent of the consulting team’s major wins in a year, and in a decade the
      firm doubled in size and tripled its revenue.
    gloss: >-
      Design thinking beyond designers and start-ups: ‘designful thinking’ as a mindset, diverging before converging,
      and design applied even to audit.
    cases: []
    verify: false
  - slug: mgmt2094-example-temple-grandin
    title: "Example: Temple Grandin’s curved corrals"
    kind: other
    text: >-
      Temple Grandin, a professor of animal science, noticed that livestock reacted adversely when led in a straight
      line and designed adapted curved corrals, which reduced stress, panic and injury, made the process more humane and
      safe, and apparently improved the quality of the meat. She observed animal behaviour from an unaffected
      standpoint.
    gloss: "Empathetic design: a simple insight from observation, free of the assumption that “that’s just what cows do”."
    cases: []
    verify: false
  - slug: mgmt2094-example-apple-steve-jobs
    title: "Example: Apple and Steve Jobs on asking customers"
    kind: other
    text: >-
      The reading calls Apple, Steve Jobs and head designer Jony Ive the most famous exponents of design thinking, whose
      ‘i’ products made Apple the world’s biggest company by market capitalisation. Gemser cites Jobs: you shouldn’t ask
      customers what they want — until you show them, they don’t know.
    gloss: >-
      The Verganti stream of design thinking research: customers are not trained to see far-future possibilities, so
      design proposes rather than asks.
    cases: []
    verify: false
  - slug: mgmt2094-example-segway-and-dyson
    title: "Example: the Segway and the Dyson vacuum cleaner"
    kind: other
    text: >-
      Per the guest lecture, the Segway’s inventor started from what he could make and, worried about copying, did not
      test it with customers; at launch people said they already had a bike, skateboard or scooter, and it flopped.
      James Dyson started from customers’ frustrations — a dusty, messy bag and suction lost as the bag filled — then
      ran a couple of thousand experiments to make a solution feasible and viable.
    gloss: "Desirability first: feasibility-first development versus starting from customers’ pain points."
    cases: []
    verify: true
  - slug: mgmt2094-example-nepal-infant-warmer
    title: "Example: a low-cost infant warmer for Nepal (Stanford d.school)"
    kind: other
    text: >-
      Per the guest lecture, a Stanford d.school team asked to design a low-cost incubator for premature babies in Nepal
      found the hospital incubators mostly empty: babies were born in villages, and one had died on the journey to the
      city. The real problem was keeping a premature baby warm without the means to get it to hospital, so the team
      designed a cheap warmer — part survival blanket, part sleeping bag — heated by a wax pellet warmed in water.
    gloss: Discovery that redefines the problem; a customer narrative whose insight reaches the root cause.
    cases: []
    verify: true
  - slug: mgmt2094-example-zappos
    title: "Example: Zappos tests online shoe sales"
    kind: other
    text: >-
      Per the guest lecture, Zappos’s founder tested whether people would buy shoes online by photographing a local
      shop’s shoes and listing them on a one- or two-page website; when a pair sold, he bought it at full retail and
      posted it himself (‘Flintstoning’: doing the work manually behind the scenes). He proved the business model and
      learned about distribution and warehousing without buying a warehouse.
    gloss: A cheap experiment that tests what customers do, before building the business.
    cases: []
    verify: true
questions:
  - key: wd01
    type: mcq
    concept: what-is-design-thinking
    difficulty: 1
    set: pretest
    stem: In the Week 3 reading, what is design thinking "in essence"?
    options:
      - text: >-
          A visual style that trained designers apply to products and brands near the end of development, once the
          engineering is settled
        why: >-
          Tempting because "design" suggests aesthetics, but the reading treats it as a problem-solving process, and
          Deloitte’s experience shows you need not be a trained designer to use it.
      - text: >-
          A process that harnesses creativity to resolve problems and create solutions that make a product, service or
          business better
        correct: true
        why: >-
          Right — the executive summary: "In essence, design thinking is a process that harnesses creativity to resolve
          problems and create solutions with the intent of making a product, a service, or a business, better."
      - text: >-
          A data-driven evaluation method that replaces creative judgement with analytical, evidence-based testing of
          each option
        why: >-
          Tempting because design thinking does test ideas, but the reading says it moves away from an analytical or
          evidence-based model — creativity is at its core.
      - text: >-
          A cost-cutting program that improves the efficiency of existing processes step by step, without changing what
          is offered
        why: >-
          Tempting because it can improve processes, but Gemser says it is not suited to incremental improvement; firms
          should use it for something radically different.
  - key: wd02
    type: mcq
    concept: what-is-design-thinking
    difficulty: 2
    stem: >-
      Tim Brown of IDEO defines design thinking as a system that uses the designer's sensibility and methods to match
      people's needs with what?
    options:
      - text: What competitors already offer, so that the firm can match the market leader’s features at a lower price
        why: >-
          Tempting because firms do benchmark rivals, but Brown’s definition is about people’s needs, technical
          feasibility and business viability — not copying the market leader.
      - text: What the chief executive believes the business needs, translated into a clear brief for the design team
        why: >-
          Tempting because briefs often come from the top, but the reading warns that the GM’s idea of what would fix
          the business "can’t be privileged"; Brown matches people’s needs.
      - text: >-
          What is technologically feasible and what a viable business can convert into consumer value and market
          opportunity
        correct: true
        why: >-
          Right — Brown’s definition (quoted in the reading) joins three things: people’s needs, technological
          feasibility and business viability — the desirable–feasible–viable idea in one sentence.
      - text: What focus groups say they want, so that the product reflects the average customer’s stated preferences
        why: >-
          Tempting because it sounds customer-centred, but design thinking looks for unarticulated needs through
          empathy, and Brown pairs needs with feasibility and viability.
  - key: wd03
    type: mcq
    concept: what-is-design-thinking
    difficulty: 2
    stem: >-
      The guest lecture defines design thinking as a human-centred, creative and experimentation-driven approach to
      innovation. What does "experimentation-driven" mean here?
    options:
      - text: Running large controlled trials of the finished product before any money is spent on further design work
        why: >-
          Tempting because trials are experiments, but the lecture stresses quick, cheap tests early; a finished product
          is the expensive end of testing, not the start.
      - text: Letting engineers experiment with new technology first, then looking for customers who might want the results
        why: >-
          Tempting because experimentation sounds technical, but starting from what we can make is the feasibility-first
          trap the lecture warns against; it starts with the customer.
      - text: Launching every idea the team generates at the same time, so that the best one survives in the market
        why: >-
          Tempting because it sounds bold, but launching everything is the costliest way to learn; the lecture’s point
          is to learn cheaply with prototypes before any launch.
      - text: Testing ideas quickly and cheaply, building only the minimum needed to find out whether people want them
        correct: true
        why: >-
          Right — the lecture asks how we quickly and cheaply test our ideas: what is the minimum we need to build to
          find out if people want it? A mock-up can be enough.
  - key: wd04
    type: mcq
    concept: what-is-design-thinking
    difficulty: 1
    stem: According to the guest lecture, why do more innovations and start-ups fail?
    options:
      - text: "A lack of customers: they make something that works, but nobody wants it"
        correct: true
        why: >-
          Right — the lecture’s number one reason for a design thinking approach: research and experience show more
          innovations fail from a lack of customers than from the product failing.
      - text: "A failure of the product: the technology does not work as designed once it reaches the market"
        why: >-
          Tempting because product failure is the obvious explanation, but the lecture says the reverse: more fail from
          a lack of customers than from a failure of the product.
      - text: "A lack of funding: investors withdraw before the product has had enough time to find its market"
        why: >-
          Tempting because money matters, but the lecture’s diagnosis is demand, not funding: people make something that
          works, but nobody wants it.
      - text: "A lack of protection: competitors copy the idea before the original firm can recover its costs"
        why: >-
          Tempting because fear of copying appears in the lecture, but as a mistake (an inventor who avoided customers),
          not as the main reason innovations fail.
  - key: wd05
    type: mcq
    concept: what-is-design-thinking
    difficulty: 2
    stem: Which conditions does the Week 3 material say design thinking particularly suits?
    options:
      - text: Stable markets with a well-defined problem, where the firm needs to cut the cost of an existing process
        why: >-
          Tempting because design thinking can improve processes, but Gemser says it is not suited to incremental
          improvement; it shines where the problem itself is unclear.
      - text: >-
          Volatile, uncertain, complex and ambiguous (VUCA) conditions, where neither the problem nor the solution is
          known
        correct: true
        why: >-
          Right — the DMI introduction says the VUCA nature of the 21st century is exactly the right time for design
          thinking, and the lecture calls it a good tool when we don’t know the problem or the solution.
      - text: Highly regulated industries, where only data-driven evaluation can justify any change of direction
        why: >-
          Tempting because the reading mentions financial services, but it says data-driven evaluation ruled there
          unchallenged — design thinking moves away from a purely analytical model.
      - text: Mature product lines, where customers keep asking for small improvements such as a new flavour or colour
        why: >-
          Tempting because customers do ask for small changes, but Gemser says to use design thinking for something
          radically different, not incremental tweaks.
  - key: wd06
    type: mcq
    concept: what-is-design-thinking
    difficulty: 2
    stem: RMIT professor Gerda Gemser says design thinking is "not suited to" which kind of program?
    options:
      - text: A program to discover gaps in the market for new services
        why: >-
          Tempting to rule out, but Gemser gives this as a use: design thinking may help financial institutions discover
          gaps in the market for new services.
      - text: A program to redesign existing services that are not working well
        why: >-
          Tempting because redesign sounds incremental, but Gemser names redesigning existing services that are not
          working well as something design thinking can help with.
      - text: A program or desire for incremental improvement
        correct: true
        why: >-
          Right — Gemser: "it’s not suited to a program or desire for incremental improvement. Companies implementing
          design thinking should be looking at something that is radically different."
      - text: A program that engages stakeholders at every level of the firm
        why: >-
          Tempting because it sounds like extra work, but Gemser says a successful process must engage stakeholders at
          all levels — it is required, not excluded.
  - key: wd07
    type: mcq
    concept: what-is-design-thinking
    difficulty: 2
    stem: Deloitte’s CMO separates "working like a designer" from "thinking like a designer". What is "designful thinking"?
    options:
      - text: The creative, spatial and graphic skills that only a trained industrial, graphic or UX designer can bring
        why: >-
          Tempting because it is the common misunderstanding Redhill corrects: design thinking does not specifically
          require the creative, spatial or graphic skills of a trained designer.
      - text: A discipline and a process that uses a set of tools and methodologies to make better things
        why: >-
          Tempting because Redhill uses these words — but for "working like a designer". Thinking like a designer is the
          mindset; working like one is the discipline and toolset.
      - text: Hiring an outside design consultancy so that fresh perspectives reach the client’s own team
        why: >-
          Tempting because Gemser notes firms such as Philips use consultancies for fresh perspectives, but that
          concerns who does the work, not what designful thinking means.
      - text: "A disposition and a mindset: human-centric, explorative, asking \"what if\" and \"why not?\""
        correct: true
        why: >-
          Right — Redhill says design thinking is often misunderstood as needing a designer’s skills; in fact it is
          ‘designful thinking’: a disposition and a mindset that reframes problems as opportunities.
  - key: wd08
    type: mcq
    concept: what-is-design-thinking
    difficulty: 3
    stem: The Design Management Institute calls design thinking "experiential". What does it mean by that?
    options:
      - text: >-
          It creates solutions from a user-need perspective, rather than defining a market and force-fitting solutions
          to it
        correct: true
        why: >-
          Right — the DMI introduction: the design thinking philosophy creates solutions from a user-need perspective
          rather than the conventional approach of defining a potential market and force-fitting solutions.
      - text: It relies on designers’ personal experience rather than on any research with customers or users
        why: >-
          Tempting because "experiential" suggests personal experience, but working from designers’ own assumptions is
          the old ‘objective’ approach that human-centred design moved away from.
      - text: It measures success by how the staff who run the process experience it, rather than by results
        why: >-
          Tempting because DMI does talk about aligning people, but "experiential" refers to designing from the user’s
          need, not to the staff’s experience of the process.
      - text: It can only be learned by experience on live projects, so it cannot be taught in a course
        why: >-
          Tempting, but the reading shows it being taught: Stanford’s d.school teaches it as a formal method, and
          Deloitte trained hundreds of leaders through a program.
  - key: wd09
    type: mcq
    concept: what-is-design-thinking
    difficulty: 3
    stem: What did the Design Management Institute’s Design Value Index (DVI) find?
    options:
      - text: Over 10 years, engineering-led companies outperformed design-led companies on the S&P
        why: >-
          Tempting because Microsoft is described as engineering-based, but the DVI tracked design-led firms and found
          they beat the S&P; Microsoft was giving designers more influence.
      - text: Over 10 years, design-led companies outperformed the S&P by 228 percent
        correct: true
        why: >-
          Right — the DVI benchmarked design-led companies’ stock value against the S&P Index: over the last 10 years
          they outperformed it by an extraordinary 228 percent.
      - text: Spending on design had no measurable effect on stock value relative to the S&P Index
        why: >-
          Tempting given the debate on whether design is "unquantifiable", but the DVI is exactly an attempt to quantify
          it, and it found a large advantage.
      - text: Design-led companies beat the S&P only in years when the wider market was falling
        why: >-
          Tempting because the guest lecture talks about recovering after the GFC, but that was about doing several
          types of innovation; the DVI result was 228 percent over 10 years.
  - key: wd10
    type: mcq
    concept: what-is-design-thinking
    difficulty: 3
    stem: >-
      A bank wants to use design thinking but expects its general manager to pick the winning idea from an agency’s
      shortlist, as usual. What does the reading say about this?
    options:
      - text: >-
          This is how design thinking is meant to work: the GM is the client, so the GM’s choice is the final and proper
          test of each idea
        why: >-
          Tempting because the GM commissions the work, but Nash describes a GM "at the top of the tree" picking a
          favourite as the piecemeal approach design thinking replaces.
      - text: >-
          It is acceptable, provided the agency used recognised design methods to produce the shortlist the GM chooses
          from in the first place
        why: >-
          Tempting because agencies use creative methods, but Nash’s point is about who decides: stakeholders at all
          levels are involved, and the top’s idea is not privileged.
      - text: >-
          The GM should still choose, but only after the shortlist has been narrowed by a vote of all staff, so that
          everyone feels heard
        why: >-
          Tempting because it widens involvement, but the reading’s choosing step says to avoid consensus thinking, and
          a vote still ends with the GM’s preference privileged.
      - text: >-
          Leaders must accept the best ideas may not come from the top: the GM’s idea of what would fix the business
          can’t be privileged
        correct: true
        why: >-
          Right — FutureBrand’s Doug Nash: design thinking sits uncomfortably with some executives because it shifts how
          they allocate resources; the GM’s idea of what would ‘fix the business’ can’t be privileged.
  - key: wd11
    type: mcq
    concept: what-is-design-thinking
    difficulty: 2
    stem: On whether design thinking belongs in the marketing function, what does Gerda Gemser say?
    options:
      - text: >-
          It depends on who leads innovation: a natural fit in a market-driven firm, perhaps not in an
          engineering-driven one
        correct: true
        why: >-
          Right — Gemser: if it is a market-driven organisation there is a natural fit with marketers; if
          engineering-driven, perhaps not. Design should sit where innovation processes are initiated and developed.
      - text: It always belongs in marketing, because marketers own the customer and therefore own all customer research
        why: >-
          Tempting because Luke van O calls marketing "the easiest door" for design thinking, but Gemser makes it
          conditional on who is tasked with innovation.
      - text: It should never sit in marketing, because research shows marketers and designers think differently and clash
        why: >-
          Tempting because Gemser does mention research on tension between marketers and designers, but she says helping
          marketers understand designers helps them work together better.
      - text: It belongs in finance, because design must first prove its value in numbers before anything is built at all
        why: >-
          Tempting because of the debate about quantifying design, but no speaker places design thinking in finance;
          Redhill only says it has implications for finance.
  - key: wd12
    type: mcq
    concept: what-is-design-thinking
    difficulty: 2
    stem: "Roberto Verganti writes: \"No value, no innovation, no business.\" When is innovation useful, on his account?"
    options:
      - text: Whenever it improves a product’s performance
        why: >-
          Tempting because innovation often improves performance, but Verganti says we can improve performance without
          generating any business results — seven-blade razors, billion-pixel cameras.
      - text: Only when it creates value for people
        correct: true
        why: >-
          Right — Verganti: "Innovation is useful only when it creates value for people." A faster car or a razor with
          seven blades improves performance without necessarily creating value.
      - text: Whenever it is new to the market, valued or not
        why: >-
          Tempting because novelty is part of innovation, but Verganti’s chain runs through value: no value, no
          innovation, no business. Newness alone is not enough.
      - text: Only when it is protected by a patent or a brand
        why: >-
          Tempting because protection matters commercially, but Verganti says nothing about patents; value comes from
          meaning, and meaning comes from design.
  - key: wd13
    type: mcq
    concept: what-is-design-thinking
    difficulty: 3
    stem: "Complete Verganti’s chain: \"No design, no ___, no value, no innovation, no business.\""
    options:
      - text: brand
        why: >-
          Tempting because brands carry meaning in marketing, but Verganti’s link is meaning itself: design is "making
          sense (of things)", in the Krippendorff line he quotes.
      - text: budget
        why: >-
          Tempting because innovation needs money, but Verganti’s chain is about where value comes from — people’s
          search for meaning — not about funding.
      - text: meaning
        correct: true
        why: >-
          Right — for Verganti, people give value to things that mean something to them, and "the meaning of things
          comes from design". So design → meaning → value → innovation → business.
      - text: customer
        why: >-
          Tempting because value is created for people, but the missing link is what people search for: meaning, the
          "why" behind what they do.
  - key: wd14
    type: mcq
    concept: what-is-design-thinking
    difficulty: 3
    stem: >-
      Verganti notes that families buy candles lasting only 30 hours rather than long-lasting electric bulbs. What does
      the example show?
    options:
      - text: People will always choose the cheaper, longer-lasting product when two serve the same purpose
        why: >-
          Tempting as standard economics, but the example cuts the other way: the candle lasts 30 hours and is chosen
          anyway, because it means something different.
      - text: Firms should keep improving the "how" — a brighter lamp — because that is what customers really value
        why: >-
          Tempting because firms often do this, but Verganti says it assumes meaning exists ‘out there’; people also
          search for new ‘whys’, which design can propose.
      - text: Electric bulbs failed because their makers did not test them with customers before launch
        why: >-
          Tempting because testing is a lecture theme, but Verganti makes no claim that bulbs failed; a different
          meaning, not a better bulb, won the purchase.
      - text: People search for new meanings — a new "why", such as welcoming friends in a dim, perfumed room
        correct: true
        why: >-
          Right — the candle is bought not to illuminate but "to dim the light and perfume a room when welcoming
          friends". What makes people passionate is the discovery of a new meaning.
  - key: wd15
    type: mcq
    concept: what-is-design-thinking
    difficulty: 4
    stem: >-
      An insurer asks whether to use design thinking to trim two days off its claims process, a change customers have
      asked for. Which response best applies the Week 3 material?
    options:
      - text: >-
          Gemser would say this incremental fix is not where design thinking adds most value; use it to rethink the
          claims experience radically
        correct: true
        why: >-
          Right — Gemser: design thinking is not suited to a program or desire for incremental improvement; firms should
          look at something radically different. A two-day trim is incremental.
      - text: >-
          Design thinking is ideal here because customers have said exactly what they want, so no further research is
          needed
        why: >-
          Tempting because the request is customer-led, but human-centred design looks for unarticulated needs, and the
          reading’s process still starts with research — talk to your end users.
      - text: Design thinking cannot be used by insurers, because financial services must rely on data-driven evaluation
        why: >-
          Tempting because the reading says data-driven evaluation has ruled financial services, but it also says
          Australian financial institutions now use design thinking.
      - text: Use design thinking but skip prototyping, since a change to a process cannot be made tangible for customers
        why: >-
          Tempting because a process is intangible, but the tangibility rule says making ideas tangible always helps
          communication; a storyboard of the new claim would do.
  - key: qf01
    type: truefalse
    concept: what-is-design-thinking
    difficulty: 1
    set: quickfire
    statement: The reading says design thinking requires the creative, spatial or graphic skills of a trained designer.
    answer: false
    why: >-
      False — Redhill calls this a frequent misunderstanding: it is about thinking like a designer (‘designful
      thinking’), a disposition and a mindset, and Deloitte trained its people without making them designers.
  - key: qf02
    type: truefalse
    concept: what-is-design-thinking
    difficulty: 1
    set: quickfire
    statement: >-
      Tim Brown's definition matches people's needs with what is technologically feasible and what a viable business can
      convert into consumer value.
    answer: true
    why: >-
      True — Brown (IDEO): design thinking "uses the designer’s sensibility and methods to match people’s needs with
      what is technologically feasible and what a viable business can convert into consumer value and market
      opportunity".
  - key: qf03
    type: truefalse
    concept: what-is-design-thinking
    difficulty: 1
    set: quickfire
    statement: Gerda Gemser says design thinking is best used for incremental improvement of existing processes.
    answer: false
    why: >-
      False — Gemser says it is "not suited to a program or desire for incremental improvement"; companies should be
      looking at something that is radically different.
  - key: wd16
    type: truefalse
    concept: what-is-design-thinking
    difficulty: 2
    statement: The guest lecture says more innovations fail because the product does not work than because nobody wants it.
    answer: false
    why: >-
      False — the reverse: research and experience show that more innovations and start-ups fail from a lack of
      customers than from a failure of the product.
  - key: fv01
    type: mcq
    concept: desirability-feasibility-viability
    difficulty: 1
    set: pretest
    stem: "In the guest lecture, an idea is in the \"sweet spot\" for innovation when it is:"
    options:
      - text: Desirable, feasible and viable
        correct: true
        why: >-
          Right — the sweet spot is where the idea is desirable (people want it), feasible (we can make it, technically
          and organisationally) and viable (we can make money from it, or have impact).
      - text: Cheap, quick and patented
        why: >-
          Tempting because speed and cost matter in experiments, but they are not the three lenses, and patents are
          never offered as a test of a good idea.
      - text: Novel, simple and beautiful
        why: >-
          Tempting because these sound like design virtues, but the lens set in the lecture and in Tim Brown’s
          definition is people’s needs, feasibility and viability.
      - text: Tested, launched and profitable
        why: >-
          Tempting because it describes a successful product’s life, but these are steps in time, not the three lenses
          an idea must satisfy at once.
  - key: fv02
    type: mcq
    concept: desirability-feasibility-viability
    difficulty: 1
    stem: Which lens asks "Can we make it, technically and organisationally?"
    options:
      - text: Desirability
        why: >-
          Tempting because it is the first lens, but desirability asks whether people want it — the customer’s side, not
          the maker’s capability.
      - text: Feasibility
        correct: true
        why: >-
          Right — feasible means you have to be able to make it, technically and organisationally; Tim Brown’s version
          is "what is technologically feasible".
      - text: Viability
        why: >-
          Tempting because it is also a business test, but viability asks whether you can make money from it (or, for
          government, have a big impact) — not whether you can build it.
      - text: Scalability
        why: >-
          Tempting because growth matters, but scalability is not one of the three lenses in the lecture or in Brown’s
          definition; the third lens is viability.
  - key: fv03
    type: mcq
    concept: desirability-feasibility-viability
    difficulty: 2
    stem: For a government agency or a not-for-profit, what does the guest lecture say "viable" means?
    options:
      - text: The idea will make a profit within one budget year
        why: >-
          Tempting because viability usually means profit, but the lecture adapts the lens for government and
          not-for-profits: impact for citizens replaces money.
      - text: The idea can be built with the agency’s existing staff
        why: >-
          Tempting because it is a practical constraint, but being able to build it with available resources is
          feasibility (technical and organisational), not viability.
      - text: The idea will have a big impact for citizens
        correct: true
        why: >-
          Right — viable means you can make money from it, "or if it’s government or not-for-profit, it’s going to have
          a big impact for citizens".
      - text: The idea is popular with the minister responsible for it
        why: >-
          Tempting in a public-sector setting, but the lecture’s test is impact for citizens; a minister’s approval is
          not one of the three lenses.
  - key: fv04
    type: mcq
    concept: desirability-feasibility-viability
    difficulty: 2
    stem: What sequence does the guest lecture say happens "too often"?
    options:
      - text: Start with what customers want, run cheap experiments, then build only what tested well with them
        why: >-
          Tempting because it is the sequence the lecture recommends, but the question asks what goes wrong too often;
          this is the fix — start with desirability.
      - text: Start with a business model, find investors, then build whatever the investors are willing to fund
        why: >-
          Tempting because business models matter, but the lecture’s complaint is that teams begin with feasibility and
          a paper business case, not with investors’ wishes.
      - text: Start with competitors’ products, copy their best features, then compete on price when launching
        why: >-
          Tempting as a common strategy, but the lecture does not describe copying; its trap is starting from technology
          and a business case with no customer input.
      - text: Start with what we can make, write a business case on made-up numbers, then launch
        correct: true
        why: >-
          Right — "how cool is the thing we can make" (feasibility), then a business case of made-up numbers (there is
          no data yet for a future innovation), then launch — the first time the customer sees it.
  - key: fv05
    type: mcq
    concept: desirability-feasibility-viability
    difficulty: 2
    stem: Why is a business case a weak starting point for an innovation, on the guest lecture’s account?
    options:
      - text: "Its numbers are largely made up: there is no data yet for an innovation that lies in the future"
        correct: true
        why: >-
          Right — the lecture calls the early business case "sort of made-up numbers, especially for innovation, which
          is in the future and there’s no data for that yet".
      - text: Business cases take too long to write, so competitors reach the market before the firm does
        why: >-
          Tempting because speed to market matters, but the lecture’s objection is the quality of the numbers, not the
          time taken to write them.
      - text: Finance chiefs never approve business cases for innovation, only for cost savings and efficiencies
        why: >-
          Tempting given the lecture’s joke about the CFO, but its "CFO slide" is used precisely to get money for
          innovating — CFOs can be persuaded with evidence.
      - text: A business case can only measure feasibility, so it says nothing at all about whether an idea is viable
        why: >-
          Tempting, but this inverts it: a business case is about viability (making money); its weakness is that
          viability numbers for a future innovation are guesses.
  - key: fv06
    type: mcq
    concept: desirability-feasibility-viability
    difficulty: 2
    verify: true
    stem: In the guest lecture, what went wrong with the Segway?
    options:
      - text: It could not be made to work reliably, so the technology failed during its first public demonstrations
        why: >-
          Tempting because product failure is the obvious explanation, but the lecture says the technology worked and
          was later used in other products; nobody wanted it.
      - text: Its inventor started from what he could make and, fearing copying, kept it from customers until launch
        correct: true
        why: >-
          Right — per the lecture, the inventor was so worried about copying that he did not test it with customers; at
          launch people said they already had a bike, skateboard or scooter.
      - text: It was tested heavily with customers, but the tests were run with the wrong group of extreme users
        why: >-
          Tempting because extreme users appear later in the lecture, but the Segway’s problem was the opposite: no
          customer testing before launch.
      - text: It was priced too low to be viable, so the company lost money on every unit that it managed to sell
        why: >-
          Tempting because viability is a lens, but the lecture’s diagnosis is desirability: it started from feasibility
          and skipped the customer.
  - key: fv07
    type: mcq
    concept: desirability-feasibility-viability
    difficulty: 2
    verify: true
    stem: How does the guest lecture say the Dyson vacuum cleaner began?
    options:
      - text: With a new motor his engineers had already built, for which he then searched for a household use
        why: >-
          Tempting because Dyson is famous for engineering, but per the lecture he started with the consumer problem;
          starting from a motor is the feasibility-first route.
      - text: With a market survey showing that customers wanted a cheaper vacuum cleaner than existing brands
        why: >-
          Tempting because it sounds customer-led, but the lecture describes consumer pain points, not a price survey,
          and design thinking looks for needs rather than stated preferences.
      - text: >-
          With customers’ frustrations — a dusty, messy bag and suction lost as it filled — then thousands of
          experiments
        correct: true
        why: >-
          Right — per the lecture, Dyson started with the desirability circle (the dusty bag; suction lost as the bag
          filled), then ran a couple of thousand experiments to make it feasible and viable.
      - text: With a licence to sell an existing design, which he then improved through a single round of tests
        why: >-
          Tempting, but the lecture stresses the opposite of one round: he did not know how he would solve it and ran a
          couple of thousand experiments.
  - key: fv08
    type: mcq
    concept: desirability-feasibility-viability
    difficulty: 3
    contrasts-with:
      - design-thinking-process
    stem: >-
      A student writes: "Desirable, feasible and viable are the first three stages of the design thinking process." What
      is wrong?
    options:
      - text: >-
          Nothing is wrong: the process begins with desirability, moves on to feasibility, and ends with a check of
          viability
        why: >-
          Tempting because the lecture does test desirability first, then feasibility and viability, but that is an
          order of testing criteria, not the stages of the process.
      - text: >-
          They are stages, but in the wrong order: viability must come first, because nothing can proceed without
          funding
        why: >-
          Tempting because money matters, but the lecture warns against leading with a business case; and in any case
          these are lenses, not stages.
      - text: They are Meinel and Leifer’s rules of design thinking, but the student has left out the tangibility rule
        why: >-
          Tempting because both are lists, but the four rules are human, ambiguity, redesign and tangibility — a
          different framework from the three lenses.
      - text: >-
          They are three lenses an idea must satisfy together, not stages; the stages run empathy, define, ideate,
          prototype, test
        correct: true
        why: >-
          Right — the sweet spot is an overlap of three lenses; the reading’s stages are Empathy, Define, Ideate,
          Prototype, Test. Desirability is tested first, but the lenses are criteria, not steps.
  - key: fv09
    type: mcq
    concept: desirability-feasibility-viability
    difficulty: 3
    stem: >-
      A start-up’s engineers have built a working drone that delivers coffee, and the founder has a spreadsheet
      forecasting profits. No customer has seen it. Which lens is untested?
    options:
      - text: Desirability
        correct: true
        why: >-
          Right — the drone works (feasible) and there is a profit forecast (a paper viability case), but no one knows
          whether people want it. Start with desirability.
      - text: Feasibility
        why: >-
          Tempting because drones are hard, but a working prototype already shows it can be made — that is feasibility
          evidence.
      - text: Viability
        why: >-
          Tempting because the spreadsheet is only a forecast (the lecture calls such numbers made up), but the lens no
          one has touched at all is desirability.
      - text: "None: it is ready to launch"
        why: >-
          Tempting because it works and has a business case, but that is the path the lecture warns against: the first
          time a customer sees it would be at launch.
  - key: fv10
    type: mcq
    concept: desirability-feasibility-viability
    difficulty: 3
    variant-of: fv09
    stem: >-
      A hospital team has strong evidence that nurses want a new handover app and that it would save money, but the IT
      department says the hospital’s systems cannot support it. Which lens fails?
    options:
      - text: Desirability
        why: >-
          Tempting to pick first, but the facts give strong evidence that nurses want it — desirability is the lens
          already satisfied.
      - text: Viability
        why: >-
          Tempting because cost matters in hospitals, but the facts say it would save money, so viability is satisfied
          (and in health, impact counts too).
      - text: Feasibility
        correct: true
        why: >-
          Right — feasibility asks whether we can make it, technically and organisationally; the IT constraint is a
          feasibility failure even though desirability and viability look strong.
      - text: All three lenses
        why: >-
          Tempting as a cautious answer, but only one lens fails on these facts: it cannot be built on the current
          systems.
  - key: fv11
    type: mcq
    concept: desirability-feasibility-viability
    difficulty: 2
    stem: In Tim Brown's definition, which phrase corresponds to the desirability lens?
    options:
      - text: what is technologically feasible
        why: >-
          Tempting because it is in the definition, but "technologically feasible" is the feasibility lens — can we make
          it?
      - text: what a viable business can convert into consumer value
        why: >-
          Tempting because it mentions consumer value, but this phrase is about a viable business turning the idea into
          value: the viability lens.
      - text: the designer's sensibility and methods
        why: >-
          Tempting because it opens the definition, but the designer’s sensibility and methods are the means; they are
          not one of the three things being matched.
      - text: people's needs
        correct: true
        why: >-
          Right — Brown matches "people’s needs" (desirability) with "what is technologically feasible" (feasibility)
          and "what a viable business can convert into consumer value" (viability).
  - key: fv12
    type: mcq
    concept: desirability-feasibility-viability
    difficulty: 2
    stem: Why does design thinking test desirability first?
    options:
      - text: The number one reason ideas fail is that no one wants them, and checking that early is cheap
        correct: true
        why: >-
          Right — the lecture: "the number one reason ideas fail is no one wants them. So let’s go and find out if
          anyone wants it, and if they do, then we can work out if we can make it."
      - text: Feasibility and viability cannot be assessed at all until after the product has been launched
        why: >-
          Tempting because some evidence only arrives at launch, but the lecture tests feasibility and viability after
          desirability, with more finished prototypes and the business model canvas.
      - text: Customers can tell you exactly which solution to build, so everything after that is execution
        why: >-
          Tempting, but the lecture says customers know their pain points, not the solutions; we ask about their lives,
          not for solutions.
      - text: Desirability is the only lens that matters to government and not-for-profit organisations
        why: >-
          Tempting because viability changes meaning for government, but it does not disappear: it becomes impact for
          citizens. All three lenses still apply.
  - key: fv13
    type: mcq
    concept: desirability-feasibility-viability
    difficulty: 4
    stem: Which is the best evaluation of the desirable–feasible–viable framework from the Week 3 material?
    options:
      - text: >-
          It is complete on its own: once an idea passes all three lenses on paper, the team can proceed to a full
          launch
        why: >-
          Tempting because passing all three sounds sufficient, but ‘on paper’ is the problem: the lecture insists on
          testing with customers before launch.
      - text: A useful test of an idea, but early viability figures are guesses, so evidence must come from experiments
        correct: true
        why: >-
          Right — the lenses are sound, but the lecture’s point is that early business cases are made-up numbers;
          experiments (prototypes, cheap tests) supply the evidence for each lens.
      - text: >-
          It is mainly a marketing tool, so it applies to product ideas but not to services, processes or public
          programs
        why: >-
          Tempting because desirability sounds like marketing, but the lecture applies the lenses to government and
          not-for-profits too, with impact for citizens as viability.
      - text: It is outdated, because the reading replaces it with Meinel and Leifer’s four rules as the test of a good idea
        why: >-
          Tempting because the reading has the four rules, but they describe how design thinking works; Brown’s
          definition in the same reading contains the three lenses.
  - key: fv14
    type: mcq
    concept: desirability-feasibility-viability
    difficulty: 2
    verify: true
    stem: >-
      A kitchenware firm starts by watching how people struggle with jar lids, then runs hundreds of cheap trials before
      costing a product. Which example from the guest lecture does its approach mirror?
    options:
      - text: Segway
        why: >-
          Tempting as the other half of the lecture’s pair, but the Segway started from what could be made and avoided
          customers — the opposite of this firm.
      - text: Zappos
        why: >-
          Tempting because Zappos ran a cheap experiment, but it tested a business model (selling shoes online), not a
          product built from an observed frustration.
      - text: Dyson
        correct: true
        why: >-
          Right — like Dyson in the lecture, it starts in the desirability circle (an observed frustration) and then
          runs many experiments to make a solution feasible and viable.
      - text: Magnum
        why: >-
          Tempting because it is a consumer brand from the lecture, but Magnum appears as an example of a customer
          insight, not of the desirability-first product route.
  - key: fv15
    type: mcq
    concept: desirability-feasibility-viability
    difficulty: 3
    stem: >-
      The guest lecture says design thinking "helps us work on all three" lenses. When does it test feasibility and
      viability?
    options:
      - text: Before any customer contact, so customers only ever see ideas that can definitely be built
        why: >-
          Tempting because it avoids showing impossible ideas, but this is the feasibility-first order the lecture
          criticises; desirability comes first.
      - text: "Never: design thinking deals only with desirability and leaves the other two lenses to engineers"
        why: >-
          Tempting because desirability is emphasised, but the lecture says design thinking helps with all three,
          especially when other tools are brought in.
      - text: At launch, when real sales data replaces the made-up numbers of the business case
        why: >-
          Tempting because launch gives real data, but waiting for launch is the expensive failure the lecture warns
          against.
      - text: Once desirability is clearer, with more finished prototypes and tools such as the business model canvas
        correct: true
        why: >-
          Right — once it is clear the idea is desirable, keep going and start testing and validating for feasibility
          and viability, using the same methods plus tools such as the business model canvas.
  - key: qf04
    type: truefalse
    concept: desirability-feasibility-viability
    difficulty: 1
    set: quickfire
    statement: In the guest lecture, a "viable" idea for a not-for-profit is one that has a big impact for citizens.
    answer: true
    why: >-
      True — viability normally means you can make money from it; the lecture adapts it for government and
      not-for-profits as having a big impact for citizens.
  - key: qf05
    type: truefalse
    concept: desirability-feasibility-viability
    difficulty: 1
    set: quickfire
    statement: >-
      Design thinking starts with feasibility, because there is no point asking customers about something that cannot be
      made.
    answer: false
    why: >-
      False — the lecture says to start with desirability; starting with "how cool is the thing we can make" is the trap
      that leaves the customer to see it only at launch.
  - key: fv16
    type: truefalse
    concept: desirability-feasibility-viability
    difficulty: 2
    statement: >-
      The three lenses — desirable, feasible, viable — can all be found in Tim Brown's definition of design thinking in
      the reading.
    answer: true
    why: >-
      True — Brown matches people’s needs (desirability) with what is technologically feasible (feasibility) and what a
      viable business can convert into consumer value (viability).
  - key: fv17
    type: truefalse
    concept: desirability-feasibility-viability
    difficulty: 2
    statement: A product that works perfectly is, by that fact alone, in the innovation sweet spot.
    answer: false
    why: >-
      False — working is feasibility only; the sweet spot also needs desirability and viability, and many products that
      work fail because nobody wants them.
  - key: pr01
    type: mcq
    concept: design-thinking-process
    difficulty: 1
    set: pretest
    stem: What are the five stages of the design thinking process in the reading's infographic, in order?
    options:
      - text: Define, empathy, prototype, ideate, test
        why: >-
          Tempting because the first of the eight steps is about defining the problem, but even that step says "be
          empathetic" — empathy comes first among the stages.
      - text: Ideate, define, empathy, test, prototype
        why: >-
          Tempting because ideas feel like the starting point, but jumping to solutions is what the guest lecture calls
          a killer of innovation; ideation follows understanding.
      - text: Empathy, define, ideate, prototype, test
        correct: true
        why: >-
          Right — the infographic runs Empathy → Define → Ideate → Prototype → Test, under the headings Understand,
          Create and Deliver.
      - text: Empathy, ideate, define, test, prototype
        why: >-
          Tempting because it keeps empathy first, but ideas come after the problem is defined, and you build a
          prototype before you test it.
  - key: pr02
    type: mcq
    concept: design-thinking-process
    difficulty: 2
    stem: In the reading's infographic, what does each of the three phases end in?
    options:
      - text: Understanding ends in ideas; creation ends in prototypes; delivery ends in profit
        why: >-
          Tempting because ideas follow understanding, but the infographic says understanding ends in insight; creation
          is the phase that ends in ideas.
      - text: Understanding ends in a brief; creation ends in insight; delivery ends in feedback
        why: >-
          Tempting because a brief is a common output, but the reading’s line is that understanding ends in insight, and
          insight is not where creation ends.
      - text: Understanding ends in data; creation ends in a choice; delivery ends in a launch
        why: >-
          Tempting because research produces data, but the infographic stresses insight, not data — and delivery ends in
          ‘reality’, not merely a launch.
      - text: Understanding ends in insight; creation ends in ideas; delivery ends in reality
        correct: true
        why: >-
          Right — the three headings each have an end point: "Understanding ends in insight. Creation ends in ideas.
          Delivery ends in reality."
  - key: pr03
    type: mcq
    concept: design-thinking-process
    difficulty: 2
    stem: Which step of the reading's eight-step list includes "establish a glossary of terms"?
    options:
      - text: Be empathetic in defining the problem
        correct: true
        why: >-
          Right — step 1: decide the issue, agree on the audience, prioritise by urgency, determine what will make the
          project successful, and establish a glossary of terms.
      - text: Be explorative in researching the problem
        why: >-
          Tempting because research needs shared language, but step 2 is about reviewing history, collecting other
          attempts, noting supporters and critics, and talking to end users.
      - text: Be practical in delivering it to the client
        why: >-
          Tempting because delivery needs clear tasks, but step 6 lists task descriptions, planning, resources,
          assigning and executing — not a glossary.
      - text: Be honest in evaluating performance
        why: >-
          Tempting because evaluation needs agreed terms, but step 7 lists consumer feedback, goals, improvements,
          measuring success and documenting.
  - key: pr04
    type: mcq
    concept: design-thinking-process
    difficulty: 2
    stem: >-
      "Set aside emotion and ownership of ideas" and "avoid consensus thinking" belong to which step of the reading’s
      process?
    options:
      - text: Be creative in generating ideas
        why: >-
          Tempting because both concern ideas, but step 3 is about generating many ideas without judging — choosing
          comes later, in step 5.
      - text: Be rational in choosing an idea
        correct: true
        why: >-
          Right — step 5: review the objective, set aside emotion and ownership, avoid consensus thinking, remember the
          most practical solution isn’t always the best, and select the powerful ideas.
      - text: Be iterative in refining your ideas
        why: >-
          Tempting because refining involves judgement, but step 4 is about combining and refining ideas, drafts,
          feedback and prototypes.
      - text: Be empathetic in defining the problem
        why: >-
          Tempting because emotion is mentioned, but step 1 is about defining the problem and audience; setting aside
          emotion belongs to choosing.
  - key: pr05
    type: mcq
    concept: design-thinking-process
    difficulty: 2
    stem: According to step 2 of the reading's process, what brings "the most fruitful ideas for later design"?
    options:
      - text: Taking thought leaders’ opinions into account
        why: >-
          Tempting because step 2 does say to take thought leaders’ opinions into account, but it reserves "most
          fruitful ideas" for talking to end users.
      - text: Collecting examples of other attempts to solve the issue
        why: >-
          Tempting because collecting other attempts is part of step 2 (and echoes the redesign rule), but the reading
          names end users as the most fruitful source.
      - text: Talking to your end users
        correct: true
        why: >-
          Right — step 2 (be explorative in researching the problem): "talk to your end users; this brings you the most
          fruitful ideas for later design".
      - text: Noting the project’s supporters, investors and critics
        why: >-
          Tempting because it is listed in step 2, but noting supporters, investors and critics maps the project’s
          politics; it is not called the most fruitful source of ideas.
  - key: pr06
    type: mcq
    concept: design-thinking-process
    difficulty: 3
    stem: >-
      A team has run interviews, written a problem statement and generated sixty ideas. It is now combining and refining
      ideas, making multiple drafts and seeking feedback from end users. Which step of the reading’s list is it in?
    options:
      - text: Be creative in generating ideas
        why: >-
          Tempting because ideas are involved, but generating the sixty ideas is behind the team; combining, refining
          and drafting is step 4.
      - text: Be rational in choosing an idea
        why: >-
          Tempting because choosing comes next, but the team is still refining and gathering feedback, not yet selecting
          the powerful ideas (step 5).
      - text: Be practical in delivering it
        why: >-
          Tempting because drafts can look like delivery, but delivery (step 6) is planning tasks, resources and
          execution for the client.
      - text: Be iterative in refining your ideas
        correct: true
        why: >-
          Right — step 4: combine, expand and refine ideas; create multiple drafts; seek feedback from a diverse group
          including end users; present a selection; create working prototypes.
  - key: pr07
    type: mcq
    concept: design-thinking-process
    difficulty: 3
    variant-of: pr06
    stem: >-
      After launch, a team gathers consumer feedback, checks whether the solution met its goals, measures success and
      documents what could be improved. Which step is this?
    options:
      - text: Be honest in evaluating performance
        correct: true
        why: >-
          Right — step 7: gather feedback from the consumer, determine if the solution met its goals, discuss
          improvements, measure success (collect data) and document. Then step 8: repeat.
      - text: Be explorative in researching the problem
        why: >-
          Tempting because it gathers information, but step 2 researches the problem before ideas exist; this team is
          evaluating a delivered solution.
      - text: Be practical in delivering it to the client
        why: Tempting because it follows delivery, but step 6 ends at "deliver"; evaluating what was delivered is step 7.
      - text: Be empathetic in defining the problem
        why: >-
          Tempting because consumer feedback sounds empathetic, but step 1 defines the problem at the start, not the
          solution’s performance at the end.
  - key: pr08
    type: mcq
    concept: design-thinking-process
    difficulty: 2
    stem: What is step 8 of the reading's process?
    options:
      - text: Launch
        why: >-
          Tempting because launch feels final, but delivery is step 6, and the list ends with "Repeat", not with a
          launch.
      - text: Repeat
        correct: true
        why: >-
          Right — the eighth step is simply "Repeat": the process is iterative, and honest evaluation (step 7) feeds the
          next round.
      - text: Patent
        why: >-
          Tempting because protecting ideas matters commercially, but the reading’s steps never mention patents; the
          last step is to repeat.
      - text: Report
        why: Tempting because step 7 ends with "document", but the eighth step is to repeat the whole process.
  - key: pr09
    type: mcq
    concept: design-thinking-process
    difficulty: 3
    stem: The reading's process infographic is adapted from a consultancy's diagram and from which book?
    options:
      - text: Peter Rowe’s Design Thinking (1987)
        why: >-
          Tempting because the reading’s brief history lists Rowe’s 1987 book Design Thinking, but the infographic
          credits Simon, not Rowe.
      - text: Roberto Verganti’s Design Driven Innovation
        why: >-
          Tempting because Verganti wrote the foreword and this book, but the process infographic is not credited to
          him.
      - text: Herbert Simon’s The Sciences of the Artificial (1969)
        correct: true
        why: >-
          Right — the infographic is "adapted from a diagram and steps via Designworks’ Luke van O, and details from
          Herbert Simon’s The Sciences of the Artificial (1969, MIT Press)".
      - text: "Meinel and Leifer’s Design Thinking: Understand, Improve, Apply"
        why: >-
          Tempting because it is the source of the four rules in the same reading, but the process infographic credits
          Simon’s book.
  - key: pr10
    type: mcq
    concept: design-thinking-process
    difficulty: 3
    contrasts-with:
      - four-rules-of-design-thinking
    stem: Which of these is a stage of the design thinking process rather than one of Meinel and Leifer’s four rules?
    options:
      - text: Prototype
        correct: true
        why: >-
          Right — Prototype is the fourth stage (empathy, define, ideate, prototype, test). The rules are the human,
          ambiguity, redesign and tangibility rules.
      - text: Tangibility
        why: >-
          Tempting because the tangibility rule treats prototypes as communication media, but it is a rule, not the
          prototype stage itself.
      - text: Ambiguity
        why: >-
          Tempting because ambiguity is preserved during the process, but "design thinkers must preserve ambiguity" is
          the second rule, not a stage.
      - text: Redesign
        why: >-
          Tempting because redesign sounds like iterating, but "all design is redesign" is the third rule — about past
          solutions to old needs.
  - key: pr11
    type: mcq
    concept: design-thinking-process
    difficulty: 2
    stem: The reading's executive summary says the iterative nature of design thinking can do what?
    options:
      - text: Guarantee that the first solution is correct, because each stage checks the one before it
        why: >-
          Tempting because iteration checks work, but nothing in the reading guarantees a first solution; iteration
          exists because early solutions often need changing.
      - text: Offer solutions as the process runs, open up alternative paths, or redefine the initial problem
        correct: true
        why: >-
          Right — "Its iterative nature can offer solutions to problems as the process runs – potentially opening up
          alternative paths, new solutions or, indeed, the ability to redefine the initial problem."
      - text: Remove the need for customer research, because each round supplies its own feedback
        why: >-
          Tempting because iterations generate feedback, but that feedback comes from customers and end users —
          iteration depends on research, it does not replace it.
      - text: Fix the problem definition at the start, so that later rounds cannot drift from the brief
        why: >-
          Tempting because briefs matter, but the reading says the opposite: iteration can redefine the initial problem,
          and Gemser notes consultants often go beyond the brief.
  - key: pr12
    type: mcq
    concept: design-thinking-process
    difficulty: 3
    stem: In the guest lecture's account of the design thinking journey, what can happen at any stage?
    options:
      - text: The team must finish every stage once before it is allowed to revisit any earlier stage
        why: >-
          Tempting because the stages are drawn in a line, but the lecture says the journey really looks like a loop:
          you can go back at any stage.
      - text: The team may skip straight to launch whenever the business case looks strong enough
        why: >-
          Tempting because a strong case sounds like permission, but the lecture warns that an innovation’s early
          business case is largely made-up numbers.
      - text: The team may go back a stage, keep going, change one key element, or kill the idea and move on
        correct: true
        why: >-
          Right — per the lecture, at any stage you may go back a stage, keep progressing, pivot (change a key element
          of the product or business model), or kill the idea when time or money runs out.
      - text: The team may only move forward, because going back wastes the money already spent
        why: >-
          Tempting as a sunk-cost instinct, but the journey is iterative, and failing early (and going back) is cheap
          compared with failing at launch.
  - key: pr13
    type: mcq
    concept: design-thinking-process
    difficulty: 4
    stem: >-
      A charity’s team has defined its problem and is about to choose among ideas. The director insists the team pick
      the idea most staff like best. Which step’s advice does this ignore, and how?
    options:
      - text: >-
          Be creative in generating ideas: it judges ideas, which the reading says to avoid while brainstorming any
          problem
        why: >-
          Tempting because judging is involved, but the no-judging rule applies while generating ideas; at the choosing
          stage judgement is required — just not by consensus.
      - text: "Be empathetic in defining the problem: it skips agreeing on who the project’s audience is"
        why: >-
          Tempting because the director overrides others, but the team has already defined the problem; the issue arises
          at the choosing step.
      - text: "Be honest in evaluating performance: it ignores whether the solution met its goals"
        why: >-
          Tempting because evaluation sounds similar, but step 7 evaluates a delivered solution’s performance, and
          nothing has been delivered yet.
      - text: "Be rational in choosing an idea: it relies on consensus and ownership, which the step says to set aside"
        correct: true
        why: >-
          Right — step 5 says set aside emotion and ownership of ideas, avoid consensus thinking, and remember the most
          practical solution isn’t always the best; "what most staff like" is consensus.
  - key: pr14
    type: mcq
    concept: design-thinking-process
    difficulty: 2
    stem: In the reading’s infographic, which heading sits over the Empathy and Define stages?
    options:
      - text: Understand
        correct: true
        why: >-
          Right — Empathy and Define sit under Understand, the phase that "ends in insight"; Ideate sits under Create,
          and Prototype and Test under Deliver.
      - text: Create
        why: >-
          Tempting because defining shapes the ideas, but Create is the phase that ends in ideas — where ideation
          happens.
      - text: Deliver
        why: >-
          Tempting as the reading’s final phase, but Deliver covers prototyping and testing — "delivery ends in
          reality".
      - text: Exploration
        why: >-
          Tempting because step 2 says "be explorative", but that is one of the eight steps; the heading over empathy
          and define is Understand.
  - key: pr15
    type: mcq
    concept: design-thinking-process
    difficulty: 3
    stem: Which pair of activities does step 3 of the reading's process (be creative in generating ideas) require?
    options:
      - text: Select the most practical idea of the set, and present it to the client for a final decision on it
        why: >-
          Tempting because ideas must be chosen, but selection belongs to step 5 — which also warns that the most
          practical solution isn’t always the best.
      - text: Identify end users’ needs and motivations, and generate as many ideas as possible to serve them
        correct: true
        why: >-
          Right — step 3: identify the needs and motivations of your end users; generate as many ideas as possible to
          serve them; log the session; do not judge or debate; one conversation at a time.
      - text: Build a working prototype, and measure its success using consumer data
        why: >-
          Tempting because prototypes follow ideas, but working prototypes are in step 4, and measuring success is in
          step 7.
      - text: Plan the tasks, and assign resources to each member of the team
        why: Tempting because teams need organising, but planning tasks and assigning resources is step 6, delivery.
  - key: qf06
    type: truefalse
    concept: design-thinking-process
    difficulty: 1
    set: quickfire
    statement: In the reading's infographic, Ideate comes before Define.
    answer: false
    why: >-
      False — the order is Empathy, Define, Ideate, Prototype, Test: the problem is defined before ideas are generated,
      and the guest lecture warns against jumping to solutions.
  - key: qf07
    type: truefalse
    concept: design-thinking-process
    difficulty: 1
    set: quickfire
    statement: The reading's eight-step process ends with the instruction "Repeat".
    answer: true
    why: >-
      True — step 8 is "Repeat": after evaluating performance honestly (step 7), the process starts again, which is why
      design thinking is called iterative.
  - key: qf08
    type: truefalse
    concept: design-thinking-process
    difficulty: 2
    set: quickfire
    statement: Step 5 of the reading’s process advises teams to choose the idea that most people in the room agree on.
    answer: false
    why: >-
      False — step 5 (be rational in choosing an idea) says to avoid consensus thinking and set aside emotion and
      ownership of ideas; the most practical solution isn’t always the best.
  - key: pr16
    type: truefalse
    concept: design-thinking-process
    difficulty: 2
    statement: The reading’s process tells teams to "reserve judgement and maintain neutrality" while refining ideas.
    answer: true
    why: >-
      True — step 4 (be iterative in refining your ideas) includes "reserve judgement and maintain neutrality",
      alongside multiple drafts, diverse feedback and working prototypes.
  - key: ru01
    type: mcq
    concept: four-rules-of-design-thinking
    difficulty: 1
    stem: Which rule says "all design activity is ultimately social in nature"?
    options:
      - text: The Ambiguity Rule
        why: >-
          Tempting because social settings are ambiguous, but the ambiguity rule is that design thinkers must preserve
          ambiguity — keeping the box open for chance discovery.
      - text: The Redesign Rule
        why: >-
          Tempting because human needs are central to it, but the redesign rule says all design is redesign: the needs
          are old, the solutions change.
      - text: The Tangibility Rule
        why: >-
          Tempting because prototypes are shared socially, but the tangibility rule is that making ideas tangible always
          facilitates communication.
      - text: The Human Rule
        correct: true
        why: >-
          Right — the human rule: successful innovation always brings us back to the ‘human-centric point of view’,
          solving technical problems in ways that satisfy human needs.
  - key: ru02
    type: mcq
    concept: four-rules-of-design-thinking
    difficulty: 2
    stem: The Ambiguity Rule says there is no chance for "chance discovery" when what happens?
    options:
      - text: The box is closed tightly, constraints are listed excessively and fear of failure is always at hand
        correct: true
        why: >-
          Right — "There is no chance for ‘chance discovery’ if the box is closed tightly, the constraints enumerated
          excessively and the fear of failure is always at hand."
      - text: The team includes people from too many disciplines, so no shared vocabulary can develop
        why: >-
          Tempting because step 1 asks for a glossary, but the ambiguity rule blames tight boxes, excessive constraints
          and fear of failure — not diverse teams.
      - text: Prototypes are built too early, before the problem has been defined in enough detail
        why: >-
          Tempting because order matters, but the rule does not criticise early prototypes; the tangibility rule says
          making ideas tangible always helps.
      - text: Customers are consulted too often, so the team only ever hears about what already exists
        why: >-
          Tempting because it echoes Verganti’s caution, but the ambiguity rule is about constraints and fear of
          failure, not customer contact.
  - key: ru03
    type: mcq
    concept: four-rules-of-design-thinking
    difficulty: 2
    stem: What does the Redesign Rule ask designers to understand?
    options:
      - text: How competitors are likely to redesign their own products next year
        why: >-
          Tempting because the rule looks forward 5–20 years, but its focus is the history of human needs and their
          solutions, not rivals’ next moves.
      - text: How the human needs they seek to satisfy were addressed in the past
        correct: true
        why: >-
          Right — needs "have been with us for millennia"; because technology and social circumstances change,
          understand how these needs have been addressed in the past, then apply foresight tools.
      - text: How to redesign a prototype after each round of customer testing
        why: >-
          Tempting because iteration is redesign in a loose sense, but the rule’s claim is that all design is redesign
          of solutions to long-standing needs.
      - text: How to reverse-engineer a rival’s product to expose its weaknesses
        why: >-
          Tempting because it studies existing solutions, but the rule looks at how needs were met over time, not at
          attacking a rival’s product.
  - key: ru04
    type: mcq
    concept: four-rules-of-design-thinking
    difficulty: 2
    stem: What do Meinel and Leifer call one of their most recent findings, under the Tangibility Rule?
    options:
      - text: That prototypes must be finished before testing
        why: >-
          Tempting because finished prototypes are clearer, but the rule is about tangibility helping communication, not
          finish; the lecture favours cheap, early prototypes.
      - text: That ambiguity should be removed early in a project
        why: >-
          Tempting because tangibility reduces vagueness, but the ambiguity rule says to preserve ambiguity — the
          opposite of removing it early.
      - text: That prototypes are communication media
        correct: true
        why: >-
          Right — "it is only in the past few years that we have come to realise that ‘prototypes are communication
          media’", with bandwidth, granularity, time constants and context dependencies.
      - text: That design is mainly a matter of aesthetics and form
        why: >-
          Tempting because "tangible" suggests form, but the rule is about communication, and the reading’s debate
          rejects the claim that design is "simply aesthetics".
  - key: ru05
    type: mcq
    concept: four-rules-of-design-thinking
    difficulty: 3
    stem: >-
      A design team keeps its brief deliberately open and tolerates false starts, because tightly listed constraints
      would shut out unexpected discoveries. Which rule is it following?
    options:
      - text: The Human Rule
        why: >-
          Tempting because teams are social, but nothing in the scenario is about satisfying human needs; it is about
          keeping the brief open.
      - text: The Redesign Rule
        why: >-
          Tempting because false starts lead to redesign, but the redesign rule is about learning from past solutions to
          old needs.
      - text: The Tangibility Rule
        why: >-
          Tempting because false starts may involve prototypes, but the scenario’s point is openness, not making ideas
          tangible in order to communicate.
      - text: The Ambiguity Rule
        correct: true
        why: >-
          Right — preserve ambiguity: chance discovery needs an open box, constraints that are not enumerated
          excessively, and freedom from constant fear of failure.
  - key: ru06
    type: mcq
    concept: four-rules-of-design-thinking
    difficulty: 3
    variant-of: ru05
    stem: >-
      Before generating ideas for a new way to carry water, a team studies how people have carried water over the
      centuries and then estimates conditions 20 years ahead. Which rule?
    options:
      - text: The Redesign Rule
        correct: true
        why: >-
          Right — all design is redesign: understand how a long-standing need was met in the past, then use ‘foresight
          tools and methods’ to estimate conditions five, 10 or even 20 years ahead.
      - text: The Human Rule
        why: >-
          Tempting because carrying water is a human need, but the distinctive move here is studying past solutions and
          looking ahead — the redesign rule.
      - text: The Ambiguity Rule
        why: >-
          Tempting because the future is uncertain, but the ambiguity rule is about keeping constraints open, not
          studying the history of a need.
      - text: The Tangibility Rule
        why: >-
          Tempting because the team may build models later, but nothing in the scenario makes an idea tangible; it is
          historical and foresight research.
  - key: ru07
    type: mcq
    concept: four-rules-of-design-thinking
    difficulty: 3
    variant-of: ru05
    stem: >-
      A team builds a rough cardboard model so that engineers, marketers and customers can all talk about the same idea.
      Which rule explains why this helps?
    options:
      - text: The Human Rule
        why: >-
          Tempting because customers are involved, but the reason the model helps is that it is tangible — a shared
          object to talk about.
      - text: The Tangibility Rule
        correct: true
        why: >-
          Right — making ideas tangible always facilitates communication; prototypes are ‘communication media’, letting
          people from different backgrounds discuss the same thing.
      - text: The Ambiguity Rule
        why: >-
          Tempting because a rough model leaves things open, but the rule that explains the communication benefit is
          tangibility.
      - text: The Redesign Rule
        why: >-
          Tempting because the model will be revised, but the redesign rule is about past solutions to old needs, not
          about prototypes as media.
  - key: ru08
    type: mcq
    concept: four-rules-of-design-thinking
    difficulty: 2
    stem: The Human Rule includes acknowledging "the human element" in whom?
    options:
      - text: Customers who make complaints
        why: >-
          Tempting because complaints reveal needs, but the rule’s phrase extends the human element inward, to
          technologists and managers.
      - text: Professional designers only
        why: >-
          Tempting because designers are central, but the rule names all technologists and managers — design thinking is
          not only for designers.
      - text: All technologists and managers
        correct: true
        why: >-
          Right — the rule is the imperative to solve technical problems in ways that satisfy human needs "and
          acknowledge the human element in all technologists and managers".
      - text: Shareholders and investors
        why: >-
          Tempting because viability matters, but the human rule does not mention investors; it names technologists and
          managers.
  - key: ru09
    type: mcq
    concept: four-rules-of-design-thinking
    difficulty: 2
    stem: Where do the four rules of design thinking in the reading come from?
    options:
      - text: Tim Brown’s TED Talk "Designers – think big!"
        why: >-
          Tempting because Brown is the best-known name in the reading, but his TED talk is only recommended viewing;
          the rules are Meinel and Leifer’s.
      - text: The Design Management Institute’s Design Value Index
        why: >-
          Tempting because DMI appears in the reading, but the DVI measured design-led firms’ stock performance; it sets
          out no rules.
      - text: Herbert Simon’s The Sciences of the Artificial (1969)
        why: Tempting because Simon is credited in the process infographic, but the four rules come from Meinel and Leifer.
      - text: Meinel and Leifer’s book (2011)
        correct: true
        why: >-
          Right — "In Design Thinking: Understand, Improve, Apply (2011, Springer), Christoph Meinel and Larry Leifer
          write that there are four rules to design thinking."
  - key: ru10
    type: mcq
    concept: four-rules-of-design-thinking
    difficulty: 3
    stem: Why does the Ambiguity Rule say innovation needs ambiguity?
    options:
      - text: Ambiguous briefs let the client change the budget late in the project without the designers objecting to it
        why: >-
          Tempting as a cynical reading, but the rule is about discovery, not contracts: do not close the box too
          tightly.
      - text: >-
          Innovation demands experiments at the limits of our knowledge and control, with freedom to see things
          differently
        correct: true
        why: >-
          Right — "Innovation demands experimentations at the limits of our knowledge, at the limits of our ability to
          control events and with freedom to see things differently."
      - text: Customers prefer products whose purpose is left open, so that each buyer can decide how they will use them
        why: >-
          Tempting because open-ended products exist, but the rule speaks to the designers’ process, not to how
          customers use finished products.
      - text: Ambiguity reduces the number of ideas on the table, which makes the later choosing step faster and fairer
        why: >-
          Tempting because tidy processes sound efficient, but preserving ambiguity opens the field; cutting ideas is
          the opposite of what the rule seeks.
  - key: ru11
    type: mcq
    concept: four-rules-of-design-thinking
    difficulty: 4
    contrasts-with:
      - design-thinking-process
    stem: How do the four rules relate to the five-stage process in the reading?
    options:
      - text: The rules are the first four stages, and testing is the fifth stage that completes the process
        why: >-
          Tempting because there are four rules and five stages, but the rules are not stages; the stages are empathy,
          define, ideate, prototype and test.
      - text: The rules replace the stages for experienced teams, who no longer need a fixed sequence to follow
        why: >-
          Tempting because experts work flexibly, but the reading presents both side by side; nothing says the rules
          replace the process.
      - text: The rules are principles that hold across the process; the stages are the sequence of activities
        correct: true
        why: >-
          Right — Meinel and Leifer’s rules (human, ambiguity, redesign, tangibility) describe how design thinking works
          throughout; the infographic’s stages (empathy to test) set out what is done in what order.
      - text: The rules apply only at the prototype stage, because each of them is about making ideas tangible
        why: >-
          Tempting because tangibility concerns prototypes, but only one rule is about tangibility; the human and
          redesign rules bear on research and understanding.
  - key: ru12
    type: mcq
    concept: four-rules-of-design-thinking
    difficulty: 2
    stem: The Redesign Rule says the human needs we seek to satisfy have been with us for how long?
    options:
      - text: Decades
        why: "Tempting because markets change fast, but the rule stresses how old the needs are: millennia, not decades."
      - text: Centuries
        why: Tempting and close, but the rule’s word is millennia — the needs are as old as people themselves.
      - text: Since the industrial revolution
        why: >-
          Tempting because modern products date from then, but the rule says the needs are millennia old; only the
          solutions are recent.
      - text: Millennia
        correct: true
        why: >-
          Right — "The human needs that we seek to satisfy have been with us for millennia"; what changes is technology
          and social circumstances.
  - key: ru13
    type: mcq
    concept: four-rules-of-design-thinking
    difficulty: 3
    stem: Which practice does the Human Rule most directly justify?
    options:
      - text: Grounding solutions to technical problems in research into people’s needs
        correct: true
        why: >-
          Right — the human rule is "the imperative to solve technical problems in ways that satisfy human needs";
          customer and user research is how a team finds those needs.
      - text: Making a cardboard model so people from different teams can communicate
        why: >-
          Tempting because models are shared between people, but making ideas tangible in order to communicate is the
          tangibility rule.
      - text: Studying how a need was met over the centuries before generating ideas
        why: Tempting because the needs are human, but studying past solutions to old needs is the redesign rule.
      - text: Keeping constraints loose so that chance discoveries remain possible
        why: Tempting because it concerns people’s freedom to explore, but keeping constraints loose is the ambiguity rule.
  - key: ru14
    type: mcq
    concept: four-rules-of-design-thinking
    difficulty: 2
    stem: According to the reading, for how long had conceptual prototyping been central to Meinel and Leifer’s research?
    options:
      - text: Only in the past few years
        why: >-
          Tempting because the rule mentions "the past few years", but that is when they realised prototypes are
          communication media, not when prototyping began.
      - text: For the entire period of their research
        correct: true
        why: >-
          Right — "while conceptual prototyping has been a central activity in design thinking during the entire period
          of our research", only recently did they see prototypes as communication media.
      - text: "Never: they had rejected prototyping as too costly"
        why: Tempting only if the rule is misread; it says prototyping has been central throughout their research.
      - text: Only since Stanford’s d.school first opened
        why: Tempting because the d.school appears in the reading, but the rule does not date prototyping from its opening.
  - key: ru15
    type: mcq
    concept: four-rules-of-design-thinking
    difficulty: 3
    stem: >-
      A bank’s innovation team writes a 40-point list of constraints and punishes pilots that fail. Which rule is it
      breaking, and why?
    options:
      - text: "The Tangibility Rule: a long list of constraints is not a prototype, so nobody can communicate"
        why: >-
          Tempting because lists are not tangible, but the scenario’s problem is closing the box and fearing failure —
          the ambiguity rule.
      - text: "The Redesign Rule: the team ignores how banking needs have been met in the past"
        why: Tempting because banking has a long history, but nothing in the facts says the team ignores past solutions.
      - text: "The Ambiguity Rule: tight constraints and fear of failure leave no room for chance discovery"
        correct: true
        why: >-
          Right — the ambiguity rule warns that chance discovery is impossible "if the box is closed tightly, the
          constraints enumerated excessively and the fear of failure is always at hand".
      - text: "The Human Rule: punishing staff ignores the human element in managers"
        why: >-
          Tempting because punishment affects people, but the rule that names constraints and fear of failure is the
          ambiguity rule.
  - key: ru16
    type: match
    concept: four-rules-of-design-thinking
    difficulty: 2
    prompt: Match each of Meinel and Leifer’s rules to its statement.
    pairs:
      - left: The Human Rule
        right: All design activity is ultimately social in nature
      - left: The Ambiguity Rule
        right: Design thinkers must preserve ambiguity
      - left: The Redesign Rule
        right: All design is redesign
      - left: The Tangibility Rule
        right: Making ideas tangible always facilitates communication
  - key: qf09
    type: truefalse
    concept: four-rules-of-design-thinking
    difficulty: 1
    set: quickfire
    statement: The Tangibility Rule says prototypes are communication media.
    answer: true
    why: >-
      True — Meinel and Leifer: "it is only in the past few years that we have come to realise that ‘prototypes are
      communication media’", with bandwidth, granularity and time constants.
  - key: qf10
    type: truefalse
    concept: four-rules-of-design-thinking
    difficulty: 1
    set: quickfire
    statement: The Ambiguity Rule tells design thinkers to remove ambiguity as early as possible.
    answer: false
    why: >-
      False — it says design thinkers must preserve ambiguity: chance discovery needs an open box, not excessive
      constraints or a constant fear of failure.
  - key: qf11
    type: truefalse
    concept: four-rules-of-design-thinking
    difficulty: 2
    set: quickfire
    statement: The Redesign Rule holds that the human needs design serves are new, created by modern technology.
    answer: false
    why: >-
      False — the needs "have been with us for millennia"; what changes is technology and social circumstances, so we
      study past solutions and then look ahead.
  - key: ru17
    type: truefalse
    concept: four-rules-of-design-thinking
    difficulty: 2
    statement: Meinel and Leifer's Human Rule asks for technical problems to be solved in ways that satisfy human needs.
    answer: true
    why: >-
      True — the human rule is "the imperative to solve technical problems in ways that satisfy human needs and
      acknowledge the human element in all technologists and managers".
  - key: em01
    type: mcq
    concept: empathy-and-human-centred-design
    difficulty: 1
    set: pretest
    stem: What is the difference between affective and cognitive empathy, according to the reading?
    options:
      - text: Affective is a shared, mirrored emotion; cognitive is perspective taking — understanding another’s worldview
        correct: true
        why: >-
          Right — affective empathy is a mirrored response (see someone sad, feel sad); cognitive empathy is stepping
          into someone else’s world: their worldview, beliefs, fears and experiences.
      - text: Affective is understanding another’s worldview; cognitive is feeling the same emotion that they feel
        why: >-
          Tempting because the two terms are close, but this reverses them: affective is emotional mirroring, cognitive
          is perspective taking.
      - text: Affective is empathy for customers; cognitive is empathy for colleagues inside the organisation
        why: >-
          Tempting because empathy has different audiences, but the reading defines the two kinds by what happens in the
          observer, not by whom they observe.
      - text: Affective is measured in surveys; cognitive is observed in the field, in the course of everyday habits
        why: >-
          Tempting because observation is part of empathetic design, but the two kinds are defined by mirroring versus
          perspective taking, not by research method.
  - key: em02
    type: mcq
    concept: empathy-and-human-centred-design
    difficulty: 2
    stem: Which roadblock to empathy is "people see things as they expect them to be"?
    options:
      - text: Egoism
        why: >-
          Tempting because it is close, but egoism is seeing things as we want them to be — a personal investment in a
          belief.
      - text: Idealism
        correct: true
        why: >-
          Right — idealism: people see things as they expect them to be, and a lack of evidence beyond their
          expectations may lead them to under- or overestimate the situation.
      - text: Realism
        why: >-
          Tempting because it is about perception, but realism is thinking we see things as they are, projecting our own
          perspective onto someone else’s situation.
      - text: Circumstantialism
        why: >-
          Tempting, but circumstantialism is thinking only about the things we see — failing to connect information not
          present at the moment.
  - key: em03
    type: mcq
    concept: empathy-and-human-centred-design
    difficulty: 2
    variant-of: em02
    stem: >-
      An observer is personally invested in a belief about customers and predicts their behaviour from that conviction,
      whatever the evidence. Which roadblock to empathy?
    options:
      - text: Idealism
        why: >-
          Tempting because expectations are involved, but idealism is seeing things as we expect them; the scenario
          stresses personal investment in a belief.
      - text: Realism
        why: >-
          Tempting because the observer thinks they are right, but realism is believing we see things as they are;
          egoism adds the personal investment.
      - text: Egoism
        correct: true
        why: >-
          Right — egoism: people see things as they want them to be; observations are personally invested in specific
          beliefs, kept under any circumstance, and used to predict others’ behaviour.
      - text: Circumstantialism
        why: >-
          Tempting, but circumstantialism is failing to connect information not present at the moment; the scenario is
          about clinging to a belief.
  - key: em04
    type: mcq
    concept: empathy-and-human-centred-design
    difficulty: 3
    variant-of: em02
    stem: >-
      A researcher watching shoppers fails to connect what she already knows about their budgets, because it is not
      visible in the store. Which roadblock to empathy?
    options:
      - text: Idealism
        why: >-
          Tempting because expectations shape observation, but the scenario is about information missing from the scene,
          not about expectations.
      - text: Egoism
        why: >-
          Tempting, but egoism needs a personal investment in a belief; this researcher simply fails to connect what is
          not in front of her.
      - text: Realism
        why: >-
          Tempting because she trusts what she sees, but realism is projecting our own perspective as the truth; the
          scenario turns on unseen information.
      - text: Circumstantialism
        correct: true
        why: >-
          Right — circumstantialism: people think only about the things they see; it includes failing to connect
          information we know but do not relate to that situation.
  - key: em05
    type: mcq
    concept: empathy-and-human-centred-design
    difficulty: 3
    variant-of: em02
    stem: >-
      A manager insists he "sees things as they are"; told he misread his customers, he blames something in the scene
      rather than his own assumptions. Which roadblock to empathy?
    options:
      - text: Realism
        correct: true
        why: >-
          Right — realism: people think they see things as they are; they find it hard to accept a misinterpretation and
          tend to blame something in the scene rather than their own expectations and beliefs.
      - text: Idealism
        why: >-
          Tempting because expectations are involved, but the defining mark here is the belief that he sees things as
          they are, and blaming the scene — realism.
      - text: Egoism
        why: >-
          Tempting because he defends himself, but egoism is seeing things as we want them to be; the scenario is about
          claiming to see things as they are.
      - text: Circumstantialism
        why: >-
          Tempting because the scene is mentioned, but circumstantialism is thinking only about what is visible; this
          manager misattributes his own error.
  - key: em06
    type: mcq
    concept: empathy-and-human-centred-design
    difficulty: 2
    stem: What insight led Temple Grandin to redesign livestock facilities?
    options:
      - text: Animals were calmer in larger herds, so she designed wider pens that held more cattle at once
        why: >-
          Tempting as a plausible welfare idea, but the reading’s insight is about the straight path; nothing is said
          about herd size.
      - text: Animals reacted badly when led in a straight line, so she designed curved corrals
        correct: true
        why: >-
          Right — "off the back of a simple insight that animals reacted adversely when being led in a straight line,
          she designed adapted curved corrals", reducing stress, panic and injury.
      - text: Animals responded to sound, so she installed recorded music to calm them during transport
        why: >-
          Tempting because calming is the goal, but the reading’s solution was a change of path — curved corrals — not
          sound.
      - text: Animals feared their handlers, so she replaced the handlers with a system of automated gates
        why: >-
          Tempting, but the reading says she changed the shape of the path; it does not mention automating or replacing
          handlers.
  - key: em07
    type: mcq
    concept: empathy-and-human-centred-design
    difficulty: 3
    stem: Why does the reading find Temple Grandin’s empathetic design especially instructive?
    options:
      - text: She ran large statistical surveys of farmers before she changed any of the facilities
        why: >-
          Tempting because research matters, but the reading credits observation of animal behaviour, not surveys of
          farmers.
      - text: She asked the meat-processing companies what they wanted, and then built exactly that design for them
        why: >-
          Tempting because the industry benefited (meat quality apparently improved), but the insight came from the
          animals’ behaviour, not from asking firms.
      - text: She observed the animals from an unaffected standpoint, without assuming "that’s just what cows do"
        correct: true
        why: >-
          Right — by seeing the world differently she observed behaviour "with an unaffected standpoint"; others’
          assumptions might have led them to conclude that cows are just dumb animals.
      - text: She copied a solution that was already used in another country’s livestock facilities
        why: >-
          Tempting because the redesign rule values past solutions, but the reading presents the curved corrals as her
          own insight.
  - key: em08
    type: mcq
    concept: empathy-and-human-centred-design
    difficulty: 2
    stem: Human-centred design (HCD) works on which premise, according to the reading?
    options:
      - text: Users can state their needs precisely, so asking them directly is enough to define the product
        why: >-
          Tempting because asking seems direct, but HCD targets unarticulated needs — ones users may not recognise;
          Henry Ford’s "faster horses" makes the point.
      - text: Designers’ own assumptions are the most reliable guide, because users cannot see the future
        why: >-
          Tempting because Verganti warns customers can’t see far ahead, but working from designers’ own assumptions is
          the old ‘objective’ perspective HCD replaced.
      - text: Technology determines what people need, so research should start with the engineers
        why: >-
          Tempting in an engineering firm, but HCD starts from people; starting from what technology can do is the
          feasibility-first trap.
      - text: A deep understanding of users’ unarticulated needs, gained through empathy, inspires innovation
        correct: true
        why: >-
          Right — "HCD works on the premise that acquiring a deep understanding of users’ unarticulated needs (through
          empathy) inspires creativity and innovation."
  - key: em09
    type: mcq
    concept: empathy-and-human-centred-design
    difficulty: 2
    stem: What shift does the empathy piece in the reading say happened about twenty years ago?
    options:
      - text: From designers working on their own assumptions to a human-centred perspective with users at its heart
        correct: true
        why: >-
          Right — design shifted from an objective perspective, where designers worked from their own assumptions, to a
          human-centred one that involves users and puts them at the heart of the process.
      - text: >-
          From a human-centred perspective to a data-driven one, as analytics made observing users in their environments
          unnecessary
        why: >-
          Tempting because data is a theme elsewhere, but the empathy piece describes a move towards users, not away
          from them.
      - text: From in-house designers to outside consultancies, as firms outsourced most of their customer research
        why: >-
          Tempting because consultancies feature in the reading, but the shift is about whose perspective drives design,
          not who employs the designers.
      - text: From product design to service design, as manufacturing moved offshore and services grew
        why: >-
          Tempting because design thinking spread to services, but the shift described is from designer assumptions to
          user-centred design.
  - key: em10
    type: mcq
    concept: empathy-and-human-centred-design
    difficulty: 3
    stem: Gerda Gemser describes two streams in design thinking research. Which pairing is correct?
    options:
      - text: IDEO avoids customers to protect its ideas; Verganti immerses designers in customers’ daily lives
        why: >-
          Tempting because both appear in the reading, but this reverses them: IDEO champions immersion and empathy;
          Verganti keeps some distance.
      - text: IDEO measures design by stock prices; Verganti measures it by customer satisfaction scores
        why: >-
          Tempting because the Design Value Index measured stock value, but that was DMI’s index; the two streams differ
          on customer engagement.
      - text: IDEO goes into the customer’s world; Verganti warns against engaging with the customer too much
        correct: true
        why: >-
          Right — Gemser: IDEO is a proponent of going into the customer’s world; Verganti says not to engage with the
          customer too much, as most customers aren’t trained to see far-future possibilities.
      - text: IDEO works only with start-ups; Verganti works only with large, traditional organisations
        why: >-
          Tempting because the reading discusses start-ups and large firms, but the two streams are defined by how
          closely to engage customers.
  - key: em11
    type: mcq
    concept: empathy-and-human-centred-design
    difficulty: 3
    stem: >-
      Henry Ford’s line "If I had asked people what they wanted, they would have said faster horses" supports which idea
      in the reading?
    options:
      - text: Customers’ stated wants are the best guide, so ask them early and then build what they say
        why: >-
          Tempting because that is the literal suggestion, but Ford’s point is the opposite: asking would have produced
          faster horses, not cars.
      - text: Speed is the need customers value most, so innovation should focus on performance
        why: >-
          Tempting because "faster" is in the quote, but Verganti warns that performance improvements (a faster car)
          need not create value.
      - text: Horses were better than cars, so incumbents should protect their existing products
        why: Tempting only as a joke; the quote is about the limits of asking customers, not a defence of incumbents.
      - text: Customers describe needs in terms of what they already know, so design must look for unarticulated needs
        correct: true
        why: >-
          Right — the reading uses it beside Dorothy Leonard’s point that ‘delight the customer’ gains real meaning when
          products push beyond what customers anticipate.
  - key: em12
    type: mcq
    concept: empathy-and-human-centred-design
    difficulty: 4
    stem: >-
      A bank’s researcher interviews customers about branch visits and records only what they say. Using the reading’s
      account of empathy, what should she add?
    options:
      - text: Observation in their environment and perspective taking, setting aside her own beliefs
        correct: true
        why: >-
          Right — empathetic design observes users in their environments; cognitive empathy is perspective taking; and
          true empathy sets aside personal beliefs and seeks further evidence without judgement.
      - text: A much larger interview sample, so that what customers say becomes statistically reliable
        why: >-
          Tempting because larger samples help surveys, but the reading’s empathetic design is closer to anthropology
          than to market science.
      - text: "Affective empathy alone: she should feel what customers feel and report her own emotions"
        why: >-
          Tempting because empathy sounds emotional, but mirroring feelings is not enough; the reading stresses
          understanding worldviews and setting aside one’s own expectations.
      - text: "Nothing: interviews are exactly the method the reading recommends for discovering needs"
        why: >-
          Tempting because interviews are useful, but the reading stresses observing users in everyday habits; what
          people say misses unarticulated needs.
  - key: em13
    type: mcq
    concept: empathy-and-human-centred-design
    difficulty: 2
    stem: Why does MailChimp treat empathy as a key differentiator, according to the reading?
    options:
      - text: Empathy lets it charge higher prices than its rivals for the same email product
        why: >-
          Tempting because differentiation can support price, but the reading says nothing about price; Walter’s point
          is standing out when building is easy.
      - text: When everyone can create quickly, caring for customers sets a brand apart
        correct: true
        why: >-
          Right — Aarron Walter of MailChimp: "When everyone can create very quickly, what is it that will distinguish
          your product or brand from the rest? Caring for your customers."
      - text: Empathy replaces the need for product testing, which shortens its time to market
        why: >-
          Tempting because empathy informs design, but nothing in the reading says it replaces testing; prototyping and
          testing remain stages.
      - text: Empathy training is required by regulators for firms that run email marketing
        why: Tempting only as a guess; the reading presents empathy as a brand choice, not a regulatory requirement.
  - key: em14
    type: mcq
    concept: empathy-and-human-centred-design
    difficulty: 3
    stem: Which statement attributed to Steve Jobs does Gemser cite, and which stream of research does it support?
    options:
      - text: Customers always know best; it supports IDEO’s practice of going into the customer’s world
        why: >-
          Tempting because it sounds customer-centred, but the Jobs line in the reading argues against relying on what
          customers say.
      - text: Follow the latest trends closely; it supports the reading’s advice to track every emerging trend in the market
        why: >-
          Tempting, but the reading’s Luke van O says the opposite — once a trend is named it is no longer new, so be
          the trend; and Jobs is not quoted on trends.
      - text: Don’t ask customers what they want — until you show them, they don’t know; it supports Verganti’s caution
        correct: true
        why: >-
          Right — Gemser: Jobs said you shouldn’t ask customers what they want; until you show them, they don’t know. It
          fits Verganti’s point that customers aren’t trained to see far-future possibilities.
      - text: Design is how a product looks; it supports the view that design’s role is aesthetics
        why: >-
          Tempting because Apple is famous for design, but the reading neither quotes this nor reduces design to
          aesthetics; its Jobs line concerns asking customers.
  - key: qf12
    type: truefalse
    concept: empathy-and-human-centred-design
    difficulty: 1
    set: quickfire
    statement: Cognitive empathy means feeling the same emotion as the person you observe.
    answer: false
    why: >-
      False — that is affective empathy (a shared, mirrored emotion). Cognitive empathy is perspective taking:
      understanding someone’s worldview, beliefs, fears and experiences.
  - key: qf13
    type: truefalse
    concept: empathy-and-human-centred-design
    difficulty: 1
    set: quickfire
    statement: The reading describes empathetic design as closer to anthropology than to market science.
    answer: true
    why: >-
      True — empathetic design involves observing users in their environments, in the course of everyday habits: "a
      method that is closer to anthropology than to market science".
  - key: qf14
    type: truefalse
    concept: empathy-and-human-centred-design
    difficulty: 1
    set: quickfire
    statement: Temple Grandin’s curved corrals came from noticing that animals reacted badly to being led in a straight line.
    answer: true
    why: >-
      True — off the back of the simple insight that animals reacted adversely when led in a straight line, she designed
      adapted curved corrals that reduced stress, panic and injury.
  - key: em15
    type: truefalse
    concept: empathy-and-human-centred-design
    difficulty: 2
    statement: >-
      Roberto Verganti, like IDEO, argues that designers should immerse themselves as deeply as possible in the
      customer’s world.
    answer: false
    why: >-
      False — Gemser contrasts the two streams: IDEO goes into the customer’s world, while Verganti says not to engage
      with the customer too much, since customers rarely see far-future possibilities.
  - key: em16
    type: match
    concept: empathy-and-human-centred-design
    difficulty: 2
    prompt: Match each roadblock to empathy to what it describes.
    pairs:
      - left: Idealism
        right: Seeing things as we expect them to be
      - left: Egoism
        right: Seeing things as we want them to be
      - left: Realism
        right: Thinking we see things as they are
      - left: Circumstantialism
        right: Thinking only about the things we see
  - key: in01
    type: mcq
    concept: discovering-needs-and-insights
    difficulty: 1
    verify: true
    stem: In the guest lecture, what does "fall in love with the problem, not the solution" mean for a team?
    options:
      - text: Commit early to one solution and keep improving it until customers accept it
        why: >-
          Tempting because persistence matters, but committing early to a solution is the "jump to solution" the lecture
          calls a killer of innovation.
      - text: Spend time understanding customers’ needs and pain points before generating ideas
        correct: true
        why: >-
          Right — the lecture: as humans we love coming up with ideas, but solutions and technology come and go while
          good problems stay; find a big problem before jumping to solutions.
      - text: Choose the hardest problem available, because hard problems attract the most funding
        why: >-
          Tempting because a big problem is valued, but the point is to understand the problem deeply, not to choose
          difficulty for funding.
      - text: Keep away from customers until the solution is ready, so their views cannot bias the team
        why: >-
          Tempting because Verganti warns against too much engagement, but the lecture says the opposite: get out of the
          building, because customers don’t live in your office.
  - key: in02
    type: mcq
    concept: discovering-needs-and-insights
    difficulty: 2
    verify: true
    stem: Which is NOT one of the guest lecture’s lines of inquiry for discovering customer needs?
    options:
      - text: Be the customer and experience the situation yourself
        why: >-
          Tempting to exclude because it sounds unusual, but being the customer — e.g. taking part in the class
          experience being redesigned — is a line of inquiry.
      - text: "Be with the customer: observe them, then interview them"
        why: >-
          Tempting to exclude because it seems obvious, but being with the customer (observing, then interviewing) is a
          line of inquiry.
      - text: Ask customers to design the solution for you
        correct: true
        why: >-
          Right — the lecture says customers know their pain points but may lack the expertise to devise solutions:
          "we’re not asking them for solutions". The other three are its lines of inquiry.
      - text: Talk to people around the customer, such as partners
        why: >-
          Tempting to exclude because they are not customers, but learning about customers from people around them —
          partners, hairstylists, nutritionists — is a line of inquiry.
  - key: in03
    type: mcq
    concept: discovering-needs-and-insights
    difficulty: 2
    verify: true
    stem: Why does the guest lecture recommend talking to extreme users?
    options:
      - text: They are the largest group of customers, so their views represent the market
        why: >-
          Tempting because representativeness matters in polling, but the lecture says innovation is not polling the
          mainstream; extremes are a small, revealing group.
      - text: They are the least likely to copy the idea, so the firm’s secret stays protected
        why: >-
          Tempting because fear of copying appears in the Segway story, but it is not why extreme users are studied;
          they reveal needs.
      - text: They are the easiest people to recruit, because they already love the product
        why: >-
          Tempting, but extreme users include people who do not use the product at all; they are chosen for heightened
          experience, not loyalty.
      - text: Their experience is heightened, so needs and insights come out more easily
        correct: true
        why: >-
          Right — extreme users (heavy users or non-users) feel the experience more intensely, so needs surface more
          easily; the mainstream may have workarounds and never mention the pain.
  - key: in04
    type: mcq
    concept: discovering-needs-and-insights
    difficulty: 3
    verify: true
    variant-of: in03
    stem: >-
      The guest lecture’s team watched grandparents and grandchildren cutting pizza and saw both struggle to press the
      cutter down safely. What happened next?
    options:
      - text: A two-handed pizza cutter was made, and mainstream customers bought it too
        correct: true
        why: >-
          Right — per the lecture, the needs came from the extremes, but the new cutter (both hands on top to apply more
          weight) sold to the mainstream as well: cutting pizza is still hard for most of us.
      - text: The cutter was sold only into children’s and seniors’ markets, as a niche range
        why: >-
          Tempting because the insight came from niche users, but the lecture’s point is that extreme-user insights can
          still be built up for the mainstream.
      - text: The team dropped the idea, because neither group buys much kitchenware
        why: >-
          Tempting because the lecture notes kids don’t buy and grandparents are set in their ways, but it says the
          product was very successful.
      - text: The team polled mainstream customers, who confirmed the problem was common
        why: >-
          Tempting, but the lecture says the mainstream already had workarounds and would never have mentioned the
          problem; that is why extremes are used.
  - key: in05
    type: mcq
    concept: discovering-needs-and-insights
    difficulty: 2
    verify: true
    stem: The guest lecture compares discovery to the work of which professional?
    options:
      - text: A pollster predicting the result of an election
        why: >-
          Tempting because both gather opinions, but the lecture contrasts innovation with election polling: pollsters
          want the mainstream, innovators want needs and insights.
      - text: A detective pursuing multiple lines of inquiry
        correct: true
        why: >-
          Right — "if you think of a detective solving a crime, we want to pursue multiple lines of inquiry": interviews
          and focus groups, but also being the customer, observing and talking to extremes.
      - text: A judge weighing the evidence from both sides
        why: >-
          Tempting because evidence is weighed, but the lecture’s image is the detective, gathering clues from many
          sources.
      - text: An accountant auditing last year’s figures
        why: >-
          Tempting given Deloitte’s audit story in the reading, but the lecture’s analogy for discovery is the
          detective.
  - key: in06
    type: mcq
    concept: discovering-needs-and-insights
    difficulty: 2
    verify: true
    stem: In the guest lecture, what does an empathy map record?
    options:
      - text: Where customers live, plotted so the team can choose which suburbs to target first
        why: Tempting because "map" suggests geography, but an empathy map organises research into say, do, think and feel.
      - text: The team’s own feelings about each idea, so emotion can be set aside when choosing
        why: >-
          Tempting because the reading says to set aside emotion when choosing, but the empathy map is about the
          customer’s feelings, not the team’s.
      - text: What customers say and do — and, more importantly, think and feel — from real research
        correct: true
        why: >-
          Right — the empathy map unpacks interviews and observations into what customers say and do, and what they
          think and feel; the lecture warns not to make it up.
      - text: Which competitors customers use, so the team can map the market before ideating
        why: >-
          Tempting because the creativity slides map future competitors, but the empathy map is about customers’ words,
          actions, thoughts and feelings.
  - key: in07
    type: mcq
    concept: discovering-needs-and-insights
    difficulty: 2
    verify: true
    stem: In a customer narrative, why should the need be written as a verb?
    options:
      - text: Verbs fit on a single sticky note
        why: Tempting as a practical reason, but the lecture’s reason is that a noun smuggles in a solution.
      - text: Verbs sound more urgent to executives
        why: >-
          Tempting because narratives persuade, but the lecture’s point concerns keeping solutions out of the need, not
          urgency.
      - text: Nouns are kept for describing the customer
        why: >-
          Tempting because the customer is described first, but the reason given is that nouns tend to be solutions
          (e.g. "an incubator").
      - text: Nouns are often solutions in disguise
        correct: true
        why: >-
          Right — the lecture’s English lesson: the need is a verb, not a noun, because "nouns are often solutions";
          keep the solution out until the customer problem is clear.
  - key: in08
    type: mcq
    concept: discovering-needs-and-insights
    difficulty: 3
    verify: true
    stem: A Stanford d.school team was asked to design a low-cost incubator for Nepal. What did discovery reveal?
    options:
      - text: "The incubators sat empty: babies were born in villages, and the problem was keeping them warm on the way"
        correct: true
        why: >-
          Right — per the lecture, the team followed its curiosity from empty incubators to the villages, where a
          premature baby had died on the journey; it was a transport-and-warmth problem.
      - text: The incubators were too costly to run, so hospitals needed a model that used far less power
        why: >-
          Tempting because the brief said "low-cost", but the lecture says the incubators were mostly empty: running
          cost was not why babies were dying.
      - text: Parents distrusted incubators, so the real need was an education campaign run in hospitals
        why: >-
          Tempting as a plausible cause, but the lecture’s finding was distance and transport from the villages, not
          distrust.
      - text: Hospitals had too few nurses to use incubators, so the need was for an automated model
        why: >-
          Tempting, but nothing in the lecture mentions staffing; the problem was getting premature babies to hospital
          warm.
  - key: in09
    type: mcq
    concept: discovering-needs-and-insights
    difficulty: 3
    verify: true
    variant-of: in08
    stem: Which customer narrative matches the guest lecture’s guidance for the Nepal project?
    options:
      - text: Nepali hospitals need a low-cost incubator because their current incubators cost too much to buy
        why: >-
          Tempting because it was the original brief, but it puts the solution (an incubator) into the narrative and
          names the wrong customer.
      - text: >-
          A desperate Nepali mother needs to keep her premature baby warm because she lacks the means to get it to
          hospital
        correct: true
        why: >-
          Right — a descriptive customer (one person, standing for many), a need as a verb ("to keep … warm") and an
          insight that reaches the root cause: no means of getting the baby to hospital.
      - text: A Nepali mother needs an incubator because her premature baby is at risk of dying
        why: Tempting because the customer is right, but "an incubator" is a noun — a solution — not a need.
      - text: A Nepali mother needs to keep her premature baby warm so that it survives
        why: >-
          Tempting because the need is a verb, but the lecture says this insight "doesn’t take you anywhere new": it
          misses the root cause, transport.
  - key: in10
    type: mcq
    concept: discovering-needs-and-insights
    difficulty: 3
    verify: true
    stem: What makes the insight in a customer narrative deep enough, according to the guest lecture?
    options:
      - text: It is backed by a large survey of customers
        why: >-
          Tempting because size suggests rigour, but depth comes from reaching the root cause, which observation and
          curiosity uncovered in Nepal.
      - text: It names the solution the customer prefers
        why: Tempting, but the narrative must keep solutions out; the lecture warns that nouns are often solutions.
      - text: It is phrased as a noun so it can be measured
        why: >-
          Tempting because measurement matters later, but the lecture asks for the need as a verb and the insight as a
          root cause.
      - text: It gets to the root cause of the need
        correct: true
        why: >-
          Right — the insight "isn’t just the reason behind the need, it’s a lot deeper": for Nepal, not "so it
          survives" but "because she doesn’t have the means to get the baby to hospital".
  - key: in11
    type: mcq
    concept: discovering-needs-and-insights
    difficulty: 2
    verify: true
    stem: The guest lecture’s insight behind Magnum is that indulgent food needs guaranteed satisfaction. Why?
    options:
      - text: If the pleasure falls short of what was expected, guilt follows
        correct: true
        why: >-
          Right — per the lecture: if the delivered pleasure falls short of expectation, the result is guilt; so the
          need is guaranteed satisfaction.
      - text: Indulgent food is expensive, so buyers expect a money-back guarantee
        why: >-
          Tempting because "guaranteed" suggests a guarantee, but the insight is emotional — disappointment and guilt —
          not refunds.
      - text: Indulgent food is bought on impulse, so it must be seen at the checkout
        why: >-
          Tempting as a retail truth, but the insight concerns the eating experience, not where the product sits in the
          store.
      - text: Indulgent food is shared, so it has to satisfy every member of a family
        why: Tempting, but the lecture’s insight is about one person’s expectation and guilt, not family sharing.
  - key: in12
    type: mcq
    concept: discovering-needs-and-insights
    difficulty: 2
    verify: true
    stem: Besides inspiring new product ideas, how did the guest lecture say customer insights were used at Unilever?
    options:
      - text: To set prices, by measuring how much guilt customers would tolerate before they stopped buying
        why: Tempting because the Magnum insight mentions guilt, but nothing in the lecture links insights to pricing.
      - text: To inspire and focus advertising and promotional campaigns — the whole marketing mix
        correct: true
        why: >-
          Right — insights were used not only for new ideas but to inspire and focus advertising and promotional
          campaigns: "the whole marketing mix, it’s not just for innovation".
      - text: To decide which factories to close, based on how each product scored on insight
        why: >-
          Tempting as an operational use, but the lecture says nothing about factory decisions; insights served
          innovation and marketing.
      - text: "Only for innovation: insights were kept away from the advertising teams entirely"
        why: >-
          Tempting because this week is about innovation, but the lecture explicitly says insights are not just for
          innovation.
  - key: in13
    type: mcq
    concept: discovering-needs-and-insights
    difficulty: 3
    verify: true
    stem: >-
      A gym chain wants to redesign its group fitness classes. Which plan best follows the guest lecture’s discover
      stage?
    options:
      - text: Survey average members on which new class they would like, then launch whichever class proves most popular
        why: >-
          Tempting because it asks customers, but it asks for solutions and polls the mainstream; the lecture says
          innovation isn’t polling.
      - text: Ask the chain’s executives which features they would add, then test the winning idea at launch
        why: >-
          Tempting because executives know the business, but it skips customers, and testing at launch is the expensive
          failure the lecture warns against.
      - text: >-
          Staff take a class themselves, observe and interview members, talk to trainers, and seek out very frequent and
          lapsed members
        correct: true
        why: >-
          Right — it uses every line of inquiry: be the customer (as the lecturer’s team did when redesigning a fitness
          class), be with the customer, learn about them from trainers, and talk to extreme users.
      - text: Study the chain’s sales data only, since members cannot explain what they need from a class
        why: >-
          Tempting because data is objective, but the lecture says customers do know their pain points; you learn by
          observing and talking to them.
  - key: in14
    type: mcq
    concept: discovering-needs-and-insights
    difficulty: 4
    verify: true
    contrasts-with:
      - empathy-and-human-centred-design
    stem: How does the guest lecture’s discover-and-distil method relate to the reading’s account of empathy?
    options:
      - text: It replaces empathy with data, because the lecture distrusts what customers say about their lives
        why: >-
          Tempting because research produces data, but the lecture says customers do know their pain points; it asks
          about their lives.
      - text: It is the opposite of empathy, because the lecture follows Verganti in keeping away from customers
        why: >-
          Tempting because the reading has Verganti’s caution, but the lecture’s "get out of the building" is closer to
          IDEO’s stream of going into the customer’s world.
      - text: It is the same as affective empathy, because the team tries to feel what each customer feels
        why: >-
          Tempting because empathy maps record feelings, but recording what customers think and feel is perspective
          taking (cognitive), not mirroring their emotions.
      - text: >-
          It puts empathy into practice — observing and perspective taking — then distils the findings into needs and
          insights
        correct: true
        why: >-
          Right — the lines of inquiry (be the customer, be with them, learn about them, extremes) are empathetic design
          in action; the empathy map and customer narrative distil the findings.
  - key: in15
    type: mcq
    concept: discovering-needs-and-insights
    difficulty: 2
    verify: true
    stem: Why, per the guest lecture, can’t a team sit in the office and make up customers’ needs?
    options:
      - text: Customers don’t live in your building, so you must go where they are
        correct: true
        why: >-
          Right — the lecture’s advice is to "get out of the building": customers don’t live in your office or lab, so
          go out to where they are and understand their needs.
      - text: Offices lack the data systems needed to model customer needs accurately
        why: >-
          Tempting because data matters, but the lecture’s point is presence with customers, not better systems in the
          office.
      - text: Customer needs change every week, so office research is always out of date
        why: >-
          Tempting because needs do change, but the lecture’s reason is that customers are not in the office, not the
          pace of change.
      - text: Regulators forbid firms to invent customer needs in their business cases
        why: >-
          Tempting as a guess, but the lecture’s reason is practical: you cannot discover needs without going to
          customers.
  - key: qf15
    type: truefalse
    concept: discovering-needs-and-insights
    difficulty: 1
    set: quickfire
    verify: true
    statement: The guest lecture says a customer narrative should state the need as a noun, such as "an incubator".
    answer: false
    why: >-
      False — the need should be a verb (e.g. "to keep her premature baby warm"); nouns are often solutions, and the
      solution should not be in the narrative.
  - key: qf16
    type: truefalse
    concept: discovering-needs-and-insights
    difficulty: 1
    set: quickfire
    verify: true
    statement: In the guest lecture, extreme users include people who use a product a lot and people who do not use it at all.
    answer: true
    why: >-
      True — an extreme user "could be someone who uses the product a lot or not at all"; their heightened experience
      makes needs and insights easier to uncover.
  - key: in16
    type: truefalse
    concept: discovering-needs-and-insights
    difficulty: 2
    verify: true
    statement: >-
      According to the guest lecture, customers usually cannot tell you anything useful, so discovery relies on sales
      data.
    answer: false
    why: >-
      False — the lecture says customers do know what is painful to them and what they like; we ask about their lives
      (not for solutions) and find their needs from that.
  - key: in17
    type: truefalse
    concept: discovering-needs-and-insights
    difficulty: 2
    verify: true
    statement: An empathy map should be based on actual customer research rather than the team’s assumptions.
    answer: true
    why: >-
      True — the lecture warns against making it up: the map unpacks interviews and observations into what customers
      say, do, think and feel.
  - key: in18
    type: match
    concept: discovering-needs-and-insights
    difficulty: 2
    verify: true
    prompt: Match each line of inquiry to an example from the guest lecture.
    pairs:
      - left: Be the customer
        right: Taking part in the fitness class being redesigned, from booking to the changing rooms
      - left: Be with the customer
        right: Going shopping with consumers, then interviewing them
      - left: Learn about the customer
        right: Asking partners and hairstylists about men’s grooming habits
      - left: Talk to extreme users
        right: Watching grandparents and young grandchildren cut pizza
  - key: dv01
    type: mcq
    concept: divergent-thinking-and-idea-generation
    difficulty: 1
    set: pretest
    stem: What is the goal of divergent thinking, according to the Week 3 creativity exercises?
    options:
      - text: To choose the single best idea from a list, using agreed criteria
        why: >-
          Tempting because choosing follows, but selecting one idea is converging; the reading’s step 5 handles choosing
          rationally.
      - text: To test one idea thoroughly with customers before trying any others
        why: >-
          Tempting because testing is a stage, but divergent thinking is about the quantity and variety of ideas, not
          testing one.
      - text: To generate many different ideas about a topic in a short period of time
        correct: true
        why: >-
          Right — the slide: "The goal of divergent thinking is to generate many different ideas about a topic in a
          short period of time."
      - text: To narrow a broad topic down to one clearly defined problem statement
        why: >-
          Tempting because defining comes before ideating, but narrowing is convergence; divergent thinking spreads out
          into many ideas.
  - key: dv02
    type: mcq
    concept: divergent-thinking-and-idea-generation
    difficulty: 2
    stem: How does divergent thinking typically occur, according to the slides?
    options:
      - text: In a slow, step-by-step manner, so each idea is checked before the next one is raised
        why: >-
          Tempting because it sounds rigorous, but checking each idea before the next is judging — which the reading
          says not to do while generating.
      - text: In ranked order, so that the strongest ideas always appear first in the group’s list
        why: Tempting, but divergent ideas arrive unorganised; ranking belongs to choosing.
      - text: In silence, with each person working alone and sharing only a single final answer
        why: >-
          Tempting because some exercises are individual, but others (idea ping-pong) bounce off each other; and a
          single "final answer" is convergent.
      - text: In a spontaneous, free-flowing manner, so ideas come in a random, unorganised fashion
        correct: true
        why: >-
          Right — "Divergent thinking typically occurs in a spontaneous, free-flowing manner, such that the ideas are
          generated in a random, unorganised fashion."
  - key: dv03
    type: mcq
    concept: divergent-thinking-and-idea-generation
    difficulty: 2
    stem: Besides generating many ideas, what does divergent thinking involve, according to the slides?
    options:
      - text: Breaking a topic into its parts to gain insight into its various aspects
        correct: true
        why: >-
          Right — "It involves breaking a topic down into its various component parts in order to gain insight about the
          various aspects of the topic."
      - text: Combining every idea into one compromise solution that all members can accept
        why: >-
          Tempting because step 4 combines ideas, but a compromise everyone accepts is consensus — which the reading
          says to avoid when choosing.
      - text: Removing unusual ideas early so the group can focus on the realistic ones
        why: >-
          Tempting for efficiency, but removing unusual ideas is judging; "think in threes" explicitly asks for radical
          solutions.
      - text: Asking customers to vote on each idea as soon as it has been generated
        why: Tempting because feedback matters, but voting is a judgement step; divergent thinking defers judgement.
  - key: dv04
    type: mcq
    concept: divergent-thinking-and-idea-generation
    difficulty: 2
    stem: In the "think in threes" exercise, what are A, B and C?
    options:
      - text: A = cheapest solution; B = fastest solution; C = best-quality solution
        why: >-
          Tempting because trade-offs are common, but the exercise grades ideas by how far they move from the usual, not
          by cost or speed.
      - text: A = usual solution; B = different solutions; C = radical solutions
        correct: true
        why: >-
          Right — the slide: identify your problem (from your assignment), then A = usual solution, B = different
          solutions, C = radical solutions.
      - text: A = the customer’s view; B = the company’s view; C = a competitor’s view
        why: >-
          Tempting because perspectives matter (the nine-perspectives exercise), but think in threes is usual,
          different, radical.
      - text: A = the problem; B = its cause; C = its solution
        why: >-
          Tempting because it is a logical chain, but the exercise starts from an identified problem and asks for three
          levels of solution.
  - key: dv05
    type: mcq
    concept: divergent-thinking-and-idea-generation
    difficulty: 2
    stem: In the "asking new questions" exercise, what must participants avoid?
    options:
      - text: Asking more than five questions
        why: Tempting because five is mentioned, but it is a minimum ("at least 5"), not a limit.
      - text: Writing any of the questions down
        why: Tempting, but the exercise has you write all the existing questions you can think of in two minutes.
      - text: Offering solutions
        correct: true
        why: >-
          Right — after two minutes listing existing questions, think of at least five new and varied questions: "no
          solutions – focus on asking interesting questions".
      - text: Finishing in under two minutes
        why: Tempting, but the two-minute limit is part of the exercise’s design, not something to avoid.
  - key: dv06
    type: mcq
    concept: divergent-thinking-and-idea-generation
    difficulty: 2
    stem: What do the slides say comes from placing two unrelated things together?
    options:
      - text: A confusing message
        why: >-
          Tempting because unrelated pairings can seem odd, but the slide presents them as a source of opportunity, not
          confusion.
      - text: A patentable invention
        why: >-
          Tempting because new combinations can be inventions, but the slide says nothing about patents; its point is
          opportunity.
      - text: A cheaper product
        why: Tempting, but cost is not mentioned; the exercise is about creative opportunity.
      - text: A new opportunity
        correct: true
        why: >-
          Right — the slide "Place 2 unrelated things together" leads to "New opportunity": forced connections open
          ideas that category thinking misses.
  - key: dv07
    type: mcq
    concept: divergent-thinking-and-idea-generation
    difficulty: 3
    stem: In the "Who are your future competitors?" grid, which box holds the "usual" answer?
    options:
      - text: Current, direct competitors
        correct: true
        why: >-
          Right — the grid crosses current/future with direct/indirect; USUAL sits in the current, direct box, and
          question marks invite you to fill the other three.
      - text: Future, indirect competitors
        why: >-
          Tempting because it is the hardest box, but the slide marks it with a question mark: it is what you are pushed
          to imagine, not the usual answer.
      - text: Future, direct competitors
        why: >-
          Tempting, but future competitors are the unknowns the exercise asks you to find; the usual answer is today’s
          direct rivals.
      - text: Current, indirect competitors
        why: >-
          Tempting because they exist now, but indirect competitors are what teams overlook; the usual answer is
          current, direct rivals.
  - key: dv08
    type: mcq
    concept: divergent-thinking-and-idea-generation
    difficulty: 2
    stem: What is "idea ping-pong" in the speed-thinking exercises?
    options:
      - text: One person proposing ideas while the group rejects the weak ones aloud
        why: >-
          Tempting because ping-pong suggests back-and-forth, but rejecting ideas aloud is judging; the exercise builds
          on ideas.
      - text: Groups bouncing off each other’s ideas, with 30 seconds to develop each
        correct: true
        why: >-
          Right — the challenge ("How can we raise money while we enjoy ourselves?") gives 30 seconds to develop an
          idea, with two groups bouncing off each other’s ideas.
      - text: Two teams debating whether an idea will work until one side concedes
        why: >-
          Tempting because there are two groups, but they build on each other’s ideas rather than argue about whether
          they work.
      - text: Passing a written idea around so that each person adds one criticism
        why: Tempting, but adding criticisms judges ideas; ping-pong is about developing them quickly.
  - key: dv09
    type: mcq
    concept: divergent-thinking-and-idea-generation
    difficulty: 3
    stem: >-
      One speed-thinking task asks for 120 seconds of reasons why the ideas will NOT work. How does this fit the
      reading’s advice?
    options:
      - text: It breaks the reading’s rules, because the reading says ideas should never be judged at any stage
        why: >-
          Tempting because step 3 says do not judge, but step 5 requires rational judgement when choosing; the rule is
          about timing, not a ban.
      - text: It replaces prototyping, because listing objections shows whether customers will want the idea
        why: >-
          Tempting because objections test ideas, but only customers can show desirability; listing objections is no
          substitute for testing.
      - text: It is a separate round of judgement; the reading says not to judge ideas while generating them
        correct: true
        why: >-
          Right — the "why it won’t work" round follows an idea round on the same problem; the reading separates
          generating (do not judge or debate) from choosing (be rational).
      - text: It is divergent, because judging ideas quickly is how divergent thinking produces its variety
        why: >-
          Tempting because it generates many reasons quickly, but judging ideas is convergent work; divergent thinking
          defers judgement.
  - key: dv10
    type: mcq
    concept: divergent-thinking-and-idea-generation
    difficulty: 2
    stem: Which is one of the reading’s rules for generating ideas?
    options:
      - text: Have one conversation at a time
        correct: true
        why: >-
          Right — step 3 (be creative in generating ideas): generate as many ideas as possible, log the session, do not
          judge or debate ideas, and have one conversation at a time.
      - text: Debate each idea as it is raised
        why: Tempting because debate sharpens ideas, but the reading says "do not judge or debate ideas" while generating.
      - text: Let the most senior person go first
        why: >-
          Tempting as office habit, but the reading warns the GM’s idea "can’t be privileged"; seniority is no rule of
          idea generation.
      - text: Stop once a practical idea emerges
        why: >-
          Tempting for efficiency, but the aim is as many ideas as possible, and the reading notes the most practical
          solution isn’t always the best.
  - key: dv11
    type: mcq
    concept: divergent-thinking-and-idea-generation
    difficulty: 3
    stem: Deloitte’s CMO describes the firm as "diverging, before converging". What does that mean in design thinking terms?
    options:
      - text: Choose a solution first, then look for evidence that supports it
        why: >-
          Tempting because firms often work this way, but it is converging before diverging — how jumping to solutions
          happens.
      - text: Open up a wide range of options first, then narrow to a choice
        correct: true
        why: >-
          Right — Redhill uses it for the firm’s way of working: diverge (open up many possibilities) before converging
          (narrowing down and deciding), using design to make better decisions.
      - text: Expand into new markets first, then merge with its competitors
        why: >-
          Tempting because Deloitte did grow through mergers and acquisitions, but the phrase is about how ideas are
          developed, not corporate strategy.
      - text: Let each office work alone, then impose one head-office method
        why: >-
          Tempting because Deloitte is a network of offices, but the phrase describes a way of thinking, not a
          management structure.
  - key: dv12
    type: mcq
    concept: divergent-thinking-and-idea-generation
    difficulty: 3
    stem: >-
      A team asked how to reduce childhood obesity keeps returning to the same school-canteen ideas. Which exercise
      targets this problem most directly?
    options:
      - text: "Idea ping-pong: two groups trade ideas in 30-second turns on a fundraising challenge"
        why: >-
          Tempting because it speeds ideas up, but the team’s problem is a single frame of reference; nine perspectives
          attacks that directly.
      - text: "Paper clip: list as many uses for a paper clip as possible in 60 seconds"
        why: Tempting as a fluency warm-up, but it does not reframe the team’s actual problem from different viewpoints.
      - text: "Nine perspectives: nine viewpoints on the problem in 120 seconds"
        correct: true
        why: >-
          Right — the slides set exactly this problem ("How can we reduce the current level of childhood obesity?") for
          the nine-perspectives exercise: many angles break a team out of one frame.
      - text: "Why it won’t work: spend 120 seconds listing reasons the canteen ideas will fail"
        why: Tempting, but listing objections narrows; a team stuck in one frame needs more viewpoints, not more criticism.
  - key: dv13
    type: mcq
    concept: divergent-thinking-and-idea-generation
    difficulty: 1
    stem: How long do the slides allow for the paper-clip exercise?
    options:
      - text: 30 seconds
        why: Tempting because idea ping-pong uses 30 seconds per idea, but the paper-clip exercise gives 60 seconds.
      - text: 120 seconds
        why: Tempting because the speed-thinking problems use 120 seconds, but the paper-clip exercise is 60 seconds.
      - text: Two minutes per person
        why: >-
          Tempting because the mind map at speed and asking new questions use two minutes, but the paper clip gets 60
          seconds.
      - text: 60 seconds
        correct: true
        why: >-
          Right — "You have 60 seconds. Write your responses… How many uses can you think of for a paper clip?" Short
          limits push quantity over judgement.
  - key: dv14
    type: mcq
    concept: divergent-thinking-and-idea-generation
    difficulty: 3
    verify: true
    stem: The guest lecture groups creative techniques into three areas. Which list is right?
    options:
      - text: Random connections, best in world, and breaking the rules
        correct: true
        why: >-
          Right — per the lecture, thousands of techniques boil down to three good areas: random connections (e.g. a
          banana as inspiration for a shoe), best in world (who else solves this?) and breaking the rules.
      - text: Brainstorming, mind mapping, and de Bono’s six thinking hats
        why: >-
          Tempting because these are well-known techniques in the unit, but the lecture’s three areas are random
          connections, best in world and breaking the rules.
      - text: Empathy, define, and ideate
        why: Tempting because they are a sequence, but they are stages of the process, not areas of creative technique.
      - text: Usual, different, and radical solutions
        why: >-
          Tempting because it is a three-part creativity tool, but it is the "think in threes" exercise from the slides,
          not the lecture’s three areas.
  - key: qf17
    type: truefalse
    concept: divergent-thinking-and-idea-generation
    difficulty: 1
    set: quickfire
    statement: According to the slides, divergent thinking produces ideas in a random, unorganised fashion.
    answer: true
    why: >-
      True — divergent thinking "typically occurs in a spontaneous, free-flowing manner, such that the ideas are
      generated in a random, unorganised fashion".
  - key: qf18
    type: truefalse
    concept: divergent-thinking-and-idea-generation
    difficulty: 1
    set: quickfire
    statement: The reading’s rules for generating ideas say to debate each idea as soon as it is raised.
    answer: false
    why: >-
      False — step 3 says "do not judge or debate ideas" and have one conversation at a time; judgement comes later,
      when choosing rationally (step 5).
  - key: dv15
    type: truefalse
    concept: divergent-thinking-and-idea-generation
    difficulty: 1
    statement: In the "think in threes" exercise, C stands for radical solutions.
    answer: true
    why: >-
      True — A is the usual solution, B different solutions and C radical solutions, pushing thinking further from the
      usual each time.
  - key: dv16
    type: truefalse
    concept: divergent-thinking-and-idea-generation
    difficulty: 2
    statement: The "asking new questions" exercise asks for at least five new questions and no solutions.
    answer: true
    why: >-
      True — after listing existing questions for two minutes, think of at least five new and varied questions — "no
      solutions – focus on asking interesting questions".
  - key: dv17
    type: match
    concept: divergent-thinking-and-idea-generation
    difficulty: 2
    prompt: Match each creativity exercise to what it asks you to do.
    pairs:
      - left: Think in threes
        right: Give a usual, a different and a radical solution
      - left: Asking new questions
        right: List the existing questions, then at least five new ones — no solutions
      - left: Who are your future competitors?
        right: Fill in current and future, direct and indirect rivals
      - left: Nine perspectives
        right: Look at one problem from nine different angles in 120 seconds
  - key: pt01
    type: mcq
    concept: prototyping-and-experimentation
    difficulty: 1
    stem: In the guest lecture, what is the advice summed up as "think with your hands"?
    options:
      - text: Build or try something, then talk about it — not the reverse
        correct: true
        why: >-
          Right — the lecture’s quote: build something, try something, then talk about it, not the reverse. Designers
          often solve by doing, where business people think of a solution first.
      - text: Sketch only by hand, never on a computer, to keep ideas loose
        why: >-
          Tempting because hand sketches are quick prototypes, but the advice is about making before talking, not a ban
          on computers.
      - text: Let craftspeople, not managers, decide which ideas go ahead
        why: Tempting because making is valued, but the advice concerns when to build, not who decides.
      - text: Count the ideas on your fingers to keep the list short
        why: Tempting only as a pun; the advice is about making ideas tangible early and testing them with people.
  - key: pt02
    type: mcq
    concept: prototyping-and-experimentation
    difficulty: 2
    stem: The guest lecture compares the timing of failure to an Olympic athlete. What is the point?
    options:
      - text: Never fail, because one public failure ends an athlete’s or a product’s career
        why: >-
          Tempting because failure feels bad, but the lecture’s point is that early failure is cheap learning, so it is
          welcome.
      - text: Fail early, when trying things costs little — not at the Games
        correct: true
        why: >-
          Right — an athlete tries different diets and routines in the years before the Olympics, not at the Games;
          early in innovation failure costs little, while failing after a costly launch is expensive.
      - text: Fail only at the Games, because real competition is the only valid test of an idea
        why: >-
          Tempting because real conditions matter, but launching untested is the costly failure the lecture warns
          against.
      - text: Fail as late as possible, once all the money has been raised and the team is ready
        why: Tempting only if spending is the aim; the lecture says the later a failure, the more it costs.
  - key: pt03
    type: mcq
    concept: prototyping-and-experimentation
    difficulty: 2
    stem: What can a prototype be, according to the guest lecture?
    options:
      - text: Only a fully working version of the final product
        why: >-
          Tempting because working prototypes appear in the reading’s step 4, but the lecture says early prototypes can
          be rough; fully working versions come later.
      - text: Only a computer model, to keep costs and risks low
        why: Tempting because digital models are cheap, but the lecture lists physical scrap materials and storyboards too.
      - text: Anything — scrap materials, a mock-up or a storyboard
        correct: true
        why: >-
          Right — "a prototype can be anything": built from scrap materials, a mock-up, or a cheap storyboard such as
          one that could test the idea of a ride-hailing service.
      - text: Only a written list of features for customers to read
        why: >-
          Tempting because descriptions are cheap, but the lecture’s point is to show people something tangible rather
          than just talk about it.
  - key: pt04
    type: mcq
    concept: prototyping-and-experimentation
    difficulty: 3
    stem: >-
      Early in the process, when uncertainty is high, what question should a prototype test, according to the guest
      lecture?
    options:
      - text: Can our factory make it at the target cost?
        why: >-
          Tempting because it matters eventually, but manufacturing cost is a feasibility and viability question, tested
          once desirability is clearer.
      - text: Which colour do customers prefer for the final version?
        why: >-
          Tempting because customers do give feedback on details, but early tests ask whether the idea matters at all,
          not about finishing touches.
      - text: How quickly can we launch it before competitors do?
        why: >-
          Tempting because speed to market matters, but launching fast without knowing whether people want it is the
          risk prototypes exist to reduce.
      - text: If we made it, would it matter to the customer?
        correct: true
        why: >-
          Right — "all you’re trying to find out is not can we make it, but if we made it, would it matter to the
          customer", because the number one reason ideas fail is that no one wants them.
  - key: pt05
    type: mcq
    concept: prototyping-and-experimentation
    difficulty: 3
    stem: Why should more finished, more expensive prototypes wait until later, according to the guest lecture?
    options:
      - text: They cost more, so they are justified only as it becomes clearer people want the idea
        correct: true
        why: >-
          Right — more finished prototypes take more money to build, so don’t use them too early, when uncertainty is
          high; as it becomes clearer people want it, build more expensive ones.
      - text: Customers dislike finished prototypes, because they cannot picture any changes to them
        why: Tempting as design folklore, but the lecture’s reason is cost set against uncertainty.
      - text: Finished prototypes cannot be tested with customers at all, only with the engineers
        why: >-
          Tempting, but finished prototypes are tested with customers too; the issue is spending heavily before
          desirability is known.
      - text: The reading forbids working prototypes until the define stage has been signed off
        why: >-
          Tempting because the process has an order, but the reading’s step 4 actually asks for working prototypes; it
          says nothing about sign-off.
  - key: pt06
    type: mcq
    concept: prototyping-and-experimentation
    difficulty: 2
    verify: true
    stem: How did Zappos’s founder test whether people would buy shoes online, according to the guest lecture?
    options:
      - text: He built a large warehouse and website, then advertised nationally to see whether orders arrived
        why: >-
          Tempting because that is how a full business works, but the test was meant to learn without buying a warehouse
          or writing much code.
      - text: He photographed a local shop’s shoes, listed them online, and bought and posted each pair himself when it sold
        correct: true
        why: >-
          Right — per the lecture, he asked a local shop if he could photograph its shoes and sell them online, paying
          full retail when one sold, then bought the pair and posted it.
      - text: He surveyed shoppers outside shoe stores, asking whether they would ever buy shoes online
        why: >-
          Tempting because it asks customers, but the lecture’s test watched what people actually did (bought shoes),
          not what they said.
      - text: He licensed an online bookshop’s software and sold shoes alongside its existing range
        why: >-
          Tempting because the lecture mentions Amazon selling books, but the founder put up a cheap one- or two-page
          website himself.
  - key: pt07
    type: mcq
    concept: prototyping-and-experimentation
    difficulty: 3
    verify: true
    stem: >-
      What name does the guest lecture give to doing the work manually behind the scenes while customers see what looks
      like a finished service?
    options:
      - text: Pivoting
        why: >-
          Tempting because it also appears in the lecture, but a pivot changes one key element of the idea; it is not
          about manual work behind the scenes.
      - text: Storyboarding
        why: >-
          Tempting because storyboards are cheap prototypes, but a storyboard shows the idea; it does not deliver the
          service by hand.
      - text: Flintstoning
        correct: true
        why: >-
          Right — per the lecture, ‘Flintstoning’, after Fred Flintstone powering his car with his feet: you do the work
          manually behind the scenes until the business model is proven.
      - text: Outsourcing
        why: >-
          Tempting because someone else seems to do the work, but in the Zappos test the founder did it himself; the
          term is Flintstoning.
  - key: pt08
    type: mcq
    concept: prototyping-and-experimentation
    difficulty: 3
    verify: true
    variant-of: pt06
    stem: >-
      A student wants to test a meal-delivery service for night-shift nurses before writing any code. Which test follows
      the Zappos approach?
    options:
      - text: Build the full app with payments and tracking first, then advertise it at the hospitals
        why: >-
          Tempting because it looks professional, but building the full product first is the expensive path the lecture
          warns against.
      - text: Ask nurses in a survey whether they would use such a service if it existed
        why: Tempting because it asks customers, but saying is not doing; the Zappos test watched real purchases.
      - text: Write a detailed business plan and seek investors before talking to any nurses
        why: >-
          Tempting because investors need plans, but the lecture calls early business cases made-up numbers and puts
          desirability first.
      - text: Take orders through a simple web page and deliver the meals herself, to see whether nurses order and reorder
        correct: true
        why: >-
          Right — like the Zappos test, it does the work by hand behind a cheap front end, tests what customers actually
          do, and learns about operations without big investment.
  - key: pt09
    type: mcq
    concept: prototyping-and-experimentation
    difficulty: 2
    verify: true
    stem: What else did the Zappos test teach, beyond whether people would buy shoes online?
    options:
      - text: How distribution and warehousing work, without buying a warehouse
        correct: true
        why: >-
          Right — per the lecture, he also learned a lot about distribution and warehousing "without buying a
          warehouse".
      - text: The exact price that customers would be willing to pay for every shoe brand
        why: >-
          Tempting because sales reveal prices, but the lecture names distribution and warehousing as the extra
          learning, not a full price map.
      - text: How to design shoes that fit well without first being tried on
        why: >-
          Tempting because fit was the friends’ objection, but the test was about whether people would buy online, not
          about shoe design.
      - text: "Nothing else: it was a test of demand and nothing more than that"
        why: Tempting because demand was the main question, but the lecture says the test also taught operational lessons.
  - key: pt10
    type: mcq
    concept: prototyping-and-experimentation
    difficulty: 3
    stem: What does "pivot" mean in the guest lecture?
    options:
      - text: Abandoning the project entirely after a failed test, and moving the team to a new project
        why: >-
          Tempting because it follows a failed test, but killing the idea is the other outcome the lecture names; a
          pivot keeps going with a change.
      - text: Returning to the very first stage and starting again from scratch with no idea at all
        why: Tempting because going back is allowed, but a pivot changes one element; it is not a full restart.
      - text: Changing one key element — the product, customer group or channel — and carrying on
        correct: true
        why: >-
          Right — the lecture defines a pivot as a change to one of the key elements of your product or business model:
          one element of the product, a different customer group, or a different channel.
      - text: Launching the product early to see how the market responds before testing further
        why: >-
          Tempting, but launching untested is the costly failure the lecture warns against; a pivot is a change of
          direction after learning.
  - key: pt11
    type: mcq
    concept: prototyping-and-experimentation
    difficulty: 3
    verify: true
    stem: Which example does the guest lecture give of a pivot forced by COVID-19?
    options:
      - text: Hermès moved from making saddles to other leather goods when cars replaced horses as transport
        why: >-
          Tempting because it is the lecture’s other pivot example, but Hermès’s pivot came when cars replaced horse
          transport, not with COVID-19.
      - text: Zappos moved from shoes to all clothing once online sales had been proven
        why: >-
          Tempting because Zappos appears in the lecture, but only as a cheap experiment; no pivot to clothing is
          described.
      - text: Dyson moved from vacuum cleaners to hair dryers after a failed product launch
        why: >-
          Tempting because the lecture mentions Dyson’s later hair dryer, but as a success, not as a pivot after a
          failed launch.
      - text: Stage Kings moved from building concert stages to making work-from-home furniture
        correct: true
        why: >-
          Right — per the lecture, Stage Kings (a Sydney company) lost its revenue overnight when gatherings stopped,
          and turned its woodworkers to work-from-home desks and furniture.
  - key: pt12
    type: mcq
    concept: prototyping-and-experimentation
    difficulty: 2
    stem: Which practices does step 4 of the reading’s process (be iterative in refining your ideas) list?
    options:
      - text: Multiple drafts, feedback from a diverse group including end users, and working prototypes
        correct: true
        why: >-
          Right — step 4: combine, expand and refine ideas; create multiple drafts; seek feedback from a diverse group
          including end users; reserve judgement; create and present working prototype(s).
      - text: A single polished draft, the client’s formal sign-off, and a detailed plan for the product launch
        why: >-
          Tempting because clients want polish, but iteration means multiple drafts and feedback, not one finished
          draft.
      - text: A consensus vote, a glossary of terms, and a list of the project’s investors
        why: >-
          Tempting because these echo other steps, but consensus is to be avoided (step 5), and the glossary belongs to
          step 1.
      - text: Market forecasts, a business case, and a search of existing patents
        why: >-
          Tempting because many firms do these before launch, but none is in step 4; the lecture also warns early
          business cases are made-up numbers.
  - key: pt13
    type: mcq
    concept: prototyping-and-experimentation
    difficulty: 4
    contrasts-with:
      - desirability-feasibility-viability
    stem: >-
      A firm says: "Prototyping is wasteful — our technology works, so we will launch and learn from sales." Which
      response best uses the Week 3 material?
    options:
      - text: >-
          Agree: if the technology works, the product is already in the sweet spot, so further testing adds nothing at
          all
        why: >-
          Tempting because working technology is reassuring, but that is the feasibility-first path the lecture warns
          against: feasible, launched untested, possibly unwanted.
      - text: Working technology proves only feasibility; cheap tests should check desirability before a costly launch
        correct: true
        why: >-
          Right — the number one reason ideas fail is that no one wants them, and failing at launch is the most
          expensive way to learn. Prototypes test desirability cheaply, then feasibility and viability.
      - text: Agree, but only if the firm writes a detailed business case before the launch goes ahead
        why: >-
          Tempting because it adds rigour, but the lecture calls early business cases made-up numbers; only tests with
          customers supply evidence.
      - text: Disagree, because prototypes must always be fully working before any customer sees them
        why: >-
          Tempting as a quality standard, but the lecture says prototypes can be storyboards or scrap-material mock-ups;
          fully working ones come later.
  - key: pt14
    type: mcq
    concept: prototyping-and-experimentation
    difficulty: 2
    stem: Which of Meinel and Leifer’s rules explains why prototypes help a team talk with customers?
    options:
      - text: Ambiguity
        why: >-
          Tempting because rough prototypes leave things open, but the rule that explains the communication benefit is
          tangibility.
      - text: Human
        why: >-
          Tempting because customers are people, but the human rule is about satisfying human needs; tangibility
          explains why a prototype helps conversation.
      - text: Tangibility
        correct: true
        why: >-
          Right — the tangibility rule: making ideas tangible always facilitates communication, because prototypes are
          communication media.
      - text: Redesign
        why: >-
          Tempting because prototypes get redesigned, but the redesign rule is about how long-standing needs were met in
          the past.
  - key: pt15
    type: mcq
    concept: prototyping-and-experimentation
    difficulty: 3
    stem: >-
      A team has a promising idea for a parcel-locker service but no evidence yet that anyone wants it. Which prototype
      best fits this stage?
    options:
      - text: A fully engineered locker installed at a train station for a year-long public trial
        why: >-
          Tempting because it gives real data, but a fully engineered trial is expensive; it belongs later, once
          desirability is clearer.
      - text: A detailed financial model of the lockers’ revenue over the next ten years
        why: >-
          Tempting because viability matters, but a model before any evidence of demand is the made-up business case the
          lecture warns about.
      - text: A patent application covering the locker’s new locking mechanism
        why: >-
          Tempting because protecting ideas matters, but fear of copying is no reason to skip customers, and a patent
          tests nothing about demand.
      - text: A storyboard of a customer’s day with the service, shown to potential users
        correct: true
        why: >-
          Right — with uncertainty high, a cheap, rough prototype (the lecture mentions storyboards) answers the first
          question: if we made it, would it matter to the customer?
  - key: qf19
    type: truefalse
    concept: prototyping-and-experimentation
    difficulty: 1
    set: quickfire
    statement: The guest lecture says failure is cheapest early in the innovation process.
    answer: true
    why: >-
      True — like an athlete experimenting in the years before the Olympics, failing early costs little; building
      something costly and launching it means spending heavily before learning it fails.
  - key: qf20
    type: truefalse
    concept: prototyping-and-experimentation
    difficulty: 1
    set: quickfire
    statement: According to the guest lecture, an early prototype must be a fully working version of the product.
    answer: false
    why: >-
      False — a prototype can be anything: scrap materials, a mock-up or a storyboard. More finished, more expensive
      prototypes come later, once it is clearer people want the idea.
  - key: pt16
    type: truefalse
    concept: prototyping-and-experimentation
    difficulty: 2
    statement: >-
      In the guest lecture, a "pivot" means changing one key element of the product or business model rather than
      abandoning it.
    answer: true
    why: >-
      True — a pivot is a change to one of the key elements of your product or business model (a product element, a
      customer group, a channel); killing the idea is the separate outcome.
  - key: pt17
    type: truefalse
    concept: prototyping-and-experimentation
    difficulty: 2
    statement: The reading’s tangibility rule treats prototypes only as engineering tests of whether something can be built.
    answer: false
    why: >-
      False — the tangibility rule says prototypes are communication media: making ideas tangible always facilitates
      communication, not just engineering checks.
  - key: sa01
    type: short
    concept: what-is-design-thinking
    difficulty: 3
    prompt: >-
      "Design thinking is just a fashionable name for common-sense marketing." Respond to this statement in a short
      essay, applying design thinking to a regional council that plans a new library app and using at least one example
      from the Week 3 materials.
    model: >-
      Deloitte's CMO David Redhill would half agree: he calls design thinking common-sense marketing principles applied
      to

      one of the most ancient things, design — but insists it is "not a buzzword and it's not a panacea". The reading
      defines it as a process that harnesses creativity to resolve problems and create

      solutions that make a product, a service or a business better; Tim Brown adds that it matches people's needs with
      what

      is technologically feasible and what is viable. The guest lecture's three features — human-centred, creative and

      experimentation-driven — go further than everyday marketing: ideas are tested quickly and cheaply with users
      before

      money is committed.


      For the council, the main risk is not that the app fails technically but that residents never use it, since more

      innovations fail from a lack of customers than from product failure. So it would research how residents use the

      library, generate many ideas and test cheap mock-ups before building. Deloitte shows the method reaches beyond

      marketing: it redesigned even the audit experience. The limit: Gemser says design thinking

      is not suited to incremental improvement, so if the council only wants its catalogue online, a conventional
      project may

      be enough.
    rubric:
      - id: r1
        criterion: "Concept: an accurate, attributed definition"
        marks: 2
        top-band: >-
          Defines design thinking with an attributed definition (the reading’s, or Tim Brown’s) and names its
          human-centred, creative and experimentation-driven features.
        margin-note: Define before you discuss — and say whose definition it is.
        authorities:
          - mgmt2094-reading-marketers-guide-to-design-thinking
      - id: r2
        criterion: Example from the materials
        marks: 2
        top-band: >-
          Uses a real example — Deloitte’s audit redesign, or Redhill’s “common sense marketing” view — and says what it
          shows about the statement.
        margin-note: "Good: the example answers the statement rather than decorating the essay."
        authorities:
          - mgmt2094-example-deloitte-design-thinking
      - id: r3
        criterion: Application to the council
        marks: 3
        top-band: >-
          Applies the features to the council: the risk of an app nobody uses, research with residents, and cheap tests
          before building.
        margin-note: Tie each feature to the council’s facts.
        authorities: []
      - id: r4
        criterion: "Evaluation: a position on the statement"
        marks: 3
        top-band: >-
          Agrees, disagrees or qualifies, with reasons: overlap with customer-centric marketing against the formal,
          iterative, experimental process; Gemser’s limit on incremental change.
        margin-note: This is a statement question — answer it.
        authorities: []
  - key: sa02
    type: short
    concept: desirability-feasibility-viability
    difficulty: 3
    verify: true
    prompt: >-
      "If the engineers can build it and the numbers add up, the idea is ready to launch." Respond to this statement,
      applying the desirable–feasible–viable framework to a university that has a working prototype of a robot guide for
      new students but has not yet consulted any students.
    model: >-
      The statement skips the lens that matters most. Design thinking's sweet spot is an

      idea that is desirable (people want it), feasible (it can be made, technically and organisationally) and viable
      (it

      makes money or, for a university, has real impact for its students). Tim Brown's definition in the reading builds
      in

      the same three lenses.


      Here the robot is feasible — a working model exists — but desirability is untested, and "the numbers" are a
      business

      case for something no student has seen. The guest lecture calls that the common trap: start with what we can make,

      write a business case on made-up numbers, and let the customer see it first at launch. Its contrasting pair makes
      the

      point: the Segway began with what could be built and was hidden from customers until launch, then flopped; Dyson
      began

      with customers' frustrations and ran thousands of experiments.


      So the university should first find out whether new students want guidance this way — observe orientation week,

      interview students, and test a cheap storyboard or a staff member playing the robot. Only then should it test cost
      and

      impact. The framework's limit is that early viability figures are guesses: experiments, not spreadsheets, should
      decide.
    rubric:
      - id: r1
        criterion: "Concept: the three lenses"
        marks: 2
        top-band: >-
          Defines desirable, feasible and viable accurately (including impact for a public institution) and links them
          to Tim Brown’s definition.
        margin-note: All three lenses, each defined — not just listed.
        authorities:
          - mgmt2094-reading-marketers-guide-to-design-thinking
      - id: r2
        criterion: Example from the guest lecture
        marks: 2
        top-band: >-
          Uses the lecture’s contrast (Segway feasibility-first; Dyson desirability-first) and says what it shows about
          launch risk.
        margin-note: Names checked against the transcript only — fine to use, but describe what happened.
        authorities:
          - mgmt2094-example-segway-and-dyson
      - id: r3
        criterion: Application to the robot
        marks: 3
        top-band: >-
          Shows feasibility is met, desirability untested and viability only on paper; proposes cheap tests with
          students before any cost case.
        margin-note: "This is where the marks are: which lens is missing, and how to test it."
        authorities: []
      - id: r4
        criterion: Evaluation of the statement
        marks: 3
        top-band: >-
          Rejects or qualifies the statement with reasons: order of testing, made-up early numbers, cost of failing at
          launch.
        margin-note: Take a side on the statement and defend it.
        authorities: []
  - key: sa03
    type: short
    concept: design-thinking-process
    difficulty: 3
    prompt: >-
      "The five stages of design thinking are a checklist: complete each one, then move on." Evaluate this statement,
      applying the reading's process to a supermarket chain that wants to cut food waste in its stores.
    model: >-
      The reading's process runs Empathy → Define → Ideate → Prototype → Test, grouped as Understand (ending in
      insight),

      Create (ending in ideas) and Deliver (ending in reality), with eight steps describing how to behave. The

      supermarket team would first be empathetic in defining the problem: decide the issue (waste of what, and where?),

      agree the audience — shoppers, store staff, suppliers — and establish a glossary. It would then be explorative:
      review

      the history of the issue and other attempts, note supporters and critics, and above all talk to end users. Next it
      would be creative, generating many ideas without judging them;

      iterative, refining drafts and testing working prototypes with staff and shoppers; and rational in choosing,
      avoiding

      consensus thinking. Finally it would deliver, evaluate honestly whether waste fell, and repeat.


      The statement is wrong on its key word. The list ends with "Repeat", the reading says iteration can open new paths
      or

      redefine the initial problem, and the guest lecture stresses going back a stage whenever the evidence says so.
      Waste

      may turn out to be an ordering problem, not a store problem — a checklist would miss that. The stages are a guide
      to

      sequence, not boxes to tick.
    rubric:
      - id: r1
        criterion: "Concept: stages, phases and steps"
        marks: 2
        top-band: >-
          States the five stages in order with the Understand–Create–Deliver phases, and the behaviours the eight steps
          require.
        margin-note: Order matters — and so do the step names.
        authorities:
          - mgmt2094-reading-marketers-guide-to-design-thinking
      - id: r2
        criterion: Example or authority
        marks: 2
        top-band: >-
          Supports the argument with the reading (iteration can redefine the problem; step 8 “Repeat”) or the guest
          lecture on going back a stage.
        margin-note: Cite the material that undercuts the checklist idea.
        authorities:
          - mgmt2094-reading-marketers-guide-to-design-thinking
      - id: r3
        criterion: Application to the supermarket
        marks: 3
        top-band: >-
          Walks the supermarket through each stage with concrete actions: audience, end-user research, ideas without
          judging, prototypes, rational choice, honest evaluation.
        margin-note: Concrete actions per stage earn the top band.
        authorities: []
      - id: r4
        criterion: Evaluation of the statement
        marks: 3
        top-band: Explains why a checklist misreads an iterative process, with a concrete way the problem could be redefined.
        margin-note: Good — you answered the statement, not just described the process.
        authorities: []
  - key: sa04
    type: short
    concept: empathy-and-human-centred-design
    difficulty: 3
    prompt: >-
      "To design for customers, just ask them what they want." Evaluate this statement using the Week 3 reading on
      empathy, applying it to a hospital that wants to improve the experience of families waiting in its emergency
      department.
    model: >-
      Human-centred design rests on the premise that a deep understanding of users' unarticulated needs, gained through

      empathy, inspires innovation — and unarticulated needs are exactly what asking misses. Henry Ford's line makes the

      point: asked what they wanted, people would have said faster horses.


      The reading distinguishes affective empathy — mirroring a family's distress — from cognitive empathy, perspective

      taking: understanding their worldview, fears and experiences. The hospital needs the second. Empathetic design
      means

      observing families in the waiting room through the night, closer to anthropology than to a satisfaction survey.
      Temple

      Grandin shows the power of this: watching animals without assumptions, she saw that straight paths caused panic
      and

      designed curved corrals.


      The team must also watch for the four roadblocks: idealism (seeing what they expect), egoism (what they want),
      realism

      (assuming they see things as they are) and circumstantialism (thinking only about what is in front of them — for

      example, ignoring what families went through before arriving).


      So the statement is too simple. Asking is a start, not the method. Verganti goes further, warning against engaging

      customers too much because they rarely see far-future possibilities; the hospital should combine observation and

      perspective taking with its own judgement.
    rubric:
      - id: r1
        criterion: "Concept: HCD and the two kinds of empathy"
        marks: 2
        top-band: Explains the HCD premise (unarticulated needs) and distinguishes affective from cognitive empathy accurately.
        margin-note: Define both kinds — and say which one design needs.
        authorities:
          - mgmt2094-reading-mitchem-empathy
      - id: r2
        criterion: Example from the reading
        marks: 2
        top-band: Uses Temple Grandin (or Ford, or MailChimp) and says what it shows about observation versus asking.
        margin-note: The example should do work in the argument.
        authorities:
          - mgmt2094-example-temple-grandin
      - id: r3
        criterion: Application to the hospital
        marks: 3
        top-band: >-
          Applies observation, perspective taking and the four roadblocks to families in the emergency department, with
          a concrete instance of at least one roadblock.
        margin-note: Name the roadblock and show it in the hospital.
        authorities: []
      - id: r4
        criterion: Evaluation of the statement
        marks: 3
        top-band: Concludes that asking is necessary but not sufficient, and weighs Verganti’s caution against IDEO’s immersion.
        margin-note: Nice use of the two streams to sharpen the conclusion.
        authorities:
          - mgmt2094-reading-verganti-foreword
  - key: sa05
    type: short
    concept: divergent-thinking-and-idea-generation
    difficulty: 3
    prompt: >-
      "A good brainstorm finds the practical answer quickly." Respond to this statement, using the Week 3 creativity
      exercises and the reading's process to advise a council team brainstorming ways to reduce the number of cars on
      the road.
    model: >-
      Divergent thinking aims to generate many different ideas about a topic in a short period of time; it is
      spontaneous

      and free-flowing, so ideas arrive random and unorganised (Week 3 exercises).

      A brainstorm that hunts for the practical answer quickly is converging too early.


      The reading's process separates the two moves. When generating ideas: produce as many as possible, log the
      session,

      do not judge or debate ideas, and keep one conversation at a time. Only later be rational in choosing — and
      remember

      that "the most practical solution isn't always the best". Deloitte describes the habit it built as "diverging,
      before

      converging".


      Practically, the council team could run the slides' own exercise — as many ideas as possible in 120 seconds on
      this

      very problem — then think in threes (usual, different, radical), and take nine perspectives (commuters, parents,

      freight drivers) to break its frame. A separate 120-second "why it won't work"

      round then does the judging in its proper place, before a rational choice.


      The statement has a grain of truth: a session must end in a decision, and deferring judgement costs time and
      produces

      weak ideas. But speed belongs to the generating round; the practical answer is chosen, not grabbed.
    rubric:
      - id: r1
        criterion: "Concept: divergent thinking"
        marks: 2
        top-band: >-
          Defines divergent thinking from the slides (many ideas, short time, spontaneous and unorganised) and contrasts
          it with choosing.
        margin-note: Use the slide definition, then the contrast.
        authorities: []
      - id: r2
        criterion: Example from the materials
        marks: 2
        top-band: Uses Deloitte’s “diverging, before converging” or the reading’s generating and choosing steps as authority.
        margin-note: Authority for separating the two moves.
        authorities:
          - mgmt2094-reading-marketers-guide-to-design-thinking
          - mgmt2094-example-deloitte-design-thinking
      - id: r3
        criterion: Application to the council team
        marks: 3
        top-band: >-
          Prescribes specific exercises (120-second burst, think in threes, nine perspectives, a separate “won’t work”
          round) for the cars-on-the-road problem.
        margin-note: Specific exercises, matched to the team’s problem.
        authorities: []
      - id: r4
        criterion: Evaluation of the statement
        marks: 3
        top-band: >-
          Concedes what is right (a decision is needed; deferring judgement costs time) and explains why speed belongs
          to generating, not choosing.
        margin-note: Balanced — the concession strengthens the argument.
        authorities: []
  - key: sa06
    type: short
    concept: prototyping-and-experimentation
    difficulty: 3
    verify: true
    prompt: >-
      "Prototyping is a waste of money: build the real thing and let the market decide." Respond to this statement,
      advising a start-up that wants students to rent textbooks from a vending machine on campus.
    model: >-
      Design thinking is experimentation-driven: test ideas quickly and cheaply. The guest lecture's advice is to think
      with your hands — build or try something, then talk

      about it — and to fail early, like an athlete experimenting in the years before the Games, because failing after a

      costly launch is the most expensive way to learn. "Let the market decide" means learning at the most expensive
      point.


      Early, while uncertainty is high, the question is not "can we make it?" but "if we made it, would it matter to

      students?". So the start-up should begin with a storyboard of a student's week, then a staffed table in the
      library

      dressed as the "machine", taking rentals by hand — much as Zappos's founder sold a local shop's shoes online and
      posted

      each pair himself until the model was proven. If students rent and return, more finished prototypes and tests of

      feasibility and viability can follow; the reading's tangibility rule adds that prototypes are communication media.


      The statement is right that only real behaviour is proof — but a cheap test produces real behaviour too. The risk
      is

      that a manual test flatters demand, so the start-up must evaluate honestly and be

      ready to pivot.
    rubric:
      - id: r1
        criterion: "Concept: experimentation and early failure"
        marks: 2
        top-band: Explains experimentation-driven design thinking, think with your hands, and why early failure is cheap.
        margin-note: Explain why, not just that, you prototype.
        authorities: []
      - id: r2
        criterion: Example from the materials
        marks: 2
        top-band: >-
          Uses the Zappos test (or the reading’s tangibility rule) and says what it shows about cheap, real-behaviour
          tests.
        margin-note: Names checked against the transcript only — describe the test itself.
        authorities:
          - mgmt2094-example-zappos
          - mgmt2094-meinel-leifer-four-rules
      - id: r3
        criterion: Application to the start-up
        marks: 3
        top-band: >-
          Proposes staged prototypes matched to uncertainty (storyboard → manual service → finished machine) and what
          each would learn.
        margin-note: Match each prototype to what it tests.
        authorities: []
      - id: r4
        criterion: Evaluation of the statement
        marks: 3
        top-band: >-
          Concedes that real behaviour is the best evidence, shows cheap tests can supply it, and names a limit (manual
          tests can flatter demand).
        margin-note: A strong answer finds what is right in the statement before rejecting it.
        authorities: []
