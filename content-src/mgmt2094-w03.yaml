cards:
  - type: basic
    concept: what-is-design-thinking
    front: How does the Week 3 reading define design thinking "in essence"?
    back: >-
      A process that harnesses creativity to resolve problems and create solutions with the intent of making a product,
      a service, or a business, better.
    source: Week 3 Reading – Design Thinking, p 3 (executive summary)
  - type: cloze
    concept: what-is-design-thinking
    text: >-
      Tim Brown (IDEO): design thinking uses the designer's sensibility and methods to match {{c1::people's needs}} with
      what is {{c2::technologically feasible}} and what a {{c3::viable business}} can convert into consumer value and
      market opportunity.
    source: Week 3 Reading – Design Thinking, p 7
  - type: basic
    concept: what-is-design-thinking
    front: What three features of design thinking does the guest lecture name?
    back: It is a human-centred, creative and experimentation-driven approach to innovation.
    source: Week 3 Lecture Transcript – Design Thinking (guest lecture)
  - type: basic
    concept: what-is-design-thinking
    front: According to the guest lecture, why do more innovations and start-ups fail?
    back: >-
      A lack of customers — people make something that works, but nobody wants it — more often than a failure of the
      product.
    source: Week 3 Lecture Transcript – Design Thinking (guest lecture)
  - type: cloze
    concept: what-is-design-thinking
    text: "Design thinking suits {{c1::VUCA}} conditions: volatile, uncertain, complex and ambiguous."
    source: Week 3 Reading – Design Thinking, p 6
  - type: basic
    concept: what-is-design-thinking
    front: What is 'designful thinking' (Deloitte)?
    back: >-
      Thinking like a designer: a disposition and a mindset — human-centric, explorative, asking "what if" and "why
      not?", reframing problems as opportunities — rather than a trained designer’s skills.
    source: Week 3 Reading – Design Thinking, p 17
  - type: cloze
    concept: what-is-design-thinking
    text: "Verganti: no design, no {{c1::meaning}}, no {{c2::value}}, no innovation, no business."
    source: Week 3 Reading – Design Thinking, p 5 (foreword)
  - type: basic
    concept: desirability-feasibility-viability
    front: What are the three lenses of the innovation sweet spot?
    back: >-
      Desirable (people want it); feasible (we can make it, technically and organisationally); viable (we can make money
      from it — or, for government or a not-for-profit, it has a big impact for citizens).
    source: Week 3 Lecture Transcript – Design Thinking (guest lecture)
  - type: apply
    concept: desirability-feasibility-viability
    scenario: A council has a working app and a costed business case, but no resident has seen the app.
    answer: >-
      Feasibility is shown and viability is only on paper; desirability is untested. Test with residents first —
      otherwise their first look is at launch.
    source: Week 3 Lecture Transcript – Design Thinking (guest lecture)
  - type: basic
    concept: desirability-feasibility-viability
    front: Segway versus Dyson in the guest lecture?
    back: >-
      Segway: began with what could be made, kept from customers until launch, flopped. Dyson: began with customers’
      frustrations (a dusty bag, suction lost as it filled), then thousands of experiments.
    source: Week 3 Lecture Transcript – Design Thinking (guest lecture)
    verify: true
  - type: cloze
    concept: design-thinking-process
    text: "The reading’s five stages: {{c1::Empathy}} → {{c2::Define}} → {{c3::Ideate}} → {{c4::Prototype}} → {{c5::Test}}."
    source: Week 3 Reading – Design Thinking, p 12
  - type: basic
    concept: design-thinking-process
    front: What does each phase of the reading's infographic end in?
    back: Understanding ends in insight; creation ends in ideas; delivery ends in reality.
    source: Week 3 Reading – Design Thinking, p 12
  - type: basic
    concept: design-thinking-process
    front: What are the reading's eight steps?
    back: >-
      Be empathetic in defining the problem; be explorative in researching it; be creative in generating ideas; be
      iterative in refining them; be rational in choosing an idea; be practical in delivering it; be honest in
      evaluating performance; repeat.
    source: Week 3 Reading – Design Thinking, p 12
  - type: apply
    concept: design-thinking-process
    scenario: A team is writing task descriptions, planning tasks, determining resources and assigning tasks for the client.
    answer: >-
      Step 6: be practical in delivering it to the client (task descriptions, plan, resources, assign, execute,
      deliver).
    source: Week 3 Reading – Design Thinking, p 12
  - type: cloze
    concept: four-rules-of-design-thinking
    text: >-
      Meinel and Leifer’s four rules: the {{c1::Human}} Rule, the {{c2::Ambiguity}} Rule, the {{c3::Redesign}} Rule and
      the {{c4::Tangibility}} Rule.
    source: Week 3 Reading – Design Thinking, p 11
  - type: basic
    concept: four-rules-of-design-thinking
    front: Under the Tangibility Rule, what did Meinel and Leifer recently realise?
    back: "That prototypes are communication media: making ideas tangible always facilitates communication."
    source: Week 3 Reading – Design Thinking, p 11
  - type: apply
    concept: four-rules-of-design-thinking
    scenario: >-
      Before generating ideas, a team studies how a need has been met over centuries and estimates conditions 20 years
      ahead.
    answer: >-
      The Redesign Rule: all design is redesign — understand past solutions to long-standing needs, then apply foresight
      tools.
    source: Week 3 Reading – Design Thinking, p 11
  - type: basic
    concept: four-rules-of-design-thinking
    front: Under the Ambiguity Rule, what leaves no chance for "chance discovery"?
    back: A box closed tightly, constraints enumerated excessively, and the fear of failure always at hand.
    source: Week 3 Reading – Design Thinking, p 11
  - type: basic
    concept: empathy-and-human-centred-design
    front: Affective versus cognitive empathy?
    back: >-
      Affective: a shared, mirrored emotion (see someone sad, feel sad). Cognitive: perspective taking — understanding
      their worldview, beliefs, fears and experiences.
    source: Week 3 Reading – Design Thinking, p 19
  - type: cloze
    concept: empathy-and-human-centred-design
    text: >-
      Roadblocks to empathy: {{c1::idealism}} (as we expect), {{c2::egoism}} (as we want), {{c3::realism}} (we think we
      see things as they are), {{c4::circumstantialism}} (only what we see).
    source: Week 3 Reading – Design Thinking, p 20
  - type: basic
    concept: empathy-and-human-centred-design
    front: What was Temple Grandin's insight, and her design?
    back: >-
      Livestock reacted adversely to being led in a straight line; she designed curved corrals that reduced stress,
      panic and injury.
    source: Week 3 Reading – Design Thinking, p 20
  - type: basic
    concept: empathy-and-human-centred-design
    front: What is the premise of human-centred design (HCD)?
    back: A deep understanding of users’ unarticulated needs, gained through empathy, inspires creativity and innovation.
    source: Week 3 Reading – Design Thinking, p 19
  - type: basic
    concept: empathy-and-human-centred-design
    front: What are the two streams of design thinking research, according to Gemser?
    back: >-
      IDEO: go into the customer’s world. Verganti: don’t engage with the customer too much — most customers aren’t
      trained to see far-future possibilities.
    source: Week 3 Reading – Design Thinking, p 8
  - type: basic
    concept: discovering-needs-and-insights
    front: What are the guest lecture's lines of inquiry for discovering needs?
    back: >-
      Be the customer; be with the customer (observe, then interview); learn about them from people around them; talk to
      extreme users.
    source: Week 3 Lecture Transcript – Design Thinking (guest lecture)
    verify: true
  - type: cloze
    concept: discovering-needs-and-insights
    text: >-
      Customer narrative: a descriptive {{c1::customer}} + a need written as a {{c2::verb}} + an {{c3::insight}} that
      reaches the root cause.
    source: Week 3 Lecture Transcript – Design Thinking (guest lecture)
    verify: true
  - type: apply
    concept: discovering-needs-and-insights
    scenario: "A draft customer narrative reads: \"A Nepali mother needs an incubator because her premature baby is at risk.\""
    answer: >-
      Rewrite the need as a verb ("to keep her premature baby warm") — nouns are often solutions — and push the insight
      to the root cause: she has no means to get the baby to hospital.
    source: Week 3 Lecture Transcript – Design Thinking (guest lecture)
    verify: true
  - type: basic
    concept: divergent-thinking-and-idea-generation
    front: What is the goal of divergent thinking?
    back: To generate many different ideas about a topic in a short period of time.
    source: Week 3 Creativity Exercises, slide 2
  - type: cloze
    concept: divergent-thinking-and-idea-generation
    text: "Think in threes: A = {{c1::usual}} solution, B = {{c2::different}} solutions, C = {{c3::radical}} solutions."
    source: Week 3 Creativity Exercises, slide 4
  - type: basic
    concept: divergent-thinking-and-idea-generation
    front: What are the reading's rules for generating ideas (step 3)?
    back: >-
      Identify end users’ needs and motivations; generate as many ideas as possible; log the session; do not judge or
      debate ideas; have one conversation at a time.
    source: Week 3 Reading – Design Thinking, p 12
  - type: apply
    concept: divergent-thinking-and-idea-generation
    scenario: A brainstorming team rejects ideas as soon as they are raised and settles on the first practical one.
    answer: >-
      It is converging too early: defer judgement while generating (step 3), then choose rationally (step 5) —
      diverging, before converging.
    source: Week 3 Reading – Design Thinking, pp 12, 18
  - type: basic
    concept: prototyping-and-experimentation
    front: Why fail early, according to the guest lecture?
    back: >-
      Early failure costs little — like an athlete experimenting in the years before the Olympics; building something
      costly and launching it means an expensive failure.
    source: Week 3 Lecture Transcript – Design Thinking (guest lecture)
  - type: basic
    concept: prototyping-and-experimentation
    front: What is 'Flintstoning' (the Zappos test)?
    back: >-
      Doing the work by hand behind the scenes of what looks like a finished service — Zappos’s founder bought and
      posted each pair of shoes himself until the model was proven.
    source: Week 3 Lecture Transcript – Design Thinking (guest lecture)
    verify: true
  - type: apply
    concept: prototyping-and-experimentation
    scenario: A team has no evidence yet that anyone wants its new service.
    answer: >-
      Use a cheap, rough prototype (storyboard, mock-up) to test desirability first: if we made it, would it matter to
      the customer?
    source: Week 3 Lecture Transcript – Design Thinking (guest lecture)
  - type: basic
    concept: prototyping-and-experimentation
    front: What is a pivot, in the guest lecture?
    back: >-
      A change to one key element of the product or business model (a product element, customer group or channel),
      rather than killing the idea.
    source: Week 3 Lecture Transcript – Design Thinking (guest lecture)
audio:
  title: Week 3 recap — design thinking
  minutes: 3
  script: >-
    This week was design thinking. The reading's definition: in essence, design thinking is a process that harnesses

    creativity to resolve problems and create solutions that make a product, a service or a business better. Tim Brown
    of

    IDEO puts it as matching people's needs with what is technologically feasible and what a viable business can turn
    into

    value. Our guest lecturer called it a human-centred, creative and experimentation-driven approach to innovation, and

    the reason to use it is that more innovations fail from a lack of customers than from the product not working.


    Those three things are the sweet spot. Desirable: people want it. Feasible: we can make it. Viable: we can make
    money

    from it, or, for government, it has real impact for citizens. The trap is starting with what we can make, writing a

    business case on made-up numbers, and letting the customer see it for the first time at launch. Start with

    desirability.


    The process in the reading runs empathy, define, ideate, prototype, test, under understand, create and deliver, with

    eight steps: be empathetic, explorative, creative, iterative, rational, practical, honest, and repeat. Remember step

    three, don't judge ideas while you generate them, and step five, avoid consensus thinking when you choose.


    Meinel and Leifer give four rules. The human rule: all design is social. The ambiguity rule: preserve ambiguity, so

    chance discovery can happen. The redesign rule: all design is redesign of solutions to needs that are millennia old.

    And the tangibility rule: prototypes are communication media.


    On empathy, affective empathy mirrors someone's emotion; cognitive empathy takes their perspective, and that is the
    one

    design needs. Watch for the four roadblocks: idealism, egoism, realism and circumstantialism. Temple Grandin's
    curved

    corrals show what unprejudiced observation can find. And remember the debate: IDEO goes into the customer's world,

    while Verganti warns that customers can't see far into the future.


    In the lecture, discovery meant being the customer, being with the customer, learning about them from people around

    them, and talking to extreme users. Then we distil it into a customer narrative: a need written as a verb, and an

    insight that reaches the root cause, like the Nepal team that found a transport problem rather than an incubator

    problem.


    For ideas, divergent thinking means many ideas, fast: think in threes, ask new questions, take nine perspectives. As

    Deloitte put it, diverge before you converge.


    Finally, prototype. Think with your hands, fail early while it's cheap, match how finished the prototype is to how
    sure

    you are, and if a test fails, pivot or let the idea go.
