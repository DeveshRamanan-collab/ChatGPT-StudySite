  - key: q106
    type: mcq
    concept: new-product-market-share
    difficulty: 3
    stem: >-
      Dow Corning's analytical capabilities were among the best in the world, yet NPS fell from about 25% to 13%. What
      is the strongest lesson for an innovation student?
    options:
      - text: Universities using its equipment shows that open innovation caused the decline
        why: >-
          Tempting because universities did use its microscope, but the case presents that as evidence of strength, not
          as a cause of decline.
      - text: "World-class science did not stop new-product revenue falling: the bottleneck was commercialisation"
        correct: true
        why: >-
          Correct — heavy R&D and world-class analytics coexisted with a halving of NPS, so leadership targeted the way
          products were commercialised.
      - text: With R&D this strong, Dow Corning should have cut R&D and bought in new products instead
        why: >-
          Tempting as a cost argument, but the case never suggests cutting R&D; the fix it describes is a better
          commercialisation process.
      - text: Strong science shows the fall must have come from outside R&D, namely from the breast implant lawsuits alone
        why: >-
          Tempting because the litigation hit the company hard, but the case never makes it the cause of the NPS fall;
          it points to commercialisation.
  - key: q107
    type: mcq
    concept: new-product-market-share
    difficulty: 3
    stem: Which explanations for the fall in NPS did the guest lecturer say were argued over?
    options:
      - text: The SAP implementation, and the cost of the whole transformation program
        why: >-
          Tempting because both were happening in the mid-1990s, but the lecturer did not offer them as causes of the
          NPS fall.
      - text: Competition from Thompson's WaterSeal, and the later loss of the ArmorAll account
        why: >-
          Tempting because both are in the case, but they belong to the Deck Protector story years later, not the 1995
          decline.
      - text: The centralisation of R&D, and the limited permutations on the siloxane backbone
        correct: true
        why: >-
          Correct — the lecturer said some blamed centralisation, while others argued the company was reaching the
          limits of the siloxane backbone.
      - text: The move to Xiameter, and the slide of silicone fluids into commodity products
        why: >-
          Tempting because the lecture mentions commoditisation, but Xiameter came in the early 2000s, after the NPS
          decline, and was not offered as a cause.
  - key: q108
    type: mcq
    concept: new-product-market-share
    difficulty: 2
    stem: >-
      A chemicals firm earns $800 million in a year, of which $104 million comes from newly commercialised products.
      What is its New Product Market Share, and how does it compare with Dow Corning?
    options:
      - text: 10%, the same share Dow Corning spent on its R&D
        why: Tempting because 10% is a key figure in the case, but it was the R&D spend, and the arithmetic here gives 13%.
      - text: 87%, the share of revenue that existing products earn
        why: Tempting as a slip in the arithmetic, but 87% is the share from existing products; NPS counts the new ones.
      - text: 25%, which matches Dow Corning's level in the 1970s and 80s
        why: Tempting because 25% is the healthy benchmark in the case, but 104 ÷ 800 is 0.13, not 0.25.
      - text: 13%, the same as Dow Corning's low point in 1995
        correct: true
        why: >-
          Correct — NPS = new-product revenue ÷ total revenue = 104 ÷ 800 = 13%, the figure Dow Corning had fallen to by
          1995.
  - key: q109
    type: mcq
    concept: new-product-market-share
    difficulty: 2
    variant-of: q108
    stem: >-
      A materials company has total revenue of $500 million, and $125 million of it comes from newly commercialised
      products. What is its NPS?
    options:
      - text: 25%, Dow Corning's level in the 1970s and 80s
        correct: true
        why: Correct — 125 ÷ 500 = 25%, the level Dow Corning had held through the 1970s and 80s before it declined.
      - text: 40%, well above any figure given anywhere in the case
        why: Tempting if the figures are divided the wrong way round or misread, but 125 ÷ 500 gives exactly 25%.
      - text: 13%, Dow Corning's figure by 1995
        why: Tempting because 13% is Dow Corning's low point, but 125 ÷ 500 is 0.25, not 0.13.
      - text: 75%, the share earned by its other products
        why: >-
          Tempting as a slip, but 75% is the share from existing products; NPS is the share from newly commercialised
          ones.
  - key: q110
    type: mcq
    concept: new-product-market-share
    difficulty: 2
    stem: Why did Dow Corning's leadership decide in the mid-1990s that the way it commercialised products had to improve?
    options:
