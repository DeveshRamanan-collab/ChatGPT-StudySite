      - text: Creativity is incremental change; innovation is radical change, so the SMO product was creative
        why: >-
          Tempting because incremental and radical are innovation types, but he drew the line between creating and
          commercialising.
      - text: Creativity happens in business schools; innovation happens in engineering faculties
        why: >-
          Tempting because the lecture joined business and engineering, but the distinction was about stages, not
