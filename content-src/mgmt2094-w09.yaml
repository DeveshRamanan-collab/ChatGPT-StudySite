  - key: q613
    type: mcq
    concept: customer-risk-after-commercialisation
    difficulty: 4
    stem: >-
      An essay argues: "The Deck Protector proves Design for Six Sigma failed, because the project stopped after a
      year." What is the best critique?
    options:
      - text: "It is right: a project that stops within a year shows its method failed"
        why: >-
          Tempting as a simple outcome test, but it ignores why the project stopped: a customer's court loss, not a
          design flaw.
      - text: It is right, because DFSS should have included a legal review of ArmorAll's ads
        why: >-
          Tempting because better risk management might have helped, but the ads were the customer's, outside Dow
          Corning's process.
      - text: "It confuses process and outcome: the method was a success and the stop came from customer risk"
        correct: true
        why: >-
          Correct — the slides call the approach a complete success; the stop came from poor risk management by the
          customer.
      - text: It is wrong only because the project in fact ran for four years
        why: >-
          Tempting because four years appears in the case, but the campaign lasted 12 months; the essay's timing is
          right, its inference wrong.
  - key: q614
    type: mcq
    concept: customer-risk-after-commercialisation
    difficulty: 2
    stem: Which of these is NOT among the slide's four lessons learned?
    options:
      - text: The new Lean (Six Sigma) approach to commercialisation was a complete success
        why: "Tempting to pick as too obvious, but it is the first lesson on the slide: the approach was a complete success."
      - text: It opened up the use of complex statistical and mathematical modelling
        why: "Tempting to pick as too technical, but it is the second lesson: the approach opened up statistical modelling."
      - text: Poor risk management by customers can lead to project failure
        why: >-
          Tempting to pick because it sounds negative, but it is the fourth lesson: customers' poor risk management can
          cause failure.
      - text: Centralised R&D produces more successful new products
        correct: true
        why: Correct — this is not a lesson; the lecturer was critical of centralising R&D.
  - key: q615
    type: mcq
    concept: customer-risk-after-commercialisation
    difficulty: 3
    stem: >-
      Using the Deck Protector's lesson, what should a supplier do before committing a plant to one large customer's new
      product?
    options:
      - text: Assess the customer's legal, marketing and financial risks
        correct: true
        why: >-
          Correct — business risk management is a deliverable of every DMEDI step, and the case shows the customer's
          risks can end a project.
      - text: Speed up development so the product launches before any risk appears
        why: Tempting because speed was a strength, but the risk appeared after a fast, successful launch.
      - text: Refuse any project whose specification comes from a customer
        why: Tempting as caution, but customer-specified targets made the pilot a success.
      - text: Use DMAIC rather than DFSS so that existing processes absorb the risk
        why: Tempting as a method switch, but the risk sat with the customer, not in the choice of method.
  - key: q616
    type: truefalse
    concept: customer-risk-after-commercialisation
    difficulty: 1
    set: quickfire
    statement: ArmorAll won its court case against Thompson's but was later taken over by Clorox.
    answer: false
    why: >-
      False — ArmorAll lost the legal battle over its commercials, and it was the financial impact of that loss that
      forced the Clorox takeover.
  - key: q617
    type: truefalse
    concept: customer-risk-after-commercialisation
    difficulty: 2
    set: quickfire
    statement: >-
      One lesson of the case is that even a good commercialisation process cannot protect a project from poor risk
      management by customers.
    answer: true
    why: >-
      True — the fourth lesson: no matter how good your commercialisation process, poor risk management by your
      customers can lead to project failure.
  - key: q618
    type: truefalse
    concept: customer-risk-after-commercialisation
    difficulty: 2
    set: quickfire
    statement: >-
      The host lecturer called bringing an idea to market the 'creativity' part, and coming up with the product the
      'innovation' part.
    answer: false
    why: >-
      False — it is the other way round: coming up with the product or idea is creativity; bringing it to market,
      commercialising it, is innovation.
  - key: q619
    type: short
    concept: customer-risk-after-commercialisation
    difficulty: 3
    prompt: >-
      "No matter how good your commercialisation process, poor risk management by your customers can lead to project
      failure." Discuss this statement using the Deck Protector, and consider what it implies for the difference between
      creativity and innovation.
    model: >-
      The statement is borne out by the Deck Protector, and it shows why innovation is wider than creativity. Dow
      Corning's

      process was strong: as the pilot for Design for Six Sigma it front-loaded a six-factor design of experiment,
      economic

      data and concurrent process engineering, and in 12 months produced over 4,500 tonnes and US$40 million of revenue,
      with

      two awards. Yet after 12 months the project stopped. ArmorAll ran TV commercials that Thompson's challenged;
      ArmorAll

      lost the legal battle and the financial impact forced its takeover by Clorox. In the lecture, its marketing had
      not

      checked with its legal people. As a B2B supplier, Dow Corning had done everything its customer wanted. The host

      lecturer drew the lesson: creating the product was the creative part and it succeeded; bringing it to market is
      the

      innovation part, and it needs marketing, legal, HR, culture and strategy to come together. The statement has a
      limit:

      it explains a failure but offers no fix, though DMEDI does list business risk management in every step, which

      suggests suppliers should assess customer risk, not only customer requirements.
    rubric:
      - id: r1
        criterion: "Concept: creativity vs innovation"
        marks: 2
        top-band: >-
          Distinguishes creating the product (creativity) from bringing it to market (innovation), as the host lecturer
          did.
        margin-note: Key distinction used correctly.
        authorities: []
      - id: r2
        criterion: "Example: the post-commercialisation facts"
        marks: 3
        top-band: >-
          Gives the pilot's success, the 12-month stop, Thompson's challenge, the court loss and the Clorox takeover
          accurately.
        margin-note: Facts in the right order.
        authorities:
          - mgmt2094-example-armorall-deck-protector
      - id: r3
        criterion: "Application: answers the statement"
        marks: 3
        top-band: >-
          Separates process quality from venture outcome and shows the failure sat with the customer, outside the
          process.
        margin-note: Argues from the case to the claim.
        authorities: []
      - id: r4
        criterion: "Evaluation: limits and implications"
        marks: 2
        top-band: Notes the lesson diagnoses but does not fix, and links to risk management within the design process.
        margin-note: Thoughtful extension.
        authorities: []
  - key: q620
    type: match
    concept: customer-risk-after-commercialisation
    difficulty: 2
    prompt: Match each part of the end of the Deck Protector story to its outcome.
    pairs:
      - left: After 12 months of a very successful campaign
        right: The project stopped
      - left: ArmorAll's TV commercials
        right: Challenged by Thompson's
      - left: The legal battle
        right: ArmorAll lost
      - left: The financial impact of the court case
        right: ArmorAll taken over by Clorox
  - key: q701
    type: mcq
    concept: creativity-within-discipline
    difficulty: 1
    stem: What was the guest lecturer's view of Six Sigma and creativity?
    options:
      - text: Creativity matters only before Six Sigma starts, in the Define step
        why: Tempting because projects start with Define, but creativity tools sit in Explore, inside the process.
      - text: Six Sigma replaces creativity with statistics, which is why it worked
        why: Tempting because statistics were central, but he never said creativity was replaced.
      - text: Discipline and creativity can coexist in Six Sigma
        correct: true
        why: >-
          Correct — he said Six Sigma is all about discipline, and that you can still be disciplined and still be
          creative.
      - text: Six Sigma's discipline makes creativity impossible, so keep it out of R&D
        why: Tempting because discipline can feel restrictive, but he argued the two can coexist.
  - key: q702
    type: mcq
    concept: creativity-within-discipline
    difficulty: 2
    stem: How did the guest lecturer contrast the small Australian R&D unit with the new central R&D building in Midland?
    options:
      - text: The local unit had no budget, so creativity happened only at headquarters
        why: >-
          Tempting because the local unit was small, but he credited it with creative work, including a low-cost
          sealant.
      - text: The local unit was sterile; the central building had free Friday afternoons
        why: Tempting because both details are from the lecture, but they are swapped.
      - text: Both were equally creative, but the central building had better equipment
        why: Tempting because headquarters did have great resources, but he said the central building lacked creativity.
      - text: The local unit had free Friday afternoons and noise; the central building was sterile
        correct: true
        why: >-
          Correct — he described fun Friday afternoons of play, laughter and noise in the local lab, and a sterile,
          silent central building without that creativity.
  - key: q703
    type: mcq
    concept: creativity-within-discipline
    difficulty: 2
    stem: What did the host lecturer say about ideas produced in free "play" time?
    options:
      - text: Most go to waste, but the few that work may be a goldmine
        correct: true
        why: >-
          Correct — he estimated most such ideas go to waste, but the few that work may be a goldmine, and the time
          improves culture and morale.
      - text: They distract staff and should be kept to weekends
        why: Tempting as a productivity view, but he called the time very important.
      - text: Nearly all will prove useful, which is why the free time pays for itself
        why: "Tempting as a case for play time, but he said the reverse: most will go to waste."
      - text: They should be patented before anyone tests them in the lab
        why: Tempting because patents feature in the lecture, but he said nothing of patenting play-time ideas first.
  - key: q704
    type: mcq
    concept: creativity-within-discipline
    difficulty: 3
    verify: true
    stem: What is TRIZ, as the guest lecturer described it?
    options:
      - text: GE's trademarked five-step sequence for design
        why: Tempting because the lecture mentioned it, but that is DMADV.
      - text: A Russian theory of inventive problem solving, built from patents
        correct: true
        why: >-
          Correct — he said TRIZ is a Russian acronym for the theory of inventive problem solving, built from a study of
          patents.
      - text: A Japanese quality tool for turning customer needs into requirements
        why: Tempting because the lecture also discussed QFD, but that is QFD, not TRIZ.
      - text: A statistical method for testing six factors at two levels
        why: Tempting because DOE was central to the case, but that describes a design of experiment.
  - key: q705
    type: mcq
    concept: creativity-within-discipline
    difficulty: 3
    verify: true
    stem: What did Altshuller's study of patents find, according to the guest lecture?
    options:
      - text: Patents from large firms were less novel than those from start-ups
        why: Tempting because start-ups were discussed, but he did not describe that comparison.
      - text: Most patents were truly novel, so reusing earlier solutions rarely helps
        why: Tempting because patents protect novelty, but he reported the opposite.
      - text: Only a small share were truly novel; most re-applied the same principles
        correct: true
        why: >-
          Correct — he said only about 2–3% of patents were truly novel and the rest were modifications of the same
          principles.
      - text: Patents filed by teams were more novel than those filed by individuals
        why: Tempting because teamwork was discussed, but the study he described compared novelty, not team size.
  - key: q706
    type: mcq
    concept: creativity-within-discipline
    difficulty: 3
    verify: true
    stem: How does TRIZ help with a contradiction such as wanting something strong but not heavy?
    options:
      - text: It runs a design of experiment to find the best weight for the strength
        why: Tempting because DOE optimises variables, but TRIZ draws on earlier solutions, not on experiments.
      - text: It asks customers which of the two properties they value more
        why: Tempting because customer needs drive DMEDI, but TRIZ resolves contradictions rather than trading them off.
      - text: It drops one of the properties so the contradiction disappears
        why: Tempting as a shortcut, but the point is to overcome the contradiction, not give up one side.
      - text: It points to solution principles already used for that contradiction
        correct: true
        why: >-
          Correct — he described a chart of conflicting situations and the solutions that resolve them, so you need not
          reinvent the wheel.
  - key: q707
    type: mcq
    concept: creativity-within-discipline
    difficulty: 2
    verify: true
    stem: How did Dr Kortian's patented emulsion process idea arise, as he told it?
    options:
      - text: By applying a known technique without the water
        correct: true
        why: >-
          Correct — he said the idea popped up from applying emulsion polymerisation differently: polymerise without
          water, then add water and surfactant.
      - text: From a TRIZ chart he consulted in the laboratory
        why: >-
          Tempting because he linked his idea to TRIZ afterwards, but the idea itself came from seeing a known technique
          differently.
      - text: From ArmorAll's brief to beat Thompson's WaterSeal
        why: Tempting because the brief drove the Deck Protector, but the patent was a separate process idea.
      - text: From a six-factor, two-level experiment
        why: Tempting because that experiment was in the case, but it optimised the Deck Protector's formulation.
  - key: q708
    type: mcq
    concept: creativity-within-discipline
    difficulty: 2
    stem: Why did the guest lecturer say diversity matters for creativity?
    options:
      - text: Diverse teams are easier to manage with Six Sigma tools
        why: Tempting because Six Sigma was the theme, but he linked diversity to thinking, not to manageability.
      - text: You need people who think differently
        correct: true
        why: >-
          Correct — he said with creativity you really need diversity, people who think differently, and described a
          policy of bringing them into headquarters.
      - text: Diversity was required by law in US headquarters
        why: Tempting as a compliance reason, but he gave a creative reason, not a legal one.
      - text: Diverse teams need less free time to be creative
        why: Tempting as an efficiency argument, but he made no such trade-off.
  - key: q709
    type: mcq
    concept: creativity-within-discipline
    difficulty: 3
    stem: "The host lecturer's point about creativity and structure is best summarised as:"
    options:
      - text: Creativity and structure belong in different departments
        why: >-
          Tempting as a division of labour, but he applied the balance to the whole organisation, and even to personal
          life.
      - text: Structure always comes first; creativity is added only at launch
        why: Tempting because the case has a structured process, but he called for balance throughout.
      - text: Creativity alone is chaos; structure alone gives nothing new
        correct: true
        why: >-
          Correct — he said if you are only creative there is chaos and nothing useful comes up, so you must find the
          balance with structure.
      - text: Creativity always comes first; structure is added only after launch
        why: Tempting because ideas come before products, but he argued for balance, not sequence.
  - key: q710
    type: mcq
    concept: creativity-within-discipline
    difficulty: 3
    stem: >-
      A bank adopts a strict stage-gate process for new products, and staff say ideas have dried up. Drawing on this
      lecture, what is the best advice?
    options:
      - text: Keep the discipline, but protect time to experiment and bring in people who think differently
        correct: true
        why: >-
          Correct — the lecture keeps structure but adds free experimentation time and diversity, as the local lab and
          headquarters policy showed.
      - text: Tighten the gates further so only the best ideas take staff time
        why: Tempting as quality control, but it adds structure where the problem is a lack of space for ideas.
      - text: Drop the process, since discipline and creativity cannot coexist
        why: Tempting because the process seems to blame, but the lecturer said you can be disciplined and creative.
      - text: Centralise all innovation staff in one quiet building to focus them
        why: >-
          Tempting as a focus measure, but Dow Corning's sterile central building is the lecture's example of lost
          creativity.
  - key: q711
    type: mcq
    concept: creativity-within-discipline
    difficulty: 4
    contrasts-with:
      - new-product-market-share
    stem: Which reading of Dow Corning's R&D centralisation is best supported by the materials?
    options:
      - text: It is proven to be the sole cause of NPS falling to 13%
        why: Tempting because the lecturer was critical of it, but he said the causes were argued over.
      - text: It may have cut creativity and contributed to the NPS fall, though other causes were argued
        correct: true
        why: >-
          Correct — the lecturer saw lost creativity in the central building, and said some blamed centralisation while
          others blamed siloxane limits.
      - text: It raised creativity by bringing all researchers together in one place
        why: Tempting because co-location can spark ideas, but the lecturer described the central building as sterile.
      - text: It had no effect, because R&D spending stayed at 10% of revenue
        why: Tempting because spending was steady, but the lecture is about the environment, not the amount spent.
  - key: q712
    type: mcq
    concept: creativity-within-discipline
    difficulty: 3
    verify: true
    stem: >-
      Which company did the guest lecturer give as a later example of letting staff spend a day a week on their own
      projects?
    options:
      - text: Clorox
        why: Tempting because Clorox appears in the case, but only as the company that took over ArmorAll.
      - text: Hemlock Semiconductor
        why: >-
          Tempting because Hemlock Semiconductor appears in the case, but as the polysilicon business Corning took a
          stake in.
      - text: Atlassian
        correct: true
        why: >-
          Correct — he gave Atlassian, an Australian company, as encouraging staff to spend one day a week on their own
          projects.
      - text: ArmorAll
        why: Tempting because ArmorAll is central to the case, but as Dow Corning's customer, not a model of play time.
  - key: q713
    type: mcq
    concept: creativity-within-discipline
    difficulty: 2
    verify: true
    stem: How did Dr Kortian cut the cost of a pilot plant that facilities engineering had quoted at about $150,000?
    options:
      - text: He asked the customer to fund the plant as part of the contract
        why: Tempting as a financing idea, but he described cutting the cost, not shifting it.
      - text: He rented time on a university pilot plant in Michigan instead
        why: >-
          Tempting because universities used Dow Corning's equipment, but this went the other way, and he built his own
          rig.
      - text: He skipped the pilot stage and went straight to full production
        why: Tempting as a speed tactic, but he still ran pilot trials, and stressed nothing unsafe was done.
      - text: He built a rig from containers, pumps and a static mixer
        correct: true
        why: >-
          Correct — he described 50-litre containers on scales, small pumps and an in-line static mixer, built for about
          $15,000.
  - key: q714
    type: mcq
    concept: creativity-within-discipline
    difficulty: 3
    verify: true
    stem: What point about speed did the $15,000 pilot-rig story make?
    options:
      - text: Doing things smarter, not unsafely, cut trials from about four months to four weeks
        correct: true
        why: >-
          Correct — he said they ran in four weeks what would have taken about four months, without anything unsafe or
          against requirements: they just did things smarter.
      - text: Speed came from skipping the safety checks the engineers wanted
        why: Tempting because the engineers' plan was slower, but he stressed nothing unsafe was done.
      - text: Speed came from hiring more chemists to work in parallel
        why: Tempting because parallel work helped the Deck Protector, but this story was about a cheap rig.
      - text: Speed came from buying an existing plant from a competitor
        why: Tempting as a shortcut, but he built a rig from simple parts.
  - key: q715
    type: mcq
    concept: creativity-within-discipline
    difficulty: 2
    stem: What did the host lecturer say prepares people for ideas that seem to "just come"?
    options:
      - text: Taking regular breaks well away from the subject
        why: Tempting because rest helps thinking, but he stressed preparation and expertise.
      - text: Being a well-prepared specialist in your area
        correct: true
        why: Correct — he said you need to be well prepared, a very good specialist in your area, for such ideas to come.
      - text: Living in a big city such as New York or Sydney
        why: >-
          Tempting because he mentioned big cities attracting inventors, but that was about recruiting, not where ideas
          come from.
      - text: Following a strict Six Sigma process at all times
        why: Tempting because the case is about Six Sigma, but he described ideas coming from expertise, not procedure.
  - key: q716
    type: truefalse
    concept: creativity-within-discipline
    difficulty: 2
    set: quickfire
    verify: true
    statement: The guest lecturer named TRIZ, the theory of inventive problem solving, as a tool used in Design for Six Sigma.
    answer: true
    why: >-
      True — he said one of the tools used in DMEDI, or Design for Six Sigma, is TRIZ, a Russian acronym for the theory
      of inventive problem solving.
  - key: q717
    type: truefalse
    concept: creativity-within-discipline
    difficulty: 1
    set: quickfire
    statement: The guest lecturer said discipline and creativity cannot coexist in a Six Sigma organisation.
    answer: false
    why: False — he said Six Sigma is about discipline, but you can still be disciplined and still be creative.
  - key: q718
    type: truefalse
    concept: creativity-within-discipline
    difficulty: 1
    statement: The host lecturer said most ideas from free experimentation time will go to waste.
    answer: true
    why: >-
      True — he said most such ideas may be wasted, but the few that work may be a goldmine, and the time also builds
      morale and sharing.
  - key: q719
    type: short
    concept: creativity-within-discipline
    difficulty: 4
    verify: true
    prompt: >-
      "Disciplined innovation processes such as Six Sigma kill creativity." Discuss this statement using the Dow Corning
      guest lecture.
    model: >-
      The guest lecture rejects the statement, but shows what discipline needs alongside it to stay creative. Six Sigma
      is

      about discipline: disciplined people, processes and actions. Yet Dr Kortian argued you can still be disciplined
      and

      still be creative, and the DMEDI design process itself has an Explore step that uses creativity tools to develop

      alternative concepts; he named TRIZ, which rests on the finding that few patents are truly novel, so many
      contradictions

      have known solutions. His own patented emulsion process came from applying a known technique in a new way. The

      statement does capture a real risk. When Dow Corning centralised R&D after 1992, the small Australian lab's free
      Friday

      afternoons, noise and laughter gave way to a sterile central building, and the creativity was missing; some blamed

      centralisation for the fall in New Product Market Share. The host lecturer's balance resolves it: creativity alone
      gives

      chaos, structure alone gives nothing new. So discipline does not kill creativity; removing play time, diversity
      and

      local autonomy does. The limit is that the evidence is one firm, told by one participant.
    rubric:
      - id: r1
        criterion: "Concept: discipline and creativity"
        marks: 2
        top-band: >-
          States the lecture's position (disciplined and creative) and the host lecturer's balance between chaos and
          structure.
        margin-note: Position clear from the start.
        authorities: []
      - id: r2
        criterion: "Example: evidence from the lecture"
        marks: 3
        top-band: >-
          Uses the Explore step and TRIZ, the emulsion patent, and the contrast between the local lab and the central
          building.
        margin-note: Well-chosen evidence.
        authorities:
          - mgmt2094-example-dow-corning-rd-centralisation
          - mgmt2094-example-kortian-emulsion-patent
      - id: r3
        criterion: "Application: answers the statement"
        marks: 3
        top-band: Argues what kills creativity (losing play, diversity, autonomy), not discipline as such.
        margin-note: Reframes the claim precisely.
        authorities: []
      - id: r4
        criterion: "Evaluation: limits"
        marks: 2
        top-band: Notes the evidence is one firm and one participant's account, with disputed causes.
        margin-note: Good critical awareness.
        authorities: []
  - key: q720
    type: mcq
    concept: creativity-within-discipline
    difficulty: 3
    verify: true
    stem: Which statement best links Dr Kortian's emulsion patent to TRIZ?
    options:
      - text: Both need a six-factor design of experiment before an idea is tried
        why: Tempting because DOE was central to the Deck Protector, but neither depends on it.
      - text: Both were developed for the ArmorAll Deck Protector
        why: Tempting because the Deck Protector is the case's centrepiece, but the patent and TRIZ are separate from it.
      - text: Both show that only truly novel ideas deserve a patent
        why: "Tempting because patents reward novelty, but both point the other way: most solutions adapt earlier ones."
      - text: Many problems have been solved before and can be adapted
        correct: true
        why: >-
          Correct — he said the patent relied on something he had seen before, applied in a new area, which is the
          insight behind TRIZ.
