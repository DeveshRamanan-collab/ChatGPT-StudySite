      - text: R&D, manufacturing and finance, and nothing else
        why: >-
          Tempting because those carried the Deck Protector's development, but the failure came from marketing and
          legal.
      - text: Leadership, DMAIC and Process Management
        why: Tempting because these are Six Sigma elements, but he listed organisational functions, not methods.
      - text: Marketing, legal, HR, culture and strategy
        correct: true
