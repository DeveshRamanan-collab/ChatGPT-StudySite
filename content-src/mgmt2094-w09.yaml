cards:
  - type: basic
    concept: new-product-market-share
    front: What is New Product Market Share (NPS), and what happened to it at Dow Corning?
    back: >-
      A Dow Corning KPI: the percentage of revenue that comes from newly commercialised products. Around 25% in the
      1970s and 80s; down to 13% by 1995.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 9
  - type: cloze
    concept: new-product-market-share
    text: >-
      Dow Corning spent {{c1::10%}} of revenue on R&D, yet design and commercialisation of a new product took on average
      {{c2::4 years}}.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 8
  - type: apply
    concept: new-product-market-share
    scenario: >-
      A firm's total revenue is $200 million, and $26 million comes from newly commercialised products. Its R&D spending
      is high.
    answer: >-
      NPS = 26 ÷ 200 = 13%, Dow Corning's 1995 low. As at Dow Corning, heavy R&D is not turning into new-product
      revenue: look at how products are commercialised.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 9
  - type: basic
    concept: new-product-market-share
    front: How was Dow Corning's R&D organised before and after 1992?
    back: >-
      Before 1992: decentralised, with R&D facilities at a number of locations around the world. After 1992: one central
      R&D location in Midland, Michigan.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 8
  - type: basic
    concept: transformation-and-change-management
    front: Why did Dow Corning abandon its LEOP software, and what replaced it?
    back: >-
      After 12 months and significant money spent unsuccessfully, it stopped developing software to focus on its
      strength, silicone products; in 1995 it announced SAP and its transformation program.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 6
  - type: cloze
    concept: transformation-and-change-management
    text: >-
      The 1997 redesign of commercialisation failed because poor {{c1::change management}} practices led to poor
      {{c2::take-up}} of the new processes.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 10
  - type: basic
    concept: transformation-and-change-management
    front: What was the goal of Dow Corning's transformation program?
    back: >-
      A 'world class', customer-focused, process-oriented organisation: a four-year journey (1997–2000). Three areas
      needed re-engineering; commercialisation of new products was one.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 7
  - type: apply
    concept: transformation-and-change-management
    scenario: A hospital's new triage process, designed by consultants, is ignored by staff and dropped after 18 months.
    answer: >-
      Mirrors Dow Corning 1997–99: a good design fails without change management and take-up. Dow Corning then moved to
      a leader-driven Lean Six Sigma program.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 10
  - type: cloze
    concept: transformation-and-change-management
    text: >-
      In {{c1::1999}} Dow Corning abandoned the new commercialisation process to focus on {{c2::Lean Six Sigma}}; in
      {{c3::2001}} it decided to implement Design for Six Sigma.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 10
  - type: basic
    concept: six-sigma-methods
    front: "DFSS versus DMAIC: what does each do?"
    back: >-
      DFSS (Design for Six Sigma) generates new processes, products, services and/or plants. DMAIC (the Improvement
      Process) improves existing process performance.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 11
  - type: basic
    concept: six-sigma-methods
    front: What are Process Management and Leadership in the Six Sigma triangle?
    back: >-
      Process Management: the system that enables leverage and sustains the gains of DFSS and the improvement process.
      Leadership (centre): drives and aligns the efforts strategically.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 11
  - type: cloze
    concept: six-sigma-methods
    verify: true
    text: In the guest lecture, DMAIC = {{c1::Define}}, Measure, {{c2::Analyse}}, Improve, {{c3::Control}}.
    source: Week 10 recording (Kortian guest lecture on Dow Corning)
  - type: apply
    concept: six-sigma-methods
    scenario: A call centre's existing complaint-handling process is slow and error-prone.
    answer: >-
      An existing process → DMAIC (the Improvement Process), then Process Management to hold the gains. DFSS would be
      for designing a new service.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 11
  - type: cloze
    concept: dmedi-design-process
    text: "DMEDI: {{c1::Define}}, {{c2::Measure}}, {{c3::Explore}}, {{c4::Develop}}, {{c5::Implement}}."
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 12
  - type: basic
    concept: dmedi-design-process
    front: What happens in the Measure step of DMEDI?
    back: >-
      Research customers; capture the voice of the customer; translate needs into critical-to-customer requirements
      (CCRs) using QFD; benchmark competitors; set target sigma performance.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 12
  - type: basic
    concept: dmedi-design-process
    front: What happens in the Explore step of DMEDI?
    back: >-
      Translate CCRs into functions; use creative techniques to develop alternative concepts; evaluate them (eg Pugh
      matrix) and select the best-fit concept; assess the risk of the high-level design.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 12
  - type: apply
    concept: dmedi-design-process
    scenario: >-
      The pilot of a new sealant has passed validation. The team must decide whether to build full-scale capacity and
      hand over to the plant.
    answer: >-
      Implement: execute the pilot and validation plans, make the scale-up decision, transition to process owners,
      record lessons learned.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 12
  - type: basic
    concept: dmedi-design-process
    front: Which activities run alongside every DMEDI step?
    back: >-
      Change management, customer alignment, strategy alignment, project management, project case development and
      process management.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 12
  - type: basic
    concept: deck-protector-case
    front: What was the Deck Protector brief?
    back: >-
      ArmorAll asked Dow Corning for a silicone modified organic (SMO) product to take on Thompson's WaterSeal,
      developed and commercialised within 18 months. It became the pilot for DfSS.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 13
  - type: cloze
    concept: deck-protector-case
    text: >-
      The team ran a {{c1::six}}-factor, {{c2::two}}-level design of experiment to find the mix of silane, wax and
      surfactant that met price and performance.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 14
  - type: basic
    concept: deck-protector-case
    front: What were the Deck Protector's results?
    back: >-
      In 12 months: over 4,500 tonnes, US$40 million of revenue, a Technical Achievement Award and a Manufacturing
      Achievement Award; it became the basis for all new commercialisation projects.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 16
  - type: apply
    concept: deck-protector-case
    scenario: A packaging supplier is asked by a retailer for a compostable tray within 12 months.
    answer: >-
      Follow the Deck Protector: test the key factors together, compile results with cost data, start process
      engineering concurrently, and let the customer choose formulation and price at one meeting.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 15
  - type: basic
    concept: deck-protector-case
    front: Why was ArmorAll "extremely impressed" at the key meeting?
    back: >-
      Dow Corning had done the experiments, the economics and the process design up front, so ArmorAll could simply pick
      the formulation and price.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 15
  - type: basic
    concept: customer-risk-after-commercialisation
    front: Why did the Deck Protector project stop?
    back: >-
      After 12 months ArmorAll's TV commercials were challenged by Thompson's; ArmorAll lost the legal battle, and the
      financial impact forced its takeover by Clorox.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 17
  - type: cloze
    concept: customer-risk-after-commercialisation
    text: >-
      No matter how good your {{c1::commercialisation process}}, poor {{c2::risk management}} by your customers can lead
      to project failure.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 18
  - type: basic
    concept: customer-risk-after-commercialisation
    front: What are the four lessons learned from the Deck Protector?
    back: >-
      1 The Lean (Six Sigma) approach to commercialisation was a complete success. 2 It opened up complex statistical
      and mathematical modelling. 3 Non-value-added processes were removed. 4 Poor customer risk management can cause
      failure.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 18
  - type: apply
    concept: customer-risk-after-commercialisation
    scenario: An app developer builds a payments feature for a retailer, which launches it with misleading ads and is fined.
    answer: >-
      Like ArmorAll: the developer's process can be excellent, but the customer's risk management decides the outcome.
      Judge the process and the venture separately; assess customer risk in the business case.
    source: Week 9 lecture slides (Kortian, Dow Corning), slide 18
  - type: basic
    concept: customer-risk-after-commercialisation
    front: Creativity versus innovation, as the host lecturer put it?
    back: >-
      Creativity: coming up with the idea or product. Innovation: bringing it to market (commercialising it), which
      needs marketing, legal, HR, culture and strategy to come together.
    source: Week 10 recording (Kortian guest lecture on Dow Corning)
  - type: basic
    concept: creativity-within-discipline
    front: Can a Six Sigma organisation be creative?
    back: >-
      Yes. Six Sigma is about discipline, but you can be disciplined and still be creative: protect time to play, bring
      in people who think differently, and reuse known solutions.
    source: Week 10 recording (Kortian guest lecture on Dow Corning)
  - type: basic
    concept: creativity-within-discipline
    verify: true
    front: What is TRIZ?
    back: >-
      The theory of inventive problem solving (a Russian acronym), from Altshuller's study of patents: few are truly
      novel, so many contradictions have known solution principles. Named as a DFSS tool.
    source: Week 10 recording (Kortian guest lecture on Dow Corning)
  - type: cloze
    concept: creativity-within-discipline
    text: >-
      The host lecturer: creativity without structure gives {{c1::chaos}}; you need to find the {{c2::balance}} between
      creativity and structure.
    source: Week 10 recording (Kortian guest lecture on Dow Corning)
  - type: apply
    concept: creativity-within-discipline
    scenario: A firm moves its labs into one quiet headquarters building and bans side projects.
    answer: >-
      Dow Corning's warning: the sterile central R&D building lost the creativity of the local lab's free Friday
      afternoons. Keep the discipline, but protect play time and diversity.
    source: Week 10 recording (Kortian guest lecture on Dow Corning)
audio:
  title: Week 9 recap — product development at Dow Corning
  minutes: 3
  script: >-
    This week is one long real-world example, told by a chemical engineer who lived it: how Dow Corning fixed the way it

    commercialised new products.


    Start with the problem. Dow Corning was a heavy R&D investor, ten per cent of revenue, with world-class analytical
    labs.

    Yet its key measure, New Product Market Share, the share of revenue coming from newly commercialised products, fell

    from about twenty-five per cent in the seventies and eighties to thirteen per cent by 1995, and a new product took
    about

    four years to reach the market. So the lesson is that R&D spending is not innovation. The bottleneck was

    commercialisation.


    Then the false start. Under the pressure of the breast implant litigation, Dow Corning stopped building its own

    software, chose SAP, and launched a transformation to become world class, customer focused and process oriented.

    Commercialisation was one of three areas to re-engineer. In 1997 consultants redesigned the process, and it failed,

    because poor change management meant nobody took it up. In 1999 the company switched to Lean Six Sigma, and in 2001
    to

    Design for Six Sigma.


    Keep the Six Sigma triangle straight. DMAIC improves existing processes. Design for Six Sigma creates new processes,

    products, services or plants. Process Management sustains the gains. Leaders sit in the middle and drive it. The
    design

    process Dow Corning used was DMEDI: Define, Measure, Explore, Develop, Implement. Measure captures the voice of the

    customer as critical-to-customer requirements; Explore generates concepts and picks the best fit; Develop uses tools

    like design of experiments; Implement pilots and scales up.


    The pilot was the ArmorAll Deck Protector, a silicone modified organic product to take on Thompson's WaterSeal
    within

    eighteen months. The team ran a six-factor, two-level design of experiment on silane, wax and surfactant, compiled
    the

    results with the economics, and did the process engineering at the same time, so at one meeting ArmorAll only had to

    choose. Result: over four and a half thousand tonnes and forty million US dollars in twelve months, two awards, and
    the

    model for every later project.


    And then it stopped. ArmorAll's TV ads were challenged by Thompson's, ArmorAll lost in court, and Clorox took it
    over.

    No matter how good your process, poor risk management by your customer can sink the project. That is the line
    between

    creativity, making the product, and innovation, getting it to market.


    Last, the human side. Six Sigma is discipline, but you can be disciplined and still be creative: protect time to
    play,

    bring in people who think differently, and reuse solutions that already exist.
