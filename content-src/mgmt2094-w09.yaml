      True — the slide says poor change management practices led to poor take-up of the new processes, and the process
      was abandoned in 1999.
  - key: q217
    type: truefalse
    concept: transformation-and-change-management
    difficulty: 2
    set: quickfire
    statement: Dow Corning decided to implement Design for Six Sigma in 1995, at the same time as SAP.
