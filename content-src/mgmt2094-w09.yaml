      - text: The product that took it out of bankruptcy protection
        why: Tempting because bankruptcy protection ended in 2004, but the slides never link the two.
      - text: The basis for all new commercialisation projects
        correct: true
        why: >-
          Correct — the slide says it became the basis for all new commercialisation projects for Dow Corning; the
          lecturer called it the poster child.
      - text: The last project run before DFSS was abandoned
        why: Tempting because the project stopped, but DFSS was not abandoned; the project became its model.
  - key: q515
    type: mcq
    concept: deck-protector-case
