      - text: The chemist works for the customer; the engineer for the supplier
        why: Tempting because the project crossed two firms, but both roles sat inside Dow Corning.
      - text: The chemist sets the price; the engineer tests the durability
        why: >-
          Tempting because both tasks were in the project, but the lecturer's distinction was lab recipe versus
          production process.
      - text: The chemist designs the plant; the engineer writes the recipe
        why: Tempting because both roles are named, but this reverses them.
  - key: q513
    type: mcq
    concept: deck-protector-case
    difficulty: 3
    stem: >-
      A start-up making a plant-based glue tests recipes for a year and only starts designing its factory once the
