        why: >-
          Tempting because "concurrent" suggests parallel teams, but the parallel tracks were chemistry and process
          engineering.
      - text: ArmorAll's engineers designed the plant while Dow Corning did the chemistry
        why: Tempting because ArmorAll supplied the volumes, but Dow Corning's own process engineers designed the process.
      - text: Production was designed on ArmorAll's volumes while the formulation work was still under way
        correct: true
        why: >-
          Correct — the slide says process engineering work had commenced concurrently, and a new process was designed
