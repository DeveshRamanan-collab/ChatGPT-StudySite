      - text: Complex statistical and mathematical modelling
        correct: true
        why: >-
          Correct — the second lesson: the approach opened up the use of complex statistical and mathematical modelling
          in the product development process.
      - text: Online-only distribution of products through Xiameter
        why: Tempting because Xiameter was an innovation at Dow Corning, but it is not a lesson of the Deck Protector case.
      - text: Open innovation with university research laboratories
        why: Tempting because universities used Dow Corning's instruments, but that is not one of the lessons learned.
