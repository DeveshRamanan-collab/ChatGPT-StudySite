  - key: q115
    type: mcq
    concept: new-product-market-share
    difficulty: 2
    variant-of: q101
    stem: "Dow Corning's NPS fell from about 25% to 13%. In plain terms, this means that:"
    options:
      - text: its share of the world silicone market roughly halved over the period
        why: >-
          Tempting because of the words "market share", but NPS compares new-product revenue with the company's own
          total revenue, not with rivals.
      - text: it launched about half as many new products as in the 1970s and 80s
        why: >-
          Tempting because fewer launches could lower NPS, but the KPI is about revenue earned, not the count of
          launches.
      - text: its R&D budget fell from a quarter of revenue to about an eighth
        why: >-
          Tempting because the figures look like budget shares, but R&D spend was about 10% of revenue; NPS is a revenue
          measure.
      - text: a much smaller share of its revenue came from newly commercialised products
        correct: true
        why: >-
          Correct — NPS is the % of revenue from newly commercialised products, so a fall from 25% to 13% means new
          products earned a far smaller share.
  - key: q116
    type: truefalse
    concept: new-product-market-share
    difficulty: 1
