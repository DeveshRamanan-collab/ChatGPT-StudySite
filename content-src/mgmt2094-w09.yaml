  - key: q509
    type: mcq
    concept: deck-protector-case
    difficulty: 2
    stem: What was decided at the key meeting with ArmorAll?
    options:
      - text: Which formulation and price ArmorAll would go with
        correct: true
        why: >-
          Correct — once the information was complete, a key meeting was held with ArmorAll to decide which formulation
          and price it would like to go with.
      - text: Whether Dow Corning would adopt Design for Six Sigma
        why: Tempting because the project piloted DFSS, but that was Dow Corning's internal decision, already made.
      - text: Whether to challenge Thompson's WaterSeal in the courts
        why: Tempting because a court case followed, but it was Thompson's that challenged ArmorAll, after the campaign.
      - text: How many television commercials ArmorAll would run
        why: >-
          Tempting because the commercials mattered later, but the meeting was about the product's formulation and
