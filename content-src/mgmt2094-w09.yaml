    options:
      - text: Run more single-factor tests before committing to any one recipe
        why: >-
          Tempting because more testing sounds careful, but the Deck Protector used a multi-factor design of experiment
          and parallel work.
      - text: Start process engineering and costing alongside the recipe tests
        correct: true
        why: >-
          Correct — Dow Corning ran process engineering concurrently and compiled economic data with the test results,
          so the customer could decide at once.
      - text: Hand the final recipe to the customer to scale up on its own
        why: >-
          Tempting because the customer chose the formulation, but Dow Corning designed and ran the production process
          itself.
      - text: Delay all customer meetings until the new factory is built
        why: Tempting as caution, but the decision meeting came before production, once data and process design were ready.
  - key: q514
    type: mcq
    concept: deck-protector-case
    difficulty: 2
    stem: What did the Deck Protector project become for Dow Corning afterwards?
    options:
