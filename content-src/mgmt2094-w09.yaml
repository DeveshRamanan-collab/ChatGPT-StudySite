      - text: 18 months
        why: >-
          Tempting because 18 months is in the case, but that was ArmorAll's demanded deadline for the Deck Protector,
          far shorter than the usual cycle.
      - text: 12 months
        why: >-
          Tempting because 12 months appears twice in the case (the LEOP effort, the Deck Protector campaign), but
