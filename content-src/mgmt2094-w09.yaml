        why: Correct — the slide says the financial impact of the court case forced ArmorAll to be taken over by Clorox.
      - text: It merged with Thompson's to end the dispute
        why: Tempting as a settlement, but the slides say ArmorAll lost and was taken over by Clorox.
      - text: It bought Dow Corning's SMO business outright
        why: Tempting because ArmorAll was the main SMO customer, but it was the one taken over.
