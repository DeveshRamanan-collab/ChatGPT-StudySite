    kind: other
    text: >-
      Before 1992 Dow Corning ran decentralised R&D at a number of locations around the world; after 1992 it created one
      central R&D location in Midland, Michigan. In the guest lecture Dr Kortian contrasted the small Australian R&D
      unit (Blacktown), where Friday afternoons were free for experiments amid noise and laughter, with the sterile new
      central building, and called the centralisation short-sighted; some blamed it for the fall in New Product Market
      Share.
    gloss: Used for how the working environment — local autonomy and space to play — feeds or starves creativity in R&D.
    cases: []
    verify: true
  - slug: mgmt2094-example-kortian-emulsion-patent
    title: "Example: Dr Kortian's silicone emulsion patent and pilot rig"
    kind: other
    text: >-
      Working in process engineering at Dow Corning headquarters, Dr Kortian suggested making silicone emulsions with a
      gas-liquid reactor: polymerise the droplets without water, then add the water and surfactant. Trials on a pilot
      reactor in Belgium worked, a joint patent followed, and he said the cost fell from about $2 a pound to 70–80
      cents. Separately, he built a pilot rig from 50-litre containers, small pumps and an in-line static mixer for
      about $15,000 instead of a quoted $150,000, running trials in about four weeks rather than four months.
    gloss: >-
      Used for creativity as applying an existing technique in a new area, and for doing things smarter to speed
      commercialisation.
    cases: []
    verify: true
questions:
  - key: q101
    type: mcq
    concept: new-product-market-share
    difficulty: 1
    set: pretest
    stem: One of Dow Corning's Key Performance Indicators was New Product Market Share (NPS). What did it measure?
    options:
      - text: The percentage of revenue that came from newly commercialised products
        correct: true
        why: >-
          Correct — the slide defines NPS as the % of revenue that is from newly commercialised products, an internal
          measure of how well new products sell.
      - text: Dow Corning's share of the world silicone market held by its newest lines
        why: >-
          Tempting because the name says 'market share', but NPS was not measured against competitors; it was the share
          of Dow Corning's own revenue from new products.
      - text: The share of the R&D budget spent on new rather than existing products
        why: >-
          Tempting because R&D spending (10% of revenue) sits on the same slide, but NPS measured revenue earned by new
          products, not where R&D money went.
      - text: The number of new products launched each year as a share of the catalogue
        why: >-
          Tempting because it counts new products, but NPS was revenue-based: a few big sellers could raise it, many
          small launches might not.
  - key: q102
    type: mcq
    concept: new-product-market-share
    difficulty: 2
    stem: Which pair of figures does the case give for New Product Market Share?
    options:
      - text: About 13% in the 1970s and 80s, rising to 25% by 1995
        why: >-
          Tempting because both numbers appear in the case, but this reverses the direction: NPS fell, which is why
          leadership acted.
      - text: About 25% in the 1970s and 80s, falling to 13% by 1995
        correct: true
        why: Correct — the slide says NPS was around 25% during the 1970s and 80s and had declined to 13% by 1995.
      - text: About 25% in the 1970s and 80s, falling to 10% by 2001
        why: >-
          Tempting because 10% is in the case, but 10% was the share of revenue spent on R&D, and 2001 is when DFSS was
          adopted, not an NPS reading.
      - text: About 40% in the early 1980s, falling to 25% by 1997
        why: >-
          Tempting because 1997 is when consultants were hired, but the case never gives 40%; the fall was from around
          25% to 13%.
  - key: q103
    type: mcq
    concept: new-product-market-share
    difficulty: 1
    stem: Roughly how much of its revenue did Dow Corning spend on research and development?
    options:
      - text: About 25%
        why: >-
          Tempting because 25% appears in the case, but that was the New Product Market Share in the 1970s and 80s, not
          the R&D spend.
      - text: About 13%
        why: >-
          Tempting because 13% appears in the case, but that was the New Product Market Share by 1995, not the R&D
          spend.
      - text: About 10%
        correct: true
        why: >-
          Correct — the slide says Dow Corning was a heavy investor in R&D, spending 10% of revenue on it, a point of
          pride for its executives.
      - text: About 4%
        why: >-
          Tempting because "4" appears in the case, but it refers to the four years a new product took to commercialise,
