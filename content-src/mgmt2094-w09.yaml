  - key: q201
    type: mcq
    concept: transformation-and-change-management
    difficulty: 1
    stem: Why did Dow Corning stop developing its Legal Entity Ordering Payments software (LEOP)?
    options:
      - text: IBM withdrew from the project once the breast implant lawsuits began
        why: >-
          Tempting because IBM had worked with Dow Corning on software, but the slides give no withdrawal by IBM; the
          decision was Dow Corning's own.
      - text: "After 12 costly months it chose to focus on its strength: silicone"
        correct: true
        why: >-
          Correct — after spending 12 months and a significant amount trying to develop LEOP unsuccessfully, it decided
          to stop and focus on silicone products.
      - text: The software worked well but cost too much to run alongside SAP
        why: Tempting because SAP followed, but the slides say LEOP was developed unsuccessfully, not that it worked.
      - text: The DuPont merger required it to adopt DuPont's own ordering systems
        why: Tempting because the merger is in the case, but it came in 2015; LEOP was abandoned in the mid-1990s.
  - key: q202
    type: mcq
    concept: transformation-and-change-management
    difficulty: 2
    stem: What did Dow Corning announce in 1995?
    options:
      - text: That it would merge with DuPont and buy out Corning's stake in the venture
        why: >-
          Tempting because the buyout is a major event in the case, but it was announced on 11 December 2015, twenty
          years later.
      - text: That it would implement Design for Six Sigma across its R&D
        why: Tempting because DFSS is the case's centrepiece, but the decision to implement DFSS came in 2001.
      - text: That it would implement SAP, and its program of transformation
        correct: true
        why: >-
          Correct — the slide says that in 1995 the company announced it would be implementing SAP, and also announced
          its program of transformation.
      - text: That it would centralise all of its R&D in Midland, Michigan
        why: Tempting because centralisation is in the case, but it happened after 1992 and was not the 1995 announcement.
  - key: q203
    type: mcq
    concept: transformation-and-change-management
    difficulty: 1
    stem: The transformation program aimed to make Dow Corning what kind of organisation?
    options:
      - text: A low-cost, commodity-focused and online-only one
        why: >-
          Tempting because Xiameter sold commodity products online, but that was one business, not the aim of the whole
          transformation.
      - text: A diversified software and silicone products one
        why: >-
          Tempting because software was part of the story, but Dow Corning stopped developing software to focus on
          silicone.
      - text: A decentralised, research-led and technology-driven global one
        why: >-
          Tempting because Dow Corning was R&D-heavy, but the transformation pointed towards customers and processes,
          not research leadership.
      - text: A 'world class', customer-focused and process-oriented one
        correct: true
        why: >-
          Correct — the slide's title is Dow Corning's approach of becoming a 'world class', customer focussed, and
          process oriented organisation.
  - key: q204
    type: mcq
    concept: transformation-and-change-management
    difficulty: 2
    stem: In the transformation pyramid, which layer sat at the base?
    options:
      - text: "Communications hardware: LANs, PCs, networks and video conferencing"
        correct: true
        why: >-
          Correct — the base layer was communications hardware (LANs, IBM PCs, networks, audio/video conferencing), with
          enabling software above it.
      - text: Culture, code of conduct and organisation structure
        why: >-
          Tempting because culture is foundational in many models, but on this pyramid it sat near the top, just below
          the customer-driven peak.
      - text: Customer distinction, supply chains and commercialisation excellence
        why: >-
          Tempting because this is where commercialisation sits, but it was a middle layer, built on hardware, software
          and workflow re-engineering.
      - text: Workflow re-engineering and the learning organisation
        why: Tempting because re-engineering sounds foundational, but it sat above the hardware and software layers.
  - key: q205
    type: mcq
    concept: transformation-and-change-management
    difficulty: 2
    stem: >-
      How many areas of the organisation did the transformation acknowledge needed 're-engineering', and which one is
      this case about?
    options:
      - text: "Two: supply chains and customer service"
        why: >-
          Tempting because supply chains are on the same layer of the pyramid, but the slide says three areas, and the
          case is about commercialisation.
      - text: "Three: one of them was commercialisation of new products"
        correct: true
        why: >-
          Correct — the slide's callout says there were three areas needing re-engineering, and commercialisation of new
          products was one of them.
      - text: "Three: the enabling software layer, led by the SAP rollout"
        why: >-
          Tempting because SAP was a big change, but software was an enabling layer of the pyramid, not the
          re-engineering area the case follows.
      - text: "Five: one for each step of the DMEDI design process"
        why: >-
          Tempting because DMEDI has five steps, but DMEDI came later; the transformation named three areas to
          re-engineer.
  - key: q206
    type: mcq
    concept: transformation-and-change-management
    difficulty: 1
    set: pretest
    stem: Why did the commercialisation process designed by consultants in 1997 fail?
    options:
      - text: The consultants were dismissed when bankruptcy protection began
        why: Tempting because bankruptcy protection overlapped, but the slides give no dismissal; the problem was take-up.
      - text: ArmorAll refused to develop new products under the new process
        why: Tempting because ArmorAll was a key customer, but ArmorAll appears later, in the DFSS pilot.
      - text: Poor change management practices led to poor take-up of it
        correct: true
        why: >-
          Correct — the slide says implementation was not successful because poor change management practices led to
          poor take-up of the new processes.
      - text: The process was technically flawed for a chemicals business
        why: >-
          Tempting because consultants were outsiders, but the slides do not say the design was flawed; they blame how
          it was implemented.
  - key: q207
    type: mcq
    concept: transformation-and-change-management
    difficulty: 2
    stem: What did Dow Corning do in 1999?
    options:
      - text: Decided, within Lean Six Sigma, to implement Design for Six Sigma
        why: Tempting because it follows directly, but the decision to implement DFSS was made in 2001.
      - text: Emerged from nine years of bankruptcy protection in Michigan
        why: Tempting because bankruptcy protection is in the case, but it ended in June 2004.
      - text: Hired a consulting company to redesign its commercialisation process
        why: Tempting because it is the step just before, but the consultants were hired in 1997.
      - text: Abandoned the new process to focus on Lean Six Sigma
        correct: true
        why: >-
          Correct — the slide says that in 1999 leadership decided to abandon the new commercialisation process and
          focus on the Lean Six Sigma implementation.
  - key: q208
    type: mcq
    concept: transformation-and-change-management
    difficulty: 2
    stem: >-
      Put these in order: (A) DFSS chosen as part of Lean Six Sigma; (B) consultants hired to redesign
      commercialisation; (C) SAP and the transformation program announced; (D) the new commercialisation process
      abandoned.
    options:
      - text: C, B, D, A
        correct: true
        why: >-
          Correct — 1995 SAP and transformation (C), 1997 consultants (B), 1999 abandoned for Lean Six Sigma (D), 2001
          DFSS (A).
      - text: B, C, D, A
        why: >-
          Tempting if the consultants are placed first, but SAP and the transformation (1995) came before the
          consultants (1997).
      - text: C, D, B, A
        why: >-
          Tempting if abandonment is placed early, but the process had to be designed (1997) before it was abandoned
          (1999).
      - text: C, B, A, D
        why: >-
          Tempting if DFSS is thought to replace the failed process directly, but DFSS (2001) came after the 1999
          abandonment.
  - key: q209
    type: mcq
    concept: transformation-and-change-management
    difficulty: 3
    stem: >-
      The guest lecturer explained why new ways of working struggled at Dow Corning in the 1990s. What was the common
      thread?
    options:
      - text: Each was cancelled to pay for the breast implant settlement
        why: Tempting because the settlement was costly, but the lecturer gave change management, not cost, as the reason.
      - text: Each new idea was a change, and leaders lacked the change-management skills to make it stick
        correct: true
        why: >-
          Correct — the lecturer said every new idea was essentially a change, and leadership was not skilled in the
          change-management practices needed for take-up.
      - text: Each was imposed by IBM as a condition of its software contract
        why: Tempting because IBM appears in the case, but the lecturer did not say IBM imposed anything.
      - text: Each failed because the technology was not ready in the 1990s
        why: >-
          Tempting because the period predates modern software, but the lecturer blamed people and change management,
          not technology.
  - key: q210
    type: mcq
    concept: transformation-and-change-management
    difficulty: 3
    stem: >-
      A university redesigns its course-approval process with consultants. Staff keep using the old forms, say the new
      process "won't work", and after two years it is dropped. Which part of the Dow Corning story does this mirror?
    options:
      - text: The 2001 Design for Six Sigma pilot on the ArmorAll Deck Protector
        why: >-
          Tempting because DFSS also changed the process, but its pilot was a complete success and became the model for
          later projects.
      - text: The post-1992 centralisation of R&D in a single Midland building
        why: >-
          Tempting because centralisation was criticised, but the case does not describe it as a process staff refused
          to adopt.
      - text: The 1994 LEOP project, abandoned to focus on core strengths
        why: >-
          Tempting because both were abandoned, but LEOP was dropped because software was not a core strength, not
          because staff resisted it.
      - text: The 1997–99 redesign of commercialisation, never taken up
        correct: true
        why: >-
          Correct — a consultant-designed process, poor take-up and abandonment after about two years is exactly the
          1997–99 commercialisation story.
  - key: q211
    type: mcq
    concept: transformation-and-change-management
    difficulty: 3
    variant-of: q201
    stem: >-
      A food manufacturer spends a year building its own payroll software, gives up, and buys an off-the-shelf system so
      it can concentrate on recipes and plants. Which Dow Corning decision does this resemble?
    options:
      - text: Stopping LEOP and implementing SAP, to focus on silicone products
        correct: true
        why: >-
          Correct — Dow Corning spent 12 months on its own software, stopped, announced SAP, and refocused on its
          strength in silicone.
      - text: Creating Xiameter to sell its commodity products online
        why: >-
          Tempting because Xiameter was also a business-model change, but it concerned selling commodities, not dropping
          in-house software.
      - text: Abandoning the consultant process because staff would not adopt it
        why: >-
          Tempting because both were abandoned, but the consultant process failed through poor take-up, not because it
          lay outside the firm's strengths.
      - text: Centralising R&D in one building to share expensive equipment
        why: >-
          Tempting as another efficiency move, but centralisation was about where research happened, not about dropping
          non-core work.
  - key: q212
    type: mcq
    concept: transformation-and-change-management
    difficulty: 2
    stem: According to the slides, what followed for Dow Corning from the silicone breast implant litigation?
    options:
      - text: A settlement paid in 1984 and a return to clinical markets in 1998
        why: Tempting because both years appear, but lawsuits began in 1984 and the class action settlement came in 1998.
      - text: Nine years in bankruptcy protection; exit from clinical markets
        correct: true
        why: >-
          Correct — the slide says Dow Corning was in bankruptcy protection for nine years, ending in June 2004, during
          which it largely withdrew from clinical markets.
      - text: An immediate sale to Dow Chemical and a change of name to Dow Silicones
        why: Tempting because both happened eventually, but Dow took full ownership in 2016 and the name changed in 2018.
      - text: Closure of the Midland plant and a move of production to Australia
        why: >-
          Tempting because the lecturer worked in Australia, but the slides never mention closing Midland, which became
          the R&D centre.
  - key: q213
    type: mcq
    concept: transformation-and-change-management
    difficulty: 2
    stem: On the transformation slide, "Six Sigma" arrows point into the pyramid. What does that signal?
    options:
      - text: Six Sigma replaced the transformation program after it failed
        why: >-
          Tempting because Lean Six Sigma did replace the consultant process, but the pyramid shows Six Sigma inside the
          transformation, not replacing it.
      - text: Six Sigma was a software layer alongside SAP and Siebel
        why: Tempting because the software layer is on the pyramid, but Six Sigma is a methodology, not software.
      - text: Six Sigma was the method applied to re-engineer the layers
        correct: true
        why: >-
          Correct — the lecturer said that by applying the Six Sigma methodology of transformation they would become the
          world-class, customer-driven organisation at the top.
      - text: Six Sigma applied only to the hardware at the base
        why: >-
          Tempting because the arrows sit on one side, but they point into the upper re-engineering layers, not the
          hardware.
  - key: q214
    type: mcq
    concept: transformation-and-change-management
    difficulty: 4
    stem: Which statement best evaluates Dow Corning's 1997–2001 path for an essay on implementing innovation processes?
    options:
      - text: It shows bankruptcy forces firms to stop innovating until the crisis is over
        why: >-
          Tempting because the period overlapped bankruptcy protection, but Dow Corning kept changing and innovating
          throughout.
      - text: It shows consultants should never redesign an innovation process
        why: >-
          Tempting because the consultant process failed, but the slides blame poor change management, not the use of
          consultants.
      - text: It shows that dropping a process after two years is always a leadership failure
        why: >-
          Tempting because leaders abandoned it, but dropping a process that is not being taken up can be the right
          call, as the move to Lean Six Sigma suggests.
      - text: "Design was not enough: new methods stuck only once leaders drove a company-wide program"
        correct: true
        why: >-
          Correct — the redesign failed for poor take-up; under Lean Six Sigma, with leaders driving and aligning the
          effort, the DFSS pilot became the model for all projects.
  - key: q215
    type: mcq
    concept: transformation-and-change-management
    difficulty: 1
    stem: Which software did Dow Corning announce it would implement after giving up on LEOP?
    options:
      - text: SAP
        correct: true
        why: >-
          Correct — the slide says that in 1995 the company announced it would be implementing SAP, after stopping its
          own software development.
      - text: Siebel
        why: >-
          Tempting because Siebel is on the enabling-software layer of the pyramid, but the 1995 announcement after LEOP
          was SAP.
      - text: Outlook
        why: >-
          Tempting because Outlook is on the enabling-software layer of the pyramid, but it was not the system that
          replaced LEOP.
      - text: IBM's custom system
        why: >-
          Tempting because Dow Corning had worked with IBM before, but the point of the decision was to stop building
          its own custom software.
  - key: q216
    type: truefalse
    concept: transformation-and-change-management
    difficulty: 1
    set: quickfire
    statement: Dow Corning's 1997 redesign of its commercialisation process failed mainly because of poor change management.
    answer: true
