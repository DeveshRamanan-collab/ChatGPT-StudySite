      - text: The DuPont merger required one single global process for commercialising products
        why: >-
          Tempting because the merger is in the case, but it was announced in 2015, two decades after the decision to
          improve commercialisation.
      - text: NPS had fallen to 13% and new products were taking about four years to commercialise
        correct: true
        why: >-
          Correct — the slides set the NPS decline (25% to 13%) beside the four-year cycle, and conclude leadership
          determined commercialisation must improve.
      - text: Its R&D spending had fallen below 10% of revenue after the breast implant settlement
        why: Tempting because the settlement was costly, but the case gives no fall in R&D spending; it says 10% was spent.
  - key: q111
    type: mcq
    concept: new-product-market-share
    difficulty: 1
    stem: In the Dow Corning case, what does "commercialisation" of a new product mean?
    options:
      - text: Moving a product from specialty pricing to a commodity price point
        why: >-
          Tempting because the lecture discusses commodity products and Xiameter, but that is a pricing and channel
          decision, not commercialisation.
      - text: Registering a patent so the idea is protected from competitors
        why: >-
          Tempting because patents feature in the lecture, but a patent protects an invention; it does not take a
          product to market.
      - text: Running the laboratory experiments that produce a new formulation
        why: >-
          Tempting because experiments are the first stage, but commercialisation covers the whole path to sale, not
          only the lab work.
      - text: Taking an idea through testing and scale-up to sale
        correct: true
        why: >-
          Correct — the lecture traces it from the idea through laboratory testing, the pilot plant and market testing
          to fine-tuning and selling.
  - key: q112
    type: mcq
    concept: new-product-market-share
    difficulty: 3
    contrasts-with:
      - transformation-and-change-management
    stem: >-
      A manager says: "Our share of revenue from new products is falling, so the answer is to spend more on R&D." Using
      Dow Corning, what is the best reply?
    options:
      - text: "Disagree: R&D was already 10% and NPS fell; fix commercialisation"
        correct: true
        why: >-
          Correct — the case shows heavy R&D did not stop NPS halving, so leadership targeted the commercialisation
          process instead.
      - text: "Disagree: NPS measures market share, which R&D spending cannot affect at all"
        why: >-
          Tempting as a rebuttal, but it misdefines NPS, which is the share of revenue from new products, not market
          share.
      - text: "Agree: Dow Corning recovered its NPS once it lifted R&D spending above 10%"
        why: >-
          Tempting because more R&D sounds like more innovation, but the case never reports such a rise; the fix was a
          commercialisation process.
      - text: "Agree: centralise R&D in one place to raise both efficiency and NPS"
        why: >-
          Tempting because centralisation promises efficiency, but Dow Corning centralised after 1992 and NPS still
          fell; some even blamed the centralisation.
