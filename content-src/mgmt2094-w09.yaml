      - text: NPS declined from around 25% to 13% by 1995
        why: "Tempting to rule out, but it is listed: NPS fell from around 25% in the 1970s–80s to 13% by 1995."
      - text: After 1992 R&D was centralised in Midland, Michigan
        why: >-
          Tempting to rule out, but it is listed among the commercialisation issues: management created a central R&D
          location after 1992.
  - key: q114
    type: mcq
    concept: new-product-market-share
    difficulty: 4
    stem: Which conclusion about the cause of the NPS decline is best supported by the materials?
    options:
      - text: The decline was an artefact of how the new SAP system recorded revenue
        why: Tempting because SAP arrived in the same period, but nothing in the case questions the NPS figures themselves.
      - text: The decline was proven to be caused by the 1992 centralisation of R&D
        why: >-
          Tempting because the guest lecturer was critical of centralisation, but he said this was one view among
