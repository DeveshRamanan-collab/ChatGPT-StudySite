      program.
  - key: q218
    type: truefalse
    concept: transformation-and-change-management
    difficulty: 1
    set: quickfire
    statement: Commercialisation of new products was one of the three areas the transformation said needed 're-engineering'.
    answer: true
    why: >-
      True — the transformation slide's callout says there were three areas needing re-engineering, and
      commercialisation of new products was one of them.
  - key: q219
    type: short
    concept: transformation-and-change-management
    difficulty: 3
    prompt: >-
      "A better innovation process will succeed only if the organisation manages the change it brings." Discuss this
      statement with reference to Dow Corning's attempts to fix commercialisation between 1997 and 2001.
    model: >-
      The statement holds for Dow Corning: a new innovation process is itself a change, and it works only if people take

      it up. In 1997

      Dow Corning hired a consulting company to redesign commercialisation after NPS fell to 13%. The slides say

      implementation failed because poor change management practices led to poor take-up; the lecturer added that every
      new

      idea was a change and leaders were not skilled in making it stick. In 1999 the process was abandoned and the
      company

      focused on Lean Six Sigma, a company-wide program in which business leaders drive and align the methods
      strategically.

      In 2001 it implemented Design for Six Sigma within that program and piloted it on the ArmorAll Deck Protector,
      which

      succeeded and became the basis for all new commercialisation projects. What changed was less the idea of a better

      process than the vehicle: a leader-driven program with its own on-going change management. A limit: the pilot also
      had

      a demanding customer and an 18-month deadline, so the evidence cannot isolate change management as the only cause.
    rubric:
      - id: r1
        criterion: "Concept: implementing a process is a change"
        marks: 2
        top-band: States that a new innovation process needs take-up, so change management is part of innovation.
        margin-note: Clear framing of the problem.
        authorities: []
      - id: r2
        criterion: "Example: the 1997–2001 sequence"
        marks: 3
        top-band: >-
          Gives the 1997 consultants, failure through poor take-up, the 1999 switch to Lean Six Sigma and the 2001 DFSS
          pilot accurately.
        margin-note: Dates and causes right.
        authorities:
          - mgmt2094-example-dow-corning
      - id: r3
        criterion: "Application: what changed"
        marks: 3
        top-band: >-
          Explains the shift to a leader-driven company-wide program, with change management running through the design
          process.
        margin-note: Identifies the mechanism, not just the outcome.
        authorities: []
      - id: r4
        criterion: "Evaluation: limits"
        marks: 2
        top-band: >-
          Notes other factors in the pilot (customer pressure, deadline) and that one case cannot isolate a single
          cause.
        margin-note: Good critical distance.
        authorities: []
  - key: q220
    type: match
    concept: transformation-and-change-management
    difficulty: 2
    prompt: Match each year to the Dow Corning event.
    pairs:
      - left: "1994"
        right: Work starts on its own LEOP software
      - left: "1995"
        right: SAP and the transformation program announced
      - left: "1997"
        right: Consulting company hired to redesign commercialisation
      - left: "1999"
        right: New process abandoned to focus on Lean Six Sigma
      - left: "2001"
        right: Design for Six Sigma implemented within Lean Six Sigma
  - key: q301
    type: mcq
    concept: six-sigma-methods
    difficulty: 1
    set: pretest
    stem: According to the slides, what does Design for Six Sigma (DFSS) do?
    options:
      - text: Drives and aligns all of the improvement efforts strategically
        why: >-
          Tempting because DFSS is strategic for new products, but driving and aligning the efforts is the role of
          leaders, at the centre of the triangle.
      - text: Improves the performance of processes that already exist
        why: >-
          Tempting because Six Sigma is known for improvement, but improving existing process performance is the job of
          DMAIC, not DFSS.
      - text: Generates new processes, products, services and/or plants
        correct: true
        why: >-
          Correct — the slide says DFSS generates new processes, products, services and/or plants; Dow Corning used it
          for new-product development.
      - text: Sustains the gains that the other two methods have achieved
        why: Tempting because DFSS gains need sustaining, but that is the role of Process Management in the triangle.
  - key: q302
    type: mcq
    concept: six-sigma-methods
    difficulty: 1
    stem: Which Six Sigma method improves existing process performance?
    options:
      - text: DMEDI, the design process
        why: >-
          Tempting because DMEDI sounds like DMAIC, but DMEDI was the five-step design process used for new products
          under DFSS.
      - text: DFSS, Design for Six Sigma (new designs)
        why: >-
          Tempting because it is the method the case focuses on, but DFSS generates new processes and products rather
          than improving existing ones.
      - text: Process Management
        why: >-
          Tempting because it concerns existing processes, but its job is to sustain and leverage gains, not to run the
          improvement itself.
      - text: DMAIC, the Improvement Process
        correct: true
        why: >-
          Correct — the slide says DMAIC improves existing process performance; it is the Improvement Process side of
          the triangle.
  - key: q303
    type: mcq
    concept: six-sigma-methods
    difficulty: 2
    stem: What role does Process Management play among the three principal Six Sigma methods?
    options:
      - text: It is the system that enables leverage and sustains the gains of DFSS and DMAIC
        correct: true
        why: >-
          Correct — the slide says Process Management is the system that enables leverage and sustaining gains achieved
          by DFSS and the Sigma Improvement Process.
      - text: It is the step in which new products are designed, piloted and scaled up
        why: >-
          Tempting because DMEDI has design and pilot steps, but that is DFSS; Process Management sustains what the
          other methods achieve.
      - text: It is the project-management phase that opens every DMAIC project
        why: >-
          Tempting because project management runs through the design process, but Process Management is a separate,
          continuing system.
      - text: It is the leadership function placed at the centre of the triangle
        why: >-
          Tempting because it is one of the three elements, but leadership sits at the centre; Process Management is a
          side of the triangle.
  - key: q304
    type: mcq
    concept: six-sigma-methods
    difficulty: 1
    stem: In the Six Sigma triangle shown on the slide, what sits at the centre?
    options:
      - text: Process Management
        why: >-
          Tempting because it is one of the three elements, but Process Management forms the base of the triangle, not
          its centre.
      - text: Leadership
        correct: true
        why: >-
          Correct — Leadership is in the centre: business leaders drive the three principal methods and align the
          efforts strategically.
      - text: The customer
        why: >-
          Tempting because the transformation aimed at a customer-driven company, but the triangle puts leadership, not
          the customer, at the centre.
      - text: The DMEDI process
        why: >-
          Tempting because DMEDI was Dow Corning's design process, but it sits inside the DFSS side, not at the centre
          of the triangle.
  - key: q305
    type: mcq
    concept: six-sigma-methods
    difficulty: 2
    stem: >-
      A bottling plant already makes juice but rejects too many bottles at the capping station. Which Six Sigma method
      fits best?
    options:
      - text: DMEDI, because every quality problem starts with Define
        why: >-
          Tempting because DMEDI starts with Define, but DMEDI is the design process for new products under DFSS, not
          for fixing existing ones.
      - text: DFSS, because the plant needs a new capping product designed
        why: >-
          Tempting because a redesign could help, but nothing new is being created here; the existing capping process is
          underperforming.
      - text: DMAIC, because it improves an existing process
        correct: true
        why: >-
          Correct — the capping station is an existing process with too many defects, which is exactly what DMAIC (the
          Improvement Process) improves.
      - text: Process Management, because the gains must be sustained first
        why: >-
          Tempting because sustaining gains matters, but there are no gains yet to sustain; the process must first be
          improved.
  - key: q306
    type: mcq
    concept: six-sigma-methods
    difficulty: 2
    variant-of: q305
    stem: >-
      A company wants to launch a deck-waterproofing product that it has never made before. Which Six Sigma method fits
      best?
    options:
      - text: DMAIC, because it improves the existing product line
        why: >-
          Tempting because the firm has other products, but this one does not exist yet, so there is no existing process
          to improve.
      - text: Process Management, because it sustains the existing gains
        why: Tempting because gains will need sustaining later, but first something new has to be designed and created.
      - text: Leadership alone, because leaders align the whole effort
        why: >-
          Tempting because leaders drive all three methods, but leadership is not itself the method for creating the
          product.
      - text: DFSS, because it generates new products
        correct: true
        why: >-
          Correct — DFSS generates new processes, products, services and/or plants; Dow Corning used it for exactly this
          kind of product, the Deck Protector.
  - key: q307
    type: mcq
    concept: six-sigma-methods
    difficulty: 3
    contrasts-with:
      - dmedi-design-process
    stem: "A student writes: \"Dow Corning used DMAIC to develop the Deck Protector.\" What is wrong with this?"
    options:
      - text: The Deck Protector was new, so it used DFSS (via DMEDI); DMAIC improves existing processes
        correct: true
        why: >-
          Correct — the Deck Protector was the pilot for DFSS, run through the DMEDI design process; DMAIC is for
          improving processes that already exist.
      - text: The Deck Protector used Process Management, because it was a pilot
        why: Tempting because the project was a pilot, but Process Management sustains gains; the pilot was for DFSS.
      - text: DMAIC was only introduced after the Deck Protector project ended
        why: >-
          Tempting as a timing objection, but the slides present DMAIC and DFSS as parts of the same Six Sigma program,
          not one after the other.
      - text: "Nothing: DMAIC and DMEDI are two names for the same design process"
        why: >-
          Tempting because the acronyms look alike, but DMAIC improves existing processes while DMEDI is the design
          process for new ones.
  - key: q308
    type: mcq
    concept: six-sigma-methods
    difficulty: 2
    stem: As the guest lecturer explained it, what kind of methodology is Six Sigma?
    options:
      - text: A software system for ordering and payments, like SAP or LEOP
        why: >-
          Tempting because SAP and Six Sigma arrived in the same transformation, but Six Sigma is a methodology, not
          software.
      - text: A quality-improvement methodology about processes and discipline
        correct: true
        why: >-
          Correct — the lecturer called Six Sigma a quality improvement methodology about building and improving
          processes, efficiency and effectiveness, and discipline.
      - text: A market-research method for estimating demand for products
        why: >-
          Tempting because the design process has a strong market-research focus, but that is one part of it, not what
          Six Sigma is.
      - text: A creativity technique for generating radical new ideas for products
        why: >-
          Tempting because DFSS creates new products, but the lecturer described Six Sigma as quality improvement and
          discipline, while arguing creativity can coexist with it.
  - key: q309
    type: mcq
    concept: six-sigma-methods
    difficulty: 3
    verify: true
    stem: In the guest lecture, what do the letters of DMAIC stand for?
    options:
      - text: Define, Measure, Explore, Develop, Implement
        why: >-
          Tempting because it is the other five-letter sequence in the case, but these are the DMEDI design steps, not
          DMAIC.
      - text: Design, Measure, Analyse, Implement, Check
        why: >-
          Tempting because it mixes familiar quality words, but the lecture gave define, measure, analyse, improve and
          control.
      - text: Define, Measure, Analyse, Improve, Control
        correct: true
        why: >-
          Correct — the lecturer said Six Sigma followed the methodology of define, measure, analyse, improve and
          control: DMAIC.
      - text: Define, Model, Assess, Improve, Confirm
        why: >-
          Tempting because it keeps the D, I and C, but the lecture gave measure, analyse and control for the M, A and
          C.
  - key: q310
    type: mcq
    concept: six-sigma-methods
    difficulty: 3
    verify: true
    stem: According to the guest lecture, where did Six Sigma start, and who popularised it?
    options:
      - text: It started at Motorola and was popularised by GE in the mid-1990s
        correct: true
        why: >-
          Correct — the lecturer said Six Sigma started at Motorola, and its popularity came in the mid-1990s when GE
          reported large financial benefits.
      - text: It started at Toyota and was popularised by Ford in the oil-crisis 1970s
        why: >-
          Tempting because the lecturer told the Toyota and Japanese-quality story first, but that was the background;
          Six Sigma itself came from Motorola.
      - text: It started at Dow Corning and was popularised by PwC from 2001
        why: >-
          Tempting because Dow Corning adopted it in 2001 with consultants' terms, but it was an adopter, not the
          origin.
      - text: It started in Japanese electronics firms and was popularised by IBM
        why: >-
          Tempting because Japanese competition prompted it, but it was a US firm's response, and IBM is not named as
          its champion.
  - key: q311
    type: mcq
    concept: six-sigma-methods
    difficulty: 3
    verify: true
    stem: Why, according to the guest lecture, was Dow Corning's design process called DMEDI rather than GE's DMADV?
    options:
      - text: DMEDI was invented by Dow Corning itself for the Deck Protector pilot
        why: >-
          Tempting because the Deck Protector was the DFSS pilot, but the lecturer said DMEDI was a term used by
          consultants such as PwC.
      - text: GE had trademarked DMADV, so others, such as PwC, used DMEDI
        correct: true
        why: >-
          Correct — the lecturer said GE had trademarked DMADV, so firms such as PwC used a different term, DMEDI, which
          Dow Corning followed.
      - text: DMADV had been dropped in 1999 along with the consultants' process
        why: >-
          Tempting because something was abandoned in 1999, but that was the consultant-designed commercialisation
          process, not DMADV.
      - text: DMADV was meant for services, while DMEDI was designed for chemicals
        why: Tempting as a plausible industry split, but the lecturer gave a trademark reason, not an industry one.
  - key: q312
    type: mcq
    concept: six-sigma-methods
    difficulty: 2
    stem: Who drives the three principal methods of Six Sigma, according to the slide?
    options:
      - text: External consultants, who design the processes for each business
        why: >-
          Tempting because consultants were hired in 1997, but the slide says business leaders drive the methods; that
          consultant effort failed.
      - text: Process owners, who take over the design after the Implement step
        why: >-
          Tempting because process owners receive the design in Implement, but they run processes; leaders drive the
          methods.
      - text: Business leaders, who drive and align the efforts strategically
        correct: true
        why: >-
          Correct — the slide: business leaders drive the three principal methods; leaders drive and align the efforts
          strategically.
      - text: Customers, whose voice sets the critical-to-customer requirements
        why: >-
          Tempting because the voice of the customer shapes the design, but customers do not drive a firm's Six Sigma
          program.
  - key: q313
    type: mcq
    concept: six-sigma-methods
    difficulty: 4
    stem: >-
      A firm used DFSS to launch a new product and DMAIC to fix its packing line, but within a year both have slipped
      back to old habits. Which part of the Six Sigma triangle was missing?
    options:
      - text: Measure, because the voice of the customer was never captured
        why: >-
          Tempting because Measure is a familiar step, but it is a DMEDI step, not a side of the triangle, and the issue
          is slipping back.
      - text: DFSS, because the new product needed to be redesigned again
        why: >-
          Tempting because the product is involved, but the design worked at launch; the problem is that the gains were
          not held.
      - text: DMAIC, because the packing line needed to be improved again
        why: >-
          Tempting because the line slipped back, but improving it again without a sustaining system would only repeat
          the problem.
      - text: Process Management, the system that sustains the gains made
        correct: true
        why: >-
          Correct — the slide says Process Management is the system that enables leverage and sustaining of the gains
          achieved by DFSS and the improvement process.
  - key: q314
    type: mcq
    concept: six-sigma-methods
    difficulty: 3
    contrasts-with:
      - dmedi-design-process
    stem: Which pairing correctly matches the problem to the Six Sigma method?
    options:
      - text: Existing process underperforming → DMAIC; new product needed → DFSS
        correct: true
        why: >-
          Correct — DMAIC improves existing process performance; DFSS generates new processes, products, services and/or
          plants.
      - text: Existing process underperforming → Process Management; new product needed → DMAIC
        why: >-
          Tempting because Process Management concerns existing processes, but it sustains gains; it is DMAIC that
          improves performance.
      - text: Existing process underperforming → DFSS; new product needed → Process Management
        why: >-
          Tempting because DFSS is the case's main method, but it is for the new product, and Process Management does
          not design anything.
      - text: Existing process underperforming → DFSS; new product needed → DMAIC
        why: >-
          Tempting because both methods appear, but this swaps them: DFSS creates new things and DMAIC improves existing
          ones.
  - key: q315
    type: mcq
    concept: six-sigma-methods
    difficulty: 2
    stem: Why did Dow Corning adopt Design for Six Sigma in 2001?
    options:
      - text: Because DFSS was needed to complete the implementation of SAP
        why: >-
          Tempting because SAP was part of the same transformation, but DFSS is a design methodology, not a software
          requirement.
      - text: As part of Lean Six Sigma, to give it a new-product development process
        correct: true
        why: >-
          Correct — the slide says that in 2001, as part of its Lean Six Sigma program, it decided to implement DFSS,
          which the lecturer called its new product development process.
      - text: Because the 1997 consultant process had already proved that it worked
        why: Tempting because DFSS followed it, but the 1997 process failed through poor take-up and was abandoned in 1999.
      - text: Because ArmorAll required it as a condition of the Deck Protector supply deal
        why: >-
          Tempting because the Deck Protector was the first DFSS project, but the slides say the project became the
          pilot, not that ArmorAll demanded DFSS.
  - key: q316
    type: truefalse
    concept: six-sigma-methods
    difficulty: 1
    set: quickfire
    statement: DMAIC is the Six Sigma method for generating new processes, products, services and plants.
    answer: false
    why: False — that is DFSS. DMAIC, the Improvement Process, improves the performance of existing processes.
  - key: q317
    type: truefalse
    concept: six-sigma-methods
    difficulty: 2
    set: quickfire
    statement: In the Six Sigma triangle, Process Management sustains the gains achieved by DFSS and the improvement process.
    answer: true
    why: >-
      True — the slide says Process Management is the system that enables leverage and sustaining gains achieved by DFSS
      and the Sigma Improvement Process.
  - key: q318
    type: truefalse
    concept: six-sigma-methods
    difficulty: 1
    set: quickfire
    statement: The guest lecturer described Six Sigma mainly as a quality-improvement methodology about processes and discipline.
    answer: true
    why: >-
      True — he called it a quality improvement methodology about building and improving processes, efficiency and
      effectiveness, and discipline.
  - key: q319
    type: mcq
    concept: six-sigma-methods
    difficulty: 2
    variant-of: q305
    stem: Which method would Dow Corning have used to cut defects on an existing silicone sealant production line?
    options:
      - text: Process Management, used on its own
        why: >-
          Tempting because the line already exists, but Process Management sustains gains once they are made; it does
          not make them.
      - text: DMAIC, the Improvement Process
        correct: true
        why: Correct — the line exists and has defects, so DMAIC, which improves existing process performance, is the fit.
      - text: None, since Six Sigma covers only new products
        why: >-
          Tempting because the case centres on new products, but Six Sigma began as an improvement methodology for
          existing processes.
      - text: DFSS, worked through the five DMEDI steps
        why: >-
          Tempting because DFSS and DMEDI are the case's focus, but they are for creating new products, not fixing an
          existing line.
  - key: q320
    type: match
    concept: six-sigma-methods
    difficulty: 1
    prompt: Match each element of the Six Sigma triangle to its role.
    pairs:
      - left: DFSS
        right: Generates new processes, products, services and/or plants
      - left: DMAIC
        right: Improves existing process performance
      - left: Process Management
        right: Enables leverage and sustains the gains
      - left: Leadership
        right: Drives and aligns the efforts strategically
  - key: q401
    type: mcq
    concept: dmedi-design-process
    difficulty: 1
    stem: What are the five steps of the Six Sigma design process (DMEDI), in order?
    options:
      - text: Define, Model, Evaluate, Develop, Install
        why: >-
          Tempting because it keeps the first and fourth letters, but the slide gives Measure, Explore and Implement for
          the others.
      - text: Define, Measure, Analyse, Improve, Control
        why: >-
          Tempting because it is the better-known Six Sigma sequence, but these are the DMAIC improvement steps, not the
          design steps.
      - text: Discover, Measure, Explore, Design, Implement
        why: >-
          Tempting because it shares Measure, Explore and Implement, but the slide starts with Define, and its fourth
          step is Develop, not Design.
      - text: Define, Measure, Explore, Develop, Implement
        correct: true
        why: >-
          Correct — the slide headed Six Sigma Design Process - DMEDI lists 1.0 Define, 2.0 Measure, 3.0 Explore, 4.0
          Develop, 5.0 Implement.
  - key: q402
    type: mcq
    concept: dmedi-design-process
    difficulty: 2
    stem: >-
      In which DMEDI step is the voice of the customer captured and translated into critical-to-customer requirements
      (CCRs)?
    options:
      - text: Measure
        correct: true
        why: >-
          Correct — Measure covers researching customers, identifying their needs, translating them into CCRs and
          building the QFD matrix.
      - text: Explore
        why: >-
          Tempting because Explore starts from the CCRs, but it translates them into functions and concepts; it does not
          capture them.
      - text: Develop
        why: Tempting because detailed design depends on requirements, but by Develop the CCRs have already been set.
      - text: Define
        why: >-
          Tempting because Define comes first, but it sets up the charter and project plan; customer research comes
          next.
  - key: q403
    type: mcq
    concept: dmedi-design-process
    difficulty: 2
    stem: >-
      In which DMEDI step are creative techniques used to develop alternative concepts, and the best-fit concept
      selected?
    options:
      - text: Define
        why: Tempting because Define shapes the project, but it sets the charter and plan rather than generating concepts.
      - text: Explore
        correct: true
        why: >-
          Correct — Explore uses creative techniques to develop alternative concepts, evaluates them and selects the
          best-fit concept.
      - text: Measure
        why: >-
          Tempting because measurement informs choice, but Measure ends with requirements; concepts are generated after
          it.
      - text: Develop
        why: Tempting because concepts are developed into designs here, but Develop works on the chosen concept in detail.
  - key: q404
    type: mcq
    concept: dmedi-design-process
    difficulty: 2
    stem: In which DMEDI step does the team make the scale-up decision and transition the design to process owners?
    options:
      - text: Explore
        why: Tempting because Explore looks at production process design at a high level, but scaling up comes at the end.
      - text: Measure
        why: >-
          Tempting because the scale-up rests on measured results, but Measure is about customer requirements, early in
          the process.
      - text: Implement
        correct: true
        why: >-
          Correct — Implement executes the pilot and validation plans, makes the scale-up decision and transitions the
          design to process owners.
      - text: Develop
        why: >-
          Tempting because pilot plans are written in Develop, but they are executed, and the scale-up decision made, in
          Implement.
  - key: q405
    type: mcq
    concept: dmedi-design-process
    difficulty: 1
    stem: Which DMEDI step develops a charter, a multi-generational plan and a project plan to manage the project?
    options:
      - text: Explore
        why: Tempting because Explore looks ahead to designs, but the charter and project plan are set up at the start.
      - text: Implement
        why: >-
          Tempting because Implement has implementation plans, but those are for full-scale roll-out, not the project
          charter.
      - text: Measure
        why: >-
          Tempting because plans need measures, but Measure is about customers and requirements; the charter comes
          before it.
      - text: Define
        correct: true
        why: >-
          Correct — Define's objectives are to develop a charter, a multi-generational product/service plan and a
          project plan to manage the project.
  - key: q406
    type: mcq
    concept: dmedi-design-process
    difficulty: 3
    stem: >-
      The Deck Protector chemists ran a six-factor, two-level design of experiment. On the DMEDI slide, design of
      experiments (DOE) is listed among the tools of which step?
    options:
      - text: Develop
        correct: true
        why: >-
          Correct — DOE is listed with FMEA, Weibull and process control plans among the tools of 4.0 Develop, where the
          detailed design is optimised.
      - text: Implement, since an experiment validates the product pilot
        why: >-
          Tempting because pilots validate results, but validation in Implement uses pilot assessments; DOE belongs to
          Develop.
      - text: Measure, since an experiment measures the product's results
        why: >-
          Tempting because experiments measure results, but Measure is about customer needs and requirements; DOE is a
          design tool.
      - text: Explore, since an experiment explores alternative concepts
        why: >-
          Tempting because the name suggests exploring, but Explore selects a concept; DOE refines the chosen design in
          detail.
  - key: q407
    type: mcq
    concept: dmedi-design-process
    difficulty: 3
    stem: >-
      ArmorAll wanted a product that met or exceeded Thompson's WaterSeal on waterproofing, at a target price. In DMEDI,
      this is best treated as:
    options:
      - text: a scale-up decision, made in the final Implement step
        why: >-
          Tempting because price affects scale-up, but the customer's target comes at the start of the process, not at
          scale-up.
      - text: a critical-to-customer requirement, captured in Measure
        correct: true
        why: >-
          Correct — performance and price targets from the customer are its needs translated into CCRs, which is the
          work of Measure.
      - text: the best-fit concept, selected in the Explore step of DMEDI
        why: >-
          Tempting because the product concept follows from it, but the target is a requirement the concepts must meet,
          not a concept.
      - text: a process control plan, written up in the Develop step
        why: >-
          Tempting because control plans hold targets, but they control a production process, not the customer's
          requirement.
  - key: q408
    type: mcq
    concept: dmedi-design-process
    difficulty: 2
    stem: Which tool is listed on the slide for translating customer needs into requirements in the Measure step?
    options:
      - text: A Pugh matrix, used to compare concepts
        why: >-
          Tempting because it is a selection tool on the slide, but the Pugh matrix is used in Explore to compare
          concepts.
      - text: A Gantt chart, used to schedule the project
        why: Tempting because it appears on the slide, but a Gantt chart schedules the project in Define and Implement.
      - text: Quality Functional Deployment (QFD)
        correct: true
        why: >-
          Correct — the Measure row organises information using a QFD matrix to turn customer needs into
          critical-to-customer requirements.
      - text: FMEA, used to assess design risks
        why: >-
          Tempting because it is a well-known Six Sigma tool, but the slide lists FMEA in Develop, for assessing risks
          in the detailed design.
  - key: q409
    type: mcq
    concept: dmedi-design-process
    difficulty: 3
    stem: Which activities does the slide show running alongside every DMEDI step?
    options:
      - text: Brainstorming, prototyping, testing and launching
        why: Tempting because they sound like a design cycle, but they are not the on-going activities named on the slide.
      - text: Define, measure, analyse, improve and control
        why: Tempting because they are Six Sigma words, but they are the DMAIC steps, not activities alongside DMEDI.
      - text: Patent searching, legal review, advertising and pricing
        why: >-
          Tempting because each matters to commercialisation (and legal review would have helped ArmorAll), but none is
          on the slide.
      - text: Change management, customer alignment, strategy alignment, project management
        correct: true
        why: >-
          Correct — the On-Going Activities column lists change management, customer alignment, strategy alignment,
          project management, project case development and process management.
  - key: q410
    type: mcq
    concept: dmedi-design-process
    difficulty: 2
    variant-of: q403
    stem: On the DMEDI slide, "creativity tools" and a Pugh matrix appear among the tools of which step?
    options:
      - text: Define, where the project is scoped, chartered and planned
        why: >-
          Tempting because scoping takes judgement, but the tools there are the charter, Gantt chart and
          in-and-out-of-scope tool.
      - text: Explore, where concepts are generated and selected
        correct: true
        why: >-
          Correct — creativity tools generate alternative concepts and the Pugh matrix compares them, so both sit in
          Explore.
      - text: Develop, where the detailed design is worked out
        why: Tempting because design continues here, but its tools are DOE, FMEA, Weibull and process control plans.
      - text: Implement, where the pilot is run and validated
        why: Tempting because choices are made at scale-up, but the tools there are pilot validation and process control.
  - key: q411
    type: mcq
    concept: dmedi-design-process
    difficulty: 3
    stem: >-
      A team has five rough concepts for a new sealant and must choose one to take into detailed design. Which step are
      they in, and what is its deliverable?
    options:
      - text: Develop — a process control plan
        why: Tempting because detailed design is next, but control plans come after a concept has been chosen and designed.
      - text: Implement — a scale-up decision
        why: >-
          Tempting because a decision is being made, but scale-up comes after piloting, not when choosing between
          concepts.
      - text: Explore — best-fit concept selection
        correct: true
        why: >-
          Correct — generating and comparing alternative concepts and choosing the best fit is Explore; "Best-Fit
          Concept Selection" is one of its deliverables.
      - text: Measure — capturing the voice of the customer
        why: >-
          Tempting because customers inform the choice, but the voice of the customer was captured earlier; now concepts
          are being compared.
  - key: q412
    type: mcq
    concept: dmedi-design-process
    difficulty: 2
    variant-of: q404
    stem: >-
      A new product's pilot run has been validated, and management must decide whether to build full-scale production.
      Which DMEDI step is this?
    options:
      - text: Measure — capture customer requirements
        why: Tempting because results are measured, but Measure is the early step for customer requirements.
      - text: Develop — write detailed designs and pilot plans
        why: >-
          Tempting because pilot plans are written in Develop, but running the pilot and deciding on scale-up are in
          Implement.
      - text: Explore — choose the best-fit concept
        why: Tempting because high-level production design starts here, but scale-up comes much later.
      - text: Implement — run the pilot, then scale up
        correct: true
        why: >-
          Correct — Implement executes the pilot and validation plans, analyses the results and makes the scale-up
          decision.
  - key: q413
    type: mcq
    concept: dmedi-design-process
    difficulty: 4
    stem: Why did the guest lecturer say the statistics in DMEDI were the same as in today's big-data analytics?
    options:
      - text: The analysis is the same; big data uses populations where they used samples
        correct: true
        why: >-
          Correct — he said the statistics and analysis are the same; the difference is that big data uses population
          statistics instead of samples.
      - text: Big-data analytics has replaced customer research inside DMEDI
        why: >-
          Tempting because big data is powerful, but he stressed the market-research focus of DMEDI, not its
          replacement.
      - text: Both rely on qualitative interviews rather than on statistics
        why: Tempting because the voice of the customer can be qualitative, but his point was about statistical analysis.
      - text: DMEDI already ran on cloud computing and data lakes in the 1990s
        why: Tempting because he compared the two eras, but he said they used laptops then and cloud tools now.
  - key: q414
    type: mcq
    concept: dmedi-design-process
    difficulty: 2
    stem: Which deliverable belongs to the Measure step?
    options:
      - text: Detailed product and production process design
        why: Tempting because process design is measurable, but it is a deliverable of Develop.
      - text: Critical-to-customer requirements (CCRs)
        correct: true
        why: >-
          Correct — the Measure deliverables include the voice of the customer, competitive benchmarking and CCR
          definition.
      - text: Best-fit concept selection
        why: Tempting because selection needs data, but best-fit concept selection is a deliverable of Explore.
      - text: Validation testing complete and a gap analysis
        why: Tempting because testing produces measurements, but validation testing is a deliverable of Implement.
  - key: q415
    type: mcq
    concept: dmedi-design-process
    difficulty: 3
    contrasts-with:
      - six-sigma-methods
    stem: "A classmate says: \"DMEDI and DMAIC are the same thing.\" Which reply is correct?"
    options:
      - text: DMEDI is the improvement process; DMAIC is the design process
        why: >-
          Tempting because both are named, but this swaps them: DMAIC improves existing processes; DMEDI designs new
          ones.
      - text: DMEDI is the leadership layer; DMAIC is process management
        why: >-
          Tempting because the triangle has those elements, but leadership and Process Management are separate from both
          sequences.
      - text: DMEDI designs new products (DFSS); DMAIC improves existing processes
        correct: true
        why: >-
          Correct — DMEDI was Dow Corning's design process under DFSS; DMAIC is the Improvement Process for existing
          process performance.
      - text: They are the same, but DMEDI is the version used in the chemical industry
        why: Tempting because Dow Corning is a chemicals firm, but the difference is the job each does, not the industry.
  - key: q416
    type: truefalse
    concept: dmedi-design-process
    difficulty: 1
    set: quickfire
    statement: In DMEDI, the 'E' in the middle stands for Explore.
    answer: true
    why: >-
      True — the five steps are Define, Measure, Explore, Develop and Implement; Explore is where alternative concepts
      are generated and the best fit chosen.
  - key: q417
    type: truefalse
    concept: dmedi-design-process
    difficulty: 2
    set: quickfire
    statement: Benchmarking competitor performance is one of the main activities of the Measure step.
    answer: true
    why: >-
      True — the Measure row includes benchmarking competitor performance, alongside researching customers and setting
      CCRs.
  - key: q418
    type: truefalse
    concept: dmedi-design-process
    difficulty: 2
    set: quickfire
    statement: In DMEDI, the scale-up decision is made in the Develop step.
    answer: false
    why: >-
      False — Develop writes the pilot plans; the scale-up decision is made in Implement, after the pilot and validation
      plans have been executed.
  - key: q419
    type: short
    concept: dmedi-design-process
    difficulty: 3
    prompt: >-
      "A structured design process such as DMEDI makes innovation more reliable, but only up to the factory gate."
      Discuss this statement, walking through the five DMEDI steps with the ArmorAll Deck Protector as your example.
    model: >-
      The statement is largely right. DMEDI was Dow Corning's Six Sigma design process for new products under DFSS:
      Define, Measure, Explore, Develop,

      Implement, with change management, customer and strategy alignment and project management running throughout. In
      the

      Deck Protector, Define set up the project: ArmorAll's brief to take on Thompson's WaterSeal with an SMO product
      within

      18 months. Measure captured the customer's requirements: waterproofing that met or exceeded the competitor, at a
      price.

      Explore produced the concept, an SMO emulsion built from silane, wax and surfactant. Develop optimised it: a
      six-factor,

      two-level design of experiment, durability testing and economic data, with process engineering running
      concurrently.

      Implement followed agreement at the key meeting: production on ArmorAll's volumes, over 4,500 tonnes and US$40
      million

      in 12 months. The strength is that the structure front-loads customer requirements, statistics and economics, so
      the

      customer could simply choose. The limit is that the process stops at the factory gate: ArmorAll's legal loss over
      its

      TV commercials ended the project, so a structured design process cannot manage risks held by the customer.
    rubric:
      - id: r1
        criterion: "Concept: the five steps"
        marks: 2
        top-band: Names Define, Measure, Explore, Develop, Implement in order and places DMEDI under DFSS.
        margin-note: Steps right and in order.
        authorities: []
      - id: r2
        criterion: "Example: Deck Protector mapped to steps"
        marks: 3
        top-band: >-
          Maps the brief, the requirements, the SMO concept, the design of experiment and the production run to the
          right steps.
        margin-note: Accurate mapping, not a retelling.
        authorities:
          - mgmt2094-example-armorall-deck-protector
      - id: r3
        criterion: "Application: what the structure added"
        marks: 2
        top-band: >-
          Explains front-loading (experiments, economics, concurrent process engineering) and its effect at the decision
          meeting.
        margin-note: Shows why the process mattered.
        authorities: []
      - id: r4
        criterion: "Evaluation: strength and limit"
        marks: 3
        top-band: >-
          Gives a supported strength and a supported limit, eg customer risk outside the process, using the
          post-commercialisation facts.
        margin-note: Balanced judgement backed by the case.
        authorities: []
  - key: q420
    type: match
    concept: dmedi-design-process
    difficulty: 2
    prompt: Match each activity to its DMEDI step.
    pairs:
      - left: Develop a charter and project plan
        right: Define
      - left: Translate customer needs into CCRs
        right: Measure
      - left: Select the best-fit concept
        right: Explore
      - left: Perform FMEA and write pilot plans
        right: Develop
      - left: Make the scale-up decision
        right: Implement
  - key: q501
    type: mcq
    concept: deck-protector-case
    difficulty: 1
    set: pretest
    stem: Who approached Dow Corning with the idea for the Deck Protector, and which product was it meant to take on?
    options:
      - text: ArmorAll, to take on Thompson's WaterSeal
        correct: true
        why: >-
          Correct — the slide says ArmorAll, one of Dow Corning's major customers, approached it with the idea of taking
          on Thompson's WaterSeal with an SMO product.
      - text: Clorox, to take on Thompson's WaterSeal
        why: >-
          Tempting because Clorox appears in the case, but only at the end, when it took over ArmorAll after the court
          case.
      - text: ArmorAll, to take on Dow Chemical's sealants
        why: >-
          Tempting because ArmorAll is right, but the target was Thompson's WaterSeal, the leader in deck protection,
          not Dow Chemical.
      - text: Thompson's, to take on ArmorAll's protectant
        why: >-
          Tempting because both names belong to the story, but the roles are swapped: ArmorAll was the customer and
          Thompson's WaterSeal the market leader to beat.
  - key: q502
    type: mcq
    concept: deck-protector-case
    difficulty: 1
    stem: In the Deck Protector case, what is an SMO product?
    options:
      - text: A six-sigma managed operation
        why: Tempting because the project piloted Six Sigma design, but SMO names the product chemistry, not the method.
      - text: A silicone modified organic product
        correct: true
        why: >-
          Correct — the slide calls it a Silicone Modified Organic (SMO) product: organic chemistry improved with a
          little silicone.
      - text: A synthetic marine oil product
        why: Tempting because the product was a water-proofer, but SMO stands for silicone modified organic.
      - text: A silicone monomer oil-based product
        why: Tempting because silicone oils are among Dow Corning's products, but SMO stands for silicone modified organic.
  - key: q503
    type: mcq
    concept: deck-protector-case
    difficulty: 2
    stem: Why was SMO Dow Corning's strategy for growth?
    options:
      - text: ArmorAll would only buy products that contained no silicone at all
        why: >-
          Tempting because ArmorAll drove the project, but an SMO product is silicone modified, so it does contain
          silicone.
      - text: SMO products did not need to pass through Design for Six Sigma
        why: Tempting because SMO was new, but the first SMO product was the DFSS pilot, so the reverse was true.
      - text: The number of permutations with the siloxane backbone was limited
        correct: true
        why: >-
          Correct — the slide says that as the number of permutations with the siloxane backbone was limited, SMO was
          the strategy for growth.
      - text: Organic chemicals were cheaper to produce than any of its silicones
        why: >-
          Tempting as a cost argument, but the slide gives the limits of siloxane chemistry as the reason, not
          production cost.
  - key: q504
    type: mcq
    concept: deck-protector-case
    difficulty: 1
    stem: How long did ArmorAll give Dow Corning to develop and commercialise the Deck Protector?
    options:
      - text: Four years
        why: Tempting because four years was the usual commercialisation time, but ArmorAll wanted it far faster.
      - text: 12 months
        why: >-
          Tempting because 12 months appears in the results, but that was the length of the sales campaign, not the
          deadline.
      - text: Six months
        why: Tempting as a stretch target, but the slide gives 18 months, with an exclamation mark at how short it was.
      - text: 18 months
        correct: true
        why: >-
          Correct — the slide says ArmorAll wanted Dow Corning to develop and commercialise the product within 18
          months.
  - key: q505
    type: mcq
    concept: deck-protector-case
    difficulty: 2
    stem: What kind of experiment did the team run to find the right mix for the Deck Protector?
    options:
      - text: A six-factor, two-level design of experiment
        correct: true
        why: >-
          Correct — the slide says a six factor, two level Design of Experiment was conducted, which the lecturer called
          quite large.
      - text: A single-factor trial varying only the wax content
        why: >-
          Tempting because wax was one ingredient, but varying one factor at a time would miss how silane, wax and
          surfactant interact.
      - text: A customer survey of six competing deck sealants
        why: >-
          Tempting because the target was a competitor, but the experiment tested formulations in the lab, not customer
          opinions.
      - text: A two-factor, six-level design of experiment
        why: "Tempting because the numbers are right, but they are swapped: the slide says six factors at two levels."
  - key: q506
    type: mcq
    concept: deck-protector-case
    difficulty: 2
    stem: Which three components had to be combined to meet both the price and the performance requirements?
    options:
      - text: Silane, catalyst and pigment
        why: Tempting because silane is right, but the other two were wax and surfactant, not a catalyst and pigment.
      - text: Silane, wax and surfactant
        correct: true
        why: >-
          Correct — the slide says the next challenge was the right combination of Silane, Wax and surfactant to meet
          price and performance.
      - text: Siloxane, resin and solvent
        why: >-
          Tempting because siloxane is the backbone of Dow Corning's products, but the slide names silane, wax and
          surfactant.
      - text: Silicone, water and polymer
        why: >-
          Tempting because an emulsion contains water, but the slide names silane, wax and surfactant as the combination
          to optimise.
  - key: q507
    type: mcq
    concept: deck-protector-case
    difficulty: 2
