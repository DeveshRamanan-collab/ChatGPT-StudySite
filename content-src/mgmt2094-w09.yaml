        why: "Tempting to pick, but it is reported: the product generated US$40 million of revenue."
      - text: A patent for the SMO emulsion formulation
        correct: true
        why: >-
          Correct — no patent is listed among the results. The patent the lecturer discussed was his separate emulsion
