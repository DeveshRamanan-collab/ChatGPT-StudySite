  - key: q119
    type: short
    concept: new-product-market-share
    difficulty: 3
    prompt: >-
      "Spending more on R&D is the surest way for a firm to become more innovative." Discuss this statement, using the
      Dow Corning case and the KPI it used to track new products.
    model: >-
      The statement confuses invention with innovation. An idea becomes an innovation only once it is commercialised —

      taken through testing and scale-up into the market — and Dow Corning shows the gap. It was a heavy R&D investor,
      spending 10% of

      revenue on R&D, and its analytical capabilities were among the best in the world. Yet its KPI New Product Market
      Share

      (NPS), the percentage of revenue from newly commercialised products, fell from around 25% in the 1970s and 80s to
      13%

      by 1995, while a new product took on average four years to design and commercialise. The science was strong; the
      path

      to market was slow. Leadership therefore targeted the commercialisation process, first through consultants (1997),

      then through Lean Six Sigma and Design for Six Sigma (2001). A limit: the causes of the decline were disputed —

      centralising R&D after 1992 and the limited permutations on the siloxane backbone were both blamed — so NPS shows
      that

      commercialisation was failing, not exactly why.
    rubric:
      - id: r1
        criterion: "Concept: innovation as commercialisation, not invention"
        marks: 2
        top-band: Defines innovation as bringing an idea to market and distinguishes it from R&D or invention.
        margin-note: Good — innovation is more than invention.
        authorities: []
      - id: r2
        criterion: "Example: Dow Corning figures"
        marks: 3
        top-band: >-
          Uses the 10% R&D spend, the four-year cycle and NPS falling from about 25% to 13% by 1995, with NPS defined
          correctly.
        margin-note: Figures accurate and used, not just listed.
        authorities:
          - mgmt2094-example-dow-corning
      - id: r3
        criterion: "Application: what the KPI reveals"
        marks: 3
        top-band: >-
          Explains that NPS measures revenue from new products, so it captures the commercialisation gap that R&D
          spending hides.
        margin-note: Links the KPI to the argument.
        authorities: []
      - id: r4
        criterion: "Evaluation: limits of the evidence"
        marks: 2
        top-band: Notes the disputed causes (centralisation, siloxane limits) and that NPS shows the symptom, not the cause.
        margin-note: Nice — recognises what the KPI cannot tell you.
        authorities: []
