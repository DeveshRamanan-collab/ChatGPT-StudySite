  - key: q511
    type: mcq
    concept: deck-protector-case
    difficulty: 4
    stem: According to the guest lecturer, what was the key to getting the Deck Protector off the ground?
    options:
      - text: Skipping the pilot plant to save time against the deadline
        why: Tempting because the deadline was tight, but the lecturer credited thorough up-front work, not skipped steps.
      - text: Copying Thompson's formula and undercutting it on price
        why: >-
          Tempting because price mattered, but the aim was to meet or exceed Thompson's performance, through
          experiments, not copying.
      - text: Letting the chemists work alone until the product was perfect
        why: >-
          Tempting because chemistry was central, but the point was chemistry, process engineering and finance working
          together.
      - text: Front-loading experiments, economics and process design so the customer only had to choose
        correct: true
        why: >-
          Correct — the lecturer said they spent far more time up front on experiments, financial analysis and process
          engineering; the customer only had to pick.
  - key: q512
    type: mcq
    concept: deck-protector-case
    difficulty: 2
