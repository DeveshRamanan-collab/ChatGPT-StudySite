      - text: Four years
        correct: true
        why: Correct — the slides twice say design and commercialisation of new products took on average 4 years.
  - key: q105
    type: mcq
    concept: new-product-market-share
    difficulty: 2
    stem: What change did Dow Corning make to the organisation of its R&D after 1992?
    options:
      - text: It created one central R&D location in Midland, Michigan
        correct: true
        why: >-
          Correct — the slide says that before 1992 R&D was decentralised, and after 1992 management created a central
          R&D location in Midland, MI.
      - text: It spread R&D out to a number of locations around the world
        why: >-
          Tempting because the slide mentions R&D at several locations, but that describes the position before 1992; the
          change was the reverse.
      - text: It moved R&D into the University of Michigan and Michigan State
        why: >-
          Tempting because the universities used its equipment, but that shows the strength of its analytical
