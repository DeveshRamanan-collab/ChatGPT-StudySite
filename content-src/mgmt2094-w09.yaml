        why: Tempting because Thompson's was the competitor, but its weapon was a legal challenge, not a new product.
      - text: ArmorAll lost a legal fight over its TV ads and was taken over
        correct: true
        why: >-
          Correct — Thompson's challenged ArmorAll's TV commercials, ArmorAll lost, and the financial impact forced its
          takeover by Clorox.
      - text: DFSS was abandoned and the product lost its internal funding
        why: >-
          Tempting because the consultant process had been abandoned earlier, but DFSS became the basis for all later
          projects.
      - text: Dow Corning could not scale production past 4,500 tonnes a year
        why: >-
          Tempting because the volume figure is in the case, but it is a result, not a limit; production was not the
          problem.
  - key: q602
    type: mcq
    concept: customer-risk-after-commercialisation
    difficulty: 1
    stem: Who challenged ArmorAll's TV commercials for the Deck Protector?
    options:
      - text: Dow Chemical
        why: Tempting because Dow later owned Dow Corning, but it plays no part in the dispute over the commercials.
      - text: Dow Corning
        why: >-
          Tempting because Dow Corning was involved, but it was ArmorAll's supplier and had no reason to challenge its
          customer's ads.
      - text: Thompson's
        correct: true
        why: >-
          Correct — the slide says ArmorAll had run TV commercials that Thompson's challenged them on, and a legal
          battle followed.
      - text: Clorox
        why: >-
          Tempting because Clorox appears at the end, but it took over ArmorAll after the court case; it did not bring
