  - key: q520
    type: short
    concept: deck-protector-case
    difficulty: 3
    prompt: >-
      "The fastest way to commercialise a new product is to spend more time before you start making it." Discuss this
      statement using the ArmorAll Deck Protector.
    model: >-
      The Deck Protector supports the statement, with one qualification. ArmorAll asked Dow Corning for a silicone

      modified organic product to take on Thompson's WaterSeal within 18 months, against a usual four-year cycle, and
      the

      project became the pilot for Design for Six Sigma. Rather than build first, the team front-loaded the work: a

      six-factor, two-level design of experiment on silane, wax and surfactant, durability testing compiled with
      economic and

      profitability data, and process engineering running concurrently on ArmorAll's volumes. At one key meeting
      ArmorAll only

      had to choose the formulation and price; it was impressed with the detail. In 12 months over 4,500 tonnes and
      US$40

      million followed, with two awards, and the project became the basis for all new commercialisation. So more time up

      front bought speed overall, because decisions were not re-opened later. The qualification is that "before you
      start

      making it" is not the same as "in sequence": the speed came from running chemistry, economics and process design
      in

      parallel, and it could not protect the project from the customer's later legal loss.
    rubric:
      - id: r1
        criterion: "Concept: front-loading in DFSS"
        marks: 2
        top-band: >-
          Explains front-loading: customer requirements, experiments and economics settled early, with concurrent
          process engineering.
        margin-note: Concept stated precisely.
        authorities: []
      - id: r2
        criterion: "Example: Deck Protector facts"
        marks: 3
        top-band: >-
          Uses the brief (18 months, Thompson's), the six-factor two-level DOE, the economic data, the decision meeting
          and the results accurately.
        margin-note: Facts accurate and selected for the argument.
        authorities:
          - mgmt2094-example-armorall-deck-protector
      - id: r3
        criterion: "Application: answers the statement"
        marks: 3
        top-band: Takes a position on the statement and explains why up-front work shortened the whole cycle.
        margin-note: Argues, not just describes.
        authorities: []
      - id: r4
        criterion: "Evaluation: qualification"
        marks: 2
        top-band: "Qualifies the claim: speed came from parallel work, and the method could not control the customer's risks."
        margin-note: Good — a real limit, from the case.
        authorities: []
  - key: q601
    type: mcq
    concept: customer-risk-after-commercialisation
    difficulty: 1
    set: pretest
    stem: Why did the Deck Protector project stop after 12 months?
    options:
