  - key: q603
    type: mcq
    concept: customer-risk-after-commercialisation
    difficulty: 2
    stem: Which of the case's lessons concerns the customer?
    options:
      - text: Customers should never be allowed to set price and performance targets for a supplier
        why: Tempting because ArmorAll set demanding targets, but meeting them is what made the pilot a success.
      - text: A customer's marketing department should run its supplier's pilot projects
        why: Tempting because marketing is in the story, but ArmorAll's marketing caused the failure; it ran no pilot.
      - text: A B2B supplier should take over the advertising of the end product itself
        why: >-
          Tempting as a fix for the ad problem, but the lesson is about the customer's risk management, not about taking
          over its marketing.
      - text: No matter how good your commercialisation process, poor risk management by customers can cause failure
        correct: true
        why: >-
          Correct — the fourth lesson: no matter how good your commercialisation process, poor risk management by your
          customers can lead to project failure.
  - key: q604
    type: mcq
    concept: customer-risk-after-commercialisation
    difficulty: 2
    stem: Which of these is one of the four lessons learned on the slide?
    options:
      - text: Existing processes were challenged and non-value-added ones removed
        correct: true
        why: >-
          Correct — the third lesson: existing processes were challenged and, when identified as non value added, were
          removed.
      - text: Commercialisation should always be completed in under 18 months
        why: Tempting because 18 months was the brief, but no lesson sets a fixed time limit.
      - text: R&D should be decentralised again to regain lost creativity
        why: >-
          Tempting because the lecturer regretted centralisation, but that was his comment, not one of the four lessons
          on the slide.
      - text: A customer's advertising should be vetted by the supplier's lawyers
        why: >-
          Tempting as a response to what went wrong, but the slide's lesson is about customers' risk management in
          general.
  - key: q605
    type: mcq
    concept: customer-risk-after-commercialisation
    difficulty: 2
    stem: According to the lessons learned, what did the new approach open up in product development?
    options:
