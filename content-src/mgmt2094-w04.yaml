cards:
  - type: cloze
    concept: parallel-thinking
    text: >-
      Parallel thinking is an alternative to {{c1::argument}}: each thinker puts forward thoughts in parallel with
      others, rather than {{c2::attacking}} the thoughts of others.
    source: Week 04 Lecture Slides, slide 3
  - type: basic
    concept: parallel-thinking
    front: What do the hats have to do with parallel thinking?
    back: >-
      Hats help a group use parallel thinking: you can "put on" and "take off" a hat because they are directions of
      thinking, so everyone thinks in one direction at a time.
    source: Week 04 Lecture Slides, slide 3
  - type: basic
    concept: parallel-thinking
    front: Name de Bono's three difficulties in practical thinking and the hats' answer to each.
    back: >-
      Emotions → feelings used at the right place; helplessness → a framework of definite next steps; confusion → one
      direction at a time.
    source: Kivunja (2015), Week 04 reading
  - type: apply
    concept: parallel-thinking
    scenario: In a strategy meeting two managers argue back and forth about a new product while everyone else stays silent.
    answer: >-
      Switch to parallel thinking: the whole group takes one direction at a time (e.g. all yellow, then all black), so
      ideas are put forward, not attacked, and the quiet members get a voice.
    source: Week 04 Lecture Slides, slide 3
  - type: basic
    concept: six-thinking-hats
    front: Six hats in one line each.
    back: >-
      Blue — control, process, overview. White — information, facts. Yellow — benefits, harmony. Green — growth,
      creativity. Red — emotion, intuition. Black — problems, caution.
    source: Week 04 Lecture Slides, slide 4–29
  - type: cloze
    concept: six-thinking-hats
    text: >-
      The {{c1::white}} hat is neutral, objective and non-emotional: it focuses on facts and figures, extrapolates
      trends from historical data and searches for {{c2::gaps in the knowledge}}.
    source: Week 04 Lecture Slides, slide 12
  - type: cloze
    concept: six-thinking-hats
    text: The red hat presents views based on intuition and instinct, without {{c1::explanation or justification}}.
    source: Week 04 Lecture Slides, slide 24
  - type: basic
    concept: six-thinking-hats
    front: What does the slide say about the black hat, good and bad?
    back: >-
      It looks at risks and why a proposed solution will fail; it makes plans tougher, more resilient and helps spot
      fatal flaws — but it can be over-used.
    source: Week 04 Lecture Slides, slide 28
  - type: apply
    concept: six-thinking-hats
    scenario: >-
      A team member asks: "Can we combine the delivery idea with the subscription idea? What would happen if we did
      both?"
    answer: >-
      Green hat: combining ideas and "what would happen if?" are green-hat questions — creating ideas, with no criticism
      or judgement.
    source: Week 04 Lecture Slides, slide 21
  - type: basic
    concept: six-thinking-hats
    front: Why is black the colour of caution (Kivunja's account of de Bono)?
    back: >-
      "Critical" comes from the Greek for judge, and in many countries judges wear black; black hat thinking is
      checking, not a bad hat.
    source: Kivunja (2015), Week 04 reading
  - type: basic
    concept: running-a-hats-session
    front: What does the blue hat do in a session?
    back: >-
      Manages the thinking process: control of thinking and the process, instructions for thinking, organisation of
      thinking, control of the other hats, discipline and focus — the facilitator's role. Begin and end with blue.
    source: Week 04 Lecture Slides, slide 8
  - type: basic
    concept: running-a-hats-session
    front: What goes on the closing blue-hat slide?
    back: What we have achieved, outcome, conclusion, design, solution, next steps.
    source: Week 04 Lecture Slides, slide 30
  - type: cloze
    concept: running-a-hats-session
    text: >-
      Using the hats: use any hat as often as needed; sequence can be {{c1::preset or evolving}}; not necessary to use
      every hat; time under each hat is generally {{c2::short}}.
    source: Week 04 Lecture Slides, slide 31
  - type: basic
    concept: running-a-hats-session
    front: The four general hat issues?
    back: Direction, not description; not categories of people; a constructive form of showing off; use in whole or in part.
    source: Week 04 Lecture Slides, slide 32
  - type: apply
    concept: running-a-hats-session
    scenario: "A manager says: \"Jess is our black hat thinker, so she can do the risks.\""
    answer: >-
      This breaks "not categories of people": everyone can and should use all the hats; hats are directions, not
      personalities.
    source: Week 04 Lecture Slides, slide 32
  - type: basic
    concept: hat-sequences
    front: Which order assesses an idea, and what can follow?
    back: >-
      Yellow before black (positive, then negative aspects); you could follow up with green (new ideas) and then red
      (feelings).
    source: Week 04 Lecture Slides, slide 34
  - type: cloze
    concept: hat-sequences
    text: >-
      Red then white compares {{c1::fact with opinion}}; white then blue asks what we know in facts and {{c2::where we
      plan to go}}.
    source: Week 04 Lecture Slides, slide 34
  - type: cloze
    concept: hat-sequences
    text: >-
      Black, then yellow, then green is {{c1::comparing and synthesising}} — coming up with new ideas from the known.
      The design sequence uses the {{c2::blue, green and red}} hats.
    source: Week 04 Lecture Slides, slide 34
  - type: apply
    concept: hat-sequences
    scenario: Testers say a new backpack strap digs into the shoulder. The team wants to improve the design.
    answer: >-
      Black, then green: black finds the faults, green generates fixes — the slide's sequence to improve a design (its
      example: the All Weather bike).
    source: Week 04 Lecture Slides, slide 33
  - type: basic
    concept: linear-thinking-trap
    front: "Fleet problem: 10→20 MPG or 20→50 MPG, per 10,000 miles?"
    back: 10→20 saves 500 gallons (1,000 to 500); 20→50 saves 300 (500 to 200). Fuel use is not a linear function of MPG.
    source: de Langhe, Puntoni and Larrick (2017), Week 04 reading
  - type: basic
    concept: linear-thinking-trap
    front: The four types of nonlinear relationship, with an example each.
    back: >-
      Increasing gradually, then rising more steeply (CLV v retention); decreasing gradually, then dropping quickly
      (mortgage balance); climbing quickly, then tapering off (per-unit profit v volume); falling sharply, then
      gradually (rate of return v payback period).
    source: de Langhe, Puntoni and Larrick (2017), Week 04 reading
  - type: basic
    concept: linear-thinking-trap
    front: Four steps to limit the pitfalls of linear bias?
    back: >-
      1 Increase awareness of linear bias. 2 Focus on outcomes, not indicators. 3 Discover the type of nonlinearity. 4
      Map nonlinearity whenever you can.
    source: de Langhe, Puntoni and Larrick (2017), Week 04 reading
  - type: apply
    concept: linear-thinking-trap
    scenario: A brand plans a 40%-off sale because it expects sales to nearly double.
    answer: >-
      Check the curve: in the paper-towel case 40% off sold 1,800 rolls but cut profit from $350 to $270; it would need
      over 2,300 units (+133%) just to break even on profit.
    source: de Langhe, Puntoni and Larrick (2017), Week 04 reading
  - type: basic
    concept: brainwriting-and-brainwalking
    front: How does brainwriting work?
    back: >-
      Each person writes an idea on a sheet and passes it on; the next builds on it or uses it as a stimulus. Four to
      five rounds (12 people × 5 = 60 ideas); owners circle one or two favourites.
    source: Mattimore (2012), Week 04 reading
  - type: cloze
    concept: brainwriting-and-brainwalking
    text: >-
      Brainwalking: "Move the {{c1::people}} instead of the {{c2::papers}}" — flip-chart sheets on the walls become
      ideation stations.
    source: Mattimore (2012), Week 04 reading
  - type: basic
    concept: brainwriting-and-brainwalking
    front: Brainwalking's advantages over brainwriting?
    back: >-
      More energy (people move); public ideas (reinforcing); shared purpose and group identity; mini-teams of two (half
      the ideas, more quality, fun and energy); bigger ideas written in marker.
    source: Mattimore (2012), Week 04 reading
  - type: apply
    concept: brainwriting-and-brainwalking
    scenario: Your team brainstorms aloud and every idea ends up a variation on the first one said.
    answer: >-
      That is the lecturer's warning: once an idea is said out loud, it influences everyone else. Switch to brainwriting
      or brainwalking so ideas are written first.
    source: Mattimore (2012), Week 04 reading
  - type: basic
    concept: leadership-and-knowledge-sharing
    front: The chain in Carmeli, Gelbard and Reiter-Palmon (2013)?
    back: >-
      Leader supportive behaviours → internal and external knowledge sharing → creative problem-solving capacity →
      creative performance (fluency, originality); plus a direct leader → capacity link.
    source: Carmeli, Gelbard and Reiter-Palmon (2013), Week 04 reading
  - type: cloze
    concept: leadership-and-knowledge-sharing
    text: >-
      Creative performance was measured as {{c1::fluency}} (the number of ideas) and {{c2::originality}} (ideas
      mentioned by fewer than 1% of the sample).
    source: Carmeli, Gelbard and Reiter-Palmon (2013), Week 04 reading
  - type: apply
    concept: leadership-and-knowledge-sharing
    scenario: A CEO wants staff to share what they know across teams.
    answer: >-
      Model it: like Robert Buckman of Buckman Laboratories, share your own views and knowledge openly; also put
      knowledge sharing into performance evaluation.
    source: Carmeli, Gelbard and Reiter-Palmon (2013), Week 04 reading
audio:
  title: Week 4 recap — the six thinking hats
  minutes: 3
  script: >-
    This week is Edward de Bono's six thinking hats. Start with parallel thinking. It is an alternative to argument:
    instead of attacking each other's thoughts, everyone puts their thoughts forward side by side, in one direction at a
    time. The hats make that possible, because a hat is a direction of thinking you can put on and take off.


    Blue is control: the blue sky over us, the wider view. White is information and facts, neutral and colourless.
    Yellow is benefits, sunny and optimistic, asking why it will work. Green is growth and creativity, new ideas with no
    criticism. Red is emotion and intuition, a gut reaction with no need to justify it. Black is problems and caution,
    the risks and why it might fail; it makes plans tougher, but it can be over-used. Kivunja tells us judges wear
    black, which is why black is the critical hat.


    Running a session, we begin and end with the blue hat. The facilitator asks what our focus is and what thinking we
    need, calls the switches, and closes with what we achieved, the conclusion and next steps. Use any hat as often as
    needed, keep each one short, stay in the idiom, and remember hats are directions, not categories of people.


    Sequences serve purposes. Yellow then black assesses an idea. Black then green improves a design, like the All
    Weather bike. Red then white compares fact with opinion. Black, yellow, green compares and synthesises. White then
    blue goes from facts to a plan.


    Why bother? De Bono names three difficulties: emotions, helplessness and confusion. The hats put feelings in the
    right place, give us next steps, and take one direction at a time.


    The lecture opened with linear thinking. Upgrading cars from ten to twenty miles per gallon saves more fuel than
    twenty to fifty, because our brains draw straight lines where the world curves. Remember the four curves and the
    four steps, and sell benefits, not attributes, like Apple's thousand songs in your pocket.


    Mattimore shows that brainstorming aloud lets one voice anchor the rest. Brainwriting passes the paper; brainwalking
    moves the people between ideation stations, adding energy and public ideas.


    Finally, Carmeli and colleagues show that leaders who model and encourage knowledge sharing build their people's
    creative problem-solving capacity, and with it fluency and originality.
