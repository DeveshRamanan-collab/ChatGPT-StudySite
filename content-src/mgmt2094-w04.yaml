week_file:
  topic: The six thinking hats of Edward de Bono
  summary: >-
    Week 4 introduces Edward de Bono's six thinking hats: parallel thinking as a constructive alternative to argument,
    six coloured directions of thinking (blue control, white facts, yellow benefits, green creativity, red emotion,
    black caution), and how to run a session with single hats and short sequences. The readings widen the toolkit: the
    linear-thinking trap that critical thinking guards against, brainwriting and brainwalking as better brainstorms, and
    how leaders build creative problem-solving capacity through knowledge sharing. For the exam, be ready to name the
    hat a question belongs to, choose a sequence for a purpose, and apply the hats to a short business scenario.
  source-note: >-
    Built from the Week 4 lecture slides (The Six Thinking Hats of Edward de Bono), the Week 4 lecture transcript
    (machine captions of a recording reused from an earlier year, used for the lecturer's explanations, the
    linear-thinking quiz and the brainwalking discussion) and the four readings: Kivunja (2015), de Langhe, Puntoni and
    Larrick (2017), Mattimore (2012) and Carmeli, Gelbard and Reiter-Palmon (2013).
  notes: >
    ## Thinking is the ultimate human resource


    Edward de Bono: "Thinking is the ultimate human resource. Yet we can never be satisfied with our most important
    skill. No matter how good we become, we should always want to be better."


    The lecture treats creativity and critical thinking as a "super skill", a meta-skill: whatever other management
    skills you have, you can always improve how you think. The six hats are one tool for that, and they can be used on
    your own or in a team.


    ## Parallel thinking


    :::definition

    **Parallel thinking** is an alternative to argument. In parallel thinking each thinker puts forward his or her
    thoughts in parallel with the thoughts of others, rather than attacking the thoughts of others.

    :::


    - Guides thought processes in one direction at a time, so we can effectively analyse issues, generate new ideas and
    make better decisions.

    - It is a constructive alternative to arguments.

    - Hats help a group use parallel thinking.

    - You can "put on" and "take off" a hat — they are directions of thinking.


    The lecturer's explanation: we usually think in argument mode, even inside our own heads. We put forward a point,
    wait for the counter-argument and go back and forth. Argument has its place, but parallel thinking moves away from
    it: everyone puts ideas forward in the same direction, and nobody shuts down anyone else's ideas. In an ordinary
    brainstorm the most extroverted people argue for their own ideas and fill the room, while quieter or more
    introverted people hold back; parallel thinking tries to give a voice to every participant.


    ## Six thinking hats


    In his book *Six Thinking Hats* Edward de Bono presents a simple but effective way to become a better thinker. He
    separates thinking into six distinct modes, identified with six coloured "thinking hats".


    The colours are de Bono's interpretation. Colours mean different things in different cultures, so the lecturer's
    advice is to hold on to the principle — the direction each hat names — rather than the colour.


    ### Blue hat — control thinking


    The blue hat stands for process, control, or taking an overview. Think of the blue sky over us. Wearing the blue hat
    means taking a wider, higher perspective to ensure you are addressing the right issue.


    Blue hat, managing the thinking process: control of thinking and the process; instructions for thinking; the
    organisation of thinking; control of the other hats; begin and end the session with the blue hat; discipline and
    focus; the facilitator's, session leader's role.


    Questions to ask: What is our focus? What thinking is needed? What have we done so far? What do we do next?


    In a group, one person can keep the blue hat on for the whole session as the facilitator — and it need not be the
    team's manager. The facilitator opens by putting the question (what problem are we trying to solve?), calls the
    switches between hats ("everybody put on the white hat"), keeps people within their hat, and closes with a summary
    of the progress made (lecture).


    ### White hat — information, facts


    The white hat is neutral, objective and non-emotional. White is effectively colourless. Focus instead on the facts
    and figures, on the data and information available. You try to extrapolate trends from historical data and search
    for gaps in the knowledge.


    Questions to ask: What information do we have? What information do we need?


    The white hat is not entirely without judgement: you still ask whether the information is verified and its sources
    trustworthy, rather than bringing in rumours, while staying as neutral as possible. If the information is not there,
    the session may pause while it is collected and analysed (lecture).


    ### Yellow hat — benefits, harmony


    The yellow hat is sunny and optimistic. Take time to be hopeful! Think positively! This viewpoint will help you to
    see all the benefits and the value in the decision.


    Questions to ask: What are the good things about this? What are the strengths and pluses? How will it help us? Why
    will it work? (The slide's practice question: what are the good points of being tall?)


    The lecturer's tip is to ground yellow-hat optimism in something you already have: past successes, or the team's
    expertise ("we've created new products before, and they worked"). Kivunja (2015) makes the same point: yellow-hat
    optimism is based on supporting evidence, not fantasy.


    ### Green hat — growth, creativity


    The green hat stands for the creation of ideas, concepts and perceptions. Imagine a tree, branching out and growing.
    When you are wearing the green hat, you are concerned with change, and escaping old ideas in order to find better
    ones. There is no criticism or judgement.


    Questions to ask: What is possible? What ideas do you have? Can we combine these ideas? What would happen if?


    ### Red hat — emotion, intuition


    The red hat is the emotional hat, where you can present views based on intuition, instinct, without explanation or
    justification. Look at problems based on your gut reaction, on your feelings. Try to understand the responses of
    people who do not understand your reasoning.


    Questions to ask: What is your gut reaction? How do you feel about this right now? What is your intuition telling
    you? Exercise: listen to a piece of music — how does it make you feel?


    The red hat does not lock emotions away; it gives them a place, so the group can express how it feels without
    judging each other (lecture).


    ### Black hat — problems, caution


    The black hat is gloomy and negative. You take time to look at the risks and why a proposed solution will fail.
    Black hat thinking helps to make plans tougher, more resilient. It can help you to spot fatal flaws. It can be
    over-used.


    Questions to ask: What problems could we face? What are the potential risks? What might go wrong with this? What are
    the weaknesses?


    The lecturer stresses judgement rather than negativity. Kivunja (2015) gives de Bono's reason for the colour: the
    word critical comes from the Greek for judge, and in many countries judges wear black. Black is the counterweight to
    yellow, but in business optimism still has to prevail: you are trying to create something.


    :::examtip

    The pairs most often confused are red and white, and yellow and black. Red gives feelings with no justification
    needed; white gives neutral facts and the gaps in them. Yellow gives benefits and why it will work (with reasons);
    black gives risks and why it may fail.

    :::


    ## …and close with the blue hat


    What we have achieved · outcome · conclusion · design · solution · next steps.


    Whether you are working in a group or by yourself, you always close with the blue hat: summarise, draw the
    conclusions and decide the next steps, including whether to meet again (lecture).


    ## Using the hats


    - Use any hat, as often as needed.

    - Sequence can be preset or evolving.

    - Not necessary to use every hat.

    - Time under each hat: generally, short.

    - Requires discipline from each person — while using it, stay in the idiom.

    - Can be used by individuals and groups.


    The lecturer: there is no best hat. Different problems need different emphases — perhaps more yellow when starting a
    business or designing a new product, more black when a lot is at stake, more white when you need a lot of
    information. Keep each hat to a few minutes so that everyone stays involved, and come back another day if you need
    to. Try putting the black hat on a naturally optimistic person, or the yellow hat on a gloomy one, to get them out
    of their comfort zone. The hats also work for personal decisions.


    ## General hat issues


    - **Direction, not description** — set out to think in a certain direction: "Let's have some black hat thinking…"

    - **Not categories of people** — not: "He's a black hat thinker." Everyone can and should use all the hats.

    - **A constructive form of showing off** — show off by being a better thinker; not destructive right vs wrong
    argument.

    - **Use in whole or in part.**


    ## Single hat and sequence use


    The hats can be used singly at any point in thinking. In general, this is the major use. The hats are used as a
    convenience for directing thinking and for switching thinking.


    Simple sequences of two or three hats may be used together for a particular purpose. For example, the yellow hat
    followed by the black hat may be used to assess an idea. The black hat followed by the green hat may be used to
    improve a design (the slide's example: an All Weather bike).


    ## Evaluation sequence of hats


    - To discover the positive aspects and negative aspects of an idea, you use the yellow hat before you use the black
    hat.

    - You could follow up with the green hat (new ideas) and then the red hat (feelings and emotions).

    - To use design sequences, which encourage new ideas, products or improvements to existing designs, use the blue,
    green and red hats.

    - Red then white — compares fact with opinion.

    - Black, then yellow, then green is comparing and synthesising — coming up with new ideas from the known.

    - White then blue — what do we know in facts, and where do we plan to go.


    The lecturer's red-then-white illustration: people worry that a business which ships goods by air will fail because
    planes crash (red); the white hat brings the data that crashes are very rare. Sequences are ideas, not rules set in
    stone: a group can rerun the same problem with a different sequence the next week.


    ## Benefits of Six Thinking Hats


    - Provides a common language.

    - Experience and intelligence of each person (diversity of thought).

    - Helps people work against type, preference.

    - Removal of ego (reduce confrontation).

    - Focus (one thing at a time).

    - Create, evaluate and implement action plans.


    ## Summary


    - **Blue — manage:** observe, objectives, goal, rules, big picture.

    - **White — information:** facts, information, documentation, known/unknown, no options.

    - **Yellow — brightness:** optimism, positives, benefits, make it work, values.

    - **Red — emotions:** feeling, intuition, emotions, don't rationalise, don't justify.

    - **Green — creativity:** possibility, new ideas, alternatives, concepts, growth.

    - **Black — judgement:** negatives, caution, logic, faults, danger.


    ## Why we need critical thinking


    The lecture closes by asking why critical thinking matters. We use it to argue a point, to evaluate ideas,
    information and behaviour, and — most importantly — to form our beliefs, which we then act on. Good critical
    thinking should lead to good, profitable decisions; traps such as linear thinking show what happens without it.


    Kivunja (2015) quotes the National Council for Excellence in Critical Thinking: critical thinking is "the
    intellectually disciplined process of actively and skillfully conceptualizing, applying, analyzing, synthesizing,
    and/or evaluating information gathered from, or generated by, observation, experience, reflection, reasoning, or
    communication, as a guide to belief and action".


    De Bono names three fundamental difficulties in practical thinking (quoted by Kivunja 2015), and the hats answer
    each one:


    1. **Emotions** — relying on instant gut feeling, emotion and prejudice. The six hats let us use emotions and
    feelings at the right place.

    2. **Helplessness** — "I don't know how to think about this. I don't know what to do next." The hats provide a
    framework of definite next steps.

    3. **Confusion** — trying to keep everything in mind at once. The hats let us take one direction at a time.


    "Isn't it too simple?" The lecturer concedes that coloured hats can look silly at first glance, but simplifying
    complex ideas is a strength, and the method has been used from kindergarten classes to top managers. Kivunja quotes
    de Bono: "simple methods used effectively are more valuable than complicated methods that are difficult to
    understand and confusing to use".


    ## Hats with other tools


    The hats can be combined with other tools. Kivunja (2015) gives the example of starting with a SWOT analysis showing
    the Strengths (blue hat), Weaknesses (black hat), Opportunities (yellow hat) and Threats (black hat). He also
    stresses that there is no set sequence in which the hats must be worn — it depends on the problem — and that in
    normal thinking several hats are often used at once.


    The lecture recording paired the SWOT headings slightly differently (weaknesses with the red hat; opportunities with
    the green or yellow hat). Use Kivunja's written pairing.


    ## Brainstorming, brainwriting and brainwalking


    The lecturer describes the six hats as a type of brainstorm. Classic brainstorming aloud can go wrong: once an idea
    is said out loud, it influences everyone else's answers. Writing ideas down instead of saying them reduces that, at
    the cost of some dynamism.


    **Brainwriting** (Mattimore 2012): present the creative challenge and give each participant a sheet of paper. Each
    person writes an idea and passes the paper on; the next person builds on that idea or uses it as a stimulus to
    trigger a new one. Papers usually pass for four to five rounds, so 12 participants and five rounds give 60 ideas.
    After the final round each sheet returns to its original owner, who circles one or two favourite ideas to discuss
    with the group.


    Why brainwriting works: the group generates a great number of ideas very quickly (in a typical brainstorm one person
    talks and everyone else listens); people can share the ideas they brought into the session early; it gets around the
    introvert/extrovert problem, because everyone gets equal time to "speak" with their pen ("a pure and fairly concise
    form of creative democracy"); and it models idea building and piggybacking.


    **Brainwalking** — "Move the people instead of the papers." Mattimore tapes large flip-chart sheets on the walls as
    "ideation stations". Each person writes an idea at a station, rotates to the neighbour's sheet and adds an idea;
    after five rotations they return to their original sheet and circle one or two favourites. Its advantages over
    brainwriting: getting people up and moving increases the energy in the room; the ideas are public, and dozens of
    ideas on the walls after a few minutes is reinforcing; seeing them creates a sense of shared purpose and group
    identity (people "walk the walls" and new ideas are triggered); mini-teams of two can brainwalk together — half the
    number of ideas, but better quality, fun and energy; and markers on flip charts lead people to write their ideas
    bigger.


    Mattimore invented brainwalking out of necessity for ideation sessions for Trident and Dentyne gums (both then owned
    by Warner-Lambert): several Dentyne participants had already done brainwriting in the Trident session a week
    earlier.


    The lecturer links this back to the diverge–converge diagrams from the first lecture: once you have a problem to
    solve, the hats, brainwriting and brainwalking help you diverge; later you converge. Classic brainstorming aloud is
    not a very good way to diverge.


    ## Linear thinking in a nonlinear world


    The lecture opened with this assigned reading (de Langhe, Puntoni and Larrick 2017).


    The fleet problem: a company fleet has equal numbers of SUVs at 10 miles per gallon (MPG) and sedans at 20 MPG, each
    travelling 10,000 miles a year. Which upgrade is better: (A) replacing the 10 MPG vehicles with 20 MPG vehicles, or
    (B) replacing the 20 MPG vehicles with 50 MPG vehicles? B looks better (+30 MPG), but A saves 500 gallons per 10,000
    miles (1,000 to 500) against B's 300 (500 to 200). Gas consumption is not a linear function of MPG: the curve falls
    steeply, then flattens, so upgrading from 20 to 100 MPG still would not save as much as upgrading from 10 to 20.


    Decades of research in cognitive psychology show that the human mind struggles to understand nonlinear
    relationships: our brain wants to make simple straight lines. That works for books on shelves or cups of coffee, but
    business is full of nonlinear relationships, and even experts who know about nonlinearity can fail to account for it
    and rely on their gut.


    The lecture's quiz, from the article's "Test your nonlinear aptitude": one 12-inch pizza is more pizza than two
    8-inch pizzas (area is πr²: 113 against 101 square inches); with 20 men and 50 women surveyed, five more women and
    30 more men improve precision more than 100 more women and five more men (precision shoots up quickly, then tapers
    off, with sample size); and moving a keyword's organic search ranking from fourth to second increases traffic more
    than moving from tenth to fourth.


    Profits are nonlinear too. Paper towels sell at 50 cents a roll with a marginal cost of 15 cents, so 1,000 rolls
    earn $350. Promotion A (20% off) sells 1,200 rolls for $300 profit; promotion B (40% off) sells 1,800 rolls but
    earns only $270. B nearly doubled sales while profit sank almost 25%: to keep $350 at 40% off, the firm would need
    to sell more than 2,300 units, an increase of 133%. Attitudes are nonlinear as well: consumers who rate their
    concern for the environment 5 behave very differently from those who rate it 4, so averages mask nonlinearity.


    The four types of nonlinear relationships:


    1. **Increasing gradually, then rising more steeply** — customer lifetime value against retention rate: lifting
    retention from 20% to 40% adds about $35, from 60% to 80% about $147. Managers underestimate the benefits of small
    increases to high retention rates.

    2. **Decreasing gradually, then dropping quickly** — a mortgage balance over the loan's term: on a 30-year $165,000
    loan at 4.5%, the balance falls by only about $15,000 in the first five years.

    3. **Climbing quickly, then tapering off** — per-unit profit against volume (economies of scale): doubling sales
    from 100,000 to 200,000 lifts per-unit profit from $1 to $1.25, but doubling from 400,000 to 800,000 adds only about
    6 cents.

    4. **Falling sharply, then gradually** — annual rate of return against payback period: a one-year payback is 100% a
    year, two years 50%, four years 25%.


    How to limit the pitfalls of linear bias:


    1. **Increase awareness of linear bias** — teach it, and give employees puzzles that involve nonlinear
    relationships.

    2. **Focus on outcomes, not indicators** — intermediate metrics can become the end rather than the means ("medium
    maximisation").

    3. **Discover the type of nonlinearity you're dealing with** — for example, test at least three price levels, not
    two.

    4. **Map nonlinearity whenever you can** — data visualisation and "what if" scenarios make thresholds visible.


    The implications for marketers: focus on consumer benefits, not product attributes. Apple realised that "1,000 songs
    in your pocket" was more attractive than an "internal storage capacity of 5GB". Some companies profit from
    consumers' tendency to assume that attribute–benefit relationships are linear (for example, internet speed: from 5
    to 25 megabits per second saves 21 minutes per gigabyte, from 25 to 100 only four more), but wilfully exploiting it
    is widely regarded as unethical.


    The lecturer's link to the week: linear thinking is one of many traps in management, and brainstorming tools such as
    the six hats help avoid it by spurring creativity and drawing out different perspectives.


    ## Leadership, knowledge sharing and creative problem solving


    Carmeli, Gelbard and Reiter-Palmon (2013) report two studies on how leaders make employees more creative.


    - **Creativity** is the generation of new ideas that are novel (originality) and useful. **Creative problem
    solving** covers a generation phase (problem identification and construction, information search and acquisition,
    ideation) and an implementation phase (idea evaluation, idea selection, implementation planning). **Creative
    problem-solving capacity** is the capability to do these, and it can be cultivated and improved.

    - **Knowledge sharing** is activities aimed at transferring or disseminating knowledge from one person or group to
    another: internal (with colleagues inside the organisation) or external (with people outside it).

    - **Leader supportive behaviours**: modelling collaboration and knowledge sharing, and encouraging information
    exchange, openness and idea sharing.


    Findings: leader supportive behaviours were related to creative problem-solving capacity directly, and indirectly
    through internal and external knowledge sharing (Study 1, 274 employees). Creative problem solving was related to
    both dimensions of creative performance — **fluency** (the number of ideas) and **originality** (highly original
    ideas, mentioned by fewer than 1% of the sample) — but in Study 2 (130 technicians at a utility-services
    organisation) it fully mediated only the link between internal knowledge sharing and originality; external knowledge
    sharing was not significantly related to creative problem solving there.


    Implications for managers and HRM: include knowledge sharing in performance evaluation; train employees on what can
    and cannot be shared outside the organisation; and select and develop leaders who support and model knowledge
    sharing — as Robert Buckman, CEO of Buckman Laboratories, did through lengthy online discussions with salespeople
    about compensation. Limits: self-report surveys, convenience samples and a design that cannot establish cause and
    effect.
