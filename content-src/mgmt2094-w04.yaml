    visual-brief: >-
      The fleet problem as a calculator: choose the MPG before and after an upgrade for 10,000 miles; a curve of gallons
      used against MPG marks both points, and the verdict compares the gallons saved with what a straight line would
      suggest.
    related:
      - six-thinking-hats
      - parallel-thinking
    depends-on: []
    contrasts-with: []
    cases: []
    authorities:
      - mgmt2094-de-langhe-puntoni-larrick-2017-linear-thinking
      - mgmt2094-example-fleet-mpg-upgrade
      - mgmt2094-example-nonlinear-quiz
      - mgmt2094-example-paper-towel-promotion
      - mgmt2094-example-apple-1000-songs
    verify: false
    body: >-
      de Langhe, Puntoni and Larrick (2017): the human mind struggles to understand nonlinear relationships — our brain
      wants to make simple straight lines. That works for books on a shelf, but business is full of nonlinear
      relationships, and even experts can default to their gut.


      The fleet problem: replacing 10 MPG vehicles with 20 MPG ones saves 500 gallons per 10,000 miles; replacing 20 MPG
      with 50 MPG saves only 300, though +30 MPG looks bigger. Gas consumption is not a linear function of MPG.


      Four types of nonlinear relationship:


      - **Increasing gradually, then rising more steeply** — customer lifetime value against retention rate.

      - **Decreasing gradually, then dropping quickly** — a mortgage balance over the loan's term.

      - **Climbing quickly, then tapering off** — per-unit profit against volume (economies of scale).

      - **Falling sharply, then gradually** — annual rate of return against payback period.


      To limit linear bias: (1) increase awareness of linear bias; (2) focus on outcomes, not indicators; (3) discover
      the type of nonlinearity you're dealing with; (4) map nonlinearity whenever you can.


      For marketers: sell benefits, not attributes — Apple's "1,000 songs in your pocket", not "5GB".


      The lecturer opened Week 4 with this trap: critical-thinking tools such as the six hats bring in different
      perspectives to avoid it.


      Exam use: name the curve, then show why the straight-line guess misleads the decision.
  - slug: brainwriting-and-brainwalking
    title: Brainstorming, brainwriting and brainwalking
    visual: diagram
    visual-brief: >-
      Three rooms stacked: classic brainstorming (one voice, the rest listen, the first idea said aloud steers the
      rest), brainwriting (sheets pass around the table; 12 people × 5 rounds = 60 ideas) and brainwalking (people
      rotate between flip-chart ideation stations on the walls), each labelled with the gain it adds.
    related:
      - parallel-thinking
      - leadership-and-knowledge-sharing
    depends-on: []
    contrasts-with:
      - parallel-thinking
    cases: []
    authorities:
      - mgmt2094-mattimore-2012-brainwalking
      - mgmt2094-example-trident-dentyne-brainwalk
    verify: false
    body: >-
      The lecturer calls the six hats a type of brainstorm. Classic brainstorming aloud can go wrong: once an idea is
      said out loud, it influences everyone else's. One person talks and everyone else listens.


      **Brainwriting** (Mattimore 2012): each participant writes an idea on a sheet and passes it on; the next person
      builds on it or uses it as a stimulus to trigger a new idea. Papers pass for four or five rounds — 12 participants
      and five rounds give 60 ideas. Each sheet returns to its owner, who circles one or two favourites for the group.
      It generates a great number of ideas very quickly, gets ideas out early, solves the introvert/extrovert problem
      (everyone "speaks" with their pen — creative democracy) and models idea building and piggybacking.


      **Brainwalking** — "move the people instead of the papers". Flip-chart sheets on the walls become "ideation
      stations": people write an idea, rotate to the neighbour's sheet and add one, then return and circle favourites.
      Over brainwriting it adds energy (people get up and move), public ideas (dozens on the walls within minutes),
      shared purpose and group identity, mini-teams of two (half the ideas, but more quality, fun and energy) and bigger
      ideas written in marker.


      Mattimore invented it for ideation sessions for Trident and Dentyne gums.


      The lecturer's frame: these tools help you **diverge** once you have a problem; later you converge.


      Exam use: match the technique to the group problem it fixes.
  - slug: leadership-and-knowledge-sharing
    title: Leadership, knowledge sharing and creative problem-solving capacity
    visual: diagram
    visual-brief: >-
      A chain: leader supportive behaviours → internal and external knowledge sharing → creative problem-solving
      capacity → creative performance (fluency, originality), with a direct line from leader to capacity; the external
      link is drawn faint where Study 2 found it not significant.
    related:
      - brainwriting-and-brainwalking
    depends-on: []
    contrasts-with: []
    cases: []
    authorities:
      - mgmt2094-carmeli-gelbard-reiter-palmon-2013-leadership
      - mgmt2094-example-buckman-laboratories
    verify: false
    body: >-
      Carmeli, Gelbard and Reiter-Palmon (2013) ask how leaders improve employees' creativity. **Creativity** is the
      generation of new ideas that are novel (originality) and useful. **Creative problem solving** has a generation
      phase (problem identification and construction, information search and acquisition, ideation) and an
      implementation phase (idea evaluation, idea selection, implementation planning). **Creative problem-solving
      capacity** is the capability to do these, and it can be cultivated.


      **Knowledge sharing** — activities aimed at transferring or disseminating knowledge from one person or group to
      another — is internal (colleagues inside the organisation) or external (people outside it). **Leader supportive
      behaviours**: modelling collaboration and knowledge sharing, and encouraging information exchange, openness and
      idea sharing.


      Findings:


      - Leader supportive behaviours relate to creative problem-solving capacity directly, and indirectly through
      internal and external knowledge sharing.

      - Creative problem solving relates to both dimensions of creative performance: **fluency** (the number of ideas)
      and **originality** (ideas mentioned by fewer than 1% of the sample).

      - In Study 2 it fully mediated only the link between internal knowledge sharing and originality.


      For managers: include knowledge sharing in performance evaluation, train staff on what can be shared, and select
      and develop leaders who model it — like Robert Buckman of Buckman Laboratories in long online discussions with
      salespeople.


      Exam use: trace the chain from leader to creative output, then note the limits of self-report surveys.
