authorities:
  - slug: mgmt2094-kivunja-2015-six-thinking-hats
    title: >-
      Kivunja (2015), Using De Bono's Six Thinking Hats Model to Teach Critical Thinking and Problem Solving Skills
      Essential for Success in the 21st Century Economy
    kind: article
    text: >-
      Critical thinking and problem solving are essential for success in the 21st century economy, yet they are rarely
      taught explicitly. Kivunja sets out de Bono's six thinking hats — black for caution, blue for organising thinking
      (thinking about thinking), green for creativity, red for emotions, white for information and yellow for optimism —
      as a simple metaphor that lets a thinker take one perspective, take it off and switch to another. The hats answer
      de Bono's three difficulties in practical thinking (emotions, helplessness and confusion); there is no set
      sequence for wearing them, and several are often used at once.
    gloss: >-
      The unit's academic account of the six hats: the reasons for each colour, de Bono's three difficulties, question
      lists for each hat, the SWOT pairing and the point that no sequence is fixed.
    cases: []
    verify: false
  - slug: mgmt2094-de-langhe-puntoni-larrick-2017-linear-thinking
    title: de Langhe, Puntoni and Larrick (2017), Linear Thinking in a Nonlinear World
    kind: article
    text: >-
      The human mind struggles to understand nonlinear relationships and defaults to simple straight lines, so managers
      and consumers misjudge decisions such as fuel-efficiency upgrades, price promotions, customer retention and
      payback periods. The article sets out four types of nonlinear relationship and four steps to limit linear bias:
      increase awareness of it, focus on outcomes rather than indicators, discover the type of nonlinearity you are
      dealing with, and map nonlinearity whenever you can.
    gloss: >-
      Opens the Week 4 lecture: the linear-thinking trap that critical thinking, and tools such as the six hats, help
      managers avoid.
    cases: []
    verify: false
  - slug: mgmt2094-mattimore-2012-brainwalking
    title: "Mattimore (2012), Brainwalking: In Search of Better Brainstorms"
    kind: article
    text: >-
      In a typical brainstorm one person talks and everyone else listens. Brainwriting — passing idea sheets around the
      group — generates many ideas quickly, gives introverts an equal voice and models idea building. Brainwalking,
      which Mattimore invented for ideation sessions for Trident and Dentyne gums, moves the people instead of the
      papers between flip-chart 'ideation stations' on the walls, adding energy, public ideas, shared purpose,
      mini-teams and bigger ideas.
    gloss: Gives the unit two structured alternatives to classic brainstorming for the divergent stage of ideation.
    cases: []
    verify: false
  - slug: mgmt2094-carmeli-gelbard-reiter-palmon-2013-leadership
    title: >-
      Carmeli, Gelbard and Reiter-Palmon (2013), Leadership, Creative Problem-Solving Capacity, and Creative
      Performance: The Importance of Knowledge Sharing
    kind: article
    text: >-
      Two studies of employees find that leader supportive behaviours are related to employees' creative problem-solving
      capacity directly and indirectly, through both internal and external knowledge sharing. Creative problem solving
      was related to both dimensions of creative performance, fluency and originality, but the mediation test showed it
      mediated only the relationship between internal knowledge sharing and originality.
    gloss: >-
      Shows how leaders build creative capacity: by modelling and encouraging knowledge sharing inside and outside the
      organisation.
    cases: []
    verify: false
  - slug: mgmt2094-example-edward-de-bono
    title: "Example: Edward de Bono, creator of the six thinking hats"
    kind: other
    text: >-
      De Bono presents the six hats in his book Six Thinking Hats as a simple but effective way to become a better
      thinker; the lecture opens with his line that "thinking is the ultimate human resource". Kivunja (2015) describes
      him as having developed the concept of lateral thinking, as winning the award as key pioneer in the explicit
      teaching of thinking at the International Thinking Meeting in Boston in 1992, and as having held professorial
      positions at Oxford, London, Cambridge and Harvard; his thinking programs are used in many countries, including
      Australia.
    gloss: >-
      The originator of parallel thinking and the six hats; his view that simple methods used effectively beat
      complicated ones explains why the model is deliberately simple.
    cases: []
    verify: false
  - slug: mgmt2094-example-fleet-mpg-upgrade
    title: "Example: the fleet fuel-efficiency upgrade"
    kind: other
    text: >-
      A company fleet has equal numbers of 10 MPG SUVs and 20 MPG sedans, each driven 10,000 miles a year, and can
      afford to upgrade one model. Replacing the 10 MPG vehicles with 20 MPG ones cuts fuel per vehicle from 1,000 to
      500 gallons (500 saved); replacing the 20 MPG vehicles with 50 MPG ones cuts it from 500 to 200 (300 saved). The
      second option looks better because +30 MPG is the bigger and the higher percentage increase, but it saves less.
    gloss: "The opening illustration of linear bias: gas consumption is not a linear function of MPG."
    cases: []
    verify: false
  - slug: mgmt2094-example-nonlinear-quiz
    title: "Example: the lecture's nonlinear-thinking quiz"
    kind: other
    text: >-
      Questions from the article's 'Test your nonlinear aptitude', put to the class in the lecture: one 12-inch pizza is
      more pizza than two 8-inch pizzas (113 against 101 square inches); with 20 men and 50 women surveyed, surveying 5
      more women and 30 more men improves the precision of the estimates more than 100 more women and 5 more men; and
      moving a keyword's organic search ranking from fourth to second increases website traffic more than moving it from
      tenth to fourth. Most of the class chose the two 8-inch pizzas.
    gloss: >-
      Quick illustrations that area, statistical precision and search traffic are nonlinear, so the straight-line answer
      is the wrong one.
    cases: []
    verify: false
  - slug: mgmt2094-example-paper-towel-promotion
    title: "Example: the paper-towel price promotions"
    kind: other
    text: >-
      A paper-towel brand sells rolls at 50 cents with a marginal cost of 15 cents, so 1,000 rolls earn $350 profit. A
      20%-off promotion sold 1,200 rolls for $300 profit; a 40%-off promotion sold 1,800 rolls (an 80% increase) but
      earned only $270. To keep the usual $350 profit at 40% off, the firm would have to sell more than 2,300 units, an
      increase of 133%.
    gloss: >-
      Shows that the profit levers of cost, volume and price are related nonlinearly, so managers overvalue volume and
      undervalue getting the price right.
    cases: []
    verify: false
  - slug: mgmt2094-example-apple-1000-songs
    title: "Example: Apple's \"1,000 songs in your pocket\""
    kind: other
    text: >-
      Apple realised that people would perceive an MP3 player that provided "1,000 songs in your pocket" to be more
      attractive than one with an "internal storage capacity of 5GB".
    gloss: >-
      The implication for marketers: communicate consumer benefits rather than product attributes, because consumers
      misread attribute–benefit relationships as linear.
    cases: []
    verify: false
  - slug: mgmt2094-example-trident-dentyne-brainwalk
    title: "Example: the Trident and Dentyne ideation sessions"
    kind: other
    text: >-
      Mattimore facilitated an ideation session to generate positioning and marketing ideas for Trident gum, starting it
      with brainwriting. A week later he facilitated a session for Dentyne gum (both brands then owned by
      Warner-Lambert); several participants had been in the Trident session, so he wanted a new exercise to keep them
      engaged. He moved the people instead of the papers, taping flip-chart sheets on the walls as 'ideation stations' —
      the first brainwalk.
    gloss: The origin of brainwalking, and an example of changing a technique to keep participants excited and engaged.
    cases: []
    verify: false
  - slug: mgmt2094-example-all-weather-bike
    title: "Example: the All Weather bike"
