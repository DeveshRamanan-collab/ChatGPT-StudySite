questions:
  - key: p01
    type: mcq
    concept: parallel-thinking
    difficulty: 1
    set: pretest
    stem: What is parallel thinking, as the Week 4 slides define it?
    options:
      - text: Two sides argue opposite positions until the stronger case wins the room
        why: >-
          Tempting because that is how most meetings run, but it is argument — exactly what parallel thinking is offered
          as an alternative to.
      - text: Each thinker puts thoughts forward alongside the others, not against them
        correct: true
        why: >-
          Correct — the slide: each thinker puts forward his or her thoughts in parallel with the thoughts of others,
          rather than attacking the thoughts of others.
      - text: Each person works on a different problem at once, so the meeting covers more
        why: >-
          Tempting because 'parallel' suggests side-by-side tasks, but parallel thinking has everyone thinking about the
          same issue in the same direction.
      - text: Thinkers write privately first and then vote on the single best idea
        why: >-
          Tempting because it sounds orderly and fair, but private writing and voting describe brainwriting-style
          methods, not de Bono's definition.
  - key: p02
    type: mcq
    concept: parallel-thinking
    difficulty: 1
    stem: On the slides, parallel thinking is presented as an alternative to what?
    options:
      - text: Argument
        correct: true
        why: >-
          Correct — the first line of the slide: parallel thinking is an alternative to argument, a constructive
          alternative to arguments.
      - text: Data analysis and the use of facts
        why: >-
          Tempting because the hats include feelings and ideas, but facts have their own hat (white), so parallel
          thinking does not replace them.
      - text: Planning sessions led by a facilitator
        why: >-
          Tempting because the method has rules, but a facilitator (the blue hat) is part of a six hats session, not
          what it replaces.
      - text: Creative thinking and new ideas
        why: >-
          Tempting only if parallel sounds rigid, but the slide says parallel thinking helps us generate new ideas, so
          it is not their alternative.
  - key: p03
    type: mcq
    concept: parallel-thinking
    difficulty: 2
    stem: How, according to the slides, do the hats help a group use parallel thinking?
    options:
      - text: Each hat is a direction of thinking that the group can put on and take off together
        correct: true
        why: >-
          Correct — 'hats help a group use parallel thinking'; you can put on and take off a hat because they are
          directions of thinking.
      - text: Each hat gives one person a fixed personality to argue from for the meeting
        why: >-
          Tempting because hats sound like roles, but the slides say hats are not categories of people; everyone can and
          should use all the hats.
      - text: Each hat ranks ideas from best to worst so the group can drop the weakest
        why: >-
          Tempting because sorting ideas feels efficient, but the hats direct the kind of thinking; they are not a
          scoring system for ideas.
      - text: The hats let the loudest members speak first so the others can follow
        why: >-
          Tempting if you picture a pecking order, but the lecturer says parallel thinking is meant to give a voice to
          every participant.
  - key: p04
    type: mcq
    concept: parallel-thinking
    difficulty: 2
    stem: >-
      In a planning meeting, Sam proposes a pop-up store; Priya immediately attacks it, Sam defends it, and the rest go
      quiet. What would parallel thinking change?
    options:
      - text: Priya would be asked to leave the meeting so that Sam can explain his idea properly
        why: >-
          Tempting because it ends the clash, but parallel thinking keeps everyone involved; it changes the direction of
          thinking, not the guest list.
      - text: All would look at the idea the same way at once — benefits first, then risks
        correct: true
        why: >-
          Correct — parallel thinking guides thought in one direction at a time, so criticism becomes a shared black-hat
          turn rather than an attack.
      - text: Sam and Priya would keep debating until one of them concedes the point
        why: >-
          Tempting because debate can test an idea, but this is the back-and-forth argument mode that parallel thinking
          moves away from.
      - text: The group would vote straight away to save time on further discussion
        why: >-
          Tempting because it avoids conflict, but voting skips the thinking; parallel thinking still explores the idea,
          one direction at a time.
  - key: p05
    type: mcq
    concept: parallel-thinking
    difficulty: 2
    stem: According to the slide, parallel thinking guides thought processes how?
    options:
      - text: In whichever direction the most senior person prefers
        why: >-
          Tempting because senior people often steer meetings, but the slide is about a shared direction, chosen for the
          thinking needed, not rank.
      - text: In one direction at a time
        correct: true
        why: >-
          Correct — it guides thought processes in one direction at a time, so we can analyse issues, generate ideas and
          make better decisions.
      - text: In every direction at once, to save time
        why: >-
          Tempting because it sounds efficient, but trying to do everything at once is the confusion the method is
          designed to avoid.
      - text: Away from feelings and towards logic only
        why: >-
          Tempting because argument prizes logic, but the method gives feelings their own direction (the red hat) rather
          than banning them.
  - key: p06
    type: mcq
    concept: parallel-thinking
    difficulty: 2
    stem: Which benefit on the "Benefits of Six Thinking Hats" slide names what replacing argument does to confrontation?
    options:
      - text: Provides a common language for the team
        why: >-
          Tempting because a shared vocabulary helps, but the benefit that speaks to confrontation is removal of ego
          (reduce confrontation).
      - text: Removal of ego (reduce confrontation)
        correct: true
        why: >-
          Correct — the lecturer ties this to thinking in parallel: we are not arguing with each other, so confrontation
          falls.
      - text: Create, evaluate and implement action plans
        why: >-
          Tempting because it is the end result of a session, but it describes output, not what happens to confrontation
          along the way.
      - text: Helps people work against type and preference
        why: >-
          Tempting because it is also about behaviour, but it concerns people stepping outside their usual thinking
          style, not conflict.
  - key: p07
    type: mcq
    concept: parallel-thinking
    difficulty: 2
    stem: >-
      Which of these is NOT one of the three difficulties in practical thinking that de Bono names (quoted by Kivunja
      2015)?
    options:
      - text: Emotions
        why: >-
          Tempting to rule out because emotions feel natural, but de Bono lists them first: relying on instant gut
          feeling, emotion and prejudice.
      - text: Helplessness
        why: >-
          Tempting to rule out, but it is on the list: 'I don't know how to think about this. I don't know what to do
          next.'
      - text: Confusion
        why: >-
          Tempting to rule out, but it is the third difficulty: trying to keep everything in mind at once, with a mess
          as a result.
      - text: Boredom
        correct: true
        why: >-
          Correct — boredom is not one of the three; de Bono names emotions, helplessness and confusion, and the hats
          answer each.
  - key: p08
    type: mcq
    concept: parallel-thinking
    difficulty: 3
    stem: >-
      A manager says: "There's so much here — costs, staff, customers, suppliers — I'm trying to weigh it all at once
      and I can't think straight." Which difficulty is this, and what do the hats offer?
    options:
      - text: Helplessness — the hats replace the manager with a facilitator
        why: >-
          Tempting because the manager feels stuck, but the symptom is everything at once (confusion), and the hats do
          not replace anyone.
      - text: Emotions — the hats ban feelings from the decision
        why: >-
          Tempting because stress is emotional, but the problem described is overload, and the hats give feelings a
          place rather than banning them.
      - text: Confusion — the hats let the group take one direction at a time
        correct: true
        why: >-
          Correct — de Bono: confusion arises when we try to do too much at once; the six hats method allows us to take
          one direction at a time.
      - text: Confusion — the hats cut the number of factors that may be considered
        why: >-
          Tempting because it names the right difficulty, but the hats do not limit what is considered; they sequence
          it, one direction at a time.
  - key: p09
    type: mcq
    concept: parallel-thinking
    difficulty: 3
    variant-of: p08
    stem: >-
      A new team leader says: "I don't know how to think about this restructure. I don't know what to do next." Which
      difficulty is this, and what do the hats give?
    options:
      - text: Helplessness — a framework of definite next steps
        correct: true
        why: >-
          Correct — de Bono says helplessness comes from having no clear plan; the hats provide a basic framework of
          definite next steps.
      - text: Confusion — permission to skip the hard questions
        why: >-
          Tempting because the leader is unsure, but the words are de Bono's example of helplessness, and the hats never
          mean skipping questions.
      - text: Emotions — a chance to vent before deciding
        why: >-
          Tempting because the red hat does let feelings out, but the leader is describing not knowing what to do, which
          is helplessness.
      - text: Helplessness — an expert who will decide for the team
        why: >-
          Tempting because it names the right difficulty, but the remedy is a thinking framework the team uses, not
          handing the decision to someone else.
  - key: p10
    type: mcq
    concept: parallel-thinking
    difficulty: 3
    variant-of: p08
    stem: >-
      A director rejects a supplier's proposal within seconds: "It just feels wrong." No one looks any further. Which
      difficulty is this, and how do the hats respond?
    options:
      - text: Confusion — the hats would ask her to list every factor at once, in one go
        why: >-
          Tempting because the decision was rushed, but listing everything at once is confusion itself; her problem is
          acting on gut feeling.
      - text: Emotions — feelings get a place (the red hat) but do not replace the thinking
        correct: true
        why: >-
          Correct — de Bono: emotions at the right place are essential, at the wrong place disastrous; the six hats let
          us use them at the right place.
      - text: Emotions — the hats require her to drop her feeling entirely and use only logic
        why: >-
          Tempting because it names the right difficulty, but the method keeps feelings (the red hat); it just stops
          them standing in for thinking.
      - text: Helplessness — the hats would tell her exactly what she must decide
        why: >-
          Tempting because the board needs a way forward, but she was not stuck; she acted on instant gut feeling, which
          is the emotions difficulty.
  - key: p11
    type: mcq
    concept: parallel-thinking
    difficulty: 2
    stem: Why, according to the lecturer, does parallel thinking help the quieter members of a team?
    options:
      - text: It forces the introverted members to speak first in every round of the discussion
        why: >-
          Tempting because it would get them talking, but nothing in the method fixes speaking order; it changes how
          ideas are treated.
      - text: Ideas are put forward, not fought over, so loud arguers cannot drown others out
        correct: true
        why: >-
          Correct — the lecturer: extroverts argue for their ideas and fill the room; parallel thinking avoids that and
          gives voice to all participants.
      - text: It lets quieter members submit their ideas anonymously after the meeting has ended
        why: >-
          Tempting because anonymity can help, but that is not parallel thinking; it is a different technique
          altogether.
      - text: It removes the need for a facilitator, so nobody controls who gets the floor
        why: >-
          Tempting because control can silence people, but a six hats session keeps a facilitator — the blue hat — to
          steer it.
  - key: p12
    type: mcq
    concept: parallel-thinking
    difficulty: 2
    stem: Besides meetings, where does the lecturer say we fall into argument mode?
    options:
      - text: In our own heads — an internal dialogue of argument and counter-argument
        correct: true
        why: >-
          Correct — the lecturer: we even do this to ourselves, arguing back and forth in our own heads when making a
          decision.
      - text: Only in written work, such as essays and formal reports
        why: >-
          Tempting because essays argue a case, but the lecturer points to the internal dialogue we have when deciding,
          not to writing.
      - text: Only in negotiations with suppliers and customers
        why: >-
          Tempting because negotiation is adversarial, but the lecturer's point is more personal: we argue with
          ourselves too.
      - text: Only when a group is too large for everyone to speak
        why: >-
          Tempting because big groups get noisy, but argument mode is a habit of thinking, present even when we decide
          alone.
  - key: p13
    type: mcq
    concept: parallel-thinking
    difficulty: 3
    stem: Does the lecturer say that argument should be abandoned altogether?
    options:
      - text: Yes — argument is destructive and has no place in business decisions
        why: >-
          Tempting because the method is sold as its alternative, but the lecturer says argumentative thinking has its
          own pros and is worth mastering.
      - text: No — argument has its own pros, but parallel thinking moves away from it
        correct: true
        why: >-
          Correct — "don't get me wrong": argument has its pros; parallel thinking is a constructive alternative with
          its own benefits.
      - text: No — argument should always come first, and parallel thinking is only for settling ties
        why: >-
          Tempting because it keeps both, but nothing in the lecture orders them this way; parallel thinking is a
          complete approach of its own.
      - text: Yes — but only when the team includes introverted members
        why: >-
          Tempting because introverts benefit most, but the lecturer does not condemn argument in any setting; he says
          it has its own pros.
  - key: p14
    type: mcq
    concept: parallel-thinking
    difficulty: 2
    stem: What does it mean to "put on" and "take off" a hat?
    options:
      - text: To adopt a personality type that fits you for the whole project
        why: >-
          Tempting because hats sound like identities, but the slides say hats are not categories of people; they are
          directions of thinking.
      - text: To take a direction of thinking for a while, then leave it when the group switches
        correct: true
        why: >-
          Correct — the slide: you can 'put on' and 'take off' a hat; they are directions of thinking, not labels for
          people.
      - text: To wear an actual hat, which the lecturer says is required for the method to work
        why: >-
          Tempting because a student asked about real hats, but the lecturer said physical hats may help; mentally
          putting one on is enough.
      - text: To take charge of the meeting, then hand control to someone else
        why: >-
          Tempting because the blue hat controls the process, but putting on any hat means thinking in its direction,
          not taking the chair.
  - key: p15
    type: mcq
    concept: parallel-thinking
    difficulty: 4
    contrasts-with:
      - brainwriting-and-brainwalking
    stem: >-
      A team leader wants to stop two talkative managers dominating idea meetings. Option 1: everyone wears the yellow
      hat together, then the black hat. Option 2: everyone writes ideas on a sheet and passes it on. Which statement is
      accurate?
    options:
      - text: Only option 1 helps, because writing ideas down slows the meeting
        why: >-
          Tempting because written methods are less dynamic, but Mattimore says brainwriting gets around the
          introvert/extrovert problem.
      - text: Only option 2 helps, because parallel thinking does nothing to stop dominant voices taking over
        why: >-
          Tempting because writing gives everyone a pen, but the lecturer says parallel thinking also aims to give a
          voice to all participants.
      - text: "Both: option 1 stops the argument, option 2 lets everyone \"speak\" with a pen"
        correct: true
        why: >-
          Correct — parallel thinking avoids the argument that lets extroverts dominate; brainwriting gives everyone
          equal time to speak in writing.
      - text: Neither helps, because dominance can only be fixed by removing those managers
        why: >-
          Tempting because the managers are the problem, but both techniques are designed to change the process so that
          every voice counts.
  - key: p16
    type: mcq
    concept: parallel-thinking
    difficulty: 2
    stem: Which of these is NOT listed on the "Benefits of Six Thinking Hats" slide?
    options:
      - text: It provides a common language
        why: >-
          Tempting to pick because it sounds minor, but it is the first benefit listed: everyone understands what the
          group is doing.
      - text: It guarantees the group reaches consensus
        correct: true
        why: >-
          Correct — consensus is not promised; the slide lists common language, diversity of thought, working against
          type, removal of ego, focus and action plans.
      - text: It focuses on one thing at a time
        why: >-
          Tempting to pick, but focus (one thing at a time) is on the slide and matches the one-direction idea of
          parallel thinking.
      - text: It reduces confrontation through the removal of ego
        why: >-
          Tempting to pick, but removal of ego (reduce confrontation) is listed, and the lecturer links it to thinking
          in parallel.
  - key: p17
    type: match
    concept: parallel-thinking
    difficulty: 2
    prompt: Match each of de Bono's three difficulties with what the six hats provide.
    pairs:
      - left: Emotions
        right: Feelings used at the right place in thinking
      - left: Helplessness
        right: A framework of definite next steps
      - left: Confusion
        right: One direction at a time
  - key: p18
    type: truefalse
    concept: parallel-thinking
    difficulty: 1
    set: quickfire
    statement: >-
      In parallel thinking, each thinker attacks the weak points in the others' thoughts so that only strong ideas
      survive.
    answer: false
    why: >-
      False — that describes argument. In parallel thinking each thinker puts thoughts forward alongside the others,
      rather than attacking them.
  - key: p19
    type: truefalse
    concept: parallel-thinking
    difficulty: 1
    set: quickfire
    statement: The hats are directions of thinking that a person or group can put on and take off.
    answer: true
    why: >-
      True — the slide: you can "put on" and "take off" a hat; they are directions of thinking, which is how they
      support parallel thinking.
  - key: p20
    type: truefalse
    concept: parallel-thinking
    difficulty: 2
    set: quickfire
    statement: "De Bono names three difficulties in practical thinking: emotions, helplessness and confusion."
    answer: true
    why: >-
      True — quoted by Kivunja (2015): emotions (gut feeling and prejudice), helplessness (not knowing what to do next)
      and confusion (everything at once).
  - key: h01
    type: mcq
    concept: six-thinking-hats
    difficulty: 1
    set: pretest
    stem: Which hat is neutral, objective and non-emotional, focusing on facts and figures?
    options:
      - text: The blue hat
        why: >-
          Tempting because blue manages the process calmly, but it is about control and overview; neutral facts and
          figures are the white hat.
      - text: The white hat
        correct: true
        why: >-
          Correct — the white hat is neutral, objective and non-emotional; white is effectively colourless, so it
          focuses on facts and data.
      - text: The yellow hat
        why: >-
          Tempting because yellow also looks for reasons, but it is sunny and optimistic, looking for benefits, not
          neutral information.
      - text: The black hat
        why: >-
          Tempting because black is serious and logical, but it looks for risks and why things will fail, which is
          judgement, not neutral fact.
  - key: h02
    type: mcq
    concept: six-thinking-hats
    difficulty: 1
    stem: Which hat stands for the creation of ideas, concepts and perceptions, with no criticism or judgement?
    options:
      - text: The red hat
        why: >-
          Tempting because feelings come freely under red, but red is for emotion and intuition; creating new ideas is
          the green hat.
      - text: The yellow hat
        why: >-
          Tempting because yellow is positive about ideas, but it looks for the benefits of an idea already on the
          table, not new ones.
      - text: The green hat
        correct: true
        why: >-
          Correct — the green hat stands for the creation of ideas, concepts and perceptions; there is no criticism or
          judgement.
      - text: The blue hat
        why: >-
          Tempting because blue organises the session, but it manages the thinking; it does not generate the new ideas
          itself.
  - key: h03
    type: mcq
    concept: six-thinking-hats
    difficulty: 2
    stem: The facilitator asks, "What is your gut reaction to this new logo, right now?" Which hat is being called for?
    options:
      - text: White — it asks for an honest, accurate report on the new logo
        why: Tempting because honesty sounds factual, but a gut reaction is a feeling, not neutral information or data.
      - text: Red — it asks for an intuitive reaction with no justification
        correct: true
        why: >-
          Correct — the red hat asks: what is your gut reaction? how do you feel about this right now? No explanation is
          needed.
      - text: Black — it invites criticism of the logo
        why: >-
          Tempting because a reaction may be negative, but black asks for risks and weaknesses with reasons, not a gut
          feeling.
      - text: Yellow — it hopes people will like the new logo
        why: Tempting because the designer hopes so, but yellow asks for benefits and why it will work, not for feelings.
  - key: h04
    type: mcq
    concept: six-thinking-hats
    difficulty: 2
    stem: "\"What problems could we face with this plan? What might go wrong, and what are its weaknesses?\" Which hat?"
    options:
      - text: Black
        correct: true
        why: >-
          Correct — these are the black hat questions on the slide: problems, potential risks, what might go wrong,
          weaknesses.
      - text: Red
        why: >-
          Tempting because worry is a feeling, but these questions ask for reasoned problems and risks, which is the
          black hat.
      - text: White
        why: >-
          Tempting because risks can be documented, but white asks what information we have and need; it does not judge
          the plan.
      - text: Blue
        why: >-
          Tempting because blue checks the plan is on track, but blue asks about focus and next steps, not what might go
          wrong.
  - key: h05
    type: mcq
    concept: six-thinking-hats
    difficulty: 2
    stem: "\"What are the strengths and pluses of moving our store online? How will it help us? Why will it work?\" Which hat?"
    options:
      - text: Green, because moving online is a new idea for the store
        why: >-
          Tempting because the idea is new, but these questions weigh the benefits of an idea already proposed, which is
          the yellow hat.
      - text: Yellow, because it looks for benefits and reasons it will work
        correct: true
        why: >-
          Correct — the yellow hat's questions: what are the good things, the strengths and pluses, how will it help us,
          why will it work?
      - text: Red, because the speaker clearly feels excited about it
        why: Tempting because enthusiasm shows, but the questions ask for strengths and reasons, not for how anyone feels.
      - text: White, because strengths can be measured and recorded
        why: >-
          Tempting because some strengths are measurable, but white is neutral information; asking why it will work is
          yellow.
  - key: h06
    type: mcq
    concept: six-thinking-hats
    difficulty: 2
    stem: "\"What do we actually know about the ages of our customers, and what do we still need to find out?\" Which hat?"
    options:
      - text: Black — it exposes what the team does not know
        why: >-
          Tempting because gaps can be risks, but asking what information we have and need is the white hat question,
          word for word.
      - text: Blue — it plans the next step of the research
        why: >-
          Tempting because it leads to action, but blue asks what thinking is needed; the information questions belong
          to white.
      - text: White — what information do we have and what do we need
        correct: true
        why: >-
          Correct — the white hat slide: what information do we have; what information do we need. It also searches for
          gaps.
      - text: Green — it opens up a new line of inquiry
        why: >-
          Tempting because finding out is a kind of exploring, but green creates new ideas; gathering facts and gaps is
          white.
  - key: h07
    type: mcq
    concept: six-thinking-hats
    difficulty: 2
    stem: "\"Can we combine these two ideas? What would happen if we sold by subscription instead?\" Which hat?"
    options:
      - text: Yellow
        why: >-
          Tempting because the speaker sounds positive, but combining ideas and asking "what would happen if" are
          green-hat questions.
      - text: Black
        why: >-
          Tempting because "what would happen" can be a risk question, but here it opens possibilities rather than
          finding faults.
      - text: Green
        correct: true
        why: >-
          Correct — the green hat asks: what is possible? what ideas do you have? can we combine these ideas? what would
          happen if?
      - text: Blue
        why: >-
          Tempting because it changes the direction of the meeting, but proposing new options is creative thinking, the
          green hat.
  - key: h08
    type: mcq
    concept: six-thinking-hats
    difficulty: 3
    stem: >-
      In a café team meeting, Mei says, "Customers hate our queue — I just know it," and gives no evidence. Which hat is
      she wearing, and why not the white hat?
    options:
      - text: White — she is stating what she believes is a fact about customers
        why: >-
          Tempting because it is phrased as a statement, but she offers no data; white needs information, and she is
          offering a feeling.
      - text: Black — she is pointing out a weakness in the service
        why: Tempting because a queue is a problem, but she gives no reasons or evidence; it is intuition, the red hat.
      - text: Red — intuition with no justification; white would need data such as wait times
        correct: true
        why: >-
          Correct — red presents views based on intuition without explanation or justification; white focuses on facts
          and figures.
      - text: Yellow — she is trying to make the service better
        why: Tempting because her aim is improvement, but she is not looking for benefits; she is reporting a gut feeling.
  - key: h09
    type: mcq
    concept: six-thinking-hats
    difficulty: 3
    tags:
      - yellow-v-black
    stem: Which pairing best captures the difference between the yellow hat and the black hat?
    options:
      - text: Yellow asks how people feel about it; black asks for the facts
        why: >-
          Tempting because both sound like opposites, but feelings are red and facts are white; this pairing mixes up
          four hats.
      - text: Yellow creates new ideas; black chooses between them
        why: >-
          Tempting because both deal with ideas, but creating ideas is green; yellow assesses benefits of an idea
          already there.
      - text: Yellow controls the session; black closes it
        why: Tempting because sessions have a beginning and an end, but both opening and closing belong to the blue hat.
      - text: Yellow asks why it will work; black asks why it may fail
        correct: true
        why: >-
          Correct — yellow looks for benefits and why it will work; black looks at the risks and why a proposed solution
          will fail.
  - key: h10
    type: mcq
    concept: six-thinking-hats
    difficulty: 2
    stem: Why is the blue hat blue, according to the slides?
    options:
      - text: Blue is calm, which keeps the meeting free of emotion
        why: "Tempting because blue feels calm, but the slide gives the sky: a wider, higher perspective over the thinking."
      - text: "Think of the blue sky over us: a wider, higher perspective"
        correct: true
        why: >-
          Correct — the blue hat slide: think of the blue sky over us; wearing it means a wider, higher perspective on
          the right issue.
      - text: Blue is the colour of corporate reports and strategy documents
        why: >-
          Tempting because reports matter, but the paper image belongs to white (typed reports, newspapers), not to
          blue.
      - text: Blue is cool, so it is the hat for cautious, critical thinking
        why: Tempting because caution is cool-headed, but caution is the black hat; blue is about control and overview.
  - key: h11
    type: mcq
    concept: six-thinking-hats
    difficulty: 3
    stem: Why did de Bono choose black for the cautious, critical hat, according to Kivunja (2015)?
    options:
      - text: Black stands for pessimism, which every plan needs in equal measure
        why: >-
          Tempting because the slide calls black gloomy, but Kivunja says it is not a bad hat; the colour comes from
          judges.
      - text: "\"Critical\" means judge in Greek, and many judges wear black"
        correct: true
        why: >-
          Correct — Kivunja: the word critical has its origin in Greek where it means judge, and in many countries
          judges wear black.
      - text: Black is the absence of colour, which signals neutrality
        why: >-
          Tempting because it sounds like a colour theory, but the slides give neutrality and colourlessness to the
          white hat.
      - text: Black ink was used for financial losses in company accounts
        why: >-
          Tempting because losses are a risk, but no source gives this reason; the stated reason is the judge, who wears
          black.
  - key: h12
    type: mcq
    concept: six-thinking-hats
    difficulty: 2
    stem: Which statement about the black hat appears on the slides?
    options:
      - text: It should always be worn first
        why: >-
          Tempting because spotting fatal flaws early sounds prudent, but the slides recommend yellow before black when
          assessing an idea.
      - text: It can be over-used
        correct: true
        why: "Correct — the slide: black hat thinking makes plans tougher and spots fatal flaws, but it can be over-used."
      - text: It is reserved for the team sceptic
        why: >-
          Tempting because some people are natural critics, but the hats are not categories of people; everyone uses
          every hat.
      - text: It must never be used on new ideas
        why: >-
          Tempting because green has no criticism, but black is exactly how a team tests a new idea or design after it
          is proposed.
  - key: h13
    type: mcq
    concept: six-thinking-hats
    difficulty: 3
    stem: Why is the white hat white?
    options:
      - text: White stands for a blank page, ready to be filled with fresh ideas
        why: >-
          Tempting because a blank page invites ideas, but new ideas belong to the green hat; white's colour signals
          neutrality.
      - text: "White signals surrender: the team stops arguing and agrees"
        why: >-
          Tempting because parallel thinking reduces conflict, but no source gives this reason; white is about neutral
          information.
      - text: "White is effectively colourless: neutral and objective"
        correct: true
        why: >-
          Correct — the slide: white is effectively colourless; Kivunja adds de Bono's image of typed reports, printouts
          and newspapers on white paper.
      - text: White is the colour of hope, so it keeps the meeting positive
        why: Tempting because the session should stay constructive, but optimism is the yellow hat, not the white.
  - key: h14
    type: mcq
    concept: six-thinking-hats
    difficulty: 3
    stem: How does Kivunja (2015) distinguish yellow-hat optimism from red-hat feeling?
    options:
      - text: Yellow optimism rests on supporting evidence and reasons; red feelings need no justification
        correct: true
        why: >-
          Correct — Kivunja: yellow optimism is based on supporting evidence, not fantasy; red hat feelings are
          expressed with no need for justification.
      - text: Yellow is for the leader to express; red is for the rest of the team
        why: >-
          Tempting because roles can differ, but every hat is for everyone; the difference is evidence versus no
          justification.
      - text: They are the same thing, so Kivunja treats them as interchangeable
        why: Tempting because both can sound positive, but Kivunja says the difference between them is a big one.
      - text: Red feelings are always negative; yellow feelings are always positive
        why: >-
          Tempting because red can mean anger, but Kivunja says red includes joy and warmth too; the difference is
          justification.
  - key: h15
    type: mcq
    concept: six-thinking-hats
    difficulty: 4
    stem: A café owner is deciding whether to open on Sundays. Which question would a green-hat thinker ask?
    options:
      - text: What were our foot-traffic figures for Saturdays last year?
        why: >-
          Tempting because the data matter, but asking for figures is white-hat thinking: what information do we have
          and need?
      - text: What will Sunday penalty rates add to our weekly wage costs?
        why: >-
          Tempting because it is a sharp question, but it looks for costs and risks of the plan, which is black-hat
          thinking.
      - text: What if we opened Sundays with a brunch-only menu?
        correct: true
        why: >-
          Correct — 'what would happen if' with a new option is a green-hat question: possibilities and new ideas
          without judgement.
      - text: How do you feel about working on Sundays?
        why: >-
          Tempting because staff feelings matter, but asking how people feel right now is red-hat thinking, not creating
          ideas.
  - key: h16
    type: match
    concept: six-thinking-hats
    difficulty: 2
    prompt: Match each hat with its heading on the summary slide.
    pairs:
      - left: Blue hat
        right: Manage
      - left: White hat
        right: Information
      - left: Yellow hat
        right: Brightness
      - left: Red hat
        right: Emotions
      - left: Green hat
        right: Creativity
      - left: Black hat
        right: Judgement
  - key: h17
    type: truefalse
    concept: six-thinking-hats
    difficulty: 1
    set: quickfire
    statement: Under the red hat, people should explain and justify their feelings before sharing them.
    answer: false
    why: >-
      False — the red hat presents views based on intuition and instinct without explanation or justification; the
      summary slide says "don't justify".
  - key: h18
    type: truefalse
    concept: six-thinking-hats
    difficulty: 1
    set: quickfire
    statement: Green hat thinking involves no criticism or judgement.
    answer: true
    why: >-
      True — the green hat slide: when wearing it you are concerned with change and escaping old ideas, and there is no
      criticism or judgement.
  - key: h19
    type: truefalse
    concept: six-thinking-hats
    difficulty: 2
    set: quickfire
    statement: White hat thinking includes extrapolating trends from historical data and searching for gaps in the knowledge.
    answer: true
    why: >-
      True — the white hat slide: focus on the facts and figures, extrapolate trends from historical data and search for
      gaps in the knowledge.
  - key: h20
    type: short
    concept: six-thinking-hats
    difficulty: 3
    prompt: >-
      "The six thinking hats are too simple to help a board make a hard decision." Discuss, applying the hats to a
      regional bank deciding whether to close three branches and move those customers to its app.
    model: >-
      The statement is half right: the hats are simple by design, but that simplicity is what helps. De Bono separates
      thinking into six directions so the board thinks in parallel instead of arguing. Blue opens: is our focus closing
      branches, or serving these customers? White: what do we know about branch visits, app use and customer ages, and
      what do we still need? Yellow: what are the benefits — lower costs, money freed for the app? Black: what might go
      wrong — customers who cannot use the app, lost trust? Green: what would happen if one branch became a shared
      service hub? Red: how do directors feel right now? Blue closes with the outcome and next steps. Kivunja (2015)
      quotes de Bono that simple methods used effectively beat complicated ones, and the hats answer emotions,
      helplessness and confusion. The statement has force: the hats supply no data, decide nothing and depend on the
      facilitator's discipline. On balance, simplicity is the method's strength, provided the white hat is taken
      seriously.
    rubric:
      - id: r1
        criterion: Concept — defines the six hats as directions of thinking and links them to parallel thinking.
        marks: 2
        top-band: Names all six hats with accurate directions and explains parallel thinking in one sentence.
        margin-note: Are the hats directions, or people?
        authorities:
          - mgmt2094-kivunja-2015-six-thinking-hats
      - id: r2
        criterion: Example — uses a real example or source from the materials.
        marks: 2
        top-band: >-
          Cites de Bono or Kivunja accurately (simple methods used effectively; the three difficulties) in support of
          the argument.
        margin-note: Which source supports this?
        authorities:
          - mgmt2094-example-edward-de-bono
      - id: r3
        criterion: Application — applies each hat to the bank decision.
        marks: 3
        top-band: Six scenario-specific questions, each clearly in the right hat, opened and closed with the blue hat.
        margin-note: Is this question really white, or is it black?
        authorities: []
      - id: r4
        criterion: Evaluation — takes and defends a position on the statement.
        marks: 3
        top-band: States a qualified position early, weighs the strongest case for "too simple" and concludes with a reason.
        margin-note: So, too simple or not? Why?
        authorities: []
  - key: r01
    type: mcq
    concept: running-a-hats-session
    difficulty: 1
    stem: With which hat should a six thinking hats session begin and end?
    options:
      - text: The white hat, so the session opens and closes on facts
        why: Tempting because facts ground a discussion, but the slides say begin and end the session with the blue hat.
      - text: The blue hat
        correct: true
        why: >-
          Correct — the blue hat slide: begin and end session with blue hat; the closing slide is "…and close with the
          blue hat".
      - text: The green hat at the start and the black hat at the end
        why: >-
          Tempting because ideas come early and checks come late, but opening and closing the session is the blue hat's
          job.
      - text: The red hat, so everyone says how they feel first and last
        why: >-
          Tempting because Kivunja says red is useful at the beginning and end of a discussion, but the session itself
          is opened and closed by blue.
  - key: r02
    type: mcq
    concept: running-a-hats-session
    difficulty: 2
    stem: Which question would the facilitator ask while opening a session?
    options:
      - text: What is our focus, and what thinking is needed?
        correct: true
        why: >-
          Correct — the blue hat questions: what is our focus? what thinking is needed? what have we done so far? what
          do we do next?
      - text: What is your gut reaction to the proposal on the table?
        why: >-
          Tempting because it gets everyone talking early, but it is a red-hat question about feelings, not about
          organising the thinking.
      - text: What are the weaknesses of what we have now?
        why: >-
          Tempting because naming problems can frame a session, but it is a black-hat question; the opener asks about
          focus.
      - text: What would happen if we tried something new?
        why: >-
          Tempting because it sounds like an energising start, but it is a green-hat question about possibilities, not
          about the process.
  - key: r03
    type: mcq
    concept: running-a-hats-session
    difficulty: 2
    stem: Which items appear on the slide "…and close with the blue hat"?
    options:
      - text: Gut reactions, intuitions, feelings and preferences
        why: >-
          Tempting because people often end by saying how they feel, but these are red-hat items; the blue close is
          about results.
      - text: Risks, weaknesses, fatal flaws and dangers
        why: >-
          Tempting because a final check is wise, but these are black-hat items; the closing slide is a summary of what
          was achieved.
      - text: What we have achieved, outcome, conclusion, design, solution, next steps
        correct: true
        why: >-
          Correct — the closing slide lists exactly these: what we have achieved, outcome, conclusion, design, solution,
          next steps.
      - text: Facts we know, facts we need, sources and data gaps
        why: >-
          Tempting because data gaps shape next steps, but these are white-hat items; the close looks at outcomes and
          next steps.
  - key: r04
    type: mcq
    concept: running-a-hats-session
    difficulty: 2
    stem: Who should wear the blue hat in a team session, according to the lecturer?
    options:
      - text: Always the most senior manager in the room
        why: >-
          Tempting because managers run meetings, but the lecturer says you do not necessarily give the team's manager
          the blue hat.
      - text: Each member in turn, swapping every minute
        why: >-
          Tempting because sharing roles feels fair, but the lecturer suggests one facilitator keeps the blue hat on
          throughout.
      - text: Whoever acts as facilitator — not necessarily the manager
        correct: true
        why: >-
          Correct — the lecturer: one person can wear the blue hat at all times as facilitator, and it does not have to
          be your manager.
      - text: "Nobody: the blue hat is only for people working on their own"
        why: >-
          Tempting because blue is about your own thinking, but the slides call blue the facilitator's, session leader's
          role in a group.
  - key: r05
    type: mcq
    concept: running-a-hats-session
    difficulty: 2
    stem: What does the general hat issue "direction, not description" mean?
    options:
      - text: Describe the problem in full detail before any of the hats is chosen
        why: >-
          Tempting because defining the problem matters (a blue-hat job), but the issue is about what a hat is: a
          direction.
      - text: "Think in a chosen direction: \"Let's have some black hat thinking…\""
        correct: true
        why: >-
          Correct — the slide: direction, not description; set out to think in a certain direction, as in 'let's have
          some black hat thinking'.
      - text: Give each person a written description of their hat's role in the session
        why: >-
          Tempting because instructions help, but the point is that a hat names a way of thinking now, not a role
          description.
      - text: Describe each idea neutrally and in full before any judgement is made
        why: >-
          Tempting because neutrality is the white hat's strength, but the issue is about hats as directions of thinking
          for everyone.
  - key: r06
    type: mcq
    concept: running-a-hats-session
    difficulty: 2
    stem: >-
      A colleague says, "Leave the risk analysis to Tom — he's our black hat thinker." Which general hat issue does this
      break?
    options:
      - text: Not categories of people
        correct: true
        why: "Correct — the slide: not \"He's a black hat thinker\"; everyone can and should use all the hats."
      - text: Use in whole or in part
        why: >-
          Tempting because only part of the method is being used, but using part of the method is allowed; labelling Tom
          is the problem.
      - text: A constructive form of showing off
        why: >-
          Tempting because Tom may enjoy the role, but the issue broken is treating a hat as a type of person, not
          showing off.
      - text: "Time under each hat: generally, short"
        why: >-
          Tempting because risk analysis could drag on, but nothing in the remark is about time; it labels a person as a
          hat.
  - key: r07
    type: mcq
    concept: running-a-hats-session
    difficulty: 2
    stem: How long should a group generally spend under each hat?
    options:
      - text: A full hour each, so every angle is fully covered
        why: >-
          Tempting because thoroughness sounds good, but the slide says generally short, and the lecturer warns long
          hats tire the group.
      - text: Generally, a short time
        correct: true
        why: >-
          Correct — the slide: time under each hat, generally short; the lecturer suggests a few minutes so everyone
          stays involved.
      - text: As long as the most senior person wants to keep going
        why: Tempting because seniority often sets the pace, but timing is a facilitator decision, and the guide is short.
      - text: Exactly ten minutes per hat, as de Bono requires
        why: >-
          Tempting because a fixed rule is simple, but the slide gives no fixed time; the lecturer says perhaps three,
          five or ten minutes.
  - key: r08
    type: mcq
    concept: running-a-hats-session
    difficulty: 2
    stem: Must every hat be used in every session?
    options:
      - text: Yes — skipping a hat leaves the thinking incomplete and biased
        why: Tempting because covering everything feels safe, but the slide says it is not necessary to use every hat.
      - text: No — use any hat as often as needed; not every hat is necessary
        correct: true
        why: "Correct — the slide: use any hat, as often as needed; not necessary to use every hat."
      - text: Yes — but each hat may be used once only
        why: >-
          Tempting because it sounds tidy, but the slide says any hat can be used as often as needed, and none is
          compulsory.
      - text: No — and the blue hat is the hat that teams most often skip entirely
        why: >-
          Tempting because blue does not generate content, but blue opens and closes the session; it is the hat you
          keep.
  - key: r09
    type: mcq
    concept: running-a-hats-session
    difficulty: 3
    stem: >-
      The "Using the hats" slide says the method "requires discipline from each person — while using it, stay in the
      idiom". What does that mean?
    options:
      - text: Use the formal names of the hats, not their colours
        why: >-
          Tempting because "idiom" sounds like vocabulary, but the point is behaviour: keep thinking in the hat you are
          wearing.
      - text: While wearing a hat, keep thinking in that hat's direction
        correct: true
        why: >-
          Correct — the lecturer: it is tempting to move out of character; with the black hat on, keep asking black-hat
          questions.
      - text: Stay in your usual thinking style so that the team stays balanced
        why: Tempting because people have natural styles, but the hats ask people to work against type and preference.
      - text: Keep the same hat on for the whole session
        why: >-
          Tempting because "stay" suggests not moving, but hats are switched as the session goes; you stay in the idiom
          while wearing each.
  - key: r10
    type: mcq
    concept: running-a-hats-session
    difficulty: 3
    stem: Why does Kivunja (2015) say blue hat thinking differs from all the other hats?
    options:
      - text: It is the only hat that has no questions of its own
        why: >-
          Tempting because blue does not tackle the problem directly, but it has its own questions: focus, thinking
          needed, next steps.
      - text: It is the hat used to make the final decision
        why: >-
          Tempting because blue closes the session, but blue's distinctness is that it thinks about the thinking, not
          that it decides.
      - text: It deals with emotions, which the others exclude
        why: >-
          Tempting because emotions are special, but they belong to the red hat; blue is the organising, metacognitive
          hat.
      - text: It is thinking about thinking — controlling the process rather than solving the problem itself
        correct: true
        why: >-
          Correct — Kivunja: the other hats think about how to solve the problem; blue is focused on thinking about
          thinking (metacognition).
  - key: r11
    type: mcq
    concept: running-a-hats-session
    difficulty: 3
    contrasts-with:
      - hat-sequences
    stem: >-
      A team runs white → yellow → black → green → red → blue in every meeting, believing this order is required. What
      is wrong?
    options:
      - text: The sequence can be preset or evolving; no single order is required
        correct: true
        why: >-
          Correct — the slide: sequence can be preset or evolving, and the lecturer says there is no one best preset
          sequence.
      - text: Nothing — de Bono fixes this exact order of the hats for every single problem
        why: >-
          Tempting because a fixed routine is easy to follow, but neither the slides nor Kivunja fix one order; it
          depends on the problem.
      - text: The order is fine, but green must always come first
        why: >-
          Tempting because ideas start things off, but no hat has to come first, apart from the blue hat opening the
          session.
      - text: They should run all six hats twice in each meeting
        why: >-
          Tempting because repetition can deepen thinking, but the issue is the belief in a required order, not the
          number of rounds.
  - key: r12
    type: mcq
    concept: running-a-hats-session
    difficulty: 2
    stem: What does "a constructive form of showing off" mean on the general hat issues slide?
    options:
      - text: Show off by being a better thinker, not by winning a right-vs-wrong argument
        correct: true
        why: "Correct — the slide: show off by being a better thinker; not destructive right vs wrong argument."
      - text: Show off your expertise by choosing your favourite hat
        why: >-
          Tempting because people like to shine in their strengths, but the hats are for everyone and the point is
          better thinking.
      - text: Show off by finishing your hat faster than the others
        why: >-
          Tempting because speed can impress, but nothing in the slide rewards speed; it rewards thinking well in each
          direction.
      - text: Show off the final plan to senior management
        why: >-
          Tempting because results are shown upwards, but the phrase is about behaviour inside the session, not
          reporting.
  - key: r13
    type: mcq
    concept: running-a-hats-session
    difficulty: 3
    stem: What does the lecturer suggest for a team member who is naturally very optimistic?
    options:
      - text: Give them the yellow hat, since it suits them best
        why: >-
          Tempting because it plays to their strength, but the lecturer suggests the opposite to get them out of their
          comfort zone.
      - text: Give them the black hat to get them out of their comfort zone
        correct: true
        why: >-
          Correct — the lecturer: try putting a black hat on very optimistic people, and a yellow hat on gloomy ones,
          and see what happens.
      - text: Make them the facilitator so that their optimism lifts the whole group
        why: >-
          Tempting because energy helps a facilitator, but the lecturer's suggestion is about hats against type, not the
          blue role.
      - text: Keep them out of the black hat round so morale stays high
        why: Tempting because criticism can deflate optimists, but the slides say everyone can and should use all the hats.
  - key: r14
    type: mcq
    concept: running-a-hats-session
    difficulty: 4
    variant-of: r07
    stem: >-
      A start-up founder plans a three-hour session: all six hats in a fixed order, 30 minutes each, with the CEO in the
      blue hat throughout. Which change best follows the slides and the lecture?
    options:
      - text: Make it longer, so that every hat gets a full hour of careful thought
        why: >-
          Tempting because the decision is important, but the slide says time under each hat is generally short; longer
          makes it worse.
      - text: Keep each hat short, and use only the hats this problem actually needs
        correct: true
        why: >-
          Correct — time under each hat is generally short, and it is not necessary to use every hat; the sequence can
          also evolve.
      - text: Replace the CEO with an outside consultant, as the method itself requires
        why: >-
          Tempting because the facilitator need not be the manager, but nothing requires an outsider; the CEO may
          facilitate.
      - text: Drop the blue hat, since the CEO already controls the meeting
        why: >-
          Tempting because the CEO has authority, but the session should begin and end with the blue hat whoever leads
          it.
  - key: r15
    type: mcq
    concept: running-a-hats-session
    difficulty: 2
    stem: Can the six hats be used by one person working alone?
    options:
      - text: No — parallel thinking needs at least two people
        why: >-
          Tempting because parallel suggests others alongside you, but the slide says the hats can be used by
          individuals and groups.
      - text: Only by managers preparing for a team meeting
        why: >-
          Tempting because preparation is a sensible use, but the lecturer says anyone can use them, even for personal
          decisions.
      - text: Yes — individuals and groups, even for personal decisions
        correct: true
        why: >-
          Correct — the slide: can be used by individuals and groups; the lecturer adds career, financial and
          relationship decisions.
      - text: Yes — but only the blue and white hats work for one person alone
        why: >-
          Tempting because those hats feel analytical, but the lecturer describes putting on each hat in turn when
          working alone.
  - key: r16
    type: match
    concept: running-a-hats-session
    difficulty: 2
    prompt: Match each general hat issue on the slide with its meaning.
    pairs:
      - left: Direction, not description
        right: Set out to think in a certain direction
      - left: Not categories of people
        right: Everyone can and should use all the hats
      - left: A constructive form of showing off
        right: Show off by being a better thinker
      - left: Use in whole or in part
        right: A session can use the full set or only some hats
  - key: r17
    type: truefalse
    concept: running-a-hats-session
    difficulty: 1
    set: quickfire
    statement: The blue hat is worn only at the very end of a session, to summarise.
    answer: false
    why: >-
      False — the slides say begin and end the session with the blue hat, and Kivunja adds that blue is used in the
      middle too, to steer.
  - key: r18
    type: truefalse
    concept: running-a-hats-session
    difficulty: 1
    set: quickfire
    statement: Everyone can and should use all the hats.
    answer: true
    why: >-
      True — general hat issues: the hats are not categories of people ("He's a black hat thinker" is wrong); everyone
      uses all of them.
  - key: r19
    type: truefalse
    concept: running-a-hats-session
    difficulty: 2
    set: quickfire
    statement: The facilitator wearing the blue hat must be the team's manager.
    answer: false
    why: >-
      False — the lecturer says the facilitator can be anybody; you do not necessarily give the blue hat to the manager
      of the team.
  - key: r20
    type: short
    concept: running-a-hats-session
    difficulty: 3
    prompt: >-
      "A six thinking hats session is only as good as the person wearing the blue hat." Discuss, explaining how you
      would run a 45-minute session for a student club deciding whether to move its annual careers night online.
    model: >-
      Largely true: the blue hat manages the thinking process — control of the other hats, discipline and focus — so a
      weak facilitator lets the session drift back into argument. But the rules and every participant's discipline
      matter too. As facilitator I would open in blue: our focus is a careers night that still serves members; what
      thinking is needed? Then I would call the switches: white (attendance and employer feedback, and what we still
      need), yellow (benefits of going online), black (what might go wrong), green (new formats), red (a quick gut
      check). Following the slides, each hat stays short, we use only the hats we need, and the sequence can evolve. I
      would hold people in the idiom — no black comments during green — and treat hats as directions, not categories of
      people, so the loudest sceptic also does yellow. I would close in blue: what we achieved, outcome, conclusion,
      next steps. Kivunja (2015) shows blue works at the start, middle and end. So the facilitator is necessary, but not
      sufficient: the method also needs everyone's discipline.
    rubric:
      - id: r1
        criterion: Concept — explains the blue hat as managing the thinking process.
        marks: 2
        top-band: Defines the blue hat accurately (control, focus, facilitator) and says it opens and closes the session.
        margin-note: What makes blue different from the other hats?
        authorities:
          - mgmt2094-kivunja-2015-six-thinking-hats
      - id: r2
        criterion: Example — draws on the slides or readings for how sessions run.
        marks: 2
        top-band: Uses the "Using the hats" rules or Kivunja's point that blue works at the start, middle and end.
        margin-note: Which slide or reading supports this rule?
        authorities:
          - mgmt2094-kivunja-2015-six-thinking-hats
      - id: r3
        criterion: Application — runs the careers-night session step by step.
        marks: 3
        top-band: >-
          Gives the opening and closing questions, calls the switches and applies at least two rules (short, stay in the
          idiom).
        margin-note: Show me what you would actually say to open.
        authorities: []
      - id: r4
        criterion: Evaluation — takes and defends a position on the statement.
        marks: 3
        top-band: Agrees in part, shows what else the session depends on (rules, discipline) and concludes with a reason.
        margin-note: Only as good as the facilitator — or not?
        authorities: []
  - key: q01
    type: mcq
    concept: hat-sequences
    difficulty: 2
    set: pretest
    stem: To discover the positive and negative aspects of an idea, which order do the slides recommend?
    options:
      - text: Black, then yellow
        why: >-
          Tempting because many people test an idea by attacking it first, but the slide says use the yellow hat before
          the black hat.
      - text: Yellow, then black
        correct: true
        why: >-
          Correct — the evaluation slide: to discover the positive and negative aspects of an idea, use the yellow hat
          before the black hat.
      - text: Red, then white
        why: >-
          Tempting because it is a real slide sequence, but red then white compares fact with opinion; it does not weigh
          pros and cons.
      - text: White, then green
        why: >-
          Tempting because facts and ideas sound balanced, but this pairing is not on the slides and neither hat weighs
          good and bad points.
  - key: q02
    type: mcq
    concept: hat-sequences
    difficulty: 2
    stem: Which sequence do the slides say "compares fact with opinion"?
    options:
      - text: White, then blue
        why: Tempting because it starts from facts, but white then blue asks what we know and where we plan to go.
      - text: Black, then green
        why: >-
          Tempting because it is another two-hat sequence on the slides, but black then green is used to improve a
          design.
      - text: Red, then white
        correct: true
        why: >-
          Correct — the evaluation slide: red then white compares fact with opinion; feelings first, then checked
          against the facts.
      - text: Yellow, then red
        why: >-
          Tempting because both are about how the idea looks to people, but this order is not on the slides as a
          sequence.
  - key: q03
    type: mcq
    concept: hat-sequences
    difficulty: 2
    stem: What do the slides call black, then yellow, then green?
    options:
      - text: A design sequence for new products
        why: Tempting because green generates ideas, but the slides give blue, green and red as the design sequence.
      - text: Comparing and synthesising — coming up with new ideas from the known
        correct: true
        why: >-
          Correct — the slide: black, then yellow, then green is comparing and synthesising, coming up with new ideas
          from the known.
      - text: An evaluation of the positive and negative aspects of an idea
        why: >-
          Tempting because black and yellow weigh the idea, but that evaluation runs yellow first; this three-hat order
          synthesises.
      - text: A check of opinion against the facts
        why: Tempting because black is about logic, but checking opinion against facts is red then white.
  - key: q04
    type: mcq
    concept: hat-sequences
    difficulty: 2
    stem: >-
      Which hats make up the slides' design sequence, used to encourage new ideas, products or improvements to existing
      designs?
    options:
      - text: Blue, green and red
        correct: true
        why: >-
          Correct — the slide: to use design sequences, which encourage new ideas, products or improvements, use the
          blue, green and red hats.
      - text: White, yellow and black
        why: Tempting because evaluating a design needs facts, benefits and risks, but the slide names blue, green and red.
      - text: Black and green only
        why: >-
          Tempting because black then green improves a design (the All Weather bike), but the named design sequence is
          blue, green and red.
      - text: All six hats in any order
        why: Tempting because the method is flexible, but the slide names a specific three-hat design sequence.
  - key: q05
    type: mcq
    concept: hat-sequences
    difficulty: 2
    stem: What does the sequence "white, then blue" ask?
    options:
      - text: How do we feel, and what do the data say?
        why: >-
          Tempting because it pairs feeling and fact, but that is red then white; white then blue moves from facts to a
          plan.
      - text: What are the benefits, and what are the risks?
        why: Tempting because benefits and risks are a common pair, but that is yellow then black.
      - text: What do we know in facts, and where do we plan to go?
        correct: true
        why: "Correct — the slide: white then blue — what do we know in facts, and where do we plan to go."
      - text: What is new here, and how can we improve on what we already have?
        why: >-
          Tempting because improvement follows facts, but new ideas are green; white then blue plans from the known
          facts.
  - key: q06
    type: mcq
    concept: hat-sequences
    difficulty: 2
    stem: What example does the slide give for "the black hat followed by the green hat may be used to improve a design"?
    options:
      - text: An All Weather bike
        correct: true
        why: >-
          Correct — the "Single Hat and Sequence Use" slide gives the All Weather bike as its example of black then
          green.
      - text: A new MP3 player
        why: >-
          Tempting because Apple appears in this week's reading, but that is the linear-thinking article on benefits,
          not the hats slide.
      - text: A chewing-gum brand
        why: Tempting because Trident and Dentyne appear this week, but they belong to Mattimore's brainwalking reading.
      - text: A company car fleet
        why: Tempting because the fleet problem opened the lecture, but it illustrates linear thinking, not a hat sequence.
  - key: q07
    type: mcq
    concept: hat-sequences
    difficulty: 1
    stem: According to the slides, what is the major use of the hats?
    options:
      - text: Always as a full sequence of all six hats
        why: Tempting because the six hats are taught as a set, but the slide says it is not necessary to use every hat.
      - text: Singly, at any point in thinking
        correct: true
        why: "Correct — the slide: the hats can be used singly at any point in thinking; in general, this is the major use."
      - text: As labels for each person's thinking style
        why: Tempting because people have styles, but the hats are not categories of people; they are directions.
      - text: "Only as a pair: one positive hat, one negative"
        why: >-
          Tempting because yellow and black often pair up, but single use is the major use; sequences are simple
          add-ons.
  - key: q08
    type: mcq
    concept: hat-sequences
    difficulty: 3
    stem: >-
      A product team has a prototype water bottle and a list of complaints from testers. They want to fix the design.
      Which two-hat sequence fits best?
    options:
      - text: Yellow, then red
        why: >-
          Tempting because the team needs morale after complaints, but neither hat finds faults and generates fixes in
          that order.
      - text: Black, then green
        correct: true
        why: >-
          Correct — the slide: the black hat followed by the green hat may be used to improve a design; find the flaws,
          then create fixes.
      - text: White, then blue
        why: >-
          Tempting because the complaints are data, but white then blue moves from facts to a plan, without generating
          fixes.
      - text: Red, then white
        why: >-
          Tempting because testers' complaints feel emotional, but red then white compares fact with opinion; it does
          not redesign.
  - key: q09
    type: mcq
    concept: hat-sequences
    difficulty: 3
    variant-of: q08
    stem: >-
      A marketing manager suspects that staff fears about a new customer database are out of proportion. She wants those
      fears aired, then checked against the evidence. Which sequence fits?
    options:
      - text: Yellow, then black
        why: >-
          Tempting because it weighs good and bad points, but she wants feelings aired first and then tested against
          facts.
      - text: Black, then green
        why: >-
          Tempting because the fears are about risks, but black then green improves a design; it does not test opinion
          against fact.
      - text: Blue, then green, then red
        why: Tempting because blue organises the meeting, but this is the design sequence for new ideas, not a fact check.
      - text: Red, then white
        correct: true
        why: "Correct — red then white compares fact with opinion: air the fears (red), then bring the data (white)."
  - key: q10
    type: mcq
    concept: hat-sequences
    difficulty: 3
    variant-of: q08
    stem: >-
      A team has a new idea for a loyalty program and wants to weigh its good and bad points before deciding. Which
      sequence fits?
    options:
      - text: Yellow, then black
        correct: true
        why: >-
          Correct — to discover the positive and negative aspects of an idea, use yellow before black (and perhaps
          green, then red, after).
      - text: Black, then yellow, then green
        why: >-
          Tempting because it includes both yellow and black, but this order is for comparing and synthesising new ideas
          from the known.
      - text: White, then blue
        why: >-
          Tempting because data help any decision, but this sequence asks what we know and where we plan to go, not pros
          and cons.
      - text: Green, then green again
        why: >-
          Tempting because the idea is new and could be developed further, but more green adds ideas without weighing
          them.
  - key: q11
    type: mcq
    concept: hat-sequences
    difficulty: 3
    stem: After yellow then black, what follow-up does the evaluation slide suggest?
    options:
      - text: White (data), then blue (a plan)
        why: Tempting because data and planning often follow evaluation, but the slide suggests green, then red.
      - text: Green (new ideas), then red (feelings and emotions)
        correct: true
        why: >-
          Correct — the slide: you could follow up with the green hat (new ideas) and then the red hat (feelings and
          emotions).
      - text: Black again, to be sure no risk was missed
        why: Tempting because caution feels safe, but the slide warns black can be over-used and suggests green, then red.
      - text: Nothing — the session should end straight away, with a decision
        why: >-
          Tempting because the idea has been assessed, but the slide offers a follow-up, and the session closes with
          blue anyway.
  - key: q12
    type: mcq
    concept: hat-sequences
    difficulty: 3
    stem: In the lecturer's air-freight illustration of red then white, what does the white hat do?
    options:
      - text: Brings the data that plane crashes are very rare, checking the fear against the facts
        correct: true
        why: >-
          Correct — the lecturer: people fear the planes will crash (red); the white hat brings the data that crashes
          hardly ever happen.
      - text: Lists new ways to ship the goods by sea or road instead
        why: Tempting because alternatives help, but new options are green-hat thinking; white brings neutral information.
      - text: Tells everyone that their fear is irrational and must be ignored
        why: Tempting because the fear proves unfounded, but white is non-emotional information, not a verdict on feelings.
      - text: Records how strongly each person feels about flying
        why: >-
          Tempting because feelings were just aired, but measuring feelings is still red territory; white looks at the
          facts of the risk.
  - key: q13
    type: mcq
    concept: hat-sequences
    difficulty: 4
    tags:
      - yellow-v-black
    stem: Why put yellow before black when assessing an idea?
    options:
      - text: Because yellow is the facilitator's hat and must come first
        why: Tempting because something must come first, but the facilitator's hat is blue, not yellow.
      - text: Because black thinking is never useful after yellow
        why: >-
          Tempting if you misread the order, but black does follow yellow; the order puts benefits first, not black last
          forever.
      - text: So the good points are put up front before criticism, giving both sides of the idea
        correct: true
        why: >-
          Correct — the lecturer: put the positive ideas up front, then criticise them, and you have both the positive
          and negative aspects.
      - text: Because positive thinking makes the black hat unnecessary
        why: Tempting because optimism feels persuasive, but the slide uses both hats; skipping black would miss the risks.
  - key: q14
    type: mcq
    concept: hat-sequences
    difficulty: 3
    contrasts-with:
      - running-a-hats-session
    stem: What does Kivunja (2015) say about the order in which the hats are worn?
    options:
      - text: There is no set sequence; it depends on the nature of the problem
        correct: true
        why: >-
          Correct — Kivunja: there is no set sequence in which the hats are always to be worn; it depends on the
          problem, and several can be used at once.
      - text: They must follow the alphabetical order of the hats used in his paper
        why: Tempting because his paper presents the hats alphabetically, but he says that was only for convenience.
      - text: Blue must be followed by white in every problem
        why: >-
          Tempting because facts often start an analysis, but Kivunja gives examples that start with white, yellow or a
          SWOT.
      - text: Only one hat may be worn at any one time
        why: >-
          Tempting because the method is one direction at a time, but Kivunja notes that several hats are often used at
          once in normal thinking.
  - key: q15
    type: mcq
    concept: hat-sequences
    difficulty: 4
    stem: In Kivunja's (2015) example of combining the hats with a SWOT analysis, which hat goes with Opportunities?
    options:
      - text: Green
        why: >-
          Tempting because opportunities sound like new ideas, and the lecture recording said green or yellow, but
          Kivunja pairs Opportunities with yellow.
      - text: Black
        why: Tempting because black appears twice in the SWOT example, but Kivunja pairs it with Weaknesses and Threats.
      - text: Blue
        why: Tempting because blue appears in the example, but Kivunja pairs blue with Strengths.
      - text: Yellow
        correct: true
        why: >-
          Correct — Kivunja: Strengths (blue hat), Weaknesses (black hat), Opportunities (yellow hat) and Threats (black
          hat).
  - key: q16
    type: match
    concept: hat-sequences
    difficulty: 2
    prompt: Match each sequence on the slides with its purpose.
    pairs:
      - left: Yellow → black
        right: "Assess an idea: its positive and negative aspects"
      - left: Black → green
        right: Improve a design
      - left: Red → white
        right: Compare fact with opinion
      - left: Black → yellow → green
        right: "Compare and synthesise: new ideas from the known"
      - left: White → blue
        right: What we know in facts, and where we plan to go
  - key: q17
    type: truefalse
    concept: hat-sequences
    difficulty: 1
    set: quickfire
    statement: When assessing an idea, the slides say the black hat should come before the yellow hat.
    answer: false
    why: >-
      False — the evaluation slide says the opposite: to discover the positive and negative aspects of an idea, use the
      yellow hat before the black hat.
  - key: q18
    type: truefalse
    concept: hat-sequences
    difficulty: 1
    set: quickfire
    statement: Simple sequences of two or three hats may be used together for a particular purpose.
    answer: true
    why: >-
      True — the "Single Hat and Sequence Use" slide: simple sequences of two or three hats may be used together for a
      particular purpose.
  - key: q19
    type: truefalse
    concept: hat-sequences
    difficulty: 2
    set: quickfire
    statement: Red then white compares fact with opinion.
    answer: true
    why: >-
      True — on the evaluation slide, red then white compares fact with opinion: feelings first, then the information to
      test them.
  - key: q20
    type: short
    concept: hat-sequences
    difficulty: 3
    prompt: >-
      "The order in which the hats are worn does not matter." Discuss, recommending a sequence for an outdoor-gear
      retailer whose new rain jacket leaks at the seams while the product manager fears the launch will flop.
    model: >-
      As a general claim the statement is right: Kivunja (2015) says there is no set sequence, and the slides allow
      sequences to be preset or evolving. But once a purpose is chosen, order matters. The slides say simple sequences
      of two or three hats serve particular purposes. Here the purposes are fixing the design and testing a fear. After
      blue sets the focus — a jacket that does not leak — black then green improves a design (the slide's All Weather
      bike example): black names the faults (seams, materials, testing gaps), then green generates fixes without
      judgement (taped seams, new stitching). Next, red then white compares fact with opinion: the manager airs the fear
      of a flop, and white checks it against tester ratings and the number of leaking samples. Blue closes with next
      steps. Reverse either pair and the logic breaks: green before black invents fixes for unknown faults, and white
      before red never surfaces the fear it should test. So no order is fixed in advance, but for a given purpose the
      order is part of the method.
    rubric:
      - id: r1
        criterion: Concept — explains single and sequence use of the hats.
        marks: 2
        top-band: >-
          States that hats are used singly or in short sequences for a purpose, with accurate meanings for each hat
          used.
        margin-note: Why a sequence rather than one hat?
        authorities:
          - mgmt2094-kivunja-2015-six-thinking-hats
      - id: r2
        criterion: Example — uses a slide sequence or example accurately.
        marks: 2
        top-band: >-
          Cites black → green to improve a design (All Weather bike) or red → white to compare fact with opinion,
          correctly.
        margin-note: Which slide sequence is this?
        authorities:
          - mgmt2094-example-all-weather-bike
      - id: r3
        criterion: Application — builds a sequence for the jacket meeting.
        marks: 3
        top-band: Opens and closes with blue and gives scenario-specific content for each hat in a justified order.
        margin-note: What would the green hat actually suggest?
        authorities: []
      - id: r4
        criterion: Evaluation — takes and defends a position on the statement.
        marks: 3
        top-band: Distinguishes "no set sequence" from "order never matters" and shows what reversing the order would cost.
        margin-note: Does order matter or not? Commit.
        authorities: []
  - key: l01
    type: mcq
    concept: linear-thinking-trap
    difficulty: 2
    set: pretest
    stem: >-
      A fleet has equal numbers of 10 MPG and 20 MPG vehicles, each driven 10,000 miles a year. You can upgrade one
      model. Which upgrade saves more fuel?
    options:
      - text: Replace the 20 MPG vehicles with 50 MPG ones, a gain of 30 MPG
        why: >-
          Tempting because +30 MPG and +150% look bigger, but fuel per vehicle only falls from 500 to 200 gallons: 300
          saved.
      - text: Replace the 10 MPG vehicles with 20 MPG ones
        correct: true
        why: >-
          Correct — fuel per vehicle falls from 1,000 to 500 gallons, saving 500, against 300 for the 20 to 50 MPG
          upgrade.
      - text: Both save the same, because each upgrade improves efficiency by a similar share
        why: >-
          Tempting because both are big efficiency gains, but the gallons saved differ: 500 against 300 per vehicle per
          10,000 miles.
      - text: It cannot be worked out without knowing the price of fuel
        why: >-
          Tempting because cost decisions need prices, but the question asks about fuel saved, which follows from miles
          and MPG alone.
  - key: l02
    type: mcq
    concept: linear-thinking-trap
    difficulty: 2
    stem: Why does the fleet answer surprise most people, according to de Langhe, Puntoni and Larrick (2017)?
    options:
      - text: We picture fuel use falling in a straight line as MPG rises, but the real curve flattens out
        correct: true
        why: >-
          Correct — the authors: we tend to think the relationship is linear; in fact gas consumption is not a linear
          function of MPG.
      - text: People forget that the SUVs travel further each year than the sedans do
        why: Tempting because distance drives fuel use, but in the problem every car travels the same 10,000 miles a year.
      - text: Most people do not know the fuel prices that the fleet manager pays
        why: Tempting because prices matter for costs, but the trap is the shape of the MPG–fuel relationship, not prices.
      - text: Percentages always mislead, so managers should only use raw numbers
        why: >-
          Tempting because the percentage increase did mislead here, but the article's lesson is about nonlinearity, not
          a ban on percentages.
  - key: l03
    type: mcq
    concept: linear-thinking-trap
    difficulty: 1
    stem: In the lecture quiz, which gives you more pizza?
    options:
      - text: Two 8-inch pizzas
        why: >-
          Tempting because 8 + 8 = 16 inches looks bigger than 12, but area grows with the square of the radius: about
          101 square inches.
      - text: One 12-inch pizza
        correct: true
        why: "Correct — area is πr²: about 113 square inches for one 12-inch pizza against about 101 for two 8-inch pizzas."
      - text: They are exactly the same amount
        why: "Tempting because the sizes seem close, but the areas differ: about 113 against 101 square inches."
      - text: It depends on how thick the crust is
        why: >-
          Tempting as a joke (a student said it in the chat), but the quiz compares surface area, where the 12-inch
          pizza wins.
  - key: l04
    type: mcq
    concept: linear-thinking-trap
    difficulty: 3
    stem: >-
      You have surveyed 20 men and 50 women about a new product. Which option increases the precision of your estimates
      the most?
    options:
      - text: Survey 100 more women and 5 more men
        why: >-
          Tempting because 105 extra responses sounds better than 35, but extra women add little: precision already
          tapers off at 50.
      - text: Survey 5 more women and 30 more men
        correct: true
        why: >-
          Correct — precision rises quickly, then tapers off, with sample size; the extra men, where you have only 20,
          add the most.
      - text: Survey 50 more of each, so the two groups grow equally
        why: >-
          Tempting because it seems balanced, but it is not one of the quiz options, and it still spends heavily on the
          women already covered.
      - text: "Stop now: 70 responses is enough for any product survey"
        why: >-
          Tempting because 70 sounds like a lot, but the men's estimate rests on only 20 responses and is still
          imprecise.
  - key: l05
    type: mcq
    concept: linear-thinking-trap
    difficulty: 3
    stem: Your goal is more traffic to the company website. Which change helps more?
    options:
      - text: Lift a keyword's organic search ranking from tenth to fourth
        why: >-
          Tempting because it climbs six places against two, but traffic differences are small that far down the results
          page.
      - text: Lift a keyword's organic search ranking from fourth to second
        correct: true
        why: >-
          Correct — the click-through gap is very large among the first few positions, so two places near the top beat
          six lower down.
      - text: Both help equally, because traffic rises steadily as rank improves
        why: >-
          Tempting because that is the straight-line assumption, but the relationship between ranking and click-throughs
          is nonlinear.
      - text: "Neither: organic ranking has no effect on website traffic"
        why: >-
          Tempting only if you distrust search, but the article treats ranking as a driver of traffic — just a nonlinear
          one.
  - key: l06
    type: mcq
    concept: linear-thinking-trap
    difficulty: 3
    stem: Customer lifetime value plotted against retention rate is which type of nonlinear relationship?
    options:
      - text: Climbing quickly, then tapering off
        why: Tempting because that is how per-unit profit behaves with volume, but CLV accelerates as retention rises.
      - text: Increasing gradually, then rising more steeply
        correct: true
        why: Correct — lifting retention from 20% to 40% adds about $35 of CLV; from 60% to 80% about $147.
      - text: Falling sharply, then gradually
        why: Tempting because it is one of the four types, but it describes annual rate of return against payback period.
      - text: "A straight line: each point of retention adds the same value"
        why: >-
          Tempting because that is how most managers think about it, but the article shows CLV is a nonlinear function
          of retention.
  - key: l07
    type: mcq
    concept: linear-thinking-trap
    difficulty: 3
    stem: The balance of a 30-year mortgage over the life of the loan follows which type of curve?
    options:
      - text: Decreasing gradually, then dropping quickly
        correct: true
        why: >-
          Correct — on a 30-year $165,000 loan at 4.5%, only about $15,000 is repaid in the first five years; most comes
          off at the end.
      - text: Falling sharply, then gradually
        why: >-
          Tempting because both curves fall, but the mortgage balance falls slowly at first and quickly at the end — the
          reverse.
      - text: Increasing gradually, then rising more steeply
        why: Tempting because the share of each payment going to principal does rise, but the balance itself is decreasing.
      - text: A straight line, falling by the same amount each year
        why: >-
          Tempting because repayments are fixed, but less of each early payment goes to principal, so the balance does
          not fall linearly.
  - key: l08
    type: mcq
    concept: linear-thinking-trap
    difficulty: 3
    variant-of: l06
    stem: Per-unit profit against sales volume, through economies of scale, follows which type?
    options:
      - text: Increasing gradually, then rising more steeply
        why: Tempting because growth sounds like acceleration, but per-unit profit rises fast at first and then flattens.
      - text: Decreasing gradually, then dropping quickly
        why: >-
          Tempting because fixed costs per unit drop, but the curve shown is for per-unit profit, which rises, not
          falls.
      - text: Climbing quickly, then tapering off
        correct: true
        why: >-
          Correct — 100,000 to 200,000 widgets lifts per-unit profit from $1 to $1.25, but 400,000 to 800,000 adds only
          about 6 cents.
      - text: Falling sharply, then gradually
        why: Tempting because it is another of the four types, but it describes rate of return against payback period.
  - key: l09
    type: mcq
    concept: linear-thinking-trap
    difficulty: 3
    variant-of: l06
    stem: Annual rate of return plotted against payback period follows which type?
    options:
      - text: Falling sharply, then gradually
        correct: true
        why: "Correct — a one-year payback is 100% a year, two years 50%, four years 25%: steep at first, then flatter."
      - text: Climbing quickly, then tapering off
        why: Tempting because the curve does flatten, but rate of return falls as the payback period lengthens.
      - text: Decreasing gradually, then dropping quickly
        why: Tempting because the curve decreases, but it drops steeply at short payback periods and gently at long ones.
      - text: "A straight line: each extra year costs the same return"
        why: >-
          Tempting because it matches intuition, but halving a two-year payback gains far more than halving a four-year
          one.
  - key: l10
    type: mcq
    concept: linear-thinking-trap
    difficulty: 3
    stem: >-
      Paper towels sell at 50 cents a roll (marginal cost 15 cents); 1,000 rolls earn $350. Promotion A (20% off) sells
      1,200 rolls; promotion B (40% off) sells 1,800. What happens to profit?
    options:
      - text: B earns the most, because it lifted sales by 80%
        why: "Tempting because B nearly doubled sales, but at 30 cents a roll the margin is 15 cents: 1,800 × 15c = $270."
      - text: B earns less than A ($270 against $300) despite nearly doubling sales
        correct: true
        why: >-
          Correct — profit sank almost 25% under B; keeping $350 at 40% off would need more than 2,300 units, a 133%
          increase.
      - text: A and B earn the same, because the discount is offset by volume
        why: Tempting because volume does rise, but the article shows that both promotions cut profit, B by more than A.
      - text: Both promotions raise profit above the usual $350
        why: Tempting because sales rise in both, but A earns $300 and B $270, both below the usual $350.
  - key: l11
    type: mcq
    concept: linear-thinking-trap
    difficulty: 2
    stem: Which of these is NOT one of the article's four steps to limit the pitfalls of linear bias?
    options:
      - text: Increase awareness of linear bias among managers
        why: >-
          Tempting to pick because it sounds too obvious to be a step, but it is Step 1: teach it and use puzzles with
          nonlinear relationships.
      - text: Average the data across customer segments
        correct: true
        why: Correct — it is not a step; the article warns that averages mask nonlinearity and lead to prediction errors.
      - text: Focus on outcomes, not indicators
        why: >-
          Tempting to pick because it sounds like general advice, but it is Step 2: intermediate metrics can become the
          end.
      - text: Map nonlinearity whenever you can
        why: "Tempting to pick because it sounds technical, but it is Step 4: data visualisation and \"what if\" scenarios."
  - key: l12
    type: mcq
    concept: linear-thinking-trap
    difficulty: 3
    stem: Step 2, "focus on outcomes, not indicators", warns against what?
    options:
      - text: Using any metrics at all to manage a business
        why: >-
          Tempting because the step is sceptical of metrics, but firms still use intermediate metrics; the risk is how
          they are used.
      - text: Intermediate metrics becoming the end rather than the means
        correct: true
        why: >-
          Correct — the article calls it medium maximisation: a metric such as search rank is maximised as if it were
          the goal.
      - text: Measuring outcomes, because outcomes arrive too late to act on
        why: "Tempting because outcomes can lag, but the step says the opposite: keep the desired outcome in view."
      - text: Letting customers choose which indicators the firm reports
        why: >-
          Tempting because standard metrics are discussed later, but this step is about a firm's own goals and
          incentives.
  - key: l13
    type: mcq
    concept: linear-thinking-trap
    difficulty: 3
    stem: >-
      Step 3 says to discover the type of nonlinearity you are dealing with. To see how price affects sales, how many
      price levels should a field experiment test, at least?
    options:
      - text: "One: a low introductory price"
        why: Tempting because one test is cheap, but a single point shows nothing about the shape of the relationship.
      - text: "Two: one low and one high"
        why: >-
          Tempting because it is the usual A/B design, but two prices cannot reveal a curve; the article says at least
          three.
      - text: "Three: low, medium and high"
        correct: true
        why: >-
          Correct — the article: two prices will not reveal nonlinear relationships; use at least three — low, medium
          and high.
      - text: As many as the firm has products
        why: >-
          Tempting because more data sounds better, but the number of products is irrelevant to the shape of one
          price–sales curve.
  - key: l14
    type: mcq
    concept: linear-thinking-trap
    difficulty: 2
    stem: What lesson for marketers does the article draw from Apple's "1,000 songs in your pocket"?
    options:
      - text: Promote consumer benefits rather than product attributes
        correct: true
        why: >-
          Correct — Apple saw that "1,000 songs in your pocket" beats "internal storage capacity of 5GB": benefits, not
          attributes.
      - text: Always round numbers up to sound more impressive to buyers
        why: >-
          Tempting because 1,000 is a round number, but the point is translating an attribute (5GB) into a benefit
          (songs).
      - text: Technical specifications are what persuade most consumers to buy
        why: >-
          Tempting because specs feel precise, but the example shows the opposite: the benefit framing was more
          attractive.
      - text: Exploit consumers' linear thinking wherever it is profitable
        why: >-
          Tempting because some firms do profit from it, but the article says wilfully exploiting it is widely regarded
          as unethical.
  - key: l15
    type: mcq
    concept: linear-thinking-trap
    difficulty: 4
    stem: How does the lecturer link the linear-thinking article to de Bono's six hats?
    options:
      - text: The six hats remove the need to read data, so linear errors disappear
        why: >-
          Tempting because the hats simplify thinking, but the white hat still demands data; the hats do not replace
          calculation.
      - text: >-
          Linear thinking is one trap among many, and tools like the hats bring in different perspectives that help
          avoid it
        correct: true
        why: >-
          Correct — the lecturer: brainstorming tools such as the six hats spur creativity and draw out perspectives,
          helping avoid traps like linear thinking.
      - text: The article shows that the hats themselves are a form of linear thinking
        why: >-
          Tempting because the hats can run in a sequence, but the lecturer presents them as a remedy for the trap, not
          an example of it.
      - text: The article replaces the six hats with four steps for managers to follow
        why: >-
          Tempting because the article has its own steps, but the lecturer uses it to show why critical-thinking tools
          are needed.
  - key: l16
    type: match
    concept: linear-thinking-trap
    difficulty: 3
    prompt: Match each relationship from the article with its type of curve.
    pairs:
      - left: Customer lifetime value against retention rate
        right: Increasing gradually, then rising more steeply
      - left: Mortgage balance over the loan term
        right: Decreasing gradually, then dropping quickly
      - left: Per-unit profit against sales volume
        right: Climbing quickly, then tapering off
      - left: Annual rate of return against payback period
        right: Falling sharply, then gradually
  - key: l17
    type: truefalse
    concept: linear-thinking-trap
    difficulty: 1
    set: quickfire
    statement: Upgrading a vehicle from 20 to 100 MPG saves more fuel than upgrading one from 10 to 20 MPG.
    answer: false
    why: >-
      False — the article: shockingly, upgrading from 20 to 100 MPG still would not save as much gas as upgrading from
      10 to 20 MPG.
  - key: l18
    type: truefalse
    concept: linear-thinking-trap
    difficulty: 2
    set: quickfire
    statement: According to de Langhe, Puntoni and Larrick, averages can mask nonlinearity and lead to prediction errors.
    answer: true
    why: >-
      True — companies often fail to account for nonlinear patterns partly because they focus on averages, which mask
      nonlinearity.
  - key: l19
    type: truefalse
    concept: linear-thinking-trap
    difficulty: 2
    set: quickfire
    statement: >-
      The article treats wilfully exploiting consumers' linear bias about product attributes as an accepted, ethical
      marketing strategy.
    answer: false
    why: >-
      False — it says wilfully exploiting consumers' flawed perceptions of attribute–benefit relationships is widely
      regarded as unethical.
  - key: l20
    type: short
    concept: linear-thinking-trap
    difficulty: 3
    prompt: >-
      "Bigger improvements on a product attribute always mean bigger benefits for the customer." Discuss, with reference
      to de Langhe, Puntoni and Larrick (2017), for a broadband provider urging customers on 25 Mbps plans to upgrade to
      100 Mbps because it is "four times faster".
    model: >-
      The statement is false, and it is the linear bias de Langhe, Puntoni and Larrick (2017) describe: our minds draw
      straight lines where the relationship is curved. Download time falls sharply, then gradually, as speed rises:
      going from 5 to 25 Mbps saves about 21 minutes per gigabyte, but 25 to 100 Mbps saves only about four more. "Four
      times faster" is an attribute; minutes saved is the benefit. The fleet problem is the same trap: 10 to 20 MPG
      saves 500 gallons, 20 to 50 only 300. The article's advice applies. Focus on outcomes, not indicators: show
      customers time saved, not megabits. Map the nonlinearity: a chart of minutes saved by plan makes the flattening
      visible. Apple's "1,000 songs in your pocket" shows benefit framing can sell. The provider may fear fewer
      upgrades, and some firms do profit from attribute framing, but the authors say wilfully exploiting consumers'
      linear bias is widely regarded as unethical. Larger attribute gains can mean small benefits; honest benefit
      framing protects trust.
    rubric:
      - id: r1
        criterion: Concept — explains linear bias and the relevant type of nonlinearity.
        marks: 2
        top-band: Defines linear bias and identifies the curve (falling sharply, then gradually) with the article's figures.
        margin-note: Which of the four curves is this?
        authorities:
          - mgmt2094-de-langhe-puntoni-larrick-2017-linear-thinking
      - id: r2
        criterion: Example — uses a real example from the article or lecture.
        marks: 2
        top-band: Uses the fleet problem, the internet-speed figures or Apple's benefit framing accurately.
        margin-note: Where does this example come from?
        authorities:
          - mgmt2094-example-fleet-mpg-upgrade
          - mgmt2094-example-apple-1000-songs
      - id: r3
        criterion: Application — applies the article's steps to the broadband campaign.
        marks: 3
        top-band: Applies at least two steps (outcomes not indicators; map nonlinearity) to concrete changes in the campaign.
        margin-note: What should the ad actually say instead?
        authorities: []
      - id: r4
        criterion: Evaluation — takes and defends a position on the statement.
        marks: 3
        top-band: Rejects "always" with reasons, weighs the commercial temptation and the ethics point, and concludes clearly.
        margin-note: Is it always, sometimes or never?
        authorities: []
  - key: b01
    type: mcq
    concept: brainwriting-and-brainwalking
    difficulty: 1
    set: pretest
    stem: In brainwriting, what happens to each participant's sheet of paper?
    options:
      - text: It is collected by the facilitator, who reads every idea aloud
        why: >-
          Tempting because sharing follows, but reading aloud is not the method; sheets pass between participants who
          build on them.
      - text: It passes from person to person, each building on the ideas already written
        correct: true
        why: >-
          Correct — each person writes an idea and passes the paper on; the next builds on it or uses it to trigger a
          new idea.
      - text: It stays with its owner, who fills it in alone throughout the whole session
        why: >-
          Tempting because writing alone avoids influence, but brainwriting depends on passing sheets so people build on
          each other.
      - text: It is pinned to the wall for everyone to vote on at the end
        why: Tempting because brainwalking uses the walls, but in brainwriting the paper moves around the table.
  - key: b02
    type: mcq
    concept: brainwriting-and-brainwalking
    difficulty: 2
    stem: Twelve participants pass their brainwriting sheets for five rounds. How many ideas result, by Mattimore's count?
    options:
      - text: "12"
        why: >-
          Tempting because there are 12 sheets, but each sheet collects one idea per round, so 12 sheets × 5 rounds =
          60.
      - text: "60"
        correct: true
        why: "Correct — Mattimore: 12 participants and five rounds of passes give 60 ideas."
      - text: "17"
        why: >-
          Tempting if you add participants and rounds, but the ideas multiply: every participant adds one idea in every
          round.
      - text: "144"
        why: "Tempting if you square the group size, but rounds, not participants, set the multiplier: 12 × 5 = 60."
  - key: b03
    type: mcq
    concept: brainwriting-and-brainwalking
    difficulty: 2
    stem: What was Mattimore's key change in moving from brainwriting to brainwalking?
    options:
      - text: Move the people instead of the papers
        correct: true
        why: >-
          Correct — Mattimore's "simple and obvious" idea: move the people instead of the papers, between ideation
          stations on the walls.
      - text: Speak the ideas aloud instead of writing them down on paper
        why: >-
          Tempting because talking adds energy, but both methods are written; speaking aloud is what makes classic
          brainstorming go wrong.
      - text: Let one facilitator write every idea on a whiteboard for the group
        why: Tempting because a scribe keeps order, but in brainwalking each participant writes at the stations themselves.
      - text: Cut the number of rounds from five down to just one
        why: Tempting because sessions can drag, but brainwalking also used about five rotations, as brainwriting does.
  - key: b04
    type: mcq
    concept: brainwriting-and-brainwalking
    difficulty: 2
    stem: What are Mattimore's "ideation stations"?
    options:
      - text: Laptops set up for people to type their ideas anonymously
        why: >-
          Tempting because anonymity can help, but the stations are physical sheets on the walls, written on with
          markers.
      - text: Large flip-chart sheets taped on the walls, where people write ideas
        correct: true
        why: >-
          Correct — Mattimore taped large flip-chart sheets on the walls around the room and called them ideation
          stations.
      - text: Small breakout rooms where teams of six people each discuss one idea
        why: >-
          Tempting because the method does use small groups, but the stations are sheets on the walls, and the
          mini-teams are pairs.
      - text: Tables where each person sits and the papers come to them
        why: Tempting because that is brainwriting, but brainwalking moves the people to the stations, not the papers.
  - key: b05
    type: mcq
    concept: brainwriting-and-brainwalking
    difficulty: 2
    stem: Which problem does brainwriting get around, according to Mattimore?
    options:
      - text: The introvert/extrovert problem
        correct: true
        why: >-
          Correct — brainwriting gives everyone equal time to "speak" in a nonthreatening way, with their pen, so the
          loudmouth cannot dominate.
      - text: The lack of a budget for the session
        why: Tempting because paper is cheap, but Mattimore's claim is about who gets heard, not the cost of the session.
      - text: The need to evaluate ideas in the end
        why: >-
          Tempting because owners circle favourites, but evaluation still happens; the problem solved is unequal
          airtime.
      - text: The shortage of a trained facilitator
        why: >-
          Tempting because the method is simple, but Mattimore still facilitates; the problem it fixes is extrovert
          dominance.
  - key: b06
    type: mcq
    concept: brainwriting-and-brainwalking
    difficulty: 3
    stem: Why does the lecturer say classic brainstorming aloud can go wrong?
    options:
      - text: Ideas said aloud are forgotten before anyone writes them down
        why: >-
          Tempting because ideas do get lost, but the lecturer's point is influence: the first idea shapes everyone
          else's.
      - text: Brainstorming produces far too many ideas for any one group to evaluate
        why: >-
          Tempting because volume can overwhelm, but Mattimore says a typical brainstorm is not an efficient way to get
          many ideas.
      - text: Once an idea is said out loud, it influences everyone else's answers
        correct: true
        why: >-
          Correct — the lecturer: once someone says an idea out loud, it influences all the other answers; writing
          reduces that.
      - text: Brainstorming only works when the group has never met before
        why: Tempting because strangers may be less biased, but the lecturer's problem is spoken ideas anchoring the group.
  - key: b07
    type: mcq
    concept: brainwriting-and-brainwalking
    difficulty: 3
    stem: Which of these is NOT an advantage Mattimore claims for brainwalking over brainwriting?
    options:
      - text: Getting people up and moving increases the energy in the room
        why: >-
          Tempting to pick, but it is his first advantage: some people think better on their feet, and the day starts
          with energy.
      - text: Public ideas on the walls are reinforcing for participants
        why: >-
          Tempting to pick, but it is a claimed advantage: dozens of ideas on the walls after a few minutes is
          reinforcing.
      - text: Mini-teams of two produce twice as many ideas
        correct: true
        why: >-
          Correct — not claimed: by doubling up you get half the number of ideas, made up for by quality, fun and
          energy.
      - text: Seeing all the ideas creates shared purpose and group identity
        why: >-
          Tempting to pick, but Mattimore claims exactly this, and it makes the rest of the session easier to
          facilitate.
  - key: b08
    type: mcq
    concept: brainwriting-and-brainwalking
    difficulty: 3
    variant-of: b07
    stem: What does Mattimore say about forming mini-teams of two to brainwalk together?
    options:
      - text: It halves the number of ideas but makes up for it in quality, fun and energy
        correct: true
        why: >-
          Correct — by doubling up you get half the number of ideas, but partners build on each other and create better
          ideas.
      - text: It doubles the number of ideas, because each partner writes separately
        why: Tempting because two heads seem more productive, but partners write together at a station, halving the count.
      - text: It should be avoided, because pairs let the extrovert dominate again
        why: >-
          Tempting given the introvert/extrovert problem, but Mattimore calls mini-teams an absolutely critical
          advantage.
      - text: It makes no difference to the number or the quality of the ideas
        why: >-
          Tempting if pairs seem like a small change, but Mattimore says quantity halves while quality, fun and energy
          rise.
  - key: b09
    type: mcq
    concept: brainwriting-and-brainwalking
    difficulty: 2
    stem: At the end of brainwriting, what does each original owner do with their sheet?
    options:
      - text: Throws it away, because only the spoken discussion afterwards counts
        why: "Tempting if writing seems a warm-up, but the sheets are the output: owners pick favourites for discussion."
      - text: Circles one or two favourite ideas to discuss with the group
        correct: true
        why: >-
          Correct — after the final round each sheet returns to its owner, who circles one or two favourites to discuss
          and build on.
      - text: Ranks every idea on it from best to worst for management
        why: >-
          Tempting because ranking is evaluation, but Mattimore says to circle one or two favourites, not rank
          everything.
      - text: Rewrites the best idea neatly for the final report
        why: Tempting because tidy output looks good, but the next step is group discussion of one or two circled ideas.
  - key: b10
    type: mcq
    concept: brainwriting-and-brainwalking
    difficulty: 3
    stem: Why did Mattimore invent brainwalking?
    options:
      - text: A client asked for a session with no paper at all
        why: >-
          Tempting because flip charts replace sheets, but brainwalking still uses paper; the need was for something
          new.
      - text: Several Dentyne session participants had already done brainwriting in the Trident session a week earlier
        correct: true
        why: >-
          Correct — he did not want to repeat the exercise for the same people, so he moved the people instead of the
          papers.
      - text: Brainwriting had failed badly in the Trident session
        why: >-
          Tempting because he changed the method, but he says brainwriting worked well in the Trident session, even
          better than expected.
      - text: Research showed walking makes people more creative
        why: >-
          Tempting because he mentions Hemingway writing standing up, but the trigger was repeat participants, not
          research.
  - key: b11
    type: mcq
    concept: brainwriting-and-brainwalking
    difficulty: 3
    stem: Mattimore says brainwriting models "idea building and piggybacking". What does that mean?
    options:
      - text: People copy each other's ideas word for word to save time
        why: >-
          Tempting because piggybacking sounds like copying, but it means building on others' ideas to create better
          ones.
      - text: Each time the paper moves, people build on other participants' ideas
        correct: true
        why: >-
          Correct — each time the paper moves, people build on others' ideas, fulfilling the meeting's intent: better
          ideas through mutually stimulated creativity.
      - text: Senior staff add their own names to the best junior ideas on the sheet
        why: Tempting as a cynical reading, but the term is about creative building, not credit-taking.
      - text: Ideas are emailed in advance so nobody has to meet in person
        why: >-
          Tempting because it sounds efficient, but Mattimore says that if ideas could just be emailed, no one would
          need to meet.
  - key: b12
    type: mcq
    concept: brainwriting-and-brainwalking
    difficulty: 3
    stem: >-
      Where does the lecturer place the six hats, brainwriting and brainwalking in the diverge–converge process from the
      first lecture?
    options:
      - text: They help the group diverge once a problem is set; converging comes later
        correct: true
        why: "Correct — the lecturer: when you already have a problem to solve you want to diverge, and later you converge."
      - text: They are converging tools, used to pick the single best idea
        why: Tempting because owners circle favourites, but the lecturer presents these tools as ways to diverge.
      - text: They replace both stages, so no converging is needed
        why: Tempting because they generate many ideas, but the lecturer says you diverge and then, later, converge.
      - text: They belong to finding the problem, before diverging begins
        why: Tempting because problem-finding comes first, but these tools work once you already have a problem to solve.
  - key: b13
    type: mcq
    concept: brainwriting-and-brainwalking
    difficulty: 4
    contrasts-with:
      - parallel-thinking
    stem: >-
      A team leader's idea meetings are dominated by two talkative managers. She wants every member's ideas captured in
      their own words, not just heard. Which approach fits best, and why?
    options:
      - text: Parallel thinking alone, because the hats stop all talking
        why: >-
          Tempting because hats reduce argument, but the hats still run as a conversation; they do not capture
          everyone's ideas in writing.
      - text: Classic brainstorming with a strict rule that everyone speaks once
        why: >-
          Tempting because it forces turns, but spoken ideas still influence the others, which is the problem the
          lecturer names.
      - text: "Brainwriting: everyone \"speaks\" with their pen, so each person's ideas are recorded"
        correct: true
        why: >-
          Correct — brainwriting gives everyone equal time to "speak" with their pen and gets around the
          introvert/extrovert problem.
      - text: Ask the two managers to collect ideas from the others in private
        why: Tempting because it keeps meetings short, but it routes every idea through the same two dominant voices.
  - key: b14
    type: mcq
    concept: brainwriting-and-brainwalking
    difficulty: 3
    stem: Why does Mattimore count "public" ideas as a benefit of brainwalking?
    options:
      - text: Public ideas can be photographed for marketing material
        why: >-
          Tempting because flip charts are photogenic, but Mattimore's point is about participants' motivation and
          identity.
      - text: Seeing dozens of ideas on the walls after a few minutes is reinforcing
        correct: true
        why: Correct — one client joked after 20 minutes, "Look at all the ideas we've created… We can quit now!"
      - text: It lets managers see who wrote each idea and reward them
        why: >-
          Tempting because visibility can mean credit, but Mattimore says nothing about rewards; the benefit is
          reinforcement.
      - text: Public ideas cannot be criticised, so no judgement can take place at all
        why: >-
          Tempting because no-judgement sounds like green-hat thinking, but Mattimore claims reinforcement, not
          protection.
  - key: b15
    type: mcq
    concept: brainwriting-and-brainwalking
    difficulty: 4
    stem: >-
      A hotel chain wants fresh service ideas from 20 front-desk staff in a morning workshop. Many have just finished a
      night shift and energy is low. Which technique fits best, and why?
    options:
      - text: Classic brainstorming aloud, because tired people prefer talking
        why: >-
          Tempting because talking needs no effort, but one person talks while the rest listen, and the first idea
          anchors the others.
      - text: Brainwriting at the tables, because it lets people stay seated
        why: Tempting because brainwriting works well, but it does nothing for low energy; brainwalking adds movement.
      - text: "Brainwalking: moving between ideation stations raises the energy"
        correct: true
        why: >-
          Correct — Mattimore: getting people up and moving increases the energy in the room significantly; ideas are
          public and build momentum.
      - text: "No workshop: ask staff to email their ideas in later"
        why: >-
          Tempting because they are tired, but Mattimore says emailing ideas loses the mutually stimulated creativity of
          meeting.
  - key: b16
    type: match
    concept: brainwriting-and-brainwalking
    difficulty: 2
    prompt: Match each format with its feature.
    pairs:
      - left: Classic brainstorming
        right: One person talks and everyone else listens
      - left: Brainwriting
        right: Sheets pass around the table; people build on what is written
      - left: Brainwalking
        right: People rotate between flip-chart stations on the walls
      - left: Brainwalking mini-teams
        right: "Pairs work together: fewer ideas, better quality"
  - key: b17
    type: truefalse
    concept: brainwriting-and-brainwalking
    difficulty: 1
    set: quickfire
    statement: In brainwalking, the papers move around the room while the participants stay seated.
    answer: false
    why: >-
      False — that is brainwriting. Brainwalking moves the people instead of the papers, between flip-chart ideation
      stations on the walls.
  - key: b18
    type: truefalse
    concept: brainwriting-and-brainwalking
    difficulty: 2
    set: quickfire
    statement: Mattimore says using markers and flip-chart paper leads brainwalkers to write their ideas bigger.
    answer: true
    why: >-
      True — participants find themselves literally writing the ideas bigger than with pencil and paper, and bigger
      ideas are what ideation is about.
  - key: b19
    type: truefalse
    concept: brainwriting-and-brainwalking
    difficulty: 1
    set: quickfire
    statement: Brainwriting gives everyone equal time to "speak" in a nonthreatening way.
    answer: true
    why: >-
      True — Mattimore: in brainwriting everyone gets equal time to "speak" in a nonthreatening way, with their pen —
      creative democracy.
  - key: b20
    type: short
    concept: brainwriting-and-brainwalking
    difficulty: 3
    prompt: >-
      "The best way to get ideas from a group is to let people call them out." Discuss, recommending a technique for a
      supermarket chain that wants 30 store managers to generate ideas for reducing food waste at a one-day conference.
    model: >-
      I disagree. Calling ideas out is classic brainstorming, and the lecturer explains why it fails: once an idea is
      said aloud it influences everyone else's, and Mattimore (2012) adds that one person talks while everyone else
      listens, so the extroverts dominate. Brainwriting fixes this: each manager writes an idea, passes the sheet on,
      and the next builds on it; with five rounds, 30 managers would produce about 150 ideas, everyone "speaks" with
      their pen, and ideas piggyback. For a long conference day I would recommend brainwalking, Mattimore's improvement:
      flip-chart "ideation stations" on the walls, one per waste problem (produce, bakery, deli), with managers rotating
      in pairs. Moving raises energy, public ideas reinforce progress, the walls build shared purpose, and pairs trade
      some quantity for quality. Mattimore invented it for Trident and Dentyne sessions when repeat participants needed
      something new. The trade-offs: brainwalking needs space and facilitation, and pairs halve the idea count. These
      tools serve the divergent stage; the chain still has to converge on a few ideas to trial.
    rubric:
      - id: r1
        criterion: Concept — explains what goes wrong in spoken brainstorming and how brainwriting and brainwalking work.
        marks: 2
        top-band: Describes the anchoring and introvert/extrovert problems and the mechanics of both techniques accurately.
        margin-note: What exactly moves — the paper or the people?
        authorities:
          - mgmt2094-mattimore-2012-brainwalking
      - id: r2
        criterion: Example — uses Mattimore's real example or figures.
        marks: 2
        top-band: Uses the Trident and Dentyne origin or the 12 × 5 = 60 arithmetic correctly.
        margin-note: Where did brainwalking come from?
        authorities:
          - mgmt2094-example-trident-dentyne-brainwalk
      - id: r3
        criterion: Application — designs the session for the 30 store managers.
        marks: 3
        top-band: Recommends a technique with concrete set-up (stations, rounds, pairs) fitted to the conference.
        margin-note: How many stations, and why?
        authorities: []
      - id: r4
        criterion: Evaluation — takes and defends a position on the statement.
        marks: 3
        top-band: >-
          Rejects or qualifies the statement with reasons, weighs the trade-offs and places the tools in
          diverge–converge.
        margin-note: Best way — by what measure?
        authorities: []
  - key: k01
    type: mcq
    concept: leadership-and-knowledge-sharing
    difficulty: 1
    stem: How do Carmeli, Gelbard and Reiter-Palmon (2013) define knowledge sharing?
    options:
      - text: Storing company documents in a shared database for staff
        why: >-
          Tempting because technology often supports sharing, but the definition is about activities between people, not
          storage.
      - text: Activities aimed at transferring or disseminating knowledge from one person or group to another
        correct: true
        why: >-
          Correct — the article adopts this definition (from Lee 2001), focusing on work experience shared and exchanged
          between employees.
      - text: Training courses run by the HR department for new employees
        why: >-
          Tempting because training is one HRM lever the authors mention, but knowledge sharing itself is the transfer
          between people.
      - text: Publishing research findings so competitors can learn from them
        why: >-
          Tempting because external sharing exists, but the definition covers any transfer from person or group to
          another.
  - key: k02
    type: mcq
    concept: leadership-and-knowledge-sharing
    difficulty: 2
    stem: What is the difference between internal and external knowledge sharing in the study?
    options:
      - text: "Internal: colleagues inside the organisation; external: people outside it"
        correct: true
        why: >-
          Correct — respondents rated how far they exchange knowledge with colleagues inside the organisation and with
          people outside it.
      - text: Internal is knowledge in your own head; external is in books and databases
        why: >-
          Tempting because the article does describe internal (tacit) and external (explicit) information sources, but
          the sharing measures are about people.
      - text: Internal is formal and written; external is informal and spoken
        why: Tempting because channels differ, but the study defines the two by who you share with, not by format.
      - text: Internal is with your manager; external is with other teams
        why: Tempting because both are work relationships, but external means people outside the organisation altogether.
  - key: k03
    type: mcq
    concept: leadership-and-knowledge-sharing
    difficulty: 2
    stem: In Study 2, what does "fluency" measure?
    options:
      - text: How clearly each participant explained their ideas
        why: >-
          Tempting because fluency suggests articulate speech, but the study counted ideas, not how well they were
          expressed.
      - text: The number of ideas each participant generated
        correct: true
        why: >-
          Correct — fluency is the number of ideas each participant generated in listing uses for a familiar work
          device.
      - text: How many of the participant's ideas were actually used
        why: Tempting because usefulness is part of creativity, but fluency was a simple count of ideas generated.
      - text: How quickly the participant came up with a first idea
        why: Tempting because fluency suggests speed, but the measure was the number of ideas, with no timing.
  - key: k04
    type: mcq
    concept: leadership-and-knowledge-sharing
    difficulty: 2
    stem: In Study 2, how was "originality" measured?
    options:
      - text: Ideas mentioned by fewer than 1% of the sample
        correct: true
        why: >-
          Correct — two creativity scholars coded ideas; originality counted those mentioned by fewer than 1 percent of
          the sample.
      - text: A self-rating of how original each participant believed they were
        why: >-
          Tempting because the other measures were self-reports, but originality was coded from the ideas actually
          written.
      - text: Whether the manager judged the employee to be creative at work
        why: >-
          Tempting because leaders feature in the study, but managers did not rate originality; scholars coded the
          ideas.
      - text: The share of ideas that no other organisation had tried before
        why: Tempting because novelty in the market matters, but originality was rarity within the study's own sample.
  - key: k05
    type: mcq
    concept: leadership-and-knowledge-sharing
    difficulty: 2
    stem: Which item measures "leader supportive behaviours" in the study?
    options:
      - text: The manager models collaboration and knowledge exchange
        correct: true
        why: >-
          Correct — one of the four items; the others are encouraging information exchange, openness in discussion
          meetings and idea sharing.
      - text: The manager sets strict deadlines for every creative project
        why: >-
          Tempting because leaders can provide structure, but the measure is about supporting and encouraging knowledge
          exchange.
      - text: The manager personally comes up with most of the team's ideas
        why: >-
          Tempting because leaders can be creative, but the study measures support for others' sharing, not the leader's
          own ideas.
      - text: The manager keeps sensitive information within the senior team
        why: >-
          Tempting because some information is proprietary, but restricting information is the opposite of the
          supportive behaviour measured.
  - key: k06
    type: mcq
    concept: leadership-and-knowledge-sharing
    difficulty: 3
    stem: Which activity belongs to the generation phase of creative problem solving?
    options:
      - text: Idea evaluation
        why: >-
          Tempting because evaluating comes early in many meetings, but the article places idea evaluation in the
          implementation phase.
      - text: Implementation planning
        why: Tempting because planning sounds like a starting point, but it closes the implementation phase.
      - text: Information search and acquisition
        correct: true
        why: >-
          Correct — the generation phase includes problem identification and construction, information search and
          acquisition, and ideation.
      - text: Idea selection
        why: Tempting because choosing follows quickly on ideas, but idea selection sits in the implementation phase.
  - key: k07
    type: mcq
    concept: leadership-and-knowledge-sharing
    difficulty: 3
    variant-of: k06
    stem: Which activity belongs to the implementation phase of creative problem solving?
    options:
      - text: Problem identification and construction
        why: Tempting because it shapes everything after it, but it opens the generation phase.
      - text: Ideation
        why: Tempting because ideas are what get implemented, but generating ideas (ideation) is the generation phase.
      - text: Idea selection
        correct: true
        why: Correct — the implementation phase includes idea evaluation, idea selection and implementation planning.
      - text: Information search and acquisition
        why: Tempting because searching can continue throughout, but the article puts it in the generation phase.
  - key: k08
    type: mcq
    concept: leadership-and-knowledge-sharing
    difficulty: 3
    stem: What was the main finding of Study 1 (274 employees)?
    options:
      - text: Leaders related to capacity directly and through both kinds of sharing
        correct: true
        why: >-
          Correct — both forms of knowledge sharing partially mediated the link between leader behaviours and creative
          problem-solving capacity.
      - text: Leader behaviours had no link to creativity once knowledge sharing was counted
        why: >-
          Tempting because sharing carried part of the effect, but the direct link stayed significant: the mediation was
          partial.
      - text: Only external knowledge sharing related to creative problem-solving capacity
        why: >-
          Tempting because external sharing brings diverse information, but in Study 1 both internal and external
          sharing related to it.
      - text: Creative problem-solving capacity caused leaders to share more knowledge
        why: >-
          Tempting because the authors admit reverse causation is possible, but the tested model ran from leaders to
          sharing to capacity.
  - key: k09
    type: mcq
    concept: leadership-and-knowledge-sharing
    difficulty: 3
    stem: In Study 2 (130 utility technicians), what did the authors find about external knowledge sharing?
    options:
      - text: It was the strongest single predictor of originality in the study
        why: >-
          Tempting because diverse outside information is said to help creativity, but in Study 2 it was not
          significant.
      - text: It was not significantly related to creative problem solving
        correct: true
        why: >-
          Correct — in Study 2 the link between external knowledge sharing and creative problem solving was not
          significant.
      - text: It reduced creative performance on both measures
        why: Tempting because it failed to help, but the study found no significant link, not a harmful one.
      - text: It was not measured in Study 2 at all
        why: >-
          Tempting because Study 2 changed the creativity measure, but the knowledge-sharing measures were the same as
          in Study 1.
  - key: k10
    type: mcq
    concept: leadership-and-knowledge-sharing
    difficulty: 4
    stem: What did the Study 2 mediation tests show about creative problem solving?
    options:
      - text: Full mediation for internal sharing → originality; partial for fluency
        correct: true
        why: >-
          Correct — Sobel tests supported full mediation for originality and partial mediation for fluency; external
          sharing did not qualify.
      - text: It fully mediated every link from both kinds of knowledge sharing to both measures
        why: >-
          Tempting because the model was built that way, but external sharing was unrelated to creative problem solving
          in Study 2.
      - text: It mediated nothing, because creative problem solving was unrelated to performance
        why: >-
          Tempting because the findings were mixed, but creative problem solving was related to both fluency and
          originality.
      - text: It mediated only the link between leader behaviours and fluency
        why: >-
          Tempting because leaders start the chain, but the Study 2 mediation tests ran from knowledge sharing to
          performance.
  - key: k11
    type: mcq
    concept: leadership-and-knowledge-sharing
    difficulty: 2
    stem: How does the article distinguish creativity from creative problem solving?
    options:
      - text: They are the same thing, so the article uses the terms interchangeably
        why: Tempting because they are related, but the article says there is a difference between them.
      - text: Creativity is novel, useful ideas; creative problem solving is the whole process
        correct: true
        why: >-
          Correct — creativity is the ideation process (originality and usefulness); creative problem solving spans
          generation and implementation phases.
      - text: Creativity is for artists; creative problem solving is for managers
        why: Tempting as an everyday contrast, but the article defines both for employees in organisations.
      - text: Creativity is a fixed personality trait, while creative problem solving can be learned
        why: Tempting because capacity can be cultivated, but the article does not call creativity a fixed trait.
  - key: k12
    type: mcq
    concept: leadership-and-knowledge-sharing
    difficulty: 2
    stem: What does the Buckman Laboratories example illustrate?
    options:
      - text: A leader serving as a role model for knowledge sharing
        correct: true
        why: >-
          Correct — CEO Robert Buckman engaged in lengthy online discussions with salespeople, sharing his views,
          knowledge and experience.
      - text: A firm that banned its staff from sharing knowledge with outsiders
        why: Tempting because proprietary concerns are discussed, but Buckman shows a leader opening up, not restricting.
      - text: A brainwalking session run for a sales team
        why: >-
          Tempting because both are about idea sharing, but Buckman's example is online discussions, not ideation
          stations.
      - text: A study proving that online tools cause creativity
        why: >-
          Tempting because the discussions were online, but the authors use it to show role modelling, not to prove a
          cause.
  - key: k13
    type: mcq
    concept: leadership-and-knowledge-sharing
    difficulty: 3
    stem: Which HRM practice do the authors recommend?
    options:
      - text: Include knowledge sharing as a dimension of performance evaluation
        correct: true
        why: >-
          Correct — it encourages sharing because it is evaluated, and signals that the organisation views sharing as
          important.
      - text: Pay employees a bonus for each new idea that they submit to managers
        why: >-
          Tempting because incentives can drive behaviour, but the article recommends evaluation, training and leader
          selection.
      - text: Rely mainly on technology to make sharing happen
        why: Tempting because many efforts focus on technology, but the authors say HRM factors may matter more.
      - text: Stop employees sharing anything outside the company
        why: >-
          Tempting because proprietary information is a concern, but they recommend training on what can and cannot be
          shared.
  - key: k14
    type: mcq
    concept: leadership-and-knowledge-sharing
    difficulty: 3
    stem: Why do the authors suggest training employees about knowledge sharing?
    options:
      - text: They may fear divulging proprietary information when they share
        correct: true
        why: >-
          Correct — training on what can and cannot be shared may ease concerns, especially about sharing outside the
          organisation.
      - text: Employees do not know how to use the company's software
        why: Tempting because systems need skills, but the authors' concern is reluctance about what is safe to share.
      - text: Training on sharing replaces the need for supportive leaders entirely
        why: >-
          Tempting because both build sharing, but the authors say that, more importantly, leaders facilitate sharing as
          role models.
      - text: Untrained employees share too much with colleagues
        why: >-
          Tempting because oversharing is possible, but the concern raised is reluctance, mainly about sharing
          externally.
  - key: k15
    type: mcq
    concept: leadership-and-knowledge-sharing
    difficulty: 3
    stem: Which limitation do the authors acknowledge?
    options:
      - text: Self-report surveys and convenience samples limit how far cause and effect can be inferred
        correct: true
        why: >-
          Correct — they note common method bias, convenience samples and the need for a longitudinal design to test
          causality.
      - text: The studies were run only on university students in a laboratory
        why: >-
          Tempting because many creativity studies are, but these samples were full-time employees in real
          organisations.
      - text: The sample was too large to analyse properly
        why: Tempting as a technical-sounding worry, but the concern is the type of data and sample, not its size.
      - text: Leaders were not asked about knowledge sharing at all
        why: >-
          Tempting because followers rated leaders, but the authors' worry is single-source data, not a missing
          question.
  - key: k16
    type: mcq
    concept: leadership-and-knowledge-sharing
    difficulty: 4
    stem: >-
      A software firm wants more original product ideas from its engineers. Based on Carmeli et al., which action has
      the strongest support?
    options:
      - text: Leaders model and encourage idea sharing among colleagues inside the firm
        correct: true
        why: >-
          Correct — internal knowledge sharing related to creative problem solving, which fully mediated its link to
          originality.
      - text: Send the engineers to outside conferences as the main lever for originality
        why: >-
          Tempting because outside ideas seem fresh, but in Study 2 external sharing did not relate to creative problem
          solving.
      - text: Hire for creative personality traits and leave the process alone
        why: >-
          Tempting because traits matter, but the authors move beyond traits to the contextual role of leaders and
          sharing.
      - text: Cut team meetings so engineers can think alone without distraction
        why: Tempting because focus helps, but the findings point to more knowledge exchange, not less.
  - key: k17
    type: match
    concept: leadership-and-knowledge-sharing
    difficulty: 2
    prompt: Match each construct from Carmeli et al. (2013) with its meaning.
    pairs:
      - left: Fluency
        right: The number of ideas each participant generated
      - left: Originality
        right: Ideas mentioned by fewer than 1% of the sample
      - left: Internal knowledge sharing
        right: Exchanging knowledge with colleagues inside the organisation
      - left: External knowledge sharing
        right: Exchanging knowledge with people outside the organisation
  - key: k18
    type: truefalse
    concept: leadership-and-knowledge-sharing
    difficulty: 2
    set: quickfire
    statement: >-
      Carmeli et al. found that leader supportive behaviours related to creative problem-solving capacity only through
      knowledge sharing, never directly.
    answer: false
    why: >-
      False — leader behaviours related to creative problem-solving capacity both directly and indirectly, through
      internal and external knowledge sharing.
  - key: k19
    type: truefalse
    concept: leadership-and-knowledge-sharing
    difficulty: 2
    set: quickfire
    statement: >-
      Study 2 measured creative performance by asking technicians to list uses for a device that alerts pilots that an
      aeroplane is too close to the ground.
    answer: true
    why: >-
      True — participants wrote down as many uses as they could for this familiar work device; the ideas were coded for
      fluency and originality.
  - key: k20
    type: short
    concept: leadership-and-knowledge-sharing
    difficulty: 3
    prompt: >-
      "Creative ideas come from creative people, not from their leaders." Discuss, with reference to Carmeli, Gelbard
      and Reiter-Palmon (2013), for a consulting firm whose partners complain that junior staff produce few original
      ideas.
    model: >-
      The statement understates leaders. Carmeli, Gelbard and Reiter-Palmon (2013) move beyond personality traits:
      across two studies, leader supportive behaviours — modelling collaboration and knowledge sharing, encouraging
      information exchange, openness and idea sharing — related to employees' creative problem-solving capacity
      directly, and indirectly through internal and external knowledge sharing. That capacity (problem construction,
      information search, ideation, then evaluation, selection and implementation planning) related to both fluency and
      originality, and in Study 2 it fully mediated the link between internal knowledge sharing and originality. For the
      partners, the lesson is to look at themselves. They should model sharing, as Robert Buckman did in long online
      discussions with salespeople; open up project meetings; include knowledge sharing in performance evaluation; and
      train juniors on what client information can be shared. The statement has some force: the authors cannot prove
      cause and effect from self-report, convenience-sample data, and juniors need domain knowledge to be original.
      Still, the evidence suggests leaders shape the conditions in which creative people produce original ideas.
    rubric:
      - id: r1
        criterion: Concept — defines the study's key constructs and the chain from leader to creative performance.
        marks: 2
        top-band: >-
          Accurately defines knowledge sharing, creative problem-solving capacity, fluency and originality and links
          them in order.
        margin-note: What sits between the leader and the idea?
        authorities:
          - mgmt2094-carmeli-gelbard-reiter-palmon-2013-leadership
      - id: r2
        criterion: Example — uses a real example from the reading.
        marks: 2
        top-band: Uses the Buckman Laboratories example accurately as leader role-modelling.
        margin-note: Which real leader did this?
        authorities:
          - mgmt2094-example-buckman-laboratories
      - id: r3
        criterion: Application — turns the findings into actions for the consulting partners.
        marks: 3
        top-band: >-
          Gives at least three concrete actions drawn from the findings and HRM implications, fitted to a consulting
          firm.
        margin-note: What would the partners do on Monday?
        authorities: []
      - id: r4
        criterion: Evaluation — takes and defends a position on the statement.
        marks: 3
        top-band: Qualifies the statement, weighs the study's limits (causality, self-report) and concludes with a reason.
        margin-note: Leaders or people — where do you land?
        authorities: []
