week_file:
  topic: Legal reasoning and the nature of law
  summary: >-
    Week 7 connects legal reasoning with the question "what is law?" through five themes: legal reasoning, legal
    interpretation, rules versus standards, legal defeasibility and judicial discretion. It sets Raz (legal reasoning is
    moral reasoning) against Finnis (largely technical reasoning), sorts the types of reasoning and rules, asks with
    Schauer whether legal reasoning is special, reads the five judgments in Fuller's Speluncean Explorers, and closes on
    Schauer's convergence of rules and standards, Hart's "unless", Holy Trinity and the Hart–Dworkin exchange on
    discretion. For the essay, it trains the zoom in / zoom out move from a specific claim to a general theory of law.
  notes: >
    ## Five themes


    1. Legal reasoning and the question 'What is law?'

    2. Legal interpretation

    3. Rules vs Standards/Principles

    4. Legal defeasibility

    5. Judicial discretion


    We could have an entire unit on legal reasoning. This week thinks about some problems that emerge in relation to
    legal reasoning and connects them with the broader question about the nature of law, the big 'what is law?' question
    of the first part of the unit. The second part of the unit engages with more specific problems and normative
    questions, which help us rethink claims and arguments from the first part.


    ## Raz on legal reasoning


    "I have rejected the strong thesis of the autonomy of legal reasoning. Legal reasoning is an instance of moral
    reasoning. Legal doctrines are justified only if they are morally justified, and they should be followed only if it
    is morally right to follow them. […] In reasoning according to law the courts ought to follow those principles,
    which are moral principles, though they may be mistaken moral principles. Thus legal reasoning is an instance of
    moral reasoning, though sometimes it is morally incorrect, or based on morally deficient legal principles."


    The legal systems of different countries, with their doctrines of balancing the powers of the different organs of
    government, make varying claims as to when the courts are morally justified or even required to deviate from legal
    doctrine when it conflicts with morality, and when the courts should leave the reform of doctrine to other bodies of
    government.


    ## Finnis on legal reasoning


    "Legal reasoning, indeed, is technical reasoning, at least in large part not moral reasoning."


    "Much academic theory about legal reasoning greatly exaggerates the extent to which reason can settle what is
    greater good or lesser evil, and minimizes the need for authoritative sources which, so far as they are clear and
    respect the few absolute moral rights and duties, are to be respected as the only rational basis for judicial
    reasoning and decision […]. A natural law theory in the classical tradition makes no pretence that natural reason
    can determine the one right answer to those countless questions which arise for the judge who finds the sources
    unclear."


    You might expect the positivist (Raz) to see legal reasoning as a highly technical enterprise disconnected from
    morality, and the natural law thinker (Finnis) to connect it with morality. The reverse is true. Two lessons from
    the lecture:


    - There is an important difference between the specific claims authors defend, in light of specific arguments, and
    their broader views about the nature of law and of legal theory. They are not completely disconnected, but they are
    separable.

    - The examples force us to ask whether legal reasoning is different in kind from other types of (practical)
    reasoning: reasoning geared towards action, where in law the action is a decision.


    Finnis's view is not surprising given how he criticised Dworkin's one right answer thesis in light of
    incommensurability. For Finnis a judge may face a hard case: legal indeterminacy is part of the law, and a natural
    law theory still tries to explain it.


    ## Main types of (legal) reasoning


    - **Deductive reasoning**: general rule → specific conclusion (eg syllogism).

    - **Inductive reasoning**: specific cases → general principle (eg common law development).

    - **Analogical reasoning**: comparing cases; similar facts → similar outcomes (precedent).

    - **Abductive reasoning**: inference to the best explanation; plausibility, not certainty (we start with an
    observation or a set of facts, and conclude with the best available hypothesis to explain those facts).

    - **Purposive/teleological reasoning**: reasoning in light of a rule's underlying purpose/rationale.

    - **Reasoning by principle**: weighing and balancing competing principles/values (not fixed rules).


    We find all of these in law and in other areas of life. The lecture's syllogism: all documents with these
    characteristics are valid wills; this document has all the required characteristics; therefore this document is a
    valid will.


    ## Main types of (legal) rules


    - **Mandatory rules**: impose a duty to act ('X must do Y').

    - **Prohibitive rules**: impose a duty not to act ('X must not do Y').

    - **Permissive rules**: grant a liberty/option ('X may do Y').

    - **Power-conferring rules**: confer legal power to create/change/extinguish legal relations (eg making a will,
    passing legislation).

    - **Constitutive rules**: create the activity/institution itself (eg rules defining contracts, marriage,
    corporations).

    - Rules, principles, standards, norms…


    Recall Hart's distinction between duty-imposing and power-conferring rules in chapter 3 of *The Concept of Law*,
    against Austin. Constitutive rules exist outside law too: what a goal in football is is created by the rules of
    football.


    ## Fred Schauer on the no-vehicles-in-the-park rule


    In the context of the Hart–Fuller debate, this part is "a debate within a debate", which offers insights about the
    nature of legal rules, legal interpretation, and legal language.


    - Fuller's example: "It shall be a misdemeanor, punishable by a fine of five dollars, to sleep in any railway
    station." Is it really possible to interpret a word in a statute without knowing the aim of the statute?

    - Are Hart and Fuller disagreeing about the concept of law, or about what judges do/should do when they interpret
    and apply the law?


    The lecture: Fuller pushes back against Hart's core and penumbra. Veterans want to bring a truck into the park as
    part of a war monument: clearly a vehicle, but we can only identify the exception if we understand the purpose of
    the rule. In the railway station, a tired commuter who nods off waiting for the train seems to sleep, while a
    homeless person preparing a place for the night is technically not yet sleeping.


    ## Frederick Schauer (1946–2024)


    Frank Stanton Professor of the First Amendment, Harvard University (1990–2008); David and Mary Harrison
    Distinguished Professor of Law, University of Virginia (2008–2024). *Free Speech: A Philosophical Enquiry* (1982);
    *Playing By the Rules* (1991); 'A Critical Guide to Vehicles in the Park' (2008) 83(4) *New York University Law
    Review* 1109; *Thinking Like a Lawyer* (2009); *The Force of Law* (2015); *The Proof* (2022). He spent most of his
    career on legal rules and legal reasoning (and wrote the week 2 reading on Austin).


    ## Schauer, *Thinking Like a Lawyer* (2009)


    - Do lawyers (and judges) think, reason, and argue differently from ordinary people?

    - Are there any "techniques of reasoning" that are characteristic of legal decision-making?

    - Scepticism about legal reasoning (eg American legal realism).

    - Teaching the law: legal rules (and principles, doctrines, etc); the skills of lawyering; and legal reasoning.


    Perhaps, if we can identify "methods of reasoning that are found everywhere but that are particularly concentrated
    and dominant in legal argument and decision-making, then the claim that there is something called legal reasoning
    will turn out to be justified." (p 8) For Schauer, the specificity of legal reasoning is due to the concentration of
    certain types of arguments, not to their being different in kind.


    ## Schauer on legal reasoning and the Rule of Law


    - Legal reasoning and the inherent generality of law (generality is one of Fuller's principles of legality).

    - "It is important to understand that the belief that there is a moderately distinct form of reasoning we call
    "legal reasoning" is in the final analysis an empirical claim." (p 11)

    - "In a society governed by the wise and the good, legal reasoning is likely simply to get in the way. And in such a
    society, were such a society ever to exist, the Rule of Law would be at least superfluous, and quite possible
    pernicious." (ibid)


    ## The case of the Speluncean Explorers


    Lon Fuller, 'The Case of the Speluncean Explorers' (1949) 62(4) *Harvard Law Review* 619 — an imaginary case before
    the Supreme Court of Newgarth.


    - Early May 4299: the four defendants, in the company of Roger Whetmore (all members of the Speluncean Society),
    remain trapped in a limestone cave due to a landslide.

    - They are rescued after 32 days. It is then discovered that on day 23 Roger Whetmore was killed and eaten by his
    companions.

    - The defendants are found guilty of murdering Roger Whetmore.

    - "The judge then sentenced them to be hanged, the law of our Commonwealth permitting him no discretion with respect
    to the penalty to be imposed."


    :::statute

    N.C.S.A. (N.s.) § 12-A: "Whoever shall willfully take the life of another shall be punished by death."

    :::


    ## Five options


    1. Section 12-A should be applied regardless of the results (Truepenny CJ).

    2. The law should not be applied (Foster J, first argument).

    3. The law should be applied, but in the light of its purpose (Foster J, second argument).

    4. The decision is too hard, and judges should withdraw from the case (Tatting J).

    5. Judges should use common sense and take into account what the public thinks (Handy J).


    Keen J also applies the statute, but on a different ground: its plain meaning, grounded in the separation of powers.
    The positions are interesting up to a point; what matters is the arguments each imaginary judge uses to support
    them.


    ## Chief Justice Truepenny


    "This statute permits of no exception applicable to this case, however our sympathies may incline us to make
    allowance for the tragic situation in which these men found themselves." (p 619) Executive clemency is to mitigate
    the rigours of the law: "If this is done, then justice will be accomplished without impairing either the letter or
    spirit of our statutes and without offering any encouragement for the disregard of law." (ibid) The position forces
    us to think about the role of the judiciary vis-à-vis other institutions, and the interplay between rules and
    institutions.


    ## Justice Foster


    "I believe something more is on trial in this case than the fate of these unfortunate explorers; that is the law of
    our Commonwealth. […] For us to assert that the law we uphold and expound compels us to a conclusion we are ashamed
    of […] seems to me to amount to an admission that the law of this Commonwealth no longer pretends to incorporate
    justice." (p 620) Foster believes that the law declares the defendants to be innocent of any crime, on the basis of
    two independent arguments (either of which is sufficient to justify the acquittal). He is not saying moral reasons
    defeat the law; he is saying what the law really requires (compare Dworkin's reading of *Riggs v Palmer*).


    **First argument.** Enacted/positive law of the Commonwealth (including all its statutes and precedents) is not
    applicable to this case. Positive law is predicated on the possibility of a human society. *Cessante ratione legis,
    cessat et ipsa lex* (when the reason for a law ceases, the law itself ceases). All branches of law "are directed
    toward facilitating and improving men's coexistence and regulating with fairness and equity the relations of their
    life in common" (p 621). State of civil society vs state of nature (a long history in social contract thought, back
    to Hobbes's *Leviathan*).


    **Agreement, law, and society.** *Ubi societas, ibi ius* (wherever there is society, there is law). Legal powers
    find their moral justification in an agreement/social contract. "If it was proper that these ten lives should be
    sacrificed to save the lives of five imprisoned explorers, why then are we told it was wrong for these explorers to
    carry out an arrangement which would save four lives at the cost of one?" (p 623)


    **Second argument.** Assume our positive law can be applied. "…a man may break the letter of the law without
    breaking the law itself. Every proposition of positive law, whether contained in a statute or a judicial precedent,
    is to be interpreted reasonably, in the light of its evident purpose." (p 624) Analogy: killing in self-defence is
    excused. The argument "raises no question of fidelity to enacted law, though it may possibly raise a question of the
    distinction between intelligent and unintelligent fidelity" (p 625). Whether this is a self-defence case is beside
    the point: the line of argument identifies an implicit exception to an explicit legal rule.


    ## Justice Tatting


    "I can neither accept his notion that these men were under a code of nature which this Court was bound to apply to
    them, nor can I accept the odious and perverted rules that he would read into that code." (p 628) Against Foster's
    purpose argument: (i) there is more than one purpose; and (ii) there might be a different explanation for the excuse
    of self-defence. Finally, what is the scope of this exception? Tatting J declares his withdrawal from the decision
    of the case (a personal decision rather than a decision of the case).


    ## Justice Keen


    Two questions to put aside, as irrelevant to the discharge of the office of a judge: (1) whether executive clemency
    should be extended if the conviction is affirmed; (2) whether what the defendants did was "right" or "wrong",
    "wicked" or "good". "The sole question before us for decision is whether these defendants did, within the meaning of
    N.C.S.A. (N.s.) § 12-A, willfully take the life of Roger Whetmore." (p 632)


    **Separation of powers.** The principle of the supremacy of the legislative branch: "From that principle flows the
    obligation of the judiciary to enforce faithfully the written law, and to interpret that law in accordance with its
    plain meaning without reference to our personal desires or our individual conceptions of justice." (p 633) If we do
    not know the purpose of § 12-A, how can we possibly say there is a "gap" in it? "As in dealing with the statute, so
    in dealing with the exception, the question is not the conjectural purpose of the rule, but its scope." (p 636)


    ## Justice Handy


    "We have heard this afternoon learned disquisitions on the distinction between positive law and the law of nature,
    the language of the statute and the purpose of the statute, judicial functions and executive functions, judicial
    legislation and legislative legislation." (p 637) The problem before us is a question of practical wisdom. A few
    basic rules of the game aside, "…I believe that all government officials, including judges, will do their jobs best
    if they treat forms and abstract concepts as instruments." Common sense, public opinion, executive clemency, and
    gossip. The lecture: the personification of legal realism.


    ## Fuller's Postscript


    "The case was constructed for the sole purpose of bringing into a common focus certain divergent philosophies of law
    and government. These philosophies presented men with live questions of choice in the days of Plato and Aristotle.
    Perhaps they will continue to do so when our era has had its say about them. If there is any element of prediction
    in the case, it does not go beyond a suggestion that the questions involved are among the permanent problems of the
    human race." (p 645)


    :::examtip

    Reading the judgments is a revision exercise: you should recognise in them most of the theories of law from the
    first part of the unit. Link each technical question of statutory interpretation to the broader question it answers
    (what is the point of this statute, of our law, of the judicial office?).

    :::


    ## The convergence of rules and standards


    - Schauer suggests that "the choice between rules and standards, between specific and vague directives, may not make
    nearly as much of a difference as is ordinarily assumed." (p 305)

    - He challenges the "conventional wisdom" in light of the convergence hypothesis: the avoidance of rules; the
    concretization of standards.

    - "…it may be that the tool of regulatory specificity as a way of managing discretion is less a part of the toolbox
    of regulatory strategy and institutional design than has historically been thought to be the case…" (319)


    The lecture: Schauer treats rules and standards (or principles) as the extremes of a continuous spectrum of
    'ruleness'. The difference is a matter of degree. The conventional wisdom: a rule maker manages discretion by
    choosing specific rules (little discretion) or general principles such as 'drive carefully' (more discretion).
    Schauer's argument is not that there is no real distinction; it is that, assuming they are different, users push
    standards towards rules and rules towards standards over time. Interpreters avoid rules (eg by identifying
    exceptions) and make standards concrete (by creating more specific rules to apply them). He argues first that
    convergence is possible, then that it is true.


    ## Rules and exceptions


    "'Either rules are what they would be in the formalist's heaven and they bind as fetters bind; or there are no
    rules, only predictable decisions or patterns of behaviour.' [a quotation from Llewellyn's *The Bramble Bush*] Yet
    surely this is a false dilemma. We promise to visit a friend the next day. When the day comes it turns out that
    keeping the promise would involve neglecting someone dangerously ill. […] It does not follow from the fact that such
    rules have exceptions incapable of exhaustive statement, that in every situation we are left to our discretion and
    are never bound to keep a promise. A rule that ends with the word 'unless…' is still a rule." (H.L.A. Hart, *The
    Concept of Law*, 3rd ed, 139)


    ## Legal defeasibility


    :::definition

    A rule is **defeasible** if capable of being defeated: a certain conclusion is justified if certain criteria are
    met; however, that conclusion can be "defeated" if further criteria are met.

    :::


    Reflect on the following questions:


    - Is defeasibility a necessary consequence of the nature of language, or the nature of rules, or the nature of law?

    - What is the relationship between legal defeasibility and the Rule of Law?

    - What is the relationship between legal defeasibility and legal indeterminacy?


    The lecture's everyday example: a sign says 'dogs not allowed'; sometimes it adds 'except service dogs' (an explicit
    exception); sometimes nothing, but people still identify implicit exceptions. If we keep finding exceptions we carve
    out a bigger and bigger space not captured by the rule: one way of understanding exceptions is as limiting the scope
    of the rule. Certainty is one of the values of the Rule of Law, so defeasibility raises normative questions, which
    in turn force us to think about judicial discretion.


    :::case

    *Church of the Holy Trinity v United States*, 143 U.S. 457 (1892) — the 1885 Alien Contract Labour Law prohibited
    "the importation and migration of foreigners and aliens under contract or agreement to perform labor or service of
    any kind in the United States"; the Church of the Holy Trinity, New York, had an employment contract with an English
    Anglican priest. The US Supreme Court held that a minister was not a foreign laborer under the statute (even though
    he was a foreigner): an implicit exception to a clear statutory rule.

    :::


    *Riggs v Palmer* has a very similar structure: a valid statute with clear language, and judges who can be read as
    identifying an implicit exception: valid will if facts A, B, C, unless the beneficiary murdered the testator.


    ## Judicial discretion


    According to Hart, legal theory has either ignored or exaggerated the indeterminacies of legal rules.


    "…all systems […] compromise between two social needs: the need for certain rules which can, over great areas of
    conduct, safely be applied by private individuals to themselves without fresh official guidance or weighing up of
    social issues, and the need to leave open, for later settlement by an informed, official choice, issues which can
    only be properly appreciated and settled when they arise in a concrete case." (CL 130)


    "Formalism and rule-scepticism are the Scylla and Charybdis of juristic theory; they are great exaggerations,
    salutary where they correct each other, and the truth lies between them" (CL 147).


    ## Judicial discretion — Hart's Postscript


    "The sharpest direct conflict between the legal theory of this book and Dworkin's theory arises from my contention
    that in any legal system there will always be certain legally unregulated cases in which on some point no decision
    either way is dictated by the law and the law is accordingly partly indeterminate or incomplete." (CL 272)


    For Dworkin, this picture of the law is a misleading account of both law and judicial reasoning. Dworkin's
    interpretive legal theory includes explicit settled law and implicit legal principles. Hence, the judge never steps
    outside the law, making new law.


    ## Hart on judicial law-making powers


    - There are cases left partly unregulated by the law (ie hard cases).

    - In these cases, judges decide by exercising law-making powers.

    - However, for Hart, judicial law-making powers are different from the law-making powers enjoyed by the legislator:
      - a judge's power is subject to many constraints that narrow their choice (eg judges cannot introduce large scale reforms or new codes);
      - judges exercise interstitial powers;
      - judicial power is not arbitrary power: judges must always justify their decisions in light of some general reasons and must act as a conscientious legislator.

    ## Hart on Dworkin's three main criticisms


    | Dworkin's criticism | Hart's reply |

    | --- | --- |

    | 1. Hart's view on judicial discretion is a false description of the judicial process: this is not what judges do
    in hard cases | In hard cases "judges do not just push away their law books"; even Dworkin's theory of adjudication
    incorporates choices |

    | 2. Judicial discretion is undemocratic (judges are not elected) | It's a necessary, small price to pay (provided
    that judicial power is limited); delegation of limited legislative powers to the executive is a familiar feature of
    modern democracies |

    | 3. Judicial law-making is unjust, because it is a form of retrospective legislation | In hard cases, by
    definition, there is no state of clear established law to justify expectations |


    The first criticism is descriptive; the second and third are normative. The lecture on the third reply: if the one
    right answer is so hard to find that nobody apart from Hercules knows it, you are in the same position Dworkin
    criticises: you do not know your rights and duties until a judge tells you.


    ## What have we learned so far?


    - Keep your conceptual toolbox in order.

    - Different questions for different problems.

    - The research essay provides a great opportunity to do some independent research and to join the conversation
    (Curiosity, Charity, Clarity).

    - When revising the first part of the unit, consider how specific claims relate to general theories of law (zoom in
    / zoom out).

    - Go back to week 1: consider how ideas inspired by Austin's theory of law were used in the Gove land rights case —
    *Milirrpum v Nabalco Pty Ltd* [1971] 17 FLR 141 — and read John Gardner on 'Why study jurisprudence?'.


    ## Hart on the nature of legal theory


    "My aim in this book was to provide a theory of what law is which is both general and descriptive." (CL 239) General
    in the sense that it is not tied to any particular legal system or legal culture; descriptive in that it is morally
    neutral and has no justificatory aims. The book "makes repeated use of a number of concepts such as duty-imposing
    rules, power-conferring rules, rules of recognition, rules of change, acceptance of rules, internal and external
    points of view, internal and external statements, and legal validity" (CL 240).


    ## The difference law makes


    "[L]egal studies are really attractive and worthwhile because law, and juristic argumentation, is an arena where
    themes and theses in ethics, political theory, and related philosophical domains all come to bear on – and
    crystallize out in – legislating and adjudicating to make a difference to human persons." (John Finnis, *Philosophy
    of Law: Collected Essays Volume IV*, OUP, 2011)


    ## Some further questions…


    According to Finnis, natural law theory seeks both to give an account of the facticity of law and to answer
    questions that remain central to understanding law. As listed by Green and Adams 2019 (having observed that "No
    legal philosopher can be only a legal positivist"), these further questions (which "legal positivism does not aspire
    to answer") are:


    - What kinds of things could possibly count as the merits of law?

    - What role should law play in adjudication? (a question about legal reasoning)

    - What claim has law on our obedience? (the end of the unit)

    - What laws should we have? (the moral limits of law, in a few weeks)

    - And should we have law at all?
