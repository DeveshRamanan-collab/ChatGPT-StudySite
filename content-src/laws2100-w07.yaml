      Main types of (legal) rules:


      - **Mandatory**: impose a duty to act ('X must do Y').

      - **Prohibitive**: impose a duty not to act ('X must not do Y').

      - **Permissive**: grant a liberty/option ('X may do Y').

      - **Power-conferring**: confer legal power to create/change/extinguish legal relations (making a will, passing
      legislation).

      - **Constitutive**: create the activity/institution itself (contracts, marriage, corporations; outside law, a goal
      in football).


      None of these is unique to law: we reason by analogy and precedent in sport and daily life. Some (analogical
      reasoning, precedent) are particularly important in law. Hart's duty-imposing/power-conferring distinction
      (chapter 3, against Austin) is the background: an invalid will is a nullity, not a punishment.


      Exam use: name the type of reasoning or rule a judge is using before assessing the argument.
