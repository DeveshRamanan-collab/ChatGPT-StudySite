  - key: d20
    type: short
    concept: speluncean-explorers-five-options
    difficulty: 3
    prompt: >-
      Which judgment in The Case of the Speluncean Explorers best captures what judges should do when a clear statute
      produces an unjust result? Argue for one, and answer the strongest rival.
    model: >-
      Thesis: Foster J's second argument is the most defensible: read the statute in light of its evident purpose.
      Argument: it assumes positive law applies, so it raises "no question of fidelity to enacted law", only of
      "intelligent and unintelligent fidelity" (p 625). Like the self-defence excuse, it identifies an implicit
      exception to an explicit rule, a move courts make in real cases. It avoids Truepenny CJ's reliance on executive
      clemency and Foster J's first argument about a state of nature, which Tatting J rejects as "odious and perverted
      rules". Counterargument: Keen J says legislative supremacy obliges judges to apply plain meaning "without
      reference to our personal desires or our individual conceptions of justice" (p 633); if we do not know the purpose
      of § 12-A, how can we find a gap? Tatting J adds that there is more than one purpose. Evaluation: Keen J's
      objection is strong where purpose is conjectural, but plain meaning also rests on a political view of the
      separation of powers; the choice between them is Fuller's "live question of choice".
    rubric:
      - id: r1
        criterion: Thesis — chooses one judgment and states why in the first sentence.
        marks: 2
        top-band: Commits to one judge and names the decisive feature (eg purpose, fidelity, legislative supremacy).
        margin-note: Which judge? Say so up front.
        authorities: []
      - id: r2
        criterion: Argument — reconstructs the chosen judgment with its key reasons and quotations.
        marks: 3
        top-band: Uses the judge's own terms (intelligent fidelity; self-defence analogy; or supremacy, scope).
        margin-note: Good close reading.
        authorities:
          - fuller-the-case-of-the-speluncean-explorers
      - id: r3
        criterion: Counterargument — presents the strongest rival judgment fairly.
        marks: 3
        top-band: Picks the true strongest rival (Keen J against Foster J, or vice versa) and gives its best form.
        margin-note: Is this really the strongest objection?
        authorities: []
      - id: r4
        criterion: Evaluation — weighs the two and links them to theories of law and of the judicial office.
        marks: 2
        top-band: Connects the choice to the separation of powers and to Fuller's "live questions of choice".
        margin-note: 'Zoom out to the theory: well done.'
        authorities: []
  - key: e01
    type: mcq
    concept: rules-standards-and-defeasibility
    difficulty: 2
    set: pretest
    stem: What is the "conventional wisdom" that Schauer challenges in his article on rules and standards?
    options:
      - text: That rules and standards are the same thing under two names, so the choice is merely verbal.
        why: >-
          Schauer assumes rules and standards are different; his target is the belief that choosing between them manages
          discretion well.
      - text: That choosing specific rules or vague standards is an effective way for a rule maker to manage discretion.
        correct: true
        why: >-
          Right: the conventional wisdom is that specific rules leave little discretion and vague standards leave more,
          so the choice is a tool for managing discretion.
      - text: >-
          That judges always prefer vague standards, because standards give them the most power over outcomes in
          practice.
        why: >-
          Nothing on the slide concerns judges' preferences; the conventional wisdom is about the rule maker's choice as
          a tool for managing discretion.
      - text: That standards are always superior to rules, because they can adapt to the facts of each new case.
        why: >-
          The conventional wisdom is not a ranking of standards over rules; it is the claim that the choice makes a
          difference to discretion.
  - key: e02
    type: mcq
    concept: rules-standards-and-defeasibility
    difficulty: 2
    stem: What does Schauer's convergence hypothesis claim?
    options:
      - text: That rules and standards were once different but have now become identical in every legal system.
        why: >-
          Schauer describes a tendency over time, not a completed identity; he treats the difference as a matter of
          degree on a spectrum.
      - text: That legislators should replace all standards with rules, to reduce the discretion of judges.
        why: >-
          This is a policy proposal that relies on the conventional wisdom, which Schauer challenges; his hypothesis is
          descriptive.
      - text: That in use, rules are pushed towards standards and standards towards rules over time.
        correct: true
        why: >-
          Right: the lecture says users push standards towards the rules and rules towards the standards, through the
          avoidance of rules and the concretization of standards.
      - text: That standards always collapse into moral principles, so the judge decides by morality in the end.
        why: >-
          Schauer's standards become more rule-like as they are made concrete; nothing on the slide says they collapse
          into morality.
  - key: e03
    type: mcq
    concept: rules-standards-and-defeasibility
    difficulty: 2
    stem: On the slide, which two mechanisms drive the convergence of rules and standards?
    options:
      - text: Codification of rules, and repeal of standards
        why: >-
          Neither codification nor repeal is on the slide; both mechanisms are things interpreters do when they use
          norms.
      - text: The avoidance of rules, and the concretization of standards
        correct: true
        why: >-
          Right: the slide lists "The avoidance of rules" and "The concretization of standards" as the two sides of the
          convergence hypothesis.
      - text: The balancing of principles, and the weighing of social policies
        why: >-
          Balancing and weighing are Dworkin's vocabulary for principles and policies (week 5), not Schauer's two
          mechanisms.
  - key: e04
    type: mcq
    concept: rules-standards-and-defeasibility
    difficulty: 3
    stem: >-
      Over years of cases, courts create more and more exceptions to a strict rule. On Schauer's account, what happens
      to the rule?
    options:
      - text: It becomes stricter, because each exception confirms the rule for all of the remaining cases.
        why: >-
          Schauer argues the opposite direction: the more exceptions, the less strict and more standard-like the rule
          becomes.
      - text: It becomes less strict and more standard-like, moving towards the middle of the spectrum.
        correct: true
        why: >-
          Right: identifying exceptions is one way interpreters avoid rules; the rule becomes more general and less
          precise, pushed towards standards.
      - text: It stops being a rule at all after the first exception, as Llewellyn claimed it would.
        why: >-
          Hart rejects this dilemma ("a rule that ends with the word unless… is still a rule"), and Schauer describes a
          matter of degree.
      - text: It becomes a constitutive rule, because the exceptions now define the activity itself.
        why: Constitutive rules create institutions; exceptions change a rule's scope and strictness, not its type.
  - key: e05
    type: mcq
    concept: rules-standards-and-defeasibility
    difficulty: 3
    variant-of: e04
    stem: >-
      Parliament replaces "drive carefully" with nothing more. Over time, courts decide that exceeding 20 km/h near a
      school is always careless. What is this on Schauer's account?
    options:
      - text: The avoidance of rules, since courts refuse to apply the standard as written.
        why: >-
          Avoidance of rules is when interpreters escape the strictness of a specific rule; here a vague standard is
          being made concrete.
      - text: Legal defeasibility, since a further criterion defeats the standard.
        why: >-
          Defeasibility concerns exceptions defeating a conclusion a rule would justify; here courts are adding
          specificity to a vague standard.
      - text: The concretization of a standard, pushing it towards a rule.
        correct: true
        why: >-
          Right: standards cannot be applied straightforwardly, so interpreters create more specific rules to apply
          them; this pushes the standard towards the rule end.
      - text: Reasoning by principle, since courts balance safety against liberty.
        why: >-
          Some balancing may lie behind it, but the effect Schauer names is concretization: a specific rule emerging
          from a standard.
  - key: e06
    type: mcq
    concept: rules-standards-and-defeasibility
    difficulty: 2
    stem: How does the lecture present Schauer's picture of rules and standards?
    options:
      - text: As two sharply separate kinds of norm with nothing in between
        why: Schauer places them at the ends of a continuous spectrum, so there is a great deal in between.
      - text: As the extremes of a continuous spectrum of "ruleness", a matter of degree
        correct: true
        why: >-
          Right: the lecture says Schauer imagines a continuous spectrum of ruleness, with specific rules at one extreme
          and vague standards at the other.
      - text: As identical norms described from two different points of view
        why: Schauer does not say they are identical; he says the difference should be understood as a matter of degree.
  - key: e07
    type: mcq
    concept: rules-standards-and-defeasibility
    difficulty: 3
    stem: Which argument against the conventional wisdom does the lecture say is NOT Schauer's argument?
    options:
      - text: That, over time, users push rules towards standards by finding exceptions to them.
        why: This is part of Schauer's own argument (the avoidance of rules), so it is not the answer.
      - text: That there is no real distinction between rules and principles, so the choice cannot matter.
        correct: true
        why: >-
          Right: the lecture says one could argue there is no real distinction, but "Schauer's argument is different":
          assuming they differ, use makes them converge.
      - text: That interpreters make standards more concrete by creating more specific rules to apply.
        why: This is also Schauer's own argument (the concretization of standards), so it is not the answer.
      - text: That regulatory specificity is less useful for managing discretion than has historically been thought.
        why: This is Schauer's conclusion (p 319 on the slide), so it is not the answer.
  - key: e08
    type: mcq
    concept: rules-standards-and-defeasibility
    difficulty: 2
    stem: Hart's "A rule that ends with the word 'unless…' is still a rule" answers which dilemma?
    options:
      - text: Between rules and principles, as Dworkin framed it
        why: >-
          Dworkin's distinction is a different debate; the quoted passage answers Llewellyn's dilemma from The Bramble
          Bush.
      - text: Between the core and the penumbra of a word's meaning
        why: >-
          Core and penumbra are Hart's own terms from chapter 7; the passage rejects a dilemma posed by Llewellyn, not
          by Hart.
      - text: Between the formalist's heaven, where rules bind as fetters, and no rules at all
        correct: true
        why: >-
          Right: Llewellyn says either rules bind as fetters bind in the formalist's heaven, or there are only
          predictable decisions; Hart calls this a false dilemma.
      - text: Between positive law and the law of nature, as Foster J framed it in Fuller's case
        why: >-
          Positive law versus the law of nature is Foster J's first argument in Fuller's case, not the dilemma Hart
          answers here.
  - key: e09
    type: mcq
    concept: rules-standards-and-defeasibility
    difficulty: 2
    stem: >-
      In Hart's promise example, why does visiting a sick person instead of a friend not show there is no rule about
      keeping promises?
    options:
      - text: Because the rule about promises is moral, not legal, so exceptions do not matter to jurisprudence.
        why: Hart uses the moral example to make a general point about rules; it matters for legal rules too.
      - text: Because a rule can have exceptions incapable of exhaustive statement and still bind in other cases.
        correct: true
        why: >-
          Right: Hart says it does not follow from exceptions incapable of exhaustive statement that we are left to our
          discretion and never bound to keep a promise.
      - text: Because the promisor can always obtain the friend's consent before the visit is cancelled.
        why: >-
          Consent plays no part in Hart's example; the neglect of someone dangerously ill is simply accepted as an
          adequate reason.
      - text: Because breaking a promise is always wrong, so the example shows the rule was broken, not excepted.
        why: Hart says the reason is accepted as adequate; the promise is not wrongly broken but subject to an exception.
  - key: e10
    type: mcq
    concept: rules-standards-and-defeasibility
    difficulty: 1
    stem: What does it mean for a rule to be "defeasible", according to the slide?
    options:
      - text: That it can be repealed by the legislature at any time.
        why: Repeal ends a rule; defeasibility is about a conclusion being defeated in a case while the rule remains.
      - text: That a conclusion justified by certain criteria can be defeated if further criteria are met.
        correct: true
        why: >-
          Right: a rule is defeasible if capable of being defeated: a conclusion is justified if certain criteria are
          met, but it can be "defeated" if further criteria are met.
      - text: That it has no application to cases the legislator never foresaw.
        why: >-
          Unforeseen cases may prompt exceptions, but the definition concerns further criteria defeating a justified
          conclusion, not non-application.
      - text: That it is invalid, because it conflicts with a higher moral principle that judges must apply first.
        why: >-
          Defeasibility does not touch validity; a defeasible rule is valid law whose conclusion can be defeated in some
          cases.
  - key: e11
    type: mcq
    concept: rules-standards-and-defeasibility
    difficulty: 2
    cases:
      - church-of-the-holy-trinity-v-united-states
    stem: In Church of the Holy Trinity v United States (1892), what did the US Supreme Court hold?
    options:
      - text: That the church's contract was void, because it broke the plain words of the 1885 Alien Contract Labour Law.
        why: 'That is what the plain words would suggest, which is why the case is interesting: the Court held the opposite.'
      - text: That a minister was not a foreign laborer under the statute, even though he was a foreigner.
        correct: true
        why: >-
          Right: the slide says the Court held that a minister was not a foreign laborer under the statute, an implicit
          exception to a clear provision.
      - text: That the statute was unconstitutional, because it interfered with the freedom of religion.
        why: The slide records no constitutional ruling; the Court read the statute as not covering the minister.
      - text: That the statute applied, but the executive should pardon the church for its breach.
        why: >-
          Pardon is Truepenny CJ's route in Fuller's imaginary case; in Holy Trinity the Court held the statute did not
          reach the minister.
  - key: e12
    type: mcq
    concept: rules-standards-and-defeasibility
    difficulty: 3
    cases:
      - church-of-the-holy-trinity-v-united-states
      - riggs-v-palmer
    contrasts-with:
      - laws2100-w05-discretion-riggs-and-obligation
    stem: Why does the lecture pair Church of the Holy Trinity with Riggs v Palmer?
    options:
      - text: Both are cases where the statute was ambiguous, so the court had to choose a meaning.
        why: >-
          The lecture stresses the opposite: in both, the statutory language is very clear and nobody disputes it is
          valid law.
      - text: Both are imaginary cases constructed to teach students statutory interpretation.
        why: The lecture says both are real cases; it is the Speluncean Explorers that is imaginary.
      - text: Both apply a clear, valid statute subject to an implicit exception the court identifies.
        correct: true
        why: >-
          Right: the lecture says Riggs has a structure very similar to Holy Trinity: clear, valid statute; implicit
          exception (valid will… unless the beneficiary murdered the testator).
      - text: Both are cases where the court applied the plain words and left reform to the legislature.
        why: Neither court applied the plain words; each read in an exception the text does not state.
  - key: e13
    type: mcq
    concept: rules-standards-and-defeasibility
    difficulty: 3
    variant-of: e11
    stem: >-
      A restaurant sign says "dogs not allowed" and nothing else. Staff let in a guide dog. On the lecture's analysis,
      what has happened?
    options:
      - text: The staff have repealed the rule, because a rule with an exception is no longer a rule at all.
        why: 'Hart rejects this: a rule that ends with "unless…" is still a rule; one exception does not abolish it.'
      - text: The staff have applied an explicit exception that was written on the sign in smaller print.
        why: >-
          The facts say the sign has nothing else on it; the lecture contrasts this with the sign that adds "except
          service dogs".
      - text: The staff have identified an implicit exception to an explicit rule.
        correct: true
        why: >-
          Right: the lecture says sometimes there is only the clear rule, yet people identify implicit exceptions; the
          question is what reasoning and factors justify them.
      - text: The staff have applied the rule as written, since a guide dog is not really a dog.
        why: >-
          A guide dog is clearly a dog, as the priest was clearly a foreigner; the move is an exception, not a
          redefinition.
  - key: e14
    type: mcq
    concept: rules-standards-and-defeasibility
    difficulty: 4
    stem: Which question about defeasibility links it to the Rule of Law in the lecture?
    options:
      - text: Whether defeasibility makes rules easier to apply, and so improves the efficiency of the courts and tribunals.
        why: Efficiency is not the lecture's concern here; the link to the Rule of Law runs through certainty.
      - text: Whether defeasibility shows that legal rules are commands backed by threats of sanction.
        why: The command theory is Austin's (week 2); defeasibility bears on certainty, not on coercion.
      - text: Whether identifying ever more exceptions threatens certainty, one of the values of the Rule of Law.
        correct: true
        why: >-
          Right: the lecture says if you keep identifying exceptions the rule's content is certain only up to a point,
          and certainty is one of the values of the Rule of Law.
      - text: Whether defeasibility proves Fuller's principles of legality are merely criteria of efficacy.
        why: The inner morality versus efficiency question is flagged but bracketed; the defeasibility link is certainty.
  - key: e15
    type: mcq
    concept: rules-standards-and-defeasibility
    difficulty: 4
    contrasts-with:
      - hart-and-dworkin-on-judicial-discretion
    stem: >-
      Why does the lecture say the relationship between defeasibility and legal indeterminacy matters for judicial
      discretion?
    options:
      - text: Because defeasible rules can be applied mechanically, so no discretion is ever needed.
        why: Defeasibility introduces further criteria and exceptions, which is the opposite of mechanical application.
      - text: Because for many authors discretion exists because the law is indeterminate, as in Hart's chapter 7.
        correct: true
        why: >-
          Right: the lecture says for many authors discretion exists because the law is indeterminate (gaps, vagueness);
          indeterminacy, therefore discretion, is Hart's chapter 7 picture.
      - text: Because Dworkin accepted that defeasibility produces strong discretion in every hard case.
        why: >-
          Dworkin pushes against strong discretion; the lecture says he rejects the indeterminacy-therefore-discretion
          picture.
      - text: Because indeterminacy only arises from the open texture of language, never from rules.
        why: >-
          Whether defeasibility comes from language, rules or law is one of the lecture's open questions, not a settled
          answer.
  - key: e16
    type: mcq
    concept: rules-standards-and-defeasibility
    difficulty: 3
    stem: Which of the lecture's questions asks whether defeasibility is special to law?
    options:
      - text: What is the relationship between legal defeasibility and the Rule of Law?
        why: This asks about certainty and the values of legality, not whether defeasibility is special to law.
      - text: What is the relationship between legal defeasibility and legal indeterminacy?
        why: >-
          This asks about gaps and vagueness in law as grounds of discretion, not whether defeasibility is peculiar to
          law.
      - text: Is defeasibility a necessary consequence of the nature of language, or of rules, or of law?
        correct: true
        why: >-
          Right: the lecture says this is another way of asking the day's first question, whether legal reasoning is
          different from other types of reasoning.
      - text: Is defeasibility compatible with Dworkin's claim that there is one right answer even in hard cases?
        why: >-
          The lecture does not pose this as one of its defeasibility questions; and compatibility with Dworkin is not
          the same as asking whether defeasibility is special to law.
  - key: e17
    type: truefalse
    concept: rules-standards-and-defeasibility
    difficulty: 1
    set: quickfire
    statement: >-
      Schauer suggests the choice between rules and standards may not make nearly as much of a difference as is
      ordinarily assumed.
    answer: true
    why: >-
      True: the slide quotes Schauer: "the choice between rules and standards, between specific and vague directives,
      may not make nearly as much of a difference as is ordinarily assumed" (p 305).
  - key: e18
    type: truefalse
    concept: rules-standards-and-defeasibility
    difficulty: 2
    set: quickfire
    statement: >-
      In Church of the Holy Trinity, the Court applied an exception for ministers that was written into the 1885
      statute.
    answer: false
    why: >-
      False: the exception was not explicit in the statute; the Court identified an implicit exception to a provision
      covering "labor or service of any kind".
  - key: e19
    type: truefalse
    concept: rules-standards-and-defeasibility
    difficulty: 2
    set: quickfire
    statement: Hart says that a rule ending with the word "unless…" is still a rule.
    answer: true
    why: >-
      True: Hart (CL 139) says rules may have exceptions incapable of exhaustive statement, and "A rule that ends with
      the word 'unless…' is still a rule."
  - key: e20
    type: short
    concept: rules-standards-and-defeasibility
    difficulty: 3
    cases:
      - church-of-the-holy-trinity-v-united-states
    prompt: >-
      "If judges can always find implicit exceptions, legal rules do not really bind." Discuss with reference to Hart,
      Schauer and Church of the Holy Trinity v United States.
    model: >-
      Thesis: implicit exceptions weaken but do not dissolve the binding force of rules; the claim repeats a dilemma
      Hart calls false. Argument: in Holy Trinity a statute banned importing aliens under contract to perform "labor or
      service of any kind", yet the Court held a minister was not a foreign laborer: an implicit exception. Riggs v
      Palmer can be read the same way. Schauer's convergence hypothesis explains the trend: by identifying exceptions
      interpreters avoid rules and push them towards standards, so specificity manages discretion less than assumed.
      Counterargument: Hart rejects Llewellyn's choice between rules that "bind as fetters bind" and no rules at all.
      Exceptions "incapable of exhaustive statement" do not leave us always to our discretion; "a rule that ends with
      the word 'unless…' is still a rule" (CL 139). A defeasible rule still justifies its conclusion unless further
      criteria are met. Evaluation: the real question is degree: a few exceptions leave the rule intact, but a growing
      carve-out threatens certainty, a value of the Rule of Law. So the claim holds only at the limit.
    rubric:
      - id: r1
        criterion: Thesis — takes a qualified position on whether implicit exceptions dissolve binding force.
        marks: 2
        top-band: Frames the claim as a matter of degree and says so at the start.
        margin-note: 'Degree, not kind: good.'
        authorities: []
      - id: r2
        criterion: Argument — uses Holy Trinity (and Riggs) and Schauer's avoidance of rules accurately.
        marks: 3
        top-band: States the statute's words and the holding, and ties them to convergence.
        margin-note: Accurate on the case.
        authorities:
          - schauer-the-convergence-of-rules-and-standards
      - id: r3
        criterion: Counterargument — Hart's false dilemma and the "unless" point.
        marks: 3
        top-band: Quotes CL 139 and explains exceptions incapable of exhaustive statement.
        margin-note: Hart's own words would sharpen this.
        authorities:
          - hart-the-concept-of-law
      - id: r4
        criterion: Evaluation — links the degree question to certainty and the Rule of Law.
        marks: 2
        top-band: Concludes when a carve-out becomes a threat to certainty.
        margin-note: Nice link to legality.
        authorities: []
  - key: f01
    type: mcq
    concept: hart-and-dworkin-on-judicial-discretion
    difficulty: 2
    stem: Hart calls formalism and rule-scepticism "the Scylla and Charybdis of juristic theory". What does he conclude?
    options:
      - text: They are great exaggerations, salutary where they correct each other, and the truth lies between them.
        correct: true
        why: >-
          Right: "they are great exaggerations, salutary where they correct each other, and the truth lies between them"
          (CL 147).
      - text: Formalism is correct for easy cases and rule-scepticism is correct for every hard case that reaches court.
        why: >-
          Tempting as a compromise, but Hart does not divide the field this way; he says both are exaggerations and the
          truth lies between.
      - text: Rule-scepticism is right, because rules never determine outcomes in the cases that come before courts.
        why: >-
          Hart rejects rule-scepticism as an exaggeration, just as he rejects formalism; he does not side with the
          realists.
      - text: Formalism is right, because judges merely discover and apply the law that is already there in every case.
        why: >-
          The lecture says for Hart formalists are wrong when they deny discretion; formalism is one of the two
          exaggerations.
  - key: f02
    type: mcq
    concept: hart-and-dworkin-on-judicial-discretion
    difficulty: 2
    stem: According to Hart (CL 130), all legal systems compromise between which two social needs?
    options:
      - text: The need for democratic legislation, and the need for judges who are independent of the government.
        why: Democracy and independence are themes of Dworkin's criticisms, not the two needs Hart names at CL 130.
      - text: >-
          Rules individuals can safely apply to themselves, and leaving issues open for informed official choice in
          concrete cases.
        correct: true
        why: >-
          Right: the need for rules applied by private individuals without fresh official guidance, and the need to
          leave open issues that can only be settled when they arise in a concrete case.
      - text: The need for moral principles in adjudication, and the need for rules identified by their pedigree.
        why: >-
          Principles versus pedigree is Dworkin's framing of positivism (week 5); Hart's two needs concern certainty and
          later official choice.
      - text: The need for punishment of wrongdoing, and the need for clemency to mitigate the rigours of the law.
        why: Punishment and clemency are the themes of Truepenny CJ in Fuller's case, not Hart's two social needs.
  - key: f03
    type: mcq
    concept: hart-and-dworkin-on-judicial-discretion
    difficulty: 2
    stem: In the Postscript, what does Hart say is "the sharpest direct conflict" between his theory and Dworkin's?
    options:
      - text: His claim that the rule of recognition is a social rule accepted by officials from the internal point of view.
        why: >-
          The rule of recognition is contested too, but Hart names indeterminacy and unregulated cases as the sharpest
          conflict.
      - text: His contention that there will always be legally unregulated cases in which the law is partly indeterminate.
        correct: true
        why: >-
          Right: "there will always be certain legally unregulated cases in which on some point no decision either way
          is dictated by the law and the law is accordingly partly indeterminate or incomplete" (CL 272).
      - text: His claim that the minimum content of natural law is a natural necessity found in every legal system.
        why: >-
          The minimum content is a week 4 topic; the Postscript's sharpest conflict with Dworkin is about gaps and
          discretion.
  - key: f04
    type: mcq
    concept: hart-and-dworkin-on-judicial-discretion
    difficulty: 2
    contrasts-with:
      - laws2100-w05-law-as-integrity
    stem: How does Dworkin, as presented on the Week 7 slide, reply to Hart's picture of unregulated cases?
    options:
      - text: He accepts it, but insists that judges in hard cases must follow public opinion.
        why: Public opinion is Handy J's method in Fuller's case; Dworkin rejects Hart's picture outright.
      - text: He accepts it, and adds that judges should withdraw from cases the law does not regulate.
        why: Withdrawing is Tatting J's move; Dworkin denies there are cases the law does not regulate in this sense.
      - text: 'He calls it misleading: law includes settled law and implicit principles, so the judge never makes new law.'
        correct: true
        why: >-
          Right: Dworkin's interpretive theory includes explicit settled law and implicit legal principles, so the judge
          never steps outside the law, making new law.
      - text: >-
          He calls it misleading, because judges have strong discretion in every case, easy or hard, that comes before
          them.
        why: Dworkin rejects strong discretion (week 5); saying judges have it everywhere is closer to rule-scepticism.
  - key: f05
    type: mcq
    concept: hart-and-dworkin-on-judicial-discretion
    difficulty: 2
    stem: For Hart, what do judges do in cases left partly unregulated by the law?
    options:
      - text: They apply the law, which always contains a determinate answer if one looks hard enough.
        why: That is Dworkin's view; Hart says in such cases no decision either way is dictated by the law.
      - text: They exercise law-making powers, though different from the legislator's.
        correct: true
        why: >-
          Right: in hard cases judges decide by exercising law-making powers, but for Hart judicial law-making powers
          differ from those enjoyed by the legislator.
      - text: They refer the case to the legislature, which alone may fill a gap in the law.
        why: Hart does not say judges refer cases back; he says they exercise limited, interstitial law-making powers.
      - text: They decide as they please, since no legal standard constrains them in these cases.
        why: >-
          Hart denies judicial power is arbitrary: judges must justify decisions by general reasons and act as a
          conscientious legislator.
  - key: f06
    type: mcq
    concept: hart-and-dworkin-on-judicial-discretion
    difficulty: 3
    stem: Which of these is NOT one of the ways Hart distinguishes judicial law-making from legislative law-making?
    options:
      - text: Judges are subject to many constraints that narrow their choice.
        why: This is on the slide (eg judges cannot introduce large-scale reforms or new codes), so it is not the answer.
      - text: Judges exercise interstitial powers.
        why: 'This is on the slide, so it is not the answer: judicial law-making fills gaps between existing law.'
      - text: Judges are elected, and so share the legislator's democratic legitimacy.
        correct: true
        why: >-
          Right: this is not Hart's point; Dworkin's second criticism is precisely that judges are not elected, and Hart
          replies that the democratic cost is small.
      - text: Judges must justify decisions by general reasons, as a conscientious legislator.
        why: 'This is on the slide, so it is not the answer: judicial power is not arbitrary power.'
  - key: f07
    type: mcq
    concept: hart-and-dworkin-on-judicial-discretion
    difficulty: 1
    stem: What does Hart mean by calling judges' law-making powers "interstitial"?
    options:
      - text: They are exercised only in the highest appellate court.
        why: >-
          The level of court is not the point; interstitial describes the scope of the power, filling gaps in existing
          law.
      - text: They operate in the gaps of existing law, not as large-scale reform.
        correct: true
        why: >-
          Right: the slide sets interstitial powers beside the constraint that judges cannot introduce large-scale
          reforms or new codes; they work in the spaces the law leaves open.
      - text: They are powers delegated to the judges by the executive under a statute.
        why: >-
          Delegation to the executive appears in Hart's reply to the democracy objection, as an analogy, not as the
          meaning of interstitial.
      - text: They are exercised only with the consent of the parties.
        why: >-
          Consent of the parties has nothing to do with it; interstitial refers to the narrow, gap-filling scope of the
          power.
  - key: f08
    type: mcq
    concept: hart-and-dworkin-on-judicial-discretion
    difficulty: 2
    stem: >-
      Dworkin's first criticism of Hart's view of discretion is that it is a false description of the judicial process.
      What is Hart's reply?
    options:
      - text: Judges in hard cases openly admit that they are legislating, so the description is accurate.
        why: >-
          Hart's reply is not about what judges admit; it is that they keep reasoning with law, and that Dworkin's
          theory also involves choices.
      - text: In hard cases "judges do not just push away their law books"; even Dworkin's theory incorporates choices.
        correct: true
        why: >-
          Right: Hart says judges keep working with legal materials when they exercise discretion, and Dworkin's theory
          of adjudication itself incorporates choices.
      - text: Descriptions of the judicial process do not matter, because his theory is purely normative.
        why: >-
          Hart claims a general and descriptive theory, so descriptive accuracy matters to him; he answers the criticism
          on its own level.
      - text: Delegation of limited legislative powers to the executive is a familiar feature of the modern democracies.
        why: This is Hart's reply to the second criticism (that discretion is undemocratic), not to the first.
  - key: f09
    type: mcq
    concept: hart-and-dworkin-on-judicial-discretion
    difficulty: 2
    variant-of: f08
    stem: Dworkin's second criticism is that judicial discretion is undemocratic. What is Hart's reply?
    options:
      - text: Judges are in fact democratically accountable through appeals to higher courts.
        why: Appeals are not Hart's argument; he accepts the democratic cost and says it is small.
      - text: Even Dworkin's own theory of adjudication incorporates choices, so the democracy objection is circular.
        why: This belongs to Hart's reply to the first criticism, about whether his description of what judges do is false.
      - text: A necessary, small price if judicial power is limited; delegation is familiar in democracies.
        correct: true
        why: >-
          Right: Hart says it is a necessary, small price to pay provided judicial power is limited, and delegation of
          limited legislative powers to the executive is a familiar feature of modern democracies.
      - text: In hard cases there is no clear established law to justify the parties' expectations.
        why: This is Hart's reply to the third criticism (retrospectivity), not to the democracy objection.
  - key: f10
    type: mcq
    concept: hart-and-dworkin-on-judicial-discretion
    difficulty: 2
    variant-of: f08
    stem: Dworkin's third criticism is that judicial law-making is unjust because it is retrospective. What is Hart's reply?
    options:
      - text: Retrospective law is always just if the judge acts as a conscientious legislator.
        why: >-
          Hart does say judges must act as conscientious legislators, but his reply to retrospectivity is about
          expectations, not about the judge's character.
      - text: In hard cases, by definition, there is no clear established law to justify expectations.
        correct: true
        why: >-
          Right: Hart replies that in hard cases, by definition, there is no state of clear established law to justify
          expectations, so nothing is unfairly overturned.
      - text: The executive can always pardon anyone disadvantaged by a retrospective judicial decision.
        why: Clemency is Truepenny CJ's theme in Fuller's case, not Hart's reply to Dworkin.
      - text: Retrospective law is familiar from delegated legislation, so it raises no new problem.
        why: >-
          Delegation belongs to Hart's reply to the democracy objection; the retrospectivity reply turns on the absence
          of settled expectations.
  - key: f11
    type: mcq
    concept: hart-and-dworkin-on-judicial-discretion
    difficulty: 3
    stem: Which of Dworkin's three criticisms of judicial discretion is descriptive rather than normative?
    options:
      - text: That judicial discretion is undemocratic, because judges are not elected
        why: This is a normative claim about legitimacy; the lecture says Dworkin's second argument is normative.
      - text: That judicial law-making is unjust, as a form of retrospective legislation
        why: This is a normative claim about justice to the parties; the lecture connects it with Dworkin's liberal theory.
      - text: That it is a false description of what judges do in hard cases
        correct: true
        why: >-
          Right: the lecture says the first criticism, that this is not what judges do in hard cases, is a descriptive
          claim; the other two are normative.
  - key: f12
    type: mcq
    concept: hart-and-dworkin-on-judicial-discretion
    difficulty: 4
    contrasts-with:
      - laws2100-w05-law-as-integrity
    stem: >-
      The lecture adds a point to Hart's third reply: even if we accept the one right answer thesis, what problem
      remains?
    options:
      - text: That Hercules would reach different answers from real judges, which makes the thesis false.
        why: >-
          The lecture does not say Hercules is wrong; its point is that if only Hercules knows the answer, parties still
          cannot know their rights beforehand.
      - text: That the one right answer must be found in public opinion, which changes too quickly for certainty.
        why: Public opinion is Handy J's theme; the lecture's point is about knowing your legal position ex ante.
      - text: >-
          If only Hercules can find the answer, people still cannot know their rights and duties until a judge declares
          them.
        correct: true
        why: >-
          Right: the lecture says if the right answer is so hard to find that nobody but Hercules knows it, you are in
          the situation Dworkin criticises: you do not know your legal position until a judge tells you.
      - text: That the thesis makes judicial power arbitrary, because judges are no longer constrained by the legislature.
        why: >-
          Arbitrariness is what Hart denies of his own theory; the lecture's added point concerns ex ante knowledge of
          rights.
  - key: f13
    type: mcq
    concept: hart-and-dworkin-on-judicial-discretion
    difficulty: 3
    stem: According to the slide, legal theory has done what to the indeterminacies of legal rules, in Hart's view?
    options:
      - text: Explained them fully, through the open texture of language.
        why: >-
          Hart offers his own explanation in chapter 7, but the slide says legal theory has either ignored or
          exaggerated the indeterminacies.
      - text: Either ignored or exaggerated them.
        correct: true
        why: >-
          Right: "According to Hart, legal theory has either ignored or exaggerated the indeterminacies of legal rules";
          formalism ignores, rule-scepticism exaggerates.
      - text: Treated them as proof that law is only prediction.
        why: That is one of the exaggerations (the realist's), not Hart's description of legal theory as a whole.
  - key: f14
    type: mcq
    concept: hart-and-dworkin-on-judicial-discretion
    difficulty: 4
    variant-of: f05
    stem: >-
      A judge faces a case no statute or precedent settles. She decides it, giving general reasons that could apply to
      like cases, and avoids any sweeping reform. Which account best fits her conduct?
    options:
      - text: 'Dworkin''s: she found the one right answer implicit in the principles of settled law.'
        why: >-
          Possible on Dworkin's theory, but the facts stress gap-filling under constraints and general reasons, which is
          Hart's description of interstitial law-making.
      - text: 'Handy J''s: she treated forms and concepts as instruments and followed public opinion.'
        why: >-
          Nothing suggests public opinion or instrumental use of concepts; she reasons by general reasons within
          constraints.
      - text: 'Hart''s: she exercised constrained, interstitial law-making power as a conscientious legislator.'
        correct: true
        why: >-
          Right: constrained choice, no large-scale reform, and justification by general reasons are the features Hart
          uses to distinguish judicial from legislative law-making.
      - text: 'Tatting J''s: she should have withdrawn, because the law gave no answer to the case.'
        why: She did not withdraw; and for Hart a partly unregulated case calls for judicial law-making, not withdrawal.
  - key: f15
    type: mcq
    concept: hart-and-dworkin-on-judicial-discretion
    difficulty: 3
    stem: >-
      How does the lecture connect Hart's distinction between judicial and legislative law-making with Fuller's
      imaginary case?
    options:
      - text: Both show that judges and legislators have identical law-making powers in modern democracies.
        why: Hart's whole point is that judicial and legislative law-making powers differ; so does Keen J's argument.
      - text: Both engage the relation between judiciary and legislature, as in Keen J's separation-of-powers argument.
        correct: true
        why: >-
          Right: the lecture says the role of the judiciary vis-à-vis the legislator is exactly the argument Fuller
          discusses in his imaginary case, fidelity to law included.
      - text: Both show that executive clemency is the proper solution to every hard case that arises in the criminal law.
        why: >-
          Clemency appears only in Truepenny CJ's judgment; the connection the lecture draws concerns courts and
          legislature.
      - text: Both show that realism is the only defensible theory of what judges do in hard cases.
        why: Neither Hart nor the lecture endorses realism; Hart treats rule-scepticism as an exaggeration.
  - key: f16
    type: mcq
    concept: hart-and-dworkin-on-judicial-discretion
    difficulty: 3
    stem: Which statement about Hart's view of judicial power is accurate?
    options:
      - text: Judicial power in hard cases is arbitrary power, because the law is silent.
        why: >-
          Hart says the opposite: judicial power is not arbitrary; judges must justify decisions in light of general
          reasons.
      - text: Judges may introduce new codes when the law is silent on an important matter of public policy.
        why: >-
          The slide gives this as an example of what judges cannot do: they cannot introduce large-scale reforms or new
          codes.
      - text: Judges must justify decisions by general reasons and act as a conscientious legislator.
        correct: true
        why: >-
          Right: the slide says judicial power is not arbitrary power; judges must always justify decisions by general
          reasons and act as a conscientious legislator.
      - text: Judges have the same power as the legislator, subject only to appeal.
        why: >-
          Hart distinguishes judicial from legislative law-making powers; the judge is subject to many constraints the
          legislator is not.
  - key: f17
    type: truefalse
    concept: hart-and-dworkin-on-judicial-discretion
    difficulty: 1
    set: quickfire
    statement: For Hart, judicial law-making powers are the same as the law-making powers of the legislator.
    answer: false
    why: >-
      False: Hart says judicial law-making powers are different: constrained, interstitial and not arbitrary, since
      judges must justify decisions by general reasons.
  - key: f18
    type: truefalse
    concept: hart-and-dworkin-on-judicial-discretion
    difficulty: 2
    set: quickfire
    statement: Dworkin's criticism that judicial discretion is undemocratic rests on the fact that judges are not elected.
    answer: true
    why: >-
      True: the slide lists the second criticism as "Judicial discretion is undemocratic (judges are not elected)"; Hart
      replies it is a necessary, small price.
  - key: f19
    type: truefalse
    concept: hart-and-dworkin-on-judicial-discretion
    difficulty: 2
    set: quickfire
    statement: For Dworkin, the judge in a hard case steps outside the law and makes new law.
    answer: false
    why: >-
      False: for Dworkin law includes explicit settled law and implicit legal principles, so the judge never steps
      outside the law, making new law; that is Hart's picture.
  - key: f20
    type: short
    concept: hart-and-dworkin-on-judicial-discretion
    difficulty: 3
    prompt: Do Dworkin's criticisms show that Hart's account of judicial discretion should be abandoned?
    model: >-
      Thesis: no; Hart's replies answer each criticism on its own level, though the descriptive dispute remains open.
      Argument: Hart holds that there will always be legally unregulated cases in which the law is "partly indeterminate
      or incomplete" (CL 272). There judges exercise law-making powers, but unlike a legislator's: constrained,
      interstitial and not arbitrary, since judges must justify decisions by general reasons as a conscientious
      legislator. Counterargument: Dworkin says this falsely describes what judges do in hard cases, is undemocratic
      because judges are not elected, and is unjust as retrospective legislation. For him law includes implicit
      principles, so the judge never steps outside the law. Evaluation: Hart's replies are strong on the normative
      criticisms: limited judicial law-making is a small price, like delegated legislation, and in hard cases there is
      by definition no settled law to justify expectations; if only Hercules knows the right answer, Dworkin's theory
      faces the same problem. The descriptive criticism is harder, but Hart's reply that judges "do not just push away
      their law books" and that Dworkin's theory incorporates choices narrows the gap.
    rubric:
      - id: r1
        criterion: Thesis — a clear answer on whether Hart's account survives.
        marks: 2
        top-band: Answers in the first sentence and signals that the descriptive and normative criticisms differ.
        margin-note: Clear answer — good.
        authorities: []
      - id: r2
        criterion: 'Argument — Hart''s account: unregulated cases, interstitial and constrained law-making.'
        marks: 3
        top-band: Quotes CL 272 and lists the three differences from legislative power.
        margin-note: Precise on Hart.
        authorities:
          - hart-the-concept-of-law
      - id: r3
        criterion: Counterargument — all three of Dworkin's criticisms, with his view that judges never make new law.
        marks: 3
        top-band: Separates the descriptive criticism from the two normative ones.
        margin-note: Name all three, and classify them.
        authorities:
          - dworkin-taking-rights-seriously
      - id: r4
        criterion: Evaluation — assesses each reply, including the Hercules point.
        marks: 2
        top-band: Weighs the replies separately and uses the ex ante knowledge point against Dworkin.
        margin-note: Sharp use of Hercules.
        authorities: []
