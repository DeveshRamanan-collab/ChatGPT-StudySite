    body: >-
      Raz, a legal positivist: "I have rejected the strong thesis of the autonomy of legal reasoning. Legal reasoning is
      an instance of moral reasoning." Legal doctrines are justified only if they are morally justified. Courts ought to
      follow the principles of their system, "which are moral principles, though they may be mistaken moral principles",
      so legal reasoning is sometimes morally incorrect.


      Finnis, a natural law thinker: "Legal reasoning, indeed, is technical reasoning, at least in large part not moral
      reasoning." Academic theory exaggerates how far reason can settle greater good or lesser evil and minimises the
      need for authoritative sources. "A natural law theory in the classical tradition makes no pretence that natural
      reason can determine the one right answer" when the sources are unclear.


