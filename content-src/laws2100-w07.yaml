      - text: That only rules are found in law, while principles and standards belong to morality.
        why: >-
          Dworkin's view (week 5) is that principles are part of the law; the lecture does not confine principles and
          standards to morality.
  - key: b15
    type: mcq
    concept: types-of-reasoning-and-rules
    difficulty: 4
    variant-of: b04
    stem: >-
      A tribunal must decide whether a new kind of electric scooter falls within "vehicles". It first asks what the rule
      is for, then compares scooters with bicycles, which an earlier decision excluded. Which pair of reasoning types is
      at work?
    options:
      - text: Deductive reasoning followed by inductive reasoning
        why: >-
          The tribunal does not deduce from the words or generalise from a series of cases; it reads for purpose, then
          compares two cases.
      - text: Abductive reasoning followed by reasoning by principle
        why: >-
          Neither the best explanation of facts nor a balancing of competing values is described; the moves are purpose
          and comparison.
      - text: Purposive reasoning, then analogical reasoning
        correct: true
        why: >-
          Right: asking what the rule is for is purposive reasoning; comparing scooters with bicycles to reach a similar
          outcome is analogical reasoning.
      - text: Inductive reasoning, then deductive reasoning
        why: >-
          No general principle is built from cases and then applied syllogistically; the tribunal reads for purpose and
          reasons by analogy.
  - key: b16
    type: mcq
    concept: types-of-reasoning-and-rules
    difficulty: 4
    stem: >-
      Which classification is correct for a statute that says "A person over 18 may make a will, which must be signed
      before two witnesses"?
    options:
      - text: It is purely prohibitive, because it forbids unwitnessed wills on pain of a sanction.
        why: >-
          The statute imposes no sanction and forbids nothing; an unwitnessed document is simply not a valid will
          (Hart's nullity point).
      - text: It confers a power (to make a will) and sets conditions for its valid exercise.
        correct: true
        why: >-
          Right: making a will is the slide's example of a power-conferring rule; the signing requirement is a condition
          of validity, not a duty backed by punishment.
      - text: It is a mandatory rule, because every adult must make a will before two witnesses.
        why: No-one is required to make a will; the "must" states a condition for a valid will, not a duty to act.
      - text: It is a permissive rule only, because "may" always marks a liberty and nothing more.
        why: >-
          "May" here grants a legal power to change legal relations, which the slide lists separately from a mere
          liberty.
  - key: b17
    type: truefalse
    concept: types-of-reasoning-and-rules
    difficulty: 1
    set: quickfire
    statement: 'The slide defines analogical reasoning as comparing cases: similar facts lead to similar outcomes (precedent).'
    answer: true
    why: 'True: the slide lists "Analogical Reasoning: Comparing cases; similar facts → similar outcomes (precedent)".'
  - key: b18
    type: truefalse
    concept: types-of-reasoning-and-rules
    difficulty: 2
    set: quickfire
    statement: According to the slide, abductive reasoning gives certainty rather than plausibility.
    answer: false
    why: >-
      False: abductive reasoning is inference to the best explanation, giving "plausibility, not certainty" and
      concluding with the best available hypothesis.
  - key: b19
    type: truefalse
    concept: types-of-reasoning-and-rules
    difficulty: 1
    set: quickfire
    statement: 'Permissive rules grant a liberty or option: "X may do Y".'
    answer: true
    why: >-
      True: the slide defines permissive rules as granting a liberty or option, in contrast with mandatory and
      prohibitive rules that impose duties.
  - key: b20
    type: short
    concept: types-of-reasoning-and-rules
    difficulty: 3
    prompt: >-
      "Every type of reasoning used by judges is also used by ordinary people, so there is no such thing as legal
      reasoning." Discuss, using the main types of reasoning and rules from Week 7.
    model: >-
      Thesis: the premise is largely true, but the conclusion does not follow. Argument: the six types of reasoning on
      the slide — deductive, inductive, analogical, abductive, purposive and by principle — are all found in law and in
      other areas of life; we use analogy and precedent in sport, and a syllogism about a valid will has the same form
      as any other. The types of rules are shared too: mandatory, prohibitive, permissive, power-conferring and
      constitutive rules (a goal in football, as much as a contract, is created by constitutive rules). Counterargument:
      some types, such as analogical reasoning and precedent, are particularly important in law, and legal reasoning
      works with power-conferring and constitutive rules that create institutions. Schauer's answer is that legal
      reasoning may be justified by the concentration and dominance of methods found everywhere. Evaluation: the claim
      confuses "different in kind" with "distinctive": law may have a legal reasoning without any unique technique, and
      whether it does is, for Schauer, an empirical claim.
    rubric:
      - id: r1
        criterion: Thesis — accepts or rejects the inference from shared techniques to "no legal reasoning".
        marks: 2
        top-band: Separates the premise (true) from the conclusion (does not follow) in the opening line.
        margin-note: Clear position.
        authorities: []
      - id: r2
        criterion: Argument — uses the types of reasoning and rules with correct definitions and examples.
        marks: 3
        top-band: >-
          Defines at least four types of reasoning and shows the lecture's point that they occur outside law (sport,
          daily life).
        margin-note: Definitions accurate; examples apt.
        authorities: []
      - id: r3
        criterion: >-
          Counterargument — shows what is distinctive: analogy and precedent, institutions created by rules, Schauer's
          concentration.
        marks: 3
        top-band: Uses Schauer's "particularly concentrated and dominant" line to resist the conclusion.
        margin-note: Bring in Schauer here.
        authorities:
          - schauer-thinking-like-a-lawyer
      - id: r4
        criterion: Evaluation — distinguishes "different in kind" from "distinctive" and notes the empirical nature of the claim.
        marks: 2
        top-band: Concludes precisely, noting Schauer's "empirical claim" (p 11).
        margin-note: Good precise conclusion.
        authorities: []
  - key: c01
    type: mcq
    concept: schauer-thinking-like-a-lawyer
    difficulty: 2
    set: pretest
    stem: >-
      According to Schauer in Thinking Like a Lawyer, what would justify the claim that there is something called legal
      reasoning?
    options:
      - text: Finding techniques of reasoning that exist only in law and are never used anywhere else.
        why: >-
          Tempting, but Schauer deliberately sets a lower bar: the methods can be found everywhere, provided they are
          concentrated and dominant in law.
      - text: Identifying methods of reasoning found everywhere but particularly concentrated and dominant in law.
        correct: true
        why: >-
          Right: Schauer says if we identify "methods of reasoning that are found everywhere but that are particularly
          concentrated and dominant in legal argument", the claim is justified (p 8).
      - text: Showing that judges reason exactly as ordinary people do when they solve everyday problems.
        why: >-
          That would count against, not for, a distinct legal reasoning; Schauer's point is about concentration of
          shared methods.
      - text: Showing that judges always reach the one right answer by weighing the relevant principles.
        why: >-
          The one right answer is Dworkin's thesis; Schauer's criterion for legal reasoning says nothing about right
          answers.
  - key: c02
    type: mcq
    concept: schauer-thinking-like-a-lawyer
    difficulty: 2
    stem: >-
      Schauer says the belief in "a moderately distinct form of reasoning we call legal reasoning" is, in the final
      analysis, what kind of claim?
    options:
      - text: A conceptual claim about the nature of law
        why: Tempting in a jurisprudence unit, but Schauer says it is "in the final analysis an empirical claim" (p 11).
      - text: An empirical claim
        correct: true
        why: >-
          Right: "the belief that there is a moderately distinct form of reasoning we call "legal reasoning" is in the
          final analysis an empirical claim" (p 11).
      - text: A normative claim about what judges ought to do
        why: >-
          Schauer is not saying judges ought to reason distinctively; whether they do is a question of fact, hence an
          empirical claim.
      - text: A metatheoretical claim about the success criteria for legal theory
        why: Metatheory asks how to judge theories (week 1); Schauer classifies the legal reasoning claim as empirical.
  - key: c03
    type: mcq
    concept: schauer-thinking-like-a-lawyer
    difficulty: 3
    stem: >-
      Schauer says: "In a society governed by the wise and the good, legal reasoning is likely simply to get in the
      way." What follows, on the slide, for the Rule of Law in such a society?
    options:
      - text: It would be more important than ever, to protect the wise and good from majorities.
        why: >-
          Schauer's provocation runs the other way: the Rule of Law "would be at least superfluous, and quite possible
          pernicious".
      - text: It would become purely a matter of Fuller's principles of legality and nothing else.
        why: >-
          Fuller's principles are the lecture's background for the Rule of Law, but Schauer's claim is that in such a
          society it would be superfluous or pernicious.
      - text: It would be at least superfluous, and quite possibly pernicious.
        correct: true
        why: >-
          Right: "the Rule of Law would be at least superfluous, and quite possible pernicious" (ibid), a provocation
          connecting legal reasoning with the Rule of Law.
  - key: c04
    type: mcq
    concept: schauer-thinking-like-a-lawyer
    difficulty: 2
    stem: Which feature of law does the slide connect with legal reasoning in Schauer's account of the Rule of Law?
    options:
      - text: The coercive force of law, backed by sanctions
        why: >-
          Schauer wrote on coercion (the week 2 reading), but this slide links legal reasoning with "the inherent
          generality of law".
      - text: The inherent generality of law
        correct: true
        why: >-
          Right: the slide lists "Legal reasoning and the inherent generality of law"; the lecture adds that generality
          is one of Fuller's principles of legality.
      - text: The separation of powers between courts and legislature
        why: >-
          The separation of powers is Keen J's argument in Fuller's case, not the feature Schauer ties to legal
          reasoning here.
      - text: The moral content of legal principles
        why: Moral content is Dworkin's and Raz's theme; the slide's link is between legal reasoning and law's generality.
  - key: c05
    type: mcq
    concept: schauer-thinking-like-a-lawyer
    difficulty: 1
    stem: What does Schauer call the part of the Hart–Fuller debate about "no vehicles in the park"?
    options:
      - text: '"A debate within a debate"'
        correct: true
        why: >-
          Right: the slide says this part of the Hart–Fuller debate is "a debate within a debate", offering insights
          about legal rules, interpretation and language.
      - text: '"The central case of the debate"'
        why: The central case is Finnis's method (week 4), not Schauer's description of the vehicles exchange.
      - text: '"A false dilemma in the debate"'
        why: >-
          "False dilemma" is Hart's description of Llewellyn's choice between the formalist's heaven and no rules, later
          in the lecture.
      - text: '"The debate that ended the debate"'
        why: >-
          Nothing on the slide suggests the exchange settled the debate; Fuller's own Postscript calls such questions
          permanent.
  - key: c06
    type: mcq
    concept: schauer-thinking-like-a-lawyer
    difficulty: 2
    stem: >-
      Fuller's railway-station rule reads: "It shall be a misdemeanor, punishable by a fine of five dollars, to sleep in
      any railway station." What question does it raise on the slide?
    options:
      - text: Is it possible to interpret a word in a statute without knowing the aim of the statute?
        correct: true
        why: >-
          Right: the slide pairs the example with exactly this question; Fuller uses it to argue we can only understand
          a statutory rule through its purpose.
      - text: Is a five-dollar fine a sanction, or merely a tax on sleeping in public buildings?
        why: >-
          The sanction/tax distinction is a week 2 theme about coercion; Fuller's example is about interpretation and
          purpose.
      - text: Should homeless people be exempt from every criminal statute that is phrased in general terms?
        why: >-
          The lecture mentions a homeless person to show purpose at work, but the slide's question is about interpreting
          words without the statute's aim.
      - text: Can a rule that punishes sleeping ever satisfy the principle that laws must be possible to obey?
        why: >-
          That would be one of Fuller's principles of legality (week 4), not the question the slide attaches to this
          example.
  - key: c07
    type: mcq
    concept: schauer-thinking-like-a-lawyer
    difficulty: 3
    variant-of: c06
    stem: >-
      In the lecture, a tired commuter nods off waiting for a train, while a homeless person is preparing a place to
      sleep but is not yet asleep. What does Fuller use the contrast to show?
    options:
      - text: That the rule is void for vagueness, so neither person can be fined.
        why: Fuller does not argue the rule is void; he argues its meaning depends on its purpose.
      - text: That we understand "sleep" in the rule only through the rule's purpose.
        correct: true
        why: >-
          Right: technically the commuter sleeps and the other does not, yet the purpose suggests the opposite result;
          Fuller concludes we need the aim of the statute.
      - text: That judges should follow the plain meaning of "sleep" regardless of results.
        why: >-
          Plain meaning regardless of results is the position Fuller attacks (and Keen J voices in the Speluncean case),
          not the lesson of this example.
      - text: That the core of "sleep" is clear and only the penumbra needs any discretion.
        why: >-
          This is Hart's core/penumbra picture, which Fuller pushes back against; the example suggests even the "core"
          depends on purpose.
  - key: c08
    type: mcq
    concept: schauer-thinking-like-a-lawyer
    difficulty: 3
    variant-of: c06
    contrasts-with:
      - rules-standards-and-defeasibility
    stem: >-
      Veterans want to install a truck in the park as part of a war memorial. How does the lecture present Fuller's use
      of this example against Hart?
    options:
      - text: The truck is a clear penumbral case, which is why the judge has discretion to allow it.
        why: >-
          For Hart a truck would be in the core of "vehicle"; Fuller's point is that even a core case may call for an
          exception once we see the rule's purpose.
      - text: The truck is not a vehicle at all, because a vehicle must be capable of being driven.
        why: >-
          The lecture says it is "clearly a vehicle"; the argument is about an exception, not about the definition of
          the word.
      - text: It is clearly a vehicle, but we can identify an exception only by understanding the rule's purpose.
        correct: true
        why: >-
          Right: the lecture says Fuller pushes back on core and penumbra: the truck is clearly a vehicle, and only the
          rule's purpose lets us see an exception.
      - text: The memorial is an exception only because the legislature expressly authorised war memorials.
        why: >-
          No express authorisation appears in the example; the exception comes from purpose, not from a stated exception
          in the rule.
  - key: c09
    type: mcq
    concept: schauer-thinking-like-a-lawyer
    difficulty: 3
    stem: Which question does the slide pose about the Hart–Fuller exchange on vehicles in the park?
    options:
      - text: Whether Hart or Fuller had the better knowledge of the law of public parks.
        why: Neither author's knowledge of park law is at issue; the example is a vehicle for theoretical questions.
      - text: Whether they disagree about the concept of law, or about what judges do or should do when interpreting it.
        correct: true
        why: >-
          Right: the slide asks "Are Hart and Fuller disagreeing about the concept of law, or about what judges
          do/should do when they interpret and apply the law?"
      - text: Whether their disagreement can be settled by reading the dictionary meaning of "vehicle".
        why: >-
          Fuller's point is precisely that semantics alone cannot settle it; the slide's question is about the level of
          the disagreement.
  - key: c10
    type: mcq
    concept: schauer-thinking-like-a-lawyer
    difficulty: 2
    stem: Which of these is NOT one of the questions from Schauer's Thinking Like a Lawyer on the slide?
    options:
      - text: Do lawyers (and judges) think, reason, and argue differently from ordinary people?
        why: >-
          This is on the slide, so it is not the answer: it is Schauer's opening question, the same problem Raz and
          Finnis tried to solve.
      - text: Are there any "techniques of reasoning" characteristic of legal decision-making?
        why: >-
          This is on the slide, so it is not the answer: it asks whether legal decision-making has characteristic
          techniques.
      - text: Should the legislature be supreme over the courts in interpreting statutes?
        correct: true
        why: >-
          Right: legislative supremacy is Keen J's theme in Fuller's case, not one of Schauer's questions about legal
          reasoning.
      - text: Are there specific forms of reasoning associated with the legal systems we know?
        why: >-
          This is on the slide, so it is not the answer: Schauer asks whether there are specific forms of reasoning in
          familiar legal systems.
  - key: c11
    type: mcq
    concept: schauer-thinking-like-a-lawyer
    difficulty: 3
    stem: >-
      Why does the lecture say we should consider American legal realism when asking whether legal reasoning is
      distinctive?
    options:
      - text: Because the realists proved that judges never reason with rules in hard or easy cases.
        why: The lecture says it is not claiming the realists are right; they are a challenge to consider, not a proof.
      - text: Because the debate assumes officials can reason with rules meaningfully, and the realists challenge that.
        correct: true
        why: >-
          Right: the lecture says all of this assumes people can reason with rules meaningfully, so the sceptical
          argument from the realist tradition is a useful challenge.
      - text: Because Schauer himself was a legal realist who rejected rule-based decision-making entirely.
        why: The lecture says "Schauer is not a legal realist", though he takes the realist argument seriously.
      - text: Because the realists were the first to show that legal reasoning is an instance of moral reasoning.
        why: That is Raz's claim; the realists are relevant as sceptics about reasoning with rules, not as moralists.
  - key: c12
    type: mcq
    concept: schauer-thinking-like-a-lawyer
    difficulty: 3
    stem: >-
      Law-and-economics scholars explain decisions by economic considerations. What does the lecture say such analyses
      implicitly claim?
    options:
      - text: That legal rules are the only considerations judges take into account.
        why: 'The opposite: explaining decisions by economics implies factors beyond legal rules are at work.'
      - text: That economic reasoning is a unique technique found only in courtrooms.
        why: >-
          Economic reasoning is used everywhere; the lecture's point is about legal and extra-legal factors, not
          uniqueness.
      - text: That there are legal factors and also extra-legal factors in judicial reasoning.
        correct: true
        why: >-
          Right: the lecture says explaining decisions this way implicitly claims legal and extra-legal factors, the
          same structure as law-and-morality debates about adjudication.
  - key: c13
    type: mcq
    concept: schauer-thinking-like-a-lawyer
    difficulty: 4
    stem: >-
      If judges weigh legal rules together with moral, political and economic factors, what does the lecture suggest
      follows about legal reasoning?
    options:
      - text: It becomes a form of deductive reasoning, since each factor acts as a separate premise in a syllogism.
        why: >-
          Adding factors does not turn weighing into deduction; the lecture compares it with ordinary reasoning that
          weighs many considerations.
      - text: It looks similar to ordinary reasoning, and the question becomes whether legal rules have special status.
        correct: true
        why: >-
          Right: the lecture says reasoning with law plus other factors is similar to how ordinary people reason, so the
          question is whether legal reasons have a special status vis-à-vis other factors.
      - text: It shows that legal rules cannot be identified at all without first consulting economic theory.
        why: >-
          Identification of rules is not the point; the lecture asks whether legal reasons take precedence over, or
          exclude, other considerations.
      - text: It proves that the ratio of a case is always an economic reason in disguise, as the realists claimed.
        why: >-
          The lecture says we look for the ratio because we treat those reasons as legal reasons; it does not reduce
          ratios to economics.
  - key: c14
    type: mcq
    concept: schauer-thinking-like-a-lawyer
    difficulty: 4
    contrasts-with:
      - raz-and-finnis-on-legal-reasoning
    stem: Which option best contrasts Schauer's view of legal reasoning with Raz's?
    options:
      - text: Schauer says legal reasoning is moral reasoning; Raz says it is empirical reasoning.
        why: >-
          This reverses and garbles both: Raz calls legal reasoning moral reasoning; Schauer says the claim that it is
          distinctive is empirical.
      - text: Both deny any distinct legal reasoning, and Schauer adds that the Rule of Law is always pernicious.
        why: >-
          Schauer allows a distinct legal reasoning by concentration, and says the Rule of Law would be superfluous or
          pernicious only among the wise and the good.
      - text: Raz says legal reasoning is technical; Schauer says it is distinct only by the dominance of analogy.
        why: >-
          Technical reasoning is Finnis's phrase, and Schauer speaks of methods concentrated in law generally, not only
          analogy.
      - text: >-
          Raz treats legal reasoning as an instance of moral reasoning; Schauer treats its distinctness as an empirical
          matter of concentration.
        correct: true
        why: >-
          Right: Raz rejects the strong autonomy thesis; Schauer holds that legal reasoning may be distinctive by the
          concentration of shared methods, an empirical claim.
  - key: c15
    type: mcq
    concept: schauer-thinking-like-a-lawyer
    difficulty: 1
    stem: >-
      Which book by Frederick Schauer is listed on the slide as a philosophical examination of rule-based
      decision-making in law and in life?
    options:
      - text: Thinking Like a Lawyer (2009)
        why: >-
          This is his introduction to legal reasoning (2009), not the book subtitled a philosophical examination of
          rule-based decision-making.
      - text: Playing By the Rules (1991)
        correct: true
        why: >-
          Right: Playing By the Rules: A Philosophical Examination of Rule-Based Decision-Making in Law and in Life
          (Clarendon/Oxford, 1991).
      - text: The Force of Law (2015)
        why: >-
          The Force of Law (2015) is his book on coercion, connected with the week 2 reading, not the one on rule-based
          decision-making.
      - text: The Proof (2022)
        why: >-
          The Proof (2022) is about uses of evidence in law, politics and everything else, not rule-based
          decision-making.
  - key: c16
    type: mcq
    concept: schauer-thinking-like-a-lawyer
    difficulty: 2
    stem: In Schauer's view as presented in the lecture, what makes legal reasoning specific?
    options:
      - text: The fact that its arguments are different in kind from ordinary reasoning
        why: >-
          The lecture says for Schauer the specificity is not that the arguments are different in kind; that is the
          stronger thesis he avoids.
      - text: The concentration of certain types of arguments in law
        correct: true
        why: >-
          Right: the lecture puts it plainly: the specificity of legal reasoning is due to the concentration of certain
          types of arguments, not their being different in kind.
      - text: The absence of any extra-legal factors in judicial decisions
        why: >-
          Schauer takes seriously that judges consider extra-legal factors; specificity lies in concentration, not the
          absence of other factors.
  - key: c17
    type: truefalse
    concept: schauer-thinking-like-a-lawyer
    difficulty: 1
    set: quickfire
    statement: Schauer calls the vehicles-in-the-park part of the Hart–Fuller debate "a debate within a debate".
    answer: true
    why: >-
      True: the slide quotes this phrase and says it offers insights about the nature of legal rules, legal
      interpretation and legal language.
  - key: c18
    type: truefalse
    concept: schauer-thinking-like-a-lawyer
    difficulty: 2
    set: quickfire
    statement: Schauer says the existence of a distinct legal reasoning is, in the final analysis, a conceptual claim.
    answer: false
    why: >-
      False: Schauer says it is "in the final analysis an empirical claim" (p 11); whether lawyers reason differently is
      a matter of fact.
  - key: c19
    type: truefalse
    concept: schauer-thinking-like-a-lawyer
    difficulty: 2
    set: quickfire
    statement: The lecture describes Schauer as a legal realist who rejects reasoning with rules.
    answer: false
    why: >-
      False: the lecture says "Schauer is not a legal realist", though he takes the realist argument seriously when
      discussing how interpreters work with rules.
  - key: c20
    type: short
    concept: schauer-thinking-like-a-lawyer
    difficulty: 3
    prompt: >-
      "Legal reasoning is nothing more than ordinary reasoning applied to legal materials." Evaluate this claim with
      reference to Schauer.
    model: >-
      Thesis: the claim is close to Schauer's view but overstates it; legal reasoning uses ordinary methods yet may
      still be distinctive. Argument: Schauer asks whether lawyers and judges think, reason and argue differently from
      ordinary people, and whether there are techniques of reasoning characteristic of legal decision-making. His answer
      is that methods "found everywhere but that are particularly concentrated and dominant in legal argument and
      decision-making" would justify speaking of legal reasoning (p 8): distinct by concentration, not kind. He adds
      that the belief in a moderately distinct legal reasoning is "in the final analysis an empirical claim" (p 11).
      Counterargument: the realist sceptic doubts judges reason with rules at all, and law-and-economics suggests
      extra-legal factors, which would make the claim true in a stronger sense; Raz would add that legal reasoning is an
      instance of moral reasoning. Evaluation: "nothing more" ignores concentration and the generality of law, which
      Schauer ties to the Rule of Law; but whether judges really reason distinctively must be shown empirically, not
      assumed.
    rubric:
      - id: r1
        criterion: Thesis — a qualified position on "nothing more than ordinary reasoning".
        marks: 2
        top-band: Agrees on the methods but rejects "nothing more", in one sentence.
        margin-note: Nuanced thesis.
        authorities: []
      - id: r2
        criterion: Argument — presents Schauer's questions, the concentration criterion (p 8) and the empirical claim (p 11).
        marks: 3
        top-band: Quotes the p 8 criterion and explains concentration versus difference in kind.
        margin-note: Good use of Schauer's own test.
        authorities:
          - schauer-thinking-like-a-lawyer
      - id: r3
        criterion: Counterargument — realist scepticism and extra-legal factors; Raz's moral reading.
        marks: 3
        top-band: Shows how the sceptic and Raz would push the claim in different directions.
        margin-note: Which sceptic, and why?
        authorities: []
      - id: r4
        criterion: Evaluation — weighs concentration and generality against the need for empirical support.
        marks: 2
        top-band: Connects generality with the Rule of Law and ends on what evidence would settle it.
        margin-note: Strong close.
        authorities: []
  - key: d01
    type: mcq
    concept: speluncean-explorers-five-options
    difficulty: 1
    set: pretest
    stem: >-
      In Fuller's imaginary case, which judge holds that § 12-A "permits of no exception applicable to this case" and
      looks to executive clemency to mitigate the rigours of the law?
    options:
      - text: Justice Foster
        why: >-
          Foster J would acquit on two independent arguments; he rejects the conclusion that the law compels a result
          "we are ashamed of".
      - text: Chief Justice Truepenny
        correct: true
        why: >-
          Right: Truepenny CJ says the statute permits of no exception, and assumes clemency will be extended so justice
          is done without impairing the letter or spirit of the statutes.
      - text: Justice Handy
        why: >-
          Handy J treats forms and concepts as instruments and relies on common sense and public opinion, not on the
          letter of § 12-A.
      - text: Justice Tatting
        why: Tatting J finds the arguments unconvincing and withdraws from the decision; he does not rest on clemency.
  - key: d02
    type: mcq
    concept: speluncean-explorers-five-options
    difficulty: 2
    stem: What is Foster J's first argument for acquittal?
    options:
      - text: The statute should be read in light of its purpose, by analogy with the self-defence excuse.
        why: >-
          That is Foster J's second argument, which assumes positive law does apply; the first argument says it does not
          apply at all.
      - text: The defendants did nothing wrong in moral terms, so the court should simply ignore the statute.
        why: >-
          Foster J does not argue that morality defeats the law; he says the law, properly understood, declares them
          innocent.
      - text: Positive law is predicated on a human society, so it did not apply to men in a state of nature.
        correct: true
        why: >-
          Right: enacted law is not applicable; positive law is predicated on the possibility of a human society, and
          cessante ratione legis, cessat et ipsa lex.
      - text: The trial judge had discretion over the penalty and should have exercised it in their favour.
        why: >-
          The facts say the law permitted "no discretion with respect to the penalty"; Foster J's argument is about
          whether the law applies at all.
  - key: d03
    type: mcq
    concept: speluncean-explorers-five-options
    difficulty: 2
    stem: What does the maxim "cessante ratione legis, cessat et ipsa lex" mean?
    options:
      - text: Wherever there is society, there is law.
        why: That is ubi societas, ibi ius, the other maxim on the Week 7 slides, linking law with society and agreement.
      - text: When the reason for a law ceases, the law itself ceases.
        correct: true
        why: >-
          Right: Foster J uses this maxim for his first argument: positive law presupposes a human society, and in the
          cave its reason had ceased.
      - text: No one may profit from his own wrong or crime.
        why: This is the principle from Riggs v Palmer (week 5), not the maxim Foster J relies on.
      - text: An unjust law is no law at all, whatever its source or pedigree.
        why: >-
          That is lex iniusta non est lex (week 4); Foster J's maxim concerns the reason of a law ceasing, not its
          injustice.
  - key: d04
    type: mcq
    concept: speluncean-explorers-five-options
    difficulty: 2
    stem: >-
      Foster J's second argument says "a man may break the letter of the law without breaking the law itself". Which
      analogy does he use?
    options:
      - text: Executive clemency, which mitigates punishment
        why: >-
          Clemency is Truepenny CJ's solution and one of Keen J's questions to set aside; Foster J's analogy is an
          excuse within the law.
      - text: Wartime sacrifice of soldiers' lives for others
        why: >-
          Foster J does compare the ten rescuers who died, but in his first line of argument about agreement; the second
          argument's analogy is self-defence.
      - text: Killing in self-defence, which is excused
        correct: true
        why: >-
          Right: interpreting the statute reasonably in light of its evident purpose, Foster J notes that killing in
          self-defence is excused despite the statute's words.
      - text: Necessity at sea, where shipwrecked sailors eat one another
        why: No such analogy is on the slides or in the lecture; the analogy given is the self-defence excuse.
  - key: d05
    type: mcq
    concept: speluncean-explorers-five-options
    difficulty: 3
    stem: >-
      Foster J says his second argument raises "no question of fidelity to enacted law", only a question about which
      distinction?
    options:
      - text: Between law and morality
        why: >-
          Foster J expressly does not rely on morality defeating law in this argument; his distinction is about kinds of
          fidelity.
      - text: Between rules and principles
        why: That is Dworkin's distinction (week 5); Foster J's phrase is about fidelity, not types of norm.
      - text: Between intelligent and unintelligent fidelity
        correct: true
        why: >-
          Right: the argument "may possibly raise a question of the distinction between intelligent and unintelligent
          fidelity" (p 625), echoing Fuller's theme of fidelity to law.
      - text: Between judicial functions and executive functions
        why: >-
          Judicial versus executive functions is among the disquisitions Handy J lists; Foster J's phrase contrasts
          intelligent and unintelligent fidelity.
  - key: d06
    type: mcq
    concept: speluncean-explorers-five-options
    difficulty: 2
    stem: Which objection does Tatting J make to Foster J's purpose argument?
    options:
      - text: That the statute has no purpose at all, so only its words can guide the court.
        why: Tatting J does not deny the statute has a purpose; his first objection is that it has more than one.
      - text: That there is more than one purpose, and self-defence may have a different explanation.
        correct: true
        why: >-
          Right: the slide lists (i) there is more than one purpose; and (ii) there might be a different explanation for
          the excuse of self-defence; then asks the scope of the exception.
      - text: That public opinion strongly favours conviction, so the court should convict.
        why: >-
          Public opinion is Handy J's consideration, and he uses it in favour of the defendants; it is not Tatting J's
          objection.
      - text: That the court has no power to hear the appeal because only the executive can decide guilt.
        why: Nothing in Tatting J's objection concerns jurisdiction; he engages the purpose argument and then withdraws.
  - key: d07
    type: mcq
    concept: speluncean-explorers-five-options
    difficulty: 1
    stem: What does Tatting J finally do?
    options:
      - text: He votes to affirm the conviction on the plain words.
        why: >-
          Affirming on the words is Truepenny CJ's and Keen J's outcome; Tatting J cannot accept either side's
          reasoning.
      - text: He votes to acquit on the purpose of the statute.
        why: Acquitting on purpose is Foster J's second argument, which Tatting J criticises.
      - text: He withdraws from the decision of the case.
        correct: true
        why: >-
          Right: the slide says Tatting J declares his withdrawal from the decision of the case; the lecture calls this
          a personal decision rather than a decision of the case.
  - key: d08
    type: mcq
    concept: speluncean-explorers-five-options
    difficulty: 2
    stem: Which two questions does Keen J set aside as irrelevant to the office of a judge?
    options:
      - text: Whether the statute is valid, and whether it was properly enacted.
        why: >-
          Validity is not in dispute; Keen J's two questions concern clemency and the morality of what the defendants
          did.
      - text: What the statute's purpose is, and whether that purpose had ceased in the cave.
        why: >-
          Keen J does reject conjectural purpose, but the two questions on his slide are clemency and whether the act
          was right or wrong.
      - text: Whether clemency should be extended, and whether the act was right or wrong.
        correct: true
        why: >-
          Right: (1) whether executive clemency should be extended if the conviction is affirmed; (2) whether what they
          did was "right" or "wrong", "wicked" or "good".
      - text: Whether the public approves, and whether the executive will pardon them.
        why: Public approval is Handy J's concern; Keen J sets aside clemency and moral judgment together.
  - key: d09
    type: mcq
    concept: speluncean-explorers-five-options
    difficulty: 3
    contrasts-with:
      - laws2100-w05-theoretical-disagreement
    stem: What grounds Keen J's insistence on the plain meaning of § 12-A?
    options:
      - text: A natural law view that the statute's words express eternal moral truths.
        why: Keen J explicitly sets aside whether the act was right or wrong; his ground is political, not moral.
      - text: The supremacy of the legislative branch, from which flows the duty to enforce the written law faithfully.
        correct: true
        why: >-
          Right: from the principle of legislative supremacy "flows the obligation of the judiciary to enforce
          faithfully the written law, and to interpret that law in accordance with its plain meaning" (p 633).
      - text: The realist view that judges should give the public the result it expects.
        why: >-
          That is Handy J; Keen J wants plain meaning "without reference to our personal desires or our individual
          conceptions of justice".
      - text: Dworkin's view that the law includes implicit legal principles, found through constructive interpretation.
        why: Implicit principles would support Foster J's kind of reasoning; Keen J rejects conjectural purposes and gaps.
  - key: d10
    type: mcq
    concept: speluncean-explorers-five-options
    difficulty: 3
    stem: 'Keen J says: "the question is not the conjectural purpose of the rule, but its…" what?'
    options:
      - text: scope
        correct: true
        why: >-
          Right: "As in dealing with the statute, so in dealing with the exception, the question is not the conjectural
          purpose of the rule, but its scope" (p 636).
      - text: morality
        why: >-
          Keen J has set aside moral questions as irrelevant to the judicial office; his contrast is between purpose and
          scope.
      - text: history
        why: Legislative history is not Keen J's word; he contrasts conjectural purpose with the rule's scope.
      - text: justice
        why: Keen J rejects "individual conceptions of justice" as a guide; his word is scope.
  - key: d11
    type: mcq
    concept: speluncean-explorers-five-options
    difficulty: 2
    stem: Handy J says the problem before the court is a question of what?
    options:
      - text: Statutory construction
        why: >-
          Handy J lists statutory construction among the "learned disquisitions" he has heard; he says the real problem
          is something else.
      - text: Practical wisdom
        correct: true
        why: >-
          Right: for Handy J the problem is a question of practical wisdom; officials do their jobs best if they treat
          forms and abstract concepts as instruments.
      - text: Natural law
        why: The law of nature is Foster J's theme; Handy J dismisses the positive law versus natural law disquisition.
      - text: Legislative supremacy
        why: Legislative supremacy is Keen J's ground; Handy J looks to common sense, public opinion and clemency.
  - key: d12
    type: mcq
    concept: speluncean-explorers-five-options
    difficulty: 3
    stem: Which theory of law does the lecture say Handy J personifies?
    options:
      - text: Legal positivism, because he applies only the rules of the game.
        why: >-
          He keeps only "a few basic rules of the game" and treats concepts as instruments; the lecture does not call
          him a positivist.
      - text: Legal realism, deciding on the facts and non-legal considerations.
        correct: true
        why: >-
          Right: the lecture calls Handy J the personification of legal realism: judges do not really attend to legal
          rules but decide in light of the facts and other considerations.
      - text: Natural law theory, because he cares about the morally right result.
        why: Handy J's considerations are common sense, public opinion and gossip, not moral principles of natural law.
      - text: Dworkin's law as integrity, fitting and justifying the legal record.
        why: Integrity asks for the best interpretation of the legal record; Handy J sets such learned disquisitions aside.
  - key: d13
    type: mcq
    concept: speluncean-explorers-five-options
    difficulty: 3
    stem: >-
      Foster J asks: "If it was proper that these ten lives should be sacrificed to save the lives of five imprisoned
      explorers, why then are we told it was wrong for these explorers to carry out an arrangement which would save four
      lives at the cost of one?" Which idea does this support?
    options:
      - text: That clemency should be extended, as Truepenny CJ assumes it will be.
        why: >-
          Foster J rejects relying on clemency; the quotation belongs to his argument that the law itself declares them
          innocent.
      - text: That the plain meaning of the statute must be followed whatever the result.
        why: The quotation challenges the result of plain meaning; it cannot support Keen J's position.
      - text: That legal powers find their justification in an agreement, and the explorers' arrangement can be compared.
        correct: true
        why: >-
          Right: on the "Agreement, law, and society" slide Foster J links law with agreement or social contract, and
          questions the "supposed absolute value of a human life" in the cave.
      - text: >-
          That judges should withdraw from a case whenever the moral reasons and the legal reasons seem to be evenly
          balanced.
        why: Withdrawal is Tatting J's response; this quotation is Foster J pressing his agreement-based argument.
  - key: d14
    type: mcq
    concept: speluncean-explorers-five-options
    difficulty: 4
    contrasts-with:
      - laws2100-w04-lex-iniusta-strong-and-weak
    stem: >-
      A student writes: "Foster J argues that strong moral reasons defeat the law, so he is simply a natural law judge."
      What is the best correction, based on the lecture?
    options:
      - text: 'None needed: Foster J says morality overrides the statute, which is the natural law position.'
        why: The lecture expressly says Foster J is not saying there are stronger moral reasons to defeat the law.
      - text: >-
          Foster J claims the law itself, properly understood, declares them innocent, a different view of what the law
          requires.
        correct: true
        why: >-
          Right: the lecture stresses that "the law declares the defendants" innocent, comparing Dworkin's reading of
          Riggs: a theoretical disagreement about what the law requires.
      - text: Foster J is a legal realist, because he decides on public opinion and common sense.
        why: That describes Handy J; Foster J argues from positive law's presuppositions and from the statute's purpose.
      - text: >-
          Foster J is a strict positivist, because he applies § 12-A according to its plain words, whatever the result
          may be.
        why: Plain words is Keen J's method; Foster J reads the statute in light of its evident purpose.
  - key: d15
    type: mcq
    concept: speluncean-explorers-five-options
    difficulty: 4
    stem: Why, according to his Postscript, did Fuller construct the case?
    options:
      - text: To show that the correct answer was acquittal, as Foster J argued.
        why: >-
          Fuller says the case was built to bring philosophies into focus, not to endorse one judge; the questions are
          permanent problems.
      - text: To predict how the courts of the future would treat cases of necessity.
        why: >-
          Fuller says any prediction "does not go beyond a suggestion that the questions involved are among the
          permanent problems of the human race".
      - text: To bring into a common focus divergent philosophies of law and government.
        correct: true
        why: >-
          Right: "The case was constructed for the sole purpose of bringing into a common focus certain divergent
          philosophies of law and government" (p 645).
      - text: To demonstrate that legal positivism must be rejected by any serious judge.
        why: >-
          The Postscript takes no side; it presents live questions of choice from the days of Plato and Aristotle
          onwards.
  - key: d16
    type: truefalse
