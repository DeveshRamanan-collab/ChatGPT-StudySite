cards:
  - type: basic
    concept: raz-and-finnis-on-legal-reasoning
    front: Raz on legal reasoning (Week 7)?
    back: >-
      He rejects the strong thesis of the autonomy of legal reasoning: legal reasoning is an instance of moral
      reasoning, though sometimes morally incorrect or based on morally deficient legal principles.
    source: Week 07 Lecture Slides, slide 3
  - type: basic
    concept: raz-and-finnis-on-legal-reasoning
    front: Finnis on legal reasoning (Week 7)?
    back: >-
      "Legal reasoning, indeed, is technical reasoning, at least in large part not moral reasoning." Clear authoritative
      sources that respect the few absolute moral rights are the only rational basis for decision.
    source: Week 07 Lecture Slides, slide 4
  - type: cloze
    concept: raz-and-finnis-on-legal-reasoning
    text: >-
      A natural law theory in the classical tradition makes no pretence that natural reason can determine the {{c1::one
      right answer}} to the questions of a judge who finds the {{c2::sources unclear}}.
    source: Week 07 Lecture Slides, slide 4
  - type: basic
    concept: raz-and-finnis-on-legal-reasoning
    front: Two lessons from the Raz/Finnis reversal?
    back: >-
      1 Specific claims (and their arguments) are separable, though not completely disconnected, from general views of
      law. 2 The real problem: is legal reasoning different in kind from other (practical) reasoning?
    source: Week 07 Lecture Transcript
  - type: basic
    concept: types-of-reasoning-and-rules
    front: The six main types of (legal) reasoning on the slide?
    back: >-
      Deductive (rule → conclusion); inductive (cases → principle); analogical (similar facts → similar outcomes);
      abductive (best explanation); purposive/teleological (purpose of the rule); reasoning by principle (weighing
      values).
    source: Week 07 Lecture Slides, slide 5
  - type: cloze
    concept: types-of-reasoning-and-rules
    text: 'Abductive reasoning is inference to the {{c1::best explanation}}: {{c2::plausibility}}, not certainty.'
    source: Week 07 Lecture Slides, slide 5
  - type: basic
    concept: types-of-reasoning-and-rules
    front: The five main types of (legal) rules on the slide?
    back: >-
      Mandatory (must do); prohibitive (must not do); permissive (may do); power-conferring (create/change/extinguish
      legal relations, eg a will, legislation); constitutive (create the activity/institution, eg contract, marriage,
      corporation).
    source: Week 07 Lecture Slides, slide 6
  - type: apply
    concept: types-of-reasoning-and-rules
    scenario: >-
      A court reads "no vehicles in the park" in light of why the rule was made, then decides a scooter case the same
      way as an earlier bicycle case.
    answer: Purposive reasoning (the rule's purpose), then analogical reasoning (similar facts → similar outcomes).
    source: Week 07 Lecture Slides, slide 5
  - type: cloze
    concept: types-of-reasoning-and-rules
    text: A goal in football is created by {{c1::constitutive}} rules, as a contract or marriage is in law.
    source: Week 07 Lecture Transcript
  - type: basic
    concept: schauer-thinking-like-a-lawyer
    front: What does Schauer call the vehicles-in-the-park part of the Hart–Fuller debate?
    back: >-
      "A debate within a debate", offering insights about the nature of legal rules, legal interpretation and legal
      language.
    source: Week 07 Lecture Slides, slide 7
  - type: basic
    concept: schauer-thinking-like-a-lawyer
    front: Fuller's railway-station rule and its question?
    back: >-
      "It shall be a misdemeanor, punishable by a fine of five dollars, to sleep in any railway station." Is it possible
      to interpret a word in a statute without knowing the aim of the statute?
    source: Week 07 Lecture Slides, slide 7
  - type: cloze
    concept: schauer-thinking-like-a-lawyer
    text: >-
      For Schauer, legal reasoning is justified if we find methods of reasoning {{c1::found everywhere}} but
      particularly {{c2::concentrated and dominant}} in legal argument (p 8).
    source: Week 07 Lecture Slides, slide 9
  - type: basic
    concept: schauer-thinking-like-a-lawyer
    front: Schauer on the kind of claim that there is a distinct legal reasoning?
    back: '"…in the final analysis an empirical claim." (p 11)'
    source: Week 07 Lecture Slides, slide 10
  - type: basic
    concept: schauer-thinking-like-a-lawyer
    front: Schauer's provocation about the wise and the good?
    back: >-
      In a society governed by the wise and the good, legal reasoning is likely to get in the way, and the Rule of Law
      "would be at least superfluous, and quite possible pernicious".
    source: Week 07 Lecture Slides, slide 10
  - type: basic
    concept: speluncean-explorers-five-options
    front: Facts of the Speluncean Explorers?
    back: >-
      Newgarth, May 4299: four explorers trapped in a cave; rescued after 32 days; on day 23 Roger Whetmore was killed
      and eaten. Convicted of murder and sentenced to hang; no discretion on penalty.
    source: Week 07 Lecture Slides, slide 11
  - type: cloze
    concept: speluncean-explorers-five-options
    text: >-
      N.C.S.A. (N.s.) § 12-A: "Whoever shall {{c1::willfully take the life of another}} shall be punished by
      {{c2::death}}."
    source: Week 07 Lecture Slides, slide 13
  - type: basic
    concept: speluncean-explorers-five-options
    front: The five options in Fuller's case?
    back: >-
      1 Apply § 12-A regardless (Truepenny CJ; Keen J by plain meaning). 2 Do not apply the law (Foster J, first). 3
      Apply it in light of its purpose (Foster J, second). 4 Too hard: withdraw (Tatting J). 5 Common sense and public
      opinion (Handy J).
    source: Week 07 Lecture Slides, slide 12
  - type: basic
    concept: speluncean-explorers-five-options
    front: Foster J's first argument?
    back: >-
      Positive law is predicated on the possibility of a human society; cessante ratione legis, cessat et ipsa lex. The
      men were in a state of nature, not civil society, so enacted law did not apply.
    source: Week 07 Lecture Slides, slide 15
  - type: basic
    concept: speluncean-explorers-five-options
    front: Foster J's second argument?
    back: >-
      A man may break the letter of the law without breaking the law itself: read the statute in light of its evident
      purpose (analogy: self-defence). Intelligent vs unintelligent fidelity.
    source: Week 07 Lecture Slides, slide 17
  - type: basic
    concept: speluncean-explorers-five-options
    front: Keen J's ground for plain meaning?
    back: >-
      The supremacy of the legislative branch: judges must enforce the written law according to its plain meaning, not
      personal conceptions of justice. The question is "not the conjectural purpose of the rule, but its scope".
    source: Week 07 Lecture Slides, slide 20
  - type: apply
    concept: speluncean-explorers-five-options
    scenario: >-
      A judge says: "Rules and concepts are just tools. Let us pick the ones that suit this situation, and see what the
      public would say."
    answer: >-
      Handy J's position: a question of practical wisdom, forms and concepts as instruments; the lecture calls it the
      personification of legal realism.
    source: Week 07 Lecture Slides, slide 21
  - type: cloze
    concept: rules-standards-and-defeasibility
    text: 'Schauer''s convergence hypothesis: the {{c1::avoidance of rules}} and the {{c2::concretization of standards}}.'
    source: Week 07 Lecture Slides, slide 23
  - type: basic
    concept: rules-standards-and-defeasibility
    front: Hart's answer to Llewellyn's dilemma (CL 139)?
    back: >-
      A false dilemma: rules may have exceptions incapable of exhaustive statement without leaving us always to our
      discretion. "A rule that ends with the word 'unless…' is still a rule."
    source: Week 07 Lecture Slides, slide 24
  - type: cloze
    concept: rules-standards-and-defeasibility
    text: >-
      A rule is {{c1::defeasible}} if a conclusion justified when certain criteria are met can be defeated if
      {{c2::further criteria}} are met.
    source: Week 07 Lecture Slides, slide 25
  - type: apply
    concept: rules-standards-and-defeasibility
    scenario: >-
      A statute bans importing foreigners under contract "to perform labor or service of any kind". A church brings over
      an English priest under an employment contract.
    answer: >-
      Church of the Holy Trinity v United States, 143 U.S. 457 (1892): the Court held a minister was not a foreign
      laborer under the statute — an implicit exception (defeasibility).
    source: Week 07 Lecture Slides, slide 26
  - type: basic
    concept: rules-standards-and-defeasibility
    front: Three questions about legal defeasibility?
    back: >-
      1 Is it due to the nature of language, of rules, or of law? 2 How does it relate to the Rule of Law? 3 How does it
      relate to legal indeterminacy?
    source: Week 07 Lecture Slides, slide 25
  - type: cloze
    concept: hart-and-dworkin-on-judicial-discretion
    text: >-
      "Formalism and rule-scepticism are the {{c1::Scylla and Charybdis}} of juristic theory; […] the truth lies
      {{c2::between them}}" (CL 147).
    source: Week 07 Lecture Slides, slide 27
  - type: basic
    concept: hart-and-dworkin-on-judicial-discretion
    front: How does judicial law-making differ from the legislator's, for Hart?
    back: >-
      Subject to many constraints (no large-scale reforms or new codes); interstitial; not arbitrary: judges must
      justify decisions by general reasons and act as a conscientious legislator.
    source: Week 07 Lecture Slides, slide 29
  - type: basic
    concept: hart-and-dworkin-on-judicial-discretion
    front: Dworkin's three criticisms and Hart's replies?
    back: >-
      1 False description → judges "do not just push away their law books"; Dworkin's theory has choices too. 2
      Undemocratic → small price if limited; delegation is familiar. 3 Retrospective → in hard cases there is no clear
      established law to justify expectations.
    source: Week 07 Lecture Slides, slide 30
  - type: cloze
    concept: hart-and-dworkin-on-judicial-discretion
    text: >-
      Hart: in any legal system there will always be legally {{c1::unregulated}} cases in which the law is partly
      {{c2::indeterminate}} or incomplete (CL 272).
    source: Week 07 Lecture Slides, slide 28
  - type: apply
    concept: hart-and-dworkin-on-judicial-discretion
    scenario: 'A student says: "Dworkin''s objection that judge-made law is retrospective defeats Hart."'
    answer: >-
      Hart: in hard cases, by definition, there is no clear established law to justify expectations; and if only
      Hercules can find the right answer, parties are no better off on Dworkin's view.
    source: Week 07 Lecture Slides, slide 30
audio:
  title: Week 7 recap — legal reasoning and the nature of law
  minutes: 3
  script: >-
    This week connects legal reasoning with the big question, what is law. We start with a surprise. Raz, the
    positivist, says he rejects the strong thesis of the autonomy of legal reasoning: legal reasoning is an instance of
    moral reasoning, though sometimes based on mistaken moral principles. Finnis, the natural law thinker, says legal
    reasoning is technical reasoning, at least in large part not moral reasoning, and that natural reason cannot claim
    the one right answer when the sources are unclear. The lesson is that specific claims are separable from general
    theories of law, and that the real question is whether legal reasoning differs in kind from other practical
    reasoning.


    We then sort the tools. Six types of reasoning: deductive, inductive, analogical, abductive, purposive, and
    reasoning by principle. Five types of rules: mandatory, prohibitive, permissive, power-conferring and constitutive.
    None of them is unique to law.


    Schauer asks whether lawyers think differently from ordinary people. His answer is that legal reasoning is
    distinctive by concentration: methods found everywhere but concentrated and dominant in law. And he says that claim
    is, in the end, empirical. He also calls the vehicles-in-the-park exchange a debate within a debate: can we
    interpret a word in a statute without knowing its aim?


    Fuller's Speluncean Explorers gives us five options on one clear statute. Truepenny applies it and hopes for
    clemency. Foster says positive law did not apply in a state of nature, and alternatively reads the statute by its
    purpose, like self-defence. Tatting withdraws. Keen applies the plain meaning because the legislature is supreme.
    Handy uses common sense and public opinion, the realist. Fuller says these are permanent problems of the human race.


    Next, rules and standards. Schauer's convergence hypothesis says that over time rules are avoided, for example by
    exceptions, and standards are made concrete, so the choice manages discretion less than we think. Hart replies to
    Llewellyn that a rule ending with unless is still a rule. A defeasible rule's conclusion can be defeated by further
    criteria, as in Church of the Holy Trinity, where a minister was not a foreign labourer, and as in Riggs.


    Finally, discretion. For Hart, formalism and rule-scepticism are Scylla and Charybdis. In partly unregulated cases
    judges make law, but interstitially, under constraints, and with general reasons. Dworkin says this is false,
    undemocratic and retrospective. Hart replies that judges keep their law books, the democratic cost is small, and in
    hard cases there are no settled expectations to protect.
