        correct: true
        why: >-
          Right: the lecture says these types are found in law and in other areas of life; analogical reasoning and
          precedent are particularly important in the legal context.
      - text: They are ranked on the slide from most to least reliable, with abduction the most reliable type.
        why: >-
          No ranking is given; and abduction is described as plausibility, not certainty, so it would hardly be the most
