      Main types of (legal) reasoning:


      - **Deductive**: general rule → specific conclusion (eg syllogism: all documents with these characteristics are
      valid wills; this one has them; so it is a valid will).

      - **Inductive**: specific cases → general principle (eg common law development).

      - **Analogical**: comparing cases; similar facts → similar outcomes (precedent).

      - **Abductive**: inference to the best explanation; plausibility, not certainty (from facts to the best available
