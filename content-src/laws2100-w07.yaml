      The reverse is true. Two lessons:


      - Specific claims defended by specific arguments are separable (though not disconnected) from an author's general
      view of the nature of law.

      - The real problem is whether legal reasoning is different in kind from other practical reasoning, reasoning
      geared towards action (in law, a decision).


      Finnis's view fits his criticism of Dworkin's one right answer thesis (incommensurability): legal indeterminacy is
      part of the law, and a natural law theory still explains it.


      Exam use: zoom in on the claim, zoom out to the theory, and say how far one follows from the other.
