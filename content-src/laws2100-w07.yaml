      Schauer's answer: perhaps, if we identify "methods of reasoning that are found everywhere but that are
      particularly concentrated and dominant in legal argument and decision-making, then the claim that there is
      something called legal reasoning will turn out to be justified" (p 8). Legal reasoning is special by
      concentration, not by being different in kind.


      Legal reasoning and the Rule of Law:


      - Legal reasoning goes with the inherent generality of law.

      - The belief in "a moderately distinct form of reasoning we call 'legal reasoning' is in the final analysis an
      empirical claim" (p 11).

      - "In a society governed by the wise and the good, legal reasoning is likely simply to get in the way", and the
      Rule of Law "would be at least superfluous, and quite possible pernicious" (ibid).


      Exam use: separate the empirical question (do judges reason differently?) from the conceptual one.
  - slug: speluncean-explorers-five-options
    title: The Speluncean Explorers — five options on § 12-A
    visual: diagram
    visual-brief: >-
      The statute "Whoever shall willfully take the life of another shall be punished by death" at the centre; five
      judges placed around it by distance from the text — Truepenny and Keen on it, Foster (purpose, state of nature)
      outside it, Tatting stepping back, Handy with public opinion — each tagged with the theory of law it voices.
    related:
      - schauer-thinking-like-a-lawyer
      - rules-standards-and-defeasibility
    depends-on:
      - laws2100-w04-natural-law-and-positivism
    contrasts-with:
      - laws2100-w05-theoretical-disagreement
    cases: []
    authorities:
      - fuller-the-case-of-the-speluncean-explorers
    verify: false
    body: >-
      Fuller's imaginary case (1949): four explorers trapped in a cave for 32 days killed and ate Roger Whetmore on day
      23; convicted, they are sentenced to hang. § 12-A: "Whoever shall willfully take the life of another shall be
      punished by death."


      Five options:


      1. **Truepenny CJ**: apply § 12-A regardless of the results; clemency can mitigate the rigours of the law.

      2. **Foster J (first argument)**: do not apply the law. Positive law is predicated on a human society; *cessante
      ratione legis, cessat et ipsa lex*; the men were in a state of nature.

      3. **Foster J (second argument)**: apply the law in the light of its purpose. "A man may break the letter of the
      law without breaking the law itself"; by analogy with self-defence, an implicit exception. A question of
      "intelligent and unintelligent fidelity".

      4. **Tatting J**: more than one purpose, another explanation for self-defence, an exception of uncertain scope; he
      withdraws.

      5. **Handy J**: a question of practical wisdom; treat forms and abstract concepts as instruments; common sense and
      public opinion.


      **Keen J** also applies § 12-A, putting aside clemency and moral judgment. The supremacy of the legislature
      requires plain meaning: the question is "not the conjectural purpose of the rule, but its scope".


      Fuller's Postscript: the case brings into focus "divergent philosophies of law and government", live questions of
      choice that are "among the permanent problems of the human race".


      Exam use: match each judge to a theory of law and of the judicial office.
  - slug: rules-standards-and-defeasibility
    title: Convergence of rules and standards, and legal defeasibility
    visual: simulation
    visual-brief: >-
      A spectrum of "ruleness" from specific rule to vague standard: each exception the learner adds (service dogs, a
      minister, a murderer-heir) pulls the rule marker towards the middle, while concretising a standard ("drive
      carefully" → speed limits) pulls it back; a gauge shows certainty falling as exceptions pile up.
    related:
      - speluncean-explorers-five-options
      - hart-and-dworkin-on-judicial-discretion
    depends-on:
      - laws2100-w05-rules-principles-and-policies
    contrasts-with:
      - laws2100-w05-discretion-riggs-and-obligation
    cases:
      - church-of-the-holy-trinity-v-united-states
      - riggs-v-palmer
    authorities:
      - schauer-the-convergence-of-rules-and-standards
      - hart-the-concept-of-law
    verify: false
    body: >-
      Schauer suggests "the choice between rules and standards, between specific and vague directives, may not make
      nearly as much of a difference as is ordinarily assumed" (p 305). The conventional wisdom: a rule maker manages
      discretion by choosing specific rules (little discretion) or vague standards such as 'drive carefully' (more).
      Schauer places both on a continuous spectrum, a matter of degree, and advances the convergence hypothesis: over
      time interpreters push rules towards standards (the avoidance of rules, eg by finding exceptions) and standards
      towards rules (the concretization of standards). So regulatory specificity is less a tool for managing discretion
      "than has historically been thought" (319).


      Hart rejects Llewellyn's dilemma (the formalist's heaven or no rules): a promise is not kept when someone is
      dangerously ill, yet the rule survives. Rules may have "exceptions incapable of exhaustive statement". "A rule
      that ends with the word 'unless…' is still a rule." (CL 139)


      A rule is **defeasible** if capable of being defeated: a conclusion justified when certain criteria are met can be
      defeated if further criteria are met. In *Church of the Holy Trinity v United States* (1892) a clear statute
      banned importing aliens under contract to perform labour "of any kind", yet the Supreme Court held an English
      priest was not a foreign labourer: an implicit exception. *Riggs v Palmer* can be read the same way (unless the
      beneficiary murdered the testator).


      Open questions: is defeasibility due to language, rules or law? How does it bear on certainty and indeterminacy?
  - slug: hart-and-dworkin-on-judicial-discretion
    title: Hart and Dworkin on judicial discretion
    visual: diagram
    visual-brief: >-
      A narrow strait between Scylla (formalism) and Charybdis (rule-scepticism); Hart's boat takes the middle, entering
      a small gap marked "partly unregulated case" where the judge adds an interstitial piece; three Dworkin objections
      appear as flags, each answered by Hart's reply.
    related:
      - rules-standards-and-defeasibility
      - raz-and-finnis-on-legal-reasoning
    depends-on:
      - laws2100-w05-discretion-riggs-and-obligation
      - laws2100-w05-inclusive-and-exclusive-positivism
    contrasts-with:
      - laws2100-w05-law-as-integrity
    cases: []
    authorities:
      - hart-the-concept-of-law
      - dworkin-taking-rights-seriously
    verify: false
    body: >-
      For Hart, legal theory has either ignored or exaggerated the indeterminacies of legal rules. Systems compromise
      between two social needs: rules individuals can safely apply to themselves without fresh official guidance, and
      leaving open issues that can only be settled "when they arise in a concrete case" (CL 130). "Formalism and
      rule-scepticism are the Scylla and Charybdis of juristic theory"; the truth lies between them (CL 147).


      In the Postscript, the "sharpest direct conflict" with Dworkin is Hart's contention that there will always be
      "legally unregulated cases" in which the law is "partly indeterminate or incomplete" (CL 272). For Dworkin law
      includes explicit settled law and implicit legal principles, so the judge never steps outside the law, making new
      law.


      For Hart, in hard cases judges exercise law-making powers, but unlike a legislator's: constrained (no large-scale
      reforms or new codes), **interstitial**, and not arbitrary: judges must justify decisions by general reasons and
      act as a conscientious legislator.


      Dworkin's three criticisms and Hart's replies:


      1. A false description of what judges do in hard cases → judges "do not just push away their law books"; even
      Dworkin's theory incorporates choices.

      2. Undemocratic, as judges are not elected → a necessary, small price if judicial power is limited; delegated
      legislative power is familiar in modern democracies.

      3. Unjust, as retrospective legislation → in hard cases, by definition, there is no clear established law to
      justify expectations.


      Exam use: the first criticism is descriptive, the others normative; answer each on its level.
cases:
  - slug: church-of-the-holy-trinity-v-united-states
    name: Church of the Holy Trinity v United States
    citation: 143 U.S. 457 (1892)
    aglc: Church of the Holy Trinity v United States, 143 US 457 (1892)
    facts: >-
      The Church of the Holy Trinity, New York, made an employment contract with an English Anglican priest. The 1885
      Alien Contract Labour Law prohibited "the importation and migration of foreigners and aliens under contract or
      agreement to perform labor or service of any kind in the United States, its territories, and the District of
      Columbia."
    issue: >-
      Did the clear words of the statute ("labor or service of any kind") apply to a foreign minister brought over under
      contract?
    held: >-
      The US Supreme Court held that a minister was not a foreign laborer under the statute (even though he was a
      foreigner).
    ratio: >-
      As read in the lecture: despite the clarity of the provision, the Court identified an implicit exception that is
      not stated in the statute. The Court's own reasons are not set out in the materials.
    significance: >-
      A standard example in the literature on legal defeasibility (discussed by Schauer and many other authors): a clear
      rule defeated by an implicit exception. Its structure parallels Riggs v Palmer.
    why-here: >-
      Used to illustrate legal defeasibility and the avoidance of rules by identifying implicit exceptions to clear
      statutory rules.
    verify: true
