  - key: d17
    type: truefalse
    concept: speluncean-explorers-five-options
    difficulty: 2
    set: quickfire
    statement: Foster J's two arguments are independent, and either one is sufficient to justify acquittal.
    answer: true
    why: >-
      True: the slide says Foster J believes the law declares the defendants innocent on two independent arguments,
      either of which is sufficient to justify the acquittal.
  - key: d18
    type: truefalse
    concept: speluncean-explorers-five-options
    difficulty: 2
    set: quickfire
    statement: >-
      Keen J treats the moral question whether the defendants acted rightly or wrongly as central to the office of a
