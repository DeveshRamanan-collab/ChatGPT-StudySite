      - text: Fuller's view that law has an inner morality of eight principles
        why: >-
          Fuller's inner morality is a week 4 topic; the invalid-will example belongs to Hart's criticism of Austin in
          chapter 3.
      - text: The realist view that rules are not that important to judges at all
        why: The realists come in week 6; Hart's duty-imposing/power-conferring distinction is aimed at the command theory.
  - key: b12
    type: mcq
    concept: types-of-reasoning-and-rules
