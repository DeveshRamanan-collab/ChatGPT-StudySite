    title: Frederick Schauer, 'The Convergence of Rules and Standards'
    kind: article
    text: >-
      "…the choice between rules and standards, between specific and vague directives, may not make nearly as much of a
      difference as is ordinarily assumed." (305) "…it may be that the tool of regulatory specificity as a way of
      managing discretion is less a part of the toolbox of regulatory strategy and institutional design than has
