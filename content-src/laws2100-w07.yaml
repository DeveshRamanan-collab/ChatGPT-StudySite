questions:
  - key: a01
    type: mcq
    concept: raz-and-finnis-on-legal-reasoning
    difficulty: 1
    set: pretest
    stem: Which view of legal reasoning does Joseph Raz defend on the Week 7 slide?
    options:
      - text: Legal reasoning is technical reasoning, at least in large part not moral reasoning.
        why: >-
          Tempting because it is the view you might expect from a positivist, but these are Finnis's words on the slide;
          Raz says the opposite.
      - text: Legal reasoning is an instance of moral reasoning, though sometimes morally incorrect.
        correct: true
        why: >-
          Right: Raz rejects the strong thesis of the autonomy of legal reasoning and says legal reasoning is an
          instance of moral reasoning, sometimes based on morally deficient principles.
      - text: Legal reasoning is fully autonomous from morality because it applies only valid rules.
        why: >-
          This is the strong thesis of the autonomy of legal reasoning, which Raz expressly says he has rejected; it is
          the expected positivist view, not his.
      - text: Legal reasoning is whatever judges decide in response to the facts of the case.
        why: >-
          That is a realist-style scepticism about reasoning with rules; Raz is a positivist who makes a claim about the
          moral character of legal reasoning.
  - key: a02
    type: mcq
    concept: raz-and-finnis-on-legal-reasoning
    difficulty: 1
    stem: Which view of legal reasoning does John Finnis defend on the Week 7 slide?
    options:
      - text: It is technical reasoning, at least in large part not moral reasoning.
        correct: true
        why: >-
          Right: Finnis says "Legal reasoning, indeed, is technical reasoning, at least in large part not moral
          reasoning", despite being a natural law thinker.
      - text: It is always moral reasoning, because unjust law is not law at all.
        why: >-
          Tempting because Finnis is a natural law thinker, but he does not equate legal reasoning with moral reasoning,
          and week 4 showed he rejects the crude lex iniusta reading.
      - text: It is an instance of moral reasoning, even when based on mistaken principles.
        why: >-
          This is Raz's position on the slide. The surprise of the lecture is that the positivist says this and the
          natural law thinker does not.
      - text: It can always find the one right answer by weighing the relevant principles.
        why: >-
          Finnis says the opposite: classical natural law "makes no pretence that natural reason can determine the one
          right answer" when the sources are unclear.
  - key: a03
    type: mcq
    concept: raz-and-finnis-on-legal-reasoning
    difficulty: 2
    stem: Why does the lecture say the Raz and Finnis passages are surprising?
    options:
      - text: Because both authors abandon their general theories of law in their writing on legal reasoning.
        why: >-
          Too strong: the lecture says specific claims and general views are separable but not completely disconnected;
          neither author abandons his theory.
      - text: Because Raz and Finnis agree completely on the nature of legal reasoning and of law.
        why: >-
          They disagree on legal reasoning (moral versus largely technical) and on the nature of law (positivism versus
          natural law); the surprise is the direction of the disagreement.
      - text: Because the positivist calls legal reasoning moral and the natural law thinker calls it largely technical.
        correct: true
        why: >-
          Right: you might expect Raz to see a technical enterprise disconnected from morality and Finnis to connect it
          with morality; the reverse is what they say.
      - text: Because neither author had written anything about legal reasoning before these passages.
        why: >-
          The lecture says nothing of this kind; the point is about the content of their views compared with the camps
          they belong to.
  - key: a04
    type: mcq
    concept: raz-and-finnis-on-legal-reasoning
    difficulty: 2
    stem: What first lesson does the lecture draw from the Raz/Finnis contrast?
    options:
      - text: That a legal positivist cannot consistently say anything about morality at all.
        why: >-
          Raz says a great deal about morality here; the lesson is about how specific claims relate to general theories,
          not a ban on positivists discussing morality.
      - text: That specific claims defended by specific arguments are separable from an author's broader view of law.
        correct: true
        why: >-
          Right: the lecture stresses the difference between specific claims and broader views of the nature of law and
          legal theory: not completely disconnected, but separable.
      - text: That the labels "positivist" and "natural law" should be dropped from the unit entirely.
        why: >-
          The lecture keeps using the camps (it chose Raz and Finnis because they sit in two different camps); it asks
          you to place claims within them carefully.
  - key: a05
    type: mcq
    concept: raz-and-finnis-on-legal-reasoning
    difficulty: 2
    stem: >-
      The lecture's second lesson is that Raz's rejection of the "strong thesis of the autonomy of legal reasoning"
      grapples with which problem?
    options:
      - text: Whether legal doctrines can ever be valid without the approval of the legislature.
        why: >-
          Validity of doctrine is a question for theories of law such as Hart's rule of recognition; the problem named
          here concerns the nature of reasoning.
      - text: Whether judges should always defer to executive clemency in hard criminal cases.
        why: >-
          Clemency comes up with Truepenny CJ in the Speluncean Explorers, not in the discussion of Raz's thesis about
          legal reasoning.
      - text: Whether legal reasoning is different in important respects from how we reason through other problems.
        correct: true
        why: >-
          Right: the lecture says Raz is grappling with whether legal reasoning is, in some important sense, different
          from the way we reason through other problems in life.
      - text: Whether legal reasoning can be written down as a closed set of formal logical rules.
        why: >-
          A formalist idea that does not match the slide: the question is whether legal reasoning differs from moral and
          other practical reasoning, not whether it is formal logic.
  - key: a06
    type: mcq
    concept: raz-and-finnis-on-legal-reasoning
    difficulty: 1
    stem: The lecture calls reasoning geared towards action "practical reasoning". In law, what is the action?
    options:
      - text: A decision.
        correct: true
        why: >-
          Right: the lecture says in law the action is a decision; a judge uses the law to find a solution, a decision
          that will affect the parties.
      - text: A statute passed by the legislature.
        why: >-
          Legislating is an action too, but the lecture's example is the decision maker: a judge whose practical
          reasoning ends in a decision.
      - text: A moral judgment about the parties.
        why: >-
          A moral judgment may enter the reasoning (Raz), but the action the lecture names for law is the decision, not
          a verdict on the parties' character.
  - key: a07
    type: mcq
    concept: raz-and-finnis-on-legal-reasoning
    difficulty: 2
    stem: Finnis says much academic theory about legal reasoning "greatly exaggerates" what?
    options:
      - text: The extent to which judges ignore the facts of the case before them.
        why: >-
          This sounds like a comment on realism, but Finnis's target is overconfidence in reason, not claims about
          judges ignoring facts.
      - text: The extent to which reason can settle what is greater good or lesser evil.
        correct: true
        why: >-
          Right: Finnis says theory "greatly exaggerates the extent to which reason can settle what is greater good or
          lesser evil, and minimizes the need for authoritative sources".
      - text: The extent to which statutes can be applied without any interpretation at all.
        why: >-
          Finnis's worry runs the other way: he stresses the need for authoritative sources, rather than criticising
          theories for trusting statutes too much.
      - text: The extent to which moral rights and duties are absolute in every legal case.
        why: >-
          Finnis accepts "the few absolute moral rights and duties"; what he says is exaggerated is reason's power to
          settle greater good or lesser evil in countless other issues.
  - key: a08
    type: mcq
    concept: raz-and-finnis-on-legal-reasoning
    difficulty: 3
    stem: >-
      For Finnis, which sources are to be respected "as the only rational basis for judicial reasoning and decision" in
      the countless issues not directly involving absolute rights?
    options:
      - text: Principles of justice which a judge like Hercules could always find through constructive interpretation.
        why: >-
          Hercules is Dworkin's judge; Finnis criticises the one right answer thesis, so he would not rest judicial
          reasoning on that idea.
      - text: Authoritative sources, so far as they are clear and respect the few absolute moral rights and duties.
        correct: true
        why: >-
          Right: this is the slide's wording; authoritative sources, clear and respecting the few absolute moral rights
          and duties, are the only rational basis.
      - text: The judge's own sense of practical wisdom, informed by common sense and by public opinion.
        why: >-
          This is Handy J's approach in the Speluncean Explorers, the lecture's personification of legal realism, not
          Finnis's position.
      - text: The customs of the community, whatever their content and whether or not they are clear.
        why: >-
          Finnis specifies authoritative sources that are clear and respect absolute rights; "whatever their content"
          contradicts that qualification.
  - key: a09
    type: mcq
    concept: raz-and-finnis-on-legal-reasoning
    difficulty: 3
    contrasts-with:
      - laws2100-w05-law-as-integrity
    stem: >-
      A judge finds the legal sources unclear. What does Finnis's "natural law theory in the classical tradition" claim
      about her position?
    options:
      - text: That natural reason will reveal the one right answer if she reasons carefully enough.
        why: >-
          This is exactly what Finnis says classical natural law "makes no pretence" of doing; it is closer to Dworkin's
          one right answer thesis.
      - text: That she must decline to decide, since any decision would be arbitrary and unlawful.
        why: >-
          Declining to decide is Tatting J's move in Fuller's imaginary case; Finnis says nothing about withdrawing from
          a case.
      - text: That natural reason cannot claim to determine the one right answer to her question.
        correct: true
        why: >-
          Right: Finnis says the theory "makes no pretence that natural reason can determine the one right answer" for
          the judge who finds the sources unclear; indeterminacy is part of law.
      - text: That the sources must be clearer than they appear, because gaps in law are impossible.
        why: >-
          Denying gaps is closer to Dworkin's view; the lecture says for Finnis a judge can face a hard case, and legal
          indeterminacy is part of the law.
  - key: a10
    type: mcq
    concept: raz-and-finnis-on-legal-reasoning
    difficulty: 3
    stem: The lecture says Finnis's view of legal reasoning is "not really surprising" given what?
    options:
      - text: His acceptance of Hart's rule of recognition as the test of validity.
        why: >-
          Finnis uses Hart's concepts (week 1), but the lecture links his view on legal reasoning to his critique of
          Dworkin, not to the rule of recognition.
      - text: His criticism of Dworkin's one right answer thesis in light of incommensurability.
        correct: true
        why: >-
          Right: the lecture says this is not surprising if you think about how Finnis criticised Dworkin's one right
          answer thesis, drawing on the idea of incommensurability.
      - text: His agreement with the American legal realists that rules rarely matter to judges.
        why: >-
          Finnis insists on authoritative sources as the rational basis of decision; that is not realist
          rule-scepticism.
  - key: a11
    type: mcq
    concept: raz-and-finnis-on-legal-reasoning
    difficulty: 2
    stem: According to Raz, what do the legal systems of different countries make varying claims about?
    options:
      - text: When courts may, or must, deviate from legal doctrine that conflicts with morality.
        correct: true
        why: >-
          Right: the slide says systems make varying claims as to when courts are morally justified or even required to
          deviate from doctrine that conflicts with morality, and when to leave reform to others.
      - text: Whether moral reasoning should be allowed in court at all, given the separation of powers.
        why: >-
          Raz says legal reasoning is an instance of moral reasoning; the variation he describes concerns when courts
          deviate from doctrine, not whether morality is allowed.
      - text: Which theory of law — positivism or natural law — their judges are bound to accept.
        why: >-
          No system chooses a theory of law for its judges on the slide; the variation is in doctrines of balancing the
          powers of the organs of government.
      - text: How many judges must agree before a precedent becomes binding in later cases.
        why: >-
          Nothing on the slide concerns voting rules for precedent; it concerns deviation from doctrine and leaving
          reform to other branches of government.
  - key: a12
    type: mcq
    concept: raz-and-finnis-on-legal-reasoning
    difficulty: 2
    stem: Raz says courts ought to follow their system's principles, "which are moral principles, though they may be…" what?
    options:
      - text: unwritten principles
        why: >-
          Being unwritten is not the qualification Raz gives; his point is that the principles, though moral, may be
          wrong ones.
      - text: mistaken moral principles
        correct: true
        why: >-
          Right: "which are moral principles, though they may be mistaken moral principles"; so legal reasoning is
          sometimes morally incorrect or based on deficient principles.
      - text: principles of efficiency
        why: >-
          Efficiency is the positivist reading of Fuller's principles of legality, a different topic; Raz calls these
          principles moral, possibly mistaken ones.
  - key: a13
    type: mcq
    concept: raz-and-finnis-on-legal-reasoning
    difficulty: 3
    contrasts-with:
      - laws2100-w04-natural-law-and-positivism
    stem: >-
      Consider this claim: "Since Raz is a positivist, he must hold that legal reasoning is disconnected from morality."
      How does the lecture treat it?
    options:
      - text: As correct, because separating law and morals is the core of every positivist theory.
        why: >-
          The separation of law and morals is about the identification of law; Raz's own words show a positivist can
          call legal reasoning moral reasoning.
      - text: As correct about Hart and Kelsen but not about Raz, who is really a natural law thinker.
        why: >-
          The lecture says we know that Raz is a legal positivist; the claim goes wrong by inferring his view of
          reasoning from his theory of law.
      - text: 'As a mistake: it infers a specific claim about reasoning from a general theory of law.'
        correct: true
        why: >-
          Right: the lecture warns that specific claims and broader views of law are separable; Raz, the positivist,
          says legal reasoning is an instance of moral reasoning.
      - text: As a mistake, because Raz argues morality is the only source of law in every system.
        why: >-
          Raz is a positivist and makes no such claim; the mistake in the statement is the inference, not a hidden
          natural law commitment.
  - key: a14
    type: mcq
    concept: raz-and-finnis-on-legal-reasoning
    difficulty: 4
    stem: >-
      An essay argues: "Finnis calls legal reasoning technical, so natural law theory has nothing to say about
      adjudication." What is the best response from the Week 7 materials?
    options:
      - text: 'Agree: once legal reasoning is technical, a natural law theory has no work left to do in adjudication.'
        why: >-
          Finnis's natural law theory still explains indeterminacy and respects absolute rights; and his "further
          questions" include what role law should play in adjudication.
      - text: >-
          Disagree: technical reasoning is bounded by the few absolute moral rights, and natural law still explains
          indeterminacy.
        correct: true
        why: >-
          Right: authoritative sources count only so far as they respect the few absolute moral rights and duties, and
          the lecture says natural law still tries to explain legal indeterminacy.
      - text: Disagree, because Finnis in fact says legal reasoning is an instance of moral reasoning after all.
        why: >-
          That is Raz's claim, not Finnis's; the response has to work with what Finnis actually says, which is "at least
          in large part not moral reasoning".
      - text: Agree, because Finnis accepts Dworkin's view that judges find the one right answer in the law itself.
        why: Finnis criticises the one right answer thesis; this option reverses his position on Dworkin.
  - key: a15
    type: mcq
    concept: raz-and-finnis-on-legal-reasoning
    difficulty: 4
    stem: Which question best captures the jurisprudential problem behind both the Raz and the Finnis passages?
    options:
      - text: Is legal reasoning really practical reasoning, or just a kind of formal logic?
        why: >-
          Both authors treat legal reasoning as reasoning towards decisions; the lecture's problem is whether it is
          special compared with other reasoning, not whether it is logic.
      - text: Is legal reasoning different in kind from moral and other practical reasoning?
        correct: true
        why: >-
          Right: the lecture says the passages force us to think about the nature of legal reasoning vis-à-vis other
          types of reasoning, the problem all these authors try to solve.
      - text: Should judges be elected, so that their moral reasoning becomes democratic?
        why: >-
          Democratic legitimacy is Dworkin's second criticism of judicial discretion, later in the lecture; it is not
          the problem these two passages share.
      - text: Can a theory of law ever be general and descriptive, as Hart claims it can be?
        why: >-
          That is the week 1 question and essay question 1; related, but the Raz/Finnis passages are about legal
          reasoning, not about the method of legal theory.
  - key: a16
    type: truefalse
    concept: raz-and-finnis-on-legal-reasoning
    difficulty: 1
    set: quickfire
    statement: Raz says he has rejected the strong thesis of the autonomy of legal reasoning.
    answer: true
    why: >-
      True: the slide opens with "I have rejected the strong thesis of the autonomy of legal reasoning. Legal reasoning
      is an instance of moral reasoning."
  - key: a17
    type: truefalse
    concept: raz-and-finnis-on-legal-reasoning
    difficulty: 1
    set: quickfire
    statement: Finnis, as a natural law thinker, says legal reasoning is an instance of moral reasoning.
    answer: false
    why: >-
      False: that is Raz. Finnis says legal reasoning "is technical reasoning, at least in large part not moral
      reasoning", which is the surprise of the lecture.
  - key: a18
    type: truefalse
    concept: raz-and-finnis-on-legal-reasoning
    difficulty: 2
    set: quickfire
    statement: For Finnis, legal indeterminacy is part of the law, and a natural law theory still tries to explain it.
    answer: true
    why: >-
      True: the lecture reads Finnis as saying a judge can face a hard case where the sources are unclear, and natural
      law makes no pretence of the one right answer there.
  - key: a19
    type: truefalse
    concept: raz-and-finnis-on-legal-reasoning
    difficulty: 2
    set: quickfire
    statement: >-
      The lecture concludes that an author's specific claims about legal reasoning are completely disconnected from
      their theory of law.
    answer: false
    why: >-
      False: the lecture says the claims, arguments and views are "not completely disconnected, but they are separable"
      for the purposes of analysis.
  - key: a20
    type: short
    concept: raz-and-finnis-on-legal-reasoning
    difficulty: 3
    prompt: >-
      "The positivist Raz calls legal reasoning moral reasoning; the natural law thinker Finnis calls it technical. The
      labels 'positivist' and 'natural law' therefore tell us nothing about legal reasoning." Discuss.
    model: >-
      The labels tell us less than we might expect, but not nothing. Thesis: a theory of law does not settle a view of
      legal reasoning, yet each view still makes sense within its theory. Argument: Raz rejects the strong thesis of the
      autonomy of legal reasoning: legal doctrines are justified only if morally justified, and courts follow principles
      that are moral, though possibly mistaken. Finnis says legal reasoning is "technical reasoning, at least in large
      part not moral reasoning", and relies on clear authoritative sources that respect the few absolute moral rights.
      So the expected pairing is reversed. Counterargument: each view connects to the author's theory. Finnis's view
      fits his critique of Dworkin's one right answer thesis (incommensurability) and his claim that natural law
      explains indeterminacy; Raz's moral reading concerns the justification of following law, not its identification.
      Evaluation: the lecture's lesson is that specific claims and general views are separable but not disconnected; the
      real question both answer is whether legal reasoning differs in kind from practical reasoning.
    rubric:
      - id: r1
        criterion: Thesis — takes a position on how far the labels predict a view of legal reasoning.
        marks: 2
        top-band: 'States a qualified thesis at once: the labels do not settle the view, but the views still fit their theories.'
        margin-note: Nothing, or less than expected? Commit.
        authorities: []
      - id: r2
        criterion: Argument — sets out Raz's and Finnis's claims accurately, with their key phrases.
        marks: 3
        top-band: >-
          Quotes "instance of moral reasoning" and "technical reasoning, at least in large part not moral reasoning" and
          explains the reversal.
        margin-note: Accurate quotations — good.
        authorities: []
      - id: r3
        criterion: Counterargument — shows how each view connects to the author's general theory.
        marks: 3
        top-band: >-
          Links Finnis to his critique of the one right answer thesis and to indeterminacy, and Raz to the moral
          justification of following doctrine.
        margin-note: Where does Finnis's critique of Dworkin come in?
        authorities: []
      - id: r4
        criterion: Evaluation — uses the separable-but-connected lesson and names the underlying question.
        marks: 2
        top-band: >-
          Concludes that the real issue is whether legal reasoning differs in kind from practical reasoning, and zooms
          back out to the theories.
        margin-note: 'Zoom in / zoom out: nicely done.'
        authorities: []
  - key: b01
    type: mcq
    concept: types-of-reasoning-and-rules
    difficulty: 1
    set: pretest
    stem: >-
      On the Week 7 slide, which type of reasoning moves from specific cases to a general principle (eg common law
      development)?
    options:
      - text: Deductive reasoning
        why: 'Deduction runs the other way: from a general rule to a specific conclusion, as in a syllogism.'
      - text: Inductive reasoning
        correct: true
        why: >-
          Right: the slide defines inductive reasoning as specific cases → general principle, with common law
          development as the example.
      - text: Abductive reasoning
        why: >-
          Abduction is inference to the best explanation of a set of facts; it concludes with a hypothesis, not a
          general principle drawn from cases.
      - text: Reasoning by principle
        why: >-
          Reasoning by principle weighs and balances competing principles or values; it does not build a principle out
          of cases.
  - key: b02
    type: mcq
    concept: types-of-reasoning-and-rules
    difficulty: 1
    stem: >-
      The slide describes one type of reasoning as "inference to the best explanation; plausibility, not certainty".
      Which is it?
    options:
      - text: Analogical reasoning
        why: >-
          Analogy compares cases (similar facts → similar outcomes); it is not defined as inference to the best
          explanation.
      - text: Purposive reasoning
        why: >-
          Purposive reasoning reads a rule in light of its purpose or rationale; it is not about explaining a set of
          facts.
      - text: Abductive reasoning
        correct: true
        why: >-
          Right: abductive reasoning starts with an observation or set of facts and concludes with the best available
          hypothesis to explain them.
      - text: Deductive reasoning
        why: >-
          Deduction gives certainty if the premises are true (general rule → specific conclusion); the slide contrasts
          abduction as plausibility, not certainty.
  - key: b03
    type: mcq
    concept: types-of-reasoning-and-rules
    difficulty: 2
    stem: >-
      All documents with these characteristics are valid wills; this document has all the required characteristics;
      therefore this document is a valid will. Which type of reasoning is this?
    options:
      - text: Deductive reasoning, in the form of a syllogism
        correct: true
        why: >-
          Right: this is the lecture's own example of deductive reasoning: from a general rule to a specific conclusion,
          in syllogistic form.
      - text: Inductive reasoning, generalising from past cases
        why: >-
          Nothing is generalised from cases here: the general rule comes first and the conclusion about this document
          follows from it.
      - text: Analogical reasoning, comparing it with earlier wills
        why: >-
          No earlier will is compared; the conclusion follows from the rule and the facts, not from similarity to
          precedent.
  - key: b04
    type: mcq
    concept: types-of-reasoning-and-rules
    difficulty: 2
    stem: >-
      A court notes that an earlier case on a delivery van is closely similar to the present case on a delivery ute, and
      decides the same way. Which type of reasoning is this?
    options:
      - text: Deductive reasoning from a general statutory rule
        why: No general rule is being applied syllogistically; the court reasons from the similarity of two cases.
      - text: Abductive reasoning to the best explanation of the facts
        why: >-
          Abduction concludes with a hypothesis explaining facts; here the court concludes with an outcome because the
          facts are similar.
      - text: Analogical reasoning (precedent)
        correct: true
        why: >-
          Right: comparing cases, similar facts → similar outcomes, is analogical reasoning, the slide's example being
          precedent.
      - text: Reasoning by principle, weighing competing values
        why: No values are weighed against each other; the decisive move is the comparison between the two cases.
  - key: b05
    type: mcq
    concept: types-of-reasoning-and-rules
    difficulty: 2
    variant-of: b04
    stem: >-
      A judge asks what mischief a statute was enacted to remedy, and reads its words to serve that aim. Which type of
      reasoning is this?
    options:
      - text: Inductive reasoning, generalising from cases
        why: The judge is not generalising from a series of cases; she is reading one rule in light of what it is for.
      - text: Purposive/teleological reasoning
        correct: true
        why: >-
          Right: the slide defines purposive or teleological reasoning as reasoning in light of a rule's underlying
          purpose or rationale.
      - text: Deductive reasoning from the words of the rule
        why: >-
          Pure deduction applies the words as a premise; here the judge goes behind the words to the rule's aim, as
          Foster J does in Fuller's case.
      - text: Abductive reasoning to the best explanation
        why: >-
          Finding the best hypothesis for a set of facts is abduction; here the object is the purpose of a rule, which
          the slide calls purposive reasoning.
  - key: b06
    type: mcq
    concept: types-of-reasoning-and-rules
    difficulty: 2
    variant-of: b04
    stem: >-
      A court balances freedom of expression against protection of reputation, with no fixed rule telling it which
      prevails. Which type of reasoning is this?
    options:
      - text: Reasoning by principle
        correct: true
        why: >-
          Right: the slide defines reasoning by principle as weighing and balancing competing principles or values, not
          fixed rules.
      - text: Deductive reasoning from a rule
        why: 'There is no fixed rule to deduce from, which is the point: the court weighs values instead.'
      - text: Analogical reasoning from precedent
        why: >-
          Precedent could be in the background, but the reasoning described is the weighing of two competing values
          against each other.
      - text: Inductive reasoning from cases
        why: No general principle is being built from specific cases; two principles already exist and are balanced.
  - key: b07
    type: mcq
    concept: types-of-reasoning-and-rules
    difficulty: 1
    stem: Which type of rule imposes a duty NOT to act ("X must not do Y")?
    options:
      - text: Mandatory rules
        why: Mandatory rules impose a duty to act ("X must do Y"); the negative form is a different category on the slide.
      - text: Permissive rules
        why: Permissive rules grant a liberty or option ("X may do Y"); they impose no duty at all.
      - text: Prohibitive rules
        correct: true
        why: 'Right: the slide defines prohibitive rules as imposing a duty not to act, "X must not do Y".'
      - text: Constitutive rules
        why: >-
          Constitutive rules create the activity or institution itself (contracts, marriage); they are not defined by a
          duty to refrain.
  - key: b08
    type: mcq
    concept: types-of-reasoning-and-rules
    difficulty: 2
    stem: Which example on the slide illustrates a power-conferring rule?
    options:
      - text: A rule that drivers must stop at a red traffic light
        why: >-
          This imposes a duty to act (stop), so it is a mandatory rule; it does not confer a power to change legal
          relations.
      - text: A rule that you may walk your dog on the beach before 9 am
        why: >-
          This grants a liberty ("X may do Y"), so it is permissive; a power changes legal relations, a liberty does
          not.
      - text: Making a will, or passing legislation
        correct: true
        why: >-
          Right: power-conferring rules confer legal power to create, change or extinguish legal relations; the slide's
          examples are making a will and passing legislation.
      - text: A rule that no-one may sleep in any railway station
        why: This is Fuller's prohibitive rule (a duty not to act), backed by a fine; it confers no power on anyone.
  - key: b09
    type: mcq
    concept: types-of-reasoning-and-rules
    difficulty: 2
    stem: >-
      Which type of rule "creates the activity/institution itself" (eg rules defining contracts, marriage,
      corporations)?
    options:
      - text: Constitutive rules
        correct: true
        why: >-
          Right: constitutive rules create the activity or institution itself; the lecture adds that a goal in football
          exists only because the rules of football create it.
      - text: Power-conferring rules
        why: >-
          Close, and the lecture says constitutive rules build on the power-conferring insight, but the slide lists them
          separately: they create the institution itself.
      - text: Mandatory rules
        why: >-
          Mandatory rules impose a duty to act; they regulate conduct that exists independently rather than creating the
          activity.
  - key: b10
    type: mcq
    concept: types-of-reasoning-and-rules
    difficulty: 3
    stem: >-
      The lecture's example of a constitutive rule outside law is what counts as a goal in football. What point does
      this make?
    options:
      - text: That football rules are a kind of law, because they are enforced by referees with sanctions.
        why: >-
          The lecture does not say football rules are law; the point is that the type of rule exists in law and in other
          areas alike.
      - text: That constitutive rules, like most types of rules and reasoning, are not unique to the legal domain.
        correct: true
        why: >-
          Right: the lecture stresses that these rules exist in other areas as well; a goal is created by the rules of
          the game, as a contract is by legal rules.
      - text: That constitutive rules impose duties on players, which is how they differ from power-conferring rules.
        why: >-
          Constitutive rules are defined by creating an activity, not by imposing duties; the football example shows
          creation, not obligation.
      - text: That games cannot have constitutive rules unless a legislature has first authorised the game.
        why: 'The example shows the opposite: games have constitutive rules of their own, without any legal authorisation.'
  - key: b11
    type: mcq
    concept: types-of-reasoning-and-rules
    difficulty: 3
    contrasts-with:
      - laws2100-w02-harts-chapter-iii-objections
    stem: >-
