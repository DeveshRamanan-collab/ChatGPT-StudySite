        why: >-
          Wrong — a ban on all trade and finance hits the whole state; targeted sanctions focus on commodities, groups
          or individuals.
      - text: An art 42 measure, because severe economic pressure counts as force.
        why: >-
          Wrong — art 41 expressly covers interruption of economic relations; economic pressure is not "armed force"
          under art 42.
      - text: An art 40 provisional measure, without prejudice to Z's rights.
        why: >-
          Wrong — art 40 measures are steps the parties are called on to take; this is a coercive art 41 decision
          imposed on all members.
