    slug: collective-security-and-the-un-system
    title: Collective security and the UN system
    visual: diagram
    visual-brief: >-
      A hub: every state's claim to use force drawn in to one centre, the Security Council, with three tools leaving it
      — Chapter VI peaceful settlement (art 33), Chapter VII without force (art 41), Chapter VII with force (art 42).
    related:
