  - key: q421
    type: short
    concept: article-39-determination-and-provisional-measures
    difficulty: 3
    prompt: >-
      Scenario: After a coup d'état in the state of Aeystan, fighting breaks out between various armed factions across
      the country. It is unclear who is currently holding power in Aeystan, and the country risks sinking into a
      protracted civil war – with devastating humanitarian consequences for civilian populations. Thousands have already
      fled across the borders. The neighbouring countries of Belandia and Ceria support different armed factions in
      Aeystan through the supply of arms and training. Journalists have even spotted troops of both countries in
      Aeystan, but Belandia and Ceria continue to deny their involvement. A regional organisation of which all three
      countries are members – the ABC Union – appeals to the UN Security Council for action to restore international
      peace and security.


      a. What steps must the UN Security Council follow in maintaining or restoring international peace and security?
    model: >-
      The Council has primary responsibility for international peace and security (art 24) and its decisions bind all

      members (art 25). It first has its Chapter VI tools: it can investigate the situation (art 34), call on the
      parties to

      settle by peaceful means (art 33(2)) and recommend procedures (art 36(1)). The ABC Union's appeal brings the
      matter

      before it (any UN member could also do so under art 35).


      To act under Chapter VII, the Council must first determine the existence of a threat to the peace, breach of the

      peace or act of aggression (art 39). Although the fighting began internally, practice treats internal armed
      conflicts

      and serious human rights or IHL violations as threats, and here refugees are crossing borders and Belandia's and

      Ceria's arms, training and reported troops give the conflict an international dimension.


      Before deciding measures, it may call on the parties to comply with provisional measures — a ceasefire, withdrawal
      of

      foreign troops — without prejudice to their claims, taking account of any failure to comply (art 40). It then
      decides

      measures not involving armed force (art 41) and, only if it considers these would be or have proved inadequate,

      action by armed force (art 42). Any decision is subject to the P-5 veto (art 27(3)).
    rubric:
      - id: r1
        criterion: Identifies the Council's authority and Chapter VI options
        marks: 2
        top-band: Grounds the Council's role in arts 24–25 and uses arts 33–36 before coercion.
        margin-note: Start with why the Council acts at all — then its peaceful tools.
        authorities:
          - un-charter-art-24
          - un-charter-art-25
          - un-charter-art-33-1
      - id: r2
        criterion: Art 39 determination applied to an internal conflict
        marks: 3
        top-band: >-
          Applies the evolving practice (internal conflict, serious violations) and the cross-border facts — refugees,
          foreign arms and troops.
        margin-note: Is a civil war a "threat to the peace"? Use the practice and the refugee and foreign-troop facts.
        authorities:
          - un-charter-art-39
      - id: r3
        criterion: Art 40 provisional measures
        marks: 2
        top-band: Suggests concrete provisional measures and notes they are without prejudice to the parties' positions.
        margin-note: What could the Council ask for right now, before sanctions?
        authorities:
          - un-charter-art-40
      - id: r4
        criterion: Escalation to arts 41 and 42, and limits
        marks: 3
        top-band: >-
          States art 41 before art 42, the "would be or have proved inadequate" condition, and the veto as a practical
          limit.
        margin-note: Force is the last resort — what is the textual condition in art 42?
        authorities:
          - un-charter-art-41
          - un-charter-art-42
  - key: q501
    type: mcq
    concept: non-forcible-measures-under-article-41
    difficulty: 1
    stem: Which of these does art 41 itself give as an example of a measure not involving the use of armed force?
    options:
      - text: Severance of diplomatic relations.
        correct: true
        why: >-
          Correct — art 41 lists complete or partial interruption of economic relations and of means of communication,
          and "the severance of diplomatic relations".
      - text: A naval blockade of the state's ports.
        why: >-
          Tempting because a blockade cuts off trade, but art 42 lists "blockade" among operations by air, sea or land
          forces; it is a use of force.
      - text: Demonstrations by air, sea or land forces.
        why: Wrong — "demonstrations" by armed forces are named in art 42, not art 41; they involve the use of armed force.
      - text: A no-fly zone enforced by members' aircraft.
        why: >-
          Wrong — enforcing a no-fly zone (Libya 2011, Res 1973) appears in the slides among authorisations of force,
          not art 41 measures.
  - key: q502
    type: mcq
    concept: non-forcible-measures-under-article-41
    difficulty: 2
    stem: What does the lecture mean in calling art 41's list "non-exhaustive"?
    options:
      - text: The Council may use any measure at all under art 41, including armed force.
        why: >-
          Wrong — art 41 covers only "measures not involving the use of armed force"; the list is open, but the category
          is not.
      - text: The Council may adopt non-military measures beyond those named, such as tribunals.
        correct: true
        why: >-
          Correct — the slides say art 41 gives the Council a wide scope of non-military coercive measures, and can
          include sanctions, arms embargoes and even ad hoc criminal tribunals.
      - text: The listed measures are only examples for the Assembly to recommend.
        why: >-
          Wrong — art 41 is a Security Council power ("the Security Council may decide"); the Assembly has no role in
          it.
      - text: Member states may add their own unilateral measures to a Council regime without any limit.
        why: >-
          Not what "non-exhaustive" means here: it describes the Council's choice of measures, and the slides say
          implementation depends on how states interpret the Council's regime.
  - key: q503
    type: mcq
    concept: non-forcible-measures-under-article-41
    difficulty: 2
    stem: What are comprehensive sanctions, as described in the slides?
    options:
