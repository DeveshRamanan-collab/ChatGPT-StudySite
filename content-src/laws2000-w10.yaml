  - key: q710
    type: mcq
    concept: un-peacekeeping-operations
    difficulty: 3
    stem: >-
      State K's government and the main rebel group agree a ceasefire and invite a neutral UN force to monitor it. The
      force may fire only in self-defence. What kind of operation is this?
    options:
      - text: A traditional UN peacekeeping operation.
        correct: true
        why: >-
          Correct — consent of the parties, impartiality and non-use of force except in self-defence are the three
          traditional principles of peacekeeping.
      - text: An art 42 enforcement action, since any armed UN presence is a use of force.
        why: >-
          Wrong — an armed presence with consent and force only in self-defence keeps the peace; art 42 action enforces
          it.
      - text: An art 53 regional enforcement action authorised by the Security Council.
        why: >-
          Wrong — art 53 concerns regional organisations enforcing Council decisions; this is a UN force invited by the
          parties.
      - text: An implied authorisation, because no resolution expressly authorises force.
        why: >-
          Wrong — implied authorisation concerns states claiming authority to use force; here the UN force acts with
          consent and only in self-defence.
