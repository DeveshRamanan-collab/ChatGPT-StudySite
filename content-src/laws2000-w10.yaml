      committed is referred to the Prosecutor by the Security Council acting under Chapter VII of the Charter of the
      United Nations".
    gloss: >-
      The Security Council, acting under Chapter VII, can refer a situation to the ICC Prosecutor — e.g. Darfur (2005) —
      although the ICC is not part of the UN.
  - kind: other
