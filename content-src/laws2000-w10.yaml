  - key: q620
    type: short
    concept: authorisation-of-force-under-article-42
    difficulty: 4
    prompt: >-
      In March 2003 a coalition led by the US and UK, including Australia, invaded Iraq. Explain the "revived
      authorisation" argument the coalition relied on, and evaluate it by reference to the Charter and the Security
      Council resolutions discussed in the lecture.
    model: >-
      Issue: whether the 2003 invasion was authorised by the Security Council under Chapter VII.


      Law: force is prohibited by art 2(4); art 42 is an exception, a last resort, under which the Council may act when
      art 41

      measures would be or have proved inadequate. Because art 43 was never implemented, the Council authorises states —

      as in Res 678 (1990), which authorised members co-operating with Kuwait "to use all necessary means".


      The argument: the US letter of 20 March 2003 claimed authority under Res 678 and 687. Res 687's disarmament

      obligations were conditions of the ceasefire; a material breach "removes the basis of the ceasefire and revives
      the

      authority to use force under resolution 678". Res 1441 (2002) found Iraq in material breach, gave it a "final

      opportunity" and recalled warnings of "serious consequences".


      Evaluation: Res 1441 contained no express authorisation; the coalition read authority into broad language — a
      revived

      or implied authorisation. Most other Council and UN members and the majority of scholars rejected this, and the
      UK's

      Chilcot inquiry found that not all peaceful options had been exhausted, undercutting the last-resort logic.


      Conclusion: the better view is that the invasion lacked Council authorisation.
    rubric:
      - id: r1
        criterion: Frames the issue within arts 2(4) and 42
        marks: 2
        top-band: Identifies authorisation as the only relevant exception in play and states the art 42 conditions.
        margin-note: 'Start from the prohibition: what exception is the coalition claiming?'
        authorities:
          - un-charter-art-2-4
          - un-charter-art-42
      - id: r2
        criterion: States the revival argument accurately
        marks: 3
        top-band: Sets out the 678 → 687 ceasefire → material breach → revival chain and the role of Res 1441.
