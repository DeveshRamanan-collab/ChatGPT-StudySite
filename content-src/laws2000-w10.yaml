  - key: q415
    type: mcq
    concept: article-39-determination-and-provisional-measures
    difficulty: 3
    stem: >-
      A Council resolution "calls upon" two warring factions to observe a ceasefire and withdraw to agreed lines,
      "without prejudice" to their claims, before it considers further measures. Which provision fits best?
    options:
      - text: Art 41 — measures not involving the use of armed force.
        why: >-
          Tempting because no force is involved, but art 41 measures are coercive (sanctions, embargoes); a call to
          comply pending further measures, without prejudice, is art 40.
      - text: Art 42 — action by air, sea, or land forces.
        why: >-
          Wrong — nothing here involves military action; art 42 is the last resort after art 41 measures are or would be
          inadequate.
      - text: Art 40 — provisional measures.
        correct: true
