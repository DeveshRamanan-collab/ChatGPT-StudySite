    title: Peaceful settlement of disputes under Chapter VI
    visual: palace
    visual-brief: >-
      A corridor of the art 33(1) means in order — negotiation, enquiry, mediation, conciliation, arbitration, judicial
      settlement, regional agencies — then a room of the Council's Chapter VI steps: investigate (art 34), receive
      referrals (art 35), recommend (art 36(1)), legal disputes to the ICJ (art 36(3)), unsettled disputes referred (art
      37(1)).
