cards:
  - type: basic
    concept: collective-security-and-the-un-system
    front: What is collective security?
    back: >-
      A system where war and aggression are the concern of all states, not a private dispute between states: war against
      one is war against all. The League of Nations and the UN were both founded on it (NATO is another example).
    source: Week 10 Lecture Slides, slide 7
  - type: cloze
    concept: collective-security-and-the-un-system
    text: 'The UN system centralises the permissible use of force to one body: {{c1::the Security Council}}.'
    source: Week 10 Lecture Slides, slide 7
  - type: basic
    concept: collective-security-and-the-un-system
    front: What are the three tools for maintaining peace and security in the slides' table?
    back: >-
      Peaceful settlement (Chapter VI, art 33); collective security without force (Chapter VII, art 41 — sanctions,
      peacekeeping without force); collective security with force (Chapter VII, art 42 — authorising member states,
      regional organisations or peacekeeping operations).
    source: Week 10 Lecture Slides, slide 11
  - type: apply
    concept: collective-security-and-the-un-system
    scenario: A minister says the Security Council's failure to stop a conflict proves collective security has no legal basis.
    answer: >-
      The Charter still centralises force in the Council; the takeaways concede it has not acted in every case (lack of
      capacity, the P-5 veto) — a limitation of the system, not its end.
    source: Week 10 Lecture Slides, slide 44
  - type: cloze
    concept: collective-security-and-the-un-system
    text: >-
      Art 1(1): the first Purpose of the UN is to maintain international peace and security by {{c1::effective
      collective measures}} against threats and aggression and by {{c2::peaceful}} settlement of disputes.
    source: Week 10 Lecture Slides, slide 5
  - type: basic
    concept: security-council-composition-and-powers
    front: What is the Security Council's composition (art 23)?
    back: >-
      15 UN member states: 5 permanent members with a veto (US, China, Russia, UK, France; veto = art 27(3)) and 10
      non-permanent members elected by the General Assembly for two-year terms, five each year — 3 Africa, 2 Asia, 2
      Latin America and Caribbean, 2 Western Europe and Others, 1 Eastern Europe.
    source: Week 10 Lecture Slides, slide 8
  - type: cloze
    concept: security-council-composition-and-powers
    text: >-
      Members confer on the Security Council {{c1::primary responsibility}} for the maintenance of international peace
      and security, and agree that it acts {{c2::on their behalf}} (art 24(1)).
    source: Week 10 Lecture Slides, slide 9
  - type: cloze
    concept: security-council-composition-and-powers
    text: >-
      Council decisions bind all members under art {{c1::25}}; under art {{c2::103}} Charter obligations prevail over
      obligations under any other international agreement.
    source: Week 10 Lecture Slides, slide 10
  - type: apply
    concept: security-council-composition-and-powers
    scenario: >-
      State X's bilateral treaty requires it to supply machinery to State Y; a Chapter VII decision requires all members
      to stop doing so.
    answer: >-
      X must comply with the Council's decision: it binds X under art 25, and art 103 makes the Charter obligation
      prevail over the bilateral treaty.
    source: Week 10 Lecture Slides, slide 10
  - type: cloze
    concept: peaceful-settlement-under-chapter-vi
    text: >-
      Art 33(1): parties to a dispute likely to endanger peace shall first seek a solution by {{c1::negotiation,
      enquiry, mediation, conciliation}}, {{c2::arbitration, judicial settlement}}, resort to regional agencies or
      arrangements, or other peaceful means of their own choice.
    source: Week 10 Lecture Slides, slide 13
  - type: basic
    concept: peaceful-settlement-under-chapter-vi
    front: What can the Security Council do under arts 34–37?
    back: >-
      Investigate any dispute or situation that might lead to friction (art 34); receive disputes from any member (art
      35); recommend procedures or methods of adjustment (art 36(1)); consider that the parties should generally refer
      legal disputes to the ICJ (art 36(3)); receive disputes the parties failed to settle (art 37(1)).
    source: Week 10 Lecture Slides, slide 14
  - type: basic
    concept: peaceful-settlement-under-chapter-vi
    front: Are the Council's Chapter VI powers binding?
    back: >-
      No — under Chapter VI it investigates, calls on the parties and recommends. Coercive measures come only under
      Chapter VII, after an art 39 determination.
    source: Week 10 Lecture Slides, slide 11
  - type: apply
    concept: peaceful-settlement-under-chapter-vi
    scenario: States M and N have negotiated and mediated a border dispute for years without success; tension is rising.
    answer: >-
      Art 37(1): having failed to settle by art 33 means, M and N shall refer the dispute to the Security Council —
      failure gives no licence to use force.
    source: Week 10 Lecture Slides, slide 14
  - type: cloze
    concept: article-39-determination-and-provisional-measures
    text: >-
      Under art 39 the Council shall determine the existence of any {{c1::threat to the peace}}, {{c2::breach of the
      peace}}, or {{c3::act of aggression}}, and recommend or decide measures under arts 41 and 42.
    source: Week 10 Lecture Slides, slide 16
  - type: basic
    concept: article-39-determination-and-provisional-measures
    front: Which situations has the Council treated as within its art 39 power?
    back: >-
      An evolving interpretation in practice: proliferation of nuclear, chemical or biological weapons; internal armed
      conflicts; terrorism; serious human rights or IHL violations; the 2014 Ebola outbreak in Africa.
    source: Week 10 Lecture Slides, slide 16
  - type: basic
    concept: article-39-determination-and-provisional-measures
    front: What are art 40 provisional measures?
    back: >-
      Measures the Council calls on the parties to comply with, before recommending or deciding measures under art 39,
      to prevent an aggravation of the situation; without prejudice to the parties' rights, claims or position; the
      Council takes account of failure to comply.
    source: Week 10 Lecture Slides, slide 17
  - type: cloze
    concept: article-39-determination-and-provisional-measures
    text: >-
      Art 42 applies where the Council considers that art 41 measures {{c1::would be inadequate}} or {{c2::have proved
      to be inadequate}}.
    source: Week 10 Lecture Slides, slide 15
  - type: apply
    concept: article-39-determination-and-provisional-measures
    scenario: >-
      Aeystan: civil war after a coup, refugees crossing borders, neighbours arming factions; the ABC Union appeals to
      the Council.
    answer: >-
      Steps: Chapter VI tools (arts 33–36); an art 39 determination (internal conflict and spill-over as a threat to the
      peace); art 40 provisional measures (ceasefire, withdrawal); art 41 measures; art 42 only if art 41 would be or
      has proved inadequate.
    source: Week 10 Tutorial Tasks, Q2(a)
  - type: basic
    concept: non-forcible-measures-under-article-41
    front: Comprehensive v targeted ("smart") sanctions?
    back: >-
      Comprehensive: financial, trade and other economic measures against a state (Iraq in the 1990s; North Korea today)
      — controversial for their impact on populations. Targeted: specific commodities (conflict diamonds) or particular
      groups, corporations or individuals (travel bans, asset freezes).
    source: Week 10 Lecture Slides, slide 20
  - type: cloze
    concept: non-forcible-measures-under-article-41
    text: >-
      Art 41 measures not involving armed force include complete or partial interruption of {{c1::economic relations}}
      and of means of communication, and {{c2::the severance of diplomatic relations}}.
    source: Week 10 Lecture Slides, slide 15
  - type: basic
    concept: non-forcible-measures-under-article-41
    front: How does the Security Council relate to the ICC?
    back: >-
      The ICC is not part of the UN, but the Council, acting under Chapter VII, can refer a situation to the ICC
      Prosecutor (Rome Statute art 13(b)) — e.g. Darfur, 2005.
    source: Week 10 Lecture Slides, slide 23
  - type: basic
    concept: non-forcible-measures-under-article-41
    front: Besides sanctions, what non-forcible measures do the slides place under art 41?
    back: >-
      Arms embargoes and the establishment of ad hoc international criminal tribunals, such as the ICTY and ICTR, to try
      people responsible for serious crimes under IHL.
    source: Week 10 Lecture Slides, slide 18
  - type: apply
    concept: non-forcible-measures-under-article-41
    scenario: >-
      The Council wants to stop two neighbouring states arming factions in a civil war without hurting their
      populations.
    answer: >-
      Art 41: an arms embargo plus targeted measures (travel bans, asset freezes on the officials and faction leaders
      involved), rather than comprehensive sanctions with their population impact.
    source: Week 10 Tutorial Tasks, Q2(b)
  - type: basic
    concept: authorisation-of-force-under-article-42
    front: What three points does the lecture make about art 42?
    back: >-
      It is an exception to the prohibition on the use of force in art 2(4); it is a last resort; and it relies on
      member states.
    source: Week 10 Lecture Slides, slide 24
  - type: cloze
    concept: authorisation-of-force-under-article-42
    text: >-
      Because art {{c1::43}} was never implemented, the Council authorises coalitions of states — e.g. Res {{c2::678}}
      (1990): "all necessary means" to restore Kuwait's sovereignty.
    source: Week 10 Lecture Slides, slide 25
  - type: basic
    concept: authorisation-of-force-under-article-42
    front: Which regional organisations do the slides list as authorised to enforce Council decisions (art 53)?
    back: >-
      ECOWAS (Liberia, Sierra Leone, Côte d'Ivoire); CIS (Tajikistan); African Union (Darfur); NATO (Libya); OAS
      (Haiti); OSCE (Georgia); EU (DRC).
    source: Week 10 Lecture Slides, slide 26
  - type: basic
    concept: authorisation-of-force-under-article-42
    front: What was the "revived authorisation" argument for the 2003 invasion of Iraq, and how was it received?
    back: >-
      The US letter of 20 March 2003: Iraq's material breach of Res 687's ceasefire terms revived the authority to use
      force under Res 678 (with Res 1441 recalling "serious consequences"). Most other states and most scholars rejected
      it; the UK's Chilcot inquiry found not all peaceful options had been exhausted.
    source: Week 10 Lecture Slides, slide 30
  - type: apply
    concept: authorisation-of-force-under-article-42
    scenario: >-
      A Council resolution condemns State R's occupation of a neighbour and demands withdrawal, but contains no
      authorising words. State S attacks R, citing it.
    answer: >-
      Not authorised: there is no express Chapter VII authorisation such as "all necessary means" — S is relying on an
      implied authorisation of the kind most states rejected over Iraq in 2003.
    source: Week 10 Lecture Slides, slide 31
  - type: cloze
    concept: un-peacekeeping-operations
    text: >-
      Traditional principles of peacekeeping: {{c1::consent of the parties}}, {{c2::impartiality}}, and {{c3::non-use of
      force except in self-defence}}.
    source: Week 10 Lecture Slides, slide 34
  - type: basic
    concept: un-peacekeeping-operations
    front: How does UN peacekeeping differ from a Chapter VII authorisation?
    back: >-
      Peacekeeping is not explicitly mentioned in the Charter, was created to keep the peace rather than enforce it, and
      is a UN operation — unlike an authorisation to one state or a group of states.
    source: Week 10 Lecture Slides, slide 33
  - type: basic
    concept: un-peacekeeping-operations
    front: How has peacekeeping evolved?
    back: >-
      The UN has acted as a transitional administration (Kosovo, Timor-Leste), and some missions are now authorised to
      use force to carry out their mandate (DRC, including targeted offensive operations; Mali).
    source: Week 10 Lecture Slides, slide 34
  - type: apply
    concept: un-peacekeeping-operations
    scenario: A government and rebels agree a ceasefire and invite a neutral UN force that may fire only in self-defence.
    answer: >-
      A traditional UN peacekeeping operation: consent of the parties, impartiality and non-use of force except in
      self-defence — a UN operation, not an art 42 authorisation to states.
    source: Week 10 Lecture Slides, slide 34
  - type: basic
    concept: general-assembly-and-secretary-general
    front: What is the General Assembly, and how does it vote?
    back: >-
      The UN's parliamentary body: all member states (currently 193), one state, one vote (art 18). Seen as the most
      "democratic" international organ, but with a minimal role in enforcement and a subsidiary responsibility for peace
      and security.
    source: Week 10 Lecture Slides, slide 38
  - type: cloze
    concept: general-assembly-and-secretary-general
    text: >-
      Art 12(1): while the Security Council is exercising its functions on a dispute or situation, the General Assembly
      shall not make any {{c1::recommendation}} on it unless {{c2::the Security Council so requests}} (Wall, paras
      27–28).
    source: Week 10 Lecture Slides, slide 40
  - type: basic
    concept: general-assembly-and-secretary-general
    front: What is Uniting for Peace (GA Res 377(V), 1950)?
    back: >-
      If the Council, because of lack of unanimity of the permanent members, fails to exercise its primary
      responsibility where there is a threat to the peace, breach of the peace or act of aggression, the Assembly
      considers the matter immediately with a view to recommending collective measures. Confirmed by the ICJ in Certain
      Expenses.
    source: Week 10 Lecture Slides, slide 41
  - type: basic
    concept: general-assembly-and-secretary-general
    front: What does the Secretary-General do for peace and security?
    back: >-
      Heads the Secretariat (an international civil service); appointed by the General Assembly for five years; may
      bring to the Council's attention any matter that may threaten international peace and security (art 99); exercises
      good offices in mediating crises, including through Special Representatives.
    source: Week 10 Lecture Slides, slide 43
  - type: apply
    concept: general-assembly-and-secretary-general
    scenario: A P-5 veto blocks a draft resolution on a conflict where civilians are being attacked.
    answer: >-
      Under Uniting for Peace the General Assembly can consider the matter immediately and recommend collective measures
      to members — recommendations, not binding decisions.
    source: Week 10 Lecture Slides, slide 41
  - type: basic
    concept: decisions-and-recommendations
    front: Which parts of a Security Council resolution bind members under art 25?
    back: >-
      Only the decisions. A resolution can mix recommendations (not binding) and decisions (binding); the wording,
      usually the verbs, shows which — and borderline wording is debated.
    source: Week 10 Lecture Transcript (Live), Part A.1; Week 10 Lecture Slides, slide 10
  - type: cloze
    concept: decisions-and-recommendations
    text: >-
      Art 39: the Security Council shall {{c1::make recommendations}}, or {{c2::decide}} what measures shall be taken in
      accordance with Articles 41 and 42.
    source: Week 10 Lecture Slides, slide 16
  - type: apply
    concept: decisions-and-recommendations
    scenario: >-
      A treaty obliges State A to sell oil to State B. The Council then decides under Chapter VII that no state may
      supply oil to State B.
    answer: >-
      The embargo is a decision, binding under art 25; art 103 makes A's Charter obligation prevail over the treaty. A
      must stop the sales.
    source: Week 10 Lecture Slides, slide 10; Week 10 Lecture Transcript (Live), Part A.1
  - type: basic
    concept: decisions-and-recommendations
    front: What example did the lecturer give of art 103 at work?
    back: >-
      Security Council sanctions that cut across obligations within the European Union: a court held the Council
      resolution overrode the treaty obligation. The case was not named and is not on the slides — check it before
      citing.
    source: Week 10 Lecture Transcript (Live), Part A.1
    verify: true
  - type: basic
    concept: article-39-findings-in-practice
    front: How has the Council used the three art 39 findings in practice?
    back: >-
      Act of aggression: never or very rarely. Breach of the peace: a very few invasions of territory (e.g. Iraq–Kuwait
      1990). Threat to the peace: the usual finding, widened to non-traditional threats.
    source: Week 10 Lecture Transcript (Live), Part A.1; Week 10 Lecture Slides, slide 16
  - type: cloze
    concept: article-39-findings-in-practice
    text: >-
      The Council's usual art 39 finding is a {{c1::threat to the peace}}; it has found a {{c2::breach of the peace}}
      only a very few times, and an {{c3::act of aggression}} never or very rarely.
    source: Week 10 Lecture Transcript (Live), Part A.1
  - type: apply
    concept: article-39-findings-in-practice
    scenario: A fast-spreading epidemic crosses several borders and overwhelms health systems; no state has used force.
    answer: >-
      The Council could determine a threat to the peace — its practice includes the 2014 Ebola outbreak in Africa —
      which opens Chapter VII; no breach or aggression is needed.
    source: Week 10 Lecture Slides, slide 16; Week 10 Lecture Transcript (Live), Part A.1
  - type: basic
    concept: article-39-findings-in-practice
    front: Why did the Council rarely act under Chapter VII during the Cold War?
    back: >-
      Tension between the US and Russia, sometimes acting through proxies in other states, made agreement on
      determinations and action hard to reach. The Council has been much more active since the Cold War.
    source: Week 10 Lecture Transcript (Live), Part A.1; Week 10 Lecture Slides, slide 44
  - type: basic
    concept: article-39-findings-in-practice
    front: Which conflicts did the lecture give as breaches of the peace?
    back: >-
      Iraq's invasion of Kuwait (1990) and the Iran–Iraq war (1980s). The Iran–Iraq example is named in the lecture
      only, not on the slides.
    source: Week 10 Lecture Transcript (Live), Part A.1
    verify: true
  - type: basic
    concept: collective-security-and-the-un-system
    front: Is "collective security" a legal term?
    back: >-
      No. The lecture called it an idea from international relations more than law: threats are dealt with collectively,
      through an organisation, instead of bilaterally. The League of Nations was the first attempt; the UN is the
      second.
    source: Week 10 Lecture Transcript (Live), Part A.1
  - type: apply
    concept: collective-security-and-the-un-system
    scenario: >-
      NATO members want to bomb a state's military bases to stop it threatening a neighbour. No NATO member has been
      attacked, and the Security Council has not acted.
    answer: >-
      NATO is bound by the Charter: with no Council authorisation (art 42; art 53 for regional enforcement) and no armed
      attack to ground self-defence (art 51), the use of force is not permitted.
    source: Week 10 Lecture Transcript (Live), Part A.1; Week 10 Lecture Slides, slides 7, 26
  - type: basic
    concept: collective-security-and-the-un-system
    front: Do you need to learn the UN system chart for the exam?
    back: >-
      No — the lecturer said not to learn it or keep it in exam notes. Focus on the principal organs: the General
      Assembly, Security Council, Secretariat and ICJ (ECOSOC barely; the Trusteeship Council not at all).
    source: Week 10 Lecture Transcript (Live), Part A.1
  - type: basic
    concept: article-39-determination-and-provisional-measures
    front: Give the lecture's examples of art 40 provisional measures, and how they are used in practice.
    back: >-
      A ceasefire; a cessation of hostilities; allowing the delivery of humanitarian aid. Though art 40 says "before",
      the Council often demands these alongside art 41 sanctions or an authorisation of force.
    source: Week 10 Lecture Transcript (Live), Part A.1; Week 10 Lecture Slides, slide 17
  - type: basic
    concept: non-forcible-measures-under-article-41
    front: Could the Council create the ICTY and ICTR under art 41?
    back: >-
      Yes. It was debated at first, since art 41 does not mention tribunals and the Council is a political organ, but
      members accepted it and it is no longer questioned: the list in art 41 is non-exhaustive ("include").
    source: Week 10 Lecture Transcript (Live), Part A.1; Week 10 Lecture Slides, slides 18, 23
  - type: basic
    concept: general-assembly-and-secretary-general
    front: Can the General Assembly consider a situation the Security Council is already dealing with?
    back: >-
      Traditionally it was thought not (art 12(1)). The lecture explained that this has evolved: the Assembly may
      consider it in parallel, usually taking a broader view while the Council works on detailed measures.
    source: Week 10 Lecture Transcript (Live), Part A.1; Week 10 Lecture Slides, slide 40
audio:
  title: Week 10 recap — collective security
  minutes: 3
  script: >-
    Collective security means war and aggression are everyone's concern, not a private dispute between two states:

    war against one is war against all. The League of Nations and the United Nations were both built on it, and the UN

    Charter puts it into practice by centralising the permissible use of force in one body, the Security Council.


    The Council has fifteen members. Five are permanent, with a veto under article 27(3): the US, China, Russia, the UK

    and France. Ten are elected by the General Assembly for two-year terms, along regional lines. Under article 24
    members

    give the Council primary responsibility for international peace and security, under article 25 they agree to carry
    out

    its decisions, and under article 103 those Charter obligations beat any conflicting treaty. Only decisions bind,
    though: a resolution can mix recommendations and decisions, and the wording shows which.


    The Council's tools come in order. First, Chapter VI, peaceful settlement: article 33 tells the parties to try

    negotiation, enquiry, mediation, conciliation, arbitration, judicial settlement or regional bodies, and the Council
    can

    investigate, call on them and recommend, sending legal disputes towards the ICJ. Then Chapter VII. Article 39 is the

    gateway: the Council must determine a threat to the peace, a breach of the peace or an act of aggression, and its

    practice now reaches internal conflicts, terrorism, proliferation, serious human rights violations, even Ebola. It
    almost always finds a threat; a breach only a few times, like Kuwait, and aggression hardly ever. Article

    40 lets it call for provisional measures without prejudice to anyone's claims.


    Article 41 covers measures without force: comprehensive sanctions, which hurt populations, and increasingly targeted

    ones like asset freezes and travel bans, arms embargoes, ad hoc tribunals like the ICTY and ICTR, and referrals to
    the

    ICC, as with Darfur. Article 42 is force, an exception to article 2(4) and a last resort. Because article 43 was
    never

    implemented, the Council authorises coalitions, as in resolution 678 in 1990 — "all necessary means" to free Kuwait
    —

    or regional organisations under article 53. The 2003 invasion of Iraq relied on a claimed revival of 678, which most

    states and scholars rejected.


    Peacekeeping isn't in the Charter at all. It keeps the peace rather than enforcing it, and rests on consent,

    impartiality and force only in self-defence, though missions in the DRC and Mali now have robust mandates. Finally,

    the General Assembly, 193 states with one vote each, has a subsidiary role: it can discuss and recommend, but not
    while

    the Council is dealing with a matter, unless Uniting for Peace applies because the permanent members are deadlocked.

    The Secretary-General can raise threats under article 99 and offers good offices.
