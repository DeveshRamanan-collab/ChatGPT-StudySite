    authorities:
      - un-charter-art-11-2
      - un-charter-art-12-1
      - un-charter-art-14
      - unga-resolution-377-v
    body: >
      The General Assembly is the parliamentary body of the UN, made up of all member states (currently 193). It is

      seen as the most "democratic" international organ but has a minimal role in enforcement. One state, one vote (art
      18).


      It has a subsidiary responsibility for international peace and security. It may discuss any question on it and,

      except as provided in art 12, make recommendations; a question on which action is necessary must be referred to
      the

      Council (art 11(2)). It may recommend measures for the peaceful adjustment of any situation (art 14; *Certain

      Expenses*, 1962). But while the Council is

      exercising its functions in respect of a dispute or situation, the Assembly shall not make any recommendation on
      it

      unless the Council so requests (art 12(1); *Wall* Advisory Opinion, paras 27–28). The lecture explained that the

      old view — no Assembly involvement while the Council deals with a matter — has evolved: the Assembly may now
      consider

      it in parallel, usually taking a broader view while the Council works on detail.


      Uniting for Peace (GA Res 377(V), 1950): if the Council, because of lack of unanimity of the permanent members,
      fails

      to exercise its primary responsibility, the Assembly shall consider the matter immediately with a view to

      recommending collective measures. The Cold War widened its role.


      The Secretary-General, appointed by the Assembly for five years, may bring any threat to the Council's attention

      (art 99) and offers good offices.


      Exam use: the Assembly recommends; the Council decides.
  - slug: decisions-and-recommendations
    title: Decisions and recommendations — which parts of a Council resolution bind
    visual: diagram
    visual-brief: >-
      One resolution split into its operative paragraphs: paragraphs that only recommend fall away as not binding;
      paragraphs that decide pass down a chain — art 25 (members accept and carry out the decision) → art 103 (the
      Charter obligation prevails over a conflicting treaty).
    related:
      - security-council-composition-and-powers
      - article-39-determination-and-provisional-measures
      - peaceful-settlement-under-chapter-vi
      - laws2000-w02-sources-beyond-article-38
    depends-on:
      - security-council-composition-and-powers
    contrasts-with:
      - general-assembly-and-secretary-general
    cases: []
    authorities:
      - un-charter-art-25
      - un-charter-art-103
      - un-charter-art-39
    verify: false
    body: >
      Art 25: members "agree to accept and carry out the decisions of the Security Council in accordance with the

      present Charter". The lecture stressed that this binding force attaches to decisions, not to everything the
      Council

      says. A single resolution may mix recommendations, which do not bind, and decisions, which do — and many
      resolutions

      contain both. Which is which usually turns on the words the Council uses in each paragraph, chiefly its verbs, and

      borderline wording is debated.


      The Charter draws the same line. Under Chapter VI the Council recommends "appropriate procedures or methods of
      adjustment"

      (art 36(1)). Under art 39, once it has determined a threat to the peace, breach of the peace

      or act of aggression, it "shall make recommendations, or decide" what measures are taken under arts 41 and 42 — a

      recommendation (not binding) or a decision (binding).


      A binding decision is a Charter obligation, so art 103 gives it priority: "In the event of a conflict between the

      obligations of the Members of the United Nations under the present Charter and their obligations under any other

      international agreement, their obligations under the present Charter shall prevail". A member cannot rely on a

      conflicting treaty to avoid a binding sanctions decision.


      The General Assembly, by contrast, recommends (arts 11(2), 14).


      Exam use: before saying a state must comply, find the operative paragraph and ask whether it is a decision
      (binding

      under art 25, prevailing under art 103) or only a recommendation.
  - slug: article-39-findings-in-practice
    title: Threat, breach or aggression — the art 39 findings in practice
    visual: diagram
    visual-brief: >-
      Three columns for the art 39 findings, sized by how often the Council uses them: act of aggression (never or very
      rarely), breach of the peace (a very few armed invasions, e.g. Iraq–Kuwait 1990), threat to the peace (the usual
      finding, widening from inter-state invasion to proliferation, terrorism, internal conflict, serious violations and
      Ebola 2014), above a band marking Cold War deadlock and the busier Council after it.
    related:
      - article-39-determination-and-provisional-measures
      - authorisation-of-force-under-article-42
      - laws2000-w09-prohibition-on-the-use-of-force
      - laws2000-w09-armed-attack
    depends-on:
      - article-39-determination-and-provisional-measures
    contrasts-with:
      - peaceful-settlement-under-chapter-vi
    cases: []
    authorities:
      - un-charter-art-39
    verify: false
    body: >
      Art 39 lists three findings, any one of which opens Chapter VII: a threat to the peace, a breach of the peace,

      or an act of aggression. Without one, the Council can act only under Chapter VI, which needs no determination.


      In practice the three are used very unequally. The lecture explained that the Council has never, or only very
      rarely,

      found an act of aggression in its resolutions. It has found a breach of the peace on a very few occasions, each an

      armed invasion of territory — Iraq's invasion of Kuwait in 1990 is the example (compare Res 678). The categories

      overlap: an invasion can be both a breach and aggression.


      By far the most common finding is a threat to the peace, and its reach has grown since 1945. It began with
      invasion or

      aggression between states and now covers non-traditional threats: proliferation of nuclear,

      chemical or biological weapons, terrorism, internal armed conflicts, serious human rights or IHL violations, and
      the

      2014 Ebola outbreak in Africa. The determination is therefore flexible, and it is the Council's to make.


      During the Cold War, tension between the US and Russia, sometimes playing out through proxies, made Chapter VII

      determinations hard to agree; the Council has been much more active since. The P-5 veto

      (art 27(3)) remains a practical limit.


      Exam use: in a problem, argue for a threat to the peace — the finding the Council actually uses — and support it
      with

      the closest example from practice.
