    slug: non-forcible-measures-under-article-41
    title: Non-forcible measures under art 41 — sanctions, tribunals and ICC referrals
    visual: diagram
    visual-brief: >-
      A spectrum from comprehensive sanctions (a whole state's economy) to targeted "smart" sanctions (a commodity, a
      group, a person), with two further non-forcible branches off art 41: ad hoc criminal tribunals (ICTY, ICTR) and a
      Chapter VII referral to the ICC (Rome Statute art 13(b)).
    related:
