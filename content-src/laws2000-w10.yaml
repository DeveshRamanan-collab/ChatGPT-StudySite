  - key: q521
    type: short
    concept: non-forcible-measures-under-article-41
    difficulty: 4
    prompt: >-
      Scenario: After a coup d'état in the state of Aeystan, fighting breaks out between various armed factions across
      the country. It is unclear who is currently holding power in Aeystan, and the country risks sinking into a
      protracted civil war – with devastating humanitarian consequences for civilian populations. Thousands have already
      fled across the borders. The neighbouring countries of Belandia and Ceria support different armed factions in
      Aeystan through the supply of arms and training. Journalists have even spotted troops of both countries in
      Aeystan, but Belandia and Ceria continue to deny their involvement. A regional organisation of which all three
      countries are members – the ABC Union – appeals to the UN Security Council for action to restore international
      peace and security.


      b. What coercive means – including those involving force and those not involving force – does the UN Security
      Council have at its disposal and how could these be employed in this scenario? Discuss by reference to relevant
      Charter provisions and practice.
    model: >-
      Once it determines a threat to the peace (art 39), the Council may decide on measures binding all members (art
      25).


      Without force (art 41): the list is non-exhaustive. The Council could impose an arms embargo on Aeystan's factions

      and on Belandia and Ceria, whose supply of arms and training feeds the conflict. Because comprehensive sanctions
      have

      been criticised for their impact on populations (Iraq, 1990s) — a real concern where civilians are already
      suffering —

      targeted measures are preferable: travel bans and asset freezes on faction leaders and on the officials directing
      the

      support, with details set by a sanctions committee. It could also create an ad hoc tribunal (as with the ICTY and

      ICTR) or refer the situation to the ICC Prosecutor under Rome Statute art 13(b), as for Darfur.


      With force (art 42): if it considers these measures would be or have proved inadequate, it may authorise force —
      an

      exception to art 2(4) and a last resort. As art 43 was never implemented, it would authorise member states, or the
      ABC

      Union under art 53, to use "all necessary means" (Res 678), e.g. to secure humanitarian relief (Somalia, Res 794)
      or

      protect civilians (Libya, Res 1973). Alternatively it could deploy a UN peacekeeping operation, traditionally
      needing

      the parties' consent. Any measure may be blocked by a P-5 veto.
    rubric:
      - id: r1
        criterion: Gateway and binding effect
        marks: 1
        top-band: Notes that measures follow an art 39 determination and bind members under art 25.
        margin-note: Measures need a determination first — say so in one line.
        authorities:
          - un-charter-art-39
          - un-charter-art-25
      - id: r2
        criterion: Non-forcible measures (art 41) applied to the facts
        marks: 4
        top-band: >-
          Applies an arms embargo and targeted sanctions to Belandia, Ceria and the factions, explains why targeted
          beats comprehensive here, and adds a tribunal or ICC referral.
        margin-note: Which measure actually stops the arms flowing — and who would it hurt?
        authorities:
          - un-charter-art-41
          - rome-statute-art-13-b
      - id: r3
        criterion: Forcible measures (art 42) and how they are delivered
        marks: 3
        top-band: >-
          States the art 42 condition, the art 2(4) exception and last-resort point, art 43's non-implementation, and
          authorisation to states or the ABC Union (art 53) with "all necessary means".
        margin-note: There is no UN army — so who would actually use force, and on what words?
        authorities:
          - un-charter-art-42
          - un-charter-art-2-4
          - unsc-resolution-678
          - unsc-resolution-794
      - id: r4
        criterion: Practice and limits
        marks: 2
        top-band: >-
          Uses practice (Somalia, Libya, Darfur, ICTY/ICTR) and notes peacekeeping and the veto as alternatives or
          limits.
        margin-note: Good law — now show the Council has done this before, and what could stop it.
        authorities: []
  - key: q601
    type: mcq
    concept: authorisation-of-force-under-article-42
    difficulty: 2
    set: pretest
    stem: Why does the Security Council authorise coalitions of states to use force rather than deploying forces of its own?
    options:
      - text: Because art 43 has never been implemented, so there is no standing UN army.
        correct: true
        why: >-
          Correct — the slides say art 43 has never been implemented, so the Council may authorise coalitions of states;
          the takeaways note the absence of a standing UN army.
      - text: Because art 42 forbids the UN from directing troops in any circumstances.
        why: >-
          Wrong — art 42 is the Council's power to take action by air, sea or land forces; the obstacle is that art 43
          was never implemented.
      - text: Because the General Assembly must command all UN forces under art 18.
        why: Wrong — art 18 is the Assembly's one state, one vote rule; it gives the Assembly no command of forces.
      - text: Because regional organisations hold a monopoly on force under Chapter VIII.
        why: >-
          Wrong — regional organisations act only when the Council authorises them (art 53); the permissible use of
          force is centralised in the Council.
