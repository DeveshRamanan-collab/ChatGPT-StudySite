questions:
  - key: q101
    type: mcq
    concept: collective-security-and-the-un-system
    difficulty: 1
    set: pretest
    stem: How does the lecture define "collective security"?
    options:
      - text: 'War and aggression are the concern of all states, not a private dispute: war against one is war against all.'
        correct: true
        why: >-
          Correct — the slides define collective security as a system where war and aggression concern all states rather
          than being a private dispute between states; war against one is war against all.
      - text: Each state may use force to defend itself and its allies without any international body's permission.
        why: >-
          Tempting because self-defence can be collective too, but that describes states acting on their own; collective
          security is joint machinery centralised in the Security Council, not unilateral force.
      - text: >-
          Disputes between states are private matters, settled bilaterally, with the UN acting only as a forum for
          talks.
        why: >-
          This is the opposite of the definition: collective security rejects treating war and aggression as a private
          dispute between states and makes them the concern of all.
      - text: The five permanent members of the Security Council guarantee to defend any member that is attacked.
        why: >-
          Tempting because the P-5 are central to the Council, but collective security is a system-wide principle, not a
          defence guarantee by the P-5 — and the slides note the veto has sometimes stopped the Council acting.
  - key: q102
    type: mcq
    concept: collective-security-and-the-un-system
    difficulty: 1
    stem: Which organisations does the lecture give as examples founded on the principle of collective security?
    options:
      - text: The International Court of Justice and the Permanent Court of Arbitration.
        why: >-
          Tempting because both appear in the slides' tools table, but they are bodies for peaceful settlement by
          adjudication and arbitration, not organisations founded on collective security.
      - text: The League of Nations and the United Nations, with NATO as another example.
        correct: true
        why: >-
          Correct — the slides say both the League of Nations and the United Nations were founded on collective
          security, and give the North Atlantic Treaty Organisation as another example.
      - text: The World Trade Organization, the International Monetary Fund and the World Bank.
        why: >-
          Tempting because these organisations can exert economic leverage over members, but the slides do not present
          them as founded on collective security; they are not peace-and-security bodies.
      - text: The International Criminal Court and the ICTY.
        why: >-
          Tempting because the Council created the ICTY and can refer situations to the ICC, but these are criminal
          courts trying individuals, not collective security organisations.
  - key: q103
    type: mcq
    concept: collective-security-and-the-un-system
    difficulty: 2
    stem: What does the UN system do with the permissible use of force, according to the lecture?
    options:
      - text: 'It centralises it in one body: the Security Council.'
        correct: true
        why: >-
          Correct — the slides and the main takeaways say the UN system centralises the permissible use of force to one
          body, the Security Council.
      - text: It divides it equally between the Security Council and the General Assembly.
        why: >-
          Tempting because the Assembly has a subsidiary responsibility for peace and security, but it can only
          recommend; the permissible use of force is centralised in the Security Council.
      - text: It leaves it to each member state, subject to later review by the ICJ.
        why: >-
          Tempting because the ICJ settles legal disputes, but the key move of collective security is to take decisions
          about force away from individual states and centralise them in the Council.
      - text: It delegates it permanently to regional organisations such as NATO.
        why: >-
          Tempting because regional organisations can be authorised to enforce Council decisions (art 53), but they act
          on the Council's authorisation; the power stays centralised in the Council.
  - key: q104
    type: mcq
    concept: collective-security-and-the-un-system
    difficulty: 2
    stem: Which is the first of the Purposes of the United Nations in art 1 of the Charter?
    options:
      - text: To develop friendly relations among nations based on equal rights and self-determination of peoples.
        why: >-
          Tempting because it is one of the Purposes, but it is art 1(2), the second; the first, art 1(1), is to
          maintain international peace and security.
      - text: To maintain international peace and security, by effective collective measures and peaceful settlement.
        correct: true
        why: >-
          Correct — art 1(1) makes maintaining international peace and security the first purpose, through effective
          collective measures against threats and aggression and peaceful settlement of disputes.
      - text: To achieve co-operation on economic, social, cultural and humanitarian problems, and respect for human rights.
        why: >-
          Tempting because human rights co-operation is a Purpose, but it is art 1(3), the third; maintaining peace and
          security comes first in art 1(1).
      - text: To be a centre for harmonizing the actions of nations in the attainment of these common ends.
        why: >-
          This is art 1(4), the last of the Purposes, which refers back to the others; it cannot be the first because it
          presupposes the "common ends" listed before it.
  - key: q105
    type: mcq
    concept: collective-security-and-the-un-system
    difficulty: 2
    stem: Why, according to the lecture, was the United Nations formally established?
    options:
      - text: To create a world government with a legislature able to pass laws binding on every state.
        why: >-
          Tempting because the UN is the central institutional regime, but it is not a world legislature; the slides say
          it was established to prevent instability and unchecked aggression between states.
      - text: To replace the International Court of Justice as the main forum for settling legal disputes.
        why: >-
          Wrong — the ICJ is itself one of the UN's six principal organs in the slides' chart; the UN was not created to
          replace it.
      - text: To prevent the instability and unchecked aggression that marked inter-state affairs early in the 20th century.
        correct: true
        why: >-
          Correct — the slides say the UN was formally established to prevent instability and unchecked aggression in
          inter-state affairs, which had featured prominently in the first half of the 20th century.
      - text: To codify the customary law of treaties and state responsibility in binding conventions.
        why: >-
          Tempting because the UN has been influential in developing international law, but codification was not the
          reason given for its establishment; preventing aggression was.
  - key: q106
    type: mcq
    concept: collective-security-and-the-un-system
    difficulty: 2
    stem: >-
      In the slides' table of tools for maintaining peace and security, which Charter provision anchors peaceful
      settlement?
    options:
      - text: Chapter VI, art 33.
        correct: true
        why: >-
          Correct — the table puts peaceful settlement (good offices, inquiry, mediation, conciliation, adjudication and
          arbitration) under Chapter VI, art 33.
      - text: Chapter VII, art 41.
        why: >-
          Tempting because art 41 measures do not involve force, but they are coercive Chapter VII measures such as
          sanctions — collective security without force, not peaceful settlement.
      - text: Chapter VII, art 42.
        why: >-
          Wrong — art 42 is collective security with the use of force: the Council authorising member states, regional
          organisations or peacekeeping operations.
      - text: Chapter VIII, art 53.
        why: >-
          Tempting because regional arrangements appear in art 33's list of means, but art 53 concerns regional
          organisations enforcing Council decisions; the table anchors peaceful settlement in art 33.
  - key: q107
    type: mcq
    concept: collective-security-and-the-un-system
    difficulty: 3
    stem: Which pairing of tool and Charter basis matches the slides' table?
    options:
      - text: Sanctions — Chapter VI, art 33; mediation and conciliation — Chapter VII, art 41.
        why: >-
          This swaps the two: mediation and conciliation are Chapter VI peaceful settlement (art 33), while sanctions
          are Chapter VII collective security without force (art 41).
      - text: Sanctions — Chapter VII, art 41; authorising states or regional bodies to use force — art 42.
        correct: true
        why: >-
          Correct — the table puts sanctions (and peacekeeping without force) under art 41 and the Council authorising
          member states, regional organisations or peacekeeping operations to use force under art 42.
      - text: Mediation — Chapter VII, art 42; sanctions — Chapter VIII, art 53 via regional organisations.
        why: >-
          Wrong on both counts: mediation is a Chapter VI art 33 means, and sanctions are an art 41 measure; art 53
          concerns regional enforcement of Council decisions.
      - text: Authorising force — Chapter VI, art 33; adjudication at the ICJ — Chapter VII, art 42.
        why: >-
          Reversed: adjudication is a peaceful means under art 33, and authorising force is art 42 under Chapter VII;
          Chapter VI never authorises force.
  - key: q108
    type: mcq
    concept: collective-security-and-the-un-system
    difficulty: 3
    stem: >-
      The lecture's takeaways say the Security Council has not been able to act in every threat to or breach of the
      peace. Which reasons do the slides give?
    options:
      - text: Its decisions are only recommendations, which members routinely ignore.
        why: >-
          Tempting because the General Assembly only recommends, but Council decisions bind all members under art 25;
          the slides blame capacity and the veto, not the legal force of decisions.
      - text: The ICJ must approve every Chapter VII measure before it can take effect.
        why: >-
          There is no such requirement in the slides; the ICJ settles legal disputes and gives advisory opinions, it
          does not pre-approve Council measures.
      - text: A lack of capacity, but also the veto power of the P-5.
        correct: true
        why: >-
          Correct — the takeaways say the Council has not been able to act in all instances, e.g. because of a lack of
          capacity, but also the veto power of the five permanent members.
      - text: The General Assembly can override any Council resolution by a two-thirds vote.
        why: >-
          Wrong — the Assembly has only a subsidiary responsibility; even under Uniting for Peace it can recommend
          collective measures, not override the Council.
  - key: q109
    type: mcq
    concept: collective-security-and-the-un-system
    difficulty: 2
    stem: In the absence of a standing UN army, what two options does the lecture say the Security Council has?
    options:
      - text: Call up troops directly from members under art 43, or ask NATO to act on its own initiative.
        why: >-
          Tempting because art 43 concerns forces for the Council, but the slides say art 43 has never been implemented;
          and NATO acts only when authorised (e.g. Libya).
      - text: Ask the General Assembly to raise an army, or refer the matter to the ICJ for a judgment.
        why: >-
          Neither is in the slides: the Assembly has a minimal role in enforcement, and the ICJ settles legal disputes;
          neither supplies forces.
      - text: Decide on a UN-run peacekeeping or peace operation, or authorise the use of force.
        correct: true
        why: >-
          Correct — the takeaways say that, without a standing UN army, the Council may decide on (1) a UN-run
          peacekeeping or peace operation, or (2) authorise the use of force.
      - text: Deploy the Secretary-General's own forces, or rely on any member's self-defence.
        why: >-
          The Secretary-General commands no forces — the slides describe a civil service with good offices — and
          self-defence is a right of states, not a Council option.
  - key: q110
    type: mcq
    concept: collective-security-and-the-un-system
    difficulty: 2
    stem: >-
      State A invades State B. Under the UN collective security system described in the lecture, which body decides on
      the collective response?
    options:
      - text: Any state alone — war against one is war against all, so each may respond as it sees fit.
        why: >-
          Tempting because of the slogan, but the slides stress that the system centralises the permissible use of force
          in the Council; it is machinery for joint action, not a licence for any state.
      - text: The Security Council, which determines the breach and decides on Chapter VII measures.
        correct: true
        why: >-
          Correct — when there is a threat to peace, breach of peace or act of aggression, it is for the Security
          Council to take decisions to maintain or restore international peace and security.
      - text: The General Assembly, because it represents all 193 members, each with one vote.
        why: >-
          Tempting because the Assembly is the most "democratic" organ, but it has a subsidiary responsibility and a
          minimal enforcement role; primary responsibility lies with the Council (art 24).
      - text: The International Court of Justice, once B files an application against A.
        why: >-
          The ICJ adjudicates legal disputes the parties refer to it; it is not the body that decides collective
          measures against a breach of the peace.
  - key: q111
    type: mcq
    concept: collective-security-and-the-un-system
    difficulty: 2
    stem: Which statement about the UN's role matches the lecture?
    options:
      - text: Its structures were designed free of political influence and are unchanged since 1945.
        why: >-
          The slides say the opposite: the UN's structures were influenced by the political climate in which it was
          created, and its role continues to evolve.
      - text: It has shaped modern international law and its enforcement, and its role keeps evolving.
        correct: true
        why: >-
          Correct — the slides say the UN has been influential in the development of modern international law and its
          enforcement, and that its role continues to evolve.
      - text: It has had little influence on international law, which develops mainly through bilateral treaties.
        why: >-
          Wrong — the slides describe the UN as influential in developing modern international law and its enforcement,
          and as the central institutional regime of international relations.
      - text: Its role is limited to humanitarian relief, leaving peace and security to regional bodies.
        why: >-
          Wrong — maintaining international peace and security is the UN's first purpose (art 1(1)); regional
          organisations act on the Council's authorisation (art 53).
  - key: q112
    type: mcq
    concept: collective-security-and-the-un-system
    difficulty: 1
    stem: The slides' UN system chart shows six principal organs. Which of them suspended operation on 1 November 1994?
    options:
      - text: The Trusteeship Council.
        correct: true
        why: >-
          Correct — a note to the chart says the Trusteeship Council suspended operation on 1 November 1994, after
          Palau, the last UN Trust Territory, became independent.
      - text: The Economic and Social Council.
        why: >-
          Tempting because it is the organ least discussed this week, but the chart shows ECOSOC with active functional
          and regional commissions; it has not suspended operation.
      - text: The Military Staff Committee.
        why: >-
          Tempting because it sounds dormant, but the chart lists it as a subsidiary organ of the Security Council, not
          one of the six principal organs.
      - text: The International Court of Justice.
        why: >-
          Wrong — the ICJ is an active principal organ, cited this week for the Wall (2004) and Certain Expenses
          advisory opinions.
  - key: q113
    type: mcq
    concept: collective-security-and-the-un-system
    difficulty: 3
    variant-of: q103
    stem: >-
      A student writes: "Under the UN Charter, each state still decides for itself when force is needed to restore
      peace." What is wrong with this, on the lecture's account?
    options:
      - text: Nothing — collective security means each state chooses whether to join a war against an aggressor.
        why: >-
          Tempting because collective security involves all states, but it works by centralising decisions about force
          in the Council, not by leaving each state to decide.
      - text: Only the General Assembly may decide when force is needed, by a majority of members.
        why: >-
          Wrong — the Assembly can at most recommend collective measures (e.g. under Uniting for Peace); deciding
          measures to maintain or restore peace is for the Council.
      - text: The system centralises permissible force in the Security Council, which decides on measures.
        correct: true
        why: >-
          Correct — the UN system centralises the permissible use of force to one body, the Security Council, which
          decides measures to maintain or restore international peace and security.
      - text: Only the ICJ may decide, because the use of force is a legal question under art 36(3).
        why: >-
          Tempting because art 36(3) mentions the ICJ, but it concerns the Council referring legal disputes to the
          Court, not deciding when force may be used.
  - key: q114
    type: match
    concept: collective-security-and-the-un-system
    difficulty: 2
    prompt: Match each Purpose of the United Nations to its paragraph of art 1.
    pairs:
      - left: Art 1(1)
        right: Maintain international peace and security through collective measures and peaceful settlement
      - left: Art 1(2)
        right: Develop friendly relations based on equal rights and self-determination of peoples
      - left: Art 1(3)
        right: International co-operation on economic, social, cultural and humanitarian problems and human rights
      - left: Art 1(4)
        right: Be a centre for harmonizing the actions of nations
  - key: q115
    type: truefalse
    concept: collective-security-and-the-un-system
    difficulty: 1
    set: quickfire
    statement: Collective security treats war and aggression as a private dispute between the states involved.
    answer: false
    why: >-
      False — collective security makes war and aggression the concern of all states, not a private dispute between
      states: war against one is war against all.
  - key: q116
    type: truefalse
    concept: collective-security-and-the-un-system
    difficulty: 1
    set: quickfire
    statement: The UN system centralises the permissible use of force in one body, the Security Council.
    answer: true
    why: >-
      True — the slides and the main takeaways say the UN system centralises the permissible use of force to one body:
      the Security Council.
  - key: q117
    type: truefalse
    concept: collective-security-and-the-un-system
    difficulty: 1
    set: quickfire
    statement: Unlike the United Nations, the League of Nations was not founded on the principle of collective security.
    answer: false
    why: >-
      False — the slides say both the League of Nations and the United Nations were founded on the principle of
      collective security, with NATO as another example.
  - key: q118
    type: short
    concept: collective-security-and-the-un-system
    difficulty: 3
    prompt: >-
      What are some of the principal organs of the United Nations and their functions in relation to the maintenance of
      international peace and security?
    model: >-
      The Security Council has primary responsibility for the maintenance of international peace and security, conferred

      by the members on whose behalf it acts (art 24). It has 15 members — five permanent members with a veto (art
      27(3))

      and ten elected for two-year terms. Its decisions bind all members (art 25) and prevail over conflicting treaty

      obligations (art 103). It acts under Chapter VI (peaceful settlement, arts 33–37) and Chapter VII (an art 39

      determination, art 40 provisional measures, art 41 non-forcible measures and art 42 force).


      The General Assembly — all 193 members, one vote each (art 18) — has a subsidiary responsibility: it may discuss
      and

      recommend (arts 11(2), 14; Certain Expenses), but not on a matter the Council is dealing with unless asked (art
      12(1);

      Wall Advisory Opinion). Under Uniting for Peace (Res 377(V)) it may recommend collective measures when the Council
      is

      deadlocked by the permanent members.


      The Secretary-General, head of the Secretariat, may bring threats to the Council's attention (art 99) and
      exercises

      good offices. The ICJ settles legal disputes, which the Council should generally leave the parties to refer to it

      (art 36(3)).
    rubric:
      - id: r1
        criterion: 'Security Council: primary responsibility, composition and binding decisions'
        marks: 3
        top-band: >-
          Explains art 24 primary responsibility, the 15-member composition with the P-5 veto, art 25 binding force and
          art 103 priority.
        margin-note: Why do Council decisions bind? Cite art 25 — and art 103 for conflicting treaties.
        authorities:
          - un-charter-art-24
          - un-charter-art-25
          - un-charter-art-103
      - id: r2
        criterion: The Council's tools under Chapters VI and VII
        marks: 2
        top-band: Distinguishes Chapter VI peaceful settlement from the Chapter VII sequence (arts 39, 40, 41, 42).
        margin-note: Good list — now say which tools are recommendations and which are binding coercion.
        authorities:
          - un-charter-art-33-1
          - un-charter-art-39
          - un-charter-art-41
          - un-charter-art-42
      - id: r3
        criterion: 'General Assembly: subsidiary role, art 12 limit and Uniting for Peace'
        marks: 3
        top-band: >-
          Explains arts 11(2) and 14, the art 12(1) bar (Wall), and Uniting for Peace for a deadlocked Council (Certain
          Expenses).
        margin-note: The Assembly recommends — what stops it while the Council is seized, and what changes under Res 377(V)?
        authorities:
          - un-charter-art-11-2
          - un-charter-art-12-1
          - un-charter-art-14
          - unga-resolution-377-v
      - id: r4
        criterion: Secretary-General and ICJ
        marks: 2
        top-band: Names art 99 and good offices for the Secretary-General, and the ICJ's role in legal disputes (art 36(3)).
        margin-note: Don't stop at the Council and Assembly — the Secretary-General and the Court have peace functions too.
        authorities: []
  - key: q119
    type: mcq
    concept: collective-security-and-the-un-system
    difficulty: 2
    stem: How do the Purposes in art 1(1) relate to the Security Council's toolkit?
    options:
      - text: Art 1(1) calls for effective collective measures and for peaceful settlement — echoed in Chapters VII and VI.
        correct: true
        why: >-
          Correct — art 1(1) refers both to "effective collective measures" against threats and aggression and to
          peaceful adjustment or settlement of disputes, which the Council pursues under Chapters VII and VI.
      - text: Art 1(1) mentions only peaceful means, so Chapter VII coercion falls outside the UN's Purposes.
        why: >-
          Wrong — art 1(1) expressly refers to "effective collective measures for the prevention and removal of threats
          to the peace, and for the suppression of acts of aggression".
      - text: Art 1(1) allows each member to suppress acts of aggression by force on its own initiative.
        why: >-
          Tempting because art 1(1) speaks of suppressing aggression, but it calls for collective measures; the system
          centralises force in the Council rather than in each member.
      - text: Art 1(1) concerns economic co-operation; peace and security first appear only in art 24.
        why: >-
          Economic co-operation is art 1(3); peace and security is the very first Purpose, in art 1(1), before art 24
          confers responsibility on the Council.
  - key: q120
    type: mcq
    concept: collective-security-and-the-un-system
    difficulty: 3
    stem: >-
      A commentator argues that because the Security Council failed to act in a particular conflict, collective security
      has no legal basis. How would the lecture's takeaways answer?
    options:
      - text: Collective security lapses automatically whenever the Council fails to act, freeing states to use force.
        why: >-
          Not in the slides: the Council's failure to act is presented as a limitation of the system, not as something
          that dissolves the Charter rules or frees states to use force.
      - text: The Charter still centralises force in the Council; it simply has not acted in every case.
        correct: true
        why: >-
          Correct — the takeaways describe a system that centralises force in the Council but concede it has not been
          able to act in all instances, because of a lack of capacity and the P-5 veto.
      - text: The failure shows Council decisions never bind, as art 25 covers only unanimous decisions.
        why: >-
          Wrong — art 25 says members agree to accept and carry out the Council's decisions; the slides attach no
          unanimity condition to its binding effect.
      - text: The Assembly automatically takes over the Council's binding powers under art 24 when it fails.
        why: >-
          Tempting because of Uniting for Peace, but that procedure lets the Assembly recommend collective measures; art
          24 confers primary responsibility on the Council alone.
  - key: q201
    type: mcq
    concept: security-council-composition-and-powers
    difficulty: 1
    set: pretest
    stem: How many members does the Security Council have, and how many of them are permanent?
    options:
      - text: 15 members, five of them permanent.
        correct: true
        why: >-
          Correct — under art 23 the Council has 15 UN member states: five permanent members with a veto and ten
          non-permanent members elected for two-year terms.
      - text: 15 members, ten of them permanent.
        why: >-
          Reversed — ten of the fifteen seats are non-permanent, elected for two-year terms; only five (the P-5) are
          permanent.
      - text: 193 members, five of them permanent.
        why: >-
          Tempting because 193 is a number from this week, but it is the General Assembly's membership — all UN member
          states; the Council has 15.
      - text: 11 members, five of them permanent.
        why: >-
          Tempting if you half-remember a smaller council, but the slides (art 23) give 15 members: five permanent and
          ten elected.
  - key: q202
    type: mcq
    concept: security-council-composition-and-powers
    difficulty: 1
    stem: Which states are the five permanent members of the Security Council?
    options:
      - text: The US, China, Russia, the UK and Germany.
        why: >-
          Tempting because Germany is a major power, but it is not a permanent member; the P-5 are the US, China,
          Russia, the UK and France.
      - text: The US, India, Russia, the UK and France.
        why: >-
          Tempting because India is often mentioned in reform debates, but the slides list China, not India, among the
          P-5.
      - text: The US, China, Russia, the UK and France.
        correct: true
        why: >-
          Correct — the slides list the P-5 as the US, China, Russia, the UK and France, each holding a veto under art
          27(3).
      - text: The US, China, Japan, the UK and France.
        why: >-
          Tempting because Japan is a large UN contributor, but it is not a permanent member; Russia is the fifth member
          of the P-5.
  - key: q203
    type: mcq
    concept: security-council-composition-and-powers
    difficulty: 1
    stem: Which Charter provision does the lecture identify as the source of the P-5 veto?
    options:
      - text: Art 23.
        why: >-
          Tempting because art 23 sets the Council's composition and names the permanent members, but the slides cite
          art 27(3) for the veto.
      - text: Art 24(1).
        why: >-
          Wrong — art 24(1) confers primary responsibility for peace and security on the Council; it says nothing about
          the veto.
      - text: Art 27(3).
        correct: true
        why: Correct — the slides note "Veto = Art. 27(3)" beside the list of permanent members.
      - text: Art 103.
        why: >-
          Wrong — art 103 makes Charter obligations prevail over obligations under other international agreements; it is
          unrelated to voting.
  - key: q204
    type: mcq
    concept: security-council-composition-and-powers
    difficulty: 2
    stem: How are the ten non-permanent members of the Security Council chosen, according to the slides?
    options:
      - text: Appointed by the P-5 for four-year terms, two each year, according to financial contributions.
        why: >-
          None of this is in the slides: the elected members are chosen by the General Assembly, not appointed by the
          P-5, and serve two-year terms.
      - text: Elected by the General Assembly for two-year terms, five each year, along regional lines.
        correct: true
        why: >-
          Correct — the slides say the ten non-permanent members are elected for a two-year term, five each year, by the
          General Assembly, divided along regional lines.
      - text: Elected by the Council itself for one-year terms, drawn by lot from all UN members.
        why: >-
          Wrong — the General Assembly elects them, for two years, and seats are divided along regional lines rather
          than drawn by lot.
      - text: Elected by the General Assembly for five-year terms, like the Secretary-General.
        why: >-
          Tempting because the slides do give the Secretary-General a five-year term, but elected Council members serve
          two-year terms.
  - key: q205
    type: mcq
    concept: security-council-composition-and-powers
    difficulty: 2
    stem: How are the ten elected Security Council seats divided along regional lines?
    options:
      - text: Africa 2, Asia 3, Latin America and Caribbean 2, Western Europe and Others 2, Eastern Europe 1.
        why: 'Close, but Africa and Asia are swapped: the slides reserve three seats for Africa and two for Asia.'
      - text: Africa 2, Asia 2, Latin America and Caribbean 2, Western Europe and Others 2, Eastern Europe 2.
        why: Tempting because an even split looks fair, but the slides give Africa three seats and Eastern Europe one.
      - text: Africa 3, Asia 2, Latin America and Caribbean 2, Western Europe and Others 2, Eastern Europe 1.
        correct: true
        why: >-
          Correct — the slides reserve 3 seats for Africa, 2 for Asia, 2 for Latin America and the Caribbean, 2 for
          Western Europe and Other States and 1 for Eastern Europe.
      - text: Africa 3, Asia 3, Latin America and Caribbean 2, Western Europe and Others 1, Eastern Europe 1.
        why: >-
          Wrong — Asia has two seats and Western Europe and Other States has two, per the slides; this version gives
          Asia an extra seat at WEOG's expense.
  - key: q206
    type: mcq
    concept: security-council-composition-and-powers
    difficulty: 2
    contrasts-with:
      - general-assembly-and-secretary-general
    stem: What does art 24(1) of the Charter provide?
    options:
      - text: Members confer on the Council primary responsibility for peace and security; it acts on their behalf.
        correct: true
        why: >-
          Correct — art 24(1) says members confer on the Security Council primary responsibility for the maintenance of
          international peace and security and agree that it acts on their behalf.
      - text: Members confer on the General Assembly primary responsibility, with the Council in support.
        why: >-
          Reversed — the Council has primary responsibility; the Assembly's responsibility is subsidiary (arts 11(2),
          12, 14).
      - text: The Council may make binding decisions only when all fifteen members vote in favour.
        why: >-
          Not in art 24: it confers responsibility and says where the Council's powers are found; it sets no unanimity
          requirement.
      - text: The Council has exclusive responsibility for peace, so no other organ may discuss it.
        why: >-
          Tempting, but art 24 says "primary", not exclusive: the Assembly may discuss and recommend on peace and
          security questions (arts 11(2), 14).
  - key: q207
    type: mcq
    concept: security-council-composition-and-powers
    difficulty: 2
    stem: Under art 24(2), where are the Security Council's specific powers laid down?
    options:
      - text: Chapters VI, VII, VIII and XII.
        correct: true
        why: >-
          Correct — art 24(2) says the specific powers granted to the Council for the discharge of its duties are laid
          down in Chapters VI, VII, VIII and XII.
      - text: Chapter VII only.
        why: >-
          Tempting because Chapter VII holds the coercive powers, but art 24(2) lists four chapters: VI, VII, VIII and
          XII.
      - text: Chapters VI and VII, but not VIII.
        why: >-
          Wrong — Chapter VIII is listed too, which is why the Council can authorise regional organisations to enforce
          its decisions (art 53).
      - text: Chapter I, on purposes and principles.
        why: >-
          Tempting because art 24(2) requires the Council to act in accordance with the Purposes and Principles (Chapter
          I), but its specific powers are in Chapters VI, VII, VIII and XII.
  - key: q208
    type: mcq
    concept: security-council-composition-and-powers
    difficulty: 2
    stem: What does art 25 of the Charter add to the Security Council's powers?
    options:
      - text: Council decisions bind only the members that voted for them, like a treaty needing consent.
        why: >-
          Wrong — art 25 binds all members: they agree in advance to accept and carry out the Council's decisions,
          without consenting to each one.
      - text: Council decisions are recommendations that members may follow under their own law.
        why: >-
          Tempting because the Assembly makes recommendations, but art 25 makes Council decisions legally binding on all
          members.
      - text: Members agree to accept and carry out Council decisions, so they bind all members.
        correct: true
        why: >-
          Correct — art 25: "The Members of the United Nations agree to accept and carry out the decisions of the
          Security Council in accordance with the present Charter."
      - text: Council decisions bind only the P-5, since they alone hold the veto under art 27(3).
        why: Wrong — the veto affects how decisions are made, not who they bind; under art 25 all members are bound.
  - key: q209
    type: mcq
    concept: security-council-composition-and-powers
    difficulty: 3
    stem: Why does the lecture say art 25 should be read together with art 103?
    options:
      - text: Because art 103 confines art 25 to Chapter VI decisions, which are only recommendations.
        why: >-
          Wrong — art 103 does not limit art 25; Chapter VII decisions are the ones that most often bind, and art 103
          strengthens rather than narrows them.
      - text: Because art 103 lets a member refuse a decision that conflicts with an earlier bilateral or regional treaty.
        why: >-
          The reverse is true: art 103 says Charter obligations prevail over obligations under any other international
          agreement, earlier or later.
      - text: Because art 103 requires the ICJ to review each Council decision before it binds members.
        why: >-
          There is no such review requirement in the slides; art 103 is a priority rule between Charter and treaty
          obligations.
      - text: Because art 103 makes Charter duties, including carrying out decisions, prevail over other treaties.
        correct: true
        why: >-
          Correct — art 103: in a conflict between obligations under the Charter and under any other international
          agreement, the Charter obligations prevail; with art 25, this gives Council decisions priority.
  - key: q210
    type: mcq
    concept: security-council-composition-and-powers
    difficulty: 3
    stem: >-
      State X has a bilateral treaty requiring it to keep supplying machinery to State Y. The Security Council, acting
      under Chapter VII, decides that all members must stop supplying machinery to Y. Which obligation prevails?
    options:
      - text: The Charter obligation to carry out the Council's decision (arts 25 and 103).
        correct: true
        why: >-
          Correct — art 25 binds X to carry out the decision, and art 103 makes that Charter obligation prevail over X's
          obligation under the bilateral treaty.
      - text: The bilateral treaty, because it came first and pacta sunt servanda applies to it.
        why: >-
          Tempting because treaties must be performed in good faith, but art 103 says Charter obligations prevail over
          obligations under any other international agreement.
      - text: Neither — X must ask the ICJ which obligation came first in time and follow that one.
        why: >-
          Wrong — art 103 resolves the conflict without regard to timing; no ICJ ruling is needed for the Charter
          obligation to prevail.
      - text: The bilateral treaty, unless X voted for the decision as a Council member.
        why: Wrong — art 25 binds all members whether or not they sit on the Council or voted for the decision.
  - key: q211
    type: mcq
    concept: security-council-composition-and-powers
    difficulty: 2
    stem: >-
      Which Chapter of the Charter lays down the Council's powers with respect to threats to the peace, breaches of the
      peace and acts of aggression?
    options:
      - text: Chapter VI.
        why: >-
          Tempting because Chapter VI also concerns the Council, but it deals with the pacific settlement of disputes
          (arts 33–37), not coercive powers against threats.
      - text: Chapter VII.
        correct: true
        why: >-
          Correct — the slides say Chapter VII lays down the Council's powers with respect to threats to peace, breaches
          of the peace and acts of aggression (arts 39–42).
      - text: Chapter VIII.
        why: >-
          Wrong — Chapter VIII concerns regional arrangements; the Council may authorise regional organisations under
          art 53, but the threats powers are in Chapter VII.
      - text: Chapter XII.
        why: >-
          Tempting because art 24(2) lists Chapter XII among the Council's powers, but the slides identify Chapter VII
          as the chapter on threats, breaches and aggression.
  - key: q212
    type: mcq
    concept: security-council-composition-and-powers
    difficulty: 3
    contrasts-with:
      - general-assembly-and-secretary-general
    stem: Which statement correctly contrasts the Security Council with the General Assembly?
    options:
      - text: The Assembly's resolutions bind all members; Council decisions bind only its fifteen members.
        why: Reversed — art 25 makes Council decisions binding on all UN members, while the Assembly makes recommendations.
      - text: Council decisions bind all members (art 25); the Assembly has a subsidiary role and recommends.
        correct: true
        why: >-
          Correct — the Council has primary responsibility and binding decisions; the Assembly has a subsidiary
          responsibility and may discuss and recommend (arts 11(2), 14).
      - text: Both have fifteen elected members, but only the Assembly has permanent members holding a veto power.
        why: >-
          Wrong — the Assembly includes all 193 members, each with one vote (art 18); the veto belongs to the Council's
          P-5.
      - text: The Council represents all 193 members equally, each with one vote under art 18.
        why: That describes the General Assembly; the Council has 15 members, five of them permanent with a veto.
  - key: q213
    type: mcq
    concept: security-council-composition-and-powers
    difficulty: 2
    stem: Under art 24(1), on whose behalf does the Security Council act in carrying out its duties?
    options:
      - text: On behalf of the five permanent members only.
        why: >-
          Tempting because the P-5 hold the veto, but art 24(1) says members confer responsibility and agree the Council
          acts on their behalf — all members.
      - text: On behalf of the General Assembly, which delegates its powers to it.
        why: >-
          Wrong — the members confer responsibility on the Council directly; the Assembly has only a subsidiary
          responsibility.
      - text: On behalf of the members of the United Nations.
        correct: true
        why: >-
          Correct — art 24(1): members "agree that in carrying out its duties under this responsibility the Security
          Council acts on their behalf".
      - text: On behalf of the Secretary-General as head of the organisation.
        why: >-
          Wrong — the Secretary-General leads the Secretariat and can alert the Council (art 99), but the Council acts
          for the members.
  - key: q214
    type: mcq
    concept: security-council-composition-and-powers
    difficulty: 4
    variant-of: q210
    stem: >-
      A regional treaty obliges State P to let State Q's aircraft land at its airports. The Security Council, acting
      under Chapter VII, decides that members must interrupt air communications with Q. P asks whether it must still
      honour the regional treaty. Best advice?
    options:
      - text: P must honour the regional treaty, since Chapter VIII arrangements override Chapter VII decisions.
        why: >-
          Wrong — regional arrangements do not override Council decisions; art 53 lets the Council use regional
          organisations to enforce its decisions.
      - text: P may choose either obligation, because the Charter is silent on conflicts with other treaties.
        why: >-
          The Charter is not silent: art 103 expressly provides that Charter obligations prevail over obligations under
          any other international agreement.
      - text: P must carry out the Council's decision; under art 103 that Charter duty prevails.
        correct: true
        why: >-
          Correct — the decision binds P under art 25, interruption of air communications is a listed art 41 measure,
          and art 103 makes the Charter obligation prevail over the regional treaty.
      - text: P need not comply until the General Assembly has recommended the same measure.
        why: Wrong — Council decisions bind of their own force under art 25; no Assembly recommendation is required.
  - key: q215
    type: match
    concept: security-council-composition-and-powers
    difficulty: 2
    prompt: Match each Charter provision to its role in the Security Council's powers.
    pairs:
      - left: Art 23
        right: 'Composition: 15 members, five of them permanent'
      - left: Art 24
        right: Primary responsibility for peace and security conferred by members
      - left: Art 25
        right: Members agree to accept and carry out Council decisions
      - left: Art 27(3)
        right: The P-5 veto
      - left: Art 103
        right: Charter obligations prevail over other international agreements
  - key: q216
    type: truefalse
    concept: security-council-composition-and-powers
    difficulty: 1
    set: quickfire
    statement: The ten non-permanent members of the Security Council are elected for two-year terms by the General Assembly.
    answer: true
    why: >-
      True — the slides say the ten non-permanent members are elected for a two-year term, five each year, by the UN
      General Assembly, divided along regional lines.
  - key: q217
    type: truefalse
    concept: security-council-composition-and-powers
    difficulty: 1
    set: quickfire
    statement: >-
      Under art 24, the Security Council has exclusive responsibility for the maintenance of international peace and
      security.
    answer: false
    why: >-
      False — art 24 confers "primary" responsibility; the General Assembly has a subsidiary responsibility and may
      discuss and recommend (arts 11(2), 14), subject to art 12.
  - key: q218
    type: truefalse
    concept: security-council-composition-and-powers
    difficulty: 1
    set: quickfire
    statement: >-
      Under art 103, obligations under the UN Charter prevail over conflicting obligations under any other international
      agreement.
    answer: true
    why: >-
      True — art 103 provides that in the event of a conflict, members' obligations under the Charter prevail; read with
      art 25, Council decisions take priority over conflicting treaties.
  - key: q219
    type: short
    concept: security-council-composition-and-powers
    difficulty: 3
    prompt: >-
      State X's bilateral treaty with State Y obliges X to supply Y with arms. The Security Council, acting under
      Chapter VII, decides that all members must impose an arms embargo on Y. Advise X on the Council's authority to
      bind it and on which obligation prevails.
    model: >-
      Issue: whether X is bound by the Council's decision and, if so, whether that obligation overrides its treaty with
      Y.


      Law: members confer on the Security Council primary responsibility for the maintenance of international peace and

      security and agree that it acts on their behalf (art 24(1)); its specific powers are in Chapters VI, VII, VIII and
      XII

      (art 24(2)). Under Chapter VII, once it determines a threat to the peace (art 39), it may decide on measures not

      involving armed force (art 41) — a non-exhaustive list that includes arms embargoes. Members "agree to accept and
      carry

      out the decisions of the Security Council" (art 25), and where Charter obligations conflict with obligations under

      any other international agreement, "their obligations under the present Charter shall prevail" (art 103).


      Application: the embargo is a Chapter VII decision, so it binds X under art 25 whether or not X sits on the
      Council or

      agreed to it. X's duty to supply arms under the bilateral treaty conflicts with it, and art 103 resolves the
      conflict in

      favour of the Charter.


      Conclusion: X must comply with the embargo; its treaty obligation to Y gives way.
    rubric:
      - id: r1
        criterion: 'Issue: identifies the conflict between the Council decision and the treaty'
        marks: 1
        top-band: States both questions — is X bound, and which obligation prevails?
        margin-note: Two questions here, not one.
        authorities: []
      - id: r2
        criterion: 'Law: arts 24, 39, 41, 25 and 103'
        marks: 4
        top-band: >-
          Explains primary responsibility, the Chapter VII basis for an arms embargo, the binding effect of art 25 and
          the priority rule in art 103.
        margin-note: Where does the embargo power come from, and why does it bind X? Name the articles.
        authorities:
          - un-charter-art-24
          - un-charter-art-39
          - un-charter-art-41
          - un-charter-art-25
          - un-charter-art-103
      - id: r3
        criterion: Application to X and Y
        marks: 3
        top-band: >-
          Notes the decision binds X regardless of its Council seat or vote, and applies art 103 to the specific treaty
          conflict.
        margin-note: Does it matter that X never agreed to the embargo? Say why not.
        authorities: []
      - id: r4
        criterion: Conclusion
        marks: 2
        top-band: 'Clear advice: comply with the embargo; the treaty obligation gives way under art 103.'
        margin-note: Give X an answer it can act on.
        authorities: []
  - key: q220
    type: mcq
    concept: security-council-composition-and-powers
    difficulty: 2
    stem: Which body elects the non-permanent members of the Security Council, according to the slides?
    options:
      - text: The permanent members, by unanimous choice among themselves.
        why: >-
          Wrong — the P-5 do not choose the elected members; the slides say the General Assembly elects them, five each
          year.
      - text: The General Assembly, five members each year.
        correct: true
        why: >-
          Correct — the slides say the ten non-permanent members are elected for two-year terms, five each year, by the
          UN General Assembly.
      - text: The Secretary-General, after consulting regional organisations.
        why: >-
          Wrong — the Secretary-General is appointed by the Assembly and leads the Secretariat; the slides give the
          Secretary-General no role in Council elections.
      - text: Each regional group directly, with no UN-wide vote at all.
        why: >-
          Tempting because seats are divided along regional lines, but the slides say the General Assembly elects the
          members.
  - key: q301
    type: mcq
    concept: peaceful-settlement-under-chapter-vi
    difficulty: 1
    stem: Which of these is NOT among the means of peaceful settlement listed in art 33(1)?
    options:
      - text: Enquiry.
        why: >-
          Enquiry is listed in art 33(1) — negotiation, enquiry, mediation, conciliation, arbitration, judicial
          settlement, regional agencies or arrangements, or other peaceful means.
      - text: Conciliation.
        why: >-
          Conciliation is listed in art 33(1), between mediation and arbitration; it is one of the peaceful means the
          parties must first seek.
      - text: Economic sanctions.
        correct: true
        why: >-
          Correct — sanctions are coercive measures decided by the Council under art 41 (Chapter VII); art 33(1) lists
          only peaceful means chosen by the parties.
      - text: Resort to regional agencies or arrangements.
        why: >-
          This is in art 33(1): "resort to regional agencies or arrangements" is one of the listed peaceful means,
          alongside the open-ended "other peaceful means of their own choice".
  - key: q302
    type: mcq
    concept: peaceful-settlement-under-chapter-vi
    difficulty: 1
    stem: Under art 33(1), which disputes must the parties "first of all" try to settle by peaceful means?
    options:
      - text: Those whose continuance is likely to endanger international peace and security.
        correct: true
        why: >-
          Correct — art 33(1) applies to "any dispute, the continuance of which is likely to endanger the maintenance of
          international peace and security".
      - text: Only those the Council has already found to be a threat to the peace under art 39.
        why: >-
          Tempting because art 39 also concerns peace, but it is the Chapter VII trigger; the art 33(1) duty arises
          earlier, for disputes likely to endanger peace.
      - text: Only those where both parties accept the compulsory jurisdiction of the ICJ.
        why: >-
          Wrong — judicial settlement is only one of the listed means; the duty in art 33(1) does not depend on
          accepting the ICJ's jurisdiction.
      - text: Every dispute, however minor, including purely domestic disagreements.
        why: >-
          Too wide — art 33(1) is limited to disputes whose continuance is likely to endanger the maintenance of
          international peace and security.
  - key: q303
    type: mcq
    concept: peaceful-settlement-under-chapter-vi
    difficulty: 2
    stem: What may the Security Council do under art 33(2)?
    options:
      - text: Order the parties into arbitration, with art 41 sanctions if either refuses.
        why: >-
          Wrong — Chapter VI does not let the Council impose arbitration or sanctions; sanctions are Chapter VII art 41
          measures.
      - text: Call on the parties, when it deems necessary, to settle by art 33(1) means.
        correct: true
        why: >-
          Correct — art 33(2): "The Security Council shall, when it deems necessary, call upon the parties to settle
          their dispute by such means."
      - text: Impose a settlement of its own that binds the parties at once under art 25.
        why: >-
          Tempting because art 25 makes Council decisions binding, but under art 33(2) the Council calls upon the
          parties; it does not impose a settlement.
      - text: Send the dispute to the General Assembly for a binding vote by all members.
        why: >-
          Wrong — the Assembly makes recommendations, not binding decisions, and art 33(2) concerns the Council calling
          on the parties itself.
  - key: q304
    type: mcq
    concept: peaceful-settlement-under-chapter-vi
    difficulty: 2
    stem: Under art 34, what can the Security Council investigate?
    options:
      - text: Only disputes that a party has already submitted to the ICJ.
        why: >-
          Wrong — art 34 is not tied to ICJ proceedings; it lets the Council investigate any dispute or situation that
          might lead to friction.
      - text: Only questions that the General Assembly has referred to it under art 11(2).
        why: >-
          Tempting because the Assembly must refer questions needing action, but art 34 lets the Council investigate of
          its own motion.
      - text: Any dispute, or any situation that might lead to international friction or a dispute.
        correct: true
        why: >-
          Correct — art 34: the Council can investigate any dispute, or any situation which might lead to international
          friction or give rise to a dispute, to see if it endangers peace and security.
      - text: Only armed conflicts it has already determined to be a breach of the peace.
        why: >-
          Wrong — that confuses art 34 with art 39; investigation under art 34 comes earlier, to see whether a situation
          is a danger to peace at all.
  - key: q305
    type: mcq
    concept: peaceful-settlement-under-chapter-vi
    difficulty: 2
    stem: Under art 35, who may bring a dispute or situation to the attention of the Security Council?
    options:
      - text: Only the parties to the dispute itself.
        why: >-
          Too narrow — art 35 allows any member of the United Nations, not only the disputing parties, to bring the
          matter to the Council.
      - text: Any member of the United Nations.
        correct: true
        why: >-
          Correct — art 35: any member may bring any dispute, or a situation of the kind referred to in art 34, to the
          attention of the Council (or of the General Assembly).
      - text: Only the five permanent members, as holders of the veto.
        why: >-
          Wrong — the veto concerns voting (art 27(3)); art 35 gives every UN member the right to raise a dispute with
          the Council.
      - text: Only the Secretary-General, using the power in art 99.
        why: >-
          Tempting because art 99 lets the Secretary-General raise threats, but art 35 separately gives any member that
          right.
  - key: q306
    type: mcq
    concept: peaceful-settlement-under-chapter-vi
    difficulty: 2
    stem: What does art 36(3) say the Security Council should consider about legal disputes?
    options:
      - text: That, as a general rule, the parties should refer them to the ICJ.
        correct: true
        why: >-
          Correct — art 36(3): the Council should consider that legal disputes should as a general rule be referred by
          the parties to the International Court of Justice.
      - text: That the Council must always decide them itself under Chapter VII.
        why: >-
          Wrong — art 36(3) points legal disputes towards the ICJ; Chapter VII is for threats to the peace, breaches and
          aggression.
      - text: That the Secretary-General should send them to the Permanent Court of Arbitration.
        why: >-
          Tempting because the PCA appears in the tools table, but art 36(3) names the ICJ, and the parties — not the
          Secretary-General — refer the dispute.
      - text: That they fall outside the Charter and must be settled by bilateral negotiation.
        why: >-
          Wrong — legal disputes are squarely within Chapter VI; art 36(3) simply says they should generally go to the
          ICJ.
  - key: q307
    type: mcq
    concept: peaceful-settlement-under-chapter-vi
    difficulty: 2
    stem: What does art 37(1) require of parties who fail to settle a dispute by the means in art 33?
    options:
      - text: They shall refer it to the International Court of Justice.
        why: Tempting because art 36(3) mentions the ICJ, but art 37(1) requires referral to the Security Council.
      - text: They may then use force in self-defence under art 51.
        why: >-
          Wrong — failure to settle does not trigger self-defence, which needs an armed attack; art 37(1) requires
          referral to the Council.
      - text: They shall submit it to the General Assembly for a vote.
        why: Wrong — art 37(1) names the Security Council; the Assembly has only a subsidiary, recommendatory role.
      - text: They shall refer it to the Security Council.
        correct: true
        why: >-
          Correct — art 37(1): the parties who fail to settle a dispute by the means indicated in art 33 shall refer it
          to the Security Council.
  - key: q308
    type: mcq
    concept: peaceful-settlement-under-chapter-vi
    difficulty: 2
    stem: Under art 36(1), what may the Security Council recommend?
    options:
      - text: Appropriate procedures or methods of adjustment.
        correct: true
        why: >-
          Correct — art 36(1): the Council can recommend appropriate procedures or methods of adjustment; Chapter VI
          powers are recommendatory.
      - text: Binding sanctions to compel the parties to settle.
        why: >-
          Wrong — sanctions are coercive art 41 measures under Chapter VII, available only after an art 39
          determination.
      - text: The use of armed force by a coalition of states.
        why: Wrong — authorising force is art 42 (Chapter VII); Chapter VI concerns peaceful settlement only.
      - text: Provisional measures that bind the parties at once.
        why: >-
          Tempting because provisional measures sound procedural, but they are art 40, in Chapter VII; art 36(1)
          recommends procedures.
  - key: q309
    type: mcq
    concept: peaceful-settlement-under-chapter-vi
    difficulty: 3
    contrasts-with:
      - article-39-determination-and-provisional-measures
    stem: What is the key difference between the Council's role under Chapter VI and under Chapter VII?
    options:
      - text: Under Chapter VI it decides binding sanctions; under Chapter VII it only recommends.
        why: >-
          Reversed — Chapter VI is investigative and recommendatory; Chapter VII is where the Council decides coercive
          measures (arts 41, 42).
      - text: 'Chapter VI: it investigates, calls on parties and recommends. Chapter VII: it decides coercive measures.'
        correct: true
        why: >-
          Correct — under Chapter VI the Council investigates (art 34), calls on parties (art 33(2)) and recommends (art
          36); under Chapter VII, after an art 39 determination, it decides measures under arts 41 and 42.
      - text: Chapter VI covers only legal disputes; Chapter VII covers only political disputes.
        why: >-
          Wrong — Chapter VI covers any dispute or situation likely to endanger peace; Chapter VII turns on threats,
          breaches and acts of aggression, not on legal versus political.
      - text: Chapter VI is exercised by the General Assembly; Chapter VII by the Security Council.
        why: >-
          Tempting because art 35 lets members go to the Assembly too, but arts 33–37 describe the Security Council's
          role in peaceful settlement.
  - key: q310
    type: mcq
    concept: peaceful-settlement-under-chapter-vi
    difficulty: 2
    stem: Which means does the slides' tools table group under peaceful settlement (Chapter VI, art 33)?
    options:
      - text: Sanctions, arms embargoes and peacekeeping operations without force.
        why: These are collective security without the use of force — Chapter VII, art 41 — not peaceful settlement.
      - text: Good offices, inquiry, mediation, conciliation, adjudication and arbitration.
        correct: true
        why: >-
          Correct — the table lists good offices, inquiry, mediation, conciliation, adjudication (ICJ) and arbitration
          (PCA) under Chapter VI, art 33.
      - text: Coalitions of states, regional bodies and peacekeeping operations using force.
        why: These are collective security with the use of force — Chapter VII, art 42 — the opposite end of the toolkit.
      - text: Ad hoc criminal tribunals and Chapter VII referrals to the ICC Prosecutor.
        why: >-
          Tempting because courts sound like adjudication, but the slides treat tribunals and ICC referrals as
          non-forcible Chapter VII measures, not peaceful settlement.
  - key: q311
    type: mcq
    concept: peaceful-settlement-under-chapter-vi
    difficulty: 3
    stem: >-
      In the tutorial's Aeystan scenario the ABC Union appeals to the Security Council. Before any coercive measures,
      what may the Council do under Chapter VI?
    options:
      - text: Authorise the ABC Union to use force at once, because regional bodies act under art 33.
        why: >-
          Wrong — art 33 lists regional agencies as a peaceful means; authorising a regional organisation to enforce
          decisions is art 53, and force needs Chapter VII.
      - text: Nothing — Chapter VI applies only once the parties agree to go to the ICJ.
        why: >-
          Wrong — the Council's Chapter VI powers (arts 33(2), 34, 36) do not depend on the parties accepting the ICJ's
          jurisdiction.
      - text: Investigate whether the situation endangers peace (art 34) and call for peaceful settlement (art 33(2)).
        correct: true
        why: >-
          Correct — the Council can investigate the situation (art 34), call on the parties to settle by art 33 means
          (art 33(2)) and recommend procedures (art 36(1)) before turning to Chapter VII.
      - text: Impose comprehensive sanctions on Belandia and Ceria under art 36(1).
        why: >-
          Wrong — art 36(1) only recommends procedures or methods of adjustment; sanctions are art 41 measures after an
          art 39 determination.
  - key: q312
    type: mcq
    concept: peaceful-settlement-under-chapter-vi
    difficulty: 3
    variant-of: q307
    stem: >-
      States M and N have tried negotiation and mediation over a border dispute for years without success, and tension
      is rising. What does art 37(1) require?
    options:
      - text: M and N may now use force, since peaceful means have been exhausted.
        why: >-
          Tempting because peaceful means have failed, but art 37(1) requires referral to the Council; failure to settle
          never licenses force.
      - text: The Secretary-General must impose arbitration on M and N under art 99.
        why: >-
          Wrong — art 99 lets the Secretary-General bring threats to the Council's attention; it gives no power to
          impose arbitration.
      - text: M and N shall refer the dispute to the Security Council.
        correct: true
        why: >-
          Correct — art 37(1): parties who fail to settle a dispute by the art 33 means shall refer it to the Security
          Council.
      - text: M and N must wait for an art 39 determination before doing anything.
        why: >-
          Wrong — art 37(1) puts the onus on the parties to refer the dispute; an art 39 determination is a separate
          Chapter VII step.
  - key: q313
    type: mcq
    concept: peaceful-settlement-under-chapter-vi
    difficulty: 2
    stem: Art 33(1) ends with "or other peaceful means of their own choice". What does this tell you about its list?
    options:
      - text: 'The list is open-ended: parties may use other peaceful means they choose.'
        correct: true
        why: >-
          Correct — the closing words "or other peaceful means of their own choice" make the art 33(1) list open-ended;
          choice of means stays with the parties.
      - text: Regional bodies may be used only after the ICJ has declined jurisdiction.
        why: >-
          Wrong — art 33(1) sets no order or precondition between the means; regional agencies are simply one option
          among them.
      - text: The list is closed, and the means must be tried strictly in the order given.
        why: >-
          Wrong on both counts: the closing words leave the list open, and nothing in art 33(1) requires the listed
          order to be followed.
      - text: Any means the parties choose binds them like a Security Council decision.
        why: >-
          Wrong — art 25 binds members to Council decisions; a means the parties choose under art 33(1) is a peaceful
          option, not a Council decision.
  - key: q314
    type: mcq
    concept: peaceful-settlement-under-chapter-vi
    difficulty: 1
    stem: Which Chapter of the UN Charter deals with the pacific settlement of disputes?
    options:
      - text: Chapter VII.
        why: >-
          Tempting because Chapter VII is the Council's best-known chapter, but it covers threats to the peace, breaches
          and aggression, not pacific settlement.
      - text: Chapter VIII.
        why: Wrong — Chapter VIII concerns regional arrangements (e.g. art 53); peaceful settlement is Chapter VI.
      - text: Chapter VI.
        correct: true
        why: >-
          Correct — the slides title it "United Nations Charter, Chapter VI: Pacific Settlement of Disputes", beginning
          with art 33.
      - text: Chapter I.
        why: >-
          Tempting because art 1(1) mentions peaceful settlement among the Purposes, but the machinery for it is in
          Chapter VI.
  - key: q315
    type: mcq
    concept: peaceful-settlement-under-chapter-vi
    difficulty: 2
    stem: Under art 35, to which body other than the Security Council may a member bring a dispute?
    options:
      - text: The ICJ, without the consent of the other party.
        why: >-
          Wrong — art 35 is about bringing matters to the attention of UN political organs; it creates no ICJ
          jurisdiction without consent.
      - text: The General Assembly.
        correct: true
        why: >-
          Correct — art 35 allows any member to bring a dispute or situation to the attention of the Security Council
          "(or of the General Assembly)".
      - text: The Secretary-General, who then decides it.
        why: >-
          Wrong — the Secretary-General does not decide disputes; art 99 and good offices are about alerting the Council
          and mediating.
      - text: The Economic and Social Council.
        why: ECOSOC is a principal organ in the chart, but art 35 names the Security Council and the General Assembly only.
  - key: q316
    type: mcq
    concept: peaceful-settlement-under-chapter-vi
    difficulty: 4
    variant-of: q306
    stem: A student argues that art 36(3) obliges the Council to send every legal dispute to the ICJ itself. Is that right?
    options:
      - text: Yes — art 36(3) gives the ICJ compulsory jurisdiction over any legal dispute that the Council considers.
        why: >-
          Wrong — art 36(3) is guidance for the Council's recommendations; it creates no compulsory jurisdiction for the
          Court.
      - text: Yes — the Council itself must file an application with the ICJ under art 36(3).
        why: Wrong — art 36(3) speaks of disputes being referred "by the parties", not by the Council.
      - text: No — the Council should consider that, as a general rule, the parties refer legal disputes to the ICJ.
        correct: true
        why: >-
          Correct — art 36(3) says the Council should consider that legal disputes should as a general rule be referred
          by the parties to the ICJ: a general rule, and a referral by the parties.
      - text: No — art 36(3) bars the ICJ from hearing any dispute already before the Council.
        why: Wrong — art 36(3) points legal disputes towards the ICJ; it does not stop the Court hearing them.
  - key: q317
    type: match
    concept: peaceful-settlement-under-chapter-vi
    difficulty: 2
    prompt: Match each Chapter VI provision to what it provides.
    pairs:
      - left: Art 33(1)
        right: Parties first seek a solution by peaceful means of their own choice
      - left: Art 34
        right: The Council may investigate any dispute or situation
      - left: Art 35
        right: Any member may bring a dispute to the Council or the Assembly
      - left: Art 36(3)
        right: Legal disputes generally referred by the parties to the ICJ
      - left: Art 37(1)
        right: Parties who fail to settle refer the dispute to the Council
  - key: q318
    type: truefalse
    concept: peaceful-settlement-under-chapter-vi
    difficulty: 1
    set: quickfire
    statement: >-
      Art 33(1) requires parties to a dispute likely to endanger international peace and security to seek a solution
      first of all by peaceful means of their own choice.
    answer: true
    why: >-
      True — art 33(1) lists negotiation, enquiry, mediation, conciliation, arbitration, judicial settlement and
      regional agencies, or other peaceful means of the parties' own choice.
  - key: q319
    type: truefalse
    concept: peaceful-settlement-under-chapter-vi
    difficulty: 1
    set: quickfire
    statement: Under Chapter VI the Security Council can impose binding economic sanctions on the parties to a dispute.
    answer: false
    why: >-
      False — Chapter VI powers are to investigate, call on the parties and recommend (arts 33(2), 34, 36); sanctions
      are Chapter VII art 41 measures.
  - key: q320
    type: short
    concept: peaceful-settlement-under-chapter-vi
    difficulty: 3
    prompt: >-
      Explain the role of the Security Council in the peaceful settlement of disputes under Chapter VI of the UN
      Charter, and how it fits within the Council's wider tools for maintaining international peace and security.
    model: >-
      Chapter VI deals with the pacific settlement of disputes. Under art 33(1), the parties to any dispute whose

      continuance is likely to endanger international peace and security must "first of all" seek a solution by

      negotiation, enquiry, mediation, conciliation, arbitration, judicial settlement, resort to regional agencies or
      other

      peaceful means of their own choice. The Security Council shall, when it deems necessary, call on them to do so

      (art 33(2)).


      The Council can investigate any dispute or situation which might lead to international friction, to see if it

      endangers peace (art 34); any member may bring such a matter to the Council or the General Assembly (art 35). The

      Council can recommend procedures or methods of adjustment (art 36(1)) and should consider that legal disputes
      should

      generally be referred by the parties to the ICJ (art 36(3)). Parties who fail to settle by art 33 means shall
      refer the

      dispute to the Council (art 37(1)).


      These powers are recommendatory. Peaceful settlement is the first of three tools: if the Council determines a
      threat

      to the peace, breach of the peace or act of aggression (art 39), it moves to Chapter VII — non-forcible measures

      (art 41) and, as a last resort, force (art 42).
    rubric:
      - id: r1
        criterion: States the art 33 duty and the listed means
        marks: 2
        top-band: Quotes or closely paraphrases art 33(1), notes the open-ended "other peaceful means", and art 33(2).
        margin-note: Which disputes trigger art 33? Use the "likely to endanger" threshold.
        authorities:
          - un-charter-art-33-1
      - id: r2
        criterion: Explains the Council's Chapter VI powers
        marks: 3
        top-band: Covers arts 34, 35, 36(1), 36(3) and 37(1) accurately and in order.
        margin-note: 'Good — but say who refers legal disputes to the ICJ: the parties, not the Council.'
        authorities: []
      - id: r3
        criterion: Characterises Chapter VI as recommendatory
        marks: 2
        top-band: Contrasts recommendations under Chapter VI with binding decisions under Chapter VII.
        margin-note: Can the Council impose anything under Chapter VI? Say so plainly.
        authorities: []
      - id: r4
        criterion: Places Chapter VI within the wider toolkit
        marks: 3
        top-band: Links peaceful settlement to the art 39 determination and the move to arts 41 and 42.
        margin-note: Where does Chapter VI end and Chapter VII begin? Name the trigger.
        authorities:
          - un-charter-art-39
          - un-charter-art-41
          - un-charter-art-42
  - key: q401
    type: mcq
    concept: article-39-determination-and-provisional-measures
    difficulty: 1
    set: pretest
    stem: What must the Security Council determine under art 39 before it decides on measures under arts 41 and 42?
    options:
      - text: The existence of a threat to the peace, breach of the peace, or act of aggression.
        correct: true
        why: >-
          Correct — art 39: the Council "shall determine the existence of any threat to the peace, breach of the peace,
          or act of aggression" and then recommends or decides measures under arts 41 and 42.
      - text: That an armed attack has occurred against a member of the United Nations.
        why: >-
          Tempting because "armed attack" is the trigger for self-defence under art 51, but art 39 asks about a threat
          to the peace, breach of the peace or act of aggression.
      - text: That the parties have exhausted every peaceful means listed in art 33(1).
        why: >-
          Tempting because peaceful settlement comes first in the toolkit, but art 39's trigger is the Council's
          determination of a threat, breach or aggression, not exhaustion of art 33.
      - text: That the General Assembly has recommended collective measures.
        why: >-
          Wrong — the Council acts on its own primary responsibility; an Assembly recommendation is relevant only under
          Uniting for Peace when the Council is deadlocked.
  - key: q402
    type: mcq
    concept: article-39-determination-and-provisional-measures
    difficulty: 2
    stem: >-
      According to the slides' account of evolving practice, which of these has the Council treated as within its art 39
      power?
    options:
      - text: A state's refusal to ratify a human rights treaty.
        why: 'Not in the slides: practice covers serious human rights or IHL violations, not a refusal to ratify a treaty.'
      - text: The 2014 Ebola outbreak in Africa.
        correct: true
        why: >-
          Correct — the slides list the 2014 Ebola outbreak in Africa among examples of the Council's evolving
          interpretation of its power to determine the situation.
      - text: A fishing dispute already settled by arbitration.
        why: >-
          Wrong — a dispute already settled peacefully is not a threat to the peace; the slides' examples are
          proliferation, internal conflict, terrorism, serious violations and Ebola.
      - text: A peaceful change of government by election.
        why: >-
          Wrong — nothing in the slides suggests an orderly election could be a threat to the peace; contrast the coup
          and civil war in the tutorial scenario.
  - key: q403
    type: mcq
    concept: article-39-determination-and-provisional-measures
    difficulty: 2
    stem: Which list best reflects the slides' examples of situations the Council has treated as threats under art 39?
    options:
      - text: Only cross-border invasions between states, such as Iraq's occupation of Kuwait.
        why: >-
          Too narrow — the slides stress an evolving interpretation that reaches internal conflicts, terrorism and even
          a disease outbreak.
      - text: Trade disputes, currency manipulation and breaches of investment treaties.
        why: >-
          None of these appears in the slides' list of art 39 practice; they are economic disputes, not threats to peace
          as interpreted by the Council.
      - text: Weapons proliferation, internal armed conflicts, terrorism, serious human rights or IHL violations.
        correct: true
        why: >-
          Correct — the slides list proliferation of nuclear, chemical or biological weapons; internal armed conflicts;
          terrorism; serious human rights or IHL violations; and the 2014 Ebola outbreak.
      - text: Only situations that the ICJ has first found to be internationally wrongful acts.
        why: >-
          Wrong — the art 39 determination is the Council's own; the slides attach no requirement of a prior ICJ
          finding.
  - key: q404
    type: mcq
    concept: article-39-determination-and-provisional-measures
    difficulty: 2
    stem: What is the purpose of provisional measures under art 40?
    options:
      - text: To prevent an aggravation of the situation before measures are decided.
        correct: true
        why: >-
          Correct — art 40 begins "In order to prevent an aggravation of the situation" and lets the Council call for
          provisional measures before recommending or deciding measures under art 39.
      - text: To punish the party responsible for the breach before any measures are decided.
        why: >-
          Wrong — art 40 measures are "without prejudice to the rights, claims, or position of the parties", so they are
          not a finding of responsibility or a punishment.
      - text: To settle the parties' underlying rights so the dispute goes no further.
        why: >-
          Wrong — provisional measures expressly do not prejudice the parties' rights, claims or position; they hold the
          situation, they do not settle it.
      - text: To authorise member states to use force while the Council deliberates.
        why: >-
          Wrong — authorising force is art 42, conditioned on art 41 being inadequate; art 40 calls on the parties to
          comply with provisional steps.
  - key: q405
    type: mcq
    concept: article-39-determination-and-provisional-measures
    difficulty: 2
    stem: Art 40 provisional measures are "without prejudice" to what?
    options:
      - text: The Council's power to authorise force under art 42.
        why: >-
          Tempting because art 40 comes before arts 41–42, but the "without prejudice" clause protects the parties, not
          the Council's powers.
      - text: The rights, claims, or position of the parties concerned.
        correct: true
        why: >-
          Correct — art 40: "Such provisional measures shall be without prejudice to the rights, claims, or position of
          the parties concerned."
      - text: Any earlier ruling of the International Court of Justice.
        why: >-
          Not in art 40: the clause is about the parties' rights, claims and position, and says nothing about ICJ
          rulings.
      - text: The General Assembly's power to recommend under art 14.
        why: >-
          Wrong — art 14 is limited by art 12, not by art 40; the "without prejudice" clause protects the parties
          concerned.
  - key: q406
    type: mcq
    concept: article-39-determination-and-provisional-measures
    difficulty: 3
    stem: What happens, under art 40, if a party fails to comply with provisional measures?
    options:
      - text: The failure counts as an armed attack, triggering self-defence under art 51.
        why: >-
          Wrong — non-compliance with provisional measures is not an armed attack; art 40 says the Council takes the
          failure into account.
      - text: Force under art 42 is automatically authorised against the non-complying party.
        why: >-
          Wrong — nothing in Chapter VII is automatic; force requires a Council decision that art 41 measures would be
          or have proved inadequate.
      - text: The Council shall duly take account of the failure to comply.
        correct: true
        why: >-
          Correct — art 40's last sentence: "The Security Council shall duly take account of failure to comply with such
          provisional measures."
      - text: Nothing — provisional measures are recommendations with no consequence.
        why: >-
          Tempting because the measures are "called for", but art 40 expressly says the Council shall duly take account
          of a failure to comply.
  - key: q407
    type: mcq
    concept: article-39-determination-and-provisional-measures
    difficulty: 3
    stem: In what order does Chapter VII envisage the Council's steps?
    options:
      - text: Art 39 determination; any art 40 measures; art 41; art 42 if art 41 is or would be inadequate.
        correct: true
        why: >-
          Correct — art 39 is the determination, art 40 provisional measures may come before measures are decided, then
          art 41, and art 42 where art 41 measures would be or have proved inadequate.
      - text: Art 42 force first, then art 41 sanctions, then an art 39 determination once peace returns.
        why: >-
          Reversed — force is the last resort, and the art 39 determination must come first because it opens the way to
          arts 41 and 42.
      - text: Art 41 sanctions first, then an art 39 determination, then art 42 force, then art 40 provisional measures.
        why: >-
          Wrong — art 41 measures are decided "in accordance with" art 39, so the determination comes first; art 40
          measures come before measures are decided.
      - text: Art 40 measures, then art 42 force, then an art 39 determination, then art 41 sanctions.
        why: >-
          Wrong — art 39 must come first, and art 42 is conditioned on art 41 measures being inadequate, so it cannot
          precede them in principle.
  - key: q408
    type: mcq
    concept: article-39-determination-and-provisional-measures
    difficulty: 3
    stem: Does art 42 require the Council to have actually tried art 41 measures first?
    options:
      - text: Yes — art 42 applies only once sanctions have been tried and demonstrably failed.
        why: >-
          Too strict — art 42 also applies where the Council considers art 41 measures "would be inadequate", without
          trying them first.
      - text: No — it is enough that the Council considers art 41 measures "would be inadequate".
        correct: true
        why: >-
          Correct — art 42 applies where the Council considers art 41 measures "would be inadequate or have proved to be
          inadequate": the judgment can be prospective.
      - text: Yes — the General Assembly must first certify that art 41 measures have failed.
        why: >-
          Wrong — the judgment is the Council's ("Should the Security Council consider…"); the Assembly has no
          certifying role.
      - text: No — art 42 is available whenever the Council prefers force, with no link to art 41.
        why: Wrong — art 42 is expressly conditioned on art 41 being inadequate, and the slides call force a last resort.
  - key: q409
    type: mcq
    concept: article-39-determination-and-provisional-measures
    difficulty: 2
    stem: Once the Council determines a threat to the peace under art 39, what may it do?
    options:
      - text: Only make recommendations; binding decisions need an Assembly vote.
        why: >-
          Wrong — art 39 lets the Council itself "decide what measures shall be taken", and art 25 makes those decisions
          binding.
      - text: Only refer the matter to the ICJ for a binding judgment.
        why: >-
          Wrong — art 39 points to measures under arts 41 and 42, not to the ICJ; legal disputes go to the Court under
          art 36(3).
      - text: Make recommendations, or decide measures under arts 41 and 42.
        correct: true
        why: >-
          Correct — art 39: the Council "shall make recommendations, or decide what measures shall be taken in
          accordance with Articles 41 and 42".
      - text: Only call on the parties to negotiate under art 33(1).
        why: >-
          Tempting because the Council can do this under Chapter VI (art 33(2)), but art 39 opens Chapter VII measures
          as well.
  - key: q410
    type: mcq
    concept: article-39-determination-and-provisional-measures
    difficulty: 4
    stem: >-
      In the Aeystan scenario, fighting is internal after a coup, but thousands have fled across borders and neighbours
      are arming rival factions. Can the Council make an art 39 determination?
    options:
      - text: No — art 39 covers only acts of aggression between states, so a civil war is outside Chapter VII.
        why: >-
          Wrong — art 39 lists threats to the peace and breaches of the peace as well, and the slides say practice
          treats internal armed conflicts as threats.
      - text: No — the Council needs the consent of whoever holds power in Aeystan.
        why: >-
          Tempting because consent is a principle of peacekeeping, but an art 39 determination needs no consent; it is
          the Council's own judgment.
      - text: >-
          Yes — practice treats internal conflicts and serious violations as threats, and here the effects cross
          borders.
        correct: true
        why: >-
          Correct — the slides' examples of evolving practice include internal armed conflicts and serious human rights
          or IHL violations; refugees and foreign arms and troops strengthen the case.
      - text: Only if the ICJ first finds that Belandia and Ceria committed an armed attack.
        why: >-
          Wrong — the art 39 determination is the Council's; it needs no prior ICJ finding, and "armed attack" is the
          art 51 test, not the art 39 one.
  - key: q411
    type: mcq
    concept: article-39-determination-and-provisional-measures
