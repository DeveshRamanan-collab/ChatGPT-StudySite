    title: Chapter VII — the art 39 determination, provisional measures and the path to force
    visual: simulation
    visual-brief: >-
      Controls set the situation and the Council's findings; a gate opens only when the Council determines a threat to
      the peace, breach of the peace or act of aggression (art 39), then the path steps through provisional measures
      (art 40), non-forcible measures (art 41) and, only if those would be or have proved inadequate, force (art 42).
