      - certain-expenses-of-the-united-nations
    verify: false
    slug: un-charter-art-14
    title: UN Charter art 14
    text: >-
      "Subject to the provisions of Article 12, the General Assembly may recommend measures for the peaceful adjustment
      of any situation, regardless of origin, which it deems likely to impair the general welfare or friendly relations
      among nations, including situations resulting from a violation of the provisions of the present Charter setting
      forth the Purposes and Principles of the United Nations."
    gloss: >-
      The Assembly may recommend measures for the peaceful adjustment of situations — recommendations, not binding
      decisions, and subject to art 12.
  - kind: other
