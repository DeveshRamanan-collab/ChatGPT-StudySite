      - text: Practice treats internal conflicts and serious human rights or IHL violations as threats to the peace.
        correct: true
        why: >-
          Correct — the slides list internal armed conflicts and serious human rights or IHL violations within the
          Council's evolving art 39 practice — though a P-5 veto could still block action.
      - text: The Council may act only if the state consents, as with peacekeeping.
        why: >-
