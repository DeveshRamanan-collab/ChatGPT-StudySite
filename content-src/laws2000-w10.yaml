  - key: q1018
    type: truefalse
    concept: article-39-findings-in-practice
    difficulty: 2
    statement: The Council's practice limits "threat to the peace" to armed conflicts between states.
    answer: false
    why: >-
      False — the finding has widened to non-traditional threats: proliferation, terrorism, internal armed conflicts,
