  - key: q1020
    type: match
    concept: article-39-findings-in-practice
    difficulty: 2
    prompt: Match each item to how the Security Council has used it in practice, according to this week's materials.
    pairs:
      - left: Act of aggression
        right: Never or very rarely found
      - left: Breach of the peace
        right: A very few invasions of territory (e.g. Iraq–Kuwait 1990)
      - left: Threat to the peace
        right: The usual finding, now covering non-traditional threats
      - left: Cold War
        right: Deadlock made Chapter VII determinations hard to reach
  - key: q1021
    type: short
    concept: article-39-findings-in-practice
    difficulty: 3
    prompt: >-
      Explain how the Security Council has used the three findings in art 39 in practice, and why "threat to the peace"
      has become its main route into Chapter VII.
    model: >-
      Art 39 of the Charter of the United Nations requires the Security Council to "determine the existence of any
      threat

      to the peace, breach of the peace, or act of aggression" before it recommends or decides measures under arts 41
      and

      42. Any one finding opens Chapter VII; without one, the Council can act only under Chapter VI.


      The three findings are used very unequally. The Council has never, or only very rarely, found an act of
      aggression.

      It has found a breach of the peace on a very few occasions, each involving an invasion of territory, such as
      Iraq's

      invasion of Kuwait in 1990. The categories overlap, since an invasion can be both.


      The threat to the peace is by far the most common finding because it is flexible and the Council's to make. Its

      reach has grown from traditional inter-state invasion to non-traditional threats: proliferation of weapons of mass

      destruction, terrorism, internal armed conflicts, serious human rights or IHL violations and the 2014 Ebola
      outbreak.

      During the Cold War, US–Russian tension made such determinations hard to agree; the Council has been far more
      active

      since, though the P-5 veto remains a limit. In a problem, argue for a threat to the peace and support it with the

      closest example from practice.
    rubric:
      - id: r1
        criterion: Art 39 as the gateway to Chapter VII
        marks: 2
        top-band: States the three alternative findings and that one is needed for arts 41–42, while Chapter VI needs none.
        margin-note: What does the determination unlock — and what does not need it?
        authorities:
          - un-charter-art-39
      - id: r2
        criterion: Aggression and breach in practice
        marks: 3
        top-band: Aggression never or very rarely found; breach a very few invasions (Iraq–Kuwait 1990); notes the overlap.
        margin-note: How often has each been found? Give the invasion example.
        authorities: []
      - id: r3
        criterion: 'Threat to the peace: flexible and widening'
        marks: 3
        top-band: >-
          Explains the widening with the materials' examples (proliferation, terrorism, internal conflict, serious
          violations, Ebola 2014).
        margin-note: Why is this finding the Council's usual route? Use the practice list.
        authorities: []
      - id: r4
        criterion: Political context and limits
        marks: 2
        top-band: Links Cold War deadlock to rare determinations, notes greater activity since and the continuing veto.
        margin-note: What held the Council back, and what still can?
        authorities: []
  - key: q1101
    type: mcq
    concept: collective-security-and-the-un-system
    difficulty: 2
    stem: How did the lecture characterise "collective security"?
    options:
      - text: 'An international relations idea more than a legal term: collective, not bilateral, security.'
        correct: true
        why: >-
          Correct — the lecture said collective security is not a legal term; it moves security from the bilateral level
          to the collective level through an organisation.
      - text: A legal term with defined elements set out in art 1(1) of the Charter.
        why: >-
          Tempting because art 1(1) speaks of "effective collective measures", but the lecture stressed collective
          security is not itself a legal term.
      - text: A rule obliging each state to defend its allies under art 51.
        why: >-
          Wrong — art 51 preserves a right of self-defence; it creates no obligation to defend allies, and collective
          security is wider than that.
      - text: A Charter procedure by which the Assembly authorises the use of force.
        why: Wrong — the UN system centralises permissible force in the Security Council; the Assembly recommends.
  - key: q1102
    type: mcq
    concept: collective-security-and-the-un-system
    difficulty: 3
    stem: >-
      NATO is an example of collective security. According to the lecture, may NATO decide for itself to use force
      against a state?
    options:
      - text: Yes — as a regional organisation it has its own power to authorise force.
        why: >-
          Tempting because regional organisations act under Chapter VIII, but they enforce with Council authorisation
          (art 53); they do not authorise themselves.
      - text: Yes — NATO is not itself a member of the UN, so the Charter does not bind it.
        why: >-
          Wrong — the lecture said organisations such as NATO are always governed by the overarching framework of the UN
          Charter.
      - text: No — it needs Council authorisation or a Charter exception like self-defence.
        correct: true
        why: >-
          Correct — NATO cannot decide alone when force is lawful: it needs the Council's authorisation or must meet a
          Charter exception, e.g. self-defence if a member is attacked.
      - text: No — NATO may never use force, even if one of its members is attacked.
        why: >-
          Wrong — the lecture gave the example of a member such as France or the UK being attacked, where self-defence
          would be available.
  - key: q1103
    type: truefalse
    concept: collective-security-and-the-un-system
    difficulty: 1
    statement: >-
      The League of Nations was the first organisation founded on collective security; the UN framework is the second
      iteration.
    answer: true
    why: >-
      True — the slides say both the League and the UN were founded on collective security, and the lecture called the
      UN the second iteration of such an organisation.
  - key: q1104
    type: mcq
    concept: article-39-determination-and-provisional-measures
    difficulty: 1
    stem: Which of these did the lecture give as an example of a provisional measure under art 40?
    options:
      - text: Calling on the parties to agree and implement a ceasefire.
        correct: true
        why: >-
          Correct — the lecture's examples were a ceasefire, a cessation of hostilities and allowing the delivery of
          humanitarian aid.
      - text: Authorising a coalition of states to use all necessary means.
        why: Wrong — authorising force is an art 42 measure (e.g. Res 678), not a provisional measure under art 40.
      - text: Creating an ad hoc international criminal tribunal for the conflict.
        why: Wrong — creating the ICTY and ICTR was an art 41 measure not involving armed force, not a provisional measure.
      - text: Referring the situation to the Prosecutor of the ICC.
        why: >-
          Wrong — a referral to the ICC Prosecutor is made under Chapter VII (Rome Statute art 13(b)); it is not an art
          40 provisional measure.
  - key: q1105
    type: mcq
    concept: article-39-determination-and-provisional-measures
    difficulty: 2
    contrasts-with:
      - laws2000-w08-provisional-measures
    stem: >-
      Art 40 says the Council may call for provisional measures "before" recommending or deciding measures. How does the
      Council act in practice, according to the lecture?
    options:
      - text: It never imposes art 41 measures until provisional measures have been ignored.
        why: >-
          Tempting because it follows the wording, but the lecture said practice is different: provisional demands often
          come with sanctions or force.
      - text: It often demands a ceasefire or humanitarian access while imposing sanctions or authorising force.
        correct: true
        why: >-
          Correct — the lecture explained that the Council frequently combines provisional demands with art 41 or art 42
          action, and this has been accepted.
      - text: It has stopped using provisional measures altogether since the Cold War.
        why: >-
          Wrong — nothing in the materials says provisional measures have fallen out of use; the lecture described how
          they are used today.
      - text: It leaves provisional measures to the ICJ under the Court's Statute.
        why: >-
          Tempting because the ICJ also orders provisional measures (Week 8), but art 40 is the Council's own Chapter
          VII power.
  - key: q1106
    type: mcq
    concept: article-39-determination-and-provisional-measures
    difficulty: 3
    stem: Must the Council make an art 39 determination before calling for provisional measures under art 40?
    options:
      - text: No — art 40 sits in Chapter VI, which never requires a determination.
        why: >-
          Wrong — art 40 is in Chapter VII, straight after art 39; the slides place it under the Council's role in
          response to a threat to the peace.
      - text: Yes — the text of art 40 expressly requires a determination first.
        why: Wrong — art 40 does not say so expressly; that is why the point is debated.
      - text: It is debated, but most scholars say a determination is needed.
        correct: true
        why: >-
          Correct — the lecture said the question is debated, with the majority of scholars requiring an art 39
          determination; the debate can be theoretical where the measure resembles art 33 means.
      - text: No — provisional measures can only be ordered by the ICJ.
        why: >-
          Wrong — art 40 gives the Security Council its own power to call for provisional measures, separate from the
          ICJ's.
  - key: q1107
    type: truefalse
    concept: article-39-determination-and-provisional-measures
    difficulty: 2
    verify: true
    statement: The lecturer said that provisional measures under art 40 are considered binding.
    answer: true
    why: >-
      True as a report of the lecture — the lecturer said provisional measures are considered binding. The slides do not
      say so (art 40 speaks of calling upon the parties), so verify before relying on it.
  - key: q1108
    type: mcq
    concept: non-forcible-measures-under-article-41
    difficulty: 2
    stem: When the Council considered creating the ICTY and ICTR under art 41, what was debated?
    options:
      - text: Whether a political organ could create a tribunal art 41 never mentions.
        correct: true
        why: >-
          Correct — the lecture said it was at first unclear whether the Council had authority under art 41 to create a
          tribunal; members decided it did, and that is no longer questioned.
      - text: Whether the General Assembly had to approve each indictment.
        why: >-
          Wrong — nothing in the materials gives the Assembly a role in the tribunals' indictments; the debate was about
          the Council's own power.
      - text: Whether art 42 rather than art 41 was the right legal basis.
        why: >-
          Tempting because the tribunals followed armed conflicts, but creating a court involves no use of armed force;
          the question was art 41's reach.
      - text: Whether the parties to each conflict had first consented to having a tribunal.
        why: >-
          Wrong — Chapter VII measures do not depend on consent; the debate concerned whether art 41 extended to
          tribunals at all.
  - key: q1109
    type: truefalse
    concept: non-forcible-measures-under-article-41
    difficulty: 1
    statement: Because art 41 says measures "may include" the listed examples, the list is not exhaustive.
    answer: true
    why: >-
      True — the lecture and slides stress the word "include": the list is non-exhaustive, which is how the Council
      could create the ICTY and ICTR under art 41.
  - key: q1110
    type: mcq
    concept: general-assembly-and-secretary-general
    difficulty: 2
    stem: >-
      According to the lecture, how has the relationship between the General Assembly and the Security Council on the
      same situation evolved?
    options:
      - text: The Assembly may now take binding decisions whenever the Council is deadlocked.
        why: >-
          Wrong — even under Uniting for Peace the Assembly recommends collective measures; it does not take binding
          decisions.
      - text: The Assembly must now wait for a Council request before discussing anything.
        why: >-
          Wrong — art 11(2) lets the Assembly discuss any question of peace and security; art 12(1) concerns
          recommendations, and practice has loosened.
      - text: The Council must now refer every situation to the Assembly first.
        why: >-
          Wrong — the Council keeps primary responsibility (art 24); nothing requires it to refer situations to the
          Assembly.
      - text: The Assembly may consider it in parallel, usually taking a broader view.
        correct: true
        why: >-
          Correct — the lecture said the old no-overlap view has evolved: the Assembly may act in parallel, broadly,
          while the Council deals with detailed measures.
