    slug: un-peacekeeping-operations
    title: UN peacekeeping and peace operations
    visual: palace
    visual-brief: >-
      Three rooms for the traditional principles — consent of the parties, impartiality, non-use of force except in
      self-defence — then an annex for how practice has evolved: transitional administration (Kosovo, Timor-Leste) and
      missions authorised to use force (DRC, Mali).
    related:
      - authorisation-of-force-under-article-42
