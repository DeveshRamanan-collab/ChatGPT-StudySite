  - key: q703
    type: mcq
    concept: un-peacekeeping-operations
    difficulty: 2
    stem: What were UN peacekeeping operations primarily created to do?
    options:
      - text: Keep the peace, not enforce it.
        correct: true
        why: Correct — the slides say peacekeeping operations were primarily created to keep the peace, not to enforce it.
      - text: Enforce Council decisions against an aggressor state by military means.
        why: >-
          Wrong — enforcement against an aggressor is what Chapter VII authorisations to states do (e.g. Res 678);
          peacekeeping was created to keep, not enforce, the peace.
      - text: Replace national governments permanently once a conflict has ended.
        why: >-
          Tempting because the UN has acted as a transitional administration (Kosovo, Timor-Leste), but that is a later,
          transitional development, not the original purpose.
      - text: Try individuals for serious violations of international humanitarian law.
        why: >-
          Wrong — trying individuals is the work of ad hoc tribunals (ICTY, ICTR) or the ICC, not peacekeeping
          operations.
