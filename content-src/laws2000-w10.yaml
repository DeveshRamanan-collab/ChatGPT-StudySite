      - text: A breach of the peace.
        why: This is named in art 39, between "threat to the peace" and "act of aggression".
      - text: An act of aggression.
        why: This is named in art 39 — the last of the three situations the Council must determine.
      - text: A dispute whose continuance is likely to endanger peace.
        correct: true
        why: >-
          Correct — that phrase is art 33(1)'s Chapter VI threshold for peaceful settlement; art 39 names threat to the
