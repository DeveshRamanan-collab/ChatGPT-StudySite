      - text: Art 33(1) — peaceful means of the parties' own choice.
        why: >-
          Tempting because a ceasefire is peaceful, but under art 33(1) the parties choose the means; here the Council
          calls for specific provisional steps.
  - key: q416
    type: mcq
    concept: article-39-determination-and-provisional-measures
    difficulty: 1
    stem: Which three situations does art 39 name?
    options:
      - text: Armed attack, self-defence and necessity.
        why: >-
          These belong elsewhere: armed attack and self-defence to art 51, and necessity to state responsibility (ARSIWA
          art 25); none is an art 39 category.
      - text: Threat to the peace, breach of the peace, act of aggression.
        correct: true
        why: >-
          Correct — art 39: the Council shall determine the existence of any threat to the peace, breach of the peace,
          or act of aggression.
      - text: Dispute, situation and international friction.
        why: >-
          Tempting because these words appear in arts 33–34, but they describe Chapter VI's field; art 39 names threat,
          breach and aggression.
      - text: Genocide, war crimes and crimes against humanity.
        why: >-
          These are international crimes; serious IHL violations can be threats in practice, but art 39's three
          categories are threat, breach and aggression.
  - key: q417
    type: mcq
    concept: article-39-determination-and-provisional-measures
    difficulty: 4
    variant-of: q410
    stem: >-
      A government is committing serious human rights and IHL violations against a minority; no other state is involved.
