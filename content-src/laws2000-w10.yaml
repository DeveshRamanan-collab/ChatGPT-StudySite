    visual: diagram
    visual-brief: >-
      Fifteen seats — five permanent seats carrying the veto (art 27(3)) and ten elected seats grouped by region (3
      Africa, 2 Asia, 2 Latin America and Caribbean, 2 WEOG, 1 Eastern Europe) — above a chain: art 24 confers primary
      responsibility → art 25 makes decisions binding → art 103 makes Charter obligations prevail.
    related:
