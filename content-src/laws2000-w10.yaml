      to comply with such provisional measures."
    gloss: >-
      Provisional measures to stop a situation getting worse, without prejudice to the parties' rights; failure to
      comply is taken into account.
  - kind: treaty
    cases: []
    verify: false
    slug: un-charter-art-41
    title: UN Charter art 41
    text: >-
      The Security Council "may decide what measures not involving the use of armed force" are to be employed; these
      "may include complete or partial interruption of economic relations and of rail, sea, air, postal, telegraphic,
      radio, and other means of communication, and the severance of diplomatic relations". (Quoted in part on the
      slides.)
    gloss: >-
      A non-exhaustive list of non-military coercive measures: economic and diplomatic sanctions, arms embargoes, and
      even ad hoc criminal tribunals.
  - kind: treaty
    cases: []
    verify: false
    slug: un-charter-art-11-2
    title: UN Charter art 11(2)
    text: >-
      "The General Assembly may discuss any questions relating to the maintenance of international peace and security
      brought before it … except as provided in Article 12, may make recommendations with regard to any such questions
      to the state or states concerned or to the Security Council or to both. Any such question on which action is
      necessary shall be referred to the Security Council by the General Assembly either before or after discussion."
    gloss: >-
      The General Assembly may discuss and recommend on peace and security, but must refer questions needing action to
      the Security Council.
  - kind: treaty
    cases:
      - construction-of-a-wall-advisory-opinion
    verify: false
    slug: un-charter-art-12-1
