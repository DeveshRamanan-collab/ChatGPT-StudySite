      - certain-expenses-of-the-united-nations
    verify: false
    slug: unga-resolution-377-v
    title: UN General Assembly Resolution 377 (V) (1950) — Uniting for Peace
    text: >-
      "…if the Security Council, because of lack of unanimity of the permanent members, fails to exercise its primary
      responsibility for the maintenance of international peace and security in any case where there appears to be a
      threat to the peace, breach of the peace, or act of aggression, the General Assembly shall consider the matter
      immediately with a view to making appropriate recommendations to Members for collective measures."
    gloss: >-
      When the Council is deadlocked by the permanent members, the Assembly may step in to recommend collective
      measures.
  - kind: treaty
