    cases: []
    authorities: []
    body: >-
      UN peacekeeping or peace operations are not explicitly mentioned in the UN Charter. They were primarily created

      to keep the peace, not to enforce it. Unlike an authorisation to one state or a group of states, these are UN

      operations.


      Traditional principles:


      1. consent of the parties;

      2. impartiality;

      3. non-use of force except in self-defence.


      Peacekeeping is gradually evolving — e.g. the UN as transitional administration in Kosovo and Timor-Leste. There
      is

      also a changing attitude to the use of force: some missions are authorised to use force to carry out their
      mandate,

      such as the missions in the DRC (including targeted offensive operations) and Mali.


      Deployments of UN troops, military experts and police peaked in the mid-1990s and passed 100,000 by 2015, most of

      them in sub-Saharan Africa. Current missions include MONUSCO (DR Congo), MINUSCA (Central African Republic),
      UNMISS

      (South Sudan), UNIFIL (Lebanon), UNFICYP (Cyprus) and UNMIK (Kosovo).


      In the absence of a standing UN army, the Security Council may decide on (1) a UN-run peacekeeping or peace

      operation, or (2) authorise the use of force.


      Exam use: distinguish a consent-based UN peacekeeping operation from a Chapter VII authorisation to states to use

      force.
  - verify: false
    slug: general-assembly-and-secretary-general
    title: The General Assembly, Uniting for Peace and the Secretary-General
    visual: diagram
    visual-brief: >-
      Two organs beside the Security Council: the General Assembly (193 states, one vote each) with a subsidiary
      responsibility — discuss and recommend (arts 11(2), 14), blocked while the Council deals with the matter (art
      12(1)) unless Uniting for Peace applies — and the Secretary-General, who may alert the Council to threats (art 99)
      and offers good offices.
    related:
      - security-council-composition-and-powers
      - collective-security-and-the-un-system
      - decisions-and-recommendations
    depends-on:
