  - key: q514
    type: mcq
    concept: non-forcible-measures-under-article-41
    difficulty: 4
    stem: >-
      In the Aeystan scenario, the Council wants to stop Belandia and Ceria arming factions without harming their
      civilian populations. Which art 41 option best fits the slides?
    options:
