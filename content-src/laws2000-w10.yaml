  - key: q720
    type: short
    concept: un-peacekeeping-operations
    difficulty: 3
    prompt: >-
      Distinguish UN peacekeeping operations from Security Council authorisations to use force, and explain how
      peacekeeping has evolved.
    model: >-
      In the absence of a standing UN army (art 43 has never been implemented), the Security Council may either decide
      on

      a UN-run peacekeeping or peace operation, or authorise the use of force.


      An authorisation empowers one state, a coalition of states or a regional organisation (art 53) to use force — for

      example Res 678 (1990), authorising members co-operating with Kuwait to use "all necessary means". It is an
      exception to

      art 2(4) under art 42, decided as a last resort where art 41 measures would be or have proved inadequate.


      Peacekeeping operations are not explicitly mentioned in the Charter. They were primarily created to keep the
      peace,

      not to enforce it, and, unlike authorisations, they are UN operations. Their traditional principles are consent of

      the parties, impartiality, and non-use of force except in self-defence.


      Peacekeeping has gradually evolved: the UN has acted as a transitional administration (Kosovo, Timor-Leste), and

      there is a changing attitude to the use of force, with some missions authorised to use force to carry out their

      mandate — in the DRC (including targeted offensive operations) and Mali. Deployments passed 100,000 by 2015,
      mostly in

      sub-Saharan Africa.
    rubric:
      - id: r1
        criterion: Explains the two options without a standing army
        marks: 2
        top-band: Notes art 43's non-implementation and the choice between a UN operation and an authorisation.
        margin-note: Why does the Council need either option? Start with art 43.
        authorities: []
      - id: r2
        criterion: Describes authorisation to use force
        marks: 3
        top-band: >-
          Explains art 42 as an exception to art 2(4) and a last resort, with coalitions or regional organisations and
          an example such as Res 678.
        margin-note: Who actually uses force under an authorisation, and on what words?
        authorities:
          - un-charter-art-42
          - un-charter-art-2-4
          - unsc-resolution-678
      - id: r3
        criterion: States the nature and principles of peacekeeping
        marks: 3
        top-band: Not in the Charter; keep not enforce; a UN operation; consent, impartiality, self-defence only.
        margin-note: Name all three principles — and say whose operation it is.
        authorities: []
      - id: r4
        criterion: Explains the evolution of peacekeeping
        marks: 2
        top-band: Uses transitional administration (Kosovo, Timor-Leste) and robust mandates (DRC, Mali).
        margin-note: How far has practice moved from the self-defence-only model? Give examples.
        authorities: []
  - key: q801
    type: mcq
    concept: general-assembly-and-secretary-general
    difficulty: 1
    stem: How does voting work in the General Assembly?
    options:
      - text: One state, one vote (art 18).
        correct: true
        why: Correct — the slides say the Assembly works on one state, one vote (art 18 UN Charter).
      - text: Votes are weighted by each member's population.
        why: >-
          Wrong — the slides describe one state, one vote, which is why the Assembly is seen as the most "democratic"
          organ, not population weighting.
      - text: Votes are weighted by financial contributions to the UN.
        why: Wrong — nothing in the slides links Assembly voting to contributions; each state has one vote under art 18.
      - text: The permanent members hold a veto, as in the Council.
        why: Wrong — the veto (art 27(3)) exists only in the Security Council; in the Assembly every state has one vote.
  - key: q802
    type: mcq
    concept: general-assembly-and-secretary-general
    difficulty: 1
    stem: How many member states does the General Assembly currently have, according to the slides?
    options:
      - text: '15.'
        why: Wrong — 15 is the Security Council's membership under art 23; the Assembly includes all UN member states.
      - text: '193.'
        correct: true
        why: Correct — the slides say the Assembly consists of representatives of all UN member states, currently 193.
      - text: '51.'
        why: Tempting if you recall a smaller founding membership, but the slides give 193 current members.
      - text: '195.'
        why: Close, but the slides give 193 member states in the General Assembly.
  - key: q803
    type: mcq
    concept: general-assembly-and-secretary-general
    difficulty: 2
    stem: What kind of responsibility does the General Assembly have for international peace and security?
    options:
      - text: Primary responsibility, which it shares equally with the Security Council under art 24.
        why: Wrong — art 24 confers primary responsibility on the Security Council alone; the Assembly's is subsidiary.
      - text: A subsidiary responsibility.
        correct: true
        why: >-
          Correct — the slides describe the Assembly's "subsidiary responsibility for the maintenance of international
          peace and security" (arts 11(2), 12, 14).
      - text: No responsibility at all, because peace and security belong only to the Council.
        why: >-
          Too strong — the Assembly may discuss and recommend on peace and security questions (arts 11(2), 14), subject
          to art 12.
      - text: Exclusive responsibility for peaceful settlement of disputes under Chapter VI.
        why: >-
          Wrong — Chapter VI (arts 33–37) sets out the Security Council's role in peaceful settlement; art 35 merely
          lets members also go to the Assembly.
  - key: q804
    type: mcq
    concept: general-assembly-and-secretary-general
    difficulty: 2
    stem: Under art 11(2), what must the General Assembly do with a question on which action is necessary?
    options:
      - text: Decide the action itself by a two-thirds majority of members.
        why: >-
          Wrong — art 11(2) says such a question "shall be referred to the Security Council"; the Assembly does not
          decide the action.
      - text: Refer it to the ICJ for an advisory opinion.
        why: Wrong — art 11(2) names the Security Council, not the ICJ, as the body to which the question goes.
      - text: Refer it to the Security Council, before or after discussion.
        correct: true
        why: >-
          Correct — art 11(2): any question on which action is necessary "shall be referred to the Security Council by
          the General Assembly either before or after discussion".
      - text: Delegate it to the Secretary-General under art 99.
        why: >-
          Wrong — art 99 is the Secretary-General's own power to alert the Council; art 11(2) requires the Assembly to
          refer the question to the Council.
  - key: q805
    type: mcq
    concept: general-assembly-and-secretary-general
    difficulty: 2
    stem: What does art 12(1) prevent?
    options:
      - text: The Security Council from acting on any dispute that the Assembly has already discussed.
        why: Reversed — art 12(1) restrains the Assembly, not the Council.
      - text: The Assembly from discussing any question of peace and security.
        why: >-
          Too wide — art 11(2) lets the Assembly discuss any such question; art 12(1) stops only recommendations while
          the Council is exercising its functions.
      - text: Assembly recommendations on a matter the Council is dealing with, unless it asks.
        correct: true
        why: >-
          Correct — art 12(1): while the Council is exercising its functions on a dispute or situation, the Assembly
          "shall not make any recommendation" on it unless the Council so requests.
      - text: The Secretary-General raising a dispute that is before the Assembly.
        why: >-
          Wrong — art 12(1) concerns the Assembly and the Council; the Secretary-General's power under art 99 is
          separate.
  - key: q806
    type: mcq
    concept: general-assembly-and-secretary-general
    difficulty: 2
    stem: Which ICJ opinion do the slides cite (paras 27–28) on art 12(1)?
    options:
      - text: The Wall Advisory Opinion (2004).
        correct: true
        why: Correct — the slides cite the Wall Advisory Opinion, ICJ (2004), paras 27–28, beside art 12(1).
      - text: Certain Expenses (1962).
        why: >-
          Tempting because it is the other advisory opinion this week, but the slides cite it beside art 14 and for
          Uniting for Peace.
      - text: Reparation for Injuries (1949).
        why: Wrong — Reparation for Injuries (Week 4) is about the UN's international legal personality, not art 12(1).
      - text: The Nuclear Weapons opinion (1996).
        why: Wrong — the Nuclear Weapons opinion (Week 4) is about the WHO and the principle of speciality, not art 12(1).
  - key: q807
    type: mcq
    concept: general-assembly-and-secretary-general
    difficulty: 2
    stem: Under art 14, what may the General Assembly recommend?
    options:
      - text: Binding sanctions against a state that violates the Charter's Purposes and Principles.
        why: Wrong — the Assembly recommends; binding sanctions are art 41 decisions of the Security Council.
      - text: Measures for the peaceful adjustment of situations likely to impair friendly relations.
        correct: true
        why: >-
          Correct — art 14: the Assembly may recommend measures for the peaceful adjustment of any situation likely to
          impair the general welfare or friendly relations among nations.
      - text: The use of force by members whenever the Council is seized of a matter.
        why: >-
          Wrong — art 14 is "subject to the provisions of Article 12", which bars recommendations while the Council is
          dealing with the matter.
      - text: Amendments to any Council resolutions it considers inconsistent with the Charter.
        why: >-
          Wrong — nothing in art 14 lets the Assembly amend Council resolutions; it concerns peaceful adjustment of
          situations.
  - key: q808
    type: mcq
    concept: general-assembly-and-secretary-general
    difficulty: 3
    stem: What does GA Resolution 377(V) (1950), "Uniting for Peace", provide?
    options:
      - text: If the Council fails to act, the Assembly may adopt decisions binding on all members under art 25.
        why: >-
          Wrong — art 25 binds members to Security Council decisions; under Uniting for Peace the Assembly makes
          recommendations.
      - text: The Assembly may veto a Council resolution adopted without the support of all five permanent members.
        why: Wrong — the Assembly has no veto over the Council; Uniting for Peace applies when the Council fails to act.
      - text: If the P-5's lack of unanimity stops the Council acting, the Assembly may recommend collective measures.
        correct: true
        why: >-
          Correct — if the Council, because of lack of unanimity of the permanent members, fails to exercise its primary
          responsibility, the Assembly considers the matter to recommend collective measures.
      - text: The Council must obtain the Assembly's approval before authorising force under art 42.
        why: >-
          Wrong — art 42 is the Council's power; Uniting for Peace concerns a Council that fails to act, not one that
          needs approval.
  - key: q809
    type: mcq
    concept: general-assembly-and-secretary-general
    difficulty: 3
    stem: Why did the General Assembly's scope in enforcement increase during the Cold War?
    options:
      - text: A deadlocked Council prompted Uniting for Peace.
        correct: true
        why: >-
          Correct — the slides say the Cold War increased the Assembly's scope in enforcement in the context of a
          deadlocked Security Council ("Uniting for Peace").
      - text: Art 12(1) was amended to give the Assembly priority over the Council.
        why: >-
          Wrong — art 12(1) still bars Assembly recommendations while the Council is exercising its functions; it was
          not amended.
      - text: The Assembly gained the power to choose the P-5 under art 23.
        why: Wrong — the P-5 are fixed; the Assembly elects only the ten non-permanent members.
      - text: The ICJ held that Council resolutions were not binding on members.
        why: >-
          Wrong — Council decisions bind under art 25; the slides say the ICJ confirmed the Uniting for Peace procedure,
          not that Council resolutions lack force.
  - key: q810
    type: mcq
    concept: general-assembly-and-secretary-general
    difficulty: 3
    stem: Which ICJ advisory opinion confirmed the Uniting for Peace procedure, according to the slides?
    options:
      - text: Construction of a Wall (2004).
        why: Tempting because it is cited this week, but on art 12(1) (paras 27–28), not for confirming Uniting for Peace.
      - text: Certain Expenses of the United Nations.
        correct: true
        why: >-
          Correct — the slides say the Uniting for Peace procedure was confirmed by the ICJ in the Certain Expenses case
          (Advisory Opinion).
      - text: Reparation for Injuries (1949).
        why: >-
          Wrong — Reparation for Injuries (Week 4) concerns the UN's legal personality and implied powers, not Uniting
          for Peace.
      - text: Nicaragua v United States (1986).
        why: >-
          Wrong — Nicaragua is a contentious case on the use of force and attribution, not an advisory opinion on the
          Assembly's powers.
  - key: q811
    type: mcq
    concept: general-assembly-and-secretary-general
    difficulty: 2
    stem: Who appoints the UN Secretary-General, and for how long, according to the slides?
    options:
      - text: The Security Council alone, for a two-year term.
        why: >-
          Wrong — two-year terms belong to the Council's elected members; the slides say the Assembly appoints the
          Secretary-General for five years.
      - text: The General Assembly, for a five-year term.
        correct: true
        why: Correct — the slides say the Secretary-General is appointed by the General Assembly for a five-year term.
      - text: The five permanent members, for a single ten-year term.
        why: Wrong — the slides give the appointment to the General Assembly and a five-year term.
      - text: All member states by direct election, for four years.
        why: Wrong — the slides say the General Assembly appoints the Secretary-General, for a five-year term.
  - key: q812
    type: mcq
    concept: general-assembly-and-secretary-general
    difficulty: 2
    stem: What may the Secretary-General do under art 99?
    options:
      - text: Authorise member states to use force when the Council is deadlocked.
        why: Wrong — authorising force is the Council's power under art 42; the Secretary-General has no such power.
      - text: Impose sanctions on a state that threatens international peace.
        why: Wrong — sanctions are art 41 decisions of the Council; the Secretary-General cannot impose them.
      - text: Decide legal disputes referred by the parties under art 36(3).
        why: >-
          Wrong — legal disputes go to the ICJ (art 36(3)); the Secretary-General's role is good offices, not
          adjudication.
      - text: Bring to the Council's attention any matter that may threaten peace and security.
        correct: true
        why: >-
          Correct — art 99: the Secretary-General can bring to the attention of the Security Council any matter which in
          their opinion may threaten international peace and security.
  - key: q813
    type: mcq
    concept: general-assembly-and-secretary-general
    difficulty: 2
    stem: What are the Secretary-General's "good offices" functions?
    options:
      - text: Mediating in and resolving crises, including through Special Representatives.
        correct: true
        why: >-
          Correct — the slides say the Secretary-General's good office functions in mediating in and resolving
          international crises or conflicts have expanded, including through Special Representatives.
      - text: Supervising the ICJ's judgments to make sure states carry them out.
        why: >-
          Wrong — nothing in the slides gives the Secretary-General a role in enforcing ICJ judgments; good offices are
          about mediation.
      - text: Commanding UN peacekeeping forces in the field under art 43.
        why: Wrong — art 43 has never been implemented, and good offices concern mediation, not military command.
      - text: Drafting binding resolutions for the Security Council to adopt.
        why: Wrong — good offices are mediation in crises; the Council adopts its own resolutions.
  - key: q814
    type: mcq
    concept: general-assembly-and-secretary-general
    difficulty: 3
    contrasts-with:
      - security-council-composition-and-powers
    stem: Which statement best captures the difference between the General Assembly and the Security Council in enforcement?
    options:
      - text: The Assembly decides binding measures; the Council merely recommends them to members.
        why: Reversed — the Council's decisions bind under art 25; the Assembly makes recommendations.
      - text: The Assembly is the most "democratic" organ but has minimal enforcement powers.
        correct: true
        why: >-
          Correct — the slides say the Assembly is seen as the most "democratic" international organ but has a minimal
          role in enforcement; enforcement lies with the Council.
      - text: Both have equal enforcement powers, but the Assembly acts first under art 12(1).
        why: Wrong — art 12(1) makes the Assembly stand back while the Council acts; the two do not have equal powers.
      - text: The Assembly's enforcement role is primary because all 193 members vote there.
        why: >-
          Wrong — primary responsibility lies with the Council (art 24); broad membership does not give the Assembly
          enforcement power.
  - key: q815
    type: mcq
    concept: general-assembly-and-secretary-general
    difficulty: 4
    stem: >-
      A P-5 member vetoes a draft resolution on a conflict in which civilians are being attacked. Several states want
      the UN to respond. What can the General Assembly do, on the slides' account?
    options:
      - text: Override the veto and adopt the draft as a binding Council decision.
        why: Wrong — the Assembly cannot override a veto or make Council decisions; it can only recommend.
      - text: Under Uniting for Peace, consider the matter at once and recommend collective measures.
        correct: true
        why: >-
          Correct — Res 377(V) applies where lack of unanimity of the permanent members stops the Council exercising its
          primary responsibility; the Assembly may then recommend collective measures.
      - text: Nothing, because art 12(1) bars it from any matter the Council has discussed.
        why: >-
          Tempting, but art 12(1) bars recommendations while the Council is exercising its functions; Uniting for Peace
          was designed for a Council that fails to act because of the veto.
      - text: Refer the situation and the vetoing state to the ICC Prosecutor under art 13(b) of the Rome Statute.
        why: >-
          Wrong — art 13(b) referrals are made by the Security Council acting under Chapter VII, and concern situations
          involving individuals' crimes, not vetoing states.
  - key: q816
    type: mcq
    concept: general-assembly-and-secretary-general
    difficulty: 3
    variant-of: q805
    stem: >-
      The Council is actively dealing with a border dispute between States F and G. The Assembly wants to recommend a
      settlement. What does art 12(1) require?
    options:
      - text: Nothing — art 14 lets the Assembly recommend freely, overriding art 12.
        why: Wrong — art 14 is expressly "subject to the provisions of Article 12", so it cannot override art 12(1).
      - text: It must first refer the dispute to the ICJ under art 36(3).
        why: >-
          Wrong — art 36(3) concerns the Council's recommendations on legal disputes; it is not a precondition for
          Assembly action.
      - text: It must not recommend unless the Council asks.
        correct: true
        why: >-
          Correct — art 12(1): while the Council is exercising its functions on the dispute, the Assembly shall not make
          any recommendation on it unless the Council so requests.
      - text: It must adopt the recommendation with the unanimous support of the P-5.
        why: >-
          Wrong — the P-5 veto operates in the Council, not the Assembly; art 12(1) simply bars the recommendation
          unless the Council requests it.
  - key: q817
    type: match
    concept: general-assembly-and-secretary-general
    difficulty: 2
    prompt: Match each provision to the General Assembly or Secretary-General function it sets out.
    pairs:
      - left: Art 11(2)
        right: Discuss and recommend on peace and security questions
      - left: Art 12(1)
        right: No recommendation while the Council deals with the matter
      - left: Art 14
        right: Recommend peaceful adjustment of situations
      - left: Art 18
        right: One state, one vote
      - left: Art 99
        right: Secretary-General may alert the Council to threats
      - left: GA Res 377(V)
        right: Uniting for Peace
  - key: q818
    type: truefalse
    concept: general-assembly-and-secretary-general
    difficulty: 1
    set: quickfire
    statement: >-
      The General Assembly may make recommendations on a dispute while the Security Council is exercising its functions
      on it, without any request from the Council.
    answer: false
    why: >-
      False — art 12(1) bars Assembly recommendations on a dispute or situation while the Council is exercising its
      functions on it, unless the Council so requests (Wall, paras 27–28).
  - key: q819
    type: truefalse
    concept: general-assembly-and-secretary-general
    difficulty: 1
    set: quickfire
    statement: >-
      Under art 99, the Secretary-General can bring to the Security Council's attention any matter which in their
      opinion may threaten international peace and security.
    answer: true
    why: >-
      True — the slides cite art 99 for the Secretary-General's power to bring to the Council's attention any matter
      which in their opinion may threaten international peace and security.
  - key: q820
    type: short
    concept: general-assembly-and-secretary-general
    difficulty: 3
    prompt: >-
      Explain the role of the General Assembly in the maintenance of international peace and security, including the
      limit in art 12(1) and the Uniting for Peace procedure.
    model: >-
      The General Assembly is the UN's parliamentary body: all 193 member states, one state, one vote (art 18). It is
      seen

      as the most "democratic" international organ but has a minimal role in enforcement.


      It has a subsidiary responsibility for international peace and security, beside the Security Council's primary

      responsibility (art 24). It may discuss any question relating to peace and security and make recommendations to
      the

      states concerned, the Council or both, but must refer any question on which action is necessary to the Council

      (art 11(2)). It may recommend measures for the peaceful adjustment of any situation likely to impair friendly

      relations (art 14; Certain Expenses, 1962).


      Both powers are subject to art 12(1): while the Council is exercising its functions on a dispute or situation, the

      Assembly shall not make any recommendation on it unless the Council so requests (Wall Advisory Opinion, paras
      27–28).


      Uniting for Peace (GA Res 377(V), 1950) responds to a deadlocked Council: if, because of lack of unanimity of the

      permanent members, the Council fails to exercise its primary responsibility, the Assembly shall consider the
      matter

      immediately with a view to recommending collective measures. The Cold War expanded the Assembly's role this way,
      and

      the ICJ confirmed the procedure in Certain Expenses. Even so, the Assembly recommends; only the Council decides.
    rubric:
      - id: r1
        criterion: Describes the Assembly and its subsidiary responsibility
        marks: 2
        top-band: >-
          Notes membership, one state one vote (art 18), and the subsidiary role beside the Council's primary
          responsibility.
        margin-note: Subsidiary to what? Name art 24.
        authorities:
          - un-charter-art-24
      - id: r2
        criterion: States arts 11(2) and 14
        marks: 3
        top-band: >-
          Explains discussion and recommendation, the duty to refer questions needing action, and art 14 peaceful
          adjustment (Certain Expenses).
        margin-note: What must the Assembly do when action is necessary?
        authorities:
          - un-charter-art-11-2
          - un-charter-art-14
      - id: r3
        criterion: Explains the art 12(1) limit
        marks: 2
        top-band: States the bar on recommendations while the Council is exercising its functions, with the Wall opinion.
        margin-note: When does the Assembly have to stand back? Cite the Wall.
        authorities:
          - un-charter-art-12-1
      - id: r4
        criterion: Explains Uniting for Peace and its limits
        marks: 3
        top-band: >-
          Sets out Res 377(V)'s trigger (lack of P-5 unanimity), its result (recommendations of collective measures) and
          ICJ confirmation in Certain Expenses.
        margin-note: Uniting for Peace lets the Assembly recommend — not decide. Say so.
        authorities:
          - unga-resolution-377-v
  - key: q901
    type: mcq
    concept: decisions-and-recommendations
    difficulty: 1
    stem: Under art 25 of the UN Charter, what do members agree to accept and carry out?
    options:
      - text: Every paragraph of every resolution the Security Council adopts.
        why: >-
          Tempting, but too wide: the lecture stressed that only decisions bind; a resolution can also contain
          recommendations, which do not.
      - text: The recommendations of the General Assembly on peace and security.
        why: Wrong — the Assembly recommends (arts 11(2), 14); art 25 concerns the decisions of the Security Council.
      - text: Any measure that a majority of the permanent members support.
        why: >-
          Wrong — art 25 binds members to Council decisions, not to whatever a majority of the P-5 favours; the P-5 hold
          a veto, not a separate power.
      - text: The Security Council's decisions, in accordance with the Charter.
        correct: true
        why: >-
          Correct — art 25: members "agree to accept and carry out the decisions of the Security Council in accordance
          with the present Charter".
  - key: q902
    type: mcq
    concept: decisions-and-recommendations
    difficulty: 2
    stem: >-
      A Security Council resolution contains some paragraphs that recommend and others that decide. Which paragraphs
      bind member states under art 25?
    options:
      - text: All of them, because the resolution was adopted as a single instrument.
        why: >-
          Tempting because a resolution is voted on as a whole, but the lecture explained that only its decisions bind;
          recommendations within it do not.
      - text: Only the decisions; the recommendations in it do not bind.
        correct: true
        why: >-
          Correct — a resolution can mix recommendations and decisions, and art 25 makes only the decisions binding on
          members.
      - text: None of them, unless each member separately consents to the resolution.
        why: >-
          Wrong — under art 25 members have already agreed to carry out Council decisions; no fresh consent to each
          resolution is needed.
      - text: Only paragraphs adopted unanimously by all fifteen Council members.
        why: >-
          Wrong — unanimity is not the test; what matters is whether the paragraph is a decision. The P-5 veto concerns
          adoption, not binding force.
  - key: q903
    type: mcq
    concept: decisions-and-recommendations
    difficulty: 2
    stem: In art 39, which pair of words marks the line between non-binding and binding action by the Council?
    options:
      - text: '"make recommendations" and "decide"'
        correct: true
        why: >-
          Correct — art 39: the Council "shall make recommendations, or decide" what measures shall be taken under arts
          41 and 42; recommendations do not bind, decisions do.
      - text: '"investigate" and "call upon" the parties to settle a dispute'
        why: >-
          Wrong — investigating (art 34) and calling on the parties to settle (art 33(2)) are Chapter VI powers, not the
          art 39 contrast.
      - text: '"threat to the peace" and "breach of the peace"'
        why: >-
          Tempting because both appear in art 39, but these are two of the three findings that open Chapter VII, not the
          binding/non-binding line.
      - text: '"provisional" and "without prejudice to the parties"'
        why: >-
          Wrong — these words come from art 40 on provisional measures; they say nothing about whether a measure is a
          recommendation or a decision.
  - key: q904
    type: mcq
    concept: decisions-and-recommendations
    difficulty: 2
    stem: >-
      According to the lecture, what usually shows whether a paragraph of a Council resolution is a decision or a
      recommendation?
    options:
      - text: Whether the resolution mentions Chapter VI anywhere in its text.
        why: >-
          Tempting, but the lecture pointed to the wording of each paragraph — usually the verbs — rather than to a
          chapter reference somewhere in the text.
      - text: Whether the General Assembly later endorses the resolution by vote.
        why: >-
          Wrong — the Assembly has no role in giving a Council resolution binding force; art 25 attaches to the
          Council's own decisions.
      - text: The words used in that paragraph, usually the verbs.
        correct: true
        why: >-
          Correct — the lecture said it is usually the words, chiefly the verbs, the Council uses that show whether a
          paragraph decides or recommends, though there are debates.
      - text: Whether the target state voted for it as a member of the Council.
        why: >-
          Wrong — a decision binds all members under art 25 whether or not a state voted for it, or sits on the Council
          at all.
  - key: q905
    type: mcq
    concept: decisions-and-recommendations
    difficulty: 3
    stem: >-
      State A has a bilateral trade treaty with State B. Acting under Chapter VII, the Security Council decides that all
      members must stop trading with State B. What does art 103 mean for State A?
    options:
      - text: The treaty prevails, because it was concluded before the Council's decision was made.
        why: >-
          Tempting if you think "earlier treaty wins", but art 103 gives Charter obligations priority whatever the date
          of the conflicting agreement.
      - text: It may choose either obligation, since both are binding international agreements.
        why: >-
          Wrong — art 103 resolves the conflict: "their obligations under the present Charter shall prevail". There is
          no free choice.
      - text: The decision binds it only if State B consents to the measures.
        why: >-
          Wrong — Chapter VII decisions do not depend on the target state's consent; consent is a peacekeeping
          principle, not a condition of art 25.
      - text: 'Its Charter obligation prevails: it must carry out the decision despite the treaty.'
        correct: true
        why: >-
          Correct — the decision binds under art 25, and art 103 says Charter obligations prevail over obligations under
          any other international agreement.
  - key: q906
    type: mcq
    concept: decisions-and-recommendations
    difficulty: 2
    stem: Why does a binding Security Council decision prevail over a conflicting treaty obligation?
    options:
      - text: Because the Security Council has power to amend any treaty its members have concluded.
        why: >-
          Wrong — the Council does not amend treaties; the conflicting treaty stays in force, but the Charter obligation
          takes priority under art 103.
      - text: Because later obligations always override earlier ones in international law.
        why: >-
          Tempting, but timing is not the reason: art 103 gives Charter obligations priority over other agreements
          whenever they were made.
      - text: Art 25 makes it a Charter obligation, and art 103 gives Charter obligations priority.
        correct: true
        why: >-
          Correct — read art 25 with art 103: the duty to carry out a decision is an obligation "under the present
          Charter", which "shall prevail".
      - text: Because the ICJ must first declare the conflicting treaty void.
        why: >-
          Wrong — no ICJ ruling is needed; art 103 operates directly when Charter obligations and other treaty
          obligations conflict.
  - key: q907
    type: mcq
    concept: decisions-and-recommendations
    difficulty: 3
    stem: >-
      Under Chapter VI the Council may "recommend appropriate procedures or methods of adjustment" (art 36(1)). What is
      the legal effect of such a recommendation?
    options:
      - text: It binds the parties under art 25 like any other Council act.
        why: >-
          Tempting because art 25 is the Council's binding power, but art 25 covers decisions; a Chapter VI
          recommendation is advice, not a decision.
      - text: 'It is not binding: it is advice to the parties.'
        correct: true
        why: >-
          Correct — under Chapter VI the Council recommends; recommendations do not bind. Binding decisions come with
          Chapter VII after an art 39 determination.
      - text: It binds only the permanent members, who could have vetoed it.
        why: >-
          Wrong — the veto affects whether the Council can act, not who is bound; a recommendation binds no one, P-5
          included.
      - text: It becomes binding if the parties fail to settle within a year.
        why: >-
          Wrong — nothing in Chapter VI converts a recommendation into a decision after a time limit; unsettled disputes
          go back to the Council (art 37(1)).
  - key: q908
    type: mcq
    concept: decisions-and-recommendations
    difficulty: 3
    stem: >-
      Which is the best first question before advising that a state is legally obliged to comply with a Security Council
      resolution?
    options:
      - text: Did the state vote in favour of the resolution when the Security Council adopted it?
        why: >-
          Wrong — a binding decision obliges every member, whether it voted for the resolution, against it, or was not
          on the Council.
      - text: Has the General Assembly adopted a matching resolution under art 14?
        why: >-
          Wrong — the Assembly's art 14 recommendations do not add binding force to a Council resolution; the question
          is what the Council itself decided.
      - text: Is the state a party to the Rome Statute of the International Criminal Court?
        why: >-
          Wrong — the Rome Statute matters for an ICC referral (art 13(b)), not for whether a Council paragraph binds
          members under art 25.
      - text: Is the paragraph a decision (binding under art 25) or only a recommendation?
        correct: true
        why: >-
          Correct — only decisions bind; identify the operative paragraph and its wording before relying on art 25 (and
          art 103 for any conflicting treaty).
  - key: q909
    type: mcq
    concept: decisions-and-recommendations
    difficulty: 2
    contrasts-with:
      - general-assembly-and-secretary-general
    stem: Which statement best contrasts the Security Council with the General Assembly on international peace and security?
    options:
      - text: Both adopt binding decisions, but the Council acts first under art 12(1).
        why: >-
          Wrong — art 12(1) restrains Assembly recommendations while the Council acts; it does not give the Assembly
          binding power.
      - text: The Assembly decides and the Council recommends, because every state votes there.
        why: >-
          Reversed — the Assembly is the most "democratic" organ, but it recommends; the Council's decisions are the
          ones that bind.
      - text: Neither can bind members without each member's specific consent.
        why: >-
          Wrong — by art 25 members have agreed in advance to carry out Council decisions; no specific consent to each
          one is required.
      - text: The Council can take decisions binding on all members; the Assembly recommends.
        correct: true
        why: >-
          Correct — art 25 binds members to Council decisions, while the Assembly's powers in arts 11(2) and 14 are to
          discuss and recommend.
  - key: q910
    type: mcq
    concept: decisions-and-recommendations
    difficulty: 1
    stem: >-
      Which UN Charter article provides that obligations under the Charter prevail over obligations under any other
      international agreement?
    options:
      - text: Art 103
        correct: true
        why: 'Correct — art 103: "In the event of a conflict … their obligations under the present Charter shall prevail".'
      - text: Art 25, on carrying out the Council's decisions
        why: Tempting because the two are read together, but art 25 makes decisions binding; art 103 is the priority rule.
      - text: Art 24, on primary responsibility
        why: >-
          Wrong — art 24 confers primary responsibility for international peace and security on the Council; it is not a
          conflict rule.
      - text: Art 39, on threats to the peace
        why: >-
          Wrong — art 39 is the Chapter VII trigger (threat, breach, aggression), not the rule on conflicting
          obligations.
  - key: q911
    type: mcq
    concept: decisions-and-recommendations
    difficulty: 2
    stem: >-
      A Council resolution recommends that two states refer their border dispute to the ICJ. One state refuses. Has it
      breached art 25?
    options:
      - text: Yes — art 25 obliges members to carry out everything the Council adopts.
        why: >-
          Tempting, but art 25 covers the Council's decisions; a recommendation does not bind, so refusing it is not a
          breach of art 25.
      - text: No — a recommendation is not a decision, so art 25 does not bind it.
        correct: true
        why: >-
          Correct — only decisions bind under art 25; a recommendation, such as a suggested referral to the ICJ, leaves
          the state free to decline.
      - text: Yes — art 36(3) makes referral of legal disputes to the ICJ compulsory.
        why: >-
          Wrong — art 36(3) says the Council should consider that legal disputes should "as a general rule" go to the
          ICJ; it creates no obligation on the parties.
      - text: No — but only because ICJ referrals are a matter for the Assembly.
        why: >-
          Wrong reason — the Council can recommend referral; the point is that a recommendation is not binding, not that
          the Assembly controls referrals.
  - key: q912
    type: mcq
    concept: decisions-and-recommendations
    difficulty: 2
    stem: Which statement about binding Security Council decisions is correct?
    options:
      - text: They bind only the fifteen states sitting on the Council at the vote.
        why: >-
          Wrong — art 25 is an undertaking by "the Members of the United Nations", all of them, not just the Council's
          fifteen members.
      - text: They bind every UN member, whether or not it sits on the Council.
        correct: true
        why: >-
          Correct — art 25: the Members of the United Nations agree to accept and carry out the Council's decisions; it
          acts on their behalf (art 24(1)).
      - text: They bind only the states that voted in favour of the resolution.
        why: Wrong — a decision binds members who voted against it or abstained, and those not on the Council.
      - text: They bind members only once each national parliament has approved them.
        why: >-
          Wrong — the obligation arises under the Charter itself; domestic approval may matter for implementation, not
          for the international obligation.
  - key: q913
    type: mcq
    concept: decisions-and-recommendations
    difficulty: 3
    stem: >-
      Acting under Chapter VII, a resolution determines a threat to the peace, "decides" that all states shall freeze
      the assets of named individuals, and "recommends" that states share information. Which statement is correct?
    options:
      - text: Both paragraphs bind, because the whole resolution is under Chapter VII.
        why: >-
          Tempting, but a Chapter VII resolution can still mix recommendations and decisions; only the paragraph that
          decides binds.
      - text: Neither binds until the General Assembly confirms the resolution.
        why: >-
          Wrong — Council decisions bind under art 25 without any Assembly confirmation; the Assembly recommends, it
          does not ratify.
      - text: The asset freeze binds all members; the recommendation does not.
        correct: true
        why: >-
          Correct — the verbs mark the line: "decides" makes the freeze a binding decision (art 25); "recommends" leaves
          information-sharing as a recommendation.
      - text: Only the information-sharing paragraph binds, being less coercive.
        why: >-
          Reversed — coerciveness is not the test; the paragraph that "decides" binds and the one that "recommends" does
          not.
  - key: q914
    type: mcq
    concept: decisions-and-recommendations
    difficulty: 3
    variant-of: q905
    stem: >-
      State C has a treaty obliging it to supply arms to State D. The Security Council then decides under Chapter VII to
      impose an arms embargo on State D. What must State C do?
    options:
      - text: Keep supplying arms, since treaties must be performed in good faith.
        why: >-
          Tempting, because pacta sunt servanda is real, but art 103 resolves the conflict in favour of the Charter
          obligation.
      - text: Ask the ICJ to rule on which obligation applies before taking any further step.
        why: >-
          Wrong — art 103 needs no prior ruling; the state must carry out the decision, which prevails over the treaty
          obligation.
      - text: Comply with the embargo, as art 103 makes its Charter obligation prevail.
        correct: true
        why: >-
          Correct — the embargo is a binding decision (art 25), and art 103 makes the Charter obligation prevail over
          the conflicting arms treaty.
      - text: Comply only if State D was heard before the Council voted.
        why: Wrong — neither art 25 nor art 103 makes a hearing for the target state a condition of a binding decision.
  - key: q915
    type: mcq
    concept: decisions-and-recommendations
    difficulty: 2
    variant-of: q902
    stem: Which paragraph of a Council resolution would art 25 make binding on all members?
    options:
      - text: A paragraph recommending that the parties try mediation.
        why: >-
          Wrong — a recommendation, like a suggestion of mediation under Chapter VI, does not bind; art 25 covers
          decisions.
      - text: A paragraph recommending procedures for adjusting the dispute (art 36(1)).
        why: >-
          Tempting because it cites a Charter power, but art 36(1) is a power to recommend; recommendations are not
          binding.
      - text: A paragraph deciding that states shall impose an arms embargo.
        correct: true
        why: >-
          Correct — a paragraph in which the Council decides measures (art 39 with art 41) is a decision, binding under
          art 25.
      - text: Any paragraph at all, provided no permanent member vetoed the resolution.
        why: Wrong — the absence of a veto lets a resolution pass; it does not turn its recommendations into decisions.
  - key: q916
    type: truefalse
    concept: decisions-and-recommendations
    difficulty: 1
    statement: Every paragraph of a Security Council resolution is binding on member states under art 25.
    answer: false
    why: >-
      False — a resolution can contain recommendations as well as decisions, and art 25 makes only the decisions
      binding; the wording, usually the verbs, shows which is which.
  - key: q917
    type: truefalse
    concept: decisions-and-recommendations
    difficulty: 1
    statement: >-
      Art 103 gives obligations under the UN Charter priority over conflicting obligations under any other international
      agreement.
    answer: true
    why: >-
      True — art 103: in the event of a conflict, "their obligations under the present Charter shall prevail". A binding
      Council decision is such an obligation.
  - key: q918
    type: truefalse
    concept: decisions-and-recommendations
    difficulty: 2
    statement: >-
      Once it has determined a threat to the peace, the Council may either make recommendations or decide measures under
      arts 41 and 42.
    answer: true
    why: >-
      True — art 39: the Council "shall make recommendations, or decide what measures shall be taken in accordance with
      Articles 41 and 42"; only decisions bind.
  - key: q919
    type: truefalse
    concept: decisions-and-recommendations
    difficulty: 2
    statement: A Chapter VI recommendation of the Security Council binds the parties in the same way as a Chapter VII decision.
    answer: false
    why: >-
      False — under Chapter VI the Council recommends (e.g. art 36(1)), and recommendations do not bind; binding
      decisions come under art 25, typically after an art 39 determination.
  - key: q920
    type: match
    concept: decisions-and-recommendations
    difficulty: 2
    prompt: Match each Charter provision or phrase to its effect.
    pairs:
      - left: Art 25
        right: Members accept and carry out the Council's decisions
      - left: Art 103
        right: Charter obligations prevail over other agreements
      - left: '"make recommendations" (art 39)'
        right: Not binding
      - left: '"decide" (art 39)'
        right: Binding on all members
      - left: Art 36(1)
        right: The Council recommends procedures or methods of adjustment
  - key: q921
    type: short
    concept: decisions-and-recommendations
    difficulty: 3
    prompt: >-
      Explain why it matters whether a paragraph of a Security Council resolution is a "decision" or a "recommendation",
      and how a binding decision interacts with a state's conflicting treaty obligations.
    model: >-
      Art 25 of the Charter of the United Nations binds members to "accept and carry out the decisions of the Security

      Council". The binding force attaches to decisions only. A resolution can contain both recommendations and
      decisions,

      and often mixes them; which is which usually turns on the wording of each paragraph, chiefly the verbs, though

      borderline wording is debated. The Charter draws the same line: under Chapter VI the Council recommends (art
      36(1)),

      and under art 39, once it has determined a threat to the peace, breach of the peace or act of aggression, it
      "shall

      make recommendations, or decide" measures under arts 41 and 42.


      The distinction therefore decides whether a state is legally obliged to act. A state may decline a recommendation;
      it

      must carry out a decision, whether or not it voted for it or sits on the Council.


      A binding decision is a Charter obligation, so art 103 applies: where Charter obligations conflict with
      obligations

      under any other international agreement, the Charter obligations prevail. A state bound by a trade or arms treaty

      with the target of Council sanctions must still implement the sanctions; the treaty cannot be relied on to avoid
      them.
    rubric:
      - id: r1
        criterion: 'Art 25: only decisions bind'
        marks: 3
        top-band: >-
          States that art 25 binds members to decisions, not to everything in a resolution, and that resolutions can mix
          the two.
        margin-note: What exactly does art 25 make binding?
        authorities:
          - un-charter-art-25
      - id: r2
        criterion: How to tell a decision from a recommendation
        marks: 2
        top-band: >-
          Points to the wording of the operative paragraph (usually the verbs) and to art 39's "make recommendations, or
          decide"; notes Chapter VI recommendations.
        margin-note: Where in the Charter is the recommend/decide line drawn?
        authorities:
          - un-charter-art-39
      - id: r3
        criterion: Art 103 and conflicting treaties
        marks: 3
        top-band: >-
          Explains that a binding decision is a Charter obligation that prevails over a conflicting treaty obligation,
          with a sanctions example.
        margin-note: Which obligation wins if a treaty points the other way — and why?
        authorities:
          - un-charter-art-103
      - id: r4
        criterion: Consequence for the state
        marks: 2
        top-band: 'Concludes clearly: free to decline a recommendation; bound to implement a decision whatever its vote.'
        margin-note: Finish with what the state must actually do.
        authorities: []
  - key: q1001
    type: mcq
    concept: article-39-findings-in-practice
    difficulty: 1
    stem: Which three findings does art 39 list, any one of which opens Chapter VII?
    options:
      - text: An armed attack, a threat of force, or a breach of art 2(4).
        why: >-
          Tempting because these are Week 9 terms, but "armed attack" triggers self-defence under art 51; art 39 uses
          threat, breach and aggression.
      - text: A dispute, a situation, or a likely danger to international peace and security.
        why: Wrong — this is Chapter VI language (arts 33–35) for peaceful settlement, which needs no art 39 finding.
      - text: A coup, a civil war, or a humanitarian emergency inside a state.
        why: >-
          Wrong — these are kinds of facts the Council may treat as a threat to the peace, not the three findings art 39
          itself lists.
      - text: A threat to the peace, a breach of the peace, or an act of aggression.
        correct: true
        why: >-
          Correct — art 39: the Council "shall determine the existence of any threat to the peace, breach of the peace,
          or act of aggression".
  - key: q1002
    type: mcq
    concept: article-39-findings-in-practice
    difficulty: 2
    stem: According to the lecture, which art 39 finding has the Security Council made most often?
    options:
      - text: A threat to the peace.
        correct: true
        why: >-
          Correct — the lecture explained that finding a threat to the peace is much more common than the other two, and
          its scope has evolved considerably since 1945.
      - text: A breach of the peace, found in every invasion of one state by another.
        why: >-
          Wrong — the lecture said a breach of the peace has been found on only a very few occasions, not in every
          invasion.
      - text: An act of aggression, the Charter's central concern in 1945.
        why: >-
          Tempting because aggression was the founders' worry, but the lecture said the Council has never or very rarely
          found an act of aggression.
      - text: None of them — the Council usually acts without any art 39 finding.
        why: Wrong — Chapter VII measures need an art 39 determination; only Chapter VI action proceeds without one.
  - key: q1003
    type: mcq
    concept: article-39-findings-in-practice
    difficulty: 2
    stem: How often, according to the lecture, has the Security Council found an act of aggression in its resolutions?
    options:
      - text: In every case in which it later authorised force under art 42.
        why: >-
          Wrong — authorisations of force have followed findings of threats to the peace (e.g. internal conflicts); an
          aggression finding is not required.
      - text: Never, or only very rarely.
        correct: true
        why: >-
          Correct — the lecture said the Council has never or very rarely found an act of aggression; this is not
          something it has said in its resolutions as such.
      - text: Whenever one state's troops have crossed into another state's territory.
        why: >-
          Wrong — even Iraq's invasion of Kuwait was described in the lecture as a breach of the peace; troop movements
          do not automatically produce an aggression finding.
      - text: Routinely during the Cold War, and less often since it ended.
        why: >-
          Reversed in spirit — the Cold War made Chapter VII determinations hard to reach at all; the Council has been
          more active since.
  - key: q1004
    type: mcq
    concept: article-39-findings-in-practice
    difficulty: 2
    stem: Which situation did the lecture give as one in which the Council determined a breach of the peace?
    options:
      - text: The 2014 Ebola outbreak in Africa.
        why: Wrong — Ebola is the slides' example of a non-traditional threat to the peace, not a breach of the peace.
      - text: Nuclear proliferation by the DPRK.
        why: >-
          Wrong — proliferation has been treated as a threat to the peace (and met with sanctions such as Res 2397), not
          as a breach.
      - text: Iraq's invasion of Kuwait in 1990.
        correct: true
        why: >-
          Correct — the lecture gave Iraq's 1990 invasion of Kuwait as one of the very few breach-of-the-peace findings;
          it led to Res 678.
      - text: Terrorism by groups such as Al-Qaida and ISIL.
        why: >-
          Wrong — terrorism appears among the non-traditional threats to the peace; it has not been the basis of a
          breach finding.
  - key: q1005
    type: mcq
    concept: article-39-findings-in-practice
    difficulty: 2
    stem: What did the rare breach-of-the-peace findings described in the lecture have in common?
    options:
      - text: Each involved an armed invasion of one state's territory.
        correct: true
        why: >-
          Correct — the lecture linked the breach findings to situations of invasion of territory, such as Iraq's
          invasion of Kuwait in 1990.
      - text: Each involved a public health emergency spreading across borders.
        why: >-
          Wrong — a health emergency (Ebola 2014) was treated as a threat to the peace, the flexible finding, not as a
          breach.
      - text: Each involved weapons of mass destruction held by a non-state group.
        why: Wrong — proliferation and terrorism are examples of non-traditional threats to the peace, not of breaches.
      - text: Each followed an Assembly recommendation under Uniting for Peace.
        why: >-
          Wrong — Uniting for Peace is the Assembly's route when the Council is deadlocked; it is not linked to the
          Council's breach findings.
  - key: q1006
    type: mcq
    concept: article-39-findings-in-practice
    difficulty: 2
    stem: How has the Council's reading of "threat to the peace" changed since 1945?
    options:
      - text: It has narrowed to cases where one state has already invaded another.
        why: >-
          Reversed — the lecture described a widening, not a narrowing: from inter-state invasion to non-traditional
          threats.
      - text: It has stayed fixed, because art 39 lists the qualifying situations.
        why: >-
          Wrong — art 39 lists no qualifying situations; the Council decides, and its interpretation has evolved
          considerably.
      - text: It has widened from inter-state invasion to non-traditional threats such as terrorism and epidemics.
        correct: true
        why: >-
          Correct — the slides and lecture list proliferation, terrorism, internal conflicts, serious violations and the
          2014 Ebola outbreak.
      - text: It now requires a prior ICJ finding that international law was breached.
        why: Wrong — the determination is the Council's own political judgement; no ICJ finding is needed.
  - key: q1007
    type: mcq
    concept: article-39-findings-in-practice
    difficulty: 3
    stem: Which statement about the Cold War and Chapter VII is best supported by this week's materials?
    options:
      - text: The Council was most active then, because the P-5 shared a common enemy.
        why: >-
          Reversed — the lecture said tension between the US and Russia made Chapter VII action hard; activity rose
          after the Cold War.
      - text: >-
          US–Russian tension, sometimes through proxies, made determinations hard to reach; the Council has been far
          more active since.
        correct: true
        why: >-
          Correct — the lecture linked Cold War deadlock (including proxy conflicts) to rare Chapter VII action; the
          slides add that the veto has stopped the Council acting.
      - text: The Cold War ended the veto, which is why the Council is more active today.
        why: >-
          Wrong — the P-5 veto (art 27(3)) still exists; the slides list it among the reasons the Council has not acted
          in every case.
      - text: The Council routinely found acts of aggression during the Cold War.
        why: Wrong — the lecture said the Council has never or very rarely found an act of aggression, in any period.
  - key: q1008
    type: mcq
    concept: article-39-findings-in-practice
    difficulty: 3
    stem: >-
      In the tutorial's Aeystan scenario (a coup, civil war, refugees crossing borders, neighbours arming factions and
      reportedly sending troops), which art 39 finding is the Council most likely to make, on its practice?
    options:
      - text: An act of aggression by Aeystan against Belandia and Ceria.
        why: >-
          Wrong — Aeystan is the state in turmoil, not an aggressor, and aggression findings are never or very rarely
          made.
      - text: No finding at all, because the conflict began inside one state.
        why: >-
          Wrong — practice treats internal armed conflicts and serious violations as threats to the peace; an internal
          origin does not bar a finding.
      - text: A threat to the peace, on its practice for internal armed conflict.
        correct: true
        why: >-
          Correct — the usual and flexible finding; internal conflict, refugee flows and foreign arms and troops all
          support a threat to the peace.
      - text: A breach of the peace, because a coup is an invasion of territory.
        why: >-
          Wrong — a coup is not an invasion of one state by another; breach findings have been reserved for invasions
          such as Iraq–Kuwait.
  - key: q1009
    type: mcq
    concept: article-39-findings-in-practice
    difficulty: 2
    stem: Why is the art 39 determination described as flexible?
    options:
      - text: States may choose whether to accept the Council's determination.
        why: Wrong — a determination followed by a decision binds members (art 25); states cannot opt out of it.
      - text: The ICJ may review and overturn the determination on the application of a state.
        why: >-
          Wrong — nothing in this week's materials gives the ICJ power to overturn an art 39 determination; it is for
          the Council.
      - text: The Assembly may make it instead whenever the Council prefers.
        why: >-
          Wrong — art 39 gives the determination to the Security Council; the Assembly recommends (and under Uniting for
          Peace acts only on deadlock).
      - text: The Council decides what counts as a threat, and its practice keeps widening.
        correct: true
        why: >-
          Correct — the determination is the Council's, and it has stretched from inter-state conflict to proliferation,
          terrorism, internal conflict and Ebola.
  - key: q1010
    type: mcq
    concept: article-39-findings-in-practice
    difficulty: 3
    contrasts-with:
      - peaceful-settlement-under-chapter-vi
    stem: >-
      The Council wants to recommend that two states mediate a tense border dispute in which no fighting has started.
      Does it need an art 39 determination?
    options:
      - text: Yes — every Council act requires a prior finding of a threat to the peace.
        why: >-
          Wrong — the art 39 determination opens Chapter VII; Chapter VI powers to call on, investigate and recommend
          need no such finding.
      - text: No — Chapter VI powers such as arts 33(2) and 36(1) need no determination.
        correct: true
        why: >-
          Correct — under Chapter VI the Council can call on the parties to settle peacefully (art 33(2)) and recommend
          methods (art 36(1)) without any art 39 finding.
      - text: Yes — unless the General Assembly has already discussed the dispute.
        why: >-
          Wrong — Assembly discussion has no bearing on whether the Council needs an art 39 finding; Chapter VI never
          requires one.
      - text: No — but only because mediation belongs to the Secretary-General.
        why: >-
          Wrong reason — the Secretary-General has good offices, but the Council itself may recommend mediation under
          Chapter VI.
  - key: q1011
    type: mcq
    concept: article-39-findings-in-practice
    difficulty: 3
    stem: >-
      Iraq invaded Kuwait in 1990. Which statement best reflects the lecture's point about overlap between the art 39
      findings?
    options:
      - text: An invasion can only ever be an act of aggression, never a breach of the peace.
        why: Wrong — the lecture gave Iraq's invasion as an example of a breach of the peace; an invasion can be both.
      - text: Such an invasion can be both a breach of the peace and an act of aggression.
        correct: true
        why: >-
          Correct — the lecturer accepted the categories overlap and the distinction is confusing; an invasion fits both
          breach and aggression.
      - text: An invasion becomes a threat to the peace only once refugees cross borders.
        why: >-
          Wrong — refugee flows can support a threat finding, but they are not a precondition, and an invasion can
          itself be a breach.
      - text: The findings are mutually exclusive, so the Council must pick exactly one.
        why: Wrong — the lecture stressed overlap; nothing in art 39 makes the three findings mutually exclusive.
  - key: q1012
    type: mcq
    concept: article-39-findings-in-practice
    difficulty: 2
    stem: >-
      Which of these is NOT among the non-traditional threats the materials say the Council has treated as threats to
      the peace?
    options:
      - text: Proliferation of nuclear, chemical or biological weapons.
        why: Wrong choice — proliferation is listed in the slides as part of the Council's evolving art 39 practice.
      - text: A state's decision to leave a regional trade organisation.
        correct: true
        why: >-
          Correct — nothing in the materials treats leaving a trade organisation as a threat to the peace; the others
          are all listed examples.
      - text: The 2014 Ebola outbreak in Africa.
        why: >-
          Wrong choice — the slides list it, and the lecture called it perhaps the most striking example of the widening
          finding.
      - text: Terrorism.
        why: Wrong choice — terrorism is listed in the slides and the lecture among non-traditional threats to the peace.
  - key: q1013
    type: mcq
    concept: article-39-findings-in-practice
    difficulty: 1
    stem: Without an art 39 determination, which of these can the Security Council NOT do?
    options:
      - text: Impose sanctions under art 41.
        correct: true
        why: >-
          Correct — art 41 measures are decided "in accordance with" art 39, so they need a prior determination of
          threat, breach or aggression.
      - text: Investigate a dispute under art 34.
        why: Wrong choice — investigation is a Chapter VI power and needs no art 39 finding.
      - text: Recommend methods of adjustment under art 36(1).
        why: Wrong choice — recommending procedures is a Chapter VI power, available without any art 39 determination.
      - text: Call on the parties to settle peacefully (art 33(2)).
        why: >-
          Wrong choice — art 33(2) is part of Chapter VI; the Council can call on the parties without a Chapter VII
          finding.
  - key: q1014
    type: mcq
    concept: article-39-findings-in-practice
    difficulty: 3
    variant-of: q1008
    stem: >-
      A state's government collapses; armed groups seize towns and a deadly epidemic spreads across its borders. Which
      art 39 finding best fits the Council's practice?
    options:
      - text: An act of aggression, since the armed groups use force against civilians.
        why: Wrong — aggression findings are never or very rarely made, and these facts involve no state invading another.
      - text: 'A threat to the peace: practice covers internal conflict and even epidemics.'
        correct: true
        why: >-
          Correct — internal armed conflict and the 2014 Ebola outbreak both sit within the Council's widened
          threat-to-the-peace practice.
      - text: A breach of the peace, since any armed violence breaches the peace.
        why: Wrong — the lecture tied breach findings to invasions of territory, not to every outbreak of armed violence.
      - text: 'None: art 39 covers only conflicts between two or more states.'
        why: Wrong — practice expressly includes internal armed conflicts; art 39 is not limited to inter-state conflict.
  - key: q1015
    type: mcq
    concept: article-39-findings-in-practice
    difficulty: 2
    variant-of: q1002
    stem: >-
      A state argues that the Council can act under Chapter VII only after finding an act of aggression. What is the
      best response?
    options:
      - text: 'Wrong: any of the three findings suffices; a threat to the peace is the usual one.'
        correct: true
        why: >-
          Correct — art 39 lists threat, breach and aggression as alternatives, and threat to the peace is the Council's
          usual route into Chapter VII.
      - text: 'Right: aggression is the only art 39 finding that can open the way to art 42 force.'
        why: >-
          Wrong — art 42 depends on an art 39 determination of any of the three kinds and on art 41 being inadequate,
          not on aggression.
      - text: 'Right: a threat or a breach opens only the Chapter VI powers.'
        why: Wrong — Chapter VI needs no finding at all; a threat or breach under art 39 opens Chapter VII.
      - text: 'Wrong: art 39 needs no finding; the Council may act whenever it wishes.'
        why: Wrong — Chapter VII measures do need a determination; the point is that a threat to the peace is enough.
  - key: q1016
    type: truefalse
    concept: article-39-findings-in-practice
    difficulty: 1
    statement: The Security Council has frequently determined that acts of aggression have occurred.
    answer: false
    why: >-
      False — the lecture said the Council has never, or only very rarely, found an act of aggression; its usual finding
