      responding to the one before:


      1. **Liberal feminism**: the goal is equal treatment. Remove all formal barriers to women's equal participation in
      social, economic and political life; assess individuals on their merits, not group membership. Most legal gains of
      the 60s and 70s used it (eg the Sex Discrimination Act 1984 (Cth)). Problem: formal equality did not become
      substantive equality, and it implicitly assumes male experiences as the norm/benchmark.


      2. **Cultural/difference feminism** embraces the differences between men and women, reacting to a formal equality
      that forces women to assimilate to patriarchal structures. Carol Gilligan: ethics of care vs ethics of justice.
