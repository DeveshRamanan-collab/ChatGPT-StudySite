  - key: e02
    type: mcq
    concept: lacey-impartiality-and-community
    difficulty: 2
    stem: What justification does the slide give for law's commitment to objective, impartial and disinterested reasoning?
    options:
      - text: Judges are elected and must reflect the opinions of the majority who chose them.
        why: The slide says nothing about electing judges; the justification it gives is equality before the law.
      - text: Everyone will be treated equally before the law, regardless of race, sex or religion.
        correct: true
        why: >-
          Right: equality before the law is said to be achieved by the impartiality of laws and judicial reasoning,
          which feminist theorists then question.
      - text: Emotion is irrelevant to law because law is only the command of a political superior.
        why: >-
          Austin's command theory is not the slide's justification; the slide grounds impartial reasoning in equal
          treatment before the law.
      - text: Objective reasoning guarantees that every hard case has exactly one right answer.
        why: >-
          The one right answer thesis is Dworkin's; the slide's justification for impartial reasoning is equality before
          the law.
  - key: e03
    type: mcq
    concept: lacey-impartiality-and-community
    difficulty: 2
    stem: How are the terms 'rational', 'impartial' and 'objective' often defined, according to the slide?
    options:
      - text: By reference to the words of a statute
        why: >-
          Statutes rarely define these terms; the slide's point is that they are often defined in terms of their
          opposites.
      - text: In terms of their opposites
        correct: true
        why: >-
          Right: they are often defined against their opposites (emotion, partiality, subjectivity), and our
          understanding of law reflects this divided view of the world.
      - text: By the system's rule of recognition
        why: >-
          The rule of recognition identifies valid law in Hart's theory; it does not define these terms of legal
          discourse.
      - text: By the precedent of the highest court
        why: The slide does not say courts define these terms; it says they are often defined in terms of their opposites.
  - key: e04
    type: mcq
    concept: lacey-impartiality-and-community
    difficulty: 2
    stem: Which of these is NOT among the conventional assumptions targeted by the feminist challenge (citing Lacey)?
    options:
      - text: Law's unity and coherence
        why: 'This is on the list: the feminist challenge questions whether law really is unified and coherent.'
      - text: Law's dependence on morality and justice
        correct: true
        why: >-
