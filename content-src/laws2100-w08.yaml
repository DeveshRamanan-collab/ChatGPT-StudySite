      - text: To identify the common good that the central case of law ought to promote
        why: >-
          The common good is Finnis's, not Austin's; Austin identifies the sovereign from a community's habit of
          obedience.
      - text: To identify the officials who accept the secondary rules of the system
        why: Officials accepting secondary rules is Hart's account of a legal system, not Austin's.
