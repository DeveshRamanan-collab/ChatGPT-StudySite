    body: >-
      Outsider jurisprudence is an umbrella term. This week it covers feminist legal theory and critical race theory,
      which share these features:


      - the law reflects and perpetuates a dominant perspective (remember CLS);

      - a critical approach to law and legal institutions (remember legal realism);

      - different aspects: gender, race, culture, sexuality…;

      - disadvantage and disempowerment in marginalised social groups;

      - concern with equality, justice and legal reform;

      - language and power: naming things has real consequences.


      **Inside and outside of what?** Hart's internal point of view is that of those who voluntarily participate in a
      practice. Yet a legal system exists if officials accept its secondary rules and citizens generally comply with its
      primary rules, perhaps only out of fear. Many people are subjects of the law, even its victims, and some suffer
      more in particular areas (family, employment, contract law). Outsider jurisprudence focuses on those oppressed or
      marginalised by a legal system, not on the trivial outsider to a foreign one.


      The distinction also applies to **legal theory**: a canon (analytical jurisprudence) and investigations that
      challenge it. So outsider jurisprudence helps us rethink both 'what is law?' and 'what is legal theory?'.


      These theories combine analysis with political commitment, thought and action, description and evaluation. A
      theory that aims to change the status quo should also be assessed by its practical achievements.


      Exam use: keep the question about the nature of law apart from the question about the nature of legal theory.
