questions:
  - key: a01
    type: mcq
    concept: outsider-jurisprudence
    difficulty: 1
    set: pretest
    stem: >-
      On the Week 8 slide, which earlier movement is recalled by the claim that 'the law reflects and perpetuates a
      dominant perspective'?
    options:
      - text: Critical Legal Studies
        correct: true
        why: >-
          Right: the slide adds "(remember the CLS)" to this claim. CLS treated law as ideology that promotes the
          interests of the powerful, and outsider jurisprudence builds on that insight.
      - text: Legal positivism, through Hart's rule of recognition
        why: >-
          Tempting because Hart explains how a legal system exists, but positivism offers a general and descriptive
          account; it does not set out to unmask a dominant perspective.
      - text: Natural law theory, through Finnis's common good
        why: >-
          Finnis's common good marks the central case of law. The slide pairs the dominant-perspective claim with CLS,
          not with natural law theory.
      - text: Austin's command theory of the sovereign
        why: >-
          Austin did link law and power, which makes this tempting, but the slide's reminder is "(remember the CLS)",
          the movement that treats law as ideology.
  - key: a02
    type: mcq
    concept: outsider-jurisprudence
    difficulty: 1
    stem: The slide pairs 'a critical approach to law and legal institutions' with which reminder?
    options:
      - text: Remember Kelsen, whose pure theory excludes other disciplines
        why: >-
          Kelsen's pure theory is the opposite of a critical, contextual approach; the lecture contrasts it with
          feminist legal theory's generous methodology.
      - text: Remember legal realism, which opened space for critique
        correct: true
        why: >-
          Right: the slide says "(remember Legal Realism)". The lecture explains that realism, especially in US
          academia, created the space for a critical assessment of legal reasoning and institutions.
      - text: Remember Fuller, whose eight principles make law moral
        why: >-
          Fuller's principles of legality are procedural values; the lecture says they help law present itself as
          impartial, which outsider theories question.
      - text: Remember Austin, whose sovereign is habitually obeyed
        why: >-
          Austin's habit of obedience explains the sovereign, not a critical approach to institutions; the slide's
          reminder is legal realism.
  - key: a03
    type: mcq
    concept: outsider-jurisprudence
    difficulty: 2
    stem: When the lecture asks 'inside and outside of what?', which point about Hart's existence conditions does it make?
    options:
      - text: >-
          Officials must accept the secondary rules, but citizens need only generally comply with the primary rules,
          perhaps out of fear.
        correct: true
        why: >-
          Right: the lecture uses Hart's two conditions to show that many people within a jurisdiction are subjects of
          the law, even its victims, rather than participants who accept it.
      - text: >-
          Judges must apply the rule of recognition, while legislators must make primary rules only by a majority vote
          of citizens.
        why: >-
          Hart's conditions say nothing about majority voting. The lecture's contrast is between officials who accept
          rules and citizens who may merely comply.
      - text: >-
          Citizens must accept the rule of recognition, while officials need only obey the commands of the sovereign out
          of habit.
        why: >-
          This reverses Hart: it is officials who must accept the secondary rules, and the habit of obedience to a
          sovereign is Austin's idea, not Hart's.
      - text: >-
          Everyone in the jurisdiction must take the internal point of view before a legal system can be said to exist
          there.
        why: >-
          Tempting because Hart stresses the internal point of view, but he requires acceptance only from officials;
          ordinary citizens need only comply in general.
  - key: a04
    type: mcq
    concept: outsider-jurisprudence
    difficulty: 2
    stem: On the lecture's account, who does outsider jurisprudence chiefly focus on as "outside"?
    options:
      - text: Foreign observers never subject to the legal system
        why: >-
          The lecture calls this the trivial sense of being external (a legal system in a country you have never
          visited); it is not what outsider jurisprudence studies.
      - text: Officials who refuse to accept their system's rules
        why: >-
          Officials who reject the secondary rules are a problem for Hart's account of a legal system's existence, but
          the lecture's outsiders are those the system marginalises.
      - text: People oppressed or marginalised by their own system
        correct: true
        why: >-
          Right: the lecture says outsider jurisprudence focuses on people who, so to speak, suffer from the legal
          system: those it oppresses or marginalises.
      - text: Holmes's bad man, who cares only about the consequences
        why: >-
          The bad man is an external perspective on rules from week 6, tempting here, but he is not an outsider in the
          sense of being marginalised by the law.
  - key: a05
    type: mcq
    concept: outsider-jurisprudence
    difficulty: 1
    stem: Which pair of questions does the slide say outsider jurisprudence can help us rethink?
    options:
      - text: '''What is justice?'' and ''what is a right?'''
        why: >-
          Justice and rights come later in the unit and do matter to these theories, but the slide names the questions
          about law and about legal theory.
      - text: '''Who is sovereign?'' and ''what is a command?'''
        why: >-
          These are Austin's questions from week 2. The slide says outsider jurisprudence helps us rethink 'what is
          law?' and 'what is legal theory?'.
      - text: '''What is law?'' and ''what is legal theory?'''
        correct: true
        why: >-
          Right: the last two bullets on the slide say outsider jurisprudence can help us rethink both questions, which
          the lecture asks you to keep apart.
      - text: '''Is an unjust law law?'' and ''must we obey it?'''
        why: >-
          These belong to the natural law debate of week 4. The slide's two questions are about the nature of law and
          the nature of legal theory.
  - key: a06
    type: mcq
    concept: outsider-jurisprudence
    difficulty: 3
    stem: Why does the lecture say the inside/outside distinction applies to legal theory as well as to law?
    options:
      - text: >-
          Because legal theorists are officials of the system and therefore take the internal point of view of its
          rules.
        why: >-
          Theorists are not officials by virtue of theorising; the lecture applies the distinction to the canon of legal
          theory, not to the theorists' legal role.
      - text: >-
          Because analytical jurisprudence formed a canon with special status, and other investigations challenge that
          status quo.
        correct: true
        why: >-
          Right: the lecture says analytical jurisprudence held a special status for theoretical, cultural, sociological
          and academic reasons, and competing theories challenge it.
      - text: >-
          Because outsider jurisprudence rejects every earlier theory of law as false and installs a new canon in its
          place.
        why: >-
          Too strong: the lecture says these theories question how the problems were framed and offer new insights; it
          does not say they reject every earlier theory.
      - text: >-
          Because every legal theory is written by a citizen of the very legal system that the theory sets out to
          describe and explain.
        why: >-
          Citizenship of the theorist is not the point; Hart wrote a general theory not tied to any one system. The
          point concerns the canon and its challengers.
  - key: a07
    type: mcq
    concept: outsider-jurisprudence
    difficulty: 2
    stem: Which of these is NOT listed on the slide as a feature of outsider jurisprudence?
    options:
      - text: Concern with equality, justice, and legal reform
        why: >-
          This is on the slide: outsider theories combine analysis with a concern for equality, justice and legal
          reform.
      - text: A commitment to a pure theory free of other disciplines
        correct: true
        why: >-
          Right: this describes Kelsen's pure theory, which the lecture contrasts with the generous, interdisciplinary
          methods of feminist legal theory.
      - text: Disadvantage and disempowerment in marginalised groups
        why: >-
          This is on the slide: outsider jurisprudence studies disadvantage and disempowerment in marginalised social
          groups.
      - text: Language and power
        why: >-
          This is on the slide. The lecture explains that critical theories see language as an exercise of power: naming
          things has real consequences.
  - key: a08
    type: mcq
    concept: outsider-jurisprudence
    difficulty: 3
    stem: The lecture says critical theories treat language as 'an exercise in power'. What does it mean?
    options:
      - text: Legal concepts should be clarified by analysing how words are used, as Hart does in chapter one.
        why: >-
          Tempting because Hart also attends to language, but the lecture distinguishes linguistic analysis for clarity
          from the claim that language itself exercises power.
      - text: Words in legal rules have a core of settled meaning and a penumbra of doubt that judges must fill.
        why: >-
          This is Hart's open texture from week 6, a claim about indeterminacy, not about the power exercised by naming
          things.
      - text: Only the sovereign has the power to define what the words in a statute mean for its subjects.
        why: >-
          Austin's sovereign commands, but the lecture's point is wider: anyone's choice of terms can have real
          consequences in the world.
      - text: Naming things with certain terms has real consequences in the real world.
        correct: true
        why: >-
          Right: the lecture says naming things using certain terms has real consequences, which is why these theories
          pay attention to legal language and categories.
  - key: a09
    type: mcq
    concept: outsider-jurisprudence
    difficulty: 3
    contrasts-with:
      - laws2100-w06-critical-legal-studies
    stem: How does the lecture relate feminist legal theory and critical race theory to legal realism?
    options:
      - text: >-
          They build on critical insights realism made room for, though their theorists do not necessarily call
          themselves realists.
        correct: true
        why: >-
          Right: the lecture says realism created the space for critical assessment of legal reasoning and institutions,
          and these theorists occupy that space even if they are not realists.
      - text: They are branches of American legal realism and share its prediction theory of law as what the courts will do.
        why: >-
          Tempting because of the slide's reminder, but the lecture says these theorists do not necessarily present
          themselves as realists, let alone adopt Holmes's prediction theory.
      - text: >-
          They reject realism entirely, because realism was indifferent to equality and to the reform of legal
          institutions.
        why: >-
          The slide says "remember Legal Realism" as a source, not a target: outsider theories build on its critical
          approach.
      - text: They adopt Scandinavian realism's empirical method and abandon normative arguments about justice altogether.
        why: >-
          Outsider theories always combine analysis with normative arguments about equality and justice, so they do not
          abandon normative argument.
  - key: a10
    type: mcq
    concept: outsider-jurisprudence
    difficulty: 2
    stem: According to the lecture, how do outsider theories combine description and evaluation?
    options:
      - text: They are purely descriptive, leaving all evaluation to political philosophy
        why: >-
          The lecture says the opposite: even a descriptive claim comes with attention to equality and justice and a
          desire for change.
      - text: They are purely normative, offering no analysis of law as it exists
        why: >-
          They do analyse existing law (eg how it fails to be impartial); the point is that analysis is always joined to
          normative argument.
      - text: Even when pushing a descriptive claim, they attend to equality and justice
        correct: true
        why: >-
          Right: the lecture says there is always attention to equality and justice and a desire to bring about change,
          even behind descriptive claims.
      - text: They evaluate laws only against Fuller's eight principles of legality
        why: >-
          Fuller's principles are procedural; outsider theories evaluate law in terms of equality, justice and the
          position of marginalised groups.
  - key: a11
    type: mcq
    concept: outsider-jurisprudence
    difficulty: 4
    stem: >-
      Because feminist legal theory presents itself as thought and action, how does the lecture say we should judge its
      success?
    options:
      - text: Only by the criteria used to compare descriptive theories, such as generality and explanatory power
        why: >-
          The lecture warns against comparing a theory that combines thought and action using only the criteria for
          descriptive theories.
      - text: Only by asking whether it gives a better account of the rule of recognition than Hart gave
        why: >-
          This would treat it as a rival to Hart's descriptive project; the lecture says its practical aims must also
          count.
      - text: 'Look also at its practical achievements: whether it brought about the change it aimed at'
        correct: true
        why: >-
          Right: a theory meant to change the status quo, not just analyse it, must also be judged by whether it
          achieved change, such as the reforms on the slide.
      - text: By counting the judges who have formally adopted it as the correct theory of law
        why: >-
          No theory is assessed by judicial adoption in the lecture; the point is that practical change becomes one of
          the criteria of success.
  - key: a12
    type: mcq
    concept: outsider-jurisprudence
    difficulty: 3
    variant-of: a03
    stem: >-
      In a dictatorship most people obey out of fear, while a small group of officials embraces the rules and the
      ideology. On the lecture's reading of Hart, what follows?
    options:
      - text: A legal system exists; the fearful majority are its subjects, perhaps its victims, rather than insiders.
        correct: true
        why: >-
          Right: officials' acceptance plus general compliance is enough for Hart, so the system exists, and the
          majority are subject to it from the outside, as the lecture says.
      - text: No legal system exists, because most citizens do not accept the rules from the internal point of view.
        why: >-
          Hart requires acceptance from officials only; general compliance by citizens, even from fear, satisfies his
          second condition.
      - text: No legal system exists, because Hart's conditions also require that the system's laws be morally sound.
        why: >-
          The lecture stresses that Hart chose his two conditions precisely so that morally unsound regimes can still
          count as legal systems.
      - text: >-
          A legal system exists only for the officials; the majority are not subject to that legal system's rules at
          all.
        why: >-
          The majority are subject to the primary rules; the lecture's point is that they are inside the jurisdiction
          yet outside the practice, perhaps as victims.
  - key: a13
    type: mcq
    concept: outsider-jurisprudence
    difficulty: 2
    stem: Which change of perspective does the lecture use to show that reframing a problem can advance legal theory?
    options:
      - text: Kelsen's move from the basic norm to the rule of recognition as the test of legal validity
        why: >-
          The rule of recognition is Hart's, not Kelsen's, and the lecture's example of reframing is Hart's change of
          perspective against Austin.
      - text: Hart's move from the external to the internal point of view (the puzzled man, not the bad man)
        correct: true
        why: >-
          Right: the lecture says Hart changed the perspective on Austin's problem, which generated new insights;
          critical theories do the same with the received problems.
      - text: Fuller's move from the morality of duty to the morality of aspiration in judging legal systems
        why: >-
          Fuller's distinction is real but is not the lecture's example; the example is Hart reframing Austin's problem
          from the internal point of view.
      - text: Dworkin's move from principles to rules as the main material of reasoning in hard cases
        why: >-
          This reverses Dworkin, who moved from rules to principles, and it is not the example the lecture gives of
          changing the problem.
  - key: a14
    type: mcq
    concept: outsider-jurisprudence
    difficulty: 2
    stem: Which kind of "outsider" does the lecture call trivial?
    options:
      - text: A citizen who complies with the primary rules only out of fear of the sanctions
        why: >-
          This person is the lecture's central example of someone inside a jurisdiction yet outside the practice,
          perhaps a victim of the system.
      - text: Someone thinking about a foreign legal system they have never been subject to
        correct: true
        why: >-
          Right: the lecturer gives the example of a legal system in a country he has never visited, whose laws do not
          apply to him: a trivial sense of being external.
      - text: A woman whose injuries the law had no name for until a few decades ago
        why: >-
          Her position is exactly what feminist legal theory addresses through naming and the legal recognition of
          injuries; it is not trivial.
      - text: A member of a group that suffers more under family or employment law
        why: >-
          The lecture uses this to show that some members of a community suffer more in some areas of law: a real, not
          trivial, outsider position.
  - key: a15
    type: truefalse
    concept: outsider-jurisprudence
    difficulty: 1
    set: quickfire
    statement: The lecture describes outsider jurisprudence as an umbrella term covering several different theories.
    answer: true
    why: >-
      True: the lecture calls it an umbrella term; this week it groups feminist legal theory and critical race theory,
      each itself a family of approaches.
  - key: a16
    type: truefalse
    concept: outsider-jurisprudence
    difficulty: 2
    set: quickfire
    statement: >-
      On the lecture's reading, Hart requires ordinary citizens to accept the rules from the internal point of view
      before a legal system exists.
    answer: false
    why: >-
      False: Hart requires officials to accept the secondary rules; ordinary citizens need only generally comply with
      the primary rules, perhaps only out of fear.
  - key: a17
    type: truefalse
    concept: outsider-jurisprudence
    difficulty: 1
    set: quickfire
    statement: >-
      The slide lists disadvantage and disempowerment in marginalised social groups as a concern of outsider
      jurisprudence.
    answer: true
    why: >-
      True: the slide lists it alongside gender, race, culture and sexuality, concern with equality and reform, and
      language and power.
  - key: a18
    type: truefalse
    concept: outsider-jurisprudence
    difficulty: 2
    set: quickfire
    statement: The lecture says feminist legal theory, like Hart's theory, presents itself as a purely descriptive theory of law.
    answer: false
    why: >-
      False: Hart presents his theory as general and descriptive, but feminist legal theory always combines analysis or
      description with political engagement.
  - key: a19
    type: short
    concept: outsider-jurisprudence
    difficulty: 3
    prompt: '''Outsider jurisprudence tells us something about law, but nothing about legal theory.'' Discuss.'
    model: >-
      The claim is wrong: outsider jurisprudence reopens both questions, and the second is arguably its more distinctive
      contribution. Argument: on law, outsider theories hold that law reflects and perpetuates a dominant perspective,
      and that marginalised groups experience it as subjects, even victims. Hart's own existence conditions allow this:
      officials must accept the secondary rules, but citizens need only comply, perhaps out of fear. On legal theory,
      the inside/outside distinction applies to the canon: analytical jurisprudence held a special status, and critical
      theories question how its problems were framed, much as Hart reframed Austin's. Because they combine description
      with political commitment, they must also be assessed by their practical achievements. Counterargument: a Hartian
      may reply that these are claims about particular legal systems, and that a general, descriptive theory can
      register oppression without endorsing it. Evaluation: the reply concedes the key point. Choosing whose perspective
      a theory must explain is a methodological decision, and outsider jurisprudence makes that decision visible. It
      therefore speaks directly to what legal theory is and should be.
    rubric:
      - id: r1
        criterion: Thesis — takes a position on whether outsider jurisprudence bears on legal theory as well as on law.
        marks: 2
        top-band: States at once that it reopens both questions and says which contribution is more distinctive.
        margin-note: Both questions, or one? Commit in the first line.
        authorities: []
      - id: r2
        criterion: >-
          Argument — uses the inside/outside distinction for law (Hart's officials and complying citizens) and for legal
          theory (the canon).
        marks: 3
        top-band: >-
          Uses Hart's two existence conditions and the status of analytical jurisprudence accurately, tying each to
          'what is law?' and 'what is legal theory?'.
        margin-note: 'Good: Hart used against himself.'
        authorities:
          - hart-the-concept-of-law
      - id: r3
        criterion: Counterargument — states the general and descriptive reply at full strength.
        marks: 3
        top-band: >-
          Presents the Hartian defence charitably (a descriptive theory can register oppression without endorsing it)
          before answering it.
        margin-note: 'Charity: is this the strongest version of the reply?'
        authorities: []
      - id: r4
        criterion: Evaluation — concludes on method and on judging theories that combine thought and action.
        marks: 2
        top-band: >-
          Shows that choosing perspectives is a methodological decision and that practical achievements become a
          criterion of success.
        margin-note: 'Zoom out: what does this mean for a "general" theory?'
        authorities: []
  - key: a20
    type: match
    concept: outsider-jurisprudence
    difficulty: 2
    prompt: Match each standpoint from the lecture with where it sits in relation to a legal system.
    pairs:
      - left: Officials who accept the secondary rules
        right: 'Inside: the internal point of view'
      - left: Citizens who comply with primary rules out of fear
        right: Subjects of the law, perhaps its victims
      - left: A visitor thinking about a foreign legal system
        right: Trivially external
      - left: A woman who studied law and became a legal official
        right: The outsider within
  - key: b01
    type: mcq
    concept: four-feminisms
    difficulty: 1
    set: pretest
    stem: On the Week 8 slide, what is the goal of liberal feminism?
    options:
      - text: Equal treatment
        correct: true
        why: >-
          Right: the slide says "the goal of liberal feminism is equal treatment", pursued by removing formal barriers
          to women's participation.
      - text: Recognition of women's different voice
        why: >-
          This is the aim of cultural/difference feminism, which embraces the differences between men and women, as in
          Gilligan's ethics of care.
      - text: An end to the domination of women as a class
        why: This is radical feminism (MacKinnon), which shifts the focus from individuals to women and men as classes.
      - text: Deconstruction of the male/female binary
        why: >-
          This belongs to postmodern feminism, which deconstructs binary oppositions such as male/female, reason/emotion
          and nature/culture.
  - key: b02
    type: mcq
    concept: four-feminisms
    difficulty: 2
    stem: For liberal feminists, what is the solution to the oppression of women?
    options:
      - text: Remove all formal barriers to women's equal participation in social, economic and political life
        correct: true
        why: >-
          Right: this is the slide's statement of the liberal feminist solution, together with assessing individuals on
          their merits.
      - text: Rebuild the law around women's ethics of care rather than the male ethics of justice in every area
        why: >-
          This is the direction of difference feminism, which asks the law to recognise women's perspective and values,
          not liberal feminism.
      - text: Redress the domination of women as a class by men as a class, starting with pornography and sexuality
        why: >-
          This is the radical feminist programme; liberal feminism focuses on individuals and formal equality, not on
          classes.
      - text: Abandon grand theories and attend to each woman's position within intersecting axes of identity
        why: This is postmodern feminism, with its distrust of grand narratives and its concept of intersectionality.
  - key: b03
    type: mcq
    concept: four-feminisms
    difficulty: 2
    stem: Which criticism of liberal feminism appears on the 'male norm' slide?
    options:
      - text: It embraces differences between men and women and so reinforces stereotypes about women.
        why: >-
          This is the "contra" to difference feminism, not to liberal feminism; liberal feminism downplays differences
          in favour of equal treatment.
      - text: It implicitly assumes male experiences and perspectives as the norm or benchmark.
        correct: true
        why: >-
          Right: equal treatment needs a standard, and critics say liberal feminism implicitly used the male norm as the
          benchmark for women to meet.
      - text: It sees women only as victims of a male class that dominates them in every sphere.
        why: This worry is raised about radical feminism, which claims women as a class have no voice at all.
      - text: It distrusts grand narratives and so risks political paralysis for the women's movement.
        why: Political paralysis is the worry Naffine reports about postmodern feminism, not about liberal feminism.
  - key: b04
    type: mcq
    concept: four-feminisms
    difficulty: 2
    stem: >-
      Formal equality did not translate into substantive equality. Which example does the slide give of what formal
      equality failed to address?
    options:
      - text: Discrimination by the state against men in family law disputes
        why: >-
          The slide does not mention discrimination against men; its example is discrimination on grounds unique to
          women.
      - text: Discrimination on grounds unique to women, such as pregnancy
        correct: true
        why: >-
          Right: formal equality struggled to class discrimination on grounds unique to women, such as pregnancy, as
          discrimination at all, since men have no comparator.
      - text: Pornography as an institution of gender inequality
        why: >-
          This is MacKinnon's radical feminist claim on a later slide, not an example of what formal equality failed to
          address.
      - text: The silencing of Indigenous women by white feminism
        why: >-
          This is Moreton-Robinson's critique of white Australian feminism, which comes with critical race theory at the
          end of the lecture.
  - key: b05
    type: mcq
    concept: four-feminisms
    difficulty: 2
    stem: Difference feminism reacted against which idea?
    options:
      - text: A formal equality that forces women to assimilate to patriarchal structures
        correct: true
        why: >-
          Right: the slide says difference feminism reacted to a formal equality that forces women to act and behave
          like men.
      - text: A radical theory that women as a class have no voice and are only victims
        why: >-
          Radical feminism comes after difference feminism on the slides and in fact replies to it ("not so much a
          different voice … no voice at all").
      - text: A postmodern distrust of binaries such as male/female and reason/emotion in law
        why: >-
          Postmodern feminism comes later; difference feminism actually relies on a contrast between men and women that
          postmodernism would deconstruct.
      - text: A communitarian claim that identities form through shared practices
        why: This is the communitarian side of the debate in Lacey's chapter, not the target of difference feminism.
  - key: b06
    type: mcq
    concept: four-feminisms
    difficulty: 1
    stem: Which distinction does the slide attribute to Carol Gilligan?
    options:
      - text: Formal vs substantive equality
        why: >-
          This distinction appears in the critique of liberal feminism, not as Gilligan's contribution to difference
          feminism.
      - text: Direct vs indirect discrimination
        why: >-
          Direct vs indirect discrimination (treatment vs impact) is on the liberal feminism and male norm slide, not
          attributed to Gilligan.
      - text: Ethics of care vs ethics of justice
        correct: true
        why: >-
          Right: the difference feminism slide names Carol Gilligan for the contrast between an ethics of care and an
          ethics of justice.
      - text: Public vs private discrimination
        why: >-
          Public vs private discrimination is listed among the limits of liberal feminism; it is not attributed to
          Gilligan.
  - key: b07
    type: mcq
    concept: four-feminisms
    difficulty: 3
    stem: What is the 'contra' the slide raises against difference feminism?
    options:
      - text: It assumes male experiences as the benchmark for measuring equal treatment.
        why: This is the criticism of liberal feminism, which difference feminism was itself reacting against.
      - text: It can reinforce the stereotyped views that caused women's subordination.
        correct: true
        why: >-
          Right: by stressing differences, it risks the stereotypes about women that were the main cause of their social
          subordination and inequality.
      - text: It risks political paralysis because no feminist may speak for other women.
        why: >-
          This is the worry about postmodern feminism discussed by Naffine, not the slide's "contra" for difference
          feminism.
      - text: It ignores the law's role in maintaining the domination of women as a class.
        why: >-
          Domination of women as a class is the radical feminist framework; the slide's objection to difference feminism
          concerns stereotypes.
  - key: b08
    type: mcq
    concept: four-feminisms
    difficulty: 2
    stem: Which claim belongs to radical feminism as presented on the slide?
    options:
      - text: Women speak with a different voice, which the law should recognise and value.
        why: >-
          This is difference feminism. Radical feminism replies that women do not so much speak with a different voice:
          they have no voice at all.
      - text: Women do not so much speak with a different voice; they have no voice at all.
        correct: true
        why: >-
          Right: this is the slide's first radical feminist claim, attributed to MacKinnon, followed by the claim that
          women as a class are dominated by men as a class.
      - text: Women share an essence and common interests that law ought to protect.
        why: >-
          This is essentialism, the flaw postmodern feminism identifies; radical feminism speaks of classes, not of a
          female essence.
      - text: Women should be assessed on their individual merits, not as a group.
        why: >-
          Assessment on merits rather than group membership is the liberal feminist principle; radical feminism focuses
          on classes.
  - key: b09
    type: mcq
    concept: four-feminisms
    difficulty: 3
    stem: According to the lecture, the radical feminist focus on 'class' borrows from which analysis?
    options:
      - text: Liberal analysis of individual rights and autonomy
        why: >-
          Liberal analysis focuses on individuals; the shift to classes is exactly what separates radical from liberal
          feminism.
      - text: Communitarian analysis of shared traditions
        why: >-
          Communitarians stress traditions and social roles, but the lecture traces the concept of class to Marxist
          analysis.
      - text: Marxist analysis of society and power relations
        correct: true
        why: >-
          Right: the lecture says the concept of class clearly comes from Marxist analysis, translated into the context
          of sex and gender.
      - text: Postmodern analysis of unstable textual meaning
        why: Postmodernism informs postmodern feminism and CLS; the lecture links "class" to Marxism, not to postmodernism.
  - key: b10
    type: mcq
    concept: four-feminisms
    difficulty: 3
    stem: Which worry about radical feminism does the slide raise?
    options:
      - text: Does it see women only as victims, harming the cause by denying their agency?
        correct: true
        why: >-
          Right: the slide asks whether constantly claiming that women's autonomy and agency are overridden helps or
          harms the feminist cause.
      - text: Does it assume a male norm when it demands equal treatment for every woman?
        why: >-
          The male norm objection is aimed at liberal feminism; radical feminism does not demand equal treatment in that
          sense.
      - text: Does it reinforce stereotypes by celebrating women's different voice in law?
        why: This is the "contra" to difference feminism; radical feminism denies that women have a voice at all.
      - text: Does it split women into intersecting groups that cannot act together at all?
        why: Fragmentation and political paralysis are the worries about postmodern feminism, not radical feminism.
  - key: b11
    type: mcq
    concept: four-feminisms
    difficulty: 2
    stem: In postmodern feminism, what is 'essentialism'?
    options:
      - text: The flaw of generalising about women or assuming they share an essence
        correct: true
        why: >-
          Right: the slide defines essentialism as the flaw of generalising about women or assuming that women have an
          "essence" (and common interests).
      - text: The view that sex oppression is the most fundamental form of domination
        why: This is a radical feminist claim (MacKinnon's), not the definition of essentialism.
      - text: The claim that the law reflects, maintains and legitimises the patriarchy
        why: This is the general claim shared by feminist legal theorists despite their differences, not essentialism.
      - text: The method of naming and re-naming the injuries done to women in law
        why: >-
          Naming and re-naming injuries is one of the methods in Naffine's account of feminist legal theory, not
          essentialism.
  - key: b12
    type: mcq
    concept: four-feminisms
    difficulty: 2
    stem: What does intersectionality acknowledge, as defined on the postmodern feminism slide?
    options:
      - text: Men and women occupy separate spheres that meet only in the institution of the family.
        why: This is separate spheres ideology, which feminism challenges; it is not intersectionality.
      - text: Feminist theory, philosophy and legal theory intersect, so each is part of the next.
        why: >-
          The nesting of feminist legal theory in feminist philosophy and feminism is real, but it is not what
          intersectionality means.
      - text: Women belong to different races, cultures, religions and classes, and these axes intersect.
        correct: true
        why: 'Right: these multiple axes of identity intersect to create totally different kinds of gender subordination.'
      - text: Direct and indirect discrimination intersect, so formal equality yields substantive equality.
        why: >-
          The slides say the reverse: formal equality did not translate into substantive equality. Intersectionality is
          about identity.
  - key: b13
    type: mcq
    concept: four-feminisms
    difficulty: 3
    stem: Naffine raises two problems for postmodern feminism. Which is one of them?
    options:
      - text: If women are a class dominated by men as a class, how can any woman exercise agency?
        why: >-
          This is the worry about radical feminism (women only as victims), not one of the problems Naffine raises for
          postmodern feminism.
      - text: If feminists will not speak for women, how can women's situation be improved?
        correct: true
        why: >-
          Right: an emphasis on different subjectivities does not advance legal reform, and some feminists say all it
          leads to is political paralysis.
      - text: If equal treatment uses a male benchmark, how can formal equality become substantive?
        why: >-
          This is the male norm criticism of liberal feminism; Naffine's problems concern postmodern feminism's stress
          on difference.
      - text: If law adopts an ethics of care, how can it avoid reinforcing stereotypes about women?
        why: This is the "contra" to difference feminism, not one of Naffine's questions about postmodern feminism.
  - key: b14
    type: mcq
    concept: four-feminisms
    difficulty: 3
    contrasts-with:
      - critical-race-theory
    stem: A student says intersectionality belongs only to critical race theory. Which is the best response?
    options:
      - text: 'Correct: feminist theory treats women as one class, so intersectionality is unique to CRT.'
        why: >-
          Only radical feminism speaks of women as a class, and postmodern feminism expressly uses intersectionality, so
          it is not unique to CRT.
      - text: 'Wrong: intersectionality belongs only to liberal feminism, which assesses individuals on merit.'
        why: >-
          Liberal feminism assesses individuals on their merits, but intersectionality is a postmodern feminist and CRT
          concept, not a liberal one.
      - text: 'Correct: postmodern feminism rejects all categories of identity, including intersecting ones.'
        why: >-
          Postmodern feminism distrusts essentialism, but it uses intersectionality to show how axes of identity
          combine.
      - text: 'Wrong: postmodern feminism and CRT both use it to show how identities intersect.'
        correct: true
        why: >-
          Right: intersectionality is one of the two key concepts of postmodern feminism and a main theme of CRT, where
          race intersects with gender, class and more.
  - key: b15
    type: truefalse
    concept: four-feminisms
    difficulty: 1
    set: quickfire
    statement: Feminists tend to share interests and political commitments, but they do not share the same theoretical approach.
    answer: true
    why: >-
      True: this is the slide's point, and the reason the lecture asks you to identify the theoretical assumptions
      behind each feminist approach.
  - key: b16
    type: truefalse
    concept: four-feminisms
    difficulty: 2
    set: quickfire
    statement: According to the slide, most of the legal gains of the 1960s and 1970s used the radical feminist approach.
    answer: false
    why: >-
      False: most legal gains of the 60s and 70s used the liberal feminist approach, eg anti-discrimination legislation
      such as the Sex Discrimination Act 1984 (Cth).
  - key: b17
    type: truefalse
    concept: four-feminisms
    difficulty: 1
    set: quickfire
    statement: For radical feminism, oppression on the basis of sex is the most fundamental form of domination in society.
    answer: true
    why: >-
      True: the slide lists this among MacKinnon's radical feminist claims; the lecture notes that a Marxist analysis
      would not reach this conclusion.
  - key: b18
    type: truefalse
    concept: four-feminisms
    difficulty: 2
    set: quickfire
    statement: Postmodern feminism accepts grand theories and the binary oppositions male/female and reason/emotion.
    answer: false
    why: >-
      False: postmodern feminism distrusts grand theories and narratives and deconstructs binary oppositions such as
      male/female, reason/emotion and nature/culture.
  - key: b19
    type: short
    concept: four-feminisms
    difficulty: 3
    prompt: >-
      'Each feminist approach answers the weaknesses of the one before it, but creates new ones.' Discuss with reference
      to at least three of the four approaches.
    model: >-
      Largely true, which is why the approaches are best read as a conversation rather than a ranking. Argument: liberal
      feminism sought equal treatment by removing formal barriers, and most legal gains of the 1960s and 70s, such as
      the Sex Discrimination Act 1984 (Cth), used it. But formal equality did not become substantive equality, and it
      implicitly took the male norm as its benchmark. Difference feminism answered by valuing women's perspective, as in
      Gilligan's ethics of care, but risked reinforcing the stereotypes behind women's subordination. Radical feminism
      (MacKinnon) replaced difference with domination: women as a class have no voice at all; critics ask whether it
      sees women only as victims. Postmodern feminism rejected essentialism and stressed intersectionality, yet Naffine
      asks when we know enough, and who will speak for women, risking political paralysis. Counterargument: the sequence
      is not purely linear; liberal strategies still drive law reform, and radical analysis informs it. Evaluation:
      since these theories combine thought and action, the better test is not which approach is last, but which one best
      explains, and helps change, a particular legal problem.
    rubric:
      - id: r1
        criterion: Thesis — takes a position on whether the approaches form a sequence of answers and new problems.
        marks: 2
        top-band: States a qualified thesis (a conversation, not a ranking) in the opening sentence.
        margin-note: Agree, disagree, or qualify? Say so.
        authorities: []
      - id: r2
        criterion: Argument — sets out at least three approaches with the weakness each answers and creates.
        marks: 3
        top-band: >-
          Accurately links liberal (male norm), difference (stereotypes), radical (only victims) and postmodern
          (paralysis) feminism.
        margin-note: 'Clear chain of responses: good.'
        authorities:
          - sex-discrimination-act-1984-cth
      - id: r3
        criterion: Counterargument — tests the linear story against how the approaches are actually used.
        marks: 3
        top-band: >-
          Shows that earlier approaches remain in use (eg liberal strategies in law reform), so the sequence is not
          simple progress.
        margin-note: Is it really a straight line?
        authorities: []
      - id: r4
        criterion: Evaluation — offers a criterion for choosing between the approaches.
        marks: 2
        top-band: >-
          Uses the thought-and-action point: judge each approach by how well it explains and changes a particular legal
          problem.
        margin-note: 'A criterion, not just a summary: well done.'
        authorities: []
  - key: b20
    type: match
    concept: four-feminisms
    difficulty: 1
    prompt: Match each feminist approach with its key claim on the slides.
    pairs:
      - left: Liberal feminism
        right: The goal is equal treatment; remove formal barriers
      - left: Difference feminism
        right: Ethics of care vs ethics of justice (Gilligan)
      - left: Radical feminism
        right: Women as a class are dominated by men as a class
      - left: Postmodern feminism
        right: Essentialism and intersectionality
  - key: c01
    type: mcq
    concept: separate-spheres-and-the-personal-is-political
    difficulty: 1
    set: pretest
    stem: What does 'separate spheres' ideology assign, according to the slide?
    options:
      - text: A legal sphere for officials and a moral sphere for ordinary citizens
        why: >-
          Tempting because the lecture discusses officials and citizens in Hart, but separate spheres ideology divides
          the public and private spheres by sex.
      - text: A public sphere for men and a private sphere for women (and children)
        correct: true
        why: >-
          Right: this is the slide's definition. Bradley J's "respective spheres" in Bradwell v Illinois is the classic
          legal statement of it.
      - text: A national sphere for the sovereign and a local sphere for communities
        why: >-
          This sounds like a division of jurisdiction; the lecture notes the spheres can look like that, but the
          ideology assigns spheres to men and women.
      - text: A sphere of rights for individuals and a sphere of duties for families
        why: >-
          Rights and duties are not how the slide defines the ideology; it is about a public sphere for men and a
          private sphere for women and children.
  - key: c02
    type: mcq
    concept: separate-spheres-and-the-personal-is-political
    difficulty: 2
    stem: >-
      In Bradwell v Illinois, which sphere does Justice Bradley say 'properly belongs to the domain and functions of
      womanhood'?
    options:
      - text: The domestic sphere
        correct: true
        why: >-
          Right: Bradley J says the constitution of the family organisation "indicates the domestic sphere as that which
          properly belongs to the domain and functions of womanhood".
      - text: The sphere of civil life
        why: >-
          Bradley J says the opposite: the "timidity and delicacy" he attributes to women "unfits it for many of the
          occupations of civil life".
      - text: The sphere of public discourse
        why: >-
          Public discourse was, as the feminist project slide says, conducted exclusively by men; Bradley J assigns
          women to the domestic sphere.
      - text: The sphere of independent careers
        why: >-
          Bradley J says the family's harmony "is repugnant to the idea of a woman adopting a distinct and independent
          career from that of her husband".
  - key: c03
    type: mcq
    concept: separate-spheres-and-the-personal-is-political
    difficulty: 2
    stem: On what does Justice Bradley say 'the constitution of the family organization' is founded?
    options:
      - text: The will of the legislature, as well as the common law of the states
        why: >-
          Bradley J does not ground the family in legislation; he appeals to nature and divine ordinance, which is what
          makes the passage so revealing.
      - text: The divine ordinance, as well as the nature of things
        correct: true
        why: >-
          Right: he says the family organisation "is founded in the divine ordinance, as well as in the nature of
          things", and so indicates the domestic sphere for women.
      - text: A contract freely made between husband and wife as equals
        why: >-
          Bradley J describes a "harmony, not to say identity, of interests" in the family, not an agreement between
          equals.
      - text: The equal rights of men and women under the federal constitution
        why: >-
          The passage rejects equal positions: it says nature and the civil law recognise "a wide difference in the
          respective spheres and destinies of man and woman".
  - key: c04
    type: mcq
    concept: separate-spheres-and-the-personal-is-political
    difficulty: 2
    stem: What does the lecture say the 'respective spheres' distinction often mirrors?
    options:
      - text: The distinction between primary and secondary rules in Hart
        why: >-
          Hart's distinction between primary and secondary rules is about types of legal rules, not the spheres of men
          and women.
      - text: The distinction between the core and the penumbra
        why: Core and penumbra are Hart's terms for open texture in week 6, not what the separate spheres mirror.
      - text: The distinction between the private and the public sphere
        correct: true
        why: >-
          Right: the lecture says the respective spheres often (not always) mirror the distinction between the private
          sphere and the public sphere.
      - text: The distinction between law in books and law in action
        why: >-
          Law in books and law in action is the realist contrast the lecture uses for liberal feminism's limits, not for
          the separate spheres.
  - key: c05
    type: mcq
    concept: separate-spheres-and-the-personal-is-political
    difficulty: 1
    stem: Which slogan captures the feminist challenge to the public–private distinction?
    options:
      - text: '''The personal is the political'''
        correct: true
        why: >-
          Right: the slide sets out the challenge under "the personal is the political", followed by four claims about
          the private sphere.
      - text: '''The existence of law is one thing; its merit is another'''
        why: >-
          This is Austin's separation of law's existence from its merit, the positivist slogan from earlier weeks, not
          the feminist one.
      - text: '''A rule that ends with the word unless is still a rule'''
        why: >-
          This is Hart's reply to rule-sceptics in week 7, about defeasible rules, not about the public–private
          distinction.
      - text: '''Law is the law of a community for a community'''
        why: >-
          This is the lecture's summary of the community assumption that Lacey examines, not the feminist slogan about
          the spheres.
  - key: c06
    type: mcq
    concept: separate-spheres-and-the-personal-is-political
    difficulty: 2
    stem: Which is NOT one of the slide's claims under 'the personal is the political'?
    options:
      - text: Private inequality is the source of public disadvantage
        why: 'This is on the slide: inequality in the private sphere produces disadvantage in the public sphere.'
      - text: The politics of power permeates the private sphere
        why: 'This is on the slide: power is not confined to the public sphere but runs through private life too.'
      - text: Private matters should be kept beyond the reach of law
        correct: true
        why: >-
          Right: this is the separate spheres view that the slogan attacks; the slide says private problems are a matter
          of systemic injustice.
      - text: The family is a political institution
        why: >-
          This is on the slide, and the lecture links it back to Bradley J's use of the family to justify the domestic
          sphere.
  - key: c07
    type: mcq
    concept: separate-spheres-and-the-personal-is-political
    difficulty: 3
    stem: What does the lecture say about whether the public–private distinction is itself bad?
    options:
      - text: It is not necessarily negative (we value privacy); the spheres can be distinguished without being separate.
        correct: true
        why: >-
          Right: the lecture says we all value our privacy, and the feminist challenge is to the separation of the
          spheres, not to the possibility of distinguishing them.
      - text: It is always negative and should be abolished entirely, because the family is itself a political institution.
        why: >-
          Too strong: the lecture expressly says the distinction is not necessarily negative and will matter again in
          later weeks on rights.
      - text: It is a natural distinction that the law merely recognises, as Justice Bradley said in Bradwell.
        why: >-
          This is Bradley J's view, which feminism contests: the feminist project denies that patriarchal arrangements
          are good, natural and inevitable.
      - text: It matters only to liberal feminism and has no place in later discussions of rights or liberalism.
        why: >-
          The lecture says the distinction is important in general and will return when the unit discusses rights and
          liberalism.
  - key: c08
    type: mcq
    concept: separate-spheres-and-the-personal-is-political
    difficulty: 3
    stem: >-
      'The problems faced by women in the private sphere are a matter of systemic injustice.' Why does the lecture call
      this an important challenge?
    options:
      - text: Private problems were traditionally dealt with by the criminal law alone
        why: >-
          The lecture says nothing of this kind; the point is that claims about justice were confined to the public
          sphere.
      - text: Claims about justice were traditionally confined to the public sphere
        correct: true
        why: >-
          Right: the lecture says a number of claims about justice were traditionally confined to the public sphere, so
          calling private problems unjust extends justice inward.
      - text: The private sphere had no legal rules of any kind until the 1960s
        why: >-
          The law did regulate the family (Bradwell itself shows legal views of it); the slide says the law incorporated
          the distinction.
      - text: Systemic injustice can only be found in public institutions of state
        why: >-
          This is precisely what the slogan denies: the family is a political institution, and power permeates the
          private sphere.
  - key: c09
    type: mcq
    concept: separate-spheres-and-the-personal-is-political
    difficulty: 2
    stem: Which of these is a 'practical achievement' listed on the Week 8 slide?
    options:
      - text: The defence of provocation has been abolished everywhere
        why: >-
          The slide says the defence of provocation has been "tightened up in various jurisdictions", not abolished
          everywhere.
      - text: The marital rape exception has been removed
        correct: true
        why: >-
          Right: the slide lists the removal of the marital rape exception among the practical achievements of the
          feminist project.
      - text: Consent is now presumed unless it is clearly refused
        why: 'The NSW reforms say the opposite: consent is a free and voluntary agreement that should not be presumed.'
      - text: Pornography has been banned as an institution of inequality
        why: >-
          MacKinnon and Dworkin drafted a model civil rights ordinance offering civil recourse; the slide does not say
          pornography was banned.
  - key: c10
    type: mcq
    concept: separate-spheres-and-the-personal-is-political
    difficulty: 2
    stem: The Crimes Legislation Amendment (Sexual Consent Reforms) Act 2021 (NSW) aims to clarify that consent is…
    options:
      - text: presumed between spouses unless one of them expressly withdraws it before the act
        why: This would revive the logic of the marital rape exception, which the slide says has been removed.
      - text: established once and for all at the start, so later communication between the parties is irrelevant
        why: >-
          The slide says the reforms clarify that consent involves ongoing and mutual communication, so later
          communication matters.
      - text: a free and voluntary agreement that should not be presumed, with ongoing and mutual communication
        correct: true
        why: >-
          Right: these are the two aims the slide gives for the NSW reforms to the consent provisions of the Crimes Act
          1900.
      - text: a private matter that the criminal law should not regulate in any detail at all
        why: >-
          This restates the separate spheres view; the reforms bring consent into detailed legal regulation, as "the
          personal is the political" demands.
  - key: c11
    type: mcq
    concept: separate-spheres-and-the-personal-is-political
    difficulty: 2
    stem: >-
      Which example on Naffine's list of law's failures of impartiality concerns the state's reluctance to act in the
      private sphere?
    options:
      - text: The historical reluctance to intervene in domestic violence
        correct: true
        why: >-
          Right: reluctance to intervene in domestic violence treated violence in the home as private, exactly what "the
          personal is the political" challenges.
      - text: The goal of equal treatment in employment and in housing
        why: >-
          Equal treatment in employment and housing is the liberal feminist goal, not an example of law failing to be
          impartial.
      - text: The prohibition of direct discrimination in goods and services
        why: >-
          This describes anti-discrimination legislation, a legal gain, not an example of law upholding patriarchal
          institutions.
      - text: The assessment of individuals on their merits, not their group
        why: >-
          This is the liberal feminist principle; the slide's examples of partiality are sexual assault law,
          provocation, marital rape and domestic violence.
  - key: c12
    type: mcq
    concept: separate-spheres-and-the-personal-is-political
    difficulty: 3
    contrasts-with:
      - four-feminisms
    stem: >-
      Which statement best distinguishes the liberal feminist response to separate spheres from 'the personal is the
      political'?
    options:
      - text: Liberal feminism abolishes the private sphere; the slogan defends the privacy of the family against the state.
        why: >-
          This reverses both: liberal feminism targets formal barriers in public life, and the slogan says the family is
          a political institution.
      - text: >-
          Liberal feminism removes formal barriers to public life; the slogan says power and injustice reach into
          private life.
        correct: true
        why: >-
          Right: liberal feminism seeks equal participation in social, economic and political life, while the slogan
          challenges the separation of the spheres itself.
      - text: >-
          Liberal feminism celebrates women's domestic role; the slogan demands equal treatment in employment and
          housing.
        why: >-
          Celebrating difference is closer to difference feminism, and equal treatment in employment and housing is the
          liberal goal, not the slogan.
      - text: >-
          Liberal feminism and the slogan say exactly the same thing: that women should be assessed on their merits in
          public life.
        why: >-
          Assessment on merits is liberal; the slogan adds that private inequality, power and injustice must also be
          addressed.
  - key: c13
    type: mcq
    concept: separate-spheres-and-the-personal-is-political
    difficulty: 2
    variant-of: c09
    stem: Which is listed on the slide as a practical achievement of the feminist project?
    options:
      - text: The marital rape exception has been extended to de facto relationships
        why: The slide says the marital rape exception has been removed, not extended to other relationships.
      - text: Sexual harassment was removed from the list of recognised legal wrongs
        why: >-
          Sexual harassment is a new legal category created through feminist methods (Naffine's naming and recognition),
          not one that was removed.
      - text: The defence of provocation has been tightened up in various jurisdictions
        correct: true
        why: >-
          Right: the slide lists the tightening of the provocation defence in various jurisdictions as a practical
          achievement.
      - text: Domestic violence is now officially treated as a private family matter
        why: >-
          The historical reluctance to intervene in domestic violence is one of the slide's examples of law's
          partiality, not an achievement.
  - key: c14
    type: mcq
    concept: separate-spheres-and-the-personal-is-political
    difficulty: 3
    stem: Why does the lecture link the family to separate spheres ideology?
    options:
      - text: >-
          Bradley J grounds women's domestic sphere in the family, so how we envisage the family shapes how society is
          organised.
        correct: true
        why: >-
          Right: the lecture notes the back-and-forth between how people envisage the family and how they organise
          society; hence "the family is a political institution".
      - text: >-
          Austin's sovereign is the head of each family, so the family is the source of every positive law in the
          political community.
        why: >-
          Austin's sovereign is a person or body habitually obeyed by the bulk of an independent political society, not
          the head of a family.
      - text: >-
          Hart's rule of recognition is first practised within families before it is accepted by the officials of the
          system.
        why: >-
          Hart's rule of recognition is accepted by officials; the lecture's family point is about separate spheres, not
          about recognition.
      - text: Finnis's common good belongs only to families and not to the wider political community or the state.
        why: >-
          Finnis's central case of law promotes the common good of a community; the lecture's family point comes from
          Bradwell.
  - key: c15
    type: mcq
    concept: separate-spheres-and-the-personal-is-political
    difficulty: 4
    stem: >-
      A state legislates that consent is a free and voluntary agreement, is not to be presumed, and involves ongoing and
      mutual communication. Which feminist point does the reform best reflect?
    options:
      - text: Women should be treated differently from men because they occupy a separate domestic sphere.
        why: >-
          This is separate spheres ideology itself, the view the feminist challenge rejects; the reform does not assign
          spheres.
      - text: Law is radically indeterminate, so legislative reform cannot change what judges actually decide.
        why: >-
          Radical indeterminacy is a CLS claim; the lecture counts these reforms as real practical achievements of
          feminist theory.
      - text: Law must remain neutral between the public and the private spheres and so must not take sides.
        why: >-
          Feminist legal theory challenges claims of neutrality; the reform takes the side of those harmed in the
          private sphere.
      - text: Harms once treated as private can be named and recognised by law as systemic injustice.
        correct: true
        why: >-
          Right: the reform brings conduct in intimate life under legal regulation, reflecting "the personal is the
          political" and the legal recognition of injuries.
  - key: c16
    type: truefalse
    concept: separate-spheres-and-the-personal-is-political
    difficulty: 1
    set: quickfire
    statement: The slide says the law has incorporated the public–private distinction.
    answer: true
    why: >-
      True: the slide says so, and feminists challenge this distinction under the slogan "the personal is the
      political".
  - key: c17
    type: truefalse
    concept: separate-spheres-and-the-personal-is-political
    difficulty: 2
    set: quickfire
    statement: >-
      In Bradwell v Illinois, Justice Bradley said the civil law and nature recognise no real difference between the
      spheres of man and woman.
    answer: false
    why: >-
      False: he said the civil law, "as well as nature herself", has always recognised "a wide difference in the
      respective spheres and destinies of man and woman".
  - key: c18
    type: truefalse
    concept: separate-spheres-and-the-personal-is-political
    difficulty: 1
    set: quickfire
    statement: Under 'the personal is the political', private inequality is the source of public disadvantage.
    answer: true
    why: >-
      True: this is the first of the four claims on the slide, alongside power in the private sphere, systemic injustice
      and the family as a political institution.
  - key: c19
    type: short
    concept: separate-spheres-and-the-personal-is-political
    difficulty: 3
    prompt: '''The public–private distinction is a tool of patriarchy and should be abandoned.'' Discuss.'
    model: >-
      The distinction should be reworked, not abandoned: the spheres can be distinguished without being separate.
      Argument: separate spheres ideology assigned the public sphere to men and the private sphere to women and
      children. In Bradwell v Illinois, Justice Bradley grounded "the domestic sphere" as "the domain and functions of
      womanhood" in nature and "the divine ordinance". The law incorporated the distinction, and claims about justice
      were confined to the public sphere. "The personal is the political" shows why this matters: private inequality is
      the source of public disadvantage, power permeates the private sphere, women's private problems are systemic
      injustice, and the family is a political institution. The removal of the marital rape exception and the NSW
      consent reforms of 2021 show the payoff. Counterargument: the lecture notes that we all value our privacy, and the
      distinction will matter again when the unit turns to rights and liberalism; abandoning it could license intrusion.
      Evaluation: the feminist target is the separation of the spheres, and the use of "private" to shield injustice,
      not the possibility of drawing a line. The better conclusion is to redraw the line where power operates.
    rubric:
      - id: r1
        criterion: Thesis — takes a position on abandoning versus reworking the distinction.
        marks: 2
        top-band: 'States a precise thesis: distinguish the spheres without separating them.'
        margin-note: Abandon, or redraw? Be exact.
        authorities: []
      - id: r2
        criterion: Argument — uses Bradwell and the four claims of 'the personal is the political' accurately.
        marks: 3
        top-band: >-
          Quotes Bradley J's domestic sphere and connects each of the four claims to a legal example (marital rape,
          consent reforms).
        margin-note: Good use of Bradwell.
        authorities:
          - crimes-legislation-amendment-sexual-consent-reforms-act-2021-nsw
      - id: r3
        criterion: Counterargument — gives the value of privacy its full weight.
        marks: 3
        top-band: Explains why privacy matters (and will matter for rights) before answering, rather than dismissing it.
        margin-note: 'Charity: privacy is a real value.'
        authorities: []
      - id: r4
        criterion: Evaluation — locates the real target and draws a conclusion for law.
        marks: 2
        top-band: >-
          Concludes that the target is separation and the shielding of injustice, and says where the line should be
          redrawn.
        margin-note: Clear landing.
        authorities: []
  - key: c20
    type: match
    concept: separate-spheres-and-the-personal-is-political
    difficulty: 2
    prompt: Match each statement with the idea it expresses.
    pairs:
      - left: '"The domestic sphere … belongs to the domain and functions of womanhood"'
        right: Separate spheres ideology (Bradwell v Illinois)
      - left: '"The family is a political institution"'
        right: The personal is the political
      - left: Consent "should not be presumed"
        right: The NSW sexual consent reforms (2021)
      - left: Remove all formal barriers to equal participation
        right: Liberal feminism
  - key: d01
    type: mcq
    concept: naffine-in-praise-of-legal-feminism
    difficulty: 1
    set: pretest
    stem: What does Naffine call the position of feminist legal theorists?
    options:
      - text: The 'puzzled man'
        why: >-
          The puzzled man is Hart's figure, contrasted with Holmes's bad man; Naffine's term for feminist legal
          theorists is the outsider within.
      - text: The 'outsider within'
        correct: true
        why: >-
          Right: Naffine says feminist legal theorists are "neither stranger nor native"; they are the outsider within
          (p 77).
      - text: The 'bad man'
        why: The bad man is Holmes's figure from week 6, who cares only about the consequences of breaking rules.
      - text: Dworkin's 'Hercules' judge
        why: Hercules is Dworkin's ideal judge from week 5, not Naffine's description of feminist legal theorists.
  - key: d02
    type: mcq
    concept: naffine-in-praise-of-legal-feminism
    difficulty: 2
    stem: Besides 'feminist scholarship and the legal academy', which part of Naffine's article does the lecture focus on?
    options:
      - text: Female agency
        why: >-
          Female agency is the second part of the article; the lecture says it will focus on the first and the last
          parts.
      - text: The female legal actor/subject
        why: This is the third part of the article; the lecture focuses on the first part (aims and methods) and the last.
      - text: Aims and methods of the feminist undertaking in law
        correct: true
        why: >-
          Right: the lecture focuses on the first part (aims and methods) and the last (feminist scholarship and the
          legal academy).
      - text: Feminist critiques of public international law and human rights
        why: This is not one of the four parts of Naffine's article as listed on the slide.
  - key: d03
    type: mcq
    concept: naffine-in-praise-of-legal-feminism
    difficulty: 2
    stem: According to the slide, what do feminist legal theorists investigate and challenge?
    options:
      - text: The ways law is not impartial and objective, and, when it appears impartial, is not applied equally
        correct: true
        why: >-
          Right: this is the slide's statement of the aim, adding that law thereby upholds patriarchal institutions and
          participates in the systematic oppression of women.
      - text: The ways law fails to meet Fuller's eight principles of legality in making and applying rules
        why: >-
          Fuller's principles are procedural values that help law present itself as impartial; feminist theory
          challenges that presentation, not compliance with them.
      - text: The ways judges depart from the plain meaning of statutes to reach the outcomes they prefer
        why: >-
          Plain meaning and judicial departure from it were week 7 topics (Keen J, Holy Trinity); they are not the aim
          Naffine describes.
      - text: The ways the sovereign's commands fail to secure the habitual obedience of the bulk of the society concerned
        why: Habitual obedience is Austin's test for a sovereign; the feminist aim is to expose law's lack of impartiality.
  - key: d04
    type: mcq
    concept: naffine-in-praise-of-legal-feminism
    difficulty: 1
    stem: Which of these is NOT one of the slide's examples of law upholding patriarchal institutions?
    options:
      - text: Sexual assault law
        why: This is on the slide, the first of its examples of ways the law is not impartial and objective.
      - text: The marital rape exception
        why: This is on the slide, and its removal is later listed as a practical achievement of the feminist project.
      - text: The rule against hearsay evidence
        correct: true
        why: >-
          Right: the hearsay rule is not mentioned; the slide's examples are sexual assault law, provocation, the
          marital rape exception and domestic violence.
      - text: The criminal defence of provocation
        why: This is on the slide, and the tightening of the defence is later listed as a practical achievement.
  - key: d05
    type: mcq
    concept: naffine-in-praise-of-legal-feminism
    difficulty: 2
    stem: Which methods of the feminist undertaking in law appear on the slide?
    options:
      - text: >-
          Conceptual analysis, definition per genus et differentiam, and the search for necessary and sufficient
          conditions
        why: >-
          These are the analytical methods of week 1; the slide lists consciousness raising, naming and re-naming
          injuries, and legal recognition.
      - text: >-
          Consciousness raising, naming and re-naming injuries done to women, and the legal recognition of those
          injuries
        correct: true
        why: >-
          Right: these are the methods on the slide, which the lecture says show the connection between theory and
          practice.
      - text: Prediction of what courts will do in fact, and empirical study of the causes of judicial behaviour
        why: >-
          These belong to legal realism (Holmes's prediction theory, Leiter's naturalism), not to Naffine's account of
          feminist methods.
      - text: Deconstruction of legal texts to reveal radical indeterminacy, with no proposals for legal reform
        why: Feminist methods are tied to legal reform and recognition of injuries; radical indeterminacy is a CLS theme.
  - key: d06
    type: mcq
    concept: naffine-in-praise-of-legal-feminism
    difficulty: 1
    stem: Which new expressions or legal categories does the slide credit to feminist methods?
    options:
      - text: Negligence, nuisance and defamation in tort
        why: >-
          These are long-standing torts, not the new expressions the slide attributes to feminist naming and recognition
          of injuries.
      - text: Sexual harassment, date rape, domestic violence
        correct: true
        why: >-
          Right: the slide gives these as new expressions and legal categories, terms that a few decades ago people did
          not even have.
      - text: Sovereignty, recognition and statehood in international law
        why: These are concepts from public international law, not the categories the slide credits to feminist methods.
      - text: Duty, standard of care and causation
        why: >-
          These are the elements of negligence, not new categories produced by feminist naming and recognition of
          injuries.
  - key: d07
    type: mcq
    concept: naffine-in-praise-of-legal-feminism
    difficulty: 3
    stem: Why, on the lecture's account, would Kelsen not use consciousness raising?
    options:
      - text: His pure theory studies law as autonomous, free of insights from other disciplines.
        correct: true
        why: >-
          Right: the lecture contrasts Naffine's generous methodology with Kelsen's pure theory, meant to be
          uncontaminated by other disciplines.
      - text: His basic norm requires every legal norm to be validated by a decision of a court.
        why: >-
          The basic norm is presupposed, not validated by courts; the lecture's point concerns Kelsen's methodological
          purity.
      - text: He held that legal systems exist only where officials accept the rule of recognition.
        why: >-
          The rule of recognition and officials' acceptance are Hart's ideas, not Kelsen's, and they do not explain the
          contrast.
      - text: He thought unjust laws are not laws, so injuries done by them need never be named.
        why: Kelsen is a positivist who separates law from morality; "unjust law is not law" is a natural law slogan.
  - key: d08
    type: mcq
    concept: naffine-in-praise-of-legal-feminism
    difficulty: 2
    stem: What does Naffine mean by the 'epistemic privilege of marginality'?
    options:
      - text: Those at the margins are always right about what the law requires
        why: >-
          Too strong: the privilege is a particular perspective on law's deficiencies, not infallibility about the law's
          content.
      - text: Those at the margins have a particular perspective on the deficiencies of law
        correct: true
        why: >-
          Right: the slide glosses it as a "particular perspective on the deficiencies of law", available to the
          outsider within.
      - text: Marginal cases of law matter more to legal theory than central cases
        why: >-
          The lecture links the idea to central and peripheral cases, but it does not say peripheral cases matter more;
          it values seeing both.
      - text: Only officials at the centre of the legal system can truly know what the law is
        why: 'This reverses the idea: Naffine finds an epistemic advantage at the margin, not only at the centre.'
  - key: d09
    type: mcq
    concept: naffine-in-praise-of-legal-feminism
    difficulty: 3
    stem: How does the lecture connect the outsider within to the earlier weeks' central and peripheral cases?
    options:
      - text: Hart and Finnis used the central case to exclude marginalised groups from the concept of law.
        why: >-
          The lecture does not accuse Hart or Finnis of this; it uses the central/peripheral idea to show the value of
          seeing several perspectives.
      - text: The outsider within always occupies the central case, so peripheral views can safely be ignored by theory.
        why: >-
          The outsider within stands between centre and margin; the lecture says the point is to see both perspectives
          and their connection.
      - text: Seeing the centre and the periphery, and how they connect, gives a deeper understanding of a practice.
        correct: true
        why: >-
          Right: the perspectives of those always winning and always losing the game, and the connection between them,
          deepen our understanding of law.
      - text: Central cases are descriptive and peripheral cases normative, so the two can never be connected.
        why: >-
          The lecture stresses the connection between centre and periphery; it does not map them onto description and
          evaluation.
  - key: d10
    type: mcq
    concept: naffine-in-praise-of-legal-feminism
    difficulty: 2
    stem: What does Naffine's 'generous methodology' involve?
    options:
      - text: Openness to other bodies of knowledge and to revision
        correct: true
        why: >-
          Right: the slide says the methodology is receptive of other bodies of knowledge and open to revision, two
          distinct points the lecture stresses.
      - text: Charitable reading of opponents so that their views appear in the strongest form
        why: >-
          Charity is one of the unit's three values (curiosity, charity, clarity), but it is not what Naffine's generous
          methodology means.
      - text: Strict limits on what counts as acceptable evidence for a legal inquiry
        why: >-
          This describes the strict methodologies the lecture contrasts with feminist scholarship, such as Kelsen's pure
          theory.
      - text: Generosity towards female accused when criminal defences are applied
        why: Naffine's generosity concerns epistemology and method, not the substantive treatment of accused persons.
  - key: d11
    type: mcq
    concept: naffine-in-praise-of-legal-feminism
    difficulty: 2
    stem: Naffine contrasts the 'epistemology of largess' with what?
    options:
      - text: The jurisprudence of suspicion
        why: This phrase does not appear in the materials; Naffine's contrast is with "the jurisprudence of orthodoxy".
      - text: The epistemology of ignorance
        why: >-
          This phrase does not appear in the materials; the slide contrasts largess with "the jurisprudence of
          orthodoxy".
      - text: The jurisprudence of orthodoxy
        correct: true
        why: >-
          Right: Naffine sets the epistemology of largess against "the jurisprudence of orthodoxy", her name for the
          more traditional approach to legal theory.
      - text: The morality of aspiration
        why: The morality of aspiration is Fuller's, contrasted with the morality of duty; it is not Naffine's contrast.
  - key: d12
    type: mcq
    concept: naffine-in-praise-of-legal-feminism
    difficulty: 3
    stem: Which quotation from Naffine (p 81) expresses the epistemology of largess?
    options:
      - text: '''…the prophecies of what the courts will do in fact, and nothing more pretentious'''
        why: >-
          This is Holmes in 'The Path of the Law', defining law as prediction; it is not Naffine's epistemology of
          largess.
      - text: '''…a willingness to concede that new points of view might be better than well-used ones'''
        correct: true
        why: >-
          Right: Naffine continues that "one's view is necessarily limited, partial, and so consistently in need of
          revision".
      - text: '''…the existence of law is one thing; its merit or demerit is another'''
        why: This is Austin's statement of the separation of law and morals, the positivist slogan from earlier weeks.
      - text: '''…a rule that ends with the word unless is still a rule'''
        why: This is Hart (CL 139) on defeasible rules from week 7, not Naffine on feminist epistemology.
  - key: d13
    type: mcq
    concept: naffine-in-praise-of-legal-feminism
    difficulty: 4
    stem: >-
      A legal theorist trained in the analytical canon, but from a group long excluded from it, argues that her position
      lets her see law's deficiencies. Which concepts best describe this?
    options:
      - text: The bad man and the prediction theory of law
        why: >-
          Holmes's bad man views law only as a prediction of consequences; he is not someone placed to see law's
          deficiencies from the margin.
      - text: The internal point of view and the rule of recognition
        why: >-
          These are Hart's concepts for participants and officials; they do not capture the double position of the
          outsider within.
      - text: The outsider within and the epistemic privilege of marginality
        correct: true
        why: >-
          Right: she is inside the canon yet partly outside it, and for Naffine that marginal position gives a
          particular perspective on law's deficiencies.
      - text: Hercules and the one right answer thesis
        why: >-
          Dworkin's Hercules is an ideal judge with superhuman skill; the scenario concerns a theorist's marginal
          standpoint, not adjudication.
  - key: d14
    type: mcq
    concept: naffine-in-praise-of-legal-feminism
    difficulty: 3
    stem: The lecture warns against simply memorising the feminist methods. What should you do instead?
    options:
      - text: List them in the order Naffine gives, since that order shows their relative importance
        why: The lecture does not rank the methods; it asks why they are used and why other theories do not use them.
      - text: Ask why these methods are used and why they are absent from other theories of law
        correct: true
        why: >-
          Right: the lecture says stop and think about what it means to have these methods, and why, for example, Kelsen
          does not use consciousness raising.
      - text: Treat them as empirical claims to be tested against a sample of judicial decisions
        why: >-
          Testing claims against decisions is closer to realist method; the lecture asks a methodological question about
          why the methods are used.
      - text: Replace them with conceptual analysis, which the lecture says is the unit's preferred method
        why: >-
          The lecture does not prefer conceptual analysis here; it asks you to compare methodologies and their
          assumptions.
  - key: d15
    type: mcq
    concept: naffine-in-praise-of-legal-feminism
    difficulty: 2
    variant-of: d06
    stem: >-
      A term that did not exist a few decades ago now names an injury and grounds a legal claim. Which feminist method
      is at work?
    options:
      - text: Assessing individuals on their merits rather than on group membership
        why: Assessment on merits is the liberal feminist principle of equal treatment, not a method of naming injuries.
      - text: Deconstructing the binary oppositions of reason and emotion
        why: >-
          Deconstructing binaries belongs to postmodern feminism; the scenario describes naming an injury and its legal
          recognition.
      - text: Naming and re-naming injuries done to women, and their legal recognition
        correct: true
        why: >-
