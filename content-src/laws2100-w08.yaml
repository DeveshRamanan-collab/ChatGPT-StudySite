      - text: Law's neutrality and objectivity
        why: This is on the list, and it connects to the slide on the impartiality of laws and judicial reasoning.
      - text: Law's centrality
        why: >-
          This is on the list: conventional scholarship assumes law's centrality, which the feminist challenge
          questions.
  - key: e05
    type: mcq
    concept: lacey-impartiality-and-community
    difficulty: 2
    stem: In chapter 5 of Unspeakable Subjects, what does Lacey call 'community'?
    options:
