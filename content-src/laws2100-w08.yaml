  - key: e19
    type: short
    concept: lacey-impartiality-and-community
    difficulty: 3
    prompt: >-
      'Every theory of law studied in this unit assumes a community, and that assumption is not neutral.' Discuss with
      reference to Lacey.
    model: >-
      True, and Lacey shows why it matters. Argument: Lacey treats community as "one particular discursive figure in
      contemporary Anglo-American legal theory" (p 128) and assesses the rhetorical function of appeals to it. The
      lecture shows the assumption runs through the canon: Austin identifies the sovereign by the habit of obedience in
      an independent political society; Hart's legal system needs officials and citizens, with the modern state as its
      central case; Finnis's central case of law promotes the common good of a community; Dworkin's integrity rests on a
      community's political morality. The liberal–communitarian debate frames what is at stake: autonomous agents with
      rights, or selves shaped by traditions and shared practices. Counterargument: a positivist may answer that
      "community" is just a neutral label for the population over which a legal system operates, carrying no evaluation.
      Evaluation: but the feminist challenge to law's neutrality, unity and coherence suggests that whoever defines the
      community defines whose perspective counts. The assumption need not be fatal to these theories, yet it is not
      neutral, and it should be argued for rather than presupposed.
    rubric:
      - id: r1
        criterion: Thesis — takes a position on whether the community assumption is neutral.
        marks: 2
        top-band: 'Answers both limbs in the first sentence: the assumption is pervasive and not neutral.'
        margin-note: 'Two claims in the prompt: answer both.'
        authorities: []
      - id: r2
        criterion: Argument — traces the assumption through at least three theories and uses Lacey accurately.
        marks: 3
        top-band: Accurately links Austin, Hart, Finnis and Dworkin to their communities and quotes Lacey's 'discursive figure'.
        margin-note: Excellent range across the unit.
        authorities:
          - lacey-unspeakable-subjects
          - austin-province-of-jurisprudence-determined
      - id: r3
        criterion: Counterargument — states the positivist 'neutral label' reply fairly.
        marks: 3
        top-band: Gives the reply real force before answering it with the feminist challenge to neutrality.
        margin-note: Fair statement of the reply.
        authorities: []
      - id: r4
        criterion: Evaluation — says what follows for theories of law.
        marks: 2
        top-band: 'Concludes proportionately: not fatal, but an assumption that must be argued for.'
        margin-note: 'Proportionate conclusion: good.'
        authorities: []
