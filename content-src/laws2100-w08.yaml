  - key: e07
    type: mcq
    concept: lacey-impartiality-and-community
    difficulty: 2
    stem: In the liberal–communitarian debate, which view is the communitarian one?
    options:
      - text: Individuals are autonomous agents whose rights take priority over cultural contexts.
        why: 'This is the liberal side: individual rights, personal autonomy and universal norms over particular contexts.'
      - text: Individuals are socially embedded beings shaped by communal ties and traditions.
        correct: true
        why: >-
          Right: communitarians say individuals are not isolated decision-makers but are deeply influenced by their
          communities, traditions and social roles.
      - text: Universal norms and abstract principles take priority over history and culture.
        why: >-
          Prioritising universal norms over particular cultural or historical contexts is what the slide attributes to
          liberal theorists.
      - text: Justice has primacy, and the self comes before any community it chooses to join.
        why: The primacy of justice and an independent self belong to the liberal side, which communitarians criticise.
  - key: e08
    type: mcq
    concept: lacey-impartiality-and-community
    difficulty: 2
    stem: According to the slide, communitarians say liberalism overlooks what?
    options:
      - text: The importance of individual rights and personal autonomy for justice
        why: >-
          Liberals emphasise rights and autonomy; the communitarian complaint is that liberalism neglects how identities
          are formed.
      - text: The universal norms that apply regardless of culture or history
        why: >-
          Universal norms are what liberals prioritise; communitarians criticise liberalism for neglecting particular
          communities.
      - text: How identities are formed through shared practices and narratives
        correct: true
        why: >-
          Right: from the communitarian perspective, liberalism overlooks the way identities are formed through shared
          practices and narratives.
      - text: How courts decide hard cases by weighing the principles of integrity
        why: >-
          Weighing principles in hard cases is Dworkin's theory of adjudication, not the communitarian charge against
          liberalism.
  - key: e09
    type: mcq
    concept: lacey-impartiality-and-community
    difficulty: 3
    stem: Why does the lecture say Lacey's focus on community matters for the theories studied earlier?
    options:
