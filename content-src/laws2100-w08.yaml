      without being separate; claims about justice were traditionally confined to the public sphere.


      Practical achievements followed: the defence of provocation tightened in various jurisdictions; the marital rape
      exception removed; the NSW sexual consent reforms of 2021 (consent is a free and voluntary agreement that should
      not be presumed, and involves ongoing and mutual communication).


      Exam use: distinguish "the spheres can be distinguished" from "the spheres are separate".
  - slug: naffine-in-praise-of-legal-feminism
    title: 'Naffine: the aims, methods and epistemology of legal feminism'
    visual: explainer
    visual-brief: >-
      A scroll in four beats: law's claim to impartiality shown as a level scale that tips when sexual assault law,
      provocation, the marital rape exception and domestic violence are placed on it; then the methods as a sequence
      (consciousness raising → naming an injury → legal recognition → a new category); then the outsider within standing
      on the boundary line of the legal system; finally largess (an open, revisable frame) set against orthodoxy (a
      closed one).
    related:
      - four-feminisms
      - laws2100-w04-finnis-central-case-method
    depends-on:
      - outsider-jurisprudence
      - laws2100-w03-kelsen-pure-theory
    contrasts-with:
      - lacey-impartiality-and-community
    cases: []
    authorities:
      - naffine-in-praise-of-legal-feminism
    verify: false
    body: >-
      Ngaire Naffine (Professor Emerita, Adelaide), 'In Praise of Legal Feminism' (2002): a "reflective appreciation of
      feminist legal theory" in four parts: aims and methods; female agency; the female legal actor/subject; feminist
      scholarship and the legal academy.


      **Aims**: investigate and challenge the ways the law is not impartial and objective (and, when it appears
      impartial, is not applied equally), upholding patriarchal institutions and participating in the systematic
      oppression of women. Examples: sexual assault law, the defence of provocation, the marital rape exception, the
      historical reluctance to intervene in domestic violence.


      **Methods** (theory and practice): consciousness raising; the naming and re-naming of the injuries done to women;
      the legal recognition of those injuries. Results: new expressions and legal categories ('sexual harassment', 'date
      rape', 'domestic violence').


      **Epistemology**: feminist legal theorists are "neither stranger nor native"; they are the 'outsider within' (p
      77). Naffine discusses the "epistemic privilege of marginality", a particular perspective on the deficiencies of
      law. The methodology is generous: receptive of other bodies of knowledge and open to revision. An epistemology of
      largess, versus "the jurisprudence of orthodoxy": "a willingness to concede that new points of view might be
      better than well-used ones; that one's view is necessarily limited, partial, and so consistently in need of
      revision" (p 81).


      The lecture: contrast Kelsen's pure theory, which keeps law free of other disciplines. Ask why Kelsen does not use
      consciousness raising.


      Exam use: explain why a method is used, rather than listing the methods.
  - slug: lacey-impartiality-and-community
    title: 'Lacey: the challenge to conventional legal scholarship and the idea of community'
    visual: diagram
    visual-brief: >-
      Left: seven pillars under "law" (neutral framework, autonomy, neutrality, centrality, enacted rules, unity,
      rationality), each tested by the feminist challenge; right: a hub labelled "community" with spokes to Austin
      (independent political society), Hart (officials and citizens of the modern state), Finnis (common good) and
      Dworkin (integrity), and the liberal and communitarian selves on either side.
    related:
      - naffine-in-praise-of-legal-feminism
      - outsider-jurisprudence
    depends-on:
      - laws2100-w05-law-as-integrity
      - laws2100-w02-austins-sovereign
    contrasts-with:
      - four-feminisms
    cases: []
    authorities:
      - lacey-unspeakable-subjects
      - austin-province-of-jurisprudence-determined
      - hart-the-concept-of-law
    verify: false
    body: >-
      The terms 'rational', 'impartial' and 'objective' recur in legal discourse and legal theory, often defined in
      terms of their opposites. Law appears committed to reasoning that favours objective, impartial and disinterested
      thought over emotion or personal opinion. The justification: everyone will be treated equally before the law,
      regardless of race, sex or religion.


      Nicola Lacey (*Unspeakable Subjects*, 1998; LSE) frames the feminist challenge to conventional legal scholarship:
      the neutral framework of legal reasoning; law's autonomy and discreteness; its neutrality and objectivity; its
      centrality; law as a system of enacted rules or norms; its unity and coherence; its rationality.


      In chapter 5, 'Community in Legal Theory: Idea, Ideal or Ideology?', community is "one particular discursive
      figure in contemporary Anglo-American legal theory" (p 128). Lacey (1) explores the liberal–communitarian debate's
      relevance for law; (2) assesses the rhetorical function of appeals to "community"; (3) draws implications for CLS,
      socio-legal studies, postmodernism and critical theory.


      Liberals: autonomous agents, individual rights, the primacy of justice, universal norms. Communitarians: socially
      embedded selves shaped by communities, traditions and social roles; identities formed through shared practices and
      narratives.


      The lecture: every theory studied assumes a community. Austin identifies the sovereign within an independent
      political society; Hart's system has officials and citizens, with the modern state as central case; Finnis's
      central case promotes the common good; Dworkin's integrity rests on a community's political morality. Law is the
      law of a community, for a community.


      Exam use: ask whose community a theory of law presupposes.
  - slug: critical-race-theory
    title: Critical race theory
    visual: diagram
    visual-brief: >-
      A "neutral" rule drawn as a level line; beneath it, the six CRT moves light up one by one (race as constructed,
      racism beside formal neutrality, storytelling, liberal ideals questioned, whiteness as property, intersecting
      identities) and push the line up into a visible hierarchy; a final arrow labelled "normative" points from analysis
      to reform.
    related:
      - outsider-jurisprudence
      - four-feminisms
    depends-on:
      - outsider-jurisprudence
      - laws2100-w06-critical-legal-studies
    contrasts-with:
      - four-feminisms
    cases: []
    authorities:
      - moreton-robinson-talkin-up-to-the-white-woman
    verify: false
    body: >-
      Critical Race Theory (CRT) emerged in the United States in the 1970s, gaining momentum in the 1990s (key scholars
      include Derrick Bell, Kimberlé Crenshaw, Richard Delgado, Cheryl Harris and Mari Matsuda). It was influenced by
      the trans-Atlantic slave trade and the civil rights movement, but many of its criticisms apply to other legal
      systems, including Australia. It critiques liberalism as the hegemonic ideology of the West and links to Critical
      Legal Studies and the Critical Philosophy of Race.


      Main themes:


      - race is a socially, culturally and legally constructed category: it exists because we have decided to make
      certain characteristics, like skin colour, relevant;

      - against treating race as irrelevant and racial equality as mere equal treatment: racism can coexist with formal
      "objectivity" and "neutrality";

      - storytelling and narratives give voice to unheard perspectives;

      - rights matter, especially for historically disadvantaged minorities;

      - intersectionality: race intersects with gender, class, sexuality and disability;

      - whiteness operates as a form of property conferring legal and social advantages.


      CRT questions liberal ideals such as meritocracy, equal opportunity and colourblindness, which can obscure
      structural racism. It is not just descriptive but normative: it aims to transform law and society to achieve
      racial justice.


      Aileen Moreton-Robinson, *Talkin' Up to the White Woman* (2000): white Australian feminism positioned and silenced
      Indigenous women, and left their demands (maternity allowances, voting rights, labour rights) out.


      Exam use: set CRT's critique of equal treatment beside the critique of liberal feminism.
cases:
  - slug: bradwell-v-illinois
    name: Bradwell v Illinois
    citation: 83 US 130 (1873)
    aglc: Bradwell v Illinois, 83 US 130 (1873)
    facts: >-
      Not set out in the Week 8 materials. The lecture slide quotes only the opinion of Justice Joseph P. Bradley (at
      141–2).
    issue: >-
      Not set out in the materials. The quoted passage concerns whether the "respective spheres and destinies of man and
      woman" fit women for "the occupations of civil life".
    held: Not set out in the materials; only Justice Bradley's reasoning is quoted.
    ratio: >-
      As quoted on the slide, Justice Bradley reasoned that "the civil law, as well as nature herself, has always
      recognized a wide difference in the respective spheres and destinies of man and woman", and that the family,
      "founded in the divine ordinance, as well as in the nature of things, indicates the domestic sphere as that which
      properly belongs to the domain and functions of womanhood". The harmony of interests of the family "is repugnant
      to the idea of a woman adopting a distinct and independent career from that of her husband".
    significance: >-
      A famous judgment often quoted in feminist legal theory as the "separate spheres" view, entrenched in law until
      relatively recently, to which liberal feminism responded. The lecture reads its "respective spheres" as mirroring
      the public–private distinction and notes the link to the family.
    why-here: >-
      Used to illustrate separate spheres ideology and the public–private distinction challenged by liberal feminism and
      by "the personal is the political".
    verify: true
