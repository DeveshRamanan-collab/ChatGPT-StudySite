week_file:
  topic: 'Outsider jurisprudence: feminist legal theory and critical race theory'
  summary: >-
    Week 8 turns to outsider jurisprudence: theories that look at law from the standpoint of those it marginalises, and
    so help us rethink both "what is law?" and "what is legal theory?". It works through four feminisms (liberal,
    difference, radical, postmodern), Naffine's aims, methods and epistemology of legal feminism, the public–private
    distinction, Lacey on the feminist challenge to conventional legal scholarship and the idea of community, and
    critical race theory with Moreton-Robinson. For the exam and essay, it is the strongest challenge to a general,
    descriptive and neutral theory of law.
  source-note: >-
    Built from the Week 8 lecture slides and the Echo360 lecture transcript (Outsider Jurisprudence). The slides give
    the structure, names and quotations; the transcript supplies the lecturer's explanations and links to earlier weeks.
  notes: >
    ## Outsider jurisprudence


    - The law reflects and perpetuates a dominant perspective (remember the CLS).

    - Critical approach to law and legal institutions (remember Legal Realism).

    - Different aspects: gender, race, culture, sexuality…

    - Disadvantage and disempowerment in marginalised social groups.

    - Concern with equality, justice, and legal reform.

    - Language and power.

    - Outsider jurisprudence can help us rethink the question 'what is law?'

    - Outsider jurisprudence can help us rethink the question 'what is legal theory?'


    The lecture: 'outsider jurisprudence' is an expression found in the literature and used in the unit textbook (Bix),
    and it is an umbrella term for a number of different theories. Inside and outside of what? Of law. Hart stresses the
    internal point of view of those who voluntarily participate in a practice; yet for a legal system to exist he
    requires only that officials accept its secondary rules and that ordinary citizens generally comply with its primary
    rules. In a dictatorship most people may comply out of fear: they are subjects of the law, and may even be its
    victims. Some members of a community may also suffer more in some areas of law (family law, employment law, contract
    law) than others.


    There is a trivial sense of being external (a legal system in a country you have never been to, whose laws do not
    apply to you). Outsider jurisprudence focuses instead on the people who, so to speak, suffer from the legal system:
    those oppressed or marginalised by it.


    The same distinction applies to legal theory. There is a canon: for decades analytical jurisprudence in the
    English-speaking world had a special status, for theoretical but also cultural, sociological and academic reasons,
    and competing investigations try to challenge the status quo. Keep separate the questions about the nature of law
    and the questions about the nature of legal theory: outsider jurisprudence bears on both.


    What the two families this week (feminist legal theory and critical race theory) share: they are critical of the
    legal system, legal arrangements, doctrines and the received view about law; they build on critical insights from
    other traditions such as legal realism, which created the space for a critical assessment of legal reasoning,
    institutions, norms and principles (even if these theorists do not present themselves as realists); they study law
    in context, integrated with a society organised with certain power relations; and they see language as an exercise
    of power, since naming things has real consequences. Even when they push a descriptive claim, they attend to
    equality and justice and want to bring about change.


    ## Feminism and feminist philosophy


    **Feminism**: an intellectual commitment and a political movement that seeks an end to gender-based oppression. Four
    categories:


    1. Liberal feminism

    2. Cultural/difference feminism

    3. Radical feminism

    4. Postmodern feminism


    **Feminist philosophy**: philosophical approaches to feminism; feminist interventions in conventional areas of
    philosophical research; a feminist research agenda.


    Despite their differences, feminist legal theorists see the law as a social system that reflects, maintains, and
    legitimises the patriarchy. The lecture: the three verbs are different, and each claim needs its own arguments. As
    with positivism and positive law, distinguish levels: feminist legal theory sits within feminist philosophy, which
    sits within feminism.


    The research agenda: the theories studied so far mostly kept the problems fixed ('what is law?', 'what is legal
    obligation?') and disagreed about the answers. Changing the problem, or the perspective on it, can advance an
    inquiry (Hart did this with Austin: the internal rather than the external point of view, the puzzled man rather than
    the bad man). Critical theories question how the received problems were framed; this is one reason to read Lacey.


    ## Feminism


    Feminism is an intellectual commitment and a political movement that challenges male power and privilege, and seeks
    to end the systemic subordination of women. Feminists tend to concentrate on issues of particular concern to women,
    for example: protecting women's bodily autonomy; protecting women's reproductive freedoms; ensuring equal protection
    in law; eliminating discrimination in education, hiring, promotion and pay. While feminists tend to share these
    interests and political commitments, they do not share the same theoretical approach.


    The lecture: 'systemic' is the key idea. Individual injustices suffered by individual women are explained in the
    light of a systemic subordination.


    ## The feminist project


    - Feminism is essentially about representing women's side of things.

    - Feminist theory recognises that throughout history, men have exclusively conducted public discourse.

    - Women have been left out, silenced, misrepresented, disadvantaged, and subordinated.

    - Patriarchy refers to the structures of human societies that are organised hierarchically, in a way that
    subordinates women to men.

    - Feminism is about contesting the idea that patriarchy is good, natural, and inevitable.

    - The feminist project invites us to imagine how our societies could be structured differently.


    The lecture: these critical theories attack particular arrangements, but they also help all of us think about the
    kind of society and legal system we want, speaking to a more universal effort to build a just society (the weeks on
    justice return to this).


    ## Liberal feminism


    Liberal feminism was a response to the view, entrenched in law until relatively recently, that men and women occupy
    'separate spheres' and, therefore, should be treated differently.


    :::case

    *Bradwell v Illinois*, 83 US 130 (1873), 141–2 — Justice Joseph P. Bradley: "The civil law, as well as nature
    herself, has always recognized a wide difference in the respective spheres and destinies of man and woman. Man is,
    or should be, woman's protector and defender. The natural and proper timidity and delicacy which belongs to the
    female sex evidently unfits it for many of the occupations of civil life. The constitution of the family
    organization, which is founded in the divine ordinance, as well as in the nature of things, indicates the domestic
    sphere as that which properly belongs to the domain and functions of womanhood."

    :::


    The lecture highlights two ideas in the passage: the 'respective spheres', which often mirror the distinction
    between the private and the public sphere; and the link between those spheres and the family.


    - The goal of liberal feminism is equal treatment.

    - Most of the legal gains in the 60s and 70s used this theoretical approach.

    - Anti-discrimination legislation, such as the Sex Discrimination Act 1975 in the UK and the Sex Discrimination Act
    1984 (Cth) in Australia, prohibits (direct) discrimination on the basis of sex in areas of employment, housing, and
    the provision of goods and services.

    - For liberal feminists, the solution to the oppression of women is to remove all formal barriers to their equal
    participation in social, economic and political life.

    - Individuals should be assessed on their merits, rather than on their membership of a group.


    ## Liberal feminism and the male norm


    - Formal equality did not translate into substantive equality.

    - Formal equality failed to address the ways in which discrimination on grounds that are unique to women, such as
    pregnancy, could be classed as a form of discrimination.

    - Direct vs indirect discrimination (treatment vs impact).

    - Public vs private discrimination.

    - Not all women can take advantage of their equal rights.

    - It implicitly assumes male experiences and perspectives as the norm/benchmark.


    The lecture: the focus on individuals matters, but individuals are always connected with other individuals and
    groups. Remember the realists' paper rules and real rules: a statute that guarantees rights to everyone does not
    mean every group can take advantage of them.


    ## Difference feminism


    Cultural/difference feminism embraces the differences between men and women. It is a reaction to an idea of formal
    equality that forces women to assimilate to patriarchal structures, acting and behaving like men. Carol Gilligan:
    ethics of care vs ethics of justice. This approach has led some legal scholars to argue that the law (which
    currently reflects only male values) should acknowledge and recognise the perspective and the values of women.


    Contra: this approach can reinforce stereotyped views about women which have been the main cause of their social
    subordination and inequality.


    ## Radical feminism


    Catharine MacKinnon:


    - Women do not so much speak with a different voice – they have no voice at all.

    - Women as a class are dominated by men as a class.

    - Oppression on the basis of sex is the most fundamental form of domination in society.

    - Academic work and political activism on pornography (the consumption of pornography seen as a political issue, not
    a private sex-related preference).


    Questions: does radical feminism see women only as victims? Does this approach help, or harm, the feminist cause (by
    constantly claiming that the autonomy and agency of women is overridden by male oppression)? The lecture: the focus
    shifts from individuals to classes, a concept taken from Marxist analysis of society and power relations; and if
    women are only victims, it is hard to move from analysis to action.


    ## Postmodern feminism


    - Influence of postmodernism: distrust of grand theories/narratives; deconstruction of binary oppositions
    (male/female; reason/emotion; nature/culture).

    - Two key concepts: 'essentialism' and 'intersectionality'.

    - Essentialism is the flaw of generalising about women or assuming that women have an 'essence' (and common
    interests).

    - Intersectionality acknowledges that women belong to different racial groups, different cultures, different
    religions, and different classes: these multiple axes of identity intersect to create totally different kinds of
    gender subordination.


    Potential issues (Naffine):


    - If one does not share exactly the same social position as someone else, is one unable to understand that person's
    perspective and experiences? Naffine points out the impossibility of ever arriving at the full picture of each
    woman's individual circumstances: at what point do we know enough?

    - How can women's situation be improved if feminists are not prepared to speak for women? An emphasis on different
    subjectivities does not advance the project of legal reform, and some feminists argue that all it leads to is
    political paralysis.


    The lecture: if communication were really impossible, the feminist project would fail both intellectually and
    politically; change needs a critical mass, which was a strength of the liberal approach.


    ## Naffine, In Praise of Legal Feminism (2002)


    Ngaire Naffine is Professor Emerita at the University of Adelaide (*Manning the Law: Why the Legal Person Remains a
    Man* (2025); *Criminal Law and the Man Problem* (2019); *Law's Meaning of Life* (2009); *Female Crime* (1987)). The
    article is a "reflective appreciation of feminist legal theory" in four parts: aims and methods of the feminist
    undertaking in law; female agency; the female legal actor/subject; feminist scholarship and the legal academy. The
    lecture focuses on the first and the last.


    ## The feminist project and legal theory


    - Feminist legal theorists investigate and challenge the ways in which the law is not impartial and objective (and,
    when appearing to be impartial, is not applied equally), upholding patriarchal institutions and participating in the
    systematic oppression of women. Examples: sexual assault law, the criminal defence of provocation, the marital rape
    exception, the historical reluctance to intervene in cases of domestic violence.

    - Theory and practice.

    - Various methods, including "consciousness raising", the naming and re-naming of the injuries done to women, and
    the legal recognition of those injuries.

    - New expressions and legal categories, such as 'sexual harassment', 'date rape', or 'domestic violence'.


    The lecture: law presents itself as impartial partly through generality (we treat all members of a class in the same
    way); feminist legal theory tries to unmask a system that, even when it seems neutral, upholds patriarchal
    institutions. Do not just memorise the methods: ask why they are used, and why other theories do not use them. There
    are reasons why Kelsen does not use consciousness raising.


    ## Feminist epistemology


    - Feminist legal theorists are "neither stranger nor native"; they are the 'outsider within' (Naffine, p 77).

    - Naffine discusses the "epistemic privilege of marginality": a particular perspective on the deficiencies of law.

    - A generous methodology, which is receptive of other bodies of knowledge, and open to revision.

    - An epistemology of largess (versus "the jurisprudence of orthodoxy"): "…a willingness to concede that new points
    of view might be better than well-used ones; that one's view is necessarily limited, partial, and so consistently in
    need of revision." (p 81)


    The lecture: someone from a group that did not create the legal system (or the canon of legal theory) who now has
    the language and position to be part of it, as a lawyer, official or theorist, is the outsider within, and for
    Naffine that is a strength. Compare the central and peripheral cases in Hart and Finnis: seeing the perspectives of
    those always winning and always losing the game, and the connection between them, gives a deeper understanding of
    the practice. The generous methodology is the opposite of Kelsen's pure theory, which keeps law free of insights
    from other disciplines.


    ## Feminist legal theory


    - Feminist legal theory is interested in analysing the extent to which our legal systems reflect (and reinforce) a
    (white) male perspective. Challenging the patriarchy in the legal context also has consequences for the research
    agenda of legal theorists.

    - Feminist legal theory considers how the differences between men and women should / should not be incorporated in
    legal rules, legal institutions, and legal education. Challenging the (white) male norm requires us to re-think some
    conventional legal concepts and values (eg autonomy, individual rights).


    The lecture: apply the unit's three values here too: curiosity, charity, clarity.


    ## The public-private distinction


    - 'Separate spheres' ideology: a public sphere for men and a private sphere for women (and children).

    - The law has incorporated the public-private distinction.

    - Challenging this distinction: 'the personal is the political'.
      - Private inequality is the source of public disadvantage.
      - The politics of power permeates the private sphere.
      - The problems faced by women in the private sphere are a matter of systemic injustice.
      - The family is a political institution.

    The lecture: the distinction is not negative per se (we all attach some value to our privacy) and returns in later
    weeks on rights and liberalism. The challenge is to the separation: the two spheres can be distinguished without
    being separate, and claims about justice were traditionally confined to the public sphere.


    ## Some topics of interest


    Abortion rights; rape law; sexual harassment and exploitation; surrogate motherhood; pregnancy and maternity leave;
    pornography. For MacKinnon, pornography is "an institution of gender inequality". Catharine MacKinnon worked with
    Andrea Dworkin (1946–2005) to draft a model civil rights ordinance to offer civil recourse for harms connected to
    sexually explicit materials (displaying extreme sexual inequality).


    The lecture: these were not the top questions for Austin, Kelsen or Hart, yet specific questions like these help us
    reflect on the nature of law in general. MacKinnon's work reframes a familiar problem as a different problem, which
    generates different questions; the lecture added that the argument relies on a conceptual distinction between
    pornography and erotica.


    ## The impartiality of laws and judicial reasoning


    - The terms 'rational', 'impartial', and 'objective' come up in legal discourse and in the theoretical study of the
    nature of law.

    - These terms are often defined in terms of their opposites; our understanding of the law reflects this divided view
    of the world.

    - The law appears to be committed to a particular style of reasoning that favours objective, impartial and
    disinterested thought over emotion or personal opinion.

    - The justification is that everyone will be treated equally before the law, regardless of race, sex or religion:
    equality before the law is achieved by the impartiality of laws and judicial reasoning.


    ## The feminist challenge to conventional legal scholarship


    - The neutral framework of legal reasoning

    - Law's autonomy and discreteness

    - Law's neutrality and objectivity

    - Law's centrality

    - Law as a system of enacted rules or norms

    - Law's unity and coherence

    - Law's rationality


    See Nicola Lacey, *Unspeakable Subjects – Feminist Essays in Legal and Social Theory* (Hart Publishing, 1998). Lacey
    is School Professor of Law, Gender and Social Policy at LSE Law School.


    ## Lacey, 'Community in Legal Theory: Idea, Ideal or Ideology?'


    In Chapter 5, Lacey reflects on the significance of community, "one particular discursive figure in contemporary
    Anglo-American legal theory" (p 128).


    - She explores the relevance for law and legal theory of the main currents of argument within the
    liberal-communitarian debate.

    - Secondly, she assesses the significance of the currency of discourses of community in legal theory, focusing on
    the rhetorical function of different appeals to "community".

    - Thirdly, she explores the implications of this analysis for the relationship between different theoretical
    projects around law (CLS, socio-legal studies, postmodernism and critical theory).


    The lecture: the chapter engages with Dworkin, for whom law as integrity rests on the political morality of a
    community. Every theory studied so far assumes a community: Austin needs an independent political community to
    identify the sovereign; Hart's legal system has officials and citizens, and his central case is the law of the
    modern state; Finnis's central case of law promotes the common good of the community. Law is the law of a community,
    for a community. Lacey is herself an example of the outsider within: a master of analytical jurisprudence (the
    lecture recalled her biography of Hart) who brings other perspectives to its concepts.


    ## The liberal-communitarian debate


    Should individuals be understood primarily as autonomous agents (as liberals argue) or as socially embedded beings
    shaped by communal ties (as communitarians contend)?


    - Liberal theorists emphasise individual rights, personal autonomy, and the primacy of justice. They tend to
    prioritise universal norms and abstract principles over particular cultural or historical contexts.

    - Communitarian thinkers argue that individuals are not isolated decision-makers, but are deeply influenced by their
    communities, traditions, and social roles. From this perspective, liberalism overlooks the way identities are formed
    through shared practices and narratives.


    The debate also touches on the nature of the self, the role of the state, and the value of multiculturalism. The
    lecture: skim the first part of the chapter; the debate can also be related to liberal feminism.


    ## Theory and action: some practical achievements


    - The defence of provocation has since been tightened up in various jurisdictions.

    - The marital rape exception has been removed.

    - The Crimes Legislation Amendment (Sexual Consent Reforms) Act 2021 (NSW) implemented consent reforms that aim to
    clarify consent provisions in the Crimes Act 1900, including that consent is a free and voluntary agreement that
    should not be presumed, and to clarify that consent involves ongoing and mutual communication.


    The lecture: Hart presents his theory as general and descriptive; feminist legal theory always combines analysis
    with political engagement. Compare a fully descriptive and a fully normative theory with care. A theory that aims to
    change the status quo, not only to analyse it, must also be assessed by whether it brought about that change.


    ## Critical Race Theory


    - Critical Race Theory (CRT) emerged in the United States in the 1970s, gaining momentum in the 1990s. Some key
    scholars: Derrick Bell, Alan Freeman, Kimberlé Crenshaw, Richard Delgado, Cheryl Harris, Charles R. Lawrence III,
    Mari Matsuda, Patricia J. Williams.

    - Especially in the US, CRT has been influenced by the history of the trans-Atlantic slave trade, and the civil
    rights movement.

    - Many of the criticisms offered by CRT can be applied to other legal systems (including Australia).

    - CRT scholars offer a critique of liberalism as the hegemonic ideology of the West.

    - CRT is linked to other critical approaches to law and society, in particular Critical Legal Studies and the
    Critical Philosophy of Race.


    ## CRT: some main themes


    - Race, as a socially, culturally, and legally constructed category.

    - Race exists because we have decided to make certain characteristics, like skin colour, relevant.

    - Critique of the idea that race is an irrelevant category, and that racial equality involves extending equal
    treatment to members of different races (because racism can coexist with formal "objectivity" and "neutrality").

    - Storytelling and narratives as a way of giving voice to unheard perspectives.

    - Importance of rights, especially for historically disadvantaged minorities.

    - Intersectionality.


    The lecture: to make characteristics 'relevant' we need criteria or values, so ask which criteria people,
    institutions and theorists are using. The critique of equal treatment parallels the critique of liberal feminism;
    rights on paper raise the same questions as rights in action.


    ## CRT and legal theory


    - CRT examines how laws and legal institutions perpetuate racial hierarchies, even when they appear neutral, and
    seeks to uncover the ways in which legal doctrines, practices, and structures sustain systemic racism.

    - CRT prioritises storytelling, personal narratives, and experiential knowledge (especially from communities of
    colour) as valid and essential sources of legal insight, challenging dominant legal paradigms that often exclude
    these voices.

    - CRT scholars question liberal ideals such as meritocracy, equal opportunity, and colourblindness, arguing that
    these concepts can obscure the realities of structural racism and hinder meaningful reform.

    - CRT emphasises how race intersects with other identities (eg gender, class, sexuality, disability) to produce
    complex forms of discrimination and exclusion.

    - CRT explores how whiteness operates as a form of property which confers legal and social advantages, and seeks to
    dismantle these embedded privileges.

    - CRT is not just descriptive, but normative: it aims to transform law and society to achieve racial justice, often
    engaging with activism, policy reform, and community-based legal strategies.


    The lecture: so CRT, especially as a theory of law, raises the broader question whether legal theory should be
    descriptive, normative or both, and whether the two can be separated. Dworkin, clearly a liberal and no critical
    theorist, argued that legal theory must be both descriptive and normative, not as a choice: it is impossible to do
    one without the other.


    ## Talkin' Up to the White Woman (2000)


    Aileen Moreton-Robinson, a Goenpul woman of the Quandamooka people (Moreton Bay), Distinguished Professor of
    Indigenous Studies at Queensland University of Technology (2016); *The White Possessive: Property, Power and
    Indigenous Sovereignty* (2015). In *Talkin' Up to the White Woman: Indigenous Women and Feminism*, she gives a very
    thorough account of how Indigenous women have been represented in white Australian feminism, how white feminism has
    positioned Indigenous women, and the participation of this feminism in colonial oppression. She demonstrates the
    ways in which Indigenous women's voices have been silenced, and how demands for their rights in the areas of
    maternity allowances, voting rights, and labour rights were not included in the demands made by white feminists.


    :::examtip

    Name the approach before you criticise "feminism": liberal, difference, radical and postmodern feminism make
    different claims and need different objections. The same goes for the three verbs: law reflects, maintains or
    legitimises the patriarchy.

    :::


    :::examtip

    For the essay question on general and descriptive theory, outsider jurisprudence is the sharpest challenge: it asks
    whose perspective a "general" theory describes, and it presents itself as description plus political engagement.
    Pair it with Dworkin's claim that description and evaluation cannot be separated.

    :::
