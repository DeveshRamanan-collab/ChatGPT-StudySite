  - key: e06
    type: mcq
    concept: lacey-impartiality-and-community
    difficulty: 3
    stem: Which three tasks does Lacey set herself in the chapter on community?
    options:
      - text: >-
          Relate the liberal–communitarian debate to law; assess appeals to "community"; draw implications for critical
