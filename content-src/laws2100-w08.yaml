cards:
  - type: basic
    concept: outsider-jurisprudence
    front: 'Outsider jurisprudence: the features on the slide?'
    back: >-
      Law reflects and perpetuates a dominant perspective (remember CLS); a critical approach to law and legal
      institutions (remember legal realism); gender, race, culture, sexuality…; disadvantage and disempowerment of
      marginalised groups; equality, justice and legal reform; language and power.
    source: Week 08 Lecture Slides, slide 2
  - type: cloze
    concept: outsider-jurisprudence
    text: >-
      Outsider jurisprudence can help us rethink the question {{c1::'what is law?'}} and the question {{c2::'what is
      legal theory?'}}.
    source: Week 08 Lecture Slides, slide 2
  - type: basic
    concept: outsider-jurisprudence
    front: Inside and outside of what? (the lecture's use of Hart)
    back: >-
      Of law. Hart's legal system exists if officials accept the secondary rules and citizens generally comply with the
      primary rules, perhaps out of fear. Many are subjects, even victims, of the law; outsider jurisprudence focuses on
      those it oppresses or marginalises.
    source: Week 08 Lecture Transcript
  - type: cloze
    concept: outsider-jurisprudence
    text: >-
      Critical theories see language as an exercise of {{c1::power}}: naming things using certain terms has {{c2::real
      consequences}}.
    source: Week 08 Lecture Transcript
  - type: apply
    concept: outsider-jurisprudence
    scenario: >-
      A student writes that feminist legal theory fails as jurisprudence because, unlike Hart's theory, it is not purely
      descriptive.
    answer: >-
      It presents itself as thought and action (description plus political engagement), so it should also be judged by
      its practical achievements; and Dworkin holds that description and evaluation cannot be separated anyway.
    source: Week 08 Lecture Transcript
  - type: basic
    concept: four-feminisms
    front: The four categories of feminism on the slide?
    back: >-
      1 Liberal feminism; 2 cultural/difference feminism; 3 radical feminism; 4 postmodern feminism. Feminists share
      interests and commitments but not the same theoretical approach.
    source: Week 08 Lecture Slides, slide 3
  - type: basic
    concept: four-feminisms
    front: 'Liberal feminism: goal, solution and principle?'
    back: >-
      Goal: equal treatment. Solution: remove all formal barriers to women's equal participation in social, economic and
      political life. Principle: assess individuals on their merits, not on group membership.
    source: Week 08 Lecture Slides, slide 7
  - type: basic
    concept: four-feminisms
    front: 'Liberal feminism and the male norm: the slide''s criticisms?'
    back: >-
      Formal equality did not become substantive equality; it failed to class discrimination on grounds unique to women
      (eg pregnancy) as discrimination; direct vs indirect (treatment vs impact); public vs private; not all women can
      use their rights; it assumes the male norm/benchmark.
    source: Week 08 Lecture Slides, slide 8
  - type: cloze
    concept: four-feminisms
    text: Carol Gilligan contrasts an ethics of {{c1::care}} with an ethics of {{c2::justice}}.
    source: Week 08 Lecture Slides, slide 9
  - type: cloze
    concept: four-feminisms
    text: >-
      Radical feminism (MacKinnon): women do not so much speak with a different voice; they have {{c1::no voice at
      all}}. Women as a {{c2::class}} are dominated by men as a class.
    source: Week 08 Lecture Slides, slide 10
  - type: basic
    concept: four-feminisms
    front: 'Postmodern feminism: essentialism vs intersectionality?'
    back: >-
      Essentialism: the flaw of generalising about women or assuming they have an essence and common interests.
      Intersectionality: race, culture, religion and class intersect to create totally different kinds of gender
      subordination.
    source: Week 08 Lecture Slides, slide 11
  - type: basic
    concept: separate-spheres-and-the-personal-is-political
    front: '''Separate spheres'' ideology?'
    back: >-
      A public sphere for men and a private sphere for women (and children). The law has incorporated the public–private
      distinction.
    source: Week 08 Lecture Slides, slide 17
  - type: cloze
    concept: separate-spheres-and-the-personal-is-political
    text: >-
      Bradwell v Illinois (1873), Bradley J: the family indicates "the {{c1::domestic sphere}} as that which properly
      belongs to the domain and functions of womanhood".
    source: Week 08 Lecture Slides, slide 6
  - type: basic
    concept: separate-spheres-and-the-personal-is-political
    front: '''The personal is the political'': the four claims?'
    back: >-
      Private inequality is the source of public disadvantage; the politics of power permeates the private sphere;
      women's problems in the private sphere are a matter of systemic injustice; the family is a political institution.
    source: Week 08 Lecture Slides, slide 17
  - type: basic
    concept: separate-spheres-and-the-personal-is-political
    front: Practical achievements of the feminist project (slide)?
    back: >-
      The defence of provocation tightened up in various jurisdictions; the marital rape exception removed; the Crimes
      Legislation Amendment (Sexual Consent Reforms) Act 2021 (NSW): consent is a free and voluntary agreement, not
      presumed, involving ongoing and mutual communication.
    source: Week 08 Lecture Slides, slide 23
  - type: apply
    concept: separate-spheres-and-the-personal-is-political
    scenario: A minister says violence in the home is a private family matter and the state should stay out of it.
    answer: >-
      'The personal is the political': power permeates the private sphere, private problems are systemic injustice, and
      the family is a political institution. The historical reluctance to intervene in domestic violence is Naffine's
      example of law's partiality.
    source: Week 08 Lecture Slides, slide 17
  - type: basic
    concept: naffine-in-praise-of-legal-feminism
    front: 'Naffine, ''In Praise of Legal Feminism'' (2002): the four parts?'
    back: >-
      Aims and methods of the feminist undertaking in law; female agency; the female legal actor/subject; feminist
      scholarship and the legal academy. The lecture focuses on the first and the last.
    source: Week 08 Lecture Slides, slide 13
  - type: basic
    concept: naffine-in-praise-of-legal-feminism
    front: Feminist methods in law (Naffine slide)?
    back: >-
      Consciousness raising; the naming and re-naming of the injuries done to women; the legal recognition of those
      injuries. Result: new categories such as sexual harassment, date rape and domestic violence.
    source: Week 08 Lecture Slides, slide 14
  - type: cloze
    concept: naffine-in-praise-of-legal-feminism
    text: >-
      Feminist legal theorists are "neither {{c1::stranger}} nor {{c2::native}}"; they are the {{c3::outsider within}}
      (Naffine, p 77).
    source: Week 08 Lecture Slides, slide 15
  - type: cloze
    concept: naffine-in-praise-of-legal-feminism
    text: Naffine sets an epistemology of {{c1::largess}} against "the jurisprudence of {{c2::orthodoxy}}".
    source: Week 08 Lecture Slides, slide 15
  - type: apply
    concept: naffine-in-praise-of-legal-feminism
    scenario: >-
      A lawyer from a group long excluded from the profession becomes a judge and notices how a settled doctrine burdens
      people like her.
    answer: >-
      She is Naffine's outsider within; her marginal position gives an epistemic privilege of marginality, a particular
      perspective on the deficiencies of law.
    source: Week 08 Lecture Slides, slide 15
  - type: basic
    concept: lacey-impartiality-and-community
    front: 'The feminist challenge to conventional legal scholarship (Lacey): the seven targets?'
    back: >-
      The neutral framework of legal reasoning; law's autonomy and discreteness; neutrality and objectivity; centrality;
      law as a system of enacted rules or norms; unity and coherence; rationality.
    source: Week 08 Lecture Slides, slide 20
  - type: cloze
    concept: lacey-impartiality-and-community
    text: >-
      Law appears to favour objective, impartial and disinterested thought over {{c1::emotion or personal opinion}},
      justified by {{c2::equality before the law}}.
    source: Week 08 Lecture Slides, slide 19
  - type: cloze
    concept: lacey-impartiality-and-community
    text: >-
      Lacey: community is "one particular {{c1::discursive figure}} in contemporary Anglo-American legal theory" (p
      128).
    source: Week 08 Lecture Slides, slide 21
  - type: basic
    concept: lacey-impartiality-and-community
    front: Liberals vs communitarians (slide)?
    back: >-
      Liberals: autonomous agents; individual rights, personal autonomy, the primacy of justice; universal norms over
      particular contexts. Communitarians: socially embedded beings shaped by communities, traditions and social roles;
      liberalism overlooks how identities form through shared practices and narratives.
    source: Week 08 Lecture Slides, slide 22
  - type: basic
    concept: lacey-impartiality-and-community
    front: Which community does each earlier theory assume (lecture)?
    back: >-
      Austin: the independent political society that habitually obeys the sovereign. Hart: officials and citizens; the
      modern state as central case. Finnis: the community whose common good law promotes. Dworkin: the community whose
      political morality grounds integrity.
    source: Week 08 Lecture Transcript
  - type: basic
    concept: critical-race-theory
    front: 'Critical Race Theory: origins and influences?'
    back: >-
      Emerged in the US in the 1970s, gaining momentum in the 1990s (eg Derrick Bell, Kimberlé Crenshaw, Richard
      Delgado, Mari Matsuda); influenced by the trans-Atlantic slave trade and the civil rights movement; criticisms
      apply to other systems, including Australia; critiques liberalism as the hegemonic ideology of the West.
    source: Week 08 Lecture Slides, slide 24
  - type: basic
    concept: critical-race-theory
    front: 'CRT: the main themes on the slide?'
    back: >-
      Race as a socially, culturally and legally constructed category; race exists because we decided to make certain
      characteristics relevant; racism can coexist with formal objectivity and neutrality; storytelling and narratives;
      the importance of rights; intersectionality.
    source: Week 08 Lecture Slides, slide 25
  - type: cloze
    concept: critical-race-theory
    text: >-
      CRT scholars question liberal ideals such as {{c1::meritocracy}}, equal opportunity and {{c2::colourblindness}},
      which can obscure structural racism.
    source: Week 08 Lecture Slides, slide 26
  - type: cloze
    concept: critical-race-theory
    text: CRT explores how {{c1::whiteness}} operates as a form of {{c2::property}} conferring legal and social advantages.
    source: Week 08 Lecture Slides, slide 26
  - type: basic
    concept: critical-race-theory
    front: Moreton-Robinson, Talkin' Up to the White Woman (2000)?
    back: >-
      White Australian feminism positioned and silenced Indigenous women and participated in colonial oppression; their
      demands on maternity allowances, voting rights and labour rights were left out of white feminists' demands.
    source: Week 08 Lecture Slides, slide 27
  - type: apply
    concept: critical-race-theory
    scenario: A rule applies identically to everyone, yet its burden falls mostly on one racial group.
    answer: >-
      CRT: racism can coexist with formal objectivity and neutrality; laws that appear neutral can perpetuate racial
      hierarchies. Compare liberal feminism's limits: direct vs indirect discrimination (treatment vs impact).
    source: Week 08 Lecture Slides, slide 25
audio:
  title: Week 8 recap — outsider jurisprudence
  minutes: 3
  script: >-
    This week is outsider jurisprudence, an umbrella term for theories that look at law from the standpoint of those it
    marginalises. Inside and outside of what? Of law. On Hart's account a legal system exists when officials accept its
    secondary rules and citizens generally comply with its primary rules, perhaps only out of fear. So many people are
    subjects of the law, even its victims. The same distinction applies to legal theory: there is a canon, analytical
    jurisprudence, and there are challengers. That is why outsider jurisprudence helps us rethink both what is law and
    what is legal theory. These theories combine analysis with political commitment, so we judge them partly by their
    practical achievements.


    Feminism comes in four main versions. Liberal feminism wants equal treatment and the removal of formal barriers,
    which gave us the Sex Discrimination Act. But formal equality did not become substantive equality, and it quietly
    used the male norm as its benchmark. Difference feminism, with Gilligan's ethics of care, values women's
    perspective, at the risk of reinforcing stereotypes. Radical feminism, with MacKinnon, says women have no voice at
    all, because women as a class are dominated by men as a class; critics ask whether it sees women only as victims.
    Postmodern feminism rejects essentialism and stresses intersectionality, but Naffine asks when we know enough, and
    who will speak for women.


    Separate spheres put men in public and women at home; Bradley J in Bradwell said the domestic sphere belonged to
    womanhood. The answer is that the personal is the political: private inequality causes public disadvantage, power
    runs through the home, and the family is a political institution. Reforms followed: provocation tightened, the
    marital rape exception removed, and NSW consent reforms in 2021.


    Naffine says feminist legal theory challenges the ways law is not impartial, using consciousness raising, naming
    injuries and getting them legally recognised, like sexual harassment. Feminist theorists are the outsider within,
    with an epistemic privilege of marginality and a generous, revisable methodology: largess, not orthodoxy.


    Lacey lists the conventional assumptions under challenge, such as law's neutrality, autonomy and unity, and asks
    what work the idea of community does. Every theory we studied assumes one, from Austin's political society to
    Dworkin's integrity.


    Finally, critical race theory, from the US in the 1970s: race is constructed, racism can coexist with formal
    neutrality, storytelling gives voice, whiteness works as property, and the theory is normative as well as
    descriptive. Moreton-Robinson shows how white Australian feminism silenced Indigenous women.
