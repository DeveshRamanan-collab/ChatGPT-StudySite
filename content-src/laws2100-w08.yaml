  - key: d19
    type: short
    concept: naffine-in-praise-of-legal-feminism
    difficulty: 3
    prompt: '''Feminist legal theory''s generous methodology makes it less rigorous than Kelsen''s pure theory.'' Discuss.'
    model: >-
      Generosity is a different standard of rigour, not its absence. Argument: Kelsen sought a pure theory of law,
      uncontaminated by insights from other disciplines. Naffine praises feminist legal theory's generous methodology,
      receptive of other bodies of knowledge and open to revision: an epistemology of largess set against "the
      jurisprudence of orthodoxy", marked by "a willingness to concede that new points of view might be better than
      well-used ones" (p 81). Its methods, consciousness raising, naming and re-naming injuries, and securing their
      legal recognition, produced categories such as sexual harassment and domestic violence. The outsider within has an
      epistemic privilege of marginality: a particular view of law's deficiencies. Counterargument: openness risks
      losing the discipline that allows theories to be compared, and Naffine herself asks, of postmodern feminism, at
      what point we know enough. Evaluation: the lecture asks why a method is used. Kelsen excludes other disciplines
      because he constructs law as autonomous; feminist theorists include them because they ask what law does to people.
      Each is rigorous relative to its object, so the real disagreement is about what the object of legal theory is.
    rubric:
      - id: r1
        criterion: Thesis — takes a position on whether 'generous' means 'less rigorous'.
        marks: 2
        top-band: 'Reframes the claim at once: a different standard of rigour tied to a different object.'
        margin-note: Sharp reframing.
        authorities: []
      - id: r2
        criterion: Argument — explains Naffine's methods and epistemology with her own terms.
        marks: 3
        top-band: >-
          Uses largess, orthodoxy, the outsider within and the p 81 quotation accurately, with a concrete result of the
          methods.
        margin-note: 'Accurate terms: good.'
        authorities:
          - naffine-in-praise-of-legal-feminism
      - id: r3
        criterion: Counterargument — states the case for Kelsen's purity at full strength.
        marks: 3
        top-band: >-
          Explains why methodological strictness matters (comparison, discipline) and notes Naffine's own worry about
          knowing enough.
        margin-note: Is this Kelsen at his strongest?
        authorities: []
      - id: r4
        criterion: Evaluation — connects method to the object of legal theory.
        marks: 2
        top-band: >-
          Concludes that each method is rigorous relative to how it constructs its object, so the dispute is about the
          object.
        margin-note: 'Zoom out to the object: well done.'
        authorities: []
  - key: d20
