  - key: f01
    type: mcq
    concept: critical-race-theory
    difficulty: 1
    set: pretest
    stem: Where and when did Critical Race Theory emerge, according to the slide?
    options:
      - text: In Australia in the 1990s
        why: >-
          The slide says CRT gained momentum in the 1990s, but it emerged in the United States; its criticisms can be
          applied to Australia.
      - text: In the United States in the 1970s
        correct: true
        why: >-
          Right: CRT emerged in the US in the 1970s, gaining momentum in the 1990s, influenced by the slave trade and
          the civil rights movement.
      - text: In the United Kingdom in the 1960s
        why: The UK appears this week only for the Sex Discrimination Act 1975; CRT emerged in the US in the 1970s.
      - text: In South Africa in the 1980s
        why: The slides do not link CRT's emergence to South Africa; they place it in the US in the 1970s.
  - key: f02
    type: mcq
    concept: critical-race-theory
    difficulty: 2
    stem: Which historical influences does the slide name for CRT, especially in the US?
    options:
      - text: The trans-Atlantic slave trade and the civil rights movement
        correct: true
        why: >-
          Right: the slide says that, especially in the US, CRT has been influenced by the history of the trans-Atlantic
          slave trade and the civil rights movement.
      - text: The French Revolution and the Declaration of the Rights of Man
        why: >-
          The slides do not mention the French Revolution; CRT's named influences are the slave trade and the civil
          rights movement.
      - text: The Nuremberg trials and the Universal Declaration of Human Rights
        why: >-
          These are not the influences on the slide; CRT's background is the history of slavery and the US civil rights
          movement.
      - text: The colonisation of Australia and the High Court decision in Mabo
        why: >-
          The slide says CRT's criticisms can be applied to Australia, but its historical influences are the slave trade
          and civil rights movement.
  - key: f03
    type: mcq
    concept: critical-race-theory
    difficulty: 1
    stem: Which of these is NOT listed on the slide as a key CRT scholar?
    options:
      - text: Kimberlé Crenshaw
        why: Crenshaw is on the slide's list of key CRT scholars, alongside Derrick Bell, Richard Delgado and Mari Matsuda.
      - text: Derrick Bell
        why: Derrick Bell heads the slide's list of key CRT scholars, followed by Alan Freeman and Kimberlé Crenshaw.
      - text: Ngaire Naffine
        correct: true
        why: >-
          Right: Naffine is the feminist legal theorist whose 'In Praise of Legal Feminism' is this week's reading; she
          is not on the CRT list.
      - text: Mari Matsuda
        why: Mari Matsuda is on the slide's list of key CRT scholars, with Cheryl Harris and Patricia J. Williams.
  - key: f04
    type: mcq
    concept: critical-race-theory
    difficulty: 2
    stem: What is CRT's critique of liberalism, according to the slide?
    options:
      - text: Liberalism is too communitarian in its picture of the self
        why: >-
          Liberalism is criticised by communitarians for the opposite reason; CRT critiques liberalism as the hegemonic
          ideology of the West.
      - text: Liberalism gives too little weight to universal norms
        why: >-
          Liberals prioritise universal norms; the CRT critique concerns liberalism's hegemonic status and its claimed
          neutrality.
      - text: Liberalism is the hegemonic ideology of the West
        correct: true
        why: >-
          Right: the slide says CRT scholars offer a critique of liberalism as the hegemonic ideology of the West,
          focusing on its perceived neutrality.
      - text: Liberalism rejects the importance of individual rights
        why: >-
          Liberalism stresses individual rights, and CRT itself stresses the importance of rights for disadvantaged
          minorities.
  - key: f05
    type: mcq
    concept: critical-race-theory
    difficulty: 2
    stem: On the slide, why does race exist as a category?
    options:
      - text: Because biology fixes racial groups independently of any social or legal choice
        why: CRT treats race as socially, culturally and legally constructed, not as a category fixed by biology.
      - text: Because we have decided to make certain characteristics, like skin colour, relevant
        correct: true
        why: >-
          Right: the slide says race exists because we have decided to make certain characteristics relevant, which
          raises the question of what criteria we use.
      - text: Because the law has always treated race as irrelevant to equal treatment
        why: >-
          CRT criticises the idea that race is an irrelevant category; this does not explain why race exists as a
          category.
      - text: Because storytelling and narrative created races to give voice to minorities
        why: >-
          Storytelling is a CRT method for giving voice to unheard perspectives, not the reason race exists as a
          category.
  - key: f06
    type: mcq
    concept: critical-race-theory
    difficulty: 3
    stem: >-
      Why does CRT criticise the idea that racial equality simply means extending equal treatment to members of
      different races?
    options:
      - text: Racism can coexist with formal "objectivity" and "neutrality".
        correct: true
        why: >-
          Right: the slide says racism can coexist with formal objectivity and neutrality, so equal treatment alone may
          leave racial hierarchies intact.
      - text: Equal treatment is impossible, because race is a fixed biological fact.
        why: >-
          CRT treats race as socially and legally constructed, so this premise is not CRT's; the objection is about
          neutrality.
      - text: Equal treatment ignores the sovereign's unlimited power to command.
        why: The sovereign is Austin's concept and plays no part in the CRT critique of equal treatment.
      - text: Racial equality has no bearing at all on the nature of law itself.
        why: 'CRT argues the opposite: race and racial hierarchy bear directly on how laws and legal institutions work.'
  - key: f07
    type: mcq
    concept: critical-race-theory
    difficulty: 2
    stem: Which method does CRT prioritise as a source of legal insight?
    options:
      - text: Conceptual analysis of the necessary features of all law
        why: >-
          Conceptual analysis is the method of week 1's analytical jurisprudence, which CRT challenges as a dominant
          paradigm.
      - text: Storytelling, personal narratives and experiential knowledge
        correct: true
        why: >-
          Right: CRT treats these, especially from communities of colour, as valid and essential sources of legal
          insight that dominant paradigms exclude.
      - text: Statistical prediction of how judges will decide future cases
        why: Prediction of judicial decisions is associated with legal realism, not the CRT method on the slide.
      - text: Deduction of legal rules from a presupposed basic norm
        why: >-
          Deduction from a basic norm is a caricature of Kelsen's pure theory; CRT prioritises storytelling and
          experiential knowledge.
  - key: f08
    type: mcq
    concept: critical-race-theory
    difficulty: 3
    stem: Which liberal ideals do CRT scholars question, on the slide?
    options:
      - text: Sovereignty, obedience and sanction
        why: These are Austin's concepts from week 2, not the liberal ideals the slide says CRT questions.
      - text: Generality, publicity and non-retroactivity
        why: These are among Fuller's principles of legality from week 4, not the liberal ideals CRT questions.
      - text: Integrity, fit and justification
        why: These are Dworkin's terms for law as integrity, not the liberal ideals on the CRT slide.
      - text: Meritocracy, equal opportunity and colourblindness
        correct: true
        why: 'Right: CRT argues these ideals can obscure the realities of structural racism and hinder meaningful reform.'
  - key: f09
    type: mcq
    concept: critical-race-theory
    difficulty: 3
    stem: What does CRT say about whiteness?
    options:
      - text: It operates as a form of property conferring legal and social advantages.
        correct: true
        why: >-
          Right: CRT explores how whiteness operates as a form of property, and seeks to dismantle these embedded
          privileges.
      - text: It is an irrelevant category that law rightly ignores in the name of neutrality.
        why: CRT criticises treating race as irrelevant, since racism can coexist with formal neutrality.
      - text: It is a biological category that anti-discrimination law must recognise.
        why: CRT treats race, including whiteness, as socially, culturally and legally constructed, not biological.
      - text: It is a private identity with no connection to legal institutions at all.
        why: CRT links whiteness directly to legal advantages, so it is not merely a private identity.
  - key: f10
    type: mcq
    concept: critical-race-theory
    difficulty: 2
    stem: Is CRT descriptive or normative, according to the slide?
    options:
      - text: 'Descriptive only: it reports how laws operate and leaves reform to activists.'
        why: >-
          The slide says CRT is not just descriptive; it engages with activism, policy reform and community-based legal
          strategies.
      - text: 'Normative only: it proposes reforms without analysing how institutions work.'
        why: CRT also analyses how laws and institutions perpetuate racial hierarchies, so it is not normative only.
      - text: 'Neither: it is a method of storytelling that makes no claims about law.'
        why: Storytelling is one CRT method, but CRT makes both descriptive and normative claims about law.
      - text: 'Both: it describes structural racism and aims to transform law and society.'
        correct: true
        why: >-
          Right: the slide says CRT is not just descriptive but normative, aiming to transform law and society to
          achieve racial justice.
  - key: f11
    type: mcq
    concept: critical-race-theory
    difficulty: 3
    contrasts-with:
      - four-feminisms
    stem: The lecture compares CRT's critique of equal treatment with which earlier critique this week?
    options:
      - text: The critique of liberal feminism's formal equality and male norm
        correct: true
        why: >-
          Right: the lecture says the critique of race-blind equal treatment parallels the argument against liberal
          feminism's formal equality.
      - text: Naffine's critique of the jurisprudence of orthodoxy
        why: >-
          Naffine's contrast concerns epistemology and method, not equal treatment; the lecture's parallel is with
          liberal feminism.
      - text: Lacey's critique of the rhetoric of community
        why: >-
          Lacey's chapter concerns appeals to community; the lecture's parallel for CRT's critique of equal treatment is
          liberal feminism.
      - text: MacKinnon's critique of pornography
        why: >-
          MacKinnon's work is radical feminism; the parallel the lecture draws is with the critique of liberal
          feminism's formal equality.
  - key: f12
    type: mcq
    concept: critical-race-theory
    difficulty: 2
    stem: 'Who wrote Talkin'' Up to the White Woman: Indigenous Women and Feminism (2000)?'
    options:
      - text: Kimberlé Crenshaw
        why: >-
          Crenshaw is a key CRT scholar on the slide list, but the book on Indigenous women and Australian feminism is
          Moreton-Robinson's.
      - text: Aileen Moreton-Robinson
        correct: true
        why: >-
          Right: Moreton-Robinson, a Goenpul woman of the Quandamooka people, is Distinguished Professor of Indigenous
          Studies at QUT.
      - text: Cheryl Harris
        why: Cheryl Harris is on the CRT scholar list; the book is by Aileen Moreton-Robinson.
      - text: Patricia J. Williams
        why: Patricia J. Williams is on the CRT scholar list; the book on white Australian feminism is Moreton-Robinson's.
  - key: f13
    type: mcq
    concept: critical-race-theory
    difficulty: 3
    stem: What does Moreton-Robinson show about white Australian feminism?
    options:
      - text: It successfully represented Indigenous women's demands and secured their voting rights.
        why: >-
          The slide says the reverse: demands for voting rights and other rights were not included in white feminists'
          demands.
      - text: It positioned and silenced Indigenous women and left out their demands for rights.
        correct: true
        why: >-
          Right: demands on maternity allowances, voting rights and labour rights were not included, and white feminism
          participated in colonial oppression.
      - text: It rejected colonial oppression and was led by Indigenous women of the Quandamooka people.
        why: >-
          The slide says white feminism participated in colonial oppression; Quandamooka is Moreton-Robinson's own
          people.
      - text: It replaced liberal feminism with Gilligan's ethics of care for all Australian women.
        why: The slide does not link white Australian feminism to Gilligan; its point is the silencing of Indigenous women.
  - key: f14
    type: mcq
    concept: critical-race-theory
    difficulty: 3
    stem: On the lecture, what broader question about legal theory does CRT's mix of description and prescription raise?
    options:
      - text: Should legal theory be descriptive, normative or both, and can the two be separated?
        correct: true
        why: >-
          Right: the lecture asks whether legal theory should be descriptive, normative or a combination, and whether
          the aspects can even be separated.
      - text: Should legal theory be confined to the US, where CRT and realism first emerged?
        why: >-
          The slide says CRT's criticisms apply to other systems, including Australia; geography is not the lecture's
          question.
      - text: Should legal theory study only the rule of recognition, leaving race to sociology?
        why: >-
          This would exclude CRT's concerns from legal theory; the lecture instead asks about the descriptive/normative
          relationship.
      - text: Should legal theory abandon rights, since rights on paper never help minorities?
        why: >-
          CRT stresses the importance of rights for disadvantaged minorities, while asking about rights on paper and in
          action.
  - key: f15
    type: mcq
    concept: critical-race-theory
    difficulty: 4
    contrasts-with:
      - laws2100-w05-law-as-integrity
    stem: The lecture says Dworkin, though no critical theorist, shares something with CRT. What?
    options:
      - text: He argues that liberal ideals such as colourblindness obscure structural racism.
        why: >-
          Dworkin is described as clearly liberal; questioning liberal ideals like colourblindness is CRT's move, not
          his.
      - text: He argues that law is radically indeterminate, so decisions mask an ideology.
        why: Radical indeterminacy is a CLS claim; Dworkin holds there are right answers even in hard cases.
      - text: 'He holds that legal theory must combine description and evaluation: no choice.'
        correct: true
        why: >-
          Right: for Dworkin it is impossible to do legal theory without combining the descriptive and the normative,
          which CRT also does.
      - text: He argues that storytelling is the only valid method for theories of adjudication.
        why: Storytelling is a CRT method; Dworkin's method is constructive interpretation, not storytelling.
  - key: f16
    type: truefalse
    concept: critical-race-theory
    difficulty: 1
    set: quickfire
    statement: The slide says many of CRT's criticisms can be applied to other legal systems, including Australia.
    answer: true
    why: >-
      True: although CRT emerged in the US, the slide says many of its criticisms apply elsewhere, and
      Moreton-Robinson's work is an Australian example.
  - key: f17
    type: truefalse
    concept: critical-race-theory
    difficulty: 2
    set: quickfire
    statement: CRT treats intersectionality as irrelevant, because race is the only axis of identity that matters.
    answer: false
    why: >-
      False: CRT emphasises how race intersects with other identities (gender, class, sexuality, disability) to produce
      complex forms of discrimination.
  - key: f18
    type: truefalse
    concept: critical-race-theory
    difficulty: 1
    set: quickfire
    statement: On the slide, CRT stresses the importance of rights, especially for historically disadvantaged minorities.
    answer: true
    why: >-
      True: the importance of rights is a main theme; the lecture adds the question of rights on paper versus rights in
      action.
  - key: f19
    type: short
    concept: critical-race-theory
    difficulty: 3
    prompt: '''Critical race theory is a political programme, not a theory of law.'' Discuss.'
    model: >-
      CRT is both, and that combination is itself a claim about what legal theory should be. Argument: CRT examines how
      laws and legal institutions perpetuate racial hierarchies even when they appear neutral. It treats race as a
      socially, culturally and legally constructed category, and argues that racism can coexist with formal
      "objectivity" and "neutrality". These are claims about how law works. It questions meritocracy, equal opportunity
      and colourblindness, analyses whiteness as a form of property, and prioritises storytelling and experiential
      knowledge as sources of legal insight. It is also normative: it aims to transform law and society to achieve
      racial justice. Counterargument: Hart presents his theory as general and descriptive; by that standard, a theory
      with a reform agenda looks like politics rather than jurisprudence. Evaluation: the lecture notes that Dworkin, a
      liberal, also held that legal theory cannot avoid combining description and evaluation. If that is right, CRT is
      not disqualified for being normative. It should be judged by the accuracy of its descriptions of how law operates
      and by its practical achievements, as feminist legal theory is.
    rubric:
      - id: r1
        criterion: Thesis — takes a position on the 'programme versus theory' dichotomy.
        marks: 2
        top-band: Rejects the dichotomy at once and says what the combination implies for legal theory.
        margin-note: 'Good: the dichotomy itself is the target.'
        authorities: []
      - id: r2
        criterion: Argument — sets out CRT's descriptive claims about law accurately.
        marks: 3
        top-band: >-
          Uses construction of race, neutrality, liberal ideals, whiteness as property and storytelling, each tied to
          how law operates.
        margin-note: Accurate and well chosen.
        authorities:
          - moreton-robinson-talkin-up-to-the-white-woman
      - id: r3
        criterion: Counterargument — puts Hart's general and descriptive standard at full strength.
        marks: 3
        top-band: States Hart's descriptive aim charitably and shows why CRT looks political by that standard.
        margin-note: Fair to Hart.
        authorities:
          - hart-the-concept-of-law
      - id: r4
        criterion: Evaluation — uses Dworkin and practical achievements to resolve the issue.
        marks: 2
        top-band: 'Concludes with criteria for assessing CRT: accuracy of description and practical achievement.'
        margin-note: 'Clear criteria: well done.'
        authorities: []
  - key: f20
    type: match
    concept: critical-race-theory
    difficulty: 2
    prompt: Match each CRT theme with its description on the slides.
    pairs:
      - left: Race as a constructed category
        right: We have decided to make certain characteristics relevant
      - left: Storytelling
        right: Giving voice to unheard perspectives
      - left: Whiteness as property
        right: Confers legal and social advantages
      - left: Intersectionality
        right: Race intersects with gender, class, sexuality and disability
