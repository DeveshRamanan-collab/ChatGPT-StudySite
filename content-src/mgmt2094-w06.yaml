    options:
      - text: It is acceptable only in the methods section of a research report
        why: Tempting as a common rule of thumb, but the lecturer does not limit "I" to any section; he says it is fine and easy to read.
      - text: It is acceptable there too; journal authors often write "I found" or "I theorise"
        correct: true
        why: Correct — the lecturer says "I" is fine in other academic papers, and that academic journals often show authors writing in the first person.
      - text: It is never acceptable outside a reflective paper
        why: Tempting because the slide calls reflection "one of the few" papers allowing "I", but the lecturer says it is acceptable more widely.
  - key: q415
    type: mcq
    concept: writing-a-reflective-paper
    difficulty: 2
    variant-of: q402
    stem: "A draft says: \"I think our pitch was weak.\" Which revision best follows the slides?"
    options:
      - text: "\"I think our pitch was weak, and honestly it was a total flop.\""
        why: Tempting because it adds emphasis, but it adds slang and no evidence; the slides want specific evidence and no slang.
      - text: "\"Our pitch was weak.\""
        why: Tempting because it is more direct, but removing "I" and the feeling does not help; the slides allow "I" and want evidence.
      - text: "\"I think our pitch was weak: the panel asked three questions about cost that we could not answer.\""
        correct: true
        why: Correct — the opinion is kept and explained by specific evidence, as the slide asks of subjective feelings and opinions.
      - text: "\"I think our pitch was weak. Because of the cost.\""
        why: Tempting because it gives a reason, but "Because of the cost." is a fragment, and the reason is too vague to be evidence.
  - key: q416
    type: truefalse
    concept: writing-a-reflective-paper
    difficulty: 1
    set: quickfire
    statement: A reflective paper is a personal journal entry, so an informal diary style is appropriate.
    answer: false
    why: False — the slide says it is NOT a personal journal (diary) entry; it is still an academic paper, with a professional tone, paragraphs and no slang.
  - key: q417
    type: truefalse
    concept: writing-a-reflective-paper
    difficulty: 1
    set: quickfire
    statement: "\"For instance\" and \"as a result\" are among the common transitional phrases listed on the Week 6 slides."
    answer: true
    why: "True — the list is: for example, for instance, as a result, an opposite view is, a different perspective is."
  - key: q418
    type: truefalse
    concept: writing-a-reflective-paper
    difficulty: 2
    set: quickfire
    statement: The slides advise keeping every sentence the same length so that the paper reads evenly.
    answer: false
    why: False — the slide says vary your sentence length, but not too long, because varying it makes the writing more conversational.
  - key: q419
    type: short
    concept: writing-a-reflective-paper
    difficulty: 3
    prompt: "\"Because a reflective paper is personal, the normal rules of academic writing do not apply.\" Discuss, using this paragraph from a student's reflection on the group video project, and suggest a better version: \"Our team was kind of a mess at first lol. Because nobody knew who was editing. I felt really stressed and also the music was bad and the deadline moved and I learnt heaps about teamwork.\""
    model: "The statement is wrong: being personal changes what you may say, not the standard of writing. The Week 6 slides say a reflective paper is one of the few academic papers where you can use \"I\", but it is not a personal journal: feelings and opinions must be explained with specific evidence, in a professional register without slang, in focused, complete sentences organised into paragraphs. \"Kind of a mess… lol\" is slang. \"Because nobody knew who was editing.\" is a sentence fragment. The last sentence rambles, squeezing four ideas into one, and \"I felt really stressed\" and \"I learnt heaps\" are claims with no evidence. A better version, with transitional phrases: \"At first our team had no agreed editor, so two of us cut different versions of the opening scene. As a result, we lost three days and I felt under pressure as the deadline moved forward. For example, I spent a weekend re-syncing the music to the new cut. I learnt that roles need to be fixed at the start.\" The limit is that style alone is not enough: the slides also want theoretical underpinnings, so a full answer would link this to the project's theory."
    rubric:
      - id: r1
        criterion: Concept — states the slide's writing rules accurately
        marks: 2
        top-band: "States the rules: \"I\" allowed, not a diary, evidence for feelings, no slang, focused complete sentences, paragraphs, transitional phrases."
        margin-note: Which rules from the slide are you applying?
        authorities: []
      - id: r2
        criterion: Example — identifies each fault in the given paragraph
        marks: 2
        top-band: Names each fault precisely (slang, fragment, ramble, unsupported feeling) with the words that show it.
        margin-note: Quote the words that break each rule.
        authorities:
          - mgmt2094-example-group-project-reflection
      - id: r3
        criterion: Application — rewrites the paragraph using the rules
        marks: 3
        top-band: Produces a revised paragraph with evidence and at least one listed transitional phrase linking experience to conclusion.
        margin-note: Does your rewrite add evidence, or only polish?
        authorities: []
      - id: r4
        criterion: Evaluation — notes what style rules cannot fix
        marks: 2
        top-band: Notes a limit, for example that good style still needs analysis and theoretical underpinnings.
        margin-note: Is a well-written description enough?
        authorities: []
  - key: q420
    type: match
    concept: writing-a-reflective-paper
    difficulty: 2
    prompt: Match each draft sentence to the Week 6 writing rule it breaks.
    pairs:
      - left: "\"Brainstorming was lit.\""
        right: Avoid slang, jargon etc
      - left: "\"Because the deadline moved.\""
        right: Avoid sentence fragments
      - left: "\"I felt the team was great.\""
        right: Relate feelings using specific evidence
      - left: "\"Dear diary, today was awful.\""
        right: It is NOT a personal journal (diary) entry
  - key: q501
    type: mcq
    concept: describe-analyse-reflect
    difficulty: 1
    set: pretest
    stem: Which of these is one of the "Questions to ask myself" on the Week 6 slides?
    options:
      - text: What would I do better or differently next time?
        correct: true
        why: Correct — it is the fifth of the six "Questions to ask myself" on the final slide.
      - text: What grade does my team deserve for the project?
        why: Tempting because the rubric matters, but the slide's questions are about learning, insight and doing better, not about grading the team.
      - text: Who was most to blame for the delays in the project?
        why: Tempting because challenges are on the list, but the slide asks how well "I and the team" handled them, not who to blame.
      - text: What did the other teams in the tutorial present?
        why: Tempting because comparison can be useful, but none of the six questions is about other teams; they are about your own learning.
  - key: q502
    type: mcq
    concept: describe-analyse-reflect
    difficulty: 1
    stem: What does the final slide say you must ultimately do in your reflective writing?
    options:
      - text: Summarise each teammate's contribution fairly
        why: Tempting because fairness to teammates matters, but the slide's closing instruction is to analyse and reflect, not to summarise contributions.
      - text: Quote the marking rubric to show you have met it
        why: Tempting because the slide mentions the rubric, but it says keep the rubric in mind, not quote it; the instruction is to analyse and reflect.
      - text: Describe events in full detail, in the order they happened
        why: "Tempting because a reflection does report events, but the slide says the opposite: \"do not just describe\"."
      - text: Not just describe, but analyse and reflect
        correct: true
        why: Correct — "Remember ultimately do not just describe; you must analyse and reflect!!"
  - key: q503
    type: mcq
    concept: describe-analyse-reflect
    difficulty: 2
    stem: "A reflective paragraph reads: \"On Monday we met to plan. On Wednesday we filmed. On Friday we edited and submitted.\" What is wrong with it, by the slides' standard?"
    options:
      - text: Its sentences are fragments that need joining together
        why: Tempting because the sentences are short, but each is complete; the fault is that it only describes.
      - text: "It is only description: it does not analyse or reflect"
        correct: true
        why: Correct — it narrates what happened but asks none of the six questions; the slide says do not just describe.
      - text: It uses "we", but a reflective paper may only use "I"
        why: Tempting because "I" is encouraged, but nothing forbids "we" when describing the team; the problem is pure description.
      - text: It reveals too much personal information about the team
        why: Tempting because disclosure is a Week 6 topic, but nothing personal is revealed here; it simply lists events.
  - key: q504
    type: mcq
    concept: describe-analyse-reflect
    difficulty: 2
    stem: Which sentence goes beyond description to reflection, in the sense the slides want?
    options:
      - text: "\"Filming ran late as no one owned the schedule; next time I'd appoint a timekeeper.\""
        correct: true
        why: Correct — it explains why (analysis) and says what the writer would do differently next time, one of the six questions.
      - text: "\"Filming ran late, which was very stressful for everybody in the team, me most of all.\""
        why: Tempting because it adds a feeling, but a feeling without explanation or a lesson is still mostly description.
      - text: "\"We filmed on Wednesday and Thursday, then edited on Friday.\""
        why: Tempting because it is clear and organised, but it only reports what happened; it does not analyse or reflect.
  - key: q505
    type: mcq
    concept: describe-analyse-reflect
    difficulty: 1
    stem: Which "question to ask myself" deals with difficulties?
    options:
      - text: What have I learnt from the process?
        why: Tempting because the process included difficulties, but the question that names them is the one about challenges.
      - text: What insights have I gained?
        why: Tempting because insights can come from difficulties, but the question about difficulties is the one about challenges.
      - text: What were the challenges that I encountered/observed, and how well did I and the team handle them?
        correct: true
        why: Correct — this question asks about challenges you encountered or observed, and how well you and the team handled them.
      - text: What do I now know, that I didn't before?
        why: Tempting because overcoming difficulty teaches you things, but this question is about new knowledge, not challenges.
  - key: q506
    type: mcq
    concept: describe-analyse-reflect
    difficulty: 1
    stem: What does the final slide tell you to review alongside the questions?
    options:
      - text: Your teammates' reflections, to make sure your accounts agree
        why: Tempting because the project was shared, but the slide points you to the project criteria and rubric, not others' reflections.
      - text: The readings for every week of the unit
        why: Tempting because theory underpins the paper, but the final slide names the group project criteria and the marking rubric.
      - text: The criteria within the group project, and the marking rubric
        correct: true
        why: Correct — "Review the criteria within the Group Project and also keep in mind the marking rubric."
  - key: q507
    type: mcq
    concept: describe-analyse-reflect
    difficulty: 2
    stem: Which instruction on the slides most directly moves a reflection from describing to analysing?
    options:
      - text: Relate it to your project, with theoretical underpinnings
        correct: true
        why: Correct — bringing in the theory behind the project lets you explain what happened, not just report it.
      - text: Avoid slang, jargon etc and always proofread
        why: Tempting because polish improves any paper, but it changes how you write, not whether you analyse.
      - text: Avoid dragging someone else down in your writing about the team
        why: Tempting because it shapes how you write about teammates, but it is about detachment, not about analysing.
      - text: Use paragraphs to organise the paper
        why: Tempting because organisation helps, but paragraphs organise description just as well; they do not add analysis.
  - key: q508
    type: mcq
    concept: describe-analyse-reflect
    difficulty: 2
    variant-of: q503
    stem: Rosa's draft lists every task she did, week by week, with dates. What kind of writing is this, and what is missing?
    options:
      - text: Analysis; she only needs to add theory to finish it
        why: Tempting because theory is required, but a dated task list has not begun to analyse; it is description.
      - text: Description; it needs analysis and answers to the six questions
        correct: true
        why: "Correct — a dated task list is description; the slide says do not just describe: analyse and reflect."
      - text: Reflection; nothing is missing, since the tasks show what she learnt
        why: Tempting because the tasks are hers, but a list of tasks shows what she did, not what she learnt or would change.
  - key: q509
    type: mcq
    concept: describe-analyse-reflect
    difficulty: 1
    stem: Which "question to ask myself" asks about new knowledge?
    options:
      - text: How well did the other teams handle their projects?
        why: Tempting because it sounds like the challenges question, but it is not on the slide; the questions are about you and your team.
      - text: What would I do better or differently next time?
        why: Tempting because it follows from new knowledge, but it asks about future action, not about what you now know.
      - text: What were the challenges that I encountered/observed?
        why: Tempting because challenges teach things, but this question asks about challenges and how they were handled.
      - text: What do I now know, that I didn't before?
        correct: true
        why: Correct — this question asks you to name knowledge you have now that you lacked before the project.
  - key: q510
    type: mcq
    concept: describe-analyse-reflect
    difficulty: 3
    stem: Sami answers "What were the challenges that I encountered/observed and how well did I and the team handle them?" by listing four challenges. What has he missed?
    options:
      - text: He has missed nothing, since listing the challenges answers the question
        why: Tempting because he named challenges, but the question has a second half he has not answered.
      - text: How well he and the team handled the challenges
        correct: true
        why: Correct — the question also asks how well "I and the team" handled them, which turns a list into an evaluation.
      - text: Who caused each challenge, named so the marker can judge them
        why: Tempting because it seems thorough, but blaming people breaks the detachment rule, and the question asks about handling, not causing.
      - text: A transitional phrase in front of each challenge he lists
        why: Tempting because transitions help, but adding them would not answer the half of the question he skipped.
  - key: q511
    type: mcq
    concept: describe-analyse-reflect
    difficulty: 2
    stem: In the recording, what does the lecturer say the reflective writing should be about?
    options:
      - text: A plan for your next group project, written as a list of steps
        why: Tempting because "what would I do differently" looks forward, but the lecturer centres the writing on the experience you had.
      - text: A report on the video itself, judged against professional standards
        why: Tempting because the project produced a video, but the reflection is about your team experience, not a review of the product.
      - text: "Your experience of working in a team: what happened, the dynamics, what you did"
        correct: true
        why: "Correct — the lecturer describes it as writing on your experience working in a team: what happened, the dynamics, what you did and achieved."
      - text: A summary of the innovation theories taught in the unit so far, with references
        why: Tempting because theory underpins the paper, but the lecturer centres it on your experience of working in the team.
  - key: q512
    type: mcq
    concept: describe-analyse-reflect
    difficulty: 3
    contrasts-with:
      - diverging-and-converging
    stem: "A draft says: \"In our first meeting we rejected most ideas as soon as they were suggested.\" Which addition best turns this into analysis, using another Week 6 idea?"
    options:
      - text: "\"We judged ideas while we were still generating them, breaking the diverging rule to defer judgement.\""
        correct: true
        why: Correct — it explains the event with the tutorial's patterns of creative thinking, giving the theoretical underpinning the slides ask for.
      - text: "\"Then, in our second meeting, we chose a final concept for the video.\""
        why: Tempting because it continues the story, but it adds another event; it describes more rather than analysing.
      - text: "\"This was really frustrating, and I did not enjoy that meeting at all.\""
        why: Tempting because it adds a feeling, but a feeling alone does not explain why the meeting went that way; it is still description.
  - key: q513
    type: mcq
    concept: describe-analyse-reflect
    difficulty: 3
    contrasts-with:
      - purposes-of-reflection
    stem: Which of these is one of the six "questions to ask myself", rather than one of the five "purposes of reflection"?
    options:
      - text: What insights have I gained?
        correct: true
        why: Correct — it is one of the six questions on the final slide; the purposes are stated as aims, not questions.
      - text: Build on theory from observation
        why: Tempting because it guides your thinking, but it is the third purpose of reflection, on an earlier slide.
      - text: Critically review something
        why: Tempting because the questions also involve reviewing, but this is the second purpose of reflection, not one of the questions.
      - text: Make decisions or resolve uncertainty
        why: Tempting because it sounds like a question you might ask, but it is the fifth purpose of reflection, not one of the six questions.
  - key: q514
    type: mcq
    concept: describe-analyse-reflect
    difficulty: 2
    stem: Which question appears twice, in slightly different words, on the "Questions to ask myself" slide?
    options:
      - text: What insights have I gained?
        why: Tempting because insight overlaps with learning, but this wording appears only once on the slide.
      - text: What would I do better or differently next time?
        why: Tempting because it is central to reflecting, but it appears once; the repeated idea is what you have learnt.
      - text: What have I learnt (from the process / from this)?
        correct: true
        why: Correct — the list opens with "What have I learnt from the process?" and closes with "What have I learnt from this?"
  - key: q515
    type: mcq
    concept: describe-analyse-reflect
    difficulty: 2
    variant-of: q504
    stem: Which closing sentence for a reflective paragraph best fits the "questions to ask myself"?
    options:
      - text: "\"Finally, I would like to thank my teammates for all their hard work.\""
        why: Tempting because it is gracious, but thanks are not reflection; it answers none of the six questions.
      - text: "\"Overall, the video was finished on time and handed in.\""
        why: Tempting because it rounds the paragraph off, but it only describes the result; it answers none of the questions.
      - text: "\"In short, we had a busy semester and the team all got along well.\""
        why: Tempting because it sums up, but it stays at the level of description and offers no learning or change.
      - text: "\"As a result, I would agree roles at the first meeting next time, because unclear editing roles cost us three days.\""
        correct: true
        why: Correct — it answers "What would I do better or differently next time?" and gives the evidence for it.
  - key: q516
    type: truefalse
    concept: describe-analyse-reflect
    difficulty: 1
    set: quickfire
    statement: The slides say a good reflection describes events in detail and leaves the analysis to the marker.
    answer: false
    why: "False — the slide says the opposite: \"Remember ultimately do not just describe; you must analyse and reflect.\""
  - key: q517
    type: truefalse
    concept: describe-analyse-reflect
    difficulty: 1
    set: quickfire
    statement: "\"What would I do better or differently next time?\" is one of the questions to ask myself on the Week 6 slides."
    answer: true
    why: True — it is the fifth of the six questions, between the challenges question and "What have I learnt from this?"
  - key: q518
    type: truefalse
    concept: describe-analyse-reflect
    difficulty: 1
    set: quickfire
    statement: The slides advise reviewing the criteria within the group project and keeping the marking rubric in mind.
    answer: true
    why: "True — the final slide: \"Review the criteria within the Group Project and also keep in mind the marking rubric.\""
  - key: q519
    type: short
    concept: describe-analyse-reflect
    difficulty: 3
    prompt: "\"A detailed, accurate account of what the team did is the heart of a good reflection.\" Discuss, using this paragraph from a reflection on a group video project: \"We met in week 3 and chose a comedy idea. In week 5 we filmed at the library. In week 7 we edited the video and added music. We submitted it on time.\""
    model: "An accurate account is the raw material of a reflection, not its heart. The Week 6 lecture ends with a warning: \"do not just describe; you must analyse and reflect\". This paragraph only reports when the team met, filmed, edited and submitted; it answers none of the \"questions to ask myself\", such as what I now know that I didn't before, how well I and the team handled the challenges, or what I would do differently next time. Nor does it relate the experience to the group project's theoretical underpinnings, which the slides require. To improve it, the writer should keep one event and work on it. For example: \"Choosing the comedy idea took two weeks because we judged every idea as soon as it was suggested; as a result, filming was squeezed into one day. I now see that we were closing too early. Next time I would suggest an idea round with judgement deferred, then a separate round to pick the best.\" The trade-off is space: analysing one event properly is better than describing four, so the writer should choose the events that taught them most."
    rubric:
      - id: r1
        criterion: Concept — explains describe versus analyse and reflect
        marks: 2
        top-band: Quotes or paraphrases "do not just describe; you must analyse and reflect" and names several of the six questions.
        margin-note: What does the slide say you must do beyond describing?
        authorities: []
      - id: r2
        criterion: Example — ties the answer to the group-project reflection
        marks: 1
        top-band: Uses the unit's reflective task, including its theoretical underpinnings and rubric, as the standard.
        margin-note: Anchor this in the group project task.
        authorities:
          - mgmt2094-example-group-project-reflection
      - id: r3
        criterion: Application — rewrites part of the paragraph as analysis and reflection
        marks: 3
        top-band: Takes one event, explains why it happened (ideally with theory) and says what the writer now knows or would do differently.
        margin-note: Which question does your rewrite answer?
        authorities: []
      - id: r4
        criterion: Evaluation — weighs depth against coverage
        marks: 2
        top-band: Recognises a trade-off, such as analysing fewer events in depth rather than describing them all.
        margin-note: Why is one analysed event worth more than four described ones?
        authorities: []
  - key: q520
    type: match
    concept: describe-analyse-reflect
    difficulty: 2
    prompt: Match each sentence from a reflection to the "question to ask myself" it answers.
    pairs:
      - left: "\"I now know how to set up a shot list, which I had never done.\""
        right: What do I now know, that I didn't before?
      - left: "\"Our biggest challenge was the edit, and we handled it by splitting scenes.\""
        right: What were the challenges, and how well did I and the team handle them?
      - left: "\"Next time I would agree on roles at the first meeting.\""
        right: What would I do better or differently next time?
      - left: "\"The project showed me that a deadline focuses a team more than a plan does.\""
        right: What insights have I gained?
  - key: q601
    type: mcq
    concept: diverging-and-converging
    difficulty: 1
    set: pretest
    stem: On the Week 6 tutorial slide "Patterns of Creative Thinking", which behaviour is listed under diverging?
    options:
      - text: Keep your eyes on your objective
        why: Tempting because the objective guides the whole task, but this is the last item under converging, not diverging.
      - text: Defer judgement
        correct: true
        why: Correct — "defer judgment" is the first item under diverging, followed by look for lots of ideas and accept all ideas.
      - text: Avoid premature closure
        why: "Tempting because it sounds like keeping options open, but the slide lists it under converging: do not close too early when choosing."
      - text: Develop a sense of "affirmative judgement"
        why: Tempting because it is about judgement, but affirmative judgement is a converging behaviour; diverging defers judgement.
  - key: q602
    type: mcq
    concept: diverging-and-converging
    difficulty: 1
    stem: Which behaviour does the slide list under converging?
    options:
      - text: Take time to "simmer" over each idea
        why: Tempting because simmering sounds like careful judgement, but the slide lists it under diverging.
      - text: Look for what is really new
        correct: true
        why: Correct — "look for what is really new" opens the converging column of the slide.
      - text: Look for lots of ideas
        why: Tempting because quantity matters in both phases, but "look for lots of ideas" is a diverging behaviour on the slide.
  - key: q603
    type: mcq
    concept: diverging-and-converging
    difficulty: 2
    stem: Ten minutes into the Floor Company idea sprint, Tom keeps saying "that will never work" to each suggestion. Which pattern of creative thinking is he breaking?
    options:
      - text: "Converging: avoid premature closure"
        why: Tempting because shutting ideas down sounds like closure, but the team is still diverging; the rule he breaks is defer judgement.
      - text: "Diverging: take time to \"simmer\""
        why: Tempting because he is rushing, but the problem is not haste; it is that he is judging ideas during the generating phase.
      - text: "Diverging: defer judgement"
        correct: true
        why: Correct — while generating ideas the slide says defer judgement and accept all ideas; Tom is judging too early.
      - text: "Converging: keep your eyes on your objective"
        why: Tempting because he may think he is staying realistic, but the team is still generating ideas, and judging now breaks diverging.
  - key: q604
    type: mcq
    concept: diverging-and-converging
    difficulty: 2
    stem: After their idea sprint, a team spends two minutes choosing and takes the first idea that seems workable, without looking at the rest. Which converging behaviour have they neglected?
    options:
      - text: Avoid premature closure
        correct: true
        why: Correct — taking the first workable idea without weighing the others closes too early, which the converging column warns against.
      - text: Defer judgement
        why: Tempting because they judged quickly, but they are now in the choosing phase, where judging is expected; the slide's warning is premature closure.
      - text: Accept all ideas equally
        why: Tempting because they ignored most ideas, but accepting all ideas belongs to diverging, not to choosing.
  - key: q605
    type: mcq
    concept: diverging-and-converging
    difficulty: 1
    stem: "\"Bring together odd combinations\" appears on the slide under which heading?"
    options:
      - text: Converging, under "look for what is really new"
        why: Tempting because odd combinations can produce something new, but the slide lists seeking combination under diverging.
      - text: "Neither: it is a step in the creativity tool"
        why: Tempting because the creativity tool combines prompts with the product, but this phrase is on the patterns slide, under diverging.
      - text: Diverging, under the heading "seek combination"
        correct: true
        why: "Correct — the diverging column ends with \"Seek combination: bring together odd combinations\"."
  - key: q606
    type: mcq
    concept: diverging-and-converging
    difficulty: 2
    stem: According to the slide, converging looks at "what gets people excited", even if what?
    options:
      - text: Even if it is not very realistic
        correct: true
        why: Correct — the converging column includes "what gets people excited even if not very realistic".
      - text: Even if it does not fit the objective
        why: Tempting because excitement can pull away from a brief, but the slide also says keep your eyes on your objective; the qualifier is realism.
      - text: Even if the team disagrees about it
        why: Tempting because excitement can split a team, but the slide's qualifier is "not very realistic", not disagreement.
      - text: Even if it is not cheap to make
        why: Tempting because cost matters in business, but the slide says "even if not very realistic".
  - key: q607
    type: mcq
    concept: diverging-and-converging
    difficulty: 2
    stem: What does the slide mean by taking "the risk to look at difficult issues or 'sneaky spots'" while converging?
    options:
      - text: Hide the weaknesses of your favourite idea from the class
        why: Tempting because "sneaky" suggests concealment, but the slide asks you to take the risk of looking at difficult issues, not to hide them.
      - text: Be willing to examine the awkward, difficult issues when you choose among ideas
        correct: true
        why: "Correct — it is a converging behaviour: when choosing, take the risk of looking at the difficult issues or \"sneaky spots\"."
      - text: Pick the riskiest idea on the list, because risk is what makes ideas innovative
        why: Tempting because "take the risk" is in the phrase, but the risk is in looking at difficult issues, not in choosing the riskiest idea.
  - key: q608
    type: mcq
    concept: diverging-and-converging
    difficulty: 1
    stem: Under which heading does the slide list "take time to 'simmer'"?
    options:
      - text: Diverging
        correct: true
        why: Correct — "take time to 'simmer'" sits in the diverging column, after "make yourself 'stretch'".
      - text: Both columns, as a general rule
        why: Tempting because taking time helps in both phases, but the slide lists it once, under diverging.
      - text: Converging
        why: Tempting because simmering sounds like slow, careful choosing, but the slide places it in the diverging column.
  - key: q609
    type: mcq
    concept: diverging-and-converging
    difficulty: 2
    stem: Which phase does "develop a sense of 'affirmative judgement'" belong to on the slide?
    options:
      - text: Neither; it is one of the debrief questions after the exercise
        why: Tempting because the debrief involves judging ideas, but the phrase is on the patterns slide, in the converging column.
      - text: Diverging, because affirming every idea means accepting them all
        why: Tempting because "affirmative" sounds like accepting all ideas, but the slide lists affirmative judgement under converging.
      - text: Converging, because it is a way of judging when choosing among ideas
        correct: true
        why: "Correct — the converging column includes \"develop a sense of 'affirmative judgment'\": judgement, but affirmative."
  - key: q610
    type: mcq
    concept: diverging-and-converging
    difficulty: 2
    stem: In the Floor Company Exercise, which step is converging?
    options:
      - text: Having fun and creating energy
        why: Tempting because energy helps the session, but it is an instruction for the idea sprint, not a converging step.
      - text: Developing 100 floor covering ideas in 10 minutes
        why: Tempting because it is the main task, but generating lots of ideas is diverging.
      - text: Using the creativity tool to find new directions
        why: Tempting because the tool is central, but it is an aid for generating ideas, which is diverging.
      - text: Picking your top 3 innovative ideas
        correct: true
        why: Correct — choosing the top 3 from many ideas is converging; reporting one to the class follows.
  - key: q611
    type: mcq
    concept: diverging-and-converging
    difficulty: 3
    stem: While converging, Uma wants to drop every idea that is not fully realistic. What does the slide suggest?
    options:
      - text: She should go back to diverging and accept all of the ideas again, without any judgement
        why: Tempting because she is being harsh, but she is right to be choosing now; the issue is her criterion, not the phase.
      - text: She should weigh what is new and exciting, even if not very realistic, before dropping it
        correct: true
        why: Correct — the converging column values what is really new and what excites people even if not very realistic, and warns against premature closure.
      - text: "She is right: converging means keeping only the realistic ideas"
        why: Tempting because converging narrows things down, but the slide says to look at what gets people excited "even if not very realistic".
  - key: q612
    type: mcq
    concept: diverging-and-converging
    difficulty: 2
    variant-of: q603
    stem: During brainstorming, Sam keeps saying "we tried something like that last year". Which diverging behaviour is he working against?
    options:
      - text: Accept all ideas
        correct: true
        why: Correct — diverging asks you to accept all ideas and defer judgement; dismissing ideas as "tried before" does neither.
      - text: Look for what is really new
        why: Tempting because he seems to want novelty, but that is a converging behaviour; in diverging the rule is to accept all ideas.
      - text: Keep your eyes on your objective
        why: Tempting because he may think he is being focused, but that is a converging behaviour, and he is judging during diverging.
  - key: q613
    type: mcq
    concept: diverging-and-converging
    difficulty: 2
    stem: Which pairing of behaviour and pattern matches the slide?
    options:
      - text: Make yourself "stretch" — converging; look for lots of ideas — diverging
        why: Tempting because stretching can feel like effortful choosing, but "stretch" is a diverging behaviour.
      - text: Accept all ideas — diverging; look for what is really new — converging
        correct: true
        why: Correct — accept all ideas is diverging; look for what is really new opens the converging column.
      - text: Defer judgement — converging; affirmative judgement — diverging
        why: Tempting because both are about judgement, but defer judgement is diverging and affirmative judgement is converging.
      - text: Accept all ideas — converging; avoid premature closure — diverging
        why: Tempting because both items are about keeping ideas in play, but the slide has them the other way round.
  - key: q614
    type: mcq
    concept: diverging-and-converging
    difficulty: 1
    stem: What does the first tutorial slide say the Week 6 tutorial is for?
    options:
      - text: To draft the reflective paper on the group video project for assessment
        why: Tempting because the Week 6 lecture is on reflective writing, but the tutorial practises divergent and convergent thinking.
      - text: To choose a final concept for the group video project
        why: Tempting because the tutorial ends with choosing a top 3, but the ideas are for the Floor Company, not the group project.
      - text: To think about and practise convergent and divergent thinking
        correct: true
        why: "Correct — slide 1: \"We will think about and practice convergent and divergent thinking for creativity and innovation.\""
  - key: q615
    type: mcq
    concept: diverging-and-converging
    difficulty: 3
    variant-of: q605
    stem: Stuck at 30 ideas, a team forces unlikely pairings such as "floor covering + gears" and "floor covering + waves" to reach 100. Which diverging behaviours are they using?
    options:
      - text: Avoid premature closure and keep their eyes on the objective
        why: Tempting because they refuse to stop at 30, but both are converging behaviours; they are still generating ideas.
      - text: Make themselves "stretch" and bring together odd combinations
        correct: true
        why: Correct — pushing past 30 is stretching, and pairing the floor with gears or waves brings together odd combinations.
      - text: Defer judgement and develop a sense of affirmative judgement
        why: Tempting because they are not criticising ideas, but affirmative judgement is a converging behaviour.
  - key: q616
    type: truefalse
    concept: diverging-and-converging
    difficulty: 1
    set: quickfire
    statement: "\"Defer judgement\" is listed under converging on the Patterns of Creative Thinking slide."
    answer: false
    why: False — "defer judgment" is the first diverging behaviour; converging develops a sense of "affirmative judgement" instead.
  - key: q617
    type: truefalse
    concept: diverging-and-converging
    difficulty: 1
    set: quickfire
    statement: "\"Avoid premature closure\" is listed under converging."
    answer: true
    why: "True — it is a converging behaviour: when choosing among ideas, do not close on one too early."
  - key: q618
    type: truefalse
    concept: diverging-and-converging
    difficulty: 2
    set: quickfire
    statement: On the slide, converging means picking only the most realistic ideas.
    answer: false
    why: False — the converging column includes "what gets people excited even if not very realistic", and "look for what is really new".
  - key: q619
    type: short
    concept: diverging-and-converging
    difficulty: 3
    prompt: "\"The fastest way to a good idea is to criticise every idea as soon as it is suggested.\" Discuss, applying the Week 6 tutorial to a floor covering company's product team that generated 12 ideas, criticising each one as it was suggested, and then immediately chose the safest, most realistic idea."
    model: "The statement runs two different patterns of creative thinking together. The Week 6 tutorial separates them. Diverging means defer judgement, look for lots of ideas, accept all ideas, make yourself \"stretch\", take time to \"simmer\" and bring together odd combinations. Converging means look for what is really new, consider what gets people excited even if not very realistic, avoid premature closure, take the risk to look at difficult issues or \"sneaky spots\", develop affirmative judgement and keep your eyes on your objective. Criticising each idea as it came broke \"defer judgement\", which helps explain why it stopped at 12 ideas. Choosing the safest idea at once was premature closure, and filtering on realism ignores what might excite people. The Floor Company Exercise models a better session: aim for a large number (100 ideas in 10 minutes), use the creativity tool so ideas change the product rather than just add an adjective, then pick a top 3 and argue for one. The limit is that converging still needs the objective in view, so the most exciting idea is not automatically right; affirmative judgement means building a case for an idea, not ignoring its difficulties."
    rubric:
      - id: r1
        criterion: Concept — states diverging and converging accurately
        marks: 2
        top-band: Lists the slide's diverging and converging behaviours in its own terms (defer judgement, premature closure, affirmative judgement…).
        margin-note: Which column does each behaviour sit in?
        authorities: []
      - id: r2
        criterion: Example — uses the Floor Company Exercise
        marks: 2
        top-band: Uses the tutorial exercise (100 ideas in 10 minutes, creativity tool, top 3) as a model session.
        margin-note: What did the tutorial exercise show?
        authorities:
          - mgmt2094-example-floor-company-exercise
      - id: r3
        criterion: Application — diagnoses the team's two mistakes
        marks: 3
        top-band: Identifies judging during diverging and premature, realism-only closure during converging, and proposes a fix for each.
        margin-note: Which rule did each mistake break?
        authorities: []
      - id: r4
        criterion: Evaluation — notes a limit of the patterns
        marks: 2
        top-band: Notes a limit, for example that converging must still keep the objective in view and face the sneaky spots.
        margin-note: Is the most exciting idea always the right one?
        authorities: []
  - key: q620
    type: match
    concept: diverging-and-converging
    difficulty: 2
    prompt: Match each team behaviour to the item on the Patterns of Creative Thinking slide it shows.
    pairs:
      - left: Holding back criticism during the idea sprint
        right: Defer judgement
      - left: Pairing a floor covering with gears and waves
        right: Bring together odd combinations
      - left: Not settling on the first workable idea
        right: Avoid premature closure
      - left: Checking the shortlist against the brief
        right: Keep your eyes on your objective
  - key: q701
    type: mcq
    concept: creativity-tool
    difficulty: 1
    stem: In the Floor Company Exercise, how many ideas must the team develop, and in how long?
    options:
      - text: 3 polished floor covering concepts in 30 minutes
        why: Tempting because the debrief asks for a top 3, but the task itself is 100 ideas in 10 minutes; the 3 are chosen afterwards.
      - text: As many ideas as possible, with no time limit at all
        why: Tempting because the aim is quantity, but the slide sets a target of 100 ideas and a limit of 10 minutes.
      - text: 100 new floor covering product ideas in 10 minutes
        correct: true
        why: "Correct — slide 2: develop 100 new floor covering product ideas; the time allowed is 10 minutes."
      - text: 10 new floor covering product ideas in 100 minutes
        why: "Tempting because the same numbers appear, but they are the other way round: 100 ideas in 10 minutes."
  - key: q702
    type: mcq
    concept: creativity-tool
    difficulty: 1
    stem: What does the exercise tell the team to avoid when generating floor covering ideas?
    options:
      - text: Just adding an adjective like "soft" or "blue"
        correct: true
        why: "Correct — slide 2: \"Avoid just adding an adjective like 'soft' or 'blue'\"."
      - text: Ideas that are not realistic enough to manufacture straight away
        why: Tempting because practicality matters later, but the slide says nothing against unrealistic ideas; even converging values what excites, not only what is realistic.
      - text: Using the creativity tool for more than one idea
        why: Tempting because variety matters, but the slide says use the creativity tool; what to avoid is just adding an adjective.
  - key: q703
    type: mcq
    concept: creativity-tool
    difficulty: 1
    stem: In which column of the creativity tool does "Roll it" appear?
    options:
      - text: Try to
        correct: true
        why: Correct — "Roll it" is one of the "Try to" verbs, with slide it, dissolve it, compress it and so on.
      - text: Add or subtract
        why: Tempting because rolling adds movement, but "Add or subtract" lists things like springs, elastic, nets and gears.
      - text: Imagine that you
        why: Tempting because rolling could be imagined, but "Imagine that you" lists powers such as "can read minds" and "can fly".
      - text: Make it
        why: Tempting because "make it roll" sounds natural, but "Make it" lists properties such as transparent, sticky and slippery.
  - key: q704
    type: mcq
    concept: creativity-tool
    difficulty: 1
    stem: In which column of the creativity tool does "Transparent" appear?
    options:
      - text: Try to
        why: Tempting because you could try to make a floor transparent, but "Try to" lists verbs such as slide it, melt it and stack it.
      - text: Imagine that you
        why: Tempting because a see-through floor sounds imaginary, but "Imagine that you" lists things like "have a magic wand".
      - text: Make it
        correct: true
        why: Correct — "Transparent" is the first entry under "Make it", followed by movable, immovable, sticky and flexible.
  - key: q705
    type: mcq
    concept: creativity-tool
    difficulty: 1
    stem: In which column of the creativity tool does "Springs" appear?
    options:
      - text: Make it
        why: Tempting because a springy floor sounds like a property, but "Springs" is listed under "Add or subtract".
      - text: Try to
        why: Tempting because you might try to add springs, but "Try to" lists verbs such as squeeze it and inflate it.
      - text: Imagine that you
        why: Tempting because springs can suggest bouncing about, but "Imagine that you" lists powers, such as "can fly".
      - text: Add or subtract
        correct: true
        why: Correct — "Springs" heads the "Add or subtract" column, followed by elastic, cohesion, traction and nets.
  - key: q706
    type: mcq
    concept: creativity-tool
    difficulty: 1
    stem: Which column holds "Can travel in time"?
    options:
      - text: Make it
        why: Tempting because "Time" is a prompt somewhere on the tool, but "Make it" lists properties; "Time" is under "Add or subtract".
      - text: Imagine that you
        correct: true
        why: Correct — "Imagine that you… can travel in time" is one of the fourth column's prompts.
      - text: Add or subtract
        why: Tempting because "Time" appears in "Add or subtract", but "Can travel in time" belongs to "Imagine that you".
  - key: q707
    type: mcq
    concept: creativity-tool
    difficulty: 2
    stem: Which idea follows the brief rather than "just adding an adjective"?
    options:
      - text: An extra-soft rug
        why: Tempting because it is a product, but it only adds "soft", the other adjective the slide names as one to avoid.
      - text: A floor covering that inflates into a guest mattress
        correct: true
        why: Correct — "Inflate it" (a "Try to" prompt) changes what the product does, rather than just adding an adjective.
      - text: A softer, bluer version of the current tile
        why: Tempting because it changes two things, but both changes are adjectives ("soft", "blue"), the very thing to avoid.
      - text: A blue carpet
        why: Tempting because it is a floor covering, but it just adds the adjective "blue", which the slide tells you to avoid.
  - key: q708
    type: mcq
    concept: creativity-tool
    difficulty: 2
    stem: A team proposes "a floor covering with built-in springs that cushion each step". Which column of the creativity tool prompted it?
    options:
      - text: Try to
        why: Tempting because the idea involves action, but its prompt is "Springs", which sits in "Add or subtract".
      - text: Imagine that you
        why: Tempting because it is inventive, but nothing here imagines a power; it adds springs, an "Add or subtract" prompt.
      - text: Add or subtract
        correct: true
        why: Correct — "Springs" is the first prompt under "Add or subtract".
      - text: Make it
        why: Tempting because "Bounce" is a "Make it" prompt, but this idea adds springs, which are listed under "Add or subtract".
  - key: q709
    type: mcq
    concept: creativity-tool
    difficulty: 2
    contrasts-with:
      - diverging-and-converging
    stem: Which debrief step is converging rather than diverging?
    options:
      - text: Pick your top 3 innovative ideas
        correct: true
        why: Correct — choosing a top 3 from the many ideas generated narrows them down, which is converging.
      - text: How many ideas do you have?
        why: Tempting because it closes the sprint, but counting ideas measures the diverging output; it does not narrow anything down.
      - text: What helped you be more creative?
        why: Tempting because it looks back on the session, but it asks about the process, not about choosing among ideas.
  - key: q710
    type: mcq
    concept: creativity-tool
    difficulty: 1
    stem: What is the name of the company in the tutorial exercise?
    options:
      - text: The Bright, Daring and Awesome Floor Company
        why: "Tempting because the initials match, but the company is deliberately dull: Boring, Drab and Awful."
      - text: The Plain and Simple Carpet Company
        why: Tempting because the company is dull, but its name on the slide is the Boring, Drab and Awful Floor Company.
      - text: The Boring, Drab and Awful Floor Company
        correct: true
        why: "Correct — slide 2: \"You are the new product development team for: Boring, Drab and Awful Floor Company\"."
  - key: q711
    type: mcq
    concept: creativity-tool
    difficulty: 1
    stem: What role does the class take in the Floor Company Exercise?
    options:
      - text: The new product development team
        correct: true
        why: "Correct — \"You are the new product development team for: Boring, Drab and Awful Floor Company\"."
      - text: Customers judging the company's current range of floors
        why: Tempting because judging appears in the patterns slide, but the role is to develop products, not to judge them as customers.
      - text: The board deciding whether to close the company
        why: Tempting because the company sounds like it is struggling, but the task is to develop 100 new product ideas, not to decide its future.
      - text: The company's marketing agency, planning a launch campaign
        why: Tempting because this is a marketing unit, but the slide makes you the new product development team.
  - key: q712
    type: mcq
    concept: creativity-tool
    difficulty: 2
    stem: Which of these is one of the "Imagine that you" prompts on the creativity tool?
    options:
      - text: Are the competitor
        why: Tempting because competitor thinking is common in marketing, but it is not on the slide; the prompt is "Are the problem".
      - text: Are the designer
        why: Tempting because the team designs products, but the slide's prompt is "Are the problem", not "Are the designer".
      - text: Are the customer
        why: Tempting because customer thinking is useful, but the prompt on the slide is "Are the problem".
      - text: Are the problem
        correct: true
        why: Correct — "Imagine that you… are the problem" is on the tool, alongside "can read minds" and "have a magic wand".
  - key: q713
    type: mcq
    concept: creativity-tool
    difficulty: 2
    stem: Which of these is NOT one of the four debrief questions on the tutorial slide?
    options:
      - text: What helped you be more creative?
        why: This is on the debrief slide, so it is not the answer; it follows "How many ideas do you have?"
      - text: Which idea would be cheapest to make?
        correct: true
        why: Correct — cost is not on the slide; the debrief asks how many ideas, what helped, your top 3, and to report one.
      - text: Report one idea to the rest of the class
        why: This is on the debrief slide, so it is not the answer; it is the final step after picking your top 3.
      - text: How many ideas do you have?
        why: This is on the debrief slide, so it is not the answer; it is the first question once the 10 minutes are up.
  - key: q714
    type: mcq
    concept: creativity-tool
    difficulty: 2
    variant-of: q708
    stem: A team uses "Imagine that you can make yourself smaller" and comes up with a floor covering that shows tiny paths and landscapes seen from above. Which column did they use, and is it a valid idea under the brief?
    options:
      - text: "\"Make it\" — but it breaks the brief, because it only adds an adjective"
        why: Tempting because "smaller" is an adjective, but the prompt comes from "Imagine that you", and the idea changes the product, not just its adjective.
      - text: "\"Imagine that you\" — and it is valid, because it changes the product, not just an adjective"
        correct: true
        why: Correct — "can make yourself smaller" is an "Imagine that you" prompt, and the idea goes beyond adding "soft" or "blue".
      - text: "\"Add or subtract\" — and it is valid, because it subtracts size from the floor"
        why: Tempting because shrinking sounds like subtracting, but the prompt is "Imagine that you… can make yourself smaller".
  - key: q715
    type: mcq
    concept: creativity-tool
    difficulty: 2
    stem: What does the exercise's instruction "Have fun and create energy!" suggest about the idea sprint?
    options:
      - text: It is a diverging session, where energy and quantity matter more than judging
        correct: true
        why: Correct — with 100 ideas in 10 minutes and judgement deferred, the session is about energy and volume, the diverging pattern.
      - text: It is a converging session, where the team picks the most realistic idea
        why: Tempting because a session ends with choices, but the sprint itself is for generating; picking the top 3 comes later.
      - text: It means the ideas will not be used, so quality does not matter at all
        why: Tempting because the tone is playful, but the team later picks its top 3 innovative ideas and reports one, so ideas matter.
  - key: q716
    type: truefalse
    concept: creativity-tool
    difficulty: 1
    set: quickfire
    statement: The Floor Company Exercise asks teams for 100 new floor covering product ideas.
    answer: true
    why: "True — slide 2: \"Your job is to develop 100 new floor covering, product ideas\", in 10 minutes, using the creativity tool."
  - key: q717
    type: truefalse
    concept: creativity-tool
    difficulty: 1
    set: quickfire
    statement: The exercise encourages teams to add adjectives such as "soft" or "blue" to existing products.
    answer: false
    why: "False — the slide says the opposite: \"Avoid just adding an adjective like 'soft' or 'blue'\". Use the creativity tool instead."
  - key: q718
    type: truefalse
    concept: creativity-tool
    difficulty: 1
    set: quickfire
    statement: "\"Imagine that you have a magic wand\" is one of the creativity tool's prompts."
    answer: true
    why: True — "Have a magic wand" is in the "Imagine that you" column, with can read minds, can fly and have unlimited money.
  - key: q719
    type: short
    concept: creativity-tool
    difficulty: 3
    prompt: "\"A creativity tool full of odd prompts like 'melt it' and 'imagine that you can read minds' wastes a product team's time; it should just ask customers what they want.\" Discuss, with reference to the Week 6 Floor Company Exercise."
    model: "The statement underrates what the creativity tool is for. In the Week 6 tutorial the product development team for the Boring, Drab and Awful Floor Company must develop 100 floor covering ideas in 10 minutes without \"just adding an adjective like soft or blue\". The tool supplies four columns of prompts — Try to (slide it, melt it, inflate it…), Make it (transparent, sticky, slippery…), Add or subtract (springs, nets, gears, time…) and Imagine that you (can read minds, are the problem, can travel in time…). Applied to the product, \"inflate it\" gives a floor covering that becomes a mattress; \"springs\" gives a cushioned floor. That is diverging: lots of ideas, judgement deferred, odd combinations. The statement's alternative misses the point: the exercise asks the team itself to generate ideas, and the tool pushes them past adjective-only changes. The statement has a point, though: odd prompts generate many ideas that will never be built. The tutorial answers that with its debrief, where teams pick their top 3 innovative ideas and report one, converging with the objective in view. So the tool is not a waste; it is the diverging half of a process that still needs judgement."
    rubric:
      - id: r1
        criterion: Concept — describes the tool and its purpose accurately
        marks: 2
        top-band: Describes the four columns with examples and the "avoid just adding an adjective" rule.
        margin-note: What are the four columns, and what is the tool for?
        authorities: []
      - id: r2
        criterion: Example — uses the Floor Company Exercise
        marks: 2
        top-band: Uses the exercise (100 ideas, 10 minutes, top 3) and at least one idea produced by a prompt.
        margin-note: Give an idea a prompt actually produced.
        authorities:
          - mgmt2094-example-floor-company-exercise
      - id: r3
        criterion: Application — links the tool to diverging and converging
        marks: 3
        top-band: Explains the tool as diverging support and the top-3 debrief as converging, answering the statement directly.
        margin-note: Where does judgement come in?
        authorities: []
      - id: r4
        criterion: Evaluation — weighs the statement's strongest point
        marks: 2
        top-band: Concedes that many prompted ideas will be impractical and explains why the process still justifies the tool.
        margin-note: Put the other side at its strongest before replying.
        authorities: []
  - key: q720
    type: match
    concept: creativity-tool
    difficulty: 1
    prompt: Match each prompt to its column on the creativity tool.
    pairs:
      - left: Inflate it
        right: Try to
      - left: Sticky
        right: Make it
      - left: Gears
        right: Add or subtract
      - left: Can see into the future
        right: Imagine that you
