questions:
  - key: q101
    type: mcq
    concept: why-reflect
    difficulty: 1
    set: pretest
    stem: As quoted on the Week 6 slides, how does Moon (1999) describe reflection?
    options:
      - text: The habit of recalling past experiences in vivid detail
        why: Tempting because reflection starts from experience, but recalling vividly is not processing it for a purpose, which is Moon's definition.
      - text: A record of what happened, kept so that the details are not lost
        why: "Tempting because reflection does stop experience being forgotten, but Moon's definition is about processing, not record-keeping: 'mental processing with a purpose'."
      - text: A form of mental processing with a purpose
        correct: true
        why: "Correct — the \"Why reflect?\" slide quotes Moon (1999): reflection is \"a form of mental processing with a purpose\"."
      - text: A form of free writing done without any particular aim
        why: "Tempting because the lecturer suggests jotting notes down as free writing first, but Moon's point is the opposite: reflection has a purpose."
  - key: q102
    type: mcq
    concept: why-reflect
    difficulty: 1
    stem: What does the "Why reflect?" slide say about having experience?
    options:
      - text: It is not sufficient merely to have experience in order to learn
        correct: true
        why: "Correct — the slide: \"It is not sufficient to merely have experience in order to learn.\" Without reflecting, the learning can be lost."
      - text: Theory matters more than experience, so reflect on the readings first
        why: Tempting because the writing must have theoretical underpinnings, but the slide is about experience needing reflection, not about ranking theory above it.
      - text: Experience teaches by itself; reflection is an optional extra
        why: "Tempting because we do pick things up just by doing them, but the slide says the opposite: experience alone is not sufficient for learning."
      - text: Only recent experience is worth reflecting on, as older memories fade
        why: Tempting because the slide mentions experience being forgotten, but that is a reason to reflect, not a rule limiting reflection to recent events.
  - key: q103
    type: mcq
    concept: why-reflect
    difficulty: 1
    stem: According to the slide, what may happen to an experience you do not reflect on?
    options:
      - text: It may be quickly forgotten, or its learning potential lost
        correct: true
        why: "Correct — the slide: \"Without reflecting it may be quickly forgotten or its learning potential lost.\""
      - text: It becomes a bias that quietly distorts the decisions you make later
        why: "Tempting because unexamined experience can mislead, but the slide names two risks only: being quickly forgotten and losing its learning potential."
      - text: It turns into theory once enough time has passed
        why: Tempting because the purposes include building theory from observation, but that needs reflection; the slide says unreflected experience is lost, not converted.
  - key: q104
    type: mcq
    concept: why-reflect
    difficulty: 2
    stem: In the Pensieve passage on the slide, what becomes easier once Dumbledore has poured his thoughts into the basin?
    options:
      - text: Sharing his memories with Harry so they can agree on what happened
        why: Tempting because Harry is present in the scene, but the passage is about Dumbledore examining his own thoughts at leisure, not about agreeing on events.
      - text: Deciding which of his thoughts are true and which are false
        why: Tempting because examining thoughts sounds like checking them, but the passage says patterns and links become easier to see, not truth and falsity.
      - text: Forgetting the memories that trouble him most
        why: Tempting because siphoning off thoughts sounds like getting rid of them, but he pours them out to examine them, not to forget them.
      - text: Spotting patterns and links in his thoughts
        correct: true
        why: "Correct — Dumbledore: in that form \"it becomes easier to spot patterns and links\", which is the lecture's point about reflection."
  - key: q105
    type: mcq
    concept: why-reflect
    difficulty: 2
    stem: In the recording, what does the lecturer say plays the part of Dumbledore's Pensieve for students?
    options:
      - text: The marking rubric, which sorts your thoughts into criteria for you
        why: Tempting because you should keep the rubric in mind, but the rubric is a checklist for the paper, not the place you pour your thoughts into.
      - text: The tutorial discussion, where the team talks it through
        why: Tempting because talking things through also helps, but the lecturer names reflective writing as the container for your thoughts, ideas and memories.
      - text: Reflective writing, the container you put your thoughts into
        correct: true
        why: Correct — the lecturer calls reflective writing "exactly the container" for your thoughts and ideas, which helps you spot patterns and link ideas.
  - key: q106
    type: mcq
    concept: why-reflect
    difficulty: 1
    stem: Which work does the lecture take its opening example of reflection from?
    options:
      - text: A tutorial exercise on reviewing the group project after it ends
        why: Tempting because the reflection is about the group project, but the opening example is a fictional scene with Dumbledore, not a tutorial task.
      - text: Harry Potter and the Goblet of Fire (JK Rowling, 2000)
        correct: true
        why: Correct — the "Introducing reflection" slide quotes the Pensieve scene from The Goblet of Fire, cited as JK Rowling, 2000.
      - text: Moon (1999), on reflection in learning
        why: Tempting because Moon (1999) is cited on the next slide, but Moon supplies the definition of reflection, not the opening Pensieve example.
      - text: A guest lecture on how a founder reviews each product launch
        why: Tempting because guest lectures supply examples in later weeks, but this lecture opens with a scene from a novel, the Pensieve in The Goblet of Fire.
  - key: q107
    type: mcq
    concept: why-reflect
    difficulty: 1
    stem: "Complete the quotation the slide attributes to John Dewey: \"We do not learn from experience… we learn from ___.\""
    options:
      - text: other people's accounts of what they experienced
        why: Tempting because others' views can widen our perspective, but the quotation says we learn from reflecting on our experience, not from others' accounts.
      - text: repeating the experience until it becomes a habit
        why: Tempting because practice does build skill, but the quotation's point is that learning comes from reflecting on experience, not from repetition.
      - text: reflecting on experience
        correct: true
        why: Correct — the quotation on the "Why reflect?" slide ends "…we learn from reflecting on experience."
      - text: the theory that explains the experience to us
        why: Tempting because the paper needs theoretical underpinnings, but the quotation names reflecting on experience as the source of learning, not theory.
  - key: q108
    type: mcq
    concept: why-reflect
    difficulty: 2
    stem: "Lena says: \"I worked in the team all semester, so I have already learnt everything I can from it — writing a reflection adds nothing.\" Which point from the lecture answers her?"
    options:
      - text: Reflection should wait until the rubric is released
        why: Tempting because you should keep the rubric in mind, but nothing in the lecture ties the value of reflecting to when the rubric is released.
      - text: It is not sufficient merely to have experience in order to learn
        correct: true
        why: Correct — the slide says experience alone is not enough; without reflecting, its learning potential may be lost, which is exactly Lena's risk.
      - text: A reflective paper is somewhat personal, so it includes her feelings
        why: Tempting because that is on a later slide, but it is about what to reveal, not about why experience alone fails to produce learning.
  - key: q109
    type: mcq
    concept: why-reflect
    difficulty: 2
    stem: Why, according to the lecturer in the recording, is reflection less of a focus in today's world?
    options:
      - text: We are always distracted and bombarded with information, so we rarely stop to reflect
        correct: true
        why: "Correct — the lecturer points to phones, computers and social media: lots of experiences, but no time taken to reflect, so we don't really learn."
      - text: Most experiences today are shared online, so they are already recorded
        why: Tempting because screens do feature in the lecturer's explanation, but the problem he names is distraction and not reflecting, not that experiences are recorded.
      - text: Teams now make decisions too quickly for anyone to reflect on them
        why: Tempting because speed and reflection do pull against each other, but the lecturer's reason is constant distraction by screens and information.
      - text: University courses no longer assess reflective writing
        why: Tempting as an explanation, but the lecturer blames distraction, and in this very unit the reflective writing is assessed.
  - key: q110
    type: mcq
    concept: why-reflect
    difficulty: 3
    stem: Which feature of Moon's definition most clearly separates reflection from simply remembering an event?
    options:
      - text: That it is written down in an academic paper
        why: Tempting because this unit assesses reflective writing, but Moon's definition says nothing about writing; it is about purposeful processing.
      - text: That it concerns events involving other people
        why: Tempting because the group project involves teammates, but Moon's definition does not mention other people; purpose is what marks reflection.
      - text: That it is mental
        why: Tempting because reflection happens in the mind, but remembering is mental too; the distinguishing words are "with a purpose".
      - text: That it is processing with a purpose
        correct: true
        why: Correct — remembering just brings an event back; Moon defines reflection as mental processing with a purpose, such as learning from it.
  - key: q111
    type: mcq
    concept: why-reflect
    difficulty: 3
    stem: After each team meeting, Omar types every worry and idea into one document. A month later he reads it through and notices the same scheduling problem in four meetings. Which part of the lecture does this mirror?
    options:
      - text: "The Pensieve: pouring out thoughts and examining them later to spot patterns"
        correct: true
        why: Correct — like Dumbledore, Omar siphons his thoughts into a container, examines them at leisure and spots a pattern across meetings.
      - text: Using transitional phrases to link each detail to a conclusion or understanding
        why: Tempting because Omar does link details together, but transitional phrases are a writing technique; his habit mirrors the Pensieve scene.
      - text: Revealing information wisely about the team's problems
        why: Tempting because his document is personal, but nothing here is about what to disclose; it is about pouring thoughts out to see patterns.
  - key: q112
    type: mcq
    concept: why-reflect
    difficulty: 3
    variant-of: q108
    stem: A manager has run twenty product launches but has never looked back at any of them. What does the "Why reflect?" slide suggest about her twenty launches?
    options:
      - text: They guarantee she has learnt from them, because twenty is a lot of experience
        why: Tempting because so much experience feels like expertise, but the slide says merely having experience is not sufficient to learn from it.
      - text: Their learning potential may have been lost, because she has not reflected
        correct: true
        why: Correct — "Without reflecting it may be quickly forgotten or its learning potential lost" applies however many launches she has run.
      - text: They count as theory built from observation, the third purpose of reflection
        why: Tempting because she has observed many launches, but building theory from observation is something reflection does; she has not reflected at all.
      - text: They need no reflection, as the slide is only about student group projects
        why: Tempting because the slides apply reflection to the group project, but "Why reflect?" is a general claim about learning from any experience.
  - key: q113
    type: mcq
    concept: why-reflect
    difficulty: 2
    stem: Which pairing of source and idea from the Week 6 lecture is correct?
    options:
      - text: Moon (1999) — the Pensieve, where excess thoughts are poured into a stone basin
        why: Tempting because both appear early in the lecture, but the Pensieve comes from Rowling; Moon supplies the definition of reflection.
      - text: John Dewey — reflection is "a form of mental processing with a purpose"
        why: Tempting because both lines sit on the same slide, but "mental processing with a purpose" is Moon (1999); Dewey's line is about reflecting on experience.
      - text: JK Rowling (2000) — a stone basin that makes patterns and links easier to spot
        correct: true
        why: Correct — the Pensieve passage from The Goblet of Fire is cited as JK Rowling, 2000, and it ends on spotting patterns and links.
      - text: JK Rowling (2000) — "we learn from reflecting on experience"
        why: Tempting because Rowling supplies the opening example, but the line about reflecting on experience is the one attributed to John Dewey.
  - key: q114
    type: mcq
    concept: why-reflect
    difficulty: 1
    stem: Why does Dumbledore use the Pensieve, according to the passage on the slide?
    options:
      - text: Because he wants to hide his memories from Harry
        why: Tempting because the basin holds private memories, but the passage says he uses it to examine excess thoughts, not to hide them.
      - text: Because he has forgotten an event and needs to recover it
        why: "Tempting because a memory store suggests recovery, but his problem is the opposite: too many thoughts, not too few."
      - text: Because he has too many thoughts and memories crammed into his mind
        correct: true
        why: Correct — he says he sometimes has "too many thoughts and memories crammed into my mind", and at those times he uses the Pensieve.
  - key: q115
    type: mcq
    concept: why-reflect
    difficulty: 3
    stem: Which claim is NOT made in the Week 6 lecture about why we reflect?
    options:
      - text: Reflection matters mainly as a record so others can check what happened
        correct: true
        why: Correct — the lecture never treats reflection as a record for others; its point is learning, spotting patterns and links in your own thinking.
      - text: Putting thoughts in a container makes patterns and links easier to spot
        why: This is the Pensieve point, drawn out by the lecturer, so it is not the answer; reflective writing is the container.
      - text: Experience alone is not sufficient for learning
        why: "This is on the \"Why reflect?\" slide, so it is not the answer: \"It is not sufficient to merely have experience in order to learn.\""
      - text: Reflection is a form of mental processing with a purpose
        why: This is Moon (1999), quoted on the slide, so it is not the answer; the lecture does use this definition.
  - key: q116
    type: mcq
    concept: why-reflect
    difficulty: 4
    stem: "A classmate argues: \"Reflection is just remembering, so a good memory makes reflective writing pointless.\" Which response best uses the lecture?"
    options:
      - text: "Disagree: reflective writing is mainly about tone and detachment, and no amount of memory can supply those"
        why: Tempting because tone and detachment are taught this week, but they govern how to write, not why reflection is more than remembering.
      - text: "Agree: the Pensieve shows that memories only need to be stored safely outside the mind"
        why: Tempting because the Pensieve does store memories, but Dumbledore stores them to examine them and spot patterns, not merely to keep them.
      - text: "Agree: a strong memory prevents an experience being forgotten, which is the only risk the slide names"
        why: Tempting because forgetting is one risk, but the slide names a second — losing the learning potential — and remembering does not unlock that.
      - text: "Disagree: reflection is processing with a purpose, and recalling an event is not processing it to learn"
        correct: true
        why: Correct — Moon's definition separates reflection from recall, and Dewey's line says learning comes from reflecting on experience, not having it.
  - key: q117
    type: truefalse
    concept: why-reflect
    difficulty: 1
    set: quickfire
    statement: The Week 6 slides say it is sufficient to have experience in order to learn, as long as the experience is recent.
    answer: false
    why: False — the slide says it is not sufficient merely to have experience in order to learn; without reflecting, it may be quickly forgotten or its learning potential lost.
  - key: q118
    type: truefalse
    concept: why-reflect
    difficulty: 1
    set: quickfire
    statement: Moon (1999) is quoted on the slides as describing reflection as "a form of mental processing with a purpose".
    answer: true
    why: True — that is the definition on the "Why reflect?" slide, and the purpose is what separates reflecting from simply having or recalling an experience.
  - key: q119
    type: truefalse
    concept: why-reflect
    difficulty: 2
    set: quickfire
    statement: In the Pensieve passage, Dumbledore pours his excess thoughts into a stone basin so that he can examine them at his leisure.
    answer: true
    why: True — he siphons the excess thoughts from his mind, pours them into the basin and examines them at his leisure, which makes patterns and links easier to spot.
  - key: q120
    type: match
    concept: why-reflect
    difficulty: 2
    prompt: Match each source in the Week 6 lecture to the idea it supplies.
    pairs:
      - left: Moon (1999)
        right: Reflection is "a form of mental processing with a purpose"
      - left: John Dewey (attributed)
        right: We learn from reflecting on experience, not from experience alone
