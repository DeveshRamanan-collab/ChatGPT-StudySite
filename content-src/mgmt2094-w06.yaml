cards:
  - type: cloze
    concept: why-reflect
    text: Moon (1999) suggests reflection is "a form of {{c1::mental processing}} with a {{c2::purpose}}".
    source: Week 6 Lecture Materials (Reflective Writing; labelled Week 7 on iLearn), slide 3
  - type: basic
    concept: why-reflect
    front: Why is having experience not enough to learn, according to the "Why reflect?" slide?
    back: "It is not sufficient to merely have experience in order to learn: without reflecting, it may be quickly forgotten or its learning potential lost."
    source: Week 6 Lecture Materials (Reflective Writing; labelled Week 7 on iLearn), slide 3
  - type: basic
    concept: why-reflect
    front: What is the Pensieve, and why does the lecture use it?
    back: "Dumbledore's stone basin (Harry Potter and the Goblet of Fire, Rowling 2000): he pours excess thoughts into it and examines them at leisure, so patterns and links are easier to spot. Reflective writing is that container."
    source: Week 6 Lecture Materials (Reflective Writing; labelled Week 7 on iLearn), slide 2; Week 9 Lecture Transcript, reflective-writing segment
  - type: cloze
    concept: why-reflect
    text: "\"We do not learn from experience… we learn from {{c1::reflecting on experience}}.\" (attributed to John Dewey on the slide)"
    source: Week 6 Lecture Materials (Reflective Writing; labelled Week 7 on iLearn), slide 3
  - type: basic
    concept: purposes-of-reflection
    front: List the five purposes of reflection, in the slide order.
    back: 1 Consider the process of our own learning (a process of recognition); 2 critically review something (our own behaviour, that of others); 3 build on theory from observation; 4 engage in personal or self development; 5 make decisions or resolve uncertainty.
    source: Week 6 Lecture Materials (Reflective Writing; labelled Week 7 on iLearn), slide 4
  - type: cloze
    concept: purposes-of-reflection
    text: "Purpose 1: consider the process of our own learning — a process of {{c1::recognition}}."
    source: Week 6 Lecture Materials (Reflective Writing; labelled Week 7 on iLearn), slide 4
  - type: apply
    concept: purposes-of-reflection
    scenario: "A student writes: \"Our team agreed faster once ideas were sketched, so sketches may help groups agree.\""
    answer: "Build on theory from observation: the student observes something and comes up with an explanation for it."
    source: Week 6 Lecture Materials (Reflective Writing; labelled Week 7 on iLearn), slide 4; Week 9 Lecture Transcript, reflective-writing segment
  - type: basic
    concept: purposes-of-reflection
    front: What does your self-reflective writing relate to, per the "Purposes of reflection" slide?
    back: Your group experiences, theory on the innovative project you presented, and how it may have affected the type and outcome of the project.
    source: Week 6 Lecture Materials (Reflective Writing; labelled Week 7 on iLearn), slide 4
  - type: basic
    concept: revealing-information-wisely
    front: When may you include a reflection you feel uncomfortable about?
    back: Only if it did change the final outcome of your experience — and then indicate in your writing the concerns you have about such reveals.
    source: Week 6 Lecture Materials (Reflective Writing; labelled Week 7 on iLearn), slide 5
  - type: cloze
    concept: revealing-information-wisely
    text: "Avoid dragging someone else down in your writing: keep a level of {{c1::detachment}} as you describe their {{c2::influence}}."
    source: Week 6 Lecture Materials (Reflective Writing; labelled Week 7 on iLearn), slide 5
  - type: apply
    concept: revealing-information-wisely
    scenario: "A draft says: \"Josh was lazy and ruined everything.\""
    answer: It drags Josh down. Describe his influence with detachment instead, e.g. "Two drafts arrived late, which delayed the edit."
    source: Week 6 Lecture Materials (Reflective Writing; labelled Week 7 on iLearn), slide 5
  - type: basic
    concept: revealing-information-wisely
    front: A reflective paper is personal and subjective. What tone must it keep?
    back: Always a professional and academic tone, with your thoughts kept in an organised fashion so they appear sensible.
    source: Week 6 Lecture Materials (Reflective Writing; labelled Week 7 on iLearn), slide 5
  - type: basic
    concept: writing-a-reflective-paper
    front: Name the five common transitional phrases on the slide.
    back: For example; for instance; as a result; an opposite view is; a different perspective is.
    source: Week 6 Lecture Materials (Reflective Writing; labelled Week 7 on iLearn), slide 7
  - type: cloze
    concept: writing-a-reflective-paper
    text: Transitional phrases {{c1::shift the argument}} and {{c2::introduce specific details}}; they show how one experience or detail links to a conclusion or understanding.
    source: Week 6 Lecture Materials (Reflective Writing; labelled Week 7 on iLearn), slide 7
  - type: basic
    concept: writing-a-reflective-paper
    front: Can you use "I" in a reflective paper? Is it a diary?
    back: "Yes: it is one of the few academic papers where you can use \"I\". But it is NOT a personal journal (diary) entry."
    source: Week 6 Lecture Materials (Reflective Writing; labelled Week 7 on iLearn), slide 6
  - type: apply
    concept: writing-a-reflective-paper
    scenario: "A draft says: \"I felt the team worked really well together.\""
    answer: Relate the feeling using specific evidence to explain it, e.g. what the team did that made it work.
    source: Week 6 Lecture Materials (Reflective Writing; labelled Week 7 on iLearn), slide 6
  - type: basic
    concept: describe-analyse-reflect
    front: List the six "questions to ask myself".
    back: What have I learnt from the process? What do I now know, that I didn't before? What insights have I gained? What were the challenges I encountered/observed, and how well did I and the team handle them? What would I do better or differently next time? What have I learnt from this?
    source: Week 6 Lecture Materials (Reflective Writing; labelled Week 7 on iLearn), slide 8
  - type: cloze
    concept: describe-analyse-reflect
    text: Remember ultimately do not just {{c1::describe}}; you must {{c2::analyse and reflect}}.
    source: Week 6 Lecture Materials (Reflective Writing; labelled Week 7 on iLearn), slide 8
  - type: apply
    concept: describe-analyse-reflect
    scenario: "A paragraph reads: \"On Monday we met. On Wednesday we filmed. On Friday we edited.\""
    answer: Pure description. Explain why things happened (with the project's theory) and answer a question such as what you would do differently next time.
    source: Week 6 Lecture Materials (Reflective Writing; labelled Week 7 on iLearn), slide 8
  - type: basic
    concept: describe-analyse-reflect
    front: Besides the six questions, what does the final slide tell you to review?
    back: The criteria within the group project, while keeping the marking rubric in mind.
    source: Week 6 Lecture Materials (Reflective Writing; labelled Week 7 on iLearn), slide 8
  - type: basic
    concept: diverging-and-converging
    front: List the diverging behaviours on "Patterns of Creative Thinking".
    back: Defer judgement; look for lots of ideas; accept all ideas; make yourself "stretch"; take time to "simmer"; seek combination — bring together odd combinations.
    source: Week 6 Tutorial Materials (Floor Company Exercise), slide 5
  - type: basic
    concept: diverging-and-converging
    front: List the converging behaviours on "Patterns of Creative Thinking".
    back: Look for what is really new; what gets people excited even if not very realistic; avoid premature closure; take the risk to look at difficult issues or "sneaky spots"; develop a sense of "affirmative judgement"; keep your eyes on your objective.
    source: Week 6 Tutorial Materials (Floor Company Exercise), slide 5
  - type: cloze
    concept: diverging-and-converging
    text: "Converging: avoid {{c1::premature closure}}; develop a sense of \"{{c2::affirmative judgement}}\"."
    source: Week 6 Tutorial Materials (Floor Company Exercise), slide 5
  - type: apply
    concept: diverging-and-converging
    scenario: During the idea sprint a teammate says "that will never work" to each suggestion.
    answer: It breaks the diverging rule to defer judgement and accept all ideas; judging belongs to converging, later.
    source: Week 6 Tutorial Materials (Floor Company Exercise), slide 5
  - type: basic
    concept: creativity-tool
    front: What is the Floor Company Exercise task?
    back: As the new product development team for the Boring, Drab and Awful Floor Company, develop 100 new floor covering product ideas in 10 minutes, using the creativity tool and avoiding just adding an adjective like "soft" or "blue".
    source: Week 6 Tutorial Materials (Floor Company Exercise), slide 2
  - type: basic
    concept: creativity-tool
    front: Name the four columns of the creativity tool, with one prompt from each.
    back: Try to (e.g. roll it); Make it (e.g. transparent); Add or subtract (e.g. springs); Imagine that you (e.g. can read minds).
    source: Week 6 Tutorial Materials (Floor Company Exercise), slide 3
  - type: cloze
    concept: creativity-tool
    text: "Debrief: How many ideas do you have? What helped you be more creative? Pick your {{c1::top 3}} innovative ideas. Report {{c2::one idea}} to the rest of the class."
    source: Week 6 Tutorial Materials (Floor Company Exercise), slide 4
  - type: apply
    concept: creativity-tool
    scenario: "A team's idea list reads: \"a blue carpet, a soft rug, a grey tile\"."
    answer: Every idea just adds an adjective, which the exercise says to avoid. Apply prompts from the tool instead, e.g. "Inflate it" → a floor covering that inflates into a mattress.
    source: Week 6 Tutorial Materials (Floor Company Exercise), slide 2; Week 6 Tutorial Materials (Floor Company Exercise), slide 3
audio:
  title: Week 6 recap — reflective writing; diverging and converging
  minutes: 3
  script: |-
    Week six is about two things: writing a reflection, and the two patterns of creative thinking, diverging and converging.

    Start with why we reflect. Having an experience is not enough to learn from it. Without reflecting, it may be quickly forgotten, or its learning potential lost. Moon calls reflection a form of mental processing with a purpose, and the slide adds the line attributed to John Dewey: we learn from reflecting on experience. The lecture's picture is Dumbledore's Pensieve. When his mind is crammed with thoughts, he pours them into a stone basin and looks at them at leisure, and patterns and links become easier to see. Reflective writing is our basin.

    Reflection has five purposes: recognise how we learn, critically review behaviour, ours or others', build theory from what we observe, develop ourselves, and make decisions or resolve uncertainty. For us, all of that is applied to the group project and the theory behind it.

    Then, reveal information wisely. A reflective paper is personal, but we don't reveal everything; we ask whether something is appropriate. If we are uncomfortable about a reflection, we leave it out, unless it changed the final outcome, and then we say what concerns us about revealing it. The tone stays professional and organised, and we never drag a teammate down; we describe their influence with detachment.

    On style: we can use I, but it is not a diary. Feelings need specific evidence. No slang or jargon, no fragments, no rambling, one idea per sentence, varied sentence length, paragraphs, and transitional phrases like for example, as a result, or a different perspective is, to link an experience to a conclusion.

    And the warning at the end: do not just describe; analyse and reflect. Ask what I learnt, what I now know, what insights I gained, how well we handled the challenges, and what I would do differently next time.

    In the tutorial we were the product team for the Boring, Drab and Awful Floor Company: a hundred floor covering ideas in ten minutes, and no just adding soft or blue. The creativity tool gives four columns of prompts: try to, make it, add or subtract, and imagine that you. Diverging means defer judgement, lots of ideas, accept them all, stretch, simmer and combine odd things. Converging means look for what is really new and exciting, avoid premature closure, face the sneaky spots, judge affirmatively, and keep the objective in view. Picking our top three was converging.
