      - text: They soften criticism of teammates so that the paper stays polite
        why: Tempting because detachment is required, but the slide gives transitions an argumentative job, not a softening one.
      - text: They shift the argument and link a specific detail to a conclusion
        correct: true
        why: "Correct — the slide: they \"shift the argument and introduce specific details\" and \"illustrate how one experience or detail directly links to a conclusion or understanding\"."
      - text: They make the paper longer, so that it reaches the required word count
        why: "Tempting because they do add words, but the slide gives them a job: shifting the argument and linking detail to conclusion."
