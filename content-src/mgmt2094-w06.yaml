        right: "The Pensieve: pour out excess thoughts to spot patterns and links"
      - left: The lecturer, in the recording
        right: Constant distraction means lots of experience but little reflection
  - key: q201
    type: mcq
    concept: purposes-of-reflection
    difficulty: 1
    set: pretest
    stem: Which of these is one of the five purposes of reflection listed on the Week 6 slides?
    options:
      - text: Summarise the theory covered in the readings
        why: Tempting because theory matters, but the purpose is to build on theory from your own observation, not to summarise readings.
      - text: Build on theory from observation
        correct: true
        why: Correct — "Build on theory from observation" is the third of the five purposes on the "Purposes of reflection" slide.
      - text: Record events accurately for the marker
        why: Tempting because a reflection does mention events, but recording them is description; the slide warns you must analyse and reflect.
      - text: Assign responsibility for the team's mistakes
        why: Tempting because critical review can look at others' behaviour, but the slides say to avoid dragging someone down and to keep detachment.
  - key: q202
    type: mcq
    concept: purposes-of-reflection
    difficulty: 1
    stem: Which purpose of reflection does the slide describe as "a process of recognition"?
    options:
      - text: Engage in personal or self development
        why: Tempting because self-development involves recognising your weaknesses, but the slide links recognition to the first purpose.
      - text: Consider the process of our own learning
        correct: true
        why: Correct — purpose 1 reads "Consider the process of our own learning – a process of recognition".
      - text: Make decisions or resolve uncertainty about the project
        why: Tempting because deciding involves recognising options, but the slide attaches "a process of recognition" to the first purpose.
  - key: q203
    type: mcq
    concept: purposes-of-reflection
    difficulty: 2
    stem: "Ana writes: \"I noticed our team only agreed quickly once someone sketched the idea on the whiteboard, so I think a quick sketch helps a group settle on an idea.\" Which purpose of reflection is she mainly serving?"
    options:
      - text: Engage in personal development as a presenter and a team member
        why: Tempting because she may grow from the insight, but the sentence is about explaining what happened in the team, not about her own development.
      - text: Critically review something — her own behaviour
        why: Tempting because she is looking back at the team, but she is not judging anyone's behaviour; she is explaining a pattern she observed.
      - text: Build on theory from observation
        correct: true
        why: Correct — she observes something and comes up with an explanation for it, which is how the lecturer glosses building theory from observation.
      - text: Make decisions or resolve uncertainty about her next project
        why: Tempting because her explanation could guide later choices, but she has not made or announced a decision; she has proposed an explanation.
  - key: q204
    type: mcq
    concept: purposes-of-reflection
    difficulty: 2
    stem: "Ben writes: \"Looking back, I interrupted the others in our first two meetings, and that slowed the team down.\" Which purpose of reflection is this?"
    options:
      - text: Critically review something — his own behaviour
        correct: true
        why: Correct — the second purpose is to critically review something, "our own behaviour, that of others etc"; Ben reviews his own.
      - text: Make decisions or resolve uncertainty
        why: Tempting because a decision may follow, but here Ben only reviews what he did; he has not yet decided anything.
      - text: Build on theory from observation about team meetings
        why: Tempting because Ben did observe something, but he is judging his own conduct rather than building an explanation that goes beyond it.
  - key: q205
    type: mcq
    concept: purposes-of-reflection
    difficulty: 2
    stem: Chloe was unsure whether to pitch the cheaper concept or the bolder one in the next round. After writing up the panel's feedback, she settles on the bolder one. Which purpose did her reflection serve?
    options:
      - text: Make decisions or resolve uncertainty
        correct: true
        why: Correct — she was uncertain between two pitches, and reflecting resolved it; the lecturer adds that based on reflection we can make decisions.
      - text: Engage in personal or self development
        why: Tempting because making good choices is part of growing, but what the reflection did was resolve one specific uncertainty.
      - text: Consider the process of her own learning
        why: Tempting because she learnt from the feedback, but the reflection's job here was to settle a choice she was unsure about.
      - text: Critically review the panel
        why: Tempting because the panel's feedback is involved, but she is not reviewing how the panel behaved; she uses its feedback to choose.
  - key: q206
    type: mcq
    concept: purposes-of-reflection
    difficulty: 2
    stem: "Dev writes: \"This project showed me I avoid speaking up in groups, so this semester I am working on presenting at least once in every tutorial.\" Which purpose of reflection is this?"
    options:
      - text: Build on theory from observation
        why: Tempting because Dev observed his own habit, but he is not building an explanation of how teams work; he is setting himself a development goal.
      - text: Critically review the behaviour of others in his team
        why: Tempting because critical review is on the list, but Dev looks only at his own habit, and his aim is his own development.
      - text: Engage in personal or self development
        correct: true
        why: Correct — Dev uses the reflection to work on himself as a person and team member, the fourth purpose on the slide.
  - key: q207
    type: mcq
    concept: purposes-of-reflection
    difficulty: 2
    stem: "Elif writes: \"Writing this, I realised I learnt more from our failed first prototype than from anything I read for the project.\" Which purpose of reflection is this?"
    options:
      - text: Critically review the readings set for the project
        why: Tempting because she compares the prototype with the readings, but she is not reviewing the readings; she is noticing how she herself learnt.
      - text: Build on theory from observation about how prototypes work in general
        why: Tempting because she observed something about prototypes, but she makes no general explanation; she recognises her own learning process.
      - text: Make decisions or resolve uncertainty
        why: Tempting because she now knows something new, but she is not settling a choice; she is recognising how she learnt.
      - text: Consider the process of her own learning — a process of recognition
        correct: true
        why: Correct — she recognises how her learning happened (through the failed prototype), which is the first purpose on the slide.
  - key: q208
    type: mcq
    concept: purposes-of-reflection
    difficulty: 1
    stem: On the slide, what can the "something" you critically review include?
    options:
      - text: Only your own behaviour, never other people's
        why: Tempting because the slides warn against dragging others down, but the second purpose says "our own behavior, that of others etc".
      - text: Our own behaviour, that of others, and so on
        correct: true
        why: "Correct — purpose 2: \"Critically review something – our own behavior, that of others etc\". Detachment applies when you review others."
      - text: Only the final outcome of the project, not the process
        why: Tempting because outcomes matter, but the slide names behaviour, your own and others', as things to review critically.
      - text: Only the theory behind the innovative project
        why: Tempting because the reflection must have theoretical underpinnings, but the slide's examples of what to review are behaviours, not theory alone.
  - key: q209
    type: mcq
    concept: purposes-of-reflection
    difficulty: 2
    stem: According to the "Purposes of reflection" slide, what does your self-reflective writing relate to?
    options:
      - text: The readings for the unit, summarised in your own words with references
        why: Tempting because theory is part of it, but the reflection is anchored in your group experiences and project, not a summary of readings.
      - text: Your group experiences, the project's theory, and how it may have shaped the project's type and outcome
        correct: true
        why: "Correct — the slide: \"it relates to your group experiences, theory on the innovative project you presented and how it may have affected the type and outcome of the project\"."
      - text: Your individual contribution only, written up separately from the rest of the team's work and outcome
        why: Tempting because the paper uses "I", but the slide ties the reflection to your group experiences, not just your solo work.
  - key: q210
    type: mcq
    concept: purposes-of-reflection
    difficulty: 2
    stem: How does the lecturer gloss "build on theory from observation" in the recording?
    options:
      - text: We ask the team to agree on which theory explains the project
        why: Tempting because the project is a team effort, but the lecturer describes an individual observing and explaining, not a team vote.
      - text: Choose a theory first, then find an example from the project that fits it
        why: "Tempting because essays often work that way, but the lecturer says the reverse: we observe and then come up with an explanation."
      - text: We observe, and come up with an explanation for what we observe
        correct: true
        why: "Correct — the lecturer: we observe and come up with an explanation for the things that we observe."
      - text: We repeat the observation until the theory is proved true
        why: Tempting because that sounds scientific, but the lecturer says nothing about proof; the purpose is building an explanation from what we saw.
  - key: q211
    type: mcq
    concept: purposes-of-reflection
    difficulty: 2
    stem: Which purpose does the lecturer describe as "step number one"?
    options:
      - text: Consider the process of our own learning (recognition)
        correct: true
        why: Correct — the lecturer says that recognising that we want to learn something from this experience is step number one.
      - text: Critically review something
        why: Tempting because critical review is often where reflections start, but the lecturer calls recognition of our own learning step one.
      - text: Make decisions or resolve uncertainty, since that is what reflecting is for
        why: Tempting because decisions are what reflection leads to, but it is the last purpose on the list; the lecturer's step one is recognition.
  - key: q212
    type: mcq
    concept: purposes-of-reflection
    difficulty: 3
    variant-of: q203
    stem: "Farid writes: \"Our ideas got noticeably better after we agreed to stop judging them during the first round, which suggests that holding back criticism early helps a team.\" Which purpose of reflection does this serve?"
    options:
      - text: Build on theory from observation
        correct: true
        why: Correct — Farid observes a change and proposes an explanation for it, the lecturer's gloss of building theory from observation.
      - text: Critically review the behaviour of the team leader
        why: Tempting because the team changed how it behaved, but no one's behaviour is being judged; he explains why the ideas improved.
      - text: Engage in personal or self development
        why: Tempting because Farid may change how he works, but the sentence is about a pattern in the team and an explanation for it, not his own growth.
      - text: Make decisions or resolve uncertainty
        why: Tempting because the explanation could guide future decisions, but nothing here is a decision; he is drawing an explanation from what he saw.
  - key: q213
    type: mcq
    concept: purposes-of-reflection
    difficulty: 3
    variant-of: q204
    stem: "Gia writes: \"Our leader made every decision alone, and after the second week the rest of us stopped contributing ideas.\" Which purpose of reflection is she serving, and what does the lecture add?"
    options:
      - text: Building theory from observation — and she should cite a reading on leadership
        why: Tempting because she observed the team, but she is judging the leader's conduct, not building an explanation; detachment is the lecture's caution here.
      - text: Making a decision — and she should say which teammate to work with next time
        why: Tempting because the reflection might lead there, but she has made no decision, and naming people to avoid would drag someone down.
      - text: Critically reviewing others' behaviour — and she should describe the leader's influence with detachment
        correct: true
        why: Correct — reviewing others' behaviour is purpose 2, and the slides say to avoid dragging someone down and to keep a level of detachment.
  - key: q214
    type: mcq
    concept: purposes-of-reflection
    difficulty: 2
    stem: Which of these is NOT one of the five purposes of reflection on the slides?
    options:
      - text: Make decisions or resolve uncertainty
        why: This is purpose 5 on the slide, so it is not the answer; the lecturer adds that we can make decisions based on our reflection.
      - text: Critically review something, including the behaviour of others
        why: This is purpose 2 on the slide, so it is not the answer; it covers our own behaviour and that of others.
      - text: Engage in personal or self development
        why: This is purpose 4 on the slide, so it is not the answer; reflection is used for personal or self development.
      - text: Persuade the marker that the team deserved a higher grade
        correct: true
        why: Correct — this is not a purpose of reflection; the five are recognition, critical review, theory from observation, self development and decisions.
  - key: q215
    type: mcq
    concept: purposes-of-reflection
    difficulty: 1
    stem: Which purpose of reflection is listed fifth, last on the slide?
    options:
      - text: Engage in personal or self development
        why: Tempting because it comes near the end, but it is fourth; the list closes with make decisions or resolve uncertainty.
      - text: Make decisions or resolve uncertainty
        correct: true
        why: Correct — the slide ends with "5. Make decisions or resolve uncertainty".
      - text: Consider the process of our own learning
        why: Tempting because it can feel like a conclusion, but it is the first purpose — the lecturer's "step number one".
      - text: Build on theory from observation
        why: Tempting because it sits in the middle of the list, but it is third; the fifth purpose is make decisions or resolve uncertainty.
  - key: q216
    type: truefalse
    concept: purposes-of-reflection
    difficulty: 1
    set: quickfire
    statement: "\"Engage in personal or self development\" is one of the five purposes of reflection on the Week 6 slides."
    answer: true
    why: True — it is purpose 4, between building on theory from observation and making decisions or resolving uncertainty.
  - key: q217
    type: truefalse
    concept: purposes-of-reflection
    difficulty: 2
    set: quickfire
    statement: The slides say the purposes of reflection concern only your own behaviour, never the behaviour of others.
    answer: false
