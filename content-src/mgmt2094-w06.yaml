  - key: q319
    type: short
    concept: revealing-information-wisely
    difficulty: 3
    prompt: "\"A reflective paper should be completely honest, so include everything you felt, about yourself and your teammates.\" Discuss, advising Priya: a teammate, Sam, missed three deadlines and the team cut a scene as a result; Priya also had a health problem during semester that she is uncomfortable discussing, which did not affect her work on the project."
    model: "The statement is half right: a reflective paper is honest about your experience, but it is not a place to reveal everything. Because it includes subjective feelings and opinions, the Week 6 slides ask you to reveal information wisely, starting with whether each detail is appropriate. Her health problem makes her uncomfortable and did not change the final outcome of her experience, so under the slide's rule she should leave it out; the lecturer confirms it is fine not to share such a feeling. If it had changed the outcome, she could include it while indicating her concerns about revealing it. Sam's missed deadlines did shape the project, because a scene was cut, so they belong in the reflection, but Priya must avoid dragging Sam down and keep a level of detachment as she describes his influence: \"three drafts arrived after the agreed dates, and we cut a scene to finish on time.\" Throughout, she should keep a professional, organised tone. The trade-off is that detachment can feel less honest than venting, but it keeps the focus on what happened and what she learnt, which is what will be assessed."
    rubric:
      - id: r1
        criterion: Concept — states the disclosure rules accurately
        marks: 2
        top-band: States the appropriateness question, the uncomfortable-unless-it-changed-the-outcome test, indicating concerns, tone and detachment.
        margin-note: Which test decides the health problem?
        authorities: []
      - id: r2
        criterion: Example — uses the unit's group-project reflection as the context
        marks: 1
        top-band: Places the advice in the self-reflective writing on the group project, as the slides do.
        margin-note: Anchor this in the unit's actual reflective task.
        authorities:
          - mgmt2094-example-group-project-reflection
      - id: r3
        criterion: Application — applies each rule to Priya's two issues
        marks: 3
        top-band: Leaves out the health problem (no effect on outcome) and includes Sam's deadlines with detachment, ideally with a rewritten sentence.
        margin-note: Show me the detached version of the Sam sentence.
        authorities: []
      - id: r4
        criterion: Evaluation — weighs a limit or trade-off
        marks: 2
        top-band: Notes a tension, such as detachment versus honesty, or when an uncomfortable reflection would have to go in.
        margin-note: What does detachment cost Priya, and why is it still worth it?
        authorities: []
