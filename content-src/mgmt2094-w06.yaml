  - key: q218
    type: truefalse
    concept: purposes-of-reflection
    difficulty: 2
    statement: In the recording, "build on theory from observation" means picking a theory first and then looking for an example that fits it.
    answer: false
    why: "False — the lecturer puts it the other way round: we observe, and then we come up with an explanation for what we observe."
  - key: q219
    type: short
    concept: purposes-of-reflection
    difficulty: 3
    prompt: "\"The purpose of a reflective paper is to record what happened in the group project.\" Discuss, applying the purposes of reflection to this project: you missed an early deadline, two teammates disagreed about the concept until week 5, and the final video was praised for its humour but criticised as too long."
    model: "The statement confuses recording with reflecting. Moon (1999) defines reflection as \"a form of mental processing with a purpose\", and the Week 6 slides list five purposes: consider the process of our own learning (recognition), critically review something, build on theory from observation, engage in personal or self development, and make decisions or resolve uncertainty. A record of events serves none of them; three of them fit this project well. First, critically reviewing my own behaviour: missing the early deadline put pressure on the team, and I can say so plainly. The same purpose lets me review the two teammates' disagreement, but with detachment, describing its effect on the project rather than blaming either of them. Second, building on theory from observation: the concept only settled in week 5, and I can offer an explanation for why, tied to the theory behind our project. Third, making decisions: next time I would propose an earlier cut-off for choosing the concept and a time limit for the video. The limit is that a short reflection cannot do all five purposes well, so choosing three and analysing them, rather than describing everything, is the better trade-off."
    rubric:
      - id: r1
        criterion: Concept — accurately states what reflection is and lists the purposes
        marks: 2
        top-band: Defines reflection with Moon's phrase and names the five purposes in the slide's wording.
        margin-note: Which five purposes? Use the slide's words.
        authorities:
          - mgmt2094-moon-1999
      - id: r2
        criterion: Example — uses the group-project reflection as the real context
        marks: 2
        top-band: Anchors the answer in the unit's self-reflective writing on the group project and its theory.
        margin-note: Tie this to the group project the slides describe.
        authorities:
          - mgmt2094-example-group-project-reflection
      - id: r3
        criterion: Application — applies three purposes to the facts given
        marks: 3
        top-band: Applies three distinct purposes to specific facts (deadline, disagreement, length), each producing a different kind of sentence.
        margin-note: Which fact does each purpose work on?
        authorities: []
      - id: r4
        criterion: Evaluation — notes limits or trade-offs
        marks: 2
        top-band: Recognises a limit, such as detachment when reviewing others or depth versus coverage in a short reflection.
        margin-note: What does focusing on three purposes cost or gain?
        authorities: []
  - key: q220
    type: match
    concept: purposes-of-reflection
    difficulty: 2
    prompt: Match each reflective sentence to the purpose of reflection it mainly serves.
    pairs:
      - left: "\"I now see that I learnt most when our first idea failed.\""
        right: Consider the process of our own learning
      - left: "\"I talked over others in our first meetings, which slowed us down.\""
        right: Critically review something
      - left: "\"We agreed faster once ideas were sketched, so sketches may help groups agree.\""
        right: Build on theory from observation
      - left: "\"I am working on speaking up earlier in group discussions.\""
        right: Engage in personal or self development
      - left: "\"Weighing the feedback, I will pitch the bolder concept next round.\""
        right: Make decisions or resolve uncertainty
  - key: q301
