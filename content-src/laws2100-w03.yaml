      the rule of recognition and so as a rule of the system" (CL 103). The rule is ultimate and supreme (CL 105–107);
      there

      may be several rules of recognition and one ultimate rule.


      Is the rule of recognition itself valid? "No such question can arise … it can neither be valid nor invalid but is
      simply

      accepted as appropriate for use in this way" — like the standard metre bar in Paris (CL 109).


      **Existence of a legal system** — two minimum conditions, necessary and sufficient: valid rules must be generally

      obeyed; and the rules of recognition, change and adjudication must be "effectively accepted as common public
      standards

      of official behaviour by its officials" (CL 109). The first is factual; the second is what Hart adds to Austin.
      Both

      concern existence, not legitimacy.


      Exam use: *Miller* shows judges reasoning with the rule of recognition.
  - slug: kelsen-pure-theory
    title: Kelsen's pure theory — coercive order, chain of validity, basic norm
    visual: diagram
    visual-brief: >-
      A pyramid of norms (the Stufenbau): a council regulation, the norm authorising the council, the statute, the
      constitution; at the apex the line turns back in time through earlier constitutions to the historically first
      constitution, above which floats a dashed, presupposed basic norm — 'you ought to obey the historically first
      constitution'.
    related:
      - recognition-vs-basic-norm
      - what-is-legal-positivism
    depends-on:
      - legal-obligation-and-social-rules
    contrasts-with:
      - rule-of-recognition-and-validity
    cases: []
    authorities:
      - kelsen-pure-theory-of-law
      - kelsen-pure-theory-and-analytical-jurisprudence
    verify: false
    body: >-
      For Kelsen, law is by its very nature a definite type of norm; "the law is a coercive order" (p 1) — coercion

      distinguishes it from other normative orders — and "it is a peculiarity of the law that it regulates its own
      creation,

      application and execution" (p 5). 


      His gangster is Hart's gunman: the two commands have the same subjective meaning, but "the command of the tax
      officer is

      authorized by an objectively valid legal norm, whereas the command of the gangster is not" (p 6). The search for
      the reason of validity reveals the hierarchical structure of a legal order (the

      *Stufenbau*).


      If a norm is valid, it is binding; validity cannot be a fact; only a competent authority can create a valid norm.
      A

      council regulation is valid because a higher norm authorised the council, and so up to the constitution, then back

      through earlier constitutions to the historically first constitution — the chain of validity. Why is that valid?
      We

      must presuppose a norm: you ought to obey the historically first constitution. This basic norm (*Grundnorm*) is a

      transcendental-logical presupposition. Validity is binding force, not membership.


      The theory is pure because it "answers the question of what the law is, not what it ought to be. The latter
      question is

      one of politics, while the pure theory of law is science" (1941).


      Exam use: purity is the strictest statement of the value-free ideal Question 1 tests.
  - slug: recognition-vs-basic-norm
    title: Hart's rule of recognition vs Kelsen's Grundnorm
    visual: diagram
    visual-brief: >-
      Two columns sharing one job — explaining legal validity — then three rows split them: fact versus presupposition
      (juristic hypothesis, fiction), neither valid nor invalid versus presupposed as valid, content varying by
      jurisdiction versus always the same content; a fourth row shows why Hart chose the name: law and morals can
      conflict.
    related:
      - rule-of-recognition-and-validity
      - kelsen-pure-theory
    depends-on:
      - rule-of-recognition-and-validity
      - kelsen-pure-theory
    contrasts-with:
      - rule-of-recognition-and-validity
      - kelsen-pure-theory
    cases: []
    authorities:
      - hart-the-concept-of-law
      - kelsen-pure-theory-of-law
    verify: false
    body: >-
      In Kelsen's theory the basic norm performs the same function as the rule of recognition in Hart's: each explains
      legal

      validity and the unity of a legal order. Hart knew Kelsen's work and discusses the basic norm in a long endnote.


      1. **Fact or presupposition.** For Hart the existence of a rule of recognition is a complex, empirical question of
      fact:
         a real social rule that exists if officials buy into it. For Kelsen the basic norm is a "juristic hypothesis", a
         "postulated ultimate rule", a "fiction" — presupposed, not part of the legal order.
      2. **Validity.** For Kelsen, a jurist/theorist must presuppose the validity of the basic norm. For Hart, the rule
      of
         recognition is neither valid nor invalid.
      3. **Content.** Kelsen's basic norm has always the same content ("who laid down the first constitution ought to be
         obeyed"); only the first constitution differs. For Hart, rules of recognition in different jurisdictions may well
         have different content.
      4. **Law and morals.** "One reason for using the expression 'rule of recognition' instead of a 'basic norm' is to
      avoid
         any commitment to Kelsen's view of the conflict between law and morals" (CL 293). For Kelsen a legal and a moral norm
         cannot both be valid at once, so no meaningful conflict is possible; Hart can accept such conflicts.

      Underneath: validity as membership (Hart) versus validity as binding force (Kelsen).


      Exam use: compare them on fact versus presupposition first.
  - slug: separation-of-law-and-morals
    title: The separation of law and morals — law as it is and as it ought to be
    visual: explainer
    visual-brief: >-
      Two circles, law and morality, overlapping as a matter of historical fact; the two "simple things" are drawn as
      two blocked arrows (immoral → not law; morally desirable → law), with a gate marked "express constitutional or
      legal provision" through which morality can enter.
    related:
      - what-is-legal-positivism
      - kelsen-pure-theory
    depends-on:
      - laws2100-w01-six-kinds-of-questions
    contrasts-with:
      - what-is-legal-positivism
    cases: []
    authorities:
      - green-adams-legal-positivism
      - austin-province-of-jurisprudence-determined
      - hart-the-concept-of-law
      - hart-positivism-and-the-separation-of-law-and-morals
    verify: false
    body: >-
      Green and Adams: positivism is "the thesis that the existence and content of law depends on social facts and not

      on its merits". Austin: "The existence of law is one thing; its merit and demerit another" (PJD 157). Hart: "it is
      in no

      sense a necessary truth that laws reproduce or satisfy certain demands of morality, though in fact they have often
      done

      so" (CL 185–186).


      In 'Positivism and the Separation of Law and Morals' (1958), part of the Hart–Fuller debate, Bentham and Austin

      "were not dry analysts fiddling with verbal distinctions while cities burn" but reformers. They never denied that
      many

      legal rules mirror moral rules as a matter of historical fact, and Bentham never denied that moral principles
      might

      enter a legal system through explicit legal provisions. They asserted two simple things: absent an express

      constitutional or legal provision, a rule's violating morality does not show it is not law; and a rule's being
      morally

      desirable does not show it is law (599).


      The utilitarian tradition defended three doctrines — separation of law and morals, the analytical study of legal

      concepts, and the imperative theory — and they are not a package.


      Law as it is versus law as it ought to be is defended by Bentham, Austin and Hart; some find it intellectually

      misleading and/or practically dangerous. Hart's three lines of criticism: law and morality; positivism and
      formalism in

      adjudication; morally evil laws (the Nazi regime).


      Exam use: separation denies a necessary connection, not every connection.
  - slug: what-is-legal-positivism
    title: Five meanings of 'positivism' and three senses of legal positivism
    visual: palace
    visual-brief: >-
      Five numbered rooms for Hart's five meanings (commands; no necessary connection; analysis of legal concepts;
      closed logical system; noncognitivism), with Bentham and Austin lighting rooms 1–3 and Kelsen rooms 2, 3 and 5; a
      final hall splits into three doors — general theory of law, methodology, political theory — each labelled with the
      kind of claim it makes.
    related:
      - separation-of-law-and-morals
      - kelsen-pure-theory
    depends-on:
      - separation-of-law-and-morals
      - laws2100-w01-general-and-descriptive-theory
    contrasts-with:
      - separation-of-law-and-morals
    cases: []
    authorities:
      - hart-positivism-and-the-separation-of-law-and-morals
      - hart-the-concept-of-law
    verify: false
    body: >-
      Hart identifies five meanings of 'positivism' in jurisprudence:


      1. laws are commands of human beings;

      2. there is no necessary connection between law and morals, or law as it is and ought to be;

      3. the analysis of legal concepts is worth pursuing and distinct from historical and sociological inquiries and
      from
         the criticism/appraisal of law;
      4. a legal system is a "closed logical system" in which correct decisions can be deduced from predetermined rules
      by
         logic alone;
      5. moral judgments cannot be established or defended by rational argument, evidence, or proof ("noncognitivism").


      Bentham and Austin held (1), (2) and (3), but not (4) and (5). Kelsen held (2), (3) and (5), but not (1) and (4).

      Working out where Hart stands tests your understanding of his theory.


      Three senses of legal positivism:


      - **A general theory of law** — the social facts, sources and separability theses: descriptive and conceptual
      claims
        about the nature of law.
      - **A methodology** — legal theory is a morally neutral, descriptive enterprise: a meta-theoretical claim about
      legal
        theory. Hart: "My account is descriptive in that it is morally neutral and has no justificatory aims" (CL 240).
      - **A political theory of law** — moral criteria of validity are not morally desirable, though conceptually
      possible,
        so law and morality should be kept separate: a prescriptive separability thesis.

      Exam use: Question 1 tests the methodological sense; say so, and do not answer with the first.
