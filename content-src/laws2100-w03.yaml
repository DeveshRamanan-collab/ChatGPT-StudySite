authorities:
  - slug: kelsen-pure-theory-of-law
    title: Hans Kelsen, The Pure Theory of Law (Reine Rechtslehre, 1934; 2nd ed 1960; English trans 1967)
    kind: other
    text: >-
      Law is – according to the Pure Theory of Law – by its very nature a definite type of norm (p 1). The law is a

      coercive order (p 1). "It is a peculiarity of the law that it regulates its own creation, application and
      execution"

      (p 5). "The answer is, that the command of the tax officer is authorized by an objectively valid legal norm,
      whereas the

      command of the gangster is not." (p 6)
    gloss: >-
      Kelsen's pure theory: law as a coercive, normative order whose validity runs up a hierarchical chain of
      authorisation to a presupposed basic norm.
    cases: []
    verify: false
  - slug: kelsen-pure-theory-and-analytical-jurisprudence
    title: Hans Kelsen, 'The Pure Theory of Law and Analytical Jurisprudence' (1941) 55(1) Harvard Law Review 44
    kind: article
    text: >-
      "The pure theory of law is a theory of positive law; a general theory of law, not a presentation or interpretation
      of

      a special legal order. … As a theory, its sole purpose is to know its subject. It answers the question of what the
      law

      is, not what it ought to be. The latter question is one of politics, while the pure theory of law is science."
    gloss: >-
      Kelsen presents the pure theory as a general, scientific theory of positive law, the most consistent version of
      legal positivism, essentially at one with Austin's analytical jurisprudence.
    cases: []
    verify: false
  - slug: hart-positivism-and-the-separation-of-law-and-morals
    title: H.L.A. Hart, 'Positivism and the Separation of Law and Morals' (1958) 71 Harvard Law Review
    kind: article
    text: >-
      "What both Bentham and Austin were anxious to assert were the following two simple things: first, in the absence
      of

      an expressed constitutional or legal provision, it could not follow from the mere fact that a rule violated
      standards of

      morality that it was not a rule of law; and, conversely, it could not follow from the mere fact that a rule was
      morally

      desirable that it was a rule of law." (599)
    gloss: >-
      Hart's side of the Hart–Fuller debate: defends the utilitarians' separation of law and morals and distinguishes
      five meanings of 'positivism'.
    cases: []
    verify: true
  - slug: green-adams-legal-positivism
    title: Leslie Green and Tom Adams, 'Legal Positivism', Stanford Encyclopedia of Philosophy
    kind: article
    text: >-
      Legal positivism is the thesis that the existence and content of law depends on social facts and not on its
      merits.
    gloss: >-
      The standard modern statement of legal positivism as a thesis about what the existence and content of law depend
      on.
    cases: []
    verify: false
questions:
  - key: q101
    type: mcq
    concept: legal-obligation-and-social-rules
    difficulty: 1
    set: pretest
    stem: What does Hart say the theory of law as coercive orders got right, despite its errors?
    options:
      - text: That law is at bottom a set of commands issued by a sovereign who is habitually obeyed by the bulk of society.
        why: >-
          Tempting because that is the theory's own central claim, but Hart rejects it; what he credits is a narrower
          observation about conduct, not the command model.
      - text: That where there is law, human conduct is made in some sense non-optional or obligatory.
        correct: true
        why: >-
          Correct — CL 82: the theory started from the perfectly correct appreciation that where there is law, human
          conduct is made in some sense non-optional or obligatory.
      - text: That legal obligations are best understood as predictions of what officials will do to those who disobey.
        why: >-
          Tempting because it sounds like a refinement of coercion, but that is the realist move Hart pushes against,
          not the insight he credits to the command theory.
      - text: That law and morality are necessarily connected because both make conduct obligatory.
        why: >-
          Tempting because morality also makes conduct non-optional, but Hart's point concerns law and coercion here,
          and he denies any necessary connection with morality.
  - key: q102
    type: mcq
    concept: legal-obligation-and-social-rules
    difficulty: 1
    stem: Hart says there is 'a difference, yet to be explained' between which two assertions?
    options:
      - text: That someone was obliged to do something and that he had an obligation to do it.
        correct: true
        why: >-
          Correct — CL 82, quoted on the slide: the gunman situation shows being obliged is different from having an
          obligation, and a theory of law must explain the difference.
      - text: That someone obeyed a habit and that someone obeyed a command issued by a person with power.
        why: >-
          Tempting because habits and commands both feature in Hart's critique of Austin, but the slide's contrast is
          between being obliged and having an obligation.
      - text: That a rule is valid and that a rule is morally good, or conformable to an assumed standard.
        why: >-
          Tempting because validity and merit are separated later in the lecture, but the difference Hart says is yet to
          be explained concerns obligation, not validity.
  - key: q103
    type: mcq
    concept: legal-obligation-and-social-rules
    difficulty: 2
    stem: >-
      A gunman demands your wallet; a tax officer demands your tax. Why does the lecture say the two look the same 'from
      a very factual standpoint'?
    options:
      - text: Because both are officials of the state acting under the authority of valid legal norms made by Parliament.
        why: >-
          Tempting because the tax officer is an official, but the gunman is not; the factual likeness lies in power and
          threatened consequences, not in shared authority.
      - text: Because in both cases the person complies only out of a feeling of moral duty to the demander.
        why: >-
          Tempting because obligation language suggests duty, but the lecture says the factual picture is power plus
          negative consequences, with no moral duty involved.
      - text: Because in both someone with power over me demands money, with negative consequences if I refuse.
        correct: true
        why: >-
          Correct — the lecture reconstructs both as someone who has power over me asking for money, with negative
          consequences if I do not comply; only the obligation differs.
      - text: Because both demands are backed by the same sanction, a fine imposed by a court under statute.
        why: >-
          Tempting because sanctions matter to Austin, but the gunman imposes no fine; the likeness is simply a powerful
          person, a demand and a threatened consequence.
  - key: q104
    type: mcq
    concept: legal-obligation-and-social-rules
    difficulty: 2
    stem: According to the lecture, why can a person who never pays tax still be said to have an obligation to pay it?
    options:
      - text: Because obligation, for Hart, is a matter of how likely it is that the person will be caught and fined.
        why: >-
          Tempting because enforcement often follows non-payment, but that is the predictive account Hart rejects; the
          obligation exists whether or not a sanction is likely.
      - text: Because a legal obligation does not depend on compliance or on feeling compelled; the rule applies regardless.
        correct: true
        why: >-
          Correct — the lecture stresses that even when people do not comply they are under an obligation;
          non-compliance does not dissolve the law or the obligation.
      - text: Because the person has agreed, by living in the country, to a social contract imposing the duty.
        why: >-
          Tempting because consent theories explain obligation elsewhere, but the lecture's point is Hart's rule-based
          account, and consent is not mentioned in this context.
  - key: q105
    type: mcq
    concept: legal-obligation-and-social-rules
    difficulty: 1
    stem: Which is NOT one of Hart's three salient differences between habits and rules?
    options:
      - text: Deviations from a rule are met with criticisms.
        why: >-
          Tempting to exclude because it sounds obvious, but it is the first difference on the slide: departures from a
          rule attract criticism, departures from a habit do not.
      - text: The rule is regarded as a good reason for making such criticism.
        why: >-
          Tempting to exclude because it sounds like the first point repeated, but it is the second difference: the rule
          itself is cited as the reason for criticism.
      - text: Rules, unlike habits, always involve a sanction imposed by a sovereign or by one of its officials.
        correct: true
        why: >-
          Correct — this is not on the list; Hart's differences concern criticism, the rule as a reason, and the
          internal aspect, not sanctions from a sovereign.
      - text: Social rules have an internal aspect, a critical reflective attitude to a pattern as a common standard.
        why: >-
          Tempting to exclude because it is the most abstract point, but it is the third difference (CL 57) and the one
          on which Hart's whole theory builds.
  - key: q106
    type: mcq
    concept: legal-obligation-and-social-rules
    difficulty: 2
    stem: >-
      Someone tries to jump a queue and is called out. When challenged, the others say 'that's not how you queue'. Which
      feature of a rule does their answer display?
    options:
      - text: That the queue is a habit, since most people happen to wait in line most of the time.
        why: >-
          Tempting because queuing is also a regular pattern, but the reply cites a standard as a reason, which is
          exactly what a mere habit cannot supply.
      - text: That the rule is enforced by an organised sanction which the queue-jumper has reason to fear.
        why: >-
          Tempting because being called out is unpleasant, but the lecture's point is that the rule is used as a reason,
          not that an organised sanction is threatened.
      - text: That the rule is regarded as a good reason for making the criticism.
        correct: true
        why: >-
          Correct — the people in the queue use the existence of the social rule as their reason for criticising the
          queue-jumper, Hart's second difference between rules and habits.
  - key: q107
    type: mcq
    concept: legal-obligation-and-social-rules
    difficulty: 2
    stem: Why does Hart say habits cannot explain legal obligation?
    options:
      - text: Because habits are too rare in modern societies to account for the regularity we see in legal systems.
        why: >-
          Tempting because a theory needs broad coverage, but habits are common; the problem is their kind, not their
          frequency, as the quotation on the slide makes clear.
      - text: Because habits are private mental states, and law must be public and observable by everyone.
        why: >-
          Tempting because Hart stresses public standards, but habits are observable patterns; the problem is that they
          are factual and not normative.
      - text: 'Because habits are not normative: they cannot confer rights or authority on anyone.'
        correct: true
        why: >-
          Correct — CL 60: habits are not 'normative'; they are factual and so cannot explain the authority and
          obligation we associate with law.
      - text: Because habits require the internal point of view, which only officials of the system possess.
        why: >-
          Tempting because the internal point of view matters to Hart, but it belongs to rules, not habits, and it is
          not confined to officials.
  - key: q108
    type: mcq
    concept: legal-obligation-and-social-rules
    difficulty: 3
    stem: >-
      A visitor from another planet watches a football match and records every regularity: players stop when a whistle
      blows, and they also hug after goals. What can the visitor NOT tell from this external point of view?
    options:
      - text: That some patterns of behaviour recur more often than others across the match.
        why: >-
          Tempting because the visitor lacks context, but recording how often a pattern recurs is exactly what the
          external point of view can do.
      - text: Which regularities respond to rules and which are just patterns, such as celebrating a goal.
        correct: true
        why: >-
          Correct — the lecture says from outside you can only register patterns; knowing which behaviour responds to
          rules requires the participants' internal point of view.
      - text: That the players are human beings who move about the field in teams of roughly equal size on each side.
        why: >-
          Tempting to pick because it seems basic, but such plain facts are visible from outside; the lecture's point is
          about rules, not about who the players are.
  - key: q109
    type: mcq
    concept: legal-obligation-and-social-rules
    difficulty: 2
    stem: According to the lecture, can you take the internal point of view towards rules you are not currently following?
    options:
      - text: No — the internal point of view belongs only to those playing at that moment.
        why: >-
          Tempting because it is the participants' point of view, but the lecture says you can understand how people buy
          into rules even while only watching.
      - text: Yes — a spectator who knows cricket understands players' rule-following while not playing.
        correct: true
        why: >-
          Correct — the lecture's examples are a religion one does not practise and a cricket match one only watches:
          with enough knowledge you understand the internal point of view.
      - text: Yes, but only if you feel the same compulsion to obey that the participants actually feel.
        why: >-
          Tempting because feelings are often linked with rules, but Hart denies that the internal point of view is a
          matter of feelings of compulsion.
      - text: No — outsiders can only ever take the external point of view, like the alien.
        why: >-
          Tempting because the alien is the lecture's outsider, but the alien lacks knowledge of the practice; an
          informed observer can understand the internal point of view.
  - key: q110
    type: mcq
    concept: legal-obligation-and-social-rules
    difficulty: 3
    stem: Why does Hart describe the internal aspect of rules as a 'critical reflective attitude' rather than a feeling?
    options:
      - text: Because he wants to show that rules exist only in the minds of officials, never of private persons.
        why: >-
          Tempting because officials matter later, but the choice of phrase is about the nature of the attitude, not
          about who holds it.
      - text: Because feelings are too unreliable to measure, so a science of law must ignore psychology completely.
        why: >-
          Tempting because Hart wants a rigorous theory, but he does not say psychology must be ignored; he says the
          internal aspect is not the same as feelings.
      - text: >-
          Because the internal aspect is not just feelings of compulsion, which realists stressed, but using rules as
          standards and reasons.
        correct: true
        why: >-
          Correct — the lecture says Hart distinguishes his view from those, like the Scandinavian realists, who focus
          on feelings and play down the rational aspect of the internal point of view.
  - key: q111
    type: mcq
    concept: legal-obligation-and-social-rules
    difficulty: 3
    stem: >-
      Some legal realists explain obligation as a prediction of future negative consequences. What is Hart's reply,
      according to the lecture?
    options:
      - text: That predictions are accurate only in stable legal systems, so the account fails for new states.
        why: >-
          Tempting because stability matters to prediction, but Hart's reply is not about accuracy; it is that the
          account misses how rules work as reasons.
      - text: That consequences matter only for criminal law, while obligation in private law rests on consent.
        why: >-
          Tempting because the gunman example sounds criminal, but Hart's reply is general and does not divide law into
          criminal and private branches.
      - text: That realists are right, and Hart only adds that the consequences must be imposed by officials.
        why: >-
          Tempting because officials are central to Hart's theory, but Hart pushes against the predictive account rather
          than refining it.
      - text: That people who accept rules treat them as reasons to criticise others and to act themselves.
        correct: true
        why: >-
          Correct — the lecture says Hart replies that those who buy into rules see them as reasons for criticism and
          reasons for their own action, which a prediction cannot capture.
  - key: q112
    type: mcq
    concept: legal-obligation-and-social-rules
    difficulty: 2
    stem: Which later theorist, who studied under Hart, is said to develop the idea that rules create 'reasons for action'?
    options:
      - text: Joseph Raz.
        correct: true
        why: >-
          Correct — the lecture says Raz, who studied under Hart, develops this idea, notably in his book on norms and
          practical reasoning, drawing on the analysis in The Concept of Law.
      - text: Hans Kelsen, in the chapter on the dynamic aspect of law in the second edition of the Pure Theory.
        why: >-
          Tempting because Kelsen is this week's other theorist, but he did not study under Hart, and the lecture
          credits the reasons-for-action idea to Raz.
      - text: Lon Fuller, in his reply to Professor Hart in the Harvard Law Review debate of 1958.
        why: >-
          Tempting because Fuller debated Hart in 1958, but he was Hart's critic, not his student, and the
          reasons-for-action idea is credited to Raz.
  - key: q113
    type: mcq
    concept: legal-obligation-and-social-rules
    difficulty: 3
    stem: Which statement best explains why the idea of a social rule is so important to Hart's project?
    options:
      - text: It shows that every social rule is already a legal rule, so law needs no rules of a different kind.
        why: >-
          Tempting because Hart moves from social rules to legal rules, but he goes on to add secondary rules of a
          different kind; social rules alone are not a legal system.
      - text: It is key both to his criticism of Austin and to the development of his own theory of law.
        correct: true
        why: >-
          Correct — the lecture says the idea of a rule is key to Hart's criticism of Austin and also to the development
          of his own theory, the union of primary and secondary rules.
      - text: It shows that law is ultimately grounded in morality, since social rules are moral rules.
        why: >-
          Tempting because social rules make conduct non-optional, but Hart explains legal normativity as independent of
          both purely factual and moral considerations.
      - text: It shows that law is really a game like chess, so legal theory is just the study of games.
        why: >-
          Tempting because Hart uses games as examples, but he uses them to illustrate rules, not to reduce law to a
          game; playing law is not playing chess.
  - key: q114
    type: mcq
    concept: legal-obligation-and-social-rules
    difficulty: 4
    contrasts-with:
      - separation-of-law-and-morals
    stem: >-
      A student writes: 'For Hart, legal obligation exists because legal obligations track moral obligations.' What is
      the best correction?
    options:
      - text: Hart agrees, but adds that the moral obligations must be recognised by the officials of the system.
        why: >-
          Tempting because officials matter to Hart, but the claim that legal obligations are parasitic on moral ones is
          the natural law view Hart pushes against.
      - text: Hart explains legal obligation through social rules, as independent of pure fact and of morality.
        correct: true
        why: >-
          Correct — the lecture says Hart wants to explain legal normativity as something not purely factual and not
          moral, though it interacts with both; the tracking claim belongs to his natural law critics.
      - text: Hart says legal obligation is nothing but the fear of sanctions, which morality cannot explain.
        why: >-
          Tempting because it rejects the moral view, but it adopts the Austinian view Hart also rejects as too
          reductive an explanation of legal obligation.
      - text: Hart thinks the question of legal obligation cannot be answered, so he sets it aside in chapter 5.
        why: >-
          Tempting because Hart says the difference is 'yet to be explained', but he then explains it; obligation is the
          key problem of chapter 5.
  - key: q115
    type: mcq
    concept: legal-obligation-and-social-rules
    difficulty: 2
    variant-of: q106
    stem: >-
      A new club member keeps his hat on indoors. Nobody comments, and nobody would. On Hart's test, is 'members remove
      hats indoors' a rule or a habit in this club?
    options:
      - text: A habit — there is convergent behaviour, but deviation meets no criticism and no rule is cited.
        correct: true
        why: >-
          Correct — on Hart's three differences, convergent behaviour alone is a habit; a rule would show criticism of
          deviation, the rule as reason, and an internal aspect.
      - text: A rule — most members do remove their hats, and that convergence is enough for a rule to exist.
        why: >-
          Tempting because a pattern is visible, but Hart says habits and rules share convergence; it is the criticism
          and the internal aspect that mark a rule.
      - text: A rule — because any regular behaviour in an organised club is set down by its committee.
        why: >-
          Tempting because clubs have committees, but nothing in the facts shows a rule laid down or accepted; on Hart's
          test the missing criticism is decisive.
  - key: q116
    type: mcq
    concept: legal-obligation-and-social-rules
    difficulty: 3
    variant-of: q104
    stem: >-
      A driver stops at a red light only because she fears the fine. On the lecture's account of Austin and Hart, which
      description fits?
    options:
      - text: >-
          Austin and Hart agree: she is under a legal obligation because a sanction is threatened against anyone who
          runs the light.
        why: >-
          Tempting because both discuss sanctions, but Hart says explaining obligation by sanctions alone is too
          reductive; the two do not agree here.
      - text: Hart would say she is under no legal obligation, because she does not accept the rule.
        why: >-
          Tempting because acceptance matters to Hart, but the lecture stresses that obligation exists even for those
          who do not buy into the rule or comply.
      - text: Austin would explain her obligation by the sanction; Hart says that is too reductive, as a rule applies.
        correct: true
        why: >-
          Correct — the lecture gives this example: for someone like Austin you stop because you do not want to be
          fined; Hart says that is too reductive an explanation of legal obligation.
  - key: q117
    type: truefalse
    set: quickfire
    concept: legal-obligation-and-social-rules
    difficulty: 1
    statement: For Hart, habits are normative because they can confer rights or authority on people.
    answer: false
    why: >-
      False — CL 60 says the opposite: habits are not 'normative'; they cannot confer rights or authority on anyone,
      which is why rules are needed.
  - key: q118
    type: truefalse
    set: quickfire
    concept: legal-obligation-and-social-rules
    difficulty: 2
    statement: >-
      The lecture says the internal point of view can be understood by someone who is only watching a practice, not
      participating in it.
    answer: true
    why: >-
      True — the examples are a religion one does not practise and a cricket match one only watches: with enough
      knowledge you can understand the participants' point of view.
  - key: q119
    type: truefalse
    set: quickfire
    concept: legal-obligation-and-social-rules
    difficulty: 2
    statement: For Hart, the internal aspect of rules is a matter of feelings of compulsion.
    answer: false
    why: >-
      False — Hart calls it a critical reflective attitude and distinguishes it from feelings of compulsion, which the
      Scandinavian realists emphasised.
  - key: q120
    type: short
    concept: legal-obligation-and-social-rules
    difficulty: 3
    prompt: >-
      'Hart explains legal obligation better than a theory of law as coercive orders.' Discuss, with reference to the
      gunman situation and the idea of a social rule.
    model: >-
      Hart's account is better because it explains a difference the command model cannot see. Both theories start from
      the

      correct appreciation that where there is law, conduct is made non-optional (CL 82). But the gunman and the tax
      officer

      look the same factually: someone with power demands money and threatens consequences. Hart argues there is a

      difference between being obliged and having an obligation, and explains it through social rules. Unlike habits,
      rules

      attract criticism when broken, are treated as good reasons for that criticism, and have an internal aspect — a
      critical

      reflective attitude to a pattern as a common standard (CL 57). That is why a tax evader is still under an
      obligation.

      The strongest counterargument is Austin's: at the end of the day we stop at the light to avoid a fine, and the
      realists

      add that obligation is a prediction of consequences. But these accounts miss how participants use rules as reasons
      to

      criticise and to act. On balance Hart's is the better account on the command theory's own terms: it explains the

      normative force of law, not merely its power.
    rubric:
      - id: r1
        criterion: Thesis — takes a clear position on whether Hart explains obligation better.
        marks: 2
        top-band: States a qualified thesis in the first sentence and keeps to it.
        margin-note: Better in what respect?
        authorities: []
      - id: r2
        criterion: Argument — explains obliged vs having an obligation and the three differences between habits and rules.
        marks: 3
        top-band: Uses CL 82 and CL 57/60 accurately and links them to the gunman and tax officer.
        margin-note: Show why the facts alone cannot tell them apart.
        authorities:
          - hart-the-concept-of-law
      - id: r3
        criterion: Counterargument — puts the coercion/prediction view at full strength.
        marks: 2
        top-band: Gives Austin's sanction account and the realists' prediction account charitably.
        margin-note: Is the fear of a fine really not enough?
        authorities:
          - austin-province-of-jurisprudence-determined
      - id: r4
        criterion: Evaluation — weighs the two and reaches a reasoned verdict.
        marks: 2
        top-band: Explains why rules as reasons answers the objection, and on whose criteria.
        margin-note: Why does your conclusion survive the objection?
        authorities: []
  - key: q201
    type: mcq
    concept: primary-and-secondary-rules
    difficulty: 1
    set: pretest
    stem: According to Hart, what are the three main defects of a simple social structure of primary rules of obligation?
    options:
      - text: It is unjust, undemocratic and unstable.
        why: >-
          Tempting because these sound like the flaws of a bad society, but Hart's list is structural, not moral:
          uncertainty, static character and inefficiency.
      - text: It is uncertain, it has a static character, and it is inefficient.
        correct: true
        why: >-
          Correct — the slide lists exactly these three defects, each later remedied by a different type of secondary
          rule.
      - text: It lacks a sovereign, it lacks sanctions, and it lacks written laws.
        why: >-
          Tempting because these are Austinian ideas, but Hart's defects concern how primary rules are identified,
          changed and enforced, not the absence of a sovereign.
      - text: It is too harsh, too slow to punish, and too dependent on the elders.
        why: >-
          Tempting because slowness echoes inefficiency, but harshness and dependence on elders are not on Hart's list;
          the defects are uncertainty, stasis and inefficiency.
  - key: q202
    type: mcq
    concept: primary-and-secondary-rules
    difficulty: 1
    stem: Which secondary rule remedies the uncertainty of a regime of primary rules?
    options:
      - text: Rules of change.
        why: >-
          Tempting because change can clarify a rule, but rules of change remedy the static quality of primary rules,
          not their uncertainty.
      - text: The rule of recognition.
        correct: true
        why: >-
          Correct — the slide pairs uncertainty with the rule of recognition, which provides authoritative criteria for
          identifying the primary rules.
      - text: Rules of adjudication, applied by a third party.
        why: >-
          Tempting because a judge can settle what a rule means, but rules of adjudication remedy inefficiency in
          enforcing the rules, not uncertainty.
  - key: q203
    type: mcq
    concept: primary-and-secondary-rules
    difficulty: 1
    stem: Which secondary rule remedies the static quality of primary rules?
    options:
      - text: The rule of recognition, which identifies the valid primary rules.
        why: >-
          Tempting because recognition is the most important secondary rule, but it remedies uncertainty; the static
          quality is remedied by rules of change.
      - text: Rules of adjudication, which authorise a third party to settle disputes.
        why: >-
          Tempting because courts can develop rules, but on Hart's scheme rules of adjudication remedy inefficiency, not
          the static character of the rules.
      - text: Rules of change.
        correct: true
        why: >-
          Correct — rules of change empower someone to change existing rules or create new ones, remedying the static
          character of a regime of primary rules.
      - text: Primary rules of obligation that are more detailed.
        why: >-
          Tempting because detail might help rules adapt, but the remedy for each defect is a secondary rule of a
          different kind, not more primary rules.
  - key: q204
    type: mcq
    concept: primary-and-secondary-rules
    difficulty: 2
    stem: >-
      A community argues endlessly over whether a neighbour broke its rule on grazing. It agrees that a respected
      outsider will decide such disputes. Which of Hart's secondary rules has it created?
    options:
      - text: A rule of change, because deciding the dispute alters the existing rule on grazing.
        why: >-
          Tempting because a decision can shape the rule, but the facts are about settling whether the rule was broken,
          which is the job of rules of adjudication.
      - text: A rule of adjudication, remedying the inefficiency of enforcing the rules.
        correct: true
        why: >-
          Correct — the lecture says calling in a third party to adjudicate empowers someone to settle disagreements,
          remedying inefficiency in enforcing the community's rules.
      - text: A rule of recognition, because the outsider will now identify what the rules are.
        why: >-
          Tempting because deciding a dispute involves identifying the rule, but the defect remedied here is inefficient
          enforcement, not uncertainty about content.
  - key: q205
    type: mcq
    concept: primary-and-secondary-rules
    difficulty: 2
    stem: >-
      An island community discovers it can fish and calls a general assembly to make a new rule about fishing. In Hart's
      terms, what is the assembly doing?
    options:
      - text: Applying the rule of recognition to discover an existing custom of the island about fishing.
        why: >-
          Tempting because customs can be recognised, but the community never had to deal with fishing before; it is
          creating a new rule, not finding an old one.
      - text: Adjudicating a dispute between fishers about who broke the community's rules.
        why: >-
          Tempting because disputes may follow, but no breach is alleged; the assembly is making a new rule, which is
          the business of rules of change.
      - text: Exercising a rule of change that empowers it to create new rules, remedying stasis.
        correct: true
        why: >-
          Correct — the lecture's fishing example shows the community investing itself with authority to create a new
          rule, a rule of change remedying the static character of its rules.
      - text: Creating a new primary rule without any secondary rule at all.
        why: >-
          Tempting because a fishing rule is primary, but empowering the assembly to make it is itself a secondary rule;
          Hart's point is the empowerment.
  - key: q206
    type: mcq
    concept: primary-and-secondary-rules
    difficulty: 2
    stem: >-
      What does Hart say results from combining primary rules of obligation with secondary rules of recognition, change
      and adjudication?
    options:
      - text: A complete legal system, containing every element of the law of a modern state.
        why: >-
          Tempting because the union is central, but Hart says it is the heart of a legal system, not the whole; further
          elements appear as we move from the centre.
      - text: >-
          The heart of a legal system, and a powerful tool for analysing what has puzzled jurists and political
          theorists.
        correct: true
        why: >-
          Correct — CL 98: we have here not only the heart of a legal system, but a most powerful tool for the analysis
          of much that has puzzled both the jurist and the political theorist.
      - text: A moral order that justifies the obedience of citizens to their officials.
        why: >-
          Tempting because a legal system claims obedience, but Hart's account is descriptive; the union explains
          structure, not moral justification.
  - key: q207
    type: mcq
    concept: primary-and-secondary-rules
    difficulty: 2
    stem: Why does the lecture say Hart's account of the three defects is 'not a sociological investigation'?
    options:
      - text: Because it is more like a thought experiment about why a community would add secondary rules.
        correct: true
        why: >-
          Correct — the lecture calls it almost a thought experiment: imagining a small society with only primary rules
          shows why it would supplement them with secondary rules.
      - text: Because Hart relies on anthropological fieldwork, not on sociological surveys of modern societies.
        why: >-
          Tempting because primitive law is mentioned, but the lecture says the account is not an empirical
          investigation of any kind; it is closer to a thought experiment.
      - text: Because Hart thinks sociology is irrelevant to legal theory and should be ignored.
        why: >-
          Tempting because the account is analytical, but Hart elsewhere calls his book an essay in descriptive
          sociology; the point is only that this passage is a thought experiment.
      - text: Because the defects are moral failings, which sociology cannot measure or describe.
        why: >-
          Tempting because 'defect' sounds evaluative, but Hart presents them as structural problems of a regime of
          primary rules, not as moral failings.
  - key: q208
    type: mcq
    concept: primary-and-secondary-rules
    difficulty: 3
    stem: >-
      One jurisdiction has certain matters decided by a jury; another has similar matters decided by a judge. What does
      the lecture draw from this?
    options:
      - text: That only one of the two has genuine rules of adjudication, since a jury is not an official.
        why: >-
          Tempting because judges are officials par excellence, but the lecture says both systems have rules of
          adjudication, with different content.
      - text: That the jury system is more democratic, so it is the better rule of adjudication for a community.
        why: >-
          Tempting because the lecture's assembly example mentions democracy, but Hart does not rank the two; the
          example shows content varying while the rule type stays.
      - text: >-
          That the content of the secondary rule is not what matters to Hart; what matters is that some rule empowers
          someone to adjudicate.
        correct: true
        why: >-
          Correct — the lecture says the content of these secondary rules is not that important; what interests Hart is
          identifying the problem and the kind of rule that solves it.
      - text: That juries show law depends on popular morality rather than on rules.
        why: >-
          Tempting because juries represent the community, but the example is about variation in the content of rules of
          adjudication, not about morality.
  - key: q209
    type: mcq
    concept: primary-and-secondary-rules
    difficulty: 3
    stem: How does Hart's focus differ from Austin's, according to the lecture?
    options:
      - text: Austin focused on the legal system as a whole; Hart focused on the individual law.
        why: >-
          Tempting because both terms appear, but it is the other way around: Austin's unit was the individual command,
          Hart's the system.
      - text: Austin focused on the individual law as a command; Hart and Kelsen look at the system as a whole.
        correct: true
        why: >-
          Correct — the lecture says Austin defined a law as the sovereign's command, while Hart and Kelsen take a
          systematic view, one of the similarities between them.
      - text: Austin and Hart both focused on the legal system as a whole; only Kelsen focused on individual norms.
        why: >-
          Tempting because Kelsen speaks of norms, but the lecture groups Hart and Kelsen together as systematic
          thinkers against Austin's focus on individual laws.
  - key: q210
    type: mcq
    concept: primary-and-secondary-rules
    difficulty: 3
    stem: What is the paradigm (central) case of law for Hart, according to the lecture?
    options:
      - text: International law, the closest thing to law we have beyond the state.
        why: >-
          Tempting because Hart gives international law a chapter, but he treats it as a non-central case; the central
          case is municipal law.
      - text: Primitive law, where only primary rules exist.
        why: >-
          Tempting because Hart's thought experiment starts there, but a regime of only primary rules is his starting
          point, not his paradigm of law.
      - text: The law of the modern state.
        correct: true
        why: >-
          Correct — the lecture says Hart focuses on the central, paradigm or standard case of law, which for him is the
          law of the modern state, a legal system as we know it.
      - text: Any rule system with recognition, change and adjudication, including FIFA's.
        why: >-
          Tempting because FIFA has something like secondary rules, but the lecture raises FIFA as a problem for Hart's
          theory, not as his paradigm of law.
  - key: q211
    type: mcq
    concept: primary-and-secondary-rules
    difficulty: 3
    stem: For Hart, what is international law?
    options:
      - text: A legal system, since it has a basic norm or rule of recognition like municipal law, as Kelsen insists.
        why: >-
          Tempting because Kelsen and many modern theorists say so, but Hart takes the opposed view: international law
          lacks the union of primary and secondary rules.
      - text: Not law at all, since it lacks a sovereign who issues commands backed by sanctions.
        why: >-
          Tempting because that is roughly Austin's conclusion, but Hart says international law is law, even though it
          is not a legal system.
      - text: 'Law, but not a legal system: separate primary rules of obligation, not united by secondary rules.'
        correct: true
        why: >-
          Correct — CL 233 and the lecture: international law consists of separate primary rules; it resembles municipal
          law in function and content but differs in form.
      - text: Morality, not law, because states comply only when it is in their interests.
        why: >-
          Tempting because compliance is patchy, but Hart says non-compliance does not disintegrate law, and he classes
          international law as law.
  - key: q212
    type: mcq
    concept: primary-and-secondary-rules
    difficulty: 4
    stem: The lecture mentions FIFA and large criminal organisations. What problem for Hart's theory do they raise?
    options:
      - text: That they have no rules at all, which shows that law requires sanctions.
        why: >-
          Tempting because criminal groups defy the law, but the lecture's point is that such organisations do have
          complex rules, including something like secondary rules.
      - text: That they prove international law is a legal system, since they operate across borders.
        why: >-
          Tempting because FIFA is international, but the example is about demarcating law from other rule-governed
          practices, not about international law.
      - text: 'A demarcation problem: if structure alone marks law, the union may be over-inclusive.'
        correct: true
        why: >-
          Correct — the lecture says if we look at structure alone, organisations like FIFA or a mafia also have rules
          of recognition, change and adjudication, so the theory may be over-inclusive.
  - key: q213
    type: mcq
    concept: primary-and-secondary-rules
    difficulty: 2
    stem: Hart says the union of primary and secondary rules is 'at the centre of a legal system'. What does he add?
    options:
      - text: 'That it is not the whole: moving from the centre, we must accommodate elements of a different character.'
        correct: true
        why: >-
          Correct — at the end of chapter 5 Hart says the union is at the centre but not the whole; as we move away we
          shall accommodate elements of a different character.
      - text: That it is the whole of the legal system, and nothing else needs to be explained.
        why: Tempting because Hart calls it the heart of a legal system, but he expressly says it is not the whole.
      - text: That it applies only to common law systems, where judges make law.
        why: >-
          Tempting because Hart was an English lawyer, but the theory is meant to be general; the qualification concerns
          centre and periphery, not legal families.
  - key: q214
    type: mcq
    concept: primary-and-secondary-rules
    difficulty: 3
    variant-of: q202
    stem: >-
      A small community's elders tell everyone what the customs require whenever there is doubt. Which defect is being
      remedied, and by what?
    options:
      - text: Inefficiency, remedied by rules of adjudication, since the elders are acting as judges.
        why: >-
          Tempting because elders may also settle disputes, but here they fix the content of rules when there is doubt,
          which remedies uncertainty.
      - text: Uncertainty, remedied by something like a rule of recognition.
        correct: true
        why: >-
          Correct — the lecture's example: the experienced members who know the traditions are looked to as authority on
          the content of a rule, fixing it authoritatively.
      - text: Static quality, remedied by rules of change, since the elders adapt customs to new circumstances.
        why: >-
          Tempting because customs do change, but the elders here state what existing customs require; changing them
          would be a rule of change.
      - text: No defect at all, since customary rules are always certain and need no remedy.
        why: >-
          Tempting because customs can be well known, but the lecture says some rules attract disagreement about their
          content, which is the defect of uncertainty.
  - key: q215
    type: mcq
    concept: primary-and-secondary-rules
    difficulty: 3
    variant-of: q203
    stem: >-
      A parliament passes a statute repealing an old law and enacting a new one. Which of Hart's secondary rules
      empowers it to do so?
    options:
      - text: The rule of recognition, since the new statute will be identified as valid law.
        why: >-
          Tempting because the statute will pass the recognition test, but the power to repeal and enact is conferred by
          rules of change.
      - text: Rules of adjudication, since the statute will later be applied by courts.
        why: >-
          Tempting because courts will apply it, but adjudication concerns settling breaches; the power to change the
          law is a rule of change.
      - text: Rules of change.
        correct: true
        why: >-
          Correct — the lecture says this is what an institution like parliament does: legislative power is the power to
          change existing laws or create new ones.
  - key: q216
    type: mcq
    concept: primary-and-secondary-rules
    difficulty: 4
    stem: Why does the lecture say some people think Hart's book should have been called 'The Concept of a Legal System'?
    options:
      - text: Because Hart denies that anything outside a legal system can be called law.
        why: >-
          Tempting because the book centres on legal systems, but Hart says international law is law without being a
          system; his idea of law is broader.
      - text: Because the book mainly focuses on legal systems, though Hart's idea of law is broader.
        correct: true
        why: >-
          Correct — the lecture says Hart's idea of law is broader than a legal system, but what the book really does is
          focus on the idea of a legal system.
      - text: Because Hart borrowed the idea of a legal system from Kelsen and wished to credit him.
        why: >-
          Tempting because Kelsen also looks at legal orders, but the suggested title reflects the book's focus, not a
          debt to Kelsen.
      - text: Because the book is mainly about how primitive societies become legal systems over time.
        why: >-
          Tempting because the thought experiment starts with primitive society, but that is a device; the book's focus
          is the structure of a legal system.
  - key: q217
    type: truefalse
    set: quickfire
    concept: primary-and-secondary-rules
    difficulty: 1
    statement: For Hart, rules of adjudication remedy the inefficiency of a regime of primary rules.
    answer: true
    why: >-
      True — the slide pairs inefficiency with rules of adjudication, which authorise someone to determine breaches of
      the rules authoritatively.
  - key: q218
    type: truefalse
    set: quickfire
    concept: primary-and-secondary-rules
    difficulty: 2
    statement: For Hart, international law is not law because it lacks secondary rules.
    answer: false
    why: >-
      False — Hart says international law lacks secondary rules and so is not a legal system, but it is still law:
      separate primary rules, similar in function and content.
  - key: q219
    type: truefalse
    set: quickfire
    concept: primary-and-secondary-rules
    difficulty: 2
    statement: >-
      The lecture presents Hart's story of the three defects as more like a thought experiment than a sociological
      investigation.
    answer: true
    why: >-
      True — the lecture says it is not a sociological investigation but almost a thought experiment about why a
      community would add secondary rules.
  - key: q220
    type: short
    concept: primary-and-secondary-rules
    difficulty: 4
    prompt: '''Hart''s account of the defects of a regime of primary rules is purely descriptive.'' Discuss.'
    model: >-
      The account is presented as descriptive, but its key terms carry evaluation, and the essay should say what kind.
      Hart

      imagines a community with only primary rules and finds three main defects — uncertainty, static character and

      inefficiency — each remedied by supplementing primary rules with secondary rules of a different kind: recognition,

      change and adjudication (CL 94). The union is 'the heart of a legal system' (CL 98). The lecture treats this as a
      thought

      experiment, not a sociological investigation, and Hart's stated aim is a theory that is morally neutral with no

      justificatory aims (CL 240). The strongest counterargument is that calling uncertainty, stasis and inefficiency

      'defects' presupposes that certainty, adaptability and efficient enforcement are goods a society ought to want, so
      value

      enters the account at its foundation. In reply, these may be judgments about what a rule system needs to function,
      not

      moral judgments; Hart does not commend any legal system. On balance the account is not value-free, but it can
      still be

      morally neutral — which is all Hart claimed, and the distinction Question 1 turns on.
    rubric:
      - id: r1
        criterion: Thesis — takes a precise position on the sense in which the account is (or is not) descriptive.
        marks: 2
        top-band: Distinguishes value-free from morally neutral in the thesis.
        margin-note: Descriptive in which sense?
        authorities: []
      - id: r2
        criterion: Argument — sets out the three defects, remedies and the union accurately.
        marks: 3
        top-band: Pairs each defect with its remedy and quotes CL 94 and CL 98.
        margin-note: Which defect goes with which rule?
        authorities:
          - hart-the-concept-of-law
      - id: r3
        criterion: Counterargument — explains why calling them 'defects' imports values.
        marks: 2
        top-band: States the evaluative objection at full strength.
        margin-note: Who decides these are defects?
        authorities: []
      - id: r4
        criterion: Evaluation — reaches a reasoned verdict linked to the essay question.
        marks: 2
        top-band: Concludes with a defensible line between functional and moral evaluation.
        margin-note: Is all evaluation moral evaluation?
        authorities: []
  - key: q301
    type: mcq
    concept: rule-of-recognition-and-validity
    difficulty: 1
    set: pretest
    stem: For Hart, what does it mean to say that a given rule is valid?
    options:
      - text: That the rule is morally justified and so deserves the obedience of everyone who is subject to it.
        why: >-
          Tempting because 'valid' can sound like 'justified', but Hart's validity is about membership in a system, not
          about moral merit.
      - text: That the rule is generally obeyed by the population and enforced by the courts.
        why: >-
          Tempting because general obedience is one condition for a legal system to exist, but it is not what validity
          of a particular rule means.
      - text: That it passes all the tests provided by the rule of recognition, and so is a rule of the system.
        correct: true
        why: >-
          Correct — CL 103: to say a rule is valid is to recognise it as passing all the tests provided by the rule of
          recognition and so as a rule of the system.
  - key: q302
    type: mcq
    concept: rule-of-recognition-and-validity
    difficulty: 1
    contrasts-with:
      - kelsen-pure-theory
    stem: 'Hart''s account of legal validity is best summarised as:'
    options:
      - text: validity as membership of a system of rules.
        correct: true
        why: >-
          Correct — the slide pairs validity and membership: a law is valid if it belongs to the system, which it does
          if it satisfies the rule of recognition's criteria.
      - text: validity as the binding force of a norm, traced to a presupposed basic norm.
        why: >-
          Tempting because it is the other major account this week, but binding force traced to a basic norm is Kelsen's
          view; Hart's is membership.
      - text: validity as the probability that courts will enforce a rule against a defendant.
        why: >-
          Tempting because courts apply valid rules, but a predictive account is the realist view Hart rejects; validity
          is satisfying the recognition criteria.
      - text: validity as conformity with the demands of morality and justice.
        why: >-
          Tempting because natural law theorists link validity and morality, but Hart's positivist account makes
          validity a matter of the system's criteria.
  - key: q303
    type: mcq
    concept: rule-of-recognition-and-validity
    difficulty: 2
    stem: Which is NOT among the forms Hart says the criteria of a rule of recognition may take (CL 100)?
    options:
      - text: Reference to an authoritative text.
        why: >-
          Tempting to exclude because it sounds religious, but reference to an authoritative text is the first form on
          Hart's list.
      - text: Past judicial decisions in particular cases.
        why: >-
          Tempting to exclude because precedent feels like adjudication, but past judicial decisions are on Hart's list
          of forms of the criteria.
      - text: The moral merit of the rule, as judged by a reasonable citizen.
        correct: true
        why: >-
          Correct — merit is not on the list; Hart lists an authoritative text, legislative enactment, customary
          practice, general declarations of specified persons and past judicial decisions.
      - text: Customary practice.
        why: >-
          Tempting to exclude because custom can seem informal, but customary practice is one of the forms Hart lists at
          CL 100.
  - key: q304
    type: mcq
    concept: rule-of-recognition-and-validity
    difficulty: 2
    stem: How, according to the slide, is the existence of a rule of recognition shown?
    options:
      - text: By its enactment in a written constitution that every citizen can read.
        why: >-
          Tempting because some systems spell out their sources, but Hart says the rule is often implicit; its existence
          shows in practice, not in enactment.
      - text: 'In the way in which primary rules are identified: it is manifest in a general practice.'
        correct: true
        why: >-
          Correct — the slide says the existence of a rule of recognition is shown in the way primary rules are
          identified; the rule is manifest in a general practice.
      - text: By a declaration from the highest court that it is the ultimate rule of the legal system.
        why: >-
          Tempting because judges keep the rule alive, but no single declaration creates it; it exists as a social rule
          in a general practice of identifying rules.
  - key: q305
    type: mcq
    concept: rule-of-recognition-and-validity
    difficulty: 2
    stem: Who, according to the lecture, keeps the rule of recognition alive in a legal system?
    options:
      - text: The sovereign alone, whose will determines which rules count as law.
        why: >-
          Tempting because Austin grounds the system in the sovereign, but Hart reverses this: the rule comes first, and
          it is maintained by a practice.
      - text: Only private persons, since the rule is addressed to citizens rather than to officials.
        why: >-
          Tempting because the rule gives criteria to private persons too, but the lecture says it is kept alive
          especially by officials, above all judges.
      - text: Private persons and officials, especially officials and above all judges.
        correct: true
        why: >-
          Correct — the lecture says private persons and officials keep the social rule alive, especially officials, and
          among officials judges.
      - text: Legal theorists, who presuppose the rule in order to make sense of the system.
        why: >-
          Tempting because Kelsen's basic norm is presupposed by jurists, but Hart's rule of recognition is a social
          rule practised by officials, not a theorist's presupposition.
  - key: q306
    type: mcq
    concept: rule-of-recognition-and-validity
    difficulty: 2
    stem: For Austin, sovereignty comes first and then a legal system. How does the lecture describe Hart's view?
    options:
      - text: 'The other way round: first the rule of recognition, then an authority identifiable as sovereign.'
        correct: true
        why: >-
          Correct — the lecture says for Hart (and in a sense Kelsen) we have rules first, here the rule of recognition,
          and then an authority that can be identified as sovereign.
      - text: The same as Austin's, but Hart calls the sovereign 'the rule of recognition'.
        why: >-
          Tempting because Hart translates the language of sovereignty, but he does not merely rename the sovereign; he
          reverses the order of explanation.
      - text: Hart abandons sovereignty entirely and says it plays no part in legal theory.
        why: >-
          Tempting because Hart rejects Austin's account, but he re-explains sovereignty in light of the rule of
          recognition rather than abandoning it.
      - text: Sovereignty and the rule of recognition arise at the same moment, by a single original social contract.
        why: >-
          Tempting because it sounds balanced, but there is no social contract in Hart's account; the rule of
          recognition is prior and explains sovereignty.
  - key: q307
    type: mcq
    concept: rule-of-recognition-and-validity
    difficulty: 3
    stem: Is the rule of recognition itself valid, according to Hart?
    options:
      - text: Yes — it is valid because it satisfies its own criteria of validity.
        why: >-
          Tempting because it seems self-validating, but Hart says the question cannot arise; the rule provides the
          criteria and is not measured by them.
      - text: Yes — its validity is assumed but cannot be demonstrated.
        why: >-
          Tempting because it is how some put it, but Hart calls that way of speaking dark and misleading; the rule is
          simply accepted.
      - text: 'Neither valid nor invalid: it is simply accepted as appropriate for use in this way.'
        correct: true
        why: >-
          Correct — CL 109: no such question can arise as to the validity of the very rule of recognition; it can
          neither be valid nor invalid but is simply accepted.
      - text: No — it is invalid, because no higher rule authorised it.
        why: >-
          Tempting because nothing stands above it, but invalidity presupposes a test it fails; Hart says the rule is
          neither valid nor invalid.
  - key: q308
    type: mcq
    concept: rule-of-recognition-and-validity
    difficulty: 3
    stem: What does Hart's analogy with the standard metre bar in Paris show?
    options:
      - text: That legal validity, like measurement, is a matter of scientific precision.
        why: >-
          Tempting because the metre is scientific, but the analogy is about the ultimate test itself, not about
          precision in law.
      - text: That the rule of recognition can be tested against a higher external standard, as the bar once was.
        why: >-
          Tempting because standards can be revised, but the point is the reverse: the ultimate test cannot itself be
          tested by what it measures.
      - text: That it makes no sense to ask whether the ultimate test is itself correct, as with the bar.
        correct: true
        why: >-
          Correct — the lecture: if we use a bar as the metre to measure other things, it makes no sense to ask whether
          the bar is a metre; so with the rule of recognition.
  - key: q309
    type: mcq
    concept: rule-of-recognition-and-validity
    difficulty: 2
    stem: What are Hart's two minimum conditions, necessary and sufficient, for the existence of a legal system?
    options:
      - text: A sovereign habitually obeyed, and sanctions for disobedience that are generally enforced.
        why: >-
          Tempting because these are Austin's conditions, but Hart replaces them with general obedience plus official
          acceptance of the secondary rules.
      - text: >-
          Valid rules generally obeyed, and secondary rules effectively accepted by officials as common public
          standards.
        correct: true
        why: >-
          Correct — CL 109: valid rules of behaviour must be generally obeyed, and the rules of recognition, change and
          adjudication accepted as common public standards of official behaviour.
      - text: >-
          Citizens accepting all primary rules as moral duties, and officials enforcing them fairly and consistently in
          the courts.
        why: >-
          Tempting because acceptance matters, but Hart requires only general obedience from citizens; acceptance is
          required of officials, and fairness is not a condition.
      - text: A written constitution, and a supreme court with the power of judicial review.
        why: >-
          Tempting because many modern systems have both, but Hart's conditions concern obedience and official
          acceptance, not particular institutions.
  - key: q310
    type: mcq
    concept: rule-of-recognition-and-validity
    difficulty: 3
    stem: >-
      Which of Hart's two conditions for the existence of a legal system does the lecture call 'the extra bit' that
      Austin's theory lacked?
    options:
      - text: That the valid rules of behaviour must be generally obeyed by the population.
        why: >-
          Tempting because obedience is central, but the lecture says this first condition captures a factual element
          that Austin's theory already had.
      - text: That the rules must be enforced by sanctions whenever they are broken.
        why: Tempting because sanctions matter to Austin, but enforcement is not one of Hart's two conditions at all.
      - text: That the secondary rules must be effectively accepted as common public standards by officials.
        correct: true
        why: >-
          Correct — the lecture says official acceptance of the secondary rules is the extra bit Hart introduces on top
          of what we could gain from Austin.
  - key: q311
    type: mcq
    concept: rule-of-recognition-and-validity
    difficulty: 3
    stem: According to the lecture, what is Hart's preoccupation when he states the conditions for a legal system?
    options:
      - text: Its legitimacy — when a legal system deserves to be obeyed by its citizens.
        why: >-
          Tempting because obedience appears in the conditions, but the lecture says Hart is not interested here in the
          legitimacy of the system.
      - text: Its existence, not its legitimacy or other features, though he knows it can be criticised.
        correct: true
        why: >-
          Correct — the lecture says Hart's preoccupation is the existence of a legal system; he is aware that systems
          can be assessed in other ways, but that is not the task here.
      - text: Its efficiency — how well a legal system achieves the goals set for it by its legislators and officials.
        why: >-
          Tempting because inefficiency is one of the three defects, but the conditions for a legal system concern
          existence, not how well it performs.
      - text: Its justice — whether its rules reproduce the demands of morality in fact.
        why: >-
          Tempting because Hart discusses morality, but he says it is no necessary truth that laws satisfy morality;
          existence does not depend on justice.
  - key: q312
    type: mcq
    concept: rule-of-recognition-and-validity
    difficulty: 3
    stem: The lecture says Hart talks of 'rules of recognition' in the plural. What is the likely explanation it offers?
    options:
      - text: A complex system may have several rules of recognition but one ultimate rule of recognition.
        correct: true
        why: >-
          Correct — the lecture says there are a number of rules of recognition in a legal system, and chapter 6 speaks
          of one ultimate rule, a kind of meta-rule with the key criteria.
      - text: Every citizen has their own rule of recognition, so there are as many as there are people in the system.
        why: >-
          Tempting because private persons use the criteria too, but the rule is a social rule manifest in a general
          practice, not a private rule per person.
      - text: It is a typo on the slide, which the lecturer corrects to the singular.
        why: >-
          Tempting because the lecturer says 'that's a typo', but he then says it is not a typo: the plural reflects a
          real question in the book.
  - key: q313
    type: mcq
    concept: rule-of-recognition-and-validity
    difficulty: 4
    stem: >-
      In the Miller case, the UK Supreme Court referred to 'the so-called fundamental rule of recognition'. What does
      the lecture take this to show?
    options:
      - text: That the Court adopted Kelsen's basic norm under another name.
        why: >-
          Tempting because both concepts explain validity, but the lecture says the judges were using Hart's theory of
          law, not Kelsen's.
      - text: That the rule of recognition is a written rule, found in the European Communities Act 1972.
        why: >-
          Tempting because the Act was in issue, but the Court denied that the fundamental rule had been varied by that
          Act; the rule is not the Act.
      - text: That legal theory is only useful to judges in constitutional cases about the European Union.
        why: >-
          Tempting because Miller was about the EU, but the lecture's wider point is that such concepts are part of
          legal reasoning generally.
      - text: That Hart's concepts are now part of legal reasoning, not just legal theory.
        correct: true
        why: >-
          Correct — the lecture says the judges used Hart's rule of recognition to make sense of the UK system, showing
          these concepts are part of how judges think and talk about law.
  - key: q314
    type: mcq
    concept: rule-of-recognition-and-validity
    difficulty: 2
    variant-of: q301
    stem: An NSW lawyer says 'this regulation is valid law in New South Wales'. On Hart's account, what is she asserting?
    options:
      - text: That the regulation is fair and that citizens ought, morally, to comply with it.
        why: >-
          Tempting because 'valid' can sound like approval, but on Hart's account the statement is about membership of
          the system, not moral merit.
      - text: That the regulation satisfies all the criteria provided by the rule of recognition.
        correct: true
        why: >-
          Correct — the lecture uses exactly this kind of statement: saying 'this is the law in New South Wales' means
          the rule satisfies all the criteria of the rule of recognition.
      - text: That a court will probably enforce the regulation if a case is brought before it by the state.
        why: >-
          Tempting because enforcement often follows validity, but a prediction of enforcement is the realist reading
          Hart rejects.
  - key: q315
    type: mcq
    concept: rule-of-recognition-and-validity
    difficulty: 3
    variant-of: q307
    stem: >-
      A student asks: 'What makes the High Court's recognition criteria themselves legally valid?' What would Hart
      reply?
    options:
      - text: That a higher norm, ultimately a presupposed basic norm, authorises those criteria.
        why: >-
          Tempting because it is Kelsen's answer, but Hart says no question of validity arises for the rule of
          recognition; it is not authorised by a higher norm.
      - text: That the criteria are valid because the people consented to them at federation.
        why: >-
          Tempting because federation involved referendums, but Hart does not ground the rule of recognition in consent;
          it is a social rule accepted in practice.
      - text: That the criteria are valid only if they conform to natural law.
        why: >-
          Tempting because it gives a further standard, but Hart is a positivist; the ultimate rule is not validated by
          morality.
      - text: 'That the question is misplaced: the ultimate rule is neither valid nor invalid, only accepted in practice.'
        correct: true
        why: >-
          Correct — CL 109: the ultimate rule of recognition is simply accepted as appropriate for use; like the
          standard metre, it is not measured by the test it supplies.
  - key: q316
    type: mcq
    concept: rule-of-recognition-and-validity
    difficulty: 4
    variant-of: q309
    stem: >-
      A revolutionary regime is obeyed by most of the population out of fear, but its officials disagree about which
      rules count as law and apply no common criteria. On Hart's conditions, is there a legal system?
    options:
      - text: Yes — general obedience is enough, since that is the factual core of any legal system.
        why: >-
          Tempting because general obedience is one condition, but Hart requires a second: official acceptance of common
          secondary rules, missing here.
      - text: 'No — the second condition fails: officials do not accept common public standards of official behaviour.'
        correct: true
        why: >-
          Correct — Hart's two conditions are jointly necessary; without officials accepting a rule of recognition as a
          common public standard, there is no legal system.
      - text: >-
          Yes — because the regime has a sovereign that is habitually obeyed by the bulk of the people and independent
          of others.
        why: >-
          Tempting because that satisfies Austin's test, but Hart replaces Austin's conditions; official acceptance of
          secondary rules is required.
  - key: q317
    type: mcq
    concept: rule-of-recognition-and-validity
    difficulty: 3
    stem: >-
      What does Hart's claim that the rule of recognition is 'ultimate and supreme' (CL 105–107) show, according to the
      lecture?
    options:
      - text: That the rule of recognition is a moral principle binding on all legal systems.
        why: >-
          Tempting because 'supreme' sounds like higher law, but the lecture treats these as structural features of the
          rule, not moral ones.
      - text: That judges are above the law because they apply the ultimate rule.
        why: >-
          Tempting because judges keep the rule alive, but ultimacy and supremacy belong to the rule, and nothing
          suggests officials are above it.
      - text: That Hart translates the language of sovereignty into the language of the rule of recognition.
        correct: true
        why: >-
          Correct — the lecture says that in speaking of the rule as ultimate and supreme, Hart is translating the
          language of sovereignty into the language of the rule of recognition.
      - text: That the rule of recognition cannot change, since it is ultimate.
        why: >-
          Tempting because 'ultimate' sounds fixed, but the lecture says nothing of the rule being unchangeable; the
          rule is maintained by a practice.
  - key: q318
    type: truefalse
    set: quickfire
    concept: rule-of-recognition-and-validity
    difficulty: 1
    statement: For Hart, the rule of recognition is neither valid nor invalid but simply accepted as appropriate for use.
    answer: true
    why: >-
      True — CL 109, on the slide: no such question can arise as to the validity of the very rule of recognition; it is
      simply accepted as appropriate for use.
  - key: q319
    type: truefalse
    set: quickfire
    concept: rule-of-recognition-and-validity
    difficulty: 2
    statement: >-
      Hart's first condition for the existence of a legal system is that citizens accept the primary rules as common
      public standards.
    answer: false
    why: >-
      False — citizens need only generally obey the valid rules; acceptance as common public standards of official
      behaviour is required of officials, for the secondary rules.
  - key: q320
    type: truefalse
    set: quickfire
    concept: rule-of-recognition-and-validity
    difficulty: 2
    statement: For Hart, the rule of recognition is often implicit rather than spelled out in a text.
    answer: true
    why: >-
      True — the lecture says the set of criteria is often implicit, though some jurisdictions spell out their ordinary
      sources; its existence is shown in practice.
  - key: q401
    type: mcq
    concept: kelsen-pure-theory
    difficulty: 1
    set: pretest
    stem: According to Kelsen, what distinguishes law from other normative orders?
    options:
      - text: Its connection with justice, since law is the normative order that aims at the good.
        why: >-
          Tempting because natural law theorists say so, but Kelsen's pure theory refuses to define law by justice; he
          points to coercion.
      - text: Coercion — the law is a coercive order.
        correct: true
        why: >-
          Correct — the slide says the law is a coercive order (p 1), and the lecture says Kelsen sees coercion, the
          kind of sanctions in a legal system, as the distinguishing feature.
      - text: Its acceptance by officials as a common public standard of behaviour.
        why: >-
          Tempting because this is Hart's condition for a legal system, but it is not Kelsen's distinguishing feature of
          law.
      - text: Its origin in the commands of a sovereign habitually obeyed by the people.
        why: >-
          Tempting because Austin says so, but Kelsen does not hold that laws are commands of human beings (Hart's
          meaning 1).
  - key: q402
    type: mcq
    concept: kelsen-pure-theory
    difficulty: 1
    stem: What does Kelsen call a 'peculiarity of the law'?
    options:
      - text: That it can be changed only by a sovereign who is independent of any other power.
        why: >-
          Tempting because sovereignty was Kelsen's first major topic, but the peculiarity on the slide is about law
          regulating itself.
      - text: That it always reflects the moral views of the community in which it operates.
        why: >-
          Tempting because law often does reflect morality, but Kelsen's pure theory keeps law and morality apart; this
          is not his peculiarity.
      - text: That it regulates its own creation, application and execution.
        correct: true
        why: >-
          Correct — the slide (p 5): it is a peculiarity of the law that it regulates its own creation, application and
          execution.
  - key: q403
    type: mcq
    concept: kelsen-pure-theory
    difficulty: 2
    stem: >-
      How does Kelsen answer the question of the difference between a gangster's command and a tax officer's command
      with the same subjective meaning?
    options:
      - text: The tax officer's command is morally justified by the fairness of the tax system, and the gangster's is not.
        why: >-
          Tempting because taxes can be fair, but Kelsen's answer is not moral; it turns on authorisation by an
          objectively valid legal norm.
      - text: The tax officer's command is backed by a stronger sanction than the gangster's threat.
        why: >-
          Tempting because Kelsen stresses coercion, but both commands threaten consequences; the difference is that one
          is authorised by a valid norm.
      - text: The tax officer's command is authorised by an objectively valid legal norm; the gangster's is not.
        correct: true
        why: >-
          Correct — p 6 on the slide: the command of the tax officer is authorised by an objectively valid legal norm,
          whereas the command of the gangster is not.
      - text: The tax officer is habitually obeyed by the bulk of society, and the gangster is not.
        why: >-
          Tempting because habitual obedience distinguishes Austin's sovereign, but Kelsen's answer is authorisation by
          a valid norm, not habits.
  - key: q404
    type: mcq
    concept: kelsen-pure-theory
    difficulty: 2
    stem: The lecture says Kelsen's gangster and Hart's gunman show what?
    options:
      - text: That Hart copied his central example from Kelsen and gave exactly the same answer to it.
        why: >-
          Tempting because the examples are alike, but the lecture stresses that Hart and Kelsen give different
          explanations of the same problem.
      - text: That Hart and Kelsen see the same problem but come up with different explanations.
        correct: true
        why: >-
          Correct — the lecture: people like Hart or Kelsen are trying to explain the same situation; they see the
          problem, but they come up with different explanations.
      - text: That both think coercion is irrelevant to what makes a legal order.
        why: >-
          Tempting because both reject the gunman as a model of law, but Kelsen makes coercion the distinguishing
          feature of law.
  - key: q405
    type: mcq
    concept: kelsen-pure-theory
    difficulty: 2
    stem: What is the Stufenbau, in the Vienna school's terminology?
    options:
      - text: The basic norm presupposed at the top of every legal order.
        why: >-
          Tempting because it sits at the top of the structure, but the basic norm is the Grundnorm; the Stufenbau is
          the whole hierarchical structure.
      - text: The static aspect of law, which concerns the content of legal norms rather than their creation.
        why: >-
          Tempting because it is a structural term, but the Stufenbau belongs to the dynamic aspect: the hierarchy of
          authorisation.
      - text: The hierarchical structure of the legal order, connected with authorisation.
        correct: true
        why: >-
          Correct — the lecture says the Vienna school calls the hierarchical structure of the legal order the
          Stufenbau, and connects it with the idea of authorisation.
      - text: The Austrian Constitution of 1920, which Kelsen helped to draft.
        why: >-
          Tempting because Kelsen worked on that constitution, but the Stufenbau is a theoretical term for the hierarchy
          of norms, not a document.
  - key: q406
    type: mcq
    concept: kelsen-pure-theory
    difficulty: 2
    stem: Which is NOT one of Kelsen's claims about validity on the slide?
    options:
      - text: If a norm is valid, then it is binding.
        why: >-
          Tempting to exclude because it sounds circular, but it is on the slide: for Kelsen validity means binding
          force.
      - text: Only a competent authority can create a valid norm.
        why: Tempting to exclude because it sounds like Hart, but it is on the slide and underpins the chain of validity.
      - text: The validity of a norm is a complex empirical question of fact.
        correct: true
        why: >-
          Correct — the slide says the opposite: the validity of a norm cannot be a fact. A question of fact is how Hart
          describes the existence of a rule of recognition.
      - text: The basic norm is a transcendental-logical presupposition.
        why: >-
          Tempting to exclude because the phrase is technical, but it is on the slide as the final step of Kelsen's
          account of validity.
  - key: q407
    type: mcq
    concept: kelsen-pure-theory
    difficulty: 3
    stem: A council regulation is challenged. Following Kelsen's chain of validity, what do we look for first?
    options:
      - text: A higher norm that authorised the council to issue such regulations.
        correct: true
        why: >-
          Correct — the lecture's example: the regulation is valid because we find another norm that authorised the
          council; we then ask about that norm, and so on up.
      - text: Evidence that the regulation is generally obeyed in the council's area.
        why: >-
          Tempting because efficacy matters to legal systems, but for Kelsen validity cannot be a fact; the question is
          which norm authorised the regulation.
      - text: The basic norm, which directly validates every regulation in the order.
        why: >-
          Tempting because the basic norm is the ultimate reason, but it validates norms through the chain; the first
          step is the norm immediately authorising the council.
      - text: Whether the council's officials accept the regulation as a common standard.
        why: >-
          Tempting because this is Hart-style reasoning, but Kelsen explains validity by authorisation from a higher
          norm, not by official acceptance.
  - key: q408
    type: mcq
    concept: kelsen-pure-theory
    difficulty: 3
    stem: Once the chain of validity reaches today's constitution, how does it continue, according to the lecture?
    options:
      - text: 'It stops: the constitution is valid because it is the highest source in the system and nothing lies above it.'
        why: >-
          Tempting because nothing is higher, but Kelsen says we can still ask why the constitution is valid, so the
          chain goes on.
      - text: 'It turns to morality: the constitution is valid if it is just.'
        why: >-
          Tempting because morality is the obvious outside standard, but Kelsen keeps law and morality apart; the chain
          turns back in time.
      - text: It goes back in time through previous constitutions to the historically first constitution.
        correct: true
        why: >-
          Correct — the lecture: at the top of the pyramid we start going back in time, finding the previous
          constitutions until we reach the historically first constitution.
  - key: q409
    type: mcq
    concept: kelsen-pure-theory
    difficulty: 2
    stem: What is the content of Kelsen's basic norm, as the slide puts it?
    options:
      - text: That the sovereign's commands ought to be obeyed by the people.
        why: >-
          Tempting because it is Austin-like, but Kelsen's basic norm refers to the first constitution, not to a
          sovereign's commands.
      - text: That one ought to do good and avoid evil, as natural law teaches.
        why: >-
          Tempting because it sounds like a first principle, but that is a moral principle; Kelsen's basic norm is not
          moral.
      - text: That officials ought to accept the rule of recognition as a common standard.
        why: >-
          Tempting because it blends Hart's language, but acceptance by officials is Hart's account; the basic norm
          concerns the first constitution.
      - text: Who laid down the first constitution ought to be obeyed.
        correct: true
        why: >-
          Correct — the slide gives the basic norm's content as 'who laid down the first constitution ought to be
          obeyed'; the lecture puts it as: you ought to obey the historically first constitution.
  - key: q410
    type: mcq
    concept: kelsen-pure-theory
    difficulty: 3
    stem: Why, according to the lecture, must the basic norm be presupposed rather than found?
    options:
      - text: Because the historically first constitution was never written down, so its rules cannot be known.
        why: >-
          Tempting because early constitutions may be lost, but the problem is not evidence; it is that no higher norm
          exists within the system to validate the first constitution.
      - text: >-
          Because we cannot keep asking questions ad infinitum, and nothing in the system validates the first
          constitution.
        correct: true
        why: >-
          Correct — the lecture says we cannot keep asking questions ad infinitum; the only way to make sense of the
          chain from within the system is to presuppose the basic norm.
      - text: Because Kelsen thinks the basic norm is a moral truth known by reason.
        why: >-
          Tempting because it is at the foundation, but Kelsen calls it a juristic hypothesis or fiction, not a moral
          truth.
      - text: Because officials refuse to accept the first constitution, so the jurist must invent a rule for them.
        why: >-
          Tempting because presupposing sounds like inventing, but acceptance by officials is Hart's idea; the
          presupposition answers a logical question about validity.
  - key: q411
    type: mcq
    concept: kelsen-pure-theory
    difficulty: 3
    stem: How does the lecture say the Australian chain of validity is interesting for Kelsen's theory?
    options:
      - text: >-
          It leads back to a statute of the Imperial Parliament, so some use Kelsen to understand the history and others
          to test the theory.
        correct: true
        why: >-
          Correct — the lecture says the chain here brings us back to a statute of the Imperial Parliament; some authors
          use Kelsen to understand that history, others use it to put pressure on his theory.
      - text: It proves the theory false, because Australia has no historically first constitution.
        why: >-
          Tempting because the chain runs outside Australia, but the lecture does not say the theory is proved false;
          some think it helps explain the history.
      - text: It shows Australia's basic norm has a different content from every other country's.
        why: >-
          Tempting because the chain is unusual, but for Kelsen the basic norm always has the same content; the
          historically first constitution differs.
  - key: q412
    type: mcq
    concept: kelsen-pure-theory
    difficulty: 3
    stem: In what sense is Kelsen's theory 'pure', according to his 1941 article?
    options:
      - text: It excludes coercion, so that law is understood only as a set of norms.
        why: >-
          Tempting because purity suggests leaving things out, but Kelsen makes coercion central; what he excludes is
          the question of what law ought to be.
      - text: It answers the question of what the law is, not what it ought to be — politics — and is science.
        correct: true
        why: >-
          Correct — the 1941 article: its sole purpose is to know its subject; it answers what the law is, not what it
          ought to be; the latter is politics, the pure theory is science.
      - text: It studies one legal order, the Austrian, free of any comparison with other systems or other times.
        why: >-
          Tempting because Kelsen drafted the Austrian constitution, but the theory is general, drawn from a comparison
          of all the phenomena called law.
      - text: It relies only on the texts of statutes, without reference to courts or officials.
        why: >-
          Tempting because purity sounds textual, but Kelsen's purity is about excluding evaluation, not about which
          legal materials are consulted.
  - key: q413
    type: mcq
    concept: kelsen-pure-theory
    difficulty: 3
    stem: How does Kelsen describe the relation between the pure theory and Austin's analytical jurisprudence?
    options:
      - text: 'As opposites: analytical jurisprudence is political, the pure theory scientific.'
        why: >-
          Tempting because Kelsen contrasts politics and science, but he says there is no essential difference between
          the two on law, justice and formalism.
      - text: 'As rivals: the pure theory refutes Austin''s claim that jurisprudence studies positive law.'
        why: >-
          Tempting because Hart criticises Austin, but Kelsen agrees that jurisprudence studies positive law; his theory
          is a theory of positive law.
      - text: As essentially the same on law and justice and on formalism.
        correct: true
        why: >-
          Correct — p 4 on the slide: as far as the relationship between law and justice, and formalism, is concerned,
          there is no essential difference between analytical jurisprudence and the Pure Theory.
  - key: q414
    type: mcq
    concept: kelsen-pure-theory
    difficulty: 4
    contrasts-with:
      - separation-of-law-and-morals
    stem: Why does Kelsen call his theory 'the most consistent version' of legal positivism?
    options:
      - text: Because it proves that natural law is false by logical demonstration.
        why: >-
          Tempting because Kelsen wrote against natural law, but the claim is about consistency in counting only
          positive law as law, not a proof.
      - text: Because it counts the moral views of officials as part of positive law.
        why: >-
          Tempting because officials feature in positivism, but counting moral views as law would compromise purity;
          Kelsen excludes them.
      - text: Because it is the only positivist theory that accepts Austin's command theory of law without any reservation.
        why: >-
          Tempting because Kelsen agrees with Austin on method, but Kelsen does not hold that laws are commands (Hart's
          meaning 1).
      - text: Because it considers as 'law' only positive law, refusing to recognise natural law as law.
        correct: true
        why: >-
          Correct — p 1: it considers as 'law' only positive law and refuses to recognise as law any other normative
          social order, eg so-called natural law, even if language calls it law.
  - key: q415
    type: mcq
    concept: kelsen-pure-theory
    difficulty: 3
    contrasts-with:
      - rule-of-recognition-and-validity
    stem: 'A student says: ''For Kelsen, validity is membership of a system, just as for Hart.'' What is the best correction?'
    options:
      - text: For Kelsen validity is binding force; Hart explains validity as membership.
        correct: true
        why: >-
          Correct — the lecture says for Hart validity was all about membership; Kelsen focuses more on the binding
          force of norms than on membership.
      - text: For Kelsen validity is general obedience; Hart explains validity as membership.
        why: >-
          Tempting because obedience matters to both, but Kelsen says validity cannot be a fact; he explains it as
          binding force.
      - text: For Kelsen validity is moral correctness; Hart explains validity as membership.
        why: >-
          Tempting because 'binding' can sound moral, but Kelsen's pure theory excludes morality; binding force comes
          from authorisation.
  - key: q416
    type: mcq
    concept: kelsen-pure-theory
    difficulty: 4
    variant-of: q403
    stem: >-
      A mafia boss orders a shopkeeper to pay 'protection'; the city orders the same shopkeeper to pay a levy. Applying
      Kelsen, which analysis is right?
    options:
      - text: Both are law, since both are coercive orders backed by sanctions.
        why: >-
          Tempting because Kelsen defines law as a coercive order, but coercion is not enough: the levy is authorised by
          an objectively valid norm, the boss's order is not.
      - text: Neither is law unless the shopkeeper morally accepts the demand.
        why: >-
          Tempting because acceptance matters to Hart, but for Kelsen neither moral acceptance nor feelings decide
          validity; authorisation does.
      - text: 'Only the levy: it is authorised by an objectively valid norm in a chain of validity; the boss''s order is not.'
        correct: true
        why: >-
          Correct — this is Kelsen's gangster and tax officer: same subjective meaning, but only the official's command
          is authorised by an objectively valid legal norm.
      - text: Only the boss's order, since it is more effective at getting the shopkeeper to pay.
        why: >-
          Tempting because effectiveness is a fact about coercion, but for Kelsen validity cannot be a fact;
          effectiveness does not make an order law.
  - key: q417
    type: truefalse
    set: quickfire
    concept: kelsen-pure-theory
    difficulty: 1
    statement: For Kelsen, the validity of a norm cannot be a fact.
    answer: true
    why: >-
      True — the slide lists this among Kelsen's claims: validity is binding force, which cannot be explained in factual
      terms.
  - key: q418
    type: truefalse
    set: quickfire
    concept: kelsen-pure-theory
    difficulty: 2
    statement: Kelsen held that laws are commands of human beings.
    answer: false
    why: >-
      False — on Hart's classification Kelsen held meanings 2, 3 and 5, but not 1 (laws as commands of human beings) or
      4 (law as a closed logical system).
  - key: q419
    type: truefalse
    set: quickfire
    concept: kelsen-pure-theory
    difficulty: 2
    statement: >-
      For Kelsen, the static aspect of law (the content of norms) matters more for understanding law than its dynamic
      aspect.
    answer: false
    why: >-
      False — the lecture says the static aspect matters more in morality; to understand the nature of law we need its
      dynamic aspect, the chain of authorisation.
  - key: q420
    type: short
    concept: kelsen-pure-theory
    difficulty: 4
    prompt: '''Kelsen''s pure theory of law shows that a theory of law can be value-free.'' Discuss.'
    model: >-
      Kelsen offers the most uncompromising version of the value-free ideal, but purity comes at a price that shows its

      limits. The pure theory is 'a theory of positive law; a general theory of law', which 'answers the question of
      what the

      law is, not what it ought to be. The latter question is one of politics, while the pure theory of law is science'
      (1941,

      44). It explains law as a coercive order that regulates its own creation, and validity as binding force traced
      through

      a chain of authorisation to the historically first constitution and a presupposed basic norm. Nothing moral
      enters: the

      tax officer differs from the gangster only by authorisation. The counterargument is that the theory depends on a

      presupposition the jurist must make — a 'juristic hypothesis', even a 'fiction' — and on choosing what counts as
      'all the

      phenomena which go under the name of law'. And Hart avoided 'basic norm' partly to avoid Kelsen's view that law
      and

      morals cannot meaningfully conflict (CL 293). On balance Kelsen shows a theory can exclude moral evaluation of
      law, but

      not that it can avoid every theoretical choice.
    rubric:
      - id: r1
        criterion: Thesis — takes a qualified position on whether purity proves value-freedom.
        marks: 2
        top-band: Separates excluding moral evaluation from avoiding all evaluation.
        margin-note: Value-free in which sense?
        authorities: []
      - id: r2
        criterion: Argument — explains purity, the coercive order, the chain of validity and the basic norm.
        marks: 3
        top-band: Quotes the 1941 article and uses the gangster and tax officer accurately.
        margin-note: Where exactly does purity show?
        authorities:
          - kelsen-pure-theory-and-analytical-jurisprudence
          - kelsen-pure-theory-of-law
      - id: r3
        criterion: Counterargument — the presupposition and the choice of phenomena as evaluative.
        marks: 2
        top-band: Uses 'juristic hypothesis'/'fiction' and CL 293 at full strength.
        margin-note: Is a presupposition a value?
        authorities:
          - hart-the-concept-of-law
      - id: r4
        criterion: Evaluation — a reasoned verdict tied to Question 1.
        marks: 2
        top-band: Concludes with a precise claim about what purity can and cannot deliver.
        margin-note: Does your conclusion answer the question asked?
        authorities: []
  - key: q501
    type: mcq
    concept: recognition-vs-basic-norm
    difficulty: 1
    contrasts-with:
      - kelsen-pure-theory
    stem: For Hart, what kind of question is the existence of a rule of recognition?
    options:
      - text: A logical question, settled by presupposing the rule in order to make sense of validity.
        why: >-
          Tempting because the rule sits at the top of the system, but presupposition is Kelsen's account of the basic
          norm, not Hart's.
      - text: A complex, empirical question of fact.
        correct: true
        why: >-
          Correct — the slide: for Hart the existence of a rule of recognition is a complex, empirical question of fact;
          it exists if officials buy into it.
      - text: A moral question, settled by asking whether the rule deserves the obedience of officials and citizens.
        why: >-
          Tempting because acceptance can sound like approval, but Hart's question is whether the rule is practised and
          accepted, not whether it is deserved.
  - key: q502
    type: mcq
    concept: recognition-vs-basic-norm
    difficulty: 1
    stem: Which description does Kelsen use for the basic norm, according to the slide?
    options:
      - text: A social rule accepted by officials.
        why: >-
          Tempting because that is how Hart describes the rule of recognition, but Kelsen's basic norm is presupposed,
          not practised.
      - text: A moral principle binding all people.
        why: >-
          Tempting because it is foundational, but Kelsen's basic norm is not a moral principle; it is a juristic
          hypothesis.
      - text: A 'juristic hypothesis', a 'postulated ultimate rule', a 'fiction'.
        correct: true
        why: >-
          Correct — the slide gives all three: for Kelsen the basic norm is a juristic hypothesis, a postulated ultimate
          rule, and in his later work a fiction.
      - text: The text of the first constitution.
        why: >-
          Tempting because the basic norm refers to the first constitution, but it is a presupposed norm about that
          constitution, not the text itself.
  - key: q503
    type: mcq
    concept: recognition-vs-basic-norm
    difficulty: 2
    stem: On validity, how do the rule of recognition and the basic norm differ, according to the slide?
    options:
      - text: A jurist must presuppose the basic norm's validity; the rule of recognition is neither valid nor invalid.
        correct: true
        why: >-
          Correct — the slide: for Kelsen, a jurist/theorist must presuppose the validity of the basic norm; for Hart,
          the rule of recognition is neither valid nor invalid.
      - text: Both are valid because each is authorised by a higher norm in its own system.
        why: >-
          Tempting because validity usually works by authorisation, but neither ultimate rule is authorised by a higher
          norm; that is the point of calling them ultimate.
      - text: >-
          The basic norm is neither valid nor invalid; the rule of recognition must be presupposed by jurists to be
          valid.
        why: >-
          Tempting because it uses the right phrases, but it swaps the theorists: presupposed validity is Kelsen's;
          neither valid nor invalid is Hart's.
  - key: q504
    type: mcq
    concept: recognition-vs-basic-norm
    difficulty: 2
    stem: How does the content of the ultimate rule compare across jurisdictions?
    options:
      - text: For both, it is always the same, because every legal system has the same structure.
        why: >-
          Tempting because both theories are general, but Hart says rules of recognition may well differ in content
          between jurisdictions.
      - text: For both, it varies, because each jurisdiction has its own historically first constitution.
        why: >-
          Tempting because first constitutions differ, but Kelsen's basic norm always has the same content; only the
          constitution it refers to differs.
      - text: For Kelsen it is always the same; for Hart it may well differ between jurisdictions.
        correct: true
        why: >-
          Correct — the slide: Kelsen's basic norm has always the same content; for Hart the rules of recognition in
          different jurisdictions may well have different content.
      - text: For Kelsen it varies with each constitution; for Hart it is always the same.
        why: >-
          Tempting because it keeps the contrast, but it reverses the theorists: the invariant content belongs to
          Kelsen's basic norm.
  - key: q505
    type: mcq
    concept: recognition-vs-basic-norm
    difficulty: 2
    stem: Why did Hart use 'rule of recognition' instead of 'basic norm', according to CL 293?
    options:
      - text: To stress that his ultimate rule is written down in a constitution, unlike Kelsen's.
        why: >-
          Tempting because 'recognition' suggests identifying texts, but the rule is often implicit; Hart's stated
          reason concerns law and morals.
      - text: To avoid commitment to Kelsen's view of the conflict between law and morals.
        correct: true
        why: >-
          Correct — CL 293 on the slide: one reason for using 'rule of recognition' instead of 'basic norm' is to avoid
          any commitment to Kelsen's view of the conflict between law and morals.
      - text: To show that he agreed with Kelsen on everything except terminology.
        why: >-
          Tempting because the two perform the same function, but Hart's choice of term marks a substantive disagreement
          about law and morals.
      - text: To mark that the rule is a moral rule, not a legal norm like Kelsen's.
        why: >-
          Tempting because morals are mentioned, but Hart's rule of recognition is a social rule, not a moral one; the
          point is to avoid Kelsen's view of conflict.
  - key: q506
    type: mcq
    concept: recognition-vs-basic-norm
    difficulty: 3
    stem: What is Kelsen's view of the conflict between law and morals, as the lecture explains it?
    options:
      - text: That law always prevails in a conflict, because legal norms are backed by coercion and moral ones are not.
        why: >-
          Tempting because coercion distinguishes law, but the lecture's point is that on Kelsen's view there can be no
          meaningful conflict to resolve.
      - text: That morality always prevails, since an immoral norm cannot be valid law.
        why: Tempting because it resolves conflicts, but that is a natural law view; Kelsen keeps law and morality apart.
      - text: That a legal and a moral norm cannot both be valid at once, so no meaningful conflict arises.
        correct: true
        why: >-
          Correct — the lecture: given how Kelsen thinks of validity and binding force, a legal norm and a moral norm
          cannot be valid at the same time, so a meaningful conflict is impossible.
  - key: q507
    type: mcq
    concept: recognition-vs-basic-norm
    difficulty: 3
    stem: What do the rule of recognition and the basic norm have in common, according to the lecture?
    options:
      - text: 'The same function: explaining legal validity and the unity of the order.'
        correct: true
        why: >-
          Correct — the lecture says in Kelsen's theory the basic norm has the same function performed by the rule of
          recognition in Hart's; both explain legal validity.
      - text: 'The same nature: both are social rules practised by officials in each jurisdiction.'
        why: >-
          Tempting because Hart's rule is a social rule, but Kelsen's basic norm is presupposed by the jurist; their
          natures differ.
      - text: 'The same content: both say that the first constitution ought to be obeyed by all.'
        why: >-
          Tempting because Kelsen's basic norm says this, but Hart's rule of recognition has content that varies between
          jurisdictions.
      - text: 'The same status: both are valid norms located at the top of the legal hierarchy.'
        why: >-
          Tempting because both are ultimate, but Hart's rule is neither valid nor invalid, and Kelsen's basic norm is
          presupposed, not part of the legal order.
  - key: q508
    type: mcq
    concept: recognition-vs-basic-norm
    difficulty: 3
    variant-of: q504
    stem: >-
      A theorist says the ultimate rule of Australian law is whatever officials in fact accept as the criteria of
      validity, and that this could differ from New Zealand's. Whose view is this closer to?
    options:
      - text: Kelsen's, because the basic norm is always relative to one historically first constitution.
        why: >-
          Tempting because first constitutions differ, but the basic norm's content is always the same; official
          acceptance as fact is Hart's idea.
      - text: Hart's.
        correct: true
        why: >-
          Correct — for Hart the rule of recognition is a matter of fact, accepted by officials, and rules of
          recognition in different jurisdictions may well have different content.
      - text: Neither's, because both theorists say the ultimate rule is identical in every legal system.
        why: >-
          Tempting because both theories aim at generality, but only Kelsen's basic norm has invariant content; Hart's
          rule of recognition varies.
  - key: q509
    type: mcq
    concept: recognition-vs-basic-norm
    difficulty: 3
    variant-of: q503
    stem: >-
      A theorist says: 'We must assume the first constitution ought to be obeyed; without that assumption no norm in the
      system could be binding.' Whose view is this?
    options:
      - text: Hart's, because the rule of recognition must be assumed valid before other rules can be identified.
        why: >-
          Tempting because both deal with ultimate rules, but Hart denies the rule of recognition is assumed valid; he
          calls that way of speaking dark.
      - text: Austin's, because the sovereign must be assumed to be obeyed before its commands bind.
        why: >-
          Tempting because Austin grounds law in obedience, but the assumption here concerns the first constitution, not
          a sovereign; it is Kelsen's.
      - text: Kelsen's.
        correct: true
        why: >-
          Correct — this is the basic norm: presupposed so the chain of validity makes sense, with the content 'who laid
          down the first constitution ought to be obeyed'.
      - text: Fuller's, because the inner morality of law must be assumed before any rule binds.
        why: >-
          Tempting because Fuller debated Hart, but the claim concerns presupposing obedience to the first constitution,
          which is Kelsen's basic norm.
  - key: q510
    type: mcq
    concept: recognition-vs-basic-norm
    difficulty: 2
    stem: Is Kelsen's basic norm part of the legal order, according to the lecture?
    options:
      - text: Yes — it is the highest norm of the legal order, above the constitution and authorising it.
        why: >-
          Tempting because it sits above the chain, but the lecture says the basic norm is presupposed and not part of
          the legal order.
      - text: No — it is presupposed, not part of the legal order.
        correct: true
        why: >-
          Correct — the lecture contrasts the two: Hart's rule of recognition is part of the system as a social rule,
          whereas the basic norm is presupposed and not part of the legal order.
      - text: Yes — it is enacted as the first article of the historically first constitution.
        why: >-
          Tempting because it refers to that constitution, but the basic norm is not enacted anywhere; it is a
          presupposition of the jurist.
  - key: q511
    type: mcq
    concept: recognition-vs-basic-norm
    difficulty: 4
    contrasts-with:
      - rule-of-recognition-and-validity
      - kelsen-pure-theory
    stem: Which comparison is most accurate?
    options:
      - text: >-
          Hart: validity is binding force traced to a basic norm. Kelsen: validity is membership of a system identified
          by the rule of recognition.
        why: >-
          Tempting because it uses both theories' terms, but it swaps them: membership is Hart's account and binding
          force Kelsen's.
      - text: >-
          Both: validity is general obedience plus official acceptance, but they disagree about the name of the ultimate
          rule.
        why: >-
          Tempting because obedience and acceptance feature in Hart's conditions for a system, but those concern a
          system's existence; and Kelsen denies validity is a fact.
      - text: >-
          Hart: validity is membership, the ultimate rule a fact. Kelsen: validity is binding force, the ultimate norm
          presupposed.
        correct: true
        why: >-
          Correct — the lecture sets out both contrasts: membership against binding force, and a rule that exists as a
          matter of fact against a presupposed basic norm.
  - key: q512
    type: mcq
    concept: recognition-vs-basic-norm
    difficulty: 3
    stem: Where does Hart explicitly discuss Kelsen's basic norm, according to the lecture?
    options:
      - text: In the Postscript, published after his death as a response to his critics.
        why: >-
          Tempting because the Postscript answers critics, but the lecture points to a long endnote in The Concept of
          Law on the basic norm.
      - text: In his 1958 Harvard Law Review article, in the footnote on the five meanings.
        why: >-
          Tempting because that footnote mentions Kelsen, but it classifies his views on positivism; the discussion of
          the basic norm is in an endnote to the book.
      - text: In a long endnote in The Concept of Law.
        correct: true
        why: >-
          Correct — the lecture says there is a long endnote in The Concept of Law where Hart explicitly discusses
          Kelsen's basic norm; the slide cites CL 293.
      - text: He never discusses it, as he had not read Kelsen when he wrote the book.
        why: >-
          Tempting because the theories developed separately, but the lecture says Hart was aware of Kelsen's theory and
          refers to him a number of times.
  - key: q513
    type: mcq
    concept: recognition-vs-basic-norm
    difficulty: 4
    variant-of: q501
    stem: >-
      An essay says: 'Hart and Kelsen both think the ultimate rule of a legal system is presupposed by legal theorists.'
      Which correction is right?
    options:
      - text: 'Only Kelsen: Hart''s rule of recognition is a social rule whose existence is a fact.'
        correct: true
        why: >-
          Correct — the lecture: for Kelsen the basic norm is presupposed by a theorist or jurist; for Hart the rule of
          recognition is a real, social rule whose existence is a matter of fact.
      - text: 'Only Hart: Kelsen''s basic norm is enacted by the framers of the first constitution.'
        why: >-
          Tempting because it keeps one theorist on each side, but it reverses them; the basic norm is never enacted,
          and Hart's rule is not presupposed.
      - text: 'Neither: both say the ultimate rule is valid because the people consented to it.'
        why: >-
          Tempting because consent can ground authority, but neither theory grounds the ultimate rule in consent; one
          relies on fact, the other on presupposition.
      - text: 'Both: the essay is right, and the difference between them is only terminology.'
        why: >-
          Tempting because they perform the same function, but the lecture stresses substantive differences, the
          fact/presupposition one above all.
  - key: q514
    type: mcq
    concept: recognition-vs-basic-norm
    difficulty: 3
    stem: Why does the lecture say it is 'natural' to compare Hart's rule of recognition with Kelsen's basic norm?
    options:
      - text: Because Hart wrote The Concept of Law as a translation of Kelsen's Pure Theory of Law.
        why: >-
          Tempting because Hart knew Kelsen's work, but his book is not a translation; the comparison is natural because
          both explain validity.
      - text: Because both explain legal validity, and Kelsen's theory was very influential.
        correct: true
        why: >-
          Correct — the lecture: Hart is solving the problem Kelsen tried to solve with a different explanation, and it
          is natural to compare them because Kelsen's theory was so influential.
      - text: Because both men taught at Oxford, where they developed the concepts together in seminars.
        why: >-
          Tempting because they were contemporaries, but Kelsen taught at Vienna, Cologne and Berkeley; the comparison
          rests on the problem they share.
  - key: q515
    type: mcq
    concept: recognition-vs-basic-norm
    difficulty: 4
    variant-of: q506
    stem: Suppose a legal norm requires an act that a moral norm forbids. Which response fits Hart rather than Kelsen?
    options:
      - text: >-
          There is no meaningful conflict, since only one of the two norms can be valid for the same person at the same
          time.
        why: >-
          Tempting because it is a tidy answer, but it is Kelsen's view; Hart named his rule partly to avoid this
          commitment.
      - text: The legal norm is invalid, because law must conform to morality to be law.
        why: >-
          Tempting because it resolves the conflict, but that is a natural law view, not Hart's; he denies a necessary
          connection between law and morals.
      - text: 'There is a genuine conflict: the law is valid law, yet morally one may have reason not to comply.'
        correct: true
        why: >-
          Correct — the lecture says Hart can accept a meaningful conflict between law and morality; that is why he
          avoided Kelsen's term (CL 293).
      - text: The conflict must be settled by the rule of recognition, which ranks morality above law.
        why: >-
          Tempting because the rule of recognition ranks sources, but Hart does not say it ranks morality above law in
          every system.
  - key: q516
    type: mcq
    concept: recognition-vs-basic-norm
    difficulty: 2
    stem: On the slide, the rule of recognition and the Grundnorm are compared on how many points, and which comes second?
    options:
      - text: Two points; second is whether the rule is written or unwritten.
        why: >-
          Tempting because the rule of recognition is often implicit, but writtenness is not one of the slide's points
          of comparison.
      - text: Four points; second is who laid down the first constitution.
        why: >-
          Tempting because the basic norm refers to the first constitution, but that is its content, not the second
          point; the slide has three points and a quotation.
      - text: Three points plus a quotation; second is presupposed validity against 'neither valid nor invalid'.
        correct: true
        why: >-
          Correct — the slide compares fact/presupposition, presupposed validity/neither valid nor invalid, and content,
          then quotes CL 293; the lecture flags the second point as important.
  - key: q517
    type: truefalse
    set: quickfire
    concept: recognition-vs-basic-norm
    difficulty: 1
    statement: For Kelsen, the basic norm always has the same content.
    answer: true
    why: >-
      True — the slide: Kelsen's basic norm has always the same content ('who laid down the first constitution ought to
      be obeyed'), unlike Hart's rules of recognition.
  - key: q518
    type: truefalse
    set: quickfire
    concept: recognition-vs-basic-norm
    difficulty: 2
    statement: For Hart, the rule of recognition is a juristic hypothesis that the theorist must presuppose.
    answer: false
    why: >-
      False — 'juristic hypothesis' is Kelsen's description of the basic norm; for Hart the rule of recognition is a
      social rule whose existence is a question of fact.
  - key: q519
    type: truefalse
    set: quickfire
    concept: recognition-vs-basic-norm
    difficulty: 2
    statement: In Kelsen's theory the basic norm performs the same function as the rule of recognition in Hart's theory.
    answer: true
    why: >-
      True — the lecture says both explain legal validity and the unity of the order, even though they differ in nature,
      validity and content.
  - key: q520
    type: short
    concept: recognition-vs-basic-norm
    difficulty: 4
    prompt: '''Hart''s rule of recognition gives a better account of legal validity than Kelsen''s basic norm.'' Discuss.'
    model: >-
      Hart's account is better as an explanation of existing legal systems, though Kelsen's answers a question Hart sets

      aside. Both concepts perform the same function: explaining validity and the unity of a legal order. For Hart, a
      rule is

      valid if it passes all the tests provided by the rule of recognition (CL 103); validity is membership, and the
      rule

      itself is a social rule whose existence is a complex, empirical question of fact, neither valid nor invalid but
      simply

      accepted, like the standard metre (CL 109). Its content may differ between jurisdictions. For Kelsen, validity is

      binding force; the chain of authorisation runs back to the historically first constitution, and the basic norm —
      always

      'who laid down the first constitution ought to be obeyed' — must be presupposed, a 'juristic hypothesis' or
      'fiction'.

      The counterargument is that only Kelsen explains why norms bind: a fact about official practice cannot on its own

      generate an ought, and Kelsen insists validity cannot be a fact. But Hart's account ties the ultimate rule to what

      officials actually do, and he avoids Kelsen's view that law and morals cannot meaningfully conflict (CL 293). On
      balance

      Hart's account is better at describing legal systems, and that is what a descriptive theory is for.
    rubric:
      - id: r1
        criterion: Thesis — a clear, qualified position on which account of validity is better, and in what respect.
        marks: 2
        top-band: States the respect in which one is better in the first sentence.
        margin-note: Better at explaining what?
        authorities: []
      - id: r2
        criterion: Argument — sets out both accounts accurately (membership/fact vs binding force/presupposition; content).
        marks: 3
        top-band: Uses CL 103, CL 109 and the chain of validity with the basic norm's content.
        margin-note: Keep the two theorists apart.
        authorities:
          - hart-the-concept-of-law
          - kelsen-pure-theory-of-law
      - id: r3
        criterion: Counterargument — Kelsen's point that validity cannot be a fact, at full strength.
        marks: 2
        top-band: Explains why a fact cannot alone generate an ought.
        margin-note: Where does the ought come from?
        authorities: []
      - id: r4
        criterion: Evaluation — weighs the two, using CL 293, and reaches a reasoned verdict.
        marks: 2
        top-band: Links the verdict to what a descriptive theory is meant to do.
        margin-note: Why does your verdict survive the objection?
        authorities: []
  - key: q601
    type: mcq
    concept: separation-of-law-and-morals
    difficulty: 1
    set: pretest
    stem: According to Green and Adams, what is legal positivism?
    options:
      - text: The thesis that law is the command of a sovereign backed by threats of sanctions.
        why: >-
          Tempting because Austin was a positivist, but that is the imperative theory, one doctrine among several and
          not what Green and Adams define as positivism.
      - text: The thesis that the existence and content of law depends on social facts and not on its merits.
        correct: true
        why: >-
          Correct — the Stanford Encyclopedia entry by Green and Adams, on the slide: the existence and content of law
          depends on social facts and not on its merits.
      - text: The thesis that unjust laws are not laws at all, because law must satisfy the demands of morality to be law.
        why: >-
          Tempting because it is a famous thesis about law and morals, but it is the natural law view that positivism
          denies.
  - key: q602
    type: mcq
    concept: separation-of-law-and-morals
    difficulty: 1
    stem: 'Complete Austin''s statement: ''The existence of law is one thing; …'''
    options:
      - text: '''its merit and demerit another.'''
        correct: true
        why: >-
          Correct — Austin, The Province of Jurisprudence Determined (Rumble ed, 1995) 157, on the slide: the existence
          of law is one thing; its merit and demerit another.
      - text: '''its enforcement by the sovereign another, and its obedience a third.'''
        why: >-
          Tempting because sanctions and obedience are central to Austin, but the famous sentence separates existence
          from merit, not from enforcement.
      - text: '''its origin in custom another, as the historical school rightly teaches.'''
        why: >-
          Tempting because custom is a source of law, but Austin's sentence is the founding slogan of positivism about
          existence and merit.
      - text: '''its interpretation by the courts another, and its meaning a third.'''
        why: >-
          Tempting because interpretation is a real problem, but the sentence contrasts whether a law exists with
          whether it is good.
  - key: q603
    type: mcq
    concept: separation-of-law-and-morals
    difficulty: 2
    stem: How does Hart state the 'simple contention' he takes legal positivism to mean (CL 185–186)?
    options:
      - text: >-
          That laws never reproduce or satisfy the demands of morality, as a matter of historical fact in any legal
          system.
        why: >-
          Tempting because it sounds like strict separation, but Hart says laws in fact often do satisfy morality; the
          claim is only that this is not necessary.
      - text: That it is in no sense a necessary truth that laws reproduce or satisfy certain demands of morality.
        correct: true
        why: >-
          Correct — CL 185–186: it is in no sense a necessary truth that laws reproduce or satisfy certain demands of
          morality, though in fact they have often done so.
      - text: That laws must always be obeyed whatever their moral content, as a matter of duty.
        why: >-
          Tempting because positivism is sometimes caricatured this way, but Hart's contention is about the concept of
          law, not a duty to obey every law.
  - key: q604
    type: mcq
    concept: separation-of-law-and-morals
    difficulty: 2
    stem: According to Hart, which did Bentham and Austin NOT deny?
    options:
      - text: That the separation of law and morals was worth insisting on in jurisprudence.
        why: >-
          Tempting because they are the target of critics, but they insisted on the separation; the question is what
          they did not deny despite it.
      - text: That many legal rules mirror moral rules, as a matter of historical fact.
        correct: true
        why: >-
          Correct — the slide: the Utilitarians never denied that many legal rules mirror moral rules/principles, as a
          matter of historical fact.
      - text: That the imperative theory of law was correct, and that laws are the commands of a sovereign.
        why: >-
          Tempting to choose because they held the imperative theory, but they asserted it; 'not denying' refers to the
          historical overlap of law and morals.
      - text: That legal concepts needed analysis distinct from history and sociology.
        why: >-
          Tempting to choose because they held this doctrine too, but that is something they asserted, not a concession
          Hart says they never denied.
  - key: q605
    type: mcq
    concept: separation-of-law-and-morals
    difficulty: 2
    stem: Which statement about Bentham does Hart make on the slide?
    options:
      - text: Bentham denied that morality could ever become part of the law of any system.
        why: >-
          Tempting because Bentham insisted on separation, but the slide says the opposite: he never denied moral
          principles might become part of a legal system.
      - text: Bentham held that every immoral law is automatically invalid.
        why: >-
          Tempting because Bentham criticised bad laws, but saying immoral laws are invalid is exactly what the
          separation thesis denies.
      - text: Bentham never denied that moral principles might enter a legal system by explicit legal provisions.
        correct: true
        why: >-
          Correct — the slide: Bentham never denied that moral principles might become part of a legal system thanks to
          explicit legal provisions, eg some constitutional provisions.
  - key: q606
    type: mcq
    concept: separation-of-law-and-morals
    difficulty: 2
    stem: What were the 'two simple things' Bentham and Austin were anxious to assert, according to Hart?
    options:
      - text: That law is a command, and that commands must be backed by sanctions to count as law.
        why: >-
          Tempting because this is Austin's imperative theory, but the two simple things concern law and morality, not
          the structure of commands.
      - text: That judges should never consider morality, and that legislators should consider nothing else at all.
        why: >-
          Tempting because it splits law and morals by institution, but Hart's two simple things are claims about what
          follows for legal validity.
      - text: Immorality alone does not stop a rule being law; moral desirability alone does not make a rule law.
        correct: true
        why: >-
          Correct — absent express provision, it could not follow from a rule violating morality that it was not law,
          nor from a rule being morally desirable that it was law (599).
      - text: That morality is subjective, and that law is objective because it is laid down by a sovereign.
        why: >-
          Tempting because noncognitivism is one meaning of positivism, but Bentham and Austin did not hold it, and it
          is not one of the two simple things.
  - key: q607
    type: mcq
    concept: separation-of-law-and-morals
    difficulty: 3
    stem: Why does Hart say Bentham and Austin were 'not dry analysts fiddling with verbal distinctions while cities burn'?
    options:
      - text: Because they were the vanguard of a movement working for a better society and better laws.
        correct: true
        why: >-
          Correct — Hart, 596: they were the vanguard of a movement which laboured with passionate intensity and much
          success to bring about a better society and better laws.
      - text: Because they rejected analysis of legal concepts in favour of political campaigning for reform.
        why: >-
          Tempting because they campaigned, but they also defended the analytical study of legal concepts; Hart's point
          is that analysis and reform went together.
      - text: Because they thought law and morality were one and the same, so analysis was pointless.
        why: >-
          Tempting because they cared about morality, but they insisted on the separation of law and morals; that was
          their distinctive position.
  - key: q608
    type: mcq
    concept: separation-of-law-and-morals
    difficulty: 3
    stem: Which three doctrines does Hart say the utilitarian tradition in jurisprudence defended?
    options:
      - text: Natural law, the separation of powers, and the rule of law.
        why: >-
          Tempting because these are familiar constitutional ideas, but Hart's list for the utilitarians is separation
          of law and morals, analysis, and the imperative theory.
      - text: The social facts thesis, the sources thesis, and the separability thesis.
        why: >-
          Tempting because these appear on the week's final slide, but they belong to legal positivism as a general
          theory, not Hart's list for the utilitarians.
      - text: Separation of law and morals; analytical study of legal concepts; the imperative theory.
        correct: true
        why: >-
          Correct — the slide lists the separation between law and morals, the purely analytical study of legal
          concepts, and the famous imperative theory of law.
      - text: Utilitarianism in ethics, democracy in politics, and codification in law.
        why: >-
          Tempting because Bentham championed codification, but Hart's three doctrines concern jurisprudence:
          separation, analysis and the imperative theory.
  - key: q609
    type: mcq
    concept: separation-of-law-and-morals
    difficulty: 3
    stem: What does the slide say about the relationship between the three utilitarian doctrines?
    options:
      - text: They stand or fall together, so rejecting the imperative theory means rejecting separation.
        why: >-
          Tempting because they were held together, but the slide says they are separate doctrines, not a package; Hart
          rejects the imperative theory yet keeps separation.
      - text: They are separate doctrines/claims, not a package.
        correct: true
        why: >-
          Correct — the slide: (1), (2) and (3) are separate doctrines/claims – they are not a package, which is why
          Hart can reject the imperative theory and keep the separation of law and morals.
      - text: The imperative theory is the foundation, and the other two are derived from it.
        why: >-
          Tempting because Austin built his theory on commands, but the slide treats all three as separate; none is
          derived from another.
  - key: q610
    type: mcq
    concept: separation-of-law-and-morals
    difficulty: 3
    stem: Which is NOT one of the three lines of criticism of the is/ought distinction that Hart identifies?
    options:
      - text: Law and morality – in relation to laws and/or a legal system.
        why: >-
          Tempting to exclude because it is the broadest, but it is the first of the three lines of criticism on the
          slide.
      - text: Legal positivism and formalism in adjudication.
        why: >-
          Tempting to exclude because it concerns judges rather than concepts, but it is the second line of criticism on
          the slide.
      - text: The practical problem of the existence of morally evil laws, eg the Nazi regime.
        why: >-
          Tempting to exclude because it is a historical example, but it is the third line of criticism and the one that
          makes the distinction seem practically dangerous.
      - text: That the distinction is incompatible with Kelsen's pure theory.
        correct: true
        why: >-
          Correct — this is not a line of criticism; Kelsen's pure theory insists on the distinction, answering what law
          is and not what it ought to be.
  - key: q611
    type: mcq
    concept: separation-of-law-and-morals
    difficulty: 3
    stem: Why do some legal philosophers think the sharp is/ought distinction is dangerous, according to the slide?
    options:
      - text: Because it forces judges to apply morality instead of law in hard cases.
        why: >-
          Tempting because formalism in adjudication is a line of criticism, but the concern is the reverse: the
          distinction may separate law from morality too sharply.
      - text: Because of the practical problem of morally evil laws, eg the Nazi regime.
        correct: true
        why: >-
          Correct — the slide says the distinction is, for some, intellectually misleading and/or practically dangerous,
          and names the problem of morally evil laws, such as under the Nazi regime.
      - text: Because it makes it impossible to criticise the law from a moral point of view.
        why: >-
          Tempting because critics worry about moral criticism, but Hart says a clear understanding of law is a
          preliminary to useful moral criticism; the danger claimed is evil laws.
      - text: Because it was invented by Kelsen to justify the Austrian Constitution.
        why: >-
          Tempting because Kelsen worked on that constitution, but the distinction is defended by Bentham, Austin and
          Hart; it was not invented for the constitution.
  - key: q612
    type: mcq
    concept: separation-of-law-and-morals
    difficulty: 2
    stem: Which articles formed the 1958 Hart–Fuller debate in the Harvard Law Review?
    options:
      - text: Hart, 'The Concept of Law', and Fuller, 'The Morality of Law'.
        why: >-
          Tempting because these are the two men's books, but they appeared in 1961 and 1964; the 1958 debate was two
          articles.
      - text: >-
          Hart, 'Positivism and the Separation of Law and Morals'; Fuller, 'Positivism and Fidelity to Law – A Reply to
          Professor Hart'.
        correct: true
        why: 'Correct — the slide lists the two articles in Harvard Law Review, Vol 71, 1958: Hart''s and Fuller''s reply.'
      - text: Kelsen, 'The Pure Theory of Law and Analytical Jurisprudence', and Hart's reply to it.
        why: >-
          Tempting because Kelsen's article is also in the Harvard Law Review, but it appeared in 1941 and is not part
          of the Hart–Fuller debate.
  - key: q613
    type: mcq
    concept: separation-of-law-and-morals
    difficulty: 4
    variant-of: q606
    stem: >-
      A parliament passes a statute that is plainly unjust, with no constitutional provision incorporating morality. On
      the 'two simple things', what follows?
    options:
      - text: The statute is not law, because a rule that violates morality cannot be a rule of law in any system.
        why: >-
          Tempting because the statute is unjust, but the first simple thing is that it does not follow from the mere
          fact of immorality that a rule is not law.
      - text: The statute is law and must be obeyed, because what is law is morally binding.
        why: >-
          Tempting because it keeps the statute as law, but the two simple things say nothing about a moral duty to
          obey; they concern legal validity.
      - text: Its injustice alone does not show it is not law; whether it is law depends on other criteria.
        correct: true
        why: >-
          Correct — absent an express constitutional or legal provision, it could not follow from the mere fact that a
          rule violated morality that it was not a rule of law (Hart, 599).
      - text: The statute is law only if the courts find it morally acceptable when applying it.
        why: >-
          Tempting because courts apply statutes, but making validity depend on moral acceptability contradicts the two
          simple things.
  - key: q614
    type: mcq
    concept: separation-of-law-and-morals
    difficulty: 4
    variant-of: q605
    stem: >-
      A constitution expressly provides that no law may be grossly unjust. A statute is grossly unjust. How does this
      fit Hart's account of Bentham and Austin?
    options:
      - text: It contradicts the separation thesis, since morality now determines what is law.
        why: >-
          Tempting because morality is doing work, but Bentham never denied that moral principles might enter a legal
          system through explicit legal provisions.
      - text: 'It fits: an express provision can make morality part of the criteria of law.'
        correct: true
        why: >-
          Correct — the two simple things apply 'in the absence of an expressed constitutional or legal provision'; with
          such a provision, morality can be part of the law.
      - text: It shows natural law is correct, since the statute is invalid because it is immoral.
        why: >-
          Tempting because the statute fails, but it fails because of the positive constitutional provision, not because
          immorality as such invalidates law.
  - key: q615
    type: mcq
    concept: separation-of-law-and-morals
    difficulty: 3
    stem: Hart says his account is descriptive, but adds that a clear understanding of law's forms and structures is what?
    options:
      - text: A substitute for moral criticism, which becomes unnecessary once law is described.
        why: >-
          Tempting because description might seem to replace evaluation, but Hart says the opposite: understanding is a
          preliminary to criticism.
      - text: An important preliminary to any useful moral criticism of law.
        correct: true
        why: >-
          Correct — CL 240 on the slide: a clear understanding of these is an important preliminary to any useful moral
          criticism of law.
      - text: A justification of the legal system as it stands, and of the officials who run it.
        why: >-
          Tempting because descriptions can seem to endorse, but Hart says his account does not seek to justify or
          commend on moral or other grounds.
      - text: A proof that law and morality are necessarily connected in every legal system.
        why: >-
          Tempting because criticism links the two, but Hart's positivism denies a necessary connection; the
          understanding serves criticism, not a proof.
  - key: q616
    type: mcq
    concept: separation-of-law-and-morals
    difficulty: 2
    contrasts-with:
      - what-is-legal-positivism
    stem: Which pairing of claim and level is right, according to the lecture?
    options:
      - text: Hart's 'simple contention' is about legal theory; his 'descriptive account' is about the nature of law.
        why: >-
          Tempting because both concern morality, but it swaps them: the simple contention concerns the relationship
          between law and morality, the description concerns legal theory.
      - text: '''Simple contention'' — the nature of law; ''descriptive account'' — the nature of legal theory.'
        correct: true
        why: >-
          Correct — the lecture distinguishes the two levels: the first claim is about law and morality; the second,
          from the Postscript, is about the task of legal theory.
      - text: Both are claims about the nature of law, so there is only one level involved.
        why: >-
          Tempting because both appear under 'Hart on legal positivism', but the lecture stresses that the relationship
          with morality arises at two different levels.
  - key: q617
    type: truefalse
    set: quickfire
    concept: separation-of-law-and-morals
    difficulty: 1
    statement: Hart says laws in fact have often reproduced or satisfied the demands of morality.
    answer: true
    why: >-
      True — CL 185–186: it is in no sense a necessary truth that laws satisfy morality, though in fact they have often
      done so.
  - key: q618
    type: truefalse
    set: quickfire
    concept: separation-of-law-and-morals
    difficulty: 2
    statement: >-
      According to Hart, the three doctrines of the utilitarian tradition form a package that must be accepted or
      rejected together.
    answer: false
    why: >-
      False — the slide says the three are separate doctrines/claims, not a package, which is why Hart can reject the
      imperative theory while keeping the separation thesis.
  - key: q619
    type: truefalse
    set: quickfire
    concept: separation-of-law-and-morals
    difficulty: 2
    statement: The Hart–Fuller debate took place in the Harvard Law Review in 1958.
    answer: true
    why: >-
      True — the slide lists Harvard Law Review, Vol 71, 1958, with Hart's 'Positivism and the Separation of Law and
      Morals' and Fuller's reply.
  - key: q620
    type: short
    concept: separation-of-law-and-morals
    difficulty: 3
    prompt: >-
      'The separation of law as it is from law as it ought to be is practically dangerous.' Discuss, with reference to
      Hart's defence of the utilitarian tradition.
    model: >-
      The separation is not dangerous once it is understood as the narrow claim Hart defends. Bentham, Austin and Hart

      defend the distinction between law as it is and law as it ought to be. Hart takes positivism to be the contention
      that

      it is in no sense a necessary truth that laws satisfy morality, though in fact they often do (CL 185–186). His
      Bentham

      and Austin were not dry analysts but reformers who wanted better laws, and they asserted two simple things: that a

      rule's immorality does not alone show it is not law, and its moral desirability does not alone make it law (599).
      They

      never denied that law mirrors morality in fact, or that morality can enter law by express provision. The strongest

      counterargument is the practical problem of morally evil laws, such as under the Nazi regime: calling such rules
      law

      may seem to lend them authority. But separation is what makes criticism possible — a clear understanding of law is
      'an

      important preliminary to any useful moral criticism of law' (CL 240) — and saying a rule is law is not saying it
      should

      be obeyed. On balance the danger lies in confusing validity with obligation, not in the separation itself.
    rubric:
      - id: r1
        criterion: Thesis — a clear position on whether separation is practically dangerous.
        marks: 2
        top-band: States a qualified thesis that identifies what is and is not dangerous.
        margin-note: Dangerous in what way, exactly?
        authorities: []
      - id: r2
        criterion: Argument — explains Hart's simple contention, the two simple things and what the utilitarians did not deny.
        marks: 3
        top-band: Uses CL 185–186 and the 1958 article accurately.
        margin-note: What exactly does separation deny?
        authorities:
          - hart-positivism-and-the-separation-of-law-and-morals
          - hart-the-concept-of-law
      - id: r3
        criterion: Counterargument — the problem of morally evil laws at full strength.
        marks: 2
        top-band: Presents the Nazi-era worry charitably before answering it.
        margin-note: Put the critic at their strongest.
        authorities: []
      - id: r4
        criterion: Evaluation — weighs the two and reaches a reasoned verdict.
        marks: 2
        top-band: Distinguishes legal validity from a duty to obey.
        margin-note: Why does your verdict survive the objection?
        authorities: []
  - key: q701
    type: mcq
    concept: what-is-legal-positivism
    difficulty: 1
    stem: Which is the first of Hart's five meanings of 'positivism'?
    options:
      - text: That laws are commands of human beings.
        correct: true
        why: >-
          Correct — the first meaning on the slide is the contention that laws are commands of human beings, held by
          Bentham and Austin but not by Kelsen.
      - text: That there is no necessary connection between law and morals.
        why: >-
          Tempting because it is the most famous positivist claim, but it is the second meaning on Hart's list, not the
          first.
      - text: That moral judgments cannot be defended by rational argument, evidence or proof.
        why: >-
          Tempting because it sounds foundational, but noncognitivism in ethics is the fifth meaning, held by Kelsen but
          not by Bentham and Austin.
  - key: q702
    type: mcq
    concept: what-is-legal-positivism
    difficulty: 2
    stem: Which of Hart's five meanings describes a legal system as a 'closed logical system'?
    options:
      - text: The second, on law as it is and law as it ought to be.
        why: >-
          Tempting because separation is often linked with formalism, but the second meaning is about law and morals,
          not about deducing decisions.
      - text: The third, on the analysis of legal concepts as worth pursuing.
        why: >-
          Tempting because analysis sounds logical, but the third meaning concerns conceptual analysis being worthwhile
          and distinct from other inquiries.
      - text: 'The fourth: correct decisions can be deduced from predetermined rules by logic alone.'
        correct: true
        why: >-
          Correct — the fourth meaning: a legal system is a closed logical system in which correct legal decisions can
          be deduced from predetermined legal rules by logical means alone.
      - text: The fifth, on noncognitivism in ethics.
        why: >-
          Tempting because it is the other meaning no utilitarian held, but the fifth concerns whether moral judgments
          can be rationally defended.
  - key: q703
    type: mcq
    concept: what-is-legal-positivism
    difficulty: 2
    stem: According to Hart, which of the five meanings did Bentham and Austin hold?
    options:
      - text: (1), (2) and (3), but not (4) and (5).
        correct: true
        why: 'Correct — the slide: Bentham and Austin held the views expressed in (1), (2) and (3), but not in (4) and (5).'
      - text: (2), (3) and (5), but not (1) and (4).
        why: >-
          Tempting because it is the other pattern on the slide, but this is Kelsen's: he held (2), (3) and (5), not (1)
          and (4).
      - text: All five, since they founded the positivist tradition in jurisprudence.
        why: >-
          Tempting because they are the founders, but Hart says they did not hold the closed logical system view (4) or
          noncognitivism (5).
      - text: Only (1), the imperative theory, which the others were later built upon.
        why: Tempting because the command theory is Austin's signature, but they also held separation (2) and analysis (3).
  - key: q704
    type: mcq
    concept: what-is-legal-positivism
    difficulty: 2
    stem: According to Hart, which of the five meanings did Kelsen hold?
    options:
      - text: (1), (2) and (3), but not (4) and (5).
        why: >-
          Tempting because it is the other pattern on the slide, but this is Bentham and Austin's; Kelsen did not hold
          that laws are commands (1).
      - text: (1) and (4) only.
        why: 'Tempting because these are the two he is said to reject, but the question asks what he held: (2), (3) and (5).'
      - text: (2), (3) and (5), but not (1) and (4).
        correct: true
        why: >-
          Correct — the slide (from Hart's 1958 article, n 25, and CL 302): Kelsen held (2), (3) and (5), but not those
          in (1) and (4).
  - key: q705
    type: mcq
    concept: what-is-legal-positivism
    difficulty: 3
    stem: Which of the five meanings did Kelsen hold but Bentham and Austin did not?
    options:
      - text: The second, that there is no necessary connection between law and morals.
        why: >-
          Tempting because Kelsen insists on purity, but Bentham and Austin also held (2); it is shared, not
          distinctive.
      - text: The fifth, noncognitivism in ethics.
        correct: true
        why: >-
          Correct — comparing the two patterns, Kelsen held (5), that moral judgments cannot be established by rational
          argument, evidence or proof; Bentham and Austin did not.
      - text: The first, that laws are commands of human beings.
        why: Tempting because Kelsen defines law as a coercive order, but he did not hold (1); only Bentham and Austin did.
      - text: The fourth, that law is a closed logical system.
        why: Tempting because Kelsen's hierarchy looks logical, but Hart says neither Kelsen nor the utilitarians held (4).
  - key: q706
    type: mcq
    concept: what-is-legal-positivism
    difficulty: 3
    stem: Which meaning of positivism did no one on Hart's slide — Bentham, Austin or Kelsen — hold?
    options:
      - text: The third, the analysis of legal concepts.
        why: Tempting because analysis sounds narrow, but all three held (3); it is shared by both patterns on the slide.
      - text: The fifth, noncognitivism in ethics.
        why: Tempting because the utilitarians rejected it, but Kelsen held (5); only one meaning is rejected by all.
      - text: The fourth, law as a closed logical system.
        correct: true
        why: >-
          Correct — Bentham and Austin did not hold (4), and neither did Kelsen; the closed logical system view is held
          by none of them on Hart's classification.
  - key: q707
    type: mcq
    concept: what-is-legal-positivism
    difficulty: 2
    stem: Which is one of the three senses of legal positivism distinguished at the end of the lecture?
    options:
      - text: Legal positivism as a theory of adjudication, predicting what courts will decide.
        why: >-
          Tempting because formalism in adjudication is a line of criticism, but the three senses are a general theory
          of law, a methodology, and a political theory.
      - text: Legal positivism as a sociological theory of how laws come to be obeyed.
        why: >-
          Tempting because positivism relies on social facts, but a sociology of obedience is not one of the three
          senses on the slide.
      - text: Legal positivism as a methodology.
        correct: true
        why: >-
          Correct — the three senses are legal positivism as a general theory of law, as a methodology, and as a
          political theory of law.
      - text: Legal positivism as a religious doctrine, founded by Auguste Comte.
        why: >-
          Tempting because the lecture mentions Comte's philosophical positivism, but it sets that apart; in legal
          theory positivism concerns positive law.
  - key: q708
    type: mcq
    concept: what-is-legal-positivism
    difficulty: 2
    stem: Which three theses make up legal positivism as a general theory of law?
    options:
      - text: The social facts thesis, the sources thesis and the separability thesis.
        correct: true
        why: >-
          Correct — the slide: law is grounded in social facts; existence and content depend on sources, not merits; and
          law and morality are separable.
      - text: The command thesis, the sanction thesis and the sovereignty thesis.
        why: >-
          Tempting because they are Austin's, but those belong to the imperative theory, which is a separate doctrine
          from positivism.
      - text: The neutrality thesis, the description thesis and the justification thesis.
        why: >-
          Tempting because neutrality and description appear on the slide, but they belong to positivism as a
          methodology, not as a general theory of law.
  - key: q709
    type: mcq
    concept: what-is-legal-positivism
    difficulty: 3
    contrasts-with:
      - separation-of-law-and-morals
    stem: What kind of claim is 'legal theory is a morally neutral, descriptive enterprise'?
    options:
      - text: A descriptive and conceptual claim about the nature of law.
        why: >-
          Tempting because it uses 'descriptive', but the slide classes claims about the nature of law under positivism
          as a general theory; this one is about theory.
      - text: A prescriptive, normative claim that morality and law should be kept separate.
        why: >-
          Tempting because it concerns separation, but that is the political theory of law; this claim concerns how
          legal theory is done.
      - text: A meta-theoretical claim about the nature of legal theory.
        correct: true
        why: >-
          Correct — the slide: legal positivism as a methodology holds that legal theory is a morally neutral,
          descriptive enterprise; this is a meta-theoretical claim.
      - text: A doctrinal claim about what the law requires in a particular legal system.
        why: >-
          Tempting because it is about law in some sense, but doctrinal claims concern specific legal issues; this is a
          claim about the enterprise of legal theory.
  - key: q710
    type: mcq
    concept: what-is-legal-positivism
    difficulty: 3
    stem: What is legal positivism as a political theory of law?
    options:
      - text: The view that legal theory must be morally neutral and descriptive, with no justificatory aims.
        why: >-
          Tempting because it concerns keeping morals out, but that is positivism as a methodology; the political sense
          is prescriptive about law.
      - text: The view that law and morality are conceptually inseparable, so law must be judged by morality.
        why: Tempting because it is about law and morality, but it is the opposite of positivism in any of its senses.
      - text: >-
          Moral criteria of validity are conceptually possible but not desirable, so law and morality should be kept
          separate.
        correct: true
        why: >-
          Correct — the slide: moral criteria of legal validity are not morally desirable (even though conceptually
          possible), so morality and law should be kept separate; a prescriptive separability thesis.
  - key: q711
    type: mcq
    concept: what-is-legal-positivism
    difficulty: 3
    stem: The separability thesis appears in two of the three senses. How do they differ?
    options:
      - text: The general theory says law and morals can be separated; the political theory says they should be.
        correct: true
        why: >-
          Correct — as a general theory, separability is a descriptive, conceptual claim; as a political theory, it is a
          prescriptive/normative version of the separability thesis.
      - text: The general theory says law and morals must be separated; the political theory says they cannot be.
        why: >-
          Tempting because it keeps two versions, but 'cannot be separated' is the anti-positivist view, and the general
          theory says they are separable, not must be.
      - text: 'They do not differ: both are meta-theoretical claims about the task of legal theory.'
        why: >-
          Tempting because both concern positivism, but the slide says the meta-theoretical claim belongs to the
          methodology, not to either separability thesis.
      - text: The general theory is about international law; the political theory is about municipal law.
        why: >-
          Tempting because Hart treats the two differently, but the three senses of positivism do not divide by type of
          law.
  - key: q712
    type: mcq
    concept: what-is-legal-positivism
    difficulty: 3
    stem: Why does the lecture ask you to stop and ask what an author means by 'legal positivism' whenever you meet it?
    options:
      - text: Because the term has only one correct meaning, and many authors misuse it.
        why: >-
          Tempting because some usages are careless, but the lecture says the expression is used for different things
          legitimately: a claim, a family of theories, a view on legal theory.
      - text: Because positivism is a term from sociology, and legal theorists should avoid it altogether in their writing.
        why: >-
          Tempting because Comte's positivism is sociological, but the lecture keeps the term; it only asks what is
          meant in each context.
      - text: 'Because people use it for different things: a claim, a family of theories, or views on legal theory.'
        correct: true
        why: >-
          Correct — the lecture says people often use the expression to mean different things, so ask whether it refers
          to a claim, a family of theories or views on the nature of legal theory.
  - key: q713
    type: mcq
    concept: what-is-legal-positivism
    difficulty: 4
    contrasts-with:
      - separation-of-law-and-morals
    stem: >-
      An essay answering 'Can a general, descriptive theory of law be value-free?' spends most of its words arguing that
      unjust laws are still laws. What is the main problem?
    options:
      - text: It relies on Hart rather than on natural law theorists, who are the proper authorities.
        why: >-
          Tempting because the question invites critics, but relying on Hart is not the problem; the problem is which
          sense of positivism the essay addresses.
      - text: >-
          It should have discussed Kelsen's basic norm instead of the separation of law and morals in the utilitarian
          tradition.
        why: >-
          Tempting because Kelsen's purity is relevant to Question 1, but swapping topics would not fix the essay's
          confusion between levels.
      - text: It addresses positivism as a theory of law, while the question is about positivism as a methodology.
        correct: true
        why: >-
          Correct — whether unjust laws are laws is a claim about the nature of law; the question tests the
          meta-theoretical claim that legal theory is morally neutral and descriptive.
      - text: It fails to cite the Nazi regime, which is the only example relevant to the question.
        why: >-
          Tempting because morally evil laws are a line of criticism, but the essay's problem is not a missing example;
          it is answering at the wrong level.
  - key: q714
    type: mcq
    concept: what-is-legal-positivism
    difficulty: 3
    stem: The lecture sets you an exercise with Hart's five meanings. What is it?
    options:
      - text: To rank the five meanings from most to least important for modern analytical legal theory.
        why: >-
          Tempting because the meanings differ in importance, but the lecture asks something more specific about Hart's
          own theory.
      - text: To work out which of the five claims Hart would defend and which he would reject.
        correct: true
        why: >-
          Correct — the lecture: look at these claims and ask which Hart would defend and which he would reject; if you
          can, you understand Hart's theory and what legal positivism means.
      - text: To show that Kelsen and the utilitarians share no meaning of positivism at all.
        why: Tempting because their patterns differ, but they share (2) and (3); the exercise concerns Hart himself.
  - key: q715
    type: mcq
    concept: what-is-legal-positivism
    difficulty: 4
    variant-of: q703
    stem: >-
      A theorist holds that laws are not commands, that there is no necessary connection between law and morals, and
      that legal concepts deserve analysis distinct from sociology and criticism. On Hart's five meanings, which does
      she hold?
    options:
      - text: (1), (2) and (3), the same pattern as Bentham and Austin.
        why: Tempting because she holds (2) and (3), but she denies that laws are commands, so she does not hold (1).
      - text: (2), (3) and (5), the same pattern as Kelsen.
        why: Tempting because she rejects (1) like Kelsen, but nothing says she holds noncognitivism (5).
      - text: (2) and (3).
        correct: true
        why: >-
          Correct — rejecting commands rules out (1); no necessary connection is (2); analysis of legal concepts as
          worthwhile and distinct is (3). Nothing is said about (4) or (5).
  - key: q716
    type: mcq
    concept: what-is-legal-positivism
    difficulty: 4
    variant-of: q706
    stem: >-
      A judge says: 'The right answer in every case can be deduced from the statute book by logic alone; moral argument
      never enters.' Which meaning of positivism is this, and who on Hart's slide held it?
    options:
      - text: The second meaning; held by Bentham, Austin and Kelsen alike, as all three accepted it.
        why: >-
          Tempting because the judge excludes morality, but the key claim is deduction by logic alone, which is the
          fourth meaning.
      - text: The fifth meaning, noncognitivism; held by Kelsen but not by Bentham and Austin.
        why: >-
          Tempting because moral argument is dismissed, but the claim is about deducing decisions, not about whether
          moral judgments can be rationally defended.
      - text: The fourth meaning; none of them held it.
        correct: true
        why: >-
          Correct — a closed logical system from which decisions are deduced by logic alone is meaning (4), which
          Bentham, Austin and Kelsen all rejected on Hart's account.
  - key: q717
    type: truefalse
    set: quickfire
    concept: what-is-legal-positivism
    difficulty: 1
    statement: >-
      Bentham and Austin held that law is a closed logical system in which correct decisions can be deduced by logic
      alone.
    answer: false
    why: >-
      False — Hart says Bentham and Austin held meanings (1), (2) and (3), but not (4), the closed logical system view,
      nor (5), noncognitivism.
  - key: q718
    type: truefalse
    set: quickfire
    concept: what-is-legal-positivism
    difficulty: 2
    statement: Legal positivism as a methodology makes a meta-theoretical claim about the nature of legal theory.
    answer: true
    why: >-
      True — the slide: legal theory is a morally neutral, descriptive enterprise; this is a meta-theoretical claim
      about the nature of legal theory.
  - key: q719
    type: truefalse
    concept: what-is-legal-positivism
    difficulty: 2
    statement: >-
      Legal positivism as a political theory of law holds that moral criteria of legal validity are conceptually
      impossible.
    answer: false
    why: >-
      False — it holds that moral criteria are not morally desirable even though they are conceptually possible; it is a
      prescriptive version of the separability thesis.
  - key: q720
    type: short
    concept: what-is-legal-positivism
    difficulty: 4
    prompt: >-
      'Hart is a legal positivist in every sense of the term.' Discuss, using Hart's five meanings of 'positivism' and
      the three senses of legal positivism.
    model: >-
      Hart is a positivist in some senses and not others, and the essay should show which. Of his own five meanings,
      Hart

      rejects the first: his whole theory replaces laws as commands with the union of primary and secondary rules. He
      holds

      the second, taking positivism to mean that it is in no sense a necessary truth that laws satisfy morality (CL
      185–186),

      and the third, defending the analytical study of legal concepts. Whether he holds (4), the closed logical system,
      or (5),

      noncognitivism, which Kelsen held, is not settled by the week's material, and an essay must argue it. Of the three
      senses, Hart plainly defends positivism as a general theory — law

      grounded in social facts, with validity fixed by a rule of recognition — and as a methodology: his account is
      'morally

      neutral and has no justificatory aims' (CL 240). The counterargument is that he is also a political positivist,
      since he

      thinks separation serves moral criticism. But saying a clear understanding is 'an important preliminary to any
      useful

      moral criticism' is not saying moral criteria of validity are undesirable. On balance Hart is a positivist in two
      of the

      three senses, and in two of his own five meanings clearly.
    rubric:
      - id: r1
        criterion: Thesis — a clear position on the senses in which Hart is and is not a positivist.
        marks: 2
        top-band: Names the senses in the thesis rather than a blanket yes or no.
        margin-note: Positivist in which sense?
        authorities: []
      - id: r2
        criterion: Argument — applies the five meanings to Hart's theory with evidence.
        marks: 3
        top-band: Rejects (1) with reasons and supports (2) and (3) with CL 185–186.
        margin-note: Evidence for each meaning?
        authorities:
          - hart-positivism-and-the-separation-of-law-and-morals
          - hart-the-concept-of-law
      - id: r3
        criterion: Counterargument — the case that Hart is also a political positivist.
        marks: 2
        top-band: States the strongest reading of CL 240 on moral criticism.
        margin-note: Is the political sense really absent?
        authorities: []
      - id: r4
        criterion: Evaluation — distinguishes the three senses and reaches a reasoned verdict.
        marks: 2
        top-band: Separates claims about law, about theory and about what law should be.
        margin-note: Does your conclusion follow from the distinctions?
        authorities: []
pretest:
  - q101
  - q201
  - q301
  - q401
  - q601
cards:
  - type: basic
    concept: legal-obligation-and-social-rules
    front: What difference does Hart say is 'yet to be explained' (CL 82)?
    back: >-
      The difference between the assertion that someone was obliged to do something and the assertion that he had an
      obligation to do it — the gunman versus the tax officer.
    source: Week 03 Lecture Slides, slide 4
  - type: basic
    concept: legal-obligation-and-social-rules
    front: Hart's three salient differences between habits and rules?
    back: >-
      1. Deviations from a rule are met with criticisms. 2. The rule is regarded as a good reason for making such
      criticism. 3. Social rules have an internal aspect.
    source: Week 03 Lecture Slides, slide 5
  - type: cloze
    concept: legal-obligation-and-social-rules
    text: >-
      The internal aspect of rules is 'a {{c1::critical reflective attitude}} to certain patterns of behaviour as a
      {{c2::common standard}}' (CL 57).
    source: Week 03 Lecture Slides, slide 5
  - type: cloze
    concept: legal-obligation-and-social-rules
    text: '''…habits are not {{c1::''normative''}}: they cannot confer {{c2::rights or authority}} on anyone'' (CL 60).'
    source: Week 03 Lecture Slides, slide 5
  - type: apply
    concept: legal-obligation-and-social-rules
    scenario: A person never pays tax and feels no pressure to do so. Is she under a legal obligation, on Hart's account?
    answer: >-
      Yes — obligation does not depend on compliance or feelings of compulsion; the rule applies to her even though she
      does not buy into it.
    source: Week 03 Lecture Transcript
  - type: basic
    concept: primary-and-secondary-rules
    front: Three defects of a regime of primary rules, and their remedies?
    back: Uncertainty → rule of recognition; static quality → rules of change; inefficiency → rules of adjudication.
    source: Week 03 Lecture Slides, slides 6–7
  - type: cloze
    concept: primary-and-secondary-rules
    text: >-
      The union of primary and secondary rules is 'not only the {{c1::heart of a legal system}}, but a most powerful
      tool for the analysis of much that has puzzled both the {{c2::jurist}} and the {{c3::political theorist}}' (CL
      98).
    source: Week 03 Lecture Slides, slide 7
  - type: apply
    concept: primary-and-secondary-rules
    scenario: A community that has just discovered it can fish calls a general assembly to make a fishing rule.
    answer: >-
      A rule of change: the community empowers itself to create a new rule, remedying the static character of its
      primary rules.
    source: Week 03 Lecture Transcript
  - type: basic
    concept: primary-and-secondary-rules
    front: Why is international law, for Hart, law but not a legal system?
    back: >-
      It consists of separate primary rules of obligation not united by secondary rules; it resembles municipal law in
      function and content, but its form/structure differs (CL 233).
    source: Week 03 Lecture Slides, slide 12
  - type: basic
    concept: rule-of-recognition-and-validity
    front: The forms the criteria of a rule of recognition may take (CL 100)?
    back: >-
      Reference to an authoritative text; legislative enactment; customary practice; general declarations of specified
      persons; past judicial decisions in particular cases.
    source: Week 03 Lecture Slides, slide 8
  - type: cloze
    concept: rule-of-recognition-and-validity
    text: >-
      To say a rule is valid is to recognise it as passing all the tests provided by the {{c1::rule of recognition}} —
      validity as {{c2::membership}} (CL 103).
    source: Week 03 Lecture Slides, slide 9
  - type: basic
    concept: rule-of-recognition-and-validity
    front: Is the rule of recognition valid?
    back: >-
      Neither valid nor invalid: it is simply accepted as appropriate for use — like the standard metre bar in Paris,
      the ultimate test that is not itself tested (CL 109).
    source: Week 03 Lecture Slides, slide 10
  - type: basic
    concept: rule-of-recognition-and-validity
    front: Hart's two minimum conditions for the existence of a legal system (CL 109)?
    back: >-
      Rules valid by the ultimate criteria must be generally obeyed; and the rules of recognition, change and
      adjudication must be effectively accepted as common public standards of official behaviour by officials.
    source: Week 03 Lecture Slides, slide 11
  - type: apply
    concept: rule-of-recognition-and-validity
    scenario: A regime is obeyed out of fear, but its officials share no criteria for identifying law.
    answer: >-
      No legal system on Hart's test: general obedience is present, but the second condition — official acceptance of
      secondary rules as common public standards — fails.
    source: Week 03 Lecture Slides, slide 11
  - type: basic
    concept: kelsen-pure-theory
    front: Kelsen's three claims about the nature of law (slide 18)?
    back: >-
      Law is by its very nature a definite type of norm; the law is a coercive order; it regulates its own creation,
      application and execution.
    source: Week 03 Lecture Slides, slide 18
  - type: cloze
    concept: kelsen-pure-theory
    text: >-
      'The command of the tax officer is {{c1::authorized by an objectively valid legal norm}}, whereas the command of
      the {{c2::gangster}} is not' (Kelsen, p 6).
    source: Week 03 Lecture Slides, slide 18
  - type: basic
    concept: kelsen-pure-theory
    front: Kelsen's claims about validity (slide 19)?
    back: >-
      If a norm is valid, it is binding; validity cannot be a fact; only a competent authority can create a valid norm;
      a chain of validity runs to the historically first constitution; the basic norm is a transcendental-logical
      presupposition.
    source: Week 03 Lecture Slides, slide 19
  - type: apply
    concept: kelsen-pure-theory
    scenario: Why is a council regulation valid, on Kelsen's account?
    answer: >-
      Because a higher norm authorised the council, and so on up the Stufenbau to the constitution, back to the
      historically first constitution, and finally to the presupposed basic norm.
    source: Week 03 Lecture Transcript
  - type: cloze
    concept: kelsen-pure-theory
    text: >-
      The pure theory 'answers the question of what the law {{c1::is}}, not what it {{c2::ought to be}}. The latter
      question is one of {{c3::politics}}, while the pure theory of law is {{c4::science}}' (1941).
    source: Week 03 Lecture Slides, slide 21
  - type: basic
    concept: recognition-vs-basic-norm
    front: Three differences between Hart's rule of recognition and Kelsen's Grundnorm?
    back: >-
      Fact (complex, empirical) vs presupposition (juristic hypothesis, fiction); neither valid nor invalid vs
      presupposed as valid; content varies by jurisdiction vs always the same content.
    source: Week 03 Lecture Slides, slide 20
  - type: cloze
    concept: recognition-vs-basic-norm
    text: >-
      Hart uses 'rule of recognition' instead of 'basic norm' partly 'to avoid any commitment to {{c1::Kelsen's view of
      the conflict between law and morals}}' (CL 293).
    source: Week 03 Lecture Slides, slide 20
  - type: basic
    concept: recognition-vs-basic-norm
    front: What do the rule of recognition and the basic norm have in common?
    back: >-
      The same function — each explains legal validity and the unity of a legal order — though Hart treats validity as
      membership and Kelsen as binding force.
    source: Week 03 Lecture Transcript
  - type: basic
    concept: separation-of-law-and-morals
    front: 'Green and Adams: what is legal positivism?'
    back: The thesis that the existence and content of law depends on social facts and not on its merits.
    source: Week 03 Lecture Slides, slide 23
  - type: cloze
    concept: separation-of-law-and-morals
    text: >-
      Hart: legal positivism is 'the simple contention that it is in no sense a {{c1::necessary truth}} that laws
      reproduce or satisfy certain demands of {{c2::morality}}, though in fact they have often done so'.
    source: Week 03 Lecture Slides, slide 24
  - type: basic
    concept: separation-of-law-and-morals
    front: Hart's 'two simple things' asserted by Bentham and Austin?
    back: >-
      Absent an express constitutional or legal provision, (1) a rule's violating morality does not show it is not law;
      (2) a rule's being morally desirable does not show it is law.
    source: Week 03 Lecture Slides, slide 27
  - type: basic
    concept: separation-of-law-and-morals
    front: Three doctrines of the utilitarian tradition, according to Hart?
    back: >-
      The separation of law and morals; the analytical study of legal concepts; the imperative theory of law — separate
      doctrines, not a package.
    source: Week 03 Lecture Slides, slide 28
  - type: basic
    concept: what-is-legal-positivism
    front: Hart's five meanings of 'positivism'?
    back: >-
      1. Laws are commands of human beings. 2. No necessary connection between law and morals. 3. Analysis of legal
      concepts worth pursuing and distinct. 4. Law as a closed logical system. 5. Noncognitivism in ethics.
    source: Week 03 Lecture Slides, slide 30
  - type: cloze
    concept: what-is-legal-positivism
    text: Bentham and Austin held meanings {{c1::(1), (2) and (3)}}; Kelsen held {{c2::(2), (3) and (5)}}.
    source: Week 03 Lecture Slides, slide 31
  - type: basic
    concept: what-is-legal-positivism
    front: Three senses of legal positivism, and the kind of claim each makes?
    back: >-
      General theory of law — descriptive and conceptual claims about law; methodology — a meta-theoretical claim about
      legal theory; political theory — a prescriptive version of the separability thesis.
    source: Week 03 Lecture Slides, slide 33
  - type: apply
    concept: what-is-legal-positivism
    scenario: An essay on 'Can a general, descriptive theory be value-free?' argues at length that unjust laws are still laws.
    answer: >-
      It answers at the wrong level: that is positivism as a theory of law; the question tests positivism as a
      methodology (legal theory as morally neutral and descriptive).
    source: Week 03 Lecture Slides, slide 33
audio:
  title: Week 3 recap — legal positivism, Hart and Kelsen
  minutes: 3
  script: >-
    Week three is about legal positivism, and it starts with the two most influential positivists of the twentieth

    century, Hart and Kelsen.


    Hart makes a fresh start from Austin's failure. The coercive-orders theory got one thing right: where there is law,

    conduct is made non-optional. But being obliged, as by a gunman, is not the same as having an obligation, as with
    the

    tax officer. To explain the difference Hart uses the social rule. Unlike a habit, a rule attracts criticism when
    broken,

    is treated as a good reason for that criticism, and has an internal aspect, a critical reflective attitude to a
    pattern

    as a common standard. Habits cannot confer rights or authority on anyone.


    A society with only primary rules of obligation has three defects: uncertainty, a static character and inefficiency.

    The remedies are secondary rules: the rule of recognition, rules of change and rules of adjudication. Their union is
    the

    heart of a legal system. International law, for Hart, is law but not a legal system.


    The rule of recognition gives authoritative criteria for identifying the rules, and it exists as a practice, kept
    alive

    by officials. A rule is valid if it passes its tests, so validity is membership. The rule itself is neither valid
    nor

    invalid, like the standard metre in Paris. A legal system exists when valid rules are generally obeyed and officials

    accept the secondary rules as common public standards.


    Kelsen sees law as a coercive order that regulates its own creation. The tax officer differs from the gangster
    because

    his command is authorised by a valid norm. Validity is binding force, running up a chain of authorisation to the

    historically first constitution and then to a presupposed basic norm: obey the first constitution. For Hart the rule
    of

    recognition is a fact whose content varies; for Kelsen the basic norm is a presupposition with the same content

    everywhere. Kelsen's theory is pure: it asks what law is, not what it ought to be.


    So what is legal positivism? Green and Adams say the existence and content of law depend on social facts, not
    merits.

    Hart says it is no necessary truth that laws satisfy morality. Bentham and Austin asserted two simple things:
    immorality

    alone does not stop a rule being law, and moral desirability alone does not make it law. Hart lists five meanings of

    positivism; Bentham and Austin held the first three, Kelsen the second, third and fifth. Finally, keep three senses

    apart: a general theory of law, a methodology, and a political theory. The essay's first question is about the
    second.
