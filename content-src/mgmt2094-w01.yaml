    kind: other
    text: 'Days after becoming Disney''s CEO in October 2005, Bob Iger flew to Apple and, with Steve Jobs, negotiated in less than a week a deal to put ABC shows such as Lost and Desperate Housewives on the iTunes store, which then sold only music. It was the first deal of its kind, made despite backlash from affiliates, retailers and the guilds. It changed Iger''s relationship with Jobs and led to Disney buying Pixar for $7.4 billion in early 2006. The two would stand in front of a whiteboard and ''muse on business'': media as ''the intersection between the story and the gadget''.'
