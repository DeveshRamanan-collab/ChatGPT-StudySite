    type: truefalse
    concept: creative-competencies
    difficulty: 2
    verify: true
    statement: In the recording, the lecturer says entrepreneurs fail on average three to four times before they become successful.
    answer: true
    why: True — the lecturer gives this figure to show why openness to failure matters. It is not on the slides, so treat the number as his claim, not a sourced statistic.
  - key: q519
    type: match
    concept: creative-competencies
    difficulty: 2
    prompt: Match each competency to the way the lecture explains it.
    pairs:
