cards:
  - type: basic
    concept: flip-mindset
    front: What does 'flip' mean on the Week 1 slides?
    back: 'Repeatedly moving between different perspectives and paradigms, now done in ''real'' time and on demand: a flexible, counter-intuitive mindset.'
    source: Week 01 Lecture Slides, slide 2
  - type: cloze
    concept: flip-mindset
    text: 'The unit is about creating a different mind set: {{c1::zig}} when everyone else is {{c2::zagging}}.'
    source: Week 01 Lecture Slides, slide 2
  - type: basic
    concept: flip-mindset
    front: Why does the lecture say technical knowledge is no longer enough?
    back: AI can provide any organisation or entrepreneur with technical knowledge and skill; creativity and innovation (including working with AI to boost them) are what set you apart.
    source: Week 01 Lecture Transcript
  - type: apply
    concept: flip-mindset
    scenario: A new TV-network CEO is offered a deal to sell the network's hit shows through a music store that has never sold TV, against the industry's usual business model.
    answer: 'Disney''s 2005 iTunes deal (Lost, Desperate Housewives): a counter-intuitive bet, seemingly at odds with the business model — the flip mindset.'
    source: Week 01 Reading — Lev-Ram (2015), Empire of Tech, PDF p 3
  - type: cloze
    concept: defining-creativity
    text: Creativity is {{c1::seeing what everyone else has seen}}, and {{c2::thinking what no-one else has thought}} (Einstein).
    source: Week 01 Lecture Slides, slide 11
  - type: basic
    concept: defining-creativity
    front: How do the slides define creative thinking?
    back: 'The ability to think, imagine or invent something new. The lecture keeps it broad: even taking a different route to campus counts.'
    source: Week 01 Lecture Slides, slide 12; Week 01 Lecture Transcript
  - type: cloze
    concept: defining-creativity
    text: '''When people say to me that they aren''t creative, I assume they haven''t {{c1::learnt what is involved}}'' — Sir Ken Robinson ({{c2::2011}}).'
    source: Week 01 Lecture Slides, slide 12
  - type: apply
    concept: defining-creativity
    scenario: 'An online shop sells phone cases but never holds any stock: the manufacturer ships each order straight to the customer.'
    answer: 'Dropshipping: the slides'' example of a creative way of doing business — you don''t physically hold the stock; the manufacturer or wholesaler supplies your customer directly.'
    source: Week 01 Lecture Slides, slide 12
  - type: basic
    concept: methods-for-creativity
    front: The six methods that can assist us in being creative?
    back: Mind mapping; brainstorming; sketching; free writing; thinking opposites; seeking inspiration.
    source: Week 01 Lecture Slides, slide 13
  - type: cloze
    concept: methods-for-creativity
    text: Without creativity we would have no {{c1::progress}} and would be forever {{c2::repeating the same experiences/patterns}}.
    source: Week 01 Lecture Slides, slide 13
  - type: basic
    concept: methods-for-creativity
    front: What does the lecture say is even more important than the individual creativity methods?
    back: 'How to unleash creativity in a group or an organisation: relying on a group of people is much more effective than relying only on yourself.'
    source: Week 01 Lecture Transcript
  - type: apply
    concept: methods-for-creativity
    scenario: Two CEOs regularly stand at a whiteboard together and 'just muse on business'; one says the friendship shaped his thinking more than any other relationship.
    answer: 'Seeking inspiration from another creative person: Bob Iger and Steve Jobs in the Week 1 reading.'
