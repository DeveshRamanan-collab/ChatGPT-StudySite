  - slug: creativity-gym
    title: 'The creativity gym: three stages of developing creative skill'
    visual: diagram
    visual-brief: Three ascending steps like gym levels — starting off (learn and develop the skills), being proficient (train your mind, get inspiration), becoming an expert (practise until creative mode is the default) — with a feedback arrow looping back from the top step.
    related:
