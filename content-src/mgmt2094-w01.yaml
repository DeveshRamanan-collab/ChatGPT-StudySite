  - key: q520
    type: short
    concept: creative-competencies
    difficulty: 3
    prompt: '''Creativity depends less on clever individuals than on the climate a team creates.'' Respond to this statement in a short essay, using the Week 1 competencies, a real example from the materials, and an evaluation of where the statement goes too far.'
    model: 'The statement is half right. Slide 15 lists the competencies we need to become creative in two groups. The individual ones are exploring problems, building up willpower, self-awareness, and being open to failure and feedback from others. The team or group ones are supporting ideas from team members, practising psychological safety, creating and sharing visions, and pushing the frontiers. Climate matters because, as the lecture explains, people hold back their ideas when they fear being seen as stupid or incompetent; psychological safety is an environment where everybody feels safe, not to relax but to take risks. A team that feels supported is empowered to push the frontiers, which the lecture calls the fuel for innovation. Disney shows the climate built into structure: Iger gave each business its own CTO, giving them ''the ability to experiment and try even if they fail … without a corporate watchdog looking over their shoulder'', and a CTO council shares ideas through hackathons. The statement goes too far, though: safety alone produces no ideas. Individuals still need willpower, self-awareness and the habit of exploring problems, and must learn from failure themselves.'
    rubric:
      - id: r1
        criterion: Concept — both lists of competencies, accurately.
        marks: 2
        top-band: Names the four individual and four team competencies from slide 15 and explains psychological safety as the lecture does (safe to take risks, not to relax).
        margin-note: Which list does each competency sit in?
        authorities: []
      - id: r2
        criterion: Example — a real example from the materials.
        marks: 2
        top-band: Uses Disney's CTO-per-business structure or CTO council (Lev-Ram 2015), quoting the 'experiment and try even if they fail' line.
        margin-note: What exactly made it safe to fail?
        authorities:
          - mgmt2094-example-disney-cto-council
      - id: r3
        criterion: Application — links climate to creative output.
        marks: 3
        top-band: Shows how psychological safety, supporting ideas and shared visions lead a team to push the frontiers, and what happens without them (ideas held back).
        margin-note: What do people do when they do not feel safe?
        authorities: []
      - id: r4
        criterion: Evaluation — a reasoned verdict on the statement.
        marks: 3
        top-band: 'Takes a position and shows where the statement overreaches: the individual competencies (willpower, self-awareness, openness to failure) are still needed.'
        margin-note: Can a safe team with no willpower innovate?
        authorities:
          - mgmt2094-example-disney-interactive-division
  - key: q601
    type: mcq
    concept: creativity-and-innovation
    difficulty: 1
    set: pretest
    stem: According to Theodore Levitt, as quoted on the slides, what is the difference between creativity and innovation?
    options:
      - text: Creativity is doing new things; innovation is thinking them up.
        why: 'Tempting because the two words are easy to swap, but this reverses Levitt: creativity is thinking up new things, innovation is doing them.'
      - text: Creativity is thinking up new things; innovation is doing new things.
        correct: true
        why: 'Correct — slide 17: ''Creativity is thinking up new things. Innovation is doing new things.'' — Theodore Levitt.'
      - text: Creativity is for individuals; innovation is only for organisations.
        why: Tempting because organisations implement innovations, but Levitt’s line is about thinking versus doing, not who does it.
      - text: Creativity is artistic work; innovation is technological work.
        why: Tempting because of a common stereotype, but slide 10 says creativity isn't just about the arts; Levitt's split is thinking versus doing.
  - key: q602
    type: mcq
    concept: creativity-and-innovation
    difficulty: 1
    stem: How do the slides divide the semester using Levitt's distinction?
    options:
      - text: Weeks 1–7 thinking up new things; Weeks 8–13 doing new things
        correct: true
        why: 'Correct — slide 17: in the first half (Weeks 1–7) you think up new things, and in the second half (Weeks 8–13) you do new things.'
      - text: Weeks 1–7 doing new things; Weeks 8–13 thinking up new things
        why: 'Tempting because the halves are right, but the order is reversed: thinking (creativity) comes first, doing (innovation) second.'
      - text: Weeks 1–4 creativity; Weeks 5–13 innovation, after the mind map
        why: Tempting because the mind map is due in Week 4, but the slide splits the semester at Week 7, not after the mind map.
      - text: Odd-numbered weeks creativity; even-numbered weeks innovation
        why: Tempting as a way to interleave the two, but the slide divides the semester into two halves, Weeks 1–7 and 8–13.
  - key: q603
    type: mcq
    concept: creativity-and-innovation
    difficulty: 2
    stem: What path does slide 16 say 'our path will venture down this semester'?
    options:
      - text: Innovation → creativity → imagination → vision
        why: 'Tempting because the four words are right, but the order is reversed: the path begins with vision and ends with innovation.'
      - text: Imagination → vision → innovation → creativity
        why: Tempting because all four steps are there, but the order is wrong; creativity comes before innovation, as Levitt’s split implies.
      - text: Vision → imagination → creativity → innovation
        correct: true
        why: Correct — slide 16 shows vision, imagination, creativity and innovation, in that order, rising out of an open head.
      - text: Creativity → innovation → vision → imagination
        why: Tempting because creativity and innovation are the unit’s title, but the slide puts vision and imagination before them.
  - key: q604
    type: mcq
    concept: creativity-and-innovation
    difficulty: 3
    contrasts-with:
      - defining-creativity
    stem: 'Disney Imagineering''s Dish lets the CEO walk through a virtual forest, but the reading says the technology is still too expensive and cumbersome for the parks. On Levitt''s distinction, it is best described as:'
    options:
      - text: innovation, because any new technology counts as innovation once it exists
        why: Tempting because the Dish really exists, but Levitt's innovation is doing new things in practice; it is not yet in the parks.
      - text: neither, because virtual reality cannot be creative when it uses existing hardware
        why: Tempting because VR hardware existed before, but the Dish is a new way to test rides; thinking it up is creativity.
      - text: 'creativity: a new thing thought up and tested, but not yet done in the parks'
        correct: true
        why: 'Correct — it is blue-sky experimentation, thought up and tested, but not yet something Disney does for guests: creativity, not yet innovation.'
      - text: innovation, because the CEO has personally tried it, so it has been done
        why: Tempting because the CEO used it, but a demonstration in the lab is not yet doing it for customers; the reading says it cannot work in a park yet.
  - key: q605
    type: mcq
    concept: creativity-and-innovation
    difficulty: 3
    stem: 'MagicBands, RFID wristbands that let guests enter Disney World, open hotel rooms and pay, have been given to more than 9 million guests. On Levitt''s distinction, they are:'
    options:
      - text: only creativity, because a wristband is an idea, whatever its use
        why: Tempting because MagicBands began as an idea, but they were actually rolled out and used; doing a new thing is innovation.
      - text: 'innovation: a new thing actually done, at scale, that brings value'
        correct: true
        why: 'Correct — MagicBands were implemented across the park and guests using them spend more: a new thing done, which Levitt calls innovation.'
      - text: neither, because they only copy existing credit and payment cards
        why: Tempting because payment is not new, but the reading says Disney invented a killer app for wearables; the combination was new and done.
      - text: only vision, the very first step on the semester’s path
        why: 'Tempting because the path starts with vision, but MagicBands are working products, the end of the path: innovation.'
  - key: q606
    type: mcq
    concept: creativity-and-innovation
    difficulty: 2
    stem: What does the lecture mean by calling creativity and innovation 'one for the other'?
    options:
      - text: They are the same thing, so the two words can be used interchangeably.
        why: Tempting because they are linked, but the lecture says we will learn the differences between the two; they are not interchangeable.
      - text: Different, but each supports the other.
        correct: true
        why: Correct — the lecture says the unit studies the differences between the two and how they support each other.
      - text: 'One replaces the other: once you innovate, creativity is no longer needed.'
        why: Tempting because innovation comes later on the path, but the lecture says they support each other, not that one ends the other.
      - text: They compete, so an organisation has to choose one or the other.
        why: Tempting because resources are limited, but the lecture says they support each other; choosing one is not the point.
  - key: q607
    type: mcq
    concept: creativity-and-innovation
    difficulty: 2
    stem: Slide 10 says 'Innovations isn't just about new things'. Which reading fits Levitt's line best?
    options:
      - text: Innovation is about old things, so it never involves anything new.
        why: Tempting as a literal reading of "not just about new things", but Levitt says innovation is doing new things; newness stays.
      - text: Innovation is about technology, so ideas without gadgets don’t count.
        why: Tempting because the reading is about tech, but dropshipping, a business method, is also treated as an idea implemented.
      - text: 'Innovation is about doing: a new thing counts once it is actually done.'
        correct: true
        why: Correct — Levitt's line puts the weight on doing; having a new thing is not enough until it is done.
      - text: Innovation is about thinking, so doing can be left to managers.
        why: Tempting because ideas come first, but Levitt calls thinking up new things creativity; innovation is the doing.
  - key: q608
    type: mcq
    concept: creativity-and-innovation
    difficulty: 3
    stem: 'Using Levitt, classify: ''A firm keeps doing exactly what it has always done, very efficiently.'''
    options:
      - text: 'Neither: it is doing, but nothing new; it is repeating the same patterns.'
        correct: true
        why: Correct — innovation is doing new things; doing the same thing efficiently is repeating patterns, which slide 13 says brings no progress.
      - text: Innovation, because the firm is actively doing something every day.
        why: Tempting because innovation is 'doing', but Levitt says doing new things; repeating old routines is not innovation.
      - text: Creativity, because running efficiently takes careful thought.
        why: Tempting because efficiency needs thought, but creativity is thinking up new things; nothing new is thought up here.
      - text: Both, because doing anything well needs creativity and innovation.
        why: Tempting as a generous reading, but both terms require something new; the scenario has none.
  - key: q609
    type: mcq
    concept: creativity-and-innovation
    difficulty: 3
    stem: Dropshipping is described as a simple idea someone 'came up with and was able to implement'. Why does this matter for the creativity–innovation distinction?
    options:
      - text: It shows that simple ideas can never become innovations.
        why: 'Tempting because innovation sounds grand, but the lecture''s point is the reverse: a simple idea, implemented, brings value.'
      - text: Thinking it up was creativity; implementing it was innovation.
        correct: true
        why: Correct — thinking it up is creativity; implementing it is doing a new thing, which is innovation, and the lecture says it brings value.
      - text: It shows that innovation always comes before creativity.
        why: Tempting because implementation is the visible part, but the idea came first; the path runs from creativity to innovation.
      - text: It shows that implementation is irrelevant if the idea is new.
        why: Tempting because the idea was clever, but the lecture stresses that someone was able to implement it; doing is what makes it innovation.
  - key: q610
    type: mcq
