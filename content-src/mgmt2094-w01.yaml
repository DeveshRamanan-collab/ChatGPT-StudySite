  - type: basic
    concept: innovation-at-disney
    front: What is the lesson of Lev-Ram (2015), Empire of Tech?
    back: Not only do today's media companies need to start thinking like technology companies; their CEOs also need to start thinking like CTOs.
    source: Week 01 Reading — Lev-Ram (2015), Empire of Tech, PDF p 3
  - type: basic
    concept: innovation-at-disney
    front: Iger's three strategic pillars?
    back: Investing in creative content, international expansion and technological innovation.
