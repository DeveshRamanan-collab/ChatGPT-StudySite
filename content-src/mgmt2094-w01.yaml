    title: 'Example: Disney''s CTO for each business and the CTO council'
    kind: other
    text: 'Rather than one corporate chief technology officer, Iger shifted decision-making power from a central strategic planning division to the business units and appointed a CTO for each: ''It gives the businesses the ability to experiment and try even if they fail on some of the things that they do, without a corporate watchdog looking over their shoulder all the time.'' The CTOs meet every few months as a council to discuss challenges and share information; the council has launched hackathons and a ''Best of Disney'' annual symposium where 50 new innovations are on display for the whole company.'
    gloss: Illustrates the team competencies — psychological safety to take risks, openness to failure, supporting ideas and sharing visions across a group.
    cases: []
    verify: false
  - slug: mgmt2094-example-disney-interactive-division
    title: 'Example: Disney''s interactive division'
    kind: other
    text: 'Disney''s interactive division (games and websites) was in the red for five years, losing more than $1 billion: ''We were too big and trying to do too many things'' (Jimmy Pitaro). After layoffs and reorganisations it dropped console games, put $100 million into Infinity and licensed products such as Line''s Tsum Tsum, and in 2014 turned its first profit ($116 million). It missed buying Minecraft owner Mojang, which Microsoft bought for $2.5 billion. Iger: ''If you''re going to win big, you have to get in early … We lost a fair amount of money in the process, but we learned from that.'''
    gloss: Illustrates openness to failure and learning from it, and shows that not every bet on new technology pays off.
    cases: []
    verify: false
  - slug: mgmt2094-example-dropshipping
    title: 'Example: Dropshipping'
    kind: other
    text: 'A creative way of doing business named on the Week 1 slides: you don''t physically hold the stock; the manufacturer or wholesaler supplies your customer directly. The lecture calls it a simple idea that someone came up with and was able to implement, and that brings value.'
    gloss: Illustrates creativity in business (a creative method of doing business) and creative thinking that becomes innovation once it is implemented.
    cases: []
    verify: false
  - slug: mgmt2094-example-creative-business-figures
    title: 'Example: Jeff Bezos, Elon Musk and Steve Jobs'
    kind: other
    text: 'The slides ask whom we admire as being creative in a business sense: ''It may have been the likes of Jeff Bezos; Elon Musk etc.'' The lecture adds Steve Jobs, says inspiration can also come from historical figures, politicians, artists and even generals, and suggests reading the biographies of creative people, naming Walter Isaacson''s biographies of Steve Jobs and Elon Musk.'
    gloss: Illustrates seeking inspiration as a creativity method, and creativity as a way to distinguish yourself in the 'new world'.
    cases: []
    verify: true

questions:
  - key: q101
    type: mcq
    concept: flip-mindset
    difficulty: 1
    set: pretest
    stem: According to the Week 1 slides, what does the term 'flip' describe?
    options:
      - text: Repeatedly moving between different perspectives and paradigms, in real time and on demand.
        correct: true
        why: 'Correct — slide 2: the flip is repeatedly moving between different perspectives and paradigms, now done in ''real'' time and on demand.'
      - text: Reversing a failed business decision and taking the company straight back to its original plan.
        why: Tempting because 'flip' sounds like a U-turn, but the slide's flip is an ongoing movement between perspectives, not undoing one decision.
      - text: Buying an undervalued business, improving it quickly and selling it on for a profit.
        why: Tempting because 'flipping' is used for quick resale of houses or firms, but the unit uses flip for a flexible mindset, not a deal type.
      - text: Copying a competitor's best idea and presenting it to your customers as your own.
        why: Tempting because zigging and zagging involve competitors, but copying is following the crowd; the flip is about moving between perspectives.
  - key: q102
    type: mcq
    concept: flip-mindset
    difficulty: 1
    stem: Which phrase does slide 2 use to capture what the unit is about?
    options:
      - text: Zig when everyone else is zagging.
        correct: true
        why: 'Correct — slide 2: ''Creating a different mind set…zig when everyone else is zagging!'' It means taking the path the crowd is not taking.'
      - text: Follow the market leader, but faster and cheaper.
        why: Tempting because speed matters in a fast-moving world, but following the leader is zagging with everyone else; the slide asks you to zig.
      - text: Think inside the box until the box is perfect.
        why: Tempting as a play on a familiar phrase, but refining the existing pattern is the opposite of the different mind set the slide describes.
      - text: Measure twice and cut once before any change.
        why: Tempting because caution sounds like sound business sense, but it is not on the slide; the unit asks for a flexible, counter-intuitive mindset.
  - key: q103
    type: mcq
    concept: flip-mindset
    difficulty: 2
    stem: The slides call the flip a 'counter-intuitive approach'. What do they say it reflects?
    options:
      - text: A management fashion that most firms tried and have now abandoned.
        why: Tempting if counter-intuitive is read as a fad, but the slide presents it as the direction business is moving in, not something abandoned.
      - text: 'The way business is heading today: to be more creative and innovative.'
        correct: true
        why: Correct — slide 2 says the counter-intuitive approach reflects the way business is heading today, to be more creative and innovative.
      - text: How large firms protected their markets before digital technology.
        why: Tempting because the lecture contrasts today with the past, but the slide ties the approach to where business is heading now, not before.
      - text: A personality trait that only naturally creative people are born with.
        why: Tempting because the unit asks whether creativity is natural, but the slide describes a mindset that reflects business today, not an inborn trait.
  - key: q104
    type: mcq
    concept: flip-mindset
    difficulty: 2
    stem: Why, according to the lecture, is technical knowledge alone no longer enough?
    options:
      - text: Universities have stopped teaching technical subjects to business students.
        why: Tempting because the lecture compares technical and creative skills, but it says nothing about universities dropping technical subjects.
      - text: Customers now care only about how products look, not whether they work.
        why: Tempting because creativity can sound like design or style, but the lecture never says function no longer matters; its reason is AI.
      - text: AI can supply any organisation with technical knowledge and skill.
        correct: true
        why: Correct — the lecture says that because AI can provide technical knowledge and skill to anyone, creativity and innovation are what set you apart.
      - text: Technical knowledge goes out of date before graduates can use it.
        why: Tempting because the world is changing quickly, but the lecture blames AI supplying technical knowledge, not knowledge expiring too fast.
  - key: q105
    type: mcq
    concept: flip-mindset
    difficulty: 2
    stem: In the lecture, why do you need to be able to move between perspectives 'with ease'?
    options:
      - text: Because the business world is fast moving and changing very quickly.
        correct: true
        why: Correct — the lecture says the world of business is fast moving and changing very quickly, so you must move between perspectives with ease.
      - text: Because tutorials run both on Zoom and face to face each week.
        why: Tempting because the lecture also covers how tutorials run, but that is administration; moving between perspectives is about the pace of business.
      - text: Because each assessment asks you to argue both sides of an issue.
        why: Tempting because considering perspectives sounds like a debate, but no assessment on the slides requires arguing both sides.
      - text: Because the exam asks you to memorise several competing definitions.
        why: Tempting because the week has several definitions, but the lecture links the flip to a fast-changing business world, not to memorising.
  - key: q106
    type: mcq
    concept: flip-mindset
    difficulty: 2
    stem: Slide 2 calls the flip 'a flexible mindset'. What else does it say this mindset does?
    options:
      - text: It stimulates a way of thinking and an approach to life.
        correct: true
        why: 'Correct — slide 2: ''It is a flexible mindset it stimulates a way of thinking and approach to life!'' — not just a business technique.'
      - text: It replaces the need for technical skills in a business setting.
        why: Tempting because the lecture says technical knowledge is not enough, but not enough is different from replaced; technical skill still matters.
      - text: It guarantees that a new venture will never fail at the start.
        why: Tempting because a flexible mindset sounds protective, but nothing promises success; the lecture expects failure and asks you to learn from it.
  - key: q107
    type: mcq
    concept: flip-mindset
    difficulty: 3
    stem: In 2005 Disney's new CEO put ABC hits Lost and Desperate Housewives on iTunes, a move the reading calls 'seemingly at odds with the company's business model'. Which Week 1 idea does this best illustrate?
    options:
      - text: 'The flip mindset: a counter-intuitive move that zigs while the industry zags.'
        correct: true
        why: Correct — a first-of-its-kind deal at odds with the business model is the counter-intuitive approach the slide calls the flip.
      - text: 'Starting off in the creativity gym: learning the basic skills of the industry.'
        why: Tempting because Iger was new to the CEO job, but he had worked at ABC since 1974; the deal shows a counter-intuitive bet, not basic learning.
      - text: 'Psychological safety: a team climate where people share ideas without fear.'
        why: Tempting because the deal took courage, but psychological safety is a team competency; this is one leader making a counter-intuitive bet.
      - text: 'Brainstorming: a group generating many ideas before judging any of them.'
        why: Tempting because brainstorming is a listed method, but the reading describes a deal negotiated between two CEOs, not an idea-generating session.
  - key: q108
    type: mcq
    concept: flip-mindset
    difficulty: 3
    stem: 'Tim Cook says of Bob Iger: ''He understands the tradition of Disney but isn''t wedded to it.'' How does this connect to the flip mindset?'
    options:
      - text: He has rejected Disney's tradition entirely and replaced it with Apple's way of working.
        why: Tempting because Iger partnered closely with Apple, but Cook says he understands the tradition; the flip moves between paradigms, it does not discard one.
      - text: He can move between Disney’s established paradigm and new ones without being locked into either.
        correct: true
        why: Correct — understanding the tradition but not being wedded to it is moving between perspectives and paradigms, which is what the flip means.
      - text: He keeps Disney exactly as it was, so customers can rely on the familiar brand.
        why: Tempting because he understands the tradition, but 'isn't wedded to it' means he is willing to depart from it, as the iTunes deal shows.
      - text: He leaves technology decisions to Apple so Disney can focus only on tradition.
        why: Tempting because Apple is mentioned, but the reading says Iger acts as Disney’s own CTO; he does not hand technology to a partner.
  - key: q109
    type: mcq
    concept: flip-mindset
    difficulty: 2
    stem: Where does the lecturer say the flip mindset is useful?
    options:
      - text: Only in start-ups, because large organisations cannot change direction quickly.
        why: Tempting because start-ups move fast, but the lecturer applies the approach to organisations of all kinds and to life beyond business.
      - text: Only in the creative industries, such as film, music and the visual arts.
        why: Tempting because creativity is often linked to the arts, but slide 10 says creativity isn't just about the arts, and the flip is for business too.
      - text: In business and organisations, and beyond them in any sphere of life.
        correct: true
        why: Correct — the lecturer says the approach serves businesses and organisations and is useful in any sphere of life, including your personal life.
      - text: Only in technology firms, where AI makes the pace of change the fastest.
        why: Tempting because AI is part of the lecture’s argument, but AI is the reason it matters now, not a limit on where the mindset applies.
  - key: q110
    type: mcq
    concept: flip-mindset
    difficulty: 3
    stem: While rival bookshops fight on price, one chain turns part of each store into a free reading lounge with author talks. Which Week 1 idea is this closest to?
    options:
      - text: 'Zigging while competitors zag: a counter-intuitive approach to the same market.'
        correct: true
        why: Correct — while rivals compete on price, the chain moves the other way; that is zigging while everyone else zags, the counter-intuitive approach.
      - text: 'Dropshipping: selling stock the business never physically holds itself.'
        why: Tempting because it is the slides’ example of a creative business method, but nothing here involves suppliers shipping straight to customers.
      - text: 'Becoming an expert in the creativity gym: receiving feedback on creative actions.'
        why: Tempting because the chain acts creatively, but the scenario describes a counter-intuitive move in a market, not a stage of personal skill.
      - text: 'Supporting ideas from team members: championing a colleague''s proposal.'
        why: Tempting because someone must have proposed the idea, but the scenario is about the firm’s move against the crowd, not a team competency.
  - key: q111
    type: mcq
    concept: flip-mindset
    difficulty: 4
    stem: Which statement best separates the flip from simply always disagreeing with the majority?
    options:
      - text: The flip means always taking the opposite view to the majority, whatever the facts are.
        why: Tempting because 'zig when everyone else is zagging' sounds like opposing the crowd, but the flip moves between perspectives, not to one fixed opposite.
      - text: The flip means repeatedly moving between perspectives on demand, not fixing on the opposite view.
        correct: true
        why: Correct — slide 2 says 'repeatedly moving between different perspectives and paradigms'; a fixed contrary stance is just another single perspective.
      - text: The flip means waiting until competitors have moved and then copying whoever wins.
        why: Tempting because it reacts to competitors, but waiting and copying is zagging with the crowd, the opposite of the counter-intuitive approach.
      - text: The flip means holding one perspective firmly so that the team is never confused.
        why: Tempting because consistency sounds reassuring, but holding one perspective is exactly what the flexible flip mindset avoids.
  - key: q112
    type: mcq
    concept: flip-mindset
    difficulty: 2
    stem: According to the lecture, how should we approach AI?
    options:
      - text: Avoid it, because it weakens human creativity.
        why: Tempting because AI is presented as a challenge to technical skill, but the lecture wants us to work with AI, not avoid it.
      - text: Work with it to boost creativity and create innovation.
        correct: true
        why: Correct — the lecture asks how to use, or work with, AI to boost creativity and create innovation in an AI world.
      - text: Let it do the creative work so people can focus on doing.
        why: Tempting because AI is powerful, but the lecture says creativity and innovation are what people bring; AI should boost them, not replace them.
      - text: Use it only for technical tasks, never for creative ones.
        why: Tempting because AI is described as supplying technical knowledge, but the lecture wants AI used to boost creativity too.
  - key: q113
    type: mcq
    concept: flip-mindset
    difficulty: 1
    stem: According to the lecture, how has the importance of creativity and innovation changed?
    options:
      - text: They have become far more important today, especially with the advance of AI.
        correct: true
        why: Correct — the lecture says they were not talked about as much 20 to 50 years ago and are extraordinarily important now, especially with AI.
      - text: They mattered most 50 years ago and matter less now that technology does the work.
        why: 'Tempting because technology now does much of the work, but the lecture argues the opposite: technology makes creativity matter more.'
      - text: They have stayed equally important, because human nature has not changed at all.
        why: Tempting because creativity is a human capacity, but the lecture says these topics are becoming even more important today.
  - key: q114
    type: mcq
    concept: flip-mindset
    difficulty: 3
    stem: 'A manager says: ''Our technical expertise is our edge; creativity is a nice extra.'' Which reply best reflects the Week 1 lecture?'
    options:
      - text: AI can now supply technical knowledge; creativity and innovation set you apart.
        correct: true
        why: Correct — the lecture says technical knowledge is absolutely not enough because AI can provide it to anyone; creativity and innovation distinguish you.
      - text: 'Agreed: technical skill matters most, so creativity can be left to the marketing team.'
        why: Tempting because many firms think this way, but the lecture says creativity is everywhere in business and is now what distinguishes a firm.
      - text: Creativity cannot be learnt, so the firm should simply hire naturally creative people.
        why: Tempting because some people are more naturally creative, but Robinson and the lecturer both say creativity can be learnt and improved.
      - text: Technical expertise and creativity become the same thing once a firm grows large.
        why: 'Tempting because large firms need both, but the lecture treats them as different: AI can supply technical knowledge, not creativity.'
  - key: q115
    type: truefalse
    concept: flip-mindset
    difficulty: 1
    set: quickfire
    statement: The slides say the flip is now done in 'real' time and on demand.
    answer: true
    why: 'True — slide 2: the flip, repeatedly moving between perspectives and paradigms, ''is now done in "real" time and on demand''.'
  - key: q116
    type: truefalse
    concept: flip-mindset
    difficulty: 1
    set: quickfire
    statement: The slides describe the unit’s approach as conventional and intuitive, reflecting how business has always worked.
    answer: false
    why: False — slide 2 calls it a more counter-intuitive approach that reflects the way business is heading today, to be more creative and innovative.
  - key: q117
    type: truefalse
    concept: flip-mindset
    difficulty: 2
    set: quickfire
    statement: In the reading, one of Iger's first moves as CEO was a bet that seemed at odds with Disney's own business model.
    answer: true
    why: True — putting ABC shows on iTunes in 2005 was 'seemingly at odds with the company's business model' and the first deal of its kind.
  - key: q118
    type: truefalse
    concept: flip-mindset
    difficulty: 2
    statement: The lecturer says creativity and innovation were discussed just as much 30 to 50 years ago as they are today.
    answer: false
    why: False — the lecturer says these topics were not talked about as much 30, 40 or 50 years ago, or even 20; today, with AI, they are extraordinarily important.
  - key: q119
    type: match
    concept: flip-mindset
    difficulty: 2
    prompt: Match each phrase from the slide on what the unit is about to its meaning.
    pairs:
      - left: Zig when everyone else is zagging
        right: Go a different way from the crowd
      - left: Flip
        right: Repeatedly move between perspectives and paradigms
      - left: '''Real'' time and on demand'
        right: Flipping happens whenever needed, not once
      - left: Counter-intuitive approach
        right: 'Reflects where business is heading: more creative and innovative'
  - key: q120
    type: short
    concept: flip-mindset
    difficulty: 3
    prompt: '''In a fast-moving, AI-driven business world, the ability to flip between perspectives matters more than technical knowledge.'' Respond to this statement in a short essay: explain the flip mindset, apply it to a real example from the Week 1 materials, and evaluate its limits.'
    model: 'The statement is largely right, with one caveat: the flip does not replace technical knowledge; it is what sets you apart once everyone has it. The unit is about creating a different mind set: zig when everyone else is zagging. The slides call this the flip: repeatedly moving between different perspectives and paradigms, now done in real time and on demand. It is a flexible, more counter-intuitive approach that reflects the way business is heading, to be more creative and innovative. The lecture gives two reasons it matters now: business is fast moving and changing very quickly, and with the advance of AI technical knowledge is not enough, because AI can supply it to anyone. Disney under Bob Iger shows the flip in action. In 2005 he put ABC''s Lost and Desperate Housewives on iTunes, a first-of-its-kind deal seemingly at odds with Disney''s business model. Tim Cook''s remark that Iger understands Disney''s tradition but isn''t wedded to it captures moving between paradigms. The limit is that a counter-intuitive bet can fail: Disney''s interactive division spent five years in the red. The flip therefore needs openness to failure and learning, not contrariness for its own sake.'
    rubric:
      - id: r1
        criterion: Concept — defines the flip accurately.
        marks: 2
        top-band: Defines the flip in the slide's words (repeatedly moving between perspectives and paradigms, in real time and on demand) and links it to zigging when others zag.
        margin-note: Is the flip one change of direction, or a repeated movement?
        authorities: []
      - id: r2
        criterion: Example — a real example from the materials.
        marks: 2
        top-band: Uses the 2005 iTunes deal (Lev-Ram 2015) with the detail that it was seemingly at odds with Disney's business model.
        margin-note: Which detail shows it was counter-intuitive?
        authorities:
          - mgmt2094-example-disney-itunes-deal
      - id: r3
        criterion: Application — connects the example to why the flip matters now.
        marks: 3
        top-band: 'Explains why the deal is counter-intuitive and ties it to the lecture''s reasons: a fast-moving world, and AI making technical knowledge insufficient.'
        margin-note: Why now, and not twenty years ago?
        authorities:
          - mgmt2094-lev-ram-2015-empire-of-tech
      - id: r4
        criterion: Evaluation — limits and trade-offs.
        marks: 3
        top-band: Weighs a limit from the materials, such as the backlash or bets that failed (the interactive division), and says what the flip needs to work.
        margin-note: Is every counter-intuitive move a good one?
        authorities:
          - mgmt2094-example-disney-interactive-division
  - key: q201
    type: mcq
    concept: defining-creativity
    difficulty: 1
    set: pretest
    stem: Which definition of creativity, attributed to Einstein, appears on the Week 1 slides?
    options:
      - text: Seeing what everyone else has seen, and thinking what no-one else has thought.
        correct: true
        why: 'Correct — slide 11: ''Creativity is seeing what everyone else has seen, and thinking what no-one else has thought!'' — Einstein.'
      - text: Thinking up new things, while innovation is the work of doing new things.
        why: Tempting because it is also on the slides, but it is Theodore Levitt's line distinguishing creativity from innovation (slide 17).
      - text: Assuming that people who say they aren't creative haven't learnt what is involved.
        why: Tempting because it is quoted on the next slide, but that is Sir Ken Robinson (2011) on learning creativity, not a definition.
      - text: Seeing what no-one else has seen, and thinking what everyone else has thought.
        why: 'Tempting because it uses the same words, but it reverses the definition: we all see the same things; the creative part is the new thought.'
  - key: q202
    type: mcq
    concept: defining-creativity
    difficulty: 1
    stem: How do the slides define creative thinking?
    options:
      - text: The ability to produce works of fine art, music or literature.
        why: Tempting because creativity is often linked with the arts, but slide 10 says creativity isn't just about the arts, and the definition is broader.
      - text: The ability to think, imagine or invent something new.
        correct: true
        why: 'Correct — slide 12: creative thinking ''is seen simply as the ability to think, imagine or invent something new''.'
      - text: The ability to turn a new idea into a profitable product or business.
        why: Tempting because the unit is about business, but turning ideas into something done is innovation in Levitt's sense, not creative thinking.
      - text: The ability to recall many facts quickly when under pressure.
        why: Tempting because quick thinking can feel creative, but recall repeats what is known; creative thinking is about something new.
  - key: q203
    type: mcq
    concept: defining-creativity
    difficulty: 2
    stem: 'Sir Ken Robinson (2011) is quoted: ''When people say to me that they aren''t creative, I assume they haven''t ___.'' Complete the quote.'
    options:
      - text: found the right job yet
        why: 'Tempting because work can stifle creativity, but the quote is about learning: Robinson assumes they haven’t learnt what is involved.'
      - text: learnt what is involved
        correct: true
        why: 'Correct — slide 12: ''I assume they haven''t learnt what is involved'' — creativity is something you can learn.'
      - text: been born with the talent
        why: 'Tempting because the slides ask ''aren''t we just that naturally?'', but Robinson''s point is the opposite: creativity can be learnt.'
      - text: tried hard enough to fail
        why: Tempting because the lecture values failure, but openness to failure is a competency on slide 15, not the end of Robinson’s quote.
  - key: q204
    type: mcq
    concept: defining-creativity
    difficulty: 2
    stem: According to the lecture, why is Einstein's definition especially apt today?
    options:
      - text: Information is scarce, so creative people are those who find facts others cannot.
        why: 'Tempting because finding information can feel creative, but the lecture says the opposite: information is abundant and easy to access.'
      - text: Science has replaced the arts, so only scientific thinking now counts as creative.
        why: Tempting because Einstein was a scientist, but the slides say creativity is broad and isn't just about the arts; nothing makes it only scientific.
      - text: We all have easy access to abundant information, so the key is thinking what no-one else has.
        correct: true
        why: Correct — the lecture says we can all see a lot because information is abundant; the key is to think or perceive what no-one else has thought.
      - text: Most people already see things differently, so creativity is just describing what you see.
        why: Tempting because the definition mentions seeing, but its point is that everyone sees the same things; the creative step is the new thought.
  - key: q205
    type: mcq
    concept: defining-creativity
    difficulty: 2
    stem: Which of these would the lecturer count as creative thinking?
    options:
      - text: Deciding one day to take a different route to campus.
        correct: true
        why: 'Correct — the lecturer says even a simple act like taking a different path to campus is already somewhat creative: it is something new.'
      - text: Taking the usual route to campus every day to save time.
        why: Tempting because saving time is sensible, but repeating the same route is repeating a pattern; creative thinking involves something new.
      - text: Memorising the timetable so that you never miss a bus.
        why: Tempting because it takes effort, but memorising reproduces what exists; creative thinking is thinking, imagining or inventing something new.
      - text: Copying a friend’s tutorial answers word for word.
        why: Tempting only as a shortcut, but copying is the opposite of thinking what no-one else has thought; nothing new is imagined or invented.
  - key: q206
    type: mcq
    concept: defining-creativity
    difficulty: 2
    stem: Slide 10 says 'creativity isn't just about the arts'. What does the lecture say instead?
    options:
      - text: Creativity belongs mainly to science and engineering, where real progress is made.
        why: Tempting because progress needs new ideas, but the lecture does not move creativity to science; it says creativity is everywhere.
      - text: Creativity is about the arts, but businesses can hire artists when they need it.
        why: Tempting because firms do hire creatives, but the lecture says creativity is a business matter in its own right, not something to outsource.
      - text: Creativity is pretty much everywhere, especially in business and in building organisations.
        correct: true
        why: Correct — the lecture says creativity is pretty much everywhere, especially in business, because we are creating and building organisations.
      - text: Creativity matters for products, but not for processes or how organisations work.
        why: Tempting because products are the obvious output, but the lecture names creative processes and methods of doing business, such as dropshipping.
  - key: q207
    type: mcq
    concept: defining-creativity
    difficulty: 1
    stem: How do the slides describe dropshipping?
    options:
      - text: You hold all the stock yourself and deliver it to customers by drone.
        why: 'Tempting because drones appear in the Disney reading, but dropshipping is the reverse: you do not hold the stock at all.'
      - text: You hold no stock; the manufacturer or wholesaler ships to your customer directly.
        correct: true
        why: Correct — slide 12 defines dropshipping as not physically holding the stock, with the manufacturer or wholesaler supplying your customer directly.
      - text: You sell your stock to a wholesaler, who sells it back to you later at a discount.
        why: Tempting because a wholesaler is involved, but in dropshipping the wholesaler supplies your customer; there is no buy-back.
      - text: You let customers collect the stock themselves from your own warehouse.
        why: Tempting because it also cuts delivery work, but dropshipping means you have no warehouse stock; the supplier ships to the customer.
  - key: q208
    type: mcq
    concept: defining-creativity
    difficulty: 3
    stem: 'Ava runs an online store selling phone cases but never holds any: when a customer orders, the manufacturer ships the case straight to them. How do the Week 1 slides classify her method?'
    options:
      - text: Free writing, one of the six methods for becoming creative.
        why: Tempting because free writing is on the slides, but it is a method for generating ideas, not a way of running a business.
      - text: Thinking opposites, one of the six methods for becoming creative.
        why: 'Tempting because not holding stock is the opposite of a normal shop, but the slides name this business method directly: dropshipping.'
      - text: Dropshipping, a creative way of doing business.
        correct: true
        why: 'Correct — slide 12''s example of a creative method of doing business: you don''t hold stock; the manufacturer supplies your customer directly.'
      - text: Psychological safety, a team competency for taking risks.
        why: Tempting because Ava takes a business risk, but psychological safety is about a team climate for sharing ideas, not a business model.
  - key: q209
    type: mcq
    concept: defining-creativity
    difficulty: 2
    stem: Whom do the slides name as admired for being creative in a business sense?
    options:
      - text: Albert Einstein and Theodore Levitt
        why: Tempting because both are quoted on the slides, but they are quoted for definitions of creativity and innovation, not as business examples.
      - text: Sir Ken Robinson and Bob Iger
        why: Tempting because Robinson is quoted on the same slide and Iger is in the reading, but the slide's business examples are Bezos and Musk.
      - text: Jeff Bezos and Elon Musk
        correct: true
        why: 'Correct — slide 12: ''Whom do we admire as being creative in a business sense? It may have been the likes of Jeff Bezos; Elon Musk etc.'''
      - text: Walt Disney and George Lucas
        why: Tempting because both appear in the Week 1 reading, but they are not the people the slides name as admired business creatives.
  - key: q210
    type: mcq
    concept: defining-creativity
    difficulty: 3
    stem: 'A classmate says: ''I''m just not a creative person, so this unit isn''t for me.'' Which response best reflects the Week 1 materials?'
    options:
      - text: 'Robinson: you haven''t learnt what is involved; the lecturer thinks people can improve.'
        correct: true
        why: Correct — Robinson assumes such people haven't learnt what is involved, and the lecturer's hunch is that the less naturally creative can improve.
      - text: 'That''s right: creativity is innate, so this unit can only help people who were born creative.'
        why: Tempting because slide 10 says some of us may be naturally creative, but Robinson's quote and the gym metaphor say it can be learnt.
      - text: You only need creativity if you plan to work in the arts, not in business.
        why: Tempting because creativity is linked with the arts, but slide 10 says creativity isn't just about the arts; business is full of it.
      - text: Creativity cannot be studied, but innovation can, so focus on the second half.
        why: Tempting because the semester splits thinking from doing, but the first half exists to develop creativity, which the unit treats as learnable.
  - key: q211
    type: mcq
    concept: defining-creativity
    difficulty: 3
    stem: Why does the lecturer say even naturally creative people benefit from studying creativity?
    options:
      - text: It builds structures around their creativity so they can leverage it into something practical, like a business.
        correct: true
        why: Correct — the lecturer says study helps even artists create structures around their creativity and use it to make something practical and useful.
      - text: It lets them prove to employers and clients that they really are naturally creative people.
        why: Tempting because study brings credentials, but the lecturer’s reason is turning creativity into something useful, not proving talent.
      - text: It stops them being creative in ways their employer did not ask them to be.
        why: Tempting if study is seen as discipline, but the lecture wants creativity leveraged and brought to light, not restrained.
      - text: It replaces their natural talent with a set of reliable, repeatable techniques.
        why: Tempting because methods are taught, but the lecture says study adds structure to natural creativity; it does not replace it.
  - key: q212
    type: mcq
    concept: defining-creativity
    difficulty: 2
    stem: What does slide 10 say studying creativity and innovation will allow us to do?
    options:
      - text: Distinguish ourselves from others in the 'new world'.
        correct: true
        why: 'Correct — slide 10: ''It will actually allow us to distinguish ourselves from others in the "new world"''.'
      - text: Avoid the need for teamwork in our future organisations.
        why: Tempting because creativity can seem individual, but the lecture says unleashing creativity in groups matters even more.
      - text: Guarantee the success of any new business we decide to start.
        why: Tempting because the unit is practical, but nothing guarantees success; the lecture expects failure and asks us to learn from it.
      - text: Replace the need for innovation with a stream of better ideas.
        why: Tempting because ideas are creativity’s output, but the unit treats creativity and innovation as supporting each other, not substitutes.
  - key: q213
    type: mcq
    concept: defining-creativity
    difficulty: 4
    contrasts-with:
      - creativity-and-innovation
    stem: Which statement correctly matches each quoted line to what it defines?
    options:
      - text: Einstein defines innovation; Levitt defines creative thinking as imagining something new.
        why: Tempting because both men are quoted, but Einstein defines creativity, and the think-imagine-invent definition of creative thinking is unattributed.
      - text: Robinson defines creativity; Einstein distinguishes creativity from innovation.
        why: Tempting because Robinson is quoted on creativity, but his line is about learning it; it is Levitt, not Einstein, who distinguishes the two.
      - text: Einstein defines creativity; Levitt distinguishes creativity (thinking up) from innovation (doing).
        correct: true
        why: Correct — Einstein (slide 11) defines creativity; Levitt (slide 17) says creativity is thinking up new things and innovation is doing new things.
      - text: Levitt defines creativity as seeing what all have seen; Einstein defines innovation as doing.
        why: Tempting because the lines are easy to swap, but the seeing-and-thinking definition is Einstein’s and the thinking-versus-doing split is Levitt’s.
  - key: q214
    type: mcq
    concept: defining-creativity
    difficulty: 3
    variant-of: q205
    stem: Which example best shows creative thinking in the lecture's broad sense?
    options:
      - text: Re-reading the same chapter until it is memorised.
        why: Tempting because it is focused study, but it repeats what is on the page; creative thinking imagines or invents something new.
      - text: Recording which books are borrowed most often each week.
        why: Tempting because it produces new data, but counting what exists is observation, not thinking, imagining or inventing something new.
      - text: Returning a library book on time to avoid a late fee.
        why: Tempting as sensible behaviour, but it follows an existing rule; nothing new is thought, imagined or invented.
      - text: Imagining a different ending while reading a novel.
        correct: true
        why: Correct — the lecturer says that reading a book and imagining things is already creative thinking, because you are creating something new.
  - key: q215
    type: truefalse
    concept: defining-creativity
    difficulty: 1
    set: quickfire
    statement: The slides attribute the definition 'Creativity is seeing what everyone else has seen, and thinking what no-one else has thought' to Einstein.
    answer: true
    why: True — slide 11 gives this definition and attributes it to Einstein; Levitt’s line on creativity and innovation comes later, on slide 17.
  - key: q216
    type: truefalse
    concept: defining-creativity
    difficulty: 1
    set: quickfire
    statement: According to the slides, creativity is mainly about the arts.
    answer: false
    why: False — slide 10 says 'Creativity isn't just about the arts'; the lecture says it is pretty much everywhere, especially in business.
  - key: q217
    type: truefalse
    concept: defining-creativity
    difficulty: 1
    set: quickfire
    statement: In dropshipping, the business physically holds the stock and ships it to customers itself.
    answer: false
    why: 'False — slide 12: in dropshipping you don''t physically hold the stock; the manufacturer or wholesaler supplies your customer directly.'
  - key: q218
    type: truefalse
    concept: defining-creativity
    difficulty: 2
    statement: The lecturer’s view is that people who are not naturally creative can probably improve their creativity.
    answer: true
    why: True — asked whether the less naturally creative can improve, the lecturer's hunch is 'probably yes', in line with Robinson's quote on learning.
  - key: q219
    type: match
    concept: defining-creativity
    difficulty: 2
    contrasts-with:
      - creativity-and-innovation
    prompt: Match each name to the way it appears in Week 1.
    pairs:
      - left: Einstein
        right: Creativity is seeing what everyone else has seen and thinking what no-one else has thought
      - left: Sir Ken Robinson (2011)
        right: People who say they aren't creative haven't learnt what is involved
      - left: Jeff Bezos and Elon Musk
        right: Admired as being creative in a business sense
      - left: Theodore Levitt
        right: Creativity is thinking up new things; innovation is doing new things
  - key: q220
    type: short
    concept: defining-creativity
    difficulty: 3
    prompt: '''Creativity is a talent you are born with; it cannot be taught.'' Respond to this statement in a short essay: define creativity using the Week 1 materials, apply the definition to a real example, and evaluate the lecture''s answer to whether creativity can be learnt.'
    model: 'The statement is too strong. Einstein''s definition, quoted on the slides, is that creativity is seeing what everyone else has seen, and thinking what no-one else has thought. Creative thinking is simply the ability to think, imagine or invent something new, and the lecture keeps it broad: imagining while reading a novel, or taking a different route to campus, already counts. Creativity isn''t just about the arts; it is everywhere in business. Dropshipping shows this in a business setting: someone thought of selling without physically holding stock, with the manufacturer or wholesaler supplying the customer directly. On natural versus learnt, the slides concede that some of us may be naturally creative and others aren''t, but Sir Ken Robinson assumes that people who say they aren''t creative haven''t learnt what is involved. The lecturer''s hunch is that the less naturally creative can improve, and that naturally creative people still gain structure that turns creativity into something practical. The limit is that this is a hunch, not a finding: the lecture poses ''can we become more creative?'' as a question the semester will explore.'
    rubric:
      - id: r1
        criterion: Concept — accurate definitions of creativity and creative thinking.
        marks: 2
        top-band: Quotes Einstein's definition correctly and separates it from the slide's definition of creative thinking (think, imagine or invent something new).
        margin-note: Which line is the definition, and whose is it?
        authorities: []
      - id: r2
        criterion: Example — a real example from the materials.
        marks: 2
        top-band: Uses dropshipping (or Bezos and Musk) and says precisely what is creative about it.
        margin-note: What did everyone see, and what new thought was had?
        authorities:
          - mgmt2094-example-dropshipping
      - id: r3
        criterion: Application — answers the natural-or-learnt question with the materials.
        marks: 3
        top-band: Uses slide 10's concession, Robinson (2011) and the lecturer's hunch to reach a reasoned answer, noting that naturally creative people still gain from study.
        margin-note: Does the answer cover both groups of people?
        authorities: []
      - id: r4
        criterion: Evaluation — limits of the lecture’s answer.
        marks: 3
        top-band: Notes that the lecture offers a hunch and an open question rather than evidence, and says what would be needed to settle it.
        margin-note: Is this a finding or an opinion?
        authorities: []
  - key: q301
    type: mcq
    concept: methods-for-creativity
    difficulty: 1
    stem: Which list matches the six methods on the slide 'How can we become creative'?
    options:
      - text: Mind mapping, brainstorming, prototyping, testing, pitching and seeking investment
        why: Tempting because these sound like start-up practice, but prototyping, testing, pitching and investment are not on the Week 1 slide.
      - text: Mind mapping, brainstorming, sketching, free writing, thinking opposites and seeking inspiration
        correct: true
        why: Correct — slide 13 lists these six methods that can assist us in being creative, in this order.
      - text: Exploring problems, willpower, self-awareness, openness to failure, feedback and vision
        why: Tempting because these appear on slide 15, but they are the individual competencies for creativity, not methods for being creative.
      - text: Starting off, being proficient, becoming an expert, practice, feedback and inspiration
        why: Tempting because they come from slide 14, but those are the stages of the creativity gym, not the list of creativity methods.
  - key: q302
    type: mcq
    concept: methods-for-creativity
    difficulty: 1
    stem: What do the slides say would happen without creativity?
    options:
      - text: We would make faster progress, because fewer ideas would compete for attention.
        why: 'Tempting because fewer ideas can feel efficient, but slide 13 says the opposite: without creativity we would have no progress at all.'
      - text: Businesses would be more profitable, because they would avoid risky experiments.
        why: Tempting because experiments can lose money, but the slide links creativity to progress; avoiding it means repeating the same patterns.
      - text: 'No progress: we would be forever repeating the same experiences and patterns.'
        correct: true
        why: 'Correct — slide 13: ''Without creativity we would have no progress and would be forever repeating the same experiences/patterns.'''
      - text: Teams would work better together, because nobody would disagree about ideas.
        why: Tempting because disagreement can slow a team, but the slide is about progress, and the lecture wants teams to support and share ideas.
  - key: q303
    type: mcq
    concept: methods-for-creativity
    difficulty: 2
    stem: The lecture says something is 'even more important' than the individual creativity methods. What is it?
    options:
      - text: How to unleash creativity in a group or an organisation
        correct: true
        why: Correct — the lecture says even more important is how to unleash creativity in a group or organisation, as relying on a group is more effective.
      - text: How to keep your best ideas secret from your competitors
        why: Tempting because ideas have commercial value, but the lecture never raises secrecy; its emphasis is on sharing creativity across a group.
      - text: How to pick one best method and use it every single time
        why: Tempting because a single method sounds efficient, but the lecture presents the methods as an arsenal of tactics, not one tool to repeat.
      - text: How to measure creativity with a standardised test
        why: Tempting because measurement is common in management, but the lecture does not mention testing creativity; it stresses groups.
  - key: q304
    type: mcq
    concept: methods-for-creativity
    difficulty: 2
    stem: Why does the lecturer prefer to ask 'how can we become MORE creative?'
    options:
      - text: Because creativity has a fixed maximum that nobody can pass.
        why: Tempting because "more" implies a scale, but the lecture sets no ceiling; it simply starts from the creativity everyone already has.
      - text: Because we are all somewhat creative already.
        correct: true
        why: Correct — the lecturer rephrases the question because, as the lecture showed, we're all somewhat creative already.
      - text: Because the slides say creativity cannot be learnt from scratch.
        why: Tempting because 'more' suggests building on a base, but the slides never say this; Robinson says creativity can be learnt.
      - text: Because only experts may call themselves creative people.
        why: Tempting because the gym has an expert stage, but the lecture says everyone who can imagine something new is already a creative thinker.
  - key: q305
    type: mcq
    concept: methods-for-creativity
    difficulty: 2
    stem: Which of the six creativity methods is also Part 1 of the unit's Creative Project?
    options:
      - text: Sketching
        why: Tempting because Part 2 can be a poster or model, but Part 1, due in Week 4, is a mind map, not a sketch.
      - text: Brainstorming
        why: Tempting because ideas must be generated first, but the assessed Part 1 is a mind map uploaded to Turnitin, not a brainstorm.
      - text: Mind mapping
        correct: true
        why: Correct — Part 1 of the Creative Project is a mind map centring on a societal issue, uploaded to Turnitin in Week 4 (10%).
      - text: Free writing
        why: Tempting because the final assessment involves writing, but the Week 4 task is a mind map; the written task comes at the end of semester.
  - key: q306
    type: mcq
    concept: methods-for-creativity
    difficulty: 3
    stem: 'A team must cut packaging waste. One member asks: ''What if we made the packaging bigger, not smaller?'' to see what ideas appear. Which of the six methods is this closest to?'
    options:
      - text: Seeking inspiration
        why: Tempting because the question sparks ideas, but seeking inspiration means drawing on others; here the team flips its own goal on its head.
      - text: Thinking opposites
        correct: true
        why: Correct — deliberately asking the opposite of the obvious goal is thinking opposites, one of the six methods on slide 13.
      - text: Sketching
        why: Tempting because packaging is visual, but nobody is drawing; the move is to reverse the obvious goal.
      - text: Mind mapping
        why: Tempting because mind maps also generate ideas, but nothing is being mapped; the method is reversing the starting assumption.
  - key: q307
    type: mcq
    concept: methods-for-creativity
    difficulty: 2
    stem: According to the lecture, what can 'seeking inspiration' from creative people involve?
    options:
      - text: Copying a successful competitor’s product exactly, so as to avoid every risk
        why: Tempting because competitors can inspire, but copying is repeating someone else’s pattern; the lecture means learning from creative people.
      - text: Waiting for a sudden flash of insight instead of working on ideas deliberately
        why: Tempting because inspiration is often pictured as a flash, but the lecture describes deliberate learning, such as reading biographies.
      - text: Learning from business people, historical figures, artists or even generals
        correct: true
        why: Correct — the lecture says inspiration can come from business people, historical figures, politicians, artists and even generals, eg via biographies.
      - text: Asking only business leaders, because other fields cannot teach business
        why: Tempting because the unit is about business, but the lecturer says inspiration can come from all kinds of figures, not only business people.
  - key: q308
    type: mcq
    concept: methods-for-creativity
    difficulty: 2
    stem: In the reading, which relationship most shaped Bob Iger’s thinking?
    options:
      - text: His long rivalry with former CEO Michael Eisner
        why: Tempting because Eisner features heavily, but the reading says the relationship that most shaped Iger’s thinking was with Steve Jobs.
      - text: His six-year friendship with Steve Jobs
        correct: true
        why: 'Correct — the reading: ''if there is one particular relationship that has most shaped his thinking, it''s the six-year friendship'' with Jobs.'
      - text: His work alongside Sheryl Sandberg on the board
        why: Tempting because Sandberg is quoted praising Disney, but she is a board member; the reading singles out Iger’s friendship with Jobs.
      - text: His partnership with George Lucas at Lucasfilm
        why: Tempting because Disney bought Lucasfilm, but the reading does not describe a relationship with Lucas shaping Iger’s thinking.
  - key: q309
    type: mcq
    concept: methods-for-creativity
    difficulty: 3
    stem: Iger recalls that he and Steve Jobs would 'stand in front of a whiteboard and talk about ideas … We'd just muse on business.' Which Week 1 item does this best fit?
    options:
      - text: 'Seeking inspiration: learning from another creative person’s thinking.'
        correct: true
        why: Correct — Iger draws ideas from talking with Jobs, a creative leader; seeking inspiration from creative people is one of the six methods.
      - text: 'Being proficient: the second stage of the creativity gym, about skills.'
        why: Tempting because getting inspiration is part of being proficient, but the item described is the method of seeking inspiration from a person.
      - text: 'Pushing the frontiers: a team competency for groups that feel supported.'
        why: Tempting because two leaders are pushing ideas, but the scene is two people musing on business, a source of inspiration rather than a team.
      - text: 'Dropshipping: a creative method of doing business with no stock held.'
        why: Tempting because it is the slides’ business-method example, but the whiteboard talks are about ideas, not a supply arrangement.
  - key: q310
    type: mcq
    concept: methods-for-creativity
    difficulty: 2
    stem: Why does the lecture say it is better to rely on a group of people when trying to be creative?
    options:
      - text: Groups never disagree, so ideas are approved faster.
        why: Tempting because speed matters, but the lecture’s reason is effectiveness; it also expects teams to need psychological safety to share ideas.
      - text: It is much more effective than relying only on yourself.
        correct: true
        why: 'Correct — the lecture: you don''t want to rely only on yourself; it is much more effective if you rely on a group of people.'
      - text: The slides forbid individual creativity in organisations.
        why: Tempting because the emphasis is on groups, but individual competencies are listed too; individual creativity is not forbidden.
      - text: A group removes the need for any creativity methods.
        why: Tempting because a group brings many ideas, but the methods help groups too; the lecture wants creativity unleashed in a group.
  - key: q311
    type: mcq
    concept: methods-for-creativity
    difficulty: 4
    contrasts-with:
      - creativity-gym
    stem: Which statement correctly separates the six creativity methods from the creativity gym?
    options:
      - text: The methods are the gym’s stages, in order from beginner up to expert.
        why: Tempting because both are numbered lists, but the gym has three stages and the methods are six separate tools, not stages.
      - text: The methods are tools for being creative; the gym is stages of developing creative skill.
        correct: true
        why: 'Correct — slide 13 lists tools or tactics; slide 14 describes stages of building skill: starting off, being proficient, becoming an expert.'
      - text: The gym lists the tools, and the methods describe stages from starting off to expert.
        why: 'Tempting because the two slides sit side by side, but this swaps them: the methods are the tools; the gym is the stages.'
      - text: Both list the competencies an individual and a team need to become creative.
        why: Tempting because competencies are also on slide 15, but neither the methods nor the gym are the competency lists.
  - key: q312
    type: mcq
    concept: methods-for-creativity
    difficulty: 2
    variant-of: q302
    stem: According to the lecture, what does progress require?
    options:
      - text: Imagination
        correct: true
        why: Correct — the lecture says progress requires imagination; without creativity we just repeat the same patterns.
      - text: Strict repetition of proven patterns
        why: 'Tempting because proven patterns feel safe, but repeating them is exactly what the slide says happens without creativity: no progress.'
      - text: Avoiding any experiment that might fail
        why: Tempting because failure is costly, but the lecture asks us to be open to failure; avoiding experiments repeats the same patterns.
      - text: Technical knowledge on its own
        why: Tempting because technology drives change, but the lecture says technical knowledge is not enough; progress needs imagination.
  - key: q313
    type: mcq
    concept: methods-for-creativity
    difficulty: 3
    contrasts-with:
      - creativity-gym
      - creative-competencies
    stem: A student lists 'mind mapping, willpower and becoming an expert' as three creativity methods from Week 1. What is wrong?
    options:
      - text: 'Nothing: all three appear on the slide listing methods for being creative.'
        why: Tempting because all three are from Week 1, but only mind mapping is on the methods slide; the others are on different slides.
      - text: Only mind mapping is a method; willpower is a competency and becoming an expert a gym stage.
        correct: true
        why: Correct — mind mapping is on slide 13; building up willpower is an individual competency (slide 15); becoming an expert is a gym stage (slide 14).
      - text: Only becoming an expert is a method; mind mapping and willpower are both individual competencies.
        why: Tempting because the lists blur together, but becoming an expert is the third gym stage, and mind mapping is the first creativity method.
      - text: Only willpower is a method; the other two are stages of the creativity gym.
        why: Tempting because willpower sounds like training, but it is an individual competency; mind mapping is a method and expert is a gym stage.
  - key: q314
    type: mcq
    concept: methods-for-creativity
    difficulty: 1
    stem: How many methods for being creative does the Week 1 slide list?
    options:
      - text: Three
        why: Tempting because the creativity gym has three stages, but the methods slide lists six methods, from mind mapping to seeking inspiration.
      - text: Four
        why: Tempting because the competencies slide has four in each column, but the methods slide lists six methods for being creative.
      - text: Six
        correct: true
        why: 'Correct — slide 13 lists six: mind mapping, brainstorming, sketching, free writing, thinking opposites and seeking inspiration.'
      - text: Eight
        why: Tempting because there are eight societal-issue areas and eight competencies in all, but the methods slide lists six.
  - key: q315
    type: mcq
    concept: methods-for-creativity
    difficulty: 3
    stem: Your tutorial group must choose a societal issue for its project and is stuck. Which plan best follows the Week 1 lecture?
    options:
      - text: Let the most naturally creative member decide alone, since creativity is innate.
        why: Tempting because some people are more naturally creative, but the lecture says relying on a group is more effective and creativity can be learnt.
      - text: Pick the first issue anyone suggests, since repeating known patterns saves time.
        why: Tempting because the group is stuck, but repeating patterns is what happens without creativity; the lecture wants the methods used.
      - text: Use the methods together, eg brainstorm as a group and mind map the ideas.
        correct: true
        why: Correct — the methods are an arsenal of tools, and the lecture says unleashing creativity in a group is more effective than working alone.
      - text: Wait for inspiration to arrive, since forcing creativity with methods fails.
        why: Tempting because inspiration can feel spontaneous, but the slides present methods to assist creativity, including seeking inspiration actively.
  - key: q316
    type: truefalse
    concept: methods-for-creativity
    difficulty: 1
    set: quickfire
    statement: Free writing is one of the six methods the slides list for becoming creative.
    answer: true
    why: True — slide 13 lists mind mapping, brainstorming, sketching, free writing, thinking opposites and seeking inspiration.
  - key: q317
    type: truefalse
    concept: methods-for-creativity
    difficulty: 1
    set: quickfire
    statement: The slides list 'building up willpower' as one of the methods for becoming creative.
    answer: false
    why: False — building up willpower is an individual competency on slide 15; the methods on slide 13 are mind mapping to seeking inspiration.
  - key: q318
    type: truefalse
    concept: methods-for-creativity
    difficulty: 2
    set: quickfire
    statement: The lecture says unleashing creativity in a group or organisation is even more important than the individual tactics.
    answer: true
    why: True — after listing the methods, the lecture says even more important is how to unleash creativity in a group or organisation.
  - key: q319
    type: truefalse
    concept: methods-for-creativity
    difficulty: 2
    statement: The lecturer advises relying on yourself rather than a group, because groups dilute creative ideas.
    answer: false
    why: 'False — the lecture says you don''t want to rely only on yourself: it is much more effective to rely on a group of people.'
  - key: q320
    type: match
    concept: methods-for-creativity
    difficulty: 3
    contrasts-with:
      - creativity-gym
      - creative-competencies
    prompt: Match each item to the Week 1 list it belongs to.
    pairs:
      - left: Thinking opposites
        right: Methods for becoming creative (slide 13)
      - left: Being proficient
        right: Stages of the creativity gym (slide 14)
      - left: Self-awareness
        right: Individual competencies (slide 15)
      - left: Practising psychological safety
        right: Team/group competencies (slide 15)
  - key: q401
    type: mcq
    concept: creativity-gym
    difficulty: 1
    set: pretest
    stem: What are the three stages of the 'creativity gym' on the Week 1 slides, in order?
    options:
      - text: Starting off, being proficient, becoming an expert
        correct: true
        why: 'Correct — slide 14: starting off (learning and developing the skills), being proficient, then becoming an expert.'
      - text: Thinking up, testing, then doing
        why: Tempting because Levitt contrasts thinking up with doing, but that is the creativity–innovation distinction, not the gym's stages.
      - text: Vision, imagination, creativity
        why: Tempting because these are steps on slide 16, but that is the path for the semester, which continues to innovation; it is not the gym.
      - text: Exploring problems, willpower, self-awareness
        why: Tempting because they are also numbered skills, but these are individual competencies from slide 15, not stages of the creativity gym.
  - key: q402
    type: mcq
    concept: creativity-gym
    difficulty: 1
    stem: According to the slides, what happens at the 'starting off' stage?
    options:
      - text: Receiving feedback on your creative thoughts and actions
        why: Tempting because feedback helps beginners, but on slide 14 receiving feedback belongs to the final stage, becoming an expert.
      - text: Learning and developing the skills
        correct: true
        why: 'Correct — slide 14: ''1. Starting off – learning and developing the skills''.'
      - text: Training your mind and getting inspiration
        why: Tempting because it sounds like early training, but slide 14 puts this at stage 2, being proficient.
      - text: Going into default creative mode automatically
        why: Tempting because it describes creativity in action, but automatic default creative mode is the goal of the expert stage.
  - key: q403
    type: mcq
    concept: creativity-gym
    difficulty: 2
    stem: What does the 'being proficient' stage involve?
    options:
      - text: Learning the basic skills of your industry
