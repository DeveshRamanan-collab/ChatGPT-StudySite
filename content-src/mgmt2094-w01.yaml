    concept: innovation-at-disney
    difficulty: 2
    stem: According to the reading, what do MagicBands let guests do?
    options:
      - text: Enter the park, open their hotel rooms and pay for food and merchandise
        correct: true
        why: Correct — guests tap the RFID wristband to enter the park, enter their hotel room and pay at stores and kiosks.
      - text: Track lost children anywhere in the park in real time
        why: Tempting because many people assume this, but the reading says the bracelets aren't currently used to track lost children.
      - text: Store each guest's full personal and credit card details on the wristband itself
        why: Tempting because the bands link to accounts, but Disney’s executives say no personal information is stored on the device.
      - text: Watch ABC shows on the wristband while they wait in queues
        why: Tempting because Disney owns ABC, but MagicBands are RFID wristbands for entry and payment, with no screen.
  - key: q709
    type: mcq
    concept: innovation-at-disney
    difficulty: 3
    stem: Why does the reading call the MagicBands initiative 'a gradual, more iterative process', unlike putting up a new ride?
    options:
      - text: Guests were asked to help design the wristbands themselves over several years of trials.
        why: Tempting because guests do choose colours, but the reading’s reason is the infrastructure Disney had to change across the resort.
      - text: The wristbands were released one colour at a time to test demand.
        why: Tempting because the reading mentions colours, including purple not yet available, but that is not why it calls the process iterative.
      - text: Disney had to wait for Apple to release its smartwatch first.
        why: Tempting because an Apple Watch appears in the reading, but MagicBands came first; the delay was not about Apple.
      - text: More than 28,000 door locks had to be changed and hundreds of access points configured.
        correct: true
        why: 'Correct — the reading: more than 28,000 door locks across the resorts had to be changed and hundreds of access points configured.'
  - key: q710
    type: mcq
    concept: innovation-at-disney
    difficulty: 2
    stem: Which quotation from the reading sums up the balance between creativity and technology at Disney?
    options:
      - text: '''We''re trying to anticipate the future so that when the technology is there, we''re ready.'''
        why: Tempting because it is about being ready for technology, but Vince Roberts is describing the CTO council's forward planning, not the balance.
      - text: '''Art challenges technology, and technology inspires art.'''
        correct: true
        why: Correct — John Lasseter’s line, quoted at the end of the reading, describes the two synergistic forces Iger balances.
      - text: '''Disney has always been about building technologies, not just applying technologies.'''
        why: Tempting because it is about Disney and technology, but Jack Dorsey contrasts building with applying technology, not art with technology.
      - text: '''We were too big and trying to do too many things.'''
        why: Tempting because it is a candid quote from the reading, but Jimmy Pitaro is explaining the interactive division's losses.
  - key: q711
    type: mcq
    concept: innovation-at-disney
    difficulty: 3
    stem: Disney's brands are encouraged to 'beg, borrow, and steal' technologies from each other. Which example does the reading give?
    options:
      - text: ILM advising Pixar on how to animate lifelike tusks
        correct: true
        why: 'Correct — the reading: ILM, for example, is advising Pixar on how to animate lifelike tusks for a project in production.'
      - text: ESPN lending its cameras to Imagineering’s Dish
        why: Tempting because drones over football games are mentioned, but the reading’s borrowing example is ILM and Pixar.
      - text: Marvel designing the shapes of the MagicBands
        why: Tempting because Marvel is a Disney brand, but the reading gives no such link; its example is ILM advising Pixar.
      - text: Pixar writing algorithms for the iTunes deal
        why: Tempting because the reading mentions algorithms (for Frozen's snow), but they have nothing to do with iTunes; the borrowing example is ILM and Pixar.
  - key: q712
    type: mcq
    concept: innovation-at-disney
    difficulty: 3
    stem: According to ILM's president, Lynwen Brennan, what is the true upside of bringing Pixar, Marvel and Lucasfilm together?
    options:
      - text: A larger profit and loss statement, as more films are released each year
        why: Tempting because the brands are cash cows, but Brennan says the true upside isn't something that translates simply to a P&L.
      - text: A culture where 'synergy' actually means something
        correct: true
        why: 'Correct — Brennan: the more substantive change is to corporate culture; ''Synergy'' actually means something, and new ways of thinking are supported.'
      - text: Fewer staff, because the studios now share a single set of technical people
        why: Tempting because mergers often cut staff, but the reading says Disney gained several hundred technical minds with Lucasfilm.
      - text: Less risk, because each studio no longer needs to experiment on its own
        why: Tempting because sharing spreads risk, but the reading praises support for pushing new avenues, which means more experimenting.
  - key: q713
    type: mcq
    concept: innovation-at-disney
    difficulty: 3
    stem: The reading says Disney's interactive division was a 'fast follower' rather than a leader. Which missed opportunity does it give?
    options:
      - text: Buying Minecraft’s owner, Mojang
        correct: true
        why: 'Correct — the reading: buying Mojang could have been a bold step, but it was too late; Microsoft bought it for $2.5 billion.'
      - text: Buying Pixar before Apple had the chance to
        why: Tempting because Pixar was a huge deal, but Disney did buy Pixar in 2006; Apple was never a rival bidder in the reading.
      - text: Launching Apple Pay in Disney stores first
        why: Tempting because it is a tech first, but Disney stores did adopt Apple Pay; it was not missed.
      - text: Building Shanghai’s Enchanted Storybook castle
        why: Tempting because it is a big project, but the castle was under construction, not missed, and it is a parks project.
  - key: q714
    type: mcq
    concept: innovation-at-disney
    difficulty: 4
    contrasts-with:
      - creativity-and-innovation
      - creative-competencies
    stem: Which analysis best links the reading to Week 1’s ideas?
    options:
      - text: It shows that only technology matters, so creativity is irrelevant in a media company.
        why: Tempting because the reading is titled 'Empire of Tech', but it stresses balancing content and technology, art and technology.
      - text: It shows that innovation comes before creativity, reversing the order of Levitt’s line.
        why: Tempting because Disney’s innovations are highlighted, but the Dish shows ideas tested before they are done; creativity still comes first.
      - text: It shows that one corporate CTO is the best way to encourage risk-taking across a firm.
        why: Tempting because Iger acts as CTO himself, but he deliberately gave each business its own CTO to let them experiment.
      - text: Early bets show the flip; the Dish, creativity; MagicBands, innovation.
        correct: true
        why: Correct — the 2005 iTunes bet shows the flip, Imagineering's Dish shows Levitt's creativity (not yet done) and MagicBands his innovation (done).
  - key: q715
    type: mcq
    concept: innovation-at-disney
    difficulty: 2
    stem: According to Sheryl Sandberg in the reading, what makes Disney unusual?
    options:
      - text: It is one of a few companies that focus on content and technology equally.
        correct: true
        why: 'Correct — Sandberg: there are many content companies and many technology companies, but Disney is one of a few that do both equally.'
      - text: It is the only media company with no Silicon Valley people on its board.
        why: 'Tempting because boards differ, but the reading says the opposite: Sandberg and Jack Dorsey sit on Disney’s board.'
      - text: It makes most of its money from theme parks rather than media.
        why: Tempting because the parks are famous, but the reading says the media networks division is the biggest and most profitable business.
      - text: It has never lost money on any technology investment it has made.
        why: Tempting because Iger’s bets are praised, but the interactive division lost more than $1 billion.
  - key: q716
    type: truefalse
    concept: innovation-at-disney
    difficulty: 1
    set: quickfire
    statement: The reading says Iger made a deliberate decision not to have a single corporate chief technology officer.
    answer: true
    why: 'True — the reading: he made ''a deliberate decision not to have a chief technology officer''; instead each business has its own CTO.'
  - key: q717
    type: truefalse
    concept: innovation-at-disney
    difficulty: 1
    set: quickfire
    statement: According to the reading, every one of Iger's technology bets paid off.
    answer: false
    why: 'False — ''Not all of Iger''s bets have reaped rewards'': the gaming division took five years to get out of the red, losing over $1 billion.'
  - key: q718
    type: truefalse
    concept: innovation-at-disney
    difficulty: 2
    statement: In the reading, Tim Cook says Iger 'has the courage to lose sight of the shore'.
    answer: true
    why: True — Apple's CEO Tim Cook says Iger has the courage to lose sight of the shore, and understands Disney's tradition but isn't wedded to it.
  - key: q719
    type: match
    concept: innovation-at-disney
    difficulty: 2
    prompt: Match each of Iger's moves to its year and detail in the reading.
    pairs:
      - left: ABC shows on iTunes
        right: 2005 — the first deal of its kind
      - left: Pixar
        right: 2006 — bought for $7.4 billion
      - left: Marvel
        right: 2009 — bought for $4.3 billion
      - left: Lucasfilm
        right: 2012 — bought for $4 billion, with ILM
  - key: q720
    type: short
    concept: innovation-at-disney
    difficulty: 4
    prompt: '''Great innovators are leaders who are willing to bet early and accept failure.'' Respond to this statement in a short essay, using the reading ''Empire of Tech'' and at least two Week 1 ideas, and evaluate the statement.'
    model: 'The reading largely supports the statement, with a qualification. Lev-Ram argues that Iger, Disney''s CEO since 2005, also acted as its CTO, and that media CEOs need to think like CTOs. Early bets show the flip mindset: in 2005 he put ABC''s Lost and Desperate Housewives on iTunes, a first-of-its-kind deal seemingly at odds with Disney''s business model. On Levitt''s terms, Disney''s creativity lives in places like Imagineering''s Dish, still too expensive for the parks, while its innovation is what gets done, such as MagicBands rolled out across Disney World. Iger''s structure supports the team competencies: power moved to the business units, each with its own CTO, giving them ''the ability to experiment and try even if they fail'', and a CTO council shares ideas through hackathons. Accepting failure had real costs: the interactive division spent five years in the red, losing more than $1 billion, and missed Mojang. The qualification is that the reading credits more than the leader''s nerve: Iger''s lesson is to get in early and learn from losses, and the culture and structure around him made that possible.'
    rubric:
      - id: r1
        criterion: Concept — the reading’s argument and the Week 1 ideas used.
        marks: 2
        top-band: States the reading's lesson (CEOs thinking like CTOs) and defines the Week 1 ideas used, such as the flip and Levitt's distinction.
        margin-note: Which Week 1 ideas are you applying?
        authorities:
          - mgmt2094-lev-ram-2015-empire-of-tech
      - id: r2
        criterion: Example — precise detail from the reading.
        marks: 2
        top-band: 'Uses specific, accurate examples: the 2005 iTunes deal, the Dish versus MagicBands, the CTO-per-business structure.'
        margin-note: Is each detail from the reading?
        authorities:
          - mgmt2094-example-disney-itunes-deal
          - mgmt2094-example-disney-magicbands
      - id: r3
        criterion: Application — maps the examples onto the ideas.
        marks: 3
        top-band: Shows how each example illustrates an idea (flip, creativity versus innovation, team competencies) rather than just retelling the story.
        margin-note: What does this example show about the idea?
        authorities:
          - mgmt2094-example-disney-cto-council
      - id: r4
        criterion: Evaluation — a reasoned verdict on the statement.
        marks: 3
        top-band: Weighs the costs of early bets (interactive division losses, missed Mojang) and whether success came from the leader or the structure around him.
        margin-note: Leader, or the system around the leader?
        authorities:
          - mgmt2094-example-disney-interactive-division

