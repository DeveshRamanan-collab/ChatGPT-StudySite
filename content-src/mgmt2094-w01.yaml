  - slug: mgmt2094-example-disney-magicbands
    title: 'Example: Disney MagicBands'
    kind: other
    text: 'MagicBands are RFID-enabled wristbands that let Walt Disney World guests enter the park, open their hotel rooms and pay for food and merchandise. Introduced in 2013 (a $1 billion bet), more than 9 million had been given out by early 2015, and guests who use them spend more on average. Unlike putting up a new ride, the initiative was a gradual, more iterative process: more than 28,000 door locks had to be changed and hundreds of access points configured. While many corporations were still waiting to see what the ''killer app'' for wearables was, Disney invented one.'
    gloss: 'Illustrates innovation as doing new things: an idea actually implemented at scale and bringing value.'
