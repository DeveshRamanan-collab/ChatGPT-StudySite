  - key: q420
    type: short
    concept: creativity-gym
    difficulty: 3
    prompt: '''Creative skill is built in stages, like fitness at a gym.'' Respond to this statement in a short essay: explain the creativity gym, apply it to a new employee joining an innovation team and to a real example from the materials, and evaluate the model.'
    model: 'The statement fairly summarises the Week 1 slides, which compare developing creative skills to working out at a gym, in three stages. Starting off means learning and developing the skills: the lecturer''s base-level example is that someone creating a business must know and understand the industry and develop the skills to run a business. Being proficient means training your mind and getting inspiration, with a systematic approach to training minds and teams, since every person and organisation is slightly different. Becoming an expert means practising creative thoughts until your mind goes automatically into default creative mode, and then receiving feedback on those thoughts and actions; creativity becomes part of who you are as a professional. A new employee would first learn the industry, then build habits for finding inspiration, then practise and seek feedback. Disney''s Imagineers illustrate the last stage: each year they formally present their wildest, and ideally economically viable, innovations to the CEO. The model''s strength is that it treats creativity as trainable; its limit is that it names stages without saying how long each takes or how to tell when you have moved up.'
    rubric:
      - id: r1
        criterion: Concept — the three stages, accurately and in order.
        marks: 2
        top-band: Names starting off, being proficient and becoming an expert with the slide's description of each, including feedback at the final stage.
        margin-note: Where does feedback belong?
        authorities: []
      - id: r2
        criterion: Example — a real example from the materials.
        marks: 2
        top-band: Uses Imagineering's yearly presentations to the CEO (Lev-Ram 2015), or the lecturer's base-level industry example, and ties it to a stage.
        margin-note: Which stage does the example show?
        authorities:
          - mgmt2094-example-disney-imagineering
      - id: r3
        criterion: Application — a staged plan for the employee.
        marks: 3
        top-band: Turns each stage into concrete steps for the employee, including the systematic approach to training minds and teams.
        margin-note: What would the employee actually do at each stage?
        authorities: []
      - id: r4
        criterion: Evaluation — strengths and limits of the model.
        marks: 3
        top-band: Credits the model for treating creativity as trainable and notes a real limit, such as no timescale or test for moving between stages.
        margin-note: How would you know someone had moved up a stage?
        authorities: []
