  - key: q620
    type: short
    concept: creativity-and-innovation
    difficulty: 3
    prompt: '''Creativity is thinking up new things. Innovation is doing new things'' (Theodore Levitt). Respond to this statement in a short essay: explain the distinction, apply it to two examples from the Week 1 materials, and evaluate whether the line between the two is always clear.'
    model: 'Levitt''s line, quoted on the slides, is a useful but simplified map. Creativity is thinking up new things; innovation is doing new things. The unit is built on it: Weeks 1–7 are for thinking up, Weeks 8–13 for doing, along a path from vision and imagination to creativity and innovation. The lecture stresses that the two are different but support each other: creative thinking is the raw material, and the question is whether we can leverage it into something practical that brings value. Disney''s Dish shows creativity: a virtual reality chamber for testing future rides whose technology is still too expensive and cumbersome for the parks. MagicBands show innovation: RFID wristbands actually rolled out at Disney World, with more than 9 million given out and guests spending more. The line is not always sharp. MagicBands were a gradual, iterative process, with more than 28,000 door locks changed, so thinking and doing overlapped over time; and a tested prototype like the Dish is already partly done. Levitt''s distinction works best as a question to ask at each stage: has anything new actually been done?'
    rubric:
      - id: r1
        criterion: Concept — Levitt's distinction, accurately.
        marks: 2
        top-band: States Levitt's line exactly and connects it to the slides' semester split and the vision → imagination → creativity → innovation path.
        margin-note: Thinking up, or doing?
        authorities: []
      - id: r2
        criterion: Example — two real examples from the materials.
        marks: 2
        top-band: Uses the Dish and MagicBands (Lev-Ram 2015), or dropshipping, with the detail that places each on one side of the line.
        margin-note: What detail shows it was (not) done?
        authorities:
          - mgmt2094-example-disney-imagineering
          - mgmt2094-example-disney-magicbands
      - id: r3
        criterion: Application — classifies each example with reasons.
        marks: 3
        top-band: Applies the thinking/doing test to each example and explains the lecture's point that the two support each other.
        margin-note: Why is the Dish not yet innovation?
        authorities:
          - mgmt2094-example-dropshipping
      - id: r4
        criterion: Evaluation — is the line always clear?
        marks: 3
        top-band: Takes a position and uses the evidence (iterative roll-out, tested prototypes) to show where thinking and doing overlap.
        margin-note: When exactly did MagicBands become innovation?
        authorities: []
