    source: Week 01 Lecture Slides, slide 14
  - type: cloze
    concept: creativity-gym
    text: 'Becoming an expert: practising your creative thoughts and training your mind to automatically go into {{c1::default creative mode}}, and then {{c2::receiving feedback}} on those thoughts/actions.'
    source: Week 01 Lecture Slides, slide 14
  - type: basic
    concept: creativity-gym
    front: What is the lecturer's example of the base level (starting off)?
    back: To create a business, first know and understand the industry you are entering and develop the skills required to run a business.
