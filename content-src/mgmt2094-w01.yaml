        why: Tempting because the second half of semester is about doing, but the lecture wants creativity leveraged, not stopped.
      - text: Can we take this creative thinking, leverage it and make innovation with it?
        correct: true
        why: 'Correct — the lecture: ''The question then becomes … can we take this creative thinking, leverage it, and make innovation with this.'''
      - text: Can we prove that creativity is innate rather than something that can be learnt?
        why: Tempting because natural creativity is discussed, but once we all have the ability, the question moves to turning it into innovation.
      - text: Can we find one method that works for everyone?
        why: Tempting because methods are listed, but the lecture calls them an arsenal; the key question is about leveraging creativity into innovation.
