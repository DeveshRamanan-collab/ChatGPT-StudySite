cards:
  - type: basic
    concept: ruling-theory-and-three-tenets
    front: The two parts of Dworkin's "ruling theory of law" (from Bentham)?
    back: >-
      A theory about what law is (legal positivism) and a theory about what law ought to be (utilitarianism). Dworkin
      criticises both + the assumption that they are independent.
    source: Week 05 Lecture Slides, slide 3
  - type: cloze
    concept: ruling-theory-and-three-tenets
    text: For Dworkin, a general theory of law must be {{c1::normative}} as well as {{c2::conceptual}}.
    source: Week 05 Lecture Slides, slide 3
  - type: basic
    concept: ruling-theory-and-three-tenets
    front: Dworkin's definition of legal positivism (TRS xii)?
    back: >-
      "…the theory that individuals have legal rights only insofar as these have been created by explicit political
      decisions or explicit social practice."
    source: Week 05 Lecture Slides, slide 4
  - type: basic
    concept: ruling-theory-and-three-tenets
    front: Dworkin's three key tenets of legal positivism (The Model of Rules I)?
    back: >-
      1 Legal rules can be identified in light of their pedigree. 2 There are cases in which judges must exercise
      discretion. 3 Legal obligation if and only if the case falls under a valid legal rule.
    source: Week 05 Lecture Slides, slide 5
  - type: basic
    concept: ruling-theory-and-three-tenets
    front: Dworkin vs Finnis on the is/ought separation?
    back: >-
      Both reject it, with different arguments. Finnis: ask the why question first. Dworkin: the two questions are
      interconnected — we need the point of a practice to understand it.
    source: Week 05 Lecture Transcript
  - type: basic
    concept: rules-principles-and-policies
    front: Principle vs policy (TRS 22)?
    back: >-
      Principle: observed because it is a requirement of justice or fairness or some other dimension of morality.
      Policy: sets out a goal to be reached, generally an improvement in some economic, political or social feature of
      the community.
    source: Week 05 Lecture Slides, slide 7
  - type: cloze
    concept: rules-principles-and-policies
    text: >-
      Dworkin's example: "the standard that {{c1::automobile accidents are to be decreased}} is a policy, and the
      standard that {{c2::no man may profit by his own wrong}} a principle."
    source: Week 05 Lecture Slides, slide 7
  - type: cloze
    concept: rules-principles-and-policies
    text: >-
      A rule is applicable in an {{c1::all-or-nothing}} fashion, whereas a principle states {{c2::a reason that argues
      in one direction}}.
    source: Week 05 Lecture Slides, slide 8
  - type: basic
    concept: rules-principles-and-policies
    front: What dimension do principles have that rules lack, and where does it show?
    back: >-
      Weight/importance. It shows when standards conflict: two conflicting rules — one must give way; conflicting
      principles — weigh them, and the outweighed one remains law.
    source: Week 05 Lecture Slides, slide 8
  - type: apply
    concept: rules-principles-and-policies
    scenario: >-
      A standard reads: "No person shall take advantage of their own wrong." A student classifies it as a rule because
      it is stated in one sentence.
    answer: >-
      Form does not settle it. Look at how judges reason with it: in Riggs it was weighed against the will statutes as a
      requirement of justice, so it is a principle.
    source: Week 05 Lecture Slides, slide 8
  - type: basic
    concept: rules-principles-and-policies
    front: Why can't Hart just add principles to the rule of recognition?
    back: Because we cannot formulate a test of pedigree to capture principles (Dworkin, TRS).
    source: Week 05 Lecture Slides, slide 15
  - type: cloze
    concept: discretion-riggs-and-obligation
    text: >-
      "Discretion, like the {{c1::hole in a doughnut}}, does not exist except as an area left open by a
      {{c2::surrounding belt of restriction}}." (TRS 31)
    source: Week 05 Lecture Slides, slide 9
  - type: basic
    concept: discretion-riggs-and-obligation
    front: Dworkin's two weak senses of discretion?
    back: >-
      1 The standards cannot be applied mechanically but demand the use of judgment. 2 Some official has final authority
      to make a decision and cannot be reviewed and reversed.
    source: Week 05 Lecture Slides, slide 9
  - type: basic
    concept: discretion-riggs-and-obligation
    front: Strong discretion (TRS 32)?
    back: On some issue the official "is simply not bound by standards set by the authority in question".
    source: Week 05 Lecture Slides, slide 10
  - type: basic
    concept: discretion-riggs-and-obligation
    front: Riggs v Palmer — facts in one line?
    back: >-
      Elmer Palmer, 16, poisoned his grandfather to stop him revoking a will leaving Elmer the residue; the will was
      valid and admitted to probate. Can he have the property?
    source: Week 05 Lecture Slides, slide 11
  - type: basic
    concept: discretion-riggs-and-obligation
    front: Riggs — the majority's two moves?
    back: >-
      1 Canon of construction: a thing within the letter is not within the statute unless within the makers' intention.
      2 Fundamental maxims of the common law control all laws: no one shall profit by his own wrong (principles of
      natural law and justice).
    source: Week 05 Lecture Slides, slide 12
  - type: basic
    concept: discretion-riggs-and-obligation
    front: Riggs — the minority's reasons?
    back: >-
      Bound by the rigid rules established by the legislature; no support for avoiding the succession when the laws are
      silent (cf Owens v Owens); refusing him would impose an additional punishment.
    source: Week 05 Lecture Slides, slide 13
  - type: cloze
    concept: discretion-riggs-and-obligation
    text: >-
      Positivists: in a hard case "there is no legal obligation until the judge {{c1::creates a new rule for the
      future}}". Dworkin: an obligation might be imposed by {{c2::a constellation of principles}}. (TRS 44)
    source: Week 05 Lecture Slides, slide 16
  - type: apply
    concept: discretion-riggs-and-obligation
    scenario: >-
      A judge says: "No statute covers this; I will decide as I think best, bound by nothing." Another says: "The
      statute is silent, but the principles of our law point one way."
    answer: >-
      The first claims strong discretion (not bound by standards). The second uses at most weak discretion: bound by
      legal principles, applied with judgment — Dworkin's reading of Riggs.
    source: Week 05 Lecture Slides, slide 10
  - type: basic
    concept: discretion-riggs-and-obligation
    front: 'Model of Rules II: what does Dworkin oppose (TRS 76)?'
    back: '"…the idea that ''the law'' is a fixed set of standards of any sort" — not merely a set of rules plus principles.'
    source: Week 05 Lecture Slides, slide 17
  - type: basic
    concept: inclusive-and-exclusive-positivism
    front: Inclusive (soft) vs exclusive (hard) legal positivism?
    back: >-
      Inclusive (eg Hart): particular legal systems may make moral criteria necessary or sufficient for legal validity
      (in that system only). Exclusive (eg Raz): moral criteria can be neither sufficient nor necessary conditions for
      legal validity.
    source: Week 05 Lecture Slides, slide 19
  - type: cloze
    concept: inclusive-and-exclusive-positivism
    text: >-
      Hart (CL 269): the existence and content of the law can be identified by reference to the {{c1::social sources}}
      of law without reference to morality except where the law has itself {{c2::incorporated moral criteria}}.
    source: Week 05 Lecture Slides, slide 18
  - type: basic
    concept: inclusive-and-exclusive-positivism
    front: The six sections of Hart's Postscript?
    back: >-
      1 The nature of legal theory; 2 The nature of legal positivism; 3 The nature of rules; 4 Principles and the rule
      of recognition; 5 Law and morality; 6 Judicial discretion.
    source: Week 05 Lecture Slides, slide 18
  - type: apply
    concept: inclusive-and-exclusive-positivism
    scenario: >-
      A constitution protects equality. Parliament, following correct procedure, passes a discriminatory law, which the
      High Court strikes down.
    answer: >-
      Formally valid but substantively invalid. Inclusive positivist: the sources incorporated a moral criterion — a
      contingent connection. Exclusive positivist: once incorporated, the criterion is legal, not moral.
    source: Week 05 Lecture Transcript
  - type: basic
    concept: theoretical-disagreement
    front: LE 3 — three kinds of issues, and the disagreement each produces?
    back: >-
      Fact (What happened?) — empirical. Law (What is the pertinent law?) — theoretical. Political morality and fidelity
      (Is it unjust?) — moral.
    source: Week 05 Lecture Slides, slide 20
  - type: basic
    concept: theoretical-disagreement
    front: The two reasons for reading the Riggs statute in light of principles of justice?
    back: >-
      1 Legislators have a general and diffuse intention to respect traditional principles of justice (unless they
      indicate the contrary). 2 The statute is part of a larger system and should be read to make it coherent in
      principle.
    source: Week 05 Lecture Slides, slide 21
  - type: basic
    concept: theoretical-disagreement
    front: Why is theoretical disagreement a problem for Hart (lecture)?
    back: >-
      The rule of recognition exists because officials agree on it. How can judges agree on the criteria of validity yet
      disagree on the content of the law? If Hart is right, there should be no theoretical disagreements.
    source: Week 05 Lecture Transcript
  - type: cloze
    concept: theoretical-disagreement
    text: >-
      Law's Empire "takes up the {{c1::internal, participants'}} point of view" and studies formal legal argument from
      {{c2::the judge's viewpoint}} (LE 14).
    source: Week 05 Lecture Slides, slide 22
  - type: basic
    concept: law-as-integrity
    front: Constructive interpretation — three stages (courtesy)?
    back: >-
      Pre-interpretive: identify the examples (letting people go first, removing a hat). Interpretive: ask the point of
      the practice. Post-interpretive: revisit the examples in light of that point.
    source: Week 05 Lecture Slides, slide 23
  - type: basic
    concept: law-as-integrity
    front: For Dworkin, what is the point of the legal system?
    back: >-
      To justify the exercise of state coercion (a liberal theory). Hart's conditions for a legal system say nothing
      about its point: they concern structure.
    source: Week 05 Lecture Transcript
  - type: cloze
    concept: law-as-integrity
    text: >-
      Law as integrity: integrity → {{c1::consistency in principle}}; Judge Hercules tests interpretations on the
      dimensions of {{c2::fit}} and {{c3::justification}} (LE 255).
    source: Week 05 Lecture Slides, slide 24
  - type: basic
    concept: law-as-integrity
    front: Finnis on Dworkin (1987)?
    back: >-
      'On reason and authority in Law's Empire' (1987) 6 Law and Philosophy 357: agrees with some criticisms of
      positivism, but rejects the one-right-answer thesis — fit and justification are incommensurable.
    source: Week 05 Lecture Slides, slide 24
  - type: apply
    concept: law-as-integrity
    scenario: An essay claims law as integrity explains every legal system, including apartheid South Africa.
    answer: >-
      Challenge it: what principles give unity to a racist regime? The objection asks whether integrity is general or
      only particular jurisprudence — perhaps a theory for the United States.
    source: Week 05 Lecture Transcript
audio:
  title: Week 5 recap — Dworkin's interpretive theory of law
  minutes: 3
  script: >-
    This week is Dworkin against Hart. In Taking Rights Seriously Dworkin attacks what he calls the ruling theory of
    law, which comes from Bentham and has two parts: positivism, a theory of what law is, and utilitarianism, a theory
    of what law ought to be. He rejects both parts, and the assumption that they are independent. For Dworkin a general
    theory of law must be normative as well as conceptual.


    He gives positivism three tenets. Rules are identified by their pedigree, which is Hart's rule of recognition.
    Judges must sometimes exercise discretion. And there is a legal obligation only if a valid rule applies. His attack
    starts from how lawyers and judges actually argue. They use rules, but also principles and policies. A policy sets a
    goal, like reducing car accidents. A principle is a requirement of justice or fairness, like no one may profit from
    their own wrong. Rules apply all or nothing; principles have weight, so when they conflict we balance them. And
    principles cannot be identified by pedigree.


    On discretion, think of the doughnut: discretion is the hole left by a belt of standards. Weak discretion means
    judgment, or final authority. Strong discretion means not being bound by standards at all. Riggs v Palmer is the key
    case. Elmer poisoned his grandfather to inherit under a valid will. The majority said laws are controlled by maxims
    of the common law, so he could not profit from his crime. For Dworkin those principles were law, so the judges were
    bound, and legal obligations can come from a constellation of principles, not only from rules.


    Hart's Postscript replies. Law is identified by social sources, unless the law itself incorporates moral criteria.
    That is inclusive positivism. Raz's exclusive positivism says morality is never a condition of validity.


    In Law's Empire the new argument is theoretical disagreement. Judges disagree about what the law is even when the
    statute is clear. If the rule of recognition rests on officials' agreement, how can they disagree about content?


    Dworkin's own answer is constructive interpretation: examples, the point of the practice, then revision, as with
    courtesy. For him law's point is to justify state coercion. Law as integrity means consistency in principle, tested
    by Judge Hercules on fit and justification, with one right answer even in hard cases. We should ask whether that is
    a general theory, or one that fits the United States.
