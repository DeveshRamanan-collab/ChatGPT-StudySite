      The argument against Hart: the rule of recognition exists because officials converge in accepting it. How can
      judges

      agree on the criteria of validity and yet disagree on the content of the law? If Hart is right, there should be no

      theoretical disagreements. In *Taking Rights Seriously* the counterexample was principles; in *Law's Empire* it is

      theoretical disagreement.


      Exam use: separate the three kinds of disagreement before you claim a theory cannot explain one.
  - slug: law-as-integrity
    title: Constructive interpretation and law as integrity
    visual: timeline
    visual-brief: >-
      Three stages of constructive interpretation along a loop (pre-interpretive examples of courtesy, the point of the
      practice, post-interpretive revision) feeding law as integrity: the chain novel analogy, and Judge Hercules
      testing answers on two axes, fit and justification.
    related:
      - theoretical-disagreement
      - ruling-theory-and-three-tenets
    depends-on:
      - theoretical-disagreement
      - laws2100-w04-finnis-central-case-method
    contrasts-with:
      - theoretical-disagreement
    cases: []
    authorities:
      - dworkin-laws-empire
      - finnis-on-reason-and-authority-in-laws-empire
    verify: false
    body: >-
      Because law is argumentative, *Law's Empire* builds a theory of law on interpretation. We interpret texts and

      also practices. Dworkin's example is courtesy:


      1. **Pre-interpretive stage**: identify the actions we associate with courtesy (letting people go first, removing
      a
         hat).
      2. **Interpretive stage**: ask what the point of the practice is.

      3. **Post-interpretive stage**: revisit the examples in light of that point and decide which really count.


      The crucial question in law is: what is the point of the law? For Dworkin, a liberal, the point of the legal
      system is

      to justify the exercise of state coercion. Hart's conditions for a legal system are about structure and say
      nothing

      about its point.


      **Law as integrity**: integrity → consistency in principle. The principles of the system's political morality, not
      its

      structure, give it unity.


      - The chain novel (LE 228): Dworkin's analogy for interpretation in the legal context.

      - Judge Hercules, "an imaginary judge of superhuman intellectual power and patience who accepts law as integrity"
        (LE 239).
      - Dimension of fit + dimension of justification (LE 255).


      The **one-right-answer thesis**: even in hard cases there is one correct legal answer. Positivists and realists
      reject

      it; Finnis, 'On reason and authority in Law's Empire' (1987), pushes back on the incommensurability of fit and

      justification.


      Exam use: ask whether integrity is general jurisprudence or particular — does it fit an evil system such as
      apartheid

      South Africa?
cases:
  - slug: riggs-v-palmer
    name: Riggs v Palmer
    citation: 115 NY 506 (1889)
    aglc: Riggs v Palmer, 115 NY 506 (1889)
    facts: >-
      On 13 August 1880 Francis B. Palmer made his will, giving small legacies to his two daughters, Mrs Riggs and Mrs
      Preston (the plaintiffs), and the remainder of his estate to his grandson, the defendant Elmer E. Palmer. Elmer,
      who lived with him as a member of the family and was sixteen at his death, knew of the provisions and, to prevent
      his grandfather revoking them and to obtain speedy possession of the property, wilfully murdered him by poisoning.
      The will was made in due form and admitted to probate.
    issue: 'Elmer Palmer claims the property: can he have it?'
    held: >-
      The majority held he could not. Statutes regulating wills, literally construed, would give the property to the
      murderer; but a thing within the letter of a statute is not within the statute unless it is within the intention
      of its makers, and all laws and contracts may be controlled in their operation by general, fundamental maxims of
      the common law. A minority would have applied the rigid rules established by the legislature, since the laws are
      silent and refusing the inheritance would impose an additional punishment.
    ratio: >-
      No one shall be permitted to profit by his own fraud, or to take advantage of his own wrong, or to found any claim
      upon his own iniquity, or to acquire property by his own crime — maxims of the common law described as general
      principles of natural law and justice, applied through rational/equitable construction of the statute.
    significance: >-
      Dworkin's central example: judges treat a principle found within positive law, with a clear moral dimension, as
      legally binding without any test of pedigree. In Law's Empire it becomes the example of theoretical disagreement
      about what the law is when the statute's text is clear.
    why-here: >-
      Used to show principles doing legal work that Hart's rule of recognition cannot capture, and judges disagreeing
      about the content of the law.
    verify: true
authorities:
  - slug: dworkin-taking-rights-seriously
    title: Ronald Dworkin, Taking Rights Seriously (Duckworth, 1977)
    kind: other
    text: >-
      "Legal positivism […] is the theory that individuals have legal rights only insofar as these have been created by
      explicit political decisions or explicit social practice." (xii) Positivism "is a model of and for a system of
      rules, and its central notion of a single fundamental test for law forces us to miss the important roles of these
      standards that are not rules." (22) "Discretion, like the hole in a doughnut, does not exist except as an area
      left open by a surrounding belt of restriction." (31)
    gloss: >-
      Dworkin's collected attack on Hart's positivism, including The Model of Rules I (1967) and II: principles, not
      only rules, are law, so there is no master test of pedigree and no strong discretion.
    cases:
      - riggs-v-palmer
    verify: false
  - slug: dworkin-laws-empire
    title: Ronald Dworkin, Law's Empire (Harvard UP, 1986)
    kind: other
    text: >-
      "Lawsuits always raise, at least in principle, three different kinds of issues: issues of fact, issues of law, and
      the twinned issues of political morality and fidelity." (3) "This book takes up the internal, participants' point
      of view; it tries to grasp the argumentative character of our legal practice by joining that practice and
      struggling with the issues of soundness and truth participants face." (14) Judge Hercules, "an imaginary judge of
      superhuman intellectual power and patience who accepts law as integrity" (239).
    gloss: >-
      Dworkin's interpretive theory: legal practice is argumentative, so theoretical disagreement about law is explained
      by constructive interpretation and law as integrity (fit and justification).
    cases:
      - riggs-v-palmer
    verify: false
  - slug: finnis-on-reason-and-authority-in-laws-empire
    title: John Finnis, 'On Reason and Authority in Law's Empire' (1987) 6 Law and Philosophy 357
    kind: article
    text: >-
      Cited on the Week 5 slides against Dworkin's one-right-answer thesis and integrity as an interpretative ideal. The
      lecture: Finnis agrees with some of Dworkin's criticisms of legal positivism but pushes against the
      one-right-answer thesis with arguments based on the incommensurability of the dimensions of fit and justification.
    gloss: 'A natural law critique of Dworkin''s one-right-answer thesis: fit and justification are incommensurable.'
    cases: []
    verify: false
questions:
  - key: a01
    type: mcq
    concept: ruling-theory-and-three-tenets
    difficulty: 1
    set: pretest
    stem: >-
      According to Dworkin, the "ruling theory of law" has two parts, both derived from the philosophy of Jeremy
      Bentham. What are they?
    options:
      - text: A theory about what law is (legal positivism) and a theory about what law ought to be (utilitarianism).
        correct: true
        why: >-
          Right: the slide says the ruling theory joins a theory of what law is (positivism) to a theory of what law
          ought to be (utilitarianism), both from Bentham.
      - text: A theory about what law is (natural law) and a theory about what law ought to be (liberalism).
        why: >-
          Tempting because Dworkin is a liberal, but the ruling theory is the one he attacks, and its account of what
          law is is positivist, not natural law.
      - text: A theory of legal rules (the command theory) and a theory of legal rights (natural rights theory).
        why: >-
          Tempting because Bentham and Austin held a command theory, but Dworkin frames the two parts as is and ought:
          positivism and utilitarianism, not natural rights.
      - text: A theory of adjudication (legal realism) and a theory of legislation (Benthamite utilitarianism).
        why: >-
          Utilitarianism is right for the ought part, but the is part is legal positivism; legal realism is next week
          and is not what Dworkin means by the ruling theory.
  - key: a02
    type: mcq
    concept: ruling-theory-and-three-tenets
    difficulty: 2
    stem: What exactly does Taking Rights Seriously criticise in the ruling theory of law?
    options:
      - text: Only its utilitarian part, while accepting positivism as an accurate account of what law is.
        why: >-
          Tempting because Dworkin is best known as a critic of positivism, which shows he does not accept it; the slide
          says he criticises both parts.
      - text: Both parts, and also the assumption that the two parts are independent of one another.
        correct: true
        why: >-
          Right: the slide says the book criticises both parts + the assumption that they are independent of one
          another.
      - text: Only its positivist part, because a theory of what law ought to be is not really jurisprudence.
        why: >-
          Dworkin does not rule out normative theory: he insists a theory of law must be normative too, and he attacks
          utilitarianism as well as positivism.
      - text: Neither part as such, only the way Hart later combined them in The Concept of Law in 1961.
        why: >-
          Tempting because Hart is his main target, but Dworkin rejects each part on its own merits and the claim that
          they are separable.
  - key: a03
    type: mcq
    concept: ruling-theory-and-three-tenets
    difficulty: 1
    stem: 'For Dworkin, a general theory of law must be:'
    options:
      - text: normative as well as conceptual.
        correct: true
        why: >-
          Right: the slide states that for Dworkin a general theory of law must be normative as well as conceptual; the
          is and ought cannot be neatly separated.
      - text: purely conceptual and morally neutral, like Hart.
        why: >-
          This is Hart's aim (general and descriptive, morally neutral); Dworkin denies that a theory of law can be only
          that.
      - text: empirical and sociological rather than conceptual.
        why: >-
          Tempting because Dworkin says law is a social phenomenon, but his claim is about adding the normative to the
          conceptual, not replacing concepts with data.
      - text: descriptive first, and only afterwards normative.
        why: >-
          That is the positivist order the lecture describes (the is question first, then criticism); Dworkin treats the
          two questions as interconnected.
  - key: a04
    type: mcq
    concept: ruling-theory-and-three-tenets
    difficulty: 2
    stem: Which statement is Dworkin's characterisation of legal positivism in Taking Rights Seriously (p xii)?
    options:
      - text: >-
          Individuals have legal rights only insofar as these have been created by explicit political decisions or
          explicit social practice.
        correct: true
        why: 'Right: this is the TRS xii quotation on the slide; it widens the earlier p xi line about legislation.'
      - text: >-
          Individuals have legal rights only insofar as those rights can be morally justified by a principle of justice
          or fairness.
        why: >-
          Tempting because principles matter to Dworkin, but this makes morality a condition of rights, which is the
          opposite of what he attributes to positivism.
      - text: Legal rights are the correlatives of commands issued by a sovereign whom the bulk of society habitually obeys.
        why: >-
          That is Austin's command theory from week 2; Dworkin targets Hart's more powerful version, framed in terms of
          explicit decisions and practices.
      - text: Legal rights pre-exist all legislation, and courts merely declare rights that were already there before them.
        why: >-
          This is the view positivism rejects, according to Dworkin: "Legal positivism rejects the idea that legal
          rights can pre-exist any form of legislation" (xi).
  - key: a05
    type: mcq
    concept: ruling-theory-and-three-tenets
    difficulty: 1
    stem: >-
      Dworkin's first tenet of positivism says legal rules can be identified in light of their pedigree. Which part of
      Hart's theory does this describe?
    options:
      - text: The rule of recognition, which supplies the criteria of legal validity.
        correct: true
        why: >-
          Right: the lecture says the pedigree tenet is obviously Hart's idea of the rule of recognition, which gives
          the criteria identifying the system's valid rules.
      - text: The primary rules of obligation that bind ordinary citizens.
        why: >-
          Tempting because primary rules are the ones identified, but the test of pedigree itself is supplied by the
          secondary rule of recognition.
      - text: The internal point of view of citizens who accept the law.
        why: >-
          The internal point of view explains acceptance of rules, but the pedigree test is about criteria of validity,
          which is the rule of recognition's job.
      - text: The minimum content of natural law found in every system.
        why: >-
          The minimum content (week 4) concerns what law must protect as a natural necessity, not how valid rules are
          identified.
  - key: a06
    type: mcq
    concept: ruling-theory-and-three-tenets
    difficulty: 2
    stem: >-
      Which of the following is NOT one of the three key tenets that Dworkin attributes to legal positivism in The Model
      of Rules I?
    options:
      - text: Legal rules can be identified in light of their pedigree.
        why: This is the first tenet on the slide (the rule of recognition), so it is one of the three and not the answer.
      - text: There are cases in which judges must exercise discretion.
        why: >-
          This is the second tenet on the slide: the law has gaps and judges must then exercise discretion, so it is one
          of the three.
      - text: A rule is legally valid only if it passes a moral test of justice.
        correct: true
        why: >-
          Right: this is not a positivist tenet at all; positivists deny that validity necessarily depends on morality,
          and Dworkin lists pedigree, discretion and obligation.
      - text: Legal obligation exists if and only if the case falls under a valid legal rule.
        why: >-
          This is the third tenet, the positivists' theory of legal obligation, so it is one of the three and not the
          answer.
  - key: a07
    type: mcq
    concept: ruling-theory-and-three-tenets
    difficulty: 2
    stem: Why, in his own words, does Dworkin focus his examination of legal positivism on Hart's version?
    options:
      - text: Because it is the weakest version, and so the easiest one to refute in a few pages.
        why: >-
          Tempting as a debating tactic, but Dworkin says the opposite: Hart's is "the most powerful contemporary
          version of positivism".
      - text: Because Hart was the only positivist then writing in English-speaking jurisprudence.
        why: >-
          The lecture places Hart within a tradition (Bentham, Austin); Dworkin chooses him for the quality of his
          views, not because he was alone.
      - text: Because of its clarity and elegance, and because constructive thought must start with his views.
        correct: true
        why: >-
          Right: TRS 16 — "not only because of its clarity and elegance, but because … constructive thought must start
          with a consideration of his views."
      - text: Because Hart had openly defended utilitarianism as the true theory of what law ought to be.
        why: >-
          The ruling theory links positivism to utilitarianism historically, but Dworkin does not say he picks Hart for
          defending utilitarianism.
  - key: a08
    type: mcq
    concept: ruling-theory-and-three-tenets
    difficulty: 3
    stem: >-
      A student objects: "Dworkin says positivists reject rights that pre-exist legislation, but common law rights are
      not legislated, so he misdescribes positivism." What is the best reply from the lecture?
    options:
      - text: The student is right, and Dworkin later abandoned his account of positivism for that reason.
        why: >-
          Tempting, but the lecture says Dworkin himself explains the broader point; nothing suggests he abandoned his
          characterisation.
      - text: Dworkin accepts that common law rights are moral rights, so they fall outside his claim entirely.
        why: >-
          Dworkin does think law takes in rights like moral rights, but that is his own view, not a reply that saves his
          description of positivism.
      - text: Dworkin was only describing United States statute law, where common law rights are unimportant.
        why: >-
          The lecture raises whether his theory is American, but not in this way; his claim about positivism is general,
          about Hart's theory.
      - text: 'His point is broader than legislation: explicit political decisions or explicit social practice.'
        correct: true
        why: >-
          Right: the lecture says the point is about explicit political decisions and explicit social practice —
          judicial practice producing binding precedent included (TRS xii).
  - key: a09
    type: mcq
    concept: ruling-theory-and-three-tenets
    difficulty: 2
    stem: >-
      The third tenet (legal obligation only if a valid rule applies) matches Hart's account of obligation. Which of
      Hart's examples shows that an obligation needs a rule?
    options:
      - text: 'The gunman: you may be obliged to hand over the money, but you have no obligation.'
        correct: true
        why: >-
          Right: the lecture recalls being obliged vs having an obligation — no obligation in the gunman scenario
          because no rule is in place, unlike in chess.
      - text: 'The queue: people have an obligation to wait simply because most of them happen to wait.'
        why: >-
          Tempting because the queue is a Hart example, but the point is that it is governed by a rule; mere convergence
          of behaviour is a habit, not an obligation.
      - text: 'The referee: the fighter has an obligation because the referee has final authority to decide.'
        why: The referee comes from Dworkin's discussion of discretion (TRS 34), not from Hart's account of obligation.
      - text: 'The sergeant: soldiers have an obligation because their sergeant uses his judgment well.'
        why: >-
          The sergeant is also Dworkin's discretion example; it illustrates standards set by authority, not Hart's
          account of obligation.
  - key: a10
    type: mcq
    concept: ruling-theory-and-three-tenets
    difficulty: 3
    contrasts-with:
      - laws2100-w04-finnis-central-case-method
    stem: >-
      Dworkin and Finnis both reject the positivist separation of the "is" question from the "ought" question. How does
      the lecture distinguish them?
    options:
      - text: Finnis puts the "why" question first; Dworkin treats the two questions as interconnected.
        correct: true
        why: >-
          Right: the lecture says for Finnis you ask the why question first, while Dworkin sees the two questions as
          interconnected — the point of a practice is needed to understand it.
      - text: Finnis keeps the "is" question first, while Dworkin places the "ought" question first.
        why: >-
          Reversed and wrong: putting "is" first is the positivist order (Hart, Bentham, Austin, Kelsen); Finnis puts
          the why question first.
      - text: Both make identical arguments, which is why Dworkin quotes Finnis in Taking Rights Seriously.
        why: >-
          The lecture stresses that the arguments are different even though the idea is the same; there is no claim that
          Dworkin quotes Finnis.
      - text: Dworkin thinks we describe law first and evaluate later; Finnis thinks evaluation is optional.
        why: >-
          Both parts are wrong: describing first and evaluating later is the positivist view both reject, and Finnis
          says evaluation is needed even to describe.
  - key: a11
    type: mcq
    concept: ruling-theory-and-three-tenets
    difficulty: 3
    stem: According to the lecture, what general strategy does Dworkin use against Hart?
    options:
      - text: He shows that Hart's theory, if accepted, would lead judges to decide cases immorally.
        why: >-
          Tempting because Dworkin cares about morality, but the lecture's point is about fit: a descriptive theory that
          fails to describe a feature of law fails.
      - text: 'He uses Hart''s own anti-Austin strategy: find a feature of law the theory cannot explain.'
        correct: true
        why: >-
          Right: the lecture says Hart argued Austin could not fit continuity and persistence; Dworkin does the same
          with principles, and later theoretical disagreement.
      - text: He shows that Hart misread Bentham, so the positivist tradition never supported Hart's views.
        why: Dworkin places Hart within Bentham's tradition (the ruling theory); he does not argue Hart misread Bentham.
      - text: He gathers historical evidence that officials never actually accepted a rule of recognition.
        why: Dworkin argues from how lawyers and judges reason, not from historical evidence against official acceptance.
  - key: a12
    type: mcq
    concept: ruling-theory-and-three-tenets
    difficulty: 3
    stem: Which counterexample does Dworkin use against Hart in each book?
    options:
      - text: 'Taking Rights Seriously: theoretical disagreement. Law''s Empire: principles.'
        why: >-
          Reversed: the lecture says TRS focused on principles, and Law's Empire brought a new line of criticism based
          on theoretical disagreement.
      - text: 'Taking Rights Seriously: principles. Law''s Empire: theoretical disagreement about law.'
        correct: true
        why: >-
          Right: the lecture says the strategy is the same — find a counterexample — with principles in TRS and
          theoretical disagreements in Law's Empire.
      - text: 'Both books: evil legal systems such as apartheid South Africa that fail tests of justice.'
        why: >-
          Evil systems are raised in the lecture as a problem for Dworkin's law as integrity, not as his counterexample
          against Hart.
      - text: 'Taking Rights Seriously: discretion. Law''s Empire: the non-existence of the rule of recognition.'
        why: >-
          Discretion is one of the tenets attacked, but the counterexamples are principles and theoretical disagreement;
          Dworkin does not claim the rule of recognition is non-existent.
  - key: a13
    type: mcq
    concept: ruling-theory-and-three-tenets
    difficulty: 2
    stem: From whose perspective does Dworkin study the problem of legal obligation?
    options:
      - text: An external observer, such as a sociologist recording regularities in official behaviour.
        why: >-
          This is the external perspective; Dworkin, like Hart and Finnis, adopts an internal point of view, though his
          own version of it.
      - text: Ordinary citizens deciding whether they have a moral reason to comply with the law.
        why: >-
          Citizens can take the internal view, but Dworkin looks at the lawyers and judges who argue within the system
          as the most engaged participants.
      - text: The lawyers and judges who argue within the system about rights and obligations.
        correct: true
        why: >-
          Right: the lecture says for Dworkin we look at the problem from the perspective of the lawyers and judges who
          argue within the system.
      - text: Legislators choosing the policies that will improve the community's welfare over time.
        why: >-
          Tempting because policies are a kind of standard, but Dworkin's perspective is that of legal argument in
          court, not legislative choice.
  - key: a14
    type: mcq
    concept: ruling-theory-and-three-tenets
    difficulty: 2
    variant-of: a05
    stem: >-
      Scenario: a court applies a regulation because it was made by a minister under a valid Act. Which tenet of
      positivism, in Dworkin's list, does this reasoning illustrate?
    options:
      - text: 'The pedigree tenet: the rule is identified by how it was made, under a master test.'
        correct: true
        why: >-
          Right: identifying the regulation by its source under a valid Act is identification by pedigree, which is what
          the rule of recognition does.
      - text: 'The discretion tenet: the court exercises strong discretion because a minister made the rule.'
        why: >-
          Nothing here is left open; the court applies a rule identified by its source, so no discretion (weak or
          strong) is at stake.
      - text: 'The obligation tenet only: there is an obligation because the rule is morally desirable.'
        why: >-
          The obligation tenet ties obligation to a valid rule, not to moral desirability; and the scenario is about how
          the rule was identified.
      - text: 'None of them: positivists hold that ministers'' regulations cannot be law at all.'
        why: >-
          Positivists accept delegated legislation identified by social sources; the scenario is a textbook pedigree
          test.
  - key: a15
    type: mcq
    concept: ruling-theory-and-three-tenets
    difficulty: 2
    variant-of: a01
    stem: >-
      A classmate says: "Dworkin's ruling theory is positivism plus natural law, and Dworkin rejects only the natural
      law half." What is the correction?
    options:
      - text: The classmate is right about the parts but wrong about Dworkin, who accepts both.
        why: >-
          Wrong about the parts too: the ruling theory contains no natural law; Dworkin rejects both of its actual
          parts.
      - text: The second part is utilitarianism; Dworkin rejects both parts and their independence.
        correct: true
        why: >-
          Right: the ruling theory is positivism (what law is) + utilitarianism (what law ought to be); Dworkin rejects
          both and the assumption that they are independent.
      - text: The second part is legal realism, and Dworkin rejects only that realist part of it.
        why: >-
          Realism is not part of the ruling theory; the ought part is Bentham's utilitarianism, and Dworkin rejects
          positivism too.
      - text: The second part is Kelsen's pure theory, which Dworkin accepts as the correct account.
        why: >-
          Kelsen is not a part of the ruling theory as the slide defines it; the two parts come from Bentham, and
          Dworkin accepts neither.
  - key: a16
    type: truefalse
    concept: ruling-theory-and-three-tenets
    difficulty: 1
    set: quickfire
    statement: >-
      Dworkin succeeded Hart as Professor of Jurisprudence at Oxford, and Hart supported his election even though
      Dworkin had already criticised his theory.
    answer: true
    why: >-
      True: the lecture says Dworkin became professor of jurisprudence at Oxford after Hart, and Hart really supported
      his election despite the earlier criticisms.
  - key: a17
    type: truefalse
    concept: ruling-theory-and-three-tenets
    difficulty: 1
    set: quickfire
    statement: Dworkin accepts that the two parts of the ruling theory of law are independent of one another.
    answer: false
    why: >-
      False: the slide says Dworkin criticises both parts + the assumption that they are independent of one another; a
      theory of law must be normative too.
  - key: a18
    type: truefalse
    concept: ruling-theory-and-three-tenets
    difficulty: 1
    set: quickfire
    statement: >-
      On Dworkin's account, the positivists' third tenet is that a legal obligation exists if and only if the case falls
      under a valid legal rule.
    answer: true
    why: >-
      True: the third tenet on the slide is "Legal obligation if and only if the case falls under a valid legal rule",
      matching Hart's rule-based account of obligation.
  - key: a19
    type: truefalse
    concept: ruling-theory-and-three-tenets
    difficulty: 2
    statement: >-
      Dworkin says the most powerful contemporary version of positivism is Kelsen's, and that is the version criticised
      in Taking Rights Seriously.
    answer: false
    why: >-
      False: TRS ix says the most powerful contemporary version of positivism is H.L.A. Hart's, and "it is Hart's
      version which is criticized in this book".
    set: quickfire
  - key: b01
    type: mcq
    concept: rules-principles-and-policies
    difficulty: 1
    set: pretest
    stem: Which of these is Dworkin's own example of a policy?
    options:
      - text: The standard that automobile accidents are to be decreased.
        correct: true
        why: >-
          Right: TRS 22 — "the standard that automobile accidents are to be decreased is a policy"; it sets out a goal
          to be reached.
      - text: The standard that no man may profit by his own wrong.
        why: >-
          Tempting because it is in the same sentence, but Dworkin gives this as his example of a principle — the one
          used in Riggs v Palmer.
      - text: The standard that a will must be signed before two witnesses.
        why: >-
          A formal requirement like this works in an all-or-nothing way, like a rule; it is not a goal for improving the
          community.
      - text: The standard that a referee has final authority over a fight.
        why: >-
          The referee appears in Dworkin's discussion of discretion (final authority is a weak sense), not as his
          example of a policy.
  - key: b02
    type: mcq
    concept: rules-principles-and-policies
    difficulty: 1
    stem: According to Dworkin, what makes a standard a principle rather than a policy?
    options:
      - text: It sets out a goal to be reached, generally an improvement in some feature of the community.
        why: >-
          This is Dworkin's definition of a policy, not a principle; a principle is observed whether or not it advances
          a desirable goal.
      - text: It is observed because it is a requirement of justice or fairness or some other dimension of morality.
        correct: true
        why: >-
          Right: TRS 22 — a principle is observed "not because it will advance or secure" a desirable situation, "but
          because it is a requirement of justice or fairness".
      - text: It was enacted by a legislature and so can be identified by its pedigree in the legal system.
        why: >-
          Tempting because pedigree identifies rules for positivists, but Dworkin's point is that principles cannot be
          identified by pedigree.
      - text: It applies in an all-or-nothing fashion once the facts it stipulates are present in the case.
        why: >-
          All-or-nothing application is the mark of a rule, not a principle; principles state reasons that argue in one
          direction.
  - key: b03
    type: mcq
    concept: rules-principles-and-policies
    difficulty: 2
    stem: 'Dworkin says the difference between legal principles and legal rules is:'
    options:
      - text: a semantic distinction, turning only on how each standard happens to be worded.
        why: >-
          Tempting because the lecture asks whether it is "just a matter of semantics", but Dworkin says form does not
          always tell you which a standard is.
      - text: 'a distinction of source: rules come from legislatures, principles come from courts.'
        why: >-
          Dworkin does not draw the line by source; both rules and principles can be found in the law, and Riggs finds
          principles as maxims of the common law.
      - text: a logical distinction in the character of the direction each standard gives.
        correct: true
        why: 'Right: TRS 24 — "a logical distinction … they differ in the character of the direction they give."'
      - text: 'a distinction of value: rules are morally neutral, principles are always just.'
        why: >-
          Principles have a moral dimension, but Dworkin frames the distinction as logical — how each directs a decision
          — not as a ranking of value.
  - key: b04
    type: mcq
    concept: rules-principles-and-policies
    difficulty: 1
    stem: How does a legal rule apply, according to Dworkin?
    options:
      - text: In an all-or-nothing fashion.
        correct: true
        why: >-
          Right: the slide says a rule is applicable in an all-or-nothing fashion; the lecture glosses it as if A then
          B, applied by modus ponens.
      - text: By stating a reason that argues in one direction without necessitating a decision.
        why: This describes a principle; a rule, once its conditions are met, settles the outcome.
      - text: By being weighed against the other rules that bear on the same set of facts.
        why: >-
          Weight is the dimension principles have and rules lack; conflicting rules are not weighed — one of them gives
          way.
      - text: Only when a judge exercises strong discretion to choose to apply it in a given case.
        why: >-
          Strong discretion means not being bound by standards; a rule binds when its conditions are met, without any
          such choice.
  - key: b05
    type: mcq
    concept: rules-principles-and-policies
    difficulty: 1
    stem: Which dimension do principles have that rules lack?
    options:
      - text: Validity.
        why: >-
          Tempting because validity is central to Hart, but Dworkin's point is that principles have weight; validity by
          pedigree is the test principles escape.
      - text: The dimension of weight or importance.
        correct: true
        why: >-
          Right: the slide says principles have the dimension of weight/importance, whereas rules do not have this
          dimension.
      - text: A pedigree traceable to a master rule of recognition.
        why: >-
          Dworkin argues principles cannot be identified by pedigree; the rule of recognition captures rules, not
          principles.
      - text: Generality, since principles apply to every case in the system.
        why: Principles are general, but so are many rules; the distinctive dimension Dworkin names is weight/importance.
  - key: b06
    type: mcq
    concept: rules-principles-and-policies
    difficulty: 2
    stem: Two valid legal rules apply to the same facts and give opposite conclusions. On Dworkin's account, what follows?
    options:
      - text: The judge weighs the two rules, and the lighter one still remains a valid part of the law.
        why: >-
          This is how conflicting principles work; rules lack the dimension of weight, so they cannot be balanced this
          way.
      - text: 'Only one of them can apply: one of the rules must give way to the other.'
        correct: true
        why: >-
          Right: the lecture says if two rules conflict only one applies — you need to pick one over the other, because
          rules apply all-or-nothing.
      - text: Both remain binding, so the judge exercises strong discretion to choose freely between them.
        why: >-
          Dworkin denies that judges have strong discretion in this sense, and the conflict is resolved by one rule
          yielding, not by free choice.
      - text: The conflict itself shows that both standards were really principles all along, not rules.
        why: >-
          Conflict alone does not reclassify a standard; how legal actors reason with it — all-or-nothing or by weight —
          does.
  - key: b07
    type: mcq
    concept: rules-principles-and-policies
    difficulty: 3
    stem: >-
      Scenario: a court finds that two constitutional principles, equality and free speech, both bear on a case and
      point in opposite directions. How would Dworkin describe what the court should do?
    options:
      - text: Declare one of the two principles invalid, since only one of two conflicting standards can be law.
        why: >-
          That is how conflicting rules work; the lecture says with principles you do not just go with one and treat the
          other as invalid.
      - text: Weigh the principles for this case; the one that is outweighed remains a valid principle of the law.
        correct: true
        why: >-
          Right: principles have weight, so conflicts are resolved by a balancing exercise, and the outweighed principle
          still belongs to the law.
      - text: Treat both as policies, because any standard that can conflict must be a goal of the community.
        why: Principles and policies differ in why they are observed (morality vs goals), not in whether they can conflict.
      - text: Exercise strong discretion, since conflicting principles leave the judge unbound by any standard.
        why: >-
          Dworkin denies that principles leave judges unbound; weighing principles is at most weak discretion
          (judgment), not strong discretion.
  - key: b08
    type: mcq
    concept: rules-principles-and-policies
    difficulty: 2
    stem: Can you always tell from the form of a standard whether it is a rule or a principle?
    options:
      - text: 'Yes: rules always use "must" or "shall", and principles always use the word "may".'
        why: >-
          Tempting because wording is visible, but the slide says it is not always clear from the form of a standard
          which it is.
      - text: 'Yes: anything written in a statute is a rule, and anything unwritten is a principle.'
        why: >-
          Source and form do not settle the classification; the lecture says look at how legal actors reason with the
          standard.
      - text: 'No: you look at how legal actors and judges actually reason with the standard.'
        correct: true
        why: >-
          Right: the slide says it is not always clear from the form; the lecture adds that we understand which it is by
          seeing how officials reason with it.
      - text: 'No: the classification is arbitrary, and so Dworkin abandoned it in later work.'
        why: >-
          Dworkin does not call it arbitrary; he says it is a logical distinction, identified through the way the
          standard functions.
  - key: b09
    type: mcq
    concept: rules-principles-and-policies
    difficulty: 2
    stem: Why are principles a problem for Hart's theory, according to Dworkin?
    options:
      - text: Principles are really policies, and Hart's theory has no account of the community's goals.
        why: Dworkin distinguishes principles from policies; his objection is not that principles are policies.
      - text: Principles are extra-legal moral standards, and Hart wrongly counts them as part of the law.
        why: >-
          This is the view Dworkin opposes; he argues principles are part of the law and that Hart's theory cannot
          capture them.
      - text: Principles cannot be identified by pedigree, so no master rule of recognition captures them.
        correct: true
        why: >-
          Right: the lecture says principles cannot be identified in light of their pedigree, which is what the rule of
          recognition does — a counterexample to Hart.
      - text: Principles always conflict with statutes, so no legal system that has principles can be stable.
        why: >-
          Principles can conflict with each other and with rules, but Dworkin's objection is about identification, not
          instability.
  - key: b10
    type: mcq
    concept: rules-principles-and-policies
    difficulty: 3
    stem: >-
      Dworkin says both rules and principles "point to particular decisions about legal obligation". The lecture links
      this to a medieval distinction. Which aspect of law is in play?
    options:
      - text: Its coercive force (vis coercitiva).
        why: >-
          Tempting because the lecture names both, but "pointing to decisions" is the guiding function; the coercive
          force is the other half of the distinction.
      - text: Its directive or guiding force (vis directiva).
        correct: true
        why: >-
          Right: the lecture says Dworkin is focusing on the directive force of law — the vis directiva — as distinct
          from the coercive force (vis coercitiva).
      - text: Its habit of obedience among the bulk of society.
        why: >-
          The habit of obedience belongs to Austin's theory (week 2); the medieval contrast the lecture draws is
          coercive vs directive force.
      - text: Its sanctioning function, backed by threats of evil.
        why: >-
          Sanctions and threats relate to the coercive side of law; the pointing function Dworkin describes is
          directive.
  - key: b11
    type: mcq
    concept: rules-principles-and-policies
    difficulty: 3
    variant-of: b01
    stem: Which standard is best classified as a policy in Dworkin's sense?
    options:
      - text: No one may found any claim upon his own iniquity, however the statute is worded.
        why: This is one of the maxims in Riggs — a requirement of justice, so a principle, not a goal.
      - text: An accused person must not be punished twice for the same offence, as a matter of fairness.
        why: Observed because fairness requires it, not to secure a desirable social state; that makes it a principle.
      - text: A will is void unless signed by the testator in front of two witnesses.
        why: This works all-or-nothing once its conditions are met, which is the mark of a rule, not a policy.
      - text: Existing local manufacturing jobs are to be protected from decline.
        correct: true
        why: >-
          Right: it sets out a goal about an economic feature of the community; a negative goal protecting a present
          feature from adverse change is still a policy.
  - key: b12
    type: mcq
    concept: rules-principles-and-policies
    difficulty: 2
    stem: >-
      Dworkin calls positivism "a model of and for a system of rules". What does its central notion of a single
      fundamental test for law force us to miss?
    options:
      - text: The important roles of standards that are not rules, such as principles and policies.
        correct: true
        why: >-
          Right: TRS 22 — its "single fundamental test for law forces us to miss the important roles of these standards
          that are not rules."
      - text: The role of coercion, since a test for law cannot explain sanctions or threats of force.
        why: Hart deals with coercion elsewhere; Dworkin's complaint here is about standards that are not rules.
      - text: The existence of secondary rules of change and adjudication alongside the rule of recognition.
        why: >-
          Hart's theory includes secondary rules; the problem Dworkin names is what lies outside the model of rules
          altogether.
      - text: The distinction between the internal and external points of view on legal practice.
        why: Hart drew that distinction himself; Dworkin's point here concerns principles, policies and other standards.
  - key: b13
    type: mcq
    concept: rules-principles-and-policies
    difficulty: 3
    stem: >-
      Defining principles by reference to "justice or fairness or some other dimension of morality", the lecture says to
      bracket, for now, which question?
    options:
      - text: Whether principles exist in the law at all, or only in morality.
        why: That is the question Dworkin answers (principles are part of the law); it is not the one the lecture brackets.
      - text: Whether policies are binding as law in the same way as rules.
        why: >-
          The lecture does not bracket this; the bracketed question concerns what "morality" means in the definition of
          a principle.
      - text: Whether "morality" there means social morality or critical morality.
        correct: true
        why: >-
          Right: the lecture says to bracket whether Dworkin means social morality (accepted in a community) or
          objective/critical morality.
      - text: Whether Riggs v Palmer was decided correctly by the majority.
        why: >-
          Riggs is discussed on its merits later; the bracketed question is about the kind of morality in the
          definition.
  - key: b14
    type: mcq
    concept: rules-principles-and-policies
    difficulty: 2
    variant-of: b01
    cases:
      - riggs-v-palmer
    stem: How would Dworkin classify the maxim "no one shall be permitted to acquire property by his own crime"?
    options:
      - text: A policy, because it aims to reduce the number of crimes committed in the community.
        why: >-
          Tempting because deterrence is a goal, but the maxim is observed as a requirement of justice, not because it
          secures a desirable social state.
      - text: A rule, because it is stated in a single sentence that applies whenever a crime is committed.
        why: >-
          Form does not settle it; and the maxim is weighed against the will statute in Riggs rather than applied
          all-or-nothing.
      - text: 'A principle: a requirement of justice with weight, not an all-or-nothing rule.'
        correct: true
        why: >-
          Right: it is one of Riggs's fundamental maxims, akin to "no man may profit by his own wrong", Dworkin's
          example of a principle.
      - text: 'Neither: an extra-legal moral maxim that judges may cite but that is not law.'
        why: >-
          This is the positivist reading Dworkin rejects; the maxims were found in the common law, and for Dworkin they
          are legal principles.
  - key: b15
    type: mcq
    concept: rules-principles-and-policies
    difficulty: 3
    variant-of: b06
    stem: >-
      Scenario: a statute says "a lease of land for more than three years must be in writing", and another says "a lease
      of land for more than three years is valid if oral". A judge must decide a case. On Dworkin's account, why is this
      different from a clash of principles?
    options:
      - text: Because rules have weight, so the heavier statute simply prevails over the lighter one.
        why: Rules lack the dimension of weight; the answer is not that one is heavier but that only one can apply.
      - text: 'Because rules apply all-or-nothing: one must give way, whereas conflicting principles are weighed.'
        correct: true
        why: >-
          Right: two conflicting rules cannot both apply — pick one — whereas principles are balanced and the outweighed
          one remains law.
      - text: Because statutes are policies, and policies must always yield to the principles of the common law.
        why: >-
          These are formal requirements that work like rules, and Dworkin does not say policies always yield to
          principles.
      - text: Because the judge has strong discretion here, while with principles the judge is fully bound.
        why: Dworkin denies strong discretion in either case; the difference is in how the standards direct the decision.
  - key: b16
    type: truefalse
    concept: rules-principles-and-policies
    difficulty: 1
    set: quickfire
    statement: For Dworkin, principles have the dimension of weight or importance, whereas rules do not have this dimension.
    answer: true
    why: >-
      True: the slide says principles have the dimension of weight/importance and rules do not — which shows up when
      principles conflict and have to be balanced.
  - key: b17
    type: truefalse
    concept: rules-principles-and-policies
    difficulty: 2
    set: quickfire
    statement: >-
      A policy, in Dworkin's sense, can be negative: it may stipulate that some present feature of the community is to
      be protected from adverse change.
    answer: true
    why: >-
      True: TRS 22 — policies generally set out an improvement, "though some goals are negative, in that they stipulate
      that some present feature is to be protected from adverse change".
  - key: b18
    type: truefalse
    concept: rules-principles-and-policies
    difficulty: 1
    set: quickfire
    statement: For Dworkin, whether a standard is a rule or a principle is always clear from how it is worded.
    answer: false
    why: >-
      False: the slide says it is not always clear from the form of a standard whether it is a rule or a principle; look
      at how legal actors reason with it.
  - key: b19
    type: truefalse
    concept: rules-principles-and-policies
    difficulty: 2
    statement: >-
      Dworkin thinks Hart's positivism can be repaired by modifying the rule of recognition so that it also embraces
      principles.
    answer: false
    why: >-
      False: the slide says we cannot adapt Hart's positivism by modifying the rule of recognition to embrace
      principles, because no test of pedigree can capture them.
    set: quickfire
  - key: c01
    type: mcq
    concept: discretion-riggs-and-obligation
    difficulty: 1
    set: pretest
    stem: >-
      "Discretion, like the hole in a doughnut, does not exist except as an area left open by a surrounding belt of
      restriction." What is Dworkin's point?
    options:
      - text: Discretion only makes sense relative to standards that surround it and set its limits.
        correct: true
        why: >-
          Right: TRS 31 — discretion is at home only where someone decides subject to standards set by an authority; the
          belt of restriction defines the hole.
      - text: 'Discretion is empty: judges never have any real choice once the rules have been identified.'
        why: >-
          Tempting because a hole is empty, but Dworkin accepts discretion in weak senses; the image says discretion is
          bounded, not non-existent.
      - text: Discretion is at its widest where the surrounding law is densest and most detailed.
        why: >-
          The image does not measure width by density of law; it says discretion exists only as a space left open by
          restrictions.
      - text: Discretion belongs to legislators, while judges are always the surrounding belt of restriction.
        why: >-
          The doughnut is about any official deciding under standards set by an authority, including judges and
          sergeants; it does not assign roles this way.
  - key: c02
    type: mcq
    concept: discretion-riggs-and-obligation
    difficulty: 1
    stem: Which of these is one of Dworkin's weak senses of discretion?
    options:
      - text: On some issue the official is simply not bound by standards set by the authority in question.
        why: This is Dworkin's definition of strong discretion (TRS 32), not a weak sense.
      - text: The standards cannot be applied mechanically but demand the use of judgment.
        correct: true
        why: 'Right: TRS 31 — the first weak sense is that the standards cannot be applied mechanically and demand judgment.'
      - text: The official may create a new rule for the future, binding in later cases but not in this one.
        why: >-
          Creating a new rule where none applies is what positivists say judges do in hard cases; it is not one of
          Dworkin's weak senses.
      - text: The official may disregard the standards whenever their application would be unjust in the case.
        why: >-
          Freedom to set standards aside is closer to strong discretion; weak discretion leaves the official bound by
          standards.
  - key: c03
    type: mcq
    concept: discretion-riggs-and-obligation
    difficulty: 2
    stem: 'Dworkin''s second weak sense of discretion says that:'
    options:
      - text: an official must use judgment because the standards are vague.
        why: This is the first weak sense (judgment), not the second; the second is about finality.
      - text: some official has final authority and cannot be reviewed and reversed.
        correct: true
        why: >-
          Right: TRS 32 — "some official has final authority to make a decision and cannot be reviewed and reversed by
          any other official".
      - text: an official is simply not bound by standards on some issue.
        why: This is strong discretion; Dworkin separates it from both weak senses.
      - text: an official is bound only by standards they have chosen to accept.
        why: >-
          Dworkin says discretion is relative to standards set by an authority; self-chosen standards are not his second
          weak sense.
  - key: c04
    type: mcq
    concept: discretion-riggs-and-obligation
    difficulty: 2
    stem: What is "strong" discretion, as Dworkin defines it?
    options:
      - text: Judgment in applying standards set by an authority, subject to review by others.
        why: >-
          Using judgment is the first weak sense, and reviewability is the opposite of the second; neither is strong
          discretion.
      - text: Final authority to decide, where no other official can review or reverse the decision.
        why: Finality is the second weak sense; Dworkin says strong discretion means more than this.
      - text: On some issue, not being bound by standards set by the authority in question.
        correct: true
        why: >-
          Right: TRS 32 — strong discretion is to say that "on some issue he is simply not bound by standards set by the
          authority in question".
      - text: The power to overrule an unjust statute by appeal to the principles of natural law.
        why: >-
          Riggs appeals to principles, but Dworkin reads that as being bound by legal principles, not as strong
          discretion to overrule statutes.
  - key: c05
    type: mcq
    concept: discretion-riggs-and-obligation
    difficulty: 2
    stem: What is Dworkin's position on judicial discretion?
    options:
      - text: Judges have strong discretion in hard cases, but only weak discretion in easy cases.
        why: >-
          Tempting because hard cases are where positivists locate strong discretion, but Dworkin denies strong
          discretion there too.
      - text: He accepts the weak senses, but denies that cases like Riggs show strong discretion.
        correct: true
        why: >-
          Right: the lecture says Dworkin accepts weak discretion; in Riggs-type cases judges are bound by principles,
          so at most they exercise weak discretion.
      - text: He denies that judges have any discretion at all, even in the weak senses of judgment and finality.
        why: 'Too strong: Dworkin explicitly gives and accepts the two weak senses; it is strong discretion he rejects.'
      - text: He accepts strong discretion but argues that judges should exercise it according to utilitarian policy.
        why: Dworkin rejects both strong discretion and the utilitarian half of the ruling theory.
  - key: c06
    type: mcq
    concept: discretion-riggs-and-obligation
    difficulty: 1
    cases:
      - riggs-v-palmer
    stem: In Riggs v Palmer, why did the law, read literally, seem to give Elmer the property?
    options:
      - text: His grandfather's will was made in due form and had been admitted to probate.
        correct: true
        why: >-
          Right: the slide says the will was made in due form and admitted to probate, so "it must have effect according
          to the letter of the law".
      - text: Elmer had been acquitted of the murder, so no crime could be held against him.
        why: >-
          Nothing in the materials says he was acquitted; the facts are that he wilfully murdered his grandfather, and
          the lecture notes he was punished.
      - text: A statute expressly provided that heirs keep legacies even if they kill the testator.
        why: >-
          The statutes were silent on the point; the argument was that, literally construed, they gave the property to
          the murderer.
      - text: Elmer's aunts, the plaintiffs, had signed a deed releasing all claims to the estate.
        why: >-
          The plaintiffs, Mrs Riggs and Mrs Preston, received small legacies and brought the action; no release appears
          in the materials.
  - key: c07
    type: mcq
    concept: discretion-riggs-and-obligation
    difficulty: 2
    cases:
      - riggs-v-palmer
    stem: Which canon of construction did the court in Riggs rely on?
    options:
      - text: A statute must always be read according to its letter, whatever the legislators intended.
        why: >-
          This is the literal approach the majority departed from; the minority argued that the court was bound by the
          rigid rules of law.
      - text: A thing within the letter of a statute is not within it unless within the intention of its makers.
        correct: true
        why: >-
          Right: the slide — a thing within the intention is within the statute as if within the letter, and a thing
          within the letter is not within it unless within the intention.
      - text: Where a statute is silent, the court must follow the most recent decision of another state.
        why: >-
          Owens v Owens (North Carolina) was cited by the minority as a similar case; it is not the canon the majority
          used.
      - text: A statute is void to the extent that it conflicts with the fundamental maxims of equity.
        why: The maxims "control" the operation of laws; the court did not declare the statute void.
  - key: c08
    type: mcq
    concept: discretion-riggs-and-obligation
    difficulty: 2
    cases:
      - riggs-v-palmer
    stem: Which set of reasons belongs to the minority opinion in Riggs v Palmer, as summarised on the slides?
    options:
      - text: The fundamental maxims of the common law control every statute, and no one may profit from his crime.
        why: This is the majority's line of argument (rational/equitable construction), not the minority's.
      - text: The statute should be read in light of the legislators' general intention to respect justice.
        why: This is one of the reasons Dworkin gives for the majority's reading in Law's Empire, not the minority's view.
      - text: We are bound by the rigid rules of law, the laws are silent, and refusing him adds a punishment.
        correct: true
        why: >-
          Right: the slide's right-hand column — bound by the rigid rules established by the legislature, laws silent,
          and an additional punishment on the respondent.
      - text: The will was invalid because it was made while Elmer was still a minor living in the house.
        why: Nobody argued the will was invalid; it was made in due form and admitted to probate.
  - key: c09
    type: mcq
    concept: discretion-riggs-and-obligation
    difficulty: 3
    cases:
      - riggs-v-palmer
    stem: Why does the majority's reasoning in Riggs matter so much to Dworkin?
    options:
      - text: >-
          It shows judges setting aside positive law in favour of religion and morality whenever the result would be
          unjust to the family.
        why: >-
          The lecture says the judges are not looking at morality or religion as separate spheres; they find the
          principles within their own law.
      - text: >-
          It shows principles found within positive law, as maxims of the common law, that carry a clear moral
          dimension.
        correct: true
        why: >-
          Right: the judges deal with a valid statute and find principles of "natural law and justice" as maxims of the
          common law — law, with a moral dimension.
      - text: It shows that the rule of recognition in New York included an explicit moral test of legal validity.
        why: >-
          Dworkin's point is the opposite: the principles cannot be identified by any pedigree test such as a rule of
          recognition.
      - text: It shows that when the law runs out, judges must create new law by appeal to extra-legal standards.
        why: That is the Raz/realist reading Dworkin opposes; for him Riggs shows principles already in the law.
  - key: c10
    type: mcq
    concept: discretion-riggs-and-obligation
    difficulty: 3
    contrasts-with:
      - inclusive-and-exclusive-positivism
    cases:
      - riggs-v-palmer
    stem: >-
      Dworkin's key move offers two ways to treat principles in cases like Riggs. Which does the lecture say Raz, a hard
      positivist, adopts?
    options:
      - text: The judge reaches beyond the rules he is bound to apply for extra-legal principles, making new law.
        correct: true
        why: >-
          Right: the lecture says Raz (and next week's realists) think that when the law runs out judges find principles
          beyond the law and create new law.
      - text: Some principles are binding as law and must be taken into account by judges making legal decisions.
        why: This is the first option — the one Dworkin himself adopts — not Raz's.
      - text: Principles are binding as law only when a written constitution incorporates them by explicit reference.
        why: >-
          This is closer to inclusive positivism (Hart); Raz is an exclusive positivist who denies morality can be a
          condition of validity.
      - text: Principles are policies in disguise, so judges should weigh the community's goals, not justice.
        why: >-
          Neither option in the key move turns principles into policies; the choice is between legal and extra-legal
          principles.
  - key: c11
    type: mcq
    concept: discretion-riggs-and-obligation
    difficulty: 3
    stem: '"If we treat principles as law", what does Dworkin say follows for the positivists'' first two tenets (TRS 44)?'
    options:
      - text: Both survive, provided the rule of recognition is extended to list the principles.
        why: 'Dworkin says the rule of recognition cannot be adapted this way: no test of pedigree can capture principles.'
      - text: The first survives, but the second, judicial discretion, must be expanded to strong discretion.
        why: >-
          Reversed: treating principles as law makes strong discretion unnecessary; and the first tenet does not
          survive.
      - text: The master-rule tenet must be rejected, and discretion abandoned or clarified into triviality.
        correct: true
        why: >-
          Right: TRS 44 — reject the first tenet (a master rule), and "abandon the second tenet – the doctrine of
          judicial discretion – or clarify it into triviality".
      - text: Only the third tenet is affected, because obligations would come from principles, not rules.
        why: >-
          The third tenet is also challenged, but Dworkin says the first two go first; he then asks "What of the third
          tenet?"
  - key: c12
    type: mcq
    concept: discretion-riggs-and-obligation
    difficulty: 2
    stem: >-
      According to Dworkin, what does the positivist theory of legal obligation imply about a hard case, where no
      established rule can be found?
    options:
      - text: There is no legal obligation until the judge creates a new rule for the future.
        correct: true
        why: >-
          Right: TRS 44 — in a hard case "there is no legal obligation until the judge creates a new rule for the
          future."
      - text: There is a legal obligation, but it is imposed by a constellation of binding principles.
        why: >-
          This is Dworkin's own alternative, which he offers once strong discretion is abandoned, not the positivist
          implication.
      - text: There is a moral obligation only, which the judge must then enforce as law in the case.
        why: >-
          The positivist view described does not turn moral obligations into enforceable law; it says there is no legal
          obligation yet.
      - text: There is always an obligation, because the rule of recognition covers every possible case.
        why: >-
          Positivists accept that the law has gaps; that is why the second tenet says judges must sometimes exercise
          discretion.
  - key: c13
    type: mcq
    concept: discretion-riggs-and-obligation
    difficulty: 3
    stem: Why, according to the lecture, is the positivist answer about hard cases a problem for Dworkin?
    options:
      - text: Because it means judges must always follow the literal meaning of statutes, even in the hardest of cases.
        why: >-
          Literal reading is the Riggs minority's approach; the problem Dworkin sees is about when obligations come into
          existence.
      - text: Because it makes legal obligation depend on moral principles that differ from judge to judge.
        why: This describes Dworkin's own theory (as critics see it), not the positivist answer he finds troubling.
      - text: Because it treats every hard case as an easy case, ignoring the gaps and indeterminacy in law.
        why: >-
          The positivist view accepts gaps; it is Dworkin who, with the one-right-answer thesis, resists treating hard
          cases as open.
      - text: Because the parties came to court without any legal obligation existing; it is created in that moment.
        correct: true
        why: >-
          Right: the lecture says if judges create a new rule only when deciding the case, obligations did not exist
          when the parties showed up.
  - key: c14
    type: mcq
    concept: discretion-riggs-and-obligation
    difficulty: 2
    stem: >-
      Once strong discretion is abandoned and principles are treated as law, when does Dworkin say a legal obligation
      might exist?
    options:
      - text: Whenever the case supporting it, in terms of binding legal principles, is stronger than the case against it.
        correct: true
        why: >-
          Right: TRS 44 — an obligation "exists whenever the case supporting such an obligation, in terms of binding
          legal principles of different sorts, is stronger than the case against it".
      - text: >-
          Only when an established rule of law, identified by the rule of recognition, imposes that obligation on the
          party.
        why: This is the positivist third tenet that Dworkin is rejecting, not his alternative.
      - text: Whenever a majority of the community believes that the obligation would be morally required of them.
        why: Dworkin speaks of binding legal principles weighed in argument, not of majority moral belief in the community.
      - text: Only when the legislature has expressly stated a principle in the text of the relevant statute.
        why: >-
          Riggs shows principles found as maxims of the common law without express statutory statement; that is
          Dworkin's point.
  - key: c15
    type: mcq
    concept: discretion-riggs-and-obligation
    difficulty: 3
    cases:
      - riggs-v-palmer
    stem: >-
      The Riggs minority said refusing Elmer the inheritance would add a punishment. Why does the lecture say this point
      still matters for Dworkin, although it lost?
    options:
      - text: It proves that judges exercise strong discretion whenever they impose any penalty at all.
        why: The point is not about discretion; it is about what justifies coercion in a liberal theory of law.
      - text: It shows that punishment is a policy, and so it can never be part of legal reasoning.
        why: >-
          Dworkin does not exclude punishment from legal reasoning; the minority's point is about liberal limits on
          coercion.
      - text: It ties to his liberal view that law's point is to justify coercion; an ad hoc punishment would be illiberal.
        correct: true
        why: >-
          Right: the lecture says an extra punishment made up on the fly would be extremely illiberal, which ties to
          Dworkin's view that the legal system justifies coercion.
      - text: >-
          It shows that Dworkin agreed with the minority and thought that Riggs v Palmer was wrongly decided by the
          majority.
        why: >-
          Dworkin uses the majority's line of argument to build his theory; the lecture does not say he thought Riggs
          wrongly decided.
  - key: c16
    type: mcq
    concept: discretion-riggs-and-obligation
    difficulty: 3
    variant-of: c02
    stem: >-
      Scenario: a tribunal must refuse a licence if the applicant is "not a fit and proper person". Nobody can appeal
      its decision. Which kinds of discretion does the tribunal have, in Dworkin's terms?
    options:
      - text: Strong discretion, because the standard is vague and nobody can review the decision.
        why: >-
          Vagueness and finality are the two weak senses; neither frees the tribunal from the standard, so this is not
          strong discretion.
      - text: Only strong discretion, because the tribunal is simply not bound by the standard at all.
        why: The tribunal is bound by the "fit and proper" standard; strong discretion means being unbound on the issue.
      - text: No discretion at all, because the standard can be applied mechanically in every case.
        why: >-
          A standard like "fit and proper" cannot be applied mechanically and demands judgment, so there is at least
          weak discretion.
      - text: 'Both weak senses: the standard demands judgment, and the decision is final.'
        correct: true
        why: >-
          Right: judgment in applying a standard is the first weak sense and final unreviewable authority the second;
          neither is strong discretion.
  - key: c17
    type: truefalse
    concept: discretion-riggs-and-obligation
    difficulty: 1
    set: quickfire
    cases:
      - riggs-v-palmer
    statement: >-
      In Riggs v Palmer, Elmer Palmer murdered his grandfather by poisoning to prevent him revoking the provisions of
      his will.
    answer: true
    why: >-
      True: the slide says Elmer knew of the provisions and, to prevent his grandfather revoking them and to obtain
      speedy possession, wilfully murdered him by poisoning.
  - key: c18
    type: truefalse
    concept: discretion-riggs-and-obligation
    difficulty: 2
    set: quickfire
    statement: >-
      Dworkin argues that positivists, because they see law as a system of rules, are forced to accept that judges have
      strong discretion when no rule applies.
    answer: true
    why: >-
      True: the lecture says that for Dworkin positivists are forced to accept that judges need strong discretion when
      they find no rule that applies to the case at hand.
  - key: c19
    type: truefalse
    concept: discretion-riggs-and-obligation
    difficulty: 2
    set: quickfire
    cases:
      - riggs-v-palmer
    statement: >-
      For Dworkin, the principles cited in Riggs were extra-legal moral standards that the judges borrowed from outside
      the law.
    answer: false
    why: >-
      False: Dworkin stresses that the principles were found as maxims of the common law — within positive law — even
      though they have a clear moral dimension.
  - key: c20
    type: truefalse
    concept: discretion-riggs-and-obligation
    difficulty: 2
    statement: >-
      The lecture notes that some commentators accuse Dworkin of cherry-picking the cases he uses to support his
      argument.
    answer: true
    why: >-
      True: the lecture says some commentators argued Dworkin was cherry-picking particular judgments, while others
      pushed back — something to consider when reading Riggs.
  - key: d01
    type: mcq
    concept: inclusive-and-exclusive-positivism
    difficulty: 1
    set: pretest
    stem: What does inclusive (soft) legal positivism hold?
    options:
      - text: Every legal system necessarily makes morality a condition of legal validity.
        why: >-
          That would be a necessary connection between law and morality; inclusive positivists say only that particular
          systems may do so.
      - text: Particular systems may make moral criteria necessary or sufficient for validity, in that system only.
        correct: true
        why: >-
          Right: the slide — according to inclusive positivists (eg Hart) particular legal systems may make moral
          criteria necessary or sufficient for validity (in that system only).
      - text: >-
          Moral criteria can be neither sufficient nor necessary conditions for legal validity in any legal system at
          all, whatever its constitution says.
        why: This is exclusive (hard) positivism, associated with Raz, not the inclusive view.
      - text: Principles are law without any pedigree test, so validity is fixed by integrity.
        why: >-
          This is Dworkin's view, against which the inclusive/exclusive debate developed; it is not a form of
          positivism.
  - key: d02
    type: mcq
    concept: inclusive-and-exclusive-positivism
    difficulty: 1
    stem: What does exclusive (hard) legal positivism hold?
    options:
      - text: Moral criteria can be neither sufficient nor necessary conditions for legal validity.
        correct: true
        why: >-
          Right: the slide — according to exclusive positivists (eg Raz), moral criteria can be neither sufficient nor
          necessary conditions for legal validity.
      - text: Moral criteria may be necessary for validity, but only when a constitution includes them.
        why: 'This is the inclusive position (Hart): particular systems may make moral criteria conditions of validity.'
      - text: Only laws that pass a moral test are valid, so unjust statutes are not law at all.
        why: This is the strong lex iniusta reading from week 4, which both inclusive and exclusive positivists reject.
      - text: Legal validity is always decided by judges exercising strong discretion in each case.
        why: The debate is about whether morality can be a criterion of validity, not about discretion in every case.
  - key: d03
    type: mcq
    concept: inclusive-and-exclusive-positivism
    difficulty: 1
    stem: Which thinker does the slide give as an example of an inclusive legal positivist?
    options:
      - text: Joseph Raz
        why: Raz is the slide's example of an exclusive/hard positivist, not an inclusive one.
      - text: H.L.A. Hart
        correct: true
        why: >-
          Right: the slide says "Hart's Inclusive Legal Positivism"; he accepts that particular systems may make moral
          criteria conditions of validity.
      - text: Ronald Dworkin
        why: Dworkin is the critic whose objections started the debate; he is not a positivist of either kind.
      - text: John Finnis
        why: Finnis is a natural law theorist (week 4), not an inclusive positivist.
  - key: d04
    type: mcq
    concept: inclusive-and-exclusive-positivism
    difficulty: 2
    stem: Which passage from Hart's Postscript states what is usually called the social sources thesis?
    options:
      - text: '"…a theory of what law is which is both general and descriptive" (CL 239).'
        why: >-
          This is from the Postscript's first section on the nature of legal theory, not the social sources passage in
          the law and morality section.
      - text: '"In law as elsewhere, we can know and yet not understand" (Hart, 1953).'
        why: This is from Hart's 1953 inaugural lecture (week 1), not the Postscript's statement about social sources.
      - text: '"…a legal obligation exists when (and only when) an established rule of law imposes such an obligation."'
        why: This is Dworkin's statement of the positivist theory of obligation (TRS 44), not Hart's social sources thesis.
      - text: >-
          The existence and content of law can be identified by its social sources without reference to morality, except
          where the law has incorporated moral criteria (CL 269).
        correct: true
        why: >-
          Right: CL 269 is the social sources thesis, with the inclusive qualification that the law may itself
          incorporate moral criteria.
  - key: d05
    type: mcq
    concept: inclusive-and-exclusive-positivism
    difficulty: 1
    stem: Which examples of social sources of law does Hart give in the Postscript (CL 269)?
    options:
      - text: Legislation, judicial decisions, social customs.
        correct: true
        why: "Right: in the Postscript Hart says law can be identified by reference to its social sources, e.g. legislation, judicial decisions and social customs, without reference to morality (CL 269)."
      - text: Divine law, natural law, and human positive law.
        why: "Tempting because it is a list of sources of law, but divine, natural and human law is a natural law ordering; Hart's social sources are facts about practice, not moral standards."
      - text: Principles, policies, and the rules of a legal system.
        why: "Tempting because Dworkin argues about what counts as law, but principles, policies and rules are his kinds of standard, offered against positivism, not Hart's social sources."
      - text: Commands of the sovereign backed by threats of sanction.
        why: "Tempting because it is a famous account of law, but orders backed by threats are Austin's command theory (week 2); Hart rejects it because it cannot explain law's normativity."
  - key: d06
    type: mcq
    concept: inclusive-and-exclusive-positivism
    difficulty: 2
    stem: Which Postscript section comes first, and what does it restate?
    options:
      - text: Judicial Discretion — that judges must sometimes make new law when the rules run out.
        why: Judicial Discretion is the sixth and last section, not the first.
      - text: Law and Morality — that law can be identified by its social sources alone.
        why: Law and Morality is section 5, where the social sources passage (CL 269) appears.
      - text: The Nature of Legal Theory — that his theory is both general and descriptive.
        correct: true
        why: >-
          Right: section 1 is the nature of legal theory: "a theory of what law is which is both general and
          descriptive" (CL 239).
      - text: Principles and the Rule of Recognition — that principles can be listed by pedigree.
        why: This is section 4, and Hart does not claim principles can simply be listed by pedigree.
  - key: d07
    type: mcq
    concept: inclusive-and-exclusive-positivism
    difficulty: 2
    stem: According to the lecture, why did the debate between inclusive and exclusive legal positivism start?
    options:
      - text: Because Kelsen and Hart disagreed about whether the basic norm is a real rule of the system.
        why: >-
          The Grundnorm vs rule of recognition contrast is week 3 material; it is not what started the
          inclusive/exclusive debate.
      - text: Because the positivist camp recognised that Dworkin's criticisms of Hart had some merit.
        correct: true
        why: >-
          Right: the lecture says the arguments Dworkin developed were recognised by the positivist camp as having some
          merit, and "it all started because of Dworkin's criticisms".
      - text: Because Fuller showed that Nazi statutes failed the principles of legality and so were not law.
        why: Fuller's debate with Hart is week 4; the inclusive/exclusive split is a response to Dworkin.
      - text: Because the legal realists showed that judges ignore both rules and moral principles in practice.
        why: The realists are next week, and the lecture ties this debate to Dworkin, not to realism.
  - key: d08
    type: mcq
    concept: inclusive-and-exclusive-positivism
    difficulty: 3
    stem: >-
      Scenario: a constitution protects equality, and a court strikes down a statute that was passed by the correct
      procedure but is discriminatory. How would Hart, as an inclusive positivist, explain this?
    options:
      - text: >-
          It shows a necessary connection between law and morality, so legal positivism must now be abandoned
          altogether.
        why: Hart denies that this amounts to a necessary connection; it is something some systems have and others do not.
      - text: The statute was valid law all along; a court can never invalidate a law for moral reasons.
        why: >-
          Inclusive positivism allows exactly this: a system may make moral criteria conditions of validity through its
          sources.
      - text: The court exercised strong discretion, since equality is not a standard set by any authority.
        why: >-
          The equality principle was set by the constitution — a social source — so the court applied a standard; this
          is not strong discretion.
      - text: The social sources incorporated a moral criterion of validity in that system; the connection is contingent.
        correct: true
        why: >-
          Right: the lecture uses this example — morality enters via the legal sources, making substantive validity
          depend on it, as a contingent connection.
  - key: d09
    type: mcq
    concept: inclusive-and-exclusive-positivism
    difficulty: 3
    variant-of: d08
    stem: >-
      Same scenario: the constitution's equality principle invalidates a discriminatory statute. How would an exclusive
      positivist such as Raz describe it, according to the lecture?
    options:
      - text: >-
          Once incorporated into the law, a moral criterion becomes a legal criterion; morality is not a condition of
          validity.
        correct: true
        why: >-
          Right: the lecture says for Raz moral criteria are always beyond the law, because once incorporated they
          become legal criteria.
      - text: >-
          The equality principle is part of the law because it satisfies a moral test of justice that every valid law
          must pass.
        why: This makes morality a condition of validity, which exclusive positivism denies.
      - text: The statute was invalid because every unjust law is, by definition, not law at all.
        why: That is the strong lex iniusta reading, which positivists of both kinds reject.
      - text: The judges applied a policy, since equality is a goal the community wants to reach.
        why: The disagreement between inclusive and exclusive positivists is not about principles vs policies.
  - key: d10
    type: mcq
    concept: inclusive-and-exclusive-positivism
    difficulty: 2
    stem: >-
      In the lecture's constitutional example, the statute was passed by the correct procedure but struck down for its
      content. What kind of validity did it lack?
    options:
      - text: Formal validity, because the procedure itself was defective.
        why: The scenario says the statute was passed following the correct procedure, so formal validity is satisfied.
      - text: Substantive validity, because its content breached a constitutional principle.
        correct: true
        why: >-
          Right: the lecture contrasts formal validity (correct procedure) with substantive validity, which depends on
          content, such as respecting equality.
      - text: Moral validity only, which has no bearing on legal validity at all.
        why: >-
          In the example the constitutional principle affects legal validity; that is why it illustrates inclusive
          positivism.
      - text: Social validity, because too few citizens obeyed the statute.
        why: Efficacy among citizens is not the issue; the statute failed because of its content under the constitution.
  - key: d11
    type: mcq
    concept: inclusive-and-exclusive-positivism
    difficulty: 3
    contrasts-with:
      - discretion-riggs-and-obligation
    stem: Which statement best separates Dworkin's view from Hart's inclusive positivism?
    options:
      - text: Dworkin says morality can never affect validity; Hart says it always does.
        why: >-
          Both halves are wrong: Dworkin gives moral principles legal force, and Hart says morality affects validity
          only where incorporated.
      - text: Both agree principles are law, and disagree only about judicial discretion.
        why: >-
          They disagree about how principles are identified: by pedigree/social sources (Hart) or not by any pedigree
          test (Dworkin).
      - text: >-
          Dworkin: principles are law without any pedigree test. Hart: morality counts only where social sources
          incorporate it.
        correct: true
        why: >-
          Right: Dworkin says principles cannot be captured by a master rule; Hart's CL 269 lets morality in only where
          the law identified by social sources incorporates it.
      - text: >-
          Dworkin accepts the social sources thesis as stated at CL 269, while Hart himself goes on to reject that very
          thesis in his Postscript.
        why: >-
          Reversed: Hart states the social sources thesis in the Postscript (CL 269); Dworkin rejects a single test for
          law.
  - key: d12
    type: mcq
    concept: inclusive-and-exclusive-positivism
    difficulty: 2
    stem: What criticism of the inclusive/exclusive debate does the lecture mention?
    options:
      - text: That it turned legal philosophy into a very intramural discussion.
        correct: true
        why: >-
          Right: the lecture says the debate has been criticised by a number of authors as something that turned legal
          philosophy into a very intramural discussion.
      - text: That it was invented by Dworkin to make positivism look incoherent.
        why: The positivist camp developed it in response to Dworkin; he did not invent it.
      - text: That it ignored the social sources thesis entirely and so missed the point.
        why: The social sources thesis is at the centre of the debate; it was not ignored.
      - text: That it proved Hart had abandoned legal positivism in his Postscript.
        why: Hart's inclusive positivism is still positivism; the lecture does not say he abandoned it.
  - key: d13
    type: mcq
    concept: inclusive-and-exclusive-positivism
    difficulty: 2
    stem: Which statement about Hart's Postscript is accurate, according to the lecture?
    options:
      - text: >-
          Hart finished it as a complete reply to Dworkin and published it himself in the first edition of The Concept
          of Law in 1961.
        why: >-
          The Postscript appeared in the second edition after Hart's death, and it was unfinished; it was not in the
          1961 first edition.
      - text: >-
          It is only the first part of his response to critics, mostly Dworkin; its progression reads as a reply to
          Dworkin.
        correct: true
        why: >-
          Right: the lecture says Hart spent years on a response, mostly to Dworkin, did not finish it, and the
          Postscript's progression feels like the response to Dworkin.
      - text: It abandons the claim to a general and descriptive theory in favour of Dworkin's interpretive approach.
        why: The first section restates the general and descriptive aim (CL 239); Hart does not adopt Dworkin's approach.
      - text: It deals only with judicial discretion, leaving law and morality for a separate essay published later.
        why: Law and morality is section 5 of the Postscript, and judicial discretion is only its final short section.
  - key: d14
    type: mcq
    concept: inclusive-and-exclusive-positivism
    difficulty: 3
    variant-of: d01
    stem: Does Hart's inclusive positivism commit him to a necessary connection between law and morality?
    options:
      - text: 'Yes: once any system can incorporate morality, law and morality are necessarily connected.'
        why: >-
          Tempting, but the lecture says for Hart this does not amount to a necessary connection: it is a matter of what
          some systems have.
      - text: 'No: it is a contingent connection that some legal systems may have and others may not.'
        correct: true
        why: >-
          Right: the lecture says for Hart it is not a matter of concept or necessity — "just a contingent connection
          between law and morality".
      - text: 'Yes: the minimum content of natural law already makes the connection conceptual.'
        why: >-
          The minimum content (week 4) is a natural necessity, not a conceptual connection, and it is separate from the
          inclusive thesis.
      - text: 'No: inclusive positivism denies that morality can ever be a criterion of legal validity.'
        why: That is exclusive positivism; inclusive positivism allows moral criteria where a system incorporates them.
  - key: d15
    type: mcq
    concept: inclusive-and-exclusive-positivism
    difficulty: 3
    stem: >-
      A classmate says: "Raz is an exclusive positivist, so he thinks judges must ignore morality." What is the best
      correction from the lecture?
    options:
      - text: 'Correct: Raz thinks judges must decide every case by rules alone, and never use principles.'
        why: >-
          The lecture says Raz thinks that when the law runs out judges use principles found beyond the law; they do not
          ignore morality.
      - text: 'Wrong: Raz is an inclusive positivist, like Hart, so for him morality is part of the law.'
        why: "Wrong — Raz is the lecture's example of exclusive (hard) positivism; Hart is the inclusive positivist, for whom a particular system may make moral criteria conditions of validity."
      - text: 'Wrong: Raz holds that moral principles are law whenever they have enough weight in argument.'
        why: "Tempting because principles do carry weight, but the dimension of weight and principles binding as law is Dworkin's view; for Raz, judges reach beyond the law for principles when it runs out."
      - text: >-
          Wrong: Raz says morality is not a condition of legal validity, but judges may use extra-legal principles and
          make new law.
        correct: true
        why: >-
          Right: exclusive positivism is about validity; the lecture says Raz thinks judges reach beyond the law for
          principles when it runs out, creating new law.
  - key: d16
    type: truefalse
    concept: inclusive-and-exclusive-positivism
    difficulty: 1
    set: quickfire
    statement: According to the slide, Raz is an exclusive (hard) legal positivist and Hart an inclusive (soft) legal positivist.
    answer: true
    why: >-
      True: the slide names Hart as the example of inclusive/soft positivism and Raz as the example of exclusive/hard
