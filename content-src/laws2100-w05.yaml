  - key: f01
    type: mcq
    concept: law-as-integrity
    difficulty: 1
    stem: In what order do the three stages of Dworkin's constructive interpretation run?
    options:
      - text: Interpretive, pre-interpretive, post-interpretive.
        why: >-
          The pre-interpretive stage comes first: we identify the examples before asking what the point of the practice
          is.
      - text: Pre-interpretive, interpretive, post-interpretive.
        correct: true
        why: >-
          Right: the slide lists the pre-interpretive stage, the interpretive stage and the post-interpretive stage, in
          that order.
      - text: Post-interpretive, interpretive, pre-interpretive.
        why: This reverses the order; the post-interpretive stage is where we revisit the examples at the end.
      - text: Pre-interpretive, post-interpretive, interpretive.
        why: The interpretive stage — asking about the point of the practice — must come before revisiting the examples.
  - key: f02
    type: mcq
    concept: law-as-integrity
    difficulty: 2
    stem: In Dworkin's example of courtesy, what happens at the interpretive stage?
    options:
      - text: We list the actions usually associated with courtesy, like letting people go first or removing a hat.
        why: Listing the familiar examples is the pre-interpretive stage, which comes before interpretation proper.
      - text: 'We ask what the point of the practice of courtesy is: why people do these things.'
        correct: true
        why: >-
          Right: the lecture says once we have examples we try to understand the point of the practice — why people are
          doing these actions.
      - text: We revisit the examples and decide whether each is really an instance of courtesy.
        why: This is the post-interpretive stage, which uses the point identified at the interpretive stage.
      - text: We define courtesy per genus et differentiam, as a kind of social rule with distinguishing marks.
        why: The lecture says Dworkin does not proceed by a general definition or conceptual analysis of that kind.
  - key: f03
    type: mcq
    concept: law-as-integrity
    difficulty: 2
    stem: What happens at the post-interpretive stage of constructive interpretation?
    options:
      - text: We identify the examples we usually associate with the practice before asking about its purpose or value.
        why: That is the pre-interpretive stage; the post-interpretive stage comes after we know the point.
      - text: We give up the search for the practice's point, because every interpreter will see a different one.
        why: Dworkin does not give up on the point; the crucial moment of the circle is the question about the point.
      - text: We revisit the original examples in light of the point, deciding which really belong to the practice.
        correct: true
        why: >-
          Right: the lecture says that once we understand the point we go back and decide whether the examples really
          are instances of courtesy.
      - text: We apply the practice mechanically, since the point of the practice has now been fixed for all time.
        why: Interpretation is circular and ongoing, not a mechanical application of a fixed point.
  - key: f04
    type: mcq
    concept: law-as-integrity
    difficulty: 1
    stem: For Dworkin, what is the point of the legal system?
    options:
      - text: To justify the exercise of state coercion.
        correct: true
        why: >-
          Right: the lecture says for Dworkin, developing a liberal theory, the point of the legal system is to justify
          the exercise of state coercion.
      - text: To maximise the welfare of the community.
        why: This is the utilitarian answer from the ruling theory, which Dworkin rejects.
      - text: To secure the basic goods of human flourishing.
        why: >-
          This is closer to Finnis's understanding of the point of law, which the lecture says is different from
          Dworkin's.
      - text: To provide certainty through a master rule.
        why: >-
          Certainty through a rule of recognition belongs to Hart's account of structure, not to Dworkin's account of
          law's point.
  - key: f05
    type: mcq
    concept: law-as-integrity
    difficulty: 3
    stem: Why does the lecture say the question "what is the point of law?" is not important for Hart?
    options:
      - text: Because Hart thought law has no point at all and is simply a collection of arbitrary commands.
        why: >-
          Hart rejects the command theory; the lecture's point is that his conditions for a legal system do not mention
          a point, not that law is arbitrary.
      - text: Because Hart's conditions for a legal system concern its structure, not its purpose.
        correct: true
        why: >-
          Right: the lecture says Hart's minimum conditions — compliance with primary rules by citizens plus official
          acceptance of secondary rules — tell us nothing about the point.
      - text: 'Because Hart held that the point of law is obvious: it is to maximise the general happiness.'
        why: Hart does not rest his theory on the utilitarian point of law; he keeps the is and ought questions apart.
      - text: Because Hart accepted Finnis's answer and saw no need to repeat it in The Concept of Law.
        why: Finnis wrote after The Concept of Law and criticised Hart; Hart did not adopt his answer.
  - key: f06
    type: mcq
    concept: law-as-integrity
    difficulty: 1
    stem: 'On the slide, integrity means:'
    options:
      - text: Consistency in principle.
        correct: true
        why: "Right: for Dworkin integrity means consistency in principle: the principles of the system's political morality, not its structure, give the law its unity."
      - text: Honesty of individual judges in their private lives.
        why: >-
          Tempting because of the everyday sense of integrity, but Dworkin's law as integrity is about principle across
          the legal system.
      - text: Strict adherence to the literal text of statutes.
        why: "Tempting because it sounds faithful to law, but literal adherence to the text is the Riggs minority's approach; integrity reads law as coherent in principle across the system."
      - text: Loyalty to the rule of recognition of the legal system.
        why: >-
          Integrity is not loyalty to a master rule; for Dworkin it is principle, not structure, that unifies the
          system.
  - key: f07
    type: mcq
    concept: law-as-integrity
    difficulty: 2
    stem: How does the lecture present Dworkin's chain novel (LE 228)?
    options:
      - text: As an analogy Dworkin uses for how interpretation works in the legal context.
        correct: true
        why: >-
          Right: the lecture says when you see how Dworkin uses interpretation in the legal context, pay attention to
          the analogy of the chain novel.
      - text: As Finnis's objection that law is like fiction, so there is no one right answer.
        why: >-
          The chain novel is Dworkin's own analogy; Finnis's objection rests on incommensurability of fit and
          justification.
      - text: As a positivist image showing that each judge writes new law free of what came before.
        why: The chain novel is part of Dworkin's law as integrity, not a positivist image of strong discretion.
      - text: As a realist example proving that judicial reasoning is only storytelling after the fact.
        why: The chain novel belongs to Dworkin's interpretive theory; realism comes next week.
  - key: f08
    type: mcq
    concept: law-as-integrity
    difficulty: 1
    stem: Who is Judge Hercules?
    options:
      - text: A real New York judge who wrote the majority opinion in Riggs v Palmer.
        why: Hercules is not a real judge; LE 239 describes him as imaginary.
      - text: An imaginary judge of superhuman intellectual power and patience who accepts law as integrity.
        correct: true
        why: >-
          Right: LE 239 — "an imaginary judge of superhuman intellectual power and patience who accepts law as
          integrity".
      - text: Hart's ideal official, who accepts the rule of recognition from the internal point of view.
        why: Hercules is Dworkin's device, defined by acceptance of law as integrity, not Hart's official.
      - text: Finnis's model of the practically reasonable person, from whose viewpoint law is described.
        why: That is Finnis's viewpoint (week 4); Hercules is Dworkin's imaginary judge.
  - key: f09
    type: mcq
    concept: law-as-integrity
    difficulty: 1
    stem: Which two dimensions does Dworkin use to test interpretations (LE 255)?
    options:
      - text: Pedigree and discretion.
        why: These are two of the positivist tenets Dworkin attacks, not the dimensions of his own theory.
      - text: Validity and efficacy.
        why: Validity and efficacy are positivist and Kelsenian themes; Dworkin's dimensions are fit and justification.
      - text: Weight and importance.
        why: Weight/importance is what principles have in TRS, not the two dimensions of interpretation in Law's Empire.
      - text: Fit and justification.
        correct: true
        why: >-
          Right: the slide — "Dimension of fit + Dimension of justification (LE 255)"; Hercules finds the right answer
          in their light.
  - key: f10
    type: mcq
    concept: law-as-integrity
    difficulty: 2
    stem: What is Dworkin's "one-right-answer" thesis?
    options:
      - text: Easy cases have one correct answer, but hard cases leave the judge free to choose.
        why: This is the positivist view of hard cases (strong discretion) that the thesis denies.
      - text: Even in hard cases there is only one correct legal answer, because of principles.
        correct: true
        why: >-
          Right: the lecture says even in hard cases there is only one correct legal answer, and the reason is the
          existence of principles.
      - text: Each legal system has exactly one right rule of recognition, identified by officials.
        why: That concerns Hart's theory of the system; the thesis is about answers to legal questions in cases.
      - text: Only one theory of law — Dworkin's own — can give the right answer about law's nature.
        why: The thesis is about the answers to legal cases, not about which jurisprudential theory is right.
  - key: f11
    type: mcq
    concept: law-as-integrity
    difficulty: 3
    variant-of: f10
    stem: >-
      On what basis does Finnis, in 'On reason and authority in Law's Empire' (1987), push against the one-right-answer
      thesis, according to the lecture?
    options:
      - text: That principles cannot be identified by pedigree, so judges cannot find them at all.
        why: That is Dworkin's own argument against Hart, not Finnis's objection to the thesis.
      - text: That the dimensions of fit and justification are incommensurable.
        correct: true
        why: >-
          Right: the lecture says Finnis pushes back with arguments based on incommensurability between the two
          dimensions of fit and justification.
      - text: That law has no point, so no interpretation can be better than any other.
        why: Finnis insists law has a point; his argument concerns incommensurability, not pointlessness.
      - text: That the internal point of view is irrelevant to understanding law at all.
        why: >-
          Finnis uses his own version of the internal point of view; his objection to Dworkin is about
          incommensurability.
  - key: f12
    type: mcq
    concept: law-as-integrity
    difficulty: 3
    contrasts-with:
      - laws2100-w03-primary-and-secondary-rules
    stem: >-
      According to the lecture, what gives a legal system its unity for Kelsen or Hart, and what gives it unity for
      Dworkin?
    options:
      - text: 'Kelsen/Hart: its structure. Dworkin: principles and integrity.'
        correct: true
        why: >-
          Right: the lecture says for authors like Kelsen or Hart it is the structure of the system; for Dworkin it is
          principles — the political morality — and integrity.
      - text: 'Kelsen/Hart: shared morality. Dworkin: the rule of recognition.'
        why: >-
          Reversed and wrong: Dworkin attacks the rule of recognition, and Kelsen and Hart do not rest unity on shared
          morality.
      - text: 'Kelsen/Hart: coercion by a sovereign. Dworkin: policies.'
        why: Sovereign coercion is Austin's picture, and Dworkin grounds unity in principles, not policies.
      - text: 'Kelsen/Hart: principles. Dworkin: the union of primary and secondary rules.'
        why: 'This swaps the theorists: the union of rules is Hart''s structure, and principles are Dworkin''s answer.'
  - key: f13
    type: mcq
    concept: law-as-integrity
    difficulty: 3
    stem: >-
      Law as integrity may work for a healthy liberal constitutional democracy. What question does the lecture say evil
      legal systems, such as apartheid South Africa, raise?
    options:
      - text: Whether evil systems have a rule of recognition, since officials there did not accept one.
        why: >-
          The lecture's question is not about the rule of recognition; it is about which principles could give an evil
          system unity.
      - text: Whether judges in evil systems have strong discretion, since their law gives no answers.
        why: Discretion is not the issue raised here; the issue is the generality of law as integrity.
      - text: Whether Dworkin's theory is really general jurisprudence or only particular jurisprudence.
        correct: true
        why: >-
          Right: the lecture asks what principles give unity to a racist regime, which raises whether law as integrity
          is general or particular jurisprudence.
      - text: Whether evil systems pass Fuller's eight principles of legality and so count as law.
        why: Fuller's principles are week 4; the lecture's question here is about the scope of Dworkin's theory.
  - key: f14
    type: mcq
    concept: law-as-integrity
    difficulty: 2
    variant-of: f13
    stem: The lecture says Dworkin was American, and "for many people, that's an important detail". Why?
    options:
      - text: Because American law does not recognise principles, so his theory was designed as a critique of it.
        why: Dworkin draws principles from American cases like Riggs; the point is not that US law lacks them.
      - text: Because Americans cannot hold chairs at Oxford, so his appointment was controversial.
        why: Hart supported his election at Oxford; nothing in the lecture suggests nationality was a bar.
      - text: Because he wrote only about the US Constitution and never discussed Hart's British theory.
        why: Dworkin's early work is an extended critique of Hart; he engaged directly with Hart's theory.
      - text: Because some argue his theory makes sense for a system like the US, not as a general explanation of law.
        correct: true
        why: >-
          Right: the lecture says some argued his theory made sense in the context of the US, not necessarily as a
          general explanation of what law is.
  - key: f15
    type: mcq
    concept: law-as-integrity
    difficulty: 2
    stem: The lecture compares Dworkin's understanding of interpretation to which tradition in philosophy?
    options:
      - text: Conceptual analysis by necessary and sufficient conditions.
        why: The lecture says Dworkin does not do conceptual analysis of that kind for courtesy or law.
      - text: Hermeneutics, the interpretation of texts and practices.
        correct: true
        why: >-
          Right: the lecture says Dworkin's understanding of interpretation is very similar to the way philosophy
          discusses hermeneutics, with its circular understanding.
      - text: Utilitarianism, the calculation of the general welfare.
        why: Utilitarianism is part of the ruling theory Dworkin rejects, not a model for interpretation.
      - text: Empirical sociology, the observation of official behaviour.
        why: Dworkin takes the participant's point of view, not the observer's, so the analogy is hermeneutics.
  - key: f16
    type: mcq
    concept: law-as-integrity
    difficulty: 3
    variant-of: f10
    stem: Who, according to the lecture, pushes against Dworkin's one-right-answer thesis?
    options:
      - text: Only the legal positivists, because they believe that judges have strong discretion in hard cases.
        why: 'Positivists do reject it, but the lecture says they are not alone: realists and Finnis push back too.'
      - text: Only Finnis, since both positivists and realists accept the existence of right answers in law.
        why: The lecture says positivists and, even more strongly, realists reject the thesis, and Finnis also pushes back.
      - text: The positivists, the realists (even more strongly), and even Finnis, although he is not a positivist.
        correct: true
        why: >-
          Right: the lecture says the positivists pushed against it, the realists pushed even more strongly, and even
          Finnis, who is clearly not a positivist, pushes back.
      - text: 'Nobody: the thesis is widely accepted, and the only debate is whether Hercules really exists.'
        why: The lecture calls it one of Dworkin's most controversial theories; Hercules is openly imaginary.
  - key: f17
    type: truefalse
    concept: law-as-integrity
    difficulty: 1
    set: quickfire
    statement: Dworkin's example for explaining constructive interpretation is the practice of courtesy.
    answer: true
    why: >-
      True: the slide on constructive interpretation says "Dworkin's example: the practice of courtesy", used to show
      the three stages of interpretation.
  - key: f18
    type: truefalse
    concept: law-as-integrity
    difficulty: 1
    set: quickfire
    statement: Judge Hercules is a real judge whose opinions Dworkin studied in Law's Empire.
    answer: false
    why: >-
      False: LE 239 calls Hercules "an imaginary judge of superhuman intellectual power and patience who accepts law as
      integrity".
  - key: f19
    type: truefalse
    concept: law-as-integrity
    difficulty: 2
    set: quickfire
    statement: For Dworkin, the point of the legal system is to justify the exercise of state coercion.
    answer: true
    why: >-
      True: the lecture says that for Dworkin, developing a liberal theory of law, the point of the legal system is to
      justify the exercise of state coercion.
  - key: f20
    type: truefalse
    concept: law-as-integrity
    difficulty: 2
    statement: Finnis accepts Dworkin's one-right-answer thesis because both reject legal positivism.
    answer: false
    why: >-
      False: the lecture says Finnis agrees with some of Dworkin's criticisms of positivism but pushes against the
      one-right-answer thesis, on the incommensurability of fit and justification.
  - key: s01
    type: short
    concept: ruling-theory-and-three-tenets
    difficulty: 3
    contrasts-with:
      - laws2100-w04-finnis-central-case-method
    prompt: >-
      "For Dworkin, a general theory of law must be normative as well as conceptual." Does this claim defeat Hart's aim
      of a theory that is general and descriptive?
    model: >-
      Not by itself: it is a rival claim about legal theory that Hart answers, not a refutation. Dworkin says the ruling
      theory joins positivism (what law is) to utilitarianism (what law ought to be) and wrongly assumes the two are
      independent; a general theory must be normative as well as conceptual. His argument is Hart's own strategy against
      Austin: a descriptive theory fails if it cannot explain features of our law — in Taking Rights Seriously,
      principles with a moral dimension that no test of pedigree captures. Against this, Hart restates in the Postscript
      that his theory is general and descriptive (CL 239) and holds that law can be identified by social sources,
      bringing morality in only where the sources incorporate it (CL 269). Finnis also rejects the is/ought separation,
      but for different reasons. On balance the claim puts real pressure on "descriptive" only if Dworkin's
      counterexamples succeed; the essay should assess them, not assume the conclusion.
    rubric:
      - id: r1
        criterion: Thesis — takes a position on whether Dworkin's claim defeats Hart's general and descriptive aim.
        marks: 2
        top-band: >-
          States a qualified thesis in the first sentence: a rival metatheoretical claim whose force depends on the
          counterexamples.
        margin-note: Defeat, or pressure? Say which.
        authorities: []
      - id: r2
        criterion: >-
          Argument — explains the ruling theory, the independence assumption, and the strategy of the counterexample
          from principles.
        marks: 3
        top-band: Names both parts of the ruling theory and links principles to the failure of the pedigree test.
        margin-note: Good use of the ruling theory.
        authorities:
          - dworkin-taking-rights-seriously
      - id: r3
        criterion: Counterargument — presents Hart's Postscript reply (CL 239, CL 269).
        marks: 3
        top-band: >-
          Quotes or closely paraphrases the general and descriptive aim and the social sources thesis with its
          exception.
        margin-note: Hart's own words would help here.
        authorities:
          - hart-the-concept-of-law
      - id: r4
        criterion: Evaluation — weighs the two and distinguishes Dworkin's route from Finnis's.
        marks: 2
        top-band: >-
          Notes that Dworkin and Finnis reject the is/ought separation for different reasons, and makes the verdict
          depend on the counterexamples.
        margin-note: Why does Finnis matter to your verdict?
        authorities: []
  - key: s02
    type: short
    concept: rules-principles-and-policies
    difficulty: 3
    prompt: Is Dworkin's distinction between rules and principles a sound basis for rejecting Hart's rule of recognition?
    model: >-
      Largely yes, if the distinction holds in practice. Dworkin says the difference is "a logical distinction": rules
      apply in an all-or-nothing fashion, while principles state a reason that argues in one direction and have the
      dimension of weight. Two conflicting rules cannot both apply; conflicting principles are balanced, and the
      outweighed principle remains law. A principle is observed because it is a requirement of justice or fairness,
      unlike a policy, which sets a goal. Because principles cannot be identified by pedigree, a master rule of
      recognition cannot capture them, and the rule of recognition cannot simply be modified to embrace them. The
      counterargument is Dworkin's own concession that it is not always clear from the form of a standard whether it is
      a rule or a principle; the positivist can also say principles like those in Riggs are extra-legal, as Raz does. On
      balance the distinction works only if we accept, from how judges reason, that principles are legal — so the
      argument turns on the internal point of view of lawyers and judges.
    rubric:
      - id: r1
        criterion: Thesis — answers whether the distinction justifies rejecting the rule of recognition.
        marks: 2
        top-band: Gives a clear, conditioned answer in the opening sentence.
        margin-note: Sound basis — yes or no?
        authorities: []
      - id: r2
        criterion: Argument — sets out all-or-nothing vs weight, conflict behaviour, and principle vs policy.
        marks: 3
        top-band: >-
          Uses TRS 22 and 24 accurately, including the example of automobile accidents vs no man profiting by his own
          wrong.
        margin-note: Good — the conflict test is the clearest evidence.
        authorities:
          - dworkin-taking-rights-seriously
      - id: r3
        criterion: Counterargument — uses the form-of-standard concession and the extra-legal reading of principles (Raz).
        marks: 3
        top-band: Presents the positivist reply that the principles judges cite may lie beyond the law.
        margin-note: This is the positivist's best move.
        authorities: []
      - id: r4
        criterion: Evaluation — locates the decisive question (whether principles are legal) and resolves it.
        marks: 2
        top-band: Explains why the internal point of view of judges decides whether principles are law.
        margin-note: What finally tips the balance?
        authorities: []
  - key: s03
    type: short
    concept: discretion-riggs-and-obligation
    difficulty: 3
    cases:
      - riggs-v-palmer
    prompt: Did the judges in Riggs v Palmer exercise strong discretion? Answer using Dworkin's account of discretion.
    model: >-
      No, on Dworkin's account they exercised at most weak discretion. Discretion, like the hole in a doughnut, exists
      only as an area left open by a surrounding belt of restriction. Weak discretion means the standards demand
      judgment, or that an official has final authority; strong discretion means the official is simply not bound by
      standards on the issue. In Riggs the statutes, literally construed, gave the property to the murderer, but the
      majority relied on a canon of construction and on fundamental maxims of the common law — no one shall profit by
      his own wrong. These principles were found within positive law, so the judges were bound by standards and needed
      judgment in weighing them. The positivist counterargument is that the maxims are extra-legal, so the judges
      reached beyond the law and made a new rule, creating an obligation that did not exist before. On balance the
      judgment's own language — maxims of the common law — supports Dworkin, although critics say he cherry-picks such
      cases.
    rubric:
      - id: r1
        criterion: Thesis — states whether the Riggs judges exercised strong or weak discretion.
        marks: 2
        top-band: Commits to weak discretion (or argues the contrary) in the first sentence.
        margin-note: Strong or weak? Commit.
        authorities: []
      - id: r2
        criterion: Argument — defines weak and strong discretion and applies them to the majority's reasoning.
        marks: 3
        top-band: Uses the doughnut, both weak senses, and the maxims of the common law.
        margin-note: Nice application of the definitions.
        authorities:
          - dworkin-taking-rights-seriously
      - id: r3
        criterion: 'Counterargument — presents the positivist reading: extra-legal principles and a new rule for the future.'
        marks: 3
        top-band: Explains the consequence for obligation (none until the judge creates the rule) and the minority's view.
        margin-note: Bring in the minority opinion here.
        authorities: []
      - id: r4
        criterion: Evaluation — resolves using the judgment's own language, noting the cherry-picking critique.
        marks: 2
        top-band: Weighs the evidence of the judgment against the worry that Dworkin chose convenient cases.
        margin-note: Is one case enough?
        authorities: []
  - key: s04
    type: short
    concept: inclusive-and-exclusive-positivism
    difficulty: 3
    contrasts-with:
      - discretion-riggs-and-obligation
    prompt: Does inclusive legal positivism answer Dworkin's challenge from principles?
    model: >-
      Partly: it answers the challenge where principles are incorporated by social sources, but not where they are not.
      Dworkin argues that principles cannot be identified by pedigree, so Hart's rule of recognition cannot capture
      them. Hart's Postscript, which reads as a reply to Dworkin, states that law can be identified by social sources —
      legislation, judicial decisions, social customs — without reference to morality, "except where the law thus
      identified has itself incorporated moral criteria" (CL 269). Inclusive positivism therefore allows a
      constitution's equality principle to make substantive validity depend on morality, as a contingent connection in
      that system only. The counterargument comes from both sides. Dworkin's Riggs principles were not enacted anywhere:
      they were maxims of the common law, so it is unclear which source incorporated them. And Raz's exclusive
      positivism says moral criteria can be neither necessary nor sufficient for validity, since once incorporated they
      become legal criteria. On balance inclusive positivism shows positivism can make room for morality, but not that
      it can explain all of Dworkin's principles.
    rubric:
      - id: r1
        criterion: Thesis — takes a position on whether inclusive positivism answers Dworkin.
        marks: 2
        top-band: States a qualified thesis (answers the incorporated cases only) at the outset.
        margin-note: Answers it fully, or in part?
        authorities: []
      - id: r2
        criterion: Argument — explains the social sources thesis and the inclusive position with an example.
        marks: 3
        top-band: Quotes CL 269 and uses the constitutional equality example with formal vs substantive validity.
        margin-note: Good use of CL 269.
        authorities:
          - hart-the-concept-of-law
      - id: r3
        criterion: Counterargument — raises the unincorporated principles in Riggs and Raz's exclusive position.
        marks: 3
        top-band: Explains why common law maxims strain the incorporation model and states Raz's view precisely.
        margin-note: Which source incorporated the Riggs maxim?
        authorities:
          - dworkin-taking-rights-seriously
      - id: r4
        criterion: Evaluation — reaches a reasoned verdict on how far positivism survives.
        marks: 2
        top-band: Concludes by separating "room for morality" from "explains principles".
        margin-note: Clear verdict — well done.
        authorities: []
  - key: s05
    type: short
    concept: theoretical-disagreement
    difficulty: 3
    cases:
      - riggs-v-palmer
    prompt: Can Hart's theory explain theoretical disagreement about law?
    model: >-
      Dworkin argues it cannot; the stronger view is that the argument is powerful but not decisive. In Law's Empire
      lawsuits raise issues of fact, law, and political morality, and theoretical disagreement concerns what the
      pertinent law is — as when judges in Riggs disagreed about Elmer's entitlement although the statute's text was
      clear. Legal practice is argumentative, and Dworkin takes up the participants' point of view (LE 14). On the
      lecture's reconstruction, Hart's rule of recognition exists because officials converge in accepting it; if judges
      agree on the criteria of validity, they should be able to identify the content of the law, so we should never see
      theoretical disagreements. Against this, Hart himself discusses disagreement among officials in the pathology of a
      legal system, and the lecturer warns that we must see the argument without assuming Dworkin is right. On balance
      the challenge exposes a real tension between agreement on criteria and disagreement on content, but it needs
      showing that such disagreement goes to the criteria themselves.
    rubric:
      - id: r1
        criterion: Thesis — answers whether Hart can explain theoretical disagreement.
        marks: 2
        top-band: States a clear, qualified position rather than reporting Dworkin's view only.
        margin-note: Your view, not just Dworkin's.
        authorities: []
      - id: r2
        criterion: >-
          Argument — explains the three issues, theoretical disagreement in Riggs, and the agreement premise of the rule
          of recognition.
        marks: 3
        top-band: Uses LE 3 and LE 14 and sets out the "agree on criteria, disagree on content" dilemma.
        margin-note: The dilemma is well put.
        authorities:
          - dworkin-laws-empire
      - id: r3
        criterion: Counterargument — uses Hart's pathology discussion and the lecturer's caution.
        marks: 3
        top-band: >-
          Shows that Hart anticipated official disagreement and asks whether Riggs is disagreement about criteria at
          all.
        margin-note: Did Hart already allow for this?
        authorities:
          - hart-the-concept-of-law
      - id: r4
        criterion: Evaluation — identifies what Dworkin must show to win.
        marks: 2
        top-band: Pinpoints the level (criteria vs content) at which the disagreement must occur.
        margin-note: Sharp evaluation.
        authorities: []
  - key: s06
    type: short
    concept: law-as-integrity
    difficulty: 3
    contrasts-with:
      - theoretical-disagreement
    prompt: Is Dworkin's law as integrity a general theory of law, or only a particular one?
    model: >-
      It is better read as a theory with particular roots that claims generality it struggles to earn. Dworkin builds
      his theory on constructive interpretation: pre-interpretive examples, the point of the practice, then
      post-interpretive revision. For him, the point of the legal system is to justify the exercise of state coercion —
      a liberal answer — and integrity, consistency in principle, gives the system its unity, as tested on the
      dimensions of fit and justification by Judge Hercules. That picture may work for a healthy liberal constitutional
      democracy. The counterargument is the evil legal system: what principles give unity to a racist regime such as
      apartheid South Africa? Some argue that the theory made sense for the United States rather than as a general
      explanation of law — a question of general versus particular jurisprudence. Finnis adds that fit and justification
      are incommensurable, weakening the one-right-answer thesis. On balance integrity explains an argumentative,
      rights-protecting practice well, but its generality depends on finding a point for law that evil systems share.
    rubric:
      - id: r1
        criterion: Thesis — decides whether law as integrity is general or particular jurisprudence.
        marks: 2
        top-band: Takes a clear side, qualified, in the first sentence.
        margin-note: General or particular — choose.
        authorities: []
      - id: r2
        criterion: Argument — explains constructive interpretation, the point of law, integrity, and fit and justification.
        marks: 3
        top-band: Links the liberal point of law to integrity and uses Hercules accurately (LE 239, 255).
        margin-note: Clear account of the theory.
        authorities:
          - dworkin-laws-empire
      - id: r3
        criterion: Counterargument — raises evil legal systems, the "American" objection, and Finnis on incommensurability.
        marks: 3
        top-band: Uses apartheid South Africa and the general/particular distinction from week 1.
        margin-note: Good — the evil-system objection is the key test.
        authorities:
          - finnis-on-reason-and-authority-in-laws-empire
      - id: r4
        criterion: Evaluation — states what would make the theory general and whether it succeeds.
        marks: 2
        top-band: Makes the verdict turn on whether law has a point shared by evil systems.
        margin-note: What would have to be true for it to be general?
        authorities: []
