  - key: e01
    type: mcq
    concept: theoretical-disagreement
    difficulty: 1
    set: pretest
    stem: According to Law's Empire (p 3), which three kinds of issues do lawsuits always raise, at least in principle?
    options:
      - text: Issues of rules, issues of principles, and issues of policies.
        why: >-
          Tempting because these are Dworkin's three standards from Taking Rights Seriously, but LE 3 lists fact, law,
          and political morality and fidelity.
      - text: Issues of fact, issues of law, and the twinned issues of political morality and fidelity.
        correct: true
        why: 'Right: LE 3 — "issues of fact, issues of law, and the twinned issues of political morality and fidelity."'
      - text: Issues of pedigree, issues of discretion, and issues of legal obligation.
        why: These echo the three positivist tenets from The Model of Rules I, not the three issues in Law's Empire.
      - text: Issues of validity, issues of efficacy, and issues of the internal point of view.
        why: >-
          These are Hartian and Kelsenian themes; Dworkin's three issues in LE 3 are fact, law, and political morality
          and fidelity.
  - key: e02
    type: mcq
    concept: theoretical-disagreement
    difficulty: 1
    stem: Dworkin calls one kind of disagreement "theoretical". Which question does it concern?
    options:
      - text: What happened?
        why: This question generates empirical disagreement about the facts, not theoretical disagreement.
      - text: What is the pertinent law?
        correct: true
        why: 'Right: the slide pairs "What is the pertinent law?" with "theoretical" disagreement about the law.'
      - text: If the law denies compensation, is that unjust?
        why: This is the moral question, which generates moral disagreement, not theoretical disagreement.
      - text: Which party can afford the better lawyers?
        why: This is not one of Dworkin's three questions; his list is fact, law, and political morality.
  - key: e03
    type: mcq
    concept: theoretical-disagreement
    difficulty: 1
    stem: Which kind of disagreement does the question "If the law denies compensation, is that unjust?" produce?
    options:
      - text: Theoretical disagreement about the law.
        why: Theoretical disagreement concerns what the pertinent law is, not whether the law, once identified, is just.
      - text: Empirical disagreement about the facts.
        why: >-
          Empirical disagreement concerns what happened, such as competing versions of the facts and the burden of
          proof.
      - text: Moral disagreement.
        correct: true
        why: >-
          Right: the slide pairs the third question — is it unjust? — with moral disagreement; people with different
          moral views reach different conclusions.
      - text: Semantic disagreement about the word "law".
        why: >-
          Dworkin's list here is empirical, theoretical and moral; semantic disagreement is a week 1 idea, not one of
          these three.
  - key: e04
    type: mcq
    concept: theoretical-disagreement
    difficulty: 2
    stem: Dworkin uses the term "fidelity" in LE 3. Where, according to the lecture, have we met that term before?
    options:
      - text: In Kelsen's account of the basic norm as a presupposition of legal validity.
        why: The basic norm is week 3 material; the lecture links "fidelity" to Fuller, not to Kelsen.
      - text: In Austin's account of the habit of obedience owed by subjects to their sovereign.
        why: Obedience and fidelity are different ideas; the lecture points back to Fuller's exchange with Hart.
      - text: In Fuller's reply to Hart, which said Hart should make fidelity to law meaningful.
        correct: true
        why: >-
          Right: the lecture recalls Fuller arguing, in the Harvard Law Review exchange, that Hart should think more
          about fidelity to law in defining law.
      - text: In Finnis's list of basic goods, where fidelity is one of the forms of human flourishing.
        why: The lecture does not link Dworkin's term to Finnis's basic goods; it links it to Fuller.
  - key: e05
    type: mcq
    concept: theoretical-disagreement
    difficulty: 2
    cases:
      - riggs-v-palmer
    stem: In Law's Empire, what is the disagreement in Riggs v Palmer an example of?
    options:
      - text: Judges disagreeing about what the law is, although the text of the statute is clear.
        correct: true
        why: >-
          Right: the slide asks "How can judges disagree about what the law is, if the text of the statute is clear?" —
          a theoretical disagreement about law.
      - text: Judges disagreeing about the facts, since it was unclear whether Elmer poisoned his grandfather.
        why: The facts were not in dispute; the slides say he wilfully murdered his grandfather by poisoning.
      - text: Judges agreeing about the law, but disagreeing whether the law was morally just.
        why: >-
          That would be moral disagreement; Dworkin's point is that the judges disagreed about what the law itself
          required.
      - text: Judges disagreeing whether the will was made in due form and admitted to probate correctly.
        why: The will's formal validity was accepted; the dispute was about Elmer's legal entitlement under it.
  - key: e06
    type: mcq
    concept: theoretical-disagreement
    difficulty: 3
    cases:
      - riggs-v-palmer
    stem: Which two reasons does the slide give for reading the will statutes in Riggs in light of principles of justice?
    options:
      - text: Legislators exercise strong discretion; and judges must fill every gap in the law with policy.
        why: >-
          Neither reason appears: Dworkin rejects strong discretion, and the slide's reasons concern legislative
          intention and coherence.
      - text: The murderer had already been punished; and a further penalty would be unconstitutional in New York.
        why: The additional punishment point comes from the minority, who would have let Elmer inherit.
      - text: The will was invalid in form; and the heirs had a moral right that pre-existed legislation.
        why: The will was made in due form, and the slide's two reasons are about how to interpret the statute.
      - text: >-
          Legislators have a general and diffuse intention to respect justice; and the system should be coherent in
          principle.
        correct: true
        why: >-
          Right: the slide gives (1) a general and diffuse legislative intention to respect traditional principles of
          justice and (2) interpreting the statute to make the system coherent in principle.
  - key: e07
    type: mcq
    concept: theoretical-disagreement
    difficulty: 1
    stem: According to Dworkin, how does legal practice differ from many other social phenomena?
    options:
      - text: It is governed by rules.
        why: >-
          Tempting because rules matter to Hart, but chess, football and etiquette are also rule-governed; Dworkin's
          distinctive feature is argument.
      - text: It is argumentative.
        correct: true
        why: 'Right: the slide says legal practice (unlike many other social phenomena) is argumentative.'
      - text: It is backed by coercion.
        why: >-
          Coercion matters to Dworkin's account of law's point, but the slide's contrast with other social practices is
          about argument.
      - text: It is a set of brute facts.
        why: >-
          The lecture says law is a social phenomenon, but not one of brute facts; Dworkin thinks Austin tried to
          analyse it that way.
  - key: e08
    type: mcq
    concept: theoretical-disagreement
    difficulty: 2
    stem: Which point of view does Law's Empire take up (LE 14)?
    options:
      - text: The external observer's, recording regularities in how judges decide cases.
        why: LE 14 explicitly takes up the internal perspective; the external view is the one Dworkin sets aside.
      - text: The internal, participants' point of view, studying legal argument from the judge's viewpoint.
        correct: true
        why: >-
          Right: LE 14 — "This book takes up the internal, participants' point of view … We will study formal legal
          argument from the judge's viewpoint".
      - text: The legislator's point of view, choosing policies to improve the community.
        why: Dworkin focuses on adjudication and legal argument, not legislative choice of policies.
      - text: The ordinary citizen's point of view, deciding whether to obey the law.
        why: >-
          Citizens can take an internal view, but LE 14 studies formal legal argument from the judge's viewpoint, as a
          participant in the practice.
  - key: e09
    type: mcq
    concept: theoretical-disagreement
    difficulty: 3
    stem: How does the lecture reconstruct Dworkin's argument that theoretical disagreement is a problem for Hart?
    options:
      - text: The rule of recognition is written down in a constitution, so judges can never disagree about the law.
        why: Hart's rule of recognition need not be written anywhere; its existence is a matter of official practice.
      - text: Hart says judges have strong discretion, so disagreement shows they are not bound by any law.
        why: The argument turns on the rule of recognition's dependence on official agreement, not on discretion.
      - text: >-
          The rule of recognition exists through officials' agreement; how can they agree on criteria yet disagree on
          content?
        correct: true
        why: >-
          Right: the lecture says the rule of recognition depends on convergence among officials, so if Hart is right we
          should never see theoretical disagreements.
      - text: Theoretical disagreements are really moral disagreements, which Hart's descriptive theory cannot recognise.
        why: >-
          Dworkin separates theoretical from moral disagreement; his claim is that disagreement about the law itself is
          what Hart cannot explain.
  - key: e10
    type: mcq
    concept: theoretical-disagreement
    difficulty: 2
    stem: The lecture contrasts theoretical disagreement with disagreement in an easy case. What happens in the easy case?
    options:
      - text: A layperson thinks the law requires one thing, an expert corrects them, and one of them is simply wrong.
        correct: true
        why: >-
          Right: the lecture says in easy cases one interpreter is right — a layperson is corrected by an expert —
          whereas theoretical disagreement is reasonable disagreement among judges.
      - text: Two judges who both know the law reasonably disagree about what the law requires in the case.
        why: This describes theoretical disagreement, the case the lecture sets against the easy case.
      - text: Judges agree on the law but disagree on whether that law is just, so it is moral disagreement.
        why: That is moral disagreement, which is a third category, not the lecture's easy-case contrast.
      - text: There can be no disagreement at all, because the facts clearly fall within the antecedent of a rule.
        why: The lecture allows disagreement in easy cases; it is solved because one side is right and the other wrong.
  - key: e11
    type: mcq
    concept: theoretical-disagreement
    difficulty: 2
    stem: How, according to Hart as the lecture explains him, do we identify the rule of recognition of a legal system?
    options:
      - text: By finding the written provision in the constitution that lists the sources of law.
        why: >-
          The lecture says the rule of recognition is not something necessarily written somewhere, unlike an ordinary
          law.
      - text: By presupposing it as a transcendental condition of the chain of validity, like the Grundnorm.
        why: >-
          This is Kelsen's basic norm; for Hart the rule of recognition is a real rule of the system, not a
          presupposition.
      - text: By asking ordinary citizens which laws they believe are morally binding on them.
        why: Citizens may take the internal view, but the rule of recognition exists because officials maintain it.
      - text: 'By looking at the practice: the behaviour of officials, especially judges, who maintain it.'
        correct: true
        why: >-
          Right: the lecture says we look at the practice, as with a queue, and specifically at the behaviour of
          officials who maintain the rule.
  - key: e12
    type: mcq
    concept: theoretical-disagreement
    difficulty: 3
    stem: >-
      What does Hart say, in the "pathology" of a legal system, about officials who disagree on the sources of law, for
      example after a coup?
    options:
      - text: We just have to wait and see which side prevails; agreement then marks the new rule of recognition.
        correct: true
        why: >-
          Right: the lecture says in that situation Hart thinks we wait and see which will prevail, and once agreement
          forms we identify the new rule of recognition.
      - text: The older constitution always remains valid, because a rule of recognition cannot be displaced by force.
        why: Hart does not privilege the old constitution; the lecture says the question is settled by which side prevails.
      - text: The judges must exercise strong discretion to choose the morally best of the competing constitutions.
        why: >-
          Hart's point is about observing which rule officials come to accept, not about judicial moral choice between
          constitutions.
      - text: The legal system ceases to exist permanently, and only natural law continues to bind the population.
        why: >-
          Hart does not say natural law takes over; the lecture presents the pathology as a temporary disagreement
          resolved by what prevails.
  - key: e13
    type: mcq
    concept: theoretical-disagreement
    difficulty: 2
    stem: How does Dworkin's view of law as a social practice differ from Hart's, according to the lecture?
    options:
      - text: 'Hart: a practice of brute facts, like Austin. Dworkin: a practice governed by rules.'
        why: >-
          Hart criticised Austin for reducing law to habits; Hart sees law as rule-governed, and Dworkin adds that it is
          argumentative.
      - text: 'Hart: a practice governed by rules, like chess. Dworkin: an argumentative practice.'
        correct: true
        why: >-
          Right: the lecture says for Hart law is a social practice governed by rules, like chess or football; Dworkin
          says legal practice is argumentative in nature.
      - text: 'Hart: a practice of moral argument. Dworkin: a practice of mechanical rule-following.'
        why: >-
          Reversed and distorted: Dworkin is the one who stresses argument, and Hart is not a theorist of moral
          argument.
      - text: 'Hart: not a social practice. Dworkin: the only social practice that uses reasons.'
        why: Hart does treat law as a social practice, and Dworkin does not claim law is the only practice with reasons.
  - key: e14
    type: mcq
    concept: theoretical-disagreement
    difficulty: 3
    contrasts-with:
      - law-as-integrity
    stem: Which statement correctly sorts Dworkin's Law's Empire arguments into criticism of Hart and positive theory?
    options:
      - text: >-
          Criticism: the chain novel shows Hart is wrong. Positive theory: theoretical disagreement explains
          adjudication.
        why: >-
          Reversed: theoretical disagreement is the criticism of Hart, and the chain novel belongs to Dworkin's own
          theory.
      - text: 'Criticism: principles cannot be weighed. Positive theory: law is a fixed set of rules and principles.'
        why: >-
          Dworkin says principles do have weight, and he explicitly opposes the idea that law is a fixed set of
          standards of any sort.
      - text: >-
          Criticism: theoretical disagreement defeats the rule of recognition. Positive theory: constructive
          interpretation and law as integrity.
        correct: true
        why: >-
          Right: the lecture says the theoretical disagreement argument attacks Hart's rule of recognition, and Dworkin
          then develops his own theory built on interpretation and integrity.
      - text: 'Criticism: Hart ignores policies. Positive theory: judges should pursue the community''s economic goals.'
        why: >-
          Policies feature in TRS, but not as the Law's Empire criticism; and Dworkin's positive theory is integrity,
          not the pursuit of goals.
  - key: e15
    type: mcq
    concept: theoretical-disagreement
    difficulty: 3
    variant-of: e02
    stem: >-
      Scenario: two appellate judges agree a statute was validly enacted and binding. One says it covers the case; the
      other says, read with the system's principles, it does not. What kind of disagreement is this?
    options:
      - text: Empirical disagreement, because they are really disputing what happened between the parties.
        why: Neither judge disputes the facts; the dispute is about what the pertinent law requires.
      - text: Moral disagreement, because one judge thinks the statute unjust and wants to override it.
        why: Both judges are arguing about what the law is, not whether a law they agree on is unjust.
      - text: Theoretical disagreement about the law, among participants who agree on its validity.
        correct: true
        why: >-
          Right: like Riggs, this is disagreement about what the pertinent law is, between competent judges who agree
          the statute is valid.
      - text: No real disagreement, because one of the judges is simply making a mistake about the statute.
        why: >-
          That is the easy-case pattern; the lecture says theoretical disagreement is reasonable disagreement among
          judges who know the law.
  - key: e16
    type: mcq
    concept: theoretical-disagreement
    difficulty: 2
    variant-of: e03
    stem: >-
      Scenario: in a negligence trial the parties dispute whether the driver was travelling at 60 or 80 km/h. Which of
      Dworkin's kinds of disagreement is this?
    options:
      - text: Empirical disagreement about what happened.
        correct: true
        why: >-
          Right: competing versions of the facts are empirical disagreement — the lecture mentions burden of proof and
          establishing facts in the process.
      - text: Theoretical disagreement about the pertinent law.
        why: The speed is a question of fact, not of what the pertinent law is, so this is not theoretical disagreement.
      - text: Moral disagreement about whether the result is just.
        why: Nobody is disputing the justice of the law here; the parties dispute what happened.
      - text: Disagreement about the rule of recognition itself.
        why: The sources of law are not in issue; only the facts of the accident are.
  - key: e17
    type: truefalse
    concept: theoretical-disagreement
    difficulty: 1
