  - key: q080
    type: short
    concept: australian-treaty-making-process
    difficulty: 3
    prompt: |
      Using the AUKUS naval nuclear propulsion agreements as your example, describe Australia's treaty-making
      process and identify one criticism raised about the process or the resulting agreement.
    model: |
      Australia's treaty-making process runs through six steps: a mandate to negotiate from the Foreign Minister;
      negotiation of the text; a National Interest Analysis and Executive Council approval; signature; scrutiny
      by the Joint Standing Committee on Treaties (JSCOT), which reports within 15–20 joint sitting days; and
      entry into force once any implementing legislation passes. The 2021 ENNPIA shows the early steps: its NIA
      explained the agreement was needed because US and UK domestic law restricted disclosing naval nuclear
      propulsion information to Australia without it, required no changes to Australian law, and it entered into
      force by an exchange of diplomatic notes. The much longer-lived 2024 Agreement for Cooperation Related to
      Naval Nuclear Propulsion (in force until 2075) went through full JSCOT scrutiny — Report 224, 260
      submissions, four public hearings — before JSCOT recommended binding treaty action in its Recommendation 1.
      A significant criticism, raised by Professor Donald Rothwell, was that the Agreement's withdrawal
      provisions were asymmetric: only the UK or US can be an "Originating Party" entitled to withdraw based on
      their own defence and security assessment, while Australia's own capacity to withdraw is comparatively
      constrained — a point the Australia Institute also pressed, without JSCOT ultimately recommending against
      the Agreement.
    rubric:
      - id: r1
        criterion: Sets out the six-step Australian treaty-making process accurately.
        marks: 2
        top-band: Names all six steps in the correct order.
        margin-note: Have you covered mandate through to entry into force?
        authorities: []
      - id: r2
        criterion: Uses the ENNPIA and/or 2024 Agreement to illustrate at least two of the steps.
        marks: 2
        top-band: Ties specific real facts (NIA content, exchange of notes, JSCOT process) to the relevant step.
        margin-note: Which real document illustrates which step?
        authorities:
          - australian-constitution-cth-s61
      - id: r3
        criterion: Identifies a genuine criticism from the materials (e.g. Rothwell's withdrawal-asymmetry point).
        marks: 2
        top-band: Explains the substance of the criticism accurately, with the "Originating Party" detail.
        margin-note: What exactly was Rothwell's concern?
        authorities: []
  - key: q081
    type: mcq
    concept: consent-to-be-bound-and-entry-into-force
    difficulty: 1
    set: pretest
    stem: Which two modes of consent to be bound does this unit focus on, out of the several listed in art 11 VCLT?
    options:
      - text: Signature and ratification.
        correct: true
        why: >-
          Correct — the lecture explicitly narrows the several art 11 modes down to signature and ratification as the
          two Australia actually uses.
      - text: Reservation and interpretative declaration.
        why: >-
          Wrong — these are not modes of consenting to be bound at all; a reservation modifies obligations once consent
          is given, and an interpretative declaration merely explains a state's view.
      - text: Provisional application and jus cogens.
        why: >-
          Wrong — provisional application is about applying a treaty before entry into force, and jus cogens is about
          invalidity, neither of which is a mode of consenting to be bound under art 11.
  - key: q082
    type: mcq
    concept: consent-to-be-bound-and-entry-into-force
    variant-of: q081
    difficulty: 2
    stem: >-
      According to art 11 VCLT, besides signature and ratification, which other modes of consent are listed (even though
      this unit focuses elsewhere)?
    options:
      - text: Exchange of instruments constituting a treaty, acceptance, approval and accession.
        correct: true
        why: >-
          Correct — the lecture mentions these additional modes when introducing art 11, before narrowing the unit's
          focus to signature and ratification.
      - text: Coercion and threat of force.
        why: Wrong — these are grounds of invalidity under arts 51–52, not modes of consenting to be bound.
      - text: >-
          Objection and acceptance of a reservation, together with interpretative declarations lodged with the
          depositary.
        why: >-
          Tempting because "acceptance" appears in both lists, but objections, reservations and interpretative
          declarations respond to a treaty's terms; art 11 lists exchange of instruments, acceptance, approval and
          accession.
  - key: q083
    type: mcq
    concept: consent-to-be-bound-and-entry-into-force
    difficulty: 2
    stem: Under art 14 VCLT, when is ratification required?
    options:
      - text: >-
          When the treaty itself specifies it, the negotiating parties agreed it was needed, the representative signed
          subject to ratification, or their full powers/negotiation conduct showed that was the state's intention.
        correct: true
        why: Correct — this lists all four grounds art 14 gives for requiring ratification, matching the materials closely.
      - text: Only when the treaty is bilateral, since multilateral treaties never require ratification.
        why: >-
          Wrong — this is the reverse of the general pattern described in the materials, where multilateral treaties
          more often require ratification and bilateral treaties more often do not.
      - text: Whenever the treaty is written in a language other than English.
        why: Wrong — the language of the treaty is not one of art 14's grounds for requiring ratification.
  - key: q084
    type: mcq
    concept: consent-to-be-bound-and-entry-into-force
    variant-of: q083
    difficulty: 3
    stem: >-
      Why does the lecture say ratification, rather than bare signature, is usually how Australia consents to
      multilateral treaties?
    options:
      - text: "Because Australia is dualist: it usually transforms a treaty into domestic law first, and then ratifies."
        correct: true
        why: >-
          Correct — the lecture links this directly to Australia's dualist system, where domestic transformation
          typically happens before ratification.
      - text: Because the VCLT expressly bans Australia from using bare signature to consent to any treaty.
        why: >-
          Wrong — the VCLT does not single out Australia; art 14 sets general conditions for when ratification is
          required, and Australia's dualist practice is what tends to trigger those conditions.
      - text: Because bilateral treaties always require more formality than multilateral treaties in Australian practice.
        why: >-
          Wrong — the materials suggest the opposite pattern, since bilateral treaties more often do not require
          ratification, while multilateral treaties more often do.
  - key: q085
    type: mcq
    concept: consent-to-be-bound-and-entry-into-force
    difficulty: 2
    stem: Under art 24 VCLT, how does a treaty enter into force?
    options:
      - text: In such manner and upon such date as the treaty itself provides, or as the negotiating states otherwise agree.
        correct: true
        why: "Correct — art 24 leaves entry into force to the treaty's own terms or the negotiating states' agreement; UNCLOS, for example, needed 12 months after the 60th ratification, reached only in 1994."
      - text: Automatically, exactly 90 days after signature by any two states, regardless of the treaty's own terms.
        why: >-
          Wrong — art 24 does not impose a universal 90-day rule; entry into force depends on what the treaty itself
          provides or what the negotiating states agree.
      - text: Only once every single state that signed the treaty has also ratified it.
        why: >-
          Wrong — many multilateral treaties (like UNCLOS) enter into force once a specified threshold of ratifications
          is reached, not only once every signatory has ratified.
  - key: q086
    type: mcq
    concept: consent-to-be-bound-and-entry-into-force
    variant-of: q085
    difficulty: 3
    stem: >-
      UNCLOS was opened for ratification in 1982 with around 100 signatures, but did not enter into force until 1994.
      Why?
    options:
      - text: Because art 306 tied entry into force to the 60th ratification plus 12 months, which took until 1994.
        correct: true
        why: >-
          Correct — this is exactly the example given in the lecture to show the gap between wide signature and actual
          entry into force.
      - text: Because the United Nations Security Council delayed UNCLOS's entry into force for political reasons.
        why: >-
          Wrong — the delay is attributed in the materials to the treaty's own ratification threshold (art 306), not to
          any Security Council intervention.
      - text: Because UNCLOS required unanimous ratification by every UN member state before it could enter into force.
        why: >-
          Wrong — the materials specify a 60-ratification threshold under art 306, not unanimous ratification by all UN
          member states.
  - key: q087
    type: mcq
    concept: consent-to-be-bound-and-entry-into-force
    difficulty: 2
    stem: >-
      What obligation does art 18 VCLT impose on a state that has signed a treaty subject to ratification, before the
      treaty enters into force?
    options:
      - text: To refrain from acts that would defeat its object and purpose.
        correct: true
        why: >-
          Correct — this is exactly art 18's limited obligation, described in the materials as not requiring compliance
          with the treaty's fine details.
      - text: >-
          To comply fully with every substantive obligation in the treaty, exactly as if it had already entered into
          force.
        why: >-
          Wrong — the lecture is explicit that art 18's obligation is deliberately limited, not full compliance with
          "the nitty-gritty details" of the treaty.
      - text: >-
          No obligation at all — signature subject to ratification has no legal consequence whatsoever until
          ratification occurs.
        why: >-
          Wrong — art 18 does impose a real, if limited, obligation on a signatory even before ratification and entry
          into force.
  - key: q088
    type: mcq
    concept: consent-to-be-bound-and-entry-into-force
    variant-of: q087
    difficulty: 3
    contrasts-with:
      - invalidity-of-treaties
    stem: How does art 25 VCLT's provisional application differ from art 18's obligation?
    options:
      - text: >-
          Article 25 lets a treaty (or part of it) apply in full, provisionally, if the treaty says so or the parties
          otherwise agree, whereas art 18 only obliges refraining from defeating the treaty's object and purpose, not
          full compliance.
        correct: true
        why: >-
          Correct — the materials draw exactly this distinction, since art 25 is an opt-in, fuller status, while art 18
          is a minimal, automatic floor.
      - text: There is no real difference; arts 18 and 25 impose exactly the same obligation using different wording.
        why: >-
          Wrong — the lecture is explicit that "Article 18 and Article 25 [are] two different things", specifically
          warning against treating them as interchangeable.
      - text: Article 25 applies only to bilateral treaties, while art 18 applies only to multilateral treaties.
        why: >-
          Wrong — nothing in the materials limits either article to bilateral or multilateral treaties specifically; the
          distinction drawn is about the scope and trigger of the obligation, not the type of treaty.
  - key: q089
    type: mcq
    concept: consent-to-be-bound-and-entry-into-force
    difficulty: 3
    stem: >-
      A state signs a treaty subject to ratification and has not yet ratified it. A separate provision of the same
      treaty is being provisionally applied under art 25 by agreement of the negotiating states. What is that state's
      obligation regarding the provisionally applied provision?
    options:
      - text: >-
          If it joined the art 25 arrangement, it must apply that provision as if in force, beyond art 18's minimal
          duty.
        correct: true
        why: >-
          Correct — this reflects the stronger, opt-in character of art 25 provisional application compared with art
          18's minimal "do not defeat the object and purpose" duty.
      - text: >-
          It has no obligation at all regarding that provision until the whole treaty formally enters into force for
          every party.
        why: >-
          Wrong — this ignores that art 25 lets a treaty (or part of it) apply provisionally exactly so that states
          party to that arrangement are bound by it before formal entry into force.
      - text: It must comply with the entire treaty in full immediately, as though ratification had already occurred.
        why: >-
          Wrong — this overstates the effect of provisional application, which the materials link only to the treaty or
          part of it, not necessarily the whole treaty for every purpose.
  - key: q090
    type: mcq
    concept: consent-to-be-bound-and-entry-into-force
    difficulty: 2
    stem: What is the key legal distinction between "consent to be bound" and "entry into force"?
    options:
      - text: Consent to be bound is the state's own act; entry into force is when the treaty becomes legally operative.
        correct: true
        why: >-
          Correct — the lecture stresses this distinction precisely because a long gap (as with UNCLOS) can separate the
          two.
      - text: They are the same event, always occurring simultaneously for every state and every treaty.
        why: Wrong — the whole point of this week's UNCLOS example is that these two events can be separated by many years.
      - text: >-
          Consent to be bound only applies to multilateral treaties, while entry into force only applies to bilateral
          treaties.
        why: >-
          Wrong — both concepts apply to bilateral and multilateral treaties alike; the distinction is about the type of
          legal event, not the type of treaty.
  - key: q091
    type: mcq
    concept: consent-to-be-bound-and-entry-into-force
    variant-of: q090
    difficulty: 4
    stem: >-
      A state ratifies a multilateral convention in 1986, but the convention (needing 60 ratifications under its own
      terms) only enters into force in 1996. What is that state's legal position between 1986 and 1996?
    options:
      - text: >-
          It has consented to be bound but the treaty is not yet in force for it; in the meantime it is subject only to
          art 18's minimal duty not to defeat the treaty's object and purpose (unless a stronger art 25 provisional
          application arrangement applies).
        correct: true
        why: >-
          Correct — this matches the lecture's own worked example almost exactly, showing the state is not bound by "all
          the provisions of the treaty" during that gap, only the minimal art 18 duty.
      - text: >-
          It is fully bound by every provision of the convention from the moment of ratification in 1986, exactly as if
          it had entered into force then.
        why: >-
          Wrong — this is precisely the misconception the lecture's worked example is designed to correct; ratification
          before entry into force does not mean full compliance is required immediately.
      - text: >-
          Its ratification is automatically void because it occurred before the treaty's entry-into-force threshold was
          reached.
        why: >-
          Wrong — nothing in the materials suggests ratifying before the entry-into-force threshold is reached
          invalidates that ratification; it simply means the treaty is not yet in force for that state.
  - key: q092
    type: mcq
    concept: consent-to-be-bound-and-entry-into-force
    difficulty: 3
    stem: >-
      The Paris Agreement was signed and ratified by Australia within months. What does the lecture's example illustrate
      about the relationship between signature/ratification and entry into force?
    options:
      - text: Wide, quick ratification can bring entry into force soon after, unlike the long gap for UNCLOS.
        correct: true
        why: >-
          Correct — the lecture uses the Paris Agreement's fast ratification and entry into force to contrast with
          UNCLOS's much longer gap, showing this is not always a slow process.
      - text: That every treaty enters into force immediately upon its first ratification by any single state.
        why: >-
          Wrong — this is not a general rule; entry into force still depends on the treaty's own terms (as UNCLOS's
          60-ratification threshold shows), even though the Paris Agreement happened to move quickly.
      - text: That entry into force for a treaty never depends on how many states have ratified it.
        why: >-
          Wrong — this contradicts the UNCLOS example, where the number of ratifications (60) was precisely what
          triggered entry into force.
  - key: q093
    type: mcq
    concept: consent-to-be-bound-and-entry-into-force
    difficulty: 2
    stem: >-
      What does a dualist system (like Australia's) require before a ratified treaty can operate as part of domestic
      law?
    options:
      - text: The treaty's provisions must first be transformed into domestic law, typically before ratification occurs.
        correct: true
        why: >-
          Correct — this is exactly the dualist mechanism described in the materials, linking domestic transformation to
          the timing of ratification.
      - text: >-
          Nothing — in a dualist system, a ratified treaty automatically becomes part of domestic law the moment it is
          ratified.
        why: >-
          Wrong — this describes a monist, not a dualist, approach; the materials specifically attribute the need for
          domestic transformation to Australia's dualist system.
      - text: The treaty must be re-negotiated entirely in the domestic Parliament before it has any effect.
        why: >-
          Wrong — transformation into domestic law (often via implementing legislation) is not the same as
          re-negotiating the treaty itself with the other state.
  - key: q094
    type: mcq
    concept: consent-to-be-bound-and-entry-into-force
    difficulty: 3
    stem: >-
      A bilateral treaty is silent on whether ratification is needed, but the record of negotiations shows both
      delegations repeatedly referred to "once ratified, this treaty will..." throughout the talks. Applying art 14, is
      ratification required?
    options:
      - text: Likely yes — art 14 covers an intention to require ratification expressed during negotiation.
        correct: true
        why: >-
          Correct — art 14 expressly covers the situation where negotiation conduct (not just the treaty's own text)
          shows ratification was intended.
      - text: >-
          No — since the treaty's text is silent, ratification can never be required under art 14, regardless of what
          happened during negotiations.
        why: >-
          Wrong — this ignores the specific art 14 ground allowing ratification to be inferred from what was expressed
          during the negotiation, not only from the treaty's express text.
      - text: Yes, but only because bilateral treaties always require ratification as a matter of course.
        why: >-
          Wrong — the materials indicate bilateral treaties often do not require ratification, so this is not a safe
          general rule; the correct basis here is the specific negotiation evidence.
  - key: q095
    type: mcq
    concept: consent-to-be-bound-and-entry-into-force
    difficulty: 4
    stem: >-
      A treaty provides for provisional application of its trade-liberalisation chapter only, pending full ratification
      by all 12 negotiating states. State X has signed but not ratified. Which article governs State X's position
      regarding that chapter, if State X has agreed to the provisional-application arrangement?
    options:
      - text: Article 25, on provisional application of part of a treaty.
        correct: true
        why: >-
          Correct — this matches art 25's own terms precisely, since it is designed for exactly this situation, applying
          part of a treaty before it is formally in force.
      - text: Article 24, since entry into force can only ever occur for the treaty as a whole, never for a single chapter.
        why: >-
          Wrong — art 24 concerns entry into force generally, but the specific mechanism for applying only part of a
          treaty before entry into force is art 25's provisional application, not art 24 alone.
      - text: Article 46, since applying only part of a treaty is a form of internal law violation.
        why: >-
          Wrong — art 46 concerns a state's own internal-law violation as a ground for invalidity, which is unrelated to
          a treaty's own provisional-application clause.
  - key: q096
    type: mcq
    concept: consent-to-be-bound-and-entry-into-force
    difficulty: 1
    stem: >-
      True or false framing aside — which article specifically defines when ratification is required, as opposed to
      signature alone being enough?
    options:
      - text: Article 14 VCLT.
        correct: true
        why: Correct — art 14 sets out the four grounds on which ratification (rather than bare signature) is required.
      - text: Article 2(1)(a) VCLT.
        why: Wrong — art 2(1)(a) defines what a treaty is, not when ratification (as opposed to signature) is required.
      - text: Article 53 VCLT.
        why: >-
          Wrong — art 53 concerns jus cogens and invalidity, an entirely different topic from when ratification is
          required.
  - key: q097
    type: truefalse
    set: quickfire
    concept: consent-to-be-bound-and-entry-into-force
    statement: >-
      Under art 24 VCLT, a treaty enters into force in the manner and on the date it provides, or as the negotiating
