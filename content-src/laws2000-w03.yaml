      - text: >-
          That the Agreement be rejected outright and renegotiated from scratch before any further parliamentary
          consideration.
        why: >-
          Wrong — JSCOT's actual recommendation was to support binding treaty action, not to reject the Agreement
          outright.
      - text: That the matter be referred to the High Court for a ruling on its validity before Parliament could act.
        why: >-
          Wrong — JSCOT is a parliamentary committee that reports a recommendation to Parliament; the materials describe
          no referral of the matter to the High Court.
  - key: q076
