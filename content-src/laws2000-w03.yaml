  - key: q056
    type: mcq
    concept: authority-to-conclude-a-treaty
    difficulty: 1
    stem: What does producing a "letter of full powers" demonstrate, under art 7 VCLT?
    options:
      - text: That the person presenting it has been authorised by their state to negotiate and/or sign a particular treaty.
        correct: true
        why: >-
          Correct — full powers are exactly the document that confers the authority art 7 requires for anyone who is not
          one of the three automatically-exempt officials.
      - text: That the treaty has already entered into force for that state.
        why: >-
          Wrong — full powers relate to authority to negotiate or sign, an earlier stage than entry into force, which is
          governed separately by art 24.
      - text: >-
          That the person holds diplomatic immunity in the host state and may therefore sign any treaty the host state
          proposes.
        why: >-
          Tempting because diplomats carry special status abroad, but full powers are about authority to represent the
          state for a particular treaty, not immunity, and they do not licence signing whatever is proposed.
  - key: q057
    type: truefalse
    set: quickfire
    concept: authority-to-conclude-a-treaty
    statement: >-
      Under art 7 VCLT, a minister for foreign affairs does not need to produce a letter of full powers to sign a
      treaty.
    answer: true
    why: >-
      Correct — a minister for foreign affairs is one of the three officials (with heads of state and government)
      presumed to already have that authority.
  - key: q058
    type: truefalse
    set: quickfire
    concept: authority-to-conclude-a-treaty
    statement: In the United States, a formal "treaty" can be ratified with a simple majority vote in the Senate.
    answer: false
    why: >-
      Wrong — the materials specify at least two-thirds of the Senate must give advice and consent for a formal treaty,
      not a simple majority.
  - key: q059
    type: truefalse
    set: quickfire
    concept: authority-to-conclude-a-treaty
    statement: In Australia, art 61 of the Constitution gives Parliament, not the executive, the power to conclude treaties.
    answer: false
    why: >-
      Wrong — art 61 vests the treaty-concluding power in the executive, exercised by the Foreign Minister and DFAT, not
      in Parliament.
  - key: q060
    type: short
    concept: authority-to-conclude-a-treaty
    difficulty: 3
    prompt: |
      Compare how the UK, the US and Australia each determine who has authority to conclude a treaty, and explain
      the role art 7 VCLT plays in identifying who can represent a state at the negotiating table.
    model: |
      International law does not itself say who can bind a state — that question is left to each state's own
      domestic law. In the UK, the Crown (government, acting under the royal prerogative) concludes treaties, but
      s 20 of the Constitutional Reform and Governance Act 2010 (UK) requires the treaty to be laid before
      Parliament before ratification. In the US, a formal "treaty" needs the advice and consent of at least
      two-thirds of the Senate, but the President can instead make an "executive agreement", binding under
      international law, without Senate involvement — as the Paris Agreement's repeated joining and withdrawal
      by executive order shows. In Australia, art 61 of the Constitution gives the executive the power to
      conclude treaties, exercised in practice by the Minister for Foreign Affairs, DFAT and the Attorney-
      General's Office of International Law. Article 7 VCLT then solves the separate, practical problem of who,
      at the negotiating table, can be assumed to represent a state: a head of state, head of government or
      minister for foreign affairs needs no letter of full powers, while anyone else must produce one.
    rubric:
      - id: r1
        criterion: Correctly states the UK position (Crown/prerogative, CRAG Act 2010 s 20 laying requirement).
        marks: 2
        top-band: Accurately names both the prerogative source and the s 20 laying requirement.
        margin-note: Who signs, and what does Parliament get to do?
        authorities:
          - constitutional-reform-and-governance-act-2010-uk-s20
      - id: r2
        criterion: Correctly states the US position (Senate two-thirds for a treaty; executive agreements bypass this).
        marks: 2
        top-band: Explains both the formal treaty route and the executive agreement route, with the Paris Agreement example.
        margin-note: What's the difference between a "treaty" and an "executive agreement" here?
        authorities: []
      - id: r3
        criterion: Correctly states the Australian position (art 61 executive power, DFAT/Foreign Minister/AGD).
        marks: 1
        top-band: Names art 61 and the relevant departments accurately.
        margin-note: Which constitutional provision, and which officials?
        authorities:
          - australian-constitution-cth-s61
      - id: r4
        criterion: Explains art 7 VCLT's full-powers rule and its three exempt officials.
        marks: 1
        top-band: Names all three exempt officials and explains why full powers are otherwise needed.
        margin-note: Who is exempt, and why does anyone else need a letter?
        authorities:
          - vclt-art-7
  - key: q061
    type: mcq
    concept: australian-treaty-making-process
    difficulty: 1
    stem: What is the first formal step in Australia's treaty-making process?
    options:
      - text: The lead minister seeks a mandate to negotiate the treaty from the Minister for Foreign Affairs.
        correct: true
        why: Correct — this is Step 1 in DFAT's six-step process described in the materials, before any negotiation begins.
      - text: The treaty is immediately tabled before the Joint Standing Committee on Treaties.
        why: Wrong — JSCOT scrutiny is Step 5, occurring after negotiation and signature, not the first step.
      - text: The treaty automatically enters into force once both governments announce it publicly.
        why: >-
          Wrong — entry into force is the final step and requires much more than a public announcement, including
          domestic implementation.
      - text: The Governor-General personally negotiates every treaty's text with the other state.
        why: >-
          Wrong — negotiation is carried out by lead agencies and ministers under a mandate, not personally by the
          Governor-General.
  - key: q062
    type: mcq
    concept: australian-treaty-making-process
    variant-of: q061
    difficulty: 2
    stem: Why must the lead minister seek a mandate from the Minister for Foreign Affairs before negotiations begin?
    options:
      - text: >-
          Because the Foreign Minister and DFAT are responsible for Australia's foreign relations and treaty practice
          overall.
        correct: true
        why: >-
          Correct — this reflects the materials' emphasis on DFAT and the Foreign Minister's central coordinating role
          in Australia's treaty-making process from the outset.
      - text: >-
          Because s 61 of the Constitution vests the treaty power personally in the Foreign Minister, so no other
          minister may negotiate at all.
        why: >-
          Tempting because s 61 is the source of the executive treaty power, but it vests executive power generally, not
          personally in the Foreign Minister; the mandate step reflects DFAT's responsibility for foreign relations.
      - text: >-
          Because only the Foreign Minister is legally permitted to speak to a foreign government under any
          circumstances.
        why: >-
          Wrong — this overstates the point; other ministers with portfolio interests are informed and can be involved,
          but there is no absolute rule that only the Foreign Minister may ever speak to another government.
  - key: q063
    type: mcq
    concept: australian-treaty-making-process
    difficulty: 2
    stem: What must happen before Australia's representative can sign a treaty?
    options:
      - text: Federal Executive Council (ExCo) approval.
        correct: true
        why: >-
          Correct — Step 3 in the materials requires ExCo approval, following agreement among the relevant ministers,
          before the representative can sign.
      - text: A binding vote of the full Australian Parliament specifically approving the signature.
        why: >-
          Wrong — signature requires ExCo approval, not a parliamentary vote; parliamentary scrutiny (via JSCOT) happens
          after signature, at Step 5.
      - text: Nothing — any Australian government representative may sign any treaty at any time without prior approval.
        why: >-
          Wrong — the materials describe a specific approval step (ExCo) that must occur before signature, not an
          unconstrained power to sign.
  - key: q064
    type: mcq
    concept: australian-treaty-making-process
    variant-of: q063
    difficulty: 3
    stem: >-
      If the treaty is to be signed by someone other than the Prime Minister or the Minister for Foreign Affairs, what
      additional document is required?
    options:
      - text: An instrument of full powers issued by the Minister for Foreign Affairs.
        correct: true
        why: >-
          Correct — the materials specify this exact requirement for any signatory who is not the PM or Foreign
          Minister, echoing art 7 VCLT's full-powers rule.
      - text: >-
          A unanimous resolution of the Federal Executive Council naming every possible alternative signatory in
          advance.
        why: >-
          Wrong — the requirement is a specific instrument of full powers for the actual signatory, not a blanket
          advance resolution naming multiple alternatives.
      - text: Written consent from every state and territory government.
        why: >-
          Wrong — state and territory consultation is a separate matter (relevant during negotiation), not a documentary
          requirement for who signs the finished text.
  - key: q065
    type: mcq
    concept: australian-treaty-making-process
    difficulty: 2
    stem: What is a National Interest Analysis (NIA), and when is it prepared?
    options:
      - text: >-
          A document assessing the treaty's social, economic and political impact, prepared to accompany the treaty when
          it is tabled for JSCOT scrutiny.
        correct: true
        why: >-
          Correct — this matches the materials' description of the NIA's content and its role in the JSCOT scrutiny step
          of Australia's process.
      - text: >-
          A statement of the obligations the other negotiating states impose on Australia, prepared after ratification
          to guide implementing laws.
        correct: false
        why: >-
          Tempting because an NIA does set out the obligations a treaty creates, but it accompanies the treaty when it
          is tabled so JSCOT can scrutinise it before binding action, not after ratification.
      - text: A confidential legal opinion prepared solely for the High Court's use in any future dispute.
        why: >-
          Wrong — the NIA accompanies the treaty for JSCOT and Parliament, not for the High Court, and it is a public
          document rather than a confidential court opinion.
  - key: q066
    type: mcq
    concept: australian-treaty-making-process
    variant-of: q065
    difficulty: 3
    stem: Which of the following would you expect an NIA to address, based on this week's materials?
    options:
      - text: Why joining is in Australia's interest, how it will be implemented, and whether Australia could withdraw.
        correct: true
        why: >-
          Correct — these are exactly among the matters the materials say an NIA addresses, illustrated by the real
          ENNPIA and AUKUS NIAs.
      - text: >-
          The costs of negotiating the treaty, including the delegation's travel, and a ranking of the other parties by
          trade volume.
        why: >-
          Tempting because an NIA does weigh economic impact, but it looks at the treaty's social, economic and
          political effects on Australia, not the cost of the negotiating trip or a league table of partners.
      - text: >-
          Whether the High Court has already confirmed the treaty's validity, since an NIA cannot be tabled without that
          ruling first.
        why: >-
          Tempting because an NIA addresses domestic implementation, but no court ruling is part of the process; the
          steps are ExCo approval, signature, JSCOT scrutiny with the NIA, then any implementing legislation.
  - key: q067
    type: mcq
    concept: australian-treaty-making-process
    difficulty: 2
    stem: How many joint sitting days does JSCOT generally have to report on a treaty, according to the materials?
    options:
      - text: 15 or 20 joint sitting days, depending on the category of treaty.
        correct: true
        why: >-
          Correct — the reading specifies JSCOT will table its report within 15 or 20 joint sitting days depending on
