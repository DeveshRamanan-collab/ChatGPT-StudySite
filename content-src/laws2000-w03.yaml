    answer: true
    why: Correct — this closely tracks the wording of art 24 as quoted in the materials.
  - key: q098
    type: truefalse
    set: quickfire
    concept: consent-to-be-bound-and-entry-into-force
    statement: >-
      Article 18 VCLT requires a signatory state to comply fully with every provision of a treaty even before it enters
      into force.
    answer: false
    why: >-
      Wrong — art 18 imposes only a limited duty to refrain from defeating the treaty's object and purpose, not full
      compliance with its details.
  - key: q099
    type: truefalse
    set: quickfire
    concept: consent-to-be-bound-and-entry-into-force
    statement: UNCLOS entered into force in 1994, twelve years after being opened for ratification in 1982.
    answer: true
    why: >-
      Correct — the materials use exactly this gap to illustrate the difference between wide signature and actual entry
      into force.
  - key: q100
    type: short
    concept: consent-to-be-bound-and-entry-into-force
    difficulty: 3
    prompt: |
      Explain the difference between consent to be bound, entry into force, and provisional application under the
      VCLT, using the UNCLOS example to illustrate why the distinctions matter.
    model: |
      Consent to be bound (arts 11–17 VCLT) is a state's own act — usually, for Australia, signature or (more
      often, given its dualist system) ratification under art 14. Entry into force (art 24) is when the treaty
      becomes legally operative "in such manner and upon such date as it may provide or as the negotiating States
      may agree" — a separate, later event that can depend on conditions like a minimum number of ratifications.
      UNCLOS shows why the gap matters: opened for ratification in 1982 with around 100 signatures, it did not
      enter into force until 1994, because art 306 required 12 months after the 60th ratification, not reached
      until then. A state that ratified UNCLOS in the 1980s was not bound by all its provisions during that gap —
      only by art 18's minimal duty to refrain from acts defeating the treaty's object and purpose. Article 25
      provisional application is different again: it lets a treaty (or part of it) apply in full before entry
      into force, if the treaty itself so provides or the negotiating states separately agree — a stronger,
      opt-in status than art 18's automatic floor. Getting these three concepts right matters because a problem
      question might place a state at any of these three stages, each carrying a different level of obligation.
    rubric:
      - id: r1
        criterion: Correctly distinguishes consent to be bound (arts 11/14) from entry into force (art 24).
        marks: 2
        top-band: Explains both concepts accurately and notes they can occur at different times.
        margin-note: What's the difference between consenting and the treaty actually operating?
        authorities:
          - vclt-art-14
          - vclt-art-24
      - id: r2
        criterion: >-
          Uses the UNCLOS example (1982 signature, 1994 entry into force, art 306's 60-ratification threshold)
          accurately.
        marks: 2
        top-band: Cites the correct years and the 60-ratification/12-month mechanism.
        margin-note: What caused the 12-year gap?
        authorities: []
      - id: r3
        criterion: Explains art 18's minimal duty and distinguishes it from art 25 provisional application.
        marks: 2
        top-band: Clearly separates the automatic minimal duty (art 18) from the stronger opt-in status (art 25).
        margin-note: Which article is automatic, and which requires the treaty or states to opt in?
        authorities:
          - vclt-art-18
          - vclt-art-25
  - key: q101
    type: mcq
    concept: invalidity-of-treaties
    difficulty: 1
    set: pretest
    stem: Which grounds does the VCLT treat as "relative invalidity" (issues with consent)?
    options:
      - text: Error, fraud, and corruption of a state's representative.
        correct: true
        why: >-
          Correct — arts 46–50 (with the slides highlighting arts 48–50 specifically) list these as issues with consent
          forming relative invalidity.
      - text: Threat or use of force against the state, and conflict with a peremptory norm.
        why: Wrong — these are the two grounds of absolute invalidity (arts 52–53), not relative invalidity.
      - text: Failure to register the treaty with the United Nations.
        why: >-
          Wrong — UN registration is an administrative step, not a ground of invalidity listed anywhere in the VCLT
          grounds covered this week.
  - key: q102
    type: mcq
    concept: invalidity-of-treaties
    variant-of: q101
    difficulty: 2
    stem: Which grounds does the VCLT treat as "absolute invalidity"?
    options:
      - text: Coercion of a representative, threat or use of force against the state, and conflict with jus cogens.
        correct: true
        why: "Correct — absolute invalidity covers coercion of a representative (art 51), threat or use of force against the state (art 52) and conflict with jus cogens (art 53); the treaty is void ab initio."
      - text: Error and fraud only.
        why: "Tempting because error and fraud do invalidate treaties, but error (art 48) and fraud (art 49) go to defective consent, so they are relative invalidity; absolute invalidity is arts 51–53."
      - text: >-
          Error, fraud and corruption of a representative, because each strikes at the reality of consent and so voids
          the treaty ab initio.
        why: "Tempting because these grounds concern defective consent, but that is exactly why error, fraud and corruption (arts 48–50) are classed as relative invalidity; absolute invalidity is arts 51–53."
  - key: q103
    type: mcq
    concept: invalidity-of-treaties
    difficulty: 2
    stem: What kind of "error" can render a treaty void under art 48 VCLT?
    options:
      - text: A material factual mistake, such as an erroneous map, that was an important basis for joining.
        correct: true
        why: >-
          Correct — the lecture's example (an erroneous map material to the decision to join) matches art 48's
          requirement of a factual error important to the state's consent.
      - text: >-
          A typographical error in the treaty's numbering or cross-references, discovered after signature, that does not
          affect its substance.
        why: >-
          Tempting because it is literally an error, but art 48 is about a mistaken factual situation that formed an
          important basis for consent; a slip that leaves the substance untouched does not qualify.
      - text: >-
          A later change in the state's own domestic political circumstances that makes the treaty less attractive than
          it seemed at signature.
        why: >-
          Tempting because the state may feel it misjudged the deal, but error concerns facts at the time of consent,
          not later political change; a change of heart is not a ground of invalidity.
  - key: q104
    type: mcq
    concept: invalidity-of-treaties
    variant-of: q103
    difficulty: 2
    stem: What distinguishes "fraud" (art 49) from "error" (art 48) as grounds for invalidity?
    options:
      - text: >-
          Fraud needs deliberate deception by the other state or its representative; error can arise without any
          wrongdoing.
        correct: true
        why: >-
          Correct — the lecture's example of a deliberately falsified map to induce signature is fraud, while an
          innocent factual mistake is simple error.
      - text: There is no real difference — error and fraud are simply two names for exactly the same legal ground.
        why: >-
          Wrong — the VCLT and this week's materials treat them as two distinct grounds (arts 48 and 49), with fraud
          specifically requiring deliberate deception.
      - text: >-
          Fraud makes a treaty void ab initio as absolute invalidity, whereas error is only relative invalidity, so the
          difference is the consequence.
        why: >-
          Tempting because the two grounds do differ, but the slides class both fraud (art 49) and error (art 48) as
          relative invalidity; the real difference is deliberate deception, not the category of consequence.
  - key: q105
    type: mcq
    concept: invalidity-of-treaties
    difficulty: 3
    stem: What must be shown for "corruption of a representative" (art 50) to invalidate a treaty?
    options:
      - text: >-
          A non-due advantage was offered to the negotiating representative, inducing a signature they otherwise would
          not give.
        correct: true
        why: Correct — this matches the lecture's description of corruption of a representative almost exactly.
      - text: >-
          The representative accepted an ordinary, publicly disclosed diplomatic gift from the other state during talks,
          however small its value.
        why: >-
          Tempting because gifts sound like corruption, but art 50 needs a non-due advantage that induces the
          representative to sign when they otherwise would not; an ordinary, disclosed courtesy gift is not that.
      - text: The representative was replaced by their government before the treaty was signed.
        why: >-
          Wrong — a change of representative before signature has nothing to do with corruption; corruption concerns an
          improper inducement affecting the actual signatory's decision.
  - key: q106
    type: mcq
    concept: invalidity-of-treaties
    difficulty: 3
    stem: >-
      What is the key difference between "coercion of a representative" (art 51) and "threat or use of force against the
      state" (art 52)?
    options:
      - text: Art 51 targets the individual representative; art 52 targets the state itself.
        correct: true
        why: >-
          Correct — art 51 concerns pressure on the individual negotiator (economic pressure, blackmail, threats to
          their life), while art 52 concerns threat or use of force against the state itself; the slides place both
          under absolute invalidity.
      - text: Art 51 is relative invalidity that the victim state may choose to invoke, while art 52 is absolute.
        why: >-
          Tempting because error, fraud and corruption are relative, but the slides group coercion of a representative
          with force and jus cogens under absolute invalidity (arts 51–53); the difference lies in the target, not the
          category.
      - text: Coercion of a representative can only be committed by an international organisation, never by another state.
        why: >-
          Wrong — nothing in the materials restricts coercion of a representative to international organisations; the
          example given (economic pressure, blackmail, threat to life) can come from another state.
  - key: q107
    type: mcq
    concept: invalidity-of-treaties
    variant-of: q106
    difficulty: 4
    stem: >-
      A state's negotiator is told her family will be harmed unless she signs a treaty on unfavourable terms.
      Separately, the negotiating state also masses troops on the other state's border, threatening invasion unless the
      treaty is signed. What is the effect on the treaty's validity?
    options:
      - text: "Either ground alone would do: arts 51 and 52 are both absolute invalidity, so the treaty cannot stand."
        correct: true
        why: >-
          Correct — the slides class both coercion of a representative (art 51) and threat or use of force against the
          state (art 52) as absolute invalidity, so either ground on its own means the treaty has no legal effect.
      - text: >-
          The treaty is merely voidable: art 51 coercion is relative invalidity, so the victim state must choose to
          invoke it in good time.
        why: >-
          Tempting because error, fraud and corruption are relative grounds, but the slides place coercion of a
          representative (art 51) with force (art 52) under absolute invalidity (arts 51–53); no election to invoke it
          is needed.
      - text: >-
          Only the threat against the representative matters; threats of force against a state can never affect a
          treaty's validity.
        why: >-
          Wrong — this is the opposite of the materials, which treat threat or use of force against the state (art 52)
          as a ground of absolute invalidity, arguably the more serious of the two.
  - key: q108
    type: mcq
    concept: invalidity-of-treaties
    difficulty: 2
    stem: Under art 53 VCLT, what makes a treaty void for conflicting with a "peremptory norm" (jus cogens)?
    options:
      - text: One accepted and recognised by the international community of states as a whole as non-derogable.
        correct: true
        why: Correct — this is a close paraphrase of art 53's own definition, quoted in the materials.
      - text: >-
          One adopted by a two-thirds majority of the General Assembly and then repeated in at least one later
          multilateral convention.
        why: >-
          Tempting because General Assembly majorities and repeated treaty practice can evidence custom, but art 53
          requires acceptance by the international community of states as a whole as a norm from which no derogation is
          permitted.
      - text: >-
          One that the treaty's own parties, or a majority of them, declare in the treaty text to be of fundamental
          importance.
        why: >-
          Tempting because "fundamental importance" sounds like jus cogens, but parties cannot create a peremptory norm
          by declaring one; art 53 looks to the international community of states as a whole.
  - key: q109
    type: mcq
    concept: invalidity-of-treaties
    variant-of: q108
    difficulty: 2
    stem: Which of these is given as an example of a peremptory norm (jus cogens) in this week's materials?
    options:
      - text: The prohibition of torture and genocide.
        correct: true
        why: >-
          Correct — the slides expressly list the prohibitions of torture and genocide among the examples of peremptory
          norms.
      - text: The rule that treaties must be published in at least two languages.
        why: >-
          Wrong — this is not a peremptory norm at all; it is not even mentioned anywhere in the materials as a legal
          requirement.
      - text: The rule that only the Security Council's five permanent members may conclude treaties.
        why: Wrong — this is not a real rule described anywhere in the materials, let alone one recognised as jus cogens.
  - key: q110
    type: mcq
    concept: invalidity-of-treaties
    difficulty: 3
    stem: Under art 46 VCLT, when can a state invoke its own internal law to invalidate its consent to be bound?
    options:
      - text: Only where the violation of internal law was manifest and concerned a rule of fundamental importance.
        correct: true
        why: Correct — this is the exact, narrow test the materials give, applied in *Cameroon v Nigeria*.
      - text: Whenever any domestic official failed to follow the correct internal procedure, however minor.
        why: >-
          Wrong — this is far broader than the actual art 46 test, which requires both a manifest violation and one
          concerning a rule of fundamental importance.
      - text: Never — a state can never invoke its own internal law to challenge its consent under any circumstances.
        why: >-
          Wrong — art 46 does allow this in the narrow "manifest and fundamental importance" circumstance; it is not an
          absolute bar in every case.
  - key: q111
    type: mcq
    concept: invalidity-of-treaties
    variant-of: q110
    difficulty: 3
    stem: >-
      A new government comes to power and simply does not wish to honour a treaty its predecessor validly concluded,
      arguing the predecessor lacked "real" democratic authority. Does art 46 help it escape the treaty?
    options:
      - text: >-
          Unlikely — a mere change of government and disagreement with a predecessor's choices does not, without more,
          show a manifest violation of a fundamentally important internal-law rule.
        correct: true
        why: >-
          Correct — this reflects the lecturer's own answer to a similar question in the live lecture, and the high bar
          *Cameroon v Nigeria* sets for art 46 to apply.
      - text: >-
          Yes — any change of government automatically invalidates all treaties concluded by the previous government
          under art 46.
        why: >-
          Wrong — this would make treaty commitments meaningless across a change of government, which is precisely the
          outcome art 46's narrow test is designed to prevent.
      - text: >-
          Yes, but only because art 46 applies automatically whenever the exact word "manifest" appears in the treaty
          text itself.
        why: >-
          Wrong — this misunderstands art 46 entirely; "manifest" describes the character of the internal-law violation
          required, not a word that must literally appear in the treaty.
  - key: q112
    type: mcq
    concept: invalidity-of-treaties
    difficulty: 2
    contrasts-with:
      - consent-to-be-bound-and-entry-into-force
    stem: >-
      A treaty has been validly signed and ratified by both parties, but has not yet entered into force because a
      ratification threshold has not been reached. Is the treaty "invalid"?
    options:
      - text: >-
          No — this is a timing issue about entry into force (art 24), not a defect of the kind arts 46–53 address; the
          treaty is simply not yet operative, not invalid.
        correct: true
        why: >-
          Correct — this draws the exact distinction the materials emphasise, since invalidity is about a defect
          infecting the treaty's conclusion, while not-yet-in-force is purely a timing question.
      - text: Yes — any treaty that has not yet entered into force is automatically invalid under art 53.
        why: >-
          Wrong — this conflates two separate concepts; art 53 deals with jus cogens conflicts, not with treaties that
          are simply awaiting the conditions for entry into force.
      - text: Yes, because failing to reach the ratification threshold is itself treated as coercion under art 51.
        why: >-
          Wrong — coercion under art 51 concerns pressure on a representative during the treaty's conclusion, which has
          nothing to do with a ratification threshold not yet being met.
  - key: q113
    type: mcq
    concept: invalidity-of-treaties
    difficulty: 4
    stem: >-
      A state ratifies a treaty prohibiting a certain category of weapons. Years later, it argues the treaty is void
      because, at the time of conclusion, a customary rule prohibiting those weapons had only just begun to emerge and
      was not yet a peremptory norm. Applying art 53, is the state's argument likely to succeed?
    options:
      - text: >-
          Unlikely — art 53 requires the peremptory norm to exist "at the time of [the treaty's] conclusion", so a rule
          only beginning to emerge and not yet accepted by the international community as a whole would not meet that
          timing requirement.
        correct: true
        why: >-
          Correct — art 53 is explicit that the conflict with the peremptory norm must exist at the time of the treaty's
          conclusion; a rule that had not yet crystallised into a peremptory norm at that time cannot retroactively void
          the treaty.
      - text: >-
          Yes, automatically, because any customary rule that later becomes a peremptory norm voids every earlier treaty
          on the same subject.
        why: >-
          Wrong — this ignores art 53's express timing requirement that the conflict exist at the time of the treaty's
          conclusion, not merely at some later point.
      - text: Yes, because peremptory norms always apply retroactively to every treaty ever concluded on a related topic.
        why: >-
          Wrong — retroactive application to every related treaty is not how art 53 operates; the norm must conflict
          with the treaty at the time of its conclusion.
  - key: q114
    type: mcq
    concept: invalidity-of-treaties
    difficulty: 3
    stem: >-
      Why did the lecturer suggest that ordinary coercion/threat-of-force analysis under arts 51–52 does not simply
      transplant into a wartime scenario, using the food-and-grain safe-passage hypothetical?
    options:
      - text: >-
          Because once there is an actual armed conflict, the law of armed conflict becomes the more relevant body of
          rules.
        correct: true
        why: >-
          Correct — this reflects the lecturer's own point that "when there is a war... the same rule won't apply" as
          compared to peacetime coercion.
      - text: Because arts 51 and 52 only apply to treaties concluded before 1945, not to any modern treaty.
        why: >-
          Wrong — there is no such date restriction anywhere in the materials; the point made is about wartime versus
          peacetime, not about the treaty's age.
      - text: >-
          Because economic sanctions can never amount to coercion or a threat of force, whether in peacetime or during
          an armed conflict.
        why: >-
          Tempting because the hypothetical involved sanctions, but the lecturer's point was not about sanctions as
          such; once an armed conflict exists, the law of armed conflict becomes the more relevant body of rules.
  - key: q115
    type: mcq
    concept: invalidity-of-treaties
    difficulty: 2
    stem: >-
      Which case does the art 46 slide cite for the principle that an internal-law violation is (almost) never a ground
      of invalidity?
    options:
      - text: Case Concerning the Land and Maritime Boundary between Cameroon and Nigeria.
        correct: true
        why: >-
          Correct — this case is cited directly under the art 46 slide as authority for the "manifest and fundamental
          importance" test.
      - text: South China Sea Arbitration (The Philippines v China).
        why: >-
          Wrong — that case is used this week for treaty interpretation under arts 31–32, not for the art 46
          internal-law point.
      - text: Maritime Delimitation in the Indian Ocean (Somalia v Kenya) (Preliminary Objections).
        why: >-
          Wrong — that case is used this week to show an MoU can be a treaty, not for the art 46 internal-law invalidity
          point.
  - key: q116
    type: mcq
    concept: invalidity-of-treaties
    difficulty: 1
    stem: Once a treaty is found void for absolute invalidity (e.g. under art 52 or art 53), what is its legal status?
    options:
      - text: Void ab initio — treated as never having had legal effect from the start.
        correct: true
        why: >-
          Correct — the materials describe absolute invalidity as making the treaty "void ab initio", not merely
          voidable from some later point.
      - text: Voidable only if the affected state applies to the International Court of Justice within 90 days.
        why: >-
          Wrong — no such 90-day application requirement is described anywhere in this week's materials for absolute
          invalidity.
      - text: Valid and binding until a new treaty expressly repeals it.
        why: >-
          Wrong — this is the opposite of "void ab initio", which means the treaty is treated as never having had legal
          effect at all.
  - key: q117
    type: truefalse
    set: quickfire
    concept: invalidity-of-treaties
    statement: >-
      Under art 46 VCLT, a state can invoke a violation of its own internal law to invalidate its consent only if the
      violation was manifest and concerned a rule of fundamental importance.
    answer: true
    why: Correct — this matches the narrow art 46 test applied in *Cameroon v Nigeria*.
  - key: q118
    type: truefalse
    set: quickfire
    concept: invalidity-of-treaties
    statement: Fraud and error are both examples of "absolute invalidity" under the VCLT.
    answer: false
    why: Wrong — fraud (art 49) and error (art 48) are grounds of relative invalidity, not absolute invalidity.
  - key: q119
    type: truefalse
    set: quickfire
    concept: invalidity-of-treaties
    statement: >-
      A treaty that conflicts with a peremptory norm of general international law (jus cogens) at the time of its
      conclusion is void.
    answer: true
    why: Correct — this matches art 53 VCLT exactly, as quoted in the materials.
  - key: q120
    type: short
    concept: invalidity-of-treaties
    difficulty: 3
    prompt: |
      Explain the difference between relative and absolute invalidity under the VCLT, and why an internal-law
      violation is only rarely a successful ground for invalidity.
    model: |
      The VCLT splits invalidity into two categories. Relative invalidity concerns defects in a state's consent:
      error (art 48) — a material factual mistake, like an erroneous map, important to the decision to join;
      fraud (art 49) — deliberately misleading a representative into signing; and corruption of a representative
      (art 50) — an improper advantage inducing a representative to sign who otherwise would not have. Absolute
      invalidity is more serious and makes a treaty void ab initio: coercion of a representative (art 51) —
      economic pressure, blackmail or a threat to their life — and, more seriously still, threat or use of force
      against the state itself (art 52), as well as conflict with a peremptory norm of general international law
      (jus cogens, art 53), such as the prohibitions on torture or genocide, which must exist at the time the
      treaty was concluded. Violating a state's own internal law on treaty-making competence is deliberately not
      a ground for invalidity in the ordinary case: art 46, applied in *Cameroon v Nigeria*, says a state cannot
      invoke this unless the violation was "manifest and concerned a rule of its internal law of fundamental
      importance". This protects the other party's reasonable reliance on an apparently validly concluded treaty
      — a mere change of government disagreeing with its predecessor's choices will not meet that high bar.
    rubric:
      - id: r1
        criterion: Correctly explains relative invalidity with at least two of error/fraud/corruption.
        marks: 2
        top-band: Names the correct article numbers and gives an accurate one-line description of each.
        margin-note: Which articles, and what does each require?
        authorities:
          - vclt-arts-48-50
      - id: r2
        criterion: Correctly explains absolute invalidity (coercion of a representative, force against the state, jus cogens).
        marks: 2
        top-band: Distinguishes coercion of a representative from force against the state, and explains jus cogens accurately.
        margin-note: What makes these "absolute" rather than "relative"?
        authorities:
          - vclt-art-53
      - id: r3
        criterion: Explains art 46's narrow internal-law exception and its rationale, ideally with *Cameroon v Nigeria*.
        marks: 2
        top-band: States the "manifest and fundamental importance" test accurately and explains the reliance rationale.
        margin-note: Why is the bar for art 46 set so high?
        authorities:
          - vclt-art-46
  - key: q121
    type: mcq
    concept: reservations-to-treaties
    difficulty: 1
    set: pretest
    stem: Under art 2(1)(d) VCLT, what is a "reservation"?
    options:
      - text: >-
          A unilateral statement made when signing, ratifying, accepting, approving or acceding to a treaty, purporting
          to exclude or modify the legal effect of certain provisions for that state.
        correct: true
        why: Correct — this is a close paraphrase of art 2(1)(d)'s own wording, quoted in the materials.
      - text: A formal request to another state to renegotiate the entire treaty from scratch.
        why: >-
          Wrong — a reservation modifies the effect of specific provisions for the reserving state; it does not reopen
          or renegotiate the whole treaty.
      - text: A joint statement issued by all parties agreeing on how to interpret an ambiguous provision.
        why: >-
          Wrong — this describes something closer to an interpretative agreement among all parties, not a unilateral
          reservation made by one state alone.
  - key: q122
    type: mcq
    concept: reservations-to-treaties
    variant-of: q121
    difficulty: 2
    stem: How does a reservation differ from an interpretative declaration?
    options:
      - text: >-
          A reservation excludes or modifies a provision's effect for the state; an interpretative declaration only
          explains its view of the meaning.
        correct: true
        why: >-
          Correct — the materials draw this exact distinction, noting an interpretative declaration is "only explanatory
          in character".
      - text: There is no real difference; both terms describe exactly the same legal act under the VCLT.
        why: >-
          Wrong — the materials expressly warn against confusing the two, since only a reservation changes the legal
          effect of a provision.
      - text: >-
          An interpretative declaration is simply a reservation made after ratification rather than at signature, so it
          has the same excluding effect.
        why: >-
          Tempting because both are unilateral statements about a treaty, but timing is not the difference: an
          interpretative declaration only explains a state's view of the meaning and is not a condition of being bound,
          so it excludes nothing.
  - key: q123
    type: mcq
    concept: reservations-to-treaties
    difficulty: 2
    stem: Why do reservations mainly matter for multilateral, rather than bilateral, treaties?
    options:
      - text: Because many states are less likely to all agree on every provision than two states are.
        correct: true
        why: >-
          Correct — the lecture explains that with potentially 160-plus states negotiating, some provisions will
          inevitably be unacceptable to particular states, which is exactly what reservations address.
      - text: Because bilateral treaties are legally incapable of ever including binding provisions.
        why: >-
          Wrong — this misstates bilateral treaties, which are of course capable of binding provisions; reservations are
          simply less needed there because there are only two negotiating positions to reconcile.
      - text: >-
          Because the VCLT expressly prohibits reservations to bilateral treaties, so they can only ever arise in
          multilateral treaties.
        why: >-
          Tempting because art 19 speaks of multilateral treaties, but the lecture's reason is practical: with 160-plus
          states it is far less likely all will agree on every provision than in a two-state negotiation.
  - key: q124
    type: mcq
    concept: reservations-to-treaties
    difficulty: 2
    stem: Under art 19 VCLT, which of the following is NOT one of the three conditions for a permissible reservation?
    options:
      - text: The reservation must be approved by the United Nations Secretary-General before being made.
        correct: true
        why: >-
          This is correct as the answer to the "NOT" question — art 19's three conditions are about the treaty's own
          prohibitions and the object-and-purpose test, with no UN Secretary-General approval step.
      - text: The reservation must not be one that the treaty expressly prohibits, whether generally or specifically.
        why: >-
          This is a genuine art 19 condition (paras (a) and (b)), so it is not the answer — it is tempting only because
          it is phrased negatively, like the question.
      - text: The reservation must not be incompatible with the treaty's object and purpose.
        why: >-
          Wrong choice for this "NOT" question — this is also genuinely one of art 19's three conditions, so it is not
          the correct answer.
  - key: q125
    type: mcq
    concept: reservations-to-treaties
    variant-of: q124
    difficulty: 3
    stem: >-
      A treaty aimed at eliminating ozone-depleting emissions is silent on reservations generally, but a state tries to
      reserve against its own core emissions-reduction obligation. Is this reservation permissible under art 19?
    options:
      - text: >-
          No — even though the treaty does not expressly prohibit reservations, this specific reservation is
          incompatible with the treaty's object and purpose, since it strikes at the very obligation the treaty exists
          to impose.
        correct: true
        why: >-
          Correct — this is exactly the ozone-treaty example used in the lecture to illustrate art 19's
          object-and-purpose limb.
      - text: >-
          Yes — since the treaty does not expressly prohibit reservations, any reservation on any provision is
          automatically permissible.
        why: >-
          Wrong — treaty silence on reservations generally does not mean every possible reservation is permissible; art
          19's object-and-purpose test can still exclude a particular reservation.
      - text: >-
          Yes, provided the reserving state also agrees to plant an equivalent number of trees to offset the excluded
          obligation.
        why: >-
          Wrong — art 19's test has nothing to do with offsetting arrangements; it asks whether the reservation itself
          is incompatible with the treaty's object and purpose.
  - key: q126
    type: mcq
    concept: reservations-to-treaties
    difficulty: 2
    stem: Under art 20(4) VCLT, what happens if another state party accepts a permissible reservation?
    options:
      - text: >-
          Both states become parties to the treaty, on the terms modified by the reservation, in their relations with
          each other.
        correct: true
        why: >-
          Correct — acceptance under art 20(4) means the reserving state and the accepting state are bound by the treaty
          together with the reservation, as between themselves.
      - text: >-
          The accepting state is taken to have made the same reservation itself, so the provision is excluded for both
          in all their treaty relations.
        why: >-
          Tempting because acceptance changes the relationship, but under art 20(4) the two simply become parties on the
          modified terms between themselves; the acceptor does not adopt the reservation for its relations with
          everyone.
      - text: >-
          The reservation becomes binding on every other party to the treaty, whether or not they have separately
          accepted it.
        why: >-
          Wrong — under art 20(4), acceptance by one state affects that state's relations with the reserving state;
          other states can still separately object.
  - key: q127
    type: mcq
    concept: reservations-to-treaties
    variant-of: q126
    difficulty: 2
    stem: Under art 20(4), what happens if another state party objects to a permissible reservation?
    options:
      - text: The treaty does not enter into force between the reserving state and the objecting state.
        correct: true
        why: Correct — this is exactly the effect described in the materials for an objection to a permissible reservation.
      - text: >-
          The reserving state is expelled from the treaty for all purposes, including its relations with every other
          party.
        why: >-
          Wrong — an objection only affects the relationship between the objecting state and the reserving state, not
          the reserving state's status with every other party.
      - text: The objecting state itself is deemed to have withdrawn from the treaty entirely.
        why: >-
          Wrong — the objecting state remains a party to the treaty generally; it is only the treaty relationship
          between it and the reserving state that does not come into force.
  - key: q128
    type: mcq
    concept: reservations-to-treaties
    difficulty: 3
    stem: >-
      Under art 20(4), how many other contracting states need to accept a reservation before it becomes effective at
      all?
    options:
      - text: At least one other contracting state.
        correct: true
        why: >-
          Correct — the materials are explicit that a reservation "only becomes effective when at least one other
          contracting state has accepted it".
      - text: A majority of all contracting states must accept it.
        why: >-
          Wrong — the general rule under art 20(4) requires only one accepting state, not a majority, unless a special
          category under art 20(2) or (3) applies.
      - text: Every single other contracting state must accept it before it has any effect at all.
        why: >-
          Wrong — this describes the special unanimity rule under art 20(2) for certain treaty types, not the general
          rule, which needs only one acceptance.
  - key: q129
    type: mcq
    concept: reservations-to-treaties
    variant-of: q128
    difficulty: 3
    stem: >-
      Under art 20(2), when is unanimous acceptance of a reservation required instead of the general one-acceptance
      rule?
    options:
      - text: >-
          Where the limited number of negotiating states and the object and purpose show it must apply in full between
          all.
        correct: true
        why: "Correct — art 20(2) displaces the one-acceptance rule where the limited number of negotiating states and the object and purpose show the treaty must be accepted in its totality by all parties."
      - text: >-
          Whenever the treaty is a human rights or disarmament treaty, since those protect interests shared equally by
          all parties.
        why: >-
          Tempting because such treaties protect shared interests, but art 20(2) turns on the limited number of
          negotiating states and the object and purpose requiring the treaty to apply in its totality, not on subject
          matter.
      - text: Whenever more than 50 states are party to the treaty.
        why: >-
          Wrong — the number 50 does not appear anywhere in art 20(2) or the materials; the test is about a treaty's
          special class requiring uniform application, not a fixed party count.
  - key: q130
    type: mcq
    concept: reservations-to-treaties
    difficulty: 3
    stem: >-
      Under art 20(3), whose acceptance does a reservation to the constituent instrument of an international
      organisation require?
    options:
      - text: The acceptance of the competent organ of that international organisation.
        correct: true
        why: >-
          Correct — art 20(3), as described in the materials, requires acceptance by the organisation's own competent
          organ before the reservation has legal effect.
      - text: The unanimous acceptance of every current staff member of the organisation's secretariat.
        why: Wrong — no such requirement about individual staff members appears anywhere in art 20(3) or the materials.
      - text: No acceptance is needed at all for this special category of treaty.
        why: >-
          Wrong — this is the opposite of art 20(3), which specifically requires the competent organ's acceptance before
          such a reservation takes effect.
  - key: q131
    type: mcq
    concept: reservations-to-treaties
    difficulty: 4
    stem: >-
      What is the "severance" solution to an impermissible reservation, and why does the lecture suggest it sits
      uneasily with a basic principle of consent?
    options:
      - text: >-
          It ignores the invalid reservation and treats the reserving state as fully bound by the whole treaty,
          including the very provision it tried to reserve against — in tension with the rule that a state is only bound
          by what it consents to.
        correct: true
        why: >-
          Correct — this matches the materials' own description of the severance option and its stated tension with the
          consent principle.
      - text: >-
          It removes the reserving state from the treaty entirely, with no obligations at all — and it sits uneasily
          because it seems too harsh a penalty for an innocent mistake.
        why: >-
          Wrong — this describes the first (non-party) solution, not the severance option, and misstates the reasoning
          the materials actually give for the tension.
      - text: >-
          It requires every other party to adopt the same reservation themselves — and it sits uneasily because it would
          change the treaty for everyone.
        why: >-
          Wrong — this is not one of the three solutions described in the materials at all; the severance option
          concerns only the reserving state's own obligations.
  - key: q132
    type: mcq
    concept: reservations-to-treaties
    variant-of: q131
    difficulty: 3
    stem: >-
      Which of the three solutions to an impermissible reservation makes the reserving state's status depend on whether
      it expressly conditioned its consent on the reservation being accepted?
    options:
      - text: "The third solution: a presumed full party, unless its consent was conditional."
        correct: true
        why: Correct — this is precisely the conditional, more nuanced third solution described in the materials.
      - text: The first solution — that the reserving state simply never becomes a party to the treaty at all.
        why: >-
          Wrong — the first solution does not depend on any conditional statement by the reserving state; it applies
          regardless of whether such a condition was expressed.
      - text: The severance solution — that the state becomes fully bound including the reserved provision.
        why: >-
          Wrong — the severance solution also does not turn on whether the state expressed a condition; it treats the
          reservation as simply ignored.
  - key: q133
    type: mcq
    concept: reservations-to-treaties
    difficulty: 2
    stem: Once a reservation is found impermissible under art 19, what is its legal status?
    options:
      - text: Null and void, as a matter of fact, from the very beginning.
        correct: true
        why: >-
          Correct — the materials describe an impermissible reservation as "null and void, ipso facto and ab initio",
          meaning it never had legal effect.
      - text: Valid, but only enforceable against states that did not object to it.
        why: >-
          Wrong — the materials treat an impermissible reservation as void regardless of whether other states object,
          not merely unenforceable against non-objecting states.
      - text: Suspended until the reserving state formally withdraws or amends it.
        why: >-
          Wrong — the reservation is treated as void from the start, not merely suspended pending some later withdrawal
          or amendment.
  - key: q134
    type: mcq
    concept: reservations-to-treaties
    difficulty: 3
    stem: Must another state formally object to an impermissible reservation for that reservation to be treated as invalid?
    options:
      - text: No — it is void whether or not any state objects, though states may still lodge reasoned objections.
        correct: true
        why: >-
          Correct — the materials state other states "are not obliged to neither object nor accept" an impermissible
          reservation for it to be treated as null and void.
      - text: Yes — without at least one formal objection, the reservation is treated as automatically valid.
        why: >-
          Wrong — this reverses the materials' point that invalidity does not depend on another state's objection or
          acceptance.
      - text: >-
          Yes, but only an objection lodged by the depositary (such as the UN Secretary-General) on behalf of all the
          parties counts.
        why: >-
          Tempting because the depositary receives reservations and objections, but it does not object on the parties'
          behalf; an impermissible reservation is void regardless, and no state is obliged to object or accept.
  - key: q135
    type: mcq
    concept: reservations-to-treaties
    difficulty: 4
    stem: >-
      State B ratifies a multilateral human rights convention but attaches a reservation excluding art 3 (a core
      non-discrimination guarantee), which is incompatible with the convention's object and purpose. State B made clear
      that it only wished to be bound if the reservation was accepted. No other state has accepted or objected. Applying
      this week's three-solution framework and art 20(4), what is State B's likely position?
    options:
      - text: >-
          The reservation is impermissible and void; since State B expressly conditioned its consent on the reservation,
          the more likely outcome under the third solution is that State B does not become a party at all, rather than
          being bound without the reservation's benefit.
        correct: true
        why: >-
          Correct — combining art 19's incompatibility test with the third solution's conditional logic, an express
          condition that consent depended on the reservation being accepted points towards non-party status rather than
          full, unconditional membership.
      - text: The reservation is automatically valid because no state has objected to it.
        why: >-
          Wrong — under art 19, incompatibility with the object and purpose makes a reservation impermissible regardless
          of whether any state has objected; silence does not cure an art 19 problem.
      - text: >-
          State B is definitely bound by the whole convention, including art 3, because that is always the outcome for
          an impermissible reservation.
        why: >-
          Wrong — this ignores that the materials describe the outcome for an impermissible reservation as unresolved,
          with three competing solutions, not a single definite rule always producing full membership.
  - key: q136
    type: mcq
    concept: reservations-to-treaties
    difficulty: 1
    stem: Which VCLT article defines a "reservation", as distinct from art 19 (permissibility) and art 20 (effect)?
    options:
      - text: Article 2(1)(d).
        correct: true
        why: >-
          Correct — the definition itself sits in art 2(1)(d), with permissibility and effect dealt with separately in
          arts 19 and 20.
      - text: Article 31.
        why: Wrong — art 31 is the general rule of treaty interpretation, unrelated to defining a reservation.
      - text: Articles 21 and 22.
        why: >-
          Tempting because the slides list arts 19–23 as the reservations provisions, but those govern permissibility
          and effect; the definition of a "reservation" itself sits in art 2(1)(d).
  - key: q137
    type: mcq
    concept: reservations-to-treaties
    variant-of: q136
    difficulty: 2
    contrasts-with:
      - unilateral-statements
    stem: >-
      A reservation is described in art 2(1)(d) as a "unilateral statement". Why does this not mean the general
      unilateral-statements doctrine (Eastern Greenland, Nuclear Tests) applies to it in the same way?
    options:
      - text: >-
          A reservation exists only within the treaty a state is joining; the general doctrine covers standalone
          declarations with no treaty.
        correct: true
        why: >-
          Correct — this reflects why the two are treated as separate concepts in the materials, even though both are
          technically "unilateral" acts by a single state.
      - text: >-
          Because a reservation binds the state only once another party accepts it, whereas a unilateral statement binds
          once addressees rely on it.
        why: >-
          Tempting because acceptance matters for reservations under art 20(4), but a unilateral statement does not
          depend on reliance or any response; the real distinction is that a reservation only exists within a treaty.
      - text: Because only democracies can make reservations, while only monarchies can make unilateral statements.
        why: >-
          Wrong — there is no such distinction anywhere in the materials; the type of government has nothing to do with
          either doctrine.
  - key: q138
    type: truefalse
    set: quickfire
    concept: reservations-to-treaties
    statement: >-
      A reservation expressly authorised by the treaty itself does not require acceptance by any other party to become
      effective.
    answer: true
    why: Correct — the materials state a reservation expressly authorised by the treaty needs no other party's acceptance.
  - key: q139
    type: truefalse
    set: quickfire
    concept: reservations-to-treaties
    statement: >-
      The legal effect of an impermissible reservation is a settled question with one universally agreed answer under
      the VCLT.
    answer: false
    why: >-
      Wrong — the materials describe this as genuinely unresolved, with three competing solutions put forward in the
      literature.
  - key: q140
    type: short
    concept: reservations-to-treaties
    difficulty: 4
    prompt: |
      Explain when a reservation to a multilateral treaty is permissible under art 19 VCLT, what happens once a
      permissible reservation is made (art 20), and what the unresolved problem is with an impermissible one.
    model: |
      Article 19 permits a reservation unless the treaty prohibits reservations altogether, prohibits that
      specific reservation, or the reservation is incompatible with the treaty's object and purpose — the
      lecture's example being a state trying to reserve against its core emissions-reduction duty in an
      ozone-depleting-substances treaty, which would conflict with the treaty's very objective. Once a reservation
      passes art 19, art 20(4) governs its effect: another state may accept it (both become parties on the
      modified terms) or object to it (the treaty then does not enter into force between the reserving and
      objecting states); the reservation only takes effect once at least one other state has accepted it. Special
      categories exist too — art 20(2) requires unanimous acceptance where the treaty's limited membership and
      object and purpose show it must apply in its totality, and art 20(3) requires the acceptance of an
      international organisation's own competent organ for a reservation to its constituent instrument. What
      happens to an impermissible reservation is genuinely unresolved: the reserving state might not become a
      party at all; the reservation might be severed, leaving the state fully bound including the reserved
      provision (in tension with the principle that consent defines a state's obligations); or the state might be
      presumed a full party without the reservation's benefit, unless it expressly conditioned its consent on
      the reservation being accepted. Either way, an impermissible reservation is void from the outset, regardless
      of whether any other state formally objects.
    rubric:
      - id: r1
        criterion: States art 19's three conditions for permissibility accurately, with an example.
        marks: 2
        top-band: All three conditions named correctly, with the ozone-treaty example or an equivalent used well.
        margin-note: All three gates, or just one or two?
        authorities:
          - vclt-art-19
      - id: r2
        criterion: Explains art 20(4)'s accept/object mechanism and the one-acceptance rule.
        marks: 2
        top-band: Explains both accept and object outcomes and the single-acceptance threshold accurately.
        margin-note: What happens on acceptance, and what happens on objection?
        authorities:
          - vclt-art-20
      - id: r3
        criterion: Explains the three unresolved solutions for an impermissible reservation.
        marks: 2
        top-band: States all three solutions accurately, including the tension the severance option creates with consent.
        margin-note: Name all three — non-party, severance, and the conditional third solution.
        authorities:
          - vclt-art-2-1-d
  - key: q141
    type: mcq
    concept: treaty-interpretation
    difficulty: 1
    stem: Which two VCLT articles form the present regime for treaty interpretation?
    options:
      - text: Articles 31 and 32.
        correct: true
        why: "Correct — arts 31 and 32 VCLT are the present regime: art 31 seeks the ordinary meaning in context, and art 32 allows supplementary means; the ICJ treats both as customary international law."
      - text: Articles 19 and 20.
        why: "Tempting because arts 19–20 are core VCLT provisions, but they govern reservations (their permissibility and effect); interpretation is governed by arts 31–32."
      - text: Articles 46 and 53.
        why: "Tempting because both are well-known VCLT articles, but art 46 (breach of internal law) and art 53 (jus cogens) are grounds of invalidity; interpretation sits in arts 31–32."
  - key: q142
    type: mcq
    concept: treaty-interpretation
    variant-of: q141
    difficulty: 1
    stem: Why does it matter that arts 31–32 are recognised as reflecting customary international law?
    options:
      - text: Because non-parties to the VCLT are bound by them too.
        correct: true
        why: >-
          Correct — this is the same reasoning covered elsewhere this week for why VCLT provisions can bind non-parties
          when they reflect customary international law.
      - text: Because it means arts 31 and 32 can be freely ignored by any court that disagrees with them.
        why: >-
          Wrong — recognition as customary international law makes these rules more, not less, authoritative and
          binding, including on non-parties.
      - text: Because it means only common law states are bound by arts 31 and 32.
        why: >-
          Wrong — customary international law binds all states generally, not just those from a particular legal
          tradition such as the common law.
  - key: q143
    type: mcq
    concept: treaty-interpretation
    difficulty: 2
    stem: According to art 31(1) VCLT, how should a treaty be interpreted?
    options:
      - text: >-
          In good faith, in accordance with the ordinary meaning of its terms, in their context, and in light of the
          treaty's object and purpose.
        correct: true
        why: "Correct — art 31(1) requires good faith and the ordinary meaning of the terms, read in their context and in the light of object and purpose; context includes the text, preamble and annexes."
      - text: According to whatever meaning best serves the interpreting state's own national interest.
        why: "Wrong — a self-serving reading is the opposite of the good faith art 31(1) demands; the test is the ordinary meaning of the terms in context and in the light of the treaty's object and purpose."
      - text: Strictly according to the drafters' private intentions, disregarding the treaty's actual text entirely.
        why: >-
          Wrong — art 31(1) centres on the ordinary meaning of the text in context, not on disregarding the text in
          favour of undisclosed private intentions.
  - key: q144
    type: mcq
    concept: treaty-interpretation
    variant-of: q143
    difficulty: 2
    stem: What does "context" include, for the purposes of art 31 interpretation?
    options:
      - text: The text, preamble and annexes, plus related agreements made in connection with its conclusion.
        correct: true
        why: Correct — this matches the materials' description of what "context" covers under art 31.
      - text: >-
          Only material the parties publish after the treaty enters into force, such as later statements by their
          foreign ministries.
        why: >-
          Tempting because later practice can matter, but art 31's "context" is the text, preamble and annexes and
          related agreements made in connection with conclusion, not later ministry statements.
      - text: Newspaper commentary published after the treaty enters into force.
        why: >-
          Wrong — post-conclusion newspaper commentary is not part of "context" under art 31; the materials describe
          context as tied to the treaty's own text and materials connected to its conclusion.
  - key: q145
    type: mcq
    concept: treaty-interpretation
    difficulty: 2
    stem: >-
      Under art 32 VCLT, when can a court have recourse to "supplementary means of interpretation" such as the travaux
      préparatoires?
    options:
      - text: When art 31 leaves the meaning ambiguous or obscure, or the result absurd.
        correct: true
        why: >-
          Correct — this matches art 32's own wording, quoted in the materials, setting out exactly when supplementary
          means become available.
      - text: At any time, as the very first step, before even considering the treaty's ordinary meaning.
        why: >-
          Wrong — this reverses the sequential process the materials describe, where art 31 comes first and art 32 is
          reached only if art 31 leaves genuine difficulty.
      - text: Only if all parties to the treaty unanimously agree in advance to allow it.
        why: >-
          Wrong — no such unanimous prior agreement requirement appears anywhere in art 32 or the materials; the trigger
          is ambiguity or absurdity in the art 31 result.
  - key: q146
    type: mcq
    concept: treaty-interpretation
    variant-of: q145
    difficulty: 3
    stem: >-
      A court applies art 31 to a treaty term and finds the ordinary meaning, in context and in light of the treaty's
      object and purpose, is already perfectly clear. What does the materials suggest the court should do next?
    options:
      - text: >-
          Stop there — courts have refused to resort to preparatory work where the text is already sufficiently clear in
          itself.
        correct: true
        why: >-
          Correct — the materials explicitly note that international courts and tribunals have declined to use the
          travaux préparatoires when the text alone already gives the answer.
      - text: >-
          Always consult the travaux préparatoires anyway, regardless of how clear the text already is, since more
          evidence is always better.
        why: >-
          Wrong — this contradicts the materials' description of art 32 as supplementary, engaged only in cases of
          genuine ambiguity or absurdity, not as a routine additional step.
      - text: Disregard the clear art 31 meaning and adopt whatever meaning the treaty's strongest party prefers.
        why: >-
          Wrong — nothing in the materials supports abandoning a clear art 31 meaning in favour of a party's preference;
          the process is meant to be an objective, holistic search for the treaty's actual meaning.
  - key: q147
    type: mcq
    concept: treaty-interpretation
    difficulty: 3
    stem: Why do the materials describe treaty interpretation as "sequential, not a menu"?
    options:
      - text: Because courts first seek the objective meaning under art 31, and turn to art 32 only afterwards, if needed.
        correct: true
        why: >-
          Correct — this reflects the materials' explicit description of interpretation as a holistic exercise that
          proceeds in a set order, not a free choice between methods.
      - text: Because judges are required to interpret treaties in alphabetical order of the parties' names.
        why: >-
          Wrong — this has nothing to do with the actual sequencing described, which concerns the order of interpretive
          methods (art 31 before art 32), not the parties' names.
      - text: >-
          Because international courts must apply the plain-meaning, teleological, and effectiveness approaches
          simultaneously in every single case, giving each equal weight.
        why: >-
          Wrong — the materials describe a specific, ordered relationship between art 31 and art 32, not simultaneous
          equal application of every historical interpretive theory.
  - key: q148
    type: mcq
    concept: treaty-interpretation
    difficulty: 2
    stem: What did the tribunal in *South China Sea Arbitration* have to decide, applying art 121 UNCLOS?
    options:
      - text: Whether disputed features such as the Spratly Islands were "islands" or mere "rocks" under art 121.
        correct: true
        why: >-
          Correct — this is exactly the interpretive question the tribunal addressed, applying arts 31 and 32 to art 121
          UNCLOS.
      - text: Whether China had validly ratified UNCLOS at all.
        why: >-
          Wrong — the dispute concerned the interpretation and application of art 121 to specific features, not whether
          China had validly ratified UNCLOS as a threshold matter.
      - text: >-
          Whether art 121 UNCLOS should be read according to China's or the Philippines' own domestic law definitions of
          "island".
        why: >-
          Tempting because each party had its own position, but a treaty is governed by international law, so the
          tribunal interpreted art 121 using arts 31–32 VCLT, not either state's domestic definitions.
  - key: q149
    type: mcq
    concept: treaty-interpretation
    variant-of: q148
    difficulty: 3
    stem: >-
      Why did it matter, practically, whether a feature in the South China Sea was classified as an "island" or a
      "rock"?
    options:
      - text: An island gets a 200 nm EEZ; a rock gets only 12 nm.
        correct: true
        why: >-
          Correct — the materials give exactly this practical consequence as the reason the classification was
          "critically important" to the dispute.
      - text: Because only islands, not rocks, can ever be claimed as sovereign territory by any state.
        why: >-
          Wrong — the materials' stated distinction concerns maritime zone entitlements (200 nautical miles versus 12),
          not a blanket rule about territorial sovereignty over rocks generally.
      - text: >-
          Because rocks are automatically transferred to United Nations trusteeship, while islands remain under state
          sovereignty.
        why: >-
          Wrong — no such UN trusteeship mechanism for rocks is described anywhere in the materials; the real-world
          consequence given is about maritime zone entitlements.
  - key: q150
    type: mcq
    concept: treaty-interpretation
    difficulty: 3
    stem: >-
      A state argues that deploying its armed forces along a border, with weapons pointed at a neighbouring state, is
      not a "threat of force" under art 2(4) of the UN Charter, because the Charter does not define that phrase.
      Applying this week's approach to interpretation, how should this argument be assessed?
    options:
      - text: >-
          By applying art 31's ordinary meaning, context and object-and-purpose analysis to the undefined term,
          assessing the facts (positioning, weapons, any communications) against that meaning — the absence of an
          express definition does not mean the term is unanswerable.
        correct: true
        why: >-
          Correct — this mirrors the materials' own worked example, where an undefined Charter term is resolved through
          ordinary interpretive analysis of the facts, not treated as a gap the Charter cannot address.
      - text: >-
          The argument automatically succeeds, because any undefined term in a treaty is legally meaningless and
          unenforceable.
        why: >-
          Wrong — the materials treat undefined terms as requiring interpretation under arts 31–32, not as automatically
          meaningless; courts regularly give undefined terms an ordinary meaning in context.
      - text: The question can only be resolved by amending the UN Charter to add a definition.
        why: >-
          Wrong — treaty interpretation exists precisely so that courts and tribunals can resolve undefined terms
          without needing a formal amendment first.
  - key: q151
    type: mcq
    concept: treaty-interpretation
    difficulty: 2
    stem: What role does "good faith" play in art 31(1)'s general rule of interpretation?
    options:
      - text: >-
          It requires an honest reading that gives real effect to the parties' common intentions, not a self-serving
          one.
        correct: true
        why: >-
          Correct — this reflects the materials' emphasis on good faith as part of the ordinary-meaning-in-context test,
          aimed at genuine, not self-serving, interpretation.
      - text: It requires every treaty dispute to be resolved by a coin toss to avoid any appearance of bias.
        why: >-
          Wrong — this has no basis in the materials; good faith concerns the manner and honesty of interpretation, not
          a random dispute-resolution method.
      - text: >-
          It lets a party depart from the ordinary meaning whenever it sincerely believes another reading better serves
          its national interest.
        why: >-
          Tempting because good faith sounds like sincerity, but it constrains interpretation rather than licensing
          departures; art 31(1) ties good faith to the ordinary meaning in context and the object and purpose.
  - key: q152
    type: mcq
    concept: treaty-interpretation
    difficulty: 4
    stem: >-
      Two parties to a treaty later conclude a separate agreement titled "Agreement Concerning the Interpretation of
      Treaty X". How would this separate agreement likely be used under art 31?
    options:
      - text: As part of the "context" under art 31.
        correct: true
        why: >-
          Correct — the notes give exactly this kind of agreement as an example of context relevant to interpretation
          under art 31.
      - text: >-
          It would be entirely irrelevant, since only the original treaty's own text can ever be considered under art
          31.
        why: >-
          Wrong — this understates art 31's context limb, which specifically extends to related agreements or
          instruments connected to the treaty's conclusion or interpretation.
      - text: It would automatically override and replace the original treaty's text in every respect.
        why: >-
          Wrong — a related interpretive agreement informs the meaning of the original treaty; it does not simply
          override or replace its text wholesale.
  - key: q153
    type: mcq
    concept: treaty-interpretation
    difficulty: 3
    stem: Why do courts, per the materials, refuse to "rewrite" a treaty when interpreting it under arts 31–32?
    options:
      - text: Because interpretation clarifies what the parties agreed; it does not create law they never consented to.
        correct: true
        why: >-
          Correct — the materials expressly state courts "will only try to give meaning and clarity to the ambiguous
          terms of the treaty", not create new obligations.
      - text: Because only the treaty's original drafters are legally permitted to make any changes, even decades later.
        why: >-
          Wrong — this misdescribes the actual reason given, which is about respecting the limits of the interpretive
          function, not about who is personally allowed to redraft the document.
      - text: Because rewriting a treaty is always illegal under the domestic law of every state party.
        why: >-
          Wrong — the materials give an international-law-based reason (respecting party consent and the limited
          interpretive function), not a claim about every state's domestic law.
  - key: q154
    type: mcq
    concept: treaty-interpretation
    difficulty: 2
    stem: Which of these best describes the "textual approach" to treaty interpretation, as discussed in the materials?
    options:
      - text: >-
          Priority is given to the treaty's actual words, read in context, as the primary reference point for its
          meaning.
        correct: true
        why: >-
          Correct — this reflects the materials' description of why the actual text of the treaty is treated as the
          primary reference point.
      - text: >-
          The treaty's words are ignored entirely in favour of what the interpreter believes the parties should have
          agreed to.
        why: >-
          Wrong — this is close to the opposite of the textual approach, which centres the analysis on the treaty's
          actual words rather than an interpreter's preferred outcome.
      - text: Only the treaty's title is examined, with the substantive articles disregarded.
        why: Wrong — the textual approach considers the treaty's substantive text in context, not merely its title.
  - key: q155
    type: mcq
    concept: treaty-interpretation
    difficulty: 3
    stem: >-
      A tribunal interpreting a fisheries treaty considers both the ordinary meaning of "sustainable catch" in its
      context and, when that leaves real ambiguity, the treaty's negotiating history. Which two articles is the tribunal
      applying, and in what order?
    options:
      - text: Article 31 first, then art 32 for the remaining ambiguity.
        correct: true
        why: >-
          Correct — this is exactly the sequential process the materials describe for combining primary and
          supplementary means of interpretation.
      - text: Article 32 first, then art 31, since supplementary means always take priority over the general rule.
        why: >-
          Wrong — this reverses the correct order; art 32 supplementary means are only reached after art 31 leaves
          genuine ambiguity or absurdity, not before it.
      - text: >-
          Article 53, since any ambiguity in a treaty automatically raises a question of validity rather than
          interpretation.
        why: >-
          Wrong — ambiguity in meaning is an interpretation question under arts 31–32, not automatically a validity
          question under art 53, which concerns jus cogens conflicts.
  - key: q156
    type: mcq
    concept: treaty-interpretation
    difficulty: 1
    stem: >-
      According to the materials, which body's jurisprudence has supported the textual approach to treaty
      interpretation?
    options:
      - text: The International Court of Justice and other international courts and tribunals.
        correct: true
        why: >-
          Correct — the materials specifically note the ICJ and other international courts and tribunals have supported
          the textual approach applying to treaty interpretation.
      - text: Only domestic Australian courts, with no international support at all.
        why: >-
          Wrong — the materials describe international-level support (the ICJ and other tribunals), not a purely
          domestic Australian position.
      - text: >-
          The World Trade Organization's Ministerial Conference, acting through formal interpretations it adopts by
          consensus.
        why: >-
          Tempting because WTO bodies do interpret treaties, but the materials attribute support for the textual
          approach to the ICJ and other international courts and tribunals, not a WTO political body.
  - key: q157
    type: mcq
    concept: treaty-interpretation
    difficulty: 2
    stem: >-
      What is the practical exam-answer consequence of citing travaux préparatoires without first working through art
      31?
    options:
      - text: "It is a common, marked-down shortcut: art 32 matters only once art 31 leaves real ambiguity or absurdity."
        correct: true
        why: >-
          Correct — this is exactly the exam-technique warning given in the materials about the correct sequential use
          of arts 31 and 32.
      - text: >-
          It carries no risk, because arts 31 and 32 are alternative methods and a marker will credit either one as long
          as it is applied.
        why: >-
          Tempting because both articles are "means of interpretation", but they are sequential, not a menu: art 32 is
          supplementary and only comes in once art 31 leaves real ambiguity, obscurity or absurdity.
      - text: It is required practice, since art 32 must always be addressed before art 31 in any answer.
        why: >-
          Wrong — this reverses the correct sequence; art 31 must be addressed first, with art 32 used only afterwards
          if needed.
  - key: q158
    type: mcq
    concept: treaty-interpretation
    difficulty: 4
    contrasts-with:
      - reservations-to-treaties
    stem: >-
      A dispute arises over whether a treaty's silence on a specific issue should be read as an implicit prohibition or
      as leaving states free to act. How should this be approached, consistent with this week's materials, and how does
      this differ from asking whether a reservation on the same issue would be permissible?
    options:
      - text: >-
          The silence should be assessed under arts 31–32 — its ordinary meaning in context and light of the object and
          purpose, then supplementary means if genuinely ambiguous — which is a different question from art 19's
          separate test for whether a state may exclude or modify that provision's effect for itself via a reservation.
        correct: true
        why: >-
          Correct — interpreting what a treaty's silence means (arts 31–32) and asking whether a state may reserve
          against a provision (art 19) are two distinct VCLT inquiries, even though both can arise from the same
          underlying provision.
      - text: >-
          Both questions are resolved identically by art 20, since interpretation and reservations are simply two names
          for the same process.
        why: >-
          Wrong — art 20 governs the effect of reservations once permissible, not general treaty interpretation; the two
          inquiries use different articles and different tests.
      - text: >-
          Treaty silence can never be interpreted at all, and only an express reservation can ever change what a treaty
          requires.
        why: >-
          Wrong — arts 31–32 are specifically designed to resolve ambiguity, including silence, through interpretation;
          a reservation is a separate, express mechanism, not the only way to address unclear treaty text.
  - key: q159
    type: truefalse
    set: quickfire
    concept: treaty-interpretation
    statement: >-
      Under art 32 VCLT, supplementary means of interpretation may be used to confirm the meaning reached under art 31,
      or to resolve genuine ambiguity or absurdity.
    answer: true
    why: Correct — this matches art 32's own wording as quoted in the materials.
  - key: q160
    type: truefalse
    set: quickfire
    concept: treaty-interpretation
    statement: >-
      The tribunal in South China Sea Arbitration found that the Spratly Islands had the full legal status of islands
      under UNCLOS.
    answer: false
    why: >-
      Wrong — the tribunal found the opposite, that the Spratly Islands and other disputed features did not have the
      legal status of islands.
pretest:
  - q001
  - q041
  - q081
  - q101
  - q121
cards:
  - type: basic
    concept: treaty-definition-and-form
    front: What are the key elements of a "treaty" under art 2(1)(a) VCLT?
    back: >-
      An international agreement concluded between states, in written form and governed by international law — whether
      in a single instrument or two or more related instruments, and whatever its particular designation.
    source: Week 03 Lecture Slides, slide 6
  - type: cloze
    concept: treaty-definition-and-form
    text: >-
      The VCLT only applies to treaties concluded between {{c1::states}} (art 1); where international organisations are
      parties, the {{c2::1986}} Vienna Convention applies instead.
    source: Week 03 Lecture Slides, slides 4 and 6
  - type: basic
    concept: treaty-definition-and-form
    front: >-
      What did the ICJ find could be a treaty in Aegean Sea (Greece v Turkey), Qatar v Bahrain and Somalia v Kenya
      respectively?
    back: A press communiqué; the written minutes of a meeting; and a Memorandum of Understanding.
    source: Week 03 Lecture Slides, slide 7
  - type: apply
    concept: treaty-definition-and-form
    scenario: Two states' leaders agree over coffee on a tariff rate, then both leave. Nothing is written down.
    answer: >-
      Probably not a treaty — there is no written form and nothing shows an intention to create a binding international
      agreement under art 2(1)(a).
    source: Week 03 Lecture Recording (Live), treaty definition discussion
  - type: basic
    concept: unilateral-statements
    front: How does Crawford (Brownlie's Principles) describe a binding unilateral statement?
    back: >-
      A state evidencing a clear intention to accept obligations vis-à-vis certain other states by a public declaration
      which is not an offer or otherwise dependent on reciprocal undertakings from its addressees.
    source: Week 03 Lecture Slides, slide 8
  - type: cloze
    concept: unilateral-statements
    text: A unilateral statement has no {{c1::reciprocity}} and does not need to be in {{c2::writing}}.
    source: Week 03 Lecture Recording (Live), 00:19:28-00:19:35
  - type: basic
    concept: unilateral-statements
    front: Which two cases do the slides cite for unilateral statements creating binding obligations?
    back: The Eastern Greenland Case (1933) and the Nuclear Test Cases (Australia v France; New Zealand v France) (1974).
    source: Week 03 Lecture Slides, slide 8
  - type: basic
    concept: authority-to-conclude-a-treaty
    front: Which three officials does art 7 VCLT treat as having authority without producing full powers?
    back: Heads of state, heads of government and ministers for foreign affairs.
    source: Week 03 Lecture Recording (Live), 00:30:31-00:32:38
  - type: cloze
    concept: authority-to-conclude-a-treaty
    text: >-
      In the UK, treaties are concluded by the {{c1::Crown}} under the royal prerogative, but s 20 of the Constitutional
      Reform and Governance Act 2010 requires a treaty to be {{c2::laid before Parliament}} for ratification.
    source: Week 03 Lecture Slides, slide 10
  - type: basic
    concept: authority-to-conclude-a-treaty
    front: Are US executive agreements binding under international law?
    back: >-
      Yes — though not brought before the Senate for approval, executive agreements are still binding on the parties
      under international law.
    source: Week 03 Lecture Slides, slide 10
  - type: apply
    concept: authority-to-conclude-a-treaty
    scenario: Australia's Minister for Agriculture signs a fisheries accord in Bali with no letter of full powers.
    answer: >-
      The agriculture minister is not one of art 7's three presumed officials, so authority depends on full powers; in
      Australian practice the Foreign Minister issues an instrument of full powers to any other signatory.
    source: Week 03 Tutorial Task, Hypothetical 1
  - type: basic
    concept: australian-treaty-making-process
    front: Which provision of the Australian Constitution gives the power to conclude treaties, and to whom?
    back: >-
      Section 61 — it gives the power to the executive; in practice the Minister for Foreign Affairs and DFAT have
      responsibility for treaties.
    source: Week 03 Lecture Slides, slide 12
  - type: cloze
    concept: australian-treaty-making-process
    text: >-
      Before signature, all treaty actions must be approved by the {{c1::Federal Executive Council}}; after signature
      the treaty is tabled for scrutiny by {{c2::JSCOT}}, accompanied by a {{c3::National Interest Analysis}}.
    source: Week 03 Reading, Australia's Treaty-Making Process
  - type: basic
    concept: australian-treaty-making-process
    front: What does a National Interest Analysis cover?
    back: >-
      The treaty's social, economic and political impact, why it is in Australia's interest to become a party, how it
      will be implemented domestically, whether Australia could withdraw, and any consultation undertaken.
    source: Week 03 Lecture Recording (Live), 00:26:42-00:27:31
  - type: basic
    concept: australian-treaty-making-process
    front: What did JSCOT Report 224 (November 2024) recommend on the AUKUS naval nuclear propulsion agreement?
    back: >-
      That binding treaty action be taken — after 260 submissions and four public hearings, despite criticism of the
      asymmetric withdrawal provisions.
    source: Week 03 Case Study, JSCOT AUKUS Report
  - type: basic
    concept: consent-to-be-bound-and-entry-into-force
    front: Under art 14 VCLT, when is ratification required?
    back: >-
      If the treaty specifies it; the negotiating parties agreed it was needed; the representative signed subject to
      ratification; or it appeared from the full powers, or was expressed during negotiation, that this was the
      intention.
    source: Week 03 Lecture Slides, slide 20
  - type: cloze
    concept: consent-to-be-bound-and-entry-into-force
    text: >-
      "A treaty enters into force in such manner and upon such date as it may {{c1::provide}} or as the negotiating
      States may {{c2::agree}}" (art {{c3::24}} VCLT).
    source: Week 03 Lecture Slides, slide 21
  - type: basic
    concept: consent-to-be-bound-and-entry-into-force
    front: Why did UNCLOS, opened in 1982, only enter into force in 1994?
    back: >-
      Article 306 required entry into force 12 months after the deposit of the 60th instrument of ratification, and that
      threshold took until 1994.
    source: Week 03 Lecture Slides, slide 22
  - type: apply
    concept: consent-to-be-bound-and-entry-into-force
    scenario: >-
      A state signs a treaty subject to ratification and, before ratifying, takes action that would destroy the very
      thing the treaty protects.
    answer: >-
      Article 18 — a signatory must refrain from acts that would defeat the treaty's object and purpose until it makes
      clear it will not become a party; it need not comply with every detail yet.
    source: Week 03 Lecture Slides, slide 23
  - type: basic
    concept: invalidity-of-treaties
    front: Which grounds are relative invalidity, and which are absolute invalidity?
    back: >-
      Relative (arts 46–50, issues with consent) — error, fraud, corruption of a representative. Absolute (arts 51–53) —
      coercion of a representative, threat or use of force, conflict with jus cogens.
    source: Week 03 Lecture Slides, slides 24-25
  - type: cloze
    concept: invalidity-of-treaties
    text: >-
      A state cannot invoke a violation of its internal law to escape a treaty unless the violation was {{c1::manifest}}
      and concerned a rule of {{c2::fundamental importance}} (art 46 VCLT).
    source: Week 03 Lecture Slides, slide 26
  - type: apply
    concept: invalidity-of-treaties
    scenario: A new government says it is not bound by a treaty its predecessor ratified, because it disagrees with it.
    answer: >-
      Article 46 is unlikely to help — a change of government is not, without more, a manifest violation of a
      fundamentally important internal-law rule (Cameroon v Nigeria).
    source: Week 03 Lecture Recording (Live), 00:53:27-00:53:58
  - type: basic
    concept: invalidity-of-treaties
    front: Give three examples of peremptory norms (jus cogens) from the slides.
    back: >-
      Any three of the prohibition of torture and genocide, the prohibition of aggression, the ban on crimes against
      humanity, the prohibition of piracy, and the right to self-determination.
    source: Week 03 Lecture Slides, slide 25
  - type: basic
    concept: reservations-to-treaties
    front: What are the three art 19 limits on making a reservation?
    back: >-
      A reservation cannot be made if the treaty prohibits reservations, if the treaty prohibits that specific
      reservation, or if it is incompatible with the treaty's object and purpose.
    source: Week 03 Lecture Slides, slide 29
  - type: cloze
    concept: reservations-to-treaties
    text: >-
      If a state {{c1::objects}} to a permissible reservation, the treaty does not enter into force between the
      reserving and objecting states; a reservation takes effect once at least {{c2::one}} other contracting state
      accepts it.
    source: Week 03 Lecture Slides, slide 31
  - type: apply
    concept: reservations-to-treaties
    scenario: >-
      Novaria ratifies the Chemical Weapons Convention but declares it will not provide inspection access under art
      IV(5). Armadonia objects.
    answer: >-
      The declaration purports to exclude a provision's legal effect, so it is a reservation (art 2(1)(d)); it is likely
      incompatible with the object and purpose (art 19(c)), and the three solutions to an impermissible reservation then
      apply.
    source: Week 03 Tutorial Task, Hypothetical 2
  - type: basic
    concept: reservations-to-treaties
    front: What are the three solutions put forward for an impermissible reservation?
    back: >-
      (1) The reserving state does not become a party; (2) severance — it is bound by the whole treaty, including the
      reserved provision; (3) it is presumed a full party without the reservation's benefit, unless it expressly made
      consent conditional on the reservation.
    source: Week 03 Lecture Slides, slide 32
  - type: basic
    concept: treaty-interpretation
    front: What is the general rule of interpretation in art 31(1) VCLT?
    back: >-
      A treaty shall be interpreted in good faith in accordance with the ordinary meaning to be given to its terms in
      their context and in the light of its object and purpose.
    source: Week 03 Lecture Slides, slide 34
  - type: cloze
    concept: treaty-interpretation
    text: >-
      Supplementary means such as the {{c1::travaux préparatoires}} may be used under art 32 when art 31 leaves the
      meaning {{c2::ambiguous or obscure}} or leads to a manifestly absurd or unreasonable result.
    source: Week 03 Lecture Slides, slides 34 and 36
  - type: apply
    concept: treaty-interpretation
    scenario: A tribunal must decide whether a feature in the South China Sea is an "island" or a "rock" under art 121 UNCLOS.
    answer: >-
      It applies art 31 (ordinary meaning, context, object and purpose), then art 32 if needed; classification matters
      because a rock gets 12 nautical miles, an island a 200 nautical mile EEZ.
    source: Week 03 Lecture Slides, slides 37-38; Lecture Recording (Online), 00:40:29-00:42:34
audio:
  title: Week 3 recap — the law of treaties
  minutes: 3
  script: >
    This week is the law of treaties, and it all runs through the Vienna Convention on the Law of

    Treaties of 1969 — the treaty on treaties. It only applies to treaties between states, and even states that

    have not joined it are bound by the provisions that reflect customary international law.


    The definition is in art 2(1)(a): an international agreement concluded between states, in written

    form and governed by international law, in one instrument or several, whatever it is called. A press communiqué in
    Aegean Sea, the minutes of a meeting in Qatar v Bahrain, and a memorandum

    of understanding in Somalia v Kenya were all capable of being treaties — even though Australia itself treats

    its MoUs as less than a treaty.


    Then unilateral statements. These are non-treaty acts, but a state can still bind itself by a clear, public

    declaration of intention that does not depend on anything in return, as in Eastern Greenland and the Nuclear

    Tests cases. No reciprocity, no writing needed.


    Who can bind a state? Each state decides under its own law. The UK Crown concludes treaties but must lay them

    before Parliament; the US needs two-thirds of the Senate for a treaty, yet the President can use executive

    agreements, as with the Paris Agreement. In Australia, s 61 of the

    Constitution gives the power to the executive. Under art 7, heads of state, heads of government and foreign

    ministers need no full powers; everyone else does. Australia's process runs from a negotiating mandate,

    through ExCo approval and signature, to JSCOT scrutiny with a National Interest Analysis, as with AUKUS.


    Consent to be bound is not entry into force. We focus on signature and ratification, with art 14 telling us

    when ratification is needed, and art 24 leaving entry into force to the treaty itself — UNCLOS took twelve

    years. In between, art 18 says do not defeat the object and purpose, while art 25 lets parties apply a

    treaty provisionally.


    Invalidity comes in two kinds: relative, for error, fraud and corruption; absolute, for coercion, force and

    conflict with jus cogens under art 53. And art 46 means you almost never escape a treaty because of your own

    internal law — Cameroon v Nigeria.


    Reservations, defined in art 2(1)(d), let a state join a multilateral treaty without every provision, unless

    art 19 rules them out, especially for incompatibility with object and purpose. Art 20 tells us what

    acceptance and objection do, and an impermissible reservation is void, with three competing solutions.


    Interpretation is sequential: art 31 first — good faith, ordinary meaning, context, object and

    purpose — and art 32's preparatory work only when needed, as in the South China Sea Arbitration.
