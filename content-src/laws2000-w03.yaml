      - text: Exactly 100 calendar days from the date of signature, with no exceptions.
        why: >-
          Wrong — the period is measured in joint sitting days, not fixed calendar days, and lead agencies are told this
          can vary considerably in calendar-day length depending on the parliamentary sitting program.
      - text: There is no time limit; JSCOT can take as long as it wishes to report.
        why: >-
          Wrong — the materials specify a defined period (15 or 20 joint sitting days) within which JSCOT is expected to
          report.
  - key: q068
    type: mcq
    concept: australian-treaty-making-process
    variant-of: q067
    difficulty: 3
    stem: What is a "minor treaty action", and how is it treated differently under JSCOT's process?
    options:
      - text: >-
          A treaty action with negligible national interest impact, such as a technical amendment, which may get
          streamlined scrutiny.
        correct: true
        why: >-
          Correct — the reading specifically describes this streamlined process for minor treaty actions with negligible
          effect in Australia.
      - text: >-
          Any treaty concerning fewer than three other states, which is automatically exempt from all parliamentary
          scrutiny.
        why: >-
          Wrong — the number of other parties is not the test used in the materials; the test is whether the action
          significantly impacts the national interest, and even minor actions still go through a streamlined process,
          not a complete exemption.
      - text: >-
          A treaty action not yet signed, which is exempt from JSCOT scrutiny and from any NIA until ExCo has approved
          its signature.
        why: >-
          Tempting because tabling comes after signature, but "minor" refers to the treaty action's negligible national
          interest impact, not its stage; minor actions still receive (streamlined) parliamentary scrutiny.
  - key: q069
    type: mcq
    concept: australian-treaty-making-process
    difficulty: 2
    stem: >-
      For a bilateral treaty, how does entry into force for Australia typically occur, once domestic procedures are
      complete?
    options:
      - text: Usually by an exchange of diplomatic notes.
        correct: true
        why: Correct — the reading specifies this exchange-of-notes mechanism for bilateral treaties' entry into force.
      - text: Automatically, 12 months after signature, regardless of any domestic steps.
        why: >-
          Wrong — the materials tie entry into force to completion of domestic procedures and (for bilateral treaties)
          an exchange of notes, not a fixed 12-month clock.
      - text: Only once every state in the United Nations has separately ratified the treaty.
        why: >-
          Wrong — this describes a multilateral scenario (like UNCLOS needing 60 ratifications), not the bilateral
          entry-into-force mechanism described here.
  - key: q070
    type: mcq
    concept: australian-treaty-making-process
