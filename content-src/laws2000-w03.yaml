      - text: A reservation, excluding Singapore from certain provisions of the agreement.
        why: >-
          Wrong — a reservation is a different concept altogether (art 2(1)(d) VCLT), about modifying treaty
          obligations, not about authorising a representative to sign.
  - key: q054
    type: mcq
    concept: authority-to-conclude-a-treaty
    difficulty: 3
    stem: >-
      Which of these officials would you assume has authority to sign a treaty without asking to see a letter of full
