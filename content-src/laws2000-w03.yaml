  - key: q075
    type: mcq
    concept: australian-treaty-making-process
    variant-of: q074
    difficulty: 3
    stem: >-
      What outcome did JSCOT ultimately recommend for the 2024 AUKUS Agreement, notwithstanding the withdrawal-provision
