  - slug: treaty-definition-and-form
    title: What is a treaty
    visual: explainer
    visual-brief: The four elements of art 2(1)(a) VCLT as gates a document must pass through before it counts as a treaty.
    related:
      - unilateral-statements
      - consent-to-be-bound-and-entry-into-force
    depends-on: []
    contrasts-with:
