  - key: q071
    type: mcq
    concept: australian-treaty-making-process
    difficulty: 3
    stem: >-
      Why did the 2021 ENNPIA's National Interest Analysis say the agreement was needed, in terms of US and UK domestic
      law?
    options:
      - text: >-
          Because naval nuclear propulsion information is restricted under US domestic law, and the UK's own obligations
          to the US restrict it from sharing such information without a framework like the ENNPIA in force.
        correct: true
        why: >-
          Correct — this is exactly the reasoning given in the NIA, since without the ENNPIA, neither the US nor the UK
          could lawfully share this restricted information with Australia.
      - text: >-
          Because Australian domestic law prohibited any nuclear-related cooperation with foreign states before the
          ENNPIA was signed.
        why: >-
          Wrong — the NIA is explicit that domestic implementation of the ENNPIA "does not require changes to Australian
          laws or regulations"; the restriction described is on the US and UK side, not the Australian side.
      - text: >-
          Because the United Nations Security Council required a new treaty before any nuclear submarine cooperation
          could occur.
        why: >-
          Wrong — nothing in the ENNPIA's NIA attributes the need for the agreement to a Security Council requirement;
          the driver is US and UK domestic disclosure restrictions.
  - key: q072
    type: mcq
