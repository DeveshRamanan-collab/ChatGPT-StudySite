      - text: >-
          It covered only the exchange of naval nuclear propulsion information, replacing the ENNPIA with an identical
          but longer-lasting framework.
        why: >-
          Tempting because it builds on the ENNPIA and lasts until 2075, but the JSCOT report describes it going beyond
