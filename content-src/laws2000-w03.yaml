    options:
      - text: >-
          In each, an act of the domestic executive is needed before the state is bound, though the further checks
          differ.
        correct: true
        why: >-
          Correct — in all three systems, some form of executive action initiates the process, even though the
          additional domestic checks and balances differ considerably between them.
      - text: All three systems require a public referendum before any treaty can be signed.
        why: >-
          Wrong — no referendum requirement is described in the materials for the UK, US or Australian treaty-making
          systems.
      - text: >-
          All three give the judiciary the final say, with each country's highest court reviewing every treaty before it
