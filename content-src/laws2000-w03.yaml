    options:
      - text: That only the UK and US, as "Originating Party", had real room to withdraw.
        correct: true
        why: >-
          Correct — the report records Rothwell describing this as "an enormous amount of flexibility" for the UK and
          US, since only they can be an "Originating Party" under art II(N).
      - text: That the Agreement contained no withdrawal provisions of any kind for any of the three parties.
        why: >-
          Wrong — the Agreement does contain withdrawal provisions; Rothwell's criticism was about their asymmetry, not
          their complete absence.
      - text: That Australia alone could withdraw at any time with no notice, unlike the UK and US.
        why: >-
          Wrong — this reverses Rothwell's actual point, which was that the UK and US have the broader "Originating
