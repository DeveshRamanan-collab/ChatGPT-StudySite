    body: |
      Australia's treaty-making process has six steps. (1) The lead minister seeks a mandate to negotiate from
      the Foreign Minister. (2) The text is negotiated and finalised, consulting other Commonwealth, state and
      territory bodies. (3) A National Interest Analysis (NIA) is prepared and Executive Council (ExCo) approves
      signature. (4) Australia's representative signs — a full-powers instrument is needed unless the signatory is
      the PM or Foreign Minister. (5) The treaty is tabled for the Joint Standing Committee on Treaties (JSCOT),
      which reports within 15–20 joint sitting days on whether binding treaty action should be taken. (6) Once any
      implementing legislation passes, entry into force follows — usually an exchange of diplomatic notes.

      AUKUS illustrates every step with real documents. The 2021 ENNPIA's NIA explains it is needed because US and
      UK domestic law restricts disclosing naval nuclear propulsion information without it, and needs no changes
      to Australian law; it can be terminated on six months' notice. The later 2024 Agreement for Cooperation
      Related to Naval Nuclear Propulsion went through full JSCOT scrutiny (Report 224, November 2024, 260
      submissions, four hearings) before JSCOT recommended binding treaty action. Professor Donald Rothwell
      criticised its asymmetric withdrawal terms — only the UK and US can be an "Originating Party" able to
      withdraw over their own defence assessment, leaving Australia's own exit route comparatively narrow.

      Exam use: walk the six steps in order — nothing binds Australia internationally until ExCo approval and
      signature, and nothing is domestically secure until JSCOT reports.
  - slug: consent-to-be-bound-and-entry-into-force
    title: Consent to be bound, entry into force and provisional application
    visual: simulation
    visual-brief: >-
      A dial with three settings — not bound / provisionally bound (arts 18, 25) / fully bound and in force (arts 14,
      24) — moved by toggling signature, ratification and the treaty's own entry-into-force conditions.
    related:
      - treaty-definition-and-form
      - authority-to-conclude-a-treaty
    depends-on:
      - treaty-definition-and-form
    contrasts-with:
      - invalidity-of-treaties
    cases: []
    authorities:
      - vclt-art-11
      - vclt-art-14
      - vclt-art-18
      - vclt-art-24
      - vclt-art-25
    verify: false
    body: |
      Consent to be bound (arts 11–17) and entry into force (art 24) are distinct questions. Article 11 lists
      several modes of consent — signature, exchange of instruments, ratification, acceptance, approval, accession
      — but Australia mainly uses signature and ratification. Article 14: ratification is required if the treaty
      says so, the negotiating parties agreed it was needed, the signing representative signed subject to
      ratification, or their full powers (or the negotiation) showed that was the state's intention. Dualist states
      like Australia usually need domestic transformation before ratifying, so ratification (not bare signature)
      is the norm here, especially for multilateral treaties.

      Entry into force happens "in such manner and upon such date as [the treaty] may provide or as the
      negotiating States may agree" (art 24). UNCLOS shows the gap: opened for ratification in 1982 with roughly
      100 signatures, but needing 12 months after the 60th ratification (art 306) — not reached until 1994.

      In that gap, arts 18 and 25 differ. Article 18 obliges a state signed subject to ratification, or consented
      pending entry into force, only to refrain from defeating the treaty's purpose — not comply with its details.
      Article 25 lets a treaty (or part) apply provisionally, in full, pending entry into force, if the treaty or
      parties so agree — a stronger, opt-in status.

      Exam use: work out which mode of consent applies, whether the treaty is in force (art 24), and if not,
      whether art 18's minimal duty or art 25's fuller provisional application is engaged.
  - slug: invalidity-of-treaties
    title: Invalidity of treaties
    visual: palace
    visual-brief: >-
      Two chambers — relative invalidity (error, fraud, corruption of a representative) and absolute invalidity
      (coercion of a representative, threat/use of force, jus cogens) — each holding its named grounds.
    related:
      - reservations-to-treaties
    depends-on:
      - consent-to-be-bound-and-entry-into-force
    contrasts-with:
      - consent-to-be-bound-and-entry-into-force
    cases:
      - land-and-maritime-boundary-cameroon-v-nigeria
    authorities:
      - vclt-art-46
      - vclt-arts-48-50
      - vclt-art-53
    verify: false
    body: |
      A treaty can be perfectly concluded — the right people signed it, in writing, all art 2(1)(a) elements met —
      and still be invalid. VCLT grounds split into two chambers. **Relative invalidity**: error (art 48) — a
      material factual mistake, like an erroneous map, important to the decision to join; fraud (art 49) — a
      representative fraudulently misled into signing; corruption of a representative (art 50) — a non-due
      advantage induces a representative to sign who otherwise would not have. **Absolute invalidity**: coercion of
      a representative (art 51) — economic pressure, blackmail, or a threat to their life; threat or use of force
      against the state itself (art 52), which voids the treaty ab initio; as does conflict with a peremptory norm —
      jus cogens (art 53) — accepted by the international community as one from which no derogation is permitted,
      such as the prohibitions on torture, genocide, aggression, piracy, and self-determination.

      Violating a state's own internal law on who could conclude the treaty is deliberately *not* a ground for
      invalidity, except narrowly. *Cameroon v Nigeria* confirms a state cannot invoke its own internal-law
      violation "unless the violation was manifest and concerned a rule of its internal law of fundamental
      importance" (art 46) — protecting the other party's reliance on the treaty.

      Exam use: separate "was consent properly given" (arts 46–51) from "is this treaty simply not yet binding" —
      invalidity is a defect infecting a concluded treaty, not a timing problem.
  - slug: reservations-to-treaties
    title: Reservations
    visual: simulation
    visual-brief: >-
      A gate testing a reservation against three conditions (treaty-wide ban / specific ban / incompatible with object
      and purpose), then a second dial for accept/object/no-response once it passes.
    related:
      - treaty-definition-and-form
      - unilateral-statements
    depends-on:
      - treaty-definition-and-form
    contrasts-with:
      - unilateral-statements
    cases: []
    authorities:
      - vclt-art-2-1-d
      - vclt-art-19
      - vclt-art-20
    verify: false
    body: |
      A reservation is "a unilateral statement, however phrased or named, made by a State, when signing,
      ratifying, accepting, approving or acceding to a treaty, whereby it purports to exclude or to modify the
      legal effect of certain provisions of the treaty in their application to that State" (art 2(1)(d)) — distinct
      from an interpretative declaration, which only explains a state's view without conditioning consent. They
      matter mainly for multilateral treaties, where 160-plus states agreeing on every provision is unrealistic.

      Article 19 permits a reservation unless the treaty bans reservations altogether, bans that one, or it is
      incompatible with the treaty's object and purpose (no reserving against a core emissions-reduction duty in
      an ozone treaty, say). Article 20(4): states may accept a reservation (both become parties on the modified
      terms) or object (the treaty does not enter into force between the two); it takes effect once one state
      accepts it. Some treaties need unanimous acceptance (art 20(2)) or the organisation's own (art 20(3)).

      What happens to an *impermissible* reservation is unresolved: three solutions — the state does not become a
      party at all; the reservation is severed and the state fully bound, including the reserved provision; or the
      state is presumed bound without the reservation's benefit, unless it expressly conditioned consent on
      acceptance. Either way the invalid reservation is void from the start.

      Exam use: run art 19's gates first; only a passing reservation reaches art 20's accept/object machinery; a
      failing one goes to the three unresolved solutions.
  - slug: treaty-interpretation
    title: Treaty interpretation
    visual: diagram
    visual-brief: >-
      The flowchart from art 31 (good faith, ordinary meaning, context, object and purpose) down to art 32's
      supplementary means, reached only if art 31 leaves the meaning ambiguous or absurd.
    related:
      - reservations-to-treaties
    depends-on:
      - treaty-definition-and-form
    contrasts-with: []
    cases:
      - south-china-sea-arbitration-philippines-v-china
    authorities:
      - vclt-art-31
      - vclt-art-32
    verify: false
    body: |
      The present interpretive regime is arts 31–32 VCLT, recognised by the ICJ as reflecting customary
      international law (so it binds non-parties too). Article 31(1): a treaty is interpreted "in good faith in
      accordance with the ordinary meaning to be given to the terms of the treaty in their context and in the
      light of its object and purpose" — context includes the text, preamble, annexes, and any related agreement
      drawn up in connection with its conclusion. Article 32 supplementary means — preparatory work (*travaux
      préparatoires*) and the circumstances of conclusion — are reached only "when the interpretation according to
      article 31 (a) leaves the meaning ambiguous or obscure; or (b) leads to a result which is manifestly absurd
      or unreasonable."

      This is sequential, not a menu: courts first seek the text's objective meaning under art 31, using art 32
      only to confirm it if the text is unclear or absurd — never to rewrite the treaty. *South China Sea
      Arbitration* applied both means to art 121 UNCLOS's "regime of islands" and found the Spratly Islands and
      other features were not "islands" — critical, since a rock gets only 12 nautical miles against an island's
      full 200.

      Exam use: always start with art 31 (ordinary meaning, in context, in light of object and purpose); only cite
      art 32 preparatory work once you have shown art 31 leaves real ambiguity, absurdity or unreasonableness —
      citing travaux préparatoires without first exhausting art 31 is a common, marked-down shortcut.
cases:
  - slug: aegean-sea-continental-shelf-greece-v-turkey
    name: Aegean Sea Continental Shelf (Greece v Turkey)
    citation: "[1978] ICJ Rep 3"
    aglc: Aegean Sea Continental Shelf (Greece v Turkey) [1978] ICJ Rep 3
    facts: |
      Greece and Turkey disputed the delimitation of the continental shelf in the Aegean Sea. Before the case
      reached the ICJ, the two states' Prime Ministers had issued a joint press communiqué after meeting in
      Brussels.
    issue: |
      Whether the press communiqué was itself an "international agreement" capable of creating rights and
      obligations, even though it was not a polished, formal treaty document.
    held: |
      The Court held (this week's slides record) that a press communiqué could be considered a legally binding
      international agreement, at para 96 of the judgment.
    ratio: |
      A document does not need to be a formal, polished instrument to satisfy art 2(1)(a) VCLT's "written form" —
      substance and the parties' apparent intention matter more than the document's label or formality.
    significance: |
      Cited on the slides as the first illustration that intention to create binding obligations can be found in
      an informal written document, not only in a treaty that calls itself one.
    why-here: Used to show a treaty does not need to look like a treaty — even a joint press statement can count.
    verify: true
  - slug: maritime-delimitation-and-territorial-questions-qatar-v-bahrain
    name: Maritime Delimitation and Territorial Questions between Qatar and Bahrain (Qatar v Bahrain)
    citation: (Jurisdiction and Admissibility) [1994] ICJ Rep 112
    aglc: >-
      Maritime Delimitation and Territorial Questions between Qatar and Bahrain (Qatar v Bahrain) (Jurisdiction and
      Admissibility) [1994] ICJ Rep 112
    facts: |
      Qatar and Bahrain were in dispute over territorial and maritime questions. Written minutes were taken of a
      meeting between the two states recording certain commitments.
    issue: |
      Whether the written minutes of the meeting amounted to an international agreement — a treaty — between
      Qatar and Bahrain.
    held: |
      The Court concluded (at paras 25 and 30, per the slides) that the minutes stipulated the commitments to
      which the parties had consented, and so created rights and obligations in international law; it was, in
      fact, a treaty.
    ratio: |
      Minutes of a meeting can constitute a treaty in written form under art 2(1)(a) VCLT where they record the
      parties' actual commitments and consent, even though they are not styled as a treaty.
    significance: |
      Used alongside *Aegean Sea Continental Shelf* to show courts look past formal labelling to whether the
      document records real, consented commitments.
    why-here: Shows meeting minutes can be a treaty if they record the parties' actual consent to commitments.
    verify: true
  - slug: maritime-delimitation-in-the-indian-ocean-somalia-v-kenya
    name: Maritime Delimitation in the Indian Ocean (Somalia v Kenya)
    citation: (Preliminary Objections) [2017] ICJ Rep 3
    aglc: Maritime Delimitation in the Indian Ocean (Somalia v Kenya) (Preliminary Objections) [2017] ICJ Rep 3
    facts: |
      Kenya and Somalia signed a Memorandum of Understanding (MoU) concerning the delimitation of their maritime
      boundary. The MoU was signed, dated, and registered with the United Nations.
    issue: |
      Whether a document styled as a Memorandum of Understanding — normally treated in Australian practice as
      "less than a treaty" — was nonetheless a treaty under international law, and whether it had entered into
      force on signature as it expressly provided.
    held: |
      The Court held the MoU was a treaty under international law (at para 42, per the slides): it recorded an
      agreement by the parties, was signed, dated and registered with the UN, and had all the elements of a
      treaty. By contrast to the general rule in art 24, the MoU expressly stated it entered into force only upon
      signature.
    ratio: |
      An instrument labelled a "memorandum of understanding" can still meet art 2(1)(a) VCLT and be a binding
      treaty at international law, regardless of the "less than treaty" status Australian domestic practice gives
      MoUs.
    significance: |
      Directly used in the slides to contrast international law's treatment of MoUs with Australia's own DFAT
      practice of treating an MoU as having "less than a treaty" status.
    why-here: Shows an MoU can be a treaty internationally even though Australia's own practice treats MoUs as non-treaties.
    verify: true
  - slug: land-and-maritime-boundary-cameroon-v-nigeria
    name: >-
      Case Concerning the Land and Maritime Boundary between Cameroon and Nigeria (Cameroon v Nigeria: Equatorial Guinea
      intervening)
    citation: ICJ Judgment of 10 October 2002
    aglc: >-
      Case Concerning the Land and Maritime Boundary between Cameroon and Nigeria (Cameroon v Nigeria: Equatorial Guinea
      intervening) (Judgment) ICJ, 10 October 2002
    facts: |
      A boundary dispute between Cameroon and Nigeria, with Equatorial Guinea intervening, concerning their land
      and maritime boundary.
    issue: |
      Whether a state can invoke a violation of its own internal (domestic) law about who had competence to
      conclude a treaty as a ground to invalidate its consent to be bound.
    held: |
      The Court confirmed the art 46 VCLT rule: a state cannot invoke the fact that its consent to be bound by a
      treaty was expressed in violation of its internal law, unless the violation was "manifest and concerned a
      rule of its internal law of fundamental importance".
    ratio: |
      Violating one's own domestic law on treaty-making competence does not, without more, invalidate consent to
      be bound — only a manifest violation of a fundamentally important internal rule can.
    significance: |
      Cited directly under the art 46 slide as the authority for this narrow exception, and referred to again by
      the lecturer when a student asked about a change of government not wanting to be bound by a predecessor's
      treaty.
    why-here: The authority for why an internal-law violation is (almost) never a ground to invalidate a treaty.
    verify: true
  - slug: south-china-sea-arbitration-philippines-v-china
    name: South China Sea Arbitration (The Philippines v China)
    citation: (Award on Merits, 12 July 2016)
    aglc: South China Sea Arbitration (The Philippines v China) (Award on Merits, 12 July 2016)
    facts: |
      The Philippines and China disputed the status of various maritime features in the South China Sea,
      including the Spratly Islands, under UNCLOS.
    issue: |
      Whether disputed maritime features — including the Spratly Islands — were "islands" or mere "rocks" under
      art 121 UNCLOS's "regime of islands", which turns on interpreting that undefined provision.
    held: |
      The tribunal, applying both art 31 and art 32 VCLT interpretive means, held that the disputed features,
      including the Spratly Islands, did not have the legal status of islands under UNCLOS.
    ratio: |
      Interpreting an undefined treaty term (like "island") requires applying art 31's ordinary meaning/context/
      object-and-purpose analysis, turning to art 32 supplementary means only to confirm that reading — the
      classification then determines the feature's maritime entitlements (12 nautical miles for a rock, 200 for an
      island).
    significance: |
      The slides' worked example of arts 31–32 in action, and of why correct treaty interpretation can be
      outcome-determinative.
    why-here: Shows arts 31–32 applied together to resolve a real, high-stakes interpretive dispute.
    verify: false
authorities:
  - slug: vclt-art-2-1-d
    title: Vienna Convention on the Law of Treaties 1969 art 2(1)(d)
    kind: treaty
    text: |
      "'reservation' means a unilateral statement, however phrased or named, made by a State, when signing,
      ratifying, accepting, approving or acceding to a treaty, whereby it purports to exclude or to modify the
      legal effect of certain provisions of the treaty in their application to that State."
    gloss: Defines a reservation as a unilateral statement modifying a treaty's effect for the reserving state alone.
    cases: []
    verify: false
  - slug: vclt-art-7
    title: Vienna Convention on the Law of Treaties 1969 art 7
    kind: treaty
    text: |
      A person producing "full powers" during negotiation has authority to represent the state in concluding a
      treaty; heads of state, heads of government and ministers for foreign affairs are considered, by virtue of
      their functions, not to need to produce full powers.
    gloss: Anyone but a head of state, head of government or foreign minister must produce full powers to bind the state.
    cases: []
    verify: true
  - slug: vclt-art-11
    title: Vienna Convention on the Law of Treaties 1969 art 11
    kind: treaty
    text: |
      The consent of a state to be bound by a treaty may be expressed by signature, exchange of instruments
      constituting a treaty, ratification, acceptance, approval or accession, or by any other means if so agreed.
    gloss: Lists the several ways a state can consent to be bound; this unit focuses on signature and ratification.
    cases: []
    verify: true
  - slug: vclt-art-14
    title: Vienna Convention on the Law of Treaties 1969 art 14
    kind: treaty
    text: |
      Ratification will be required if it is specified in the treaty itself; the negotiating parties agreed it
      was needed; the representative who signed did so subject to ratification; or it appeared from the
      representative's full powers, or was expressed during the negotiation, that this was the state's intention.
    gloss: Sets out when a state must ratify a treaty rather than merely sign it.
    cases: []
    verify: false
  - slug: vclt-art-18
    title: Vienna Convention on the Law of Treaties 1969 art 18
    kind: treaty
    text: |
      A State is obliged to refrain from acts which would defeat the object and purpose of a treaty when it has
      signed the treaty (or exchanged instruments constituting it) subject to ratification, acceptance or
      approval, until it has made clear its intention not to become a party; or when it has expressed its consent
      to be bound, pending entry into force, provided entry into force is not unduly delayed.
    gloss: A signatory not yet bound must still not defeat the treaty's object and purpose.
    cases: []
    verify: false
  - slug: vclt-art-19
    title: Vienna Convention on the Law of Treaties 1969 art 19
    kind: treaty
    text: |
      A state may formulate a reservation unless the reservation is prohibited by the treaty; the treaty provides
      that only specified reservations, not including the reservation in question, may be made; or the
      reservation is incompatible with the object and purpose of the treaty.
    gloss: Sets the three conditions under which a reservation to a multilateral treaty is permissible.
    cases: []
    verify: true
  - slug: vclt-art-20
    title: Vienna Convention on the Law of Treaties 1969 art 20
    kind: treaty
    text: |
      A reservation expressly authorised by a treaty does not require any acceptance; other parties may accept or
      object to a permissible reservation (acceptance makes both parties to the treaty and the reservation;
      objection means the treaty does not enter into force between the reserving and objecting states); a
      reservation becomes effective once at least one other contracting state has accepted it; a reservation to
      the constituent instrument of an international organisation requires acceptance by that organisation's
      competent organ.
    gloss: Sets what happens once a reservation is permissible — acceptance, objection, and the one-acceptance rule.
    cases: []
    verify: true
  - slug: vclt-art-24
    title: Vienna Convention on the Law of Treaties 1969 art 24
    kind: treaty
    text: |
      "A treaty enters into force in such manner and upon such date as it may provide or as the negotiating States
      may agree."
    gloss: A treaty enters into force however and whenever it says, or as the negotiating states otherwise agree.
    cases: []
    verify: false
  - slug: vclt-art-25
    title: Vienna Convention on the Law of Treaties 1969 art 25
    kind: treaty
    text: |
      "A treaty or a part of a treaty is applied provisionally pending its entry into force if: (a) the treaty
      itself so provides; or (b) the negotiating States have in some other manner so agreed."
    gloss: Lets a treaty, or part of it, apply before it formally enters into force.
    cases: []
    verify: false
  - slug: vclt-art-31
    title: Vienna Convention on the Law of Treaties 1969 art 31
    kind: treaty
    text: |
      "A treaty shall be interpreted in good faith in accordance with the ordinary meaning to be given to the
      terms of the treaty in their context and in the light of its object and purpose."
    gloss: The general rule of interpretation — ordinary meaning, in context, in light of the treaty's object and purpose.
    cases:
      - south-china-sea-arbitration-philippines-v-china
    verify: false
  - slug: vclt-art-32
    title: Vienna Convention on the Law of Treaties 1969 art 32
    kind: treaty
    text: |
      "Recourse may be had to supplementary means of interpretation, including the preparatory work of the treaty
      and the circumstances of its conclusion, in order to confirm the meaning resulting from the application of
      article 31, or to determine the meaning when the interpretation according to article 31: (a) leaves the
      meaning ambiguous or obscure; or (b) leads to a result which is manifestly absurd or unreasonable."
    gloss: Lets a court use preparatory work only to confirm art 31's meaning or resolve real ambiguity or absurdity.
    cases:
      - south-china-sea-arbitration-philippines-v-china
    verify: false
  - slug: vclt-art-46
    title: Vienna Convention on the Law of Treaties 1969 art 46
    kind: treaty
    text: |
      A state may not invoke the fact that its consent to be bound by a treaty was expressed in violation of a
      provision of its internal law regarding competence to conclude treaties as invalidating its consent, unless
      that violation was "manifest and concerned a rule of its internal law of fundamental importance".
    gloss: A state's own internal-law violation almost never invalidates its consent to a treaty.
    cases:
      - land-and-maritime-boundary-cameroon-v-nigeria
    verify: false
  - slug: vclt-arts-48-50
    title: Vienna Convention on the Law of Treaties 1969 arts 48–50
    kind: treaty
    text: |
      Grounds of relative invalidity going to consent: error (art 48), fraud (art 49) and corruption of a state's
      representative (art 50). Coercion of a representative (art 51), threat or use of force against the state (art 52)
      and conflict with jus cogens (art 53) are instead grounds of absolute invalidity.
    gloss: >-
      The three relative-invalidity grounds — error, fraud and corruption of a representative — all go to defects in a
      state's consent.
    cases: []
    verify: true
  - slug: constitutional-reform-and-governance-act-2010-uk-s20
    title: Constitutional Reform and Governance Act 2010 (UK) s 20
    kind: statute
    text: |
      Requires a treaty to be laid before Parliament before it can be ratified by the UK government.
    gloss: The UK Crown negotiates and signs treaties, but Parliament must see one before ratification.
    cases: []
    verify: true
  - slug: australian-constitution-cth-s61
    title: Constitution (Cth) s 61
    kind: other
    text: |
      Vests the executive power of the Commonwealth, including the power to negotiate and conclude treaties, in
      the Crown exercised through the Governor-General and Ministers.
    gloss: Gives the Commonwealth executive, not Parliament, the constitutional power to conclude treaties.
    cases: []
    verify: true
questions:
  - key: q001
    type: mcq
    concept: treaty-definition-and-form
    difficulty: 1
    set: pretest
    stem: Under art 2(1)(a) VCLT, which of these correctly states the core elements a document needs to be a "treaty"?
    options:
      - text: An international agreement between states, in written form, governed by international law.
        correct: true
        why: >-
          Correct — art 2(1)(a) requires an international agreement concluded between states, in written form and
          governed by international law, whether in one instrument or several and whatever its designation.
      - text: >-
          An agreement between states that is formally titled a "treaty" rather than a convention, agreement or
          protocol.
        why: >-
          Tempting because the word "treaty" is in the definition, but art 2(1)(a) applies "whatever its particular
          designation", so a convention, agreement or protocol can equally be a treaty.
      - text: An agreement signed in person by every party's head of state and then registered with the United Nations.
        why: >-
          Tempting because heads of state can sign without full powers and Somalia v Kenya mentions UN registration, but
          neither personal signature nor registration is an element of art 2(1)(a).
  - key: q002
    type: mcq
    concept: treaty-definition-and-form
    variant-of: q001
    difficulty: 1
    stem: >-
      A student says "an agreement is only a treaty if it is one single, formally bound document." Which fact from this
      week's materials corrects that?
    options:
      - text: >-
          Article 2(1)(a) expressly covers an agreement "embodied in a single instrument or in two or more related
          instruments".
        correct: true
        why: >-
          Correct — the VCLT text itself allows a treaty to be spread across several related instruments, such as a
          treaty plus a protocol.
      - text: >-
          A treaty must be reduced to one consolidated, signed text before it takes effect, so an exchange of letters
          can only be evidence of one.
        why: >-
          Tempting because many treaties are single documents, but art 2(1)(a) expressly covers "two or more related
          instruments", so an exchange of letters or notes can itself be the treaty.
      - text: Only agreements adopted at a single diplomatic conference can ever be treaties.
        why: >-
          Wrong — the lecture gives OPEC as an example of a treaty created "through a number of resolutions", not a
          single conference document.
  - key: q003
    type: mcq
    concept: treaty-definition-and-form
    difficulty: 1
    stem: Which states does the VCLT apply to, according to art 1?
    options:
      - text: Only treaties concluded between states.
        correct: true
        why: >-
          Correct — art 1 VCLT confines the Convention to treaties concluded between states, which is why a separate
          1986 convention exists for treaties involving international organisations.
      - text: Any agreement, whether between states, companies, or individuals.
        why: >-
          Tempting because "agreement" sounds broad, but the VCLT is specifically limited to state-to-state agreements,
          not private or corporate contracts.
      - text: Only agreements the United Nations Secretary-General has formally registered.
        why: >-
          Wrong — UN registration (mentioned for depositing ratifications) is a separate administrative step, not a
          condition of the VCLT's scope under art 1.
  - key: q004
    type: mcq
    concept: treaty-definition-and-form
    variant-of: q003
    difficulty: 2
    stem: >-
      A treaty is concluded between Australia and an international organisation rather than another state. Which
      convention applies instead of the 1969 VCLT?
    options:
      - text: >-
          The 1986 Vienna Convention on the Law of Treaties between International Organizations or between States and
          International Organizations.
        correct: true
        why: >-
          Correct — the lecture explains this newer, 1986 convention exists precisely because the 1969 VCLT's art 1 only
          covers state-to-state treaties.
      - text: The same 1969 VCLT, since "state" is read to include international organisations by analogy.
        why: >-
          Wrong — the lecture is explicit that the 1969 VCLT does not stretch to cover international organisations; a
          separate convention was needed.
      - text: No convention applies, so such agreements are entirely unregulated by international law.
        why: Wrong — the materials describe a specific 1986 convention filling this gap, not a regulatory vacuum.
  - key: q005
    type: mcq
    concept: treaty-definition-and-form
    difficulty: 2
    stem: Why can even a state that never ratified the VCLT still be bound by some of its provisions?
    options:
      - text: >-
          Because many VCLT provisions reflect customary international law, which binds states whether or not they are
          parties.
        correct: true
        why: >-
          Correct — the lecture notes about 116 state parties to the VCLT, but many of its provisions are customary
          international law and so bind non-parties too.
      - text: Because the VCLT automatically binds every UN member state the moment it is adopted.
        why: >-
          Wrong — adoption of a treaty does not automatically bind non-consenting states; the reason non-parties can
          still be bound here is specifically the customary-law overlap.
      - text: >-
          Because the ICJ has held that the VCLT as a whole bound every state once it entered into force in 1980 with
          enough parties.
        why: >-
          Tempting because the VCLT did enter into force in 1980, but entry into force binds only its parties;
          non-parties are bound only by the provisions that reflect customary international law, not the whole
          Convention.
  - key: q006
    type: mcq
    concept: treaty-definition-and-form
    variant-of: q005
    difficulty: 2
    stem: >-
      If you are unsure whether a specific VCLT article (say, art 16) is customary international law, where does the
      lecture say you should look first?
    options:
      - text: Journal articles and textbooks discussing the VCLT, which can point you towards the relevant case law.
        correct: true
        why: >-
          Correct — this is the exact research path the lecture describes for working out whether a given provision has
          customary status.
      - text: >-
          The ICJ's official register of every VCLT article it has declared customary, which the Court publishes and
          updates each year.
        why: >-
          Tempting because the ICJ does decide such questions, but there is no official register; the lecture says to
          start with journal articles and textbooks, which then point you towards the relevant case law.
      - text: You cannot ever determine this, so the question should simply be avoided in an exam answer.
        why: >-
          Wrong — the lecture gives a concrete research method for this exact question; it is not treated as
          unanswerable.
  - key: q007
    type: mcq
    concept: treaty-definition-and-form
    difficulty: 2
    stem: In *Aegean Sea Continental Shelf (Greece v Turkey)*, what did the Court hold could be a treaty?
    options:
      - text: A press communiqué issued after a meeting between the two states' leaders.
        correct: true
        why: >-
          Correct — this week's materials record this case as authority that a press communiqué can be a legally binding
          international agreement.
      - text: >-
          A private letter written by a junior diplomat with no government instructions, which nonetheless purported to
          bind the state on the topic in dispute.
        why: >-
          Wrong — the case concerned a press communiqué issued at leader level, not an unauthorised private letter, and
          this option adds detail not found in the materials.
      - text: A verbal promise made during a phone call between two foreign ministers.
        why: >-
          Wrong — the case is specifically about a written press communiqué, not an unrecorded verbal promise during a
          phone call.
  - key: q008
    type: mcq
    concept: treaty-definition-and-form
    variant-of: q007
    difficulty: 2
    stem: >-
      What did the written minutes of a meeting establish in *Maritime Delimitation and Territorial Questions (Qatar v
      Bahrain)*?
    options:
      - text: They stipulated commitments the parties had consented to, and so were held to be a treaty.
        correct: true
        why: >-
          Correct — the lecture material states the court found the minutes recorded the parties' actual commitments,
          creating rights and obligations in international law.
      - text: They were held to be a mere record of discussion with no legal effect at all.
        why: >-
          Wrong — this is the opposite of the actual holding; the Court found the minutes did create binding rights and
          obligations.
      - text: They were held invalid because minutes can never satisfy art 2(1)(a)'s "written form" requirement.
        why: Wrong — nothing in the materials suggests minutes can never be a treaty; here they were found to be one.
  - key: q009
    type: mcq
    concept: treaty-definition-and-form
    difficulty: 3
    contrasts-with:
      - unilateral-statements
    stem: Contrast a treaty with a unilateral statement. Which best captures the key difference this week's materials draw?
    options:
      - text: >-
          A treaty needs at least two states making reciprocal commitments; a unilateral statement is one state
          committing itself alone.
        correct: true
        why: >-
          Correct — this is exactly the distinction the lecture draws, since a unilateral statement has no reciprocity,
          unlike a treaty.
      - text: A treaty must always be oral, while a unilateral statement must always be written.
        why: >-
          Wrong — this reverses the materials, since a unilateral statement does not need to be in writing, while a
          treaty under art 2(1)(a) does require written form.
      - text: >-
          There is no meaningful difference, since both bind a state under international law and both must be concluded
          in written form.
        why: >-
          Tempting because both can bind a state, but that is where the similarity ends: a unilateral statement has no
          counterpart and need not be in writing, whereas a treaty needs agreement between states in written form.
  - key: q010
    type: mcq
    concept: treaty-definition-and-form
    difficulty: 3
    stem: >-
      The Prime Ministers of Australia and the UK agree "over coffee" that Australia will import UK cars at a 2% tariff,
      then both simply leave. Applying this week's materials, is this a treaty?
    options:
      - text: "Most likely not: nothing shows an intention to create a binding written agreement."
        correct: true
        why: >-
          Correct — the lecture uses exactly this hypothetical, and the class majority (correctly, per the lecturer)
          said no, because it lacks the intention and formality art 2(1)(a) requires.
      - text: Yes, because any agreement between two heads of government about trade automatically satisfies art 2(1)(a).
        why: >-
          Tempting because heads of government can bind a state without full powers, but authority to sign is a separate
          question from whether the exchange itself meets art 2(1)(a)'s elements at all.
      - text: Yes, because the 2% tariff figure was specific enough to enforce, so an intention to be bound can be implied.
        why: >-
          Tempting because specific commitments mattered in Qatar v Bahrain, but there they were recorded in written
          minutes; a precise figure agreed orally over coffee supplies neither written form nor a clear intention to be
          bound.
  - key: q011
    type: mcq
    concept: treaty-definition-and-form
    variant-of: q010
    difficulty: 3
    stem: >-
      Two foreign ministers exchange signed letters, dated and referencing specific quota commitments, agreeing to
      reduce tariffs between their states. Compared to the "over coffee" example, why is this more likely to be a
      treaty?
    options:
      - text: It is written, dated and records specific commitments exchanged between authorised officials.
        correct: true
        why: >-
          Correct — written form and evidence of an intention to be bound (via specific, dated, exchanged commitments)
          are exactly what the coffee-conversation hypothetical lacked.
      - text: >-
          It is more likely a treaty only because letters are always more legally binding than spoken words in every
          context.
        why: >-
          Wrong — this overgeneralises; the materials distinguish the two examples on written form and evidenced
          intention, not a blanket rule that letters always bind and speech never does.
      - text: It is not more likely to be a treaty at all, since both examples involve informal exchanges between officials.
        why: >-
          Wrong — the exchange of signed, dated letters with specific commitments is materially different from an
          unrecorded conversation, which is precisely why the two hypotheticals point to different answers.
  - key: q012
    type: mcq
    concept: treaty-definition-and-form
    difficulty: 2
    stem: >-
      Why does Australia treat a Memorandum of Understanding (MoU) as having "less than a treaty" status, even though
      *Somalia v Kenya* shows an MoU can be a treaty at international law?
    options:
      - text: >-
          Because DFAT practice deliberately treats the MoU label as non-binding, separate from how international law
          would classify the document.
        correct: true
        why: >-
          Correct — the lecture is explicit that this is Australia's own choice of practice, not a rule of international
          law; internationally an MoU with the right elements can still be a treaty.
      - text: >-
          Because the VCLT expressly excludes any document labelled a "memorandum of understanding" from art 2(1)(a), so
          Somalia v Kenya turned on special facts.
        why: >-
          Tempting because the label matters in Australian practice, but art 2(1)(a) applies "whatever its particular
          designation", and Somalia v Kenya held an MoU was a treaty precisely because the label does not decide the
          question.
      - text: Because international law and Australian practice agree that no MoU can ever be legally binding.
        why: >-
          Wrong — this misstates *Somalia v Kenya*, where an MoU was held to be a binding treaty at the international
          level.
  - key: q013
    type: mcq
    concept: treaty-definition-and-form
    variant-of: q012
    difficulty: 3
    stem: >-
      Australia signs an MoU with a Pacific neighbour on fisheries cooperation, styled explicitly as a treaty and
      entering into force on signature, and lodges it with the UN. Under the reasoning in *Somalia v Kenya*, is this MoU
      a treaty at international law?
    options:
      - text: >-
          It could be: the MoU label does not stop a document with the art 2(1)(a) elements being a treaty
          internationally, whatever Australian practice says.
        correct: true
        why: >-
          Correct — *Somalia v Kenya* held an MoU with these features (signed, dated, UN-registered, expressly stating
          when it entered into force) was a treaty at international law.
      - text: >-
          No, because Australia's DFAT practice of treating MoUs as "less than a treaty" binds its treaty partners too,
          so the document stays non-binding internationally.
        why: >-
          Tempting because DFAT practice is real and deliberate, but it is Australia's domestic labelling choice; it
          cannot decide how international law classifies a document that meets art 2(1)(a), as Somalia v Kenya shows.
      - text: No, because UN registration automatically downgrades a document's status to non-binding.
        why: >-
          Wrong — UN registration was one of the facts supporting, not undermining, the MoU being treated as a treaty in
          *Somalia v Kenya*.
  - key: q014
    type: mcq
    concept: treaty-definition-and-form
    difficulty: 1
    stem: >-
      According to the materials, treaties are the source of most of the rules of international law today. Which of the
      following best reflects why a body of rules like the VCLT was needed?
    options:
      - text: Because treaties are so central that a framework for concluding, managing and interpreting them makes sense.
        correct: true
        why: Correct — this reflects the lecture's own reasoning for why the VCLT ("the treaty on treaties") exists.
      - text: >-
          Because without the VCLT no state could be bound by customary international law, which needed a treaty to give
          it written form.
        why: >-
          Tempting because the VCLT and custom overlap, but custom binds states without any treaty; the VCLT was needed
          because treaties are so central that a framework for how they are made and interpreted makes sense.
      - text: >-
          Because the United Nations Charter required every member state to adopt a single, unified law of treaties by
          1969.
        why: Wrong — nothing in the materials attributes the VCLT's adoption to a UN Charter mandate with that deadline.
  - key: q015
    type: mcq
    concept: treaty-definition-and-form
    difficulty: 4
    stem: >-
      A series of five UN General Assembly resolutions, adopted over several years and cross-referencing each other,
      together establish an international organisation with a governing council, budget contributions, and dispute
      procedures for member states. Using art 2(1)(a), how should this be classified?
    options:
      - text: >-
          It can be a treaty in written form, since a treaty may be embodied in two or more related instruments and the
          lecture gives exactly this kind of resolution-based creation (as with OPEC) as an example.
        correct: true
        why: >-
          Correct — art 2(1)(a) allows related instruments, and the lecture cites OPEC's creation through resolutions as
          precisely this kind of case.
      - text: >-
          It cannot be a treaty because UN General Assembly resolutions are never binding on member states under any
          circumstances.
        why: >-
          Wrong — the classification question here is about form (can resolutions embody a treaty), not about the
          general non-binding character of ordinary GA resolutions; the materials show resolutions can form a treaty.
      - text: >-
          It cannot be a treaty unless it is consolidated into a single physical document before being registered with
          the UN.
        why: >-
          Wrong — art 2(1)(a) expressly allows an agreement in "two or more related instruments", so consolidation into
          one document is not required.
  - key: q016
    type: mcq
    concept: treaty-definition-and-form
    variant-of: q015
    difficulty: 3
    stem: >-
      A treaty is concluded and shortly afterwards a protocol is agreed and attached to it. What is the status of the
      protocol?
    options:
      - text: >-
          The protocol also has the status of a treaty, since a treaty can be embodied in two or more related
          instruments.
        correct: true
        why: >-
          Correct — the lecture explicitly says a protocol "will have the status of a treaty", consistent with art
          2(1)(a)'s allowance for related instruments.
      - text: >-
          The protocol is an explanatory annex that binds only if it is later folded into the main treaty text by a
          formal amendment.
        why: >-
          Tempting because protocols often supplement a main treaty, but the lecture is clear that a protocol has the
          status of a treaty in its own right; no amendment folding it into the main text is needed.
      - text: The protocol only binds states that were not already party to the original treaty.
        why: >-
          Wrong — nothing in the materials limits a protocol's binding effect to non-parties of the underlying treaty;
          the point made is simply that it too is a treaty.
  - key: q017
    type: truefalse
    set: quickfire
    concept: treaty-definition-and-form
    statement: >-
      The VCLT applies only to written agreements concluded between states, not to agreements between a state and an
      international organisation.
    answer: true
    why: >-
      Correct — art 1 VCLT confines the Convention to state-to-state treaties; a separate 1986 convention covers
      agreements involving international organisations.
  - key: q018
    type: truefalse
    set: quickfire
    concept: treaty-definition-and-form
    statement: A document must be labelled "treaty" or "convention" to satisfy art 2(1)(a) VCLT.
    answer: false
    why: >-
      Wrong direction — art 2(1)(a) applies "whatever its particular designation", so an agreement, protocol or exchange
      of notes can equally be a treaty.
  - key: q019
    type: truefalse
    set: quickfire
    concept: treaty-definition-and-form
    statement: In *Qatar v Bahrain*, the Court held that written minutes of a meeting could constitute a treaty.
    answer: true
    why: >-
      Correct — the minutes recorded commitments the parties had consented to, and the Court held this created binding
      rights and obligations, i.e. a treaty.
  - key: q020
    type: short
    concept: treaty-definition-and-form
    difficulty: 3
    prompt: |
      Using art 2(1)(a) VCLT and the case law from this week, explain what makes a document a "treaty" under
      international law, and why a document's label (e.g. "memorandum of understanding") is not decisive.
    model: |
      A treaty under art 2(1)(a) VCLT is an international agreement concluded between states, in written form,
      and governed by international law — whether in a single instrument or several related ones, "whatever its
      particular designation". The label a document carries is irrelevant: courts look at substance. In *Aegean
      Sea Continental Shelf*, a press communiqué was capable of being a binding agreement; in *Qatar v Bahrain*,
      written minutes recording the parties' consented commitments were held to be a treaty; and in *Somalia v
      Kenya*, a signed, dated MoU registered with the UN was held to be a treaty at international law, even
      though Australia's own DFAT practice treats MoUs as having "less than a treaty" status. The consistent
      thread is that courts ask whether the document, in written form, records an actual intention by states to
      create rights and obligations governed by international law — not what the parties chose to call it.
    rubric:
      - id: r1
        criterion: >-
          States the four elements of art 2(1)(a) (states, written form, governed by international law, any
          designation).
        marks: 2
        top-band: Quotes or closely paraphrases all four elements accurately.
        margin-note: Which element is missing?
        authorities:
          - vclt-art-2-1-a
      - id: r2
        criterion: Explains that the label used does not determine treaty status.
        marks: 1
        top-band: Explicitly ties this to "whatever its particular designation".
        margin-note: Say why the label doesn't matter.
        authorities:
          - vclt-art-2-1-a
      - id: r3
        criterion: Uses at least two of the three cases (Aegean Sea, Qatar v Bahrain, Somalia v Kenya) accurately.
        marks: 2
        top-band: Uses the cases to show substance-over-form with correct holdings.
        margin-note: Which case, and what did it actually hold?
        authorities: []
      - id: r4
        criterion: Notes the Australia/DFAT MoU practice as distinct from the international-law position.
        marks: 1
        top-band: Clearly distinguishes Australia's domestic practice from the international-law classification.
        margin-note: Domestic practice vs international law — keep these separate.
        authorities: []
  - key: q021
    type: mcq
    concept: unilateral-statements
    difficulty: 1
    stem: >-
      According to Crawford's *Brownlie's Principles*, quoted in the lecture, what makes a unilateral statement capable
      of creating a binding obligation?
    options:
      - text: >-
          A state evidences a clear intention to accept obligations towards other states by a public declaration that is
          not an offer or dependent on reciprocal undertakings.
        correct: true
        why: >-
          This is close to the exact quoted definition used in the lecture, capturing both the clear intention and the
          absence of any reciprocal undertaking from the addressee states.
      - text: A state signs a written document in the presence of at least one witness from another state.
        why: >-
          Wrong — nothing in the quoted definition requires a witness or a signature; a unilateral statement need not
          even be in writing.
      - text: A state secretly resolves internally to follow a certain policy, without ever making any public statement.
        why: >-
          Wrong — the definition requires a public declaration; a purely internal, undisclosed resolution cannot be the
          kind of unilateral statement described.
  - key: q022
    type: mcq
    concept: unilateral-statements
    variant-of: q021
    difficulty: 2
    stem: >-
      Which feature distinguishes a unilateral statement from an ordinary diplomatic promise made in private, off the
      record?
    options:
      - text: It is public and made with a clear intention to be bound.
        correct: true
        why: >-
          Correct — the Crawford/Brownlie definition specifically requires a public declaration evidencing a clear
          intention to accept obligations, not a passing private remark.
      - text: A unilateral statement must be delivered at the United Nations headquarters in New York.
        why: >-
          Wrong — nothing in the materials ties unilateral statements to a particular location; what matters is the
          public, intentional character of the declaration.
      - text: A unilateral statement must always be accompanied by a formal treaty signature.
        why: >-
          Wrong — a unilateral statement is specifically a "non-treaty" action, so it does not need any accompanying
          treaty signature.
  - key: q023
    type: mcq
    concept: unilateral-statements
    difficulty: 2
    stem: Why is a unilateral statement described as lacking "reciprocity"?
    options:
      - text: Because only one state commits itself, without any other state agreeing to do anything in exchange.
        correct: true
        why: >-
          Correct — this is exactly the point the lecture makes, since there is no counterpart state agreeing to do
          something in return, unlike a treaty.
      - text: >-
          Because it binds only the declaring state until another state reciprocates with a matching declaration of its
          own.
        why: >-
          Tempting because reciprocity sounds like something that should follow, but a unilateral statement binds
          without any matching declaration; "no reciprocity" means no other state has to do anything in exchange.
      - text: Because it must always be withdrawn within 24 hours of being made.
        why: Wrong — there is no such time limit described anywhere in this week's materials on unilateral statements.
  - key: q024
    type: mcq
    concept: unilateral-statements
    variant-of: q023
    difficulty: 1
    stem: Does a unilateral statement require another state to accept it before it can bind the declaring state?
    options:
      - text: >-
          No — the declaring state can be bound by its own clear, public declaration without needing any other state's
          acceptance.
        correct: true
        why: >-
          Correct — the whole point of a unilateral statement is that it is not "an offer or otherwise dependent on
          reciprocal undertakings", so no acceptance by another state is needed.
      - text: >-
          Yes — at least one other state must formally accept the declaration in writing for it to have any legal
          effect.
        why: >-
          Wrong — this describes how a treaty works (both parties consenting), not a unilateral statement, which binds
          the declaring state on its own.
      - text: >-
          Yes — the declaring state is bound only once the addressee states rely on the declaration and notify it that
          they accept it.
        why: >-
          Tempting because reliance featured in the Nuclear Tests facts, but the Crawford definition describes a
          declaration "not an offer or otherwise dependent on reciprocal undertakings"; no acceptance or notification is
          needed.
  - key: q025
    type: mcq
    concept: unilateral-statements
    difficulty: 2
    stem: Must a unilateral statement be made in writing to be binding?
    options:
      - text: No — unlike a treaty, it need not be in writing.
        correct: true
        why: >-
          Correct — this is a direct point made in the lecture, and it is one of the clearest contrasts between a
          unilateral statement and a treaty.
      - text: Yes — art 2(1)(a) VCLT requires all binding international statements, unilateral or not, to be in writing.
        why: >-
          Wrong — art 2(1)(a)'s written-form requirement applies to treaties specifically; unilateral statements are a
          separate, non-treaty category not subject to that requirement.
      - text: Yes, but only if the statement concerns a maritime boundary.
        why: >-
          Wrong — there is no such subject-matter exception described in the materials; the general rule is that a
          unilateral statement need not be written at all.
  - key: q026
    type: mcq
    concept: unilateral-statements
    difficulty: 2
    stem: What do the *Eastern Greenland Case* and the *Nuclear Test Cases* illustrate, as used together in the slides?
    options:
      - text: >-
          That a state's own public, unilateral declaration can create a binding international obligation for that
          state.
        correct: true
        why: >-
          Correct — both cases are cited together as the two illustrations that unilateral statements can create
          internationally binding obligations.
      - text: >-
          That only cases decided by the Permanent Court of International Justice are ever cited in modern international
          law teaching.
        why: >-
          Wrong — while the Eastern Greenland Case was decided by the PCIJ, the Nuclear Test Cases were decided later by
          the ICJ, so this is not the point being illustrated.
      - text: That France and Denmark have a long history of territorial disputes with each other.
        why: >-
          Wrong — these are two separate, unrelated disputes (Eastern Greenland and the Pacific nuclear tests); they are
          not both about a Denmark-France dispute.
  - key: q027
    type: mcq
    concept: unilateral-statements
    variant-of: q026
    difficulty: 3
    stem: In the Nuclear Test Cases, what kind of act by France is treated as an example of a unilateral statement?
    options:
      - text: Public declarations by French officials showing an intention to be bound, even absent any treaty.
        correct: true
        why: >-
          Correct — this reflects the lecture's characterisation of the Nuclear Test Cases as an illustration of a
          state's own public statement creating a binding obligation.
      - text: A secret internal French cabinet memorandum never disclosed to the public or to Australia or New Zealand.
        why: >-
          Wrong — a unilateral statement must be a public declaration; an undisclosed internal memorandum could not
          function as the kind of statement the case illustrates.
      - text: A bilateral treaty signed between France and Australia specifically dealing with nuclear testing.
        why: >-
          Wrong — the whole point of citing this case under "unilateral statements" is that no treaty with Australia or
          New Zealand was involved.
  - key: q028
    type: mcq
    concept: unilateral-statements
    difficulty: 3
    contrasts-with:
      - treaty-definition-and-form
    stem: >-
      A state's foreign minister publicly declares, at a press conference, that the state will unconditionally never use
      a certain weapon again. No other state responds. Is this capable of binding the declaring state?
    options:
      - text: >-
          Yes — a public declaration evidencing a clear intention to accept an obligation can bind the declaring state
          as a unilateral statement, with no response from other states needed.
        correct: true
        why: >-
          Correct — this matches the Crawford/Brownlie definition and the reasoning in the Eastern Greenland and Nuclear
          Test Cases, where no other state's acceptance was required.
      - text: >-
          No — without a second state responding and agreeing to reciprocal terms, nothing has been created, since every
          binding international statement requires two states.
        why: >-
          Tempting because this is how a treaty works, but it wrongly imports the treaty requirement of reciprocity into
          a unilateral statement, which by definition needs no counterpart.
      - text: >-
          No — only written declarations lodged with the United Nations Secretary-General can ever bind a state
          unilaterally.
        why: >-
          Wrong — there is no such formal lodging requirement described in the materials for a unilateral statement to
          be capable of binding its maker.
  - key: q029
    type: mcq
    concept: unilateral-statements
    variant-of: q028
    difficulty: 3
    stem: >-
      A junior trade attaché, without any government authorisation, tells a journalist off the record that their state
      "probably" will not impose new tariffs. Is this a binding unilateral statement?
    options:
      - text: Unlikely — it is not a clear, public, authorised declaration of an intention to be bound.
        correct: true
        why: >-
          Correct — the materials describe unilateral statements as clear public declarations evidencing intention,
          which an unauthorised, hedged, off-the-record remark by a junior official does not satisfy.
      - text: Yes — any statement made by any government employee automatically binds the state internationally.
        why: >-
          Wrong — this vastly overstates the doctrine; nothing in the materials suggests every remark by every official,
          however junior or unauthorised, binds the state.
      - text: >-
          Yes, but only because journalists are treated as agents of the international community under customary
          international law.
        why: >-
          Wrong — this is not a rule found anywhere in this week's materials, and inventing a special role for
          journalists misstates the doctrine entirely.
  - key: q030
    type: mcq
    concept: unilateral-statements
    difficulty: 2
    contrasts-with:
      - reservations-to-treaties
    stem: >-
      A reservation to a treaty is also made "unilaterally" by a state. Why does this not make a reservation the same
      thing as the unilateral statements covered in this concept?
    options:
      - text: >-
          A reservation modifies obligations under a treaty the state is joining; the unilateral statements here stand
          alone, unconnected to any treaty.
        correct: true
        why: >-
          Correct — a reservation (art 2(1)(d) VCLT) operates only within, and by reference to, a treaty the state is
          becoming party to; the unilateral statements in this concept (Eastern Greenland, Nuclear Tests) create
          obligations with no treaty involved at all.
      - text: A reservation is made orally, while a unilateral statement must always be written.
        why: >-
          Wrong — this reverses the materials, since a unilateral statement need not be written at all, while a
          reservation (as a statement made "when signing, ratifying...") is naturally tied to written treaty procedure.
      - text: >-
          There is no real difference — both are unilateral acts binding the state without another state's acceptance,
          so one doctrine governs both.
        why: >-
          Tempting because art 2(1)(d) calls a reservation a "unilateral statement", but a reservation operates inside a
          treaty and its effect depends on other states' acceptance or objection under art 20, unlike a standalone
          declaration.
  - key: q031
    type: mcq
    concept: unilateral-statements
    difficulty: 4
    stem: >-
      A coastal state, without negotiating any treaty, issues a public proclamation extending its exclusive fishing
      zone, and several neighbouring states begin observing the new limit in their own fishing practices. Which legal
      category best captures the proclamation itself?
    options:
      - text: A unilateral statement — one state's public declaration, with no treaty behind it.
        correct: true
        why: >-
          Correct — the proclamation is exactly the sort of public, self-standing declaration this concept covers; the
          neighbouring states' later practice is a separate question from the proclamation's own legal character.
      - text: >-
          A treaty, because several states later accepted the new limit in practice, which supplies the agreement art
          2(1)(a) needs.
        why: >-
          Tempting because other states' conduct looks like agreement, but observing a limit is not concluding a written
          agreement; the proclamation itself is one state's declaration with no reciprocal undertaking.
      - text: A reservation, because it modifies the state's obligations under existing maritime law.
        why: >-
          Wrong — a reservation is specifically a statement made when joining a treaty (art 2(1)(d)); this proclamation
          was not made in the course of becoming party to any treaty.
  - key: q032
    type: mcq
    concept: unilateral-statements
    difficulty: 1
    stem: >-
      True or false framing aside — is a unilateral statement classified in this week's materials as a "treaty" action
      or a "non-treaty" action?
    options:
      - text: A "non-treaty" action, though still capable of creating binding obligations.
        correct: true
        why: >-
          Correct — the lecture slides expressly label unilateral statements as "'Non-treaty' actions giving rise to
          legally binding obligations".
      - text: A treaty action, since anything binding under international law is necessarily a treaty.
        why: >-
          Wrong — the materials expressly treat these as a separate, non-treaty category, showing that not everything
          binding under international law is a treaty.
      - text: Neither — unilateral statements are treated in the materials as having no legal significance at all.
        why: >-
          Wrong — the whole point of covering unilateral statements this week is that they can create binding
          obligations, so they are not legally insignificant.
  - key: q033
    type: mcq
    concept: unilateral-statements
    difficulty: 2
    stem: What best describes the relationship between a "counterpart" state and a unilateral statement?
    options:
      - text: There is none — one state commits itself alone, with no state agreeing to anything in return.
        correct: true
        why: >-
          Correct — the lecture is explicit that with a unilateral statement "you don't have another party... that you
          agree to do something with".
      - text: The counterpart state must formally ratify the unilateral statement within twelve months.
        why: >-
          Wrong — there is no such ratification requirement for a unilateral statement anywhere in the materials; it
          binds the declaring state without any counterpart action.
      - text: >-
          The counterpart state is whichever state benefits most from the declaration, regardless of whether it
          responds.
        why: >-
          Wrong — the materials do not identify any "counterpart" state for a unilateral statement at all; that is
          precisely what makes it unilateral.
  - key: q034
    type: mcq
    concept: unilateral-statements
    variant-of: q033
    difficulty: 2
    stem: Why can a unilateral statement bind a state even where the states that benefit from it never respond at all?
    options:
      - text: >-
          Because the obligation comes from the declaring state's own clear intention, not from any response by the
          beneficiaries.
        correct: true
        why: >-
          Correct — this reflects the "not... dependent on reciprocal undertakings from its addressees" language quoted
          in the lecture.
      - text: >-
          Because under the VCLT a beneficiary state's silence counts as acceptance of the declaration, completing an
          agreement between them.
        why: >-
          Tempting because silence can matter elsewhere in international law, but no VCLT article deems silence
          acceptance here; a unilateral statement binds because of the declaring state's own intention, with no
          agreement formed.
      - text: It cannot — a unilateral statement only becomes binding once at least one other state formally responds.
        why: >-
          Wrong — this is inconsistent with the materials, which describe the obligation as arising from the declaring
          state's own intention alone.
  - key: q035
    type: mcq
    concept: unilateral-statements
    difficulty: 3
    stem: >-
      How does the requirement of a "clear intention to accept obligations" in a unilateral statement compare to a state
      merely expressing a political aspiration or hope?
    options:
      - text: >-
          A clear intention is more demanding: a vague hope or aspiration, without more, does not show the commitment
          the doctrine requires.
        correct: true
        why: >-
          Correct — the definition specifically requires a "clear intention to accept obligations", which is a higher
          bar than merely expressing a hope or aspiration.
      - text: >-
          They are treated identically — any positive statement about the future automatically creates a binding
          unilateral obligation.
        why: >-
          Wrong — this would make almost every political statement legally binding, which is inconsistent with the
          "clear intention" requirement in the definition actually used.
      - text: >-
          A political aspiration is always more binding than a clear commitment, because aspirations are harder to walk
          back from politically.
        why: >-
          Wrong — this inverts the legal test; political difficulty in reversing a statement is not the standard used to
          determine whether a unilateral statement is legally binding.
  - key: q036
    type: mcq
    concept: unilateral-statements
    difficulty: 3
    stem: Which of the following would most weaken an argument that a state's statement was a binding unilateral statement?
    options:
      - text: Evidence that the statement was expressly conditional on another state doing something first in return.
        correct: true
        why: >-
          Correct — a unilateral statement is specifically "not... dependent on reciprocal undertakings", so an express
          condition on the other state's reciprocal action pulls the statement back towards ordinary (conditional,
          reciprocal) dealings rather than a true unilateral commitment.
      - text: >-
          Evidence that the statement was made publicly, by an authorised official, using clear and unconditional
          language.
        why: >-
          Wrong — these features support, rather than weaken, a finding that the statement was a genuine unilateral
          statement, since they show a clear, unconditional, public intention.
      - text: Evidence that the statement was reported in multiple international news outlets.
        why: >-
          Wrong — wide media coverage does not itself weaken the case for a binding unilateral statement; if anything,
          it supports the "public declaration" element of the definition.
  - key: q037
    type: mcq
    concept: unilateral-statements
    difficulty: 1
    stem: Which scholarly source does the lecture quote for the definition of a unilateral statement?
    options:
      - text: Crawford's *Brownlie's Principles (of Public International Law)*.
        correct: true
        why: >-
          Correct — the lecture slide attributes the quoted definition of unilateral statements to Crawford, *Brownlie's
          Principles*.
      - text: The VCLT's own art 2, in the same way it defines a treaty and a reservation.
        why: >-
          Wrong — unlike "treaty" and "reservation", which are defined in VCLT art 2, the definition of a unilateral
          statement used here comes from an academic text, not the Convention itself.
      - text: A judgment of the International Court of Justice specifically defining the term "unilateral statement".
        why: >-
          Wrong — the quoted definition is attributed to a textbook (Crawford's *Brownlie's Principles*), not to any
          single ICJ judgment.
  - key: q038
    type: mcq
    concept: unilateral-statements
    variant-of: q037
    difficulty: 2
    stem: >-
      Why does it matter, for an exam answer, that the unilateral statement doctrine comes from scholarly writing and
      case law rather than being defined in the VCLT itself?
    options:
      - text: >-
          Because the VCLT (arts 1–2) is confined to treaties, so a doctrine covering non-treaty unilateral acts
          necessarily has to be sourced elsewhere, in customary international law and case law such as Eastern Greenland
          and the Nuclear Test Cases.
        correct: true
        why: >-
          Correct — since the VCLT only governs treaties, unilateral statements (expressly "non-treaty" actions) are
          necessarily governed by other sources, which is exactly why the lecture draws on Crawford's textbook and the
          two named cases rather than a VCLT article.
      - text: >-
          It doesn't matter at all, since every rule of international law must ultimately trace back to a specific VCLT
          article.
        why: >-
          Wrong — this is factually incorrect; large areas of international law, including unilateral statements, are
          governed by customary international law and case law rather than the VCLT.
      - text: >-
          It matters only because scholarly writing is never treated as a source of international law by the
          International Court of Justice.
        why: >-
          Wrong — this misstates the point; art 38(1) ICJ Statute lists "the teachings of the most highly qualified
          publicists" as a subsidiary means for determining rules of law, so scholarly writing is not irrelevant.
  - key: q039
    type: truefalse
    set: quickfire
    concept: unilateral-statements
    statement: A unilateral statement requires another state's acceptance before it can bind the declaring state.
    answer: false
    why: >-
      Wrong direction — a unilateral statement is specifically "not... dependent on reciprocal undertakings from its
      addressees", so no other state's acceptance is required.
  - key: q040
    type: truefalse
    set: quickfire
    concept: unilateral-statements
    statement: >-
      The Eastern Greenland Case and the Nuclear Test Cases are both cited as examples of unilateral statements creating
      binding obligations.
    answer: true
    why: Correct — the slides cite both cases together as illustrations of this exact proposition.
  - key: q041
    type: mcq
    concept: authority-to-conclude-a-treaty
    difficulty: 1
    set: pretest
    stem: >-
      Under art 7 VCLT, which three officials do not need to produce a letter of full powers to negotiate or sign a
      treaty?
    options:
      - text: A head of state, a head of government, and a minister for foreign affairs.
        correct: true
        why: >-
          Correct — these are the three officials the lecture names as presumed to already have the authority, without
          needing to produce full powers.
      - text: The head of state, the head of government and the attorney-general, as the state's chief law officer.
        why: >-
          Tempting because the Attorney-General's Department helps manage treaties in Australia, but art 7 names the
          minister for foreign affairs, not the attorney-general, as the third official presumed to have authority.
      - text: Any elected member of the state's legislature.
        why: >-
          Wrong — ordinary legislators are not among the three officials exempted under art 7; they are not mentioned in
          the materials at all in this context.
  - key: q042
    type: mcq
    concept: authority-to-conclude-a-treaty
    variant-of: q041
    difficulty: 2
    stem: >-
      A trade minister (not the head of state, head of government, or foreign minister) is sent to negotiate and sign a
      treaty on the state's behalf. What should they produce?
    options:
      - text: A letter of full powers — art 7 does not exempt a trade minister.
        correct: true
        why: >-
          Correct — the lecture's example (the Minister for Trade and Industry authorised by the Foreign Minister) shows
          exactly this, since anyone outside the three exempt officials needs a letter of full powers.
      - text: Nothing — every cabinet minister is automatically exempt from producing full powers under art 7.
        why: >-
          Wrong — only the three named officials are exempt; a trade minister does not fall into that list and needs
          full powers.
      - text: A resolution of the United Nations General Assembly authorising them personally.
        why: >-
          Wrong — full powers are issued domestically (in the lecture's example, by the Minister for Foreign Affairs),
          not by the UN General Assembly.
  - key: q043
    type: mcq
    concept: authority-to-conclude-a-treaty
    difficulty: 2
    stem: >-
      In the UK, who concludes treaties, and what additional step does s 20 of the *Constitutional Reform and Governance
      Act 2010* (UK) impose?
    options:
      - text: >-
          The Crown, under the royal prerogative, concludes treaties; s 20 requires them to be laid before Parliament
          before ratification.
        correct: true
        why: >-
          Correct — this matches the materials exactly, since the government negotiates and signs under the prerogative,
          but s 20 adds a parliamentary laying requirement before ratification.
      - text: >-
          Parliament negotiates and signs UK treaties, and s 20 then requires royal assent from the Crown before the
          treaty can be ratified.
        why: >-
          Tempting because s 20 gives Parliament a role, but that role is scrutiny before ratification; the government,
          acting under the royal prerogative, negotiates and concludes UK treaties, and royal assent is not the s 20
          step.
      - text: The monarch personally negotiates every treaty without any government involvement.
        why: >-
          Wrong — "the Crown" here refers to the government acting under the royal prerogative, not the monarch
          personally negotiating treaties.
  - key: q044
    type: mcq
    concept: authority-to-conclude-a-treaty
    variant-of: q043
    difficulty: 3
    stem: How does the US system for concluding "treaties" (in the formal Senate sense) differ from the UK's system?
    options:
      - text: >-
          The US requires the advice and consent of at least two-thirds of the Senate for a formal "treaty", whereas the
          UK requires only that a treaty be laid before Parliament before ratification, without a supermajority vote.
        correct: true
        why: >-
          Correct — this captures the key structural difference, since the US needs a Senate supermajority consent
          requirement while the UK needs only a parliamentary laying requirement.
      - text: Both systems require exactly the same two-thirds legislative supermajority before any treaty can be ratified.
        why: >-
          Wrong — only the US formal treaty process requires a two-thirds Senate vote; the UK's CRAG Act 2010 s 20
          requirement is a laying period, not a supermajority vote.
      - text: >-
          The US has no legislative involvement at all, while the UK requires full parliamentary ratification by statute
          for every treaty.
        why: >-
          Wrong — this misstates both systems; the US Senate is very much involved for formal treaties, and the UK's
          requirement is laying before Parliament, not a full ratifying statute for every treaty.
  - key: q045
    type: mcq
    concept: authority-to-conclude-a-treaty
    difficulty: 2
    stem: What is a US "executive agreement", and is it binding under international law?
    options:
      - text: >-
          An agreement the President makes without Senate advice and consent, which is still binding on the parties
          under international law.
        correct: true
        why: >-
          Correct — the materials are explicit that although not brought before the Senate for approval, executive
          agreements are still binding on the parties under international law.
      - text: >-
          An agreement the President makes alone, which binds the US domestically but has no effect internationally
          until the Senate consents.
        why: >-
          Tempting because it bypasses the Senate, but the slide quotes the Senate itself: though not brought before the
          Senate, executive agreements "are still binding on the parties under international law".
      - text: An informal political statement with no legal effect under international law whatsoever.
        why: >-
          Wrong — the materials are explicit that executive agreements remain binding under international law, even
          without Senate involvement.
  - key: q046
    type: mcq
    concept: authority-to-conclude-a-treaty
    variant-of: q045
    difficulty: 3
    stem: >-
      The Paris Agreement's history (Obama joins 2016, Trump withdraws 2017, Biden rejoins 2021, Trump withdraws again
      2025) illustrates what about US treaty-making?
    options:
      - text: A President can join or withdraw by executive order alone.
        correct: true
        why: >-
          Correct — the lecture uses exactly this sequence to show how much can shift through executive order alone,
          contrasting it with Australia's more insulated process.
      - text: That the Paris Agreement was legally void from the moment it was first joined by executive order.
        why: >-
          Wrong — the materials treat each of these executive orders as legally effective in joining or withdrawing the
          US, not as void acts.
      - text: That only a formal Senate-ratified treaty can ever be withdrawn from once entered into.
        why: >-
          Wrong — this example specifically shows withdrawal from an international commitment happening by executive
          order, not by a formal Senate-driven treaty-withdrawal process.
  - key: q047
    type: mcq
    concept: authority-to-conclude-a-treaty
    difficulty: 2
    stem: Under the Australian Constitution, which body or office holds the power to conclude treaties?
    options:
      - text: The executive power, under art 61, exercised in practice by the Minister for Foreign Affairs and DFAT.
        correct: true
        why: >-
          Correct — art 61 vests this power in the executive, and in practice the Foreign Minister and DFAT (with the
          Attorney-General's Office of International Law) manage it.
      - text: The High Court of Australia, which must approve every treaty before signature.
        why: >-
          Wrong — the High Court plays no role in concluding treaties under this week's materials; that is an executive
          function under art 61.
      - text: Each state and territory government individually, since treaties are a matter of shared federal-state power.
        why: >-
          Wrong — the materials describe treaty-making as a Commonwealth executive function, with states and territories
          consulted rather than holding the concluding power themselves.
  - key: q048
    type: mcq
    concept: authority-to-conclude-a-treaty
    variant-of: q047
    difficulty: 1
    stem: Besides the Minister for Foreign Affairs and DFAT, which other Australian body is named as managing treaties?
    options:
      - text: The Office of International Law within the Attorney-General's Department.
        correct: true
        why: Correct — the materials name this office, alongside DFAT, as managing treaties within Australia.
      - text: The Treasury, through its foreign investment review and international finance divisions.
        why: >-
          Tempting because Treasury handles many international economic matters, but the slides name DFAT and the Office
          of International Law in the Attorney-General's Department as the two key treaty bodies.
      - text: The Australian Federal Police.
        why: Wrong — the AFP is not named anywhere in this week's materials as having a treaty-making role.
  - key: q049
    type: mcq
    concept: authority-to-conclude-a-treaty
    difficulty: 3
    stem: >-
      A country's foreign minister negotiates and signs a treaty on a matter within her portfolio, without producing any
      letter of full powers. Is the treaty invalid on that basis alone?
    options:
      - text: No — a foreign minister needs no full powers under art 7.
        correct: true
        why: >-
          Correct — art 7 exempts heads of state, heads of government and foreign ministers from producing full powers,
          precisely because they are presumed to hold that authority already.
      - text: Yes — every treaty signatory, without exception, must produce a letter of full powers before signing.
        why: >-
          Wrong — this contradicts art 7's express exemption for the three named officials, of whom a foreign minister
          is one.
      - text: >-
          It depends on whether the treaty was multilateral or bilateral, since full powers are only required for
          bilateral treaties.
        why: >-
          Wrong — art 7's exemption for the three named officials does not depend on whether the treaty is bilateral or
          multilateral.
  - key: q050
    type: mcq
    concept: authority-to-conclude-a-treaty
    variant-of: q049
    difficulty: 4
    stem: >-
      A deputy trade minister, acting for a head of government who is medically incapacitated, signs a treaty without
      any letter of full powers, relying on the head of government's general authority under art 7. Is this reliance
      well founded?
    options:
      - text: >-
          No — art 7's exemption is personal to the head of state, head of government or foreign minister themselves; a
          deputy who is none of those three still needs their own letter of full powers.
        correct: true
        why: >-
          Correct — the art 7 exemption attaches to the three named officials personally by virtue of their function,
          and the materials give no basis for a deputy to borrow that exemption without their own full powers.
      - text: >-
          Yes — any deputy standing in for an incapacitated head of government automatically inherits the same art 7
          exemption.
        why: >-
          Wrong — nothing in the materials extends the art 7 exemption to a deputy acting in place of one of the three
          named officials; the exemption is not described as transferable in this way.
      - text: Yes, but only if the head of government later ratifies the deputy's actions within 24 hours.
        why: >-
          Wrong — there is no such 24-hour ratification mechanism described anywhere in this week's materials for curing
          a missing letter of full powers.
  - key: q051
    type: mcq
    concept: authority-to-conclude-a-treaty
    difficulty: 2
    stem: >-
      Why does the materials say "who has the authority to conclude a treaty?" is not resolved by international law
      itself?
    options:
      - text: Because each state's own domestic law decides who can bind it, and states organise this very differently.
        correct: true
        why: >-
          Correct — the lecture is explicit that this question "is not resolved by international law", and that you have
          to look at the law of the particular state, as the UK/US/Australia comparison shows.
      - text: Because the question is considered too unimportant to be addressed in international law scholarship.
        why: >-
          Wrong — the materials treat this as an important, actively studied question, not an unimportant one; it is
          simply answered by domestic rather than international law.
      - text: >-
          Because only the UN Secretary-General can determine who has authority to conclude a treaty for any given
          state.
        why: >-
          Wrong — the materials give no role to the UN Secretary-General in determining a state's own internal
          treaty-making competence.
  - key: q052
    type: mcq
    concept: authority-to-conclude-a-treaty
    difficulty: 3
    contrasts-with:
      - australian-treaty-making-process
    stem: >-
      Distinguish "authority to conclude a treaty" from Australia's "treaty-making process". Which best captures the
      difference?
    options:
      - text: >-
          Authority to conclude asks who (which official) can validly represent and bind the state, while the
          treaty-making process asks what sequence of domestic steps a proposed treaty must go through before Australia
          is committed.
        correct: true
        why: >-
          Correct — one concept is about which person can bind the state (art 7, and the UK/US/Australia comparison),
          the other is about the sequence of steps (mandate, negotiation, ExCo, signature, JSCOT, entry into force) a
          treaty goes through.
      - text: >-
          They are the same concept under a different name, and the distinction is purely a matter of preference in how
          a textbook organises the material.
        why: >-
          Wrong — the two concepts answer genuinely different questions (who can act for the state, versus what
          procedural steps a treaty must pass through), even though they interact in practice.
      - text: >-
          Authority to conclude a treaty only applies to bilateral treaties, while the treaty-making process only
          applies to multilateral treaties.
        why: >-
          Wrong — nothing in the materials limits either concept to bilateral or multilateral treaties specifically;
          both apply generally.
  - key: q053
    type: mcq
    concept: authority-to-conclude-a-treaty
    difficulty: 2
    stem: >-
      The lecture's Singapore example shows a Minister for Foreign Affairs authorising the Minister for Trade and
