    stem: A national of a State Party is accused of piracy on a vessel registered to that State Party. Does the ICC have jurisdiction?
    options:
      - text: Yes — the flag state and nationality state are both parties, so art 12(2) is satisfied.
        why: Tempting because the art 12 preconditions are met, but preconditions only matter for an art 5 crime; piracy is not one of the four, so the Court lacks jurisdiction.
      - text: No — piracy is not one of the four art 5 crimes, so the party links do not help.
        correct: true
        why: Correct — art 5 limits jurisdiction to genocide, crimes against humanity, war crimes and aggression; piracy is outside it, whatever the nationality and flag links.
      - text: Yes — piracy is a crime of universal jurisdiction, so any court, the ICC included, may try it.
        why: Tempting because Week 5 treated piracy as the original universal-jurisdiction crime, but that concerns states' jurisdiction; the ICC is confined to art 5 crimes.
      - text: No — the ICC can never exercise jurisdiction over any crime committed at sea.
        why: Tempting but wrong — art 12(2)(a) expressly covers crimes on board a vessel through its state of registration; the problem here is that piracy is not an art 5 crime.
  - key: q603
    type: mcq
    concept: icc-jurisdiction
    difficulty: 2
    stem: Under art 11(1), over which crimes does the ICC have jurisdiction ratione temporis?
    options:
