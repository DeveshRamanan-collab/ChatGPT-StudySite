      - text: Crimes committed up to ten years before entry into force.
        why: Tempting as a compromise, but art 11 allows no look-back period; only crimes after entry into force count.
      - text: Crimes committed at any time, once a State Party refers them.
        why: Tempting because a referral triggers jurisdiction (art 13(a)), but it cannot extend the Court's temporal limits under art 11.
  - key: q604
    type: mcq
    concept: icc-jurisdiction
    difficulty: 3
    stem: War crimes were committed in State Ibbin before Ibbin became a State Party. Ibbin then joins. What does art 11(2) provide?
