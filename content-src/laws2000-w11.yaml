  - key: q419
    type: short
    concept: ad-hoc-tribunals-icty-and-ictr
    difficulty: 2
    verify: true
    prompt: Pursuant to which legal instruments/mechanisms were the following international criminal tribunals established? (a) The International Criminal Tribunal for the former Yugoslavia. (b) The International Criminal Tribunal for Rwanda. (c) The International Criminal Court (ICC).
    model: |-
      The issue is the legal basis of each tribunal, which determines who is bound by it. (a) The ICTY was established by
      UN Security Council Resolution 827 (25 May 1993). The Council acted under Chapter VII of the UN Charter, "Action with
      respect to Threats to the Peace, Breaches of the Peace, and Acts of Aggression", so the Tribunal was not created by
      treaty; art 1 of its Statute gives it power to prosecute persons responsible for serious violations of international
      humanitarian law committed in the former Yugoslavia since 1991. (b) The ICTR was likewise established by a Security
      Council resolution under Chapter VII, of 8 November 1994 (the slide gives Resolution 855 — verify the number), with
      its seat in Arusha fixed by Resolution 977; art 1 of its Statute covers Rwanda, and Rwandan citizens in neighbouring
      states, during 1994. (c) The ICC was established by a treaty, the Rome Statute of the International Criminal Court:
      a state that becomes a Party "thereby accepts the jurisdiction of the Court" (art 12(1)). The contrast matters:
      Chapter VII decisions bind all UN members (art 25 of the Charter), whereas the Rome Statute binds its parties.
    rubric:
      - id: r1
        criterion: Issue — identifies the legal basis of each tribunal and why it matters
        marks: 1
        top-band: Explains that the question is the source of each tribunal's authority, and that the source decides who is bound.
        margin-note: Why does the legal basis matter? Tie it to who must cooperate.
        authorities: []
      - id: r2
        criterion: Law — Resolution 827, Chapter VII, the ICTR resolution and the Rome Statute
        marks: 3
        top-band: Names Resolution 827 (25 May 1993) and Chapter VII for the ICTY, the 8 November 1994 Chapter VII resolution for the ICTR, and the Rome Statute as a treaty for the ICC.
        margin-note: Which chapter of the Charter? Name it.
        authorities:
          - unsc-resolution-827
          - icty-statute-art-1
          - ictr-statute-arts-1-4
          - rome-statute-art-12
      - id: r3
        criterion: Application — contrasts Security Council creation with treaty creation
        marks: 2
        top-band: Explains that the ad hoc tribunals were imposed by a Chapter VII decision binding all UN members (art 25), while the ICC binds its States Parties.
        margin-note: Good list — now draw the contrast between the two models.
        authorities:
          - un-charter-art-25
      - id: r4
        criterion: Conclusion — one clear answer for (a), (b) and (c)
        marks: 1
        top-band: Gives a crisp one-line answer for each tribunal.
        margin-note: Finish with a one-line answer for each part.
        authorities: []
  - key: q420
    type: short
    concept: ad-hoc-tribunals-icty-and-ictr
    difficulty: 2
    verify: true
    prompt: Which States were mandated to cooperate with the ad hoc international criminal tribunals? Why?
    model: |-
      The issue is the reach of the duty to cooperate with the ICTY and ICTR, and its source. All states were mandated to
      cooperate. Resolution 827, which established the ICTY, decided that "all States shall cooperate fully with the
      International Tribunal and its organs" and that "all States shall take any measures necessary under their domestic
      law" to implement the resolution and the Statute, "including the obligation of States to comply with requests for
      assistance or orders issued by a Trial Chamber under Article 29 of the Statute". The ICTR was likewise established by
      the Security Council under Chapter VII. Why: the Council acted under Chapter VII of the UN Charter, "Action with respect
      to Threats to the Peace, Breaches of the Peace, and Acts of Aggression", and under art 25 of the Charter "the Members of
      the United Nations agree to accept and carry out the decisions of the Security Council". So the duty did not depend on
      any state's consent to the tribunals. That contrasts with the ICC, a treaty court, where the general obligation to
      cooperate in art 86 binds States Parties. Conclusion: all states, because of the binding force of Chapter VII
      decisions under art 25.
    rubric:
      - id: r1
        criterion: Issue — who must cooperate, and on what basis
        marks: 1
        top-band: Frames the question as both the scope of the duty (which states) and its legal source (why).
        margin-note: The question has two parts — which states, and why.
        authorities: []
      - id: r2
        criterion: Law — Resolution 827's cooperation clause, Chapter VII and art 25 UN Charter
        marks: 3
        top-band: Quotes the "all States shall cooperate fully" clause and explains the binding force of Chapter VII decisions through art 25.
        margin-note: Quote the resolution — the words "all States" do the work.
        authorities:
          - unsc-resolution-827
          - un-charter-art-25
      - id: r3
        criterion: Application — explains why consent was not needed, contrasting the ICC
        marks: 2
        top-band: Shows that a Chapter VII decision binds UN members without their consent, unlike the Rome Statute, which binds its parties (art 86).
        margin-note: Contrast with the ICC to show why this matters.
        authorities:
          - rome-statute-arts-86-88
      - id: r4
        criterion: Conclusion — all states, because of Chapter VII and art 25
        marks: 1
        top-band: States the answer in one line with its legal reason.
        margin-note: Bottom line, please.
        authorities: []
