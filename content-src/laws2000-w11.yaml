      - text: Proceedings undertaken to shield the person from responsibility.
        correct: true
        why: Correct — proceedings undertaken for the purpose of shielding the person concerned from criminal responsibility are the first indicator of unwillingness.
      - text: A prior conviction for the same conduct.
        why: Tempting because there are national proceedings, but there has been no trial or conviction; the investigation itself is the shield.
