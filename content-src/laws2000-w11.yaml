      - text: State Party referral, Security Council referral under Chapter VII, or the Prosecutor proprio motu.
        correct: true
        why: "Correct — art 13: (a) referral by a State Party (art 14), (b) referral by the Security Council acting under Chapter VII, or (c) an investigation initiated by the Prosecutor (art 15)."
