  - key: q314
    type: mcq
    concept: nuremberg-principles
    difficulty: 3
    stem: On the Nuremberg Principles as worded on the slides, which accused is in the strongest position?
    options:
      - text: A head of state who ordered deportations as official state policy.
        why: Weak position — Principle III says acting as head of state does not relieve responsibility under international law.
      - text: A minister whose state's internal law imposed no penalty for the killings.
        why: Weak position — Principle II says the absence of a penalty in internal law does not relieve responsibility under international law.
      - text: A clerk who followed orders where, on the facts, no moral choice was in fact possible to him.
