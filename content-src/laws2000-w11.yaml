  - key: q720
    type: short
    concept: icc-admissibility-and-complementarity
    difficulty: 3
    prompt: "State Varo, a party to the Rome Statute, has begun proceedings against Colonel Tesk for war crimes committed on its territory. The ICC Prosecutor suspects the proceedings are designed to protect Tesk: the trial has been adjourned for three years without explanation, and the presiding judge is Tesk's brother-in-law. Advise whether the case is admissible before the ICC."
    model: |-
      The issue is whether Varo's proceedings make the case inadmissible. The ICC is "complementary to national criminal
      jurisdictions" (art 1). Under art 17 a case is inadmissible where it is being investigated or prosecuted by a state
      which has jurisdiction over it, "unless the State is unwilling or unable genuinely to carry out the investigation or
      prosecution". Varo has territorial jurisdiction and is prosecuting, so the case is prima facie inadmissible. But
      unwillingness is assessed having regard to the principles of due process recognised by international law, by asking
      whether the proceedings are undertaken to shield the person from criminal responsibility, whether there has been
      unjustified delay inconsistent with an intent to bring him to justice, and whether they are not conducted
      independently or impartially in a manner inconsistent with that intent. Here a three-year unexplained adjournment is
      an unjustified delay, and a presiding judge who is the accused's brother-in-law suggests a lack of independence and
      impartiality; together they support the suspicion of shielding. Inability is not in issue — Varo's courts function.
      War crimes of this kind are likely grave enough. Conclusion: the case is likely admissible on the ground of Varo's
      unwillingness.
    rubric:
      - id: r1
        criterion: Issue — whether national proceedings bar the ICC
        marks: 1
        top-band: Frames the problem as admissibility (complementarity), having assumed jurisdiction.
        margin-note: Is this jurisdiction or admissibility? Say which.
        authorities: []
      - id: r2
        criterion: Law — art 1 complementarity, art 17 and the unwillingness indicators
        marks: 3
        top-band: States the art 17 rule with its "unwilling or unable genuinely" exception and the three unwillingness indicators, assessed against due process.
        margin-note: List the unwillingness indicators — all three.
        authorities:
          - rome-statute-art-17
      - id: r3
        criterion: Application — delay and the judge's relationship mapped onto the indicators
        marks: 2
        top-band: Maps the adjournment onto unjustified delay and the brother-in-law onto independence and impartiality, and rules out inability.
        margin-note: Good facts — now tie each to a named indicator.
        authorities: []
      - id: r4
        criterion: Conclusion — likely admissible for unwillingness
        marks: 1
        top-band: Concludes clearly, mentioning gravity briefly.
        margin-note: Clear bottom line.
        authorities: []
  - key: q801
    type: mcq
    concept: icc-applicable-law-and-cooperation
    difficulty: 2
    stem: Under art 21, what does the ICC apply "in the first place"?
    options:
      - text: Applicable treaties and the principles and rules of international law, including the law of armed conflict.
        why: Tempting because treaties are central in international law, but art 21 puts them "in the second place", after the Statute, Elements of Crimes and Rules.
      - text: The Statute, the Elements of Crimes and its Rules of Procedure and Evidence.
        correct: true
        why: "Correct — art 21: \"In the first place, this Statute, Elements of Crimes and its Rules of Procedure and Evidence.\""
      - text: General principles of law derived from national laws of the world.
        why: Tempting because general principles are a recognised source (Week 2), but art 21 applies them only "failing" the first two categories.
      - text: The national law of the state where the crime was committed.
        why: Tempting because the crime has a territorial home, but art 21 never applies national law directly; it only draws general principles from national laws, last.
  - key: q802
    type: mcq
    concept: icc-applicable-law-and-cooperation
    difficulty: 2
    stem: When may the Court apply general principles of law derived from national laws?
    options:
      - text: Failing the first two sources, if consistent with the Statute and international law and recognised norms.
        correct: true
        why: Correct — art 21 applies them "failing that", provided they are not inconsistent with the Statute and with international law and internationally recognised norms and standards.
      - text: In the first place, before the Statute itself and the Elements of Crimes.
        why: The reverse — art 21 puts the Statute, Elements of Crimes and Rules first; general principles come last.
      - text: Never, because national law has no place in the ICC's applicable law.
        why: Too absolute — art 21 lets the Court derive general principles from national laws, including those of states that would normally exercise jurisdiction.
      - text: Only where the accused's state of nationality formally requests it.
        why: Tempting because the accused's state has an interest, but art 21 sets no such condition; general principles apply failing the first two sources.
  - key: q803
    type: mcq
    concept: icc-applicable-law-and-cooperation
    difficulty: 2
    contrasts-with:
      - laws2000-w02-article-38-and-sources-of-international-law
    stem: What does art 21 say about the Court's previous decisions?
    options:
      - text: The Court is strictly bound by them, as under common law precedent.
        why: Tempting because Australian courts follow precedent, but art 21 says the Court "may apply" principles as interpreted in previous decisions — permissive, not binding.
      - text: The Court may not refer to its previous decisions at all.
        why: Too strong — art 21 expressly allows the Court to apply principles and rules of law as interpreted in its previous decisions.
      - text: It may apply principles and rules as interpreted in them.
        correct: true
        why: "Correct — art 21: the Court may apply principles and rules of law as interpreted in its previous decisions."
      - text: They bind national courts but not the Court itself.
        why: Tempting because the ICC works alongside national courts, but art 21 says nothing about binding national courts; it permits the Court to use its own decisions.
  - key: q804
    type: mcq
    concept: icc-applicable-law-and-cooperation
    difficulty: 3
    stem: Which requirement governs the application and interpretation of law under art 21?
    options:
      - text: It must be consistent with internationally recognised human rights, without adverse distinction on grounds such as gender or race.
        correct: true
        why: Correct — art 21 requires consistency with internationally recognised human rights and no adverse distinction on grounds such as gender, age, race, colour, language or religion.
      - text: It must follow the interpretation adopted by the accused person's own national courts.
        why: Tempting because national courts are the first line under complementarity, but art 21 sets an international human rights standard, not deference to national courts.
      - text: It must be confirmed by the Security Council before it can take effect in a case.
        why: Tempting because the Council can refer situations, but it has no role in confirming the Court's interpretation of the law.
      - text: It must favour the prosecution wherever the Statute is unclear or silent.
        why: Tempting as a way to end impunity, but art 21 requires consistency with human rights, which include the rights of the accused.
  - key: q805
    type: mcq
    concept: icc-applicable-law-and-cooperation
    difficulty: 2
    stem: Which source does art 21 place "in the second place"?
    options:
      - text: The Elements of Crimes.
        why: Tempting because the Elements are a key text, but art 21 lists them in the first place, with the Statute and the Rules of Procedure and Evidence.
      - text: General principles of law derived by the Court from the national laws of the legal systems of the world.
        why: Tempting because they are a recognised source, but art 21 applies them only "failing that" — third.
      - text: Applicable treaties and principles and rules of international law, including the law of armed conflict.
        correct: true
        why: "Correct — art 21: \"In the second place, where appropriate, applicable treaties and the principles and rules of international law, including the established principles of the international law of armed conflict.\""
      - text: Decisions of the International Court of Justice.
        why: Tempting because ICJ decisions are authoritative, but art 21 does not list them; it refers to the ICC's own previous decisions.
  - key: q806
    type: mcq
    concept: icc-applicable-law-and-cooperation
    difficulty: 3
    contrasts-with:
      - laws2000-w02-article-38-and-sources-of-international-law
    stem: How does the ordering of sources in art 21 of the Rome Statute differ from art 38(1) of the ICJ Statute, as studied in Week 2?
    options:
      - text: Art 21 expressly ranks its sources — first, second, failing that — whereas art 38(1) does not rank treaty above custom.
        correct: true
        why: Correct — art 21 uses "in the first place", "in the second place" and "failing that"; Week 2 stressed that art 38(1)'s order does not rank treaty above custom or custom above general principles.
      - text: Art 21 has no order at all, whereas art 38(1) sets out a strict hierarchy of sources from (a) to (d).
        why: The reverse — art 21 is explicitly ranked, while Week 2 warned that art 38(1) is not a strict hierarchy among its primary sources.
      - text: The two lists are identical, because the Rome Statute copied art 38(1) word for word.
        why: Tempting because both list treaties and general principles, but art 21 begins with the Statute and its own instruments and is expressly ranked.
      - text: Art 21 excludes general principles of law, which art 38(1) includes as a primary source.
        why: Wrong — art 21 includes general principles of law derived from national laws, as its third, gap-filling category.
  - key: q807
    type: mcq
    concept: icc-applicable-law-and-cooperation
    difficulty: 1
    stem: Under art 86, who must "cooperate fully with the Court in its investigation and prosecution of crimes"?
    options:
      - text: States Parties.
        correct: true
        why: "Correct — art 86: \"States Parties shall, in accordance with the provisions of this Statute, cooperate fully with the Court…\""
      - text: All UN member states.
        why: Tempting because Resolution 827 bound "all States" to cooperate with the ICTY, but art 86 of the Rome Statute speaks of States Parties.
      - text: Only the territorial state.
        why: Tempting because the territorial state matters under art 12(2)(a), but the art 86 obligation binds all States Parties.
      - text: Only the referring state.
        why: Tempting because the referring state started the case (art 14), but art 86 places the duty on every State Party.
  - key: q808
    type: mcq
    concept: icc-applicable-law-and-cooperation
    difficulty: 2
    stem: What does art 88 require of States Parties?
    options:
      - text: A national criminal court with exactly the same jurisdiction as the ICC itself.
        why: Tempting because complementarity relies on national courts, but art 88 is about procedures for cooperation, not about creating courts.
      - text: Procedures under national law for all forms of cooperation in Part 9.
        correct: true
        why: "Correct — art 88: States Parties shall ensure procedures are available under their national law for all forms of cooperation specified under Part 9."
      - text: Surrender of every accused national within 30 days of a request.
        why: Tempting because surrender is a form of cooperation, but art 88 sets no time limit; it requires national procedures to be available.
      - text: Ratification of the ICTY and ICTR Statutes.
        why: Tempting because those were earlier tribunals, but their statutes were Security Council instruments, never open to ratification; art 88 concerns ICC cooperation.
  - key: q809
    type: mcq
    concept: icc-applicable-law-and-cooperation
    difficulty: 3
    stem: A non-party lodges an art 12(3) declaration accepting the Court's jurisdiction over a crime. What follows for cooperation?
    options:
      - text: It may decide case by case whether to cooperate.
        why: Tempting because the state is not a Party, but art 12(3) says the accepting state "shall cooperate with the Court without any delay or exception".
      - text: It must cooperate without any delay or exception, under Part 9.
        correct: true
        why: "Correct — art 12(3): \"The accepting State shall cooperate with the Court without any delay or exception in accordance with Part 9.\""
      - text: It need not cooperate, as only States Parties are bound by art 86.
        why: Tempting because art 86 speaks of States Parties, but art 12(3) imposes the cooperation duty directly on a declaring non-party.
      - text: It must get Security Council approval before cooperating.
        why: Tempting because the Council is involved in some referrals, but art 12(3) requires no Council approval; the declaration itself triggers the duty.
  - key: q810
    type: mcq
    concept: icc-applicable-law-and-cooperation
    difficulty: 3
    stem: Giskar, a non-party UN member, refuses to surrender a suspect after the Security Council, acting under Chapter VII, refers the Giskar situation and decides that all states must cooperate. What is the source of Giskar's obligation?
    options:
      - text: Art 86 of the Rome Statute, which binds every state in the world.
        why: Tempting because art 86 is the cooperation article, but it binds States Parties; Giskar is not one.
      - text: Art 12(3), because a Security Council referral counts as Giskar's own declaration of acceptance.
        why: Tempting because art 12(3) creates a cooperation duty, but it requires the state's own declaration lodged with the Registrar; a Council referral is not one.
      - text: "Art 25 of the UN Charter: members agree to carry out Security Council decisions."
        correct: true
        why: Correct — the Council acted under Chapter VII, and under art 25 UN members "agree to accept and carry out the decisions of the Security Council".
      - text: None — a non-party can never be obliged to cooperate with the ICC.
        why: Tempting because treaties bind their parties, but a Chapter VII decision binds UN members under art 25, whether or not they are parties to the Rome Statute.
  - key: q811
    type: mcq
    concept: icc-applicable-law-and-cooperation
    difficulty: 3
    contrasts-with:
      - ad-hoc-tribunals-icty-and-ictr
    stem: Why were all states obliged to cooperate with the ICTY, whereas art 86 of the Rome Statute speaks only of States Parties?
    options:
      - text: The ICTY's Statute was ratified by every state, while the Rome Statute has fewer parties.
        why: Tempting because ratification creates treaty obligations, but the ICTY Statute was never ratified; it came with a Security Council resolution.
      - text: The ICTY came from a Chapter VII decision binding all UN members; the ICC rests on a treaty.
        correct: true
        why: Correct — Resolution 827 was a Chapter VII decision binding UN members (art 25), while the Rome Statute is a treaty whose cooperation duty (art 86) binds its parties.
      - text: The ICC has its own police force, so it needs much less cooperation from states than the ICTY.
        why: Tempting but unsupported — the ICC depends on states' cooperation (arts 86, 88); the difference lies in the legal basis of each court.
      - text: Cooperation with the ICTY was voluntary; art 86 made cooperation compulsory for the first time.
        why: The reverse — Resolution 827 decided that "all States shall cooperate fully", a binding Chapter VII obligation.
  - key: q812
    type: mcq
    concept: icc-applicable-law-and-cooperation
    difficulty: 2
    stem: Which of these is NOT among the sources listed in art 21?
    options:
      - text: The Elements of Crimes.
        why: It is listed — the Elements of Crimes are in the first place, with the Statute and the Rules of Procedure and Evidence.
      - text: Resolutions of the UN General Assembly.
        correct: true
        why: Correct — art 21 does not list General Assembly resolutions; its sources are the Statute and its instruments, treaties and international law, then general principles.
      - text: Principles of the international law of armed conflict.
        why: It is listed — the second place expressly includes the established principles of the international law of armed conflict.
      - text: General principles derived from national laws.
        why: It is listed — general principles derived from national laws of legal systems of the world come third, "failing that".
  - key: q813
    type: mcq
    concept: icc-applicable-law-and-cooperation
    difficulty: 3
    stem: The Statute, the Elements of Crimes and the Rules are silent on a point of law, and no applicable treaty or rule of international law answers it. Where does art 21 direct the Court next?
    options:
      - text: To the domestic law of the state in which the Court has its seat.
        why: Tempting because the host state's law can seem relevant, but art 21 does not apply any single national law; it turns to general principles derived from the world's legal systems.
      - text: To the Security Council, for an authoritative interpretation of the gap.
        why: Tempting because the Council refers situations, but it has no role in filling gaps in the applicable law.
      - text: To general principles of law derived from national laws of the world's legal systems.
        correct: true
        why: Correct — "failing that", art 21 directs the Court to general principles of law derived from national laws of legal systems of the world.
      - text: To dismiss the case for want of any applicable law, since the first two sources are silent on the point.
        why: Tempting as a cautious response, but art 21 provides a third, gap-filling source precisely so the Court can decide.
  - key: q814
    type: mcq
    concept: icc-applicable-law-and-cooperation
    difficulty: 2
    stem: Which national laws does art 21 mention as appropriate sources of general principles?
    options:
      - text: The laws of states that would normally exercise jurisdiction over the crime.
        correct: true
        why: Correct — art 21 refers to national laws of legal systems of the world including, as appropriate, the national laws of states that would normally exercise jurisdiction over the crime.
      - text: Only the national law of the victims' state of nationality, wherever the crime occurred.
        why: Tempting because victims are prominent in ICL, but art 21 refers to legal systems of the world and the states that would normally exercise jurisdiction.
      - text: Only the law of the state in which the Court is sitting.
        why: Tempting because the seat matters practically, but art 21 does not single out the host state's law.
  - key: q815
    type: mcq
    concept: icc-applicable-law-and-cooperation
    difficulty: 3
    variant-of: q809
    stem: On this week's materials, in what circumstances must a non-party state cooperate with the ICC?
    options:
      - text: If it lodges an art 12(3) declaration, or is bound as a UN member by a Chapter VII decision.
        correct: true
        why: Correct — a declaring non-party "shall cooperate… without any delay or exception" (art 12(3)), and UN members must carry out Chapter VII decisions (art 25 UN Charter).
      - text: Whenever one of its own nationals is accused before the Court of an art 5 crime.
        why: Tempting because nationality is an art 12(2) link, but an accused's nationality does not by itself bind a non-party to cooperate.
      - text: Whenever the crime was committed on the territory of a State Party to the Statute.
        why: Tempting because territory grounds jurisdiction under art 12(2)(a), but that binds the territorial Party, not other non-parties.
      - text: Never — the Rome Statute is a treaty and can create no obligation of any kind for a state that is not a party.
        why: Tempting because a treaty binds only its parties, but a non-party can accept obligations by an art 12(3) declaration, and the Council can bind UN members under art 25.
