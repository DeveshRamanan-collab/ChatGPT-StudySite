  - key: q618
    type: short
    concept: icc-jurisdiction
    difficulty: 3
    prompt: "Applying Part 2 of the Rome Statute, discuss whether the ICC might have jurisdiction in the following hypothetical scenario: Lionel Strong, a national of the Republic of Sirax, a party to the Rome Statute at the time of the acts in question, is accused of committing acts of piracy on board a vessel registered to Sirax."
    model: |-
      The issue is whether the ICC has jurisdiction over piracy committed by a Sirax national on a Sirax-registered
      vessel. Under art 5 the Court's jurisdiction "shall be limited to the most serious crimes of concern to the
      international community as a whole": genocide, crimes against humanity, war crimes and the crime of aggression (arts
      6–8 bis). The other gates would be passed. Sirax was a Party at the time, so the acts post-date entry into force for
      it (art 11), and on a State Party referral or a proprio motu investigation (art 13(a), (c)) art 12(2) is satisfied
      twice over: the crime was committed on board a vessel registered to Sirax (art 12(2)(a)) and Strong is a Sirax
      national (art 12(2)(b)). But those preconditions only operate for an art 5 crime, and piracy is not one of the four.
      Piracy is the classic crime of universal jurisdiction for states (Week 5), which does not make it an ICC crime. Unless
      the facts also disclose genocide, a crime against humanity or a war crime, the Court lacks subject-matter
      jurisdiction. Conclusion: the ICC would not have jurisdiction; prosecution falls to states such as Sirax.
    rubric:
      - id: r1
        criterion: Issue — jurisdiction over piracy despite strong party links
        marks: 1
        top-band: "Spots that the scenario is a trap: every link is present except an art 5 crime."
        margin-note: What is the one thing missing here?
        authorities: []
      - id: r2
        criterion: Law — arts 5, 11, 12(2) and 13 accurately stated
        marks: 3
        top-band: States the four art 5 crimes, the temporal rule, the art 13 triggers and the territorial/flag and nationality preconditions.
        margin-note: Quote art 5 — the list is closed.
        authorities:
          - rome-statute-art-5
          - rome-statute-art-11
          - rome-statute-art-12
          - rome-statute-art-13
      - id: r3
        criterion: Application — works through each gate and identifies the subject-matter gap
        marks: 2
        top-band: Shows the temporal and art 12 gates are met (flag and nationality) but that piracy fails art 5; distinguishes universal jurisdiction of states.
        margin-note: Good on the flag state — but does it matter if the crime is outside art 5?
        authorities:
          - rome-statute-art-5
      - id: r4
        criterion: Conclusion — no ICC jurisdiction over piracy as such
        marks: 1
        top-band: Concludes clearly, noting prosecution falls to states.
        margin-note: Land the conclusion.
