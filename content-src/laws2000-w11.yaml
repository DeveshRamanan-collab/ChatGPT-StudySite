    title: What is international criminal law?
    visual: diagram
    visual-brief: "One trunk — \"breaches of international rules entailing personal criminal liability\" — splitting into two limbs: substantive law (acts, subjective elements, circumstances excluding liability, conditions for states to prosecute) and procedural law (pre-trial, trial, appeal, with rights of the accused, evidence, sentencing and victims' rights alongside), fed by three roots labelled hybrid: IHL, IHRL and national criminal law."
    related:
      - post-wwii-military-tribunals
      - icc-jurisdiction
    depends-on:
      - laws2000-w01-defining-international-law
    contrasts-with:
      - laws2000-w07-framework-of-state-responsibility
    cases: []
    authorities: []
    verify: false
    body: |
      International criminal law (ICL) is a branch of public international law. International crimes are breaches of
      international rules entailing the personal criminal liability of the individual(s) concerned — the person answers
      for them, which is a different question from a state's responsibility for an internationally wrongful act (Week 7).

      ICL has two limbs. Substantive law governs the four core international crimes and demands that states prosecute
      them: the acts amounting to core crimes; the subjective elements required for those acts to be prohibited; the
      circumstances in which an accused may nevertheless not be held criminally liable; and the conditions under which
      states may prosecute or bring accused persons to trial. Procedural law regulates the stages of international criminal
      proceedings — pre-trial, trial and appeals processes, rights of the accused, rules of evidence, sentencing and
      victims' rights (victims have a prominent part). It is found in the statutes and rules of the various
      international(ised) criminal tribunals.

      Three features. ICL is relatively new, gradually expanding to cover new crimes. It is rudimentary: broadening its
      substance has been complex, the actus reus and mens rea of the crimes have not always been clear, and penalties are
      not laid down precisely. It is hybrid, drawing unique characteristics from international humanitarian law,
      international human rights law and national criminal laws.

      Exam use: when a problem asks who answers for an atrocity, keep the individual's criminal liability (ICL) separate
      from the state's responsibility.
  - slug: post-wwii-military-tribunals
    title: The post-WWII military tribunals
    visual: diagram
    visual-brief: "Three lanes after the war — Nuremberg (London Agreement with the IMT Charter annexed; art 6: crimes against peace, war crimes, crimes against humanity), Tokyo (MacArthur's proclamation implementing the Potsdam Declaration; IMTFE Charter art 5(a)–(c); 28 defendants, 55 counts) and the domestic track (Control Council Law No 10, twelve US trials, thousands of Allied trials including Australia's) — with the three crime categories running across the first two lanes."
    related:
      - nuremberg-principles
      - what-is-international-criminal-law
      - ad-hoc-tribunals-icty-and-ictr
    depends-on:
      - what-is-international-criminal-law
    contrasts-with:
      - ad-hoc-tribunals-icty-and-ictr
    cases: []
    authorities:
      - imt-charter-art-6
      - imtfe-charter-art-5
    verify: false
    body: |
      The Allies shared an intention to punish Axis war criminals but were divided over purpose and procedure. The
      London Agreement, with the IMT Charter annexed, created the Nuremberg International
      Military Tribunal (IMT), providing for the individual criminal responsibility of leaders, organisers, instigators and
      accomplices. Article 6 listed three crimes "for which there shall be individual responsibility":

      - crimes against peace — planning, preparing, initiating or waging a war of aggression or a war in violation of
        treaties, or conspiring to do so;
      - war crimes — violations of the laws or customs of war, such as ill-treatment of civilians or prisoners of war,
        killing hostages and plunder;
      - crimes against humanity — murder, extermination, enslavement, deportation and other inhumane acts against any
        civilian population, or persecutions on political, racial or religious grounds, whether or not in violation of
        domestic law.

      The International Military Tribunal for the Far East (IMTFE) was established by proclamation of US General Douglas
      MacArthur, implementing the Potsdam Declaration. Twenty-eight defendants were charged with 55 counts under art 5(a)–(c):
      crimes against peace, conventional war crimes and crimes against humanity. All were found guilty, though not on all
      counts; seven were sentenced to death.

      Control Council Law No 10 allowed domestic prosecutions in the Allied zones of occupation (twelve US trials by the
      Nuremberg Military Tribunals), and the Allies — Australia among them — held thousands of trials in the Asia-Pacific
      region and beyond.

      Exam use: name the instrument behind each tribunal — agreement, proclamation or occupation law.
  - slug: nuremberg-principles
    title: The Nuremberg Principles
    visual: palace
    visual-brief: "An entrance hall (General Assembly Resolution 95(I), 11 December 1946) opening onto four rooms in order, each closing one escape route from liability — I: any person who commits an international crime is responsible; II: no penalty in internal law is no excuse; III: acting as head of state or official is no excuse; IV: superior orders are no excuse if a moral choice was in fact possible."
    related:
      - post-wwii-military-tribunals
      - laws2000-w06-immunity-and-serious-international-crimes
    depends-on:
      - post-wwii-military-tribunals
    contrasts-with:
      - laws2000-w06-immunities-of-state-officials
    cases: []
    authorities:
      - unga-resolution-95-i
    verify: false
    body: |
      In Resolution 95(I) of 11 December 1946 the UN General Assembly affirmed the "Principles of International Law
      Recognized in the Charter of the Nürnberg Tribunal and in the Judgment of the Tribunal". Each principle closes a door
      an accused might try to leave through.

      Principle I — individual responsibility: "Any person who commits an act which constitutes a crime under international
      law is responsible therefor and liable to punishment."

      Principle II — internal law is no shield: that internal law imposes no penalty for an act which is a crime under
      international law "does not relieve the person who committed the act from responsibility under international law".

      Principle III — official position is no shield: acting "as Head of State or responsible Government official does not
      relieve him from responsibility under international law".

      Principle IV — superior orders are no shield: acting "pursuant to order of his Government or of a superior does not
      relieve him from responsibility under international law, provided a moral choice was in fact possible to him". The
      qualifier matters: the plea fails where a moral choice was in fact possible.

      Principle III is about responsibility, which is substantive. Week 6's immunities are procedural: they may stop a
      particular foreign court from proceeding, but immunity does not mean impunity.

      Exam use: when an accused pleads "my country's law allowed it", "I was head of state" or "I followed orders", answer
      with Principles II, III and IV in turn.
  - slug: ad-hoc-tribunals-icty-and-ictr
    title: The ad hoc tribunals — ICTY and ICTR
    visual: timeline
    visual-brief: A two-track timeline from one Chapter VII root — ICTY above (Resolution 827, 25 May 1993; Tadić interlocutory appeal 1995; Milošević indicted 1999; closed 31 December 2017) and ICTR below (8 November 1994; Kambanda's plea May 1998; Akayesu September 1998; closed December 2015) — meeting at the 2010 Residual Mechanism, with a cooperation arrow running from "all States" to both.
    related:
      - post-wwii-military-tribunals
      - icc-applicable-law-and-cooperation
      - hybrid-tribunals-and-the-eccc
    depends-on:
      - what-is-international-criminal-law
    contrasts-with:
      - icc-jurisdiction
    cases:
      - prosecutor-v-dusko-tadic
      - prosecutor-v-jean-paul-akayesu
    authorities:
      - unsc-resolution-827
      - icty-statute-art-1
      - ictr-statute-arts-1-4
      - un-charter-art-25
    verify: true
    body: |
      Both ad hoc tribunals were created by the UN Security Council acting under Chapter VII of the UN Charter ("Action
      with respect to Threats to the Peace, Breaches of the Peace, and Acts of Aggression") — not by treaty.

      ICTY: Resolution 827 (25 May 1993) decided that "all States shall cooperate fully" with the Tribunal and take any
      measures necessary under their domestic law, including complying with requests for assistance or Trial Chamber
      orders. Article 1 of its Statute: power to prosecute persons responsible for serious violations of international
      humanitarian law in the territory of the former Yugoslavia since 1991. Milestones: the 1995 Tadić Interlocutory Appeal
      Decision on the legality of its creation; the 1999 indictment of Slobodan Milošević. 161 charged, 90 convictions, 19
      acquittals; closed 31 December 2017.

      ICTR: established on 8 November 1994 under Chapter VII (the slide gives "Resolution 855" — verify the number), seated
      in Arusha. Article 1: serious violations of IHL in Rwanda, and by Rwandan citizens in neighbouring states, in 1994;
      arts 2–4: genocide, crimes against humanity, violations of Common Article 3 and Additional Protocol II. Kambanda
      pleaded guilty to genocide (May 1998); Akayesu was convicted of genocide, with sexual violence found to constitute the
      actus reus (September 1998). Closed December 2015.

      The Residual Mechanism (MICT) was established in 2010. Both tribunals contributed to ICL; both are criticised for
      delays and distance from affected communities.

      Exam use: Chapter VII decisions bind every UN member (art 25), so all states had to cooperate.
  - slug: hybrid-tribunals-and-the-eccc
    title: Hybrid tribunals — the Extraordinary Chambers in the Courts of Cambodia
    visual: diagram
    visual-brief: The ECCC drawn as a court inside the Cambodian judiciary, each feature sitting on a national–international seam — two Co-Prosecutors (one national, one international), a national majority of judges, Co-Investigating Judges, civil parties, UNAKRT assistance feeding in from the UN side — under a jurisdiction window fixed at 17 April 1975 – 6 January 1979 holding four crime types.
    related:
      - ad-hoc-tribunals-icty-and-ictr
      - what-is-international-criminal-law
    depends-on:
      - what-is-international-criminal-law
    contrasts-with:
      - ad-hoc-tribunals-icty-and-ictr
    cases: []
    authorities:
      - genocide-convention-arts-i-iii
    verify: false
    body: |
      Alongside the ad hoc tribunals and the ICC sit other international(ised) criminal tribunals: the Special Court for
      Sierra Leone, the Extraordinary Chambers in the Courts of Cambodia (ECCC), the Special Tribunal for Lebanon, the
      Special Panels for Serious Crimes, the Iraqi High Tribunal and the Kosovo Specialist Chambers. The ECCC is the model
      the slides explain in full.

      Establishment: to try individuals responsible for serious crimes under the Khmer Rouge regime from 1975 to 1979. After
      a request by Cambodia to the UN, it was established through an international agreement in 2004, following lengthy
      negotiations. It sat within the Cambodian court structure but received international assistance through the United
      Nations Assistance to the Khmer Rouge Trials (UNAKRT).

      Jurisdiction: crimes committed between 17 April 1975 and 6 January 1979 — genocide under the 1948 Genocide
      Convention, crimes against humanity as per the Rome Statute, grave breaches of the Geneva Conventions, and crimes under
      Cambodian law — against senior leaders of Democratic Kampuchea and those most responsible.

      Distinctive features: part of the Cambodian judiciary, applying national and international law; two Co-Prosecutors,
      one national and one international; a majority of national judges in all Chambers; a structure more akin to civil
      law, reflecting Cambodia's legal system, so Co-Investigating Judges, not Prosecutors, investigated; and civil parties
      had a right to participate.

      Exam use: contrast the ECCC — built by agreement with the state and sitting in its courts — with the ICTY and ICTR,
      created by the Security Council under Chapter VII.
  - slug: icc-jurisdiction
    title: ICC jurisdiction — crimes, time, triggers and preconditions
    visual: simulation
    visual-brief: Four controls — the crime (genocide, crimes against humanity, war crimes, aggression, or something else such as piracy), timing against the Statute's entry into force for the relevant state, the trigger (State Party referral, Security Council Chapter VII referral, Prosecutor proprio motu), and whether the territorial or flag state or the accused's nationality state is a party or an art 12(3) declarant — lighting gates for arts 5, 11, 13 and 12 and a final verdict.
    related:
      - icc-admissibility-and-complementarity
      - icc-applicable-law-and-cooperation
      - laws2000-w05-grounds-of-jurisdiction
    depends-on:
      - what-is-international-criminal-law
      - laws2000-w05-grounds-of-jurisdiction
    contrasts-with:
      - icc-admissibility-and-complementarity
      - laws2000-w05-grounds-of-jurisdiction
    cases: []
    authorities:
      - rome-statute-art-5
      - rome-statute-art-11
      - rome-statute-art-12
      - rome-statute-art-13
      - rome-statute-art-13-b
    verify: false
    body: |
      Four questions, in order.

      1. Crime (art 5). Jurisdiction is limited to "the most serious crimes of concern to the international community as a
         whole": genocide (art 6), crimes against humanity (art 7), war crimes (art 8) and the crime of aggression (art 8
         bis). Nothing else — piracy, for example, is not on the list.

      2. Time (art 11). Only crimes committed after the Statute's entry into force. For a state that becomes a Party later,
         only crimes after the Statute entered into force for that state, unless it has made an art 12(3) declaration.

      3. Trigger (art 13). A situation may be referred to the Prosecutor by a State Party (art 14) or by the Security Council
         acting under Chapter VII of the UN Charter (as with Libya in 2011), or the Prosecutor may initiate an investigation
         proprio motu (art 15).

      4. Preconditions (art 12). A state that becomes a Party thereby accepts jurisdiction over the art 5 crimes. For a State
         Party referral or a proprio motu investigation, one of these states must be a Party or have accepted jurisdiction:
         the state where the conduct occurred (or the state of registration of the vessel or aircraft), or the accused's
         state of nationality. A non-party may accept jurisdiction by declaration lodged with the Registrar (art 12(3)) and
         must then cooperate without delay or exception. A Security Council referral needs no such link.

      Exam use: walk the four gates in order, then turn to admissibility under art 17.
  - slug: icc-admissibility-and-complementarity
    title: ICC admissibility and complementarity
    visual: simulation
    visual-brief: A case passes art 17's filters — national investigation or prosecution, a national decision not to prosecute, a prior trial (art 20(3)), insufficient gravity — with a switch for whether the state is acting genuinely, is unwilling (shielding, unjustified delay, lack of independence or impartiality) or is unable (total or substantial collapse or unavailability of its judicial system); the verdict flips between admissible and inadmissible.
    related:
      - icc-jurisdiction
      - icc-applicable-law-and-cooperation
    depends-on:
      - icc-jurisdiction
    contrasts-with:
      - icc-jurisdiction
    cases: []
    authorities:
      - rome-statute-art-17
    verify: false
    body: |
      Jurisdiction is not enough: the case must also be admissible. The ICC is "complementary to national criminal
      jurisdictions" (art 1), so national courts come first.

      Under art 17 the Court shall determine that a case is inadmissible where:
      (a) it is being investigated or prosecuted by a state which has jurisdiction over it, unless the state is unwilling or
      unable genuinely to carry out the investigation or prosecution;
      (b) such a state has investigated it and decided not to prosecute, unless that decision resulted from unwillingness
      or inability genuinely to prosecute;
      (c) the person has already been tried for the conduct, and a trial by the Court is not permitted under art 20(3); or
      (d) it is not of sufficient gravity to justify further action by the Court.

      Unwillingness: having regard to the principles of due process recognised by international law, the Court considers
      whether the proceedings or decision were for the purpose of shielding the person from criminal responsibility;
      whether there has been unjustified delay inconsistent with an intent to bring the person to justice; and whether the
      proceedings were not conducted independently or impartially, in a manner inconsistent with that intent.

      Inability: whether, due to a total or substantial collapse or unavailability of its national judicial system, the
      state is unable to obtain the accused or the necessary evidence and testimony, or otherwise unable to carry out its
      proceedings.

      Exam use: after jurisdiction, ask whether a state with jurisdiction is acting, and genuinely; then gravity.
  - slug: icc-applicable-law-and-cooperation
    title: ICC applicable law and state cooperation
    visual: palace
    visual-brief: "An ordered stair of art 21 sources — first the Statute, Elements of Crimes and Rules of Procedure and Evidence; second, applicable treaties and principles and rules of international law, including the law of armed conflict; failing that, general principles from national laws — with previous decisions on a side landing and a human-rights handrail along its length, opening onto a courtyard of cooperation: States Parties (arts 86, 88), art 12(3) declarants, and UN members bound by a Chapter VII decision through art 25 of the Charter."
    related:
      - icc-jurisdiction
      - ad-hoc-tribunals-icty-and-ictr
    depends-on:
      - icc-jurisdiction
      - laws2000-w02-article-38-and-sources-of-international-law
    contrasts-with:
      - ad-hoc-tribunals-icty-and-ictr
      - laws2000-w02-article-38-and-sources-of-international-law
    cases: []
    authorities:
      - rome-statute-art-21
      - rome-statute-arts-86-88
      - rome-statute-art-12
      - un-charter-art-25
    verify: false
    body: |
      Applicable law (art 21). The Court shall apply:
      1. in the first place, the Statute, the Elements of Crimes and its Rules of Procedure and Evidence;
      2. in the second place, where appropriate, applicable treaties and the principles and rules of international law,
         including the established principles of the international law of armed conflict;
      3. failing that, general principles of law derived from national laws of the world's legal systems (as appropriate,
         those of states that would normally exercise jurisdiction), if consistent with the Statute and international law.

      The Court may apply principles and rules of law as interpreted in its previous decisions. Application and
      interpretation must be consistent with internationally recognised human rights, without adverse distinction on
      grounds such as gender, age, race, religion or other status.

      Cooperation. States Parties shall "cooperate fully with the Court in its investigation and prosecution of crimes"
      (art 86) and ensure procedures are available under their national law for all forms of cooperation (art 88). A
      non-party that accepts jurisdiction by declaration under art 12(3) must cooperate "without any delay or exception" in
      accordance with Part 9. A non-party that is a UN member can also be bound through the Security Council: members
      "agree to accept and carry out the decisions of the Security Council" (art 25 UN Charter), including decisions taken
      under Chapter VII.

      Exam use: for cooperation, ask whether the state is a Party, a declarant, or bound by a Chapter VII decision.

cases:
  - slug: prosecutor-v-jean-paul-akayesu
    name: Prosecutor v Jean-Paul Akayesu
    citation: ICTR, September 1998
    aglc: Prosecutor v Akayesu (International Criminal Tribunal for Rwanda, September 1998)
    facts: |
      Jean-Paul Akayesu was tried before the International Criminal Tribunal for Rwanda, which had power to
      prosecute serious violations of international humanitarian law committed in Rwanda in 1994, including genocide
      (ICTR Statute arts 1–2). The Week 11 slides give no further facts.
    issue: |
      Whether the accused was guilty of genocide, and whether sexual violence could constitute the actus reus of
      that crime.
    held: |
      In September 1998 Akayesu was convicted of genocide. In that case, sexual violence was found to constitute
      the actus reus.
    ratio: |
      Sexual violence can constitute the actus reus (the conduct element) of genocide.
    significance: |
      Listed on the slides as a milestone of the ICTR, whose contribution to the development of
      international criminal law lay particularly in sexual offences and incitement.
    why-here: The ICTR milestone showing that sexual violence can be the actus reus of genocide.
    verify: true

authorities:
  - slug: imt-charter-art-6
    title: Charter of the International Military Tribunal (Nuremberg) art 6
    kind: treaty
    text: |
      "The following acts […] are crimes coming within the jurisdiction of the Tribunal for which there shall be
      individual responsibility: (A) Crimes against peace; (B) War crimes; (C) Crimes against humanity." Crimes against
      peace: planning, preparation, initiation or waging of a war of aggression, or a war in violation of international
      treaties, agreements or assurances, or participation in a common plan or conspiracy for the accomplishment of any of
      the foregoing. War crimes: violations of the laws or customs of war. Crimes against humanity: murder, extermination,
      enslavement, deportation, and other inhumane acts committed against any civilian population, before or during the
      war; or persecutions on political, racial or religious grounds in execution of or in connection with any crime within
      the jurisdiction of the Tribunal, whether or not in violation of the domestic law of the country where perpetrated.
    gloss: The three crimes tried at Nuremberg, each carrying individual criminal responsibility; the Charter was annexed to the London Agreement.
    cases: []
    verify: false
  - slug: imtfe-charter-art-5
    title: Charter of the International Military Tribunal for the Far East art 5
    kind: other
    text: |
      Art 5(a) crimes against peace; art 5(b) conventional war crimes; art 5(c) crimes against humanity (as listed on
      the Week 11 slides). The Tribunal was established by proclamation of US General Douglas MacArthur, implementing the
      Potsdam Declaration.
    gloss: The three categories charged at Tokyo against 28 defendants on 55 counts, mirroring Nuremberg.
    cases: []
    verify: false
  - slug: unga-resolution-95-i
    title: UN General Assembly Resolution 95(I) (11 December 1946) — the Nuremberg Principles
    kind: principle
    text: |
      The General Assembly affirmed the "Principles of International Law Recognized in the Charter of the Nürnberg
      Tribunal and in the Judgment of the Tribunal". Principle I: "Any person who commits an act which constitutes a crime
      under international law is responsible therefor and liable to punishment." Principle II: "The fact that internal law
      does not impose a penalty for an act which constitutes a crime under international law does not relieve the person
      who committed the act from responsibility under international law." Principle III: "The fact that a person who
      committed an act which constitutes a crime under international law acted as Head of State or responsible Government
      official does not relieve him from responsibility under international law." Principle IV: "The fact that a person
      acted pursuant to order of his Government or of a superior does not relieve him from responsibility under
      international law, provided a moral choice was in fact possible to him."
    gloss: Individual responsibility for international crimes, with no escape through internal law, official position, or superior orders where a moral choice was possible.
    cases: []
    verify: false
  - slug: unsc-resolution-827
    title: UN Security Council Resolution 827 (25 May 1993)
    kind: other
    text: |
      Adopted under Chapter VII of the UN Charter, establishing the International Criminal Tribunal for the former
      Yugoslavia: "[A]ll States shall cooperate fully with the International Tribunal and its organs in accordance with the
      present resolution and the Statute of the International Tribunal and that consequently all States shall take any
      measures necessary under their domestic law to implement the provisions of the present resolution and the Statute,
      including the obligation of States to comply with requests for assistance or orders issued by a Trial Chamber under
      Article 29 of the Statute".
    gloss: Created the ICTY by a Chapter VII decision and obliged all states, not only consenting ones, to cooperate with it.
    cases: []
    verify: false
  - slug: icty-statute-art-1
    title: Statute of the International Criminal Tribunal for the former Yugoslavia art 1
    kind: other
    text: |
      "The International Tribunal shall have the power to prosecute persons responsible for serious violations of
      international humanitarian law committed in the territory of the former Yugoslavia since 1991 in accordance with the
      provisions of the present Statute."
    gloss: "The ICTY's reach: persons responsible for serious IHL violations in the former Yugoslavia since 1991."
    cases:
      - prosecutor-v-dusko-tadic
    verify: false
  - slug: ictr-statute-arts-1-4
    title: Statute of the International Criminal Tribunal for Rwanda arts 1–4
    kind: other
    text: |
      Art 1: "The International Tribunal for Rwanda shall have the power to prosecute persons responsible for serious
      violations of international humanitarian law committed in the territory of Rwanda and Rwandan citizens responsible for
      such violations committed in the territory of neighbouring States between 1 January 1994 and 31 December 1994, in
      accordance with the provisions of the present Statute." Art 2: Genocide. Art 3: Crimes against humanity. Art 4:
      Violations of Article 3 Common to the Geneva Conventions and of Additional Protocol II.
    gloss: "The ICTR's reach: Rwanda, and Rwandan citizens in neighbouring states, during 1994, for genocide, crimes against humanity and Common Article 3 / Additional Protocol II violations."
    cases:
      - prosecutor-v-jean-paul-akayesu
    verify: false
  - slug: rome-statute-art-5
    title: Rome Statute of the International Criminal Court art 5
    kind: treaty
    text: |
      "The jurisdiction of the Court shall be limited to the most serious crimes of concern to the international
      community as a whole. The Court has jurisdiction in accordance with this Statute with respect to the following
      crimes: (a) The crime of genocide; (b) Crimes against humanity; (c) War crimes; (d) The crime of aggression." The
      crimes are defined in art 6 (genocide), art 7 (crimes against humanity), art 8 (war crimes) and art 8 bis (crime of
      aggression).
    gloss: "Only four crimes are within the ICC's jurisdiction: genocide, crimes against humanity, war crimes and aggression."
    cases: []
    verify: false
  - slug: rome-statute-art-11
    title: Rome Statute of the International Criminal Court art 11
    kind: treaty
    text: |
      Jurisdiction ratione temporis. "The Court has jurisdiction only with respect to crimes committed after the
      entry into force of this Statute. If a State becomes a Party to this Statute after its entry into force, the Court may
      exercise its jurisdiction only with respect to crimes committed after the entry into force of this Statute for that
      State, unless that State has made a declaration under article 12, paragraph 3."
    gloss: "No retroactivity: only crimes after entry into force — for a later joiner, after entry into force for it, unless it lodges an art 12(3) declaration."
    cases: []
    verify: false
  - slug: rome-statute-art-12
    title: Rome Statute of the International Criminal Court art 12
    kind: treaty
    text: |
      Preconditions to the exercise of jurisdiction. (1) "A State which becomes a Party to this Statute thereby
      accepts the jurisdiction of the Court with respect to the crimes referred to in article 5." (2) "In the case of
      article 13, paragraph (a) or (c), the Court may exercise its jurisdiction if one or more of the following States are
      Parties to this Statute or have accepted the jurisdiction of the Court in accordance with paragraph 3: (a) The State
      on the territory of which the conduct in question occurred or, if the crime was committed on board a vessel or
      aircraft, the State of registration of that vessel or aircraft; (b) The State of which the person accused of the
      crime is a national." (3) "If the acceptance of a State which is not a Party to this Statute is required under
      paragraph 2, that State may, by declaration lodged with the Registrar, accept the exercise of jurisdiction by the
      Court with respect to the crime in question. The accepting State shall cooperate with the Court without any delay or
      exception in accordance with Part 9."
    gloss: For State Party referrals and proprio motu investigations, the territorial (or flag) state or the accused's nationality state must be a Party or accept jurisdiction by declaration.
    cases: []
    verify: false
  - slug: rome-statute-art-13
    title: Rome Statute of the International Criminal Court art 13
    kind: treaty
    text: |
      Exercise of jurisdiction. "The Court may exercise its jurisdiction with respect to a crime referred to in
      article 5 in accordance with the provisions of this Statute if: (a) A situation in which one or more of such crimes
      appears to have been committed is referred to the Prosecutor by a State Party in accordance with article 14; (b) A
      situation in which one or more of such crimes appears to have been committed is referred to the Prosecutor by the
      Security Council acting under Chapter VII of the Charter of the United Nations; or (c) The Prosecutor has initiated an
      investigation in respect of such a crime in accordance with article 15."
    gloss: "Three triggers: a State Party referral, a Security Council referral under Chapter VII, or the Prosecutor acting proprio motu."
    cases: []
    verify: false
  - slug: rome-statute-art-17
    title: Rome Statute of the International Criminal Court art 17
    kind: treaty
    text: |
      Issues of admissibility. Having regard to paragraph 10 of the Preamble and article 1, the Court shall determine
      that a case is inadmissible where: (a) the case is being investigated or prosecuted by a State which has jurisdiction
      over it, unless the State is unwilling or unable genuinely to carry out the investigation or prosecution; (b) the case
      has been investigated by a State which has jurisdiction over it and the State has decided not to prosecute the person
      concerned, unless the decision resulted from the unwillingness or inability of the State genuinely to prosecute; (c)
      the person concerned has already been tried for conduct which is the subject of the complaint, and a trial by the
      Court is not permitted under article 20, paragraph 3; (d) the case is not of sufficient gravity to justify further
      action by the Court. Unwillingness: having regard to the principles of due process recognized by international law —
      proceedings or a national decision for the purpose of shielding the person from criminal responsibility; unjustified
      delay inconsistent with an intent to bring the person to justice; proceedings not conducted independently or
      impartially, in a manner inconsistent with that intent. Inability: whether, due to a total or substantial collapse or
      unavailability of its national judicial system, the State is unable to obtain the accused or the necessary evidence
      and testimony or otherwise unable to carry out its proceedings. The ICC is "complementary to national criminal
      jurisdictions" (art 1).
    gloss: "Complementarity in practice: a case genuinely handled by a state with jurisdiction, already tried, or not grave enough is inadmissible."
    cases: []
    verify: false
  - slug: rome-statute-art-21
    title: Rome Statute of the International Criminal Court art 21
    kind: treaty
    text: |
      Applicable law. "The Court shall apply: (a) In the first place, this Statute, Elements of Crimes and its Rules of
      Procedure and Evidence; (b) In the second place, where appropriate, applicable treaties and the principles and rules
      of international law, including the established principles of the international law of armed conflict; (c) Failing
      that, general principles of law derived by the Court from national laws of legal systems of the world including, as
      appropriate, the national laws of States that would normally exercise jurisdiction over the crime, provided that those
      principles are not inconsistent with this Statute and with international law and internationally recognized norms
      and standards." The Court may apply principles and rules of law as interpreted in its previous decisions. Application
      and interpretation must be consistent with internationally recognized human rights, and be without any adverse
      distinction founded on grounds such as gender, age, race, colour, language, religion or belief, political or other
      opinion, national, ethnic or social origin, wealth, birth or other status.
    gloss: "A ranked list: the Statute and its instruments first, then international law, then general principles from national laws — all consistent with human rights."
    cases: []
    verify: false
  - slug: rome-statute-arts-86-88
    title: Rome Statute of the International Criminal Court arts 86 and 88
    kind: treaty
    text: |
      Art 86 — General obligation to cooperate: "States Parties shall, in accordance with the provisions of this
      Statute, cooperate fully with the Court in its investigation and prosecution of crimes within the jurisdiction of the
      Court." Art 88 — Availability of procedures under national law: "States Parties shall ensure that there are procedures
      available under their national law for all of the forms of cooperation which are specified under this Part."
    gloss: States Parties must cooperate fully with the Court and have national procedures for every form of cooperation in Part 9.
    cases: []
    verify: false

questions:
  - key: q101
    type: mcq
    concept: what-is-international-criminal-law
    difficulty: 1
    set: pretest
    stem: How do the Week 11 slides define international crimes?
    options:
      - text: Breaches of international rules entailing the personal criminal liability of the individuals concerned.
        correct: true
        why: "Correct — this is the slide's definition: what makes a breach an international crime is that it entails the personal criminal liability of the individual(s) concerned."
      - text: Internationally wrongful acts of states that are attributable to them and breach an obligation they owe.
        why: Tempting because it echoes art 2 ARSIWA from Week 7, but that defines a state's internationally wrongful act; international crimes entail the personal criminal liability of individuals.
      - text: Serious offences under national criminal law that a state chooses to prosecute in another state's courts.
        why: Tempting because national courts do try international crimes, but the definition turns on breaching international rules, not national criminal law or the choice of forum.
      - text: Any breach of international humanitarian law, whether or not a person can be held liable for it.
        why: Tempting because ICL draws on IHL, but the slide's definition requires personal criminal liability; a breach for which no individual is criminally liable is not an international crime.
  - key: q102
    type: mcq
    concept: what-is-international-criminal-law
    difficulty: 1
    stem: According to the slides, international criminal law consists of which two limbs?
    options:
      - text: Substantive law and procedural law.
        correct: true
        why: Correct — the slides divide ICL into substantive law (the core crimes and the duty to prosecute them) and procedural law (the stages of international criminal proceedings).
      - text: Treaty law and customary law.
        why: Tempting because these are the main sources from Week 2, but the slides divide ICL by function — substantive and procedural law — not by the source of the rule.
      - text: Primary rules and secondary rules of responsibility.
        why: Tempting because Week 7 used the primary/secondary split for state responsibility, but the slides describe ICL's two limbs as substantive law and procedural law.
      - text: Humanitarian law and human rights law.
        why: Tempting because ICL draws characteristics from IHL and IHRL (its hybrid nature), but those are influences on ICL, not its two limbs, which are substantive and procedural law.
  - key: q103
    type: mcq
    concept: what-is-international-criminal-law
    difficulty: 2
    stem: What, according to the slides, does the substantive limb of ICL do?
    options:
      - text: It governs the four core international crimes and demands that states prosecute them.
        correct: true
        why: Correct — the slide says substantive law (i) governs the four core international crimes and (ii) demands that states prosecute these crimes.
      - text: It regulates pre-trial, trial and appeal processes and the rights of the accused person.
        why: Tempting because these are part of ICL, but they belong to procedural law — the rules governing the stages of international criminal prosecutions — not the substantive limb.
      - text: It sets out what reparation a state owes when its organs commit crimes against civilians.
        why: Tempting because reparation featured in Week 7, but that is state responsibility; ICL's substantive limb concerns the core crimes themselves and the duty to prosecute them.
  - key: q104
    type: mcq
    concept: what-is-international-criminal-law
    difficulty: 2
    stem: Which of these is NOT listed on the slides as part of ICL's substantive law?
    options:
      - text: The acts amounting to core international crimes.
        why: It is listed — the first item of substantive law is the acts amounting to core international crimes, so it cannot be the odd one out here.
      - text: The subjective elements required for the acts to be prohibited.
        why: It is listed — substantive law includes the subjective elements required for such acts to be prohibited, the mental side of each crime.
      - text: The rules of evidence applied at trial.
        correct: true
        why: Correct — rules of evidence belong to procedural law, the second limb governing the stages of international criminal prosecutions, not to substantive law.
      - text: The conditions under which states may prosecute accused persons.
        why: It is listed — substantive law includes the conditions under which states may prosecute or bring to trial accused persons.
  - key: q105
    type: mcq
    concept: what-is-international-criminal-law
    difficulty: 2
    stem: Where, according to the slides, is ICL's procedural law found?
    options:
      - text: In the statutes and rules of the various international(ised) criminal tribunals.
        correct: true
        why: Correct — the slide says procedural law is found in the statutes and rules of the various international(ised) criminal tribunals.
      - text: In a single UN convention codifying international criminal procedure for all courts.
        why: Tempting because codification is common in international law (think of the VCLT), but the slides point to each tribunal's statute and rules, not one convention.
      - text: In the criminal procedure codes of the states where the crimes were committed.
        why: Tempting because ICL draws on national criminal laws, but the slides locate procedural law in the statutes and rules of the international(ised) tribunals themselves.
      - text: In the judgments of the ICJ, which supervises the international criminal tribunals.
        why: Tempting because the ICJ is the principal UN court, but it decides disputes between states (Week 8) and supervises no criminal tribunal; the slides point to tribunal statutes and rules.
  - key: q106
    type: mcq
    concept: what-is-international-criminal-law
    difficulty: 2
    stem: Why do the slides describe ICL as "rudimentary"?
    options:
      - text: The actus reus and mens rea of its crimes have not always been clear, and penalties are not precisely laid down.
        correct: true
        why: Correct — the slides say broadening ICL's substance has been complex, the definitions of actus reus and mens rea have not always been clear, and penalties are not laid down precisely.
      - text: It has no courts of its own and relies entirely on national prosecutions.
        why: Tempting because states do much of the prosecuting, but the slides list a dozen international(ised) tribunals; "rudimentary" refers to unclear elements and imprecise penalties.
      - text: It applies only to the crimes tried at Nuremberg and has not grown since.
        why: Tempting because Nuremberg is foundational, but the slides say ICL has gradually expanded to cover new crimes; its rudimentary character lies in unclear definitions and penalties.
      - text: It binds only the states that have ratified the Rome Statute.
        why: Tempting because the ICC rests on a treaty, but ICL existed long before the Rome Statute (Nuremberg, the ad hoc tribunals); "rudimentary" is about unclear elements and penalties.
  - key: q107
    type: mcq
    concept: what-is-international-criminal-law
    difficulty: 2
    contrasts-with:
      - hybrid-tribunals-and-the-eccc
    stem: The slides call ICL a "hybrid" branch of public international law. What does that mean?
    options:
      - text: Its courts always mix national and international judges, as at the ECCC.
        why: Tempting because the ECCC is a hybrid court with national and international staff, but the slide's point about ICL as a hybrid branch concerns the bodies of law it draws on.
      - text: It has unique characteristics derived from IHL, IHRL and national criminal laws.
        correct: true
        why: Correct — the slide says ICL presents unique characteristics deriving from international humanitarian law, international human rights law and national criminal laws.
      - text: It merges the rules of state responsibility with the individual criminal liability of officials.
        why: Tempting because both concern wrongdoing, but the slides do not describe ICL as merging state responsibility into it; its hybridity comes from IHL, IHRL and national criminal law.
      - text: It is partly treaty law and partly law made by the UN Security Council.
        why: Tempting because the ad hoc tribunals were Security Council creations, but "hybrid" on the slide refers to ICL's roots in IHL, IHRL and national criminal laws.
  - key: q108
    type: mcq
    concept: what-is-international-criminal-law
    difficulty: 1
    stem: Which statement about the age of ICL is supported by the slides?
    options:
      - text: It is the oldest branch of international law, older than the law of treaties.
        why: Tempting because war crimes trials feel ancient, but the slides call ICL a relatively new branch of public international law that has gradually expanded.
      - text: It was completely codified at Nuremberg and has stayed unchanged since 1946.
        why: Tempting because Nuremberg was a turning point, but the slides stress that ICL has gradually expanded to cover new crimes and remains rudimentary.
      - text: It is relatively new and has gradually expanded to cover new crimes.
        correct: true
        why: Correct — the slides describe ICL as a relatively new branch of public international law that has gradually expanded to cover new crimes.
  - key: q109
    type: mcq
    concept: what-is-international-criminal-law
    difficulty: 3
    contrasts-with:
      - laws2000-w07-framework-of-state-responsibility
    stem: State A's army commits atrocities. A student writes that "international criminal law will make State A criminally liable". What is the main problem with that sentence?
    options:
      - text: ICL concerns the personal criminal liability of individuals; State A's position is a matter of state responsibility.
        correct: true
        why: Correct — international crimes entail the personal criminal liability of the individual(s) concerned; whether State A itself is responsible is the separate question of state responsibility from Week 7.
      - text: Nothing — ICL's substantive limb makes a state criminally liable for its organs' conduct.
        why: Tempting because Week 7 attributes organs' conduct to the state, but that is state responsibility; ICL is about the personal criminal liability of individuals.
      - text: ICL covers only non-state armed groups, so State A's soldiers fall outside it.
        why: Tempting if you assume states shield their soldiers, but individuals serving states were tried at Nuremberg and Tokyo; ICL attaches to the person, whoever they serve.
      - text: ICL applies only once the Security Council has declared the conduct a crime.
        why: Tempting because the Council created the ad hoc tribunals, but ICL defines crimes through its substantive law; a Council declaration is not what makes conduct an international crime.
  - key: q110
    type: mcq
    concept: what-is-international-criminal-law
    difficulty: 2
    stem: Which of these belongs to ICL's procedural law, according to the slides?
    options:
      - text: The definition of crimes against humanity.
        why: Tempting because definitions are rules too, but defining the acts amounting to core crimes is the first item of substantive law, not procedural law.
      - text: Victims' rights, given victims' prominent part in proceedings.
        correct: true
        why: Correct — the slides list victims' rights (victims have a prominent part in proceedings) among the procedural rules governing international criminal prosecutions.
      - text: The circumstances in which an accused is not criminally liable.
        why: Tempting because it arises at trial, but the slides place the circumstances in which accused persons may nevertheless not be held liable in substantive law.
  - key: q111
    type: mcq
    concept: what-is-international-criminal-law
    difficulty: 1
    contrasts-with:
      - laws2000-w08-icj-jurisdiction-and-consent
    stem: Which of the following is NOT among the international(ised) criminal tribunals listed on the slides?
    options:
      - text: The International Court of Justice (ICJ).
        correct: true
        why: Correct — the ICJ decides disputes between states (Week 8); it is not a criminal tribunal and does not appear in the slide's list of twelve international(ised) criminal tribunals.
      - text: The Special Panels for Serious Crimes (SPSC).
        why: It is on the list — the slides include the Special Panels for Serious Crimes among the relevant international(ised) criminal tribunals.
      - text: The Kosovo Specialist Chambers (KSC).
        why: It is on the list — the Kosovo Specialist Chambers are the last of the twelve international(ised) criminal tribunals named on the slides.
      - text: The Iraqi High Tribunal (IHT).
        why: It is on the list — the slides include the Iraqi High Tribunal among the relevant international(ised) criminal tribunals.
  - key: q112
    type: mcq
    concept: what-is-international-criminal-law
    difficulty: 2
    variant-of: q110
    stem: Sentencing rules in international criminal proceedings belong to which limb of ICL on the slides?
    options:
      - text: Procedural law, which governs the stages of international criminal prosecutions.
        correct: true
        why: Correct — the slides list sentencing among the procedural rules, alongside pre-trial, trial and appeals processes, rights of the accused and rules of evidence.
      - text: Substantive law, because the penalty is part of the definition of each crime.
        why: Tempting because the slides say penalties are not laid down precisely (a substantive weakness), but sentencing as a stage of proceedings is listed under procedural law.
      - text: Neither limb, because sentencing is left entirely to the national criminal law of each state.
        why: Tempting because ICL borrows from national criminal laws, but the slides expressly list sentencing within ICL's procedural limb.
  - key: q113
    type: mcq
    concept: what-is-international-criminal-law
    difficulty: 3
    stem: A tribunal must decide whether, despite committing the prohibited act, an accused can rely on a circumstance excluding criminal liability. Which part of ICL governs that question?
    options:
      - text: Procedural law — the rights of the accused during the trial.
        why: Tempting because the accused raises it at trial, but the circumstances in which an accused may nevertheless not be held criminally liable are listed under substantive law.
      - text: Substantive law — the circumstances in which an accused may nevertheless not be held liable.
        correct: true
        why: Correct — the slides list "the circumstances under which persons accused of international crimes may nevertheless not be held criminally liable" as part of substantive law.
      - text: Procedural law — the rules of evidence on how the accused's mental element must be proved at trial.
        why: Tempting because proof matters, but whether a circumstance excludes liability is a question of the substantive law of the crime, not of how facts are proved.
      - text: Neither — only national law can excuse an international crime.
        why: Tempting because national law shaped ICL, but the slides make the circumstances excluding liability part of ICL's own substantive limb.
  - key: q114
    type: mcq
    concept: what-is-international-criminal-law
    difficulty: 2
    stem: Which bodies of law do the slides name as the sources of ICL's unique characteristics?
    options:
      - text: The law of the sea, international trade law and diplomatic law.
        why: Tempting because these are other branches of international law, but the slides name IHL, IHRL and national criminal laws as the sources of ICL's hybrid character.
      - text: Customary international law and general principles only.
        why: Tempting because these are sources of international law generally, but the slide on hybridity names IHL, IHRL and national criminal laws.
      - text: IHL, IHRL and national criminal laws.
        correct: true
        why: Correct — the slide says ICL presents unique characteristics deriving from international humanitarian law and international human rights law, as well as from national criminal laws.
      - text: The UN Charter, the ICJ Statute and the ILC's ARSIWA.
        why: Tempting because these instruments recur in the unit, but none is named on the slide as a source of ICL's hybrid character; IHL, IHRL and national criminal laws are.
  - key: q115
    type: mcq
    concept: what-is-international-criminal-law
    difficulty: 3
    variant-of: q106
    stem: A classmate says the definitions of international crimes are settled and precise, so tribunals never struggle with them. On the slides, how should you respond?
    options:
      - text: Agree — the Rome Statute's Elements of Crimes ended every uncertainty in the definitions.
        why: Tempting because the Elements of Crimes are part of the ICC's applicable law (art 21), but the slides still describe ICL as rudimentary, with unclear actus reus and mens rea.
      - text: Disagree — the slides say the actus reus and mens rea of these crimes have not always been clear.
        correct: true
        why: Correct — the slides call ICL rudimentary precisely because determining the definitions of the actus reus and mens rea of the crimes has not always been clear.
      - text: Agree — the definitions were fixed in the IMT Charter and have not changed since.
        why: Tempting because the IMT Charter defined three crimes, but the slides say ICL has gradually expanded to cover new crimes and its definitions have not always been clear.
  - key: q116
    type: mcq
    concept: what-is-international-criminal-law
    difficulty: 2
    variant-of: q104
    stem: Which item belongs to the substantive limb of ICL?
    options:
      - text: The subjective elements required for the acts to be prohibited.
        correct: true
        why: Correct — the subjective elements required for acts to be prohibited are the second item of substantive law on the slides.
      - text: Appeals processes in the Appeals Chamber after a conviction or acquittal.
        why: Tempting because appeals decide liability in the end, but the slides list appeals processes under procedural law, the rules governing the stages of prosecutions.
      - text: Pre-trial processes.
        why: Tempting because pre-trial work shapes the charges, but the slides list pre-trial processes under procedural law, not substantive law.
      - text: Rights of the accused.
        why: Tempting because rights feel substantive, but the slides list the rights of the accused among the procedural rules of international criminal prosecutions.
  - key: q117
    type: truefalse
    concept: what-is-international-criminal-law
    difficulty: 1
    set: quickfire
    statement: International crimes entail the personal criminal liability of the individuals concerned.
    answer: true
    why: True — the slides define international crimes as breaches of international rules entailing the personal criminal liability of the individual(s) concerned.
  - key: q118
    type: truefalse
    concept: what-is-international-criminal-law
    difficulty: 2
    set: quickfire
    statement: The slides say the penalties for international crimes are laid down precisely.
    answer: false
    why: False — one reason the slides call ICL rudimentary is that the penalties for these crimes are not laid down precisely.
  - key: q119
    type: truefalse
    concept: what-is-international-criminal-law
    difficulty: 1
    set: quickfire
    statement: ICL's procedural law includes victims' rights, because victims have a prominent part in proceedings.
    answer: true
    why: True — the slides list victims' rights among the procedural rules, noting that victims have a prominent part in proceedings.
  - key: q120
    type: match
    concept: what-is-international-criminal-law
    difficulty: 2
    prompt: Match each item to the limb or feature of ICL it belongs to.
    pairs:
      - left: The acts amounting to core international crimes
        right: Substantive law
      - left: Rules of evidence and sentencing
        right: Procedural law
      - left: Unclear actus reus and mens rea; imprecise penalties
        right: Rudimentary
      - left: Characteristics drawn from IHL, IHRL and national criminal law
        right: Hybrid
  - key: q201
    type: mcq
    concept: post-wwii-military-tribunals
    difficulty: 1
    stem: Which instrument created the Nuremberg International Military Tribunal?
    options:
      - text: The London Agreement, with the IMT Charter annexed.
        correct: true
        why: Correct — the slides say the London Agreement, with the IMT Charter annexed, created the IMT.
      - text: A proclamation by US General Douglas MacArthur.
        why: Tempting because a proclamation created a post-war tribunal, but that was the IMTFE in Tokyo, which implemented the Potsdam Declaration — not Nuremberg.
      - text: A Security Council resolution adopted under Chapter VII.
        why: Tempting because that is how the ICTY and ICTR were created in the 1990s, but the slides say the IMT was created by the London Agreement with its Charter annexed.
      - text: Control Council Law No 10 in occupied Germany.
        why: Tempting because Control Council Law No 10 is a post-war instrument, but it provided for domestic prosecutions in the zones of occupation, not for the IMT itself.
  - key: q202
    type: mcq
    concept: post-wwii-military-tribunals
    difficulty: 1
    stem: Which three crimes fell within the IMT's jurisdiction under art 6 of its Charter?
    options:
      - text: Genocide, war crimes and crimes against humanity.
        why: Tempting because these are core ICC crimes today, but art 6 of the IMT Charter listed crimes against peace, not genocide, as its first category.
      - text: Crimes against peace, war crimes and crimes against humanity.
        correct: true
        why: Correct — art 6 listed (A) crimes against peace, (B) war crimes and (C) crimes against humanity, each carrying individual responsibility.
      - text: Aggression, piracy and violations of Common Article 3.
        why: Tempting because aggression resembles crimes against peace, but piracy and Common Article 3 violations were not IMT crimes; Common Article 3 appears in the ICTR Statute (art 4).
      - text: Crimes against peace, terrorism and the conventional war crimes.
        why: Tempting because "conventional war crimes" was an IMTFE category, but terrorism was not among the IMT crimes; art 6 named crimes against peace, war crimes and crimes against humanity.
  - key: q203
    type: mcq
    concept: post-wwii-military-tribunals
    difficulty: 2
    stem: Planning a war of aggression, or participating in a common plan or conspiracy to do so, was which crime under the IMT Charter?
    options:
      - text: Crimes against peace.
        correct: true
        why: Correct — crimes against peace covered the planning, preparation, initiation or waging of a war of aggression, and participation in a common plan or conspiracy to do so.
      - text: War crimes, as a violation of the laws or customs of war.
        why: Tempting because the conduct concerns war, but war crimes were violations of the laws or customs of war in its conduct; waging aggressive war was a crime against peace.
      - text: Crimes against humanity, as an inhumane act against civilians.
        why: Tempting because aggression causes great suffering, but crimes against humanity were acts against civilian populations; planning aggression was a crime against peace.
  - key: q204
    type: mcq
    concept: post-wwii-military-tribunals
    difficulty: 2
    stem: Under art 6 of the IMT Charter, which of these was listed as a war crime?
    options:
      - text: Persecution on political, racial or religious grounds.
        why: Tempting because persecution was an IMT crime, but it was listed under crimes against humanity, not war crimes.
      - text: Killing of hostages.
        correct: true
        why: Correct — the IMT Charter's list of war crimes included the killing of hostages, along with plunder and the murder or ill-treatment of prisoners of war.
      - text: Waging a war in violation of international treaties.
        why: Tempting because it concerns war, but waging a war in violation of treaties was a crime against peace under art 6(A).
      - text: Extermination of a civilian population.
        why: Tempting because it is grave conduct in wartime, but extermination appears in the IMT Charter's definition of crimes against humanity, not war crimes.
  - key: q205
    type: mcq
    concept: post-wwii-military-tribunals
    difficulty: 3
    stem: What distinguished crimes against humanity in art 6 of the IMT Charter?
    options:
      - text: They were acts against any civilian population, before or during the war, whether or not in breach of the local domestic law.
        correct: true
        why: Correct — crimes against humanity covered inhumane acts against any civilian population, before or during the war, whether or not in violation of the domestic law where perpetrated.
      - text: They could only be committed against prisoners of war or persons on the seas.
        why: Tempting because those victims appear in art 6, but their murder or ill-treatment was listed among war crimes; crimes against humanity concerned any civilian population.
      - text: They were confined to acts in occupied territory during the war itself.
        why: Tempting because occupied territory features in the war crimes definition, but crimes against humanity reached acts against any civilian population, before or during the war.
      - text: They required proof that the act broke the domestic law where it was done.
        why: The reverse is true — the Charter covered such acts "whether or not in violation of the domestic law of the country where perpetrated".
  - key: q206
    type: mcq
    concept: post-wwii-military-tribunals
    difficulty: 2
    stem: Whom did the IMT Charter make individually criminally responsible?
    options:
      - text: Only heads of state and members of the government.
        why: Tempting because the defendants were senior figures, but the slides say the Charter covered leaders, organisers, instigators and accomplices — a wider group.
      - text: Only the soldiers who personally carried out the killings.
        why: Tempting because direct perpetrators are obvious targets, but the Charter reached leaders, organisers, instigators and accomplices, not just those who did the killing.
      - text: Leaders, organisers, instigators and accomplices.
        correct: true
        why: Correct — the slides record the individual criminal responsibility of leaders, organisers, instigators and accomplices under the IMT Charter.
      - text: The Axis states themselves, as legal persons.
        why: Tempting if you merge ICL with state responsibility, but the Charter provided for individual responsibility; that is the defining feature of international crimes.
  - key: q207
    type: mcq
    concept: post-wwii-military-tribunals
    difficulty: 2
    stem: What divided the Allied leadership over the Nuremberg trials, according to the slides?
    options:
      - text: Whether Axis war criminals should be punished at all.
        why: Tempting because there were disagreements, but the slides say the Allies shared the intention to punish Axis war criminals; they disagreed about how.
      - text: How to punish Axis war criminals — the purpose and the procedure to be applied.
        correct: true
        why: Correct — despite a shared intention to punish, the Allied leadership was divided over how, with differences over purpose and the procedure to be applied.
      - text: Whether the trials should take place in Germany or in Japan.
        why: Tempting because there were tribunals in both, but they were separate (Nuremberg and Tokyo); the slides describe disagreement over purpose and procedure.
  - key: q208
    type: mcq
    concept: post-wwii-military-tribunals
    difficulty: 1
    stem: How was the International Military Tribunal for the Far East established?
    options:
      - text: By the London Agreement, with a charter annexed to it.
        why: Tempting because that is how the Nuremberg IMT was created, but the IMTFE was established by proclamation of General MacArthur.
      - text: By a treaty between Japan and the Allied powers.
        why: Tempting because tribunals are often treaty-based, but the slides say the IMTFE was established by a proclamation implementing the Potsdam Declaration.
      - text: By proclamation of US General Douglas MacArthur, implementing the Potsdam Declaration.
        correct: true
        why: Correct — the slides say the IMTFE was established by proclamation by US General Douglas MacArthur, in implementation of the Potsdam Declaration.
      - text: By UN General Assembly Resolution 95(I).
        why: Tempting because Resolution 95(I) concerns the post-war trials, but it affirmed the Nuremberg Principles; it did not establish the Tokyo tribunal.
  - key: q209
    type: mcq
    concept: post-wwii-military-tribunals
    difficulty: 2
    stem: How many defendants did the IMTFE try, and on how many counts?
    options:
      - text: 28 defendants charged with 55 counts.
        correct: true
        why: Correct — the slides record 28 defendants charged with 55 counts at the IMTFE.
