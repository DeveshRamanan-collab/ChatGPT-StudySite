  - key: q601
    type: mcq
    concept: icc-jurisdiction
    difficulty: 2
    set: pretest
    stem: Which crimes are within the ICC's jurisdiction under art 5 of the Rome Statute?
    options:
      - text: Crimes against peace, war crimes and crimes against humanity.
        why: Tempting because these were the IMT Charter's crimes, but art 5 lists genocide, crimes against humanity, war crimes and the crime of aggression.
      - text: Genocide, crimes against humanity, war crimes and the crime of aggression.
        correct: true
        why: "Correct — art 5 limits jurisdiction to the most serious crimes: genocide (art 6), crimes against humanity (art 7), war crimes (art 8) and aggression (art 8 bis)."
      - text: Genocide, crimes against humanity, war crimes, piracy and terrorism.
        why: Tempting because piracy and terrorism are serious, but art 5 lists only four crimes; piracy and terrorism are not among them.
      - text: Any serious violation of international humanitarian law, anywhere.
        why: Tempting because that phrase defines the ICTY's and ICTR's jurisdiction, but the ICC is limited to the four crimes in art 5.
  - key: q602
    type: mcq
    concept: icc-jurisdiction
