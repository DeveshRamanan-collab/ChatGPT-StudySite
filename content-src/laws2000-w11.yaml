      - text: The Libya referral in 2011, which showed the Security Council needed a standing court.
        why: >-
          Tempting because Libya is the slides' referral example, but that came after the ICC existed; the need was
          recognised in 1948.
  - key: q623
    type: mcq
    concept: icc-jurisdiction
    difficulty: 2
    stem: According to the slides, what does the Rome Statute set out, among other things?
    options:
      - text: A list of the states to be investigated, and fixed penalties for each crime it covers.
        why: >-
          Tempting because the Statute does deal with crimes and penalties, but the slide lists crimes, certain rules of
