        right: Declaration accepting jurisdiction (art 12(3))
  - key: q721
    type: mcq
    concept: icc-admissibility-and-complementarity
    difficulty: 2
    stem: At the preliminary examination stage, what must the Office of the Prosecutor determine?
    options:
      - text: >-
          Enough evidence of grave crimes within jurisdiction; genuine national proceedings; the interests of justice and
          victims.
        correct: true
        why: >-
          Correct — the OTP must determine whether there is sufficient evidence of crimes of sufficient gravity within
          jurisdiction, whether there are genuine national proceedings, and whether an investigation would serve justice
          and victims.
      - text: Whether the suspect is in custody, whether charges are confirmed, and whether reparations have been paid.
        why: >-
          Tempting because these are later steps in the same process, but custody, confirmation and reparations come at
          the investigation, pre-trial and trial stages.
      - text: Whether the Security Council approves, whether the accused's state consents, and who will pay the costs.
        why: >-
          Tempting because the Council and costs appear in Resolution 1970, but the slides' preliminary-examination
          questions are evidence and gravity, national proceedings, and justice.
      - text: Only whether the crime is one of the four art 5 crimes; admissibility is left entirely to the trial judges.
        why: >-
          Tempting because art 5 is the first gate, but the OTP also asks about genuine national proceedings and gravity
          at the very start.
  - key: q722
    type: mcq
    concept: icc-admissibility-and-complementarity
    difficulty: 2
    stem: Which preliminary-examination question on the slides tracks complementarity under art 17?
    options:
      - text: Whether there are genuine national proceedings.
        correct: true
        why: >-
          Correct — asking whether there are genuine national proceedings mirrors art 17, under which a case is
          inadmissible if a state is genuinely investigating or prosecuting it.
      - text: Whether an investigation would serve the interests of justice and victims.
        why: >-
          Tempting because it is also a threshold question, but it concerns justice and victims, not whether national
          courts are genuinely acting.
      - text: Whether the suspect understands the charges laid.
        why: >-
          Tempting because it is a fairness safeguard, but it belongs to the initial appearance before three Pre-Trial
          judges, not to the preliminary examination.
      - text: Whether an enforcing state will accept any sentence.
        why: >-
          Tempting because enforcement depends on states, but it is the last stage of the process, not a complementarity
          question.
  - key: q723
    type: mcq
    concept: icc-admissibility-and-complementarity
    difficulty: 3
    stem: >-
      In the slides' Philippines timeline, why did the Pre-Trial Chamber let the Prosecutor resume the investigation in
      January 2023?
    options:
      - text: The Security Council referred the situation under Chapter VII, overriding the Philippines' request.
        why: >-
          Tempting because Council referrals are powerful, but no referral appears on the timeline; the Chamber acted on
          the Prosecutor's request.
      - text: It found the national proceedings that the Philippines relied on insufficient in scope.
        correct: true
        why: >-
          Correct — the Chamber granted the Prosecutor's request to resume "after finding national proceedings
          insufficient in scope", the complementarity point behind art 17.
      - text: The Philippines withdrew its request for deferral and consented to the investigation.
        why: >-
          Tempting because consent would end the dispute, but the timeline shows no withdrawal; the Chamber ruled on the
          adequacy of the national proceedings.
      - text: The Prosecutor proved a total collapse of the Philippine courts, making the state unable to act.
        why: >-
          Tempting because inability is an art 17 ground, but the timeline's reason is that the national proceedings were
          insufficient in scope, not a collapse of the system.
  - key: q724
    type: mcq
    concept: icc-admissibility-and-complementarity
    difficulty: 2
    stem: >-
      On what basis, according to the timeline, did the Philippines request deferral of the investigation in November
      2021?
    options:
      - text: That the crimes were not grave enough.
        why: >-
          Tempting because gravity is an art 17 ground, but the timeline records that the Philippines claimed national
          proceedings were under way.
      - text: That national proceedings were under way.
        correct: true
        why: >-
          Correct — on 10 November 2021 the Philippines requested deferral "claiming national proceedings underway", a
          complementarity argument.
      - text: That the Pre-Trial Chamber had not authorised it.
        why: >-
          Tempting because PTC authorisation matters on the proprio motu route, but Pre-Trial Chamber I had already
          authorised the investigation on 15 September 2021.
      - text: That its president was immune as head of state.
        why: >-
          Tempting because official position is a familiar plea, but the timeline records only one Philippine argument:
          that national proceedings were under way.
  - key: q725
    type: mcq
    concept: icc-admissibility-and-complementarity
    difficulty: 2
    contrasts-with:
      - icc-jurisdiction
    stem: In the slides' ICC flowchart, where does admissibility (art 17) come?
    options:
      - text: Last — after subject matter, time, referral and preconditions, just before proceeding to the ICC.
        correct: true
        why: >-
          Correct — the flowchart asks art 5, art 11, art 13 and art 12 first, then "Issues of admissibility? Art 17 RS",
          then "Proceed to ICC!".
      - text: First — before asking whether the crime falls within art 5 at all.
        why: >-
          Tempting because complementarity is fundamental, but the flowchart deals with jurisdiction first; admissibility
          is the final question.
      - text: Second — straight after subject-matter jurisdiction, before the temporal question.
        why: >-
          Tempting because gravity sounds like part of subject matter, but the flowchart puts time, referral and
          preconditions before admissibility.
      - text: Nowhere at the ICC — admissibility is decided by national courts alone.
        why: >-
          Tempting because complementarity favours national courts, but the Court itself determines admissibility under
          art 17, as the flowchart shows.
  - key: q726
    type: mcq
    concept: icc-admissibility-and-complementarity
    difficulty: 3
    variant-of: q723
    stem: >-
      Corvia, a State Party, says its courts are dealing with a general's case, but the ICC finds they cover only minor
      charges, not the killings alleged. On the Philippines example, how is a deferral argument likely to fare?
    options:
      - text: Well — any national proceedings at all make the case inadmissible under art 17.
        why: >-
          Tempting because art 17 favours national proceedings, but they must be genuine; in the Philippines the Chamber
          let the investigation resume when they were insufficient in scope.
      - text: Poorly — proceedings insufficient in scope did not stop the ICC in the Philippines.
        correct: true
        why: >-
          Correct — the Pre-Trial Chamber let the Prosecutor resume after finding the Philippine proceedings insufficient
          in scope; narrow proceedings do not make the case inadmissible.
      - text: Well — once a state asks for deferral, the Prosecutor must close the investigation for good.
        why: >-
          Tempting because the Philippines did ask for deferral, but the investigation resumed in January 2023 after the
          Chamber ruled on the national proceedings.
      - text: Poorly — but only because killings are outside the ICC's art 5 jurisdiction.
        why: >-
          Tempting because "poorly" is right, but crimes against humanity (the Duterte warrant) are an art 5 crime; the
          reason is insufficient national proceedings.
  - key: q727
    type: truefalse
    concept: icc-admissibility-and-complementarity
    difficulty: 2
    statement: >-
      At the preliminary examination stage, the Office of the Prosecutor considers whether there are genuine national
      proceedings.
    answer: true
    why: >-
      True — one of the three preliminary-examination questions on the slides is whether there are genuine national
      proceedings, which anticipates art 17.
  - key: q728
    type: truefalse
    concept: icc-admissibility-and-complementarity
    difficulty: 2
    statement: On the slides' timeline, the Philippines' request for deferral ended the ICC's investigation for good.
    answer: false
    why: >-
      False — in January 2023 the Pre-Trial Chamber granted the Prosecutor's request to resume, finding the national
      proceedings insufficient in scope; a warrant followed in 2025.
  - key: q821
    type: mcq
    concept: icc-applicable-law-and-cooperation
    difficulty: 1
    stem: Once an ICC arrest warrant issues, how does the suspect reach the Court, according to the slides?
    options:
      - text: The ICC's own police officers arrest suspects in any country.
        why: >-
          Tempting because the ICC issues the warrant, but the slides say the ICC relies on countries to make arrests and
          transfer suspects.
      - text: The ICC relies on countries to make arrests and transfer suspects to it.
        correct: true
        why: >-
          Correct — at the investigation stage, "the ICC relies on countries to make arrests and transfer suspects to the
          ICC", which is why cooperation duties matter.
      - text: The Security Council arrests suspects itself, acting under Chapter VII.
        why: >-
          Tempting because the Council can bind states, but it does not arrest anyone; the slides say countries make
          arrests and transfer suspects.
      - text: Suspects always come voluntarily, as the ICC issues only summonses.
        why: >-
          Tempting because a summons to appear exists, but the Prosecution can also seek an arrest warrant, and arrests
          are made by countries.
  - key: q822
    type: mcq
    concept: icc-applicable-law-and-cooperation
    difficulty: 2
    stem: Where are ICC sentences served?
    options:
      - text: In the ICC's own prison in Rome, where the Statute was adopted in 1998.
        why: >-
          Tempting because the Statute was adopted in Rome, but the slides say sentences are served in countries that have
          agreed to enforce ICC sentences.
      - text: In countries that have agreed to enforce ICC sentences.
        correct: true
        why: >-
          Correct — the last stage on the slides, enforcement of sentence: sentences are served in countries that have
          agreed to enforce ICC sentences.
      - text: Always in the convicted person's state of nationality, under art 12.
        why: >-
          Tempting because nationality is an art 12 link, but that concerns jurisdiction; enforcement depends on states
          that have agreed to enforce sentences.
      - text: Always in the state where the crimes were committed, as the territorial state.
        why: >-
          Tempting because territoriality is an art 12 precondition, but sentences are served in countries that have
          agreed to enforce ICC sentences.
  - key: q823
    type: mcq
    concept: icc-applicable-law-and-cooperation
    difficulty: 2
    stem: What did paragraph 5 of Resolution 1970 decide about Libya's cooperation with the ICC?
    options:
      - text: That Libya could choose whether or not to cooperate, because it had lodged no art 12(3) declaration.
        why: >-
          Tempting because a declaration is the consent route, but para 5 "decides" that the Libyan authorities shall
          cooperate fully: a Council decision, which UN members agree to carry out (art 25 of the Charter).
      - text: That only States Parties must cooperate, under arts 86 and 88 of the Statute.
        why: >-
          Tempting because arts 86 and 88 bind States Parties, but para 5 itself decides that the Libyan authorities shall
          cooperate fully.
      - text: That the Libyan authorities shall cooperate fully with, and assist, the Court and the Prosecutor.
        correct: true
        why: >-
          Correct — para 5 "decides that the Libyan authorities shall cooperate fully with and provide any necessary
          assistance to the Court and the Prosecutor pursuant to this resolution".
      - text: That every UN member must arrest Libyan suspects, but Libya itself need not cooperate.
        why: >-
          Tempting because the resolution addresses other states too, but it binds the Libyan authorities and only urges
          other states.
  - key: q824
    type: mcq
    concept: icc-applicable-law-and-cooperation
    difficulty: 3
    verify: true
    stem: What did paragraph 5 of Resolution 1970 say about States not party to the Rome Statute (other than Libya)?
    options:
      - text: It decided that every non-party State shall cooperate fully, exactly as Libya must.
        why: >-
          Tempting because the Council can bind UN members, but para 5 "decides" only for the Libyan authorities and
          merely "urges" other states.
      - text: It recognised they have no obligation under the Statute, and only urged them.
        correct: true
        why: >-
          Correct — para 5 recognises "that States not party to the Rome Statute have no obligation under the Statute" and
          "urges all States" (the rest of the sentence is cut off on the slide).
      - text: It made them parties to the Rome Statute for the purposes of the Libyan situation.
        why: >-
          Tempting because the Council acts under Chapter VII, but para 5 expressly recognises that non-parties have no
          obligation under the Statute.
      - text: It said nothing about them, leaving them to arts 86 and 88 of the Statute.
        why: >-
          Tempting because the Statute has its own cooperation articles, but those bind States Parties; para 5 does
          address non-parties, recognising they have no Statute obligation.
  - key: q825
    type: mcq
    concept: icc-applicable-law-and-cooperation
    difficulty: 2
    contrasts-with:
      - icc-jurisdiction
    stem: >-
      Ukraine's 2014 letter said Ukraine "will cooperate with the Court without delay or exception, in conformity with
      Chapter IX". Which provision on the slides does that echo?
    options:
      - text: "Art 12(3): an accepting state shall cooperate without any delay or exception under Part 9."
        correct: true
        why: >-
          Correct — art 12(3) says the accepting State "shall cooperate with the Court without any delay or exception in
          accordance with Part 9"; Ukraine accepted jurisdiction under art 12(3).
      - text: "Art 86: States Parties shall cooperate fully in investigations and prosecutions."
        why: >-
          Tempting because art 86 is the general duty, but it binds States Parties; Ukraine's letter was an art 12(3)
          declaration, and its wording echoes art 12(3).
      - text: "Art 25 of the UN Charter: members carry out decisions of the Security Council."
        why: >-
          Tempting because art 25 creates cooperation duties for UN members, but Ukraine's letter rests on its own art
          12(3) declaration, not a Council decision.
      - text: "Art 17: a case is inadmissible while a state is genuinely investigating it."
        why: >-
          Tempting because Ukraine's courts could act, but art 17 is about admissibility; the "without delay or exception"
          wording comes from art 12(3).
  - key: q826
    type: mcq
    concept: icc-applicable-law-and-cooperation
    difficulty: 3
    variant-of: q821
    stem: >-
      The ICC issues an arrest warrant for a suspect living in Marlo, a State Party, which refuses to arrest him. On the
      slides, why does this matter and what duty applies?
    options:
      - text: "It does not matter: the ICC's own officers will simply arrest him in Marlo."
        why: >-
          Tempting because the ICC issues warrants, but the slides say it relies on countries to make arrests and transfer
          suspects.
      - text: >-
          Marlo may freely refuse, because only decisions of the Security Council under Chapter VII bind states to
          cooperate.
        why: >-
          Tempting because art 25 of the Charter binds members to Council decisions, but as a State Party Marlo is bound
          by art 86 to cooperate fully.
      - text: The ICC relies on states to arrest and transfer suspects, and art 86 binds Marlo to cooperate fully.
        correct: true
        why: >-
          Correct — arrests depend on countries (slides on the investigation stage), and art 86 requires States Parties to
          cooperate fully with the Court's investigation and prosecution.
      - text: The case becomes inadmissible under art 17, because Marlo is unwilling.
        why: >-
          Tempting because "unwilling" is an art 17 word, but it concerns genuine national proceedings; refusing to arrest
          is a breach of the duty to cooperate.
  - key: q827
    type: truefalse
    concept: icc-applicable-law-and-cooperation
    difficulty: 2
    statement: >-
      In Resolution 1970, the Security Council decided that the United Nations would bear the expenses of the Libya
      referral.
    answer: false
    why: >-
      False — para 8 "recognizes that none of the expenses incurred in connection with the referral shall be borne by the
      United Nations".
  - key: q828
    type: truefalse
    concept: icc-applicable-law-and-cooperation
    difficulty: 1
    statement: Ukraine's 2014 letter undertook that Ukraine would cooperate with the Court without delay or exception.
    answer: true
    why: >-
      True — the letter says that, as a consequence of its art 12(3) acceptance, Ukraine "will cooperate with the Court
      without delay or exception, in conformity with Chapter IX".
  - key: q121
    type: mcq
    concept: what-is-international-criminal-law
    difficulty: 1
    stem: What sentences can ICC judges impose, according to the slides?
    options:
      - text: Death, as the IMTFE imposed on seven of its defendants.
        why: >-
          Tempting because the IMTFE did impose seven death sentences, but the ICC slide gives imprisonment up to 30
          years, or life in exceptional circumstances.
      - text: Up to 30 years, and life in exceptional circumstances.
        correct: true
        why: >-
          Correct — at the trial stage, judges can sentence a person to up to 30 years, and under exceptional
          circumstances, life.
      - text: 15 to 52 years, the range the SCSL actually imposed.
        why: >-
          Tempting because those are this week's sentence figures, but they describe the SCSL's nine convictions, not the
          ICC's sentencing power.
      - text: Life in every genocide case, with no shorter term allowed.
        why: >-
          Tempting because genocide is the gravest crime, but the slide gives a general power of up to 30 years, with life
          only in exceptional circumstances.
  - key: q122
    type: mcq
    concept: what-is-international-criminal-law
    difficulty: 2
    stem: At the ICC, who decides whether there is enough evidence for a case to go to trial, and how?
    options:
      - text: The Prosecutor alone, as soon as an arrest warrant has issued.
        why: >-
          Tempting because the Prosecutor drives the case, but the slides give the decision to the Pre-Trial judges after
          a confirmation of charges hearing.
      - text: >-
          Pre-Trial judges, after hearing the Prosecution, Defence and victims' legal representative at confirmation of
          charges hearings.
        correct: true
        why: >-
          Correct — after hearing the Prosecution, the Defence and the legal representative of victims, the judges decide
          (usually within 60 days) if there is enough evidence for trial.
      - text: The Security Council, by a resolution confirming the charges laid.
        why: >-
          Tempting because the Council can refer situations, but it plays no part in confirming charges; that is for the
          Pre-Trial judges.
      - text: >-
          Three Trial judges, at the suspect's initial appearance, once they have confirmed identity and that the suspect
          understands the charges.
        why: >-
          Tempting because three judges sit at each stage, but the initial appearance is before Pre-Trial judges and only
          confirms identity and understanding of the charges.
  - key: q123
    type: mcq
    concept: what-is-international-criminal-law
    difficulty: 2
    stem: At the ICC trial stage, what must the Prosecution prove?
    options:
      - text: The accused's guilt on the balance of probabilities, before a jury.
        why: >-
          Tempting because some trials use juries and civil standards, but the slides say the Prosecution must prove guilt
          beyond reasonable doubt before three Trial judges.
      - text: That the accused's state is unwilling or unable genuinely to prosecute.
        why: >-
          Tempting because that is an ICC test, but it is the art 17 admissibility question, settled before trial, not
          what the Prosecution proves at trial.
      - text: The accused's guilt beyond reasonable doubt, before three Trial judges.
        correct: true
        why: >-
          Correct — the slides say that before three Trial judges, the Prosecution must prove beyond reasonable doubt the
          guilt of the accused.
      - text: That the accused acted as a Head of State or responsible official.
        why: >-
          Tempting because official position features in Nuremberg Principle III, but that principle removes a defence; it
          is not what the Prosecution must prove.
  - key: q124
    type: mcq
    concept: what-is-international-criminal-law
    difficulty: 2
    stem: Who may appeal an ICC Trial Chamber's decision on verdict and sentence?
    options:
      - text: Only the Defence, as one of the rights of the accused.
        why: >-
          Tempting because appeal rights are classic rights of the accused, but the slides give the right to appeal to
          both the Prosecutor and the Defence.
      - text: Only the legal representative of the victims.
        why: >-
          Tempting because victims take part (for example at confirmation hearings), but the slides give the right of
          appeal to the Prosecutor and the Defence.
      - text: Both the Prosecutor and the Defence.
        correct: true
        why: >-
          Correct — both the Prosecutor and the Defence have the right to appeal a Trial Chamber's decision on the verdict
          and the sentence.
      - text: Only the Security Council, under Chapter VII.
        why: >-
          Tempting because the Council can refer situations, but it has no appeal role; appeals belong to the Prosecutor
          and the Defence.
  - key: q125
    type: mcq
    concept: what-is-international-criminal-law
    difficulty: 3
    stem: How does the ICC process on the slides reflect "victims' rights" in ICL's procedural limb?
    options:
      - text: Victims' legal representatives are heard at confirmation of charges, and judges can order reparations.
        correct: true
        why: >-
          Correct — the judges hear the legal representative of victims before confirming charges, and at trial can order
          reparations for the victims, matching the procedural limb's "victims' rights".
      - text: Victims decide whether the Prosecutor may open an investigation at all.
        why: >-
          Tempting because the OTP weighs the interests of victims, but that is the Prosecutor's determination (and on the
          proprio motu route, the PTC's), not the victims' decision.
      - text: A victims' representative sits as one of the three Trial judges.
        why: >-
          Tempting because victims have a prominent part in proceedings, but the slides describe three Trial judges;
          victims are represented, not judges.
      - text: Victims choose which country enforces any sentence imposed.
        why: >-
          Tempting because enforcement is the final stage, but sentences are served in countries that have agreed to
          enforce ICC sentences, not ones victims choose.
  - key: q126
    type: truefalse
    concept: what-is-international-criminal-law
    difficulty: 1
    statement: At the ICC, a summons to appear lets a suspect appear voluntarily, and an arrest warrant may follow if they do not.
    answer: true
    why: >-
      True — the Prosecution may seek a summons to appear, under which suspects appear voluntarily; if not, an arrest
      warrant may be issued.
  - key: q127
    type: truefalse
    concept: what-is-international-criminal-law
    difficulty: 2
    statement: At the ICC, the confirmation of charges is decided by three Trial judges.
    answer: false
    why: >-
      False — confirmation of charges is a pre-trial step: the Pre-Trial judges decide, usually within 60 days, whether
      there is enough evidence for trial.
pretest:
