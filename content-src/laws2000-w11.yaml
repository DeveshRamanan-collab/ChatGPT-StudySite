  - key: q619
    type: short
    concept: icc-jurisdiction
    difficulty: 3
    prompt: "Applying Part 2 of the Rome Statute, discuss whether the ICC might have jurisdiction in the following hypothetical scenario: Corlis Valeron, a national of the Republic of Giskar, is accused of committing crimes against humanity in the Republic of Giskar, a non-party State to the Rome Statute at the time of the alleged acts. The United Nations Security Council refers the situation to the Prosecutor under Chapter VII of the Charter of the United Nations."
    model: |-
      The issue is whether the Court can exercise jurisdiction over a non-party's national for crimes on non-party
      territory. Crimes against humanity are an art 5 crime (defined in art 7). Under art 13(b) the Court may exercise
      jurisdiction where a situation is referred to the Prosecutor by the Security Council acting under Chapter VII of the
      UN Charter — the slides' example is the Libya referral of 2011. Art 12(2) requires the territorial state or the
      accused's nationality state to be a Party or to have accepted jurisdiction, but only "in the case of article 13,
      paragraph (a) or (c)". Here neither Giskar link would satisfy art 12(2): Giskar is not a Party and has lodged no art
      12(3) declaration. That does not matter, because the trigger is a Security Council referral under art 13(b), to which
      art 12(2) does not apply. The temporal requirement in art 11(1) must still be met: the crimes must have been committed
      after the Statute's entry into force. Conclusion: the ICC may exercise jurisdiction over Valeron, subject to art 11
      and then to admissibility under art 17.
    rubric:
      - id: r1
        criterion: Issue — jurisdiction over a non-party national on non-party territory
        marks: 1
        top-band: Identifies that the only route is the Security Council referral, because neither art 12(2) link exists.
        margin-note: Why does Giskar's non-party status not end the inquiry?
        authorities: []
      - id: r2
        criterion: Law — arts 5/7, 13(b), 12(2) (limited to 13(a) and (c)) and 11
        marks: 3
        top-band: States that crimes against humanity are an art 5 crime, quotes art 13(b), and explains that art 12(2) applies only to art 13(a) and (c).
        margin-note: Quote the words "article 13, paragraph (a) or (c)".
        authorities:
          - rome-statute-art-5
          - rome-statute-art-13
          - rome-statute-art-12
          - rome-statute-art-11
      - id: r3
        criterion: Application — applies the referral route and notes Libya 2011
        marks: 2
        top-band: Applies art 13(b) to the facts, cites the Libya 2011 referral as the slides' example, and flags the temporal check.
        margin-note: Good — now check timing under art 11.
        authorities: []
      - id: r4
        criterion: Conclusion — jurisdiction may be exercised, subject to art 11 and admissibility
        marks: 1
        top-band: Concludes yes, with the art 11 and art 17 caveats.
        margin-note: Clear conclusion — mention admissibility next.
        authorities: []
  - key: q620
    type: short
    concept: icc-jurisdiction
    difficulty: 3
    prompt: "Applying Part 2 of the Rome Statute, discuss whether the ICC might have jurisdiction in the following hypothetical scenario: Agon Megor, is accused of committing war crimes on the territory of the Republic of Ibbin, which became a State party to the Rome Statute after the acts in question."
    model: |-
      The issue is whether the Court can reach war crimes committed on Ibbin's territory before Ibbin became a Party. War
      crimes are an art 5 crime (art 8). Under art 11(2), where a state becomes a Party after the Statute's entry into force,
      the Court may exercise jurisdiction "only with respect to crimes committed after the entry into force of this Statute
      for that State, unless that State has made a declaration under article 12, paragraph 3". So the territorial link
      (art 12(2)(a)) does not cover these earlier acts unless Ibbin lodges an art 12(3) declaration with the Registrar
      accepting jurisdiction over the crime in question — it would then have to cooperate without delay or exception. Two
      other routes depend on facts not given. If Megor is a national of a state that was a Party at the time (and the acts
      post-date the Statute's entry into force), the nationality link in art 12(2)(b) could support a State Party referral
      or a proprio motu investigation. Alternatively, the Security Council could refer the situation under Chapter VII (art
      13(b)), to which art 12(2) does not apply. Conclusion: no jurisdiction on the territorial basis alone; jurisdiction
      depends on an art 12(3) declaration, Megor's nationality, or a Security Council referral.
    rubric:
      - id: r1
        criterion: Issue — crimes before the territorial state joined
        marks: 1
        top-band: Identifies the temporal problem created by Ibbin joining after the acts.
        margin-note: When did Ibbin join, relative to the acts? That is the whole problem.
        authorities: []
      - id: r2
        criterion: Law — art 11(2), art 12(3) declaration, art 12(2)(b), art 13(b)
        marks: 3
        top-band: Quotes art 11(2) and its art 12(3) exception, and identifies the nationality link and the Security Council route.
        margin-note: Art 11(2) has an exception — use it.
        authorities:
          - rome-statute-art-11
          - rome-statute-art-12
          - rome-statute-art-13
      - id: r3
        criterion: Application — tests each route against the facts given and the facts missing
        marks: 2
        top-band: Explains that the territorial route fails without a declaration, then shows how nationality or a Security Council referral could change the answer.
        margin-note: What about Megor's nationality? The facts are silent — say what turns on it.
        authorities: []
      - id: r4
        criterion: Conclusion — conditional answer stated clearly
        marks: 1
        top-band: Gives a clear conditional conclusion naming the three possible routes.
        margin-note: Good — a conditional conclusion is the right shape here.
        authorities: []
  - key: q701
    type: mcq
    concept: icc-admissibility-and-complementarity
    difficulty: 2
    set: pretest
    stem: The ICC is "complementary to national criminal jurisdictions" (art 1). What does that mean in practice under art 17?
    options:
      - text: The ICC hears appeals from national criminal courts in any case involving genocide or other international crimes.
        why: Tempting because "complementary" suggests a higher court, but the ICC is not an appeal court; complementarity means national courts come first, under art 17.
      - text: A case is inadmissible if a state with jurisdiction is genuinely investigating or prosecuting it.
        correct: true
        why: Correct — art 17 makes a case inadmissible where a state with jurisdiction is investigating or prosecuting it, unless the state is unwilling or unable genuinely to do so.
      - text: National courts may hear international crimes only after the ICC has declined the case.
        why: The reverse — complementarity gives national courts priority; the ICC steps in where states are unwilling or unable genuinely to act.
      - text: The ICC and the national courts must always try the same accused jointly.
        why: Tempting because hybrid courts mix national and international elements, but the ICC is separate; art 17 decides whether it may take a case at all.
  - key: q702
    type: mcq
    concept: icc-admissibility-and-complementarity
    difficulty: 2
    stem: "Under art 17, a case being investigated by a state with jurisdiction is inadmissible unless:"
    options:
      - text: The Prosecutor considers the ICC better placed to investigate.
        why: Tempting because the Prosecutor has proprio motu powers, but art 17 does not ask who is better placed; it asks whether the state is unwilling or unable genuinely to act.
      - text: The state is unwilling or unable genuinely to carry it out.
        correct: true
        why: Correct — art 17 makes such a case inadmissible "unless the State is unwilling or unable genuinely to carry out the investigation or prosecution".
      - text: The accused is a national of a state that is not a Party.
        why: Tempting because nationality matters under art 12(2), but that is a jurisdiction question; art 17 turns on the genuineness of national proceedings.
      - text: The Security Council has not referred the situation to the Court.
        why: Tempting because referrals trigger jurisdiction (art 13(b)), but whether there was a referral does not decide admissibility under art 17.
  - key: q703
    type: mcq
    concept: icc-admissibility-and-complementarity
    difficulty: 2
    stem: Which of these is a ground of inadmissibility listed in art 17?
    options:
      - text: The accused is a serving head of state.
        why: Tempting because heads of state raise immunity issues (Week 6), but art 17 says nothing about official position; Nuremberg Principle III points the other way.
      - text: The crime was committed on board an aircraft.
        why: Tempting because aircraft appear in art 12(2)(a), but there they ground jurisdiction through the state of registration; they are not an inadmissibility ground.
      - text: The case is not of sufficient gravity to justify further action.
        correct: true
        why: Correct — art 17 makes a case inadmissible where it "is not of sufficient gravity to justify further action by the Court".
      - text: The victims are nationals of a state that is not a Party to the Rome Statute.
        why: Tempting because nationality features in the Statute, but the victims' nationality is not an art 17 ground; gravity, national proceedings and prior trial are.
  - key: q704
    type: mcq
    concept: icc-admissibility-and-complementarity
    difficulty: 2
    stem: Which factor does the Court consider when deciding whether a state is unwilling?
    options:
      - text: Whether the proceedings were undertaken to shield the person from criminal responsibility.
        correct: true
        why: Correct — shielding the person concerned from criminal responsibility is the first indicator of unwillingness listed on the slides.
      - text: Whether the national judicial system has totally or substantially collapsed or is unavailable.
        why: Tempting because it also opens the door to the ICC, but collapse or unavailability of the judicial system goes to inability, not unwillingness.
      - text: Whether the state concerned has ratified the Rome Statute and accepted the Court's jurisdiction.
        why: Tempting because party status matters under art 12, but it is irrelevant to whether the state's own proceedings are genuine.
  - key: q705
    type: mcq
    concept: icc-admissibility-and-complementarity
    difficulty: 2
    stem: In determining a state's inability, what does the Court consider?
    options:
      - text: Whether a collapse or unavailability of its judicial system leaves it unable to obtain the accused or evidence.
        correct: true
        why: Correct — inability asks whether, due to a total or substantial collapse or unavailability of its national judicial system, the state cannot obtain the accused, evidence or testimony, or otherwise proceed.
      - text: Whether the proceedings were conducted for the purpose of shielding the person from responsibility.
        why: Tempting because it also makes a case admissible, but shielding is an indicator of unwillingness, not inability.
      - text: Whether there has been an unjustified delay inconsistent with an intent to bring the person to justice.
        why: Tempting because delay can look like incapacity, but unjustified delay is listed as an indicator of unwillingness.
      - text: Whether the state has decided not to prosecute after carrying out a genuine investigation.
        why: Tempting because it appears in art 17, but a genuine decision not to prosecute makes a case inadmissible; it is not a test of inability.
  - key: q706
    type: mcq
    concept: icc-admissibility-and-complementarity
    difficulty: 3
    stem: State Z's courts open proceedings against a general but adjourn them repeatedly for years without explanation, while he remains free. Which art 17 concept is engaged?
    options:
      - text: Inability — a total or substantial collapse or unavailability of the national judicial system.
        why: Tempting because nothing is happening, but Z's courts are functioning; they are choosing to delay, which points to unwillingness, not inability.
      - text: Unwillingness — unjustified delay inconsistent with an intent to bring him to justice.
        correct: true
        why: Correct — an unjustified delay in the proceedings which is inconsistent with an intent to bring the person concerned to justice is an indicator of unwillingness.
      - text: Insufficient gravity — the long delay shows the case is not serious enough.
        why: Tempting because gravity is an art 17 ground, but delay says nothing about how grave the crimes are; it goes to the genuineness of the proceedings.
      - text: Prior trial — the general has already been tried for the conduct.
        why: Tempting because there are proceedings, but no trial has concluded; the issue is whether the ongoing proceedings are genuine.
  - key: q707
    type: mcq
    concept: icc-admissibility-and-complementarity
    difficulty: 3
    stem: After a civil war, State Q's courts have stopped functioning and it cannot obtain the accused or the evidence, though it claims to be "investigating". What is the likely conclusion?
    options:
      - text: The case is inadmissible, because Q has jurisdiction and says it is investigating the case.
        why: Tempting because art 17 defers to states with jurisdiction, but only to genuine proceedings; a state unable genuinely to investigate does not bar the Court.
      - text: The case may be admissible, because Q is unable genuinely to carry out the investigation.
        correct: true
        why: Correct — a total or substantial collapse or unavailability of the national judicial system, leaving Q unable to obtain the accused or evidence, shows inability.
      - text: The case is inadmissible, because only unwillingness — never inability — opens the door.
        why: Wrong — art 17 refers to a state "unwilling or unable" genuinely to investigate; inability is an express route to admissibility.
      - text: The case must first be referred by the Security Council before the ICC can act on it.
        why: Tempting because the Council can refer situations, but admissibility under art 17 does not depend on a Council referral.
  - key: q708
    type: mcq
    concept: icc-admissibility-and-complementarity
    difficulty: 2
    stem: "A state genuinely investigated a case and decided not to prosecute. Under art 17, the case is:"
    options:
      - text: Inadmissible, unless the decision resulted from unwillingness or inability genuinely to prosecute.
        correct: true
        why: Correct — art 17 makes such a case inadmissible "unless the decision resulted from the unwillingness or inability of the State genuinely to prosecute".
      - text: Automatically admissible, because no trial ever took place in the national courts.
        why: Tempting because there was no trial, but art 17 also protects a genuine decision not to prosecute after investigation.
      - text: Admissible, but only if the Security Council later refers the situation.
        why: Tempting because Council referrals matter for jurisdiction, but admissibility turns on the genuineness of the national decision.
      - text: Inadmissible in every case, because the state with jurisdiction has already decided the question for itself.
        why: Too absolute — art 17 makes an exception where the decision not to prosecute resulted from unwillingness or inability.
  - key: q709
    type: mcq
    concept: icc-admissibility-and-complementarity
    difficulty: 2
    stem: When is a case inadmissible because the person has already been tried?
    options:
      - text: Whenever any court anywhere in the world has heard any charge of any kind against the person.
        why: Too wide — art 17 refers to a trial "for conduct which is the subject of the complaint", and to art 20(3), not to any charge before any court.
      - text: When tried for the conduct concerned and a Court trial is not permitted under art 20(3).
        correct: true
        why: "Correct — art 17: the person concerned has already been tried for conduct which is the subject of the complaint, and a trial by the Court is not permitted under art 20(3)."
      - text: Only where the earlier trial was before another international criminal tribunal.
        why: Tempting because tribunals share work (e.g. the MICT), but art 17 is not limited to earlier international trials; national trials count too.
  - key: q710
    type: mcq
    concept: icc-admissibility-and-complementarity
    difficulty: 3
    contrasts-with:
      - icc-jurisdiction
    stem: Which statement correctly separates jurisdiction from admissibility?
    options:
      - text: Jurisdiction asks whether the Court can hear the crime (arts 5–13); admissibility asks whether it should take the case, given national proceedings and gravity (art 17).
        correct: true
        why: Correct — arts 5, 11, 12 and 13 decide whether the Court has jurisdiction; art 17 decides whether a particular case is admissible, applying complementarity and gravity.
      - text: Jurisdiction concerns the national courts, while admissibility concerns the ICC itself.
        why: Tempting because complementarity looks at national courts, but both questions are about the ICC's own power; admissibility asks whether national courts are genuinely acting.
      - text: They are a single test, applied once by the Prosecutor when the case is opened.
        why: "Tempting because both arise early, but the Statute treats them separately: jurisdiction in arts 5–13 and admissibility in art 17."
      - text: Admissibility is decided first, and jurisdiction only if the case is admissible.
        why: The order is reversed — jurisdiction comes first (can the Court hear it at all?), then admissibility (should it take this case?).
  - key: q711
    type: mcq
    concept: icc-admissibility-and-complementarity
    difficulty: 2
    stem: Which list matches the three indicators of unwillingness on the slides?
    options:
      - text: Shielding the person; collapse of the national judicial system; insufficient gravity of the case.
        why: Mixed up — collapse of the judicial system goes to inability, and insufficient gravity is a separate inadmissibility ground.
      - text: Unjustified delay; inability to obtain evidence; a prior acquittal elsewhere.
        why: Mixed up — inability to obtain evidence goes to inability, and a prior trial is a separate inadmissibility ground under art 20(3).
      - text: Shielding the person; unjustified delay; proceedings lacking independence or impartiality.
        correct: true
        why: Correct — the three indicators are shielding, unjustified delay inconsistent with an intent to bring the person to justice, and proceedings not conducted independently or impartially.
  - key: q712
    type: mcq
    concept: icc-admissibility-and-complementarity
    difficulty: 2
    stem: Art 17 asks the Court to assess unwillingness "having regard to" what?
    options:
      - text: The views of the Security Council on the situation.
        why: Tempting because the Council can refer situations, but the slides say unwillingness is assessed having regard to the principles of due process.
      - text: The national law and procedure of the state whose proceedings are under review.
        why: "Tempting because national proceedings are under review, but the yardstick is international: the principles of due process recognised by international law."
      - text: The principles of due process recognised by international law.
        correct: true
        why: Correct — the Court considers unwillingness "having regard to the principles of due process recognized by international law".
      - text: The wishes of the victims' legal representatives.
        why: Tempting because victims have a prominent part in ICL proceedings, but the art 17 yardstick is due process recognised by international law.
  - key: q713
    type: mcq
    concept: icc-admissibility-and-complementarity
    difficulty: 3
    variant-of: q706
    stem: State R opens a prosecution of a militia leader, but the case is run by judges hand-picked by the leader's political allies and appears designed to end in acquittal. Does art 17 bar the ICC?
    options:
      - text: Yes — any national prosecution makes the case inadmissible, whatever its quality.
        why: Too absolute — art 17 defers only to genuine proceedings; proceedings that are not independent or impartial can show unwillingness.
      - text: Yes — the ICC may intervene only where a national judicial system has collapsed.
        why: Tempting because collapse is one route (inability), but unwillingness is a separate route, and partial proceedings point to it.
      - text: No — the ICC always has priority over national courts for art 5 crimes.
        why: The reverse of complementarity — national courts come first; the ICC acts only where states are unwilling or unable genuinely to proceed.
      - text: Not necessarily — partial proceedings inconsistent with an intent to bring him to justice show unwillingness.
        correct: true
        why: Correct — proceedings not conducted independently or impartially, in a manner inconsistent with an intent to bring the person to justice, indicate unwillingness.
  - key: q714
    type: mcq
    concept: icc-admissibility-and-complementarity
    difficulty: 2
    stem: What is the role of gravity under art 17?
    options:
      - text: Only the single gravest case in each situation may proceed to trial before the Court.
        why: Tempting because the ICC targets the most serious crimes, but art 17 does not limit each situation to one case; it excludes cases not grave enough.
      - text: A case not of sufficient gravity to justify further action is inadmissible.
        correct: true
        why: Correct — art 17 makes a case inadmissible where it is not of sufficient gravity to justify further action by the Court.
      - text: Gravity decides which of the four art 5 crimes the Prosecutor should charge.
        why: Tempting because the crimes differ in character, but gravity under art 17 is an admissibility filter, not a rule for choosing charges.
  - key: q715
    type: mcq
    concept: icc-admissibility-and-complementarity
    difficulty: 2
    stem: Under art 17, whose unwillingness or inability opens the door to the ICC where a case is being investigated nationally?
    options:
      - text: The Security Council's, when it declines to refer the situation.
        why: Tempting because the Council can refer situations, but art 17 looks at the state handling the case, not the Council.
      - text: Every State Party's, acting together through their general obligation to cooperate.
        why: Tempting because States Parties must cooperate (art 86), but art 17 asks about the particular state with jurisdiction that is investigating or prosecuting.
      - text: That of the state which has jurisdiction and is investigating or prosecuting.
        correct: true
        why: Correct — art 17 asks whether "the State" which has jurisdiction over the case and is investigating or prosecuting it is unwilling or unable genuinely to do so.
      - text: The accused person's, if they refuse to submit to national courts.
        why: Tempting because accused persons may resist, but art 17 concerns the state's genuineness, not the accused's cooperation.
  - key: q716
    type: mcq
    concept: icc-admissibility-and-complementarity
    difficulty: 3
    variant-of: q704
    stem: State W investigates a minister for crimes against humanity, but the investigation is designed to clear him before any trial. Which indicator of unwillingness is engaged?
    options:
