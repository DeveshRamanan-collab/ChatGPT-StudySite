    stem: Which question belongs to admissibility (art 17) rather than to jurisdiction (arts 5–13)?
    options:
      - text: Whether the conduct is genocide, a crime against humanity, a war crime or aggression.
        why: Tempting because it is the first question in any ICC problem, but whether the conduct is an art 5 crime is jurisdiction ratione materiae, not admissibility.
      - text: Whether a state with jurisdiction is genuinely investigating or prosecuting the case.
