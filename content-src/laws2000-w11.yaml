  - key: q820
    type: short
    concept: icc-applicable-law-and-cooperation
    difficulty: 3
    verify: true
    prompt: In what circumstances are non-party States to the Rome Statute of the International Criminal Court ('Rome Statute') required to cooperate with the Court? What consequences might that entail for the ICC?
    model: |-
      The issue is when a state that has not joined the Rome Statute must cooperate, and what that means for the Court.
      As a treaty, the Statute binds its parties: States Parties must "cooperate fully with the Court in its investigation
      and prosecution of crimes" (art 86) and have national procedures for every form of cooperation (art 88). A non-party
      is not bound as such, but on this week's materials it comes under a duty in two ways. First, by consent: a non-party
      may accept the Court's jurisdiction over a crime by declaration lodged with the Registrar (art 12(3)), and "the
      accepting State shall cooperate with the Court without any delay or exception in accordance with Part 9". Second,
      through the Security Council: where the Council, acting under Chapter VII, refers a situation (art 13(b), as with
      Libya in 2011) and requires states to cooperate, UN members are bound because under art 25 of the Charter they "agree
      to accept and carry out the decisions of the Security Council". Consequences: outside those two routes the Court
      depends on voluntary cooperation, and for situations in non-party states its reach turns on the Security Council's
      willingness to refer and to require cooperation. Conclusion: an art 12(3) declaration or a binding Chapter VII
      decision.
    rubric:
      - id: r1
        criterion: Issue — when a non-party must cooperate, and the consequences
        marks: 1
        top-band: "Identifies both limbs of the question: the circumstances and the consequences for the Court."
        margin-note: Two questions here — answer both.
        authorities: []
      - id: r2
        criterion: Law — arts 86 and 88, art 12(3), art 13(b) and art 25 UN Charter
        marks: 3
        top-band: Explains that arts 86 and 88 bind States Parties, quotes art 12(3)'s cooperation duty, and links a Chapter VII referral to art 25.
        margin-note: Where does a non-party's obligation come from? Name the article.
        authorities:
          - rome-statute-arts-86-88
          - rome-statute-art-12
          - rome-statute-art-13
          - un-charter-art-25
      - id: r3
        criterion: Application — consent route, Security Council route, and the dependence that follows
        marks: 2
        top-band: Applies both routes and draws out the consequence that, beyond them, the Court depends on voluntary cooperation and on the Security Council.
        margin-note: Good on the routes — what does this mean for the Court in practice?
        authorities: []
      - id: r4
        criterion: Conclusion — two routes, one consequence
        marks: 1
        top-band: Summarises the two routes and the consequence in a sentence or two.
        margin-note: Pull it together in one line.
        authorities: []

  - key: q521
    type: mcq
    concept: hybrid-tribunals-and-the-eccc
