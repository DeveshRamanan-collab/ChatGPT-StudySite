  - key: q621
    type: mcq
    concept: icc-jurisdiction
    difficulty: 1
    stem: When and where was the ICC established, according to the slides?
    options:
      - text: In The Hague, in 1948, when the Genocide Convention was adopted.
        why: >-
          Tempting because 1948 is on the slide, but then the General Assembly only recognised the need for a permanent
          court; the ICC came in 1998.
      - text: In New York, in 1993, by Security Council Resolution 827.
        why: >-
          Tempting because Resolution 827 created a tribunal, but that was the ad hoc ICTY; the ICC is treaty-based,
          established in Rome in 1998.
      - text: In Rome, on 17 July 1998, by a conference of 160 states.
        correct: true
        why: >-
          Correct — on 17 July 1998, in Rome, a conference of 160 states established the first treaty-based permanent
          international criminal court.
      - text: In Nuremberg, in 1946, by General Assembly Resolution 95(I).
        why: >-
          Tempting because Resolution 95(I) affirmed the Nuremberg Principles, but it did not create a court; the ICC was
          established in Rome in 1998.
  - key: q622
    type: mcq
    concept: icc-jurisdiction
    difficulty: 2
    stem: >-
