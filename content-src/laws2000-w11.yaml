  - key: q625
    type: mcq
    concept: icc-jurisdiction
    difficulty: 2
    stem: In the slides' ICC flowchart, which question comes straight after "Situation referred? (art 13)"?
    options:
      - text: Temporal jurisdiction met? (art 11)
        why: >-
          Tempting because art 11 is an early gate, but the flowchart asks it before the referral question: art 5, art 11,
          art 13, then art 12.
      - text: Issues of admissibility? (art 17)
        why: >-
          Tempting because admissibility follows jurisdiction, but it is the last question, after the art 12
          preconditions.
      - text: Preconditions met? (art 12)
        correct: true
        why: >-
          Correct — the flowchart runs: subject matter (art 5), temporal (art 11), situation referred (art 13),
          preconditions (art 12), admissibility (art 17), then proceed to the ICC.
      - text: Subject-matter jurisdiction met? (art 5)
        why: >-
          Tempting because it is the basic gate, but it comes first in the flowchart, before the temporal and referral
          questions.
  - key: q626
    type: mcq
    concept: icc-jurisdiction
    difficulty: 1
    stem: Which of these is NOT one of the acts listed in art 6 (genocide)?
    options:
      - text: Forcibly transferring children of the group to another group.
        why: >-
          Tempting to pick because it involves no killing, but it is art 6(e), a listed act of genocide when done with
          intent to destroy the group.
      - text: Imposing measures intended to prevent births within the group.
        why: Tempting to pick because it is indirect, but it is art 6(d), one of the five listed acts.
      - text: Deporting members of the group to another State.
        correct: true
        why: >-
          Correct — deportation is not among the five art 6 acts (killing; serious bodily or mental harm; destructive
          conditions of life; preventing births; transferring children).
      - text: Causing serious bodily or mental harm to members of the group.
        why: Tempting to pick because harm short of death seems lesser, but it is art 6(b), a listed act of genocide.
  - key: q627
    type: mcq
    concept: icc-jurisdiction
    difficulty: 2
    contrasts-with:
      - post-wwii-military-tribunals
    stem: What is the key element of genocide under art 6, as the slide puts it?
    options:
      - text: Acts committed as part of an attack against any civilian population.
        why: >-
          Tempting because it echoes crimes against humanity ("against any civilian population"), but the slide's key
          element for genocide is intent to destroy a protected group.
      - text: Acts committed with intent to destroy, in whole or in part, a protected group.
        correct: true
        why: >-
          Correct — the slide's key element is acts committed with intent to destroy, in whole or in part, a national,
          ethnical, racial or religious group, as such.
      - text: Acts by a person who controls the political or military action of a State.
        why: >-
          Tempting because it is the other key element shown, but that is the crime of aggression (art 8 bis), not
          genocide.
      - text: Acts committed in violation of the laws or customs of war in occupied territory.
        why: >-
          Tempting because it is a core crime, but that is the war crimes formula (IMT Charter art 6(b)); genocide turns
          on intent to destroy a group.
  - key: q628
    type: mcq
    concept: icc-jurisdiction
    difficulty: 2
    stem: Which groups does art 6 protect?
    options:
      - text: Political, racial or religious groups, as in the Nuremberg persecutions limb.
        why: >-
          Tempting because Nuremberg's crimes against humanity included persecution on political, racial or religious
          grounds, but art 6 lists national, ethnical, racial or religious groups.
      - text: Any civilian population, before or during a war.
        why: >-
          Tempting because it is the Nuremberg crimes against humanity formula, but genocide protects defined groups, not
          any civilian population.
      - text: Any group the Prosecutor identifies, including social and political groups.
        why: >-
          Tempting because the Prosecutor drives cases, but art 6 fixes the protected groups itself: national, ethnical,
          racial or religious.
      - text: National, ethnical, racial or religious groups, as such.
        correct: true
        why: >-
          Correct — art 6 covers acts committed with intent to destroy, in whole or in part, "a national, ethnical, racial
          or religious group, as such".
  - key: q629
    type: mcq
    concept: icc-jurisdiction
    difficulty: 3
    variant-of: q626
    stem: >-
      Officials of Ostrava, intending to destroy the Velan religious minority as such, have Velan children forcibly moved
      into majority-group families. No Velan is killed. Is this genocide under art 6?
    options:
      - text: Yes — forcibly transferring the group's children is a listed act, done with intent to destroy it.
        correct: true
        why: >-
          Correct — art 6(e) lists forcibly transferring children of the group to another group, and a religious group is
          protected; the intent to destroy the group as such is present.
      - text: No — genocide requires killing members of the group; without deaths it can only be something else.
        why: >-
          Tempting because killing is the first listed act, but art 6 lists five acts, and forcibly transferring children
          is one of them.
      - text: No — a religious group is not protected; art 6 covers only national and racial groups.
        why: >-
          Tempting because "national" and "racial" come first, but art 6 protects national, ethnical, racial or religious
          groups.
      - text: Yes — but only Ostrava as a State is liable, because genocide is a wrong of States.
        why: >-
          Tempting because officials act for the State, but ICL imposes individual criminal liability; the officials
          themselves commit the crime.
  - key: q630
    type: mcq
    concept: icc-jurisdiction
    difficulty: 2
    stem: Under art 8 bis(1), who can commit the crime of aggression?
    options:
      - text: >-
          Any soldier who takes part in an armed attack on another State, whatever their rank or their role in the
          decision.
        why: >-
          Tempting because soldiers carry out the use of force, but art 8 bis(1) confines the crime to a person in a
          position to control or direct State action.
      - text: A person in a position effectively to control or direct the political or military action of a State.
        correct: true
        why: >-
          Correct — art 8 bis(1) requires planning, preparation, initiation or execution by "a person in a position
          effectively to exercise control over or to direct the political or military action of a State".
      - text: A State itself, as an entity, rather than any individual person acting for it.
        why: >-
          Tempting because an act of aggression is a State's use of force, but the crime is committed by an individual
          leader; ICL imposes personal liability.
      - text: Any person who plans an attack, whether or not they hold any public position.
        why: >-
          Tempting because "planning" is one of the listed conduct verbs, but the planner must be in a position
          effectively to control or direct State action.
  - key: q631
    type: mcq
    concept: icc-jurisdiction
    difficulty: 3
    stem: What threshold must an act of aggression meet to found the crime of aggression under art 8 bis(1)?
    options:
      - text: It must follow a formal declaration of war by the attacking State.
        why: >-
          Tempting because war is the setting, but art 8 bis(2) says the listed acts qualify "regardless of a declaration
          of war".
      - text: By its character, gravity and scale, it is a manifest violation of the UN Charter.
        correct: true
        why: >-
          Correct — art 8 bis(1) requires an act of aggression "which, by its character, gravity and scale, constitutes a
          manifest violation of the Charter of the United Nations".
      - text: It must cause the death of at least one national of the victim State.
        why: >-
          Tempting because gravity matters, but art 8 bis(1) measures character, gravity and scale against the Charter,
          not a casualty count.
      - text: It must be condemned in a Security Council resolution under Chapter VII.
        why: >-
          Tempting because the Council refers situations under Chapter VII, but the slide's threshold is a manifest
          violation of the Charter by character, gravity and scale.
  - key: q632
    type: mcq
    concept: icc-jurisdiction
    difficulty: 3
    stem: Under art 8 bis(2), does a declaration of war matter to whether a listed act is an "act of aggression"?
    options:
      - text: Yes — only acts that follow a formal declaration of war can qualify.
        why: >-
          Tempting because "war of aggression" is the old Nuremberg phrase, but art 8 bis(2) says the listed acts qualify
          regardless of a declaration of war.
      - text: No — the listed acts qualify regardless of a declaration of war, as under GA resolution 3314 (XXIX).
        correct: true
        why: >-
          Correct — art 8 bis(2): any of the listed acts, "regardless of a declaration of war", qualify as an act of
          aggression in accordance with GA resolution 3314 (XXIX) of 14 December 1974.
      - text: Yes — a declaration of war turns what would be aggression into a lawful act.
        why: >-
          Tempting because declarations once mattered in the law of war, but art 8 bis(2) makes a declaration irrelevant
          to whether a listed act qualifies.
      - text: No — because art 8 bis applies only to fighting inside a single State.
        why: >-
          Tempting because "no" is right, but art 8 bis(2) is about force by a State against another State's sovereignty,
          integrity or independence.
  - key: q633
    type: mcq
    concept: icc-jurisdiction
    difficulty: 1
    stem: By Resolution 1970 (2011), the Security Council referred the situation in Libya since which date?
    options:
      - text: 26 February 2011.
        why: >-
          Tempting because it is on the same slide, but 26 February 2011 is the date the resolution was adopted (6491st
          meeting), not the start of the referred situation.
      - text: 15 February 2011.
        correct: true
        why: >-
          Correct — para 4 refers "the situation in the Libyan Arab Jamahiriya since 15 February 2011 to the Prosecutor of
          the International Criminal Court".
      - text: 17 July 1998.
        why: >-
          Tempting because it is an ICC date, but 17 July 1998 is when the Rome conference established the Court, not the
          start of the Libyan situation.
      - text: The date Libya joined the Statute.
        why: >-
          Tempting because art 11(2) ties time to a state joining, but the resolution itself fixes the start: the
          situation since 15 February 2011.
  - key: q634
    type: mcq
    concept: icc-jurisdiction
    difficulty: 3
    stem: Which art 13 trigger does Resolution 1970 illustrate, and what follows for art 12(2)?
    options:
      - text: Art 13(a), a State Party referral — so Libya, or the accused's state, must be a party.
        why: >-
          Tempting because art 13(a) is the first trigger, but Resolution 1970 is a Security Council referral; it is the
          State Party route that needs an art 12(2) link.
      - text: Art 13(b), a Chapter VII Council referral — so the art 12(2) preconditions do not apply.
        correct: true
        why: >-
          Correct — the slides call it the "UNSC Chapter VII referral of Libya to the ICC"; art 12(2) applies only to art
          13(a) and (c), as the slides' diagram shows.
      - text: Art 13(c), the Prosecutor's proprio motu power — so Pre-Trial Chamber authorisation is needed.
        why: >-
          Tempting because PTC authorisation appears in the diagram, but it belongs to the proprio motu route; Libya was
          referred by the Security Council.
      - text: Art 12(3), a declaration — so Libya must cooperate without delay or exception under Part 9.
        why: >-
          Tempting because cooperation is in para 5, but Resolution 1970 is a Council referral, not an art 12(3)
          declaration by Libya.
  - key: q635
    type: mcq
    concept: icc-jurisdiction
    difficulty: 3
    verify: true
    stem: What did paragraph 6 of Resolution 1970 decide about personnel from non-party States outside Libya?
    options:
      - text: They are subject to their own State's exclusive jurisdiction for acts related to operations in Libya.
        correct: true
        why: >-
          Correct — para 6 decides that nationals, officials or personnel from a non-party State outside Libya "shall be
          subject to the exclusive jurisdiction of that State" for acts related to operations there (text cut off on the
          slide).
      - text: They are subject to the ICC's jurisdiction for all acts in Libya since 15 February 2011.
        why: >-
          Tempting because the referral covers the situation since that date, but para 6 carves these personnel out in
          favour of their own State's exclusive jurisdiction.
      - text: They must be surrendered to the ICC by the Libyan authorities whenever requested.
        why: >-
          Tempting because para 5 binds the Libyan authorities to cooperate, but para 6 is about exclusive home-State
          jurisdiction over foreign non-party personnel.
      - text: They become bound by the Rome Statute, as the Council treats their States as parties.
        why: >-
          Tempting because the Council acts under Chapter VII, but para 5 recognises non-parties have no obligation under
          the Statute, and para 6 leaves jurisdiction with their own State.
  - key: q636
    type: mcq
    concept: icc-jurisdiction
    difficulty: 2
    stem: In the slides' Philippines timeline, which step shows the proprio motu route at work?
    options:
      - text: The Security Council referred the Philippines situation to the Prosecutor under Chapter VII.
        why: >-
          Tempting because a Council referral is one route, but the Philippines example sits under the "Prosecutor's
          Proprio Motu Power" heading and involves no Council referral.
      - text: Pre-Trial Chamber I authorised the Prosecutor to start the investigation (15 September 2021).
        correct: true
        why: >-
          Correct — the Prosecutor requested an investigation on 24 May 2021 and Pre-Trial Chamber I authorised it on 15
          September 2021: the proprio motu route needs PTC authorisation.
      - text: The Philippines lodged an art 12(3) declaration accepting the Court's jurisdiction.
        why: >-
          Tempting because Ukraine did that in 2014, but no declaration appears on the Philippines timeline; the
          Philippines' only step shown is a deferral request.
      - text: A group of States Parties referred the situation under arts 13(a) and 14(1).
        why: >-
          Tempting because that is the Ukraine 2022 letter, but the Philippines investigation began with the Prosecutor's
          own request.
  - key: q637
    type: mcq
    concept: icc-jurisdiction
    difficulty: 2
    stem: On the slides' diagram, which route needs authorisation by the Pre-Trial Chamber before an investigation?
    options:
      - text: An investigation by the Prosecutor proprio motu.
        correct: true
        why: >-
          Correct — the diagram runs "3. Proprio Motu → Authorisation by PTC → Investigation", while State Party and
          Security Council referrals go straight to investigation.
      - text: A Security Council referral under Chapter VII.
        why: >-
          Tempting because the Council is a political body, but on the diagram a Council referral leads straight to
          investigation, with no PTC step.
      - text: A State Party referral under art 14.
        why: >-
          Tempting because the State Party route needs an art 12(2) link, but it too goes straight to investigation on the
          diagram.
      - text: All three routes, whichever trigger is used.
        why: >-
          Tempting because judicial checks seem universal, but the diagram puts the PTC authorisation step only on the
          proprio motu route.
  - key: q638
    type: mcq
    concept: icc-jurisdiction
    difficulty: 2
    stem: On the slides' diagram, the precondition "territoriality or nationality" attaches to which triggers?
    options:
      - text: Security Council referral only, because the Council acts for all UN members.
        why: >-
          Tempting because the Council's role is special, but the diagram does the reverse: no precondition arrow runs to
          the Council referral.
      - text: State Party referral and proprio motu, not Security Council referral.
        correct: true
        why: >-
          Correct — the diagram links territoriality or nationality to (1) SP referral and (3) proprio motu only, matching
          art 12(2), which applies to art 13(a) and (c).
      - text: All three triggers equally, including a Security Council referral.
        why: Tempting because preconditions sound universal, but art 12(2) and the diagram confine them to art 13(a) and (c).
      - text: Proprio motu only, because State Party referrals need no link at all.
        why: >-
          Tempting because the proprio motu route has the extra PTC step, but the diagram also attaches the precondition
          to State Party referrals.
  - key: q639
    type: mcq
    concept: icc-jurisdiction
    difficulty: 2
    stem: What did Ukraine's letter to the Registrar of 9 April 2014 do?
    options:
      - text: It referred the situation in Ukraine as a State Party under arts 13(a) and 14(1).
        why: >-
          Tempting because the slide also shows an arts 13(a)/14(1) letter, but that is the 2022 referral by a group of
          States Parties, not Ukraine's 2014 letter.
      - text: >-
          It accepted the Court's jurisdiction under art 12(3) for acts in Ukraine from 21 November 2013 to 22 February
          2014.
        correct: true
        why: >-
          Correct — "in conformity with Article 12, paragraph 3", Ukraine recognised the Court's jurisdiction over acts on
          its territory from 21 November 2013 to 22 February 2014.
      - text: It asked the Security Council to refer the situation in Ukraine under Chapter VII.
        why: >-
          Tempting because Council referral is a trigger, but the letter was addressed to the ICC Registrar and lodged an
          art 12(3) declaration.
      - text: >-
          It sought deferral of an investigation, on the basis that national proceedings in Ukraine's own courts were
          already under way.
        why: >-
          Tempting because that is a state step on the slides, but it is the Philippines' 2021 request, not Ukraine's 2014
          letter.
  - key: q640
    type: mcq
    concept: icc-jurisdiction
    difficulty: 3
    stem: How did the UK Ambassador's letter of 2 March 2022 bring the situation in Ukraine before the Prosecutor?
    options:
      - text: >-
          As a Security Council referral under art 13(b), made by the UK acting on the Council's behalf and in the
          Council's name.
        why: >-
          Tempting because the UK acted with others, but the letter says it acts "under article 13(a) and 14(1)", the
          State Party route, not the Council's.
      - text: As an art 12(3) declaration lodged by the UK on Ukraine's behalf.
        why: >-
          Tempting because Ukraine had used art 12(3) in 2014, but a declaration is lodged by the accepting state itself;
          the 2022 letter is a referral.
      - text: As a State Party referral under arts 13(a) and 14(1), coordinated with other States Parties including Australia.
        correct: true
        why: >-
          Correct — the letter acts "under article 13(a) and 14(1)" and lists the referring States Parties, among them the
          Commonwealth of Australia.
      - text: As a proprio motu request needing authorisation by the Pre-Trial Chamber.
        why: >-
          Tempting because the Prosecutor is the addressee, but the letter is a referral by States Parties, not the
          Prosecutor acting on their own initiative.
  - key: q641
    type: truefalse
    concept: icc-jurisdiction
    difficulty: 2
    statement: >-
      On the slides' diagram, a State Party referral leads to an investigation without any authorisation by the Pre-Trial
      Chamber.
    answer: true
    why: >-
      True — the diagram runs "1. SP Referral → Investigation"; only the proprio motu route passes through "Authorisation
      by PTC".
  - key: q642
    type: truefalse
    concept: icc-jurisdiction
    difficulty: 1
    statement: The slides describe the ICC as the first treaty-based permanent international criminal court.
    answer: true
    why: >-
      True — the slide says that on 17 July 1998, in Rome, a conference of 160 states established the first treaty-based
      permanent international criminal court.
  - key: q643
    type: truefalse
    concept: icc-jurisdiction
    difficulty: 2
    statement: Under art 8 bis, any soldier who takes part in an act of aggression commits the crime of aggression.
    answer: false
    why: >-
      False — the crime requires a person "in a position effectively to exercise control over or to direct the political
      or military action of a State"; the key element is control.
  - key: q644
    type: match
    concept: icc-jurisdiction
    difficulty: 2
    prompt: Match each example on the slides to the route it illustrates.
    pairs:
      - left: Resolution 1970 on Libya (2011)
        right: Security Council referral under Chapter VII (art 13(b))
      - left: Philippines investigation (2021)
        right: Prosecutor proprio motu, authorised by Pre-Trial Chamber I (art 13(c))
      - left: UK letter on Ukraine (2 March 2022)
        right: State Party referral (arts 13(a) and 14(1))
