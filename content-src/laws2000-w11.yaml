  - key: q320
    type: short
    concept: nuremberg-principles
    difficulty: 3
    prompt: General Ravel, a former head of state, is charged before an international criminal tribunal with crimes against humanity. He argues that (i) his state's law imposed no penalty for the conduct, (ii) he acted as head of state, and (iii) he was carrying out the decisions of his government's ruling council. Using the Nuremberg Principles affirmed in General Assembly Resolution 95(I), advise on each argument.
    model: |-
      The issue is whether any of Ravel's three arguments relieves him of responsibility under international law. In
      Resolution 95(I) (11 December 1946) the General Assembly affirmed the principles recognised in the Charter and
      judgment of the Nürnberg Tribunal. Principle I states the starting point: "any person" who commits a crime under
      international law is responsible and liable to punishment, and crimes against humanity were an international crime
      from the IMT Charter (art 6(C)). (i) Principle II answers the internal-law argument: that internal law imposes no
      penalty "does not relieve the person who committed the act from responsibility under international law". (ii)
      Principle III answers the head-of-state argument: acting as Head of State does not relieve him from responsibility.
      (iii) Principle IV deals with acting pursuant to an order of his Government or of a superior; it does not relieve him
      "provided a moral choice was in fact possible to him". As head of state Ravel was hardly without a moral choice, so the
      argument should fail on the facts. Conclusion: none of the three arguments relieves Ravel of responsibility.
    rubric:
      - id: r1
        criterion: Issue — identifies whether each argument relieves Ravel of responsibility
        marks: 1
        top-band: Frames the question as responsibility under international law, not under his state's law, and treats each argument separately.
        margin-note: Three arguments — take them one at a time.
        authorities: []
      - id: r2
        criterion: Law — Resolution 95(I) and Principles I–IV accurately stated
        marks: 3
        top-band: States Resolution 95(I) (1946) and quotes the operative words of Principles I–IV, including the "moral choice" qualifier in IV.
        margin-note: Good — but you left out the qualifier in Principle IV.
        authorities:
          - unga-resolution-95-i
          - imt-charter-art-6
      - id: r3
        criterion: Application — applies Principles II, III and IV to arguments (i)–(iii)
        marks: 3
        top-band: Matches each argument to its principle and applies the moral-choice test to the facts rather than simply asserting it.
        margin-note: Was a moral choice in fact possible to a head of state? Say why.
        authorities:
          - unga-resolution-95-i
      - id: r4
        criterion: Conclusion — clear advice on each argument
        marks: 1
        top-band: Concludes that none of the three arguments relieves him of responsibility, with a one-line reason for each.
        margin-note: Give the bottom line for each argument.
        authorities: []
  - key: q401
    type: mcq
    concept: ad-hoc-tribunals-icty-and-ictr
    difficulty: 1
    set: pretest
