cards:
  - type: basic
    concept: what-is-international-criminal-law
    front: How do the slides define international crimes?
    back: Breaches of international rules entailing the personal criminal liability of the individual(s) concerned.
    source: Week 11 Lecture Slides, slide 4
  - type: basic
    concept: what-is-international-criminal-law
    front: What are the two limbs of international criminal law?
    back: Substantive law — governs the four core international crimes and demands that states prosecute them; procedural law — regulates the stages of international criminal proceedings, found in the statutes and rules of the tribunals.
    source: Week 11 Lecture Slides, slide 4–5
  - type: basic
    concept: what-is-international-criminal-law
    front: What does ICL's substantive law cover, according to the slides?
    back: The acts amounting to core crimes; the subjective elements required; the circumstances in which an accused may nevertheless not be held criminally liable; and the conditions under which states may prosecute or bring accused persons to trial.
    source: Week 11 Lecture Slides, slide 4
  - type: cloze
    concept: what-is-international-criminal-law
    text: ICL is {{c1::relatively new}}, {{c2::rudimentary}} (unclear actus reus and mens rea; penalties not laid down precisely) and {{c3::hybrid}} (characteristics from IHL, IHRL and national criminal laws).
    source: Week 11 Lecture Slides, slide 6
  - type: basic
    concept: post-wwii-military-tribunals
    front: What created the Nuremberg IMT, and whom did it make responsible?
    back: The London Agreement, with the IMT Charter annexed; it provided for the individual criminal responsibility of leaders, organisers, instigators and accomplices.
    source: Week 11 Lecture Slides, slide 10
  - type: cloze
    concept: post-wwii-military-tribunals
    text: "Art 6 IMT Charter: (A) {{c1::crimes against peace}}; (B) {{c2::war crimes}}; (C) {{c3::crimes against humanity}} — each with individual responsibility."
    source: Week 11 Lecture Slides, slide 10
  - type: basic
    concept: post-wwii-military-tribunals
    front: How was the IMTFE established, and what was the outcome?
    back: By proclamation of US General Douglas MacArthur implementing the Potsdam Declaration; 28 defendants charged with 55 counts; all found guilty, though not on all counts; seven death sentences, the rest imprisonment.
    source: Week 11 Lecture Slides, slide 13
  - type: basic
    concept: post-wwii-military-tribunals
    front: What was Control Council Law No 10?
    back: The basis for domestic prosecutions in the Allied zones of occupation — best known for twelve trials in the US zone by the Nuremberg Military Tribunals.
    source: Week 11 Lecture Slides, slide 14
  - type: cloze
    concept: nuremberg-principles
    text: The General Assembly affirmed the Nuremberg Principles in Resolution {{c1::95(I)}} on {{c2::11 December 1946}}.
    source: Week 11 Lecture Slides, slide 12
  - type: basic
    concept: nuremberg-principles
    front: State Nuremberg Principles II, III and IV in a line each.
    back: "II: no penalty in internal law does not relieve responsibility. III: acting as head of state or responsible government official does not relieve responsibility. IV: superior orders do not relieve responsibility, provided a moral choice was in fact possible."
    source: Week 11 Lecture Slides, slide 12
  - type: cloze
    concept: nuremberg-principles
    text: "Principle IV: acting pursuant to an order of a government or superior does not relieve responsibility, {{c1::provided a moral choice was in fact possible}} to him."
    source: Week 11 Lecture Slides, slide 12
  - type: apply
    concept: nuremberg-principles
    scenario: A colonel, ordered by his general to shoot prisoners, says he was only obeying orders. He could have refused without serious risk.
    answer: Principle IV — superior orders do not relieve responsibility where a moral choice was in fact possible; he could have refused, so he remains responsible.
    source: Week 11 Lecture Slides, slide 12
  - type: basic
    concept: ad-hoc-tribunals-icty-and-ictr
    front: How were the ICTY and the ICTR established?
    back: By UN Security Council resolutions under Chapter VII — the ICTY by Resolution 827 (25 May 1993); the ICTR by a resolution of 8 November 1994 (the slide gives "Resolution 855" — verify), seated in Arusha (Resolution 977).
    source: Week 11 Lecture Slides, slide 17, 22
  - type: cloze
    concept: ad-hoc-tribunals-icty-and-ictr
    text: "Resolution 827: \"[A]ll States shall {{c1::cooperate fully}} with the International Tribunal and its organs\"."
    source: Week 11 Lecture Slides, slide 17
  - type: basic
    concept: ad-hoc-tribunals-icty-and-ictr
    front: ICTR Statute art 1 — where, who and when? And arts 2–4?
    back: "Serious violations of IHL in Rwanda, and by Rwandan citizens in neighbouring states, between 1 January and 31 December 1994. Arts 2–4: genocide; crimes against humanity; violations of Common Article 3 and Additional Protocol II."
    source: Week 11 Lecture Slides, slide 22
  - type: basic
    concept: ad-hoc-tribunals-icty-and-ictr
    front: Name two milestones each for the ICTY and the ICTR.
    back: "ICTY: Tadić Interlocutory Appeal Decision 1995 (legality of its creation); Milošević indicted 1999. ICTR: Kambanda pleaded guilty to genocide (May 1998); Akayesu convicted of genocide, sexual violence as the actus reus (September 1998)."
    source: Week 11 Lecture Slides, slide 19, 23
  - type: apply
    concept: ad-hoc-tribunals-icty-and-ictr
    scenario: A state far from the Balkans refuses an ICTY request for assistance, saying it never consented to the Tribunal.
    answer: "It must comply: Resolution 827, a Chapter VII decision, obliges all states to cooperate, and under art 25 UN Charter members carry out Security Council decisions."
    source: Week 11 Lecture Slides, slide 17, 51
  - type: basic
    concept: hybrid-tribunals-and-the-eccc
    front: How were the ECCC established?
    back: After Cambodia's request to the UN, through an international agreement in 2004 following lengthy negotiations; they sat within the Cambodian court structure with international assistance through UNAKRT.
    source: Week 11 Lecture Slides, slide 30
  - type: cloze
    concept: hybrid-tribunals-and-the-eccc
    text: "ECCC jurisdiction: crimes committed between {{c1::17 April 1975}} and {{c2::6 January 1979}}."
    source: Week 11 Lecture Slides, slide 30
  - type: basic
    concept: hybrid-tribunals-and-the-eccc
    front: What four crime categories were within the ECCC's jurisdiction?
    back: Genocide under the 1948 Genocide Convention; crimes against humanity as per the Rome Statute; grave breaches of the Geneva Conventions; crimes under Cambodian law.
    source: Week 11 Lecture Slides, slide 30
  - type: basic
    concept: hybrid-tribunals-and-the-eccc
    front: Name four distinctive features of the ECCC.
    back: Part of the Cambodian judiciary applying national and international law; two Co-Prosecutors (one national, one international); a majority of national judges; Co-Investigating Judges (civil law structure); civil parties could participate.
    source: Week 11 Lecture Slides, slide 31
  - type: cloze
    concept: icc-jurisdiction
    text: "Art 5 Rome Statute: {{c1::genocide}}, {{c2::crimes against humanity}}, {{c3::war crimes}} and {{c4::the crime of aggression}}."
    source: Week 11 Lecture Slides, slide 39
  - type: basic
    concept: icc-jurisdiction
    front: What are the three triggers in art 13?
    back: (a) Referral by a State Party (art 14); (b) referral by the Security Council acting under Chapter VII (e.g. Libya 2011); (c) the Prosecutor initiating an investigation proprio motu (art 15).
    source: Week 11 Lecture Slides, slide 42
  - type: basic
    concept: icc-jurisdiction
    front: When do the art 12(2) preconditions apply, and what are they?
    back: "Only for art 13(a) or (c) triggers: the territorial state (or state of registration of the vessel or aircraft) or the accused's nationality state must be a Party or have accepted jurisdiction under art 12(3)."
    source: Week 11 Lecture Slides, slide 45
  - type: cloze
    concept: icc-jurisdiction
    text: "Art 11(2): for a state that joins later, the Court has jurisdiction only over crimes after entry into force {{c1::for that State}}, unless it has made an {{c2::art 12(3)}} declaration."
    source: Week 11 Lecture Slides, slide 42
  - type: apply
    concept: icc-jurisdiction
    scenario: Strong, a national of State Party Sirax, commits piracy on a ship registered to Sirax.
    answer: "No ICC jurisdiction: piracy is not one of the four art 5 crimes, even though the flag and nationality links in art 12(2) are present."
    source: Week 11 Tutorial Tasks, question 4(a)
  - type: apply
    concept: icc-jurisdiction
    scenario: Valeron, a national of non-party Giskar, commits crimes against humanity in Giskar; the Security Council refers the situation under Chapter VII.
    answer: "Jurisdiction may be exercised: an art 13(b) referral; art 12(2) applies only to art 13(a) and (c); crimes against humanity are an art 5 crime; check art 11 timing."
    source: Week 11 Tutorial Tasks, question 4(b)
  - type: basic
    concept: icc-admissibility-and-complementarity
    front: What are the four grounds of inadmissibility in art 17?
    back: The case is being investigated or prosecuted by a state with jurisdiction (unless unwilling or unable genuinely); such a state decided not to prosecute (same exception); the person has already been tried (art 20(3)); insufficient gravity.
    source: Week 11 Lecture Slides, slide 48
  - type: basic
    concept: icc-admissibility-and-complementarity
    front: What are the three indicators of unwillingness?
    back: Proceedings or a decision for the purpose of shielding the person; unjustified delay inconsistent with an intent to bring the person to justice; proceedings not conducted independently or impartially, in a manner inconsistent with that intent.
    source: Week 11 Lecture Slides, slide 49
  - type: cloze
    concept: icc-admissibility-and-complementarity
    text: "Inability: due to a {{c1::total or substantial collapse or unavailability}} of its national judicial system, the state is unable to obtain the accused or the necessary evidence and testimony."
    source: Week 11 Lecture Slides, slide 49
  - type: apply
    concept: icc-admissibility-and-complementarity
    scenario: State Z's prosecution of a general has been adjourned for years without explanation, and he remains free.
    answer: Unwillingness — unjustified delay inconsistent with an intent to bring him to justice — so the case may be admissible despite the national proceedings.
    source: Week 11 Lecture Slides, slide 49
  - type: basic
    concept: icc-applicable-law-and-cooperation
    front: In what order does art 21 list the ICC's applicable law?
    back: "First: the Statute, Elements of Crimes and Rules of Procedure and Evidence. Second: applicable treaties and principles and rules of international law (incl. the law of armed conflict). Failing that: general principles derived from national laws. Previous decisions may be applied; all consistent with human rights."
    source: Week 11 Lecture Slides, slide 50
  - type: basic
    concept: icc-applicable-law-and-cooperation
    front: What do arts 86 and 88 of the Rome Statute require?
    back: "Art 86: States Parties shall cooperate fully with the Court in its investigation and prosecution of crimes. Art 88: they shall ensure procedures under national law for all forms of cooperation in Part 9."
    source: Week 11 Lecture Slides, slide 51
  - type: cloze
    concept: icc-applicable-law-and-cooperation
    text: A non-party that accepts jurisdiction by art 12(3) declaration "shall cooperate with the Court {{c1::without any delay or exception}} in accordance with Part 9".
    source: Week 11 Lecture Slides, slide 45
  - type: apply
    concept: icc-applicable-law-and-cooperation
    scenario: Giskar, a non-party UN member, is told by a Chapter VII Security Council decision to cooperate with the ICC after a referral.
    answer: "Giskar must cooperate: art 25 UN Charter binds members to carry out Security Council decisions; arts 86 and 88 do not bind it as a non-party."
    source: Week 11 Tutorial Tasks, question 3
  - type: basic
    concept: hybrid-tribunals-and-the-eccc
    front: Why were hybrid tribunals proposed, according to the slides?
    back: >-
      The ad hoc ICTY and ICTR were located far from the countries they served, and other tribunals were needed for
      serious crimes elsewhere; treaty-based hybrid courts with national and international elements were proposed as
      efficient, more locally based courts.
    source: Week 11 Lecture Slides, slide 25 (transcribed from the slide image)
  - type: cloze
    concept: hybrid-tribunals-and-the-eccc
    text: >-
      A tribunal's hybrid character can be discerned from {{c1::the way it was established}}, {{c2::its subject-matter
      jurisdiction}} and {{c3::its staff}}.
    source: Week 11 Lecture Slides, slide 25 (transcribed from the slide image)
  - type: basic
    concept: hybrid-tribunals-and-the-eccc
    front: "SCSL: who established it, when, and whom did it try?"
    back: >-
      The UN and the Government of Sierra Leone, jointly, in 2002; persons who bear the greatest responsibility for
      serious violations of IHL and Sierra Leonean law committed in Sierra Leone since 30 November 1996.
    source: Week 11 Lecture Slides, slide 27 (transcribed from the slide image)
  - type: basic
    concept: hybrid-tribunals-and-the-eccc
    front: How was the SCSL part national and part international?
    back: >-
      Not part of the Sierra Leonean legal system and not a UN body; included (but never used) some Sierra Leonean law;
      Sierra Leonean staff and a seat in Freetown; jurisdiction over international crimes; a majority of international
      judges.
    source: Week 11 Lecture Slides, slide 27 (transcribed from the slide image)
  - type: basic
    concept: hybrid-tribunals-and-the-eccc
    front: What were the SCSL's firsts, according to the slides?
    back: >-
      First international(ised) tribunal to try and convict for using child soldiers (AFRC), forced marriage as a crime
      against humanity (RUF) and attacks on UN peacekeepers (RUF); first modern ICT to indict, try and convict a sitting
      head of state (Taylor). Nine convicted, 15–52 years.
    source: Week 11 Lecture Slides, slide 28 (transcribed from the slide image)
  - type: basic
    concept: hybrid-tribunals-and-the-eccc
    front: "Special Tribunal for Lebanon: why, how and what law?"
    back: >-
      Requested by Lebanon in 2005 after the 14 February 2005 attack that killed PM Rafic Hariri and 22 others; Statute
      annexed to Security Council Resolution 1757, in force 10 June 2007; applies Lebanese Criminal Code provisions on
      terrorism, among other crimes; Lebanese and international judges and an international prosecutor.
    source: Week 11 Lecture Slides, slide 33 (transcribed from the slide image)
  - type: basic
    concept: icc-jurisdiction
    front: How was the ICC established?
    back: >-
      The need was recognised by the General Assembly when the Genocide Convention was adopted in 1948; the idea
      re-emerged after the Cold War; on 17 July 1998, in Rome, 160 states established the first treaty-based permanent
      international criminal court. 125 States Parties (on the slides).
    source: Week 11 Lecture Slides, slide 35 (transcribed from the slide image)
  - type: basic
    concept: icc-jurisdiction
    front: What order of questions does the slides' ICC flowchart use?
    back: >-
      Subject-matter jurisdiction (art 5) → temporal jurisdiction (art 11) → situation referred (art 13) → preconditions
      (art 12) → admissibility (art 17) → proceed to the ICC.
    source: Week 11 Lecture Slides, slide 38 (transcribed from the slide image)
  - type: cloze
    concept: icc-jurisdiction
    text: >-
      Art 6: genocide means listed acts committed with intent to destroy, in whole or in part, a {{c1::national, ethnical,
      racial or religious}} group, as such.
    source: Week 11 Lecture Slides, slide 40 (transcribed from the slide image)
  - type: basic
    concept: icc-jurisdiction
    front: What is the key element of the crime of aggression under art 8 bis(1)?
    back: >-
      Control: the planning, preparation, initiation or execution must be by a person in a position effectively to
      exercise control over or to direct the political or military action of a State, of an act of aggression that is a
      manifest violation of the UN Charter by its character, gravity and scale.
    source: Week 11 Lecture Slides, slide 41 (transcribed from the slide image)
  - type: basic
    concept: icc-jurisdiction
    front: What did Resolution 1970 (2011) do?
    back: >-
      Adopted 26 February 2011 as a Chapter VII referral: it referred the situation in Libya since 15 February 2011 to the
      ICC Prosecutor (para 4) and decided that the Libyan authorities shall cooperate fully (para 5).
    source: Week 11 Lecture Slides, slide 43 (transcribed from the slide image)
  - type: basic
    concept: icc-jurisdiction
    front: "Philippines: how did the proprio motu investigation unfold on the slides?"
    back: >-
      Prosecutor's request (24 May 2021) → Pre-Trial Chamber I authorisation (15 Sep 2021) → Philippines' deferral request
      (10 Nov 2021) → investigation resumed (Jan 2023) → warrant against Mr Duterte for crimes against humanity (Mar 2025)
      → arrested and surrendered (12 Mar 2025).
    source: Week 11 Lecture Slides, slide 44 (transcribed from the slide image)
  - type: basic
    concept: icc-jurisdiction
    front: What do the two Ukraine letters on the slides illustrate?
    back: >-
      9 April 2014: Ukraine accepts the Court's jurisdiction by an art 12(3) declaration (acts from 21 Nov 2013 to 22 Feb
      2014). 2 March 2022: a State Party referral under arts 13(a) and 14(1) by a group of States Parties, including
      Australia.
    source: Week 11 Lecture Slides, slide 46 (transcribed from the slide image)
  - type: basic
    concept: icc-jurisdiction
    front: On the slides' diagram, how do the preconditions and the three triggers fit together?
    back: >-
      Territoriality or nationality attaches to State Party referral and proprio motu, not Security Council referral. SP
      and SC referrals go straight to investigation; proprio motu needs authorisation by the Pre-Trial Chamber first.
    source: Week 11 Lecture Slides, slide 47 (transcribed from the slide image)
  - type: apply
    concept: icc-jurisdiction
    scenario: >-
      State Party Arden refers a situation in non-party Teros; the accused are all Teros nationals and every act occurred
      in Teros.
    answer: >-
      No jurisdiction on an art 13(a) referral unless Teros accepts it by an art 12(3) declaration (as Ukraine did in
      2014); otherwise a Security Council referral is needed.
    source: Week 11 Lecture Slides, slide 46 (transcribed from the slide image); slides 45, 47
  - type: basic
    concept: icc-admissibility-and-complementarity
    front: What must the Office of the Prosecutor determine at the preliminary examination stage?
    back: >-
      Whether there is sufficient evidence of crimes of sufficient gravity within the ICC's jurisdiction; whether there
      are genuine national proceedings; and whether an investigation would serve the interests of justice and victims.
    source: Week 11 Lecture Slides, slide 37 (transcribed from the slide image)
  - type: basic
    concept: what-is-international-criminal-law
    front: What are the six stages of an ICC case on the slides?
    back: >-
      Preliminary examinations → investigations (arrest warrant or summons) → pre-trial (initial appearance; confirmation
      of charges) → trial (three judges; beyond reasonable doubt; up to 30 years or life; reparations) → appeals
      (Prosecutor and Defence) → enforcement of sentence.
    source: Week 11 Lecture Slides, slide 37 (transcribed from the slide image)
  - type: cloze
    concept: icc-applicable-law-and-cooperation
    text: >-
      For arrests, the ICC relies on {{c1::countries}} to make arrests and transfer suspects; sentences are served in
      countries that have {{c2::agreed to enforce ICC sentences}}.
    source: Week 11 Lecture Slides, slide 37 (transcribed from the slide image)
audio:
  title: Week 11 recap — international criminal law
  minutes: 3
  script: |
    International criminal law is the branch of public international law about crimes for which individuals are
    personally, criminally liable. It has two limbs: substantive law, which governs the four core crimes and demands that
    states prosecute them, and procedural law, which runs the proceedings — trial, appeal, evidence, sentencing and
    victims' rights. It is new, still rudimentary because the elements and penalties are not always clear, and hybrid,
    drawing on humanitarian law, human rights law and national criminal law.

    It began after the Second World War. The London Agreement, with the IMT Charter annexed, created the Nuremberg
    tribunal, which tried crimes against peace, war crimes and crimes against humanity. In Tokyo, MacArthur's proclamation
    set up the IMTFE: twenty-eight defendants, fifty-five counts, seven death sentences. In 1946 the General Assembly
    affirmed the Nuremberg Principles in Resolution 95(I): any person who commits an international crime is responsible;
    internal law is no excuse; nor is being head of state or an official; nor are superior orders, if a moral choice was
    in fact possible.

    In the 1990s the Security Council created two ad hoc tribunals under Chapter VII. The ICTY came from Resolution 827 in
    1993, and all states had to cooperate, because members carry out Council decisions under article 25 of the Charter.
    The ICTR followed in November 1994, for Rwanda in 1994; Akayesu found that sexual violence can be the actus reus of
    genocide. Hybrid courts like the Extraordinary Chambers in Cambodia work differently: they came from an agreement with
    the state, sit in its courts, and mix national and international prosecutors and judges.

    The ICC is a treaty court under the Rome Statute. For a problem, walk four gates. Article 5: is it genocide, crimes
    against humanity, war crimes or aggression? Piracy is not. Article 11: was it committed after the Statute entered
    into force for that state, unless there is an article 12(3) declaration? Article 13: was it referred by a State Party
    or by the Security Council, or opened by the Prosecutor? And for a state referral or the Prosecutor's own
    investigation, article 12: is the territorial or flag state, or the accused's nationality state, a party or a
    declarant? Then admissibility under article 17: the Court is complementary, so a case genuinely handled by a state is
    inadmissible, unless that state is unwilling — shielding, delay, partiality — or unable because its system has
    collapsed. Finally, the Court applies its Statute first, then international law, then general principles, and it
    relies on states' cooperation under articles 86 and 88.
