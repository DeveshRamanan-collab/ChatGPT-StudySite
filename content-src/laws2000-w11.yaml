      - text: Its crimes, certain rules of procedure, and mechanisms for states to cooperate.
        correct: true
        why: >-
          Correct — the slide says the Rome Statute sets out the crimes within the Court's jurisdiction, certain rules of
          procedure, and the mechanisms for states to cooperate with the ICC.
      - text: The UN Charter's rules on the use of force, and the Council's voting rules.
        why: >-
          Tempting because art 8 bis refers to the Charter, but the Statute does not set out the Charter's rules; it sets
