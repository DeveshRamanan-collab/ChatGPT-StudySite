  - key: q301
    type: mcq
    concept: nuremberg-principles
    difficulty: 2
    set: pretest
    stem: A former head of state charged with crimes against humanity argues that, because he acted as head of state, he cannot be responsible under international law. Which Nuremberg Principle answers him?
    options:
      - text: Principle I — only private persons who commit crimes are responsible.
        why: Tempting because Principle I is the foundation, but it says "any person" who commits a crime under international law is responsible; it is Principle III that deals with heads of state.
      - text: Principle III — acting as head of state does not relieve him of responsibility.
        correct: true
        why: Correct — Principle III says acting as Head of State or responsible Government official does not relieve a person from responsibility under international law.
      - text: Principle IV — he acted for his government, so in truth no moral choice was possible to him.
        why: Tempting because Principle IV concerns orders from a government, but it addresses those acting under superior orders; his plea rests on his own office, which Principle III covers.
      - text: Principle II — internal law gives heads of state a complete defence.
        why: Tempting because heads of state often enjoy protection under internal law, but Principle II says the absence of a penalty in internal law does not relieve responsibility.
  - key: q302
    type: mcq
    concept: nuremberg-principles
    difficulty: 1
    stem: In which instrument did the UN General Assembly affirm the Nuremberg Principles?
    options:
      - text: Resolution 827 of 25 May 1993.
        why: Tempting because it is a UN resolution studied this week, but Resolution 827 is the Security Council resolution that established the ICTY.
      - text: Resolution 95(I) of 11 December 1946.
        correct: true
        why: Correct — the General Assembly affirmed the "Principles of International Law Recognized in the Charter of the Nürnberg Tribunal and in the Judgment of the Tribunal" in Resolution 95(I).
      - text: The London Agreement, with the IMT Charter annexed.
        why: Tempting because the principles come from the IMT Charter, but the London Agreement created the IMT; the General Assembly's affirmation came in Resolution 95(I).
      - text: Article 25 of the UN Charter.
        why: Tempting because art 25 appears this week, but it concerns members carrying out Security Council decisions, not the Nuremberg Principles.
  - key: q303
    type: mcq
    concept: nuremberg-principles
    difficulty: 1
    stem: What does Nuremberg Principle I state?
    options:
      - text: Only persons who hold official positions can commit crimes under international law.
        why: Tempting because the IMT tried leaders, but Principle I speaks of "any person" — official status is neither required nor a shield (Principle III).
      - text: Any person who commits a crime under international law is responsible and liable to punishment.
        correct: true
        why: "Correct — Principle I: \"Any person who commits an act which constitutes a crime under international law is responsible therefor and liable to punishment.\""
      - text: Crimes under international law are punishable only where the national law of the place also punishes them.
        why: The reverse of Principle II — the absence of a penalty in internal law does not relieve the person from responsibility under international law.
  - key: q304
    type: mcq
    concept: nuremberg-principles
    difficulty: 2
    stem: A soldier argues that his conduct was not an offence under his country's law. Which principle answers that argument?
    options:
      - text: "Principle II: no penalty in internal law does not relieve the person of responsibility."
        correct: true
        why: Correct — Principle II says that internal law not imposing a penalty for an international crime does not relieve the person who committed the act from responsibility under international law.
      - text: "Principle III: he acted on behalf of the state, so the state alone is responsible for the conduct."
        why: Tempting because the soldier served the state, but Principle III says acting as head of state or official does not relieve responsibility; it shifts nothing to the state.
      - text: "Principle IV: superior orders are always a complete defence for soldiers serving in the field."
        why: Tempting because soldiers obey orders, but Principle IV says superior orders do not relieve responsibility where a moral choice was in fact possible; and his argument concerns internal law.
  - key: q305
    type: mcq
    concept: nuremberg-principles
    difficulty: 2
    stem: Under Principle IV, when does acting under superior orders fail to relieve a person from responsibility?
    options:
      - text: Only where the order came from a head of state.
        why: Tempting because heads of state appear in Principle III, but Principle IV applies to orders "of his Government or of a superior", whoever gave them.
      - text: Where a moral choice was in fact possible to him.
        correct: true
        why: Correct — Principle IV says acting under orders does not relieve responsibility "provided a moral choice was in fact possible to him".
      - text: Only where internal law also prohibited the conduct.
        why: Tempting because domestic illegality seems relevant, but Principle II makes internal law irrelevant to responsibility; Principle IV turns on whether a moral choice was possible.
      - text: Never — orders from a superior always excuse.
        why: Tempting as a rule of military discipline, but Principle IV says orders do not relieve responsibility where a moral choice was in fact possible.
  - key: q306
    type: mcq
    concept: nuremberg-principles
    difficulty: 3
    variant-of: q305
    stem: A conscript was ordered at gunpoint, with no realistic alternative, to take part in a killing. Applying Principle IV as worded on the slides, what is the key question?
    options:
      - text: Whether his commanding officer has already been convicted.
        why: Tempting because superior and subordinate are linked, but Principle IV asks about the subordinate's own situation — whether a moral choice was in fact possible to him.
      - text: Whether his state's internal law permitted the killing.
        why: Tempting, but Principle II makes the content of internal law irrelevant to responsibility under international law; the Principle IV question is about moral choice.
      - text: Whether a moral choice was in fact possible to him.
        correct: true
        why: Correct — under Principle IV superior orders do not relieve responsibility "provided a moral choice was in fact possible"; facts like a gun to the head go to exactly that question.
      - text: Whether he held the rank of a responsible government official.
        why: Tempting because rank matters under Principle III, but that principle removes a shield for officials; it does not decide whether a conscript under orders had a moral choice.
  - key: q307
    type: mcq
    concept: nuremberg-principles
    difficulty: 2
    stem: Which statement best captures what the Nuremberg Principles do?
    options:
      - text: They define genocide for the first time and list all the acts punishable under the Genocide Convention.
        why: Tempting because genocide is a core crime, but its definition and punishable acts are in the Genocide Convention (arts I–III); the Nuremberg Principles concern responsibility.
      - text: "They close escape routes from individual responsibility: internal law, official position and orders."
        correct: true
        why: Correct — Principle I affirms individual responsibility, and Principles II–IV deny that internal law, official position or superior orders (where a moral choice existed) relieve it.
      - text: They create a permanent international criminal court with jurisdiction over four crimes.
        why: Tempting because the ICC has four crimes (art 5), but the Court was created by the Rome Statute; Resolution 95(I) affirmed principles and created no court.
  - key: q308
