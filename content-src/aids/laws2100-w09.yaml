aids:
  - concept: laws2100-w09-will-and-interest-theories
    plain: A human right is first a right. On the will theory you have a right when you control what others must do; on the interest theory, when it protects an important interest of yours.
    concrete: 'Sign a contract with someone, the lecture says, and you both gain rights and obligations that exist only because you created them. You can insist that the other side perform, or let them off: that fits the will theory. Now take an infant. She cannot exercise choice the way an adult can. Does she have no rights? The interest theory says she does: her rights protect important interests in her well-being.'
    formal: 'Slide 5: will theory: a person has a right if they have control or choice over whether others must or must not act in certain ways; rights are tools for exercising free will (autonomy). Interest theory: a person has a right if it serves to protect an important interest; rights promote or safeguard well-being (welfare). Human rights: plural, universal, high-priority; UDHR art 2: ''Everyone is entitled…without distinction of any kind''.'
    analogy:
      text: 'A will-theory right is like holding the remote: you decide whether the channel changes. An interest-theory right is like a seatbelt: it protects the passenger, even a baby who chooses nothing.'
      maps:
        - from: holding the remote
          to: control or choice over whether others must or must not act
        - from: deciding whether the channel changes
          to: insisting on performance of a contract, or releasing the other party
        - from: the seatbelt protecting the passenger
          to: a right protecting an important interest in the holder's well-being
        - from: the baby who chooses nothing
          to: the lecture's infant, who cannot exercise choice yet has rights
      limits:
        - 'Neither image says where a right''s authority comes from: whether it is a moral right, a legal right or both is the separate authority issue.'
    terms:
      - term: Will theory
        gloss: A person has a right if they have control or choice over whether others must or must not act in certain ways; its value is autonomy (slide 5).
        example: A party to a contract who may insist on performance or release the other side.
      - term: Interest theory
        gloss: A person has a right if it serves to protect an important interest; rights are justified by promoting or safeguarding well-being (welfare).
        example: An infant's rights, which protect her well-being though she cannot choose.
      - term: Universality
        gloss: Human rights claim to apply to each and every human being; a contract binds only its parties.
      - term: High priority
        gloss: Human rights have priority over the 'general interest' (slide 5). Constitutional rights also have priority, but a right can be constitutional without being a human right.
    misconceptions:
      - claim: The lecture's infant example is aimed at the interest theory.
        tempting: Others must judge an infant's interests for her, so that theory sounds strained.
        correction: 'It targets the will theory, which ties rights to control or choice: an infant cannot exercise choice as adults can. The interest theory handles infants through welfare.'
      - claim: Every constitutional right is a human right, since both have high priority.
        tempting: Both outrank ordinary legal requirements.
        correction: 'The lecture: a right can be constitutional without being a human right, and a human right need not be constitutional. Priority alone does not make a right human.'
      - claim: A lease or contract right is not really a right, because it is not universal.
        tempting: Universality is listed as a feature of rights on slide 5.
        correction: Universality separates human rights from other rights; it does not stop contractual rights being rights. Many legal rights exist simply because we create them, eg by signing a contract (lecture).
    socratic:
      - ask: Before asking what a human right is, what must we ask first?
        hint: Human rights are ___.
        answer: What a right is. Human rights are rights, and many legal rights, such as contractual ones, exist not because they are human rights but because we create them.
      - ask: Under a contract you can insist that the other side perform, or release them. What does that suggest a right is?
        hint: Control.
        answer: 'The will theory: a person has a right if they have control or choice over whether others must act; rights are tools for exercising free will (autonomy).'
      - ask: Does a six-month-old infant have rights on that view?
        hint: Can she choose?
        answer: 'The will theory struggles: she cannot exercise choice as adults can. That is the lecture''s objection: the theory may focus too much on control.'
      - ask: What would let us say the infant has rights?
        hint: Move the focus from autonomy to…
        answer: 'The interest theory: a person has a right if it serves to protect an important interest of theirs. The focus is welfare, not autonomy.'
      - ask: What then makes some rights human rights?
        hint: Three features on slide 5, and slide 7.
        answer: They are plural (which set?), universal (every human being, not just the parties to a contract) and high-priority over the 'general interest'. They protect our fundamental interests as human beings.
    what-if:
      - change: The right-holder is an adult party to a contract, not an infant.
        effect: 'Both theories now fit: she controls the other party''s duty (will theory) and the right protects her interest (interest theory). It binds only the parties, so it is not a human right.'
      - change: A right is entrenched in a constitution but is not claimed for every human being.
        effect: 'As a constitutional right it has priority over other legal requirements, but universality is missing, so it is not a human right. The lecture: a right can be constitutional without being human.'
    boundary:
      - text: Robots or human artefacts with an intelligence comparable to ours.
        why: Human rights rest on an idea of humanity, but the lecture notes that biology alone leaves the line between us, other species and intelligent artefacts unclear.
      - text: The right to self-determination.
        why: A human right held by a group, not an individual (slide 7). The idea of human rights first focused on individual rights, yet groups claim collective rights too.
    transfer:
      - scenario: A care-home resident with advanced dementia can no longer make choices about her daily life. Her family asks whether she still holds any rights against the home.
        answer: 'On the will theory, rights depend on control or choice, so her rights are hard to explain: the lecture''s infant problem. On the interest theory she holds rights because they protect important interests in her well-being. Any human rights she holds do not depend on capacity: they are universal, applying to every human being.'
    objections:
      - position: 'Rights are tools for exercising free will: a person has a right if they have control or choice over others'' duties (will theory).'
        evidence: 'Contractual rights: a party can insist on performance or release the other side (slide 5; lecture).'
        objection: It focuses too much on control. An infant cannot exercise choice as adults can; does that mean she has no rights? (lecture)
      - position: 'Human rights are universal (UDHR art 2: ''Everyone is entitled…without distinction of any kind'').'
        evidence: Unlike contractual rights, which bind only the parties, they capture the fundamental interests we share as human beings (slide 7).
        objection: 'What makes us human is hard to define: biology alone leaves the line between us, other species and intelligent artefacts unclear (lecture).'
    sources:
      - Week 09 - Lecture Slides (slides 5, 7)
      - Week 09 - Lecture Transcript (first half)
  - concept: laws2100-w09-hohfeldian-incidents
    plain: 'Hohfeld splits ''right'' into four positions: claim (someone owes me a duty), privilege (I have no duty not to act), power (I can change your position), immunity (you cannot change mine).'
    concrete: 'Take the lecture''s example of rights we create: you and I sign a contract. You are under a duty to me to deliver the goods, so I hold a claim-right against you. Nothing obliges me not to inspect them on arrival: a privilege. If I can release you from your duty, I hold a power over your position. If you cannot alter my entitlement on your own, I hold an immunity against you.'
    formal: 'Hohfeld (1879–1918), slide 6: X has a claim-right against Y with respect to φ iff Y is under a duty to X to φ; a privilege to φ iff X has no duty not to φ; a (normative) power over Y iff X can alter, through volitional action, Y''s normative position; an immunity against Y iff Y lacks the ability to alter X''s Hohfeldian incidents.'
    terms:
      - term: Claim-right
        gloss: X has a claim-right against Y with respect to φ if and only if Y is under a duty to X to φ.
        example: 'Under a lease, the landlord must repair the roof: the tenant holds a claim-right.'
      - term: Privilege
        gloss: X has a privilege to φ if and only if X has no duty not to φ. The definition is silent on whether others must let X φ.
        example: No law forbids walking on a public beach.
      - term: Power
        gloss: X has a (normative) power over Y if and only if X can alter, through volitional action, Y's normative position.
        example: Making a will changes what the executor will be required to do.
      - term: Immunity
        gloss: X holds an immunity against Y (in respect of X's normative position) if and only if Y lacks the ability to alter X's Hohfeldian incidents.
        example: A constitution bars Parliament from removing freedom of religion.
    misconceptions:
      - claim: A privilege means others are under a duty not to interfere with what I do.
        tempting: We usually think of freedoms as protected.
        correction: That would be a claim-right against others. On slide 6, X has a privilege to φ iff X has no duty not to φ; the definition says nothing about anyone else's duty.
      - claim: An immunity is X's ability to alter Y's normative position.
        tempting: Power and immunity both concern altering positions.
        correction: 'That is a power. X holds an immunity against Y when Y lacks the ability to alter X''s Hohfeldian incidents: the mirror case.'
      - claim: 'Hohfeld''s analysis is just the will theory: having a right means controlling others.'
        tempting: Control sounds like a power.
        correction: The will theory says what makes something a right (control or choice). Hohfeld shows that 'right' names four distinct positions, of which a power is only one.
    socratic:
      - ask: Someone says 'I have a right'. Why is that not yet a precise claim?
        hint: 'Slide 6: how many positions?'
        answer: 'Hohfeld identifies four different legal positions within the concept of a ''right'': claim, privilege, power and immunity. We must ask which one is meant, and against whom.'
      - ask: Which two positions are defined by duties with respect to φ?
        hint: Whose duty, in each?
        answer: Claim and privilege. A claim is another's duty owed to me (Y's duty to X to φ); a privilege is the absence of my own duty not to φ.
      - ask: Which two are defined by the ability to alter normative positions?
        hint: Changing positions.
        answer: Power and immunity. A power is my ability to alter your normative position by a volitional act; an immunity is your inability to alter mine.
      - ask: A constitution says Parliament cannot pass a law removing freedom of religion. What do citizens hold against Parliament?
        hint: Who cannot change whose position?
        answer: 'An immunity: Parliament lacks the ability to alter the citizens'' normative position.'
      - ask: What further distinction does slide 6 set beside the four positions?
        hint: '''Freedom from'' and ''freedom to''.'
        answer: 'Negative and positive rights: consider the difference between ''freedom from'' (eg freedom from torture) and ''freedom to''.'
    elements:
      - name: Claim-right
        test: Is Y under a duty owed to X to φ? Then X holds a claim-right against Y.
        authorities:
          - hohfeld-four-incidents
      - name: Privilege
        test: Does X have no duty not to φ? Then X has a privilege to φ, whatever others may do.
        authorities:
          - hohfeld-four-incidents
      - name: Power
        test: Can X, by a volitional act, alter Y's normative position? Then X holds a power over Y.
        authorities:
          - hohfeld-four-incidents
      - name: Immunity
        test: Does Y lack the ability to alter X's Hohfeldian incidents? Then X holds an immunity against Y.
        authorities:
          - hohfeld-four-incidents
    what-if:
      - change: A statute that let only a minister revoke a licence is amended so local councils may revoke it too.
        effect: 'The licence-holder loses her immunity against councils: they now have the ability to alter her position, so they hold a power over her. Power and immunity are the mirror pair.'
      - change: A new law forbids walking on the public beach where Chloe used to walk.
        effect: 'Chloe now has a duty not to walk there, so her privilege is gone. She never held a claim-right to walk there: nobody owed her a duty.'
    boundary:
      - text: Freedom from torture.
        why: A 'freedom from' (negative right). Slide 6 asks us to contrast it with 'freedom to'; to analyse it, ask which of the four positions it names, and against whom.
      - text: Human rights as moral rights.
        why: Hohfeld calls the four 'legal positions'. Whether human rights are moral rights, legal rights or both is the separate authority issue, which his definitions do not settle.
    transfer:
      - scenario: University rules say a student may appeal a grade; once an appeal is lodged the registrar must hold a hearing; and the faculty cannot change the grade while the appeal is pending.
        answer: 'Translate each piece. Lodging an appeal alters the registrar''s position by a volitional act, creating a duty to hold a hearing: a power. Once lodged, the registrar owes the student a hearing: a claim-right. The faculty lacks the ability to alter the student''s grade meanwhile: an immunity against the faculty.'
    sources:
      - Week 09 - Lecture Slides (slide 6)
  - concept: laws2100-w09-rights-and-utilitarian-reasoning
    plain: 'Human rights take priority over the general interest. So someone truly committed to them cannot reason only by adding up consequences: some acts stay off-limits even when they would maximise happiness.'
    concrete: 'Police hold a suspect who planted a bomb in a crowded stadium. Torturing him might reveal where it is and save hundreds of lives. An act-utilitarian may justify the torture: in aggregate, happiness rises. Someone truly committed to human rights says it is not acceptable. A harder variant has the suspect talk only if his innocent child is tortured; the point is not the answer but testing our moral intuitions.'
    formal: 'Slide 5: human rights have priority over the ''general interest''; do they work as ''trumps'' or ''shields''? A true commitment to human rights is incompatible with a certain type of utilitarian reasoning: act-utilitarianism and the principle of utility (the greatest happiness for the greatest number). Waldron (The Law: Theory and Practice in British Politics, 1990) distinguishes act, rule and indirect utilitarianism, finding compatibility in the last.'
    analogy:
      text: In a card game a trump beats any card of an ordinary suit, however high. A right treated as a trump beats appeals to the general interest, however large the gain.
      maps:
        - from: the trump card
          to: the right
        - from: a high card of an ordinary suit
          to: a large gain in general welfare or happiness
        - from: playing the trump takes the trick
          to: the right cuts off the utilitarian calculation
      limits:
        - 'Only a few cards are trumps: if every claim were a right, the category would lose its point (the rhetoric critique).'
        - Limitation clauses and proportionality let many rights be weighed and partly limited; not every right plays like a trump.
    terms:
      - term: Act-utilitarianism
        gloss: 'Judging each action by its consequences under the principle of utility: the greatest happiness for the greatest number. Utilitarianism is a form of consequentialism.'
        example: 'Is lying wrong? A consequentialist needs more information: what will this lie bring about?'
      - term: Deontological reasoning
        gloss: 'Crudely, the opposite of consequentialism: it judges an action by the principles that lie behind it, not by its consequences (lecture).'
      - term: Rule utilitarianism
        gloss: Judging the rules that govern actions, not single acts, by whether they increase the general happiness or welfare (lecture).
      - term: Indirect utilitarianism
        gloss: For utilitarian reasons, we create structures in which officials are asked to refrain from utilitarian reasoning and to respect rights (Waldron, as the lecture presents him).
    misconceptions:
      - claim: Trumps are Schauer's image of rights and shields are Dworkin's.
        tempting: The two images are easy to swap.
        correction: 'The lecture attributes trumps to Dworkin and shields to Schauer. Either way, rights disrupt a certain kind of reasoning: they take priority over the general interest.'
      - claim: Waldron holds that rights and utilitarian reasoning can never be combined.
        tempting: The lecture stresses the clash between them.
        correction: 'He finds compatibility in indirect utilitarianism: for utilitarian reasons, officials are asked to refrain from utilitarian reasoning and to respect rights.'
      - claim: Utilitarian reasoning has no proper place in law or public policy.
        tempting: Rights are set against it on slide 5.
        correction: 'The lecture accepts that balancing interests often makes sense in public policy. The danger is pure majoritarianism: a majority could justify banning a minority''s religion.'
    socratic:
      - ask: How does an act-utilitarian decide whether an action is right?
        hint: Consequences, measured by what?
        answer: 'By its consequences under the principle of utility: does it promote the greatest happiness for the greatest number? Utilitarianism is a form of consequentialism.'
      - ask: Apply that to the ticking bomb. What follows?
        hint: One suspect against hundreds of lives.
        answer: 'Torturing the suspect may be justified: saving hundreds of lives increases aggregate happiness more than sparing one person does.'
      - ask: What does someone truly committed to human rights say, and why?
        hint: 'Slide 5: priority over the general interest.'
        answer: Torture is not acceptable, even to save lives. Rights have priority over the general interest; as trumps or shields, they disrupt utilitarian reasoning.
      - ask: A majority is disturbed by a minority's religion. Why can pure utility not defend the minority?
        hint: Count the preferences.
        answer: 'In purely utilitarian terms, the majority''s preferences could justify a ban. Resisting it needs other reasons: reasons that value the minority''s rights.'
      - ask: Can rights and utility ever work together?
        hint: Waldron's third kind of utilitarianism.
        answer: 'Indirect utilitarianism: for utilitarian reasons, we build structures in which officials do not reason as utilitarians but respect rights.'
    what-if:
      - change: A government rules that interrogators may never torture, because such a rule gives the best results overall.
        effect: 'This is indirect utilitarianism, not a trump: officials are told not to calculate, but the reason given is utilitarian. The outcome matches the rights view; the justification differs.'
      - change: The suspect will talk only if his innocent child is tortured.
        effect: A thorough consequentialist may still call it justifiable, given the lives saved. The variant sharpens the dilemma to test our intuitions; the rights answer does not depend on guilt.
    boundary:
      - text: The interrogation 'five techniques' used by the British army during the Troubles in Northern Ireland (Waldron's chapter).
        why: 'Whether they amounted to torture drew different legal answers, but either way rights were violated: the lecture uses the case to show the tension between rights and utility.'
      - text: A limitation clause that lets courts weigh a right against a public purpose.
        why: Proportionality weighs the right; a trump simply prevails. Limitation clauses show that not every right is treated as beyond balancing (slides 18–21).
    transfer:
      - scenario: A town council could raise residents' overall happiness by banning a small group's weekly religious procession, which most residents dislike.
        answer: An act-utilitarian counts preferences, so the ban may be justified. On the rights view, freedom of religion has priority over the general interest; defending the group needs reasons that value its rights, as in the lecture's minority example. An indirect utilitarian might add that, for utilitarian reasons, officials should respect such rights rather than calculate case by case.
    objections:
      - position: A true commitment to human rights is incompatible with a certain type of utilitarian reasoning (slide 5).
        evidence: 'Ticking bomb: an act-utilitarian may justify torture to save many lives; the rights view refuses. Minority religion: utility alone could justify a ban.'
        objection: 'Balancing interests often makes sense: in many issues of public policy we rightly weigh the welfare of the majority (lecture).'
        reply: The point is not to banish utility but to resist pure majoritarianism where it creates situations we think unjust (lecture).
      - position: Rights and utilitarianism can be combined (Waldron).
        evidence: 'Indirect utilitarianism: for utilitarian reasons, structures ask officials to refrain from utilitarian reasoning and respect rights.'
        objection: 'The justification is still overall results, so rights here are not trumps: the reasoning stays utilitarian, even where the outcome matches the rights view.'
    storyboard:
      - caption: A bomb in a stadium
        detail: A suspect knows where it is; hundreds or thousands of lives are at stake.
      - caption: The act-utilitarian sums
        detail: 'Harm to one person against lives saved: in aggregate, torture may increase happiness.'
      - caption: The rights answer
        detail: Someone truly committed to human rights says torture is not acceptable, whatever the numbers.
      - caption: The innocent child variant
        detail: The dilemma is sharpened to test our moral intuitions, not to find the solution.
      - caption: Waldron's indirect route
        detail: For utilitarian reasons, officials are asked not to reason as utilitarians, and to respect rights.
    sources:
      - Week 09 - Lecture Slides (slide 5)
      - Week 09 - Lecture Transcript (first half)
      - Week 09 - Lecture Transcript (second half)
