  - concept: laws2100-w09-moral-and-legal-rights
    plain: A right can be moral, legal or both. Law may fail to recognise a moral right, and a right written into law may never be put into practice.
    concrete: Where slavery was legal and regulated, enslaved people had no legal right not to be enslaved. Did they still have a moral right? The lecture says that positive law's failure to recognise a moral requirement does not mean the requirement does not exist, but the moral claim then needs its own justification. Later, some people changed their moral views, and the legal system followed.
    formal: 'Slide 8: are human rights moral rights, legal rights, or both? For legal rights, authoritative sources help: a constitutional Bill of Rights, eg South Africa s 39(1) (courts must promote the values of an open and democratic society based on human dignity, equality and freedom; must consider international law; may consider foreign law). Slide 17: ''positivisation'' from moral to legal rights; no bill of rights in Australia''s Federal Constitution.'
    analogy:
      text: 'A right recognised but never implemented is like a timetable for a railway that was never built: printed, official, and no help to anyone waiting on the platform.'
      maps:
        - from: the printed timetable
          to: a right recognised in a constitution or treaty
        - from: the railway never built
          to: the missing implementation
        - from: people waiting on the platform
          to: right-holders who gain nothing in practice
      limits:
        - A timetable for no train is simply false; a paper right is still law in books, and an unincorporated treaty may still be persuasive or aid interpretation (lecture).
    terms:
      - term: Positivisation
        gloss: 'Transforming moral rights into legal rights, in domestic and international law: from natural law to positive law (slide 17).'
      - term: Paper rights
        gloss: 'Rights recognised in a constitution or treaty but never implemented: law in books, not law in action (lecture, recalling legal realism).'
      - term: Bill of Rights
        gloss: Rights recognised in a constitution, high in the hierarchy of legal sources, so protected against ordinary legislation. The Australian Federal Constitution has none.
        example: Articles 1–19 of the Basic Law for the Federal Republic of Germany.
    misconceptions:
      - claim: If positive law does not recognise a moral requirement, the requirement does not exist.
        tempting: 'Bentham''s view: the only real rights are legal rights.'
        correction: 'The lecture: non-recognition in positive law does not mean the moral requirement does not exist. But the moral claim then needs its own moral justification.'
      - claim: Australia's Constitution protects rights through a bill of rights, like Germany's Basic Law.
        tempting: Articles 1–19 sit on the same slide.
        correction: 'Slide 17: no bill of rights in the Federal Constitution. The lecture: courts, Parliament and the common law protect basic rights; the Vic and Qld acts mimic the UK Human Rights Act.'
      - claim: Once Australia signs a human rights treaty, the treaty is part of domestic law.
        tempting: Signing looks like legal adoption.
        correction: 'The lecture: in a dual system like Australia''s, international recognition does not automatically become domestic law, though it may be persuasive or aid interpretation.'
    socratic:
      - ask: Are human rights moral rights, legal rights, or both?
        hint: 'Slide 8: the authority issue.'
        answer: The question is open. Rights language expresses moral claims and legal entitlements alike; human rights may be legal rights that track moral ones.
      - ask: Why is the authority question easier for legal rights?
        hint: Where does a lawyer look?
        answer: 'Authoritative legal sources exist: many constitutions (not Australia''s) include a Bill of Rights, high in the hierarchy of sources. South Africa''s s 39(1) even directs how to read it.'
      - ask: When slavery was legal, did enslaved people have a right not to be enslaved?
        hint: Legal or moral?
        answer: No legal right; arguably a moral right. Positive law's silence does not show the moral requirement is absent, but the moral claim needs justification.
      - ask: How does a moral right become a legal one?
        hint: Slide 17.
        answer: 'Positivisation: from natural law to positive law, from moral to legal rights, in domestic and international law. Constitutional protection then shields rights from ordinary legislation.'
      - ask: A right sits in a constitution but is never enforced. What is it?
        hint: Law in books.
        answer: 'A paper right: recognised but not implemented. Recognition sits between two problems: implementation in practice, and the foundations that explain why we recognise the right.'
    what-if:
      - change: South Africa's s 39(1) said courts 'may' consider international law, rather than 'must'.
        effect: International law would become optional, like foreign law under s 39(1)(c). As written, the provision makes international law mandatory, tying interpretation of the Bill of Rights more closely to it.
      - change: A right in a treaty Australia has signed is enacted in a federal statute.
        effect: 'The right is positivised in domestic law: a legal right from an authoritative source. With no federal bill of rights, it still lacks constitutional protection against later ordinary legislation.'
    boundary:
      - text: Freedom from slavery, which many now see as an absolute right.
        why: Legal systems once accepted and regulated slavery, so the claim that it is absolute flies in the face of our history, and raises the foundational question of moral rights (lecture).
      - text: Finnis, Natural Law and Natural Rights (1980), on positive law.
        why: 'Even natural lawyers see the gap: human authorities must translate general principles of morality and justice into workable rules (the lecture''s reading of Finnis).'
    transfer:
      - scenario: A country's constitution guarantees a right to adequate housing, but no law, agency or budget gives it effect, and courts decline to hear claims under it.
        answer: 'A paper right: recognised in the highest legal source but not implemented, law in books rather than law in action. Its authority as a legal right is clear; the gap is implementation. Whether people had a moral right to housing before it was written down is a separate question, needing a moral justification.'
    objections:
      - position: Only legal rights exist; natural rights are 'nonsense upon stilts' (Bentham).
        evidence: Legal rights are enforceable in court; for Bentham positive law is real and natural law wishful thinking (the lecture's reading).
        objection: 'Where slavery was legal, enslaved people arguably still had a moral right not to be enslaved: non-recognition in law does not show non-existence (lecture).'
      - position: Constitutional protection is the strongest form of legal recognition of rights.
        evidence: The constitution is the highest legal source, so its rights resist ordinary legislation (eg Germany's Basic Law, Articles 1–19).
        objection: 'Recognition is not enough: unimplemented constitutional rights are paper rights, law in books rather than law in action (lecture).'
    storyboard:
      - caption: Slavery legal and regulated
        detail: 'The legal system accepts slavery and regulates it: no legal right not to be enslaved.'
      - caption: A moral right without legal form
        detail: Arguably a moral right remained; the claim needs its own moral justification.
      - caption: Moral views change
        detail: At some point some people changed their moral views about slavery.
      - caption: The law follows
        detail: 'The legal system changed how it regulated and sanctioned slavery: from moral right toward legal right.'
      - caption: Recognition, then implementation
        detail: A right written into law must still be implemented, or it stays a paper right.
    sources:
      - Week 09 - Lecture Slides (slides 8, 12, 17)
      - Week 09 - Lecture Transcript (first half)
      - Week 09 - Lecture Transcript (second half)
  - concept: laws2100-w09-generations-and-history-of-human-rights
    plain: 'Human rights came in three generations: civil and political; social, economic and cultural; then group or ''solidarity'' rights. Their legal history runs from national documents to the universal UDHR (1948).'
    concrete: 'Compare two rights. Equality before the law is a first-generation right: a legal system can build institutions, rules and principles to protect it. The right to a healthy environment is third generation, a group or solidarity right. The lecture calls such rights more problematic in authority, justification and implementation: it is much harder to move from recognising them to implementing them.'
    formal: 'Slide 9: first generation, civil and political (life, equality before the law, speech, religion, property, fair trial, voting); second, social, economic and cultural (employment under just conditions, food, housing, health care); third, group and collective ''solidarity'' rights (self-determination, development, healthy environment, natural resources, intergenerational equity). Slide 11: Magna Carta (1215) to the UK Human Rights Act 1998; UDHR 1948; ICCPR and ICESCR 1966.'
    terms:
      - term: First-generation rights
        gloss: Civil and political rights, eg life, equality before the law, freedom of speech and religion, property, a fair trial, voting (slide 9).
      - term: Second-generation rights
        gloss: Social, economic and cultural rights, eg to be employed (under just conditions), to food, to housing and to health care.
      - term: Solidarity rights
        gloss: Some commentators' name for third-generation group and collective rights, eg self-determination, a healthy environment, intergenerational equity and sustainability.
      - term: UDHR (1948)
        gloss: A declaration without real binding force, proclaimed as a 'common standard of achievement'; unlike earlier national documents, it puts universality at its centre.
    misconceptions:
      - claim: Each generation replaced the one before, so first-generation rights are now obsolete.
        tempting: '''Generation'' suggests succession.'
        correction: The generations build upon each other (slide 9). First-generation rights remain so basic that, the lecture says, we probably do not feel we have to question them.
      - claim: The slide's history list proves no human rights existed before Magna Carta (1215).
        tempting: The list starts in 1215.
        correction: 'The list dates legal recognition. Whether rights existed earlier as moral rights is the open question on slide 4: ''Have human rights always existed?'''
      - claim: The UDHR was a binding treaty from the start.
        tempting: It is the most cited human rights instrument.
        correction: 'The lecture: mainly a political document without real binding force, a ''common standard of achievement'' pursued by teaching, education and progressive measures. Binding covenants and treaties followed (1966 onward).'
    socratic:
      - ask: Which rights feel so basic we barely question them?
        hint: The first generation.
        answer: 'Civil and political rights: life, equality before the law, freedom of speech and religion, property, a fair trial, voting. Many are recognised in our legal system, even if not constitutionally.'
      - ask: What did the second generation add?
        hint: Slide 9.
        answer: 'Social, economic and cultural rights: to be employed under just conditions, to food, to housing, to health care.'
      - ask: Why is the third generation 'more problematic'?
        hint: Authority, justification, implementation.
        answer: Group and solidarity rights, such as to a healthy environment or natural resources, are harder to ground and much harder to move from recognition to implementation.
      - ask: What changed with the UDHR in 1948?
        hint: National against universal.
        answer: Earlier documents (the US Constitution, the French Declaration) were national; the UDHR puts universality at its centre. International recognition followed through covenants and treaties.
      - ask: Why does the history matter for a jurisprudence student?
        hint: It raises a question.
        answer: 'It shows how our understanding of rights developed, and raises the foundational question: have human rights always existed, perhaps as moral rights before law recognised them?'
    what-if:
      - change: A community claims a right to its natural resources, rather than an individual claiming a fair trial.
        effect: 'The claim moves from the first generation to the third: a group or solidarity right. Its authority, justification and implementation are more problematic, and recognition is harder to turn into practice.'
      - change: The UDHR had been a national bill of rights, like the US Bill of Rights.
        effect: 'It would lose what the lecture puts at its centre: universality. National documents focus on a particular political community; recognition at the international level grew from the UDHR.'
    boundary:
      - text: The UK Human Rights Act 1998.
        why: The UK has no codified constitution, so no bill of rights in the US or Canadian sense; it passed the 1998 Act instead, which the Vic and Qld acts try to replicate (lecture).
      - text: The right to self-determination.
        why: 'Listed in the third generation and as slide 7''s example of a group right: it sits at the edge between individual human rights and collective ones.'
    transfer:
      - scenario: A youth climate group claims a right that governments preserve forests for people not yet born.
        answer: 'A third-generation solidarity right: intergenerational equity and sustainability, with a healthy environment and natural resources. The lecture flags these as more problematic in authority, justification and implementation; recognising the claim is far easier than implementing it. Then ask whether it is a moral right, a legal right, or both.'
    objections:
      - position: Third-generation group rights are human rights (slide 9).
        evidence: The slide lists self-determination, economic and social development, a healthy environment, natural resources, intergenerational equity and sustainability.
        objection: They are more problematic in authority, justification and implementation; moving from recognition to implementation is much harder than for equality before the law (lecture).
      - position: The history of human rights shows they were created at particular times and places.
        evidence: The documents run from Magna Carta (1215) through the American and French revolutions to the post-war UDHR (1948) and covenants (lecture).
        objection: 'History dates legal recognition, not existence: enslaved people arguably had a moral right before law recognised it, and history may capture something deeper than its formulations (lecture).'
    storyboard:
      - caption: Magna Carta and English Bill
        detail: 'Magna Carta (1215) and the English Bill of Rights (1689): the earliest documents on the list.'
      - caption: Revolutionary declarations
        detail: 'US Constitution (1789), US Bill of Rights (1791), French Declaration of the Rights of Man and of the Citizen (1789): national documents.'
      - caption: The Universal Declaration
        detail: 'UDHR (1948), after the Second World War: universality at the centre; a common standard of achievement.'
      - caption: The two Covenants
        detail: 'ICCPR and ICESCR (1966): recognition at the international level through covenants and treaties.'
      - caption: Women and children
        detail: CEDAW (1979) and the Convention on the Rights of the Child (1989).
      - caption: UK Human Rights Act
        detail: 'HRA 1998: rights recognised without a codified constitution; a model for the Vic and Qld acts.'
    sources:
      - Week 09 - Lecture Slides (slides 3, 4, 9, 11, 12)
      - Week 09 - Lecture Transcript (first half)
  - concept: laws2100-w09-critiques-of-human-rights
    plain: 'Some deny that human rights can be justified: Bentham called natural rights ''nonsense upon stilts''. Others call rights rhetoric, selfish, oppressive, anti-community or Western. Behind these lies a question about morality itself.'
    concrete: The 'rhetoric' worry. Over recent decades rights language has expanded until almost every entitlement is cast as a right, even a human right. If rights are trumps, only a few cards can be trumps; if every claim is a right, what is the point of the category? The lecture reads this mainly as a call for better definition and more discipline in rights language, not for abandoning rights.
    formal: 'Slide 15: Bentham, Anarchical Fallacies (1843): ''Natural rights is simple nonsense: natural and imprescriptible rights, rhetorical nonsense – nonsense upon stilts.'' Sceptical questions: is human nature a myth? Are rights selfish, an instrument of oppression, a threat to community, ethnocentric? Slide 16: moral relativism (are moral disagreements rationally resolvable? metaethical v normative) against objectivism/realism (are moral statements apt for truth and falsity?).'
    terms:
      - term: Nonsense upon stilts
        gloss: Bentham's attack on natural rights. On the lecture's reading, for Bentham the only rights that exist are legal rights; natural rights are wishful thinking.
      - term: Moral relativism
        gloss: Moral values and claims are relative to a culture or society. Slide 16 asks whether moral disagreements are rationally resolvable, and separates metaethical from normative relativism.
      - term: Moral objectivism (realism)
        gloss: There are moral facts, so moral statements are apt for truth and falsity (slide 16).
      - term: Ethnocentrism critique
        gloss: Human rights as we know them may be a Western creation, articulated in concepts that do not translate into other languages, cultures or worldviews.
    misconceptions:
      - claim: Bentham's 'nonsense upon stilts' attacks weighing a suspect's rights against lives saved.
        tempting: Bentham was a utilitarian.
        correction: It targets the existence of natural rights outside positive law. On the lecture's reading, his positivist outlook means the only real rights are legal rights enforceable in court.
      - claim: '''Are moral disagreements rationally resolvable?'' is the question for moral objectivism.'
        tempting: Both questions sit on slide 16.
        correction: It sits under moral relativism. The objectivism/realism question is whether moral statements are apt for truth and falsity.
      - claim: The ethnocentrism critique shows human rights should be confined to Western legal systems.
        tempting: The lecture takes the challenge seriously.
        correction: 'Its reply: meaningful comparison across legal systems suggests common ground. That rights are expressed differently need not mean nothing common lies behind them.'
    socratic:
      - ask: Why would a utilitarian with a positivist outlook call natural rights nonsense?
        hint: What is real, for a positivist?
        answer: For Bentham, positive law is real and natural law wishful thinking. The only rights people really have are legal rights, enforceable in court.
      - ask: If every entitlement is called a human right, what goes wrong?
        hint: Trumps.
        answer: 'The category loses its point: only a few cards can be trumps. The lecture reads this critique mainly as a call for better definition and discipline in rights language.'
      - ask: Which critiques set the individual against something larger?
        hint: Three of the slide's questions.
        answer: Rights are selfish (individual against the general interest; what about duties?); rights threaten community (the communitarian challenge to liberal autonomy); rights are an instrument of oppression, tied to a power structure.
      - ask: How might a defender answer the charge that rights are a Western creation?
        hint: Comparative law.
        answer: If comparing legal systems is meaningful, there is common ground. That rights are expressed differently in different languages and cultures need not mean nothing lies behind them.
      - ask: Why does the justification issue end with relativism and objectivism?
        hint: What do the debates boil down to?
        answer: 'Debates about rights boil down to the nature of morality: whether moral disagreements are rationally resolvable, and whether moral statements can be true or false.'
    what-if:
      - change: Bentham is shown a statute protecting freedom from slavery.
        effect: 'That right he accepts: it is a legal right, enforceable in court. His target is rights claimed from nature without positive law.'
      - change: A critic shows that two cultures' languages express rights differently.
        effect: 'That alone does not establish ethnocentrism: the lecture asks whether something common lies behind different formulations, as meaningful comparison of legal systems suggests.'
    boundary:
      - text: 'Waldron, Nonsense Upon Stilts: Bentham, Burke and Marx on the Rights of Man (1988).'
        why: Waldron wrote that book, but the phrase is Bentham's, from Anarchical Fallacies (slides 14–15). Tie each line to its author.
      - text: Social morality set against a deeper, critical morality.
        why: The lecture separates a particular community's morals, here and now, from possible universal principles of morality and justice; whether the second exists is the relativism question.
    transfer:
      - scenario: At an international meeting, a delegate argues that a proposed treaty right to free expression is a Western idea foreign to her country's traditions.
        answer: 'This is the ethnocentrism critique: human rights as we know them may be a Western creation, in concepts that do not translate. The lecture''s reply: meaningful comparison across legal systems suggests common ground behind different expressions. Underneath lies the relativism question: are moral disagreements rationally resolvable, and are moral statements apt for truth and falsity?'
    objections:
      - position: 'Human rights can be justified: natural law, deontological principles and human dignity supply strong moral arguments (lecture).'
        evidence: Natural law posits universal principles of morality and justice; dignity rose to prominence in modern foundations of rights, as in Waldron's work.
        objection: 'Bentham: natural rights are ''nonsense upon stilts''; the only rights that exist are legal rights (slide 15).'
      - position: 'Rights are ethnocentric: a Western creation (slide 15).'
        evidence: Their history runs through Western documents tied to the American and French revolutions and European modernity (lecture).
        objection: Meaningful comparison across legal systems suggests common ground behind different formulations (lecture).
      - position: 'Rights talk is mostly rhetoric: every entitlement is now cast as a right (slide 15: is human nature just a myth?).'
        evidence: Rights language has expanded over recent decades; if every claim is a right, the category loses its point.
        objection: This is mainly a call for better definition and more discipline in rights language, not a reason to abandon rights (lecture).
    sources:
      - Week 09 - Lecture Slides (slides 14–16)
      - Week 09 - Lecture Transcript (first half)
      - Week 09 - Lecture Transcript (second half)
  - concept: laws2100-w09-limitation-clauses-and-proportionality
    plain: 'Limitation clauses let some constitutional rights be partly limited. Alexy''s test asks: can the limit achieve its aim? Is there a milder means? Do its benefits outweigh the harm to the right?'
    concrete: 'Suppose a nation faces a public emergency threatening its life. Under ECHR art 15 it may take measures derogating from its Convention obligations, but only to the extent strictly required, and it must keep the Council of Europe''s Secretary General fully informed. Some rights stay out of reach: no derogation from the prohibition of torture, slavery or servitude, no punishment without law, or the right to life, save deaths from lawful acts of war.'
    formal: 'Limitation clauses permit the partial limitation of some constitutional rights: Canadian Charter s 1 (''reasonable limits prescribed by law as can be demonstrably justified in a free and democratic society''); Vic Charter s 7(2). Alexy: rights are principles, optimisation requirements, so proportionality is necessarily connected to adjudicating them: suitability, necessity, proportionality in the narrow sense (balancing), formalised by a weight formula.'
    analogy:
      text: 'A rule works like a light switch: on or off. Alexy''s principles work like a dimmer: each is turned as high as circumstances allow, and when two compete, a court sets the level for each.'
      maps:
        - from: the light switch
          to: 'a rule: a definitive command'
        - from: the dimmer
          to: 'a principle: an optimisation requirement, realised to the greatest extent possible'
        - from: setting the level when two compete
          to: proportionality in the narrow sense (balancing)
      limits:
        - A dimmer has no fixed stages; Alexy's test runs suitability and necessity before any balancing.
    terms:
      - term: Limitation clause
        gloss: A constitutional provision permitting the partial limitation of some constitutional rights, eg Canadian Charter s 1, Victorian Charter s 7(2) (slide 18).
      - term: Derogation
        gloss: Under ECHR art 15, measures departing from Convention obligations in war or public emergency, as strictly required; none from arts 2 (save lawful acts of war), 3, 4(1) or 7.
      - term: Optimisation requirement
        gloss: 'Alexy''s account of a principle: realised to the greatest extent possible, given legal and factual constraints; a rule, by contrast, is a definitive command.'
      - term: Weight formula
        gloss: 'Alexy''s formalisation of balancing: the intensity of interference, the importance of the competing principle, and the degree of certainty about these factors.'
    misconceptions:
      - claim: Alexy's test runs necessity first, then suitability, then balancing.
        tempting: All three parts are right.
        correction: 'Order matters: suitability (can it achieve the legitimate aim?), then necessity (no less restrictive means?), then proportionality in the narrow sense (do benefits outweigh the detriment?) (slide 21).'
      - claim: Under ECHR art 15, a state may derogate from any right in a grave enough emergency.
        tempting: Art 15(1) allows derogation in war or public emergency.
        correction: 'Art 15(2): no derogation from art 2 (save deaths from lawful acts of war), art 3 (torture), art 4(1) (slavery or servitude) or art 7 (no punishment without law).'
      - claim: For Alexy, proportionality is needed because rights are rules applied all-or-nothing.
        tempting: Rights are often stated like rules.
        correction: 'The reverse: rights are principles, optimisation requirements, which conflict and must be balanced. So proportionality is necessarily connected to adjudicating constitutional rights.'
    socratic:
      - ask: Are there any absolute human rights?
        hint: Slide 8; then ECHR art 15(2).
        answer: Contested. Limitation clauses permit partial limits on some rights; art 15(2) puts a few beyond derogation, and there is a debate whether these are a kind of absolute right.
      - ask: What does the Canadian Charter's s 1 require of any limit?
        hint: Three qualifiers.
        answer: Reasonable limits, prescribed by law, that can be demonstrably justified in a free and democratic society.
      - ask: Why, for Alexy, must constitutional rights be balanced at all?
        hint: Rules against principles.
        answer: 'Rights are principles: optimisation requirements, realised as far as legal and factual constraints allow. Principles conflict, so proportionality is necessarily connected to adjudicating them.'
      - ask: A protest restriction cannot in fact reduce the harm it targets. Where does it fail?
        hint: The first stage.
        answer: 'Suitability: the measure must be capable of achieving the legitimate aim. It never reaches necessity or balancing.'
      - ask: Pile enough limits onto a right. What happens, and what does that recall?
        hint: Week 7.
        answer: Like exceptions piling up on a defeasible rule, the limits may chip the right away until we ask what having it still means (lecture).
    elements:
      - name: A permitted limit
        test: 'Does a limitation clause allow it: a reasonable limit, prescribed by law, demonstrably justified in a free and democratic society (Vic s 7(2) adds: based on human dignity, equality and freedom)?'
        authorities:
          - canadian-charter-of-rights-and-freedoms-s1
          - charter-of-human-rights-and-responsibilities-act-2006-vic-s7
      - name: Suitability
        test: Is the measure capable of achieving the legitimate aim?
        authorities:
          - alexy-proportionality
      - name: Necessity
        test: 'Is there no less restrictive means to achieve the same goal? (cf Vic s 7(2)(e): any less restrictive means reasonably available)'
        authorities:
          - alexy-proportionality
          - charter-of-human-rights-and-responsibilities-act-2006-vic-s7
      - name: Proportionality in the narrow sense (balancing)
        test: 'Do the benefits of the measure outweigh the detriment to the right infringed? The weight formula: intensity of interference, importance of the competing principle, certainty about both.'
        authorities:
          - alexy-proportionality
    what-if:
      - change: The measure works, but an equally effective and less restrictive option exists.
        effect: It fails necessity (cf Vic s 7(2)(e), any less restrictive means reasonably available). Balancing is never reached.
      - change: The right affected is the prohibition of torture, during a public emergency under the ECHR.
        effect: 'Art 15(2) bars any derogation from art 3, even in war or public emergency: the derogation route is closed, whatever the exigencies.'
      - change: A measure is suitable and necessary, but its detriment to the right outweighs its benefits.
        effect: It fails proportionality in the narrow sense, the final stage. The weight formula looks to the intensity of interference, the importance of the competing principle, and certainty about both.
    boundary:
      - text: The right to life under ECHR art 15(2).
        why: 'Non-derogable, save for deaths resulting from lawful acts of war: an express exception, so even this right is not beyond every limit.'
      - text: Victorian Charter s 7(3).
        why: 'Nothing in the Charter gives anyone a right to limit human rights beyond what it provides, or to destroy them: limits are partial, never destruction (slide 20).'
    transfer:
      - scenario: During a disease outbreak, a state bans all public gatherings of more than two people for six months to slow infection.
        answer: 'Run Alexy''s test in order. Suitability: can the ban achieve the legitimate aim of slowing infection? Necessity: is there a less restrictive means, such as a smaller cap or a shorter period (cf Vic s 7(2)(e))? Balancing: do the benefits outweigh the detriment to the rights infringed, weighing intensity of interference, importance of the competing principle, and certainty about both?'
    objections:
      - position: Proportionality is necessarily connected to adjudicating constitutional rights, because rights are principles (Alexy).
        evidence: Principles are optimisation requirements; when they conflict, suitability, necessity and balancing structure the conflict (slide 21).
        objection: 'Many disagree at this point: the claim depends on seeing constitutional rights as principles, which must itself be justified; the weight formula has attracted criticism (lecture).'
      - position: Some human rights are absolute.
        evidence: 'ECHR art 15(2): no derogation from art 3 even in war or public emergency; some scholars argue the prohibition of torture can never be limited (lecture).'
        objection: 'Many see freedom from slavery as absolute, yet legal systems once accepted and regulated slavery: the claim flies in the face of our history (lecture).'
    sources:
      - Week 09 - Lecture Slides (slides 8, 18–21)
      - Week 09 - Lecture Transcript (second half)
flows:
  - slug: limit-on-a-protected-right
    title: Can this limit on a protected right be justified?
    summary: 'Walks a measure that restricts a constitutional or Convention right through the week''s two routes: emergency derogation under ECHR art 15, or a limitation clause tested by Alexy''s three stages.'
    start: n1
    concepts:
      - laws2100-w09-limitation-clauses-and-proportionality
    sources:
      - Week 09 - Lecture Slides (slides 18–21)
    nodes:
      - id: n1
        kind: ask
        text: 'Does the state rely on an emergency derogation: war or other public emergency threatening the life of the nation (ECHR art 15(1))?'
        authorities:
          - echr-art-15
        branches:
          - label: 'Yes: emergency derogation'
            to: n2
          - label: 'No: an ordinary limit'
            to: n5
      - id: n2
        kind: ask
        text: Is the right one that art 15(2) puts beyond derogation?
        note: Art 2 (right to life, save deaths resulting from lawful acts of war), art 3 (prohibition of torture), art 4(1) (no one held in slavery or servitude), art 7 (no punishment without law).
        authorities:
          - echr-art-15
        branches:
          - label: 'Yes'
            to: n3
          - label: 'No'
            to: n4
      - id: n3
        kind: end
        tone: not-met
        exception: true
        text: No derogation may be made, even in war or public emergency. There is a debate whether these non-derogable rights are a kind of absolute right.
      - id: n4
        kind: end
        tone: qualified
        text: Derogation is possible, but only to the extent strictly required by the exigencies of the situation, consistently with other obligations under international law; the Secretary General must be kept fully informed (art 15(1), (3)).
      - id: n5
        kind: step
        text: 'Find the limitation clause: a constitutional provision permitting the partial limitation of some constitutional rights.'
        note: 'Canadian Charter s 1: ''such reasonable limits prescribed by law as can be demonstrably justified in a free and democratic society''. Vic Charter s 7(2) adds ''based on human dignity, equality and freedom'' and lists factors (a)–(e).'
        authorities:
          - canadian-charter-of-rights-and-freedoms-s1
          - charter-of-human-rights-and-responsibilities-act-2006-vic-s7
        next: n6
      - id: n6
        kind: ask
        text: Is the limit prescribed by law?
        branches:
          - label: 'Yes'
            to: n8
          - label: 'No'
            to: n7
      - id: n7
        kind: end
        tone: not-met
        text: 'Not justified: s 1 allows only limits ''prescribed by law'', and s 7(2) only limits ''under law''.'
      - id: n8
        kind: ask
        text: 'Suitability: is the measure capable of achieving the legitimate aim?'
        concept: laws2100-w09-limitation-clauses-and-proportionality
        authorities:
          - alexy-proportionality
        branches:
          - label: 'Yes'
            to: n10
          - label: 'No'
            to: n9
      - id: n9
        kind: end
        tone: not-met
        text: Fails suitability. A measure that cannot achieve its aim never reaches necessity or balancing.
      - id: n10
        kind: ask
        text: 'Necessity: is there a less restrictive means to achieve the same goal?'
        note: 'Victorian Charter s 7(2)(e): ''any less restrictive means reasonably available to achieve the purpose that the limitation seeks to achieve''.'
        authorities:
          - alexy-proportionality
          - charter-of-human-rights-and-responsibilities-act-2006-vic-s7
        branches:
          - label: Yes, a milder means exists
            to: n11
          - label: 'No'
            to: n12
      - id: n11
        kind: end
        tone: not-met
        text: 'Fails necessity: the same goal can be reached with less restriction of the right.'
      - id: n12
        kind: ask
        text: 'Balancing (proportionality in the narrow sense): do the benefits of the measure outweigh the detriment to the right infringed?'
        note: 'Alexy''s weight formula formalises this step: the intensity of interference, the importance of the competing principle, and the degree of certainty about these factors.'
        authorities:
          - alexy-proportionality
        branches:
          - label: 'Yes'
            to: n13
          - label: 'No'
            to: n14
      - id: n13
        kind: end
        tone: met
        text: 'The limit is proportionate and can be justified. Remember Vic s 7(3): limits are partial; nothing permits destroying the right.'
      - id: n14
        kind: end
        tone: not-met
        text: 'Fails proportionality in the narrow sense: the detriment to the right outweighs the benefits.'
