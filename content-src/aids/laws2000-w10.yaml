  - concept: laws2000-w10-decisions-and-recommendations
    plain: Only the parts of a Security Council resolution that decide something bind states; parts that merely recommend do not. A binding decision also overrides a conflicting treaty obligation.
    concrete: 'The lecturer warned against treating a resolution as binding as a whole. One resolution can contain paragraphs that are only recommendations and paragraphs that are decisions — often both — and only the decisions bind. Which is which usually turns on the words the Council uses, chiefly its verbs, and some wording is debated. Art 39 draws the same line: the Council "shall make recommendations, or decide".'
    formal: 'Art 25: members "agree to accept and carry out the decisions of the Security Council in accordance with the present Charter". Recommendations — e.g. "appropriate procedures or methods of adjustment" (art 36(1)), or recommendations under art 39 — do not bind. Under art 103 Charter obligations prevail over obligations under "any other international agreement". The General Assembly only recommends (arts 11(2), 14).'
    terms:
      - term: decision
        gloss: A Council act members have agreed to accept and carry out (art 25); binding on all members.
      - term: recommendation
        gloss: Advice from the Council (or the Assembly) that does not bind, e.g. procedures recommended under art 36(1).
    misconceptions:
      - claim: Every paragraph of a Security Council resolution binds member states.
        tempting: A resolution is adopted as a single instrument.
        correction: The lecture stressed only decisions bind under art 25; recommendations in the same resolution do not. The wording, usually the verbs, shows which is which.
      - claim: A state is bound only if it voted for the resolution.
        tempting: Consent usually governs international obligations.
        correction: By art 25 members have agreed in advance to carry out Council decisions; a decision binds every member, however it voted and whether or not it sits on the Council.
      - claim: A Chapter VI recommendation binds the parties like a Chapter VII decision.
        tempting: Both come from the Council, whose decisions bind.
        correction: Under Chapter VI the Council recommends (art 36(1)); recommendations do not bind. Binding force attaches to decisions.
    socratic:
      - ask: A client asks whether a Council resolution obliges its state to act. Where do you start?
        hint: Not the whole resolution.
        answer: With the operative paragraph that matters, asking whether it is a decision or only a recommendation.
      - ask: How do you tell them apart?
        hint: Grammar.
        answer: Usually by the words the Council uses — chiefly the verbs; borderline wording is debated.
      - ask: If it is a decision, whom does it bind?
        hint: Art 25.
        answer: All UN members, who agreed to accept and carry out the Council's decisions.
      - ask: The state has a treaty requiring the opposite. Which prevails?
        hint: Art 103.
        answer: The Charter obligation to carry out the decision prevails over the obligation under the other agreement.
    elements:
      - name: Find the operative paragraph
        test: Identify the paragraph that imposes the requirement; resolutions often mix recommendations and decisions.
      - name: Decision or recommendation?
        test: 'Read the wording, usually the verbs: "decide" binds, "recommend" does not (compare art 39''s "make recommendations, or decide").'
        authorities:
          - un-charter-art-39
      - name: A decision binds all members
        test: Members agree to accept and carry out the Council's decisions.
        authorities:
          - un-charter-art-25
      - name: Priority over other treaties
        test: Charter obligations prevail over conflicting obligations under any other international agreement.
        authorities:
          - un-charter-art-103
    what-if:
      - change: The paragraph says the Council "recommends" that members cut trade with the target.
        effect: 'A recommendation: it does not bind under art 25, so a member keeping up trade breaks no Charter obligation, and art 103 does not override its trade treaty.'
      - change: The same paragraph instead says the Council "decides" that members cut trade.
        effect: 'A decision: binding on all members under art 25, and prevailing over any conflicting trade treaty under art 103.'
    boundary:
      - text: A paragraph whose verb sits between recommending and deciding.
        why: 'The lecturer said there are debates: wording usually decides, and borderline language is contested.'
      - text: A General Assembly resolution, however firmly worded.
        why: 'Outside art 25: the Assembly recommends (arts 11(2), 14); only Security Council decisions bind.'
    transfer:
      - scenario: State A has a bilateral air-services treaty with State B. A Council resolution "decides" that all members shall deny landing rights to B's airline and "recommends" that they also reduce diplomatic staff.
        answer: 'A must deny landing rights: that paragraph is a decision binding under art 25, and art 103 makes it prevail over the air-services treaty. The staff paragraph is a recommendation: A may follow it but is not bound to.'
    sources:
      - Week 10 - Lecture Slides - Collective Security and International Organisations (slides 10, 15–16, 39)
      - Week 10 - Lecture Transcript (Live) - Collective Security (Part A.1) (decisions v recommendations within one resolution; the verbs; art 39 "recommend or decide"; art 103 overriding treaty obligations)
    verify: false
flows:
  - slug: what-can-the-security-council-do
    title: What can the Security Council do about this situation?
    summary: Walks a peace-and-security problem from Chapter VI peaceful settlement through the art 39 determination, art 40 provisional measures and art 41 measures to an art 42 authorisation, with Uniting for Peace if the Council is deadlocked.
    start: c1
    concepts:
      - laws2000-w10-peaceful-settlement-under-chapter-vi
      - laws2000-w10-article-39-determination-and-provisional-measures
      - laws2000-w10-article-39-findings-in-practice
      - laws2000-w10-non-forcible-measures-under-article-41
      - laws2000-w10-authorisation-of-force-under-article-42
      - laws2000-w10-un-peacekeeping-operations
      - laws2000-w10-general-assembly-and-secretary-general
    sources:
      - Week 10 - Lecture Slides - Collective Security and International Organisations (slides 11–28, 33–34, 41)
      - Week 10 - Lecture Transcript (Live) - Collective Security (Part A.1) (Chapter VI to art 41)
      - Week 10 - Tutorial Tasks - Collective Security (Q2)
    nodes:
      - id: c1
        kind: step
        text: 'Start with Chapter VI: the parties must first seek a peaceful solution, and the Council may call upon them, investigate and recommend.'
        note: 'Art 33(1) means: negotiation, enquiry, mediation, conciliation, arbitration, judicial settlement, regional agencies. Council: arts 33(2), 34, 36(1); legal disputes generally to the ICJ (art 36(3)). No art 39 finding is needed.'
        concept: laws2000-w10-peaceful-settlement-under-chapter-vi
        authorities:
          - un-charter-art-33-1
        next: c2
      - id: c2
        kind: ask
        text: Has the Council determined a threat to the peace, breach of the peace or act of aggression (art 39)?
        note: Argue a threat to the peace — the finding the Council actually uses. Practice covers proliferation, terrorism, internal armed conflict, serious human rights or IHL violations, even Ebola (2014).
        concept: laws2000-w10-article-39-findings-in-practice
        authorities:
          - un-charter-art-39
        branches:
          - label: 'Yes'
            to: c4
          - label: 'No'
            to: c3
      - id: c3
        kind: ask
        text: Is the Council blocked because the permanent members cannot agree?
        note: Each permanent member holds a veto (art 27(3)).
        branches:
          - label: Yes — a veto blocks it
            to: e-ufp
          - label: 'No'
            to: e-ch6
      - id: c4
        kind: step
        text: 'Consider provisional measures to stop the situation worsening (art 40): a ceasefire, cessation of hostilities, humanitarian access.'
        note: Without prejudice to the parties' rights, claims or position; the Council takes account of non-compliance. In practice often demanded alongside sanctions or force.
        concept: laws2000-w10-article-39-determination-and-provisional-measures
        authorities:
          - un-charter-art-40
        next: c5
      - id: c5
        kind: ask
        text: Does the Council consider that measures not involving force would be adequate?
        note: Art 42 opens only if art 41 measures "would be inadequate or have proved to be inadequate" — they need not have been tried first.
        branches:
          - label: 'Yes'
            to: c6
          - label: No — they would be or have proved inadequate
            to: c7
      - id: c6
        kind: step
        text: 'Decide art 41 measures: comprehensive or targeted sanctions, cutting communications or diplomatic relations, an ad hoc tribunal, or an ICC referral.'
        note: 'Targeted measures (commodities, asset freezes, travel bans) answer criticism of comprehensive sanctions'' impact on populations. ICC referral: Rome Statute art 13(b), e.g. Darfur 2005.'
        concept: laws2000-w10-non-forcible-measures-under-article-41
        authorities:
          - un-charter-art-41
          - rome-statute-art-13-b
        next: e-41
      - id: c7
        kind: ask
        text: Who will carry out the military action?
        note: 'There is no standing UN army: art 43 was never implemented.'
        concept: laws2000-w10-authorisation-of-force-under-article-42
        authorities:
          - un-charter-art-42
        branches:
          - label: A coalition of member states
            to: e-coalition
          - label: A regional organisation
            to: e-regional
          - label: A UN-run peace operation
            to: e-pko
      - id: e-ufp
        kind: end
        tone: qualified
        exception: true
        text: 'Uniting for Peace: the General Assembly may consider the matter at once and recommend collective measures — recommendations only, not binding decisions.'
        authorities:
          - unga-resolution-377-v
      - id: e-ch6
        kind: end
        tone: not-met
        text: 'Chapter VII is closed: the Council can only call upon, investigate and recommend under Chapter VI.'
      - id: e-41
        kind: end
        tone: met
        text: 'Art 41 measures decided: binding on all members (art 25). If they prove inadequate, the Council may move to art 42.'
        authorities:
          - un-charter-art-25
      - id: e-coalition
        kind: end
        tone: met
        text: Authorise member states, expressly, to use "all necessary means" for a stated purpose (e.g. Res 678, Kuwait 1990).
        authorities:
          - unsc-resolution-678
      - id: e-regional
        kind: end
        tone: met
        text: Authorise a regional organisation to enforce the Council's decisions (art 53, Chapter VIII), e.g. NATO in Libya, ECOWAS in Liberia.
      - id: e-pko
        kind: end
        tone: qualified
        text: 'A UN peace operation: traditionally consent, impartiality and force only in self-defence; some mandates authorise force to carry them out (DRC, Mali).'
        concept: laws2000-w10-un-peacekeeping-operations
  - slug: does-the-resolution-bind-or-authorise
    title: Does this Security Council resolution bind the state — or authorise its use of force?
    summary: 'Reads a resolution paragraph by paragraph: decision or recommendation, art 25 and art 103, then whether any use of force rests on an express Chapter VII authorisation rather than a revived or implied one.'
    start: r1
    concepts:
      - laws2000-w10-decisions-and-recommendations
      - laws2000-w10-security-council-composition-and-powers
      - laws2000-w10-authorisation-of-force-under-article-42
    sources:
      - Week 10 - Lecture Slides - Collective Security and International Organisations (slides 10, 15–16, 25–31)
      - Week 10 - Lecture Transcript (Live) - Collective Security (Part A.1) (decisions and recommendations; art 103)
    nodes:
      - id: r1
        kind: ask
        text: Is the paragraph relied on a decision, or only a recommendation?
        note: Read the wording, usually the verbs. One resolution often mixes both; art 39 itself says the Council "shall make recommendations, or decide". Borderline wording is debated.
        concept: laws2000-w10-decisions-and-recommendations
        branches:
          - label: A decision
            to: r2
          - label: Only a recommendation
            to: e-rec
      - id: r2
        kind: step
        text: It binds every UN member, however it voted and whether or not it sits on the Council (art 25).
        authorities:
          - un-charter-art-25
        next: r3
      - id: r3
        kind: ask
        text: Does carrying it out conflict with the state's obligations under another treaty?
        branches:
          - label: 'Yes'
            to: r4
          - label: 'No'
            to: r5
      - id: r4
        kind: step
        text: The Charter obligation prevails over the conflicting treaty obligation (art 103), whatever the treaty's date.
        authorities:
          - un-charter-art-103
        next: r5
      - id: r5
        kind: ask
        text: Is the state relying on the resolution to use force?
        branches:
          - label: 'Yes'
            to: r6
          - label: 'No'
            to: e-bound
      - id: r6
        kind: ask
        text: Does the resolution, acting under Chapter VII, expressly authorise force — e.g. "all necessary means" — for this purpose?
        note: 'Art 42 is an exception to art 2(4) and a last resort. Authorisations name a purpose: restoring Kuwait''s sovereignty (Res 678), humanitarian relief (Res 794), protecting civilians (Res 1973).'
        authorities:
          - un-charter-art-42
          - unsc-resolution-678
          - unsc-resolution-794
        branches:
          - label: 'Yes'
            to: e-auth
          - label: No — only vaguer words, or an older resolution
            to: e-noauth
      - id: e-rec
        kind: end
        tone: not-met
        text: 'Not binding: a recommendation is advice. The state breaks no Charter obligation by not following it, and art 103 does not apply.'
      - id: e-bound
        kind: end
        tone: met
        text: The state must carry out the decision.
      - id: e-auth
        kind: end
        tone: met
        text: Force is authorised under art 42, within the stated purpose; outside it, art 2(4) applies.
      - id: e-noauth
        kind: end
        tone: not-met
        exception: true
        text: 'No authorisation. Do not imply one from words like "serious consequences": the 2003 claim that Res 687 and 1441 revived Res 678 was rejected by most states and scholars.'
        authorities:
          - un-charter-art-2-4
