  - concept: laws2000-w10-non-forcible-measures-under-article-41
    plain: 'Once it has found a threat, the Council can order coercion short of force: trade and financial sanctions, cutting communications or diplomatic ties, creating criminal tribunals, or referring a situation to the ICC.'
    concrete: North Korea has faced Council sanctions for years because of nuclear proliferation. S/RES/2397 (2017) cut the caps on refined petroleum products supplied to the DPRK, banned its exports of food, agricultural products, machinery and electrical equipment, banned supplying it with industrial machinery, vehicles and metals (except spare parts for civilian passenger aircraft), and required members to de-register vessels involved in illicit activities.
    formal: 'Art 41: the Council "may decide what measures not involving the use of armed force are to be employed", which "may include complete or partial interruption of economic relations and of rail, sea, air, postal, telegraphic, radio, and other means of communication, and the severance of diplomatic relations". The list is non-exhaustive. Under Chapter VII the Council may also refer a situation to the ICC Prosecutor (Rome Statute art 13(b)).'
    analogy:
      text: Comprehensive sanctions are like cutting a whole apartment block's power to pressure one tenant; targeted sanctions cut only that tenant's line.
      maps:
        - from: the apartment block
          to: the target state and its population
        - from: cutting the block's power
          to: comprehensive financial and trade sanctions (e.g. Iraq, 1990s)
        - from: cutting one tenant's line
          to: 'targeted measures: asset freezes, travel bans, commodity bans'
      limits:
        - Even targeted measures are decided only after an art 39 determination, and they work only as well as states implement them.
    terms:
      - term: comprehensive sanctions
        gloss: Financial, trade and other economic measures against a whole state — e.g. Iraq in the 1990s, North Korea today; controversial for their impact on populations.
      - term: targeted ("smart") sanctions
        gloss: Measures aimed at specific commodities (e.g. conflict diamonds) or at particular groups, corporations or individuals (travel bans, asset freezes).
      - term: sanctions committee
        gloss: A Council body that often determines the details of a specific sanctions regime.
      - term: Chapter VII referral
        gloss: The Council, acting under Chapter VII, referring a situation to the ICC Prosecutor (Rome Statute art 13(b)), e.g. Darfur 2005.
    misconceptions:
      - claim: A naval blockade is an art 41 measure because it interrupts sea communications.
        tempting: Art 41 lists interrupting "sea" communications.
        correction: Art 42 names "blockade" among operations by air, sea or land forces. Art 41 covers only measures not involving the use of armed force.
      - claim: The ICC is a UN court, set up by the Council like the ICTY.
        tempting: The Council can send situations to it.
        correction: The slides say the ICC is not part of the UN. The Council can refer a situation to its Prosecutor under Chapter VII (Rome Statute art 13(b)), as with Darfur in 2005.
      - claim: Targeted sanctions need no art 39 determination because they hit only individuals.
        tempting: They seem lighter than comprehensive sanctions.
        correction: 'All art 41 measures are decided in accordance with art 39: targeting changes who bears the measure, not the need for a determination first.'
    socratic:
      - ask: The Council has found a threat to the peace. Which measures does art 41 itself name?
        hint: Economic, communications, diplomatic.
        answer: Complete or partial interruption of economic relations and of rail, sea, air, postal, telegraphic, radio and other communications, and severance of diplomatic relations.
      - ask: Is that list closed?
        hint: The word "include".
        answer: No — it is non-exhaustive, giving the Council a wide scope of non-military coercive measures.
      - ask: Why has practice moved from comprehensive to targeted sanctions?
        hint: Iraq in the 1990s.
        answer: Comprehensive sanctions harmed whole populations, so the Council turned to commodity bans, travel bans and asset freezes on particular groups, corporations or individuals.
      - ask: Could the Council create a criminal tribunal under art 41?
        hint: ICTY, ICTR.
        answer: Yes. That was debated at first, since art 41 never mentions tribunals, but members accepted it and it is no longer questioned.
      - ask: What else short of force can it do about atrocity crimes?
        hint: A court outside the UN.
        answer: Refer the situation to the ICC Prosecutor under Chapter VII (Rome Statute art 13(b)), as with Darfur in 2005.
    what-if:
      - change: The Council wants to pressure only a junta's leaders, not the whole population.
        effect: 'Targeted measures fit: asset freezes and travel bans on named individuals, groups or corporations — the trend that grew from criticism of comprehensive sanctions on Iraq.'
      - change: The Council adds a naval blockade of the target's ports.
        effect: 'That moves from art 41 to art 42: "blockade" is listed among operations by air, sea or land forces, available only if art 41 measures would be or have proved inadequate.'
      - change: Mass atrocities are alleged and the state is not a party to the Rome Statute.
        effect: The Council, acting under Chapter VII, may still refer the situation to the ICC Prosecutor (art 13(b)), as it did for Darfur.
    boundary:
      - text: The ICTY and ICTR.
        why: 'Inside art 41: tribunals are not named, but the list is non-exhaustive and members accepted the Council''s power to create them.'
      - text: A no-fly zone enforced by members' aircraft.
        why: 'Outside art 41: enforcing a no-fly zone (Libya 2011, Res 1973) appears among authorisations of force under art 42.'
    transfer:
      - scenario: A rebel group funds a brutal civil war by selling timber smuggled through neighbouring ports. Its leaders bank abroad. The Council has found a threat to the peace but wants to spare ordinary civilians.
        answer: 'Use targeted art 41 measures: a ban on trade in the commodity funding the war (as with conflict diamonds), plus asset freezes and travel bans on the leaders. A sanctions committee can set the details; effectiveness depends on how states implement the regime.'
    objections:
      - position: A political organ like the Council cannot create a criminal court under art 41.
        evidence: Art 41's examples are economic, communications and diplomatic measures; no tribunal is mentioned. This was debated when the ICTY and ICTR were contemplated.
        objection: The list is non-exhaustive ("include"). Members accepted that the Council could create the tribunals, and the lecturer said that is no longer questioned.
    sources:
      - Week 10 - Lecture Slides - Collective Security and International Organisations (slides 18–23)
      - 'Week 10 - Lecture Transcript (Live) - Collective Security (Part A.1) (art 41: sanctions, the non-exhaustive list, the debate over creating the ICTY and ICTR)'
      - 'Week 12 - Tutorial Revision Quiz Questions (Q17: art 41 v art 42 measures)'
