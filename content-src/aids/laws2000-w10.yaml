unit: laws2000
week: 10
source: raw/laws2000-pil/week-10
generator: aids-1
aids:
  - concept: laws2000-w10-collective-security-and-the-un-system
    plain: 'Collective security treats war and aggression as every state''s concern, not a private quarrel: threats are met jointly through an organisation. The UN centralises the permissible use of force in one body: the Security Council.'
    concrete: When Iraq invaded and occupied Kuwait in 1990, the response was not left to Kuwait alone. The Security Council, acting on behalf of all UN members, found a breach of the peace and authorised a US-led coalition of states co-operating with Kuwait to use all necessary means to restore its sovereignty (Res 678, Operation Desert Storm). One state's invasion became every state's concern, answered through one body.
    formal: 'The UN''s first Purpose is "to maintain international peace and security", including through "effective collective measures for the prevention and removal of threats to the peace" (art 1(1)). The UN system centralises the permissible use of force in the Security Council. Its tools: peaceful settlement (Chapter VI, art 33), collective security without force (Chapter VII, art 41) and with force (Chapter VII, art 42).'
    analogy:
      text: A street where, instead of every household arming itself, the residents agree that one committee will decide how to respond to any break-in — and five founding households can block any response.
      maps:
        - from: the households
          to: UN member states
        - from: the committee deciding the response
          to: the Security Council
        - from: founding households able to block
          to: the P-5 veto (art 27(3))
        - from: a break-in
          to: a threat to the peace, breach of the peace or act of aggression
      limits:
        - 'The committee has no patrol of its own: art 43 was never implemented, so the Council relies on members to supply forces.'
        - 'A household under attack may still defend itself at once: self-defence (art 51) needs no Council decision.'
    terms:
      - term: collective security
        gloss: 'A system where war and aggression are the concern of all states, not a private dispute: war against one is war against all. An international-relations idea, not a legal term.'
      - term: P-5
        gloss: The five permanent members of the Security Council — the US, China, Russia, the UK and France — each holding a veto (art 27(3)).
        example: The structure reflects who won World War II.
      - term: centralisation of force
        gloss: The UN system places the permissible use of force with one body, the Security Council, instead of each state deciding for itself.
    misconceptions:
      - claim: Collective security is a precise legal term defined in the Charter.
        tempting: The UN was founded on it and the week is named after it.
        correction: 'The lecturer stressed it is not a legal term but an international-relations idea: threats are handled collectively through an organisation. The legal machinery is Chapters VI and VII of the Charter.'
      - claim: NATO, as a collective security organisation, may decide for itself when to use force.
        tempting: The slides give NATO as an example of collective security.
        correction: NATO stays bound by the Charter's rules on force. Without Council authorisation it may act only within a Charter exception, such as self-defence when a member is attacked.
      - claim: Because force is centralised in the Council, the Council responds to every threat to the peace.
        tempting: Art 24 gives it primary responsibility for peace and security.
        correction: 'The slides say the Council has not been able to act in every case: it lacks capacity (no standing UN army) and the P-5 veto can block action.'
    socratic:
      - ask: Why was the UN created in 1945?
        hint: The first half of the 20th century.
        answer: To prevent the instability and unchecked aggression that marked inter-state affairs in the first half of the 20th century, and to maintain international peace and security.
      - ask: What does collective security change about how aggression is treated?
        hint: War against one is…
        answer: 'Aggression stops being a private dispute between two states: it becomes the concern of all, and threats are met jointly through an organisation.'
      - ask: In the UN system, who decides on a collective response involving force?
        hint: One body.
        answer: 'The Security Council: the UN system centralises the permissible use of force in that one body.'
      - ask: What tools does the Council have, from least to most coercive?
        hint: The slides' three columns.
        answer: 'Peaceful settlement (Chapter VI, art 33); collective security without force (Chapter VII, art 41: sanctions); collective security with force (art 42: authorising states, regional organisations or peace operations).'
      - ask: Why has the system not answered every threat?
        hint: Troops and votes.
        answer: There is no standing UN army, so the Council relies on members, and the P-5 veto can block decisions.
    what-if:
      - change: A regional alliance wants to use force in a crisis outside its members' territory, without Council authorisation.
        effect: 'Being a collective body gives it no power of its own: force is centralised in the Council. It may enforce only with Council authorisation (art 53), unless a Charter exception such as self-defence applies.'
      - change: A permanent member is closely allied with the state threatening the peace.
        effect: It can veto any Council decision (art 27(3)), so the collective response may never come. The General Assembly may then act under Uniting for Peace, but only by recommending measures.
    boundary:
      - text: NATO's collective defence arrangement.
        why: 'Collective security, but inside the UN framework: the Charter''s rules on force still bind NATO, so it cannot decide alone when force is lawful.'
      - text: A state repelling an armed attack on itself.
        why: 'Outside the Council''s centralised control: self-defence (art 51) is the other exception to art 2(4) and needs no prior Council authorisation.'
    transfer:
      - scenario: 'Five island states sign a pact: an attack on any one is an attack on all, and a joint council of the five will decide the response. Then one of them is invaded.'
        answer: 'The pact expresses the collective-security idea — war against one is war against all, as in the League, the UN and NATO. But it sits under the Charter: as with NATO, a joint armed response is lawful only within a Charter exception (self-defence, art 51) or with Security Council authorisation, because the UN centralises the permissible use of force in the Council.'
    sources:
      - Week 10 - Lecture Slides - Collective Security and International Organisations (slides 4–7, 11, 44)
      - 'Week 10 - Lecture Transcript (Live) - Collective Security (Part A.1) (opening: the UN''s creation by the WWII victors; collective security not a legal term; League, UN and NATO; NATO bound by the Charter; the three tools)'
    verify: false
  - concept: laws2000-w10-security-council-composition-and-powers
    plain: The Security Council has 15 states, five of them permanent with a veto. Members gave it main responsibility for peace and security, agreed to carry out its decisions, and let those decisions override conflicting treaties.
    concrete: 'In 2017 the Council, acting on North Korea''s nuclear programme, adopted S/RES/2397: lower caps on refined petroleum supplied to the DPRK, bans on its exports of food, machinery and other goods, and a duty to de-register vessels involved in illicit activities. Every UN member — not just the 15 at the table — must carry out those decisions (art 25), and a member''s trade treaty with the DPRK cannot excuse it (art 103).'
    formal: 'Art 23: 15 members; five permanent (US, China, Russia, UK, France) with the veto (art 27(3)); ten elected by the General Assembly for two years along regional lines. Art 24(1): members confer "primary responsibility for the maintenance of international peace and security", and the Council acts on their behalf; its powers lie in Chapters VI, VII, VIII and XII (art 24(2)). Art 25: decisions bind; art 103: Charter obligations prevail.'
    terms:
      - term: primary responsibility
        gloss: 'Art 24(1): members confer on the Council the main — not exclusive — responsibility for international peace and security, for prompt and effective action.'
      - term: veto
        gloss: The power of each permanent member to block a Council decision (art 27(3)).
      - term: elected members
        gloss: 'Ten non-permanent members chosen by the General Assembly for two-year terms, five each year: Africa 3, Asia 2, Latin America and Caribbean 2, WEOG 2, Eastern Europe 1.'
      - term: art 103
        gloss: Where Charter obligations conflict with obligations under any other international agreement, the Charter obligations prevail.
    misconceptions:
      - claim: Art 24 gives the Council exclusive responsibility for peace and security, so no other organ may touch it.
        tempting: The Council is the UN's peace-and-security organ.
        correction: 'Art 24(1) says "primary", not exclusive. The General Assembly has a subsidiary responsibility: it may discuss and recommend (arts 11(2), 14), subject to art 12.'
      - claim: A Council decision binds only the members that voted for it.
        tempting: Treaty obligations usually depend on each state's consent.
        correction: Under art 25 every member has agreed in advance to accept and carry out the Council's decisions. Voting against, or not sitting on the Council, changes nothing.
      - claim: A treaty concluded before a Council decision prevails over the decision.
        tempting: It feels as if the earlier commitment should come first.
        correction: Art 103 gives Charter obligations — including carrying out binding decisions — priority over obligations under any other international agreement, whatever its date.
    socratic:
      - ask: Who sits on the Security Council?
        hint: Art 23.
        answer: 'Fifteen UN members: five permanent (US, China, Russia, UK, France) and ten elected by the General Assembly for two-year terms along regional lines.'
      - ask: What extra power do the five permanent members hold, and why does it matter?
        hint: Art 27(3).
        answer: The veto. Any one of them can block a decision — one reason the slides give for the Council not acting in every threat.
      - ask: Why does the Council, rather than each state, act on threats to peace?
        hint: Art 24(1).
        answer: Members conferred primary responsibility on it, to ensure prompt and effective action, and agreed that it acts on their behalf.
      - ask: Must a state that voted against a decision carry it out?
        hint: Art 25.
        answer: Yes. Members agree to accept and carry out the Council's decisions, so the decision binds all members.
      - ask: What if carrying it out breaches that state's treaty with another state?
        hint: Art 103.
        answer: The Charter obligation prevails over the obligation under the other agreement.
    elements:
      - name: Primary responsibility
        test: Members confer on the Council primary responsibility for international peace and security; it acts on their behalf, within the Purposes and Principles, using Chapters VI, VII, VIII and XII.
        authorities:
          - un-charter-art-24
      - name: Decisions bind all members
        test: Members agree to accept and carry out the Council's decisions in accordance with the Charter.
        authorities:
          - un-charter-art-25
      - name: Decisions prevail over conflicting treaties
        test: In a conflict between Charter obligations and obligations under any other international agreement, the Charter obligations prevail.
        authorities:
          - un-charter-art-103
    what-if:
      - change: One permanent member votes against a Chapter VII draft that the other 14 members support.
        effect: 'Its veto (art 27(3)) blocks the draft: no decision is adopted, so nothing binds under art 25. A deadlock of this kind is what Uniting for Peace addresses, though the Assembly can only recommend.'
      - change: The demand comes from a General Assembly resolution instead of the Council.
        effect: 'Art 25 does not apply: the Assembly recommends (arts 11(2), 14). No binding obligation arises, so art 103 has nothing to give priority to.'
    boundary:
      - text: A state elected to the Council for two years.
        why: A full member during its term, but without the veto, which art 27(3) gives only to the five permanent members.
      - text: The Council authorising a regional organisation to enforce its decisions.
        why: 'Inside its powers: art 24(2) lists Chapter VIII among the chapters holding the Council''s powers, and art 53 allows regional enforcement.'
    transfer:
      - scenario: The Council decides that all members must freeze the assets of named militia leaders. State Z, not on the Council, has an investment treaty guaranteeing free transfer of funds to investors — one of whom is a named leader.
        answer: Z must freeze the assets. A Council decision binds all members, not only those on the Council (art 25), and art 103 makes that Charter obligation prevail over the conflicting investment-treaty obligation. Z cannot rely on the treaty to avoid the decision.
    sources:
      - Week 10 - Lecture Slides - Collective Security and International Organisations (slides 8–10, 21)
      - Week 10 - Lecture Transcript (Live) - Collective Security (Part A.1) (the Council's 15 members and P-5; veto; rotation of elected members; art 24 primary responsibility; art 25 binding decisions; art 103)
