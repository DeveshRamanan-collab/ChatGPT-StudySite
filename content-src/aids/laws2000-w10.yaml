  - concept: laws2000-w10-general-assembly-and-secretary-general
    plain: The General Assembly — every member, one vote each — can discuss peace and security and recommend, but not decide. It holds back while the Council deals with a matter, unless the Council is deadlocked.
    concrete: In 1950, with the Cold War deadlocking the Council, the Assembly adopted Resolution 377(V), "Uniting for Peace". If the Council, because the permanent members cannot agree, fails to exercise its primary responsibility where there appears to be a threat to the peace, breach of the peace or act of aggression, the Assembly will consider the matter immediately and recommend collective measures to members.
    formal: 'The Assembly may discuss peace and security questions and, except as provided in art 12, recommend; questions needing action go to the Council (art 11(2)). It may recommend measures for peaceful adjustment (art 14; Certain Expenses). While the Council exercises its functions on a matter, it shall not recommend unless asked (art 12(1); Wall, paras 27–28). Uniting for Peace: GA Res 377(V). The Secretary-General may alert the Council (art 99).'
    terms:
      - term: subsidiary responsibility
        gloss: 'The Assembly''s secondary role in peace and security: it discusses and recommends (arts 11(2), 14), subject to art 12, while the Council has primary responsibility.'
      - term: Uniting for Peace
        gloss: 'GA Res 377(V) (1950): if P-5 disagreement stops the Council acting, the Assembly considers the matter at once and recommends collective measures.'
      - term: good offices
        gloss: The Secretary-General's role in mediating and resolving international crises, expanded over the years, including through Special Representatives.
    misconceptions:
      - claim: Under Uniting for Peace the Assembly can adopt binding decisions in place of the Council.
        tempting: It steps in when the Council cannot act.
        correction: Uniting for Peace lets the Assembly recommend collective measures to members. Binding force under art 25 attaches only to Security Council decisions.
      - claim: The Assembly may recommend on any dispute at any time.
        tempting: Art 11(2) lets it discuss any peace-and-security question.
        correction: 'Art 12(1): while the Council is exercising its functions on a dispute or situation, the Assembly shall not make recommendations on it unless the Council requests.'
      - claim: The Assembly has no role at all in peace and security.
        tempting: Art 24 gives the Council primary responsibility.
        correction: 'The Assembly has a subsidiary responsibility: it may discuss and recommend (arts 11(2), 14), and in practice it may now consider a matter in parallel with the Council, usually taking a broader view.'
    socratic:
      - ask: How are votes counted in the Assembly?
        hint: Art 18.
        answer: One state, one vote, across all 193 members — why it is seen as the most "democratic" organ.
      - ask: What may it do about a threat to peace?
        hint: Arts 11(2) and 14.
        answer: Discuss it and recommend, including measures for peaceful adjustment; a question needing action must be referred to the Council.
      - ask: What limits it while the Council is dealing with the matter?
        hint: Art 12(1).
        answer: It shall not make recommendations on that dispute or situation unless the Council asks — though practice now allows parallel consideration.
      - ask: And if a veto paralyses the Council?
        hint: '1950.'
        answer: Under Uniting for Peace, the Assembly considers the matter immediately with a view to recommending collective measures to members.
      - ask: What can the Secretary-General do?
        hint: Art 99.
        answer: Bring to the Council's attention any matter that may threaten international peace and security, and offer good offices in mediating crises.
    elements:
      - name: Discuss
        test: The Assembly may discuss any question relating to international peace and security brought before it.
        authorities:
          - un-charter-art-11-2
      - name: Not while the Council acts
        test: While the Council exercises its functions on the matter, no Assembly recommendation unless the Council requests.
        authorities:
          - un-charter-art-12-1
        cases:
          - construction-of-a-wall-advisory-opinion
      - name: Recommend, never decide
        test: It may recommend, including measures for peaceful adjustment; questions needing action go to the Council.
        authorities:
          - un-charter-art-11-2
          - un-charter-art-14
        cases:
          - certain-expenses-of-the-united-nations
      - name: 'Deadlock: Uniting for Peace'
        test: If lack of P-5 unanimity stops the Council acting on a threat, breach or aggression, the Assembly recommends collective measures.
        authorities:
          - unga-resolution-377-v
    what-if:
      - change: The Council is actively handling the crisis, and the Assembly wants to recommend a solution.
        effect: Art 12(1) bars Assembly recommendations on it unless the Council requests; the lecture noted practice now allows parallel consideration, the Assembly usually taking a broader view.
      - change: A permanent member vetoes every draft on the crisis.
        effect: 'Uniting for Peace applies: the Council has failed, through lack of P-5 unanimity, to exercise its primary responsibility, so the Assembly may consider the matter at once and recommend collective measures.'
      - change: The Secretary-General sees a crisis no member has raised.
        effect: Art 99 lets the Secretary-General bring it to the Council's attention, and good offices may be offered to mediate.
    boundary:
      - text: The Assembly considering a crisis in parallel with the Council.
        why: Once doubtful under art 12(1); the lecture explained the old no-overlap view has evolved, and parallel consideration is now accepted.
      - text: An Assembly resolution "demanding" sanctions.
        why: 'Outside binding effect: whatever its wording, the Assembly recommends; only Council decisions bind under art 25.'
    transfer:
      - scenario: Fighting threatens a region. A Council draft authorising sanctions fails on one permanent member's veto. Small states ask the Assembly to act.
        answer: The Council has failed, for lack of P-5 unanimity, to exercise its primary responsibility, so under Uniting for Peace the Assembly may consider the matter immediately and recommend collective measures to members. Those recommendations do not bind under art 25.
    sources:
      - Week 10 - Lecture Slides - Collective Security and International Organisations (slides 38–43)
      - 'Week 10 - Lecture Transcript (Live) - Collective Security (Part A.1) (the Assembly''s role alongside the Council: the old no-overlap view and parallel consideration)'
