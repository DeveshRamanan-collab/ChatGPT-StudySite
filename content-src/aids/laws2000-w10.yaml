  - concept: laws2000-w10-un-peacekeeping-operations
    plain: UN peacekeeping missions are run by the UN itself to keep a peace, not enforce one. Traditionally they need the parties' consent, stay impartial and use force only in self-defence — though that is changing.
    concrete: In the Democratic Republic of the Congo, the UN mission (MONUSCO) has been authorised to use force to carry out its mandate, including targeted offensive operations — far from the traditional rule of force only in self-defence. Mali saw a similar shift. Elsewhere, in Kosovo and Timor-Leste, the UN went further still and acted as a transitional administration.
    formal: 'UN peacekeeping or peace operations are not explicitly mentioned in the UN Charter. They were primarily created to keep the peace, not to enforce it, and are UN operations, unlike authorisations to states. Traditional principles: consent of the parties; impartiality; non-use of force except in self-defence. Practice is evolving: transitional administration; missions authorised to use force (DRC, Mali).'
    analogy:
      text: 'Traditional peacekeepers are like a referee both teams invited: neutral, keeping the game calm, only stepping in to protect themselves. A Chapter VII authorisation is more like sending in police.'
      maps:
        - from: both teams invite the referee
          to: consent of the parties
        - from: the referee's neutrality
          to: impartiality
        - from: stepping in only to protect themselves
          to: force only in self-defence
        - from: the police
          to: states authorised under art 42 to use "all necessary means"
      limits:
        - Some modern mandates authorise peacekeepers to use force, even targeted offensive operations (DRC, Mali) — something no referee does.
    terms:
      - term: peace operation
        gloss: A UN-run mission, not mentioned in the Charter, created to keep the peace rather than enforce it.
      - term: consent of the parties
        gloss: 'The first traditional principle: the mission deploys with the agreement of the parties to the conflict.'
      - term: transitional administration
        gloss: The UN temporarily administering a territory, as in Kosovo and Timor-Leste — an evolution of peacekeeping.
    misconceptions:
      - claim: Peacekeeping is expressly provided for in Chapter VII of the Charter.
        tempting: The slides' tools table lists peacekeeping operations in the Chapter VII columns.
        correction: The slides say peacekeeping is not explicitly mentioned in the Charter; it grew up in practice.
      - claim: A peacekeeping mission is just another name for a coalition authorised to use force.
        tempting: Both involve troops sent with Council backing.
        correction: Peacekeeping operations are UN operations, created to keep the peace; an authorisation empowers states or regional organisations to use force under art 42.
      - claim: Peacekeepers may never use force beyond self-defence.
        tempting: That is the third traditional principle.
        correction: 'Practice has changed: some missions, as in the DRC (including targeted offensive operations) and Mali, are authorised to use force to carry out their mandate.'
    socratic:
      - ask: Where in the Charter will you find peacekeeping?
        hint: Look for the word.
        answer: 'Nowhere: peace operations are not explicitly mentioned in the Charter.'
      - ask: What were they originally for?
        hint: Keep or enforce?
        answer: To keep the peace, not to enforce it.
      - ask: What three principles traditionally governed them?
        hint: Agreement, neutrality, restraint.
        answer: Consent of the parties, impartiality, and non-use of force except in self-defence.
      - ask: How has practice moved on?
        hint: Kosovo; the DRC.
        answer: The UN has acted as transitional administration (Kosovo, Timor-Leste), and some missions are authorised to use force to carry out their mandate (DRC, Mali).
      - ask: How does a peacekeeping mission differ from a Res 678-style authorisation?
        hint: Who runs it?
        answer: Peacekeeping is a UN operation; an authorisation empowers member states or regional organisations to use force.
    elements:
      - name: Consent of the parties
        test: The parties to the conflict agree to the mission's deployment.
      - name: Impartiality
        test: The mission does not take sides between the parties.
      - name: Non-use of force except in self-defence
        test: Traditionally force only in self-defence; some mandates now authorise force to carry out the mandate (DRC, Mali).
    what-if:
      - change: The host government withdraws its consent to the mission.
        effect: 'The first traditional principle is no longer met: a consent-based mission rests on the parties'' agreement. Continuing coercively would look like enforcement, which traditional peacekeeping was not designed for.'
      - change: The mandate authorises the mission to use force to protect civilians and neutralise armed groups.
        effect: The mission moves beyond the traditional self-defence principle, as in the DRC and Mali — reflecting the changing attitude to the use of force in peace operations.
    boundary:
      - text: MONUSCO's targeted offensive operations in the DRC.
        why: 'Still a UN peace operation, but at the edge: force authorised to carry out the mandate goes beyond the traditional self-defence principle.'
      - text: NATO's operation in Libya (2011).
        why: 'Not peacekeeping: a regional organisation acting on a Council authorisation to use force, not a UN-run operation.'
    transfer:
      - scenario: After a ceasefire between two factions, both ask the UN to send monitors to patrol the line between them. Soon one faction starts attacking civilians in a nearby town.
        answer: 'The monitoring mission fits traditional peacekeeping: consent, impartiality, force only in self-defence. Protecting the town by force would need a mandate authorising force to carry it out (as in the DRC or Mali), or a separate Chapter VII authorisation to states.'
    sources:
      - Week 10 - Lecture Slides - Collective Security and International Organisations (slides 33–37, 44)
