  - concept: laws2000-w10-peaceful-settlement-under-chapter-vi
    plain: Before any coercion, states in a dispute that could endanger peace must first try peaceful means. The Security Council can investigate, urge and recommend under Chapter VI — but it cannot compel.
    concrete: 'The lecturer tied this back to the earlier week on dispute settlement: art 33''s list — negotiation, enquiry, mediation, conciliation, arbitration, judicial settlement — is not only for the parties; it expressly involves the Council. If the Council thinks it necessary, it can recommend that the parties settle in one of those ways. Any member can bring a dispute to the Council or the Assembly, and the Council should bear in mind that legal disputes usually belong before the ICJ.'
    formal: 'Art 33(1): parties to a dispute likely to endanger international peace and security "shall, first of all, seek a solution" by negotiation, enquiry, mediation, conciliation, arbitration, judicial settlement, regional agencies or other peaceful means. The Council may call upon them to do so (art 33(2)), investigate (art 34) and recommend procedures (art 36(1)); legal disputes generally go to the ICJ (art 36(3)); unsettled disputes are referred to it (art 37(1)).'
    terms:
      - term: Chapter VI
        gloss: The Charter's chapter on pacific settlement of disputes. The Council investigates, calls upon the parties and recommends; no art 39 determination is needed.
      - term: art 33(1) means
        gloss: Negotiation, enquiry, mediation, conciliation, arbitration, judicial settlement, regional agencies or arrangements, or other peaceful means of the parties' choice.
      - term: situation (art 34)
        gloss: Something short of a dispute that might lead to international friction or give rise to a dispute; the Council may investigate it.
    misconceptions:
      - claim: Under Chapter VI the Council can impose binding sanctions on a party that refuses to settle.
        tempting: The Council's decisions bind under art 25.
        correction: Chapter VI powers are to investigate, call upon the parties and recommend (arts 33(2), 34, 36(1)). Sanctions are Chapter VII art 41 measures, needing an art 39 determination first.
      - claim: Parties who fail to settle by art 33 means must take the dispute to the ICJ.
        tempting: Art 36(3) points legal disputes to the ICJ.
        correction: 'Art 37(1) requires them to refer it to the Security Council. Art 36(3) is only a consideration for the Council: legal disputes should as a general rule be referred to the ICJ by the parties.'
      - claim: Chapter VI is the General Assembly's job; the Council only acts under Chapter VII.
        tempting: Members may also bring disputes to the Assembly (art 35).
        correction: Arts 33–37 set out the Security Council's role in peaceful settlement. Art 35 merely lets any member raise a dispute with the Council or the Assembly.
    socratic:
      - ask: Two states' quarrel is escalating and could endanger peace. What must they do first?
        hint: 'Art 33(1): "first of all".'
        answer: 'Seek a solution by peaceful means of their choice: negotiation, enquiry, mediation, conciliation, arbitration, judicial settlement or regional arrangements.'
      - ask: Who can bring the quarrel to the Council?
        hint: Art 35.
        answer: Any UN member, not only the parties — to the Security Council or the General Assembly.
      - ask: What can the Council do with it under Chapter VI?
        hint: Arts 33(2), 34, 36.
        answer: Call on the parties to settle peacefully, investigate whether it endangers peace, and recommend procedures or methods of adjustment — pointing legal disputes towards the ICJ.
      - ask: Can it force a settlement or impose sanctions here?
        hint: Which chapter holds coercion?
        answer: No. Chapter VI is recommendatory; coercive measures need an art 39 determination under Chapter VII.
    elements:
      - name: A dispute likely to endanger peace
        test: Art 33(1) applies to disputes whose continuance is likely to endanger the maintenance of international peace and security; a mere situation may be investigated (art 34).
        authorities:
          - un-charter-art-33-1
      - name: Parties seek peaceful means first
        test: Negotiation, enquiry, mediation, conciliation, arbitration, judicial settlement, regional agencies or other peaceful means of their choice.
        authorities:
          - un-charter-art-33-1
      - name: Council calls upon, investigates, recommends
        test: Call upon the parties (art 33(2)); investigate (art 34); recommend procedures or methods of adjustment (art 36(1)); legal disputes generally to the ICJ (art 36(3)).
      - name: Unsettled disputes go to the Council
        test: Parties who fail to settle by art 33 means shall refer the dispute to the Security Council (art 37(1)).
    what-if:
      - change: The disagreement is a minor technical one with no risk to international peace.
        effect: Art 33(1)'s duty is limited to disputes whose continuance is likely to endanger international peace and security; this one is outside it, though peaceful means remain available.
      - change: The dispute is a legal one over a maritime boundary.
        effect: The Council should consider that legal disputes should, as a general rule, be referred by the parties to the ICJ (art 36(3)). It recommends; it cannot send the case to the Court itself.
      - change: One party ignores every recommendation and fighting begins.
        effect: Chapter VI has no coercive answer. The Council must determine a threat to the peace or breach of the peace under art 39 to open Chapter VII measures.
    boundary:
      - text: Tension that is not yet a dispute but might lead to international friction.
        why: 'Inside Chapter VI: art 34 lets the Council investigate any situation which might lead to friction, to see whether it endangers peace.'
      - text: A trade embargo on a party refusing to negotiate.
        why: 'Outside Chapter VI: an embargo is an art 41 measure, available only after an art 39 determination under Chapter VII.'
    transfer:
      - scenario: Two neighbours argue over water from a shared river. Troops gather near the border, and a third state, not a party, raises the matter at the UN.
        answer: The parties must first seek a peaceful solution (art 33(1)). Any member may bring the dispute to the Council (art 35). The Council can investigate (art 34), call on the parties to settle (art 33(2)) and recommend methods (art 36(1)), pointing a legal question to the ICJ (art 36(3)). Coercion needs a Chapter VII art 39 determination.
    sources:
      - Week 10 - Lecture Slides - Collective Security and International Organisations (slides 11–14)
      - 'Week 10 - Lecture Transcript (Live) - Collective Security (Part A.1) (Chapter VI: art 33 means and the Council''s role; members bringing disputes; legal disputes to the ICJ)'
    verify: false
  - concept: laws2000-w10-article-39-determination-and-provisional-measures
    plain: The Council's coercive powers open only once it finds a threat to the peace, breach of the peace or act of aggression. It may also ask the parties for holding steps, like a ceasefire.
    concrete: In the tutorial's Aeystan scenario, a coup leads to factional fighting, refugees flee across borders, and neighbours Belandia and Ceria arm rival factions. Before the Council can impose anything under arts 41 or 42, it must determine a threat to the peace under art 39. It might also call on the factions, under art 40, to observe a ceasefire and let humanitarian aid through — without deciding who is in the right.
    formal: 'Art 39: the Council "shall determine the existence of any threat to the peace, breach of the peace, or act of aggression and shall make recommendations, or decide what measures shall be taken" under arts 41 and 42. Art 40: to prevent aggravation, it may call upon the parties to comply with provisional measures, "without prejudice to the rights, claims, or position" of the parties.'
    analogy:
      text: 'A locked cupboard of tools: the art 39 finding is the key. Inside, the lower shelf holds non-forcible tools; the top shelf, force, reached only if the lower ones won''t do. At the door, the Council can say "stop where you are".'
      maps:
        - from: the key
          to: the art 39 determination
        - from: the lower shelf
          to: art 41 measures not involving force
        - from: the top shelf
          to: art 42 force, if art 41 would be or has proved inadequate
        - from: '"stop where you are"'
          to: art 40 provisional measures
      limits:
        - A key either fits or it doesn't; the art 39 finding is a flexible judgement for the Council, whose reach has widened over time.
        - 'In practice the order is not strict: provisional demands often come in the same resolution as sanctions or an authorisation of force.'
    terms:
      - term: art 39 determination
        gloss: The Council's finding of a threat to the peace, breach of the peace or act of aggression; it separates Chapter VII from Chapter VI and opens arts 41 and 42.
      - term: provisional measures (art 40)
        gloss: Holding steps the Council calls on the parties to take to prevent aggravation, e.g. a ceasefire, cessation of hostilities or letting humanitarian aid in.
      - term: without prejudice
        gloss: 'Art 40 measures do not affect the parties'' rights, claims or position: they hold the situation, they do not settle it.'
    misconceptions:
      - claim: The Council must find an armed attack before it can act under Chapter VII.
        tempting: '"Armed attack" is the trigger for force in self-defence.'
        correction: Armed attack is the art 51 trigger. Chapter VII opens on the Council's own art 39 determination of a threat to the peace, breach of the peace or act of aggression.
      - claim: Provisional measures must always come first, before any sanctions or force.
        tempting: Art 40 says the Council may act "before" deciding measures under art 39.
        correction: 'The lecturer said practice differs: the Council often demands a ceasefire or humanitarian access in the same resolution in which it imposes sanctions or authorises force, and this has been accepted.'
      - claim: Provisional measures decide who is in the right.
        tempting: They are directed at named parties and carry consequences.
        correction: Art 40 measures are "without prejudice to the rights, claims, or position of the parties concerned"; their purpose is to prevent an aggravation of the situation.
    socratic:
      - ask: Civil war breaks out and refugees cross borders. Can the Council impose sanctions straight away?
        hint: What opens Chapter VII?
        answer: Not without first determining, under art 39, a threat to the peace, breach of the peace or act of aggression.
      - ask: Once it has made that finding, what may it do?
        hint: Two verbs in art 39.
        answer: '"Make recommendations" (not binding) or "decide" measures under arts 41 and 42 (binding under art 25).'
      - ask: What could it ask of the parties to stop the situation worsening meanwhile?
        hint: Art 40.
        answer: 'Provisional measures: a ceasefire, a cessation of hostilities, letting humanitarian aid in — without prejudice to the parties'' rights, claims or position.'
      - ask: What happens if a party ignores them?
        hint: Art 40's last sentence.
        answer: The Council "shall duly take account" of the failure to comply — which may inform its later measures. Nothing follows automatically.
      - ask: In what order should an answer take the steps?
        hint: Determination, holding, non-forcible, forcible.
        answer: Art 39 determination; any art 40 measures; art 41; art 42 only if art 41 measures would be or have proved inadequate.
    elements:
      - name: Art 39 determination
        test: The Council determines a threat to the peace, breach of the peace or act of aggression; without it, arts 41 and 42 are closed and only Chapter VI is available.
        authorities:
          - un-charter-art-39
      - name: Provisional measures (optional)
        test: To prevent aggravation, the Council may call on the parties to comply with provisional measures, without prejudice to their rights; failure to comply is taken into account.
        authorities:
          - un-charter-art-40
      - name: Non-forcible measures
        test: 'Measures not involving armed force: sanctions, severance of communications or diplomatic relations, tribunals, ICC referral.'
        authorities:
          - un-charter-art-41
      - name: Force as last resort
        test: Only if the Council considers art 41 measures "would be inadequate or have proved to be inadequate".
        authorities:
          - un-charter-art-42
    what-if:
      - change: The Council has made no art 39 finding but wants to impose an arms embargo.
        effect: 'It cannot yet: an embargo is an art 41 measure, and arts 41 and 42 are closed without an art 39 determination. Under Chapter VI it can only call upon, investigate and recommend.'
      - change: A faction ignores the Council's call for a ceasefire.
        effect: The Council "shall duly take account" of the failure (art 40). It may move to art 41 or 42 measures, but only by a further decision; nothing is automatic.
      - change: The Council skips sanctions and goes straight to authorising force.
        effect: 'Permissible if it considers art 41 measures "would be inadequate": art 42 does not require sanctions to be tried and to fail first.'
    boundary:
      - text: A Council call on the parties to negotiate.
        why: Can sit in Chapter VI (art 33(2)), which needs no art 39 finding — why the lecturer said the debate over determinations for provisional measures can be theoretical.
      - text: The 2014 Ebola outbreak in Africa.
        why: 'Inside art 39: the Council treated it as a threat to the peace, showing how flexible the determination has become.'
    transfer:
      - scenario: A dam collapse in State Q floods its neighbours and armed groups seize the relief routes. The Council wants food convoys to move now, before deciding anything else.
        answer: First it must determine a threat to the peace (art 39); practice now covers non-traditional threats. To prevent aggravation it may call on the armed groups, under art 40, to let humanitarian aid through — without prejudice to anyone's claims — and take account of non-compliance before deciding art 41 or 42 measures.
    objections:
      - position: An art 39 determination must precede any art 40 provisional measures.
        evidence: Art 40 sits in Chapter VII and refers to measures "provided for in Article 39". The lecturer said most scholars take this view.
        objection: Some provisional measures, such as calls to cease hostilities, resemble Chapter VI peaceful means, for which no determination is needed — so the debate can be largely theoretical.
    sources:
      - Week 10 - Lecture Slides - Collective Security and International Organisations (slides 15–18)
      - 'Week 10 - Lecture Transcript (Live) - Collective Security (Part A.1) (Chapter VI v Chapter VII: the art 39 determination; recommend or decide; art 40 provisional measures, their wording, practice and the scholarly debate)'
      - 'Week 10 - Tutorial Tasks - Collective Security (Q2: the Aeystan scenario)'
    verify: false
  - concept: laws2000-w10-article-39-findings-in-practice
    plain: Of the three findings that open Chapter VII, the Council almost always uses "threat to the peace" — a flexible label stretched from invasions to terrorism, civil wars and even an epidemic.
    concrete: 'In 2014 the Council treated the Ebola outbreak in Africa as a threat to international peace and security. The lecturer called it perhaps the most striking sign of how far the finding has travelled since 1945: from invasion and aggression between states, through weapons proliferation and terrorism, to the risk of epidemics and pandemics. By contrast, the Council has never or only very rarely found an act of aggression in its resolutions.'
    formal: 'Art 39 lists three findings — "any threat to the peace, breach of the peace, or act of aggression" — any one of which opens Chapter VII. The Council''s power to determine the situation has an evolving interpretation in practice: proliferation of nuclear, chemical or biological weapons; internal armed conflicts; terrorism; serious human rights or IHL violations; the 2014 Ebola outbreak.'
    terms:
      - term: threat to the peace
        gloss: The Council's usual art 39 finding; it widened from inter-state invasion to non-traditional threats such as proliferation, terrorism, internal conflict and Ebola.
      - term: breach of the peace
        gloss: Found on very few occasions, each an armed invasion of territory — e.g. Iraq's invasion of Kuwait in 1990.
      - term: act of aggression
        gloss: The third art 39 finding; the Council has never, or only very rarely, made it in its resolutions.
    misconceptions:
      - claim: The Council regularly finds acts of aggression.
        tempting: Preventing aggression was the founders' central worry in 1945.
        correction: The lecture said the Council has never, or only very rarely, found an act of aggression; its usual finding is a threat to the peace.
      - claim: '"Threat to the peace" covers only armed conflicts between states.'
        tempting: That was what the drafters had in mind in 1945.
        correction: 'Practice has widened it to non-traditional threats: proliferation, terrorism, internal armed conflicts, serious human rights or IHL violations, and the 2014 Ebola outbreak.'
      - claim: A coup or civil war is a breach of the peace.
        tempting: Fighting has broken out, so the peace has been 'breached'.
        correction: Breach findings have been reserved for armed invasions of territory, such as Iraq–Kuwait. Internal armed conflict is treated as a threat to the peace.
    socratic:
      - ask: What three findings does art 39 list?
        hint: Threat, breach, …
        answer: A threat to the peace, a breach of the peace, or an act of aggression. Any one opens Chapter VII.
      - ask: Which has the Council used least, and which most?
        hint: The lecture ranked them.
        answer: Aggression least (never or very rarely); breach of the peace a very few times; threat to the peace by far the most.
      - ask: What did the rare breach findings have in common?
        hint: Think Kuwait, 1990.
        answer: Each involved an armed invasion of territory, such as Iraq's invasion of Kuwait.
      - ask: How has "threat to the peace" changed since 1945?
        hint: From invasion to…
        answer: It widened from inter-state invasion to proliferation, terrorism, internal conflict, serious human rights or IHL violations, and Ebola in 2014.
      - ask: Why were determinations rare before 1990?
        hint: Two superpowers and proxies.
        answer: Cold War tension between the US and Russia, sometimes played out through proxies, made agreement hard; the Council has been much more active since.
    what-if:
      - change: State R's army crosses the border and occupies part of State S.
        effect: An armed invasion of territory is the classic case for a breach of the peace (as with Iraq–Kuwait), and it may also be aggression — the categories overlap. A threat to the peace remains the safest finding to argue.
      - change: There is no fighting at all, only a secret nuclear weapons programme.
        effect: Proliferation has been treated as a threat to the peace, supporting art 41 sanctions — as with the DPRK (S/RES/2397).
      - change: A permanent member backs the government accused of mass atrocities.
        effect: The finding is for the Council, so the veto (art 27(3)) can stop any determination being made, as Cold War deadlock showed.
    boundary:
      - text: Iraq's 1990 invasion of Kuwait.
        why: 'An armed invasion: found a breach of the peace, and arguably aggression too — the categories overlap.'
      - text: A disease outbreak (Ebola 2014).
        why: 'Inside "threat to the peace": the Council''s flexible reading reaches non-traditional threats, even epidemics.'
    transfer:
      - scenario: 'Exam problem: a cyber-attack by a non-state group shuts down several states'' power grids, and the group threatens more. Which art 39 finding should you argue?'
        answer: 'A threat to the peace — the finding the Council actually uses. Support it by analogy with the closest practice: terrorism by non-state groups and other non-traditional threats. A breach finding has been reserved for armed invasions, and aggression findings are never or very rarely made.'
    storyboard:
      - caption: '1945: invasion and aggression in mind'
        detail: 'The Charter''s drafters thought of traditional risks: invasion or aggression between states.'
      - caption: 'Cold War: few determinations'
        detail: Tension between the US and Russia, sometimes through proxies, made Chapter VII determinations hard to agree.
      - caption: '1990: Iraq invades Kuwait'
        detail: One of the very few breach-of-the-peace findings, followed by the Res 678 authorisation.
      - caption: The threat widens
        detail: Proliferation, terrorism, internal armed conflicts, serious human rights or IHL violations become threats to the peace.
      - caption: '2014: Ebola is a threat'
        detail: Even an epidemic can now be a threat to international peace and security.
