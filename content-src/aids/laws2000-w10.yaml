  - concept: laws2000-w10-authorisation-of-force-under-article-42
    plain: If non-forcible measures would fail or have failed, the Council can authorise military action. With no UN army, it authorises coalitions of states or regional organisations, in clear words like "all necessary means".
    concrete: 'In 1990, after Iraq''s illegal occupation of Kuwait, the Council adopted Res 678, authorising member states co-operating with Kuwait — an ad hoc coalition led by the US — to use "all necessary means" to restore Kuwait''s sovereignty. That became Operation Desert Storm. The UN had no army of its own to send: art 43 was never implemented, so the Council authorised states to act.'
    formal: 'Art 42: should the Council consider art 41 measures "would be inadequate or have proved to be inadequate, it may take such action by air, sea, or land forces as may be necessary to maintain or restore international peace and security", including demonstrations and blockade. It is an exception to art 2(4), a last resort, relying on member states (art 43 never implemented); regional organisations may be authorised (art 53).'
    terms:
      - term: '"all necessary means"'
        gloss: The usual Chapter VII authorising formula for force, used in Res 678 (Kuwait) and Res 794 (Somalia).
      - term: art 43
        gloss: The Charter's plan for forces made available to the Council; never implemented — hence no standing UN army and reliance on coalitions.
      - term: revived or implied authorisation
        gloss: A claim to revive an earlier authorisation, or to imply one from resolutions that do not expressly authorise force.
    misconceptions:
      - claim: Res 1441 (2002) authorised the use of force against Iraq.
        tempting: It threatened "serious consequences" and gave Iraq a "final opportunity".
        correction: Res 1441 contained no authorising words. The coalition instead claimed that Iraq's material breach revived Res 678's authority — a claim most Council and UN members, and most scholars, rejected.
      - claim: Art 42 force is available only after sanctions have been tried and failed.
        tempting: Force is a last resort.
        correction: Art 42 also applies where the Council considers art 41 measures "would be inadequate" — they need not have been tried first.
      - claim: A regional organisation such as NATO may enforce peace on its own initiative.
        tempting: NATO acted in Libya; ECOWAS in Liberia.
        correction: 'Regional organisations enforce Council decisions only when the Council authorises them (art 53, Chapter VIII): the permissible use of force stays centralised in the Council.'
    socratic:
      - ask: Sanctions are failing to stop an invasion. What can the Council do next?
        hint: Art 42's condition.
        answer: If it considers art 41 measures inadequate (or would be), it may take action by air, sea or land forces — an exception to art 2(4) and a last resort.
      - ask: Whose forces will act?
        hint: Art 43.
        answer: Member states' — art 43 was never implemented, so the Council authorises coalitions of states, or regional organisations under art 53.
      - ask: What words should you look for in the resolution?
        hint: Res 678.
        answer: An express Chapter VII authorisation, typically "all necessary means", tied to a stated purpose.
      - ask: What purposes have authorisations served besides reversing invasions?
        hint: Somalia, Libya, piracy.
        answer: Humanitarian relief in internal conflict (Res 794), protection of civilians (Res 1973, 1975), no-fly zones and embargoes (Res 1973), and repressing piracy (Res 1816).
      - ask: A state says a 1990 authorisation still covers its 2003 invasion. Is that enough?
        hint: Revived authorisation.
        answer: 'Most states and scholars said no: an authorisation should not be revived or implied from vaguer language such as "serious consequences".'
    elements:
      - name: Art 39 determination
        test: The Council has determined a threat to the peace, breach of the peace or act of aggression.
        authorities:
          - un-charter-art-39
      - name: Art 41 inadequate
        test: The Council considers non-forcible measures "would be inadequate or have proved to be inadequate".
        authorities:
          - un-charter-art-42
      - name: Express authorisation
        test: Acting under Chapter VII, the Council expressly authorises member states, a coalition or a regional organisation (art 53) — typically "all necessary means".
        authorities:
          - unsc-resolution-678
          - unsc-resolution-794
      - name: Within the stated purpose
        test: Force is authorised for a specific purpose — e.g. restoring Kuwait's sovereignty, a secure environment for humanitarian relief; otherwise art 2(4) applies.
        authorities:
          - un-charter-art-2-4
    what-if:
      - change: The resolution "demands" compliance and warns of "serious consequences" but never says "all necessary means".
        effect: No authorisation should be implied from that vaguer language; a state using force on it alone breaches art 2(4) unless another exception applies.
      - change: The Council authorises a regional organisation rather than a coalition of states.
        effect: 'Still lawful: the Council may authorise regional organisations to enforce its decisions (art 53, Chapter VIII), e.g. NATO in Libya, ECOWAS in Liberia.'
      - change: The authorisation is to protect civilians, but a state uses force to change the government.
        effect: The authorisation is for a specific purpose; force outside it is not covered by art 42 and falls back under the art 2(4) prohibition.
    boundary:
      - text: 'Somalia 1992 (Res 794): "all necessary means" for humanitarian relief in an internal conflict.'
        why: 'Inside art 42: an express Chapter VII authorisation, though the conflict was internal and the purpose humanitarian.'
      - text: 'Iraq 2003: invasion relying on Res 678, 687 and 1441.'
        why: 'Outside on the majority view: no express authorisation; the claimed revival was rejected by most Council and UN members and most legal scholars.'
    transfer:
      - scenario: Pirates seize ships off a collapsed state's coast. The Council finds a threat to the peace, says sanctions on the state would be pointless, and authorises co-operating states to use all necessary means to repress piracy there.
        answer: 'That is a valid art 42 authorisation: art 39 finding, art 41 judged inadequate (it need not be tried first), express "all necessary means" wording, and a stated purpose — as with Somalia 2008 (Res 1816). Co-operating states may use force only to repress piracy, within the mandate.'
    objections:
      - position: In 2003 the coalition argued Iraq's material breach of Res 687's ceasefire conditions revived the authority to use force under Res 678.
        evidence: The US letter of 20 March 2003 relied on Res 678 and 687, and on Res 1441's finding of material breach, "final opportunity" and warnings of "serious consequences".
        objection: Most other Council and UN members, and most legal scholars, rejected this. Res 1441 contained no authorising words; the UK's Chilcot inquiry found not all peaceful options had been exhausted.
    storyboard:
      - caption: '1990: Res 678 authorises force'
        detail: '"All necessary means" to restore Kuwait''s sovereignty — Operation Desert Storm.'
      - caption: '1991: Res 687 ceasefire conditions'
        detail: Iraq takes on extensive disarmament obligations as conditions of the ceasefire.
      - caption: '2002: Res 1441''s "final opportunity"'
        detail: Council finds Iraq in material breach and recalls warnings of "serious consequences" — but authorises nothing expressly.
      - caption: 'March 2003: coalition invades'
        detail: A US- and UK-led coalition, including Australia, claims a material breach revived Res 678's authority.
      - caption: The claim is rejected
        detail: Most Council and UN members and most scholars reject the revival; Chilcot later finds peaceful options not exhausted.
    sources:
      - Week 10 - Lecture Slides - Collective Security and International Organisations (slides 24–31)
      - 'Week 12 - Tutorial Revision Quiz Questions (Q17: art 41 v art 42 measures)'
