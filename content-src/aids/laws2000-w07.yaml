  - concept: laws2000-w07-breach-of-an-international-obligation
    plain: 'The first element is a breach: the state''s act or omission falls short of an international obligation that bound it when it acted. Treaty or custom, either counts; domestic law is irrelevant.'
    concrete: 'In October 1946 British warships entered the North Corfu Strait in Albanian waters, a passage swept for mines in 1944 and check-swept in 1945. Two ships struck mines: 45 officers and sailors died and 42 were wounded. Who laid the mines was never established — probably not Albania. But the mine-laying would have been visible from the coast, so Albania knew. Its breach was an omission: it failed to notify shipping and warn the approaching warships.'
    formal: A breach concerns a primary rule irrespective of its source (art 12 ARSIWA). The obligation must bind the state when the conduct occurs — no retroactivity (arts 13–14; Chagos Advisory Opinion, 2019). Several acts may together amount to a breach (art 15, composite acts). Conduct may be an act or an omission (art 2; Tehran; Corfu Channel, where Albania had to notify shipping and warn the British warships).
    terms:
      - term: breach by omission
        gloss: Failing to do what an obligation requires — e.g. Iran failing to protect the US embassy under the VCDR; Albania failing to warn of mines.
      - term: composite act (art 15)
        gloss: A series of acts that individually may not breach an obligation but together do — e.g. pollution that adds up over time.
      - term: no retroactivity (arts 13–14)
        gloss: A state breaches an obligation only if it was bound by it when the conduct occurred; becoming bound later does not reach back.
    misconceptions:
      - claim: If the state's own parliament authorised the conduct by statute, it cannot be a breach.
        tempting: Domestic authorisation looks like a complete defence.
        correction: 'Only international law decides whether there is a breach (art 12). The lecturer: we are not interested in whether domestic law allowed the conduct.'
      - claim: Once a state ratifies a treaty, it answers under it for its earlier conduct too.
        tempting: Ratification expresses consent to the whole treaty.
        correction: 'There is no retroactivity: the obligation must bind the state at the time of the conduct (arts 13–14; Chagos Advisory Opinion).'
      - claim: Albania was responsible in Corfu Channel because it laid the mines.
        tempting: Albania lost the case.
        correction: 'Who laid the mines remained conjecture — probably not Albania. It was responsible for its own omission: knowing of the minefield, it failed to notify shipping and warn the British warships.'
    socratic:
      - ask: British warships hit mines in Albanian waters that Albania probably did not lay. Where do you look for a breach?
        hint: Act or omission?
        answer: At Albania's own omission. Under art 2, conduct can consist of an act or an omission.
      - ask: What, according to the ICJ, was Albania obliged to do?
        hint: Corfu Channel, p 22.
        answer: Notify shipping in general of the minefield in its waters and warn the approaching British warships of the imminent danger.
      - ask: How could the Court conclude that Albania knew of the mines?
        hint: Two kinds of evidence.
        answer: Evidence of the Albanian Government's attitude, and the fact that the laying of the mines would have been visible from the Albanian coast.
      - ask: Would it matter whether the duty to warn came from custom rather than a treaty?
        hint: Art 12.
        answer: No. A breach concerns a primary rule of international law irrespective of its source — custom or treaty.
      - ask: Suppose the only treaty on point bound Albania from 1950. Could it breach that treaty in 1946?
        hint: Arts 13–14.
        answer: No. The state must be bound by the obligation when the conduct occurs; there is no retroactivity.
    elements:
      - name: An international obligation
        test: Identify a primary rule of international law — treaty, custom or a court decision the state must comply with. A domestic obligation does not count.
        authorities:
          - arsiwa-art-12
      - name: Binding at the time
        test: The state was under the obligation when the conduct occurred; no retroactivity.
        cases:
          - chagos-islands-case
        authorities:
          - arsiwa-arts-13-14
      - name: Conduct not in conformity
        test: An act, an omission, or a series of acts that together amount to a breach (composite act).
        cases:
          - united-states-diplomatic-and-consular-staff-in-tehran-united-states-of-america-v-iran
          - corfu-channel-case-united-kingdom-v-albania
        authorities:
          - arsiwa-art-2
          - arsiwa-art-15
    what-if:
      - change: The host state's police stand by while a crowd storms a foreign embassy.
        effect: 'A breach by omission, as in Tehran: the VCDR obliges the host state to protect the embassy, and its failure to do so is its own breach — even though the crowd''s acts are not themselves the state''s.'
      - change: Each monthly discharge into a shared river is small, but over two years the river is badly degraded.
        effect: 'Consider art 15: one or two discharges may not breach the obligation, but taken together they can amount to a composite breach.'
      - change: The obligation is in a treaty the state ratified after the conduct.
        effect: 'No breach of that treaty: arts 13–14 require the obligation to bind the state at the time. Check whether a customary rule bound it then instead.'
    boundary:
      - text: A state fails to comply with a decision of the ICJ.
        why: 'Can engage responsibility: the lecturer says court decisions also matter, and non-compliance could breach an international obligation.'
      - text: A state adopts a policy other states strongly dislike but breaches no obligation it has accepted.
        why: 'Outside: responsibility needs a breach of an international obligation; diplomatic disapproval alone is not enough.'
    transfer:
      - scenario: Unknown saboteurs plant explosives under a bridge on State A's border, used by State B's trucks. A's border guards see it happen and say nothing; a B convoy is destroyed.
        answer: Who planted the explosives may never be known; A's breach is its own omission (art 2). On Corfu Channel reasoning, a state that knows of a danger in its territory may be obliged to warn, and may not knowingly allow its territory to be used for acts contrary to other states' rights. The guards are organs (art 4); the duty must have bound A at the time (arts 13–14).
    sources:
      - Week 07 - Lecture Slides - State Responsibility (slides 7–9)
      - 'Week 07 - Lecture Recording (Live) - State Responsibility - Full Transcript (11:00–19:00: any source, international not domestic, ICJ decisions, no retroactivity, composite acts, omission in Tehran and Corfu Channel)'
    verify: false
  - concept: laws2000-w07-attribution-to-the-state
    plain: Conduct counts as the state's when done by its organs, by bodies the law empowers to exercise governmental authority, by organs lent to it, or by others it directs, controls or later adopts.
    concrete: 'Students stormed the US embassy in Tehran and took hostages. They were not Iran''s organs, and the government itself had not attacked the embassy. But afterwards Iran issued a decree supporting what the students had done, endorsed it in public statements, and supported keeping the hostages. By acknowledging and adopting the students'' conduct as its own, Iran made it its own: the occupation was attributed to Iran under art 11.'
    formal: ARSIWA chapter III (arts 4–11). Organs of any branch or level, per internal law (art 4) — exceptionally de facto organs in "complete dependence" (Genocide case, paras 392–393). Entities empowered by law to exercise governmental authority, acting in that capacity (art 5); lent organs (art 6); ultra vires conduct (art 7; Velásquez Rodríguez); instructions, direction or control (art 8); successful insurgents (art 10); adoption (art 11).
    analogy:
      text: An employer answers for staff doing their jobs, even when they break the rulebook; for an outside contractor only if it ordered and steered that very job; for a stranger only if it later says, "That was us."
      maps:
        - from: staff doing their jobs
          to: organs and empowered entities acting in that capacity (arts 4–5)
        - from: even when they break the rulebook
          to: ultra vires conduct (art 7)
        - from: a contractor it ordered and steered
          to: instructions or effective control (art 8)
        - from: '"That was us"'
          to: acknowledgement and adoption (art 11)
      limits:
        - Organ status follows the state's internal law (art 4(2)), not an employment contract — and only exceptionally a body's real dependence.
        - 'There is no general rule that a state answers for its nationals: in principle it answers only for its own conduct.'
    terms:
      - term: state organ (art 4)
        gloss: Any person or entity with that status under internal law — legislative, executive, judicial or other, central or territorial (e.g. an Australian state's police).
      - term: de facto organ
        gloss: An entity not an organ under internal law but acting in "complete dependence" on the state, merely its instrument. Exceptional (Genocide case, paras 392–393).
      - term: ultra vires (art 7)
        gloss: Conduct exceeding authority or contravening instructions. Still attributed if the organ or entity acted in that capacity (Velásquez Rodríguez).
      - term: acknowledgement and adoption (art 11)
        gloss: Conduct not otherwise attributable becomes the state's if and to the extent it acknowledges and adopts it as its own — e.g. Iran's decree in Tehran.
    misconceptions:
      - claim: If soldiers disobey express orders, their conduct is private and not the state's.
        tempting: They defied the state, so they were not acting for it.
        correction: 'Art 7: conduct of an organ acting in that capacity is attributed "even if it exceeds its authority or contravenes instructions" (Velásquez Rodríguez, para 170).'
      - claim: Once an entity is empowered under art 5, everything it does is the state's.
        tempting: Legal empowerment seems to be the whole link.
        correction: Art 5 also requires the entity to be acting in that capacity in the particular instance. An airline's border-check role does not make its commercial flights governmental.
      - claim: A militia the state funds or trains is automatically a de facto organ.
        tempting: Funding suggests a very close link.
        correction: De facto organ status needs "complete dependence", making the entity merely the state's instrument, and is exceptional (Genocide case, paras 392–393).
    socratic:
      - ask: Police of an Australian state torture a foreign national. Whose conduct is it under international law?
        hint: Art 4 — territorial units.
        answer: Australia's. Art 4 attributes the conduct of any state organ, whether of the central government or a territorial unit, whatever its position.
      - ask: By statute a private company runs an immigration detention centre, and its guards mistreat detainees. Which article?
        hint: Not an organ, but empowered by law.
        answer: 'Art 5: the company is empowered by the state''s law to exercise elements of governmental authority, and the guards act in that capacity.'
      - ask: The guards ignored company rules forbidding force. Does that break attribution?
        hint: Art 7.
        answer: No. Conduct is still attributed if the entity acts in that capacity, even if it exceeds its authority or contravenes instructions.
      - ask: Rebels commit abuses, then win the civil war and form the new government. Is the state responsible?
        hint: Art 10(1).
        answer: 'Yes: the conduct of an insurrectional movement which becomes the new government is an act of that state. Had they lost, a good-faith state would not answer for them.'
      - ask: Students with no link to the state seize an embassy; the government then issues a decree approving the occupation. Which route?
        hint: After the fact.
        answer: 'Art 11: the state acknowledges and adopts the conduct as its own, as Iran did in Tehran.'
    elements:
      - name: Organ (art 4)
        test: An organ of any branch or level under internal law; exceptionally a de facto organ acting in complete dependence on the state.
        cases:
          - application-of-the-genocide-convention-bosnia-and-herzegovina-v-serbia-and-montenegro
        authorities:
          - arsiwa-art-4
      - name: Governmental authority (art 5)
        test: Not an organ, but empowered by the state's law to exercise elements of governmental authority, and acting in that capacity in the particular instance.
        authorities:
          - arsiwa-art-5
      - name: Lent organ (art 6)
        test: An organ placed at the state's disposal by another state, exercising the receiving state's governmental authority.
        authorities:
          - arsiwa-art-6
      - name: Ultra vires (art 7)
        test: An organ or art 5 entity acting in that capacity is attributed even if it exceeds its authority or contravenes instructions.
        cases:
          - velasquez-rodriguez-v-honduras
        authorities:
          - arsiwa-art-7
      - name: Instructions or control (art 8)
        test: A private person or group acting on the state's specific instructions, or under its effective control of the operation.
        cases:
          - nicaragua-v-united-states-of-america
          - application-of-the-genocide-convention-bosnia-and-herzegovina-v-serbia-and-montenegro
        authorities:
          - arsiwa-art-8
      - name: Insurgency or adoption (arts 10–11)
        test: A movement that becomes the new government or forms a new state; or conduct the state acknowledges and adopts as its own.
        cases:
          - united-states-diplomatic-and-consular-staff-in-tehran-united-states-of-america-v-iran
        authorities:
          - arsiwa-art-10
          - arsiwa-art-11
    what-if:
      - change: The New Zealand police sent to Australia stay under New Zealand's orders, not Australia's.
        effect: Art 6 needs the lent organ to act in the exercise of the receiving state's governmental authority, under its control. If New Zealand still directs them, their conduct stays New Zealand's under art 4.
      - change: The rebel movement is defeated, and the state fought it in good faith throughout.
        effect: 'Not attributable: the lecturer says a good-faith state is not accountable for insurgents. Art 10 applies only if the movement becomes the new government or establishes a new state.'
      - change: Iran had merely expressed sympathy for the students, without endorsing or continuing the occupation.
        effect: Art 11 needs the state to acknowledge and adopt the conduct "as its own". Sympathy alone falls short; Iran's decree and support for keeping the hostages went much further.
    boundary:
      - text: State A helps State B breach an obligation they both owe (art 16).
        why: 'A is not given B''s whole breach: the lecturer says the aiding state answers only for the part relating to the aid it gave.'
      - text: State A coerces State B into breaching an obligation (art 18).
        why: The coerced state's conduct is attributed to the coercing state, which is held responsible for it.
    transfer:
      - scenario: A state's law authorises a private company to run passport checks at its land border. A company officer, told never to detain anyone, locks a foreign traveller in a cell for three days.
        answer: 'Attributable to the state. The company is not an organ, but it is empowered by law to exercise elements of governmental authority — border control — and the officer acted in that capacity (art 5). That he contravened instructions does not matter: art 7 attributes ultra vires conduct of an art 5 entity acting in that capacity (Velásquez Rodríguez).'
    sources:
      - Week 07 - Lecture Slides - State Responsibility (slides 8, 10–14, 19–21)
      - 'Week 07 - Lecture Recording (Live) - State Responsibility - Full Transcript (19:00–31:00: general rule, art 4 organs and de facto organs, art 5, art 6, art 7 and Velásquez Rodríguez; 38:00–44:00: insurgents, art 11 and Tehran, arts 16–18)'
    verify: false
  - concept: laws2000-w07-effective-control-and-private-conduct
    plain: Under art 8, private people's conduct is the state's only if the state instructed that very conduct or effectively controlled the operation in which it happened. Funding, training and arming a group is not enough.
    concrete: 'After the Sandinista regime took power in Nicaragua, the US cut relations, stopped aid and backed the contras, a paramilitary group trying to overthrow it. The US financed, trained, supplied and equipped them and helped identify their targets. Yet the ICJ (1986) held that even this "preponderant or decisive" participation did not make the contras'' violations America''s: the US would need effective control of the operations in which the violations were committed.'
    formal: 'Art 8 ARSIWA: conduct is the state''s if the person or group "is in fact acting on the instructions of, or under the direction or control of, that State in carrying out the conduct". Nicaragua (ICJ 1986, para 115): effective control of the operations in which violations occurred. Tadić (ICTY 1999, para 117) proposed overall control; the Genocide case (ICJ 2007) rejected it and applied effective control as custom.'
    analogy:
      text: A puppeteer answers for the puppet's moves only if her hand is on the strings during that scene. Having built, painted and paid for the puppet is not enough.
      maps:
        - from: the puppeteer
          to: the state
        - from: the puppet
          to: the private person or group
        - from: hand on the strings during that scene
          to: instructions for, or effective control of, the specific operation
        - from: building, painting, paying
          to: financing, training, supplying, equipping (Nicaragua)
      limits:
        - A puppet has no will of its own. A group that truly has none — complete dependence — may be a de facto organ under art 4, a separate and exceptional test.
    terms:
      - term: effective control
        gloss: The state's control over the specific operation in the course of which the violation was committed (Nicaragua, para 115). A very high threshold.
      - term: overall control
        gloss: 'The ICTY''s less demanding test in Tadić (1999): control may vary with the circumstances. Rejected by the ICJ for state responsibility in 2007.'
      - term: instructions (art 8)
        gloss: Very specific instructions relating to the very conduct in breach and to each operation — not general or vague directions.
    misconceptions:
      - claim: Preponderant or decisive funding and training of a group makes its acts the state's.
        tempting: The support is what made the group effective.
        correction: 'Nicaragua: even preponderant or decisive participation in financing, training, supplying, equipping and choosing targets was insufficient; effective control of the operations was required (para 115).'
      - claim: Since Tadić, overall control is the test for attributing private conduct.
        tempting: Tadić (1999) came after Nicaragua (1986).
        correction: 'The ICJ in the Genocide case (2007) rejected overall control — it "stretches too far, almost to breaking point" the link to the state — and applied effective control: the law as it stands now.'
      - claim: General instructions, such as to overthrow a government, satisfy the instructions limb.
        tempting: They show the group is serving the state's aims.
        correction: Instructions must be very specific, relating to the very conduct in breach and to each operation — not general and vague (lecture; Nicaragua; Genocide case).
    socratic:
      - ask: A state funds, trains and arms a rebel group abroad and helps choose its targets. The rebels massacre villagers. Is the massacre the state's?
        hint: Nicaragua, para 115.
        answer: Not on that alone. In Nicaragua such support, even preponderant or decisive, was insufficient for attribution under art 8.
      - ask: What more must be proved?
        hint: Look at the operation, not the group.
        answer: Specific instructions for that very attack, or effective control of the operation in the course of which the massacre was committed.
      - ask: Couldn't a lower "overall control" test apply instead?
        hint: Tadić, then 2007.
        answer: 'The ICTY proposed it in Tadić (1999), but the ICJ rejected it in the Genocide case (2007): it broadens responsibility beyond the principle that a state answers only for its own conduct.'
      - ask: Why, says the lecturer, did this question come to the fore after 9/11?
        hint: Al-Qaeda and Afghanistan.
        answer: Al-Qaeda operated mostly from Afghanistan under the Taliban. Could Afghanistan be responsible for its attacks? Under art 8 that needs instructions or effective control — a very high threshold.
      - ask: A defence ministry orders a hired militia to attack a named village on a set date and directs the attack in real time. Result?
        hint: Both limbs.
        answer: 'Attributable under art 8: specific instructions for the operation and effective control while it was carried out.'
    elements:
      - name: A private person or group
        test: The actor is neither an organ (art 4) nor an empowered entity (art 5); otherwise use those routes.
        authorities:
          - arsiwa-art-8
      - name: Instructions
        test: Very specific instructions relating to the very conduct in breach, for each operation — not general and vague.
        cases:
          - nicaragua-v-united-states-of-america
          - application-of-the-genocide-convention-bosnia-and-herzegovina-v-serbia-and-montenegro
        authorities:
          - arsiwa-art-8
      - name: Or direction and control
        test: Effective control over the operation in the course of which the violation was committed; direction and control are now assessed together.
        cases:
          - nicaragua-v-united-states-of-america
          - application-of-the-genocide-convention-bosnia-and-herzegovina-v-serbia-and-montenegro
        authorities:
          - arsiwa-art-8
      - name: Not overall control
        test: Overall control of the group (Tadić) is not enough for state responsibility; effective control reflects customary law in art 8.
        cases:
          - prosecutor-v-dusko-tadic
          - application-of-the-genocide-convention-bosnia-and-herzegovina-v-serbia-and-montenegro
    what-if:
      - change: The question arises in an international criminal tribunal, not the ICJ.
        effect: In Tadić the ICTY said the degree of control may vary, and a less demanding overall control test suits areas like international humanitarian and criminal law. For state responsibility the ICJ still applies effective control.
      - change: The group is shown to act in "complete dependence" on the state, merely its instrument.
        effect: It may then be a de facto organ under art 4 (Genocide case, paras 392–393), and its conduct is the state's as an organ's — but such a finding is exceptional.
      - change: The state neither instructed nor controlled the attack, but afterwards publicly endorsed it and protected the perpetrators.
        effect: Art 8 still fails, but art 11 may attribute the conduct if and to the extent the state acknowledges and adopts it as its own (as Iran did in Tehran).
    boundary:
      - text: 'Nicaragua: the US-backed contras.'
        why: 'Out: financing, organising, training, supplying, equipping and choosing targets were insufficient without effective control of the operations (para 115).'
      - text: A hired militia ordered to attack a named village and directed in real time.
        why: 'In: specific instructions for, and effective control over, that operation satisfy art 8.'
    storyboard:
      - caption: Nicaragua sets a high bar (1986)
        detail: 'ICJ: US support for the contras, even preponderant or decisive, is insufficient; effective control of the operations is required (para 115).'
      - caption: Backlash
        detail: Many found the threshold too difficult to meet.
      - caption: Tadić lowers the bar (1999)
        detail: 'ICTY Appeals Chamber: the degree of control may vary; overall control suffices, suited to humanitarian and criminal law (para 117).'
      - caption: ICJ restores effective control (2007)
        detail: 'Genocide case: overall control stretches the link "almost to breaking point"; effective control, reflecting custom in art 8, is the law as it stands now.'
    transfer:
      - scenario: State A pays a private hacking group a monthly retainer and supplies its tools. The group, choosing its own targets, shuts down State B's hospital network.
        answer: Not attributable to A under art 8 on these facts. Funding and equipping, even if decisive, is insufficient (Nicaragua). B must show A gave specific instructions for this attack or had effective control of the operation; overall control will not do (Genocide case). If A later acknowledged and adopted the attack as its own, art 11 could apply.
    sources:
      - Week 07 - Lecture Slides - State Responsibility (slides 15–18)
      - 'Week 07 - Lecture Recording (Live) - State Responsibility - Full Transcript (30:00–38:00: private conduct and 9/11, instructions, direction and control, Nicaragua, Tadić, Genocide case; 44:00–47:00: use the ARSIWA commentaries for art 8)'
