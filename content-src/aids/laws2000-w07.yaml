unit: laws2000
week: 7
source: raw/laws2000-pil/week-07
generator: aids-1
aids:
  - concept: laws2000-w07-framework-of-state-responsibility
    plain: 'A state is internationally responsible when conduct attributable to it — an act or an omission — breaches an international obligation it owes. Responsibility brings consequences: stop the wrong and repair it.'
    concrete: 'The lecturer''s examples of primary rules are the prohibition on using force against another state, or a treaty on the good management of shared water. Those rules say what states must do. State responsibility is the second layer: it tells you when a state has breached such a rule and what follows. In the tutorial, DFAT''s lawyers advising on a pandemic convention walk that path — obligation, breach, attribution, excuses, who may invoke, consequences.'
    formal: 'Art 1 ARSIWA: "every internationally wrongful act of a State entails its international responsibility". Art 2: an internationally wrongful act exists when conduct consisting of an act or omission is attributable to the state and constitutes a breach of an international obligation owed by it. ARSIWA (ILC, adopted 10 August 2001) is not binding, but many articles appear to codify customary international law.'
    analogy:
      text: A sport's rulebook says what players may not do. A separate referee's code says when a foul has happened, whose player committed it, which excuses count, and what the penalty is.
      maps:
        - from: the rulebook
          to: primary rules in treaty and custom (e.g. non-use of force)
        - from: the referee's code
          to: the secondary rules of state responsibility in ARSIWA
        - from: whose player committed it
          to: attribution (arts 4–11)
        - from: the penalty
          to: cessation and reparation (arts 30–31)
      limits:
        - 'There is no referee: no central body automatically detects and penalises breaches. Responsibility arises from the wrongful act itself (art 1) and is invoked by states (arts 42, 48).'
    terms:
      - term: primary rule
        gloss: A substantive obligation found in treaty, custom or general principles — e.g. the prohibition on using force. It says what a state must or must not do.
      - term: secondary rule
        gloss: 'A rule of state responsibility: it determines when a primary obligation has been breached by a state and the legal consequences of that breach.'
      - term: internationally wrongful act
        gloss: Conduct (act or omission) attributable to a state that breaches its international obligation (art 2). Covers crime-like and tort-like wrongs alike.
      - term: ARSIWA
        gloss: The ILC's Articles on Responsibility of States for Internationally Wrongful Acts, adopted 10 August 2001. Not a treaty and not binding as such; many articles reflect custom.
    misconceptions:
      - claim: ARSIWA binds states as treaty law because it was adopted in 2001.
        tempting: It is cited article by article, just like a treaty.
        correction: 'It was adopted by the ILC''s commissioners, not by states: it is not a treaty and not binding as such. It matters because many articles appear to codify customary international law, which does bind.'
      - claim: An internationally wrongful act needs harm to another state and fault by the responsible state.
        tempting: Domestic tort law asks about damage and fault.
        correction: 'Art 2 names only two elements: conduct attributable to the state, and a breach of an international obligation. The type of damage matters later, for the form of reparation.'
      - claim: State responsibility rules are 'secondary' because they rank below treaties and custom as sources.
        tempting: '''Secondary'' sounds like a lower rank in art 38.'
        correction: 'The label is functional: primary rules set substantive obligations; secondary rules determine when they are breached and with what consequences. State responsibility presupposes a primary rule.'
    socratic:
      - ask: Australia asks whether another party has breached the pandemic Convention. What is the first question?
        hint: Step 1.
        answer: What primary obligation binds that state — here the Convention's articles, such as art 21 on access to vaccines. State responsibility rules are secondary and need a primary rule to work on.
      - ask: Is a breach on the face of the facts enough to make a state responsible?
        hint: Art 2 has two elements.
        answer: No. The conduct must also be attributable to the state. In principle a state answers only for its own conduct, so the prima facie breach must be linked to it.
      - ask: The breach is attributable. Is the state now necessarily responsible?
        hint: Step 4.
        answer: 'Not yet: check whether a circumstance precluding wrongfulness (arts 20–25) applies, such as consent, countermeasures or force majeure.'
      - ask: If no ground applies, what follows, and who may complain?
        hint: Step 5.
        answer: Cessation and non-repetition (art 30) and full reparation (art 31). The injured state may invoke responsibility (art 42); non-injured states only in limited cases (art 48).
      - ask: A foreign ministry says ARSIWA "is just an ILC document, so nothing in it binds us". Reply?
        hint: Custom.
        answer: It is not a treaty and is not binding as such, but many of its articles appear to codify customary international law — courts including the ICJ have said so — and custom binds the state.
    elements:
      - name: Primary legal obligation
        test: 'Identify the substantive rule binding the state: treaty law, customary international law or general principles.'
      - name: Prima facie breach
        test: On the given facts, does the conduct — act, omission or composite of acts — breach that obligation, which must bind the state at the time?
        authorities:
          - arsiwa-art-12
          - arsiwa-arts-13-14
          - arsiwa-art-15
      - name: Attribution to a state
        test: 'Is the conduct the state''s: an organ, an empowered entity, a lent organ, ultra vires conduct, instructions or effective control, a successful insurgency, or adoption (arts 4–11)?'
        authorities:
          - arsiwa-art-4
          - arsiwa-art-8
          - arsiwa-art-11
      - name: Grounds precluding wrongfulness
        test: Consent, self-defence, countermeasures, force majeure, distress, necessity (arts 20–25). None excuses breach of a peremptory norm (art 26).
        authorities:
          - arsiwa-art-20
          - arsiwa-art-25
          - arsiwa-art-26
      - name: Consequences and invocation
        test: Cessation and non-repetition (art 30); full reparation (art 31). Invoked by the injured state (art 42) or, in limited cases, others (art 48).
        authorities:
          - arsiwa-art-30
          - arsiwa-art-31
          - arsiwa-art-42
          - arsiwa-art-48
    what-if:
      - change: The only obligation the state broke is in its own constitution.
        effect: 'No internationally wrongful act: art 12 looks only at international obligations, and whether domestic law allowed or forbade the conduct is irrelevant. Step 1 fails.'
      - change: The conduct was by a private company with no link to the state.
        effect: The breach may be clear, but step 3 fails unless an attribution route applies — empowerment by law (art 5), instructions or effective control (art 8), or adoption (art 11). States answer in principle for their own conduct.
      - change: The wrongdoer is an international organisation, not a state.
        effect: 'ARSIWA does not apply directly: it concerns states only. The lecturer notes a separate, almost copied set of draft articles for international organisations.'
    boundary:
      - text: A breach of WTO trade obligations.
        why: Governed by a specialised (lex specialis) regime monitored by its own bodies; this week's general regime of state responsibility is not that regime.
      - text: A crime-like wrong, such as genocide by a state.
        why: 'Still an ''internationally wrongful act'': international law draws no distinction between criminal and tort-like wrongs for state responsibility.'
    transfer:
      - scenario: Three states sign a treaty to share river-flow data daily. During a drought, State A's water agency — empowered by statute to manage the nation's rivers — stops sending the data.
        answer: 'Step 1: the treaty obligation to share data. Step 2: stopping is a prima facie breach by omission. Step 3: the agency is empowered by law to exercise governmental authority and acted in that capacity (art 5). Step 4: test only the grounds the facts raise — perhaps necessity (art 25), read narrowly. Step 5: otherwise cessation and reparation (arts 30–31), invoked by the injured parties (art 42).'
    sources:
      - Week 07 - Lecture Slides - State Responsibility (slides 4–6, 37)
      - 'Week 07 - Lecture Recording (Live) - State Responsibility - Full Transcript (03:00–11:00: legal meaning of state responsibility, primary and secondary rules, general regime, ILC and ARSIWA, two elements, no crime/tort distinction; 46:00–50:00: commentaries and state views)'
      - 'Week 07 - Lecture Recording (Online) - State Responsibility - Full Transcript (37:00–40:00: the five-step graphic)'
      - Week 07 - Tutorial Task - State Responsibility (questions 1–6)
