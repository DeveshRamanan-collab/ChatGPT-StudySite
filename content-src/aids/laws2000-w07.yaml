  - concept: laws2000-w07-cessation-and-reparation
    plain: A state that commits a wrongful act must stop it, give assurances it won't recur where needed, and fully repair the harm — by giving back, paying, or acknowledging the wrong.
    concrete: 'In 2004 the ICJ found Israel''s construction of a wall in the Occupied Palestinian Territory internationally wrongful. The consequences came in two layers. Cessation: Israel had to stop building, dismantle the portions already built, and offer appropriate assurances and guarantees of non-repetition. Reparation: it had to compensate the natural and legal persons affected by the construction — returning land or paying for the damage.'
    formal: 'Art 30 ARSIWA: the responsible state must (a) cease the act, if continuing, and (b) offer appropriate assurances and guarantees of non-repetition, if circumstances so require. Art 31: full reparation for the injury, material or moral. Factory at Chorzów (PCIJ 1928): reparation must, as far as possible, wipe out all the consequences of the illegal act. Forms: restitution (art 35), compensation (art 36), satisfaction (art 37).'
    analogy:
      text: You knock down a neighbour's fence. Stop leaning on it and promise not to again; stand it back up; if it is smashed, pay for a new one; and apologise for the upset.
      maps:
        - from: stop and promise not to again
          to: cessation and non-repetition (art 30)
        - from: stand it back up
          to: restitution in kind (art 35)
        - from: pay for a new one
          to: compensation for financially assessable loss (art 36)
        - from: apologise for the upset
          to: satisfaction for moral damage (art 37)
      limits:
        - Between neighbours an apology is courtesy; in international law satisfaction is a legal form of reparation, and can be a court's judgment declaring the conduct wrongful.
    terms:
      - term: restitution (art 35)
        gloss: 'Reparation in kind: re-establishing the prior situation, e.g. returning property.'
      - term: compensation (art 36)
        gloss: Usually money where restitution is not possible; covers material, financially assessable damage — not moral damage.
      - term: satisfaction (art 37)
        gloss: 'Repairs moral damage: an apology, an expression of regret, or a court''s judgment declaring the conduct wrongful.'
      - term: moral damage
        gloss: Non-material injury, such as an affront to a state's dignity. Part of 'injury' under art 31(2); repaired by satisfaction.
    misconceptions:
      - claim: Reparation punishes the wrongdoing state in proportion to its fault.
        tempting: Large damages can feel punitive.
        correction: 'Chorzów: reparation restores. It must, as far as possible, wipe out the consequences and re-establish the situation that would in all probability have existed.'
      - claim: Compensation can repair any injury, including moral damage.
        tempting: Money seems able to price any harm.
        correction: Compensation covers only material damage that is financially assessable. Moral damage is repaired through satisfaction (art 37).
      - claim: Assurances of non-repetition are owed in every case.
        tempting: Non-repetition sounds universal.
        correction: Art 30(b) requires them only "if circumstances so require"; cessation under art 30(a) applies where the act is continuing.
    socratic:
      - ask: State G unlawfully seizes State H's cultural artefact and still holds it undamaged. What comes first?
        hint: Is the wrong continuing?
        answer: 'Cessation: the continuing wrong must stop (art 30(a)), with assurances of non-repetition if circumstances so require (art 30(b)).'
      - ask: Which form of reparation fits the artefact?
        hint: In kind.
        answer: 'Restitution (art 35): return it, re-establishing the situation that would have existed.'
      - ask: And if the artefact was destroyed while G held it?
        hint: Restitution is impossible.
        answer: Compensation (art 36), usually money for the financially assessable material loss. The duty of full reparation does not lapse.
      - ask: H was also humiliated by the seizure. How is that repaired?
        hint: Moral damage.
        answer: 'Satisfaction (art 37): an apology, an expression of regret, or a judgment declaring the conduct wrongful.'
      - ask: What measures the whole package?
        hint: Chorzów.
        answer: 'Full reparation: as far as possible, wipe out all the consequences of the act and re-establish the situation that would, in all probability, have existed.'
    elements:
      - name: Cessation (art 30(a))
        test: If the wrongful act is continuing, the responsible state must cease it.
        cases:
          - construction-of-a-wall-advisory-opinion
        authorities:
          - arsiwa-art-30
      - name: Non-repetition (art 30(b))
        test: Appropriate assurances and guarantees of non-repetition, if circumstances so require.
        cases:
          - construction-of-a-wall-advisory-opinion
        authorities:
          - arsiwa-art-30
      - name: Full reparation (art 31)
        test: Repair all injury, material or moral; wipe out the consequences of the illegal act.
        cases:
          - factory-at-chorzow
        authorities:
          - arsiwa-art-31
      - name: The right form (arts 35–37)
        test: Restitution in kind; compensation for financially assessable loss where restitution is impossible; satisfaction for moral damage.
        cases:
          - chagos-islands-case
        authorities:
          - arsiwa-arts-35-37
    what-if:
      - change: The breach was a one-off act that has already ended.
        effect: Nothing to cease under art 30(a); assurances of non-repetition only if circumstances so require. Full reparation for the injury caused is still owed (art 31).
      - change: A circumstance precluding wrongfulness, such as necessity, is established.
        effect: 'There is no internationally wrongful act, so the consequences in arts 30–31 do not arise: they follow only where no ground precludes wrongfulness.'
      - change: The only harm is an affront to the injured state's dignity, with no financial loss.
        effect: Satisfaction (art 37) — an apology, expression of regret, or declaratory judgment — because compensation covers only financially assessable material damage.
    boundary:
      - text: Chagos advisory opinion (2019).
        why: 'The consequence was ending a continuing wrong: the UK had to end its administration of the archipelago and return it to Mauritius as rapidly as possible.'
      - text: A court's judgment declaring the conduct wrongful, with no payment.
        why: 'Can itself be satisfaction: the lecture lists a judgment stating the conduct was wrongful as a form of satisfaction for moral damage.'
    storyboard:
      - caption: Detachment before independence (1965)
        detail: The UK agrees with Mauritius to detach the Chagos Archipelago, within negotiations about Mauritius's independence.
      - caption: A base and deportations
        detail: The UK declares a new British territory and leases one of the largest islands to the US for a military base; inhabitants are deported and prevented from returning.
      - caption: The General Assembly asks (2017)
        detail: The UN General Assembly requests an advisory opinion from the ICJ.
      - caption: Wrongful; end it (2019)
        detail: 'The ICJ finds the UK''s continued administration an internationally wrongful act: it must end the administration and return the islands to Mauritius as rapidly as possible.'
    transfer:
      - scenario: State A's army occupies a strip of State B's farmland for a year, ruining crops, and flies A's flag over B's border town to mock it. A has now withdrawn.
        answer: 'The wrong has ended, so cessation is spent; assurances of non-repetition only if circumstances require (art 30(b)). Full reparation (art 31; Chorzów): restitution of anything still held (art 35); compensation for the financially assessable crop losses (art 36); satisfaction — apology, regret or a declaratory judgment — for the moral injury of the flag (art 37).'
    sources:
      - Week 07 - Lecture Slides - State Responsibility (slides 33–35)
      - 'Week 07 - Lecture Recording (Online) - State Responsibility - Full Transcript (27:00–35:00: cessation and non-repetition, the Wall, art 31 and Chorzów, restitution, compensation and satisfaction, Wall and Chagos as examples)'
