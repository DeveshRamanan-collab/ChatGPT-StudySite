unit: mgmt2094
week: 11
source: raw/mgmt2094-sci/week-11
generator: aids-1
aids:
  - concept: mgmt2094-w11-types-of-innovation
    plain: 'Innovation is not only big breakthroughs; small improvements count too. The lecture names seven types: product, process, organisational, management, production, commercial/marketing and service.'
    concrete: 'The lecturer''s example of product innovation is a familiar puzzle adapted: take a regular Rubik''s cube, add Braille, and people with vision impairment can use it too. He stresses that such improvements to an existing product happen far more often than completely new products, which are very difficult for any organisation to develop. A new smartphone model with a better camera and higher resolution is the same kind of improvement.'
    formal: 'Slide 2: ''Industrial innovation doesn''t include only major (radical) innovation, but also minor (incremental) technological advances.'' Product (a Braille Rubik''s cube); process (a new manufacturing process, such as online recruiting); organisational (a new venture division; a new accounting procedure); management (TQM); production (quality circles; JIT); commercial/marketing (guerrilla marketing campaigns); service (internet-based financial services).'
    terms:
      - term: radical innovation
        gloss: 'A major advance, such as a completely new product: very difficult for any organisation, and far less frequent than incremental advances.'
      - term: incremental innovation
        gloss: A minor technological advance that improves on what exists, like the Braille Rubik's cube. Slide 2 counts it as industrial innovation.
      - term: process innovation
        gloss: Improving the processes used inside the company, such as manufacturing or online recruiting in HR. Mostly internal, so less noticeable, but can be very substantial.
      - term: service innovation
        gloss: Changing how the customer is served, as internet-based financial services ease the way customers use a bank's services.
    elements:
      - name: Radical or incremental?
        test: Is it a major breakthrough, such as a completely new product, or a minor advance on something that exists? Both count.
      - name: Product
        test: Is it a new or improved product? The Braille Rubik's cube.
        authorities:
          - mgmt2094-example-braille-rubiks-cube
      - name: Process
        test: Is a process used inside the firm new, such as a manufacturing process or online recruiting in HR?
      - name: Organisational
        test: 'Is the organisation''s structure or a procedure new: a new venture division, a new accounting procedure?'
      - name: Management
        test: Is it a new approach to managing, such as Total Quality Management (TQM)?
      - name: Production
        test: Is it a new production system, such as quality circles or just in time (JIT)?
      - name: Commercial/marketing
        test: Is it a new way of promoting, such as a guerrilla marketing campaign?
      - name: Service
        test: Does it change how the customer is served, such as internet-based financial services?
    misconceptions:
      - claim: Only radical breakthroughs count as innovation.
        tempting: Breakthroughs are what we picture when we hear the word.
        correction: 'Slide 2: industrial innovation includes minor (incremental) technological advances, and the lecturer says these happen far more often than completely new products.'
      - claim: Online recruiting is service innovation, because applicants are served online.
        tempting: The slides' service example is internet-based.
        correction: 'The slides list online recruiting under process innovation: it improves an internal HR process. Service innovation changes how the customer is served.'
      - claim: JIT and quality circles are management innovations.
        tempting: They are management ideas.
        correction: The slides file them under production innovation and keep management innovation for TQM; a new accounting procedure is organisational.
    socratic:
      - ask: 'A Braille Rubik''s cube: is it a new product or an improved one?'
        hint: A familiar puzzle.
        answer: 'An improved one: an incremental product innovation that lets people with vision impairment use an existing product.'
      - ask: Which happens more often, radical or incremental innovation?
        hint: The lecturer's comparison.
        answer: 'Incremental: improvements happen far more frequently than completely new products, which are very difficult for any organisation.'
      - ask: A hospital moves its hiring to online recruiting software. Patients never see it. Is it still innovation?
        hint: Inside the firm.
        answer: 'Yes: process innovation. The lecturer says it is mostly internal, so less noticeable, but it can be very substantial.'
      - ask: Why does the lecturer say 'technological' advances are not only about technology?
        hint: How you do business.
        answer: 'Because a firm can innovate within the organisation and in how it does business, not only in its product: hence the seven types.'
    what-if:
      - change: A bank's new internet system is used only by its own staff to process loans internally, not by customers.
        effect: 'The classification shifts from service to process innovation: an internal change to how work is done. On the slides, service innovation is about how the customer is served.'
    boundary:
      - text: A café chain introduces a new accounting procedure that tracks food waste store by store.
        why: 'Organisational, not process: the slides list ''a new accounting procedure'', with a new venture division, under organisational innovation.'
      - text: A guerrilla marketing campaign for an unchanged product.
        why: 'Commercial/marketing innovation, not product innovation: the product stays the same; what is new is how it is promoted.'
    transfer:
      - scenario: A regional library installs self-checkout kiosks for borrowers, reorganises into a new digital-services division, and runs a street-art campaign to attract teenagers.
        answer: 'The kiosks change how borrowers are served: service innovation, like internet-based financial services. The new division is organisational innovation, like a new venture division. The street-art campaign is commercial/marketing innovation, like a guerrilla campaign. Each is incremental rather than radical, and the lecture counts all three as innovation.'
    objections:
      - position: 'Real innovation is what customers can see: a brand-new product.'
        evidence: 'The lecturer says product innovation is the first type that comes to mind: it is what we think of when we say the word innovation.'
        objection: Slide 2 counts minor advances too, and six of the seven types are not new products. Process innovation is mostly internal and less noticeable, yet can be very substantial.
    sources:
      - Marketing - Week 11 - Lecture Materials - Innovation Models (slides 2)
      - Marketing - Week 09 - Lecture Transcript - Types and Models of Innovation, Reflective Writing (first half, the Week 11 material)
  - concept: mgmt2094-w11-views-of-innovation
    plain: 'The lecture sets out four views of where innovation comes from: social change (social deterministic), gifted individuals (individualistic), the firm''s own resources (resource-based) and market opportunities (market-based).'
    concrete: 'When Covid struck, the external environment changed very quickly and placed heavy demands on businesses: offerings, university teaching and work all moved online, and organisations had to find solutions for doing so. The slides use Covid and the increase of online offerings to illustrate the social deterministic school: when the external conditions are right, innovation will occur.'
    formal: 'Slide 3: popular views come mainly from Hollywood and Disney films such as Back to the Future. Social deterministic school: innovations result from external social factors, such as demographic and cultural change. Individualistic school: unique individual talents, so innovators are born; linked to serendipity. Resource-based innovation: the firm''s own resources provide the context (Starbucks). Market-based innovation: market conditions facilitate or constrain it (Share a Coke).'
    terms:
      - term: social deterministic school
        gloss: 'Innovations result from a combination of external social factors, such as demographic and cultural change: when conditions are right, innovation will occur.'
      - term: individualistic school
        gloss: Innovations result from unique individual talents, so innovators are born. The slides link it to serendipity.
      - term: resource-based innovation
        gloss: A firm's own resources provide the context for innovative activity, as Starbucks has innovated the style and type of coffee-based drinks it offers.
      - term: market-based innovation
        gloss: Market conditions provide the context that facilitates or constrains innovation, so the firm must recognise opportunities in the marketplace (Share a Coke).
    elements:
      - name: Social deterministic school
        test: Do external social factors, such as demographic or cultural change, explain the innovation? Covid and the increase of online offerings.
        authorities:
          - mgmt2094-example-covid-online-shift
      - name: Individualistic school
        test: Is the innovation credited to a person's unique, inborn talent? Linked to serendipity.
      - name: Resource-based innovation
        test: Did the firm's own resources provide the context? Starbucks' coffee-based drinks.
        authorities:
          - mgmt2094-example-starbucks
      - name: Market-based innovation
        test: Did market conditions open (or close) the opportunity, which the firm had to recognise? The Share a Coke campaign.
        authorities:
          - mgmt2094-example-share-a-coke
    misconceptions:
      - claim: Starbucks' new coffee drinks illustrate market-based innovation.
        tempting: New drinks respond to what buyers want.
        correction: 'The slides give Starbucks as resource-based innovation: the firm''s own resources provide the context. Their market-based example is Share a Coke.'
      - claim: The social deterministic school says innovators are born.
        tempting: Both views are called 'schools'.
        correction: 'That is the individualistic school. The social deterministic school credits external social factors such as demographic and cultural change: when conditions are right, innovation will occur.'
      - claim: Social determinism and market-based innovation are the same view, since both look outside the firm.
        tempting: Both point to outside conditions.
        correction: Social determinism points to social change such as demographics and culture; market-based innovation points to marketplace conditions and the firm actively recognising the opportunities they open.
    socratic:
      - ask: Covid moved teaching, work and services online. Who or what drove that innovation?
        hint: Inside or outside the firm?
        answer: 'External conditions: the social deterministic school says innovation occurs when external social factors make the conditions right.'
      - ask: Starbucks keeps innovating the style and type of its coffee-based drinks. What does the slide say made that possible?
        hint: What the firm holds.
        answer: 'Its own resources: resource-based innovation, where a firm''s resources provide the context for innovative activity.'
      - ask: Coca-Cola's Share a Coke campaign made each person feel special and unique. Which view?
        hint: An opportunity in the marketplace.
        answer: 'Market-based innovation: market conditions provide the context, and the firm must recognise the opportunities that arise.'
      - ask: Mark describes marketing as seeing a hole in the market and filling it with what people want, at a price they will pay. Which view fits?
        hint: Where does he look?
        answer: 'Market-based: he reads market conditions and fills the opportunity, rather than crediting inborn talent.'
    what-if:
      - change: Mark had credited his success to simply being born a designer.
        effect: 'That would be the individualistic school''s account. His own story points elsewhere: knowledge from a menswear business and about three years as PA in a recycled-timber furniture business, plus reading what the market wanted.'
    boundary:
      - text: Back to the Future and other Hollywood and Disney films.
        why: 'Popular views, not one of the four schools: the slides say films mainly shape popular views of innovation, and the lecturer adds that the influence runs both ways.'
      - text: A firm with deep cash reserves, laboratories and skilled staff develops a new product line in-house.
        why: 'Resource-based: the firm''s own resources provide the context for the innovation. Nothing here credits a born genius, social change or a gap in the market.'
    transfer:
      - scenario: A regional brewery starts canning non-alcoholic beer after more customers ask for it, using its existing brewing equipment and staff.
        answer: 'Two views compete. Market-based: market conditions created an opportunity the firm recognised, as with Share a Coke. Resource-based: its own equipment and staff provided the context, as with Starbucks. Say which the scenario stresses (here the customers'' requests point to market-based) and support it with the slide example.'
    objections:
      - position: Innovators are born, not made.
        evidence: 'The individualistic school: innovations result from unique individual talents, so innovators are born.'
        objection: The other three views locate innovation in social change, a firm's resources or market opportunities. Mark built his business on knowledge from earlier work, a truck and an eye for gaps in the market.
    sources:
      - Marketing - Week 11 - Lecture Materials - Innovation Models (slides 3)
      - Marketing - Week 09 - Lecture Transcript - Types and Models of Innovation, Reflective Writing (first half, the Week 11 material)
      - Marketing - Week 11 - Lecture Transcript - Guest Lecture, Business Founder (Mark)
  - concept: mgmt2094-w11-models-of-innovation
    plain: 'Three models describe how innovation happens: by chance recognised by an expert (serendipity), in a planned chain from science to market (linear), or from many streams combining with no clear start (simultaneous coupling).'
    concrete: 'Sadler-Smith, citing Cropley, recounts how the French physicist Becquerel discovered radioactivity through the chance coming together of uranium salts and photographic paper in a drawer. He could not have done so had he not already been immersed deeply in relevant research: Pasteur''s point that chance favours the prepared mind. The Week 11 slides quote the same aphorism to explain serendipity.'
    formal: 'Slide 4: serendipity is ''unexpected discovery, or could be seen as luck''; to recognise its significance you first need previous knowledge in the area (''chance favours the prepared mind'', Louis Pasteur). Linear models link science and technology to technological developments to the needs of the market. The simultaneous coupling model couples all the knowledge within those key components: ''the point here where innovation begins is not known''.'
    terms:
      - term: serendipity
        gloss: Unexpected discovery that can look like luck; recognising its significance needs previous knowledge in the area.
      - term: linear model
        gloss: A chain linking science and technology to technological developments to the needs of the market. The lecture's Fig 6.3 runs it through five stages and four gates.
      - term: simultaneous coupling
        gloss: All the knowledge in science, technology and market opportunity combined at once, so no one can say where the innovation began.
      - term: gate
        gloss: 'In Fig 6.3, a checkpoint between stages with its own output: project charter, business plan, launch and proposal, sanity check.'
    elements:
      - name: Idea generation → Gate 1
        test: Is the idea captured in a project charter?
      - name: Concept feasibility → Gate 2
        test: 'Is it financially and technically feasible: can we afford it, is it technically possible, can we secure the financing? Then write the business plan.'
      - name: Capability development → Gate 3
        test: Has a prototype been developed and tested? Then the launch and proposal.
      - name: Ramp up → Gate 4
        test: Has test marketing, such as focus groups and market research, shown how much can be produced and sold? Then the sanity check.
      - name: Launch
        test: After feedback and corrective measures at the sanity check, launch and commercialise. The figure need not be followed exactly to the letter.
    misconceptions:
      - claim: Serendipity is pure luck that could happen to anyone.
        tempting: The slide calls it 'unexpected discovery, or could be seen as luck'.
        correction: 'Slide 4: to recognise the significance of a discovery you first need previous knowledge in the area: ''chance favours the prepared mind'' (Pasteur).'
      - claim: The simultaneous coupling model starts with science, then technology, then the market.
        tempting: It uses the same key components as the linear model.
        correction: A fixed order is the linear model. Coupling combines all the knowledge at once, so the point where innovation begins is not known.
      - claim: The linear model must be followed exactly, gate by gate.
        tempting: Gates sound strict.
        correction: The lecturer calls Fig 6.3 a depiction that gives you an idea of what happens; it is not necessary to follow it exactly to the letter.
    socratic:
      - ask: Becquerel found radioactivity when uranium salts and photographic paper met by chance in a drawer. Was it luck?
        hint: Who noticed?
        answer: 'Partly. But Cropley says he could not have made the discovery had he not been immersed deeply in relevant research: chance favours the prepared mind.'
      - ask: Which model is this, then, and what does it need?
        hint: Slide 4's first model.
        answer: 'Serendipity: unexpected discovery, which needs previous knowledge in the area to recognise its significance.'
      - ask: A pharmaceutical firm takes a project through feasibility testing, a prototype, test marketing and launch, reviewing it at each gate. Which model?
        hint: A chain, in order.
        answer: 'Linear: science and technology linked in order to technological developments and the needs of the market, as in Fig 6.3.'
      - ask: A product emerges from engineers, scientists and customers at once; nobody can say whether the need or the technology came first. Which model?
        hint: Where did it begin?
        answer: 'Simultaneous coupling: all the knowledge is coupled together, so the point where innovation begins is not known.'
    what-if:
      - change: Becquerel had no background in the relevant research when the uranium salts met the photographic paper.
        effect: 'On Cropley''s argument the discovery would not have happened: chance alone does not yield a recognised innovation. Serendipity needs previous knowledge in the area.'
    boundary:
      - text: A planned research programme hits an unexpected result that its scientists at once recognise as valuable.
        why: 'At the edge: the programme is linear, but the breakthrough itself is serendipity, an unexpected discovery recognised because of previous knowledge in the area.'
      - text: 'Mark''s first sale, which the host called a serendipitous moment: a passer-by bought a table he had restored over a weekend.'
        why: 'Chance met preparation: Mark had the restoring skills and the truck to seize the moment. Serendipity favours the prepared, not merely the lucky.'
    transfer:
      - scenario: A polymer chemist at a university spin-off notices that a failed adhesive dries into an unusually tough film. The company then develops it through feasibility studies, a prototype and test marketing.
        answer: 'Two models apply in sequence. The breakthrough is serendipity: an unexpected discovery whose significance only someone with previous knowledge in the area could recognise. Its development then follows a linear model like Fig 6.3: concept feasibility and a business plan, a prototype, test marketing and a sanity check before launch.'
    objections:
      - position: 'Innovation is a planned process: good firms move ideas through stage gates from science to market.'
        evidence: Linear models link science and technology to technological developments and market needs; Fig 6.3 takes ideas through four gates to commercialisation.
        objection: Serendipity begins with unexpected discovery, and in simultaneous coupling the point where innovation begins is not known. The lecturer adds that Fig 6.3 need not be followed exactly.
    sources:
      - Marketing - Week 11 - Lecture Materials - Innovation Models (slides 4–5)
      - Marketing - Week 09 - Lecture Transcript - Types and Models of Innovation, Reflective Writing (first half, the Week 11 material)
      - Marketing - Week 05 - Reading - Wallas' Model of Creative Thinking (Sadler-Smith, 2015)
  - concept: mgmt2094-w11-open-and-closed-innovation-models
    plain: 'The closed and open models differ in timing. Closed: develop the concept, freeze it, then implement. Open: start implementing mid-development, so market feedback can still reshape the concept.'
    concrete: Asked how he stays flexible, Mark said that when making a piece he might plan one part a certain way, then find that material too expensive and look for an alternative; priorities, he added, change from day to day. The big companies that license his brand, he observed, plan to go from A to B in a straight line but end up going from A to C, because things change.
    formal: 'Slide 6 (Open & Closed Innovation): in the closed model for innovation, the project starts, concept development runs until the concept is frozen, and only then does implementation run to market introduction. In the open model, implementation begins before the concept is frozen, overlapping concept development. The lecturer: implementing early is a ''trial by fire'' that shows the response of the market and users.'
    terms:
      - term: concept frozen
        gloss: The point at which concept development stops and the concept is fixed. In the closed model implementation waits for it; in the open model it starts before.
      - term: trial by fire
        gloss: 'The lecturer''s phrase for implementing during development: seeing the market''s and users'' response while the concept can still change.'
      - term: market introduction
        gloss: The end point of both diagrams, reached when implementation is complete.
    misconceptions:
      - claim: The open model means working with outside partners.
        tempting: '''Open'' often suggests partners.'
        correction: 'The lecture''s open model is a timing diagram: implementation starts before the concept is frozen. Nothing on the slide concerns outside partners.'
      - claim: In the open model the concept is never frozen.
        tempting: It keeps changing with feedback.
        correction: Both diagrams mark a concept-frozen point; in the open model implementation simply starts before it, so development and implementation overlap until then.
      - claim: The lecture says the open model is always better than the closed one.
        tempting: Feedback is never wasted.
        correction: 'The lecture shows the two timings side by side and does not rank them. It explains what the open model allows: market response reshaping the concept.'
    socratic:
      - ask: In the closed model, when does implementation start?
        hint: After something is frozen.
        answer: 'Only after the concept is frozen: project start, concept development, concept frozen, implementation, market introduction, consecutively.'
      - ask: And in the open model?
        hint: Somewhere in the middle…
        answer: Somewhere in the middle of concept development, before the concept is frozen.
      - ask: Why start implementing before the concept is fixed?
        hint: Trial by fire.
        answer: To see the response of the market and users, then continue developing the concept and tweaking the product or service.
      - ask: Mark finds a planned material too expensive and switches mid-way. Which model does that habit resemble?
        hint: Is his concept frozen?
        answer: 'The open model: he keeps adjusting the design while making it, rather than freezing it first.'
    what-if:
      - change: An app developer freezes every feature before writing any code, then releases the finished app.
        effect: 'That is the closed model: implementation follows the frozen concept, so users'' response arrives only after market introduction, when the concept is no longer being developed.'
    boundary:
      - text: A car maker finalises every design detail, freezes the concept, then tools the factory and launches.
        why: 'Closed model: concept development, concept frozen, then implementation and market introduction, consecutively.'
      - text: The linear model's Fig 6.3, with its stages and gates.
        why: 'A different question: the linear model links science to market through gates; the open and closed models ask when implementation starts relative to the frozen concept.'
    transfer:
      - scenario: 'A council plans a bike-share scheme. One option: finalise every detail, then roll it out citywide. The other: run a few stations in one suburb while the design is still being settled.'
        answer: 'The first is the closed model: implementation waits for the frozen concept. The second is the open model: implementation starts mid-development, a trial by fire showing how residents respond, so the council can keep developing the concept and tweaking the service before market introduction across the city.'
    objections:
      - position: Implementation should wait until the concept is finished.
        evidence: 'In the closed model the steps run consecutively: the concept is frozen before any implementation, so nothing is built on an unsettled design.'
        objection: 'The open model shows what waiting gives up: implementing mid-development lets the market and users respond while the concept can still be developed and tweaked. Mark notes even big companies end up at C rather than B.'
    storyboard:
      - caption: Project starts
        detail: Concept development begins.
      - caption: Implementation starts early
        detail: Somewhere in the middle of concept development, before the concept is frozen.
      - caption: Trial by fire
        detail: You see the response of the market and of your users.
      - caption: The concept keeps developing
        detail: What you learn reshapes the concept while it is still open.
      - caption: Concept frozen
        detail: Development ends; implementation continues, tweaking the product or service.
      - caption: Market introduction
        detail: Implementation runs on to the market.
    sources:
      - Marketing - Week 11 - Lecture Materials - Innovation Models (slides 6)
      - Marketing - Week 09 - Lecture Transcript - Types and Models of Innovation, Reflective Writing (first half, the Week 11 material)
      - Marketing - Week 11 - Lecture Transcript - Guest Lecture, Business Founder (Mark)
  - concept: mgmt2094-w11-architectural-and-modular-innovation
    plain: Architectural innovation changes how a product is put together; modular innovation swaps one component for a new technology while the product and its structure stay the same.
    concrete: 'The slides give two examples. The mobile phone becoming the smartphone is architectural innovation: the lecturer says it departs quite a bit from what came before, yet grows out of the legacy product, still essentially a phone, with a changed structure and many more capabilities. A car''s steam engine becoming a fuel engine is modular innovation: the car stays the same product, but one important component changes technology.'
    formal: 'Slide 7: architectural innovation is a ''change in product structure'' (mobile phone → smartphone); modular innovation is a ''change in component technology'' (steam engine of car → fuel engine of car). The lecturer: ''we can divide innovation into architectural and modular''.'
    terms:
      - term: product structure
        gloss: How a product's parts are put together and what the whole does. Changing it is architectural innovation.
      - term: component technology
        gloss: The technology inside one part of a product, such as a car's engine. Changing it is modular innovation.
      - term: legacy product
        gloss: The earlier product an innovation grows out of, as the smartphone grew out of the mobile phone.
    elements:
      - name: What changed?
        test: The way the whole product is put together, or one component inside it?
      - name: Architectural
        test: The structure changes and capabilities grow, while the product grows out of its legacy, like the mobile phone becoming the smartphone.
        authorities:
          - mgmt2094-example-mobile-phone-to-smartphone
      - name: Modular
        test: One component technology is replaced; the product and its structure stay the same, like a car's steam engine becoming a fuel engine.
        authorities:
          - mgmt2094-example-steam-to-fuel-engine
    misconceptions:
      - claim: Architectural innovation is a change in component technology.
        tempting: The two terms are easily swapped.
        correction: 'It is the reverse. Architectural: change in product structure (the smartphone). Modular: change in component technology (the car''s engine).'
      - claim: Architectural and modular are two of the seven types of innovation.
        tempting: They are taught in the same lecture.
        correction: 'They are a different cut: the seven types say where innovation happens; architectural and modular say what changed inside the product. A smartphone is both product and architectural innovation.'
      - claim: Architectural innovation is always radical, and modular always incremental.
        tempting: Structural change feels bigger.
        correction: The slide defines them by what changes, structure or component, not by the size of the advance; it does not equate them with radical and incremental.
    socratic:
      - ask: The smartphone departs quite a bit from the mobile phone. Is it a wholly new product?
        hint: Grows out of…
        answer: 'In a sense it is still a phone: it grows out of the legacy product, with a changed structure and many more capabilities.'
      - ask: So what kind of change is it?
        hint: Structure or component?
        answer: 'A change in product structure: architectural innovation.'
      - ask: A car's steam engine is replaced by a fuel engine. What stays the same?
        hint: The car…
        answer: 'The product and its overall structure: it is still a car. Only one important component changes technology.'
      - ask: And which kind of innovation is that?
        hint: Component.
        answer: 'Modular innovation: a change in component technology.'
    what-if:
      - change: A kettle maker that had only replaced its heating coil with a more efficient element also redesigns the kettle into a countertop hot-water station with new functions.
        effect: 'The classification moves from modular (one component technology changed) to architectural: the product''s structure and capabilities change, though it grows out of the legacy kettle.'
    boundary:
      - text: A desk redesigned, from similar parts, to fold into a wall cabinet.
        why: 'Architectural: the parts are much the same, but how they fit together and what the product does change, like the phone becoming a smartphone.'
      - text: The smartphone classified under the seven types of innovation.
        why: 'It is also a product innovation: the two cuts answer different questions, so one innovation can be both architectural and product innovation.'
    transfer:
      - scenario: 'A wheelchair maker weighs two projects: replacing the chair''s steel frame tubes with carbon fibre, or turning the chair into a device that can also raise its user to standing.'
        answer: 'The carbon-fibre tubes are modular innovation: one component technology changes while the chair and its structure stay the same, like the steam engine becoming a fuel engine. The standing chair is architectural: the product structure changes and gains capabilities while growing out of the legacy product, like the smartphone.'
    sources:
      - Marketing - Week 11 - Lecture Materials - Innovation Models (slides 7)
      - Marketing - Week 09 - Lecture Transcript - Types and Models of Innovation, Reflective Writing (first half, the Week 11 material)
  - concept: mgmt2094-w11-four-actions-framework
    plain: The four actions framework reshapes an industry's offer by asking which factors to eliminate, reduce, raise and create, so a firm stops competing on rivals' terms and can reach non-customers.
    concrete: 'Before Yellow Tail entered the US wine market, premium and budget wines competed on the same factors at different levels: price, terminology, marketing, ageing, vineyard, complexity and range. Yellow Tail eliminated enological terminology, ageing qualities and above-the-line marketing; reduced wine complexity, wine range and vineyard prestige; raised its price above budget wine and its retail store involvement; and created easy drinking, ease of selection, and fun and adventure.'
    formal: 'Kim and Mauborgne (slide 10): ''To fundamentally shift the strategy canvas of an industry you must begin by reorienting your strategic focus from competitors to alternatives and from customers to non customers.'' The four action framework questions (slide 11): which factors the industry takes for granted should be eliminated; reduced well below the industry''s standards; raised well above them; created that the industry has never offered?'
    analogy:
      text: Renovating a house by deciding which rooms to knock out, which to shrink, which to enlarge and what new room to add, rather than copying the neighbours' floor plan with nicer finishes.
      maps:
        - from: knocking out a room
          to: eliminate
        - from: shrinking a room
          to: reduce
        - from: enlarging a room
          to: raise
        - from: adding a room no neighbour has
          to: create
      limits:
        - A house is judged by its owner; the four actions are aimed at buyers, especially non-customers, and the new curve is read against rivals on the strategy canvas.
    terms:
      - term: strategy canvas
        gloss: A chart of the levels at which competitors offer each factor the industry competes on. Yellow Tail's showed premium wines high on every factor, budget wines low.
      - term: value curve
        gloss: A firm's line across the strategy canvas. Yellow Tail's sat apart from both premium and budget wines.
      - term: non-customers
        gloss: People who do not yet buy in the industry. Kim and Mauborgne tell firms to shift their focus from customers to them.
    elements:
      - name: Eliminate
        test: 'Which factors that the industry takes for granted should be eliminated? Yellow Tail: enological terminology, ageing qualities, above-the-line marketing.'
        authorities:
          - mgmt2094-example-yellow-tail
      - name: Reduce
        test: 'Which factors should be reduced well below the industry''s standards? Yellow Tail: wine complexity, wine range, vineyard prestige.'
        authorities:
          - mgmt2094-example-yellow-tail
      - name: Raise
        test: 'Which factors should be raised well above the industry''s standard? Yellow Tail: price versus budget wine, retail store involvement.'
        authorities:
          - mgmt2094-example-yellow-tail
      - name: Create
        test: 'Which factors should be created that the industry has never offered? Yellow Tail: easy drinking, ease of selection, fun and adventure.'
        authorities:
          - mgmt2094-example-yellow-tail
    misconceptions:
      - claim: Yellow Tail eliminated wine complexity, wine range and vineyard prestige.
        tempting: They were cut back.
        correction: 'Those were reduced: kept, but well below the industry standard. The eliminate box holds enological terminology, ageing qualities and above-the-line marketing.'
      - claim: Yellow Tail undercut every budget wine on price.
        tempting: It was a budget wine.
        correction: 'The raise box includes ''price versus budget wine'': Yellow Tail priced above budget wines, though below premium, and raised retail store involvement.'
      - claim: Raise and create are the same action.
        tempting: Both add value.
        correction: Raise lifts a factor the industry already offers well above its standard; create adds a factor the industry has never offered, such as fun and adventure.
    socratic:
      - ask: Before Yellow Tail, how did premium and budget wines compare on the strategy canvas?
        hint: The same factors?
        answer: 'They competed on the same factors (price, terminology, marketing, ageing, vineyard, complexity, range) at different levels: premium high, budget low.'
      - ask: Where do Kim and Mauborgne say a shift must begin?
        hint: Two reorientations.
        answer: By reorienting strategic focus from competitors to alternatives, and from customers to non-customers.
      - ask: Which factors did Yellow Tail drop altogether, and which did it merely cut back?
        hint: Eliminate versus reduce.
        answer: 'Eliminated: enological terminology, ageing qualities and above-the-line marketing. Reduced: wine complexity, wine range and vineyard prestige.'
      - ask: What did it offer that no wine had offered before?
        hint: Create.
        answer: Easy drinking, ease of selection, and fun and adventure.
      - ask: What lesson does the slide draw about trying to match every factor?
        hint: Boxes.
        answer: 'Focus is more important than ticking all the boxes. Challenge existing business models: just because they represent the historic norm doesn''t mean they are right.'
    what-if:
      - change: Yellow Tail had matched premium wines on vineyard prestige and wine complexity while keeping a budget price.
        effect: 'It would be competing on the industry''s own factors instead of shifting the canvas. The slide''s lessons point the other way: focus is more important than ticking all the boxes, and the historic norm is not necessarily right.'
    boundary:
      - text: A gym adds 24-hour app-based entry, which no rival offers.
        why: 'Create, not raise: raise lifts an existing factor above the standard; a factor the industry has never offered is created.'
      - text: Yellow Tail relying on retailers instead of above-the-line marketing.
        why: 'Two actions at once: above-the-line marketing was eliminated while retail store involvement was raised. The lecturer says it secured prominent US retailers and relied on marketing through them.'
    transfer:
      - scenario: A new budget airline is entering a crowded domestic market where every carrier competes on lounges, frequent-flyer points, meals and seat choice.
        answer: Plot the strategy canvas, then shift focus to alternatives and non-customers. Ask which taken-for-granted factors to eliminate, which to reduce well below the standard, which to raise above it, and what to create that no airline offers. Focus on a few factors rather than ticking all the boxes, as Yellow Tail did.
    objections:
      - position: In a crowded market, the only way to win is to beat rivals on the factors customers already value.
        evidence: Premium and budget wines competed on the same factors at different levels, and the lecturer calls the saturated US market very difficult to enter.
        objection: 'Yellow Tail won by changing the factors, eliminating, reducing, raising and creating, so its curve sat apart from both groups. Kim and Mauborgne: shift focus from competitors to alternatives and from customers to non-customers.'
    sources:
      - Marketing - Week 11 - Lecture Materials - Innovation Models (slides 8–14)
      - Marketing - Week 09 - Lecture Transcript - Types and Models of Innovation, Reflective Writing (first half, the Week 11 material)
  - concept: mgmt2094-w11-value-innovation
    plain: Value innovation creates a leap in value for the mass of buyers, including people who were not customers, rather than beating rivals, serving niches or launching technology few can afford.
    concrete: The lecturer stresses that Yellow Tail was still just wine, entering a US market already full of budget and premium wines from many countries. Yet by rethinking what wine and wine drinking are, it repositioned its product and created value for the customer, almost creating a new category. It secured contracts with prominent US retailers and relied on marketing through them.
    formal: 'Slide 16: value innovation (VI) is ''one of the most prominent programmatic approaches to innovation currently in use''. It differs from building layers of competitive advantage and does not mean segmenting the market and accommodating customer needs. Its main focus: products and services creating superior buyer value in existing markets, enabling a quantum leap to create new markets. New technology is not VI unless cheap enough for mass buyers.'
    terms:
      - term: superior buyer value
        gloss: Value VI's offerings create for buyers in existing markets, enabling a quantum leap for the firm to create new markets.
      - term: mass buyers
        gloss: The broad body of buyers VI targets. New technology becomes a value innovation only when it is cheap enough for them.
      - term: building blocks of strategy
        gloss: 'Slide 17''s three: competition, customers and corporate capabilities. VI changes the conventional focus on each.'
    elements:
      - name: Competition
        test: Not outperforming the competition, but seeking radically superior value to capture the entire mass market.
      - name: Customers
        test: Not retaining and better satisfying existing customers, but targeting the mass of buyers by following non-customers closely and willingly losing some existing customers.
        authorities:
          - mgmt2094-example-yellow-tail
      - name: Corporate capabilities
        test: Not just leveraging and extending current capabilities, but being willing to combine a company's capabilities.
      - name: The mass-buyer test
        test: 'For new technology: is it cheap enough for mass buyers? If not, it is technology innovation, not value innovation.'
    misconceptions:
      - claim: Value innovation means segmenting the market and tailoring offers to each segment's needs.
        tempting: It sounds customer-focused.
        correction: 'Slide 16: VI does not mean segmenting the market and accommodating customer needs; it seeks superior buyer value for the mass market.'
      - claim: Any genuinely new technology is a value innovation.
        tempting: New technology seems the essence of innovation.
        correction: 'Slide 16: VI differs from technology innovation; new technology does not become a value innovation unless it is cheap enough for mass buyers.'
      - claim: Value innovation keeps every existing customer.
        tempting: Losing customers looks like failure.
        correction: 'Slide 17: VI targets the mass of buyers by following non-customers closely, willingly losing some existing customers.'
    socratic:
      - ask: Yellow Tail sold wine, in a market already full of wine. Was that innovation?
        hint: Same product, new…
        answer: 'Yes, value innovation: by rethinking what wine and wine drinking are, it repositioned the product and created value for the customer.'
      - ask: On competition, did Yellow Tail try to outperform premium wines on their own terms?
        hint: The conventional focus.
        answer: 'No: it reduced vineyard prestige and complexity. VI seeks radically superior value to capture the entire mass market, not outperforming rivals.'
      - ask: On customers, whom was it targeting?
        hint: Non-…
        answer: The mass of buyers, following non-customers closely and willing to lose some existing customers.
      - ask: A firm builds an advanced home robot priced beyond most households. Is it a value innovation yet?
        hint: Mass buyers.
        answer: 'Not yet: new technology becomes a value innovation only once it is cheap enough for mass buyers.'
      - ask: Before innovating, what else does the lecture say to consider?
        hint: The business modelling slide.
        answer: 'Every element of the business model: value proposition, customers, customer relationships, channels, revenue, key partners, key activities, key resources and costs.'
    what-if:
      - change: Yellow Tail had launched at premium prices, aimed only at existing wine connoisseurs.
        effect: 'It would fail the customers block: VI targets the mass of buyers by following non-customers, not retaining and better satisfying existing customers. It would also be competing on the premium curve rather than shifting it.'
    boundary:
      - text: Three extra layers of competitive advantage over the nearest rival.
        why: 'Not value innovation: slide 16 says VI is different from building layers of competitive advantage, and its competition block replaces outperforming rivals with value for the mass market.'
      - text: A breakthrough device launched at a price most households can afford, drawing many first-time buyers.
        why: 'Meets the mass-buyer test: new technology becomes a value innovation when it is cheap enough for mass buyers, and it is reaching non-customers.'
    transfer:
      - scenario: A cinema chain is losing audiences to streaming. Management proposes premium recliner seats to win back its keenest film-goers.
        answer: 'That is the conventional focus: retaining and better satisfying existing customers and outperforming rivals. Value innovation would follow non-customers, people who rarely go to the cinema, seek radically superior value for the mass market, accept losing some existing customers, be willing to combine capabilities, and check the whole business model first.'
    objections:
      - position: 'Yellow Tail did not innovate: it just sold cheap wine.'
        evidence: It was still just wine, in a market full of budget and premium wines, and it reduced complexity and range.
        objection: 'It was not the cheapest: it raised its price above budget wine. By rethinking what wine drinking is, it created superior buyer value and reached non-customers: value innovation, which the slide distinguishes from technology innovation.'
    sources:
      - Marketing - Week 11 - Lecture Materials - Innovation Models (slides 13–17)
      - Marketing - Week 09 - Lecture Transcript - Types and Models of Innovation, Reflective Writing (first half, the Week 11 material)
  - concept: mgmt2094-w11-bcg-six-innovation-models
    plain: 'BCG found six ways leading companies innovate: creator, solution builder, leverager, expander, defender and fast follower. The right one depends on the industry and the company, and needs matching capabilities.'
    concrete: 'The retailer Sears used the defender model, counting on its brand recognition and its network of brick-and-mortar stores to stay ahead. When agile online players upended the retail industry, Sears lost its edge: its total shareholder return from 2008 through 2017 was –23.6%. In the same industry Amazon, an expander (30.3%), and Costco, a leverager (13.4%), succeeded with different models aligned to their strategies.'
    formal: 'Manly, Grassl and Wilson (BCG, 2017) studied more than 100 of the world''s most innovative companies and found six models: creator, solution builder, leverager, expander, defender and fast follower. Innovators fall short by pursuing the wrong model for their business and competitive context, or by not supporting a good model with the capabilities it requires. ''Choosing the right innovation model for your company is all about context.'''
    terms:
      - term: innovation model
        gloss: In BCG's study, one of six distinct ways leading companies innovate, each with its own key characteristics, motto and examples.
      - term: context
        gloss: Industry context (only a subset of models succeeds in most industries) and company context (the model must fit the firm's strategy, strengths and capabilities).
      - term: innovation blueprint
        gloss: 'The interconnecting pieces that must align with the chosen model: structure and culture; tools and processes; metrics and incentives.'
      - term: TSR
        gloss: 'Total shareholder return, BCG''s performance measure for the companies, 2008 through 2017: Apple 21.2%, Sears –23.6%.'
    elements:
      - name: Creator ('We know best')
        test: Led by a visionary; disrupts core markets, protects its intellectual property, makes a limited number of focused big bets; a closed innovation approach. Apple, Tesla, Netflix, Lululemon.
        authorities:
          - mgmt2094-reading-bcg-2017-innovation-models
      - name: Solution builder ('We're listening')
        test: 'Wins by understanding and delighting customers: excellence in customer insight and a focus on the full purchase experience. Nike, Starbucks, GoPro, Target, Under Armour.'
        authorities:
          - mgmt2094-example-nike-solution-builder
          - mgmt2094-example-starbucks
      - name: Leverager ('We do it best')
        test: Innovates its core business model to drive ongoing advantage, improving the core model continuously. Zara, Toyota, Costco.
        authorities:
          - mgmt2094-example-zara-leverager
      - name: Expander ('Seeking share to steal')
        test: 'Uses a core capability to enter and dominate adjacent markets: a mandate for growth and consistent in-market experimentation. Amazon, Gilead, Danaher.'
        authorities:
          - mgmt2094-example-amazon-and-costco
      - name: Defender ('Protecting our turf')
        test: Focuses on points of advantage in mature or slow-changing sectors; monitors for disruptions and keeps pace through M&A and partnerships. AIG, Pfizer, Allstate.
        authorities:
          - mgmt2094-example-allstate-esurance
          - mgmt2094-example-sears-defender
      - name: Fast follower ('Ready to react')
        test: Optimises its capabilities to react rapidly to, and often improve on, competitive innovations; a flat organisation for rapid decisions. Reckitt Benckiser, Tencent, JPMorgan Chase.
        authorities:
          - mgmt2094-example-reckitt-benckiser
    misconceptions:
      - claim: Allstate buying Esurance shows the expander model.
        tempting: An acquisition looks like expansion.
        correction: 'BCG presents it as a defender move: Allstate identified the shift to online and app-based products and acquired the pioneer, Esurance, to keep from falling behind.'
      - claim: Only one innovation model can succeed in a given industry.
        tempting: BCG stresses industry context.
        correction: 'BCG: only a subset succeeds in most industries; four drive TSR premiums in consumer retail. Amazon (expander) and Costco (leverager) both succeed.'
      - claim: Starbucks is a creator, because it is famous for innovating.
        tempting: The Week 11 slides praise its drinks.
        correction: 'BCG lists Starbucks among solution builders, with Nike; its creators are Apple, Tesla, Netflix and Lululemon. The slides use Starbucks for resource-based innovation: name the framework you apply.'
    socratic:
      - ask: Sears counted on its brand recognition and its stores to stay ahead. Which BCG model is that?
        hint: Protecting our turf.
        answer: The defender model.
      - ask: Why did that model fail Sears?
        hint: What happened to retail?
        answer: Agile online players upended the retail industry, which no longer rewarded the defender model, and Sears lost its edge.
      - ask: Amazon and Costco both succeed in retail with different models. What does that show?
        hint: Company context.
        answer: 'The model must align with a company''s strategy, strengths and capabilities: expander suits Amazon''s broad reach and rapid growth; Costco succeeds as a leverager.'
      - ask: Once a model is chosen, what makes it work?
        hint: Three pieces.
        answer: A blueprint aligning structure and culture, tools and processes, and metrics and incentives with it. Amazon's expander model needs its high tolerance for risk.
      - ask: Where should a firm look for its model?
        hint: Rivals.
        answer: One competitors aren't using at all or are using poorly, weighed against the investment needed and filtered through the firm's ambition and resources.
    what-if:
      - change: Allstate had not monitored the landscape and had missed the shift to online and app-based insurance.
        effect: BCG says defenders succeed by monitoring for disruptive innovations and defending with tactics such as acquisitions. Without that, Allstate risked falling behind, and BCG warns the defender model grows riskier as technology transforms industries.
    boundary:
      - text: 'Mark''s advice to ''stick to your knitting'': make the core business really successful before branching out.'
        why: Echoes BCG's point that a model must fit a company's strategy, strengths and capabilities; it cuts against an expander's mandate for growth into adjacent markets.
      - text: A firm that 'looks to the market for inspiration' through observation and deep customer insight.
        why: In BCG's terms a solution builder. 'Market-based innovation' is the lecture's separate view of where innovation comes from, not one of BCG's models.
    transfer:
      - scenario: A long-established department-store chain faces online competitors. Its board wants to keep relying on its brand and its stores.
        answer: 'BCG''s Sears warning applies: the defender model fails when the industry stops rewarding it. Read the industry context (in consumer retail, creator, solution builder, leverager and expander drive premiums) and the firm''s own strengths, look for a model rivals use poorly, and back it with a blueprint of structure, processes and incentives.'
    objections:
      - position: An established retailer facing online disruption should simply defend what it already does well.
        evidence: 'BCG: defenders tend to win in mature or slow-changing industries, and Allstate defended itself by acquiring Esurance.'
        objection: BCG also says that as technology transforms more industries, the defender model becomes increasingly risky; Sears' defender strategy lost its edge when agile online players upended retail.
      - position: Pick the right innovation model and success follows.
        evidence: BCG's six models come from studying more than 100 of the world's most innovative companies.
        objection: BCG says innovators also fall short by not supporting a good model with the capabilities it requires; migrating to a model or aligning capabilities is the hardest part, and needs a full blueprint.
    sources:
      - Marketing - Week 11 - Reading - Which Innovation Model Is Right for Your Company (BCG, 2017) (pp 1–4)
      - Marketing - Week 11 - Lecture Transcript - Guest Lecture, Business Founder (Mark)
flows:
  - slug: four-actions-on-the-strategy-canvas
    title: 'Applying the four actions framework: what happens to each factor?'
    summary: Takes an industry's strategy canvas through Kim and Mauborgne's four questions, factor by factor, to a new curve that either stands apart or still ticks the industry's boxes.
    start: n1
    concepts:
      - mgmt2094-w11-four-actions-framework
      - mgmt2094-w11-value-innovation
    sources:
      - Marketing - Week 11 - Lecture Materials - Innovation Models (slides 9–14)
      - Marketing - Week 09 - Lecture Transcript - Types and Models of Innovation, Reflective Writing (first half, the Week 11 material)
    nodes:
      - id: n1
        kind: step
        text: 'Plot the industry''s strategy canvas: the factors it competes on, and each group''s level on each factor.'
        note: Before Yellow Tail, premium and budget wines competed on price, terminology, marketing, ageing, vineyard, complexity and range, at different levels.
        authorities:
          - mgmt2094-example-yellow-tail
        next: n2
      - id: n2
        kind: step
        text: Reorient your strategic focus from competitors to alternatives, and from customers to non-customers.
        note: 'Kim and Mauborgne: you must begin here to fundamentally shift the strategy canvas of an industry.'
        concept: mgmt2094-w11-value-innovation
        next: n3
      - id: n3
        kind: ask
        text: Take one factor. Does the industry already compete on it?
        branches:
          - label: Yes, it is on the canvas
            to: n4
          - label: No, the industry has never offered it
            to: n10
      - id: n4
        kind: ask
        text: Is it a factor the industry takes for granted that should be eliminated?
        branches:
          - label: 'Yes'
            to: n5
          - label: 'No'
            to: n6
      - id: n5
        kind: step
        text: Eliminate it.
        note: Yellow Tail eliminated enological terminology, ageing qualities and above-the-line marketing.
        next: n11
      - id: n6
        kind: ask
        text: Should it be reduced well below the industry's standards?
        branches:
          - label: 'Yes'
            to: n7
          - label: 'No'
            to: n8
      - id: n7
        kind: step
        text: Reduce it.
        note: Yellow Tail reduced wine complexity, wine range and vineyard prestige.
        next: n11
      - id: n8
        kind: ask
        text: Should it be raised well above the industry's standard?
        branches:
          - label: 'Yes'
            to: n9
          - label: 'No: leave it as it is'
            to: n11
      - id: n9
        kind: step
        text: Raise it.
        note: Yellow Tail raised its price versus budget wine, and its retail store involvement.
        next: n11
      - id: n10
        kind: step
        text: 'Create it: a factor the industry has never offered.'
        note: Yellow Tail created easy drinking, ease of selection, and fun and adventure.
        next: n11
      - id: n11
        kind: step
        text: Ask the four questions of every factor, then plot your new curve on the canvas.
        next: n12
      - id: n12
        kind: ask
        text: Does the new curve stand apart from the rivals' curves, focused on a few factors rather than ticking all the boxes?
        note: 'Key lessons: focus is more important than ticking all the boxes; challenge existing business models, since the historic norm is not necessarily right.'
        branches:
          - label: 'Yes'
            to: n13
          - label: 'No'
            to: n14
      - id: n13
        kind: end
        tone: met
        text: 'The canvas has shifted: like Yellow Tail''s, the curve sits apart from both premium and budget rivals.'
      - id: n14
        kind: end
        tone: not-met
        text: 'Still competing on the industry''s terms: revisit the four questions with non-customers in mind.'
