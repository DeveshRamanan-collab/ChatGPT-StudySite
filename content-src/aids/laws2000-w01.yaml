  - concept: laws2000-w01-history-ancient-to-westphalia
    plain: Before modern states, rules between communities came from shared expectations and natural-law ideas; the 1648 Peace of Westphalia organised Europe into sovereign states, starting the modern state system.
    concrete: In 1532 Francisco de Vitoria, a Spanish Dominican professor, lectured on Spain's conquests in the New World. He concluded that the native peoples were part of the human race, so natural law applied to them. Because people already lived there, there had been no 'discovery', and conquest — like any other war of territorial expansion — was not justified under natural law.
    formal: 'Natural law (jus naturale) holds that intrinsic values govern relations universally, across time and place. Hugo Grotius (1583–1645) secularised it and distinguished jus gentium: human-made law, variable in time and place, valid because states consent. The Peace of Westphalia (1648; Treaties of Munster and Osnabruck) organised territory and people into sovereign states — the ''beginning'' of the state system and birth of ''sovereignty''.'
    terms:
      - term: polis
        gloss: 'The ancient Greek city-state: an urban centre with surrounding countryside, a community with mutual expectations about how members behave.'
      - term: nomos
        gloss: The ancient Greek idea of restricting natural freedoms for the sake of expediency and self-interest.
      - term: jus naturale (natural law)
        gloss: Universal, eternal law inherent in nature, applying to all cultures and times; shaped by Stoic philosophy and, under the Church, Thomas Aquinas.
      - term: jus gentium
        gloss: Rules of law common to nations; for Grotius, human-made and variable, valid through states' consent rather than natural reason.
        example: The lecturer's example is a trade treaty.
    misconceptions:
      - claim: Grotius treated jus gentium as universal and unchanging.
        tempting: Both are Latin 'law of …' terms from the same period.
        correction: Jus naturale is the universal one. Grotius described jus gentium as human-created law, variable in time and place, whose validity rests on states' consent.
      - claim: Vitoria justified the conquest of the New World because natural law applied only in Europe.
        tempting: Colonial-era scholars are often assumed to have endorsed colonialism.
        correction: Vitoria held that native peoples were part of the human race, so natural law applied to them; there was no 'discovery', so conquest was not justified under natural law.
      - claim: Sovereignty existed fully formed in ancient Greece.
        tempting: Greek city-states governed themselves behind walls.
        correction: The materials tie the birth of 'sovereignty' to the 1648 Peace of Westphalia, which organised territory and people into sovereign states with a clear source of authority.
    socratic:
      - ask: In late-medieval Europe, who held authority over a local ruler?
        hint: Think of the Pope and the Holy Roman Empire.
        answer: 'Several overlapping authorities: the Catholic Church held spiritual authority and the Pope could influence emperors and kings.'
      - ask: What kind of law did thinkers then rely on for relations between peoples?
        hint: A law inherent in nature, the same everywhere.
        answer: 'Natural law (jus naturale): universal values applying across time and place.'
      - ask: What did Grotius do with natural law?
        hint: He secularised it, then separated something from it.
        answer: He secularised it and distinguished it from jus gentium — human-made, variable law, valid through states' consent.
      - ask: What did Westphalia supply that the medieval order lacked?
        hint: Slide 26 speaks of 'a clear source of authority'.
        answer: 'Sovereign states: territory and people organised into states, each a clear source of authority — the birth of sovereignty.'
      - ask: Why does that still matter for today's law?
        hint: Who are the primary subjects of international law?
        answer: States became the primary source of authority and primary subjects of international law; the Westphalian system remains a building block of the legal order.
    what-if:
      - change: Grotius had grounded jus gentium in natural reason rather than consent.
        effect: 'The distinction would collapse: what separated jus gentium from natural law was that its validity came from states'' consent, not from a higher natural order.'
    boundary:
      - text: 'Thucydides: the strong do what they can and the weak suffer what they must.'
        why: 'An ancient idea the modern order inverts: realism echoes it, but the current position rests on sovereign equality (Art 2 UN Charter), not on power.'
      - text: Emmerich de Vattel's Law of Nations.
        why: He underlined state equality irrespective of power — though, the lecturer notes, at least within Europe — and argued only positive law is relevant, foreshadowing nineteenth-century positivism.
    transfer:
      - scenario: A colonial-era tribunal must decide whether a European power may take an inhabited island simply because its navigators 'discovered' it.
        answer: 'Vitoria''s reasoning answers it: the island''s inhabitants are part of the human race, so natural law applies to them. Because people already live there, there is no ''discovery'', and conquest, like other wars of territorial expansion, is not justified under natural law.'
    objections:
      - position: 'Natural law: universal values bind all peoples, whatever any ruler has agreed.'
        evidence: Vitoria used natural law to hold that native peoples of the New World were protected and that conquest by 'discovery' was unjustified.
        objection: 'Grotius, and later Vattel, located law between states in human choice: jus gentium and positive law are valid because states consent, not because of natural reason.'
    storyboard:
      - caption: 'Ancient Greece: polis and nomos'
        detail: City-states with mutual expectations of behaviour; nomos restricts natural freedoms for expediency and self-interest.
      - caption: 'Rome: jus naturale and jus civile'
        detail: Roman law pairs natural law with civil law; some patterns of the Greek city-states persist.
      - caption: 'Late Middle Ages: Church and Empire'
        detail: '15th–16th centuries: overlapping allegiances under the Catholic Church and Holy Roman Empire; natural law dominates.'
      - caption: '1532: Vitoria on the New World'
        detail: Native peoples are human, natural law applies, and 'discovery' cannot justify conquest.
      - caption: Grotius separates jus gentium
        detail: Secular natural law distinguished from human-made, consent-based jus gentium; Suarez and Vattel also shape the field.
      - caption: '1648: Peace of Westphalia'
        detail: Treaties of Munster and Osnabruck end the Thirty Years' War; sovereign states and 'sovereignty' are born.
    sources:
      - Week 01 - Lecture Slides - What Is Public International Law (slides 23–26)
      - 'Week 01 - Lecture Recording (Online) - Introduction to International Law - Full Transcript (00:00–19:20: Greece, Rome, natural law, Grotius, Vitoria, Suarez, Vattel, Westphalia)'
    verify: false
  - concept: laws2000-w01-history-nineteenth-century-to-un
    plain: From the 1800s, law between states was seen as coming only from state consent; after two world wars, states built institutions — the League, the PCIJ, then the UN — to keep the peace.
    concrete: 'After the First World War, the League of Nations (1919) did not ban war, but required members to submit disputes likely to lead to conflict to adjudication or inquiry. The 1928 Kellogg-Briand Pact went further: states committed to refrain from war as an instrument of national policy. The Second World War still followed, and in 1946 the League was replaced by the United Nations, whose Charter bans the use of force.'
    formal: Positivism held that "the only true source of law is State will" — not fairness or divine justice but consent to be bound, so states choose their obligations (slide 27). The 1928 Kellogg-Briand Pact obliged states to refrain from war as a means of settling controversies and as an instrument of national policy. The UN Charter entrenched sovereign equality, self-determination and a ban on force.
    terms:
      - term: positivism
        gloss: The nineteenth-century view that law's only source is state will (consent), not fairness or divine justice; states choose which obligations bind them.
      - term: Permanent Court of International Justice
        gloss: The League's court, created in 1920 and dissolved in 1946; the ICJ took its place, and its case law is still cited.
      - term: self-determination
        gloss: The right of peoples to determine their own status; entrenched in the UN Charter and affirmed in the 1960 Declaration on decolonisation.
      - term: International Law Commission
        gloss: UN body created in 1946 to promote 'the progressive development of international law and its codification'.
    misconceptions:
      - claim: The League of Nations banned war.
        tempting: It was created specifically to prevent another world war.
        correction: The League did not itself prohibit war; it obliged members to submit disputes likely to cause conflict to adjudication or inquiry. The 1928 Kellogg-Briand Pact then committed states to renounce war as national policy.
      - claim: The General Assembly can make binding law, like the Security Council.
        tempting: All 193 members vote there, so it looks like a parliament.
        correction: The lecture says the General Assembly has only a consultative role and cannot create binding law; the Security Council holds primary responsibility for peace and security and can sometimes bind states.
      - claim: The PCIJ and the ICJ are the same court.
        tempting: One replaced the other, and both are called the 'world court'.
        correction: The PCIJ (1920) was the League's court and was dissolved in 1946; the ICJ, the UN's principal judicial organ, took its place. PCIJ decisions such as Lotus are still cited.
    socratic:
      - ask: For a nineteenth-century positivist, what made a rule binding on a state?
        hint: Not fairness, not divine justice …
        answer: Only the state's will — its consent to be bound by the obligation.
      - ask: What did positivism produce in practice?
        hint: Look at slide 27's unions, declarations and conferences.
        answer: 'Formal institutions and treaties: the Telegraph Union (1865), Postal Union (1874), Declarations of Paris (1856) and St Petersburg (1868), and the Hague Conferences (1899, 1907).'
      - ask: After the First World War, did the League outlaw war?
        hint: What did it require members to do with their disputes?
        answer: No. Disputes likely to lead to conflict had to go to adjudication or inquiry; the Kellogg-Briand Pact (1928) then renounced war as national policy.
      - ask: After the Second World War, how did keeping the peace change?
        hint: Which UN organ has primary responsibility?
        answer: 'It became a collective effort: the UN Charter banned the use of force and gave the Security Council primary responsibility for international peace and security.'
      - ask: Why is the Security Council sometimes ineffective?
        hint: Think about its five permanent members.
        answer: China, Russia, the United States, France and the United Kingdom each hold a veto and can block any Council decision.
    what-if:
      - change: A dispute likely to lead to war arises between two League members in 1925.
        effect: War was not yet prohibited, but as League members they had to submit the dispute to adjudication or inquiry. From 1928, Kellogg-Briand parties also committed to refrain from war as national policy.
      - change: A Security Council resolution on a conflict is vetoed by one permanent member.
        effect: The Council cannot act, since any of the five permanent members can block a decision. The General Assembly can debate and declare, but it has only a consultative role and cannot bind states.
    boundary:
      - text: The 1928 Kellogg-Briand Pact.
        why: 'It sits between the League, which did not ban war, and the UN Charter''s ban on force: it renounced war as an instrument of national policy, a precursor rather than the full Charter regime.'
      - text: The Nuremberg Trials (1945–46).
        why: 'Prosecuting top German officials for international crimes began international criminal law: individuals, not only states, became answerable — the line that leads to today''s International Criminal Court.'
    transfer:
      - scenario: 'Drafters of a new regional peace organisation propose copying the League model: members must send disputes to inquiry, but going to war is not prohibited.'
        answer: 'History cautions against it. The League did not prohibit war and the Second World War followed. Kellogg-Briand renounced war as national policy, and the UN Charter went further: a ban on the use of force, peaceful settlement of disputes and a Security Council with primary responsibility — though the P5 veto shows how one member can block collective action.'
    storyboard:
      - caption: '19th century: positivism dominates'
        detail: Law flows from state will alone; states choose which obligations bind them.
      - caption: '1856–1907: unions, declarations, Hague'
        detail: Telegraph and Postal Unions; Paris and St Petersburg Declarations; Hague Conferences create the Permanent Court of Arbitration.
      - caption: '1914: colonialism at its height'
        detail: At the outbreak of the First World War, 90 per cent of Africa is under European control.
      - caption: '1919–1928: League, PCIJ, Kellogg-Briand'
        detail: League requires disputes to go to adjudication or inquiry; PCIJ created (1920); 1928 Pact renounces war as national policy.
      - caption: '1945–1946: Nuremberg and the UN'
        detail: Nuremberg begins international criminal law; the UN replaces the League; the Charter bans force; the ILC is created.
      - caption: '1960: the decolonisation declaration'
        detail: The General Assembly affirms self-determination; more than 80 former colonies have since gained independence.
    sources:
      - Week 01 - Lecture Slides - What Is Public International Law (slides 27–29)
      - 'Week 01 - Lecture Recording (Online) - Introduction to International Law - Full Transcript (16:17–28:50: Vattel and positivism, nineteenth-century institutions, League, Kellogg-Briand, PCIJ, Nuremberg, UN, decolonisation)'
