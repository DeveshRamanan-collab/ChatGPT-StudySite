  - concept: laws2100-w02-law-and-coercion
    plain: Is coercion part of what law is? Some say law is a kind of coercion; others that law regulates it. The key question is whether coercion is necessary to law, or only salient in it.
    concrete: 'Imagine a society of angels: everyone complies with the rules, so nothing ever needs enforcing. Raz argues that even angels face coordination problems, so their community still needs laws, just not coercive ones. If a legal system without coercion can be imagined, coercion is not a necessary feature of the concept of law. Schauer accepts this might be so, but says the law we actually live under is coercive.'
    formal: 'Lamond: interest in law and coercion is ''clarificatory'' and ''evaluative'' (2001, 36). Coercion is law''s genus (Austin); law is a coercive social order (Kelsen); coercion is law''s most salient aspect (Bentham, Holmes, Raz); law regulates coercion (Bobbio); legal practice guides and constrains state coercion (Dworkin). Lamond: coercion is at best ''the most salient aspect of certain legal systems'' (p 56).'
    terms:
      - term: Necessary feature
        gloss: A feature law could not lack. If a legal system without it can be imagined, it is not necessary to the concept of law.
      - term: Salient feature
        gloss: A prominent, significant feature of law as we know and experience it, even if law could exist without it.
      - term: Coercive social order (Kelsen)
        gloss: Law as a distinctive form of social ordering because of its reliance on coercion; Kelsen looks at the legal order as a whole, Austin at individual laws.
    misconceptions:
      - claim: Raz's society of angels shows that angels would need no law at all.
        tempting: If everyone already does what is right, rules seem pointless.
        correction: Raz says even angels face coordination problems, so the community still needs laws; they just need not be coercive. So coercion is not necessary.
      - claim: Because law without sanctions is conceivable, coercion is unimportant to understanding law.
        tempting: The society of angels shows coercion is not necessary.
        correction: 'Schauer: law as experienced is overwhelmingly coercive; whether that matters depends on what a legal theory is supposed to accomplish (p 16). Salient features may count, not only necessary ones.'
      - claim: Lamond holds that coercion is the most salient aspect of law.
        tempting: He lists that view, held by Bentham, Holmes and Raz.
        correction: 'He rejects it: coercion ''is not the most salient aspect of law – at best it is the most salient aspect of certain legal systems'' (p 56).'
    socratic:
      - ask: Can we imagine a legal system with no coercion at all?
        hint: Raz's society of angels.
        answer: 'Raz says yes: angels comply anyway, but still face coordination problems, so they need laws, just not coercive ones.'
      - ask: If that is conceivable, what follows about coercion?
        hint: Necessary means law could not exist without it.
        answer: Coercion is not a necessary feature of the concept of law.
      - ask: Does that make coercion unimportant to a theory of law?
        hint: Look at the law we actually live under.
        answer: 'Not for Schauer: law as experienced is overwhelmingly coercive, so a theory that ignores this may fail to fit the facts.'
      - ask: So who is right, Raz or Schauer?
        hint: What is a theory of law for?
        answer: 'It depends on the aim of legal theory: capturing necessary features, or salient ones too. ''The focus of legal theory is dependent on a conception of what a legal theory is supposed to accomplish'' (Schauer, p 16).'
    what-if:
      - change: In the society of angels there are no coordination problems either.
        effect: Raz's case for coercion-free law rests on coordination problems the community must still solve; without them, the lecture notes, some would say such a society needs no law at all.
      - change: The question becomes whether coercion is the most salient aspect of law, not whether it is necessary.
        effect: The society of angels no longer settles it. Bentham, Holmes and Raz see coercion as most salient; Lamond says at best of certain systems; Schauer points to law as experienced.
    boundary:
      - text: Legal systems where people obey only from fear of sanctions 'meted out solely on the whim of a single individual' (Schauer, p 18).
        why: They fit the coercive model almost perfectly; Schauer uses them to press that a theory ignoring coercion may fail to fit the facts.
      - text: 'Bobbio: law regulates the use of coercion.'
        why: 'Coercion here is law''s object, not its form: forbidding vendetta and limiting force. Coercion stays central, but in a different role from Austin''s or Kelsen''s.'
    transfer:
      - scenario: A worldwide sporting federation has detailed rules but no fines, bans or other enforcement; clubs comply because the rules settle when and where matches happen.
        answer: 'This resembles Raz''s society of angels: rules solving coordination problems without coercion, so coercion would not be necessary to such an order. Schauer would ask what the theory is for: real legal systems are overwhelmingly coercive, and a theory should capture that salient feature too.'
    objections:
      - position: Coercion is a necessary feature of law.
        evidence: 'Austin: coercion is the genus of which law is a species. Kelsen: law is a coercive social order (Lamond, pp 42–45).'
        objection: 'Raz''s society of angels: angels comply anyway but face coordination problems, so they need law without coercion. A coercion-free legal system is conceivable.'
        reply: 'Schauer: perhaps, but law as experienced is overwhelmingly coercive; focusing only on necessary features rests on a contestable view of what legal theory is for (pp 16, 18).'
      - position: Coercion is the most salient aspect of law (Bentham, Holmes, Raz).
        evidence: The legal systems we know rely on enforcement agencies and jails; some offer little reason to obey beyond fear of sanctions (Schauer, p 18).
        objection: 'Lamond: coercion ''is not the most salient aspect of law – at best it is the most salient aspect of certain legal systems''; regulating coercion falls within law''s claim to authority (p 56).'
