        why: 'No warning and no chance to avoid it: the act was wholly involuntary.'
      - text: Both Priya and Noor have contacted the same community legal centre.
        weight: background
        kind: context
      - text: Priya wants to know whether she can sue Callum over the incident with the tyre iron.
        weight: background
        kind: context
