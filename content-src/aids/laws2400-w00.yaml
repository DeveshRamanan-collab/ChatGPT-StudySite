          - s5c
        why: 'Under s 5C(c) a later precaution is not of itself an admission: leave it out of account.'
      - text: Advise Mrs Nguyen whether Bayside breached its duty of care. Do not consider causation, damages or defences.
        weight: background
        kind: context
  - question: laws2400-w00-q023
    parties:
      - name: Tom
        role: electrician and knee-surgery patient; plaintiff
      - name: Dr Okafor
        role: orthopaedic surgeon who did not warn of the nerve risk; defendant
      - name: Harbourview Private Hospital
        role: hospital responsible for the registrar and the ward bathrooms; defendant
    issues:
      - id: framework
        label: 'Three harms: the s 5D(1) framework and the onus (s 5E)'
        concept: laws2400-w10-factual-causation-necessary-condition
      - id: warning
        label: 'Failure to warn: what Tom would have done (s 5D(3))'
        concept: laws2400-w10-common-sense-causation-and-s5d
      - id: delay
        label: 'The registrar''s delay: necessary condition'
        concept: laws2400-w10-factual-causation-necessary-condition
      - id: chance
        label: Why loss of a chance is not recoverable (Tabet v Gett)
        concept: laws2400-w10-risk-chance-and-material-contribution
      - id: bathroom
        label: 'The wrist: unknown timing (Strong v Woolworths)'
        concept: laws2400-w10-factual-causation-necessary-condition
      - id: adeels
        label: Distinguishing Adeels Palace; scope of liability
        concept: laws2400-w10-causation-flowchart
    facts:
      - text: Tom, a 46-year-old electrician, had years of severe knee pain.
        weight: essential
        kind: party
        issues:
          - warning
        why: 'Years of severe pain: a circumstance pointing to him having the operation anyway.'
      - text: His orthopaedic surgeon, Dr Okafor, recommended a knee reconstruction at Harbourview Private Hospital.
        weight: background
        kind: relationship
      - text: Dr Okafor did not tell Tom that the operation carries a 1-in-200 risk of damage to a nerve in the lower leg.
        weight: essential
        kind: conduct
        issues:
          - warning
        why: 'The assumed breach: causation turns on what Tom would have done if warned.'
      - text: The risk materialised, and Tom now has a permanent foot drop.
        weight: essential
        kind: harm
        issues:
          - framework
          - warning
        why: 'Harm one: the foot drop, tested against the failure to warn.'
      - text: Before the operation, Tom had told his GP that the pain was "unbearable"
        weight: essential
        kind: statement
        issues:
          - warning
        why: 'Said before the harm, not hindsight: strong evidence he would have gone ahead.'
      - text: and that he would "do whatever it takes" to get back on the tools.
        weight: essential
        kind: statement
        issues:
          - warning
        why: Shows how determined he was to have the surgery.
      - text: Two years earlier he had had the same operation on his other knee after being warned of the same nerve risk in writing.
        weight: essential
        kind: context
        issues:
          - warning
        why: 'He went ahead before despite the same written warning: probably he would again.'
      - text: Tom now says that if he had been warned this time, he "would never have gone ahead".
        weight: essential
        kind: statement
        issues:
          - warning
        why: 'A self-serving statement made after the harm: inadmissible under s 5D(3)(b).'
      - text: After the operation Tom developed a wound infection.
        weight: background
        kind: harm
      - text: Pathology results showing the infection were sent to the ward, but the registrar did not read them for two days.
        weight: essential
        kind: conduct
        issues:
          - delay
        why: 'The assumed breach: would timely antibiotics probably have avoided the damage?'
      - text: By the time antibiotics were started, the infection had damaged the joint, and Tom needs a further operation.
        weight: essential
        kind: harm
        issues:
          - framework
          - delay
        why: 'Harm two: the joint damage.'
      - text: The experts agree that if antibiotics had been started on time, there was about a 40% chance that the joint damage would have been avoided.
        weight: essential
        kind: statement
        issues:
          - delay
          - chance
        why: 'Under 50%: the damage probably would have happened anyway (Barnett), and a lost chance is not recoverable (Tabet v Gett).'
      - text: Ten days after the operation, Tom slipped on a pool of soapy water on the floor of the ward bathroom and broke his wrist.
        weight: essential
        kind: harm
        issues:
          - framework
          - bathroom
        why: 'Harm three: the wrist, tested against the lack of an inspection system.'
      - text: Harbourview had no system for inspecting or cleaning ward bathrooms during the day
        weight: essential
        kind: conduct
        issues:
          - bathroom
        why: 'The assumed breach: no daytime inspections at all.'
      - text: they were cleaned once each morning at 7 am.
        weight: background
        kind: context
      - text: Tom fell at 4 pm.
        weight: essential
        kind: timing
        issues:
          - bathroom
        why: 'Nine hours after cleaning: a long window in which hourly checks would have found the water.'
      - text: Nobody knows when the water got there
        weight: essential
        kind: context
        issues:
          - bathroom
          - adeels
        why: 'Unknown timing, as in Strong v Woolworths: decided on the balance of probabilities.'
      - text: but a cleaner's trolley with a leaking bucket had been parked outside that bathroom from about 9 am until noon.
        weight: essential
        kind: context
        issues:
          - bathroom
        why: 'The likely source, hours before the fall: probably there long enough for an inspection to find it.'
      - text: The experts agree that a reasonable system would have inspected ward bathrooms at least every hour.
        weight: essential
        kind: statement
        issues:
          - bathroom
          - adeels
        why: 'Hourly checks would probably, not merely possibly, have found the water: unlike Adeels Palace''s ''might have''.'
      - text: For the purposes of this question, assume that Dr Okafor breached his duty by failing to warn Tom, and that Harbourview breached its duty both through the registrar's delay and by having no inspection system.
        weight: essential
        kind: context
        issues:
          - framework
        why: 'Breach is assumed for all three harms: only causation is in issue.'
      - text: Advise Tom whether each breach caused the harm he complains of.
        weight: background
        kind: context
        issues:
          - framework
  - question: laws2400-w00-q024
    parties:
      - name: Dr Mehta
        role: dentist who used the rapid extraction technique; defendant
      - name: Aisha
        role: Dr Mehta's patient whose jaw fractured; plaintiff
      - name: Dr Hughes
        role: dentist who did not prescribe antibiotics; defendant
      - name: Ben
        role: Dr Hughes's patient who developed an infection; plaintiff
    issues:
      - id: s5o-first
        label: s 5O first, with the onus on the professional (Peterkin v Tadros)
        concept: laws2400-w09-professional-standard-s5o
      - id: mehta-s5o
        label: Dr Mehta and s 5O
        concept: laws2400-w09-professional-standard-s5o
      - id: mehta-s5b
        label: 'Aisha: s 5B and the common law professional standard'
        concept: laws2400-w09-breach-of-duty-flowchart
      - id: s5c
        label: s 5C(b) and (c)
        concept: laws2400-w09-reasonable-response-s5b-1c-and-2
      - id: hughes-s5o
        label: 'Dr Hughes: s 5O(1), (3) and (4) and divided opinion'
        concept: laws2400-w09-professional-standard-s5o
      - id: irrational
        label: Irrationality under s 5O(2)
        concept: laws2400-w09-professional-standard-s5o
    facts:
      - text: Dr Mehta and Dr Hughes are dentists in practice together in Parramatta.
        weight: essential
        kind: party
        issues:
          - s5o-first
        why: 'Professionals providing a professional service: s 5O is the first question for each.'
      - text: Aisha, 24, saw Dr Mehta to have an impacted wisdom tooth removed.
        weight: background
        kind: relationship
      - text: Instead of the standard surgical technique, which involves cutting the tooth into sections and takes about 40 minutes
        weight: essential
        kind: context
        issues:
          - mehta-s5b
          - s5c
        why: The standard technique was the obvious precaution; under s 5C(b) another way existing is not of itself enough.
      - text: Dr Mehta used a "rapid extraction" technique he had learned at a short course in Europe.
        weight: essential
        kind: conduct
        issues:
          - mehta-s5o
        why: 'Learned abroad: s 5O asks about practice widely accepted in Australia.'
      - text: It removes the tooth whole with a specially designed lever in about 15 minutes
        weight: background
        kind: context
      - text: and Dr Mehta likes it because it lets him see more patients.
        weight: essential
        kind: mental
        issues:
          - mehta-s5b
        why: 'His reason is convenience and throughput, not patient benefit: little utility to weigh against the risk.'
      - text: The technique applies considerably more force to the jaw.
        weight: essential
        kind: context
        issues:
          - mehta-s5b
        why: A higher, foreseeable risk of fracturing the jaw than the standard technique.
      - text: Aisha's jaw fractured during the procedure; she needed surgery and spent six weeks on a liquid diet.
        weight: essential
        kind: harm
        issues:
          - mehta-s5b
        why: The serious harm the extra force risked.
      - text: Dr Mehta's expert says the technique is "promising" and is used by some dentists in Germany and Italy.
        weight: essential
        kind: statement
        issues:
          - mehta-s5o
        why: Use in Germany and Italy is not practice widely accepted in Australia.
      - text: Both experts agree that, apart from Dr Mehta and one colleague in Brisbane, no dentist in Australia uses it.
        weight: essential
        kind: statement
        issues:
          - mehta-s5o
        why: 'Two practitioners are not wide acceptance by peer professional opinion: s 5O fails.'
      - text: After Aisha's injury, Dr Mehta stopped using it.
        weight: essential
        kind: conduct
        issues:
          - s5c
        why: Under s 5C(c) a later change of practice is not of itself an admission of liability.
      - text: Ben, 31 and in good health
        weight: essential
        kind: party
        issues:
          - hughes-s5o
        why: 'A healthy patient: the group the guideline against routine antibiotics covers.'
      - text: had root canal treatment performed by Dr Hughes.
        weight: background
        kind: relationship
      - text: Dr Hughes did not prescribe antibiotics afterwards.
        weight: essential
        kind: conduct
        issues:
          - hughes-s5o
        why: 'The conduct to test: was it widely accepted in Australia as competent practice?'
      - text: Ben developed a serious infection and spent three days in hospital.
        weight: essential
        kind: harm
        issues:
          - irrational
        why: The very risk Ben's expert says makes withholding antibiotics irrational.
      - text: The expert evidence shows that Australian dentists are divided.
        weight: essential
        kind: statement
        issues:
          - hughes-s5o
        why: 'Divided opinion: under s 5O(3) differing widely accepted opinions do not prevent reliance on one.'
      - text: A substantial body of practitioners, supported by a national clinical guideline, does not prescribe antibiotics after routine root canal treatment in healthy patients
        weight: essential
        kind: statement
        issues:
          - hughes-s5o
        why: 'Practice widely accepted by peer professional opinion and backed by a guideline: s 5O(1) likely met.'
      - text: because of concern about antibiotic resistance.
        weight: essential
        kind: context
        issues:
          - irrational
        why: 'A reasoned basis for the practice: hard to call it irrational under s 5O(2).'
      - text: Another substantial body routinely prescribes them.
        weight: essential
        kind: statement
        issues:
          - hughes-s5o
        why: A competing body does not defeat s 5O (s 5O(3)), and acceptance need not be universal (s 5O(4)).
      - text: Ben's expert, who belongs to the second group, says that withholding antibiotics is "irrational", because infections like Ben's are well known.
        weight: essential
        kind: statement
        issues:
          - irrational
        why: 'The s 5O(2) attack: a well-known risk does not make a reasoned contrary practice irrational.'
      - text: Both dentists say they acted as competent professionals and cannot be liable.
        weight: essential
        kind: statement
        issues:
          - s5o-first
        why: 'Each must prove the s 5O defence: the onus is on the professional (Peterkin v Tadros).'
      - text: Assume that each dentist owed the patient a duty of care and that, if breach is established, it caused the patient's harm.
        weight: background
        kind: context
      - text: Advise Aisha and Ben whether Dr Mehta and Dr Hughes breached their duties.
        weight: background
        kind: context
  - question: laws2400-w00-q025
    parties:
      - name: Zara
        role: cyclist injured twice; plaintiff
      - name: FreshCo Produce Pty Ltd
        role: Kai's employer; defendant
      - name: Kai
        role: FreshCo delivery driver who blocked the bicycle lane
      - name: Dev
        role: speeding driver who hit Zara; defendant, now bankrupt
    issues:
      - id: framework
        label: 'The s 5D(1) framework: factual causation separate from scope'
        concept: laws2400-w10-causation-flowchart
      - id: dev
        label: 'Necessary condition: Dev'
        concept: laws2400-w10-factual-causation-necessary-condition
      - id: freshco
        label: 'Necessary condition: FreshCo, and multiple causes'
        concept: laws2400-w10-factual-causation-necessary-condition
      - id: chain
        label: Is the chain from FreshCo broken? (March v Stramare)
        concept: laws2400-w10-common-sense-causation-and-s5d
      - id: wrist
        label: 'The wrist fracture: a new intervening act? (McKew)'
        concept: laws2400-w11-novus-actus-volitional-acts-and-coincidences
      - id: joint
        label: Joint and several liability, contribution and Dev's bankruptcy
        concept: laws2400-w10-contribution-between-tortfeasors
    facts:
      - text: At 6 am on a dark winter morning
        weight: essential
        kind: timing
        issues:
          - chain
        why: Darkness made an unlit truck in the bicycle lane especially hazardous.
      - text: Kai, a driver for FreshCo Produce Pty Ltd
        weight: background
        kind: relationship
      - text: stopped his delivery truck across the marked bicycle lane of a busy inner-city road, in a no-stopping zone, so he could unload outside a café.
        weight: essential
        kind: conduct
        issues:
          - freshco
          - chain
        why: 'The obstruction forced cyclists into traffic: the hazard that set the accident going, as in March v Stramare.'
      - text: He did not turn on the truck's hazard lights.
        weight: essential
        kind: conduct
        issues:
          - freshco
        why: Made the obstruction harder to see in the dark.
      - text: He had done this most mornings for a year.
        weight: background
        kind: context
      - text: Zara was riding to work along the bicycle lane
        weight: background
        kind: context
      - text: faster than usual because she was late, and glancing down at the map on her phone.
        weight: essential
        kind: conduct
        issues:
          - chain
        why: Zara's inattention is a concurrent cause, not one that breaks the chain; contributory negligence is excluded.
      - text: She looked up late, saw the truck, and swerved out of the bicycle lane into the traffic lane.
        weight: essential
        kind: conduct
        issues:
          - freshco
          - chain
        why: 'Swerving to avoid the truck: the very response the obstruction invited.'
      - text: She was hit by a car driven by Dev, who was travelling at 75 km/h in a 50 km/h zone.
        weight: essential
        kind: conduct
        issues:
          - dev
        why: 'Dev''s speeding: the breach to test for necessary condition.'
      - text: A collision expert says that at 50 km/h Dev would have been able to stop before reaching her.
        weight: essential
        kind: statement
        issues:
          - dev
        why: 'But for the speeding there would have been no collision: a necessary condition.'
      - text: Zara suffered a fractured pelvis.
        weight: essential
        kind: harm
        issues:
          - framework
          - joint
        why: 'Harm one: the pelvis, to which both defendants contributed.'
      - text: FreshCo says that Zara's own inattention and Dev's speeding caused the accident, not its truck.
        weight: essential
        kind: statement
        issues:
          - freshco
          - chain
        why: A necessary condition need not be the only cause; Dev's negligence does not break the chain.
      - text: Dev says that Zara swerved into his path without warning and that the truck had nothing to do with him.
        weight: essential
        kind: statement
        issues:
          - dev
        why: 'Beside the point: at the legal speed he would have stopped in time.'
      - text: Six weeks later, Zara was walking on crutches.
        weight: background
        kind: timing
      - text: Her physiotherapist had told her clearly not to use stairs without a handrail.
        weight: essential
        kind: statement
        issues:
          - wrist
        why: 'Clear advice: her later choice was informed, as in McKew.'
      - text: Running late for a medical appointment and not wanting to wait for the lift
        weight: essential
        kind: mental
        issues:
          - wrist
        why: 'A minor reason for running a known risk: points towards a voluntary act breaking the chain.'
      - text: she went down a steep, unlit fire stair without a handrail in her office building.
        weight: essential
        kind: conduct
        issues:
          - wrist
        why: Unreasonable conduct in the face of known danger, as in McKew v Holland and Hannen and Cubitts.
      - text: Her weak leg gave way and she fractured her wrist.
        weight: essential
        kind: harm
        issues:
          - wrist
          - framework
        why: 'Harm two: the weak leg links it to the accident, but it may fall outside scope of liability.'
      - text: Dev has since been declared bankrupt.
        weight: essential
        kind: context
        issues:
          - joint
        why: 'Joint and several liability: Zara can recover in full from FreshCo, which bears the risk of Dev''s insolvency.'
      - text: Assume that FreshCo (which is responsible for Kai's conduct) and Dev each owed Zara a duty of care and breached it.
        weight: background
        kind: context
      - text: Do not consider contributory negligence, which is covered in a later topic.
        weight: background
        kind: context
      - text: Advise Zara whether FreshCo and Dev caused her injuries, and from whom she can recover.
        weight: background
        kind: context
        issues:
          - framework
          - joint
  - question: laws2400-w00-q026
    parties:
      - name: Hana
        role: 70-year-old shopper injured twice; plaintiff
      - name: Theo
        role: 13-year-old who threw the bottle; defendant
      - name: Liam
        role: Parkview cleaner driving the floor scrubber; defendant
      - name: Parkview Centre Pty Ltd
        role: centre operator; vicariously liable for Liam; defendant
    issues:
      - id: objective
        label: The objective standard of care and its limits
        concept: laws2400-w09-the-reasonable-person
      - id: theo
        label: 'Theo: the child standard'
        concept: laws2400-w09-the-reasonable-person
      - id: liam
        label: 'Liam: the objective standard despite inexperience'
        concept: laws2400-w09-the-reasonable-person
      - id: risk
        label: 'Parkview: identifying the risk of harm'
        concept: laws2400-w09-identifying-the-risk-of-harm
      - id: s5b1
        label: 's 5B(1)(a) and (b): the visitor-numbers argument'
        concept: laws2400-w09-not-insignificant-risk-s5b-1b
      - id: s5b2
        label: Weighing the s 5B(2) considerations
        concept: laws2400-w09-reasonable-response-s5b-1c-and-2
      - id: arguments
        label: 'Parkview''s other arguments: Dederer and s 5C(b)'
        concept: laws2400-w09-reasonable-response-s5b-1c-and-2
    facts:
      - text: Parkview Shopping Centre has a mezzanine food court that overlooks the main ground-floor walkway.
        weight: essential
        kind: context
        issues:
          - risk
        why: 'People walk beneath a raised edge: things falling or thrown from the mezzanine is the risk.'
      - text: During renovations, Parkview Centre Pty Ltd removed a six-metre section of the glass balustrade along the mezzanine edge so that it could be replaced.
        weight: essential
        kind: conduct
        issues:
          - risk
          - s5b2
        why: 'Parkview created the gap: the source of the risk.'
      - text: For nine days during the school holidays
        weight: essential
        kind: timing
        issues:
          - s5b1
          - s5b2
        why: 'School holidays: more teenagers about, so misuse of the gap is more likely.'
      - text: the gap was closed off only by plastic tape and a sign reading "Keep clear — renovation".
        weight: essential
        kind: conduct
        issues:
          - arguments
          - s5b2
        why: 'A minimal precaution: tape and a sign do not stop things being thrown through the gap.'
      - text: Parkview's builder had offered to put up a temporary timber hoarding across the gap for $900
        weight: essential
        kind: context
        issues:
          - s5b2
        why: 'A cheap, effective precaution was on offer: a low burden under s 5B(2)(c).'
      - text: Parkview declined, saying the new glass would be in "within a few days".
        weight: essential
        kind: conduct
        issues:
          - s5b2
        why: Rejecting a $900 precaution for convenience weighs towards breach.
      - text: Security reports logged two incidents in the first week of teenagers dropping drink cups through the gap onto the walkway below
        weight: essential
        kind: context
        issues:
          - s5b1
          - risk
        why: 'Actual knowledge of the very misuse: the risk was foreseeable and not insignificant.'
      - text: one cup landed in a pram, but no one was hurt.
        weight: essential
        kind: context
        issues:
          - s5b1
          - arguments
        why: A near miss; no injury so far does not make the risk insignificant (RTA v Dederer).
      - text: On day nine, Theo, aged 13, was standing at the gap with friends.
        weight: essential
        kind: party
        issues:
          - theo
        why: A 13-year-old is judged against an ordinary child of his age (McHale v Watson).
      - text: To show off
        weight: essential
        kind: mental
        issues:
          - theo
        why: Motive does not matter; the question is what an ordinary 13-year-old would foresee.
      - text: he threw a full one-litre frozen drink bottle towards a bin on the ground floor "to see if he could get it in".
        weight: essential
        kind: conduct
        issues:
          - theo
        why: 'A heavy frozen bottle thrown over a crowded walkway: an ordinary 13-year-old would see the danger.'
      - text: He missed, and the bottle struck Hana, aged 70, on the head.
        weight: essential
        kind: harm
        issues:
          - theo
          - risk
        why: 'The very risk Parkview faced: something thrown through the gap striking a person below.'
      - text: Theo's mother says he has always been impulsive and immature for his age.
        weight: essential
        kind: statement
        issues:
          - theo
          - objective
        why: 'Theo''s own immaturity is irrelevant: the standard is an ordinary child of 13.'
      - text: Dazed, Hana stumbled sideways into the path of a ride-on floor scrubber
        weight: background
        kind: context
      - text: driven by Liam, a Parkview cleaner in his first week
        weight: essential
        kind: party
        issues:
          - liam
          - objective
        why: 'A new employee: inexperience does not lower the standard (Imbree v McNeilly).'
      - text: who was driving it at full speed through the crowded walkway while looking down at its control screen.
        weight: essential
        kind: conduct
        issues:
          - liam
        why: 'Full speed through a crowd while looking down: below the standard of a reasonable operator.'
      - text: Parkview's written procedure requires scrubbers in crowded areas to be driven at walking pace with a spotter.
        weight: essential
        kind: statement
        issues:
          - liam
        why: The procedure shows what reasonable care required.
      - text: Liam says no one showed him the procedure and he was doing his best.
        weight: essential
        kind: statement
        issues:
          - liam
          - objective
        why: Doing his best is no answer to an objective standard.
      - text: The scrubber ran over Hana's foot, crushing it.
        weight: background
        kind: harm
      - text: 'Parkview says: the centre has 20,000 visitors a day, so two dropped cups showed the risk was tiny'
        weight: essential
        kind: statement
        issues:
          - s5b1
        why: Two incidents in one week show a real risk; probability is judged prospectively (Dederer; Wyong v Shirt).
      - text: it cannot be expected to stop teenagers misbehaving
        weight: essential
        kind: statement
        issues:
          - arguments
          - risk
        why: Parkview need not control teenagers, only close the gap it created against foreseeable misuse.
      - text: the sign and tape were a reasonable warning
        weight: essential
        kind: statement
        issues:
          - arguments
        why: A warning cannot stop objects being thrown through an open gap.
      - text: keeping the food court open during the holidays benefited shoppers and tenants
        weight: essential
        kind: statement
        issues:
          - s5b2
        why: 'Social utility: a hoarding would have kept the food court open anyway.'
      - text: and Hana's lawyers' suggestion that the glass could have been replaced at night, one panel at a time, is beside the point.
        weight: essential
        kind: statement
        issues:
          - arguments
        why: 'Under s 5C(b) another method is not of itself liability: rely on the rejected hoarding instead.'
      - text: Assume that Theo, Liam and Parkview each owed Hana a duty of care, that Parkview is vicariously liable for Liam, and that causation is established.
        weight: background
        kind: context
      - text: Do not consider defences.
        weight: background
        kind: context
      - text: Advise Hana whether Theo, Liam and Parkview each breached their duty of care.
        weight: background
        kind: context
  - question: laws2400-w00-q027
    parties:
      - name: Sam
        role: groundsman struck in the eye; plaintiff
      - name: Priya
        role: golfer who teed off at the same time as Mark; defendant
      - name: Mark
        role: golfer who teed off at the same time as Priya; defendant
      - name: Ridgeline Golf Club
        role: course owner with the broken warning bell; defendant
      - name: GreenEdge Turf Pty Ltd
        role: Sam's employer; course maintenance contractor
    issues:
      - id: breach
        label: Breach by Priya and Mark (s 5B)
        concept: laws2400-w09-breach-of-duty-flowchart
      - id: necessary
        label: Necessary condition against each player
        concept: laws2400-w10-factual-causation-necessary-condition
      - id: for-s5d2
        label: 'For s 5D(2): Cook v Lewis and the flowchart requirements'
        concept: laws2400-w10-s5d2-exceptional-cases
      - id: against-s5d2
        label: 'Against s 5D(2): material contribution v increased risk'
        concept: laws2400-w10-multiple-sufficient-causes-and-material-contribution
      - id: club
        label: 'The club''s broken bell: Adeels Palace and Barnett'
        concept: laws2400-w10-factual-causation-necessary-condition
      - id: recovery
        label: Recovery and contribution if both players are liable
        concept: laws2400-w10-contribution-between-tortfeasors
    facts:
      - text: Ridgeline Golf Club hosted a corporate golf day.
        weight: background
        kind: context
      - text: Sam, a groundsman employed by GreenEdge Turf Pty Ltd, a contractor that maintains the course
        weight: background
        kind: party
      - text: was mowing the approach to the 7th green, which lies beyond a blind crest about 220 metres from the 6th tee.
        weight: essential
        kind: context
        issues:
          - breach
        why: 'Within range but out of sight behind a crest: an obvious risk of being struck.'
      - text: Priya and Mark were playing together.
        weight: background
        kind: party
      - text: Standing on the 6th tee, both could see the top of Sam's mower over the crest
        weight: essential
        kind: mental
        issues:
          - breach
        why: 'Each knew someone was in the line of play: the risk was foreseeable.'
      - text: and Mark joked that they should "give the mower a fright".
        weight: essential
        kind: statement
        issues:
          - breach
        why: Shows awareness of the mower, and a casual attitude to the risk.
      - text: They had a $50 bet on the longer drive.
        weight: essential
        kind: context
        issues:
          - breach
        why: Both were trying to hit as far as possible, towards the crest.
      - text: Rather than waiting for Sam to move on, they agreed to tee off at the same time "to keep things moving".
        weight: essential
        kind: conduct
        issues:
          - breach
          - for-s5d2
          - recovery
        why: 'A joint decision to hit together: both in breach, and the cause of the uncertainty over whose ball it was.'
      - text: Neither called "fore".
        weight: essential
        kind: conduct
        issues:
          - breach
        why: 'No warning: a simple, costless precaution not taken.'
      - text: Both hit identical balls of the same brand and model, supplied in the club's corporate gift pack, in the same direction.
        weight: essential
        kind: context
        issues:
          - necessary
          - for-s5d2
        why: 'Identical balls in the same direction: no way to prove whose ball it was, the Cook v Lewis problem.'
      - text: One ball came over the crest and struck Sam in the left eye
        weight: essential
        kind: harm
        issues:
          - necessary
        why: Only one ball caused the injury.
      - text: the other landed nearby.
        weight: essential
        kind: context
        issues:
          - against-s5d2
        why: 'The other ball caused nothing: that player only increased the risk rather than materially contributing.'
      - text: Nobody saw which ball hit Sam, and there is no way to tell.
        weight: essential
        kind: context
        issues:
          - necessary
          - for-s5d2
        why: 'An evidentiary gap: necessary condition cannot be proved against either player.'
      - text: Sam has permanently lost the sight in that eye.
        weight: background
        kind: harm
      - text: A sign on the 6th tee tells players to wait for a bell, rung by a member of staff on the crest, before driving.
        weight: essential
        kind: context
        issues:
          - club
        why: The club's own safety system for the blind crest.
      - text: The bell had been broken for a month, and the club had not repaired it
        weight: essential
        kind: conduct
        issues:
          - club
        why: 'The club''s assumed breach: causation is the question.'
      - text: although a repair would have cost $150.
        weight: background
        kind: context
      - text: Sam's lawyers have an expert who says that a working bell "might have" made the players wait.
        weight: essential
        kind: statement
        issues:
          - club
        why: '''Might have'' is not ''probably would have'': as in Adeels Palace, necessary condition is not proved.'
      - text: Priya and Mark both admit they knew the mower was there.
        weight: essential
        kind: statement
        issues:
          - breach
          - club
        why: They knew and hit anyway, so a bell probably would have made no difference (Barnett).
      - text: Sam's claim is not a dust disease or tobacco claim.
        weight: essential
        kind: context
        issues:
          - necessary
          - for-s5d2
        why: 'So s 3B(1) does not exclude the CLA: s 5D governs causation.'
      - text: Assume that Priya, Mark and the club each owed Sam a duty of care, and that the club breached its duty by failing to repair the bell.
        weight: background
        kind: context
      - text: Do not consider defences.
        weight: background
        kind: context
      - text: Advise Sam on his claims in negligence against Priya, Mark and the club, including whether Priya and Mark breached their duties, whether each defendant's negligence caused his injury, and from whom he could recover.
        weight: background
        kind: context
        issues:
          - breach
          - necessary
          - recovery
