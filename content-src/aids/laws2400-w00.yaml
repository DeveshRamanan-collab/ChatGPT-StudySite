  - question: laws2400-w00-q006
    parties:
      - name: Kwame
        role: footballer injured twice, then treated without consent; plaintiff
      - name: Deng
        role: opposing player who tackled, then elbowed Kwame; defendant
      - name: Sam
        role: club's contracted physiotherapist; defendant
    issues:
      - id: tackle
        label: 'The first tackle: scope of consent'
        concept: laws2400-w04-consent-validity-and-scope
      - id: elbow
        label: The elbow strike (McNamara v Duncan)
        concept: laws2400-w04-consent-validity-and-scope
      - id: distinction
        label: Contact within the rules v deliberately inflicted injury
        concept: laws2400-w04-consent-validity-and-scope
      - id: needling
        label: 'The dry-needling: scope of consent'
        concept: laws2400-w04-consent-validity-and-scope
      - id: dean
        label: Dean v Phung applied to the dry-needling
        concept: laws2400-w04-consent-validity-and-scope
      - id: touching
        label: 'Rixon v Star City: any unlawful touching'
        concept: laws2400-w02-battery
      - id: remedies
        label: Conclusions and remedies against Deng and Sam
        concept: laws2400-w02-remedies-intentional-torts-to-person
    facts:
      - text: Kwame and Deng played on opposing teams in a social Sunday football league.
        weight: essential
        kind: relationship
        issues:
          - tackle
        why: 'Both chose to play a contact sport: consent to contact within its rules and usages.'
      - text: Midway through the second half
        weight: background
        kind: timing
      - text: Deng slid in late on a tackle for the ball
        weight: essential
        kind: conduct
        issues:
          - tackle
          - distinction
        why: 'Contact while going for the ball: the kind of risk players consent to.'
      - text: catching Kwame's ankle and bruising it
        weight: background
        kind: harm
      - text: a hard but unremarkable challenge of the kind that happens regularly in the competition, and one the referee did not even penalise.
        weight: essential
        kind: context
        issues:
          - tackle
          - distinction
        why: 'Ordinary, unpenalised play: squarely within the scope of consent.'
      - text: Kwame accepted this as part of the game.
        weight: essential
        kind: mental
        issues:
          - tackle
        why: 'Kwame''s own acceptance confirms consent to this contact: no claim.'
      - text: Ten minutes later, well after the ball had moved to the other end of the field and with no play near either of them
        weight: essential
        kind: timing
        issues:
          - elbow
          - distinction
        why: 'Far from the play: the strike had no connection with the game, so falls outside consent.'
      - text: Deng — still angry about an earlier foul Kwame had committed on him
        weight: essential
        kind: mental
        issues:
          - elbow
          - remedies
        why: A retaliatory motive, as in McNamara v Duncan; supports aggravated damages.
      - text: jogged up behind Kwame and deliberately drove his elbow into the side of Kwame's jaw.
        weight: essential
        kind: conduct
        issues:
          - elbow
          - distinction
          - touching
        why: 'A deliberate blow outside the play: battery not covered by consent to the sport.'
      - text: Kwame went down immediately; he was later diagnosed with a fractured jaw requiring surgical wiring.
        weight: essential
        kind: harm
        issues:
          - remedies
        why: 'Serious injury deliberately inflicted: compensatory and aggravated damages.'
      - text: After being stretchered off, Kwame was seen by Sam
        weight: background
        kind: context
      - text: the club's contracted physiotherapist, who had treated players from both teams for years.
        weight: essential
        kind: relationship
        issues:
          - needling
        why: A long treating relationship does not supply consent to new, unrequested treatment.
      - text: Sam examined Kwame's jaw, arranged an ambulance
        weight: essential
        kind: conduct
        issues:
          - needling
        why: 'Care Kwame needed and accepted: within the scope of his consent.'
      - text: noticing Kwame was already lying on the treatment table waiting for the ambulance
        weight: background
        kind: context
      - text: decided to also perform a course of dry-needling on Kwame's shoulder, a treatment technique involving inserting needles into muscle tissue.
        weight: essential
        kind: conduct
        issues:
          - needling
          - dean
          - touching
        why: 'An invasive touching of a different body part: outside any consent to care for the jaw.'
      - text: Sam had noticed some tightness in Kwame's shoulder during the examination
        weight: background
        kind: mental
      - text: and thought Kwame would appreciate having it addressed "while he was already there."
        weight: essential
        kind: mental
        issues:
          - dean
          - needling
        why: 'Sam''s good intentions are no answer: assuming the patient would welcome it is not consent.'
      - text: Kwame had never mentioned any shoulder problem, had not asked for treatment of it
        weight: essential
        kind: statement
        issues:
          - needling
        why: 'No request and no express consent: the shoulder was outside anything Kwame agreed to.'
      - text: was not told the dry-needling was going to happen or asked whether he wanted it
        weight: essential
        kind: conduct
        issues:
          - needling
          - dean
        why: Kwame was never told or asked, so he had no chance to consent to this procedure.
      - text: and later said that had he been asked, he would have refused
        weight: essential
        kind: statement
        issues:
          - needling
        why: 'Confirms the touching was against his wishes: consent cannot be presumed.'
      - text: since he dislikes needles and had a bad reaction to acupuncture two years earlier.
        weight: background
        kind: context
      - text: Advise Kwame on any claims he may have against Deng and against Sam.
        weight: background
        kind: context
  - question: laws2400-w00-q007
    parties:
      - name: BuildRight Pty Ltd
        role: builder renovating the heritage building; defendant
      - name: Deacon
        role: BuildRight's site foreperson (employee)
      - name: Mariana
        role: fruit shop owner on Anzac Lane; plaintiff
    issues:
      - id: elements
        label: 'Public nuisance: the elements'
        concept: laws2400-w03-public-nuisance
      - id: obstruction
        label: 'Obstruction: substantial and unreasonable?'
        concept: laws2400-w03-public-nuisance
      - id: special-damage
        label: 'Title to sue: special damage (Walsh v Ervin)'
        concept: laws2400-w03-public-nuisance
      - id: others
        label: The other shopkeepers
        concept: laws2400-w03-public-nuisance
      - id: vicarious
        label: 'Vicarious liability: course of employment'
        concept: laws2400-w01-vicarious-liability-intro
      - id: fleming
        label: 'Disobeyed instructions: Fleming''s policy rationale'
        concept: laws2400-w01-vicarious-liability-intro
      - id: remedies
        label: Conclusion and remedies
        concept: laws2400-w03-nuisance-defences-remedies
    facts:
      - text: BuildRight Pty Ltd is renovating a heritage building fronting Anzac Lane
        weight: background
        kind: party
      - text: a narrow public laneway that is the only vehicle access to a row of six small shops
        weight: essential
        kind: context
        issues:
          - elements
          - obstruction
        why: 'A public way: blocking it interferes with a right shared by the public, the core of public nuisance.'
      - text: including a fruit shop run by Mariana.
        weight: background
        kind: party
      - text: For three weeks
        weight: essential
        kind: timing
        issues:
          - obstruction
        why: 'Sustained over three weeks: a substantial obstruction, not a fleeting one.'
      - text: BuildRight's site foreperson, Deacon — an employee responsible for day-to-day management of the site
        weight: essential
        kind: relationship
        issues:
          - vicarious
        why: 'An employee managing the site day to day: the obstruction arose in doing BuildRight''s work.'
      - text: stored scaffolding materials and parked the company's delivery truck across the full width of the laneway every day during trading hours
        weight: essential
        kind: conduct
        issues:
          - elements
          - obstruction
          - vicarious
        why: 'Blocking the whole lane in trading hours with site materials and the company truck: a substantial, unreasonable obstruction.'
      - text: without seeking any permit or approval from the local council.
        weight: essential
        kind: context
        issues:
          - obstruction
        why: 'No council permission: nothing makes the obstruction lawful or reasonable.'
      - text: Deacon did this despite an explicit written instruction from BuildRight's project manager, sent to all site staff before work began, that the laneway "must remain clear for through traffic during business hours at all times."
        weight: essential
        kind: statement
        issues:
          - vicarious
          - fleming
        why: 'An express prohibition: does disobedience take Deacon outside his employment? Fleming''s rationale says BuildRight should still bear the loss.'
      - text: The other shopkeepers on the lane experienced only minor inconvenience
        weight: essential
        kind: harm
        issues:
          - others
        why: 'Inconvenience shared with the public at large: no special damage, so no title to sue.'
      - text: their suppliers could still reach the shops on foot around the truck, and none suffered any financial loss.
        weight: essential
        kind: context
        issues:
          - others
        why: No particular loss beyond that of the general public.
      - text: Mariana's shop is different.
        weight: background
        kind: context
      - text: Her fruit shop depends on twice-daily deliveries of refrigerated produce by a small van that cannot fit past the blockage.
        weight: essential
        kind: context
        issues:
          - special-damage
        why: Her business depends on vehicle access, so she is affected differently from the public.
      - text: For the full three weeks, she was forced to pay a subcontractor $180 a day to hand-cart produce from the nearest legal parking spot, a full block away.
        weight: essential
        kind: harm
        issues:
          - special-damage
          - remedies
        why: 'Particular financial loss: special damage giving title to sue (Walsh v Ervin), recoverable as damages.'
      - text: On four occasions during hot afternoons, deliveries left waiting too long in the heat while the workaround was arranged had to be discarded, at a cost of roughly $950 in total spoiled stock.
        weight: essential
        kind: harm
        issues:
          - special-damage
          - remedies
        why: 'Further particular loss caused by the obstruction: recoverable special damage.'
      - text: Mariana complained to BuildRight's head office twice during the three weeks
        weight: essential
        kind: statement
        issues:
          - fleming
          - obstruction
        why: 'BuildRight itself was told twice and did nothing: it was best placed to stop the harm.'
      - text: but nothing changed until the scaffolding was finally removed.
        weight: background
        kind: timing
      - text: She now wants to recover the cost of the hand-cart workaround and her spoiled stock from BuildRight
        weight: background
        kind: context
        issues:
          - remedies
      - text: which denies responsibility, pointing out that Deacon was expressly told to keep the laneway clear and that blocking it was entirely his own doing.
        weight: essential
        kind: statement
        issues:
          - vicarious
          - fleming
        why: BuildRight's answer is the express instruction; the employee must still have committed the tort, which Deacon did.
      - text: Advise Mariana.
        weight: background
        kind: context
  - question: laws2400-w00-q008
    parties:
      - name: Coastal Shire Council
        role: manager of the Sundown Point reserve; defendant
      - name: Tegan
        role: tourist who fell at the cliff edge; plaintiff
    issues:
      - id: elements
        label: 'Negligence: duty, breach and damage'
        concept: laws2400-w05-negligence-elements-overview
      - id: scope
        label: 'The occupier''s duty: scope, not existence'
        concept: laws2400-w06-occupiers-liability-and-obvious-risk
      - id: romeo
        label: Romeo v Conservation Commission (NT) applied
        concept: laws2400-w06-occupiers-liability-and-obvious-risk
      - id: s5f
        label: 'Obvious risk: the s 5F objective test'
        concept: laws2400-w06-occupiers-liability-and-obvious-risk
      - id: s5g
        label: 'Presumed awareness under s 5G: can Tegan rebut it?'
        concept: laws2400-w06-occupiers-liability-and-obvious-risk
      - id: s5h
        label: No duty to warn of an obvious risk (s 5H) and its exceptions
        concept: laws2400-w06-occupiers-liability-and-obvious-risk
    facts:
      - text: Coastal Shire Council manages "Sundown Point," a popular lookout reserve.
        weight: essential
        kind: relationship
        issues:
          - scope
        why: The council controls the reserve, so a duty is owed to visitors; the question is its scope.
      - text: A formed walking track leads visitors to a viewing area set back from the edge of a forty-metre limestone cliff.
        weight: essential
        kind: context
        issues:
          - romeo
          - scope
        why: 'A safe, set-back viewing area is provided, as in Romeo: visitors need not go to the edge.'
      - text: Beyond the viewing area, the cliff edge itself is unfenced
        weight: essential
        kind: context
        issues:
          - romeo
        why: 'No fence at the edge: the precaution Tegan says was required.'
      - text: loose gravel and crumbling limestone are visible along the last few metres before the drop.
        weight: essential
        kind: context
        issues:
          - s5f
          - s5g
        why: 'The hazard is visible: points to a risk obvious to a reasonable person in her position.'
      - text: 'A small sign at the start of the track reads: "Cliffs ahead — stay on the marked path."'
        weight: essential
        kind: statement
        issues:
          - s5h
          - romeo
        why: A warning was given anyway; under s 5H no warning of an obvious risk is required.
      - text: The council has never fenced the cliff edge
        weight: essential
        kind: conduct
        issues:
          - romeo
        why: A deliberate choice not to fence a natural cliff along the whole reserve.
      - text: reasoning (in internal correspondence obtained by Tegan's lawyers) that fencing the entire clifftop across the reserve would be extremely costly and would also block the very views that make the reserve popular.
        weight: essential
        kind: mental
        issues:
          - romeo
        why: Cost and loss of the views weigh against fencing, echoing Romeo on natural landscapes.
      - text: Tegan, a tourist visiting the area for the first time
        weight: essential
        kind: party
        issues:
          - s5g
        why: 'A first-time visitor: her best argument for rebutting the presumption of awareness.'
      - text: walked past the viewing area and along the cliff edge itself to get a better angle for a photograph.
        weight: essential
        kind: conduct
        issues:
          - romeo
          - s5f
        why: 'She left the safe area for the very edge: a choice Romeo says occupiers need not guard against.'
      - text: As she stepped closer to the drop, the loose gravel gave way beneath her
        weight: essential
        kind: context
        issues:
          - s5f
        why: The risk that materialised was the visible loose ground at the edge.
      - text: and she slipped, falling several metres down a steep but non-vertical section of the slope before a ledge stopped her fall.
        weight: background
        kind: harm
      - text: She suffered a badly broken leg requiring surgery.
        weight: essential
        kind: harm
        issues:
          - elements
        why: 'Physical injury: the damage element is satisfied.'
      - text: Tegan says that anyone looking at the sign would think it referred to a general safety reminder rather than to the specific danger of loose, crumbling ground right at the cliff edge
        weight: essential
        kind: statement
        issues:
          - s5h
        why: An attack on the adequacy of the warning; s 5H removes any duty to warn of an obvious risk.
      - text: and that the council should either have fenced the edge or put up a far more specific sign describing the risk of the ground itself giving way.
        weight: essential
        kind: statement
        issues:
          - romeo
          - s5h
        why: 'The precautions alleged: fencing or a specific warning sign.'
      - text: She has never visited a cliff-top lookout before
        weight: essential
        kind: context
        issues:
          - s5g
        why: Inexperience may help rebut s 5G, but the s 5F test stays objective.
      - text: and says she did not appreciate how unstable the very edge of the cliff could be.
        weight: essential
        kind: mental
        issues:
          - s5g
          - s5f
        why: 'Lack of actual awareness: she must prove this to rebut s 5G.'
      - text: Tegan is suing Coastal Shire Council in negligence.
        weight: background
        kind: context
        issues:
          - elements
      - text: Advise the council.
        weight: background
        kind: context
  - question: laws2400-w00-q009
    parties:
      - name: DenRail
        role: rail operator that admitted the scheduling error; defendant
      - name: James
        role: off-duty emergency nurse who helped at the crash; plaintiff
      - name: Mel
        role: James's sister, who arrived after the rescue; plaintiff
    issues:
      - id: part3
        label: 'CLA Part 3: pure mental harm (s 27)'
        concept: laws2400-w06-psychiatric-harm-civil-liability-act
      - id: s32
        label: The s 32 duty test and its circumstances
        concept: laws2400-w06-psychiatric-harm-civil-liability-act
      - id: james-s32
        label: 'James: s 32 applied'
        concept: laws2400-w06-psychiatric-harm-civil-liability-act
      - id: s31
        label: A recognised psychiatric illness (s 31)
        concept: laws2400-w06-psychiatric-harm-civil-liability-act
      - id: s30
        label: 'Witnessing at the scene: s 30(2)(a) and Wicks'
        concept: laws2400-w06-psychiatric-harm-civil-liability-act
      - id: mel
        label: 'Mel: fitting her claim within s 30 and s 32'
        concept: laws2400-w06-psychiatric-harm-civil-liability-act
      - id: common-law
        label: 'Common law backdrop: Tame and Annetts; normal fortitude'
        concept: laws2400-w06-psychiatric-harm-common-law-development
    facts:
      - text: DenRail operates the interstate freight and passenger line running through the rural town of Denholm.
        weight: background
        kind: party
      - text: On a foggy morning, a scheduling error — later admitted by DenRail
        weight: essential
        kind: conduct
        issues:
          - s32
        why: Breach is admitted, so the analysis turns on duty and the CLA limits on mental harm.
      - text: caused a loaded passenger service to collide with a stationary freight wagon that had been left on the same line, derailing two carriages a few hundred metres from the Denholm level crossing.
        weight: essential
        kind: context
        issues:
          - s30
          - s32
        why: 'A sudden, violent event putting passengers in peril: the occurrence James witnessed.'
      - text: Emergency services were more than forty minutes away on the nearest sealed road.
        weight: essential
        kind: context
        issues:
          - james-s32
        why: Help was far off, which is why James's exposure to the scene was so long.
      - text: James, an off-duty emergency nurse who lived nearby
        weight: essential
        kind: party
        issues:
          - james-s32
          - s30
        why: 'Not a passenger or relative: his claim rests on what he witnessed at the scene.'
      - text: heard the collision and ran to the crash site.
        weight: essential
        kind: conduct
        issues:
          - s30
        why: He arrived during the event itself, while victims were still in peril.
      - text: For almost three hours
        weight: essential
        kind: timing
        issues:
          - s30
          - james-s32
          - common-law
        why: 'Sustained exposure: Wicks reads witnessing victims ''put in peril'' broadly enough to cover it.'
      - text: he worked alongside a handful of local volunteers, climbing into the wreckage to apply pressure to wounds
        weight: essential
        kind: conduct
        issues:
          - james-s32
        why: 'Hands-on involvement in the wreckage: strong on sudden shock and witnessing at the scene.'
      - text: comfort passengers who were trapped and in some cases dying
        weight: essential
        kind: context
        issues:
          - s30
          - james-s32
        why: 'He saw victims injured and dying: s 30(2)(a) is satisfied.'
      - text: and help extract survivors before paramedics finally reached the scene.
        weight: background
        kind: conduct
      - text: He has since been diagnosed with post-traumatic stress disorder
        weight: essential
        kind: harm
        issues:
          - s31
        why: 'PTSD is a recognised psychiatric illness: s 31 is satisfied.'
      - text: and has been unable to return to nursing work.
        weight: essential
        kind: harm
        issues:
          - part3
        why: 'Loss flowing from mental harm with no physical injury: pure mental harm under s 27.'
      - text: James's sister, Mel
        weight: essential
        kind: relationship
        issues:
          - mel
          - s30
        why: A close family member, but s 30(2)(b) needs James to be a victim killed, injured or put in peril.
      - text: heard about the derailment on the radio while at home, twenty-five minutes' drive away.
        weight: essential
        kind: context
        issues:
          - mel
        why: 'Learned of it second-hand, far from the scene: no direct perception of the event.'
      - text: She rushed to the scene but arrived only after the last patient had been taken to hospital and the wrecked carriages made safe
        weight: essential
        kind: timing
        issues:
          - mel
          - s30
        why: 'She did not witness anyone in peril at the scene: s 30(2)(a) is not met.'
      - text: by the time she got there she saw only twisted, empty wreckage, police tape and emergency vehicles.
        weight: essential
        kind: context
        issues:
          - mel
        why: 'Only the aftermath, with no victims present: a weak basis for sudden shock under s 32.'
      - text: In the weeks that followed
        weight: essential
        kind: timing
        issues:
          - mel
        why: 'A gradual onset rather than a sudden shock: weighs against her under s 32(2)(a).'
      - text: tormented by imagining what her brother had witnessed and by graphic photographs of the crash circulating online
        weight: essential
        kind: mental
        issues:
          - mel
          - common-law
        why: 'Harm from imagination and media images, not direct perception: Annetts relaxed this at common law, but s 30 still limits recovery.'
      - text: Mel was diagnosed with an adjustment disorder with anxiety by her general practitioner.
        weight: essential
        kind: harm
        issues:
          - s31
          - mel
        why: Mel too must show a recognised psychiatric illness (s 31) before duty arises.
      - text: Before the derailment, Mel and James had an ordinary, close sibling relationship
        weight: essential
        kind: relationship
        issues:
          - mel
          - s30
        why: 'A close sibling bond: relevant to s 32(2)(c) and the close family member category in s 30.'
      - text: but neither of them had any prior connection to DenRail.
        weight: essential
        kind: relationship
        issues:
          - s32
          - james-s32
          - mel
        why: 'No pre-existing relationship with DenRail: s 32(2)(d) helps neither claimant.'
      - text: Both James and Mel wish to sue DenRail in negligence for their psychiatric injuries
        weight: essential
        kind: context
        issues:
          - part3
        why: 'Psychiatric injury without physical injury: Part 3 of the CLA governs both claims.'
      - text: which they say were caused by DenRail's admitted scheduling error.
        weight: background
        kind: context
      - text: Advise James and Mel.
        weight: background
        kind: context
  - question: laws2400-w00-q010
    parties:
      - name: Roast & River
        role: manufacturer of bottled cold-brew coffee; defendant
      - name: Farid
        role: consumer who drank a contaminated bottle; plaintiff
    issues:
      - id: category
        label: 'Duty: manufacturer and consumer, an established category'
        concept: laws2400-w06-product-liability-duty-of-care
      - id: grant
        label: No reasonable possibility of intermediate examination (Grant)
        concept: laws2400-w06-product-liability-duty-of-care
      - id: calculus
        label: 'Breach (duty is not breach): probability, magnitude and burden'
        concept: laws2400-w09-reasonable-response-s5b-1c-and-2
      - id: distinguish
        label: Distinguishing Graham Barclay Oysters v Ryan
        concept: laws2400-w06-product-liability-duty-of-care
      - id: causation
        label: Causation, briefly
        concept: laws2400-w10-factual-causation-necessary-condition
    facts:
      - text: Roast & River is a boutique manufacturer of bottled cold-brew coffee
        weight: essential
        kind: relationship
        issues:
          - category
        why: 'A manufacturer of a consumable product: the Donoghue v Stevenson category of duty.'
      - text: sold sealed in glass bottles through supermarkets.
        weight: essential
        kind: context
        issues:
          - grant
        why: 'Sealed bottles reach consumers unopened: no reasonable possibility of intermediate examination.'
      - text: Eighteen months ago it switched to a new, cheaper eco-friendly bottle cap supplied by a new manufacturer.
        weight: essential
        kind: conduct
        issues:
          - calculus
        why: 'A cost-driven change that brought in the risk: relevant to what precautions were reasonable.'
      - text: Internal quality records show that, during trial runs before the switch, random batch testing occasionally detected a small proportion of caps that failed to seal properly
        weight: essential
        kind: context
        issues:
          - calculus
          - distinguish
        why: The defect was known and detectable before the switch; in Graham Barclay the risk could not practically be eliminated.
      - text: allowing air in and creating a risk that mould could develop inside an affected bottle well before its printed use-by date.
        weight: essential
        kind: context
        issues:
          - calculus
        why: 'The harm risked is contamination of a drink consumed by the public: a serious magnitude.'
      - text: Roast & River's operations manager decided that testing every bottle would be too slow and expensive for a small company
        weight: essential
        kind: conduct
        issues:
          - calculus
        why: 'The burden side: the cost and speed of testing every bottle.'
      - text: and instead set quality control to test only one bottle in every two hundred from each production run.
        weight: essential
        kind: conduct
        issues:
          - calculus
          - distinguish
        why: 'The precaution actually taken: a minimal sampling rate, tested against the risk it left.'
      - text: Internal emails show the manager was aware this sampling rate meant "a few dodgy seals could get through and sit on a shelf for a couple of weeks before anyone noticed a pattern,"
        weight: essential
        kind: mental
        issues:
          - calculus
          - distinguish
        why: 'Actual knowledge that defective bottles would reach shelves: a conscious acceptance of the risk.'
      - text: but concluded the residual risk was "acceptable" given how much continuous testing of every bottle would cost and slow down production.
        weight: essential
        kind: mental
        issues:
          - calculus
        why: The manager weighed burden against risk; the court asks whether that balance was reasonable.
      - text: Farid bought a bottle of Roast & River cold-brew from his local supermarket
        weight: essential
        kind: relationship
        issues:
          - category
        why: 'Farid is the ultimate consumer: within the class to whom the duty is owed.'
      - text: well within the printed use-by date.
        weight: essential
        kind: timing
        issues:
          - causation
        why: 'He used the product as intended and in time: no misuse to explain the illness.'
      - text: The cap seal on his bottle had in fact failed.
        weight: essential
        kind: context
        issues:
          - causation
          - calculus
        why: The very defect the sampling rate was known to miss.
      - text: He did not notice anything unusual about the taste until he had drunk most of the bottle.
        weight: background
        kind: context
      - text: He became seriously unwell that night with vomiting and severe abdominal pain, and was hospitalised for four days.
        weight: essential
        kind: harm
        issues:
          - causation
        why: 'Physical injury: the damage that must be linked to the defect.'
      - text: Testing confirmed the bottle contained mould toxins consistent with a compromised seal that had allowed contamination to develop over roughly ten days on the shelf.
        weight: essential
        kind: context
        issues:
