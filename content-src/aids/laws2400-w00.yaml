facts:
  - question: laws2400-w00-q001
    parties:
      - name: Levi
        role: patron who grabbed and threatened Marco; would-be plaintiff
      - name: Marco
        role: patron who punched Levi, then struck him with a bar stool; defendant
    issues:
      - id: battery
        label: 'Battery: elements for each of the two acts'
        concept: laws2400-w02-battery
      - id: punch
        label: 'Self-defence at common law (Zecevic): the punch'
        concept: laws2400-w04-self-defence-common-law-and-cla
      - id: stool
        label: 'The stool strike: proportionality (Fontin v Katapodis)'
        concept: laws2400-w04-self-defence-common-law-and-cla
      - id: s52
        label: 'CLA s 52: unlawful conduct, belief and reasonable response'
        concept: laws2400-w04-self-defence-common-law-and-cla
      - id: s53-54
        label: CLA ss 53 and 54
        concept: laws2400-w04-self-defence-common-law-and-cla
      - id: remedies
        label: Liability and damages, including aggravated damages
        concept: laws2400-w02-remedies-intentional-torts-to-person
    facts:
      - text: Marco and Levi were both regulars at the Anchor Hotel.
        weight: background
        kind: party
      - text: One evening, Levi wrongly convinced himself that Marco had been badmouthing his sister to other patrons.
        weight: background
        kind: mental
      - text: Without warning, Levi strode over, grabbed Marco by the collar with both hands and slammed him back against the bar
        weight: essential
        kind: conduct
        issues:
          - punch
          - s52
          - s53-54
        why: 'Levi''s unprovoked force is itself unlawful: grounds Marco''s apprehension and satisfies s 52(1)(a).'
      - text: shouting that he was "going to smash his face in."
        weight: essential
        kind: statement
        issues:
          - punch
          - s52
        why: An explicit threat of further violence supports a reasonable apprehension of imminent force.
      - text: Marco, genuinely frightened
        weight: essential
        kind: mental
        issues:
          - punch
          - s52
        why: 'Actual fear: the apprehension limb of Zecevic and the belief limb of s 52.'
      - text: with nowhere to retreat
        weight: essential
        kind: context
        issues:
          - punch
        why: No escape route, so a forceful response to break free is reasonable.
      - text: threw a single hard punch that connected with Levi's jaw.
        weight: essential
        kind: conduct
        issues:
          - battery
          - punch
          - s52
        why: 'First battery: direct, intentional contact. A single blow against an ongoing attack is proportionate.'
      - text: The blow stunned Levi, who immediately released his grip on Marco's collar
        weight: essential
        kind: conduct
        issues:
          - stool
        why: 'Levi lets go: the threat that justified force ends here.'
      - text: and staggered backwards two or three steps, dazed and clutching the bar for support.
        weight: essential
        kind: conduct
        issues:
          - stool
          - s52
        why: Levi is dazed and retreating, so further force is hard to justify as necessary.
      - text: At that point Marco could have walked away
        weight: essential
        kind: context
        issues:
          - stool
          - s52
        why: 'Retreat was open to Marco: no need for any further force.'
      - text: the bar staff were already moving in to separate the two men, and several patrons had stepped between them.
        weight: essential
        kind: context
        issues:
          - stool
          - s52
        why: Others were already separating the men, so the danger had passed before the second act.
      - text: Instead, still furious
        weight: essential
        kind: mental
        issues:
          - stool
          - s52
          - remedies
        why: Anger rather than fear drives the second act; supports aggravated damages.
      - text: Marco picked up a heavy glass bar stool from beside him and swung it into the side of Levi's head
        weight: essential
        kind: conduct
        issues:
          - battery
          - stool
          - s52
          - s53-54
        why: 'A separate battery: escalation to a weapon against the head, like the glass in Fontin v Katapodis.'
      - text: as Levi stood swaying against the bar.
        weight: essential
        kind: context
        issues:
          - stool
        why: Levi was defenceless when struck, confirming the response was out of proportion.
      - text: Levi collapsed, suffering a fractured cheekbone, a concussion and a deep laceration requiring twelve stitches.
        weight: essential
        kind: harm
        issues:
          - remedies
        why: 'Serious injuries caused by the stool strike alone: the measure of compensatory damages.'
      - text: Levi has since discovered that Marco never actually said anything about his sister — the rumour was false
        weight: background
        kind: context
      - text: but this was not known to either man at the time of the incident.
        weight: background
        kind: mental
      - text: Levi wants to sue Marco for the injuries he suffered.
        weight: background
        kind: context
      - text: Marco says the whole incident was self-defence from start to finish
        weight: essential
        kind: statement
        issues:
          - punch
          - stool
        why: 'Marco''s framing: the answer must split the incident into two acts and test each separately.'
      - text: and that he was still frightened of Levi when he swung the stool.
        weight: essential
        kind: mental
        issues:
          - s52
          - stool
        why: Honest fear may meet the belief limb of s 52, but the response must still be reasonable.
      - text: Advise Levi whether he can succeed in an action against Marco, and advise Marco on the extent to which he can rely on self-defence, both at common law and under the Civil Liability Act 2002 (NSW).
        weight: background
        kind: context
        issues:
          - battery
          - punch
          - s52
  - question: laws2400-w00-q002
    parties:
      - name: Owen
        role: occupier of the yard, away on a trip; plaintiff
      - name: Priya
        role: next-door neighbour who entered to fight the fire; defendant
    issues:
      - id: trespass
        label: 'Trespass to land: Priya''s entry'
        concept: laws2400-w03-trespass-to-land-elements
      - id: necessity
        label: 'Necessity: the candidate lawful excuse and its test'
        concept: laws2400-w04-necessity-defence
      - id: emergency
        label: A genuine emergency? (Southwark v Williams)
        concept: laws2400-w04-necessity-defence
      - id: proudman
        label: Protecting another's property (Proudman v Allen)
        concept: laws2400-w04-necessity-defence
      - id: proportion
        label: 'Proportionality: the lock, the hose and the fence'
        concept: laws2400-w04-necessity-defence
      - id: garden
        label: 'The vegetable bed: reasonably necessary?'
        concept: laws2400-w04-necessity-defence
      - id: remedies
        label: Liability and remedies
        concept: laws2400-w03-remedies-trespass-to-land
    facts:
      - text: Owen lives next door to Priya.
        weight: background
        kind: relationship
      - text: Owen owns a small backyard shed and a timber paling fence that separates his yard from the reserve behind both properties.
        weight: essential
        kind: context
        issues:
          - trespass
        why: Owen is in possession of the yard and fence, so he can sue in trespass.
      - text: He left on Friday afternoon for a four-day trip
        weight: essential
        kind: timing
        issues:
          - necessity
        why: Owen was away, so his consent could not be sought before the fire reached the fence.
      - text: locking his side gate with a padlock and leaving nobody with a key.
        weight: essential
        kind: conduct
        issues:
          - trespass
        why: 'The yard was deliberately secured: no consent or implied licence to enter.'
      - text: On Saturday afternoon, a fast-moving grass fire broke out in the reserve during total fire ban conditions.
        weight: essential
        kind: context
        issues:
          - emergency
        why: 'A sudden, dangerous fire: a genuine emergency, unlike Southwark''s ongoing housing problem.'
      - text: Priya was in her own backyard when she saw embers blowing directly onto Owen's dry timber fence, which was already smouldering in two places
        weight: essential
        kind: context
        issues:
          - emergency
        why: 'The fence was already smouldering: the danger was real, present and immediate.'
      - text: and onto the edge of his overgrown vegetable garden bed.
        weight: essential
        kind: context
        issues:
          - garden
        why: 'Embers reached only the edge of the bed: tests whether crossing all of it was needed.'
      - text: Because the fence runs along the boundary shared with her own house
        weight: essential
        kind: context
        issues:
          - necessity
          - proudman
        why: Priya was protecting her own home as well as Owen's property.
      - text: Priya believed that if the fence caught properly alight, the fire would reach her own back wall within minutes
        weight: essential
        kind: mental
        issues:
          - necessity
          - emergency
        why: Priya's belief that action was needed to prevent serious harm to property.
      - text: well before any fire truck could arrive on her narrow street.
        weight: essential
        kind: context
        issues:
          - emergency
        why: 'No time to wait for the fire service: the need to act was immediate.'
      - text: Priya could not reach Owen's yard through her own, because a solid dividing wall separated the two properties at that point.
        weight: essential
        kind: context
        issues:
          - proportion
        why: No less intrusive route existed, so forcing the gate was the only way in.
      - text: She ran to Owen's locked side gate, used a garden fork to snap the padlock
        weight: essential
        kind: conduct
        issues:
          - proportion
          - remedies
        why: 'Damage to the padlock: proportionate to a fire threatening two houses?'
      - text: and let herself into his yard.
        weight: essential
        kind: conduct
        issues:
          - trespass
        why: 'Direct, intentional entry onto land in Owen''s possession without consent: the trespass, unless excused.'
      - text: She connected Owen's own garden hose to his outdoor tap and spent almost twenty minutes dousing the smouldering fence and the surrounding grass
        weight: essential
        kind: conduct
        issues:
          - proportion
        why: 'Using the hose aimed squarely at the danger: proportionate to the fire risk.'
      - text: including running back and forth across his vegetable garden bed to reach every hot spot.
        weight: essential
        kind: conduct
        issues:
          - garden
        why: 'The trampling needs separate scrutiny: reasonably incidental to firefighting, or excessive?'
      - text: The fire was contained to the fence line and never reached either house.
        weight: essential
        kind: context
        issues:
          - proportion
        why: The response was effective and confined to the fire risk.
      - text: When Owen returned on Tuesday
        weight: background
        kind: timing
      - text: he found his padlock destroyed, his gate hanging loose
        weight: essential
        kind: harm
        issues:
          - proportion
          - remedies
        why: 'Damage done to get in: likely excused if the entry was necessary.'
      - text: the hose nozzle cracked from being dropped on the concrete path
        weight: essential
        kind: harm
        issues:
          - proportion
          - remedies
        why: 'Accidental damage while fighting the fire: likely reasonably incidental to it.'
      - text: and his entire vegetable bed — about $600 worth of tomatoes, beans and herbs — flattened by repeated trampling.
        weight: essential
        kind: harm
        issues:
          - garden
          - remedies
        why: 'The loss most exposed: damages if the trampling went beyond what was reasonably necessary.'
      - text: Owen says Priya had no right whatsoever to enter his property or touch his belongings, no matter what her reasons were.
        weight: essential
        kind: statement
        issues:
          - necessity
        why: 'Owen''s position ignores lawful excuse: necessity can justify entry without consent.'
      - text: Advise Owen whether he can sue Priya in trespass to land, and advise Priya on whether she can rely on the defence of necessity.
        weight: background
        kind: context
        issues:
          - trespass
          - necessity
  - question: laws2400-w00-q003
    parties:
      - name: Aisha
        role: shopper detained by security, then arrested; plaintiff
      - name: Danny
        role: BrightMart security guard; defendant
      - name: BrightMart
        role: Danny's employer; vicariously liable
      - name: Constable Reyes
        role: police officer who arrested Aisha
    issues:
      - id: elements
        label: 'False imprisonment: Danny''s conduct'
        concept: laws2400-w02-false-imprisonment
      - id: restraint
        label: 'Total restraint: no reasonable means of escape'
        concept: laws2400-w02-false-imprisonment
      - id: balmain
        label: 'No lawful excuse: distinguishing Balmain New Ferry v Robertson'
        concept: laws2400-w02-false-imprisonment
      - id: s99
        label: 'Lawful arrest: both limbs of LEPRA s 99(1)'
        concept: laws2400-w04-legal-process-defence
      - id: suspicion
        label: Did reasonable suspicion survive the receipt?
        concept: laws2400-w04-legal-process-defence
      - id: force
        label: 'Force: LEPRA ss 230–231 (handcuffing)'
        concept: laws2400-w04-legal-process-defence
      - id: remedies
        label: Liability of both defendants and remedies
        concept: laws2400-w02-remedies-intentional-torts-to-person
    facts:
      - text: Aisha was shopping at BrightMart, a large department store.
        weight: background
        kind: party
      - text: As she approached the exit with a shopping bag containing a jacket she had purchased minutes earlier
        weight: essential
        kind: context
        issues:
          - balmain
          - suspicion
        why: 'Aisha had paid: there was never a real basis for detaining her.'
      - text: Danny, a BrightMart security guard
        weight: essential
        kind: relationship
        issues:
          - remedies
        why: 'Danny acts in his role as BrightMart''s guard: the basis for BrightMart''s vicarious liability.'
      - text: gripped her firmly by the upper arm
        weight: essential
        kind: conduct
        issues:
          - elements
        why: 'A positive, direct, intentional act restraining her body: the imprisonment begins here.'
      - text: and told her she was "not going anywhere" until she proved she had paid for everything in her bag.
        weight: essential
        kind: statement
        issues:
          - elements
          - balmain
        why: Words asserting control over her movement until she proves an innocence she need not prove.
      - text: Aisha protested that she had a receipt
        weight: essential
        kind: statement
        issues:
          - balmain
          - suspicion
        why: Danny was told she had paid, yet detained her anyway.
      - text: but Danny walked her to a small back office used for staff breaks, sat her down, and locked the door from the outside
        weight: essential
        kind: conduct
        issues:
          - elements
          - restraint
        why: 'A locked door leaves no reasonable means of escape: total restraint.'
      - text: saying store policy required him to hold "suspects" until police arrived.
        weight: essential
        kind: statement
        issues:
          - balmain
        why: Store policy is not lawful justification; Aisha never accepted detention as a condition of entry.
      - text: Aisha remained locked in the room for forty minutes.
        weight: essential
        kind: timing
        issues:
          - restraint
          - remedies
        why: 'Forty minutes of total restraint: relevant to damages.'
      - text: She later learned that BrightMart's written policy actually only authorised guards to ask a customer to voluntarily wait near customer service, not to physically restrain or lock anyone in a room.
        weight: essential
        kind: context
        issues:
          - balmain
        why: 'Even the store''s own policy gave no authority to restrain: no lawful excuse existed.'
      - text: When Constable Reyes arrived, Aisha immediately produced her receipt, which clearly matched the jacket in her bag.
        weight: essential
        kind: conduct
        issues:
          - s99
          - suspicion
        why: Exculpatory evidence before the arrest undermines any reasonable suspicion of theft.
      - text: Reyes examined it, acknowledged it appeared genuine
        weight: essential
        kind: statement
        issues:
          - suspicion
        why: 'Reyes himself accepted the receipt looked genuine: little left to ground a reasonable suspicion.'
      - text: but told Aisha he would "take her in anyway just to check things out properly at the station."
        weight: essential
        kind: statement
        issues:
          - s99
        why: 'Arresting ''just to check'' does not show arrest was reasonably necessary: fails the second limb.'
      - text: He handcuffed her
        weight: essential
        kind: conduct
        issues:
          - force
        why: 'Force used on Aisha: must be no more than reasonably necessary under ss 230–231.'
      - text: although she had not resisted, argued, or shown any sign of trying to leave
        weight: essential
        kind: conduct
        issues:
          - force
          - s99
        why: 'No resistance or flight risk: neither the arrest nor handcuffing was necessary.'
      - text: and drove her to the police station, where she was placed in a holding room for a further hour
        weight: essential
        kind: conduct
        issues:
          - s99
          - remedies
        why: A further hour of detention by police following an unlawful arrest.
      - text: before being released without any charge and without further explanation.
        weight: essential
        kind: context
        issues:
          - s99
        why: 'Released uncharged and unexplained: supports that the detention was not reasonably necessary.'
      - text: Aisha found the entire experience humiliating, particularly being handcuffed and walked through the store car park in front of other shoppers.
        weight: essential
        kind: harm
        issues:
          - remedies
        why: Humiliation and public exposure support aggravated damages.
      - text: She has come to you for advice.
        weight: background
        kind: context
      - text: Advise Aisha on any claim she may have in false imprisonment against Danny (and BrightMart), and separately on whether Constable Reyes's arrest and continued detention of her were lawful.
        weight: background
        kind: context
        issues:
          - elements
          - s99
  - question: laws2400-w00-q004
    parties:
      - name: Meridian Facilities Pty Ltd
        role: building manager of Parkview Apartments; defendant
      - name: Farah
        role: tenant assaulted in the car park; plaintiff
      - name: The stranger
        role: unidentified attacker; third party
    issues:
      - id: novel
        label: 'A novel duty: omission plus third-party crime'
        concept: laws2400-w06-omissions-and-control-of-others
      - id: salient
        label: Salient features (Caltex Refineries v Stavar)
        concept: laws2400-w05-novel-duty-and-salient-features
      - id: knowledge
        label: Foreseeability and knowledge of the risk
        concept: laws2400-w05-reasonable-foreseeability-meaning
      - id: control
        label: Control plus knowledge (Hargrave v Goldman)
        concept: laws2400-w06-omissions-and-control-of-others
      - id: modbury
        label: Distinguishing Modbury Triangle v Anzil
        concept: laws2400-w08-third-party-conduct-dorset-yacht-and-modbury
      - id: vulnerability
        label: Vulnerability, reliance and assumption of responsibility
        concept: laws2400-w05-novel-duty-and-salient-features
      - id: coherence
        label: Coherence and indeterminacy (Sullivan v Moody)
        concept: laws2400-w05-novel-duty-and-salient-features
    facts:
      - text: Meridian Facilities Pty Ltd manages "Parkview Apartments," a residential building of forty units.
        weight: essential
        kind: relationship
        issues:
          - control
          - coherence
          - salient
        why: 'Meridian manages the building: control over its security, owed to a limited, known class of tenants.'
      - text: The building's only vehicle and pedestrian access to the underground car park is through a heavy steel security gate operated by an electronic lock.
        weight: essential
        kind: context
        issues:
          - control
          - modbury
        why: 'The gate is the only way in: Meridian controls the physical means of entry, unlike Modbury''s lighting.'
      - text: Three weeks before the incident below, the lock mechanism failed, leaving the gate able to be pushed open by hand from outside.
        weight: essential
        kind: context
        issues:
          - knowledge
          - control
        why: The defect that created the risk, left unrepaired for three weeks.
      - text: At least six tenants emailed Meridian's building manager about the broken lock over those three weeks
        weight: essential
        kind: statement
        issues:
          - knowledge
          - vulnerability
        why: Repeated actual notice of the defect; tenants were relying on Meridian to fix it.
      - text: and one email specifically warned that "anyone could just walk in off the street"
        weight: essential
        kind: statement
        issues:
          - knowledge
          - modbury
        why: A specific warning of the very risk that materialised, not a general possibility of crime as in Modbury.
      - text: and that there had been two break-ins to storage cages in the car park in the previous two months.
        weight: essential
        kind: context
        issues:
          - knowledge
        why: Recent crime in the car park makes criminal intrusion reasonably foreseeable.
      - text: Meridian's manager replied to the first email promising a technician "within the week"
        weight: essential
        kind: statement
        issues:
          - vulnerability
        why: 'A promise to repair: points to an assumption of responsibility that tenants relied on.'
      - text: but never engaged one
        weight: essential
        kind: conduct
        issues:
          - novel
        why: 'A failure to act: the claim rests on an omission, so a duty is not automatic.'
      - text: and did not warn tenants, install any temporary barrier, or post any signage about the broken gate.
        weight: essential
        kind: conduct
        issues:
          - novel
          - control
        why: Simple steps within Meridian's control (warning, barrier, signs) were available and none was taken.
      - text: One night, a stranger pushed the broken gate open and entered the car park.
        weight: essential
        kind: conduct
        issues:
          - novel
          - modbury
        why: The attacker came in through the very defect Meridian knew of and controlled.
      - text: Rather than going to the storage cages
        weight: essential
        kind: context
        issues:
          - knowledge
        why: Meridian may say it knew only of property crime; the open-gate risk covered intruders generally.
      - text: he walked to where Farah, a tenant, was locking her car after arriving home late
        weight: essential
        kind: relationship
        issues:
          - vulnerability
          - coherence
        why: 'Farah is a tenant: one of a limited, known class who depend on the building''s security.'
      - text: and physically assaulted her, taking her handbag and phone before fleeing.
        weight: essential
        kind: conduct
        issues:
          - novel
          - modbury
        why: 'A third party''s independent criminal act: the main reason courts hesitate to find a duty.'
      - text: Farah suffered a broken wrist and ongoing anxiety about entering the car park alone.
        weight: background
        kind: harm
      - text: Farah has separately obtained a default judgment against the (unidentified but since-charged) attacker, but he has no assets and she has recovered nothing.
        weight: background
        kind: context
      - text: She now wants to sue Meridian for negligence
        weight: background
        kind: context
      - text: arguing that had the gate been fixed, or had tenants at least been warned, the attacker could not have entered, or she would have taken a friend down to the car park with her.
        weight: background
        kind: statement
      - text: Meridian says it owed Farah no duty at all
        weight: essential
        kind: statement
        issues:
          - novel
          - salient
        why: 'Frames the question as duty, not breach: answered by weighing the salient features.'
      - text: it did not commit the assault, had no relationship with or control over the attacker
        weight: essential
        kind: statement
        issues:
          - modbury
          - control
        why: Meridian's Modbury argument; the reply is its control of the gate, not of the attacker.
      - text: and cannot be expected to guarantee against the criminal acts of third parties.
        weight: essential
        kind: statement
        issues:
          - coherence
        why: 'The indeterminacy concern: a duty of reasonable care to known tenants is not a guarantee.'
      - text: Advise Farah whether Meridian owed her a duty of care.
        weight: background
        kind: context
        issues:
          - novel
          - salient
  - question: laws2400-w00-q005
    parties:
      - name: Callum
        role: driver who swung a tyre iron, later had a seizure; defendant
      - name: Priya
        role: cyclist threatened with the tyre iron; plaintiff
      - name: Noor
        role: pedestrian struck during the seizure; plaintiff
    issues:
      - id: assault
        label: 'Assault: the tyre iron incident'
        concept: laws2400-w02-assault
      - id: intent
        label: Intending apprehension, not the battery (Rixon v Star City)
        concept: laws2400-w02-assault
      - id: apprehension
        label: 'Reasonable apprehension: Priya''s position'
        concept: laws2400-w02-assault
      - id: imminence
        label: Imminence (Zanker v Vartzokas)
        concept: laws2400-w02-assault
      - id: voluntary
        label: 'Noor: trespass needs a voluntary positive act'
        concept: laws2400-w01-trespass-voluntary-act-and-damage
      - id: seizure
        label: The epileptic-fit exception
        concept: laws2400-w01-trespass-voluntary-act-and-damage
      - id: remedies
        label: Conclusions and remedies for Priya
        concept: laws2400-w02-remedies-intentional-torts-to-person
    facts:
      - text: Callum was driving home from work
        weight: background
        kind: context
      - text: when a cyclist, Priya, swerved in front of his car without signalling
        weight: essential
        kind: conduct
        issues:
          - remedies
        why: 'Provocation at most: no defence to assault and cannot reduce compensatory damages (Fontin v Katapodis).'
      - text: forcing him to brake hard and causing his coffee to spill across the passenger seat.
        weight: background
        kind: context
      - text: Enraged
        weight: essential
        kind: mental
        issues:
          - intent
        why: 'Anger shows the swing was deliberate: Callum meant Priya to fear being hit.'
      - text: Callum wound down his window as he came alongside her
        weight: essential
        kind: conduct
        issues:
          - imminence
        why: 'Callum is right beside Priya: the threatened force could be applied at once.'
      - text: reached across to the passenger seat for a tyre iron he kept there
        weight: essential
        kind: conduct
        issues:
          - assault
        why: 'Arming himself with a weapon: a positive act that conveys a threat of force.'
      - text: and swung it in a wide arc towards Priya as she rode past his door
        weight: essential
        kind: conduct
        issues:
          - assault
          - intent
          - imminence
        why: The threatening act. Intending apprehension is enough, even if Callum did not mean to hit her.
      - text: shouting that he would "smash her head in."
        weight: essential
        kind: statement
        issues:
          - intent
          - apprehension
        why: The words reinforce the threat and show an intention to make Priya fear violence.
      - text: The iron missed her by centimetres.
        weight: essential
        kind: context
        issues:
          - assault
          - imminence
        why: No contact, so no battery; a near miss shows contact was immediately possible.
      - text: Startled and frightened
        weight: essential
        kind: mental
        issues:
          - apprehension
        why: Priya actually feared imminent contact; the test asks whether that fear was reasonable.
      - text: Priya lost control of her bike and fell, grazing her knee and bruising her hip.
        weight: essential
        kind: harm
        issues:
          - remedies
        why: 'Physical injury flowing from the assault: compensatory damages.'
      - text: Callum did not stop, and drove off still shouting out the window.
        weight: essential
        kind: conduct
        issues:
          - remedies
        why: 'Continuing aggression and indifference to Priya: relevant to aggravated or exemplary damages.'
      - text: Three hours later
        weight: background
        kind: timing
      - text: having calmed down
        weight: background
        kind: mental
      - text: Callum collected his younger brother from the local swimming pool.
        weight: background
        kind: context
      - text: He sat in the front passenger seat of his brother's car in the car park while his brother went back inside to retrieve a forgotten bag, leaving the passenger window down.
        weight: background
        kind: context
      - text: While alone in the car, Callum suffered a sudden and completely unexpected epileptic seizure
        weight: essential
        kind: context
        issues:
          - voluntary
          - seizure
        why: Movement during a seizure is not a voluntary act, so there is no trespass.
      - text: his first episode in over a decade, which his neurologist had recently told him was very unlikely to recur while he remained on his current medication.
        weight: essential
        kind: mental
        issues:
          - seizure
        why: Callum had no reason to expect a seizure, so nothing he did beforehand was at fault.
      - text: During the seizure, his right arm flailed uncontrollably out through the open window and struck Noor
        weight: essential
        kind: conduct
        issues:
          - voluntary
          - seizure
        why: Direct contact, but the uncontrolled flailing is not a positive voluntary act.
      - text: a pedestrian who happened to be walking closely past the car at that moment
        weight: background
        kind: party
      - text: bruising her forearm.
        weight: background
        kind: harm
      - text: Callum has no memory of the seizure
        weight: background
        kind: mental
