    issues:
      - id: conversion
        label: 'Conversion: strict liability and a serious dealing amounting to dominion'
        concept: laws2400-w02-conversion-and-detinue
      - id: boat
        label: 'The boat: Penfolds Wines and Bunnings v CHEP'
        concept: laws2400-w02-conversion-and-detinue
      - id: rope
        label: 'The rope: a clearer conversion'
        concept: laws2400-w02-conversion-and-detinue
      - id: motive
        label: Good motive does not answer conversion
        concept: laws2400-w02-conversion-and-detinue
      - id: necessity
        label: 'Necessity: the test and Proudman v Allen'
        concept: laws2400-w04-necessity-defence
      - id: proportion
        label: 'Proportionality: the boat and the rope separately'
        concept: laws2400-w04-necessity-defence
    facts:
      - text: Theo works at Bayview Marina as a dockhand.
        weight: essential
        kind: party
        issues:
          - necessity
        why: 'Theo has no rights over either boat: like the defendant in Proudman v Allen, he protects another''s property.'
      - text: Priya keeps her small motorboat, "Wandering Star," in a berth there
        weight: essential
        kind: relationship
        issues:
          - conversion
        why: Priya owns and possesses the boat, so she can sue for a dealing with it.
      - text: and Klaus keeps his own boat two berths along.
        weight: background
        kind: party
      - text: Priya was away interstate the week a sudden, unforecast storm warning was issued for the harbour, with damaging swell expected within the hour.
        weight: essential
        kind: context
        issues:
          - necessity
        why: 'A sudden emergency while the owner was away: the setting in which necessity operates.'
      - text: Theo, doing his evening rounds, saw that Wandering Star's mooring lines had come loose in the rising chop and that the boat was swinging dangerously close to a concrete piling
        weight: essential
        kind: context
        issues:
          - necessity
          - motive
        why: A real, immediate danger to the boat; Theo acts to save it, but motive does not answer conversion.
      - text: if it stayed there, the hull would almost certainly be holed within minutes.
        weight: essential
        kind: context
        issues:
          - necessity
          - proportion
        why: 'Imminent serious damage to property: necessity is available if the response is reasonable.'
      - text: Theo found a spare ignition key in the boat's unlocked dock box, started the motor
        weight: essential
        kind: conduct
        issues:
          - conversion
          - boat
        why: 'Taking control of the boat and running it: serious enough to be dominion? Contestable, as Bunnings v CHEP shows.'
      - text: and carefully moved Wandering Star to an empty, more sheltered berth on the other side of the marina.
        weight: essential
        kind: conduct
        issues:
          - boat
          - proportion
        why: 'Moved only to a safer berth in the same marina: a limited dealing aimed at the danger.'
      - text: In doing so, in the swell and poor light, he scraped the hull against a piling and bent the propeller shaft, causing $2,400 damage
        weight: essential
        kind: harm
        issues:
          - boat
          - proportion
        why: 'Damage caused in the rescue: excused only if reasonably incidental to it.'
      - text: though he could not have completed the manoeuvre at all without some risk of contact given the sea conditions.
        weight: essential
        kind: context
        issues:
          - proportion
        why: 'Some contact was unavoidable: supports the damage being a proportionate incident of the rescue.'
      - text: Once Wandering Star was moved, Theo needed additional rope to properly double-secure it against the still-worsening swell.
        weight: essential
        kind: context
        issues:
          - proportion
          - motive
        why: 'The boat was already sheltered: the need for more rope was real but less pressing.'
      - text: He went to Klaus's boat, opened an unlocked storage locker on its deck, and took a 15-metre coil of mooring line stored there
        weight: essential
        kind: conduct
        issues:
          - conversion
          - rope
        why: 'Taking a third party''s goods from his locker: a deliberate appropriation.'
      - text: cutting it in half to create two extra lines.
        weight: essential
        kind: conduct
        issues:
          - rope
          - conversion
        why: 'Destroying the rope''s use for Klaus: a dealing plainly inconsistent with his ownership.'
      - text: He used both lengths to secure Wandering Star and left the remaining rope, now cut and unusable for its original purpose, on the dock.
        weight: essential
        kind: conduct
        issues:
          - rope
          - proportion
        why: 'Klaus''s property was used up for Priya''s benefit and left ruined: hard to justify as proportionate.'
      - text: The rope was worth $95.
        weight: essential
        kind: harm
        issues:
          - rope
        why: 'The measure of Klaus''s loss: the value of the converted rope.'
      - text: When Priya returned, she was furious that anyone had touched her boat at all
        weight: background
        kind: mental
      - text: and denies giving Theo any permission.
        weight: essential
        kind: statement
        issues:
          - conversion
          - necessity
        why: No consent, so Theo must rely on necessity to excuse the dealing.
      - text: Klaus separately wants compensation for his ruined rope.
        weight: background
        kind: context
        issues:
          - rope
      - text: Advise Theo on any liability to Priya and to Klaus, and whether necessity provides a defence.
        weight: background
        kind: context
        issues:
          - conversion
          - necessity
  - question: laws2400-w00-q012
    parties:
      - name: Ridge Line Trails
        role: commercial mountain-bike park; defendant
      - name: Tomas
        role: experienced rider injured on a jump; plaintiff
      - name: Yusuf
        role: rider who shoulder-barged Elena; defendant
      - name: Elena
        role: slower rider barged off her bike; plaintiff
    issues:
      - id: classify
        label: 'Tomas: negligence in a dangerous recreational activity'
        concept: laws2400-w06-sport-and-recreational-injury
      - id: inherent
        label: 'Inherent risk: Rootes v Shelton and Agar v Hyde'
        concept: laws2400-w06-sport-and-recreational-injury
      - id: s5l
        label: 's 5L: obvious risk of a dangerous recreational activity'
        concept: laws2400-w06-sport-and-recreational-injury
      - id: s5m
        label: 's 5M: the entrance sign as a risk warning'
        concept: laws2400-w06-sport-and-recreational-injury
      - id: battery
        label: 'Elena''s claim against Yusuf: battery, not negligence'
        concept: laws2400-w02-battery
      - id: mcnamara
        label: McNamara v Duncan by analogy
        concept: laws2400-w04-consent-validity-and-scope
      - id: park
        label: Ss 5L and 5M and Yusuf; Ridge Line Trails' own liability
        concept: laws2400-w08-third-party-conduct-dorset-yacht-and-modbury
    facts:
      - text: Ridge Line Trails is a commercial mountain-bike park that charges an entry fee to riders using its network of downhill jump trails.
        weight: essential
        kind: relationship
        issues:
          - classify
          - park
        why: 'A commercial operator of a recreational activity: owes riders a duty, subject to the CLA recreation provisions.'
      - text: 'A large sign at the entrance gate reads: "WARNING: Mountain biking is a dangerous activity. Falls, collisions and serious injury, including paralysis and death, can occur even on trails you have ridden before. Ride at your own risk."'
        weight: essential
        kind: statement
        issues:
          - s5m
          - s5l
        why: 'A general risk warning given before riding: under s 5M no duty is owed for risks it warns of.'
      - text: Every rider must walk past this sign to reach the trailhead.
        weight: essential
        kind: context
        issues:
          - s5m
        why: The warning is conspicuous and unavoidable, so riders are likely to be warned of the risk.
      - text: Tomas, an experienced rider who had ridden the park's "Big Drop" trail many times before
        weight: essential
        kind: party
        issues:
          - inherent
          - s5l
        why: His experience makes the risk of falling obvious to a reasonable person in his position.
      - text: attempted a jump he had successfully completed on at least a dozen previous visits.
        weight: essential
        kind: conduct
        issues:
          - s5l
          - classify
        why: 'A voluntary jump in a dangerous recreational activity: the setting for s 5L.'
      - text: This time he misjudged his landing, came off his bike
        weight: essential
        kind: conduct
        issues:
          - inherent
          - s5l
        why: 'His own misjudgement: the risk inherent in jumping, which materialised.'
      - text: and broke his collarbone.
        weight: background
        kind: harm
      - text: Nothing about the trail or the jump had changed since his previous visits
        weight: essential
        kind: context
        issues:
          - inherent
          - s5l
        why: 'No hidden hazard: the injury came from the activity itself, not the operator''s conduct.'
      - text: and the accident occurred in the ordinary course of riding the jump as designed.
        weight: essential
        kind: context
        issues:
          - inherent
          - s5l
        why: 'An obvious risk of a dangerous recreational activity materialised: s 5L defeats the claim.'
      - text: Later that same afternoon, a different incident occurred on an easier trail.
        weight: background
        kind: timing
      - text: Yusuf, another rider, had been annoyed all day at Elena
        weight: essential
        kind: mental
        issues:
          - mcnamara
        why: 'Simmering anger: the motive for a deliberate act, not a riding mishap.'
      - text: a slower rider, after she had "cut his line" earlier by moving into his path during an overtaking manoeuvre.
        weight: background
        kind: context
      - text: Riding behind her again on a straight section of track
        weight: background
        kind: context
      - text: Yusuf deliberately accelerated, rode up directly alongside Elena, and shoulder-barged her off her bike
        weight: essential
        kind: conduct
        issues:
          - battery
          - mcnamara
        why: 'A deliberate, direct application of force: battery, outside anything riders consent to.'
      - text: out of anger
        weight: essential
        kind: mental
        issues:
          - battery
          - mcnamara
        why: Intentional, retaliatory contact, like the deliberate blow in McNamara v Duncan.
      - text: causing her to crash into a trailside barrier.
        weight: background
        kind: harm
      - text: Elena suffered a broken wrist.
        weight: essential
        kind: harm
        issues:
          - battery
        why: 'Injury flowing directly from the barge: compensatory damages for the battery.'
      - text: Yusuf later admitted to another rider that he "wanted to teach her a lesson"
        weight: essential
        kind: statement
        issues:
          - battery
          - mcnamara
        why: 'An admission of intent to hurt her: removes any suggestion the contact was part of riding.'
      - text: and that the contact had nothing to do with overtaking or riding technique.
        weight: essential
        kind: statement
        issues:
          - mcnamara
          - park
        why: Not a risk of mountain biking at all, so ss 5L and 5M do not reach it.
      - text: Both Tomas and Elena want to know whether they can recover compensation.
        weight: background
        kind: context
      - text: Elena also wants to know whether Ridge Line Trails, rather than just Yusuf personally, might be liable for what Yusuf did.
        weight: essential
        kind: context
        issues:
          - park
        why: 'Raises the park''s liability for a third party''s deliberate act: Modbury makes such a duty unlikely.'
      - text: Advise Tomas and Elena.
        weight: background
        kind: context
  - question: laws2400-w00-q013
    parties:
      - name: Mei
        role: nurse buying her first home; plaintiff
      - name: Riverbend Shire Council
        role: gave the road-widening information; defendant
      - name: Grant
        role: retired surveyor met at a barbecue; defendant
      - name: Coastline Realty Pty Ltd
        role: selling agent whose brochure was false; defendant
    issues:
      - id: pel
        label: 'Pure economic loss: why more than foreseeability is needed'
        concept: laws2400-w07-pure-economic-loss-and-policy
      - id: council-duty
        label: 'The Council: Hedley Byrne, salient features and Shaddock'
        concept: laws2400-w07-reliance-and-knowledge-shaddock-san-sebastian-tepko
      - id: distinguish
        label: Distinguishing Tepko, San Sebastian and Esanda
        concept: laws2400-w07-reliance-and-knowledge-shaddock-san-sebastian-tepko
      - id: part5
        label: 'CLA Part 5: does it displace the duty?'
        concept: laws2400-w08-cla-part-5-public-authorities
      - id: breach
        label: 'Breach: s 5B and the unchecked register'
        concept: laws2400-w09-breach-of-duty-flowchart
      - id: causation
        label: 'Causation: s 5D, including s 5D(3)'
        concept: laws2400-w10-common-sense-causation-and-s5d
      - id: grant
        label: 'Grant: an opinion on a social occasion'
        concept: laws2400-w07-negligent-words-from-deceit-to-hedley-byrne
      - id: acl
        label: 'Coastline Realty: ACL s 18'
        concept: laws2400-w07-acl-s18-misleading-or-deceptive-conduct
    facts:
      - text: Mei, a nurse, has saved for six years to buy land on which to build her first home.
        weight: essential
        kind: party
        issues:
          - council-duty
          - distinguish
        why: One identified individual buyer, not a class (contrast Esanda), and vulnerable if misinformed.
      - text: In March she found a vacant lot in Riverbend, a growing regional town in NSW, listed for sale by Coastline Realty Pty Ltd.
        weight: essential
        kind: relationship
        issues:
          - acl
        why: 'An agency marketing land for sale acts in trade or commerce: the gateway to ACL s 18.'
      - text: 'The agency''s printed brochure said: "No road-widening or planning proposals affect this lot — ready to build."'
        weight: essential
        kind: statement
        issues:
          - acl
        why: 'A false statement of present fact: misleading, whatever the agency believed.'
      - text: Before signing the contract, Mei telephoned Riverbend Shire Council's planning counter.
        weight: essential
        kind: conduct
        issues:
          - council-duty
        why: She asked the Council, the only source of the information, before committing herself, as in Shaddock.
      - text: She explained that she was about to buy the lot to build a house and asked whether any road-widening proposal affected it.
        weight: essential
        kind: statement
        issues:
          - council-duty
          - distinguish
        why: The Council knew her purpose and that she would rely on the answer (contrast Tepko).
      - text: The officer looked at a screen and said, "No, nothing on that lot."
        weight: essential
        kind: statement
        issues:
          - council-duty
          - distinguish
        why: A statement of present fact, not a prediction (contrast San Sebastian).
      - text: Mei asked for confirmation in writing
        weight: essential
        kind: conduct
        issues:
          - council-duty
          - causation
        why: Shows real reliance before buying, and answers any doubt about relying on a phone call alone.
      - text: and two days later received a signed letter on Council letterhead stating that no road-widening proposal affected the land.
        weight: essential
        kind: statement
        issues:
          - council-duty
        why: 'A considered written statement on letterhead: the Council assumed responsibility for its accuracy, as in Shaddock.'
      - text: In fact, four months earlier the Council had resolved to widen the adjoining road, taking a six-metre strip from the front of the lot.
        weight: essential
        kind: context
        issues:
          - council-duty
          - breach
        why: The statement was false, and the true position sat in the Council's own records.
      - text: The resolution had been entered in the Council's road register
        weight: essential
        kind: context
        issues:
          - breach
          - distinguish
        why: The Council could find the answer easily; Mei could not check the register herself.
      - text: but the officer answered from a different database and did not check the register
        weight: essential
        kind: conduct
        issues:
          - breach
        why: 'The careless act: a reasonable council would have checked its own register.'
      - text: although the Council's own procedure manual told staff to do so.
        weight: essential
        kind: context
        issues:
          - breach
          - part5
        why: Its own procedure was not followed, so s 42 offers no shelter.
      - text: At a neighbour's barbecue the weekend before she signed
        weight: essential
        kind: context
        issues:
          - grant
        why: 'A social occasion: Lord Reid in Hedley Byrne excludes casual advice given on such occasions.'
      - text: Mei mentioned the lot to Grant, a retired surveyor she had just met.
        weight: essential
        kind: relationship
        issues:
          - grant
        why: A new acquaintance, retired, with no undertaking to apply his skill and not in trade or commerce.
      - text: 'Between sausages, Grant said: "Riverbend''s a good spot — I''d buy it if I were you.'
        weight: essential
        kind: statement
        issues:
          - grant
        why: 'An offhand opinion, not considered advice: no assumption of responsibility.'
      - text: I can't see the council touching that road for years."
        weight: essential
        kind: statement
        issues:
          - grant
          - distinguish
        why: A prediction about the future, not a statement of present fact (compare San Sebastian).
      - text: Mei paid $410,000.
        weight: essential
        kind: context
        issues:
          - pel
          - causation
        why: 'The price paid on the strength of the information: the starting point for her loss.'
      - text: Two months after settlement the road-widening was publicly notified.
        weight: background
        kind: timing
      - text: A valuer says the lot is now worth $290,000 and is too shallow for the house Mei planned.
        weight: essential
        kind: harm
        issues:
          - pel
        why: 'A fall in value with no physical damage: pure economic loss, so foreseeability alone is not enough.'
      - text: Mei says she would never have bought the lot had she known.
        weight: essential
        kind: statement
        issues:
          - causation
        why: Her after-the-event statement is inadmissible under s 5D(3)(b); her earlier conduct must prove what she would have done.
      - text: Coastline Realty says it honestly repeated what the vendor had told it and checked nothing itself.
        weight: essential
        kind: statement
        issues:
          - acl
        why: 'Honesty is no answer to s 18: misleading conduct needs no intention or negligence.'
      - text: Advise Mei whether she can recover her $120,000 loss from the Council, from Grant, or from Coastline Realty.
        weight: background
        kind: context
        issues:
          - pel
  - question: laws2400-w00-q014
    parties:
      - name: Greenvale Shire Council
        role: owner and manager of Wattle Park; defendant
      - name: Leo
        role: six-year-old injured on the climbing frame; plaintiff
      - name: Rosa
        role: Leo's mother; target of the Council's contribution claim
    issues:
      - id: authority
        label: 'Public authority and occupier: an operational complaint'
        concept: laws2400-w08-public-authorities-as-defendants
      - id: common-law
        label: 'Common law duty: control and knowledge'
        concept: laws2400-w08-control-and-vulnerability-graham-barclay-and-amaca
      - id: s42
        label: 'CLA s 42: resources and the replacement plan'
        concept: laws2400-w08-cla-part-5-public-authorities
      - id: s43-46
        label: CLA ss 43, 43A, 44 and 46
        concept: laws2400-w08-cla-part-5-public-authorities
      - id: breach
        label: 'Breach: s 5B(1) and (2)'
        concept: laws2400-w09-breach-of-duty-flowchart
      - id: causation
        label: 'Causation and scope of liability: s 5D'
        concept: laws2400-w10-common-sense-causation-and-s5d
      - id: contribution
        label: 'Contribution: is Rosa liable for the same damage?'
        concept: laws2400-w10-contribution-between-tortfeasors
      - id: hahn
        label: Rosa's duty to Leo (Hahn v Conley) and causation
        concept: laws2400-w08-children-parents-and-the-unborn
    facts:
      - text: Greenvale Shire Council owns and manages Wattle Park, a public park with a children's playground.
        weight: essential
        kind: relationship
        issues:
          - authority
          - common-law
        why: 'A council that owns and controls the park: a public authority and also its occupier.'
      - text: The playground's steel climbing frame, installed in 1998, has a platform two metres above rubber matting.
        weight: essential
        kind: context
        issues:
          - breach
          - s42
        why: 'A two-metre platform used by children: a fall risks serious harm. Built before 2000, so within the plan.'
      - text: The Council's written playground policy requires a safety inspection of every playground each quarter.
        weight: essential
        kind: context
        issues:
          - s42
          - common-law
        why: The Council's own procedure (s 42(d)), and the source of its knowledge of defects.
      - text: 'In June, the Council''s inspector wrote on the Wattle Park inspection sheet: "Top platform bolt badly corroded — platform moves under load — URGENT repair."'
        weight: essential
        kind: statement
        issues:
          - common-law
          - breach
        why: 'Actual knowledge of a specific, serious defect: the risk was foreseeable and not insignificant.'
      - text: The sheet went to the Council's works depot, where repairs were scheduled in the order requests arrived.
        weight: essential
        kind: conduct
        issues:
          - authority
          - s42
        why: 'An urgent report put in the ordinary queue: an operational failure, not a policy choice.'
      - text: The depot manager says the year's playground maintenance budget had been spent by May.
        weight: essential
        kind: statement
        issues:
          - s42
        why: 'The resources argument under s 42(a): it cannot explain failing to take cheap interim steps.'
      - text: No warning sign was put up and no barrier tape was placed around the frame
        weight: essential
        kind: conduct
        issues:
          - authority
          - breach
        why: 'The real complaint: no interim steps once the danger was known.'
      - text: although either would have taken a worker a few minutes and cost very little.
        weight: essential
        kind: context
        issues:
          - breach
          - s42
        why: 'A trivial burden of precautions under s 5B(2)(c): the budget does not explain the omission.'
      - text: Two years earlier, the Council had adopted a ten-year plan to replace all 46 of its playgrounds built before 2000, starting with the busiest parks.
        weight: essential
        kind: context
        issues:
          - s42
          - authority
        why: 'A policy-level allocation of resources (s 42(b)): cannot be attacked, but it is not the complaint.'
      - text: Wattle Park was scheduled for year seven.
        weight: background
        kind: timing
        issues:
          - s42
      - text: In August
        weight: essential
        kind: timing
        issues:
          - breach
        why: Two months after the urgent report, still with nothing done.
      - text: Rosa took her six-year-old son, Leo, to Wattle Park.
        weight: essential
        kind: relationship
        issues:
          - hahn
        why: 'A parent supervising her child: whether she owed Leo a duty is the Hahn v Conley question.'
      - text: She sat on a bench about fifteen metres from the frame, answering work emails on her phone.
        weight: essential
        kind: conduct
        issues:
          - hahn
          - contribution
        why: Inattentive, but she did not lead Leo into danger and could not have seen the defect.
      - text: Leo climbed to the top platform.
        weight: essential
        kind: conduct
        issues:
          - causation
        why: 'Ordinary use of the frame by a child: the use the Council should have stopped by closing it.'
      - text: As he stepped onto it, the corroded bolt sheared, the platform tipped
        weight: essential
        kind: context
        issues:
          - causation
        why: 'The very defect the inspector reported caused the fall: within scope of liability.'
      - text: and Leo fell onto the matting, fracturing his wrist and elbow.
        weight: essential
        kind: harm
        issues:
          - causation
        why: Physical injury of the kind the inspector foresaw.
      - text: Nothing about the bolt was visible from the ground.
        weight: essential
        kind: context
        issues:
          - hahn
          - contribution
          - common-law
        why: Rosa could not have seen the danger, so watching Leo would not have prevented the fall.
      - text: Leo sues the Council in negligence.
        weight: background
        kind: context
      - text: The Council says that it owed Leo no duty
        weight: essential
        kind: statement
        issues:
          - common-law
        why: A denial of duty; control, knowledge and children's inability to protect themselves point the other way.
      - text: that the Civil Liability Act 2002 (NSW) protects it because it had no money left for repairs and a sensible replacement plan
        weight: essential
        kind: statement
        issues:
          - s42
          - s43-46
        why: 'The Part 5 argument: resources and the plan do not answer the failure to tape off the frame.'
      - text: and that in any event Rosa, who was "glued to her phone", should contribute to any damages it has to pay.
        weight: essential
        kind: statement
        issues:
          - contribution
          - hahn
        why: 'Contribution needs Rosa to be a tortfeasor liable for the same damage: duty, breach and causation.'
      - text: Advise Leo on his claim against the Council, and advise the Council on its claim against Rosa.
        weight: background
        kind: context
  - question: laws2400-w00-q015
    parties:
      - name: Swift Parcels Pty Ltd
        role: Daniel's employer; accepts liability; defendant
      - name: Daniel
        role: courier employed by Swift Parcels
      - name: Ines
        role: cyclist and professional cellist; plaintiff
      - name: Dr Hale
        role: hospital registrar who missed a fracture; possible contributor
    issues:
      - id: causation
        label: 'Causation: s 5D(1)(a) met for every harm; scope under s 5D(1)(b) and (4)'
        concept: laws2400-w11-scope-of-liability-decision-flow
      - id: eggshell
        label: 'The hip fracture and lost earnings: remoteness and the egg-shell skull rule'
        concept: laws2400-w11-egg-shell-skull-rule
      - id: hale
        label: 'Dr Hale''s missed fracture: a subsequent negligent act'
        concept: laws2400-w11-subsequent-negligent-acts
      - id: wedding
        label: 'The wedding fall: volitional act or contributory negligence (s 5R)?'
        concept: laws2400-w11-novus-actus-volitional-acts-and-coincidences
      - id: collarbone
        label: 'The collarbone: coincidence (Haber v Walker)'
        concept: laws2400-w11-novus-actus-volitional-acts-and-coincidences
      - id: contribution
        label: Contribution from Dr Hale and its effect on Ines
        concept: laws2400-w10-contribution-between-tortfeasors
    facts:
      - text: Daniel, a courier employed by Swift Parcels Pty Ltd
        weight: background
        kind: relationship
      - text: reversed his van out of a loading dock onto a busy city street without checking his mirrors or his reversing camera.
        weight: essential
        kind: conduct
        issues:
          - causation
        why: Careless conduct; breach is conceded, so this only sets up causation.
      - text: He struck Ines, who was riding past in the marked bicycle lane.
        weight: essential
        kind: conduct
        issues:
          - causation
          - eggshell
        why: 'Impact with a cyclist: personal injury is the foreseeable kind of harm (The Wagon Mound (No 1)).'
      - text: Swift Parcels accepts that Daniel was negligent and that it is liable for his negligence.
        weight: essential
        kind: statement
        issues:
          - causation
        why: 'Duty, breach and vicarious liability conceded: the dispute is only which harms Swift answers for.'
      - text: Ines fell heavily onto her left side.
        weight: background
        kind: conduct
      - text: Unknown to anyone, she has an inherited condition that makes her bones more brittle than average
        weight: essential
        kind: context
        issues:
          - eggshell
        why: 'A hidden pre-existing vulnerability: the egg-shell skull rule makes Swift take Ines as it finds her.'
      - text: where most cyclists would have been bruised, she fractured her hip.
        weight: essential
        kind: harm
        issues:
          - eggshell
        why: Worse than expected, but the kind was foreseeable, so the extent need not be (Hughes v Lord Advocate).
      - text: Ines is a professional cellist with a long-term orchestra contract
        weight: essential
        kind: party
        issues:
          - eggshell
        why: 'A high earning capacity: Swift takes her earnings as it finds them, like her brittle bones.'
      - text: so her lost earnings are far higher than an average worker's would be.
        weight: essential
        kind: harm
        issues:
          - eggshell
        why: The full income loss is recoverable, not an average worker's.
      - text: At hospital, Dr Hale, a registrar finishing a double shift
        weight: essential
        kind: context
        issues:
          - hale
        why: 'An error by a tired doctor treating the injury Swift caused: not an extraordinary intervention.'
      - text: failed to notice a second, smaller fracture of the pelvis on Ines's X-rays.
        weight: essential
        kind: conduct
        issues:
          - hale
        why: 'Negligent treatment of the original injury: does not necessarily break the chain (Mahony; Burns v Pearce).'
      - text: Dr Hale accepts that a competent registrar would have seen it.
        weight: essential
        kind: statement
        issues:
          - hale
          - contribution
        why: 'Dr Hale is also negligent, so both are liable for the displacement: contribution is available.'
      - text: Ines was sent home on crutches.
        weight: background
        kind: context
      - text: A week later, the undiagnosed fracture displaced as she walked to her bathroom
        weight: essential
        kind: harm
        issues:
          - hale
        why: Follows in the ordinary course from the original injury and the missed diagnosis (March v Stramare).
      - text: requiring a second operation and adding four months to her recovery.
        weight: essential
        kind: harm
        issues:
          - hale
          - contribution
        why: 'The extra harm for which Swift and Dr Hale are both liable: the subject of contribution.'
      - text: Six weeks after that, Ines went to a friend's wedding.
        weight: background
        kind: timing
      - text: Her surgeon had told her clearly, in person and in writing, not to walk without crutches for another month.
        weight: essential
        kind: statement
        issues:
          - wedding
        why: 'Clear, informed instructions: her later choice was made knowing the risk.'
      - text: She left the crutches at home
        weight: essential
        kind: conduct
        issues:
          - wedding
        why: 'A deliberate, informed decision to defy medical advice: a voluntary act that may break the chain.'
      - text: because they "ruined the photos"
        weight: essential
        kind: mental
        issues:
          - wedding
        why: 'A trivial reason for running a known risk: a break in the chain, or a heavy reduction under s 5R.'
      - text: slipped on the reception venue's stairs, and re-fractured her hip.
        weight: essential
        kind: harm
        issues:
          - wedding
        why: 'The re-fracture: inside or outside the scope of Swift''s liability?'
      - text: Finally, while Ines was in hospital after a third operation
        weight: background
        kind: timing
      - text: a freak storm brought down a large tree onto the ward roof
        weight: essential
        kind: context
        issues:
          - collarbone
        why: 'A causally independent, extremely unlikely coincidence: breaks the chain (Haber v Walker).'
      - text: and falling debris broke her collarbone.
        weight: essential
        kind: harm
        issues:
          - collarbone
        why: But-for causation is met, yet coincidence puts this harm outside the scope of liability.
      - text: Ines sues Swift Parcels for all of her injuries and losses.
        weight: essential
        kind: context
        issues:
          - causation
        why: Each harm must be tested separately for scope of liability.
      - text: Advise Swift Parcels on the extent of its liability, and on whether it can recover any part of what it pays from Dr Hale.
        weight: background
        kind: context
        issues:
          - causation
          - contribution
  - question: laws2400-w00-q016
    parties:
      - name: Apex Civil Pty Ltd
        role: building company that broke the water main and built the Penrith house; defendant
      - name: Crumb & Co
        role: bakery in Unit 3; plaintiff
      - name: FreshPak
        role: food-packing business in Unit 7; plaintiff
      - name: Linehaul Freight
        role: trucking firm; one of FreshPak's carriers; plaintiff
      - name: Hannah
        role: subsequent owner of the Penrith house; plaintiff
    issues:
      - id: classify
        label: 'Classifying each loss: property damage, consequential or pure economic loss'
        concept: laws2400-w07-pure-economic-loss-and-policy
      - id: perre
        label: 'McHugh J''s Perre questions: Crumb & Co and FreshPak'
        concept: laws2400-w07-pel-caused-by-acts-perre-and-caltex
      - id: caltex
        label: Caltex Oil as supporting precedent
        concept: laws2400-w07-pel-caused-by-acts-perre-and-caltex
      - id: linehaul
        label: Linehaul Freight's claim
        concept: laws2400-w07-pel-caused-by-acts-perre-and-caltex
      - id: breach
        label: Breach and causation, briefly (ss 5B and 5D)
        concept: laws2400-w09-breach-of-duty-flowchart
      - id: dbpa
        label: 'Hannah: DBPA ss 36, 37, 39 and 40'
        concept: laws2400-w07-defective-structures-and-the-dbpa
      - id: common-law
        label: Hannah at common law (Bryan v Maloney; Woolcock)
        concept: laws2400-w07-defective-structures-and-the-dbpa
    facts:
      - text: Apex Civil Pty Ltd, a building company, was excavating foundations on a vacant block inside the Kestrel Business Park
        weight: background
        kind: party
      - text: a small estate of twelve units on a private road in western Sydney.
        weight: essential
        kind: context
        issues:
          - perre
          - caltex
        why: 'A small, identifiable group of twelve units: no indeterminacy, as in Perre and Caltex.'
      - text: Its excavator operator ignored the service plans he had been given and drove the bucket through the estate's only water main.
        weight: essential
        kind: conduct
        issues:
          - breach
          - perre
        why: 'Careless despite having the plans: clear breach, and Apex knew where the main ran and whom it served.'
      - text: All twelve units lost their water supply for six days while the pipe was replaced.
        weight: essential
        kind: harm
        issues:
          - perre
          - classify
        why: 'Loss confined to a known, ascertainable class: the units on the main.'
      - text: Three businesses affected now want compensation from Apex
        weight: background
        kind: context
      - text: Crumb & Co runs a bakery in Unit 3.
        weight: background
        kind: party
      - text: It could not operate without water and closed for six days, losing $18,000 in profits.
        weight: essential
        kind: harm
        issues:
          - classify
          - perre
        why: 'Lost profits with no damage to its property: pure economic loss, so the Perre questions decide duty.'
      - text: Nothing it owned was damaged.
        weight: essential
        kind: context
        issues:
          - classify
        why: Confirms the loss is purely economic.
      - text: FreshPak runs a food-packing business in Unit 7.
        weight: background
        kind: party
      - text: When the main was struck, FreshPak's water-cooled refrigeration plant shut down overnight and $9,000 of chilled stock spoiled.
        weight: essential
        kind: harm
        issues:
          - classify
        why: 'Physical damage to its property: recoverable on ordinary principles without any special duty analysis.'
      - text: FreshPak also closed for six days, losing $25,000 in profits.
        weight: essential
        kind: harm
        issues:
          - classify
          - perre
          - caltex
        why: 'Profits lost through the closure, not the spoiled stock: pure economic loss needing the Perre analysis.'
      - text: Linehaul Freight operates a trucking depot ten kilometres away.
        weight: essential
        kind: context
        issues:
          - linehaul
        why: Remote from the estate and outside the class served by the main.
      - text: FreshPak is one of its forty customers.
        weight: essential
        kind: relationship
        issues:
          - linehaul
        why: 'A customer of a customer: liability for such ripple losses would be indeterminate.'
      - text: Linehaul's trucks assigned to FreshPak sat idle for six days because FreshPak had nothing to ship, and Linehaul lost $14,000.
        weight: essential
        kind: harm
        issues:
          - linehaul
          - classify
        why: 'Economic loss one step removed: no known class or vulnerability, so no duty.'
      - text: Separately, three years ago Apex built a house in Penrith for the Lo family.
        weight: essential
        kind: relationship
        issues:
          - dbpa
          - common-law
        why: 'Construction work on a dwelling: within the DBPA s 37 duty, and the Bryan v Maloney setting.'
      - text: Apex's site supervisor allowed the footings to be poured without the soil compaction that the engineer's design required.
        weight: essential
        kind: conduct
        issues:
          - dbpa
          - breach
        why: Supervision is construction work (s 36); departing from the design is a failure of reasonable care, and non-delegable (s 39).
      - text: Last year the Los sold the house to Hannah, a schoolteacher.
        weight: essential
        kind: relationship
        issues:
          - dbpa
          - common-law
        why: 'A subsequent owner: the s 37 duty is owed to her despite no contract.'
      - text: The defect could not be seen, and Hannah's pre-purchase inspection did not reveal it.
        weight: essential
        kind: context
        issues:
          - common-law
          - dbpa
        why: 'A latent defect she could not guard against: the homeowner vulnerability stressed in Bryan v Maloney.'
      - text: Six months after she moved in, cracks opened across the internal walls.
        weight: essential
        kind: harm
        issues:
          - dbpa
        why: The defect shows itself, as in Bryan v Maloney.
      - text: An engineer estimates that underpinning the footings will cost $85,000.
        weight: essential
        kind: harm
        issues:
          - classify
          - dbpa
        why: 'The cost of fixing a defect: pure economic loss, recoverable under s 37.'
      - text: Hannah has no contract with Apex.
        weight: essential
        kind: relationship
        issues:
          - common-law
          - dbpa
        why: 'She needs a duty in tort: start with DBPA s 37, then Bryan v Maloney at common law.'
      - text: Apex says that it never dealt with any of these people
        weight: essential
        kind: statement
        issues:
          - perre
          - dbpa
        why: 'No dealings are needed: the Perre duty and s 37 do not depend on contract.'
      - text: and that it owes nothing for "mere financial losses".
        weight: essential
        kind: statement
        issues:
          - classify
          - perre
        why: Pure economic loss is recoverable where the salient features support a duty.
      - text: Advise Crumb & Co, FreshPak, Linehaul Freight and Hannah.
        weight: background
        kind: context
  - question: laws2400-w00-q017
    parties:
      - name: Jordan
        role: passenger injured when the boat flipped; plaintiff
      - name: Tariq
        role: drunk driver of the speedboat; defendant
    issues:
      - id: volenti
        label: 'Voluntary assumption of risk: the specific risk that materialised'
        concept: laws2400-w12-voluntary-assumption-of-risk
      - id: volenti-limits
        label: Courts' reluctance, and the statutory exclusion for passengers of intoxicated drivers
        concept: laws2400-w12-volenti-and-legislation
      - id: s5r
        label: 'Contributory negligence (s 5R): boarding and the life jacket'
        concept: laws2400-w12-contributory-negligence-apportionment-and-standard
      - id: s50
        label: 'Intoxication: CLA s 50 in order'
        concept: laws2400-w12-intoxicated-plaintiff-cla-s50
      - id: apportion
        label: Apportionment under s 9(1) (Pennington v Norris)
        concept: laws2400-w12-contributory-negligence-apportionment-and-standard
      - id: illegality
        label: 'Illegality: Gala v Preston and Progress & Properties v Craft'
        concept: laws2400-w12-illegality-defence
    facts:
      - text: Tariq and his friend Jordan, both 22, spent a Saturday afternoon drinking at a lakeside party.
        weight: essential
        kind: relationship
        issues:
          - s50
        why: 'Two adults drinking for hours: Jordan''s own intoxication brings in s 50.'
      - text: By 9 pm Tariq had drunk about eight beers and Jordan about six.
        weight: essential
        kind: context
        issues:
          - s50
          - s5r
          - apportion
        why: 'Both intoxicated, Tariq more so: relevant to s 50 and to comparing their responsibility.'
      - text: Tariq suggested that they take his father's speedboat across the lake to a commercial fish farm on the far shore and "help ourselves" to fish from the farm's holding pens to cook at the party.
        weight: essential
        kind: statement
        issues:
          - illegality
        why: 'A plan to steal fish: the illegal purpose of the trip.'
      - text: Jordan agreed.
        weight: essential
        kind: conduct
        issues:
          - illegality
        why: Jordan joins a joint illegal enterprise.
      - text: On the jetty, Jordan watched Tariq drop the ignition key twice and stumble climbing aboard.
        weight: essential
        kind: context
        issues:
          - volenti
          - s5r
        why: 'Jordan saw plain signs of Tariq''s drunkenness: knowledge relevant to volenti and his own care.'
      - text: He said, "You're wasted, mate — just go slow,"
        weight: essential
        kind: statement
        issues:
          - volenti
        why: 'Jordan knew Tariq was drunk but asked him to go slow: no acceptance of a high-speed risk.'
      - text: and got in.
        weight: essential
        kind: conduct
        issues:
          - s5r
          - volenti-limits
        why: 'Boarding with a driver he knew was drunk: careless for his own safety, the argument courts rarely treat as volenti.'
      - text: Tariq offered him a life jacket; Jordan refused it, saying he was "not a kid".
        weight: essential
        kind: conduct
        issues:
          - s5r
        why: Careless, but only relevant if it contributed to the injuries.
      - text: Once they were out on the water, Tariq switched off the navigation lights
        weight: essential
        kind: conduct
        issues:
          - volenti
          - illegality
        why: 'A new risk Jordan never accepted on the jetty: driving dark across the lake.'
      - text: so that the farm's caretaker would not see them coming
        weight: essential
        kind: mental
        issues:
          - illegality
        why: 'The lights were off to further the theft: the negligence is bound up with the illegal plan.'
      - text: and drove across the dark lake at high speed.
        weight: essential
        kind: conduct
        issues:
          - volenti
          - apportion
        why: 'High speed, against Jordan''s ''go slow'': not the risk he accepted, and Tariq''s share of fault grows.'
      - text: Halfway across he struck a marker buoy that he would ordinarily have seen and steered around.
        weight: essential
        kind: conduct
        issues:
          - volenti
        why: 'The precise risk that materialised: volenti requires full knowledge and acceptance of it.'
      - text: The boat flipped.
        weight: background
        kind: context
      - text: Jordan was thrown against the hull and into the water, breaking his leg and fracturing his skull.
        weight: essential
        kind: harm
        issues:
          - s50
        why: Jordan would likely have suffered these injuries even if sober, so s 50(2) does not bar damages.
      - text: Tariq pulled him to the shore.
        weight: background
        kind: conduct
      - text: The medical evidence is that a life jacket would not have prevented either injury.
        weight: essential
        kind: context
        issues:
          - s5r
        why: 'No causal link: the refusal cannot reduce damages for these injuries.'
      - text: They never reached the fish farm.
        weight: essential
        kind: context
        issues:
          - illegality
        why: 'Not decisive: the question is whether the joint illegality makes a standard of care inappropriate.'
      - text: Jordan sues Tariq in negligence.
        weight: background
        kind: context
      - text: Tariq accepts that he owed Jordan a duty of care and that he drove carelessly
        weight: essential
        kind: statement
        issues:
          - volenti
          - s5r
          - illegality
        why: 'Duty and breach conceded: the answer turns on the three defences.'
      - text: but he argues
        weight: background
        kind: context
      - text: (a) that Jordan voluntarily accepted the risk of being hurt when he got into the boat knowing Tariq was drunk
        weight: essential
        kind: statement
        issues:
          - volenti
          - volenti-limits
        why: 'Volenti: Jordan must have known and accepted the specific risk that materialised.'
      - text: (b) that Jordan's damages should be reduced because of his own conduct, including his drinking and his refusal to wear a life jacket
        weight: essential
        kind: statement
        issues:
          - s5r
          - s50
          - apportion
        why: 'Contributory negligence and s 50: each reduction needs a causal link to the injuries.'
      - text: (c) that Jordan cannot recover at all because they were on their way to steal fish together.
        weight: essential
        kind: statement
        issues:
          - illegality
        why: 'Illegality: is it inappropriate to set a standard of care between joint offenders (Gala v Preston)?'
      - text: Advise Jordan.
        weight: background
        kind: context
  - question: laws2400-w00-q018
    parties:
      - name: Bianca
        role: landlord of the terrace house
      - name: The Okafors
        role: tenants and occupiers; parents of Chidi
      - name: Sam
        role: Mr Okafor's friend injured when the balustrade gave way; plaintiff
      - name: Chidi
        role: the Okafors' thirteen-year-old son
      - name: Mr Patel
        role: neighbour hit in the eye by a stone; plaintiff
      - name: Kyle
        role: uninvited sixteen-year-old who climbed the fence; plaintiff
    issues:
      - id: landlord-duty
        label: Bianca's duty to Sam (Cavalier v Pope, Northern Sandblasting, Jones v Bartlett)
        concept: laws2400-w08-landlords-occupiers-and-trespassers
      - id: landlord-breach
        label: 'Bianca''s breach: s 5B, distinguishing Jones v Bartlett'
        concept: laws2400-w08-landlords-occupiers-and-trespassers
      - id: okafors-sam
        label: The Okafors as occupiers, and two defendants
        concept: laws2400-w08-landlords-occupiers-and-trespassers
      - id: patel
        label: 'Mr Patel''s claim: Smith v Leurs'
        concept: laws2400-w08-children-parents-and-the-unborn
      - id: kyle
        label: 'Kyle: the trespasser position (Cardy)'
        concept: laws2400-w08-landlords-occupiers-and-trespassers
      - id: s5r
        label: 'Contributory negligence: Sam and Kyle (s 5R)'
        concept: laws2400-w12-contributory-negligence-apportionment-and-standard
    facts:
      - text: Bianca owns a two-storey terrace house in Newtown, which she leases to the Okafor family.
        weight: essential
        kind: relationship
        issues:
          - landlord-duty
        why: 'A residential landlord: owes entrants a duty (Northern Sandblasting; Jones v Bartlett), despite Cavalier v Pope.'
      - text: 'In the condition report the Okafors returned at the start of the lease, they wrote: "Rear balcony balustrade loose — moves when leaned on."'
        weight: essential
        kind: statement
        issues:
          - landlord-breach
        why: Written notice of a specific, dangerous defect from the start of the lease.
      - text: Bianca read the report.
        weight: essential
        kind: mental
        issues:
          - landlord-breach
        why: Actual knowledge of the defect, unlike Jones v Bartlett where no defect was apparent.
      - text: When Mrs Okafor emailed reminders in April and again in June
        weight: essential
        kind: statement
        issues:
          - landlord-breach
        why: 'Repeated reminders: the risk was known and continuing.'
      - text: Bianca replied that she would "get someone to look at it after winter".
        weight: essential
        kind: statement
        issues:
          - landlord-breach
        why: 'Putting off repair of a known hazard: a reasonable landlord would have fixed or secured it.'
      - text: The Okafors told their own family to keep off the balcony
        weight: essential
        kind: conduct
        issues:
          - okafors-sam
        why: 'The Okafors knew of the danger too: they owe entrants a duty as occupiers.'
      - text: but put up no sign and left the balcony door unlocked.
        weight: essential
        kind: conduct
        issues:
          - okafors-sam
        why: 'No warning to guests and open access: an arguable breach by the Okafors.'
      - text: In July the Okafors held a party for their son Chidi's thirteenth birthday.
        weight: background
        kind: context
      - text: Sam, a friend of Mr Okafor visiting the house for the first time
        weight: essential
        kind: party
        issues:
          - okafors-sam
          - s5r
        why: A lawful entrant with no reason to suspect the balustrade was unsafe.
      - text: stepped out onto the balcony and leaned against the balustrade while talking.
        weight: essential
        kind: conduct
        issues:
          - s5r
        why: 'Ordinary use of a balustrade: hard to call this careless for his own safety.'
      - text: It gave way and he fell three metres onto the paving below, breaking his pelvis.
        weight: essential
        kind: harm
        issues:
          - landlord-breach
          - okafors-sam
        why: The very risk the condition report described.
      - text: For his birthday the Okafors had given Chidi a sling shot.
        weight: essential
        kind: conduct
        issues:
          - patel
        why: The parents supplied the dangerous object, as in Smith v Leurs.
      - text: Twice in the previous week they had watched him fire stones over the back fence towards the neighbour's yard
        weight: essential
        kind: context
        issues:
          - patel
        why: 'They knew he was firing stones towards the neighbour''s yard: the risk was foreseeable.'
      - text: each time they laughed and said nothing.
        weight: essential
        kind: conduct
        issues:
          - patel
        why: 'No step at all to control Chidi: unlike Smith v Leurs, where the parents had forbidden such use.'
      - text: During the party Chidi fired another stone over the fence.
        weight: essential
        kind: conduct
        issues:
          - patel
        why: The very conduct they had seen and failed to stop.
      - text: It struck the neighbour, Mr Patel, in the eye as he hung out his washing, permanently damaging his sight.
        weight: essential
        kind: harm
        issues:
          - patel
        why: Serious injury of the kind the misuse threatened.
      - text: Late that night Kyle, a sixteen-year-old who had not been invited
        weight: essential
        kind: party
        issues:
          - kyle
        why: 'An uninvited entrant: a trespasser, which affects but does not remove the duty (Cardy).'
      - text: climbed over the Okafors' side fence in the dark to get into the party.
        weight: essential
        kind: conduct
        issues:
          - kyle
          - s5r
        why: 'Climbing a fence in the dark: a trespass, and arguably careless for his own safety.'
      - text: He dropped onto a stack of loose pavers the Okafors had left against the inside of the fence after a garden project.
        weight: essential
        kind: context
        issues:
          - kyle
        why: 'A hazard the Okafors created: was an entrant over that fence foreseeable?'
      - text: The stack toppled and Kyle broke his ankle.
        weight: essential
        kind: harm
        issues:
          - kyle
        why: Physical injury from the hazard the Okafors left.
