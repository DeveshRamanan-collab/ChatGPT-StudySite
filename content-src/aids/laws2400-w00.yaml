        concept: laws2400-w10-s5d2-exceptional-cases
      - id: scope
        label: 'Scope of liability: the rain and the lost contract'
        concept: laws2400-w10-scope-of-liability-element
      - id: contrib-neg
        label: 'Contributory negligence: the aerators'
        concept: laws2400-w12-contributory-negligence-apportionment-and-standard
      - id: joint
        label: Joint and several liability, contribution and proportionate liability
        concept: laws2400-w10-contribution-between-tortfeasors
    facts:
      - text: Marlee runs a barramundi farm on Kestrel Creek in northern NSW.
        weight: background
        kind: party
      - text: Her fish live in ponds filled from the creek.
        weight: essential
        kind: context
        issues:
          - scope
        why: 'Her stock depends on the creek: harm from polluting it is the foreseeable kind.'
      - text: Two businesses discharge wastewater into the creek upstream of her farm.
        weight: essential
        kind: context
        issues:
          - categories
          - joint
        why: 'Two separate tortious sources upstream: the setting for an evidentiary gap between defendants.'
      - text: Ridgeway Tannery Pty Ltd treats its wastewater through a filtration unit before discharging it.
        weight: background
        kind: context
      - text: Its maintenance log shows that the unit had been faulty for three weeks, letting through untreated, nutrient-rich water
        weight: essential
        kind: context
        issues:
          - breach
        why: 'A known, continuing fault releasing pollutants: Ridgeway knew of the risk.'
      - text: the repair had been "deferred to next month" to save money.
        weight: essential
        kind: conduct
        issues:
          - breach
          - s5d2
        why: 'Repair put off to save money despite a known fault: a clear breach, as s 5D(2) requires.'
      - text: Hollis Dairy runs its washdown water into a holding pond.
        weight: background
        kind: context
      - text: One night a worker left a hose running, and the pond overflowed into the creek for several hours.
        weight: essential
        kind: conduct
        issues:
          - breach
          - s5d2
        why: 'A worker''s careless overflow: a clear breach for which Hollis is responsible.'
      - text: That same night, heavy summer rain washed fertiliser run-off from farms throughout the catchment into the creek.
        weight: essential
        kind: context
        issues:
          - categories
          - scope
        why: 'A non-tortious contributor acting at the same time: complicates causation but is not a defence.'
      - text: By the next morning the creek's oxygen levels had collapsed, and eight tonnes of Marlee's fish were dead.
        weight: essential
        kind: harm
        issues:
          - scope
        why: 'Property damage from the pollution: the kind of harm nutrient discharge risks.'
      - text: Marlee's expert says the fish died because the combined nutrient load stripped the water of oxygen.
        weight: essential
        kind: statement
        issues:
          - categories
        why: 'A cumulative mechanism: each source added to one combined load.'
      - text: Ridgeway's discharge, Hollis's overflow and the rain run-off each added to that load
        weight: essential
        kind: statement
        issues:
          - categories
          - joint
        why: Each defendant added to the load, like the dust in Bonnington Castings.
      - text: but on the present state of scientific knowledge it is impossible to say how much each contributed, or whether the fish would have died without either business's discharge.
        weight: essential
        kind: statement
        issues:
          - necessary
          - s5d2
        why: 'An evidentiary gap: necessary condition cannot be proved, which is what s 5D(2) addresses.'
      - text: Nobody suggests that the farms' run-off involved any negligence.
        weight: essential
        kind: context
        issues:
          - s5d2
          - joint
        why: 'The rain run-off is non-negligent: relevant to whether responsibility should fall on the two defendants.'
      - text: Marlee's ponds have electric aerators, which she normally runs overnight in summer.
        weight: essential
        kind: context
        issues:
          - contrib-neg
        why: A known, routine precaution for her own stock.
      - text: That night she switched them off to save power while she was away at a wedding
        weight: essential
        kind: conduct
        issues:
          - contrib-neg
        why: 'Failing to take her usual precaution: careless for her own property (s 5R).'
      - text: and arranged for no one to check the ponds.
        weight: essential
        kind: conduct
        issues:
          - contrib-neg
        why: 'No one could respond to the oxygen collapse: adds to her own fault.'
      - text: Her expert says that running the aerators "would probably have saved some fish, perhaps up to a third".
        weight: essential
        kind: statement
        issues:
          - contrib-neg
        why: 'Her carelessness contributed to part of the loss: damages reduced under s 9 by her share of responsibility.'
      - text: As well as the value of the fish, Marlee lost a supply contract with a restaurant group because she could not deliver for three months, losing $60,000 in profit.
        weight: essential
        kind: harm
        issues:
          - scope
        why: 'Lost profit flowing from the dead fish: consequential loss, tested for scope of liability.'
      - text: Advise Marlee on her claims in negligence against Ridgeway and Hollis.
        weight: background
        kind: context
