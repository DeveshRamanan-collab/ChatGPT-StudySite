      - text: Farid had no way of inspecting the seal's integrity before opening the bottle
        weight: essential
        kind: context
        issues:
          - grant
        why: 'No reasonable possibility of intermediate examination: the Grant v Australian Knitting Mills test is met.'
      - text: the defect was not visible from the outside, and the bottle looked completely normal.
        weight: essential
        kind: context
        issues:
          - grant
        why: A hidden defect that neither retailer nor consumer could detect.
      - text: Advise Farid on a claim in negligence against Roast & River.
        weight: background
        kind: context
        issues:
          - category
          - calculus
  - question: laws2400-w00-q011
    parties:
      - name: Theo
        role: marina dockhand who moved the boat and took the rope; defendant
      - name: Priya
        role: owner of the motorboat Wandering Star; plaintiff
      - name: Klaus
