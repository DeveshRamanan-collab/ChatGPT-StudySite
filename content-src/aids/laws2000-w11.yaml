  - concept: laws2000-w11-hybrid-tribunals-and-the-eccc
    plain: 'Hybrid tribunals are part national, part international: usually set up by agreement between a state and the UN, they try both international and national crimes with a mix of national and international judges and staff.'
    concrete: Cambodia asked the UN for help to try the Khmer Rouge's crimes of 1975–79. After lengthy negotiations, an international agreement in 2004 created the Extraordinary Chambers in the Courts of Cambodia. They sat inside Cambodia's own courts, with UN assistance (UNAKRT), a majority of national judges in every Chamber, one national and one international Co-Prosecutor, Co-Investigating Judges in civil-law style, and civil parties entitled to take part.
    formal: 'Hybrid tribunals are part national, part international in establishment (e.g. host state–UN agreement), subject-matter jurisdiction and staff. The ECCC tried senior leaders of Democratic Kampuchea and those most responsible for crimes from 17 April 1975 to 6 January 1979: genocide under the 1948 Genocide Convention, crimes against humanity as per the Rome Statute, grave breaches of the Geneva Conventions, and Cambodian crimes.'
    analogy:
      text: 'A joint venture: two partners — a state and the UN — sign a contract to run one business, pooling staff and rules from both.'
      maps:
        - from: the two partners
          to: the host state and the UN
        - from: the contract
          to: the establishing agreement (e.g. the 2004 UN–Cambodia agreement)
        - from: pooled staff
          to: national and international judges and prosecutors
        - from: rules from both partners
          to: jurisdiction over international and national crimes
      limits:
        - 'Joint ventures vary: the SCSL sat outside Sierra Leone''s legal system with a majority of international judges, while the ECCC sat inside Cambodia''s courts with a national majority.'
    terms:
      - term: hybrid (internationalised) tribunal
        gloss: A court part national and part international in its establishment, subject-matter jurisdiction and staff.
      - term: Co-Investigating Judges
        gloss: At the ECCC, judges — not the Prosecutors — ran investigations, reflecting Cambodia's civil-law system.
      - term: civil parties
        gloss: Victims entitled to participate in ECCC proceedings.
    misconceptions:
      - claim: The ECCC were created by a Security Council resolution under Chapter VII, like the ICTY and ICTR.
        tempting: The UN was involved in all three.
        correction: The ECCC came from an international agreement in 2004, after Cambodia's request to the UN, and sat within Cambodia's court structure.
      - claim: ECCC prosecutors investigated the cases, as the ICC Prosecutor does.
        tempting: Prosecutors investigate at the ICC and in common-law systems.
        correction: 'The ECCC''s structure was closer to civil law, reflecting Cambodia''s system: Co-Investigating Judges, not Prosecutors, were responsible for investigations.'
      - claim: The Special Court for Sierra Leone was a UN body, like the ICTY and ICTR.
        tempting: The UN helped establish it.
        correction: 'The slides say the SCSL was "not a UN body (unlike the ICTY and ICTR)": the UN and Sierra Leone''s government established it jointly in 2002.'
    socratic:
      - ask: Why were hybrid courts proposed after the ad hoc tribunals?
        hint: Where did the ICTY and ICTR sit?
        answer: The ad hoc tribunals were far from the countries they served; hybrid, treaty-based courts were meant to be efficient and more locally based.
      - ask: What three features mark a court as hybrid?
        hint: How made, what law, who staffs it.
        answer: Its establishment (e.g. host state–UN agreement), its jurisdiction over both international and national crimes, and its mix of international and national judges and practitioners.
      - ask: How was the ECCC created, and where did it sit?
        hint: '2004.'
        answer: By international agreement in 2004 after Cambodia's request to the UN; within the Cambodian court structure, with UN assistance through UNAKRT.
      - ask: Whom and what could it try?
        hint: 1975–79.
        answer: Senior leaders of Democratic Kampuchea and those most responsible, for genocide, crimes against humanity, grave breaches and Cambodian crimes from 17 April 1975 to 6 January 1979.
      - ask: What made its procedure distinctive?
        hint: Civil law.
        answer: Two Co-Prosecutors (national and international), a national majority of judges, Co-Investigating Judges, and civil parties' right to participate.
    elements:
      - name: Mixed establishment
        test: Created by agreement between the host state and the UN rather than by Security Council resolution alone or by multilateral treaty.
      - name: Mixed jurisdiction
        test: Both international crimes (e.g. genocide, crimes against humanity) and crimes under national law.
        authorities:
          - genocide-convention-arts-i-iii
      - name: Mixed staff
        test: International and national judges and practitioners; at the ECCC a national majority and national and international Co-Prosecutors.
    what-if:
      - change: The alleged crime was committed in Cambodia in 1980.
        effect: 'Outside the ECCC: its jurisdiction covered only 17 April 1975 to 6 January 1979.'
      - change: The accused was a low-ranking guard, not a senior leader.
        effect: Likely outside the ECCC's personal jurisdiction, limited to senior leaders of Democratic Kampuchea and those most responsible — unless the guard was among those most responsible.
    boundary:
      - text: The Special Tribunal for Lebanon.
        why: 'Hybrid: requested by Lebanon, its Statute annexed to Security Council Resolution 1757; mixed Lebanese and international judges and an international prosecutor; applied the Lebanese Criminal Code on terrorism.'
      - text: The Special Court for Sierra Leone.
        why: 'Hybrid but outside the national system: jointly established by the UN and Sierra Leone, seated in Freetown, with Sierra Leonean staff but a majority of international judges.'
    transfer:
      - scenario: After a civil war, State K asks the UN to help try its former rulers. Negotiators propose a court inside K's judiciary, with mixed national and international judges, applying both K's criminal code and international crimes.
        answer: 'That would be a hybrid court on the ECCC model: established by agreement between the host state and the UN, with mixed jurisdiction and mixed staff. Unlike the ICTY and ICTR, it would rest on K''s consent rather than a Chapter VII decision binding all states.'
