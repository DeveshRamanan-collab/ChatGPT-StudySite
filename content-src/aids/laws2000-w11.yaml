  - concept: laws2000-w11-icc-applicable-law-and-cooperation
    plain: The ICC applies its own Statute first, then international law, then general principles drawn from national laws. It has no police, so it depends on states that are bound to co-operate.
    concrete: In Resolution 1970 (2011) the Security Council referred Libya to the ICC Prosecutor. It decided that the Libyan authorities "shall cooperate fully" with the Court; but, recognising that states not party to the Rome Statute have no obligation under it, it only "urges" all states and concerned organisations. It also recognised that the UN would bear none of the referral's expenses.
    formal: 'Art 21: the Court applies first the Statute, Elements of Crimes and Rules; second, applicable treaties and principles and rules of international law; failing that, general principles derived from national laws — consistently with internationally recognised human rights. Art 86: States Parties "cooperate fully"; art 88: national procedures. Art 12(3) declarants co-operate "without any delay or exception". UN Charter art 25 binds members to Council decisions.'
    terms:
      - term: Elements of Crimes
        gloss: One of the Court's own instruments, applied "in the first place" with the Statute and the Rules of Procedure and Evidence (art 21).
      - term: general principles of law
        gloss: Principles the Court derives from national laws of the world's legal systems; the last, gap-filling source in art 21.
      - term: duty to co-operate
        gloss: States Parties must co-operate fully (art 86); declarants under art 12(3) and states bound by a Chapter VII decision must also co-operate.
    misconceptions:
      - claim: Every UN member must co-operate with the ICC under art 86.
        tempting: All states had to co-operate with the ICTY.
        correction: Art 86 binds States Parties. A non-party is bound only by an art 12(3) declaration or by a Chapter VII Security Council decision (art 25 UN Charter) — Res 1970 merely urged other states.
      - claim: General principles of law rank above the Rome Statute.
        tempting: They are a primary source under art 38(1) of the ICJ Statute.
        correction: 'Art 21 ranks its sources: the Statute, Elements and Rules first; treaties and international law second; general principles from national laws only "failing that".'
      - claim: The ICC is strictly bound by its previous decisions, as in common-law precedent.
        tempting: Australian courts follow precedent.
        correction: Art 21(2) says the Court "may apply" principles and rules as interpreted in its previous decisions — permissive, not binding.
    socratic:
      - ask: The Statute and Elements are silent on a question. Where does the Court look next?
        hint: Art 21(1)(b).
        answer: To applicable treaties and the principles and rules of international law, including the established principles of the law of armed conflict.
      - ask: And if those are silent too?
        hint: '"Failing that".'
        answer: To general principles of law derived from national laws, including those of states that would normally exercise jurisdiction, if consistent with the Statute and international law.
      - ask: What limit governs every interpretation?
        hint: Art 21(3).
        answer: It must be consistent with internationally recognised human rights and without adverse distinction on grounds such as gender, age, race or religion.
      - ask: Who must arrest suspects for the Court?
        hint: The ICC has no police.
        answer: 'States: States Parties must co-operate fully (art 86) and have national procedures (art 88); the Court relies on countries to arrest and transfer suspects.'
      - ask: Can a non-party ever be obliged to co-operate?
        hint: Two routes.
        answer: Yes — by lodging an art 12(3) declaration, or through a Chapter VII Security Council decision, binding under art 25 of the Charter.
    elements:
      - name: 'First: the Court''s own instruments'
        test: The Statute, Elements of Crimes and Rules of Procedure and Evidence.
        authorities:
          - rome-statute-art-21
      - name: 'Second: international law'
        test: Where appropriate, applicable treaties and principles and rules of international law, including the law of armed conflict.
        authorities:
          - rome-statute-art-21
      - name: 'Failing that: general principles'
        test: General principles from national laws of the world's legal systems, if not inconsistent with the Statute and international law.
        authorities:
          - rome-statute-art-21
      - name: Human rights consistency
        test: All application and interpretation must be consistent with internationally recognised human rights, without adverse distinction.
        authorities:
          - rome-statute-art-21
    what-if:
      - change: A suspect travels to a non-party that has made no declaration and is under no Council decision.
        effect: That state has no obligation under the Statute to arrest him; the Court, relying on states for arrests, may be unable to act — a practical consequence for the ICC.
      - change: The Council, acting under Chapter VII, decides that the territorial non-party "shall cooperate fully".
        effect: That state is bound to co-operate through art 25 of the UN Charter, though it is not a Party — as Res 1970 did for the Libyan authorities.
    boundary:
      - text: Res 1970's call on states other than Libya.
        why: 'Not binding: the Council recognised non-parties have no obligation under the Statute and only "urges" all states, whereas it "decides" that the Libyan authorities shall co-operate.'
      - text: Ukraine's art 12(3) declaration.
        why: 'A non-party that is nonetheless bound: an accepting state must co-operate "without any delay or exception" under Part 9.'
    transfer:
      - scenario: The ICC issues an arrest warrant. The suspect is in State V, which is not a Party, has made no declaration and faces no Council decision. A commentator says V must arrest him because "everyone must co-operate with international courts".
        answer: Wrong for the ICC. Art 86 binds States Parties; a non-party is bound only by an art 12(3) declaration or a Chapter VII decision (art 25 UN Charter). V has neither, so it has no obligation under the Statute — showing the Court's dependence on state co-operation.
    sources:
      - Week 11 - Lecture Slides - International Criminal Law (text extract) (slides 45, 50–51)
      - 'Week 11 - Lecture Slides - International Criminal Law (image slides transcribed) (slides 37, 43, 46: the Court relies on countries to arrest; Res 1970 paras 4–8; Ukraine''s declaration)'
      - 'Week 11 - Tutorial Tasks - International Criminal Law (Q3: when non-parties must co-operate, and the consequences for the ICC)'
