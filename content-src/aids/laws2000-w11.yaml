  - concept: laws2000-w11-nuremberg-principles
    plain: Anyone who commits a crime under international law answers for it personally. Their own country's law, their high office, or orders from above do not get them off.
    concrete: 'In 1999 the ICTY indicted Slobodan Milošević while he was still President of the Federal Republic of Yugoslavia. Later, the Special Court for Sierra Leone became, in the slides'' words, the first modern international tribunal to indict, try and convict a sitting head of state (the Taylor trial). Both reflect Principle III: acting as Head of State does not relieve a person of responsibility under international law.'
    formal: 'GA Res 95(I) (11 December 1946) affirmed the Nuremberg principles. I: "Any person who commits an act which constitutes a crime under international law is responsible therefor and liable to punishment." II: no penalty in internal law is no relief. III: acting "as Head of State or responsible Government official" is no relief. IV: superior orders are no relief, "provided a moral choice was in fact possible".'
    analogy:
      text: A courtroom with three exits labelled "my country allowed it", "I was in charge" and "I was ordered". The Nuremberg Principles lock each door, leaving the accused facing personal responsibility.
      maps:
        - from: the accused facing the court
          to: 'Principle I: any person who commits an international crime is responsible'
        - from: '"my country allowed it"'
          to: 'Principle II: internal law is no relief'
        - from: '"I was in charge"'
          to: 'Principle III: head of state or official is no relief'
        - from: '"I was ordered"'
          to: 'Principle IV: superior orders are no relief'
      limits:
        - 'The orders door is not fully locked: Principle IV removes the plea only where a moral choice was in fact possible.'
        - Locking the responsibility doors does not remove procedural immunity before a particular foreign court (Week 6).
    terms:
      - term: individual responsibility
        gloss: 'Principle I: any person who commits a crime under international law is personally responsible and liable to punishment.'
      - term: official capacity
        gloss: 'Principle III: acting as Head of State or responsible Government official does not relieve a person of responsibility.'
      - term: moral choice
        gloss: 'The Principle IV qualifier: superior orders are no relief provided a moral choice was in fact possible to the person.'
    misconceptions:
      - claim: Under Principle IV, superior orders are never relevant, whatever the circumstances.
        tempting: The principle is often summarised as "orders are no defence".
        correction: 'Principle IV is qualified: orders do not relieve responsibility "provided a moral choice was in fact possible to him". The question is whether such a choice existed.'
      - claim: Principle III means a serving foreign minister can be tried in any foreign national court.
        tempting: Principle III denies officials a shield.
        correction: 'Principle III concerns substantive responsibility. Immunity is procedural: personal immunity may still bar a foreign national court while she is in office (Arrest Warrant). Immunity does not mean impunity.'
      - claim: Only officials and soldiers can commit crimes under international law.
        tempting: The famous defendants were leaders and commanders.
        correction: Principle I speaks of "any person". Official status is neither required for responsibility nor a shield against it (Principle III).
    socratic:
      - ask: An accused says, "Nothing I did was illegal at home." Which principle answers him?
        hint: Internal law.
        answer: 'Principle II: that internal law imposes no penalty does not relieve him of responsibility under international law.'
      - ask: She says, "I was head of state." Which principle?
        hint: Official position.
        answer: 'Principle III: acting as Head of State or responsible Government official does not relieve her of responsibility.'
      - ask: He says, "I was following orders." Does that end the matter?
        hint: Read the proviso.
        answer: No. Under Principle IV orders are no relief "provided a moral choice was in fact possible to him" — so ask whether one was.
      - ask: Does Principle III mean any court can try a serving head of state?
        hint: Substance v procedure.
        answer: No. It removes a substantive defence; procedural immunity before foreign national courts (Week 6) is a separate question.
    elements:
      - name: Principle I — individual responsibility
        test: Any person who commits an act constituting a crime under international law is responsible and liable to punishment.
        authorities:
          - unga-resolution-95-i
      - name: Principle II — internal law no shield
        test: That internal law imposes no penalty does not relieve the person of responsibility under international law.
        authorities:
          - unga-resolution-95-i
      - name: Principle III — official position no shield
        test: Acting as Head of State or responsible Government official does not relieve the person of responsibility.
        authorities:
          - unga-resolution-95-i
      - name: Principle IV — orders no shield
        test: Acting under orders of a Government or superior does not relieve responsibility, provided a moral choice was in fact possible.
        authorities:
          - unga-resolution-95-i
    what-if:
      - change: A conscript took part in a killing at gunpoint, with no realistic alternative.
        effect: 'Principle IV''s proviso is engaged: orders are no relief only where a moral choice was in fact possible. Whether one existed is the key question.'
      - change: The accused is a serving foreign minister before another state's national court.
        effect: Principle III removes the substantive defence, but personal immunity may still bar that court while she holds office (Arrest Warrant). An international court with jurisdiction is a different matter.
    boundary:
      - text: A conscript ordered at gunpoint.
        why: 'At the edge of Principle IV: superior orders give no relief only if a moral choice was in fact possible to him.'
      - text: A serving foreign minister charged before a foreign national court.
        why: 'Principle III answers responsibility, not immunity: procedural personal immunity can still stop that court, without meaning impunity.'
    transfer:
      - scenario: 'A former interior minister charged with crimes against humanity argues: the deportations were authorised by statute, she acted as a minister, and her president ordered them anyway.'
        answer: 'Each plea fails as a shield. Statutory authority: Principle II. Ministerial office: Principle III. The president''s orders: Principle IV, unless no moral choice was in fact possible — unlikely for a minister directing policy. She is responsible as "any person" under Principle I.'
