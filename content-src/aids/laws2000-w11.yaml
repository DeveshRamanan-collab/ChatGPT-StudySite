  - concept: laws2000-w11-post-wwii-military-tribunals
    plain: After World War II the Allies tried Axis leaders before two international military tribunals — Nuremberg and Tokyo — and held thousands of further trials in occupied zones and across the Asia-Pacific.
    concrete: The Tokyo tribunal (IMTFE) was set up by proclamation of US General Douglas MacArthur, implementing the Potsdam Declaration, to try Japanese officials. Twenty-eight defendants faced 55 counts of crimes against peace, conventional war crimes and crimes against humanity. All were found guilty, though not on every count; seven were sentenced to death and the rest to imprisonment. It largely agreed with Nuremberg on the law.
    formal: The London Agreement, with the IMT Charter annexed, created the Nuremberg IMT; art 6 listed crimes against peace, war crimes and crimes against humanity "for which there shall be individual responsibility" of leaders, organisers, instigators and accomplices. The IMTFE rested on MacArthur's proclamation (IMTFE Charter art 5(a)–(c)). Control Council Law No 10 allowed domestic prosecutions in the Allied zones of occupation.
    terms:
      - term: crimes against peace
        gloss: Planning, preparing, initiating or waging a war of aggression or a war in violation of treaties, or conspiring to do so (IMT Charter art 6(A)).
      - term: war crimes
        gloss: Violations of the laws or customs of war — e.g. ill-treatment of civilians or prisoners of war, killing hostages, plunder, wanton destruction (art 6(B)).
      - term: crimes against humanity
        gloss: Murder, extermination, enslavement, deportation and other inhumane acts against any civilian population, or persecutions on political, racial or religious grounds (art 6(C)).
      - term: Control Council Law No 10
        gloss: The basis for domestic prosecutions in the Allied zones of occupation — best known for twelve US trials by the Nuremberg Military Tribunals.
    misconceptions:
      - claim: General MacArthur's proclamation created the Nuremberg tribunal.
        tempting: A proclamation did create one post-war tribunal.
        correction: That was the IMTFE in Tokyo. Nuremberg's IMT was created by the London Agreement, with the IMT Charter annexed.
      - claim: Genocide was one of the three crimes in art 6 of the IMT Charter.
        tempting: Genocide is the crime most associated with the Holocaust.
        correction: Art 6 listed crimes against peace, war crimes and crimes against humanity. Genocide appears in later instruments — the 1948 Genocide Convention, the ICTR Statute, the Rome Statute.
      - claim: Crimes against humanity at Nuremberg required the act to break the domestic law where it was done.
        tempting: Criminal law usually follows the law of the place.
        correction: Art 6(C) covered such acts "whether or not in violation of the domestic law of the country where perpetrated".
    socratic:
      - ask: The Allies agreed Axis war criminals should be punished. What did they disagree about?
        hint: How, not whether.
        answer: Purpose and procedure — how to punish them.
      - ask: What instrument created the Nuremberg IMT, and whom did it make responsible?
        hint: London, 1945.
        answer: The London Agreement with the IMT Charter annexed; it provided for individual responsibility of leaders, organisers, instigators and accomplices.
      - ask: Which three crimes could the IMT try?
        hint: Art 6(A)–(C).
        answer: Crimes against peace, war crimes and crimes against humanity.
      - ask: How was the Tokyo tribunal set up, and how did it end?
        hint: A general's proclamation.
        answer: By MacArthur's proclamation implementing the Potsdam Declaration; all 28 defendants were convicted on some counts, seven sentenced to death.
      - ask: Who tried the many lower-level accused?
        hint: Occupation law; the Asia-Pacific.
        answer: Domestic courts under Control Council Law No 10 (e.g. twelve US trials at Nuremberg) and thousands of Allied trials, Australia's among them.
    elements:
      - name: Crimes against peace
        test: Planning, preparation, initiation or waging of a war of aggression or in violation of treaties, or a common plan or conspiracy to do so.
        authorities:
          - imt-charter-art-6
      - name: War crimes
        test: Violations of the laws or customs of war, e.g. murder or ill-treatment of civilians or prisoners of war, killing hostages, plunder.
        authorities:
          - imt-charter-art-6
      - name: Crimes against humanity
        test: Inhumane acts against any civilian population, before or during the war, or persecutions on political, racial or religious grounds, whatever domestic law said.
        authorities:
          - imt-charter-art-6
    what-if:
      - change: The persecution was fully lawful under the perpetrators' own national law.
        effect: 'No answer to a charge of crimes against humanity: art 6(C) applied "whether or not in violation of the domestic law of the country where perpetrated".'
      - change: The accused is a Japanese minister rather than a German one.
        effect: The forum is the IMTFE in Tokyo, created by proclamation rather than agreement, charging crimes against peace, conventional war crimes and crimes against humanity under art 5(a)–(c).
      - change: The accused is a German industrialist arrested in the US zone of occupation.
        effect: Likely a domestic occupation trial under Control Council Law No 10 — such as the twelve US trials before the Nuremberg Military Tribunals — not the IMT.
    boundary:
      - text: Killing prisoners of war.
        why: 'A war crime under art 6(B), not a crime against humanity: art 6(C) concerned acts against civilian populations.'
      - text: Australia's post-war trials in the Asia-Pacific.
        why: 'Part of the post-WWII trials, but national, not international: the Allies held thousands of such trials beyond Nuremberg and Tokyo.'
    transfer:
      - scenario: 'A museum label says: "The Tokyo Trial was created by the London Agreement and tried genocide." Correct it.'
        answer: The IMTFE was established by General MacArthur's proclamation implementing the Potsdam Declaration; the London Agreement created Nuremberg's IMT. Its charges were crimes against peace, conventional war crimes and crimes against humanity (art 5(a)–(c)), not genocide.
    storyboard:
      - caption: Allies agree to punish, disagree how
        detail: A shared intention to punish Axis war criminals, but differences over purpose and procedure.
      - caption: London Agreement creates the IMT
        detail: The IMT Charter's art 6 lists crimes against peace, war crimes and crimes against humanity.
      - caption: MacArthur proclaims the IMTFE
        detail: 'Implementing the Potsdam Declaration: 28 defendants, 55 counts, seven death sentences.'
      - caption: Occupation and national trials
        detail: Control Council Law No 10 trials in the zones; thousands of Allied trials in the Asia-Pacific, including Australia's.
      - caption: '1946: the principles affirmed'
        detail: UN General Assembly Resolution 95(I) affirms the principles of the Nuremberg Charter and Judgment.
