  - concept: laws2000-w11-icc-admissibility-and-complementarity
    plain: Even with jurisdiction, the ICC steps back if a state with jurisdiction is genuinely handling the case. It acts only where states are unwilling or unable, and only for cases grave enough.
    concrete: 'After the Prosecutor''s investigation into the Philippines'' "war on drugs" was authorised in 2021, the Philippines asked the Court to defer, saying national proceedings were under way. In January 2023 the Pre-Trial Chamber let the investigation resume, finding the national proceedings insufficient in scope — complementarity in action: the state''s claim to be acting did not displace the Court once its proceedings did not genuinely cover the case.'
    formal: 'The ICC is "complementary to national criminal jurisdictions" (art 1). Art 17(1): inadmissible where (a) a state with jurisdiction is investigating or prosecuting, or (b) investigated and decided not to prosecute — unless unwilling or unable genuinely to do so; (c) the person was already tried (art 20(3)); (d) insufficient gravity. Unwillingness: shielding, unjustified delay, lack of independence. Inability: collapse or unavailability of the judicial system.'
    analogy:
      text: 'A back-up generator: the national courts are the mains supply. The generator stays off while the mains genuinely work, and starts only when they fail or are switched off on purpose — and not for trivial loads.'
      maps:
        - from: the mains supply
          to: national criminal proceedings
        - from: the back-up generator
          to: the ICC
        - from: mains failing / switched off on purpose
          to: inability / unwillingness
        - from: not for trivial loads
          to: the gravity threshold (art 17(1)(d))
      limits:
        - A generator switches on automatically; the ICC must decide, case by case, whether national proceedings are genuine, applying the criteria in art 17.
    terms:
      - term: complementarity
        gloss: 'The ICC complements national criminal jurisdictions: national courts come first, and the Court acts where states are unwilling or unable genuinely to proceed.'
      - term: unwillingness
        gloss: Proceedings to shield the person, unjustified delay inconsistent with intent to bring them to justice, or proceedings not independent or impartial.
      - term: inability
        gloss: A total or substantial collapse or unavailability of the national judicial system leaves the state unable to obtain the accused or evidence, or to proceed.
      - term: gravity
        gloss: A case not of sufficient gravity to justify further action by the Court is inadmissible (art 17(1)(d)).
    misconceptions:
      - claim: '"Complementary" means the ICC hears appeals from national courts.'
        tempting: '"Complementary" sounds like a higher, supervising court.'
        correction: 'Complementarity gives national courts priority: under art 17 a case is inadmissible while a state with jurisdiction genuinely investigates or prosecutes. The ICC is not an appeal court.'
      - claim: Years of unexplained adjournments in functioning courts show inability.
        tempting: Nothing is happening, so the state seems unable.
        correction: Unjustified delay inconsistent with an intent to bring the person to justice is a sign of unwillingness. Inability requires a total or substantial collapse or unavailability of the judicial system.
      - claim: A case is admissible whenever a state with jurisdiction exists.
        tempting: Jurisdiction and admissibility sound like the same test.
        correction: 'The reverse: a case being genuinely investigated or prosecuted by such a state is inadmissible. Admissibility is a separate test after jurisdiction.'
    socratic:
      - ask: The ICC has jurisdiction. Can it simply proceed?
        hint: Art 17.
        answer: No. It must also find the case admissible — national courts come first under complementarity.
      - ask: A state with jurisdiction is prosecuting the accused. What now?
        hint: Genuinely?
        answer: The case is inadmissible unless the state is unwilling or unable genuinely to carry out the investigation or prosecution.
      - ask: What signs point to unwillingness?
        hint: Three in art 17(2).
        answer: Proceedings to shield the person, unjustified delay inconsistent with intent to bring them to justice, or proceedings not conducted independently or impartially.
      - ask: And to inability?
        hint: The courts themselves.
        answer: A total or substantial collapse or unavailability of the national judicial system, so the state cannot obtain the accused or the evidence, or otherwise proceed.
      - ask: Nothing at national level — is the case then admissible?
        hint: One more filter.
        answer: Only if it is of sufficient gravity to justify further action by the Court (art 17(1)(d)).
    elements:
      - name: National investigation or prosecution
        test: Inadmissible if a state with jurisdiction is investigating or prosecuting, unless it is unwilling or unable genuinely to do so (art 17(1)(a)).
        authorities:
          - rome-statute-art-17
      - name: Decision not to prosecute
        test: Inadmissible if such a state investigated and decided not to prosecute, unless that decision resulted from unwillingness or inability (art 17(1)(b)).
        authorities:
          - rome-statute-art-17
      - name: Already tried
        test: Inadmissible if the person has been tried for the conduct and a trial by the Court is not permitted under art 20(3) (art 17(1)(c)).
        authorities:
          - rome-statute-art-17
      - name: Sufficient gravity
        test: Inadmissible if not of sufficient gravity to justify further action by the Court (art 17(1)(d)).
        authorities:
          - rome-statute-art-17
    what-if:
      - change: State Z's courts open proceedings against a general but adjourn them for years without explanation while he stays free.
        effect: 'Points to unwillingness: unjustified delay inconsistent with an intent to bring him to justice. The case may be admissible despite the national proceedings.'
      - change: After a civil war, State Q's courts have stopped functioning; it cannot obtain the accused or evidence but says it is "investigating".
        effect: 'Inability: a total or substantial collapse of the judicial system. The claimed investigation is not genuine, so the case may be admissible.'
      - change: State R genuinely investigated and, on the evidence, decided not to prosecute.
        effect: 'Inadmissible under art 17(1)(b): a genuine decision not to prosecute bars the Court, unless it resulted from unwillingness or inability.'
    boundary:
      - text: The Philippines' 2021 deferral request.
        why: 'Not enough to bar the Court: the Pre-Trial Chamber found the national proceedings insufficient in scope and let the investigation resume.'
      - text: An isolated, minor incident within a wider situation.
        why: 'May be inadmissible for insufficient gravity (art 17(1)(d)) even if no state is acting: the Court is limited to the most serious crimes.'
    transfer:
      - scenario: State T, a Party, announces a "truth commission" for a former army chief accused of crimes against humanity. It has no power to prosecute, and the chief keeps his post.
        answer: Not a bar to admissibility. Art 17 defers to genuine investigation or prosecution. A body that cannot prosecute, alongside signs the process shields the chief from criminal responsibility, points to unwillingness. If the case is grave enough, the ICC may proceed.
    sources:
      - Week 11 - Lecture Slides - International Criminal Law (text extract) (slides 48–49)
      - 'Week 11 - Lecture Slides - International Criminal Law (image slides transcribed) (slides 37, 44: preliminary examination asks whether there are genuine national proceedings; the Philippines timeline)'
      - 'Week 12 - Tutorial Revision Quiz Questions (Q19: complementarity)'
