  - concept: laws2000-w11-ad-hoc-tribunals-icty-and-ictr
    plain: In the 1990s the Security Council itself created two temporary criminal courts — for the former Yugoslavia and for Rwanda — using its Chapter VII powers, so every state had to co-operate with them.
    concrete: At the ICTR, Jean Kambanda pleaded guilty to genocide in May 1998, and in September 1998 Jean-Paul Akayesu was convicted of genocide, the Tribunal finding that sexual violence could constitute its actus reus. The slides credit the ICTR with establishing that genocide had occurred and with developing ICL on sexual offences and incitement — while noting criticisms of delays, treatment of victims, selective prosecutions and distance from affected communities.
    formal: 'ICTY: Resolution 827 (25 May 1993), under Chapter VII; "all States shall cooperate fully"; Statute art 1 — serious violations of IHL in the former Yugoslavia since 1991. ICTR: created under Chapter VII on 8 November 1994, seated in Arusha; art 1 — serious IHL violations in Rwanda, and by Rwandans in neighbouring states, in 1994; arts 2–4 — genocide, crimes against humanity, Common Article 3 and Protocol II.'
    terms:
      - term: ad hoc tribunal
        gloss: A temporary international criminal tribunal created for one conflict — here by the Security Council under Chapter VII, not by treaty.
      - term: Residual Mechanism (MICT)
        gloss: The International Residual Mechanism for Criminal Tribunals, established in 2010 to carry on the ICTY's and ICTR's remaining functions.
      - term: Chapter VII
        gloss: '"Action with respect to Threats to the Peace, Breaches of the Peace, and Acts of Aggression" — the Charter chapter used to create both tribunals.'
    misconceptions:
      - claim: The ICTY was set up by a treaty among the successor states of the former Yugoslavia.
        tempting: Many international courts rest on treaties.
        correction: It was established by Security Council Resolution 827 (25 May 1993), acting under Chapter VII; no ratification was involved.
      - claim: Only the states of the former Yugoslavia had to co-operate with the ICTY.
        tempting: The crimes happened there.
        correction: Resolution 827 decided that "all States shall cooperate fully" — binding on every UN member under art 25 of the Charter.
      - claim: The ICTY could prosecute genocide or war crimes committed anywhere after 1991.
        tempting: It tried very grave international crimes.
        correction: Art 1 of its Statute limits it to serious violations of IHL committed in the territory of the former Yugoslavia since 1991.
    socratic:
      - ask: Who created the ICTY, and with what power?
        hint: Resolution 827.
        answer: The Security Council, acting under Chapter VII of the Charter, in Resolution 827 (25 May 1993).
      - ask: Which states had to co-operate with it, and why?
        hint: Art 25 of the Charter.
        answer: 'All states: the resolution decided that all States shall cooperate fully, and members agree to carry out the Council''s decisions (art 25).'
      - ask: What could each tribunal try?
        hint: Place and time.
        answer: 'ICTY: serious IHL violations in the former Yugoslavia since 1991. ICTR: serious IHL violations in Rwanda, and by Rwandans in neighbouring states, during 1994.'
      - ask: What did the ICTR add to ICL?
        hint: Akayesu.
        answer: It established that genocide had occurred, and developed the law on sexual offences — sexual violence as genocide's actus reus — and incitement.
      - ask: What are the main criticisms?
        hint: Money, time, distance.
        answer: Cost, delays, lack of victim participation or poor treatment of victims, selective prosecutions, and distance from affected communities.
    elements:
      - name: Created by the Security Council
        test: 'A Chapter VII decision, not a treaty: Resolution 827 for the ICTY; the ICTR likewise under Chapter VII (8 November 1994).'
        authorities:
          - unsc-resolution-827
      - name: All states must co-operate
        test: '"All States shall cooperate fully"; Council decisions bind every member under art 25.'
        authorities:
          - unsc-resolution-827
          - un-charter-art-25
      - name: Limited jurisdiction
        test: 'ICTY: serious IHL violations in the former Yugoslavia since 1991. ICTR: in Rwanda, or by Rwandans in neighbouring states, in 1994.'
        authorities:
          - icty-statute-art-1
          - ictr-statute-arts-1-4
    what-if:
      - change: A state that had no part in the Yugoslav conflict refuses to arrest an ICTY fugitive on its territory, saying it never consented to the Tribunal.
        effect: 'Consent is irrelevant: Resolution 827 decided that all States shall cooperate fully, and art 25 binds every UN member to carry out that Chapter VII decision.'
      - change: A Rwandan citizen committed the killings in a neighbouring state in 1994.
        effect: 'Within the ICTR: art 1 covers Rwandan citizens responsible for serious IHL violations in the territory of neighbouring states between 1 January and 31 December 1994.'
      - change: The massacre in Rwanda happened in 1995.
        effect: Outside the ICTR's temporal jurisdiction, which ran only from 1 January to 31 December 1994.
    boundary:
      - text: Killings in Rwanda by a Rwandan in March 1994.
        why: 'Inside the ICTR: territory of Rwanda, within 1994, and genocide, crimes against humanity or Common Article 3 violations (arts 2–4).'
      - text: A war crime in the former Yugoslavia in 1990.
        why: 'Outside the ICTY: art 1 reaches serious IHL violations committed "since 1991".'
    transfer:
      - scenario: 'Exam: "Why was Australia obliged to co-operate with the ICTY, though there was no ICTY treaty for it to sign?"'
        answer: 'Because the ICTY was not a treaty body: the Security Council created it under Chapter VII, and Resolution 827 decided that "all States shall cooperate fully". Under art 25 of the Charter that decision binds every UN member, Australia included; no consent was needed.'
    objections:
      - position: The ad hoc tribunals were a success for international justice.
        evidence: The ICTY charged 161 people (90 convictions, 19 acquittals); both tribunals contributed to ICL, the historical record and combating denial; the ICTR established that genocide had occurred.
        objection: Critics point to cost, delays, lack of victim participation, selective prosecutions, and distance from affected communities.
        reply: Partly in response, treaty-based hybrid courts were proposed as more efficient, locally based courts (slide 25).
    storyboard:
      - caption: '1993: Resolution 827 creates the ICTY'
        detail: Chapter VII; all States must co-operate; serious IHL violations in the former Yugoslavia since 1991.
      - caption: '1994: the ICTR follows'
        detail: Created under Chapter VII on 8 November 1994, seated in Arusha, for crimes in 1994.
      - caption: '1995: Tadić on the ICTY''s creation'
        detail: The Interlocutory Appeal Decision addresses the legality of creating the ICTY.
      - caption: '1998–99: landmark cases'
        detail: Kambanda pleads guilty; Akayesu convicted of genocide; Milošević indicted while President.
      - caption: '2010–17: wind-down'
        detail: MICT established 2010; ICTR closes December 2015; ICTY closes 31 December 2017.
    sources:
      - Week 11 - Lecture Slides - International Criminal Law (text extract) (slides 16–23)
      - 'Week 11 - Lecture Slides - International Criminal Law (image slides transcribed) (slide 25: why hybrid courts were proposed)'
      - 'Week 11 - Tutorial Tasks - International Criminal Law (Q1–2: instruments establishing the tribunals; which states had to co-operate)'
