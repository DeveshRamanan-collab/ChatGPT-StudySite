aids:
  - concept: laws2000-w11-what-is-international-criminal-law
    plain: International criminal law makes individual people — not only states — criminally liable for the gravest breaches of international rules, and sets the procedures for trying them.
    concrete: 'At Nuremberg, the IMT Charter provided for the individual criminal responsibility of leaders, organisers, instigators and accomplices: the defendants answered personally for crimes against peace, war crimes and crimes against humanity. That is ICL''s hallmark — a breach of international rules entailing the personal criminal liability of the individual — and a different question from whether Germany, as a state, was responsible for internationally wrongful acts.'
    formal: 'International crimes are "breaches of international rules entailing the personal criminal liability of the individual(s) concerned". ICL, a branch of public international law, has two limbs: substantive law, which governs the four core international crimes and demands that states prosecute them; and procedural law, regulating the stages of international criminal proceedings, found in the statutes and rules of the international(ised) tribunals.'
    terms:
      - term: international crime
        gloss: A breach of international rules entailing the personal criminal liability of the individual(s) concerned.
      - term: substantive limb
        gloss: The crimes' acts and subjective elements, when an accused may nevertheless not be liable, and when states may prosecute or bring accused persons to trial.
      - term: procedural limb
        gloss: Rules for pre-trial, trial and appeals, rights of the accused, evidence, sentencing and victims' rights, found in each tribunal's statute and rules.
      - term: hybrid branch
        gloss: ICL draws unique characteristics from international humanitarian law, international human rights law and national criminal laws.
    misconceptions:
      - claim: An international crime is just an internationally wrongful act of a state.
        tempting: Week 7's state responsibility also concerns breaches of international obligations.
        correction: International crimes entail the personal criminal liability of individuals. Whether the state is responsible for an internationally wrongful act is a separate question.
      - claim: Calling ICL "hybrid" means its courts mix national and international judges.
        tempting: Hybrid tribunals such as the ECCC do exactly that.
        correction: On the slides, ICL is a hybrid branch of law because it draws on IHL, international human rights law and national criminal laws. Hybrid courts are a separate idea.
      - claim: ICL is fully codified, with precise crimes and penalties.
        tempting: The Rome Statute and tribunal statutes look comprehensive.
        correction: 'The slides call ICL relatively new and rudimentary: the actus reus and mens rea of its crimes have not always been clear, and penalties are not laid down precisely.'
    socratic:
      - ask: A massacre is committed by a state's soldiers. Who might answer for it under international law?
        hint: Two different regimes.
        answer: The state, under the law of state responsibility, and the individuals, under international criminal law — separate questions.
      - ask: What makes a breach an international crime?
        hint: The slides' definition.
        answer: It breaches international rules and entails the personal criminal liability of the individual(s) concerned.
      - ask: What does ICL's substantive limb cover?
        hint: Four core crimes.
        answer: The acts and subjective elements of the core crimes, when an accused may nevertheless not be liable, and when states may prosecute — and it demands that states prosecute.
      - ask: Where would you find the rules on evidence or victims' participation?
        hint: The procedural limb.
        answer: In the statutes and rules of the various international(ised) criminal tribunals.
    what-if:
      - change: The question is whether a state must pay reparation for its army's massacre of civilians.
        effect: 'That is state responsibility (Week 7), not ICL: it asks about the state''s internationally wrongful act, not any individual''s criminal liability.'
      - change: The question is whether the general who ordered the massacre can be tried.
        effect: 'That is ICL: an international crime entails the general''s personal criminal liability, whatever the state''s own responsibility.'
    boundary:
      - text: A state's breach of a trade treaty.
        why: 'Outside ICL: a breach of an international obligation by a state, with no personal criminal liability of any individual.'
      - text: Rules on victims' participation at an international tribunal.
        why: 'Inside ICL, as procedural law: victims have a prominent part in international criminal proceedings.'
    transfer:
      - scenario: A militia leader's forces destroy a village. Her state is sued at the ICJ, and an international prosecutor separately charges her personally. A student says the two cases are duplicates.
        answer: They are not. The ICJ case concerns the state's responsibility for an internationally wrongful act. The prosecution concerns an international crime — a breach of international rules entailing the leader's personal criminal liability — governed by ICL's substantive and procedural law.
    sources:
      - Week 11 - Lecture Slides - International Criminal Law (text extract) (slides 4–7)
