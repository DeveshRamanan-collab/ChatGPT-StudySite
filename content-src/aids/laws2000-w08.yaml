      - Week 08 - Lecture Slides - International Dispute Settlement (slides 25–28, 35)
      - 'Week 08 - Lecture Transcript (Live) - International Dispute Settlement (Part A) (ICJ introduction: 15 judges, election, contentious cases between states only, advisory opinions under art 96, binding effect, Chagos)'
