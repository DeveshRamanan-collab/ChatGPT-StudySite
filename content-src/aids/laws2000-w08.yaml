  - concept: laws2000-w08-regional-and-economic-dispute-settlement
    plain: Regional organisations and the WTO offer their own peaceful ways to settle disputes. The UN Charter asks states to try regional routes for local disputes before going to the Security Council.
    concrete: The Arab League, founded in 1945 and headquartered in Cairo, now has 22 members. Its Charter forbids recourse to force to settle disputes between members (art 5). The League's Council mediates disputes that may lead to war, deciding on arbitration and mediation by majority vote. But under art 7, unanimous Council decisions bind all members, while majority decisions bind only the members that accept them.
    formal: 'Art 33(1) UN Charter includes "resort to regional agencies or arrangements". Art 52: regional arrangements consistent with the UN''s Purposes and Principles are permitted; members "shall make every effort to achieve pacific settlement of local disputes" through them "before referring them to the Security Council", which shall encourage this. WTO disputes go through Annex 2 of the WTO Agreement, the Understanding on Rules and Procedures Governing the Settlement of Disputes.'
    terms:
      - term: art 52 UN Charter
        gloss: Permits regional arrangements consistent with UN Purposes and Principles; members make every effort to settle local disputes regionally before going to the Security Council.
      - term: Dispute Settlement Understanding
        gloss: 'Annex 2 of the WTO Agreement: the Understanding on Rules and Procedures Governing the Settlement of Disputes.'
      - term: non-discrimination (WTO)
        gloss: Most-favoured-nation treatment and national treatment — alongside tariff ceilings (art II) and the general prohibition on non-tariff barriers (art XI).
    misconceptions:
      - claim: A local dispute that may endanger peace must go straight to the Security Council.
        tempting: The Security Council has primary responsibility for peace and security.
        correction: 'Art 52(2): members of regional arrangements shall make every effort to settle local disputes regionally before referring them to the Security Council, which shall encourage this (art 52(3)).'
      - claim: Majority decisions of the Arab League Council bind all members.
        tempting: That is the rule for unanimous decisions.
        correction: 'Art 7: unanimous decisions bind all members; majority decisions bind only those that accept them.'
      - claim: The WTO bans tariffs and caps non-tariff barriers.
        tempting: Both sound like trade liberalisation.
        correction: 'Reversed: tariffs have fixed upper limits (art II and the schedules); non-tariff barriers are generally prohibited (art XI).'
    socratic:
      - ask: Two ASEAN members have a border dispute that may endanger regional peace. Where should they turn first?
        hint: Art 52(2).
        answer: 'To regional settlement: every effort through ASEAN''s arrangements (Treaty of Amity and Cooperation, art 2(d); Chapter IV) before referring it to the Security Council.'
      - ask: Is relying on a regional arrangement consistent with the Charter?
        hint: Art 52(1); art 33(1).
        answer: Yes, if the arrangement and its activities are consistent with the UN's Purposes and Principles; art 33(1) lists resort to regional agencies among the peaceful means.
      - ask: What does the Security Council do meanwhile?
        hint: Art 52(3).
        answer: It shall encourage pacific settlement of local disputes through regional arrangements, on the states' initiative or by its own reference.
      - ask: Which procedures does the OAS Charter list?
        hint: Art 25.
        answer: Direct negotiation, good offices, mediation, investigation and conciliation, judicial settlement, arbitration, and any the parties especially agree upon.
      - ask: A tariff dispute arises between WTO members. Which mechanism?
        hint: Annex 2.
        answer: The WTO's Understanding on Rules and Procedures Governing the Settlement of Disputes (Annex 2 of the WTO Agreement).
    elements:
      - name: A permitted regional arrangement
        test: The arrangement and its activities are consistent with the Purposes and Principles of the UN.
        authorities:
          - un-charter-art-52
      - name: Regional effort first
        test: Members make every effort to settle local disputes through the regional arrangement before referring them to the Security Council.
        authorities:
          - un-charter-art-52
          - un-charter-art-33-1
      - name: The organisation's own procedure
        test: Use the body's listed means — e.g. OAS arts 24–25, AU Peace and Security Council, Arab League arts 5–7, ASEAN art 2(d).
        authorities:
          - oas-charter-arts-24-25
          - african-union-psc-protocol-art-4
          - charter-of-the-arab-league-arts-5-7
          - treaty-of-amity-and-cooperation-in-southeast-asia-art-2
      - name: Trade disputes
        test: WTO disputes go through the Dispute Settlement Understanding in Annex 2 of the WTO Agreement.
        authorities:
          - wto-dispute-settlement-understanding
    what-if:
      - change: The dispute is between two OAS members.
        effect: 'Art 24 OAS Charter: it shall be submitted to the Charter''s peaceful procedures — negotiation, good offices, mediation, investigation and conciliation, judicial settlement, arbitration, or any agreed.'
      - change: The Arab League Council decides by majority, and State X voted against.
        effect: 'X is not bound unless it accepts the decision: under art 7 only unanimous decisions bind all members.'
      - change: The dispute concerns another member's import ban rather than a tariff.
        effect: 'Still a WTO matter: art XI generally prohibits non-tariff barriers, and the dispute goes through the Dispute Settlement Understanding (Annex 2).'
    boundary:
      - text: The OSCE Court of Conciliation and Arbitration in Geneva.
        why: A regional mechanism established by the 1992 Convention for the peaceful settlement of disputes between states — not the ICJ in The Hague.
      - text: A local dispute that regional efforts fail to settle.
        why: 'Art 52 does not close the door: once every effort has been made regionally, the dispute may be referred to the Security Council.'
    transfer:
      - scenario: Forces of two African Union members clash near a disputed border town, and both governments fear escalation.
        answer: Arts 33(1) and 52(2) point first to regional settlement. The AU's Peace and Security Council is guided by peaceful settlement of disputes and early responses to contain crises before they become full-blown conflicts (Protocol art 4). The states should make every effort through it before referring the dispute to the Security Council, which encourages regional settlement (art 52(3)).
    sources:
      - Week 08 - Lecture Slides - International Dispute Settlement (slides 37–48)
