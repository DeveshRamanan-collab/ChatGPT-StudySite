  - concept: laws2000-w08-icj-jurisdiction-and-consent
    plain: The ICJ can hear a contentious case only between states, and only if both have consented — by special agreement, treaty clause, matching optional-clause declarations, or acceptance after filing.
    concrete: In the tutorial, State A, a small West African country, sues State B, a Pacific nation, alleging conduct contrary to the Genocide Convention. The Court has no compulsory jurisdiction, so A must point to B's consent. Art IX of the Convention sends disputes about its interpretation, application or fulfilment to the ICJ at the request of any party. If both are parties, that treaty clause supplies consent — provided a dispute existed when A filed.
    formal: 'Only states may be parties (art 34 ICJ Statute); international organisations may only seek advisory opinions. Jurisdiction rests on consent, to the specific case or a category of disputes. Art 36: special agreement (compromis); a treaty clause; declarations under art 36(2) accepting jurisdiction over future disputes with states accepting the same obligation (optional clause); forum prorogatum. The Court decides its own jurisdiction (art 36(6)).'
    terms:
      - term: compromis
        gloss: A special agreement by which the parties submit a particular dispute to the Court.
      - term: optional clause (art 36(2))
        gloss: A declaration accepting the Court's jurisdiction over future legal disputes with any other state accepting the same obligation.
      - term: forum prorogatum
        gloss: Consent given by a state after an application has been filed against it.
      - term: compétence de la compétence
        gloss: The Court's power to rule on its own jurisdiction when the parties disagree (art 36(6)).
    misconceptions:
      - claim: UN membership gives the ICJ jurisdiction over disputes between any members.
        tempting: The Court can hear disputes between the 193 members.
        correction: 'That is access, not jurisdiction. The ICJ has no compulsory jurisdiction: it needs the parties'' consent to the case, or to a category of disputes it falls within.'
      - claim: One state's optional-clause declaration lets it sue any other state.
        tempting: The declaration is general.
        correction: It operates only in relation to another state accepting the same obligation. A state with no declaration, treaty clause or compromis has not consented.
      - claim: Once both parties have consented, jurisdiction cannot be contested.
        tempting: Consent is the core of jurisdiction.
        correction: The case must fall within the consent given, and a dispute must have existed when proceedings were instituted. If the parties disagree, the Court decides (art 36(6)).
    socratic:
      - ask: An NGO and the UN each want to bring a case against State X. Can they?
        hint: Art 34.
        answer: No. Only states may be parties. The UN may request advisory opinions but cannot be a party; the NGO has no access at all.
      - ask: State A wants to sue State B. What must A point to?
        hint: No compulsory jurisdiction.
        answer: B's consent — to this case, or to a category of disputes that includes it.
      - ask: What are the ways consent can be given?
        hint: Art 36.
        answer: A compromis for the particular dispute; a treaty clause such as art IX of the Genocide Convention; declarations by both states under art 36(2); or forum prorogatum.
      - ask: B had not consented when A filed, but afterwards accepts the Court's jurisdiction over the case. Effect?
        hint: Later consent.
        answer: 'Forum prorogatum: consent given after the application was filed founds jurisdiction.'
      - ask: A and B disagree whether B's consent covers this dispute. Who decides?
        hint: Art 36(6).
        answer: The Court itself — compétence de la compétence.
    elements:
      - name: Access
        test: Both parties are states; international organisations, NGOs and individuals cannot be parties.
        authorities:
          - icj-statute-art-34
      - name: A consent route
        test: A compromis, a treaty clause, art 36(2) declarations by both states, or forum prorogatum.
        authorities:
          - icj-statute-art-36
          - genocide-convention-art-ix
      - name: Consent covers this dispute
        test: The consent extends to this dispute and these parties — e.g. both declarations accept the same obligation; any treaty conditions, such as trying other means first, are met.
        authorities:
          - icj-statute-art-36
      - name: A dispute at filing
        test: A dispute existed at the date proceedings were instituted.
        cases:
          - south-west-africa-ethiopia-v-south-africa-liberia-v-south-africa
      - name: The Court decides
        test: If the parties disagree about jurisdiction, the Court rules on it (art 36(6)).
        authorities:
          - icj-statute-art-36
    what-if:
      - change: Neither A nor B is party to the Genocide Convention or any treaty with an ICJ clause, and B refuses to take part.
        effect: No jurisdiction unless consent appears another way — matching art 36(2) declarations, a compromis, or later acceptance. The Court has no compulsory jurisdiction.
      - change: B accepts the Court's jurisdiction over the case after A files.
        effect: 'Forum prorogatum: consent given after the application is enough to found jurisdiction.'
      - change: The applicant is an international organisation.
        effect: 'No contentious case: international organisations, including the UN, cannot be parties (art 34). They may only request advisory opinions.'
    boundary:
      - text: Art IX of the Genocide Convention.
        why: 'A treaty clause: disputes on the Convention''s interpretation, application or fulfilment go to the ICJ at any party''s request — consent given in advance.'
      - text: State K has an art 36(2) declaration; State L has none and no treaty clause or compromis with K.
        why: 'No jurisdiction: art 36(2) works only between states accepting the same obligation, and L has not consented.'
    transfer:
      - scenario: State P accuses State Q of breaching a bilateral treaty whose dispute clause sends disputes to the ICJ "if they cannot be settled by negotiation". Q's foreign ministry replies that it rejects P's claims and will not negotiate. P files.
        answer: 'Consent can come from the treaty clause, but it is contingent on the parties being unable to resolve the dispute by other means — Q''s refusal to negotiate helps P show that. A dispute existed at filing: P''s claim was positively opposed by Q, which was plainly aware of it. Both are states (art 34); any disagreement on jurisdiction is for the Court (art 36(6)).'
    sources:
      - Week 08 - Lecture Slides - International Dispute Settlement (slides 30–32, 36)
      - Week 08 - Tutorial Tasks - International Dispute Settlement (question 1(a); question 2(a) and art IX of the Genocide Convention)
    verify: false
  - concept: laws2000-w08-provisional-measures
    plain: While a case is pending, the ICJ can order interim steps to prevent irreparable harm to the rights in dispute. Those orders bind the parties.
    concrete: 'The tutorial''s facts: State A sues State B under the Genocide Convention, alleging B has incarcerated disproportionate numbers of a minority group, forcibly displaced large parts of it, and enabled the destruction of its villages and sacred sites. A final judgment may take years. If the destruction continues meanwhile, the judgment could come too late to matter. Provisional measures fill that gap: interim orders preserving the rights in dispute until the Court decides.'
    formal: 'Art 41 ICJ Statute: the Court may "indicate, if it considers that circumstances so require, any provisional measures which ought to be taken to preserve the respective rights of either party". Conditions: absence of jurisdiction not manifest; rights at least plausible; a link between those rights and the measures; a real and imminent risk of irreparable harm before the final decision. They bind (LaGrand, 2001, para 102).'
    analogy:
      text: 'A court tells two neighbours fighting over a heritage tree: nobody cuts it down until we decide whose it is.'
      maps:
        - from: the tree
          to: the rights in dispute
        - from: nobody cuts it down until we decide
          to: provisional measures pending the final decision
        - from: cutting it down
          to: irreparable harm that would make the judgment meaningless
      limits:
        - 'The Court acts before knowing who is right or even finally whether it has jurisdiction: it needs only that its lack of jurisdiction is not manifest and the rights are plausible.'
    terms:
      - term: provisional measures
        gloss: Interim orders under art 41 preserving the parties' rights pending the final decision, so the judgment is not rendered meaningless.
      - term: prima facie jurisdiction
        gloss: At this stage the Court need only be satisfied that the absence of jurisdiction is not manifest.
      - term: irreparable harm
        gloss: Harm the final judgment could not undo; there must be a real and imminent risk of it before the decision.
    misconceptions:
      - claim: Provisional measures are only recommendations, because art 41 says "indicate".
        tempting: '"Indicate" sounds weaker than "order".'
        correction: 'LaGrand (2001, para 102): the power to indicate measures "entails that such measures should be binding"; the contrary would defeat the object and purpose of art 41.'
      - claim: The Court must first establish its jurisdiction over the merits.
        tempting: Jurisdiction normally comes first.
        correction: It need only be satisfied that the absence of jurisdiction is not manifest, and that the rights claimed are at least plausible.
      - claim: Any risk of financial loss justifies provisional measures.
        tempting: Loss is harm.
        correction: There must be a real and imminent risk of irreparable harm before the final decision; ordinary, compensable loss does not suffice.
    socratic:
      - ask: State A fears State B will destroy the minority group's villages and sacred sites before judgment. What can A ask for?
        hint: Art 41.
        answer: Provisional measures to preserve the rights in dispute pending the final decision.
      - ask: Must the Court first decide that it has jurisdiction under art IX?
        hint: Manifest?
        answer: No — only that the absence of jurisdiction is not manifest. If both are parties to the Convention, art IX gives at least that.
      - ask: What must A show about its rights?
        hint: Plausible.
        answer: That the rights for which protection is sought — here under the Genocide Convention — are at least plausible.
      - ask: Where is the urgency?
        hint: Irreparable.
        answer: 'Destroyed villages and sacred sites, or harm to the group, cannot be undone by a later judgment: a real and imminent risk of irreparable harm.'
      - ask: A also asks the Court to halt B's unrelated national elections. Likely?
        hint: Link.
        answer: No. There must be a link between the rights claimed and the measures; the measures must be appropriate and necessary to protect those rights.
    elements:
      - name: Prima facie jurisdiction
        test: The absence of jurisdiction is not manifest; jurisdiction need not be finally decided.
        authorities:
          - icj-statute-art-41
      - name: Plausible rights
        test: The rights for which protection is sought are at least plausible.
        authorities:
          - icj-statute-art-41
      - name: Link
        test: A link between those rights and the measures requested, which must be appropriate and necessary to protect them.
      - name: Urgency
        test: A real and imminent risk that irreparable harm will occur before the final decision is given.
      - name: Binding effect
        test: Measures indicated under art 41 bind the parties, from the Statute's object and purpose of binding settlement (art 59).
        cases:
          - lagrand-case-germany-v-united-states-of-america
        authorities:
          - icj-statute-art-41
          - icj-statute-art-59
    what-if:
      - change: Neither party has accepted the Court's jurisdiction in any form, and the respondent rejects the case.
        effect: 'Measures are unlikely: the absence of jurisdiction would be manifest, failing the first condition.'
      - change: The harm feared is a financial loss that could be compensated after judgment.
        effect: 'Urgency fails: measures need a real and imminent risk of irreparable harm before the final decision.'
      - change: The respondent ignores measures the Court has indicated.
        effect: It disregards a binding order (LaGrand); as Week 7 noted, failing to comply with an ICJ decision could itself engage the state's responsibility.
    boundary:
      - text: A request to halt the demolition of a disputed cultural site scheduled for next week.
        why: 'Strong on urgency: demolition is irreparable and imminent — suited to measures if jurisdiction is not manifestly absent and the rights are plausible.'
      - text: A request to stop unrelated national elections.
        why: 'Fails the link: measures must be appropriate and necessary to protect the rights claimed in the case.'
    transfer:
      - scenario: State M sues State N under a treaty protecting shared wetlands, whose dispute clause refers disputes to the ICJ. N plans to drain the wetland next month for a highway; the case will take years. M seeks an order stopping the drainage.
        answer: 'Provisional measures (art 41) may be indicated: with the treaty clause, the absence of jurisdiction is not manifest; M''s treaty rights are at least plausible; halting drainage is linked and necessary to protect them; draining is a real and imminent risk of irreparable harm. Any measures bind N (LaGrand).'
    sources:
      - Week 08 - Lecture Slides - International Dispute Settlement (slides 33–34)
      - Week 08 - Tutorial Tasks - International Dispute Settlement (question 1(b); question 2(b))
