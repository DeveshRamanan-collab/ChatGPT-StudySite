  - concept: laws2000-w04-international-organisations-definition-and-personality
    plain: An international organisation is a body that states create under international law — usually by treaty — with a legal identity of its own, separate from its members.
    concrete: The UN rents office buildings in New York and employs staff there; Charter art 104 gives it the domestic legal capacity to do that. But when it wanted to claim reparation from a state for injuries to its agent, domestic capacity was not enough — it needed international legal personality, which the Charter never mentions. In Reparation for Injuries (1949) the ICJ held that the members, by entrusting functions to the UN, had clothed it with the competence those functions required.
    formal: 'ARIO art 2(a): an IO is "established by a treaty or other instrument governed by international law and possessing its own international legal personality", and "may include as members, in addition to States, other entities". Personality is conferred expressly (WTO Agreement art VIII) or implicitly (Reparation for Injuries [1949] ICJ Rep 174, 179). Membership, withdrawal and expulsion follow the constitutive instrument (UN Charter arts 4, 6; Rome Statute art 127).'
    analogy:
      text: 'A company: its shareholders create it, but it has its own legal identity — it signs contracts and is sued in its own name, and the shareholders are not the company.'
      maps:
        - from: the shareholders
          to: the member states
        - from: the company's constitution
          to: the constitutive treaty
        - from: the company's own legal identity
          to: the IO's distinct international legal personality
      limits:
        - A company is created under a state's domestic law — which is exactly what makes a body an NGO rather than an IO.
        - A company may do anything lawful; an IO has only the powers its members conferred (speciality).
    terms:
      - term: constitutive instrument
        gloss: The treaty or other instrument creating an IO, such as the UN Charter. It sets membership, withdrawal, expulsion, personality and powers.
      - term: non-governmental organisation (NGO)
        gloss: A body such as Greenpeace or Amnesty International, constituted under domestic law rather than international law — so not an IO, despite its international focus.
      - term: implied personality
        gloss: International personality found from the functions the members intended an IO to exercise, where its instrument is silent (Reparation for Injuries).
      - term: domestic legal capacity (UN Charter art 104)
        gloss: The UN's capacity within members' territory to rent offices, employ staff and contract — distinct from international personality.
    misconceptions:
      - claim: Article 104 of the UN Charter confers international legal personality on the UN.
        tempting: It is the Charter's only clause about the UN's legal capacity.
        correction: Art 104 gives domestic legal capacity in members' territory only. The Charter is silent on international personality, which the ICJ found implicitly in Reparation for Injuries.
      - claim: Any body working across many countries, with states involved, is an international organisation.
        tempting: International reach and state participation look like the marks of an IO.
        correction: 'The test is the governing law: an IO is established by an instrument governed by international law. NGOs such as Greenpeace are constituted under domestic law, whatever their reach.'
      - claim: An IO has international legal personality only if its founding treaty expressly confers it.
        tempting: Express conferral has been the norm for the last 30 years (e.g. WTO art VIII).
        correction: Personality can also be implied from the functions the members intended the organisation to exercise, as the ICJ held for the UN in Reparation for Injuries (1949).
    socratic:
      - ask: Is the body created by a treaty or other instrument governed by international law?
        hint: Compare the UN with Greenpeace.
        answer: 'The UN: yes — the UN Charter is a treaty. Greenpeace: no — it is constituted under domestic law, so it is an NGO, not an IO.'
      - ask: Can an IO be created by something other than a treaty?
        hint: The ICTY and ICTR.
        answer: Yes — "or other instrument". Almost all IOs are created by treaty, but the ICTY and ICTR, for example, were created by Security Council resolutions.
      - ask: The constitutive instrument is silent on international personality. Where do you look?
        hint: Express and implicit conferral.
        answer: To the functions the members intended it to exercise. As in Reparation for Injuries, personality can be implied where those functions require it; art 104-type clauses give only domestic capacity.
      - ask: Who can join, and how does a member leave?
        hint: The constitutive instrument decides.
        answer: 'The instrument sets the conditions: UN Charter art 4 ("peace-loving states"); expulsion for persistent violation (art 6). Withdrawal depends on the instrument: Rome Statute art 127 provides it; the UN Charter does not.'
    elements:
      - name: Established by a treaty or other instrument
        test: Usually a treaty (the UN Charter); sometimes another instrument, such as the Security Council resolutions creating the ICTY and ICTR.
        authorities:
          - ario-2011-art-2-a
      - name: Governed by international law
        test: Its legal framework is international, not domestic law — what distinguishes it from NGOs such as Greenpeace or Amnesty International.
        authorities:
          - ario-2011-art-2-a
      - name: Own international legal personality
        test: 'Distinct from its members'': it can conclude treaties, send and receive delegations, bring claims and be responsible. Conferred expressly (WTO art VIII) or implicitly (Reparation).'
        cases:
          - reparation-for-injuries-suffered-in-the-service-of-the-united-nations
        authorities:
          - ario-2011-art-2-a
          - wto-agreement-art-viii
      - name: Members
        test: Mostly states, but may include other entities (the EU is a member of the FAO); conditions set by the instrument, e.g. UN Charter art 4.
        authorities:
          - ario-2011-art-2-a
          - un-charter-art-4
    what-if:
      - change: The founding treaty expressly says the organisation "shall have legal personality".
        effect: Express conferral settles personality, as with WTO Agreement art VIII — the norm for IOs created in the last 30 years. No argument from implied functions is needed.
      - change: A state wants to leave the UN rather than the ICC.
        effect: The Rome Statute provides withdrawal by written notice, effective one year after receipt (art 127). The UN Charter has no withdrawal clause, so how a state could leave the UN is unclear.
      - change: The body was incorporated under Dutch law, though state officials sit on its board.
        effect: It is not governed by international law, so it is an NGO, not an IO under ARIO art 2(a). International reach and state involvement do not change that.
    boundary:
      - text: The G20.
        why: 'Outside: an informal network of states with no constitutive instrument governed by international law and no personality of its own (slide 51).'
      - text: The ICTY, created by Security Council resolution.
        why: 'Inside without a treaty: a Security Council resolution is an "other instrument governed by international law".'
    transfer:
      - scenario: Five Pacific states sign a treaty creating an ocean-data agency with a governing council and a secretariat. The treaty says nothing about legal personality. The agency now wants to sign a data-sharing agreement with a non-member state.
        answer: 'It fits ARIO art 2(a): created by treaty, governed by international law, with members. Personality is not express, but as in Reparation it can be implied if the functions the members intended — sharing data with other states — require capacity on the international plane. That personality is partial, tied to its functions.'
    sources:
      - 'Week 04 - Lecture Slides - Subjects of International Law and Statehood (slides 49–56, incl. image slide 56: Reparation p 179)'
      - 'Week 04 - Lecture Recording (Online) - Subjects of International Law and Statehood - Full Transcript (21:00–38:00: IOs and NGOs, ARIO art 2(a), membership, withdrawal and expulsion, art 104, Reparation)'
      - Week 04 - Tutorial Task - Subjects of International Law and Statehood (Q1(b))
