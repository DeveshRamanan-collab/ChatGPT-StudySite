  - concept: laws2000-w04-powers-and-responsibility-of-international-organisations
    plain: An international organisation can do only what its members gave it power to do, expressly or by necessary implication — and it answers for its own wrongful acts, separately from its members.
    concrete: 'UN peacekeeping forces are subsidiary organs of the UN, acting under the control of the Security Council and General Assembly. But they are made up of troops contributed by member states, which keep jurisdiction and residual control over them. So when peacekeepers act wrongfully, who is responsible? ARIO art 7 asks who had effective control over the specific conduct: the UN, or a contributing state that kept control of its soldiers.'
    formal: 'Speciality: IOs "do not, unlike States, possess a general competence" (Nuclear Weapons [1996] [25]). Implied powers: "conferred upon it by necessary implication as being essential to the performance of its duties" (Reparation, 182). ARIO art 3: every internationally wrongful act of an IO entails its responsibility; art 6: organs'' and agents'' conduct; art 7: a seconded organ''s conduct is the IO''s if it "exercises effective control over that conduct".'
    analogy:
      text: An agent acting under a power of attorney may do only what the document authorises, plus what is necessarily incidental to that task.
      maps:
        - from: the principal granting the power
          to: the member states
        - from: the power of attorney
          to: the constitutive instrument (express powers)
        - from: acts necessarily incidental to the task
          to: implied powers
      limits:
        - An agent acts for the principal, who answers for the agent's acts; an IO has its own personality and is responsible for its own wrongful acts (International Tin Council).
    terms:
      - term: principle of speciality (attribution, conferred powers)
        gloss: 'IOs have no general competence: only the powers their members give them, limited by the common interests entrusted to them (Nuclear Weapons [25]).'
      - term: implied powers
        gloss: Powers not expressly provided but conferred by necessary implication as essential to the IO's duties (Reparation, 182) — for the UN, bringing a claim.
      - term: effective control (ARIO art 7)
        gloss: 'The test for attributing a seconded organ''s conduct to an IO: factual, assessed for the specific conduct, in the full circumstances (ILC commentary).'
      - term: ARIO
        gloss: 'The ILC''s 2011 draft articles on the responsibility of IOs: not binding, modelled on state responsibility, criticised for treating very different IOs alike.'
    misconceptions:
      - claim: International organisations, like states, have a general competence over any matter not excluded.
        tempting: IOs have international personality, and personality is the state's model.
        correction: IOs "do not, unlike States, possess a general competence" (Nuclear Weapons [25]). They have only the powers their members conferred — the principle of speciality.
      - claim: An IO can only exercise powers expressly written into its constitutive instrument.
        tempting: Speciality limits IOs to conferred powers.
        correction: 'Conferred powers include implied ones: the UN "must be deemed to have those powers which, though not expressly provided in the Charter, are conferred upon it by necessary implication" (Reparation, 182).'
      - claim: Peacekeepers are UN organs, so their conduct is always attributed to the UN alone.
        tempting: Peacekeeping forces are subsidiary organs acting under Security Council control.
        correction: Contributing states keep jurisdiction and residual control. Under ARIO art 7 the conduct is the UN's only if it had effective control; a state that kept control over the specific conduct can be responsible.
    socratic:
      - ask: A regional fisheries body's treaty lets it set catch quotas but says nothing about inspecting vessels. Can it inspect?
        hint: Does the body have a general competence?
        answer: Not as a general competence — IOs have only conferred powers. But the power may be implied if inspection is essential to performing its quota duties (Reparation, 182).
      - ask: Why could the WHO not have the ICJ address the legality of nuclear weapons?
        hint: Nuclear Weapons [25].
        answer: That question could not be deemed a necessary implication of the WHO's constitution; attributing the competence to it would disregard the principle of speciality.
      - ask: The body's own inspectors wrongfully damage a vessel. Who is responsible — the body or its members?
        hint: Distinct personality; the International Tin Council.
        answer: The body. Every internationally wrongful act of an IO entails its own responsibility (ARIO art 3), and its organs' and agents' conduct in performing their functions is its act (art 6).
      - ask: Now the inspectors are a member state's coast guard placed at the body's disposal, and that state's ministry gave the specific order. Who answers?
        hint: ARIO art 7.
        answer: Art 7 attributes the conduct to the IO only if it exercised effective control over that conduct. Here the state kept control, so the conduct is likely the state's.
      - ask: How much weight do the ARIO carry?
        hint: Their status, and the critique.
        answer: They are draft articles, not binding, and criticised for modelling one state-responsibility framework for very different IOs. Cite them as the ILC's framework and note those limits.
    elements:
      - name: Power conferred — express
        test: 'Check the constitutive instrument first: express powers, such as the Security Council''s power to authorise force (UN Charter art 42). IOs have no general competence.'
        cases:
          - legality-of-the-threat-or-use-of-nuclear-weapons
        authorities:
          - un-charter-art-42
      - name: Power conferred — implied
        test: Powers "conferred upon it by necessary implication as being essential to the performance of its duties" (Reparation, 182); not whatever members later wish.
        cases:
          - reparation-for-injuries-suffered-in-the-service-of-the-united-nations
          - legality-of-the-threat-or-use-of-nuclear-weapons
      - name: Internationally wrongful act of the IO
        test: Conduct (action or omission) attributable to the IO that breaches its international obligation; every such act entails its own responsibility (ARIO arts 3–4).
        authorities:
          - ario-2011-arts-3-4
      - name: Attribution — organs and agents
        test: Conduct of an IO organ or agent in performing its functions is the IO's act, "whatever position" it holds (art 6).
        authorities:
          - ario-2011-art-6
      - name: Attribution — seconded state organs
        test: A state organ placed at the IO's disposal acts for the IO only if the IO exercises effective control over that conduct (art 7); otherwise the state may be responsible.
        authorities:
          - ario-2011-art-7
    what-if:
      - change: The Security Council creates an international criminal tribunal, though the Charter never mentions one.
        effect: An implied-powers question. When the Council created the ICTY and ICTR, some states said it lacked the power even by implication; it is now widely recognised that it can.
      - change: The contributing state handed full operational command to the UN, which gave the specific order.
        effect: The UN exercised effective control over that conduct, so under art 7 it is the UN's act and the UN is responsible, not the contributing state.
      - change: Claimants argue that the member states, not the IO, must answer for its wrongful act.
        effect: 'Distinct personality cuts against them: the IO itself is responsible for its wrongful acts, as with the International Tin Council — not its members.'
    boundary:
      - text: UN peacekeepers.
        why: 'At the edge: subsidiary UN organs under Security Council control (art 6), yet troops stay under contributing states'' jurisdiction and residual control, so art 7''s effective-control test decides the specific conduct.'
      - text: The Security Council's creation of the ICTY and ICTR.
        why: Not express in the Charter; whether it was implied was disputed at the time, though now widely recognised — showing implied powers can be contested.
    transfer:
      - scenario: A regional health organisation created to coordinate disease surveillance announces trade sanctions against a member that hid outbreak data. Its treaty gives it no power to sanction.
        answer: 'IOs have no general competence (Nuclear Weapons [25]): only express powers and those necessarily implied as essential to their duties (Reparation, 182). Coordinating surveillance does not obviously require trade sanctions. As with the WHO and nuclear weapons, attributing that power would likely disregard the principle of speciality.'
    sources:
      - Week 04 - Lecture Slides - Subjects of International Law and Statehood (slides 57–60)
      - 'Week 04 - Lecture Recording (Online) - Subjects of International Law and Statehood - Full Transcript (38:00–49:00: speciality, Nuclear Weapons, express and implied powers, ICTY/ICTR, responsibility, ARIO arts 3, 4, 6, 7, peacekeeping)'
    verify: false
flows:
  - slug: is-the-entity-a-state
    title: Is this entity a state?
    summary: Runs an entity through the four Montevideo criteria, the presumption of continuity, the illegality bar and the two theories of recognition.
    start: s1
    concepts:
      - laws2000-w04-montevideo-criteria-for-statehood
      - laws2000-w04-recognition-of-states
    sources:
      - Week 04 - Lecture Slides - Subjects of International Law and Statehood (slides 19–30)
      - Week 04 - Lecture Recording (Live) - Subjects of International Law and Statehood - Full Transcript (29:00–48:00)
      - Week 04 - Tutorial Task - Subjects of International Law and Statehood (Q2–Q3)
    nodes:
      - id: s1
        kind: ask
        text: Does a permanent population live in the territory?
        note: 'No minimum number (Nauru about 12,000) and no nationality requirement: a core population living there permanently is enough.'
        authorities:
          - montevideo-convention-1933-art-1
        branches:
          - label: 'Yes'
            to: s2
          - label: 'No'
            to: e1
      - id: s2
        kind: ask
        text: Is there a defined territory?
        note: 'Any size (the Vatican is about 0.5 sq km). Borders need not be fully delimited: "no rule that the land frontiers of a State must be fully delimited" (North Sea Continental Shelf [46]).'
        cases:
          - north-sea-continental-shelf-cases
        branches:
          - label: 'Yes'
            to: s3
          - label: 'No'
            to: e1
      - id: s3
        kind: ask
        text: Is there an effective government?
        note: A coherent, effective exercise of public power over territory and population, to the exclusion of others; any form of government. The "most tricky" criterion.
        branches:
          - label: 'Yes'
            to: s4
          - label: No — but it is an established state
            to: e2
          - label: No — it is a new entity
            to: e1
      - id: s4
        kind: ask
        text: Can it enter into relations with other states on its own?
        note: Capacity arises from independence. Scotland and Greenland have population, territory and government, but not this.
        branches:
          - label: 'Yes'
            to: s5
          - label: 'No'
            to: e1
      - id: s5
        kind: ask
        text: Were the criteria achieved lawfully?
        note: Non-recognition may prevent statehood where the criteria were achieved by "the unlawful use of force or other egregious violations" of general international law, especially jus cogens (Kosovo Advisory Opinion; Friendly Relations Declaration).
        cases:
          - declaration-of-independence-in-respect-of-kosovo
        authorities:
          - friendly-relations-declaration-1970
        branches:
          - label: 'Yes'
            to: s6
          - label: No — by unlawful force or egregious violations
            to: e3
      - id: s6
        kind: step
        text: 'Consider recognition: state both theories, noting that the declaratory theory is the most widely held today.'
        concept: laws2000-w04-recognition-of-states
        next: s7
      - id: s7
        kind: ask
        text: Which theory of recognition are you applying?
        branches:
          - label: Declaratory (prevailing)
            to: e4
          - label: Constitutive
            to: s8
      - id: s8
        kind: ask
        text: Have other states recognised it, individually or collectively?
        note: 'Collective recognition: UN admission needs a Security Council recommendation (vetoable) and two-thirds of the General Assembly. No diplomatic relations does not mean no recognition.'
        authorities:
          - un-charter-art-4
        branches:
          - label: 'Yes'
            to: e5
          - label: 'No'
            to: e6
      - id: e1
        kind: end
        tone: not-met
        text: 'Not a state: a Montevideo criterion is missing.'
        authorities:
          - montevideo-convention-1933-art-1
      - id: e2
        kind: end
        tone: met
        exception: true
        text: 'Still a state: the presumption of continuity means ineffective government does not end established statehood (Somalia, Syria, Yemen).'
      - id: e3
        kind: end
        tone: not-met
        exception: true
        text: 'Not recognised as a state: illegality blocks statehood through non-recognition (TRNC — Security Council resolutions 541 and 550).'
        authorities:
          - unsc-resolutions-541-and-550
      - id: e4
        kind: end
        tone: met
        text: 'A state. Recognition only acknowledges it: symbolic, though it signals that the criteria and legitimacy are met.'
      - id: e5
        kind: end
        tone: met
        text: 'A state on the constitutive theory too: recognition has constituted it.'
      - id: e6
        kind: end
        tone: qualified
        text: Not a state on the constitutive theory ("no recognition, no existence") — though on the prevailing declaratory view it is.
  - slug: has-title-to-territory-been-acquired
    title: Has a state acquired title to this territory?
    summary: Sorts a territorial claim into the five modes of acquisition — accretion, terra nullius, cession, prescription and the prohibited conquest — and tests each.
    start: t1
    concepts:
      - laws2000-w04-modes-of-territorial-acquisition
    sources:
      - Week 04 - Lecture Slides - Subjects of International Law and Statehood (slides 34–42)
      - Week 04 - Lecture Recording (Online) - Subjects of International Law and Statehood - Full Transcript (00:00–15:00)
    nodes:
      - id: t1
        kind: ask
        text: Is the land newly formed?
        branches:
          - label: Yes — new land
            to: t2
          - label: No — it already existed
            to: t3
      - id: t2
        kind: ask
        text: Was it naturally formed, and is it above water at high tide?
        note: UNCLOS art 121(1). Artificial islands are not islands and have no territorial sea (art 60(8)); building on a feature does not change its status (South China Sea arbitration).
        cases:
          - south-china-sea-arbitration-philippines-v-china
        authorities:
          - unclos-art-121-1
          - unclos-art-60
        branches:
          - label: 'Yes'
            to: e-accretion
          - label: No — artificial, or submerged at high tide
            to: e-no-island
      - id: t3
        kind: ask
        text: Was the land ever under any state's sovereignty?
        branches:
          - label: No — terra nullius
            to: t4
          - label: Yes — another state's territory
            to: t5
      - id: t4
        kind: ask
        text: Did the claimant exercise effective control with an intention to obtain title?
        note: Barely applicable today, since almost all land has been claimed, but central to colonial expansion.
        branches:
          - label: 'Yes'
            to: e-terra
          - label: 'No'
            to: e-none
      - id: t5
        kind: ask
        text: How did the claimant come to control it?
        branches:
          - label: By agreement with the sovereign
            to: e-cession
          - label: By force
            to: e-conquest
          - label: By peaceful control over time
            to: t6
      - id: t6
        kind: ask
        text: Did the claimant control it peacefully, acting as sovereign?
        note: No force or aggression; it must take over the territory and act as if it were its own.
        branches:
          - label: 'Yes'
            to: t7
          - label: 'No'
            to: e-none
      - id: t7
        kind: ask
        text: Did the original sovereign protest and object?
        note: Prescription rests on implied consent. How much control, and what form protest must take, remain unresolved.
        branches:
          - label: Sustained protests
            to: e-none
          - label: No protest
            to: e-prescription
      - id: e-accretion
        kind: end
        tone: met
        text: Title by accretion where the new land forms within the state's territory or territorial sea (Japan's 1986 volcanic island).
      - id: e-no-island
        kind: end
        tone: not-met
        text: 'No title: an artificial island or low-tide elevation cannot ground a sovereignty claim.'
        authorities:
          - unclos-art-121-1
          - unclos-art-60
      - id: e-terra
        kind: end
        tone: met
        text: Title by occupation of terra nullius.
      - id: e-cession
        kind: end
        tone: qualified
        text: Title by cession — but no more rights than the ceding state had, subject to third states' and indigenous rights (Alaska 1867).
      - id: e-conquest
        kind: end
        tone: not-met
        exception: true
        text: 'No title: conquest is prohibited since 1945 (art 2(4)). Belligerent occupation applies — temporary, no transfer of sovereignty.'
        authorities:
          - un-charter-art-2-4
      - id: e-prescription
        kind: end
        tone: qualified
        text: Title by prescription, on the old sovereign's implied consent — a controversial mode with unresolved questions.
      - id: e-none
        kind: end
        tone: not-met
        text: No title passes on these facts.
