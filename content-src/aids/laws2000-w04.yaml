  - concept: laws2000-w04-emerging-actors-beyond-the-state
    plain: International law once dealt only with states. Since the Second World War, individuals, groups and corporations have gained some rights, and some obligations, but none has a state's full personality.
    concrete: Eight Torres Strait Islanders complained to the UN Human Rights Committee under the ICCPR's Optional Protocol, after exhausting their options at home. They argued that Australia's failure to implement and mitigate climate commitments violated their rights to enjoy their culture and to be free from arbitrary interference with family and private life. In 2022 the Committee found Australia had violated those rights, and Australia accepted at least part of its recommendations — something individuals could not have done 60 years earlier.
    formal: 'Individuals were not originally subjects. After WWII they gained rights exercisable against states: the non-binding Universal Declaration of Human Rights 1948, then binding treaty law (ECHR 1950; ICCPR 1966). Individuals bear obligations under international criminal law (Milošević, indicted by the ICTY, 1999). Non-state armed actors are bound by IHL, including common art 3 of the Geneva Conventions. Corporations: investment rights, but "to date, no legally binding obligations".'
    terms:
      - term: Optional Protocol to the ICCPR
        gloss: A treaty letting individuals complain to the Human Rights Committee once domestic options are exhausted — but only against a state that has accepted it.
      - term: people (and minority)
        gloss: 'No clear definition of a people: look for shared language, territory or culture. Peoples hold group rights; minority rights are usually claimed individually.'
        example: A French speaker outside Quebec claiming service in French is asserting a minority right.
      - term: non-state armed actor
        gloss: An armed group in a conflict, such as a non-international armed conflict; not a state, but bound by IHL obligations on prisoners and civilians.
      - term: Guiding Principles on Business and Human Rights (2011)
        gloss: Non-binding UN principles on corporate human rights responsibility. Multinationals still have no legally binding obligations under international law.
    misconceptions:
      - claim: The Universal Declaration of Human Rights 1948 is a binding treaty.
        tempting: It is the milestone of international human rights and is cited everywhere.
        correction: The lecture calls it a non-binding instrument. It gave way to binding treaties — the ICCPR, the ICESCR and the ECHR — which bind states that ratify them.
      - claim: Multinational corporations have binding human rights obligations under the 2011 Guiding Principles.
        tempting: The Guiding Principles address business and human rights directly.
        correction: They are not binding. The slide says that "to date" there are no legally binding obligations of multinationals under international law; that gap drives the push in this field.
      - claim: A non-state armed group has no international obligations, because only states are bound by international law.
        tempting: States are the primary subjects, and armed groups ratify nothing.
        correction: Non-state actors in armed conflict are bound by certain IHL obligations (for example on prisoners and civilians); common art 3 of the Geneva Conventions applies to them, though their duties may differ from a state's.
    socratic:
      - ask: Before WWII, if a state mistreated a foreign national, whose rights did international law engage?
        hint: Individuals were the responsibility of…
        answer: Their state of nationality's. Individuals had no international rights or obligations of their own; international law cared only if the injury was treated as an injury to their state.
      - ask: What changed after 1945?
        hint: The three instruments on slide 11.
        answer: 'Individuals gained rights exercisable against states: the non-binding UDHR 1948, then binding treaties such as the ECHR 1950 and the ICCPR 1966.'
      - ask: Can an individual now take those rights to an international body?
        hint: The Torres Strait Islanders.
        answer: 'Yes, where their state has accepted a mechanism: eight Torres Strait Islanders complained to the Human Rights Committee under the ICCPR Optional Protocol, and the Committee found Australia had violated their rights.'
      - ask: Do individuals also carry international obligations?
        hint: May 1999.
        answer: Yes — under international criminal law. The ICTY indicted Slobodan Milošević for crimes against humanity, the first head of state indicted before an international tribunal.
      - ask: For any non-state actor in a problem, which two distinctions should you draw?
        hint: What it has; where it comes from.
        answer: Separate rights from obligations, and binding from non-binding sources. Corporations, for example, hold investment rights but face only non-binding human rights guidance.
    what-if:
      - change: The Torres Strait Islanders' state had never accepted the ICCPR Optional Protocol.
        effect: 'The ICCPR would still bind the state, but the individuals could not complain to the Human Rights Committee: the state must agree to the complaint mechanism.'
      - change: The actor is a non-state armed group that captures government soldiers, not a corporation.
        effect: It bears binding obligations under IHL — on prisoners and civilians, including common art 3 — even though it is not a state. A corporation, by contrast, has no binding international obligations to date.
    boundary:
      - text: A French speaker in Ontario refused service in French by a federal official.
        why: 'A group-linked right, but claimed by the individual before a domestic tribunal: a minority right, not a people''s right such as self-determination.'
      - text: The 2007 UN Declaration on the Rights of Indigenous Peoples.
        why: Recognises rights of peoples and has influence, but it is a declaration and not binding; ILO conventions on indigenous peoples bind only states that ratify them.
    transfer:
      - scenario: A mining multinational's security contractors abuse villagers near a mine abroad. An NGO asks whether international law reaches the company itself and the individual contractors.
        answer: Separate rights from obligations, and binding from non-binding. The company has investment rights but, to date, no binding international obligations; the 2011 Guiding Principles are not binding. Individuals, however, can bear obligations under international criminal law if their acts amount to international crimes — as Milošević's ICTY indictment shows.
    objections:
      - position: Individuals are now genuine subjects of international law.
        evidence: They hold rights against states (ICCPR), can complain to international bodies (the Torres Strait Islanders' win before the Human Rights Committee) and bear obligations under international criminal law (Milošević).
        objection: 'Their access depends on state consent: a state must accept the complaint mechanism, and the Committee''s remedies took effect because Australia accepted its recommendations. Individuals still lack full personality.'
    storyboard:
      - caption: States only
        detail: Classical international law governs relations between sovereign states; individuals are the responsibility of their state of nationality.
      - caption: '1948: rights declared'
        detail: The Universal Declaration of Human Rights, a non-binding milestone.
      - caption: Binding treaties follow
        detail: The ECHR 1950 and the ICCPR 1966 turn declared rights into binding treaty law.
      - caption: Individuals complain internationally
        detail: Optional protocols let individuals take states to bodies such as the Human Rights Committee — the Torres Strait Islanders, 2022.
      - caption: Individuals answer for crimes
        detail: 'From Nuremberg to the ICTY: Milošević indicted in 1999 for crimes against humanity.'
      - caption: 'Corporations: the new frontier'
        detail: Investment rights, but only the non-binding 2011 Guiding Principles on human rights obligations.
