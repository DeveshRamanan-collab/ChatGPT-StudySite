  - concept: laws2000-w04-modes-of-territorial-acquisition
    plain: 'A state can gain sovereign title to land in five ways: transfer from another state, new land formed by nature, occupying land no state ever held, uncontested long possession — and, no longer, conquest.'
    concrete: In 1986 an undersea volcano erupted in Japan's territorial sea and a new island formed. New land created gradually by nature within Japan's own waters became Japan's territory — accretion. Contrast the South China Sea, where states have built structures on reefs and low-tide elevations to strengthen their claims. The lecturer explains that in the 2016 arbitration the tribunal held that construction does not change a feature's legal status, which depends on its natural condition.
    formal: 'Five modes: cession (the acquirer gets no more rights than the ceding state had); accretion (an island is "a naturally formed area of land, surrounded by water, which is above water at high tide": UNCLOS art 121(1); artificial islands are not islands: art 60(8)); occupation of terra nullius (effective control plus intention); prescription (peaceful control, implied consent; sustained protest prevents it); conquest — prohibited since 1945 (UN Charter art 2(4)).'
    analogy:
      text: 'Ways to get a house: buy it; the river leaves new land on your block; build on land no one ever owned; live openly in a house whose owner never objects. Breaking in and changing the locks gives you no title at all.'
      maps:
        - from: buying the house
          to: cession
        - from: building on land no one ever owned
          to: occupation of terra nullius
        - from: living there while the owner never objects
          to: prescription (implied consent)
        - from: breaking in
          to: conquest — now only belligerent occupation, no title
      limits:
        - Adverse possession at home usually has a fixed period; prescription has none, and how much control or what form of protest is needed remains unresolved.
    terms:
      - term: title
        gloss: The source of a state's right to territory (and sometimes the proof of it). The five modes are sources of title.
      - term: terra nullius
        gloss: Land never under any state's sovereignty, acquired by effective control plus an intention to claim title. Barely applicable now, but central to colonial expansion.
      - term: low-tide elevation
        gloss: A naturally formed area of land submerged at high tide. Not an island under UNCLOS art 121(1), so it cannot ground a sovereignty claim.
      - term: belligerent occupation
        gloss: 'The regime triggered when one state''s military occupies another''s territory: temporary, with no transfer of sovereignty however effective the control.'
    misconceptions:
      - claim: A state that conquers territory acquires title once its control is effective and stable.
        tempting: Effective control is what matters for terra nullius, and conquest once gave title.
        correction: Since the UN Charter (art 2(4)) territory cannot be acquired by force. Occupation triggers the belligerent occupation regime — temporary, with no transfer of sovereignty (Kuwait 1990; Crimea 2014).
      - claim: Long, peaceful administration of another state's land gives title by prescription, whatever the owner says.
        tempting: Peaceful control acting as sovereign is a requirement of prescription.
        correction: 'Prescription rests on implied consent, so sustained protests and objections by the ''old'' state prevent it. Land never under any sovereignty is a different mode: terra nullius.'
      - claim: Building an artificial island, or building up a reef, creates new territory with its own territorial sea.
        tempting: New land is added, and accretion recognises new land.
        correction: Accretion must be natural. Artificial islands "do not possess the status of islands" and have no territorial sea (UNCLOS art 60(8)); low-tide elevations are not islands (art 121(1); South China Sea arbitration).
    socratic:
      - ask: Faced with any territorial claim, what do you ask first?
        hint: Sort the five modes into two groups.
        answer: 'Was the land previously under some state''s sovereignty? If not: terra nullius or accretion. If so: cession, prescription or conquest — then check consent and force.'
      - ask: Land passed under a treaty of sale. What does the buyer get?
        hint: Alaska, 1867.
        answer: Title by cession — but no more rights than the seller had, and subject to the potential rights of third states and the indigenous population.
      - ask: A state has peacefully administered another state's island for decades, acting as sovereign. What else must you check?
        hint: Prescription rests on implied consent.
        answer: Whether the original sovereign protested. Sustained protests and objections prevent prescription; only silence implies consent.
      - ask: A state builds an airstrip on a reef that is submerged at high tide, then claims it. Is it an island?
        hint: UNCLOS art 121(1) has two limbs.
        answer: No. An island must be naturally formed and above water at high tide. A low-tide elevation, or an artificial island (art 60(8)), cannot ground sovereignty.
      - ask: An army seizes and annexes a neighbour's province. Title?
        hint: UN Charter art 2(4).
        answer: No. Since 1945 territory cannot be acquired by force. The occupation triggers the belligerent occupation regime — temporary, with no transfer of sovereignty.
    elements:
      - name: Cession
        test: Transfer by agreement, often a purchase treaty (Alaska 1867). The acquirer gets no more rights than the ceding state had and must respect third states' and indigenous rights.
      - name: Accretion
        test: New land formed gradually by nature (Japan's 1986 volcanic island). An island must be naturally formed and above water at high tide; artificial islands and low-tide elevations do not count.
        cases:
          - south-china-sea-arbitration-philippines-v-china
        authorities:
          - unclos-art-121-1
          - unclos-art-60
      - name: Occupation of terra nullius
        test: Land never under any state's sovereignty, plus effective control and an intention to obtain title.
      - name: Prescription
        test: Land under another state's sovereignty; peaceful control, acting as sovereign, with implied consent. Sustained protests and objections by the old state prevent it.
      - name: Conquest (prohibited)
        test: 'Since 1945 territory cannot be acquired by force. Military occupation triggers the belligerent occupation regime: temporary, no transfer of sovereignty.'
        authorities:
          - un-charter-art-2-4
    what-if:
      - change: In the prescription scenario, the original sovereign has protested every year.
        effect: Prescription fails. It rests on implied consent, and sustained protests and objections by the old state prevent it, however long and peaceful the control.
      - change: The acquiring state first seized the island by force, then administered it peacefully for decades.
        effect: No title. Prescription requires peaceful control, with no force or aggression, and acquisition by force has been prohibited since 1945; the seizure triggers the belligerent occupation regime instead.
      - change: The reef was naturally above water at high tide before any building began.
        effect: It is then a naturally formed area of land above water at high tide — an island under art 121(1) — so it can be subject to sovereignty. Later building does not change its natural status.
    boundary:
      - text: The United States' interest in buying Greenland from Denmark.
        why: 'A purchase by treaty would be lawful cession — Denmark has rejected it. Taking Greenland by force would not be: conquest confers no title since 1945.'
      - text: A disused offshore military platform.
        why: 'Outside accretion: it is above water but not "naturally formed", so it is not an island under art 121(1) and supports no sovereignty or territorial sea (art 60(8)).'
    transfer:
      - scenario: A border river slowly deposits silt, building a new strip of land along State A's bank. State B sends surveyors and plants a flag on the strip, calling it new land that belongs to no one.
        answer: The strip formed gradually by natural processes adjoining A's territory — accretion, as when a river deposits sediment and adds to a state's territory. It accrued to A as it formed, so it was never terra nullius open to B's occupation. B's flag gives no title, and taking it by force would breach art 2(4).
    sources:
      - Week 04 - Lecture Slides - Subjects of International Law and Statehood (slides 34–42)
      - 'Week 04 - Lecture Recording (Online) - Subjects of International Law and Statehood - Full Transcript (00:00–15:00: title, cession, Greenland, accretion, artificial islands, South China Sea, terra nullius, prescription, belligerent occupation)'
