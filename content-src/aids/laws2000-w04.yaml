  - concept: laws2000-w04-recognition-of-states
    plain: Recognition is one state officially acknowledging that another state or government exists. The prevailing view is that it confirms statehood rather than creates it — but refusing it can block entities created illegally.
    concrete: In 1974 Turkey invaded Cyprus and occupied the north of the island. In 1983 the Turkish Cypriot authorities declared a "Turkish Republic of Northern Cyprus". The lecturer says the TRNC meets the Montevideo criteria — but it reached them through an unlawful invasion. Security Council resolutions 541 (1983) and 550 (1984) called the declaration legally invalid, and only Turkey recognises the TRNC. Non-recognition is doing the legal work.
    formal: 'Declaratory theory (most widely held): recognition acknowledges "a pre-existing legal capacity (statehood)"; statehood does not depend on it. Constitutive theory: recognition is a "necessary precondition" — "no recognition, no existence". Non-recognition may prevent statehood if the criteria were achieved illegally (Friendly Relations Declaration 1970; Kosovo Advisory Opinion 2010: "the unlawful use of force or other egregious violations of norms of general international law").'
    analogy:
      text: 'A birth certificate records a birth that has already happened: the child exists whether or not the certificate is issued. A citizenship grant is different — you are not a citizen until it is granted.'
      maps:
        - from: the birth
          to: meeting the Montevideo criteria
        - from: the birth certificate
          to: recognition on the declaratory theory
        - from: the citizenship grant
          to: recognition on the constitutive theory
      limits:
        - One registry issues a birth certificate; recognition is given state by state, often for political reasons, and can be withheld from an entity created illegally.
    terms:
      - term: declaratory theory
        gloss: Recognition only acknowledges statehood that already exists once the criteria are met; it is symbolic. The most widely held view today.
      - term: constitutive theory
        gloss: 'Recognition by other states creates the state and confers legal personality: no recognition, no existence. Still has some weight.'
      - term: collective recognition
        gloss: Recognition by states acting together in an international organisation. UN admission needs a Security Council recommendation (vetoable) and a two-thirds General Assembly vote.
      - term: non-recognition
        gloss: Refusing to recognise an entity whose criteria were achieved by unlawful force or egregious violations, especially of jus cogens.
        example: The TRNC, recognised only by Turkey.
    misconceptions:
      - claim: If two states have no diplomatic relations, they do not recognise each other.
        tempting: Recognition usually comes with embassies and official relations.
        correction: The slide says a lack of diplomatic relations between two states does not necessarily mean absence of recognition.
      - claim: Recognition is purely political, so a state can withdraw it whenever it likes.
        tempting: Recognition is "often an extension of politics", and states recognise for political reasons.
        correction: The lecture says recognising a state creates obligations — respect its sovereignty, do not interfere in its affairs — and that recognition, once given, cannot be retracted.
      - claim: In the Kosovo Advisory Opinion the ICJ held that Kosovo is a state and that its secession was lawful.
        tempting: Kosovo is recognised by more than 100 states and the opinion is the leading authority.
        correction: The Court said the declaration of independence was not in itself illegal, but refrained from deciding whether Kosovo was a state or whether unilateral secession was lawful.
    socratic:
      - ask: An entity meets all four Montevideo criteria, but only three states recognise it. Is it a state on the prevailing view?
        hint: Which theory is most widely held?
        answer: 'Yes, on the declaratory theory: recognition only acknowledges existing statehood. On the constitutive theory it would not be — no recognition, no existence.'
      - ask: Why can't you simply count recognitions?
        hint: Law and politics.
        answer: 'Recognition is highly political: states recognise entities that fail the criteria and refuse some that meet them. Kosovo (100+ recognitions) and Palestine (150+) both remain contested.'
      - ask: The TRNC meets the criteria. Why is it not treated as a state?
        hint: How were the criteria achieved?
        answer: Through Turkey's unlawful 1974 invasion. Non-recognition may prevent statehood where the means were illegal; Security Council resolutions 541 and 550 called the declaration legally invalid.
      - ask: Would UN membership settle Palestine's status?
        hint: Who must agree to admit a member?
        answer: It would be strong evidence — two-thirds of the General Assembly — but admission also needs a Security Council recommendation, which a permanent member can veto. Palestine has only non-member observer status.
      - ask: What exactly did the ICJ decide about Kosovo?
        hint: It answered a narrow question.
        answer: That the declaration of independence was not in itself illegal. It refrained from deciding whether Kosovo is a state, or whether unilateral secession was lawful.
    elements:
      - name: Montevideo criteria
        test: Apply art 1 first. On the declaratory view, an entity that meets the four criteria is a state whatever others do.
        authorities:
          - montevideo-convention-1933-art-1
      - name: Achieved lawfully
        test: Non-recognition may prevent statehood where the criteria were achieved by unlawful force or egregious violations of general international law, especially jus cogens.
        cases:
          - declaration-of-independence-in-respect-of-kosovo
        authorities:
          - friendly-relations-declaration-1970
          - unsc-resolutions-541-and-550
      - name: Recognition by other states
        test: 'Individual or collective (UN admission: Security Council recommendation, then two-thirds of the General Assembly). Symbolic on the declaratory theory; essential on the constitutive theory.'
        authorities:
          - un-charter-art-4
    what-if:
      - change: The northern Cypriot entity had separated by a negotiated agreement with Cyprus, with no invasion.
        effect: The illegality ground for non-recognition (Friendly Relations Declaration; Kosovo Advisory Opinion) would not apply. On the declaratory view it would be a state once it met the criteria, recognised or not.
      - change: A permanent member vetoes an entity's UN admission, although 180 states recognise it.
        effect: It is not a UN member, but that does not decide statehood. Collective recognition through the UN can be blocked by a single veto despite wide individual recognition.
      - change: Two states that recognise each other break off diplomatic relations.
        effect: 'Recognition is unaffected: lack of diplomatic relations does not necessarily mean absence of recognition, and recognition once given cannot be retracted.'
    boundary:
      - text: 'Palestine: recognised by over 150 UN member states, a UN non-member observer, party to several treaties.'
        why: 'At the edge: wide recognition and treaty accession point towards statehood, but its nominal control amid Israeli occupation keeps its statehood contested.'
      - text: 'Kosovo: independence declared 2008, 100+ recognitions, member of the IMF and World Bank.'
        why: 'Contested: wide recognition, yet the EU is split and the ICJ refrained from deciding whether Kosovo is a state.'
    transfer:
      - scenario: After a neighbour's tanks roll in, a breakaway region declares independence and soon runs its own police, courts and tax office. Only the invading state recognises it. Should Australia recognise it?
        answer: 'Apply Montevideo first: it may meet the criteria. But they were achieved through an unlawful use of force, and the Friendly Relations Declaration and the Kosovo Advisory Opinion indicate such an entity should not be recognised. The TRNC is the model: it meets the criteria, only Turkey recognises it, and the Security Council called its declaration legally invalid.'
    objections:
      - position: 'Declaratory theory: statehood depends only on meeting the criteria; recognition is symbolic.'
        evidence: It is the most widely held view today, and art 1 of the Montevideo Convention lists four factual criteria, none of them recognition.
        objection: 'Practice does not fit neatly: non-recognition can keep an entity that meets the criteria from statehood (TRNC), and the slides say capacity for relations "arises from independence and recognition by other states".'
      - position: 'Constitutive theory: no recognition, no existence.'
        evidence: The lecture says it still has some weight, and recognition is tied to the capacity to enter into relations with other states.
        objection: 'Recognition is "often an extension of politics": states recognise entities that fail the criteria and refuse some that meet them, so statehood would vary with each state''s politics.'
    sources:
