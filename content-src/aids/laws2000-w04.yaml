      - 'Week 04 - Lecture Recording (Live) - Subjects of International Law and Statehood - Full Transcript (04:00–12:00: legal personality, the five capacities, immunities, Reparation for Injuries)'
      - Week 04 - Tutorial Task - Subjects of International Law and Statehood (Q1(a)–(b))
