  - concept: laws2000-w04-self-determination-and-secession
    plain: Peoples have a right to control their own destiny. For colonised peoples that clearly includes independence; elsewhere it usually means a real say within the existing state, and a right to break away is contested.
    concrete: Quebec held referendums on leaving Canada, and the question whether it could secede unilaterally went to the Supreme Court of Canada. In 1998 the Court held that unilateral secession is consistent with neither international law nor the Canadian Constitution. Distinguishing internal from external self-determination, it found that Quebec's people already enjoyed internal self-determination within Canada — so there was no ground to claim the external kind, secession.
    formal: 'UN Charter art 1(2) refers to the "principle of equal rights and self-determination of peoples" without framing it as a right; ICCPR art 1: "All peoples have the right of self-determination." The 1960 Declaration on the Granting of Independence calls alien subjugation "a denial of fundamental human rights"; Chagos (2019) affirmed the right in decolonisation. Outside it, unilateral secession is "highly contentious" (Kosovo; Re Secession of Quebec).'
    terms:
      - term: internal self-determination
        gloss: A people freely pursuing its political, economic, social and cultural development within an existing state. Quebec's was held to be fulfilled.
      - term: external self-determination
        gloss: A people leaving the existing state — independence or secession. Accepted for colonised peoples; outside decolonisation, highly contentious.
      - term: decolonisation context
        gloss: Peoples under colonial rule, where self-determination is generally accepted (1960 Declaration; Chagos).
      - term: unilateral secession
        gloss: Breaking away from an existing state without its agreement.
        example: Kosovo 2008; contested attempts in Iraqi Kurdistan and Catalonia in 2017.
    misconceptions:
      - claim: The UN Charter makes self-determination a right of peoples.
        tempting: Self-determination is a foundational UN principle, named in art 1(2).
        correction: Art 1(2) refers to the principle of self-determination but did not frame it as a right. It was later enshrined as a human right in ICCPR art 1.
      - claim: If most people in a region vote to leave, international law gives them a right to secede.
        tempting: Self-determination sounds like majority choice, and referendums are its usual form.
        correction: 'Re Secession of Quebec: unilateral secession is not consistent with international law where the people''s internal self-determination is fulfilled. Quebec''s referendums failed; a vote alone confers no right.'
      - claim: The Kosovo Advisory Opinion confirmed a right to secede for oppressed peoples.
        tempting: Kosovo's supporters made exactly that argument, and the Court found the declaration lawful.
        correction: The Court said only that the declaration of independence was not in itself illegal; it refrained from saying unilateral self-determination was lawful.
    socratic:
      - ask: 'A Western Australian movement wants to secede: it no longer wants to be governed from Canberra and wants full ownership of WA''s resources. What do you classify first?'
        hint: Decolonisation or not?
        answer: Western Australia is not a colony, so the claim falls outside the decolonisation context where self-determination is generally accepted. It is a claim to external self-determination — unilateral secession.
      - ask: Outside decolonisation, is there an accepted right to secede?
        hint: The 2008 Kosovo debate.
        answer: 'No settled right: it is highly contentious. Supporters argue for it in extreme cases of systematic discrimination and oppression; opponents say it violates the parent state''s sovereignty and territorial integrity.'
      - ask: Is Western Australians' internal self-determination being denied?
        hint: Can they take part in how they are governed?
        answer: Nothing suggests it. As in Re Secession of Quebec, where a people's internal self-determination is fulfilled, there is no ground for external self-determination.
      - ask: Is a dispute over resources the kind of case on which the argument for secession relies?
        hint: What did Kosovo's supporters point to?
        answer: No. That argument rests on an ethnic population subjected to systematic discrimination and oppression by a non-democratic government — far from a dispute over resources and governance from Canberra.
    elements:
      - name: A people
        test: 'No clear definition: look for a shared language, territory or culture.'
      - name: Decolonisation context?
        test: If the people is under colonial rule, self-determination, including independence, is generally accepted (1960 Declaration; Chagos).
        cases:
          - chagos-islands-case
        authorities:
          - declaration-on-the-granting-of-independence-1960
          - un-charter-art-1-2
      - name: Internal self-determination fulfilled?
        test: Outside decolonisation, ask whether the people can pursue its development within the state. If so, there is no ground for external self-determination (Re Secession of Quebec).
        cases:
          - re-secession-of-quebec
        authorities:
          - iccpr-art-1
      - name: External self-determination (secession)
        test: A unilateral right to secede is highly contentious; argued only for extreme cases of systematic discrimination and oppression. The ICJ in Kosovo did not endorse it.
        cases:
          - declaration-of-independence-in-respect-of-kosovo
    what-if:
      - change: The territory is a colony, and the colonial power split off part of it and removed its people before independence.
        effect: 'Decolonisation context: the right is generally accepted. As in Chagos, detaching part of a colony before independence violated self-determination, and the colonial power must complete decolonisation.'
      - change: The region's ethnic population has suffered systematic discrimination and oppression by a non-democratic central government.
        effect: Supporters of a right to secede, as in the Kosovo debate, would say it arises in such extreme cases. It remains highly contentious, and the ICJ in Kosovo refrained from endorsing it.
    boundary:
      - text: Kosovo's 2008 declaration of independence from Serbia.
        why: 'At the edge: argued as secession after systematic oppression and backed by many Western states; the ICJ found the declaration not itself illegal but refrained from calling unilateral secession lawful.'
      - text: The Chagos Islands (2019).
        why: 'Squarely inside: decolonisation, where the right is generally accepted; the UK''s detachment of the islands and removal of their population before Mauritius''s independence violated it.'
    transfer:
      - scenario: An island province of a federal state elects members to the national parliament and runs its own schools and police. After a tax dispute it holds an unofficial vote and announces it is leaving the federation.
        answer: This is not a colonial case, so there is no generally accepted right to independence. The islanders enjoy internal self-determination — representation and regional self-government — so, as in Re Secession of Quebec, there is no ground for external self-determination. A tax dispute is far from the systematic oppression argued in the Kosovo debate.
    objections:
      - position: Self-determination includes a right to secede in extreme cases.
        evidence: Kosovo's supporters argued that an ethnic population subjected to systematic discrimination and oppression may legitimately declare independence as an exercise of self-determination.
        objection: 'Opponents (Serbia, Russia, China) said no such right exists: secession violates the parent state''s sovereignty and territorial integrity and sets a dangerous precedent for other secessionist movements.'
    sources:
      - Week 04 - Lecture Slides - Subjects of International Law and Statehood (slides 31, 43–46)
      - 'Week 04 - Lecture Recording (Online) - Subjects of International Law and Statehood - Full Transcript (15:00–21:00: decolonisation, Chagos, internal and external self-determination, Kosovo, Quebec)'
      - 'Week 04 - Lecture Recording (Live) - Subjects of International Law and Statehood - Full Transcript (49:00–51:00: self-determination and Quebec)'
      - 'Week 04 - Tutorial Task - Subjects of International Law and Statehood (Q4: Western Australia scenario)'
