  - concept: laws2000-w02-general-principles-of-law
    plain: When no treaty or custom answers a question, courts can use principles common to the world's legal systems, such as good faith or fairness.
    concrete: When the ICJ delimits maritime boundaries between coastal states with opposite or adjacent coasts, it often refers to equity and equitable principles — what is fair and reasonable in the administration of justice. The lecturer gives boundary delimitation, at sea and on land, as the area where equity as a general principle has been most useful.
    formal: 'Article 38(1)(c) ICJ Statute: "the general principles of law recognized by civilized nations". Courts rely on them when a dispute cannot be effectively resolved on the basis of a treaty or customary international law. Examples: equity, good faith, res judicata and the impartiality of judges. A principle must be recognised across legal systems and capable of being usefully applied internationally.'
    analogy:
      text: A referee applying fair-play principles that every football code shares when the rulebook says nothing about the situation.
      maps:
        - from: the rulebook
          to: treaty and customary rules
        - from: fair-play principles every code shares
          to: principles recognised across legal systems
        - from: the rulebook falling silent
          to: a gap where treaty and custom cannot resolve the dispute
      limits:
        - A referee can improvise; a court may use only principles genuinely shared across legal traditions and workable at the international level.
    terms:
      - term: equity
        gloss: What is fair and reasonable in the administration of justice; used by the ICJ when delimiting maritime boundaries between opposite or adjacent coasts.
      - term: res judicata
        gloss: A matter already judged — a general principle listed on the slides.
      - term: good faith
        gloss: A general principle listed on the slides; the lecture also says it grounds the binding force of unilateral statements.
      - term: gap-filler
        gloss: 'The role of general principles: applied where a treaty or customary rule cannot effectively resolve the dispute.'
    misconceptions:
      - claim: General principles are secondary sources, like judicial decisions.
        tempting: They are used less often and only to fill gaps.
        correction: They are primary, law-creating sources under Article 38(1)(c). Their gap-filling role concerns when they are used, not their status.
      - claim: A rule found in one country's law is a general principle of international law.
        tempting: Article 38(1)(c) refers to principles recognised by nations.
        correction: It needs a decent geographical spread across legal traditions — civil law, common law, Arabic law systems — and must be usefully transposable to international law.
      - claim: Courts start with general principles because they are the most basic rules.
        tempting: '''General'' sounds foundational, so it seems to come first.'
        correction: 'They are a fallback: courts reach for them when a treaty or customary rule cannot effectively resolve the dispute.'
    socratic:
      - ask: A tribunal finds no applicable treaty and no proven custom. Must it give up?
        hint: What does Article 38(1)(c) offer?
        answer: No. It can turn to the general principles of law recognised by civilised nations.
      - ask: What examples does slide 15 give?
        hint: Four principles.
        answer: Equity, good faith, res judicata and the impartiality of judges.
      - ask: How do we know a principle qualifies?
        hint: Breadth, then transposability.
        answer: It is recognised by states with decent geographical spread across legal traditions, and it can be usefully implemented at the international level.
      - ask: Where has equity done real work?
        hint: Think coastlines.
        answer: In ICJ delimitation of maritime boundaries between coastal states with opposite or adjacent coasts, and of land boundaries.
    elements:
      - name: No treaty or custom resolves the dispute
        test: The dispute cannot be effectively resolved on the basis of an applicable treaty or customary international law.
        authorities:
          - icj-statute-art-38-1
      - name: Recognised across legal systems
        test: States with decent geographical spread recognise the principle, across legal traditions — civil law, common law, Arabic law systems — not one family alone.
      - name: Transposable to international law
        test: The principle can be usefully implemented and followed at the international level; not everything recognised domestically transposes.
    what-if:
      - change: An applicable treaty between the parties covers the point.
        effect: Apply the treaty. General principles are gap-fillers and are not reached while a treaty or custom effectively resolves the dispute.
      - change: The principle is recognised only in common law countries.
        effect: 'It probably fails: recognition must span legal traditions with decent geographical representation, not a single legal family.'
    boundary:
      - text: Good faith as the basis of binding unilateral statements (Nuclear Tests).
        why: 'A general principle doing work beyond gap-filling: the lecture says the binding character of unilateral statements rests on good faith.'
    transfer:
      - scenario: Two states arbitrate a dispute. After losing, one starts a fresh arbitration on exactly the same claim. No treaty between them, and no customary rule, addresses re-litigation.
        answer: With treaty and custom silent, the tribunal may apply a general principle under Article 38(1)(c). Res judicata — a matter already judged — is listed among the recognised general principles, so the same claim should not be litigated again.
    sources:
      - Week 02 - Lecture Slides - Sources of International Law (slide 15)
      - 'Week 02 - Lecture Recording (Live) - Sources of International Law - Full Transcript (47:20–49:30: general principles as gap-fillers, criteria, equity)'
