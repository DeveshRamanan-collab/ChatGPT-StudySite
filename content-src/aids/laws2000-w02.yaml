  - concept: laws2000-w02-persistent-objector-and-particular-custom
    plain: 'Custom usually binds every state, with two exceptions: a custom may bind only a region or even two states, and a state that objected from the start is not bound.'
    concrete: Portugal held a small enclave inside India, reachable only by a route through Indian territory. For centuries Portugal had used that route. When India denied any right of passage, the ICJ looked at the long practice and found a customary right of passage binding as between Portugal and India — even though no treaty between them created one.
    formal: 'Particular custom: a customary rule may bind only a group of states, regional or even bilateral (Right of Passage over Indian Territory [1960] ICJ Rep 6; ILC Conclusion 16). Persistent objector: a state that consistently objects to a rule from the beginning of its formation is not bound by it (Fisheries [1951] ICJ Rep 116; ILC Conclusion 15). This reconciles custom with consent.'
    analogy:
      text: 'House rules in an apartment block: everyone follows them, but a tenant who objected before a rule took effect, and kept objecting, is exempt; two neighbours may also have their own long-standing arrangement over a shared gate.'
      maps:
        - from: the house rules
          to: general customary international law
        - from: the tenant who objected from the start
          to: the persistent objector (Norway in Fisheries)
        - from: the neighbours' gate arrangement
          to: bilateral custom (Portugal and India)
      limits:
        - House rules are made by a committee; custom grows from practice and belief.
        - A tenant can often object later; a persistent objector must object from the very beginning.
    terms:
      - term: persistent objector
        gloss: A state that has consistently objected to a customary rule from the beginning of its formation, and so is not bound by it.
      - term: particular custom
        gloss: 'A customary rule binding only a limited group of states: a region, or even just two states.'
      - term: crystallise
        gloss: When practice plus opinio juris becomes an established customary rule; a persistent objection must come before this point.
    misconceptions:
      - claim: A state can opt out of a customary rule whenever it becomes inconvenient.
        tempting: International law rests on consent, so withdrawing consent seems enough.
        correction: The objection must start at the beginning of the rule's formation and be maintained consistently; objecting midway does not work. That is why the rule is rarely invoked successfully.
      - claim: Customary law needs many states; it cannot exist between just two.
        tempting: Custom is defined as general practice among states.
        correction: 'Right of Passage: centuries of practice created a customary right binding only Portugal and India, with no treaty between them.'
      - claim: In Fisheries the Court held Norway was a persistent objector to an established 10-mile rule.
        tempting: The case is the leading persistent objector authority.
        correction: The Court found the 10-mile rule was not custom at all; it added that even if it were, Norway, having always opposed it, would not be bound.
    socratic:
      - ask: Once a customary rule exists, whom does it bind?
        hint: General rule first, then the exceptions.
        answer: Generally every state — subject to two exceptions.
      - ask: Portugal used one route to its enclave for centuries. What did that practice create?
        hint: Can custom exist between just two states?
        answer: A particular, bilateral customary right of passage between Portugal and India, without any treaty.
      - ask: Norway always used straight baselines and rejected the UK's 10-mile rule. Would it be bound if the rule were custom?
        hint: When, and how consistently, did Norway object?
        answer: 'No: it objected from the start and consistently, so as a persistent objector it would not be bound.'
      - ask: Why does international law allow this exception at all?
        hint: Recall Week 1's foundation.
        answer: Because international law rests on consent; the persistent objector rule reconciles customary law with consent.
      - ask: Why is the rule rarely invoked successfully?
        hint: Timing and resources.
        answer: The objection must run from the beginning and be sustained, which is resource-intensive; states do it only when it really matters to them.
    elements:
      - name: Scope of the custom
        test: Is the practice and opinio juris universal, or confined to a region or two states? A particular custom binds only those states (Right of Passage).
        cases:
          - right-of-passage-over-indian-territory-portugal-v-india
      - name: Objection before the rule crystallised
        test: The state objected from the very beginning of the rule's formation; an objection raised midway, once the rule proves inconvenient, fails.
        cases:
          - fisheries-case-united-kingdom-v-norway
      - name: Consistent objection
        test: The objection was maintained throughout — as Norway always used its baseline method and never applied the 10-mile rule.
        cases:
          - fisheries-case-united-kingdom-v-norway
      - name: Objection made known
        test: Other states were informed of the objection (lecturer's flowchart).
    what-if:
      - change: Norway had applied the 10-mile rule for years and objected only once it proved inconvenient.
        effect: 'No persistent objection: the objection must start at the beginning of the rule''s formation. A late objection cannot exempt a state from an established rule.'
      - change: A new state emerges after the customary rule has already crystallised.
        effect: It could not have objected from the beginning of the rule's formation, so on the lecture's test it cannot claim persistent objector status.
      - change: India had contested Portugal's passage throughout, rather than allowing it for centuries.
        effect: The bilateral custom in Right of Passage rested on long practice between the two states; without accepted practice between them, no particular customary right would crystallise.
    boundary:
      - text: 'Fisheries: the persistent objector point was not needed for the decision.'
        why: The 10-mile rule failed for lack of state practice; Norway's objection was an 'even if' ground. Fisheries supports the doctrine, but as an alternative line of reasoning.
      - text: 'Asylum Case: a claimed regional custom of diplomatic asylum in Latin America.'
        why: Regional custom is possible, but Colombia failed to prove a constant and uniform usage accepted as law; the regional label does not lower the standard of proof.
    transfer:
      - scenario: For 80 years, three neighbouring island states have let each other's fishing boats shelter in their harbours during cyclones, and each describes this as a legal duty. A distant fourth state is asked to do the same and refuses.
        answer: 'This may be a particular (regional) custom: practice and opinio juris among the three can create a rule binding only them, just as Right of Passage shows custom can bind even two states. The distant state, outside that regional practice, is not bound by it. The three must still prove consistent practice accepted as law.'
    sources:
      - Week 02 - Lecture Slides - Sources of International Law (slides 12–13)
      - 'Week 02 - Lecture Recording (Live) - Sources of International Law - Full Transcript (37:44–45:00: two exceptions, Fisheries, persistent objector, Right of Passage, rarity)'
      - Week 02 - Study Aid - Customary International Law Flowchart
