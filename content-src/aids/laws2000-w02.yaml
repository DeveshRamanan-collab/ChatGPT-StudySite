unit: laws2000
week: 2
source: raw/laws2000-pil/week-02
generator: aids-1
aids:
  - concept: laws2000-w02-article-38-and-sources-of-international-law
    plain: 'Article 38(1) of the ICJ Statute is the starting list of where international law comes from: treaties, custom and general principles make law; court decisions and scholars help interpret it.'
    concrete: 'The lecturer''s example: if Australia were attacked, its right of self-defence would rest on two primary sources at once — customary international law and Article 51 of the UN Charter, a treaty. An ICJ judgment such as Nicaragua, which discussed the customary rules on the use of force, would not itself create that right. It would help interpret it, and under Article 59 it binds only the parties to that case.'
    formal: 'Article 38(1) ICJ Statute lists international conventions (treaties), international custom, "the general principles of law recognized by civilized nations", and judicial decisions and "the teachings of the most highly qualified publicists". The first three are primary, law-creating sources; the last two are secondary, law-interpreting. Article 59: a decision binds only the parties and that case.'
    analogy:
      text: 'A kitchen: recipes are what you actually cook from; cookbook notes and judges'' past scorecards help you read a recipe but are not recipes themselves.'
      maps:
        - from: the recipes
          to: 'primary sources: treaties, custom, general principles'
        - from: cookbook notes
          to: the teachings of highly qualified publicists
        - from: judges' past scorecards
          to: judicial decisions (binding only the parties, Art 59)
      limits:
        - 'The recipe shelf is incomplete: unilateral statements, jus cogens, binding IO decisions and soft law sit outside Article 38.'
        - Recipes are not ranked — a treaty and a customary rule can apply side by side.
    terms:
      - term: Article 38(1) ICJ Statute
        gloss: The provision telling the ICJ what to apply when deciding disputes; the first place of reference for sources, though not drafted as a complete list.
      - term: primary source
        gloss: 'A law-creating source: treaties, customary international law and general principles of law (Art 38(1)(a)–(c)).'
      - term: secondary (subsidiary) source
        gloss: 'A law-interpreting source: judicial decisions and scholarly writings (Art 38(1)(d)); evidence of rules, not their creator.'
    misconceptions:
      - claim: 'Article 38(1) ranks the sources: treaty beats custom, and custom beats general principles.'
        tempting: They are listed (a) to (d), which looks like an order of authority.
        correction: The ordering tracks primary (law-creating) versus secondary (law-interpreting). A treaty and a customary rule can bind the same states at once; general principles fill gaps.
      - claim: Article 38(1) lists every source of international law.
        tempting: It is the first place of reference and courts rely on it constantly.
        correction: It was drafted to tell the ICJ what to apply, not to catalogue sources. Unilateral statements, jus cogens, IO decisions and soft law all sit outside it.
      - claim: Because judicial decisions appear in Article 38(1), an ICJ decision creates law like a treaty.
        tempting: In common law systems, case law is a primary source through precedent.
        correction: 'Judicial decisions are secondary sources. Article 59: a decision has no binding force except between the parties and in respect of that particular case.'
    socratic:
      - ask: With no international legislator, where do we first look to identify international law?
        hint: A provision in the ICJ's own Statute.
        answer: Article 38(1) of the ICJ Statute — always the first place of reference.
      - ask: Why might that list be incomplete?
        hint: Who was the article written for?
        answer: It was drafted to tell the ICJ what it could apply in deciding cases, not designed as a catalogue of sources.
      - ask: Which items in Article 38(1) actually create obligations?
        hint: Paragraphs (a) to (c).
        answer: Treaties, customary international law and general principles of law — the primary sources.
      - ask: What do judicial decisions and scholarly writings do instead?
        hint: Create, or interpret?
        answer: They interpret the primary sources and serve as evidence of rules; they do not create law themselves.
      - ask: Does the (a)–(d) order mean a treaty always beats custom?
        hint: Can one rule live in both at once?
        answer: No. The order reflects primary versus secondary; treaty and custom can coexist and bind the same states simultaneously.
    elements:
      - name: Treaty — Art 38(1)(a)
        test: Is there a treaty the state has ratified or otherwise become party to? If so, it is the most direct evidence of the obligation.
        authorities:
          - icj-statute-art-38-1
          - vclt-art-2-1-a
      - name: Custom — Art 38(1)(b)
        test: Is there a general practice accepted as law (practice plus opinio juris)? Check particular custom and persistent objection.
        cases:
          - north-sea-continental-shelf-cases
          - nicaragua-v-united-states-of-america
      - name: General principles — Art 38(1)(c)
        test: 'Only if treaty and custom cannot resolve it: a principle recognised across legal systems and usable internationally, such as equity or good faith.'
        authorities:
          - icj-statute-art-38-1
      - name: Interpretive aids — Art 38(1)(d)
        test: Use judicial decisions (binding only the parties, Art 59) and leading scholars or the ILC to interpret the rule, not as its source.
        authorities:
          - icj-statute-art-59
      - name: Beyond Article 38
        test: Check unilateral statements, jus cogens, binding decisions of international organisations (Art 25 UN Charter), and soft law as evidence.
        cases:
          - legal-status-of-eastern-greenland-denmark-v-norway
          - nuclear-tests-cases-australia-v-france-new-zealand-v-france
        authorities:
          - vclt-art-53
          - un-charter-art-25
    what-if:
      - change: The respondent state is not party to the relevant treaty.
        effect: The treaty does not bind it, but the same rule may exist as custom and bind it anyway; move to Article 38(1)(b) before concluding there is no obligation.
      - change: Neither an applicable treaty nor a customary rule resolves the dispute.
        effect: The court can reach for general principles of law under Article 38(1)(c), such as equity or good faith, as gap-fillers.
      - change: The only authority found is an earlier ICJ judgment between different states.
        effect: Under Article 59 it binds only those parties in that case. Cite it as weighty interpretive support, not as the source of the obligation.
    boundary:
      - text: The ILC's Draft Articles on State Responsibility.
        why: Formally a subsidiary source under Article 38(1)(d) and not binding, yet courts rely on them heavily because no treaty covers the topic; draft articles can later become treaties.
      - text: A UN Security Council decision under Article 25 of the Charter.
        why: 'Binding, yet absent from Article 38(1): it binds through the Charter, a treaty members consented to — proof the list is not exhaustive.'
    transfer:
      - scenario: A tribunal must decide whether a state owes compensation for river pollution. Counsel cite a regional treaty the state never ratified, a widely repeated scholarly view, and an ICJ judgment in a dispute between two other states.
        answer: 'Work through Article 38(1). The unratified treaty does not bind the state, but check whether its rule also exists as custom (practice plus opinio juris). If neither resolves the issue, general principles may fill the gap. The scholarly view and the ICJ judgment are secondary: they help interpret, and Article 59 confines that judgment''s binding force to its own parties.'
    objections:
      - position: Article 38(1) sets out a clear hierarchy of sources.
        evidence: Treaties come first and are the most direct evidence of obligation; courts usually check them first; general principles are reached only as gap-fillers.
        objection: 'The (a)–(d) order tracks law-creating versus law-interpreting, not rank: treaty and custom can bind the same states at once (Nicaragua). If anything sits on top, it is jus cogens (VCLT art 53) — which Article 38 does not even mention.'
    sources:
      - Week 02 - Lecture Slides - Sources of International Law (slides 3, 16–20, 26)
      - 'Week 02 - Lecture Recording (Live) - Sources of International Law - Full Transcript (03:06–11:48: Article 38, primary and secondary sources)'
      - 'Week 02 - Lecture Recording (Online) - Sources of International Law - Full Transcript (00:00–01:17; 34:13–35:21: review)'
      - Week 02 - Tutorial Questions - Sources of International Law (Question 1)
