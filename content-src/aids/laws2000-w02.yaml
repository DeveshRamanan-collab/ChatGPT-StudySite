flows:
  - slug: is-there-binding-custom
    title: Is this state bound by a rule of customary international law?
    summary: 'Follows the lecturer''s flowchart: test practice (uniformity, generality, duration) and opinio juris, then ask whom the custom binds and whether the state persistently objected.'
    start: n1
    concepts:
      - laws2000-w02-customary-international-law-elements
      - laws2000-w02-persistent-objector-and-particular-custom
    sources:
      - Week 02 - Study Aid - Customary International Law Flowchart
      - Week 02 - Lecture Slides - Sources of International Law (slides 6–13)
      - Week 02 - Lecture Recording (Live) - Sources of International Law - Full Transcript (18:00–45:00)
    nodes:
      - id: n1
        kind: ask
        text: Is there state practice that is uniform and consistent?
        note: States facing the same facts act the same way. Perfection is not required (Nicaragua [186]); 'so much uncertainty and contradiction' defeats it (Asylum).
        cases:
          - nicaragua-v-united-states-of-america
          - asylum-case-colombia-v-peru
        branches:
          - label: 'Yes'
            to: n2
          - label: 'No'
            to: n10
      - id: n2
        kind: ask
        text: Is the practice general — extensive, including specially affected states?
        note: Not every state must take part; the practice of states whose interests are specially affected (e.g. coastal states for sea rules) weighs heavily (North Sea [74]).
        cases:
          - north-sea-continental-shelf-cases
        branches:
          - label: 'Yes'
            to: n3
          - label: 'No'
            to: n10
      - id: n3
        kind: ask
        text: Has the practice lasted a significant period?
        note: There is no fixed period. A short time is not of itself a bar (North Sea [74]).
        branches:
          - label: 'Yes'
            to: n4
          - label: No, it is very recent
            to: n3b
      - id: n3b
        kind: step
        exception: true
        text: 'Possible ''instant custom'' (flowchart): accept only if practice within the short period is extensive and virtually uniform.'
        cases:
          - north-sea-continental-shelf-cases
        next: n4
      - id: n4
        kind: ask
        text: Is there opinio juris — do states act from a belief that the law requires it?
        note: 'Not courtesy, convenience or tradition (North Sea [77]). Evidence: public statements, legal opinions, national court decisions, treaty provisions, failure to react (ILC Conclusion 10).'
        cases:
          - north-sea-continental-shelf-cases
        branches:
          - label: 'Yes'
            to: n5
          - label: 'No'
            to: n11
      - id: n5
        kind: step
        text: Customary international law is established.
        next: n6
      - id: n6
        kind: ask
        text: To whom does the custom apply?
        note: 'Universal relevance: the entire international community. Specific regional significance or a specialised area: a regional or special custom (flowchart).'
        concept: laws2000-w02-persistent-objector-and-particular-custom
        branches:
          - label: Universal relevance
            to: n7
          - label: Only a region, or two states
            to: n12
      - id: n7
        kind: ask
        text: Did this state object from the very beginning of the rule's formation?
        note: Objecting midway, once the rule proves inconvenient, does not work.
        branches:
          - label: 'Yes'
            to: n8
          - label: 'No'
            to: n13
      - id: n8
        kind: ask
        text: Has it objected consistently and made its objection known to other states?
        note: Norway always rejected the UK's 10-mile rule and used its own baselines (Fisheries).
        cases:
          - fisheries-case-united-kingdom-v-norway
        branches:
          - label: 'Yes'
            to: n9
          - label: 'No'
            to: n13
      - id: n9
        kind: end
        tone: qualified
        exception: true
        text: 'Not bound: a persistent objector (Fisheries). The rule still binds every other state.'
        cases:
          - fisheries-case-united-kingdom-v-norway
      - id: n10
        kind: end
        tone: not-met
        text: 'No customary rule: the practice is not uniform, consistent or general enough (Asylum).'
        cases:
          - asylum-case-colombia-v-peru
      - id: n11
        kind: end
        tone: not-met
        text: 'No customary rule: practice without opinio juris is mere usage or courtesy (North Sea [77]).'
        cases:
          - north-sea-continental-shelf-cases
      - id: n12
        kind: end
        tone: met
        text: 'Particular custom: it binds only the states of that region or relationship (Right of Passage).'
        cases:
          - right-of-passage-over-indian-territory-portugal-v-india
      - id: n13
        kind: end
        tone: met
        text: The state is bound by the customary rule.
  - slug: which-source-binds
    title: Which source makes this rule binding on the state?
    summary: Works through Article 38(1) in the order an answer takes it, then the sources Article 38 leaves out.
    start: s1
    concepts:
      - laws2000-w02-article-38-and-sources-of-international-law
      - laws2000-w02-treaties-as-a-source
      - laws2000-w02-general-principles-of-law
      - laws2000-w02-sources-beyond-article-38
    sources:
      - Week 02 - Lecture Slides - Sources of International Law (slides 3–26)
      - Week 02 - Lecture Recording (Live) - Sources of International Law - Full Transcript (03:06–49:30)
      - Week 02 - Lecture Recording (Online) - Sources of International Law - Full Transcript (00:00–36:21)
    nodes:
      - id: s1
        kind: ask
        text: Is there a treaty containing the rule to which the state is a party?
        note: The most direct evidence of an obligation; the document's label does not matter, only consent to be bound (VCLT art 2(1)(a)).
        concept: laws2000-w02-treaties-as-a-source
        authorities:
          - vclt-art-2-1-a
        branches:
          - label: 'Yes'
            to: s2
          - label: 'No'
            to: s3
      - id: s2
        kind: ask
        text: Does the treaty provision conflict with a peremptory norm (jus cogens)?
        note: No derogation is permitted (VCLT art 53); the lecture says a treaty containing even one such provision will be terminated.
        authorities:
          - vclt-art-53
        branches:
          - label: 'Yes'
            to: s9
          - label: 'No'
            to: s10
      - id: s3
        kind: ask
        text: Does the rule exist as customary international law binding this state?
        note: Practice plus opinio juris; check particular custom and persistent objection. ICJ decisions and scholars help show whether a rule is custom (Art 38(1)(d)).
        concept: laws2000-w02-customary-international-law-elements
        branches:
          - label: 'Yes'
            to: s11
          - label: 'No'
            to: s4
      - id: s4
        kind: ask
        text: Does a general principle of law resolve the issue?
        note: 'Gap-fillers recognised across legal systems and usable internationally: equity, good faith, res judicata, impartiality of judges.'
        concept: laws2000-w02-general-principles-of-law
        branches:
          - label: 'Yes'
            to: s12
          - label: 'No'
            to: s5
      - id: s5
        kind: ask
        text: Did the state make a public unilateral declaration showing an intention to be bound?
        note: No acceptance or reciprocity is required; form is not strict (Nuclear Tests; Eastern Greenland).
        cases:
          - nuclear-tests-cases-australia-v-france-new-zealand-v-france
          - legal-status-of-eastern-greenland-denmark-v-norway
        branches:
          - label: 'Yes'
            to: s13
          - label: 'No'
            to: s6
      - id: s6
        kind: ask
        text: Is there a binding decision of an international organisation the state belongs to?
        note: 'Binding only where the constitutive treaty says so: Security Council decisions (Art 25 UN Charter); ICAO rules on flights over the high seas.'
        authorities:
          - un-charter-art-25
        branches:
          - label: 'Yes'
            to: s14
          - label: 'No'
            to: s15
      - id: s9
        kind: end
        tone: not-met
        exception: true
        text: 'Not binding: a treaty derogating from jus cogens will be terminated.'
        authorities:
          - vclt-art-53
      - id: s10
        kind: end
        tone: met
        text: 'Bound by the treaty: pacta sunt servanda — honour it and keep domestic law consistent.'
      - id: s11
        kind: end
        tone: met
        text: Bound by custom — even if not party to a treaty containing the same rule.
        cases:
          - nicaragua-v-united-states-of-america
      - id: s12
        kind: end
        tone: met
        text: Resolved by a general principle of law (Art 38(1)(c)).
        authorities:
          - icj-statute-art-38-1
      - id: s13
        kind: end
        tone: met
        text: Bound by its own unilateral statement, on the basis of good faith.
        cases:
          - nuclear-tests-cases-australia-v-france-new-zealand-v-france
      - id: s14
        kind: end
        tone: met
        text: Bound by the organisation's decision, through consent given in its constitutive treaty.
        authorities:
          - un-charter-art-25
      - id: s15
        kind: end
        tone: qualified
        text: No binding source found. Soft law (e.g. General Assembly declarations) may still evidence practice or opinio juris or aid interpretation, but does not bind on its own.
