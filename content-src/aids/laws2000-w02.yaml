  - concept: laws2000-w02-relationship-between-treaties-and-custom
    plain: The same rule can live in a treaty and in custom at once; a treaty can record an existing custom, finish forming a developing one, or start a new one.
    concrete: 'If Australia were attacked by another state tomorrow, the lecturer says, it would have a right of self-defence. That right exists as customary international law and is also written into Article 51 of the UN Charter. Because the customary rule exists in parallel, even a state not party to the Charter would have a right of self-defence: the treaty is not the rule''s only home.'
    formal: A rule may be contained in a treaty and be a rule of custom simultaneously (Nicaragua, ICJ Rep 1986, paras 175–178; see also North Sea Continental Shelf). A treaty may (a) codify a pre-existing rule of custom, (b) crystallise a developing rule of custom, or (c) give rise to a new rule of customary law. The two versions keep separate existences and may differ in content.
    analogy:
      text: 'A folk song later printed in a songbook: the book may record an old song, fix a version still evolving, or print a new song that everyone then starts singing. People without the book still sing it.'
      maps:
        - from: the folk song
          to: the customary rule
        - from: the songbook
          to: the treaty
        - from: people without the book still singing
          to: non-parties still bound by the custom
      limits:
        - A song spreads through popularity; a treaty rule becomes custom only through practice accepted as law.
    terms:
      - term: codification
        gloss: A treaty writing down a pre-existing customary rule; the customary rule continues to exist alongside it.
      - term: crystallisation
        gloss: A treaty prompting the intense state practice that completes the formation of a developing customary rule.
      - term: generating new custom
        gloss: Practice developing around a treaty provision on a genuinely new issue, giving rise to a new customary rule that can bind non-parties.
    misconceptions:
      - claim: Once a rule is written into a treaty, the customary version disappears.
        tempting: In domestic law, a statute often displaces the common law on the same point.
        correction: 'Nicaragua: a rule can be contained in a treaty and be custom simultaneously. Codification does not extinguish the customary rule.'
      - claim: A state not party to the UN Charter has no right of self-defence.
        tempting: Article 51 is the best-known source of the right.
        correction: Self-defence is also customary, so non-parties hold the right through custom; the lecturer uses this to show why parallel existence matters.
      - claim: The treaty and customary versions of a rule always say the same thing.
        tempting: They describe the same right.
        correction: 'They can evolve differently: the customary specification may be more or less permissive than the treaty''s, so check which version binds the state.'
    socratic:
      - ask: Where does a state's right of self-defence come from?
        hint: It has two homes.
        answer: Customary international law, and Article 51 of the UN Charter.
      - ask: If a state never joined the UN Charter, does it lose the right?
        hint: Which of the two homes requires ratification?
        answer: No. Treaties bind only parties, but the customary rule binds independently.
      - ask: Name the three ways a treaty can relate to custom.
        hint: Before, during and after the custom forms.
        answer: Codify a pre-existing custom, crystallise a developing one, or give rise to a new customary rule (Nicaragua; North Sea).
      - ask: Can the two versions say different things?
        hint: They have separate existences.
        answer: Yes. They can evolve differently, one more permissive than the other, so identify which version applies to the state.
    elements:
      - name: Treaty route
        test: Is the state a party to the treaty containing the rule? If so, the treaty version binds it.
      - name: Customary route
        test: Does the same rule also exist as custom — codified, crystallised or generated by the treaty? Test practice and opinio juris.
        cases:
          - nicaragua-v-united-states-of-america
          - north-sea-continental-shelf-cases
      - name: Which content applies
        test: 'Compare the versions: the customary specification may differ from the treaty''s (self-defence: custom and Art 51). Apply the version that binds this state.'
        authorities:
          - un-charter-art-51
    what-if:
      - change: The respondent state is a party to the treaty.
        effect: The treaty binds it directly. The customary rule continues in parallel and may still matter if the treaty version is narrower or does not apply.
      - change: The treaty deals with a genuinely new issue, and non-parties then widely adopt its approach, believing it legally required.
        effect: 'The treaty has given rise to a new customary rule: non-parties are bound by the custom, though not by the treaty itself.'
      - change: Many states ratify a convention, but non-parties reject its rule and act differently.
        effect: Without extensive, virtually uniform practice accepted as law (North Sea [74]), the rule stays purely conventional and non-parties are not bound.
    boundary:
      - text: 'North Sea Continental Shelf [74]: practice built on ''what was originally a purely conventional rule''.'
        why: A treaty rule can become custom even quickly, but only if practice — including specially affected states' — is extensive and virtually uniform. The treaty alone does not create custom.
    transfer:
      - scenario: A multilateral treaty requires states to warn neighbours before launching rockets over their territory. A non-party launches without warning. The neighbour says the treaty does not matter because the rule binds anyway.
        answer: The treaty itself binds only its parties. But the neighbour can argue the same rule exists as custom — codified, crystallised or generated by the treaty (Nicaragua; North Sea). It must prove general practice, including specially affected launching states, accepted as law. If it does, the non-party is bound by the customary version, whose content may differ from the treaty's.
    sources:
      - Week 02 - Lecture Slides - Sources of International Law (slide 14)
      - 'Week 02 - Lecture Recording (Live) - Sources of International Law - Full Transcript (45:00–47:20: self-defence in custom and Art 51; codify, crystallise, generate)'
