  - concept: laws2000-w02-treaties-as-a-source
    plain: A treaty is a written agreement between states, governed by international law, that binds the states which consent to it; whatever it is called, they must honour it.
    concrete: 'The UN Charter is a treaty: it created the United Nations and sets out its powers and main organs. NATO and the European Union were created the same way. The lecturer notes that treaties are the most common way to create an international organisation, and that they can run to hundreds of provisions — far more detailed than custom, which tends to be more general.'
    formal: 'A treaty is "an international agreement concluded between States in written form and governed by international law" (VCLT art 2(1)(a)). The label — agreement, convention, protocol, covenant, exchange of letters — does not matter; the key is consent to be bound. Pacta sunt servanda: states must honour treaty obligations and keep domestic law and practice consistent with them.'
    analogy:
      text: 'A signed contract between two businesses: whatever the document is titled, once both sign intending to be bound, each must perform.'
      maps:
        - from: signing intending to be bound
          to: becoming a party (e.g. ratifying)
        - from: the document's title
          to: 'treaty labels: convention, protocol, exchange of letters'
        - from: the duty to perform
          to: pacta sunt servanda
      limits:
        - A contract is enforced by courts with compulsory jurisdiction; treaty compliance rests largely on consent and reputation.
        - A treaty can require a state to change its own domestic law, which no private contract can do.
    terms:
      - term: pacta sunt servanda
        gloss: States are bound to honour their treaty-based obligations once they have become parties.
      - term: bilateral and multilateral treaties
        gloss: 'Bilateral: between two states. Multilateral: between three or more states.'
      - term: becoming a party
        gloss: Ratifying or otherwise joining a treaty implies consent to be bound; checking it is the easiest way to see what a state accepted.
      - term: Vienna Convention on the Law of Treaties (1969)
        gloss: The treaty on treaties. It covers only written treaties between states, though treaties generally may involve international organisations or even be oral.
    misconceptions:
      - claim: A document is a treaty only if it is called a 'treaty' or 'convention'.
        tempting: Formal titles seem to signal legal importance.
        correction: 'The name does not matter: agreements, protocols, covenants and exchanges of letters can all be treaties. What counts is whether the parties intended binding obligations governed by international law.'
      - claim: A widely ratified treaty binds every state.
        tempting: A treaty with most of the world as parties looks like general law.
        correction: A treaty binds its parties, because becoming a party implies consent. A non-party is bound only if the same rule exists in another source, such as custom.
      - claim: Treaty obligations operate only internationally and never touch domestic law.
        tempting: Treaties are made between governments, not parliaments.
        correction: A state party must ensure its domestic law and practice are consistent with the treaty and should not legislate contrary to it (slide 5; pacta sunt servanda).
    socratic:
      - ask: Two states sign an 'Exchange of Letters' intending binding obligations. Does the title stop it being a treaty?
        hint: What does the lecturer say really counts?
        answer: No. The label is irrelevant; the question is whether the parties intended binding obligations governed by international law.
      - ask: What makes the treaty bind State A in particular?
        hint: What does becoming a party imply?
        answer: 'State A''s consent: becoming a party, for example by ratifying, implies consent to be bound.'
      - ask: Why do courts usually look at treaties first?
        hint: How easy is it to prove consent?
        answer: 'A treaty is the most direct evidence of an obligation: you can check whether the state ratified or became a party.'
      - ask: Once bound, what must State A do at home?
        hint: Think pacta sunt servanda and slide 5.
        answer: Honour its obligations and keep its domestic law and practice consistent with what the treaty requires.
    elements:
      - name: International agreement
        test: The parties intended to create binding obligations; the title (convention, protocol, exchange of letters) does not matter.
        authorities:
          - vclt-art-2-1-a
      - name: Between states
        test: Concluded between states for VCLT purposes; treaties generally may also involve international organisations, such as the EU.
        authorities:
          - vclt-art-2-1-a
      - name: In written form
        test: Written, for the VCLT; the lecturer notes treaties generally can even be oral, but the unit focuses on written treaties.
        authorities:
          - vclt-art-2-1-a
      - name: Governed by international law
        test: The agreement is governed by international law, not domestic law and not mere political commitment.
        authorities:
          - vclt-art-2-1-a
      - name: Consent to be bound
        test: The state has become a party, for example by ratification; only then does pacta sunt servanda bind it to the treaty.
    what-if:
      - change: The document is a joint political statement the parties did not intend to be binding.
        effect: 'No treaty: the key is the intention to create legal obligations. It may be soft law — possible evidence of practice or opinio juris, not a binding source.'
      - change: One party is an international organisation rather than a state.
        effect: It can still be a treaty in general international law (the EU is the slide's example), but it falls outside the 1969 VCLT, which covers written treaties between states only.
      - change: The state is a party but later passes a law contradicting the treaty.
        effect: 'Pacta sunt servanda: it remains bound internationally and must keep its domestic law consistent with the treaty, so the new law puts it in breach.'
    boundary:
      - text: An oral agreement between two states.
        why: Treaties generally can be oral, the lecturer notes, but VCLT art 2(1)(a) covers only written agreements — so it is a treaty in general, outside the VCLT's scope.
      - text: A treaty creating an international organisation, such as the UN Charter.
        why: 'Squarely a treaty, but it also creates a body whose decisions can bind members (Art 25 UN Charter): the treaty becomes the source of further obligations.'
    transfer:
      - scenario: Two states' environment ministers sign a 'Memorandum on River Care' setting out detailed duties, with a clause that disputes are to be settled under international law. Later one state says it was 'just a memorandum'.
        answer: The title does not decide treaty status (slide 4). If the states intended binding obligations governed by international law — and the dispute clause points that way — it is a treaty under VCLT art 2(1)(a). Pacta sunt servanda then requires each to honour it and keep its domestic law consistent with it.
    sources:
      - Week 02 - Lecture Slides - Sources of International Law (slides 4–5)
      - 'Week 02 - Lecture Recording (Live) - Sources of International Law - Full Transcript (11:48–17:50: treaties, VCLT scope, names, pacta sunt servanda)'
