  - concept: laws2000-w02-judicial-decisions-and-scholarly-writings
    plain: Court decisions and expert writings don't make international law; they help show what the law is, and an ICJ judgment formally binds only the states in that case.
    concrete: 'The lecturer''s example: if Australia and France litigate before the ICJ, the judgment binds those two states in that case. If Australia later sues another state on similar facts and similar law, the first judgment does not bind the new case. Still, ICJ judgments cite earlier rulings in almost every paragraph, and states invoke ICJ cases as bargaining chips when negotiating settlements.'
    formal: 'Article 59 ICJ Statute: "The decision of the Court has no binding force except between the parties and in respect of that particular case." Judicial decisions and "the teachings of the most highly qualified publicists" (Art 38(1)(d)) are subsidiary, law-interpreting sources. Yet decisions carry substantial interpretative weight, and the ICJ rarely departs from its jurisprudence (Guillaume 2011).'
    analogy:
      text: 'A respected umpire''s past rulings: each binds only that match, but other umpires and players rely on them to know how the rules work.'
      maps:
        - from: a ruling binding only that match
          to: 'Article 59: binding only the parties and that case'
        - from: others relying on past rulings
          to: the interpretative weight of ICJ decisions
      limits:
        - Common law precedent makes earlier rulings binding; Article 59 deliberately does not, to respect consent to the Court's non-compulsory jurisdiction.
    terms:
      - term: Article 59 ICJ Statute
        gloss: An ICJ decision binds only the parties and only in respect of that particular case — there is no binding precedent.
      - term: teachings of the most highly qualified publicists
        gloss: Writings of leading international law scholars — a subsidiary means under Article 38(1)(d) for clarifying ambiguous law.
      - term: International Law Commission
        gloss: UN body of elected, geographically representative experts on codification and progressive development; its draft articles, such as on state responsibility, are often cited by the ICJ.
      - term: ad hoc tribunals
        gloss: Courts set up by the Security Council for specific situations, such as the tribunals for the former Yugoslavia and Rwanda, then phased out.
    misconceptions:
      - claim: ICJ decisions bind later cases as precedent, as in Australian courts.
        tempting: ICJ judgments cite earlier decisions in almost every paragraph.
        correction: 'Article 59: a decision binds only the parties and that case, respecting consent to the Court''s non-compulsory jurisdiction. Consistency is practice, not obligation.'
      - claim: Because judgments are not binding precedent, they carry little weight.
        tempting: '''Non-binding'' sounds optional.'
        correction: They carry substantial interpretative weight; the ICJ rarely departs from its jurisprudence, for legitimacy, predictability and the peaceful settlement of disputes.
      - claim: ILC draft articles are binding law.
        tempting: Courts cite them constantly, especially the Draft Articles on State Responsibility.
        correction: They are subsidiary, non-binding expert work that helps interpret the law; they can become treaties if states adopt them.
    socratic:
      - ask: Australia wins an ICJ case against France. Does the judgment bind Australia's later case against another state?
        hint: Read Article 59.
        answer: No. It binds only the parties and only in respect of that particular case.
      - ask: Why design the Court that way?
        hint: Is the ICJ's jurisdiction compulsory?
        answer: 'To respect consent: a state that never accepted the Court''s jurisdiction over a dispute should not be bound by what the Court says.'
      - ask: So why do judges still follow earlier decisions?
        hint: The lecture gives three reasons.
        answer: Legitimacy, predictability (states would otherwise avoid litigating) and the peaceful settlement of disputes.
      - ask: Where do scholars and the ILC fit?
        hint: Article 38(1)(d).
        answer: 'As subsidiary means: they clarify ambiguous law but do not create it; ILC drafts may later become treaties.'
    what-if:
      - change: The same two states return to court on similar facts in a new dispute.
        effect: Even between the same parties, the earlier decision does not bind the new case under Article 59; it is persuasive and will very likely be followed for consistency.
      - change: The authority relied on is a domestic decision, such as the Canadian Supreme Court on the secession of Quebec.
        effect: Domestic decisions can also be relevant — the Quebec decision is often discussed on self-determination — but as evidence or interpretation, not as binding international law.
    boundary:
      - text: The ILC's Draft Articles on State Responsibility.
        why: Formally only subsidiary, yet heavily relied on by courts because no treaty covers the topic — an interpretive source carrying near-primary weight in practice.
      - text: A judge's academic article written in a personal capacity.
        why: It counts as scholarly writing under Article 38(1)(d), not as a judicial decision of the judge's tribunal; the lecture includes judges acting in an academic capacity among scholars.
    transfer:
      - scenario: A new regional human rights court hears its very first case. One party argues the court may not refer to any ICJ judgment, because ICJ judgments do not bind it.
        answer: 'True that they do not bind it: under Article 59 an ICJ decision binds only its parties and that case. But judicial decisions are subsidiary means with substantial interpretative weight, and international judges and practitioners constantly draw on earlier decisions. The new court may rely on ICJ reasoning as persuasive authority.'
    sources:
      - Week 02 - Lecture Slides - Sources of International Law (slides 18–19)
      - 'Week 02 - Lecture Recording (Online) - Sources of International Law - Full Transcript (01:17–10:27: judicial decisions, Article 59, consistency, scholarly writings, ILC)'
      - Week 02 - Lecture Recording (Live) - Sources of International Law - Full Transcript (06:00–11:48)
      - Week 02 - Tutorial Questions - Sources of International Law (Question 1B)
    verify: false
  - concept: laws2000-w02-sources-beyond-article-38
    plain: Some rules bind states even though Article 38 doesn't list them — public promises, peremptory norms and some decisions of international organisations — and non-binding soft law still shapes the law.
    concrete: 'In 1919 Norway''s foreign minister, Mr Ihlen, told the Danish minister that Norway "would not make any difficulty" over Denmark''s claim to all of Greenland. When Norway later occupied part of Eastern Greenland, the Permanent Court of International Justice held the promise "unconditional and definitive": Norway was obliged not to contest Danish sovereignty over Greenland as a whole, and so not to occupy any part of it.'
    formal: 'Unilateral declarations intended to bind create legal undertakings; no quid pro quo or acceptance is required (Nuclear Tests [1974]). Jus cogens: a norm "accepted and recognized by the international community of States as a whole" from which "no derogation is permitted" (VCLT art 53). Members "agree to accept and carry out the decisions of the Security Council" (UN Charter art 25). Soft law is not an independent source.'
    terms:
      - term: unilateral statement
        gloss: A public declaration by a state's representative, made with the intention to be bound, creating a legal obligation without any reciprocal promise or acceptance.
      - term: jus cogens (peremptory norm)
        gloss: A norm accepted by the community of states as a whole from which no derogation is permitted, even by treaty (VCLT art 53).
        example: 'ILC examples: genocide, crimes against humanity, aggression, slavery, torture and self-determination.'
      - term: soft law
        gloss: Non-legally binding instruments, such as General Assembly declarations, that can evidence practice or opinio juris, aid interpretation, or lead to treaties.
      - term: hard law
        gloss: The legally binding sources, such as treaties and custom, contrasted with soft law.
    misconceptions:
      - claim: A unilateral statement binds only once the other state accepts it.
        tempting: Most binding promises, like contracts, need acceptance.
        correction: 'Nuclear Tests: no quid pro quo, acceptance, reply or reaction from other states is required; the declaring state''s intention to be bound is enough.'
      - claim: General Assembly declarations bind because almost every state votes for them.
        tempting: Wide support looks like consent.
        correction: Soft law is not an independent source. It can evidence practice or opinio juris and lead to custom or treaties — the UDHR led to the ICCPR and ICESCR.
      - claim: A treaty provision that breaches jus cogens is simply cut out and the rest of the treaty survives.
        tempting: Domestic courts often sever invalid clauses.
        correction: The lecture says no treaty can contain even one provision violating jus cogens; such a treaty will be terminated.
    socratic:
      - ask: Norway's minister orally promised not to make difficulties over Greenland. Was there a treaty?
        hint: Was there a written agreement between states?
        answer: No — a unilateral statement. Yet the Permanent Court held it bound Norway (Eastern Greenland).
      - ask: What made France's press-conference statements binding in Nuclear Tests?
        hint: Whose intention matters?
        answer: France's own intention to be bound by their terms. Form is not strict, and the binding character rests on good faith.
      - ask: Could two states validly agree by treaty to permit torture between them?
        hint: VCLT art 53.
        answer: No. The prohibition of torture is jus cogens; no derogation is permitted, and such a treaty would be terminated.
      - ask: How can a Security Council decision bind a state that voted against it?
        hint: Look at the treaty the state already ratified.
        answer: Under Article 25 of the UN Charter, members agreed in advance to accept and carry out Council decisions.
      - ask: Is a General Assembly declaration law?
        hint: Hard law or soft law?
        answer: No, it is soft law. But it can evidence practice or opinio juris and lead to custom or new treaties.
    elements:
      - name: Public declaration by a representative
        test: A statement by an authorised representative, such as a foreign minister or president; no strict form is required — oral statements and press conferences suffice.
        cases:
          - legal-status-of-eastern-greenland-denmark-v-norway
          - nuclear-tests-cases-australia-v-france-new-zealand-v-france
      - name: Intention to be bound
        test: Interpreting the words used, the state intended to become bound by them; in Eastern Greenland the promise was 'unconditional and definitive'.
        cases:
          - nuclear-tests-cases-australia-v-france-new-zealand-v-france
          - legal-status-of-eastern-greenland-denmark-v-norway
      - name: No reciprocity required
        test: No quid pro quo, acceptance, reply or reaction from other states is needed.
        cases:
          - nuclear-tests-cases-australia-v-france-new-zealand-v-france
      - name: Good faith
        test: 'The binding character rests on good faith: the state must thereafter follow a course of conduct consistent with its declaration.'
        cases:
          - nuclear-tests-cases-australia-v-france-new-zealand-v-france
    what-if:
      - change: The Norwegian minister had said only that Norway would consider Denmark's claim sympathetically.
        effect: 'Unlikely to bind: the Court stressed the promise was ''unconditional and definitive''. A vague or conditional statement shows no clear intention to be bound.'
      - change: The Security Council text is a recommendation rather than a decision.
        effect: Article 25 makes Council decisions binding; the lecture flags a distinction between decisions and recommendations, so a mere recommendation would not bind members.
      - change: A General Assembly fisheries declaration is followed consistently by states that come to treat it as legally required.
        effect: The declaration itself stays non-binding, but the resulting practice and opinio juris may crystallise a customary rule.
    boundary:
      - text: ICAO technical rules on flights over the high seas.
        why: Adopted by a two-thirds vote, they bind contracting states with no possibility of deviation — a rare example of international legislation by majority that departs from the consent principle.
      - text: Whether jus cogens is a subset of customary international law.
        why: 'Debated: some say yes; others say no, because a jus cogens rule can be asserted without supporting practice or consent. Its content and consequences are also contested.'
    transfer:
      - scenario: At a press conference a prime minister declares, unconditionally, that her state will stop dumping waste in a shared sea from next year. The neighbouring state never replies. Two years later the dumping resumes.
        answer: Following Nuclear Tests and Eastern Greenland, a public, unconditional declaration by an authorised representative, showing an intention to be bound, creates a legal undertaking; no acceptance or reply is required and form is not strict. Its binding force rests on good faith, so resuming the dumping breaches the state's own unilateral obligation.
    sources:
      - Week 02 - Lecture Slides - Sources of International Law (slides 20–26)
      - 'Week 02 - Lecture Recording (Online) - Sources of International Law - Full Transcript (10:40–34:13: unilateral statements, jus cogens, IO decisions, soft law)'
      - Week 02 - Tutorial Questions - Sources of International Law (Question 1C)
