unit: mgmt2094
week: 6
source: raw/mgmt2094-sci/week-06
generator: aids-1
aids:
  - concept: mgmt2094-w06-why-reflect
    plain: You don't learn just by having an experience; you learn by deliberately thinking it over, with a purpose, so that its lessons are not forgotten or lost.
    concrete: 'The lecture opens with Dumbledore in Harry Potter and the Goblet of Fire. When he has too many thoughts and memories crammed into his mind, he siphons the excess into a stone basin, the Pensieve, and examines them at his leisure: in that form ''it becomes easier to spot patterns and links''. The lecturer: reflective writing is our Pensieve, the container that helps us spot patterns in our thinking and link ideas together.'
    formal: 'Slides: ''It is not sufficient to merely have experience in order to learn. Without reflecting it may be quickly forgotten or its learning potential lost.'' Moon (1999) suggests reflection is ''a form of mental processing with a purpose''. The slide adds John Dewey: ''We do not learn from experience… we learn from reflecting on experience.'''
    analogy:
      text: 'Dumbledore''s Pensieve: a stone basin into which he pours his excess thoughts so he can examine them at his leisure.'
      maps:
        - from: pouring thoughts into the basin
          to: writing them down in a reflective piece
        - from: examining them at leisure
          to: mental processing with a purpose (Moon 1999)
        - from: spotting patterns and links
          to: learning from the experience
      limits:
        - The Pensieve just holds memories; a reflective paper must also analyse them and relate them to theory, not merely store them.
    terms:
      - term: reflection (Moon 1999)
        gloss: '''A form of mental processing with a purpose'': purposeful thinking about an experience, not just recalling it.'
      - term: learning potential
        gloss: What an experience could teach you; the slide says it may be lost if you do not reflect.
      - term: Pensieve
        gloss: Dumbledore's stone basin for excess thoughts; the lecture's image for reflective writing as a container that shows patterns and links.
    misconceptions:
      - claim: Experience teaches by itself; reflection is an optional extra.
        tempting: We do pick things up just by doing them.
        correction: 'The slide: it is not sufficient merely to have experience in order to learn; without reflecting it may be quickly forgotten or its learning potential lost.'
      - claim: Reflection is just remembering what happened.
        tempting: Both look back on an experience.
        correction: 'Moon (1999): reflection is mental processing with a purpose. Dumbledore pours out his thoughts to examine them and spot patterns, not merely to keep them.'
      - claim: '''A form of mental processing with a purpose'' is Dewey''s definition.'
        tempting: Both lines sit on the same slide.
        correction: It is Moon (1999). Dewey's line is 'We do not learn from experience… we learn from reflecting on experience'.
    socratic:
      - ask: A manager has run twenty product launches but never looked back at any. Has she learnt from them?
        hint: Is experience enough?
        answer: 'Not necessarily: merely having experience is not sufficient to learn; without reflection it may be forgotten or its learning potential lost.'
      - ask: What makes reflection more than remembering?
        hint: The last words of Moon's definition.
        answer: 'Purpose: reflection is ''a form of mental processing with a purpose''.'
      - ask: Why does Dumbledore pour his thoughts into the Pensieve?
        hint: Too many thoughts.
        answer: To examine them at his leisure; in that form it becomes easier to spot patterns and links.
      - ask: Why, says the lecturer, do people reflect less today?
        hint: Phones and screens.
        answer: We are constantly distracted and bombarded with information, so we have lots of experiences but rarely sit down to reflect, and so don't really learn.
    what-if:
      - change: After every team meeting Omar types his worries and ideas into one document, then rereads it a month later.
        effect: 'That mirrors the Pensieve: getting thoughts out of his head into a container lets him spot patterns, such as the same scheduling problem recurring, and link ideas together.'
    boundary:
      - text: A detailed diary of every team meeting, kept but never reread.
        why: 'Not reflection as defined: a record is not ''mental processing with a purpose''. The Pensieve''s value is examining thoughts to spot patterns, not storing them.'
    transfer:
      - scenario: A first-year nurse finishes her first ward placement and wants to do better on the next one.
        answer: 'Experience alone will not do it: without reflecting, the placement may be quickly forgotten or its learning potential lost. She should process it with a purpose (Moon 1999): write her thoughts down, Pensieve-style, to spot patterns and links, and draw lessons for next time.'
    objections:
      - position: Experience is the best teacher, so reflection adds little.
        evidence: We do learn by doing, and the group project gives students a whole semester of team experience.
        objection: 'The slide: merely having experience is not sufficient to learn; Dewey: we learn from reflecting on experience; the lecturer: amid constant distraction we have many experiences but rarely learn from them.'
    sources:
      - Marketing - Week 06 - Lecture Materials - Reflective Writing (file labelled Week 7 on iLearn) (slides 2–3)
      - Marketing - Week 09 - Lecture Transcript - Types and Models of Innovation, Reflective Writing (reflective-writing segment, reused recording)
  - concept: mgmt2094-w06-purposes-of-reflection
    plain: 'Reflection serves five purposes: noticing how you learn, critically reviewing behaviour, building theory from what you observe, developing yourself, and making decisions.'
    concrete: 'The lecturer glosses the five. Recognition is step one: we sit down and recognise that we want to learn something from this experience. Critical review means looking critically at our own behaviour or other people''s. Building theory means observing and coming up with an explanation for what we observe. Then personal development, and finally making decisions based on our reflection. For the paper: what did I learn, and how could I, and others, have done things differently?'
    formal: 'Slides: 1 Consider the process of our own learning, a process of recognition; 2 Critically review something: our own behaviour, that of others etc; 3 Build on theory from observation; 4 Engage in personal or self development; 5 Make decisions or resolve uncertainty. For self-reflective writing they relate to your group experiences, theory on the innovative project you presented, and its effect on the project.'
    terms:
      - term: process of recognition
        gloss: 'The first purpose: recognising that you want to learn from this experience, and how you learn.'
      - term: critical review
        gloss: Looking critically at behaviour, your own or others'; detachment still applies when describing others.
      - term: building theory from observation
        gloss: Observing what happened, then proposing an explanation for it.
    elements:
      - name: 1 Consider the process of our own learning
        test: 'A process of recognition, the lecturer''s ''step number one'': recognise that you want to learn something from this experience.'
        authorities:
          - mgmt2094-moon-1999
          - mgmt2094-example-group-project-reflection
      - name: 2 Critically review something
        test: Look critically at our own behaviour, that of others, and so on.
      - name: 3 Build on theory from observation
        test: Observe, then come up with an explanation for what you observed; not theory first.
      - name: 4 Engage in personal or self development
        test: Use the reflection to develop yourself.
      - name: 5 Make decisions or resolve uncertainty
        test: Based on the reflection, make decisions or settle what you were unsure about.
    misconceptions:
      - claim: Building on theory means choosing a theory first, then finding an example from the project that fits it.
        tempting: Many essays work that way.
        correction: 'The lecturer puts it the other way round: we observe, and then we come up with an explanation for what we observe.'
      - claim: Critical review covers only your own behaviour, never other people's.
        tempting: The slides warn against dragging others down.
        correction: The second purpose reviews 'our own behavior, that of others etc'; the detachment rule governs how you describe others, not whether you may.
      - claim: The purpose of a reflective paper is to record what happened in the group project.
        tempting: A reflection does mention events.
        correction: 'None of the five purposes is recording; and the final slide warns: do not just describe, you must analyse and reflect.'
    socratic:
      - ask: Before you can learn from the project, what must you first do?
        hint: The lecturer's step number one.
        answer: 'Recognise that you want to learn something from the experience: considering the process of your own learning.'
      - ask: 'Ben writes: ''I interrupted the others in our first meetings, and that slowed us down.'' Which purpose?'
        hint: Looking at behaviour.
        answer: 'Critically reviewing something: his own behaviour.'
      - ask: Farid writes that the team's ideas improved once it stopped judging them early. Which purpose?
        hint: From what he saw to an explanation.
        answer: 'Building on theory from observation: he observed a pattern, then explained it.'
      - ask: Chloe uses the panel's feedback to settle on the bolder concept. Which purpose?
        hint: She had been unsure.
        answer: Making decisions or resolving uncertainty.
    what-if:
      - change: Instead of judging her leader's conduct, Gia writes that the team stopped offering ideas once decisions were made alone, and suggests why.
        effect: She moves from critically reviewing another person's behaviour towards building theory from observation, and the detachment the slides ask for becomes easier to keep.
    boundary:
      - text: 'Dev: ''I avoid speaking up in groups, so this semester I am presenting once in every tutorial.'''
        why: 'Personal or self development, not building theory: Dev sets himself a goal rather than explaining how teams work.'
    transfer:
      - scenario: After a failed fundraising event, a student club's treasurer writes a reflection for the committee.
        answer: 'She can serve each purpose: recognise how she learnt from it; critically review her own and the committee''s behaviour, with detachment; build an explanation from what she observed; set herself a development goal; and decide what to do differently at the next event.'
    sources:
      - Marketing - Week 06 - Lecture Materials - Reflective Writing (file labelled Week 7 on iLearn) (slides 4)
      - Marketing - Week 09 - Lecture Transcript - Types and Models of Innovation, Reflective Writing (reflective-writing segment, reused recording)
  - concept: mgmt2094-w06-revealing-information-wisely
    plain: 'A reflective paper is personal but not a confession: include only what is appropriate, keep a professional tone, and describe difficult teammates with detachment.'
    concrete: 'The lecturer: your reflection holds subjective feelings and opinions, so ask what is appropriate. If you feel uncomfortable sharing a personal feeling, that''s okay; just don''t share it, unless it really changed the final outcome, and then indicate your concerns. Jot notes down first, perhaps as free writing, then organise them into a structured piece. And don''t badmouth or accuse other people.'
    formal: 'Slides: a reflective paper is somewhat personal, including your subjective feelings and opinions. Ask if something is appropriate before including it. If you feel uncomfortable about a reflection, leave it out unless it changed the final outcome, and then indicate your concerns about such reveals. Always maintain a professional and academic tone. Avoid dragging someone else down; keep detachment as you describe their influence.'
    terms:
      - term: detachment
        gloss: Describing another person's influence calmly and factually, without attacking them, even if they made life difficult for you.
      - term: appropriate (to include)
        gloss: The first test the slide sets for any personal detail before it goes into the paper.
      - term: free writing (first draft)
        gloss: 'The lecturer''s suggested first step: jot your thoughts down freely, then organise them into a structured piece.'
    elements:
      - name: Is it appropriate?
        test: Instead of revealing everything about yourself, ask whether it is appropriate before including it.
        authorities:
          - mgmt2094-example-group-project-reflection
      - name: Uncomfortable? Did it change the outcome?
        test: If you feel uncomfortable, leave it out unless it changed the final outcome of your experience; if you include it, indicate your concerns about the reveal.
      - name: Professional, academic tone
        test: Personal and subjective, but keep your thoughts organised so they appear sensible.
      - name: Detachment towards others
        test: Avoid dragging anyone down; describe their influence with a level of detachment.
    misconceptions:
      - claim: Anything uncomfortable must never appear in a reflective paper.
        tempting: The slide says not to include uncomfortable reflections.
        correction: 'It adds an exception: unless it did change the final outcome of your experience. Then include it and indicate your concerns about revealing it.'
      - claim: Total honesty means including every feeling, about yourself and your teammates.
        tempting: Reflection values honesty.
        correction: 'The slides: instead of revealing everything, ask whether something is appropriate; avoid dragging someone else down; keep a level of detachment.'
      - claim: Because the paper is personal, its tone can be emotional and casual.
        tempting: Subjective writing sounds informal.
        correction: 'The slide: always maintain a professional and academic tone, keeping your thoughts organised so they appear sensible.'
    socratic:
      - ask: What should you ask yourself before putting a personal detail in?
        hint: The first test.
        answer: Is it appropriate to include?
      - ask: Hana is uncomfortable writing about anxiety that made her miss meetings, after which the team changed its concept without her. Include it?
        hint: Did it change the outcome?
        answer: 'Yes: it changed the final outcome, so she may include it, but should indicate her concerns about revealing it.'
      - ask: Isaac's family matter had no effect on the project. Include it?
        hint: The same test.
        answer: 'No: it is uncomfortable and did not change the outcome, so leave it out; the lecturer says that''s okay.'
      - ask: A teammate made life hard for Jack. How should he write about them?
        hint: Leaving them out is not required.
        answer: 'Describe their influence with detachment: what happened and its effect on the project, without dragging them down.'
    what-if:
      - change: Liam's reflection is appropriate and he is comfortable sharing it, but it is written in angry, disordered bursts.
        effect: 'Disclosure is fine; the rule that applies is tone: keep it professional and academic, with thoughts organised so they appear sensible. The lecturer suggests free writing first, then organising.'
    boundary:
      - text: '''Two of our deadlines slipped when drafts arrived late, which put pressure on the edit.'''
        why: 'Within the rules: it describes a teammate''s influence on the project with detachment, without naming or attacking anyone.'
      - text: '''Mia was the worst teammate I have had at university.'''
        why: 'Outside: a personal attack, exactly what ''avoid dragging someone else down'' rules out.'
    transfer:
      - scenario: A graduate writes a reflective report for her employer on a project where her manager kept changing the brief.
        answer: Ask whether each personal detail is appropriate; leave out uncomfortable ones unless they changed the outcome, and then note her concerns. Keep a professional tone, and describe the manager's influence (the changing brief and its effect on deadlines) with detachment, not blame.
    objections:
      - position: A reflective paper should be completely honest, so include everything you felt.
        evidence: 'The slides call the paper somewhat personal: it includes your subjective feelings and opinions.'
        objection: The slides also say ask what is appropriate, leave out uncomfortable reflections unless they changed the outcome, keep a professional tone and keep detachment towards others.
    sources:
      - Marketing - Week 06 - Lecture Materials - Reflective Writing (file labelled Week 7 on iLearn) (slides 5)
      - Marketing - Week 09 - Lecture Transcript - Types and Models of Innovation, Reflective Writing (reflective-writing segment, reused recording)
  - concept: mgmt2094-w06-writing-a-reflective-paper
    plain: 'A reflective paper may use ''I'' and feelings, but it is still an academic paper: back feelings with evidence, write clear sentences in paragraphs, and link experiences to conclusions.'
    concrete: 'The lecturer: you can and should use ''I'', and that is fine in other academic papers too; journal authors write ''I found that''. But feelings should not come out of the blue: think critically about the experience and give specific evidence. It is not a diary and not a stream of consciousness: keep sentences focused, use paragraphs, and use transitional phrases such as ''as a result'' when you shift focus.'
    formal: 'Slides: one of the few academic papers where you can use ''I''; relate feelings and opinions using specific evidence; avoid slang and jargon; proofread; NOT a personal journal (diary) entry; keep sentences focused; avoid fragments; vary sentence length; use paragraphs. Transitional phrases shift the argument and link experience to conclusion. Relate it to your group project, with theoretical underpinnings.'
    terms:
      - term: transitional phrase
        gloss: 'A phrase that shifts the argument and links an experience to a conclusion: for example, for instance, as a result, an opposite view is, a different perspective is.'
      - term: sentence fragment
        gloss: An incomplete sentence, such as 'Because of the cost.'; the slides say avoid them.
      - term: theoretical underpinnings
        gloss: The unit theory a reflection must be related to, alongside your group project and experiences.
    elements:
      - name: Use 'I', with evidence
        test: One of the few academic papers allowing 'I'; relate your feelings and opinions using specific evidence to explain them.
        authorities:
          - mgmt2094-example-group-project-reflection
      - name: Academic, not a diary
        test: Not a personal journal entry; avoid slang and jargon; always proofread.
      - name: Clear sentences
        test: Keep sentences focused, one idea each; avoid fragments; vary sentence length, but not too long.
      - name: Paragraphs and transitions
        test: Use paragraphs; transitional phrases show how each experience or detail links to a conclusion or understanding.
      - name: Group project and theory
        test: Relate it all to your group project and experiences, with theoretical underpinnings.
    misconceptions:
      - claim: Academic writing must never use 'I', so write 'we' or use the passive.
        tempting: Many essays avoid 'I'.
        correction: 'The slide: a reflective paper is one of the few academic papers where you can use ''I''; the lecturer adds it is fine in other academic writing too.'
      - claim: Because the paper is personal, feelings need no support.
        tempting: Feelings are subjective.
        correction: 'The slide: relate your subjective feelings and opinions using specific evidence to explain them; the lecturer says feelings should not come out of the blue.'
      - claim: Transitional phrases are padding to reach the word count.
        tempting: They do add words.
        correction: 'The slide gives them a job: they shift the argument and introduce specific details, showing how one experience links to a conclusion or understanding.'
    socratic:
      - ask: Can you write 'I' in this paper?
        hint: One of the few.
        answer: 'Yes: it is one of the few academic papers where you can use ''I''.'
      - ask: A draft says, 'I felt the team worked really well together.' What is missing?
        hint: Why did you feel that?
        answer: Specific evidence explaining the feeling, such as what the team did that showed it.
      - ask: '''Brainstorming was lit; we smashed it.'' Which rule does it break?'
        hint: Word choice.
        answer: 'Avoid slang and jargon: it is an academic paper, not a diary.'
      - ask: How do you show that one experience led to a conclusion?
        hint: Five phrases on the slide.
        answer: With a transitional phrase, such as 'as a result', linking the detail to the conclusion or understanding.
    what-if:
      - change: A draft crams the first meeting, the budget, a music dispute and a lesson about leadership into one sentence.
        effect: It breaks 'keep your sentences focused; avoid squeezing multiple ideas into one sentence'. Split it into focused sentences in a paragraph, linked by transitional phrases.
    boundary:
      - text: '''Dear diary, today was SO stressful, ugh.'''
        why: 'Outside: the paper is NOT a personal journal (diary) entry; the tone is casual and the feeling has no evidence behind it.'
    transfer:
      - scenario: A marketing graduate must write a short reflective piece for her firm's intranet about her first client pitch.
        answer: Use 'I', but support each feeling with specific evidence; avoid slang and jargon, and proofread; keep sentences focused, avoid fragments, vary length and use paragraphs; and use transitional phrases ('as a result', 'a different perspective is') to link what happened to what she learnt.
    objections:
      - position: Because a reflective paper is personal, the normal rules of academic writing do not apply.
        evidence: You may use 'I' and include your subjective feelings and opinions.
        objection: 'The slides: it is NOT a diary; feelings need specific evidence; no slang; focused sentences, paragraphs and transitional phrases; and theoretical underpinnings.'
    sources:
      - Marketing - Week 06 - Lecture Materials - Reflective Writing (file labelled Week 7 on iLearn) (slides 6–7)
      - Marketing - Week 09 - Lecture Transcript - Types and Models of Innovation, Reflective Writing (reflective-writing segment, reused recording)
  - concept: mgmt2094-w06-describe-analyse-reflect
    plain: 'A reflection must go beyond retelling what happened: analyse why it happened and what you learnt, and say what you would do differently next time.'
    concrete: 'The lecturer: the 750-word reflection is about your experience of working in a team to create a video: what happened, the dynamics you experienced, what you did and what you achieved. But you are not just describing things; you need to analyse them and reflect. Ask what you learnt, what you now know, what challenges you met and how well you and the team handled them, and what you would do better next time.'
    formal: 'Slides, ''Questions to ask myself'': What have I learnt from the process? What do I now know, that I didn''t before? What insights have I gained? What were the challenges I encountered/observed, and how well did I and the team handle them? What would I do better or differently next time? What have I learnt from this? ''Remember ultimately do not just describe; you must analyse and reflect!!'''
    terms:
      - term: description
        gloss: Reporting what happened, usually in order; the slides say it is not enough on its own.
      - term: analysis
        gloss: Explaining why things happened and what they mean, related to theory where you can.
      - term: marking rubric
        gloss: The criteria the final slide says to keep in mind, together with the group project criteria.
    elements:
      - name: What have I learnt from the process?
        test: Name the learning, not the events.
        authorities:
          - mgmt2094-dewey-reflecting-on-experience
          - mgmt2094-example-group-project-reflection
      - name: What do I now know, that I didn't before?
        test: State new knowledge as a change from before.
      - name: What insights have I gained?
        test: An understanding that explains what happened.
      - name: What were the challenges, and how well did I and the team handle them?
        test: 'Both halves: the challenges you encountered or observed, and how well you and the team handled them.'
      - name: What would I do better or differently next time?
        test: A future action drawn from the experience.
      - name: What have I learnt from this?
        test: Close on the lesson; the slide asks it twice, in slightly different words.
    misconceptions:
      - claim: A detailed, accurate account of what the team did is the heart of a good reflection.
        tempting: Accuracy matters, and events are what you reflect on.
        correction: 'The slide: ''Remember ultimately do not just describe; you must analyse and reflect!'' The events are the raw material, not the reflection.'
      - claim: Listing the challenges answers the challenges question.
        tempting: It does name the challenges.
        correction: 'The question has two halves: the challenges you encountered or observed, and how well you and the team handled them.'
      - claim: Adding how you felt turns description into reflection.
        tempting: Feelings are personal and subjective.
        correction: A feeling without explanation or lesson is still description; the questions ask what you learnt, what insights you gained and what you'd do differently.
    socratic:
      - ask: '''On Monday we met; on Wednesday we filmed; on Friday we submitted.'' What kind of writing is this?'
        hint: Analysis or description?
        answer: 'Pure description: it reports events but says nothing about learning, insight or change.'
      - ask: Which question would turn it into reflection?
        hint: Six on the slide.
        answer: 'For example: what do I now know that I didn''t before, or what would I do differently next time?'
      - ask: '''We rejected most ideas as soon as they were suggested.'' How could another Week 6 idea help you analyse it?'
        hint: The patterns of creative thinking.
        answer: Explain it as breaking 'defer judgement' while diverging, which likely cut the number of ideas, and say you would defer judgement next time.
      - ask: What else should you check your reflection against?
        hint: The final slide.
        answer: The criteria within the group project and the marking rubric.
    what-if:
      - change: Sami lists the four challenges his team faced and stops there.
        effect: He has answered only half the question; he must also say how well he and the team handled each, and, ideally, what he would do differently next time.
    boundary:
      - text: '''Finally, I would like to thank my teammates for all their hard work.'''
        why: 'Gracious, but not reflection: it answers none of the six questions.'
    transfer:
      - scenario: An intern's end-of-placement report lists every task she did each week, with dates.
        answer: 'It is description. To reflect, she should answer the six questions: what she learnt, what she now knows, her insights, the challenges and how well she handled them, and what she would do differently, relating them to theory where she can.'
    objections:
      - position: A detailed, accurate account of events is the heart of a good reflection.
        evidence: Reflection starts from experience, and the lecturer says it is about what happened, the dynamics, and what you did and achieved.
        objection: 'The slide insists: do not just describe; you must analyse and reflect. Every one of the six questions asks about learning, insight or change.'
    sources:
      - Marketing - Week 06 - Lecture Materials - Reflective Writing (file labelled Week 7 on iLearn) (slides 8)
      - Marketing - Week 09 - Lecture Transcript - Types and Models of Innovation, Reflective Writing (reflective-writing segment, reused recording)
  - concept: mgmt2094-w06-diverging-and-converging
    plain: 'Creative thinking has two patterns: diverging, where you generate many ideas without judging them, and converging, where you choose among them while staying open to what is new and exciting.'
    concrete: 'In the Week 6 tutorial the class becomes the new product development team for the Boring, Drab and Awful Floor Company and must develop 100 floor covering ideas in 10 minutes: diverging, with judgement deferred. Afterwards each team counts its ideas, discusses what helped it be more creative, picks its top 3 innovative ideas and reports one to the class: converging.'
    formal: 'Tutorial slide ''Patterns of Creative Thinking''. Diverging: defer judgement; look for lots of ideas; accept all ideas; make yourself ''stretch''; take time to ''simmer''; seek combination, bringing together odd combinations. Converging: look for what is really new; what gets people excited even if not very realistic; avoid premature closure; look at difficult issues or ''sneaky spots''; develop ''affirmative judgement''; keep your eyes on your objective.'
    analogy:
      text: 'Choosing a gift: first browse every shop and pile up options without ruling anything out; then narrow down to the one that will delight the person most, not just the safest.'
      maps:
        - from: browsing every shop, ruling nothing out
          to: 'diverging: lots of ideas, judgement deferred'
        - from: choosing what will delight
          to: 'converging: what gets people excited'
        - from: remembering who the gift is for
          to: keep your eyes on your objective
      limits:
        - A gift ends in one choice; the tutorial converges on a top three, and converging still avoids premature closure rather than grabbing the first good option.
    terms:
      - term: defer judgement
        gloss: 'The first diverging behaviour: do not evaluate ideas while you are generating them.'
      - term: premature closure
        gloss: Settling on an idea too early while converging; the slide says avoid it.
      - term: affirmative judgement
        gloss: 'The converging counterpart of ''defer judgement'': you now judge, while the column still asks you to value what is new and exciting.'
      - term: '''sneaky spots'''
        gloss: Difficult issues that a converging team should take the risk to look at.
    misconceptions:
      - claim: Converging means keeping only the realistic ideas.
        tempting: Converging narrows things down.
        correction: 'The slide: look at what gets people excited even if not very realistic, and look for what is really new; avoid premature closure.'
      - claim: Criticising each idea as soon as it is suggested is the fastest way to a good idea.
        tempting: It seems to save time on weak ideas.
        correction: While diverging the slide says defer judgement and accept all ideas; judging belongs to converging, which itself avoids premature closure.
      - claim: '''Bring together odd combinations'' is a converging move, since it finds what is new.'
        tempting: Combinations can produce something new.
        correction: 'The slide lists ''seek combination: bring together odd combinations'' under diverging.'
    socratic:
      - ask: Tom says 'that will never work' to each suggestion during the idea sprint. What is he breaking?
        hint: The first diverging behaviour.
        answer: 'Defer judgement: while diverging, accept all ideas and look for lots of them.'
      - ask: Stuck at 30 ideas, what could the team do?
        hint: Stretch; odd pairs.
        answer: Make itself 'stretch' and seek odd combinations, such as floor covering plus gears, or plus waves.
      - ask: After the sprint the team grabs the first workable idea. What has it neglected?
        hint: Closing too early.
        answer: Avoid premature closure; it should also look for what is really new and what excites people.
      - ask: Should it drop every idea that is not fully realistic?
        hint: '''Even if…'''
        answer: 'No: converging values what gets people excited even if not very realistic, while keeping its eyes on the objective.'
    what-if:
      - change: The team must choose one floor covering to pitch to the company's board tomorrow.
        effect: 'Converge as the slide says: look for what is really new and exciting, take the risk of looking at the ''sneaky spots'', avoid premature closure, and keep the objective, the pitch, in view.'
    boundary:
      - text: Picking the top 3 innovative ideas and reporting one to the class.
        why: 'Converging: choosing among the 100 ideas after diverging has generated them.'
      - text: 'Week 5''s acceptance finding: listing obstacles and contingency plans for a chosen solution.'
        why: 'Diverging late in a process: the solution is already chosen, but the Week 5 slides call listing ways to implement it a divergent activity.'
    transfer:
      - scenario: A council team has one hour to come up with ways to cut litter in a park and agree on two to trial.
        answer: 'Diverge first: defer judgement, accept all ideas, stretch and seek odd combinations. Then converge: look for what is really new and what excites people, even if not very realistic; look at the sneaky spots; avoid premature closure; keep the objective in view; pick two.'
    objections:
      - position: The fastest way to a good idea is to criticise every idea as soon as it is suggested.
        evidence: Early criticism weeds out weak ideas and seems to save time.
        objection: 'The tutorial slide separates the phases: diverge with judgement deferred and all ideas accepted, then converge, avoiding premature closure and developing ''affirmative judgement''.'
    sources:
      - Marketing - Week 06 - Tutorial Materials - Floor Company Exercise (slides 1, 4–5)
  - concept: mgmt2094-w06-creativity-tool
    plain: The creativity tool is four columns of prompts (Try to, Make it, Add or subtract, Imagine that you) applied to a product to force many genuinely different ideas quickly.
    concrete: 'The tutorial casts the class as the new product development team for the Boring, Drab and Awful Floor Company: 100 new floor covering ideas in 10 minutes, without just adding an adjective like ''soft'' or ''blue''. Applied in turn, ''add springs'' could give a floor covering with built-in springs that cushion each step, and ''imagine that you can make yourself smaller'' a floor showing tiny paths and landscapes from above.'
    formal: 'Tutorial slides: ''Your job is to develop 100 new floor covering, product ideas. Avoid just adding an adjective like "soft" or "blue". Use the creativity tool. Have fun and create energy! 10 minutes.'' The tool''s columns: Try to (slide it, dissolve it, compress it…); Make it (transparent, movable, sticky…); Add or subtract (springs, elastic, nets…); Imagine that you (can read minds, are the problem…).'
    terms:
      - term: creativity tool
        gloss: A grid of prompts in four columns, each applied to the product in turn to generate ideas.
      - term: just adding an adjective
        gloss: Changing only a surface quality ('soft', 'blue') rather than the product itself; the brief says avoid it.
      - term: new product development team
        gloss: The role the class plays for the Boring, Drab and Awful Floor Company.
    elements:
      - name: Try to
        test: 'Verbs applied to the product: slide, dissolve, compress, roll, stir, shake, spread, squeeze, separate, blend, slice, melt, stack, inflate, divide, pry, clamp it…'
        authorities:
          - mgmt2094-example-floor-company-exercise
      - name: Make it
        test: 'Properties: transparent, movable, sticky, flexible, spin, bounce, hot, cold, slippery, stretch, pop up, fly, flicker, foamy, explode…'
      - name: Add or subtract
        test: 'Elements: springs, elastic, traction, nets, filters, waves, vacuum, fiberglass, rubber, tension, gears, spirals, energy, power, time…'
      - name: Imagine that you
        test: 'Powers: can read minds, are the problem, can fly, have a magic wand, have unlimited money, can travel in time, can make yourself smaller…'
      - name: Debrief
        test: How many ideas do you have? What helped you be more creative? Pick your top 3 innovative ideas; report one to the class.
    misconceptions:
      - claim: '''A softer, bluer version of the current tile'' meets the brief.'
        tempting: It changes two things about the product.
        correction: 'Both changes are adjectives, the very thing the slide says to avoid: ''just adding an adjective like soft or blue''.'
      - claim: The task is to produce three polished floor covering concepts.
        tempting: The debrief asks for a top 3.
        correction: The task is 100 ideas in 10 minutes; picking the top 3 comes afterwards, in the debrief.
      - claim: '''Can travel in time'' is an ''Add or subtract'' prompt, since ''Time'' is listed there.'
        tempting: '''Time'' does appear in that column.'
        correction: '''Time'' is under Add or subtract, but ''Can travel in time'' is an ''Imagine that you'' prompt.'
    socratic:
      - ask: Why can't the team just list 'soft carpet, blue carpet, red carpet…'?
        hint: The brief's rule.
        answer: The slide says avoid just adding an adjective; each idea must change the product itself.
      - ask: How do you get 100 different ideas in 10 minutes, then?
        hint: Four columns.
        answer: 'Apply prompts from each column of the creativity tool to the floor covering in turn: try to…, make it…, add or subtract…, imagine that you…'
      - ask: Which pattern of creative thinking is the 10-minute sprint?
        hint: Lots of ideas.
        answer: 'Diverging: defer judgement, look for lots of ideas, accept all ideas.'
      - ask: What happens after the sprint?
        hint: The debrief slide.
        answer: 'Count the ideas, discuss what helped you be more creative, pick your top 3 innovative ideas and report one: converging.'
    what-if:
      - change: The team is asked for ideas for a school backpack instead of a floor covering.
        effect: 'The tool still works: apply each column to the backpack (inflate it, make it transparent, add springs, imagine you can fly), avoid just adding adjectives, then pick the top 3.'
    boundary:
      - text: '''Imagine that you can make yourself smaller'' leading to a floor that shows tiny paths and landscapes seen from above.'
        why: 'Valid: the prompt comes from ''Imagine that you'', and the idea changes the product rather than just adding an adjective.'
    transfer:
      - scenario: A café wants 50 new ideas for its takeaway cups from a 15-minute staff session.
        answer: 'Use the creativity tool: apply Try to (stack it, compress it), Make it (transparent, hot, cold), Add or subtract (filters, elastic) and Imagine that you (have a magic wand) to the cup in turn, avoid just adding adjectives, defer judgement, then pick the top three.'
    objections:
      - position: A tool of odd prompts like 'melt it' and 'read minds' wastes a product team's time.
        evidence: Many prompts are far from anything a factory could make.
        objection: The brief needs 100 ideas in 10 minutes without just adding adjectives; the prompts push changes to the product itself, and converging later values what excites people even if not very realistic.
    sources:
      - Marketing - Week 06 - Tutorial Materials - Floor Company Exercise (slides 2–4)
flows:
  - slug: should-this-go-in-my-reflection
    title: Should this go in my reflective paper, and how?
    summary: Takes one personal detail through the slides’ disclosure tests, then the tone, evidence and analysis checks, to decide whether and how to include it.
    start: n1
    concepts:
      - mgmt2094-w06-revealing-information-wisely
      - mgmt2094-w06-writing-a-reflective-paper
      - mgmt2094-w06-describe-analyse-reflect
    sources:
      - Marketing - Week 06 - Lecture Materials - Reflective Writing (file labelled Week 7 on iLearn) (slides 5–8)
      - Marketing - Week 09 - Lecture Transcript - Types and Models of Innovation, Reflective Writing (reflective-writing segment, reused recording)
    nodes:
      - id: n1
        kind: ask
        text: Is it appropriate to include?
        note: Instead of revealing everything about yourself, carefully ask yourself this before including anything.
        concept: mgmt2094-w06-revealing-information-wisely
        branches:
          - label: 'Yes'
            to: n2
          - label: 'No'
            to: n3
      - id: n2
        kind: ask
        text: Do you feel uncomfortable about including it?
        branches:
          - label: 'No'
            to: n6
          - label: 'Yes'
            to: n4
      - id: n3
        kind: end
        tone: not-met
        text: Leave it out.
      - id: n4
        kind: ask
        text: Did it change the final outcome of your experience?
        branches:
          - label: 'Yes'
            to: n5
          - label: 'No'
            to: n12
      - id: n5
        kind: step
        text: Include it, and indicate in your writing the concerns you have about revealing it.
        exception: true
        next: n6
      - id: n6
        kind: ask
        text: Does it involve someone who made things difficult for you?
        branches:
          - label: 'Yes'
            to: n7
          - label: 'No'
            to: n8
      - id: n7
        kind: step
        text: Describe their influence with detachment; don't drag them down.
        note: 'The lecturer: avoid badmouthing or accusing other people.'
        next: n8
      - id: n8
        kind: step
        text: Support the feeling with specific evidence, in a professional, academic tone.
        note: No slang or jargon, focused sentences, paragraphs; it is not a diary entry. Feelings should not come 'out of the blue'.
        concept: mgmt2094-w06-writing-a-reflective-paper
        next: n9
      - id: n9
        kind: ask
        text: 'Does it go beyond describing: what you learnt, or would do differently?'
        branches:
          - label: 'Yes'
            to: n11
          - label: No, it only tells what happened
            to: n10
      - id: n10
        kind: step
        text: 'Add the analysis: answer one of the ''questions to ask myself''.'
        note: What have I learnt? What do I now know? What insights have I gained? How well did we handle the challenges? What would I do differently? 'Do not just describe; you must analyse and reflect.'
        concept: mgmt2094-w06-describe-analyse-reflect
        next: n11
      - id: n11
        kind: end
        tone: met
        text: Include it, linked to your conclusion with a transitional phrase and to theory where you can.
      - id: n12
        kind: end
        tone: not-met
        text: Leave it out; the lecturer says it's fine not to share an uncomfortable personal feeling.
