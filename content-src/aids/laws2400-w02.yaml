unit: laws2400
week: 2
source: raw/laws2400-torts/week-02
generator: aids-1
aids:
  - concept: laws2400-w02-battery
    plain: Battery is a direct, deliberate or careless act that makes physical contact with another person's body without consent or other lawful justification. No injury is needed.
    concrete: In Rixon v Star City Pty Ltd (2001) 53 NSWLR 98, Rixon, who was excluded from the casino, was standing at a roulette table when an employee placed a hand on his shoulder, without force, to get his attention before telling him to come to an interview room. The Court of Appeal held this was not a battery — not because it lacked hostility, but because a touch to engage attention is generally acceptable in everyday life.
    formal: 'Battery is a direct and intentional or negligent act of the defendant which causes physical contact with the body of the plaintiff without consent or other lawful justification. Elements: a voluntary and positive act; direct interference; intentional or negligent contact; bodily contact (which may be through an object); and unlawful touching. Hostility is not required (Rixon v Star City).'
    analogy:
      text: Your body has an invisible fence around it. Anyone who crosses it without permission commits a wrong even if they break nothing — but the postman walking up the path is impliedly allowed.
      maps:
        - from: the invisible fence
          to: 'personal inviolability: every person''s body is inviolate'
        - from: crossing without permission
          to: touching without consent or other lawful excuse
        - from: breaking nothing
          to: 'actionable per se: no injury needed'
        - from: the postman on the path
          to: contact generally acceptable in everyday life, e.g. a tap on the shoulder
      limits:
        - 'A fence is fixed, but acceptable contact depends on context: the casebook notes conduct unacceptable between adults may be unremarkable between 13-year-old schoolboys.'
        - Crossing a fence needs your own body; battery can be committed through an object or substance (tear gas in Binsaris).
    terms:
      - term: Unlawful touching
        gloss: Contact beyond what is generally acceptable in the ordinary conduct of daily life, without consent or other lawful excuse. It need not be hostile (Rixon).
      - term: Personal inviolability
        gloss: Every person's body is inviolate, so any touching, however slight, may be a battery absent a lawful excuse (Collins v Wilcock, applied in Rixon).
      - term: Exigencies of everyday life
        gloss: Ordinary contacts — jostling in a crowd, a tap on the shoulder to get attention — that do not amount to unlawful touching.
      - term: Continuing act
        gloss: 'A failure to undo an earlier positive act, linked to it, can be one continuous positive act (Fagan: car left on an officer''s foot).'
    misconceptions:
      - claim: A touch is only a battery if it is angry or hostile.
        tempting: Old authority spoke of "the least touching of another in anger" (Cole v Turner), and the trial judge in Rixon relied on hostility.
        correction: 'Rixon v Star City: absence of anger or hostility is not a satisfactory basis for finding no battery. The test is whether the contact exceeds what is generally acceptable in everyday life.'
      - claim: For battery, the defendant's own body must touch the plaintiff.
        tempting: '"Hit, touch or push" suggests body-to-body contact.'
        correction: 'Contact through a weapon, a car or a substance is enough: in Binsaris v Northern Territory, tear gas touching the plaintiff''s eyes sufficed (Lecture 1, slide 10).'
      - claim: Every punch is both a battery and an assault.
        tempting: The two torts often occur in quick succession.
        correction: An unseen blow is a battery without an assault, because the plaintiff never apprehended it. Battery usually, but not always, involves assault (Lecture 1, slide 19).
    socratic:
      - ask: A police officer stands in a doorway and does nothing more. Is there a positive act?
        hint: Innes v Wylie.
        answer: No. Standing passively is not a battery; trespass needs a positive act.
      - ask: A driver accidentally rolls onto an officer's foot, then refuses to move for minutes when asked. Positive act?
        hint: 'Fagan: link the refusal to the driving.'
        answer: 'Yes. The failure to move had a nexus with the earlier positive act of driving onto the foot: one continuous positive act.'
      - ask: Must the defendant's body touch the plaintiff's?
        hint: 'Binsaris v Northern Territory: tear gas.'
        answer: No. Contact through a weapon, a car or a substance — tear gas reaching the plaintiff's eyes — is physical interference.
      - ask: Rixon was touched lightly, without anger, to get his attention. Why was there no battery?
        hint: What test replaced hostility?
        answer: The touch fell within contact generally acceptable in the ordinary conduct of daily life. Hostility is not the test.
      - ask: Who must prove the defendant's intention or negligence?
        hint: Slide 9, and its exception.
        answer: Except in highway cases, the defendant bears the onus of proving the act was neither intentional nor negligent.
    elements:
      - name: Voluntary and positive act
        test: A positive act, not passive presence (Innes v Wylie). A failure to undo an earlier positive act can be one continuous act (Fagan).
        cases:
          - innes-v-wylie
          - fagan-v-metropolitan-police-commissioner
      - name: Direct interference
        test: The contact must follow directly from the act; setting in motion a chain of events that ends in contact can be direct (Scott v Shepherd).
        cases:
          - scott-v-shepherd
      - name: Intentional or negligent
        test: Fault is required. Except in highway cases, the defendant must prove the act was neither intentional nor negligent.
      - name: Physical interference
        test: 'Contact with the plaintiff''s body: a hit, touch or push, or contact through a weapon, car or substance (tear gas in Binsaris).'
        cases:
          - binsaris-v-northern-territory
      - name: Unlawful touching
        test: No consent or other lawful excuse, and beyond what is generally acceptable in everyday life; hostility is not required (Rixon). Consent is a defence (Dean v Phung).
        cases:
          - rixon-v-star-city-pty-ltd
          - dean-v-phung
    what-if:
      - change: The casino employee had grabbed Rixon and spun him around, as Rixon claimed.
        effect: The trial judge rejected that account. If proved, it looks less like a touch to engage attention and more like physical restraint, which the casebook says is not generally acceptable — battery becomes arguable.
      - change: A surgeon operates without the patient's consent.
        effect: A positive, direct, intentional contact with no consent or lawful justification is unlawful touching, so battery is likely. Re F, quoted in Rixon, lists such surgery among contacts that may be unlawful without being hostile.
      - change: The punch comes from behind and the plaintiff never sees it.
        effect: Still a battery — contact is the gist — but no assault, because the plaintiff apprehended nothing before the blow landed.
    boundary:
      - text: Jostling in a busy supermarket or street.
        why: 'Outside battery: Collins v Wilcock, quoted in Rixon, places contact generally acceptable in daily life within a broad exception, sometimes explained as implied consent.'
      - text: A paper rocket flicked onto another person's arm (a lecture scenario).
        why: Contact through an object counts and no injury is needed, so it can be a battery — unless, in context, it is contact generally acceptable in everyday life.
    transfer:
      - scenario: At a concert, a security guard deliberately sprays a fan in the face with a hose to push the crowd back. Nearby, another fan taps a stranger on the shoulder to ask the time.
        answer: The spray is contact through a substance, like the tear gas in Binsaris, by a positive and intentional act; unless lawfully justified, it is battery, and no injury is needed. The shoulder tap is a touch to engage attention, generally acceptable in everyday life (Rixon), so it is not battery.
    sources:
      - Torts Topic 2 Lecture 1 (slides 6–12, 19)
      - 'Torts Week 2 Casebook: Rixon v Star City [49]–[55]'
      - Topic 2 Flowcharts - Trespass to the Person (Tort Law Principles 3e, pp 76-79) (pp 76–77)
  - concept: laws2400-w02-assault
    plain: Assault is deliberately making someone reasonably expect that unwanted physical contact is about to happen. No touching is needed, and fear is not required.
    concrete: In Zanker v Vartzokas (1988) 34 A Crim R 11, a girl accepted a lift in the defendant's van. After she declined his offer of money for sexual favours, he said he would take her to his mate's house, where the mate would "really fix you up". The harm lay at another place, later — but she was in his van, and the court held the threat sufficiently imminent in the circumstances.
    formal: Assault is a direct and intentional act by the defendant which creates in the plaintiff a reasonable apprehension of an imminent physical interference with their person. The intention is to cause apprehension, not to commit the battery (Rixon v Star City [56]–[59]). Apprehension is judged objectively; fear is unnecessary; words can suffice. Imminent need not mean immediate (Zanker v Vartzokas).
    terms:
      - term: Apprehension
        gloss: Anticipating physical contact in the expectation it will take place. Fear is not necessary; the test is what a reasonable person in the plaintiff's position would apprehend.
      - term: Imminence
        gloss: There must be at least the possibility of physical contact, and soon — but imminent does not necessarily mean immediate (Zanker v Vartzokas).
      - term: Conditional threat
        gloss: A threat of violence unless the plaintiff complies can be assault if it creates apprehension of imminent violence — but not if the defendant is entitled to use that force.
    misconceptions:
      - claim: Assault requires that the defendant intended to carry out the battery.
        tempting: A threat seems hollow if there was no plan to follow through.
        correction: The intention required is to cause apprehension of the battery, not to commit it (Rixon v Star City [56]–[59]). Pointing an unloaded gun can be assault.
      - claim: The plaintiff must have felt afraid.
        tempting: Being threatened usually feels like fear.
        correction: 'Fear is not necessary. The question is apprehension, tested objectively: would a reasonable person in the plaintiff''s position have apprehended the threat? (Lecture 1, slide 16).'
      - claim: '"Imminent" means the contact must be immediate.'
        tempting: In everyday speech, imminent and immediate sound the same.
        correction: 'Imminence does not necessarily mean immediate: in Zanker v Vartzokas, harm threatened at a later destination was imminent because she could not escape the van (slide 17).'
    socratic:
      - ask: In Zanker, when and where was the threatened harm to happen?
        hint: At his mate's house.
        answer: Later, at another place — not at that moment.
      - ask: Why was the threat still imminent?
        hint: Could she get away in the meantime?
        answer: She was in his van with no effective way out before the threat could be carried out, so imminence did not require immediacy.
      - ask: Did she need to be afraid?
        hint: Slide 16 on fear.
        answer: No. Only apprehension is required, and it must be one a reasonable person in her position would have.
      - ask: Did the defendant have to intend to carry out the threat?
        hint: Rixon v Star City [56]–[59].
        answer: No. He needed only to intend to create in her an apprehension of imminent harmful or offensive contact.
      - ask: Can words alone be enough?
        hint: Slide 16.
        answer: Yes, if they directly raise in the plaintiff's mind the apprehension of interference. Zanker's threat was spoken words.
    elements:
      - name: Positive act
        test: A positive act by the defendant, which may be mere words or a gesture.
      - name: Direct interference
        test: The apprehension must follow directly from the defendant's act.
      - name: Intentional act
        test: Intention to create apprehension of a battery, not to commit it (Rixon). The weight of Australian authority requires intention; but see the dicta in NSW v McMaster.
        cases:
          - rixon-v-star-city-pty-ltd
          - nsw-v-mcmaster
      - name: Reasonable apprehension of imminent contact
        test: Judged objectively; fear unnecessary; at least the possibility of contact. Imminent need not be immediate (Zanker v Vartzokas).
        cases:
          - zanker-v-vartzokas
      - name: No lawful justification
        test: The act must be without lawful justification.
    what-if:
      - change: The gun pointed at the plaintiff is unloaded, and she does not know it.
        effect: 'Still capable of being assault: the gist is the apprehension created. Rixon [56] says presenting an unloaded firearm is an assault unless the person it is pointed at knows it is empty.'
      - change: The threatening text ("I'm gonna get you fixed up!") comes from someone interstate with no way of reaching her for days.
        effect: 'Likely no assault: there must be at least the possibility of imminent physical contact, and nothing suggests the threat could be carried out soon.'
      - change: The fist is raised behind the plaintiff's back and she never sees it.
        effect: No assault, because no apprehension arises in her mind. If the punch then lands, it is battery without assault.
    boundary:
      - text: 'A conditional threat: "Leave or I''ll hit you."'
        why: Assault if it creates apprehension of imminent violence should she not comply — but not where the threatened force is force the defendant is entitled to use (flowchart p 78).
      - text: Assault committed negligently.
        why: 'Contested: the textbook flowchart frames fault as intention or negligence, but the lecture says the weight of Australian authority requires intention (see dicta in NSW v McMaster).'
    transfer:
      - scenario: A flatmate shouts through a locked bedroom door, "Hang up now or I'm coming in to smash that laptop over your head," while rattling the handle hard.
        answer: The words and the rattling are positive acts. If the flatmate intended to create apprehension, and a reasonable person in that position would apprehend imminent contact — the flatmate is metres away, trying to get in — assault is made out without any touching or fear. The conditional form does not prevent assault where apprehension of imminent violence arises.
    sources:
      - Torts Topic 2 Lecture 1 (slides 13–19)
      - 'Torts Week 2 Casebook: Rixon v Star City [56]–[59]'
      - Topic 2 Flowcharts - Trespass to the Person (Tort Law Principles 3e, pp 76-79) (p 78)
    verify: true
  - concept: laws2400-w02-false-imprisonment
    plain: False imprisonment is directly and totally restraining someone's freedom to move, deliberately or carelessly, without lawful justification. No walls or locks are needed.
    concrete: 'In Balmain New Ferry v Robertson (1906) 4 CLR 379, a passenger who missed his ferry wanted to leave the wharf, but was not allowed out without paying a further penny. The High Court held there was no false imprisonment: he had entered the wharf on that condition, so being kept until he paid had a lawful excuse.'
    formal: 'False imprisonment is the direct total restraint of the liberty of the plaintiff by an intentional or negligent act of the defendant without lawful justification. Restraint may be without physical boundaries (Symes v Mahon) and without the plaintiff''s knowledge (Meering v Graham-White Aviation). It must be total: no reasonable means of escape (Bird v Jones). Directing another to detain is direct (Coles Myer v Webster).'
    terms:
      - term: Total restraint
        gloss: Restraint with no reasonable means of escape (Bird v Jones). Danger, distance, time and the legality of an escape route bear on reasonableness.
      - term: Mental coercion
        gloss: Restraint by an assertion of authority or a threat rather than physical barriers; it can imprison as effectively as a locked door.
      - term: Lawful justification
        gloss: A legal basis for the detention — statutory or common law authority, or an accepted condition of entry — which defeats the claim.
      - term: Conditional entry
        gloss: Entry on terms, such as paying to leave; enforcing that condition is a lawful excuse (Balmain New Ferry v Robertson).
    misconceptions:
      - claim: There must be a locked door or physical barrier.
        tempting: '"Imprisonment" suggests a prison.'
        correction: 'No physical boundaries are needed: restraint may come from mental coercion, such as an assertion of authority or a threat (Symes v Mahon; flowchart p 79).'
      - claim: You cannot be falsely imprisoned without knowing it.
        tempting: The harm seems to lie in the experience of being trapped.
        correction: A plaintiff may be falsely imprisoned even without knowing it at the time (Meering v Graham-White Aviation; Lecture 1, slide 20).
      - claim: A reasonable but mistaken belief that the detention was lawful is a defence.
        tempting: The defendant acted honestly and sensibly.
        correction: An intentional imprisonment may give rise to liability even if the defendant reasonably but mistakenly believed they were acting lawfully (Lecture 1, slide 24).
    socratic:
      - ask: In Balmain, was there any way for the passenger to leave the wharf?
        hint: On what terms?
        answer: Yes — by paying the penny. So the question became whether insisting on that condition was lawful.
      - ask: Why was the condition a lawful excuse?
        hint: On what terms did he enter?
        answer: He entered on the condition of paying to leave. A conditional entry is a lawful excuse, so there was no false imprisonment.
      - ask: If he could have left by another safe route, would the restraint be total?
        hint: Bird v Jones.
        answer: No. Restraint must be total, with no reasonable means of escape; a partial obstruction is not false imprisonment.
      - ask: A store manager tells a guard to lock a suspect in a room. Is the manager's act direct?
        hint: Coles Myer v Webster.
        answer: Yes. Directing, promoting or causing another person to detain the plaintiff is a direct act.
      - ask: The guard reasonably but wrongly believed the detention lawful. Does that help him?
        hint: Slide 24.
        answer: No. An intentional imprisonment can attract liability despite a reasonable but mistaken belief in its lawfulness.
    elements:
      - name: Positive act
        test: The defendant must do a positive act.
      - name: Direct interference
        test: The imprisonment must be the direct result of the act; directing, promoting or causing another to detain the plaintiff counts (Coles Myer v Webster).
      - name: Intentional or negligent act
        test: Intention or negligence. A reasonable but mistaken belief in a right to detain does not excuse an intentional imprisonment.
      - name: Total restraint of liberty
        test: No reasonable means of escape (Bird v Jones). Restraint may be by mental coercion, without barriers (Symes v Mahon), even without the plaintiff knowing (Meering).
      - name: Without lawful justification
        test: Lawful authority, by statute or common law, is fatal to the claim (Ruddock v Taylor), as is an accepted condition of entry (Balmain New Ferry v Robertson).
        cases:
          - ruddock-v-taylor
          - balmain-new-ferry-v-robertson
    what-if:
      - change: The exit fee was first imposed after the passenger was inside, not as a condition of entry.
        effect: Balmain's lawful excuse rested on a condition of entry; a condition added afterwards is much less likely to justify refusing exit.
      - change: The only way out is a dangerous, unlit crawlspace.
        effect: 'The restraint can still be total: a route that is unreasonable to use — given danger, distance, time or legality — is not a reasonable means of escape (flowchart p 79).'
      - change: The employer bluffs that the employee will be arrested if she leaves the meeting room, and she stays.
        effect: An assertion of authority can be total restraint without any physical barrier, so false imprisonment is arguable, subject to whether a reasonable means of escape existed.
    boundary:
      - text: One route is blocked but others remain open and safe.
        why: 'Outside the tort: restraint must be total, with no reasonable means of escape (Bird v Jones).'
      - text: A sedated patient kept in a room by a guard, never realising it.
        why: 'Inside the tort: a plaintiff may be falsely imprisoned without knowing of it at the time (Meering v Graham-White Aviation).'
    transfer:
      - scenario: A gym's staff mistakenly set the turnstiles to lock an hour early. A member training late is trapped inside for an hour; there is no other way out.
        answer: Setting the lock is a positive act that directly restrains the member; with no reasonable means of escape the restraint is total, and false imprisonment can be committed negligently. No touching or threat is needed. Unless there is lawful justification, such as a condition of entry, the claim is made out.
    sources:
      - Torts Topic 2 Lecture 1 (slides 20–24)
      - Topic 2 Flowcharts - Trespass to the Person (Tort Law Principles 3e, pp 76-79) (p 79)
  - concept: laws2400-w02-action-on-the-case-intentional-harm
    plain: 'When harm is indirect, an action on the case may lie: for a prosecution brought maliciously without proper cause, or for deliberately or recklessly causing someone physical or psychiatric injury.'
    concrete: In Wilkinson v Downton [1897] 2 QB 57 the defendant, as a practical joke, told the plaintiff her husband had been "smashed up" in an accident. The false news caused her nervous shock. There was no touching, so no battery; the court held that a cause of action lies for wilfully doing an act calculated to cause physical harm, which actually causes it.
    formal: 'Malicious prosecution: the defendant initiated proceedings against the plaintiff; they terminated in the plaintiff''s favour; the defendant acted maliciously and without reasonable and probable cause; plus damage to life, liberty, reputation or property (A v New South Wales). Intentional infliction of personal injury: wilfully doing an act calculated to cause physical harm, and causing it (Wilkinson v Downton); reckless indifference suffices (Nationwide News v Naidu).'
    terms:
      - term: Malice
        gloss: 'The positive element of malicious prosecution: acting for a purpose that is not legitimate (A v New South Wales).'
      - term: Reasonable and probable cause
        gloss: Its absence is a separate, negative element of malicious prosecution, tested both subjectively and objectively (A v New South Wales).
      - term: Calculated to cause harm
        gloss: 'Wilkinson v Downton''s test. Nationwide News v Naidu: actual subjective intention is not required — reckless indifference to the result suffices.'
    misconceptions:
      - claim: Proving malice is enough for malicious prosecution.
        tempting: Malice sounds like the heart of the tort.
        correction: 'A v New South Wales: malice (positive) and absence of reasonable and probable cause (negative, tested subjectively and objectively) are distinct and both must be proved, with favourable termination and damage.'
      - claim: Under Wilkinson v Downton the defendant must actually have wanted to cause harm.
        tempting: '"Wilfully" and "calculated" sound like actual intent.'
        correction: 'Nationwide News v Naidu: an actual subjective intention is not required — reckless indifference to the result will suffice (Lecture 1, slide 30).'
      - claim: Like trespass, malicious prosecution needs no proof of damage.
        tempting: Both protect the person and liberty.
        correction: Malicious prosecution is an action on the case, so there must be damage to life, liberty, reputation or property (slide 27). Only trespass is actionable per se.
    socratic:
      - ask: In Wilkinson v Downton, did the defendant touch the plaintiff?
        hint: What caused her harm?
        answer: No. The harm came from a false statement — indirect, so there was no battery.
      - ask: Why might neither trespass nor negligence give her an adequate remedy?
        hint: Trespass needs directness; what does negligence need?
        answer: Trespass needs a direct interference, and negligence needs a duty of care. This tort fills that gap for intentional but indirect injury.
      - ask: What must she show the defendant did?
        hint: Wilkinson's formula.
        answer: Wilfully did an act calculated to cause physical harm to her, and actually caused such harm.
      - ask: Must the defendant have actually meant to injure her?
        hint: 'Nationwide News v Naidu: workplace bullying.'
        answer: No. Reckless indifference to the result suffices; an actual subjective intention is not required.
      - ask: A detective, feeling pressured, initiates a prosecution (A v New South Wales). What must the person prosecuted prove?
        hint: Four elements, plus one more because it is an action on the case.
        answer: Initiation; termination in her favour; malice; absence of reasonable and probable cause — and damage to life, liberty, reputation or property.
    elements:
      - name: 'Malicious prosecution: initiation'
        test: The defendant initiated proceedings against the plaintiff.
      - name: 'Malicious prosecution: favourable termination'
        test: The proceedings terminated in the plaintiff's favour.
      - name: 'Malicious prosecution: malice'
        test: The defendant acted maliciously — e.g. for a non-legitimate purpose. A distinct, positive element (A v New South Wales).
        cases:
          - a-v-new-south-wales
      - name: 'Malicious prosecution: no reasonable and probable cause'
        test: A distinct, negative element, tested both subjectively and objectively (A v New South Wales).
        cases:
          - a-v-new-south-wales
      - name: 'Malicious prosecution: damage'
        test: As an action on the case, damage to the plaintiff's life, liberty, reputation or property.
      - name: 'Intentional injury: calculated act'
        test: A wilful act calculated to cause physical harm (Wilkinson v Downton); reckless indifference to the result suffices (Nationwide News v Naidu).
        cases:
          - wilkinson-v-downton
          - nationwide-news-v-naidu
      - name: 'Intentional injury: actual harm'
        test: The act actually caused the harm — nervous shock in Wilkinson; major depression and PTSD in Naidu.
        cases:
          - wilkinson-v-downton
          - nationwide-news-v-naidu
    what-if:
      - change: The defendant had a grudge but genuinely and reasonably believed, on the evidence, that the plaintiff was guilty.
        effect: Malice may be shown, but absence of reasonable and probable cause is a separate element; a reasonable, genuine belief in guilt points against it, so the claim may fail (A v New South Wales).
      - change: In Wilkinson, the joker did not want to harm her but did not care whether the news would.
        effect: 'Still within the tort on Nationwide News v Naidu: reckless indifference to the result suffices without an actual subjective intention.'
      - change: The prosecution ended in the plaintiff's conviction.
        effect: 'Malicious prosecution fails: the proceedings must have terminated in the plaintiff''s favour.'
    boundary:
      - text: 'Wilkinson v Downton itself: was there really an intention to cause harm?'
        why: The lecture asks this. A practical joker may not want harm, yet his act was "calculated" to cause it; Naidu later held reckless indifference is enough.
      - text: Extreme bullying by a superior at work (Nationwide News v Naidu).
        why: 'Inside the tort: indirect harm with no touching, causing major depression and PTSD, with reckless indifference sufficing for the fault element.'
    transfer:
      - scenario: After a fence dispute, a neighbour texts a woman a fake message that her son has been badly hurt; she suffers a diagnosed psychiatric injury. He also reports her to police for a theft he knows she did not commit; the charges are dropped.
        answer: 'The fake message is indirect harm without touching: intentional infliction of personal injury if the act was calculated to cause harm, or done with reckless indifference (Naidu), and caused it (Wilkinson v Downton). The false report: malicious prosecution — he procured proceedings that ended in her favour, with malice and without reasonable and probable cause — provided she proves damage to reputation, liberty or property.'
    sources:
      - Torts Topic 2 Lecture 1 (slides 25–30)
  - concept: laws2400-w02-remedies-intentional-torts-to-person
    plain: For intentional torts to the person the usual remedy is damages — nominal, compensatory, aggravated or exemplary — and sometimes an injunction to stop a threatened tort from happening.
    formal: Damages are the most common remedy for intentional interference with the person; in suitable cases an injunction may prevent an anticipated tort (e.g. battery). Damages may be nominal (no harm or damage caused), compensatory (the position had the wrong not occurred), aggravated (deliberate conduct resulting in an affront to the plaintiff) and/or exemplary (to punish particularly egregious conduct).
    analogy:
      text: 'A receipt with separate lines: one for what was broken (compensatory), one for the insult of how it was done (aggravated), and a fine on top for outrageous conduct (exemplary). If nothing was broken, the receipt still records the wrong with a token sum (nominal).'
      maps:
        - from: the line for what was broken
          to: compensatory damages for the actual loss
        - from: the line for the insult
          to: aggravated damages for an affront caused by deliberate conduct
        - from: the fine on top
          to: exemplary damages to punish egregious conduct
        - from: the token sum
          to: nominal damages where no harm was caused
      limits:
        - A receipt only records the past; an injunction looks forward, to stop an anticipated tort.
        - A fine goes to the state; exemplary damages are paid to the plaintiff, though their purpose is to punish.
    terms:
      - term: Nominal damages
        gloss: A token award where the tort is made out but no harm or damage was caused — possible because trespass to the person is actionable per se.
      - term: Aggravated damages
        gloss: Awarded for the defendant's deliberate conduct that resulted in an affront to the plaintiff, beyond the physical or economic loss.
      - term: Exemplary damages
        gloss: Awarded to punish the defendant where the conduct was particularly egregious, rather than to compensate the plaintiff.
      - term: Injunction
        gloss: A court order that, in suitable cases, prevents an anticipated tort — such as a threatened battery — from taking place.
    misconceptions:
      - claim: If no harm was caused, no damages can be awarded.
        tempting: Damages usually compensate a loss.
        correction: Trespass to the person is actionable per se. Where no harm or damage was caused, nominal damages are likely (Lecture 1, slide 32).
      - claim: Aggravated and exemplary damages are the same thing.
        tempting: Both respond to bad conduct by the defendant.
        correction: Aggravated damages respond to deliberate conduct that results in an affront to the plaintiff; exemplary damages "punish" particularly egregious conduct (slide 32).
      - claim: Only one head of damages can be awarded for a tort.
        tempting: One wrong seems to deserve one award.
        correction: 'Damages may be nominal, compensatory and aggravated and/or exemplary: different heads address different aspects of the wrong and can be combined (slide 32).'
    socratic:
      - ask: D says he will hit P at next week's event. Nothing has happened yet. What can P ask for?
        hint: Can damages stop a future wrong?
        answer: An injunction, which in suitable cases can prevent an anticipated tort such as a battery from taking place.
      - ask: D lightly touches P's arm without consent, causing no pain or distress. If that is a battery, what damages follow?
        hint: Was there any real harm?
        answer: 'Nominal damages: the tort is made out (actionable per se), but no harm or damage was caused.'
      - ask: D's push breaks P's wrist and she misses work. Which head covers that?
        hint: Restore her position.
        answer: Compensatory damages, putting P in the position she would have been in had the wrong not occurred.
      - ask: D did it deliberately, to humiliate P in front of colleagues. Anything more?
        hint: An affront to the plaintiff.
        answer: Aggravated damages, for deliberate conduct resulting in an affront to P, on top of compensatory damages.
      - ask: The conduct was flagrant and outrageous. What further purpose could an award serve?
        hint: Not compensation at all.
        answer: Exemplary damages, to punish the defendant for particularly egregious conduct.
    what-if:
      - change: The battery caused no harm at all.
        effect: Liability still exists, because trespass is actionable per se, but damages are likely to be nominal.
      - change: The defendant acted deliberately in a way designed to humiliate the plaintiff.
        effect: Aggravated damages become relevant, for the affront caused by the deliberate conduct, in addition to compensatory damages for the loss.
      - change: The tort has not happened yet but is threatened.
        effect: Damages cannot prevent it; in a suitable case the plaintiff may seek an injunction to stop the anticipated tort.
    boundary:
      - text: No apology after a minor, harmless, non-malicious touch.
        why: 'Short of aggravated damages: these need deliberate conduct resulting in an affront; with no real harm or affront, nominal damages fit.'
    transfer:
      - scenario: To amuse a queue of onlookers, a bouncer deliberately throws a patron to the ground outside a club, bruising her and humiliating her. He later boasts about it online and threatens to do it again.
        answer: 'Once battery is established: compensatory damages for the bruising and any losses; aggravated damages because his deliberate conduct resulted in an affront to her; and, if the court finds the conduct particularly egregious, exemplary damages to punish him. Given the threat to repeat it, she could seek an injunction to prevent the anticipated tort.'
    sources:
      - Torts Topic 2 Lecture 1 (slides 31–32)
  - concept: laws2400-w02-trespass-to-goods
    plain: Trespass to goods is directly interfering with a chattel that someone possesses at the time. What counts is possession, not ownership, and no damage need be proved.
    concrete: 'Penfolds sold wine in bottles embossed "This bottle is the property of Penfolds Wines Ltd". Elliott, who sold bulk wine to customers bringing their own bottles, filled Penfolds bottles that his brother had left with him. Penfolds sued in trespass. The High Court held there was no trespass to goods: Penfolds did not possess the bottles when Elliott used them — Elliott did (Penfolds Wines v Elliott (1946) 74 CLR 204).'
    formal: 'Trespass to chattels requires a direct interference with chattels in the possession of the plaintiff at the time of the interference; being trespass, no proof of actual damage is generally required. Possession differs from ownership and has two elements: intention to exercise control and exclude others, and actual control. A bailee''s possession bars the bailor''s trespass claim, save exceptions such as destruction (Penfolds Wines v Elliott).'
    analogy:
      text: 'Possession is like holding the TV remote: whoever has it in hand and means to keep control is "in possession", even if the TV belongs to someone else.'
      maps:
        - from: having the remote in hand
          to: actual control
        - from: meaning to keep control of it
          to: intention to exercise control and exclude others
        - from: the TV's owner sitting elsewhere
          to: an owner (bailor) who is not in possession and cannot sue in trespass
      limits:
        - A finder or occupier can have possession in law of things she does not even know are on her premises (NCA v Flack) — no hand on the remote needed.
        - Legal possession can run down a chain of bailments (Penfolds), which a picture of one person holding one remote hides.
    terms:
      - term: Chattel
        gloss: Goods that are tangible, movable, visible, physically possessable and transferable by delivery — pets, cars, phones, artwork — but not fixtures attached to land.
      - term: Possession
        gloss: Intention to exercise control and exclude others, plus actual control. Different from ownership, and essential to trespass to goods.
      - term: Bailment
        gloss: Goods held by a bailee for a bailor. The bailee has possession, so the bailor generally cannot sue in trespass (Dixon J, Penfolds).
      - term: Finder
        gloss: A finder or occupier can have possession in law of chattels on the premises, good against everyone except the true owner (NCA v Flack).
    misconceptions:
      - claim: The owner can always sue in trespass to goods.
        tempting: Ownership looks like the strongest right to goods.
        correction: 'Trespass protects possession, not ownership: Penfolds owned the bottles but was not in possession when Elliott used them, so its trespass claim failed (Penfolds Wines v Elliott).'
      - claim: Moving someone's bike and putting it back undamaged is not a tort.
        tempting: Nothing was lost or harmed.
        correction: Trespass to goods needs a direct interference with a possessed chattel; since it is trespass, no proof of actual damage is generally required (Lecture 2, slide 6).
      - claim: A finder has no rights in what she finds.
        tempting: The thing belongs to someone else.
        correction: 'NCA v Flack: Mrs Flack had possession in law of all chattels on her premises, even ones she did not know of — possessory rights against all except the true owner.'
    socratic:
      - ask: In Penfolds, who owned the bottles?
        hint: Read the embossing.
        answer: Penfolds. The bottles said so, and customers bought only the wine.
      - ask: Who had the bottles when Elliott filled them?
        hint: 'Follow the chain: Penfolds, the brother, Elliott.'
        answer: Elliott, who was left them by his brother. Dixon J treated Penfolds as bailor and the brother as bailee; bailment can continue in chains.
      - ask: So why did the trespass claim fail?
        hint: What does trespass to goods protect?
        answer: Possession. Penfolds was not in possession at the time of the interference, so it had no title to sue in trespass.
      - ask: Can a bailor ever sue a bailee in trespass?
        hint: Dixon J's exception.
        answer: Yes, for example where the bailee completely destroys the goods.
      - ask: If trespass fails for lack of possession, is the owner left without a remedy?
        hint: The next tort on the slides.
        answer: No. Conversion can be brought on a right to immediate possession, and the majority in Penfolds found conversion.
    elements:
      - name: Chattel
        test: Tangible, movable, visible goods, physically possessable and transferable by delivery; not fixtures permanently attached to land.
      - name: Plaintiff's possession at the time
        test: Intention to control and exclude others, plus actual control, at the moment of interference. A bailee has it (Penfolds); so may a finder or occupier (NCA v Flack).
        cases:
          - penfolds-wines-pty-ltd-v-elliott
          - national-crime-authority-v-flack
      - name: Direct interference
        test: A direct interference with the chattel. No proof of actual damage is generally required.
      - name: Defences
        test: The usual defences, such as consent and lawful authority, apply (Topic 4).
    what-if:
      - change: Penfolds still held the bottles in its own warehouse when Elliott took and filled them.
        effect: Penfolds would then be in possession at the time of the interference, so the direct interference could be trespass to goods, without proof of damage.
      - change: Elliott's brother, as bailee, had completely destroyed the bottles.
        effect: 'Dixon J''s exception: a bailor may sue in trespass where the bailee completely destroys the goods.'
      - change: The thing interfered with is a shed permanently fixed to the land.
        effect: 'Not a chattel: fixtures such as buildings or equipment permanently attached to land are excluded, so trespass to goods does not fit.'
    boundary:
      - text: Bitcoin, domain names and digital files.
        why: 'At the edge: chattels are tangible and transferable by delivery, so whether intangibles should be protected as chattels is left as an open question.'
      - text: A dead body; stored sperm.
        why: Generally there is no property in a dead body (the lecture notes an Egyptian mummy exception), but stored sperm may be protected as a chattel.
    transfer:
      - scenario: A student lends her laptop to a housemate for the weekend. While the housemate has it, a visitor picks it up and uses it without asking, then puts it back unharmed.
        answer: Trespass to goods protects possession. The housemate, as bailee with actual control, is in possession and can sue the visitor for this direct interference without proving damage. The owner, not in possession at the time, generally could not sue in trespass (Penfolds), though conversion needs only a right to immediate possession.
    sources:
      - Topic 2 Lecture 2 (slides 2–11)
      - 'Torts Week 2 Casebook: Penfolds Wines v Elliott'
  - concept: laws2400-w02-conversion-and-detinue
    plain: Conversion is seriously dealing with someone's goods as if they were yours; detinue is wrongfully refusing to hand goods back after a clear demand. Neither needs the plaintiff to have the goods.
    concrete: 'In Bunnings Group Ltd v CHEP Australia Ltd (2011) NSWCA 342, Bunnings used timber pallets belonging to CHEP. Storing or displaying goods on the pallets as they were delivered was held not to be conversion. But using empty pallets to transport Bunnings'' own goods was conversion: a serious dealing asserting dominion contrary to CHEP''s rights. The case shows the fine judgment required.'
    formal: 'Conversion, which grew from the action on the case of trover, is a wrongful dealing with goods inconsistent with the plaintiff''s possessory rights: serious, and an assertion of dominion; strict liability. Title: possession or a right to immediate possession, with some proprietary title (Hocking v Director General of the National Archives). Detinue: right to immediate possession, a clear demand and a wrongful refusal; the court may order return.'
    analogy:
      text: A borrowed car. Moving it a few metres to repark it is like trespass; selling it or using it as your own delivery van is like conversion; refusing to give it back when the owner clearly asks is like detinue.
      maps:
        - from: reparking the car
          to: mere interference with goods (trespass)
        - from: selling it or using it as your own
          to: a serious dealing asserting dominion (conversion)
        - from: refusing to return it on a clear request
          to: demand and wrongful refusal (detinue)
      limits:
        - The car picture makes the line look sharp; in Penfolds the judges split on whether using the bottles was serious enough.
        - 'It hides title to sue: someone relying only on a hire contract may lack the proprietary title conversion needs (Hocking).'
    terms:
      - term: Conversion
        gloss: A serious dealing with goods amounting to an assertion of dominion contrary to the rights of the person entitled to possession; strict liability.
      - term: Dominion
        gloss: The owner's control over goods. Conduct inconsistent with it — sale, taking possession, inconsistent use, refusing a demand — can be conversion.
      - term: Right to immediate possession
        gloss: Enough for conversion (with some proprietary title) and for detinue, but not for trespass, which needs actual possession.
      - term: Detinue
        gloss: The tort of wrongful detention of chattels; unique in that the court may, in its discretion, order the goods returned.
    misconceptions:
      - claim: Acting in good faith is a defence to conversion.
        tempting: An honest auctioneer who sells goods by mistake seems blameless.
        correction: 'Conversion is a tort of strict liability: good faith or mistake, e.g. by an auctioneer, is no defence (Lecture 2, slide 12).'
      - claim: Any handling of another person's goods is conversion.
        tempting: Any use seems inconsistent with the owner's rights.
        correction: The interference must be serious, an assertion of dominion. In Bunnings, storing goods on CHEP's pallets as delivered was not conversion; transporting Bunnings' own goods on them was.
      - claim: Only an owner in possession can sue in detinue.
        tempting: Getting the goods back sounds like an owner's remedy.
        correction: Detinue needs at least a right to immediate possession, a demand and a wrongful refusal; no actual possession or ownership is required (Lecture 2, slide 20).
    socratic:
      - ask: Penfolds lacked possession, so trespass failed. Why could it still sue in conversion?
        hint: What title does conversion need?
        answer: A right to immediate possession suffices for conversion, and Penfolds, as owner, had it.
      - ask: What did Elliott do that the majority called conversion?
        hint: How did he treat the bottles?
        answer: He used them in his trade, filling them with his own wine — a dealing inconsistent with Penfolds' dominion as owner.
      - ask: Why did Dixon J disagree?
        hint: Was the use serious enough?
        answer: He called the use temporary and harmless, not serious enough for conversion — showing that seriousness is debatable.
      - ask: A hirer relies only on her hire contract to sue in conversion. Is that enough?
        hint: Hocking v Director General of the National Archives.
        answer: No. A merely contractual or custodial right to possession will not suffice; some proprietary title is needed.
      - ask: The owner simply wants her particular goods back. Which tort?
        hint: Which one lets the court order return?
        answer: 'Detinue: after a clear demand and a wrongful refusal, the court may, in its discretion, order the chattel returned.'
    elements:
      - name: 'Conversion: title to sue'
        test: Possession, or a right to immediate possession, when the wrongful act was done — with some proprietary title, not a merely contractual or custodial right (Hocking).
        cases:
          - hocking-v-director-general-of-the-national-archives-of-australia
      - name: 'Conversion: serious dealing'
        test: 'A serious interference asserting dominion contrary to the possessor''s rights: sale, taking possession, inconsistent use (Penfolds), or refusing an unconditional demand (Bunnings).'
        cases:
          - penfolds-wines-pty-ltd-v-elliott
          - bunnings-group-ltd-v-chep-australia-ltd
      - name: 'Detinue: right to immediate possession'
        test: At least a right to immediate possession; no actual possession or ownership is required.
      - name: 'Detinue: demand'
        test: A written or oral demand giving specific, clear and unequivocal instructions about delivery of the goods.
      - name: 'Detinue: wrongful refusal'
        test: An express refusal to deliver. A reasonable refusal, e.g. while verifying the plaintiff's entitlement, may not be wrongful.
    what-if:
      - change: Bunnings had only stored goods on CHEP's pallets as they were delivered.
        effect: 'Not conversion: the court held that use was not a sufficiently serious interference; only transporting Bunnings'' own goods on empty pallets was.'
      - change: The defendant refuses to return the goods only while checking whether the claimant is really entitled to them.
        effect: 'Detinue may fail: a refusal that is reasonable, such as one made to verify entitlement, may not be wrongful.'
      - change: The plaintiff's only right to the goods comes from a hire contract.
        effect: 'Conversion fails for want of title: Hocking requires some proprietary title, not merely a contractual or custodial right to possession.'
    boundary:
      - text: 'Penfolds: filling another''s bottles with your own wine.'
        why: 'On the line: the majority found conversion (use inconsistent with the owner''s dominion), but Dixon J thought the use temporary and harmless — not serious enough.'
      - text: Selling goods you do not own.
        why: 'Conversion: sale asserts dominion over the goods, although the purchaser will not generally get good legal title.'
    transfer:
      - scenario: A hire company supplies 100 branded chairs for a wedding. Afterwards the venue keeps them and rents them to other clients. The company emails a clear demand to collect them on Friday; the venue replies, "They're ours now."
        answer: 'Renting the chairs out is a serious dealing asserting dominion inconsistent with the hire company''s rights: conversion, on its right to immediate possession as owner, and good faith would be no defence. The clear demand and express refusal also found detinue, which lets the court, in its discretion, order the chairs returned.'
    sources:
      - Topic 2 Lecture 2 (slides 12–21)
      - 'Torts Week 2 Casebook: Penfolds Wines v Elliott'
flows:
  - slug: trespass-to-the-person
    title: Is there a trespass to the person — battery, assault or false imprisonment?
    summary: Takes the general principles common to all three torts, then the elements of whichever tort the interference points to.
    start: p1
    concepts:
      - laws2400-w02-battery
      - laws2400-w02-assault
      - laws2400-w02-false-imprisonment
      - laws2400-w02-action-on-the-case-intentional-harm
    sources:
      - Topic 2 Flowcharts - Trespass to the Person (Tort Law Principles 3e, pp 76-79) (pp 76–79)
      - Torts Topic 2 Lecture 1 (slides 6–24)
    nodes:
      - id: p1
        kind: ask
        text: Did the defendant do a voluntary, positive act?
        note: Standing passively is no battery (Innes v Wylie). A failure to undo an earlier positive act can be one continuous act (Fagan). Words or a gesture can be the act in assault.
        cases:
          - innes-v-wylie
          - fagan-v-metropolitan-police-commissioner
        branches:
          - label: 'Yes'
            to: p2
          - label: 'No'
            to: px
      - id: p2
        kind: ask
        text: Did the interference follow directly from the act?
        note: Setting in motion a chain of events can be direct (Scott v Shepherd); so can directing or causing another person to detain the plaintiff (Coles Myer v Webster).
        cases:
          - scott-v-shepherd
        branches:
          - label: 'Yes'
            to: p3
          - label: No, the harm was indirect
            to: pc
      - id: pc
        kind: end
        tone: qualified
        text: Not trespass. Consider an action on the case — malicious prosecution or intentional infliction of personal injury — where damage must be proved.
        concept: laws2400-w02-action-on-the-case-intentional-harm
      - id: p3
        kind: ask
        text: What did the act do to the plaintiff?
        note: 'All three torts are actionable per se: no damage need be proved. Fault: except in highway cases the defendant must disprove intention or negligence.'
        branches:
          - label: Touched her body
            to: b1
          - label: Made her expect imminent contact
            to: a1
          - label: Totally restrained her movement
            to: f1
      - id: b1
        kind: ask
        text: Was the contact unlawful — without consent or other lawful excuse, and beyond what is generally acceptable in everyday life?
        note: 'Hostility is not required (Rixon v Star City). Contact through an object or substance counts (Binsaris: tear gas). Jostling in a crowd or a tap for attention is not unlawful.'
        concept: laws2400-w02-battery
        cases:
          - rixon-v-star-city-pty-ltd
          - binsaris-v-northern-territory
        branches:
          - label: 'Yes'
            to: bm
          - label: 'No'
            to: px
      - id: bm
        kind: end
        tone: met
        text: Battery, unless the defendant proves the contact was neither intentional nor negligent.
      - id: a1
        kind: ask
        text: Would a reasonable person in the plaintiff's position have apprehended imminent harmful or offensive contact?
        note: Fear is not necessary; words alone can suffice. Imminent need not mean immediate (Zanker v Vartzokas), but there must be at least the possibility of contact.
        concept: laws2400-w02-assault
        cases:
          - zanker-v-vartzokas
        branches:
          - label: 'Yes'
            to: a2
          - label: 'No'
            to: px
      - id: a2
        kind: ask
        text: Did the defendant intend to create that apprehension?
        note: Intention to cause apprehension, not to carry out the battery (Rixon v Star City). The weight of Australian authority requires intention (but see dicta in NSW v McMaster).
        cases:
          - rixon-v-star-city-pty-ltd
          - nsw-v-mcmaster
        branches:
          - label: 'Yes'
            to: am
          - label: 'No'
            to: px
      - id: am
        kind: end
        tone: met
        text: Assault, unless there is a lawful justification.
      - id: f1
        kind: ask
        text: Was the restraint total — with no reasonable means of escape?
        note: 'No walls needed: mental coercion or an assertion of authority can restrain (Symes v Mahon), even without the plaintiff knowing (Meering). Partial obstruction is not enough (Bird v Jones).'
        concept: laws2400-w02-false-imprisonment
        branches:
          - label: 'Yes'
            to: f2
          - label: 'No'
            to: px
      - id: f2
        kind: ask
        text: Was there a lawful justification, such as lawful authority or an accepted condition of entry?
        note: 'Balmain New Ferry v Robertson: paying to leave the wharf was a condition of entry. A reasonable but mistaken belief in a right to detain is not a justification.'
        cases:
          - balmain-new-ferry-v-robertson
          - ruddock-v-taylor
        exception: true
        branches:
          - label: 'Yes'
            to: px
          - label: 'No'
            to: fm
      - id: fm
        kind: end
        tone: met
        text: False imprisonment, unless the defendant proves the restraint was neither intentional nor negligent.
      - id: px
        kind: end
        tone: not-met
        text: This trespass to the person is not made out on these facts.
  - slug: interference-with-goods
    title: Which action protects the goods — trespass, conversion or detinue?
    summary: Sorts an interference with chattels by what the plaintiff held (possession or a right to immediate possession) and what the defendant did.
    start: g1
    concepts:
      - laws2400-w02-trespass-to-goods
      - laws2400-w02-conversion-and-detinue
    sources:
      - Topic 2 Lecture 2 (slides 3–21)
      - 'Torts Week 2 Casebook: Penfolds Wines v Elliott'
    nodes:
      - id: g1
        kind: ask
        text: Is the thing a chattel — tangible, movable and transferable by delivery?
        note: Pets, livestock, cars, books, phones and artwork are chattels; fixtures attached to land are not. No property in a dead body; intangibles such as bitcoin are an open question.
        concept: laws2400-w02-trespass-to-goods
        branches:
          - label: 'Yes'
            to: g2
          - label: 'No'
            to: gx
      - id: g2
        kind: ask
        text: Was the plaintiff in possession when the interference happened?
        note: Possession = intention to control and exclude others + actual control. A bailee has it, not the bailor (Penfolds); a finder or occupier may have it (NCA v Flack).
        cases:
          - penfolds-wines-pty-ltd-v-elliott
          - national-crime-authority-v-flack
        branches:
          - label: 'Yes'
            to: g3
          - label: 'No'
            to: g4
      - id: g3
        kind: ask
        text: Did the defendant directly interfere with the chattel?
        branches:
          - label: 'Yes'
            to: gt
          - label: 'No'
            to: g4
      - id: gt
        kind: end
        tone: met
        text: Trespass to goods — no proof of actual damage is generally required. If the dealing was also serious, conversion may lie too.
      - id: g4
        kind: ask
        text: Does the plaintiff have at least a right to immediate possession?
        note: Enough for conversion and detinue, though not for trespass.
        concept: laws2400-w02-conversion-and-detinue
        branches:
          - label: 'Yes'
            to: g5
          - label: 'No'
            to: gx
      - id: g5
        kind: ask
        text: Was the defendant's dealing serious — an assertion of dominion contrary to the plaintiff's rights?
        note: Sale, taking possession, inconsistent use (Penfolds), or refusing an unconditional demand (Bunnings). Storing goods on pallets as delivered was not enough (Bunnings).
        cases:
          - penfolds-wines-pty-ltd-v-elliott
          - bunnings-group-ltd-v-chep-australia-ltd
        branches:
          - label: 'Yes'
            to: g6
          - label: 'No'
            to: g7
      - id: g6
        kind: ask
        text: Does the plaintiff's right rest on some proprietary title, not merely a contractual or custodial right?
        note: Hocking v Director General of the National Archives of Australia.
        cases:
          - hocking-v-director-general-of-the-national-archives-of-australia
        branches:
          - label: 'Yes'
            to: gc
          - label: 'No'
            to: g7
      - id: gc
        kind: end
        tone: met
        text: Conversion — strict liability, so good faith or mistake is no defence.
      - id: g7
        kind: ask
        text: Did the plaintiff make a clear demand for the goods that the defendant expressly and unreasonably refused?
        note: The demand, written or oral, must give specific, clear and unequivocal instructions. A refusal made to verify entitlement may be reasonable.
        branches:
          - label: 'Yes'
            to: gd
          - label: 'No'
            to: gx
      - id: gd
        kind: end
        tone: met
        text: Detinue — the court may, in its discretion, order the goods returned.
      - id: gx
        kind: end
        tone: not-met
        text: No action for interference with goods lies on these facts.
