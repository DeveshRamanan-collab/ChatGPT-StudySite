      - Week 05 - Lecture Slides - International and National Law and Jurisdiction (slides 21–25, 27)
      - 'Week 05 - Lecture Recording (Live) - International and National Law and Jurisdiction - Full Transcript (40:00–46:00: transformation and incorporation, Nulyarimma, Merkel J''s criteria, Mabo and Teoh)'
