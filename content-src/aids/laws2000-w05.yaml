  - concept: laws2000-w05-forms-of-jurisdiction
    plain: 'Jurisdiction is a state''s power over people and conduct, in three forms: making law, enforcing it and judging cases. Laws may reach abroad; enforcement on another state''s soil needs its permission.'
    concrete: In 1960 a Mossad team went to Argentina, captured the former Nazi officer Adolf Eichmann and smuggled him to Israel without the Argentine authorities' consent. He was tried in Israel for crimes against humanity and war crimes, and executed in 1962. Whatever Israel's power to prosecute, the capture was unauthorised enforcement in another state's territory — a serious violation of Argentina's sovereignty. The Security Council asked Israel to offer compensation.
    formal: 'Jurisdiction is "the lawful power of a State to define and enforce the rights and duties, and control the conduct, of natural and juridical persons" (Oxman). Prescription: international law leaves states "a wide measure of discretion", limited by prohibitive rules (Lotus (1927) 19). Enforcement: failing "a permissive rule to the contrary", a state "may not exercise its power in any form in the territory of another State" (18).'
    analogy:
      text: Your house rules can say "no smoking, even at a friend's place". But you cannot walk into your neighbour's house to confiscate a guest's cigarettes.
      maps:
        - from: writing the house rules
          to: jurisdiction to prescribe
        - from: enforcing them in your own home
          to: enforcement on the state's own territory
        - from: entering the neighbour's house
          to: enforcement in another state's territory — unlawful without permission
      limits:
        - House rules bind only your household; a state prescribing for conduct abroad still needs a recognised ground — territory, nationality, protection or universality — where a foreign element exists.
    terms:
      - term: jurisdiction to prescribe
        gloss: Making national law applicable to persons, property and activities — by legislation, executive act, regulation or court determination.
      - term: jurisdiction to enforce
        gloss: 'The executive putting laws into operation: arrest, seizure, freezing assets, fines, remand and imprisonment. The most intrusive form.'
      - term: jurisdiction to adjudicate
        gloss: Domestic courts' power to hear and bindingly decide legal disputes. In principle territorial.
      - term: sovereignty
        gloss: Supreme authority within a territory, subject to international requirements; a description of statehood, not a precondition for it (Besson).
    misconceptions:
      - claim: Lotus says a state may not extend its laws abroad unless a permissive rule allows it.
        tempting: Lotus does mention a permissive rule.
        correction: That is the enforcement rule. For prescription, Lotus says international law leaves states "a wide measure of discretion", limited only by prohibitive rules. Prescription abroad is free unless prohibited; enforcement abroad is prohibited unless permitted.
      - claim: Imprisoning a convicted thief is adjudicative jurisdiction, because a court imposed the sentence.
        tempting: Courts hand down sentences.
        correction: Slide 38 lists imposing imprisonment and custody on remand as enforcement. The prosecution in court is adjudication; criminalising theft is prescription.
      - claim: A state's courts can never sit outside its territory.
        tempting: Adjudicative jurisdiction is in principle territorial.
        correction: 'By agreement they can: after Lockerbie, a special Scottish court sat at Camp Zeist in the Netherlands, applying Scottish law, under a 1998 UK–Netherlands agreement.'
    socratic:
      - ask: Parliament makes theft a crime. Which form of jurisdiction is that?
        hint: Making law.
        answer: 'Prescriptive jurisdiction: making national law applicable to persons and conduct.'
      - ask: Police arrest a suspect, who is held on remand, prosecuted, convicted and imprisoned. Which forms appear?
        hint: Who acts at each step?
        answer: Arrest, remand and imprisonment are enforcement, by the executive. The criminal prosecution in court is adjudication.
      - ask: Can a state make its criminal law apply to conduct abroad?
        hint: Lotus, page 19.
        answer: 'In principle yes: international law leaves states "a wide measure of discretion", limited only by prohibitive rules — though with a foreign element a recognised ground is needed.'
      - ask: Can its police then arrest the suspect inside another state?
        hint: Lotus, page 18; Eichmann.
        answer: Not without a permissive rule, such as the other state's consent by treaty or agreement. Israel's capture of Eichmann in Argentina violated Argentina's sovereignty.
      - ask: Can a state's courts ever sit abroad?
        hint: Lockerbie.
        answer: 'Exceptionally, by agreement: under a UK–Netherlands agreement a special Scottish court sat at Camp Zeist in the Netherlands, applying Scottish law.'
    elements:
      - name: Prescription
        test: Power to make law applicable to persons, property and activities. It may reach abroad unless a prohibitive rule applies (Lotus, 19).
        cases:
          - ss-lotus-france-v-turkey
      - name: Enforcement
        test: Executive acts such as arrest, seizure and fines. Free on the state's own territory; in another state's territory only with a permissive rule (Lotus, 18).
        cases:
          - ss-lotus-france-v-turkey
      - name: Adjudication
        test: Courts hearing and bindingly deciding disputes. In principle territorial; exceptionally abroad by agreement (Lockerbie).
    what-if:
      - change: Argentina had agreed, by treaty or later agreement, to let Israeli agents arrest Eichmann.
        effect: 'The capture would not have breached Argentina''s sovereignty: with the territorial state''s permission, enforcement in its territory is possible.'
      - change: There had been no UK–Netherlands agreement for the Lockerbie trial.
        effect: 'A Scottish court could not simply sit in the Netherlands: adjudication is in principle territorial, and exercising power in another state''s territory needs a permissive rule.'
    boundary:
      - text: The Lockerbie trial at Camp Zeist.
        why: 'An exception to territorial adjudication: Scottish judges applied Scottish law in the Netherlands, made lawful by the UK–Netherlands agreement of 1998.'
      - text: A statute making conduct by a state's nationals abroad a crime.
        why: 'Prescription abroad: lawful in principle under Lotus, supported here by nationality — but enforcing it inside another state would still need that state''s permission.'
    transfer:
      - scenario: State R's tax agency learns a fraudster is hiding in State S. R's agents fly to S, seize his laptop and freeze his local bank account without telling S.
        answer: R may prescribe tax offences reaching conduct abroad on a recognised ground, but seizing property and freezing assets is enforcement. Under Lotus (18), failing a permissive rule, a state may not exercise its power in any form in another state's territory. Like Eichmann's capture, this violates S's sovereignty and territorial integrity.
    sources:
      - Week 05 - Lecture Slides - International and National Law and Jurisdiction (slides 30–38)
      - 'Week 05 - Lecture Recording (Online) - International and National Law and Jurisdiction - Full Transcript (00:00–20:00: definition, sovereignty, the three forms, Lotus, Eichmann, Lockerbie, the theft example)'
      - Week 05 - Tutorial Tasks - International and National Law and Jurisdiction (Q2)
