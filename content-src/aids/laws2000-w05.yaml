flows:
  - slug: does-the-rule-apply-in-australia
    title: Can an Australian court give effect to this rule of international law?
    summary: Routes a treaty or customary rule through transformation, the interpretive aids and the limits on custom, to show whether and how it operates in Australian law.
    start: a1
    concepts:
      - laws2000-w05-treaties-in-australian-law
      - laws2000-w05-international-law-in-australian-interpretation
      - laws2000-w05-customary-international-law-in-australian-law
    sources:
      - Week 05 - Lecture Slides - International and National Law and Jurisdiction (slides 12–25)
      - Week 05 - Lecture Recording (Live) - International and National Law and Jurisdiction - Full Transcript (20:00–51:00)
    nodes:
      - id: a1
        kind: ask
        text: Is the rule found in a treaty or in customary international law?
        branches:
          - label: A treaty
            to: a2
          - label: Customary international law
            to: a5
      - id: a2
        kind: ask
        text: Has Parliament transformed the treaty into Australian law?
        note: New legislation, amending an Act, existing legislation already giving effect, or giving force of law (DPIA 1967 s 7). Scheduling alone is not full incorporation.
        authorities:
          - australian-constitution-cth-s51-xxix
          - diplomatic-privileges-and-immunities-act-1967-cth-s7
        branches:
          - label: 'Yes'
            to: e-applies
          - label: No — it is only ratified
            to: a3
      - id: a3
        kind: ask
        text: Is the question the meaning of an Australian statute?
        branches:
          - label: Yes — a statute must be interpreted
            to: a4
          - label: No — the claimant relies on the treaty itself
            to: e-no-direct
      - id: a4
        kind: ask
        text: Are the statute's words ambiguous or obscure, and did Australia join (or contemplate joining) the treaty before the Act was passed?
        note: Section 15AB also allows a treaty to confirm ordinary meaning or avoid a manifestly absurd result. Obligations are identified as they exist when the question arises.
        authorities:
          - acts-interpretation-act-1901-cth-s15ab
        branches:
          - label: 'Yes'
            to: e-interpret
          - label: No — the words are clear
            to: e-clear
          - label: No — Australia joined only after the Act
            to: e-presumption
      - id: a5
        kind: ask
        text: Is the customary rule inconsistent with a statute or essential common law doctrine?
        note: Australia has not settled between transformation and incorporation; either way, this limit applies.
        branches:
          - label: 'Yes'
            to: e-custom-blocked
          - label: 'No'
            to: a6
      - id: a6
        kind: ask
        text: Would applying the rule mean trying and punishing someone for a crime?
        cases:
          - nulyarimma-v-thompson
        branches:
          - label: Yes — a criminal norm
            to: e-crime
          - label: No — a civil rule
            to: e-custom-maybe
      - id: e-applies
        kind: end
        tone: met
        text: It applies as Australian law through the legislation. Where the Act reproduces treaty text, read it in line with the treaty (Applicant A).
        cases:
          - applicant-a-v-minister-for-immigration-and-ethnic-affairs
      - id: e-no-direct
        kind: end
        tone: not-met
        text: 'No direct effect: ratification creates no rights in Australian law until legislation implements it (Dietrich).'
        cases:
          - dietrich-v-the-queen
      - id: e-interpret
        kind: end
        tone: qualified
        text: The treaty may assist interpretation (s 15AB), and the court favours the reading consistent with international law (Jumbunna).
        cases:
          - jumbunna-coal-mine-nl-v-victoria-coal-miners-association
      - id: e-clear
        kind: end
        tone: not-met
        text: 'Clear words prevail: a treaty cannot modify them (Yager), and the presumption yields to clear legislation (Polites). Australia may still be in breach internationally.'
        cases:
          - yager-v-the-queen
          - polites-v-commonwealth
      - id: e-presumption
        kind: end
        tone: qualified
        exception: true
        text: Section 15AB is unavailable, but the common law presumptions may still favour a reading consistent with international law (Jumbunna; Coco for fundamental rights).
        cases:
          - jumbunna-coal-mine-nl-v-victoria-coal-miners-association
          - coco-v-the-queen
      - id: e-custom-blocked
        kind: end
        tone: not-met
        text: 'Not adopted: custom yields to inconsistent legislation or essential common law doctrine.'
      - id: e-crime
        kind: end
        tone: not-met
        text: Not triable without legislation making it an offence — even a jus cogens norm such as genocide (Nulyarimma).
        cases:
          - nulyarimma-v-thompson
      - id: e-custom-maybe
        kind: end
        tone: qualified
        text: It may be received into the common law (Merkel J's criteria) — but the doctrine is unsettled, and Teoh forbids back-door importation of treaties.
        cases:
          - nulyarimma-v-thompson
          - minister-for-immigration-and-ethnic-affairs-v-teoh
  - slug: can-the-state-exercise-jurisdiction
    title: Can this state exercise jurisdiction over the offence?
    summary: Checks the form of jurisdiction claimed, then tests each recognised ground — territoriality, nationality, protection, universality and, last, passive personality.
    start: j1
    concepts:
      - laws2000-w05-forms-of-jurisdiction
      - laws2000-w05-grounds-of-jurisdiction
    sources:
      - Week 05 - Lecture Slides - International and National Law and Jurisdiction (slides 32–49)
      - Week 05 - Lecture Recording (Online) - International and National Law and Jurisdiction - Full Transcript (06:00–41:00)
      - Week 05 - Tutorial Tasks - International and National Law and Jurisdiction (Q4)
    nodes:
      - id: j1
        kind: ask
        text: Is the state making or applying its law (prescribing, adjudicating), or acting inside another state's territory (arresting, seizing)?
        branches:
          - label: Prescribing or adjudicating
            to: j3
          - label: Enforcing in another state's territory
            to: j2
      - id: j2
        kind: ask
        text: Has the territorial state permitted it, by treaty or agreement?
        note: 'Lotus (18): "failing the existence of a permissive rule to the contrary", a state "may not exercise its power in any form in the territory of another State".'
        cases:
          - ss-lotus-france-v-turkey
        branches:
          - label: 'Yes'
            to: j3
          - label: 'No'
            to: e-unlawful
      - id: j3
        kind: ask
        text: Did the offence take place, at least in part, on the state's territory?
        note: 'Check every ground for every state: several states may have jurisdiction at once (concurring jurisdiction).'
        branches:
          - label: Yes — wholly or partly
            to: e-territory
          - label: 'No'
            to: j4
      - id: j4
        kind: ask
        text: Is the offender one of the state's nationals?
        note: 'States largely decide who their nationals are (Nottebohm: "a genuine connection"). Ships and aircraft take the nationality of their state of registration.'
        cases:
          - nottebohm-case
        branches:
          - label: 'Yes'
            to: e-active
          - label: 'No'
            to: j5
      - id: j5
        kind: ask
        text: Does the act threaten a vital security interest of the state?
        note: Counterfeiting currency, espionage, conspiracy to commit treason (a coup), attacks on diplomatic personnel abroad.
        branches:
          - label: 'Yes'
            to: e-protective
          - label: 'No'
            to: j6
      - id: j6
        kind: ask
        text: Is it piracy, genocide, a war crime, a crime against humanity or torture?
        authorities:
          - geneva-convention-iv-art-146
          - criminal-code-act-1995-cth-div-268
        branches:
          - label: 'Yes'
            to: e-universal
          - label: 'No'
            to: j7
      - id: j7
        kind: ask
        text: Is the victim one of the state's nationals?
        note: 'Checked last: passive personality is controversial and better as a subsidiary ground (slide 44).'
        cases:
          - us-v-yunis
        branches:
          - label: 'Yes'
            to: e-passive
          - label: 'No'
            to: e-none
      - id: e-unlawful
        kind: end
        tone: not-met
        exception: true
        text: 'Unlawful: unauthorised enforcement in another state''s territory violates its sovereignty (Eichmann, 1960).'
      - id: e-territory
        kind: end
        tone: met
        text: 'Territorial jurisdiction — the fundamental ground: objective (completed there) or subjective (initiated or planned there) for cross-border crimes.'
      - id: e-active
        kind: end
        tone: met
        text: 'Active nationality: the state may prosecute its national for acts abroad (dual nationals: both states).'
      - id: e-protective
        kind: end
        tone: met
        text: Protective jurisdiction over a foreign national's act abroad that genuinely threatens a vital security interest.
      - id: e-universal
        kind: end
        tone: qualified
        text: Universal jurisdiction, with no direct link needed — but without a treaty it is controversial, so states usually require the accused's presence.
      - id: e-passive
        kind: end
        tone: qualified
        text: 'Passive personality (US v Yunis): available but controversial — best combined with another ground.'
      - id: e-none
        kind: end
        tone: not-met
        text: 'No recognised ground: the state cannot justify jurisdiction over this foreign element.'
