  - concept: laws2000-w05-monism-and-dualism
    plain: Monism treats international and national law as one legal system, so courts can apply international law directly. Dualism treats them as separate, so international law must first be turned into national law.
    concrete: 'Germany''s Basic Law art 25 makes the general rules of international law "an integral part of federal law" that take precedence over the laws and directly create rights and duties — no Act needed: monism. The Netherlands blends the two: Parliament must approve treaties (art 91), but once published, treaty provisions binding on all persons apply (art 93) and override conflicting statutory regulations (art 94). Australia, like the UK and Canada, leans dualist.'
    formal: 'Monism: one normative legal order; international law has direct effect (incorporation), the same authority as national law, and conflicts are resolved "frequently in favour of international law"; often civil law. Dualism: distinct orders; only national law has domestic force, so international law must be transformed; inconsistencies do not arise; often common law. "In reality, blends of the two theories characterise" most domestic legal orders (slide 8).'
    analogy:
      text: Plugging in an overseas appliance. In one house the socket takes any plug and it works at once; in another you need an adapter before it will run.
      maps:
        - from: the overseas appliance
          to: a rule of international law
        - from: the universal socket
          to: a monist system (direct effect)
        - from: the adapter
          to: transforming legislation in a dualist system
      limits:
        - In a monist system a clash between two rules still needs priority rules to resolve it; a socket never has to choose between appliances.
        - Real systems are blends — few 'houses' are purely one type.
    terms:
      - term: incorporation (direct effect)
        gloss: International law applying in the domestic legal order without any transforming step — the monist mechanism.
      - term: transformation
        gloss: Turning international law into national law, usually by legislation, before it has domestic effect — the dualist mechanism.
      - term: ideal types
        gloss: 'Abstract models: no state applies either theory perfectly; most systems blend them while leaning one way.'
    misconceptions:
      - claim: Monism works by transformation and dualism by incorporation.
        tempting: Both words appear on the same slide, and the labels are easy to swap.
        correction: Reversed. Monism gives international law direct effect (incorporation); dualism requires it to be transformed into domestic law.
      - claim: Because Australia is dualist, international law has no relevance in Australian courts.
        tempting: Dualism says only national law has force domestically.
        correction: Courts may refer to international law and interpret Australian law consistently with Australia's obligations where possible (Practitioner's Guide). It informs, even when it does not directly apply.
      - claim: Under dualism, international law usually prevails over national law.
        tempting: That is international law's own view of the relationship.
        correction: Dualism treats the orders as distinct; only national law has domestic force, so national law usually has priority, and inconsistencies "do not arise".
    socratic:
      - ask: Germany's art 25 makes general rules of international law part of federal law, taking precedence over statutes and directly creating rights. Which theory?
        hint: Is any legislative step needed?
        answer: 'Monism: international law has direct effect (incorporation) with no Act required, and it prevails over the laws.'
      - ask: Under monism, can a statute clash with international law?
        hint: One legal order.
        answer: Yes. Because both sit in one order, inconsistencies arise and must be resolved — frequently in favour of international law.
      - ask: Why does a dualist say such clashes "do not arise"?
        hint: Two orders, different subjects and purposes.
        answer: The systems are distinct; only national law has domestic force, and it usually has priority, so there is nothing to reconcile inside the domestic order.
      - ask: The Netherlands requires parliamentary approval, then lets published treaties override statutes. Which theory?
        hint: Dutch arts 91, 93 and 94.
        answer: A blend. Approval (art 91) has a dualist flavour, but no replicating law is needed and treaties prevail over conflicting statutes (arts 93–94) — monist in effect.
      - ask: Which theory best reflects Australia (tutorial question 1)?
        hint: Dietrich; the Practitioner's Guide.
        answer: 'Primarily dualist: treaties must be transformed and clear Australian law prevails — though courts may refer to international law and read Australian law consistently with it.'
    what-if:
      - change: Country X's constitution says ratified treaties form part of the law of the land and prevail over inconsistent statutes.
        effect: 'X leans monist: treaties take direct effect without case-by-case transformation, and conflicts are resolved in the treaty''s favour.'
      - change: Australia's Parliament passes an Act reproducing a treaty in full.
        effect: 'That is transformation, the dualist route: the Act, not the treaty, gives the rules domestic force — and an Act reproducing treaty text is read in line with the treaty (Applicant A).'
    boundary:
      - text: The Netherlands (Constitution arts 91, 93, 94).
        why: 'Neither pure type: parliamentary approval is required, but published treaties bind all persons and override statutes without any replicating law.'
      - text: Australian courts using a treaty to read an ambiguous statute.
        why: 'Not monism: the treaty is an aid to reading national law, not law applied directly; Australia stays primarily dualist.'
    transfer:
      - scenario: A newly independent state is drafting its constitution. One draft says treaties apply in its courts only once Parliament enacts them; another says ratified treaties bind everyone once published and override statutes. A minister asks which model each reflects.
        answer: 'The first is dualist: international law needs transformation before it has domestic effect, and national law keeps priority, as in Australia. The second is close to monism, or the blended Dutch model: published treaties bind all persons (art 93) and override conflicting statutory regulations (art 94).'
    sources:
      - Week 05 - Lecture Slides - International and National Law and Jurisdiction (slides 8–10, 28)
      - 'Week 05 - Lecture Recording (Live) - International and National Law and Jurisdiction - Full Transcript (13:00–20:00: monism and dualism as ideal types, Germany art 25, Dutch arts 91–94)'
      - Week 05 - Tutorial Tasks - International and National Law and Jurisdiction (Q1)
