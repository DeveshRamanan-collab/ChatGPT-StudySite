unit: laws2000
week: 5
source: raw/laws2000-pil/week-05
generator: aids-1
aids:
  - concept: laws2000-w05-il-perspective-on-national-law
    plain: 'In international law, a state''s own law is no excuse: if the state breaks an international obligation, it is in breach, whatever its domestic law says.'
    concrete: 'The lecturer sets the two perspectives side by side. Suppose an Australian statute clearly authorises conduct that breaches one of Australia''s treaty obligations. In an Australian court the clear statute wins: international law cannot override clear and valid Australian law. But internationally Australia is still in breach — art 27 VCLT stops it pleading its own law, and under art 3 of the ILC articles the act''s lawfulness at home does not change its wrongfulness.'
    formal: 'VCLT art 27: "A party may not invoke the provisions of its internal law as justification for its failure to perform a treaty". Art 46: consent given in breach of internal competence rules stands unless the violation was "manifest" (objectively evident) and concerned a rule "of fundamental importance". ILC Draft Articles on State Responsibility (2001) art 3: wrongfulness "is governed by international law".'
    analogy:
      text: A football club's own constitution may allow something the league's rules forbid. If the club does it, the league still penalises the club — "our constitution allowed it" is no answer.
      maps:
        - from: the club's constitution
          to: the state's internal law
        - from: the league's rules
          to: international law
        - from: the league's penalty
          to: state responsibility for an internationally wrongful act
      limits:
        - A league has an authority above the clubs to impose penalties; international law is horizontal, with no superior authority above states.
    terms:
      - term: internal law
        gloss: A state's own domestic law — constitution, statutes, regulations, court decisions. Its absence or contrary content does not justify failing to perform a treaty (art 27).
      - term: manifest violation (art 46(2))
        gloss: A breach of internal competence rules that would be objectively evident to any state conducting itself in accordance with normal practice and in good faith.
      - term: ILC Draft Articles on State Responsibility (2001)
        gloss: Not binding as an ILC product, but mostly recognised as representing customary international law — which is why art 3 matters.
    misconceptions:
      - claim: A state escapes a treaty if the official who consented lacked authority under its domestic law.
        tempting: Consent given by someone without authority seems no consent at all.
        correction: 'Art 46 VCLT: the state may not invoke that breach unless the violation was manifest (objectively evident) and concerned a rule of its internal law of fundamental importance. An ordinary breach is not enough.'
      - claim: If a state's highest court upholds the conduct as lawful, it is lawful internationally too.
        tempting: A final ruling of the state's top court feels decisive.
        correction: 'ILC art 3: characterising an act as internationally wrongful is governed by international law and "not affected by the characterization of the same act as lawful by internal law".'
      - claim: From international law's view, national law is irrelevant for every purpose.
        tempting: The slide says national law is "(mostly) irrelevant" to international obligations.
        correction: Only mostly. National law fulfils obligations, is evidence of state practice and opinio juris, national decisions are subsidiary sources, and it helps interpret international law and identify general principles.
    socratic:
      - ask: State H says it cannot perform a treaty because its parliament never passed implementing legislation. Does that excuse it?
        hint: Art 27 VCLT.
        answer: No. A party may not invoke its internal law — including the absence of a law — as justification for failing to perform a treaty.
      - ask: H adds that its ambassador signed without the full powers its constitution requires. Which article now?
        hint: This is about consent, not performance.
        answer: 'Art 46: consent given in breach of internal competence rules stays valid unless the violation was manifest and concerned a rule of fundamental importance.'
      - ask: When is a violation 'manifest'?
        hint: Art 46(2).
        answer: When it would be objectively evident to any state conducting itself in accordance with normal practice and in good faith — a high bar.
      - ask: Suppose the breach is of custom, not a treaty. What answers "our law allows it"?
        hint: ILC 2001, art 3.
        answer: 'Art 3: whether an act is internationally wrongful is governed by international law, unaffected by its lawfulness under internal law. The articles are mostly recognised as customary.'
      - ask: Does that make national law irrelevant to international law?
        hint: Slide 7 lists four roles.
        answer: No. National law fulfils obligations, evidences state practice and opinio juris, national decisions are subsidiary sources, and it helps interpret international law and identify general principles.
    elements:
      - name: Treaty non-performance (art 27)
        test: Internal law — including its absence or a contradictory provision — is no justification for failing to perform a treaty.
        authorities:
          - vclt-art-27
      - name: Defective consent (art 46)
        test: Consent given in breach of internal rules on competence binds unless the violation was manifest (objectively evident) and concerned a rule of fundamental importance.
        authorities:
          - vclt-art-46
      - name: Any international obligation (ILC art 3)
        test: Wrongfulness is characterised by international law and is not affected by the act's lawfulness under internal law.
        authorities:
          - ilc-draft-articles-on-state-responsibility-2001-art-3
    what-if:
      - change: The ambassador's lack of authority was objectively evident to the other parties and breached a constitutional rule of fundamental importance.
        effect: 'Now art 46''s narrow exception may apply: a manifest violation of a rule of fundamental importance can be invoked as invalidating the state''s consent.'
      - change: A new government says it is not bound because the previous government skipped a parliamentary vote required only by an ordinary statute.
        effect: Not released. Skipping an ordinary statutory step is unlikely to be a manifest violation of a rule of fundamental importance, and the state — not the government of the day — is bound.
      - change: The state's highest court upholds the statute authorising the conduct.
        effect: 'Domestically the statute may stand, but internationally nothing changes: under ILC art 3, lawfulness under internal law does not affect whether the act is internationally wrongful.'
    boundary:
      - text: The ILC Draft Articles on State Responsibility themselves.
        why: Not binding as an ILC product, yet mostly recognised as customary international law — so art 3 binds states through custom.
      - text: A court examining a state's statutes to identify a customary rule.
        why: National law matters internationally here — as evidence of state practice and opinio juris, not as an excuse for breach.
    transfer:
      - scenario: A state's environment ministry approves dumping waste into a shared river, as its statute allows, though a treaty with its neighbour forbids it. When the neighbour protests, the ministry replies that the dumping is fully lawful at home.
        answer: Domestic legality is beside the point. Art 27 VCLT bars the state from invoking its internal law to justify failing to perform the treaty, and under ILC art 3 the act's wrongfulness is governed by international law, unaffected by its lawfulness under internal law. The state is in breach.
    sources:
      - Week 05 - Lecture Slides - International and National Law and Jurisdiction (slides 4–7)
      - 'Week 05 - Lecture Recording (Live) - International and National Law and Jurisdiction - Full Transcript (02:00–13:00: sovereign equality recap, arts 27 and 46 VCLT, ILC art 3, roles of national law)'
