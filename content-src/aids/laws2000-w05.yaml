  - concept: laws2000-w05-international-law-in-australian-interpretation
    plain: Australian courts read unclear laws, where possible, so they fit Australia's international obligations. But if the words are clear, the words win — even if they breach international law.
    concrete: 'The lecturer stresses timing. Under s 15AB a treaty can help interpret an Act only if Australia was a party, or was contemplating becoming one, when the Act was passed. And obligations are identified as they exist when the interpretive question arises: a treaty that enters into force tomorrow cannot guide a case arising today. Even then, a treaty only helps with unclear words — it cannot change words that are otherwise clear (Yager).'
    formal: 'A statute incorporating treaty text is read in line with the treaty unless a contrary intention appears (Applicant A). Acts Interpretation Act 1901 (Cth) s 15AB(2)(d): a treaty may assist if Australia participated before enactment, to confirm ordinary meaning or resolve ambiguity, obscurity or manifest absurdity. It cannot modify otherwise clear words (Yager, Mason J). Presumptions: consistency with international law (Jumbunna; not against clear words: Polites); legality (Coco).'
    analogy:
      text: 'A dictionary: you consult it when a word could mean two things, to pick the right meaning. You do not use it to change a word whose meaning is already plain.'
      maps:
        - from: a word with two meanings
          to: an ambiguous or obscure statutory provision
        - from: consulting the dictionary
          to: using a treaty under s 15AB or the Jumbunna presumption
        - from: a word with a plain meaning
          to: clear words that no treaty can modify (Yager; Polites)
      limits:
        - Any dictionary will do for a word; a treaty counts under s 15AB only if Australia participated, or contemplated participating, before the Act was passed.
    terms:
      - term: s 15AB Acts Interpretation Act 1901 (Cth)
        gloss: 'Lets extrinsic material, including treaties, assist interpretation: to confirm ordinary meaning, or where an Act is ambiguous, obscure or manifestly absurd.'
      - term: Jumbunna presumption
        gloss: 'In a case of ambiguity, courts favour the construction that accords with international law. A presumption only: it yields to clear contrary legislation (Polites).'
      - term: principle of legality
        gloss: Courts will not impute to Parliament an intention to curtail fundamental rights and freedoms unless clearly manifested by unambiguous language (Coco).
      - term: Practitioner's Guide to International Law
        gloss: 'Law Society NSW (2014): eight principles on international law in Australian law — e.g. Parliament may legislate in breach, "taking the risk of international complications".'
    misconceptions:
      - claim: A treaty can modify clear statutory words if it gives individuals better protection.
        tempting: Courts favour readings consistent with international law and protective of rights.
        correction: A treaty "cannot qualify or modify the meaning of legislative words or expressions which are otherwise clear" (Yager, Mason J). The presumptions apply only to ambiguity (Polites).
      - claim: Under s 15AB, any treaty Australia has ratified can be used whenever an Act is ambiguous.
        tempting: Ambiguity is one of the s 15AB triggers.
        correction: 'There is also a timing condition: Australia must have participated, or contemplated participating, in the treaty before the Act was enacted.'
      - claim: The High Court accepts that international law can guide interpretation of the Constitution.
        tempting: Kirby J argued for it in several cases.
        correction: There is no majority support. McHugh J in Al-Kateb called it "heretical" — in effect amending the Constitution without a referendum.
    socratic:
      - ask: An Act reproduces a treaty article word for word. How is it read?
        hint: Applicant A.
        answer: In line with the meaning given to it in the treaty, unless the legislator expressed a contrary intention.
      - ask: Another Act uses an ambiguous word. Can a treaty help under s 15AB?
        hint: Two conditions.
        answer: Yes, if Australia participated, or contemplated participating, before the Act was enacted, and the Act is ambiguous or obscure (or the treaty confirms ordinary meaning, or avoids a manifestly absurd result).
      - ask: Leaving s 15AB aside, does the common law help?
        hint: Jumbunna; Coco.
        answer: Yes. Courts favour a construction consistent with international law where an Act is ambiguous (Jumbunna), and will not read an Act as curtailing fundamental rights without unambiguous language (Coco).
      - ask: The Act clearly authorises detention that breaches a treaty. Now?
        hint: Yager; Polites.
        answer: Clear words win. A treaty cannot modify clear words (Yager), and the Jumbunna presumption does not apply to clear contrary legislation (Polites). Australia may still be in breach internationally.
      - ask: Could the detainee argue the Constitution must be read consistently with international law?
        hint: Newcrest against Al-Kateb.
        answer: Only Kirby J espoused that (Newcrest). McHugh J called it "heretical" (Al-Kateb), and there is no majority support.
    elements:
      - name: Statute incorporating treaty text
        test: Read in line with the meaning given in the treaty, unless the legislator expressed a contrary intention.
        cases:
          - applicant-a-v-minister-for-immigration-and-ethnic-affairs
      - name: Section 15AB
        test: A treaty may assist if Australia participated or contemplated participating before enactment, and it confirms ordinary meaning or the Act is ambiguous, obscure or manifestly absurd.
        authorities:
          - acts-interpretation-act-1901-cth-s15ab
      - name: Common law presumptions
        test: In ambiguity, prefer the construction consistent with international law (Jumbunna); do not read an Act as curtailing fundamental rights without unambiguous language (Coco).
        cases:
          - jumbunna-coal-mine-nl-v-victoria-coal-miners-association
          - coco-v-the-queen
      - name: Clear words prevail
        test: A treaty cannot modify otherwise clear words (Yager); the presumption yields to clear contrary legislation (Polites). Parliament may legislate in breach.
        cases:
          - yager-v-the-queen
          - polites-v-commonwealth
        authorities:
          - law-society-nsw-practitioners-guide-to-international-law-2014
    what-if:
      - change: Australia first considered joining the treaty eight years after the Act was passed.
        effect: 'Under s 15AB the treaty cannot assist: Australia must have participated, or contemplated participating, before the Act was enacted.'
      - change: The detention provision is ambiguous rather than clear.
        effect: 'The Jumbunna presumption applies: the court should favour the reading that accords with international law, s 15AB may let the treaty be consulted, and Coco protects personal liberty.'
      - change: The relevant treaty enters into force tomorrow; the case arises today.
        effect: 'It cannot guide today''s case: obligations are identified as they exist when the interpretive question arises (Practitioner''s Guide; lecture example).'
    boundary:
      - text: 'Kirby J in Newcrest: the Constitution accommodates international law "to the full extent that its text permits".'
        why: 'Outside accepted doctrine: no majority support, and McHugh J (Al-Kateb) called the approach heretical.'
      - text: Parliament deliberately legislating in breach of a treaty.
        why: 'Valid domestically — clear Australian law prevails — but Parliament takes "the risk of international complications": Australia may be in breach internationally.'
    transfer:
      - scenario: A 2015 Act lets officials "remove" non-citizens. A treaty Australia joined in 2005 bars returning people to places where they face serious harm. An official argues "remove" lets him send someone to such a place.
        answer: If "remove" is ambiguous on this point, the treaty can assist under s 15AB — Australia was a party before enactment — and the Jumbunna presumption favours the reading consistent with Australia's obligations; Coco also protects fundamental rights. If the Act clearly authorised it, clear words would prevail (Yager; Polites).
    objections:
      - position: International law should inform interpretation of the Constitution (Kirby J, Newcrest).
        evidence: The Constitution "speaks to the international community as the basic law of the Australian nation", and international law is a legitimate influence, especially where it declares universal and fundamental rights.
        objection: 'McHugh J (Al-Kateb): this is "heretical" — it amends the Constitution without a public referendum, and international rules differ qualitatively from political, social and economic developments.'
    sources:
      - Week 05 - Lecture Slides - International and National Law and Jurisdiction (slides 12, 19–20, 26–27)
      - 'Week 05 - Lecture Recording (Live) - International and National Law and Jurisdiction - Full Transcript (35:00–40:00 and 45:00–51:00: incorporated text, s 15AB, the two presumptions, Kirby J and McHugh J, the Practitioner''s Guide)'
