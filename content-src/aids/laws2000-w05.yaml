  - concept: laws2000-w05-treaties-in-australian-law
    plain: In Australia the executive makes treaties, but a treaty is not part of Australian law until Parliament legislates for it. Ratification alone gives no one rights a court can enforce.
    concrete: 'Dietrich was tried without legal representation. He argued that Australia had ratified the ICCPR, which guarantees a fair trial and free legal assistance in certain cases (art 14(3)(d)), so he should have had publicly funded counsel. On that argument the High Court disagreed: ratification is an executive act with no direct legal effect on domestic law, and the ICCPR''s rights are not part of Australian law until specific legislation implements them — and none had been passed.'
    formal: 'Constitution s 51(xxix): Parliament may legislate on "external affairs"; s 61: the executive concludes treaties; s 75(i): High Court original jurisdiction in "matters arising under a treaty". Treaties lack direct effect, apart from a very limited class (some peace and boundary treaties): ratification "has no direct legal effect upon domestic law" until legislation implements it (Dietrich v The Queen (1992) 177 CLR 292, Mason CJ and McHugh J).'
    terms:
      - term: external affairs power (s 51(xxix))
        gloss: 'Parliament''s power to legislate on external affairs: implementing treaty or customary obligations, matters affecting relations with international persons, or matters of "international concern" (Koowarta).'
      - term: direct effect
        gloss: A treaty applying in domestic law without legislation. Treaties have none in Australia, apart from a very limited class such as certain peace and boundary treaties.
      - term: methods of transformation
        gloss: New legislation; amending existing Acts; scheduling (not full incorporation); relying on existing legislation; or giving the treaty force of law (DPIA 1967 s 7).
      - term: '''device'' (Tasmanian Dam Case)'
        gloss: Using the external affairs power as no more than a pretext to legislate on a state matter — probably not legitimate.
    misconceptions:
      - claim: Once Australia ratifies a treaty, its rights can be enforced in Australian courts.
        tempting: Australia is bound by the treaty internationally from ratification.
        correction: 'Dietrich: ratification "has no direct legal effect upon domestic law"; the rights are not incorporated "unless and until specific legislation is passed implementing the provisions".'
      - claim: The external affairs power cannot reach matters the Constitution leaves to the states, such as dams.
        tempting: That was Tasmania's argument, and federal balance seems to require it.
        correction: 'The Tasmanian Dam majority upheld the Commonwealth law: the dam was normally a state matter, but being party to the World Heritage Convention let the Commonwealth legislate — unless the power is used as a mere device.'
      - claim: Scheduling a treaty to an existing Act fully incorporates it into Australian law.
        tempting: The treaty's full text then appears in the statute book.
        correction: 'Slide 18: scheduling a treaty to an existing Act "does not constitute full incorporation". A schedule alone does not create justiciable rights.'
    socratic:
      - ask: Australia ratifies Treaty T, which gives a right to a free interpreter, but passes no legislation. Priya relies on T in court. Does she win?
        hint: Dietrich.
        answer: No. Ratification is an executive act with no direct legal effect on domestic law; T's rights are not part of Australian law until legislation implements them.
      - ask: Which constitutional power lets the Commonwealth pass that legislation?
        hint: Not s 61.
        answer: 'Section 51(xxix), the external affairs power: legislation giving effect to treaty obligations is a valid use. Section 61 only vests treaty-making in the executive.'
      - ask: The subject is normally a state matter, like a dam. Does that block Commonwealth legislation?
        hint: The Tasmanian Dam Case.
        answer: No. Being party to the World Heritage Convention let the Commonwealth stop Tasmania's dam — unless the treaty is a mere device to exercise legislative power, which would probably not be legitimate.
      - ask: How can Parliament give T domestic effect?
        hint: The five methods on slide 18.
        answer: New legislation, amending existing legislation, relying on legislation already giving effect, or giving T the force of law, as DPIA s 7 does. Merely scheduling it is not full incorporation.
    elements:
      - name: Treaty made by the executive
        test: The executive concludes treaties (s 61). Ratification binds Australia internationally but has no direct domestic effect.
        cases:
          - dietrich-v-the-queen
        authorities:
          - australian-constitution-cth-s61
      - name: Commonwealth power to implement
        test: 'Parliament legislates under s 51(xxix): treaty or customary obligations, relations with international persons, or matters of "international concern" — but not as a mere device.'
        cases:
          - new-south-wales-v-commonwealth
          - koowarta-v-bjelke-petersen
          - commonwealth-v-tasmania
        authorities:
          - australian-constitution-cth-s51-xxix
      - name: Transformation by legislation
        test: New Act, amendment, existing legislation, or giving force of law (DPIA 1967 s 7). Scheduling alone is not full incorporation.
        authorities:
          - diplomatic-privileges-and-immunities-act-1967-cth-s7
      - name: Exception — direct effect
        test: Only a very limited class of treaties, such as certain peace and boundary treaties, applies without legislative implementation.
    what-if:
      - change: The Commonwealth relies on a treaty only as a pretext to regulate a purely local matter, with no genuine link to the treaty's obligations.
        effect: 'Probably invalid: the Tasmanian Dam majority said use of the external affairs power that is no more than a device to exercise legislative power would probably not be legitimate.'
      - change: Parliament had given the ICCPR's fair-trial provisions the force of law before Dietrich's trial.
        effect: 'Then the rights would be part of Australian law and could be relied on in court: transformation by legislation, not ratification, gives a treaty domestic effect.'
      - change: The treaty in question is a boundary treaty.
        effect: It may belong to the very limited class of treaties directly applicable without legislative implementation, such as certain peace and boundary treaties.
    boundary:
      - text: A treaty scheduled to an Act.
        why: 'Partly in: it appears in the statute book, but scheduling does not constitute full incorporation, so on its own it creates no justiciable rights.'
      - text: Legislation on a matter of 'international concern' with no treaty behind it.
        why: 'Inside s 51(xxix): Koowarta lists international concern as a valid use, alongside treaty and customary obligations.'
    transfer:
      - scenario: Australia ratifies a convention requiring parties to ban a dangerous pesticide, but passes no Act. A neighbour sues a farmer for still using it, relying on the convention. Later a Commonwealth Act bans the pesticide, and a state challenges it as a state matter.
        answer: 'The neighbour fails: ratification has no direct domestic effect (Dietrich). The Commonwealth Act is likely valid under s 51(xxix) because it gives effect to a treaty obligation — as in the Tasmanian Dam Case, even on a matter normally for the states — unless it is a mere device.'
    sources:
      - 'Week 05 - Lecture Slides - International and National Law and Jurisdiction (slides 13–18, incl. image slide 18: DPIA s 7)'
      - 'Week 05 - Lecture Recording (Live) - International and National Law and Jurisdiction - Full Transcript (20:00–36:00: ss 51(xxix), 61, 75(i), the Tasmanian Dam Case, Dietrich, methods of transformation)'
