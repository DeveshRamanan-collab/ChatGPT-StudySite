  - concept: laws2000-w06-restrictive-state-immunity
    plain: Under the restrictive approach a state is immune for sovereign acts — war, legislation, policing — but not for ordinary commercial dealings, judged by what the deal is, not why the state made it.
    concrete: 'A Cuban state-owned shipping company agreed to deliver sugar to Chile. After a coup in Chile, Cuba ordered the ships diverted for political reasons. Sued in England, Cuba claimed immunity: the diversion served a foreign-policy objective. The House of Lords rejected the claim (Playa Largo, 1983). Delivering sugar under a sale contract was commercial in nature — jure gestionis — and the political motive for breaking it did not make it a sovereign act.'
    formal: 'Acts jure imperii are immune; acts jure gestionis are not (Empire of Iran (1963); Trendex (1977)). 2004 Convention art 10: a state in a commercial transaction with a foreign natural or juridical person "cannot invoke immunity" in proceedings arising from it, save state-to-state transactions or express agreement. Art 2(2): look "primarily to the nature" of the transaction; purpose only if the parties agreed. Arts 11–17 and 12 add further exceptions.'
    analogy:
      text: 'A king buying bread at the market is a customer like any other: if he does not pay, the baker can sue him. When he signs laws or commands his army, no market court may judge him.'
      maps:
        - from: buying bread
          to: an act jure gestionis (commercial)
        - from: signing laws, commanding the army
          to: acts jure imperii (sovereign)
        - from: the baker's lawsuit
          to: proceedings in which immunity cannot be invoked (art 10)
      limits:
        - About one-third of states, including China, reject the distinction, so not every 'market' treats the king as a customer.
    terms:
      - term: acta jure imperii
        gloss: Acts of a sovereign nature — foreign and military affairs, legislation, police power, administration of justice. Immunity applies.
      - term: acta jure gestionis
        gloss: Acts of a non-sovereign nature, such as commercial activities. Immunity does not apply.
      - term: commercial transaction (art 2(1)(c))
        gloss: Sale of goods or supply of services; loans and other financial transactions, including guarantees; other commercial, industrial, trading or professional dealings — not employment contracts. Profit is irrelevant.
      - term: nature test (art 2(2))
        gloss: Classify a transaction by what it is, not its policy purpose; purpose counts only if the parties so agreed.
    misconceptions:
      - claim: A transaction made for an official purpose is a sovereign act and immune.
        tempting: States always act for public ends, and the purpose seems to reveal the act's character.
        correction: Art 2(2) looks primarily at the nature of the transaction. Buying office supplies for an embassy is commercial, whatever its official purpose (lecture example; Playa Largo).
      - claim: An organ of the state, such as a central bank, is always immune.
        tempting: Organs of government fall within the definition of 'State'.
        correction: Being the state is only the first step. In Trendex the Central Bank of Nigeria was an organ of the state, yet had no immunity for failing to honour a letter of credit — a commercial act.
      - claim: Every state now accepts the restrictive approach.
        tempting: It is codified in the 2004 Convention and applied in the leading cases.
        correction: About one-third of states, including China, do not recognise the jure imperii / jure gestionis distinction, and the Convention is not in force.
    socratic:
      - ask: A foreign central bank fails to honour a letter of credit and is sued in England. Is it 'the State'?
        hint: Art 2(1)(b).
        answer: Yes — in Trendex the court accepted the Central Bank of Nigeria was an organ of the state. But that does not settle immunity.
      - ask: Is it immune?
        hint: Sovereign act or commercial act?
        answer: No. Honouring a letter of credit is a commercial transaction (jure gestionis); under the restrictive approach immunity does not apply (Trendex, 1977).
      - ask: The state says it made no profit from the deal. Does that matter?
        hint: Art 2(1)(c).
        answer: No. Profit is irrelevant; the question is whether it is a commercial or financial transaction.
      - ask: Cuba says it diverted the sugar ships for foreign-policy reasons. Does the motive make the act sovereign?
        hint: Art 2(2); Playa Largo.
        answer: No. Look primarily at the nature of the transaction. The House of Lords held the shipping activity commercial despite its political purpose.
      - ask: An embassy driver on duty injures a pedestrian in Canberra. Is that a commercial transaction?
        hint: A different exception.
        answer: No, but art 12 removes immunity for compensation for death, injury or property damage caused in the forum state by an act attributable to the state, its author present there.
    elements:
      - name: Commercial transaction with a foreign person
        test: 'Proceedings arising out of a commercial transaction between the state and a foreign natural or juridical person: immunity cannot be invoked (art 10).'
        cases:
          - trendex-trading-corporation-v-central-bank-of-nigeria
        authorities:
          - uncsi-2004-art-10
      - name: Commercial by nature
        test: Goods, services, loans or other commercial dealings, not employment; judged primarily by nature, purpose only if agreed; profit irrelevant.
        cases:
          - playa-largo-v-i-congreso-del-partido
        authorities:
          - uncsi-2004-art-2-1-c
          - uncsi-2004-art-2-2
      - name: No exception applies
        test: Immunity remains for commercial transactions between states, or where the parties have expressly agreed otherwise.
        authorities:
          - uncsi-2004-art-10
      - name: Other non-immune proceedings
        test: Certain employment contracts, property, intellectual property, companies, commercial ships, arbitration (arts 11, 13–17); death, injury or property damage in the forum (art 12).
        authorities:
          - uncsi-2004-arts-11-17
          - uncsi-2004-art-12
    what-if:
      - change: The sugar contract had been between Cuba and the government of Chile, not a private buyer.
        effect: Art 10 does not apply to commercial transactions between states, so Cuba would keep its immunity.
      - change: The parties had agreed that the transaction's purpose should be taken into account.
        effect: Under art 2(2) the foreign-policy purpose could then be weighed in classifying the transaction, making a sovereign characterisation more arguable.
      - change: The claim is for unpaid catering at an official embassy reception.
        effect: Commercial by nature — a supply of services — so no immunity, whatever its official purpose (lecture example).
    boundary:
      - text: China's position on state immunity.
        why: 'About one-third of states, including China, reject the jure imperii / jure gestionis distinction: the restrictive approach is widespread but not universal.'
      - text: A contract employing local staff at an embassy.
        why: Excluded from the definition of 'commercial transaction' (art 2(1)(c)), so art 10 does not apply — but certain employment contracts have their own exception (art 11).
    transfer:
      - scenario: A foreign defence ministry orders 5,000 pairs of boots for its army from a Melbourne manufacturer, then refuses to pay, saying military procurement is a sovereign matter.
        answer: 'Under art 2(2) look primarily at the nature of the transaction: a contract for the sale of goods is commercial (art 2(1)(c)), whatever its military purpose — like the lecturer''s embassy office supplies. As a commercial transaction with a foreign juridical person, art 10 removes immunity, unless the parties expressly agreed otherwise.'
    storyboard:
      - caption: Absolute immunity
        detail: Originally everything a state did was immune; the absolute view flowed mostly from common law jurisdictions such as the UK and the US.
      - caption: Civil law draws a line
        detail: Many civil law countries distinguished sovereign acts from other acts of the state.
      - caption: Empire of Iran, 1963
        detail: The German Federal Constitutional Court finds absolute immunity is no longer customary international law.
      - caption: Trendex, 1977
        detail: The English Court of Appeal denies immunity to Nigeria's central bank for a commercial letter of credit.
      - caption: Codified in 2004
        detail: The UN Convention (art 10) removes immunity for commercial transactions — though it is still not in force.
      - caption: Not yet universal
        detail: About one-third of states, including China, still reject the distinction.
    sources:
      - Week 06 - Lecture Slides - Immunities (slides 10–17)
      - 'Week 06 - Lecture Recording (Live) - Immunities - Full Transcript (17:00–31:00: absolute to restrictive, Trendex, art 10, art 2(1)(c), art 2(2), embassy supplies, Playa Largo, art 12)'
