  - concept: laws2000-w06-diplomatic-and-consular-immunities
    plain: Diplomats cannot be arrested or tried in the country they are posted to, and embassies cannot be entered without consent. Consuls get less protection. The host state's answer to abuse is expulsion, not prosecution.
    concrete: 'In November 1979, during the Iranian revolution, militants stormed the US Embassy in Tehran and held more than 50 US diplomats and consular officials hostage for 444 days. Iranian security forces did not intervene. The militants were not Iranian officials, yet the ICJ held Iran in breach of the Vienna Conventions: it knew its duty to protect the mission, was asked for help, had the means to act — and did nothing.'
    formal: 'VCDR art 31: a diplomatic agent is immune from the receiving state''s criminal jurisdiction, and from civil and administrative jurisdiction save for private immovable property, private succession, and professional or commercial activity outside official functions. Person (art 29), residence and papers (art 30) are inviolable; the agent must obey local law (art 41). Premises are inviolable (art 22); persona non grata (art 9). Consuls: VCCR arts 41, 43.'
    analogy:
      text: 'A guest in your home: however badly they behave, you may not search their suitcase or lock them up — but you can ask them to leave. And you must keep intruders away from them.'
      maps:
        - from: the guest
          to: the diplomatic agent
        - from: the suitcase you may not search
          to: inviolable residence, papers and correspondence (art 30)
        - from: asking the guest to leave
          to: declaring the diplomat persona non grata (art 9)
        - from: keeping intruders away
          to: the duty to protect the mission (art 22(2))
      limits:
        - Only the guest's own family could excuse them from your house rules; likewise only the sending state, not the diplomat, can waive immunity.
    terms:
      - term: receiving state and sending state
        gloss: 'Receiving: where diplomatic staff are posted. Sending: the state they come from and represent — the one that can waive their immunity.'
      - term: inviolability
        gloss: 'Protection from the receiving state''s coercion: the agent cannot be arrested (art 29); mission premises cannot be entered without the head of mission''s consent (art 22).'
      - term: persona non grata (art 9)
        gloss: The receiving state's declaration that a diplomat's presence is not acceptable, revoking their credentials.
        example: The US declaring Russian diplomats persona non grata after alleged interference in the 2016 elections.
      - term: self-contained regime
        gloss: 'Tehran Hostages: diplomatic law sets out the receiving state''s obligations and also its means to counter abuse.'
    misconceptions:
      - claim: A diplomat's criminal immunity has the same three exceptions as civil immunity under art 31.
        tempting: Art 31 lists exceptions right after the immunities.
        correction: The exceptions apply only to civil and administrative jurisdiction. Immunity from the receiving state's criminal jurisdiction is absolute.
      - claim: Embassy inviolability only stops the receiving state's own police from entering.
        tempting: Inviolability is usually pictured as 'keep out'.
        correction: Art 22(2) adds a positive duty to protect the premises against intrusion or damage. Iran breached it by failing to stop the militants in Tehran Hostages.
      - claim: Consuls have the same immunities as diplomats.
        tempting: Both are covered by Vienna Conventions and represent the sending state.
        correction: 'Consular immunities are more restricted: a consul can be arrested for a ''grave crime'' (VCCR art 41) and has only functional immunity in criminal and civil matters (art 43).'
    socratic:
      - ask: Julian Assange, fighting extradition, takes refuge in Ecuador's embassy in London. Can UK police enter to arrest him?
        hint: VCDR art 22.
        answer: No. The mission premises are inviolable and may not be entered without the head of mission's consent, whoever is inside. Assange's own lack of immunity does not change that.
      - ask: Protesters then threaten to break into the embassy. What must the UK do?
        hint: Art 22(2); Tehran Hostages.
        answer: 'Protect the premises against intrusion or damage. The duty is positive: Iran breached it by doing nothing while militants seized the US Embassy.'
      - ask: A diplomat at the embassy runs a private consultancy on weekends and is sued by a client. Immune?
        hint: Art 31(c).
        answer: No. Civil immunity does not cover professional or commercial activity outside official functions. A criminal charge, by contrast, would be barred completely.
      - ask: A diplomat commits a serious crime and cannot be prosecuted. What can the receiving state do?
        hint: Slide 37.
        answer: Declare the diplomat persona non grata (art 9), sever relations, take other unfriendly acts, do nothing — or ask the sending state to waive immunity.
      - ask: Would the answer differ for a consul?
        hint: VCCR arts 41 and 43.
        answer: Yes. A consul can be arrested for a grave crime and has only functional immunity in criminal and civil matters.
    elements:
      - name: Who is protected
        test: Diplomatic agents fully; household family unless receiving-state nationals; administrative and technical staff narrower; service staff for official duties only — not local nationals or permanent residents.
      - name: The agent's person and immunity
        test: No arrest (art 29); absolute criminal immunity; civil immunity save private immovable property, private succession and outside commercial activity (art 31).
        authorities:
          - vcdr-arts-29-30
          - vcdr-art-31
      - name: Premises and property
        test: Premises inviolable without the head of mission's consent, and the host must protect them; property, transport and archives immune from search and execution (arts 22, 24).
        cases:
          - united-states-diplomatic-and-consular-staff-in-tehran-united-states-of-america-v-iran
        authorities:
          - vcdr-art-22
          - vcdr-art-24
      - name: Consuls
        test: Limited inviolability — arrest for a grave crime — and functional immunity only (VCCR arts 41, 43).
        authorities:
          - vccr-arts-41-43
      - name: Responses to abuse
        test: 'The agent must respect local law (art 41). Remedies: persona non grata (art 9), severance, unfriendly acts, doing nothing, or waiver by the sending state.'
        authorities:
          - vcdr-art-41
          - vcdr-art-9
    what-if:
      - change: The diplomat's spouse, part of the household, is a national of the receiving state.
        effect: 'The spouse does not enjoy immunity from jurisdiction: family members are covered only if they are not nationals of the receiving state.'
      - change: The mission's cook, not a local national or permanent resident, causes an accident while shopping privately.
        effect: 'Not immune: service staff are immune only for acts performed in the course of their official duties.'
      - change: Ecuador's ambassador consents to UK police entering the embassy.
        effect: Inviolability yields to the head of mission's consent, so entry with that consent would not breach art 22.
    boundary:
      - text: An embassy car parked on a public street.
        why: 'Still protected: the mission''s means of transport are immune from search, requisition, attachment and execution, not just the embassy building.'
      - text: A real action over a holiday house the diplomat owns privately in the receiving state.
        why: 'Outside civil immunity: art 31(a) excepts real actions on private immovable property, unless held for the sending state for the mission.'
    transfer:
      - scenario: Police in a receiving state suspect an ambassador of smuggling. They want to stop his official car, search his residence and arrest him. Meanwhile protesters besiege his embassy.
        answer: 'The car, residence and papers are protected (arts 22, 24, 30), his person is inviolable (art 29) and he is immune from criminal jurisdiction (art 31). The state must also protect the embassy from the protesters (art 22(2); Tehran Hostages). Its lawful options: persona non grata (art 9), severing relations, or seeking a waiver from the sending state.'
    sources:
      - Week 06 - Lecture Slides - Immunities (slides 28–37)
      - Week 06 - Lecture Transcript (Online) - Immunities (Part B Diplomatic Immunities) (purpose of the regime, categories of staff, art 31 and its exceptions, arts 29, 30, 41, consuls, mission premises, Tehran Hostages, responses to abuse)
      - Week 06 - Tutorial Task - Immunities and Julian Assange (Q3–Q4)
    verify: false
  - concept: laws2000-w06-immunities-of-international-organisations
    plain: International organisations such as the UN are immune from local courts so they can work without interference and alike everywhere. Their staff are protected only for official acts. Victims may be left without a remedy.
    concrete: In 2010 a cholera outbreak in Haiti killed nearly 10,000 people. A UN-appointed panel concluded in 2011 that contamination from a UN peacekeepers' camp was a likely cause, though not the fault of any group or individual. The Secretary-General apologised, but the UN has not accepted legal responsibility. When human rights lawyers sued the UN in the United States, the federal courts upheld the UN's immunity in 2016.
    formal: 'IO immunities rest on treaties. UN Charter art 105: the UN has the privileges and immunities "necessary for the fulfillment of its purposes"; representatives and officials, those for "the independent exercise of their functions". 1946 Convention art II s 2: immunity "from every form of legal process" unless expressly waived, but "no waiver of immunity shall extend to any measure of execution"; premises and archives inviolable (ss 3–4).'
    terms:
      - term: functional immunity of IO officials
        gloss: IO officials are immune only for acts carried out in their functions — never personal immunity.
      - term: representatives, officials, experts on missions
        gloss: 'The 1946 Convention''s three categories (arts IV, V s 18, VI): each immune for official words and acts; experts'' immunity continues after the mission.'
      - term: alternative mode of settlement (s 29)
        gloss: Because local courts are closed, the UN must provide another way to settle private law disputes — usually an arbitration clause in the contract.
      - term: privilege
        gloss: A benefit distinct from immunity from jurisdiction.
        example: UN officials pay no tax on their UN employment income in the country where they are posted.
    misconceptions:
      - claim: International organisations' immunities come from customary international law, like state immunity.
        tempting: State immunity is customary, and IOs are also subjects of international law.
        correction: 'IO immunities are based on treaty law: states grant them, e.g. UN Charter art 105 and the 1946 Convention.'
      - claim: Once the UN waives immunity and loses, the claimant can seize UN assets to enforce the judgment.
        tempting: A state that waives immunity cannot reclaim it after losing.
        correction: 'Art II s 2: "no waiver of immunity shall extend to any measure of execution", and UN property and assets are immune wherever located.'
      - claim: Senior UN officials enjoy personal immunity like a head of state.
        tempting: Some UN officials are very senior and travel like diplomats.
        correction: 'IO officials'' immunity is functional only: words spoken or written and acts performed in their official capacity (art 105(2); art V s 18).'
    socratic:
      - ask: Why give the UN immunity at all?
        hint: Where does it work, and under how many legal systems?
        answer: So it can carry out its functions without interference from the states where it operates, avoid frivolous actions against its staff, and be treated alike in every country.
      - ask: Where does that immunity come from?
        hint: Not custom.
        answer: 'Treaties: UN Charter art 105, filled in by the 1946 Convention on the Privileges and Immunities of the UN.'
      - ask: The UN waives immunity so a contractor's claim can be heard, and the contractor wins. Can it seize UN assets?
        hint: Art II s 2.
        answer: No. "No waiver of immunity shall extend to any measure of execution", and UN property and assets are immune wherever located.
      - ask: A UN statistician's official report allegedly defames a company. Is she immune?
        hint: Art V s 18.
        answer: Yes, for words written in her official capacity — functional immunity, not personal immunity.
      - ask: Haiti cholera victims sue the UN in New York. What happens, and what should the UN offer?
        hint: 2016; s 29.
        answer: US federal courts upheld the UN's immunity. Accountability then depends on the UN providing alternative modes of settlement or waiving immunity; it apologised but has not accepted legal responsibility.
    elements:
      - name: The organisation's immunity
        test: Privileges and immunities necessary for its purposes; immunity from every form of legal process unless expressly waived; no waiver extends to execution.
        authorities:
          - un-charter-art-105
          - cpiun-art-ii-ss-2-4
      - name: Premises, property and archives
        test: Premises inviolable; property and assets immune from search, requisition and confiscation; archives inviolable wherever located (ss 3–4).
        authorities:
          - cpiun-art-ii-ss-2-4
      - name: Persons
        test: 'Representatives of members, officials and experts on missions: immune for official words and acts; experts'' immunity continues after the mission (arts IV–VI).'
        authorities:
          - cpiun-arts-iv-vi
      - name: Accountability
        test: The UN must provide alternative modes of settling private law disputes (s 29) and may waive officials' immunity; otherwise victims may lack a remedy.
        cases:
          - stichting-mothers-of-srebrenica-and-others-v-the-netherlands
        authorities:
          - cpiun-s-29
    what-if:
      - change: The claimant is a former UN employee alleging wrongful dismissal.
        effect: The UN keeps its immunity in local courts but must provide an alternative mode of settlement for this private law dispute (s 29) — usually the arbitration clause in the employment contract.
      - change: The Secretary-General finds that keeping an official's immunity would impede the course of justice, and waiver would not prejudice the UN's interests.
        effect: The immunity may be waived — as the lecturer says is regularly done after car accidents, and was done for UN police shown to be responsible for rape.
      - change: The expert's UN mission ended two years before the claim.
        effect: 'Still immune for words and acts in the course of the mission: experts'' immunity continues even when they are no longer employed on UN missions (art VI).'
    boundary:
      - text: 'Mothers of Srebrenica: claims against the UN and the Netherlands over the 1995 genocide.'
        why: The Dutch Supreme Court (2012) and the ECtHR (2013) recognised UN immunity, so the claim went on against the Netherlands alone — immunity shields the IO, not its member states.
      - text: Australia's ambassador to the UN in New York.
        why: 'Not a UN official but a representative of a member (art IV): immune from personal arrest and for acts in that capacity, with papers inviolable.'
    transfer:
      - scenario: A UN agency's warehouse in Cambodia collapses, injuring local workers. They sue the UN in Cambodian courts and ask police to search the agency's records.
        answer: The UN is immune from every form of legal process unless it expressly waives (art II s 2); its premises are inviolable (s 3) and its archives inviolable wherever located (s 4), so the records cannot be searched. The workers' remedy lies in an alternative mode of settlement (s 29) or a waiver — which still would not extend to execution.
    sources:
      - Week 06 - Lecture Slides - Immunities (slides 38–44)
      - 'Week 06 - Lecture Recording (Online) - Immunities - Full Transcript (00:00–23:00: rationale, treaty basis, art 105, the 1946 Convention''s categories, premises and archives, s 29, waiver, Haiti cholera, Srebrenica)'
