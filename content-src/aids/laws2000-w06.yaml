  - concept: laws2000-w06-immunity-and-serious-international-crimes
    plain: 'Even for the gravest crimes, states keep immunity in foreign courts and sitting top officials stay immune. But immunity is not impunity: other routes remain, and former officials may lose protection for torture.'
    concrete: 'A Belgian court, using Belgium''s universal jurisdiction law, issued an arrest warrant on 11 April 2000 for the Democratic Republic of the Congo''s sitting foreign minister, accused of international crimes. The DRC took Belgium to the ICJ. The Court held the warrant violated the minister''s immunity: state practice supports no exception for international crimes. But it stressed that immunity "does not mean" impunity, and listed four routes by which he could still be prosecuted.'
    formal: 'Germany v Italy (ICJ, 2012): state immunity rules "are procedural in character", "entirely distinct from the substantive law" (para 93), and cover armed forces in armed conflict, even on the forum''s territory (para 77). Arrest Warrant (ICJ, 2002) paras 58–61: no exception for international crimes; immunity is not impunity. Pinochet (No 3) (1999): no immunity for a former head of state for torture subject to universal jurisdiction.'
    analogy:
      text: 'Immunity is a locked courtroom door: it stops this court hearing the case now. It says nothing about guilt, and other doors may still open.'
      maps:
        - from: the locked door
          to: procedural immunity
        - from: guilt or innocence
          to: substantive criminal responsibility, which immunity does not touch
        - from: the other doors
          to: home courts, waiver, trial after office, international criminal courts
      limits:
        - 'For a state sued civilly (Germany v Italy) there is no ''after office'': that door may stay shut indefinitely.'
    terms:
      - term: procedural v substantive
        gloss: Immunity decides whether a court may hear the case; lawfulness and criminal responsibility are substantive questions it leaves untouched.
      - term: the four avenues (Arrest Warrant)
        gloss: The official's own courts; waiver by their state; other states' courts after office (acts before or after office, private acts during it); international criminal courts.
      - term: ILC draft article 7 (2017)
        gloss: Would exclude immunity for genocide, crimes against humanity, war crimes, torture and enforced disappearances. Whether it reflects state practice is debated.
    misconceptions:
      - claim: A breach of jus cogens strips a state of immunity in foreign courts.
        tempting: Peremptory norms override other rules, and the crimes are grave.
        correction: 'Germany v Italy: immunity is procedural and "entirely distinct from the substantive law", so there is no conflict; as of 2012 custom did not deprive states of immunity for serious violations of human rights law or IHL.'
      - claim: Because a sitting foreign minister is immune, he enjoys impunity for his crimes.
        tempting: If no foreign court can try him, nothing seems to happen.
        correction: '"Immunity ... does not mean ... impunity" (Arrest Warrant): he can be tried at home, after waiver, by other states once out of office, or before international criminal courts with jurisdiction.'
      - claim: The House of Lords lifted Pinochet's immunity because the prohibition on torture is jus cogens.
        tempting: Some judges did take that view.
        correction: 'The supplemental lecture: a few judges relied on jus cogens, but the majority relied on the UK, Chile and Spain all being parties to the Convention against Torture.'
    socratic:
      - ask: Families sue Germany in Italian courts over WWII crimes by German forces in Italy. Does the gravity of the crimes defeat Germany's immunity?
        hint: Procedural or substantive?
        answer: No. State immunity is procedural, "entirely distinct from the substantive law"; the ICJ found custom did not remove immunity for serious violations of human rights law or IHL.
      - ask: The acts happened on Italian soil. Doesn't that help?
        hint: Para 77.
        answer: No. Immunity for acta jure imperii extends to acts of armed forces in armed conflict, even on the forum state's territory.
      - ask: Belgium issues a warrant for the DRC's sitting foreign minister for international crimes. Lawful?
        hint: Personal immunity.
        answer: No. State practice supports no exception to a serving foreign minister's immunity for international crimes; issuing the warrant violated it (Arrest Warrant).
      - ask: Is the minister therefore beyond justice?
        hint: Immunity is not impunity.
        answer: No. He can be tried at home, after waiver, by other states once out of office (acts before or after office, private acts during it), or before an international criminal court with jurisdiction.
      - ask: Pinochet, a former head of state, faces Spain's extradition request for torture. Immune?
        hint: Former, not serving; the Convention against Torture.
        answer: No. A former head of state has no immunity for acts that were international crimes subject to a form of universal jurisdiction — torture, with the UK, Chile and Spain all parties to the Convention.
    elements:
      - name: State sued civilly
        test: Immune for acta jure imperii even for grave breaches, including armed forces in armed conflict on the forum state's territory.
        cases:
          - jurisdictional-immunities-of-the-state-germany-v-italy-greece-intervening
      - name: Serving high official, criminal proceedings
        test: Personal immunity bars foreign national courts, even for international crimes.
        cases:
          - arrest-warrant-of-11-april-2000-democratic-republic-of-congo-v-belgium
      - name: Routes despite immunity
        test: Own state's courts; waiver; other states once out of office (acts before or after office, private acts during it); international criminal courts with jurisdiction.
        cases:
          - arrest-warrant-of-11-april-2000-democratic-republic-of-congo-v-belgium
      - name: Former official, international crime
        test: Functional immunity may not cover torture subject to universal jurisdiction (Pinochet (No 3)); ILC draft art 7 would go further, but its status is contested.
        cases:
          - r-v-bow-street-metropolitan-stipendiary-magistrate-ex-parte-pinochet-ugarte-no-3
        authorities:
          - ilc-immunity-of-state-officials-draft-art-7
    what-if:
      - change: The Congolese minister had already left office when Belgium issued the warrant.
        effect: Personal immunity would have ended. Belgium could try him for acts before or after office and private acts during it; official acts stay covered by functional immunity, subject to the Pinochet argument for international crimes.
      - change: The UK, Chile and Spain had not all been parties to the Convention against Torture.
        effect: The majority's basis in Pinochet (No 3) — a shared treaty regime giving universal jurisdiction over torture — would fall away, leaving only the minority's jus cogens reasoning.
      - change: Victims prosecute individual German soldiers for the WWII crimes, rather than suing Germany civilly.
        effect: 'A different regime: officials'' immunity, not state immunity. Functional immunity would be in issue, and the Pinochet and ILC draft art 7 arguments on international crimes would arise.'
    boundary:
      - text: The International Criminal Court proceeding against a sitting head of state.
        why: 'Outside the Arrest Warrant bar: personal immunity protects against foreign national courts, but international criminal courts with jurisdiction may proceed.'
      - text: ILC draft article 7 (2017).
        why: 'At the edge of the law: it would exclude immunity for five international crimes, but the ILC''s members disagreed whether state practice supports it.'
    transfer:
      - scenario: The serving head of state of State T attends a summit in State S. S's prosecutors want to arrest her for crimes against humanity under S's universal jurisdiction law. Victims ask what can be done.
        answer: 'S''s courts cannot proceed: a serving head of state has personal immunity before foreign national courts, even for international crimes (Arrest Warrant). But immunity is not impunity: she may be tried in T''s courts, after T waives immunity, by S once she leaves office (acts before or after office, private acts during it), or before an international criminal court with jurisdiction.'
    objections:
      - position: Immunity should give way where grave international crimes are alleged.
        evidence: Critics say Germany v Italy promotes impunity for clearly illegal acts; Pinochet (No 3) and ILC draft art 7 point towards exceptions for international crimes.
        objection: '"Powerful policy arguments may be advanced in favour of such an exception, but state practice does not, at present, support" it (Rose et al); whether draft art 7 reflects practice is debated.'
    sources:
      - Week 06 - Lecture Slides - Immunities (slides 18–20, 25–27)
      - 'Week 06 - Lecture Recording (Live) - Immunities - Full Transcript (31:00–39:00 and 47:00–52:00: Germany v Italy, Arrest Warrant and the four avenues)'
