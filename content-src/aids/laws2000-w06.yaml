flows:
  - slug: is-the-foreign-state-immune
    title: Is the foreign state immune from this civil claim?
    summary: Runs a claim against a foreign state through the definition of 'State', consent and waiver, the commercial and other exceptions, and the armed-forces rule from Germany v Italy.
    start: i1
    concepts:
      - laws2000-w06-state-immunity-foundations
      - laws2000-w06-restrictive-state-immunity
      - laws2000-w06-immunity-and-serious-international-crimes
    sources:
      - Week 06 - Lecture Slides - Immunities (slides 5–20)
      - Week 06 - Lecture Recording (Live) - Immunities - Full Transcript (00:00–39:00)
    nodes:
      - id: i1
        kind: ask
        text: Is the defendant 'the State'?
        note: 'Organs of government; federal units, subdivisions and agencies entitled to exercise sovereign authority; representatives acting in that capacity (art 2(1)(b)). Apply custom: the 2004 Convention is not in force.'
        authorities:
          - uncsi-2004-art-2-1-b
        branches:
          - label: 'Yes'
            to: i2
          - label: 'No'
            to: e-no-state
      - id: i2
        kind: ask
        text: Has the state consented — expressly, by taking part in the proceedings, or by bringing the claim now met with a counterclaim?
        authorities:
          - uncsi-2004-arts-7-9
        branches:
          - label: 'Yes'
            to: e-waived
          - label: 'No'
            to: i3
      - id: i3
        kind: ask
        text: Does the claim arise from a commercial transaction with a foreign natural or juridical person?
        note: Goods, services, loans or other commercial dealings, not employment (art 2(1)(c)). Judge by nature, not purpose, unless the parties agreed (art 2(2)); profit is irrelevant (Playa Largo).
        cases:
          - playa-largo-v-i-congreso-del-partido
        authorities:
          - uncsi-2004-art-2-1-c
          - uncsi-2004-art-2-2
        branches:
          - label: 'Yes'
            to: i4
          - label: 'No'
            to: i5
      - id: i4
        kind: ask
        text: Was it a transaction between states, or did the parties expressly agree to keep immunity?
        authorities:
          - uncsi-2004-art-10
        branches:
          - label: 'Yes'
            to: e-immune
          - label: 'No'
            to: e-commercial
      - id: i5
        kind: ask
        text: Is it a claim for death, injury or property damage caused in the forum state by an act attributable to the state, its author present there?
        authorities:
          - uncsi-2004-art-12
        branches:
          - label: 'Yes'
            to: e-art12
          - label: Yes — but by armed forces in armed conflict
            to: e-armed
          - label: 'No'
            to: i6
      - id: i6
        kind: ask
        text: Does it fall within another listed exception — employment, property, intellectual property, companies, commercial ships or arbitration?
        authorities:
          - uncsi-2004-arts-11-17
        branches:
          - label: 'Yes'
            to: e-other
          - label: 'No'
            to: i7
      - id: i7
        kind: step
        text: 'What remains is a sovereign act (jure imperii): foreign and military affairs, legislation, police power, administration of justice.'
        note: 'Serious violations of human rights law or IHL do not change this: immunity is procedural, "entirely distinct from the substantive law" (Germany v Italy para 93).'
        cases:
          - jurisdictional-immunities-of-the-state-germany-v-italy-greece-intervening
        next: e-immune
      - id: e-no-state
        kind: end
        tone: not-met
        text: 'No state immunity: the defendant is not the state or an entity exercising its sovereign authority.'
      - id: e-waived
        kind: end
        tone: not-met
        text: 'No immunity: the state has consented, and a waiver cannot be withdrawn once judgment goes against it.'
      - id: e-immune
        kind: end
        tone: met
        text: 'Immune: the court must decline jurisdiction. Immunity from enforcement against the state''s property is a further, separate shield.'
      - id: e-commercial
        kind: end
        tone: not-met
        text: No immunity for this commercial transaction (art 10; Trendex; Playa Largo).
        cases:
          - trendex-trading-corporation-v-central-bank-of-nigeria
          - playa-largo-v-i-congreso-del-partido
      - id: e-art12
        kind: end
        tone: not-met
        text: No immunity from a claim for pecuniary compensation under art 12.
      - id: e-armed
        kind: end
        tone: met
        exception: true
        text: 'Immune: acta jure imperii by armed forces in armed conflict stay immune, even on the forum''s territory (Germany v Italy para 77).'
        cases:
          - jurisdictional-immunities-of-the-state-germany-v-italy-greece-intervening
      - id: e-other
        kind: end
        tone: not-met
        text: No immunity in proceedings of this kind (arts 11, 13–17).
  - slug: is-the-official-immune-from-prosecution
    title: Is this state official immune from prosecution?
    summary: Asks which court is acting, whether the state has waived, the official's rank and time in office, the character of the act and whether it is an international crime.
    start: o1
    concepts:
      - laws2000-w06-immunities-of-state-officials
      - laws2000-w06-immunity-and-serious-international-crimes
    sources:
      - Week 06 - Lecture Slides - Immunities (slides 22–27)
      - Week 06 - Lecture Recording (Live) - Immunities - Full Transcript (39:00–52:00)
      - Week 06 - Supplemental Lecture - Functional Immunity and Pinochet - Full Transcript (00:00–05:00)
    nodes:
      - id: o1
        kind: ask
        text: Which court wants to try the official?
        branches:
          - label: An international criminal court with jurisdiction
            to: e-intl
          - label: The official's own state's courts
            to: e-own
          - label: Another state's national courts
            to: o2
      - id: o2
        kind: ask
        text: Has the official's state waived the immunity?
        note: The immunity belongs to the state; the official cannot waive it personally.
        branches:
          - label: 'Yes'
            to: e-waived
          - label: 'No'
            to: o3
      - id: o3
        kind: ask
        text: Is the official a serving head of state, head of government or foreign minister?
        cases:
          - certain-questions-of-mutual-assistance-in-criminal-matters-djibouti-v-france
        branches:
          - label: Yes — still in office
            to: e-personal
          - label: No, or no longer in office
            to: o4
      - id: o4
        kind: ask
        text: Was the act done in an official capacity, with official authority?
        note: '''Under the colour of authority'': e.g. a soldier killing an enemy soldier in battle. A drunken holiday drive is a private act.'
        branches:
          - label: Yes — an official act
            to: o5
          - label: No — a private act
            to: e-private
      - id: o5
        kind: ask
        text: Is the act an international crime subject to a form of universal jurisdiction, such as torture?
        authorities:
          - ilc-immunity-of-state-officials-draft-art-7
        branches:
          - label: 'No'
            to: e-functional
          - label: 'Yes'
            to: e-pinochet
      - id: e-intl
        kind: end
        tone: not-met
        text: 'No bar: international criminal courts with jurisdiction may try even incumbent officials (Arrest Warrant).'
        cases:
          - arrest-warrant-of-11-april-2000-democratic-republic-of-congo-v-belgium
      - id: e-own
        kind: end
        tone: not-met
        text: No immunity under international law in the official's own state's courts.
      - id: e-waived
        kind: end
        tone: not-met
        text: 'No immunity: the state has waived it.'
      - id: e-personal
        kind: end
        tone: met
        text: 'Immune: personal immunity covers official and private acts, even international crimes (Arrest Warrant). It ends with the office.'
        cases:
          - arrest-warrant-of-11-april-2000-democratic-republic-of-congo-v-belgium
      - id: e-private
        kind: end
        tone: not-met
        text: 'Not immune: functional immunity covers only official acts.'
      - id: e-functional
        kind: end
        tone: met
        text: 'Immune: functional immunity for the official act, continuing after office.'
      - id: e-pinochet
        kind: end
        tone: qualified
        exception: true
        text: 'Possibly no immunity: Pinochet (No 3) denied it to a former head of state for torture; ILC draft art 7 would go further, but whether custom agrees is contested.'
        cases:
          - r-v-bow-street-metropolitan-stipendiary-magistrate-ex-parte-pinochet-ugarte-no-3
