  - concept: laws2000-w06-immunities-of-state-officials
    plain: State officials are protected abroad because they act for their state. Top leaders are fully immune while in office; every official stays immune for official acts, even after leaving office.
    concrete: 'The lecturer''s example: the sitting president of Greece, on holiday in Australia, drives drunk and kills someone. An Australian court cannot try the president — a head of state in office has personal immunity, covering even private acts. Greek courts could. And if the former president visits Australia after leaving office, the immunity is gone: a drunken holiday drive was never an official act, so functional immunity does not cover it.'
    formal: 'Officials'' immunity is customary and belongs to the state: foreign ministers'' immunities are "not granted for their personal benefit, but to ensure the effective performance of their functions" (Arrest Warrant [2002] ICJ Rep 3). Functional immunity (ratione materiae): official acts, "under the colour of authority"; survives office. Personal immunity (ratione personae): heads of state, heads of government, foreign ministers; covers private acts; ends with office (Djibouti v France).'
    analogy:
      text: An umbrella and a waterproof coating. Personal immunity is an umbrella held over a top leader — it covers everything, but is handed back on leaving office. Functional immunity is a coating on each official act, which stays on that act for good.
      maps:
        - from: the umbrella
          to: personal immunity (ratione personae)
        - from: handing the umbrella back
          to: personal immunity ending with the office
        - from: the coating on each act
          to: functional immunity (ratione materiae), which survives office
      limits:
        - Neither keeps the official dry in their own state's courts — the immunities apply only before foreign courts.
        - 'The state, not the official, decides whether to fold the umbrella: only the state can waive.'
    terms:
      - term: functional immunity (ratione materiae)
        gloss: 'Attaches to the act: official acts done with official authority. Continues after the official leaves office; waivable only with the state''s consent.'
      - term: personal immunity (ratione personae)
        gloss: 'Attaches to the office: complete, even for private acts, but only for very high-ranking officials and only while in office.'
      - term: '"under the colour of authority"'
        gloss: 'The test of an official act: done by the individual with official authority.'
        example: A soldier who kills an enemy soldier on the battlefield.
    misconceptions:
      - claim: Personal immunity protects a former head of state for life.
        tempting: It is the widest immunity, attached to the highest office.
        correction: 'It has a temporal limit: it lasts only while the official is in office. Afterwards only functional immunity remains, for official acts.'
      - claim: An official can waive their own immunity and choose to stand trial.
        tempting: The official is the person the immunity protects.
        correction: The immunity belongs to the state, not the person ("not granted for their personal benefit"). Only the state can waive it.
      - claim: Any official on an official visit abroad has personal immunity.
        tempting: The visit is on the state's business.
        correction: Personal immunity applies only to very high-ranking officials — in particular heads of state, heads of government and foreign ministers. Other officials have functional immunity for official acts only.
    socratic:
      - ask: The sitting Greek president drives drunk on holiday in Australia and kills someone. Is this an official act?
        hint: Holiday driving.
        answer: No — it is a private act, so functional immunity cannot help. The question is whether personal immunity applies.
      - ask: Does it?
        hint: Who holds personal immunity, and what does it cover?
        answer: Yes. A head of state in office has personal immunity, complete even for private acts, so an Australian court cannot try the president.
      - ask: Could Greek courts try the president?
        hint: Immunity from whose jurisdiction?
        answer: Yes. These immunities apply only before foreign courts; officials have no immunity under international law in their own state's courts.
      - ask: Two years after leaving office, the former president returns to Australia. Now?
        hint: Which immunity survives office?
        answer: Personal immunity ended with the office, and functional immunity covers only official acts — so the former president can be prosecuted for this private act.
      - ask: A junior trade official signs a document abroad on her state's instructions. Is she immune for it?
        hint: Official act; rank.
        answer: 'Yes, functionally: she acted with official authority. She has no personal immunity, but functional immunity covers the act and continues after her mission ends.'
    elements:
      - name: Before a foreign court
        test: Officials' immunities apply only before another state's courts; there is none under international law in their own state's courts.
      - name: Personal immunity — rank and office
        test: 'Serving heads of state, heads of government and foreign ministers: complete immunity, even for private acts, while in office.'
        cases:
          - arrest-warrant-of-11-april-2000-democratic-republic-of-congo-v-belgium
          - certain-questions-of-mutual-assistance-in-criminal-matters-djibouti-v-france
      - name: Functional immunity — official act
        test: Acts performed with official authority ('under the colour of authority'); available to officials generally; survives leaving office.
        cases:
          - arrest-warrant-of-11-april-2000-democratic-republic-of-congo-v-belgium
      - name: Waiver by the state
        test: Either immunity can be waived, but only by the state, never by the individual.
    what-if:
      - change: The drunk driver is a junior trade official, not the president.
        effect: No personal immunity, which is reserved for the highest officials; and driving drunk on holiday is a private act, so no functional immunity either. The official can be prosecuted.
      - change: Greece expressly waives the sitting president's immunity.
        effect: 'The Australian court could proceed: the immunity belongs to the state, which may waive it.'
      - change: A former foreign minister is sued over a treaty negotiation he conducted in office.
        effect: Personal immunity has ended, but the negotiation was an official act, so functional immunity continues to protect him.
    boundary:
      - text: A serving defence minister.
        why: 'At the edge: the slides say personal immunity applies "in particular" to heads of state, heads of government and foreign ministers. Safe ground for other ministers is functional immunity for official acts.'
      - text: A soldier who kills an enemy soldier on the battlefield.
        why: 'Inside functional immunity: an official act done with the state''s authority (lecture example).'
    transfer:
      - scenario: A visiting prime minister signs a trade deal in the host state one evening. The same night her chief of staff assaults a hotel worker after a private dinner.
        answer: The prime minister, a serving head of government, has personal immunity covering all acts while in office. The chief of staff is not a head of state, head of government or foreign minister, so has only functional immunity for official acts — which does not cover a private assault. The host state's courts may try the chief of staff.
    sources:
      - Week 06 - Lecture Slides - Immunities (slides 21–24)
      - 'Week 06 - Lecture Recording (Live) - Immunities - Full Transcript (39:00–47:00: rationale, Arrest Warrant, functional and personal immunity, soldier and Greek president examples)'
