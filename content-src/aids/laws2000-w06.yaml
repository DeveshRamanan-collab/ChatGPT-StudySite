aids:
  - concept: laws2000-w06-state-immunity-foundations
    plain: A state cannot normally be sued in another state's courts, or have a judgment enforced against it, without its consent — because states are equals. Immunity blocks the case; it does not excuse the conduct.
    concrete: 'The lecturer''s example: New Zealand does something wrongful and is sued in an Australian court. Because states are sovereign equals, the Australian court must rule on immunity first and, if New Zealand is immune, refuse to hear the case — nor can New Zealand''s property here be seized. But had New Zealand taken part in the proceedings, it would have waived immunity, and could not reclaim it once judgment went against it.'
    formal: 'State immunity is customary international law, grounded in sovereign equality. The UN Convention on Jurisdictional Immunities of States and their Property 2004 (not in force: 25 of 30 ratifications) mostly reflects custom: a state is immune "in respect of itself and its property" (art 5); courts refrain from jurisdiction (art 6); no immunity on express consent (art 7), participation (art 8) or counterclaim (art 9). "State": art 2(1)(b).'
    terms:
      - term: immunity from adjudication
        gloss: A foreign state cannot be sued before the forum state's courts unless it consents.
      - term: immunity from enforcement
        gloss: A judgment given against a state cannot be enforced upon it, e.g. by confiscating its assets. The question arises only after jurisdiction and judgment.
      - term: procedural bar
        gloss: Immunity is decided first and only stops the court hearing the case; it says nothing about whether the state's conduct was lawful.
      - term: '"State" (art 2(1)(b))'
        gloss: Organs of government; federal units, subdivisions and agencies entitled to exercise sovereign authority; and representatives acting in that capacity.
    misconceptions:
      - claim: The 2004 UN Convention governs state immunity, so an answer should apply it as treaty law.
        tempting: The lecture cites its articles throughout.
        correction: It needs 30 ratifications and has 25, so it is not in force. Apply customary international law, citing the Convention's articles only because they mostly reflect custom.
      - claim: If a court finds a foreign state immune, it has found the state's conduct lawful.
        tempting: The state 'wins' the case.
        correction: 'Immunity is procedural: the ruling only bars the court from hearing the case and does not affect the substantive rule — the conduct may still be unlawful.'
      - claim: A state that defends a case and loses can still claim immunity to resist the judgment.
        tempting: Immunity is a shield a state can raise at any point.
        correction: Participating in proceedings waives immunity (art 8), and once waived it cannot be reclaimed when judgment goes against the state.
    socratic:
      - ask: A company sues State X in an Australian court over X's conduct. What must the court decide first?
        hint: A procedural bar.
        answer: Whether X is immune. Immunity is a preliminary, procedural question decided before the merits.
      - ask: Why should X be immune at all?
        hint: Sovereign equality.
        answer: States are juridically equal, so no state may exercise jurisdiction over another without its consent; one state's court judging another would infringe that equality.
      - ask: Does the 2004 Convention govern?
        hint: Count the ratifications.
        answer: No — it needs 30 and has 25, so it is not in force. Apply customary international law, using the Convention's articles as a guide because they mostly reflect custom.
      - ask: X files a defence, argues for a year, loses, then claims immunity. Result?
        hint: Arts 7–9.
        answer: Too late. Participating in the proceedings waived immunity (art 8), and a waived immunity cannot be reclaimed when judgment goes against the state.
      - ask: Suppose the defendant is X's export-licensing agency, not X itself. Is it 'the State'?
        hint: Art 2(1)(b).
        answer: Yes, to the extent it is entitled to perform acts in the exercise of X's sovereign authority.
    elements:
      - name: The defendant is 'the State'
        test: Organs of government; subdivisions or agencies entitled to exercise sovereign authority; or representatives acting in that capacity.
        authorities:
          - uncsi-2004-art-2-1-b
      - name: Immunity is the starting point
        test: A state is immune for itself and its property, and courts refrain from exercising jurisdiction (arts 5–6). UK and Australian statutes presume immunity.
        authorities:
          - uncsi-2004-arts-5-6
          - state-immunity-act-1978-uk-s1
          - foreign-states-immunities-act-1985-cth
      - name: No consent given
        test: Immunity is lost by express consent (art 7), participation in proceedings (art 8) or counterclaim (art 9); once waived, it cannot be reclaimed.
        authorities:
          - uncsi-2004-arts-7-9
      - name: Adjudication or enforcement?
        test: 'Separate questions: immunity from enforcement arises only after adjudicative jurisdiction is established and a judgment entailing enforcement is given.'
    what-if:
      - change: State X had agreed in its contract to submit disputes to Australian courts.
        effect: 'That is express consent (art 7): X has no immunity from adjudication in proceedings covered by the agreement.'
      - change: Judgment has been given against X, and the plaintiff now asks to seize X's property in Australia.
        effect: 'This engages immunity from enforcement, a separate question from adjudication: a judgment may still not be enforceable against the state''s property.'
      - change: The claim is brought in an English court instead.
        effect: 'Same starting point under the State Immunity Act 1978: immunity is a preliminary matter and presumed, with the plaintiff bearing the burden of proving otherwise.'
    boundary:
      - text: A municipality exercising the state's sovereign authority.
        why: 'Inside ''the State'': political subdivisions entitled to perform acts in the exercise of sovereign authority are covered by art 2(1)(b).'
      - text: Australia legislating about a foreign state's conduct.
        why: 'Outside immunity: immunity limits adjudicative and enforcement jurisdiction, not prescriptive jurisdiction.'
    transfer:
      - scenario: A foreign state's tourism board, which issues official tourism licences on its government's behalf, is sued in Sydney by an Australian travel agent. The board's lawyers say nothing about immunity and defend the claim for months.
        answer: The board is likely 'the State' — an agency entitled to exercise sovereign authority (art 2(1)(b)). But by participating in the proceedings it has waived immunity (art 8, reflecting custom). The court may decide the merits, and the board cannot reclaim immunity if it loses.
    sources:
      - Week 06 - Lecture Slides - Immunities (slides 3–10)
      - 'Week 06 - Lecture Recording (Live) - Immunities - Full Transcript (00:00–18:00: rationale, adjudication and enforcement, procedural nature, the 2004 Convention, arts 5–9, definition of ''State'', UK and Australian Acts)'
