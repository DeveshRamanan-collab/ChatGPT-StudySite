  - concept: laws2000-w03-authority-to-conclude-a-treaty
    plain: Each state's own law decides who may make treaties for it; internationally, heads of state, heads of government and foreign ministers can act without proof, and everyone else needs 'full powers'.
    concrete: 'The US and the Paris Agreement: in 2016 President Obama joined it by executive order; in 2017 President Trump withdrew by executive order; in 2021 President Biden rejoined; in 2025 Trump withdrew again. No Senate vote was needed, because a US President can bind the country through executive agreements. The lecturer notes this would not happen in Australia.'
    formal: 'Domestic law decides: UK — the Crown under the foreign-relations prerogative, but treaties must be laid before Parliament before ratification (Constitutional Reform and Governance Act 2010 s 20); US — two-thirds Senate consent for treaties, yet presidential executive agreements bind; Australia — the executive (Constitution s 61). VCLT art 7: full powers, or heads of state, government and foreign ministers.'
    analogy:
      text: 'A company signing contracts: its chief executive can sign without showing anything, but any other employee needs a signed letter of authority — and the company''s own rules decide who may sign at all.'
      maps:
        - from: the chief executive signing freely
          to: heads of state, heads of government and foreign ministers (art 7(2)(a))
        - from: an employee's letter of authority
          to: full powers (art 7(1))
        - from: the company's own rules
          to: each state's domestic law on treaty-making
      limits:
        - A company may escape a contract signed without internal authority; a state can rarely escape a treaty by citing its own internal law (art 46).
    terms:
      - term: full powers
        gloss: A document from the competent authority designating a person to represent the state — e.g. Singapore's Foreign Minister authorising its Trade Minister to sign an investment agreement.
      - term: executive agreement
        gloss: In the US, an agreement the President makes without Senate approval; still binding on the parties under international law.
      - term: royal prerogative (foreign relations)
        gloss: The UK Crown's power, exercised by the government, to conclude treaties; s 20 of the 2010 Act requires laying before Parliament before ratification.
      - term: s 61 of the Constitution
        gloss: Vests executive power, including concluding treaties, in the Australian executive; DFAT and the AG's Office of International Law manage treaties in practice.
    misconceptions:
      - claim: International law decides which officials may conclude treaties for a state.
        tempting: Treaties are international acts, so international rules should govern who makes them.
        correction: This is not resolved by international law; look at each state's domestic law. Art 7 VCLT only tells other states whom they may treat as representing a state.
      - claim: The attorney-general is one of the three officials who need no full powers.
        tempting: The Attorney-General's Office of International Law helps manage Australian treaties.
        correction: Art 7(2)(a) names heads of state, heads of government and ministers for foreign affairs; everyone else should produce full powers.
      - claim: A US executive agreement binds only domestically until the Senate approves it.
        tempting: Formal US treaties need the advice and consent of two-thirds of the Senate.
        correction: Though not brought before the Senate, executive agreements "are still binding on the parties under international law" (slide 10) — as the Paris Agreement shows.
    socratic:
      - ask: Australia's Minister of Agriculture signs a fisheries accord in Bali. Which law decides whether that minister could bind Australia?
        hint: Start at home.
        answer: 'Australian law: s 61 vests treaty power in the executive, and the Foreign Minister and DFAT hold responsibility for treaties.'
      - ask: How would Indonesia know the minister had authority?
        hint: Art 7(1).
        answer: The minister should produce full powers — a letter from the Foreign Minister authorising signature.
      - ask: Who could have signed for Australia without producing full powers?
        hint: Art 7(2)(a) names three officials.
        answer: The head of state, the head of government (the Prime Minister) or the Minister for Foreign Affairs.
      - ask: Could a US President bind the US to such an accord without the Senate?
        hint: Think of the Paris Agreement.
        answer: Yes, by executive agreement, which is binding under international law without Senate approval.
    elements:
      - name: Domestic authority
        test: 'Under the state''s own law, may this person or organ conclude treaties? UK: Crown, laid before Parliament (s 20). US: Senate, or executive agreement. Australia: the executive (s 61).'
        authorities:
          - australian-constitution-cth-s61
          - constitutional-reform-and-governance-act-2010-uk-s20
      - name: Presumed representatives
        test: Heads of state, heads of government and foreign ministers represent the state for all acts relating to concluding a treaty, without full powers (art 7(2)(a)).
        authorities:
          - vclt-art-7
      - name: Full powers
        test: Anyone else represents the state if they produce appropriate full powers, or if practice or circumstances show the states intended to dispense with them (art 7(1)).
        authorities:
          - vclt-art-7
    what-if:
      - change: The fisheries accord is signed by Australia's Foreign Minister instead.
        effect: 'A foreign minister is presumed to represent the state under art 7(2)(a) and needs no full powers. Whether Australia is bound still turns on consent: signature or ratification.'
      - change: The Agriculture Minister produces full powers signed by the Foreign Minister.
        effect: Under art 7(1)(a) the minister is considered to represent Australia for signing — just as Singapore's full-powers letter on the slides authorised its Trade Minister.
      - change: The minister signed in breach of an internal Australian procedure.
        effect: 'Australia cannot usually invoke that to escape the treaty: under art 46 only a manifest violation of an internal rule of fundamental importance counts.'
    boundary:
      - text: Heads of diplomatic missions and representatives at international conferences (art 7(2)(b)–(c)).
        why: They represent their state without full powers, but only for adopting a treaty's text — not for every act of concluding it, unlike the three officials in art 7(2)(a).
      - text: The UK's s 20 laying requirement.
        why: 'Parliament neither negotiates nor signs — the Crown does — yet a treaty must be laid before Parliament before ratification: a domestic check, not a transfer of the treaty power.'
    transfer:
      - scenario: At a regional summit, a state's deputy trade minister signs a customs treaty without producing any documents. Her government later says she had no authority.
        answer: Domestic law decides who may conclude treaties, but other states rely on art 7 VCLT. A deputy trade minister is not a head of state, head of government or foreign minister, so she needed full powers (art 7(1)(a)), unless practice or circumstances showed the states meant to dispense with them (art 7(1)(b)). Without either, she is not considered to represent her state.
    sources:
      - Week 03 - Lecture Slides - The Law of Treaties (slides 9–16, 18)
      - 'Week 03 - Lecture Recording (Live) - The Law of Treaties - Full Transcript (19:49–32:48: domestic authority in the UK, US and Australia; Paris Agreement; art 7 and full powers)'
      - Week 03 - Reading - Australia's Treaty-Making Process (Step 4)
