  - concept: laws2000-w03-invalidity-of-treaties
    plain: A treaty can be properly made yet invalid, if a state's consent came from error, fraud, corruption or coercion, or if the treaty breaches a peremptory norm.
    concrete: 'The lecturer''s examples: a treaty is concluded on the basis of a map that turns out to be wrong, and the map was material to a state''s decision to join — the treaty may be invalid for error (art 48). Make the map wrong on purpose, to lure the other state into signing, and it is fraud (art 49). Bribe the negotiator to sign when they otherwise would not, and it is corruption (art 50).'
    formal: 'VCLT grounds: relative invalidity, arts 46–50 — internal law (46, narrowly), error (48), fraud (49), corruption of a representative (50); absolute invalidity, arts 51–53 — coercion of a representative (51), threat or use of force (52), and jus cogens: "A treaty is void if, at the time of its conclusion, it conflicts with a peremptory norm of general international law" (53).'
    analogy:
      text: 'Contract law''s vitiating factors: mistake, deceit, bribery of an agent and duress undo consent, and an illegal contract is void outright.'
      maps:
        - from: mistake
          to: error (art 48)
        - from: deceit
          to: fraud (art 49)
        - from: bribing an agent
          to: corruption of a representative (art 50)
        - from: an illegal contract
          to: conflict with jus cogens (art 53)
      limits:
        - A company may escape a contract its agent had no internal authority to make; a state cannot invoke its own internal law unless the breach was manifest and of fundamental importance (art 46).
    terms:
      - term: relative invalidity
        gloss: 'Grounds going to defective consent (arts 46–50): internal law, error, fraud and corruption; the lecture calls such treaties voidable.'
      - term: absolute invalidity
        gloss: 'Grounds making a treaty void (arts 51–53): coercion of a representative, threat or use of force against the state, conflict with jus cogens.'
      - term: void ab initio
        gloss: Invalid from the very beginning, as if it never had legal effect — for example, a treaty procured by force against the state (art 52).
      - term: peremptory norm (jus cogens)
        gloss: A norm accepted by the community of states as a whole as permitting no derogation, e.g. prohibitions of torture, genocide, aggression and piracy; self-determination.
    misconceptions:
      - claim: A state can escape a treaty by showing it breached its own constitution when consenting.
        tempting: Domestic law decides who may conclude treaties for a state.
        correction: 'Art 46: it cannot, "unless the violation was manifest and concerned a rule of its internal law of fundamental importance" (Cameroon v Nigeria). This protects other parties'' reliance.'
      - claim: Fraud and error are absolute grounds that make a treaty void.
        tempting: Both strike at the reality of consent.
        correction: The slides class error (art 48), fraud (49) and corruption (50) as relative invalidity; absolute invalidity is arts 51–53.
      - claim: Any later regret or political change counts as 'error'.
        tempting: The state feels it misjudged the deal.
        correction: Error concerns a mistaken factual situation at the time of consent that was an important basis for it, like a wrong map — not a later change of heart.
    socratic:
      - ask: A treaty meets art 2(1)(a), was signed by the right people and ratified. Can it still be invalid?
        hint: Look at how consent was obtained, and at what the treaty does.
        answer: Yes. Consent may be vitiated by error, fraud, corruption or coercion, or the treaty may conflict with jus cogens.
      - ask: A border treaty relied on a map both sides thought accurate; it was wrong. Which ground applies?
        hint: Was anyone deceived?
        answer: Error (art 48), if the mistaken fact was an important basis for consent. Had the map been falsified deliberately, fraud (art 49).
      - ask: State A threatens to bomb State B unless it signs. What is the effect?
        hint: Art 52.
        answer: 'Absolute invalidity: a treaty procured by the threat or use of force against the state is void ab initio.'
      - ask: A treaty commits two states to cooperate in torturing suspects. What is the effect?
        hint: Art 53.
        answer: It conflicts with a peremptory norm at the time of conclusion, so it is void.
      - ask: A new government says the old one breached a procedural law in ratifying. Can it invalidate the treaty?
        hint: Apply the art 46 test.
        answer: Only if the violation was manifest and concerned an internal rule of fundamental importance; otherwise the treaty stands.
    elements:
      - name: Defective consent — relative (arts 46–50)
        test: Was consent given in manifest breach of a fundamental internal rule (46), through material factual error (48), induced by fraud (49), or by corrupting the representative (50)?
        cases:
          - land-and-maritime-boundary-cameroon-v-nigeria
        authorities:
          - vclt-art-46
          - vclt-arts-48-50
      - name: Coercion — absolute (arts 51–52)
        test: Was the representative coerced — economic pressure, blackmail, threats to life (51) — or the state itself subjected to the threat or use of force (52)? Then the treaty is void.
      - name: Conflict with jus cogens (art 53)
        test: At the time of conclusion, does the treaty conflict with a peremptory norm accepted by the community of states as a whole? Then it is void.
        authorities:
          - vclt-art-53
    what-if:
      - change: The 'error' is a typographical slip in cross-references that changes nothing of substance.
        effect: 'Not art 48 error: the mistake must concern a fact or situation that formed an important basis of the state''s consent.'
      - change: The state's representative accepted a large secret payment to sign.
        effect: 'Corruption (art 50): a non-due advantage inducing a signature that would not otherwise have been given — a relative ground the victim state can invoke.'
      - change: The peremptory norm was recognised only after the treaty was concluded.
        effect: Art 53 voids treaties that conflict with a peremptory norm 'at the time of its conclusion'; the lecture stresses the rule must be recognised as such when the treaty is concluded.
    boundary:
      - text: A threat to a negotiator's life versus a threat to bomb the state.
        why: 'Both are absolute grounds on the slides: the first is coercion of a representative (art 51), the second the threat or use of force against the state (art 52). The target differs, not the result.'
      - text: Cameroon v Nigeria and breaches of internal law.
        why: 'At the edge of ''defective consent'': a state''s own internal-law breach does not invalidate its consent unless manifest and of fundamental importance, protecting the other party''s reliance.'
    transfer:
      - scenario: State P signs a water-sharing treaty after State Q secretly pays P's chief negotiator. Separately, P's constitution required parliamentary approval before signature — a requirement P kept confidential and did not follow.
        answer: 'Two grounds. The payment is corruption of a representative (art 50): a non-due advantage inducing signature — a relative ground P may invoke. The constitutional breach falls under art 46: P can rely on it only if the violation was manifest and concerned a rule of fundamental importance; a confidential requirement is unlikely to be manifest to Q (Cameroon v Nigeria).'
    sources:
      - Week 03 - Lecture Slides - The Law of Treaties (slides 24–26)
      - 'Week 03 - Lecture Recording (Live) - The Law of Treaties - Full Transcript (45:03–53:56: error, fraud, corruption, coercion, force, jus cogens, internal law)'
