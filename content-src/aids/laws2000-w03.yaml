  - concept: laws2000-w03-treaty-interpretation
    plain: To interpret a treaty, read its words in their ordinary meaning, in context and in light of its purpose; only if that leaves things unclear or absurd do you turn to the drafting history.
    concrete: 'In the South China Sea Arbitration the tribunal had to decide whether features such as the Spratly Islands were ''islands'' or ''rocks'' under art 121 of UNCLOS. It mattered enormously: a rock gets only 12 nautical miles, an island a full 200-nautical-mile exclusive economic zone, and other features nothing. Using both art 31 and art 32 means, the tribunal held the Spratly Islands were not legally islands.'
    formal: 'VCLT art 31(1): "A treaty shall be interpreted in good faith in accordance with the ordinary meaning to be given to the terms of the treaty in their context and in the light of its object and purpose." Art 32: supplementary means — preparatory work and circumstances of conclusion — to confirm that meaning, or where art 31 leaves it ambiguous, obscure, manifestly absurd or unreasonable. Both reflect custom.'
    analogy:
      text: 'Reading a will: start with its words, read them against the whole document and its schedules and what the will set out to achieve, and only check the lawyer''s drafting notes if the words stay unclear.'
      maps:
        - from: the will's words
          to: ordinary meaning (art 31(1))
        - from: the whole will and its schedules
          to: 'context: text, preamble, annexes, related agreements'
        - from: what the will set out to achieve
          to: object and purpose
        - from: the lawyer's drafting notes
          to: travaux préparatoires (art 32)
      limits:
        - A will records one person's wishes; a treaty records many states' common intention, and courts will not rewrite it.
    terms:
      - term: ordinary meaning
        gloss: The common sense of a treaty's terms, read in good faith — the starting point under art 31(1); a special meaning applies if the parties intended one.
      - term: context
        gloss: The treaty text as a whole, its preamble and annexes, and any agreement or instrument made in connection with its conclusion.
      - term: travaux préparatoires
        gloss: The treaty's preparatory work — drafts and negotiating records — a supplementary means of interpretation under art 32.
      - term: teleological interpretation
        gloss: Reading a treaty's terms in the light of its overall object and purpose.
    misconceptions:
      - claim: You can go straight to the travaux préparatoires to find what the parties meant.
        tempting: Drafting history seems the best evidence of intention.
        correction: 'Art 32 is supplementary: use it to confirm the art 31 meaning, or where art 31 leaves the meaning ambiguous or obscure, or manifestly absurd or unreasonable.'
      - claim: Good faith lets a party depart from the text if it sincerely prefers another reading.
        tempting: '''Good faith'' sounds like sincerity.'
        correction: 'Good faith constrains interpretation: art 31(1) ties it to the ordinary meaning in context and the object and purpose, and courts never rewrite a treaty.'
      - claim: Arts 31–32 bind only parties to the VCLT.
        tempting: They are treaty provisions.
        correction: They reflect customary international law, recognised by the ICJ, so they govern the interpretation of treaties involving non-parties too.
    socratic:
      - ask: Art 121 UNCLOS does not define 'rocks which cannot sustain human habitation'. Where do you start?
        hint: Art 31(1).
        answer: With the ordinary meaning of the terms, read in good faith.
      - ask: What else shapes that ordinary meaning?
        hint: Context, then purpose.
        answer: The context — text, preamble, annexes and related agreements — and the treaty's object and purpose.
      - ask: Can the parties' later conduct help?
        hint: The flowchart's lower row.
        answer: 'Yes: subsequent agreements on interpretation, subsequent practice establishing it, and relevant rules of international law — used with caution.'
      - ask: When may you turn to the preparatory work?
        hint: Art 32's triggers.
        answer: To confirm the art 31 meaning, or where that meaning is ambiguous or obscure, or leads to a manifestly absurd or unreasonable result.
      - ask: Why did the label 'island' or 'rock' matter so much?
        hint: Count the nautical miles.
        answer: A rock gets 12 nautical miles; an island a 200-nautical-mile exclusive economic zone. The tribunal held the Spratly Islands were not islands.
    elements:
      - name: Good faith
        test: Interpret honestly, to promote the integrity of treaty obligations rather than to escape them (art 31(1)).
        authorities:
          - vclt-art-31
      - name: Ordinary meaning
        test: Give the terms their ordinary meaning, or a special meaning if the parties intended one (flowchart).
        authorities:
          - vclt-art-31
      - name: Context
        test: Read the terms with the whole text, preamble and annexes, and any agreement or instrument made in connection with the treaty's conclusion.
        authorities:
          - vclt-art-31
      - name: Object and purpose
        test: Read the terms in the light of the treaty's overall aim (teleological interpretation).
        authorities:
          - vclt-art-31
      - name: Later agreement, practice and rules
        test: Take into account subsequent agreements on interpretation, subsequent practice establishing it, and relevant rules of international law — cautiously (flowchart).
      - name: Supplementary means (art 32)
        test: Use preparatory work and circumstances of conclusion to confirm the meaning, or where it is ambiguous, obscure, manifestly absurd or unreasonable.
        cases:
          - south-china-sea-arbitration-philippines-v-china
        authorities:
          - vclt-art-32
    what-if:
      - change: The ordinary meaning in context is clear and sensible.
        effect: Stop at art 31. Courts have refused to resort to preparatory work where the text is sufficiently clear, using it at most to confirm the meaning.
      - change: The ordinary meaning leads to a manifestly absurd result.
        effect: Art 32(b) permits recourse to the preparatory work and the circumstances of conclusion to determine the meaning.
      - change: One party argues the term means whatever its own domestic law says.
        effect: A treaty is governed by international law, so the term is interpreted under arts 31–32 VCLT, not either party's domestic definitions.
    boundary:
      - text: 'Troops deployed along a border: a ''threat of force'' under art 2(4) of the UN Charter?'
        why: The Charter does not define the term, so it must be interpreted before it can be applied to the facts — the line between interpreting a treaty and applying it.
      - text: 'The ILC commentary: interpretive means operate in conjunction.'
        why: Arts 31 and 32 read sequentially, yet the ILC warned against a strict line between primary and supplementary means; the goal is the treaty's actual meaning.
    transfer:
      - scenario: A fisheries treaty bans 'nets' in a protected zone. One state's boats switch to long-lines with baited hooks, arguing a long-line is not a 'net'.
        answer: 'Start with art 31(1): the ordinary meaning of ''nets'', in good faith, read in context (preamble, annexes, related agreements) and in light of the treaty''s object and purpose — likely protecting fish stocks in the zone. Only if that leaves the term ambiguous or produces a manifestly absurd result may art 32''s preparatory work be used, otherwise only to confirm.'
    sources:
      - Week 03 - Lecture Slides - The Law of Treaties (slides 33–38)
      - Week 03 - Study Aid - Treaty Interpretation Flowchart
      - 'Week 03 - Lecture Recording (Online) - The Law of Treaties - Full Transcript (24:34–42:35: interpretation, arts 31–32, ILC commentary, South China Sea)'
