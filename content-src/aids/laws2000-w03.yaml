  - concept: laws2000-w03-australian-treaty-making-process
    plain: 'Australia makes treaties through the executive in fixed steps: mandate, negotiation, ministerial and Executive Council approval, signature, parliamentary scrutiny by JSCOT, then any legislation and entry into force.'
    concrete: The 2021 AUKUS information-sharing agreement (ENNPIA) shows the documents at work. Its National Interest Analysis explained that US law restricts disclosing naval nuclear propulsion information unless such an agreement is in force, and that the UK was similarly restricted by its 1958 agreement with the US. Domestic implementation needed no change to Australian laws, and any party could terminate on six months' written notice.
    formal: 'DFAT''s six steps: (1) the lead minister seeks a mandate to negotiate from the Minister for Foreign Affairs; (2) negotiation and finalisation of the text; (3) ministerial and Federal Executive Council approval of every treaty action; (4) signature — full powers unless the PM or Foreign Minister signs; (5) tabling for JSCOT for 15 or 20 joint sitting days; (6) implementing legislation, then entry into force.'
    terms:
      - term: National Interest Analysis (NIA)
        gloss: 'Tabled with a treaty: its obligations, economic, social and political effects, reasons for Australia to act, implementation, costs and withdrawal.'
      - term: JSCOT
        gloss: 'Joint Standing Committee on Treaties: scrutinises tabled treaties and reports, within 15 or 20 joint sitting days, whether binding treaty action should be taken.'
      - term: Federal Executive Council (ExCo)
        gloss: Must approve every treaty action — signing, ratifying, amending, terminating or withdrawing.
      - term: minor treaty action
        gloss: A treaty action with negligible national-interest effect, such as a technical amendment, given a streamlined parliamentary scrutiny process.
    misconceptions:
      - claim: Parliament must approve every treaty before Australia can sign it.
        tempting: JSCOT and tabling give Parliament a visible role.
        correction: Signature follows ExCo approval (step 4); tabling for JSCOT comes after signature (step 5). Parliament scrutinises, and passes any implementing law, before binding treaty action.
      - claim: Any minister can start negotiating a treaty in their own portfolio.
        tempting: Ministers run their own policy areas.
        correction: The lead minister must first obtain a mandate to negotiate from the Minister for Foreign Affairs (or Cabinet), and the Prime Minister must be informed (step 1).
      - claim: An NIA is written after ratification to explain the obligations taken on.
        tempting: An NIA does set out the treaty's obligations.
        correction: It accompanies the treaty when tabled, so JSCOT can scrutinise it before binding treaty action is taken.
    socratic:
      - ask: The Agriculture Minister wants a fisheries treaty with Indonesia. What must happen before negotiations start?
        hint: Step 1.
        answer: A mandate to negotiate from the Minister for Foreign Affairs (or Cabinet), with the Prime Minister informed.
      - ask: Negotiations finish. Can the minister now sign?
        hint: Who approves every treaty action?
        answer: 'Not yet: ministerial agreement and Federal Executive Council approval come first. Then signature, with full powers unless the PM or Foreign Minister signs.'
      - ask: After signature, what does Parliament do?
        hint: Tabling and a committee.
        answer: The treaty and its NIA are tabled for JSCOT, which reports within 15 or 20 joint sitting days on whether binding treaty action should be taken.
      - ask: What must happen before the treaty enters into force?
        hint: Domestic law comes first.
        answer: 'Any implementing legislation must pass both Houses. Then entry into force: usually an exchange of diplomatic notes (bilateral) or deposit of ratification (multilateral).'
    what-if:
      - change: The treaty requires changes to Australian fisheries law.
        effect: Under step 6, implementing legislation must pass both Houses before entry into force; JSCOT also considers what legislative change the treaty needs.
      - change: The treaty action is a technical amendment with negligible national-interest effect.
        effect: It may be a minor treaty action, given streamlined parliamentary scrutiny rather than the full JSCOT process.
    boundary:
      - text: The 2024 AUKUS Agreement for Cooperation Related to Naval Nuclear Propulsion.
        why: Full JSCOT scrutiny — 260 submissions, four public hearings (Report 224) — ended with a recommendation that binding treaty action be taken, despite criticism of its withdrawal terms.
      - text: Instruments of 'less-than-treaty status', such as Australian MoUs.
        why: DFAT treats them as outside the treaty category altogether, so they are not concluded as treaties through this process — though their status at international law can differ.
    transfer:
      - scenario: Australia's Health Minister negotiates a pandemic data-sharing treaty with New Zealand and wants it in force next month. She asks whether she can sign and bring it into force straight away.
        answer: Not under DFAT's process. She needed a mandate from the Foreign Minister; then ministerial and ExCo approval; signature, with full powers since she is not the PM or Foreign Minister; tabling with an NIA for JSCOT for 15 or 20 joint sitting days; any implementing legislation; and only then entry into force, usually by exchange of diplomatic notes.
    objections:
      - position: Australia should take binding treaty action on the 2024 AUKUS naval nuclear propulsion agreement.
        evidence: JSCOT Report 224, Recommendation 1, supported binding treaty action; the agreement gives Australia access to naval nuclear propulsion information, material and equipment from the UK and US.
        objection: 'Professor Donald Rothwell: the withdrawal provisions give the UK and US ''an enormous amount of flexibility'' — only they can be an ''Originating Party'' able to withdraw over risks to their defence and security.'
    storyboard:
      - caption: 'Step 1: mandate to negotiate'
        detail: The lead minister seeks a mandate from the Foreign Minister (or Cabinet); the Prime Minister is informed.
      - caption: 'Step 2: negotiate and finalise text'
        detail: Consult Commonwealth agencies, states, territories and stakeholders; verify any foreign-language text.
      - caption: 'Step 3: ministerial and ExCo approval'
        detail: Foreign Minister, Attorney-General and portfolio ministers agree; the Federal Executive Council approves the treaty action.
      - caption: 'Step 4: signature'
        detail: Australia's representative signs; full powers are needed unless the PM or Foreign Minister signs.
      - caption: 'Step 5: JSCOT scrutiny'
        detail: Tabled with an NIA for 15 or 20 joint sitting days; JSCOT recommends whether binding treaty action should be taken.
      - caption: 'Step 6: legislation, then entry into force'
        detail: Implementing laws pass both Houses; then an exchange of notes (bilateral) or deposit of ratification (multilateral).
    sources:
      - Week 03 - Reading - Australia's Treaty-Making Process (Steps 1–6)
      - Week 03 - Lecture Slides - The Law of Treaties (slides 12–13)
      - 'Week 03 - Lecture Recording (Live) - The Law of Treaties - Full Transcript (24:21–29:38: Australia''s process, NIA, JSCOT, ratification)'
      - 'Week 03 - Case Study - AUKUS National Interest Analysis (ENNPIA 2021: reasons, implementation, termination)'
      - Week 03 - Case Study - JSCOT AUKUS Report (Report 224, paras 2.2, 2.30–2.35, 4.2–4.4)
      - Week 03 - Tutorial Task - The Law of Treaties (Hypothetical 1D)
