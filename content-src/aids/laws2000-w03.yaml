  - concept: laws2000-w03-unilateral-statements
    plain: A state can bind itself by publicly promising something even though no other state promises anything back; unlike a treaty, it needs no counterpart and no writing.
    concrete: 'Australia and New Zealand took France to the ICJ over its atmospheric nuclear tests in the Pacific, fearing radioactive fallout. Before a hearing on the merits, France''s President and Foreign Minister made public statements, including at press conferences, that France would cease atmospheric testing. The Court held those statements showed an intention to be legally bound: France had given a legal undertaking without anyone accepting it.'
    formal: '"A state may evidence a clear intention to accept obligations vis-à-vis certain other states by a public declaration which is not an offer or otherwise dependent on reciprocal undertakings from its addressees" (Crawford, Brownlie''s Principles). Unilateral statements can create binding obligations (Eastern Greenland (1933) PCIJ Ser A/B No 53; Nuclear Tests [1974] ICJ Rep 253). Unlike a treaty, there is no reciprocity and no writing requirement.'
    analogy:
      text: 'A public pledge at a fundraiser: you announce your donation aloud, nobody pledges anything back, and you are held to your word.'
      maps:
        - from: announcing the pledge aloud
          to: a public declaration by a state
        - from: nobody pledging back
          to: no reciprocal undertaking
        - from: being held to your word
          to: the declaration binding the state
      limits:
        - A private pledge may be unenforceable without something given in return; a state's clear unilateral declaration binds without any return.
    terms:
      - term: unilateral statement
        gloss: A public declaration by which one state commits itself, without any reciprocal undertaking, capable of binding it in international law.
      - term: reciprocity
        gloss: 'Mutual undertakings between parties: present in a treaty, absent from a unilateral statement.'
      - term: addressee
        gloss: The state or states a unilateral declaration is directed to; their acceptance or reply is not needed for it to bind.
    misconceptions:
      - claim: A unilateral statement binds only once the addressee accepts it.
        tempting: That is how treaties and contracts work.
        correction: 'Crawford: the declaration "is not an offer or otherwise dependent on reciprocal undertakings from its addressees". No other state''s acceptance is needed.'
      - claim: A unilateral statement and a reservation are the same thing, since both are unilateral.
        tempting: Art 2(1)(d) VCLT itself calls a reservation a 'unilateral statement'.
        correction: A reservation operates inside a treaty and its effect depends on other states' acceptance or objection (art 20); a unilateral statement stands alone.
      - claim: A unilateral statement must be in writing to bind.
        tempting: Treaties under the VCLT must be written.
        correction: 'It need not be in writing: Norway''s foreign minister spoke to his Danish counterpart (Eastern Greenland), and France''s statements were made at press conferences (Nuclear Tests).'
    socratic:
      - ask: Norway's foreign minister tells Denmark that Norway will not make difficulties over Greenland. Did Denmark promise anything back?
        hint: Look for reciprocity.
        answer: No. One state committed itself — a unilateral statement, not a treaty.
      - ask: Can such a statement bind Norway?
        hint: What did the Permanent Court hold?
        answer: Yes. The promise was unconditional and definitive, obliging Norway not to contest Danish sovereignty over Greenland (Eastern Greenland).
      - ask: Does it matter that the statement was not written down?
        hint: Writing is a VCLT treaty requirement.
        answer: No. A unilateral statement need not be in writing — which is also why it falls outside the VCLT.
      - ask: How do you spot a unilateral statement in an exam problem?
        hint: Count the states committing themselves.
        answer: If only one state commits, with no counterpart agreeing to anything, analyse it as a unilateral statement rather than forcing it into art 2(1)(a).
    elements:
      - name: Public declaration
        test: A public statement made on behalf of the state, by a representative such as a foreign minister or president; writing is not required.
        cases:
          - legal-status-of-eastern-greenland-denmark-v-norway
          - nuclear-tests-cases-australia-v-france-new-zealand-v-france
      - name: Clear intention to accept obligations
        test: The words show a clear intention to be bound towards certain other states, not mere hope or policy.
        cases:
          - legal-status-of-eastern-greenland-denmark-v-norway
          - nuclear-tests-cases-australia-v-france-new-zealand-v-france
      - name: Not dependent on reciprocity
        test: The declaration is not an offer and does not depend on reciprocal undertakings from its addressees.
        cases:
          - nuclear-tests-cases-australia-v-france-new-zealand-v-france
    what-if:
      - change: Denmark had promised Norway fishing rights in return for the statement.
        effect: Reciprocal undertakings would make it an agreement between two states; if written and governed by international law, analyse it as a treaty under art 2(1)(a).
      - change: France had said only that it hoped to end testing if circumstances allowed.
        effect: 'No clear intention to accept an obligation: a hopeful or conditional statement is unlikely to create a binding undertaking.'
    boundary:
      - text: A reservation, which art 2(1)(d) also calls a 'unilateral statement'.
        why: Unilateral in form, but it modifies an existing treaty relationship and its effect depends on acceptance or objection; a true unilateral statement stands alone.
    transfer:
      - scenario: A state's foreign minister announces at the UN that her state 'will never again claim the disputed islets'. The rival state never responds. Years later a new government lodges a claim to the islets.
        answer: 'This is a unilateral statement: a public declaration by one state, with no reciprocal undertaking. As in Eastern Greenland and Nuclear Tests, a clear intention to accept an obligation binds the declaring state without any acceptance or reply from the addressee. The later claim conflicts with that obligation.'
    sources:
      - Week 03 - Lecture Slides - The Law of Treaties (slide 8)
      - Week 02 - Lecture Slides - Sources of International Law (slides 21–22)
      - 'Week 03 - Lecture Recording (Live) - The Law of Treaties - Full Transcript (18:45–19:49: unilateral statements contrasted with treaties)'
