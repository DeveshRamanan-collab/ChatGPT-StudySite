  - concept: laws2000-w09-armed-attack
    plain: Self-defence needs an "armed attack" — one of the gravest forms of force, judged by scale and effects. Every armed attack is a use of force, but not every use of force is one.
    concrete: In Nicaragua (1986) the ICJ found the United States had used force unlawfully, including by mining Nicaragua's territorial waters and attacking naval and port facilities. But it separated the most grave forms of force — armed attacks — from less grave forms. Arming, funding and supplying the contras, and certain frontier incidents, stayed below the gravity threshold. So force can breach art 2(4) without giving the victim a right of self-defence.
    formal: Art 51 permits self-defence only "if an armed attack occurs" — not synonymous with "use of force" in art 2(4). With no clear benchmark, the threshold depends on scale and effects (casualties, property damage). Nicaragua distinguished "the most grave forms of the use of force (those constituting an armed attack) from other less grave forms". Attacks on territory or military vessels may qualify; private ships do not (Oil Platforms).
    analogy:
      text: Every square is a rectangle, but most rectangles are not squares. Every armed attack is a use of force, but most uses of force are not armed attacks.
      maps:
        - from: rectangle
          to: use of force, prohibited by art 2(4)
        - from: square
          to: armed attack, which triggers self-defence under art 51
      limits:
        - A square has a crisp definition; an armed attack has no clear benchmark — it turns on scale and effects, and the lecturer notes the ICJ is not always consistent.
    terms:
      - term: armed attack
        gloss: 'The trigger for self-defence under art 51: one of the gravest forms of the use of force, judged by scale and effects.'
      - term: scale and effects
        gloss: Casualties, damage to property and similar consequences that measure whether force reaches the armed attack threshold.
      - term: frontier incident
        gloss: A low-intensity border clash. In Nicaragua, certain frontier incidents fell below the armed attack threshold.
      - term: cumulative effect
        gloss: Whether a series of small attacks can together amount to an armed attack — a door the ICJ has left open.
    misconceptions:
      - claim: Any unlawful use of force against a state gives it a right of self-defence.
        tempting: Force is force.
        correction: 'Armed attack is not synonymous with use of force: only the gravest forms, judged by scale and effects, trigger art 51 (Nicaragua).'
      - claim: Supplying arms, funds and logistics to rebels is an armed attack by the supplier.
        tempting: The support makes the rebels' attacks possible.
        correction: 'Nicaragua: such support stays below the gravity threshold; significant government involvement — effective control over the operations — is required.'
      - claim: An attack on a privately owned ship flying a state's flag is an armed attack on that state.
        tempting: The ship carries the state's flag.
        correction: Attacks on a state's military vessels can be armed attacks, but not attacks on private ships (Oil Platforms).
    socratic:
      - ask: State A's troops fire a few shots at a State B border patrol, hurting no one. Is that a use of force?
        hint: Art 2(4).
        answer: Yes — firing on another state's patrol is force between states, prohibited by art 2(4).
      - ask: Can B now act in self-defence?
        hint: Gravity.
        answer: Unlikely. A minor frontier incident falls below the armed attack threshold; its scale and effects are slight (Nicaragua).
      - ask: What would push an attack over the threshold?
        hint: Scale and effects.
        answer: Greater casualties and damage to property. There is no clear benchmark, so argue scale and effects from the facts.
      - ask: 'The raids continue for months: none serious alone, but together they kill dozens. Armed attack?'
        hint: Cumulative effect.
        answer: Possibly. The ICJ has left open whether a series of small attacks can amount to an armed attack by their cumulative effect.
      - ask: A's forces sink a B navy frigate. Different from sinking a privately owned tanker flying B's flag?
        hint: Oil Platforms.
        answer: 'Yes: an attack on a state''s military vessel can be an armed attack; an attack on a private ship is not.'
    elements:
      - name: A use of force
        test: First show force against the state contrary to art 2(4).
        authorities:
          - un-charter-art-2-4
      - name: 'Gravity: scale and effects'
        test: One of the most grave forms of force — casualties, damage to property; minor frontier incidents and supplying arms fall short.
        cases:
          - nicaragua-v-united-states-of-america
        authorities:
          - un-charter-art-51
      - name: Against the state
        test: Its territory or its military vessels — not private ships.
        cases:
          - oil-platforms-islamic-republic-of-iran-v-united-states-of-america
      - name: By or through the attacking state
        test: If armed groups carry it out, significant government involvement (effective control over the operations) is needed.
        cases:
          - nicaragua-v-united-states-of-america
    what-if:
      - change: The drone strike on Country C's oil plant (tutorial) killed no one but damaged key towers and cut exports.
        effect: 'C must argue scale and effects: serious damage to property at critical infrastructure. With no casualties, whether it reaches the gravity of an armed attack is arguable either way.'
      - change: The attackers sink a privately owned oil tanker instead of a navy ship.
        effect: Not an armed attack on the flag state (Oil Platforms), though it may still be an unlawful use of force.
      - change: The rebels attacking State B were only armed and funded by State A, not directed by it.
        effect: A's support stays below the armed attack threshold (Nicaragua); B cannot treat it as A's armed attack without effective control over the operations.
    boundary:
      - text: The US mining of Nicaragua's territorial waters and attacks on port facilities.
        why: An unlawful use of force (Nicaragua) — the case that separates the gravest forms of force, armed attacks, from less grave ones.
      - text: A series of small raids that together kill dozens.
        why: 'Unsettled: the ICJ has left open whether their cumulative effect can make an armed attack.'
    transfer:
      - scenario: Drones strike a giant petroleum plant in Country C, damaging towers essential to refining and cutting exports. Rebel group XV in Country A claims responsibility; evidence suggests Country B supplied the drones.
        answer: 'C must first show an armed attack: argue scale and effects — serious damage to critical infrastructure. Then whose attack? XV is a non-state actor; B''s supply of drones resembles supplying arms, below the threshold without effective control over the operation (Nicaragua). Even if an armed attack is shown, any response must be necessary, proportionate and reported.'
    sources:
      - Week 09 - Lecture Slides - The Use of Force (slides 17–19)
      - Week 09 - Lecture Transcript (Live) - The Use of Force (Part A) (armed attack not synonymous with use of force; Nicaragua on scale and effects, arms and training, frontier incidents; Oil Platforms and inconsistency; cumulative effect)
      - Week 09 - Tutorial Task - The Use of Force (question 2(a))
