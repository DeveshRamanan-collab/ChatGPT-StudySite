  - concept: laws2000-w09-anticipatory-self-defence
    plain: May a state strike when an attack is coming but hasn't happened? Art 51 says "if an armed attack occurs"; acting against a manifestly imminent attack has more support, but it remains a grey area.
    concrete: After 9/11, the US National Security Strategy of 2002 claimed the option of acting pre-emptively "to counter a sufficient threat to our national security … even if uncertainty remains as to the time and place of the enemy's attack". This Bush doctrine, the lecturer says, underpinned the 2003 invasion of Iraq but won very limited support. States are readier to accept a strike against a manifestly imminent attack — such as intercepting a missile already on its way.
    formal: Art 51 is triggered "if an armed attack occurs". There is serious controversy between those arguing anticipatory, unilateral self-defence is customary international law and those rejecting it as incompatible with art 51's strict wording. The US National Security Strategy 2002's expanded definition had little support; there is more support if a specific attack is manifestly imminent, and all other restrictions apply. Modern high-speed weapons keep the debate open.
    terms:
      - term: anticipatory (pre-emptive) self-defence
        gloss: Force used before an armed attack has occurred, against an attack said to be imminent.
      - term: manifestly imminent
        gloss: A specific attack that is clearly about to happen — where support for anticipatory self-defence is strongest.
      - term: Bush doctrine
        gloss: The US National Security Strategy 2002 claim to act pre-emptively against a sufficient threat, even if the time and place of attack are uncertain.
    misconceptions:
      - claim: The 2002 US doctrine of pre-emption is now accepted customary law.
        tempting: A superpower claimed it and acted on it.
        correction: It attracted little support beyond the Bush administration; anticipatory self-defence remains seriously contested.
      - claim: Art 51 plainly forbids any defensive force before an attack lands.
        tempting: Its words are "if an armed attack occurs".
        correction: That is one side of the debate. There is more support for acting against a specific, manifestly imminent attack, such as intercepting an incoming missile.
      - claim: If an attack is imminent, necessity and proportionality no longer matter.
        tempting: The danger seems to justify striking first.
        correction: 'All the other restrictions still apply: any response must be necessary, proportionate and reported.'
    socratic:
      - ask: State T's satellites show State U massing troops and short-range missiles at their border. U says nothing. Can T strike now?
        hint: Art 51's words.
        answer: 'Not on the strict wording: art 51 is triggered "if an armed attack occurs", and none has occurred yet.'
      - ask: Is there any support for striking before an attack?
        hint: Manifestly imminent.
        answer: More support exists if a specific attack is manifestly imminent — but this is a grey area, not settled law.
      - ask: Is a build-up alone manifestly imminent?
        hint: How specific, how close, how certain?
        answer: 'Doubtful: there is no specific, certain attack yet. T needs facts showing a particular attack is about to be launched, not merely that U could attack.'
      - ask: What danger does striking too early carry?
        hint: Roles reverse.
        answer: A pre-emptive strike taken too early can itself amount to an act of aggression rather than self-defence.
      - ask: Suppose T's radar shows a missile already launched towards its capital. Different?
        hint: Specific and imminent.
        answer: 'Yes: that attack is specific and manifestly imminent, so acting against it is far more defensible — subject to necessity and proportionality.'
    elements:
      - name: Start from the text
        test: Art 51 applies "if an armed attack occurs"; on the strict reading the attack must already have occurred.
        authorities:
          - un-charter-art-51
      - name: Imminence on the facts
        test: How specific, close and certain is the attack? Support is greatest where it is manifestly imminent.
      - name: Not a mere sufficient threat
        test: A threat of uncertain time and place, as claimed in the 2002 US strategy, attracts little support.
        authorities:
          - us-national-security-strategy-2002
      - name: All other conditions
        test: Necessity, proportionality and reporting apply in any case.
        authorities:
          - un-charter-art-51
    objections:
      - position: Anticipatory self-defence against an imminent attack should be lawful.
        evidence: States including the US, the UK and Israel have claimed it, and modern weapons can launch attacks with high speed and great destructive potential.
        objection: It is hard to square with art 51's strict wording, a strike taken too early can itself be aggression, and the expanded 2002 US version found little support.
    what-if:
      - change: Instead of a quiet build-up, State U's leader announces a date and target for an attack, and missiles are being fuelled.
        effect: Closer to a specific, manifestly imminent attack, where support for anticipatory self-defence is greatest — still contested, and necessity and proportionality still apply.
      - change: The threat is only that a hostile state might one day develop new weapons.
        effect: That is a "sufficient threat" of uncertain time and place, as in the 2002 US strategy — an expanded claim with little support.
      - change: T strikes first, and the expected attack never comes.
        effect: 'T risks having committed an act of aggression itself: a pre-emptive strike taken too early is not self-defence.'
    boundary:
      - text: Intercepting a missile already launched towards one's territory.
        why: 'Within the more widely supported zone: a specific, manifestly imminent attack.'
      - text: The 2003 invasion of Iraq, underpinned by the Bush doctrine.
        why: 'Outside it: pre-emption against a threat of uncertain time and place enjoyed very limited support (lecture).'
    transfer:
      - scenario: Satellite images show Country B deploying many troops and short-range ballistic missiles at its border with Country C, shortly after drones allegedly supplied by B damaged C's oil plant. C wants to strike the missile batteries now.
        answer: The deployment is not itself an armed attack that "occurs" (art 51). C's claim is anticipatory self-defence — contested, with more support only for a specific, manifestly imminent attack. C must show B is about to attack, not merely able to. Even then necessity and proportionality apply, and striking too early risks being aggression.
    sources:
      - Week 09 - Lecture Slides - The Use of Force (slides 25–26)
      - 'Week 09 - Lecture Transcript (Online) - The Use of Force (Part B) (pre-emptive self-defence: the build-up example, the risk of aggression, the Bush doctrine and Iraq, more support for manifestly imminent attacks, modern technologies, grey area)'
      - Week 09 - Tutorial Task - The Use of Force (question 2(b))
    verify: false
  - concept: laws2000-w09-humanitarian-intervention-and-r2p
    plain: Using force to stop mass atrocities in another state has no basis in the UN Charter. R2P recasts it as a responsibility — but force still runs through the Security Council.
    concrete: In 1999, with ethnic cleansing of Albanians in Kosovo and Russia threatening a veto, NATO bombed Yugoslavia without Security Council authorisation. The UK argued the action was legal "as an exceptional measure on grounds of overwhelming humanitarian necessity". A draft resolution calling it a flagrant violation of the Charter's arts 2(4), 24 and 53 did not pass. The Independent International Commission on Kosovo called the intervention "illegal, yet legitimate".
    formal: 'Humanitarian intervention is not addressed in the UN Charter and appears to conflict with art 2(4). The ICISS (2001) shifted from a right to intervene to a responsibility to protect: sovereignty implies responsibility to protect one''s people from genocide, war crimes, ethnic cleansing and crimes against humanity; if the state is unwilling or unable, an international responsibility arises. 2005 World Summit Outcome: three pillars. ILA (2018): a "legal grey area".'
    terms:
      - term: humanitarian intervention
        gloss: Force to protect people in another state from gross and systematic human rights violations; not addressed in the UN Charter.
      - term: responsibility to protect (R2P)
        gloss: Sovereignty implies responsibility to protect one's population from four crimes; if the state is unwilling or unable, the international community responds through the UN.
      - term: three pillars
        gloss: (1) the state's primary duty to its population, citizens or not; (2) international assistance and capacity-building; (3) response through UN mechanisms.
      - term: prevent, react, rebuild
        gloss: The international responsibility in the ICISS report; within "react", military force is a last resort.
    misconceptions:
      - claim: Humanitarian intervention is a third Charter exception alongside arts 42 and 51.
        tempting: Some states argued for it after Kosovo.
        correction: 'The Charter has only two exceptions; humanitarian intervention is not addressed and appears to conflict with art 2(4). ILA (2018): a legal grey area.'
      - claim: R2P lets any state use force wherever one of the four crimes is occurring.
        tempting: R2P is tied to the four crimes.
        correction: 'R2P works within the Charter: its third pillar is response through UN mechanisms, with force as a last resort. It is no licence for unilateral force.'
      - claim: R2P solves Security Council paralysis.
        tempting: It was a response to failures to protect.
        correction: 'It does not: the World Summit Outcome only asks the P5 to "refrain" from vetoing in cases of the four crimes.'
    socratic:
      - ask: Where does the UN Charter address force to stop atrocities in another state?
        hint: Arts 2(4), 42, 51.
        answer: Nowhere. Humanitarian intervention is not addressed in the Charter and appears to conflict with the general prohibition in art 2(4).
      - ask: NATO bombed Yugoslavia in 1999 without Council authorisation. How did the UK justify it?
        hint: An exceptional measure.
        answer: As legal "as an exceptional measure on grounds of overwhelming humanitarian necessity", every means short of force having been tried.
      - ask: What did the Independent International Commission on Kosovo conclude?
        hint: Two words in tension.
        answer: '"Illegal, yet legitimate": it did not comply with the Charter, yet answered a real need to act. Many non-participating states contested it.'
      - ask: How did R2P reframe the question?
        hint: ICISS, 2001.
        answer: 'From a right to intervene to a responsibility to protect: the state protects its people from four crimes; if it is unwilling or unable, the international responsibility — prevent, react, rebuild — arises.'
      - ask: Why did Libya (2011) make R2P controversial?
        hint: Mandate versus outcome.
        answer: NATO's use of force, meant to protect civilians, led to the fall of Gaddafi — criticised as forcible regime change.
    elements:
      - name: First pillar
        test: The state's primary duty to protect its population, citizens or not, from genocide, war crimes, ethnic cleansing and crimes against humanity.
        authorities:
          - world-summit-outcome-2005
          - iciss-report-2001
      - name: Second pillar
        test: The international community assists states to meet these obligations, e.g. through capacity-building.
        authorities:
          - world-summit-outcome-2005
      - name: Third pillar
        test: Responsibility to respond through UN mechanisms; military force only as a last resort.
        authorities:
          - world-summit-outcome-2005
          - un-charter-art-24
    objections:
      - position: R2P reconciles protecting people with the collective security system.
        evidence: It treats sovereignty as responsibility, ties action to four crimes, and keeps force within UN mechanisms as a last resort (ICISS 2001; World Summit 2005).
        objection: It does not solve Security Council paralysis, is applied selectively (why not Syria or Myanmar?), raises unrealistic expectations, and is open to abuse — Libya ended in regime change.
      - position: Kosovo shows that unilateral humanitarian intervention can be justified.
        evidence: The UK called it an exceptional measure on grounds of overwhelming humanitarian necessity; the Independent International Commission found it "illegal, yet legitimate".
        objection: It had no Charter basis, many non-participating states contested it, and it risks a return to just war reasoning that erodes the legal limits on force.
    storyboard:
      - caption: Rwanda (1994)
        detail: Genocide, and a prominent failure to protect.
      - caption: Srebrenica (1995)
        detail: The UN unable to halt the massacre in Bosnia.
      - caption: Kosovo (1999)
        detail: 'NATO intervenes without Council authorisation: "illegal, yet legitimate".'
      - caption: ICISS report (2001)
        detail: From a right to intervene to a responsibility to protect; initiated by Canada, co-chaired by Gareth Evans.
      - caption: World Summit Outcome (2005)
        detail: 'R2P endorsed: three pillars, four crimes.'
      - caption: Libya (2011)
        detail: NATO's use of force leads to Gaddafi's fall; criticism of forcible regime change.
    what-if:
      - change: The Security Council authorises force to protect civilians.
        effect: Lawful under the Charter (art 42) — R2P's third pillar working through UN mechanisms, as in Libya; but the force should stay within the mandate.
      - change: A permanent member's veto blocks any Council action while atrocities continue.
        effect: R2P offers no lawful way around the paralysis; unilateral humanitarian intervention remains a legal grey area (ILA 2018), as Kosovo showed.
      - change: The victims are people the state refuses to recognise as citizens.
        effect: 'The first pillar still applies: governments must protect their populations whether citizens or not, so denying citizenship is no excuse.'
    boundary:
      - text: NATO in Kosovo (1999).
        why: 'Outside the Charter''s exceptions — no authorisation, no armed attack: "illegal, yet legitimate".'
      - text: Libya (2011).
        why: Within the Charter through Council authorisation and R2P's third pillar, but criticised for going beyond protection to regime change.
    transfer:
      - scenario: Government forces in State Z are massacring a minority. A regional alliance proposes air strikes, but one permanent member says it will veto any Security Council resolution.
        answer: 'Without Council authorisation (art 42) or an armed attack on the alliance (art 51), strikes would have no Charter basis and appear to breach art 2(4). R2P does not change that: its third pillar runs through UN mechanisms, and the World Summit Outcome only asks the P5 to refrain from vetoing. Unilateral humanitarian intervention remains a legal grey area (ILA 2018).'
    sources:
      - Week 09 - Lecture Slides - The Use of Force (slides 28–36)
      - Week 09 - Lecture Transcript (Online) - The Use of Force (Part B) (humanitarian intervention and the Charter; Security Council deadlock and the veto; Rwanda; Kosovo, the UK argument, the draft resolution and the Commission; ICISS and R2P; the three pillars; Libya; critiques; ILA 2018)
    verify: false
flows:
  - slug: is-the-use-of-force-lawful
    title: Is this use of force lawful under the UN Charter?
    summary: Tests the facts against art 2(4), then consent and the two Charter exceptions, and sorts the contested justifications — humanitarian necessity and rescue of nationals — from plain breaches.
    start: f1
    concepts:
      - laws2000-w09-prohibition-on-the-use-of-force
      - laws2000-w09-exceptions-to-the-prohibition
      - laws2000-w09-humanitarian-intervention-and-r2p
    sources:
      - Week 09 - Lecture Slides - The Use of Force (slides 6–17, 29–36)
      - Week 09 - Lecture Transcript (Live) - The Use of Force (Part A)
      - Week 09 - Lecture Transcript (Online) - The Use of Force (Part B)
    nodes:
      - id: f1
        kind: ask
        text: Is it force by one state in its international relations, rather than force used inside its own territory?
        note: Force against one's own population or rebels is, in principle, for human rights and humanitarian law — though the line can blur (Korea, Vietnam, the former Yugoslavia).
        authorities:
          - un-charter-art-2-4
        branches:
          - label: 'Yes'
            to: f2
          - label: 'No'
            to: e-not-engaged
      - id: f2
        kind: ask
        text: Is it a threat or use of force — armed force, or a cyber operation of comparable scale and effects?
        note: Economic coercion is contested. A threat must be specific and credible, and is unlawful only if the force threatened would be (Nuclear Weapons).
        concept: laws2000-w09-prohibition-on-the-use-of-force
        cases:
          - legality-of-the-threat-or-use-of-nuclear-weapons
        authorities:
          - ila-2018-report
        branches:
          - label: 'Yes'
            to: f3
          - label: 'No'
            to: e-not-engaged
      - id: f3
        kind: ask
        text: Did the territorial state's government invite or consent to the force?
        note: A request from an opposition group does not count (Nicaragua).
        cases:
          - nicaragua-v-united-states-of-america
        branches:
          - label: 'Yes'
            to: e-consent
          - label: 'No'
            to: f4
      - id: f4
        kind: ask
        text: Has the Security Council authorised the force (art 42)?
        authorities:
          - un-charter-art-42
          - un-charter-art-24
        branches:
          - label: 'Yes'
            to: e-authorised
          - label: 'No'
            to: f5
      - id: f5
        kind: ask
        text: What justification does the state claim?
        branches:
          - label: Self-defence
            to: f6
          - label: Overwhelming humanitarian necessity
            to: e-humanitarian
          - label: Rescuing its own nationals
            to: e-rescue
          - label: The force was limited and took no territory
            to: e-breach
          - label: None of these
            to: e-breach
      - id: f6
        kind: step
        text: 'Test self-defence: an armed attack, necessity and proportionality, and reporting to the Security Council (art 51).'
        concept: laws2000-w09-armed-attack
        authorities:
          - un-charter-art-51
        next: e-self-defence
      - id: e-not-engaged
        kind: end
        tone: qualified
        text: Art 2(4) is not engaged — internal force, or pressure not counted as force. Other law, such as human rights law, may still apply.
      - id: e-consent
        kind: end
        tone: met
        text: 'Lawful: with the government''s consent there is no violation of art 2(4) at all.'
      - id: e-authorised
        kind: end
        tone: met
        text: 'Lawful: force authorised by the Security Council under art 42, within the terms of the authorisation.'
      - id: e-self-defence
        kind: end
        tone: qualified
        text: Lawful only if every condition of self-defence is met — use the self-defence flow.
      - id: e-humanitarian
        kind: end
        tone: qualified
        exception: true
        text: 'No Charter basis: unilateral humanitarian intervention appears to breach art 2(4) and remains a legal grey area (Kosovo; ILA 2018).'
        authorities:
          - ila-2018-report
      - id: e-rescue
        kind: end
        tone: qualified
        exception: true
        text: 'Contested: rescue of nationals is frequently practised by powerful states, but whether art 2(4) permits it is debated.'
      - id: e-breach
        kind: end
        tone: not-met
        text: 'A breach of art 2(4): the restrictive reading is rejected, and no exception applies (Corfu Channel; Nicaragua).'
        cases:
          - corfu-channel-case-united-kingdom-v-albania
          - nicaragua-v-united-states-of-america
  - slug: can-the-state-rely-on-self-defence
    title: Can the state rely on self-defence under art 51?
    summary: Runs a claim of self-defence through armed attack, imminence, attribution and non-state actors, then necessity, proportionality and reporting.
    start: s1
    concepts:
      - laws2000-w09-armed-attack
      - laws2000-w09-anticipatory-self-defence
      - laws2000-w09-self-defence-against-non-state-actors
      - laws2000-w09-necessity-proportionality-and-reporting
    sources:
      - Week 09 - Lecture Slides - The Use of Force (slides 17–27)
      - Week 09 - Lecture Transcript (Live) - The Use of Force (Part A)
      - Week 09 - Lecture Transcript (Online) - The Use of Force (Part B)
      - Week 09 - Tutorial Task - The Use of Force (question 2)
    nodes:
      - id: s1
        kind: ask
        text: Has an armed attack occurred against the state?
        note: The gravest forms of force, by scale and effects; against territory or military vessels, not private ships. Frontier incidents and supplying arms fall short (Nicaragua; Oil Platforms).
        concept: laws2000-w09-armed-attack
        cases:
          - nicaragua-v-united-states-of-america
          - oil-platforms-islamic-republic-of-iran-v-united-states-of-america
        authorities:
          - un-charter-art-51
        branches:
          - label: 'Yes'
            to: s3
          - label: Not yet — an attack is said to be coming
            to: s2
          - label: No — only lesser force, or support to rebels
            to: e-no-attack
      - id: s2
        kind: ask
        text: Is a specific attack manifestly imminent?
        note: A "sufficient threat" of uncertain time and place (US National Security Strategy 2002) has little support; striking too early can itself be aggression.
        concept: laws2000-w09-anticipatory-self-defence
        authorities:
          - us-national-security-strategy-2002
        branches:
          - label: 'Yes'
            to: e-anticipatory
          - label: 'No'
            to: e-no-attack
      - id: s3
        kind: ask
        text: Who carried out the attack?
        concept: laws2000-w09-self-defence-against-non-state-actors
        branches:
          - label: The state against which force will be used
            to: s5
          - label: A group sent by, or under the effective control of, that state
            to: s5
          - label: A non-state group acting on its own from another state
            to: s4
      - id: s4
        kind: ask
        text: Has the host state consented to action on its territory?
        note: The ICJ treats attribution to the host state as important (Wall; Armed Activities).
        cases:
          - construction-of-a-wall-advisory-opinion
          - armed-activities-on-the-territory-of-the-congo-democratic-republic-of-the-congo-v-uganda
        branches:
          - label: 'Yes'
            to: s5
          - label: No — and it is unwilling or unable to act
            to: e-unwilling
          - label: No — and it is acting against the group itself
            to: e-no-basis
      - id: s5
        kind: ask
        text: Is force the only means of halting the attack (necessity)?
        note: 'Indicator: the temporal link — measures taking effect months later were not necessary (Nicaragua [237]).'
        concept: laws2000-w09-necessity-proportionality-and-reporting
        cases:
          - nicaragua-v-united-states-of-america
        branches:
          - label: 'Yes'
            to: s6
          - label: 'No'
            to: e-unlawful
      - id: s6
        kind: ask
        text: Is the response proportionate in its destructive and geographical scope?
        note: Judge the scale of the whole operation (Oil Platforms [77]); taking airports and towns hundreds of kilometres away was not proportionate (Armed Activities [147]).
        cases:
          - oil-platforms-islamic-republic-of-iran-v-united-states-of-america
          - armed-activities-on-the-territory-of-the-congo-democratic-republic-of-the-congo-v-uganda
        branches:
          - label: 'Yes'
            to: s7
          - label: 'No'
            to: e-unlawful
      - id: s7
        kind: step
        text: Report the measures immediately to the Security Council; the right lasts only until the Council has taken the measures necessary.
        authorities:
          - un-charter-art-51
        next: e-lawful
      - id: e-no-attack
        kind: end
        tone: not-met
        text: No armed attack, so no right of self-defence. Lesser force may still breach art 2(4), and striking early risks being aggression.
      - id: e-anticipatory
        kind: end
        tone: qualified
        exception: true
        text: Arguable anticipatory self-defence — a contested grey area. Necessity, proportionality and reporting still apply.
      - id: e-unwilling
        kind: end
        tone: qualified
        exception: true
        text: Only the controversial "unwilling or unable" argument (e.g. Turkey v PKK in Iraq); the ICJ stresses attribution to the host state.
      - id: e-no-basis
        kind: end
        tone: not-met
        text: No clear basis for force on the host state's territory without its consent; cooperation with the host is the lawful route.
      - id: e-unlawful
        kind: end
        tone: not-met
        text: 'Not lawful self-defence: the response fails necessity or proportionality.'
      - id: e-lawful
        kind: end
        tone: met
        text: Lawful self-defence under art 51 and customary law.
