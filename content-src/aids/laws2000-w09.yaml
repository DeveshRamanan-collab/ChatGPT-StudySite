aids:
  - concept: laws2000-w09-jus-ad-bellum-and-jus-in-bello
    plain: Jus ad bellum asks whether a state may resort to force at all; jus in bello governs how force is used once fighting has begun. This unit studies the first.
    concrete: 'The lecturer''s way to remember it: "ad bellum" is the law before war — when a state is allowed to go to war and use force. "In bello" is the law in war — what is permitted once hostilities have started, the territory of the Geneva Conventions, also called international humanitarian law or the law of armed conflict. So whether State A may strike State B at all is an ad bellum question; whether A''s pilots must spare civilians is in bello.'
    formal: 'Jus ad bellum: the law relating to the resort to force and war. Jus in bello: the laws regulating behaviour during hostilities (international humanitarian law). Earlier limits on war: Aquinas''s just war conditions; the Hague Conventions (1899, 1907); the League of Nations (1920–1945); the Kellogg-Briand Pact (1928). The UN Charter (1945) aims "to save succeeding generations from the scourge of war".'
    terms:
      - term: jus ad bellum
        gloss: 'The law on the resort to force: whether a state may use force at all — today arts 2(4), 42 and 51 of the UN Charter.'
      - term: jus in bello
        gloss: The law regulating behaviour during hostilities — international humanitarian law, or the law of armed conflict.
      - term: just war doctrine
        gloss: 'Aquinas (13th century): a war is just with the right authority (auctoritas), a just purpose (causa justa) and the right intent (recta intentio).'
      - term: Kellogg-Briand Pact (1928)
        gloss: Outlawed war as a means of national policy, except for self-defence — and the Second World War followed.
    misconceptions:
      - claim: Jus ad bellum governs how hostilities are conducted.
        tempting: Both are Latin phrases about war.
        correction: That is jus in bello (international humanitarian law). Jus ad bellum asks whether force may be resorted to at all.
      - claim: A state acting in lawful self-defence may fight however it likes.
        tempting: Its resort to force was lawful.
        correction: Whether it could resort to force (jus ad bellum) and how it conducts hostilities (jus in bello) are separate questions; conduct is judged by international humanitarian law.
      - claim: The Kellogg-Briand Pact prohibited the threat or use of force.
        tempting: It outlawed war.
        correction: It outlawed war as a means of national policy, except for self-defence. The "threat or use of force" formula is art 2(4) of the UN Charter (1945).
    socratic:
      - ask: State A asks its lawyers whether it may launch strikes against a neighbour. Which body of law answers?
        hint: Before war.
        answer: 'Jus ad bellum — the law relating to the resort to force: today, art 2(4) and its exceptions.'
      - ask: During the strikes a critic objects to the shelling of a town. Which body of law governs that objection?
        hint: In war.
        answer: Jus in bello — international humanitarian law, which regulates behaviour during hostilities.
      - ask: Aquinas would ask three things before calling a war just. What are they?
        hint: Who, why, aiming at what?
        answer: The right authority (auctoritas), a just purpose rather than wealth or power (causa justa), and the right intent — a just peace (recta intentio).
      - ask: Why do the Hague Conventions, the League and the Kellogg-Briand Pact count as only partial successes?
        hint: What followed each?
        answer: 'Each failed to prevent the next war: the Hague Conventions were followed by the First World War, the Kellogg-Briand Pact by the Second.'
      - ask: What does the UN Charter's Preamble say the peoples are determined to do?
        hint: Succeeding generations.
        answer: '"To save succeeding generations from the scourge of war" — reflecting the experience of the Second World War.'
    what-if:
      - change: The question is whether soldiers may target a building full of civilians during a campaign.
        effect: That is jus in bello — conduct during hostilities — answered by international humanitarian law, outside this unit's jus ad bellum focus.
      - change: A state argues its war is lawful because its cause is righteous.
        effect: 'Today''s test is not Aquinas''s just war but the Charter: force is prohibited (art 2(4)) unless the Security Council authorises it (art 42) or self-defence applies (art 51).'
    boundary:
      - text: Whether State A may lawfully begin strikes against State B.
        why: 'Jus ad bellum: the resort to force.'
      - text: Whether prisoners captured by State A are treated as the rules of war require.
        why: 'Jus in bello: behaviour during hostilities, governed by international humanitarian law.'
    storyboard:
      - caption: Just war (13th century)
        detail: 'Aquinas: right authority, a just purpose, the right intent.'
      - caption: Hague Conventions (1899, 1907)
        detail: Mostly about conduct in war, touching the resort to war only lightly; the First World War followed.
      - caption: League of Nations (1920–1945)
        detail: The first international organisation created to limit the recourse to war.
      - caption: Kellogg-Briand Pact (1928)
        detail: War outlawed as national policy, except for self-defence; the Second World War followed.
      - caption: UN Charter (1945)
        detail: '"To save succeeding generations from the scourge of war": peaceful settlement (art 2(3)) and no force (art 2(4)).'
    transfer:
      - scenario: 'A state sends drones against an armed group abroad. A newspaper asks two questions: was the state allowed to strike at all, and was it allowed to strike a building where civilians were sheltering?'
        answer: 'The first is jus ad bellum, answered by art 2(4) and its exceptions (arts 42 and 51). The second is jus in bello — international humanitarian law, which regulates behaviour during hostilities. They are separate questions: a lawful resort to force does not make every method lawful.'
    sources:
      - Week 09 - Lecture Slides - The Use of Force (slides 4–6)
      - 'Week 09 - Lecture Transcript (Live) - The Use of Force (Part A) (opening: just war doctrine, Hague Conventions, League of Nations, Kellogg-Briand Pact; jus ad bellum and jus in bello; the Charter''s Preamble)'
      - Week 09 - Tutorial Task - The Use of Force (question 1)
