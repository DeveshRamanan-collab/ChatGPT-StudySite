  - concept: laws2000-w09-self-defence-against-non-state-actors
    plain: Can a state defend itself against an armed group operating from another state's territory? Art 51 doesn't say who must attack; the ICJ stresses attribution to the host state, and practice is shifting.
    concrete: After Al Qaida's attacks on the United States in September 2001, the US struck Al Qaida in Afghanistan, claiming self-defence. In a letter to the Security Council it argued that the Taliban regime had let Al Qaida operate from its territory and refused to change course. Resolution 1373 (2001) reaffirmed the inherent right of self-defence and called international terrorism a threat to peace — but, the lecturer notes, it did not call the attacks armed attacks.
    formal: 'Art 51 does not say an armed attack must come from a state. Nicaragua: armed bands, groups, irregulars or mercenaries sent by or on behalf of a state can carry out an armed attack. Resolution 1373 (2001) affirmed the right of self-defence after 9/11. The ICJ treats attribution to the host state as important (Wall, 2004; Armed Activities, 2005). "Unwilling or unable" remains controversial; invited action is less contentious.'
    terms:
      - term: non-state actor
        gloss: An armed group that is not part of any state — e.g. Al Qaida or Islamic State.
      - term: '"unwilling or unable"'
        gloss: The contested argument that a victim state may act against a non-state actor in a host state that is unwilling or unable to deal with the threat.
      - term: host state
        gloss: The state from whose territory a non-state actor operates; force against the group there engages that state's territorial integrity.
    misconceptions:
      - claim: Art 51 expressly limits armed attacks to attacks by states.
        tempting: The Charter was drafted with interstate wars in mind.
        correction: Art 51 does not say who must carry out the attack. The ICJ, though, treats attribution to the host state as important (Wall; Armed Activities).
      - claim: '"Unwilling or unable" is an accepted rule permitting strikes on armed groups in another state.'
        tempting: More and more states invoke it.
        correction: The doctrine remains controversial (e.g. Turkey v PKK in Iraq); the ICJ has emphasised attribution to the host state.
      - claim: Resolution 1373 declared the 9/11 attacks armed attacks.
        tempting: It affirmed the right of self-defence in response to them.
        correction: It reaffirmed the inherent right of self-defence and called international terrorism a threat to peace, but did not call the attacks armed attacks (lecture).
    socratic:
      - ask: A militia based in State H, acting entirely on its own, fires rockets into State V. Does art 51 require the attack to come from a state?
        hint: Read art 51.
        answer: No — its words do not say who must carry out the armed attack.
      - ask: What has the ICJ said, though?
        hint: Wall (2004); Armed Activities (2005).
        answer: It treats attribution to the host state as important. In the Wall opinion, art 51 did not apply because the attacks did not come from another state.
      - ask: Can V attribute the militia's attacks to H?
        hint: Nicaragua's threshold.
        answer: Only if H sent the group or had effective control of its operations; supplying arms or funds is not enough. Here the militia acts on its own.
      - ask: H is trying, and failing, to stop the militia. What is V's argument for striking without H's consent, and its weakness?
        hint: Unwilling or unable.
        answer: That H is unable to deal with the threat, so V may act itself — but the doctrine remains controversial and cuts across H's territorial integrity.
      - ask: What would make V's action far less contentious?
        hint: Invitation.
        answer: 'H''s consent: action against non-state actors invited by the host state is less contentious.'
    elements:
      - name: An armed attack by the group
        test: The group's attack reaches the armed attack threshold in scale and effects.
        authorities:
          - un-charter-art-51
      - name: Attribution to the host state
        test: The group was sent by or on behalf of the host state, or under its effective control — the ICJ's emphasis.
        cases:
          - nicaragua-v-united-states-of-america
          - construction-of-a-wall-advisory-opinion
          - armed-activities-on-the-territory-of-the-congo-democratic-republic-of-the-congo-v-uganda
      - name: If not attributable
        test: Seek the host state's consent; otherwise only the contested "unwilling or unable" argument remains.
      - name: Limits still apply
        test: Any force must be necessary, proportionate and reported to the Security Council.
        authorities:
          - un-charter-art-51
    what-if:
      - change: The host state invites the victim state to strike the group on its territory.
        effect: 'Far less contentious: with the host''s consent there is no breach of its territorial integrity — the invitation route.'
      - change: The group is shown to operate under the host state's effective control.
        effect: Its attacks can be treated as the host state's armed attack (Nicaragua), so self-defence against the host is available, subject to necessity and proportionality.
      - change: The attacks come from territory the victim state itself occupies.
        effect: 'As in the Wall opinion, art 51 does not apply: the attacks did not originate from another state.'
    boundary:
      - text: Western states' strikes against Islamic State.
        why: Part of the increasing state practice of invoking self-defence against non-state actors — still contested in law.
      - text: Turkey's actions against the PKK in Iraq.
        why: The slides' example of the controversial "unwilling or unable" argument.
    transfer:
      - scenario: A cartel's armed wing, based in State M, launches cross-border attacks that kill police in State N. M's army is fighting the cartel but losing ground. N wants to bomb the cartel's camps in M.
        answer: Art 51 does not require a state attacker, but the ICJ stresses attribution to the host state (Wall; Armed Activities), and the cartel is not M's agent. N's safest route is M's consent. Without it, N must argue M is "unable" to deal with the threat — a controversial doctrine. Any force must also be necessary, proportionate and reported.
    sources:
      - Week 09 - Lecture Slides - The Use of Force (slides 23–24)
      - 'Week 09 - Lecture Transcript (Online) - The Use of Force (Part B) (non-state actors: Nicaragua, 9/11 and the US letter, Resolution 1373, Wall and Armed Activities, "unwilling or unable", examples, invitation)'
