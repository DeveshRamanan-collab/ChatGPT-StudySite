aids:
  - concept: laws2400-w04-consent-defence-nature-and-onus
    plain: If a person freely agrees to what would otherwise be a tort, they generally cannot sue for it. Courts disagree about whether the plaintiff must disprove consent or the defendant must prove it.
    concrete: A patient sues a dentist in battery over unnecessary treatment, as in White v Johnston. If consent is a defence (McHugh J in Marion's Case), the dentist must plead and prove that the patient agreed. If consent is an element (Leeming JA in White v Johnston), the patient must prove she did not agree. When the evidence about consent is evenly balanced, whichever party carries that onus loses.
    formal: 'Consent is a defence to battery, assault, false imprisonment, trespass to land and interference with chattels, underpinned by deference to individual autonomy. England and New Zealand treat it as an element (plaintiff proves lack of consent). In Australia it is unsettled: McHugh J (Marion''s Case, obiter) — a defence the defendant proves; Leeming JA (White v Johnston, obiter) — an essential element of assault and battery.'
    analogy:
      text: 'A tie-break rule in sport: when the scores are level, a rule fixed in advance says which side loses. The onus of proof on consent is the tie-break for inconclusive evidence.'
      maps:
        - from: Level scores
          to: Evidence on consent that is evenly balanced
        - from: The tie-break rule
          to: The onus of proof on consent
        - from: The side that loses the tie-break
          to: The party who bears the onus (defendant if a defence; plaintiff if an element)
      limits:
        - In sport the tie-break rule is settled before the game; in Australia it is still unsettled which party bears the onus.
        - Onus also decides who must plead consent in the first place, not only who loses a tie.
    terms:
      - term: Onus of proof
        gloss: Which party must prove a point. If the evidence on that point is inconclusive, the party bearing the onus loses on it.
      - term: Element vs defence
        gloss: An element is part of the plaintiff's cause of action, which she must prove; a defence is raised and proved by the defendant.
      - term: Obiter
        gloss: 'A judge''s remark that was not necessary to decide the case: persuasive, not binding.'
        example: Both McHugh J's and Leeming JA's views on consent are obiter.
    misconceptions:
      - claim: Calling consent a defence or an element is just labelling; it never changes the result.
        tempting: Both views accept that genuine consent defeats liability, so the label looks cosmetic.
        correction: The label decides who must plead and prove consent, so it decides who loses when the evidence on consent is inconclusive (McHugh J in Marion's Case v Leeming JA in White v Johnston).
      - claim: The High Court has settled that consent is a defence the defendant must prove.
        tempting: McHugh J said so in Marion's Case, a High Court decision.
        correction: His remark was obiter, and Leeming JA in White v Johnston took the opposite obiter view. The position in Australia remains unsettled.
      - claim: Consent can be raised as a defence to any tort.
        tempting: If the plaintiff agreed, it seems unfair to let her sue for anything.
        correction: 'The lecture lists the torts consent answers: battery, assault, false imprisonment, trespass to land and interference with chattels.'
    socratic:
      - ask: A plaintiff says she never agreed to being touched. If she did agree, why would the law refuse her claim?
        hint: Whose choice was the touching?
        answer: 'Consent is underpinned by deference to individual autonomy: if a person freely agreed to the interference, the law generally will not intervene.'
      - ask: Suppose the evidence about her agreement is evenly balanced. What legal question now decides the case?
        hint: Someone has to lose when the evidence is level.
        answer: Who bears the onus of proof on consent. The party carrying it loses if the evidence is inconclusive.
      - ask: How do courts in England and New Zealand answer that question?
        hint: Do they treat consent as part of the plaintiff's own case?
        answer: They treat consent as an element of trespassory conduct, so the onus is on the plaintiff to prove lack of consent.
      - ask: What have Australian judges said?
        hint: Two obiter remarks point in opposite directions.
        answer: 'McHugh J in Marion''s Case: consent is a defence, so the defendant proves it. Leeming JA in White v Johnston: it is an essential element of assault and battery. The question is unsettled.'
      - ask: So how should an exam answer deal with it?
        hint: Flag it, cite both, and say why it matters.
        answer: Note the uncertainty, cite both obiter positions, and explain that whichever party bears the onus loses if the evidence on consent is inconclusive.
    what-if:
      - change: The court follows Leeming JA's view, and the evidence on consent is inconclusive.
        effect: 'The plaintiff loses on consent: as an essential element of assault and battery, it is for her to negative it, and inconclusive evidence does not do so.'
      - change: The court instead follows McHugh J's view on the same inconclusive evidence.
        effect: 'The defendant loses on consent: as a defence, the onus is on the defendant to prove that consent was given.'
      - change: The claim is in trespass to land rather than battery.
        effect: Consent is still available, since trespass to land is on the lecture's list; but Leeming JA's obiter view was framed for assault and battery, so the onus question is even less settled there.
    objections:
      - position: Consent is a defence, so the defendant must prove it.
        evidence: McHugh J in Marion's Case (obiter); the view courts in Canada and Australia have broadly taken.
        objection: 'Leeming JA in White v Johnston (obiter): the better view is that consent is an essential element of assault and battery, as in England and New Zealand.'
    transfer:
      - scenario: A gym member sues her personal trainer in battery over a hands-on stretching technique she says she never agreed to. The trainer says she nodded when he described it. At trial neither account is preferred.
        answer: Consent is available to battery, so the case turns on onus, which is unsettled in Australia. On McHugh J's view (Marion's Case) the trainer must prove consent and fails on level evidence; on Leeming JA's view (White v Johnston) the member must negative consent and fails. A good answer flags both views and that consequence.
    sources:
      - Topic 4 Lecture 1 (slides 3–7)
  - concept: laws2400-w04-consent-validity-and-scope
    plain: Consent protects the defendant only if it was freely given, by someone able to give it, for the very act done, and only up to the limits of what was agreed.
    concrete: 'During an Australian Rules match, the defendant struck the plaintiff on the head with a raised elbow moments after he had kicked the ball away, fracturing his skull. The defendant said this was contact a footballer must expect. Fox J disagreed in McNamara v Duncan: players consent to forcible contact justified by the rules and usages of the game, but this blow was deliberate and a serious infringement of the rules.'
    formal: 'Consent may be express or implied. To be valid it must be voluntary/free (sufficient knowledge; no force, fraud, threat or intimidation), come from a competent person, and relate to the act complained of. A false inducement does not vitiate consent if the plaintiff understands the "nature and character" of the interference. Conduct exceeding the consent is not protected: McNamara v Duncan; Dean v Phung.'
    analogy:
      text: 'Consent works like a permission slip for a school excursion: it must be signed freely, by someone entitled to sign, for this excursion, and it covers only the trip described, not a detour.'
      maps:
        - from: Signed freely
          to: 'Voluntary: no force, fraud, threat or intimidation'
        - from: Someone entitled to sign
          to: A competent person
        - from: This excursion
          to: The act complained of
        - from: No detour
          to: Conduct must not exceed the consent given (McNamara v Duncan; Dean v Phung)
      limits:
        - 'Consent need not be written or signed: it may be implied, for example from taking part in a game.'
        - A lie about something collateral does not void consent if the plaintiff understood the nature and character of the act.
    terms:
      - term: Express or implied consent
        gloss: Consent may be given in words or inferred from conduct, such as taking part in a contact sport.
      - term: '"Nature and character"'
        gloss: What the interference actually is. If the plaintiff understands this, a false inducement about something else does not invalidate consent.
        example: A false promise of marriage used to induce sexual relations.
      - term: Vitiate
        gloss: To destroy the legal effect of consent. Force, fraud, threat or intimidation vitiate consent.
      - term: Scope of consent
        gloss: The limits of what was actually agreed to; conduct beyond them is not protected.
        example: 'Dean v Phung: more than 53 consultations of unnecessary treatment for minor chipping.'
    misconceptions:
      - claim: Any lie by the defendant cancels the plaintiff's consent.
        tempting: Fraud is listed among the things that stop consent being freely given.
        correction: Not every misrepresentation nullifies consent. If the plaintiff understands the "nature and character" of the interference, consent is valid despite a false inducement, such as a false promise of marriage.
      - claim: By playing a contact sport, a player consents to any injury that happens during the game.
        tempting: Forcible contact is part of the game, and everyone knows fouls happen.
        correction: 'McNamara v Duncan: players consent to contact justified by the rules and usages of the game, not to a deliberate blow in serious breach of the rules, even if such acts may well occur.'
      - claim: Consent must be in writing, or at least stated in words, to be valid.
        tempting: Signed medical consent forms make written consent look like the norm.
        correction: Consent may be express or implied. What matters is that it is free, comes from a competent person, and relates to the act complained of.
    socratic:
      - ask: A patient saw a dentist about minor chipping of his front teeth. Did he agree to everything the dentist then did?
        hint: What act did his consent relate to?
        answer: No. Consent must relate to the act complained of. In Dean v Phung, more than 53 consultations of unnecessary procedures costing $73,640 were not validly consented to.
      - ask: What if a patient had been pressured into agreeing by threats?
        hint: What makes consent "free"?
        answer: 'Consent must be voluntary: the person needs sufficient knowledge of what she is consenting to, and there must be no force, fraud, threat or intimidation.'
      - ask: Does every false statement by the defendant destroy consent?
        hint: What did the plaintiff understand about the act itself?
        answer: No. If the plaintiff understands the "nature and character" of the interference, consent is valid even where a false inducement was used.
      - ask: A footballer is deliberately elbowed in the head, in serious breach of the rules. Did he consent to that by playing?
        hint: Contact justified by the rules and usages of the game, or deliberate injury?
        answer: No (McNamara v Duncan). Taking part covers contact within the rules and usages of the game, not deliberately inflicted injury.
      - ask: In what order should an answer test consent?
        hint: Free, competent, this act, then scope.
        answer: Check it was free (force, fraud or threat vitiate; a collateral false inducement does not), given by a competent person, related to the act, and that the conduct stayed within its scope.
    elements:
      - name: Consent given (express or implied)
        test: Did the plaintiff agree to the interference, in words or by conduct?
      - name: Voluntary / free
        test: Did she have sufficient knowledge of what she was agreeing to, with no force, fraud, threat or intimidation? A false inducement does not vitiate if she understood the nature and character of the act.
      - name: Competent person
        test: Did the person have sufficient understanding to comprehend the act and its consequences? Adults are presumed competent.
        cases:
          - brightwater-care-group-v-rossiter
          - gillick-v-west-norfolk-and-wisbech-area-health-authority
      - name: Related to the act complained of
        test: Was the consent given for this specific act?
        cases:
          - dean-v-phung
      - name: Not exceeded
        test: Did the defendant's conduct stay within the scope of what was actually agreed to?
        cases:
          - mcnamara-v-duncan
          - dean-v-phung
    what-if:
      - change: In McNamara v Duncan, the head contact came from a fair tackle within the rules.
        effect: 'Consent would likely cover it: taking part in the game is consent to forcible contact justified by its rules and usages, so the battery claim would fail.'
      - change: The defendant obtained the plaintiff's agreement by threatening her.
        effect: The consent is not free. Threat or intimidation vitiates it, so the defence fails at the first gate, whatever its scope.
      - change: Dr Phung had performed only the treatment the minor chipping needed.
        effect: The treatment would fall within the consent given for that problem, so consent would answer the battery claim.
    boundary:
      - text: A false promise of marriage used to induce sexual relations.
        why: 'Inside valid consent: the plaintiff understood the nature and character of the act, so the false inducement does not nullify it.'
      - text: Being jostled in an ordinary queue.
        why: 'Outside battery altogether: contact generally acceptable in the ordinary conduct of everyday life is not battery (Rixon v Star City), so consent never needs to be tested.'
    transfer:
      - scenario: A hairdresser and client agree on a 2 cm trim. Mid-cut, without asking, the hairdresser decides a much shorter style would suit the client and cuts 15 cm.
        answer: The client expressly consented, freely and competently, to a 2 cm trim. But consent relates to the specific act and does not cover conduct that exceeds it (McNamara v Duncan; Dean v Phung). The extra cutting falls outside the scope of what was agreed, so consent is no defence to that part.
    sources:
      - Topic 4 Lecture 1 (slides 8–11, 19–20)
      - Casebook, Topic 4 — McNamara v Duncan (Fox J)
      - Topic 2 Flowcharts (p 77, unit note on Rixon v Star City)
  - concept: laws2400-w04-consent-capacity-and-minors
    plain: Consent only counts if the person could understand what they agreed to. Adults are assumed able; a child can be too once mature enough, but a court can still step in.
    concrete: 'X, a 17-year-old Jehovah''s Witness with aggressive Hodgkin''s disease, refused a blood transfusion his chemotherapy needed, and his parents supported him. The trial judge accepted he was competent to decide. Even so, the Court of Appeal upheld orders authorising the transfusion: the parens patriae jurisdiction extends to any person under 18, and s 174 of the Care and Protection Act did not exclude it absent clear words.'
    formal: 'Consent must come from a competent person: one with sufficient understanding to comprehend the act and its consequences. Adults are presumed competent (rebuttable). A minor can consent once she has "sufficient understanding and intelligence to enable her to understand fully what is proposed" (Gillick, approved in Marion''s Case). Parents cannot consent to non-therapeutic treatment not in the child''s interests (Marion''s Case); parens patriae reaches anyone under 18 (X v SCHN).'
    analogy:
      text: 'Capacity works like a driving licence: adults hold one by default (but not while drunk), a teenager can earn one by showing competence, and a court can still take the keys in a serious case.'
      maps:
        - from: Adults hold a licence by default
          to: Adults are presumed competent
        - from: Not while drunk
          to: The presumption can be displaced (drunk, asleep, unconscious)
        - from: A teenager earns a licence by showing competence
          to: 'Gillick competence: sufficient understanding and intelligence'
        - from: A court taking the keys
          to: The parens patriae jurisdiction overriding a competent minor (X v SCHN)
      limits:
        - A licence follows a fixed age and test; Gillick competence is a question of fact about understanding this particular decision.
        - 'Nobody grants capacity: it exists or it does not, and parental consent has limits a licence does not mirror (non-therapeutic treatment).'
    terms:
      - term: Capacity (competence)
        gloss: Sufficient understanding to comprehend the act and its consequences.
      - term: Gillick competence
        gloss: A minor's capacity to consent once she has sufficient understanding and intelligence to understand fully what is proposed.
        example: A 15-year-old consenting to contraceptive advice in Gillick.
      - term: Parens patriae jurisdiction
        gloss: The Supreme Court's protective jurisdiction over people under 18, which can override even a competent minor's decision.
        example: X v Sydney Children's Hospital Network.
      - term: Non-therapeutic treatment
        gloss: Treatment not for the child's illness, such as sterilisation, which parents cannot authorise when it is not in the child's interests.
        example: Marion's Case.
    misconceptions:
      - claim: A person under 18 can never give valid consent to medical treatment.
        tempting: Eighteen is the age of majority, and parents usually sign for their children.
        correction: 'Gillick, approved by the High Court in Marion''s Case: a minor can consent once she has sufficient understanding and intelligence to understand fully what is proposed.'
      - claim: Once a minor is Gillick-competent, her decision is final.
        tempting: If she can consent, it seems she must also be free to refuse.
        correction: 'X v Sydney Children''s Hospital Network: the parens patriae jurisdiction extends to any person under 18, even a competent mature minor, and s 174 of the Care and Protection Act did not exclude it.'
      - claim: A child with an intellectual disability cannot consent, so her parents may consent to any treatment for her.
        tempting: Disability seems to remove understanding, leaving the decision with the parents.
        correction: 'Marion''s Case: disability does not of itself mean a child cannot consent, and parents cannot consent to non-therapeutic treatment, such as sterilisation, that is not in the child''s interests.'
    socratic:
      - ask: A paralysed but mentally competent man directs his care home to stop his nutrition and fluids. May staff keep feeding him?
        hint: Is he competent, and whose body is it?
        answer: No. In Brightwater Care Group v Rossiter, continuing against the wishes of a competent patient would be a trespass, given his right to autonomy and self-determination.
      - ask: What if the adult were drunk, asleep or unconscious?
        hint: Adults are presumed competent. Can that presumption give way?
        answer: 'Yes. The presumption is rebuttable: an adult who is drunk, asleep or unconscious may lack capacity to consent.'
      - ask: Can a 15-year-old consent to contraceptive advice without her parents?
        hint: Gillick.
        answer: Yes, if she has sufficient understanding and intelligence to understand fully what is proposed (Gillick, approved by the High Court in Marion's Case).
      - ask: Can parents consent to sterilising their intellectually disabled daughter?
        hint: Is the treatment therapeutic, and in her interests?
        answer: 'No. Marion''s Case: parents cannot consent to non-therapeutic treatment not in the child''s interests; more than parental consent is required.'
      - ask: A competent 17-year-old refuses a life-saving transfusion. Is that the end of the matter?
        hint: Is there a jurisdiction above both parent and child?
        answer: 'No. X v SCHN: the parens patriae jurisdiction extends to any person under 18 and can override even a competent minor''s refusal.'
    elements:
      - name: Presumption of adult capacity
        test: Is the person an adult? If so, presume sufficient understanding of the act and its consequences, unless displaced (e.g. drunk, asleep, unconscious).
        cases:
          - brightwater-care-group-v-rossiter
      - name: Gillick competence (minors)
        test: Has the minor achieved sufficient understanding and intelligence to understand fully what is proposed? A disability does not of itself defeat this.
        cases:
          - gillick-v-west-norfolk-and-wisbech-area-health-authority
          - secretary-department-of-health-and-community-services-v-jwb
      - name: Limits of parental consent
        test: If a parent consents for the child, is the treatment therapeutic and in the child's interests? Non-therapeutic treatment (e.g. sterilisation) needs more than parental consent.
        cases:
          - secretary-department-of-health-and-community-services-v-jwb
      - name: Court override
        test: Could the parens patriae jurisdiction, or a statute requiring court consent, override even a competent minor's decision?
        cases:
          - x-v-sydney-childrens-hospital-network
        authorities:
          - children-and-young-persons-care-and-protection-act-1998-nsw-s174
    what-if:
      - change: The 15-year-old in Gillick had not yet reached sufficient understanding of what was proposed.
        effect: She could not give valid consent herself. As Lord Scarman put it, until the child achieves capacity, the parental right to decide continues, save in exceptional circumstances.
      - change: X had already turned 18 when he refused the transfusion.
        effect: The parens patriae jurisdiction over minors would not reach him (the orders were varied to expire on his 18th birthday); as a competent adult his refusal would be respected, as in Rossiter.
      - change: The patient in Rossiter had been unconscious rather than competent.
        effect: The presumption of capacity would be displaced, so he could neither consent nor refuse; whether treatment was justified would turn on necessity (In re F) instead.
    boundary:
      - text: 'X v SCHN: a competent 17-year-old''s refusal of a transfusion was overridden.'
        why: 'At the edge of Gillick: competence was found, yet the parens patriae jurisdiction still applied because it extends to any person under 18.'
      - text: Gender reassignment surgery for a minor, with parental consent.
        why: 'Outside what parents alone can authorise: the lecture lists it, with sterilisation of mentally disabled minors, as treatment not for the child''s illness where parental consent has been held insufficient.'
    transfer:
      - scenario: A 16-year-old gymnast, assessed by her surgeon as fully understanding a proposed knee operation, wants it done. Her parents object.
        answer: Under Gillick, approved in Marion's Case, a minor can consent once she has sufficient understanding and intelligence to understand fully what is proposed, and the parental right to decide then yields. If she is competent, her consent protects the surgeon. The court's parens patriae jurisdiction still extends to her and could in principle be invoked (X v SCHN).
    sources:
      - Topic 4 Lecture 1 (slides 12–18)
      - Casebook, Topic 4 — X v Sydney Children's Hospital Network (Basten JA, quoting Lord Scarman in Gillick)
  - concept: laws2400-w04-self-defence-common-law-and-cla
    plain: You may use force to protect yourself, others or property, but only if you reasonably fear force and respond in proportion. In NSW, the statute adds that what you respond to must be unlawful.
    concrete: Fontin wrongly accused Katapodis of not paying for goods, and a heated argument followed. Katapodis picked up a wooden T-square and broke it on Fontin's shoulder. Fontin threw an off-cut of glass at Katapodis's face, injuring his hand. The High Court held Fontin had the right to defend himself, but throwing the glass "was out of all reasonable proportion to the emergency confronting" him, so self-defence failed.
    formal: 'Common law: the defendant must prove a reasonable apprehension of physical force to the defendant or others, and that the force used was proportionate to the threat (Zecevic v DPP). Section 52 CLA: no liability for conduct believed necessary for a listed purpose that is a reasonable response in the circumstances as perceived, but only if the conduct responded to was unlawful. The regimes run in parallel.'
    analogy:
      text: Two different keys open the same door. The common law key is reasonable apprehension plus proportion; the statutory key is s 52 (belief in necessity, reasonable response, unlawful conduct). The defendant needs only one key that fits.
      maps:
        - from: The door
          to: Escaping liability for the force used
        - from: Common law key
          to: Zecevic v DPP two-limb test
        - from: Statutory key
          to: Section 52 CLA test
        - from: Needing only one key
          to: The regimes run in parallel (s 3A(1) CLA)
      limits:
        - 'The keys are cut differently: only s 52 requires that the conduct responded to be unlawful.'
        - 'A near-miss on the statutory key is not worthless: s 53 can still bar or limit damages when only reasonableness fails.'
    terms:
      - term: Reasonable apprehension
        gloss: A reasonably held expectation that physical force is about to be used against the defendant or others (Zecevic v DPP).
      - term: Proportionality
        gloss: The force used must be in proportion to the threat; a response "out of all reasonable proportion to the emergency" fails.
        example: 'Fontin v Katapodis: glass thrown at the face after a blow with a T-square.'
      - term: Unlawful conduct (s 52)
        gloss: The conduct responded to must be unlawful (held to include criminal and tortious conduct), or would have been but for a mental health or cognitive impairment.
        example: 'NSW v McMaster: running at police was a negligent trespass to the person.'
      - term: Reasonable response as perceived
        gloss: Under s 52(2), the response is judged in the circumstances as the defendant perceived them.
    misconceptions:
      - claim: If the plaintiff struck first, the defendant may hit back with whatever force they like.
        tempting: The plaintiff started it, and the defendant did have a right to defend himself.
        correction: 'Fontin v Katapodis: Fontin could defend himself, but throwing glass at Katapodis''s face was "out of all reasonable proportion to the emergency". Force must be proportionate to the threat (Zecevic v DPP).'
      - claim: The Civil Liability Act replaced the common law of self-defence in NSW.
        tempting: Sections 52–54 codified and modified the defence.
        correction: The two regimes operate in parallel with different tests (s 3A(1) CLA; s 3B(1)(a) keeps Part 7 for intentional acts), so the common law test still applies.
      - claim: The common law test and the s 52 test are the same.
        tempting: Both ask about a perceived threat and a reasonable response to it.
        correction: Section 52 also requires that the conduct responded to was unlawful (criminal or tortious). The common law test has no unlawful-conduct requirement.
    socratic:
      - ask: Katapodis broke a T-square on Fontin's shoulder. Could Fontin respond with force?
        hint: Was there a reasonable apprehension of physical force?
        answer: 'Yes. Fontin had the right to defend himself: there was a reasonable apprehension of physical force.'
      - ask: Fontin then threw glass at Katapodis's face. Once the first limb is met, is any response allowed?
        hint: Zecevic v DPP has a second limb.
        answer: No. The force must be proportionate to the threat; throwing glass at the face was "out of all reasonable proportion to the emergency" (Fontin v Katapodis).
      - ask: In NSW, what extra question does s 52 CLA ask that the common law does not?
        hint: Look at what the defendant was responding to.
        answer: Whether the conduct responded to was unlawful, or would have been but for a mental health or cognitive impairment.
      - ask: How is the response judged under s 52?
        hint: 'Read s 52(2): whose perception counts?'
        answer: The person must believe the conduct necessary for a listed purpose, and it must be a reasonable response in the circumstances as he or she perceives them.
      - ask: A defendant fails the s 52 test but meets the common law test. Is the defence lost?
        hint: Does the statute replace the common law?
        answer: No. The regimes run in parallel (s 3A(1) CLA), so the defendant can rely on whichever test is satisfied.
    elements:
      - name: Interest defended
        test: 'Was force used to defend the defendant, another person (family or stranger), or property? For land: only the person in possession, after a request to leave and a chance to comply.'
      - name: Reasonable apprehension (common law)
        test: Did the defendant reasonably apprehend physical force to the defendant or others?
        cases:
          - zecevic-v-dpp
      - name: Proportionate force (common law)
        test: Was the force used proportionate to the threat, not "out of all reasonable proportion to the emergency"?
        cases:
          - zecevic-v-dpp
          - fontin-v-katapodis
      - name: Unlawful conduct responded to (s 52(1))
        test: Was the conduct responded to unlawful (criminal or tortious), or would it have been but for a mental health or cognitive impairment?
        cases:
          - nsw-v-mcmaster
        authorities:
          - civil-liability-act-2002-nsw-s52
      - name: Belief and reasonable response (s 52(2))
        test: Did the defendant believe the conduct necessary for a listed purpose, and was it a reasonable response in the circumstances as perceived?
        cases:
          - nsw-v-mcmaster
        authorities:
          - civil-liability-act-2002-nsw-s52
      - name: Unreasonable response (s 53)
        test: If only reasonableness failed, no damages unless the circumstances are exceptional and refusal would be harsh and unjust; even then, none for non-economic loss.
        authorities:
          - civil-liability-act-2002-nsw-s53
    what-if:
      - change: In Fontin v Katapodis, Fontin had merely pushed Katapodis away.
        effect: A push is far more likely to be proportionate to a blow with a T-square, so the second Zecevic limb would likely be met and self-defence could succeed.
      - change: In NSW v McMaster, Justin's conduct had not been unlawful at all.
        effect: Section 52 could not apply, because it protects only responses to unlawful conduct. The constable would rely on the common law test, which has no such requirement, or on necessity.
      - change: The defendant honestly believed the force necessary, but it was not a reasonable response as perceived.
        effect: Section 52 fails. Under s 53 the court must not award damages unless the circumstances are exceptional and refusal would be harsh and unjust, and even then not for non-economic loss.
    boundary:
      - text: Forcing a trespasser off land without first asking them to leave.
        why: 'Generally outside the common law defence: protecting land is available to the person in possession, and a request to leave, with a chance to comply, should first be made.'
      - text: 'NSW v McMaster: police shot a man running at them holding a metal curtain rod.'
        why: 'Inside s 52: the Court of Appeal held both the subjective and objective requirements were met, and Justin''s conduct was unlawful as a negligent trespass to the person.'
    transfer:
      - scenario: A shop security guard sees a customer grab a phone and run. He tackles the customer, then keeps punching him while he lies pinned and still.
        answer: Self-defence extends to protecting property (chattels) from unlawful interference, and s 52(2)(c) covers protecting property from unlawful taking; the theft is unlawful conduct. The tackle may be proportionate and a reasonable response. Punching a pinned, still person is likely "out of all reasonable proportion" (Fontin v Katapodis) and not a reasonable response under s 52.
    sources:
      - Topic 4 Lecture 1 (slides 21–30)
      - Civil Liability Act 2002 (NSW) ss 3A, 3B, 52–53 (act-2002-022.pdf)
  - concept: laws2400-w04-legal-process-defence
    plain: Acting under a lawful power, such as a valid arrest or a lawful entry onto land, is a defence to what would otherwise be a trespass.
    concrete: A police officer entered the curtilage of Ms Roy's unit to check compliance with a domestic violence order. The High Court held 3:2 in Roy v O'Neill that this entry was within the implied licence from Halliday v Nevill. At the door, the officer observed that Roy was intoxicated. That observation enlivened a statutory power to remain for a breath test (Police Administration Act 1978 (NT) s 126(2A)), giving independent authority to stay.
    formal: Lawful arrest is a defence to trespass to the person. Under LEPRA s 99(1), arrest without warrant requires BOTH suspicion on reasonable grounds that the person is committing or has committed an offence AND satisfaction that arrest is reasonably necessary for a listed reason; ss 230–231 allow only reasonably necessary force. Entry may rest on the implied licence (Halliday v Nevill); remaining may need a separate power (Roy v O'Neill).
    terms:
      - term: Reasonable suspicion
        gloss: 'Suspicion on reasonable grounds: more than a possibility, less than a belief.'
      - term: Implied licence
        gloss: Permission for anyone, including police, to use an unobstructed path or driveway for lawful communication with the occupier (Halliday v Nevill).
      - term: Independent authority to remain
        gloss: A separate statutory power that justifies staying on land, so the stay no longer depends on the implied licence.
        example: 'Roy v O''Neill: the NT breath-test power, enlivened by observing intoxication.'
    misconceptions:
      - claim: Reasonable suspicion of an offence is enough for a lawful arrest without warrant.
        tempting: Reasonable suspicion is the familiar trigger for police action.
        correction: Section 99(1) LEPRA requires BOTH reasonable suspicion AND satisfaction that arrest is reasonably necessary for one of the listed reasons.
      - claim: Once an arrest is lawful, police may use whatever force it takes to complete it.
        tempting: A lawful arrest seems to authorise the steps needed to carry it out.
        correction: Sections 230–231 LEPRA permit only such force as is reasonably necessary.
      - claim: The implied licence let the officer in Roy v O'Neill stay on the land to breath-test the occupier.
        tempting: The High Court upheld both the entry and the officer's staying.
        correction: The implied licence (Halliday v Nevill) covered the entry; the power to remain came independently from the statutory breath-test power, enlivened by observing Roy's intoxication.
    socratic:
      - ask: An officer handcuffs a suspect without a warrant. Why is this not automatically battery and false imprisonment?
        hint: Was the officer acting under a lawful power?
        answer: Lawful arrest is a defence to trespass to the person, if the statutory power to arrest was properly exercised.
      - ask: What must the officer have in mind to arrest without warrant under s 99(1) LEPRA?
        hint: Two things, joined by AND.
        answer: Suspicion on reasonable grounds that the person is committing or has committed an offence, and satisfaction that arrest is reasonably necessary for a listed reason.
      - ask: How strong must the suspicion be?
        hint: Compare a mere possibility with a belief.
        answer: More than a possibility, but less than a belief.
      - ask: Police walk up a driveway to check on a domestic violence order. Is that a trespass?
        hint: Halliday v Nevill.
        answer: No. The implied licence lets anyone, including police, use an unobstructed path or driveway for lawful communication; Roy v O'Neill (3:2) held the DVO check was within it.
      - ask: What then justified the officer staying to breath-test the occupier?
        hint: Look for a separate, statutory source of power.
        answer: Observing Roy's intoxication enlivened the breath-test power (Police Administration Act 1978 (NT) s 126(2A)), an independent authority to remain.
    elements:
      - name: Reasonable suspicion (s 99(1)(a))
        test: Did the officer suspect on reasonable grounds that the person is committing or has committed an offence (more than a possibility, less than a belief)?
        authorities:
          - law-enforcement-powers-and-responsibilities-act-2002-nsw-s99
      - name: Arrest reasonably necessary (s 99(1)(b))
        test: Was the officer satisfied that arrest was reasonably necessary for a reason the Act lists?
        authorities:
          - law-enforcement-powers-and-responsibilities-act-2002-nsw-s99
      - name: Reasonable force (ss 230–231)
        test: Was the force used no more than reasonably necessary?
        authorities:
          - law-enforcement-powers-and-responsibilities-act-2002-nsw-ss230-231
      - name: 'Entry: implied licence'
        test: Was the entry by an unobstructed path or driveway, for lawful communication with the occupier?
        cases:
          - halliday-v-nevill
          - roy-v-oneill
      - name: 'Remaining: independent power'
        test: If the stay went beyond the licence, did a separate statutory power authorise remaining on the land?
        cases:
          - roy-v-oneill
        authorities:
          - police-administration-act-1978-nt-s126
    what-if:
      - change: The officer reasonably suspects shoplifting but arrests the person only to question them about something unrelated.
        effect: 'The second limb of s 99(1) is missing: the officer was not satisfied arrest was reasonably necessary for a listed reason. The arrest is unlawful and the legal process defence fails.'
      - change: In Roy v O'Neill, the officer had seen no sign of intoxication.
        effect: No breath-test power would be enlivened, so any stay would have to rest on the implied licence alone, without independent authority to remain.
      - change: The arrest is lawful, but the officer uses more force than reasonably necessary.
        effect: The excess falls outside ss 230–231 LEPRA, so legal process does not cover it, even though the arrest itself is lawful.
    boundary:
      - text: Roy v O'Neill was decided 3:2.
        why: 'A proactive DVO compliance check sat at the edge of the implied licence: the majority held it within, but two judges disagreed.'
    transfer:
      - scenario: A council officer walks up a resident's open driveway to hand over a notice, then, relying on no other power, goes into the fenced backyard to photograph the trees.
        answer: Walking up an unobstructed driveway for lawful communication with the occupier is within the implied licence (Halliday v Nevill), so the approach is excused. Going into the backyard to photograph goes beyond lawful communication. Unless a separate statutory power gives independent authority, as in Roy v O'Neill, legal process gives no defence to trespass there.
    sources:
      - Topic 4 Lecture 1 (slides 31–32)
      - Casebook, Topic 3 — Roy v O'Neill (facts)
  - concept: laws2400-w04-provocation-and-contributory-negligence
    plain: In tort, having been provoked, or the victim having been careless, generally does not reduce what an intentional wrongdoer must pay.
    concrete: 'Horkin had too much to drink and was asked to leave the North Melbourne Football Club. When he did not, club employees threw him out with more force than necessary, injuring him. The trial judge cut his damages by 30% for contributory negligence (his intoxication and failure to leave). The Victorian Supreme Court restored full liability: intentional battery and carelessness differ "not merely in degree but in kind".'
    formal: 'Provocation is a defence to a criminal charge but generally not to a tort: it cannot reduce compensatory damages, though it may help reduce or prevent exemplary damages (Fontin v Katapodis). Queensland and Western Australia are exceptions. Contributory negligence has been rejected for intentional torts: "the difference is not merely in degree but in kind, and the social condemnation attached to the fault differs markedly" (Horkin).'
    terms:
      - term: Provocation
        gloss: Conduct by the plaintiff that incites the defendant's response. A defence to a criminal charge, but generally not to a tort action.
      - term: Contributory negligence
        gloss: Carelessness by the plaintiff that contributed to their own injury.
      - term: Compensatory vs exemplary damages
        gloss: Compensatory damages make good the plaintiff's loss; exemplary damages go beyond that to mark the defendant's conduct. Provocation can affect only exemplary damages.
    misconceptions:
      - claim: Provocation reduces the compensatory damages a provoked defendant must pay for battery.
        tempting: Provocation is a recognised defence in criminal law.
        correction: 'Fontin v Katapodis: provocation cannot reduce compensatory damages, though it may help reduce or prevent exemplary damages. Only Queensland and Western Australia allow it as a tort defence.'
      - claim: A drunk plaintiff who refuses to leave should have damages cut for contributory negligence.
        tempting: The trial judge in Horkin did exactly that, reducing liability by 30%.
        correction: 'The Victorian Supreme Court reversed that: intentional battery and carelessness differ "not merely in degree but in kind", so contributory negligence does not reduce liability for an intentional tort.'
      - claim: Provocation can never be pleaded in any Australian tort action.
        tempting: The general rule is that provocation is not a tort defence.
        correction: 'Queensland and Western Australia are an exception: provocation may be pleaded as a defence there.'
    socratic:
      - ask: Fontin argued he was provoked into throwing the glass. Does that reduce the compensation he must pay Katapodis?
        hint: Separate compensatory from exemplary damages.
        answer: No. Provocation cannot reduce compensatory damages (Fontin v Katapodis); it may only help reduce or prevent exemplary damages.
      - ask: Would the answer differ in Brisbane or Perth?
        hint: Two states are exceptions.
        answer: Yes. In Queensland and Western Australia, provocation may be pleaded as a defence.
      - ask: Horkin was drunk and refused to leave. Why not reduce his damages for that carelessness?
        hint: Compare the defendant's fault with the plaintiff's.
        answer: An intentional battery and the plaintiff's carelessness differ "not merely in degree but in kind", and the social condemnation attached to each differs markedly (Horkin).
      - ask: A car left unlocked with the keys in the ignition is stolen. Should contributory negligence reduce the thief's liability in conversion?
        hint: Weigh personal responsibility against excusing theft.
        answer: 'It is an open policy question: the defence might encourage personal responsibility, but the owner''s carelessness arguably does not justify theft.'
    objections:
      - position: Contributory negligence should reduce liability in conversion where the owner left the car unlocked with the keys in the ignition.
        evidence: The careless owner created the opportunity for theft; allowing the defence would encourage more personal responsibility in society.
        objection: The plaintiff's carelessness does not justify theft. Horkin treats intentional wrongdoing and carelessness as different "in kind", not just degree.
    what-if:
      - change: The dispute in Fontin v Katapodis had arisen in Queensland.
        effect: Provocation may be pleaded as a defence there, so Fontin's provocation argument would be open rather than generally unavailable.
      - change: Katapodis had also claimed exemplary damages.
        effect: 'Provocation could then matter: it may help reduce or prevent an exemplary award, even though it cannot touch compensatory damages.'
    boundary:
      - text: Theft of a car left unlocked with keys in the ignition (conversion).
        why: 'Unsettled: the lecture leaves open whether contributory negligence should apply to conversion, weighing personal responsibility against not excusing theft.'
    transfer:
      - scenario: In Sydney, a nightclub patron taunts a bouncer for ten minutes and ignores requests to leave; the bouncer then punches him. Sued in battery, the bouncer argues provocation and the patron's carelessness in staying.
        answer: Neither argument reduces compensatory damages. Provocation is generally not a tort defence (Fontin v Katapodis), and NSW is not Queensland or Western Australia; at most it may affect exemplary damages. Contributory negligence is rejected for intentional torts because the fault differs "not merely in degree but in kind" (Horkin).
    sources:
      - Topic 4 Lecture 2 (slides 3–6)
  - concept: laws2400-w04-necessity-defence
    plain: An act that would normally be a tort can be excused if it was needed to prevent serious harm and was a reasonable, proportionate response. Courts keep this defence narrow.
    concrete: 'In Proudman v Allen, the defendant saw a driverless car rolling down a slope towards another car. He turned its steering wheel to avoid the collision, and the runaway car rolled into the sea. Its owner sued. The defendant succeeded on necessity: he acted to protect property from harm, and the defence is available even to strangers who act to protect the property of others.'
    formal: Necessity may be available if the action was necessary to prevent serious harm to person or property, and was reasonable in the circumstances and proportionate to the risk. The doctrine "must be carefully circumscribed" (Southwark v Williams). In medicine (In re F), it must not be practicable to communicate with the assisted person, and the action must be what a reasonable person would take in their best interests.
    analogy:
      text: 'Necessity is like an emergency exit: you may break the glass when there is a real fire, and only as much as you need, but not because the main door is inconvenient.'
      maps:
        - from: A real fire
          to: Serious, imminent harm to person or property
        - from: Breaking only the glass you need
          to: Action reasonable and proportionate to the risk
        - from: Not for convenience
          to: The doctrine is "carefully circumscribed" (Southwark v Williams)
      limits:
        - An emergency exit serves the person in danger; necessity also protects strangers who act for others' property (Proudman v Allen).
        - In medicine, necessity can justify ongoing treatment of a permanently incapacitated patient, not just a one-off emergency (In re F).
    terms:
      - term: Public necessity
        gloss: Action to save lives or protect the public, such as throwing luggage from a sinking ship to save lives.
      - term: Necessity to protect property
        gloss: Action to protect property from harm, such as trespassing on a neighbour's land to rescue your cat.
      - term: Best interests
        gloss: 'Lord Goff in In re F: the action must be what a reasonable person would take, acting in the best interests of the assisted person.'
      - term: Temporary vs permanent incapacity
        gloss: 'Temporary: do no more than is necessary before the patient recovers consciousness. Permanent: no point waiting for consent; act in the patient''s best interests.'
    misconceptions:
      - claim: Desperate need, such as homelessness, justifies entering empty property under necessity.
        tempting: The need is real and serious, and the houses were standing empty.
        correction: 'Southwark v Williams: the doctrine must be carefully circumscribed. If homelessness were admitted as a defence to trespass, "no one''s house would be safe"; necessity is confined to urgent situations of imminent peril.'
      - claim: Only the owner of threatened property can rely on necessity to protect it.
        tempting: Protecting property sounds like the owner's business alone.
        correction: 'Proudman v Allen: even volunteers or strangers who act to protect the property of others can use the defence.'
      - claim: Necessity is just self-defence applied to property.
        tempting: Both excuse force used to avert harm, and both were pleaded in NSW v McMaster.
        correction: Necessity also covers public necessity and medical treatment (In re F), needs no unlawful attacker, and its test is necessity plus reasonableness and proportionality to the risk.
    socratic:
      - ask: A ship is sinking and a passenger throws another passenger's luggage overboard. Why might that not be a tort?
        hint: What harm was being prevented?
        answer: 'Public necessity: the action was necessary to prevent serious harm to people and was reasonable and proportionate to the risk.'
      - ask: Homeless families make an orderly entry into empty council houses. Is their need a "necessity"?
        hint: What did Lord Denning fear would follow?
        answer: 'No. Southwark v Williams: the doctrine must be carefully circumscribed; if homelessness were admitted as a defence, "no one''s house would be safe".'
      - ask: A stranger steers a runaway car away from another car, sending it into the sea. Can a non-owner rely on necessity?
        hint: Proudman v Allen.
        answer: Yes. Even volunteers or strangers who act to protect the property of others can use the defence.
      - ask: A doctor treats a patient who cannot consent. What must be shown for necessity?
        hint: Lord Goff's two requirements in In re F.
        answer: That it was not practicable to communicate with the patient, and that the action was what a reasonable person would take in the patient's best interests.
      - ask: Does it matter whether the incapacity is temporary or permanent?
        hint: Will the patient wake up?
        answer: Yes. If temporary, do no more than is necessary before the patient recovers consciousness; if permanent, act in the patient's best interests without waiting.
    elements:
      - name: Necessary to prevent serious harm
        test: Was the action necessary to prevent serious harm to person or property, in an urgent situation of imminent peril rather than an ongoing state of need?
        cases:
          - southwark-london-borough-council-v-williams
          - proudman-v-allen
      - name: Reasonable and proportionate
        test: Was the action reasonable in the circumstances and proportionate to the risk posed?
        cases:
          - proudman-v-allen
          - nsw-v-mcmaster
      - name: 'Medical: communication impracticable'
        test: Was it not practicable to communicate with the assisted person?
        cases:
          - in-re-f-mental-patient-sterilisation
      - name: 'Medical: best interests'
        test: Was the action what a reasonable person would take in the assisted person's best interests, and no more than necessary if the incapacity is temporary?
        cases:
          - in-re-f-mental-patient-sterilisation
    what-if:
      - change: In Proudman v Allen, the runaway car was rolling towards an empty field, not another car.
        effect: There would be no serious harm to prevent, so the first condition fails; steering it into the sea would not be necessary and the defence would not excuse the damage.
      - change: The Southwark squatters had sought only a brief initial entry in an emergency, not continued occupation.
        effect: 'Still doubtful: Edmund Davies LJ said that even if necessity could be invoked, it could at most justify an initial entry, never continued occupation for an indefinite period. A brief emergency entry is the most it could cover.'
      - change: An emergency patient is expected to regain consciousness within hours.
        effect: 'Temporary incapacity: under In re F the doctor should do no more than is necessary before the patient recovers; non-urgent treatment must wait for the patient''s consent.'
    boundary:
      - text: 'NSW v McMaster: police shot a man running at them with a curtain rod, mistaking him for the intruder.'
        why: 'Inside necessity in trespass to the person: there was imminent danger and the steps taken were reasonably necessary to ward it off. It was pleaded alongside self-defence.'
      - text: Force-feeding asylum seekers.
        why: 'Governed by legislation, not just the common law test: the lecture notes the Migration Regulations 1994 (Cth) permit it, as statute often governs medical situations.'
    transfer:
      - scenario: During a bushfire, a farmer cuts a neighbour's fence and drives his sheep across the neighbour's paddock to safety, flattening some crops.
        answer: Necessity to protect property may excuse the trespass and damage if the action was necessary to prevent serious harm (fire threatening the flock) and reasonable and proportionate to the risk. Unlike the ongoing need in Southwark v Williams, this is an urgent, imminent peril; flattening crops along the escape route is likely proportionate.
    storyboard:
      - caption: F cannot consent
        detail: F, a 36-year-old woman with a serious mental disability, developed a sexual relationship with a fellow patient.
      - caption: Doctors fear pregnancy
        detail: Her doctors felt she could not cope with pregnancy and childbirth, and there were no other viable alternatives.
      - caption: Mother seeks a declaration
        detail: F's mother asked the court to declare that sterilisation would be lawful.
      - caption: Lord Goff grants it
        detail: Necessity applies where communication is impracticable and the action is what a reasonable person would take in her best interests.
      - caption: 'Permanent incapacity: no waiting'
        detail: Because F's incapacity was permanent, there was no point waiting for consent; doctors act in her best interests.
    sources:
      - Topic 4 Lecture 2 (slides 7–16)
      - Casebook, Topic 4 — Southwark London Borough Council v Williams (Lord Denning MR, Edmund Davies LJ)
flows:
  - slug: consent-valid
    title: Does consent defeat the claim?
    summary: 'Walks a consent defence through the slide order: onus, giving, voluntariness, capacity (including minors) and scope.'
    start: n1
    concepts:
      - laws2400-w04-consent-defence-nature-and-onus
      - laws2400-w04-consent-validity-and-scope
      - laws2400-w04-consent-capacity-and-minors
    sources:
      - Topic 4 Lecture 1 (slides 4–20)
    nodes:
      - id: n1
        kind: step
        text: Note who bears the onus on consent.
        note: 'Unsettled in Australia: McHugh J (Marion''s Case, obiter) treats consent as a defence the defendant proves; Leeming JA (White v Johnston, obiter) as an element the plaintiff must negative.'
        concept: laws2400-w04-consent-defence-nature-and-onus
        cases:
          - secretary-department-of-health-and-community-services-v-jwb
          - white-v-johnston
        next: n2
      - id: n2
        kind: ask
        text: Did the plaintiff consent, expressly or impliedly, to the conduct?
        note: Consent may be express or implied, for example by taking part in a contact sport.
        branches:
          - label: 'Yes'
            to: n3
          - label: 'No'
            to: e-none
      - id: n3
        kind: ask
        text: Was the consent given freely?
        note: The plaintiff needs sufficient knowledge of what she is consenting to, and there must be no force, fraud, threat or intimidation.
        concept: laws2400-w04-consent-validity-and-scope
        branches:
          - label: 'Yes'
            to: n5
          - label: There was a misrepresentation
            to: n4
          - label: 'No: force, threat or intimidation'
            to: e-vitiated
      - id: n4
        kind: ask
        text: Did the plaintiff still understand the "nature and character" of the interference?
        note: 'Not every misrepresentation nullifies consent: a false inducement, such as a false promise of marriage, leaves consent valid if the nature and character of the act was understood.'
        exception: true
        branches:
          - label: 'Yes'
            to: n5
          - label: 'No'
            to: e-vitiated
      - id: n5
        kind: ask
        text: Was the person who consented competent?
        note: Capacity means sufficient understanding to comprehend the act and its consequences. Adults are presumed competent, but not if, say, drunk, asleep or unconscious.
        concept: laws2400-w04-consent-capacity-and-minors
        cases:
          - brightwater-care-group-v-rossiter
        branches:
          - label: 'Yes: a competent adult'
            to: n8
          - label: The person is a minor
            to: n6
          - label: 'No: an adult lacking capacity'
            to: e-none
      - id: n6
        kind: ask
        text: Has the minor achieved sufficient understanding and intelligence to understand fully what is proposed?
        note: Gillick, approved by the High Court in Marion's Case. A disability does not of itself mean the child cannot consent.
        cases:
          - gillick-v-west-norfolk-and-wisbech-area-health-authority
          - secretary-department-of-health-and-community-services-v-jwb
        branches:
          - label: 'Yes'
            to: n7
          - label: 'No: a parent consented instead'
            to: n6b
      - id: n6b
        kind: ask
        text: Is the parent consenting to therapeutic treatment in the child's interests?
        note: Parents cannot consent to non-therapeutic treatment not in the child's interests, such as sterilisation (Marion's Case); statute may also require court consent.
        cases:
          - secretary-department-of-health-and-community-services-v-jwb
        branches:
          - label: 'Yes'
            to: n8
          - label: 'No: non-therapeutic'
            to: e-court
      - id: n7
        kind: ask
        text: Has a court exercised its parens patriae jurisdiction over the minor's decision?
        note: The jurisdiction extends to any person under 18, even a competent mature minor; s 174 of the Care and Protection Act does not exclude it (X v SCHN).
        exception: true
        cases:
          - x-v-sydney-childrens-hospital-network
        authorities:
          - children-and-young-persons-care-and-protection-act-1998-nsw-s174
        branches:
          - label: 'No'
            to: n8
          - label: 'Yes'
            to: e-court
      - id: n8
        kind: ask
        text: Did the defendant's conduct stay within the scope of what was agreed to?
        note: Consent relates to the specific act. Deliberate injury in breach of a game's rules (McNamara v Duncan) or unnecessary treatment on a large scale (Dean v Phung) exceeds it.
        cases:
          - mcnamara-v-duncan
          - dean-v-phung
        branches:
          - label: 'Yes'
            to: e-valid
          - label: 'No'
            to: e-exceeded
      - id: e-valid
        kind: end
        tone: met
        text: 'Valid consent: the defence answers the claim.'
      - id: e-exceeded
        kind: end
        tone: not-met
        text: 'Conduct exceeded the consent: no defence for the excess.'
      - id: e-vitiated
        kind: end
        tone: not-met
        text: 'Consent vitiated: it was not freely given.'
      - id: e-court
        kind: end
        tone: qualified
        text: The decision rests with the court, not the consent of parent or child.
      - id: e-none
        kind: end
        tone: not-met
        text: 'No valid consent: consider necessity, self-defence or legal process.'
  - slug: self-defence
    title: Does self-defence excuse the force used?
    summary: Runs the common law test (Zecevic v DPP), then the parallel statutory test in s 52 CLA, with s 53 for unreasonable responses.
    start: s1
    concepts:
      - laws2400-w04-self-defence-common-law-and-cla
    sources:
      - Topic 4 Lecture 1 (slides 21–30)
      - Civil Liability Act 2002 (NSW) ss 3A, 52–53
    nodes:
      - id: s1
        kind: ask
        text: What was the force used to protect?
        note: Self-defence covers the defendant, third parties (family or even strangers) and property, both land and chattels, against unlawful interference.
        branches:
          - label: A person, or chattels
            to: s3
          - label: Land
            to: s2
      - id: s2
        kind: ask
        text: Was the defendant in possession, and was a request to leave made with a chance to comply?
        note: At common law, defending land is generally only available to the person in possession, after a request to leave.
        branches:
          - label: 'Yes'
            to: s3
          - label: 'No'
            to: s6
      - id: s3
        kind: ask
        text: 'Common law: was there a reasonable apprehension of physical force to the defendant or others?'
        cases:
          - zecevic-v-dpp
        branches:
          - label: 'Yes'
            to: s4
          - label: 'No'
            to: s6
      - id: s4
        kind: ask
        text: 'Common law: was the force used proportionate to the threat?'
        note: In Fontin v Katapodis, throwing glass at the face after a blow with a T-square was "out of all reasonable proportion to the emergency".
        cases:
          - zecevic-v-dpp
          - fontin-v-katapodis
        branches:
          - label: 'Yes'
            to: e-cl
          - label: 'No'
            to: s6
      - id: s6
        kind: ask
        text: 'Statute: was the conduct responded to unlawful, or would it have been but for a mental health or cognitive impairment?'
        note: Section 52(1) CLA. "Unlawful conduct" is undefined but held to include criminal and tortious conduct. The common law test has no such requirement; the regimes run in parallel.
        authorities:
          - civil-liability-act-2002-nsw-s52
        cases:
          - nsw-v-mcmaster
        branches:
          - label: 'Yes'
            to: s7
          - label: 'No'
            to: e-fail
      - id: s7
        kind: ask
        text: Did the defendant believe the conduct was necessary for a purpose in s 52(2)?
        note: To defend self or another, prevent or end unlawful deprivation of liberty, protect property from unlawful interference, or prevent or remove a criminal trespass.
        authorities:
          - civil-liability-act-2002-nsw-s52
        branches:
          - label: 'Yes'
            to: s8
          - label: 'No'
            to: e-fail
      - id: s8
        kind: ask
        text: Was the conduct a reasonable response in the circumstances as the defendant perceived them?
        cases:
          - nsw-v-mcmaster
        authorities:
          - civil-liability-act-2002-nsw-s52
        branches:
          - label: 'Yes'
            to: s9
          - label: 'No'
            to: e-s53
      - id: s9
        kind: ask
        text: Did the force intentionally or recklessly inflict death only to protect property or deal with a criminal trespass?
        note: 'Section 52(3) CLA: s 52 does not apply to such force.'
        exception: true
        authorities:
          - civil-liability-act-2002-nsw-s52
        branches:
          - label: 'No'
            to: e-s52
          - label: 'Yes'
            to: e-fail
      - id: e-cl
        kind: end
        tone: met
        text: 'Common law self-defence made out: no liability for the force.'
      - id: e-s52
        kind: end
        tone: met
