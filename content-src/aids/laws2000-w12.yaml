  - concept: laws2000-w12-core-instruments-and-sources-of-obligation
    plain: States are bound to respect human rights by treaties — nine core UN treaties and regional conventions — and by customary law, some of which, like the ban on torture, is jus cogens.
    concrete: Take the prohibition of torture. It appears in the Convention against Torture (10 December 1984) and ICCPR art 7, but the slides also list torture among customary human rights norms — and some such norms are considered jus cogens, from which no derogation is permitted. So a state that never ratified the Convention against Torture is still bound not to torture.
    formal: 'Treaty law: the nine core instruments — ICERD (1965), ICCPR and ICESCR (1966), CEDAW (1979), CAT (1984), CRC (1989), Migrant Workers (1990), Enforced Disappearance and Disabilities (2006) — and regional treaties (ECHR, ACHR). Customary law: e.g. torture, genocide, racial discrimination; some are jus cogens. A treaty is void if it conflicts with a peremptory norm (VCLT art 53).'
    terms:
      - term: core instruments
        gloss: The nine core UN human rights treaties, from ICERD (21 December 1965) to the Disabilities and Enforced Disappearance Conventions (December 2006).
      - term: customary human rights norm
        gloss: A human rights rule binding as custom, independently of treaty ratification — e.g. the prohibitions of torture, genocide and racial discrimination.
      - term: jus cogens
        gloss: A norm accepted and recognised by the international community as one from which no derogation is permitted, modifiable only by a later norm of the same character.
    misconceptions:
      - claim: The European Convention on Human Rights is one of the nine core UN instruments.
        tempting: It is a major human rights treaty.
        correction: The ECHR is listed as a regional treaty source of obligations, alongside the American Convention — not as a core UN instrument.
      - claim: Only states that ratified the Convention against Torture are bound not to torture.
        tempting: Treaties bind only their parties.
        correction: The prohibition of torture is also customary international law, binding independently of ratification — and the slides add that some such norms are considered jus cogens.
      - claim: Two states can validly agree by treaty to set aside a jus cogens norm between themselves.
        tempting: States are usually free to contract out of general rules.
        correction: No derogation from a jus cogens norm is permitted; a treaty conflicting with a peremptory norm is void (VCLT art 53).
    socratic:
      - ask: Where do states' human rights obligations come from?
        hint: Two sources on the slide.
        answer: Treaty law (the core instruments and regional conventions) and customary international law.
      - ask: Name the earliest and latest core instruments.
        hint: 1965 and 2006.
        answer: ICERD (21 December 1965); the Disabilities and Enforced Disappearance Conventions (December 2006).
      - ask: A state is not party to the relevant treaty. Is it free to act?
        hint: Check custom.
        answer: Not if the norm is customary — e.g. torture, genocide, racial discrimination. Custom binds without ratification.
      - ask: What extra force do some customary norms have?
        hint: VCLT art 53.
        answer: 'Some are jus cogens: no derogation is permitted, and a conflicting treaty is void.'
    elements:
      - name: Treaty
        test: Is the state party to a core instrument or regional treaty protecting the right?
      - name: Custom
        test: If not, is the norm also customary international law — e.g. the prohibitions of torture, genocide or racial discrimination?
      - name: Jus cogens
        test: Is it peremptory? Then no derogation is permitted and a conflicting treaty is void.
        authorities:
          - vclt-art-53
    what-if:
      - change: State P, accused of torturing detainees, never ratified the Convention against Torture or the ICCPR.
        effect: 'Still bound: the slides list torture among customary human rights norms, which bind without ratification (and some such norms are jus cogens). Non-ratification is no answer.'
      - change: Two states sign a treaty allowing each to torture the other's captured nationals.
        effect: 'The treaty is void: it conflicts with a peremptory norm (VCLT art 53), from which no derogation is permitted.'
    boundary:
      - text: The American Convention on Human Rights.
        why: A treaty source of obligations, but regional, binding only its parties — not one of the nine core UN instruments.
      - text: Racial discrimination by a state party to no treaty on it.
        why: 'Inside: the slides give racial discrimination as an example of a customary human rights norm.'
    transfer:
      - scenario: 'An exam hypothetical: State W has ratified no human rights treaty at all. Its forces carry out a genocide against a minority. W argues it owes no human rights obligations.'
        answer: 'Wrong. Obligations arise from customary law as well as treaty: the prohibition of genocide is a customary human rights norm, and some such norms are jus cogens, from which no derogation is permitted (VCLT art 53). W is bound regardless of ratification.'
    sources:
      - Week 12 - Lecture Slides - International Human Rights Law (slides 10–11)
      - 'Week 12 - Revision Slides (Topic 3: art 53 VCLT — a treaty conflicting with a peremptory norm is void)'
      - 'Week 12 - Tutorial Revision Quiz Questions (Q3: the status of a jus cogens norm)'
