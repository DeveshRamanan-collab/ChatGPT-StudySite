  - concept: laws2000-w12-international-bill-of-rights
    plain: 'The International Bill of Rights is the 1948 Universal Declaration plus the two 1966 Covenants: one on civil and political rights, the other on economic, social and cultural rights.'
    concrete: Women delegates played a key role in getting women's rights into the Universal Declaration. Hansa Mehta of India is widely credited with changing "All men are born free and equal" to "All human beings are born free and equal" in article 1 — a small edit that made it unmistakable that the Declaration speaks for everyone.
    formal: 'UDHR (10 Dec 1948) art 2: rights for everyone "without distinction of any kind" — race, colour, sex, language, religion, opinion, national or social origin, property, birth or other status. ICCPR (16 Dec 1966): life (6), torture (7), slavery (8), liberty (9), detention (10), contract debt (11), movement (12), aliens (13). ICESCR (16 Dec 1966): work (6–7), unions (8), social security (9), family (10), food and housing (11), health (12).'
    terms:
      - term: International Bill of Rights
        gloss: The UDHR (1948), the ICCPR and the ICESCR (both 16 December 1966).
      - term: UDHR art 2
        gloss: Everyone is entitled to the Declaration's rights without distinction of any kind, including on the status of the country or territory to which they belong.
      - term: ICCPR / ICESCR
        gloss: 'The two 1966 Covenants: civil and political rights; economic, social and cultural rights. The same article number means a different right in each.'
        example: 'Art 11: no imprisonment for contract debt (ICCPR); adequate food, clothing and housing (ICESCR).'
    misconceptions:
      - claim: The right to "adequate food, clothing and housing" is ICCPR art 11.
        tempting: Both Covenants have an art 11.
        correction: It is ICESCR art 11. ICCPR art 11 is the bar on imprisonment for breach of contract — the same number means a different right in each Covenant.
      - claim: The International Bill of Rights is the UN Charter, the UDHR and the ICCPR.
        tempting: The Charter is where human rights enter the UN system.
        correction: The Bill is the UDHR, the ICCPR and the ICESCR. The Charter's human rights provisions (arts 1(3), 55(c), 56) are not part of it.
      - claim: The UDHR and the Covenants were adopted together in 1966.
        tempting: They are always named together.
        correction: The UDHR dates from 10 December 1948; both Covenants from 16 December 1966.
    socratic:
      - ask: What three instruments make up the International Bill of Rights?
        hint: One declaration, two covenants.
        answer: The UDHR (1948), the ICCPR and the ICESCR (both 1966).
      - ask: Who is entitled to the UDHR's rights?
        hint: Art 2.
        answer: Everyone, without distinction of any kind — race, colour, sex, language, religion, opinion, origin, property, birth or other status — whatever their territory's status.
      - ask: Detention conditions are at issue. Which Covenant, which article?
        hint: Civil and political.
        answer: ICCPR art 10 (rights in detention), with art 9 for liberty and security.
      - ask: A family is evicted into homelessness. Which Covenant?
        hint: Economic and social.
        answer: 'ICESCR art 11: the right to adequate food, clothing and housing.'
    what-if:
      - change: A debtor is jailed simply for failing to pay a contract debt.
        effect: 'ICCPR art 11: no imprisonment for breach of contract — and art 11 is among the rights from which no derogation is permitted (art 4(2)).'
      - change: The complaint is that public hospitals deny basic care.
        effect: 'ICESCR art 12: the right to "the highest attainable standard of physical and mental health" — not an ICCPR right.'
    boundary:
      - text: ICERD (21 December 1965).
        why: A core human rights treaty, but not part of the International Bill of Rights, which is the UDHR and the two Covenants.
      - text: UN Charter arts 1(3), 55(c) and 56.
        why: Where human rights enter the UN system, but outside the Bill itself.
    transfer:
      - scenario: 'A client''s complaint has three parts: she was arbitrarily detained, then denied her trade-union membership at work, then refused entry to university.'
        answer: 'Map each to the Bill: arbitrary detention — UDHR art 9, ICCPR art 9; trade unions — ICESCR art 8; education — UDHR art 26. Name the instrument and article each time, since numbers differ between instruments.'
    sources:
      - Week 12 - Lecture Slides - International Human Rights Law (slides 7–9)
