flows:
  - slug: is-the-restriction-of-a-right-lawful
    title: Is this restriction of a human right lawful?
    summary: Separates a derogation in a public emergency (ICCPR art 4, ACHR art 27) from a limitation in normal times, then tests each against its conditions.
    start: d1
    concepts:
      - laws2000-w12-derogations-and-limitations
    sources:
      - Week 12 - Lecture Slides - International Human Rights Law (slides 19–21)
    nodes:
      - id: d1
        kind: ask
        text: Is the state derogating in a public emergency, or limiting the right in normal times?
        branches:
          - label: Derogating in an emergency
            to: d2
          - label: Limiting it in normal times
            to: l1
      - id: d2
        kind: ask
        text: Is there a public emergency threatening the life of the nation, officially proclaimed?
        note: 'ICCPR art 4(1). ACHR art 27(1): war, public danger or other emergency threatening the state''s independence or security.'
        authorities:
          - iccpr-art-4
          - achr-art-27
        branches:
          - label: 'Yes'
            to: d3
          - label: No — test it as an ordinary limitation
            to: l1
      - id: d3
        kind: ask
        text: Is the right absolute or non-derogable?
        note: 'ICCPR art 4(2): arts 6, 7, 8(1)–(2), 11, 15, 16 and 18. ACHR art 27(2): e.g. life, humane treatment, freedom from slavery, conscience and religion.'
        authorities:
          - iccpr-art-4
        branches:
          - label: 'Yes'
            to: e-nonderog
          - label: 'No'
            to: d4
      - id: d4
        kind: ask
        text: Are the measures strictly required — necessary and proportionate in nature, duration and impact?
        note: 'Aksoy v Turkey (para 78): fourteen days'' detention without judicial intervention was "exceptionally long" and not necessary.'
        cases:
          - aksoy-v-turkey
        branches:
          - label: 'Yes'
            to: d5
          - label: 'No'
            to: e-derog-fail
      - id: d5
        kind: ask
        text: Are they consistent with the state's other international obligations (especially jus cogens), non-discriminatory, and notified?
        note: No discrimination solely on race, colour, sex, language, religion or social origin (art 4(1)).
        authorities:
          - vclt-art-53
        branches:
          - label: 'Yes'
            to: e-derog-ok
          - label: 'No'
            to: e-derog-fail
      - id: l1
        kind: ask
        text: Is the restriction provided by law?
        branches:
          - label: 'Yes'
            to: l2
          - label: 'No'
            to: e-lim-fail
      - id: l2
        kind: ask
        text: Does it serve a legitimate aim described in the limitation clause — e.g. protecting the rights and freedoms of others?
        branches:
          - label: 'Yes'
            to: l3
          - label: 'No'
            to: e-lim-fail
      - id: l3
        kind: ask
        text: Is it necessary in a democratic society — responding to a public need and proportionate?
        branches:
          - label: 'Yes'
            to: e-lim-ok
          - label: 'No'
            to: e-lim-fail
      - id: e-nonderog
        kind: end
        tone: not-met
        text: 'Unlawful: no derogation is permitted from absolute or non-derogable rights, whatever the emergency.'
      - id: e-derog-fail
        kind: end
        tone: not-met
        text: 'Unlawful derogation: a requirement of art 4 is not met.'
      - id: e-derog-ok
        kind: end
        tone: met
        text: A valid derogation — for as long, and as far, as the emergency strictly requires.
      - id: e-lim-fail
        kind: end
        tone: not-met
        text: 'Unlawful restriction: a condition for limiting the right in normal times is not met.'
      - id: e-lim-ok
        kind: end
        tone: met
        text: A lawful limitation of the right.
  - slug: does-the-state-owe-this-obligation
    title: Does this state owe a human rights obligation to this person, for this harm?
    summary: Checks the source of the obligation (treaty, custom, jus cogens), its reach (territory or jurisdiction, including abroad), and whose conduct caused the harm (vertical, horizontal, or an international organisation).
    start: o1
    concepts:
      - laws2000-w12-core-instruments-and-sources-of-obligation
      - laws2000-w12-scope-and-extraterritoriality
      - laws2000-w12-rights-holders-and-duty-bearers
    sources:
      - Week 12 - Lecture Slides - International Human Rights Law (slides 10–11, 15–18)
      - 'Week 12 - Revision Slides (Topic 3: art 53 VCLT)'
    nodes:
      - id: o1
        kind: ask
        text: Is the state party to a treaty protecting the right?
        note: The nine core instruments (ICERD to the 2006 Conventions) or a regional treaty such as the ECHR or ACHR.
        branches:
          - label: 'Yes'
            to: o3
          - label: 'No'
            to: o2
      - id: o2
        kind: ask
        text: Is the norm also customary international law — e.g. the prohibitions of torture, genocide or racial discrimination?
        note: Custom binds without ratification; some customary human rights norms are considered jus cogens.
        concept: laws2000-w12-core-instruments-and-sources-of-obligation
        authorities:
          - vclt-art-53
        branches:
          - label: 'Yes'
            to: o3
          - label: 'No'
            to: e-unbound
      - id: o3
        kind: ask
        text: Was the person within the state's territory?
        note: Nationality and legal status are irrelevant (ICCPR art 2(1)).
        authorities:
          - iccpr-art-2-1
        branches:
          - label: 'Yes'
            to: o5
          - label: No — abroad
            to: o4
      - id: o4
        kind: ask
        text: Was the person subject to the state's jurisdiction abroad — e.g. in territory it occupies?
        note: Wall (para 109); DRC v Uganda (para 216). The slides cite Lopez Burgos (para 12.3) for application even sometimes without effective control.
        concept: laws2000-w12-scope-and-extraterritoriality
        cases:
          - construction-of-a-wall-advisory-opinion
          - armed-activities-on-the-territory-of-the-congo-democratic-republic-of-the-congo-v-uganda
          - sergio-euben-lopez-burgos-v-uruguay
        branches:
          - label: 'Yes'
            to: o5
          - label: 'No'
            to: e-noreach
      - id: o5
        kind: ask
        text: Whose conduct caused the harm?
        concept: laws2000-w12-rights-holders-and-duty-bearers
        branches:
          - label: The state's own agents
            to: e-vertical
          - label: A private person or group
            to: o6
          - label: An international organisation
            to: e-io
      - id: o6
        kind: ask
        text: Did the state fail to protect — e.g. a lack of vigilance, or no domestic protection against the private actor?
        note: 'GC 31 para 8: obligations are fully discharged only if individuals are protected against private persons or entities too. DRC v Uganda (para 179): lack of vigilance over rebels.'
        authorities:
          - hrc-general-comment-31-para-8
        cases:
          - armed-activities-on-the-territory-of-the-congo-democratic-republic-of-the-congo-v-uganda
        branches:
          - label: 'Yes'
            to: e-horizontal
          - label: No — it protected adequately
            to: e-protected
      - id: e-unbound
        kind: end
        tone: not-met
        text: 'No obligation established: the state is not party to the treaty and the norm is not shown to be customary.'
      - id: e-noreach
        kind: end
        tone: not-met
        text: 'Outside the obligation''s reach: the person was neither in the state''s territory nor subject to its jurisdiction.'
      - id: e-vertical
        kind: end
        tone: met
        text: 'Vertical obligation engaged: the state answers for its own agents'' violations.'
      - id: e-horizontal
        kind: end
        tone: met
        text: 'Horizontal obligation breached: the state failed to protect the person from the private actor.'
      - id: e-protected
        kind: end
        tone: not-met
        text: 'No breach by the state: the private actor does not breach the treaty itself — the Covenant is not a substitute for domestic criminal or civil law.'
      - id: e-io
        kind: end
        tone: qualified
        exception: true
        text: 'The organisation may be the duty bearer: international organisations are bound by general international law, their constitutions and their agreements (WHO–Egypt, para 37).'
        cases:
          - interpretation-of-the-agreement-of-25-march-1951-between-the-who-and-egypt
