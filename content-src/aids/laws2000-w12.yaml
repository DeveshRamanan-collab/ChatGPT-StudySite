  - concept: laws2000-w12-scope-and-extraterritoriality
    plain: A state owes human rights to everyone in its territory or under its jurisdiction, whatever their nationality or legal status — and that can include people abroad, as in territory it occupies.
    concrete: Uganda occupied Ituri, in the Democratic Republic of the Congo. The ICJ held Uganda responsible both for its soldiers' violations and for its lack of vigilance in preventing violations by other actors there, including rebel groups acting on their own account (para 179). Human rights instruments applied "in respect of acts done by a State in the exercise of its jurisdiction outside its own territory", particularly in occupied territories (para 216).
    formal: States must respect the rights of people within their territory and subject to their jurisdiction (ICCPR art 2(1)), irrespective of nationality or legal status. Jurisdiction is "primarily territorial" but may be exercised abroad, and the drafters "did not intend to allow States to escape from their obligations" there (Wall, para 109; DRC v Uganda, para 216). The slides cite Lopez Burgos (para 12.3) for application even sometimes without effective control.
    terms:
      - term: jurisdiction (art 2(1))
        gloss: 'The link that triggers ICCPR duties: people within the state''s territory and those subject to its jurisdiction.'
      - term: extraterritoriality
        gloss: Human rights obligations applying to a state's conduct outside its own territory when it exercises jurisdiction there.
      - term: occupying Power
        gloss: A state occupying foreign territory; it exercises jurisdiction there, and human rights instruments apply to its acts (DRC v Uganda).
    misconceptions:
      - claim: Human rights treaty obligations stop at the state's border.
        tempting: Jurisdiction is usually territorial.
        correction: 'Jurisdiction is "primarily", not exclusively, territorial: the ICCPR binds states exercising jurisdiction abroad (Wall, para 109), particularly in occupied territories (DRC v Uganda, para 216).'
      - claim: A state owes ICCPR rights only to its own nationals, or to those lawfully present.
        tempting: Some political rights are tied to citizenship.
        correction: Under art 2(1) the test is territory or jurisdiction, irrespective of nationality or legal status.
      - claim: Uganda was responsible for the rebels' violations because the rebels were its de facto organs.
        tempting: Attribution was Week 7's route to responsibility for non-state actors.
        correction: The Court found Uganda responsible for its own lack of vigilance as occupying Power in preventing violations by others, including rebels acting on their own account (para 179).
    socratic:
      - ask: Whose rights must a state respect under ICCPR art 2(1)?
        hint: Territory and…
        answer: Everyone within its territory and those subject to its jurisdiction, irrespective of nationality or legal status.
      - ask: Can jurisdiction exist outside the territory?
        hint: Wall, para 109.
        answer: 'Yes: jurisdiction is primarily territorial but may be exercised abroad, and the Covenant''s drafters did not intend states to escape their obligations there.'
      - ask: What is the clearest example of jurisdiction abroad?
        hint: Ituri.
        answer: 'Occupation: in DRC v Uganda, human rights instruments applied to Uganda''s acts as occupying Power (para 216).'
      - ask: Uganda's soldiers did not commit some of the abuses — rebels did. Why was Uganda still responsible?
        hint: Para 179.
        answer: For its own lack of vigilance in preventing violations by other actors in the territory it occupied.
      - ask: Must the state have effective control?
        hint: Lopez Burgos, para 12.3.
        answer: 'Not always: the slides cite Lopez Burgos for obligations applying even sometimes without effective control — an argument to make carefully.'
    elements:
      - name: Territory or jurisdiction
        test: Was the person within the state's territory or subject to its jurisdiction?
        authorities:
          - iccpr-art-2-1
      - name: Status irrelevant
        test: Protection applies irrespective of nationality or legal status.
        authorities:
          - iccpr-art-2-1
      - name: Jurisdiction abroad
        test: Outside its territory, does the state exercise jurisdiction — especially as an occupying Power?
        cases:
          - construction-of-a-wall-advisory-opinion
          - armed-activities-on-the-territory-of-the-congo-democratic-republic-of-the-congo-v-uganda
      - name: Own acts and lack of vigilance
        test: Responsibility covers the state's agents' violations and any lack of vigilance in preventing violations by others in territory it controls.
        cases:
          - armed-activities-on-the-territory-of-the-congo-democratic-republic-of-the-congo-v-uganda
    what-if:
      - change: The victim is an undocumented foreign national inside the state.
        effect: 'Covered: art 2(1) protects people within the territory irrespective of nationality or legal status.'
      - change: The abuse happens in foreign territory the state occupies.
        effect: 'Covered: human rights instruments apply to acts done in the exercise of jurisdiction outside the territory, particularly in occupied territories (DRC v Uganda, para 216; Wall, para 109).'
      - change: The state's agents act abroad where it lacks effective control of the area.
        effect: 'Arguable: the slides cite Lopez Burgos (para 12.3) for obligations applying even sometimes without effective control — make the argument, but acknowledge it is the harder case.'
    boundary:
      - text: Lopez Burgos v Uruguay (para 12.3).
        why: 'The edge of the doctrine: cited for obligations applying "even sometimes" without effective control.'
      - text: A person abroad with no link at all to the state.
        why: 'Outside: not within its territory or subject to its jurisdiction, so art 2(1) is not engaged.'
    transfer:
      - scenario: State F's navy intercepts a migrant boat on the high seas, takes the passengers aboard and holds them below deck for weeks without access to anyone.
        answer: Argue F owed them ICCPR rights. Art 2(1) turns on territory or jurisdiction, not nationality or status; jurisdiction may be exercised outside the territory and the drafters did not intend states to escape their obligations there (Wall, para 109; DRC v Uganda, para 216). Holding people aboard is an exercise of jurisdiction.
