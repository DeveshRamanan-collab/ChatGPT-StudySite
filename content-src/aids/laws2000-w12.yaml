  - concept: laws2000-w12-derogations-and-limitations
    plain: In a genuine national emergency a state may suspend some rights, but only as far as strictly needed, and some rights never. In normal times, any limit must be lawful, legitimate and necessary.
    concrete: In Aksoy v Turkey, the European Court of Human Rights accepted that investigating terrorist offences presents special problems, but could not accept that it was necessary to hold a suspect for fourteen days without judicial intervention. The period was "exceptionally long", leaving him vulnerable to arbitrary interference with liberty and to torture, and Turkey gave no detailed reasons why judicial intervention was impracticable (para 78).
    formal: 'ICCPR art 4(1): in an officially proclaimed "public emergency which threatens the life of the nation", a state may derogate "to the extent strictly required by the exigencies of the situation", consistently with other obligations, without listed discrimination. Art 4(2): none from arts 6, 7, 8(1)–(2), 11, 15, 16, 18. ACHR art 27 is similar. Otherwise restrictions need law, a legitimate aim and necessity in a democratic society.'
    analogy:
      text: In a declared bushfire emergency a council may close roads and override normal rules — but only while the fire lasts, only as far as needed, announced publicly, and never by blocking the evacuation routes.
      maps:
        - from: the declared bushfire emergency
          to: an officially proclaimed public emergency threatening the life of the nation
        - from: only while and as far as needed
          to: '"to the extent strictly required by the exigencies of the situation"'
        - from: never blocking evacuation routes
          to: non-derogable rights (ICCPR art 4(2))
        - from: announcing the closures
          to: the notification requirement
      limits:
        - A council answers to local law; a derogation is tested against international obligations too — consistency with jus cogens and no discrimination on listed grounds.
    terms:
      - term: derogation
        gloss: Temporarily suspending treaty obligations in a public emergency threatening the life of the nation, to the extent strictly required (ICCPR art 4(1)).
      - term: non-derogable rights
        gloss: Rights that cannot be suspended even in emergency — ICCPR arts 6, 7, 8(1)–(2), 11, 15, 16 and 18; ACHR art 27(2) lists its own.
      - term: limitation
        gloss: 'A restriction in normal times: provided by law, serving a legitimate aim in the limitation clause, and necessary in a democratic society.'
      - term: notification
        gloss: One of the four substantive requirements for a valid derogation.
    misconceptions:
      - claim: A state may derogate whenever its government considers national security requires it.
        tempting: Security is the usual reason given.
        correction: Art 4(1) needs a public emergency threatening the life of the nation, officially proclaimed, and measures strictly required by the situation.
      - claim: The right to liberty (ICCPR art 9) can never be suspended.
        tempting: Liberty feels as fundamental as life.
        correction: Art 9 is not in art 4(2), so it is derogable — but only to the extent strictly required, as Aksoy shows for fourteen-day detention without a judge.
      - claim: Outside an emergency, a state may restrict a limited right whenever convenient.
        tempting: Many rights are not absolute.
        correction: The restriction must be provided by law, serve a legitimate aim in the limitation clause, and be necessary in a democratic society — a public need, proportionate.
    socratic:
      - ask: A government suspends rights after riots. What must you decide first?
        hint: Emergency or normal times?
        answer: Whether it is derogating in an emergency (art 4) or limiting a right in normal times — different tests apply.
      - ask: What emergency qualifies under ICCPR art 4(1)?
        hint: Life of the nation.
        answer: A public emergency which threatens the life of the nation and whose existence is officially proclaimed.
      - ask: Which rights are off-limits even then?
        hint: Art 4(2).
        answer: Arts 6, 7, 8(1)–(2), 11, 15, 16 and 18 — e.g. life, freedom from torture and slavery.
      - ask: How far may the measures go?
        hint: Aksoy.
        answer: Only as strictly required — necessary and proportionate in nature, duration and impact; Aksoy's fourteen days without a judge failed.
      - ask: What else must a valid derogation satisfy?
        hint: Four requirements.
        answer: Consistency with other international obligations, especially jus cogens; no effect on absolute or non-derogable rights; no discrimination solely on listed grounds; notification.
    elements:
      - name: Qualifying emergency
        test: 'A public emergency threatening the life of the nation, officially proclaimed (ICCPR art 4(1)); ACHR: war, public danger or emergency threatening independence or security.'
        authorities:
          - iccpr-art-4
          - achr-art-27
      - name: Necessity and proportionality
        test: Measures strictly required by the exigencies — in nature, duration and impact.
        cases:
          - aksoy-v-turkey
      - name: Consistent with other obligations
        test: Not inconsistent with other international obligations, especially jus cogens; no discrimination solely on race, colour, sex, language, religion or social origin.
        authorities:
          - vclt-art-53
      - name: No non-derogable rights
        test: No derogation from absolute or non-derogable rights (ICCPR art 4(2)).
        authorities:
          - iccpr-art-4
      - name: Notification
        test: The derogation must be notified.
    what-if:
      - change: During a proclaimed emergency, interrogators use torture to stop an imminent attack.
        effect: 'Still unlawful: art 7 (prohibition on torture) is non-derogable under art 4(2), so no emergency justifies it; derogations must also respect jus cogens.'
      - change: Emergency measures detain only members of one religion.
        effect: 'Fails art 4(1): measures may not involve discrimination solely on the ground of religion, among other grounds.'
      - change: There is no emergency; the state bans a protest under a statute to protect others' rights.
        effect: 'Test it as a limitation: provided by law, a legitimate aim in the limitation clause, and necessary in a democratic society — responding to a public need and proportionate.'
    boundary:
      - text: ICCPR art 11 (no imprisonment for contract debt).
        why: Non-derogable under art 4(2), though it may look minor beside liberty (art 9), which is derogable.
      - text: Fourteen days' detention without judicial intervention (Aksoy).
        why: 'Derogable right, but the measure was not strictly required: "exceptionally long", with no detailed reasons given.'
    transfer:
      - scenario: After a cyber-attack cripples hospitals, State E proclaims an emergency and notifies it. It suspends freedom of movement nationwide for two years, and bans criticism of the government online.
        answer: Movement (ICCPR art 12) is derogable, but a nationwide two-year suspension must be strictly required — necessary and proportionate in nature, duration and impact (Aksoy). The online ban must also meet that test and be consistent with E's other obligations; overbroad or open-ended measures fail.
    sources:
      - Week 12 - Lecture Slides - International Human Rights Law (slides 19–21)
