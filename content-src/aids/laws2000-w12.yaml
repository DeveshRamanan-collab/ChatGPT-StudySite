  - concept: laws2000-w12-generations-and-principles-of-rights
    plain: Rights are grouped into civil and political, economic, social and cultural, and collective "generations" — but all apply to everyone, have equal standing, and depend on one another.
    concrete: 'The slides'' example of indivisibility: a state cannot advance everyone''s right to an adequate standard of living by sacrificing the right to health or the right to education. Denying one right invariably impedes the enjoyment of others, and benefiting from one right may depend on others being fulfilled — which is why the three generations are categories, not a ranking.'
    formal: 'First generation: civil and political rights (life, freedom from torture, expression, fair trial, political participation). Second: economic, social and cultural rights (education, health, adequate standard of living, work, cultural rights). Third: collective rights (self-determination; potentially development and a healthy environment). Universality: rights apply to all humans everywhere. Indivisibility and interdependence: all rights have equal status and cannot be ranked.'
    terms:
      - term: first generation
        gloss: Civil and political rights — e.g. life, freedom from torture, freedom of expression, fair trial, political participation.
      - term: second generation
        gloss: Economic, social and cultural rights — e.g. education, health, an adequate standard of living, work, cultural rights.
      - term: third generation
        gloss: Collective rights — self-determination; potentially the rights to development and a healthy environment.
      - term: indivisibility and interdependence
        gloss: All rights are interconnected and equally important; they cannot be placed in a hierarchy, and denying one impedes others.
    misconceptions:
      - claim: Under indivisibility, civil and political rights rank above economic, social and cultural rights.
        tempting: They are called the "first" generation.
        correction: Indivisibility means all rights have equal status and cannot be positioned in a hierarchical order; "generations" are categories, not ranks.
      - claim: '"Rights must be understood in context" is a universalist argument.'
        tempting: It sounds like a sensible general principle.
        correction: It is a cultural relativist argument. Universalists say basic rights like life and freedom from torture cannot depend on culture, and that culture changes and evolves.
      - claim: Cultural rights are third-generation rights because culture belongs to communities.
        tempting: Culture is shared within groups.
        correction: The slides list cultural rights in the second generation, with economic and social rights; the third generation is collective rights such as self-determination.
    socratic:
      - ask: Where does freedom of expression sit among the generations?
        hint: Civil and political.
        answer: First generation — civil and political rights.
      - ask: And the right to health?
        hint: Economic and social.
        answer: Second generation — economic, social and cultural rights.
      - ask: Which right is the firm third-generation example, and which are only potential?
        hint: Collective rights.
        answer: Self-determination; the rights to development and to a healthy environment are only potentially third-generation.
      - ask: Does "first" generation mean more important?
        hint: Indivisibility.
        answer: No. All rights have equal status and cannot be ranked; denying one impedes enjoyment of others.
      - ask: What does universality claim, and who challenges it?
        hint: Relativists.
        answer: That rights apply to all humans everywhere. Cultural relativists say values differ and universal rights are cultural imperialism; universalists reply that basic rights cannot depend on culture.
    what-if:
      - change: A government proposes ending free schooling to fund housing for the poor.
        effect: 'Indivisibility tells against it: the right to an adequate standard of living cannot be pursued at the expense of the right to education; rights are interdependent and equal in status.'
      - change: A state defends a practice harming women as its cultural tradition.
        effect: 'The universalist reply: basic rights cannot depend on culture, relativism often masks oppression of women and minorities, and culture is not static.'
    boundary:
      - text: The right to a healthy environment.
        why: 'Only potentially third generation: the slides give it, with development, as a possible collective right.'
      - text: Political participation rights.
        why: 'First generation, not collective: though exercised with others, they are listed among civil and political rights.'
    transfer:
      - scenario: 'A minister says: "We guarantee free speech and fair trials; food and housing are aspirations, not rights."'
        answer: 'This ranks first-generation rights above second-generation ones, which indivisibility rejects: all human rights have equal status, cannot be ranked, and denying one (an adequate standard of living) impedes others. The right to "adequate food, clothing and housing" is itself in ICESCR art 11.'
    objections:
      - position: 'Universality: human rights apply to all humans everywhere.'
        evidence: Basic rights like life and freedom from torture cannot depend on culture.
        objection: 'Cultural relativists: societies have different values and conceptions of rights; Western individualism doesn''t reflect all worldviews, so universal rights are cultural imperialism and must be understood in context.'
        reply: 'Universalists: cultural relativism often masks oppression, particularly of women and minorities, and culture isn''t static — it changes and evolves.'
    sources:
      - Week 12 - Lecture Slides - International Human Rights Law (slides 12–14)
    verify: false
  - concept: laws2000-w12-rights-holders-and-duty-bearers
    plain: Individuals and groups hold human rights; states mainly owe them — both by not violating rights themselves and by protecting people from private abusers. International organisations can owe duties too.
    concrete: The slides' example of a horizontal obligation is non-discrimination in housing. If private landlords refuse to rent to people of a particular race, the landlords do not breach the ICCPR — the Covenant "cannot be viewed as a substitute for domestic criminal or civil law". But the state's duty to ensure rights is fully discharged only if it protects people against private persons too; failing to do so is the state's own breach.
    formal: 'Right bearers: individuals and groups. Duty bearers: primarily states — vertical duties to individuals under their jurisdiction; horizontal duties to protect them from private actors. GC 31 para 8: positive obligations are "only ... fully discharged if individuals are protected by the State, not just against violations ... by its agents, but also against acts committed by private persons or entities". International organisations are bound too (WHO–Egypt, para 37).'
    analogy:
      text: 'A lifeguard owes swimmers two duties: never to push anyone under, and to pull out anyone another swimmer is dragging under.'
      maps:
        - from: the swimmers
          to: 'right bearers: individuals and groups'
        - from: the lifeguard
          to: the state, the primary duty bearer
        - from: never pushing anyone under
          to: 'vertical obligation: the state''s own agents must not violate rights'
        - from: rescuing from other swimmers
          to: 'horizontal obligation: protecting individuals from private actors (GC 31 para 8)'
      limits:
        - 'The state does not answer for every private harm as such: the question is whether it failed to protect — e.g. a lack of vigilance — not merely whether harm occurred.'
    terms:
      - term: right bearers
        gloss: 'Those who hold human rights: the individual, and groups for collective rights.'
      - term: duty bearers
        gloss: 'Those who owe human rights obligations: primarily states; international organisations too (e.g. in peacekeeping).'
      - term: vertical obligation
        gloss: The state's duties toward individuals under its jurisdiction — e.g. its own agents must not torture.
      - term: horizontal obligation
        gloss: The state's duty to protect individuals from violations by other private actors — e.g. torture, non-discrimination in housing.
    misconceptions:
      - claim: A horizontal obligation is a duty one state owes another state.
        tempting: '"Horizontal" suggests a relationship between equals.'
        correction: On the slides, a horizontal obligation is the state's duty to protect individuals from violations by other private actors, e.g. torture or discrimination in housing.
      - claim: Private persons owe duties directly under the ICCPR, so victims sue them under the Covenant.
        tempting: Private actors cause the harm.
        correction: 'GC 31 para 8: the Covenant "cannot be viewed as a substitute for domestic criminal or civil law". The duty bearer is the state, which must protect individuals against private persons.'
      - claim: A state discharges its Covenant duties as long as its own agents respect rights.
        tempting: The ICCPR is addressed to states.
        correction: 'GC 31 para 8: positive obligations are fully discharged only if individuals are protected against the state''s agents and against private persons or entities.'
    socratic:
      - ask: Who holds human rights?
        hint: Individuals — and?
        answer: The individual, and groups for collective rights such as self-determination.
      - ask: Who owes them?
        hint: Primarily…
        answer: States, primarily; international organisations can also be duty bearers, e.g. in peacekeeping.
      - ask: Police torture a detainee. Which kind of obligation is breached?
        hint: State agent to individual.
        answer: 'A vertical obligation: the state''s own duty toward individuals under its jurisdiction.'
      - ask: A private gang tortures people and the state does nothing. Has the state breached anything?
        hint: GC 31 para 8.
        answer: 'Yes, potentially: its horizontal obligation to protect individuals against private persons — its positive obligations are not fully discharged.'
      - ask: Are UN bodies bound by international obligations?
        hint: WHO–Egypt, para 37.
        answer: 'Yes: international organisations are subjects of international law, bound by obligations under general international law, their constitutions and their agreements.'
    elements:
      - name: Who holds the right?
        test: The individual, or a group for collective rights.
      - name: Who bears the duty?
        test: Primarily the state; an international organisation may also be bound under general international law, its constitution or its agreements.
        cases:
          - interpretation-of-the-agreement-of-25-march-1951-between-the-who-and-egypt
      - name: 'Vertical: the state''s own conduct'
        test: Did the state's agents violate the right of an individual under its jurisdiction?
      - name: 'Horizontal: protection from private actors'
        test: Did the state fail to protect individuals against acts of private persons or entities?
        authorities:
          - hrc-general-comment-31-para-8
    what-if:
      - change: The torture is carried out by a private militia the state tolerates, not by police.
        effect: 'No vertical breach by state agents, but the state''s horizontal obligation is engaged: it must protect individuals against private persons too (GC 31 para 8).'
      - change: The harm is caused by soldiers serving in a UN peacekeeping operation.
        effect: 'International organisations can be duty bearers: as subjects of international law they are bound by general international law, their constitutions and their agreements (WHO–Egypt, para 37).'
    boundary:
      - text: A private company's discriminatory hiring.
        why: The company is not the treaty's duty bearer, but the state's horizontal duty to protect against private discrimination is engaged.
      - text: UN peacekeepers' conduct.
        why: 'Inside the duty-bearer category: the slides give peacekeeping as an example of international organisations bearing duties.'
    transfer:
      - scenario: 'Exam hypothetical: in State H, private security guards at a mine beat protesters. H''s courts refuse to hear the victims'' claims and police do not investigate. The victims say "the mining company breached the ICCPR".'
        answer: 'Reframe it: the company is not the Covenant''s duty bearer. H breached its horizontal obligation — positive obligations are fully discharged only if individuals are protected against private persons or entities (GC 31 para 8) — by failing to investigate or provide domestic remedies.'
    sources:
      - Week 12 - Lecture Slides - International Human Rights Law (slides 15–16)
