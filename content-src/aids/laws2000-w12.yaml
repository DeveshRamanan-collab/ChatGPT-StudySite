  - concept: laws2000-w12-international-human-rights-machinery
    plain: 'Human rights are monitored rather than enforced like court orders: the UN Human Rights Council reviews every state and appoints independent experts, and treaty committees examine reports and complaints.'
    concrete: Under the Universal Periodic Review, every UN member state is reviewed every 4.5 years. The state — and NGOs — submit reports; a working group of 47 members reviews them and issues an "Outcome Report" with recommendations to the state under review. The state then accepts or merely notes each recommendation. Nothing in the process makes the recommendations binding.
    formal: 'Charter-based: the Human Rights Council replaced the Commission on Human Rights in 2006 (UNGA res 60/251): 47 states elected by the General Assembly for three-year terms (maximum two consecutive), working through sessions, the Universal Periodic Review and special procedures. Treaty-based: committees for each core treaty — state reporting, individual complaints ("views"), inter-state complaints, general comments. Outputs are not binding but carry significant weight (Diallo, para 66).'
    analogy:
      text: 'A school inspection rather than a court case: peers review each school on a cycle and make recommendations; expert examiners assess complaints; but nobody issues a binding sentence.'
      maps:
        - from: the inspection cycle by peers
          to: the Universal Periodic Review, every 4.5 years
        - from: recommendations the school accepts or notes
          to: UPR outcome reports
        - from: expert examiners' assessments
          to: treaty bodies' views, carrying significant weight
      limits:
        - Treaty bodies decide individual complaints in written, judicial-style proceedings, and the ICJ gives their interpretations "great weight" (Diallo) — more than a school report.
    terms:
      - term: Universal Periodic Review
        gloss: Peer review of every UN member state every 4.5 years by a 47-member working group; the state accepts or notes the recommendations.
      - term: special procedures
        gloss: Independent experts — special rapporteurs, independent experts, working groups — with thematic and country mandates; they visit (with consent), receive complaints and report.
      - term: treaty body
        gloss: The committee supervising a core treaty, e.g. the Human Rights Committee for the ICCPR.
      - term: general comment
        gloss: A treaty body's interpretation of treaty provisions, considered authoritative — e.g. General Comment No 31.
    misconceptions:
      - claim: The Human Rights Council and the Human Rights Committee are the same body.
        tempting: The names are almost identical.
        correction: The Council is a Charter-based body of 47 states (UNGA res 60/251). The Committee is the ICCPR's treaty body of independent experts, issuing views and general comments.
      - claim: Treaty body decisions bind states like ICJ judgments.
        tempting: Individual complaints are decided in a judicial style.
        correction: They are not binding but carry significant weight. In Diallo (para 66) the ICJ was "in no way obliged" to follow the Committee but ascribed "great weight" to its interpretation.
      - claim: UPR recommendations bind the state under review.
        tempting: They come out of a formal review.
        correction: The state under review accepts or notes the recommendations; the UPR is peer review, not adjudication.
    socratic:
      - ask: Which UN body reviews every state's human rights record?
        hint: Charter-based.
        answer: The Human Rights Council, through the Universal Periodic Review, every 4.5 years.
      - ask: Who sits on the Council?
        hint: UNGA res 60/251.
        answer: 47 states elected by the General Assembly for three-year terms, maximum two consecutive, with regional distribution.
      - ask: Who investigates particular themes or countries?
        hint: Independent experts.
        answer: 'The special procedures: special rapporteurs, independent experts and working groups, with thematic and country mandates.'
      - ask: What do treaty bodies do?
        hint: Four methods.
        answer: Consider state reports (concluding observations), decide individual complaints (views), hear inter-state complaints (extremely rare) and issue authoritative general comments.
      - ask: Does an ICCPR committee view bind the state?
        hint: Diallo.
        answer: 'No, but it carries significant weight: the ICJ gives "great weight" to the Committee''s interpretation.'
    what-if:
      - change: An individual's complaint to the Human Rights Committee succeeds, and the state ignores the views.
        effect: The views are not binding, so ignoring them is not itself a breach of a binding order; but they carry significant weight as interpretation, as the ICJ recognised in Diallo.
      - change: A special rapporteur wants to visit a country to investigate.
        effect: Country visits need the state's consent; without it, the rapporteur can still receive individual complaints and issue reports.
    boundary:
      - text: Inter-state complaints under the treaties.
        why: 'Available but extremely rare: only three ever, all under ICERD — the only treaty not requiring reciprocal declarations.'
      - text: General comments.
        why: Not binding judgments, but considered authoritative interpretations of the treaty.
    transfer:
      - scenario: 'A student essay: "The UN human rights system is toothless because none of its outputs bind." Respond.'
        answer: 'Partly true: UPR recommendations are accepted or noted, and treaty body views and general comments are not binding. But they carry significant weight — the ICJ ascribed "great weight" to the Human Rights Committee''s interpretation in Diallo (para 66) — and periodic review and expert reporting keep every state under scrutiny.'
    sources:
      - Week 12 - Lecture Slides - International Human Rights Law (slides 23–29)
