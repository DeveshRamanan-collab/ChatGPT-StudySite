aids:
  - concept: laws2000-w12-history-and-foundations-of-human-rights
    plain: Human rights grew from national charters and Enlightenment ideas of freedom and dignity, then narrow early treaties, and became a general international concern only with the UN Charter after World War II.
    concrete: The first international steps were narrow. Britain abolished slavery in 1807, other European countries followed, and the 1926 Slavery Convention carried the issue onto the international plane; the other early concern was limited women's rights — trafficking in women for prostitution. Only after the Second World War and the Nazi regime did the UN Charter make respect for human rights a general purpose of the international community.
    formal: 'Early domestic instruments: Magna Carta (1215), English Bill of Rights (1689), French Declaration of the Rights of Man (1789), US Constitution and Bill of Rights (1789, 1791). UN Charter: promoting respect for human rights "for all without distinction as to race, sex, language, or religion" is a Purpose (art 1(3)); the UN shall promote their universal respect and observance (art 55(c)); members pledge joint and separate action (art 56).'
    terms:
      - term: issue-specific protection
        gloss: The 19th and early 20th century phase of international protection, limited to particular issues such as slavery and trafficking in women.
      - term: natural rights (Locke)
        gloss: Rights such as life, liberty and property that have a foundation independent of the laws of any particular society; people are by nature free and equal.
      - term: dignity (Kant)
        gloss: Every person has inherent value and must be treated "as an end" and "never merely as a means".
    misconceptions:
      - claim: The UN Charter says nothing about human rights; they first appear in the UDHR.
        tempting: The Charter is mostly remembered for peace and security.
        correction: Promoting respect for human rights is a Purpose of the UN (art 1(3)); the UN shall promote them (art 55(c)); and members pledge joint and separate action (art 56).
      - claim: Kant argued that people are by nature free and equal, not subject to a monarch.
        tempting: Both are Enlightenment philosophers of rights.
        correction: 'That is Locke, in the Two Treatises of Government (1689). Kant''s Groundwork (1785) is the dignity argument: persons must be treated as ends, never merely as means.'
      - claim: International human rights protection began with a general treaty covering all rights.
        tempting: Today's system has broad treaties such as the ICCPR.
        correction: 'The beginning was issue-specific: abolition of slavery (Britain 1807; the 1926 Slavery Convention) and limited women''s rights. General protection came with the UN Charter after WWII.'
    socratic:
      - ask: Where did rights language first appear?
        hint: National documents, 1215–1791.
        answer: 'In domestic instruments: Magna Carta, the English Bill of Rights, the French Declaration of the Rights of Man and the US Constitution and Bill of Rights.'
      - ask: What did the Enlightenment add?
        hint: Locke and Kant.
        answer: 'A foundation: Locke''s rights to life, liberty and property independent of any society''s laws; Kant''s inherent dignity — treat people as ends, never merely as means.'
      - ask: How did international protection begin?
        hint: Narrowly.
        answer: 'Issue by issue: the abolition of slavery (1807 to the 1926 Slavery Convention) and limited women''s rights against trafficking.'
      - ask: What turned human rights into a general international concern?
        hint: '1945.'
        answer: 'After WWII and the Nazi regime, the UN Charter: arts 1(3), 55(c) and 56.'
    what-if:
      - change: A state argues that how it treats its own people is none of the UN's business, since the Charter is about peace.
        effect: The Charter itself makes promoting respect for human rights a Purpose (art 1(3)), commits the UN to promote them (art 55(c)) and has members pledge joint and separate action (art 56).
    boundary:
      - text: Magna Carta (1215).
        why: 'A forerunner, not international law: an early domestic instrument in the pre-history of rights.'
      - text: The 1926 Slavery Convention.
        why: 'International, but issue-specific: it belongs to the early phase, before the Charter made human rights a general concern.'
    transfer:
      - scenario: 'An essay question: "Human rights are a post-1945 invention." Agree or disagree?'
        answer: Partly. As international law of general scope, they begin with the Charter (arts 1(3), 55(c), 56) after WWII. But they rest on earlier domestic instruments (Magna Carta to the US Bill of Rights), Enlightenment foundations (Locke, Kant) and issue-specific international protection such as the abolition of slavery.
    storyboard:
      - caption: '1215–1791: national charters'
        detail: Magna Carta, English Bill of Rights, French Declaration, US Constitution and Bill of Rights.
      - caption: Enlightenment foundations
        detail: 'Locke (1689): free and equal, rights independent of any society''s laws. Kant (1785): inherent dignity.'
      - caption: '1807–1926: issue by issue'
        detail: Abolition of slavery, from Britain to the Slavery Convention; limited women's rights against trafficking.
      - caption: WWII and the Nazi regime
        detail: The catastrophe that precedes the UN's general commitment to human rights.
      - caption: '1945: the Charter commits'
        detail: Arts 1(3), 55(c) and 56 make human rights a general international concern.
      - caption: '1948: the Universal Declaration'
        detail: The UDHR opens the International Bill of Rights.
    sources:
      - Week 12 - Lecture Slides - International Human Rights Law (slides 3–6)
