  - key: q100
    type: short
    concept: public-nuisance
    difficulty: 3
    prompt: A local council contractor closes the only road into a small hamlet for eight months to rebuild a bridge, with no detour sign or alternative access provided. Priya, who runs a home-based catering business in the hamlet, loses several clients who can no longer reach her, causing substantial loss of income; other residents are merely inconvenienced by having to take a much longer route to the highway. Advise Priya on a possible public nuisance claim.
    model: "Priya may have a tort claim in public nuisance. The closure of the only road, without a detour, is an unlawful obstruction of a right common to all road users, satisfying the \"interference with a public right\" element, and an eight-month closure with no alternative access is plainly substantial and unreasonable, not a merely temporary inconvenience. The harder question is title to sue: Priya must show special or particular damage, dissimilar to that suffered by the public generally. Following Walsh v Ervin, special damage is not limited to pecuniary loss, but Priya’s position is arguably stronger than the ordinary resident’s: her loss of specific clients and income, caused directly by the closure, is a concrete, individual harm distinct from the general inconvenience of a longer commute experienced by other residents. This is comparable to, indeed stronger than, the substantial delay and inconvenience accepted in Walsh v Ervin. Priya should be able to establish title to sue and maintain a public nuisance action against those responsible for the closure."
    rubric:
      - id: r1
        criterion: Identifies public nuisance (not private nuisance or trespass) as the correct action
        marks: 1
        top-band: Explains why this is public, not private, nuisance (a right common to all road users).
        margin-note: Correct tort identified and justified.
        authorities: []
      - id: r2
        criterion: Applies "interference with a public right" to the road closure
        marks: 1
        top-band: Explains the closure affects all road users, not just Priya.
        margin-note: Element applied to facts.
        authorities: []
      - id: r3
        criterion: Applies "substantial and unreasonable" to the 8-month closure without detour
        marks: 1
        top-band: Contrasts the 8-month closure with a merely temporary obstruction.
        margin-note: Good use of contrast with insufficient cases.
        authorities: []
      - id: r4
        criterion: Applies title to sue/special damage using Walsh v Ervin, distinguishing Priya’s loss from the general public’s inconvenience
        marks: 2
        top-band: Explicitly compares Priya’s lost clients/income with the mere delay in Walsh v Ervin and with other residents’ longer commute.
        margin-note: Strongest part of the answer — clear analogy and distinction.
        authorities: []
  - key: q101
    type: mcq
    concept: private-nuisance-elements
    difficulty: 1
    stem: "Private nuisance is best described as:"
    options:
      - text: An action on the case protecting an occupier’s use and enjoyment of land from both tangible and intangible interferences
        correct: true
        why: Correct — this matches the lecture’s description of private nuisance as protecting use and enjoyment of land.
      - text: A tort requiring direct physical entry onto the plaintiff’s land
        correct: false
        why: That describes trespass to land, which requires direct physical entry, not private nuisance.
      - text: A crime with an optional civil claim
        correct: false
        why: That describes public nuisance, not private nuisance, which is a tort only.
      - text: A strict liability tort requiring no fault of any kind by anyone
        correct: false
        why: Overstated — strict liability applies specifically to the creator of a nuisance, not as a general description of the whole tort.
    set: pretest
  - key: q102
    type: mcq
    concept: private-nuisance-elements
    difficulty: 1
    stem: "The three elements of private nuisance are:"
    options:
      - text: Title to sue, substantial and unreasonable interference, and the defendant having created, authorised or continued the harmful state of affairs
        correct: true
        why: Correct — these are the three elements listed in the lecture.
      - text: Direct act, intention or negligence, and possession
        correct: false
        why: Those are the elements of trespass to land, not private nuisance.
      - text: Special damage, interference with a public right, and unreasonableness, whatever the particular facts of the case happen to be, in every case, without exception
        correct: false
        why: Those are the elements of public nuisance, not private nuisance.
      - text: Duty, breach and damage
        correct: false
        why: Those are the elements of negligence, a different tort entirely, not private nuisance.
  - key: q103
    type: mcq
    concept: private-nuisance-elements
    difficulty: 2
    stem: Under the traditional position on title to sue for private nuisance, who can sue?
    options:
      - text: A person with a proprietary interest in the land
        correct: true
        why: Correct — this is the traditional rule stated in Oldham v Lawson (No 1).
      - text: Anyone who is physically present on the land at the time of the interference, in every case, without exception
        correct: false
        why: Mere physical presence, without a proprietary interest, is not enough under the traditional rule.
      - text: Only the registered owner personally, never a tenant
        correct: false
        why: Incorrect — a tenant in actual possession also has title to sue.
      - text: Any member of the public affected by the interference
        correct: false
        why: That describes the public-nuisance framing, not private nuisance.
  - key: q104
    type: mcq
    concept: private-nuisance-elements
    difficulty: 2
    stem: In Oldham v Lawson (No 1), why could the wife but not the husband sue for the neighbours’ noise nuisance?
    options:
      - text: The wife had a proprietary interest in the land, while the husband was only a licensee with no proprietary interest
        correct: true
        why: "Correct — title to sue in private nuisance needs a proprietary interest: the wife had legal rights to the land and could sue, but the husband was only a licensee and had no title."
      - text: The husband had consented to the noise, so waived his claim, regardless of the specific facts involved, as a fixed and invariable rule in every instance
        correct: false
        why: "Tempting because consent defeats many claims, but Oldham turned on title to sue: the husband failed because he was only a licensee without a proprietary interest in the land."
      - text: Only the person who first complained to police can sue
        correct: false
        why: "Wrong — no complaint-first rule exists; standing in private nuisance depends on having a proprietary interest in the land, which is why the wife could sue and the husband could not."
      - text: The husband had moved out by the time of trial
        correct: false
        why: "Wrong — nothing turned on where the husband lived; he failed because he was only a licensee, and a licensee has no title to sue in private nuisance without a proprietary interest."
  - key: q105
    type: mcq
    concept: private-nuisance-elements
    difficulty: 2
    stem: What did Khorasandjian v Bush decide about title to sue?
    options:
      - text: That a licensee (the daughter) without a proprietary interest could still have title to sue for private nuisance
        correct: true
        why: "Correct — Khorasandjian let a licensee daughter sue for nuisance from prank calls without a proprietary interest; Hunter v Canary Wharf later overruled it, restoring the need for one."
      - text: That only a registered owner can ever sue
        correct: false
        why: "Wrong — the case went the other way: it extended title to sue to a licensee daughter, and even the traditional rule lets an owner or tenant in actual possession sue, not only a registered owner."
      - text: That title to sue is irrelevant to a private nuisance claim
        correct: false
        why: "Wrong — the case was specifically about title to sue: it let a licensee sue, departing from the rule that a proprietary interest is needed, until Hunter v Canary Wharf overruled it."
      - text: That nuisance claims require proof of physical damage to succeed, as a fixed and invariable rule in every instance, regardless of what the surrounding circumstances might otherwise suggest
        correct: false
        why: "Wrong — the case decided who may sue, not what harm must be shown; private nuisance covers intangible interferences such as the prank calls, so physical damage is not required."
  - key: q106
