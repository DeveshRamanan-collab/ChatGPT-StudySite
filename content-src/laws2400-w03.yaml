        correct: true
        why: Correct — possession, not ownership, is required — exclusive possession at the time of the trespass is enough.
      - text: That they are the registered owner of the land
        correct: false
        why: Ownership is not required; exclusive possession is what matters.
      - text: That they hold a current lease registered on title
        correct: false
