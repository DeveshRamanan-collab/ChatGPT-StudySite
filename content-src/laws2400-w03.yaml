  - key: q022
    type: mcq
    concept: trespass-to-land-scope
    difficulty: 2
    stem: In Bernstein v Skyviews, why was there no trespass?
    options:
      - text: The aircraft flew at a height well above what was necessary for the ordinary use and enjoyment of the land
        correct: true
        why: Correct — this is the ratio of the case — the height of the flight was above the zone needed for ordinary use and enjoyment.
      - text: Taking a photograph is never capable of being a trespass
        correct: false
        why: The reasoning turned on the height of the flight, not on photography being incapable of ever founding liability.
      - text: The plaintiff had consented to being photographed
        correct: false
        why: No such consent was given — the plaintiff sued precisely because he objected.
      - text: Aircraft are given a blanket statutory exemption from all rules of trespass
        correct: false
        why: The decision rests on the common law height test, not a statutory exemption.
  - key: q023
    type: mcq
    concept: trespass-to-land-scope
    difficulty: 2
    stem: Which principle from Bernstein v Skyviews would most help a defendant who flew a drone at 300 metres over P’s rural property purely to take a landscape photo?
    options:
      - text: An owner’s airspace rights extend only to the height needed for ordinary use and enjoyment; above that, they have no greater rights than the public
        correct: true
        why: Correct — this is the height-based test the defendant could rely on.
      - text: Photography can never be a tort, so there is no trespass regardless of height
        correct: false
        why: The case does not establish a blanket rule about photography; it turns on the height of the airspace intrusion.
      - text: Trespass to land only protects the soil, never the airspace above it, even where a structure hovers just centimetres above the ground for hours at a time
        correct: false
        why: Incorrect — airspace is protected up to the height of ordinary use and enjoyment.
      - text: The drone operator needed the landowner’s express consent regardless of height
        correct: false
        why: This is the opposite of Bernstein’s reasoning, which frees high-altitude activity from needing consent.
