cards:
  - type: basic
    concept: trespass-to-land-elements
    front: What are the four elements of trespass to land?
    back: A direct and positive act; intentional or negligent; in the possession of the plaintiff; without consent or other lawful justification.
    source: Torts Topic 3 Lecture 1, slide 5
  - type: basic
    concept: trespass-to-land-elements
    front: Is trespass to land actionable per se?
    back: Yes — the plaintiff does not need to prove damage.
    source: Torts Topic 3 Lecture 1, slide 6
  - type: basic
    concept: trespass-to-land-elements
    front: Who bears the onus of proving fault in a (non-highway) trespass to land case?
    back: The defendant — they must disprove fault; the plaintiff need not prove it.
    source: Torts Topic 3 Lecture 1, slide 6
  - type: cloze
    concept: trespass-to-land-elements
    text: Mistake is {{c1::no defence}} to trespass to land as long as there was an intentional or negligent trespassory act.
    source: Torts Topic 3 Lecture 1, slide 6
  - type: apply
    concept: trespass-to-land-elements
    scenario: D drives onto P’s driveway to park, genuinely believing it is a public car park.
    answer: "D is liable in trespass to land: the act of driving on and parking was intentional, and D’s honest mistake about whose land it was is no defence."
    source: Torts Topic 3 Lecture 1, slide 6
  - type: basic
    concept: trespass-to-land-scope
    front: How high does an owner’s protected airspace extend, per Bernstein v Skyviews?
    back: Only to the height necessary for the ordinary use and enjoyment of the land; above that, the owner has no greater rights than the public.
    source: Torts Topic 3 Lecture 1, slide 8
  - type: basic
    concept: trespass-to-land-scope
    front: What two things does "possession" require for trespass to land?
    back: Factual control over the land, and an intention to exclude all others.
    source: Torts Topic 3 Lecture 1, slide 10
  - type: cloze
    concept: trespass-to-land-scope
    text: In {{c1::Newington v Windeyer}}, the plaintiff could sue in trespass despite not being the registered owner, because she had exclusive possession.
    source: Torts Topic 3 Lecture 1, slide 11
  - type: apply
    concept: trespass-to-land-scope
    scenario: A sign 24 cm into P’s airspace vs an aircraft flying several hundred feet above P’s land.
    answer: The sign is trespass (Kelsen v Imperial Tobacco Co); the aircraft is not (Bernstein v Skyviews) — the height/ordinary-use test explains the difference.
    source: Torts Topic 3 Lecture 1, slide 8
  - type: basic
    concept: trespass-to-land-scope
    front: Does a tenant need to be the owner to sue in trespass to land?
    back: No — a tenant in possession can sue; ownership is not required.
    source: Torts Topic 3 Lecture 1, slide 9
  - type: basic
    concept: implied-licence
    front: What does the implied licence in Halliday v Nevill allow?
    back: Any member of the public, including police, to go up an unobstructed, unlocked driveway to communicate with an occupier, unless negated by a sign or lock.
    source: Torts Topic 3 Lecture 1, slide 13
  - type: basic
    concept: implied-licence
    front: Does the implied licence extend to administering a breath test to the occupier?
    back: No — Munnings v Barrett held this is outside the licence.
    source: Torts Topic 3 Lecture 1, slide 13
  - type: basic
    concept: implied-licence
    front: Does the implied licence extend to serving a summons?
    back: No — Plenty v Dillon held this is outside the licence.
    source: Torts Topic 3 Lecture 1, slide 13
  - type: cloze
    concept: implied-licence
    text: In {{c1::Roy v O’Neill}}, having an additional, "alien" purpose in mind does not by itself make an entrant a trespasser if one purpose is within the implied licence.
    source: Torts Topic 3 Lecture 1, slide 14
  - type: apply
    concept: implied-licence
    scenario: A person with a house key, authorised only to keep an eye on a house while the owner is away, enters to steal.
    answer: They are a trespasser (Barker v The Queen) — entering for a purpose outside the authorised one exceeds the licence.
    source: Torts Topic 3 Lecture 1, slide 15
  - type: basic
    concept: implied-licence
    front: Why was entry with television cameras a trespass in Lincoln Hunt Aust v Willesee?
    back: It was not for the purpose of bona fide seeking information or business with the occupier, or as a client of the business.
    source: Torts Topic 3 Lecture 1, slide 15
  - type: basic
    concept: remedies-trespass-to-land
    front: What three remedies are available for trespass to land?
    back: Damages, injunctions, and self-help.
    source: Torts Topic 3 Lecture 1, slide 17
  - type: basic
    concept: remedies-trespass-to-land
    front: What is the general measure of damages for trespass to land?
    back: Put the injured party in the position they would have been in if no wrong had been committed — usually the diminution in the value of the property.
    source: Torts Topic 3 Lecture 1, slide 18
  - type: cloze
    concept: remedies-trespass-to-land
    text: In suitable cases, a court may order the higher cost of {{c1::reinstatement}} instead of the diminution in value.
    source: Torts Topic 3 Lecture 1, slide 18
  - type: apply
    concept: remedies-trespass-to-land
    scenario: A trespass to land causes P no financial loss but the trespasser acted deliberately and offensively.
    answer: P can still recover at least nominal damages (actionable per se), and aggravated or exemplary damages may be available given the deliberate, high-handed conduct.
    source: Torts Topic 3 Lecture 1, slide 18
  - type: basic
    concept: public-nuisance
    front: What are the three elements of public nuisance?
    back: Title to sue (special/particular damage), interference with a public right, and substantial and unreasonable interference.
    source: Torts Topic 3 Lecture 1, slide 22
  - type: basic
    concept: public-nuisance
    front: Is public nuisance a crime or a tort?
    back: Both — it is a common law crime, and also a tort if the plaintiff suffered special or particular damage.
    source: Torts Topic 3 Lecture 1, slide 21
  - type: cloze
    concept: public-nuisance
    text: In {{c1::Walsh v Ervin}}, special or particular damage was held not to be limited to actual pecuniary loss.
    source: Torts Topic 3 Lecture 1, slide 24
  - type: apply
    concept: public-nuisance
    scenario: A farmer ploughs crops onto a public highway and erects gates blocking P’s vehicle access.
    answer: This is a classic public nuisance (Walsh v Ervin); P’s substantial delay and inconvenience, dissimilar to the general public’s, can be special damage giving title to sue.
    source: Torts Topic 3 Lecture 1, slide 23
  - type: basic
    concept: private-nuisance-elements
    front: What are the three elements of private nuisance?
    back: Title to sue, substantial and unreasonable interference, and the defendant having created, authorised or continued the harm.
    source: Topic 3 Lecture 2, slide 3
  - type: basic
    concept: private-nuisance-elements
    front: What is the current rule on title to sue for private nuisance?
    back: A proprietary interest in the land (owner or tenant in actual possession) is required — Hunter v Canary Wharf Ltd.
    source: Topic 3 Lecture 2, slide 5
  - type: cloze
    concept: private-nuisance-elements
    text: The test for substantial and unreasonable interference is {{c1::objective}} — the standard of an ordinary person in the claimant’s position (Munro v Southern Dairies).
    source: Topic 3 Lecture 2, slide 7
  - type: apply
    concept: private-nuisance-elements
    scenario: A broadcaster overlooks a racecourse from neighbouring land and describes the races, diverting paying customers.
    answer: No actionable private nuisance (Victoria Park Racing v Taylor) — loss of custom through lawful competition and being overlooked are not protected interests, though hostility or malice could change the analysis.
    source: Topic 3 Lecture 2, slide 8
  - type: basic
    concept: private-nuisance-elements
    front: Why is motive relevant in Hollywood Silver Fox Farm v Emmett?
    back: The defendant’s malice in shooting guns to disturb breeding foxes made the interference substantial and unreasonable.
    source: Topic 3 Lecture 2, slide 9
  - type: basic
    concept: private-nuisance-elements
    front: What did Lord Wright say makes a person liable for "continuing" a nuisance?
    back: Neglecting to remedy the nuisance once they became, or should have become, aware of it.
    source: Topic 3 Lecture 2, slide 12
  - type: basic
    concept: nuisance-defences-remedies
    front: What four defences to nuisance are listed in the lecture?
    back: Prescriptive right (20+ years), the plaintiff’s conduct or consent, statutory authorisation, and contributory negligence.
    source: Topic 3 Lecture 2, slide 13
  - type: basic
    concept: nuisance-defences-remedies
    front: Is "coming to the nuisance" a defence?
    back: No — it is expressly stated to be no defence.
    source: Topic 3 Lecture 2, slide 13
  - type: cloze
    concept: nuisance-defences-remedies
    text: The nuisance remedy of {{c1::abatement}} lets a plaintiff act without going to court, but only using reasonable methods.
    source: Topic 3 Lecture 2, slide 16
  - type: apply
    concept: nuisance-defences-remedies
    scenario: A quarry’s dust has drifted onto neighbouring land, unremarked, for 25 years.
    answer: The quarry may plead a prescriptive right, since the interference has continued for more than 20 years.
    source: Topic 3 Lecture 2, slide 13
  - type: basic
    concept: nuisance-defences-remedies
    front: When is an injunction normally granted for nuisance?
    back: Where damages would not be an adequate remedy, with the chance of recurrence a relevant factor.
    source: Topic 3 Lecture 2, slide 16
  - type: basic
    concept: trespass-to-land-decision-flow
    front: How does the textbook flowchart define trespass to land?
    back: The direct, intentional or negligent invasion or interference with land in possession of the plaintiff without lawful authority, justification or excuse (Barker v The Queen; Roy v O'Neill).
    source: Topic 3 flowchart, p 142 (Trespass to Land)
  - type: basic
    concept: trespass-to-land-decision-flow
    front: List the flowchart's general principles for trespass to land, in order.
    back: Exclusive possession; of land; direct invasion or interference; fault; without lawful authority, justification or excuse; remedies.
    source: Topic 3 flowchart, p 142 (Trespass to Land)
  - type: cloze
    concept: trespass-to-land-decision-flow
    text: "Exclusive possession is often referred to as '{{c1::title to sue}}': the plaintiff must be in possession of the land at the {{c2::time the interference is said to have taken place}}."
    source: Topic 3 flowchart, p 142 (Trespass to Land)
  - type: basic
    concept: trespass-to-land-decision-flow
    front: In what three ways does exclusive possession typically arise, per the flowchart?
    back: By title (the title holder is in actual possession); by consent (in possession under a lease); by adverse possession (without title or consent).
    source: Topic 3 flowchart, p 142 (Trespass to Land)
  - type: cloze
    concept: trespass-to-land-decision-flow
    text: "{{c1::Licences}} typically will not confer a right of exclusive possession."
    source: Topic 3 flowchart, p 142 (Trespass to Land)
  - type: apply
    concept: trespass-to-land-decision-flow
    scenario: A tenant stays on in a house after the lease ends. The owner wants to sue the tenant in trespass.
    answer: "Title to sue depends on possession: the owner will need to retake possession in order to have title to sue in trespass."
    source: Topic 3 flowchart, p 142 (Trespass to Land)
  - type: cloze
    concept: trespass-to-land-decision-flow
    text: The flowchart's 'of land' box extends to direct interference with possession of {{c1::airspace}}, {{c2::fixtures}} or {{c3::subsoil}}.
    source: Topic 3 flowchart, p 142 (Trespass to Land)
  - type: basic
    concept: trespass-to-land-decision-flow
    front: Besides physical entry, what can count as a direct invasion or interference under the flowchart?
    back: Exceeding the terms of a licence, or going beyond its expiry or revocation. Indirect interference may be another tort, such as private nuisance.
    source: Topic 3 flowchart, p 142 (Trespass to Land)
  - type: apply
    concept: trespass-to-land-decision-flow
    scenario: Dust from a neighbour's renovation drifts over the fence and settles in P's garden every day.
    answer: The interference is indirect, so trespass is the wrong tort; the flowchart points to another tort such as private nuisance.
    source: Topic 3 flowchart, p 142 (Trespass to Land)
  - type: basic
    concept: trespass-to-land-decision-flow
    front: What does the flowchart's fault box require?
    back: The trespassory act must be intentional or negligent. The defendant need not intend to trespass; mistake is generally not a defence; involuntary conduct (utterly without fault) is not actionable.
    source: Topic 3 flowchart, p 142 (Trespass to Land)
  - type: apply
    concept: trespass-to-land-decision-flow
    scenario: D is shoved by a stranger and stumbles through P's gate onto P's lawn.
    answer: "No actionable trespass: involuntary conduct, where D is utterly without fault, is not actionable."
    source: Topic 3 flowchart, p 142 (Trespass to Land)
  - type: basic
    concept: trespass-to-land-decision-flow
    front: What does the flowchart's remedies box say?
    back: No damage needed (actionable per se). Substantive damages for actual losses that are natural and probable consequences, or damages on the 'user fee' principle. An injunction, at the court's discretion, for a continuing or threatened trespass where damages are inadequate.
    source: Topic 3 flowchart, p 142 (Trespass to Land)
  - type: cloze
    concept: trespass-to-land-decision-flow
    text: Injunctive relief may, at a court's {{c1::discretion}}, be granted to prevent a {{c2::continuing or threatened}} trespass where damages would be an {{c3::inadequate}} remedy.
    source: Topic 3 flowchart, p 142 (Trespass to Land)
audio:
  title: Week 3 recap — trespass to land and nuisance
  minutes: 3
  script: |-
    This week is about the torts that protect our interests in land: trespass to land, and nuisance, both public and private.

    Trespass to land is direct interference with land in someone's possession. We need a direct and positive act, done intentionally or negligently, on land the plaintiff possesses, without consent or lawful excuse. It's actionable per se, so no damage needs to be proved, and mistake is no defence — if you intentionally build a fence on what you honestly think is your own land, but it's actually your neighbour's, you've still trespassed. Land includes the soil, fixtures, and the airspace above it, but only up to the height needed for ordinary use and enjoyment — that's why flying an aircraft high above someone's estate in Bernstein v Skyviews wasn't trespass, while a sign poking twenty-four centimetres into the airspace in Kelsen was. And you need exclusive possession, not ownership, to sue — factual control plus an intention to exclude others, as the fifty-year occupier in Newington v Windeyer showed through hosting parties, gardening and paying rates.

    Then there's the implied licence: any unlocked, unobstructed driveway carries a licence for lawful communication, as in Halliday v Nevill. But that licence is narrow — it doesn't cover a breath test in Munnings v Barrett, or serving a summons in Plenty v Dillon. Roy v O'Neill adds the twist that having an extra purpose in mind, alongside a licensed one, doesn't automatically make you a trespasser.

    Remedies for trespass include damages — nominal, compensatory, aggravated or exemplary, usually measured by diminution in value, sometimes reinstatement — injunctions, and self-help using reasonable force.

    Nuisance is different: it's unreasonable interference with the use or enjoyment of land, and it needn't be direct. Public nuisance is a crime, but a private plaintiff can sue in tort if they show special damage — delay and inconvenience dissimilar to the general public's, as in Walsh v Ervin — interference with a public right, and substantial, unreasonable interference.

    Private nuisance needs title to sue — traditionally a proprietary interest, as Oldham v Lawson shows, tested by Khorasandjian v Bush and settled by Hunter v Canary Wharf — plus substantial and unreasonable interference, judged objectively as in Munro v Southern Dairies, and proof the defendant created, authorised or continued it. Victoria Park Racing v Taylor reminds us that being overlooked, or losing customers to lawful competition, isn't nuisance, though motive can matter, as the malicious gun-firing in Hollywood Silver Fox Farm v Emmett shows.

    Defences include a twenty-year prescriptive right, the plaintiff's own conduct or consent — though coming to the nuisance is no defence — statutory authorisation, and contributory negligence. Remedies are damages, injunction, and abatement, used cautiously and only with reasonable methods.
