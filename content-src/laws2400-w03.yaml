        correct: false
        why: Irrelevant to contributory negligence, which concerns the plaintiff’s own conduct, not their relationship to the defendant.
      - text: The defendant did not know the interference was occurring, regardless of what the surrounding circumstances might otherwise suggest
        correct: false
        why: That concerns the defendant’s own awareness, not the plaintiff’s contribution to the harm.
  - key: q136
    type: mcq
    concept: nuisance-defences-remedies
    difficulty: 2
    stem: If a plaintiff cannot show that the type of harm they suffered was reasonably foreseeable, what is the likely consequence for a nuisance damages claim?
    options:
      - text: Damages for that particular type of harm will likely not be recoverable
        correct: true
        why: Correct — foreseeability is required to claim damages for that type of harm.
      - text: The whole claim automatically fails, including for foreseeable heads of harm
        correct: false
        why: Overstated — the foreseeability requirement applies to that particular type of harm, not necessarily to the whole claim.
      - text: It has no effect, since foreseeability is irrelevant to damages in nuisance
        correct: false
        why: Incorrect — foreseeability is expressly required for damage to be recoverable in nuisance.
      - text: The court will still award damages but at a reduced rate
        correct: false
        why: No such reduced-rate consequence is described — the materials describe no partial recovery rule of this kind.
  - key: q137
    type: mcq
    concept: nuisance-defences-remedies
    difficulty: 4
    stem: A plaintiff has proven private nuisance from a neighbour’s recurring bonfires and wants the fastest way to stop the smoke without repeatedly returning to court. What should they be advised about abatement versus an injunction?
    options:
      - text: Abatement lets them act without court proceedings, but only using reasonable methods and with caution; an injunction, though requiring court process, gives a more secure and enforceable long-term stop to a recurring interference
        correct: true
        why: Correct — this balances the two remedies’ respective strengths and limitations.
      - text: Abatement is always preferable because it never carries any risk to the plaintiff
        correct: false
        why: Incorrect — the lecture expressly cautions against overusing abatement.
      - text: An injunction is not available for a nuisance that has already occurred more than once
        correct: false
        why: Incorrect — recurrence is in fact a factor favouring an injunction, not a bar to one.
      - text: Abatement and injunction are the same remedy under different names
        correct: false
        why: Incorrect — they are distinct remedies with different procedures and risks.
    variant-of: q132
  - key: q138
    type: truefalse
    concept: nuisance-defences-remedies
    difficulty: 1
    set: quickfire
    statement: It is a complete defence to a nuisance claim that the plaintiff "came to the nuisance" by moving in after the activity began.
    answer: false
    why: The lecture states this is not a defence — coming to the nuisance does not excuse the defendant.
  - key: q139
    type: truefalse
    concept: nuisance-defences-remedies
    difficulty: 2
    set: quickfire
    statement: Statutory authorisation is a defence to nuisance only where the authorised activity could not have been performed without committing the nuisance.
    answer: true
    why: Correct — that is the stated condition for the statutory authorisation defence in the lecture materials.
  - key: q140
    type: short
    concept: nuisance-defences-remedies
    difficulty: 3
    prompt: A commercial bakery has operated its ovens, emitting a strong smell, at the same premises for 22 years without any complaint. A new neighbour, Wei, moves in and, within a month, sues the bakery in private nuisance over the smell, seeking an injunction to stop it immediately. Advise the bakery on its available defences and on whether an injunction is likely.
    model: "The bakery has two possible defences. First, a prescriptive right: the smell has continued for 22 years, which is more than the 20 years required, so the bakery may be able to show it has acquired a right to continue emitting the smell at its established level. Second, Wei’s own conduct: although Wei moved in knowing, or being able to discover, that the smell already existed, \"coming to the nuisance\" is expressly not a defence, so the bakery cannot rely on the timing of Wei’s move to defeat the claim outright — the prescriptive right is the stronger argument. On remedy, an injunction is normally granted only where damages would not be an adequate remedy, with the likelihood of recurrence a relevant factor; a recurring, ongoing smell is the kind of interference for which a one-off damages payment is unlikely to be adequate, which favours an injunction if nuisance is established and no defence succeeds. However, if the bakery can establish the prescriptive right, the claim, and any injunction, should fail entirely."
    rubric:
      - id: r1
        criterion: Identifies the prescriptive right and applies the 20-year threshold to the 22-year facts
        marks: 1
        top-band: Explicitly compares 22 years against the "more than 20 years" rule.
        margin-note: Correct defence and correct application.
        authorities: []
      - id: r2
        criterion: Correctly states that "coming to the nuisance" is not a defence
        marks: 1
        top-band: Explains why Wei’s recent move-in does not defeat the claim.
        margin-note: Common trap avoided.
        authorities: []
      - id: r3
        criterion: Considers statutory authorisation and/or contributory negligence and explains why they are not clearly available on these facts
        marks: 1
        top-band: Notes no statute or fault of Wei is raised on the facts.
        margin-note: Shows breadth across all four defences.
        authorities: []
      - id: r4
        criterion: Applies the injunction test (damages inadequate + chance of recurrence) to a recurring smell
        marks: 1
        top-band: Explains why a one-off damages award is inadequate for an ongoing smell.
        margin-note: Correctly links remedy choice to the facts.
        authorities: []
      - id: r5
        criterion: Reaches a reasoned, internally consistent conclusion tying the defence outcome to the remedy outcome
        marks: 1
        top-band: Explains that success on the prescriptive right defeats the injunction claim entirely.
        margin-note: Ties the analysis together.
        authorities: []
  - key: q141
    type: mcq
    concept: trespass-to-land-decision-flow
    difficulty: 1
    cases:
      - barker-v-the-queen
      - roy-v-oneill
    stem: Which definition of trespass to land does the textbook flowchart give?
    options:
      - text: Direct, intentional or negligent interference with land in the plaintiff's possession, without lawful authority, justification or excuse
        correct: true
        why: "Right — this is the flowchart's definition, citing Barker v The Queen and Roy v O'Neill: directness, fault, the plaintiff's possession and no lawful authority."
      - text: Direct or indirect interference with land the plaintiff owns that causes damage, unless the defendant acted reasonably and in good faith
        why: Tempting because it sounds complete, but trespass turns on possession, not ownership; indirect interference is another tort; and no damage is needed.
      - text: Unreasonable interference with the plaintiff's use or enjoyment of land, whether or not that interference is direct or physical
        why: Tempting because it also protects land, but this is the lecture definition of nuisance; trespass needs a direct interference with possession.
      - text: Intentional entry onto land registered in the plaintiff's name, made without the plaintiff's express written permission
        why: Tempting because entry is the classic trespass, but negligent acts count too, registration is not required, and implied consent or other lawful excuse also answers it.
  - key: q142
    type: mcq
    concept: trespass-to-land-decision-flow
    difficulty: 2
    cases:
      - barker-v-the-queen
    stem: The flowchart cites Barker v The Queen for its definition. Which proposition from the week's materials does Barker illustrate?
    options:
      - text: A police officer has an implied licence to walk up an open driveway to arrest a disqualified driver who is there
        why: Tempting because it is also an entry-with-permission case, but that is Halliday v Nevill; Barker concerns a person who went beyond his authority.
      - text: A person authorised to keep an eye on a house, and told where the key was, was a trespasser when he entered to steal
        correct: true
        why: Right — Barker shows that authority to enter for one purpose does not cover entry for a different purpose, which the flowchart treats as exceeding a licence.
      - text: Taking photographs from an aircraft flying several hundred feet above an estate is not a trespass to the land below
        why: Tempting because it is also a Topic 3 trespass case, but that is Bernstein v Skyviews, which limits how far up the protected airspace extends.
      - text: A long-term occupier who is not the registered owner can sue in trespass if her conduct shows exclusive possession
        why: Tempting because it is about who may sue, but that is Newington v Windeyer on possession; Barker is about entry beyond the scope of a permission.
  - key: q143
    type: mcq
    concept: trespass-to-land-decision-flow
    difficulty: 1
    contrasts-with:
      - private-nuisance-elements
    stem: In the flowchart, what does 'title to sue' in trespass to land refer to?
    options:
      - text: Registered ownership of the land at the time the action is commenced in court
        why: Tempting because "title" suggests ownership, but the flowchart ties title to sue to possession at the time of the interference, not to registration.
      - text: Possession of the land at the time the interference is said to have taken place
        correct: true
        why: "Right — the flowchart: the plaintiff must be in possession of the land at the time the interference is said to have taken place."
      - text: A proprietary interest in the land, which a tenant in possession under a lease lacks
        why: Tempting because private nuisance traditionally needs a proprietary interest, but for trespass a tenant in possession under a lease has title to sue.
      - text: Proof that the interference caused damage, which is what gives the plaintiff standing
        why: "Tempting because many torts need damage, but the flowchart says there is no requirement for damage: trespass is actionable per se."
  - key: q144
    type: mcq
    concept: trespass-to-land-decision-flow
    difficulty: 2
    stem: Which of these is NOT one of the ways the flowchart says exclusive possession typically arises?
    options:
      - text: By title, where the title holder is in actual possession
        why: "This is one of the flowchart's three ways, so it is not the exception: the title holder in actual possession has exclusive possession."
      - text: By consent, where the plaintiff holds the land under a lease
        why: This is listed — possession by consent under a lease — so it is not the exception; it is why a tenant can sue in trespass.
      - text: By adverse possession, without title or consent
        why: "This is listed as the third way, so it is not the exception: possession can arise without title or consent at all."
      - text: By licence, where the plaintiff was invited onto the land
        correct: true
        why: Right — the flowchart says licences typically will not confer a right of exclusive possession, so a mere invitation does not give title to sue.
  - key: q145
    type: mcq
    concept: trespass-to-land-decision-flow
    difficulty: 3
    variant-of: q143
    stem: Sam is staying in a friend's house as a guest for a fortnight. A neighbour's builder walks across the back lawn without asking. Applying the flowchart, what is the main obstacle to Sam suing in trespass?
    options:
      - text: Licences typically do not confer exclusive possession, so Sam probably lacks title to sue
        correct: true
        why: Right — a guest is a licensee, and the flowchart says licences typically will not confer the exclusive possession that title to sue requires.
      - text: Walking across a lawn is only an indirect interference, so the claim lies in private nuisance
        why: Tempting because nuisance covers interference with enjoyment, but walking onto land is a direct entry — the classic trespassory act.
      - text: Sam cannot show the lawn was damaged, and trespass to land needs proof of actual damage
        why: "Tempting because damage matters in negligence, but the flowchart says trespass is actionable per se: no damage need be proved."
      - text: The builder did not mean to trespass, and trespass requires an intention to trespass
        why: Tempting because trespass is an intentional tort, but the flowchart says the defendant need not intend to trespass; an intentional or negligent act is enough.
  - key: q146
    type: mcq
    concept: trespass-to-land-decision-flow
    difficulty: 3
    variant-of: q143
    stem: Lena's lease of Omar's flat ended a month ago, but she has not moved out. According to the flowchart, what must Omar do to have title to sue Lena in trespass?
    options:
      - text: "Nothing more: as the registered owner, Omar has title to sue the moment the lease ends"
        why: "Tempting because ownership usually helps prove possession, but the flowchart gives this exact example: the owner will need to retake possession first."
      - text: Retake possession of the flat
        correct: true
        why: "Right — the flowchart: where a tenant does not vacate at the end of a lease, the owner will need to retake possession to have title to sue in trespass."
      - text: Prove that Lena's continued occupation has caused him a measurable financial loss
        why: Tempting because Omar may be out of pocket, but trespass is actionable per se; the hurdle here is possession, not proof of loss.
      - text: Show that Lena intended to trespass, rather than mistakenly believing the lease still ran
        why: Tempting because Lena may be mistaken, but the defendant need not intend to trespass and mistake is generally no defence; the issue is Omar's possession.
  - key: q147
    type: mcq
    concept: trespass-to-land-decision-flow
    difficulty: 1
    stem: According to the flowchart, the 'of land' requirement can extend to direct interference with which of the following?
    options:
      - text: Airspace, fixtures or subsoil
        correct: true
        why: Right — the flowchart says trespass can extend to invasion or other direct interference with possession of airspace, fixtures or subsoil.
      - text: Only the surface of the soil
        why: Tempting because the soil is the obvious core of "land", but the flowchart expressly extends trespass to airspace, fixtures and subsoil.
      - text: The occupier's use and enjoyment
        why: Tempting because nuisance protects land too, but use and enjoyment is the interest private nuisance protects; trespass protects possession.
      - text: Land up to the boundary fence only
        why: Tempting because boundaries feel two-dimensional, but the flowchart reaches above (airspace) and below (subsoil) the surface.
  - key: q148
    type: mcq
    concept: trespass-to-land-decision-flow
    difficulty: 2
    cases:
      - bernstein-v-skyviews
    stem: The flowchart says trespass can extend to airspace. How does Bernstein v Skyviews, from the week's materials, limit that?
    options:
      - text: Airspace is protected only where the intruding object is attached to a building on neighbouring land
        why: Tempting because Kelsen involved a sign fixed to a building, but Bernstein's limit is about height, not attachment.
      - text: Only up to the height necessary for the ordinary use and enjoyment of the land
        correct: true
        why: Right — above that height the owner has no greater rights in the airspace than any other member of the public, so the overflight was not trespass.
      - text: All airspace above the land is protected, with no limit as to height, on the usque ad coelum maxim
        why: Tempting because Bernstein argued exactly this, but Griffiths J rejected a literal application of the maxim as leading to absurdity.
      - text: Only the airspace within 24 cm of the roofline or boundary
        why: Tempting because 24 cm is the Kelsen figure, but that was simply how far the sign intruded; it is not a rule about protected airspace.
  - key: q149
    type: mcq
    concept: trespass-to-land-decision-flow
    difficulty: 2
    contrasts-with:
      - private-nuisance-elements
    stem: Which of the following does the flowchart say can amount to a direct invasion or interference?
    options:
      - text: Noise from a neighbour's weekend parties that keeps the household awake
        why: Tempting because noise is a real interference, but it is indirect and affects enjoyment — the territory of private nuisance, not trespass.
      - text: Exceeding the terms of a licence the occupier gave to be on the land
        correct: true
        why: Right — the flowchart says direct invasion can include exceeding the terms of a licence, or going beyond its expiry or revocation.
      - text: Smell that drifts every evening from a neighbouring stable
        why: Tempting because smell interferes with the land, but it is indirect; the flowchart says indirect interference may be another tort such as private nuisance.
      - text: Being overlooked from a tall platform built on neighbouring land
        why: Tempting because it feels intrusive, but there is no entry at all, and Victoria Park Racing holds that freedom from being overlooked is not even protected in nuisance.
  - key: q150
    type: mcq
    concept: trespass-to-land-decision-flow
    difficulty: 3
    cases:
      - roy-v-oneill
    stem: Priya lets Tom into her shop's back office to discuss a delivery. After an argument she tells him to leave, but he stays for twenty minutes. Applying the flowchart, why can his staying be a trespass?
    options:
      - text: He cannot be a trespasser, because he first entered with Priya's permission
        why: Tempting because his entry was lawful, but the flowchart treats going beyond the revocation of a licence as a direct interference.
      - text: Staying on after a licence is revoked can be a direct interference with the land
        correct: true
        why: "Right — the flowchart lists going beyond revocation of a licence; Roy v O'Neill: a person whose licence is revoked becomes a trespasser if they remain."
      - text: It is a trespass only if Priya proves the extra twenty minutes caused her loss
        why: Tempting because the stay was short, but trespass is actionable per se; no loss need be proved for the remedy of at least nominal damages.
      - text: Arguing on another person's premises is itself trespassory, whether or not he leaves
        why: Tempting because the argument triggered the revocation, but it is remaining after revocation — not the argument — that the flowchart treats as trespassory.
  - key: q151
    type: mcq
    concept: trespass-to-land-decision-flow
    difficulty: 3
    contrasts-with:
      - private-nuisance-elements
    stem: Dust from Ben's renovation drifts over the fence and settles on Ava's garden every day. According to the flowchart, why is trespass to land the wrong starting point?
    options:
      - text: Ava cannot sue in trespass unless she first proves the dust has damaged her garden
        why: Tempting because the dust is a nuisance only if it harms her, but trespass needs no damage; the problem is that the interference is indirect.
      - text: The interference is indirect, which may constitute another tort such as private nuisance
        correct: true
        why: Right — the flowchart says indirect interference may constitute another tort such as private nuisance, which protects against tangible interferences like dust.
      - text: Dust is not "land", because land is limited to the soil and excludes fixtures
        why: Tempting because dust is not part of the land, but that is not the test — and the flowchart says land extends to fixtures, airspace and subsoil.
      - text: Ben's renovation is lawful, and a lawful activity can never amount to a tort
        why: Tempting because the work itself is lawful, but lawful activities can still be nuisances; the reason trespass fails is that the dust is indirect.
  - key: q152
    type: mcq
    concept: trespass-to-land-decision-flow
    difficulty: 2
    stem: What does the flowchart say about the defendant's fault in trespass to land?
    options:
      - text: The defendant must have intended to trespass, so an honest mistake about the boundary is a complete answer
        why: Tempting because trespass is called an intentional tort, but the flowchart says the defendant need not intend to trespass and mistake is generally not a defence.
      - text: The act must be intentional or negligent, but the defendant need not intend to trespass
        correct: true
        why: "Right — the fault box: the act constituting the trespassory conduct must be intentional or negligent; an intention to trespass is not required."
      - text: Liability is strict, so even involuntary conduct, utterly without fault, is actionable
        why: "Tempting because trespass is actionable per se, but that concerns damage, not fault: involuntary conduct without fault is not actionable."
      - text: Only negligent acts count; intentional entries are left to the criminal law
        why: Tempting because some trespasses are also crimes, but the flowchart says the act may be intentional or negligent; intentional entries are the core case.
  - key: q153
    type: mcq
    concept: trespass-to-land-decision-flow
    difficulty: 3
    variant-of: q152
    stem: Kim is shoved by a stranger and stumbles through Dev's open gate onto his front lawn. Applying the flowchart's fault box, what is the likely result?
    options:
      - text: "No actionable trespass by Kim: involuntary conduct, where she is utterly without fault, is not actionable"
        correct: true
        why: Right — the flowchart says involuntary conduct, where the defendant is utterly without fault, is not actionable; Kim did no intentional or negligent act.
      - text: "Kim trespassed: mistake is generally no defence, so how she came to be on the lawn is irrelevant"
        why: Tempting because mistake is no defence, but that assumes an intentional or negligent act; Kim's movement was not her act at all.
      - text: Kim trespassed, because trespass is actionable per se and Dev need not prove damage
        why: Tempting because no damage is needed, but actionable per se is about damage; the fault box still requires an intentional or negligent act.
      - text: No trespass, because the front lawn is covered by the implied licence to approach and knock
        why: Tempting because the implied licence covers a path to the door, but it covers lawful communication, not being shoved; the real answer is lack of fault.
  - key: q154
    type: mcq
    concept: trespass-to-land-decision-flow
    difficulty: 3
    variant-of: q152
    stem: Raj builds a shed that extends 30 cm over his boundary, honestly believing the strip is his. Applying the flowchart, how is his mistake treated?
    options:
      - text: As a complete defence, because Raj never intended to trespass on his neighbour's land
        why: Tempting because Raj acted in good faith, but the flowchart says the defendant need not intend to trespass, and mistake is generally not a defence.
      - text: "Generally no defence: the building was intentional, even though trespassing was not"
        correct: true
        why: Right — the act of building was intentional, which satisfies the fault box; Raj need not have intended to trespass, so his mistake does not help.
      - text: As converting the claim into private nuisance, because the encroachment was unintended
        why: Tempting because nuisance is the other land tort, but the line between them is directness, not intention; a shed built over the line is direct.
      - text: As removing the fault element entirely, because fault requires knowledge of the boundary
        why: Tempting because "fault" suggests blame, but the fault box asks only whether the act was intentional or negligent, not whether Raj knew the boundary.
  - key: q155
    type: mcq
    concept: trespass-to-land-decision-flow
    difficulty: 1
    contrasts-with:
      - nuisance-defences-remedies
    stem: Under the flowchart's remedies box, what must a plaintiff prove about damage to succeed in trespass to land?
    options:
      - text: "Nothing: trespass is actionable per se"
        correct: true
        why: "Right — the flowchart says there is no requirement for damage: trespass is actionable per se."
      - text: Substantial damage that is the natural and probable consequence of the trespass
        why: Tempting because the flowchart uses this phrase, but it governs substantive damages for actual losses, not whether the tort is made out.
      - text: Some measurable diminution in the market value of the land
        why: Tempting because diminution in value is the usual measure of damages, but it is a measure of loss, not a precondition of liability.
      - text: Damage of a reasonably foreseeable type, as for a nuisance claim
        why: Tempting because the lecture says nuisance damages must be reasonably foreseeable, but trespass needs no damage at all.
  - key: q156
    type: mcq
    concept: trespass-to-land-decision-flow
    difficulty: 2
    variant-of: q155
    stem: When does the flowchart say substantive damages for actual losses are available for a trespass to land?
    options:
      - text: Only where the trespass was deliberate or high-handed, as a punishment of the defendant
        why: Tempting because aggravated and exemplary damages respond to such conduct, but the flowchart's test for substantive damages is about consequences.
      - text: Whenever any loss follows the trespass, however remote or unlikely that loss is
        why: Tempting because trespass is generous to plaintiffs, but the flowchart limits substantive damages to natural and probable consequences.
      - text: Where the actual losses are the natural and probable consequences of the trespass
        correct: true
        why: "Right — the flowchart: substantive damages for actual losses where they are the natural and probable consequences of the trespass."
      - text: Only where the plaintiff has also obtained an injunction against the defendant
        why: Tempting because the remedies are listed together, but damages and an injunction are separate; an injunction is for when damages are inadequate.
  - key: q157
    type: mcq
    concept: trespass-to-land-decision-flow
    difficulty: 2
    stem: Besides substantive damages for actual losses, on what alternative basis does the flowchart say damages may be assessed for trespass to land?
    options:
      - text: The 'user fee' principle
        correct: true
        why: Right — the flowchart says damages may alternatively be made on the basis of the 'user fee' principle.
      - text: Reasonable foreseeability, as for nuisance
        why: Tempting because the lecture applies foreseeability to nuisance damages, but the flowchart's alternative basis for trespass is the user fee principle.
      - text: The 'came to the nuisance' rule
        why: Tempting because it is a Topic 3 phrase, but it is a failed defence to nuisance (no defence at all), not a basis for trespass damages.
      - text: Abatement of the plaintiff's own loss
        why: Tempting because abatement is a Topic 3 remedy, but it is self-help for nuisance, not a basis on which trespass damages are assessed.
  - key: q158
    type: mcq
    concept: trespass-to-land-decision-flow
    difficulty: 2
    stem: Under the flowchart, when may a court grant injunctive relief for trespass to land?
    options:
      - text: As of right whenever the trespass is proved, because trespass is actionable per se
        why: Tempting because liability needs no damage, but an injunction is discretionary; actionable per se speaks to liability, not to the remedy.
      - text: In its discretion, to prevent a continuing or threatened trespass where damages would be an inadequate remedy
        correct: true
        why: "Right — the flowchart: injunctive relief may, at a court's discretion, be granted to prevent a continuing or threatened trespass where damages would be inadequate."
      - text: Only after the plaintiff has first tried self-help to remove the trespasser by reasonable force
        why: Tempting because self-help is a listed remedy, but nothing makes it a precondition; the injunction test is a continuing or threatened trespass and inadequate damages.
      - text: Only once the trespass has already caused damage that is a natural and probable consequence
        why: Tempting because the phrase comes from the damages limb, but an injunction can prevent a threatened trespass before any damage occurs.
  - key: q159
    type: mcq
    concept: trespass-to-land-decision-flow
    difficulty: 1
    stem: In what order does the flowchart set out the general principles of trespass to land?
    options:
      - text: Fault → direct invasion → exclusive possession → of land → remedies → without lawful authority
        why: Tempting because fault matters early in many torts, but the flowchart starts with who can sue (exclusive possession) and ends with remedies.
      - text: Exclusive possession → of land → direct invasion → fault → without lawful authority → remedies
        correct: true
        why: "Right — the flowchart runs: exclusive possession, of land, direct invasion or interference, fault, without lawful authority, then remedies."
      - text: Of land → fault → without lawful authority → exclusive possession → direct invasion → remedies
        why: Tempting because "of land" sounds like the starting point, but the flowchart begins with exclusive possession, the title to sue.
      - text: Direct invasion → without lawful authority → fault → remedies → exclusive possession → of land
        why: Tempting because the invasion is the event, but the flowchart puts title to sue first, and remedies last, after every liability box.
  - key: q160
    type: mcq
    concept: trespass-to-land-decision-flow
    difficulty: 4
    contrasts-with:
      - private-nuisance-elements
    stem: Which fact pattern does the flowchart treat as a trespass to land, rather than a matter for another tort?
    options:
      - text: Smoke from a neighbour's incinerator drifts across the plaintiff's garden most evenings
        why: Tempting because the smoke physically crosses the boundary, but it is an indirect interference, which the flowchart sends to another tort such as private nuisance.
      - text: A builder's crane jib swings low over the plaintiff's roof while the next-door site is worked
        correct: true
        why: Right — the jib directly invades airspace at a height in ordinary use; the lecture lists encroachment by cranes as trespassory conduct.
      - text: A broadcaster on a platform next door describes the races run on the plaintiff's track
        why: Tempting because the platform overlooks the land, but there is no entry; Victoria Park Racing held overlooking is not even a nuisance.
      - text: A neighbour's loud music on weeknights keeps the plaintiff's family from sleeping
        why: Tempting because it is a real interference, but noise is intangible and indirect — classic private nuisance territory, not trespass.
  - key: q161
    type: mcq
    concept: trespass-to-land-decision-flow
    difficulty: 3
    cases:
      - halliday-v-nevill
    stem: A courier walks up Mia's open, unsigned front path to knock and hand over a parcel. Which flowchart box answers any claim in trespass?
    options:
      - text: Fault — the courier never intended to trespass on Mia's land
        why: Tempting because the courier meant no harm, but the defendant need not intend to trespass; walking up the path was an intentional act.
      - text: Without lawful authority — an implied licence covers approaching to knock on lawful business
        correct: true
        why: "Right — Halliday v Nevill: an unobstructed path carries an implied licence to approach for lawful communication with, or delivery to, the occupier."
      - text: Direct invasion — walking up a path is only an indirect interference with the land
        why: Tempting because the visit is brief, but walking onto land is a direct entry; it is the licence, not indirectness, that answers the claim.
      - text: Exclusive possession — Mia has no title to sue over a path open to the public
        why: Tempting because the path is open, but an unlocked path is still in Mia's possession; openness only implies a licence to approach.
  - key: q162
    type: mcq
    concept: trespass-to-land-decision-flow
    difficulty: 4
    variant-of: q150
    cases:
      - barker-v-the-queen
    stem: Jo is given her neighbour's key so she can feed his cat while he is away. She uses it to go in and take his laptop. Why can her entry be a trespass despite the key?
    options:
      - text: Entering for a purpose outside the licence exceeds its terms, as in Barker v The Queen
        correct: true
        why: Right — the flowchart counts exceeding the terms of a licence as a direct interference, and Barker held a keyholder who entered to steal was a trespasser.
      - text: Holding the key gave Jo exclusive possession, which ended her neighbour's title to sue
        why: Tempting because the key gives control, but a licence typically does not confer exclusive possession, and the neighbour still has title to sue.
      - text: It cannot be a trespass, because a person given a key has unlimited authority to enter
        why: Tempting because Jo had express permission, but a licence is confined to its purpose; entering for a different purpose goes beyond it.
      - text: It is a trespass only if the laptop is damaged, because trespass needs proof of loss
        why: Tempting because the laptop is the loss, but trespass to land is actionable per se; the trespass is the unauthorised entry itself.
  - key: q163
    type: truefalse
    concept: trespass-to-land-decision-flow
    difficulty: 1
    statement: According to the flowchart, licences typically confer a right of exclusive possession, so a licensee can usually sue in trespass.
    answer: false
    why: False — the flowchart says licences typically will NOT confer a right of exclusive possession, so a licensee usually lacks title to sue in trespass.
  - key: q164
    type: truefalse
    concept: trespass-to-land-decision-flow
    difficulty: 1
    contrasts-with:
      - private-nuisance-elements
    statement: The flowchart treats indirect interference with land as outside trespass, noting that it may constitute another tort such as private nuisance.
    answer: true
    why: True — directness is what marks trespass; the flowchart says indirect interference may constitute another tort, such as private nuisance.
  - key: q165
    type: truefalse
    concept: trespass-to-land-decision-flow
    difficulty: 2
    statement: Because trespass to land is actionable per se, involuntary conduct where the defendant is utterly without fault is still actionable.
    answer: false
    why: False — actionable per se means no damage is needed; the flowchart separately says involuntary conduct, utterly without fault, is not actionable.
  - key: q166
    type: truefalse
    concept: trespass-to-land-decision-flow
    difficulty: 2
    statement: Where a tenant does not vacate at the end of a lease, the owner may need to retake possession before having title to sue in trespass.
    answer: true
    why: "True — this is the flowchart's own example: title to sue depends on possession, so the owner will need to retake possession to sue in trespass."
