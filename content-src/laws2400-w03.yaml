        why: Too narrow — unharvested crops and a limited band of airspace are also included.
      - text: The soil and fixtures only — airspace above the land is never protected under any circumstances
        correct: false
        why: Incorrect — Bernstein v Skyviews and Kelsen both show airspace can be protected up to a certain height.
      - text: Any airspace above the land, without limit, under the usque ad coelum maxim
        correct: false
        why: Rejected by Bernstein v Skyviews — airspace protection is limited to the height needed for ordinary use and enjoyment.
