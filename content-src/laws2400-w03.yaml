      - text: Only when the visitor has a prior relationship with the occupier
        correct: false
        why: "Wrong — the implied licence extends to any member of the public on lawful business approaching to knock; the visitor need not know the occupier or have any prior relationship."
      - text: Only when the visitor is a government official, such as a police officer attending in an official capacity
        correct: false
        why: "Tempting because Halliday v Nevill involved a police officer, but the licence it describes extends to any member of the public on lawful business, not only officials."
      - text: In every case, regardless of locks, gates or signs
        correct: false
        why: "Wrong — the implied licence is not unconditional: a locked gate or a sign prohibiting entry negates it, so an entrant who ignores them has no licence and trespasses."
