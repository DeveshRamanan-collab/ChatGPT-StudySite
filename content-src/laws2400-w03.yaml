  - key: q120
    type: short
    concept: private-nuisance-elements
    difficulty: 3
    prompt: Every evening for the past two years, a backyard mechanic, Dev, has run a loud engine-testing rig until midnight, audible throughout the street. His next-door neighbour, Farah, who owns her home, wants to sue Dev in private nuisance. Farah is unusually sensitive to noise due to a medical condition and finds the noise unbearable, though her adult son, a mere guest staying temporarily, is equally bothered. Advise Farah.
    model: Farah is likely to succeed in private nuisance against Dev. She has title to sue as the owner of the house, unlike her son, a mere guest with no proprietary interest, who could not sue in his own right after Hunter v Canary Wharf. The substantial-and-unreasonable element is assessed objectively, by reference to an ordinary person in Farah’s position, not her own heightened sensitivity (Munro v Southern Dairies) — but nightly, loud engine noise until midnight for two years would likely be substantial and unreasonable even for an ordinary person, given its frequency, duration and timing. Dev, as the person carrying on the noisy activity on his own land, has created the state of affairs giving rise to the harm, satisfying the third element. Farah should therefore succeed, though she should frame her claim around the objective unreasonableness of nightly midnight noise rather than her own particular sensitivity, which the law disregards.
    rubric:
      - id: r1
        criterion: Identifies Farah’s title to sue as owner, and that the son could not sue in his own right
        marks: 1
        top-band: Explicitly contrasts Farah’s ownership with the son’s status as a mere licensee/guest.
        margin-note: Correctly applies title to sue to both people.
        authorities: []
      - id: r2
        criterion: Applies the objective "ordinary person" test rather than Farah’s personal sensitivity
        marks: 1
        top-band: Expressly notes Farah’s sensitivity is disregarded by the objective test.
        margin-note: Key discriminator between subjective and objective standards.
        authorities: []
      - id: r3
        criterion: Weighs frequency/duration/time as the balancing factors
        marks: 1
        top-band: Applies nightly/two-years/midnight facts to the balancing factors listed in the lecture.
        margin-note: Good factual application.
        authorities: []
      - id: r4
        criterion: Identifies Dev as having created the nuisance
        marks: 1
        top-band: Names the correct limb (created, not merely authorised or continued).
        margin-note: Correct limb identified.
        authorities: []
      - id: r5
        criterion: Reaches a supported conclusion
        marks: 1
        top-band: Conclusion follows logically from the elements applied.
        margin-note: Clear, reasoned conclusion.
        authorities: []
