  - key: q085
    type: mcq
    concept: public-nuisance
    difficulty: 2
    stem: What did the court in Walsh v Ervin hold about "special or particular damage"?
    options:
      - text: It is not limited to actual pecuniary loss; substantial delay and inconvenience, dissimilar to that suffered by the public generally, can suffice
        correct: true
        why: Correct — this is the ratio of the case on what counts as special damage for a private plaintiff.
      - text: It must always take the form of a direct financial loss
        correct: false
        why: Incorrect — the court expressly rejected limiting special damage to pecuniary loss.
      - text: It can never be established by a private individual, only by government authorities
        correct: false
        why: Incorrect — the plaintiff, a private individual, succeeded in establishing it.
      - text: It requires proof that the defendant acted maliciously
