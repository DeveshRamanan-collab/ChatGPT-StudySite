  - key: q081
    type: mcq
    concept: public-nuisance
    difficulty: 1
    stem: "Public nuisance is best defined as:"
    options:
      - text: An unlawful act or omission which endangers the lives, safety, property or comfort of the public, or obstructs the enjoyment of a right common to all
        correct: true
        why: Correct — this matches the lecture’s definition of public nuisance as an unlawful act endangering the public.
      - text: Any act that annoys a neighbour
        correct: false
        why: Too broad and imprecise compared to the defined test, which requires danger to public safety, not mere annoyance.
      - text: An unreasonable interference with one individual’s use and enjoyment of their own land
        correct: false
        why: That describes private nuisance, which protects an individual’s land, not public nuisance, which protects the public.
      - text: Any crime committed on a public road
        correct: false
        why: Too narrow and inaccurate — public nuisance is defined by its effect on public rights, not by location alone.
