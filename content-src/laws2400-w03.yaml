  - key: q060
    type: short
    concept: implied-licence
    difficulty: 2
    prompt: A council parking officer walks up Chen’s unlocked driveway (no sign) intending only to place an infringement notice on Chen’s car, which is parked in the driveway. Chen, who dislikes the council, argues the officer trespassed. Advise the officer.
    model: The officer is unlikely to be liable in trespass to land. The implied licence recognised in Halliday v Nevill allows any member of the public, including officials, to go up an unobstructed, unlocked driveway with no prohibiting sign, for the purpose of lawful communication with, or delivery to, an occupier. Placing an infringement notice on a car parked in the driveway is analogous to a delivery or communication directed at the occupier, and nothing on the facts suggests the officer’s sole purpose was outside that licence, that the licence had been revoked and the officer remained, or that the officer acted inconsistently with the licence (eg by entering the house). Chen’s personal dislike of the council is irrelevant; the licence is an objective one implied by law from the state of the driveway (unlocked, unobstructed, unmarked), not from the occupier’s subjective attitude. The officer has an implied licence and is not a trespasser.
    rubric:
      - id: r1
        criterion: Identifies Halliday v Nevill’s test (unlocked/unobstructed driveway, no sign) as the starting point
        marks: 1
        top-band: States the test before applying it.
        margin-note: Correct starting authority.
        authorities: []
      - id: r2
        criterion: Characterises placing the notice as within "lawful communication/delivery"
        marks: 1
        top-band: Draws the analogy to delivery/communication explicitly.
        margin-note: Good application, not just assertion.
        authorities: []
      - id: r3
        criterion: Addresses whether the licence was negated, revoked or exceeded, and concludes it was not
        marks: 1
        top-band: Works through all three ways the licence could be lost and rules each out.
        margin-note: Thorough — considers the alternatives.
        authorities: []
      - id: r4
        criterion: Notes the test is objective, not dependent on the occupier’s subjective attitude
        marks: 1
        top-band: Explicitly dismisses Chen’s personal dislike as irrelevant.
        margin-note: Nice precision on the objective nature of the test.
        authorities: []
