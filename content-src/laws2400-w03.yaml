        why: "Tempting because courts do respond to deliberate or high-handed conduct, but that supports aggravated damages added on top; compensatory damages only restore the plaintiff's position."
      - text: Provide a token recognition where no loss occurred
        correct: false
        why: "Wrong — token damages without loss are nominal damages, available because trespass is actionable per se; compensatory damages measure actual loss, eg diminution in value."
  - key: q073
    type: mcq
    concept: remedies-trespass-to-land
    difficulty: 2
    stem: Which label correctly describes damages awarded purely to recognise that a legal right was infringed, even though no actual loss was suffered?
    options:
      - text: Nominal damages
        correct: true
        why: Correct — nominal damages serve exactly this function, recognising the wrong even without proven loss.
      - text: Compensatory damages
        correct: false
        why: Compensatory damages respond to actual loss suffered, not a mere infringement without loss.
      - text: Aggravated damages
        correct: false
        why: Aggravated damages respond to the manner of the wrongdoing, not the mere fact of infringement.
      - text: Exemplary damages
        correct: false
        why: Exemplary damages punish particularly bad conduct, not merely mark an infringement.
    variant-of: q072
  - key: q074
    type: mcq
    concept: remedies-trespass-to-land
    difficulty: 2
    stem: Why might a plaintiff prefer an injunction over damages for an ongoing trespass, such as a neighbour’s fence that continually encroaches?
    options:
      - text: Damages compensate for past loss, but an injunction can stop the interference continuing into the future
        correct: true
        why: Correct — this is the key advantage of an injunction for ongoing conduct.
      - text: Injunctions are always cheaper to obtain than damages
        correct: false
        why: No such general rule about cost is stated — either remedy may be more or less costly depending on the facts.
      - text: Only injunctions are available for trespass to land, not damages, whatever the particular facts of the case happen to be
        correct: false
        why: Incorrect — both an injunction and damages are available remedies for trespass to land.
      - text: An injunction guarantees a larger monetary payment than damages
        correct: false
        why: An injunction is not a monetary payment at all — it is a court order requiring or restraining conduct.
  - key: q075
    type: mcq
    concept: remedies-trespass-to-land
    difficulty: 3
    stem: A trespasser refuses to leave land after being asked. Applying the self-help remedy, what is the key limitation?
    options:
      - text: Only reasonable force may be used to remove the trespasser
        correct: true
        why: Correct — this is the express limitation on self-help stated in the lecture materials.
      - text: Any force necessary, however extreme, is permitted
        correct: false
        why: Incorrect — only reasonable force is permitted, not any force however extreme.
      - text: Self-help can only be used with police present
        correct: false
        why: No such requirement is described — police presence is not a precondition for lawful self-help.
      - text: Self-help is unavailable unless a court has first granted permission
        correct: false
        why: Self-help is, by definition, an out-of-court remedy that does not require prior court permission.
  - key: q076
    type: mcq
    concept: remedies-trespass-to-land
    difficulty: 2
    stem: Which of these is the best example of a mandatory injunction in the trespass to land context?
    options:
      - text: An order requiring the defendant to remove scaffolding that encroaches onto the plaintiff’s airspace
        correct: true
        why: Correct — an order requiring positive action is a mandatory injunction.
      - text: An order simply forbidding the defendant from entering the land again, irrespective of any other detail in the scenario
        correct: false
        why: That is a prohibitory injunction, which simply forbids conduct, not a mandatory one requiring positive action.
      - text: An award of money to compensate for the encroachment
        correct: false
        why: That is damages, a monetary remedy, not an injunction at all, which is a court order.
      - text: An order sending the defendant to prison
        correct: false
        why: Imprisonment is a criminal sanction, not a remedy available in this civil tort claim.
  - key: q077
    type: mcq
    concept: remedies-trespass-to-land
    difficulty: 4
    stem: A trespasser dumps rubble on P’s vacant block, permanently altering its surface. Removing the rubble and restoring the surface would cost more than the resulting drop in the block’s market value. Which measure of damages should the court likely apply?
    options:
      - text: Possibly the diminution in value, unless reinstatement is a suitable outcome on the facts — the higher figure is not chosen automatically
        correct: true
        why: Correct — reinstatement is only ordered in suitable cases, not simply because it is more expensive.
      - text: Always the reinstatement cost, because it is higher
        correct: false
        why: Incorrect — reinstatement is only awarded where suitable, not merely because it costs more.
      - text: Always the diminution in value, because reinstatement can never be awarded
        correct: false
        why: Incorrect — reinstatement can be ordered in suitable cases, even where it costs more than diminution in value.
      - text: The trespasser chooses which measure to pay
        correct: false
        why: The choice of measure is for the court, not the defendant, to decide based on the circumstances.
    variant-of: q065
  - key: q078
    type: truefalse
    concept: remedies-trespass-to-land
    difficulty: 2
    set: quickfire
    statement: Trespass to land damages are always limited to the diminution in the value of the property.
    answer: false
    why: In suitable cases the higher cost of reinstatement may be ordered instead.
  - key: q079
    type: truefalse
    concept: remedies-trespass-to-land
    difficulty: 1
    set: quickfire
    statement: Self-help for trespass to land permits the use of any force needed to remove a trespasser.
    answer: false
    why: Only reasonable force may be used to remove a trespasser, not whatever force the occupier chooses.
  - key: q080
    type: truefalse
    concept: remedies-trespass-to-land
    difficulty: 2
    set: quickfire
    statement: A plaintiff can recover consequential damage, such as a psychiatric injury, flowing from a trespass to land.
