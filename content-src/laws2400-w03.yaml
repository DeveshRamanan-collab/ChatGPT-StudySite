      - trespass-to-land-elements
    contrasts-with:
      - private-nuisance-elements
    cases:
      - barker-v-the-queen
      - roy-v-oneill
    authorities: []
    verify: false
    body: |
      The textbook flowchart (Tort Law Principles 3e, p 142) defines trespass to land as the direct, intentional or
      negligent invasion or interference with land in the possession of the plaintiff without lawful authority,
      justification or excuse (*Barker v The Queen*; *Roy v O'Neill*). Its general principles run as gates, in order:

      1. **Exclusive possession** ("title to sue") at the time of the interference — by title, by consent under a lease, or
         by adverse possession. Licences typically do not confer it; an owner whose tenant stays on after the lease ends
         must retake possession to sue.
      2. **Of land** — including airspace, fixtures and subsoil.
      3. **Direct invasion or interference** — including exceeding the terms of a licence, or going beyond its expiry or
         revocation. Indirect interference may be another tort, such as private nuisance.
      4. **Fault** — the act must be intentional or negligent. The defendant need not intend to trespass; mistake is
         generally no defence; involuntary conduct, utterly without fault, is not actionable.
      5. **Without lawful authority, justification or excuse.**

      No damage need be proved: trespass is actionable per se. Substantive damages cover actual losses that are the natural
      and probable consequences of the trespass; alternatively, damages may be assessed on the "user fee" principle. An
      injunction may, in the court's discretion, restrain a continuing or threatened trespass where damages would be
      inadequate.

      Exam use: walk the five gates in order and stop at the first the facts fail; an indirect interference points to
      private nuisance.

cases:
  - slug: bernstein-v-skyviews
    name: Bernstein v Skyviews & General Ltd
    citation: "[1977] 2 All ER 902"
    aglc: "Bernstein v Skyviews & General Ltd [1977] 2 All ER 902"
    facts: |-
      Skyviews' aircraft flew several hundred feet above Lord Bernstein's estate, took a single aerial
      photograph of his house without permission, and offered it to him for sale. Bernstein sued in trespass,
      asserting ownership of the airspace above his land on the *usque ad coelum* maxim, and an invasion of
      his privacy.
    issue: Whether flying an aircraft at a height that does not affect the use of the land beneath it is a trespass to the airspace above that land.
    held: There was no trespass.
    ratio: A landowner's rights in the airspace above land extend only to such height as is necessary for the ordinary use and enjoyment of the land and structures on it; above that height the owner has no greater rights in the airspace than any other member of the public.
    significance: Rejects an unlimited application of the usque ad coelum maxim and fixes the modern test for how high "land" extends for the purposes of trespass.
    why-here: Gives the height test that Kelsen and LJP Investments then apply at the low end of the airspace.
    verify: false
  - slug: kelsen-v-imperial-tobacco-co
    name: Kelsen v Imperial Tobacco Co
    citation: "[1957] 2 All ER 343"
    aglc: "Kelsen v Imperial Tobacco Co [1957] 2 All ER 343"
    facts: The defendant's advertising sign projected about 24 cm into the airspace above the plaintiff's shop.
    issue: Whether an object intruding only a short distance into the airspace above land, at a height relevant to the ordinary use of the land, is a trespass.
    held: The encroachment constituted trespass to land.
    ratio: Trespass to land can be committed by an object intruding into the airspace at a height ordinarily used and enjoyed by the occupier, even where the intrusion is small.
    significance: The low-airspace counterpoint to Bernstein v Skyviews — encroachment close to the land is trespass even though high-altitude overflight is not.
    why-here: Used with LJP Investments as an example of trespass by low-level airspace encroachment.
    verify: true
  - slug: ljp-investments-v-howard-chia-investments
    name: LJP Investments v Howard Chia Investments
    citation: "(1989) 24 NSWLR 490"
    aglc: "LJP Investments v Howard Chia Investments (1989) 24 NSWLR 490"
    facts: Scaffolding erected by the defendant encroached into the airspace above the plaintiff's land.
    issue: Whether encroaching scaffolding over neighbouring land amounts to trespass to land.
    held: The encroaching scaffolding constituted a trespass.
    ratio: A structure such as scaffolding that projects into the airspace above another's land at a height relevant to its ordinary use is a trespass.
    significance: The Australian (NSWLR) example of trespass by structural encroachment, alongside the UK's Kelsen.
    why-here: Local authority for trespass by encroaching structures such as scaffolding or cranes.
    verify: true
  - slug: newington-v-windeyer
    name: Newington v Windeyer
    citation: "(1985) 3 NSWLR 555"
    aglc: "Newington v Windeyer (1985) 3 NSWLR 555"
    facts: The plaintiff occupied a vacant area of land ("The Grove") adjoining her own property for 50 years, without ever being its registered owner.
    issue: Whether a person who is not the registered owner of land can maintain an action in trespass against someone else trying to use that land.
    held: The plaintiff could maintain the action in trespass.
    ratio: Exclusive possession, not ownership, founds an action in trespass to land; it can be proved by conduct showing factual control and an intention to exclude others, such as hosting parties, maintaining the garden and trees, and paying rates.
    significance: Leading Australian authority that a long-term occupier without title can sue in trespass.
    why-here: Apply the factual-control-plus-intention-to-exclude test to answer "who can sue" problems.
    verify: false
  - slug: halliday-v-nevill
    name: Halliday v Nevill
    citation: "(1984) 155 CLR 1"
    aglc: "Halliday v Nevill (1984) 155 CLR 1"
    facts: A police officer entered the open driveway of a house in order to arrest a disqualified driver who had driven onto the property.
    issue: Whether entering an unobstructed driveway without express permission, to communicate with or apprehend someone there, is a trespass.
    held: The officer had an implied licence to enter the driveway; there was no trespass.
    ratio: Where access to a dwelling by path or driveway is unobstructed, unlocked and not marked by a prohibiting sign, the law implies a licence for any member of the public, including police, to go upon it for the purpose of lawful communication with an occupier.
    significance: The leading Australian statement of the implied licence to enter, applied and elaborated in Roy v O'Neill.
    why-here: The starting test for every implied-licence problem — establish the licence exists before asking whether the entrant went beyond it.
    verify: false
  - slug: munnings-v-barrett
    name: Munnings v Barrett
    citation: "(1987) 5 MVR 403"
    aglc: "Munnings v Barrett (1987) 5 MVR 403"
    facts: A police officer went onto a driveway intending to administer a breath test to the occupier.
    issue: Whether the implied licence to approach a house for lawful communication extends to entry for the purpose of administering a breath test.
    held: The implied licence did not extend to that purpose.
    ratio: The implied licence to enter a driveway is confined to lawful communication with the occupier and does not cover entry for the purpose of administering a breath test.
    significance: Marks a limit on Halliday v Nevill — not every police purpose falls within the implied licence.
    why-here: Contrast with Halliday v Nevill and Roy v O'Neill on which police purposes are, and are not, within the implied licence.
    verify: true
  - slug: plenty-v-dillon
    name: Plenty v Dillon
    citation: "(1991) 171 CLR 635"
    aglc: "Plenty v Dillon (1991) 171 CLR 635"
    facts: A process server entered the plaintiff's land for the purpose of serving a summons on him.
    issue: Whether the implied licence to approach a dwelling extends to entry for the purpose of serving a summons.
    held: The implied licence did not extend to service of a summons; the entry was a trespass.
    ratio: The implied licence to enter is confined to lawful communication with the occupier and does not authorise entry for purposes the occupier has not consented to, such as serving legal process.
    significance: High Court authority that a person exercising an otherwise lawful function can still trespass by exceeding the implied licence.
    why-here: Shows the implied licence is narrow and purpose-specific — exceeding it, even for a lawful function, is trespass.
    verify: true
  - slug: roy-v-oneill
    name: Roy v O'Neill
    citation: "(2020) 273 CLR 91; [2020] HCA 45"
    aglc: "Roy v O'Neill (2020) 273 CLR 91; [2020] HCA 45"
    facts: |-
      A police officer attended a unit to check compliance with a domestic violence order protecting one
      occupant. The officer entered the curtilage of the premises, approached the front door, and while there
      required the other occupant, Ms Roy, to provide a breath sample; she returned a positive reading and was
      charged. Ms Roy argued the officer's purpose was outside any implied licence, and that even if a licence
      existed it ended once he asked for the breath sample.
    issue: Whether the officer's entry onto the curtilage, and his conduct there, fell outside any implied licence to enter, making him a trespasser.
    held: |-
      The appeal was dismissed; the officer was not a trespasser. The implied licence to approach the front
      door for lawful communication included checking on the wellbeing of the protected occupant, and was not
      negated merely because the officer also had a further purpose (checking DVO compliance) in mind.
    ratio: A person who enters for a purpose within an implied licence does not become a trespasser merely because they also have another, alien purpose in mind; an entrant becomes a trespasser only where their sole purpose is outside the licence, the licence has been revoked and they remain, or they act in a manner inconsistent with the licence.
    significance: Confirms and extends Halliday v Nevill — a mixed purpose does not defeat the implied licence so long as one purpose is within it.
    why-here: The central case for implied-licence problems involving an entrant (often police) with more than one purpose.
    verify: true
  - slug: lincoln-hunt-aust-v-willesee
    name: Lincoln Hunt Aust v Willesee
    citation: "(1986) 4 NSWLR 457"
    aglc: "Lincoln Hunt Aust v Willesee (1986) 4 NSWLR 457"
    facts: Television reporters and a camera crew entered the plaintiff's commercial premises to film, rather than to seek information or conduct business with the occupier as a genuine client.
    issue: Whether entry onto commercial premises open to the public is within any implied licence when the entrant's purpose is filming rather than bona fide business.
    held: The entry was a trespass.
    ratio: The implied licence to enter commercial premises open to the public extends only to bona fide business with, or genuine use as a client or customer of, the occupier; entry for an unrelated purpose, such as filming, exceeds the licence.
    significance: Applies the implied-licence concept to commercial rather than residential premises.
    why-here: Use for problems about media or filming crews entering business premises — the same "purpose within the licence" logic as the residential cases.
    verify: true
  - slug: barker-v-the-queen
    name: Barker v The Queen
    citation: "(1983) 153 CLR 338"
    aglc: "Barker v The Queen (1983) 153 CLR 338"
    facts: The defendant was authorised by the occupier to keep an eye on the house while the occupier was away, and was told where the spare key was kept; he later entered the house to steal property.
    issue: Whether a person with express authority to enter for one purpose is a trespasser when they enter for a different, unauthorised purpose instead.
    held: The defendant was a trespasser when he entered to steal, despite having been given the key and authority to enter for the purpose of keeping an eye on the house.
    ratio: Authority or a licence to enter for one purpose does not extend to entry for a different, unauthorised purpose; entering outside the scope of the licence is trespass even where the entrant otherwise has permission and the means of access.
    significance: Confirms that a licence is confined to its purpose, even where the entrant has been given a key and express permission.
    why-here: Shows that even a keyholder with express permission becomes a trespasser once acting outside the purpose for which the key was given.
    verify: true
  - slug: walsh-v-ervin
    name: Walsh v Ervin
    citation: "[1952] VLR 361"
    aglc: "Walsh v Ervin [1952] VLR 361"
    facts: The defendant, a farmer, ploughed and planted crops on a public highway and erected gates that prevented the plaintiff entering his own land by motor vehicle.
    issue: What special or particular damage a private individual must show to have title to sue in public nuisance for obstruction of a highway.
    held: The plaintiff could maintain an action for public nuisance.
    ratio: Special or particular damage for public nuisance is not limited to actual pecuniary loss; delay and inconvenience of a substantial character, dissimilar to that experienced by the rest of the public, is sufficient.
    significance: Leading authority on the "special damage" (title to sue) element of public nuisance.
    why-here: Apply when a problem asks whether a private plaintiff can sue over an obstructed highway or similar interference with a public right.
    verify: false
  - slug: oldham-v-lawson-no-1
    name: Oldham v Lawson (No 1)
    citation: "[1976] VR 654"
    aglc: "Oldham v Lawson (No 1) [1976] VR 654"
    facts: A husband and wife sued their neighbours for private nuisance caused by persistent noise. The wife held legal rights in the land; the husband occupied it only as her licensee.
    issue: Whether a person without a proprietary interest in land, such as a spouse who is a mere licensee, has title to sue for private nuisance.
    held: The wife, having a proprietary interest, could sue; the husband, being merely a licensee, had no title to sue.
    ratio: Only a person with a proprietary interest in land — an owner or a tenant in actual possession — has title to sue in private nuisance; a mere licensee does not, even if they live in the property.
    significance: States the traditional position on title to sue in private nuisance, later tested in Khorasandjian v Bush and settled by Hunter v Canary Wharf.
    why-here: The default rule for "who can sue" in private nuisance.
    verify: false
  - slug: khorasandjian-v-bush
    name: Khorasandjian v Bush
    citation: "(1993)"
    aglc: "Khorasandjian v Bush (1993)"
    facts: A daughter living in her mother's home, as a licensee without a proprietary interest, was harassed by persistent prank and nuisance telephone calls from the defendant.
    issue: Whether a licensee without a proprietary interest in land has title to sue in private nuisance.
    held: The UK Court of Appeal held that the licensee daughter had title to sue.
    ratio: A person in actual occupation could have title to sue in private nuisance even without a proprietary interest in the land.
    significance: A departure from the traditional proprietary-interest requirement, followed in Australia in Deasy Investments before being overruled by Hunter v Canary Wharf.
    why-here: Use to show the (now-rejected) alternative position on title to sue before Hunter restored the traditional rule.
    verify: true
  - slug: deasy-investments-v-monreast
    name: Deasy Investments Pty Ltd v Monreast
    citation: "(1996)"
    aglc: "Deasy Investments Pty Ltd v Monreast (1996)"
    facts: A Queensland court considered whether a person without a proprietary interest in land had title to sue for private nuisance, following the approach taken in Khorasandjian v Bush.
    issue: Whether a person without a proprietary interest has title to sue for private nuisance.
    held: The Queensland decision followed Khorasandjian v Bush — a licensee had title to sue.
    ratio: Actual occupation without a proprietary interest could found title to sue in private nuisance, following the English position in Bush.
    significance: Shows Australian courts were, for a time, inconsistent with the traditional proprietary-interest rule before Hunter v Canary Wharf was decided.
    why-here: Evidence that "who can sue" in private nuisance was unsettled in Australia before Hunter.
    verify: true
  - slug: hunter-v-canary-wharf
    name: Hunter v Canary Wharf Ltd
    citation: "(1997)"
    aglc: "Hunter v Canary Wharf Ltd (1997)"
    facts: Residents without a proprietary interest in the land they occupied argued they had title to sue in private nuisance, relying on Khorasandjian v Bush.
    issue: Whether title to sue in private nuisance requires a proprietary interest in the land, or whether mere occupation suffices as Khorasandjian v Bush had held.
    held: The House of Lords overruled Khorasandjian v Bush.
    ratio: Only a person with a proprietary interest in the land — an owner or a tenant in possession — has title to sue in private nuisance; mere occupation as a licensee is not enough.
    significance: Restored the traditional (Oldham v Lawson) position on title to sue, resolving the inconsistency created by Bush and Deasy Investments.
    why-here: The current test for "who can sue" in private nuisance — prefer this over Bush/Deasy.
    verify: true
  - slug: munro-v-southern-dairies
    name: Munro v Southern Dairies
    citation: "[1955] VLR 332"
    aglc: "Munro v Southern Dairies [1955] VLR 332"
    facts: The plaintiff alleged nuisance from noise, smell and flies caused by the defendant's keeping of horses on its premises to run a milk distribution business.
    issue: What standard is used to assess whether interference with the plaintiff's comfort is substantial and unreasonable.
    held: Considering all the factors, the keeping of horses caused a nuisance to the plaintiff.
    ratio: The standard of comfort for private nuisance is assessed objectively, by reference to the standards of an ordinary person in the claimant's position, not a person of "abnormal sensitiveness".
    significance: Establishes the objective "ordinary person" test for the substantial-and-unreasonable element of private nuisance.
    why-here: Apply this test whenever asked whether an interference (smell, noise, etc) is substantial and unreasonable.
    verify: false
  - slug: victoria-park-racing-and-recreation-grounds-co-v-taylor
    name: Victoria Park Racing and Recreation Grounds Co Ltd v Taylor
    citation: "(1937) 58 CLR 479"
    aglc: "Victoria Park Racing and Recreation Grounds Co Ltd v Taylor (1937) 58 CLR 479"
    facts: |-
      The plaintiff operated a racecourse enclosed by a fence to keep race information private. The defendant
      broadcaster erected a platform on neighbouring land and broadcast live descriptions of the races, causing
      paying patrons to stay away and listen instead, and reducing the plaintiff's takings.
    issue: Whether broadcasting a description of events visible from neighbouring land, causing loss of custom, is an actionable private nuisance.
    held: |-
      By majority (Latham CJ, Dixon and McTiernan JJ; Rich and Evatt JJ dissenting), there was no actionable
      nuisance.
    ratio: Private nuisance protects an occupier's use and enjoyment of rights incident to occupation of land; it does not protect against loss of profit caused by lawful competition, and the natural rights of an occupier do not include freedom from being overlooked.
    significance: Leading Australian authority that overlooking, or losing customers to lawful competition, without more, is not private nuisance.
    why-here: Use to reject a nuisance claim based only on being overlooked or on losing customers to lawful competition, while flagging that motive or hostility could change the analysis.
    verify: false
  - slug: hollywood-silver-fox-farm-v-emmett
    name: Hollywood Silver Fox Farm v Emmett
    citation: "[1936] 2 KB 468"
    aglc: "Hollywood Silver Fox Farm v Emmett [1936] 2 KB 468"
    facts: The defendant deliberately fired guns on his own land in order to disturb the plaintiff's breeding foxes on neighbouring land.
    issue: Whether the defendant's motive is relevant to whether an interference amounts to a substantial and unreasonable nuisance.
    held: The deliberate firing of guns to disturb the plaintiff's foxes was an actionable nuisance.
    ratio: The motive or malice of the defendant is relevant to whether an interference with the plaintiff's use and enjoyment of land is substantial and unreasonable.
    significance: Authority that malice can turn otherwise-lawful conduct on one's own land into an actionable private nuisance.
    why-here: Use where facts show the defendant acted out of spite or malice — motive strengthens a nuisance claim.
    verify: true
questions:
  - key: q001
    type: mcq
    concept: trespass-to-land-elements
    difficulty: 1
    stem: What is the general definition of trespass to land?
    options:
      - text: Direct interference with land in the possession of the plaintiff
        correct: true
        why: Correct — this is the definition given in lecture — a direct interference with land while the plaintiff is in possession.
      - text: Unreasonable interference with the plaintiff’s use or enjoyment of land
        correct: false
        why: This is the definition of nuisance, not trespass to land, which does not require unreasonable interference.
      - text: Any physical entry onto land, regardless of who is in possession
        correct: false
        why: Tempting, but the plaintiff must be the one in possession — entry alone is not enough to identify the tort.
      - text: Interference with land that causes measurable damage
        correct: false
        why: Trespass to land is actionable per se; damage is not required.
    set: pretest
  - key: q002
    type: mcq
    concept: trespass-to-land-elements
    difficulty: 2
    stem: Which of the following best distinguishes trespass to land from nuisance?
    options:
      - text: Trespass requires direct interference; nuisance is interference with use or enjoyment and need not be direct
        correct: true
        why: Correct — this is exactly how the lecture draws the line between the two torts.
      - text: Trespass requires proof of damage while nuisance does not
        correct: false
        why: Reversed — trespass is actionable per se (no damage needed); nuisance generally requires substantial and unreasonable interference to be shown on the facts.
      - text: Nuisance is always a crime while trespass is always a tort
        correct: false
        why: Only public nuisance is a crime; private nuisance is a tort only, so this overgeneralises.
      - text: Trespass can only be committed by entering land, while nuisance can only be committed by smell or noise
        correct: false
        why: Too narrow on both sides — trespass covers throwing objects or encroaching structures too, and nuisance covers far more than smell or noise.
    variant-of: q001
  - key: q003
    type: mcq
    concept: trespass-to-land-elements
    difficulty: 1
    stem: Which of the following is NOT required to establish trespass to land?
    options:
      - text: A direct and positive act interfering with the land
        correct: false
        why: This is one of the four required elements — a direct, positive act interfering with the land is required, not the missing one.
      - text: An intentional or negligent act
        correct: false
        why: This is one of the four required elements — the act must be intentional or negligent, so this is required, not the missing one.
      - text: The plaintiff being in possession of the land
        correct: false
        why: This is one of the four required elements — the plaintiff must be in possession of the land, so this is required, not the missing one.
      - text: Proof that the plaintiff suffered financial loss
        correct: true
        why: Correct — trespass to land is actionable per se; the plaintiff need not prove any loss or damage.
  - key: q004
    type: mcq
    concept: trespass-to-land-elements
    difficulty: 2
    stem: A person picks up a rock and throws it over the fence onto a neighbour’s land without ever entering it. Is this trespass to land?
    options:
      - text: Yes — throwing an object onto land is itself trespassory conduct, even without personal entry
        correct: true
        why: Correct — the lecture lists throwing an object onto land as one form of trespassory conduct.
      - text: No, because the defendant never physically entered the land himself, only the thrown rock did
        correct: false
        why: Tempting, but personal entry is not required — throwing an object onto the land suffices.
      - text: No, because trespass requires proof of damage
        correct: false
        why: Trespass to land is actionable per se; no damage need be shown.
      - text: Yes, but only if the rock causes damage
        correct: false
        why: No damage is required for liability, only for the level of compensatory damages that might follow.
  - key: q005
    type: mcq
    concept: trespass-to-land-elements
    difficulty: 1
    stem: What does it mean to say trespass to land is "actionable per se"?
    options:
      - text: The plaintiff need not prove any damage or loss
        correct: true
        why: Correct — this is what "actionable per se" means — liability does not depend on proving any damage or loss.
      - text: The claim can only be brought by the landowner personally
        correct: false
        why: It relates to possession, not ownership, and has nothing to do with proof of loss.
      - text: The tort is only actionable where the defendant acted with malice
        correct: false
        why: Malice is not required at all for basic liability in trespass to land.
      - text: The defendant bears no onus at all in defending the claim
        correct: false
        why: Incorrect — the defendant in fact bears the onus of disproving fault outside highway cases.
  - key: q006
    type: mcq
    concept: trespass-to-land-elements
    difficulty: 2
    stem: Who bears the onus of proving fault in a trespass to land claim, outside highway cases?
    options:
      - text: The defendant bears the onus of disproving fault
        correct: true
        why: Correct — the plaintiff is not required to prove fault; the onus is on the defendant to disprove it.
      - text: The plaintiff must prove the defendant was negligent or intended to trespass
        correct: false
        why: This reverses the actual onus described in the lecture — it is the defendant, not the plaintiff, who must disprove fault.
      - text: Neither party bears an onus; fault is irrelevant
        correct: false
        why: Fault is relevant (the act must be intentional or negligent) — it is simply the defendant who must disprove it.
      - text: The onus depends on whether the trespass caused damage
        correct: false
        why: The onus rule does not depend on whether damage occurred, since trespass is actionable per se.
  - key: q007
    type: mcq
    concept: trespass-to-land-elements
    difficulty: 3
    stem: D genuinely and reasonably believes a strip of land is his own and builds a fence on it, which is in fact on P’s land. Is D liable in trespass?
    options:
      - text: Yes — mistake is no defence as long as building the fence was itself an intentional trespassory act
        correct: true
        why: Correct — mistake is no defence, provided the act itself was done intentionally or negligently.
      - text: No, because D’s mistake was honest and reasonable
        correct: false
        why: Tempting, but the lecture states mistake is no defence regardless of how reasonable it was.
      - text: No, because D lacked any intention to trespass on P’s land specifically
        correct: false
        why: The intention required relates to doing the act (building the fence), not to knowingly trespassing on that particular plaintiff’s land.
      - text: Yes, but only if D’s mistake was unreasonable
        correct: false
        why: The reasonableness of the mistake is irrelevant — mistake is no defence either way.
  - key: q008
    type: mcq
    concept: trespass-to-land-elements
    difficulty: 2
    stem: D drives his car through a boundary he sincerely, but mistakenly, believes is inside his own property, parking on P’s land. Can D rely on this mistaken belief as a defence?
    options:
      - text: No — mistake as to ownership is no defence provided the act of driving onto and parking on the land was intentional
        correct: true
        why: Correct — this mirrors the rule that mistake is no defence to an otherwise intentional trespassory act.
      - text: Yes, because D honestly believed he was on his own land
        correct: false
        why: An honest belief does not excuse an intentional trespassory act.
      - text: Yes, because D did not intend to trespass on anyone else’s land
        correct: false
        why: The relevant intention is to do the act (drive and park there), not to knowingly trespass on someone else’s land.
      - text: No, but only because D used a vehicle rather than entering on foot to cross onto the neighbouring property, however briefly he stayed there
        correct: false
        why: The method of entry is irrelevant; the mistake-is-no-defence rule applies regardless.
    variant-of: q007
  - key: q009
    type: mcq
    concept: trespass-to-land-elements
    difficulty: 1
    stem: Which of the following is an example of trespass to land given in the lecture?
    options:
      - text: Parking a car on another person’s land
        correct: true
        why: Correct — this is one of the real-life examples given in the lecture of trespassory conduct on land.
      - text: Publishing a defamatory statement about a neighbour
        correct: false
        why: This is defamation, a different tort entirely, not trespass to land.
      - text: Failing to maintain a shared boundary fence
        correct: false
        why: This is not trespass to land — at most it might raise other issues, not covered here.
      - text: Refusing to return a borrowed lawnmower
        correct: false
        why: This concerns interference with goods, not land, and is not trespass to land.
  - key: q010
    type: mcq
    concept: trespass-to-land-elements
    difficulty: 1
    stem: Gatecrashing a private party is used in the lecture as an example of what?
    options:
      - text: Trespass to land
        correct: true
        why: Correct — gatecrashing a private party is one of the listed examples of trespass to land.
      - text: Private nuisance
        correct: false
        why: Nuisance concerns interference with use and enjoyment of land, not a single act of unauthorised entry.
      - text: Assault
        correct: false
        why: Assault concerns apprehension of imminent contact, unrelated to gatecrashing a party.
      - text: False imprisonment
        correct: false
        why: False imprisonment concerns total restraint of a person’s liberty, unrelated to gatecrashing.
  - key: q011
    type: mcq
    concept: trespass-to-land-elements
    difficulty: 3
    stem: Which statement about the "without consent" element of trespass to land is correct?
    options:
      - text: There must be no express or implied consent to the entry
        correct: true
        why: Correct — either form of consent, if present, will defeat the trespass claim.
      - text: Consent is irrelevant once a direct act and possession are shown
        correct: false
        why: Consent remains a live issue; the four elements include the absence of consent.
      - text: Only express consent can defeat a trespass claim; implied consent does not count
        correct: false
        why: Implied consent (eg an implied licence) can also defeat a trespass claim.
      - text: Consent is presumed unless the defendant proves otherwise
        correct: false
        why: This reverses the position; consent is not presumed, and the defendant must show it was actually given.
  - key: q012
    type: mcq
    concept: trespass-to-land-elements
    difficulty: 2
    stem: D remains on P’s land after P withdraws permission and asks D to leave. What best describes D’s position?
    options:
      - text: D becomes a trespasser by remaining after permission is withdrawn
        correct: true
        why: Correct — remaining after permission is withdrawn is listed as a form of trespassory conduct.
      - text: D remains lawfully until physically removed
        correct: false
        why: Remaining after withdrawal of permission is itself trespassory conduct, before any removal occurs.
      - text: D is only a trespasser if D refuses to leave for more than 24 hours
        correct: false
        why: No such time period is required — trespass arises as soon as D remains after permission is withdrawn.
      - text: D cannot trespass because D originally entered with permission
        correct: false
        why: Permission can be withdrawn; once withdrawn, remaining is trespassory.
  - key: q013
    type: mcq
    concept: trespass-to-land-elements
    difficulty: 2
    stem: Which pair of features best distinguishes trespass to land from public nuisance?
    options:
      - text: Trespass protects possession against direct interference and needs no damage; public nuisance protects a right common to the public and needs special damage for a private plaintiff
        correct: true
        why: Correct — this captures the key structural differences between the two torts.
      - text: Trespass is a crime while public nuisance is only ever a tort
        correct: false
        why: Reversed — public nuisance is itself a common law crime; trespass to land is not.
      - text: Trespass requires proof of malice while public nuisance does not
        correct: false
        why: Neither tort requires malice as a basic element, though malice can be relevant to some specific defences.
      - text: Trespass can only be committed on a highway while public nuisance can only be committed on a public road or highway
        correct: false
        why: Reversed and incorrect — public nuisance commonly involves highways, while trespass to land can occur on any land.
  - key: q014
    type: mcq
    concept: trespass-to-land-elements
    difficulty: 1
    stem: Dumping old furniture on someone else’s property, as given in the lecture, is an example of which tort?
    options:
      - text: Trespass to land
        correct: true
        why: Correct — this is one of the real-life examples the lecture gives.
      - text: Private nuisance
        correct: false
        why: Dumping furniture is a direct physical act on the land, which the lecture treats as trespass, not nuisance.
      - text: Conversion
        correct: false
        why: Conversion concerns dealing with someone else’s goods as if they were your own, not dumping goods onto their land.
      - text: Waste
        correct: false
        why: Waste is a distinct tort about damage by someone lawfully in possession, and is not a concept covered in this week’s materials.
  - key: q015
    type: mcq
    concept: trespass-to-land-elements
    difficulty: 3
    stem: Which best describes the "intentional or negligent" element of trespass to land?
    options:
      - text: The defendant’s act of interference must have been done intentionally or negligently — purely accidental, non-negligent conduct will not suffice
        correct: true
        why: Correct — this reflects the second listed element — the act itself must be done intentionally or negligently.
      - text: The defendant must specifically have intended to trespass on that particular plaintiff’s land, not merely to perform whatever physical act caused the interference
        correct: false
        why: Too narrow — the intention need only relate to doing the act, not to knowing whose land it affects.
      - text: Negligence can never found trespass to land, only intention can
        correct: false
        why: Incorrect — the element expressly allows either intention or negligence.
      - text: The element is satisfied automatically once entry occurs, regardless of state of mind
        correct: false
        why: State of mind still matters — a wholly accidental, non-negligent entry would not satisfy this element.
  - key: q016
    type: mcq
    concept: trespass-to-land-elements
    difficulty: 4
    stem: A cyclist swerves to avoid a pothole and, without any carelessness, momentarily rides over the corner of P’s front lawn. Best analysis?
    options:
      - text: If the swerve was neither intentional nor negligent, the direct-interference element is not made out and there is no trespass
        correct: true
        why: Correct — the intentional-or-negligent element would not be satisfied on these facts.
      - text: There is trespass regardless, because any entry onto land is always actionable
        correct: false
        why: This ignores the requirement that the act be intentional or negligent.
      - text: There is trespass only if the plaintiff’s lawn was damaged
        correct: false
        why: Damage is not the missing element here — the problem is the lack of intention or negligence.
      - text: There is trespass because mistake is no defence, regardless of how the cyclist came to swerve onto the lawn
        correct: false
        why: The mistake-is-no-defence rule applies to a mistaken belief while otherwise acting intentionally, not to genuinely accidental, non-negligent conduct.
    variant-of: q015
  - key: q017
    type: truefalse
    concept: trespass-to-land-elements
    difficulty: 1
    set: quickfire
    statement: Trespass to land requires the plaintiff to prove they suffered actual damage.
    answer: false
    why: Trespass to land is actionable per se; damage need not be proved.
  - key: q018
    type: truefalse
    concept: trespass-to-land-elements
    difficulty: 2
    set: quickfire
    statement: A defendant who honestly and reasonably believes land is their own can rely on that mistake as a defence to trespass.
    answer: false
    why: Mistake is no defence as long as the trespassory act itself was intentional or negligent.
  - key: q019
    type: truefalse
    concept: trespass-to-land-elements
    difficulty: 2
    set: quickfire
    statement: In an ordinary (non-highway) trespass to land case, the defendant bears the onus of disproving fault.
    answer: true
    why: Correct — the onus shifts to the defendant except in highway cases.
  - key: q020
    type: short
    concept: trespass-to-land-elements
    difficulty: 2
    prompt: Maria has left her wheelie bin against her side fence for years. Her neighbour Tom, annoyed by the smell, one afternoon walks onto Maria’s driveway, picks up the bin and tips it onto the nature strip, leaving mud on the driveway. Advise Maria whether Tom has committed trespass to land.
    model: Tom is likely liable for trespass to land. Trespass requires a direct and positive act of interference with land in the plaintiff’s possession, done intentionally or negligently, without consent or lawful excuse. Maria is in possession of the driveway (factual control and an intention to exclude others), so the possession element is satisfied. Tom’s act of walking onto the driveway and moving the bin was direct, positive and clearly intentional. There is no suggestion Maria consented to Tom entering to remove the bin, and being annoyed by a smell is not a lawful excuse. Because trespass to land is actionable per se, Maria need not prove any damage, although the mud left on the driveway would support compensatory (or aggravated) damages if pleaded. Maria should succeed in trespass to land against Tom.
    rubric:
      - id: r1
        criterion: Identifies trespass to land as the correct cause of action (not nuisance)
        marks: 1
        top-band: Names trespass to land and briefly explains why nuisance is the wrong label (direct entry, not mere interference with use/enjoyment).
        margin-note: Good — correctly distinguishes from nuisance.
        authorities: []
      - id: r2
        criterion: Applies the direct and positive act element to Tom’s conduct
        marks: 1
        top-band: Explains that walking onto the driveway and moving the bin is a direct, positive act.
        margin-note: Element applied to facts, not just stated.
        authorities: []
      - id: r3
        criterion: Applies possession (Maria’s factual control/intention to exclude over the driveway)
        marks: 1
        top-band: Identifies Maria as the possessor even without discussing formal ownership.
        margin-note: Possession, not ownership, is the right frame.
        authorities: []
      - id: r4
        criterion: Addresses intention/negligence and the lack of consent or lawful excuse
        marks: 1
        top-band: Notes Tom’s act was intentional and that annoyance is not a lawful excuse.
        margin-note: Covers both remaining elements.
        authorities: []
      - id: r5
        criterion: Notes trespass is actionable per se, so damage is not required for liability
        marks: 1
        top-band: Explains damage is relevant to remedy, not to liability.
        margin-note: Shows understanding of actionable per se.
        authorities: []
  - key: q021
    type: mcq
    concept: trespass-to-land-scope
    difficulty: 1
    stem: "According to the lecture, \"land\" for the purposes of trespass includes:"
    options:
