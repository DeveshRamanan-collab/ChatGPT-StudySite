      - text: Kelsen involved a registered easement, which Bernstein did not
        correct: false
        why: No easement issue is described in either case in the materials.
      - text: Kelsen was about ownership of minerals, not airspace
        correct: false
        why: Kelsen concerned an advertising sign in the airspace, not minerals.
      - text: There is no real difference — both cases held there was no trespass on their particular facts
        correct: false
        why: Incorrect — Kelsen found a trespass because the sign was low enough to affect ordinary use, unlike Bernstein.
  - key: q025
