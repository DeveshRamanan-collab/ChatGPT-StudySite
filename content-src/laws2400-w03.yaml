  - key: q082
    type: mcq
    concept: public-nuisance
    difficulty: 1
    stem: "Public nuisance is:"
    options:
      - text: A common law crime, and also a tort if the plaintiff suffered special or particular damage
        correct: true
        why: Correct — this dual character is expressly stated in the lecture.
      - text: Only ever a tort, never a crime
        correct: false
        why: Incorrect — public nuisance is itself a common law crime as well as a tort, unlike private nuisance.
      - text: Only ever a crime, never a tort
        correct: false
        why: Incorrect — a tort action is possible where special damage is shown.
      - text: A tort automatically available to any member of the public who is inconvenienced, applying uniformly across all similar situations
