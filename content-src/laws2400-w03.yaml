    body: |
      Trespass to land is direct interference with land in the plaintiff's possession. The elements are: a
      direct and positive act interfering with the land; done intentionally or negligently; while the land is
      in the plaintiff's possession; without the plaintiff's consent (express or implied) or other lawful
      justification (eg exercise of a lawful duty).

      Trespass to land is actionable *per se* — the plaintiff need not prove damage. Except in highway cases,
      the plaintiff does not have to prove fault either: the onus is on the defendant to disprove fault.
      Mistake is no defence as long as the defendant's act was itself an intentional or negligent trespassory
      act — a defendant who honestly but mistakenly believes the land is theirs still trespasses.

      Trespassory conduct is broader than simply walking onto land: it includes driving onto the land,
      remaining after permission to remain has been withdrawn, throwing an object or an animal onto the land,
      and encroachment by scaffolding, cranes or other structures. Everyday examples the lecture gives: parking
      a car on someone else's land, spraying graffiti on a building, gatecrashing a private party, and dumping
      old furniture on someone else's property.

      Exam use: run through the four elements in order on any land-interference fact pattern before considering
      whether the interference was direct enough to be trespass rather than nuisance, and before turning to
      consent or an implied licence as a possible answer to the fourth element.
  - slug: trespass-to-land-scope
    title: What counts as land, and who can sue
    visual: diagram
    visual-brief: A cross-section of a property showing soil, fixtures and a low airspace band all protected by trespass, with a "no greater rights than the public" zone above it — plus a possession test of factual control + intention to exclude.
    related: [trespass-to-land-elements]
    depends-on: [trespass-to-land-elements]
    contrasts-with: []
    cases: [bernstein-v-skyviews, kelsen-v-imperial-tobacco-co, ljp-investments-v-howard-chia-investments, newington-v-windeyer]
    authorities: []
    verify: false
    body: |
      "Land" for trespass includes the soil, fixtures such as a house, factory or (unharvested) crops, and the
      airspace above the land — but only up to the height necessary for the ordinary use and enjoyment of the
      land. Above that, an owner has no greater rights than any other member of the public: in *Bernstein v
      Skyviews* an aircraft photographing the plaintiff's estate from several hundred feet up committed no
      trespass. Low-level intrusions are different: a sign projecting 24 cm into the airspace (*Kelsen v
      Imperial Tobacco Co*) and encroaching scaffolding (*LJP Investments v Howard Chia Investments*) were both
      trespasses. The lecture leaves drones and minerals as open questions to work through using the same
      height/purpose test.

      To sue in trespass to land, the plaintiff needs *exclusive possession* at the time of the trespass — not
      ownership. A tenant can sue; ownership merely helps prove possession where the owner's conduct shows
      control. Possession has two elements: factual control, and an intention to exclude all others. In
      *Newington v Windeyer*, a 50-year occupier who was never the registered owner could still sue in
      trespass, because she showed exclusive possession through her conduct — hosting parties, maintaining the
      garden and trees, and paying rates.

      Exam use: when a problem raises "who can sue" or "is this actually part of the land", work through the
      soil/fixtures/airspace-height test for what counts as land, then the factual-control-plus-intention test
      for who holds the exclusive possession needed to sue.
  - slug: implied-licence
    title: Implied licence to enter
    visual: explainer
    visual-brief: A decision flow — unlocked, unobstructed path with no sign → licence exists for lawful communication → does the entrant's purpose fit, or has the licence been revoked or exceeded?
    related: [trespass-to-land-elements]
    depends-on: [trespass-to-land-elements]
    contrasts-with: []
    cases: [halliday-v-nevill, munnings-v-barrett, plenty-v-dillon, roy-v-oneill, lincoln-hunt-aust-v-willesee, barker-v-the-queen]
    authorities: []
    verify: false
    body: |
      A path or driveway to the front door carries an implied licence for any member of the public on lawful
      business to approach and knock, unless negated by a locked gate or a sign. *Halliday v Nevill* is the
      leading statement: a police officer had an implied licence to enter an open driveway to arrest a
      disqualified driver.

      The licence is narrow and purpose-specific. It does not extend to administering a breath test to the
      occupier (*Munnings v Barrett*) or to serving a summons (*Plenty v Dillon*) — those purposes fall outside
      "lawful communication" with the occupier, so entering for them is trespass.

      But a mixed purpose does not automatically defeat the licence. In *Roy v O'Neill*, police officers
      attending a home to check compliance with a domestic violence order were not trespassers: the implied
      licence to approach the front door included checking on the welfare of the protected occupant, and
      having that *additional*, alien purpose (investigating DVO compliance) in mind did not negate it. An
      entrant becomes a trespasser only where their sole purpose is outside the licence, the licence is revoked
      and they remain, or they act inconsistently with it.

      Exam use: identify the licensed purpose first (lawful communication/genuine business), then ask whether
      the entrant's actual purpose(s) fit inside it, and whether anything (a sign, a lock, a revocation, or
      later conduct) took them outside it.
  - slug: remedies-trespass-to-land
    title: Remedies for trespass to land
    visual: palace
    visual-brief: Three remedy branches — damages (nominal/compensatory/aggravated/exemplary), injunction (prohibitory/mandatory) and self-help — with the damages branch expanding into its measure.
    related: [trespass-to-land-elements]
    depends-on: [trespass-to-land-elements]
    contrasts-with: [nuisance-defences-remedies]
    cases: []
    authorities: []
    verify: false
    body: |
      Three kinds of remedy are available for trespass to land: damages (which may be nominal, compensatory,
      aggravated or exemplary), injunctions (prohibitory or mandatory), and self-help — eg physically removing
      a trespasser using reasonable force.

      The measure of damages follows the general compensatory rule: put the injured party in the position they
      would have been in had no wrong been committed. Damages are generally assessed as the diminution in the
      value of the property, though in suitable cases the higher cost of reinstatement may be ordered instead.
      It is also possible to recover for consequential injury or damage flowing from the trespass — for
      example, if the trespass caused the plaintiff a psychiatric injury.

      Because trespass to land is actionable *per se*, a plaintiff can obtain at least nominal damages without
      proving any loss at all; the choice between diminution-in-value and reinstatement, and whether
      aggravated/exemplary damages are added, depends on the facts (eg deliberate or high-handed conduct
      supports aggravated or exemplary damages).

      Exam use: once trespass is established, address remedy separately — state the available remedies, then
      select and justify the measure of damages (diminution vs reinstatement) or explain why an injunction or
      self-help is the more appropriate remedy on the facts (eg an ongoing or repeated trespass suits an
      injunction better than damages alone).
  - slug: public-nuisance
    title: Public nuisance
    visual: palace
    visual-brief: A three-step checklist — title to sue (special damage) → interference with a public right → substantial and unreasonable — read top to bottom.
    related: [private-nuisance-elements]
    depends-on: [trespass-to-land-elements]
    contrasts-with: [trespass-to-land-elements, private-nuisance-elements]
    cases: [walsh-v-ervin]
    authorities: []
    verify: false
    body: |
      Nuisance is unreasonable interference with the plaintiff's use or enjoyment of land; unlike
      trespass, the interference is with use/enjoyment (not direct physical entry) and need not be direct or
      physical. Public nuisance is a common law crime, but a private individual may also bring a tort
      action if they have suffered special or particular damage.

      Public nuisance is an unlawful act or omission which (i) endangers the lives, safety, property or comfort
      of the public, or (ii) obstructs the enjoyment of a right common to all. To sue, a plaintiff needs: title
      to sue (special/particular damage, different from the damage suffered by the public generally);
      interference with a public right (the general public must be affected — this is ordinarily the
      community's/the state's responsibility to address); and interference that is substantial and
      unreasonable (not every annoyance or temporary inconvenience qualifies).

      *Walsh v Ervin* shows how "special or particular damage" can be proved: a farmer ploughed and planted
      crops on the highway and erected gates blocking the plaintiff's vehicle access to his land. The court
      held that special damage is not limited to pecuniary loss — substantial delay and inconvenience,
      different in kind from what the rest of the public experienced, was enough to give the plaintiff title to
      sue.

      Exam use: obstructing a highway is the classic public nuisance fact pattern — check all three elements,
      and use Walsh v Ervin to argue that the plaintiff's inconvenience was "substantial" and "dissimilar" to
      the general public's, even without financial loss.
  - slug: private-nuisance-elements
    title: "Private nuisance: elements"
    visual: palace
    visual-brief: Three-step checklist — title to sue, substantial and unreasonable interference, created/authorised/continued — with a branch off the middle step listing the balancing factors (frequency, duration, time, locality, distance, motive).
    related: [public-nuisance, trespass-to-land-elements]
    depends-on: [trespass-to-land-elements]
    contrasts-with: [trespass-to-land-elements, public-nuisance]
    cases: [oldham-v-lawson-no-1, khorasandjian-v-bush, deasy-investments-v-monreast, hunter-v-canary-wharf, munro-v-southern-dairies, victoria-park-racing-and-recreation-grounds-co-v-taylor, hollywood-silver-fox-farm-v-emmett]
    authorities: []
    verify: false
    body: |
      Private nuisance is an action on the case protecting both tangible and intangible interferences with a
      person's use and enjoyment of land. To succeed, a plaintiff must show title to sue, a substantial and
      unreasonable interference, and that the defendant created, authorised or continued the state of affairs
      giving rise to the harm.

      **Title to sue.** Traditionally only a person with a proprietary interest — an owner or a tenant in
      possession — can sue; a mere licensee cannot (*Oldham v Lawson (No 1)*). Courts wavered — *Khorasandjian
      v Bush* and *Deasy Investments v Monreast* allowed a licensee to sue — before *Hunter v Canary Wharf Ltd*
      overruled Bush and restored the proprietary-interest requirement.

      **Substantial and unreasonable.** Courts balance the competing rights of neighbouring occupiers,
      weighing frequency, duration, time, locality and distance, against an *objective* standard — the
      ordinary person in the claimant's position, not one of abnormal sensitivity (*Munro v Southern
      Dairies*). Mere loss of profit from lawful competition, or being overlooked, is not enough (*Victoria
      Park Racing v Taylor*) — but the defendant's motive or malice can tip otherwise-lawful conduct into
      nuisance (*Hollywood Silver Fox Farm v Emmett*).

      **Created, authorised or continued.** Liability is not limited to the creator; an occupier who authorises
      the activity, or who becomes aware of a nuisance and neglects to remedy it, can be liable too.

      Exam use: work title to sue first, then the balancing factors, flagging motive/hostility; then identify
      who — creator, authoriser or continuer — is the right defendant.
  - slug: nuisance-defences-remedies
    title: Defences and remedies for nuisance
    visual: palace
    visual-brief: Two parallel lists — defences (prescriptive right, plaintiff's conduct/consent, statutory authorisation, contributory negligence) and remedies (damages, injunction, abatement) — read as two menus.
    related: [private-nuisance-elements, public-nuisance]
    depends-on: [private-nuisance-elements]
    contrasts-with: [remedies-trespass-to-land]
    cases: []
    authorities: []
    verify: false
    body: |
      Several defences may be pleaded to a nuisance claim: a prescriptive right to continue the interference
      (the interference must have continued for more than 20 years); the plaintiff's own conduct or consent
      (the most commonly pleaded defence — though it is no defence that the plaintiff "came to the nuisance",
      eg by moving in next to an existing activity); statutory authorisation (available only if the authorised
      activity could not have been carried out without committing the nuisance); and contributory negligence.

      Three remedies are available: damages, injunction and abatement (self-help). Damages may cover damage to
      the land, financial loss (loss of trade, decline in property value) and loss of subjective enjoyment —
      but the type of harm claimed must have been reasonably foreseeable. An injunction is normally granted
      where damages would not be an adequate remedy, with the likelihood of recurrence a key factor. Abatement
      lets the plaintiff act without going to court, but they must be cautious and use only reasonable methods
      to abate the nuisance.

      Exam use: after establishing the elements of (public or private) nuisance, check each defence in turn —
      "came to the nuisance" is a common trap answer that does *not* work — before recommending a remedy:
      prefer an injunction over damages where the interference is ongoing or likely to recur, and mention
      abatement only as a cautious, last-resort self-help option.
