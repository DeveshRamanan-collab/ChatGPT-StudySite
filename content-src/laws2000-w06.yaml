  - key: q418
    type: truefalse
    set: quickfire
    concept: immunity-and-serious-international-crimes
    statement: Germany v Italy concerned criminal proceedings against German officials in Italian courts.
    answer: false
    why: False — the lecturer stresses the proceedings were civil claims against the state of Germany for acta jure imperii, not criminal proceedings against individuals.
  - key: q419
    type: truefalse
    set: quickfire
    concept: immunity-and-serious-international-crimes
    statement: Pinochet (No 3) accepted that serving heads of state have absolute immunity.
    answer: true
    why: True — the House of Lords distinguished serving from former heads of state, holding there is absolute immunity for serving heads of state but not for former ones in relation to torture.
  - key: q420
    type: short
    concept: immunity-and-serious-international-crimes
    difficulty: 4
    prompt: |
      "Immunity does not mean impunity." Discuss whether immunity continues to apply where a state or its officials are
      accused of serious violations of international law, referring to Germany v Italy, Arrest Warrant and Pinochet.
    model: |
      Immunity is procedural, so the seriousness of an allegation does not by itself remove it. For states, Germany v
      Italy (2012) held that custom did not deprive Germany of immunity in Italian civil proceedings over crimes by its
      forces in World War II. Immunity rules are "procedural in character" and "entirely distinct from the substantive
      law" (para 93), and immunity for acta jure imperii extends to acts of armed forces in armed conflict even on the
      forum's territory (para 77). Powerful policy arguments exist, but state practice does not yet support an
      exception.

      For serving officials, Arrest Warrant (2002) held that Belgium's warrant breached the sitting Congolese foreign
      minister's personal immunity; there is no international crimes exception. But immunity is not impunity:
      prosecution is possible at home, after waiver, by other states once the person leaves office (for acts before or
      after office and private acts during it), and before international criminal courts.

      For former officials, Pinochet (No 3) (1999) held a former head of state had no immunity for torture, which was an
      international crime with a form of universal jurisdiction under the Convention against Torture binding the UK,
      Chile and Spain. ILC draft article 7 (2017) would exclude immunity for genocide, crimes against humanity, war
      crimes, torture and enforced disappearances, but whether it reflects state practice is debated.
    rubric:
      - id: r1
        criterion: Explains the procedural nature of immunity and applies Germany v Italy to states.
        marks: 2
        top-band: Quotes or paraphrases paras 93 and 77 and notes the civil, acta jure imperii context.
        margin-note: Good use of the key paragraphs.
        authorities: []
      - id: r2
        criterion: Applies Arrest Warrant to serving officials, including the immunity/impunity distinction.
        marks: 2
        top-band: States the holding and lists the four avenues for prosecution.
        margin-note: Well done — the four avenues are what the quote is about.
        authorities: []
      - id: r3
        criterion: Explains Pinochet and the emerging exception to functional immunity.
        marks: 2
        top-band: Distinguishes serving and former heads of state and identifies the CAT basis of the majority.
        margin-note: Accurate on the ratio, not just the jus cogens rhetoric.
        authorities: []
      - id: r4
        criterion: Evaluates the current state of the law, including ILC draft article 7.
        marks: 2
        top-band: Lists the draft article's crimes and notes the continuing debate over state practice.
        margin-note: Balanced conclusion — shows awareness that the law is unsettled.
        authorities: [ilc-immunity-of-state-officials-draft-art-7]

  # ---------- Concept 5: diplomatic-and-consular-immunities ----------
  - key: q501
    type: mcq
    concept: diplomatic-and-consular-immunities
    difficulty: 1
    set: pretest
    stem: A diplomatic agent accredited to Australia is charged with a criminal offence committed in a private capacity. Under VCDR art 31, what is the position?
    options:
      - text: Immune from Australia's criminal jurisdiction.
        correct: true
        why: Correct — art 31 gives a diplomatic agent immunity from the criminal jurisdiction of the receiving state, without the exceptions that apply to civil jurisdiction.
      - text: Immune only if the offence was committed in the course of official functions, as with functional immunity.
        why: Tempting because functional immunity turns on official acts, but a diplomatic agent's criminal immunity under art 31 is personal and covers private acts too.
      - text: Not immune, because art 31 excepts professional or commercial activity and private conduct outside official functions.
        why: Tempting because art 31 has exceptions, but they apply only to civil and administrative jurisdiction; criminal immunity is unqualified.
      - text: Not immune, because the Vienna Convention protects only ambassadors and not other diplomatic agents.
        why: Tempting because ambassadors are the typical example, but the slide says diplomatic agents include lower-level diplomatic agents too.
  - key: q502
    type: mcq
    concept: diplomatic-and-consular-immunities
    difficulty: 2
    stem: Which civil action against a diplomatic agent falls within an exception to immunity in VCDR art 31?
    options:
      - text: A claim for unpaid rent on the embassy building, which the agent leased for the mission on behalf of the sending state.
        why: Tempting because it concerns immovable property, but art 31(a) excludes property held on behalf of the sending state for the purposes of the mission.
      - text: A real action over the agent's private holiday house in the receiving state.
        correct: true
        why: Correct — art 31(a) excepts a real action relating to private immovable property in the receiving state, unless held on behalf of the sending state for the mission.
      - text: A defamation claim over statements the agent made at an official press conference representing the sending state.
        why: Tempting because defamation is a private wrong, but statements at an official press conference are part of official functions and not within any art 31 exception.
  - key: q503
    type: mcq
    concept: diplomatic-and-consular-immunities
    variant-of: q502
    difficulty: 2
    stem: A diplomat runs a private consultancy in the receiving state on weekends, and a client sues her for breach of contract. Is she immune?
    options:
      - text: Yes, because diplomats have complete immunity from the civil jurisdiction of the receiving state for all acts.
        why: Tempting because criminal immunity is complete, but civil immunity has three exceptions in art 31, one of which applies here.
      - text: No — art 31(c) excepts professional or commercial activity outside official functions.
        correct: true
        why: Correct — art 31(c) removes civil immunity for an action relating to any professional or commercial activity exercised outside the agent's official functions.
      - text: Yes, unless the client is a national of the sending state, in which case the sending state's courts have jurisdiction.
        why: Tempting because nationality matters for some staff, but art 31(c) turns on the nature of the activity, not the client's nationality.
  - key: q504
    type: mcq
    concept: diplomatic-and-consular-immunities
    difficulty: 1
    stem: What does VCDR art 29 provide?
    options:
      - text: That the private residence of a diplomatic agent, and his papers, are inviolable and may not be searched.
        why: Tempting because it is the neighbouring article, but the residence, papers and correspondence are covered by art 30.
      - text: That the person of a diplomatic agent is inviolable — for example, he cannot be arrested.
        correct: true
        why: Correct — art 29 makes the person of a diplomatic agent inviolable; the slide's example is that a diplomat cannot be arrested.
      - text: That a diplomatic agent must respect the laws of the receiving state and not interfere in its internal affairs.
        why: Tempting because it is a key duty, but that is art 41, which balances immunity with obligations.
  - key: q505
    type: mcq
    concept: diplomatic-and-consular-immunities
    difficulty: 2
    stem: Police wish to search a diplomatic agent's private flat and seize his correspondence. Which article stands in the way?
    options:
      - text: Art 31, which grants the agent immunity from the civil and administrative jurisdiction of the receiving state.
        why: Tempting because art 31 is the main immunity provision, but a search of premises and papers is governed by the inviolability rule for residences.
      - text: Art 30.
        correct: true
        why: Correct — art 30 makes the private residence of a diplomatic agent, and his papers and correspondence, inviolable.
      - text: Art 9, under which the receiving state must first declare the agent persona non grata before any search.
        why: Tempting because art 9 is the receiving state's remedy, but it expels the agent; it does not authorise searching an inviolable residence.
  - key: q506
    type: mcq
    concept: diplomatic-and-consular-immunities
    difficulty: 2
    stem: What does VCDR art 41 add to the picture of diplomatic immunity?
    options:
      - text: Duties — to respect the receiving state's laws and not to interfere in its internal affairs.
        correct: true
        why: Correct — art 41 imposes a duty to respect the laws and regulations of the receiving state and a duty not to interfere in its internal affairs.
      - text: A right for the receiving state to prosecute a diplomat who breaks its laws, once the breach is proven.
        why: Tempting because breach of art 41 is abuse, but immunity still bars prosecution; the remedies are persona non grata, severance or waiver.
      - text: An exemption from all local laws, so that the diplomat need only comply with the laws of the sending state.
        why: "Tempting because immunity blocks enforcement, but art 41 says the opposite: immunity does not relieve the diplomat of the duty to respect local law."
  - key: q507
    type: mcq
    concept: diplomatic-and-consular-immunities
    difficulty: 3
    stem: In the Assange tutorial, could the UK police lawfully enter the Ecuadorian embassy in London to arrest Assange?
    options:
      - text: Yes, because Assange was not a diplomat, so none of the embassy's immunities protected him.
        why: Tempting because Assange had no personal immunity, but the premises themselves are inviolable under art 22, whoever is inside.
      - text: Not without the consent of the head of mission, because the premises are inviolable under VCDR art 22.
        correct: true
        why: Correct — art 22 extends inviolability to the mission's premises except with the consent of the head of mission, so UK agents could not enter uninvited.
      - text: Yes, once a UK court had issued a valid arrest warrant, since domestic warrants override the Vienna Convention.
        why: Tempting because a warrant authorises arrest in domestic law, but it cannot override the receiving state's treaty obligation of inviolability under art 22.
  - key: q508
    type: mcq
    concept: diplomatic-and-consular-immunities
    variant-of: q507
    difficulty: 3
    stem: Canberra police suspect evidence of a crime is kept in New Zealand's embassy. The head of mission refuses entry. What may the police do?
    options:
      - text: Search the premises under warrant, since the evidence concerns a crime under Australian law.
        why: Tempting because a warrant is lawful domestically, but art 22 makes the premises inviolable; the lecture's example is that Australia cannot enter New Zealand's embassy.
      - text: Nothing inside the mission — without the head of mission's consent the premises may not be entered or searched.
        correct: true
        why: Correct — the premises are inviolable except with the head of mission's consent (art 22), and premises and property are immune from search (arts 22, 24).
      - text: Enter only the archives room, because archives are the one part of a mission not protected from search.
        why: Tempting because archives are listed separately, but art 24 makes the archives inviolable too, together with premises, property and transport.
  - key: q509
    type: mcq
    concept: diplomatic-and-consular-immunities
    difficulty: 3
    stem: Protesters gather outside an embassy and threaten to break in. What does VCDR art 22(2) require of the receiving state?
    options:
      - text: Nothing, as long as its own agents do not enter the premises.
        why: Tempting because inviolability is often read as a duty not to enter, but art 22(2) adds a positive duty to protect; Iran's inaction in Tehran Hostages breached it.
      - text: To protect the premises against intrusion or damage and prevent disturbance of the mission's peace or impairment of its dignity.
        correct: true
        why: Correct — art 22(2) imposes a duty to protect the premises against intrusion or damage and to prevent disturbance of the peace of the mission or impairment of its dignity.
      - text: To evacuate the mission's staff and close the embassy until the protest ends.
        why: Tempting because it may seem safest, but art 22(2) requires protection of the mission, not its closure, and the sending state runs its mission.
  - key: q510
    type: mcq
    concept: diplomatic-and-consular-immunities
    difficulty: 2
    stem: For what does the ICJ's judgment in United States Diplomatic and Consular Staff in Tehran (1980) stand?
    options:
      - text: That a receiving state is not responsible for acts of private militants it did not direct.
        why: Tempting because the militants were not state agents, but the Court found Iran's own inaction violated its obligations to protect the mission.
      - text: That diplomatic law is a self-contained regime, and Iran's failure to protect the embassy breached it.
        correct: true
        why: Correct — the ICJ described diplomatic law as a self-contained regime (para 86), confirmed inviolability of envoys and embassies, and held Iran's inaction breached its obligations.
      - text: That a diplomat who abuses immunity automatically loses the protection of both Vienna Conventions in the receiving state.
        why: Tempting because abuse was argued, but the Court said the regime itself foresees abuse and specifies the receiving state's means to counter it, such as persona non grata.
  - key: q511
    type: mcq
    concept: diplomatic-and-consular-immunities
    difficulty: 2
    stem: A receiving state wants to respond to a diplomat's espionage without breaching the VCDR. Which step is expressly provided for?
    options:
      - text: Declaring the diplomat persona non grata under art 9.
        correct: true
        why: Correct — art 9 lets the receiving state declare a person not acceptable, revoking credentials, as the US did with Russian diplomats after the 2016 election allegations.
      - text: Arresting the diplomat and holding him until the sending state agrees to a trial in the receiving state.
        why: Tempting because espionage is serious, but art 29 forbids arrest; detention would breach the diplomat's personal inviolability.
      - text: Searching the diplomat's residence for evidence to use in a prosecution before its criminal courts.
        why: Tempting because evidence is needed, but the residence and papers are inviolable (art 30) and the diplomat is immune from criminal jurisdiction (art 31).
  - key: q512
    type: mcq
    concept: diplomatic-and-consular-immunities
    difficulty: 2
    stem: Which of these is NOT listed in the slides as a response to abuse of diplomatic immunity?
    options:
      - text: Severance or breach of diplomatic relations.
        why: Wrong choice — severance or breach of diplomatic relations is on the slide's list of responses to abuse.
      - text: Prosecution of the diplomat in the receiving state's courts once the abuse is proven.
        correct: true
        why: Correct — prosecution is barred by criminal immunity; the listed responses are persona non grata, severance, other unfriendly acts, nothing, or waiver by the sending state.
      - text: Waiver of immunity by the sending state.
        why: Wrong choice — waiver by the sending state is listed; it would then allow the receiving state's courts to act.
      - text: Other 'unfriendly acts'.
        why: Wrong choice — other 'unfriendly acts' are listed, alongside the possibility of doing nothing.
  - key: q513
    type: mcq
    concept: diplomatic-and-consular-immunities
    difficulty: 3
    stem: How do consular immunities under the VCCR (1963) compare with diplomatic immunities?
    options:
      - text: They are identical, because both conventions codify the same customary rules for all state representatives abroad.
        why: Tempting because both are Vienna Conventions, but the slide says consular immunities are more restricted.
      - text: More restricted — limited inviolability (arrest for a 'grave crime' possible, art 41) and immunity ratione materiae only (art 43).
        correct: true
        why: Correct — the VCCR gives consuls only limited personal inviolability, so they can be arrested for a grave crime (art 41), and only functional immunity in criminal and civil matters (art 43).
      - text: Wider, because consuls deal with the receiving state's nationals and need complete immunity to do so.
        why: Tempting because consuls handle administrative matters with the public, but their immunities are narrower than a diplomat's.
  - key: q514
    type: mcq
    concept: diplomatic-and-consular-immunities
    variant-of: q513
    difficulty: 4
    stem: A consul and a diplomatic agent of the same state are each suspected of a grave assault committed in a private capacity. Which can the receiving state arrest?
    options:
      - text: Neither, because both enjoy complete personal inviolability under the two Vienna Conventions.
        why: "Tempting because both are protected, but consular inviolability is limited: a consul can be arrested for a grave crime (VCCR art 41)."
      - text: Both, because a grave private crime falls outside the official functions of any state representative abroad.
        why: Tempting because the act was private, but a diplomatic agent's person is inviolable (VCDR art 29) and their criminal immunity covers private acts.
      - text: The consul only — a consul may be arrested for a grave crime, while the diplomat is inviolable.
        correct: true
        why: Correct — the consul has limited inviolability and only functional immunity (VCCR arts 41, 43), while the diplomatic agent's person is inviolable (VCDR art 29).
  - key: q515
    type: mcq
    concept: diplomatic-and-consular-immunities
    difficulty: 3
    stem: The spouse of a diplomatic agent forms part of the agent's household but is a national of the receiving state. Does the spouse enjoy immunity from jurisdiction?
    options:
      - text: Yes — family members always share the diplomatic agent's full immunities.
        why: Tempting because family members are generally covered, but the slide excludes those who are nationals of the receiving state.
      - text: No — household family members enjoy immunity unless nationals of the receiving state.
        correct: true
        why: Correct — the slide says members of the family forming part of the household enjoy immunity from jurisdiction, unless nationals of the receiving state.
      - text: Yes, but only immunity from civil jurisdiction, never from criminal jurisdiction, whatever their nationality.
        why: Tempting because it splits the difference, but the rule on the slide turns on nationality, not on a civil/criminal split.
  - key: q516
    type: mcq
    concept: diplomatic-and-consular-immunities
    difficulty: 3
    stem: A mission's cook, who is not a national or permanent resident of the receiving state, causes an accident while shopping privately on a day off. Is the cook immune?
    options:
      - text: Yes — all members of a mission share the head of mission's full personal immunity.
        why: Tempting because the cook belongs to the mission, but immunities are graded by category of staff; service staff have the narrowest protection.
      - text: No — service staff are immune only for acts performed in the course of their official duties.
        correct: true
        why: Correct — service staff who are not nationals or permanent residents enjoy immunity only for acts performed in the course of their official duties; private shopping is not one.
      - text: Yes, because the cook is not a national or permanent resident of the receiving state, which gives full immunity.
        why: Tempting because that condition must be met, but it is only a precondition; even then service staff are immune only for official duties.
  - key: q517
    type: truefalse
    set: quickfire
    concept: diplomatic-and-consular-immunities
    statement: Before 1961, diplomatic immunities were governed entirely by customary international law or bilateral treaties.
    answer: true
    why: True — the slide says that prior to 1961, when the VCDR was adopted, the regime was entirely governed by customary international law or bilateral treaties.
  - key: q518
    type: truefalse
    set: quickfire
    concept: diplomatic-and-consular-immunities
    statement: A consular officer can never be arrested by the receiving state.
    answer: false
    why: False — consular inviolability is limited; under VCCR art 41 a consular officer can be arrested or detained for a 'grave crime'.
  - key: q519
    type: truefalse
    set: quickfire
    concept: diplomatic-and-consular-immunities
    statement: A diplomatic agent is immune from the receiving state's civil jurisdiction without exception.
    answer: false
    why: False — VCDR art 31 excepts real actions over private immovable property, private succession matters, and professional or commercial activity outside official functions.
  - key: q520
    type: short
    concept: diplomatic-and-consular-immunities
    difficulty: 3
    prompt: |
      Julian Assange took refuge in the Ecuadorian embassy in London in 2012 to avoid extradition. Under international
      law, could the UK enter the embassy to arrest him? What other options did the UK have in its dealings with
      Ecuador's mission?
    model: |
      Diplomatic relations are governed by the Vienna Convention on Diplomatic Relations 1961, a treaty regime the ICJ in
      Tehran Hostages (1980) called "self-contained": it sets out the receiving state's obligations and the means it has
      to counter abuse. Under art 22, the premises of the mission are inviolable, and agents of the receiving state may
      not enter them except with the consent of the head of mission. The premises, their furnishings, means of
      transport and archives are immune from search, requisition, attachment and execution (arts 22, 24), and the
      receiving state must protect the premises against intrusion (art 22(2)).

      Assange was not a diplomat, so he had no personal immunity under art 31 or inviolability under art 29. But the
      inviolability attaches to the premises, so the UK could not enter the embassy to arrest him without the
      ambassador's consent; a UK warrant does not override the treaty.

      The UK's options lay within the regime: seek the head of mission's consent, or respond to any abuse by declaring
      diplomats persona non grata (art 9), severing relations or other unfriendly acts, or doing nothing — which is, in
      effect, what happened for nearly seven years.
    rubric:
      - id: r1
        criterion: Identifies the VCDR as the governing regime and its self-contained character.
        marks: 1
        top-band: Names the VCDR and uses Tehran Hostages para 86.
        margin-note: Correct framework.
        authorities: []
      - id: r2
        criterion: States and applies the inviolability of mission premises.
        marks: 3
        top-band: Cites art 22 (consent of head of mission) and art 24, and the duty to protect in art 22(2).
        margin-note: This is the decisive rule — well stated.
        authorities: [vcdr-art-22, vcdr-art-24]
      - id: r3
        criterion: Distinguishes the premises' inviolability from any personal immunity of Assange.
        marks: 2
        top-band: Notes Assange had no immunity under arts 29 or 31, but the premises remain inviolable whoever is inside.
        margin-note: Nice distinction — many answers miss this.
        authorities: [vcdr-arts-29-30, vcdr-art-31]
      - id: r4
        criterion: Identifies the UK's lawful options under the regime.
        marks: 2
        top-band: Lists consent, persona non grata (art 9), severance, unfriendly acts or doing nothing.
        margin-note: Good practical conclusion.
        authorities: [vcdr-art-9]

  # ---------- Concept 6: immunities-of-international-organisations ----------
  - key: q601
    type: mcq
    concept: immunities-of-international-organisations
    difficulty: 1
    stem: Why, according to the lecture, do international organisations such as the UN need immunities?
    options:
      - text: Because they are sovereign states in their own right and share in sovereign equality.
        why: Tempting because IOs have international personality, but they are not states; their immunities are functional, not grounded in sovereign equality.
      - text: To carry out their functions without interference from the host state, and to be treated alike across countries.
        correct: true
        why: Correct — the slides say these immunities are necessary to carry out IO functions without interference, and the lecture adds they avoid frivolous suits and many different legal regimes.
      - text: To shield their officials from all liability for any act, official or private, in any country where the organisation operates.
        why: Tempting because the UN operates everywhere, but the immunity of IO officials is limited to acts carried out in their functions.
      - text: Because the Security Council grants immunity to every organisation it recognises.
        why: Tempting because the Council is powerful, but IOs enjoy the immunities states grant them, often by treaty, not by Council recognition.
  - key: q602
    type: mcq
    concept: immunities-of-international-organisations
    difficulty: 2
    stem: How does the legal source of IO immunities differ from that of state immunity?
    options:
      - text: Both come from customary international law, as codified by the ILC in draft articles adopted by the General Assembly.
        why: Tempting because state immunity is customary, but the lecture says IO immunities are based on treaty law, not custom.
      - text: IO immunities rest on treaty law granted by states; state immunity rests on custom.
        correct: true
        why: Correct — the lecturer says IO immunities are based on treaty law (e.g. the 1946 Convention), not customary law, whereas state immunity is customary.
      - text: IO immunities come from the IO's own internal rules; state immunity comes from the 2004 Convention.
        why: Tempting because IOs have internal rules and the 2004 Convention exists, but states grant IO immunities, and the 2004 Convention is not in force.
      - text: IO immunities derive from recognition by the host state; state immunity derives from UN membership.
        why: Tempting because host states matter in practice, but IO immunities are granted by treaty, and state immunity rests on sovereign equality, not membership.
  - key: q603
    type: mcq
    concept: immunities-of-international-organisations
    difficulty: 2
    stem: What kind of immunity do officials of international organisations enjoy, according to the lecture?
    options:
      - text: Personal immunity, like a head of state, for the duration of their appointment.
        why: Tempting because some UN officials are senior, but the lecturer says we are not talking about personal immunities here.
      - text: Functional immunity for acts in their functions.
        correct: true
        why: "Correct — the lecturer says the immunity of IO officials is limited to the actions they carry out in their functions: functional, not personal."
      - text: None — only the organisation is protected.
        why: Tempting because the organisation's immunity is broad, but art 105(2) and the 1946 Convention give officials immunity for their official acts.
  - key: q604
    type: mcq
    concept: immunities-of-international-organisations
    difficulty: 2
    stem: What does UN Charter art 105(1) give the United Nations?
    options:
      - text: Complete immunity from all legal process in every state in the world, whether or not a member.
        why: Tempting because the UN's immunity is broad, but art 105(1) applies in the territory of each of its Members and is limited to what is necessary.
      - text: Such privileges and immunities in its Members' territory as are necessary for the fulfillment of its purposes.
        correct: true
        why: "Correct — art 105(1): the Organization shall enjoy in the territory of each Member such privileges and immunities as are necessary for the fulfillment of its purposes."
      - text: The same immunities as a sovereign state under the 2004 Convention, including the commercial transactions exception.
        why: Tempting because the regimes look alike, but the UN's immunity rests on art 105 and the 1946 Convention, not on state immunity rules.
  - key: q605
    type: mcq
    concept: immunities-of-international-organisations
    difficulty: 2
    stem: Why does the lecturer describe art 105 of the Charter as "very vague", and how was that resolved?
    options:
      - text: It does not say what the immunities are; the 1946 Convention on the Privileges and Immunities of the UN defined them a year later.
        correct: true
        why: Correct — the lecturer says it was agreed the immunities would be defined in another instrument, which was done in 1946 with the Convention on the Privileges and Immunities of the UN.
      - text: It was left to each host state's legislation, so the scope differs from country to country.
        why: Tempting because host states implement treaties, but the point of IO immunity is uniform treatment across countries, secured by the 1946 Convention.
      - text: The ICJ filled the gap in Reparation for Injuries by listing the UN's immunities.
        why: Tempting because Reparation for Injuries concerned the UN's personality, but the immunities were defined by the 1946 Convention, not by the Court.
  - key: q606
    type: mcq
    concept: immunities-of-international-organisations
    difficulty: 3
    stem: The UN expressly waives its immunity so that a contractor's claim can be heard, and the contractor wins. Can the contractor now seize UN assets to enforce the judgment?
    options:
      - text: Yes, because a waiver of immunity for the proceedings extends to all steps needed to satisfy the judgment.
        why: Tempting because a state's waiver cannot be withdrawn, but art II s 2 says no waiver of UN immunity extends to any measure of execution.
      - text: No — under art II s 2 of the 1946 Convention, no waiver of immunity extends to any measure of execution.
        correct: true
        why: Correct — section 2 grants immunity from every form of legal process unless expressly waived, and adds that no waiver of immunity shall extend to any measure of execution.
      - text: Yes, but only against UN property held by third parties outside UN premises.
        why: Tempting because premises are specially protected, but s 2 covers UN property and assets wherever located and by whomsoever held.
  - key: q607
    type: mcq
    concept: immunities-of-international-organisations
    difficulty: 2
    stem: How does the lecture compare the protection of UN premises with that of a state's diplomatic premises?
    options:
      - text: UN premises have weaker protection, because the UN is not a state and has no sovereign equality to invoke.
        why: Tempting because the UN is not a state, but s 3 makes its premises inviolable, just like an embassy.
      - text: They are closely alike — UN premises are inviolable, and its property is immune from search, requisition, confiscation and expropriation.
        correct: true
        why: "Correct — the lecturer notes the clear resemblance: s 3 makes UN premises inviolable and its property immune from interference, just as an embassy is under the VCDR."
      - text: UN premises are protected only in New York, where the headquarters agreement applies.
        why: Tempting because headquarters are special, but s 3 protects UN premises and property wherever located — the lecturer's example is offices in Australia and Cambodia.
  - key: q608
    type: mcq
    concept: immunities-of-international-organisations
    difficulty: 1
    stem: Under art II s 4 of the 1946 Convention, where are the UN's archives inviolable?
    options:
      - text: Only inside UN premises.
        why: Tempting because premises are inviolable, but s 4 makes the archives inviolable wherever located, not just on UN premises.
      - text: Wherever they are located.
        correct: true
        why: "Correct — s 4: the archives of the UN, and in general all documents belonging to it or held by it, shall be inviolable wherever located."
      - text: Only in states that have enacted the Convention into domestic law by statute.
        why: Tempting because implementation matters domestically, but the Convention's text makes the archives inviolable wherever located.
  - key: q609
    type: mcq
    concept: immunities-of-international-organisations
    difficulty: 2
    stem: Australia's ambassador to the UN in New York falls into which category of the 1946 Convention?
    options:
      - text: UN official under art V, because he works full time on UN business.
        why: Tempting because he works on UN matters, but he is employed by Australia, not the UN; UN officials are people hired by the UN.
      - text: Expert on mission under art VI, because he was sent abroad to perform a mission.
        why: Tempting because he is posted abroad, but experts on mission are sent by the UN itself to carry out a mission.
      - text: Representative of a member under art IV.
        correct: true
        why: "Correct — the lecturer's example: someone working for DFAT posted to Australia's mission to the UN represents the state at the UN, a representative of a member (art IV)."
  - key: q610
    type: mcq
    concept: immunities-of-international-organisations
    variant-of: q609
    difficulty: 3
    stem: A statistician hired by the UN Secretariat in New York writes an official report that a company claims defames it. Is she immune from the suit?
    options:
      - text: No, because only representatives of members, not UN staff, enjoy immunity for words written.
        why: Tempting because representatives' immunity is listed first, but UN officials are also immune for words spoken or written in their official capacity.
      - text: Yes — as a UN official she is immune from legal process for words written in her official capacity (art V s 18).
        correct: true
        why: Correct — art V s 18 makes UN officials immune from legal process in respect of words spoken or written and all acts performed in their official capacity.
      - text: Yes, because UN officials have personal immunity covering all of their acts for as long as they are employed by the UN.
        why: "Tempting because the result is the same here, but the reason is wrong: IO officials have functional immunity only, not personal immunity."
  - key: q611
    type: mcq
    concept: immunities-of-international-organisations
    difficulty: 3
    stem: What is distinctive about the immunity of experts on missions under art VI of the 1946 Convention?
    options:
      - text: It ends when the mission ends.
        why: Tempting because missions are temporary, but the slide says the experts' immunity continues even when they are no longer employed on UN missions.
      - text: It continues even when they are no longer employed on UN missions.
        correct: true
        why: Correct — the slide says the experts' immunity from legal process for words and acts in the performance of their mission continues even when they are no longer employed on missions.
      - text: It covers private acts as well as mission acts, because experts often work in dangerous countries.
        why: Tempting because the lecture mentions challenging conditions, but experts' immunity is limited to acts in the course of the performance of their mission.
  - key: q612
    type: mcq
    concept: immunities-of-international-organisations
    difficulty: 1
    stem: Which of these is an example of a privilege, rather than an immunity, of UN officials given in the lecture?
    options:
      - text: Immunity from legal process for words spoken or written in their official capacity.
        why: Tempting because it is a core protection, but it is an immunity from jurisdiction, not a privilege.
      - text: Not paying tax on UN employment income in the country where they are posted.
        correct: true
        why: Correct — the lecturer gives the tax exemption on UN employment income as an example of the privileges IOs enjoy alongside their immunities.
      - text: Inviolability of their papers and documents.
        why: Tempting because it is a special protection, but inviolability of papers is part of the immunities regime, not the privilege example given.
  - key: q613
    type: mcq
    concept: immunities-of-international-organisations
    difficulty: 3
    stem: A former UN employee claims she was wrongfully dismissed. The UN relies on its immunity in the local courts. What does the 1946 Convention require of the UN in such private law disputes?
    options:
      - text: That it provide an alternative mode of settlement, usually an arbitration clause in the contract.
        correct: true
        why: Correct — the lecturer says the UN must provide alternative modes of settlement for private law matters such as employment contracts, usually through arbitration clauses.
      - text: That it automatically waive immunity for any employment claim brought by its own staff.
        why: Tempting because employment is excluded from state immunity for commercial transactions, but the UN keeps its immunity and must instead provide an alternative forum.
      - text: That the host state's labour tribunal decide the dispute, with the UN bound to comply with its orders.
        why: Tempting because local tribunals usually hear such claims, but that would defeat UN immunity; the Convention requires an alternative mode of settlement.
  - key: q614
    type: mcq
    concept: immunities-of-international-organisations
    difficulty: 3
    stem: When may the UN Secretary-General waive an official's immunity, according to the lecture?
    options:
      - text: Only with the unanimous approval of the Security Council.
        why: Tempting because the Council is the UN's executive organ, but the lecturer attributes the decision to the Secretary-General alone.
      - text: Where not waiving would impede the course of justice and waiver is possible without prejudice to the UN's interests.
        correct: true
        why: Correct — the lecturer says the Secretary-General may waive where immunity would impede justice and waiver would not prejudice the UN; it is regularly done for car accidents.
      - text: Whenever the host state requests it in writing through diplomatic channels.
        why: Tempting because host states often ask, but a request alone is not the test; the two conditions concern justice and the UN's interests.
      - text: Never — the immunity of UN officials is absolute and cannot be waived by anyone.
        why: Tempting because UN immunity is broad, but waiver is possible; it has been done for car accidents and for UN police shown to be responsible for rape.
  - key: q615
    type: mcq
    concept: immunities-of-international-organisations
    difficulty: 2
    stem: What happened when victims of the 2010 Haiti cholera outbreak sued the UN in US courts?
    options:
      - text: The UN accepted legal responsibility and settled, so the immunity question never arose.
        why: Tempting because the Secretary-General apologised, but the UN has not accepted legal responsibility.
      - text: In 2016 US federal courts upheld the UN's immunity.
        correct: true
        why: Correct — the slide says that in 2016 US federal courts upheld the UN's immunity, although a UN-appointed panel had found a peacekeepers' camp a likely cause.
      - text: The courts lifted the UN's immunity because nearly 10,000 people died and the harm was foreseeable.
        why: Tempting because the scale of harm was huge, but the courts maintained the UN's immunity — an example of the accountability gap.
  - key: q616
    type: mcq
    concept: immunities-of-international-organisations
    variant-of: q615
    difficulty: 3
    stem: What did the Mothers of Srebrenica litigation decide about the UN, and what happened next?
    options:
      - text: The Dutch Supreme Court (2012) and the ECtHR (2013) recognised UN immunity; the case continued against the Netherlands alone.
        correct: true
        why: Correct — both decisions recognised UN immunity before domestic courts; the claim then went on against the Netherlands, found partially responsible in 2019.
      - text: The ECtHR held the UN liable for failing to prevent the genocide, overruling the Dutch courts.
        why: Tempting because the ECtHR hears rights claims, but it confirmed the Dutch Supreme Court's recognition of UN immunity.
      - text: The ICJ lifted the UN's immunity in the Dutch proceedings because the Bosnian Serb operation in Srebrenica amounted to genocide.
        why: Tempting because the ICJ did find genocide, but that was in separate proceedings; the immunity question was decided by the Dutch courts and the ECtHR.
  - key: q617
    type: truefalse
    set: quickfire
    concept: immunities-of-international-organisations
    statement: The immunities of international organisations are based on customary international law, like state immunity.
    answer: false
    why: False — the lecturer says IO immunities are based on treaty law, such as the 1946 Convention on the Privileges and Immunities of the UN, not on customary law.
  - key: q618
    type: truefalse
    set: quickfire
    concept: immunities-of-international-organisations
    statement: Under the 1946 Convention, the premises of the United Nations are inviolable.
    answer: true
    why: True — art II s 3 provides that the premises of the United Nations shall be inviolable, closely resembling the protection of diplomatic premises.
  - key: q619
    type: truefalse
    set: quickfire
    concept: immunities-of-international-organisations
    statement: In the Srebrenica litigation the Dutch Supreme Court later found the Netherlands partially responsible.
    answer: true
    why: True — after the claim against the UN failed on immunity, the case continued against the Netherlands, which the Dutch Supreme Court in 2019 found partially responsible.
  - key: q620
    type: short
    concept: immunities-of-international-organisations
    difficulty: 3
    prompt: |
      Explain the basis and scope of the immunities of the United Nations, and assess the accountability problems they
      create, using the Haiti cholera outbreak and the Srebrenica litigation.
    model: |
      International organisations enjoy immunity so they can carry out their functions without interference from host
      states and be treated alike across countries. Unlike state immunity, their immunities rest on treaty law granted by
      states. UN Charter art 105 gives the UN the privileges and immunities necessary for the fulfilment of its purposes,
      and member representatives and officials those necessary for the independent exercise of their functions. The 1946
      Convention on the Privileges and Immunities of the UN defines them: the UN, its property and assets are immune from
      every form of legal process unless expressly waived, and no waiver extends to execution (art II s 2); its premises
      and archives are inviolable (ss 3–4). Representatives (art IV), officials (art V s 18) and experts on missions (art
      VI) have functional immunity only.

      Accountability is the problem. The UN must provide alternative modes of settling private claims, and the
      Secretary-General can waive officials' immunity. But after the 2010 Haiti cholera outbreak, which killed nearly
      10,000 people, the UN apologised without accepting legal responsibility and US federal courts upheld its immunity
      in 2016. In Mothers of Srebrenica the Dutch Supreme Court (2012) and the ECtHR (2013) recognised UN immunity, so
      victims could proceed only against the Netherlands.
    rubric:
      - id: r1
        criterion: Explains the functional rationale and treaty basis of IO immunities.
        marks: 2
        top-band: Contrasts the treaty basis with customary state immunity and explains uniform treatment across countries.
        margin-note: Good contrast with state immunity.
        authorities: [un-charter-art-105]
      - id: r2
        criterion: Describes the scope of UN immunity under the 1946 Convention.
        marks: 2
        top-band: Covers art II ss 2–4 (including no waiver for execution) and the functional immunities in arts IV–VI.
        margin-note: Accurate and complete.
        authorities: [cpiun-art-ii-ss-2-4, cpiun-arts-iv-vi]
      - id: r3
        criterion: Identifies the accountability mechanisms.
        marks: 1
        top-band: Notes alternative modes of settlement and the Secretary-General's waiver.
        margin-note: Shows the regime's safety valves.
        authorities: [cpiun-s-29]
      - id: r4
        criterion: Uses Haiti and Srebrenica to assess the accountability gap.
        marks: 3
        top-band: States the outcomes (2016 US courts; 2012 Dutch Supreme Court and 2013 ECtHR) and the shift to the Netherlands' responsibility.
        margin-note: Strong evaluation grounded in the case studies.
        authorities: []

  # ---------- Part B lecture additions: diplomatic-and-consular-immunities ----------
  - key: q621
    type: mcq
    concept: diplomatic-and-consular-immunities
    difficulty: 1
    stem: In diplomatic law, which state is the 'receiving state'?
    options:
      - text: The state where the mission's staff are posted, which must accord them privileges and immunities.
        correct: true
        why: Correct — the lecture defines the receiving (or host) state as the state where the diplomatic staff are posted; the VCDR sets out its obligations towards the mission.
      - text: The state the staff come from and represent, which alone may waive their immunity.
        why: "Tempting because both states appear throughout the VCDR, but this describes the sending state: the state the staff originate from, and the one that can waive their immunity."
      - text: Any state through whose territory a diplomat passes on the way to a posting abroad.
        why: Tempting because diplomats do travel through other states, but the lecture's two terms are the receiving state, where staff are posted, and the sending state they come from.
  - key: q622
    type: mcq
    concept: diplomatic-and-consular-immunities
    difficulty: 2
    stem: According to the Part B lecture, why do diplomatic missions need a special protective regime?
    options:
      - text: Their staff and premises sit inside another state's jurisdiction, with few resources for security.
        correct: true
        why: Correct — the lecturer explains that missions operate in foreign territory, inside another state’s jurisdiction, with few means of their own to ensure security, so they are particularly vulnerable.
      - text: The mission premises become the sending state's territory, where the receiving state's law cannot run.
        why: "Tempting because inviolability keeps local police out, but the lecture's point is the reverse: the premises remain inside the receiving state's jurisdiction, which is exactly why they need protection."
      - text: Before 1961 diplomats had no protection at all, so the VCDR had to create it from nothing.
        why: Tempting because the VCDR dates from 1961, but the slides say the regime was previously governed by customary international law or bilateral treaties; the convention codified it.
  - key: q623
    type: mcq
    concept: diplomatic-and-consular-immunities
    verify: true
    difficulty: 3
    stem: A diplomatic agent refuses to pay her dry cleaner, who sues her in the receiving state. On the reading of VCDR art 31(c) in Tabion v Mufti (US Court of Appeals, 1996), as the lecture described it, is she immune?
    options:
      - text: No — any private contract a diplomat makes is commercial activity outside her official functions.
        why: Tempting because dry cleaning is a private, paid service, but on Tabion v Mufti the exception targets the diplomat’s own professional or commercial activity, not everyday purchases.
      - text: Yes — contracts for everyday goods and services incidental to daily life fall outside the exception.
        correct: true
        why: Correct — the lecture says Tabion v Mufti held that the professional or commercial activity exception does not cover contracts incidental to a diplomat’s daily life, such as dry cleaning, so immunity remains.
      - text: Yes — a diplomatic agent is immune from every civil claim in the receiving state, without exception.
        why: "Tempting because the answer is 'immune', but the reason is wrong: art 31 has three civil exceptions, and immunity holds here only because a dry-cleaning contract falls outside the third."
  - key: q624
    type: mcq
    concept: diplomatic-and-consular-immunities
    difficulty: 3
    stem: Which claim against a diplomatic agent falls within the art 31(c) exception, as the lecture explained it?
    options:
      - text: Damage caused when the agent's car hits a fence on the way to an official meeting.
        why: Tempting because it is a private-law claim, but driving to an official meeting is not professional or commercial activity outside official functions; none of the three art 31 exceptions fits.
      - text: A supplier's claim on a contract the agent signed for the mission's office supplies.
        why: Tempting because buying supplies is commercial, but the agent acted for the mission within official functions; art 31(c) covers the agent’s own activity outside those functions.
      - text: Unpaid fees for private tutoring the agent gives after hours.
        correct: true
        why: Correct — paid professional services outside the mission are the clear case the lecture gives (a diplomat who also works as a teacher), so there is no civil immunity for this claim.
  - key: q625
    type: mcq
    concept: diplomatic-and-consular-immunities
    difficulty: 2
    stem: How does a diplomatic agent's immunity from criminal jurisdiction compare with immunity from civil jurisdiction under VCDR art 31?
    options:
      - text: Both are absolute until the receiving state declares the agent persona non grata.
        why: Tempting because persona non grata is the main response to abuse, but it revokes credentials rather than removing immunity, and civil immunity already has three exceptions.
      - text: Criminal immunity is absolute; only civil and administrative immunity has exceptions.
        correct: true
        why: Correct — the lecturer stresses that criminal immunity is absolute, while art 31 lists three exceptions (private immovable property, private succession, outside professional or commercial activity) to civil and administrative immunity.
      - text: Criminal immunity yields for a grave crime, while civil immunity is complete.
        why: Tempting because 'grave crime' appears in the materials, but that is the consular rule in VCCR art 41; a diplomat's criminal immunity has no such exception.
      - text: Criminal immunity covers official acts only, while civil immunity covers private acts too.
        why: Tempting because it echoes functional immunity, but a diplomatic agent has personal immunity (ratione personae) from criminal jurisdiction, which covers private acts as well.
  - key: q626
    type: mcq
    concept: diplomatic-and-consular-immunities
    difficulty: 3
    stem: A diplomatic agent openly funds a protest movement against the receiving state's government, breaching VCDR art 41. Does the breach remove the agent's immunity?
    options:
      - text: Yes — interfering in internal affairs is an abuse that ends the immunity automatically under the VCDR.
        why: Tempting because art 41 imposes a real duty, but breaching it does not strip immunity; the VCDR’s answer to abuse is persona non grata or another response, not prosecution.
      - text: No — art 41 does not cancel immunity; the receiving state must respond another way, e.g. persona non grata.
        correct: true
        why: "Correct — the lecturer notes the art 41 duties are without prejudice to the immunities, and the slides list the responses to abuse when no exception applies: persona non grata, severance, unfriendly acts, nothing or waiver."
      - text: Yes, but only once the receiving state's courts find that the interference was serious enough.
        why: Tempting because it sounds measured, but the receiving state's courts have no jurisdiction to make that finding while the agent is immune; the remedies lie outside the courts.
  - key: q627
    type: mcq
    concept: diplomatic-and-consular-immunities
    difficulty: 2
    stem: How did the Part B lecture distinguish a consul's role from a diplomat's?
    options:
      - text: Consuls deal with administrative, often private, matters such as passports; diplomats with political relations.
        correct: true
        why: Correct — the lecture explains consuls act for the sending state in administrative and technical matters (passports, legal help for nationals), while the political relationship is the diplomats’ work, usually from the capital.
      - text: Consuls conduct the political relationship from the capital, while diplomats serve nationals in other big cities.
        why: "Tempting because both work for the sending state, but this reverses the roles: in Australia the embassies sit in Canberra and handle political relations, while consulates in Sydney or Melbourne serve nationals."
      - text: Consuls represent international organisations in a state, while diplomats represent the states themselves.
        why: Tempting because IO officials also have immunities this week, but consuls represent the sending state; the immunities of IO officials come from the 1946 Convention, not the VCCR.
  - key: q628
    type: mcq
    concept: diplomatic-and-consular-immunities
    cases:
      - united-states-diplomatic-and-consular-staff-in-tehran-united-states-of-america-v-iran
    difficulty: 3
    stem: In Tehran Hostages the US Embassy was seized by militants who were not Iranian officials. Why was Iran nonetheless in breach of the VCDR?
    options:
      - text: Everything done on Iranian territory is automatically attributed to Iran under international law.
        why: Tempting because the seizure happened in Iran, but the lecture stresses the students were not part of the state; the breach was Iran’s own failure to protect, not the militants’ acts.
      - text: The US diplomats had been declared persona non grata, but Iran failed to follow the art 9 procedure.
        why: Tempting because art 9 is the lawful route for removing diplomats, but nothing in the case turned on persona non grata; the breach was Iran's failure to protect the mission under art 22.
      - text: "Its own inaction: it knew the duty and the urgency, had the means to act, and did not protect the mission."
        correct: true
        why: "Correct — as the lecture explains the judgment, Iran’s own inaction was the breach: its authorities knew their obligation, knew from appeals that action was urgent, had the means, and did nothing, violating art 22."
  - key: q629
    type: mcq
    concept: diplomatic-and-consular-immunities
    cases:
      - united-states-diplomatic-and-consular-staff-in-tehran-united-states-of-america-v-iran
    difficulty: 2
    stem: What kind of obligation does VCDR art 22(2) impose on the receiving state, on the lecture's reading of Tehran Hostages?
    options:
      - text: "Only a negative duty: its own police and officials must stay off the premises."
        why: Tempting because inviolability does bar entry without the head of mission's consent, but art 22(2) adds a duty to protect against intrusion by others, which Iran breached through inaction.
      - text: A positive duty to take active steps to protect the mission.
        correct: true
        why: "Correct — the lecturer stresses the duty to protect is not merely passive: the receiving state must take positive steps to protect missions on its territory, which Iran failed to do."
      - text: A duty that arises only once the sending state asks in writing for police protection.
        why: Tempting because the embassy staff did call for help in Tehran, but art 22(2) states the duty to protect the premises without any such condition; it does not wait for a request.
  - key: q630
    type: mcq
    concept: diplomatic-and-consular-immunities
    difficulty: 2
    stem: Of the responses to abuse of diplomatic immunity listed in the lecture, which can only come from the sending state?
    options:
      - text: Declaring the diplomat persona non grata under VCDR art 9.
        why: Tempting because persona non grata is the best-known response, but it is the receiving state that declares a person's presence unacceptable and revokes their credentials under art 9.
      - text: Choosing to do nothing and let the matter go.
        why: Tempting because inaction is on the list, but doing nothing is a choice the receiving state makes when faced with an abuse; it is not reserved to the sending state.
      - text: Waiver of the diplomat's immunity.
        correct: true
        why: "Correct — the slides mark waiver as 'by the sending state', and the lecturer stresses it is not an option for the receiving state: only the sending state can waive its representative's immunity."
  - key: q631
    type: mcq
    concept: diplomatic-and-consular-immunities
    variant-of: q508
    difficulty: 2
    stem: Canberra police want to search a car belonging to a foreign embassy, parked in a public street. What applies?
    options:
      - text: The car is outside the mission premises, so it can be searched like any other car on a public road.
        why: Tempting because inviolability is usually pictured as the embassy building, but the slides extend immunity from search to the mission’s means of transportation, not just the premises.
      - text: The mission's means of transport are immune from search, so the car may not be searched.
        correct: true
        why: Correct — the slides list the mission's means of transportation with its premises, furnishings and archives as immune from search, requisition, attachment and execution; the lecturer's example is Canberra's diplomatic cars.
      - text: The car may be searched if a member of the service staff, not a diplomat, is driving it.
        why: Tempting because service staff have narrower personal immunity, but the immunity from search attaches to the mission's property, including its transport, not to the driver's status.
  - key: q632
    type: truefalse
    concept: diplomatic-and-consular-immunities
    difficulty: 2
    statement: A diplomatic agent's immunity from the receiving state's criminal jurisdiction is subject to the same three exceptions as civil jurisdiction under VCDR art 31.
    answer: false
    why: False — the lecturer stresses that criminal immunity is absolute; the three art 31 exceptions (private immovable property, private succession, outside professional or commercial activity) apply only to civil and administrative jurisdiction.
  - key: q633
    type: truefalse
    concept: diplomatic-and-consular-immunities
    difficulty: 1
    cases:
      - united-states-diplomatic-and-consular-staff-in-tehran-united-states-of-america-v-iran
    statement: In Tehran Hostages, the United States claimed that Iran had breached the Vienna Convention on Consular Relations as well as the VCDR.
    answer: true
    why: True — the slides and the lecture both say the US claimed violations of the VCDR and the VCCR, since consular officials were among the more than 50 people held hostage.
  - key: q634
    type: truefalse
    concept: diplomatic-and-consular-immunities
    difficulty: 2
    statement: Like a diplomatic agent, a consul enjoys personal immunity (ratione personae) from the receiving state's criminal jurisdiction.
    answer: false
    why: "False — under VCCR art 43 a consul has immunity ratione materiae only, in criminal and civil matters, and limited inviolability: arrest for a grave crime is possible (art 41)."

