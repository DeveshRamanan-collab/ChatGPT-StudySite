cards:
  - type: basic
    concept: state-immunity-foundations
    front: What does 'immunities' refer to in international law?
    back: Instances where a state's adjudicatory and enforcement jurisdiction cannot be exercised as normal because another foreign state (or a foreign state representative) is involved in the case.
    source: Week 06 Lecture Slides, slide 3
  - type: cloze
    concept: state-immunity-foundations
    text: "State immunity is grounded in {{c1::sovereign equality}}: states are juridically equal, so no state may exercise jurisdiction over another without {{c2::consent}}."
    source: Week 06 Lecture Slides, slide 5
  - type: basic
    concept: state-immunity-foundations
    front: Immunity from adjudication vs immunity from enforcement?
    back: Adjudication — a state cannot be sued before a foreign court unless it consents. Enforcement — a judgment already rendered cannot be enforced upon the state (e.g. confiscating assets).
    source: Week 06 Lecture Slides, slide 6
  - type: cloze
    concept: state-immunity-foundations
    text: "The 2004 UN Convention on Jurisdictional Immunities needs {{c1::30}} ratifications and has {{c2::25}}, so state immunity is still governed by {{c3::customary international law}}."
    source: Week 06 Lecture Slides, slide 7; Lecture (Live) 00:08:22–00:09:33
  - type: basic
    concept: state-immunity-foundations
    front: Under arts 7–9 of the 2004 Convention, how does a state lose immunity?
    back: Express consent, e.g. by agreement (art 7); participating in court proceedings (art 8); counterclaims arising from proceedings it initiated or participated in (art 9).
    source: Week 06 Lecture Slides, slide 8
  - type: apply
    concept: state-immunity-foundations
    scenario: A state defends a claim in a foreign court for a year, loses, then claims immunity to resist the judgment.
    answer: No immunity — by participating it waived immunity (art 8), and a waiver cannot be reclaimed after an adverse judgment.
    source: Week 06 Lecture (Live), 00:11:31–00:12:48
  - type: basic
    concept: restrictive-state-immunity
    front: Acta jure imperii vs acta jure gestionis?
    back: "Jure imperii — acts of a sovereign nature (foreign and military affairs, legislation, police power, administration of justice): immune. Jure gestionis — non-sovereign, commercial acts: not immune."
    source: Week 06 Lecture Slides, slide 11
  - type: basic
    concept: restrictive-state-immunity
    front: What did Trendex v Central Bank of Nigeria (1977) decide?
    back: The English Court of Appeal rejected immunity for the Central Bank of Nigeria, which failed to honour a letter of credit — an organ of the state, but a commercial transaction.
    source: Week 06 Lecture Slides, slide 11
  - type: cloze
    concept: restrictive-state-immunity
    text: "Under art 2(2), whether a transaction is commercial depends primarily on its {{c1::nature}}; its {{c2::purpose}} counts only if the parties so agreed."
    source: Week 06 Lecture Slides, slide 15
  - type: apply
    concept: restrictive-state-immunity
    scenario: Cuba's state shipping company, contracted to deliver sugar to Chile, diverts its ships after a coup in Chile, claiming a foreign-policy motive.
    answer: Playa Largo (1983) — the activity was commercial (jure gestionis) by nature, so no immunity despite the political purpose.
    source: Week 06 Lecture Slides, slide 16
  - type: basic
    concept: restrictive-state-immunity
    front: What are the conditions of the art 12 exception (injury and property damage)?
    back: Pecuniary compensation for death, injury or damage to tangible property; act or omission attributable to the state; occurring at least partly in the forum state; author present there at the time. Material damage only.
    source: Week 06 Lecture Slides, slide 17; Lecture (Live) 00:29:46–00:31:21
  - type: cloze
    concept: restrictive-state-immunity
    text: "A contract of {{c1::employment}} is excluded from the definition of commercial transaction in art 2(1)(c); whether a {{c2::profit}} is made is irrelevant."
    source: Week 06 Lecture Slides, slide 13; Lecture (Live) 00:24:10–00:24:25
  - type: basic
    concept: immunities-of-state-officials
    front: Functional immunity (ratione materiae) — key features?
    back: Attaches to official acts done while in office with official authority ('under the colour of authority'); continues after office; customary law; waivable only by the state.
    source: Week 06 Lecture Slides, slide 24
  - type: basic
    concept: immunities-of-state-officials
    front: Personal immunity (ratione personae) — key features?
    back: Complete, even for private acts; only very high-ranking officials (heads of state, heads of government, foreign ministers); only while in office; waivable by the state.
    source: Week 06 Lecture Slides, slide 24
  - type: apply
    concept: immunities-of-state-officials
    scenario: A sitting foreign head of state kills someone while drink-driving on holiday in Australia, and is later back in Australia after leaving office.
    answer: While in office — personal immunity bars Australian courts (their own state could try them). After office — no immunity, as a private act is not covered by functional immunity.
    source: Week 06 Lecture (Live), 00:44:30–00:46:37
  - type: cloze
    concept: immunities-of-state-officials
    text: "In Arrest Warrant the ICJ said a foreign minister's immunities are not granted for their {{c1::personal benefit}}, but to ensure the effective performance of their {{c2::functions}}."
    source: Week 06 Lecture Slides, slide 22
  - type: basic
    concept: immunity-and-serious-international-crimes
    front: What did Germany v Italy (2012) hold?
    back: Custom did not deprive Germany of immunity in Italian civil proceedings for WWII crimes by its forces; immunity is procedural and distinct from substantive law (para 93) and covers armed forces' acts in armed conflict even on the forum's territory (para 77).
    source: Week 06 Lecture Slides, slides 19–20
  - type: basic
    concept: immunity-and-serious-international-crimes
    front: Arrest Warrant — four routes by which immunity is not impunity?
    back: (1) Prosecution in the official's own state; (2) waiver by their state; (3) other states once they leave office, for acts before/after office and private acts during it; (4) international criminal courts with jurisdiction.
    source: Week 06 Lecture Slides, slide 26
  - type: apply
    concept: immunity-and-serious-international-crimes
    scenario: A former head of state is arrested abroad on an extradition request for torture committed in office; all states involved are parties to the Convention against Torture.
    answer: Pinochet (No 3) (1999) — no immunity for a former head of state for acts that were international crimes subject to universal jurisdiction at the time.
    source: Week 06 Lecture Slides, slide 27; Supplemental Lecture 00:01:05–00:03:07
  - type: cloze
    concept: immunity-and-serious-international-crimes
    text: "ILC draft article 7 (2017) would exclude immunity for genocide, crimes against humanity, war crimes, {{c1::torture}} and {{c2::enforced disappearances}}."
    source: Week 06 Lecture Slides, slide 27
  - type: basic
    concept: diplomatic-and-consular-immunities
    front: VCDR art 31 — scope of a diplomatic agent's immunity?
    back: Full immunity from criminal jurisdiction; civil and administrative immunity except (a) private immovable property, (b) private succession, (c) professional or commercial activity outside official functions.
    source: Week 06 Lecture Slides, slide 31
  - type: cloze
    concept: diplomatic-and-consular-immunities
    text: "VCDR art {{c1::29}}: the person of a diplomatic agent is inviolable. Art {{c2::30}}: the private residence, papers and correspondence are inviolable. Art {{c3::41}}: the duty to respect local law."
    source: Week 06 Lecture Slides, slide 32
  - type: apply
    concept: diplomatic-and-consular-immunities
    scenario: A person wanted for extradition takes refuge in a foreign embassy; the receiving state's police want to go in and arrest him.
    answer: VCDR art 22 — the premises are inviolable and may not be entered without the head of mission's consent, whoever is inside (the Assange tutorial).
    source: Week 06 Lecture Slides, slide 34; Tutorial Task (Julian Assange), Q3
  - type: basic
    concept: diplomatic-and-consular-immunities
    front: How are consular immunities (VCCR 1963) narrower than diplomatic ones?
    back: Limited personal inviolability — a consul can be arrested for a 'grave crime' (art 41); immunity ratione materiae only in criminal and civil matters (art 43).
    source: Week 06 Lecture Slides, slide 33
  - type: basic
    concept: diplomatic-and-consular-immunities
    front: Responses to abuse of diplomatic immunity?
    back: Persona non grata (VCDR art 9); severance or breach of diplomatic relations; other 'unfriendly acts'; nothing; waiver of immunity by the sending state.
    source: Week 06 Lecture Slides, slide 37
  - type: basic
    concept: immunities-of-international-organisations
    front: What does UN Charter art 105 provide?
    back: (1) The UN enjoys in its Members' territory the privileges and immunities necessary for the fulfilment of its purposes; (2) member representatives and UN officials enjoy those necessary for the independent exercise of their functions.
    source: Week 06 Lecture Slides, slide 40
  - type: cloze
    concept: immunities-of-international-organisations
    text: "Under art II s 2 of the 1946 Convention the UN is immune from every form of legal process unless it has {{c1::expressly waived}} its immunity, and no waiver extends to any measure of {{c2::execution}}."
    source: Week 06 Lecture Slides, slide 42
  - type: apply
    concept: immunities-of-international-organisations
    scenario: Victims of a cholera epidemic linked to a UN peacekeepers' camp sue the UN in a national court.
    answer: The court is likely to uphold UN immunity — as US federal courts did in 2016 over the 2010 Haiti outbreak; the UN apologised but accepted no legal responsibility.
    source: Week 06 Lecture Slides, slide 43
  - type: basic
    concept: immunities-of-international-organisations
    front: How do IO immunities differ in source and scope from state immunity?
    back: IO immunities rest on treaty law granted by states (e.g. the 1946 Convention), not custom; officials have functional immunity only, for acts in their functions.
    source: Week 06 Lecture (Online), 00:02:30–00:03:55

  # ---------- Part B lecture additions ----------
  - type: basic
    concept: diplomatic-and-consular-immunities
    front: "Receiving state and sending state: which is which?"
    back: "Receiving (host) state: where the mission's staff are posted; it owes them the VCDR's privileges, immunities and protection. Sending state: the state the staff come from and represent; only it can waive their immunity."
    source: Week 06 Lecture Slides, slides 29 and 37; Week 06 Lecture Transcript (Online), Part B
  - type: basic
    concept: diplomatic-and-consular-immunities
    front: "Tabion v Mufti (US Court of Appeals, 1996): what did it decide about VCDR art 31(c)?"
    back: The professional or commercial activity exception does not cover contracts for goods and services incidental to a diplomat's daily life (e.g. dry cleaning), so immunity remains for those disputes.
    source: Week 06 Lecture Transcript (Online), Part B
    verify: true
  - type: apply
    concept: diplomatic-and-consular-immunities
    scenario: A diplomat posted to Canberra is paid to teach evening classes at a private college; the college sues her over the teaching contract.
    answer: "VCDR art 31(c): paid work outside official functions is professional or commercial activity, so there is no civil immunity for this claim (the lecture's teacher example)."
    source: Week 06 Lecture Slides, slide 31; Week 06 Lecture Transcript (Online), Part B
  - type: cloze
    concept: diplomatic-and-consular-immunities
    text: "In Tehran Hostages, Iran breached VCDR art {{c1::22}} through its own {{c2::inaction}}: it knew of its duty, knew action was urgent and had the {{c3::means}} to act, yet did nothing."
    source: Week 06 Lecture Slides, slides 34 and 36; Week 06 Lecture Transcript (Online), Part B
  - type: basic
    concept: diplomatic-and-consular-immunities
    front: Is the duty to protect a mission (VCDR art 22(2)) only a duty to stay out?
    back: "No. It is positive as well as negative: the receiving state must take active steps to protect the premises and staff against intrusion, as Iran failed to do in Tehran Hostages."
    source: Week 06 Lecture Slides, slide 34; Week 06 Lecture Transcript (Online), Part B

audio:
  title: "Week 6 recap — immunities"
  minutes: 3
  script: |
    This week is about the times a state can't use its courts as normal because another state, or someone
    representing it, is involved. There are separate regimes, with separate conditions, so always start by asking
    who is claiming immunity.

    State immunity comes from sovereign equality. States are juridically equal, so one can't sit in judgment on
    another without its consent. It bars adjudication — the state can't be sued — and enforcement — its assets can't
    be seized. It's procedural, so it says nothing about whether the conduct was lawful. The source is custom. The
    2004 UN Convention has twenty-five of the thirty ratifications it needs, so we use its articles as a guide only.
    A state loses immunity by express consent, by taking part in the proceedings, or on a counterclaim.

    Immunity used to be absolute. Now it's restrictive. Sovereign acts, jure imperii, are immune; commercial acts,
    jure gestionis, aren't. Trendex: a central bank that failed to honour a letter of credit got no immunity. We look
    at the nature of the transaction, not its purpose — so in Playa Largo, Cuba's politically motivated diversion of a
    sugar ship was still commercial. Article twelve adds personal injury and property damage in the forum state.

    But seriousness alone doesn't remove immunity. In Germany v Italy the ICJ upheld Germany's immunity in civil
    claims over Second World War crimes, because immunity is procedural and distinct from the substantive law.

    State officials have two immunities. Functional immunity, ratione materiae, covers official acts and survives
    office. Personal immunity, ratione personae, covers everything, even private acts, but only for heads of state,
    heads of government and foreign ministers, and only while they're in office. Only the state can waive either. In
    Arrest Warrant, Belgium's warrant for a sitting Congolese foreign minister breached his immunity — but immunity
    isn't impunity: he could be tried at home, after waiver, after leaving office, or before an international court.
    And in Pinochet the House of Lords held a former head of state had no immunity for torture under the Convention
    against Torture. The ILC's draft article seven would go further, but that's still debated.

    Diplomats sit under the Vienna Convention of 1961. Article thirty-one gives full criminal immunity and civil
    immunity with three private exceptions; the diplomat's person and home are inviolable, and so is the embassy — no
    entry without the ambassador's consent, which is the answer to the Assange question. Consuls get less. Abuse is
    met by persona non grata, not arrest.

    Finally, international organisations: treaty-based, functional immunities, from Charter article one hundred and
    five and the 1946 Convention. Haiti and Srebrenica show the accountability gap that leaves.
