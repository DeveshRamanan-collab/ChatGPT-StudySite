  summary: |-
    'Immunities' refers to instances where a state's adjudicatory and enforcement jurisdiction cannot be exercised as
    normal because another foreign state (or a foreign state representative) is involved in the case, and the week
    keeps three regimes apart: state immunity (customary international law, now restrictive, so sovereign acts jure
    imperii are immune but commercial acts jure gestionis are not), the immunities of state officials (functional
    immunity ratione materiae for official acts, which survives office, and personal immunity ratione personae for
    the highest officials, which covers everything but ends with office), and diplomatic, consular and international
    organisation immunities, which rest on treaties (the VCDR 1961, the VCCR 1963, the UN Charter art 105 and the 1946
    Convention on the Privileges and Immunities of the United Nations). Because immunity is procedural, Germany v Italy
    (2012) and the Arrest Warrant case (2002) hold that it still applies to grave breaches of international law,
    although immunity does not mean impunity and Pinochet (1999) and the ILC's 2017 draft article 7 point to emerging
    exceptions to functional immunity for international crimes. For the exam, first identify who is claiming immunity
    and under which regime, then ask whether the act is sovereign or commercial (states), official or private and
    whether the person is still in office (officials), or which VCDR article applies (diplomats), before asking
    whether any exception or waiver removes it.
  notes: |
    ## Immunities: overview

    'Immunities' refers to instances where a State's adjudicatory and enforcement jurisdiction cannot be exercised as
    normal because another foreign State (or a foreign State representative) are involved in the case.

    - **Part A.** 1st: state immunity — sovereign acts, *acta jure imperii* (absolute immunity); commercial acts,
      *acta jure gestionis* (restricted immunity). 2nd: immunity of state representatives — personal immunity
      (*ratione personae*) and functional immunity (*ratione materiae*).
    - **Part B.** 3rd: diplomatic immunities — special protections given to ambassadors, embassy staff and embassy
      premises (Vienna Convention on Diplomatic Relations). Then the immunities of international organisations.

    :::examtip
    The lecture stresses that these are clearly divided into categories because they are governed by different
    regimes of international law, and different conditions apply. Keep them apart in an answer.
    :::

    ## State immunity

    The international law of immunities sets limits on when a state may exercise jurisdiction within its own
    territory. Grounded in the fundamental principle of sovereign equality, which reflects the independence of states
    => also juridically equal, therefore no state may exercise jurisdiction over another without consent. That is, the
    domestic courts of one state may decline to exercise jurisdiction if the respondent in the case is another state
    (incl. cases concerning foreign states' officials or property). Originally, state immunity was considered to be
    absolute; that is not so much the case anymore.

    **Immunity from adjudicative jurisdiction vs immunity from enforcement jurisdiction.** Adjudicative jurisdiction
    relates to the power of a court to adjudicate on a matter — to look into the merits of the subject matter and
    render a decision based on the applicable legal rules and principles. Enforcement jurisdiction concerns the
    implementation of whatever judgment is rendered, so the question of enforcing arises only after (a) adjudicative
    jurisdiction has been established and (b) a judgment entailing some sort of enforcement measures (e.g.
    confiscation of certain assets) is rendered. In practice, state immunity from adjudication means that a state
    cannot be sued before a foreign court unless it gives its consent; state immunity from enforcement means that the
    judgment which has been rendered cannot be enforced upon the state due to immunity. Prescriptive jurisdiction is
    not affected.

    :::rule
    Immunity acts as a procedural barrier to a court's adjudicatory jurisdiction. State immunity is a principle of
    customary international law — a principle well established in State practice and in the jurisprudence of
    national and international courts.
    :::

    There have been a few efforts to codify this understanding: initial work by the International Law Commission
    (ILC), Draft Articles on Jurisdictional Immunities of States and their Property (1991), resulted in the UN
    Convention on Jurisdictional Immunities of States and their Property (2004), which comes into force once there are
    30 ratifications (as of 2026, 25 ratifications/accessions have been received). The convention is not yet in
    force, so the rules are customary international law; the lecture refers to its articles because they mostly
    reflect custom.

    :::statute
    UN Convention on Jurisdictional Immunities of States and their Property (2004). Art 5: "A State enjoys immunity,
    in respect of itself and its property, from the jurisdiction of the courts of another State". Art 6: modalities
    for giving effect to state immunity (refraining from exercising jurisdiction before its courts). Art 7: no
    immunity if the state expressly consents to the exercise of foreign jurisdiction (e.g. by agreement). Art 8: no
    immunity if the state participates in court proceedings. Art 9: no immunity in counterclaims (arising from
    proceedings initiated by a state or otherwise participated in).
    :::

    Once a state has waived its immunity — in writing or by participating in the proceeding — it cannot claim
    immunity at the end when the judgment goes against it.

    :::definition
    Definition of "State", art 2(1)(b): the State and its various organs of government; constituent units of a
    federal State or political subdivisions of the State that are entitled to perform acts in the exercise of the
    sovereign authority of the State; agencies or instrumentalities of the State and other entities, to the extent
    that they are entitled to perform acts in the exercise of the sovereign authority of the State; representatives
    of the State acting in that capacity.
    :::

    **Domestic legislation.** UK: State Immunity Act 1978 (broadly consistent with the 2004 UN Convention, which was
    signed by the UK in 2005 but not yet ratified) treats State immunity as a preliminary matter (s 1(2)); there is a
    presumption that a State possesses immunity, with the plaintiff bearing the burden of proof to the contrary.
    Similar position in Australia: Foreign States Immunities Act 1985 — foreign states are in principle immune to the
    jurisdiction of Australian courts, unless and to the extent that the state has waived immunity, or the case
    concerns a commercial transaction.

    ## Sovereign acts and commercial acts

    **Distinction!** *Jure imperii*: act of a sovereign nature → immunity applies (e.g. foreign and military affairs;
    legislation, police power, administration of justice). *Jure gestionis*: act of a non-sovereign nature →
    immunity does not apply (e.g. activities of a commercial nature). Common law countries such as the UK and US
    originally saw immunity as absolute, while many civil law countries distinguished sovereign acts; common law
    decisions evolved to recognise the distinction. About one-third of states in the world, including China, still do
    not recognise it.

    :::case
    *Empire of Iran Case* (1963), Germany: the German Federal Constitutional Court found that absolute State
    immunity was no longer customary international law — distinguishing between sovereign acts (jure imperii) and
    commercial acts (jure gestionis).
    :::

    :::case
    *Trendex Trading Corporation v Central Bank of Nigeria* (1977), English Court of Appeal: the Court rejected
    immunity in proceedings against the Central Bank of Nigeria, which had failed to honour a letter of credit (for
    cement bought from Trendex). The bank was an organ of the state, but the nature of the transaction was
    commercial, not a sovereign act.
    :::

    :::statute
    UN Convention, art 10: "If a State engages in a commercial transaction with a foreign natural or juridical person
    … the State cannot invoke immunity from that jurisdiction in a proceeding arising out of that commercial
    transaction." Exceptions: commercial transactions between States; if the parties to the commercial transaction
    have expressly agreed.
    :::

    **What is a commercial transaction?** Art 2(1)(c): any commercial contract or transaction for the sale of goods or
    supply of services; any contract for a loan or other transaction of a financial nature, including any obligation
    of guarantee or of indemnity in respect of any such loan or transaction; any other contract or transaction of a
    commercial, industrial, trading or professional nature, but not including a contract of employment of persons.
    Whether there is a profit to be made is not relevant.

    **Proceedings in which state immunity cannot be invoked** (UN Convention): art 10 commercial transactions; art 11
    certain contracts of employment; art 13 rights of ownership, possession and use of property; art 14 intellectual
    and industrial property; art 15 participation in companies or other collective bodies; art 16 ships owned or
    operated by a state (unless used for government non-commercial purposes, exception for warships); art 17
    arbitration agreements relating to commercial transactions.

    **Nature or purpose?** Art 2(2): in determining whether a contract or transaction is a "commercial transaction",
    "reference should be made primarily to the nature of the contract or transaction … but its purpose should also be
    taken into account if the parties to the contract or transaction have so agreed". The classification depends
    primarily on the nature of the activity (e.g. purchasing goods or providing services), not on the broader policy
    objective; courts assess whether the activity resembles private commercial conduct, but may also consider purpose
    if the parties so agreed. This qualification raises further issues, as States generally apply public policy
    objectives in their commercial transactions. The lecture's examples: buying office supplies, or catering for an
    official function, at an embassy is a commercial transaction, whatever its official purpose.

    :::case
    *Playa Largo v I Congreso del Partido* (1983), UK House of Lords: Cuba's state-owned shipping company agreed to
    deliver sugar to Chile but was ordered to divert the ships due to political tensions after a coup in Chile. Cuba
    claimed sovereign immunity, arguing the diversion had a foreign policy objective. The House of Lords rejected the
    claim: the shipping activity was commercial (jure gestionis), not sovereign (jure imperii).
    :::

    ## Injury, damage and serious violations

    :::statute
    UN Convention, art 12 (injury to individuals and damage to property): "Unless otherwise agreed between the States
    concerned, a State cannot invoke immunity from jurisdiction before a court of another State which is otherwise
    competent in a proceeding which relates to pecuniary compensation for death or injury to the person, or damage to
    or loss of tangible property, caused by an act or omission which is alleged to be attributable to the State, if
    the act or omission occurred in whole or in part in the territory of that other State and if the author of the
    act or omission was present in that territory at the time of the act or omission."
    :::

    The lecture adds that art 12 covers material damage only, not moral damage.

    Recall: state immunity serves as a procedural legal shield that prevents national courts from exercising
    jurisdiction over foreign states. If a state is entitled to immunity, the court must dismiss the case. Will this
    hold regardless of the seriousness of the allegations made against the state — in cases involving serious human
    rights violations or grave breaches of international law?

    :::case
    *Jurisdictional Immunities of the State (Germany v Italy: Greece Intervening)* [2012] ICJ Rep 99: civil
    proceedings in Italian courts against Germany with respect to serious crimes committed by German forces against
    civilian populations and prisoners of war during the occupation of Italy in World War II (Italian courts also
    ordered measures against Villa Vigoni, German property in Italy). Germany claimed that Italian courts, and thus the
    Italian state, were violating its right to state immunity. The ICJ ruled that (as of 2012) customary international
    law did not deprive a state of immunity because of alleged serious violations of international human rights law
    and IHL.
    :::

    What about *jus cogens* norms? "The rules of State immunity are procedural in character and are confined to
    determining whether or not the courts of one State may exercise jurisdiction in respect of another … It regulates
    the exercise of jurisdiction in respect of particular conduct and is thus entirely distinct from the substantive
    law which determines whether that conduct is lawful or unlawful" (para 93). "State practice in the form of
    judicial decisions supports the proposition that State immunity for acta jure imperii continues to extend to civil
    proceedings for acts occasioning death, personal injury or damage to property committed by the armed forces and
    other organs of a State in the conduct of armed conflict, even if the relevant acts take place on the territory of
    the forum State" (para 77). Despite strong arguments that states should not be immune when committing such acts, a
    State enjoys immunity in foreign national courts — even when the case involves grave breaches of international
    law: "Powerful policy arguments may be advanced in favour of such an exception, but state practice does not, at
    present, support the existence of a rule depriving states of immunity in such circumstances" (Rose et al).

    ## Immunities of state officials

    State representatives enjoy certain immunities from national jurisdiction because they 'personify' the State on
    whose behalf they act and because they need protection from national jurisdiction in order to fulfil their
    functions as state representatives. These immunities rest on customary international law; the 2004 UN Convention
    is not relevant here.

    :::case
    *Arrest Warrant of 11 April 2000 (Democratic Republic of Congo v Belgium)* [2002] ICJ Rep 3: "In customary
    international law, the immunities accorded to Ministers for Foreign Affairs are not granted for their personal
    benefit, but to ensure the effective performance of their functions on behalf of their respective States. … he or
    she is frequently required to travel internationally, and thus must be in a position freely to do so whenever the
    need should arise."
    :::

    State officials/representatives of the state (individuals): head of state; ministers; government officials/civil
    servants. The extent of immunity offered to various representatives differs substantially depending on the office
    they hold (function they serve) and whether they acted in official capacity.

    **Functional immunity (*ratione materiae*)** — this immunity relates not to the person but to the function the
    official performs; it is about the act itself being an official act of the state.
    - Immunity only in relation to official acts taken while in office.
    - Continues after the official leaves office.
    - Based on customary international law.
    - As long as an act is performed by an individual with official authority ('under the colour of authority') it is
      an 'official' act, and for the act the individual is immune from criminal prosecution before foreign national
      courts.
    - Can be waived only with the state's consent.

    **Personal immunity (*ratione personae*)** — protection enjoyed because of the office held, personifying the
    state.
    - Complete immunity, even in relation to acts of a private nature.
    - Applies only to very high-ranking state officials (in particular heads of state, heads of government, foreign
      ministers). Heads of state and foreign ministers enjoy privileged status in international law (see *Certain
      Questions of Mutual Assistance in Criminal Matters (Djibouti v France)* 2008: the ICJ found this is customary
      international law).
    - Temporal limit: only for the duration of the official's time in office (after which they continue to enjoy
      functional immunity).
    - Can be waived by the state.

    :::examtip
    The lecture's examples: a soldier who kills an enemy soldier on the battlefield acts officially, with authority —
    functional immunity. A sitting Greek president who drives drunk on holiday in Australia and kills someone is
    covered by personal immunity (Greece's own courts could still try them); once they leave office, that private act
    is not covered by functional immunity and they could be arrested and prosecuted in Australia.
    :::

    ## Immunity and international crimes

    Would a State representative be immune from domestic criminal proceedings for alleged serious violations of
    international law, such as war crimes or crimes against humanity? Under the current state of international law,
    both functional and personal immunities continue to apply, even in cases of serious international crimes (e.g.
    war crimes, crimes against humanity, genocide) — see *Arrest Warrant*, paras 58 et seq. A Belgian court, under
    universal jurisdiction, issued an arrest warrant for the sitting Congolese foreign minister, Yerodia, accused of
    inciting hatred; the ICJ ruled that current state practice does not support the existence of an exception to
    immunity from foreign criminal jurisdiction in situations concerning the commission of international crimes. That
    case concerns an incumbent foreign minister (i.e. personal immunity).

    :::rule
    "The immunity from jurisdiction enjoyed by incumbent Ministers for Foreign Affairs does not mean that they enjoy
    impunity in respect of any crimes they might have committed … Immunity from criminal jurisdiction and individual
    criminal responsibility are quite separate concepts. While jurisdictional immunity is procedural in nature,
    criminal responsibility is a question of substantive law" (*Arrest Warrant*, paras 58–61).
    :::

    Criminal prosecution of the individual is still possible:
    1. Domestic prosecution in their own countries — such persons enjoy no criminal immunity under international law
       in their own countries.
    2. Their countries can waive their immunity.
    3. Once the individual leaves their functions, other states with jurisdiction could try them, in respect of acts
       committed before or after their period of office and for acts committed during that period of office in a
       private capacity.
    4. International criminal courts may also be able to prosecute an incumbent or former Minister for Foreign
       Affairs where they have jurisdiction, e.g. the ICTY, the ICTR and the International Criminal Court, whose
       statutes say the office the person occupies does not matter.

    **Former state officials prosecuted for international crimes after they have left office** (i.e. questions of
    functional immunity).

    :::case
    *R v Bow Street Metropolitan Stipendiary Magistrate, Ex parte Pinochet Ugarte (No 3)*, UK House of Lords (1999):
    former Chilean president Pinochet (in office 1973–1990) travelled to the UK for medical treatment; Spanish courts
    brought a criminal case against him under Spain's universal jurisdiction laws, including charges of torture, and
    requested extradition. He was arrested in the UK. The House of Lords held that while there is absolute immunity
    for serving heads of state, there is no immunity for former heads of state in relation to acts which, at the time
    they occurred, constituted an international crime for which a form of universal jurisdiction has been
    established (e.g. torture as enshrined in the Convention against Torture). A few judges relied on the *jus
    cogens* nature of the prohibition on torture; the majority relied on the UK, Chile and Spain all being parties to
    the Convention against Torture. He was ultimately allowed to leave on medical grounds (died in 2006).
    :::

    Emerging exceptions in state practice regarding functional immunity in cases of international crimes? See the ILC
    Report, 'Immunity of State officials from foreign criminal jurisdiction' (2017), draft article 7: immunity should
    not apply in relation to genocide, crimes against humanity, war crimes, torture and enforced disappearances. There
    is still debate whether this reflects state practice, and the commissioners disagreed about whether there was
    enough evidence of state practice when it was adopted.

    ## Diplomatic and consular immunities

    Functions of diplomatic missions include the representation, promotion and protection of the interests and
    nationals of the sending state. Diplomats and consular officials benefit from a special legal protection regime
    codified in two conventions (prior to 1961 entirely governed by customary international law or bilateral
    treaties): the Vienna Convention on Diplomatic Relations (VCDR, 1961) and the Vienna Convention on Consular
    Relations (VCCR, 1963).

    :::case
    *United States Diplomatic and Consular Staff in Tehran (United States of America v Iran)* [1980] ICJ Rep 3, para
    86: "the rules of diplomatic law … constitute a self-contained regime, which on the one hand, lays out the
    receiving State's obligations regarding the facilities, privileges and immunities to be accorded to diplomatic
    missions and, on the other, foresees their possible abuse by members of the mission and specifies the means at
    the disposal of the receiving State to counter any such abuse." During the Iranian revolution in 1979 militants
    stormed the US Embassy; over 50 US diplomats and consular officials were held hostage for 444 days, and Iranian
    security forces did not intervene. The ICJ confirmed the inviolability of diplomatic envoys and embassies and
    determined that Iran's inaction had violated its international obligations.
    :::

    **To whom do diplomatic immunities apply?**
    - Diplomatic agents (e.g. ambassadors but also lower-level diplomatic agents).
    - Consular agents (who represent the state in administrative or technical matters).
    - Members of the family of a diplomatic agent forming part of the household, unless nationals of the receiving
      state.
    - Members of the administrative and technical staff of the mission (subject to greater exceptions), with family
      members forming their households, if not nationals or permanent residents of the receiving State.
    - Members of the service staff who are not nationals or permanent residents, in respect of acts performed in the
      course of their official duties.

    :::statute
    VCDR art 31: a diplomatic agent shall enjoy immunity from the criminal jurisdiction of the receiving State
    (personal immunity), and shall also enjoy immunity from its civil and administrative jurisdiction, except in the
    case of: (a) a real action relating to private immovable property situated in the territory of the receiving
    State, unless he holds it on behalf of the sending State for the purposes of the mission; (b) an action relating
    to succession in which the diplomatic agent is involved as executor, administrator, heir or legatee as a private
    person and not on behalf of the sending State; (c) an action relating to any professional or commercial activity
    exercised by the diplomatic agent in the receiving State outside his official functions.
    :::

    - Art 29: the person of a diplomatic agent is inviolable (e.g. cannot be arrested).
    - Art 30: the private residence of a diplomatic agent, his papers and correspondence, are also inviolable.
    - Art 41: a diplomatic agent has a duty to respect the laws and regulations of the receiving State, and a duty not
      to interfere in the internal affairs of the state.

    **Consuls (VCCR 1963).** Immunities are more restricted: limited personal inviolability from arrest or detention
    (e.g. can be arrested for a 'grave crime') (art 41); immunity ratione materiae only with respect to criminal and
    civil matters (art 43).

    **Diplomatic missions.** Immunities and inviolability also extend to diplomatic missions (VCDR art 22), except with
    the consent of the head of mission. Immune from search, requisition, attachment and execution: the premises of the
    mission, furnishings and other property within, means of transportation, and archives (art 24). The receiving
    State has a duty to protect the premises of the mission against any intrusion or damage and to prevent any
    disturbance of the peace of the mission or impairment of its dignity (art 22(2)) — see also the UN Convention on
    the Prevention and Punishment of Crimes against Internationally Protected Persons, including Diplomatic Agents
    (1973). As the lecture puts it, Australia cannot enter the embassy of New Zealand in Canberra.

    **Abuses of diplomatic immunity.** What happens if diplomatic immunity is abused and no exception applies?
    - *Persona non grata*: the receiving state declares the presence of a person not acceptable, revoking diplomatic
      credentials (VCDR art 9) — e.g. the US against Russian diplomats after allegations of Russian interference in
      the 2016 US elections.
    - Severance or breach of diplomatic relations.
    - Other 'unfriendly acts'.
    - Nothing.
    - Waiver of immunity (by the sending state).

    :::examtip
    Tutorial (the Julian Assange case): Assange sought refuge in the Ecuadorian Embassy in London in June 2012 to
    avoid extradition to Sweden, was granted asylum by Ecuador in August 2012 and stayed nearly seven years on the
    premises. Questions: the jurisdictional issues (with Topic 5); whether Ecuador could grant him asylum; whether the
    UK could enter the embassy to arrest him; and whether Ecuador, after granting him citizenship, could ask the UK to
    recognise him as a diplomatic agent, and why. (The 1951 Refugee Convention is irrelevant.)
    :::

    ## Diplomatic immunities: the Part B lecture

    *Added from the Part B online lecture on diplomatic immunities (Echo360 captions), paraphrased. It fills in the
    slides above; points marked † come from the recording alone, not the slides, and should be verified.*

    Diplomatic relations are the main way states communicate with each other: they set up diplomatic and consular
    missions abroad and send ambassadors (high commissioners† in Commonwealth countries, doing the same job), consuls
    and envoys. These people are an extension of the state and represent its interests overseas, a subset of the state
    officials met in Part A, but governed by their own protection regimes. Two terms recur: the **receiving** (host)
    state, where the staff are posted, and the **sending** state, which the staff come from and represent.

    Why a protective regime at all? A mission's staff and premises sit inside another state's jurisdiction, with few
    resources of their own for security, so they are particularly vulnerable. The rules were long customary and are now
    codified in the VCDR (1961, diplomats) and the VCCR (1963, consuls). There are two conventions because diplomatic
    work is more sensitive and so attracts greater immunities; consular immunities are more restrictive. Where the VCDR
    is silent, customary international law may still apply.

    ### Article 31 and the commercial-activity exception

    A diplomatic agent's immunity from the receiving state's criminal jurisdiction is absolute; the three art 31
    exceptions apply only to civil and administrative jurisdiction. The lecturer called the first two (private
    immovable property, private succession) unproblematic. The third, professional or commercial activity outside
    official functions, has been debated. Paid employment outside the mission, or professional services for
    remuneration by a member of the mission or of their family, clearly falls within it: a diplomat who also works as a
    teacher in the receiving state can be sued over that work.

    :::case
    *Tabion v Mufti*† (US Court of Appeals, 1996): the exception does not reach contracts for goods and services
    incidental to a diplomat's daily life (the lecture's example is the diplomat's dry cleaner), so immunity covers
    disputes arising from them. States have since interpreted the exception in different ways.
    :::

    The art 41 duties (respect local law; do not interfere in internal affairs) are the flip side of the immunities, but
    they are without prejudice† to them: breaching art 41 does not by itself remove a diplomat's immunity.

    ### Consuls

    Consuls do not represent the sending state in its political relations. They act for it in administrative and
    technical matters that are often private in nature, such as issuing passports to its nationals in the receiving
    state or giving them legal assistance. Consulates are often outside the capital: in Australia most embassies are in
    Canberra, with consulates in cities such as Sydney and Melbourne, while the political relationship is handled by the
    diplomatic staff in Canberra.

    Because their political role is limited, so are their immunities. A consul can be arrested for a grave crime (VCCR
    art 41), which never applies to a diplomat, and has functional immunity (ratione materiae) only, in criminal and
    civil matters (art 43), not personal immunity.

    ### Missions and the duty to protect

    Inviolability means the receiving state's police may not enter the premises (the embassy or consulate) or the
    mission's cars without the consent of the head of mission, and the premises, furnishings, means of transport and
    archives are immune from search, requisition and execution of a court decision. The lecturer's example: diplomatic
    cars in Canberra carry blue "DC" plates† and share these protections.

    *Tehran Hostages* in more detail. After the Iranian revolution the deposed Shah† went into exile in the United
    States, which was seen as allied with the old regime. In November 1979 students (the slides say militants) seized
    the US Embassy in Tehran and held more than 50 diplomats and consular officials until January 1981, while Iran's
    security forces ignored appeals for help from inside. The US claimed breaches of both the VCDR and the VCCR. The
    hostage-takers were not Iranian officials, so the breach lay in Iran's own failure to act: its authorities knew they
    were obliged to take appropriate steps to protect the premises and staff, knew from the situation and the staff's
    appeals that action was urgently needed, had the means to act, and did nothing, in violation of VCDR art 22.

    :::rule
    The duty to protect in VCDR art 22 is not merely passive. The receiving state must take positive steps to protect
    missions on its territory, not just keep its own agents out.
    :::

    ### When the sending state's people abuse immunity

    Abuse is rare but real. The lecturer's everyday example is New York, where diplomats (mostly UN diplomats rather
    than those posted to the United States) owed about US$16 million† in unpaid parking fines in 2014; graver cases
    involve drug trafficking, money laundering, tax evasion or even murder. The receiving state's options are the
    slide's list: declare the person persona non grata (art 9), revoking their credentials, as the US did with Russian
    diplomats over alleged interference in the 2016 election; sever or break off relations; other unfriendly acts; or do
    nothing. Waiver is different in kind: it is the sending state's decision, not one the receiving state can make.

    ## Immunities of international organisations

    International organisations also benefit from immunity from domestic jurisdiction under certain circumstances
    (e.g. UN, EU). These immunities are considered necessary to carry out their functions without interference from
    the state where they are operating, and to secure similar treatment in different countries. International
    organisations enjoy those immunities and privileges as granted to them by states — sometimes through treaties,
    e.g. the Convention on the Privileges and Immunities of the United Nations (1946). They are immune from the
    adjudicatory jurisdiction of states in civil and criminal proceedings and from enforcement jurisdiction; the
    immunity of their officials is limited to acts carried out in their functions. They also have privileges (e.g. UN
    officials do not pay tax on their UN employment income where they are posted).

    :::statute
    UN Charter art 105: "1. The Organization shall enjoy in the territory of each of its Members such privileges and
    immunities as are necessary for the fulfillment of its purposes. 2. Representatives of the Members of the United
    Nations and officials of the Organization shall similarly enjoy such privileges and immunities as are necessary
    for the independent exercise of their functions in connection with the Organization…"
    :::

    **Immunities vary depending on functions** (1946 Convention):
    - Representatives of members: immunity from personal arrest or detention and from seizure of their personal
      baggage, and, in respect of words spoken or written and all acts done by them in their capacity as
      representatives, immunity from legal process of every kind; inviolability for all papers and documents (art IV).
    - UN officials: immune from legal process in respect of words spoken or written and all acts performed by them in
      their official capacity (art V, section 18).
    - Experts on missions: immunity from personal arrest or detention and from seizure of their personal baggage; in
      respect of words spoken or written and acts done in the course of the performance of their mission, immunity
      from legal process of every kind, continuing even when no longer employed on missions for the UN; inviolability
      for all papers and documents (art VI).

    :::statute
    Convention on the Privileges and Immunities of the United Nations (1946), art II. Section 2: "The United Nations,
    its property and assets wherever located and by whomsoever held, shall enjoy immunity from every form of legal
    process except in so far as in any particular case it has expressly waived its immunity. It is, however,
    understood that no waiver of immunity shall extend to any measure of execution." Section 3: "The premises of the
    United Nations shall be inviolable. The property and assets of the United Nations, wherever located and by
    whomsoever held, shall be immune from search, requisition, confiscation, expropriation and any other form of
    interference, whether by executive, administrative, judicial or legislative action." Section 4: "The archives of
    the United Nations, and in general all documents belonging to it or held by it, shall be inviolable wherever
    located."
    :::

    **Accountability of international organisations.** IOs may have to provide alternative modes for settling private
    claims (for the UN, the lecture points to section 29 of the 1946 Convention, usually met by arbitration clauses,
    e.g. in employment contracts), and IOs can waive their immunity (the Secretary-General may waive an official's
    immunity where it would impede the course of justice and can be waived without prejudice to the UN's interests —
    regularly done for car accidents, and done where UN civilian police were shown responsible for rape in peace
    operations). Accountability is frequently raised in the context of peacekeeping, or sexual exploitation and abuse
    committed by UN peacekeepers.

    **Case study: the 2010 cholera outbreak in Haiti.** Nearly 10,000 people died. A UN-appointed panel concluded, in
    2011, that contamination by a UN peacekeepers' camp was a likely cause of the epidemic, but said "it was not the
    fault of, or deliberate action of, a group or individual." While the UN Secretary-General has apologised, the UN
    has not accepted legal responsibility. Cases brought by human rights lawyers before US courts: in 2016, US federal
    courts upheld the UN's immunity.

    :::case
    *Stichting Mothers of Srebrenica and Others v The Netherlands* (Supreme Court of the Netherlands, 13 April 2012;
    ECtHR, 11 June 2013): UNPROFOR, Srebrenica 1995 — families of victims sued the UN and the Netherlands in Dutch
    courts for failing to prevent the genocide. Both decisions recognised UN immunity before domestic courts. The case
    continued against the Netherlands alone, which the Dutch Supreme Court in 2019 found partially responsible, for
    the conduct over which it had effective control.
    :::

concepts:
  - slug: state-immunity-foundations
    title: State immunity — basis, scope and waiver
    visual: diagram
    visual-brief: Two gates in sequence — adjudication (can the court hear it?) then enforcement (can the judgment be executed?) — with side doors marked express consent (art 7), participation (art 8) and counterclaim (art 9) that open only the first gate.
    related: [restrictive-state-immunity, immunities-of-state-officials]
    depends-on: [laws2000-w01-sovereign-equality-and-consent, laws2000-w02-customary-international-law-elements]
    contrasts-with: [immunities-of-state-officials]
    cases: []
    authorities: [uncsi-2004-arts-5-6, uncsi-2004-arts-7-9, uncsi-2004-art-2-1-b, state-immunity-act-1978-uk-s1, foreign-states-immunities-act-1985-cth]
    verify: false
    body: |
      'Immunities' are instances where a state's adjudicatory and enforcement jurisdiction cannot be exercised as
      normal because another foreign state (or its representative) is involved. State immunity is grounded in
      sovereign equality: states are juridically equal, so no state may exercise jurisdiction over another without
      consent.

      Immunity from adjudication means a state cannot be sued before a foreign court unless it consents; immunity from
      enforcement means a judgment cannot be enforced upon the state (e.g. by confiscating assets). Prescriptive
      jurisdiction is untouched. Immunity is a procedural barrier, decided first, and says nothing about the
      substantive lawfulness of the conduct.

      The source is customary international law. The UN Convention on Jurisdictional Immunities of States and their
      Property (2004) needs 30 ratifications and has 25, so it is not in force, but its articles mostly reflect custom:
      art 5 (a state enjoys immunity for itself and its property), art 6 (courts refrain from exercising jurisdiction),
      and no immunity where the state expressly consents (art 7), participates in proceedings (art 8) or faces a
      counterclaim (art 9). Once waived, immunity cannot be reclaimed when judgment goes against the state.

      "State" (art 2(1)(b)) covers organs of government, federal units and political subdivisions and agencies
      entitled to exercise sovereign authority, and representatives acting in that capacity. The UK State Immunity Act
      1978 treats immunity as a preliminary matter with a presumption of immunity; Australia's Foreign States
      Immunities Act 1985 is similar.

      Exam use: say the convention is not in force and you are applying custom.
  - slug: restrictive-state-immunity
    title: Restrictive immunity — acta jure imperii and jure gestionis
    visual: simulation
    visual-brief: Sliders for the nature of the act (sovereign ↔ commercial), its purpose, the counterparty (private person or state) and any agreement on purpose; a verdict lamp shows immune or not immune, citing Trendex, Playa Largo or art 12.
    related: [state-immunity-foundations, immunity-and-serious-international-crimes]
    depends-on: [state-immunity-foundations]
    contrasts-with: [state-immunity-foundations]
    cases: [empire-of-iran-case, trendex-trading-corporation-v-central-bank-of-nigeria, playa-largo-v-i-congreso-del-partido]
    authorities: [uncsi-2004-art-10, uncsi-2004-art-2-1-c, uncsi-2004-art-2-2, uncsi-2004-arts-11-17, uncsi-2004-art-12]
    verify: false
    body: |
      State immunity was originally absolute. Today most states apply a restrictive approach. Acts jure imperii —
      of a sovereign nature, such as foreign and military affairs, legislation, police power and the administration of
      justice — are immune. Acts jure gestionis — of a non-sovereign, commercial nature — are not. In the Empire of
      Iran Case (1963) the German Federal Constitutional Court found absolute immunity was no longer custom; in Trendex
      v Central Bank of Nigeria (1977) the English Court of Appeal refused immunity to a state organ that failed to
      honour a letter of credit. About one-third of states, including China, reject the distinction.

      Art 10 of the 2004 Convention: a state that engages in a commercial transaction with a foreign natural or
      juridical person cannot invoke immunity in proceedings arising out of it — except for transactions between
      states or where the parties expressly agree. Art 2(1)(c) defines commercial transactions (goods, services,
      loans, other commercial dealings, not employment contracts); profit is irrelevant.
      Arts 11 and 13–17 add employment, property, intellectual property, companies, ships and arbitration.

      Art 2(2): look primarily at the nature of the transaction; consider purpose only if the parties agreed. Buying
      embassy office supplies is commercial whatever its purpose. In Playa Largo (1983) Cuba's diversion of a sugar
      cargo for foreign-policy reasons was still commercial.

      Art 12 removes immunity for compensation for death, injury or damage to tangible property caused by an act
      attributable to the state, occurring in the forum state with its author present.
  - slug: immunities-of-state-officials
    title: Immunity ratione materiae and ratione personae
    visual: simulation
    visual-brief: Three switches — rank (troika or other official), act (official or private) and time (in office or left office) — light which immunity, if any, shields the person before a foreign court.
    related: [immunity-and-serious-international-crimes, diplomatic-and-consular-immunities]
    depends-on: [state-immunity-foundations]
    contrasts-with: [state-immunity-foundations, diplomatic-and-consular-immunities]
    cases: [arrest-warrant-of-11-april-2000-democratic-republic-of-congo-v-belgium, certain-questions-of-mutual-assistance-in-criminal-matters-djibouti-v-france]
    authorities: []
    verify: false
    body: |
      State representatives are immune because they 'personify' the state and need protection to fulfil their
      functions. The immunity belongs to the state, not the person: in Arrest Warrant (DRC v Belgium) [2002] the ICJ
      said a foreign minister's immunities are "not granted for their personal benefit, but to ensure the effective
      performance of their functions". The source is customary international law, not the 2004 Convention.

      Functional immunity (ratione materiae) attaches to the act: only official acts taken while in office, done with
      official authority ('under the colour of authority'); it continues after the official leaves office and can be
      waived only with the state's consent. Example: a soldier who kills an enemy soldier on the battlefield.

      Personal immunity (ratione personae) attaches to the office: complete immunity, even for private acts, but only
      for very high-ranking officials — heads of state, heads of government and foreign ministers (Djibouti v France
      2008 confirms their privileged status in custom). It lasts only while in office, after which functional immunity
      remains; it can be waived by the state. Example: a sitting Greek president who drives drunk on holiday in
      Australia and kills someone is immune there; once out of office, the private act is uncovered.

      Neither immunity applies in the official's own state's courts.

      Exam use: ask rank, then official or private act, then whether the person is still in office.
  - slug: immunity-and-serious-international-crimes
    title: Immunity, impunity and international crimes
    visual: timeline
    visual-brief: A line from Pinochet (1999) through Arrest Warrant (2002) and Germany v Italy (2012) to ILC draft article 7 (2017), each marker tagged state or official, civil or criminal, immunity upheld or lifted.
    related: [immunities-of-state-officials, restrictive-state-immunity]
    depends-on: [immunities-of-state-officials, state-immunity-foundations]
    contrasts-with: [restrictive-state-immunity]
    cases: [jurisdictional-immunities-of-the-state-germany-v-italy-greece-intervening, arrest-warrant-of-11-april-2000-democratic-republic-of-congo-v-belgium, r-v-bow-street-metropolitan-stipendiary-magistrate-ex-parte-pinochet-ugarte-no-3]
    authorities: [ilc-immunity-of-state-officials-draft-art-7]
    verify: false
    body: |
      States: in Jurisdictional Immunities of the State (Germany v Italy) [2012] the ICJ held that custom did not
      deprive Germany of immunity in Italian civil proceedings over WWII crimes by its armed forces. State immunity is
      "procedural in character" and "entirely distinct from the substantive law" (para 93), and extends to acts jure
      imperii by armed forces in armed conflict, even on the forum state's territory (para 77).

      Officials: in Arrest Warrant [2002] a Belgian warrant for the sitting Congolese foreign minister breached his
      personal immunity; state practice supports no exception for international crimes. But "immunity … does not
      mean … impunity": immunity is procedural, criminal responsibility substantive. Prosecution remains possible (1)
      in the person's own state, (2) after waiver, (3) by other states once they leave office, for acts before or after
      office and private acts during it, and (4) before international criminal courts.

      Former officials: in Pinochet (No 3) (1999) the House of Lords held that a former head of state has no immunity
      for acts that, when done, were international crimes subject to a form of universal jurisdiction — torture under
      the Convention against Torture, to which the UK, Chile and Spain were parties. ILC draft article 7 (2017) would
      exclude immunity for genocide, crimes against humanity, war crimes, torture and enforced disappearances, but
      whether it reflects state practice is debated.

      Exam use: identify state or individual, civil or criminal, serving or former.
  - slug: diplomatic-and-consular-immunities
    title: Diplomatic and consular immunities
    visual: diagram
    visual-brief: Concentric rings around the mission — premises and archives (inviolable), diplomatic agent (full), family, administrative and technical staff, service staff (official acts), consul (restricted) — with the receiving state's remedies at the edge.
    related: [immunities-of-state-officials, immunities-of-international-organisations]
    depends-on: [state-immunity-foundations]
    contrasts-with: [immunities-of-state-officials]
    cases: [united-states-diplomatic-and-consular-staff-in-tehran-united-states-of-america-v-iran]
    authorities: [vcdr-art-31, vcdr-arts-29-30, vcdr-art-41, vcdr-art-22, vcdr-art-24, vcdr-art-9, vccr-arts-41-43]
    verify: false
    body: |
      Diplomats and consuls enjoy a treaty regime: the Vienna Convention on Diplomatic Relations 1961 (VCDR) and the Vienna
      Convention on Consular Relations 1963 (VCCR). In Tehran Hostages (1980) the ICJ called diplomatic law a
      "self-contained regime" and held Iran's inaction when militants held US diplomats for 444 days a breach.

      Under VCDR art 31 a diplomatic agent is immune from the receiving state's criminal jurisdiction, and from its
      civil and administrative jurisdiction except for private immovable property, private succession matters, and
      professional or commercial activity outside official functions. The agent's person is inviolable — no arrest
      (art 29) — as are the private residence, papers and correspondence (art 30); the agent must respect local law and
      not interfere in internal affairs (art 41). Family members, administrative and technical staff and service staff
      (official acts only) have narrower protection, generally not if nationals or permanent residents of the
      receiving state.

      Consuls have restricted immunities: limited inviolability (arrest for a 'grave crime', VCCR art 41) and immunity
      ratione materiae (art 43).

      Mission premises are inviolable and may not be entered without the consent of the head of mission (VCDR art 22),
      and the receiving state must protect them; premises, property, transport and archives are immune from search and
      execution (arts 22, 24). For abuse the receiving state may declare a diplomat persona non grata (art 9), sever
      relations, act unfriendly, do nothing, or seek waiver from the sending state.
  - slug: immunities-of-international-organisations
    title: Immunities of international organisations
    visual: diagram
    visual-brief: The UN at the centre with its treaty layers — Charter art 105, then the 1946 Convention — branching to the organisation, member representatives, officials and experts on mission, and an accountability valve (alternative settlement, waiver) tested by Haiti and Srebrenica.
    related: [diplomatic-and-consular-immunities, state-immunity-foundations]
    depends-on: [laws2000-w04-international-organisations-definition-and-personality, laws2000-w04-powers-and-responsibility-of-international-organisations]
    contrasts-with: [state-immunity-foundations]
    cases: [stichting-mothers-of-srebrenica-and-others-v-the-netherlands]
    authorities: [un-charter-art-105, cpiun-art-ii-ss-2-4, cpiun-arts-iv-vi, cpiun-s-29]
    verify: false
    body: |
      International organisations such as the UN and EU also enjoy immunity from domestic jurisdiction, because they
      need to carry out their functions without interference from the state where they operate, and to be treated alike
      across countries. Unlike state immunity, IO immunities rest on treaty law — states grant them. IOs are immune from
      adjudication (civil and criminal) and enforcement, while their officials' immunity is limited to acts in their
      functions: functional, never personal.

      UN Charter art 105 gives the organisation the privileges and immunities "necessary for the fulfillment of its
      purposes", and member representatives and officials those necessary for the independent exercise of their
      functions. The Convention on the Privileges and Immunities of the United Nations 1946 fills this in: the UN, its
      property and assets are immune from every form of legal process unless expressly waived, and no waiver extends to
      execution (art II s 2); premises are inviolable (s 3) and archives inviolable wherever located (s 4).
      Representatives of members (art IV), officials (art V s 18) and experts on missions (art VI, continuing after the
      mission) are immune for words and acts in their official capacity.

      Accountability: IOs may have to provide alternative modes for settling private claims, and can waive immunity.
      In the 2010 Haiti cholera outbreak (nearly 10,000 deaths) US federal courts upheld the UN's immunity in 2016. In
      Mothers of Srebrenica the Dutch Supreme Court (2012) and the ECtHR (2013) recognised UN immunity, and the case
      went on against the Netherlands alone.

cases:
  - slug: empire-of-iran-case
    name: Empire of Iran Case
    citation: "(1963) German Federal Constitutional Court"
    aglc: "Empire of Iran Case (German Federal Constitutional Court, 1963)"
    facts: |
      A case before the German Federal Constitutional Court in 1963 in which the Empire of Iran claimed state
      immunity. (The materials give no further facts.)
    issue: |
      Whether absolute state immunity remained a rule of customary international law.
    held: |
      The German Federal Constitutional Court found that absolute State immunity was no longer customary
      international law, distinguishing between sovereign acts (jure imperii) and commercial acts (jure gestionis).
    ratio: |
      Customary international law recognises only restrictive immunity: sovereign acts are immune, commercial acts are
      not.
    significance: |
      An early civil law decision marking the move from absolute to restrictive state immunity.
    why-here: Cited for the shift from absolute immunity to the distinction between acta jure imperii and acta jure gestionis.
    verify: true
  - slug: trendex-trading-corporation-v-central-bank-of-nigeria
    name: Trendex Trading Corporation v Central Bank of Nigeria
    citation: "(1977) English Court of Appeal"
    aglc: "Trendex Trading Corporation v Central Bank of Nigeria (English Court of Appeal, 1977)"
    facts: |
      Nigeria bought cement from Trendex, a UK company. Ending up with too much, it had the Central Bank of Nigeria
      stop the letter of credit, so Trendex was not paid. Trendex sued in the UK; Nigeria claimed immunity.
    issue: |
      Whether the Central Bank of Nigeria, an organ of the state, could claim immunity in proceedings arising out of
      its failure to honour a letter of credit.
    held: |
      The English Court of Appeal rejected immunity. The Central Bank was part of the state, but the nature of the
      transaction was commercial, not a sovereign act, so immunity did not apply.
    ratio: |
      Immunity does not extend to acts of a commercial nature (jure gestionis), even when done by an organ of the
      state; the court looks at the nature of the transaction.
    significance: |
      A key common law decision recognising the restrictive approach; the principle is replicated in art 10 of the UN
      Convention on Jurisdictional Immunities (2004).
    why-here: Used to show that a state organ in an ordinary commercial transaction cannot claim immunity.
    verify: true
  - slug: playa-largo-v-i-congreso-del-partido
    name: Playa Largo v I Congreso del Partido
    citation: "(1983) UK House of Lords"
    aglc: "Playa Largo v I Congreso del Partido (UK House of Lords, 1983)"
    facts: |
      Cuba's state-owned shipping company agreed to deliver sugar to a company in Chile but was ordered to divert the
      ships due to political tensions after a coup in Chile. Cuba claimed sovereign immunity, arguing the diversion had
      a foreign policy objective.
    issue: |
      Whether the diversion was a sovereign act (jure imperii) attracting immunity because of its policy purpose, or a
      commercial act (jure gestionis) judged by its nature.
    held: |
      The UK House of Lords rejected Cuba's immunity claim, holding that the shipping activity was commercial (jure
      gestionis), not sovereign (jure imperii).
    ratio: |
      Whether conduct is sovereign or commercial depends on its nature, not on the state's policy motive; a
      foreign-policy reason for breaching a commercial contract does not make the act sovereign.
    significance: |
      A landmark case on the nature-versus-purpose test later reflected in art 2(2) of the 2004 UN Convention.
    why-here: Used to apply the nature test where a state claims a political purpose for commercial conduct.
    verify: true
  - slug: jurisdictional-immunities-of-the-state-germany-v-italy-greece-intervening
    name: "Jurisdictional Immunities of the State (Germany v Italy: Greece Intervening)"
    citation: "[2012] ICJ Rep 99"
    aglc: "Jurisdictional Immunities of the State (Germany v Italy: Greece Intervening) [2012] ICJ Rep 99"
    facts: |
      Civil proceedings were brought in Italian courts against Germany by victims' families with respect to serious
      crimes committed by German forces against civilian populations and prisoners of war during the occupation of
      Italy in World War II; Italian courts also took measures against Villa Vigoni, German property in Italy. Germany
      brought the case before the ICJ, claiming that Italian courts (and thus the Italian state) were violating its
      right to state immunity.
    issue: |
      Whether customary international law deprives a state of immunity in foreign civil proceedings because of alleged
      serious violations of international human rights law and international humanitarian law, including norms of
      jus cogens.
    held: |
      Italy had violated Germany's immunity. As of 2012, customary international law did not deprive a state of
      immunity because of alleged serious violations of international human rights law and IHL. "The rules of State
      immunity are procedural in character … and [are] thus entirely distinct from the substantive law which determines
      whether that conduct is lawful or unlawful" (para 93); state immunity for acta jure imperii "continues to extend
      to civil proceedings for acts occasioning death, personal injury or damage to property committed by the armed
      forces and other organs of a State in the conduct of armed conflict, even if the relevant acts take place on the
      territory of the forum State" (para 77).
    ratio: |
      Because state immunity is procedural and distinct from the substantive rules breached, a state keeps its
      immunity for sovereign acts of its armed forces in armed conflict even where grave breaches are alleged.
    significance: |
      The leading authority that there is (at present) no serious-violations or jus cogens exception to state
      immunity; widely criticised as promoting impunity.
    why-here: Used to answer whether a state keeps immunity in foreign civil proceedings for grave breaches.
    verify: false
  - slug: arrest-warrant-of-11-april-2000-democratic-republic-of-congo-v-belgium
    name: Arrest Warrant of 11 April 2000 (Democratic Republic of Congo v Belgium)
    citation: "(Judgment) [2002] ICJ Rep 3"
    aglc: "Arrest Warrant of 11 April 2000 (Democratic Republic of Congo v Belgium) (Judgment) [2002] ICJ Rep 3"
    facts: |
      A Belgian court, under universal jurisdiction, issued an arrest warrant for Yerodia, the sitting foreign minister
      of the DRC, accused of inciting hatred in a war-torn region. The DRC brought the case to the ICJ, claiming the
      warrant violated the minister's immunity.
    issue: |
      Whether an incumbent foreign minister enjoys immunity from foreign criminal jurisdiction, and whether there is an
      exception for international crimes.
    held: |
      Issuing the warrant violated the foreign minister's immunity. "The immunities accorded to Ministers for Foreign
      Affairs are not granted for their personal benefit, but to ensure the effective performance of their functions
      on behalf of their respective States." Current state practice does not support an exception to immunity from
      foreign criminal jurisdiction for international crimes (paras 58 et seq). But immunity "does not mean that they
      enjoy impunity": immunity is procedural, criminal responsibility substantive, and prosecution remains possible
      in the official's own state, after waiver, by other states once they leave office (for acts before or after office
      and private acts during it), and before international criminal courts with jurisdiction (paras 58–61).
    ratio: |
      Personal immunity of an incumbent foreign minister is a rule of customary international law, grounded in function,
      and has no exception for international crimes; immunity is not impunity.
    significance: |
      The leading authority on personal immunity (ratione personae) of high-ranking officials and on the separation
      between immunity and individual criminal responsibility.
    why-here: Used for the rationale of officials' immunities, the absence of an international crimes exception for serving officials, and the four avenues to prosecution.
    verify: false
  - slug: certain-questions-of-mutual-assistance-in-criminal-matters-djibouti-v-france
    name: Certain Questions of Mutual Assistance in Criminal Matters (Djibouti v France)
    citation: "(2008) ICJ"
    aglc: "Certain Questions of Mutual Assistance in Criminal Matters (Djibouti v France) (ICJ, 2008)"
    facts: |
      A dispute between Djibouti and France before the ICJ. (The materials give no further facts.)
    issue: |
      The status of heads of state and foreign ministers under international law.
    held: |
      The ICJ found that the privileged status of heads of state and foreign ministers in international law is
      customary international law.
    ratio: |
      Heads of state and foreign ministers enjoy personal immunity as a matter of customary international law.
    significance: |
      Supports the customary basis of immunity ratione personae for the highest state officials.
    why-here: Cited for the customary status of the personal immunity of heads of state and foreign ministers.
    verify: true
  - slug: r-v-bow-street-metropolitan-stipendiary-magistrate-ex-parte-pinochet-ugarte-no-3
    name: R v Bow Street Metropolitan Stipendiary Magistrate, Ex parte Pinochet Ugarte (No 3)
    citation: "(1999) UK House of Lords"
    aglc: "R v Bow Street Metropolitan Stipendiary Magistrate, Ex parte Pinochet Ugarte (No 3) (UK House of Lords, 1999)"
    facts: |
      Augusto Pinochet, former Chilean president (in office 1973–1990), travelled to the UK for medical treatment.
      Spanish courts brought a criminal case against him under Spain's universal jurisdiction laws, including charges
      of torture, and requested extradition. He was arrested in the UK, giving rise to extradition proceedings.
    issue: |
      Whether a former head of state retains (functional) immunity from foreign criminal proceedings for torture
      committed while in office.
    held: |
      While there is absolute immunity for serving heads of state, there is no immunity for former heads of state in
      relation to acts which, at the time they occurred, constituted an international crime for which a form of
      universal jurisdiction has been established (e.g. torture as enshrined in the Convention against Torture). A few
      judges relied on the jus cogens nature of the prohibition on torture; the majority relied on the UK, Chile and
      Spain all being parties to the Convention against Torture. Pinochet was ultimately allowed to leave the country on
      medical grounds (he died in 2006).
    ratio: |
      Functional immunity of a former head of state does not cover torture where, at the time, it was an international
      crime subject to universal jurisdiction under a treaty binding the relevant states.
    significance: |
      The first domestic decision to accept an exception to functional immunity for international crimes; evidence of
      emerging state practice.
    why-here: Used for whether functional immunity survives for international crimes once an official has left office.
    verify: true
  - slug: united-states-diplomatic-and-consular-staff-in-tehran-united-states-of-america-v-iran
    name: United States Diplomatic and Consular Staff in Tehran (United States of America v Iran)
    citation: "(Judgment) [1980] ICJ Rep 3"
    aglc: "United States Diplomatic and Consular Staff in Tehran (United States of America v Iran) (Judgment) [1980] ICJ Rep 3"
    facts: |
      During the Iranian revolution in 1979, militants stormed the US Embassy. Over 50 US diplomats and consular
      officials were held hostage for 444 days, from November 1979 to January 1981. Iranian security forces did not
      intervene. The US claimed violation of the VCDR and VCCR.
    issue: |
      Whether Iran violated its obligations under diplomatic and consular law by failing to protect the embassy and
      its staff.
    held: |
      The ICJ confirmed the inviolability of diplomatic envoys and embassies under international law and determined
      that Iran's inaction had violated its international obligations. The rules of diplomatic law "constitute a
      self-contained regime" setting out the receiving state's obligations and the means available to it to counter
      abuse by members of the mission (para 86).
    ratio: |
      The receiving state must protect the inviolability of diplomatic agents and mission premises; diplomatic law is a
      self-contained regime whose remedies for abuse are those it provides.
    significance: |
      The leading ICJ authority on the inviolability of diplomats and missions and on diplomatic law as a
      self-contained regime.
    why-here: Used for inviolability of the mission and the receiving state's duty to protect it.
    verify: false
  - slug: stichting-mothers-of-srebrenica-and-others-v-the-netherlands
    name: Stichting Mothers of Srebrenica and Others v The Netherlands
    citation: "Supreme Court of the Netherlands, 13 April 2012; ECtHR, 11 June 2013"
    aglc: "Stichting Mothers of Srebrenica and Others v The Netherlands (Supreme Court of the Netherlands, 13 April 2012); Stichting Mothers of Srebrenica and Others v the Netherlands (European Court of Human Rights, 11 June 2013)"
    facts: |
      In 1995 the Srebrenica safe area, protected by a Dutch battalion of UNPROFOR, was overrun by Bosnian Serb forces;
      the ICJ and ICTY later found the Srebrenica operation amounted to genocide. Families of victims sued the UN and
      the Netherlands in Dutch courts for failing to prevent the genocide.
    issue: |
      Whether the UN could rely on its immunity before domestic courts in proceedings over peacekeeping conduct.
    held: |
      The Dutch Supreme Court (2012) threw out the case against the UN on the ground of immunity, and the ECtHR (2013)
      confirmed it: both recognised UN immunity before domestic courts. The case continued against the Netherlands,
      which the Dutch Supreme Court in 2019 found partially responsible, for the part over which it had effective
      control of the troops.
    ratio: |
      The UN's immunity from domestic jurisdiction is upheld even for claims concerning a failure to prevent genocide;
      the responsibility of the troop-contributing state can be pursued separately.
    significance: |
      Shows the accountability gap created by IO immunity and links back to attribution of responsibility between an
      IO and its member states.
    why-here: Used for the limits of accountability of international organisations and the separation of UN and state responsibility.
    verify: false

authorities:
  - slug: uncsi-2004-arts-5-6
    title: UN Convention on Jurisdictional Immunities of States and their Property 2004 arts 5–6
    kind: treaty
    text: |
      Art 5: "A State enjoys immunity, in respect of itself and its property, from the jurisdiction of the courts of
      another State". Art 6: modalities for giving effect to state immunity (refraining from exercising jurisdiction
      before its courts).
    gloss: The basic principle of state immunity; the convention is not in force (25 of the 30 ratifications needed) but mostly reflects custom.
    cases: []
    verify: false
  - slug: uncsi-2004-arts-7-9
    title: UN Convention on Jurisdictional Immunities of States and their Property 2004 arts 7–9
    kind: treaty
    text: |
      Art 7: no immunity if the state expressly consents to the exercise of foreign jurisdiction (e.g. by agreement).
      Art 8: no immunity if the state participates in court proceedings. Art 9: no immunity in counterclaims (arising
      from proceedings initiated by a state or otherwise participated in).
    gloss: A state loses immunity by express consent, by taking part in the proceedings, or for counterclaims in proceedings it joined.
    cases: []
    verify: false
  - slug: uncsi-2004-art-2-1-b
    title: UN Convention on Jurisdictional Immunities of States and their Property 2004 art 2(1)(b)
    kind: treaty
    text: |
      "State" means: the State and its various organs of government; constituent units of a federal State or political
      subdivisions of the State that are entitled to perform acts in the exercise of the sovereign authority of the
      State; agencies or instrumentalities of the State and other entities, to the extent that they are entitled to
      perform acts in the exercise of the sovereign authority of the State; representatives of the State acting in that
      capacity.
    gloss: Who counts as the state for immunity purposes — organs, sub-units and agencies exercising sovereign authority, and representatives.
    cases: [trendex-trading-corporation-v-central-bank-of-nigeria]
    verify: false
  - slug: uncsi-2004-art-2-1-c
    title: UN Convention on Jurisdictional Immunities of States and their Property 2004 art 2(1)(c)
    kind: treaty
    text: |
      "Commercial transaction" means: any commercial contract or transaction for the sale of goods or supply of
      services; any contract for a loan or other transaction of a financial nature, including any obligation of
      guarantee or of indemnity in respect of any such loan or transaction; any other contract or transaction of a
      commercial, industrial, trading or professional nature, but not including a contract of employment of persons.
    gloss: The three kinds of commercial transaction; employment contracts are excluded (and dealt with separately in art 11).
    cases: [trendex-trading-corporation-v-central-bank-of-nigeria]
    verify: false
  - slug: uncsi-2004-art-2-2
    title: UN Convention on Jurisdictional Immunities of States and their Property 2004 art 2(2)
    kind: treaty
    text: |
      In determining whether a contract or transaction is a "commercial transaction" under paragraph 1(c), reference
      should be made primarily to the nature of the contract or transaction … but its purpose should also be taken
      into account if the parties to the contract or transaction have so agreed.
    gloss: Nature first; purpose only if the parties agreed.
    cases: [playa-largo-v-i-congreso-del-partido]
    verify: false
  - slug: uncsi-2004-art-10
    title: UN Convention on Jurisdictional Immunities of States and their Property 2004 art 10
    kind: treaty
    text: |
      "If a State engages in a commercial transaction with a foreign natural or juridical person … the State cannot
      invoke immunity from that jurisdiction in a proceeding arising out of that commercial transaction." Exceptions:
      commercial transactions between States; if the parties to the commercial transaction have expressly agreed.
    gloss: The commercial transactions exception, codifying the restrictive approach recognised in Trendex.
    cases: [trendex-trading-corporation-v-central-bank-of-nigeria, playa-largo-v-i-congreso-del-partido]
    verify: false
  - slug: uncsi-2004-arts-11-17
    title: UN Convention on Jurisdictional Immunities of States and their Property 2004 arts 11, 13–17
    kind: treaty
    text: |
      Proceedings in which state immunity cannot be invoked: art 11 certain contracts of employment; art 13 rights of
      ownership, possession and use of property; art 14 intellectual and industrial property; art 15 participation in
      companies or other collective bodies; art 16 ships owned or operated by a state (unless used for government
      non-commercial purposes, exception for warships); art 17 arbitration agreements relating to commercial
      transactions.
    gloss: The other listed exceptions to state immunity beyond commercial transactions and personal injury.
    cases: []
    verify: false
  - slug: uncsi-2004-art-12
    title: UN Convention on Jurisdictional Immunities of States and their Property 2004 art 12
    kind: treaty
    text: |
      "Unless otherwise agreed between the States concerned, a State cannot invoke immunity from jurisdiction before a
      court of another State which is otherwise competent in a proceeding which relates to pecuniary compensation for
      death or injury to the person, or damage to or loss of tangible property, caused by an act or omission which is
      alleged to be attributable to the State, if the act or omission occurred in whole or in part in the territory of
      that other State and if the author of the act or omission was present in that territory at the time of the act
      or omission."
    gloss: The territorial tort exception — attributable act, in the forum state, author present; material damage only.
    cases: [jurisdictional-immunities-of-the-state-germany-v-italy-greece-intervening]
    verify: false
  - slug: state-immunity-act-1978-uk-s1
    title: State Immunity Act 1978 (UK) s 1
    kind: statute
    text: |
      (Summarised in the slides; the materials do not quote the section.) Treats State immunity as a preliminary
      matter (s 1(2)); there is a presumption that a State possesses immunity, with the plaintiff bearing the burden
      of proof to the contrary.
    gloss: The UK's statute, broadly consistent with the 2004 UN Convention (signed by the UK in 2005 but not ratified).
    cases: [trendex-trading-corporation-v-central-bank-of-nigeria]
    verify: true
  - slug: foreign-states-immunities-act-1985-cth
    title: Foreign States Immunities Act 1985 (Cth)
    kind: statute
    text: |
      (Summarised in the slides; no section is cited.) Foreign states are in principle immune to the jurisdiction of
      Australian courts, unless and to the extent that the state has waived immunity, or the case concerns a
      commercial transaction.
    gloss: Australia's state immunity statute — immunity by default, lost by waiver or for commercial transactions.
    cases: []
    verify: true
  - slug: ilc-immunity-of-state-officials-draft-art-7
    title: ILC Draft Articles on Immunity of State Officials from Foreign Criminal Jurisdiction 2017 draft art 7
    kind: other
    text: |
      ILC Report, 'Immunity of State officials from foreign criminal jurisdiction' (2017), draft article 7: immunity
      should not apply in relation to the following international crimes: genocide, crimes against humanity, war
      crimes, torture and enforced disappearances.
    gloss: A proposed exception to functional immunity for grave international crimes; whether it reflects state practice is disputed.
    cases: [r-v-bow-street-metropolitan-stipendiary-magistrate-ex-parte-pinochet-ugarte-no-3]
    verify: false
  - slug: vcdr-art-31
    title: Vienna Convention on Diplomatic Relations 1961 art 31
    kind: treaty
    text: |
      A diplomatic agent shall enjoy immunity from the criminal jurisdiction of the receiving State. He shall also enjoy
      immunity from its civil and administrative jurisdiction, except in the case of: (a) a real action relating to
      private immovable property situated in the territory of the receiving State, unless he holds it on behalf of the
      sending State for the purposes of the mission; (b) an action relating to succession in which the diplomatic
      agent is involved as executor, administrator, heir or legatee as a private person and not on behalf of the
      sending State; (c) an action relating to any professional or commercial activity exercised by the diplomatic
      agent in the receiving State outside his official functions.
    gloss: Full criminal immunity and civil immunity with three private-matter exceptions.
    cases: []
    verify: false
  - slug: vcdr-arts-29-30
    title: Vienna Convention on Diplomatic Relations 1961 arts 29–30
    kind: treaty
    text: |
      Art 29: the person of a diplomatic agent is inviolable (e.g. cannot be arrested). Art 30: the private residence
      of a diplomatic agent, his papers and correspondence, are also inviolable.
    gloss: Personal inviolability of the diplomat and of their residence, papers and correspondence.
    cases: [united-states-diplomatic-and-consular-staff-in-tehran-united-states-of-america-v-iran]
    verify: false
  - slug: vcdr-art-41
    title: Vienna Convention on Diplomatic Relations 1961 art 41
    kind: treaty
    text: |
      A diplomatic agent has a duty to respect the laws and regulations of the receiving State, and a duty not to
      interfere in the internal affairs of the state.
    gloss: Immunity is not a licence — diplomats must still respect local law.
    cases: []
    verify: false
  - slug: vcdr-art-22
    title: Vienna Convention on Diplomatic Relations 1961 art 22
    kind: treaty
    text: |
      Immunities and inviolability extend to diplomatic missions, except with consent of the head of mission. The
      receiving State has a duty to protect the premises of the mission against any intrusion or damage and to prevent
      any disturbance of the peace of the mission or impairment of its dignity (art 22(2)).
    gloss: Mission premises are inviolable — no entry without the head of mission's consent — and must be protected by the receiving state.
    cases: [united-states-diplomatic-and-consular-staff-in-tehran-united-states-of-america-v-iran]
    verify: false
  - slug: vcdr-art-24
    title: Vienna Convention on Diplomatic Relations 1961 art 24
    kind: treaty
    text: |
      (As summarised in the slides.) The premises of the mission, furnishings and other property within, means of
      transportation and archives are immune from search, requisition, attachment and execution; archives (art 24).
    gloss: The mission's property, transport and archives cannot be searched or seized.
    cases: []
    verify: false
  - slug: vcdr-art-9
    title: Vienna Convention on Diplomatic Relations 1961 art 9
    kind: treaty
    text: |
      Persona non grata: the receiving state declares the presence of a person as not acceptable, revoking diplomatic
      credentials.
    gloss: The receiving state's main remedy when a diplomat abuses immunity.
    cases: []
    verify: false
  - slug: vccr-arts-41-43
    title: Vienna Convention on Consular Relations 1963 arts 41 and 43
    kind: treaty
    text: |
      Consular immunities are more restricted: limited personal inviolability from arrest or detention (e.g. can be
      arrested for a 'grave crime') (art 41); immunity ratione materiae only with respect to criminal and civil matters
      (art 43).
    gloss: Consuls have limited inviolability and only functional immunity.
    cases: []
    verify: false
  - slug: un-charter-art-105
    title: Charter of the United Nations art 105
    kind: treaty
    text: |
      "1. The Organization shall enjoy in the territory of each of its Members such privileges and immunities as are
      necessary for the fulfillment of its purposes. 2. Representatives of the Members of the United Nations and
      officials of the Organization shall similarly enjoy such privileges and immunities as are necessary for the
      independent exercise of their functions in connection with the Organization…"
    gloss: The UN's own immunities, and functional immunities for member representatives and UN officials; detailed in the 1946 Convention.
    cases: [stichting-mothers-of-srebrenica-and-others-v-the-netherlands]
    verify: false
  - slug: cpiun-art-ii-ss-2-4
    title: Convention on the Privileges and Immunities of the United Nations 1946 art II ss 2–4
    kind: treaty
    text: |
      Section 2: "The United Nations, its property and assets wherever located and by whomsoever held, shall enjoy
      immunity from every form of legal process except in so far as in any particular case it has expressly waived its
      immunity. It is, however, understood that no waiver of immunity shall extend to any measure of execution."
      Section 3: "The premises of the United Nations shall be inviolable. The property and assets of the United
      Nations, wherever located and by whomsoever held, shall be immune from search, requisition, confiscation,
      expropriation and any other form of interference, whether by executive, administrative, judicial or legislative
      action." Section 4: "The archives of the United Nations, and in general all documents belonging to it or held by
      it, shall be inviolable wherever located."
    gloss: Immunity of the UN itself, its premises, property and archives — closely mirroring diplomatic premises.
    cases: [stichting-mothers-of-srebrenica-and-others-v-the-netherlands]
    verify: false
  - slug: cpiun-arts-iv-vi
    title: Convention on the Privileges and Immunities of the United Nations 1946 arts IV–VI
    kind: treaty
    text: |
      (As summarised in the slides.) Representatives of members: immunity from personal arrest or detention and from
      seizure of their personal baggage, and, in respect of words spoken or written and all acts done by them in their
      capacity as representatives, immunity from legal process of every kind; inviolability for all papers and
      documents (art IV). UN officials: immune from legal process in respect of words spoken or written and all acts
      performed by them in their official capacity (art V, section 18). Experts on missions: immunity from personal
      arrest or detention and from seizure of their personal baggage; in respect of words spoken or written and acts
      done in the course of the performance of their mission, immunity from legal process of every kind, continuing
      even when no longer employed on missions for the UN; inviolability for all papers and documents (art VI).
    gloss: Functional immunities that vary with the role — member representatives, officials, experts on mission.
    cases: []
    verify: false
  - slug: cpiun-s-29
    title: Convention on the Privileges and Immunities of the United Nations 1946 s 29
    kind: treaty
    text: |
      (Described in the online lecture as "Article 29 of the Convention of 1946"; the wording is not reproduced.) The UN
      must provide alternative modes of settlement for disputes of a private law character, such as contract disputes,
      usually met by arbitration clauses in contracts (e.g. employment contracts).
    gloss: The quid pro quo for UN immunity — an alternative forum for private claims.
    cases: []
    verify: true

questions:
  # ---------- Concept 1: state-immunity-foundations ----------
  - key: q101
    type: mcq
    concept: state-immunity-foundations
    difficulty: 1
    set: pretest
    stem: On what fundamental principle is state immunity grounded, according to this week's slides?
    options:
      - text: The principle of non-refoulement, which forbids returning a state's nationals to face persecution.
        why: Tempting because it is a well-known protective principle, but non-refoulement concerns refugees, and the slides expressly say the 1951 Refugee Convention is irrelevant here.
      - text: Sovereign equality — states are juridically equal, so no state may exercise jurisdiction over another without consent.
        correct: true
        why: Correct — the slides ground state immunity in sovereign equality, reflecting the independence of states; a court judging another state would infringe that equality.
      - text: The territorial principle, under which every state has exclusive jurisdiction over all persons within its borders.
        why: Tempting because immunity limits territorial jurisdiction, but the territorial principle is what immunity cuts back; it is not the source of the immunity itself.
      - text: Reciprocity between trading partners, so that only states with trade agreements enjoy immunity from each other.
        why: Tempting because commercial dealings feature heavily in the topic, but immunity rests on sovereign equality and belongs to every state, whatever its trade ties.
  - key: q102
    type: mcq
    concept: state-immunity-foundations
    difficulty: 1
    stem: What does state immunity from adjudicative jurisdiction mean in practice?
    options:
      - text: The state cannot be sued before a foreign court unless it consents.
        correct: true
        why: Correct — the slide says immunity from adjudication means a state cannot be sued before a foreign court unless it gives its consent; the court cannot look at the merits.
      - text: A judgment already given against the state cannot be enforced against its assets.
        why: Tempting because it is the other half of the slide, but that describes immunity from enforcement, which arises only after adjudicative jurisdiction is established and a judgment given.
      - text: The forum court cannot apply the foreign state's laws.
        why: Tempting because it sounds jurisdictional, but immunity is about whether the court may hear the case at all, not which state's law governs it.
  - key: q103
    type: mcq
    concept: state-immunity-foundations
    difficulty: 2
    stem: Which form of jurisdiction does the lecture say immunities do NOT affect?
    options:
      - text: Adjudicative jurisdiction — the power of a court to look into the merits.
        why: Wrong choice — immunity squarely affects adjudicative jurisdiction; that is the procedural bar the court must rule on first.
      - text: Enforcement jurisdiction — implementing a judgment, e.g. by confiscating assets.
        why: "Wrong choice — immunity from enforcement is one of the two forms on the slide: a judgment cannot be enforced upon the state due to immunity."
      - text: Prescriptive jurisdiction — the power to make laws.
        correct: true
        why: Correct — the lecturer stresses that immunities apply to adjudicatory and enforcement jurisdiction, not prescriptive jurisdiction, because they are procedural rules that do not affect the law itself.
  - key: q104
    type: mcq
    concept: state-immunity-foundations
    difficulty: 2
    stem: Why does a court faced with a foreign state respondent rule on immunity before anything else?
    options:
      - text: Because immunity is a defence on the merits that must be pleaded before the facts are proven at trial.
        why: Tempting because it is raised early, but immunity is not a merits defence; it says nothing about whether the conduct was lawful.
      - text: Because immunity is a procedural barrier to jurisdiction that does not touch the substantive law.
        correct: true
        why: Correct — the slides call immunity a procedural barrier, so the court must first decide whether the respondent is a state with immunity before the proceeding can continue.
      - text: Because the forum state's executive must certify the respondent's statehood before the case is heard.
        why: Tempting because recognition questions can arise, but the lecture's reason is the procedural character of immunity, not an executive certificate.
      - text: Because a finding of immunity amounts to a ruling that the state's conduct was lawful.
        why: Tempting but backwards — the ruling on immunity does not affect the substantive rule at all; the conduct may still be unlawful.
  - key: q105
    type: mcq
    concept: state-immunity-foundations
    difficulty: 2
    stem: In an exam answer on state immunity, what is the correct legal source to apply, according to the lecture?
    options:
      - text: The UN Convention on Jurisdictional Immunities 2004, which entered into force once 25 states had ratified it.
        why: Tempting because the lecture cites its articles throughout, but it needs 30 ratifications and has only 25, so it is not in force.
      - text: Customary international law, using the 2004 Convention's articles as a written guide because they mostly reflect custom.
        correct: true
        why: Correct — the lecturer says the convention is not in force, so everything on state immunity is customary international law; the articles are cited as a road map.
      - text: The ILC's 1991 Draft Articles, which bind states as the codified text of state immunity.
        why: Tempting because the ILC drafted the rules, but draft articles are not binding; the 1991 work led to the 2004 Convention, and custom governs.
  - key: q106
    type: mcq
    concept: state-immunity-foundations
    difficulty: 2
    stem: Under art 7 of the 2004 Convention, when does a state lose immunity through consent?
    options:
      - text: When it expressly consents to the exercise of foreign jurisdiction, for example by agreement.
        correct: true
        why: Correct — art 7 removes immunity where the state expressly consents, which the lecturer says it can do by agreement, in a contract, beforehand or after the fact.
      - text: Whenever it maintains an embassy in the forum state and so accepts that state's laws generally.
        why: Tempting because an embassy implies a presence, but keeping a mission is not express consent to the courts' jurisdiction over the state.
      - text: Only when its parliament passes a statute waiving immunity for the specific case.
        why: Tempting because waiver sounds formal, but art 7 requires express consent, which may be by agreement or contract; no particular domestic form is required.
  - key: q107
    type: mcq
    concept: state-immunity-foundations
    difficulty: 3
    stem: State A sues a company in State B's courts, loses, and then claims immunity to resist the judgment. What result?
    options:
      - text: Immunity succeeds, because a foreign state may raise its immunity at any stage of the proceedings, even after judgment has been given against it.
        why: Tempting because immunity is a shield, but once a state has waived it by participating it cannot reclaim it when the judgment goes against it.
      - text: Immunity fails — by initiating and participating in the proceedings A waived it (art 8) and cannot reclaim it after an adverse judgment.
        correct: true
        why: Correct — art 8 removes immunity where the state participates in proceedings, and the lecturer stresses that once waived it cannot be revived at the end.
      - text: Immunity succeeds, but only for enforcement jurisdiction, because art 8 addresses adjudication.
        why: Tempting because the two immunities are distinct, but the question only asks whether A can avoid the judgment by reclaiming immunity; waiver by participation defeats that claim.
      - text: Immunity fails only if A's head of state personally signed the claim form.
        why: Tempting because representatives act for the state, but participation by the state itself is the waiver; no personal signature is required.
  - key: q108
    type: mcq
    concept: state-immunity-foundations
    difficulty: 2
    stem: Which situation does art 9 of the 2004 Convention address?
    options:
      - text: Proceedings against a state's warships used for government non-commercial purposes.
        why: Tempting because ships appear in the list of exceptions, but that is art 16, and warships are carved out of it.
      - text: A counterclaim arising from proceedings the state initiated or otherwise took part in.
        correct: true
        why: Correct — art 9 removes immunity for counterclaims arising from proceedings initiated by the state or otherwise participated in, on the same subject matter.
      - text: A claim for compensation for death or injury caused by the state in the forum state.
        why: Tempting because it is another no-immunity rule, but personal injury and property damage is art 12, not art 9.
  - key: q109
    type: mcq
    concept: state-immunity-foundations
    difficulty: 3
    stem: Which of these would NOT fall within the definition of "State" in art 2(1)(b) of the 2004 Convention?
    options:
      - text: A central bank acting as an organ of government.
        why: Wrong choice — organs of government are within art 2(1)(b); in Trendex the court accepted the Central Bank of Nigeria was part of the state.
      - text: A municipality entitled to perform acts in the exercise of the state's sovereign authority.
        why: Wrong choice — political subdivisions entitled to exercise sovereign authority are included; the lecturer gives municipalities as an example.
      - text: A privately owned company, with no sovereign authority, that happens to be incorporated in that state.
        correct: true
        why: Correct — private entities not entitled to exercise sovereign authority are outside the definition; only organs, sub-units, agencies exercising sovereign authority and representatives count.
      - text: An ambassador acting in his capacity as representative of the state.
        why: Wrong choice — representatives of the state acting in that capacity are the fourth limb of the art 2(1)(b) definition.
  - key: q110
    type: mcq
    concept: state-immunity-foundations
    variant-of: q109
    difficulty: 3
    stem: A state agency that issues export licences on the government's behalf is sued abroad. Is it the "State" for immunity purposes?
    options:
      - text: No — only the central government and its ministers can ever be the state.
        why: Tempting because the state is often pictured as its government, but art 2(1)(b) expressly extends to agencies and instrumentalities exercising sovereign authority.
      - text: Yes, to the extent it is entitled to perform acts in the exercise of the state's sovereign authority.
        correct: true
        why: Correct — agencies or instrumentalities of the state count to the extent they are entitled to perform acts in the exercise of sovereign authority, such as licensing.
      - text: Yes, but only if the agency was created by the state's constitution rather than by ordinary legislation.
        why: Tempting because constitutional status sounds decisive, but the test in art 2(1)(b) is entitlement to exercise sovereign authority, not the agency's legal origin.
  - key: q111
    type: mcq
    concept: state-immunity-foundations
    difficulty: 2
    stem: Under the UK State Immunity Act 1978, as presented in the slides, who bears the burden of proof on immunity?
    options:
      - text: The foreign state, which must prove it is a state and that its act was sovereign.
        why: Tempting because the state is the one claiming immunity, but the slide says there is a presumption of immunity, with the plaintiff bearing the burden to the contrary.
      - text: The plaintiff, who must displace a presumption that the state possesses immunity.
        correct: true
        why: Correct — the slide says the Act treats immunity as a preliminary matter with a presumption that a state possesses immunity, and the plaintiff bears the burden of proof to the contrary.
      - text: Neither party; the court decides immunity of its own motion at the end of the trial.
        why: Tempting because the court raises immunity, but the Act treats it as a preliminary matter decided first, with the burden on the plaintiff.
  - key: q112
    type: mcq
    concept: state-immunity-foundations
    difficulty: 2
    stem: What is the position under Australia's Foreign States Immunities Act 1985, as summarised in the slides?
    options:
      - text: Foreign states are never immune in Australian courts, because Australia follows a purely restrictive model.
        why: Tempting because the restrictive approach limits immunity, but the Act starts from immunity; it is lost only on waiver or for commercial transactions.
      - text: Foreign states are immune only if they are parties to the 2004 UN Convention on Jurisdictional Immunities of States and their Property.
        why: Tempting because the convention is the codification, but it is not in force and the Act does not tie immunity to being a party.
      - text: Foreign states are immune in principle, unless they have waived immunity or the case concerns a commercial transaction.
        correct: true
        why: Correct — the slide says that under the 1985 Act foreign states are in principle immune, unless and to the extent they have waived immunity or the case concerns a commercial transaction.
  - key: q113
    type: mcq
    concept: state-immunity-foundations
    variant-of: q107
    difficulty: 3
    stem: State C is sued in State D's courts, files a full defence and argues the case for a year. Before judgment it claims immunity. What is the better view?
    options:
      - text: Immunity is lost; by participating in the proceedings State C waived it under art 8.
        correct: true
        why: Correct — art 8 removes immunity where the state participates in court proceedings; responding to the claim is treated as accepting the proceeding.
      - text: Immunity is preserved, because only a written waiver signed before proceedings begin counts under art 7.
        why: Tempting because art 7 deals with express consent, but art 8 separately removes immunity by participation, which needs no written instrument.
      - text: Immunity is preserved because judgment has not yet been given, so nothing has been waived.
        why: Tempting because the lecturer's example is a claim made after judgment, but the waiver happens by participating, not at the moment judgment is given.
  - key: q114
    type: mcq
    concept: state-immunity-foundations
    variant-of: q102
    difficulty: 2
    stem: A court has given judgment against a foreign state and the plaintiff now asks the court to seize that state's property. Which immunity is engaged?
    options:
      - text: Immunity from enforcement, which applies only after adjudicative jurisdiction is established and a judgment rendered.
        correct: true
        why: Correct — enforcement concerns implementing the judgment, e.g. confiscation of assets, and arises only after adjudication; a state may still be immune from it.
      - text: Immunity from adjudication, because the court is still exercising its power to decide the merits of the plaintiff's claim against the state.
        why: Tempting because both are court processes, but the merits have been decided; seizing property is implementing the judgment, which is enforcement.
      - text: Immunity from prescription, because the forum state is making new law about the property.
        why: Tempting because it sounds like a third category, but immunities do not affect prescriptive jurisdiction at all, and seizure is enforcement.
  - key: q115
    type: mcq
    concept: state-immunity-foundations
    variant-of: q105
    difficulty: 2
    stem: How many ratifications does the 2004 Convention need to enter into force, and how many has it received (as of 2026, per the slides)?
    options:
      - text: It needs 25 and has 30, so it is in force.
        why: Tempting because the two numbers appear together, but they are reversed; with 25 of the 30 it needs, the convention is not yet in force.
      - text: It needs 30 and has 25, so it is not yet in force.
        correct: true
        why: Correct — the slide says it comes into force once there are 30 ratifications and 25 have been received, so custom still governs state immunity.
      - text: It needs 60, like many multilateral treaties, and has 25, so it will not be in force for decades.
        why: Tempting because 60 is a common threshold elsewhere, but the slide gives 30 as the threshold for this convention.
  - key: q116
    type: truefalse
    set: quickfire
    concept: state-immunity-foundations
    statement: State immunity is a principle of customary international law.
    answer: true
    why: True — the slides say state immunity is a principle of customary international law, well established in state practice and in national and international jurisprudence.
  - key: q117
    type: truefalse
    set: quickfire
    concept: state-immunity-foundations
    statement: The 2004 UN Convention on Jurisdictional Immunities of States and their Property is in force.
    answer: false
    why: False — it needs 30 ratifications and, as of 2026, has 25, so it is not in force; the lecture applies it only as a guide to custom.
  - key: q118
    type: truefalse
    set: quickfire
    concept: state-immunity-foundations
    statement: A ruling that a foreign state is immune means the court has found its conduct lawful.
    answer: false
    why: False — immunity is procedural; the ruling only bars the court from hearing the case and does not affect the substantive rule on whether the conduct was lawful.
  - key: q119
    type: truefalse
    set: quickfire
    concept: state-immunity-foundations
    statement: A state that takes part in proceedings before a foreign court loses its immunity in those proceedings.
    answer: true
    why: True — art 8 of the 2004 Convention (reflecting custom) removes immunity where the state participates in court proceedings, and the waiver cannot be withdrawn later.
  - key: q120
    type: short
    concept: state-immunity-foundations
    difficulty: 3
    prompt: |
      Explain the basis and nature of state immunity, including the distinction between immunity from adjudication and
      immunity from enforcement, the legal source of the rules, and how a state can lose its immunity.
    model: |
      State immunity is grounded in sovereign equality: states are juridically equal, so no state may exercise
      jurisdiction over another without consent, and the courts of one state may decline jurisdiction where the
      respondent is another state. It limits adjudicative and enforcement jurisdiction, not prescriptive jurisdiction.
      Immunity from adjudication means a state cannot be sued before a foreign court unless it consents; immunity from
      enforcement means a judgment, once rendered, cannot be enforced upon the state, e.g. by confiscating its assets.

      Immunity is a procedural barrier, so the court rules on it first; it says nothing about whether the conduct was
      lawful. Its source is customary international law. The UN Convention on Jurisdictional Immunities of States and
      their Property (2004) has 25 of the 30 ratifications it needs and is not in force, but its articles mostly reflect
      custom: art 5 states the principle and art 6 the modalities. A state loses immunity by express consent (art 7),
      by participating in proceedings (art 8) and for counterclaims (art 9), and once waived it cannot reclaim immunity
      when judgment goes against it. The UK State Immunity Act 1978 and Australia's Foreign States Immunities Act 1985
      apply the same approach domestically.
    rubric:
      - id: r1
        criterion: States the basis of state immunity in sovereign equality.
        marks: 2
        top-band: Links juridical equality to the rule that no state exercises jurisdiction over another without consent.
        margin-note: Good — the rationale frames everything else.
        authorities: []
      - id: r2
        criterion: Distinguishes immunity from adjudication and immunity from enforcement, and notes prescriptive jurisdiction is unaffected.
        marks: 2
        top-band: Explains that enforcement arises only after adjudicative jurisdiction and a judgment, with an example such as asset confiscation.
        margin-note: Clear two-stage analysis.
        authorities: []
      - id: r3
        criterion: Identifies the procedural nature and customary source of the rules.
        marks: 2
        top-band: Notes the 2004 Convention is not in force (25 of 30) and is used as evidence of custom.
        margin-note: Many answers wrongly treat the convention as binding — you did not.
        authorities: [uncsi-2004-arts-5-6]
      - id: r4
        criterion: Explains waiver by consent, participation and counterclaim.
        marks: 2
        top-band: Cites arts 7–9 and adds that a waiver cannot be withdrawn after an adverse judgment.
        margin-note: Precise use of the articles.
        authorities: [uncsi-2004-arts-7-9]

  # ---------- Concept 2: restrictive-state-immunity ----------
  - key: q201
    type: mcq
    concept: restrictive-state-immunity
    difficulty: 1
    set: pretest
    stem: Under the restrictive approach, which act of a foreign state is most likely to be classed as jure gestionis, so that immunity does not apply?
    options:
      - text: Passing legislation that nationalises a sector of its own economy.
        why: Tempting because it affects commerce, but legislation is a classic sovereign act (jure imperii) on the slide, so immunity applies.
      - text: Buying cement from a foreign company under a sale contract.
        correct: true
        why: Correct — a contract for the sale of goods is a commercial transaction, an act of a non-sovereign nature (jure gestionis); Trendex is the lecture's cement example.
      - text: Deploying its armed forces abroad during an armed conflict with a neighbour.
        why: Tempting because it has large effects on private parties, but military affairs are listed on the slide as jure imperii; Germany v Italy confirms immunity for such acts.
      - text: Arresting a suspect through its police acting under its criminal law.
        why: Tempting because an arrest can harm an individual, but police power is expressly listed as an act of a sovereign nature, which remains immune.
  - key: q202
    type: mcq
    concept: restrictive-state-immunity
    difficulty: 2
    stem: What did the German Federal Constitutional Court decide in the Empire of Iran Case (1963)?
    options:
      - text: That absolute state immunity remained customary law, so Iran could not be sued at all in German courts.
        why: Tempting because absolute immunity was the older view, but the court found it was no longer customary international law.
      - text: That absolute immunity was no longer custom, distinguishing sovereign acts from commercial acts.
        correct: true
        why: Correct — the slide says the court found absolute state immunity was no longer customary international law, distinguishing jure imperii from jure gestionis.
      - text: That Iran had waived its immunity by maintaining an embassy and trading relations in Germany.
        why: Tempting because waiver removes immunity, but the case is cited for the shift to the restrictive approach, not for waiver by presence.
  - key: q203
    type: mcq
    concept: restrictive-state-immunity
    difficulty: 2
    stem: In Trendex Trading Corporation v Central Bank of Nigeria (1977), why was immunity rejected?
    options:
      - text: Because the Central Bank was a separate private company and not part of the Nigerian state at all.
        why: Tempting because banks are often independent, but the lecturer says the court accepted the Central Bank was an organ of the state; immunity failed for another reason.
      - text: Because Nigeria had expressly waived immunity in the letter of credit it issued to Trendex.
        why: Tempting because waiver is a route out of immunity, but the case turned on the commercial nature of the transaction, not on any waiver.
      - text: Because the failure to honour a letter of credit was a commercial act, not a sovereign one.
        correct: true
        why: Correct — the English Court of Appeal looked at the nature of the transaction and held it was commercial, not a sovereign act, so immunity did not apply.
  - key: q204
    type: mcq
    concept: restrictive-state-immunity
    difficulty: 2
    stem: Art 10 of the 2004 Convention removes immunity for commercial transactions. In which case does immunity still apply?
    options:
      - text: A contract for the supply of services between a state and a foreign company.
        why: Wrong choice — a services contract with a foreign juridical person is exactly what art 10 covers, so immunity cannot be invoked.
      - text: A commercial transaction between two states.
        correct: true
        why: Correct — the slide lists commercial transactions between states as an exception to art 10, so immunity applies; the same is true where the parties expressly agreed.
      - text: A loan made to the state by a foreign natural person who lives in the forum state.
        why: Wrong choice — loans are commercial transactions under art 2(1)(c), and a foreign natural person is within art 10, so immunity is lost.
  - key: q205
    type: mcq
    concept: restrictive-state-immunity
    difficulty: 2
    stem: Which of these is expressly excluded from the definition of "commercial transaction" in art 2(1)(c)?
    options:
      - text: A contract of employment of persons.
        correct: true
        why: Correct — art 2(1)(c) ends "but not including a contract of employment of persons"; employment is dealt with separately (art 11, certain contracts of employment).
      - text: An obligation of guarantee or indemnity in respect of a loan the state has taken out.
        why: Wrong choice — the definition expressly includes guarantees and indemnities in respect of loans or other financial transactions.
      - text: A transaction of an industrial, trading or professional nature entered into by a state agency.
        why: Wrong choice — the third limb covers any other contract or transaction of a commercial, industrial, trading or professional nature.
  - key: q206
    type: mcq
    concept: restrictive-state-immunity
    difficulty: 2
    stem: A state argues that its contract was not commercial because it made no profit from it. How does the lecture answer this?
    options:
      - text: The argument succeeds; a transaction is commercial only if the state intended to make a profit.
        why: Tempting because commerce suggests profit, but the lecturer says whether there is a profit to be made is not relevant.
      - text: The argument fails; profit is irrelevant — the question is whether there is a financial or commercial transaction.
        correct: true
        why: Correct — the lecturer says whether a profit is made is not relevant; what matters is whether there is a commercial or financial transaction of some sort.
      - text: The argument succeeds only if the state is a developing country that conducts its foreign trade through state-owned enterprises.
        why: Tempting because some states trade through state entities, but the lecture draws no such distinction; profit is simply irrelevant.
  - key: q207
    type: mcq
    concept: restrictive-state-immunity
    difficulty: 3
    stem: Under art 2(2), how is it decided whether a contract is a "commercial transaction"?
    options:
      - text: By its purpose alone, since states always act for public ends and the purpose shows whether the act is sovereign.
        why: Tempting because states pursue policy goals, but art 2(2) makes nature the primary test; purpose counts only if the parties agreed.
      - text: Primarily by its nature, with its purpose also taken into account if the parties so agreed.
        correct: true
        why: Correct — art 2(2) says reference should be made primarily to the nature of the contract, but its purpose should also be considered if the parties to it have so agreed.
      - text: By whether the forum state's courts consider the contract to be politically sensitive at the time of trial.
        why: Tempting because courts may be wary of politics, but the test is the nature of the transaction, not the forum court's view of its sensitivity.
  - key: q208
    type: mcq
    concept: restrictive-state-immunity
    difficulty: 2
    stem: A foreign state buys office supplies for its embassy and fails to pay. Can it claim immunity?
    options:
      - text: Yes, because the supplies serve the embassy's official diplomatic business.
        why: Tempting because the purpose is official, but the lecturer uses this very example — the nature of the purchase is commercial and the purpose is not relevant.
      - text: No, because buying goods is a commercial transaction by nature, whatever its official purpose.
        correct: true
        why: Correct — the lecturer says purchasing office supplies for an embassy is a commercial transaction; its nature is commercial, so immunity does not apply.
      - text: Yes, because anything connected with an embassy is inviolable under the Vienna Convention on Diplomatic Relations.
        why: Tempting because mission premises are inviolable under art 22 VCDR, but that protects the premises; it does not make the state's supply contract a sovereign act.
  - key: q209
    type: mcq
    concept: restrictive-state-immunity
    difficulty: 3
    stem: In Playa Largo v I Congreso del Partido (1983), why did the House of Lords reject Cuba's claim to immunity?
    options:
      - text: Because the shipping activity was commercial in nature, despite its foreign-policy objective.
        correct: true
        why: Correct — the House of Lords held that delivering sugar under a contract was commercial (jure gestionis); Cuba's political reason for diverting the ships did not make it sovereign.
      - text: Because Cuba had not been recognised by the UK and so could not claim to be a state in UK courts.
        why: Tempting because recognition can matter, but nothing in the case turned on recognition; the issue was whether the act was sovereign or commercial.
      - text: Because the coup in Chile made the contract illegal.
        why: Tempting because the coup triggered the diversion, but the court's reasoning concerned the commercial nature of the activity, not the contract's legality.
  - key: q210
    type: mcq
    concept: restrictive-state-immunity
    variant-of: q209
    difficulty: 3
    stem: A state-owned airline cancels a charter contract with a foreign tour company after its government breaks off relations with the tour company's state. The state claims immunity. Applying Playa Largo, what is the likely result?
    options:
      - text: Immunity applies, because breaking off relations is a foreign-policy decision and the cancellation followed from it.
        why: Tempting because the motive is political, as Cuba argued, but Playa Largo holds that a policy motive does not turn a commercial act into a sovereign one.
      - text: No immunity — the charter is commercial in nature, and the political motive does not change that.
        correct: true
        why: Correct — as in Playa Largo, the activity is commercial (jure gestionis) by nature; under art 2(2) purpose counts only if the parties agreed.
      - text: Immunity applies, because a state-owned airline is always an organ of the state exercising sovereign authority.
        why: Tempting because state ownership suggests sovereignty, but even state organs lose immunity for commercial acts, as Trendex and Playa Largo show.
  - key: q211
    type: mcq
    concept: restrictive-state-immunity
    difficulty: 3
    stem: Which of the following is NOT a condition of the art 12 exception for death, injury or property damage?
    options:
      - text: The act or omission is alleged to be attributable to the state.
        why: Wrong choice — attribution to the state is an express condition of art 12, as the lecturer notes.
      - text: The act or omission occurred in whole or in part in the forum state's territory.
        why: Wrong choice — art 12 requires the act or omission to have occurred at least partly in the territory of the forum state.
      - text: The victim is a national of the forum state.
        correct: true
        why: Correct — art 12 says nothing about the victim's nationality; its conditions are attribution, occurrence in the forum state and the author's presence there.
      - text: The author of the act or omission was present in the forum state at the time.
        why: Wrong choice — art 12 requires the author to have been present in that territory at the time of the act or omission.
  - key: q212
    type: mcq
    concept: restrictive-state-immunity
    difficulty: 3
    stem: A driver employed by State X's embassy in Canberra negligently injures a pedestrian while on official duty. The pedestrian sues State X for compensation in an Australian court. On art 12, is State X immune?
    options:
      - text: Yes, because the driver was on official duty, so the act was a sovereign act of State X.
        why: Tempting because official duty sounds sovereign, but art 12 removes immunity for injury caused by an act attributable to the state where its conditions are met.
      - text: No — the act is attributable to State X, occurred in Australia, and its author was present there.
        correct: true
        why: "Correct — all art 12 conditions are met: pecuniary compensation for injury, an act attributable to the state, occurring in the forum state, with the author present."
      - text: Yes, because only claims for damage to tangible property fall within art 12, not claims for personal injury.
        why: Tempting because art 12 mentions property, but it expressly covers death or injury to the person as well as damage to or loss of tangible property.
  - key: q213
    type: mcq
    concept: restrictive-state-immunity
    variant-of: q212
    difficulty: 4
    stem: State Y's agents, acting from inside State Y and never entering Australia, cause a cyber-incident that damages property in Sydney. The owner sues State Y in Australia under the art 12 exception. What is the problem?
    options:
      - text: The damage is to tangible property, which art 12 does not cover because it is limited to personal injury.
        why: Tempting because the provision is often discussed as a personal injury exception, but it expressly includes damage to or loss of tangible property.
      - text: The act must have occurred in whole or in part in the forum state, and the author must have been present there at the time.
        correct: true
        why: Correct — art 12 needs the act or omission to occur at least partly in the forum state and its author to be present there; agents who never entered Australia fail the presence condition.
      - text: Art 12 applies only to acts of armed forces, and these agents were civilians.
        why: Tempting because Germany v Italy concerned armed forces, but art 12 applies to any act attributable to the state; in fact the ICJ kept immunity for armed forces in armed conflict.
  - key: q214
    type: mcq
    concept: restrictive-state-immunity
    difficulty: 3
    stem: What kind of damage does the lecturer say can be claimed against a state under the art 12 exception?
    options:
      - text: Both material damage and moral damage, so long as the conditions of art 12 are met.
        why: Tempting because both are familiar heads of damages, but the lecturer stresses art 12 is valid only for material damage, not moral damage.
      - text: Material damage only, not moral damage.
        correct: true
        why: Correct — the lecturer says art 12 is only valid for material damages; there is no possibility to claim moral damages against a state in these proceedings.
      - text: Moral damage only, because pecuniary losses must be pursued through diplomatic protection rather than in court.
        why: Tempting because diplomatic protection is another route, but art 12 is expressly about pecuniary compensation, i.e. material damage.
  - key: q215
    type: mcq
    concept: restrictive-state-immunity
    difficulty: 2
    stem: How settled is the distinction between acta jure imperii and acta jure gestionis, according to the lecture?
    options:
      - text: Universally settled — every state has accepted it since the 2004 Convention was adopted by the General Assembly.
        why: Tempting because the convention codifies it, but the lecturer says around one-third of states still do not recognise the distinction.
      - text: Not completely — about one-third of states, including China, do not recognise it.
        correct: true
        why: Correct — the lecturer notes that around one-third of the world's states, including very important states such as China, do not recognise the distinction.
      - text: Rejected by most states — only common law countries apply it, following the UK and the US.
        why: Tempting because Trendex and Playa Largo are English cases, but the distinction came from civil law countries; common law countries originally held the absolute view.
  - key: q216
    type: mcq
    concept: restrictive-state-immunity
    difficulty: 2
    stem: Which proceeding is NOT one in which the slides say state immunity cannot be invoked under the 2004 Convention?
    options:
      - text: Proceedings about the state's participation in companies or other collective bodies (art 15).
        why: Wrong choice — art 15 is on the slide's list of proceedings in which immunity cannot be invoked.
      - text: Proceedings about a warship's conduct on a naval deployment.
        correct: true
        why: Correct — art 16 removes immunity for state ships only when not used for government non-commercial purposes, with an exception for warships, so immunity remains.
      - text: Proceedings about intellectual and industrial property held by the state (art 14).
        why: Wrong choice — art 14, intellectual and industrial property, is listed as a proceeding in which immunity cannot be invoked.
      - text: Proceedings about an arbitration agreement relating to a commercial transaction (art 17).
        why: Wrong choice — art 17 covers arbitration agreements relating to commercial transactions, which are on the no-immunity list.
  - key: q217
    type: truefalse
    set: quickfire
    concept: restrictive-state-immunity
    statement: Under art 2(2), the purpose of a transaction is the primary test of whether it is commercial.
    answer: false
    why: False — art 2(2) makes the nature of the contract or transaction the primary test; purpose is taken into account only if the parties have so agreed.
  - key: q218
    type: truefalse
    set: quickfire
    concept: restrictive-state-immunity
    statement: In Trendex the Central Bank of Nigeria was denied immunity even though it was an organ of the state.
    answer: true
    why: True — the English Court of Appeal accepted the bank was part of the state but held the transaction commercial in nature, so immunity did not apply.
  - key: q219
    type: truefalse
    set: quickfire
    concept: restrictive-state-immunity
    statement: Common law countries such as the UK originally treated state immunity as absolute.
    answer: true
    why: True — the lecturer says the absolute view flowed mostly from common law jurisdictions such as the UK and US, whose decisions later evolved to recognise the distinction.
  - key: q221
    type: truefalse
    set: quickfire
    concept: restrictive-state-immunity
    statement: Buying office supplies for an embassy is a commercial transaction, whatever its official purpose.
    answer: true
    why: True — the lecturer's example; the nature of the purchase is commercial and its purpose of carrying out official business is not relevant, so immunity does not apply.
  - key: q220
    type: short
    concept: restrictive-state-immunity
    difficulty: 3
    prompt: |
      A state-owned shipping company of State P contracts to carry grain to a buyer in State Q. After a change of
      government in State Q, State P orders the ship home for foreign-policy reasons. The buyer sues in the courts of
      State R. Advise whether State P can claim immunity.
    model: |
      The issue is whether State P's conduct is a sovereign act (jure imperii), attracting immunity, or a commercial act
      (jure gestionis), which does not. State immunity was once absolute, but custom now follows the restrictive
      approach: the Empire of Iran Case (1963) held absolute immunity was no longer customary law, and Trendex (1977)
      denied immunity to a state organ in a commercial transaction. Art 10 of the 2004 Convention, reflecting custom
      though not in force, removes immunity in proceedings arising out of a commercial transaction with a foreign
      natural or juridical person, unless the transaction is between states or the parties agreed otherwise.

      A contract of carriage is a contract for the supply of services under art 2(1)(c). Under art 2(2) we look
      primarily at its nature; purpose counts only if the parties so agreed. In Playa Largo (1983) Cuba's diversion of
      a sugar cargo after the coup in Chile was held commercial despite its foreign-policy objective. The same applies
      here: the recall breaches a commercial contract, and the political motive does not change its nature. State P is
      likely not immune, although R's courts may note that about one-third of states reject the distinction.
    rubric:
      - id: r1
        criterion: Identifies the issue as the distinction between acta jure imperii and acta jure gestionis.
        marks: 2
        top-band: Frames the problem as sovereign versus commercial act and explains the shift from absolute to restrictive immunity.
        margin-note: Good issue statement.
        authorities: []
      - id: r2
        criterion: States the commercial transactions rule and its exceptions.
        marks: 2
        top-band: Cites art 10 (and art 2(1)(c)), notes the exceptions, and flags that the convention reflects custom but is not in force.
        margin-note: Accurate rule with the right caveat.
        authorities: [uncsi-2004-art-10, uncsi-2004-art-2-1-c]
      - id: r3
        criterion: Applies the nature-over-purpose test with Playa Largo.
        marks: 3
        top-band: Uses art 2(2) and draws the analogy with Cuba's politically motivated diversion in Playa Largo.
        margin-note: This is the heart of the answer — strong analogy.
        authorities: [uncsi-2004-art-2-2]
      - id: r4
        criterion: Reaches a reasoned conclusion.
        marks: 1
        top-band: Concludes State P is likely not immune, noting any residual uncertainty.
        margin-note: Clear conclusion.
        authorities: []

  # ---------- Concept 3: immunities-of-state-officials ----------
  - key: q301
    type: mcq
    concept: immunities-of-state-officials
    difficulty: 1
    set: pretest
    stem: Which immunity of a state official continues after the official leaves office?
    options:
      - text: Personal immunity (ratione personae), which covers all acts, public and private, for life.
        why: Tempting because personal immunity is the wider one, but it has a temporal limit — it lasts only while the official is in office.
      - text: Functional immunity (ratione materiae), for official acts done while in office.
        correct: true
        why: Correct — functional immunity attaches to the official act itself, so it continues after the official leaves office; personal immunity ends with the office.
      - text: Neither — all immunity ends the day the official leaves office, whatever the act.
        why: Tempting because office is the trigger for personal immunity, but functional immunity survives as a residual immunity for official acts.
  - key: q302
    type: mcq
    concept: immunities-of-state-officials
    difficulty: 2
    stem: According to the ICJ in Arrest Warrant, why are immunities accorded to Ministers for Foreign Affairs?
    options:
      - text: As a personal privilege recognising the dignity of the individual who holds high office.
        why: Tempting because the minister personally benefits, but the Court says the immunities are "not granted for their personal benefit".
      - text: To ensure the effective performance of their functions on behalf of their states, including travelling freely.
        correct: true
        why: Correct — the Court said the immunities ensure the effective performance of their functions; a foreign minister must be free to travel and communicate at any time.
      - text: Because foreign ministers are diplomatic agents covered by art 31 of the Vienna Convention on Diplomatic Relations.
        why: Tempting because both are diplomatic roles, but officials' immunities are customary law, a separate regime from the VCDR, which covers accredited diplomats.
  - key: q303
    type: mcq
    concept: immunities-of-state-officials
    difficulty: 2
    stem: What is the legal source of the immunities of state officials, according to the lecture?
    options:
      - text: Art 2(1)(b) of the 2004 Convention, which lists representatives of the state as part of the state.
        why: Tempting because representatives appear in the art 2(1)(b) definition, but the lecturer says the 2004 Convention is not relevant to officials' immunities.
      - text: Customary international law, as recognised by the ICJ in the Arrest Warrant case.
        correct: true
        why: Correct — the lecturer says officials' immunities are customary international law, recognised by the ICJ; there is no convention on them.
      - text: The VCCR, which governs all state representatives.
        why: Tempting because consuls are state representatives, but the VCCR covers consular officials only; officials' immunities rest on custom.
  - key: q304
    type: mcq
    concept: immunities-of-state-officials
    difficulty: 1
    stem: Which officials enjoy personal immunity (ratione personae)?
    options:
      - text: Every civil servant of a state, while working abroad on official business.
        why: Tempting because civil servants act for the state, but personal immunity applies only to very high-ranking officials; others have only functional immunity.
      - text: Very high-ranking officials — in particular heads of state, heads of government and foreign ministers.
        correct: true
        why: Correct — the slide says personal immunity applies only to very high-ranking officials, in particular heads of state, heads of government and foreign ministers.
      - text: Any official who has served for more than one term in the government of their state.
        why: Tempting because seniority sounds relevant, but personal immunity depends on the office held, not length of service.
  - key: q305
    type: mcq
    concept: immunities-of-state-officials
    difficulty: 2
    stem: For what proposition do the slides cite Certain Questions of Mutual Assistance in Criminal Matters (Djibouti v France) (2008)?
    options:
      - text: That heads of state and foreign ministers enjoy privileged status as a matter of customary international law.
        correct: true
        why: Correct — the slide cites Djibouti v France for the ICJ's finding that the privileged status of heads of state and foreign ministers is customary international law.
      - text: That former heads of state lose all immunity for torture under the Convention against Torture.
        why: Tempting because it is another immunity case, but that proposition comes from Pinochet (No 3) in the House of Lords, not the ICJ in Djibouti v France.
      - text: That a state's commercial conduct abroad, such as buying goods or services, is not immune under the restrictive approach.
        why: Tempting because restrictive immunity is this week's topic, but that proposition comes from Trendex and Playa Largo, not Djibouti v France.
  - key: q306
    type: mcq
    concept: immunities-of-state-officials
    difficulty: 2
    stem: An official accused abroad announces, "I waive my immunity and will stand trial." What is the legal effect?
    options:
      - text: The waiver is effective, because immunity exists for the official's protection and the official may give it up.
        why: Tempting because the official is the one protected, but the lecturer stresses the immunity belongs to the state, not the person.
      - text: The waiver is ineffective — only the state can waive the official's immunity, because the immunity belongs to it.
        correct: true
        why: Correct — the lecturer says the person cannot say "I will waive my immunity"; functional and personal immunity can only be waived by the state.
      - text: The waiver is effective only for personal immunity, since functional immunity cannot be waived by anyone, including the state.
        why: Tempting because the two immunities differ, but both can be waived — by the state, not the individual.
  - key: q307
    type: mcq
    concept: immunities-of-state-officials
    difficulty: 2
    stem: A soldier kills an enemy soldier on the battlefield while acting under orders. Which immunity does the lecturer use this to illustrate?
    options:
      - text: Personal immunity, because the soldier personifies the state on the battlefield.
        why: Tempting because the soldier acts for the state, but personal immunity is reserved for the highest officials; a soldier is not one of them.
      - text: State immunity from enforcement, because the killing was an act of the state's armed forces.
        why: Tempting because armed forces are organs of the state, but the example concerns the individual soldier's immunity, not proceedings against the state.
      - text: Functional immunity, because it was an official act done with authority.
        correct: true
        why: Correct — the lecturer says the soldier acted as an official of the state, with authority, in an official function, so functional immunity applies.
  - key: q308
    type: mcq
    concept: immunities-of-state-officials
    difficulty: 3
    stem: The sitting president of Greece, on holiday in Australia, drives drunk and kills someone. Can an Australian court try the president?
    options:
      - text: Yes — drink-driving on holiday is a private act, so no immunity of any kind applies.
        why: Tempting because the act is private and outside functional immunity, but a sitting head of state has personal immunity, which covers private acts too.
      - text: No — as a sitting head of state the president has personal immunity, which covers even private acts.
        correct: true
        why: "Correct — the lecturer's example: personal immunity is complete, even for private acts, while the president is in office, so the Australian court cannot try them."
      - text: No — the president has functional immunity, because heads of state are treated as always acting in an official capacity.
        why: Tempting because heads of state are rarely off duty, but the lecturer says being drunk on holiday is not an official act; it is personal immunity that protects them.
  - key: q309
    type: mcq
    concept: immunities-of-state-officials
    variant-of: q308
    difficulty: 3
    stem: Two years after leaving office, the former Greek president returns to Australia. Can they now be prosecuted for the drink-driving death?
    options:
      - text: No, because personal immunity continues for life once a person has served as head of state.
        why: Tempting because the office was the highest, but personal immunity lasts only for the duration of the time in office.
      - text: No, because functional immunity now protects all acts done while in office.
        why: Tempting because functional immunity survives office, but it covers only official acts; a drunken holiday drive is a private act.
      - text: Yes — personal immunity ended with the office, and functional immunity does not cover the private act.
        correct: true
        why: Correct — the lecturer says once the president leaves office the immunity would not apply and they could be arrested and prosecuted, as the act was not official.
  - key: q310
    type: mcq
    concept: immunities-of-state-officials
    difficulty: 2
    stem: Can Greece's own courts try its sitting president for the drink-driving death in Australia?
    options:
      - text: Yes — the immunities apply only before foreign courts, not the official's own state.
        correct: true
        why: Correct — the lecturer says the immunities only apply to the foreign state; Greece could hold proceedings, and Arrest Warrant confirms no immunity at home.
      - text: No — personal immunity bars every court in the world while the president remains in office.
        why: Tempting because personal immunity is described as complete, but it is immunity from foreign jurisdiction; it does not bind the official's own courts.
      - text: No — only the International Criminal Court can try a sitting head of state for any offence.
        why: Tempting because the ICC disregards official capacity, but it is not the only option; domestic courts of the official's own state can also try them.
  - key: q311
    type: mcq
    concept: immunities-of-state-officials
    difficulty: 3
    stem: For functional immunity, when is an act an 'official' act?
    options:
      - text: When it was done by an individual with official authority — 'under the colour of authority'.
        correct: true
        why: Correct — the slide says that as long as an act is performed by an individual with official authority ('under the colour of authority') it is an official act.
      - text: Only when the act was lawful under the law of the official's state and of the forum state.
        why: Tempting because authority suggests legality, but the test is whether the act was done with official authority, not whether it was lawful.
      - text: Whenever the individual holds any government post at the time, whatever the nature of the act they did.
        why: Tempting because holding office matters for personal immunity, but functional immunity looks at the act, so a private act by an official is not covered.
  - key: q312
    type: mcq
    concept: immunities-of-state-officials
    difficulty: 3
    stem: Which statement correctly contrasts personal immunity (ratione personae) with functional immunity (ratione materiae)?
    options:
      - text: Personal immunity is narrower in scope, covering only official acts, but lasts longer than functional immunity.
        why: "Tempting because the two are often muddled, but this reverses them: personal immunity is wider in scope and ends with office."
      - text: Personal immunity is wider in scope but limited to a few officials and to their term; functional immunity covers only official acts but survives office.
        correct: true
        why: Correct — the lecturer says personal immunity covers official and private acts but applies only to high-ranking officials while in office; functional immunity covers official acts and continues after office.
      - text: The two differ only in name; both cover all acts of any official for as long as they hold office.
        why: Tempting because both protect officials, but the slide sets out clear differences of scope, persons covered and duration.
  - key: q313
    type: mcq
    concept: immunities-of-state-officials
    variant-of: q301
    difficulty: 3
    stem: A former foreign minister is sued abroad over a treaty negotiation he conducted for his state while in office. Which immunity may he rely on?
    options:
      - text: Personal immunity, because he was once a foreign minister and that status never lapses.
        why: Tempting because foreign ministers have personal immunity, but only while in office; he has left.
      - text: Functional immunity, because negotiating a treaty was an official act done while in office.
        correct: true
        why: Correct — functional immunity covers official acts done while in office and continues after the official leaves office; a treaty negotiation is plainly official.
      - text: No immunity, because every immunity a foreign minister enjoys ends on the day he leaves office.
        why: Tempting because personal immunity does end, but functional immunity remains as a residual immunity for official acts.
  - key: q314
    type: mcq
    concept: immunities-of-state-officials
    difficulty: 3
    stem: A junior trade official of State M, visiting State N for talks, assaults a hotel employee after a private dinner. Is the official immune from prosecution in State N?
    options:
      - text: Yes — every state official abroad has personal immunity while on an official visit.
        why: Tempting because the visit is official, but personal immunity is reserved for the highest officials; a junior official has only functional immunity.
      - text: No — a junior official has only functional immunity, which does not cover a private act.
        correct: true
        why: Correct — functional immunity covers only official acts done with authority; an assault after a private dinner is a private act, so State N's courts may proceed.
      - text: Yes — only State M can decide whether its official is prosecuted, because immunity belongs to the state.
        why: Tempting because the immunity belongs to the state, but that concerns waiver; it does not create an immunity for private acts where none exists.
  - key: q315
    type: mcq
    concept: immunities-of-state-officials
    variant-of: q314
    difficulty: 3
    stem: The same junior trade official signs, on State M's instructions, a document that State N says breaches its customs law. Is the official immune from prosecution in State N for signing it?
    options:
      - text: No — junior officials never enjoy any immunity from foreign criminal jurisdiction.
        why: Tempting because they lack personal immunity, but functional immunity is available to officials generally for acts done in official capacity.
      - text: Yes — signing on the state's instructions is an official act, covered by functional immunity.
        correct: true
        why: Correct — acting on State M's instructions, with official authority, is an official act 'under the colour of authority', so functional immunity applies and can be waived only by State M.
      - text: Yes, but only until the talks end, because functional immunity lasts only for the duration of the mission.
        why: Tempting because personal immunity has a time limit, but functional immunity continues after the official leaves office or the mission ends.
  - key: q316
    type: mcq
    concept: immunities-of-state-officials
    difficulty: 2
    stem: Why does the lecturer insist that state immunity and the immunities of state officials be kept separate in an answer?
    options:
      - text: Because they are governed by different regimes of international law and different conditions apply.
        correct: true
        why: Correct — the lecturer says the categories are clearly divided because they are governed by different regimes of international law with different conditions.
      - text: Because state immunity applies only in civil cases and officials' immunity only in criminal cases.
        why: Tempting because the leading cases split that way, but the lecture does not draw the line on civil versus criminal; the regimes and conditions differ.
      - text: Because officials' immunity comes from the 2004 Convention, while state immunity comes only from custom.
        why: Tempting but reversed in part — the 2004 Convention concerns state immunity (and is not in force), while officials' immunity is customary law.
  - key: q317
    type: truefalse
    set: quickfire
    concept: immunities-of-state-officials
    statement: Personal immunity (ratione personae) covers even acts of a private nature.
    answer: true
    why: True — the slide calls personal immunity complete immunity, even in relation to acts of a private nature, for the duration of the official's time in office.
  - key: q318
    type: truefalse
    set: quickfire
    concept: immunities-of-state-officials
    statement: A state official can personally waive their own functional immunity.
    answer: false
    why: False — the immunity belongs to the state, not the person, so it can be waived only with the state's consent; the individual cannot waive it.
  - key: q319
    type: truefalse
    set: quickfire
    concept: immunities-of-state-officials
    statement: Functional immunity ends on the day the official leaves office.
    answer: false
    why: False — functional immunity attaches to official acts and continues after the official leaves office; it is personal immunity that ends with the office.
  - key: q320
    type: short
    concept: immunities-of-state-officials
    difficulty: 3
    prompt: |
      Distinguish immunity ratione materiae from immunity ratione personae. Use the lecture's examples to show how each
      applies to a serving and to a former high-ranking official.
    model: |
      State officials enjoy immunities because they personify the state and need protection to perform their
      functions; in Arrest Warrant the ICJ said a foreign minister's immunities are "not granted for their personal
      benefit, but to ensure the effective performance of their functions". The source is customary international law,
      and because the immunity belongs to the state only the state can waive it.

      Functional immunity (ratione materiae) attaches to the act: it covers only official acts done with official
      authority, 'under the colour of authority', and continues after the official leaves office. A soldier who kills
      an enemy soldier on the battlefield is covered. Personal immunity (ratione personae) attaches to the office: it is
      complete, covering private acts too, but only for very high-ranking officials — heads of state, heads of
      government and foreign ministers (Djibouti v France) — and only while in office.

      So a sitting Greek president who drives drunk in Australia and kills someone is immune there, though Greece's own
      courts could try them. Once they leave office, personal immunity ends and functional immunity does not cover a
      private holiday act, so they could be arrested and prosecuted in Australia.
    rubric:
      - id: r1
        criterion: Explains the rationale and customary source of officials' immunities.
        marks: 2
        top-band: Uses the Arrest Warrant functional rationale and notes the immunity belongs to the state, so only it can waive.
        margin-note: Good grounding in the leading case.
        authorities: []
      - id: r2
        criterion: Defines functional immunity accurately.
        marks: 2
        top-band: Official acts only, 'under the colour of authority', survives office; gives the soldier example.
        margin-note: Precise definition.
        authorities: []
      - id: r3
        criterion: Defines personal immunity accurately.
        marks: 2
        top-band: Complete immunity including private acts, limited to the troika of high officials, only while in office; cites Djibouti v France.
        margin-note: Covers scope, persons and time.
        authorities: []
      - id: r4
        criterion: Applies both immunities to a serving and a former official.
        marks: 2
        top-band: Works through the drink-driving example before and after office and notes the official's own state can try them.
        margin-note: Excellent application — exactly the two-stage analysis required.
        authorities: []

  # ---------- Concept 4: immunity-and-serious-international-crimes ----------
  - key: q401
    type: mcq
    concept: immunity-and-serious-international-crimes
    difficulty: 2
    set: pretest
    stem: What did the ICJ hold in Jurisdictional Immunities of the State (Germany v Italy) (2012)?
    options:
      - text: That Italy's courts could hear the claims because the crimes violated jus cogens norms, which override immunity.
        why: Tempting because the crimes were grave and jus cogens was argued, but the Court held immunity is procedural and unaffected by the substantive norm breached.
      - text: That custom did not deprive Germany of immunity, despite alleged serious violations of human rights law and IHL.
        correct: true
        why: Correct — the ICJ ruled that, as of 2012, customary international law did not deprive a state of immunity because of alleged serious violations of human rights law and IHL.
      - text: That Germany had waived its immunity by paying reparations to Italy after the Second World War.
        why: Tempting because waiver removes immunity, but the case did not turn on waiver; the Court upheld Germany's immunity for sovereign acts.
      - text: That art 12 of the 2004 Convention applied because the acts took place on Italian territory.
        why: Tempting because the acts occurred in the forum state, but the Court held immunity for acta jure imperii by armed forces in armed conflict extends even to acts on the forum state's territory.
  - key: q402
    type: mcq
    concept: immunity-and-serious-international-crimes
    difficulty: 3
    stem: Why, in Germany v Italy, did the seriousness of the alleged crimes not remove Germany's immunity?
    options:
      - text: Because the rules of state immunity are procedural and entirely distinct from the substantive law on whether the conduct was lawful.
        correct: true
        why: "Correct — para 93: immunity rules are procedural in character and entirely distinct from the substantive law that decides lawfulness, so there is no conflict with jus cogens."
      - text: Because the crimes were committed more than 70 years earlier, so any claim was time-barred in customary law.
        why: Tempting because the events were old, but the Court's reasoning rested on the procedural nature of immunity, not on any limitation period.
      - text: Because Italy had not ratified the 2004 Convention, so it could not rely on the art 12 exception.
        why: Tempting because the convention contains art 12, but it is not in force for anyone, and the Court applied custom.
  - key: q403
    type: mcq
    concept: immunity-and-serious-international-crimes
    difficulty: 3
    stem: What does para 77 of Germany v Italy say about acts of armed forces in armed conflict?
    options:
      - text: That they are acta jure gestionis, and so not immune, whenever they cause death or injury to civilians.
        why: Tempting because the harm to civilians is grave, but para 77 treats them as acta jure imperii and immune.
      - text: That state immunity extends to civil proceedings over them, even if the acts took place on the forum state's territory.
        correct: true
        why: "Correct — para 77: state immunity for acta jure imperii extends to civil proceedings for acts by armed forces in armed conflict, even on the forum state's territory."
      - text: That immunity for them applies only to enforcement, so courts may hear the claims but not seize property.
        why: Tempting because Villa Vigoni was the enforcement target, but para 77 upholds immunity from the civil proceedings themselves.
      - text: That they fall within the art 12 exception because they occur on the forum state's territory.
        why: Tempting because art 12 is territorial, but the Court held immunity continues even where the relevant acts take place on the forum state's territory.
  - key: q404
    type: mcq
    concept: immunity-and-serious-international-crimes
    difficulty: 3
    stem: Which pairing correctly describes the proceedings in Germany v Italy and in Arrest Warrant?
    options:
      - text: Both were criminal prosecutions of individual German and Congolese officials in foreign courts.
        why: Tempting because both involve grave crimes, but Germany v Italy was a civil claim against a state, not a prosecution of an individual.
      - text: Germany v Italy — civil proceedings against a state; Arrest Warrant — criminal proceedings against a serving foreign minister.
        correct: true
        why: Correct — the lecturer stresses Germany v Italy was civil and against the state for acta jure imperii, while Arrest Warrant concerned a criminal warrant for an incumbent foreign minister.
      - text: Germany v Italy — criminal proceedings against a state; Arrest Warrant — civil proceedings against a former minister.
        why: Tempting because the labels are easy to swap, but states are not criminally prosecuted here, and Yerodia was the sitting foreign minister in a criminal matter.
  - key: q405
    type: mcq
    concept: immunity-and-serious-international-crimes
    difficulty: 2
    stem: In Arrest Warrant, what did the ICJ decide about Belgium's warrant for the sitting Congolese foreign minister?
    options:
      - text: It was valid, because Belgium had universal jurisdiction over war crimes and incitement.
        why: Tempting because Belgium's law gave it universal jurisdiction, but jurisdiction and immunity are separate; the minister's personal immunity barred the warrant.
      - text: It violated his immunity; state practice does not support an international crimes exception for a serving foreign minister.
        correct: true
        why: Correct — the ICJ held the warrant violated the incumbent minister's immunity, and current state practice does not support an exception for international crimes.
      - text: It was valid only after the DRC failed to prosecute him itself within a reasonable time.
        why: Tempting because domestic prosecution is one avenue the Court mentions, but it did not make Belgium's warrant conditional on DRC inaction.
  - key: q406
    type: mcq
    concept: immunity-and-serious-international-crimes
    difficulty: 3
    stem: The ICJ said immunity "does not mean … impunity". Which of these is NOT one of the avenues it identified for prosecuting a foreign minister?
    options:
      - text: Prosecution in the minister's own country under its domestic law.
        why: Wrong choice — the Court said such persons enjoy no immunity under international law in their own countries.
      - text: Prosecution anywhere after the minister's state waives immunity.
        why: Wrong choice — the Court said they cease to enjoy immunity from foreign jurisdiction if their state waives it.
      - text: Prosecution by any state with universal jurisdiction while the minister is still in office.
        correct: true
        why: "Correct — this is exactly what the Court rejected: while in office, personal immunity bars foreign criminal jurisdiction, even for international crimes."
      - text: Prosecution before an international criminal court that has jurisdiction.
        why: Wrong choice — the Court said incumbent or former ministers may be tried before certain international criminal courts, such as the ICTY, ICTR and ICC.
  - key: q407
    type: mcq
    concept: immunity-and-serious-international-crimes
    difficulty: 2
    stem: Why can the International Criminal Court proceed against a sitting head of state when a foreign national court cannot?
    options:
      - text: Because the ICC applies only the domestic law of the accused person's state, which has no immunity.
        why: Tempting because there is no immunity at home, but the ICC is an international court applying its own statute, not domestic law.
      - text: Because its statute, like those of the ICTY and ICTR, says the office the person occupies does not matter.
        correct: true
        why: Correct — the lecturer says these courts have provisions in their statutes that the person's office does not matter, so a head of state's position is no bar.
      - text: Because heads of state lose personal immunity automatically once an arrest warrant has been issued against them anywhere.
        why: Tempting because warrants for heads of state exist, but personal immunity before foreign national courts survives a warrant, as Arrest Warrant shows.
  - key: q408
    type: mcq
    concept: immunity-and-serious-international-crimes
    difficulty: 3
    stem: Once a foreign minister leaves office, for which acts may another state with jurisdiction try them, according to Arrest Warrant?
    options:
      - text: Only acts committed after leaving office, since everything done during office stays immune.
        why: Tempting because acts in office seem protected, but the Court said private acts during office, and acts before office, may also be tried.
      - text: Acts committed before or after office, and acts during office in a private capacity.
        correct: true
        why: Correct — the Court said other states may try a former minister for acts before or after their period of office and for acts during it in a private capacity.
      - text: Any act at all, because all immunity, functional and personal, ends when the minister leaves office.
        why: Tempting because personal immunity ends, but functional immunity for official acts survives; the Court limited the avenue to private and out-of-office acts.
  - key: q409
    type: mcq
    concept: immunity-and-serious-international-crimes
    difficulty: 2
    stem: What did the House of Lords hold in Pinochet (No 3) (1999)?
    options:
      - text: That serving and former heads of state alike have absolute immunity for acts done while in office.
        why: Tempting because the House accepted absolute immunity for serving heads of state, but it held that a former head of state had no immunity for torture.
      - text: That a former head of state has no immunity for acts that were then international crimes subject to a form of universal jurisdiction, such as torture.
        correct: true
        why: Correct — the House of Lords held there is no immunity for former heads of state for acts that, when done, were international crimes with a form of universal jurisdiction, e.g. torture under the Convention against Torture.
      - text: That Pinochet had to be extradited to Spain immediately, whatever his state of health.
        why: Tempting because extradition was requested, but he was ultimately allowed to leave the UK on medical grounds.
