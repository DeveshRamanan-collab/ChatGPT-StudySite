  - key: f01
    type: mcq
    concept: four-actions-framework
    difficulty: 1
    set: pretest
    stem: >-
      In the four actions framework, which question asks which factors should be offered that the industry has never
      offered?
    options:
      - text: Create
        correct: true
        why: >-
          Right: the create question asks which factors should be created that the industry has never offered — for
          Yellow Tail, easy drinking, ease of selection, and fun and adventure.
      - text: Raise
        why: >-
          Tempting because raising adds value, but raise works on existing factors, lifting them well above the
          industry's standard; it does not add new ones.
      - text: Reduce
        why: >-
          Tempting because reducing reshapes the offer, but reduce lowers existing factors well below the industry
          standard; it does not invent new ones.
      - text: Eliminate
        why: >-
          Tempting because eliminating changes the offer most sharply, but it removes factors the industry takes for
          granted rather than adding new ones.
  - key: f02
    type: mcq
    concept: four-actions-framework
    difficulty: 2
    stem: Which factors did Yellow Tail eliminate?
    options:
      - text: Enological terminology, ageing qualities and above-the-line marketing
        correct: true
        why: "Right: the slide's eliminate box lists enological terminology, ageing qualities and above-the-line marketing."
      - text: Wine complexity, wine range and vineyard prestige
        why: >-
          Tempting because these were cut back too, but they are the reduce box: kept, but well below the industry
          standard, not eliminated.
      - text: Price versus budget wine and retail store involvement
        why: >-
          Tempting because these changed sharply, but they went up: they are the raise box, well above the industry
          standard.
      - text: Easy drinking, ease of selection, and fun and adventure
        why: >-
          Tempting because they are the most distinctive changes, but these are the create box — factors the industry
          had never offered.
  - key: f03
    type: mcq
    concept: four-actions-framework
    difficulty: 2
    variant-of: f02
    stem: Which factors did Yellow Tail reduce well below the industry standard?
    options:
      - text: Enological terminology, ageing qualities and above-the-line marketing
        why: Tempting because these were cut too, but they were cut out entirely — the eliminate box — not merely reduced.
      - text: Wine complexity, wine range and vineyard prestige
        correct: true
        why: >-
          Right: the slide's reduce box lists wine complexity, wine range and vineyard prestige — kept, but well below
          the industry's standards.
      - text: Price versus budget wine and retail store involvement
        why: Tempting because they are on the same grid, but these were raised above the industry standard, not reduced.
  - key: f04
    type: mcq
    concept: four-actions-framework
    difficulty: 2
    variant-of: f02
    stem: Which factors did Yellow Tail raise well above the industry standard?
    options:
      - text: Easy drinking and ease of selection
        why: >-
          Tempting because they were boosted, but they were new to the industry, so they sit in the create box rather
          than the raise box.
      - text: Vineyard prestige and wine complexity
        why: >-
          Tempting because premium wines stress them, but Yellow Tail went the other way and reduced both well below the
          standard.
      - text: Price versus budget wine, and retail store involvement
        correct: true
        why: >-
          Right: the raise box lists price versus budget wine and retail store involvement — Yellow Tail priced above
          budget wines and worked through retailers.
      - text: Above-the-line marketing, ageing qualities and enological terminology
        why: >-
          Tempting because marketing usually rises at launch, but Yellow Tail eliminated all three, relying on retailers
          instead of above-the-line marketing.
  - key: f05
    type: mcq
    concept: four-actions-framework
    difficulty: 2
    variant-of: f02
    stem: Which factors did Yellow Tail create?
    options:
      - text: Easy drinking, ease of selection, and fun and adventure
        correct: true
        why: >-
          Right: the create box lists easy drinking, ease of selection, and fun and adventure — things the wine industry
          had never offered.
      - text: Retail store involvement and a higher price than budget wine
        why: >-
          Tempting because both were new emphases, but they existed already in the industry; Yellow Tail raised them, so
          they are in the raise box.
      - text: Enological terminology and vineyard prestige
        why: >-
          Tempting because they define premium wine, but Yellow Tail eliminated terminology and reduced vineyard
          prestige; it did not create them.
  - key: f06
    type: mcq
    concept: four-actions-framework
    difficulty: 2
    stem: >-
      Kim and Mauborgne say that to fundamentally shift the strategy canvas of an industry, you must reorient your
      strategic focus…
    options:
      - text: From alternatives to competitors, and from non-customers to customers
        why: >-
          Tempting because it uses the same words, but it reverses the advice: the focus moves away from competitors and
          existing customers.
      - text: From competitors to alternatives, and from customers to non-customers
        correct: true
        why: >-
          Right: the slide quotes Kim and Mauborgne — reorient from competitors to alternatives and from customers to
          non-customers.
      - text: From price to quality, and from budget buyers to premium buyers
        why: >-
          Tempting because Yellow Tail sat between budget and premium, but the quote is about competitors and
          non-customers, not price tiers.
      - text: From the market's needs to the firm's own resources
        why: >-
          Tempting because resource-based innovation is another Week 11 idea, but the Kim and Mauborgne quote says
          nothing about resources.
  - key: f07
    type: mcq
    concept: four-actions-framework
    difficulty: 3
    stem: What does the strategy canvas show in the Yellow Tail slides?
    options:
      - text: How each group rates on the factors the industry competes on
        correct: true
        why: >-
          Right: the canvas plots each group's level on factors such as price, terminology, marketing, ageing, vineyard,
          complexity and range.
      - text: A timeline of Yellow Tail's sales after it entered the US market
        why: >-
          Tempting because the canvas has a horizontal axis, but the axis lists competing factors, not years or sales
          figures.
      - text: The stages and gates of Yellow Tail's product development
        why: >-
          Tempting because stages also run left to right, but stages and gates belong to the linear model, not the
          strategy canvas.
      - text: The share of the US market held by each wine brand
        why: >-
          Tempting because the slide concerns the US market, but the canvas compares how high each group sits on each
          factor, not market shares.
  - key: f08
    type: mcq
    concept: four-actions-framework
    difficulty: 3
    stem: Before Yellow Tail entered, how did premium and budget wines compare on the strategy canvas?
    options:
      - text: They sat at the same level and competed only on price
        why: >-
          Tempting because price is the obvious difference, but the canvas shows premium wines higher on every factor,
          not just price.
      - text: Same factors; premium high on every one, budget well below
        correct: true
        why: >-
          Right: both groups competed on the same factors at different levels — premium high across the board, budget
          much lower, lowest on price.
      - text: Budget wines sat higher than premium wines on marketing and range
        why: >-
          Tempting because budget brands can be heavily promoted, but on the slide premium wines sit above budget wines
          on every factor.
      - text: They competed on different factors, so their curves did not overlap
        why: >-
          Tempting because they target different buyers, but they competed on the same factors — which is why Yellow
          Tail could break away by changing the factors.
  - key: f09
    type: mcq
    concept: four-actions-framework
    difficulty: 3
    stem: Which Yellow Tail decision best illustrates the lesson "focus is more important than ticking all the boxes"?
    options:
      - text: Cutting many industry factors to concentrate on a few new ones
        correct: true
        why: >-
          Right: Yellow Tail dropped or cut many industry factors and concentrated on a few new ones — focus rather than
          matching every box.
      - text: Matching premium wines on vineyard prestige and wine complexity
        why: >-
          Tempting because premium factors look valuable, but Yellow Tail reduced both; matching them would be ticking
          boxes, not focusing.
      - text: Offering a wider range of wines than any budget competitor
        why: >-
          Tempting because range attracts buyers, but Yellow Tail reduced its wine range — the opposite of offering
          everything.
  - key: f10
    type: mcq
    concept: four-actions-framework
    difficulty: 3
    stem: >-
      A gym chain drops long-term contracts, cuts equipment variety, raises cleanliness well above the industry
      standard, and adds 24-hour app-based entry, which no rival offers. Which action is "adds 24-hour app-based entry"?
    options:
      - text: Raise
        why: >-
          Tempting because access improves, but raise lifts an existing factor; a factor no rival offers is new to the
          industry, which is create.
      - text: Create
        correct: true
        why: >-
          Right: a factor the industry has never offered is a create action — like Yellow Tail's easy drinking and fun
          and adventure.
      - text: Reduce
        why: >-
          Tempting because app entry reduces staffing, but reduce lowers an existing factor below the standard; this
          adds something new.
      - text: Eliminate
        why: >-
          Tempting because it may eliminate front-desk check-in, but the action described adds a new factor to the
          offer, which is create.
  - key: f11
    type: mcq
    concept: four-actions-framework
    difficulty: 3
    variant-of: f10
    stem: In the same gym scenario, dropping the long-term contracts that the industry takes for granted is which action?
    options:
      - text: Eliminate
        correct: true
        why: >-
          Right: removing a factor the industry takes for granted is eliminate — as Yellow Tail removed enological
          terminology and ageing qualities.
      - text: Reduce
        why: >-
          Tempting because contracts get "less", but they are removed entirely, not kept at a lower level; reduce keeps
          the factor below the standard.
      - text: Create
        why: >-
          Tempting because no-contract membership feels like a new offer, but the action removes an existing industry
          factor, which is eliminate.
      - text: Raise
        why: >-
          Tempting because flexibility goes up, but the framework asks what happens to the factor itself — the contracts
          — and they are eliminated.
  - key: f12
    type: mcq
    concept: four-actions-framework
    difficulty: 4
    stem: What distinguishes 'reduce' from 'eliminate' in the four actions framework?
    options:
      - text: Eliminate is only a short-term trial, while reduce is a permanent change
        why: >-
          Tempting because "reduce" sounds gentler, but the framework is about how far a factor is cut, not how long the
          change lasts.
      - text: Reduce applies to costs only; eliminate applies to products only
        why: >-
          Tempting because reducing often saves money, but Yellow Tail reduced product factors (complexity, range), so
          reduce is not limited to costs.
      - text: Eliminate removes factors the industry takes for granted; reduce keeps a factor but well below the standard
        correct: true
        why: >-
          Right: Yellow Tail eliminated terminology and ageing qualities altogether, but kept complexity, range and
          vineyard prestige at much lower levels.
  - key: f13
    type: mcq
    concept: four-actions-framework
    difficulty: 2
    stem: Which is one of the key lessons the slides draw from Yellow Tail?
    options:
      - text: Challenge existing business models, even the historic norm
        correct: true
        why: >-
          Right: the slide says to challenge existing business models — just because they represent the historic norm
          doesn't mean that they are right.
      - text: Always match the market leader's features before adding anything new
        why: >-
          Tempting because leaders set the standard, but the lesson is the reverse: focus beats ticking all the boxes,
          and the norm can be challenged.
      - text: Premium pricing guarantees success in a saturated market
        why: >-
          Tempting because Yellow Tail raised its price above budget wines, but it stayed well below premium, and the
          slides draw no pricing guarantee.
      - text: Avoid relying on retailers, and market directly to consumers
        why: >-
          Tempting because many brands go direct, but Yellow Tail raised retail store involvement and relied on
          retailers for marketing.
  - key: f14
    type: mcq
    concept: four-actions-framework
    difficulty: 4
    contrasts-with:
      - value-innovation
    stem: How is the four actions framework related to value innovation in the Yellow Tail case?
    options:
      - text: "They are unrelated: the four actions framework is about cutting costs only"
        why: >-
          Tempting because eliminate and reduce cut costs, but raise and create add value; the framework is the tool
          Yellow Tail used to innovate.
      - text: The four actions are the tool; value innovation is the strategic logic behind it
        correct: true
        why: >-
          Right: Yellow Tail applied the four questions to reshape its curve, and the result is the lecture's example of
          value innovation.
      - text: Value innovation is one of the four actions, alongside eliminate, reduce and raise
        why: >-
          Tempting because value innovation creates something, but the four actions are eliminate, reduce, raise and
          create; value innovation is the wider logic.
      - text: The four actions framework replaces value innovation as a newer approach
        why: >-
          Tempting because frameworks often supersede each other, but the slides present them together: the four actions
          serve the value-innovation logic.
  - key: f15
    type: truefalse
    concept: four-actions-framework
    difficulty: 1
    set: quickfire
    statement: Yellow Tail eliminated above-the-line marketing.
    answer: true
    why: >-
      True: above-the-line marketing sits in the eliminate box with enological terminology and ageing qualities; Yellow
      Tail relied on retailers instead.
  - key: f16
    type: truefalse
    concept: four-actions-framework
    difficulty: 1
    set: quickfire
    statement: Yellow Tail raised wine complexity well above the industry standard.
    answer: false
    why: >-
      False: Yellow Tail reduced wine complexity (with wine range and vineyard prestige) well below the industry
      standard.
  - key: f17
    type: truefalse
    concept: four-actions-framework
    difficulty: 1
    set: quickfire
    statement: "\"Fun and adventure\" was a factor Yellow Tail created."
    answer: true
    why: >-
      True: fun and adventure sits in the create box with easy drinking and ease of selection — factors the wine
      industry had never offered.
  - key: f18
    type: truefalse
    concept: four-actions-framework
    difficulty: 1
    statement: One of the four action framework questions asks which factors should be raised well above the industry's standard.
    answer: true
    why: >-
      True: the four questions ask what to eliminate, what to reduce well below the standard, what to raise well above
      it, and what to create.
  - key: f19
    type: truefalse
    concept: four-actions-framework
    difficulty: 2
    statement: One lesson from Yellow Tail is that ticking all the boxes matters more than focus.
    answer: false
    why: >-
      False: the slide says the reverse — focus is more important than ticking all the boxes. Yellow Tail cut many
      factors to concentrate on a few new ones.
  - key: f20
    type: match
    concept: four-actions-framework
    difficulty: 1
    prompt: Match each action to one factor Yellow Tail applied it to.
    pairs:
      - left: Eliminate
        right: Enological terminology
      - left: Reduce
        right: Vineyard prestige
      - left: Raise
        right: Retail store involvement
      - left: Create
        right: Ease of selection
  - key: f21
    type: short
    concept: four-actions-framework
    difficulty: 3
    prompt: >-
      "In a crowded market, the only way to win is to beat your rivals on the factors customers already value." Respond
      to this statement in a short applied essay. Use the four actions framework and the Yellow Tail case, and apply
      them to a new budget airline entering a crowded domestic market.
    model: >-
      The statement describes competing on the existing strategy canvas; the four actions framework, and Yellow Tail,
      argue the opposite. Kim and Mauborgne say that to shift an industry's canvas you reorient from competitors to
      alternatives and from customers to non-customers. Yellow Tail did not try to out-premium premium wines: it
      eliminated enological terminology, ageing qualities and above-the-line marketing; reduced complexity, range and
      vineyard prestige; raised price above budget wine and retail involvement; and created easy drinking, ease of
      selection, and fun and adventure. Applied to the airline: plot the factors airlines compete on, then ask the four
      questions — eliminate factors taken for granted (such as lounges), reduce others well below the standard (such as
      route range), raise some well above it (such as booking simplicity) and create one the industry has never offered
      (such as a single all-in fare). The aim is a value curve unlike both full-service and budget rivals, reaching
      people who rarely fly. The limits: Yellow Tail is one success in the slides, not a guarantee; cutting valued
      factors can lose some existing customers; and the new curve must rest on real consumer needs.
    rubric:
      - id: r1
        criterion: "Concept: the four actions and the strategy canvas"
        marks: 2
        top-band: >-
          Explains the canvas and all four questions accurately, including the shift from competitors to alternatives
          and from customers to non-customers.
        margin-note: Framework stated precisely, with Kim and Mauborgne's point.
        authorities: []
      - id: r2
        criterion: "Example: Yellow Tail"
        marks: 2
        top-band: Uses Yellow Tail's actual eliminate, reduce, raise and create factors from the slides.
        margin-note: Accurate Yellow Tail detail.
        authorities:
          - mgmt2094-example-yellow-tail
      - id: r3
        criterion: "Application: the airline"
        marks: 4
        top-band: >-
          Applies each of the four questions to the airline with plausible factors and describes the resulting curve,
          taking a clear position on the statement.
        margin-note: All four actions applied; position is clear.
        authorities: []
      - id: r4
        criterion: "Evaluation: limits and risks"
        marks: 2
        top-band: >-
          Weighs the limits: one case is not proof, lost customers, and the need to ground the curve in consumer needs
          (the first Yellow Tail lesson).
        margin-note: Weighs risks, not just benefits.
        authorities: []
  - key: vi01
    type: mcq
    concept: value-innovation
    difficulty: 1
    stem: According to the slides, value innovation's main focus is…
    options:
      - text: >-
          Offering products and services that create superior buyer value in existing markets and enable a quantum leap
          to create new markets
        correct: true
        why: >-
          Right: this is the slide's statement of VI's main focus — superior buyer value in existing markets and a
          quantum leap to new markets.
      - text: Building layers of competitive advantage so the firm stays ahead of its rivals
        why: >-
          Tempting because it sounds like strategy, but the slide says VI is different from building layers of
          competitive advantage.
      - text: Segmenting the market and accommodating the needs of each customer segment
        why: >-
          Tempting because it sounds customer-focused, but the slide says VI does not mean segmenting the market and
          accommodating customer needs.
      - text: Developing new technology, whatever it costs, ahead of everyone else
        why: >-
          Tempting because technology drives many innovations, but the slide says new technology is not VI unless it is
          cheap enough for mass buyers.
  - key: vi02
    type: mcq
    concept: value-innovation
    difficulty: 2
    stem: When does new technology become a value innovation, according to the slides?
    options:
      - text: As soon as it is patented and protected
        why: >-
          Tempting because patents protect inventions, but the slide's test is affordability for mass buyers, not legal
          protection.
      - text: When early premium buyers adopt it before anyone else
        why: >-
          Tempting because premium buyers often adopt first, but VI is about the mass of buyers; a premium-only
          technology fails the slide's test.
      - text: Only when it is cheap enough for mass buyers
        correct: true
        why: >-
          Right: the slide says new technology developed does not become a value innovation unless it is cheap enough
          for mass buyers.
  - key: vi03
    type: mcq
    concept: value-innovation
    difficulty: 2
    stem: On competition, the conventional focus is outperforming the competition. What is the value-innovation focus?
    options:
      - text: Seeking radically superior value to capture the entire mass market
        correct: true
        why: >-
          Right: for competition, the value innovation process seeks radically superior value to capture the entire mass
          market.
      - text: Matching competitors feature by feature, then beating them on price
        why: >-
          Tempting because it sounds competitive, but that is still outperforming the competition — the conventional
          focus VI moves away from.
      - text: Retaining and better satisfying the customers the firm already has
        why: >-
          Tempting because loyalty matters, but this is the conventional focus for the customers block, not VI's focus
          on competition.
      - text: Combining company capabilities with those of other firms
        why: >-
          Tempting because it appears in the same table, but combining capabilities is the corporate capabilities block,
          not competition.
  - key: vi04
    type: mcq
    concept: value-innovation
    difficulty: 2
    stem: On customers, what does value innovation do differently from the conventional focus?
    options:
      - text: Retains and better satisfies the existing customers
        why: >-
          Tempting because keeping customers sounds wise, but that is the conventional focus; VI looks past existing
          customers to the mass of buyers.
      - text: Follows non-customers to reach the mass of buyers, accepting some losses
        correct: true
        why: >-
          Right: VI targets the mass of buyers by following non-customers closely and is willing to lose some existing
          customers.
      - text: Segments buyers into ever-smaller niches and serves each niche's particular needs
        why: >-
          Tempting because niches can be profitable, but the slide says VI does not mean segmenting the market and
          accommodating needs.
      - text: Ignores customers entirely and concentrates on competitors
        why: >-
          Tempting because VI de-emphasises existing customers, but it does not ignore buyers — it follows non-customers
          closely.
  - key: vi05
    type: mcq
    concept: value-innovation
    difficulty: 3
    stem: On corporate capabilities, how does value innovation differ from the conventional focus?
    options:
      - text: It is willing to combine a company's capabilities, not just extend them
        correct: true
        why: >-
          Right: the conventional focus leverages and extends current capabilities; the value innovation process is
          willing to combine company capabilities.
      - text: It abandons all of its current capabilities and builds everything from scratch
        why: Tempting because VI is a leap, but the slide speaks of combining capabilities, not abandoning them.
      - text: It hands all innovation to outside partners so the firm can stay lean
        why: >-
          Tempting because partners help, but the slide says nothing about outsourcing innovation; it is about
          willingness to combine capabilities.
  - key: vi06
    type: mcq
    concept: value-innovation
    difficulty: 2
    stem: Which of these is NOT value innovation according to the slides?
    options:
      - text: Creating superior buyer value
        why: >-
          This is part of the slide's definition — VI focuses on products and services that create superior buyer value
          — so it is not the answer.
      - text: Enabling a quantum leap to create new markets
        why: >-
          This is part of the definition: VI enables a quantum leap for the firm to create new markets, so it is not the
          answer.
      - text: Segmenting the market and accommodating customer needs
        correct: true
        why: >-
          Right: the slide says VI "does not mean segmenting market and accommodating customer needs" — so this is the
          one that is not value innovation.
      - text: Targeting the mass of buyers by following non-customers
        why: >-
          This is VI's customers building block, so it is not the answer: VI follows non-customers to reach the mass of
          buyers.
  - key: vi07
    type: mcq
    concept: value-innovation
    difficulty: 3
    stem: Why is Yellow Tail an example of value innovation even though it still sold wine?
    options:
      - text: It invented a new type of grape and a new way of making wine
        why: >-
          Tempting because innovation suggests new technology, but the lecturer stresses it was the same product — just
          wine — repositioned.
      - text: It rethought what wine is for and reached people who were not wine buyers
        correct: true
        why: >-
          Right: the lecturer says it was still just wine, but rethinking what wine is created value for the customer
          and reached non-customers.
      - text: It became the cheapest wine in the US by undercutting every budget brand on price
        why: >-
          Tempting because it was a budget wine, but Yellow Tail raised its price above budget wine rather than
          undercutting.
      - text: It copied premium wines' marketing and terminology at budget prices
        why: >-
          Tempting because it combines premium cues with a low price, but Yellow Tail eliminated terminology and
          above-the-line marketing.
  - key: vi08
    type: mcq
    concept: value-innovation
    difficulty: 3
    stem: >-
      A company develops an advanced home robot priced well beyond most households. Under the slides' definition, is it
      a value innovation yet?
    options:
      - text: "Not yet: it must be cheap enough for mass buyers first"
        correct: true
        why: >-
          Right: VI differs from technology innovation; the robot becomes a value innovation only once mass buyers can
          afford it.
      - text: "Yes: any genuinely new technology counts as value innovation"
        why: >-
          Tempting because the robot is impressive, but the slide says technology alone is not VI unless cheap enough
          for mass buyers.
      - text: "Yes: wealthy early buyers value it highly, which is superior buyer value"
        why: Tempting because those buyers do value it, but VI targets the mass of buyers, not a premium few.
      - text: "No, and never: value innovation cannot involve new technology"
        why: >-
          Tempting because the slide separates VI from technology innovation, but technology can become VI once it is
          cheap enough for mass buyers.
  - key: vi09
    type: mcq
    concept: value-innovation
    difficulty: 3
    variant-of: vi04
    stem: >-
      A retailer simplifies its range and loses some loyal customers, but attracts a far larger group who never shopped
      there before. In value-innovation terms, this…
    options:
      - text: Breaks value innovation, which requires keeping every existing customer
        why: >-
          Tempting because losing customers looks like failure, but VI expressly accepts willingly losing some existing
          customers.
      - text: "Fits VI: following non-customers and willingly losing some existing ones"
        correct: true
        why: >-
          Right: VI targets the mass of buyers by following non-customers closely and willingly losing some existing
          customers.
      - text: "Is the conventional focus: retaining and better satisfying existing customers"
        why: >-
          Tempting because the retailer is still serving customers, but losing some to win non-customers is the opposite
          of the conventional focus.
      - text: Is irrelevant to value innovation, which concerns only technology
        why: >-
          Tempting because VI is contrasted with technology, but it is a strategy across competition, customers and
          capabilities, not a technology test alone.
  - key: vi10
    type: mcq
    concept: value-innovation
    difficulty: 2
    stem: >-
      When we innovate, the slides say we need to consider all the elements of the business model. Which list matches
      the slide?
    options:
      - text: Eliminate, reduce, raise and create
        why: >-
          Tempting because these are this week's other list, but they are the four actions framework, not the business
