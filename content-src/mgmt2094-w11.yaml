cards:
  - type: basic
    concept: types-of-innovation
    front: What are the seven types of innovation on the Week 11 slides?
    back: Product, process, organisational, management, production, commercial/marketing and service.
    source: "Week 11 Lecture: Innovation Models, slide 2"
  - type: cloze
    concept: types-of-innovation
    text: >-
      Industrial innovation includes not only major ({{c1::radical}}) innovation but also minor ({{c2::incremental}})
      technological advances.
    source: "Week 11 Lecture: Innovation Models, slide 2"
  - type: apply
    concept: types-of-innovation
    scenario: A logistics firm adopts just-in-time delivery and runs quality circles on its warehouse floor.
    answer: "Production innovation: the slides list quality circles and JIT under production (management innovation is TQM)."
    source: "Week 11 Lecture: Innovation Models, slide 2"
  - type: basic
    concept: types-of-innovation
    front: Online recruiting is the slides' example of which type of innovation?
    back: Process innovation — it improves an internal HR process, so it is less visible to customers.
    source: "Week 11 Lecture: Innovation Models, slide 2"
  - type: basic
    concept: views-of-innovation
    front: What does the social deterministic school argue?
    back: >-
      Innovations result from a combination of external social factors and influences (eg demographic and cultural
      change): when conditions are right, innovation will occur — eg Covid and the increase of online offerings.
    source: "Week 11 Lecture: Innovation Models, slide 3"
  - type: cloze
    concept: views-of-innovation
    text: >-
      {{c1::Resource-based}} innovation: a firm's own resources provide the context for innovative activity, eg
      {{c2::Starbucks}} and its coffee-based drinks.
    source: "Week 11 Lecture: Innovation Models, slide 3"
  - type: cloze
    concept: views-of-innovation
    text: >-
      {{c1::Market-based}} innovation: market conditions facilitate or constrain innovative activity, so the firm must
      {{c2::recognise the opportunities}} that arise in the marketplace (eg Share a Coke).
    source: "Week 11 Lecture: Innovation Models, slide 3"
  - type: apply
    concept: views-of-innovation
    scenario: A designer says her studio succeeds purely because of talent she was born with.
    answer: >-
      The individualistic school: innovations come from unique individual talents, so innovators are born. The slides
      link this view to serendipity.
    source: "Week 11 Lecture: Innovation Models, slide 3"
  - type: cloze
    concept: models-of-innovation
    text: "\"Chance favours the {{c1::prepared mind}}\" — {{c2::Louis Pasteur}}, quoted on the slides for serendipity."
    source: "Week 11 Lecture: Innovation Models, slide 4"
  - type: basic
    concept: models-of-innovation
    front: What chain does the linear model of innovation describe?
    back: Science and technology → technological developments → the needs of the market → innovation.
    source: "Week 11 Lecture: Innovation Models, slide 4"
  - type: basic
    concept: models-of-innovation
    front: What are the four gate outputs in the lecture's linear model (Fig 6.3)?
    back: >-
      Gate 1 project charter; Gate 2 business plan; Gate 3 launch and proposal; Gate 4 sanity check — then launch and
      commercialisation.
    source: "Week 11 Lecture: Innovation Models, slide 5"
  - type: cloze
    concept: models-of-innovation
    text: >-
      In the {{c1::simultaneous coupling}} model, all the knowledge in the key components is coupled, so {{c2::the point
      where innovation begins is not known}}.
    source: "Week 11 Lecture: Innovation Models, slide 4"
  - type: apply
    concept: models-of-innovation
    scenario: A food scientist's experiment fails, but she recognises the unusual texture it produced as a possible new snack.
    answer: >-
      Serendipity: an unexpected discovery whose significance she could see only because of her previous knowledge in
      the area.
    source: "Week 11 Lecture: Innovation Models, slide 4"
  - type: basic
    concept: open-and-closed-innovation-models
    front: In what order do the steps run in the closed model for innovation?
    back: "Consecutively: project start → concept development → concept frozen → implementation → market introduction."
    source: "Week 11 Lecture: Innovation Models, slide 6"
  - type: cloze
    concept: open-and-closed-innovation-models
    text: >-
      In the {{c1::open}} model, implementation starts {{c2::before the concept is frozen}}, overlapping concept
      development.
    source: "Week 11 Lecture: Innovation Models, slide 6"
  - type: apply
    concept: open-and-closed-innovation-models
    scenario: >-
      A software team ships an early version while still designing features, then changes the design in response to user
      feedback.
    answer: >-
      The open model: implementation overlaps concept development, and the market's response (a "trial by fire")
      reshapes the concept.
    source: "Week 11 Lecture: Innovation Models, slide 6"
  - type: basic
    concept: architectural-and-modular-innovation
    front: "Architectural vs modular innovation: what changes in each?"
    back: >-
      Architectural: product structure (mobile phone → smartphone). Modular: component technology (a car's steam engine
      → fuel engine).
    source: "Week 11 Lecture: Innovation Models, slide 7"
  - type: cloze
    concept: architectural-and-modular-innovation
    text: >-
      Modular innovation is a change in {{c1::component technology}}, eg a car's {{c2::steam engine}} replaced by a fuel
      engine.
    source: "Week 11 Lecture: Innovation Models, slide 7"
  - type: apply
    concept: architectural-and-modular-innovation
    scenario: A bicycle maker replaces cable brakes with hydraulic brakes; the bike is otherwise unchanged.
    answer: "Modular innovation: one component technology changes within the same product structure."
    source: "Week 11 Lecture: Innovation Models, slide 7"
  - type: basic
    concept: four-actions-framework
    front: What are the four action framework questions?
    back: >-
      Which factors the industry takes for granted should be eliminated? Which should be reduced well below the industry
      standard? Which should be raised well above it? Which should be created that the industry has never offered?
    source: "Week 11 Lecture: Innovation Models, slide 11"
  - type: cloze
    concept: four-actions-framework
    text: >-
      Yellow Tail eliminated {{c1::enological terminology}}, {{c2::ageing qualities}} and {{c3::above-the-line
      marketing}}.
    source: "Week 11 Lecture: Innovation Models, slide 12"
  - type: cloze
    concept: four-actions-framework
    text: Yellow Tail created {{c1::easy drinking}}, {{c2::ease of selection}} and {{c3::fun and adventure}}.
    source: "Week 11 Lecture: Innovation Models, slide 12"
  - type: basic
    concept: four-actions-framework
    front: "Kim and Mauborgne: how do you fundamentally shift the strategy canvas of an industry?"
    back: Reorient your strategic focus from competitors to alternatives, and from customers to non-customers.
    source: "Week 11 Lecture: Innovation Models, slide 10"
  - type: basic
    concept: four-actions-framework
    front: What four lessons do the slides draw from Yellow Tail?
    back: >-
      Understanding consumers' needs is key to innovation; challenge existing business models; focus is more important
      than ticking all the boxes; look across industries and across time.
    source: "Week 11 Lecture: Innovation Models, slide 14"
  - type: basic
    concept: value-innovation
    front: What is value innovation's main focus?
    back: >-
      Offering products and services that create superior buyer value in existing markets and enable a quantum leap for
      the firm to create new markets.
    source: "Week 11 Lecture: Innovation Models, slide 16"
  - type: cloze
    concept: value-innovation
    text: New technology does not become a value innovation unless it is {{c1::cheap enough for mass buyers}}.
    source: "Week 11 Lecture: Innovation Models, slide 16"
  - type: basic
    concept: value-innovation
    front: How does value innovation change the three building blocks of strategy?
    back: >-
      Competition: radically superior value to capture the mass market (not outperforming rivals). Customers: target the
      mass of buyers by following non-customers, willingly losing some existing customers. Capabilities: willing to
      combine company capabilities (not just leverage and extend them).
    source: "Week 11 Lecture: Innovation Models, slide 17"
  - type: apply
    concept: value-innovation
    scenario: A firm adds a fourth layer of competitive advantage to stay ahead of its main rival.
    answer: >-
      Not value innovation on the slides' definition: VI is different from building layers of competitive advantage; it
      seeks radically superior value for the mass market.
    source: "Week 11 Lecture: Innovation Models, slide 16"
  - type: basic
    concept: bcg-six-innovation-models
    front: What are BCG's six innovation models and their mottos?
    back: >-
      Creator ("We know best"), solution builder ("We're listening"), leverager ("We do it best"), expander ("Seeking
      share to steal"), defender ("Protecting our turf"), fast follower ("Ready to react").
    source: "Reading: Manly, Grassl and Wilson (BCG, 2017), p 2"
  - type: cloze
    concept: bcg-six-innovation-models
    text: >-
      BCG: innovators fall short by pursuing the {{c1::wrong innovation model}} for their context, or by not supporting
      a good model with the {{c2::capabilities}} it requires.
    source: "Reading: Manly, Grassl and Wilson (BCG, 2017), p 1"
  - type: apply
    concept: bcg-six-innovation-models
    scenario: A department-store chain relies on its famous brand and store network while online rivals take its share.
    answer: >-
      BCG's Sears warning: a defender model in an industry that no longer rewards it. Choose a model that fits the
      changed context and back it with capabilities.
    source: "Reading: Manly, Grassl and Wilson (BCG, 2017), p 3"
  - type: basic
    concept: bcg-six-innovation-models
    front: What goes into BCG's innovation blueprint?
    back: >-
      Organisational structure and culture; tools and processes for idea generation, commercialisation and portfolio
      management; metrics and incentives — all aligned with the model.
    source: "Reading: Manly, Grassl and Wilson (BCG, 2017), p 4"
  - type: apply
    concept: bcg-six-innovation-models
    scenario: A founder with one profitable factory and showroom is tempted to open shops in three new cities.
    answer: >-
      Mark's advice: stick to your knitting — make the core business really successful before branching out. In BCG
      terms, choose an approach that fits your strengths and capabilities.
    source: "Week 11 guest lecture (Mark); Reading: Manly, Grassl and Wilson (BCG, 2017), p 4"
audio:
  title: Week 11 recap — innovation models
  minutes: 3
  script: >-
    This week is about innovation models: the different ways of seeing innovation. Start with types. Innovation isn't
    only radical breakthroughs; minor, incremental advances count too, and they're far more common, like the Braille
    Rubik's cube. The slides list seven types: product; process, like online recruiting; organisational, like a new
    venture division; management, which is TQM; production, which is quality circles and just in time; commercial or
    marketing, like guerrilla campaigns; and service, like internet-based financial services.


    Next, views of where innovation comes from. The social deterministic school says external social factors drive it:
    when conditions are right, it happens, the way Covid pushed offerings online. The individualistic school says
    innovators are born, and it links to serendipity. Resource-based innovation grows from the firm's own resources,
    like Starbucks and its coffee drinks; market-based innovation comes from market conditions the firm has to
    recognise, like Share a Coke.


    Then the models. Serendipity is unexpected discovery, but chance favours the prepared mind. The linear model runs
    from science and technology to the needs of the market, through four gates: project charter, business plan, launch
    and proposal, sanity check, then commercialisation. Simultaneous coupling joins everything at once, so we can't say
    where innovation began. In the closed model, implementation waits until the concept is frozen; in the open model it
    starts midway, so the market's response reshapes the concept. And architectural innovation changes a product's
    structure, phone to smartphone, while modular innovation changes one component, like a car's steam engine becoming a
    fuel engine.


    Yellow Tail shows the four actions at work in a crowded US wine market. Eliminate terminology, ageing and
    above-the-line marketing. Reduce complexity, range and vineyard prestige. Raise price above budget wine, and retail
    involvement. Create easy drinking, ease of selection, and fun and adventure. That's value innovation: superior buyer
    value for the mass market, found by following non-customers rather than beating rivals, and technology only counts
    when mass buyers can afford it.


    Finally, BCG's six models: creator, solution builder, leverager, expander, defender and fast follower. Choosing is
    about context. Sears defended in an industry that online players upended, while Amazon and Costco both win in retail
    with different models. Our guest founder, Mark, put it simply: keep your eyes open for waves, stay flexible, and
    stick to your knitting.
