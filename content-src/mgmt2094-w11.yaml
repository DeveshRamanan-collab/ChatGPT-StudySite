    stem: Starbucks appears in both the Week 11 slides and the BCG reading. Which statement is accurate?
    options:
      - text: "The slides: resource-based innovation; BCG: a solution builder"
        correct: true
        why: >-
          Right: the slides use Starbucks for resource-based innovation, while BCG lists it among solution builders —
          the same company read through two frameworks.
      - text: Both sources use it as an example of a creator that disrupts its markets
        why: >-
          Tempting because Starbucks is famous for its innovations, but BCG's creators are Apple, Tesla, Netflix and
          Lululemon; Starbucks is a solution builder.
      - text: The slides call it market-based innovation and BCG calls it a fast follower
        why: >-
          Tempting because both labels sound plausible, but the slides use Share a Coke for market-based innovation, and
          BCG's fast followers include Reckitt Benckiser.
      - text: Both sources use it to illustrate the individualistic school of innovation
        why: >-
          Tempting because founders are often celebrated, but neither source uses Starbucks for the individualistic
          school; the slides tie it to the firm's resources.
  - key: v14
    type: mcq
    concept: views-of-innovation
    difficulty: 3
    stem: Which pair of views asks whether innovation's context comes from inside the firm or from the market around it?
    options:
      - text: Resource-based and market-based innovation
        correct: true
        why: >-
          Right: resource-based innovation finds the context in the firm's own resources; market-based innovation finds
          it in market conditions the firm must recognise.
      - text: The social deterministic and individualistic schools
        why: >-
          Tempting because these two are also a contrasting pair, but they ask whether society or the born individual
          drives innovation, not inside versus market.
      - text: The individualistic school and resource-based innovation
        why: >-
          Tempting because both can sit inside a firm, but they are not set against each other; the inside-versus-market
          contrast is resource-based versus market-based.
      - text: The popular view and the social deterministic school
        why: >-
          Tempting because both concern society, but the popular view is about films shaping our image of innovation,
          not about a firm's context.
  - key: v15
    type: truefalse
    concept: views-of-innovation
    difficulty: 1
