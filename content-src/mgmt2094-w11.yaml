  - key: a21
    type: match
    concept: architectural-and-modular-innovation
    difficulty: 1
    prompt: Match each term or example to the right description.
    pairs:
      - left: Architectural innovation
        right: Change in product structure
      - left: Modular innovation
        right: Change in component technology
