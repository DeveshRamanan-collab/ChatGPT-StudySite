        why: >-
          Tempting because they are another set of labels this week, but they are the four actions framework from the
          Yellow Tail case.
      - text: Gate 1, Gate 2 and Gate 3
        why: >-
          Tempting because gates mark stages, but gates belong to the linear model; the open and closed diagrams use
          start, frozen and introduction.
  - key: o11
    type: mcq
    concept: open-and-closed-innovation-models
    difficulty: 3
    contrasts-with:
      - models-of-innovation
    stem: Which statement correctly distinguishes the linear model from the closed model?
    options:
      - text: >-
          The linear model chains science, technology and market needs through stage gates; the closed model is about
          implementation waiting for the frozen concept
        correct: true
        why: >-
          Right: the linear model is about the chain from science to market; the closed model is about the timing of
          implementation relative to concept development.
      - text: "They are the same model: both run steps one after another"
        why: >-
          Tempting because both are sequential, but they answer different questions — where innovation comes from versus
          when implementation starts.
      - text: The closed model is about chance discoveries recognised by experts
        why: >-
          Tempting because "closed" can sound like a secret lab, but chance discoveries are serendipity; the closed
          model is a timing diagram.
      - text: The linear model overlaps development and implementation
        why: >-
          Tempting because the linear model has many stages, but overlapping development and implementation is the open
          model's defining feature.
  - key: o12
    type: mcq
    concept: open-and-closed-innovation-models
    difficulty: 3
    stem: >-
      Mark says that if a material for a planned piece proves too expensive he looks for an alternative, and that
      priorities change from day to day. Which model does this habit resemble most?
    options:
      - text: The closed model, because Mark designs each piece himself
        why: >-
          Tempting because Mark controls his designs, but the closed model fixes the concept before implementation; Mark
          keeps changing it as he goes.
      - text: The open model
        correct: true
        why: >-
          Right: changing the material once making has begun is like implementing before the concept is frozen and
          letting conditions reshape it.
      - text: The linear model, because furniture is made step by step
        why: >-
          Tempting because making furniture has steps, but the linear model is science to market through gates; Mark's
          habit is about adjusting as he implements.
      - text: Serendipity, because the cheaper material was found by chance
        why: >-
          Tempting because alternatives can turn up by luck, but Mark actively looks for them; the point is flexibility
          while making, as in the open model.
  - key: o13
    type: mcq
    concept: open-and-closed-innovation-models
    difficulty: 2
    stem: In the closed model, what comes immediately before market introduction?
    options:
      - text: Implementation
        correct: true
        why: >-
          Right: in the closed model the concept is frozen, implementation follows, and implementation runs up to market
          introduction.
      - text: Concept development, which is still under way
        why: >-
          Tempting because development is part of the model, but in the closed model it ends when the concept is frozen,
          well before market introduction.
      - text: The project start, which triggers the introduction
        why: >-
          Tempting because both are markers, but the project start is the beginning of the diagram, before concept
          development.
  - key: o14
    type: mcq
    concept: open-and-closed-innovation-models
    difficulty: 4
    variant-of: o03
    stem: >-
      A firm using the open model gets strong negative user feedback halfway through implementation. What does the model
      allow it to do?
    options:
      - text: Nothing — the concept was frozen at the project start
        why: >-
          Tempting because concepts are eventually frozen, but in the open model implementation starts before the
          freeze, so the concept can still change.
      - text: Keep developing the concept while implementation continues
        correct: true
        why: >-
          Right: the open model lets the firm continue to develop the concept and tweak the product or service as
          implementation goes on.
      - text: It must abandon implementation and restart from idea generation
        why: >-
          Tempting because negative feedback feels fatal, but restarting from idea generation is not what the open model
          describes; it adjusts as it goes.
      - text: It must ignore the feedback until after market introduction
        why: >-
          Tempting because some firms finish first and fix later, but using feedback during implementation is the whole
          point of the open model.
  - key: o15
    type: mcq
    concept: open-and-closed-innovation-models
    difficulty: 1
    stem: Which model runs its steps consecutively — develop, freeze, implement, introduce?
    options:
      - text: The open model
        why: >-
          Tempting because it has the same steps, but in the open model implementation overlaps concept development
          rather than following it.
      - text: Simultaneous coupling
        why: >-
          Tempting because it is another named model, but simultaneous coupling is about knowledge combining with no
          known start, not consecutive steps.
      - text: The closed model
        correct: true
        why: >-
          Right: the lecturer says that in the closed model the steps go consecutively — concept, frozen,
          implementation, market introduction.
  - key: o16
    type: truefalse
    concept: open-and-closed-innovation-models
    difficulty: 1
    set: quickfire
    statement: In the closed model, implementation starts before the concept is frozen.
    answer: false
    why: >-
      False: in the closed model implementation starts only after the concept is frozen; starting before the freeze is
      the open model.
  - key: o17
    type: truefalse
    concept: open-and-closed-innovation-models
    difficulty: 1
    set: quickfire
    statement: In the open model, implementation overlaps with concept development.
    answer: true
    why: >-
      True: implementation starts somewhere in the middle of concept development, so the two run side by side until the
      concept is frozen.
  - key: o18
    type: truefalse
    concept: open-and-closed-innovation-models
    difficulty: 2
    statement: Both the open and the closed model end with market introduction.
    answer: true
    why: >-
      True: both diagrams run from project start to market introduction; what differs is when implementation starts
      relative to the frozen concept.
  - key: o19
    type: truefalse
    concept: open-and-closed-innovation-models
    difficulty: 2
    statement: As the lecture uses it, the open model is defined by sharing the firm's ideas with outside partners.
    answer: false
    why: >-
      False: the lecture's open model is a timing diagram — implementation starting before the concept is frozen — not a
      model about outside partners.
  - key: o20
    type: truefalse
    concept: open-and-closed-innovation-models
    difficulty: 1
    statement: The lecturer describes early implementation in the open model as a "trial by fire".
    answer: true
    why: >-
      True: implementing during development is a trial by fire — you see the market's and users' response and continue
      developing the concept.
  - key: o21
    type: match
    concept: open-and-closed-innovation-models
    difficulty: 1
    prompt: Match each part of the open and closed models to its description.
    pairs:
      - left: Closed model
        right: Implementation follows the frozen concept
      - left: Open model
        right: Implementation overlaps concept development
      - left: Concept frozen
        right: The point after which the concept stops changing
      - left: Market introduction
        right: The end point of both models
  - key: a01
    type: mcq
    concept: architectural-and-modular-innovation
    difficulty: 1
    stem: On the slides, architectural innovation is a change in…
    options:
      - text: Product structure
        correct: true
        why: >-
          Right: the slide defines architectural innovation as a change in product structure, with the mobile phone
          becoming the smartphone.
      - text: Component technology
        why: >-
          Tempting because the two terms are paired, but a change in component technology is modular innovation (the
          steam engine becoming a fuel engine).
      - text: The organisation's structure
        why: >-
          Tempting because "structure" appears in both, but the slide means the structure of the product; a new venture
          division is organisational innovation.
      - text: How the product is marketed
        why: >-
          Tempting because new products are marketed differently, but marketing changes are commercial/marketing
          innovation, not architectural innovation.
  - key: a02
    type: mcq
    concept: architectural-and-modular-innovation
    difficulty: 1
    stem: On the slides, modular innovation is a change in…
    options:
      - text: Product structure
        why: >-
          Tempting because the terms are paired, but a change in product structure is architectural innovation (the
          smartphone example).
      - text: Component technology
        correct: true
        why: >-
          Right: the slide defines modular innovation as a change in component technology, as when a car's steam engine
          becomes a fuel engine.
      - text: The firm's business model
        why: >-
          Tempting because business models matter this week, but changing the business model is what BCG's leveragers
          do, not modular innovation.
      - text: The firm's management system
        why: >-
          Tempting because systems have components too, but a new management system such as TQM is management innovation
          on the slides.
  - key: a03
    type: mcq
    concept: architectural-and-modular-innovation
    difficulty: 2
    stem: The mobile phone becoming the smartphone is the slides' example of…
    options:
      - text: Architectural innovation
        correct: true
        why: >-
          Right: the slide shows the mobile phone becoming the smartphone under "Architectural innovation: change in
          product structure".
      - text: Modular innovation
        why: >-
          Tempting because the smartphone has new components, but the slide uses it for a change in the whole product
          structure, which is architectural.
      - text: Process innovation
        why: >-
          Tempting because phones are made differently, but the change is in the product itself; process innovation is
          internal, like online recruiting.
      - text: Service innovation
        why: >-
          Tempting because smartphones deliver services, but the slide classifies the phone-to-smartphone shift as
          architectural innovation in the product.
  - key: a04
    type: mcq
    concept: architectural-and-modular-innovation
    difficulty: 2
    stem: A car's steam engine being replaced by a fuel engine is the slides' example of…
    options:
      - text: Architectural innovation
        why: >-
          Tempting because an engine is a big change, but the car keeps its structure; only a component technology
          changes, which the slide calls modular.
      - text: Organisational innovation
        why: >-
          Tempting because the car maker's work changes too, but the example is about the product's component, not the
          firm's structure or procedures.
      - text: Modular innovation
        correct: true
        why: >-
          Right: the slide shows the steam engine of a car becoming a fuel engine under "Modular innovation: change in
          component technology".
  - key: a05
    type: mcq
    concept: architectural-and-modular-innovation
    difficulty: 3
    stem: >-
      An e-bike maker replaces its lead-acid battery with a lithium battery; the frame, motor and controls are
      unchanged. Using the lecture's categories, this is closest to…
    options:
      - text: Modular innovation
        correct: true
        why: >-
          Right: one component technology (the battery) changes while the product and its structure stay the same, like
          the steam engine becoming a fuel engine.
      - text: Architectural innovation
        why: >-
          Tempting because a better battery changes what the bike can do, but the bike's structure is unchanged; only
          one component is new.
      - text: Process innovation
        why: >-
          Tempting because the factory may fit batteries differently, but the change is inside the product; process
          innovation is about internal processes.
      - text: Commercial/marketing innovation
        why: >-
          Tempting because the firm will advertise the new battery, but the innovation itself is a change in a component
          of the product.
  - key: a06
    type: mcq
    concept: architectural-and-modular-innovation
    difficulty: 3
    stem: >-
      A furniture maker redesigns a desk so that it folds into a wall cabinet: the parts are similar, but how they fit
      together and what the product does change. This is closest to…
    options:
      - text: Modular innovation
        why: >-
          Tempting because the parts are similar, but modular innovation swaps one component's technology; here the way
          the parts fit together changes.
      - text: Architectural innovation
        correct: true
        why: >-
          Right: the product's structure — how the parts fit together — changes, and it gains new capabilities, like the
          mobile phone becoming the smartphone.
      - text: Organisational innovation
        why: >-
          Tempting because the maker reorganises its design, but organisational innovation is about the firm's
          structure; this changes the product's structure.
      - text: Production innovation
        why: >-
          Tempting because the desk is produced differently, but production innovation on the slides means systems like
          JIT and quality circles.
  - key: a07
    type: mcq
    concept: architectural-and-modular-innovation
    difficulty: 2
    stem: Why does the lecturer say the smartphone "grows out of" the legacy product?
    options:
      - text: It is still a phone, but restructured with many more capabilities
        correct: true
        why: >-
          Right: the lecturer says the smartphone departs quite a bit, yet is in a sense the same product, a phone, with
          a lot more capabilities.
      - text: Because it reuses exactly the same components as the old mobile phone
        why: >-
          Tempting because it is still a phone, but the point is a changed structure with new capabilities, not
          identical parts.
      - text: Because only one component technology changed inside it
        why: >-
          Tempting because new parts were added, but a single component change is modular; the smartphone changes the
          whole structure.
      - text: Because it was discovered by chance by a phone engineer
        why: >-
          Tempting because many inventions have lucky origins, but the lecture says nothing about chance here; that
          would be serendipity.
  - key: a08
    type: mcq
    concept: architectural-and-modular-innovation
    difficulty: 3
    contrasts-with:
      - types-of-innovation
    stem: >-
      A student writes: "Architectural and modular innovation are two of the seven types of innovation." What is the
      best correction?
    options:
      - text: "No correction is needed: they are the product and process types under other names"
        why: >-
          Tempting because both concern products, but the seven types are product, process, organisational, management,
          production, marketing and service.
      - text: They are a separate cut — the level of change inside the product — not types
        correct: true
        why: >-
          Right: the lecture says "we can divide innovation into architectural and modular" — a different cut from the
          seven types, about what changes inside the product.
      - text: They are both forms of service innovation, because they change what customers get
        why: >-
          Tempting because customers notice both, but the slide examples (smartphone, car engine) are products, and
          neither is classed as service innovation.
      - text: They are views of innovation, like the resource-based and market-based views
        why: >-
          Tempting because views are another list this week, but the views explain where innovation comes from;
          architectural and modular describe the change itself.
  - key: a09
    type: mcq
    concept: architectural-and-modular-innovation
    difficulty: 4
    stem: Which question best decides whether an innovation is architectural or modular?
    options:
      - text: Is the innovation radical or incremental?
        why: >-
          Tempting because both are contrasts within innovation, but radical and incremental measure the size of the
          advance, not whether structure or a component changed.
      - text: >-
          Has the product's structure changed, or has one component's technology been replaced within the same
          structure?
        correct: true
        why: >-
          Right: architectural innovation is a change in product structure; modular innovation is a change in component
          technology within the same product.
      - text: Was the innovation planned through stage gates or found by chance?
        why: >-
          Tempting because both are model questions this week, but planning versus chance distinguishes the linear model
          from serendipity.
      - text: Does the innovation target non-customers rather than existing customers?
        why: >-
          Tempting because value innovation asks this, but whom you target says nothing about whether structure or a
          component changed.
  - key: a10
    type: mcq
    concept: architectural-and-modular-innovation
    difficulty: 2
    stem: In modular innovation, what stays the same?
    options:
      - text: The product and its overall structure
        correct: true
        why: >-
          Right: in the slide's car example the car stays a car with the same structure; only the engine technology
          changes.
      - text: The component technology
        why: >-
          Tempting because "modular" sounds stable, but the component technology is precisely what changes in modular
          innovation.
      - text: Nothing — the whole product is reinvented
        why: >-
          Tempting because innovation can be sweeping, but reinventing the whole product would be closer to
          architectural or radical change.
  - key: a11
    type: mcq
    concept: architectural-and-modular-innovation
    difficulty: 3
    variant-of: a05
    stem: >-
      A kettle maker replaces the heating coil with a more efficient element; the kettle is otherwise the same. Which
      category fits best?
    options:
      - text: Architectural innovation
        why: >-
          Tempting because efficiency is a real improvement, but the kettle's structure is unchanged; only one component
          technology is replaced.
      - text: Simultaneous coupling
        why: >-
          Tempting because technology and market needs both matter, but coupling describes where innovation begins, not
          the level of change in a product.
      - text: Modular innovation
        correct: true
        why: >-
          Right: a single component technology changes while the product and its structure stay the same — the
          steam-to-fuel-engine pattern.
      - text: Process innovation
        why: >-
          Tempting because efficiency sounds like a process gain, but the change is inside the product, not in how the
          firm does its work.
  - key: a12
    type: mcq
    concept: architectural-and-modular-innovation
    difficulty: 3
    variant-of: a06
    stem: >-
      A company turns a simple music player into a device that also makes calls, browses the web and runs apps. Which
      category fits best?
    options:
      - text: Architectural innovation
        correct: true
        why: >-
          Right: the product's structure changes and it gains many new capabilities while growing out of the legacy
          product — like the phone becoming a smartphone.
      - text: Modular innovation
        why: >-
          Tempting because new parts are added, but the change is to how the whole product is structured and what it
          does, not one component swap.
      - text: Management innovation
        why: >-
          Tempting because big product changes need management, but management innovation on the slides is TQM, not a
          new device.
      - text: Commercial/marketing innovation
        why: >-
          Tempting because the device will be marketed as new, but the innovation lies in the product's structure, not
          in its promotion.
  - key: a13
    type: mcq
    concept: architectural-and-modular-innovation
    difficulty: 4
    stem: Which statement about the slides' two examples is accurate?
    options:
      - text: Both are process innovations, because each changes how a product is made
        why: >-
          Tempting because making changes too, but both examples are changes in products, which is why the slide uses
          them for architectural and modular innovation.
      - text: The smartphone is modular and the fuel engine is architectural
        why: >-
          Tempting because both involve new technology, but this reverses them: the smartphone changes structure
          (architectural); the engine is a component (modular).
      - text: "Both change a product: the phone's whole structure, but only the car's engine"
        correct: true
        why: >-
          Right: architectural innovation changes the product structure (smartphone); modular innovation changes a
          component technology (the car engine).
  - key: a14
    type: mcq
    concept: architectural-and-modular-innovation
    difficulty: 2
    stem: Which pairing is correct?
    options:
      - text: "Architectural: change in product structure; modular: change in component technology"
        correct: true
        why: "Right: this is exactly how the slide defines the pair, with the smartphone and the car engine as examples."
      - text: "Architectural: change in component technology; modular: change in product structure"
        why: >-
          Tempting because the two are easily swapped, but this reverses them; the smartphone (structure) is
          architectural and the engine (component) is modular.
      - text: "Architectural: a new building design; modular: new furniture modules"
        why: >-
          Tempting because of the everyday meanings of the words, but in the lecture both terms describe change inside a
          product, not buildings or furniture.
      - text: "Architectural: always radical; modular: always incremental"
        why: >-
          Tempting because structural change feels bigger, but the slide defines them by what changes, not by size; it
          does not equate them with radical and incremental.
  - key: a15
    type: mcq
    concept: architectural-and-modular-innovation
    difficulty: 3
    stem: Can an architectural innovation also be described with one of the seven types of innovation?
    options:
      - text: "No: the two classifications are mutually exclusive"
        why: >-
          Tempting because they are taught separately, but they answer different questions, so one innovation can be
          classified both ways.
      - text: "Yes: a smartphone is also a product innovation"
        correct: true
        why: >-
          Right: the seven types say where the innovation happens; architectural and modular say what changed inside the
          product, so both can apply.
      - text: Only if it is a service innovation delivered over the internet
        why: >-
          Tempting because smartphones deliver services, but nothing limits the overlap to service innovation; the slide
          examples are products.
  - key: a16
    type: truefalse
    concept: architectural-and-modular-innovation
    difficulty: 1
    set: quickfire
