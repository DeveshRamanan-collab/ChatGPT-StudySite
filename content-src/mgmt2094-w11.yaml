  - key: m21
    type: short
    concept: models-of-innovation
    difficulty: 3
    prompt: >-
      "Innovation is a planned process: good firms move ideas through stage gates from science to market." Respond to
      this statement in a short applied essay, using the three Week 11 models of innovation and the case of a university
      spin-off whose breakthrough came when a researcher noticed an unexpected result, and which then took the product
      to market through a gated process.
    model: >-
      The statement describes the linear model, which fits only half of the spin-off's story. The breakthrough itself
      was serendipity: an unexpected result recognised only because the researcher had previous knowledge in the area —
      "chance favours the prepared mind" (Pasteur), as in the lecturer's penicillin example. Taking it to market was
      linear: idea generation and a project charter (Gate 1); concept feasibility and a business plan after financial
      and technical feasibility (Gate 2); capability development, a prototype and a launch proposal (Gate 3); ramp up
      and test marketing, then a sanity check with feedback and corrective measures (Gate 4); then launch and
      commercialisation. So the linear model describes the second half well but not the first: it assumes innovation
      starts with science and moves in order, whereas this one started with chance. If the team drew on market insight
      and technical knowledge together, simultaneous coupling — where the starting point cannot be identified — may
      describe the process better. Even the lecturer calls the linear figure a depiction, not a rule to follow exactly;
      innovation is often planned, but not only planned.
    rubric:
      - id: r1
        criterion: "Concept: the three models"
        marks: 2
        top-band: >-
          Defines serendipity (with the prepared mind), the linear model (science → technology → market needs, through
          gates) and simultaneous coupling (no known starting point) accurately.
        margin-note: All three models defined in the slides' terms.
        authorities: []
      - id: r2
        criterion: "Example: penicillin and the gated figure"
        marks: 2
        top-band: >-
          Uses the lecturer's penicillin example or Pasteur's quote for serendipity and the lecture's stage-gate figure
          for the linear model.
        margin-note: Examples from the materials, used well.
        authorities:
          - mgmt2094-example-fleming-penicillin
      - id: r3
        criterion: "Application: mapping the spin-off"
        marks: 4
        top-band: >-
          Maps each phase of the spin-off to a model, names the gates and their outputs correctly, and takes a clear
          position on the statement.
        margin-note: Phases mapped to models; gates in the right order.
        authorities: []
      - id: r4
        criterion: "Evaluation: limits of the linear model"
        marks: 2
        top-band: >-
          Explains where the linear model stops fitting (chance starts, coupled knowledge) and notes the lecturer's
          caution that the figure is a depiction.
        margin-note: Judges the statement rather than just describing.
        authorities: []
  - key: o01
    type: mcq
    concept: open-and-closed-innovation-models
    difficulty: 1
    stem: In the lecture's closed model for innovation, when does implementation begin?
    options:
