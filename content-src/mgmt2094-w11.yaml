    verify: false
    body: >-
      Yellow Tail is the lecture's example of innovation: a budget wine taking on the crowded US wine market. Before it

      entered, premium and budget wines competed on the same factors — price, enological terminology, marketing, ageing,

      vineyard prestige, wine complexity and range — at different levels. Plotting those levels gives the industry's

      strategy canvas.


      Kim and Mauborgne: to fundamentally shift the strategy canvas of an industry, reorient your strategic focus from

      competitors to alternatives, and from customers to non-customers. The four actions framework asks:


      1. **Eliminate** — which factors that the industry takes for granted should be eliminated? (enological
      terminology,
         ageing qualities, above-the-line marketing)
      2. **Reduce** — which factors should be reduced well below the industry's standards? (wine complexity, wine range,
         vineyard prestige)
      3. **Raise** — which factors should be raised well above the industry's standard? (price versus budget wine,
      retail
         store involvement)
      4. **Create** — which factors should be created that the industry has never offered? (easy drinking, ease of
         selection, fun and adventure)

      Yellow Tail's resulting curve sits apart from both groups. The lessons: understanding consumers' needs is key to

      innovation; challenge existing business models; focus is more important than ticking all the boxes; and look
      across

      industries and across time.


      Exam use: apply the four questions to the scenario's industry, factor by factor, and describe the new curve.
  - slug: value-innovation
    title: Value innovation
    visual: diagram
    visual-brief: >-
      Three rows for the three building blocks of strategy — competition, customers, corporate capabilities — each
      drawing the conventional focus on the left and an arrow to the value-innovation move on the right; a final band
      adds the test that new technology counts only when mass buyers can afford it.
    related:
      - four-actions-framework
      - types-of-innovation
      - mgmt2094-w10-business-model-canvas
    depends-on: []
    contrasts-with:
      - four-actions-framework
    cases: []
    authorities:
      - mgmt2094-example-yellow-tail
    verify: false
    body: >-
      Value innovation (VI) is one of the most prominent programmatic approaches to innovation currently in use. It is

      different from building layers of competitive advantage, and it does not mean segmenting the market and
      accommodating

      customer needs. Its main focus is offering products and services that create superior buyer value in existing
      markets

      and enable a quantum leap for the firm to create new markets. It also differs from technology innovation: new

      technology does not become a value innovation unless it is cheap enough for mass buyers.


      Value innovation changes all three basic building blocks of strategy:


      - **Competition** — not outperforming the competition, but seeking radically superior value to capture the entire
        mass market.
      - **Customers** — not retaining and better satisfying existing customers, but targeting the mass of buyers by
      following
        non-customers closely, willingly losing some existing customers.
      - **Corporate capabilities** — not just leveraging and extending current capabilities, but being willing to
      combine a
        company's capabilities.

      Yellow Tail is the lecture's example: still just wine, in a market full of budget and premium wines, but by
      rethinking

      what wine and wine drinking are it repositioned the product and created value for people who were not wine buyers.

      Before innovating, consider the whole business model too: value proposition, customers, customer relationships,

      channels, revenue, key partners, key activities, key resources and costs.


      Exam use: test each building block — who are the non-customers, and what superior value reaches the mass market?
  - slug: bcg-six-innovation-models
    title: BCG's six innovation models and choosing by context
    visual: palace
    visual-brief: >-
      A corridor of seven frames: six for the models — creator, solution builder, leverager, expander, defender, fast
      follower — each with its motto, defining move and example; the last frame is context, where industry and company
      decide which model fits.
    related:
      - views-of-innovation
      - value-innovation
    depends-on: []
    contrasts-with:
      - views-of-innovation
    cases: []
    authorities:
      - mgmt2094-reading-bcg-2017-innovation-models
      - mgmt2094-example-nike-solution-builder
      - mgmt2094-example-zara-leverager
      - mgmt2094-example-amazon-and-costco
      - mgmt2094-example-allstate-esurance
      - mgmt2094-example-reckitt-benckiser
      - mgmt2094-example-sears-defender
      - mgmt2094-example-starbucks
      - mgmt2094-example-guest-founder-mark
    verify: false
    body: >-
      BCG studied more than 100 of the world's most innovative companies and found six distinct innovation models

      (Manly, Grassl and Wilson 2017):


      - **Creator** ("We know best") — led by a visionary, disrupts markets and makes focused big bets: Apple.

      - **Solution builder** ("We're listening") — wins by understanding and delighting customers: Nike.

      - **Leverager** ("We do it best") — innovates its core business model to drive ongoing advantage: Zara.

      - **Expander** ("Seeking share to steal") — uses a core capability to enter and dominate adjacent markets: Amazon.

      - **Defender** ("Protecting our turf") — focuses on points of advantage in mature or slow-changing sectors:
      Allstate.

      - **Fast follower** ("Ready to react") — optimises its capabilities to react rapidly to competitive innovations:
        Reckitt Benckiser.

      Innovators fall short either by pursuing the wrong model for their business and competitive context, or by not

      supporting a good model with the capabilities it requires. Choosing is all about context. Industry: only a subset
      of

      models succeeds in most industries — Sears relied on the defender model and lost its edge when agile online
      players

      upended retail. Company: the model must align with strategy, strengths and capabilities — Amazon (expander) and
      Costco

      (leverager) both succeed in retail. Look for a model rivals are not using, or are using poorly, and back it with a

      blueprint: structure and culture, tools and processes, metrics and incentives.


      Exam use: name the model from its characteristics, then judge its fit with the industry and the company.
authorities:
  - slug: mgmt2094-reading-bcg-2017-innovation-models
    title: Manly, Grassl and Wilson (2017), Which Innovation Model Is Right for Your Company?
    kind: article
    text: >-
      BCG studied more than 100 of the world's most innovative companies and found six distinct innovation models:
      creator, solution builder, leverager, expander, defender and fast follower. Innovators typically fall short
      because they pursue the wrong model for their business and competitive context, or do not support a good model
      with the capabilities it requires. Choosing the right model is all about context — the industry's and the
      company's own — and the chosen model needs a blueprint that aligns structure and culture, tools and processes, and
      metrics and incentives with it.
    gloss: >-
      The Week 11 reading (Boston Consulting Group): the source for the six innovation models, the company examples
      behind each, and the argument that the right model depends on industry and company context.
    cases: []
    verify: false
  - slug: mgmt2094-example-guest-founder-mark
    title: "Example: Guest lecture — Mark, founder of a furniture business"
    kind: other
    text: >-
      Mark has run his own furniture design and manufacturing business for more than 30 years. Wanting to make tangible
      things and to be environmentally friendly, he started with recycled timber, very little money and a fair bit of
      knowledge — from an earlier menswear business and about three years as PA to the owner of a large recycled-timber
      furniture business — working alone from a double garage with an old truck. His first sale came when a passer-by
      paid $800 for a table he had bought for $200 and restored over a weekend; he reinvested in three more tables that
      night. The business grew organically to 50 staff and four shops, then consolidated into one factory and showroom
      with about 25 staff. He makes marketable, quality, timeless designs, moved partly to new, sustainably sourced
      timber because customers wanted straight grain without bolt holes, and advises staying flexible, sticking to your
      core business before branching out, keeping your eyes open for opportunities like a surfer looking for waves, and
      making every deal a win–win.
    gloss: >-
      Illustrates market-based innovation (marketing as seeing a hole in the market and filling it with what people
      want, at a price they will pay), resource-based innovation (trade knowledge, a truck and equipment), serendipity
      meeting a prepared mind (the host called his first sale serendipitous), the open model's adjust-as-you-go habit
      (changing materials and priorities as conditions change), and choosing an approach that fits the firm's strengths
      ("sticking to your knitting").
    cases: []
    verify: false
  - slug: mgmt2094-example-yellow-tail
    title: "Example: Yellow Tail enters the US wine market"
    kind: other
    text: >-
      Yellow Tail, a budget wine, entered a crowded US market in which premium and budget wines competed on the same
      factors at different levels. Using the four actions framework, it eliminated enological terminology, ageing
      qualities and above-the-line marketing; reduced wine complexity, wine range and vineyard prestige; raised its
      price above budget wine and its retail store involvement; and created easy drinking, ease of selection, and fun
      and adventure. Its value curve sat apart from both premium and budget wines, and it succeeded by securing
      prominent US retailers and relying on marketing through them.
    gloss: >-
      The lecture's worked example of the strategy canvas, the four actions framework and value innovation: by
      rethinking what wine is for, it reached non-customers instead of fighting rivals on the industry's usual factors.
    cases: []
    verify: false
  - slug: mgmt2094-example-braille-rubiks-cube
    title: "Example: the Braille Rubik's cube"
    kind: other
    text: >-
      A Braille version of the Rubik's cube adapts the familiar puzzle so that people with vision impairment can also
      use it. The slides give it as the example of product innovation, and the lecturer presents it as an improvement on
      an existing product rather than a completely new one.
    gloss: >-
      Illustrates product innovation and, because it improves an existing product, incremental rather than radical
      innovation.
    cases: []
    verify: false
  - slug: mgmt2094-example-covid-online-shift
    title: "Example: Covid and the increase of online offerings"
    kind: other
    text: >-
      The slides cite Covid and the increase of online offerings as the case where innovation occurred once external
      conditions were right. The lecturer explains that the external environment changed very quickly, so businesses and
      universities had to find solutions: offerings, teaching and work moved online.
    gloss: >-
      Illustrates the social deterministic school: a combination of external social factors, not a gifted individual,
      drove the innovation.
    cases: []
    verify: false
  - slug: mgmt2094-example-starbucks
    title: "Example: Starbucks"
    kind: other
    text: >-
      The Week 11 slides say Starbucks has innovated the style and type of coffee-based drinks being offered, with the
      firm's own resources providing the context for that innovation. The BCG reading separately lists Starbucks among
      its examples of solution builders, which win by understanding and delighting customers.
    gloss: >-
      Illustrates resource-based innovation (lecture) and the solution-builder model (BCG): the same company can be read
      through different frameworks, so name the framework you are applying.
    cases: []
    verify: false
  - slug: mgmt2094-example-share-a-coke
    title: "Example: the Share a Coke campaign"
    kind: other
    text: >-
      The slides give the Share a Coke campaign as the example of market-based innovation: Coca-Cola recognised an
      opportunity in the marketplace and ran a campaign that made each person feel special and unique. The lecturer adds
      that the campaign increased its sales.
    gloss: >-
      Illustrates market-based innovation: market conditions supplied the opportunity, and the firm had to recognise it
      and act.
    cases: []
    verify: true
  - slug: mgmt2094-example-fleming-penicillin
    title: "Example: Fleming's discovery of penicillin"
    kind: other
    text: >-
      In the lecturer's account (Week 9 recording), Alexander Fleming discovered penicillin in the late 1920s largely by
      chance: he was not looking for an antibiotic, left his laboratory over the holidays without cleaning his dishes,
      and on his return found that bacteria did not grow where the penicillin was. The discovery went on to change
      medicine.
    gloss: >-
      Illustrates serendipity: an unexpected discovery that mattered because a prepared mind recognised its significance
      ("chance favours the prepared mind"). Taken from the recording only, so check the details before relying on them.
    cases: []
    verify: true
  - slug: mgmt2094-example-mobile-phone-to-smartphone
    title: "Example: from mobile phone to smartphone"
    kind: other
    text: >-
      The slides show a mobile phone becoming a smartphone as a change in product structure. The lecturer explains that
      the smartphone departs quite a bit from the mobile phone yet grows out of it: essentially still a phone, but with
      a changed structure and many more capabilities.
    gloss: Illustrates architectural innovation (a change in product structure), in contrast to modular innovation.
    cases: []
    verify: false
  - slug: mgmt2094-example-steam-to-fuel-engine
    title: "Example: a car's steam engine replaced by a fuel engine"
    kind: other
    text: >-
      The slides show the steam engine of a car being replaced by a fuel engine: the product stays the same, but one
      important component technology changes.
    gloss: Illustrates modular innovation (a change in component technology), in contrast to architectural innovation.
    cases: []
    verify: false
  - slug: mgmt2094-example-nike-solution-builder
    title: "Example: Nike (solution builder)"
    kind: other
    text: >-
      BCG's typical solution builder (16.5% total shareholder return, 2008–2017): Nike looks to the market for
      inspiration, combining customer insights with cutting-edge design and technology — for instance, shoe-based
      sensors linked to web-based platforms that give customers highly personalised feedback they value.
    gloss: >-
      Illustrates the solution-builder model: innovation driven by deep customer insight and the full purchase
      experience.
    cases: []
    verify: false
  - slug: mgmt2094-example-zara-leverager
    title: "Example: Zara (leverager)"
    kind: other
    text: >-
      Zara, a Spanish retailer (its parent company's total shareholder return was 16.8%, 2008–2017), changed its
      industry with fast-cycle innovation and fashion-forward designs. At the heart of its success are breakthrough
      design, manufacturing and distribution processes that dramatically shorten the time it takes for new items to
      reach stores.
    gloss: >-
      Illustrates the leverager model: a superior business model, continuously improved and capitalised on to sustain
      industry leadership.
    cases: []
    verify: false
  - slug: mgmt2094-example-amazon-and-costco
    title: "Example: Amazon (expander) and Costco (leverager)"
    kind: other
    text: >-
      Both succeed in consumer retail with advantaged but different business models. Amazon brings its consumer data
      analytics, logistics capabilities and customer service to an ever-expanding number of retail sectors, including
      fashion, luxury apparel and, through Whole Foods, bricks-and-mortar grocery; Costco combines everyday low prices,
      a lean supplier network and a members-only approach. BCG says the expander model is the better choice for Amazon
      because it reaches a much broader pool of consumers and drives more rapid top-line growth, in line with its
      strategy and ambition — and that it would not work without Amazon's high tolerance for risk, reflected in its
      metrics and incentives.
    gloss: >-
      Illustrates that companies in the same industry can succeed with different models, provided each model fits the
      company's strategy, strengths and capabilities.
    cases: []
    verify: false
  - slug: mgmt2094-example-allstate-esurance
    title: "Example: Allstate Insurance acquires Esurance (defender)"
    kind: other
    text: >-
      Allstate Insurance used the defender model: monitoring the landscape, it identified the shift to online and
      app-based insurance products and acquired the pioneer Esurance to keep from falling behind.
    gloss: >-
      Illustrates the defender model working as BCG intends: rigorous monitoring for potential disruption, then
      defending through an acquisition.
    cases: []
    verify: false
  - slug: mgmt2094-example-reckitt-benckiser
    title: "Example: Reckitt Benckiser (fast follower)"
    kind: other
    text: >-
      Reckitt Benckiser Group is BCG's best-in-class fast follower in consumer products, an industry with low
      consumer-switching costs and short product development cycles. To minimise risk and maximise speed it focuses
      technical capability and investment downstream, in product testing, spending minimal energy up front on consumer
      insight and ideation; a flat organisational structure maximises its speed to market.
    gloss: >-
      Illustrates the fast-follower model, and the need to align the organisation with the model (a flat structure for
      speed).
    cases: []
    verify: false
  - slug: mgmt2094-example-sears-defender
    title: "Example: Sears (a defender in a disrupted industry)"
    kind: other
    text: >-
      Retailer Sears (−23.6% total shareholder return, 2008–2017) used the defender model, counting on its brand
      recognition and network of bricks-and-mortar stores to stay ahead. When agile online players upended the retail
      industry, Sears lost its edge.
    gloss: >-
      Illustrates BCG's warning that companies struggle when they pursue an innovation model their industry does not
      reward, and that defending becomes riskier as technology transforms industries.
    cases: []
    verify: false
questions:
  - key: t01
    type: mcq
    concept: types-of-innovation
    difficulty: 1
    set: pretest
    stem: >-
      A hospital's HR team replaces paper applications with online recruiting software. Which type of innovation is this
      on the Week 11 slides?
    options:
      - text: "Process innovation: it improves how an internal task is done"
        correct: true
        why: >-
          Right: online recruiting is the slides' own example of process innovation — it changes an internal HR process,
          not the product or the customer-facing service.
      - text: "Service innovation: it changes how the hospital serves people"
        why: >-
          Tempting because applicants are dealt with online, but the slides' service example is internet-based financial
          services for customers; recruiting is an internal HR process.
      - text: "Organisational innovation: it restructures the HR department"
        why: >-
          Tempting because HR is part of the organisation, but organisational innovation means a new structure or
          procedure such as a venture division; this changes how a process runs.
      - text: "Management innovation: a new philosophy of managing staff"
        why: >-
          Tempting because hiring is a management task, but the slides reserve management innovation for TQM; adopting
          recruiting software changes a process.
  - key: t02
    type: mcq
    concept: types-of-innovation
    difficulty: 1
    stem: What is the Week 11 slides' example of product innovation?
    options:
      - text: A Braille Rubik's cube
        correct: true
        why: >-
          Right: the slides' product example is the Braille Rubik's cube — an improved version of an existing product
          that people with vision impairment can use.
      - text: Online recruiting in HR
        why: >-
          Tempting because it is a new tool, but online recruiting is the slides' process example: it changes an
          internal HR process, not the product a firm sells.
      - text: Total Quality Management
        why: >-
          Tempting because TQM is a well-known innovation, but the slides file it under management innovation — a new
          way of managing, not a new product.
      - text: Guerrilla marketing campaigns
        why: >-
          Tempting because campaigns are visible to customers, but the slides list guerrilla marketing as
          commercial/marketing innovation: it changes promotion, not the product.
  - key: t03
    type: mcq
    concept: types-of-innovation
    difficulty: 2
    stem: Quality circles and just in time (JIT) are the slides' examples of which type of innovation?
    options:
      - text: Production innovation
        correct: true
        why: >-
          Right: the slides list quality circles and JIT under production innovation — new systems for organising how
          goods are produced.
      - text: Management innovation
        why: >-
          Tempting because JIT and quality circles are management ideas, but the slides keep management innovation for
          TQM and file these two under production.
      - text: Process innovation
        why: >-
          Tempting because JIT changes a process, but the slides' process example is online recruiting; quality circles
          and JIT are listed as production innovation.
      - text: Organisational innovation
        why: >-
          Organisational innovation on the slides is a new venture division or accounting procedure — structures and
          procedures, not production systems like JIT.
  - key: t04
    type: mcq
    concept: types-of-innovation
    difficulty: 2
    stem: >-
      A bank launches internet-based financial services so that customers can manage their accounts online. On the
      slides, this is…
    options:
      - text: Service innovation, because it changes how the bank serves its customers
        correct: true
        why: >-
          Right: internet-based financial services are the slides' example of service innovation — they change how the
          customer is served and ease how services are used.
      - text: Process innovation, because the bank's transactions are now processed by computer
        why: >-
          Tempting because computers process the transactions, but the slides use online services for customers as the
          service example; process innovation is internal, like recruiting.
      - text: Commercial/marketing innovation, because it promotes the bank online
        why: >-
          Tempting because the bank is visible online, but marketing innovation is about promotion (guerrilla
          campaigns); this changes the service the customer actually uses.
      - text: Product innovation, because an online account is a brand-new product
        why: >-
          Tempting because the customer gets something new, but the slides treat internet-based financial services as
          service innovation, not a new physical product.
  - key: t05
    type: mcq
    concept: types-of-innovation
    difficulty: 2
    stem: Which statement about radical and incremental innovation matches the lecture?
    options:
      - text: Both count, and minor (incremental) advances are far more frequent than major (radical) ones
        correct: true
        why: >-
          Right: the slide says industrial innovation includes minor (incremental) technological advances, and the
          lecturer adds that these happen far more often than completely new products.
      - text: Only radical breakthroughs count as innovation; incremental changes are merely improvements
        why: >-
          Tempting because breakthroughs are what we picture, but the slide expressly includes minor (incremental)
          technological advances in industrial innovation.
      - text: Radical innovation is more common, because firms must keep reinventing their products to survive
        why: >-
          Tempting because reinvention sounds necessary, but the lecturer says the reverse: incremental improvements
          happen way more frequently than completely new products.
  - key: t06
    type: mcq
    concept: types-of-innovation
    difficulty: 2
    stem: >-
      A manufacturer sets up a new venture division to pursue ideas outside its core business. Which type of innovation
      is this?
    options:
      - text: Organisational innovation
        correct: true
        why: >-
          Right: a new venture division is the slides' own example of organisational innovation — a change to how the
          organisation is structured.
      - text: Management innovation
        why: >-
          Tempting because senior managers create the division, but management innovation on the slides is TQM — a new
          approach to managing, not a new structure.
      - text: Production innovation
        why: >-
          Tempting if the division will make new goods, but production innovation on the slides means systems like
          quality circles and JIT, not new divisions.
      - text: Commercial/marketing innovation
        why: >-
          Tempting if the division will sell new ideas, but marketing innovation on the slides is guerrilla campaigns;
          creating a division changes the organisation itself.
  - key: t07
    type: mcq
    concept: types-of-innovation
    difficulty: 3
    stem: Which pairing of a type of innovation with its slide example is WRONG?
    options:
      - text: Management innovation — Total Quality Management (TQM)
        why: "This pairing is correct, so it is not the answer: the slides give TQM as the management innovation example."
      - text: Commercial/marketing innovation — guerrilla marketing campaigns
        why: >-
          This pairing is correct, so it is not the answer: guerrilla marketing is the slides' commercial/marketing
          example.
      - text: Service innovation — internet-based financial services
        why: >-
          This pairing is correct, so it is not the answer: the slides give internet-based financial services as the
          service example.
      - text: Process innovation — quality circles
        correct: true
        why: >-
          Right: this is the wrong pairing. Quality circles (with JIT) are the slides' production innovation example;
          the process example is online recruiting.
  - key: t08
    type: mcq
    concept: types-of-innovation
    difficulty: 2
    stem: Why does the lecturer stress that "technological" advances are not only about technology?
    options:
      - text: Because technology plays no real part in industrial innovation, which is mostly about marketing
        why: >-
          Tempting as a reading of "not only about technology", but the lecturer still counts technological advances;
          the point is that innovation is wider than technology.
      - text: Because a firm can also innovate how it does business, not just its product
        correct: true
        why: >-
          Right: the lecturer says innovation can happen within the organisation and in how you do business, as well as
          in your product — hence the seven types.
      - text: Because only service firms can innovate without new technology, so the types apply mainly to them
        why: >-
          Tempting because service innovation is on the list, but the seven types apply to any firm, manufacturer or
          not; process, management and production types are not service-only.
  - key: t09
    type: mcq
    concept: types-of-innovation
    difficulty: 3
    stem: >-
      A café chain introduces a new accounting procedure that tracks food waste store by store. On the slides, which
      type of innovation is this?
    options:
      - text: Process innovation, because it changes a back-office process
        why: >-
          Tempting because tracking waste sounds like a process, but the slides place a new accounting procedure under
          organisational innovation, not process innovation.
      - text: Organisational innovation
        correct: true
        why: >-
          Right: the slides give "a new accounting procedure" (with a new venture division) as the example of
          organisational innovation.
      - text: Management innovation, because managers use the figures
        why: >-
          Tempting because managers will use the data, but management innovation on the slides is TQM; a new accounting
          procedure is listed as organisational.
      - text: Production innovation, because it reduces wasted food
        why: >-
          Tempting because waste happens in production, but the slides' production examples are quality circles and JIT,
          not accounting procedures.
  - key: t10
    type: mcq
    concept: types-of-innovation
    difficulty: 2
    stem: >-
      A smartphone maker releases a new model with a better camera and higher resolution. In the lecture's terms this is
      best described as…
    options:
      - text: Incremental product innovation
        correct: true
        why: >-
          Right: the lecturer uses the new smartphone model as an improvement on an existing product — the minor,
          incremental advance that happens far more often than breakthroughs.
      - text: Radical product innovation, because the phone is a new model
        why: >-
          Tempting because each model is new, but the lecturer contrasts these frequent improvements with breakthrough
          innovation: a better camera improves an existing product.
      - text: Process innovation, because the new camera changes how phones are manufactured
        why: >-
          Tempting because new parts may change the factory, but what the customer gets is an improved product; process
          innovation is about internal processes like recruiting.
  - key: t11
    type: mcq
    concept: types-of-innovation
    difficulty: 1
    stem: On the slides, guerrilla marketing campaigns are an example of…
    options:
      - text: Commercial/marketing innovation
        correct: true
        why: >-
          Right: the slides give guerrilla marketing campaigns as the example of commercial/marketing innovation — a new
          way of promoting.
      - text: Service innovation
        why: >-
          Tempting because campaigns reach customers, but service innovation changes how customers are served
          (internet-based financial services), not how they are marketed to.
      - text: Management innovation
        why: >-
          Tempting because managers approve campaigns, but management innovation on the slides is TQM, a new approach to
          managing the whole organisation.
      - text: Product innovation
        why: >-
          Tempting because a campaign can make a product feel new, but the product itself is unchanged; the slides list
          guerrilla campaigns under commercial/marketing.
  - key: t12
    type: mcq
    concept: types-of-innovation
    difficulty: 3
    variant-of: t01
    stem: >-
      A manufacturer moves its hiring to an online recruiting platform. A classmate says this is service innovation
      because applicants are "served" online. What is the best response?
    options:
      - text: "The classmate is right: anything delivered over the internet counts as service innovation"
        why: >-
          Tempting because the slides' service example is internet-based, but being online does not make it a service to
          customers; recruiting is an internal process.
      - text: It is process innovation — the slides' own example of an internal HR process
        correct: true
        why: >-
          Right: the slides list online recruiting under process innovation; the lecturer explains it as improving the
          HR process with software.
      - text: It is product innovation, because the recruiting platform is a new product the firm now uses
        why: >-
          Tempting because the platform is new, but the firm is not selling it; using it changes how a process runs,
          which is process innovation.
      - text: It is not innovation at all, because recruiting is not part of what the firm offers customers
        why: >-
          Tempting because customers never see it, but the lecture stresses that internal process innovation is still
          innovation, and can be very substantial.
  - key: t13
    type: mcq
    concept: types-of-innovation
    difficulty: 4
    stem: Why, according to the lecturer, is process innovation often less noticeable than product innovation?
    options:
      - text: It mostly happens inside the firm, so customers may never see it
        correct: true
        why: >-
          Right: the lecturer says process innovation is mostly happening internally — improving how you make or do
          things — so it is not as noticeable, yet it can be very substantial.
      - text: It is usually radical, so competitors copy it before anyone notices the original
        why: >-
          Tempting because copying hides the source, but the lecturer gives no such reason; process innovation is less
          visible because it happens internally.
      - text: It applies only to manufacturing firms, which attract less public attention
        why: >-
          Tempting because manufacturing is the classic case, but the lecturer's HR online-recruiting example shows
          process innovation in any firm.
      - text: It is protected by law and kept confidential, so it is rarely publicised by firms
        why: >-
          Tempting because firms do guard processes, but the lecture does not mention legal protection; the reason given
          is that the change is internal.
  - key: t14
    type: mcq
    concept: types-of-innovation
    difficulty: 2
    variant-of: t03
    stem: Total Quality Management (TQM) is the slides' example of which type of innovation?
    options:
      - text: Production innovation
        why: >-
          Tempting because quality is about production, but the slides list quality circles and JIT as production
          innovation and keep TQM for management innovation.
      - text: Organisational innovation
        why: >-
          Tempting because TQM affects the whole organisation, but organisational innovation on the slides is a new
          venture division or accounting procedure.
      - text: Management innovation
        correct: true
        why: >-
          Right: the slides give TQM (Total Quality Management) as the example of management innovation — a new approach
          to managing quality across the firm.
      - text: Process innovation
        why: >-
          Tempting because TQM changes processes, but the slides' process example is online recruiting; TQM is listed as
          management innovation.
  - key: t15
    type: truefalse
    concept: types-of-innovation
    difficulty: 1
    set: quickfire
    statement: The lecture treats minor, incremental advances as innovation, not only radical breakthroughs.
    answer: true
    why: >-
      True: the slide says industrial innovation includes minor (incremental) technological advances as well as major
      (radical) innovation, and the incremental kind is more frequent.
  - key: t16
    type: truefalse
    concept: types-of-innovation
    difficulty: 1
    set: quickfire
    statement: On the slides, just in time (JIT) is an example of management innovation.
    answer: false
    why: >-
      False: JIT and quality circles are the slides' examples of production innovation. Management innovation is
      illustrated by TQM (Total Quality Management).
  - key: t17
    type: truefalse
    concept: types-of-innovation
    difficulty: 1
    set: quickfire
    statement: Internet-based financial services are the slides' example of service innovation.
    answer: true
    why: >-
      True: service innovation is about how you serve your customer, and the slides give internet-based financial
      services as the example.
  - key: t18
    type: truefalse
    concept: types-of-innovation
    difficulty: 2
    statement: A new accounting procedure is the slides' example of process innovation.
    answer: false
    why: >-
      False: the slides list a new accounting procedure (and a new venture division) under organisational innovation;
      the process example is online recruiting.
  - key: t19
    type: truefalse
    concept: types-of-innovation
    difficulty: 2
    statement: The Braille Rubik's cube is best described as an incremental product innovation.
    answer: true
    why: >-
      True: it improves an existing product so that people with vision impairment can use it — a product innovation, and
      an improvement rather than a completely new product.
  - key: t20
    type: match
    concept: types-of-innovation
    difficulty: 1
    prompt: Match each type of innovation to the Week 11 slide example.
    pairs:
      - left: Product
        right: A Braille Rubik's cube
      - left: Process
        right: Online recruiting
      - left: Organisational
        right: A new venture division
      - left: Management
        right: Total Quality Management (TQM)
      - left: Production
        right: Quality circles and just in time (JIT)
      - left: Commercial/marketing
        right: Guerrilla marketing campaigns
      - left: Service
        right: Internet-based financial services
  - key: t21
    type: short
    concept: types-of-innovation
    difficulty: 3
    prompt: >-
      "Real innovation is what customers can see: a brand-new product." Respond to this statement in a short applied
      essay. Use the Week 11 types of innovation and the case of a regional bank that (a) launches an app letting
      customers apply for loans online, (b) moves its staff hiring to an online recruiting platform, and (c) adopts
      Total Quality Management.
    model: >-
      The statement is too narrow. The lecture says industrial innovation includes minor (incremental) advances as well
      as major (radical) ones, and names seven types, most of them invisible to customers. Applied to the bank: (a) the
      loan app is service innovation — like the slides' internet-based financial services, it changes how customers are
      served; (b) moving hiring to an online recruiting platform is process innovation, the slides' own example, because
      it improves an internal HR process customers never see; (c) adopting TQM is management innovation, again the slide
      example. All three are best described as incremental rather than radical: each improves how an existing bank does
      business rather than creating a completely new offering, and the lecture stresses that such minor advances are far
      more frequent than breakthroughs. Only (a) is visible to customers, and none is a brand-new product: process and
      management innovations happen internally and are less noticeable, but they can be very substantial — especially
      for a firm that is always hiring. The statement has a grain of truth — product innovation is what we picture first
      — but the types overlap at the edges (the app also changes internal processes), so the stronger position is that
      innovation is wider than what customers see.
    rubric:
      - id: r1
        criterion: "Concept: the types and radical vs incremental"
        marks: 2
        top-band: >-
          Defines service, process and management innovation in the lecture's terms and explains that incremental
          advances count as innovation and are more frequent than radical ones.
        margin-note: Types defined in the lecture's words, not just named.
        authorities: []
      - id: r2
        criterion: "Example: the slide examples"
        marks: 2
        top-band: >-
          Anchors each classification in the matching slide example: internet-based financial services, online
          recruiting, TQM.
        margin-note: Each call tied to a slide example — persuasive.
        authorities:
          - mgmt2094-example-braille-rubiks-cube
      - id: r3
        criterion: "Application: classifying the three changes"
        marks: 4
        top-band: >-
          Classifies all three changes correctly with reasons, avoids calling online recruiting "service", and gives a
          reasoned radical/incremental judgment.
        margin-note: All three classified with reasons; (b) rightly not "service".
        authorities: []
      - id: r4
        criterion: "Evaluation: limits of the classification"
        marks: 2
        top-band: >-
          Notes that the types overlap and that internal innovations are less visible but still substantial; names the
          dominant change rather than forcing a single label.
        margin-note: Sees the overlap and handles it.
        authorities: []
  - key: v01
    type: mcq
    concept: views-of-innovation
    difficulty: 1
    set: pretest
    stem: Which view of innovation holds that innovations come from unique individual talents, so innovators are born?
    options:
      - text: The individualistic school
        correct: true
        why: >-
          Right: the slides say the individualistic school argues innovations result from unique individual talents, and
          as such innovators are born.
      - text: The social deterministic school
        why: >-
          Tempting because both are "schools", but the social deterministic school credits external social factors such
          as demographic and cultural change, not born talent.
      - text: Resource-based innovation
        why: >-
          Tempting because talent is a kind of resource, but resource-based innovation is about the firm's own resources
          (eg Starbucks), not an individual's inborn gifts.
      - text: Market-based innovation
        why: >-
          Tempting because talented people spot opportunities, but market-based innovation puts the context in market
          conditions that the firm must recognise.
  - key: v02
    type: mcq
    concept: views-of-innovation
    difficulty: 2
    stem: >-
      When Covid changed the external environment, offerings across many industries moved online. Which school explains
      this as innovation occurring because conditions were right?
    options:
      - text: The social deterministic school
        correct: true
        why: >-
          Right: the slides use Covid and the increase of online offerings as the social deterministic example —
          external social factors made the conditions right.
      - text: The individualistic school
        why: >-
          Tempting because individuals built the online offerings, but the slides attribute this change to external
          conditions, not to born innovators.
      - text: Resource-based innovation
        why: >-
          Tempting because firms used their own resources to move online, but the slides present Covid as an external
          trigger, which is the social deterministic view.
  - key: v03
    type: mcq
    concept: views-of-innovation
    difficulty: 2
    stem: On the slides, Starbucks innovating the style and type of coffee-based drinks it offers illustrates…
    options:
      - text: Market-based innovation
        why: >-
          Tempting because new drinks respond to buyers, but the slides use Share a Coke for market-based innovation and
          give Starbucks as the resource-based example.
      - text: Resource-based innovation
        correct: true
        why: >-
          Right: the slides give Starbucks as the example of resource-based innovation — the firm's own resources
          provide the context for its innovative activity.
      - text: The individualistic school
        why: >-
          Tempting if you picture a gifted barista, but the slides tie Starbucks to its resources, not to an
          individual's inborn talent.
      - text: The social deterministic school
        why: >-
          Tempting because coffee culture changed, but the slides' social deterministic example is Covid; Starbucks
          illustrates the firm's own resources.
  - key: v04
    type: mcq
    concept: views-of-innovation
    difficulty: 2
    stem: The slides give the Share a Coke campaign as an example of market-based innovation. What makes it market-based?
    options:
      - text: Coca-Cola spotted a market opportunity — making people feel special — and acted on it
        correct: true
        why: >-
          Right: market-based innovation is where market conditions provide the context, so the firm must recognise
          opportunities that arise in the marketplace.
      - text: Coca-Cola's own resources and brand alone explain it, whatever the market happened to want
        why: >-
          Tempting because Coca-Cola is resource-rich, but that is the resource-based view; the slides use Share a Coke
          to show a firm recognising a market opportunity.
      - text: A single gifted marketer was born with the talent to invent it
        why: >-
          Tempting because campaigns have creative authors, but that is the individualistic school; the slides frame
          Share a Coke as recognising market conditions.
      - text: Demographic change forced the firm to redesign its product
        why: >-
          Tempting because external forces appear in other views, but demographic change belongs to the social
          deterministic school, and the drink itself was unchanged.
  - key: v05
    type: mcq
    concept: views-of-innovation
    difficulty: 3
    contrasts-with:
      - models-of-innovation
    stem: >-
      The slides say the individualistic school "is linked to serendipity". What is the most sensible reading of that
      link?
    options:
      - text: Both say innovation happens only when market conditions allow it
        why: >-
          Tempting because conditions matter to serendipity too, but market conditions are the market-based view; the
          link here is to the individual.
      - text: "Both credit the individual: the born innovator, or the prepared mind"
        correct: true
        why: >-
          Right: the individualistic school credits unique talents, and serendipity needs previous knowledge to
          recognise a lucky find — both centre on the individual.
      - text: Both describe innovation as a planned sequence moving through stage gates
        why: >-
          Tempting because both are "models", but a gated sequence is the linear model; serendipity is unexpected
          discovery, the opposite of planned.
  - key: v06
    type: mcq
    concept: views-of-innovation
    difficulty: 1
    stem: According to the slides, where do popular views of innovation mainly come from?
    options:
      - text: Hollywood and Disney movies such as Back to the Future
        correct: true
        why: >-
          Right: the slides say popular views of innovation are mainly seen through Hollywood and Disney movies, with
          Back to the Future as the example.
      - text: Academic studies of the world's most innovative companies
        why: >-
          Tempting because the BCG reading is such a study, but the slides attribute popular views to films, not to
          research on companies.
      - text: Governments' innovation and industry policies
        why: >-
          Tempting because policy shapes innovation, but the slides attribute popular views of innovation to Hollywood
          and Disney films, not to government policy.
  - key: v07
    type: mcq
    concept: views-of-innovation
    difficulty: 3
    stem: >-
      A start-up founder says: "We only innovated because a new competitor and changing customer demand opened a gap we
      had to spot." Which view fits best?
    options:
      - text: The social deterministic school, because outside forces drove the change
        why: >-
          Tempting because the forces are external, but the social deterministic school is about social factors such as
          demographic and cultural change, not competitors and demand.
      - text: Resource-based innovation, because the firm used what it had to respond
        why: >-
          Tempting because any firm uses its resources, but the founder stresses market conditions and a gap to spot,
          which is the market-based view.
      - text: Market-based innovation
        correct: true
        why: >-
          Right: market conditions (a competitor, changing demand) provided the context, and the firm had to recognise
          the opportunity — the market-based view.
      - text: The individualistic school, because the founder personally spotted the gap
        why: >-
          Tempting because the founder spotted it, but the founder credits the market conditions, not inborn talent; the
          individualistic school says innovators are born.
  - key: v08
    type: mcq
    concept: views-of-innovation
    difficulty: 3
    variant-of: v03
    stem: >-
      A large firm with deep cash reserves, laboratories and skilled staff develops a new product line from its in-house
      capabilities. Which view of innovation does this illustrate?
    options:
      - text: Resource-based innovation
        correct: true
        why: >-
          Right: the firm's own resources provide the context for the innovative activity — the view the slides
          illustrate with Starbucks.
      - text: Market-based innovation
        why: >-
          Tempting because a new product line will meet demand, but the scenario stresses in-house resources, not market
          conditions the firm had to recognise.
      - text: The social deterministic school
        why: >-
          Tempting because big firms respond to society, but no external social factor is named here; the innovation
          grows from the firm's own resources.
      - text: Serendipity
        why: >-
          Tempting because new lines can be discovered by luck, but nothing here was unexpected; the firm planned the
          line from its own capabilities.
  - key: v09
    type: mcq
    concept: views-of-innovation
    difficulty: 4
    stem: Which statement best captures the difference between the social deterministic school and market-based innovation?
    options:
      - text: Social determinism credits social change; market-based credits market conditions the firm must recognise
        correct: true
        why: >-
          Right: social determinism points to demographic and cultural change; market-based innovation points to
          marketplace conditions and the firm's recognition of opportunities.
      - text: Social determinism is about the firm's internal resources; market-based innovation is about its customers
        why: >-
          Tempting because both views mention context, but internal resources are the resource-based view; social
          determinism looks outside the firm to society.
      - text: They are the same view under two names, since both locate innovation outside the firm
        why: >-
          Tempting because both point outside the firm, but they differ: one credits social change, the other market
          conditions the firm must actively recognise.
      - text: Social determinism says innovators are born; market-based innovation says they are made
        why: >-
          Tempting as a neat contrast, but "innovators are born" is the individualistic school, not the social
          deterministic one.
  - key: v10
    type: mcq
    concept: views-of-innovation
    difficulty: 2
    variant-of: v07
    stem: >-
      In the guest lecture, Mark describes marketing as seeing a hole or opportunity in the market and filling it with
      what people want, at a price they will pay. Which view of innovation does this fit best?
    options:
      - text: Market-based innovation
        correct: true
        why: >-
          Right: market conditions provide the context and the firm must recognise the opportunity — exactly what Mark
          describes as seeing a hole in the market.
      - text: The individualistic school
        why: >-
          Tempting because Mark is a creative individual, but in this remark he credits reading the market, not inborn
          talent, for what he makes.
      - text: The social deterministic school
        why: >-
          Tempting because markets reflect society, but Mark points to gaps in the market he must spot, not to
          demographic or cultural change.
      - text: Resource-based innovation
        why: >-
          Tempting because Mark used his own skills, but this remark is about recognising market opportunities rather
          than the resources he held.
  - key: v11
    type: mcq
    concept: views-of-innovation
    difficulty: 3
    stem: >-
      Mark says he started with very little money but "a fair bit of knowledge" from years in the trade, plus an old
      truck and a garage. If you used this to illustrate resource-based innovation, which point would be strongest?
    options:
      - text: Covid created sudden demand for restored furniture, so innovation followed
        why: >-
          Tempting because external shocks drive innovation, but Mark started his business decades before Covid, and
          that would be the social deterministic view anyway.
      - text: His own knowledge, truck and workspace gave the context for what he could make
        correct: true
        why: >-
          Right: resource-based innovation is where the firm's own resources provide the context; Mark's knowledge,
          truck and space were his resources.
      - text: He was a born designer, so his resources were irrelevant to what he made
        why: >-
          Tempting because Mark loves making things, but that is the individualistic view; he credits learning the
          trade, not being born an innovator.
      - text: Market conditions alone dictated what he made, so his resources did not matter
        why: >-
          Tempting because Mark reads the market closely, but this answer ignores the resource-based view the question
          asks you to illustrate.
  - key: v12
    type: mcq
    concept: views-of-innovation
    difficulty: 2
    stem: Which view of innovation is summed up on the slides as "when conditions are right innovation will occur"?
    options:
      - text: The individualistic school
        why: >-
          Tempting because talented people act when conditions suit, but the individualistic school says innovators are
          born; the quoted line belongs to social determinism.
      - text: Market-based innovation
        why: >-
          Tempting because market "conditions" appear in its definition, but those conditions facilitate or constrain;
          the quoted line is the social deterministic school.
      - text: The social deterministic school
        correct: true
        why: >-
          Right: external social factors such as demographic and cultural change combine, and when conditions are right
          innovation will occur — the social deterministic school.
  - key: v13
    type: mcq
    concept: views-of-innovation
    difficulty: 4
    contrasts-with:
