        correct: true
        why: >-
          Right: in the closed model the steps run consecutively — concept development, concept frozen, then
          implementation and market introduction.
      - text: At the project start, alongside concept development
        why: >-
          Tempting because some projects start building at once, but in the closed model nothing is implemented until
          the concept is frozen.
      - text: Somewhere in the middle of concept development
        why: >-
          Tempting because overlap is common in practice, but implementation mid-development is the open model; the
          closed model waits for the frozen concept.
      - text: Only after market introduction has taken place
        why: >-
          Tempting because the market comes last, but market introduction is the end point of implementation, not its
          trigger.
