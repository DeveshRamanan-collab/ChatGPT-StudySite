      - text: >-
          Value innovation is different from layering advantage; it seeks radically superior value for the mass market,
          not outperforming a rival
        correct: true
        why: >-
          Right: the slide separates VI from layering competitive advantage, and its competition block replaces
          outperforming rivals with value for the mass market.
      - text: It counts only if the layers are technological and patented
        why: >-
          Tempting because technology features in VI, but the slide's technology test is about affordability for mass
          buyers, not patents.
  - key: vi12
    type: mcq
    concept: value-innovation
    difficulty: 1
    stem: How do the slides describe value innovation's standing?
    options:
      - text: One of the most prominent programmatic approaches to innovation currently in use
        correct: true
        why: >-
          Right: the slide opens by calling VI one of the most prominent programmatic approaches to innovation currently
          in use.
      - text: A discredited approach that firms have largely abandoned
        why: Tempting as a sceptical view, but the slide presents VI as prominent and current, not discredited.
      - text: One of BCG's six innovation models for consumer retail
        why: >-
          Tempting because BCG's models are also this week, but VI is not among creator, solution builder, leverager,
          expander, defender and fast follower.
  - key: vi13
    type: mcq
    concept: value-innovation
    difficulty: 3
    stem: To which building block of strategy does "willingly losing some existing customers" belong?
    options:
      - text: Competition
        why: >-
          Tempting because losing customers to rivals is a competitive matter, but the slide places this phrase in the
          customers row.
      - text: Customers
        correct: true
        why: >-
          Right: the customers row says VI targets the mass of buyers by following non-customers closely and willingly
          losing some existing customers.
      - text: Corporate capabilities
        why: >-
          Tempting because losing customers affects the firm, but the capabilities row is about combining company
          capabilities.
      - text: The business model canvas
        why: >-
          Tempting because customers appear in the business model, but the three building blocks of strategy are
          competition, customers and capabilities.
  - key: vi14
    type: mcq
    concept: value-innovation
    difficulty: 3
    variant-of: vi08
    stem: >-
      A device with a breakthrough feature launches at a price most households can afford, drawing many first-time
      buyers. Which condition for value innovation does this meet?
    options:
      - text: It protects the firm's intellectual property before rivals can copy it
        why: >-
          Tempting because protection matters for creators in the BCG reading, but the slides' VI test is about mass
          buyers, not intellectual property.
      - text: It builds another layer of competitive advantage over rivals
        why: >-
          Tempting because the feature may beat rivals, but the slide says VI is different from layering competitive
          advantage.
      - text: It is cheap enough for mass buyers
        correct: true
        why: >-
          Right: new technology becomes a value innovation only when it is cheap enough for mass buyers — and it is
          drawing non-customers.
  - key: vi15
    type: truefalse
    concept: value-innovation
    difficulty: 1
    set: quickfire
    statement: The slides say value innovation means segmenting the market and accommodating customer needs.
    answer: false
    why: >-
      False: the slide says VI does not mean segmenting the market and accommodating customer needs; it seeks superior
      buyer value for the mass market.
  - key: vi16
    type: truefalse
    concept: value-innovation
    difficulty: 1
    set: quickfire
    statement: New technology is not a value innovation unless it is cheap enough for mass buyers.
    answer: true
    why: >-
      True: the slide says VI differs from technology innovation — new technology does not become VI unless it is cheap
      enough for mass buyers.
  - key: vi17
    type: truefalse
    concept: value-innovation
    difficulty: 1
    statement: Value innovation targets the mass of buyers by following non-customers closely.
    answer: true
    why: >-
      True: on the customers building block, VI targets the mass of buyers by following non-customers closely, willingly
      losing some existing customers.
  - key: vi18
    type: truefalse
    concept: value-innovation
    difficulty: 2
    statement: On competition, value innovation's focus is outperforming the competition.
    answer: false
    why: >-
      False: outperforming the competition is the conventional focus; VI seeks radically superior value to capture the
      entire mass market.
  - key: vi19
    type: truefalse
    concept: value-innovation
    difficulty: 2
    statement: The slides treat value innovation as different from technology innovation.
    answer: true
    why: >-
      True: the slide says VI also differs from technology innovation — new technology must be cheap enough for mass
      buyers to become VI.
  - key: vi20
    type: match
    concept: value-innovation
    difficulty: 2
    prompt: Match each building block of strategy to the value-innovation move.
    pairs:
      - left: Competition
        right: Seek radically superior value to capture the entire mass market
      - left: Customers
        right: Target the mass of buyers by following non-customers, willingly losing some existing customers
      - left: Corporate capabilities
        right: Be willing to combine a company's capabilities
  - key: vi21
    type: short
    concept: value-innovation
    difficulty: 3
    prompt: >-
      "Yellow Tail did not innovate: it just sold cheap wine." Respond to this statement in a short applied essay,
      explaining value innovation and testing Yellow Tail's entry into the US wine market against the three building
      blocks of strategy.
    model: >-
      The statement mistakes value innovation for technology or product invention. Value innovation offers products or
      services that create superior buyer value in existing markets and enable a quantum leap to create new markets; it
      is not layering competitive advantage, nor segmenting the market, and even new technology counts only when it is
      cheap enough for mass buyers. On that test Yellow Tail innovated. Competition: instead of outperforming premium or
      budget rivals on their factors, it sought radically superior value for the mass market — easy drinking, ease of
      selection, fun and adventure. Customers: it looked to non-customers, people who did not usually buy wine, rather
      than better satisfying existing wine drinkers. Capabilities: arguably it combined its own capabilities with
      retailers', raising retail store involvement and relying on them for marketing. Nor was it simply cheap: it raised
      its price above budget wine. It was still just wine, but rethinking what wine is for repositioned it. The limit:
      the slides offer one case, and the lecturer says it almost, not quite, created a new category — so it is a strong
      but not perfect example.
    rubric:
      - id: r1
        criterion: "Concept: value innovation"
        marks: 2
        top-band: >-
          Defines VI from the slides, including what it is not (layering advantage, segmenting) and the mass-buyer test
          for technology.
        margin-note: Definition complete, including the "is not" points.
        authorities: []
      - id: r2
        criterion: "Example: Yellow Tail"
        marks: 2
        top-band: >-
          Uses accurate Yellow Tail detail: the created factors, the price raised above budget wine, the reliance on
          retailers, the focus on non-customers.
        margin-note: Slide detail used accurately.
        authorities:
          - mgmt2094-example-yellow-tail
      - id: r3
        criterion: "Application: the three building blocks"
        marks: 4
        top-band: >-
          Tests the case against competition, customers and corporate capabilities in turn and takes a clear position on
          the statement.
        margin-note: Each block tested; position clear.
        authorities: []
      - id: r4
        criterion: "Evaluation: how strong an example"
        marks: 2
        top-band: >-
          Judges the limits — one case, "almost" a new category, the weaker fit on capabilities — rather than treating
          the case as proof.
        margin-note: Honest about where the case is thin.
        authorities: []
  - key: b01
    type: mcq
    concept: bcg-six-innovation-models
    difficulty: 1
    set: pretest
    stem: Which BCG innovation model "wins by understanding and delighting customers"?
    options:
      - text: Solution builder
        correct: true
        why: >-
          Right: BCG says solution builders win by understanding and delighting customers ("We're listening"), with Nike
          as the typical example.
      - text: Creator
        why: >-
          Tempting because creators delight customers too, but BCG defines creators by a visionary leader, market
          disruption and focused big bets.
      - text: Fast follower
        why: >-
          Tempting because fast followers respond to the market, but they react rapidly to competitors' innovations, not
          to deep customer insight.
      - text: Defender
        why: >-
          Tempting because defenders keep customers, but BCG defines them by protecting points of advantage in mature or
          slow-changing sectors.
  - key: b02
    type: mcq
    concept: bcg-six-innovation-models
    difficulty: 1
    stem: BCG's creators are typically…
    options:
      - text: Quick to copy and improve on rivals' innovations
        why: >-
          Tempting because creators move fast, but copying and improving on rivals is the fast follower model ("Ready to
          react").
      - text: Led by a visionary, disrupting markets and making focused big bets
        correct: true
        why: >-
          Right: BCG says creators are typically led by a visionary, disrupt their core markets and make focused big
          bets — Apple is the classic example.
      - text: Focused on defending their advantages in mature or slow-changing sectors
        why: >-
          Tempting because creators protect their intellectual property, but defending advantage in mature sectors is
          the defender model.
      - text: Using one core capability to enter adjacent markets
        why: >-
          Tempting because creators also grow, but entering adjacent markets with a core capability is the expander
          model.
  - key: b03
    type: mcq
    concept: bcg-six-innovation-models
    difficulty: 2
    stem: Which BCG model uses a core capability to enter and dominate adjacent markets?
    options:
      - text: Leverager
        why: >-
          Tempting because leveragers also exploit strengths, but they innovate their core business model; moving into
          adjacent markets is the expander.
      - text: Creator
        why: >-
          Tempting because creators disrupt markets, but they do it with visionary big bets, not by carrying a core
          capability into adjacent markets.
      - text: Expander
        correct: true
        why: >-
          Right: expanders use a core capability to enter and dominate adjacent markets ("Seeking share to steal") —
          Amazon and Gilead are BCG's examples.
  - key: b04
    type: mcq
    concept: bcg-six-innovation-models
    difficulty: 2
    stem: >-
      Reckitt Benckiser invests downstream in product testing, spends minimal energy up front on consumer insight and
      ideation, and keeps a flat structure for speed. BCG uses it as the example of a…
    options:
      - text: Fast follower
        correct: true
        why: >-
          Right: BCG calls Reckitt Benckiser a best-in-class fast follower: it minimises risk and maximises speed by
          investing downstream in testing.
      - text: Solution builder
        why: >-
          Tempting because it is a consumer-products firm, but solution builders invest heavily in customer insight,
          which Reckitt deliberately minimises.
      - text: Creator
        why: >-
          Tempting because it is successful, but creators make visionary big bets; Reckitt reacts quickly to
          competitors' innovations instead.
      - text: Leverager
        why: >-
          Tempting because a flat structure is a business-model choice, but BCG names Zara, Toyota and Costco as
          leveragers, not Reckitt Benckiser.
  - key: b05
    type: mcq
    concept: bcg-six-innovation-models
    difficulty: 2
    stem: >-
      Zara's breakthrough design, manufacturing and distribution processes, which shorten the time new items take to
      reach stores, make it BCG's example of a…
    options:
      - text: Creator
        why: >-
          Tempting because Zara changed its industry, but BCG files it under leveragers: its advantage is a superior
          business model, not visionary big bets.
      - text: Leverager
        correct: true
        why: >-
          Right: leveragers create a superior business model and capitalise on it to sustain leadership — Zara's
          fast-cycle processes are BCG's example.
      - text: Expander
        why: Tempting because Zara grew fast, but BCG's point is its core business model, not moving into adjacent markets.
      - text: Defender
        why: >-
          Tempting because Zara protects its lead, but defenders win in mature or slow-changing sectors by defending;
          Zara innovates its model.
  - key: b06
    type: mcq
    concept: bcg-six-innovation-models
    difficulty: 3
    stem: >-
      Allstate Insurance identified the shift to online and app-based products and acquired the pioneer Esurance. Which
      model and tactic does this show?
    options:
      - text: "Defender: monitoring for disruption and defending through an acquisition"
        correct: true
        why: >-
          Right: BCG says defenders monitor the landscape for disruptive innovations and defend against them with
          tactics such as acquisitions — Allstate and Esurance.
      - text: "Expander: entering an adjacent market to grow its share"
        why: >-
          Tempting because an acquisition looks like expansion, but BCG presents this as Allstate keeping from falling
          behind — a defensive move.
      - text: "Creator: a visionary leader making one focused big bet"
        why: >-
          Tempting because acquisitions are big bets, but nothing here is market-disrupting vision; Allstate reacted to
          a shift others pioneered.
      - text: "Fast follower: copying a rival's new product quickly and then improving on it"
        why: >-
          Tempting because Allstate responded to a rival, but it bought the pioneer rather than copying and improving
          its product.
  - key: b07
    type: mcq
    concept: bcg-six-innovation-models
    difficulty: 3
    stem: Why did Sears struggle, according to BCG?
    options:
      - text: It was a creator that made too many risky big bets at once
        why: Tempting because big bets can fail, but BCG says Sears used the defender model, not the creator model.
      - text: It relied on the defender model in an industry online players upended
        correct: true
        why: >-
          Right: BCG gives Sears as a company that pursued a model its industry stopped rewarding once online players
          upended retail.
      - text: It copied Amazon's expander model but lacked the logistics to make it work
        why: >-
          Tempting because Amazon is the retail comparison, but BCG says Sears was a defender; it did not copy Amazon's
          model.
      - text: It lacked a visionary leader, so it could not become a creator
        why: >-
          Tempting because creators need visionaries, but BCG's diagnosis is a model the industry no longer rewarded,
          not a missing visionary.
  - key: b08
    type: mcq
    concept: bcg-six-innovation-models
    difficulty: 3
    stem: Amazon and Costco both succeed in retail with different innovation models. What does BCG conclude from this?
    options:
      - text: >-
          Companies in the same industry can succeed with different models, but each model must align with the company's
          strategy, strengths and capabilities
        correct: true
        why: >-
          Right: BCG says the chosen model must align with a company's strategy, strengths and capabilities — expander
          for Amazon, leverager for Costco.
      - text: Only one model can ever succeed in a given industry, so one of them will fail
        why: >-
          Tempting because industry context matters, but BCG says a subset of models succeeds — four in consumer retail
          — not just one.
      - text: Industry context is irrelevant, because any model can work anywhere
        why: >-
          Tempting because two models work in retail, but BCG stresses that only a subset of models succeeds in most
          industries (Sears is the warning).
  - key: b09
    type: mcq
    concept: bcg-six-innovation-models
    difficulty: 2
    stem: According to BCG, innovators typically fall short for one of two reasons. Which pair?
    options:
      - text: They spend too much on research, or too little on marketing
        why: >-
          Tempting because budgets matter, but BCG's two reasons are about the model and the capabilities behind it, not
          spending levels.
      - text: They lack a visionary leader, or they lack enough patents
        why: >-
          Tempting because creators have visionaries and protect their intellectual property, but BCG does not give
          these as the general reasons for falling short.
      - text: >-
          They pursue the wrong model for their business and competitive context, or don't support a good model with the
          capabilities it requires
        correct: true
        why: >-
          Right: BCG says innovators fall short either by pursuing the wrong innovation model or by not supporting a
          good model with the capabilities it requires.
      - text: They innovate too quickly for customers, or too slowly for investors
        why: >-
          Tempting because timing matters, but BCG identifies the wrong model and the missing capabilities as the two
          reasons.
  - key: b10
    type: mcq
    concept: bcg-six-innovation-models
    difficulty: 3
    variant-of: b06
    stem: >-
      A mid-sized insurer in a slow-changing market keeps improving its existing policies, watches start-ups closely and
      buys promising ones to keep pace. Which BCG model is this?
    options:
      - text: Expander
        why: >-
          Tempting because buying start-ups looks like growth, but the purpose here is keeping pace and protecting turf
          in a slow-changing market.
      - text: Defender
        correct: true
        why: >-
          Right: continuous improvement of current offerings, rigorous monitoring of potential disruptions, and M&A to
          keep pace are the defender's characteristics.
      - text: Solution builder
        why: >-
          Tempting because better policies help customers, but nothing here centres on deep customer insight; the firm
          is defending its position.
      - text: Creator
        why: >-
          Tempting because acquisitions are bold, but creators disrupt markets with visionary big bets; this insurer
          protects its existing advantage.
  - key: b11
    type: mcq
    concept: bcg-six-innovation-models
    difficulty: 3
    variant-of: b04
    stem: >-
      A consumer-goods company waits for rivals to launch, then quickly releases an improved version, keeping a flat
      structure for fast decisions. Which model is this?
    options:
      - text: Fast follower
        correct: true
        why: >-
          Right: fast followers react rapidly to — and often improve on — competitive innovations, with a flat
          organisation for rapid decisions.
      - text: Leverager
        why: >-
          Tempting because a flat structure is part of its business model, but leveragers innovate their core model;
          this firm reacts to rivals' launches.
      - text: Creator
        why: >-
          Tempting because it releases new products, but creators lead with visionary big bets rather than waiting for
          rivals to move first.
  - key: b12
    type: mcq
    concept: bcg-six-innovation-models
    difficulty: 4
    stem: When choosing an innovation model, BCG advises looking for one that…
    options:
      - text: Your strongest competitor already uses well, so you can learn from its example
        why: >-
          Tempting because copying success seems safe, but BCG advises the opposite: find a model competitors aren't
          using or are using poorly.
      - text: >-
          Competitors aren't using at all or are using poorly, then filtering the options through your ambition and
          resources
        correct: true
        why: >-
          Right: BCG says look for a model competitors aren't using or are using poorly, weigh the investment, and
          filter through your ambition and resources.
      - text: Requires the least investment, whatever your ambition
        why: >-
          Tempting because cost matters, but BCG says to weigh investment in dollars, time and capabilities against your
          ambition, not simply to minimise it.
      - text: Your industry has never rewarded, because that will surprise rivals
        why: >-
          Tempting because surprise can help, but BCG warns that companies struggle when they pursue a model their
          industry does not reward (Sears).
  - key: b13
    type: mcq
    concept: bcg-six-innovation-models
    difficulty: 3
    stem: Which pieces does BCG say an innovation blueprint should align with the chosen model?
    options:
      - text: >-
          Organisational structure and culture; tools and processes for idea generation, commercialisation and portfolio
          management; metrics and incentives
        correct: true
        why: >-
          Right: BCG's blueprint lays out structure and culture, tools and processes, and metrics and incentives — all
          aligned with the model.
      - text: Eliminate, reduce, raise and create, applied to the industry's factors
        why: >-
          Tempting because it is another framework this week, but these are the four actions from the Yellow Tail case,
          not BCG's blueprint.
      - text: Project charter, business plan, launch proposal and sanity check
        why: Tempting because they are gate outputs, but they come from the linear model figure, not BCG's blueprint.
      - text: Product, process, organisational and service innovation
        why: >-
          Tempting because they are another Week 11 list, but they are types of innovation, not the pieces of a
          blueprint.
  - key: b14
    type: mcq
    concept: bcg-six-innovation-models
    difficulty: 4
    contrasts-with:
      - views-of-innovation
    stem: >-
      A firm "looks to the market for inspiration", using observation and deep insight into customer priorities and
      problems. A student labels it "market-based innovation". Using BCG's six models, what is the most precise label?
    options:
      - text: Fast follower, because it responds to what happens in the market
        why: >-
          Tempting because both respond to the market, but fast followers react to competitors' innovations, not to deep
          customer insight.
      - text: Defender, because understanding customers protects its position
        why: >-
          Tempting because insight can protect a position, but defenders are defined by protecting advantage in mature
          sectors, not customer insight.
      - text: "Solution builder: drawing on deep customer insight"
        correct: true
        why: >-
          Right: BCG says solution builders look to the market for inspiration, drawing on observation and deep insight
          — "market-based" is the lecture's view, not a BCG model.
  - key: b15
    type: mcq
    concept: bcg-six-innovation-models
    difficulty: 2
    stem: Which motto goes with BCG's expander?
    options:
      - text: "\"We know best\""
        why: >-
          Tempting because expanders are confident, but "We know best" is the creator's motto, matching its visionary,
          closed approach.
      - text: "\"Seeking share to steal\""
        correct: true
        why: "Right: the expander's motto is \"Seeking share to steal\" — it moves into adjacent markets to take share."
      - text: "\"Protecting our turf\""
        why: Tempting because expanders guard their core, but "Protecting our turf" is the defender's motto.
      - text: "\"Ready to react\""
        why: Tempting because expanders experiment in-market, but "Ready to react" is the fast follower's motto.
  - key: b16
    type: mcq
    concept: bcg-six-innovation-models
    difficulty: 3
    stem: >-
      Mark advises "sticking to your knitting": make your core business really successful before branching out. Which
      BCG idea does this echo most closely?
    options:
      - text: A model must fit the company's strengths and capabilities
        correct: true
        why: >-
          Right: BCG says the model must fit a company's strategy, strengths and capabilities; Mark's advice is to build
          on what the business does well before branching out.
      - text: The expander's mandate for growth into new, adjacent markets
        why: >-
          Tempting because branching out is expansion, but Mark warns against branching out too early; the expander
          mandate pushes the other way.
      - text: The fast follower's speed in reacting to competitors
        why: >-
          Tempting because Mark stresses flexibility, but his advice here is about focusing on the core, not reacting
          quickly to rivals.
      - text: The creator's limited number of big bets
        why: >-
          Tempting because both involve focus, but creators make visionary bets that disrupt markets; Mark is talking
          about consolidating his core business.
  - key: b17
    type: truefalse
    concept: bcg-six-innovation-models
    difficulty: 1
    set: quickfire
    statement: BCG found six distinct innovation models among more than 100 of the world's most innovative companies.
    answer: true
    why: >-
      True: BCG studied more than 100 of the most innovative companies and found six models: creator, solution builder,
      leverager, expander, defender, fast follower.
  - key: b18
    type: truefalse
    concept: bcg-six-innovation-models
    difficulty: 1
    set: quickfire
    statement: BCG describes defenders as companies that disrupt their core markets with big bets.
    answer: false
    why: >-
      False: disrupting markets with focused big bets describes creators. Defenders focus on points of advantage in
      mature or slow-changing sectors.
  - key: b19
    type: truefalse
    concept: bcg-six-innovation-models
    difficulty: 1
    statement: BCG says that choosing the right innovation model is all about context.
    answer: true
    why: "True: BCG says choosing the right model is all about context — the industry's and the company's own."
  - key: b20
    type: truefalse
    concept: bcg-six-innovation-models
    difficulty: 2
    statement: >-
      According to BCG, Amazon's expander model depends partly on a high tolerance for risk, reflected in its metrics
      and incentives.
    answer: true
    why: >-
      True: BCG says Amazon's best-in-class expander model would not work without its high tolerance for risk, reflected
      in internal metrics and incentives.
  - key: b21
    type: truefalse
    concept: bcg-six-innovation-models
    difficulty: 2
    statement: BCG says the defender model becomes less risky as technology transforms more industries.
    answer: false
    why: >-
      False: BCG says that as technology transforms more industries, adhering to the defender model becomes increasingly
      risky.
  - key: b22
    type: short
    concept: bcg-six-innovation-models
    difficulty: 3
    prompt: >-
      "An established retailer facing online disruption should simply defend what it already does well." Respond to this
      statement in a short applied essay, using BCG's innovation models and at least two company examples from the
      reading.
    model: >-
      BCG's evidence cuts against the statement. Defenders focus on points of advantage in mature or slow-changing
      sectors, using continuous improvement, rigorous monitoring of potential disruptions, and M&A or partnerships to
      keep pace. That can work: Allstate spotted the shift to online and app-based insurance and acquired Esurance. But
      retail is no longer slow-changing, and BCG warns that the defender model becomes riskier as technology transforms
      industries. Sears relied on its brand and stores and lost its edge when agile online players upended retail. In
      consumer retail, BCG says four other models drive returns: creators (Lululemon), solution builders (Target),
      leveragers (Costco) and expanders (Amazon, carrying data analytics, logistics and customer service into new
      sectors). Which fits depends on the company's own context — its strategy, competitive position, capabilities and
      ambition — and BCG advises choosing a model rivals are not using, or are using poorly. Expanding, for instance,
      needs an advantaged capability and a high tolerance for risk. So the retailer should defend only if its sector is
      still slow-changing; otherwise it should choose a better-fitting model and align its structure, culture,
      processes, metrics and incentives behind it.
    rubric:
      - id: r1
        criterion: "Concept: the six models and context"
        marks: 2
        top-band: >-
          Defines the relevant models accurately and explains that the right model depends on industry and company
          context.
        margin-note: Models and the context argument stated precisely.
        authorities: []
      - id: r2
        criterion: "Example: companies from the reading"
        marks: 2
        top-band: Uses at least two accurate examples from the reading, such as Sears, Allstate–Esurance, Amazon or Costco.
        margin-note: Accurate reading examples, well chosen.
        authorities:
          - mgmt2094-example-sears-defender
          - mgmt2094-example-allstate-esurance
          - mgmt2094-example-amazon-and-costco
      - id: r3
        criterion: "Application: the retailer"
        marks: 4
        top-band: >-
          Applies the industry and company tests to the retailer and reaches a reasoned recommendation, taking a clear
          position on the statement.
        margin-note: Recommendation follows from the context tests.
        authorities: []
      - id: r4
        criterion: "Evaluation: risks and requirements"
        marks: 2
        top-band: >-
          Weighs the risks of each option (defending in a disrupted industry; the capabilities and risk tolerance
          expanding requires) and the need for an aligned blueprint.
        margin-note: Trade-offs weighed, not asserted.
        authorities: []
pretest:
