      - text: Product, process, organisational, management and service
        why: >-
          Tempting because they are also a Week 11 list, but these are the types of innovation, not the business model
          elements.
      - text: >-
          Value proposition, customers, customer relationships, channels, revenue, key partners, key activities, key
          resources and costs
        correct: true
        why: >-
          Right: the business modelling slide lists these nine elements, and the lecturer says Yellow Tail thought them
          all through.
      - text: Idea generation, concept feasibility, capability development, ramp up and launch
        why: Tempting because it is a sequence for innovating, but these are the stages of the linear model figure.
  - key: vi11
    type: mcq
    concept: value-innovation
    difficulty: 4
    variant-of: vi03
    stem: >-
      A manager says: "Our value innovation is the three extra layers of competitive advantage we have built over our
      nearest rival." What is the best response from the slides?
    options:
      - text: "Correct: layers of competitive advantage are what value innovation means"
        why: >-
          Tempting because advantage sounds like value, but the slide says VI is different from building layers of
