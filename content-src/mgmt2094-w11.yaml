  - slug: types-of-innovation
    title: Types of innovation
    visual: palace
    visual-brief: >-
      A corridor of eight frames: the first sets radical against incremental innovation, then one frame per type —
      product, process, organisational, management, production, commercial/marketing, service — each with the slide's
      example.
    related:
