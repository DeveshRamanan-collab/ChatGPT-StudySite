  - key: v21
    type: short
    concept: views-of-innovation
    difficulty: 3
    prompt: >-
      "Innovators are born, not made." Respond to this statement in a short applied essay, using the Week 11 views of
      innovation and the guest lecture by Mark, the furniture-business founder.
    model: >-
      The statement is the individualistic school, and Mark's story mostly cuts against it. The market-based view fits
      best: he describes marketing as seeing a hole or opportunity in the market and filling it with what people want,
      at a price they will pay, and he studied design magazines to understand what was marketable. Market conditions
      gave the context, but he had to recognise the opportunities. The resource-based view also helps: his knowledge
      from years in the trade (as PA in a recycled-timber furniture business, and earlier in menswear), an old truck and
      a garage gave the context for what he could make, and his advice to invest early in equipment points the same way.
      The individualistic school fits less well: Mark stresses hard work, common sense and learning from successful
      people rather than inborn genius, although his drive to make things with his hands is personal. The views are
      lenses, not rival facts, and Mark's account also shows outside conditions at work — he notes local manufacturing
      reviving as equipment becomes cheaper and more efficient. So innovators are largely made: by knowledge, resources
      and a market they learn to read.
    rubric:
      - id: r1
        criterion: "Concept: the views of innovation"
        marks: 2
        top-band: >-
          Defines at least two views accurately in the slides' terms (eg market-based: market conditions the firm must
          recognise; resource-based: the firm's own resources as context).
        margin-note: Views defined precisely, not loosely.
        authorities: []
      - id: r2
        criterion: "Example: Mark's guest lecture"
        marks: 2
        top-band: >-
          Uses specific details from the guest lecture — the hole in the market, magazines, trade knowledge, truck and
          garage, equipment — rather than general claims.
        margin-note: Real detail from the guest lecture.
        authorities:
          - mgmt2094-example-guest-founder-mark
      - id: r3
        criterion: "Application: matching details to views"
        marks: 4
        top-band: >-
          Links each detail to the view it supports and argues which view is dominant, showing why the individualistic
          school fits less well.
        margin-note: Each view earned with evidence; dominant view argued.
        authorities: []
      - id: r4
        criterion: "Evaluation: limits of the views"
        marks: 2
        top-band: >-
          Recognises that the views overlap and are lenses, and notes evidence that cuts across them (eg external change
          in equipment costs).
        margin-note: Balanced — the views are not treated as rival facts.
        authorities: []
  - key: m01
    type: mcq
    concept: models-of-innovation
    difficulty: 1
    set: pretest
    stem: "\"Chance favours the prepared mind\" (Louis Pasteur) is quoted on the slides to explain which model of innovation?"
    options:
      - text: Serendipity
        correct: true
        why: >-
