    body: >-
      Popular views of innovation come mainly from Hollywood and Disney films such as *Back to the Future*. The lecture

      then sets out four more concrete views of where innovation comes from:


      - **Social deterministic school** — innovations result from a combination of external social factors and
      influences,
        such as demographic and cultural change. When conditions are right, innovation will occur: Covid and the increase of
        online offerings.
      - **Individualistic school** — innovations result from unique individual talents, so innovators are born. This
      view
        is linked to serendipity.
      - **Resource-based innovation** — the firm's own resources provide the context for innovative activity: Starbucks
      has
        innovated the style and type of coffee-based drinks it offers.
      - **Market-based innovation** — market conditions provide the context that facilitates or constrains innovation,
      so
        the firm must recognise the opportunities that arise in the marketplace: the Share a Coke campaign made each person
        feel special and unique.

      The first two ask whether society or the gifted individual drives innovation; the last two ask whether the firm's
      own

      resources or the market's conditions give it its context. Mark's furniture business shows the market-based view in
      a

      small firm: he describes marketing as seeing a hole in the market and filling it with what people want, at a price

      they will pay.


      Exam use: identify the source the scenario stresses — external society, a gifted individual, internal resources or

      market opportunity — and name the slide example that matches.
  - slug: models-of-innovation
    title: "Models of innovation: serendipity, linear and simultaneous coupling"
    visual: simulation
    visual-brief: >-
      Pick a model and see where innovation starts: serendipity lights only when a chance event meets prior knowledge;
      the linear model runs science → technology → market needs through four gates; simultaneous coupling joins all
      three at once, so no start can be named.
    related:
      - open-and-closed-innovation-models
      - views-of-innovation
      - mgmt2094-w05-grace-accident-association-and-cognitive-theories
    depends-on: []
    contrasts-with:
      - open-and-closed-innovation-models
    cases: []
    authorities:
      - mgmt2094-example-fleming-penicillin
      - mgmt2094-example-accidental-discoveries
      - mgmt2094-example-guest-founder-mark
    verify: false
    body: >-
      Three models describe how innovation happens.


      **Serendipity** is unexpected discovery — it can look like luck. But to recognise the significance of a discovery
      you

      first need previous knowledge in the area: "chance favours the prepared mind" (Louis Pasteur). The lecturer's
      example is

      the discovery of penicillin.


      **Linear models** link the key components in a chain: science and technology lead to technological developments,
      which

      are linked to the needs of the market, and that gives innovation. The lecture's example (Fig 6.3) runs idea
      generation

      → concept feasibility → capability development → ramp up → launch, through four gates: a project charter; a
      business

      plan, after financial and technical feasibility; a launch and proposal, after prototype development; and a sanity

      check, after test marketing, with feedback and corrective measures before commercialisation. It need not be
      followed

      exactly to the letter.


      **Simultaneous coupling** couples all the knowledge within those key components at once — science, technology and

      market opportunity combine — so the point where innovation begins is not known.


      The distinction is the starting point: serendipity starts with chance meeting a prepared mind; the linear model
      starts

      with science and moves in order; simultaneous coupling has no single start.


      Exam use: say which model fits the scenario and why — a planned, gate-by-gate project is linear; an accidental
      find

      recognised by an expert is serendipity.
  - slug: open-and-closed-innovation-models
    title: Closed and open models for innovation
    visual: simulation
    visual-brief: >-
      Two bars on one timeline — concept development and implementation — with the project-start, concept-frozen and
      market-introduction markers; switching from closed to open slides implementation back so it overlaps development,
      and market feedback loops into the concept.
    related:
      - models-of-innovation
      - mgmt2094-w10-build-measure-learn
    depends-on: []
    contrasts-with:
      - models-of-innovation
    cases: []
    authorities:
      - mgmt2094-example-guest-founder-mark
    verify: false
    body: >-
      The lecture's closed and open models describe how concept development and implementation are timed.


      - **Closed model**: the steps run consecutively. The project starts, the concept is developed, the concept is
      frozen,
        and only then does implementation begin, ending in market introduction.
      - **Open model**: the project starts and concept development begins, but implementation starts somewhere in the
      middle
        of concept development, before the concept is frozen. Implementing early is a "trial by fire": you see how the market
        and your users respond, keep developing the concept, and keep tweaking the product or service as implementation
        continues to market introduction.

      The difference is the overlap. In the closed model nothing is implemented until the concept is fixed; in the open

      model development and implementation run side by side, so market feedback can still change the concept.


      Mark's furniture business shows the open habit in a small firm: if a material for a planned piece proves too

      expensive he looks for an alternative, and he reorders priorities as things change — even big companies, he notes,

      plan to go from A to B and end up at C.


      Exam use: ask when the concept is frozen relative to implementation. Before implementation starts → closed; after
      it

      has started → open.
  - slug: architectural-and-modular-innovation
    title: Architectural and modular innovation
    visual: diagram
    visual-brief: >-
      Two rows drawn in turn: a mobile phone whose whole structure is redrawn into a smartphone (architectural), and a
      car outline that keeps its body while one component, the engine, is swapped from steam to fuel (modular).
    related:
      - types-of-innovation
    depends-on: []
    contrasts-with:
      - types-of-innovation
    cases: []
    authorities:
      - mgmt2094-example-mobile-phone-to-smartphone
      - mgmt2094-example-steam-to-fuel-engine
    verify: false
    body: >-
      Innovation can also be divided by what changes inside the product.


      - **Architectural innovation** is a change in product structure. The mobile phone becoming the smartphone is the
        slide's example. The lecturer explains that it departs quite a bit from what came before, yet grows out of the
        legacy product: essentially still a phone, but with a changed structure and many more capabilities.
      - **Modular innovation** is a change in component technology. The steam engine of a car becoming a fuel engine is
      the
        example: the product stays the same, but one important component is replaced by a new technology.

      The test is the level of change: has the way the product is put together changed (architectural), or has one part

      been swapped for a new technology while the overall structure stays the same (modular)?


      This is a different cut from the seven types of innovation. Both slide examples change a product, so both are also

      product innovations; architectural and modular say what kind of change happened inside it.


      Exam use: name the level of change and point to the slide example that matches — the smartphone (structure) or the

      car engine (component).
