    body: |
      Art 8: the conduct of a person or group is an act of a state if the person or group "is in fact acting on
      the instructions of, or under the direction or control of, that State in carrying out the conduct". The
      question came to the fore after 9/11 — could Afghanistan be responsible for Al-Qaeda?

      Two situations. **Instructions** must be very specific, relating to the very conduct in breach and to each
      operation — not general and vague. **Direction or control** means effective control over each operation;
      the two were originally separate but are now assessed together.

      - *Nicaragua* (ICJ, 1986): US participation "even if preponderant or decisive" in financing, organising,
        training, supplying and equipping the contras, selecting targets and planning the whole operation was
        insufficient; the US would need "effective control of the military or paramilitary operations in the
        course of which the alleged violations were committed" (para 115). A very high threshold.
      - *Tadić* (ICTY Appeals Chamber, 1999): the degree of control may vary; an "overall control" test, less
        demanding, suits areas like international humanitarian and criminal law (para 117).
      - *Application of the Genocide Convention* (ICJ, 2007): overall control "stretches too far, almost to
        breaking point" the link between a state's organs and its responsibility; effective control, reflecting
        customary law in art 8, applies.

      Exam use: list what the state did (funding, training, targeting), then ask whether it instructed or
      effectively controlled the specific operation in which the breach occurred.
  - slug: circumstances-precluding-wrongfulness
    title: Circumstances precluding wrongfulness (arts 20–26)
    visual: palace
    visual-brief: Six doors off one corridor — consent, self-defence, countermeasures, force majeure, distress, necessity — each with its condition carved on the lintel, and a sealed wall at the end labelled art 26 (peremptory norms) that no door opens.
    related:
      - framework-of-state-responsibility
      - cessation-and-reparation
      - laws2000-w03-invalidity-of-treaties
    depends-on:
      - framework-of-state-responsibility
    contrasts-with:
      - cessation-and-reparation
    cases:
      - gabcikovo-nagymaros-project-hungary-v-slovakia
      - rainbow-warrior-case
      - serbian-loans-case
      - construction-of-a-wall-advisory-opinion
    authorities:
      - arsiwa-art-20
      - arsiwa-art-21
      - arsiwa-art-22
      - arsiwa-arts-49-53
      - arsiwa-art-23
      - arsiwa-art-24
      - arsiwa-art-25
      - arsiwa-art-26
      - un-charter-art-51
    verify: false
    body: |
      Where a breach is attributable to a state, six circumstances (arts 20–25) may still preclude wrongfulness —
      they act like a defence.

      1. **Consent (art 20):** valid, freely given, clearly expressed before or at the time, and the act stays
         within its limits.
      2. **Self-defence (art 21):** a lawful measure taken in conformity with the UN Charter, read with art 51 —
         an armed attack must have occurred.
      3. **Countermeasures (arts 22, 49–53):** only against a responsible state, to induce compliance; not in
         breach of jus cogens (e.g. use of force); proportional; after procedural steps (negotiate, notify, stop
         once the wrong ceases). Czechoslovakia's diversion of the Danube was disproportionate
         (*Gabčíkovo-Nagymaros*, 1997).
      4. **Force majeure (art 23):** an irresistible force or unforeseen event beyond the state's control making
         performance materially impossible; not if the state contributed or assumed the risk. "Absolute and
         material impossibility" (*Rainbow Warrior*, 1990; *Serbian loans*).
      5. **Distress (art 24):** no other reasonable way of saving the author's life or lives in the author's care;
         not if the state caused it or the act creates a comparable or greater peril.
      6. **Necessity (art 25):** framed in the negative — only way to safeguard an essential interest against a
         grave and imminent peril, without seriously impairing another's essential interest. The *Wall*
         construction was not necessary.

      **Art 26:** none of these precludes the wrongfulness of an act contrary to a peremptory norm.

      Exam use: after breach and attribution, test only the grounds the facts raise; finish with art 26.
  - slug: cessation-and-reparation
    title: Consequences — cessation and full reparation
    visual: diagram
    visual-brief: A broken situation on the left and the "would have existed" situation on the right, bridged first by cessation and non-repetition (art 30) and then by three planks — restitution, compensation, satisfaction — sized to the material and moral damage they repair.
    related:
      - invocation-of-responsibility
      - circumstances-precluding-wrongfulness
      - laws2000-w04-self-determination-and-secession
    depends-on:
      - framework-of-state-responsibility
    contrasts-with:
      - circumstances-precluding-wrongfulness
    cases:
      - factory-at-chorzow
      - construction-of-a-wall-advisory-opinion
      - chagos-islands-case
    authorities:
      - arsiwa-art-30
      - arsiwa-art-31
      - arsiwa-arts-35-37
    verify: false
    body: |
      Where there is an internationally wrongful act and no circumstance precludes wrongfulness, two basic
      consequences arise.

      **Cessation and non-repetition (art 30):** the responsible state must (a) cease the act, if it is
      continuing, and (b) offer appropriate assurances and guarantees of non-repetition, if circumstances so
      require. In the *Wall* advisory opinion Israel "must offer appropriate assurances and guarantees of
      non-repetition".

      **Full reparation (art 31):** the responsible state must make full reparation for the injury caused;
      injury includes any damage, material or moral. *Factory at Chorzów* (PCIJ, 1928): reparation must, as far
      as possible, wipe out all the consequences of the illegal act and re-establish the situation which would,
      in all probability, have existed had it not been committed. Three forms:

      - **Restitution (art 35):** in kind — e.g. the return of property.
      - **Compensation (art 36):** usually money where restitution is not possible (the property was damaged);
        covers material damage that is financially assessable, not moral damage.
      - **Satisfaction (art 37):** repairs moral damage — an apology, an expression of regret, or a court's
        judgment declaring the conduct wrongful.

      In the *Wall* opinion (2004) Israel had to stop construction, dismantle what had been built and compensate
      affected persons; in *Chagos* (2019) the UK had to end its administration and return the islands to
      Mauritius as rapidly as possible.

      Exam use: state cessation first, then match each head of damage to the right form of reparation.
  - slug: invocation-of-responsibility
    title: Who may invoke responsibility — injured and non-injured states
    visual: diagram
    visual-brief: Three concentric rings around a breached obligation — the injured state it was owed to (art 42), a group sharing a collective interest (art 48(1)(a)), and the international community as a whole for erga omnes obligations (art 48(1)(b)).
    related:
      - cessation-and-reparation
      - framework-of-state-responsibility
    depends-on:
      - breach-of-an-international-obligation
    contrasts-with:
      - cessation-and-reparation
    cases:
      - barcelona-traction-case-belgium-v-spain
    authorities:
      - arsiwa-art-42
      - arsiwa-art-48
    verify: false
    body: |
      **The injured state (art 42).** The rule is that only the state or states whose individual rights have
      been violated are entitled to invoke international responsibility — to demand cessation, reparation and so
      on. A state is injured if the obligation breached was owed to it, for instance under a bilateral or a
      multilateral treaty. It may be a state individually or states as a group.

      **Non-injured states (art 48).** In very limited circumstances, any state other than an injured state may
      invoke the responsibility of another state if:

      - (a) the obligation breached is owed to a group of states including that state, and is established for
        the protection of a collective interest of the group — e.g. a regional nuclear-free zone treaty or a
        regional system for the protection of human rights; or
      - (b) the obligation breached is owed to the international community as a whole — an obligation erga
        omnes (*Barcelona Traction*, ICJ 1970).

      An obligation erga omnes is so important that by its very nature it concerns all states: the right it
      protects is so important that all states have a legal interest in its protection. Examples in the slides:
      the non-use of force principle, the prohibition of aggression and genocide, and breaches of international
      environmental law.

      Exam use: ask "to whom was this obligation owed?" — if to the claimant, it is injured (art 42); if to a
      collective or to everyone, art 48 may still give it standing.

cases:
  - slug: corfu-channel-case-united-kingdom-v-albania
    name: Corfu Channel Case (United Kingdom v Albania)
    citation: "[1949] ICJ"
    aglc: Corfu Channel Case (United Kingdom v Albania) [1949] ICJ
    facts: |
      In October 1946, two British cruisers and two destroyers entered the North Corfu Strait and travelled into
      Albanian waters. The passage was regarded as safe: it had been swept in 1944 and check-swept in 1945. Two ships
      struck a mine and were gravely damaged; forty-five British officers and sailors lost their lives and forty-two
      others were wounded. Who laid the mines in Albanian territorial waters remained a matter for conjecture.
    issue: |
      Whether Albania was responsible for the damage and loss of life even though it was not shown to have laid the
      mines itself.
    held: |
      Evidence of the Albanian Government's attitude, and the fact that the laying of the mines would have been
      visible from the Albanian coast, led the Court to conclude that Albania knew about the minefield. "The
      obligations incumbent upon the Albanian authorities consisted in notifying, for the benefit of shipping in
      general, the existence of a minefield in Albanian territorial waters and in warning the approaching British
      warships of the imminent danger to which the minefield exposed them … every State [has an] obligation not to
      allow knowingly its territory to be used for acts contrary to the rights of other States" (p 22). Albania was
      responsible for failing to warn.
    ratio: |
      A state may be responsible for an omission: failing to notify and warn of a known danger in its territory
      breaches its obligations, and a state may not knowingly allow its territory to be used for acts contrary to
      the rights of other states.
    significance: |
      Used in the lecture as an example of a breach by omission, and on the slides to show that a state can be in
      breach of its obligations in relation to the conduct of others it did not itself carry out. The lecturer notes
      the "knowingly allow its territory" duty is a question of due diligence not examined further in this unit.
    why-here: Shows breach by omission and that a state can answer for harm it did not directly cause by failing to warn.
    verify: false
  - slug: velasquez-rodriguez-v-honduras
    name: Velásquez Rodríguez v Honduras
    citation: Judgment, IACtHR Ser C No 4 (29 July 1988), (1989) 28 ILM 378
    aglc: Velásquez Rodríguez v Honduras (Judgment) IACtHR Ser C No 4 (29 July 1988), (1989) 28 ILM 378
    facts: |
      A case before the Inter-American Court of Human Rights concerning Honduras; the materials cite it only for the
      principle on acts of state agents outside the limits of their authority.
    issue: |
      Whether a state is responsible for acts of its agents who contravene internal law or overstep the limits of
      their authority.
    held: |
      Responsibility arises "independent of whether the organ or official has contravened provisions of internal law
      or overstepped the limits of his authority: under international law a State is responsible for the acts of its
      agents undertaken in their official capacity and for their omissions, even when those agents act outside the
      sphere of their authority or violate internal law" (para 170).
    ratio: |
      Acts of state agents in their official capacity are attributable to the state even when ultra vires or
      contrary to internal law.
    significance: |
      Recognises the rule now in art 7 ARSIWA; the rationale is that the state should be able to monitor and control
      its organs and the entities working for it.
    why-here: The authority for attribution of ultra vires acts under art 7 ARSIWA.
    verify: true
  - slug: application-of-the-genocide-convention-bosnia-and-herzegovina-v-serbia-and-montenegro
    name: Application of the Convention on the Prevention and Punishment of the Crime of Genocide (Bosnia and Herzegovina v Serbia and Montenegro)
    citation: (Judgement) ICJ Reports 43 2007
    aglc: Application of the Convention on the Prevention and Punishment of the Crime of Genocide (Bosnia and Herzegovina v Serbia and Montenegro) (Judgement) ICJ Reports 43 2007
    facts: |
      Proceedings before the ICJ in which the Court had to decide whether acts committed by persons and groups
      could be attributed to Serbia and Montenegro. The materials extract the Court's reasoning on attribution only.
    issue: |
      When may persons or groups that are not state organs under internal law be equated with state organs, and
      should the ICTY's "overall control" test replace the effective control test for attributing private conduct?
    held: |
      Persons, groups or entities may be equated with state organs even if that status does not follow from internal
      law, provided they act in "complete dependence" on the state, of which they are ultimately merely the
      instrument — but this "must be exceptional" (paras 392–393). The "overall control" test "has the major drawback
      of broadening the scope of State responsibility well beyond the fundamental principle … a State is responsible
      only for its own conduct"; it is "unsuitable, for it stretches too far, almost to breaking point, the connection
      which must exist between the conduct of a State's organs and its international responsibility". Attribution
      requires instructions or direction, or effective control over the action during which the wrong was committed,
      under the customary rule reflected in art 8 (para 398).
    ratio: |
      Private conduct is attributable under art 8 only on instructions or effective control over the specific
      operation; de facto organ status requires complete dependence and is exceptional.
    significance: |
      Rejects Tadić's overall control test and confirms effective control as "the law as it stands now", though
      some disagree with the Court's conclusion.
    why-here: The current statement of both de facto organ status (art 4) and the effective control test (art 8).
    verify: false
  - slug: prosecutor-v-dusko-tadic
    name: The Prosecutor v Duško Tadić
    citation: (Judgement) IT-94-1-A (15 July 1999) (ICTY Appeals Chamber)
    aglc: Prosecutor v Tadić (Judgement) (International Criminal Tribunal for the Former Yugoslavia, Appeals Chamber, Case No IT-94-1-A, 15 July 1999)
    facts: |
      About ten years after Nicaragua, the Appeals Chamber of the International Criminal Tribunal for the former
      Yugoslavia had to discuss state attribution of the conduct of private actors.
    issue: |
      What degree of state control over private individuals is required to attribute their acts to the state?
    held: |
      "The requirement of international law for the attribution to States of acts performed by private individuals
      is that the State exercises control over the individuals. The degree of control may, however, vary according
      to the factual circumstances of each case. The Appeals Chamber fails to see why in each and every circumstance
      international law should require a high threshold for the test of control" (para 117). It developed the
      "overall control" test.
    ratio: |
      Overall control can suffice for attribution; a less demanding test is appropriate in areas such as
      international humanitarian law and international criminal law.
    significance: |
      A response to criticism of Nicaragua's very high threshold — later rejected by the ICJ in the Genocide case
      (2007).
    why-here: The contrast case — overall control — that students confuse with effective control.
    verify: true
  - slug: gabcikovo-nagymaros-project-hungary-v-slovakia
    name: Gabčíkovo-Nagymaros Project (Hungary v Slovakia)
    citation: (Judgement) [1997] ICJ
    aglc: Gabčíkovo-Nagymaros Project (Hungary v Slovakia) (Judgement) [1997] ICJ
    facts: |
      Hungary and Czechoslovakia signed a treaty for the construction of a system of locks on the Danube, to
      facilitate hydroelectricity and navigation, with works in each country forming a unified system. The project
      was highly criticised in Hungary for its ecological impact, and in 1989 Hungary stopped work on its territory
      pending further assessment. Czechoslovakia investigated alternatives and decided it could divert the Danube
      into its territory. In May 1992 Hungary transmitted a note verbale unilaterally terminating the treaty; in
      October 1992 Czechoslovakia began work to dam the river.
    issue: |
      Whether Hungary breached the treaty, and whether Czechoslovakia's diversion of the Danube was a lawful
      countermeasure; the Court also considered the plea of necessity (paras 49–55).
    held: |
      Hungary's refusal to complete the project was a breach of its obligations under the treaty. But an important
      consideration in weighing the lawfulness of countermeasures is their effect: by unilaterally assuming control
      of a shared resource, Czechoslovakia deprived Hungary of its right to an equitable share of the Danube, and
      with the ecological impact the diversion was disproportionate — not a lawful countermeasure. A plea of
      necessity can only be invoked exceptionally, requiring an essential interest, a grave and imminent peril,
      that breach was the only way to safeguard it, no serious impairment of another state's essential interest,
      and no contribution by the invoking state.
    ratio: |
      Countermeasures must be proportionate to be lawful; necessity is exceptional and its conditions are cumulative.
    significance: |
      The lecture's leading illustration of countermeasures (art 22, proportionality in art 51) and of the
      narrow construction of necessity (art 25).
    why-here: Used for both countermeasures (proportionality) and necessity.
    verify: false
  - slug: rainbow-warrior-case
    name: Rainbow Warrior Case (France–New Zealand Arbitration Tribunal)
    citation: 82 ILR 500 (1990)
    aglc: Rainbow Warrior Case (France–New Zealand Arbitration Tribunal) (1990) 82 ILR 500
    facts: |
      An arbitration between France and New Zealand in 1990. The materials give no further facts; it is cited only
      for the test of force majeure.
    issue: |
      What is the test for force majeure as a circumstance precluding wrongfulness?
    held: |
      The tribunal explained that the test of applicability of force majeure is one of "absolute and material
      impossibility".
    ratio: |
      Force majeure requires absolute and material impossibility of performance.
    significance: |
      Shows how high the standard of proof for force majeure is; the lecturer stresses looking at such cases because
      the draft articles are not binding as such.
    why-here: Sets the "absolute and material impossibility" threshold for art 23.
    verify: true
  - slug: serbian-loans-case
    name: Serbian Loans case
    citation: PCIJ
    aglc: Serbian Loans case (PCIJ)
    facts: |
      The Kingdom of Serbs, Croats and Slovenes claimed that the First World War made it impossible for it to repay
      its debt.
    issue: |
      Whether the war amounted to force majeure excusing non-payment.
    held: |
      The Permanent Court of International Justice refused to accept the claim.
    ratio: |
      The standard for force majeure is very high; difficulty caused by war did not make repayment impossible.
    significance: |
      With Rainbow Warrior, illustrates the strict threshold for force majeure under art 23.
    why-here: An example of force majeure failing because the threshold is so high.
    verify: true
  - slug: construction-of-a-wall-advisory-opinion
    name: Construction of a Wall Advisory Opinion
    citation: (Advisory Opinion) [2004] ICJ
    aglc: Construction of a Wall (Advisory Opinion) [2004] ICJ
    facts: |
      The opinion concerned Israel's construction of a security barrier, or wall, in the Occupied Palestinian
      Territory.
    issue: |
      Whether construction of the wall was an internationally wrongful act, whether necessity could preclude its
      wrongfulness, and what consequences followed.
    held: |
      The ICJ found construction of the wall to be an internationally unlawful act. It was not necessary to Israel's
      essential interests: there were other means to protect those interests than building the barrier along that
      route. Israel was obliged to stop construction, dismantle portions already built, compensate natural or legal
      persons for damage caused (returning land or compensating), and "offer appropriate assurances and guarantees of
      non-repetition".
    ratio: |
      Necessity fails where the conduct is not the only way to safeguard the essential interest; the consequences of
      a wrongful act are cessation, non-repetition and reparation.
    significance: |
      Used for necessity (art 25), cessation and non-repetition (art 30) and reparation (art 31).
    why-here: The worked example of cessation, non-repetition and reparation, and of a failed plea of necessity.
    verify: false
  - slug: factory-at-chorzow
    name: Factory at Chorzów case
    citation: (1928) PCIJ
    aglc: Factory at Chorzów (1928) PCIJ
    facts: |
      A 1928 case before the Permanent Court of International Justice. The materials give no facts; it is cited only
      for the purpose of reparation.
    issue: |
      What is the purpose and measure of reparation for an illegal act?
    held: |
      "The purpose of such reparation is to as far as possible, wipe all the consequences of the illegal act and
      re-establish the situation which would, in all probability, have existed if that act had not been committed."
    ratio: |
      Reparation must, as far as possible, restore the situation that would have existed but for the wrongful act.
    significance: |
      The classic statement behind the obligation of full reparation in art 31 ARSIWA.
    why-here: Defines what "full reparation" aims at.
    verify: true
  - slug: barcelona-traction-case-belgium-v-spain
    name: Barcelona Traction Case (Belgium v Spain)
    citation: ICJ (1970)
    aglc: Barcelona Traction Case (Belgium v Spain) ICJ (1970)
    facts: |
      An ICJ case between Belgium and Spain decided in 1970. The materials give no facts; it is cited only for
      obligations erga omnes.
    issue: |
      Whether some obligations are owed to the international community as a whole.
    held: |
      The Court recognised obligations erga omnes — obligations owed to the international community as a whole.
    ratio: |
      Some obligations are so important that all states have a legal interest in their protection.
    significance: |
      The source of the erga omnes concept behind art 48(1)(b) ARSIWA, allowing non-injured states to invoke
      responsibility.
    why-here: Explains why a non-injured state can invoke responsibility for an erga omnes breach.
    verify: true

authorities:
  - slug: arsiwa-art-1
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) art 1
    kind: article
    text: |
      "Every internationally wrongful act of a State entails its international responsibility."
    gloss: Any internationally wrongful act triggers the state's international responsibility.
    cases: []
    verify: false
  - slug: arsiwa-art-2
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) art 2
    kind: article
    text: |
      An internationally wrongful act exists when conduct consisting of an act or omission is attributable to a
      State and constitutes a breach of an international obligation owed by that State.
    gloss: Two elements — attribution and breach — and either an act or an omission will do.
    cases:
      - corfu-channel-case-united-kingdom-v-albania
    verify: false
  - slug: arsiwa-art-12
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) art 12
    kind: article
    text: |
      A breach concerns a primary rule of international law irrespective of the source (as summarised on the
      Week 7 slides).
    gloss: A breach of any international obligation counts, whether it comes from custom, treaty or elsewhere.
    cases: []
    verify: true
  - slug: arsiwa-arts-13-14
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) arts 13–14
    kind: article
    text: |
      The state needs to be under the obligation at the time of the breach (as summarised on the Week 7 slides).
    gloss: No retroactivity — the obligation must bind the state when the conduct occurs.
    cases:
      - chagos-islands-case
    verify: true
  - slug: arsiwa-art-15
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) art 15
    kind: article
    text: |
      Composite acts (as summarised on the Week 7 slides): multiple acts which, taken together, eventually amount to
      a breach of an international obligation.
    gloss: A series of acts can add up to a breach even if no single act is enough.
    cases: []
    verify: true
  - slug: arsiwa-art-4
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) art 4
    kind: article
    text: |
      "1. The conduct of any State organ shall be considered an act of that State under international law, whether
      the organ exercises legislative, executive, judicial or any other functions, whatever position it holds in the
      organization of the State, and whatever its character as an organ of the central Government or of a
      territorial unit of the State. 2. An organ includes any person or entity which has that status in accordance
      with the internal law of the State."
    gloss: The conduct of every state organ, at any level and in any branch, is the state's conduct.
    cases:
      - application-of-the-genocide-convention-bosnia-and-herzegovina-v-serbia-and-montenegro
    verify: false
  - slug: arsiwa-art-5
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) art 5
    kind: article
    text: |
      "… a person or entity which is not an organ of the State under article 4 but which is empowered by the law of
      that State to exercise elements of the governmental authority shall be considered an act of the State under
      international law, provided the person or entity is acting in that capacity in the particular instance."
    gloss: Private entities given governmental functions by law engage the state when they exercise those functions.
    cases: []
    verify: false
  - slug: arsiwa-art-6
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) art 6
    kind: article
    text: |
      "The conduct of an organ placed at the disposal of a State by another State shall be considered an act of the
      former State under international law if the organ is acting in the exercise of elements of the governmental
      authority of the State at whose disposal it is placed."
    gloss: A borrowed organ's conduct is attributed to the state that directs it.
    cases: []
    verify: false
  - slug: arsiwa-art-7
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) art 7
    kind: article
    text: |
      "The conduct of an organ of a State or of a person or entity empowered to exercise elements of the
      governmental authority shall be considered an act of the State under international law if the organ, person
      or entity acts in that capacity, even if it exceeds its authority or contravenes instructions."
    gloss: Ultra vires conduct in an official capacity is still the state's conduct.
    cases:
      - velasquez-rodriguez-v-honduras
    verify: false
  - slug: arsiwa-art-8
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) art 8
    kind: article
    text: |
      "The conduct of a person or group of persons shall be considered an act of a State under international law if
      the person or group of persons is in fact acting on the instructions of, or under the direction or control
      of, that State in carrying out the conduct."
    gloss: Private conduct is the state's only on specific instructions or effective control of the operation.
    cases:
      - nicaragua-v-united-states-of-america
      - prosecutor-v-dusko-tadic
      - application-of-the-genocide-convention-bosnia-and-herzegovina-v-serbia-and-montenegro
    verify: false
  - slug: arsiwa-art-10
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) art 10
    kind: article
    text: |
      "1. The conduct of an insurrectional movement which becomes the new Government of a State shall be considered
      an act of that State under international law. 2. The conduct of a movement, insurrectional or other, which
      succeeds in establishing a new State in part of the territory of a pre-existing State or in a territory under
      its administration shall be considered an act of the new State under international law. 3. This article is
      without prejudice to the attribution to a State of any conduct, however related to that of the movement
      concerned, which is to be considered an act of that State by virtue of articles 4 to 9."
    gloss: Insurgents' conduct is attributed only if they become the government or found a new state.
    cases: []
    verify: false
  - slug: arsiwa-art-11
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) art 11
    kind: article
    text: |
      "Conduct which is not attributable to a State under the preceding articles shall nevertheless be considered an
      act of that State under international law if and to the extent that the State acknowledges and adopts the
      conduct in question as its own."
    gloss: A state that acknowledges and adopts others' conduct as its own makes it its own act.
    cases: []
    verify: false
  - slug: arsiwa-arts-16-18
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) arts 16–18
    kind: article
    text: |
      A State aids or assists another state in breaching an obligation owed by both of them (art 16); a State
      exercises direction or control over another state (art 17); a State coerces another state into breaching an
      obligation (art 18) (as summarised on the Week 7 slides).
    gloss: Responsibility of one state in connection with the wrongful act of another.
    cases: []
    verify: true
  - slug: arsiwa-art-20
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) art 20
    kind: article
    text: |
      "Valid consent by a State to the commission of a given act by another State precludes the wrongfulness of that
      act in relation to the former State to the extent that the act remains within the limits of that consent."
    gloss: Valid consent excuses the act, but only within the limits consented to.
    cases: []
    verify: false
  - slug: arsiwa-art-21
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) art 21
    kind: article
    text: |
      "The wrongfulness of an act of a State is precluded if the act constitutes a lawful measure of self defence
      taken in conformity with the Charter of the United Nations."
    gloss: Self-defence precludes wrongfulness only if lawful under the UN Charter (art 51).
    cases: []
    verify: false
  - slug: arsiwa-art-22
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) art 22
    kind: article
    text: |
      "The wrongfulness of an act of a State not in conformity with an international obligation towards another State
      is precluded if and to the extent that the act constitutes a countermeasure taken against the latter State in
      accordance with chapter II of part three."
    gloss: A lawful countermeasure against a responsible state is not wrongful.
    cases:
      - gabcikovo-nagymaros-project-hungary-v-slovakia
    verify: false
  - slug: arsiwa-arts-49-53
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) arts 49–53
    kind: article
    text: |
      Art 49(1): "An injured State may only take countermeasures against a State which is responsible for an
      internationally wrongful act in order to induce that State to comply with its obligations…". Countermeasures
      must not breach jus cogens obligations (arts 50, 53), must be proportional (art 51), and must meet procedural
      requirements — negotiate, notify, give a chance to cease, terminate once the wrongful act has ceased (arts 52,
      53) (as summarised on the Week 7 slides).
    gloss: Conditions for lawful countermeasures — purpose, limits, proportionality and procedure.
    cases:
      - gabcikovo-nagymaros-project-hungary-v-slovakia
    verify: true
  - slug: arsiwa-art-23
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) art 23
    kind: article
    text: |
      "1. The wrongfulness of an act of a State not in conformity with an international obligation of that State is
      precluded if the act is due to force majeure, that is the occurrence of an irresistible force or of an
      unforeseen event, beyond the control of the State, making it materially impossible in the circumstances to
      perform the obligation."
    gloss: Force majeure excuses non-performance that is materially impossible because of an event beyond control.
    cases:
      - rainbow-warrior-case
      - serbian-loans-case
    verify: false
  - slug: arsiwa-art-24
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) art 24
    kind: article
    text: |
      "1. The wrongfulness of an act of a State not in conformity with an international obligation of that State is
      precluded if the author of the act in question has no other reasonable way, in a situation of distress, of
      saving the author's life or the lives of other persons entrusted to the author's care. 2. Paragraph 1 does not
      apply if: the situation of distress is due, either alone or in combination with other factors, to the conduct
      of the State invoking it; or the act in question is likely to create a comparable or greater peril."
    gloss: Distress excuses an act that was the only reasonable way to save lives, unless self-induced or more dangerous.
    cases: []
    verify: false
  - slug: arsiwa-art-25
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) art 25
    kind: article
    text: |
      "Necessity may not be invoked by a State as a ground for precluding the wrongfulness of an act not in conformity
      with an international obligation of that State unless the act: (a) is the only way for the State to safeguard
      an essential interest against a grave and imminent peril; and (b) does not seriously impair an essential
      interest of the State or States towards which the obligation exists, or of the international community as a
      whole."
    gloss: Necessity is exceptional — only way, essential interest, grave and imminent peril, no serious impairment.
    cases:
      - gabcikovo-nagymaros-project-hungary-v-slovakia
      - construction-of-a-wall-advisory-opinion
    verify: false
  - slug: arsiwa-art-26
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) art 26
    kind: article
    text: |
      "Nothing in this chapter precludes the wrongfulness of any act of a State which is not in conformity with an
      obligation arising under a peremptory norm of general international law."
    gloss: No circumstance precluding wrongfulness can excuse a breach of a peremptory norm.
    cases: []
    verify: false
  - slug: arsiwa-art-30
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) art 30
    kind: article
    text: |
      "The State responsible for the internationally wrongful act is under an obligation: (a) to cease that act, if it
      is continuing; (b) to offer appropriate assurances and guarantees of non-repetition, if circumstances so
      require."
    gloss: Stop a continuing wrong and, where needed, guarantee it will not happen again.
    cases:
      - construction-of-a-wall-advisory-opinion
    verify: false
  - slug: arsiwa-art-31
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) art 31
    kind: article
    text: |
      "1. The responsible State is under an obligation to make full reparation for the injury caused by the
      internationally wrongful act. 2. Injury includes any damage, whether material or moral, caused by the
      internationally wrongful act of a State."
    gloss: Full reparation for all injury, material or moral.
    cases:
      - factory-at-chorzow
    verify: false
  - slug: arsiwa-arts-35-37
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) arts 35–37
    kind: article
    text: |
      Three forms of reparation: restitution (art 35), compensation (art 36), and satisfaction (art 37) (as
      summarised on the Week 7 slides).
    gloss: Restitution in kind, compensation for material loss, satisfaction for moral damage.
    cases: []
    verify: true
  - slug: arsiwa-art-42
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) art 42
    kind: article
    text: |
      The injured state or states may invoke responsibility; a state is injured if the obligation breached was owed
      to it (as explained in the Week 7 online lecture).
    gloss: The state to which the breached obligation was owed can invoke responsibility.
    cases: []
    verify: true
  - slug: arsiwa-art-48
    title: Articles on Responsibility of States for Internationally Wrongful Acts (2001) art 48
    kind: article
    text: |
      "Any State other than an injured State is entitled to invoke the responsibility of another State in accordance
      with paragraph 2 if: (a) the obligation breached is owed to a group of States including that State, and is
      established for the protection of a collective interest of the group; or (b) the obligation breached is owed to
      the international community as a whole."
    gloss: Non-injured states may invoke responsibility for collective-interest and erga omnes obligations.
    cases:
      - barcelona-traction-case-belgium-v-spain
    verify: false
  - slug: un-charter-art-51
    title: Charter of the United Nations art 51
    kind: treaty
    text: |
      "Nothing in the present Charter shall impair the inherent right of individual or collective self-defence if an
      armed attack occurs against a Member of the United Nations…"
    gloss: The self-defence exception to the prohibition on the use of force, triggered by an armed attack.
    cases: []
    verify: false

questions:
  - key: q101
    type: mcq
    concept: framework-of-state-responsibility
    difficulty: 1
    set: pretest
    stem: Under art 2 ARSIWA, what two elements make up an internationally wrongful act?
    options:
      - text: Harm suffered by another state and fault or intention on the part of the responsible state's officials.
        why: Tempting because domestic tort law often asks about damage and fault, but art 2 names only attribution and breach; neither harm nor fault is listed as an element.
      - text: Conduct attributable to a state that breaches an international obligation owed by that state.
        correct: true
        why: Correct — art 2 says an internationally wrongful act exists when an act or omission is attributable to a state and constitutes a breach of an international obligation owed by it.
      - text: A breach of an international obligation and a formal protest by the injured state.
        why: Tempting because invocation matters later, but who may invoke responsibility is a separate question (arts 42 and 48), not an element of the wrongful act itself.
  - key: q102
    type: mcq
    concept: framework-of-state-responsibility
    difficulty: 2
    stem: The lecture describes the rules of state responsibility as "secondary" rules. What does that mean?
    options:
      - text: They rank below treaties and custom in the hierarchy of sources listed in art 38(1) of the ICJ Statute.
        why: Tempting because "secondary" sounds like a lower rank of source, but the distinction is functional, not a hierarchy of sources; art 38 is not what the label refers to.
      - text: They apply only when no primary rule of treaty or customary law covers the conduct in question.
        why: Tempting because it sounds like a gap-filler, but state responsibility presupposes a primary rule; without a primary obligation there is nothing to breach and nothing to be responsible for.
      - text: They determine the legal consequences of breaching the substantive obligations set by primary rules.
        correct: true
        why: Correct — primary rules (treaty or custom) set the substantive obligations such as non-use of force; secondary rules of state responsibility say when they are breached and what follows.
  - key: q103
    type: mcq
    concept: framework-of-state-responsibility
    difficulty: 2
    stem: Why does the lecturer say ARSIWA is not binding as such, yet still refer to it throughout?
    options:
      - text: It was adopted by the ILC's commissioners rather than by states, but many articles reflect custom.
        correct: true
        why: Correct — ILC outputs are adopted by commissioners, not states, so ARSIWA is not a treaty; but many of its articles are recognised, including by the ICJ, as reflecting customary international law.
      - text: It is a treaty that has not yet received enough ratifications to enter into force for all states.
        why: Tempting because the VCLT pattern of signature then ratification is familiar, but ARSIWA was never opened for ratification; it is an ILC text, not a treaty awaiting entry into force.
      - text: It binds only the states that voted for it in the General Assembly, and is persuasive for others.
        why: Tempting because General Assembly votes feel like consent, but the lecture says the articles were adopted by the commissioners and bind no one as such; their force comes from custom.
      - text: It is binding only on international organisations, and applies to states merely by way of analogy to them.
        why: Wrong way round — ARSIWA applies to states; the lecturer mentions a separate, almost copied set of draft articles for international organisations.
  - key: q104
    type: mcq
    concept: framework-of-state-responsibility
    difficulty: 1
    stem: When were the ILC's Articles on Responsibility of States for Internationally Wrongful Acts adopted?
    options:
      - text: 1969, alongside the Vienna Convention on the Law of Treaties.
        why: Tempting because the VCLT is the other ILC codification studied in this unit, but ARSIWA came much later — the slides date its adoption to 10 August 2001.
      - text: 10 August 2001, after more than 40 years of ILC work.
        correct: true
        why: Correct — the slides say the law was studied and developed by the ILC over more than 40 years and codified in ARSIWA, adopted on 10 August 2001.
      - text: 1949, the year of the ICJ's decision in the Corfu Channel case.
        why: Tempting because Corfu Channel is a 1949 state responsibility case covered this week, but the case long predates the ILC's articles, which were adopted in 2001.
  - key: q105
    type: mcq
    concept: framework-of-state-responsibility
    difficulty: 2
    stem: Which statement best describes the scope of the regime of state responsibility studied this week?
    options:
      - text: It is the general regime, concerning states only, not a specialised regime such as WTO law.
        correct: true
        why: Correct — the slides say the general regime of state responsibility concerns states only and is not a specialised regime; WTO trade law is given as an example of lex specialis.
      - text: It covers states and international organisations together under one set of articles.
        why: Tempting because the lecturer mentions organisations, but she says a separate, almost copied set of draft articles applies to them; ARSIWA itself concerns states only.
      - text: It is a specialised regime for trade disputes, monitored and enforced by the WTO's dispute bodies.
        why: Tempting because WTO law is mentioned, but it was given as an example of the specialised regimes that the general regime is not; this week is about the general framework.
  - key: q106
    type: mcq
    concept: framework-of-state-responsibility
    difficulty: 2
    stem: How does international law classify wrongful acts, compared with domestic law's split between crimes and torts?
    options:
      - text: It keeps separate regimes for criminal acts and civil wrongs, each with its own ARSIWA chapter.
        why: Tempting because domestic systems separate crime and tort, but the lecturer says there is no such distinction under international law; ARSIWA has no separate chapters for them.
      - text: It recognises only tort-like wrongs; crime-like conduct is left entirely to international criminal law.
        why: Tempting because individual criminal liability is a different field, but the lecture says "internationally wrongful act" covers criminal acts as well as torts for state responsibility.
      - text: It uses one overarching term, covering crime-like and tort-like wrongs alike.
        correct: true
        why: Correct — the lecturer says "internationally wrongful act" is an overarching term covering both criminal acts and torts; there is no distinction under international law.
  - key: q107
    type: mcq
    concept: framework-of-state-responsibility
    difficulty: 3
    stem: A student's answer finds a clear breach of a treaty and moves straight to reparation. Which step of the five-step approach has been skipped?
    options:
      - text: Identifying the primary obligation, which should come after reparation is assessed.
        why: Tempting because the primary obligation must be identified, but it is step 1, before breach; and the answer did identify the treaty. The missing steps sit between breach and consequences.
      - text: Invocation by the injured state, which is always the second of the five steps.
        why: Tempting because invocation matters (tutorial question 5), but it is not step 2 of the slide's framework; step 2 is the prima facie breach, which the student did address.
      - text: Attribution, and any grounds precluding wrongfulness, between breach and consequences.
        correct: true
        why: Correct — the five steps are primary obligation, prima facie breach, attribution, grounds precluding wrongfulness, then consequences; this answer jumps over steps 3 and 4.
  - key: q108
    type: mcq
    concept: framework-of-state-responsibility
    difficulty: 1
    stem: Which is an example of a primary rule of international law given in the lecture?
    options:
      - text: The prohibition on the use of force against another state.
        correct: true
        why: Correct — the lecturer gives the prohibition on the use of force (non-use of force) as an example of a primary rule found in treaty or customary law.
      - text: The rule that a state must make full reparation for injury it causes.
        why: Tempting because reparation is an obligation, but it is a consequence of breach under art 31 — a secondary rule of state responsibility, not a substantive primary rule.
      - text: The rule that an organ's conduct is attributed to the state under art 4.
        why: Tempting because art 4 is a rule, but attribution rules are secondary rules telling us whether the state breached a primary rule; they impose no substantive obligation.
  - key: q109
    type: mcq
    concept: framework-of-state-responsibility
    difficulty: 3
    stem: A state's foreign ministry argues that ARSIWA "is just an ILC document, so nothing in it can bind us". What is the best response on this week's materials?
    options:
      - text: The argument succeeds; ILC texts have no legal relevance to what a state is obliged to do.
        why: Tempting because ARSIWA is indeed not binding as such, but the lecture stresses that many articles reflect customary international law, which does bind the state.
      - text: The document itself does not bind, but many of its articles codify customary law that does.
        correct: true
        why: Correct — ARSIWA is not binding as such, but many articles appear to codify customary international law, as the ICJ has recognised; the customary rule binds regardless of the document.
      - text: The argument fails because ARSIWA became binding on all states when the General Assembly adopted it.
        why: Tempting because adoption sounds like consent, but the lecture says ARSIWA was adopted by commissioners, not states, and is not a treaty — its force does not come from adoption.
  - key: q110
    type: mcq
    concept: framework-of-state-responsibility
    variant-of: q101
    difficulty: 2
    stem: State A's navy fires on a fishing boat of State B inside B's waters. Which pair of questions does art 2 ARSIWA require you to answer to find an internationally wrongful act?
    options:
      - text: Did A intend to harm B's nationals, and did B suffer material rather than moral damage?
        why: Tempting because intention and damage feel central, but art 2 does not list intention or damage; the type of injury matters only later, for the form of reparation.
      - text: Is the navy's conduct attributable to A, and does it breach an international obligation owed by A?
        correct: true
        why: Correct — art 2 requires conduct (act or omission) attributable to the state that constitutes a breach of an international obligation owed by it; both must be shown.
      - text: Did B consent to the navy's presence, and has B lodged a claim before the ICJ?
        why: Tempting because consent and claims appear this week, but consent is a ground precluding wrongfulness (art 20) and a claim concerns invocation — neither is an element under art 2.
  - key: q111
    type: mcq
    concept: framework-of-state-responsibility
    difficulty: 2
    stem: What does the lecturer recommend consulting when the words of an ARSIWA article, such as art 8, seem vague?
    options:
      - text: The domestic legislation of the state concerned, because internal law defines what each ARSIWA article really means.
        why: Tempting because internal law matters for art 4(2) organ status, but the meaning of an ARSIWA article is not set by any one state's law; the commentaries are the recommended guide.
      - text: The UN Charter, because ARSIWA is an annex to the Charter and shares its travaux.
        why: Tempting because art 21 refers to the Charter, but ARSIWA is not an annex to it; the lecture points instead to the ILC's own commentaries.
      - text: The draft articles with commentaries, where each article in bold is followed by the commissioners' explanation.
        correct: true
        why: Correct — the lecturer says the commentaries give the article in bold and then the commissioners' commentary, which is very helpful guidance, especially for art 8 on private individuals.
  - key: q112
    type: mcq
    concept: framework-of-state-responsibility
    difficulty: 3
    stem: A state opinion says a particular ARSIWA article "has been understood in a certain way" by that state. According to the lecturer, what weight does this carry?
    options:
      - text: It could help show state practice or opinio juris, but one state's view is not enough.
        correct: true
        why: Correct — the lecturer says a state's understanding could help develop an understanding of state practice or opinio juris for custom, but the opinion of one state is not enough.
      - text: It is binding on other states, because states are the makers of international law.
        why: Tempting because states do make international law, but the lecturer says the opinion of one state is not enough and does not mean international law will recognise it.
      - text: It is irrelevant, because only ICJ decisions can interpret ARSIWA's provisions.
        why: Tempting because the ICJ has recognised ARSIWA articles as custom, but the lecturer did not say only the ICJ counts; state views can contribute to practice and opinio juris.
  - key: q113
    type: mcq
    concept: framework-of-state-responsibility
    variant-of: q108
    difficulty: 2
    stem: Which of these is a secondary rule of state responsibility rather than a primary rule?
    options:
      - text: An obligation in a treaty between two states for the good management of shared water.
        why: Tempting because it is a legal obligation, but the lecturer gives treaties for the good management of water as examples of primary rules that set substantive obligations.
      - text: The rule in art 20 ARSIWA that valid consent by a state precludes the wrongfulness of an act.
        correct: true
        why: Correct — art 20 is part of ARSIWA's secondary rules; it tells us whether a breach of a primary rule is wrongful, rather than imposing a substantive obligation itself.
      - text: The duty of a host state to protect a foreign embassy under the Vienna Convention on Diplomatic Relations.
        why: Tempting because it featured in Tehran this week, but the duty to protect the embassy is a substantive treaty obligation — a primary rule whose breach triggers responsibility.
  - key: q114
    type: mcq
    concept: framework-of-state-responsibility
    difficulty: 2
    stem: What does art 1 ARSIWA provide, as set out on the slides?
    options:
      - text: Every internationally wrongful act of a state entails its international responsibility.
        correct: true
        why: Correct — the slide quotes art 1 — "every internationally wrongful act of a State entails its international responsibility" — the starting point of the whole regime.
      - text: Every breach of domestic law by a state organ entails the state's international responsibility.
        why: Tempting because organs matter for attribution, but responsibility turns on international obligations; a breach of domestic law is not the trigger (art 12 looks only at international law).
      - text: Every state must consent before it can be held internationally responsible.
        why: Tempting because consent underpins much of international law, but art 1 attaches responsibility automatically to every wrongful act; consent appears only as a ground precluding wrongfulness.
  - key: q115
    type: mcq
    concept: framework-of-state-responsibility
    difficulty: 3
    contrasts-with:
      - circumstances-precluding-wrongfulness
    stem: In the five-step approach, where does a plea that the victim state consented to the conduct belong?
    options:
      - text: Step 1, because consent shows there was never any primary obligation to begin with.
        why: Tempting because consent is fundamental to treaty-making, but here the obligation exists and has been breached; consent to the act is assessed later as a ground precluding wrongfulness.
      - text: Step 3, because consent by the victim is a way of attributing the conduct to it.
        why: Tempting because consent links two states, but attribution asks whether conduct is the responsible state's own; consent does not move conduct to the victim.
      - text: Step 4, as a possible ground precluding wrongfulness.
        correct: true
        why: Correct — consent (art 20) is one of the six grounds precluding wrongfulness, considered at step 4 after breach and attribution are established.
  - key: q116
    type: mcq
    concept: framework-of-state-responsibility
    variant-of: q105
    difficulty: 2
    stem: An international organisation's peacekeepers breach an obligation. Why would ARSIWA not be the direct source of the organisation's responsibility?
    options:
      - text: Because international organisations can never be held responsible under international law.
        why: Tempting because the unit focuses on states, but the lecturer says other entities can be held responsible; there is a parallel set of draft articles for organisations.
      - text: Because peacekeeping is governed by WTO law, a specialised regime outside the general one.
        why: Tempting because WTO law was the lecturer's specialised-regime example, but it concerns trade, not peacekeeping; the reason is simply that ARSIWA covers states only.
      - text: Because ARSIWA concerns states only; a near-copy set of draft articles applies to international organisations.
        correct: true
        why: Correct — the lecturer explains ARSIWA applies only to states, while almost the same set of draft articles, largely copied and pasted, applies to international organisations.
  - key: q117
    type: truefalse
    concept: framework-of-state-responsibility
    set: quickfire
    statement: ARSIWA is a treaty adopted and ratified by states in 2001.
    answer: false
    why: False — ARSIWA was adopted on 10 August 2001 by the ILC's commissioners, not by states; it is not a treaty and not binding as such, though many articles codify customary international law.
  - key: q118
    type: truefalse
    concept: framework-of-state-responsibility
    set: quickfire
    statement: Primary rules set the substantive obligations; the rules of state responsibility determine the consequences of breaching them.
    answer: true
    why: True — rules of state responsibility are secondary; primary rules found in treaty or custom (e.g. non-use of force) set the obligations, and state responsibility governs the consequences of breach.
  - key: q119
    type: truefalse
    concept: framework-of-state-responsibility
    set: quickfire
    statement: Under art 2 ARSIWA, only a positive act, not an omission, can amount to an internationally wrongful act.
    answer: false
    why: False — art 2 speaks of conduct "consisting of an act or omission"; Tehran and Corfu Channel are both examples of breaches by omission.
  - key: q120
    type: short
    concept: framework-of-state-responsibility
    difficulty: 3
    prompt: Using the tutorial's pandemic Convention hypothetical (Company X in Armadonia distributes its vaccines in priority to developing countries Y and Z), outline the steps you would take to advise Australia on state responsibility, naming the ARSIWA provisions for each step.
    model: |
      First identify the primary legal obligation — here the Convention's obligations, such as art 21's requirement
      that all countries receive an initial allocation of vaccines. Second, decide on the facts whether there is a
      prima facie breach: Company X distributed its batch in priority to Y and Z. Third, ask whether the conduct is
      attributable to a state (arts 4–11 ARSIWA): Company X is a private company, so it is not an art 4 organ; ask
      whether it is empowered by Armadonian law to exercise governmental authority (art 5), whether it acted on
      Armadonia's instructions or under its direction or control (art 8, effective control as in Nicaragua and the
      Genocide case), or whether Armadonia acknowledged and adopted the conduct (art 11). Fourth, consider grounds
      precluding wrongfulness (arts 20–25), such as necessity, remembering art 26. Fifth, can Australia invoke
      responsibility — as an injured state under art 42, or under art 48(1)(a) because the obligation protects a
      collective interest of the Convention's parties? Finally, state the consequences: cessation and non-repetition
      (art 30) and full reparation (art 31) by restitution, compensation or satisfaction.
    rubric:
      - id: r1
        criterion: Identifies the primary obligation and a prima facie breach
        marks: 2
        top-band: Names a specific Convention obligation (e.g. art 21 initial allocation) and links it to the priority distribution facts.
        margin-note: Which article of the Convention, exactly? Start from the primary rule.
        authorities:
          - arsiwa-art-2
          - arsiwa-art-12
      - id: r2
        criterion: Works through attribution pathways for a private company
        marks: 3
        top-band: Rules out art 4, then tests art 5 empowerment, art 8 instructions or effective control, and art 11 adoption against the facts.
        margin-note: Company X is private — which attribution article actually gets you to Armadonia?
        authorities:
          - arsiwa-art-4
          - arsiwa-art-5
          - arsiwa-art-8
          - arsiwa-art-11
      - id: r3
        criterion: Considers grounds precluding wrongfulness
        marks: 2
        top-band: Tests any ground the facts raise (e.g. necessity's cumulative conditions) and notes art 26.
        margin-note: Good — but is it really the only way to safeguard an essential interest?
        authorities:
          - arsiwa-art-25
          - arsiwa-art-26
      - id: r4
        criterion: Addresses invocation and consequences
        marks: 3
        top-band: Explains whether Australia is injured (art 42) or may invoke under art 48(1)(a), then cessation and the three forms of reparation.
        margin-note: Is Australia injured, or is this a collective-interest obligation? Then say what the remedy looks like.
        authorities:
          - arsiwa-art-42
          - arsiwa-art-48
          - arsiwa-art-30
          - arsiwa-art-31
  - key: q201
    type: mcq
    concept: breach-of-an-international-obligation
    difficulty: 1
    stem: Under art 12 ARSIWA, does the source of the obligation breached matter?
    options:
      - text: No — a breach concerns a primary rule of international law irrespective of its source.
        correct: true
        why: Correct — art 12 makes the source irrelevant; custom, treaty and even non-compliance with an ICJ decision can engage responsibility, provided the obligation is international.
      - text: Yes — only treaty obligations can be breached for state responsibility.
        why: Tempting because treaty breaches are the easiest to see, but art 12 says a breach concerns a primary rule irrespective of its source; custom counts just as much as treaty.
      - text: Yes — customary obligations count only if the state has also accepted them in a treaty.
        why: Tempting because custom can feel less concrete than treaty, but art 12 draws no such line; a breach of customary international law alone is enough.
  - key: q202
    type: mcq
    concept: breach-of-an-international-obligation
    difficulty: 2
    stem: State C argues that its conduct cannot be a breach because its own parliament authorised it by statute. On this week's materials, what is the answer?
    options:
      - text: The statute is decisive, because the breach must be of an obligation recognised by domestic law.
        why: Tempting because domestic authorisation feels like a defence, but the lecturer says we are not interested in whether domestic law allowed the conduct; only international law counts.
      - text: Irrelevant — what constitutes a violation is determined by international law, not by whether domestic law allowed the conduct.
        correct: true
        why: Correct — the lecturer stresses under art 12 that we look only at international obligations; whether domestic law permitted the conduct does not decide whether there is a breach.
      - text: The statute shifts the analysis to art 20 consent, because the parliament consented to the conduct.
        why: Tempting because the parliament "agreed", but art 20 concerns consent by another state to the act; a state cannot consent to its own breach through its own legislature.
  - key: q203
    type: mcq
    concept: breach-of-an-international-obligation
    difficulty: 2
    stem: What is the effect of arts 13–14 ARSIWA as summarised in the slides?
    options:
      - text: A state becomes responsible for past conduct once it later ratifies.
        why: Tempting because ratification creates obligations, but it does so only from then on; arts 13–14 exclude responsibility for conduct before the state was bound.
      - text: No retroactivity — the obligation must bind the state at the time of the conduct.
        correct: true
        why: Correct — the state needs to be under the obligation at the time of the breach; there is no retroactive responsibility for conduct before the obligation bound it.
      - text: A breach occurs only once the injured state notifies the responsible state of its complaint in writing.
        why: Tempting because notification appears in countermeasures procedure, but arts 13–14 concern the timing of the obligation, not notice by the injured state.
  - key: q204
    type: mcq
    concept: breach-of-an-international-obligation
    difficulty: 2
    stem: What does art 15 ARSIWA on "composite acts" address?
    options:
      - text: Wrongful acts committed jointly by two or more states acting together in one operation.
        why: Tempting because "composite" suggests several actors, but art 15 concerns several acts, not several states; joint conduct with other states falls under arts 16–18.
      - text: Acts that combine a breach of treaty with a breach of custom, which must then be assessed together as one.
        why: Tempting because an act can breach both sources, but art 12 already makes the source irrelevant; art 15 concerns a series of acts adding up over time.
      - text: A series of acts that, taken together, eventually amount to a breach even if one alone does not.
        correct: true
        why: Correct — the lecturer explains one or two actions may not amount to a breach, but taken together over time they will, for example a level of pollution that accumulates.
  - key: q205
    type: mcq
    concept: breach-of-an-international-obligation
    difficulty: 1
    stem: In the Tehran case, why was Iran's conduct described as a breach by omission?
    options:
      - text: Iran failed to protect the embassy and its staff, as the host state must under the Vienna Convention on Diplomatic Relations.
        correct: true
        why: Correct — protesters stormed the US embassy and took hostages; Iran's failure to protect the embassy and staff, which the VCDR requires of the host state, was an omission.
      - text: Iran omitted to register the embassy under its own domestic law, so the embassy and all its premises lost their protected status.
        why: Tempting because internal law matters for organ status, but nothing in the materials concerns registration; the omission was the failure to protect the embassy.
      - text: Iran's government omitted to pass a statute adopting the VCDR, so the treaty had no force in Iran.
        why: Tempting because incorporation mattered in Week 5, but domestic implementation is irrelevant to breach (art 12); the omission was the failure to protect.
  - key: q206
    type: mcq
    concept: breach-of-an-international-obligation
    difficulty: 2
    stem: In Corfu Channel, what did the ICJ say Albania's obligations consisted of?
    options:
      - text: Sweeping the whole North Corfu Strait for mines at least once a year and certifying it safe for foreign warships.
        why: Tempting because the channel had been swept in 1944 and check-swept in 1945, but the Court framed Albania's duties as notifying and warning, not sweeping.
      - text: Notifying shipping of the minefield and warning the approaching British warships.
        correct: true
        why: Correct — the Court said the obligations consisted in notifying, for shipping in general, the existence of the minefield and warning the approaching British warships of the danger.
      - text: Paying for any mines laid in its waters during the war, known or not.
        why: Tempting because Albania ended up responsible, but responsibility rested on its knowledge and failure to warn; the Court did not impose liability for mines it did not know of.
  - key: q207
    type: mcq
    concept: breach-of-an-international-obligation
    difficulty: 3
    stem: Who laid the mines in Corfu Channel, and why did it matter less than one might expect?
    options:
      - text: It remained a matter for conjecture; Albania was responsible because it knew of the minefield, which was visible from its coast, and failed to warn.
        correct: true
        why: Correct — the slides say who laid the mines remained a matter for conjecture; the Court inferred Albania's knowledge from its attitude and the visibility of the minelaying, and its failure to warn was the breach.
      - text: Albania laid them itself, so the question was simply whether mines count as a use of force.
        why: Tempting because Albania was found responsible, but the lecturer says it was probably not Albania itself that laid the mines; responsibility rested on knowledge and omission.
      - text: The British navy laid them in 1944, so the United Kingdom was responsible for its own loss.
        why: Tempting because the channel had been swept in 1944, but nothing suggests Britain laid the mines; the Court found Albania responsible for failing to warn.
  - key: q208
    type: mcq
    concept: breach-of-an-international-obligation
    difficulty: 2
    stem: Which of these could, according to the lecture, engage a state's international responsibility as a breach?
    options:
      - text: Breaching a provision of its own constitution that has no counterpart in international law.
        why: Tempting because constitutions are fundamental, but a purely domestic obligation is not an international obligation; art 12 is concerned only with international law.
      - text: Adopting a policy that other states strongly dislike but that breaches no obligation it has accepted.
        why: Tempting because diplomatic disapproval can be intense, but responsibility requires a breach of an international obligation; unpopular conduct alone is not wrongful.
      - text: Failing to comply with a decision of the International Court of Justice.
        correct: true
        why: Correct — the lecturer says decisions of courts are important too; if a state does not comply with an ICJ decision, that could engage its international responsibility.
      - text: Taking part in treaty negotiations before the treaty is concluded or in force.
        why: Tempting because negotiations create expectations, but there is no obligation to breach until the state is bound; arts 13–14 require the obligation at the time of the conduct.
  - key: q209
    type: mcq
    concept: breach-of-an-international-obligation
    variant-of: q203
    difficulty: 3
    stem: State D ratifies a pollution treaty in 2025. State E complains of discharges D made in 2022. On arts 13–14 ARSIWA, what is the position under the treaty?
    options:
      - text: D is responsible under the treaty for 2022, because ratification confirms obligations retroactively.
        why: Tempting because ratification expresses consent to the whole treaty, but there is no retroactivity; the obligation must bind the state at the time of the conduct.
      - text: D is responsible only if E ratified first, because the earlier party's date governs both.
        why: Tempting because treaty relations depend on both parties, but the question is when D was bound; E's date of ratification does not make D's earlier conduct a breach.
      - text: D is not responsible under the treaty for the 2022 discharges; it was not bound when they occurred.
        correct: true
        why: Correct — arts 13–14 require the state to be under the obligation at the time of the breach; the treaty cannot found responsibility for pre-2025 discharges (custom may be another matter).
  - key: q210
    type: mcq
    concept: breach-of-an-international-obligation
    variant-of: q204
    difficulty: 3
    stem: State F allows one small unlicensed discharge into a shared river each month. None alone breaches its treaty limit, but over two years the river is badly degraded. Which ARSIWA article is most relevant?
    options:
      - text: Art 15, composite acts.
        correct: true
        why: Correct — art 15 covers a series of acts which, taken together, eventually amount to a breach even if none does alone; the lecturer's own example is pollution adding up over time.
      - text: Art 23, because gradual pollution is an unforeseen event beyond the state's control.
        why: Tempting because it frames the harm as accidental, but F allowed the discharges; force majeure requires an irresistible or unforeseen event making performance impossible.
      - text: Art 11, because F adopted the discharges.
        why: Tempting because F tolerated the conduct, but art 11 concerns attribution of others' conduct by acknowledgement and adoption; the issue here is whether the acts add up to a breach.
  - key: q211
    type: mcq
    concept: breach-of-an-international-obligation
    difficulty: 2
    contrasts-with:
      - attribution-to-the-state
    stem: A student writes, "The mining of the channel breached international law, so Albania is responsible." What is missing from the reasoning?
    options:
      - text: Proof that Albania intended the harm to the British ships.
        why: Tempting because intention feels important, but ARSIWA's elements do not include intention; what is missing is the link between the conduct and the state.
      - text: A link between the conduct and Albania — a breach alone is only prima facie; the second element, attribution to the state, must be shown.
        correct: true
        why: Correct — the lecturer says a breach gives prima facie evidence, but you must connect it to the state; in Corfu Channel the breach attributed to Albania was its own failure to warn.
      - text: Proof that the breach was a composite act under art 15.
        why: Tempting because art 15 is part of breach analysis, but a single failure to warn does not need to be composite; the gap is the second element, attribution.
  - key: q212
    type: mcq
    concept: breach-of-an-international-obligation
    difficulty: 2
    stem: Which pair of cases did the slides cite for the proposition that a breach may consist of an act or an omission?
    options:
      - text: Nicaragua and Tadić, both concerning paramilitary groups.
        why: Tempting because both are central this week, but they concern attribution of private conduct under art 8 (effective versus overall control), not act versus omission.
      - text: Tehran and Corfu Channel.
        correct: true
        why: Correct — slide 7 cites art 2 ARSIWA with the Tehran case and Corfu Channel, both ICJ, for breach by act or omission; both are omission examples in the lecture.
      - text: Factory at Chorzów and Barcelona Traction, both early PCIJ decisions.
        why: Tempting because both are classic cases, but Chorzów concerns reparation and Barcelona Traction erga omnes obligations; and Barcelona Traction is an ICJ case from 1970.
  - key: q213
    type: mcq
    concept: breach-of-an-international-obligation
    difficulty: 3
    stem: Beyond the duty to warn, what further obligation did the ICJ identify in Corfu Channel (p 22)?
    options:
      - text: An obligation to compensate any state whose ships are damaged anywhere in the Mediterranean.
        why: Tempting because the UK sought reparation, but the Court did not create a regional compensation duty; it stated a general obligation about the use of territory.
      - text: An obligation to seek UN Security Council approval before any warship enters territorial waters.
        why: Tempting because the passage of warships was controversial, but the materials mention no Security Council requirement; the obligation stated concerned knowing use of territory.
      - text: Every state's obligation not to allow knowingly its territory to be used for acts contrary to the rights of other states.
        correct: true
        why: Correct — the Court said every state has an obligation "not to allow knowingly its territory to be used for acts contrary to the rights of other States"; the lecturer calls this a due-diligence question.
  - key: q214
    type: mcq
    concept: breach-of-an-international-obligation
    variant-of: q205
    difficulty: 2
    stem: A host state's police stand by while a crowd sets fire to a foreign consulate. On the Tehran reasoning, how is the host state's breach best characterised?
    options:
      - text: A breach by omission — failing to protect.
        correct: true
        why: Correct — like Iran in Tehran, the host state breaches by omission when it fails to protect diplomatic premises and staff as the Vienna Convention requires.
      - text: No breach at all, because the crowd are private persons and the state only answers for its organs' positive acts.
        why: Tempting because private conduct is not normally attributable, but the breach here is the state's own omission — its police failing to protect — not the crowd's acts.
      - text: A composite act under art 15, because each rioter's act is added up until it amounts to a breach.
        why: Tempting because there are many rioters, but art 15 concerns a series of the state's own acts adding up; here a single failure to protect is enough.
  - key: q215
    type: mcq
    concept: breach-of-an-international-obligation
    difficulty: 1
    stem: Which advisory opinion do the slides cite alongside arts 13–14 ARSIWA on being bound at the time of the breach?
    options:
      - text: The Wall advisory opinion (2004), on Israel's construction of a barrier in the Occupied Palestinian Territory.
        why: Tempting because the Wall opinion is used this week, but it appears for necessity, cessation and reparation; the slides pair arts 13–14 with the Chagos opinion.
      - text: Legal Consequences of the Separation of the Chagos Archipelago [2019] ICJ Advisory Opinion.
        correct: true
        why: Correct — slide 7 cites the Chagos Archipelago advisory opinion (2019) for the rule that the state needs to be under the obligation at the time of the breach.
      - text: The Reparation for Injuries advisory opinion, on UN personality.
        why: Tempting because it is an advisory opinion on responsibility-adjacent issues from Week 4, but the slides do not cite it for arts 13–14.
  - key: q216
    type: mcq
    concept: breach-of-an-international-obligation
    variant-of: q201
    difficulty: 2
    stem: State G breaches a well-established rule of customary international law but is party to no treaty on the subject. Can it commit an internationally wrongful act?
    options:
      - text: Yes — a breach of any international obligation, customary or treaty, can found responsibility (art 12).
        correct: true
        why: Correct — art 12 makes the source irrelevant; custom counts as much as treaty, so breaching a customary rule, if attributable, is an internationally wrongful act.
      - text: No — without a treaty there is no written obligation to breach, so responsibility cannot arise.
        why: Tempting because written rules seem easier to breach, but art 12 says the source is irrelevant; a customary obligation binds and can be breached just the same.
      - text: Only if the ICJ has already declared the customary rule to exist in an earlier contentious case or advisory opinion.
        why: Tempting because ICJ decisions confirm custom, but a customary rule binds without a prior judgment declaring it; art 12 asks only whether an international obligation was breached.
  - key: q217
    type: truefalse
    concept: breach-of-an-international-obligation
    set: quickfire
    statement: A state can breach an international obligation by omission as well as by a positive act.
    answer: true
    why: True — art 2 ARSIWA speaks of an act or omission; Iran's failure to protect the embassy in Tehran and Albania's failure to warn in Corfu Channel are the lecture's examples.
  - key: q218
    type: truefalse
    concept: breach-of-an-international-obligation
    set: quickfire
    statement: In Corfu Channel the ICJ found that Albania itself had laid the mines that struck the British ships.
    answer: false
    why: False — who laid the mines remained a matter for conjecture; Albania was responsible because it knew of the minefield and failed to notify shipping and warn the British warships.
  - key: q219
    type: truefalse
    concept: breach-of-an-international-obligation
    set: quickfire
    statement: Under arts 13–14 ARSIWA, a state can be responsible for conduct that occurred before the obligation bound it.
    answer: false
    why: False — the state needs to be under the obligation at the time of the breach; the lecturer stresses there is no retroactivity in terms of responsibility.
  - key: q220
    type: short
    concept: breach-of-an-international-obligation
    difficulty: 3
    prompt: Explain, using Corfu Channel and Tehran, how a state can commit an internationally wrongful act by omission, and why the source and timing of the obligation matter.
    model: |
      Article 2 ARSIWA defines an internationally wrongful act as conduct "consisting of an act or omission" that is
      attributable to a state and breaches an international obligation owed by it. A breach concerns a primary rule
      irrespective of its source (art 12): custom or treaty, it does not matter, but it must be international, not
      domestic. The state must also be bound at the time of the conduct (arts 13–14; Chagos), so there is no
      retroactivity. Omissions show the point clearly. In Tehran, protesters stormed the US embassy and took hostages;
      under the Vienna Convention on Diplomatic Relations the host state must protect the embassy, and Iran's failure
      to protect the embassy and staff was an internationally wrongful act. In Corfu Channel (1949), British warships
      struck mines in Albanian waters and 45 sailors died. Who laid the mines was conjecture, but Albania's attitude
      and the visibility of the minelaying from its coast showed it knew; its obligations were to notify shipping and
      warn the approaching warships, and its failure to do so was the breach. In both, the state answered for its own
      omission, not for the private actors' conduct.
    rubric:
      - id: r1
        criterion: States art 2 and that an omission can be a breach
        marks: 2
        top-band: Quotes "act or omission" and links it to both elements of art 2.
        margin-note: Good start — now show the omission is the state's own conduct.
        authorities:
          - arsiwa-art-2
      - id: r2
        criterion: Explains source and timing (arts 12–14)
        marks: 2
        top-band: Source irrelevant but must be international; obligation must bind at the time (no retroactivity), citing Chagos.
        margin-note: Why does it matter when the obligation arose?
        authorities:
          - arsiwa-art-12
          - arsiwa-arts-13-14
      - id: r3
        criterion: Applies Tehran accurately
        marks: 2
        top-band: Identifies the VCDR duty to protect and Iran's failure to protect as the omission.
        margin-note: What exactly was the obligation Iran failed to perform?
        authorities: []
      - id: r4
        criterion: Applies Corfu Channel accurately
        marks: 3
        top-band: Uses the facts (mines, conjecture over who laid them, knowledge inferred) and the duty to notify and warn.
        margin-note: Responsibility turned on knowledge — say how the Court inferred it.
        authorities: []
  - key: q301
    type: mcq
    concept: attribution-to-the-state
    difficulty: 1
    set: pretest
    stem: A police force of an Australian state (a territorial unit) tortures a foreign national. Under art 4 ARSIWA, whose conduct is this?
    options:
      - text: Only the Australian state's, because the Commonwealth did not act.
        why: Tempting because federal and state governments are separate domestically, but art 4 attributes the conduct of any organ, including a territorial unit's, to the state as a whole.
      - text: Nobody's, until the police are shown to have acted on specific instructions from Canberra.
        why: Tempting because instructions matter under art 8, but that test is for private persons; police are organs under art 4, so no instructions from the central government are needed.
      - text: Australia's — the conduct of any organ, central or territorial, is the state's conduct.
        correct: true
        why: Correct — art 4 covers organs whatever their position and whether of the central government or a territorial unit; the lecturer gives the states within Australia as an example.
  - key: q302
    type: mcq
    concept: attribution-to-the-state
    difficulty: 3
    stem: A militia is not an organ under State H's internal law, but it acts in "complete dependence" on H. What did the ICJ say in the Genocide case (paras 392–393)?
    options:
      - text: It can never be an organ, because art 4(2) makes internal law the only test of organ status.
        why: Tempting because art 4(2) refers to internal law, but the ICJ said entities may be equated with organs even if that status does not follow from internal law.
      - text: It is automatically an organ once H funds or trains it, whatever the degree of dependence.
        why: Tempting because funding suggests a close link, but the test is complete dependence, making the entity merely the state's instrument; funding alone did not suffice even for art 8 in Nicaragua.
      - text: It may exceptionally be equated with a state organ, since otherwise states could escape responsibility through entities whose independence is purely fictitious.
        correct: true
        why: Correct — the Court looked beyond legal status to the reality of the relationship; complete dependence can make an entity a de facto organ, though this "must be exceptional".
  - key: q303
    type: mcq
    concept: attribution-to-the-state
    difficulty: 2
    stem: How often, according to the lecture, will a body be treated as a de facto organ of the state?
    options:
      - text: Only exceptionally — it is a rare occurrence.
        correct: true
        why: Correct — the lecturer says it is only in exceptional circumstances that a body is recognised as a de facto organ; the ICJ said equating it with an organ "must be exceptional".
      - text: Routinely, whenever a body performs any public function under a contract with the state.
        why: Tempting because delegation of public functions is common, but that is the separate art 5 route, which needs empowerment by law; de facto organ status is rare.
      - text: Whenever the internal law of the state is silent about the body's legal status.
        why: Tempting because the test looks beyond internal law, but silence in internal law is not enough; the body must act in complete dependence on the state, which is rare.
  - key: q304
    type: mcq
    concept: attribution-to-the-state
    difficulty: 2
    stem: Which two conditions must be met for conduct to be attributed under art 5 ARSIWA?
    options:
      - text: The entity is a state organ under internal law, and it acts within its instructions.
        why: Tempting because both ideas appear in chapter III, but art 5 applies to entities that are not organs under art 4, and ultra vires conduct is covered by art 7 anyway.
      - text: It is empowered by the state's law to exercise governmental authority, and acts in that capacity.
        correct: true
        why: Correct — art 5 requires (i) empowerment by the law of the state to exercise elements of governmental authority and (ii) that the entity acts in that capacity in the particular instance.
      - text: The state owns a majority of the entity's shares, and the entity's directors are appointed by ministers.
        why: Tempting because ownership and appointments suggest control, but art 5 turns on legal empowerment to exercise governmental authority and acting in that capacity, not ownership.
  - key: q305
    type: mcq
    concept: attribution-to-the-state
    difficulty: 3
    stem: State J's legislation delegates management of an immigration detention centre to a private company. Guards employed by the company mistreat detainees. On which basis is the conduct most likely attributable to J?
    options:
      - text: Art 8, because the company's contract shows J instructed each act of mistreatment.
        why: Tempting because there is a contract, but art 8 requires specific instructions or effective control over the conduct; here the stronger route is legal empowerment under art 5.
      - text: Art 5 — the company is empowered by J's law to exercise governmental authority and acted in that capacity.
        correct: true
        why: Correct — the lecturer gives delegation of prisons or border management to a private corporation as art 5 examples; empowerment by law plus acting in that capacity attributes the conduct.
      - text: Art 11, because J later paid the company's invoice for the detention services it provided to detainees in that month.
        why: Tempting because payment can look like endorsement, but art 11 requires the state to acknowledge and adopt the conduct as its own; paying for services is not adopting mistreatment.
  - key: q306
    type: mcq
    concept: attribution-to-the-state
    difficulty: 2
    stem: New Zealand police are placed at the disposal of the Australian government and act under its control, exercising Australian governmental authority. Whose conduct is it under art 6?
    options:
      - text: New Zealand's, because the officers remain New Zealand organs under New Zealand law.
        why: Tempting because the officers are New Zealand organs, but art 6 attributes the conduct to the state at whose disposal they are placed when exercising its governmental authority.
      - text: Both states jointly and equally, because lending an organ is a form of aid or assistance under art 16.
        why: Tempting because two states are involved, but art 16 concerns aiding another state's wrongful act; art 6 places the lent organ's conduct with the receiving state.
      - text: Australia's.
        correct: true
        why: Correct — under art 6, the conduct of an organ placed at the disposal of a state by another state is the act of the former state when exercising its governmental authority; here Australia.
  - key: q307
    type: mcq
    concept: attribution-to-the-state
    difficulty: 2
    stem: Soldiers acting as soldiers of State K disobey express orders and fire on civilians across the border. Under art 7 ARSIWA, is their conduct attributable to K?
    options:
      - text: Yes — acting in that capacity, their conduct is K's even though it contravened instructions.
        correct: true
        why: Correct — art 7 covers ultra vires conduct by organs and art 5 entities acting in that capacity; the rationale is that the state should be able to monitor and control its organs.
      - text: No — conduct contrary to express orders is private conduct and is not the state's.
        why: Tempting because the soldiers defied the state, but art 7 attributes conduct in an official capacity "even if it exceeds its authority or contravenes instructions".
      - text: Only if K later acknowledges and adopts the soldiers' conduct as its own under art 11 of ARSIWA.
        why: Tempting because art 11 can attribute conduct after the fact, but it is not needed here; art 7 already attributes ultra vires conduct of organs acting in their official capacity.
  - key: q308
    type: mcq
    concept: attribution-to-the-state
    difficulty: 2
    stem: What did the Inter-American Court of Human Rights say in Velásquez Rodríguez v Honduras (para 170)?
    options:
      - text: A state is responsible only for acts its agents were authorised by internal law to do.
        why: Tempting because authority seems to define the state's acts, but the Court said the opposite — responsibility arises even when agents overstep their authority or violate internal law.
      - text: A state is responsible for its agents' acts and omissions in their official capacity, even when they act outside their authority or violate internal law.
        correct: true
        why: Correct — para 170 says responsibility is independent of whether the organ contravened internal law or overstepped its authority; the principle now reflected in art 7.
      - text: A state is responsible for all acts of its nationals, wherever and however committed.
        why: Tempting because nationality links people to states, but the general rule is that states answer only for their own conduct; the case concerns agents in official capacity.
  - key: q309
    type: mcq
    concept: attribution-to-the-state
    difficulty: 3
    stem: A rebel movement in State L commits abuses during a civil war and then succeeds in becoming L's new government. Under art 10(1), what follows?
    options:
      - text: The abuses are attributed to L, because the movement became its new government.
        correct: true
        why: Correct — art 10(1) treats the conduct of an insurrectional movement which becomes the new government as an act of that state, even conduct before it was recognised as the government.
      - text: The abuses are never attributable, because at the time the rebels were fighting the government of L.
        why: Tempting because a good-faith state is not normally responsible for insurgents, but art 10(1) makes an exception once the movement becomes the new government.
      - text: The abuses belong to a new state.
        why: Tempting because art 10(2) does refer to a new state, but that applies where a movement establishes a new state in part of the territory; here it took over L's government.
  - key: q310
    type: mcq
    concept: attribution-to-the-state
    variant-of: q309
    difficulty: 2
    stem: A rebel group in State M violates the Geneva Conventions but is defeated. M acted in good faith against it throughout. Is M responsible for the rebels' conduct?
    options:
      - text: Yes, because every armed group on a state's territory is one of its de facto organs.
        why: Tempting because the rebels were on M's territory, but de facto organ status requires complete dependence on the state; rebels fighting the government are the opposite.
      - text: Yes, because under art 10 a state is always responsible for any movement it failed to defeat quickly enough.
        why: Tempting because the state failed to prevent the breaches, but art 10 contains no such rule; attribution follows only success in forming the government or a new state.
      - text: No, in principle.
        correct: true
        why: Correct — the lecturer says a state that has acted in good faith shouldn't be held accountable for insurgents seeking to undermine it; art 10 attributes only if they become the government or a new state.
  - key: q311
    type: mcq
    concept: attribution-to-the-state
    difficulty: 2
    stem: In Tehran, why was the students' seizure of the embassy attributed to Iran under art 11 ARSIWA?
    options:
      - text: The students were members of Iran's armed forces acting in an official capacity.
        why: Tempting because the result was attribution, but the lecturer stresses it was not the government that stormed the embassy; the students were non-state actors.
      - text: Iran had given the students specific instructions for the operation and effective control of it throughout.
        why: Tempting because instructions and control are an attribution route, but that is art 8; the lecture places Tehran under art 11 because the endorsement came after the fact.
      - text: Iran afterwards issued a decree supporting it, endorsed it publicly and supported the hostage situation.
        correct: true
        why: Correct — after the fact Iran acknowledged and adopted the conduct as its own, by decree and public statements and by supporting the hostage situation; art 11 then attributes it.
  - key: q312
    type: mcq
    concept: attribution-to-the-state
    difficulty: 3
    stem: State N supplies intelligence that helps State P breach an obligation owed by both of them. Under art 16, for what is N responsible?
    options:
      - text: Only for the portion of the help it gave — the violation relating to its aid — not the breach itself.
        correct: true
        why: Correct — the lecturer explains that under art 16 the state that aided or assisted is responsible just for the portion of the help it gave, not for the other state's breach as a whole.
      - text: For P's entire breach, as if N had committed it itself.
        why: Tempting because N helped, but the lecturer says the aiding state is not responsible for the breach itself; it answers for the part relating to the aid it gave.
      - text: For nothing, because only P's organs carried out the breach.
        why: Tempting because P acted, but art 16 makes aid or assistance in breaching an obligation owed by both a source of responsibility for the aiding state.
  - key: q313
    type: mcq
    concept: attribution-to-the-state
    difficulty: 2
    stem: The lecturer describes art 17 ARSIWA (direction and control over another state) as "mostly historical". Why?
    options:
      - text: Because art 17 was repealed when ARSIWA was adopted in 2001, and it now survives only in older case law and state practice.
        why: Tempting because "historical" suggests repeal, but art 17 remains in ARSIWA; the lecturer means its typical situations are largely of the past.
      - text: Because it typically concerns arrangements like protectorates or mandates, where one state oversaw another's governance.
        correct: true
        why: Correct — the lecturer's example is the mandate or protectorate arrangement, where the governing state could be responsible for the protectorate's violations; mostly historical now.
      - text: Because it applies only to coercion during the two world wars.
        why: Tempting because coercion is related, but coercion is art 18, not art 17, and neither is confined to the world wars; art 17 concerns direction and control.
  - key: q314
    type: mcq
    concept: attribution-to-the-state
    difficulty: 2
    stem: State Q coerces State R into breaching an obligation. On the lecture's explanation of art 18, which state is held responsible?
    options:
      - text: R alone, because R's own organs performed the breach and coercion is no excuse for any state.
        why: Tempting because R physically acted, but the lecturer explains under art 18 that the coerced state's conduct is attributed to the coercing state.
      - text: Q, the coercing state.
        correct: true
        why: Correct — the lecturer answered a student's question directly — under art 18, the state that has coerced is held responsible for what the coerced state did.
      - text: Neither, because coercion between states makes the obligation void under the VCLT.
        why: Tempting because coercion can invalidate treaties (Week 3), but that concerns the treaty's validity; art 18 is about responsibility for a breach, which lies with the coercer.
  - key: q315
    type: mcq
    concept: attribution-to-the-state
    variant-of: q305
    difficulty: 4
    stem: An airline is empowered by State S's law to carry out certain border control checks. One of its pilots, flying a commercial route, dumps fuel over State T. Is the pilot's conduct attributable to S under art 5?
    options:
      - text: Yes — once an entity is empowered under art 5, all of its conduct is the state's.
        why: Tempting because empowerment is the first condition, but art 5 also requires the entity to be acting in that capacity in the particular instance; commercial flying is not border control.
      - text: Yes, under art 7, because dumping fuel exceeded the airline's authority and ultra vires conduct is always attributed.
        why: Tempting because art 7 covers ultra vires acts, but only where the entity acts in its governmental capacity; art 7 does not attribute an art 5 entity's purely commercial conduct.
      - text: No, probably not — it was not acting in its governmental capacity in the particular instance.
        correct: true
        why: Correct — art 5 attributes conduct only if the entity is acting in that capacity in the particular instance; the lecturer stresses both conditions, and commercial flying is not governmental authority.
  - key: q316
    type: mcq
    concept: attribution-to-the-state
    difficulty: 3
    contrasts-with:
      - effective-control-and-private-conduct
    stem: What is the key difference between attribution under art 5 and attribution under art 8 ARSIWA?
    options:
      - text: Art 5 rests on legal empowerment to exercise governmental authority; art 8 rests on the state in fact instructing, directing or controlling private conduct.
        correct: true
        why: Correct — art 5 needs empowerment by the state's law plus acting in that capacity; art 8 needs factual instructions or effective control over the operation, with no legal empowerment.
      - text: Art 5 applies to states' own organs; art 8 applies to organs lent by other states.
        why: Tempting because both articles extend beyond core organs, but organs are art 4 and lent organs art 6; art 5 and art 8 both concern non-organs.
      - text: There is no real difference; art 8 simply repeats art 5 for groups of persons rather than individuals.
        why: Tempting because both concern non-organs, but the triggers differ entirely — legal empowerment under art 5 versus factual instructions or control under art 8.
      - text: Art 5 applies only in wartime, art 8 only in peacetime, according to the commentaries.
        why: Tempting because art 8 cases like Nicaragua arose in armed conflict, but nothing in the materials limits either article to war or peace.
  - key: q317
    type: truefalse
    concept: attribution-to-the-state
    set: quickfire
    statement: Under art 7 ARSIWA, an organ's conduct is not attributable to the state if it contravened the state's instructions.
    answer: false
    why: False — art 7 attributes conduct of an organ or art 5 entity acting in that capacity "even if it exceeds its authority or contravenes instructions" (Velásquez Rodríguez).
  - key: q318
    type: truefalse
    concept: attribution-to-the-state
    set: quickfire
    statement: Under art 11, a state can become responsible for conduct it did not commit if it acknowledges and adopts that conduct as its own.
    answer: true
    why: True — art 11 attributes otherwise unattributable conduct "if and to the extent that" the state acknowledges and adopts it, as Iran did by decree and public statements in Tehran.
  - key: q319
    type: truefalse
    concept: attribution-to-the-state
    set: quickfire
    statement: The conduct of municipalities and of the states within a federation such as Australia can be attributed to the state under art 4.
    answer: true
    why: True — art 4 covers any organ whatever its position and whether of the central government or a territorial unit; the lecturer names municipalities and the states within Australia.
  - key: q320
    type: short
    concept: attribution-to-the-state
    difficulty: 3
    prompt: State V's government contracts a private security company, empowered by statute to guard V's border, and later publicly praises a raid the company's guards carried out on a refugee camp across the border in State W. Advise W on whether the raid is attributable to V.
    model: |
      In principle a state is responsible only for its own conduct (art 4), and the company is not an organ of V under
      V's internal law. Nor is there anything suggesting complete dependence making it a de facto organ, which is
      exceptional (Genocide case, paras 392–393). The better route is art 5: the company is empowered by V's statute to
      exercise elements of governmental authority — border control — which the lecture gives as a typical example of
      delegated functions. The second condition is that it acted in that capacity in the particular instance. If the
      guards raided the camp while performing their border-guarding function, art 5 is satisfied, and under art 7 it
      does not matter that they exceeded their authority or contravened instructions (Velásquez Rodríguez). If the raid
      was outside that capacity, W could argue art 8 (instructions or effective control over the operation) or art 11:
      V's public praise may amount to acknowledging and adopting the conduct as its own, as Iran's decree and
      statements did in Tehran — but only "if and to the extent that" V adopts it, not merely approves of it.
    rubric:
      - id: r1
        criterion: States the general rule and excludes art 4
        marks: 1
        top-band: States the own-conduct principle and explains why the company is not a de jure or de facto organ.
        margin-note: Start with who the state is — and why this company isn't it.
        authorities:
          - arsiwa-art-4
      - id: r2
        criterion: Applies art 5's two conditions
        marks: 3
        top-band: Identifies statutory empowerment to exercise governmental authority and tests "acting in that capacity in the particular instance".
        margin-note: Both limbs please — was the raid part of guarding the border?
        authorities:
          - arsiwa-art-5
      - id: r3
        criterion: Uses art 7 for ultra vires conduct
        marks: 2
        top-band: Explains that exceeding authority does not defeat attribution, citing Velásquez Rodríguez.
        margin-note: The raid was surely unauthorised — does that matter?
        authorities:
          - arsiwa-art-7
      - id: r4
        criterion: Considers art 8 and art 11 as alternatives
        marks: 2
        top-band: Distinguishes praise from acknowledgement and adoption, using Tehran, and notes art 8's control threshold.
        margin-note: Is praise the same as adopting the conduct as its own?
        authorities:
          - arsiwa-art-8
          - arsiwa-art-11
  - key: q401
    type: mcq
    concept: effective-control-and-private-conduct
    difficulty: 2
    set: pretest
    stem: In Nicaragua (1986), what did the ICJ require before the contras' acts could be attributed to the United States?
    options:
      - text: Proof that the United States had overall control of the contras as an organised group.
        why: Tempting because overall control is a real test, but it was the ICTY's in Tadić (1999); Nicaragua demanded effective control over the specific operations.
      - text: Proof that the United States had effective control of the operations in which the violations were committed.
        correct: true
        why: Correct — para 115 says it "would in principle have to be proved that that State had effective control of the military or paramilitary operations in the course of which the alleged violations were committed".
      - text: Proof that the United States had financed the contras, whatever the degree of control it had over any operations they carried out.
        why: Tempting because funding was proved, but the Court held that even preponderant or decisive financing, training and supplying were insufficient in themselves for attribution.
  - key: q402
    type: mcq
    concept: effective-control-and-private-conduct
    difficulty: 3
    stem: Which combination of US conduct did the ICJ in Nicaragua hold was still insufficient in itself to attribute the contras' acts to the United States?
    options:
      - text: Financing, organising, training, supplying and equipping the contras, selecting their targets and planning the whole operation.
        correct: true
        why: Correct — the Court said US participation, "even if preponderant or decisive", in all of these was still insufficient in itself; effective control of the operations was required.
      - text: Issuing specific instructions to the contras for each operation in which violations were committed.
        why: Tempting because this is in the list of US support, but specific instructions for each operation would actually satisfy art 8; the Court found insufficient evidence of that.
      - text: Occupying Nicaraguan territory with US troops who commanded the contras directly in the field.
        why: Tempting because it sounds like strong involvement, but the materials describe no US occupation; the list was financing, training, supplying, targeting and planning.
  - key: q403
    type: mcq
    concept: effective-control-and-private-conduct
    difficulty: 2
    stem: What test did the ICTY Appeals Chamber develop in Tadić (1999)?
    options:
      - text: The complete dependence test, for treating a group as a de facto state organ in all circumstances.
        why: Tempting because complete dependence is a real test, but it comes from the ICJ's Genocide judgment (paras 392–393) on de facto organs, not from Tadić.
      - text: The effective control test, applied more strictly than in Nicaragua to each individual soldier's conduct.
        why: Tempting because effective control dominates this topic, but Tadić relaxed the threshold rather than tightening it; it is the case that departed from effective control.
      - text: The overall control test.
        correct: true
        why: Correct — the Appeals Chamber held the degree of control may vary and developed the less demanding "overall control" test, suited to areas like international humanitarian and criminal law.
  - key: q404
    type: mcq
    concept: effective-control-and-private-conduct
    difficulty: 3
    stem: Why did the ICJ in the Genocide case (2007) reject the overall control test for state responsibility?
    options:
      - text: Because overall control had never been used by any international court or tribunal before the ICJ's 2007 judgment.
        why: Tempting because the test was newer, but the ICTY had applied it in Tadić in 1999; the ICJ rejected it on principle, not for novelty.
      - text: Because the Genocide Convention itself sets out a special test that displaces art 8.
        why: Tempting because the case concerned the Genocide Convention, but the Court applied the customary rule reflected in art 8, not a special treaty test of attribution.
      - text: Because it broadens responsibility beyond the principle that a state answers only for its own conduct.
        correct: true
        why: Correct — the Court said overall control "stretches too far, almost to breaking point" the connection between a state's organs and its responsibility; a state is responsible only for its own conduct.
  - key: q405
    type: mcq
    concept: effective-control-and-private-conduct
    difficulty: 3
    contrasts-with:
      - attribution-to-the-state
    stem: Which pairing of case, court and test is correct?
    options:
      - text: Tadić (ICTY Appeals Chamber, 1999) — overall control; Genocide case (ICJ, 2007) — effective control.
        correct: true
        why: Correct — the ICTY Appeals Chamber in Tadić developed overall control; the ICJ in the Genocide case rejected it and reaffirmed Nicaragua's effective control test.
      - text: Nicaragua (ICTY, 1986) — overall control; Tadić (ICJ, 1999) — effective control.
        why: Tempting because the names are right, but courts and tests are swapped — Nicaragua was the ICJ's effective control test; Tadić was the ICTY Appeals Chamber's overall control test.
      - text: Genocide case (ICTY, 2007) — overall control, confirming and extending the Appeals Chamber's approach in Tadić.
        why: Tempting because the Genocide case discussed overall control, but it was the ICJ, and it rejected overall control in favour of effective control.
  - key: q406
    type: mcq
    concept: effective-control-and-private-conduct
    difficulty: 2
    stem: Under the "instructions" limb of art 8, what kind of instructions are required?
    options:
      - text: General instructions setting the group's broad objectives, such as overthrowing a foreign government.
        why: Tempting because broad objectives show alignment with the state, but the lecturer says instructions cannot be general and vague; they must relate to the specific conduct.
      - text: Specific instructions for each operation.
        correct: true
        why: Correct — the lecturer says instructions must relate to the very conduct in breach and be extremely specific, in relation to every action that violated international law; general, vague instructions are not enough.
      - text: Written instructions signed by a head of state or minister, whatever their content or level of detail.
        why: Tempting because formality seems to prove state involvement, but the materials focus on the specificity of the instructions for each operation, not on their form or signatory.
  - key: q407
    type: mcq
    concept: effective-control-and-private-conduct
    difficulty: 2
    stem: How are the "direction" and "control" limbs of art 8 treated today, according to the lecture?
    options:
      - text: As two strictly separate tests, either of which is enough by itself.
        why: Tempting because the text says "direction or control", but the lecturer says they were originally meant to be separate and are now assessed together by the courts.
      - text: They were meant to be separate, but courts now assess them together, requiring very strong control.
        correct: true
        why: Correct — the lecturer says direction and control were originally two separate items but courts now assess them together, requiring very strong control by the state over the group.
      - text: As a single test replaced entirely by overall control since Tadić, for all areas of international law.
        why: Tempting because Tadić lowered the threshold, but the ICJ in the Genocide case rejected overall control; effective control remains the test for state responsibility.
  - key: q408
    type: mcq
    concept: effective-control-and-private-conduct
    difficulty: 3
    stem: State X funds, trains and arms a rebel group in State Y and helps choose its targets, but gives no orders for any particular attack. The rebels massacre villagers. Applying Nicaragua, is the massacre attributable to X under art 8?
    options:
      - text: Yes, because X's support was preponderant or decisive in making the group effective.
        why: Tempting because the support was extensive, but Nicaragua held that even preponderant or decisive participation in financing, training, supplying and targeting is insufficient in itself.
      - text: Yes, because X has overall control of the group, which is enough under the Genocide case.
        why: Tempting because overall control fits these facts, but the Genocide case rejected overall control for state responsibility; it reaffirmed effective control.
      - text: Probably not — without effective control of the operation in which the massacre occurred, or specific instructions for it, the support is insufficient.
        correct: true
        why: Correct — on these facts X did not instruct or effectively control the particular operation; like the US in Nicaragua, its broad support does not meet the effective control threshold.
  - key: q409
    type: mcq
    concept: effective-control-and-private-conduct
    variant-of: q408
    difficulty: 3
    stem: State X's defence ministry orders a hired private militia to attack a particular village in State Y on a set date and directs the attack in real time. Is the attack attributable to X?
    options:
      - text: Yes — X gave specific instructions for, and exercised effective control over, the very operation.
        correct: true
        why: Correct — specific instructions for this operation and real-time direction satisfy both limbs of art 8 as interpreted in Nicaragua and the Genocide case.
      - text: No, because the militia is private and private conduct can never be attributed to a state.
        why: Tempting because the general rule is that states answer for their own conduct, but art 8 is the exception — private conduct is attributable on instructions or under effective control.
      - text: Only if the militia is also empowered by X's law to exercise elements of governmental authority under art 5.
        why: Tempting because art 5 is another route for non-organs, but art 8 does not require legal empowerment; instructions or effective control in fact are enough.
  - key: q410
    type: mcq
    concept: effective-control-and-private-conduct
    variant-of: q401
    difficulty: 2
    stem: Which phrase best captures the threshold set by the effective control test?
    options:
      - text: A low threshold, met by any substantial support.
        why: Tempting because the test concerns support for groups, but Nicaragua showed substantial support is not enough; the lecturer calls the threshold very, very high.
      - text: A very high threshold that many found too difficult to achieve.
        correct: true
        why: Correct — the lecturer calls effective control a very, very high threshold and says there was some backlash against the Court because many found it too difficult to achieve.
      - text: A flexible threshold that varies with the factual circumstances of each case and field of law.
        why: Tempting because flexibility was argued for, but that describes the Tadić approach (control may vary); the ICJ's effective control test is strict and uniform.
  - key: q411
    type: mcq
    concept: effective-control-and-private-conduct
    difficulty: 3
    stem: In Tadić, why did the ICTY Appeals Chamber think a less demanding test of control could be appropriate?
    options:
      - text: Because the degree of control may vary with the circumstances, and a lower threshold suits areas such as international humanitarian and criminal law.
        correct: true
        why: Correct — the Chamber said it "fails to see why in each and every circumstance international law should require a high threshold", and the lecturer links this to IHL and international criminal law.
      - text: Because the Genocide Convention expressly lowers the threshold for attribution in genocide cases.
        why: Tempting because genocide is involved in the later ICJ case, but Tadić rested on control varying with circumstances, not on any express rule in the Genocide Convention.
      - text: Because Nicaragua had been overruled by the UN General Assembly after the backlash.
        why: Tempting because there was backlash against Nicaragua, but the General Assembly did not overrule it; Tadić reasoned from the nature of control.
  - key: q412
    type: mcq
    concept: effective-control-and-private-conduct
    difficulty: 2
    stem: Which real-world question does the lecturer say brought attribution of private conduct "to the fore"?
    options:
      - text: Whether Iran could be held responsible for the students who stormed the US embassy in Tehran and held its staff.
        why: Tempting because Tehran involved private actors, but the lecture resolves it under art 11 (adoption) and does not describe it as the event that brought art 8 to the fore.
      - text: Whether Albania was responsible for mines laid by unknown persons in the Corfu Channel in 1946.
        why: Tempting because the minelayer was unknown, but Corfu Channel turned on Albania's own omission to warn; the lecturer ties the art 8 debate to 9/11.
      - text: Whether Afghanistan, under the Taliban, could be held responsible for Al-Qaeda's 9/11 attacks.
        correct: true
        why: Correct — the lecturer says the question came to the fore after 9/11 — could Afghanistan be responsible for the acts of Al-Qaeda, which operated mostly from its territory?
  - key: q413
    type: mcq
    concept: effective-control-and-private-conduct
    difficulty: 1
    stem: Which test represents "the law as it stands now" for attributing private conduct to a state?
    options:
      - text: Overall control, from the ICTY Appeals Chamber's judgment in Tadić in 1999.
        why: Tempting because Tadić is more recent than Nicaragua, but the ICJ rejected it in 2007; the lecturer says effective control is the law as it stands now.
      - text: Complete dependence, since the Genocide case merged art 4 and art 8 into one single test.
        why: Tempting because complete dependence also comes from the Genocide case, but it is the de facto organ test under art 4; art 8 remains a separate effective control test.
      - text: Effective control.
        correct: true
        why: Correct — after the ICJ's Genocide judgment (2007) rejected overall control, the lecturer says effective control is the law as it stands now, despite some disagreement.
  - key: q414
    type: mcq
    concept: effective-control-and-private-conduct
    difficulty: 3
    contrasts-with:
      - attribution-to-the-state
    stem: Students with no link to State Z seize a foreign embassy. Z neither instructed nor controlled them, but its leader later issues a decree approving and continuing the occupation. Which article attributes the conduct to Z?
    options:
      - text: Art 11 — Z acknowledged and adopted the conduct as its own after the event, as Iran did in Tehran.
        correct: true
        why: Correct — like Iran's decree and public endorsement in Tehran, Z's decree acknowledges and adopts the students' conduct; art 11 attributes it "if and to the extent that" it does so.
      - text: Art 8, because a decree is a form of instruction to the students.
        why: Tempting because a decree gives directions, but art 8 needs instructions or control in carrying out the conduct; an after-the-fact decree is acknowledgement, not instruction.
      - text: Art 4, because the students became de facto organs of Z by acting in support of its political aims.
        why: Tempting because the students ended up serving Z's aims, but de facto organ status requires complete dependence and is exceptional; adoption after the fact is art 11.
  - key: q415
    type: mcq
    concept: effective-control-and-private-conduct
    difficulty: 4
    contrasts-with:
      - attribution-to-the-state
    stem: How does treating a group as a de facto organ (Genocide case, paras 392–393) differ from attributing its conduct under art 8?
    options:
      - text: They are the same test expressed in two different paragraphs of the one judgment.
        why: Tempting because both come from the Genocide judgment, but the Court treated them separately — complete dependence for organ status, instructions or effective control for art 8.
      - text: A de facto organ acts in complete dependence, so all its conduct is the state's; art 8 attributes only conduct the state instructed or effectively controlled.
        correct: true
        why: Correct — complete dependence makes the group merely the state's instrument, equated with an organ (exceptionally); art 8 attributes only the specific conduct instructed or effectively controlled.
      - text: De facto organ status is based on the group's nationality; art 8 is based on where the conduct takes place.
        why: Tempting because nationality and territory ground jurisdiction (Week 5), but neither test turns on them; both look at the group's actual relationship with the state.
  - key: q416
    type: mcq
    concept: effective-control-and-private-conduct
    variant-of: q404
    difficulty: 3
    stem: A student argues that a state which exercised overall control over a paramilitary group should answer for all its violations. What would the ICJ's 2007 reasoning say?
    options:
      - text: That the argument is right, because Tadić's test binds the ICJ as the later decision of an international tribunal on the same question.
        why: Tempting because Tadić came after Nicaragua, but ICTY decisions do not bind the ICJ; in 2007 the ICJ rejected overall control for state responsibility.
      - text: That overall control stretches the link between a state's organs and its responsibility too far; effective control is required.
        correct: true
        why: Correct — the ICJ said overall control broadens responsibility well beyond the principle that a state answers only for its own conduct, stretching the connection "almost to breaking point".
      - text: That overall control suffices for genocide but not for any other violation, because genocide is a peremptory norm.
        why: Tempting because genocide is jus cogens, but the ICJ did not carve out such an exception; it applied effective control in a genocide case itself.
  - key: q417
    type: truefalse
    concept: effective-control-and-private-conduct
    set: quickfire
    statement: In Nicaragua, the ICJ held that US financing, training and equipping of the contras was enough to attribute their acts to the United States.
    answer: false
    why: False — the Court held that such participation, even if preponderant or decisive, was insufficient in itself; effective control of the operations in which violations occurred had to be proved.
  - key: q418
    type: truefalse
    concept: effective-control-and-private-conduct
    set: quickfire
    statement: In the Genocide case (2007), the ICJ rejected the ICTY's overall control test for attributing private conduct to a state.
    answer: true
    why: True — the ICJ said overall control stretches too far, almost to breaking point, the link between a state's organs and its responsibility, and applied effective control under art 8.
  - key: q419
    type: truefalse
    concept: effective-control-and-private-conduct
    set: quickfire
    statement: Under art 8, general and vague instructions to a private group are enough to attribute its later conduct to the state.
    answer: false
    why: False — the lecturer says instructions must be extremely specific, relating to the very conduct in breach and to every action in violation of international law.
  - key: q420
    type: short
    concept: effective-control-and-private-conduct
    difficulty: 4
    prompt: Trace the development of the test for attributing the conduct of private groups to a state under art 8 ARSIWA, from Nicaragua to the Genocide case, and state the current law.
    model: |
      Art 8 ARSIWA attributes to a state the conduct of a person or group "in fact acting on the instructions of, or
      under the direction or control of, that State in carrying out the conduct". Instructions must be specific to
      each operation; direction or control, originally separate, are now assessed together. In Nicaragua (1986), the
      US had financed, organised, trained, supplied and equipped the contras, helped select targets and planned the
      whole operation, but the ICJ held that this, "even if preponderant or decisive", was insufficient: the US would
      need "effective control of the military or paramilitary operations in the course of which the alleged violations
      were committed" (para 115). This very high threshold drew criticism. About ten years later, in Tadić (1999), the
      ICTY Appeals Chamber said the degree of control may vary with the circumstances (para 117) and applied a less
      demanding "overall control" test, suited to international humanitarian and criminal law. In the Genocide case
      (2007), the ICJ rejected overall control: it broadens responsibility beyond the principle that a state is
      responsible only for its own conduct and "stretches too far, almost to breaking point" the link between a
      state's organs and its responsibility. Effective control is the law as it stands now.
    rubric:
      - id: r1
        criterion: States art 8 and its two limbs
        marks: 2
        top-band: Quotes art 8 and explains specific instructions and effective direction or control, now assessed together.
        margin-note: What exactly must the instructions relate to?
        authorities:
          - arsiwa-art-8
      - id: r2
        criterion: Explains Nicaragua accurately
        marks: 3
        top-band: Lists the US support found insufficient and quotes the para 115 effective control formulation.
        margin-note: Show why so much support still failed the test.
        authorities: []
      - id: r3
        criterion: Explains Tadić and its rationale
        marks: 2
        top-band: Identifies the ICTY Appeals Chamber, overall control, and the reasoning that control may vary by context.
        margin-note: Why did the ICTY think a lower threshold was acceptable?
        authorities: []
      - id: r4
        criterion: Explains the Genocide case and states the current law
        marks: 3
        top-band: Gives the ICJ's reason for rejecting overall control and states effective control is the current law.
        margin-note: Good — now say clearly which test an exam answer should apply.
        authorities: []
  - key: q501
    type: mcq
    concept: circumstances-precluding-wrongfulness
    difficulty: 1
    set: pretest
    stem: Which of the following is NOT one of the six circumstances precluding wrongfulness in arts 20–25 ARSIWA?
    options:
      - text: Distress, where there is no other reasonable way to save lives in the author's care.
        why: Tempting to exclude because it sounds like force majeure, but distress is art 24 and is one of the six; it concerns saving the author's life or the lives of those in its care.
      - text: Lawful countermeasures taken against a state responsible for a prior wrongful act, to induce it to comply.
        why: Tempting to exclude because countermeasures are themselves breaches, but art 22 makes lawful countermeasures one of the six grounds precluding wrongfulness.
      - text: The conduct being lawful under the state's own internal law, as confirmed by its highest court.
        correct: true
        why: Correct — domestic legality is not a ground at all; the six are consent, self-defence, lawful countermeasures, force majeure, distress and necessity, and internal law is irrelevant to breach.
  - key: q502
    type: mcq
    concept: circumstances-precluding-wrongfulness
    difficulty: 2
    stem: According to the lecture, which requirements must consent under art 20 meet to preclude wrongfulness?
    options:
      - text: Valid, freely given, clearly expressed before or at the time, and the act must stay within its limits.
        correct: true
        why: Correct — consent must be valid, given freely without coercion, clearly expressed before or at the time with no ambiguity, and it covers the act only to the extent it remains within its limits.
      - text: It must be given after the act, in writing, by the head of state of the consenting state.
        why: Tempting because formality suggests validity, but the lecture requires consent before or at the time of the act, and says nothing about writing or who signs.
      - text: It may be implied from silence, provided the consenting state later benefits from the act that was done on its territory.
        why: Tempting because silence can matter in some areas of international law, but the lecture stresses there must be no ambiguity; consent must be clearly expressed, not inferred.
  - key: q503
    type: mcq
    concept: circumstances-precluding-wrongfulness
    difficulty: 2
    stem: Why must art 21 ARSIWA (self-defence) be read with art 51 of the UN Charter?
    options:
      - text: Because art 51 allows self-defence against any internationally wrongful act, not just an armed attack on a member state.
        why: Tempting because self-defence responds to a wrong, but art 51 speaks of an armed attack against a Member of the United Nations; not every wrongful act qualifies.
      - text: Because art 21 requires the measure to be taken in conformity with the Charter, so an armed attack must first occur.
        correct: true
        why: Correct — art 21 requires a lawful measure of self-defence taken in conformity with the Charter, i.e. art 51, so the state must prove an armed attack against it before acting.
      - text: Because art 51 lists the only states that may lawfully invoke self-defence, namely the permanent members of the Security Council.
        why: Tempting because the Security Council features in the Charter, but art 51 preserves the "inherent right" of every member; there is no list of permitted states.
  - key: q504
    type: mcq
    concept: circumstances-precluding-wrongfulness
    difficulty: 2
    stem: Under art 49(1) ARSIWA, what is the only legitimate purpose of a countermeasure?
    options:
      - text: To induce the responsible state to comply with its obligations.
        correct: true
        why: Correct — art 49(1) says an injured state may only take countermeasures against a responsible state in order to induce that state to comply with its obligations.
      - text: To punish the responsible state for its wrongful act.
        why: Tempting because countermeasures respond to a wrong, but the lecturer says they must have no underlying motive or agenda other than inducing compliance; punishment is not their purpose.
      - text: To compensate the injured state for its loss by seizing an equivalent value from the responsible state's assets.
        why: Tempting because injured states want reparation, but compensation is a consequence under art 36; countermeasures exist only to induce the wrongdoer to comply.
  - key: q505
    type: mcq
    concept: circumstances-precluding-wrongfulness
    difficulty: 3
    stem: In Gabčíkovo-Nagymaros, why was Czechoslovakia's diversion of the Danube not a lawful countermeasure?
    options:
      - text: Because Hungary had not committed any breach of the treaty, so there was nothing to respond to.
        why: Tempting because countermeasures need a prior wrong, but the ICJ accepted that Hungary's refusal to complete the project was a breach; the problem was the response.
      - text: Because diverting a river always involves the use of force, which countermeasures may never involve.
        why: Tempting because countermeasures must not breach jus cogens such as the use of force, but the diversion was not a use of force; it failed for disproportionality.
      - text: Because it was disproportionate — by unilaterally assuming control of a shared resource it deprived Hungary of its equitable share, with ecological impact.
        correct: true
        why: Correct — the ICJ said the effect of countermeasures is an important consideration; taking unilateral control of the shared Danube and its ecological impact made the diversion disproportionate.
  - key: q506
    type: mcq
    concept: circumstances-precluding-wrongfulness
    difficulty: 3
    stem: Which of these is NOT one of the conditions on countermeasures summarised from arts 50–53 ARSIWA?
    options:
      - text: They must not breach jus cogens obligations such as the prohibition on the use of force.
        why: Tempting to pick because it limits countermeasures sharply, but it is a real condition (arts 50, 53); countermeasures cannot involve force or breach certain human rights.
      - text: They must be proportional, assessed on a case-by-case basis as in Gabčíkovo-Nagymaros.
        why: Tempting to pick because proportionality is judged case by case, but it is a real condition under art 51, applied in Gabčíkovo-Nagymaros.
      - text: They must first be approved by the UN Security Council.
        correct: true
        why: Correct — nothing in the materials requires Security Council approval; the conditions are no breach of jus cogens, proportionality, and procedural steps like negotiation and notification.
      - text: They must be terminated once the wrongful act has ceased, after negotiation and notification.
        why: Tempting to pick because it is procedural, but it is a real condition (arts 52, 53) — negotiate, notify, give a chance to cease, and stop once the wrong has ceased.
  - key: q507
    type: mcq
    concept: circumstances-precluding-wrongfulness
    difficulty: 2
    stem: What are measures called that fail the conditions for lawful countermeasures, and do they preclude wrongfulness?
    options:
      - text: Reprisals; no.
        correct: true
        why: Correct — the lecturer says countermeasures that do not meet the conditions could be deemed reprisals, and reprisals do not constitute grounds precluding wrongfulness.
      - text: Retorsions, and yes, they still preclude wrongfulness because they respond to a prior wrong.
        why: Tempting because retorsion is a familiar term, but the lecture calls failed countermeasures reprisals and says they do not preclude wrongfulness.
      - text: Sanctions, and yes, provided they were notified to the responsible state in advance of being taken.
        why: Tempting because notification is one procedural step, but meeting one step does not cure a failed countermeasure; the lecture calls such measures reprisals, which are not a defence.
  - key: q508
    type: mcq
    concept: circumstances-precluding-wrongfulness
    difficulty: 2
    stem: A catastrophic tsunami damages State A's offshore nuclear facility, causing transboundary environmental harm. A did nothing to contribute to the risk. Which ground is most likely to succeed?
    options:
      - text: Necessity, because protecting the nuclear facility is an essential interest of A.
        why: Tempting because an essential interest is at stake, but necessity concerns a deliberate choice to breach an obligation; here the harm was involuntary, which is force majeure.
      - text: Force majeure — an irresistible, unforeseen event beyond A's control making performance materially impossible.
        correct: true
        why: Correct — the lecturer gives this very example; force majeure covers involuntary, unintentional conduct beyond the state's control, and no state should be obliged to perform the impossible.
      - text: Distress, because A's officials at the facility had to act urgently to save their own lives and the lives of those in their care.
        why: Tempting because lives may be at risk, but distress concerns a person choosing to breach to save lives; the harm here was caused by the tsunami itself, not a choice.
  - key: q509
    type: mcq
    concept: circumstances-precluding-wrongfulness
    variant-of: q508
    difficulty: 3
    stem: State B builds a dam in a known flood zone, ignoring warnings, and expressly accepts the risk. A flood breaks the dam and damages State C. Can B rely on force majeure?
    options:
      - text: Yes, because floods are natural events and always count as force majeure.
        why: Tempting because natural disasters are the classic example, but force majeure will not stand if the invoking state contributed to the situation or assumed the risk.
      - text: No — B contributed to the situation and assumed the risk, which rules force majeure out.
        correct: true
        why: Correct — the lecturer says force majeure will definitely not be recognised where the invoking state has contributed to the situation or has assumed the risk of it occurring.
      - text: Yes, but only if B also shows that its conduct did not seriously impair an essential interest of C or of the international community as a whole.
        why: Tempting because this language is in the ARSIWA text, but it belongs to necessity (art 25(b)), not force majeure; the decisive point is B's contribution and assumption of risk.
  - key: q510
    type: mcq
    concept: circumstances-precluding-wrongfulness
    difficulty: 3
    stem: What do the Serbian Loans case and the Rainbow Warrior arbitration show about force majeure?
    options:
      - text: That war automatically excuses non-payment of debts.
        why: Tempting because war is extreme, but in Serbian Loans the PCIJ refused to accept that the First World War made repayment impossible; difficulty is not enough.
      - text: That force majeure is only available to states that have consented in advance to arbitration of the dispute.
        why: Tempting because Rainbow Warrior was an arbitration, but consent to arbitration is irrelevant to the ground itself; the cases show how high the threshold is.
      - text: That the threshold is very high — "absolute and material impossibility".
        correct: true
        why: Correct — the PCIJ refused the war-based claim in Serbian Loans, and the Rainbow Warrior tribunal said the test is "absolute and material impossibility"; the standard of proof is very high.
  - key: q511
    type: mcq
    concept: circumstances-precluding-wrongfulness
    difficulty: 2
    stem: A military aircraft of State D, caught in a violent storm and running out of fuel, lands without permission in State E to save its crew. Which ground is most apt?
    options:
      - text: Distress — no other reasonable way of saving the lives of the persons in the author's care.
        correct: true
        why: Correct — art 24 historically covers ships or aircraft in distress crossing a frontier because of bad weather, where the author has no other reasonable way to save lives in its care.
      - text: Consent, because E would certainly have agreed if asked in advance.
        why: Tempting because E might well have agreed, but consent must be actually and clearly given before or at the time; hypothetical consent is not consent.
      - text: Self-defence, because the storm was an armed attack against the aircraft and its crew for the purposes of art 51.
        why: Tempting because the crew were in danger, but self-defence requires an armed attack by a state; a storm is not an armed attack under art 51 of the UN Charter.
  - key: q512
    type: mcq
    concept: circumstances-precluding-wrongfulness
    difficulty: 3
    stem: In which situations does art 24(2) say distress cannot be invoked?
    options:
      - text: Where the lives saved were those of private persons rather than state officials.
        why: Tempting because distress is a state ground, but art 24 covers the author's life "or the lives of other persons entrusted to the author's care"; private persons can be included.
      - text: Where the distress is due, alone or with other factors, to the invoking state's conduct, or the act is likely to create a comparable or greater peril.
        correct: true
        why: Correct — art 24(2) excludes distress caused (alone or in combination) by the invoking state's own conduct, and acts likely to create a comparable or greater peril.
      - text: Where the state did not notify the other state before crossing its frontier.
        why: Tempting because notice is a countermeasures requirement, but art 24(2)'s exclusions are self-induced distress and comparable or greater peril, not failure to notify.
  - key: q513
    type: mcq
    concept: circumstances-precluding-wrongfulness
    difficulty: 3
    stem: According to the ICJ in Gabčíkovo-Nagymaros (as explained in the lecture), which set of conditions must a state show to rely on necessity?
    options:
      - text: An essential interest, a grave and imminent peril, breach the only way, no serious impairment of another's essential interest, no contribution.
        correct: true
        why: Correct — the lecture lists five cumulative criteria from Gabčíkovo-Nagymaros; necessity can only be invoked exceptionally.
      - text: An armed attack against the state, a response taken in conformity with the UN Charter, and an immediate report of the measures to the Security Council.
        why: Tempting because these are strict conditions, but they describe self-defence (art 21 with art 51 of the Charter), not necessity under art 25.
      - text: An irresistible force, an unforeseen event beyond control, and material impossibility of performance.
        why: Tempting because these also excuse non-performance, but they are the elements of force majeure under art 23, where the conduct is involuntary rather than chosen.
  - key: q514
    type: mcq
    concept: circumstances-precluding-wrongfulness
    difficulty: 3
    stem: In the Wall advisory opinion, why did necessity not preclude the wrongfulness of Israel's construction of the barrier?
    options:
      - text: Because Israel had not proved any essential interest at all in protecting its security.
        why: Tempting because necessity starts with an essential interest, but the lecture's reason is different — there were other means to protect Israel's interests.
      - text: Because necessity can never be invoked in an advisory opinion.
        why: Tempting because advisory opinions differ from contentious cases, but the Court did assess necessity; it failed on the facts because it was not the only way.
      - text: Because the construction was not the only way — there were other means to protect those essential interests than building the barrier along that route.
        correct: true
        why: Correct — the ICJ found the wall was not necessary to Israel's essential interests, since there were other means than building the barrier along the specific route chosen.
  - key: q515
    type: mcq
    concept: circumstances-precluding-wrongfulness
    difficulty: 2
    stem: State F commits genocide against a group it claims was about to commit genocide against it, calling it a countermeasure. What does art 26 ARSIWA say?
    options:
      - text: The plea may succeed if the response is proportionate to the threat faced.
        why: Tempting because proportionality governs countermeasures, but art 26 means no circumstance precluding wrongfulness can excuse breaching a peremptory norm, however proportionate.
      - text: The plea succeeds only if F first notified the other state and offered to negotiate before acting against the group.
        why: Tempting because notification and negotiation are countermeasures procedure, but procedure cannot save conduct that breaches a peremptory norm under art 26.
      - text: No ground excuses breach of a peremptory norm.
        correct: true
        why: Correct — art 26 says nothing in the chapter precludes the wrongfulness of an act contrary to a peremptory norm; the lecturer's example is that a state cannot use "counter-genocide".
  - key: q516
    type: mcq
    concept: circumstances-precluding-wrongfulness
    difficulty: 4
    contrasts-with:
      - framework-of-state-responsibility
    stem: What best distinguishes force majeure from necessity?
    options:
      - text: Force majeure makes performance materially impossible and the conduct involuntary; necessity is a deliberate breach, the only way to protect an essential interest against grave and imminent peril.
        correct: true
        why: Correct — force majeure covers involuntary conduct beyond the state's control; necessity involves choosing to breach a lesser obligation as the only way to avert a grave and imminent peril.
      - text: Force majeure applies only to treaty obligations; necessity applies only to customary obligations.
        why: Tempting because the grounds differ, but neither is limited by the source of the obligation; art 12 makes the source irrelevant throughout.
      - text: They are the same ground; ARSIWA simply uses two labels for one test.
        why: Tempting because both excuse non-performance in emergencies, but they are separate articles (23 and 25) with different elements and thresholds.
  - key: q517
    type: truefalse
    concept: circumstances-precluding-wrongfulness
    set: quickfire
    statement: Reliance on consent to justify a breach of the prohibition on the use of force is unsettled and controversial.
    answer: true
    why: True — the lecturer says consent commonly precludes wrongfulness (aircraft in foreign airspace, rescue at sea), but relying on it to breach the peremptory prohibition on force is quite controversial.
  - key: q518
    type: truefalse
    concept: circumstances-precluding-wrongfulness
    set: quickfire
    statement: A lawful countermeasure may involve the use of force if it is proportionate to the prior wrongful act.
    answer: false
    why: False — countermeasures must not breach jus cogens obligations such as the prohibition on the use of force (arts 50, 53), however proportionate they are.
  - key: q519
    type: truefalse
    concept: circumstances-precluding-wrongfulness
    set: quickfire
    statement: Art 25 is phrased in the negative ("may not be invoked … unless") to emphasise that necessity is exceptional.
    answer: true
    why: True — the lecturer points out the negative construction is deliberate, to emphasise necessity's exceptional character and the need to interpret it narrowly.
  - key: q520
    type: short
    concept: circumstances-precluding-wrongfulness
    difficulty: 3
    prompt: Using Gabčíkovo-Nagymaros, explain the conditions for lawful countermeasures and for necessity, and why each failed or would fail on the facts.
    model: |
      Hungary and Czechoslovakia agreed by treaty to build a joint system of locks on the Danube. In 1989 Hungary
      stopped work over ecological concerns; Czechoslovakia diverted the Danube into its territory and, from October
      1992, dammed the river. Countermeasures (art 22) preclude wrongfulness only if taken in accordance with arts
      49–53: against a state responsible for a wrongful act, to induce it to comply (art 49(1)); not breaching jus
      cogens (arts 50, 53); proportionate, assessed case by case (art 51); and after procedural steps — negotiation,
      notification, a chance to cease — ending when the wrong ceases (arts 52, 53). Hungary's refusal to complete the
      project was a breach, so a response was possible, but by unilaterally assuming control of a shared resource
      Czechoslovakia deprived Hungary of its equitable share, and with the ecological impact this was
      disproportionate. Necessity (art 25) is framed in the negative and is exceptional. The Court required an
      essential interest, threatened by a grave and imminent peril; that breach was the only way to safeguard it;
      no serious impairment of another state's essential interest; and no contribution by the invoking state. These
      cumulative conditions are rarely met, and failing any one defeats the plea.
    rubric:
      - id: r1
        criterion: Sets out the facts accurately
        marks: 1
        top-band: Treaty, Hungary's suspension in 1989, Czechoslovakia's diversion and damming in 1992.
        margin-note: Keep the facts tight — who breached first?
        authorities: []
      - id: r2
        criterion: States the conditions for countermeasures
        marks: 3
        top-band: Purpose (art 49(1)), jus cogens limit, proportionality, procedural steps and termination.
        margin-note: Good list — which condition did the ICJ actually rely on?
        authorities:
          - arsiwa-art-22
          - arsiwa-arts-49-53
      - id: r3
        criterion: Applies proportionality to the diversion
        marks: 2
        top-band: Explains unilateral control of a shared resource, loss of equitable share and ecological impact.
        margin-note: Why was it disproportionate, not just harsh?
        authorities: []
      - id: r4
        criterion: States and explains the necessity conditions
        marks: 3
        top-band: Five cumulative criteria, the negative phrasing and the exceptional character of the plea.
        margin-note: Note art 25's negative wording — it matters.
        authorities:
          - arsiwa-art-25
  - key: q601
    type: mcq
    concept: cessation-and-reparation
    difficulty: 1
    set: pretest
    stem: Once an internationally wrongful act is established and no ground precludes wrongfulness, what two basic consequences arise?
    options:
      - text: Suspension of the responsible state's treaty rights and expulsion from the UN.
        why: Tempting because these sound like serious sanctions, but ARSIWA's basic consequences are cessation (with non-repetition) and reparation; suspension and expulsion are not among them.
      - text: Cessation of the conduct (and non-repetition), and the obligation to make full reparation.
        correct: true
        why: Correct — the lecture names two basic consequences — the obligation to cease the unlawful conduct and not repeat it (art 30), and the obligation to make full reparation (art 31).
      - text: A formal apology from the head of state, followed by a Security Council resolution confirming the breach and fixing the damages.
        why: Tempting because an apology is a form of satisfaction, but it is only one form of reparation; the Security Council plays no part in the basic consequences under ARSIWA.
  - key: q602
    type: mcq
    concept: cessation-and-reparation
    difficulty: 2
    stem: Under art 30 ARSIWA, when must the responsible state offer assurances and guarantees of non-repetition?
    options:
      - text: In every case, whether or not the wrongful act is continuing or likely to recur in future.
        why: Tempting because non-repetition sounds universal, but art 30(b) requires assurances and guarantees only "if circumstances so require".
      - text: If circumstances so require.
        correct: true
        why: Correct — art 30(b) obliges the state to offer appropriate assurances and guarantees of non-repetition "if circumstances so require", as the ICJ required of Israel in the Wall opinion.
      - text: Only if the injured state first demands them in writing within a reasonable time after the wrongful act has ended.
        why: Tempting because invocation involves demands, but art 30(b) contains no written-demand requirement; the test is whether circumstances require assurances.
  - key: q603
    type: mcq
    concept: cessation-and-reparation
    difficulty: 2
    stem: What, according to Factory at Chorzów (PCIJ, 1928), is the purpose of reparation?
    options:
      - text: To punish the wrongdoing state in proportion to its fault.
        why: Tempting because damages can feel punitive, but Chorzów frames reparation as restorative, not punitive; fault is not the measure.
      - text: To pay a symbolic sum recognising the wrong.
        why: Tempting because satisfaction can be symbolic, but Chorzów sets the goal of full reparation — undoing the consequences, not a token payment.
      - text: As far as possible, to wipe out all the consequences of the illegal act and re-establish the situation which would, in all probability, have existed had it not been committed.
        correct: true
        why: Correct — Chorzów says reparation must, as far as possible, wipe out all the consequences of the illegal act and re-establish the situation that would in all probability have existed.
  - key: q604
    type: mcq
    concept: cessation-and-reparation
    difficulty: 2
    stem: Under art 31(2), what does "injury" include?
    options:
      - text: Any damage, whether material or moral, caused by the wrongful act.
        correct: true
        why: Correct — art 31(2) says injury includes any damage, whether material or moral, caused by the internationally wrongful act of a state.
      - text: Only material damage that can be measured in money.
        why: Tempting because compensation covers only material damage, but art 31(2) defines injury more widely, including moral damage — which is repaired by satisfaction.
      - text: Only damage suffered by the injured state itself, never damage to its nationals or to any private persons or companies within it.
        why: Tempting because reparation is owed between states, but art 31(2) speaks of "any damage"; in the Wall opinion, compensation was owed to affected natural and legal persons.
  - key: q605
    type: mcq
    concept: cessation-and-reparation
    difficulty: 1
    stem: Which are the three forms of reparation under ARSIWA, in the order the slides give them?
    options:
      - text: Cessation (art 30), non-repetition (art 30) and reparation (art 31).
        why: Tempting because these are all consequences, but cessation and non-repetition sit beside reparation in art 30; the three forms of reparation are in arts 35–37.
      - text: Restitution (art 35), compensation (art 36) and satisfaction (art 37).
        correct: true
        why: Correct — the slides list three forms of reparation — restitution (art 35), compensation (art 36) and satisfaction (art 37).
      - text: Countermeasures (art 22), compensation (art 36) and an apology made publicly by the responsible state's government.
        why: Tempting because compensation and apology appear, but countermeasures are a ground precluding wrongfulness, not a form of reparation; and an apology is one kind of satisfaction.
  - key: q606
    type: mcq
    concept: cessation-and-reparation
    difficulty: 2
    stem: State G unlawfully seizes a cultural artefact owned by State H and still holds it undamaged. What is the primary form of reparation?
    options:
      - text: Restitution in kind.
        correct: true
        why: Correct — restitution is in-kind reparation, the lecturer's example being the return of property; it is available because the artefact is undamaged.
      - text: Compensation, because money is always the preferred form of reparation in international law.
        why: Tempting because compensation is common, but it comes in where restitution is not possible; here the property is intact and can be returned.
      - text: Satisfaction, by an apology from State G's foreign minister, because the artefact has cultural value.
        why: Tempting because cultural value suggests moral damage, but satisfaction repairs moral injury; the loss of the property itself is repaired by returning it.
  - key: q607
    type: mcq
    concept: cessation-and-reparation
    variant-of: q606
    difficulty: 3
    stem: State G unlawfully seized a cultural artefact owned by State H, and the artefact is then destroyed while in G's hands. What does the lecture say happens to reparation?
    options:
      - text: Reparation lapses entirely, because the property no longer exists.
        why: Tempting because restitution is now impossible, but the duty of full reparation remains; the lecture says compensation takes over where restitution is not possible.
      - text: G must apologise instead, since satisfaction replaces restitution.
        why: Tempting because satisfaction is another form, but it repairs moral damage; the material loss of destroyed property is repaired by compensation.
      - text: Instead of restitution, G will have to compensate H — usually by a monetary sum covering the material damage that is financially assessable.
        correct: true
        why: Correct — where the property has been damaged or destroyed, restitution is not possible, so the state must compensate, often by a monetary payment covering financially assessable material damage.
  - key: q608
    type: mcq
    concept: cessation-and-reparation
    difficulty: 3
    contrasts-with:
      - circumstances-precluding-wrongfulness
    stem: Which form of reparation repairs moral damage under ARSIWA, as explained in the lecture?
    options:
      - text: Compensation, because moral damage can be priced like any other harm.
        why: Tempting because money repairs much harm, but the lecture says compensation covers only material damage that is financially assessable, not moral damage.
      - text: Restitution, because restoring the previous situation always repairs moral harm too, and so no other form of reparation will be needed.
        why: Tempting because restitution restores the prior position, but the lecture assigns moral damage specifically to satisfaction; restitution concerns returning things in kind.
      - text: Satisfaction — for example an apology, an expression of regret, or a court judgment declaring the conduct wrongful.
        correct: true
        why: Correct — the lecturer says moral damages are repaired through satisfaction, which can be an apology, an expression of regret or a court's judgment that the conduct was wrongful.
  - key: q609
    type: mcq
    concept: cessation-and-reparation
    difficulty: 2
    stem: What did the ICJ require of Israel by way of cessation and reparation in the Wall advisory opinion (2004)?
    options:
      - text: To stop construction, dismantle parts already built, and compensate affected persons or return land.
        correct: true
        why: Correct — the ICJ required Israel to cease construction and dismantle the built portions, and to compensate natural or legal persons for damage, returning land or compensating.
      - text: To pay a single lump sum to the UN, with no obligation to stop building.
        why: Tempting because compensation was part of the answer, but the Court required cessation too — stopping construction and dismantling what had been built.
      - text: To apologise publicly and hold a referendum in the Occupied Palestinian Territory on whether the wall should remain standing.
        why: Tempting because satisfaction can involve an apology, but the materials record cessation, dismantling and compensation, and nothing about a referendum.
  - key: q610
    type: mcq
    concept: cessation-and-reparation
    difficulty: 2
    stem: In the Chagos advisory opinion (2019), what form did the consequences of the UK's wrongful act take?
    options:
      - text: The UK was to pay compensation to the United States for the loss of its military base on the islands.
        why: Tempting because a US base is part of the facts, but the Court's conclusion concerned the UK and Mauritius; the US was not owed anything.
      - text: End its administration and return the islands to Mauritius as rapidly as possible.
        correct: true
        why: Correct — the ICJ found the UK's continued administration wrongful; the UK had to end its administration and return the Chagos Archipelago to Mauritius as rapidly as possible.
      - text: The UK was to apologise to Mauritius but could keep administering the archipelago indefinitely under the 1965 agreement.
        why: Tempting because the 1965 agreement was part of the history, but the Court required the administration to end and the islands to be returned, not merely an apology.
  - key: q611
    type: mcq
    concept: cessation-and-reparation
    difficulty: 3
    stem: Why does the lecture say monetary compensation cannot repair every injury covered by art 31?
    options:
      - text: Because compensation is available only between states, never for losses to persons.
        why: Tempting because reparation is owed between states, but the Wall opinion required compensation for natural and legal persons; the limit lies elsewhere.
      - text: Because compensation covers only material damage that is financially assessable, while art 31(2) injury also includes moral damage, which is repaired through satisfaction.
        correct: true
        why: Correct — the lecture says compensation only covers financially assessable material damage; moral damage, part of art 31(2) injury, is repaired by satisfaction instead.
      - text: Because art 36 caps compensation at the value of the property.
        why: Tempting because compensation often replaces property, but the materials mention no cap; the limit is the kind of damage compensation covers.
  - key: q612
    type: mcq
    concept: cessation-and-reparation
    difficulty: 2
    stem: What does art 30(a) ARSIWA require of the responsible state?
    options:
      - text: To pay compensation within 30 days.
        why: Tempting because payment feels like the first step, but art 30(a) is about stopping the conduct; compensation is a form of reparation under art 36.
      - text: To refer the dispute to the International Court of Justice for a binding ruling on the breach.
        why: Tempting because the ICJ decides many of these cases, but art 30(a) imposes no duty to litigate; it simply requires a continuing wrongful act to stop.
      - text: To cease that act, if it is continuing.
        correct: true
        why: Correct — art 30(a) obliges the responsible state to cease the internationally wrongful act, if it is continuing; the lecturer calls this relatively straightforward.
  - key: q613
    type: mcq
    concept: cessation-and-reparation
    variant-of: q608
    difficulty: 3
    stem: State J's warship insults State K's flag and detains K's diplomats for a day, causing no financial loss. Which form of reparation best fits?
    options:
      - text: Satisfaction, such as an apology, an expression of regret, or a judgment declaring the conduct wrongful.
        correct: true
        why: Correct — with no financially assessable loss, the injury is moral, and moral damage is repaired through satisfaction such as an apology, regret or a declaratory judgment.
      - text: Restitution, by returning the diplomats' belongings and the day that was lost.
        why: Tempting because restitution restores the prior position, but the harm here is moral, not the loss of property; lost time cannot be returned in kind.
      - text: Compensation calculated by multiplying the diplomats' salaries by the number of hours they were detained on board.
        why: Tempting because it turns the harm into money, but compensation covers only financially assessable material damage; moral injury to the state is repaired by satisfaction.
  - key: q614
    type: mcq
    concept: cessation-and-reparation
    variant-of: q605
    difficulty: 2
    stem: Which is an example of satisfaction?
    options:
      - text: The return of seized property to its owner state.
        why: Tempting because returning property repairs harm, but that is restitution in kind (art 35), not satisfaction.
      - text: An apology.
        correct: true
        why: Correct — the lecture says satisfaction can be an apology, an expression of regret, or a court's judgment stipulating that the conduct was wrongful.
      - text: A payment of money calculated to cover the market value of a damaged vessel.
        why: Tempting because payment is common, but money for financially assessable material damage is compensation (art 36), not satisfaction.
  - key: q615
    type: mcq
    concept: cessation-and-reparation
    difficulty: 3
    contrasts-with:
      - circumstances-precluding-wrongfulness
    stem: A student says, "State L proved necessity, so it must still pay reparation for the breach." Where is the error?
    options:
      - text: The consequences of cessation and reparation arise where there is an internationally wrongful act and no circumstance precluding wrongfulness; a successful plea precludes the wrongfulness.
        correct: true
        why: Correct — the lecture says the consequences follow where we have an internationally wrongful act and no circumstance precluding wrongfulness; a successful plea removes the wrongfulness on which they depend.
      - text: There is no error; reparation is always owed once a breach is proved.
        why: Tempting because reparation follows a wrongful act, but the premise matters — the consequences in arts 30–31 arise once wrongfulness is established with no ground precluding it.
      - text: The error is in calling necessity a ground at all.
        why: Tempting because necessity is so narrow, but it is one of the six grounds (art 25); the error lies in applying the consequences after a successful plea.
  - key: q616
    type: mcq
    concept: cessation-and-reparation
    variant-of: q610
    difficulty: 3
    stem: What background facts did the lecture give for the Chagos advisory opinion?
    options:
      - text: The UK conquered the islands from Mauritius by force in 2017, prompting an immediate Security Council resolution condemning the invasion and demanding withdrawal.
        why: Tempting because 2017 appears in the facts, but that was when the General Assembly requested the opinion; there was no conquest and no Security Council resolution.
      - text: Mauritius sold the archipelago to the UK after independence, and later regretted the sale.
        why: Tempting because some agreement was involved, but the materials describe detachment before independence and a finding of wrongfulness, not a sale after independence.
      - text: In 1965 the UK detached the archipelago from Mauritius in independence negotiations, leased an island to the US, and deported the inhabitants.
        correct: true
        why: Correct — the lecture says the 1965 detachment was agreed in negotiations on independence; the UK declared a new British territory, leased an island to the US for a base, and deported the inhabitants.
  - key: q617
    type: truefalse
    concept: cessation-and-reparation
    set: quickfire
    statement: Under ARSIWA, monetary compensation covers moral damage as well as material damage.
    answer: false
    why: False — the lecture says compensation only covers material damage that is financially assessable; moral damage is repaired through satisfaction, such as an apology.
  - key: q618
    type: truefalse
    concept: cessation-and-reparation
    set: quickfire
    statement: The responsible state must make full reparation for the injury caused by its internationally wrongful act.
    answer: true
    why: True — art 31(1) imposes an obligation to make full reparation, and Chorzów says it must as far as possible wipe out all the consequences of the illegal act.
  - key: q619
    type: truefalse
    concept: cessation-and-reparation
    set: quickfire
    statement: In the Wall advisory opinion, the ICJ required Israel to offer appropriate assurances and guarantees of non-repetition.
    answer: true
    why: True — the slides quote the Wall opinion that Israel "must offer appropriate assurances and guarantees of non-repetition", illustrating art 30(b).
  - key: q620
    type: short
    concept: cessation-and-reparation
    difficulty: 3
    prompt: State M's navy unlawfully seizes and damages a State N research vessel, holds its crew for a week, and continues to patrol N's waters. Advise N on the consequences of M's internationally wrongful act.
    model: |
      Assuming the conduct is an attributable breach with no ground precluding wrongfulness, two basic consequences
      arise. First, under art 30 M must (a) cease the act if it is continuing — the patrols must stop — and (b) offer
      appropriate assurances and guarantees of non-repetition if circumstances so require, as the ICJ required of
      Israel in the Wall opinion; continued patrolling suggests they are required here. Second, under art 31 M must
      make full reparation for the injury, which includes any damage, material or moral. The aim, per Factory at
      Chorzów, is to wipe out as far as possible all the consequences of the illegal act and restore the situation that
      would in all probability have existed. Restitution in kind (art 35) comes first: return the vessel. Because the
      vessel is damaged, restitution cannot fully repair the loss, so compensation (art 36) — usually a monetary sum —
      covers the financially assessable material damage, such as repairs. Compensation does not cover moral damage;
      the insult of seizing the vessel and holding its crew is repaired through satisfaction (art 37): an apology, an
      expression of regret, or a court judgment declaring the conduct wrongful.
    rubric:
      - id: r1
        criterion: Cessation and non-repetition (art 30)
        marks: 2
        top-band: Applies both limbs to the continuing patrols, citing the Wall opinion.
        margin-note: Is the wrong still continuing? Then say what M must stop.
        authorities:
          - arsiwa-art-30
      - id: r2
        criterion: Full reparation and its purpose (art 31, Chorzów)
        marks: 2
        top-band: States full reparation, material and moral injury, and the Chorzów "wipe out" formula.
        margin-note: What situation is reparation trying to recreate?
        authorities:
          - arsiwa-art-31
      - id: r3
        criterion: Matches each head of damage to the right form
        marks: 4
        top-band: Restitution of the vessel, compensation for financially assessable damage, satisfaction for moral injury.
        margin-note: Compensation doesn't cover the insult — which form does?
        authorities:
          - arsiwa-arts-35-37
  - key: q701
    type: mcq
    concept: invocation-of-responsibility
    difficulty: 1
    stem: What is the general rule on who may invoke a state's international responsibility?
    options:
      - text: Any member of the United Nations may invoke it for any breach.
        why: Tempting because some obligations concern everyone, but that is the narrow art 48 exception; the general rule limits invocation to the injured state or states.
      - text: Only the Security Council may invoke it.
        why: Tempting because the Security Council has enforcement powers, but ARSIWA gives states, not the Council, the right to invoke responsibility.
      - text: Only the state or states whose individual rights have been violated — the injured state(s) — may invoke it, demanding cessation, reparation and so on.
        correct: true
        why: Correct — the slides say the rule is that only the state(s) whose individual rights have been violated are entitled to invoke international responsibility (art 42).
  - key: q702
    type: mcq
    concept: invocation-of-responsibility
    difficulty: 2
    stem: When is a state "injured" for the purposes of art 42, as explained in the lecture?
    options:
      - text: When the obligation breached was owed to it.
        correct: true
        why: Correct — the lecturer says a state is injured if the obligation breached was owed to it, for instance under a bilateral or multilateral treaty.
      - text: When it has suffered financial loss of any kind from the breach, even if the obligation was owed only to some other state.
        why: Tempting because injury sounds like loss, but the test is to whom the obligation was owed; financial loss alone does not make a state "injured" under art 42.
      - text: When it has formally protested the breach in the UN General Assembly within one year of the conduct.
        why: Tempting because protest shows interest, but the materials attach no protest requirement; injury depends on the obligation being owed to the state.
  - key: q703
    type: mcq
    concept: invocation-of-responsibility
    difficulty: 2
    stem: Under art 48(1)(a), a non-injured state may invoke responsibility if the obligation breached is of which kind?
    options:
      - text: Owed only to the responsible state itself, as a unilateral undertaking.
        why: Tempting because unilateral undertakings create obligations (Week 3), but art 48(1)(a) concerns obligations owed to a group that includes the invoking state.
      - text: Owed to a group including that state and established to protect a collective interest of the group.
        correct: true
        why: Correct — art 48(1)(a) covers an obligation owed to a group of states including the invoking state, established for the protection of a collective interest of the group.
      - text: Owed to any international organisation of which the invoking state and the responsible state are both founding members.
        why: Tempting because organisations bring states together, but art 48(1)(a) speaks of an obligation owed to a group of states for a collective interest, not to an organisation.
  - key: q704
    type: mcq
    concept: invocation-of-responsibility
    difficulty: 2
    stem: Which examples did the lecturer give of obligations protecting the collective interest of a group of states under art 48(1)(a)?
    options:
      - text: A bilateral trade treaty and a bilateral extradition treaty.
        why: Tempting because they are treaties, but bilateral obligations are owed to the other party, which is an injured state under art 42; they do not protect a group's collective interest.
      - text: A regional nuclear-free zone treaty, or a regional system for the protection of human rights.
        correct: true
        why: Correct — the lecturer gives a regional nuclear-free zone treaty or a regional human rights system as instances where a non-injured group member could invoke responsibility.
      - text: A domestic statute creating human rights, or a constitution guaranteeing protection of the environment for all citizens.
        why: Tempting because they protect collective interests domestically, but they are not international obligations owed to a group of states; art 48 concerns international obligations.
  - key: q705
    type: mcq
    concept: invocation-of-responsibility
    difficulty: 2
    stem: What is an obligation erga omnes, as explained in the lecture?
    options:
      - text: An obligation owed only between the parties to a treaty.
        why: Tempting because treaties create obligations owed to parties, but erga omnes obligations are owed to the international community as a whole, not only to treaty partners.
      - text: An obligation arising from a Security Council resolution.
        why: Tempting because Security Council resolutions can bind all members, but erga omnes describes the nature of the obligation, not its source in a resolution.
      - text: An obligation so important that by its very nature it concerns all states, because all states have a legal interest in protecting the right it protects.
        correct: true
        why: Correct — the lecturer says erga omnes obligations are so important that by their very nature they concern all states; the right protected is so important all states have a legal interest.
  - key: q706
    type: mcq
    concept: invocation-of-responsibility
    difficulty: 1
    stem: Which case do the slides cite for obligations erga omnes?
    options:
      - text: Barcelona Traction.
        correct: true
        why: Correct — slide 36 cites Barcelona Traction Case (Belgium v Spain) ICJ (1970) for obligations erga omnes, beside art 48(1)(b).
      - text: Factory at Chorzów, the PCIJ's 1928 decision on the purpose and measure of reparation.
        why: Tempting because it is a classic case on consequences, but Chorzów is cited for reparation wiping out the consequences of the illegal act, not for erga omnes.
      - text: Corfu Channel, the ICJ's first judgment on responsibility for mines in Albanian waters.
        why: Tempting because Corfu Channel speaks of the rights of other states, but it is cited for breach by omission and the duty not to allow knowingly the use of territory.
  - key: q707
    type: mcq
    concept: invocation-of-responsibility
    difficulty: 2
    stem: Which of these did the slides give as an example of an erga omnes norm?
    options:
      - text: The obligation to repay a sovereign loan to a particular creditor state.
        why: Tempting because Serbian Loans appeared this week, but a loan is owed to a particular creditor; it is not owed to the community as a whole.
      - text: The prohibition of aggression and genocide, listed with the non-use of force.
        correct: true
        why: Correct — the slides list the non-use of force principle, the prohibition of aggression and genocide, and breaches of international environmental law as erga omnes examples.
      - text: A bilateral obligation to allow the other party's aircraft to land at its airports.
        why: Tempting because overflight and landing featured under consent, but a bilateral obligation is owed to one state, which would be the injured state under art 42.
  - key: q708
    type: mcq
    concept: invocation-of-responsibility
    variant-of: q702
    difficulty: 3
    stem: State P breaches a bilateral fisheries treaty with State Q. State R, which is not a party but buys fish from Q, wants to invoke P's responsibility. What is R's position?
    options:
      - text: R probably cannot invoke; the obligation was owed to Q alone, and it neither protects a collective interest of a group including R nor is owed to the community.
        correct: true
        why: Correct — only Q is injured under art 42; a bilateral fisheries obligation is neither a collective-interest obligation of a group including R nor erga omnes, so art 48 does not help R.
      - text: R may invoke as an injured state, because it suffers economic effects.
        why: Tempting because R is affected economically, but a state is injured when the obligation breached was owed to it; the bilateral obligation was owed to Q, not R.
      - text: R may invoke under art 48(1)(b), because fisheries obligations are always erga omnes, being among the breaches of international environmental law that concern every state.
        why: Tempting because the environment features in the slides' list, but a bilateral fisheries treaty obligation is owed to the other party, not to the community as a whole.
  - key: q709
    type: mcq
    concept: invocation-of-responsibility
    variant-of: q707
    difficulty: 3
    stem: State S commits genocide against part of its own population. State T has no treaty relationship with S and none of its nationals are affected. May T invoke S's responsibility?
    options:
      - text: No — only a state whose own nationals are harmed can invoke responsibility.
        why: Tempting because injury usually involves one's own interests, but art 48(1)(b) lets any state invoke responsibility where the obligation is owed to the international community as a whole.
      - text: No — T needs a treaty with S first.
        why: Tempting because treaties create owed obligations, but the prohibition of genocide is erga omnes; it is owed to all states whether or not they have a treaty with S.
      - text: Yes — the prohibition of genocide is owed to the international community as a whole, so under art 48(1)(b) a non-injured state such as T may invoke responsibility.
        correct: true
        why: Correct — the lecture lists the prohibition of genocide as an erga omnes obligation; art 48(1)(b) allows any state other than an injured state to invoke responsibility for its breach.
  - key: q710
    type: mcq
    concept: invocation-of-responsibility
    difficulty: 2
    stem: How does the lecturer describe the circumstances in which a non-injured state may invoke responsibility?
    options:
      - text: As broad, since any state may invoke responsibility for any breach anywhere in the world.
        why: Tempting because erga omnes norms concern everyone, but the lecturer stresses these circumstances are very limited; the general rule is the injured state.
      - text: As non-existent in practice, because ARSIWA has no provision on non-injured states at all.
        why: Tempting because the general rule favours injured states, but art 48 expressly provides for non-injured states in two situations.
      - text: As very limited.
        correct: true
        why: Correct — the lecturer says there are very limited circumstances where a non-injured state could invoke responsibility, namely those in art 48.
  - key: q711
    type: mcq
    concept: invocation-of-responsibility
    difficulty: 3
    contrasts-with:
      - cessation-and-reparation
    stem: A student treats "who may invoke responsibility" and "what the responsible state must do" as the same question. Which pairing correctly separates them?
    options:
      - text: Arts 42 and 48 decide who may invoke; arts 30–31 set cessation and reparation.
        correct: true
        why: Correct — invocation is governed by art 42 (injured states) and art 48 (non-injured states); the content of the consequences is set by arts 30 (cessation) and 31 (reparation).
      - text: Arts 30–31 decide who may invoke; arts 42 and 48 decide reparation.
        why: Tempting because the article numbers sit near each other, but they are reversed — arts 30–31 set cessation and reparation, while arts 42 and 48 decide who may invoke.
      - text: Both questions are governed by art 2, which states the elements of an internationally wrongful act and every consequence that follows it.
        why: Tempting because art 2 is foundational, but it defines the two elements of the wrongful act only; invocation and consequences are dealt with in later parts of ARSIWA.
  - key: q712
    type: mcq
    concept: invocation-of-responsibility
    difficulty: 3
    stem: In the tutorial hypothetical, Australia is a party to the pandemic Convention, which was concluded among 50 states to create a globally coordinated system. Which art 48 route is most relevant if Australia is not itself injured?
    options:
      - text: Art 48(1)(b), because pandemics affect every state on Earth.
        why: Tempting because pandemics are global, but the materials do not identify pandemic obligations as erga omnes; the clearer route is a group obligation among the Convention's parties.
      - text: Art 48(1)(a), if the obligation is owed to the group of parties including Australia and protects their collective interest.
        correct: true
        why: Correct — the Convention's obligations are owed to its parties, including Australia, and its preamble speaks of a coordinated, equitable system; that fits a collective-interest obligation under art 48(1)(a).
      - text: Neither, because a treaty party can only ever be an injured state under art 42 and never a non-injured state under art 48 of ARSIWA.
        why: Tempting because treaty obligations are owed to parties, but art 48(1)(a) is itself about treaty-type obligations owed to a group; being a party does not exclude it.
  - key: q713
    type: mcq
    concept: invocation-of-responsibility
    variant-of: q704
    difficulty: 2
    stem: Five states in a region conclude a treaty making their region nuclear-free. State U, a party, tests a nuclear weapon, harming no other party directly. Can State V, another party, invoke U's responsibility?
    options:
      - text: No, because V suffered no direct damage.
        why: Tempting because V is not directly harmed, but art 48(1)(a) allows a non-injured party to invoke where the obligation protects a group's collective interest.
      - text: Yes — the obligation is owed to the group including V and protects the collective interest of the group, as the lecturer's regional nuclear-free zone example shows.
        correct: true
        why: Correct — the lecturer gives a regional nuclear-free zone treaty as the example of art 48(1)(a); V, a member of the group, may invoke responsibility even though not injured.
      - text: No, because only states outside the region may complain.
        why: Tempting because outsiders might seem neutral, but art 48(1)(a) concerns the group itself — the obligation is owed to the group including V.
  - key: q714
    type: mcq
    concept: invocation-of-responsibility
    difficulty: 2
    stem: What may an injured state demand when it invokes responsibility, according to the slides?
    options:
      - text: The expulsion of the responsible state from all international organisations of which it is a member.
        why: Tempting because expulsion is a heavy consequence, but the slides describe invocation as demanding cessation, reparation and so on — the consequences in arts 30–31.
      - text: Only an apology, since the other forms are reserved for decisions of the International Court of Justice.
        why: Tempting because an apology is one form of satisfaction, but invocation extends to cessation and every form of reparation, not only an apology.
      - text: Cessation, reparation, etc.
        correct: true
        why: Correct — the slides say invoking international responsibility means demanding cessation, reparation, etc., the consequences set out in arts 30 and 31.
  - key: q715
    type: mcq
    concept: invocation-of-responsibility
    difficulty: 2
    stem: Which step of the tutorial's advice questions does art 48 principally answer?
    options:
      - text: Question 5 — whether Australia can invoke responsibility.
        correct: true
        why: Correct — tutorial question 5 asks whether Australia can invoke responsibility, which is answered by art 42 (injured states) and art 48 (non-injured states).
      - text: Question 3 — whether the conduct is attributable.
        why: Tempting because the questions are sequential, but attribution is governed by arts 4–11; art 48 concerns who may invoke responsibility.
      - text: Question 4 — whether any grounds preclude wrongfulness, since art 48 lists the six excuses available to states.
        why: Tempting because art 48 lists conditions, but the six grounds precluding wrongfulness are in arts 20–25; art 48 concerns invocation by non-injured states.
  - key: q716
    type: mcq
    concept: invocation-of-responsibility
    variant-of: q705
    difficulty: 3
    stem: Why can any state invoke responsibility for a breach of an obligation erga omnes, even when it is not injured?
    options:
      - text: Because every breach of an erga omnes obligation automatically injures every state materially.
        why: Tempting because erga omnes obligations concern everyone, but the point is legal interest, not material injury; non-injured states invoke under art 48, not art 42.
      - text: Because the obligation is owed to the international community as a whole, so every state has a legal interest in the right it protects.
        correct: true
        why: Correct — art 48(1)(b) covers obligations owed to the international community as a whole; the right is so important all states have a legal interest in its protection (Barcelona Traction).
      - text: Because erga omnes obligations can only be enforced by the Security Council, which delegates standing to member states in each case as it arises before it.
        why: Tempting because the Council enforces some norms, but art 48(1)(b) gives standing directly to states; the materials mention no delegation from the Council.
  - key: q717
    type: truefalse
    concept: invocation-of-responsibility
    set: quickfire
    statement: Only an injured state can ever invoke another state's international responsibility.
    answer: false
    why: False — that is the general rule (art 42), but art 48 lets non-injured states invoke responsibility for collective-interest obligations of a group and for obligations owed to the international community as a whole.
  - key: q718
    type: truefalse
    concept: invocation-of-responsibility
    set: quickfire
    statement: The prohibition of genocide is an example of an obligation erga omnes.
    answer: true
    why: True — the lecture and slides list the prohibition of genocide, with aggression and the non-use of force, as obligations erga omnes owed to the international community as a whole.
  - key: q719
    type: truefalse
    concept: invocation-of-responsibility
    statement: A state is injured for the purposes of art 42 whenever it disapproves of another state's breach of international law.
    answer: false
    why: False — a state is injured only if the obligation breached was owed to it, for instance under a bilateral or multilateral treaty; disapproval alone does not make it injured.
  - key: q720
    type: match
    concept: invocation-of-responsibility
    difficulty: 2
    prompt: Match each situation to the ARSIWA provision that gives the claimant standing.
    pairs:
      - left: The other party to a bilateral treaty that has been breached
        right: Art 42 — the injured state
      - left: A party to a regional human rights system, not itself injured
        right: Art 48(1)(a) — obligation protecting a group's collective interest
      - left: Any state, where genocide or aggression has been committed
        right: Art 48(1)(b) — obligation owed to the international community as a whole

