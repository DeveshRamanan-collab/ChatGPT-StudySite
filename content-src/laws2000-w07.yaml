cards:
  - type: basic
    concept: framework-of-state-responsibility
    front: What is the difference between primary rules and the rules of state responsibility?
    back: Primary rules (treaty or customary law) set the substantive obligations, e.g. non-use of force; state responsibility is secondary — it determines the legal consequences of breaching them.
    source: Week 07 Lecture Slides, slide 4
  - type: cloze
    concept: framework-of-state-responsibility
    text: "ARSIWA was adopted on {{c1::10 August 2001}}; it is not binding, but many articles appear to codify {{c2::customary international law}}."
    source: Week 07 Lecture Slides, slide 5
  - type: cloze
    concept: framework-of-state-responsibility
    text: "An internationally wrongful act exists when conduct consisting of an act or omission is {{c1::attributable to a State}} and constitutes a {{c2::breach of an international obligation}} owed by that State (art 2)."
    source: Week 07 Lecture Slides, slide 6
  - type: basic
    concept: framework-of-state-responsibility
    front: What are the five steps for analysing state responsibility?
    back: (1) Primary legal obligation? (2) Prima facie breach? (3) Attributable to a state? (4) Grounds precluding wrongfulness? (5) Legal consequences — cessation, reparation.
    source: Week 07 Lecture Slides, slide 37
  - type: basic
    concept: breach-of-an-international-obligation
    front: Does the source of the obligation breached matter (art 12)?
    back: No — a breach concerns a primary rule of international law irrespective of its source (custom or treaty); but it must be an international, not a domestic, obligation.
    source: Week 07 Lecture Slides, slide 7
  - type: cloze
    concept: breach-of-an-international-obligation
    text: "Under arts 13–14 the state must be under the obligation {{c1::at the time of the breach}} — there is no {{c2::retroactivity}}."
    source: Week 07 Lecture Slides, slide 7
  - type: basic
    concept: breach-of-an-international-obligation
    front: What is a composite act (art 15)?
    back: A series of acts which, taken together, eventually amount to a breach even though one or two of them alone would not — e.g. pollution adding up over time.
    source: Week 07 Lecture Recording (Live)
  - type: apply
    concept: breach-of-an-international-obligation
    scenario: Mines, laid by unknown persons, sit in State A's territorial strait; the minelaying was visible from A's coast. A says nothing, and a foreign warship is sunk.
    answer: Breach by omission (Corfu Channel) — A knew of the minefield and breached its obligations to notify shipping and warn approaching ships; who laid the mines does not matter.
    source: Week 07 Lecture Slides, slide 9
  - type: basic
    concept: breach-of-an-international-obligation
    front: In Tehran, what was Iran's omission?
    back: Failing to protect the US embassy and its staff from the protesters, as the host state must under the Vienna Convention on Diplomatic Relations.
    source: Week 07 Lecture Recording (Live)
  - type: cloze
    concept: attribution-to-the-state
    text: "Under art 4 the conduct of any State organ — legislative, executive, {{c1::judicial}} or other, central or of a {{c2::territorial unit}} — is an act of the State."
    source: Week 07 Lecture Slides, slide 10
  - type: basic
    concept: attribution-to-the-state
    front: When may an entity that is not an organ under internal law be treated as a de facto organ?
    back: Only exceptionally, where it acts in "complete dependence" on the state, of which it is merely the instrument (Genocide case, paras 392–393).
    source: Week 07 Lecture Slides, slide 11
  - type: basic
    concept: attribution-to-the-state
    front: What are the two conditions for attribution under art 5?
    back: (i) The person or entity is empowered by the state's law to exercise elements of governmental authority; and (ii) it is acting in that capacity in the particular instance.
    source: Week 07 Lecture Slides, slide 12
  - type: apply
    concept: attribution-to-the-state
    scenario: State B lends a medical team to State C to fight an outbreak; the team, acting under C's governmental authority, breaches an obligation.
    answer: Art 6 — the conduct of an organ placed at the disposal of C by B is attributed to C, because it is exercising C's governmental authority.
    source: Week 07 Lecture Slides, slide 13
  - type: cloze
    concept: attribution-to-the-state
    text: "Art 7: conduct of an organ acting in that capacity is attributable {{c1::even if it exceeds its authority or contravenes instructions}} (Velásquez Rodríguez v Honduras)."
    source: Week 07 Lecture Slides, slide 14
  - type: basic
    concept: attribution-to-the-state
    front: When is an insurrectional movement's conduct attributed to a state under art 10?
    back: When the movement becomes the new government of the state (art 10(1)), or succeeds in establishing a new state, whose act it then is (art 10(2)).
    source: Week 07 Lecture Slides, slide 19
  - type: apply
    concept: attribution-to-the-state
    scenario: Private militants seize a foreign consulate. The host state's leader later issues a decree praising the seizure and ordering the hostages be kept.
    answer: Art 11 — the state acknowledges and adopts the conduct as its own, as Iran did in Tehran, so the seizure is attributed to it.
    source: Week 07 Lecture Slides, slide 20
  - type: basic
    concept: attribution-to-the-state
    front: What do arts 16, 17 and 18 cover?
    back: Art 16 — aid or assistance to another state's breach (responsible for its portion of help); art 17 — direction and control over another state; art 18 — coercion (the coercing state is responsible).
    source: Week 07 Lecture Slides, slide 21
  - type: cloze
    concept: effective-control-and-private-conduct
    text: "Art 8: private conduct is the state's if the person or group is in fact acting on the {{c1::instructions}} of, or under the {{c2::direction or control}} of, that State."
    source: Week 07 Lecture Slides, slide 15
  - type: basic
    concept: effective-control-and-private-conduct
    front: What did Nicaragua (1986) hold was insufficient for attributing the contras' acts to the US?
    back: US participation, even if preponderant or decisive, in financing, organising, training, supplying and equipping, selecting targets and planning; effective control of the operations was needed (para 115).
    source: Week 07 Lecture Slides, slide 16
  - type: basic
    concept: effective-control-and-private-conduct
    front: Effective control or overall control — which court used which, and which is the law now?
    back: ICJ, Nicaragua (1986) — effective control; ICTY Appeals Chamber, Tadić (1999) — overall control; ICJ, Genocide case (2007) — rejected overall control; effective control is the law now.
    source: Week 07 Lecture Slides, slides 16–18
  - type: apply
    concept: effective-control-and-private-conduct
    scenario: State D arms and trains a rebel group abroad and picks broad target areas, but gives no orders for the raid in which civilians were killed.
    answer: Probably not attributable under art 8 — without specific instructions for, or effective control over, that operation, support alone is insufficient (Nicaragua; Genocide case).
    source: Week 07 Lecture Slides, slides 15–18
  - type: basic
    concept: circumstances-precluding-wrongfulness
    front: List the six circumstances precluding wrongfulness.
    back: Consent (art 20), self-defence (art 21), lawful countermeasures (art 22), force majeure (art 23), distress (art 24), necessity (art 25).
    source: Week 07 Lecture Slides, slide 24
  - type: basic
    concept: circumstances-precluding-wrongfulness
    front: What conditions must countermeasures meet?
    back: Against a responsible state, to induce compliance (art 49(1)); no breach of jus cogens (arts 50, 53); proportional (art 51); procedural steps — negotiate, notify, chance to cease, stop once the wrong ceases (arts 52, 53).
    source: Week 07 Lecture Slides, slide 28
  - type: cloze
    concept: circumstances-precluding-wrongfulness
    text: "Force majeure requires an irresistible force or unforeseen event beyond the State's control making performance {{c1::materially impossible}}; Rainbow Warrior speaks of \"{{c2::absolute and material impossibility}}\"."
    source: Week 07 Lecture Slides, slide 29
  - type: apply
    concept: circumstances-precluding-wrongfulness
    scenario: A state-owned ship in a storm, with no other reasonable way to save its crew, shelters in a foreign port without permission. The storm was not of the state's making.
    answer: Distress (art 24) likely precludes wrongfulness — no other reasonable way to save lives in its care, not self-induced, and no comparable or greater peril.
    source: Week 07 Lecture Slides, slide 30
  - type: basic
    concept: circumstances-precluding-wrongfulness
    front: Why was the Danube diversion in Gabčíkovo-Nagymaros not a lawful countermeasure?
    back: It was disproportionate — Czechoslovakia unilaterally assumed control of a shared resource, depriving Hungary of its equitable share, with ecological impact.
    source: Week 07 Lecture Recording (Online)
  - type: cloze
    concept: circumstances-precluding-wrongfulness
    text: "Art 26: nothing in the chapter precludes the wrongfulness of an act contrary to a {{c1::peremptory norm}} of general international law."
    source: Week 07 Lecture Slides, slide 32
  - type: cloze
    concept: cessation-and-reparation
    text: "Art 30: the responsible State must (a) {{c1::cease}} the act, if it is continuing, and (b) offer appropriate {{c2::assurances and guarantees of non-repetition}}, if circumstances so require."
    source: Week 07 Lecture Slides, slide 33
  - type: basic
    concept: cessation-and-reparation
    front: What is the purpose of reparation according to Factory at Chorzów (1928)?
    back: As far as possible, to wipe out all the consequences of the illegal act and re-establish the situation which would, in all probability, have existed if it had not been committed.
    source: Week 07 Lecture Slides, slide 34
  - type: basic
    concept: cessation-and-reparation
    front: What are the three forms of reparation and what does each repair?
    back: Restitution (art 35) — in kind, e.g. returning property; compensation (art 36) — financially assessable material damage; satisfaction (art 37) — moral damage, e.g. apology, regret, declaratory judgment.
    source: Week 07 Lecture Recording (Online)
  - type: apply
    concept: cessation-and-reparation
    scenario: A state's unlawful occupation of an island continues; the ICJ finds the administration wrongful.
    answer: Cessation and reparation — as in Chagos (2019), the state must end its administration and return the islands as rapidly as possible.
    source: Week 07 Lecture Slides, slide 35
  - type: basic
    concept: invocation-of-responsibility
    front: Who may invoke a state's international responsibility?
    back: The injured state(s) — whose individual rights were violated (art 42); and, in very limited cases, non-injured states under art 48 (collective-interest obligations of a group; obligations erga omnes).
    source: Week 07 Lecture Slides, slide 36
  - type: cloze
    concept: invocation-of-responsibility
    text: "Art 48(1)(b): a non-injured State may invoke responsibility if the obligation breached is owed to {{c1::the international community as a whole}} — obligations {{c2::erga omnes}} (Barcelona Traction)."
    source: Week 07 Lecture Slides, slide 36
  - type: apply
    concept: invocation-of-responsibility
    scenario: A party to a regional human rights treaty mistreats its own nationals. Another party, whose nationals are unaffected, wants to invoke responsibility.
    answer: Art 48(1)(a) — the obligation is owed to the group of parties and protects their collective interest, so the non-injured party may invoke responsibility.
    source: Week 07 Lecture Recording (Online)

audio:
  title: Week 7 recap — state responsibility
  minutes: 3
  script: |
    State responsibility is the set of secondary rules that tells us when a state has breached a primary rule —
    something in a treaty or in custom, like the prohibition on the use of force — and what follows. The ILC codified
    it in the Articles on State Responsibility, ARSIWA, adopted on 10 August 2001. They are not a treaty and not
    binding as such, but many articles reflect customary international law.

    Article 1 says every internationally wrongful act entails the state's responsibility, and article 2 gives us two
    elements: conduct, an act or an omission, that is attributable to the state, and that breaches an international
    obligation owed by it. For breach, the source does not matter, it just has to be international; the state must
    be bound at the time; small acts can add up to a composite breach; and omissions count — Iran failing to protect
    the embassy in Tehran, Albania failing to warn about the mines in Corfu Channel.

    Attribution starts from the rule that a state answers for its own conduct. Article 4 covers all its organs,
    including states within Australia, and exceptionally de facto organs in complete dependence. Article 5 covers
    entities empowered by law to exercise governmental authority, when acting in that capacity. Article 6 covers
    organs lent by another state, and article 7 keeps ultra vires conduct attributable, as in Velásquez Rodríguez.
    Article 10 catches insurgents who become the government, and article 11 catches conduct the state acknowledges
    and adopts, like Iran's decree in Tehran.

    Private groups come under article 8: specific instructions, or effective control over the operation. Nicaragua
    said even decisive funding, training and targeting was not enough. Tadić tried a softer overall control test,
    but the ICJ in the Genocide case rejected it, so effective control is the law now.

    Then the six circumstances precluding wrongfulness: consent, self-defence under article 51 of the Charter,
    proportionate countermeasures — the Danube diversion in Gabčíkovo-Nagymaros failed that — force majeure, which
    needs absolute and material impossibility, distress, and necessity, which is exceptional and failed in the Wall
    opinion. None of them excuses breaching a peremptory norm, under article 26.

    If the act is wrongful, the state must cease it and, where needed, guarantee non-repetition, and it must make full
    reparation — wiping out the consequences, as Chorzów says — through restitution, compensation for material loss,
    and satisfaction for moral damage. Finally, the injured state invokes responsibility, and under article 48 other
    states can too, for collective-interest obligations and for obligations erga omnes like the prohibition of
    genocide.
