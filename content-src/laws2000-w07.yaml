    title: State responsibility — the framework and the two elements
    visual: palace
    visual-brief: Five rooms walked in order — primary obligation, prima facie breach, attribution, grounds precluding wrongfulness, consequences — with the two elements of art 2 (breach and attribution) lit as the load-bearing rooms and a secondary-rules roof over the primary-rules floor.
