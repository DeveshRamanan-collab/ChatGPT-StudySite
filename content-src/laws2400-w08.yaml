    body: |-
      Public authorities are bodies created by statutes to perform public functions or act in the public interest — the
      State, councils, statutory authorities, the police. With no Crown immunity now, they can be sued in negligence. But they differ from private defendants because of their nature and responsibilities, because they
      exercise functions under statute, and because courts weigh public policy — above all resources (a court telling the
      executive where to spend limited funds raises the separation of powers) and indeterminate liability. Reasonable
      foreseeability is always needed, never enough.

      Until *Anns* (1978), UK authorities were not liable for failing to exercise a power. In *Sutherland Shire Council v
      Heyman* (1985) the High Court considered the **policy versus operation** distinction and **general reliance**. Policy
      — the high-level approach, such as letting an industry self-regulate — is pretty much off limits. Negligence in
      operations, carrying policy out, is more arguable, though hurdles remain.

      Police show the same line: no duty is owed to individual members of the public in the investigation and suppression
      of crime (*Hill v Chief Constable of West Yorkshire*): conflicting responsibilities, resource allocation, the risk of
      defensive policing. But this is not an immunity: negligent operational conduct can attract a duty (*Zalewski v
      Turcarolo*, a police shooting during an operational response). And a statutory power to intervene is not of itself a
      duty to exercise it (*Stuart v Kirkland-Veenstra*).

      Exam use: say why more than foreseeability is needed, then place the complaint on the policy–operations line.
  - slug: crimmins-and-mchugh-six-questions
    title: Crimmins and McHugh J's six questions
    visual: palace
    visual-brief: Six rooms walked in order — foreseeability, power to protect a specific class, vulnerability, knowledge, core policy function, other policy reasons — each lit against the Crimmins facts, with rooms five and six marked as pointing away from a duty and Hayne J's dissent hung in room five.
    related:
      - control-and-vulnerability-graham-barclay-and-amaca
      - public-authorities-as-defendants
    depends-on:
      - public-authorities-as-defendants
      - laws2400-w05-novel-duty-and-salient-features
    contrasts-with:
      - control-and-vulnerability-graham-barclay-and-amaca
    cases:
      - crimmins-v-stevedoring-industry-finance-committee
    authorities: []
    verify: false
    body: |-
      *Crimmins v Stevedoring Industry Finance Committee* (1999): a casual waterside worker, directed where to work by the
      Australian Stevedoring Industry Authority, developed mesothelioma from unloading asbestos cargoes. The Authority was
      the regulator, not his employer. A duty was owed: it had an overarching supervisory and regulatory role regarding
      safety. McHugh J: it directed him to places of risk it
      knew or ought to have known of, and he was specially vulnerable through his casual employment and his obligation to
      obey its directions.

      McHugh J's six questions for an affirmative duty of a statutory authority in a novel case:

      1. Was injury from its act or omission (including a failure to exercise statutory powers) reasonably foreseeable?
      2. Did its statutory obligations give it power to protect a specific class including the plaintiff, rather than
         the public at large?
      3. Was the plaintiff vulnerable — unable reasonably to safeguard herself?
      4. Did it know, or ought it to have known, of the risk to that class if it did not exercise its powers?
      5. Would a duty impose liability for "core policy making" or "quasi-legislative" functions?
      6. Are there other supervening policy reasons to deny a duty?

      Not every answer must be "yes": a "yes" to 5 or 6 points against a duty. Hayne J, dissenting, found no duty in
      deciding whether to use the quasi-legislative power to order respirators.

      Exam use: walk the six questions on the facts (the text compresses them to four).
  - slug: control-and-vulnerability-graham-barclay-and-amaca
    title: "Control, vulnerability and knowledge: Graham Barclay Oysters and Amaca"
    visual: simulation
    visual-brief: Toggles for control over the risk, a specific class (not the public generally), vulnerability, knowledge and a high-level policy choice; a duty meter shows where Crimmins (duty), Graham Barclay Oysters and Amaca (no duty) fall, with Amaca's five propositions checked off beside the meter.
    related:
      - crimmins-and-mchugh-six-questions
      - cla-part-5-public-authorities
    depends-on:
      - crimmins-and-mchugh-six-questions
    contrasts-with:
      - crimmins-and-mchugh-six-questions
    cases:
      - graham-barclay-oysters-v-ryan
      - amaca-v-nsw
      - crimmins-v-stevedoring-industry-finance-committee
    authorities:
      - civil-liability-act-2002-nsw-s3b
    verify: false
    body: |-
      In *Graham Barclay Oysters v Ryan* (2002), consumers made ill by contaminated oysters sued the grower, the Great
      Lakes Council and the NSW government. By majority, neither the Council nor the State owed a duty. Gleeson CJ: the complaint was "not about acts, but about omissions"; a court has no criterion to judge a decision to
      let an industry self-regulate; and the Council's powers were for the public generally, not a specific class. Gummow and Hayne JJ: the Council had much less control over the risk —
      "the factor of control is of fundamental importance".

      In *Amaca v NSW* [2004] NSWCA 124, James Hardie's cross-claim against the State over asbestos failed. The Court of
      Appeal's five propositions:

      1. The totality of the relationship decides the duty.
      2. Relevant control includes control of any situation containing a risk of harm.
      3. No duty merely because an authority might have prevented harm by exercising a power.
      4. Having powers, and exercising them from time to time, creates no duty to exercise them in future.
      5. Knowledge that harm may follow a failure to exercise a power is not enough.

      The State knew no more than James Hardie, had far less control than the employer, site owner and supplier, the
      workers could rely on those parties, and a duty would be a massive obligation. (A dust disease case, *Amaca* is
      common law: CLA s 3B(1)(b).)

      Exam use: are your facts closer to *Crimmins* (control, vulnerability, knowledge) or to these cases — and why?
  - slug: cla-part-5-public-authorities
    title: "Civil Liability Act Part 5: public and other authorities"
    visual: palace
    visual-brief: A corridor of six doors in section order — s 41 (who counts), s 42 (resources), s 43 ("so unreasonable"), s 43A (special statutory powers), s 44 (regulatory functions), s 46 (exercising a function is not a duty) — each opening on its one-line effect and a lecture example, ending at RTA v Refrigerated Roadways.
    related:
      - public-authorities-as-defendants
      - control-and-vulnerability-graham-barclay-and-amaca
    depends-on:
      - public-authorities-as-defendants
    contrasts-with:
      - public-authorities-as-defendants
    cases:
      - rta-v-refrigerated-roadways
      - romeo-v-conservation-commission-nt
    authorities:
      - civil-liability-act-2002-nsw-s41
      - civil-liability-act-2002-nsw-s42
      - civil-liability-act-2002-nsw-s43
      - civil-liability-act-2002-nsw-s43a
      - civil-liability-act-2002-nsw-s44
      - civil-liability-act-2002-nsw-s46
    verify: false
    body: |-
      The Ipp Committee aimed to confine public authorities' liability to acts so unreasonable that no reasonable
      authority would take them (Wednesbury unreasonableness). Part 5 applies to civil liability in tort:

      - **s 41**: a "public or other authority" includes the Crown, government departments, local councils, statutory
        authorities, and any person with public official functions (psychiatrists under the Mental Health Act 2007, people
        putting up road warning signs, prison guards).
      - **s 42**: functions are limited by the resources reasonably available; their general allocation is not open to
        challenge; functions are judged by the broad range of activities.
      - **s 43**: no breach of statutory duty unless the act or omission was so unreasonable that no authority with those
        functions could properly consider it reasonable.
      - **s 43A**: the same test for special statutory powers — powers persons generally cannot exercise without specific
        statutory authority (lecture examples: back-burning, firearm licences).
      - **s 44**: no liability for failing to exercise a function to prohibit or regulate an activity (licensing included)
        unless the plaintiff could have required it in proceedings.
      - **s 46**: exercising, or deciding to exercise, a function does not of itself create a duty to exercise it.

      In *RTA v Refrigerated Roadways* (2009) the RTA owed a duty about concrete dropped from an overpass; s 43A did not
      help it, because anybody can erect a screen — but there was no breach.

      Exam use: start with the common law duty, then ask which Part 5 sections modify it.
  - slug: third-party-conduct-dorset-yacht-and-modbury
    title: "Duty for the conduct of third parties: Dorset Yacht and Modbury"
    visual: diagram
    visual-brief: "A triangle — defendant, third party, plaintiff — whose edges light only where the materials find a basis: control of the third party (Dorset Yacht, scope cut off at the immediate vicinity), a protective relationship with the plaintiff, or neither (Modbury, no duty); a side note shows Refrigerated Roadways, where the risk was not only criminal."
    related:
      - cla-part-5-public-authorities
      - children-parents-and-the-unborn
    depends-on:
      - laws2400-w06-omissions-and-control-of-others
    contrasts-with:
      - control-and-vulnerability-graham-barclay-and-amaca
    cases:
      - home-office-v-dorset-yacht-co-ltd
      - modbury-triangle-shopping-centre-v-anzil
      - rta-v-refrigerated-roadways
    authorities: []
    verify: false
    body: |-
      A defendant may owe a duty for a third party's conduct that injures the plaintiff — a triangle in which the third
      party causes the harm but the plaintiff sues the defendant. Such a duty is found only in certain circumstances:
      usually a pre-existing relationship (defendant–plaintiff or defendant–third party) or a situation of control.

      *Home Office v Dorset Yacht* [1970]: boys escaped from Home Office detention and damaged yachts in the nearby harbour.
      A duty was owed: damage on escape was reasonably foreseeable and the officers had control over the boys. Policy
      limited its scope to damage in the vicinity immediately after the escape — not further damage while the boys remained
      at large (indeterminate liability).

      *Modbury Triangle Shopping Centre v Anzil* (2000): a video store employee was attacked in the car park after the
      lights went off. No duty to protect him from a third party's criminal conduct: the centre had not created the risk,
      it had merely failed to prevent harm caused by someone else, and there was no special relationship.

      There is a general reluctance to make defendants protect others from third parties' criminal acts, especially where
      the defendant did not create or control the risk. But *RTA v Refrigerated Roadways* found a duty about objects dropped
      from an overpass: in Modbury the harm could only arise through criminal conduct, and the RTA had a unique role.

      Exam use: draw the triangle — find the control or relationship edge, or say there is none.
  - slug: landlords-occupiers-and-trespassers
    title: Landlords, occupiers and trespassers
    visual: simulation
    visual-brief: Pick the defendant (landlord or occupier) and the entrant (tenant, other lawful entrant, trespasser), then toggle whether the landlord took reasonable steps to find defects and to fix them; the panel shows whether a duty exists, what it requires (Jones v Bartlett) and, for a trespasser, the Cardy rule and the unresolved trend.
    related:
      - third-party-conduct-dorset-yacht-and-modbury
    depends-on:
      - laws2400-w06-occupiers-liability-and-obvious-risk
    contrasts-with:
      - laws2400-w06-occupiers-liability-and-obvious-risk
    cases:
      - cavalier-v-pope
      - northern-sandblasting-pty-ltd-v-harris
      - jones-v-bartlett
      - commissioner-for-railways-v-cardy
      - romeo-v-conservation-commission-nt
    authorities: []
    verify: false
    body: |-
      Landlords once owed no duty for defective premises (*Cavalier v Pope*, 1906): the tenant, in control, was the one who
      could see the defects. The High Court rejected that rule in *Northern Sandblasting v Harris* (1997).

      *Jones v Bartlett* (2000): the tenant's son walked through a glass door that met the Australian standards when the
      house was built but not when it was leased; the landlord did not know. A duty was owed but not breached. Gummow and
      Hayne JJ: the key issue is the duty's nature and extent — premises reasonably fit for habitation as a domestic
      residence. The landlord must not let premises with defects it knows or ought to know make them unsafe, and discharges
      the duty by taking reasonable steps to ascertain defects and reasonable steps to remove them or make the premises
      safe. The door was not a dangerous defect. Landlords also owe other entrants a duty, narrower than an occupier's.

      An occupier is whoever controls the land, and owes a duty to lawful entrants; its extent depends on the relationship,
      the purpose of entry and the type of premises. For
      trespassers: "A person trespasses at their own risk and the occupier is under no duty to him except to refrain from
      intentional or wanton harm" (*Commissioner for Railways v Cardy*, 1960). The position remains unresolved, but the
      trend places more responsibility on the trespasser.

      Exam use: a duty is usually there — argue its content and the reasonable steps.
  - slug: advocates-immunity
    title: "Immune defendants: legal advocates"
    visual: diagram
    visual-brief: "A boundary map: inside the immunity, a barrister's conduct of a case in court and intimately connected pre-trial work; outside it, a solicitor's missed limitation period and negligent advice (back to negligent misstatement); the three policy reasons sit on the boundary line."
    related:
      - public-authorities-as-defendants
    depends-on: []
    contrasts-with:
      - laws2400-w07-negligent-words-from-deceit-to-hedley-byrne
    cases:
      - giannarelli-v-wraith
    authorities: []
    verify: false
    body: |-
      As a matter of public policy, barristers are immune from liability for negligence in the conduct of cases in court,
      and in pre-trial matters intimately connected with the case in court. *Giannarelli v Wraith* gave the policy reasons:

      1. the advocate's duty to the court may conflict with the duty to the client;
      2. court time may be wasted if advocates present numerous arguments to protect themselves against negligence
         allegations;
      3. the finality of judgment — a negligence case about how the first case was run disrupts that judgment and
         undermines the court process. Later cases treat this as a key reason.

      The immunity is narrow. It is about the courtroom, not legal advice: advice from lawyers and other professionals falls
      under pure economic loss caused by negligent misstatement (Topic 7). And solicitors can definitely be sued for
      negligence in acting for clients — the lecturer's example is a solicitor who failed to diarise a limitation period,
      leaving a $10 million claim statute barred and the client with a claim against the solicitor.

      Exam use: ask who the lawyer is, what they did and where — the conduct of a case in court or work intimately connected
      with it (immunity), or advice and file management (ordinary negligence or negligent misstatement).
  - slug: children-parents-and-the-unborn
    title: "Children: parents, carers and the unborn"
    visual: palace
    visual-brief: "Four rooms in order: a parent's duty to others to control the child (Smith v Leurs); a parent's duty to the child — none for raising, but not to lead the child into danger (Hahn v Conley); pre-natal injuries if born alive; and the controversial wrongful conception, birth and life actions."
    related:
      - third-party-conduct-dorset-yacht-and-modbury
    depends-on:
      - laws2400-w06-omissions-and-control-of-others
    contrasts-with:
      - third-party-conduct-dorset-yacht-and-modbury
    cases:
      - smith-v-leurs
      - hahn-v-conley
    authorities: []
    verify: false
    body: |-
      1. **Parents' duty to others.** Parents may owe others a duty to control their child. *Smith v Leurs* (1945): a
         13-year-old's sling-shot stone injured the plaintiff's eye; a duty was owed but not breached, because the parents had
         told their son not to use the sling shot outside their home.
      2. **Parents' duty to the child.** Generally no duty in feeding, clothing or raising a child — parents may raise their
         child as they see fit. But they must drive carefully so as not to injure the child (or even a foetus), and must not
         create danger or risk for the child: a parent may be liable if the child is led into danger by their actions. *Hahn v
         Conley* (1971): a grandfather minding a 3-year-old answered her call from across the road; she crossed and was struck
         by a car. In loco parentis, he owed no duty to protect her against that danger — he did not call her to come to him.
      3. **Pre-natal injuries.** A child injured in the womb may sue for pre-natal injuries if later born alive.
      4. **Wrongful conception, birth and life.** Parents have sued for wrongful conception (the mother would not have
         conceived but for the negligence) and wrongful birth (the pregnancy would have been terminated but for the
         negligence); children have sued for wrongful life. These actions are controversial.

      Exam use: identify who is suing whom, and in which direction the duty runs.
cases:
  - slug: crimmins-v-stevedoring-industry-finance-committee
    name: Crimmins v Stevedoring Industry Finance Committee
    citation: (1999) 200 CLR 1
    aglc: Crimmins v Stevedoring Industry Finance Committee (1999) 200 CLR 1
    facts: Crimmins worked as a waterside worker at Port Melbourne 1961–65. Stevedoring operations were regulated by the Australian Stevedoring Industry Authority, which directed workers where to work. The Authority was later abolished and the Stevedoring Industry Finance Committee (SIFC) assumed its liabilities. In 1997 Crimmins was diagnosed with mesothelioma caused by unloading asbestos cargoes. The Authority was not his employer.
    issue: Did the Authority owe Crimmins a duty of care, and did its liability pass to the SIFC?
    held: "The High Court held that a duty of care was owed, because the Authority/SIFC had an overarching supervisory and regulatory role regarding safety, and individual employers were required to supply safety equipment. (The lecture adds that the liability did pass to the SIFC, which stands in the Authority's shoes.) Hayne J dissented: no duty was owed in deciding whether to exercise the quasi-legislative power to order the use of respirators."
    ratio: "McHugh J: the statutory authority owed a duty because it directed the worker to places of work with risks of injury of which it was, or ought to have been, aware, and it knew or ought to have known he was specially vulnerable — through the casual nature of his employment and his obligation to obey its directions."
    significance: Source of McHugh J's six questions for whether a statutory authority owes an affirmative duty in a novel case (foreseeability, power to protect a specific class, vulnerability, knowledge, core policy functions, other policy reasons).
    why-here: "The duty-found benchmark for public authority problems: compare your facts with Crimmins's control, knowledge and vulnerability."
    verify: true
  - slug: sutherland-shire-council-v-heyman
    name: Sutherland Shire Council v Heyman
    citation: (1985) 157 CLR 424
    aglc: Sutherland Shire Council v Heyman (1985) 157 CLR 424
    facts: "As described in the Topic 8 lecture: purchasers discovered defective footings in their house years after it had been built, and sued the council over its inspection role during construction."
    issue: Whether the council owed the purchasers a duty of care in relation to its inspection role.
    held: In the lecture's account, no duty was held because there was no reliance. The High Court considered the policy vs operation distinction and the concept of general reliance (e.g., fire fighting).
    ratio: The materials give no fuller ratio. The case is used for the policy/operation distinction and general reliance, and (Topic 5) for Australian courts not following the Anns test.
    significance: "Introduced the policy versus operation distinction into Australian public authority cases: policy is largely off limits; operational negligence is more arguable."
    why-here: Cited for the policy/operations distinction and for reliance as a feature of a public authority duty.
    verify: true
  - slug: amaca-v-nsw
    name: Amaca v NSW
    citation: "[2004] NSWCA 124"
    aglc: Amaca v NSW [2004] NSWCA 124
    facts: Hay sued his employer, Rolls Royce, and Pacific Power (the site owner) for exposure to asbestos. Both defendants cross-claimed against James Hardie, the manufacturer of asbestos; James Hardie was held liable, but it cross-claimed against the State of NSW. The cross-claim was rejected at trial and by the Court of Appeal; the High Court reversed on the principles and remitted; on remitter the Court of Appeal again held no duty was owed.
    issue: Whether the State of NSW owed a duty of care in relation to the asbestos exposure.
    held: "The Court of Appeal held that the State did not owe a duty of care: James Hardie and others had no less knowledge than the State of the dangers of asbestos dust; the State's control was much less than that of Rolls Royce (employer), Pacific Power (site owner) and James Hardie (supplier); the plaintiffs were not vulnerable to the State, as they could rely on their employers, the suppliers and the owners and occupiers; and a duty would impose a massive obligation on the State."
    ratio: "Five propositions: the totality of the relationship decides the duty; relevant control includes control of any situation containing a risk of harm to others; no duty merely because an authority might have prevented harm by exercising a statutory power; statutory powers and their mere prior exercise create no duty to exercise them in future; knowledge that harm may result from a failure to exercise a power is not itself sufficient."
    significance: A synthesis of the common law on public authority omissions; decided at common law because it is a dust disease case excluded from the Civil Liability Act by s 3B(1)(b).
    why-here: Supplies the five propositions to test a claim that an authority should have used its powers.
    verify: false
  - slug: rta-v-refrigerated-roadways
    name: RTA v Refrigerated Roadways
    citation: "[2009] NSWCA 263"
    aglc: RTA v Refrigerated Roadways [2009] NSWCA 263
    facts: While driving a truck on the F5 freeway near Sydney, Evans, an employee of Refrigerated Roadways, was struck by a large piece of concrete dropped by third parties from an overhead bridge, and died. The RTA knew of the problem of people dropping objects from overhead bridges.
    issue: Whether the RTA owed a duty of care in respect of erecting a structure to prevent objects being thrown off the bridge; the RTA relied on Modbury Triangle Shopping Centre v Anzil.
    held: "The NSW Court of Appeal held that the RTA owed such a duty, distinguishing Modbury Triangle (where the harm could only arise through criminal conduct). Section 43A CLA would not have helped the RTA, as erecting protective screens is not an exercise of a special statutory power. But the RTA did not breach its duty: it had not been shown that it failed to take reasonable steps to prevent the risk of harm."
    ratio: The RTA has "a unique role to play concerning any dangers of objects falling from an overpass onto cars on a freeway below"; freeway drivers are vulnerable, and many serious road accidents involve criminal conduct by one party.
    significance: Shows the common law and CLA Part 5 working together, and that a public authority can owe a duty about third parties' conduct where it has a unique role, knowledge and vulnerable road users.
    why-here: "The worked example of the common law/CLA interface: duty found, s 43A inapplicable, no breach."
    verify: false
  - slug: hill-v-chief-constable-of-west-yorkshire
    name: Hill v Chief Constable of West Yorkshire
    citation: "[1989] AC 53"
    aglc: Hill v Chief Constable of West Yorkshire [1989] AC 53
    facts: The materials do not give the facts.
    issue: Whether police owe individual members of the public a duty of care in the investigation and suppression of crime.
    held: "Starting point: no duty of care is owed to individual members of the public in the investigation and suppression of crime."
    ratio: "Reasons given on the slide: conflicting responsibilities, resource allocation, and the risk of defensive policing."
    significance: "The no-duty starting point for police — but not an immunity: negligent operational conduct can attract a duty (Zalewski v Turcarolo)."
    why-here: "Opens any police negligence problem: start from no duty in investigating and suppressing crime."
    verify: true
  - slug: zalewski-v-turcarolo
    name: Zalewski v Turcarolo
    citation: "[1994] Aust Torts Reports 81-280"
    aglc: Zalewski v Turcarolo [1994] Aust Torts Reports 81-280
    facts: A police shooting during an operational response. In the lecture's account, police responding to a call shot an agitated man in the course of the operation.
    issue: Whether police owed a duty of care in the conduct of an operational response.
    held: "A duty was owed: the operational response attracted a duty of care."
    ratio: Negligent operational conduct by police can attract a duty of care; the Hill starting point is not an immunity.
    significance: Marks the operational end of the police spectrum, against Hill's investigation-of-crime starting point.
    why-here: Use it to argue a duty where police conduct in carrying out an operation, not investigation policy, is in issue.
    verify: true
  - slug: stuart-v-kirkland-veenstra
    name: Stuart v Kirkland-Veenstra
    citation: (2009)
    aglc: Stuart v Kirkland-Veenstra (2009)
    facts: "As described in the Topic 8 lecture: Mr Veenstra was in his car with a tube pumping fumes into it, attempting to take his own life. Police spoke to him; he denied any suicidal intent and they let him go. He later took his own life."
    issue: Whether the police owed a duty of care to a person apparently preparing to take his own life, including a duty to exercise a statutory power to apprehend him.
    held: Per the Topic 6 slides, the High Court held that police did not owe a duty of care to a person apparently preparing to take his own life. The Topic 8 slides use it for the point that a statutory power to intervene is not of itself a duty to exercise it.
    ratio: A statutory power to intervene is not of itself a duty to exercise it; generally there is no legal duty to rescue.
    significance: "Illustrates the limits of police and public authority duties for omissions: the existence of a power does not create an obligation to use it."
    why-here: Answers the argument that because police could have intervened, they had to.
    verify: true
  - slug: cavalier-v-pope
    name: Cavalier v Pope
    citation: (1906)
    aglc: Cavalier v Pope (1906)
    facts: The materials do not give the facts.
    issue: Whether a landlord owes a duty of care in respect of defective premises.
    held: Landlords were held not to have a duty of care — to the tenant or other users of the premises — in respect of defective premises.
    ratio: No landlord duty of care for defective premises (the old rule).
    significance: The old rule, rejected in Australia by Northern Sandblasting Pty Ltd v Harris (1997).
    why-here: The starting point of the landlord story — a rule that no longer applies in Australia.
    verify: true
  - slug: northern-sandblasting-pty-ltd-v-harris
    name: Northern Sandblasting Pty Ltd v Harris
    citation: (1997) 188 CLR 313
    aglc: Northern Sandblasting Pty Ltd v Harris (1997) 188 CLR 313
    facts: The materials do not give the facts.
    issue: Whether the rule in Cavalier v Pope (no landlord duty for defective premises) applies in Australia.
    held: The High Court of Australia rejected the rule in Cavalier v Pope.
    ratio: Landlords are not exempt from a duty of care in respect of defective premises.
    significance: Opened the way for Jones v Bartlett, which defined the content of the landlord's duty.
    why-here: Cite it for the proposition that a landlord can owe a duty for defective premises.
    verify: true
  - slug: jones-v-bartlett
    name: Jones v Bartlett
    citation: (2000) 205 CLR 166
    aglc: Jones v Bartlett (2000) 205 CLR 166
    facts: The plaintiff, son of the tenant, was injured when he walked through a glass door. The glass door complied with the Australian standards at the time the house was built but not when it was leased; the landlord did not know that it did not comply with the regulations.
    issue: Whether the landlord owed a duty of care, and what its nature and extent were.
    held: "The High Court held that the landlord owed a duty of care, but it was not breached: the glass door was not held to be a dangerous defect."
    ratio: "Gummow and Hayne JJ: the content of the landlord's duty to the tenant is \"conterminous with a requirement that the premises be reasonably fit for … habitation as a domestic residence\"; it requires a landlord not to let premises with defects which the landlord knows or ought to know make them unsafe for the use, and is discharged if the landlord takes reasonable steps to ascertain such defects and reasonable steps to remove them or make the premises safe. A narrower duty is owed to other entrants."
    significance: "The leading statement of the content of a landlord's duty: duty usually owed, the argument is about reasonable steps."
    why-here: The authority for any landlord problem — both the existence and the content of the duty.
    verify: false
  - slug: commissioner-for-railways-v-cardy
    name: Commissioner for Railways v Cardy
    citation: (1960) 104 CLR 274
    aglc: Commissioner for Railways (NSW) v Cardy (1960) 104 CLR 274
    facts: The materials do not give the facts.
    issue: What duty, if any, an occupier owes to a trespasser.
    held: "\"A person trespasses at their own risk and the occupier is under no duty to him except to refrain from intentional or wanton harm to him….\" (at 286)."
    ratio: An occupier's only duty to a trespasser is to refrain from intentional or wanton harm.
    significance: Later cases have moved on, and the position remains unresolved, but the trend indicates the High Court is placing more responsibility on the trespasser.
    why-here: The starting point for a trespasser entrant problem.
    verify: true
  - slug: giannarelli-v-wraith
    name: Giannarelli v Wraith
    citation: (citation not given in the materials)
    aglc: Giannarelli v Wraith
    facts: The materials do not give the facts.
    issue: Whether barristers are immune from liability in negligence for their conduct of cases.
    held: Outlined the policy reasons for the advocates' immunity covering the conduct of cases in court and pre-trial matters intimately connected with the case in court.
    ratio: "Policy reasons: the advocate's duty to the court may conflict with the duty to the client; possible waste of court time if advocates run numerous arguments to protect against negligence allegations; the importance of the finality of judgment."
    significance: Source of the advocates' immunity; finality of judgment has been treated in later cases as a key reason.
    why-here: Cite it when a barrister is sued over the conduct of a case in court.
    verify: true
  - slug: smith-v-leurs
    name: Smith v Leurs
    citation: (1945) 70 CLR 256
    aglc: Smith v Leurs (1945) 70 CLR 256
    facts: A 13-year-old boy fired a stone from a sling shot, injuring the plaintiff's eye; the plaintiff sued the parents.
    issue: Whether parents owe others a duty to control their child.
    held: A duty was owed, but it was not breached, because the parents had taken reasonable steps by telling their son not to use the sling shot outside their home.
    ratio: Parents may owe a duty of care to others to control their child; it is discharged by reasonable steps.
    significance: "A control-of-others duty: the parent answers for failing to take reasonable steps to control the child."
    why-here: The authority when a stranger sues parents over harm caused by their child.
    verify: false
  - slug: hahn-v-conley
    name: Hahn v Conley
    citation: (1971) 126 CLR 276
    aglc: Hahn v Conley (1971) 126 CLR 276
    facts: A grandfather was looking after a 3-year-old girl. She called out from across the road; he answered the call; she crossed the road and was struck by a car. The defendant driver claimed an indemnity from the grandfather, assessed at 25% of the total damages.
    issue: Whether the girl had a cause of action against her grandfather.
    held: Parents may become liable to the child if the child is led into danger by their actions; but on the facts the grandfather, in loco parentis, owed the girl no duty of care to protect her against the danger — he did not call the girl to come to him.
    ratio: A parent (or person in loco parentis) can owe a child a duty not to lead the child into danger, but has no general duty to protect the child from every danger.
    significance: Marks the limits of a parent's or carer's duty to the child.
    why-here: The authority when a child (or a defendant seeking contribution) says a parent or carer owed the child a duty.
    verify: false
  - slug: home-office-v-dorset-yacht-co-ltd
    name: Home Office v Dorset Yacht Co Ltd
    citation: "[1970] AC 1004"
    aglc: Home Office v Dorset Yacht Co Ltd [1970] AC 1004
    facts: Boys in juvenile detention operated by the Home Office (working on an island under the supervision of officers, per Topic 5) escaped and caused significant damage to several yachts in the nearby harbour. The yacht owners sued the Home Office for negligence.
    issue: Whether the Home Office owed the yacht owners a duty of care in relation to damage caused by the escaped boys.
    held: "The House of Lords held that the Home Office owed the yacht owners a duty of care: it was reasonably foreseeable that the boys might cause damage if they escaped, and the detention officers had control over the boys. The scope of the duty was limited to damage caused in the vicinity immediately after escape; for reasons of policy, no duty existed as regards further damage while the escapees remained at large."
    ratio: A duty of care can arise where a defendant has control over a third party who poses a foreseeable risk of harm to others, although policy considerations may limit the scope of the duty.
    significance: The leading illustration of a duty arising from control over a third party.
    why-here: "The duty-found case for third-party conduct: contrast Modbury Triangle."
    verify: false
authorities:
  - slug: civil-liability-act-2002-nsw-s41
    title: Civil Liability Act 2002 (NSW) s 41
    kind: statute
    text: public or other authority means— (a) the Crown (within the meaning of the Crown Proceedings Act 1988), or (b) a Government department, or (c) a public health organisation within the meaning of the Health Services Act 1997, or (d) a local council, or (e) any public or local authority constituted by or under an Act, or (e1) any person having public official functions or acting in a public official capacity (whether or not employed as a public official), but only in relation to the exercise of the person's public official functions, or (f) a person or body prescribed … by the regulations …, or (g) any person or body in respect of the exercise of public or other functions of a class prescribed by the regulations …
    gloss: "Defines who gets Part 5 protection: the Crown, departments, councils and statutory bodies, and also private people exercising public official functions (e.g., psychiatrists under the Mental Health Act 2007, prison guards)."
    cases: []
    verify: false
  - slug: civil-liability-act-2002-nsw-s42
    title: Civil Liability Act 2002 (NSW) s 42
    kind: statute
    text: The following principles apply in determining whether a public or other authority has a duty of care or has breached a duty of care …— (a) the functions required to be exercised by the authority are limited by the financial and other resources that are reasonably available to the authority for the purpose of exercising those functions, (b) the general allocation of those resources by the authority is not open to challenge, (c) the functions required to be exercised by the authority are to be determined by reference to the broad range of its activities (and not merely by reference to the matter to which the proceedings relate), (d) the authority may rely on evidence of its compliance with the general procedures and applicable standards for the exercise of its functions as evidence of the proper exercise of its functions in the matter to which the proceedings relate.
    gloss: Resources limit what an authority must do, and courts cannot second-guess how it allocates them — at both the duty and the breach stage.
    cases:
      - romeo-v-conservation-commission-nt
    verify: false
  - slug: civil-liability-act-2002-nsw-s43
    title: Civil Liability Act 2002 (NSW) s 43
    kind: statute
    text: (1) This section applies to proceedings for civil liability to which this Part applies to the extent that the liability is based on a breach of a statutory duty by a public or other authority in connection with the exercise of or a failure to exercise a function of the authority. (2) For the purposes of any such proceedings, an act or omission of the authority does not constitute a breach of statutory duty unless the act or omission was in the circumstances so unreasonable that no authority having the functions of the authority in question could properly consider the act or omission to be a reasonable exercise of its functions. (3) In the case of a function of a public or other authority to prohibit or regulate an activity, this section applies in addition to section 44.
    gloss: "A Wednesbury-style threshold: no breach of statutory duty unless the conduct was so unreasonable that no authority with those functions could properly consider it reasonable."
    cases: []
    verify: false
  - slug: civil-liability-act-2002-nsw-s43a
    title: Civil Liability Act 2002 (NSW) s 43A
    kind: statute
    text: (1) This section applies to proceedings for civil liability to which this Part applies to the extent that the liability is based on a public or other authority's exercise of, or failure to exercise, a special statutory power conferred on the authority. (2) A special statutory power is a power— (a) that is conferred by or under a statute, and (b) that is of a kind that persons generally are not authorised to exercise without specific statutory authority. (3) For the purposes of any such proceedings, any act or omission involving an exercise of, or failure to exercise, a special statutory power does not give rise to civil liability unless the act or omission was in the circumstances so unreasonable that no authority having the special statutory power in question could properly consider the act or omission to be a reasonable exercise of, or failure to exercise, its power. (4) In the case of a special statutory power of a public or other authority to prohibit or regulate an activity, this section applies in addition to section 44.
    gloss: Extends the "so unreasonable" threshold to special statutory powers — powers ordinary people cannot exercise without statutory authority (back-burning, firearm licences), not things anybody can do (erecting a screen).
    cases:
      - rta-v-refrigerated-roadways
    verify: false
  - slug: civil-liability-act-2002-nsw-s44
    title: Civil Liability Act 2002 (NSW) s 44
    kind: statute
    text: (1) A public or other authority is not liable in proceedings for civil liability to which this Part applies to the extent that the liability is based on the failure of the authority to exercise or to consider exercising any function of the authority to prohibit or regulate an activity if the authority could not have been required to exercise the function in proceedings instituted by the plaintiff. (2) Without limiting what constitutes a function to regulate an activity for the purposes of this section, a function to issue a licence, permit or other authority in respect of an activity, or to register or otherwise authorise a person in connection with an activity, constitutes a function to regulate the activity.
    gloss: No liability for failing to regulate or prohibit an activity (licensing included) unless the plaintiff could have compelled the authority to act.
    cases: []
    verify: false
  - slug: civil-liability-act-2002-nsw-s45
    title: Civil Liability Act 2002 (NSW) s 45
    kind: statute
    text: (1) A roads authority is not liable in proceedings for civil liability to which this Part applies for harm arising from a failure of the authority to carry out road work, or to consider carrying out road work, unless at the time of the alleged failure the authority had actual knowledge of the particular risk the materialisation of which resulted in the harm. (2) This section does not operate— (a) to create a duty of care in respect of a risk merely because a roads authority has actual knowledge of the risk, or (b) to affect any standard of care that would otherwise be applicable in respect of a risk.
    gloss: Special non-feasance protection for roads authorities — the CLA provision behind the lecturer's remark that potholes are covered by legislation (the lecture did not cite the section).
    cases: []
    verify: true
  - slug: civil-liability-act-2002-nsw-s46
    title: Civil Liability Act 2002 (NSW) s 46
    kind: statute
    text: In proceedings to which this Part applies, the fact that a public or other authority exercises or decides to exercise a function does not of itself indicate that the authority is under a duty to exercise the function or that the function should be exercised in particular circumstances or in a particular way.
    gloss: Having exercised a power before, or deciding to, does not by itself create a duty to exercise it.
    cases: []
    verify: false
questions:
  - key: q001
    type: mcq
    concept: public-authorities-as-defendants
    difficulty: 1
    stem: According to the Topic 8 slides, what is a public authority?
    options:
      - text: Any organisation, public or private, that provides services to members of the public for a fee.
        why: Tempting because many service providers deal with the public, but the slide defines public authorities by statutory creation and public function, not by serving customers.
      - text: A body created by statute to perform certain public functions or act in the public interest.
        correct: true
        why: Correct — this is the slide definition. Statutory creation and a public function or public-interest role are what make a body a public authority.
      - text: Only the Crown itself — the Commonwealth and the States — and never councils or statutory bodies.
        why: Tempting because the Crown is the classic public body, but the lecture treats councils, statutory authorities and the police as public authorities too.
      - text: A government body that is immune from tort liability unless it acts in bad faith.
        why: Wrong — the slides say there is now no Crown immunity from tortious liability, so public authorities can be sued for negligence or other torts.
  - key: q002
    type: mcq
    concept: public-authorities-as-defendants
    difficulty: 1
    set: pretest
    stem: Can a public authority in Australia be sued in negligence?
    options:
      - text: No — a public authority can only be challenged through administrative law remedies.
        why: Tempting because the slides do mention administrative law remedies, but they add that, with no Crown immunity, authorities may also be sued in negligence or other torts.
      - text: Only if it acted maliciously; decisions made in good faith are immune from any suit.
        why: Wrong — malice is not the test. The lecture says a duty is harder to establish against a public authority, not that good-faith conduct is immune.
      - text: Yes — there is no Crown immunity now, though a duty is harder to establish.
        correct: true
        why: Correct — the slides say there is no Crown immunity from tortious liability, but the lecturer stresses a much higher threshold at both duty and breach.
      - text: Only for positive acts; a public authority can never be liable for an omission.
        why: "Tempting because omissions are problematic (Graham Barclay), but \"never\" is wrong: McHugh J's first question expressly covers a failure to exercise statutory powers."
  - key: q003
    type: mcq
    concept: public-authorities-as-defendants
    difficulty: 2
    stem: Which is NOT one of the differences the slides list between a private person and a public authority as a defendant?
    options:
      - text: The nature and responsibilities of public authorities.
        why: This is on the slide — the first listed difference — so it cannot be the exception. Public authorities' public responsibilities set them apart.
      - text: Public authorities exercise their functions as per statutory provisions.
        why: "This is on the slide: an authority's powers are found in its statute, which is why the lecturer says we sometimes need to look at the statute."
      - text: Public authorities usually carry insurance, so their damages are capped.
        correct: true
        why: Correct — insurance and capped damages are not on the slide. The listed differences are nature and responsibilities, statutory functions and public policy considerations.
      - text: Courts take note of public policy considerations relevant to public authorities.
        why: This is on the slide — resources, the separation of powers and indeterminate liability are the policy considerations the lecturer stresses.
  - key: q004
    type: mcq
    concept: public-authorities-as-defendants
    difficulty: 2
    stem: The lecturer called resources the biggest reason public authorities are treated differently. Why do limited resources make a duty harder to establish?
    options:
      - text: Courts would be second-guessing how the executive allocates limited public funds.
        correct: true
        why: "Correct — the lecturer frames it as a separation of powers problem: the judiciary should not tell the executive where to take money from its limited bucket of funds."
      - text: Because public authorities have unlimited taxpayer funds, they would be bankrupted by damages.
        why: Self-contradictory and wrong — the lecturer asked "do they have unlimited money?" and answered no. The concern is courts directing spending, not bankruptcy.
      - text: Because resource questions go only to breach and never to whether a duty exists.
        why: Tempting because the lecture says the discussion slides into breach, but CLA s 42 applies to whether an authority has a duty as well as to breach.
      - text: Because a plaintiff must exhaust administrative law remedies before suing in tort.
        why: Wrong — the lecture "parks" administrative law as a separate remedy; nothing says it must be exhausted first, and it has nothing to do with resources.
  - key: q005
    type: mcq
    concept: public-authorities-as-defendants
    difficulty: 2
    stem: In the policy versus operation distinction (Heyman), which is the better description of a "policy" decision?
    options:
      - text: A detailed decision about how a particular inspection or task is carried out on the ground.
        why: Tempting because detail feels like where decisions are made, but the lecturer says this is operations — how you go about meeting the policy objective.
      - text: A high-level choice about the overall approach, such as letting an industry self-regulate.
        correct: true
        why: Correct — the lecturer says policy is high level ("this is our approach") and uses Graham Barclay Oysters' self-regulation choice as the example.
      - text: Any decision written down in an official document, whatever its level of generality.
        why: Wrong — the distinction turns on the level of the decision, not on whether it is recorded. An operational checklist can be written down too.
      - text: A decision made by an individual officer exercising personal discretion in an emergency.
        why: Tempting because discretion sounds like policy, but an officer's on-the-spot decision is part of carrying policy out — the operational end.
  - key: q006
    type: mcq
    concept: public-authorities-as-defendants
    difficulty: 2
    variant-of: q005
    stem: A council decides, as its overall approach, to rely on industry self-regulation rather than run its own testing program. Later, an inspector it does send carelessly misreads a test result. Which is more likely to support an arguable duty?
    options:
      - text: The decision to rely on self-regulation, because a high-level choice affects more people.
        why: Tempting because more people are affected, but high-level policy is "pretty much off limits" — setting it is the executive's job (separation of powers).
      - text: Neither — public authorities owe no duty in respect of either policy or operations.
        why: Wrong — there is no Crown immunity, and the lecture says negligence in operations is more likely to be arguable, though hurdles remain.
      - text: The inspector's misreading, because it is operational — carrying the policy out.
        correct: true
        why: Correct — operational negligence is where a plaintiff is "more likely to be able to at least argue" a duty; there are still hurdles such as control and reliance.
      - text: Both equally — the policy/operation distinction has no bearing on whether a duty is owed.
        why: "Wrong — the lecturer says the distinction \"comes through in the cases\": policy is largely off limits, operations more arguable."
  - key: q007
    type: mcq
    concept: public-authorities-as-defendants
    difficulty: 1
    stem: What did the slides say about public authorities in the UK before Anns v Merton London Borough Council (1978)?
    options:
      - text: They were liable in negligence on the same basis as any private defendant.
        why: "Wrong — the slide says the opposite: before Anns they could not be liable for a failure to exercise a power, whatever a private person's position."
      - text: They could be sued in negligence only by people who had relied on them.
        why: Tempting because reliance appears later in Heyman, but the slide's point about the pre-Anns position is a blanket bar on liability for failing to exercise a power.
      - text: They were liable only for core policy decisions, never for operational ones.
        why: Back to front — policy is the area courts are most reluctant to review. The slide simply says there was no liability for a failure to exercise a power.
      - text: They were not liable in negligence for a failure to exercise a power.
        correct: true
        why: "Correct — the slide: until Anns, public authorities in the UK were not liable for negligence for a failure to exercise a power."
  - key: q008
    type: mcq
    concept: public-authorities-as-defendants
    difficulty: 2
    cases:
      - sutherland-shire-council-v-heyman
    stem: According to the slides, what did the High Court consider in Sutherland Shire Council v Heyman (1985)?
    options:
      - text: The policy vs operation distinction and general reliance (e.g., fire fighting).
        correct: true
        why: Correct — the slide lists exactly these two ideas for Heyman; the lecture adds that no duty was held because there was no reliance.
      - text: The six questions for whether a statutory authority owes an affirmative duty in a novel case.
        why: Tempting because the six questions are central this week, but they come from McHugh J in Crimmins (1999), not Heyman.
      - text: Whether s 43A of the Civil Liability Act protects the exercise of special statutory powers.
        why: Impossible on the dates — Heyman was 1985 and the CLA is a 2002 Act. Section 43A arose in RTA v Refrigerated Roadways.
      - text: Whether a landlord owes a duty to a tenant's family for defects in leased premises.
        why: Wrong — that is Jones v Bartlett (2000), in Lecture 2. Heyman concerned a council and its inspection role during construction.
  - key: q009
    type: mcq
    concept: public-authorities-as-defendants
    difficulty: 1
    cases:
      - hill-v-chief-constable-of-west-yorkshire
    stem: What is the starting point for the police's duty of care in the investigation and suppression of crime?
    options:
      - text: A duty is owed to every member of the public who is foreseeably harmed by a crime the police could have prevented.
        why: Tempting because foreseeability is the paradigm test, but for police (as for public authorities generally) foreseeability is not enough — Hill starts from no duty.
      - text: "No duty is owed to individual members of the public: Hill v Chief Constable of West Yorkshire."
        correct: true
        why: Correct — this is the slide's starting point, for reasons of conflicting responsibilities, resource allocation and the risk of defensive policing.
      - text: Police are absolutely immune from negligence claims for anything done in the course of duty.
        why: "Wrong — the slide says it is \"not an immunity\": negligent operational conduct can attract a duty (Zalewski v Turcarolo)."
      - text: A duty is owed only to people who reported a crime and relied on police to act.
        why: Tempting because reliance matters for public authorities, but the slide states the Hill starting point without any reliance exception.
  - key: q010
    type: mcq
    concept: public-authorities-as-defendants
    difficulty: 2
    cases:
      - hill-v-chief-constable-of-west-yorkshire
    contrasts-with:
      - advocates-immunity
    stem: Which reasons did the slide give for the no-duty starting point for police in Hill?
    options:
      - text: Indeterminate liability, the law of contract and loss linked to lawful commercial activity.
        why: Tempting because these are policy reasons too, but they are Topic 7's reasons for caution about pure economic loss, not the police reasons.
      - text: The duty to the court, the waste of court time and the finality of judgment.
        why: Tempting because these are this week's policy reasons for an immunity — but for barristers (Giannarelli v Wraith), not police.
      - text: Conflicting responsibilities, resource allocation and the risk of defensive policing.
        correct: true
        why: Correct — the slide gives exactly these three reasons for the Hill starting point.
      - text: The obviousness of the risk, the plaintiff's intoxication and the cost of fencing.
        why: Wrong — these echo Romeo, an occupier case about an obvious risk; they have nothing to do with why police owe no duty in investigating crime.
  - key: q011
    type: mcq
    concept: public-authorities-as-defendants
    difficulty: 3
    cases:
      - zalewski-v-turcarolo
    stem: Police responding to a call shoot an agitated man during the operation. His family argues the police owed him a duty. Which authority best supports them?
    options:
      - text: Hill v Chief Constable of West Yorkshire — police owe a duty to everyone they deal with in an investigation.
        why: Wrong — Hill is the no-duty starting point for investigating and suppressing crime; it helps the police, not the family.
      - text: Stuart v Kirkland-Veenstra — a statutory power to intervene is itself a duty to exercise it.
        why: "Back to front — the slide uses Stuart for the opposite point: a power to intervene is not of itself a duty to exercise it."
      - text: Zalewski v Turcarolo — negligent operational conduct can attract a duty; Hill is not an immunity.
        correct: true
        why: Correct — the slide gives Zalewski (a police shooting during an operational response; duty owed) as the example of operational conduct attracting a duty.
      - text: Modbury Triangle — an occupier must protect entrants from third parties' violence.
        why: Wrong on both counts — Modbury held there was no such duty, and it concerned a shopping centre occupier, not police conduct.
  - key: q012
    type: mcq
    concept: public-authorities-as-defendants
    difficulty: 3
    variant-of: q011
    cases:
      - hill-v-chief-constable-of-west-yorkshire
    stem: Victims of a serial offender sue the police, arguing that a more careful investigation would have caught him before they were attacked. What is the starting point?
    options:
      - text: A duty is owed, because harm from a careless investigation is reasonably foreseeable.
        why: Tempting because the harm may well be foreseeable, but foreseeability is not sufficient for public authorities, and Hill starts from no duty here.
      - text: A duty is owed, because Zalewski v Turcarolo makes police liable for all operational decisions.
        why: Overstated — Zalewski shows operational conduct can attract a duty; it does not turn the investigation of crime into a duty owed to each potential victim.
      - text: No duty, because the victims' only remedy lies in administrative law against the police.
        why: Tempting because administrative law was mentioned, but the no-duty result comes from Hill's policy reasons, not from administrative law displacing tort.
      - text: No duty to individual members of the public in investigating and suppressing crime (Hill).
        correct: true
        why: "Correct — this is squarely the Hill starting point: conflicting responsibilities, resource allocation and the risk of defensive policing."
  - key: q013
    type: mcq
    concept: public-authorities-as-defendants
    difficulty: 2
    cases:
      - stuart-v-kirkland-veenstra
    stem: What point did the Topic 8 slide take from Stuart v Kirkland-Veenstra (recalled from Topic 6)?
    options:
      - text: Police owe a duty to keep monitoring any person they have spoken to who may be at risk.
        why: Wrong — that is the argument the case rejects; the police were not obliged to keep watching or to apprehend him simply because they could have.
      - text: A statutory power to intervene is not of itself a duty to exercise it.
        correct: true
        why: "Correct — this is the slide's point, consistent with Amaca and CLA s 46: having a power does not of itself create a duty to use it."
      - text: Police are immune from negligence in every dealing with members of the public.
        why: Wrong — the police slide says the Hill rule is not an immunity; operational conduct can attract a duty (Zalewski).
      - text: A person who denies any suicidal intent consents to any later harm to himself.
        why: Wrong — consent is a defence to intentional torts (Topic 4); the case is used for whether a duty exists, not for a consent defence.
  - key: q014
    type: mcq
    concept: public-authorities-as-defendants
    difficulty: 3
    contrasts-with:
      - laws2400-w06-omissions-and-control-of-others
    stem: Why is a complaint that a public authority failed to exercise a power especially problematic?
    options:
      - text: It is an omission, and more than foreseeability is needed to make an authority act.
        correct: true
        why: Correct — the lecture says failure to exercise a power is an omission, which "starts to become really problematic"; more than foreseeability is needed.
      - text: Because omissions can only ever be remedied in contract law, never in the law of tort.
        why: Wrong — omissions can found a duty in tort in the right circumstances (Topic 6's Hargrave v Goldman; Crimmins here); contract is not the only route.
      - text: Because the Civil Liability Act makes public authorities immune for all omissions.
        why: Overstated — Part 5 limits liability (for example s 44 for regulatory functions), but it does not create a blanket immunity for every omission.
      - text: Because an omission can never be a cause of harm in law.
        why: Wrong — omissions can cause harm; the problem the lecture identifies is whether a duty to act exists, not causation.
  - key: q015
    type: mcq
    concept: public-authorities-as-defendants
    difficulty: 2
    stem: Which statement best captures the lecturer's view of reasonable foreseeability for public authority defendants?
    options:
      - text: It is irrelevant, because public authority duties turn entirely on the statute.
        why: Wrong — the lecturer says foreseeability is "always needed"; McHugh J's first question is foreseeability. The statute matters, but it is not everything.
      - text: It is enough on its own, as in the paradigm case of an act causing physical injury.
        why: Tempting because that is the paradigm, but the lecture opens by saying that with special parties "we need more than reasonable foreseeability".
      - text: It is always needed, but for a public authority it is not sufficient — more is required.
        correct: true
        why: Correct — "reasonable foreseeability is always needed, but in the case of a statutory authority or a public authority, it is not sufficient. We need more."
      - text: It is presumed once the plaintiff shows the authority had a relevant statutory power.
        why: Wrong — having a power does not do the work for the plaintiff; Amaca and s 46 say powers and their exercise do not of themselves create a duty.
  - key: q016
    type: mcq
    concept: public-authorities-as-defendants
    difficulty: 3
    contrasts-with:
      - laws2400-w03-trespass-to-land-elements
    stem: Police enter Dana's house under a warrant and search it. Dana thinks they had no lawful authority to be there. According to the lecture, how is her complaint best framed?
    options:
      - text: As negligence by a public authority, applying McHugh J's six questions.
        why: Tempting because the police are a public authority, but the lecturer said entry and search complaints are mainly intentional torts, not duty of care questions.
      - text: "Mainly as an intentional tort (trespass: lawful authority), not a duty question."
        correct: true
        why: "Correct — the lecturer said \"the intentional tort's not duty of care\": whether police had lawful authority to be there is a trespass question."
      - text: As a breach of s 43 CLA, since entering a house is a special statutory power.
        why: Mixed up — s 43 deals with breach of statutory duty and s 43A with special statutory powers; neither turns this trespass complaint into negligence.
      - text: It cannot be framed in tort at all, because police entry raises only administrative law.
        why: Wrong — trespass to land is a tort (Topic 3) and police can commit it; administrative law is a separate avenue, not the only one.
  - key: q017
    type: truefalse
    concept: public-authorities-as-defendants
    difficulty: 1
    set: quickfire
    statement: There is still Crown immunity from tortious liability, so the State cannot be sued in negligence.
    answer: false
    why: False — the slides say there is no Crown immunity now from tortious liability, so public authorities may be sued for negligence or other torts, though the threshold is higher.
  - key: q018
    type: truefalse
    concept: public-authorities-as-defendants
    difficulty: 1
    set: quickfire
    statement: In the lecture's account, high-level policy decisions are "pretty much off limits" for a duty of care, because setting policy is the executive's job.
    answer: true
    why: True — the lecturer said policy is pretty much off limits because of the separation of powers; operational negligence is more likely to be arguable.
  - key: q019
    type: truefalse
    concept: public-authorities-as-defendants
    difficulty: 2
    set: quickfire
    cases:
      - hill-v-chief-constable-of-west-yorkshire
      - zalewski-v-turcarolo
    statement: The Hill starting point means police can never owe a duty of care to a member of the public.
    answer: false
    why: "False — the slide says Hill is \"not an immunity\": negligent operational conduct can attract a duty, as in Zalewski v Turcarolo (a police shooting during an operational response)."
  - key: q020
    type: match
    concept: public-authorities-as-defendants
    difficulty: 2
    prompt: Match each authority to the point the Topic 8 slides use it for.
    pairs:
      - left: Hill v Chief Constable of West Yorkshire
        right: No duty to individual members of the public in investigating and suppressing crime
      - left: Zalewski v Turcarolo
        right: Negligent operational police conduct can attract a duty
      - left: Stuart v Kirkland-Veenstra
        right: A statutory power to intervene is not of itself a duty to exercise it
      - left: Sutherland Shire Council v Heyman
        right: Policy vs operation distinction and general reliance
      - left: Anns v Merton London Borough Council
        right: Before it, UK authorities were not liable for failing to exercise a power
  - key: q021
    type: mcq
    concept: crimmins-and-mchugh-six-questions
    difficulty: 1
    cases:
      - crimmins-v-stevedoring-industry-finance-committee
    stem: In Crimmins v Stevedoring Industry Finance Committee, what was the Authority's relationship to Crimmins?
    options:
      - text: It was his direct employer, which is why a duty of care was obvious.
        why: Wrong — the lecturer stressed the Authority was not Crimmins's employer. If it had been, a duty would have been much easier to establish.
      - text: It was the regulator directing waterside workers where to work.
        correct: true
        why: Correct — the Authority regulated stevedoring and directed workers where to work; it sat on top of the employers, which is what made the duty question hard.
      - text: It was the manufacturer and supplier of the asbestos cargoes he unloaded.
        why: Tempting because asbestos was the cause, but the slides describe the Authority as the regulator of stevedoring operations, not a manufacturer.
      - text: It was the occupier of the Port Melbourne wharves where he was working.
        why: Wrong — occupier liability rests on control of land; the Authority's role was regulatory and supervisory, directing where workers went.
  - key: q022
    type: mcq
    concept: crimmins-and-mchugh-six-questions
    difficulty: 1
    cases:
      - crimmins-v-stevedoring-industry-finance-committee
    stem: What harm did Crimmins suffer?
    options:
      - text: A back injury from lifting cargo without the proper equipment.
        why: Wrong — the slide says he was diagnosed in 1997 with mesothelioma caused by unloading asbestos cargoes, not a lifting injury.
      - text: Mesothelioma caused by unloading asbestos cargoes.
        correct: true
        why: "Correct — the slide: in 1997 Crimmins was diagnosed with mesothelioma caused by unloading asbestos cargoes at Port Melbourne in 1961–65."
      - text: Hepatitis A from contaminated food supplied on the wharf.
        why: Tempting if you mix it up with Graham Barclay Oysters (contaminated oysters), but Crimmins's disease came from asbestos.
      - text: Psychiatric harm after witnessing an accident at the port.
        why: Wrong — this is not a mental harm case (Topic 6); Crimmins suffered a physical disease, mesothelioma, from asbestos exposure.
  - key: q023
    type: mcq
    concept: crimmins-and-mchugh-six-questions
    difficulty: 2
    cases:
      - crimmins-v-stevedoring-industry-finance-committee
    stem: Why was the Stevedoring Industry Finance Committee (SIFC), rather than the Authority, the defendant in Crimmins?
    options:
      - text: The SIFC was Crimmins's employer and supplied his safety equipment.
        why: Wrong — the individual employers had to supply safety equipment; the SIFC was the body that took over the abolished Authority's liabilities.
      - text: The SIFC had replaced the Authority before Crimmins began work in 1961.
        why: Wrong on the facts — the Authority directed Crimmins in 1961–65 and was abolished later; only then did the SIFC assume its liabilities.
      - text: The Authority was abolished and the SIFC assumed its liabilities.
        correct: true
        why: "Correct — the slides pose both questions: did the Authority owe a duty, and did its liability pass to the SIFC? The SIFC stands in the Authority's shoes."
      - text: The Authority was immune from suit, so Crimmins had to sue its funding body instead.
        why: Wrong — there was no immunity; the SIFC was sued because it assumed the abolished Authority's liabilities.
  - key: q024
    type: mcq
    concept: crimmins-and-mchugh-six-questions
    difficulty: 2
    cases:
      - crimmins-v-stevedoring-industry-finance-committee
    stem: Which reasons did the slides give for the High Court finding a duty in Crimmins?
    options:
      - text: It had an overarching supervisory and regulatory role regarding safety.
        correct: true
        why: "Correct — these are the two points on the slide: the Authority's overarching supervisory and regulatory role over safety, and the employers' obligation to supply equipment."
      - text: The Authority had manufactured and supplied the asbestos, making it a manufacturer–consumer case.
        why: Wrong — that would be an established category (Donoghue v Stevenson), but the Authority was a regulator, which is why the case was novel.
      - text: Crimmins had paid the Authority for safety advice and relied on its written assurance.
        why: Tempting because reliance matters in this area, but the slides rest the duty on supervisory control, knowledge and vulnerability, not paid advice.
      - text: The Authority had made a core policy decision about respirators, which courts readily review.
        why: Back to front — core policy and quasi-legislative functions point against a duty (McHugh J's fifth question; Hayne J's dissent).
  - key: q025
    type: mcq
    concept: crimmins-and-mchugh-six-questions
    difficulty: 2
    cases:
      - crimmins-v-stevedoring-industry-finance-committee
    stem: According to McHugh J, why was Crimmins "specially vulnerable"?
    options:
      - text: Because he had no knowledge of the dangers of asbestos and could not read the warnings.
        why: Tempting because ignorance of risk sounds like vulnerability, but McHugh J located it in the terms of his work, not his knowledge or literacy.
      - text: Because he belonged to the public at large rather than a specific class of persons.
        why: Back to front — belonging to a specific class (directed waterside workers) supports a duty; the public at large points against one (Graham Barclay).
      - text: Because he had already been diagnosed with a lung disease when he started work.
        why: Wrong — he was diagnosed in 1997, decades after the work. Vulnerability here means inability to protect himself from the Authority's want of care.
      - text: His casual employment and his obligation to obey its directions about where to work.
        correct: true
        why: "Correct — McHugh J: \"The worker's vulnerability arose as a result of the casual nature of his employment and his obligation to obey the authority's directions\"."
  - key: q026
    type: mcq
    concept: crimmins-and-mchugh-six-questions
    difficulty: 2
    cases:
      - crimmins-v-stevedoring-industry-finance-committee
    stem: McHugh J's statement of why a duty was owed in Crimmins combines three features. Which set matches it?
    options:
      - text: Foreseeability, causation and remoteness of damage.
        why: Tempting because these are negligence elements, but causation and remoteness come later; McHugh J was explaining why a duty existed.
      - text: Knowledge of the risk, control by directing him where to work, and his special vulnerability.
        correct: true
        why: Correct — the lecturer reads the statement for knowledge ("was, or ought to have been, aware"), control (directions) and vulnerability.
      - text: An assumption of responsibility, reliance on advice, and a disclaimer.
        why: Tempting because these are Topic 7 negligent misstatement features, but Crimmins was a physical injury case about directions, not words.
      - text: Obviousness of the risk, voluntary assumption of risk, and the worker's own contributory negligence.
        why: Wrong — these go to defences and obvious risk (CLA Part 1A), not to why the Authority owed Crimmins a duty.
    contrasts-with:
      - laws2400-w07-esanda-and-misstatement-salient-features
  - key: q027
    type: mcq
    concept: crimmins-and-mchugh-six-questions
    difficulty: 1
    stem: McHugh J's first question asks whether injury from an act or omission of the defendant was reasonably foreseeable. What does it expressly include?
    options:
      - text: Only positive acts done in carrying out a policy.
        why: Wrong — the question expressly covers omissions, including a failure to exercise statutory powers, which is the core of many public authority cases.
      - text: A failure to exercise its statutory powers.
        correct: true
        why: Correct — question 1 reads "an act or omission of the defendant, including a failure to exercise its statutory powers".
      - text: Only harm to people the authority employs directly.
        why: Wrong — Crimmins was not employed by the Authority; the question is about foreseeable injury to the plaintiff, whoever employs them.
      - text: Only harm caused deliberately by third parties.
        why: Wrong — that is the third-party topic (Dorset Yacht, Modbury). McHugh J's first question is about the authority's own act or omission.
  - key: q028
    type: mcq
    concept: crimmins-and-mchugh-six-questions
    difficulty: 2
    set: pretest
    stem: McHugh J's second question asks whether, by reason of its statutory obligations, the defendant had the power to protect whom from a risk of harm?
    options:
      - text: The public at large, since public authorities act in the public interest.
        why: Tempting because authorities serve the public, but the question deliberately says "rather than the public at large"; powers for the public generally point away from a duty.
      - text: Anyone who could foreseeably be harmed, however large or undefined the group.
        why: Wrong — that collapses question 2 into question 1. The point is a defined, specific class, which also guards against indeterminate liability.
      - text: Only those who have contracted with the authority for its services.
        why: Wrong — contract is not the test; Crimmins had no contract with the Authority, yet he belonged to the specific class it could protect.
      - text: A specific class including the plaintiff, rather than the public at large.
        correct: true
        why: Correct — question 2 asks about the power to protect "a specific class including the plaintiff (rather than the public at large)".
  - key: q029
    type: mcq
    concept: crimmins-and-mchugh-six-questions
    difficulty: 2
    stem: In McHugh J's third question, what does "vulnerable" mean?
    options:
      - text: The plaintiff could not reasonably be expected to adequately safeguard herself from harm.
        correct: true
        why: Correct — this is the wording of question 3; Amaca puts it as inability to protect oneself from the defendant's want of care.
      - text: The plaintiff was young, elderly or otherwise physically frail.
        why: Tempting because that is the everyday meaning, but legal vulnerability is about the ability to self-protect — Crimmins was a working adult.
      - text: The plaintiff suffered a more serious injury than an ordinary person in the same position would have.
        why: Wrong — that sounds like the eggshell skull idea (remoteness), not vulnerability at the duty stage.
      - text: The plaintiff had no insurance and could not afford to bear the loss.
        why: Wrong — insurance and wealth are not mentioned in the question; it asks whether the plaintiff could reasonably safeguard herself from the harm.
  - key: q030
    type: mcq
    concept: crimmins-and-mchugh-six-questions
    difficulty: 3
    contrasts-with:
      - public-authorities-as-defendants
    stem: Under McHugh J's fifth question, if a duty would impose liability for the authority's "core policy making" or "quasi-legislative" functions, what does that indicate?
    options:
      - text: "It points towards a duty: the more important the function, the more care is owed."
        why: Tempting because important functions sound weighty, but the lecturer asked whether policy makes a duty more or less likely — the answer was less.
      - text: It points against a duty — the questions need not all be answered "yes" for a duty.
        correct: true
        why: "Correct — the lecturer stressed you must understand the substance: a \"yes\" to question 5 (core policy) tells against a duty, linking back to the policy/operations line."
      - text: It is irrelevant at the duty stage and comes in only under breach.
        why: Wrong — it is one of McHugh J's questions for whether a duty exists; Hayne J relied on it to deny a duty altogether.
      - text: It means s 43A of the Civil Liability Act applies and the authority is liable.
        why: Mixed up — Crimmins (1999) predates the CLA, and s 43A, where it applies, raises the bar for liability rather than making an authority liable.
  - key: q031
    type: mcq
    concept: crimmins-and-mchugh-six-questions
    difficulty: 2
    stem: Which is McHugh J's sixth question?
    options:
      - text: Did the plaintiff rely on a statement made by the defendant?
        why: Tempting because reliance is a salient feature, but it is not one of McHugh J's six questions as stated on the slide.
      - text: Was the risk of harm obvious to a reasonable person in the plaintiff's position?
        why: Wrong — that is the CLA s 5F definition of obvious risk (Topic 6), not part of McHugh J's test for an affirmative public authority duty.
      - text: Are there any other supervening reasons in policy to deny a duty of care?
        correct: true
        why: Correct — question 6 is the catch-all policy question; the lecturer gave indeterminate liability as an example of such a reason.
      - text: Did the defendant take reasonable steps to remove the danger?
        why: Wrong — reasonable steps go to breach (or to discharging a landlord's duty in Jones v Bartlett), not to whether a public authority owes a duty.
  - key: q032
    type: mcq
    concept: crimmins-and-mchugh-six-questions
    difficulty: 3
    cases:
      - crimmins-v-stevedoring-industry-finance-committee
    stem: Hayne J dissented in Crimmins. What was his reasoning?
    options:
      - text: No duty, because Crimmins's mesothelioma was not caused by the asbestos he unloaded.
        why: Wrong — causation was not the basis of the dissent; the slides record that the mesothelioma was caused by unloading asbestos cargoes.
      - text: No duty in deciding whether to use the quasi-legislative power to order respirators.
        correct: true
        why: "Correct — Hayne J: no duty \"in deciding whether or not to exercise that … quasi-legislative power\", because a duty \"would have affected the way in which the body went about its task\"."
      - text: No duty, because liability could not pass from the abolished Authority to the SIFC.
        why: Wrong — the slides quote Hayne J on the quasi-legislative power, not on succession of liability.
      - text: A duty was owed, but it was not breached, because employers supplied safety equipment.
        why: Wrong — Hayne J rejected that any duty was owed at all; he did not reach breach.
  - key: q033
    type: mcq
    concept: crimmins-and-mchugh-six-questions
    difficulty: 2
    stem: The slides say judges in the Crimmins majority disagreed on method. About what?
    options:
      - text: Whether to apply the House of Lords' Anns two-stage test or its later Caparo three-stage test.
        why: "Wrong — Australian courts did not adopt either test (Topic 5); the majority's disagreement was about where to start: common law or statute."
      - text: Whether to start with the common law, or begin by interpreting the statute.
        correct: true
        why: "Correct — the slide: \"start with the common law and then look at the statute OR begin with an interpretation of the statute\"."
      - text: Whether vulnerability or foreseeability should be considered first.
        why: Wrong — foreseeability is always needed and comes first in McHugh J's list; the disagreement was about the role of the statute.
      - text: Whether the CLA or the Dust Diseases Tribunal Act applied to the claim.
        why: Wrong — Crimmins was decided in 1999, before the Civil Liability Act 2002 existed.
  - key: q034
    type: mcq
    concept: crimmins-and-mchugh-six-questions
    difficulty: 3
    variant-of: q026
    stem: A statutory port authority allocates casual labourers to berths each day and may order protective equipment. It knows fumigation chemicals at Berth 4 are hazardous but issues no order. A labourer who would lose work if he refused a direction is injured at Berth 4. Which of McHugh J's questions most clearly favour a duty?
    options:
      - text: Question 5, because deciding whether to issue protective orders is always core policy.
        why: Tempting because Hayne J called the respirator power quasi-legislative, but question 5 answered "yes" points against a duty, not towards one.
      - text: "Questions 2–4: a specific class, his vulnerability, and the authority's knowledge."
        correct: true
        why: "Correct — like Crimmins: the authority directs a defined class, a casual worker who must obey cannot safeguard himself, and the authority knew of the hazard."
      - text: None — the authority is not the employer, so McHugh J's questions cannot apply.
        why: Wrong — the Authority in Crimmins was not the employer either; the six questions are designed for exactly this kind of regulator.
      - text: Only question 1, because foreseeability is sufficient once a statutory power exists.
        why: Wrong — foreseeability is necessary but not sufficient for a public authority, and a power alone does not create a duty.
  - key: q035
    type: mcq
    concept: crimmins-and-mchugh-six-questions
