        authorities: []
      - id: r4
        criterion: Distinguishes Modbury and concludes for each group
        marks: 2
        top-band: Contrasts control here with no control in Modbury and gives separate conclusions for boat owners and householders.
        margin-note: Clear, separated conclusions.
        authorities: []
