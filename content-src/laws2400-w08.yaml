  - key: q075
    type: mcq
    concept: cla-part-5-public-authorities
    difficulty: 2
    cases:
      - rta-v-refrigerated-roadways
    stem: What was the final outcome in RTA v Refrigerated Roadways?
    options:
      - text: The RTA owed no duty, following Modbury Triangle.
        why: Wrong — the Court of Appeal distinguished Modbury Triangle and held the RTA did owe a duty.
      - text: The RTA owed a duty but did not breach it.
        correct: true
        why: Correct — a duty was owed, but it had not been shown that the RTA failed to take reasonable steps to prevent the risk of harm.
      - text: The RTA owed a duty and breached it, so damages were awarded.
        why: Tempting because the duty was established, but the slide says the Court held there was no breach, so no damages followed.
      - text: The claim failed because s 44 barred liability for regulatory functions.
        why: Wrong — erecting screens is not a function to prohibit or regulate an activity; the claim failed on breach.
  - key: q076
    type: mcq
    concept: cla-part-5-public-authorities
    difficulty: 2
    stem: Section 44 says an authority is not liable for failing to exercise a function to prohibit or regulate an activity unless what?
    options:
      - text: The plaintiff relied on the authority to regulate the activity.
        why: Tempting because reliance matters at common law, but s 44's exception turns on whether the plaintiff could have compelled the function.
      - text: It could have been required to exercise the function in proceedings instituted by the plaintiff.
        correct: true
        why: "Correct — s 44(1): no liability \"if the authority could not have been required to exercise the function in proceedings instituted by the plaintiff\"."
      - text: It knew that harm would result from not regulating.
        why: Wrong — knowledge is not the exception (and Amaca says knowledge alone does not create a duty).
      - text: It had exercised the function on earlier occasions.
        why: Wrong — past exercise does not matter (s 46; Amaca proposition 4).
  - key: q077
    type: mcq
    concept: cla-part-5-public-authorities
    difficulty: 3
    variant-of: q076
    stem: A council refuses even to consider cancelling a café's food licence despite complaints, and a customer is poisoned. The customer could not have compelled the council to act. Which section most directly answers the claim?
    options:
      - text: Section 43A — licensing decisions are always special statutory powers that only the council holds.
        why: Tempting because the lecturer mentioned firearm licences, but the provision that squarely covers licensing functions is s 44(2).
      - text: Section 44 — licensing is regulatory, and the plaintiff could not have compelled it.
        correct: true
        why: Correct — s 44(2) treats licensing functions as regulatory; under s 44(1), failing to exercise or consider exercising them is not actionable here.
      - text: Section 41 — councils are excluded from the definition of public authority.
        why: Wrong — s 41(d) expressly includes local councils, so the council is squarely within Part 5.
      - text: Section 46 — once a licence is issued, the council must keep supervising.
        why: Back to front — s 46 says exercising a function does not of itself create a duty to keep exercising it.
  - key: q078
    type: mcq
    concept: cla-part-5-public-authorities
    difficulty: 2
    stem: What does s 46 CLA provide?
    options:
      - text: Once an authority exercises a function, it must keep exercising it with reasonable care.
        why: Back to front — s 46 says the exercise of a function does not of itself indicate a duty to exercise it.
      - text: An authority that decides not to exercise a function is automatically in breach.
        why: Wrong — nothing in Part 5 makes a decision not to act an automatic breach; the Part limits liability.
      - text: Exercising a function does not of itself indicate a duty to exercise it.
        correct: true
        why: "Correct — s 46: it does not indicate a duty \"to exercise the function or that the function should be exercised in particular circumstances or in a particular way\"."
      - text: Exercising a function in good faith gives complete immunity from civil liability.
        why: Wrong — good faith is not the test, and Part 5 does not confer complete immunity.
