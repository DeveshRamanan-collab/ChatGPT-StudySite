cards:
  - type: basic
    concept: public-authorities-as-defendants
    front: What is a public authority?
    back: A body created by statute to perform certain public functions or act in the public interest.
    source: Topic 8 Lecture 1, slide 4
  - type: basic
    concept: public-authorities-as-defendants
    front: What three differences do the slides list between a private person and a public authority as a defendant?
    back: The nature and responsibilities of public authorities; they exercise their functions as per statutory provisions; courts take note of public policy considerations relevant to them.
    source: Topic 8 Lecture 1, slide 6
  - type: cloze
    concept: public-authorities-as-defendants
    text: Policy decisions are pretty much {{c1::off limits}} for a duty of care; negligence in {{c2::operations}} is more arguable.
    source: Topic 8 Lecture 1 (lecture), slide 7
  - type: basic
    concept: public-authorities-as-defendants
    front: "Police: what is the starting point, and is it an immunity?"
    back: "No duty to individual members of the public in the investigation and suppression of crime (Hill v Chief Constable of West Yorkshire) — but not an immunity: negligent operational conduct can attract a duty (Zalewski v Turcarolo)."
    source: Topic 8 Lecture 1, slide 34
  - type: basic
    concept: crimmins-and-mchugh-six-questions
    front: Why did the High Court find a duty in Crimmins?
    back: The Authority/SIFC had an overarching supervisory and regulatory role regarding safety; individual employers were required to supply safety equipment.
    source: Topic 8 Lecture 1, slide 9
  - type: basic
    concept: crimmins-and-mchugh-six-questions
    front: List McHugh J's six questions (Crimmins).
    back: 1 Foreseeability (incl. failure to exercise powers); 2 power to protect a specific class; 3 vulnerability; 4 knowledge of the risk; 5 core policy / quasi-legislative function; 6 other supervening policy reasons.
    source: Topic 8 Lecture 1, slides 12–13
  - type: cloze
    concept: crimmins-and-mchugh-six-questions
    text: "McHugh J: Crimmins was specially vulnerable because of the {{c1::casual nature of his employment}} and his obligation to {{c2::obey the authority's directions}} as to where he worked."
    source: Topic 8 Lecture 1, slide 10
  - type: apply
    concept: crimmins-and-mchugh-six-questions
    scenario: A statutory body directs casual workers to sites it knows are hazardous; a worker who must obey or lose work is injured.
    answer: "Novel public authority duty: run McHugh J's six questions — specific class, vulnerability, knowledge all point to a duty, as in Crimmins."
    source: Topic 8 Lecture 1, slides 8–13
  - type: basic
    concept: control-and-vulnerability-graham-barclay-and-amaca
    front: "Graham Barclay Oysters: who owed no duty, and why (Gleeson CJ)?"
    back: The Council and the NSW government. The complaint was about omissions; a court has no criterion to judge a decision to allow industry self-regulation; the Council's powers were for the public generally, not a specific class.
    source: Topic 8 Lecture 1, slides 16–18
  - type: cloze
    concept: control-and-vulnerability-graham-barclay-and-amaca
    text: "Gummow and Hayne JJ: \"the factor of {{c1::control}} is of fundamental importance\"."
    source: Topic 8 Lecture 1, slide 18
  - type: basic
    concept: control-and-vulnerability-graham-barclay-and-amaca
    front: State the five Amaca propositions.
    back: 1 Totality of the relationship; 2 control includes control of any situation containing a risk of harm; 3 no duty merely because the authority might have prevented harm; 4 powers and their prior exercise create no duty to exercise them in future; 5 knowledge alone is not enough.
    source: Topic 8 Lecture 1, slides 20–21
  - type: apply
    concept: control-and-vulnerability-graham-barclay-and-amaca
    scenario: A State leaves an industry to self-regulate; a consumer harmed by a business in that industry sues the State for not regulating.
    answer: "Likely no duty: omission plus a policy choice (Graham Barclay Oysters); power and knowledge are not enough (Amaca); the business has the control."
    source: Topic 8 Lecture 1, slides 15–22
  - type: basic
    concept: cla-part-5-public-authorities
    front: What threshold did the Ipp Committee recommend for public authorities, and where is it from?
    back: Liability only for acts so unreasonable that no reasonable public authority would take them — drawn from Wednesbury unreasonableness in administrative law.
    source: Topic 8 Lecture 1, slide 23
  - type: basic
    concept: cla-part-5-public-authorities
    front: What does CLA s 42 provide?
    back: Functions are limited by the resources reasonably available; the general allocation of resources is not open to challenge; functions are judged by the broad range of activities; compliance with procedures is evidence of proper exercise.
    source: Topic 8 Lecture 1, slide 26
  - type: cloze
    concept: cla-part-5-public-authorities
    text: Under s 44, an authority is not liable for failing to exercise a function to prohibit or regulate an activity unless it could have been {{c1::required to exercise the function in proceedings instituted by the plaintiff}}.
    source: Topic 8 Lecture 1, slide 28
  - type: apply
    concept: cla-part-5-public-authorities
    scenario: An authority is sued for failing to put screens on an overpass; it relies on s 43A.
    answer: "Section 43A will not help: erecting screens is not a special statutory power — anybody can erect a screen (RTA v Refrigerated Roadways)."
    source: Topic 8 Lecture 1, slide 33
  - type: basic
    concept: third-party-conduct-dorset-yacht-and-modbury
    front: When will a defendant owe a duty for a third party's conduct?
    back: Only in certain circumstances, usually a pre-existing relationship (defendant–plaintiff or defendant–third party) or a situation of control.
    source: Topic 8 Lecture 2, slide 18
  - type: basic
    concept: third-party-conduct-dorset-yacht-and-modbury
    front: "Dorset Yacht: why a duty, and how was its scope limited?"
    back: Foreseeable damage on escape plus the officers' control over the boys; limited to damage in the vicinity immediately after escape — none for damage while at large (policy).
    source: Topic 8 Lecture 2, slide 19
  - type: cloze
    concept: third-party-conduct-dorset-yacht-and-modbury
    text: Modbury Triangle distinguished {{c1::creating a risk of harm}} from merely {{c2::failing to prevent harm caused by someone else}}.
    source: Topic 8 Lecture 2, slide 20
  - type: apply
    concept: third-party-conduct-dorset-yacht-and-modbury
    scenario: An occupier's car park lights go off on a timer and a stranger assaults a lawful entrant.
    answer: "Likely no duty to protect from a third party's crime: no control over the attacker, no protective relationship, risk not created (Modbury Triangle)."
    source: Topic 8 Lecture 2, slide 20
  - type: basic
    concept: landlords-occupiers-and-trespassers
    front: What happened to the rule in Cavalier v Pope?
    back: Its rule that landlords owe no duty for defective premises was rejected by the High Court in Northern Sandblasting Pty Ltd v Harris (1997).
    source: Topic 8 Lecture 2, slide 3
  - type: cloze
    concept: landlords-occupiers-and-trespassers
    text: "Jones v Bartlett: the landlord's duty is discharged by reasonable steps to {{c1::ascertain}} defects and reasonable steps to {{c2::remove them or make the premises safe}}."
    source: Topic 8 Lecture 2, slide 6
  - type: basic
    concept: landlords-occupiers-and-trespassers
    front: What did Commissioner for Railways v Cardy say about trespassers?
    back: A person trespasses at their own risk; the occupier's only duty is to refrain from intentional or wanton harm. The position is now unresolved, trending to more responsibility on the trespasser.
    source: Topic 8 Lecture 2, slide 9
  - type: apply
    concept: landlords-occupiers-and-trespassers
    scenario: A landlord never inspects; a visibly rotten deck collapses and injures the tenant's guest.
    answer: Duty owed to other entrants (narrower than an occupier's) under Jones v Bartlett; no reasonable steps to ascertain an obvious defect — likely breach.
    source: Topic 8 Lecture 2, slides 4–7
  - type: basic
    concept: advocates-immunity
    front: What does the advocates' immunity cover?
    back: Barristers' negligence in the conduct of cases in court, and pre-trial matters intimately connected with the case in court.
    source: Topic 8 Lecture 2, slide 10
  - type: basic
    concept: advocates-immunity
    front: "Giannarelli v Wraith: three policy reasons for the immunity?"
    back: Duty to the court may conflict with duty to the client; waste of court time on defensive arguments; finality of judgment.
    source: Topic 8 Lecture 2, slide 10
  - type: apply
    concept: advocates-immunity
    scenario: A solicitor misses a limitation date and the client's claim is statute barred.
    answer: No immunity — solicitors can be sued for negligence in acting for clients; the immunity concerns barristers' conduct of cases in court.
    source: Topic 8 Lecture 2 (lecture), slide 10
  - type: basic
    concept: children-parents-and-the-unborn
    front: "Smith v Leurs: what was decided?"
    back: "Parents owed others a duty to control their 13-year-old, but it was not breached: they had told him not to use the sling shot outside their home."
    source: Topic 8 Lecture 2, slide 11
  - type: cloze
    concept: children-parents-and-the-unborn
    text: Parents may become liable to the child if the child is {{c1::led into danger}} by their actions (Hahn v Conley).
    source: Topic 8 Lecture 2, slide 14
  - type: basic
    concept: children-parents-and-the-unborn
    front: Distinguish wrongful conception, wrongful birth and wrongful life.
    back: "Conception (parents): would not have conceived but for negligence. Birth (parents): pregnancy would have been terminated but for negligence. Life (child): pregnancy should have been terminated because of handicap."
    source: Topic 8 Lecture 2, slide 16
  - type: apply
    concept: children-parents-and-the-unborn
    scenario: A child injured in the womb by a negligent driver is later born alive.
    answer: The child can bring an action for pre-natal injuries, because she was later born alive.
    source: Topic 8 Lecture 2, slide 15
audio:
  title: Week 8 recap — special parties
  minutes: 3
  script: |-
    This week is about special parties, where reasonable foreseeability is always needed but never enough.

    Start with public authorities: bodies created by statute to perform public functions. There's no Crown immunity any
    more, so they can be sued, but they're different from private defendants. They act under statute, and courts worry
    about resources and the separation of powers: a court shouldn't tell the executive where to spend limited money.
    Heyman gives us the policy versus operations line. High-level policy, like letting an industry regulate itself, is
    pretty much off limits; operational negligence is more arguable.

    Crimmins found a duty. The Stevedoring Authority wasn't the employer, but it directed casual workers where to work,
    knew the risks, and the worker was vulnerable because he had to obey. McHugh J's six questions are foreseeability, a
    specific class, vulnerability, knowledge, core policy functions and other policy reasons. Not all need a yes; the last
    two point away from a duty.

    Graham Barclay Oysters found no duty for the council or the State. The complaint was about omissions, self-regulation
    was a policy choice, the council's powers served the public generally, and control was lacking. Amaca adds five
    propositions: look at the whole relationship; control of a risky situation counts; but a power, its past use, or
    knowledge of harm is not enough on its own.

    The Civil Liability Act Part 5 then narrows things. Section 41 says who's an authority. Section 42 says resources limit
    functions and their allocation can't be challenged. Sections 43 and 43A set the "so unreasonable" Wednesbury bar.
    Section 44 protects failures to regulate, including licensing, and section 46 says exercising a function doesn't
    create a duty to exercise it. In Refrigerated Roadways the RTA owed a duty about concrete dropped from an overpass,
    section 43A didn't apply because anyone can put up a screen, but there was no breach. For police, Hill says no duty in
    investigating crime, but Zalewski shows operational conduct can attract one.

    Lecture two. Landlords now owe a duty: Jones v Bartlett says premises must be reasonably fit for habitation, and
    reasonable steps to find and fix defects discharge it. Occupiers owe lawful entrants a duty; Cardy says trespassers
    enter at their own risk. Barristers are immune for conduct in court, for reasons of conflicting duties, court time and
    finality, but solicitors can be sued. Parents may owe others a duty to control their child, as in Smith v Leurs, and
    can be liable to the child if they lead it into danger, which Hahn v Conley didn't find. Finally, third parties:
    Dorset Yacht found a duty from control, limited to the immediate vicinity; Modbury found none for a stranger's crime.
