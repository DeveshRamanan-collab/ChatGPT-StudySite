  - key: q041
    type: short
    concept: crimmins-and-mchugh-six-questions
    difficulty: 3
    cases:
      - crimmins-v-stevedoring-industry-finance-committee
    prompt: The Coastal Diving Authority, a statutory body, allocates casual divers to dive sites each morning and has power to order the use of safety lines. It has received several reports that Site 9 has dangerous currents, but it issues no order and keeps sending divers there. Mai, a casual diver who would lose her shifts if she refused a direction, is swept against rocks at Site 9 and injured. Advise whether the Authority owed Mai a duty of care at common law.
    model: "The issue is whether a statutory authority owes an affirmative duty of care to a worker it directs but does not employ. Reasonable foreseeability is always needed but is not sufficient for a public authority. McHugh J's six questions in Crimmins v Stevedoring Industry Finance Committee guide the inquiry. Injury to divers sent to a site with known dangerous currents, including from a failure to order safety lines, was reasonably foreseeable (Q1). The Authority's powers to allocate divers and order equipment let it protect a specific class — the casual divers it directs — rather than the public at large (Q2). Mai was vulnerable: like Crimmins, a casual worker who must obey directions or lose work could not reasonably safeguard herself (Q3). The Authority knew of the risk from the reports (Q4). Against a duty, it may argue that ordering safety lines is quasi-legislative (Q5), as Hayne J reasoned in dissent; but directing divers to a known dangerous site reflects the supervisory control the majority relied on. No other policy reason clearly denies a duty (Q6). Because the facts sit close to Crimmins — control, knowledge, vulnerability — a duty is likely; CLA Part 5 should then be considered."
    rubric:
      - id: r1
        criterion: "Identifies the issue: an affirmative duty owed by a statutory authority that is not the employer"
        marks: 2
        top-band: Frames it as a novel public authority case and says foreseeability is necessary but not sufficient.
        margin-note: Good framing — you saw why this is harder than an employer case.
        authorities: []
      - id: r2
        criterion: "States the law: McHugh J's six questions in Crimmins"
        marks: 3
        top-band: Sets out the questions accurately (specific class, vulnerability, knowledge, core policy, other policy) and notes not all must be "yes".
        margin-note: Precise statement of the test — exactly what the marker wants.
        authorities: []
      - id: r3
        criterion: Applies each question to the facts
        marks: 3
        top-band: Ties directions to control, casual shifts to vulnerability and the reports to knowledge; deals with the quasi-legislative argument using Hayne J.
        margin-note: Strong application — each fact is doing work.
        authorities: []
      - id: r4
        criterion: Concludes by analogy with Crimmins and flags the CLA
        marks: 2
        top-band: Concludes a duty is likely because the facts mirror Crimmins, and notes CLA Part 5 must be considered next.
        margin-note: Clear conclusion, and good instinct to move to the statute.
        authorities: []
  - key: q042
    type: mcq
    concept: control-and-vulnerability-graham-barclay-and-amaca
    difficulty: 1
    cases:
      - graham-barclay-oysters-v-ryan
