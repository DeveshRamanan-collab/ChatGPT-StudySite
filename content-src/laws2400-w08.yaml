        why: Wrong direction — Hahn v Conley is about a duty owed to the child; here a stranger sues the parents.
      - text: As the parents' duty to others to control their child — Smith v Leurs.
        correct: true
        why: "Correct — Smith v Leurs: parents may owe others a duty to control their child, discharged by reasonable steps."
      - text: As a wrongful life claim by the neighbour.
        why: Wrong — wrongful life is a child's claim about her own birth, not a neighbour's claim.
      - text: As an occupier's duty to a trespasser — Cardy.
        why: Wrong — no one entered anyone's land; this is control of a child.
  - key: q161
    type: mcq
    concept: children-parents-and-the-unborn
    difficulty: 3
    cases:
      - smith-v-leurs
      - hahn-v-conley
    stem: Which pairing correctly matches the direction of the duty?
    options:
      - text: "Smith v Leurs: carer → child; Hahn v Conley: parents → others."
        why: Back to front — Smith v Leurs concerned a duty to an injured stranger; Hahn v Conley a duty to the child.
      - text: "Smith v Leurs: parents → others; Hahn v Conley: carer → child."
        correct: true
        why: Correct — Smith v Leurs is about controlling the child for others' protection; Hahn v Conley is about the carer's duty to the child.
      - text: "Both cases: parents → others."
        why: Wrong — Hahn v Conley asked whether the girl had a cause of action against her grandfather.
      - text: "Both cases: carer → child."
        why: Wrong — in Smith v Leurs the plaintiff was a stranger whose eye was injured.
    contrasts-with:
      - third-party-conduct-dorset-yacht-and-modbury
  - key: q162
    type: mcq
    concept: children-parents-and-the-unborn
    difficulty: 2
    stem: The lecturer said the detail of wrongful conception, birth and life actions belongs to which area?
    options:
      - text: Public authority liability under CLA Part 5.
        why: Wrong — the lecturer pointed to health law, not public authorities.
      - text: Health law — beyond awareness, it is not needed in this unit.
        correct: true
        why: "Correct — the lecturer: \"You will learn more about this if you study health law… But we won't need that for our course.\""
      - text: Intentional torts to the person.
        why: Wrong — these actions are negligence-based; nothing about them is an intentional tort.
      - text: Contract law, because medical services are contracts.
        why: Tempting because medical services are often contracted, but the lecturer pointed to health law.
  - key: q163
    type: truefalse
    concept: children-parents-and-the-unborn
    difficulty: 1
    set: quickfire
    cases:
      - smith-v-leurs
    statement: In Smith v Leurs the parents were held liable because they had allowed their son to own a sling shot.
    answer: false
    why: "False — the High Court held a duty was owed but not breached: telling their son not to use the sling shot outside their home was a reasonable step."
  - key: q164
    type: truefalse
    concept: children-parents-and-the-unborn
    difficulty: 1
    set: quickfire
    statement: Parents owe a duty to drive carefully so as not to injure their child, and even a foetus.
    answer: true
    why: True — the slide gives this as a duty parents do owe, even though there is generally no duty in feeding, clothing and raising.
  - key: q165
    type: truefalse
    concept: children-parents-and-the-unborn
    difficulty: 2
    statement: Wrongful birth actions are brought by the child, arguing they should not have been born.
    answer: false
    why: False — wrongful birth is brought by the parents (the pregnancy would have been terminated but for negligence); the child's claim is wrongful life.
  - key: q166
    type: match
    concept: children-parents-and-the-unborn
    difficulty: 2
    prompt: Match each action to its description.
    pairs:
      - left: Pre-natal injuries
        right: Child injured in the womb sues once born alive
      - left: Wrongful conception
        right: Mother would not have conceived but for the negligence
      - left: Wrongful birth
        right: Pregnancy would have been terminated but for the negligence
      - left: Wrongful life
        right: Child claims the pregnancy should have been terminated
  - key: q167
    type: short
    concept: children-parents-and-the-unborn
    difficulty: 3
    cases:
      - hahn-v-conley
      - smith-v-leurs
    prompt: Grandma Rose is minding Aiko, aged 4, at a park. Sitting on a bench across a car park, Rose calls out "Aiko, come here!". Aiko runs across and is struck by Ben's car. Sued by Aiko, Ben claims contribution from Rose. Separately, Aiko's parents had told her brother Kai, aged 12, never to throw rocks at cars, but that day Kai threw one and broke Ben's windscreen. Advise on (a) whether Rose owed Aiko a duty of care and (b) whether Kai's parents owed Ben a duty, and whether it was breached.
    model: "(a) The issue is whether a carer in loco parentis owes the child a duty. Parents generally owe no duty in raising a child, but they must not create danger or risk for the child, and Hahn v Conley says a parent may become liable to the child if the child is led into danger by their actions. In Hahn v Conley the grandfather, in loco parentis, owed no duty because he merely answered the girl's call — he did not call her to come to him. Rose did call Aiko across a car park, so she led her into danger; Hahn v Conley is distinguishable and a duty is likely, which supports Ben's contribution claim. (b) Parents may owe others a duty to control their child (Smith v Leurs). There, a 13-year-old injured the plaintiff with a sling shot; a duty was owed but not breached because the parents had told their son not to use it outside the home. Kai's parents likewise owed Ben a duty, but they had told Kai never to throw rocks at cars, which looks like a reasonable step. Unless they knew of a pattern of such behaviour, breach is unlikely. Conclusion: (a) Rose likely owed Aiko a duty; (b) a duty was owed but probably not breached."
    rubric:
      - id: r1
        criterion: Identifies the two different duty directions
        marks: 2
        top-band: Separates carer → child (Rose) from parents → others (Kai's parents) before applying law.
        margin-note: Good — direction of the duty is the key first move.
        authorities: []
      - id: r2
        criterion: Applies Hahn v Conley to Rose
        marks: 3
        top-band: States the "led into danger" principle and distinguishes Hahn v Conley because Rose called Aiko over.
        margin-note: Precise distinction — this is where the marks are.
        authorities: []
      - id: r3
        criterion: Applies Smith v Leurs to Kai's parents
        marks: 3
        top-band: States the duty to control the child and uses the instruction not to throw rocks as a reasonable step against breach.
        margin-note: Strong analogy, well applied to breach.
        authorities: []
      - id: r4
        criterion: Concludes on each issue
        marks: 2
        top-band: Gives separate, reasoned conclusions and links (a) to Ben's contribution claim.
        margin-note: Clear and complete.
        authorities: []
