        correct: true
        why: "Correct — the slide: Ryan sued Graham Barclay, the Great Lakes Council and the NSW government for negligence."
      - text: The Commonwealth and the Australian Stevedoring Industry Authority.
        why: Wrong — the Stevedoring Industry Authority belongs to Crimmins; Graham Barclay concerned a council and the State of NSW.
      - text: The RTA and Pacific Power, as owners of nearby land.
        why: Wrong — the RTA is from Refrigerated Roadways and Pacific Power from Amaca; neither was a defendant in the oyster case.
      - text: The Conservation Commission and the local police.
        why: Wrong — the Conservation Commission was the defendant in Romeo; the oyster case was against the council and the State.
  - key: q043
    type: mcq
    concept: control-and-vulnerability-graham-barclay-and-amaca
    difficulty: 1
    cases:
      - graham-barclay-oysters-v-ryan
    stem: What did the High Court majority hold about the Council and the NSW government in Graham Barclay Oysters?
    options:
      - text: Both owed a duty and breached it by failing to close the lake.
        why: Wrong — the majority held no duty was owed by either public authority, so breach was never reached for them.
      - text: Neither owed the oyster consumers a duty of care.
        correct: true
        why: "Correct — the slide: \"The High Court by majority held that no duty of care was owed by the Council or the NSW government\"."
      - text: The State owed a duty but the Council did not, because the State had managerial control.
        why: Wrong — Gleeson CJ in fact raised doubts about the State's managerial control over the oyster industry; no duty was owed by the State.
      - text: The Council owed a duty but the State did not, because councils regulate local land use.
        why: "Wrong — the Council's powers were for the public generally (Gleeson CJ) and it had much less control (Gummow and Hayne JJ): no duty."
  - key: q044
    type: mcq
    concept: control-and-vulnerability-graham-barclay-and-amaca
    difficulty: 2
    cases:
      - graham-barclay-oysters-v-ryan
    contrasts-with:
      - laws2400-w06-omissions-and-control-of-others
    stem: Gleeson CJ said the complaint against the governments in Graham Barclay was "not about acts, but about omissions". Why does that matter?
    options:
      - text: Alleged non-feasance by a public authority makes a duty harder to establish than positive acts do.
        correct: true
        why: Correct — the slide glosses it as alleged non-feasance by public authorities; omissions need more than foreseeability, and governments differ from ordinary citizens.
      - text: Omissions are actionable only in administrative law, so the negligence claim failed automatically.
        why: Wrong — omissions can found a duty in tort (Crimmins); the point is that they make a duty harder, not that negligence is unavailable.
      - text: Omissions cannot cause physical harm, so the consumers' illness was not legally caused.
        why: Wrong — the case was decided on duty, not causation; an omission can be a cause of harm.
      - text: It moved the case into pure economic loss, which needs the salient features approach.
        why: Tempting because Topic 7 also needs more than foreseeability, but the consumers were physically ill; the omission label concerns how harm was caused, not its type.
  - key: q045
    type: mcq
    concept: control-and-vulnerability-graham-barclay-and-amaca
    difficulty: 2
    cases:
      - graham-barclay-oysters-v-ryan
    stem: What question did Gleeson CJ ask about the State's approach to the oyster industry?
    options:
      - text: Why the State had not banned oyster farming entirely after the first contamination.
        why: Wrong — Gleeson CJ did not ask why the State failed to ban the industry; he questioned how a court could judge a decision to allow self-regulation.
      - text: Whether the State had told consumers the oysters were safe, inducing their reliance.
        why: Tempting because reliance on statements matters in Topic 7, but the State had made no such statement; the issue was its regulatory choice.
      - text: Why the State could not rely on industry self-regulation, and how a court could judge that.
        correct: true
        why: Correct — "Why could not the State have relied on self-regulation by the industry itself? … By what criterion can a court determine the reasonableness" of that decision?
      - text: Whether the State had breached s 43 of the Civil Liability Act by failing to regulate the industry.
        why: Wrong — Gleeson CJ's point was the common law difficulty of judging a policy choice; the slides do not tie his question to s 43.
  - key: q046
    type: mcq
    concept: control-and-vulnerability-graham-barclay-and-amaca
