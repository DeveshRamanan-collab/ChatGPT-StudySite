        criterion: Identifies the issue as an affirmative duty for a failure to exercise a power
        marks: 2
        top-band: Names the omission and says foreseeability is necessary but not sufficient for a public authority.
        margin-note: Good — you spotted that this is non-feasance, not a positive act.
        authorities: []
      - id: r2
        criterion: Uses Graham Barclay Oysters on policy and self-regulation
        marks: 3
        top-band: Explains Gleeson CJ's point about self-regulation and the public-generally purpose of the power, and applies it to the industry code.
        margin-note: Exactly the right analogy — well developed.
        authorities: []
      - id: r3
        criterion: Uses the Amaca propositions and the control/vulnerability analysis
        marks: 3
        top-band: Applies propositions 3 and 5 (power and knowledge not enough) and shows the manufacturer had more control and consumers relied on it.
        margin-note: Strong — you used the propositions as tools, not a list.
        authorities: []
      - id: r4
        criterion: Contrasts Crimmins and concludes
        marks: 2
        top-band: Distinguishes Crimmins (direction, control, vulnerability) and concludes no duty is likely, redirecting the claim.
        margin-note: Clear and well-supported conclusion.
        authorities: []
  - key: q063
    type: mcq
    concept: cla-part-5-public-authorities
    difficulty: 1
    stem: What did the Ipp Committee's recommendations on public authorities aim to do?
    options:
      - text: Limit liability to acts so unreasonable that no reasonable authority would take them.
        correct: true
        why: "Correct — the slide: the recommendations aimed at reducing liability \"only to their acts which were so unreasonable that no reasonable public authority would take them\"."
      - text: Restore Crown immunity for all decisions made by public authorities.
        why: Wrong — the CLA limits liability but does not restore Crown immunity; public authorities can still be sued.
      - text: Make public authorities strictly liable whenever they fail to exercise any of their statutory powers.
        why: Back to front — the CLA reduces liability; s 44 and s 46 make failing to exercise powers harder to sue on, not strictly actionable.
      - text: Apply the ordinary reasonable person standard to public authorities.
        why: Wrong — the lecturer said "this isn't just the normal standard"; it is a much higher, Wednesbury-style threshold.
  - key: q064
    type: mcq
    concept: cla-part-5-public-authorities
    difficulty: 2
    stem: The "so unreasonable" threshold drawn from the Ipp recommendations comes from which principle?
    options:
      - text: The neighbour principle from Donoghue v Stevenson.
        why: Wrong — the neighbour principle is about reasonable foreseeability for duty (Topic 5), not an unreasonableness threshold from public law.
      - text: The calculus of negligence for breach in the CLA.
        why: Tempting because it is also about reasonableness, but the slide traces the threshold to an administrative law principle, not the ordinary breach calculus.
      - text: Wednesbury unreasonableness, from administrative law.
        correct: true
        why: Correct — the slide says the recommendations draw from the Wednesbury unreasonableness principle used in administrative law.
      - text: The obvious risk test in s 5F of the CLA.
        why: Wrong — s 5F defines obvious risk (Topic 6); it has nothing to do with the public authority threshold.
  - key: q065
    type: mcq
    concept: cla-part-5-public-authorities
    difficulty: 1
    stem: Which of these is NOT within the CLA s 41 definition of a "public or other authority"?
    options:
      - text: A local council.
        why: "Listed in s 41(d), so it is not the exception: councils are public authorities for Part 5."
      - text: A government department.
        why: "Listed in s 41(b), so it is not the exception: government departments are covered."
      - text: A person acting in a public official capacity, as to those functions.
        why: Covered by s 41(e1) — even if not employed as a public official — so it is not the exception.
      - text: A private company acting purely for its own commercial ends.
        correct: true
        why: Correct — a private company acting for itself has no public official functions and is not listed, so it falls outside s 41.
  - key: q066
    type: mcq
    concept: cla-part-5-public-authorities
    difficulty: 2
    stem: Under s 41(e1), when can a private person be treated as a public authority?
    options:
      - text: Never — s 41 is limited to bodies constituted by or under an Act.
        why: Wrong — s 41(e1) extends the definition to any person having public official functions, so private people can be covered.
      - text: When they have public official functions — but only in relation to those functions.
        correct: true
        why: "Correct — s 41(e1): \"any person having public official functions or acting in a public official capacity …, but only in relation to\" those functions."
      - text: Whenever they are paid from public funds, whatever they happen to be doing at the time of the harm.
        why: Wrong — funding is not the test, and the definition is limited to the exercise of public official functions.
      - text: Only when they are formally employed as a public official.
        why: Wrong — s 41(e1) says "whether or not employed as a public official"; prison guards or road-sign workers may be private.
  - key: q067
    type: mcq
    concept: cla-part-5-public-authorities
    difficulty: 2
    stem: Which example did the slides give of a private person who may be regarded as a public authority?
    options:
      - text: A shopping centre owner managing its car park lighting.
        why: Wrong — that is Modbury Triangle, an occupier case; a shopping centre owner has no public official functions.
      - text: A psychiatrist operating under the Mental Health Act 2007.
        correct: true
        why: Correct — the slide lists psychiatrists operating under the Mental Health Act 2007, people putting warning signs by roads, and prison guards.
      - text: A landlord letting a house to a private tenant.
        why: Wrong — a landlord acts privately; the landlord's duty comes from Jones v Bartlett, not Part 5.
      - text: A barrister conducting a case in court.
        why: Wrong — barristers have their own immunity (Giannarelli v Wraith); they are not listed as public authorities.
  - key: q068
    type: mcq
    concept: cla-part-5-public-authorities
    difficulty: 2
    stem: Section 42(b) CLA provides that which of these is not open to challenge?
    options:
      - text: The general allocation of resources by the authority.
        correct: true
        why: "Correct — s 42(b): \"the general allocation of those resources by the authority is not open to challenge\" — the separation of powers point in statute."
      - text: Any decision the authority makes about a particular plaintiff.
        why: Wrong — s 42(b) protects the general allocation of resources, not every decision about an individual.
      - text: The authority's evidence that it complied with its procedures.
        why: Mixed up — s 42(d) lets the authority rely on evidence of compliance; it does not make that evidence unchallengeable.
      - text: The reasonableness of an operational act by one of its employees.
        why: Wrong — operational conduct remains open to argument; s 42(b) is about the general allocation of resources.
  - key: q069
    type: mcq
    concept: cla-part-5-public-authorities
    difficulty: 2
    stem: Under s 42(c), how are the functions required to be exercised by an authority determined?
    options:
      - text: By reference only to the activity that caused the plaintiff's harm.
        why: Back to front — s 42(c) says "not merely by reference to the matter to which the proceedings relate".
      - text: By what a reasonable private person would have done in the authority's position at the time.
        why: Wrong — the whole point of Part 5 is that an authority is not judged as an ordinary private person would be.
      - text: By the broad range of its activities, not merely the matter in the proceedings.
        correct: true
        why: "Correct — s 42(c): the functions are \"determined by reference to the broad range of its activities (and not merely by reference to the matter to which the proceedings relate)\"."
      - text: By whatever functions the plaintiff could have compelled it to perform.
        why: Mixed up — compelling the authority is the s 44 test for regulatory functions, not how s 42(c) determines functions.
  - key: q070
    type: mcq
    concept: cla-part-5-public-authorities
    difficulty: 3
    contrasts-with:
      - public-authorities-as-defendants
    cases:
      - romeo-v-conservation-commission-nt
    stem: The lecturer said s 42 "pulls into the statute" something already discussed at common law. What?
    options:
      - text: McHugh J's six questions, which the statute now replaces as the test for public authorities.
        why: Wrong — the six questions remain the common law approach; s 42 states principles about resources, not a replacement test.
      - text: The resources concern — courts cannot direct an authority's spending (Romeo's fencing).
        correct: true
        why: Correct — s 42 codifies the separation of powers concern; the lecturer gave Romeo's fencing argument as an example of courts not directing spending.
      - text: Crown immunity for budget decisions only.
        why: Wrong — there is no Crown immunity now; s 42 shapes the duty and breach inquiry, it does not create immunity.
      - text: Hill's no-duty rule for police investigations.
        why: Wrong — Hill is a common law police case; s 42 is a general principle about resources for all public authorities.
  - key: q071
    type: mcq
    concept: cla-part-5-public-authorities
    difficulty: 1
    set: pretest
    stem: Under s 43 CLA, when does an act or omission of a public authority constitute a breach of statutory duty?
    options:
      - text: Whenever a reasonable person in its position would have acted differently.
        why: Wrong — that is the ordinary negligence standard; s 43 sets a much higher Wednesbury-style bar.
      - text: Only if no authority with its functions could properly consider it reasonable.
        correct: true
        why: "Correct — s 43(2): no breach of statutory duty unless the act or omission was \"so unreasonable that no authority having the functions … could properly consider\" it reasonable."
      - text: Whenever the act or omission caused foreseeable harm to a member of the public.
        why: Wrong — foreseeability of harm is never enough for a public authority, and s 43 adds the "so unreasonable" threshold.
      - text: Only if the authority acted in bad faith or with intent to cause harm.
        why: Wrong — s 43 is about extreme unreasonableness, not bad faith or intention.
  - key: q072
    type: mcq
    concept: cla-part-5-public-authorities
    difficulty: 2
    stem: What is a "special statutory power" for s 43A?
    options:
      - text: Any power an authority uses in an emergency, whether or not conferred by statute.
        why: Wrong — s 43A(2)(a) requires the power to be conferred by or under a statute; emergency use is not the test.
      - text: Any power that the authority has exercised on at least one earlier occasion.
        why: Wrong — past exercise has nothing to do with it (and s 46 says exercising a function does not of itself create a duty).
      - text: A statutory power of a kind ordinary persons cannot exercise without specific statutory authority.
        correct: true
        why: "Correct — s 43A(2): conferred by or under a statute, and of a kind persons generally cannot exercise without specific statutory authority."
      - text: A power to make regulations or other delegated legislation.
        why: Too narrow — "quasi-legislative" is McHugh J's language; s 43A covers any power ordinary people cannot exercise without statutory authority.
  - key: q073
    type: mcq
    concept: cla-part-5-public-authorities
    difficulty: 2
    stem: Which did the lecturer give as an example of a special statutory power?
    options:
      - text: A council mowing a public park.
        why: Wrong — anybody can mow grass; a special statutory power is one persons generally are not authorised to exercise.
      - text: A fire service's power to carry out back-burning.
        correct: true
        why: "Correct — the lecturer's example: back-burning is very limited in who can exercise it and is tightly controlled, as is issuing firearm licences."
      - text: Putting up a protective screen on a bridge.
        why: "Wrong — the Court of Appeal in Refrigerated Roadways said erecting screens is not a special statutory power: anybody can erect a screen."
      - text: A shopping centre switching off its car park lights.
        why: Wrong — that is the Modbury Triangle occupier; ordinary property owners can control their lights.
  - key: q074
    type: mcq
    concept: cla-part-5-public-authorities
    difficulty: 3
    cases:
      - rta-v-refrigerated-roadways
    stem: In RTA v Refrigerated Roadways, why did s 43A not help the RTA?
    options:
      - text: "Erecting screens is not a special statutory power: anybody can do it."
        correct: true
        why: "Correct — the slide: s 43A would not have helped because erecting screens would not be an exercise of a special statutory power."
      - text: Section 43A applies only to police, not to roads authorities.
        why: Wrong — s 43A applies to any public or other authority with a special statutory power; it is not limited to police.
      - text: The RTA had conceded that its conduct was so unreasonable that s 43A was met.
        why: Wrong — there was no such concession; and the RTA was found not to have breached its duty at all.
