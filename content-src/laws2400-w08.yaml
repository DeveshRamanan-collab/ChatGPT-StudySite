  - key: q084
    type: short
    concept: cla-part-5-public-authorities
    difficulty: 3
    cases:
      - romeo-v-conservation-commission-nt
    prompt: Harbour City Council has statutory power to grant permits for events on its foreshore, and it maintains the foreshore. Its budget committee allocated this year's safety funds to footpath repairs rather than seawall railings. At a festival the Council permitted, Tom falls from an unrailed section of seawall. Tom argues the Council (a) should have refused the festival permit and (b) should have spent money on railings. Advise on how CLA Part 5 bears on Tom's arguments.
    model: "Start with the common law: Tom must show a duty of care, and for a public authority foreseeability is necessary but not sufficient — control, knowledge and vulnerability matter. Then consider how CLA Part 5 modifies it. The Council is a \"public or other authority\" under s 41(d). Argument (a) attacks a failure to exercise a permit function. Under s 44(2) a function to issue a permit is a function to regulate an activity, and under s 44(1) the Council is not liable for failing to exercise or consider exercising it unless it could have been required to do so in proceedings brought by Tom — very unlikely. Argument (b) attacks the allocation of resources. Section 42(a) limits the Council's functions to the resources reasonably available, and s 42(b) makes its general allocation of resources not open to challenge; as with the fencing argument in Romeo, a court cannot tell the Council to spend on railings rather than footpaths. Section 42(c) also requires its functions to be judged across the broad range of its activities. Section 46 means maintaining the foreshore does not of itself create a duty to rail it. Conclusion: Part 5 makes both arguments very difficult; Tom's best remaining argument would rest on common law control and knowledge of the particular danger."
    rubric:
      - id: r1
        criterion: "Structures the answer: common law first, then Part 5"
        marks: 2
        top-band: States the common law duty requirements briefly and identifies the Council as a s 41 authority before applying Part 5.
        margin-note: Good structure — common law modified by statute.
        authorities: []
      - id: r2
        criterion: Applies s 44 to the permit argument
        marks: 3
        top-band: Uses s 44(2) (permits are regulatory) and s 44(1) (no liability unless Tom could have compelled the function), and applies it.
        margin-note: Exactly right — you found the section built for licensing and permits.
        authorities: []
      - id: r3
        criterion: Applies s 42 to the resources argument
        marks: 3
        top-band: Uses s 42(a)–(c), explains that the general allocation of resources is not open to challenge, and links it to Romeo's fencing argument.
        margin-note: Strong — the resources point is the heart of this question.
        authorities: []
      - id: r4
        criterion: Uses s 46 and concludes
        marks: 2
        top-band: Notes that maintaining the foreshore does not of itself create a duty (s 46), and concludes on Tom's prospects.
        margin-note: Clear conclusion that weighs what is left of the claim.
        authorities: []
