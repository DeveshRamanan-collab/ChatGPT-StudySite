      - text: Law Reform (Contributory Negligence and Apportionment of Liability) Act 2001, s 6
        why: Tempting because of its law-reform title, but footnote 230 cites it for South Australia; the NSW source is the Law Reform (Miscellaneous Provisions) Act 1946.
      - text: Wrongs Act 1958, Pt IV
        why: Wrong — footnote 230 cites the Wrongs Act 1958 for Victoria, noting that it differs significantly from the other jurisdictions' provisions.
