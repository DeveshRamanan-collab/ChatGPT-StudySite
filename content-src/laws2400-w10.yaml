        correct: true
        why: 'Correct — the textbook''s example: the plaintiff may choose to sue the person with the ''deeper pockets''.'
      - text: Because the law requires a plaintiff to choose just one tortfeasor to sue
        why: Tempting because the textbook speaks of choosing one, but it is a choice the plaintiff may make, not a legal requirement.
      - text: Because suing more than one would reduce the total damages recoverable
        why: Wrong — nothing in the textbook says so; the point is that the plaintiff may recover the whole amount from the one chosen.
  - key: q085
    type: mcq
    concept: contribution-between-tortfeasors
    difficulty: 3
    variant-of: q081
    stem: Which statement about the risk of a tortfeasor's insolvency is correct, according to the textbook?
    options:
      - text: It lies with the other tortfeasors, whether joint or separate concurrent ones, not the plaintiff
        correct: true
        why: Correct — "where there are joint or separate, concurrent tortfeasors, the risk that one of them is insolvent … lies with the other tortfeasors, not the plaintiff".
      - text: It lies with the plaintiff where the tortfeasors are separate, and with the others where they are joint
        why: Tempting because the joint/separate distinction sounds as if it should matter, but the textbook applies the same rule to both.
      - text: It is shared equally between the plaintiff and the remaining solvent tortfeasors
        why: Wrong — the textbook places the risk on the other tortfeasors alone; contribution in no way affects the plaintiff.
  - key: q086
    type: mcq
    concept: contribution-between-tortfeasors
    difficulty: 4
    stem: Dee's property is damaged by the negligence of two builders, and her claim is for that property damage. Before advising that she can recover the whole amount from one builder, what does the textbook's footnote tell you to check?
    options:
      - text: Whether the proportionate liability provisions apply to her claim
        correct: true
        why: Correct — footnote 229 qualifies the whole-amount rule where the proportionate liability provisions apply to claims for property damage and economic loss.
      - text: Whether both builders are solvent, since she bears any insolvency risk
        why: Tempting because insolvency matters to the defendants, but the textbook says that risk lies with the other tortfeasors, not the plaintiff.
      - text: Whether the builders have already settled contribution between them
        why: Wrong — contribution in no way affects the plaintiff; it is a matter for the tortfeasors, whatever stage it has reached.
  - key: q087
    type: truefalse
    set: quickfire
    concept: contribution-between-tortfeasors
    difficulty: 1
    statement: Contribution between tortfeasors in no way affects the plaintiff.
    answer: true
    why: True — the textbook says contribution "is a mechanism that in no way affects the plaintiff and is a matter between the tortfeasors themselves".
  - key: q088
    type: truefalse
    set: quickfire
    concept: contribution-between-tortfeasors
    difficulty: 1
    statement: Where tortfeasors are jointly and severally liable, the plaintiff must recover each tortfeasor's share from that tortfeasor.
    answer: false
    why: False — the plaintiff may choose to recover the whole amount against only one of them; dividing the burden is for the tortfeasors, through contribution.
  - key: q089
    type: truefalse
    set: quickfire
    concept: contribution-between-tortfeasors
    difficulty: 2
    statement: If one of two concurrent tortfeasors is insolvent, the textbook says the plaintiff bears that risk.
    answer: false
    why: False — the risk that one tortfeasor is insolvent or unable to pay lies with the other tortfeasors, not the plaintiff.
  - key: q090
    type: short
    concept: contribution-between-tortfeasors
    difficulty: 3
    prompt: Kai is injured when a crane operated by Lift Co strikes scaffolding negligently erected by Frame Pty Ltd. Both companies are jointly and severally liable for the whole of Kai's injury. Frame Pty Ltd has gone into liquidation and cannot pay. Advise Kai whom to sue, and explain what happens between the two companies.
    model: |-
      The issue is how Kai recovers where two tortfeasors are jointly and severally liable, one of them insolvent.

      Where multiple tortfeasors are jointly and severally liable for damage, the plaintiff may choose to recover the whole amount against only one of them — for example, the one with the "deeper pockets" (Tort Law Principles [12.170]). The footnoted qualification for proportionate liability concerns claims for property damage and economic loss; Kai's claim is for personal injury, so it does not apply.

      Kai should therefore sue Lift Co, which is solvent, for the whole amount. Frame's liquidation does not reduce what Kai can recover.

      Between the companies, contribution is the statutory mechanism by which a tortfeasor held liable for the full amount may seek a contribution against another; in NSW the textbook cites the Law Reform (Miscellaneous Provisions) Act 1946 (NSW) s 5(1)(c) and s 5(2). Lift Co may seek a contribution against Frame. Contribution in no way affects Kai, and because Frame cannot pay, the risk of its insolvency lies with Lift Co, not Kai.

      Conclusion: Kai recovers in full from Lift Co; Lift Co bears the loss of any contribution Frame cannot pay.
    rubric:
      - id: r1
        criterion: 'Issue and rule: joint and several liability'
        marks: 2
        top-band: States that Kai may recover the whole amount from either tortfeasor, citing [12.170].
        margin-note: Start with what the plaintiff can do.
        authorities: []
      - id: r2
        criterion: Qualification
        marks: 2
        top-band: Notes the proportionate liability qualification for property damage and economic loss claims and explains why it does not apply.
        margin-note: Check the footnote before advising.
        authorities: []
      - id: r3
        criterion: Contribution
        marks: 3
        top-band: Explains the statutory contribution mechanism and cites the NSW statute; says it does not affect Kai.
        margin-note: Contribution is between the tortfeasors.
        authorities:
          - law-reform-miscellaneous-provisions-act-1946-nsw-s5
      - id: r4
        criterion: Insolvency and conclusion
        marks: 3
        top-band: Puts Frame's insolvency risk on Lift Co, not Kai, and concludes on whom to sue.
        margin-note: 'Answer the question asked: whom to sue.'
        authorities: []
  - key: q091
    type: mcq
    concept: causation-flowchart
    difficulty: 1
    stem: Which statement best captures why damage matters to an action in negligence?
    options:
      - text: 'Damage is the gist of the action: no damage, no action in negligence.'
        correct: true
        why: 'Correct — the slides put it plainly: damage is the gist of the action, so no damage means no action, however careless the defendant was.'
      - text: Damage matters only to how much is awarded, not to whether the action succeeds.
        why: Tempting because damages are about money, but damage (harm) is an element of negligence itself; without it the action fails, not just the award.
      - text: Negligence is actionable per se, so damage is needed only to obtain compensation.
        why: 'Tempting because the intentional torts in Topics 1–4 are actionable per se, but negligence is not: damage must be proved for the action to succeed.'
      - text: Damage is presumed once a breach is shown, so the plaintiff need not prove it.
        why: 'Wrong — nothing is presumed: the plaintiff must prove damage causally connected to the breach and not too remote, on the balance of probabilities (s 5E).'
  - key: q092
    type: mcq
    concept: causation-flowchart
    difficulty: 2
    stem: Under CLA s 5E, who bears the onus of proving any fact relevant to causation, and to what standard?
    options:
      - text: The defendant, once the plaintiff has proved a breach of duty.
        why: Tempting because the breach is the defendant's fault, but s 5E says the plaintiff "always" bears the onus on causation; it never shifts to the defendant.
      - text: The plaintiff, on the balance of probabilities.
        correct: true
        why: 'Correct — s 5E: in negligence proceedings the plaintiff always bears the onus of proving, on the balance of probabilities, any fact relevant to causation.'
      - text: The plaintiff, beyond reasonable doubt, because causation is a factual question.
        why: Tempting because causation is about proving facts, but this is a civil action; the standard is the balance of probabilities, not the criminal standard.
      - text: Whichever party asserts the fact, on the balance of probabilities.
        why: 'Tempting as a general rule of evidence, but s 5E is specific: on causation the plaintiff always bears the onus, whoever raises the particular fact.'
  - key: q093
    type: mcq
    concept: causation-flowchart
    difficulty: 2
    stem: How do the Topic 10 slides distinguish causation from remoteness?
    options:
      - text: Causation asks whether the breach in fact caused the harm; remoteness asks, as a legal question involving policy, whether the defendant should be held responsible.
        correct: true
        why: 'Correct — slide 5: causation is a factual question (did the act or omission in fact cause the harm?); remoteness is a legal question involving policy considerations.'
      - text: Causation is a question of law for the judge; remoteness is a question of fact settled by expert evidence.
        why: 'Tempting because both go to the court, but this reverses them: causation is the factual question, proved by evidence; remoteness is the legal, policy-laden one.'
      - text: Both are questions of reasonable foreseeability, asked at different stages of the claim.
        why: Tempting because foreseeability returns in remoteness, but factual causation is not about foreseeability at all; it is about what can be proved happened.
      - text: Causation applies at common law, while remoteness applies only where the CLA governs the claim.
        why: Wrong — both exist at common law and under the CLA; the CLA calls remoteness "scope of liability" (s 5D(1)(b)) but the common law principles still apply.
  - key: q094
    type: mcq
    concept: causation-flowchart
    difficulty: 3
    stem: 'A student writes: "The CLA replaced the common law on causation, so cases decided before 2002 are irrelevant." What is wrong with this?'
    options:
      - text: Nothing — s 5D is a complete code, and courts no longer refer to the earlier cases.
        why: Tempting because s 5D sets out the elements in statutory words, but the slides say the CLA restructured and codified the common law and "the cases are still important".
      - text: The CLA applies only to scope of liability, so the cases still govern factual causation alone.
        why: Tempting because the test for scope comes from the common law, but s 5D(1)(a) states factual causation too; the error is treating the cases as displaced, not which limb the Act covers.
      - text: The CLA restructured and codified the common law; its principles still apply, so the cases remain important.
        correct: true
        why: 'Correct — the slides: although the terminology has changed, the common law principles still apply under the CLA, and the cases (March v Stramare among them) are still important.'
      - text: The CLA applies only to property damage claims, so the common law alone governs every claim for personal injury.
        why: Wrong — the CLA plainly applies to personal injury claims (Strong v Woolworths and Adeels Palace were both injury claims under s 5D); its exclusions are specific, such as s 3B(1).
  - key: q095
    type: truefalse
    concept: causation-flowchart
    difficulty: 1
    statement: In the Topic 10 slides, the third element of negligence is "damage" — harm suffered by the plaintiff — not "damages", the money awarded as compensation.
    answer: true
    why: 'True — the slides stress damage, not damages: the element is harm the plaintiff suffered; damages (compensation) is a remedies question the unit only touches on.'
  - key: q096
    type: mcq
    concept: factual-causation-necessary-condition
    difficulty: 1
    stem: In Barnett v Chelsea & Kensington Hospital, why did the claim fail although the duty doctor was negligent?
    options:
      - text: Even timely treatment would not have saved the deceased, so the negligence was not a 'but for' cause of the death.
        correct: true
        why: 'Correct — the court held that although the duty doctor was negligent, even timely treatment would not have saved the deceased''s life: the ''but for'' test failed.'
      - text: The doctor owed no duty of care at all, because the deceased had never been formally admitted to the hospital as a patient.
        why: Tempting because the doctor refused to see him, but the slides treat negligence as established; the case turned on causation, not on whether a duty was owed.
      - text: The arsenic poisoning by a third party was a novus actus that broke the chain of causation.
        why: Tempting because the poisoner was a third party, but the poisoning came first, not after the breach; the point is that the death would have happened anyway.
      - text: The doctor met the standard of care, since he was feeling unwell himself at the time.
        why: Wrong — the slides say there was negligence on the part of the duty doctor; his own illness did not excuse the breach, and the claim failed on causation.
  - key: q097
    type: mcq
    concept: factual-causation-necessary-condition
    difficulty: 2
    variant-of: q096
    stem: A hospital negligently delays treating Mia for two hours. Expert evidence shows that, by the time she arrived, nothing could have prevented her injury. Which case is closest, and what follows?
    options:
      - text: 'Strong v Woolworths: the delay was a breach, so causation follows on the balance of probabilities.'
        why: Tempting because Strong is about proving causation on the probabilities, but a breach does not prove causation; here the evidence shows the harm would have happened anyway.
      - text: 'March v Stramare: common sense says the hospital caused the harm, so it is liable.'
        why: Tempting because March speaks of common sense, but that approach was criticised and s 5D(1)(a) asks a disciplined necessary condition question — which fails here.
      - text: 'Tabet v Gett: Mia lost a chance of a better outcome, which is compensable damage.'
        why: 'Wrong on two counts: Tabet refused recovery for a lost chance in personal injury, and here the evidence shows no chance at all of avoiding the injury.'
      - text: 'Barnett: the ''but for'' test fails, because the harm would have occurred anyway.'
        correct: true
        why: Correct — like Barnett, where timely treatment would not have saved the deceased, the delay was negligent but not a necessary condition of Mia's injury.
  - key: q098
    type: mcq
    concept: factual-causation-necessary-condition
    difficulty: 2
    stem: How did the High Court describe s 5D(1)(a) in Strong v Woolworths?
    options:
      - text: As a statutory statement of the 'but for' test of causation.
        correct: true
        why: 'Correct — the High Court observed that s 5D(1)(a) "is a statutory statement of the ''but for'' test of causation": the negligence must be a necessary condition of the harm.'
      - text: As replacing the 'but for' test with a broader test of material contribution.
        why: Tempting because material contribution features later in the topic, but Strong reads s 5D(1)(a) as the 'but for' test itself, not as a broader replacement.
      - text: As a test of common sense, applied to the facts of each particular case.
        why: Tempting because that phrase comes from Mason CJ in March v Stramare, but the CLA moved away from 'common sense' after the Ipp Report criticised it.
      - text: As codifying the 'scope of the risk' test proposed by McHugh J in March.
        why: Wrong — McHugh J's scope of the risk test was for remoteness; s 5D(1)(a) is the factual causation limb, which Strong equated with 'but for'.
  - key: q099
    type: truefalse
    concept: factual-causation-necessary-condition
    difficulty: 2
    statement: Because the CLA uses the words "necessary condition", it is an error for a court or a student to use 'but for' language when s 5D(1)(a) applies.
    answer: false
    why: False — the slides say the two are essentially the same test and courts often still use 'but for' language under s 5D(1)(a); just name the section as well.
  - key: q100
    type: mcq
    concept: factual-causation-necessary-condition
    difficulty: 3
    stem: Which statement best describes how to deal with factual causation when the CLA applies?
    options:
      - text: Ask whether the harm was a reasonably foreseeable consequence of the breach, under s 5D(1)(a).
        why: Tempting because foreseeability runs through negligence, but factual causation is about what can be proved happened; foreseeability belongs to breach and scope of liability.
      - text: Ask whether the negligence was a necessary condition of the harm under s 5D(1)(a) — the statutory 'but for' test — proved on the balance of probabilities.
        correct: true
        why: Correct — s 5D(1)(a) asks the necessary condition question, which Strong calls the statutory 'but for' test, and s 5E requires proof on the balance of probabilities.
      - text: Apply common sense to the facts, as s 5D(1)(a) codified Mason CJ's approach.
        why: Tempting because Mason CJ's words are famous, but the Ipp Report criticised 'common sense' for hiding policy choices, and s 5D(1) separates fact from policy.
      - text: Ask whether it is appropriate for liability to extend to the harm so caused.
        why: Wrong — that is the scope of liability question in s 5D(1)(b), the second, normative element, not the factual causation question in s 5D(1)(a).
  - key: q101
    type: short
    concept: factual-causation-necessary-condition
    difficulty: 3
    cases:
      - barnett-v-chelsea-and-kensington-hospital
      - march-v-stramare
      - adeels-palace-v-moubarak
    prompt: With reference to the CLA and common law explain the difference between factual causation and legal causation. What was the issue in Barnett v Chelsea & Kensington Hospital [1969] 1 QB 428 that meant that the Hospital was not liable in negligence for the death of Mr Barnett?
    model: |-
      Causation has two elements, and both must be established (CLA s 5D(1)). Factual causation is a question of fact: did the defendant's act or omission in fact cause the harm? At common law it is the 'but for' test — would the plaintiff have suffered the damage but for the defendant's negligence (March v Stramare)? Under s 5D(1)(a) it is whether the negligence was a necessary condition of the occurrence of the harm, which is the same test in statutory language (Strong v Woolworths). It is proved by evidence, on the balance of probabilities (s 5E).

      Legal causation — remoteness, or scope of liability under s 5D(1)(b) — is a legal question involving policy: given that the breach caused the harm, should the defendant be held legally responsible for it? Section 5D(4) requires the court to consider whether and why responsibility should be imposed. Section 5D(1) treats the two as separate and distinct issues (Adeels Palace v Moubarak).

      In Barnett the duty doctor negligently refused to see the deceased, who had drunk tea poisoned with arsenic. The issue was factual causation: even timely treatment would not have saved his life. The negligence was therefore not a 'but for' cause of the death, and the Hospital was not liable.
    rubric:
      - id: r1
        criterion: Factual causation
        marks: 3
        top-band: Defines it as a question of fact; states the 'but for' test and s 5D(1)(a) necessary condition as the same test; notes proof on the balance of probabilities (s 5E).
        margin-note: Both labels, with the section.
        authorities:
          - civil-liability-act-2002-nsw-s5d
          - civil-liability-act-2002-nsw-s5e
      - id: r2
        criterion: Legal causation
        marks: 3
        top-band: Identifies remoteness / scope of liability (s 5D(1)(b)) as a normative, policy question, with s 5D(4), and notes that s 5D(1) keeps the two separate (Adeels Palace).
        margin-note: Fact v ought — say which is which.
        authorities:
          - civil-liability-act-2002-nsw-s5d
      - id: r3
        criterion: 'Barnett: facts and issue'
        marks: 2
        top-band: 'States the facts briefly and identifies factual causation as the issue: breach, but timely treatment would not have saved him.'
        margin-note: Breach was not the problem.
        authorities: []
      - id: r4
        criterion: Conclusion
        marks: 2
        top-band: Concludes that the 'but for' / necessary condition test failed, so the Hospital was not liable, and ties this back to the distinction.
        margin-note: Link the case to the test.
        authorities: []
  - key: q102
    type: mcq
    concept: s5d2-exceptional-cases
    difficulty: 2
    stem: What led to the exceptional case provision in s 5D(2)?
    options:
      - text: The Ipp Report recommended it, based on the dust disease cases.
        correct: true
        why: 'Correct — the slides: based on the dust disease cases, the Ipp Report recommended the CLA contain an exceptional case provision; that is now s 5D(2).'
      - text: The High Court's decision in Adeels Palace, which called for a statutory exception.
        why: Tempting because Adeels Palace is the s 5D(2) case on the slides, but it was decided in 2009 under the existing provision and held it did not apply.
      - text: The Negligence Review Panel's recommendations on multiple sufficient causes.
        why: Tempting because the Panel did consider causation, but the slides say it made no recommendations on multiple sufficient causes, which stay with the common law.
      - text: The decision in Tabet v Gett, which allowed recovery for loss of a chance.
        why: Wrong — Tabet v Gett did not allow recovery for a lost chance of a better medical outcome, and it is not the source of s 5D(2).
  - key: q103
    type: mcq
    concept: s5d2-exceptional-cases
    difficulty: 2
    stem: What does Adeels Palace v Moubarak tell us about s 5D(2)?
    options:
      - text: It applied, because the club's breach was clear and the evidence left a gap.
        why: Tempting because the flowchart lists a clear breach and an evidentiary gap, but the High Court found no reason to treat Adeels Palace as an exceptional case.
      - text: It applies to any case in which the negligence might have made a difference.
        why: Tempting because s 5D(2) covers negligence that cannot be shown to be a necessary condition, but Adeels Palace said "might have" prevented harm is not enough.
      - text: 'It did not apply: holding the club responsible where security "might have" prevented the harm would be contrary to established principles.'
        correct: true
        why: 'Correct — [57]: it "would be contrary to established principles" to hold the defendant responsible where negligence was not a necessary condition but "might have" prevented the harm.'
      - text: It replaces the 'but for' test whenever a third party's criminal act is involved.
        why: Wrong — the court applied the 'but for' test to a third party's shooting and found it unmet; s 5D(2) is an exception for exceptional cases, not for crimes.
  - key: q104
    type: mcq
    concept: s5d2-exceptional-cases
    difficulty: 3
    stem: Why does Amaca v Booth, a 2011 High Court causation case, never mention the CLA or s 5D(2)?
    options:
      - text: It was decided before the CLA came into force, so the Act could not apply to it.
        why: Tempting because many causation cases are older, but the CLA dates from 2002 and Booth was decided in 2011; the reason lies in the Act's own exclusions.
      - text: Section 3B(1) excludes the CLA from dust disease proceedings, which go under the Dust Diseases Tribunal Act 1989 (NSW).
        correct: true
        why: 'Correct — the slides point to s 3B(1): the Act does not apply to dust disease proceedings under the Dust Diseases Tribunal Act 1989 (NSW), so Booth was decided at common law.'
      - text: Section 5D(2) applies only to multiple sufficient causes, not to disease cases.
        why: Tempting because the flowchart pairs s 5D(2) with two kinds of case, but nothing confines it to one kind; Booth sits outside the whole Act because of s 3B(1).
      - text: The High Court held s 5D(2) invalid as inconsistent with established principles.
        why: Wrong — no case on the slides held s 5D(2) invalid; "established principles" are words in s 5D(2) itself, and Adeels Palace simply held it did not apply.
  - key: q105
    type: truefalse
    concept: s5d2-exceptional-cases
    difficulty: 1
    statement: In practice s 5D(2) has rarely been considered by the courts, so there is some uncertainty about how it operates.
    answer: true
    why: True — slide 15 says exactly this; Adeels Palace, which found s 5D(2) did not apply, is about the only guidance the slides give.
  - key: q106
    type: mcq
    concept: s5d2-exceptional-cases
    difficulty: 3
    variant-of: q103
    stem: Ravi is assaulted in a pub that had no door staff. The evidence cannot show that door staff would have stopped the attacker. His barrister argues that s 5D(2) should supply factual causation. What is the strongest response?
    options:
      - text: 'Adeels Palace: that security might have made a difference does not prove causation, and there is no reason to treat this as an exceptional case.'
        correct: true
        why: Correct — on almost identical facts Adeels Palace held the 'but for' test unmet and refused to treat the case as exceptional; "might have" is not enough.
      - text: Section 5D(2) applies automatically once a clear breach and an evidentiary gap are shown.
        why: Tempting because the flowchart lists those requirements, but s 5D(2) is for exceptional cases only, and even then the court weighs whether responsibility should be imposed.
      - text: Section 3B(1) excludes the CLA from claims arising out of assaults, so only the common law applies.
        why: Tempting because s 3B(1)(a) mentions intentional acts, but it concerns the liability of the person who did the act; the pub's liability in negligence stays under the CLA.
      - text: Section 5D(2) is available because 'but for' never applies where a third party commits a crime.
        why: Wrong — Adeels Palace applied the 'but for' test to a third party's shooting; a criminal intervener does not displace s 5D(1)(a).
  - key: q107
    type: mcq
    concept: multiple-sufficient-causes-and-material-contribution
    difficulty: 2
    stem: Which of these is NOT one of the limitations of the 'but for' test that Mason CJ noted in March v Stramare?
    options:
      - text: It cannot distinguish between causes and necessary preconditions.
        why: 'Tempting to pick because it sounds abstract, but it is the first limitation Mason CJ noted: ''but for'' treats every precondition alike.'
      - text: It struggles with situations involving an intervening event.
        why: Tempting to pick because intervening acts are a Topic 11 issue, but Mason CJ listed it as a limitation; it is introduced this week.
      - text: It cannot be applied at all once the CLA governs the claim.
        correct: true
        why: 'Correct — this is not a limitation Mason CJ noted, and it is wrong: s 5D(1)(a) is the statutory statement of the ''but for'' test.'
      - text: It fails where there are multiple sufficient causes.
        why: 'Tempting to pick, but this is the third limitation on the slide: where two events are each sufficient, ''but for'' clears both.'
  - key: q108
    type: mcq
    concept: multiple-sufficient-causes-and-material-contribution
    difficulty: 1
    stem: What is a case of multiple sufficient causes?
    options:
      - text: Two events are both needed to cause the harm, as with the parked truck and the drunk driver.
        why: Tempting because March involved two negligent parties, but there both acts were necessary; multiple sufficient causes means each event alone was enough.
      - text: One event causes the harm and a later event then makes the harm worse.
        why: Tempting because it involves two events, but that describes an intervening act that exacerbates harm, a scope of liability question for Topic 11.
      - text: The defendant's conduct increases the risk of harm without proof that it caused the harm.
        why: Tempting because it is another gap case, but that is increased risk (Amaca v Ellis), not two events each sufficient to cause the harm.
      - text: Two or more events exist, each of which is sufficient on its own to cause the harm.
        correct: true
        why: 'Correct — the slides: the ''but for'' test does not work where two or more events, each of which is sufficient to cause the harm, exist.'
  - key: q109
    type: mcq
    concept: multiple-sufficient-causes-and-material-contribution
    difficulty: 2
    stem: Why do common law principles still govern multiple sufficient causes in NSW?
    options:
      - text: The Negligence Review Panel made no recommendations on how to deal with them.
        correct: true
        why: 'Correct — the slides: as the Panel made no recommendations on multiple sufficient causes, common law principles continue to apply.'
      - text: Section 5D(2) expressly leaves multiple sufficient causes to the common law.
        why: Tempting because s 5D(2) refers to "established principles", but it says nothing expressly about multiple sufficient causes; the reason is the Panel's silence.
      - text: Section 3B(1) excludes all multiple-cause claims from the operation of the CLA.
        why: Tempting because s 3B(1) does exclude some claims, but those are listed kinds such as dust disease and tobacco claims, not multiple causes in general.
      - text: The High Court held in Adeels Palace that the CLA does not apply to them.
        why: Wrong — Adeels Palace was about a single defendant's failure to provide security and applied s 5D; it did not take multiple sufficient causes outside the Act.
  - key: q110
    type: mcq
    concept: multiple-sufficient-causes-and-material-contribution
    difficulty: 2
    stem: In Cook v Lewis (1961), what did the Supreme Court of Canada do when the jury could not decide which hunter's gun fired the single bullet?
    options:
      - text: Held neither defendant liable, because 'but for' could not be satisfied against either.
        why: Tempting because 'but for' does fail against each hunter, but the court refused that result and found a way to hold the negligent defendants responsible.
      - text: Held both negligent defendants liable.
        correct: true
        why: 'Correct — the slides: the Canadian Supreme Court held both negligent defendants liable as the jury had been unable to decide which gun fired the bullet.'
      - text: Apportioned liability according to how close each hunter stood to the plaintiff.
        why: Tempting as a creative solution, but the slides describe no such apportionment; the court held both liable, and closeness is not mentioned anywhere.
      - text: Ordered a new trial to establish which bullet had struck the plaintiff.
        why: Wrong — the slides say the court held both defendants liable; it did not send the case back to identify the bullet.
  - key: q111
    type: mcq
    concept: multiple-sufficient-causes-and-material-contribution
    difficulty: 2
    stem: Several manufacturers negligently made the same device, and Priya cannot identify whose device injured her. Which solution do the slides describe for this kind of case?
    options:
      - text: 'Contribution: Priya sues one manufacturer, which then recovers shares from the others under the 1946 Act.'
        why: Tempting because contribution also spreads loss among wrongdoers, but it assumes each is liable for the same damage; it does not solve Priya's inability to prove whose device it was.
      - text: No liability, because Priya must identify the manufacturer on the balance of probabilities.
        why: Tempting because s 5E puts the onus on the plaintiff, but the slides show courts being creative where several potentially negligent defendants cannot be told apart.
      - text: 'Market share liability: each defendant pays a portion of the compensation in line with its market share.'
        correct: true
        why: 'Correct — the slides: market share liability is a solution where multiple defendants are potentially negligent; each pays in alignment with its market share.'
      - text: Liability only for the largest manufacturer, as the most likely source of the device.
        why: Wrong — market share liability spreads the compensation across the manufacturers by market share; it does not pin it all on the biggest one.
  - key: q112
    type: truefalse
    concept: multiple-sufficient-causes-and-material-contribution
    difficulty: 2
    statement: The textbook flowchart and the lecture slides both treat Bonnington Castings v Wardlaw as a multiple sufficient causes case.
    answer: false
    why: 'False — the flowchart lists Bonnington under multiple sufficient causes, but the slides treat it as a material contribution case: a more than de minimis contribution was enough.'
  - key: q113
    type: mcq
    concept: multiple-sufficient-causes-and-material-contribution
    difficulty: 3
    variant-of: q108
    stem: Two hunters, acting independently and both carelessly, fire at the same moment; either shot alone would have killed the walker. Each says, "But for my shot, he would still have died." Why is this a problem for causation?
    options:
      - text: Each shot was sufficient on its own, so the 'but for' test clears both hunters even though both were negligent.
        correct: true
        why: 'Correct — this is multiple sufficient causes: removing either shot leaves the other, so ''but for'' fails against each, which is why courts have looked beyond it.'
      - text: Both shots were necessary conditions of the death, so the 'but for' test simply makes each careless hunter fully liable for it.
        why: 'Tempting because both hunters were at fault, but neither shot was necessary: the walker would have died from the other, which is exactly the problem.'
      - text: The second shot is a novus actus that breaks the chain from the first.
        why: Tempting because there are two acts, but they were simultaneous and independent; a novus actus is a later event exacerbating harm or causing new harm.
      - text: The walker's estate can prove only an increased risk, which Amaca v Ellis says is not enough.
        why: Wrong — the facts show the shots killed him; the difficulty is not mere risk but that each sufficient cause makes 'but for' fail against the other hunter.
  - key: q114
    type: mcq
    concept: scope-of-liability-element
    difficulty: 1
    stem: What kind of question is scope of liability under s 5D(1)(b)?
    options:
      - text: A factual question, answered by expert evidence of what in fact caused the harm.
        why: Tempting because experts feature in causation, but that describes factual causation; scope of liability asks whether liability ought to extend to the harm.
      - text: A procedural question about which party bears the onus of proof.
        why: Tempting because s 5E deals with onus, but that is a separate provision; s 5D(1)(b) asks whether it is appropriate for liability to extend to the harm.
      - text: 'A question of damages: how much compensation the plaintiff should receive.'
        why: Wrong — the amount of damages is a remedies question; scope of liability decides whether the defendant should be responsible for the harm at all.
      - text: 'A normative question: is it appropriate for liability to extend to this harm?'
        correct: true
        why: 'Correct — slide 23: once factual causation is established, s 5D(1)(b) asks whether it is appropriate for liability to extend to the harm — a normative question.'
  - key: q115
    type: mcq
    concept: scope-of-liability-element
    difficulty: 1
    stem: What is a novus actus interveniens?
    options:
      - text: A later event that exacerbates the original harm or causes new harm.
        correct: true
        why: Correct — slide 24 defines a novus actus interveniens as a later event that exacerbates the original harm or causes new harm.
      - text: An earlier event that made the plaintiff more vulnerable to the harm.
        why: Tempting because earlier vulnerability matters elsewhere in negligence, but a novus actus is by definition later than the original wrong.
      - text: A second defendant's negligence that was needed for the harm to occur at all.
        why: Tempting because March involved a second negligent actor, but an act needed for the original harm is a cause of it, not a later intervening event.
      - text: A statement by the plaintiff, after the harm, about what he or she would have done.
        why: Wrong — that is the kind of statement s 5D(3)(b) makes inadmissible unless against interest; it has nothing to do with intervening acts.
  - key: q116
    type: mcq
    concept: scope-of-liability-element
    difficulty: 2
    stem: According to the slides, which of these can be a novus actus interveniens?
    options:
      - text: Only a deliberate criminal act committed by a third party.
        why: Tempting because crimes are the dramatic example, but the slides list three possible sources, and a crime by a third party is only one of them.
      - text: The plaintiff's own act, a third party's act, or a natural event.
        correct: true
        why: 'Correct — slide 24: an intervening act could be the plaintiff''s own act, a third party, or a natural event.'
      - text: Only a further act of the defendant done after the original breach.
        why: Tempting because the defendant's later conduct can matter, but the slides' list is the plaintiff's act, a third party's act, or a natural event.
      - text: Only a natural event that no human being could have prevented.
        why: Wrong — natural events are one source, but the plaintiff's own act (McKew) and a third party's act can also intervene.
  - key: q117
    type: mcq
    concept: scope-of-liability-element
    difficulty: 2
    stem: If the chain of causation is broken by an intervening act, what follows?
    options:
      - text: The original wrongdoer escapes liability for all the harm, including the original injury.
        why: Tempting because "broken chain" sounds total, but the break only cuts off harm after it; the wrongdoer stays liable for the original injury (as in McKew, liable for the leg but not the fracture).
      - text: Liability for all the harm is apportioned equally between the wrongdoer and the intervener.
        why: Tempting as a compromise, but the slides describe no equal split; the effect of a break is that the original wrongdoer is not liable for harm after it.
      - text: The original wrongdoer is not liable for harm after the break.
        correct: true
        why: 'Correct — slide 24: if the chain is broken, the original wrongdoer is not liable for harm after the break.'
      - text: The plaintiff must sue the intervener first and recover any shortfall from the wrongdoer.
        why: Wrong — there is no such order of suing; the question is simply whether the original wrongdoer's liability extends to the later harm.
  - key: q118
    type: mcq
    concept: scope-of-liability-element
    difficulty: 2
    stem: Why did the drunk driver's own negligence not break the chain of causation in March v Stramare?
    options:
      - text: Because the driver was drunk, his driving was not a voluntary act.
        why: Tempting because McKew turned on the plaintiff's choices, but nothing on the slides says drunkenness made the driving involuntary; the reason lies in the risk the truck created.
      - text: Because the truck had been parked that way for a long time, the practice was reasonable.
        why: Tempting because the long practice is in the facts, but the defendant was negligent; a long-standing practice did not make parking mid-road reasonable.
      - text: The defendant's wrongful conduct generated the very risk of injury that materialised.
        correct: true
        why: 'Correct — Mason CJ: the chain is not broken where "the defendant''s wrongful conduct has generated the very risk of injury resulting from the negligence of the plaintiff or a third party".'
      - text: Because a plaintiff's contributory negligence can never be a novus actus.
        why: Wrong — McKew shows a plaintiff's own unreasonable conduct can break the chain; March turned on the very risk the truck created, not a blanket rule.
  - key: q119
    type: mcq
    concept: scope-of-liability-element
    difficulty: 2
    stem: In McKew v Holland Hannen & Cubitts Ltd, why was the defendant not liable for the ankle fracture?
    options:
      - text: The fracture was a different kind of harm from the leg injury, so it was too remote.
        why: Tempting because remoteness is the other part of scope of liability, but McKew was decided on the plaintiff's unreasonable conduct breaking the chain.
      - text: Going down a steep staircase without a handrail, unaided, on a leg prone to give way was unreasonable conduct that broke the chain.
        correct: true
        why: 'Correct — the slides: his unreasonable conduct was a novus actus; the chain was broken and the defendant was not liable for the second injury.'
      - text: The plaintiff could not prove that the leg gave way because of the original injury.
        why: Tempting as a factual causation point, but the slides accept that the injured leg was prone to give way and did; the issue was his own conduct.
      - text: The owner of the staircase was solely responsible for the fall.
        why: Wrong — nothing on the slides blames the staircase owner; the chain was broken by the plaintiff's own unreasonable conduct.
  - key: q120
    type: mcq
    concept: scope-of-liability-element
    difficulty: 3
    variant-of: q118
    contrasts-with:
      - factual-causation-necessary-condition
    stem: Which statement best contrasts March v Stramare with McKew v Holland Hannen & Cubitts?
    options:
      - text: In March the later careless act fell within the very risk the defendant created; in McKew the plaintiff's unreasonable conduct broke the chain.
        correct: true
        why: 'Correct — not every later careless act severs the chain: in March the truck generated the very risk; in McKew the plaintiff''s unreasonable conduct was a novus actus.'
      - text: In March the plaintiff's drinking broke the chain; in McKew it did not, because the leg was already injured.
        why: 'Tempting because both involve a plaintiff''s own conduct, but this reverses the results: March held the defendant liable; McKew held the chain broken.'
      - text: Both held that any careless act by the plaintiff after the breach breaks the chain.
        why: 'Tempting as a simple rule, but the slides say the opposite: not every later careless act severs the chain, as March shows.'
      - text: Both were decided on factual causation alone, so neither concerns scope of liability.
        why: Wrong — the slides use both to introduce intervening acts, which fall under scope of liability; that is why they are revisited in Topic 11.
  - key: q121
    type: truefalse
    concept: scope-of-liability-element
    difficulty: 1
    statement: Every later careless act by the plaintiff or a third party breaks the chain of causation.
    answer: false
    why: 'False — slide 25: not every later careless act severs the chain. In March v Stramare the driver''s own negligence did not, because the truck created the very risk.'
  - key: q122
    type: truefalse
    concept: scope-of-liability-element
    difficulty: 2
    statement: Section 5D(4) requires the court, in determining the scope of liability, to consider whether or not and why responsibility for the harm should be imposed on the negligent party.
    answer: true
    why: 'True — that is the text of s 5D(4) (amongst other relevant things); the slides call it a normative question: whether and why responsibility should be imposed.'
  - key: q123
    type: mcq
    concept: scope-of-liability-element
    difficulty: 3
    variant-of: q119
    stem: Sam's knee is injured through his employer's negligence. Weeks later, against medical advice, he plays a game of basketball and tears the knee completely. On the Topic 10 slides, which question decides whether the employer is liable for the tear?
    options:
      - text: Whether the employer's negligence was a necessary condition of the first knee injury under s 5D(1)(a).
        why: Tempting because factual causation comes first, but it is not in doubt for the first injury; the issue is the later harm, which is a scope question.
      - text: Whether Sam can show a loss of a chance of a better recovery, under Tabet v Gett.
        why: Tempting because the knee got worse, but Tabet concerns a lost chance of a better medical outcome; here the issue is Sam's own later conduct.
      - text: Whether Sam's own conduct was a novus actus that broke the chain — a scope of liability question.
        correct: true
        why: Correct — a later act of the plaintiff that exacerbates the harm raises the intervening act question under scope of liability (s 5D(1)(b)), as in McKew.
      - text: Whether s 5D(2) treats the case as exceptional because two events contributed to the tear.
        why: Wrong — s 5D(2) is for negligence that cannot be shown to be a necessary condition; a later act by the plaintiff is an intervening act question.
  - key: q124
    type: short
    concept: scope-of-liability-element
    difficulty: 3
    cases:
      - mckew-v-holland-hannen-and-cubitts-ltd
      - march-v-stramare
    prompt: Peter was a maintenance linesman employed by State Rail. He was seriously injured at work when he fell down a railway embankment at night. He had been given a defective torch by his employer. He received workers' compensation for some time then he was wrongfully cut off from workers comp by his employer. Peter worried about how to support his family and began to grow Indian hemp, intending to produce and sell marijuana. Before his personal injury trial, Peter was arrested, convicted and imprisoned for 9 months for cultivating Indian hemp. He wants to sue his employer for the imprisonment. Advise Peter. (Answer on causation, using the Topic 10 material on intervening acts; Topic 11 covers scope of liability in full.)
    model: |-
      The issue is whether State Rail's liability for its negligence (the defective torch) extends to Peter's imprisonment.

      Factual causation (CLA s 5D(1)(a); 'but for'): Peter can argue that but for the fall he would not have been on workers' compensation, would not have been cut off, and would not have turned to growing hemp. Even if that chain is accepted on the balance of probabilities (s 5E), causation is not finished.

      Scope of liability (s 5D(1)(b)) is a normative question: is it appropriate for liability to extend to this harm? Under s 5D(4) the court considers whether and why responsibility should be imposed. Peter's deliberate decision to commit a crime is his own later act, and a novus actus interveniens can be the plaintiff's own act. If it breaks the chain, State Rail is not liable for harm after the break. In McKew the plaintiff's unreasonable conduct broke the chain. Not every later act does: in March v Stramare the defendant's conduct generated the very risk that materialised. A defective torch creates a risk of falling, not of the plaintiff choosing to commit a crime. The wrongful cutting off of compensation may be argued as a pressure, but it does not make the crime part of the original risk.

      Peter is likely to fail: his deliberate criminal conduct breaks the chain, so the imprisonment falls outside the scope of State Rail's liability for the fall.
    rubric:
      - id: r1
        criterion: Issue
        marks: 2
        top-band: Frames the issue as whether liability for the negligent injury extends to the imprisonment — causation, and in particular an intervening act.
        margin-note: Name the harm you are tracing.
        authorities: []
      - id: r2
        criterion: Law
        marks: 3
        top-band: States s 5D(1)(a) and (b), s 5D(4) and s 5E; defines novus actus interveniens (plaintiff's own act) and its effect; uses McKew and contrasts March v Stramare's very risk.
        margin-note: Good use of the March/McKew contrast.
        authorities:
          - civil-liability-act-2002-nsw-s5d
          - civil-liability-act-2002-nsw-s5e
      - id: r3
        criterion: Application
        marks: 3
        top-band: Concedes a possible 'but for' chain, then argues the deliberate crime is Peter's own later act outside the very risk the defective torch created; deals with the wrongful cut-off.
        margin-note: Separate fact from ought.
        authorities: []
      - id: r4
        criterion: Conclusion
        marks: 2
        top-band: Concludes that the chain is likely broken and the imprisonment is outside the scope of liability, noting Topic 11 for the full test.
        margin-note: Commit to an answer.
        authorities: []
  - key: q125
    type: mcq
    concept: contribution-between-tortfeasors
    difficulty: 2
    variant-of: q080
    stem: Kim, a cyclist, is hurt by the concurrent negligence of a council and a driver, who are jointly and severally liable. She sues only the driver, who pays the whole amount. What may the driver then do?
    options:
      - text: Seek a contribution from the council under the Law Reform (Miscellaneous Provisions) Act 1946 (NSW).
        correct: true
        why: Correct — a tortfeasor held liable for the full amount may seek a contribution against another tortfeasor; the textbook cites the 1946 Act, s 5(1)(c) and s 5(2).
      - text: Ask the court to reduce the damages Kim recovers by the share of the loss that the council ought to bear.
        why: Tempting because the council shares the blame, but contribution in no way affects the plaintiff; Kim keeps the whole amount.
      - text: Require Kim to bring a second action against the council for its share.
        why: Tempting because the council is also liable, but Kim may recover the whole amount from one tortfeasor; recovering shares is for the tortfeasors.
      - text: Nothing at all, because Kim chose to sue only the driver.
        why: Wrong — Kim's choice to sue one tortfeasor does not stop that tortfeasor seeking contribution from the other under the statute.
  - key: q126
    type: mcq
    concept: contribution-between-tortfeasors
    difficulty: 2
    variant-of: q081
    stem: Kim obtains judgment against both the council and the driver, who are jointly and severally liable. The driver is uninsured and insolvent. Who bears the risk that the driver cannot pay?
    options:
      - text: Kim, whose recovery is cut down by the share of the damages the driver cannot pay.
        why: Tempting because the driver's share goes unpaid, but the textbook says the risk of a tortfeasor's insolvency lies with the other tortfeasors, not the plaintiff.
      - text: The council, the other tortfeasor, which can be made to pay the whole amount.
        correct: true
        why: Correct — where tortfeasors are concurrent, the risk that one cannot pay lies with the other tortfeasors; Kim can recover the whole amount from the council.
      - text: Kim and the council equally, since both are blameless as to the insolvency.
        why: Tempting as a fair split, but the textbook puts the insolvency risk on the other tortfeasors, not on the plaintiff in any share.
      - text: 'No one: the court writes off the driver''s share of the damages.'
        why: Wrong — nothing is written off; joint and several liability lets Kim recover the whole from the solvent tortfeasor.
  - key: q127
    type: mcq
    concept: contribution-between-tortfeasors
    difficulty: 3
    variant-of: q086
    stem: Omar's warehouse stock is damaged by the concurrent negligence of two contractors, and his claim is only for that property damage. What is the safest advice?
    options:
      - text: He may always recover the whole amount from either contractor, whatever the kind of claim.
        why: Tempting because that is the general rule for joint and several liability, but the textbook's footnote qualifies it for property damage and economic loss claims.
      - text: He must sue both contractors and recover from each its own share of the loss.
        why: Tempting as the effect of proportionate liability, but it overstates what the materials say; the footnote only says to check whether those provisions apply.
      - text: Check whether the proportionate liability provisions apply before saying he can recover the whole amount from one contractor.
        correct: true
        why: Correct — the textbook qualifies the whole-amount rule where proportionate liability provisions apply to property damage and economic loss claims.
      - text: Nothing turns on the kind of claim, because contribution sorts out the shares later.
        why: Wrong — contribution is between tortfeasors, but the footnote shows the kind of claim can change what the plaintiff himself recovers.
  - key: q128
    type: mcq
    concept: contribution-between-tortfeasors
    difficulty: 1
    variant-of: q079
    stem: Two tortfeasors are arguing about how to share the damages they caused Lee. Lee's lawyer asks whether that argument can reduce what Lee recovers. What is the answer?
    options:
      - text: Yes — Lee's damages are reduced until the tortfeasors agree on their shares.
        why: Tempting because the dispute concerns Lee's damages, but contribution in no way affects the plaintiff; it is between the tortfeasors.
      - text: Yes, if one tortfeasor is later found to be much more to blame for the harm than the other.
        why: Tempting because blame can affect shares between tortfeasors, but that is for contribution; it does not change what Lee may recover.
      - text: No — contribution is a matter between the tortfeasors and in no way affects Lee.
        correct: true
        why: 'Correct — the textbook: contribution in no way affects the plaintiff; it is a matter between the tortfeasors themselves.'
      - text: No, but only if Lee has already sued both tortfeasors.
        why: Wrong — Lee need not sue both; even suing one, Lee is unaffected by how the tortfeasors share the loss between themselves.
  - key: q129
    type: truefalse
    concept: contribution-between-tortfeasors
    difficulty: 2
    variant-of: q087
    statement: A plaintiff who recovers the whole amount from one of two jointly and severally liable tortfeasors must give part of it back if the other tortfeasor is later found to be more to blame.
    answer: false
    why: False — contribution in no way affects the plaintiff; any adjustment for relative blame happens between the tortfeasors through the statutory contribution mechanism.
  - key: q130
    type: mcq
    concept: contribution-between-tortfeasors
    difficulty: 3
    variant-of: q078
    contrasts-with:
      - multiple-sufficient-causes-and-material-contribution
    stem: Which of these describes contribution between tortfeasors, rather than another Topic 10 mechanism?
    options:
      - text: Each manufacturer pays the plaintiff a portion of the compensation in line with its market share.
        why: Tempting because it also spreads loss among defendants, but that is market share liability, a response to multiple potentially negligent defendants.
      - text: Each negligent defendant is held liable in full where the court cannot tell which defendant's act caused the harm.
        why: Tempting because it involves several wrongdoers, but that is the Cook v Lewis approach to multiple sufficient causes, not contribution.
      - text: A tortfeasor held liable for the full amount seeks a share from another tortfeasor; the plaintiff is unaffected.
        correct: true
        why: 'Correct — that is the textbook''s description of contribution: a statutory mechanism between tortfeasors that in no way affects the plaintiff.'
      - text: The plaintiff's damages are reduced to reflect the plaintiff's own share of the fault.
        why: Wrong — that describes contributory negligence (the 70% finding in March v Stramare), which reduces the plaintiff's damages; contribution does not touch them.
  - key: q131
    type: mcq
    concept: common-sense-causation-and-s5d
    difficulty: 1
    stem: In March v Stramare, what did Mason CJ say about the 'but for' test?
    options:
      - text: It is the exclusive test, with policy dealt with as part of remoteness.
        why: Tempting because one judge in March did say this, but it was McHugh J; Mason CJ took the opposite view of exclusivity.
      - text: It was never the exclusive test of causation in negligence.
        correct: true
        why: Correct — Mason CJ noted that the 'but for' test was never the exclusive test, for example where two or more acts are involved or the chain is broken.
      - text: It should be replaced by a test of material contribution to harm.
        why: Tempting because material contribution appears in Lecture 2, but Mason CJ did not replace 'but for'; he denied it was exclusive and turned to common sense.
      - text: It applies only where the defendant's conduct was deliberate rather than careless.
        why: Wrong — 'but for' is the general test for factual causation in negligence, which is about careless conduct; nothing confines it to deliberate acts.
  - key: q132
    type: mcq
    concept: common-sense-causation-and-s5d
    difficulty: 1
    stem: According to Mason CJ in March v Stramare, how must causation be determined?
    options:
      - text: By asking whether the harm was of a kind a reasonable person would foresee.
        why: Tempting because foreseeability runs through negligence, but Mason CJ treated causation as a question of fact, decided by common sense, not foreseeability.
      - text: By asking only whether the harm would have occurred but for the negligence.
        why: Tempting because 'but for' is the usual test, but Mason CJ said it was never exclusive; he added common sense for the cases where it fails.
      - text: By applying common sense to the facts of each particular case.
        correct: true
        why: 'Correct — Mason CJ: causation is a question of fact which "must be determined by applying common sense to the facts of each particular case".'
      - text: By comparing each party's share of responsibility for the accident.
        why: Wrong — comparing shares of responsibility is apportionment for contributory negligence (the 70% finding), not the test for causation.
  - key: q133
    type: mcq
    concept: common-sense-causation-and-s5d
    difficulty: 2
    stem: What was McHugh J's position on causation in March v Stramare?
    options:
      - text: Common sense should decide causation, with 'but for' as no more than a guide.
        why: Tempting because March is famous for common sense, but that was Mason CJ's approach; McHugh J wanted 'but for' to be exclusive.
      - text: The plaintiff's 70% contributory negligence meant there was no causation at all.
        why: Tempting because the plaintiff was largely at fault, but contributory negligence reduces damages; it is not McHugh J's test of causation.
      - text: '''But for'' should be the exclusive test, with a ''scope of the risk'' test letting policy factors in as part of remoteness.'
        correct: true
        why: 'Correct — McHugh J: ''but for'' should be the exclusive test of causation, with policy handled by a scope of the risk test within remoteness of damage.'
      - text: Causation exists whenever the defendant generated the very risk that materialised.
        why: Wrong — the "very risk" words are Mason CJ's, about when a later careless act does not break the chain; they are not McHugh J's test.
  - key: q134
    type: mcq
    concept: common-sense-causation-and-s5d
    difficulty: 2
    stem: Which sequence correctly describes the outcome at each level in March v Stramare?
    options:
      - text: 'Trial: defendant liable with 70% contributory negligence; Full Court: all responsibility on the plaintiff; High Court: the defendant''s negligence was a cause.'
        correct: true
        why: 'Correct — slides 9–10: liable at trial with 70% contributory negligence, entire responsibility on the plaintiff in the Full Court of South Australia, then the High Court found for the plaintiff on causation.'
      - text: 'Trial: plaintiff wholly responsible; Full Court: defendant liable; High Court: restored the trial result.'
        why: 'Tempting because the decision did swing between courts, but this reverses the first two stages: the trial judge found the defendant liable.'
      - text: 'Trial: defendant wholly liable; Full Court: 70% contributory negligence; High Court: no causation.'
        why: Tempting because the 70% figure is in the case, but it came from the trial judge, and the High Court found the defendant's negligence was a cause.
      - text: 'Trial and Full Court: defendant liable; High Court: the plaintiff''s drinking broke the chain.'
        why: Wrong — the Full Court put all responsibility on the plaintiff, and the High Court held the driver's negligence did not break the chain.
  - key: q135
    type: mcq
    concept: common-sense-causation-and-s5d
    difficulty: 2
    stem: What was the Ipp Report's main criticism of the 'common sense' approach to causation?
    options:
      - text: It made causation too difficult for plaintiffs to prove in medical cases.
        why: Tempting because medical cases are hard, but the criticism was not about difficulty of proof; it was about policy hidden inside a factual question.
      - text: It hid policy choices about responsibility inside what looked like a factual question, making the law less transparent and predictable.
        correct: true
        why: 'Correct — slide 12: value judgments about who should be responsible and how far liability should extend were hidden under a simple-looking factual question.'
      - text: It ignored the role of expert evidence in proving what in fact happened.
        why: Tempting because evidence is central to factual causation, but the Ipp Report's concern was the hidden value judgments, not neglect of experts.
      - text: It applied the criminal standard of proof to a civil question.
        why: Wrong — nothing in the critique concerns the standard of proof; the CLA keeps the balance of probabilities (s 5E).
  - key: q136
    type: mcq
    concept: common-sense-causation-and-s5d
    difficulty: 2
    stem: Which statement about CLA s 5D(1) is correct?
    options:
      - text: It abolished the common law of causation and replaced it with a new test.
        why: Tempting because the statute uses new words, but the slides say the CLA restructured and codified the common law; the cases are still important.
      - text: It adopted Mason CJ's common sense test in statutory form.
        why: Tempting because March is the leading common law case, but s 5D(1) separates the factual question from policy, which is what the Ipp Report wanted instead of common sense.
      - text: It restructured and codified the common law, so the cases are still important.
        correct: true
        why: 'Correct — slide 13: the CLA has restructured and codified the common law, and "the cases are still important!"'
      - text: It deals only with factual causation, leaving scope of liability out of the Act.
        why: Wrong — s 5D(1)(b) states scope of liability and s 5D(4) says how to approach it, even though the detailed test comes from the common law.
  - key: q137
    type: mcq
    concept: common-sense-causation-and-s5d
    difficulty: 2
    stem: In Adeels Palace v Moubarak, how did the High Court contrast s 5D(1) with Mason CJ's approach in March?
    options:
      - text: Section 5D(1) treats factual causation and scope of liability as separate and distinct issues.
        correct: true
        why: Correct — the Court noted that, in contrast to what Mason CJ observed in March, s 5D(1) "treats factual causation and scope of liability as separate and distinct issues".
      - text: Section 5D(1) treats causation as a single question of common sense.
        why: 'Tempting because that sounds like a codified March, but Adeels Palace said the opposite: the Act splits causation into two distinct questions.'
      - text: Section 5D(1) makes scope of liability a part of factual causation.
        why: Tempting because the two are in one subsection, but the Court stressed they are separate and distinct; policy does not belong in the factual question.
      - text: Section 5D(1) lets a court skip factual causation altogether where policy strongly favours liability.
        why: Wrong — factual causation must be established (or, exceptionally, s 5D(2) applies); policy alone cannot replace it, as Adeels Palace itself shows.
  - key: q138
    type: mcq
    concept: common-sense-causation-and-s5d
    difficulty: 2
    stem: Why did the claim in Adeels Palace v Moubarak fail on factual causation?
    options:
      - text: The club owed its patrons no duty to protect them from the criminal acts of others.
        why: Tempting because the harm came from a third party's crime, but the case failed on causation; the club was an occupier owing its entrants a duty.
      - text: A shooting on New Year's Eve was not a foreseeable risk for a nightclub.
        why: Tempting because the shooting was extreme, but foreseeability goes to breach; the claim failed because the evidence did not prove causation.
      - text: The evidence did not show that security staff would have deterred or prevented the gunman's re-entry.
        correct: true
        why: 'Correct — slide 17: the evidence at trial did not show that the presence of security personnel would have deterred or prevented the re-entry of the gunman.'
      - text: The gunman's deliberate return with a weapon broke the chain, so the scope of liability element was not met.
        why: Wrong — the Court decided the case on factual causation (the 'but for' test), not on an intervening act under scope of liability.
  - key: q139
    type: mcq
    concept: common-sense-causation-and-s5d
    difficulty: 3
    contrasts-with:
      - s5d2-exceptional-cases
    stem: A plaintiff proves that, had the occupier changed some of the circumstances, the harm might not have happened. On Adeels Palace, is that enough for factual causation?
    options:
      - text: Yes — any real possibility that precautions would have helped satisfies s 5D(1)(a).
        why: Tempting because the precautions were missing, but a possibility is not proof on the balance of probabilities that the negligence was a necessary condition.
      - text: Yes, as long as the breach is clear and the evidence leaves a gap, because s 5D(2) then supplies factual causation.
        why: Tempting because the flowchart mentions a clear breach, but Adeels Palace found no reason to treat such a case as exceptional under s 5D(2).
      - text: No — but only because the CLA requires proof beyond reasonable doubt.
        why: 'Tempting because the answer is no, but the reason is wrong: the standard is the balance of probabilities (s 5E), and "might have" does not meet even that.'
      - text: No — that a change in the circumstances might have made a difference does not prove factual causation.
        correct: true
        why: 'Correct — Adeels Palace: changing "any of the circumstances in which the shootings occurred might have made a difference does not prove factual causation".'
  - key: q140
    type: mcq
    concept: common-sense-causation-and-s5d
    difficulty: 2
    stem: In Strong v Woolworths, what was Woolworths' breach of duty?
    options:
      - text: Failing to employ a system for the periodic inspection and cleaning of the area where Ms Strong fell.
        correct: true
        why: 'Correct — slide 20: Woolworths'' negligence lay in its failure to employ a system for the periodic inspection and cleaning of the area.'
      - text: Failing to put up signs warning customers on crutches about greasy food on the footpath near the store entrance.
        why: Tempting because Ms Strong walked with crutches, but the breach the High Court identified was the lack of an inspection and cleaning system, not a missing warning.
      - text: Failing to clean up the chip the moment it was dropped on the ground.
        why: Tempting because the chip caused the fall, but a reasonable occupier is not expected to remove hazards instantly; an inspection at reasonable intervals was enough.
      - text: Selling hot chips that customers could carry outside the store.
        why: Wrong — selling food was not the breach; the High Court's finding concerned the absence of any system to inspect and clean the area.
  - key: q141
    type: mcq
    concept: common-sense-causation-and-s5d
    difficulty: 2
    stem: What did the High Court treat as an appropriate system in Strong v Woolworths?
    options:
      - text: Constant supervision of the area, so that any hazard is removed the moment it appears on the ground.
        why: Tempting as the safest option, but the law does not demand perfection; the Court accepted inspection at intervals, not constant supervision.
      - text: Inspection and removal of slipping hazards at intervals of not greater than 20 minutes.
        correct: true
        why: 'Correct — slide 20: an appropriate system was inspection and removal of slipping hazards at intervals of not greater than 20 minutes.'
      - text: One inspection at opening time and another at closing time each day.
        why: Tempting as a routine, but that would leave hours unchecked; the appropriate system was inspection at intervals of not greater than 20 minutes.
      - text: Warning signs at the entrance, with no need for inspections.
        why: Wrong — signs were not the standard set; the Court looked for periodic inspection and cleaning of the area.
  - key: q142
    type: mcq
    concept: common-sense-causation-and-s5d
    difficulty: 3
    stem: Why did it matter when the chip was dropped in Strong v Woolworths?
    options:
      - text: If it was dropped early, Ms Strong would be contributorily negligent for not seeing it.
        why: Tempting because contributory negligence often arises, but the timing went to whether the missing system caused the fall, not to her own care.
      - text: If it fell in the last 20 minutes before the fall, a reasonable inspection system would not have removed it, so the lack of a system would not be a necessary condition of the fall.
        correct: true
        why: Correct — with 20-minute inspections, a chip dropped in the final 20 minutes would still have been there; only a chip dropped earlier makes the missing system a 'but for' cause.
      - text: If it was dropped late, the customer who dropped it would be the only defendant.
        why: Tempting because someone else dropped the chip, but no such customer was identified; timing went to whether Woolworths' breach caused the fall.
      - text: It did not matter, because the absence of any system proved causation by itself.
        why: Wrong — a breach does not prove causation; the Court had to decide on the probabilities when the chip was deposited.
  - key: q143
    type: mcq
    concept: common-sense-causation-and-s5d
    difficulty: 3
    variant-of: q142
    stem: On what basis did the High Court find causation established in Strong v Woolworths?
    options:
      - text: It was certain that the chip had been on the ground for more than 20 minutes.
        why: Tempting because the Court found for Ms Strong, but nothing was certain; the finding was about which period was more probable.
      - text: Woolworths could not prove that the chip fell in the last 20 minutes before the fall.
        why: 'Tempting because Woolworths lost, but this reverses the onus: s 5E puts it on the plaintiff, and she discharged it on the probabilities.'
      - text: The chip was more likely dropped by a customer than by a member of staff.
        why: Wrong — who dropped the chip did not matter; what mattered was when, measured against a reasonable inspection interval.
      - text: On the balance of probabilities, the chip was deposited in the longer period between 8.00am and 12.10pm, not the shorter one after 12.10pm.
        correct: true
        why: 'Correct — [38]: "the probabilities favoured the conclusion that the chip was deposited in the longer period between 8.00am and 12.10pm and not the shorter period between 12.10pm and the time of the fall".'
  - key: q144
    type: truefalse
    concept: common-sense-causation-and-s5d
    difficulty: 1
    statement: Mason CJ said in March v Stramare that the 'but for' test was the exclusive test of causation in negligence.
    answer: false
    why: False — Mason CJ said the 'but for' test was never the exclusive test; it was McHugh J who said 'but for' should be the exclusive test.
  - key: q145
    type: truefalse
    concept: common-sense-causation-and-s5d
    difficulty: 2
    statement: In Adeels Palace v Moubarak the High Court reasoned that factual causation under s 5D(1) is to be determined by the 'but for' test.
    answer: true
    why: 'True — slide 17: the High Court reasoned that factual causation under s 5D(1) is determined by the ''but for'' test, and on the evidence it was not satisfied.'
  - key: q146
    type: truefalse
    concept: common-sense-causation-and-s5d
    difficulty: 2
    statement: In Strong v Woolworths the District Court found Woolworths negligent, the Court of Appeal reversed that finding, and the High Court decided causation in Ms Strong's favour.
    answer: true
    why: 'True — slides 19–21: the District Court found negligence, the Court of Appeal reversed, and the High Court held the probabilities favoured the chip being deposited in the longer period.'
  - key: q147
    type: truefalse
    concept: common-sense-causation-and-s5d
    difficulty: 2
    statement: The Ipp Report endorsed 'common sense' as the test for factual causation because it lets judges weigh policy openly.
    answer: false
    why: False — the Ipp Report criticised 'common sense' because it hides policy choices inside a factual question, making the law less transparent and less predictable.
  - key: q148
    type: match
    concept: common-sense-causation-and-s5d
    difficulty: 2
    prompt: Match each source to what it says about factual causation.
    pairs:
      - left: Mason CJ in March v Stramare
        right: '''But for'' was never exclusive; apply common sense to the facts of each case'
      - left: McHugh J in March v Stramare
        right: '''But for'' should be exclusive, with a scope of the risk test in remoteness'
      - left: The Ipp Report
        right: '''Common sense'' hides policy choices inside a factual question'
      - left: Adeels Palace v Moubarak
        right: Section 5D(1) treats factual causation and scope of liability as separate and distinct
      - left: Strong v Woolworths
        right: Section 5D(1)(a) is a statutory statement of the 'but for' test
  - key: q149
    type: mcq
    concept: common-sense-causation-and-s5d
    difficulty: 3
    stem: In the tutorial hypo, Fred stops short of Lucy. Nancy, applying lipstick, runs a red light, hits Fred's stationary car and pushes it into Lucy. Applying the 'but for' / necessary condition test to Nancy, which statement is strongest?
    options:
      - text: Nancy is not a cause, because Fred's turn without looking came first in time.
        why: Tempting because Fred's carelessness began the sequence, but being earlier does not stop a later act being a necessary condition of the harm.
      - text: Only Fred's negligence counts, because his car was the one that struck Lucy.
        why: Tempting because Fred's car made contact, but it had stopped short; it reached Lucy only because Nancy's car pushed it into her.
      - text: Neither driver caused the harm, because Lucy crossed against the don't walk signal.
        why: Wrong — Lucy's own carelessness may matter to contributory negligence, but it does not mean neither driver's negligence was a necessary condition of her injuries.
      - text: 'Nancy''s negligence was a necessary condition of Lucy''s injuries: but for it, Fred''s car would not have been pushed into her.'
        correct: true
        why: Correct — Fred had stopped short of Lucy; but for Nancy running the red light and hitting his car, Lucy would not have been struck (s 5D(1)(a)).
  - key: q150
    type: short
    concept: common-sense-causation-and-s5d
    difficulty: 3
    cases:
      - barnett-v-chelsea-and-kensington-hospital
      - tabet-v-gett
      - mckew-v-holland-hannen-and-cubitts-ltd
      - adeels-palace-v-moubarak
    prompt: 'From the tutorial main hypo: Dr Sun, an employed surgeon working at the Hospital, then treated Lucy''s broken legs. Instead of putting her legs in plaster, which would have been the usual treatment given the nature of Lucy''s fractures, and which would have probably allowed Lucy''s legs to heal without any residual disability, Dr Sun was anxious to try a new technique of manipulation he had developed. This technique had never been used before in Australia. The technique was unsuccessful as it left Lucy with a permanent ankle disability in both legs. This so restricted her ability to engage in kickboxing that she gave up the sport. She started drinking heavily, which caused her to lose her job as an air traffic controller. Assuming the Hospital is vicariously liable for the negligence of Dr Sun, and that Dr Sun breached his duty, advise Lucy on causation.'
    model: |-
      Causation has two separate and distinct elements (CLA s 5D(1); Adeels Palace v Moubarak).

      Factual causation (s 5D(1)(a)): was Dr Sun's negligence a necessary condition of the permanent ankle disability — would she have suffered it but for his technique? Plaster "would have probably allowed" her legs to heal without residual disability. That is proof on the balance of probabilities (s 5E): more probable than not, the disability would not have occurred with proper treatment. Unlike Barnett, where timely treatment would not have saved the deceased, proper care here would probably have avoided the harm; and unlike Tabet v Gett, Lucy does not rely on a mere possibility or lost chance. Factual causation of the disability is likely established, and giving up kickboxing follows directly from it.

      Scope of liability (s 5D(1)(b)) is a separate, normative question: is it appropriate for liability to extend to each harm? For the disability, yes. The heavy drinking and loss of her job are harder: they follow Lucy's own later conduct, which may be argued to be a novus actus interveniens. In McKew the plaintiff's unreasonable conduct broke the chain; but not every later act does (March v Stramare). Under s 5D(4) the court considers whether and why responsibility should be imposed (Topic 11).

      Lucy is likely to recover for the disability and the loss of kickboxing; the drinking and job loss are arguable.
    rubric:
      - id: r1
        criterion: Issue and structure
        marks: 2
        top-band: Separates factual causation from scope of liability (s 5D(1); Adeels Palace) and traces each head of harm separately.
        margin-note: One harm at a time.
        authorities:
          - civil-liability-act-2002-nsw-s5d
      - id: r2
        criterion: Factual causation
        marks: 3
        top-band: Applies s 5D(1)(a) / 'but for' with s 5E to "would have probably" healed; contrasts Barnett and Tabet v Gett.
        margin-note: Probably = balance of probabilities.
        authorities:
          - civil-liability-act-2002-nsw-s5d
          - civil-liability-act-2002-nsw-s5e
      - id: r3
        criterion: Scope of liability
        marks: 3
        top-band: Treats the drinking and job loss as a possible novus actus by Lucy; uses McKew and March v Stramare; frames with s 5D(4).
        margin-note: 'Good: the later harms raise an ought question.'
        authorities:
          - civil-liability-act-2002-nsw-s5d
      - id: r4
        criterion: Conclusion
        marks: 2
        top-band: Concludes per head of harm, with a reasoned view on the arguable heads.
        margin-note: Answer each head.
        authorities: []
  - key: q151
    type: mcq
    concept: risk-chance-and-material-contribution
    difficulty: 1
    stem: In Tabet v Gett, how great was the chance that earlier action would have produced a better outcome?
    options:
      - text: Less than 50% — a possibility, not a probability.
        correct: true
        why: 'Correct — slide 6: the chance of a better outcome was less than 50%; the better outcome was only possible, not probable.'
      - text: More than 50%, but the harm was held too remote to recover.
        why: Tempting because remoteness is the other half of causation, but the chance was under 50%, and the case turned on that, not on remoteness.
      - text: Exactly 50%, so the court divided the damages between the parties.
        why: Tempting as a neat compromise, but the slides say the chance was less than 50%, and no damages were divided.
      - text: Unknown, because the plaintiff called no medical evidence at all.
        why: 'Wrong — the case turned on what the evidence showed: a chance of a better outcome that was less than 50%.'
  - key: q152
    type: mcq
    concept: risk-chance-and-material-contribution
    difficulty: 2
    stem: What did Gummow ACJ hold in Tabet v Gett?
    options:
      - text: Loss of a chance of a better medical outcome is always compensable if the chance was real.
        why: 'Tempting because the chance was real, but Gummow ACJ held the opposite for personal injury cases: such a loss is not actionable.'
      - text: In personal injury cases, Australian common law does not entertain an action where the damage is characterised as the loss of a chance of a better outcome.
        correct: true
        why: 'Correct — [46]: the law of negligence as understood in the common law of Australia does not entertain an action for recovery when the damage is characterised as the loss of a chance of a better outcome.'
      - text: Destruction of a chance can never, in any kind of case, be the damage that is the gist of an action.
        why: Tempting because the claim failed, but at [27] Gummow ACJ expressly did not accept that proposition in absolute terms.
      - text: A chance below 50% is compensated in proportion to its size.
        why: Wrong — proportionate recovery for a lost chance is exactly what Tabet v Gett refused in a personal injury case.
  - key: q153
    type: truefalse
    concept: risk-chance-and-material-contribution
    difficulty: 2
    statement: In Tabet v Gett, Gummow ACJ accepted in absolute terms that destroying a chance of obtaining a benefit or avoiding a harm can never be the damage that is the gist of an action in negligence.
    answer: false
    why: False — at [27] Gummow ACJ said the outcome did not require acceptance in absolute terms of that proposition; the refusal was confined to loss of a chance in personal injury cases.
  - key: q154
    type: mcq
    concept: risk-chance-and-material-contribution
    difficulty: 2
    contrasts-with:
      - multiple-sufficient-causes-and-material-contribution
    stem: On the slides, how does increased risk of harm differ from material contribution to harm?
    options:
      - text: Increased risk looks back at how the harm came about; material contribution only predicts future harm.
        why: 'Tempting because both concern the defendant''s conduct, but this reverses them: increased risk looks forward; material contribution looks back.'
      - text: 'They are the same idea: any conduct that increases the risk materially contributes to the harm.'
        why: Tempting because the textbook flowchart describes material contribution in terms of increased risk, but the slides keep the two apart, and Amaca v Ellis rejects risk alone.
      - text: Material contribution requires the defendant to be the sole or main cause; increased risk does not.
        why: Wrong — Bonnington says a material contribution need not be the sole or main cause; it must only be more than negligible.
      - text: Increased risk is probabilistic and forward-looking; material contribution is causal, looks back and must be more than negligible.
        correct: true
        why: 'Correct — slide 8: increased risk is probabilistic, looks forward and says nothing about this claimant; material contribution is causal, looks back and must be more than negligible.'
  - key: q155
    type: mcq
    concept: risk-chance-and-material-contribution
    difficulty: 2
    stem: What did Bonnington Castings v Wardlaw decide?
    options:
      - text: The claimant had to prove the employer's dust was the main cause of the pneumoconiosis.
        why: Tempting because the employer was only one source, but the court held the claimant need not show it was the sole or main cause.
      - text: A negligent exposure that made a more than negligible contribution was enough; it need not be the sole or main cause.
        correct: true
        why: 'Correct — slide 9: it was enough that the negligent exposure made a contribution that was more than de minimis; the claimant need not show it was the sole or main cause.'
      - text: Materially increasing the risk was enough, even without proof of any contribution.
        why: Tempting because both are dust cases, but that describes Fairchild (UK); Bonnington required an actual, more than negligible contribution.
      - text: No employer was liable, because the dust came from several sources.
        why: Wrong — the employer was liable; several sources did not defeat the claim once a more than de minimis negligent contribution was shown.
  - key: q156
    type: mcq
    concept: risk-chance-and-material-contribution
    difficulty: 2
    stem: Why did the claim fail in Amaca v Ellis?
    options:
      - text: Showing that asbestos exposure increased the risk of his lung cancer was not enough; the evidence could not show it actually contributed.
        correct: true
        why: 'Correct — slide 10: risk alone is not enough; the claimant must prove on the balance of probabilities that the exposure actually contributed, and the evidence could not establish this.'
      - text: Lung cancer is not a dust disease, so the Dust Diseases Tribunal had no jurisdiction.
        why: Tempting because jurisdiction comes up with s 3B(1), but the slides say nothing of the kind; the claim failed on the evidence of causation.
      - text: His smoking was a novus actus that broke the chain of causation.
        why: Tempting because smoking was a competing cause, but it was not treated as a later intervening act; it made contribution by the asbestos impossible to prove.
      - text: Section 5D(2) did not apply, because the case was not exceptional.
        why: Wrong — the slides present Ellis as a common law decision that increased risk is not enough; it is not a s 5D(2) case.
  - key: q157
    type: mcq
    concept: risk-chance-and-material-contribution
    difficulty: 2
    stem: In Amaca v Booth, what did French CJ hold about Booth's exposure to asbestos in brake linings made by Amaca?
    options:
      - text: It increased the risk of mesothelioma, which was enough without proof that it contributed.
        why: 'Tempting because increased risk is mentioned, but French CJ went further: the exposure in fact contributed, and risk alone is not enough (Ellis).'
      - text: It was too slight to be more than negligible, so causation failed.
        why: Tempting because the science could not identify the triggering exposure, but Booth succeeded; his brake-lining exposure was long and heavy.
      - text: It not only prospectively increased the risk of the disease but, in the event, contributed to its development and continuation.
        correct: true
        why: 'Correct — French CJ: the exposure not only prospectively increased the risk but, in the event, causally contributed to the disease''s development and continuation.'
      - text: It caused the disease because it was the first asbestos Booth was ever exposed to.
        why: Wrong — the slides say science could not say which exposure triggered the disease; the inference rested on cumulative exposure, not on which came first.
  - key: q158
    type: mcq
    concept: risk-chance-and-material-contribution
    difficulty: 3
    stem: Which of these did NOT support the inference of causation in Amaca v Booth?
    options:
      - text: Asbestos is effectively the only known cause of mesothelioma.
        why: 'Tempting to pick, but this was the first reason on slide 12 that the inference was available: no competing cause like smoking.'
      - text: Booth's other asbestos exposures were trivial compared with his brake-lining exposure.
        why: 'Tempting to pick, but slide 12 lists it: about 27 years of heavy brake-lining exposure, with other exposures trivial by comparison.'
      - text: Expert evidence that cumulative exposure contributes to the disease.
        why: Tempting to pick, but the "cumulative effect" mechanism accepted at trial was central to the inference of contribution.
      - text: Evidence that his lung cancer was more likely caused by asbestos than by smoking.
        correct: true
        why: 'Correct — this did not support the inference: Booth had mesothelioma, not lung cancer; lung cancer and smoking belong to Amaca v Ellis.'
  - key: q159
    type: mcq
    concept: risk-chance-and-material-contribution
    difficulty: 3
    variant-of: q156
    stem: Why could contribution be inferred in Amaca v Booth but not in Amaca v Ellis?
    options:
      - text: Booth was decided under s 5D(2), whereas Ellis was decided at common law.
        why: Tempting because s 5D(2) was designed for dust cases, but Booth never mentions the CLA (s 3B(1)); the difference lies in the evidence.
      - text: Booth followed Fairchild, whereas Ellis rejected it.
        why: Tempting because Fairchild is the UK risk case, but Australian law has not adopted Fairchild; Booth was a contribution case, not a risk case.
      - text: Booth had long, heavy exposure, a disease with effectively one known cause and cumulative-mechanism evidence; Ellis had limited exposure, mainly epidemiological evidence and a competing cause.
        correct: true
        why: Correct — slide 12 sets out exactly this contrast, which is why causation was shown in Booth but not, on the balance of probabilities, in Ellis.
      - text: Booth sued the manufacturer, whereas Ellis sued only his employers.
        why: Wrong — the slides do not distinguish the cases by who was sued; Amaca was the defendant in both, and the difference was the evidence.
  - key: q160
    type: mcq
    concept: risk-chance-and-material-contribution
    difficulty: 2
    stem: What is the status of Fairchild v Glenhaven in Australia?
    options:
      - text: It is binding in Australia and was applied in Amaca v Booth.
        why: Tempting because Booth is also a dust case, but Booth rested on contribution, not on Fairchild's risk test, which Australia has not adopted.
      - text: It was codified by s 5D(2), so it governs all NSW dust disease claims.
        why: Tempting because the Ipp Report looked at Fairchild, but s 5D(2) is a general exceptional case provision, and s 3B(1) keeps dust claims out of the CLA.
      - text: It was overruled by the High Court in Tabet v Gett.
        why: Wrong — Fairchild is a UK decision that an Australian court cannot overrule, and Tabet v Gett concerned loss of a chance, not dust.
      - text: It is a UK policy-based exception treating materially increased risk as enough; Australian common law has not adopted it.
        correct: true
        why: 'Correct — slide 13: Fairchild treated materially increasing the risk as enough, a policy-based exception; Australian common law has not adopted a risk-based test in that form.'
  - key: q161
    type: mcq
    concept: risk-chance-and-material-contribution
    difficulty: 2
    stem: What did French CJ refer to in Amaca v Booth as circumstantial evidence of a causal relationship between asbestos and mesothelioma?
    options:
      - text: The Bradford Hill criteria.
        correct: true
        why: 'Correct — slide 11: French CJ referred to the ''Bradford Hill criteria'' as circumstantial evidence of such a causal relationship.'
      - text: Booth's own statement after diagnosis about his exposure history.
        why: Tempting because plaintiffs' statements feature in s 5D(3), but that provision is not involved, and French CJ relied on medical and expert evidence.
      - text: Market share data on Amaca's sales of brake linings.
        why: Tempting because market share liability is another Topic 10 device, but it was not the basis of the inference in Booth.
      - text: The Ipp Report's findings about dust disease litigation.
        why: Wrong — the Ipp Report shaped s 5D(2); French CJ's circumstantial evidence was the Bradford Hill criteria.
  - key: q162
    type: truefalse
    concept: risk-chance-and-material-contribution
    difficulty: 1
    statement: Australian common law has adopted the Fairchild approach that materially increasing the risk of harm is enough to establish causation.
    answer: false
    why: 'False — slide 13: Australian common law has not adopted a risk-based test in that form; Amaca v Ellis holds that risk alone is not enough.'
  - key: q163
    type: truefalse
    concept: risk-chance-and-material-contribution
    difficulty: 2
    statement: In Bonnington Castings v Wardlaw the claimant did not need to show that the negligent dust was the sole or main cause of his disease.
    answer: true
    why: True — a negligent contribution that was more than de minimis was enough; the claimant need not show it was the sole or main cause.
  - key: q164
    type: truefalse
    concept: risk-chance-and-material-contribution
    difficulty: 2
    variant-of: q156
    statement: In Amaca v Ellis the High Court held that the claimant must prove, on the balance of probabilities, that the asbestos exposure actually contributed to his cancer.
    answer: true
    why: 'True — slide 10: showing increased risk is not sufficient; the claimant must prove on the balance of probabilities that the exposure actually contributed, which the evidence could not do.'
  - key: q165
    type: mcq
    concept: risk-chance-and-material-contribution
    difficulty: 3
    variant-of: q156
    stem: Lena smoked for 30 years and worked for one year near asbestos insulation. She develops lung cancer. Her only expert evidence is that asbestos exposure increases the risk of lung cancer. On the Topic 10 cases, what is the likely result?
    options:
      - text: 'Like Amaca v Booth: an inference of contribution is open because asbestos can cause lung cancer.'
        why: Tempting because Booth succeeded, but its inference rested on mesothelioma's single known cause, heavy exposure and cumulative-mechanism evidence — none of which Lena has.
      - text: 'Like Fairchild: materially increasing the risk is enough where science cannot identify the cause.'
        why: Tempting because her evidence is about risk, but Australian common law has not adopted Fairchild's risk-based test.
      - text: 'Like Amaca v Ellis: increased risk alone does not prove the exposure contributed, so causation fails.'
        correct: true
        why: Correct — limited exposure, risk evidence only and a competing cause (smoking) is the Ellis profile; risk alone does not prove contribution on the probabilities.
      - text: 'Like Bonnington: any exposure at all counts as more than de minimis, so Lena succeeds against the employer.'
        why: Wrong — Bonnington required a contribution that was more than negligible, proved by evidence; it does not treat any exposure as enough.
  - key: q166
    type: mcq
    concept: risk-chance-and-material-contribution
    difficulty: 3
    variant-of: q157
    stem: Tom develops mesothelioma after 25 years of heavy exposure to asbestos dust from one manufacturer's products and a few trivial exposures elsewhere. Experts say cumulative exposure contributes to the disease. Which case is closest?
    options:
      - text: Amaca v Ellis, because science cannot say which exposure triggered the disease.
        why: 'Tempting because science could not identify the trigger in Booth either, but Tom has Booth''s profile: a single known cause, heavy exposure and cumulative-mechanism evidence.'
      - text: Tabet v Gett, because Tom can show only a chance of avoiding the disease.
        why: Tempting because the evidence is medical, but Tom's case is about contribution to a disease, not a lost chance of a better outcome.
      - text: Amaca v Booth.
        correct: true
        why: 'Correct — mesothelioma, long heavy exposure from one source, trivial other exposures and cumulative-mechanism evidence: the profile from which Booth inferred contribution.'
      - text: Cook v Lewis, because two sources could each have caused the disease.
        why: Wrong — Cook v Lewis concerned two negligent hunters and one bullet; Tom's other exposures were trivial and the main source is identified.
  - key: q167
    type: mcq
    concept: risk-chance-and-material-contribution
    difficulty: 3
    variant-of: q151
    stem: A GP negligently fails to refer Ana for a scan. Experts agree that earlier treatment would have given her a 30% chance of avoiding permanent injury. She sues for the lost chance. What is the likely result?
    options:
      - text: She recovers 30% of her damages, reflecting the size of the lost chance.
        why: Tempting because it seems fair, but Tabet v Gett refused recovery for a lost chance of a better outcome in personal injury cases, including proportionate recovery.
      - text: 'She fails: like Tabet v Gett, a less than even chance is a possibility, not proof that the negligence caused her injury.'
        correct: true
        why: Correct — a 30% chance means the better outcome was possible, not probable; Tabet v Gett holds that is not actionable damage in personal injury.
      - text: She recovers in full, because the GP's breach is clear.
        why: Tempting because the breach is clear, but a breach does not prove causation; on the probabilities she would have been injured anyway.
      - text: She succeeds under s 5D(2), because medical science cannot prove the cause.
        why: Wrong — here science does speak (a 30% chance); s 5D(2) is for exceptional cases and has rarely been applied, and Adeels Palace refused it for a "might have".
  - key: q168
    type: mcq
    concept: risk-chance-and-material-contribution
    difficulty: 2
    stem: According to the slides, why is causation so hard to prove in dust disease cases?
    options:
      - text: The science cannot say which exposure caused the disease.
        correct: true
        why: 'Correct — slide 8: proving causation is difficult in dust disease cases, where the science cannot say which exposure caused the disease.'
      - text: Dust disease claims must be proved beyond reasonable doubt.
        why: Tempting because the cases are serious, but causation is proved on the balance of probabilities; the difficulty is scientific, not the standard.
      - text: Employers in dust disease cases owe their workers no duty of care.
        why: Tempting because the claims often fail, but the difficulty the slides identify is causation, not duty; Bonnington's employer was liable.
      - text: Plaintiffs are barred from calling expert medical evidence in these claims.
        why: Wrong — expert evidence was central; in Booth the inference of causation rested on medical and expert evidence.
  - key: q169
    type: truefalse
    concept: risk-chance-and-material-contribution
    difficulty: 2
    statement: In Tabet v Gett the chance of a better outcome was more probable than not, but recovery was refused on policy grounds.
    answer: false
    why: 'False — the chance of a better outcome was less than 50%: possible but not probable. That, not a policy refusal of a probable case, was the problem.'
  - key: q170
    type: short
    concept: risk-chance-and-material-contribution
    difficulty: 3
    cases:
      - bonnington-castings-v-wardlaw
      - amaca-pty-ltd-v-ellis
      - amaca-v-booth
      - fairchild-v-glenhaven-funeral-services-ltd
    prompt: Kofi worked for three employers over 20 years. Only his second employer negligently exposed him to silica dust; the dust at the other workplaces involved no negligence. He develops a disease caused by cumulative inhalation of silica dust, and the science cannot say which inhalation caused it. Advise Kofi on factual causation against the second employer.
    model: |-
      The issue is whether the second employer's negligent exposure caused Kofi's disease when science cannot identify which inhalation was responsible.

      First, the CLA probably does not apply: s 3B(1) excludes civil liability in dust disease proceedings under the Dust Diseases Tribunal Act 1989 (NSW), so the common law governs (as in Amaca v Booth). The 'but for' test is inconclusive here: an evidential gap where the science cannot identify the cause.

      The key question is whether the employer's conduct contributed to the harm, or merely increased the risk. Increased risk is probabilistic and forward-looking and is not enough in Australia (Amaca v Ellis); Fairchild's risk-based exception has not been adopted. Material contribution to harm is causal and must be more than negligible. In Bonnington Castings v Wardlaw, a negligent contribution to cumulative silica dust that was more than de minimis was enough; it need not be the sole or main cause. In Booth, contribution was inferred from expert evidence that cumulative exposure contributes to the disease.

      Kofi's disease is caused by cumulative inhalation, and part of his dust came from the negligent employer. If expert evidence shows that exposure made a more than negligible contribution, Bonnington applies. If his evidence shows only an increased risk, Ellis is against him.

      Kofi is likely to succeed if he proves, on the balance of probabilities, a more than negligible contribution.
    rubric:
      - id: r1
        criterion: Issue and framework
        marks: 2
        top-band: Identifies the evidential gap and notes s 3B(1) takes dust disease proceedings outside the CLA, so the common law applies.
        margin-note: Check s 3B(1) first.
        authorities:
          - civil-liability-act-2002-nsw-s3b
      - id: r2
        criterion: Law
        marks: 3
        top-band: 'Distinguishes increased risk (Ellis: not enough; Fairchild not adopted) from material contribution (Bonnington: more than de minimis; Booth: inference from cumulative mechanism).'
        margin-note: Risk v contribution is the whole question.
        authorities: []
      - id: r3
        criterion: Application
        marks: 3
        top-band: Applies the cumulative-dust facts to Bonnington and says what evidence Kofi needs to avoid the Ellis result.
        margin-note: Say what the experts must show.
        authorities: []
      - id: r4
        criterion: Conclusion
        marks: 2
        top-band: Reaches a conditional conclusion tied to proof on the balance of probabilities.
        margin-note: Conditional, but clear.
        authorities:
          - civil-liability-act-2002-nsw-s5e
pretest:
  - q001
