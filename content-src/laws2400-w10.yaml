  - key: q077
    type: mcq
    concept: contribution-between-tortfeasors
    difficulty: 1
    set: pretest
    stem: Where multiple tortfeasors are jointly and severally liable for damage, what may the plaintiff do?
    options:
      - text: Recover the whole amount against only one of them
        correct: true
        why: 'Correct — [12.170]: the plaintiff may choose to recover the whole amount against only one of them, for example the one with the ''deeper pockets''.'
      - text: Recover from each tortfeasor only that tortfeasor's share
        why: Tempting because it sounds fair between wrongdoers, but under joint and several liability the plaintiff may take the whole amount from one; sharing is for contribution between the tortfeasors.
      - text: Recover only after the tortfeasors have settled contribution between themselves
        why: Wrong — contribution 'in no way affects the plaintiff'; it is a matter between the tortfeasors, so the plaintiff need not wait for it.
      - text: Recover the whole amount only from the tortfeasor most to blame
        why: Wrong — the textbook says the plaintiff may choose whom to recover from, for example the one with the deeper pockets; blame does not limit the choice.
  - key: q078
    type: mcq
    concept: contribution-between-tortfeasors
    difficulty: 1
    stem: What is contribution, as the textbook describes it?
    options:
      - text: A statutory way for a tortfeasor liable for the full amount to seek a share from another
        correct: true
        why: Correct — contribution is "a statutory mechanism … by which a tortfeasor held liable for the full amount of damage may seek a contribution against another tortfeasor".
      - text: A defence by which the plaintiff's own fault reduces the damages payable by each tortfeasor
        why: Tempting because "contribution" suggests the plaintiff contributing, but the textbook's contribution is between tortfeasors and in no way affects the plaintiff.
      - text: A rule that the plaintiff must sue every tortfeasor and recover a share from each
        why: Wrong — the plaintiff may recover the whole amount from only one tortfeasor; contribution operates afterwards, between the tortfeasors.
      - text: A common law rule that the most culpable tortfeasor pays the full amount of the damage
        why: Wrong — the textbook calls contribution a statutory mechanism, and it lets a tortfeasor who has paid the full amount seek a contribution from another.
  - key: q079
    type: mcq
    concept: contribution-between-tortfeasors
    difficulty: 2
    stem: How does contribution between tortfeasors affect the plaintiff?
    options:
      - text: 'It does not: it is a matter between the tortfeasors themselves'
        correct: true
        why: Correct — the textbook says contribution "in no way affects the plaintiff and is a matter between the tortfeasors themselves".
      - text: It reduces the plaintiff's damages by each tortfeasor's share
        why: Tempting because contribution divides the burden, but the division happens between the tortfeasors; the plaintiff may still recover the whole amount from one.
      - text: It requires the plaintiff to join every tortfeasor to the action
        why: Wrong — the plaintiff may choose to recover the whole amount against only one tortfeasor; contribution is for that tortfeasor to pursue.
  - key: q080
    type: mcq
    concept: contribution-between-tortfeasors
    difficulty: 2
    stem: Pat is injured by the concurrent negligence of Acme and Bolt, who are jointly and severally liable. Pat sues only Acme, which has 'deeper pockets', and recovers the whole amount. What can Acme do?
    options:
      - text: Seek a contribution against Bolt under the statute
        correct: true
        why: Correct — contribution is the statutory mechanism by which a tortfeasor held liable for the full amount may seek a contribution against another tortfeasor.
      - text: Nothing — by suing Acme alone, Pat released Bolt from all liability
        why: Tempting because Bolt was not sued, but the textbook's contribution mechanism exists precisely so that the tortfeasor who paid can seek a contribution from another.
      - text: Require Pat to repay Bolt's share and sue Bolt for it instead
        why: Wrong — contribution in no way affects the plaintiff; Acme must look to Bolt, not to Pat.
      - text: Reduce what it pays Pat by the amount Bolt should bear
        why: Wrong — Pat may recover the whole amount from Acme; any adjustment is between Acme and Bolt through contribution.
  - key: q081
    type: mcq
    concept: contribution-between-tortfeasors
    difficulty: 3
    variant-of: q080
    stem: Same facts as Pat, but Bolt is insolvent. Who bears the risk of Bolt being unable to pay?
    options:
      - text: Acme, the other tortfeasor — not Pat
        correct: true
        why: Correct — the textbook says the risk that one tortfeasor is insolvent or unable to pay lies with the other tortfeasors, not the plaintiff.
      - text: Pat, whose damages are reduced by Bolt's unpaid share
        why: Tempting because Bolt's share goes unpaid, but contribution in no way affects the plaintiff; Pat keeps the whole amount recovered from Acme.
      - text: Pat and Acme equally, as the loss falls on both
        why: Wrong — the textbook puts the insolvency risk on the other tortfeasors alone; the plaintiff bears none of it.
      - text: Nobody — Bolt's share is simply written off by the court
        why: Wrong — the risk does not vanish; it lies with the other tortfeasor, here Acme, who cannot recover Bolt's contribution.
