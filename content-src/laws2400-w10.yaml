        correct: true
        why: Correct — the chart joins them with AND, so both belong to the scope of liability inquiry; an answer that deals with only one leaves part of the element unaddressed.
      - text: Pick whichever of the two the facts raise more clearly, and leave the other out.
        why: Tempting as a time-saver, but the chart joins them with AND, not OR — it presents both as parts of scope of liability, so neither is optional.
