      - text: Under scope of liability, as the test for new intervening acts and remoteness
        why: Tempting because s 5D(2) and s 5D(4) share wording, but s 5D(2) concerns factual causation; the chart lists only new intervening acts and remoteness under scope of liability.
      - text: At the start of the chart, before causation is divided into factual causation and scope of liability
        why: Wrong — the chart begins with causation dividing into its two branches; s 5D(2) appears only once negligence cannot be established as a necessary condition.
      - text: In the common law column only, as the 'but for' test's statutory replacement
        why: Wrong — the statutory counterpart of 'but for' is the necessary condition test in s 5D(1)(a); s 5D(2) deals with cases where that test cannot be met.
  - key: q006
