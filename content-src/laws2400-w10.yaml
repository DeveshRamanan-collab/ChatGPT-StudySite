      - text: Remoteness and the 'but for' test
        why: Tempting because both appear on the chart, but the 'but for' test belongs to factual causation (the common law column), not to scope of liability.
      - text: Material contribution and multiple sufficient causes
        why: Tempting because the chart pairs them, but they are the kinds of case where the factual causation tests yield unsatisfactory results, leading to s 5D(2).
      - text: New intervening acts and a clear breach
        why: Tempting because 'a clear breach' appears on the chart, but it is something that must also exist for the s 5D(2) route, not part of scope of liability.
  - key: q004
