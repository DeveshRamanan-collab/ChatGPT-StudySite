  - slug: barnett-v-chelsea-and-kensington-hospital
    name: Barnett v Chelsea & Kensington Hospital
    citation: '[1969] 1 QB 428'
    aglc: Barnett v Chelsea & Kensington Hospital [1969] 1 QB 428
    facts: The deceased drank tea at work which had been poisoned with arsenic. The duty doctor refused to see him because the doctor was also feeling unwell. Later another doctor attended, but it was too late to save the deceased.
    issue: Whether the duty doctor's negligence caused the death.
    held: Although there was negligence on the part of the duty doctor, even timely treatment would not have saved the deceased's life, so the hospital was not liable.
    ratio: 'The ''but for'' test: if the harm would have occurred even without the negligence, the negligence is not a factual cause of it.'
    significance: 'Shows how the ''but for'' test works in practice: a clear breach, but no causal link.'
    why-here: Cite for a failed 'but for' / necessary condition test — the harm would have happened anyway.
    verify: false
  - slug: cook-v-lewis
    name: Cook v Lewis
    citation: (1961) (Supreme Court of Canada; full citation not given in the materials)
    aglc: Cook v Lewis (1961)
    facts: An accidental shooting while hunting. The plaintiff was struck by a single bullet, and the jury had been unable to decide which of the negligent defendants' guns had fired it.
    issue: How causation is resolved where two negligent defendants could each have caused the harm and it cannot be shown which did.
    held: The Canadian Supreme Court held both negligent defendants liable.
    ratio: Where it cannot be determined which of two negligent defendants caused the harm, both may be held liable (one common law response to multiple sufficient causes).
    significance: One of the approaches courts have adopted to multiple sufficient causes, which the CLA leaves to the common law.
    why-here: Cite as an example of a court refusing to let two negligent defendants escape because 'but for' fails against each.
    verify: true
  - slug: tabet-v-gett
    name: Tabet v Gett
    citation: (2010) 240 CLR 537
    aglc: Tabet v Gett (2010) 240 CLR 537
    facts: A six-year-old child, Tabet, suffered permanent brain damage after a delay in performing a CT scan during hospital treatment. She alleged that the defendant doctor's negligence deprived her of a chance of a better medical outcome. The chance of a better outcome was less than 50%.
    issue: Whether the court should 'permit recovery for physical injury not shown to be caused or contributed to by a negligent party, but which negligence has deprived the victim of the possibility (but not the probability) of a better outcome' [25].
    held: No. In personal injury cases the law of negligence as understood in the common law of Australia does not entertain an action for recovery when the damage is characterised as the loss of a chance of a better outcome (Gummow ACJ [46]).
    ratio: Loss of a chance of a better medical outcome, where the better outcome was only possible and not probable, is not compensable damage in personal injury cases. This does not require acceptance in absolute terms that destruction of the chance of obtaining a benefit or avoiding a harm can never supply the damage that is the gist of an action in negligence (Gummow ACJ [27]).
    significance: 'Keeps the balance of probabilities at the centre of factual causation in medical negligence: a less than even chance is a possibility, not proof of causation.'
    why-here: Cite where the plaintiff can show only a less than 50% chance that proper care would have produced a better outcome.
    verify: false
  - slug: amaca-v-booth
    name: Amaca v Booth
    citation: (2011) 246 CLR 36
    aglc: Amaca v Booth (2011) 246 CLR 36
    facts: Booth had mesothelioma and 30 years of exposure to asbestos in brake linings manufactured by Amaca (about 27 years of heavy brake-lining exposure; his other exposures were trivial by comparison). The Dust Diseases Tribunal drew an "overwhelming inference" of causation.
    issue: Whether an inference that Amaca's asbestos caused or contributed to Booth's mesothelioma was open when science could not say which exposure triggered the disease.
    held: The Court of Appeal and the High Court upheld the Tribunal's inference. French CJ held that Booth's exposure to asbestos in brake linings manufactured by Amaca not only prospectively increased the risk of his contracting the disease but, in the event, [causally] contributed to its development and continuation.
    ratio: A causal connection may be inferred from medical and expert evidence (French CJ also referred to the 'Bradford Hill criteria' as circumstantial evidence of a causal relationship between asbestos and mesothelioma). The inference was reasonably open because asbestos is effectively the only known cause of mesothelioma, Booth's heavy exposure dwarfed his other exposures, and expert evidence accepted at trial was that cumulative exposure contributes to the disease.
    significance: Material contribution established in a dust disease case; contrasted with Amaca v Ellis. The CLA is never mentioned because s 3B(1) excludes dust disease proceedings under the Dust Diseases Tribunal Act 1989 (NSW).
    why-here: Cite where the evidence supports an inference that the defendant's exposure contributed to the disease, not merely increased the risk.
    verify: false
  - slug: mckew-v-holland-hannen-and-cubitts-ltd
    name: McKew v Holland Hannen & Cubitts Ltd
    citation: '[1969] 3 All ER 1621'
    aglc: McKew v Holland Hannen & Cubitts Ltd [1969] 3 All ER 1621
    facts: The plaintiff's leg, injured by the defendant's negligence, was prone to give way. He descended a steep staircase without a handrail, unaided; the leg gave way and he suffered a severe ankle fracture.
    issue: Whether the defendant was liable for the second injury, or whether the plaintiff's own conduct broke the chain of causation.
    held: 'The plaintiff''s unreasonable conduct was a novus actus interveniens: the chain was broken and the defendant was not liable for the second injury.'
    ratio: A plaintiff's own unreasonable conduct after the original injury can break the chain of causation, so that the original wrongdoer is not liable for harm after the break.
    significance: Introduced in Topic 10 as the example of an intervening act that does break the chain (contrast March v Stramare); intervening acts are covered fully in Topic 11. Also discussed in the March v Stramare casebook extract and the text at [12.35].
    why-here: Cite where the plaintiff's own unreasonable conduct after the injury causes further harm.
    verify: false
authorities:
  - slug: civil-liability-act-2002-nsw-s5d
    title: Civil Liability Act 2002 (NSW) s 5D
    kind: statute
    text: 5D General principles (1) A determination that negligence caused particular harm comprises the following elements— (a) that the negligence was a necessary condition of the occurrence of the harm (factual causation), and (b) that it is appropriate for the scope of the negligent person's liability to extend to the harm so caused (scope of liability). (2) In determining in an exceptional case, in accordance with established principles, whether negligence that cannot be established as a necessary condition of the occurrence of harm should be accepted as establishing factual causation, the court is to consider (amongst other relevant things) whether or not and why responsibility for the harm should be imposed on the negligent party. (3) If it is relevant to the determination of factual causation to determine what the person who suffered harm would have done if the negligent person had not been negligent— (a) the matter is to be determined subjectively in the light of all relevant circumstances, subject to paragraph (b), and (b) any statement made by the person after suffering the harm about what he or she would have done is inadmissible except to the extent (if any) that the statement is against his or her interest. (4) For the purpose of determining the scope of liability, the court is to consider (amongst other relevant things) whether or not and why responsibility for the harm should be imposed on the negligent party.
    gloss: Causation has two elements — factual causation (a necessary condition) and scope of liability — with an exceptional-case route where necessary condition cannot be established, a subjective test of what the injured person would have done, and a responsibility question for scope of liability.
    cases:
      - adeels-palace-v-moubarak
      - strong-v-woolworths-ltd-tas-big-w
      - wallace-v-kam
      - cox-v-new-south-wales
      - march-v-stramare
    verify: false
  - slug: law-reform-miscellaneous-provisions-act-1946-nsw-s5
    title: Law Reform (Miscellaneous Provisions) Act 1946 (NSW) s 5
    kind: statute
    text: The text of this provision is not in the supplied materials. Tort Law Principles 3e, p 433 n 230 cites s 5(1)(c) and s 5(2) as the New South Wales source of the statutory contribution mechanism between tortfeasors.
    gloss: The NSW statutory basis on which a tortfeasor held liable for the full amount of damage may seek a contribution against another tortfeasor.
    cases: []
    verify: true
  - slug: civil-liability-act-2002-nsw-s5e
    title: Civil Liability Act 2002 (NSW) s 5E
    kind: statute
    text: In proceedings relating to liability for negligence, the plaintiff always bears the onus of proving, on the balance of probabilities, any fact relevant to the issue of causation.
    gloss: The plaintiff must prove every fact relevant to causation on the balance of probabilities — more probable than not.
    cases:
      - strong-v-woolworths-ltd-tas-big-w
    verify: false
questions:
  - key: q001
    type: mcq
    concept: causation-flowchart
    difficulty: 1
    set: pretest
    stem: In the textbook's causation flowchart, what are the two branches of causation?
    options:
      - text: Factual causation and scope of liability — both must be satisfied.
        correct: true
        why: Correct — Causation 1 splits causation into factual causation and scope of liability, and CLA s 5D(1) lists both as elements of a determination that negligence caused the harm.
      - text: Factual causation and remoteness, with scope of liability a later, separate element.
        why: Tempting because remoteness is on the chart, but it sits under scope of liability alongside new intervening acts; scope of liability is the branch, not a later element.
      - text: The 'but for' test and the 'necessary condition' test, of which the plaintiff picks one.
        why: Tempting because both tests appear on the chart, but they are the two columns of factual causation (common law and legislation), not the two branches of causation.
      - text: Breach of duty and factual causation, which are decided together as one question.
        why: Wrong — breach is decided before causation; the chart starts after breach and asks for a connection between the defendant's breach and the plaintiff's injury.
  - key: q002
    type: mcq
    concept: causation-flowchart
    difficulty: 1
    stem: Which provision of the Civil Liability Act 2002 (NSW) lists factual causation and scope of liability as the elements of causation?
    options:
      - text: Section 5D(1)
        correct: true
        why: Correct — s 5D(1) says a determination that negligence caused particular harm comprises (a) factual causation and (b) scope of liability.
      - text: Section 5B(1)
        why: Tempting because s 5B is the neighbouring "general principles" section, but it sets out when a person is negligent in failing to take precautions — breach, not causation.
      - text: Section 5C
        why: Tempting because the flowchart's note mentions 'Section 5C(1)', but in the NSW Act s 5C is headed 'Other principles' and deals with precautions; causation is Division 3, s 5D.
      - text: Section 5D(4)
        why: Tempting because it is part of s 5D, but s 5D(4) only says what the court considers when determining scope of liability; it does not list the two elements.
  - key: q003
    type: mcq
    concept: causation-flowchart
    difficulty: 1
    stem: Under the flowchart, which two matters make up scope of liability?
    options:
