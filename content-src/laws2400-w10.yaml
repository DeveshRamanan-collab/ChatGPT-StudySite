  - slug: bonnington-castings-v-wardlaw
    name: Bonnington Castings v Wardlaw
    citation: '[1956] AC 613'
    aglc: Bonnington Castings v Wardlaw [1956] AC 613
    facts: The claimant contracted pneumoconiosis from cumulative inhalation of silica dust. Only part of the dust came from the employer's negligence.
    issue: Whether the claimant had to show that the negligent dust was the sole or main cause of the disease.
    held: It was enough that the negligent exposure made a contribution that was more than de minimis (or negligible). The claimant need not show it was the sole or main cause.
    ratio: A negligent exposure that materially contributes to the harm — a contribution more than de minimis — establishes causation, even though other, non-negligent exposure also contributed.
    significance: The foundational material contribution case in the dust disease line (UK); followed in Amaca v Booth. The textbook flowchart lists it as an example of multiple sufficient causes, while the lecture slides treat it as a material contribution case.
    why-here: 'Cite for material contribution to harm: a more than negligible contribution is enough, without proof that it was the sole or main cause.'
    verify: false
  - slug: march-v-stramare
    name: March v Stramare
    citation: (1991) 171 CLR 506
    aglc: March v Stramare (1991) 171 CLR 506
    facts: The defendant parked a truck in the middle of a six-lane road in the early morning hours to unload fruit and vegetables, a practice used for a long time. The plaintiff, who was drunk and speeding, was injured when his car collided with the truck. At trial the defendant was held liable in negligence with a finding of 70% contributory negligence against the plaintiff; the Full Court of South Australia attributed the entire responsibility to the plaintiff's own negligence.
    issue: Whether the defendant's negligence in parking the truck was a cause of the plaintiff's injury, given the plaintiff's own negligence, and how causation is to be tested.
    held: The High Court held that the defendant's negligence was the cause of the plaintiff's injury, though the judges disagreed about the reasoning on causation. The plaintiff's own negligence did not break the chain, because the truck created the very risk that materialised.
    ratio: 'Mason CJ: the ''but for'' test was never the exclusive test of causation in negligence (it does not work where two or more acts or events are involved or the chain is broken by an intervening event); causation is a question of fact which ''must be determined by applying common sense to the facts of each particular case''; and the chain is not broken where ''the defendant''s wrongful conduct has generated the very risk of injury resulting from the negligence of the plaintiff or a third party''. McHugh J: ''but for'' should be the exclusive test, with a ''scope of the risk'' test allowing policy factors to be employed as part of remoteness.'
    significance: 'The common law starting point on factual causation: Mason CJ''s three limitations of the ''but for'' test and his ''common sense'' approach, which the Ipp Report criticised and CLA s 5D(1) restructured. The textbook flowchart also lists it as an example of multiple sufficient causes.'
    why-here: Cite with s 5D(1)(a) for 'but for' and its limits, and for a later careless act within the very risk the defendant created not breaking the chain.
    verify: false
  - slug: fairchild-v-glenhaven-funeral-services-ltd
    name: Fairchild v Glenhaven Funeral Services Ltd
    citation: '[2003] 1 AC 32'
    aglc: Fairchild v Glenhaven Funeral Services Ltd [2003] 1 AC 32
    facts: A UK dust disease case in which the claimant could not prove which employer's exposure caused the disease.
    issue: Whether materially increasing the risk of the disease was enough to establish causation when the claimant could not prove which employer's exposure caused it.
    held: Materially increasing the risk was treated as enough.
    ratio: 'A policy-based exception to the ordinary causation rules: where the claimant cannot prove which employer''s exposure caused the disease, materially increasing the risk can suffice.'
    significance: Australian common law has not adopted a risk-based test in that form. The Ipp Report looked at cases like it in recommending the exceptional case provision now in CLA s 5D(2).
    why-here: 'Use as a contrast: the UK risk-based exception that Australian common law has not adopted (compare Amaca v Ellis).'
    verify: false
