  - q037
  - q053
  - q077
cards:
  - type: basic
    concept: causation-flowchart
    front: What are the two branches of causation on the textbook flowchart?
    back: Factual causation and scope of liability — both must be satisfied.
    source: Tort Law Principles 3e, p 433 (Causation 1)
  - type: cloze
    concept: causation-flowchart
    text: 'CLA s 5D(1): causation comprises (a) {{c1::factual causation}} — the negligence was a necessary condition of the harm — and (b) {{c2::scope of liability}}.'
    source: Civil Liability Act 2002 (NSW) s 5D(1)
  - type: basic
    concept: causation-flowchart
    front: What two parts does the flowchart give scope of liability?
    back: New intervening acts AND remoteness.
    source: Tort Law Principles 3e, p 433 (Causation 1)
  - type: basic
    concept: causation-flowchart
    front: Which test does each factual causation column apply?
    back: 'Common law: the ''but for'' test. Civil liability legislation: the ''necessary condition'' test, s 5D(1)(a).'
    source: Tort Law Principles 3e, p 433 (Causation 1)
  - type: apply
    concept: causation-flowchart
    scenario: Duty and breach are established. You are about to write the causation part of an answer.
    answer: Factual causation first (s 5D(1)(a); s 5D(2) only if necessary condition cannot be established), then scope of liability (new intervening acts and remoteness; s 5D(4)).
    source: Tort Law Principles 3e, p 433 (Causation 1); Civil Liability Act 2002 (NSW) s 5D
  - type: basic
    concept: factual-causation-necessary-condition
    front: What is the common law 'but for' question on the flowchart?
    back: Would the plaintiff's injuries have been suffered but for the defendant's negligence? No → satisfied; Yes → not satisfied.
    source: Tort Law Principles 3e, p 434 (Causation 2)
  - type: basic
    concept: factual-causation-necessary-condition
    front: What is the statutory 'necessary condition' question on the flowchart?
    back: Was the defendant's fault a necessary condition of the occurrence of the plaintiff's harm? Yes → satisfied; No → not satisfied.
    source: Tort Law Principles 3e, p 434 (Causation 2)
  - type: basic
    concept: factual-causation-necessary-condition
    front: Which cases does the flowchart cite for the need to find a connection between breach and injury?
    back: Adeels Palace v Moubarak (2009) 239 CLR 420; Strong v Woolworths Ltd t/as Big W (2012) 246 CLR 182.
    source: Tort Law Principles 3e, p 434 (Causation 2)
  - type: cloze
    concept: factual-causation-necessary-condition
    text: Under s 5D(3), what the injured person would have done is decided {{c1::subjectively}} in the light of all relevant circumstances; their statement after the harm is {{c2::inadmissible}} except so far as it is against their interest.
    source: Civil Liability Act 2002 (NSW) s 5D(3)
  - type: apply
    concept: factual-causation-necessary-condition
    scenario: The evidence shows Owen would have fallen the same way even if the employer had fixed the handrail.
    answer: '''But for'' answer: Yes (it would have happened anyway) → factual causation not satisfied; under s 5D(1)(a) the fault was not a necessary condition.'
    source: Tort Law Principles 3e, p 434 (Causation 2)
  - type: basic
    concept: factual-causation-necessary-condition
    front: The flowchart's note names 'Section 5C(1)'. What does the NSW Act actually say?
    back: NSW s 5C is 'Other principles' (precautions). The necessary condition test is s 5D(1)(a). Verify which provision the note means.
    source: Tort Law Principles 3e, p 434 (Causation 2); Civil Liability Act 2002 (NSW) ss 5C, 5D
  - type: basic
    concept: s5d2-exceptional-cases
    front: When does the flowchart turn to s 5D(2)?
    back: When negligence cannot be established as a 'necessary condition' of the plaintiff's harm.
    source: Tort Law Principles 3e, p 435 (Causation 3)
  - type: cloze
    concept: s5d2-exceptional-cases
    text: The flowchart says s 5D(2) applies in 'an {{c1::appropriate}} case'; the NSW text says 'an {{c2::exceptional}} case'.
    source: Tort Law Principles 3e, p 435 (Causation 3); Civil Liability Act 2002 (NSW) s 5D(2)
  - type: basic
    concept: s5d2-exceptional-cases
    front: What must there also be for the s 5D(2) route, according to the flowchart?
    back: A clear breach and an evidentiary gap.
    source: Tort Law Principles 3e, p 435 (Causation 3)
  - type: basic
    concept: s5d2-exceptional-cases
    front: What does the NSW text of s 5D(2) direct the court to consider?
    back: (Amongst other relevant things) whether or not and why responsibility for the harm should be imposed on the negligent party.
    source: Civil Liability Act 2002 (NSW) s 5D(2)
  - type: apply
    concept: s5d2-exceptional-cases
    scenario: Rhea's illness may have been caused by the factory's clear breach, but medical knowledge cannot say what caused it.
    answer: 'Necessary condition cannot be established; s 5D(2) route (exceptional case): clear breach + evidentiary gap present; court weighs whether and why to impose responsibility.'
    source: Tort Law Principles 3e, p 435 (Causation 3)
  - type: basic
    concept: multiple-sufficient-causes-and-material-contribution
    front: How does the flowchart describe multiple sufficient causes?
    back: The cumulative operation of factors in the occurrence of the total harm, where the contribution of each factor to that harm is unascertainable — eg Bonnington Castings v Wardlaw; March v Stramare.
    source: Tort Law Principles 3e, p 435 (Causation 3)
  - type: basic
    concept: multiple-sufficient-causes-and-material-contribution
    front: How does the flowchart describe material contribution to harm?
    back: Negligent conduct that materially increases the risk of harm, where the state of scientific or medical knowledge makes it impossible to prove the cause — eg Fairchild; McGee; Amaca v Ellis; Henville v Walker.
    source: Tort Law Principles 3e, p 435 (Causation 3)
  - type: cloze
    concept: multiple-sufficient-causes-and-material-contribution
    text: 'Flowchart examples: {{c1::Bonnington Castings v Wardlaw}} and March v Stramare (multiple sufficient causes); Fairchild, {{c2::McGee v National Coal Board}}, Amaca and Henville (material contribution).'
    source: Tort Law Principles 3e, p 435 (Causation 3)
  - type: apply
    concept: multiple-sufficient-causes-and-material-contribution
    scenario: Dust from a negligent grinder and from blameless sources together caused Mai's illness; no one can say how much each contributed.
    answer: Multiple sufficient causes (cumulative factors, shares unascertainable) → s 5D(2), with a clear breach and an evidentiary gap.
    source: Tort Law Principles 3e, p 435 (Causation 3)
  - type: cloze
    concept: scope-of-liability-element
    text: 's 5D(1)(b): it is {{c1::appropriate}} for the scope of the negligent person''s liability to extend to the harm {{c2::so caused}}.'
    source: Civil Liability Act 2002 (NSW) s 5D(1)(b)
  - type: basic
    concept: scope-of-liability-element
    front: What does s 5D(4) direct the court to consider for scope of liability?
    back: (Amongst other relevant things) whether or not and why responsibility for the harm should be imposed on the negligent party.
    source: Civil Liability Act 2002 (NSW) s 5D(4)
  - type: basic
    concept: scope-of-liability-element
    front: Section 5D(2) and s 5D(4) ask the same responsibility question. What differs?
    back: 'The stage: s 5D(2) asks it about factual causation in an exceptional case; s 5D(4) asks it about scope of liability.'
    source: Civil Liability Act 2002 (NSW) s 5D(2), (4)
  - type: basic
    concept: contribution-between-tortfeasors
    front: Where tortfeasors are jointly and severally liable, what may the plaintiff do?
    back: Recover the whole amount against only one of them — for example, the one with the 'deeper pockets' (subject to proportionate liability for property damage and economic loss claims).
    source: Tort Law Principles 3e, p 433 [12.170]
  - type: basic
    concept: contribution-between-tortfeasors
    front: What is contribution?
    back: 'A statutory mechanism by which a tortfeasor held liable for the full amount of damage may seek a contribution against another tortfeasor. NSW: Law Reform (Miscellaneous Provisions) Act 1946 s 5(1)(c), 5(2).'
    source: Tort Law Principles 3e, p 433 [12.170]
  - type: cloze
    concept: contribution-between-tortfeasors
    text: Contribution in no way affects the {{c1::plaintiff}}; the risk that one tortfeasor is insolvent lies with the {{c2::other tortfeasors}}.
    source: Tort Law Principles 3e, p 433 [12.170]
  - type: apply
    concept: contribution-between-tortfeasors
    scenario: Pat recovers in full from Acme. Bolt, the other concurrent tortfeasor, is insolvent.
    answer: Pat keeps the full award; Acme may seek contribution from Bolt but bears the risk of Bolt being unable to pay.
    source: Tort Law Principles 3e, p 433 [12.170]
  - type: basic
    concept: causation-flowchart
    front: What is the gist of an action in negligence?
    back: 'Damage (harm suffered by the plaintiff — not damages): no damage, no action.'
    source: Topic 10 Lecture 1, slide 4
  - type: cloze
    concept: causation-flowchart
    text: 'CLA s 5E: the plaintiff always bears the onus of proving, on the {{c1::balance of probabilities}}, any fact relevant to the issue of {{c2::causation}}.'
    source: Civil Liability Act 2002 (NSW) s 5E; Topic 10 Lecture 1, slide 4
  - type: basic
    concept: causation-flowchart
    front: 'Causation v remoteness: what kind of question is each?'
    back: 'Causation: a factual question — did the act or omission in fact cause the harm? Remoteness: a legal question involving policy — should the defendant be held legally responsible?'
    source: Topic 10 Lecture 1, slide 5
  - type: basic
    concept: factual-causation-necessary-condition
    front: Barnett v Chelsea & Kensington Hospital [1969] 1 QB 428 — why was the hospital not liable?
    back: 'The duty doctor was negligent, but even timely treatment would not have saved the deceased (arsenic poisoning): the ''but for'' test failed.'
    source: Topic 10 Lecture 1, slide 7
  - type: cloze
    concept: factual-causation-necessary-condition
    text: 'Strong v Woolworths: s 5D(1)(a) "is a {{c1::statutory statement}} of the {{c2::''but for''}} test of causation".'
    source: Topic 10 Lecture 1, slide 21
  - type: apply
    concept: factual-causation-necessary-condition
    scenario: A pool operator negligently has no lifeguard on duty. A swimmer suffers a sudden fatal heart attack in the water; medical evidence shows that a lifeguard could not have saved him.
    answer: 'Factual causation fails: like Barnett, the death would have occurred anyway, so the breach was not a necessary condition of the harm (s 5D(1)(a); ''but for'').'
    source: Topic 10 Lecture 1, slides 6–7
  - type: basic
    concept: s5d2-exceptional-cases
    front: Where did s 5D(2) come from, and how often is it used?
    back: The Ipp Report recommended an exceptional case provision, based on the dust disease cases. It has rarely been considered, so its operation is uncertain; Adeels Palace held it did not apply.
    source: Topic 10 Lecture 2, slides 14–15
  - type: basic
    concept: s5d2-exceptional-cases
    front: What does CLA s 3B(1) do to dust disease and tobacco claims?
    back: 'Excludes the CLA from them: dust disease proceedings go under special statutes such as the Dust Diseases Tribunal Act 1989 (NSW) — which is why Amaca v Booth never mentions the CLA.'
    source: Topic 10 Lecture 1, slide 22; Topic 10 Lecture 2, slide 15; Civil Liability Act 2002 (NSW) s 3B(1)(b), (c)
  - type: basic
    concept: multiple-sufficient-causes-and-material-contribution
    front: Mason CJ's three limitations of the 'but for' test (March v Stramare)?
    back: 1. It cannot distinguish causes from necessary preconditions. 2. Intervening events. 3. Multiple sufficient causes.
    source: Topic 10 Lecture 2, slide 3
  - type: basic
    concept: multiple-sufficient-causes-and-material-contribution
    front: Cook v Lewis (1961) — what happened, and what did the court do?
    back: Accidental shooting while hunting; the jury could not decide which gun fired the single bullet. The Supreme Court of Canada held both negligent defendants liable.
    source: Topic 10 Lecture 2, slide 5
  - type: basic
    concept: multiple-sufficient-causes-and-material-contribution
    front: What is market share liability?
    back: Where several defendants are potentially negligent, each pays a portion of the compensation in line with its market share.
    source: Topic 10 Lecture 2, slide 5
  - type: basic
    concept: scope-of-liability-element
    front: What is a novus actus interveniens, and who or what can supply one?
    back: 'A later event that exacerbates the original harm or causes new harm: the plaintiff''s own act, a third party, or a natural event. If the chain is broken, the wrongdoer is not liable for harm after the break.'
    source: Topic 10 Lecture 1, slide 24
  - type: cloze
    concept: scope-of-liability-element
    text: 'March v Stramare (Mason CJ): the chain is not broken where "the defendant''s wrongful conduct has generated the {{c1::very risk}} of injury resulting from the negligence of the plaintiff or a third party".'
    source: Topic 10 Lecture 1, slide 25
  - type: apply
    concept: scope-of-liability-element
    scenario: Through his employer's negligence, Hal's leg is injured and prone to give way. He later goes down a steep staircase without a handrail, unaided; the leg gives way and he fractures his ankle.
    answer: 'McKew v Holland Hannen & Cubitts: his unreasonable conduct is a novus actus; the chain is broken, so the employer is not liable for the fracture (scope of liability, s 5D(1)(b)).'
    source: Topic 10 Lecture 1, slide 26
  - type: basic
    concept: common-sense-causation-and-s5d
    front: 'March v Stramare: Mason CJ v McHugh J on ''but for''?'
    back: 'Mason CJ: never the exclusive test; apply common sense to the facts of each case. McHugh J: the exclusive test, with a ''scope of the risk'' test bringing policy in as part of remoteness.'
    source: Topic 10 Lecture 1, slides 10–11
  - type: basic
    concept: common-sense-causation-and-s5d
    front: Why did the Ipp Report criticise 'common sense' causation?
    back: It hides policy choices — who should be responsible, how far liability should extend — inside a simple-looking factual question, making the law less transparent and less predictable.
    source: Topic 10 Lecture 1, slide 12
  - type: basic
    concept: common-sense-causation-and-s5d
    front: Adeels Palace v Moubarak (2009) 239 CLR 420 — two points on s 5D(1)?
    back: It treats factual causation and scope of liability as separate and distinct issues; and factual causation is the 'but for' test — that security "might have" made a difference does not prove it.
    source: Topic 10 Lecture 1, slides 16–18
  - type: apply
    concept: common-sense-causation-and-s5d
    scenario: A supermarket has no system for inspecting its floor. A customer slips on a grape. No one knows when it was dropped; the store had been open for five hours, and a reasonable system would inspect every 20 minutes.
    answer: 'Like Strong v Woolworths: on the balance of probabilities (s 5E) the grape was more likely dropped in the long period before the last 20 minutes, so the missing system was a necessary condition of the fall (s 5D(1)(a)).'
    source: Topic 10 Lecture 1, slides 19–21
  - type: basic
    concept: risk-chance-and-material-contribution
    front: Tabet v Gett (2010) 240 CLR 537 — the rule?
    back: 'In personal injury cases, Australian common law does not entertain an action where the damage is the loss of a chance of a better outcome (here less than 50%: possible, not probable) — Gummow ACJ.'
    source: Topic 10 Lecture 2, slides 6–7
  - type: basic
    concept: risk-chance-and-material-contribution
    front: Increased risk of harm v material contribution to harm?
    back: 'Increased risk: probabilistic, looks forward, says nothing about this claimant — not enough. Material contribution: causal, looks back, must be more than negligible.'
    source: Topic 10 Lecture 2, slide 8
  - type: cloze
    concept: risk-chance-and-material-contribution
    text: 'Bonnington Castings v Wardlaw: a negligent exposure that made a contribution more than {{c1::de minimis}} was enough; the claimant need not show it was the {{c2::sole or main}} cause.'
    source: Topic 10 Lecture 2, slide 9
  - type: basic
    concept: risk-chance-and-material-contribution
    front: Why did causation succeed in Amaca v Booth but fail in Amaca v Ellis?
    back: 'Booth: mesothelioma (asbestos effectively its only known cause), long heavy exposure, other exposures trivial, cumulative-mechanism evidence. Ellis: lung cancer, limited exposure, mainly epidemiological evidence, a competing cause (smoking).'
    source: Topic 10 Lecture 2, slides 10–12
  - type: basic
    concept: risk-chance-and-material-contribution
    front: Fairchild v Glenhaven [2003] 1 AC 32 — and its status in Australia?
    back: 'UK: materially increasing the risk was enough where the claimant could not prove which employer''s exposure caused the disease — a policy-based exception. Australian common law has not adopted it.'
    source: Topic 10 Lecture 2, slide 13
audio:
  title: Week 10 recap — causation
  minutes: 3
  script: |-
    Causation week, and it starts with damage. Damage, not damages, is the gist of negligence: no damage, no action. The plaintiff must prove, on the balance of probabilities, that the breach caused the damage, under section 5E. Causation is a factual question; remoteness, or scope of liability, is a legal question about policy, and that is next week.

    Factual causation first. At common law it is the but for test: would the plaintiff have suffered the damage but for the negligence? In Barnett, the doctor was negligent, but timely treatment would not have saved the patient, so no causation. Under section 5D(1)(a) the question is whether the negligence was a necessary condition of the harm. Same test, different words; Strong v Woolworths calls it a statutory statement of but for. Use both labels and cite the section.

    How did we get here? In March v Stramare, Mason CJ said but for was never the exclusive test and causation is decided by common sense. McHugh J wanted but for to be exclusive, with policy in remoteness. The Ipp Report said common sense hides policy choices. So section 5D(1) splits causation in two, and Adeels Palace says factual causation and scope of liability are separate and distinct. Security might have stopped the gunman; might have is not proof. In Strong, the chip was more probably dropped in the long morning period than in the last twenty minutes, so causation was proved.

    Sometimes but for is inconclusive. Multiple sufficient causes, where each event alone was enough: Cook v Lewis held both hunters liable, and market share liability spreads the loss. Loss of a chance: in Tabet v Gett a less than even chance of a better outcome was a possibility, not a probability, and not recoverable. Dust disease: increased risk is not enough, Amaca v Ellis; material contribution, more than negligible, is enough, Bonnington Castings and Amaca v Booth. Fairchild's risk test comes from the UK and is not our law.

    Section 5D(2) is the exceptional case provision the Ipp Report recommended. It is rarely used; Adeels Palace said it did not apply; and section 3B(1) keeps dust and tobacco claims out of the Act altogether. The flowchart adds a clear breach and an evidentiary gap.

    Scope of liability is the normative question in section 5D(1)(b), with section 5D(4) asking whether and why responsibility should be imposed. A novus actus can break the chain: McKew's unreasonable trip down the stairs did; the drunk driver in March did not, because the truck created the very risk.

    Last, contribution. A plaintiff can recover everything from one jointly and severally liable tortfeasor, who can then claim contribution from the others. It never affects the plaintiff.
