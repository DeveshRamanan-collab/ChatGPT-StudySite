      - text: 'Satisfied: under s 5D(3), his later statement that he would have held the rail decides it'
        why: Wrong — s 5D(3)(b) makes statements made after the harm about what he would have done inadmissible unless against his interest, and the evidence shows he would have fallen anyway.
