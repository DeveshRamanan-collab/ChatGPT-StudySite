        why: Wrong — the chart splits factual causation into common law and legislation columns, but it draws no such split under scope of liability.
      - text: Deal with them only if factual causation has failed, as a fallback route.
        why: Wrong — scope of liability is the second branch of causation, needed as well as factual causation; the fallback where necessary condition cannot be shown is s 5D(2).
