        correct: true
        why: Correct — s 5D(3)(b) excludes statements made after the harm about what he would have done, except to the extent (if any) that the statement is against his interest, as this one is.
      - text: No — every statement made after the harm about what he would have done is excluded
        why: 'Tempting as a reading of the general rule, but s 5D(3)(b) has an express exception: the statement is admissible to the extent it is against his interest.'
      - text: Yes, but only if a reasonable person would have ignored the sign too
        why: Wrong — s 5D(3)(a) makes the inquiry subjective, so there is no reasonable-person filter; admissibility turns on whether the statement is against his interest.
      - text: No, because s 5D(3) applies only under the common law 'but for' test
        why: Wrong — s 5D(3) is part of the statute and applies wherever it is relevant to factual causation to decide what the injured person would have done.
  - key: q029
    type: mcq
    concept: factual-causation-necessary-condition
    difficulty: 2
    contrasts-with:
      - scope-of-liability-element
    stem: Which statement correctly contrasts the two elements in s 5D(1)?
    options:
      - text: 'Factual causation: was the negligence a necessary condition of the harm? Scope of liability: should liability extend to the harm so caused?'
        correct: true
        why: 'Correct — this tracks s 5D(1)(a) and (b): (a) is the necessary condition question; (b) asks whether it is appropriate for liability to extend to the harm so caused.'
      - text: 'Factual causation: should liability extend to the harm so caused? Scope of liability: was the negligence a necessary condition of the harm?'
        why: 'Tempting because it uses the right words, but it swaps them: s 5D(1)(a) is necessary condition (factual causation) and (b) is scope of liability.'
      - text: 'Factual causation: was the harm reasonably foreseeable? Scope of liability: did the defendant breach the duty of care?'
        why: Wrong — neither foreseeability nor breach is what s 5D(1) asks; its two elements are necessary condition and whether liability should extend to the harm.
  - key: q030
    type: mcq
    concept: factual-causation-necessary-condition
    difficulty: 1
    variant-of: q019
    stem: Under the flowchart's common law column, Ali's injuries would not have been suffered but for Bea's negligence. What is the result?
    options:
      - text: Factual causation satisfied
        correct: true
        why: Correct — the answer to the 'but for' question is No (the injuries would not have been suffered without the negligence), and the chart marks No as satisfied.
      - text: Factual causation not satisfied
        why: Tempting if you read the chart's 'No' branch as a failure, but in the common law column No means the injuries depended on the negligence, so causation is satisfied.
      - text: Go to s 5D(2)
        why: Wrong — s 5D(2) is for negligence that cannot be established as a necessary condition; here the connection is established, so there is no gap to fill.
  - key: q031
    type: mcq
    concept: factual-causation-necessary-condition
    difficulty: 2
    stem: When does s 5D(3) come into play?
    options:
      - text: When factual causation turns on what the injured person would have done
        correct: true
        why: Correct — s 5D(3) applies "if it is relevant to the determination of factual causation to determine what the person who suffered harm would have done if the negligent person had not been negligent".
      - text: Whenever the defendant argues that the harm was too remote to be recovered
        why: Tempting because remoteness is part of causation, but it sits under scope of liability; s 5D(3) concerns factual causation and what the injured person would have done.
      - text: Only where s 5D(2) is being used to fill an evidentiary gap
        why: Wrong — s 5D(3) is not limited to the s 5D(2) route; it applies whenever factual causation depends on what the injured person would have done.
      - text: Whenever the plaintiff gives evidence at trial about how the accident happened
        why: Wrong — s 5D(3) is about what the person would have done had there been no negligence, not about evidence of how the accident happened.
  - key: q032
    type: truefalse
    set: quickfire
    concept: factual-causation-necessary-condition
    difficulty: 1
    statement: Under the flowchart's common law column, if the plaintiff's injuries would have been suffered anyway, factual causation is satisfied.
    answer: false
    why: False — the 'but for' question asks whether the injuries would have been suffered but for the negligence; a Yes (they would have happened anyway) means factual causation is not satisfied.
  - key: q033
    type: truefalse
    set: quickfire
    concept: factual-causation-necessary-condition
    difficulty: 1
    statement: Section 5D(1)(a) itself labels the necessary condition element 'factual causation'.
    answer: true
    why: 'True — s 5D(1)(a): ''that the negligence was a necessary condition of the occurrence of the harm (factual causation)''. The bracketed label is in the Act.'
  - key: q034
    type: truefalse
    set: quickfire
    concept: factual-causation-necessary-condition
    difficulty: 2
    statement: Under s 5D(3)(a), what the injured person would have done is decided by asking what a reasonable person in their position would have done.
    answer: false
    why: 'False — s 5D(3)(a) says the matter is to be determined subjectively, in the light of all relevant circumstances: what this person would have done, not a reasonable person.'
  - key: q035
    type: truefalse
    set: quickfire
    concept: factual-causation-necessary-condition
    difficulty: 2
    statement: In the NSW Act, s 5C is the provision that states the necessary condition test.
    answer: false
    why: False — although the flowchart's note names 'Section 5C(1)', the NSW s 5C is headed 'Other principles' and concerns precautions; the necessary condition test is s 5D(1)(a).
  - key: q036
    type: short
    concept: factual-causation-necessary-condition
    difficulty: 3
    cases:
      - adeels-palace-v-moubarak
      - strong-v-woolworths-ltd-tas-big-w
    prompt: Jono is injured when he dives into the shallow end of a council pool at night. The council negligently failed to put up a 'No diving — shallow water' sign at that end. At trial Jono says that, had there been a sign, he would never have dived. Friends give evidence that on earlier nights he dived at the other end despite a sign there. Advise on factual causation under the CLA.
    model: |-
      The issue is whether the council's failure to put up a sign was a necessary condition of Jono's harm (CLA s 5D(1)(a)). There must be a connection between the breach and the injury (Adeels Palace v Moubarak; Strong v Woolworths); the flowchart treats the statutory test as the common law 'but for' question: would Jono's injuries have been suffered but for the negligence?

      The answer depends on what Jono would have done had a sign been there, so s 5D(3) applies. It is decided subjectively, in the light of all relevant circumstances. His statement at trial that he would never have dived was made after the harm and is not against his interest, so under s 5D(3)(b) it is inadmissible. The friends' evidence of his past conduct is a relevant circumstance, and it suggests he might have dived despite a sign.

      If the court finds he would have dived anyway, the answer to the 'but for' question is Yes and the statutory question is No: factual causation is not satisfied. If it finds a sign would have stopped him, factual causation is satisfied and scope of liability follows. On this evidence, factual causation looks difficult for Jono to establish.
    rubric:
      - id: r1
        criterion: 'Issue: necessary condition'
        marks: 2
        top-band: Frames the issue as s 5D(1)(a) and the connection between breach and injury.
        margin-note: Name the test before applying it.
        authorities:
          - civil-liability-act-2002-nsw-s5d
      - id: r2
        criterion: 'Law: s 5D(3)'
        marks: 3
        top-band: Identifies that hypothetical conduct is in issue; subjective test; post-harm statement inadmissible unless against interest.
        margin-note: This is a s 5D(3) problem.
        authorities:
          - civil-liability-act-2002-nsw-s5d
      - id: r3
        criterion: Application
        marks: 3
        top-band: Excludes Jono's self-serving statement and weighs the friends' evidence as a relevant circumstance.
        margin-note: Use the evidence the facts give you.
        authorities: []
      - id: r4
        criterion: Conclusion
        marks: 2
        top-band: Reads the Yes/No answers the right way round and concludes on likelihood, noting scope of liability would follow if satisfied.
        margin-note: Mirror-image questions — check the direction.
        authorities: []
  - key: q036a
    type: short
    concept: factual-causation-necessary-condition
    difficulty: 3
    cases:
      - adeels-palace-v-moubarak
      - strong-v-woolworths-ltd-tas-big-w
    prompt: Mia's GP negligently fails to refer her for a scan. Experts agree that a scan at that time would have detected her condition, and that treatment then would have prevented the harm she later suffered. The GP argues that Mia, who disliked hospitals, would not have gone for the scan even if referred. At trial Mia says she would certainly have gone. Advise on factual causation under the CLA.
    model: |-
      The issue is whether the GP's failure to refer was a necessary condition of Mia's harm (CLA s 5D(1)(a)), that is, whether there is a connection between the breach and her injury (Adeels Palace v Moubarak; Strong v Woolworths).

      At common law the question is whether Mia's injuries would have been suffered but for the negligence; under the Act, whether the fault was a necessary condition of the harm. A 'No' to the first and a 'Yes' to the second both mean causation is satisfied.

      On the experts' evidence, a referral leading to a scan would have prevented the harm. But the chain depends on what Mia would have done if referred, so s 5D(3) applies: it is decided subjectively, in the light of all relevant circumstances. Her statement at trial that she would certainly have gone was made after the harm and is not against her interest, so it is inadmissible under s 5D(3)(b). The court must weigh the other circumstances, including her dislike of hospitals.

      Conclusion: if the court finds Mia would have gone for the scan, factual causation is satisfied and scope of liability follows; if not, it fails.
    rubric:
      - id: r1
        criterion: Issue and test
        marks: 2
        top-band: States s 5D(1)(a) and the connection requirement, and frames both the statutory and the common law questions.
        margin-note: Name the test and ask its question.
        authorities:
          - civil-liability-act-2002-nsw-s5d
      - id: r2
        criterion: Reading the answers
        marks: 2
        top-band: Shows that 'No' (but for) and 'Yes' (necessary condition) both mean satisfied.
        margin-note: Mirror-image questions.
        authorities: []
      - id: r3
        criterion: 'Law and application: s 5D(3)'
        marks: 4
        top-band: Identifies hypothetical conduct; subjective test; Mia's post-harm statement inadmissible; uses the other circumstances in the facts.
        margin-note: The case turns on what Mia would have done.
        authorities:
          - civil-liability-act-2002-nsw-s5d
      - id: r4
        criterion: Conclusion
        marks: 2
        top-band: Concludes conditionally on the finding about the scan, and notes scope of liability follows if satisfied.
        margin-note: A conditional conclusion is fine if it is reasoned.
        authorities: []
  - key: q037
    type: mcq
    concept: s5d2-exceptional-cases
    difficulty: 1
    set: pretest
    stem: When does the flowchart turn to s 5D(2) of the CLA (NSW)?
    options:
      - text: When negligence cannot be established as a necessary condition of the harm
        correct: true
        why: Correct — Causation 3 opens with exactly these cases and then says s 5D(2) can be used to establish factual causation in 'an appropriate case'.
      - text: When the harm is too remote, so that scope of liability needs a second look
        why: Tempting because s 5D(4) uses similar words for scope of liability, but s 5D(2) is about factual causation where necessary condition cannot be shown.
      - text: In every negligence claim, as a check after the necessary condition test is passed
        why: Wrong — s 5D(2) is not a routine check; it applies to negligence that cannot be established as a necessary condition, which the NSW text calls an exceptional case.
      - text: When the defendant's breach of duty is unclear and needs to be proved
        why: 'Wrong — the chart says the reverse: for the s 5D(2) route there must also be a clear breach; s 5D(2) does not help prove breach.'
  - key: q038
    type: mcq
    concept: s5d2-exceptional-cases
    difficulty: 2
    stem: The flowchart says s 5D(2) can be used 'in an appropriate case'. What words does the NSW text of s 5D(2) use?
    options:
      - text: '''in an exceptional case'''
        correct: true
        why: Correct — the NSW s 5D(2) begins 'In determining in an exceptional case, in accordance with established principles…'. The flowchart's wording differs, so cite the NSW words.
      - text: '''in any case the court considers just'''
        why: Tempting because s 5D(2) does call for a judgment about responsibility, but its opening words confine it to an exceptional case, decided in accordance with established principles.
      - text: '''in an appropriate case'''
        why: Tempting because it is the flowchart's wording, but the NSW Act's s 5D(2) says 'exceptional case' — the textbook's phrase differs from the NSW text.
      - text: '''in a case of material contribution only'''
        why: Wrong — s 5D(2) does not mention material contribution; the flowchart gives material contribution and multiple sufficient causes as kinds of 'appropriate case'.
  - key: q039
    type: mcq
    concept: s5d2-exceptional-cases
    difficulty: 2
    stem: Besides the case being of the right kind, what does the flowchart say there must also be for the s 5D(2) route?
    options:
      - text: A clear breach and an evidentiary gap
        correct: true
        why: 'Correct — Causation 3: ''Must also be: A clear breach and An evidentiary gap.'''
      - text: A clear breach and proof that the harm was foreseeable
        why: Tempting because foreseeability runs through negligence, but the chart pairs a clear breach with an evidentiary gap, not with foreseeability.
      - text: An evidentiary gap and a statement by the plaintiff against interest
        why: Wrong — statements against interest come from s 5D(3)(b), about what the injured person would have done; the chart's pair is a clear breach and an evidentiary gap.
      - text: A new intervening act and an evidentiary gap
        why: Wrong — new intervening acts belong to scope of liability; the two further requirements for s 5D(2) on the chart are a clear breach and an evidentiary gap.
  - key: q040
    type: mcq
    concept: s5d2-exceptional-cases
    difficulty: 2
    stem: In applying s 5D(2), what does the NSW text say the court is to consider (amongst other relevant things)?
    options:
      - text: Whether or not and why responsibility for the harm should be imposed on the negligent party
        correct: true
        why: Correct — these are the closing words of s 5D(2) in the NSW Act.
      - text: Whether the harm was a reasonably foreseeable consequence of the negligent party's breach
        why: 'Tempting because foreseeability is familiar from duty and breach, but s 5D(2) names a different question: whether and why responsibility should be imposed.'
      - text: Whether a reasonable person in the negligent party's position would have taken precautions
        why: Tempting because it echoes s 5B(1)(c), but that is the breach question; s 5D(2) asks the normative question of whether and why responsibility should be imposed.
      - text: Whether the plaintiff would have acted differently had there been no negligence
        why: Wrong — that is the s 5D(3) inquiry into what the injured person would have done; s 5D(2) asks whether and why responsibility should be imposed.
  - key: q041
    type: mcq
    concept: s5d2-exceptional-cases
    difficulty: 3
    stem: The flowchart lists two things the court must consider when applying s 5D(2). Which one does not appear in the NSW text of s 5D(2)?
    options:
      - text: Whether and why the harm should be left to lie where it fell
        correct: true
        why: Correct — this is the chart's item (b). The NSW s 5D(2) asks only (amongst other relevant things) whether or not and why responsibility should be imposed on the negligent party; verify the chart's (b).
      - text: Whether and why responsibility for the harm should be imposed
        why: 'Tempting to doubt it, but this is the chart''s item (a) and it does appear in the NSW text: ''whether or not and why responsibility for the harm should be imposed on the negligent party''.'
      - text: Neither — both appear in the NSW text, word for word
        why: Wrong — only the responsibility question appears in the NSW s 5D(2); the 'left to lie where it fell' consideration is on the chart but not in the NSW text.
  - key: q042
    type: mcq
    concept: s5d2-exceptional-cases
    difficulty: 3
    contrasts-with:
      - scope-of-liability-element
    stem: Rhea proves that a factory's negligence materially increased the risk of the illness she developed, but medical knowledge cannot say what caused it. The breach is clear. Which route does the flowchart offer for factual causation?
    options:
      - text: Section 5D(2), as an appropriate (in NSW, exceptional) case
        correct: true
        why: Correct — negligence cannot be shown to be a necessary condition, the breach is clear and there is an evidentiary gap, so the s 5D(2) route is open; the court then weighs whether and why responsibility should be imposed.
      - text: 'None: if necessary condition cannot be proved, the claim must fail'
        why: Tempting because necessary condition is the ordinary test, but the chart provides s 5D(2) precisely for cases where negligence cannot be established as a necessary condition.
      - text: Scope of liability under s 5D(4), since the cause is unknown
        why: Wrong — s 5D(4) applies to scope of liability for harm the negligence caused; it cannot supply factual causation where the cause cannot be proved.
      - text: The common law 'but for' test, which is easier to satisfy
        why: Wrong — the chart's note treats the statutory test as the common law 'but for' test; switching columns gives the same answer, not an easier one.
  - key: q043
    type: mcq
    concept: s5d2-exceptional-cases
    difficulty: 3
    variant-of: q042
    stem: Same facts as Rhea, but the breach itself is disputed and unclear. What does the flowchart suggest about the s 5D(2) route?
    options:
      - text: 'It is not open on the chart''s terms: there must also be a clear breach'
        correct: true
        why: Correct — Causation 3 says the route needs a clear breach as well as an evidentiary gap; an unclear breach falls short of that.
      - text: It is open, because an evidentiary gap on breach is exactly what s 5D(2) fills
        why: Tempting because s 5D(2) deals with an evidentiary gap, but the gap is about causation; the chart requires the breach itself to be clear.
      - text: It is open, but only under the common law column of the flowchart
        why: Wrong — s 5D(2) is a provision of the NSW Act; the chart offers no common law version of this route that dispenses with a clear breach.
  - key: q044
    type: mcq
    concept: s5d2-exceptional-cases
    difficulty: 2
    stem: What does s 5D(2) allow a court to accept, in an exceptional case?
    options:
      - text: Negligence not shown to be a necessary condition, as establishing factual causation
        correct: true
        why: Correct — the court decides 'whether negligence that cannot be established as a necessary condition of the occurrence of harm should be accepted as establishing factual causation'.
      - text: Harm that falls outside the scope of liability as still being within it, for policy reasons
        why: Tempting because the provision includes a question about responsibility, but it is about factual causation; scope of liability is s 5D(1)(b) and s 5D(4).
      - text: A breach of duty that cannot be proved, if the harm is serious
        why: Wrong — s 5D(2) assumes negligence and asks about causation; the chart also requires a clear breach for this route.
  - key: q045
    type: mcq
    concept: s5d2-exceptional-cases
    difficulty: 3
    contrasts-with:
      - scope-of-liability-element
    stem: Section 5D(2) and s 5D(4) both direct the court to consider whether or not and why responsibility for the harm should be imposed on the negligent party. What is the difference?
    options:
      - text: Section 5D(2) asks it about factual causation; s 5D(4) asks it about scope of liability
        correct: true
        why: 'Correct — the same question is asked at two stages: in s 5D(2) to decide whether factual causation can be accepted in an exceptional case, and in s 5D(4) to determine scope of liability.'
      - text: Section 5D(2) applies to claims at common law, and s 5D(4) applies to claims brought under the Act
        why: Tempting because the chart has a common law column, but both subsections are in the NSW Act; the difference is the element each serves.
      - text: 'There is none: s 5D(4) simply repeats s 5D(2) for emphasis'
        why: 'Wrong — the subsections serve different elements of s 5D(1): s 5D(2) factual causation in an exceptional case, s 5D(4) scope of liability.'
      - text: Section 5D(2) is about breach of duty; s 5D(4) is about causation
        why: Wrong — neither is about breach; s 5D(2) concerns factual causation where necessary condition cannot be shown, and s 5D(4) concerns scope of liability.
  - key: q046
    type: mcq
    concept: s5d2-exceptional-cases
    difficulty: 2
    stem: The court's consideration under s 5D(2) is framed as 'amongst other relevant things'. What follows?
    options:
      - text: The responsibility question is one consideration, not the only one
        correct: true
        why: Correct — 'amongst other relevant things' signals that the court may weigh other relevant matters as well as whether and why responsibility should be imposed.
      - text: The responsibility question is the only matter the court may weigh
        why: Tempting because it is the only matter named, but the words 'amongst other relevant things' make clear the list is not exhaustive.
      - text: The court must weigh every 'other relevant thing' listed in s 5B(2)
        why: Wrong — s 5B(2) lists breach considerations (probability, seriousness, burden of precautions, social utility); s 5D(2) does not import them.
  - key: q047
    type: mcq
    concept: s5d2-exceptional-cases
    difficulty: 4
    stem: Which list contains only things the flowchart requires or directs for the s 5D(2) route?
    options:
      - text: Right kind of case, clear breach, evidentiary gap, and the responsibility question
        correct: true
        why: Correct — the chart needs a case of the right kind (multiple sufficient causes or material contribution), a clear breach and an evidentiary gap, and directs the court to the responsibility question.
      - text: Right kind of case, clear breach, new intervening act, and the remoteness question
        why: Tempting because the first two are right, but new intervening acts and remoteness belong to scope of liability, the other branch of causation.
      - text: Right kind of case, unclear breach, evidentiary gap, and the plaintiff's later statement
        why: Wrong — the chart requires a clear breach, not an unclear one, and a plaintiff's later statement belongs to s 5D(3), where it is usually inadmissible.
  - key: q048
    type: truefalse
    set: quickfire
    concept: s5d2-exceptional-cases
    difficulty: 1
    statement: The NSW text of s 5D(2) refers to 'an exceptional case', while the flowchart says 'an appropriate case'.
    answer: true
    why: True — the NSW Act opens s 5D(2) with 'In determining in an exceptional case'; the flowchart says s 5D(2) can be used in 'an appropriate case'. Cite the NSW words.
  - key: q049
    type: truefalse
    set: quickfire
    concept: s5d2-exceptional-cases
    difficulty: 1
    statement: On the flowchart, the s 5D(2) route needs both a clear breach and an evidentiary gap.
    answer: true
    why: 'True — Causation 3: ''Must also be: A clear breach and An evidentiary gap''. The two are joined by ''and'', so both are needed.'
  - key: q050
    type: truefalse
    set: quickfire
    concept: s5d2-exceptional-cases
    difficulty: 2
    statement: Section 5D(2) decides whether harm falls within the scope of the negligent person's liability.
    answer: false
    why: False — s 5D(2) decides whether negligence that cannot be established as a necessary condition should be accepted as establishing factual causation; scope of liability is s 5D(1)(b), guided by s 5D(4).
  - key: q051
    type: truefalse
    set: quickfire
    concept: s5d2-exceptional-cases
    difficulty: 3
    statement: The NSW text of s 5D(2) directs the court to consider whether and why the harm should be left to lie where it fell.
    answer: false
    why: False — that consideration is on the flowchart as item (b), but the NSW s 5D(2) names only whether or not and why responsibility should be imposed on the negligent party (amongst other relevant things).
  - key: q052
    type: short
    concept: s5d2-exceptional-cases
    difficulty: 4
    cases:
      - fairchild-v-glenhaven-funeral-services-ltd
      - mcgee-v-national-coal-board
      - amaca-pty-ltd-v-ellis
      - henville-v-walker
    prompt: Lena develops a lung condition after years in a workshop where her employer, in clear breach of its duty, failed to provide ventilation. Medical experts agree the poor ventilation materially increased her risk, but say current medical knowledge cannot tell whether it, or something else, caused her condition. Advise Lena on factual causation under the CLA.
    model: |-
      The issue is factual causation. Under CLA s 5D(1)(a), the negligence must be a necessary condition of the harm. Lena cannot prove this: medical knowledge cannot say what caused her condition.

      The flowchart then turns to s 5D(2), which can be used to establish factual causation where negligence cannot be established as a necessary condition. The NSW text confines it to an exceptional case (the flowchart says an appropriate case), decided in accordance with established principles. Her facts fit the flowchart's material contribution kind: negligent conduct that materially increases the risk of harm where the state of scientific or medical knowledge makes it impossible to prove the cause (the flowchart cites Fairchild, McGee, Amaca v Ellis and Henville v Walker). There must also be a clear breach, which is given, and an evidentiary gap, which the experts' evidence supplies.

      The court must then consider, amongst other relevant things, whether and why responsibility for the harm should be imposed on the employer; the flowchart adds whether the harm should be left to lie where it fell. Conclusion: Lena has a real argument under s 5D(2), but it turns on that judgment; if it succeeds, scope of liability must still be addressed.
    rubric:
      - id: r1
        criterion: Issue and the necessary condition problem
        marks: 2
        top-band: Identifies that Lena cannot establish necessary condition under s 5D(1)(a) because of the state of medical knowledge.
        margin-note: Start with the ordinary test, then show why it fails.
        authorities:
          - civil-liability-act-2002-nsw-s5d
      - id: r2
        criterion: 'Law: s 5D(2) gateway'
        marks: 3
        top-band: Quotes or paraphrases s 5D(2), uses the NSW 'exceptional case' wording and notes the flowchart's 'appropriate case'.
        margin-note: Cite the NSW text, not just the textbook.
        authorities:
          - civil-liability-act-2002-nsw-s5d
      - id: r3
        criterion: 'Application: kind of case and requirements'
        marks: 3
        top-band: Classifies the facts as material contribution (increased risk; science cannot prove cause), and finds a clear breach and an evidentiary gap.
        margin-note: Match the facts to the flowchart description.
        authorities: []
      - id: r4
        criterion: Conclusion and next step
        marks: 2
        top-band: Frames the outcome around the responsibility question and notes scope of liability must follow.
        margin-note: Do not overstate — this is a judgment call.
        authorities:
          - civil-liability-act-2002-nsw-s5d
  - key: q053
    type: mcq
    concept: multiple-sufficient-causes-and-material-contribution
    difficulty: 1
    set: pretest
    stem: According to the flowchart, in which two kinds of case does the 'but for' / 'necessary condition' test yield unsatisfactory results?
    options:
      - text: Multiple sufficient causes, and material contribution to harm
        correct: true
        why: Correct — the foot of Causation 2 names these two kinds of case, and Causation 3 takes them to s 5D(2).
      - text: New intervening acts, and remoteness of damage
        why: Tempting because they are also paired on the chart, but they are the two parts of scope of liability, not cases where the factual causation tests fail.
      - text: Cases with no clear breach, and cases with no evidentiary gap
        why: Wrong — a clear breach and an evidentiary gap are things the s 5D(2) route must also have; their absence does not define the problem cases.
      - text: Cases at common law, and cases under civil liability legislation
        why: Wrong — those are the two columns of factual causation; the problem cases arise in both columns, because both tests can yield unsatisfactory results.
  - key: q054
    type: mcq
    concept: multiple-sufficient-causes-and-material-contribution
    difficulty: 2
    cases:
      - bonnington-castings-v-wardlaw
      - march-v-stramare
    stem: Which description does the flowchart attach to multiple sufficient causes?
    options:
      - text: The cumulative operation of factors in the total harm, where each factor's contribution to that harm is unascertainable
        correct: true
        why: Correct — the chart describes multiple sufficient causes as cases of "the cumulative operation of factors in the occurrence of the total harm" where "the contribution of each factor to that harm is unascertainable".
      - text: Negligent conduct that materially increases the risk of harm, where science or medicine makes it impossible to prove the cause
        why: Tempting because the two descriptions sit side by side, but the chart attaches this one to material contribution to harm, not to multiple sufficient causes.
      - text: Harm that would have been suffered anyway, whether or not the defendant had been negligent
        why: Wrong — that describes a 'Yes' to the common law 'but for' question, where factual causation is simply not satisfied; it is not a case where the test yields unsatisfactory results.
