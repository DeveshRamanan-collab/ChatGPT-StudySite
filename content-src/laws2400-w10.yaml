  - key: q016
    type: short
    concept: causation-flowchart
    difficulty: 3
    cases:
      - adeels-palace-v-moubarak
      - strong-v-woolworths-ltd-tas-big-w
    prompt: Ruth slips on a wet floor in Harbour Mall. The cleaner had failed to put out a warning sign. Ruth sues the mall's operator. Assume duty and breach are established. Using the textbook flowchart and CLA s 5D, set out how you would structure the causation part of your answer, and say what you would need from the facts at each step.
    model: |-
      The issue is whether the failure to put out a sign caused Ruth's harm. Under CLA s 5D(1), causation has two elements: factual causation and scope of liability, and both must be satisfied.

      First, factual causation. Under s 5D(1)(a), was the operator's fault a necessary condition of Ruth's harm? There must be a connection between the breach and her injury (Adeels Palace v Moubarak; Strong v Woolworths). The flowchart treats the statutory test as the common law 'but for' test. Because the question turns on what Ruth would have done had a sign been there, s 5D(3) applies: it is decided subjectively, in the light of all relevant circumstances, and her own statement after the fall that she would have avoided the spill is inadmissible unless it is against her interest. I would need evidence of whether she would have seen and heeded a sign.

      If necessary condition cannot be established, consider s 5D(2): an exceptional case, a clear breach and an evidentiary gap, and whether and why responsibility should be imposed.

      Second, scope of liability (s 5D(1)(b)): new intervening acts and remoteness, with the s 5D(4) responsibility question. Conclusion: causation turns on what Ruth would have done.
    rubric:
      - id: r1
        criterion: 'Issue: identifies the two elements of causation'
        marks: 2
        top-band: States both elements of s 5D(1) and says both must be satisfied.
        margin-note: Two elements — not just "but for".
        authorities:
          - civil-liability-act-2002-nsw-s5d
      - id: r2
        criterion: 'Law and application: factual causation'
        marks: 3
        top-band: Applies the s 5D(1)(a) necessary condition question to the missing sign, citing Adeels Palace / Strong for the connection.
        margin-note: Ask the question as the flowchart frames it.
        authorities:
          - civil-liability-act-2002-nsw-s5d
      - id: r3
        criterion: 'Law and application: s 5D(3)'
        marks: 2
        top-band: Sees that the issue is what Ruth would have done; subjective test; her post-accident statement inadmissible unless against interest.
        margin-note: Hypothetical conduct — s 5D(3) is the key here.
        authorities:
          - civil-liability-act-2002-nsw-s5d
      - id: r4
        criterion: Fallback and second element
        marks: 2
        top-band: Mentions s 5D(2) only as the route if necessary condition cannot be established; then addresses scope of liability (new intervening acts, remoteness, s 5D(4)).
        margin-note: Do not stop at factual causation.
        authorities:
          - civil-liability-act-2002-nsw-s5d
      - id: r5
        criterion: Conclusion
        marks: 1
        top-band: States what the outcome depends on (the evidence of what Ruth would have done) rather than guessing.
        margin-note: Conclude on the issue you raised.
        authorities: []
  - key: q017
    type: mcq
    concept: factual-causation-necessary-condition
    difficulty: 1
    stem: Which question does the flowchart pose for factual causation at common law?
    options:
      - text: Would the plaintiff's injuries have been suffered but for the defendant's negligence?
        correct: true
        why: Correct — this is the common law 'but for' question in Causation 2, word for word.
      - text: Was the defendant's fault a necessary condition of the occurrence of the plaintiff's harm?
        why: Tempting because it is closely related, but this is the question in the civil liability legislation column — the 'necessary condition' test in s 5D(1)(a).
      - text: Was the harm of a kind a reasonable person would have foreseen as a result of the breach?
        why: Tempting because foreseeability runs through negligence, but the chart's factual causation question asks about the connection between negligence and injury, not foreseeability.
      - text: Is it appropriate for the defendant's liability to extend to the harm that was caused?
        why: Wrong — that is the scope of liability question in s 5D(1)(b), the second branch of causation, not the factual causation question.
  - key: q018
    type: mcq
    concept: factual-causation-necessary-condition
    difficulty: 1
    stem: Which test does the flowchart say to apply under the civil liability legislation?
    options:
      - text: The 'necessary condition' test in s 5D(1)(a)
        correct: true
        why: 'Correct — the legislation column of Causation 1 and 2 says: apply ''necessary condition'' test — s 5D(1)(a).'
      - text: The 'material contribution to harm' test in s 5D(2)
        why: Tempting because s 5D(2) is on the chart, but it is the exceptional route where the necessary condition test cannot be met, not the test the legislation column applies.
      - text: The 'reasonable person' test in s 5B(1)(c)
        why: Wrong — s 5B(1)(c) asks whether a reasonable person would have taken precautions, a breach question; the causation test is necessary condition in s 5D(1)(a).
      - text: The 'scope of liability' test in s 5D(4)
        why: Wrong — s 5D(4) guides the second element, scope of liability; the factual causation test in the legislation column is necessary condition, s 5D(1)(a).
