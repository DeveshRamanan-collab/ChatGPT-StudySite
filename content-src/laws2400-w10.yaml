      - text: 'Nothing: once factual causation is satisfied, causation is established'
        why: Tempting because necessary condition is often the hard part, but the chart and s 5D(1) make causation two elements; scope of liability must still be satisfied.
      - text: Whether s 5D(2) applies, since it must be considered in every case
        why: Wrong — s 5D(2) is for negligence that cannot be established as a necessary condition; Pia has established it, so that route is not needed.
