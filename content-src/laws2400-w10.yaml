  - key: q021
    type: mcq
    concept: factual-causation-necessary-condition
    difficulty: 3
    stem: Owen's employer negligently failed to fix a broken handrail. Owen fell on the stairs. The evidence shows he fainted at the top and would have fallen the same way had the handrail been fixed. Applying the common law 'but for' question, what follows?
    options:
      - text: 'Not satisfied: the injuries would have been suffered anyway'
        correct: true
        why: Correct — the answer to 'would the injuries have been suffered but for the negligence?' is Yes on these facts, and the chart marks Yes as factual causation not satisfied.
      - text: Satisfied, because the breach and the fall happened together
        why: Tempting because the breach was present when Owen fell, but coincidence in time is not a connection; the chart asks whether the injuries would have been suffered anyway.
      - text: Satisfied through s 5D(2), because the breach was clear
        why: Wrong — s 5D(2) is for negligence that cannot be established as a necessary condition because of an evidentiary gap; here the evidence shows the fall would have happened anyway.
      - text: Not yet decidable until scope of liability has been decided
        why: Wrong — the chart deals with factual causation as its own branch; scope of liability is the second element, not a precondition to asking the 'but for' question.
  - key: q022
    type: mcq
    concept: factual-causation-necessary-condition
    difficulty: 3
    variant-of: q021
    stem: Same facts as Owen, but the claim is run under the CLA. Applying s 5D(1)(a), what follows?
    options:
      - text: 'Not satisfied: the fault was not a necessary condition of Owen''s harm'
        correct: true
        why: Correct — the fall would have happened anyway, so the answer to the statutory question is No, and the chart marks No as factual causation not satisfied.
      - text: 'Satisfied: the statutory test is looser than the common law ''but for'' test'
