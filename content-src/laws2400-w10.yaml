      Causation is not finished when factual causation is satisfied. Section 5D(1)(b) asks whether it is appropriate for the scope of the negligent person's liability to extend to the harm so caused — a **normative** question. Section 5D(4): the court is to consider (amongst other relevant things) whether or not and why responsibility for the harm should be imposed on the negligent party. The test comes from the common law (remoteness), covered in Topic 11.

      The flowchart gives scope of liability two parts joined by AND: **new intervening acts** and **remoteness**.

      **Intervening acts** (introduced this week). A *novus actus interveniens* is a later event that exacerbates the original harm or causes new harm — the plaintiff's own act, a third party's, or a natural event. If the chain is broken, the original wrongdoer is not liable for harm after the break. Not every later careless act severs it: in *March v Stramare* the truck created the very risk that materialised, so the driver's own negligence did not break the chain. In *McKew v Holland Hannen & Cubitts Ltd* the plaintiff, whose injured leg was prone to give way, went down a steep staircase without a handrail, unaided; his unreasonable conduct was a novus actus, and the defendant was not liable for the second injury.

      Section 5D(4) asks the same question as s 5D(2), but at a different stage.

      Exam use: after factual causation, deal with scope expressly — any intervening act, then remoteness — and frame the conclusion with s 5D(4).
  - slug: contribution-between-tortfeasors
    title: Contribution between tortfeasors
    visual: simulation
    visual-brief: 'Two concurrent tortfeasors and one plaintiff: choose whom the plaintiff sues, whether the other tortfeasor can pay, and the kind of claim; the plaintiff''s recovery stays whole while the contribution claim and the insolvency risk move between the tortfeasors (with a flag where proportionate liability may apply).'
    related:
      - causation-flowchart
    depends-on: []
    contrasts-with: []
    cases: []
    authorities:
      - law-reform-miscellaneous-provisions-act-1946-nsw-s5
    verify: false
    body: |-
      The textbook ([12.170]) explains what happens where several tortfeasors are liable for the same damage.

      Where multiple tortfeasors are **jointly and severally liable** for damage, the plaintiff may choose to recover the whole amount against only one of them — for example, the one with the "deeper pockets". A footnote qualifies this where the proportionate liability provisions apply, in respect of claims for property damage and economic loss; those provisions are not in these pages.

      **Contribution** is the statutory mechanism by which a tortfeasor held liable for the full amount of damage may seek a contribution against another tortfeasor. For NSW the textbook cites the Law Reform (Miscellaneous Provisions) Act 1946 (NSW) s 5(1)(c) and s 5(2).

      Two consequences follow:

      - Contribution in no way affects the plaintiff; it is a matter between the tortfeasors themselves.
      - So where there are joint or separate, concurrent tortfeasors, the risk that one of them is insolvent or not able to pay the full amount of damages lies with the other tortfeasors, not the plaintiff.

      Exam use: where two wrongdoers are liable for the same damage, say the plaintiff may recover the whole amount from either (checking whether proportionate liability applies to a property damage or economic loss claim), and that contribution and any insolvency are for the tortfeasors to sort out between themselves.
  - slug: common-sense-causation-and-s5d
    title: 'From common sense to s 5D: March v Stramare, the Ipp Report and Adeels Palace'
    visual: timeline
    visual-brief: 'Five events on one track — March v Stramare (1991: Mason CJ''s common sense, McHugh J''s exclusive ''but for''), the Ipp Report''s critique, CLA s 5D(1) (2002), Adeels Palace (2009) and Strong v Woolworths (2012) — each showing one step in separating the factual question from the policy question.'
    related:
      - factual-causation-necessary-condition
      - scope-of-liability-element
      - causation-flowchart
    depends-on:
      - factual-causation-necessary-condition
    contrasts-with:
      - scope-of-liability-element
    cases:
      - march-v-stramare
      - adeels-palace-v-moubarak
      - strong-v-woolworths-ltd-tas-big-w
    authorities:
      - civil-liability-act-2002-nsw-s5d
      - civil-liability-act-2002-nsw-s5e
    verify: false
    body: |-
      When 'but for' gives an odd answer, how is factual causation decided? The answer moved.

      **March v Stramare (1991) 171 CLR 506.** A truck parked mid-road was hit by a drunk, speeding driver. The trial judge found the defendant liable with 70% contributory negligence; the Full Court of South Australia blamed the plaintiff entirely. The High Court held the defendant's negligence was a cause, by different reasoning. Mason CJ: 'but for' was never the exclusive test; causation 'must be determined by applying common sense to the facts of each particular case'. McHugh J: 'but for' should be exclusive, with a 'scope of the risk' test bringing policy in as part of remoteness.

      **The Ipp Report** criticised 'common sense': it hides policy choices — value judgments about who should be responsible and how far liability should extend — inside what looks like a factual question, making the law less transparent and predictable.

      **CLA s 5D(1)** restructured and codified the common law (the cases still matter): (a) factual causation, a necessary condition; (b) scope of liability.

      **Adeels Palace v Moubarak (2009)**: s 5D(1) 'treats factual causation and scope of liability as separate and distinct issues'; factual causation is the 'but for' test, and that security 'might have' made a difference does not prove it.

      **Strong v Woolworths (2012)**: s 5D(1)(a) 'is a statutory statement of the "but for" test', applied on the balance of probabilities (s 5E).

      Exam use: apply necessary condition first, on the evidence; keep policy for scope of liability.
  - slug: risk-chance-and-material-contribution
    title: 'Possibility, risk and contribution: Tabet v Gett and the dust disease cases'
    visual: simulation
    visual-brief: 'Two modes. Lost chance: slide the chance of a better outcome and see that below ''more probable than not'' the claim is for a possibility, not a probability (Tabet v Gett). Dust disease: set the disease, the defendant''s exposure, the kind of evidence and any competing cause; the verdict shows whether the profile matches Amaca v Booth (contribution can be inferred) or Amaca v Ellis (increased risk only — not enough).'
    related:
      - multiple-sufficient-causes-and-material-contribution
      - s5d2-exceptional-cases
      - factual-causation-necessary-condition
    depends-on:
      - factual-causation-necessary-condition
    contrasts-with:
      - multiple-sufficient-causes-and-material-contribution
    cases:
      - tabet-v-gett
      - bonnington-castings-v-wardlaw
      - amaca-pty-ltd-v-ellis
      - amaca-v-booth
      - fairchild-v-glenhaven-funeral-services-ltd
    authorities:
      - civil-liability-act-2002-nsw-s5e
      - civil-liability-act-2002-nsw-s3b
    verify: false
    body: |-
      Factual causation needs proof on the balance of probabilities; a possibility or an increased risk is not enough.

      **Loss of a chance.** In *Tabet v Gett* (2010) 240 CLR 537 a child suffered brain damage after a delayed CT scan. Her chance of a better outcome was under 50% — possible, not probable. Gummow ACJ: in personal injury cases the common law of Australia does not entertain an action where the damage is characterised as the loss of a chance of a better outcome — without accepting, in absolute terms, that a lost chance can never be the damage.

      **Dust disease cases**, where science cannot say which exposure caused the disease:
      - *Increased risk* — probabilistic, looks forward, says nothing about what happened to this claimant.
      - *Material contribution to harm* — causal, looks back, must be more than negligible.

      *Bonnington Castings v Wardlaw*: a negligent contribution to cumulative silica dust that was more than de minimis was enough; it need not be the sole or main cause. *Amaca v Ellis* (2010): showing asbestos exposure increased the risk of lung cancer (he also smoked) was not sufficient. *Amaca v Booth* (2011): mesothelioma (asbestos effectively its only known cause), long heavy exposure, trivial other exposures and cumulative-mechanism evidence — contribution inferred. *Fairchild* (UK) treated materially increased risk as enough; Australian common law has not adopted it.

      *Amaca v Booth* never mentions the CLA: s 3B(1) excludes dust disease proceedings from it.

      Exam use: contribution, or only risk or chance?
cases:
  - slug: adeels-palace-v-moubarak
    name: Adeels Palace v Moubarak
    citation: (2009) 239 CLR 420
    aglc: Adeels Palace v Moubarak (2009) 239 CLR 420
    facts: After a fight in a nightclub on New Year's Eve, Moubarak was shot by another patron. He argued that the club was negligent in not providing any security, resulting in his injury.
    issue: Whether the club's failure to provide security was a cause of the shooting injuries under CLA s 5D(1), and if not, whether it was an exceptional case under s 5D(2).
    held: 'The ''but for'' test was not satisfied: the evidence at trial did not show that the presence of security personnel would have deterred or prevented the re-entry of the gunman. There was no reason to treat the case as an exceptional case under s 5D(2).'
    ratio: In contrast to what Mason CJ observed in March v Stramare, s 5D(1) 'treats factual causation and scope of liability as separate and distinct issues', and factual causation under s 5D(1) is determined by the 'but for' test. That changing 'any of the circumstances in which the shootings occurred might have made a difference does not prove factual causation'; it 'would be contrary to established principles' to hold the defendant responsible when negligence was not a necessary condition but 'might have' prevented the harm [57].
    significance: The leading High Court statement that s 5D(1) separates factual causation from scope of liability, and the one case on the slides in which s 5D(2) was considered and found not to apply.
    why-here: Cite for the 'but for' test under s 5D(1)(a), for keeping factual causation separate from scope of liability, and for "might have made a difference" not being enough — including under s 5D(2).
    verify: false
  - slug: strong-v-woolworths-ltd-tas-big-w
    name: Strong v Woolworths Ltd t/as Big W
    citation: (2012) 246 CLR 182
    aglc: Strong v Woolworths Ltd t/as Big W (2012) 246 CLR 182
    facts: Ms Strong, who walks with the aid of crutches because of a disability, slipped outside the entrance to a Big W store and suffered a spinal injury when her crutch slid on a greasy potato chip. Woolworths, trading as Big W, had no system to inspect and clean the area where she fell. The District Court found Woolworths negligent; the Court of Appeal reversed that finding.
    issue: Whether Woolworths' failure to have an inspection and cleaning system was a necessary condition of Ms Strong's fall (CLA s 5D(1)(a)), proved on the balance of probabilities (s 5E), when no one knew when the chip had been dropped.
    held: 'Woolworths'' negligence lay in its failure to employ a system for the periodic inspection and cleaning of the area (duty: occupier/entrant; an appropriate system = inspection and removal of slipping hazards at intervals of not greater than 20 minutes). ''The probabilities favoured the conclusion that the chip was deposited in the longer period between 8.00am and 12.10pm and not the shorter period between 12.10pm and the time of the fall'' [38], so causation was established.'
    ratio: 'Section 5D(1)(a) ''is a statutory statement of the "but for" test of causation'': the defendant''s negligence must be a necessary condition of the occurrence of the harm, decided on the balance of probabilities (s 5E).'
    significance: Clarifies s 5D(1) and (2) and s 5E, and shows factual causation proved by inference about when a hazard arose.
    why-here: Cite for s 5D(1)(a) as the statutory 'but for' test and for proving causation on the balance of probabilities when the timing of the hazard is unknown.
    verify: false
