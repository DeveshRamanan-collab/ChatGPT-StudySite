  - key: q026
    type: mcq
    concept: factual-causation-necessary-condition
    difficulty: 2
    stem: Where factual causation depends on what the injured person would have done had the defendant not been negligent, how does s 5D(3)(a) say that is decided?
    options:
      - text: Subjectively, in the light of all relevant circumstances
        correct: true
        why: 'Correct — s 5D(3)(a): the matter is to be determined subjectively in the light of all relevant circumstances, subject to the evidence rule in paragraph (b).'
      - text: Objectively, by what a reasonable person would have done
        why: Tempting because many negligence tests are objective, but s 5D(3)(a) expressly says the question is decided subjectively — what this person would have done.
      - text: By the plaintiff's own later statement, which is conclusive
        why: Wrong — s 5D(3)(b) makes the plaintiff's statements after the harm about what they would have done inadmissible, except so far as they are against their interest.
      - text: By the defendant proving what the plaintiff would have done
        why: Wrong — s 5D(3) does not put it that way; it says the matter is determined subjectively, in the light of all relevant circumstances.
  - key: q027
    type: mcq
    concept: factual-causation-necessary-condition
    difficulty: 3
    stem: 'After her injury, Tess tells the court: ''If there had been a warning sign, I would definitely have walked around the spill.'' Under s 5D(3)(b), how is that statement treated?'
    options:
      - text: 'Inadmissible: it was made after the harm and is not against her interest'
        correct: true
        why: 'Correct — s 5D(3)(b): a statement made after suffering the harm about what she would have done is inadmissible except so far as it is against her interest; this one helps her.'
      - text: Admissible and decisive, because s 5D(3) asks what this plaintiff would have done
        why: Tempting because s 5D(3)(a) is subjective, but paragraph (a) is expressly subject to (b), which excludes self-serving statements made after the harm.
      - text: Admissible, but only if a reasonable person would also have walked around the spill
        why: Wrong — s 5D(3) has no reasonable-person qualification; the test is subjective, and the statement is excluded by (b) because it is not against her interest.
  - key: q028
    type: mcq
    concept: factual-causation-necessary-condition
    difficulty: 3
    variant-of: q027
    stem: 'After his injury, Sam tells the court: ''Honestly, even with a warning sign I would not have bothered to read it.'' Under s 5D(3)(b), is the statement admissible?'
    options:
