  - key: q066
    type: short
    concept: multiple-sufficient-causes-and-material-contribution
    difficulty: 4
    cases:
      - bonnington-castings-v-wardlaw
      - march-v-stramare
    prompt: Mai develops a respiratory illness from dust at work. Some of the dust came from a grinder her employer, in clear breach of duty, failed to fit with an extractor; the rest came from sources for which no one is at fault. Experts agree the illness resulted from the cumulative dust, but cannot say how much each source contributed. Identify the kind of causation problem on the textbook flowchart and advise how factual causation might be established.
    model: |-
      The issue is factual causation. Under CLA s 5D(1)(a), Mai must show the negligence was a necessary condition of her illness. She cannot: no one can say how much the grinder contributed, so the test yields an unsatisfactory result.

      On the flowchart this is a multiple sufficient causes case: "the cumulative operation of factors in the occurrence of the total harm in circumstances in which the contribution of each factor to that harm is unascertainable". The flowchart's examples are Bonnington Castings v Wardlaw and March v Stramare. It is not material contribution in the flowchart's sense: the experts agree the cumulative dust caused it; what cannot be done is separating the shares.

      The route is s 5D(2): in an exceptional case (the flowchart says appropriate case), the court may accept negligence that cannot be established as a necessary condition as establishing factual causation. There must also be a clear breach (given) and an evidentiary gap (the unascertainable shares). The court then considers whether and why responsibility should be imposed on the employer. Conclusion: Mai's best argument is s 5D(2); if it succeeds, scope of liability follows.
    rubric:
      - id: r1
        criterion: Identifies the factual causation problem
        marks: 2
        top-band: Explains why the s 5D(1)(a) necessary condition test cannot be met on these facts.
        margin-note: Say why the ordinary test fails.
        authorities:
          - civil-liability-act-2002-nsw-s5d
      - id: r2
        criterion: Classifies the case
        marks: 3
        top-band: Uses the flowchart's description of multiple sufficient causes and distinguishes material contribution, citing the flowchart's cases.
        margin-note: Classification is the point of the question.
        authorities: []
      - id: r3
        criterion: 'Law: s 5D(2) requirements'
        marks: 3
        top-band: Exceptional (NSW) / appropriate (flowchart) case, clear breach, evidentiary gap, responsibility question.
        margin-note: All the s 5D(2) parts, not just the label.
        authorities:
          - civil-liability-act-2002-nsw-s5d
      - id: r4
        criterion: Conclusion
        marks: 2
        top-band: Concludes on the best route and flags scope of liability as the next step.
        margin-note: Finish the causation analysis.
        authorities: []
  - key: q067
    type: mcq
    concept: scope-of-liability-element
    difficulty: 1
    stem: How does s 5D(1)(b) of the CLA (NSW) state the scope of liability element?
    options:
      - text: That it is appropriate for the scope of the negligent person's liability to extend to the harm so caused
        correct: true
        why: Correct — these are the words of s 5D(1)(b), which the Act labels "scope of liability".
      - text: That the negligence was a necessary condition of the occurrence of the harm (factual causation)
        why: Tempting because it is the neighbouring paragraph, but this is s 5D(1)(a), the factual causation element, not scope of liability.
      - text: That the risk of harm was not insignificant and that a reasonable person would have taken precautions
        why: Wrong — this echoes s 5B(1)(b) and (c), which deal with breach (when a person is negligent), not with the scope of liability for harm caused.
      - text: That the negligent person knew or ought to have known of the risk of the harm
        why: Wrong — this echoes s 5B(1)(a), foreseeability of the risk for breach; s 5D(1)(b) asks whether liability should extend to the harm so caused.
  - key: q068
    type: mcq
    concept: scope-of-liability-element
    difficulty: 2
    stem: What does s 5D(4) direct the court to consider when determining the scope of liability?
    options:
      - text: Whether or not and why responsibility for the harm should be imposed on the negligent party
        correct: true
        why: 'Correct — s 5D(4): for the purpose of determining the scope of liability, the court is to consider (amongst other relevant things) whether or not and why responsibility should be imposed.'
      - text: Only whether the harm was of a kind that the negligent party could reasonably have foreseen
        why: Tempting because foreseeability is familiar, but s 5D(4) names the responsibility question, and its 'amongst other relevant things' rules out 'only' anything.
      - text: What the injured person would have done had the negligent party not been negligent
        why: Wrong — that is the s 5D(3) question, which belongs to factual causation, not to scope of liability.
  - key: q069
    type: mcq
    concept: scope-of-liability-element
    difficulty: 2
    stem: In a NSW problem you have shown that the defendant's negligence was a necessary condition of the plaintiff's harm. What does the second element of s 5D(1) require you to address next?
    options:
      - text: 'Scope of liability: new intervening acts and remoteness, with the s 5D(4) question'
        correct: true
        why: Correct — s 5D(1)(b) is the second element, and the flowchart divides it into new intervening acts and remoteness; s 5D(4) frames the court's approach.
      - text: Whether the case is exceptional under s 5D(2), so that factual causation can be accepted
        why: Tempting because s 5D(2) is in the same section, but it is only for negligence that cannot be established as a necessary condition; here it has been.
      - text: Whether the plaintiff's own later statement confirms what they would have done
        why: Wrong — that is a s 5D(3) evidence point within factual causation, which is already established; the next element is scope of liability.
